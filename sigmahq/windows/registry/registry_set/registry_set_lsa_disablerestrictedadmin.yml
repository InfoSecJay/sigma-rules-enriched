note: |
  ### Technical Context

  This rule detects changes to the `DisableRestrictedAdmin` registry value, which is part of the Windows security settings that control the use of Remote Desktop Protocol (RDP) and the transmission of credentials. By enabling or disabling this setting, an attacker may attempt to facilitate credential theft by bypassing protections against sending credentials to potentially compromised remote machines. This behavior aligns with the MITRE ATT&CK tactic "Persistence" and the technique "Modify Registry" (T1112).

  The primary telemetry sources required for this detection are Windows Registry change logs, specifically those related to registry modifications. If the malicious behavior is confirmed, it can lead to unauthorized access to systems and potential lateral movement within the network. However, this detection does NOT confirm that an attack has occurred; it only indicates a change in a security setting that could be malicious.

  ### Investigation Steps

  - **Check Registry Change History**: Review the Windows Registry change logs for Event ID 4657, specifically for the path `System\CurrentControlSet\Control\Lsa\DisableRestrictedAdmin`. Confirm if changes were made recently. Typical benign changes may occur during system updates or administrative actions.

  - **Identify Process Owner**: Use Sysmon Event ID 13 on the host to identify which process modified the registry value. Analyze the process owner; look for processes owned by `SYSTEM` or administrative users, which could indicate legitimate activity, whereas unexpected user accounts suggest potential tampering.

  - **Review User Account Activity**: Examine Security Event ID 4624 for logon events before and after the registry change. A sudden logon from a non-administrative account immediately before the registry change could indicate unauthorized access or compromise.

  - **Cross-check Authorized Configuration Changes**: Validate against documented system administration activities to identify if the changes to the `DisableRestrictedAdmin` value were approved. This can highlight legitimate admin actions versus potential malicious modifications.

  - **Assess Related Remote Desktop Activity**: Look at remote access logs (Event ID 4776) to identify successful or failed RDP connection attempts surrounding the time of the registry change. Legitimate RDP sessions may confirm expected activity; anomalous sources or outcomes could indicate malicious intent.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on credential security and the ease with which attackers can exploit modifications to RDP configurations. The likelihood of malicious abuse is significant, especially in environments where Remote Desktop is heavily utilized, which makes the behavior well-suited for exploitation in targeted attacks.

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for attackers to modify the registry without generating observable logs, particularly if they have elevated privileges. Reliable detection requires proper log collection configurations for registry changes. Legitimate administrative activities, such as configuration changes during system maintenance, could trigger this alert. A companion detection on process creation (Event ID 4688) could enhance coverage by correlating registry changes with suspicious executable launches, identifying the point of entry or exploitation method.

