note: |
  ### Technical Context

  This rule detects changes to the "DisableRestrictedAdmin" registry value, which controls the ability to use Remote Desktop with potentially reusable credentials. Attackers may alter this setting to disable RestrictedAdmin mode, allowing for credential theft during remote access, especially if the target system is compromised. This behavior aligns with the MITRE ATT&CK technique T1112 (Modification of Registry).

  The primary telemetry sources include Windows registry change logs, specifically capturing events related to registry modifications. If malicious, this behavior could lead to unauthorized access and credential exploitation. It's important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative activities may trigger this alert.

  ### Investigation Steps

  - **Review the corresponding registry change:** Examine the registry path `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\DisableRestrictedAdmin`. Look for the value change indicating it has been set to `0`, which enables the allowability of Remote Desktop connections with reusable credentials.

  - **Check for process creation events:** Look at Security Event ID 4688 logs for processes that include `reg.exe`, `powershell.exe`, or `cmd.exe`, which may indicate the registry was modified via command line. Confirm that these commands correlate with logged administrative actions.

  - **Identify system role and environment context:** Determine whether the affected system is a server or a standard workstation. Servers are at a higher risk if accessed remotely, particularly in environments handling sensitive data.

  - **Correlate with legitimate administrative activities:** Check if the change occurred during scheduled maintenance or typical administrative tasks, referencing change logs or ServiceNow tickets in your ITSM tool.

  - **Verify malicious indicators:** Look for recent logins using RDP to systems with the modified registry value. Malicious activity may include unusual remote sessions, especially from unknown IPs or during non-business hours.

  - **Investigate related detections:** Assess alerts from companion detection rules such as process creation events that may show additional behavior indicating lateral movement or unauthorized access attempts (related rule ID: 28ac00d6-22d9-4a3c-927f-bbd770104573).

  ### Prioritization

  This alert is of high severity in an enterprise context, particularly if it triggers on critical servers or systems exposed to the internet. The likelihood of exploitation is significant, as disabling RestrictedAdmin mode directly impacts credential security. This behavior aligns with common tactics used by threat actors during remote access attempts.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not comprehensively enabled for registry changes. Legitimate activities such as IT maintenance or privilege assignments could trigger this alert, necessitating contextual awareness. Consider companion alerts such as process creation and RDP login events, which can help identify whether the behavior is part of a larger malicious workflow.

