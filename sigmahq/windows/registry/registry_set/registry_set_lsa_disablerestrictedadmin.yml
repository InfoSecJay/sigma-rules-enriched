note: |
  ### Technical Context
  This rule detects unauthorized changes to the "DisableRestrictedAdmin" registry value on Windows systems, which controls the use of RestrictedAdmin mode during Remote Desktop Protocol (RDP) sessions. By tampering with this registry setting, an attacker may enable or disable a security feature designed to prevent the transmission of reusable credentials. In scenarios where attackers gain initial access to a system, they often seek to exploit RDP to establish persistence and subsequently harvest credentials that can be used for lateral movement within an enterprise network.

  The likely attacker objectives include evading defenses, maintaining persistence, and capturing valid user credentials. The tampering of the RestrictedAdmin mode registry often aligns with the tactics of credential access and defense evasion. This detection relates specifically to MITRE ATT&CK techniques for [T1112: Modify Registry](https://attack.mitre.org/techniques/T1112/) under the defense evasion category, indicating the adversary's goal to manipulate system configurations for their benefit.

  The primary data sources for this detection rule are Windows registry logs that capture any alterations made to critical system configurations, particularly for remote access services.

  ### Investigation Steps
  - **Review Registry Change Logs**: Examine registry logs for entries related to modifications of the "DisableRestrictedAdmin" value to determine if the changes were made legitimately or indicate potential sabotage.
  - **Analyze RDP Connection Histories**: Investigate RDP logs for recent connections, focusing on unusual access patterns or connections from unexpected external IP addresses that may reveal unsuccessful or successful exploitation attempts.
  - **Correlate with User Activity**: Cross-match the timing of the registry changes with user activity logs to identify if any legitimate administrative actions correlate or if they occurred during off-hours or unusual times.
  - **Inspect for Additional Indicators**: Gather and analyze endpoint telemetry, such as process execution logs, to identify processes that may be indicative of exploitation attempts targeting RDP sessions or related administrative activities.

  ### Prioritization
  This alert has a high severity rating due to the potential for significant impact; tampering with the RestrictedAdmin mode can expose credentials that enable lateral movement and further compromise within the network. The risk of unauthorized access via RDP is a critical concern in enterprise environments.

  ### Blind Spots and Assumptions
  The detection logic assumes that all modifications to the registry value will be captured and logged, which may not occur if logging is improperly configured or disabled. Additionally, the rule may not cover instances where attackers use methods other than direct registry manipulation to alter RDP configurations, such as through Group Policies or other management tools. Required logging configurations include proper capture of registry changes to ensure authenticity and accuracy of the alerts generated.

