note: |
  ### Technical Context

  This rule detects modifications to the "DisableRestrictedAdmin" registry value, a setting that controls RestrictedAdmin mode for Remote Desktop connections. By toggling this registry key, an attacker can enable or disable the protection against credential theft during RDP sessions, thereby facilitating easier access to sensitive systems. The likely attacker objective is to exploit Remote Desktop Protocol (RDP) for unauthorized access, particularly in environments where credentials can be captured by an adversary.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), and the technique is **T1112 - Modify Registry**. The primary telemetry source for this detection is Windows registry change logs, specifically registry set events. The security impact of this change is significant, potentially allowing attackers to capture credentials and gain unauthorized access to sensitive systems. Note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to prove an attack has taken place.

  ### Investigation Steps

  - **Confirm Registry Change Activity**: Check for Security Event ID 4657 or Sysmon Event ID 13 (Registry modifications) to validate that the "DisableRestrictedAdmin" value was changed. Look for a change made by non-administrative accounts during off-hours.

  - **Investigate User Account Behavior**: Cross-reference user activity with Event ID 4624 (Logon) and Event ID 4625 (Logon Failure) for accounts that demonstrate unusual logon patterns, especially logons from remote locations or unfamiliar IP addresses.

  - **Identify Malicious Timing**: Assess the timing of the registry modification against known attack patterns. Frequent changes during off-hours or just before a successful RDP connection can indicate malicious intent.

  - **Review RDP Configuration**: Determine if RDP is enabled on the host by checking for Event ID 338 at the local security policy level. Ensure that RDP settings are compliant with enterprise security policies.

  - **Evaluate Expected Behavior**: Identify any legitimate reasons for the registry change. For example, if the change coincides with routine maintenance or updates by IT staff, this may not indicate malicious intent.

  - **Cross-Reference with Companion Alerts**: Investigate for related alerts such as those involving abnormal process creation (similar Sigma rule ID 28ac00d6-22d9-4a3c-927f-bbd770104573) that could indicate an elevated privilege process attempting to exploit Remote Desktop.

  ### Prioritization

  This alert carries high severity due to the potential risk of credential harvesting and unauthorized access to critical systems. The ability to toggle secure settings in RDP commonly aligns with malicious behavior, particularly in enterprise environments where RDP is frequently targeted by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not properly configured to capture all registry changes, or if legitimate administrative actions routinely modify this key. Some legitimate applications or system updates may trigger this alert. Companion detections like process creation rules enhance visibility into the actor's behavior surrounding the registry change and should be monitored in conjunction to strengthen overall coverage.

