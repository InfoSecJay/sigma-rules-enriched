  ### Technical Context
  This detection rule identifies unauthorized modifications to the Windows registry key `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute`, which is often exploited for COM object hijacking. This type of attack can enable adversaries to execute malicious code under the context of a legitimate application, thereby bypassing security mechanisms like User Account Control (UAC). This behavior typically indicates an attempt to maintain persistence, escalate privileges, or evade detection by altering application commands.

  The likely attacker objective is to gain enhanced access to the system, often facilitating further exploitation or lateral movement within the network. By hijacking COM objects, attackers can manipulate the behavior of trusted applications, potentially leading to data exfiltration or infrastructure compromise. Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1546)**: Exploiting the COM objects for persistent malicious actions.
  - **Defense Evasion (T1548)**: Bypassing security mechanisms by utilizing legitimate functionalities.
  - **Privilege Escalation (T1546)**: Achieving higher privileges through manipulated command execution.

  Primary data sources for successful detection include Windows registry logs capturing changes to relevant keys, as well as endpoint data acknowledging process creation and command-line parameters that may reflect the usage of hijacked COM objects.

  ### Investigation Steps
  - **Review Registry Changes:** Check for suspicious modifications to the `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute` registry key. Focus on recent changes that are not documented as part of administrative activities.
  - **Analyze Process Creation Events:** Investigate process creation logs around the time of the registry change to identify any unusual execution of applications that might involve COM objects.
  - **Inspect Command-Line Parameters:** Examine command-line parameters associated with newly created or modified processes for indicators of unusual behavior or execution of malicious payloads.
  - **Verify User Activity:** Correlate the registry changes with the account activity logs to determine if the changes were made by unexpected users or during unusual hours.

  ### Prioritization
  This alert holds a high severity due to its potential for enabling significant security breaches in an enterprise environment. The ability to manipulate COM objects for privilege escalation can lead directly to greater access within the network, thereby increasing the impact and likelihood of further exploitation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the lack of baseline monitoring for legitimate administrative changes, which could result in false positives. The detection logic assumes that any modification to the targeted registry key is malicious; however, there might be legitimate reasons for such changes during administrative activities. Required logs for effective detection must include detailed Windows registry auditing, as well as process creation and command-line invocation logs that comprehensively capture operational activities on Windows systems.

