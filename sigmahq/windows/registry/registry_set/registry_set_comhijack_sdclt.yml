  ### Technical Context

  This rule detects modifications to the Windows Registry at the path `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute`, which can indicate an attempt to hijack COM objects, often used to bypass User Account Control (UAC). The likely attacker objective is to escalate privileges by executing malicious code under the context of a trusted system process.

  This behavior aligns with multiple MITRE ATT&CK tactics and techniques, particularly Persistence (T1546), Defense Evasion (T1548), and Privilege Escalation (T1546). The primary telemetry source for this detection is Windows Registry logs, specifically actions related to registry modifications. If malicious, successful exploitation can lead to unauthorized access and control over the affected system.

  This detection does NOT confirm that a compromise has occurred on its own—further investigation is required to establish the intent and outcome of the registry change.

  ---

  ### Investigation Steps

  - **Examine Registry Changes:**
    Inspect the modification to `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute` using Registry Event Logs (Event ID 4657). Note the user, timestamp, and previous values.

  - **Identify User Context:**
    Check the user account responsible for the change. If the modification was made by a non-privileged user, it may indicate suspicious activity. Confirm using Security Event Logs (Event ID 4688) for process creation logs relating to `reg.exe`.

  - **Look for Related Malicious Indicators:**
    Search for unusual processes that executed alongside this registry change. Review the process creation events and network outbound connections for `cmd.exe`, `powershell.exe`, or other scripting engines (Sysmon Event ID 1).

  - **Assess Legitimate Activity:**
    Verify if the modification aligns with known software installations or updates. Legitimate applications may modify this key during installation. Document any such known instances.

  - **Check for Known Vulnerabilities:**
    Cross-reference the registry changes with known CVEs or exploitation techniques listed in security databases, particularly those mentioned in associated references.

  - **Review Process Chain:**
    Validate whether the process linked to the modification executed any unexpected commands. Check PowerShell or command line arguments for potentially malicious flags (e.g., `-ExecutionPolicy Bypass`).

  ---

  ### Prioritization

  This alert is of high severity due to the potential to escalate privileges on sensitive systems. The likelihood of malicious abuse is significant, as the hijacking of COM objects is a known technique among adversaries for executing code with elevated permissions. Such modifications can serve as precursors to broader attacks.

  ---

  ### Blind Spots and Assumptions

  There is a detection limitation, as legitimate applications can modify the targeted registry key during regular operations. Required log sources include complete registry and process creation logs for reliable detection. Additionally, benign scripting solutions may trigger similar alerts, indicating a need to validate each case cautiouly. A relevant companion detection is monitoring Windows process creation (Event ID 4688), which can provide contextual insights into suspicious activity linked to registry modifications.

