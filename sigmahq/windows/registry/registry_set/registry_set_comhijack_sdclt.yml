  ### Technical Context

  This Sigma rule detects changes to the Windows Registry key associated with COM hijacking, specifically targeting the `DelegateExecute` property under `HKCU\Software\Classes\Folder\shell\open\command`. This behavior is indicative of an attacker attempting to manipulate the execution context of legitimate applications or processes to bypass User Account Control (UAC) for escalated privileges. The likely adversary objective is gaining unauthorized access and control over the system, allowing for further exploitation or persistence.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1546)** and **Privilege Escalation (T1548)**, as these changes can enable malicious payloads to run with elevated privileges without user consent. The primary telemetry sources include Windows Registry logs, specifically focusing on Registry key modification events. If malicious, this behavior can lead to a complete compromise of the targeted host. It is important to note that this detection alone does not confirm malicious intent, as benign applications may also modify this key under certain circumstances.

  ### Investigation Steps

  - **Examine Registry Changes:** Review the Registry change for the key `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute`. Look for unusual values or commands, especially those pointing to non-standard executables or scripts that could indicate malicious intent.

  - **Cross-reference User Actions:** Check for recent user activity in Security Event ID 4624 (Logon) or process creation events (Event ID 4688). Ensure that the user context making the change corresponds to expected behaviors (e.g., administrative logins vs. standard users).

  - **Validated Process Execution:** Look for processes initiated by `sdclt.exe` (Windows Backup) in the Sysmon Event ID 1 logs. Compare the command-line arguments for anomalies that deviate from normal operation, such as unusual parameters or paths.

  - **Identify Synthetic Indicators:** Analyze the command lines associated with newly spawned processes that reference `DelegateExecute`. Malicious entries often contain uncommon or obfuscated commands leading to suspicious executables or scripts.

  - **Review Asset Impact:** Depending on the host role (e.g., domain controllers, workstations), ascertain the criticality of the affected machine. Elevated privileges on sensitive systems warrant immediate escalation procedures.

  ### Prioritization

  This alert represents a high severity due to the potential system compromise it indicates. The likelihood of malicious abuse is significant, as this technique is commonly weaponized by persistent threat actors seeking to elevate privileges. Systems in critical roles should be prioritized for investigation immediately.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate software updates or configurations could also modify the `DelegateExecute` key. Ensure comprehensive logging of Registry changes is enabled for accurate detection. User actions involving legitimate applications like Windows Backup, which may trigger this alert, need careful review to avoid false positives. A related detection could include monitoring for unusual process executions involving trusted executables to strengthen the alert's context and coverage.

