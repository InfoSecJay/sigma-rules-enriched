  ### Technical Context

  This rule detects unauthorized modifications to the Windows Registry key located at `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute`, which is often targeted by adversaries to bypass User Account Control (UAC) and escalate privileges. The likely attacker objective includes maintaining persistence and evading defenses during initial access or lateral movement within a system. This behavior corresponds to MITRE ATT&CK techniques such as Persistence (T1546) and Privilege Escalation (T1548).

  The primary telemetry source is Windows Registry logs, specifically monitoring changes to user-specific registry keys. If this detection is confirmed to be malicious, it could indicate that an adversary is attempting to execute unauthorized actions with elevated privileges. However, this detection does NOT, on its own, prove that a compromise has occurred; further analysis is necessary to understand the context and intent behind the registry modification.

  ---

  ### Investigation Steps

  - **Examine Registry Changes**: Retrieve the registry change history related to `HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute` using Event ID 4657 (Registry value modified). Look for recent modifications that correspond to the alert. Legitimate application installations may also modify this key but often do so with a valid signed installer.

  - **Check For Associated Process Creation**: Review Windows Security Event ID 4688 (Process Creation) to identify processes that attempted to run shortly after the registry modification. Malware often exhibits unusual parent-child process relationships, such as a less privileged application spawning a system utility or command prompt.

  - **Analyze User Context of Changes**: Identify which user account made the registry change by cross-referencing with Event ID 4657 logs. Look for administrative or service accounts that may not correspond to standard user behavior. Legitimate user activity typically involves domain or local admin actions tied to known application updates.

  - **Correlate with Recent System Events**: Review Application and System logs for unusual events occurring around the same time as the registry changes. Look for signs of failed logins, unexpected reboots, or service disruptions (Event IDs 4625, 6008) that could indicate an ongoing attack or malware presence.

  - **Identify Potential Malware**: Use endpoint detection tools to scan the system for known indicators of compromise (IOCs) related to privilege escalation tools or scripts that might exploit UAC bypass methods. Known malicious artifacts may include executable files or scripts with unusual names or locations.

  - **Document Backups of the Registry**: Confirm that legitimate backups of the registry exist prior to the modification, which can be done via Volume Shadow Copies or other backup solutions. This helps to ensure there is a restore point available in case of malicious changes.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on privileged access and the likelihood of malicious intent in modifying security-sensitive system components. Given that this behavior is commonly weaponized in privilege escalation attacks, particular attention should be given, especially on critical systems or accounts with elevated privileges.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging on registry changes or potential use of direct registry editing tools that circumvent standard auditing. Additionally, legitimate software updates or custom applications may also affect this registry key, triggering the alert. Companion detections such as monitoring for known UAC bypass tools' execution (e.g., Event ID 4688 for command-line usage) strengthen coverage of this attack vector.

