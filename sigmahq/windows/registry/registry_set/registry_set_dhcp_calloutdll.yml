note: |
  ### Technical Context
  This detection rule identifies the installation of a Callout DLL in the DHCP server's registry settings, specifically monitoring the `CalloutDlls` and `CalloutEnabled` parameters. This technique is often exploited by attackers to inject malicious code that can execute within the context of the DHCP server, potentially leading to unauthorized network access or other adverse actions. Once a Callout DLL is enabled, an attacker can manipulate DHCP requests and responses, which can facilitate further attacks such as man-in-the-middle scenarios or local network reconnaissance.

  The relevant MITRE ATT&CK tactics for this detection include **Privilege Escalation (T1068)**, where attackers may seek to elevate their privileges by leveraging the DHCP server functionality, and **Defense Evasion (T1574.001)**, where the use of Callout DLLs serves to evade detection by traditional security mechanisms. Other applicable tactics include **Persistence (T1112)**, as the installation of a Callout DLL allows an attacker to maintain a foothold in the environment after an initial compromise.

  Primary data sources to monitor for this type of activity include Windows registry change logs, specifically focusing on the DHCP server settings within the registry. This will help identify any unauthorized modifications that could indicate malicious behavior.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows registry for modifications to the `CalloutDlls` and `CalloutEnabled` values under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DHCPServer\Parameters`. Look for any unexpected entries or values that deviate from the baseline.

  - **Analyze DHCP Server Logs**: Investigate DHCP server logs for abnormal DHCP activity or unusual client requests that could point to tampering or exploitation attempts related to callout DLLs.

  - **Inspect Network Traffic**: Monitor network traffic for any anomalies or unauthorized DHCP requests/responses. Pay close attention to traffic that could suggest manipulation of DHCP offers or acknowledgments.

  - **Correlate with Other Alerts**: Cross-reference findings with other security alerts for signs of compromise, such as suspicious process creation events or unauthorized access attempts, to build a comprehensive picture of the security incident.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of DLL injection on a critical system service like the DHCP server. The ability for an attacker to control DHCP responses can lead to severe network compromises and unauthorized access, making timely detection and response essential.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is that it may not catch actions performed via alternative means or legitimate administrative activities not logged in the expected manner. The detection assumes that logging for registry changes is properly configured and that logs are being collected and retained effectively. If registry auditing is not enabled or if there are no logs available for review, this rule may not function correctly.

