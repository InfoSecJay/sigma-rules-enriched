note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry that indicate the installation of a Callout DLL for the DHCP server, specifically changes to the `CalloutDlls` and `CalloutEnabled` parameters. Attackers may exploit this to execute arbitrary code within the context of the DHCP service, allowing for privilege escalation or persistence in a network environment. This behavior is categorized under the MITRE ATT&CK framework as **Privilege Escalation (T1574.001)**, and **Defense Evasion (T1112)**.

  The primary telemetry source for this rule is the Windows Registry, specifically monitoring changes to the specified path under DHCP parameters. If these modifications are made with malicious intent, they could lead to unauthorized access or control over DHCP traffic. It is important to note that this detection does NOT confirm malicious activity by itself; legitimate software configurations may trigger similar registry changes.

  ### Investigation Steps

  - **Retrieve relevant registry changes:** Review Windows Registry events that correspond to Event ID 4657 (Registry Value Modified) for the paths `\Services\DHCPServer\Parameters\CalloutDlls` and `\Services\DHCPServer\Parameters\CalloutEnabled` to identify which process made the changes.

  - **Analyze user and process context:** Identify the user and process responsible for the registry modification. Cross-reference this information with Event ID 4688 (Process Creation) to evaluate if it was initiated by a known, trusted application or account.

  - **Check DHCP server's behavior:** Verify expected configurations within the DHCP server. Legitimate configurations typically do not modify the `CalloutDlls` parameter. Document any official change procedures followed.

  - **Identify malicious indicators:** Look for known malicious DLL names or hash values in the registry changes that align with documented malicious use cases related to DHCP server exploitation. This can be corroborated with threat intelligence feeds.

  - **Cross-reference with system logs:** Review associated logs in the DHCP server to see if unusual or unauthorized DHCP requests were processed at the same time the registry changes occurred. Analyze Event ID 107 for DHCP server events that may indicate unauthorized access.

  ### Prioritization

  This alert is of high severity due to the critical role of the DHCP server in network functionality and its potential abuse for gaining unauthorized access to the network. The likelihood of weaponization is high, as altering DHCP settings is a known technique for facilitating larger-scale network attacks.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative actions might also result in registry changes, leading to potential false positives. Additionally, if logging for the Windows Registry is not properly configured, relevant changes may go undetected. It is important to monitor for companion detections such as unusual DHCP traffic patterns or high-volume requests that might further indicate a compromised DHCP server.

