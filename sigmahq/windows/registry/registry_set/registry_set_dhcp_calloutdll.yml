note: |
  ### Technical Context

  This rule detects registry modifications pertaining to DHCP Callout DLLs, specifically changes to the `CalloutDlls` and `CalloutEnabled` parameters. Such changes can be utilized by an attacker to execute arbitrary code within the security context of the DHCP server, thereby enabling persistence or privilege escalation. The likely objective is to gain control over network operations or facilitate lateral movement.

  The relevant MITRE ATT&CK tactics are Privilege Escalation (T1068) and Persistence (T1574.001). Primary telemetry sources include Windows Registry logs where modifications to these specific registry keys are logged. If malicious, the impact could lead to unauthorized control over network services and potential compromise of sensitive systems. It is important to note that this detection does NOT confirm successful code execution or malicious intent on its own.

  ### Investigation Steps

  - **Review registry modifications:** Examine the creation or modification of registry keys at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DHCPServer\Parameters\`. Check for the `CalloutDlls` value and ensure it does not point to untrusted or unauthorized DLLs. Logging can be validated through Event ID 4657 (Registry value modified).

  - **Identify recent system changes:** Analyze Windows Event ID 7045 logs for any new DHCP server service installation or modifications. Look for changes made around the same time as the registry modification; namely, a new service entry with unusual DLL paths.

  - **Check for service restart triggers:** Review System Event ID 7036 to verify whether the DHCP Server service was restarted soon after the registry modification. A legitimate restart should occur during maintenance periods; any unexpected restarts warrant closer scrutiny.

  - **Correlation with other indicators:** Look for other potential signs of compromise in Event IDs 4688 and 4689 (process creation and termination) to identify new or unusual processes associated with the DHCP service that may correlate with malicious activity.

  - **Baseline normal behavior:** Assess the normal operational configuration of DHCP servers in your environment. Legitimate changes would typically only be made during authorized updates or patches by IT personnel.

  ### Prioritization

  This alert has a high severity rating due to its potential impact on network services and the likelihood of malicious exploitation techniques being employed. The ability to manipulate DHCP functionalities represents a significant risk to the network’s integrity and security posture, as such tactics are commonly weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited if registry logs are not captured or if the DHCP service is not monitored closely. Legitimate administrative activities, such as authorized configuration changes, can trigger this alert. It's also important to track related detections such as unauthorized process executions in DHCP contexts, which can provide additional context to correlate with the registry modification findings.

