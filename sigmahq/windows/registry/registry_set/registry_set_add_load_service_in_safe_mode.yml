note: |
  ### Technical Context
  This detection rule identifies modifications to the Windows registry that enable a driver or service to persist in Safe Mode. It focuses on the creation or alteration of registry keys under `\Control\SafeBoot\Minimal\` or `\Control\SafeBoot\Network\`, which are critical for ensuring that malicious components can load even when the operating system is running in a minimal state. Such behavior is indicative of attempts to maintain persistence on a compromised system.

  In threat scenarios, an attacker might leverage this technique to ensure their malicious service or driver is always loaded, regardless of whether the system is started normally or in Safe Mode, effectively bypassing security measures and traditional responses. By employing this method, the attacker aims to establish a foothold within the system that can survive reboots or system recoveries.

  This detection aligns with the MITRE ATT&CK framework, specifically tactic **Defense Evasion** and technique **T1112: Modify Registry**, which encompasses modifying registry keys to ensure that malicious services load under various conditions. The primary data sources for these detections will be registry set logs from Windows, allowing for monitoring of changes made to key persistence locations.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent registry modifications related to `\Control\SafeBoot\Minimal\` and `\Control\SafeBoot\Network\` to identify any unauthorized changes that indicate persistence mechanisms.

  - **Analyze Service Information:** Cross-reference the services listed in the registry modifications with known good services to determine if any have been added or modified by unauthorized users.

  - **Correlate With EDR Logs:** Check EDR logs for any process execution of legitimate-looking programs such as `msiexec.exe` or `MBAMInstallerService.exe` around the time of the registry change to identify potential evasion tactics.

  - **Assess System Behavior:** Evaluate the system's behavior and performance, including any unusual network activity or service behavior that could indicate exploitation or further compromise attempts.

  ### Prioritization
  This alert is categorized as high severity due to the serious implications of a potential attacker establishing persistence mechanisms in Safe Mode, which can undermine the integrity of the system and hinder detection and remediation efforts. The technique indicates that an adversary may have a foothold, necessitating immediate investigation and response.

  ### Blind Spots and Assumptions
  There are several gaps in coverage, including potential evasion methods that could be used to modify the registry without triggering alerts, such as using legitimate tools or system processes. The detection assumes that the relevant logging is enabled and configured correctly; if certain registry events or service events are not being captured, the rule may miss critical activity. Furthermore, the presence of known legitimate services in the registry may lead to false positives if not properly contextualized, highlighting the need for a robust incident response process to evaluate alerts effectively.

