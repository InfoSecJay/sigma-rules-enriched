note: |
  ### Technical Context

  This rule detects modifications to the Windows registry aimed at allowing a driver or service to be loaded during Safe Mode using the `\Control\SafeBoot\Minimal\` or `\Control\SafeBoot\Network\` paths. Attackers might employ this technique to maintain persistence even under a minimal startup environment, enabling them to execute malicious payloads or maintain control over compromised systems. This behavior aligns with the MITRE ATT&CK technique T1564.001: “Service Registry Permissions Weakness.”

  The primary telemetry source for this detection is Windows registry event logs, specifically focusing on changes to registry paths associated with Safe Mode service persistence. If malicious, this could lead to situations where attackers bypass defenses and establish long-lasting footholds in the environment. Importantly, this detection does not confirm malicious intent on its own, as legitimate applications may also modify these registry keys.

  ### Investigation Steps

  - **Review registry changes:** Examine Windows Registry Event ID 4657 logs for changes to `HKEY_LOCAL_MACHINE\ControlSet001\Control\SafeBoot\Minimal\` and `HKEY_LOCAL_MACHINE\ControlSet001\Control\SafeBoot\Network\` for timestamps and context of the modification.

  - **Identify process origin:** Check for the originating process of the registry change by reviewing Security Event ID 4688 logs. Look for processes like `msiexec.exe`, `MBAMInstallerService.exe`, or `%Path%\HexnodeAgent.exe` to see if they match expected behaviors for legitimate applications.

  - **Compare against known services:** Validate modifications against existing services on the system by referencing the `Services` management console (`services.msc`). Ensure that no unauthorized services are set to start in Safe Mode.

  - **Check for evasion attempts:** Review System Event ID 7045 logs for other service-related anomalies to determine if additional persistence mechanisms are being deployed alongside the registry modification.

  - **Analyze endpoint roles and criticality:** If modifications are found on critical endpoints (e.g., Domain Controllers or Servers), initiate an immediate investigation to understand the context of the changes and assess potential security risks.

  - **Determine benign behavior:** Investigate if similar registry modifications match known safe applications in your environment, especially those associated with security software or legitimate management tools.

  ### Prioritization

  This alert is assessed as high priority due to the potential impact on critical systems if an attacker maintains persistence through registry modifications. The likelihood of malicious abuse is significant, as servicing in Safe Mode is often weaponized to evade detection. Prompt analysis is required to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate activities that could inadvertently create similar registry changes, such as updates from trusted software. Reliable detection depends on having comprehensive logging configured for registry changes and the associated processes. Similar alerts based on known malicious registry path modifications, like other Safe Mode persistence techniques, can strengthen coverage against this attack vector.

