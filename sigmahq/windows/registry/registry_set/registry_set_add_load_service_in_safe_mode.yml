note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry aimed at ensuring that specific services are loaded in Safe Mode, which attackers may implement to maintain persistence on compromised systems. The likely attacker objective is to evade detection while maintaining control over the system during troubleshooting or incident response activities. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and specifically targets Windows Registry modifications for safe mode entry (T1112).

  The primary telemetry sources include Windows Registry logs that capture changes to the Registry paths associated with Safe Mode services, particularly those targeting `\Control\SafeBoot\`. The potential security impact if malicious includes unauthorized persistence mechanisms remaining active during system recovery or incident response. Notably, this detection does NOT confirm that the behavior is malicious without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check registry changes:** Review Registry Event logs (Security Event ID 4657) for modifications to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\` and `\Control\SafeBoot\Network\`. Look for entries that add non-standard services without known administrative changes.

  - **Correlate with recent activity:** Identify any unusual process creation events (Security Event ID 4688 or Sysmon Event ID 1) related to `msiexec.exe`, `MBAMInstallerService.exe`, or `HexnodeAgent.exe` around the time of the Registry modification. Malicious indicators include unexpected execution of these images by non-administrative users.

  - **Analyze affected services:** Investigate the services listed under `\Control\SafeBoot\Minimal\` and `\Control\SafeBoot\Network\` for names found in the alert. Confirm their legitimacy and operational necessity against a baseline of expected service configurations within the enterprise.

  - **Identify legitimate use cases:** Cross-reference with authorized operational changes, such as scheduled maintenance or updates to known security applications that might temporarily adjust service load paths. Legitimate configurations typically do not include custom or non-standard entries for services not installed enterprise-wide.

  - **Investigate user accounts:** Review user account authentication logs (Windows Event IDs 4624 and 4625) to determine if any unauthorized accounts have manipulated the Registry entries associated with Safe Mode, indicating a potential compromise.

  ### Prioritization

  This alert is high severity due to the critical role that Safe Mode plays in system recovery and incident response. The likelihood that attackers may exploit this persistence technique is significantly high, as manipulating safe mode is a common tactic utilized to maintain control over systems during recovery scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary Windows Registry logging is not properly configured or enabled. Adversaries may use techniques to obfuscate their changes or cleverly disguise legitimate services to mask their malicious modifications. Common legitimate activities that could trigger the alert include system updates performed by IT admins or legitimate changes made by scheduled tasks. A related detection to strengthen coverage would be monitoring for process drops associated with system-critical processes (e.g., leveraging Sysmon to track process creation and termination events).

