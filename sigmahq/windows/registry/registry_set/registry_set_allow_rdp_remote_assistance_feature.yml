note: |
  ### Technical Context

  This Sigma rule detects changes in the Windows registry that enable the Remote Desktop Protocol (RDP) Remote Assistance feature for user access on a target machine. The likely objective of an attacker enabling this functionality is to gain unauthorized remote access to the system, putting sensitive data at risk or allowing further lateral movements within the network. This activity is associated with the MITRE ATT&CK tactic of "Persistence" and technique T1112 (Modify Registry).

  The primary telemetry sources are Windows registry modifications, particularly the registry key at `System\CurrentControlSet\Control\Terminal Server\fAllowToGetHelp`. If this change is malicious, it could facilitate unauthorized access, leading to data breaches or additional exploitation. Importantly, this detection alone does not confirm malicious intent, as legitimate users may enable RDP Remote Assistance under valid circumstances.

  ### Investigation Steps

  - **Review registry changes:** Check for modifications to the registry key `System\CurrentControlSet\Control\Terminal Server\fAllowToGetHelp`. Legitimate configurations may show the value set to `0` (disabled) before this rule triggers.

  - **Query user access logs:** Investigate the Security Event ID 4624 (Logon) to review which users successfully logged on via RDP after the change. Legitimate usage may involve known administrative accounts, while unknown accounts could indicate suspicious activity.

  - **Check for recent username activity:** Examine the account activity for any user who has connected via RDP. Review Event ID 4768 (Kerberos authentication) and validate expected connections against the user access logs.

  - **Look for unusual RDP session patterns:** Investigate Windows Event ID 20 (TerminalServices-LocalSessionManager) for any concurrent or unexpected RDP sessions initiated shortly after enabling the feature, as this can indicate malicious use.

  - **Assess administrative roles:** Identify if the user enabling the feature has the necessary administrative permissions. Legitimate changes may come from users in specific administrative roles, while sudden changes from standard users should be treated suspiciously.

  ### Prioritization

  This alert is of medium severity due to its capability to grant remote access to critical systems, which can significantly impact system security. The likelihood of exploitation is moderate; attackers frequently weaponize RDP features in lateral movement tactics. Despite being routinely used for support purposes, enabling RDP assistive features without clear justification raises red flags.

  ### Blind Spots and Assumptions

  Detection may be limited if registry activity is not consistently logged or if monitoring is insufficiently configured. Legitimate users may enable this setting for technical support purposes, which can lead to false positives. An additional detection such as monitoring for unusual remote access patterns or RDP connections (Event ID 4672) would provide strengthened coverage and context for alerts regarding RDP feature changes.

