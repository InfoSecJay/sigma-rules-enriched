note: |
  ### Technical Context
  This detection rule identifies instances where the Remote Desktop Protocol (RDP) Remote Assistance feature is enabled on Windows systems. Specifically, it captures changes in the registry that allow designated users to connect remotely, which can indicate potential malicious activity if configured without proper oversight. Attackers may enable this feature to gain persistent remote access to a target system, allowing for unauthorized control and data exfiltration.

  The primary motivations behind enabling RDP Remote Assistance include facilitating remote support or, in the case of an attacker, establishing a foothold within the environment. Attackers often use legitimate features, such as RDP, to blend in with normal user activity, making detection challenging. The relevant MITRE ATT&CK techniques for this detection rule include **T1112 - Modify Registry** and are part of tactics associated with **Persistence** and **Defense Evasion**.

  The best evidence for this type of detection lies in Windows registry event logs, specifically tracking changes to the key **System\CurrentControlSet\Control\Terminal Server\fAllowToGetHelp**. Monitoring for this specific registry modification can provide insights into potential unauthorized changes made by malicious actors.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the Windows registry for modifications to the key `System\CurrentControlSet\Control\Terminal Server\fAllowToGetHelp` to confirm unauthorized changes or suspicious users listed to receive assistance.
  - **Check User Activity Logs**: Analyze user accounts associated with the enabled remote assistance feature. Look for unusual patterns in login timings and geolocation that could indicate account compromise or insider threats.
  - **Validate Remote Connections**: Examine connection logs for RDP sessions initiated from unusual IP addresses or locations not normally associated with the accounts configured for remote assistance. Use VPN and firewall logs for deeper insights.
  - **Cross-reference with Group Policies**: Review the organization's group policies and permissions to determine if the enabled RDP feature aligns with established remote support protocols and if proper approval processes were followed.

  ### Prioritization
  This alert should be considered medium priority due to the potential for attackers to use enabled RDP Remote Assistance for remote control of systems, which can lead to extended compromise if not addressed quickly. The ease of exploitation and the sensitivity of information on enterprise systems heighten the risk.

  ### Blind Spots and Assumptions
  One potential gap in detection capability is that legitimate changes made by support staff may not be easily distinguishable from malicious activities, leading to possible false positives. The detection logic assumes that any modification to the specified registry key without proper authorization is suspicious. Effective detection also relies on having well-configured logging settings for registry changes; without these, alerts may not trigger as intended.

