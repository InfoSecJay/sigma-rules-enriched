note: |
  ### Technical Context

  This rule detects the enabling of the Remote Desktop Protocol (RDP) Remote Assistance feature on Windows machines, specifically looking for the registry key `fAllowToGetHelp` set to a value of `1` under `System\CurrentControlSet\Control\Terminal Server`. An attacker may use this functionality to gain unauthorized access to a target system remotely, potentially bypassing conventional authentication mechanisms. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), and the technique is **Remote Control Software** (T1112).

  The primary telemetry sources for this detection are Windows registry modification logs. Specifically, this is tied to the Windows Registry event capturing the alteration of the `fAllowToGetHelp` value. If malicious, enabling this feature could allow attackers to control the machine remotely, leading to possible data breaches or further exploitation of the network. However, this detection alone does not confirm malicious intent; legitimate administration activities may also trigger this alert.

  ### Investigation Steps

  - **Check Registry Settings: ** Review the Registry key Path `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server` for the value of `fAllowToGetHelp`. If the value is `1`, it indicates that RDP Remote Assistance is enabled. Compare this with documented change logs or previous baseline configurations for regular patching or remote support processes.

  - **Determine User Context: ** Identify the user or process that made the change. Look for **Event ID 4657** in the Security logs to track changes to this registry value. If the change was made by an account with administrative privileges but not sanctioned by your organization's security policy, this could be a red flag.

  - **Review Activity Context: ** Verify recent user activity surrounding the time of the registry change using **Event ID 4624** (Logon events). Look for logins from unusual locations, times, or accounts without a legitimate support purpose to establish potential malicious behavior.

  - **Validate Remote Connection Logs: ** Check for Remote Desktop connections initiated from `Event ID 4624` and `Event ID 5140` (for network share access). Identify the IP addresses and user accounts used for the remote connections following the registry modification. Malicious activity may show unrecognized IPs or unusual user-agent strings.

  - **Compare with Baseline Activity: ** Analyze historical records for allowed RDP connections, identifying regular maintenance windows when such features are typically enabled. Established patterns may help distinguish between malicious activity and legitimate remote support tasks.

  ### Prioritization

  This alert is of **medium severity** due to the potential for unauthorized access to sensitive systems, especially if the system is critical, such as a server or endpoint containing sensitive data. The likelihood of malicious use is moderate, as attackers frequently exploit RDP for lateral movement and persistence in a compromised environment.

  ### Blind Spots and Assumptions

  The detection is limited by the reliance on registry changes; attackers may disable event logging to avoid detection. Required logs include Windows Registry audit settings and event logging for proper monitoring of modifications. Legitimate activities, such as authorized technical support sessions, may trigger the alert. A companion detection could include monitoring for subsequent RDP session initiation logs to strengthen coverage of potential live exploitation.

