note: |
  ### Technical Context
  This detection rule identifies when the Hypervisor Enforced Code Integrity (HVCI) feature is disabled on Windows systems by monitoring changes to specific registry keys. HVCI is a critical security feature that ensures only trusted code can run in the kernel, thus protecting against various kernel-level threats such as rootkits and bootkits. If an attacker succeeds in disabling this feature, they gain the ability to execute unsigned and potentially malicious code, significantly increasing the risk of system compromise.

  In this scenario, an adversary may target HVCI to facilitate a more profound attack while maintaining persistence and evading detection tools. By disabling HVCI, the attacker might load malicious drivers or exploit kernel vulnerabilities to gain control of the system. This aligns with the MITRE ATT&CK Tactics under **Defense Evasion** (ID: TA0005) and specifically targets the **T1562.001: Disable or Modify Security Tools** technique.

  The primary data sources for detecting this behavior include the registry set logs that reflect unauthorized changes to HVCI-related registry keys. Monitoring these keys can help identify potential compromises before they can be fully exploited by an attacker.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the registry change logs for entries related to `HypervisorEnforcedCodeIntegrity`. Look for changes to the values at the specified registry paths and timestamp the changes to investigate suspicious activity.

  - **Correlate with Process Events**: Analyze process creation events around the time of the registry change. Identify any suspicious processes that might correspond with the disabling of HVCI, focusing on any that attempt to load unsigned drivers or code.

  - **Check Security Tool Logs**: Investigate logs from your endpoint detection and response (EDR) tools for any alerts related to the execution of known malicious software or behavior indicative of attempts to compromise the kernel.

  - **Conduct User Activity Monitoring**: Evaluate user activity logs in the context of the affected system. Ensure only authorized personnel have access to change system security settings, and review any administrative access that occurred near the time of the registry modification.

  ### Prioritization
  This alert has been assessed as high severity due to the potential impact of disabling HVCI, which places the entire operating system at risk. The likelihood of exploitation increases significantly as attackers often target such weaknesses to gain control over enterprise environments.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage if the change to HVCI occurs through approved administrative processes or legitimate maintenance windows; these can result in false positives. The detection logic assumes that any changes made to the relevant registry keys are unauthorized unless documented otherwise. For optimal detection capabilities, it is essential that the logging of registry changes is enabled and configured properly across all relevant endpoints. Additionally, integration with other telemetry sources is required to build more context around changes that appear suspicious.

