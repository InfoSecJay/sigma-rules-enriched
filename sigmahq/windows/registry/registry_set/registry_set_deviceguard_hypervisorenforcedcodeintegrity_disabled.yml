note: |
  ### Technical Context

  This rule detects changes to the Windows registry that disable Hypervisor Enforced Code Integrity (HVCI) by setting relevant keys to "0." The likely attacker objective is to bypass protective measures that prevent the execution of unsigned or untrusted kernel code, allowing for potential exploitation through rootkits or other malicious software. The relevant MITRE ATT&CK tactic is **Defense Evasion** and the technique is **T1562.001** (Disable or Modify Security Tools).

  The primary telemetry source for this detection is Windows registry changes, specifically monitoring the `registry_set` events related to HVCI. If exploited, the impact could include significant loss of system integrity, leading to unauthorized access or control of sensitive processes. This detection does NOT confirm malicious intent on its own, as legitimate system administration activities can also result in similar registry changes.

  ### Investigation Steps

  - **Review registry changes:** Examine the registry for the target keys: `\Control\DeviceGuard\HypervisorEnforcedCodeIntegrity`, `\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled`, and `\Microsoft\Windows\DeviceGuard\HypervisorEnforcedCodeIntegrity` for details indicating a change to `DWORD (0x00000000)`.

  - **Verify user context:** Check for the user account making the registry changes (Event ID 4657). Changes made by known system administrators during maintenance may be benign, while modifications by low-level users could indicate malicious activity.

  - **Analyze logs for process creation:** Investigate Security Event ID 4688 or Sysmon Event ID 1 around the time of the registry change to identify any suspicious processes or commands executed, particularly those interacting with kernel-level operations or driver installations.

  - **Correlate with other detections:** Look for related events indicating suspicious driver installations or kernel-mode code executions. A lack of legitimate drivers being installed may signify malicious intent.

  - **Assess system role and configuration:** Check if the affected system is critical (e.g., domain controller, sensitive data server) or in a testing environment. Legitimate tasks may require HVCI to be disabled temporarily, but this should be documented during maintenance.

  - **Confirm file system changes:** Look for new or modified files in the system directories that might correlate with the disabling of HVCI. Specific attention should be paid to $\Windows\System32$\ drivers, where unsigned drivers may be introduced.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on system security and integrity. The disabling of HVCI is a critical indicator that could facilitate further malicious activity, particularly in systems handling sensitive information. This behavior is also a common technique leveraged by various adversaries during attack campaigns.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate administrative activities may disable HVCI for troubleshooting or compatibility reasons, leading to potential false positives. Additionally, if registry auditing is not properly configured, critical changes might not be captured. Always consider that this alert may overlap with system maintenance activities, and companion detections monitoring driver installations or unusual process creation can strengthen overall coverage against kernel exploitation techniques.

