note: |
  ### Technical Context

  This rule detects changes to specific registry keys indicating that Hypervisor Enforced Code Integrity (HVCI) has been disabled. This behavior could allow an attacker to bypass security protections and load unsigned or untrusted code into the kernel, potentially facilitating malicious activities such as rootkits or advanced persistent threats. The relevant MITRE ATT&CK tactic is "Defense Evasion" with the technique ID T1562.001. The primary telemetry source is Windows registry change logs, particularly targeting the `HypervisorEnforcedCodeIntegrity` keys. Malicious changes here could severely impact system integrity and security posture. It’s important to note that this detection does not confirm malicious intent on its own, as legitimate administrative tasks may also result in the same changes.

  ### Investigation Steps

  - **Check registry changes:** Review Windows Event ID 4657 (`Registry value modified`) for any alterations in the `\Control\DeviceGuard\HypervisorEnforcedCodeIntegrity` path and confirm if the `Enabled` value is set to 0. Benign activity may include verified changes by authorized personnel.

  - **Examine process creation events:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for processes started around the time of the registry modification. Look for unusual process names or command lines that correspond with exploitation techniques or known malicious behaviors.

  - **Assess system integrity:** Use the command `Get-WindowsFeature -Name DeviceGuard` in PowerShell to verify if Device Guard features are still enabled, suggesting the system remains under intended protective controls. This step can help distinguish between legitimate troubleshooting versus potential compromise.

  - **Monitor for known indicators:** Look for recently executed commands in Security Event IDs 4688 that aim to disable security features or alter security policy settings. High-confidence malicious indicators include execution of tools like Mimikatz or other known scripts that manipulate kernel code.

  ### Prioritization

  This alert is rated high severity due to the potential impact of disabling HVCI on endpoint security. The likelihood of abuse is significant, as adversaries often seek to exploit misconfigured hypervisor settings to achieve a foothold within the environment. This behavior is recognized as a common tactic in various advanced attacks, including rootkit deployment.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture all registry modifications, and monitoring may miss legitimate activities related to necessary troubleshooting or administrative tasks. Systems that frequently interact with incompatible drivers may trigger this alert without malicious intent. A companion detection to consider includes monitoring for subsequent kernel-level changes or unauthorized driver installations, further reinforcing the integrity of the detection process.

