  type: derived
status: test
description: Detects changes to registry keys related to "Trusted Location" of 
  Microsoft Office where the path is set to something uncommon. Attackers might 
  add additional trusted locations to avoid macro security restrictions.
references:
- Internal Research
- https://admx.help/?Category=Office2016&Policy=excel16.Office.Microsoft.Policies.Windows::L_TrustedLoc01
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
modified: 2023-09-29
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'Security\Trusted Locations\Location'
    TargetObject|endswith: '\Path'
  filter_exclude_known_paths:
    Details|contains:
    - '%APPDATA%\Microsoft\Templates'
    - '%%APPDATA%%\Microsoft\Templates'
    - '%APPDATA%\Microsoft\Word\Startup'
    - '%%APPDATA%%\Microsoft\Word\Startup'
    - ':\Program Files (x86)\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office (x86)\Templates'
    - ':\Program Files\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office\Templates\'
  filter_main_office_click_to_run:
    Image|contains: ':\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_office_apps:
    Image|contains:
    - ':\Program Files\Microsoft Office\'
    - ':\Program Files (x86)\Microsoft Office\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_exclude_*
falsepositives:
- Other unknown legitimate or custom paths need to be filtered to avoid false 
  positives
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Microsoft Office "Trusted Location" registry keys, specifically when the path set for these locations is uncommon. Attackers often exploit "Trusted Locations" to bypass macro security restrictions, allowing them to execute malicious macros without triggering alerts. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Defense Evasion (TA0005), particularly technique T1112 (Modification of Registry). The primary telemetry sources are Windows registry modification logs, and the required log types include Registry Set events. If malicious, this could lead to unauthorized script execution or malware deployment. Importantly, this detection does not confirm that malicious activity occurred on its own; further investigation is warranted.

  ### Investigation Steps

  - **Review registry modification events:** Check Windows Event ID 4657 (registry value modified). Focus on the impacted path, specifically under the `HKCU\Software\Microsoft\Office\` and `HKLM\Software\Microsoft\Office\` locations for any uncommon or unusual registry entries.

  - **Identify known safe paths:** Cross-reference the path in the registry modification with a list of known safe "Trusted Location" paths such as `%APPDATA%\Microsoft\Templates` or standard installation directories. Legitimate activity typically involves these recognized paths.

  - **Analyze user behavior and context:** Examine the User and Process logs (Event ID 4688, Security) for the user account associated with the registry modification. Look for prior behavior indicating administrative actions or access to Office applications around the same timestamp.

  - **Check for associated file activity:** Investigate file creation (Windows Event ID 4663 or Sysmon Event ID 11) in the paths leading to "Trusted Location" usage for any suspicious or unknown files that could indicate malicious payloads being introduced.

  - **Evaluate click-to-run processes:** Inspect logs for Office Click-to-Run process information (e.g., ClickToRun.exe) to ensure that the modification did not originate from administered installations or updates. Confirm expected click-to-run activities around the modification time.

  ### Prioritization

  This alert should be prioritized as high severity, due to the potential impact on organizational security through unmonitored macro execution. The likelihood of abuse is significant since attackers frequently target Office applications to evade detection. This behavior is commonly weaponized in various attack scenarios, particularly in phishing campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging configuration does not cover all registry modifications. Attackers may employ known legitimate paths to obscure their activities. Additionally, custom enterprise configurations could inadvertently trigger this alert. A related detection, such as monitoring for unusual macro activity in Office documents (e.g., TA0045), would enhance overall coverage against exploitation of trusted locations.

