title: Uncommon Microsoft Office Trusted Location Added
id: f742bde7-9528-42e5-bd82-84f51a8387d2
related:
- id: a0bed973-45fa-4625-adb5-6ecdf9be70ac
  type: derived
status: test
description: Detects changes to registry keys related to "Trusted Location" of Microsoft
  Office where the path is set to something uncommon. Attackers might add additional
  trusted locations to avoid macro security restrictions.
references:
- Internal Research
- https://admx.help/?Category=Office2016&Policy=excel16.Office.Microsoft.Policies.Windows::L_TrustedLoc01
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
modified: 2023-09-29
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'Security\Trusted Locations\Location'
    TargetObject|endswith: '\Path'
  filter_exclude_known_paths:
    Details|contains:
    - '%APPDATA%\Microsoft\Templates'
    - '%%APPDATA%%\Microsoft\Templates'
    - '%APPDATA%\Microsoft\Word\Startup'
    - '%%APPDATA%%\Microsoft\Word\Startup'
    - ':\Program Files (x86)\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office (x86)\Templates'
    - ':\Program Files\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office\Templates\'
  filter_main_office_click_to_run:
    Image|contains: ':\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_office_apps:
    Image|contains:
    - ':\Program Files\Microsoft Office\'
    - ':\Program Files (x86)\Microsoft Office\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_exclude_*
falsepositives:
- Other unknown legitimate or custom paths need to be filtered to avoid false positives
level: high
note: |
  ### Technical Context
  This detection rule monitors changes to the registry keys associated with Microsoft Office's "Trusted Locations." Specifically, it identifies when a new trusted location is added that does not conform to well-known paths. Uncommon trusted locations can provide attackers with a mechanism to execute malicious macros without triggering security safeguards, thereby facilitating further actions like data theft or lateral movement within an organization.

  Attackers may aim to evade macro security warnings by placing malicious documents in these newly created trusted locations, making this operation a critical step in their persistence and defense-evasion tactics. The rule is relevant to the MITRE ATT&CK techniques of **T1112 - Modify Registry**, which focuses on altering the registry to influence system behavior, thus supporting broader persistence efforts.

  Primary data sources for this detection include **registry change logs**, which capture alterations to registry settings, and **Windows event logs** that detail the execution context during which the changes occur, specifically focusing on process creation and other system activities that may indicate malicious behavior.

  ### Investigation Steps
  - **Review Registry Logs:** Inspect registry change logs to identify any entries related to "Trusted Locations" that don’t match expected legitimate paths or are outside of typical user or application behavior.
  - **Correlate with Process Activity:** Analyze process creation logs around the time of the registry modification to see if there are any unexpected processes or patterns that could indicate malicious activity, such as instances of `OfficeClickToRun.exe`.
  - **Validate Trusted Location Path:** Verify if the newly added trusted location is being used for storing files, especially if associated with suspicious document activity or file transfers; ensure it is not a path common to your environment.
  - **Check User Permissions:** Look at the user account or system context under which these changes were made. Ensure that the account has appropriate permissions and is not associated with known suspicious activity.

  ### Prioritization
  This alert should be considered high severity because the ability to modify trusted locations in Microsoft Office can enable attackers to execute malicious macros undetected, posing a significant risk to data integrity and security.

  ### Blind Spots and Assumptions
  One key blind spot in this detection could be the addition of legitimate custom trusted paths that have not been predefined, leading to possible false positives. The detection logic assumes that unusual paths are indicative of malicious activity, which may not always hold true in every environment. For the alert to function effectively, it requires comprehensive logging from the Windows registry and adequate monitoring capabilities to track process execution associated with these registry modifications.

