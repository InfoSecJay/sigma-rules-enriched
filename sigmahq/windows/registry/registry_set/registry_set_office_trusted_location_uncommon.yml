logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'Security\Trusted Locations\Location'
    TargetObject|endswith: '\Path'
  filter_exclude_known_paths:
    Details|contains:
    - '%APPDATA%\Microsoft\Templates'
    - '%%APPDATA%%\Microsoft\Templates'
    - '%APPDATA%\Microsoft\Word\Startup'
    - '%%APPDATA%%\Microsoft\Word\Startup'
    - ':\Program Files (x86)\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office (x86)\Templates'
    - ':\Program Files\Microsoft Office\root\Templates\'
    - ':\Program Files\Microsoft Office\Templates\'
  filter_main_office_click_to_run:
    Image|contains: ':\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_office_apps:
    Image|contains:
    - ':\Program Files\Microsoft Office\'
    - ':\Program Files (x86)\Microsoft Office\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_exclude_*
falsepositives:
- Other unknown legitimate or custom paths need to be filtered to avoid false 
  positives
level: high
note: |
  ### Technical Context

  This Sigma rule detects changes made to Windows registry keys that relate to "Trusted Locations" in Microsoft Office, specifically targeting alterations where the path is uncommon. An attacker’s goal in modifying these paths is typically to bypass built-in security controls around macros, allowing potentially malicious documents to run without triggering alerts. This activity aligns with the MITRE ATT&CK tactic of Persistence (TA0003) via the technique of Modify Existing Service (T1112).

  The primary telemetry source for this detection is Windows Registry log data, specifically focused on registry key changes. Critical implications of a successful change could include unauthorized access or execution of malware disguised as legitimate Office documents. Importantly, this detection does NOT confirm malicious intent solely based on the registry modification; further investigation is necessary to establish the context of the change.

  ### Investigation Steps

  - **Examine the registry change specifics**: Check Registry Event IDs (e.g., 4657) for the exact key modified: `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Excel\Security\Trusted Locations`. Look for any paths that are not in the known legitimate list.

  - **Identify the user responsible for the change**: Cross-reference the User SID associated with the registry modification against your Active Directory (AD) logs. Look for unusual or unauthorized users making changes.

  - **Confirm legitimate paths in use**: A baseline review of what typical trusted locations are in your environment should show frequent paths like `%APPDATA%\Microsoft\Templates` or other documented patterns. Compare against any uncommon entries flagged by the detection.

  - **Investigate the process creaded**: Review Security Event ID 4688 for process creation correlating with `svchost.exe` or other unexpected executables that might indicate script or batch file execution related to the Office change.

  - **Check if the changes coincide with other suspicious activity**: Look for correlations with other detections or alerts, particularly regarding document processing activities or VBA execution warnings within the Microsoft Office suite.

  - **Validate potential file creation or exfiltration**: Review any changes in document storage or movement indicators, such as scrutinizing logs for file creation events (Event ID 4663) related to `.docm` or `.xlsm` files in untrusted directories post-registry modification.

  ### Prioritization

  The alert severity is high due to the potential security risks associated with unauthorized changes to Office Trusted Locations, which could facilitate macro-based malware execution. The likelihood of this behavior being exploited by adversaries is moderate to high, especially given the common weaponization of Office documents in phishing schemes.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate third-party applications that create or modify trusted locations. Configuration for comprehensive registry monitoring must be validated to ensure coverage of potential evasion techniques, such as malware using hidden or obscure paths. Furthermore, it is essential to acknowledge that legitimate administrative actions may inadvertently trigger this alert. A companion detection mechanism to strengthen coverage would involve monitoring for unexpected macro execution events from Office applications (e.g., Event ID 1300).

