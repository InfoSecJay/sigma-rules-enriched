  ### Technical Context

  This rule detects a potential User Account Control (UAC) bypass technique using Windows Event Viewer. Attackers often aim to elevate privileges without detection, achieving execution of malicious code with higher privileges. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation, specifically technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Access Control). The primary telemetry sources needed for this detection are the Windows Registry (specifically registry modification logs), and relevant log types include registry_set events. The security impact could be significant, allowing attackers to execute code with elevated privileges, potentially compromising the entire system. It is important to note that this detection does NOT confirm that an attack is occurring; it only indicates that a UAC bypass method that has been exploited is being attempted.

  ### Investigation Steps

  - **Review registry modifications**: Check for Event ID 13 (Registry Key Change) indicating changes to `HKEY_CLASSES_ROOT\mscfile\shell\open\command`. Look for unusual or unauthorized command paths – malicious modifications often lead to unexpected executables being called.

  - **Validate legitimate usage**: Look for known software that legitimately manipulates UAC settings or uses Event Viewer, such as administration tools or system management applications. Confirm the source and reputation of running processes.

  - **Correlate with other logs**: Analyze related telemetry, such as Sysmon Event ID 1 (process creation), to identify if an unusual process is spawned after the registry modification. A common legitimate activity might include expected system maintenance or administrative scripts.

  - **Document impacted systems**: Identify asset criticality by correlating the affected systems with the organization's critical infrastructure. Note whether the affected system holds sensitive data or elevated user roles.

  - **Identify repetition of actions**: Look for repeated patterns or multiple instances of Event ID 13 changes without legitimate software deployment activity. This may indicate a scripted approach to executing the UAC bypass.

  - **Check association with malicious indicators**: Examine other events around times of registry modifications. Investigate command lines that execute unexpected or flagged scripts; utilize security intelligence feeds for known IOC correlations.

  ### Prioritization

  This alert is high severity due to the potential for privilege escalation on critical systems. The exploitation of UAC bypass techniques is commonly seen in targeted attacks, increasing the likelihood of successful malicious activity. Systems affected by such behavior often handle sensitive information or critical enterprise functions, warranting immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of scripted actions that manipulate the registry in benign software contexts, leading to false positives. Ensure Windows Registry auditing is properly configured and logging is enabled for accurate detection. Legitimate activities such as software updates or legitimate administrative tasks can trigger this alert. A related rule detecting unusual process creation in conjunction with registry modifications would enhance monitoring for this behavior.

