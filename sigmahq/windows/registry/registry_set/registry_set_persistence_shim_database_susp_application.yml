note: |
  ### Technical Context

  This Sigma rule detects the installation of new shim databases in a Windows environment, specifically targeting modifications to specific processes likely associated with process injection or persistence mechanisms. The likely attacker objective is to enhance their control over the system and evade detection by modifying how applications interact with the Windows kernel. This behavior aligns with the MITRE ATT&CK technique for ‘Executable Code Injection’ (T1546.011) and falls under the tactics of Privilege Escalation and Persistence.

  The primary telemetry sources include Windows Registry modifications, specifically tracking changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom` for targeted processes like `csrss.exe` or `explorer.exe`. If malicious, this activity may allow an adversary to inject code into trusted system processes, leading to unauthorized access or data exfiltration. It is important to note that this detection alone does not confirm malicious intent but rather highlights potentially significant modifications warranting further investigation.

  ### Investigation Steps

  - **Examine registry changes for specified processes**: Check Windows Registry events for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom` (Event ID 4657) specifically related to `csrss.exe`, `explorer.exe`, or `svchost.exe`. Malicious entries typically include unusual or unexpected values not seen in standard configurations.

  - **Cross-reference with known indicators**: Utilize threat intelligence feeds to compare detected shim databases against known malicious entries associated with APT groups like FIN7. Look for hashes or GUIDs known to be used in previous attacks.

  - **Identify legitimate application behavior**: Establish a baseline by reviewing typical shim database entries for from legitimate applications that align with the identified processes. This helps in distinguishing between benign and malicious entries.

  - **Review related process creation logs**: Check for recent process creation events (Event ID 4688) for any modifications to processes before and after the registry change. Look for unusual parent-child relationships, especially with processes established under benign user accounts.

  - **Analyze parent process context**: Investigate the context of the parent processes from which the new database entries were created. If initiated from administrative tools or unknown scripts, escalate the investigation.

  - **Inspect for lateral movement indicators**: Check logs for potential lateral movement attempts (e.g., Event ID 4624 for logon events) that may correlate with the shim database installation to identify any unauthorized accounts or unusual login times.

  ### Prioritization

  Given the potential impact of such activities on critical systems, if malicious, the installation of shim databases could significantly elevate an attacker’s foothold in the network. The likelihood of this behavior being weaponized is moderate due to its association with advanced persistent threat tactics. Therefore, this alert should be considered high priority and escalated accordingly.

  ### Blind Spots and Assumptions

  Detection of shim database modifications can be evaded through legitimate software updates or administrative actions that modify the registry legitimately. Reliable detection requires comprehensive logging of registry changes via Windows auditing configurations. There's a risk that benign applications, particularly custom or legacy applications, may trigger these alerts due to their own handling of the shim database. Companion detections related to unusual registry access or suspicious process creation (e.g., Event ID 4688) can complement this alert and improve overall context in investigations.

