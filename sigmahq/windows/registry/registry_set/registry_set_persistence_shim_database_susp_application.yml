logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\'
    TargetObject|endswith:
            # Note: add other application to increase coverage
    - '\csrss.exe'
    - '\dllhost.exe'
    - '\explorer.exe'
    - '\RuntimeBroker.exe'
    - '\services.exe'
    - '\sihost.exe'
    - '\svchost.exe'
    - '\taskhostw.exe'
    - '\winlogon.exe'
    - '\WmiPrvSe.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of new shim databases in Windows operating systems that alter the behavior of legitimate processes, such as `csrss.exe`, `explorer.exe`, and `winlogon.exe`. Shim databases are a feature in Windows that can be misused by attackers to introduce hooks or other modifications to trusted processes, thereby facilitating process injection, persistence, or evasion of security controls. The primary objective of an attacker employing this technique is often to maintain access to compromised systems while minimizing detection risks.

  The MITRE ATT&CK tactics associated with this detection are **Persistence (T1546)** and **Privilege Escalation (T1546.011)**. By manipulating shim databases, attackers can create a stable foothold within the environment, allowing them to execute malicious payloads with higher privileges or evade user access restrictions. The key data sources for this rule are Windows Registry logs, particularly those pertaining to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\` location, as well as process creation events that may indicate unexpected behavior linked to the affected processes.

  ### Investigation Steps
  - **Review Registry Logs:** Examine changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\` for newly added shim database entries or modifications to existing ones, focusing on the processes specified in the detection rule.
  - **Analyze Process Behavior:** Monitor the processes listed (e.g., `explorer.exe`, `winlogon.exe`) for any unusual parent-child relationships or unexpected command-line arguments that indicate potential injection or exploitation.
  - **Check for Persistence Artifacts:** Investigate for any related artifacts in startup locations, scheduled tasks, or services that may correspond with the altered processes to determine if they are being used for persistence.
  - **Correlate with Other Alerts:** Cross-reference findings with other security alerts in your environment, such as EDR telemetry or SIEM events, to verify if there are additional indications of compromise or lateral movement.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact on corporate systems, including unauthorized access and data exfiltration. The likelihood of such activity being indicative of malicious behavior is elevated, particularly if discovered in conjunction with other suspicious activities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the registry logs are not collected or monitored effectively within your environment. The detection logic assumes that the presence of shim database entries is indicative of malicious intent, which may not be true in cases of legitimate application compatibility configurations. Additionally, the detection relies on the availability of comprehensive and unaltered Windows Registry logs to identify such modifications successfully.

