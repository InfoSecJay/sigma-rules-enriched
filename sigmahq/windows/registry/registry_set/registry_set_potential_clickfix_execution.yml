note: |
  ### Technical Context
  This detection rule monitors Windows registry modifications specifically targeting the RunMRU (Most Recently Used) key, which is often abused by ClickFix malware. ClickFix is delivered through phishing schemes, exploiting social engineering to manipulate victims into running malicious commands that are designed to install remote scripts or executables by leveraging clipboard hijacking. Attackers often use fake CAPTCHA pages to trick users into engaging with the malware and executing commands that may not otherwise be suspected as malicious.

  The relevant MITRE ATT&CK tactics that apply to this threat are **Execution (TA0002)**, particularly the technique **User Execution (T1204.001)**, as the malware requires the user to inadvertently execute it. The detection logic inspects for suspicious registry entries containing HTTP/HTTPS links, alongside keywords associated with deceptive content (like "captcha" or "verification") and common execution methods (like `powershell`, `cmd`, etc.). The primary telemetry sources for this detection would be Windows registry logs, specifically focusing on changes within the `RunMRU` registry key.

  ### Investigation Steps
  - **Review Registry Changes**: Assess registry modification logs for the `HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU` key to identify any suspicious entries containing HTTP/HTTPS links or known malware execution patterns.

  - **Analyze User Activity**: Investigate user activity logs to determine if users accessed phishing-themed websites or engaged with potential ClickFix distribution methods (e.g., fake CAPTCHA forms).

  - **Examine Event Logs**: Check Windows event logs for process creation events that correlate with the detected URL executions, particularly those that utilize common execution commands like `powershell` or `cmd`.

  - **Correlate with Phishing Indicators**: Reference phishing indicator databases or recently identified phishing campaigns that align with the behavior observed, enhancing the context for the identified detection.

  ### Prioritization
  This alert should be treated with high priority due to the potential impact of ClickFix malware, which can lead to unauthorized access and further exploitation. The likelihood of such phishing attempts succeeding in an enterprise environment is significant, making prompt investigation essential.

  ### Blind Spots and Assumptions
  The detection may not cover all potential ClickFix execution methods, especially if the malware uses alternative persistence mechanisms that do not involve the RunMRU key. Additionally, legitimate applications may modify this registry key for benign purposes, leading to false positives. The alert assumes that registry logging is enabled and adequately configured to capture the necessary events; without this, detection may fail to trigger during actual malicious activity.

