note: |
  ### Technical Context

  This Sigma rule detects potential execution patterns associated with the ClickFix malware by monitoring registry modifications to the RunMRU keys that contain HTTP or HTTPS links. Attackers typically use ClickFix as part of phishing campaigns to execute remotely hosted malicious files by manipulating users into pasting clipboard content into the Run dialog. The relevant MITRE ATT&CK tactic is Execution (TA0002), and the specific technique is User Execution (T1204.001). The primary telemetry source is registry modification logs targeting the `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\` key.

  If successful, a malicious ClickFix execution can lead to severe security impacts, such as unauthorized remote access and potential system compromise. However, this detection does NOT confirm malicious use on its own, as legitimate applications may also generate similar registry activity.

  ### Investigation Steps

  - **Review registry modifications: ** Check the registry under `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\` for recent entries containing HTTP/HTTPS links (Event ID 4657) to identify potentially malicious behavior.

  - **Analyze registry details for patterns: ** Look for entries that include suspicious keywords like 'captcha', 'verification', or 'human' in the Details field, which may indicate a ClickFix-related attack.

  - **Correlate with process creation logs: ** Review process creation logs (Sysmon Event ID 1) for any suspicious commands launched via `cmd`, `powershell`, or `bitsadmin` that execute shortly after registry modification timestamps.

  - **Identify benign usage: ** Determine whether legitimate applications or user actions are responsible for HTTP/HTTPS entries. This can include checking for known software vendors that use RunMRU for updates, ensuring no confirmed malicious indicators are present.

  - **Validate user interactions: ** Investigate recent user activity, focusing on clipboard usage and execution of commands via the Run dialog, to assess whether user interactions align with potential exploitation tactics.

  - **Monitor for related alerts: ** Check for companion detections regarding credential dumping or other lateral movement that may indicate further compromise, augmenting context around the behavior detected.

  ### Prioritization

  The alert severity is high due to the potential impact on user systems and the likelihood of exploitation through commonly weaponized techniques by adversaries using social engineering tactics. The presence of HTTP/HTTPS links and associated suspicious keywords significantly increases the risk profile, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if systems do not log registry modifications or if logging configurations are not properly set for key areas. Additionally, benign applications that interact with the RunMRU key could inadvertently trigger alerts, masking malicious activities. Companion detections that enhance coverage include monitoring for abnormal browser activity associated with clipboard hijacking or unusual outbound network traffic following the identified registry modifications.

