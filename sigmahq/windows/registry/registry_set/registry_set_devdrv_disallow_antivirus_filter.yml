note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry related to the disabling of antivirus filter drives on a "Dev Drive." Specifically, it identifies the setting where the value for `FltmgrDevDriveAllowAntivirusFilter` is set to `0`, preventing antivirus software from inspecting the designated drive. The likely objective of an attacker in this scenario is to bypass security controls, facilitating the execution of malicious activities without being detected. This behavior is relevant to the MITRE ATT&CK technique **Disable or Modify Tools (T1685)**, which falls under the tactic of **Defense Evasion**.

  The primary telemetry source is Windows Registry logs, specifically monitoring registry changes. If this change is executed by an unauthorized user or process, it can have significant security implications, potentially allowing malware to operate without detection. Importantly, this detection alone does not confirm that malicious activity has occurred; it merely indicates a configuration change that has the potential to undermine security protocols.

  ### Investigation Steps

  - **Review registry change details:** Examine registry logs for Event ID 4657, confirming the exact timestamp of the change and the user/process responsible for modifying `\FilterManager\FltmgrDevDriveAllowAntivirusFilter` to `0`. Look for suspicious users or unauthorized access attempts.

  - **Identify legitimate user activity:** Check for established policies or recent organizational changes that may require similar modifications to antivirus settings, including Dev Drive usage by developers or IT staff. Cross-reference with help desk tickets or project documentation.

  - **Investigate related processes:** Analyze the process tree around the time of the registry change using Sysmon Event ID 5 (Process Create) to identify any unusual or unauthorized processes that could be linked to potential compromise, especially if the process is not typically related to administrative tasks.

  - **Check for additional indicators of compromise:** Correlate this registry change with other security logs, such as Windows Defender Event IDs, to confirm whether antivirus services were explicitly disabled or alerted during that timeframe.

  - **Validate critical assets:** If applicable, determine whether the affected system is a critical server or endpoint that handles sensitive data or operations, which amplifies the impact of the detected behavior.

  ### Prioritization

  The severity of this alert is high, given that the modification of antivirus settings on a Dev Drive can significantly increase the risk of malware infection and data exfiltration. The likelihood of malicious abuse is high, especially if this activity is initiated outside of documented business processes, as attackers commonly leverage such evasion techniques to create backdoors.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques, such as attackers performing rapid changes that could overwrite or minimize detection opportunities. Organizations must ensure that registry logging is enabled and properly configured to capture all relevant changes. Additionally, legitimate use cases may involve developers configuring their environments, necessitating contextual validation. A related detection can strengthen coverage by monitoring for processes writing to the Dev Drive, indicating potential unauthorized activity.

