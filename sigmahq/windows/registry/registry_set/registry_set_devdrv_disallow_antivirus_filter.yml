  ### Technical Context

  This Sigma rule detects the modification of the registry key that disables an Antivirus mini-filter from inspecting specific drives labeled as "Dev Drives." Attackers may implement this tactic to evade detection by disabling security controls, allowing malicious activity to occur without hindrance. This behavior aligns with the MITRE ATT&CK techniques for defense evasion, specifically T1562.001, which focuses on disabling security tools.

  The primary telemetry source for this detection is the Windows Registry, specifically tracking changes to registry keys related to the Filter Manager. The malicious security impact includes increased risk of malware execution or lateral movement without detection by antivirus programs. This detection does NOT confirm that malicious behavior has occurred; it merely indicates a configuration change that could facilitate an attack.

  ---

  ### Investigation Steps

  - **Check for Recent Registry Changes:** Query the registry for modifications to the key `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\FilterManager\FltmgrDevDriveAllowAntivirusFilter`. Review logs corresponding to these changes (e.g., Windows Event ID 4657) to identify the date, user, and process responsible.

  - **Verify User Account Activity:** Cross-reference the modifying user account with logon events (Event ID 4624) and any unusual activity in the Security logs within the same timeframe. Legitimate user actions on Dev Drives typically involve software development, testing, or troubleshooting tasks.

  - **Analyze Process Creation Logs:** Look for unusual process creation events (Event IDs 4688 or Sysmon Event ID 1) that coincide with the registry change. Pay particular attention to processes related to known development tools or those utilizing elevated permissions.

  - **Identify Malicious Indicators:** Check for the presence of known malicious executables or scripts that may leverage the disabling of the antivirus filter, such as PowerShell scripts or binaries listed in threat intelligence feeds. Use a hash database to correlate any files generated during this period.

  - **Look for Unauthorized Software Installations:** Review application installation logs (Event ID 1033 from the Windows Installer) for any software that has been installed around the time the registry key was modified. Malicious actors often install tools post-filter deactivation.

  - **Consider Asset Criticality:** If the affected system is a production server, prioritize this investigation higher due to the potential for greater impact if simply blocking antivirus is indicative of a broader compromise.

  ---

  ### Prioritization

  The alert is of high severity because it indicates a direct attempt to disable security features, which could lead to undetected malware activity on critical systems. Given the common weaponization of techniques to evade antivirus solutions, investigating this alert promptly is crucial for maintaining enterprise security.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the lack of visibility into the full context of the registry modifications, as legitimate administrative operations or system maintenance tasks could create noise. Ensure logging for registry changes is appropriately configured to avoid gaps in visibility. Users may change registry values for benign reasons, such as testing software functionality. A related detection to strengthen coverage would be monitoring for suspicious file creations or modifications on the same Dev Drive (e.g., Sysmon Event ID 11 for file creation).

