note: |
  ### Technical Context
  This detection rule monitors for changes in the Windows Registry that indicate the disabling of antivirus protections on a "Dev Drive". Specifically, it looks for instances where the ability for the antivirus mini filter driver to inspect this special drive type is switched off, potentially leading to increased risks of malware infection or unauthorized file access. The threat scenario is characterized by an adversary attempting to evade detection by disabling critical security controls, allowing for a more covert operation. This is often part of a broader strategy to establish footholds within a network without triggering alerts.

  Relevant MITRE ATT&CK techniques here include **Defense Evasion** (T1562) and specifically **Disabling Security Tools** (T1562.001). These tactics are commonly employed by attackers seeking to maneuver undetected, as effectively disabling or bypassing security controls like antivirus software can facilitate further malicious activities such as data exfiltration or the introduction of sophisticated malware.

  Primary data sources for this detection are Windows Registry logs, where changes to specific keys related to antivirus filter drivers can be identified. Monitoring of such keys is crucial for understanding changes to the security posture of devices in the enterprise.

  ### Investigation Steps
  - **Review Registry Changes**: Analyze recent changes to the registry path associated with the antivirus filter. Focus on entries related to `\FilterManager\FltmgrDevDriveAllowAntivirusFilter` and note any alterations that disable filters.
  - **Correlate with Endpoint Logs**: Check EDR logs for process creation events around the same time as the registry change. Look for suspicious or unauthorized applications that might attempt to modify security settings.
  - **Examine User Activity**: Investigate user accounts that triggered this registry modification. Review their activity for indicators of compromise, such as unusual login times or access to sensitive areas.
  - **Assess Device Security Posture**: Evaluate the overall security configuration of devices where this change occurred. Check for any other security measures that may have been disabled and consider conducting a health assessment of affected systems.

  ### Prioritization
  This alert should be considered high severity due to the significant implications of disabling antivirus protections, which opens pathways for malware deployment and increases the risk of data breaches. The likelihood of exploitation rises dramatically in environments where security measures are circumvented.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the inability to detect unprivileged users or automated scripts that may change the registry without triggering logs. The detection logic assumes that significant security changes will be logged appropriately but may miss scenarios where logging is inadequate. For this alert to function effectively, active monitoring of the registry is required, along with comprehensive logging settings enabled on Windows devices to capture relevant modifications consistently.

