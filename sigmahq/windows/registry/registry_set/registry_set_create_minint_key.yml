note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry specifically targeting the addition of the 'MiniNt' key, which, when created, effectively disables the Windows Event Log service responsible for recording security events. The likely attacker objective is to suppress logging to evade detection during malicious activities, such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and specifically maps to technique T1562.002, which involves manipulating logging systems to avoid detection.

  The primary telemetry source is the Windows Registry, with specific reference to changes captured by registry set logs. If malicious, disabling event logging greatly increases the risk of undetected illicit activities within the system. This detection, however, does NOT confirm that malicious activity has occurred; it only indicates a potential preemptive measure taken by an adversary.

  ### Investigation Steps

  - **Check the Registry Key Addition:** Verify the presence of 'HKLM\System\CurrentControlSet\Control\MiniNt' using tools like RegEdit or PowerShell commands (`Get-ItemProperty HKLM:\System\CurrentControlSet\Control\MiniNt`). Confirm that the key was recently created or modified.

  - **Review System Event Logs:** Inspect Security Event ID 1102 (Event logs were cleared) in the Windows Security log to correlate with the timing of the registry change. If recent events show logs were cleared, it may indicate malicious intent.

  - **Identify Host Role and Data Sensitivity:** Determine if the system is a critical server (e.g., Domain Controller, database server). If so, prioritize investigating this alert due to higher potential impacts from malicious activity.

  - **Verify Normal System Logging Behavior:** Establish a baseline of typical logging behavior by checking for existing security event counts. For example, ensure that logs are still being generated without gaps before the detection event.

  - **Cross-check User Activities:** Look for any unusual user account activities or access patterns around the time of the registry change in Security Event ID 4624 (Logon) and confirm that they align with expected user behavior.

  - **Evaluate Companion Detection Alerts:** Check for any related detections such as security events related to other defense evasion techniques (e.g., disabling of UAC), which could indicate a broader compromise.

  ### Prioritization

  This alert should be treated with high severity due to its implications on system integrity and security. The likelihood of malicious abuse is strong, as attackers frequently disable logging to avoid detection. This behavior is commonly weaponized during advanced persistent threats (APTs) and other coordinated attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by timing and the speed of the adversary's actions; if the registry key was created and subsequent actions were executed rapidly, analysts may struggle to capture all indicative logs. Also, the alert relies on specific registry monitoring configurations being enabled, which may not always be guaranteed in all environments. Legitimate activities, such as system configuration changes by admins or software installations, could also trigger this alert. Related detections, such as changes to UAC settings or other registry keys associated with logging behaviors, would enhance overall coverage and context.

