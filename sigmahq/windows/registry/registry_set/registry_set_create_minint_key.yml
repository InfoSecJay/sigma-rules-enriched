note: |
  ### Technical Context

  This Sigma rule detects the modification of the Windows registry to include the 'MiniNt' key, which, upon system reboot, disables the Windows Event Log service from logging security-related events. The likely objective of an attacker in this scenario is to avoid detection by disabling logging mechanisms, which impairs the ability to audit system activities and compromises defense measures. This behavior aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically the technique "Disable or Modify Tools" (T1066) and "Impair Defenses" (T1621).

  Primary telemetry sources include registry access logs that capture modifications to registry keys (Event ID 4657 for Windows Security logs). The security impact of this modification is significant, as it eliminates visibility into potential malicious activities on the endpoint. Importantly, while this detection indicates an attempt to disable logging, it does NOT confirm that an attack has occurred or that the system has been compromised.

  ### Investigation Steps

  - **Check for MiniNt Registry Key Addition**: Query for the presence of the 'HKLM\System\CurrentControlSet\Control\MiniNt' key in Security Event ID 4657 logs. A successful modification indicates a potential attempt to disable logging.

  - **Review Event Log History**: Inspect event logs preceding the modification to identify any suspicious activities (Event ID 4100). Look for logs indicating attempts to access sensitive areas or changes in security settings.

  - **Compare with Baseline Activity**: Validate normal operations on the system by reviewing prior registry changes (Event ID 4657). Typically, legitimate updates to registry keys should be well-documented and authorized.

  - **Correlate with Known Indicators of Compromise**: Check for other registry modifications related to logging (e.g., Event ID 4657 for 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System' entries) that may signal an attempt to manipulate auditing features.

  - **Inspect Associated Services**: Verify the state of the Windows Event Log service with a service status check (via 'Get-Service' or equivalent). If the service is stopped without a documented reason, this is a high-confidence malicious indicator.

  ### Prioritization

  Given the potential for significant security impacts if logging is disabled, this alert should be prioritized as high severity. The likelihood of malicious abuse is elevated, as altering logging parameters is a tactic commonly employed by attackers to evade detection during operations.

  ### Blind Spots and Assumptions

  Detection may be limited by systems that do not log registry access modifications or if the logs do not capture the specific keys affected. Legitimate system administration activities, such as legitimate software installations or troubleshooting, could also trigger this alert. A related detection mechanism to consider includes monitoring for unauthorized service stops or restarts, which can provide additional context around potential attempts to disable security monitoring.

