note: |
  ### Technical Context
  This detection rule identifies when specific Windows developer features are enabled, including "Developer Mode" and "Application Sideloading." These features can pose significant security risks as they allow users to install untrusted packages that may bypass standard security measures, thus enabling the installation of potentially malicious applications. Attackers often leverage these capabilities to evade defenses, install malware, or manipulate systems without triggering traditional security alerts.

  The relevant MITRE ATT&CK tactics affected by this activity include **Defense Evasion (T1203)**, which encompasses techniques for bypassing security controls, and **Execution (T1064)**, which is related to running malicious code. The ability to enable developer features can empower threat actors by providing them with further control over a compromised environment.

  The primary data sources for this detection rule include Windows Registry logs, specifically those tracking interactions with the registry keys related to AppModelUnlock and application sideloading. Additionally, EDR solutions may provide further context by exposing processes connected to this registry activity.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows Registry logs for changes to `\Microsoft\Windows\CurrentVersion\AppModelUnlock` and related paths. Pay attention to the values associated with `AllowAllTrustedApps` and `AllowDevelopmentWithoutDevLicense`, looking for any unauthorized changes.

  - **Correlate with EDR Data:** Investigate any process creation or execution events logged by EDR related to the installation or execution of applications post-enablement of developer features. Look for anomalous behavior from unusual executables or scripts.

  - **Analyze Application Install Logs:** Collect logs from the application store or deployment tools to check for recently installed applications or packages, particularly those sourced from outside official distribution methods.

  - **Check User Accounts:** Identify user accounts that enabled these developer features and assess whether they have the appropriate permissions based on organizational policy. This review can help detect any potential misuse of elevated privileges.

  ### Prioritization
  The severity of this alert is high due to the potential for exploitation of developer features, which can open critical paths for attackers to install malware and evade detection mechanisms. Given that these features allow untrusted applications to be installed, the likelihood of serious implications for system integrity and data security is considerable.

  ### Blind Spots and Assumptions
  There is a possibility of gaps in detection coverage, particularly if logging for registry changes is not properly configured or if certain user activities are not monitored by existing EDR tools. The detection logic assumes that enabling developer features is an abnormal behavior in the monitored environment; however, legitimate operational needs may exist. Required logs must include comprehensive registry auditing and relevant process execution data to fully support this detection mechanism.

