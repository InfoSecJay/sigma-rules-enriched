note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry related to enabling developer features, particularly settings that allow for the installation of untrusted applications. The likely objective behind this behavior is to bypass traditional software signing mechanisms, facilitating the deployment of malicious payloads or rogue applications. This activity aligns with the MITRE ATT&CK framework's Defense Evasion tactic (T1203) and the technique for Allowing Unsigned Executables (T1203.001). Primary telemetry sources for this detection include Windows registry changes, specifically monitoring registry paths such as `\Microsoft\Windows\CurrentVersion\AppModelUnlock` and related entries. Malicious exploitation could lead to a significant security impact, as it undermines application integrity and opens avenues for malware installation. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate users could have valid reasons to enable developer features.

  ### Investigation Steps

  - **Identify registry changes:** Examine Windows Event Logs for Registry Event IDs 4657 and 4662, focusing on entries that target `\Microsoft\Windows\CurrentVersion\AppModelUnlock` and `\Policies\Microsoft\Windows\Appx\`. Look for unexpected changes or unusual user accounts making modifications.

  - **Check for context of enabled features:** Determine if "Developer Mode" or "Application Sideloading" was enabled during standard business operations. Look for internal communication or policy approvals documented in a ticketing system that justifies legitimate configuration.

  - **Correlate with software installation events:** Review logs for software installations (Event ID 11707 from MSI Installer, or PowerShell commands related to package management) that follow the timestamp of registry changes, indicating potential misuse of installed features for unauthorized applications.

  - **Identify high-confidence malicious indicators:** Focus on recent installations or executions of applications from unusual paths, particularly those outside of `C:\Program Files` or `C:\Program Files (x86)`. Forensic analysis may reveal names or hashes of known malicious applications linked to this behavior.

  - **Assess asset criticality:** Prioritize investigation on endpoints in sensitive roles (e.g., finance, HR) where bypassing security features could have dire consequences. Review alerts against a list of critical assets to understand potential impact.

  ### Prioritization

  The alert severity is high due to the potential for significant security breaches, as compromised systems could lead to widespread malware deployment. The likelihood of malicious abuse is heightened given that enabling developer features is commonly associated with exploitation techniques. This behavior is weaponized by advanced persistent threats looking to deploy untrusted applications within enterprise networks.

  ### Blind Spots and Assumptions

  Detection may be limited by typical user behaviors, such as enabling developer features for legitimate testing and development purposes, which can trigger false positives. The absence of comprehensive logging or event monitoring in a less mature SOC could also hinder effective detection. Companion detections include monitoring for execution events (e.g., Event ID 4688 for process creations), especially those correlating with newly installed applications following registry changes.

