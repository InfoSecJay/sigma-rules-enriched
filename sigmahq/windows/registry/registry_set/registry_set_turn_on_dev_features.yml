note: |
  ### Technical Context

  This rule detects changes to the Windows registry that enable developer features such as "Developer Mode" and "Application Sideloading". This behavior can allow users to install untrusted applications, bypassing security mechanisms meant to protect the integrity of the system. The likely objective of an attacker leveraging these features includes deploying unauthorized software or malware that evades traditional security detections.

  Relevant MITRE ATT&CK tactics include **Privilege Escalation** (TA0004) through **Scripting** (T1064) and **Execution** (TA0002) through **Malicious File Execution** (T1203). The primary telemetry sources for this detection are Windows registry logs, specifically changes to the `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\AppModelUnlock` and related paths. If malicious, this activity could lead to unauthorized application installation and potential system compromise. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to ascertain intent and impact.

  ### Investigation Steps

  - **Check registry changes directly:** Review registry changes using `reg query "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"` for `AllowAllTrustedApps` or `AllowDevelopmentWithoutDevLicense` set to `1`. A legitimate setting for production systems typically shows these values set to `0`.

  - **Examine user account context:** Identify the user account making the changes by querying Security Event ID 4688 for process creation. Check if the account belongs to a standard user or an admin-level user context, which may indicate potential abuse.

  - **Review system logs for context:** Correlate detected registry changes with Windows Event Logs, particularly Event ID 13 (Registry) for detailed context on what process initiated the change. Look for associations with known applications or scripts.

  - **Identify related application behavior:** Check for the installation of unauthorized applications by reviewing Windows Event ID 7035 (Service Control Manager) or application installation logs. Any installations occurring shortly after registry modifications should be scrutinized.

  - **Monitor for malicious indicators:** Verify the presence of known malicious applications or behaviors that use developer features for persistence, such as unexpected new executables in the `C:\Program Files` directory or file creation timestamps that closely follow the registry changes.

  ### Prioritization

  This alert carries a high severity due to its potential for widespread impact across systems, particularly if developer features enable the execution of malware. The likelihood of exploitation could be significant, as the ability to sideload applications is frequently weaponized by attackers seeking to bypass standard application vetting processes.

  ### Blind Spots and Assumptions

  Detection may be limited by user-level permissions that prevent registry access from being logged accurately. Legitimate activities, such as app development or IT administrative tasks, may trigger these changes. Coverage can be strengthened by monitoring for abnormal behavior in conjunction with Application Execution detections (e.g., unexplained script executions or unusual process trees from related endpoints).

