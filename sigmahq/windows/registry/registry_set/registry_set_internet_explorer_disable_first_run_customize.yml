title: Internet Explorer DisableFirstRunCustomize Enabled
id: ab567429-1dfb-4674-b6d2-979fd2f9d125
status: test
description: |
  Detects changes to the Internet Explorer "DisableFirstRunCustomize" value, which prevents Internet Explorer from running the first run wizard the first time a user starts the browser after installing Internet Explorer or Windows.
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
- https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
- https://admx.help/?Category=InternetExplorer&Policy=Microsoft.Policies.InternetExplorer::NoFirstRunCustomise
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-16
modified: 2025-10-07
tags:
- attack.defense-impairment
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: '\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize'
    Details:
    - 'DWORD (0x00000001)'         # Home Page
    - 'DWORD (0x00000002)'         # Welcome To IE
  filter_main_generic:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\ie4uinit.exe'
  filter_optional_avira:
    Image|contains|all:
    - '\Temp\'
    - '\.cr\avira_'
    Details|contains: 'DWORD (0x00000001)'
  filter_optional_foxit:
    Image:
    - 'C:\Program Files (x86)\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    - 'C:\Program Files\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    Details|contains: 'DWORD (0x00000001)'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- As this is controlled by group policy as well as user settings. Some false 
  positives may occur.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the registry setting "DisableFirstRunCustomize" for Internet Explorer. This setting is used to prevent the initial configuration wizard from appearing when a user first launches the browser, which can indicate unauthorized changes to Internet Explorer behavior. An attacker may aim to disable this feature to facilitate malicious activity by avoiding user prompts that could alert users about unusual browser configurations. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (T1203) and potentially "Initial Access" (T1078) if manipulated for deployment of malicious payloads.

  The primary telemetry source is Windows Registry logs, particularly changes to key values associated with Internet Explorer settings. If malicious, this activity can lead to unmonitored browser usage or compromise user settings, thus increasing exposure to web-based threats. However, this detection does NOT confirm malicious intent on its own, as registry modifications can occur for benign reasons, such as Group Policy updates or legitimate user configurations.

  ### Investigation Steps

  - **Review Registry Changes:** Examine Windows Registry logs for Event ID 4657 to confirm changes to `HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize`. Look for '1' or '2' values indicative of different disablement scenarios.

  - **Check User Context:** Identify the user account (via Event ID 4672) that performed the registry modification. Determine if this is a permissible administrative change or if it indicates anomalous behavior. Legitimate user activity may involve known users or automated remediation processes.

  - **Validate Sampler Process:** Confirm that the process responsible for the change is legitimate. Use Event ID 4688 (Process Creation) to ensure that only expected programs like `explorer.exe` or `ie4uinit.exe` issued the commands, minimizing the risk of malicious execution.

  - **Investigate Related Executables:** If the change was made by `Foxit PDF Reader` or any non-IE native application, check for Event ID 4663 (Access to an Object) to review any additional file or registry interactions that occurred around the same time to assess for possible exploitation attempts.

  - **Correlate with Threat Intelligence:** Match the registry change with known attack patterns using sources like NCSC (referenced in the rule) to identify any recent developments or alerts related to adversarial behavior targeting Internet Explorer modifications.

  ### Prioritization

  This alert is of medium severity due to the potential impact on user browser security settings and the likelihood of malicious abuse in environments where outdated browsers like Internet Explorer are still in use. The alteration of configuration settings is not uncommon for legitimate administrative tasks, but it can be exploited by adversaries to bypass security checks.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques such as direct registry edits using tools that don’t generate standard logs. Reliable detection requires proper logging configurations for registry modifications and awareness of legitimate adjustments made through Group Policy. Legitimate administrative activities can easily trigger the rule, especially in environments with frequent browser updates or GPO refreshes. A companion detection to enhance coverage could involve monitoring for suspicious process creations (Event ID 4688) spanning the execution context around these registry changes.

