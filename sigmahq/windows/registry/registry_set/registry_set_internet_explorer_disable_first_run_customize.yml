title: Internet Explorer DisableFirstRunCustomize Enabled
id: ab567429-1dfb-4674-b6d2-979fd2f9d125
status: test
description: |
  Detects changes to the Internet Explorer "DisableFirstRunCustomize" value, which prevents Internet Explorer from running the first run wizard the first time a user starts the browser after installing Internet Explorer or Windows.
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
- https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
- https://admx.help/?Category=InternetExplorer&Policy=Microsoft.Policies.InternetExplorer::NoFirstRunCustomise
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-16
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: '\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize'
    Details:
    - 'DWORD (0x00000001)'         # Home Page
    - 'DWORD (0x00000002)'         # Welcome To IE
  filter_main_generic:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\ie4uinit.exe'
  filter_optional_avira:
    Image|contains|all:
    - '\Temp\'
    - '\.cr\avira_'
    Details|contains: 'DWORD (0x00000001)'
  filter_optional_foxit:
    Image:
    - 'C:\Program Files (x86)\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    - 'C:\Program Files\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    Details|contains: 'DWORD (0x00000001)'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- As this is controlled by group policy as well as user settings. Some false positives
  may occur.
level: medium
note: |
  ### Technical Context
  This detection rule identifies changes to the "DisableFirstRunCustomize" setting in Internet Explorer, a critical security measure that prevents unauthorized modifications to the browser's initial setup process. The attacker may exploit this setting to manipulate user experience or facilitate malicious activities during the first run of the browser, potentially leading to the installation of unwanted software or malware.

  The context of this rule aligns with the broader threat landscape of cyberattacks targeting user browsers to alter settings for adverse purposes, particularly in the execution of malware or unauthorized browsing activities. This modification may fall under the MITRE ATT&CK techniques of **T1070 - Indicator Removal on Host** and **T1203 - Exploitation for Client Execution**, as attackers often aim to obfuscate their tracks or manipulate trusted applications to execute payloads without users’ knowledge.

  The primary data sources for this detection include Windows registry change logs, which detail modifications made to system settings, specifically the paths related to Internet Explorer configuration.

  ### Investigation Steps
  - **Review Registry Changes:** Check the Windows Registry for modifications to the "DisableFirstRunCustomize" key path. Ensure that any change aligns with expected configurations per organization policy.

  - **Analyze Process Creation Logs:** Examine process creation events around the time of the registry change. Look for unexpected execution of associated processes like `explorer.exe` and `ie4uinit.exe`, which could suggest malicious intent.

  - **Assess Group Policy Settings:** Confirm whether the change aligns with existing Group Policy configurations that may control this setting. Investigate if it was an authorized change or a potential breach.

  - **Correlate with Other Alerts:** Cross-reference this alert with other detection mechanisms (SIEM, EDR) for corroborating indicators of compromise, such as unusual outbound traffic from the system or unexpected application behavior.

  ### Prioritization
  This alert is classified with a medium severity level due to the potential impact of unauthorized changes that can lead to broader compromise. Given that browser settings are critical to user security, a successful manipulation could facilitate additional malware execution or exploitation of organizational resources.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the organization does not maintain comprehensive logging of registry changes or has misconfigured logging levels. The detection logic assumes that all legitimate changes are managed through Group Policy and that users do not manually modify registry settings or install third-party applications that may alter the required behavior. For this alert to function effectively, it is essential to enable detailed registry audit logs and ensure that they are retained for an adequate duration for forensic analysis.

