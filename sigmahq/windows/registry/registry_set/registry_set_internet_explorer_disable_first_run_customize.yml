title: Internet Explorer DisableFirstRunCustomize Enabled
id: ab567429-1dfb-4674-b6d2-979fd2f9d125
status: test
description: |
  Detects changes to the Internet Explorer "DisableFirstRunCustomize" value, which prevents Internet Explorer from running the first run wizard the first time a user starts the browser after installing Internet Explorer or Windows.
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
- https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
- https://admx.help/?Category=InternetExplorer&Policy=Microsoft.Policies.InternetExplorer::NoFirstRunCustomise
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-16
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: '\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize'
    Details:
    - 'DWORD (0x00000001)'         # Home Page
    - 'DWORD (0x00000002)'         # Welcome To IE
  filter_main_generic:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\ie4uinit.exe'
  filter_optional_avira:
    Image|contains|all:
    - '\Temp\'
    - '\.cr\avira_'
    Details|contains: 'DWORD (0x00000001)'
  filter_optional_foxit:
    Image:
    - 'C:\Program Files (x86)\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    - 'C:\Program Files\Foxit Software\Foxit PDF Reader\FoxitPDFReader.exe'
    Details|contains: 'DWORD (0x00000001)'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- As this is controlled by group policy as well as user settings. Some false 
  positives may occur.
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the registry value "DisableFirstRunCustomize" for Internet Explorer, which can indicate a user or malware altered the browser's initial setup behavior. Attackers may seek to disable this feature to prevent users from being presented with security prompts, thereby easing the execution of malicious actions. This action relates to the MITRE ATT&CK technique T1203: Exploitation for Client Execution (exploiting vulnerabilities in client applications like browsers). The primary telemetry source is Windows Registry logs, specifically changes to the key located at `HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer\Main`. If malicious, this could allow greater manipulation of the browser environment for phishing or drive-by download attacks. However, this detection does NOT confirm that malicious activity is occurring by itself, as legitimate configurations may also trigger it.

  ### Investigation Steps

  - **Check registry change logs:** Verify changes to `HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize`. Look for recent modifications (e.g., - Windows Event ID 4657 - indicating a registry value change) and check if it was set to `1` or `2` to validate the rule's trigger.

  - **Correlate user behavior:** Review user activity logs from the same time frame in User Activity Monitoring (UAM) to confirm that the user had legitimate sessions before the registry change. Look for typical user behavior such as browsing patterns and application usage.

  - **Analyze process execution:** Review Security Event ID 4688 (process creation) around the time of the registry change to identify the parent process that initiated this modification. Focus on unusual processes starting with `explorer.exe` or `ie4uinit.exe`, which should be scrutinized for abnormal child processes indicative of potential malware.

  - **Identify known benign conditions:** Validate whether the change corresponds to a Group Policy update or legitimate system image deployments that may adjust this setting. These changes typically align with enterprise-wide updates or software installations at particular times.

  - **Assess related artifacts:** If applicable, check for the existence of known files or artifacts created in user profile directories or temporary folders during the registry change by searching Event ID 4663 (file access) for unauthorized file creation or modification in paths like `C:\Users\<username>\AppData\Local\Temp\`.

  ### Prioritization

  This alert has medium severity due to the potential for impacting user experience and security posture within the organization. Although disabling such features could facilitate malevolent activities, it is less likely that this specific action is regularly weaponized, marking it as a strategic indicator rather than a direct threat.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as process injection or if the change is scripted by legitimate administrative tools. Reliable detection requires adequate logging levels for both security events and registry changes. Note that legitimate user actions, like organization-wide policy adjustments or new software installations, may trigger this alert. A companion detection to monitor could include changes to other Internet Explorer registry values that affect security settings, which would provide a broader context of browser modifications.

