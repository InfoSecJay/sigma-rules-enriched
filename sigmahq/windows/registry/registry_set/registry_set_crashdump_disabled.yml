  ### Technical Context

  This Sigma rule detects changes to the Windows registry that disable crash dump generation by modifying the `CrashControl` settings. Attackers may pursue this to obstruct forensic analysis and hinder incident response efforts, particularly during wiper attacks like HermeticWiper. This behavior aligns with the MITRE ATT&CK technique for “Indicator Removal on Host” (T1112) and “Depriving the Victim of Potential Evidence” (T1564).

  The primary telemetry source for this detection is Windows Registry logs, specifically looking for modifications to `SYSTEM\CurrentControlSet\Control\CrashControl`. If malicious, this action could impede recovery efforts following a targeted attack. Notably, this detection does not confirm the presence of an active threat; legitimate administrative activities may also disable crash dumps for various operational reasons.

  ### Investigation Steps

  - **Verify the Registry Change:** Check the Windows Registry for modifications to `SYSTEM\CurrentControlSet\Control\CrashControl`. Look for `CrashDumpEnabled` set to `0` (DWORD) and note the timestamp of the change alongside the user account making the change.

  - **Review User Account Activity:** Investigate recent actions by the account responsible for the change via Security Event ID 4624 (Logon) and 4740 (Account Locked Out), identifying any suspicious login patterns or geographical anomalies.

  - **Assess System Role and Functionality:** Determine whether the affected system is a critical server or a standard endpoint. In critical systems, this behavior is more concerning, while standard endpoints may warrant a lower threat level if legitimate use is established.

  - **Correlate with Previous Alerts:** Examine past alerts related to suspicious activity, such as process creation or script execution that could relate to an attacker trying to evade detection mechanisms. Focus on Event ID 4688 (Process Creation) for context.

  - **Check for Related Files:** Search for changes in known sensitive files, audit logs, or abnormal file creations in directories typically associated with application data or logs related to crash reports. Investigate the presence of any files created or modified around the same time as the registry entry.

  - **Identify Legitimate Behavior:** Understand that system administrators may disable crash dumps for maintenance or performance tuning. Identify logged activity confirming regulated updates or settings changes in operational procedures.

  ### Prioritization

  This alert is of medium severity due to its potential impact on forensic investigation capabilities, particularly if disabling crash dumps coincides with other suspicious activities. The likelihood of malicious abuse is elevated given the association with persistent threats using denial-of-evidence techniques.

  ### Blind Spots and Assumptions

  Detection relies on consistent Windows Registry logging; if logs are misconfigured or incomplete, it may lead to missed detections. Legitimate administrative processes can trigger this alert, requiring careful context consideration to avoid false positives. Incorporating companion detections for other registry modifications (like service settings or critical system alterations) may enhance overall visibility against evasion tactics.

