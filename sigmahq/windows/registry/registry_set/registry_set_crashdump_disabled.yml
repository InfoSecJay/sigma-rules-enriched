  ### Technical Context

  This rule detects alterations to the Windows registry that disable CrashDump functionality, specifically changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\CrashControl` where the `CrashDump` value is set to `DWORD (0x00000000)`. Attackers may aim to disable crash dumps to hinder incident response efforts, ensuring that any malicious actions taken on a system are not captured for forensic analysis. This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1547) and Defense Evasion (T1564). The primary telemetry sources include Windows registry change events, specifically from Event IDs 4657 (Registry value modified) and relevant Windows API calls for registry manipulation.

  If this behavior is confirmed as malicious, it poses a significant risk as it can prevent the collection of critical system memory snapshots needed during an investigation, facilitating further malware installation or data exfiltration. However, this detection alone cannot confirm malicious activity without additional context, as legitimate system administration may also involve disabling crash dumps.

  ### Investigation Steps

  - **Check for the specific registry modification:** Query the Windows registry for changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\CrashControl` focusing on the `CrashDump` value (DWORD 0). Use Event ID 4657 to see if this modification was logged.

  - **Correlate related events:** Review near-time Event ID 4688 (Process Creation) to identify processes that made registry modifications. Look for unusual parent-child process relationships that may indicate malicious behavior. Pay attention to unexpected executables like PowerShell or cmd.exe.

  - **Identify high-confidence malicious indicators:** Look for additional evidence of behavior consistent with HermeticWiper or similar attack tools. Check for signs of file system changes or unusual network behavior associated with the timeline of registry modifications.

  - **Validate system roles:** Identify the affected system's criticality and role. Determine if the action taken (disabling CrashDump) aligns with standard operational procedures for servers like application hosts or domain controllers.

  - **Establish a baseline of legitimate behavior:** Determine if there was a scheduled maintenance event or normal administrative action that justified disabling crash dumps. Consult the change management log for any documented justifications by IT staff.

  ### Prioritization

  This alert should be treated with medium severity given its potential to impair the organization's defensive capabilities following a breach. Disabling crash dumps is often a step taken by adversaries to obfuscate their actions, making it a relevant point of concern in the context of known attacks. The likelihood of abuse is high, particularly if this behavior is spotted in environments with elevated privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by changes in logging configurations or if registry logs are not enabled consistently across all endpoints. Legitimate system administration activities can also trigger the alert, especially during complex OS updates or while configuring systems. A related detection to strengthen overall coverage includes monitoring for unusual PowerShell commands or script executions that could correlate with potential registry modifications.

