logsource:
  category: registry_set
  product: windows
detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisableCMD'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoControlPanel'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoRun'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\StartMenuLogOff'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableChangePassword'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableLockWorkstation'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableRegistryTools'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableTaskmgr'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispBackgroundPage'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispCPL'
    - 'SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableNotificationCenter'
    - 'SOFTWARE\Policies\Microsoft\Windows\System\DisableCMD'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin'
    - 'Software\Microsoft\Windows\CurrentVersion\Policies\System\InactivityTimeoutSecs'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\shutdownwithoutlogon'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications\ToastEnabled'
    - 'SYSTEM\CurrentControlSet\Control\Storage\Write Protection'
    - 'SYSTEM\CurrentControlSet\Control\StorageDevicePolicies\WriteProtect'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that disable critical internal tools and features, such as Task Manager, CMD, and Control Panel. Attackers, including those using malware like Agent Tesla, may aim to disable these features to limit user control and evade detection mechanisms while conducting malicious activities. The relevant MITRE ATT&CK tactics are Persistence and Defense Evasion, specifically technique T1112 (Modification of Registry).

  The primary telemetry source for this detection comes from Windows Registry logs, where specific modifications to keys will indicate potential malicious behavior. If malicious, these changes can severely affect the security posture of an enterprise, allowing persistent and unrestricted access for attackers. Importantly, this detection alone does not confirm malicious intent or actions; legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Check for recent registry changes**: Review Registry changes for specific Event ID 4657 (Registry Value Modified) that correspond to paths ending with "Policies\Explorer" and "Policies\System" as indicated in the rule. Note if changes were made in a short time frame, which could indicate malicious activity.

  - **Analyze user context**: Investigate the user context under which these registry changes occurred by correlating with Event ID 4624 (Logon). This differentiates between legitimate administrative actions and anomalous activities conducted by unauthorized users.

  - **Review group policies**: Verify if legitimate Group Policy updates have occurred that align with user requests or administrative changes in documented sessions. Look for changes related to "DisableCMD," "NoControlPanel," or "DisableTaskmgr," and compare them against normal operational practices within your environment.

  - **Identify benign indicators**: Cross-reference changes made during the alert time with scheduled maintenance windows or known administrative scripts that could alter registry settings intentionally. If registry changes coincide with legitimate admin actions, this may indicate benign behavior.

  - **Assess for malicious intent**: Check for known malicious user agent strings or process names related to malware such as Agent Tesla in conjunction with registry modifications. Specific Event ID 4688 (Process Creation) logs may reveal launching of suspicious processes post-registry modifications.

  - **Validate against threat intelligence**: Investigate any associated hashes or file artifacts that were created alongside the registry changes. Check for alerts or logs about file creations that match behaviors of known malware linked to command and control activities.

  ### Prioritization

  This alert should be categorized as medium severity due to its implications on system integrity and potential for abuse by an attacker. The affected systems' role as administrative endpoints or any critical assets enhances the importance of immediate analysis. While the behavior is weaponized by sophisticated attackers, it can also be leveraged in benign administrative operations.

  ### Blind Spots and Assumptions

  Limitations of this detection include reliance on accurate and enabled logging for registry modifications, as misconfigurations may lead to missed alerts. Legitimate activities like administrative scripts may also trigger this alert, complicating triage. A related detection to consider would be monitoring for known malicious process creation patterns (e.g., Event ID 4688) that can corroborate the assessment of malicious intent behind registry modifications.

