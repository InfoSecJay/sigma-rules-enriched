title: Disable Internal Tools or Feature in Registry
id: e2482f8d-3443-4237-b906-cc145d87a076
status: test
description: Detects registry modifications that change features of internal Windows
  tools (malware like Agent Tesla uses this technique)
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md
- https://www.mandiant.com/resources/unc2165-shifts-to-evade-sanctions
- https://blogs.vmware.com/security/2022/11/batloader-the-evasive-downloader-malware.html
- https://www.malwarebytes.com/blog/detections/pum-optional-nodispbackgroundpage
- https://www.malwarebytes.com/blog/detections/pum-optional-nodispcpl
- https://bazaar.abuse.ch/sample/7bde840c7e8c36dce4c3bac937bcf39f36a6f118001b406bfbbc25451ce44fb4/
author: frack113, Nasreddine Bencherchali (Nextron Systems), CrimpSec
date: 2022-03-18
modified: 2025-06-04
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisableCMD'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoControlPanel'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoRun'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\StartMenuLogOff'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableChangePassword'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableLockWorkstation'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableRegistryTools'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableTaskmgr'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispBackgroundPage'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispCPL'
    - 'SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableNotificationCenter'
    - 'SOFTWARE\Policies\Microsoft\Windows\System\DisableCMD'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin'
    - 'Software\Microsoft\Windows\CurrentVersion\Policies\System\InactivityTimeoutSecs'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\shutdownwithoutlogon'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications\ToastEnabled'
    - 'SYSTEM\CurrentControlSet\Control\Storage\Write Protection'
    - 'SYSTEM\CurrentControlSet\Control\StorageDevicePolicies\WriteProtect'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to the Windows registry that disable specific internal tools or features, often employed by malware such as Agent Tesla. Attackers may employ this technique to hinder user access to administrative tools, effectively reducing the victim's ability to respond to the compromise or to execute countermeasures. By altering these settings, adversaries can maintain persistence and achieve their malicious objectives with less risk of detection.

  The rule aligns with several techniques within the MITRE ATT&CK framework, particularly T1112: Modify Registry. By targeting key registry entries related to system policies and administrative tools, attackers can manipulate the environment to better serve their goals, such as evading detection or restricting user capabilities. The primary data source for this detection comes from Windows registry change logs, specifically focusing on registry writes that match the defined targets.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows registry logs for entries related to the registry paths defined in the detection rule, particularly focusing on modifications that set the specified keys to `DWORD (0x00000001)`.
  - **Analyze User Activity**: Investigate user account activity logs for any administrative actions or unusual patterns preceding the registry changes, which may indicate a malicious process or behavior leading to the modification.
  - **Correlate with EDR Events**: Utilize EDR telemetry to correlate across processes that executed prior to the registry write events, checking for any associated malware signatures, known tools, or suspicious command-line arguments.
  - **Check for Lateral Movement**: Monitor network logs for any unauthorized access attempts or lateral movement activity that might indicate the presence of an attacker trying to disable essential security features for broader impact.

  ### Prioritization
  The alert is deemed medium priority due to the potential impact of an attacker disabling critical system features that could permit further compromises. The likelihood of detection is moderate, especially in environments with standard monitoring practices.

  ### Blind Spots and Assumptions
  The detection logic assumes that logging is enabled for registry modifications, which is not always the case in every environment. Gaps may exist if attackers modify the registry through methods that go undetected or if legitimate scripts alter the registry in a manner that mimics malicious behavior, potentially leading to false positives. Continuous monitoring and adjustments in detection strategies may be necessary to ensure optimal coverage against this type of threat.

