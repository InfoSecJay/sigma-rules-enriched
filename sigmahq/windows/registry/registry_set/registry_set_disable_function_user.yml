logsource:
  category: registry_set
  product: windows
detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisableCMD'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoControlPanel'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoRun'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\StartMenuLogOff'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableChangePassword'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableLockWorkstation'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableRegistryTools'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisableTaskmgr'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispBackgroundPage'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoDispCPL'
    - 'SOFTWARE\Policies\Microsoft\Windows\Explorer\DisableNotificationCenter'
    - 'SOFTWARE\Policies\Microsoft\Windows\System\DisableCMD'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin'
    - 'Software\Microsoft\Windows\CurrentVersion\Policies\System\InactivityTimeoutSecs'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\shutdownwithoutlogon'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications\ToastEnabled'
    - 'SYSTEM\CurrentControlSet\Control\Storage\Write Protection'
    - 'SYSTEM\CurrentControlSet\Control\StorageDevicePolicies\WriteProtect'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This rule detects modifications to specific Windows registry keys that disable various internal tools and features, such as the command prompt, task manager, control panel, and lock workstation functionality. Attackers often use these techniques to impair the victim's ability to respond to malicious activities, potentially aiming to establish persistence and evade detection. This behavior correlates with the MITRE ATT&CK technique "Disable or Modify Tools" (T1112).

  The primary telemetry source for this detection is Windows Registry change logs, specifically monitoring writes to key paths associated with user interface and administrative controls. If malicious, the impact can include significant hinderance of user capabilities, facilitating further exploitation. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative actions could trigger these alerts.

  ### Investigation Steps

  - **Review registry modification events:** Check Windows Security Event ID 4657 (Registry value modified) for changes to the identified registry keys. Look for sudo-privileged accounts making these changes.
  - **Identify the source of the modification:** Cross-reference with Sysmon Event ID 13 (Registry modified) to pinpoint which process made the registry changes, and evaluate its path and hash for legitimacy.
  - **Check for unusual user behavior:** Examine logs for user accounts that executed administrative scripts or commands (e.g., PowerShell). Look in Event ID 4688 (Process Creation) for command line evidence related to standard admin behavior versus automated tools.
  - **Correlate affected systems for context:** Identify if the modified system is critical (e.g., domain controller vs. standard endpoint) and if other systems exhibit similar registry changes; consider the overall network health.
  - **Determine benign administrative actions:** Confirm if the registry modifications align with known administrative practices, such as user policy changes during maintenance windows or under change control processes.
  - **Confirm malicious indicators:** Look for indications of known malware behaviors associated with the modified registry keys, such as connections to known malicious IPs in DNS logs or unusual outbound traffic in firewall logs.

  ### Prioritization

  This alert should be considered medium priority within an enterprise context. The impact of affected systems could be substantial if they are critical infrastructure components. The likelihood of malicious abuse is significant, as these techniques are common among adversaries to obstruct administrative capabilities and evade detection.

  ### Blind Spots and Assumptions

  One limitation of this detection is its reliance on registry change logs, which may not be enabled on all systems, potentially impacting visibility. Legitimate admin activities, such as system maintenance or troubleshooting, could trigger similar alerts, necessitating careful analysis before concluding malicious intent. This rule's effectiveness is enhanced when combined with detections for lateral movement or changes in user access rights within the environment.

