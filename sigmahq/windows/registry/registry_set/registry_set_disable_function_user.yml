note: |
  ### Technical Context

  This detection rule targets specific registry modifications that disable critical Windows tools and features, typically to evade security measures or hinder user actions. The behavior suggests that an adversary may be attempting to maintain persistence, reduce the victim's ability to respond, or facilitate further malicious actions. The relevant MITRE ATT&CK tactic is "Defense Evasion" (Tactic ID: TA0042) through the technique "Indicator Removal on Host" (T1112).

  The primary telemetry source for this rule is Windows Registry logs, specifically focusing on changes to specific keys that control system features. If these registry settings are modified without legitimate justification, it could indicate malicious intent. However, this detection does not prove that an attack occurred on its own; it only indicates that a configuration change was made to restrict functionality, necessitating further investigation to ascertain intent.

  ### Investigation Steps

  - **Check registry changes for affected keys:** Review the Windows Registry for modifications to the keys detailed in the detection. Look for any changes in `SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer` or `SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` where the value corresponds to `DWORD (0x00000001)`.

  - **Validate recent user activity:** Examine User Account logins (Security Event ID 4624) and correlate with the timestamp of the registry change to verify if a known user or administrator executed the change, which may indicate benign activity.

  - **Review administrative scripts:** Analyze PowerShell (Event ID 400) or any task scheduler (Event ID 4698) logs that may show legitimate administrative scripts running around the time of the registry modifications, confirming whether these changes were part of authorized IT maintenance.

  - **Identify malicious indicators:** Look for other correlating indicators of compromise, such as unexpected process creation (Security Event ID 4688) or execution of known malware binaries (e.g., Agent Tesla), which could signify a malicious actor attempting to disable security features.

  - **Assess host roles and criticality:** Check if the affected system is a critical server or workstation. Evaluate if disabling specific features (like Task Manager or CMD) aligns with standard operational practices for that asset.

  - **Investigate exfiltration indications:** If the detected changes involve disabling notification features or logging utilities, additionally review network traffic logs (firewall or proxy logs) for suspicious outbound connections which may indicate data theft attempts.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on compromised systems; disabling essential tools can significantly impede incident response efforts. The likelihood of malicious abuse is high, as similar techniques have been weaponized in various malware frameworks.

  ### Blind Spots and Assumptions

  Detection may be circumvented if log settings are not configured correctly or if an adversary uses direct registry manipulation through non-logged means. Legitimate activities like routine administrative updates or third-party software installations may inadvertently trigger this alert. Companion detections such as monitoring for unusual logon behavior or process execution originating from unexpected locations can enhance coverage and context for investigation.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
