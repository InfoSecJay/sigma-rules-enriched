logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs\Debugger'
  condition: selection
falsepositives:
- This value is not set by default but could be rarly used by administrators
level: high
note: |
  ### Technical Context
  This rule detects when an attacker modifies the Windows registry to add a "Debugger" entry under the "Hangs" key, a technique often utilized for maintaining persistence on a compromised system. Once established, this persistence method allows malicious actors to execute arbitrary code each time an application crashes, creating a covert foothold that is difficult to detect. The likely objective of such behavior is to ensure that malware remains active and can re-establish itself without requiring further exploitation.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include **Persistence** (TA0003) and the specific technique **Create or Modify System Process: Windows Service (T1543.003)**, as it demonstrates a method of manipulating system processes for continuous access. Detection efforts will focus primarily on the alterations made to the Windows registry, which is where these changes are documented and can be monitored.

  The primary data sources for detecting this behavior are Windows registry set logs. Monitoring modifications to critical registry paths, particularly those associated with application crashes and error reporting, can yield important insights into potential persistence mechanisms employed by attackers.

  ### Investigation Steps
  - **Review Registry Modifications**: Examine Windows registry logs for any changes to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs\Debugger` key, specifically looking for entries added or modified around the time of system anomalies or suspicious activity.

  - **Correlate with Process Creation Events**: Analyze process creation logs to identify any programs that were running at the time the registry modification occurred. This can help in understanding whether the changes align with known legitimate software or anomalous behavior indicative of an attack.

  - **Investigate Application Crash Reports**: Look into application crash reports which may reveal inconsistencies or patterns indicating that an application was unexpectedly terminated and the "Debugger" value was subsequently invoked. This could suggest a possible exploitation path.

  - **Assess Historical Changes**: Conduct a historical review of the registry key to identify the frequency and pattern of changes made over time. Frequent modifications from unknown sources or sudden changes could flag potential malicious persistence efforts.

  ### Prioritization
  The alert is considered high severity due to its implications for attacker persistence in an enterprise environment. If successfully exploited, this technique can enable ongoing control over compromised systems, increasing both the impact and difficulty of remediation efforts.

  ### Blind Spots and Assumptions
  There may be blind spots in this detection logic, particularly with environments heavily utilizing administrative tasks involving registry changes, as legitimate use cases may trigger false positives. The detection assumes that the monitoring of registry keys is appropriately configured and that logs for modifications exist. Additionally, not all persistence mechanisms employ registry modifications solely, which could lead to missed detections of alternative methods employed by attackers.

