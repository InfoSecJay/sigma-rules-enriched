note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry, specifically when a new "Debugger" value is added to the "Hangs" key under the Windows Error Reporting (WER) path. This behavior indicates an attempt by an attacker to achieve persistence, allowing malicious code to be triggered whenever an application crashes. The likely goal for the attacker is to ensure their malicious payload is executed automatically, facilitating ongoing access or data exfiltration.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), and the technique is **Registry Run Keys / Startup Folder** (T1547.001). The primary telemetry sources include Windows Registry modification logs, specifically focusing on modifications to paths such as `SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs`. If successful, this could enable further malicious activities following application crashes. It’s critical to note that this detection does NOT confirm malicious activity on its own, as benign administrative changes could also trigger this alert.

  ### Investigation Steps

  - **Identify recent registry changes:**
    Review Windows Security Event ID 4657 to identify recent changes to registry values, particularly under `SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs`. Check for new Debugger entries and note the timestamp for correlation with other events.

  - **Correlate with process activity:**
    Analyze Sysmon Event ID 1 (Process Creation) for new processes that might align with the timing of the registry modification. Look for unusual command lines or parent-child relationships that indicate possible malicious activity.

  - **Review application crash logs:**
    Examine Windows Event ID 1001 (BugCheck) logs to identify any application crashes related to the activity. Legitimate behavior may show typical application processes crashing and restarting, whereas suspicious entries could indicate repeated and unexpected crashes.

  - **Check for legacy debugging tools:**
    Validate whether known legitimate applications or tools that might add such registry entries (e.g., debuggers) are present on the system. If common debugging tools are absent and a new Debugger key is present, it may be an indicator of malicious intent.

  - **Assess user behavior:**
    Investigate the user account that made the registry modification by correlating with Event ID 4672 (Special Privileges Assigned to New Logon). Look for anomalous login patterns or accounts with elevated privileges that do not typically perform administrative tasks.

  ### Prioritization

  Given the potential high impact of this activity, especially on critical systems, and the likelihood of malicious use for persistence, this alert should be treated with high severity. The technique is also known to be weaponized in various attack scenarios, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use tools or scripts that revert Registry changes after detection. It's crucial to ensure that Windows Registry auditing is properly configured to capture all modifications. Legitimate administrative tasks may also trigger this alert, especially during debugging sessions. A related detection to consider is monitoring for access to the Windows Error Reporting logs to identify abnormal access patterns that support the initial registry change.

