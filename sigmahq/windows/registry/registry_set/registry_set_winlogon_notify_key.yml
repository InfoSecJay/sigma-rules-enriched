note: |
  ### Technical Context

  This rule detects the modification of registry keys that configure the Winlogon Notify system, specifically targeting DLLs that may be executed during user login. An adversary may leverage this persistence mechanism to execute malicious code automatically when a user logs in to the system. The likely attacker objective is to maintain access to the system and execute arbitrary code without user intervention. This behavior is categorized under the MITRE ATT&CK framework as Persistence (T1547.004).

  The primary telemetry sources include Windows Registry logs that capture changes in the HKEY_LOCAL_MACHINE hive under the specific path for Winlogon Notify keys. If malicious, this behavior can allow an adversary to run stealthy malware or backdoors each time a legitimate user logs on, potentially evading detection through normal software firewalls or antivirus solutions. However, this detection does NOT confirm that the executed DLL is malicious on its own.

  ### Investigation Steps

  - **Inspect registry changes:**
    Query the Windows Registry for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify` (e.g., using Event ID 4663). Look for recently added or modified values and confirm if they match the suspicious DLL naming conventions (e.g., unusual or obfuscated names).

  - **Validate DLL legitimacy:**
    Perform a hash lookup for the suspicious DLL against known malware databases like VirusTotal. Check if the DLL is signed by a legitimate publisher or if it has a high number of reported detections.

  - **Review recent logon events:**
    Cross-reference the timestamp of the registry modification with Windows Security Event ID 4624 (Logon) to determine if a logon event correlated with the suspicious changes. This can indicate when the persistence mechanism was activated.

  - **Analyze running processes:**
    Use Sysinternals Process Explorer or similar tools to inspect running processes after a user logon. Look for instances of the modified DLL being loaded and verify parent processes to identify potentially malicious launch patterns.

  - **Assess user roles:**
    Identify whether changes were made on a critical system or high-privileged user’s machine. Monitor any abnormal user activity aligning with suspicious registry modifications, such as unexpected remote administrative commands.

  - **Establish baseline behavior:**
    Document expected behavior for legitimate applications that may modify related registry settings for persistence (e.g., enterprise policy tools) and compare this to the detected activity.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems and the low likelihood of benign use cases. The persistence method indicated is commonly exploited by adversaries for maintaining access, making it a serious flag for potential compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the misconfiguration of log collection, particularly if registry auditing is not enabled comprehensively. Legitimate software installers or updates might trigger similar registry modifications without malicious intent. A related detection to strengthen coverage could involve monitoring for unusual processes spawned at user logon events (e.g., excessive execution of obfuscated PowerShell commands).

