note: |
  ### Technical Context

  This Sigma rule detects changes made to the Winlogon Notify registry key, specifically alterations that involve the execution of DLLs upon user logon. The behavior typically indicates an attempt by an adversary to establish persistence on a compromised system, allowing them to run malicious code during the logon process. The likely attacker objective is maintaining access to the system or executing additional payloads without user awareness.

  This detection is associated with the MITRE ATT&CK technique T1547.004 (Winlogon Notify Key). Primary telemetry sources are Windows registry logs that track modifications to specified registry keys, particularly Event ID 4657 (Registry Value Modified) and related Event IDs. If malicious, this behavior can lead to unauthorized data access or lateral movement within the network. Importantly, while this detection indicates suspicious activity, it does not confirm that the executed code is indeed malicious without further investigation.

  ### Investigation Steps

  - **Check registry modification logs:** Verify Event ID 4657 for the target registry key: `SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify\logon`. Focus on the `NewValue` field to identify any DLLs being registered.

  - **Identify the modified DLL:** Review the relevant timestamp associated with the modification to correlate it with other activity on the host. Malicious modifications will often show uncommon or unrecognized DLL names.

  - **Examine process creation events:** Investigate security event logs (Event ID 4688) around the same timestamps as registry modifications, specifically for process instances of Winlogon.exe or any registered DLLs. Look for unusual parent-child relationships that may indicate payload execution.

  - **Validate legitimate applications:** Cross-reference legitimate applications that utilize the Winlogon Notify key, such as certain enterprise software. Ensure that expected DLLs are authorized and align with known good usage.

  - **Analyze system integrity:** Use tools like Sysinternals' Autoruns to review all entries under Winlogon Notify. Confirm that all loaded DLLs are from trusted sources, checking digital signatures when possible.

  - **Monitor for lateral movement:** Assess other endpoints within the environment for similar registry modifications or abnormal DLL activity, as widespread use may indicate a larger compromise.

  ### Prioritization

  This alert is high priority due to the potential impact on system integrity and security. The behavior is indicative of a tactic commonly weaponized by attackers aiming for persistence, increasing the likelihood of malicious activity on affected systems.

  ### Blind Spots and Assumptions

  There may be challenges in detecting this behavior if security logging is not properly configured or if log sources are not consistently monitored. Legitimate administrative actions or toxic software updates can also trigger this alert. To strengthen detection, consider enabling companion alerts for abnormal process creation associated with Winlogon.exe or monitor network traffic for unusual outbound connections initiated by newly registered DLLs.

