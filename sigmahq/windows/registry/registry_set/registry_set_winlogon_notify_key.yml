note: |
  ### Technical Context
  This detection rule identifies malicious modifications to the Windows Registry specifically targeting the Winlogon Notify Key. Adversaries exploit this feature to establish persistence by executing malicious DLLs or executables automatically during user logon. By manipulating the `Winlogon\Notify` registry key, an attacker can ensure that their malicious code is run every time a user logs on to the system, thereby maintaining a foothold within the environment.

  The potential attacker objectives include maintaining access in the target system, evading detection, and facilitating further attacks such as privilege escalation or lateral movement. This activity falls under the MITRE ATT&CK tactics of **Persistence** (TA0003) and **Privilege Escalation** (TA0004), particularly focusing on the technique **Winlogon Helper DLL** (T1547.004).

  Primary data sources for this detection include Windows Registry logs that capture modifications to specific keys, system event logs related to application starts, and security logs that may note unusual login behaviors or service executions.

  ### Investigation Steps
  - **Review Registry Changes:** Analyze Windows Registry logs to confirm changes to the `SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify\logon` key to identify unauthorized DLL entries.
  - **Examine Application Logs:** Inspect logs from the Windows Event Viewer, particularly under the Application and Security categories, for events that may indicate the loading of unexpected DLLs during the user login process.
  - **Correlate User Activity:** Investigate user login events to track any associated account activity that may correlate with the time of the registry modification, looking for suspicious patterns or anomalous logon attempts.
  - **Assess System Integrity:** Utilize endpoint detection and response (EDR) tools to scan for the presence of the suspicious DLL identified in the registry modification and evaluate its behavior on the system to determine if it exhibits malicious characteristics.

  ### Prioritization
  This alert is considered high severity due to the potential impact of a successfully executed persistence mechanism on the enterprise environment. The ability for an attacker to maintain long-term, undetected access poses significant risk, especially if sensitive data is at stake or lateral movement within the network is facilitated.

  ### Blind Spots and Assumptions
  The detection logic assumes that all relevant registry changes are adequately logged and that the monitoring solution is configured to capture these modifications effectively. A potential gap in coverage exists if logging is not enabled for registry changes or if users employ techniques to obscure their modifications. Furthermore, the reliability of detection may be hindered if an adversary deletes or alters logs between the registry change and the next logon event. Proper configuration of logging settings for registry changes and thorough auditing practices are necessary for this alert to be effective.

