note: |
  ### Technical Context

  This Sigma rule detects the modification of the Windows registry setting related to the Vulnerable Driver Blocklist, specifically when it is set to disabled (DWORD value of 0). This behavior is indicative of a potential attempt by an attacker to bypass security measures that prevent the loading of known vulnerable drivers. The likely objective of such an action is to introduce malicious or non-secured drivers onto a system, which can facilitate further exploitation or persistence.

  This detection corresponds to the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Vulnerable Driver Blocklist Bypass" (T1685). The primary telemetry source for this detection comes from Windows registry modifications, specifically monitoring the registry path `\Control\CI\Config\VulnerableDriverBlocklistEnable`. If successful, this action could allow an attacker to deploy drivers that may be used for malicious purposes, severely impacting system integrity. However, this detection alone does not confirm that a malicious driver was successfully loaded or that an active compromise is taking place.

  ### Investigation Steps

  - **Check registry value modification:** Review the registry path `HKEY_LOCAL_MACHINE\Control\CI\Config\VulnerableDriverBlocklistEnable` for changes logged by the Windows Event Log (Event ID 4663). Look for entries where the Value is set to `0` and note the timestamp and user associated with this change.

  - **Validate recent driver installations:** Investigate the Driver Store located at `C:\Windows\System32\DriverStore\FileRepository\` for any recent installations or modifications (e.g., creation dates within the last 30 days). Check for any driver files that are unsigned or have unusual names.

  - **Assess system reboot history:** Since changes to the Vulnerable Driver Blocklist require a system reboot, review Event ID 6005 in the Windows Event Log to confirm if a reboot occurred shortly after the registry change. This helps in understanding the timing of the event.

  - **Identify unauthorized users:** Examine the logs tied to user accounts who have permissions to alter system settings, particularly those with admin rights. Event ID 4672 can help identify logins by accounts with special privileges, indicating who may have made the change.

  - **Distinguish benign behavior:** Compare the log entry timestamps with known software deployment or patch cycles. For instance, legitimate actions related to system updates during maintenance windows could explain registry changes.

  - **Look for known malicious patterns:** Audit the loaded drivers using PowerShell commands like `Get-WindowsDriver` or `Get-PnpDevice` to find any drivers that have been loaded post-reboot that match signatures of known threats recorded in threat intelligence databases.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant security impacts on the affected system. The likelihood of this behavior being malicious is elevated, especially in environments where stringent security controls are in place. The technique of disabling the Vulnerable Driver Blocklist is recognized as a common method used by attackers to bypass security mechanisms.

  ### Blind Spots and Assumptions

  Detection may miss cases where attackers use alternative methods to hide registry changes, such as using rootkits or employing script-based alterations to obscure their actions. Reliable detection requires that Windows Registry auditing is enabled across all endpoints. Legitimate software vendors may occasionally modify this setting during installation or updates, making context vital for triage. A related detection rule to consider reinforcing this coverage is monitoring for the loading of unsigned drivers, which can indicate a compromise despite the registry setting.

