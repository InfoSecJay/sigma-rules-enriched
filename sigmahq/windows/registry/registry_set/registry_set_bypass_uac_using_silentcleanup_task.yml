note: |
  ### Technical Context

  This rule detects changes to the `windir` environment variable, specifically when it is set to a non-default value. Attackers may manipulate this variable to exploit the `SilentCleanup` task, a built-in Windows utility that can execute tasks with elevated privileges without prompting User Account Control (UAC). The likely objective is to achieve unauthorized privilege escalation (MITRE ATT&CK tactic: Privilege Escalation; technique: T1548.002). The primary telemetry sources include Windows Registry logs, specifically registry object modifications associated with environment settings.

  If the detection is valid, it indicates a significant security risk, as it could facilitate the execution of malicious payloads with elevated privileges. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate system operations could inadvertently trigger this alert.

  ### Investigation Steps

  - **Review Registry Changes:** Check Windows Registry for Event ID 4657 (Registry Value Modified) related to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Environment\` to confirm any modification of the `windir` variable.

  - **Validate Time of Change:** Cross-reference the timestamp of the registry modification with other system activity logs (e.g., Event ID 4688 for Process Creation) to determine if there were unusual processes running at that time.

  - **Assess System Role:** Identify the system role where the alert was triggered (e.g., server vs. workstation). Behavioral baselines may differ; for example, server tasks should not be altering environment variables regularly.

  - **Look for Malicious Indicators:** Investigate any associated processes (e.g., `cleanmgr.exe` execution) occurring shortly after the registry change. Check Event ID 4688 for new process creations with parent-child relationships indicating unusual behavior (e.g., running an installer or unknown executable).

  - **Identify Benign Context:** Confirm if there have been legitimate changes by checking organizational change management logs or if the system is undergoing maintenance. Expected behavior would be system administrators making controlled changes to variables in a managed environment.

  ### Prioritization

  This alert is high severity due to the potential impact on system security, especially if the affected system has administrative functions. The ease with which this technique can be weaponized by attackers necessitates prompt investigation and response.

  ### Blind Spots and Assumptions

  There is a risk of false positives from legitimate administrative activities or scheduled tasks that modify environment variables. Reliable detection requires proper configurations for registry logging and event monitoring. Legitimate applications may also adjust the `windir` variable during installation or updates, potentially triggering this alert. A related detection for monitoring elevated command executions (e.g., processes launched with `runas` or similar commands) could enhance coverage against this technique.

