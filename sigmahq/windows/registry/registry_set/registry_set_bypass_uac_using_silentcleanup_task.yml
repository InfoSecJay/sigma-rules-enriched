note: |
  ### Technical Context

  This Sigma rule detects the modification of the "windir" environment variable to a non-default value, which attackers exploit to perform a User Account Control (UAC) bypass using the SilentCleanup task. The likely objective of the attacker is to gain elevated privileges silently to execute malicious code without raising alerts. This behavior maps to MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The primary telemetry source for this rule is Windows Registry modifications, specifically logs related to registry set actions. If an adversary is successful in manipulating this variable, they could potentially execute high-impact actions with administrative rights, posing a significant risk to the security posture of the affected system. It is crucial to clarify that this detection does NOT confirm an active compromise; it only indicates a suspicious modification of the "windir" variable.

  ### Investigation Steps

  - **Check registry modifications:** Review Windows Registry logs for Event ID 4657 (a registry value was modified) associated with the path `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Environment\windir`. Look for values that are not '%SystemRoot%'.

  - **Determine context of modification:** Verify the user account responsible for the change. Activity from service accounts or SYSTEM user might be suspicious if it's not aligned with normal operational behavior.

  - **Identify legitimate usage scenarios:** Confirm if the change in the "windir" environment variable was a legitimate process, perhaps by cross-referencing with recent software installations or updates that may require this variable to be set differently.

  - **Look for elevated tasks running:** Investigate if the SilentCleanup task (found at `%windir%\system32\cleanmgr.exe`) has been executed shortly after the modification. This can be ascertained from Task Scheduler logs (Event ID 106) for potentially unauthorized runs.

  - **Identify malicious indicators:** Sample other suspicious registry modifications in tandem, particularly looking for Event ID 4663 (an attempt to access an object), which may indicate additional malicious behavior tied to privilege escalation.

  ### Prioritization

  The alert should be treated with high priority because it involves a sensitive modification that could facilitate privilege escalation. The likelihood of exploitation is significant due to the nature of the UAC bypass and its potential widespread abuse among threat actors. Furthermore, such modifications are often weaponized in various attack scenarios, including ransomware deployments or backdoor installations.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive registry auditing or potential obfuscation techniques employed by advanced adversaries to hide their actions. False positives could arise from legitimate applications altering the "windir" variable for configuration purposes, especially in enterprise environments with custom software solutions. It would be beneficial to supplement this rule with additional detections focusing on scheduled task manipulations, which can provide context and reinforce confidence in interpreting the modifications as malicious.

