logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations'
  selection_susp_paths:
    Image|contains: '\Users\Public\'
            # - '\AppData\Local\Temp\'  # Commented out as it's used by legitimate installers
  selection_susp_images:
    Image|endswith:
    - '\reg.exe'
    - '\regedit.exe'
  condition: selection_main and 1 of selection_susp_*
falsepositives:
- Installers and updaters may set currently in use files for rename or deletion 
  after a reboot.
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized modifications to the "PendingFileRenameOperations" registry key, specifically from suspicious image locations or via uncommon executables. The likely objective for an attacker includes masking their presence by staging files for deletion or renaming during the next system reboot. This activity falls under the MITRE ATT&CK tactic of Defense Evasion (T1070) and specifically targets technique T1036.003 for "Masquerading."

  Primary telemetry utilized for this detection stems from Windows registry modifications, particularly the "registry_set" log source, which captures information when the registry is altered. If malicious, this behavior could allow an adversary to maintain persistence and evade detection. Notably, this detection does NOT confirm malicious intent on its own, as legitimate applications may modify this registry key as part of their standard operations.

  ### Investigation Steps

  - **Identify the modifying executable:** Investigate the `Image` field in the registry logs (Event ID 4657) for entries indicating that `reg.exe` or `regedit.exe` were used to modify the "PendingFileRenameOperations" registry key. Any occurrence from uncommon paths (e.g., `\Users\Public\`) should be flagged for review.

  - **Check for malicious indicators:** Look for signs of file renaming or deletion in the registry keys under `HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations`. If the associated executable path is atypical and from a previously identified compromise, this is a high-confidence malicious indicator.

  - **Review legitimate behavior examples:** Compare the entries with typical vendor installer paths (e.g., `C:\Program Files\...` or `C:\Windows\...`). Legitimate installers frequently adjust PendingFileRenameOperations for legitimate upgrades or installations.

  - **Examine system event logs:** Review System Event ID 1074 logs for any unexpected reboots or shutdowns following the registry modification timestamps. This may provide context previous to the suspicious changes.

  - **Analyze recent activity:** Conduct a broader investigation within the host for any other suspicious modifications or commands executed (Event ID 4688) around the same timeframe as the registry key modification to piece together the attack timeline.

  - **Validate file system changes:** Inspect the file system using tools like Windows Explorer or PowerShell to determine if there are renamed or deleted files correlating with the registry entry modifications.

  ### Prioritization

  This alert carries a medium severity due to the potential impact on system integrity. While modifications to this registry key can be associated with malicious activity, they may also occur during legitimate software updates. However, the likelihood of exploitation for persistence mechanisms makes this behavior noteworthy, especially if it originates from uncommon executable paths.

  ### Blind Spots and Assumptions

  Detection may be limited if the attacker's tools are able to mimic legitimate executables which could result in similar registry changes without raising alarms. Additionally, the alert might trigger from legitimate software installers which may use unusual paths under certain conditions. An associated detection to strengthen coverage would be monitoring for unusual process creations (Event ID 4688) around these modifications to catch any malicious process initiating the registry change.

