title: Potential PendingFileRenameOperations Tampering
id: 4eec988f-7bf0-49f1-8675-1e6a510b3a2a
status: test
description: |
  Detect changes to the "PendingFileRenameOperations" registry key from uncommon or suspicious images locations to stage currently used files for rename or deletion after reboot.
references:
- https://any.run/report/3ecd4763ffc944fdc67a9027e459cd4f448b1a8d1b36147977afaf86bbf2a261/64b0ba45-e7ce-423b-9a1d-5b4ea59521e6
- https://devblogs.microsoft.com/scripting/determine-pending-reboot-statuspowershell-style-part-1/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc960241(v=technet.10)?redirectedfrom=MSDN
- https://www.trendmicro.com/en_us/research/21/j/purplefox-adds-new-backdoor-that-uses-websockets.html
- https://www.trendmicro.com/en_us/research/19/i/purple-fox-fileless-malware-with-rookit-component-delivered-by-rig-exploit-kit-now-abuses-powershell.html
author: frack113
date: 2023-01-27
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations'
  selection_susp_paths:
    Image|contains: '\Users\Public\'
            # - '\AppData\Local\Temp\'  # Commented out as it's used by legitimate installers
  selection_susp_images:
    Image|endswith:
    - '\reg.exe'
    - '\regedit.exe'
  condition: selection_main and 1 of selection_susp_*
falsepositives:
- Installers and updaters may set currently in use files for rename or deletion after
  a reboot.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential tampering with the Windows registry key "PendingFileRenameOperations," which is commonly used by malicious actors to stage files for renaming or deletion upon system reboot. The objective behind such tampering is often to maintain persistence or to ensure that malicious payloads are executed without user consent or detection during the normal operation of the system. Attackers exploiting this vector may include those using fileless malware techniques or backdoors like Purple Fox, which leverage legitimate Windows processes to subvert security mechanisms.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and techniques such as **Masquerading** (T1036.003). By modifying the PendingFileRenameOperations key from suspicious image paths, threat actors can obscure their activities and evade detection during routine security monitoring. The primary data source for this alert is registry change logs that capture modifications to the registry, specifically focusing on the Session Manager's PendingFileRenameOperations.

  ### Investigation Steps
  - **Review Registry Change Logs:** Examine logs for modifications to the "PendingFileRenameOperations" key, specifically looking for entries that don't originate from known, trusted sources.
  - **Investigate Image Paths:** Identify and assess any programs modifying the registry that reside in uncommon paths such as `C:\Users\Public\`. Pay attention to unusual or unauthorized applications associated with these changes.
  - **Correlate with Process Execution Logs:** Check process creation events around the time of the registry modification to identify any execution of `reg.exe`, `regedit.exe`, or other associated processes that may have triggered the changes.
  - **Evaluate System Reboot Schedule:** Analyze any scheduled tasks or anomalies in system reboots that correlate with registry modifications to understand the intent behind the potential tampering.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of attackers using this technique to gain persistence and execute malware without user awareness. Given the nature of file modifications tied to reboot sequences, prompt investigation is essential to prevent potential system compromise.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on specific image path indicators that could yield false positives; legitimate installers may also modify the PendingFileRenameOperations key. The detection logic assumes any modifications from uncommon locations indicate malicious intent, which may not always be accurate. For this alert to function effectively, the collection of detailed registry log events must be enabled and adequately configured to capture all changes made to the specified registry key.

