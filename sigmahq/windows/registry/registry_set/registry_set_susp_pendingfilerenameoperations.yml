title: Potential PendingFileRenameOperations Tampering
id: 4eec988f-7bf0-49f1-8675-1e6a510b3a2a
status: test
description: |
  Detect changes to the "PendingFileRenameOperations" registry key from uncommon or suspicious images locations to stage currently used files for rename or deletion after reboot.
references:
- https://any.run/report/3ecd4763ffc944fdc67a9027e459cd4f448b1a8d1b36147977afaf86bbf2a261/64b0ba45-e7ce-423b-9a1d-5b4ea59521e6
- https://devblogs.microsoft.com/scripting/determine-pending-reboot-statuspowershell-style-part-1/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc960241(v=technet.10)?redirectedfrom=MSDN
- https://www.trendmicro.com/en_us/research/21/j/purplefox-adds-new-backdoor-that-uses-websockets.html
- https://www.trendmicro.com/en_us/research/19/i/purple-fox-fileless-malware-with-rookit-component-delivered-by-rig-exploit-kit-now-abuses-powershell.html
author: frack113
date: 2023-01-27
modified: 2025-10-07
tags:
- attack.stealth
- attack.t1036.003
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations'
  selection_susp_paths:
    Image|contains: '\Users\Public\'
            # - '\AppData\Local\Temp\'  # Commented out as it's used by legitimate installers
  selection_susp_images:
    Image|endswith:
    - '\reg.exe'
    - '\regedit.exe'
  condition: selection_main and 1 of selection_susp_*
falsepositives:
- Installers and updaters may set currently in use files for rename or deletion 
  after a reboot.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the "PendingFileRenameOperations" registry key from suspicious image paths, which can indicate an attacker’s activity to rename or delete files on the next system reboot. The likely objective of this behavior is to establish persistence or to remove evidence of malicious activity by staging files for deletion upon system restart. This detection correlates with the MITRE ATT&CK technique for obfuscation and evasion, specifically T1036.003 (Masquerading: Match Legitimate Name or Location).

  The primary telemetry sources involved are Windows registry changes, specifically monitoring registry set events related to the key at `\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations`. If malicious, this behavior could lead to data loss, service disruption, or further exploitation. Importantly, this detection does NOT confirm malicious activity on its own, as similar registry modifications can occur in legitimate scenarios, such as software installations or updates.

  ### Investigation Steps

  - **Review registry modification source:**
    Check for the source of the modification by inspecting Windows Security Event ID 4657 (Registry Value Changed). Look for information on the user account and process responsible for the modification.

  - **Examine images in suspicious paths:**
    Investigate the `Image` field for any processes ending with `reg.exe` or `regedit.exe`. Note if these processes are running from uncommon directories such as `C:\Users\Public\`, which is atypical for legitimate usage.

  - **Identify legitimate behavior sources:**
    Confirm if the modification corresponds with known legitimate installers (i.e., products that typically use the PendingFileRenameOperations key). Review installation logs or processes running during the alert instance.

  - **Correlate with chain events:**
    Look for other indicators of compromise (IOCs) surrounding this alert, such as unusual outbound connections or unauthorized file access attempts in the timeframe around registry changes.

  - **Collect system artifacts:**
    Validate file system artifacts related to the renamed files by querying the filesystem for items denoted in the PendingFileRenameOperations. Look for temporary files or registry modification dates that align with these items.

  - **Investigate context of file renaming:**
    Gather data on the intended files for renaming or deletion listed in PendingFileRenameOperations. Check if these files are critical system files or application components, as benign scenarios are generally limited to non-essential files.

  ### Prioritization

  This alert is of medium severity as it indicates potential tampering on critical system functionality. The impact of affecting the PendingFileRenameOperations may compromise system integrity or facilitate further attacks. While tainted by potential false positives from legitimate software behavior, the technique is often exploited by adversaries for stealth and persistence.

  ### Blind Spots and Assumptions

  This detection may suffer from evasion techniques such as using legitimate processes from atypical locations to mask malicious actions. It relies on the integrity of registry monitoring, and if configurations for monitoring are weak, relevant changes could be missed. Legitimate software installers may also trigger this alert by updating files with similar mechanisms. A related detection could include monitoring for unusual file creations or modifications within system critical directories to complement the visibility of this activity.

