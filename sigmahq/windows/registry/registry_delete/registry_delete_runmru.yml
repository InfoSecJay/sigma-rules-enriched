note: |
  ### Technical Context

  This Sigma rule detects the deletion of the RunMRU registry key, which holds a history of commands executed via the Run dialog in Windows. Attackers may target this key to erase evidence of malicious commands after executing them, thereby hindering incident response efforts and obfuscating their activities within the system. The primary relevant MITRE ATT&CK technique is “Indicator Removal on Host” (T1070.003).

  The main telemetry sources for this detection are Windows Registry change logs, specifically looking at the deletion of the registry key at `\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. If malicious, this activity could indicate a broader intrusion or post-compromise maneuver. Importantly, this detection does NOT confirm that a system is compromised on its own, as legitimate applications or users may also modify these registry keys.

  ### Investigation Steps

  - **Review Windows Registry Logs:** Verify the deletion of the RunMRU registry key using Windows Registry logs (Event ID 4657), specifically checking for the `TargetObject` field ending in `RunMRU`. Look for unexpected deletions outside of maintenance windows.

  - **Check for Suspicious Process Activity:** Investigate processes that may have executed shortly before the registry deletion. Focus on process creation logs (Event ID 4688 and Sysmon Event ID 1) for any unusual command-line arguments or unexpectedly high privilege levels.

  - **Identify Pattern of Command Execution:** Evaluate the history of commands executed via the Run dialog by checking for execution patterns. This can be done by consulting recent user activity logs or user profiles that interact with the Run dialog.

  - **Correlate with Known Malware Behavior:** Look up the associated command executions preceding the registry deletion against threat intelligence feeds for known malware behavior related to registry tampering or command-and-control communications.

  - **Validate Legitimate Uses:** Determine if any recent administrative activities required changes to startup configurations or script executions that might explain the registry key deletion. Check against known change control records.

  - **Monitor for Related Remediation Steps:** Ensure that no subsequent actions were taken to re-establish or monitor the deleted key; this may indicate an attempt to set up persistence, which could require deeper investigations into user behavior and host integrity.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on host integrity and the likelihood of malicious abuse. The deletion of the RunMRU registry key is a tactic commonly used in post-compromise scenarios to erase traces of adversary actions, indicating a heightened risk of systemic compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions since only users with administrative rights can modify or delete the RunMRU key. Legitimate system maintenance or configuration updates could also trigger this alert. Consider related detections such as process execution or other registry modifications in the vicinity of this event to strengthen coverage and context.

