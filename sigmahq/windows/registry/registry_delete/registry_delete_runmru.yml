note: |
  ### Technical Context
  This detection rule identifies attempts to delete the RunMRU (Most Recently Used) registry key located at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. The RunMRU key is crucial as it logs commands executed via the Run dialog (Win + R) on Windows systems. Attackers may target this key to erase evidence of their actions, particularly after executing commands that could expose malicious activities, such as running malware or changing system settings.

  The threat scenario involves adversaries employing tactics aimed at evading detection and covering their tracks post-exploitation. This behavior is commonly seen in various threat actors attempting to eliminate signs of compromise or unauthorized activity. The associated MITRE ATT&CK technique for this activity is **T1070.003: Indicator Removal on Host**.

  Primary data sources for this detection include registry change logs specifically focusing on deletions, which can be collected through Windows Event Logs monitoring registry actions. These logs provide critical insights into potential malicious behavior and help establish timelines of commands executed by users.

  ### Investigation Steps
  - **Review Registry Change Logs:** Analyze the Windows registry delete event logs for any deletions associated with the RunMRU key. Focus on the timestamp and the user account that performed the action.

  - **Correlate User Activity:** Check for other user actions or commands executed via the Run dialog leading up to the deletion. This may provide context about why the key was deleted and if any malicious commands were executed.

  - **Investigate Recent Applications:** Look into recently installed or executed applications that may have prompted the user to run commands through the Run dialog. Determine if there are any signs of potential exploitation or misuse.

  - **Identify User Access Patterns:** Assess the user accounts with administrative privileges who may have the capability to delete such registry keys. This can help identify if a legitimate user account was compromised or if an unauthorized account is being used.

  ### Prioritization
  This alert holds high severity because it signifies potential malicious activity designed to obscure an attacker's footprint. In an enterprise setting, the deletion of the RunMRU registry key may indicate that an adversary has successfully executed commands to compromise the environment, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where deletion events are not captured due to insufficient logging configurations or if the logs are not retained long enough for analysis. It assumes that registry monitoring is adequately configured in the environment and that attackers won't employ other techniques for cleanup or track removal. Additionally, the rule may generate false positives from legitimate administrative actions taken by users or software installations that delete the key as part of their process.

