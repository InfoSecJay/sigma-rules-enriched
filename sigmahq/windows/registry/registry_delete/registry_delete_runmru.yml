note: |
  ### Technical Context

  This Sigma rule detects the deletion of the RunMRU registry key, which logs commands executed via the Windows Run dialog. Attackers may exploit this key by executing malicious commands and subsequently deleting it to erase tracks of their activity. This behavior primarily aligns with the MITRE ATT&CK framework, specifically under the tactic of "Defense Evasion" and technique T1070.003 (Indicator Removal on Host).

  The primary telemetry source is Windows Registry Delete logs, specifically targeting deletion events of the RunMRU key located at `\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. If malicious, this action potentially signals an effort to conceal unauthorized activities. It’s critical to note that this detection does not confirm malicious intent by itself, as legitimate users could also delete this key.

  ### Investigation Steps

  - **Confirm registry deletion event:** Review Windows Security Event ID 4657 to verify registry key deletion and check the Object Type and Process Name fields for any unusual entries relating to `RunMRU`. Look for the user account involved—if it belongs to a known IT user, this may be benign.

  - **Analyze the Process Tree:** Investigate the process that initiated the deletion. Check Sysmon Event ID 1 or Process Monitor logs to see if the process is linked to a legitimate application or if it’s a suspicious command-line execution, potentially indicating malicious activity.

  - **Review command history:** Examine the `RunMRU` key contents (via regedit or PowerShell) prior to deletion to identify any recently executed commands that could indicate unauthorized activity. Compare these with known benign commands to find anomalies.

  - **Correlate with user behavior:** Investigate the user’s behavior before and after the deletion using Security Event ID 4624 (logon events). Look for any unusual logon times or failed logons which may indicate account compromise.

  - **Identify related alerting:** Cross-reference with any alerts triggered by related detections such as suspicious PowerShell execution (e.g., via PowerShell logs or CMD line logs) to establish a pattern of malicious behavior.

  - **Monitor for persistent artifacts:** If deletion was malicious, check for persistence mechanisms such as new scheduled tasks or modifications to startup programs that could highlight an attempt to maintain access. Explore Windows Event Logs specifically related to Task Scheduler operations or application compatibility.

  ### Prioritization

  The alert is of high severity due to the possible deletion of a key indicator that could lead to undetected malicious activity on critical systems. The likelihood of this behavior being weaponized is high, particularly as it is a common tactic used by adversaries to evade detection and mask their operational footprint.

  ### Blind Spots and Assumptions

  This detection may miss cases where the deletion of the RunMRU key is performed via legitimate administrative tasks, leading to potential false positives. Log sources must be configured correctly to capture registry modifications, requiring a thorough review of group policies and auditing settings. Related detections, such as suspicious execution logs or abnormal user activity, can enhance coverage and provide a more comprehensive view of potential malicious actions in the environment.

