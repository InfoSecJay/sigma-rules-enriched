note: |
  ### Technical Context

  This Sigma rule detects the deletion of specific registry keys associated with Anti-Malware Scan Interface (AMSI), specifically under `HKLM\Software\Microsoft\AMSI`. Such actions are indicative of an attacker attempting to disable AMSI, a key component of Windows security designed to detect and block malicious activities. The likely objective is to bypass security measures that inspect scripts and executables for malware signatures before execution.

  This behavior falls under the MITRE ATT&CK framework's **Defense Evasion** tactic (Technique T1562.001). The primary telemetry source is registry delete logs, specifically targeting the deletion events of registry keys. If this activity is confirmed to be malicious, it could lead to undetected exploitation and lateral movement within the environment. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may also modify these keys during their operations.

  ### Investigation Steps

  - **Check registry delete events**: Review Windows Event ID 4657 for deletions of the AMSI provider keys: `{2781761E-28E0-4109-99FE-B9D127C57AFE}` and `{A7C452EF-8E9F-42EB-9F2B-245613CA0DC9}`.

  - **Verify process origins**: Analyze the process logs associated with the deletion (look for Event ID 4688 or Sysmon Event ID 1) to ensure they originated from legitimate processes like `MsMpEng.exe` and not from potentially malicious executables.

  - **Identify anomalous execution patterns**: Correlate the timestamp of the registry deletion with other suspicious activity in the logs, particularly high-Risk Event IDs (e.g., PowerShell script executions, WMI calls).

  - **Assess impacted system role**: Determine if the affected workstation or server is a critical system, and note whether it has responsibilities that justify modifications to AMSI, such as development environments that may configure security settings.

  - **Review typical AMSI behavior**: Confirm normal operations where AMSI is utilized for applications targeting scripts (such as PowerShell) to ensure no legitimate processes have executed harmful bypass attempts.

  - **Correlate with previous detections**: Look for any related alerts regarding offensive techniques for disabling security mechanisms within the same time frame, as this can indicate a broader malicious campaign.

  ### Prioritization

  Given the potential for a compromise and the critical role AMSI plays in preventing execution of malicious scripts, this alert is high severity. The likelihood of exploitation is significant, as disabling AMSI is a common tactic for attackers looking to deploy malware or conduct lateral movement.

  ### Blind Spots and Assumptions

  Detection might be limited if log sources are not properly configured to capture detailed registry changes. Legitimate software updates or developer tools may also modify AMSI settings, causing possible false positives. Additional coverage via detections for process injection or script execution events (e.g., PowerShell command activities) can enhance alert validation and context during investigations.

