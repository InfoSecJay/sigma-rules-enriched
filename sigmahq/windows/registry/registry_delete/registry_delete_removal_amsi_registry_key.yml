note: |
  ### Technical Context
  This rule detects instances where an attacker removes specific AMSI (Antimalware Scan Interface) provider registry keys from the Windows Registry path `HKLM\Software\Microsoft\AMSI`. The removal of these keys can disable the AMSI, a critical feature designed to help applications detect malicious content before execution. Attackers may aim to bypass security controls, making it easier for them to execute malware undetected. By targeting AMSI, the attacker seeks to disable automated defenses that would typically flag or block harmful activities, thereby facilitating further malicious actions such as deploying payloads or initiating lateral movement.

  Relevant MITRE ATT&CK tactics include "Defense Evasion" and the specific technique T1562.001, which focuses on the disabling or bypassing of security mechanisms. The primary data sources for effective detection include Windows Registry deletion logs, process creation events (particularly involving Windows Defender), and potentially endpoint detection logs that record security events related to AMSI.

  ### Investigation Steps
  - **Review Registry Deletion Logs:** Investigate logs reflecting deletions in the `HKLM\Software\Microsoft\AMSI` path to identify unauthorized access or tampering with AMSI provider keys.
  - **Monitor Process Creation Events:** Analyze related process creation events for `MsMpEng.exe` or other executables that started before or after the registry key deletion to detect suspicious activity patterns.
  - **Correlate with Security Solution Logs:** Check Windows Defender security logs or alerts to determine if any malicious activity correlates with the timing of registry changes.
  - **Assess Endpoint Behavior:** Review recent endpoint behavior to identify any unusual processes or applications attempting to execute, especially those related to known malware techniques.

  ### Prioritization
  The alert is considered high severity due to the potential impact on endpoint security. The ability to disable AMSI significantly increases the likelihood of malware execution and data compromise in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where not all registry deletion logs are adequately captured or where traditional logging mechanisms are disabled. The detection logic assumes that the offending actions are executed from processes that align with legitimate WMIC or PowerShell commands; however, sophisticated attackers may use alternative methods to circumvent detection. Ensuring that Windows Defender and registry auditing are properly configured is essential for this alert to function accurately and effectively.

