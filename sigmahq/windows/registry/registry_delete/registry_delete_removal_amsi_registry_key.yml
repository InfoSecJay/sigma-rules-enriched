note: |
  ### Technical Context

  This Sigma rule detects the deletion of specific AMSI (Antimalware Scan Interface) provider registry keys, which are critical for allowing Windows Defender to perform real-time scanning of potentially malicious activities. The likely objective of the attacker is to disable AMSI inspection, facilitating malicious payload execution without detection by security software. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" and the technique ID T1562.001.

  The primary telemetry source for this rule is Windows registry change logs, specifically monitoring registry delete events for keys related to AMSI providers. If malicious, the security impact is significant, as it may allow malware to evade detection. However, this detection does NOT confirm that malware is present or has executed; it merely indicates an attempt to disable a defense mechanism.

  ---

  ### Investigation Steps

  - **Check for registry deletions:** Query Windows Security Event ID 4663 logs for deletions in `HKLM\Software\Microsoft\AMSI`. Look for deletion of keys including `{2781761E-28E0-4109-99FE-B9D127C57AFE}` and `{A7C452EF-8E9F-42EB-9F2B-245613CA0DC9}`.

  - **Identify the process responsible:** Validate the associated process by reviewing the command line arguments of the parent process linked to the registry deletion by correlating with Sysmon Event ID 1 (process creation). Look for `MsMpEng.exe` as a base image.

  - **Compare with legitimate behaviors:** Analyze historical registry delete actions to identify expected administrative tasks or updates, such as management of third-party antivirus software. Ensure legitimate delete actions are properly documented and match expected patterns.

  - **Examine concurrent events:** Correlate any suspicious registry deletions with other potentially malicious activities tracked in the logs (e.g., unexpected network connections or file creations) using Sysmon Event IDs 3, 10, and 11.

  - **Investigate systems for additional signs of compromise:** Perform a file integrity check on the system referenced in the deletion alert. Verify the presence of any additional anti-malware files or services that may have been altered or removed, checking for unauthorized access or modifications.

  - **Document findings and escalate:** If confirmed as malicious, escalate the alert with detailed evidence. Include the registry keys deleted, associated processes, and any additional indicators gathered.

  ---

  ### Prioritization

  This alert has a high severity due to the critical nature of the AMSI feature in defending against malware. The likelihood of malicious abuse is significant, as the removal of AMSI registry keys is a common step used in evading detection mechanisms by adversaries. The behavior is often weaponized in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  The detection may be circumvented by adversaries using techniques such as directly modifying the registry without logging or employing APIs that do not trigger traditional logging mechanisms. Required log sources include registry change logs and Sysmon events for comprehensive visibility. Legitimate tools or processes could unintentionally trigger this alert, particularly during legitimate software updates or maintenance. Companion detections, such as monitoring for use of known malware delivery or persistence techniques, would enhance coverage and contextual understanding of potential threats.

