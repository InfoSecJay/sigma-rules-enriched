note: |
  ### Technical Context
  This rule detects the deletion of registry keys related to the Microsoft Terminal Server Client (MSTSC) connection history. Attackers may clear this history to obfuscate their actions, particularly when attempting to maintain persistence or evade detection after using Remote Desktop Protocol (RDP) for unauthorized access. The likely attacker objective is to prevent forensic investigations and to hide signs of previous connections to compromised systems.

  Relevant MITRE ATT&CK tactics and techniques include **Persistence (T1547)**, as attackers might use RDP for ongoing access, and **Defense Evasion (T1070)**, where they manipulate system logs and configurations to cover their tracks. The techniques specifically highlighted are **Indicator Removal on Host (T1070.001)** and **Clear Windows Event Logs (T1112)**, as the deletion of the RDP connection history aligns with efforts to eliminate potential evidence of unauthorized access.

  The primary data sources for this detection are Windows registry deletion logs, specifically those capturing events around key deletions. EDR tools that monitor registry changes will provide insight into these deletions, which could indicate malicious activity related to RDP.

  ### Investigation Steps
  - **Review Registry Deletion Logs:** Examine Windows registry event logs for any `DeleteValue` or `DeleteKey` events related to `Microsoft\Terminal Server Client\Default\MRU` and `Microsoft\Terminal Server Client\Servers\`. Focus on timestamps and user accounts associated with these deletions.

  - **Correlate with RDP Session Logs:** Analyze RDP logs for any recent logins from the same user accounts involved in the registry deletion. Look for anomalous connection times, source IP addresses, and session durations that differ from the norm.

  - **Check for Other Defense Evasion Techniques:** Investigate other system logs for concurrent events such as unexpected service stops, changes to Windows Event Logs, or any command-line activity indicating the cleanup of artifacts.

  - **Conduct Forensic Analysis:** If evidence of malicious activity is found, perform a more in-depth forensic analysis of affected systems, focusing on recently modified files and processes associated with the user's account.

  ### Prioritization
  The alert's severity is high due to the potential implications of an attacker attempting to conceal their access and actions. Given the criticality of RDP in corporate environments, malicious deletions of connection history could facilitate unauthorized access and lateral movement, heightening the risk for data breaches.

  ### Blind Spots and Assumptions
  The detection logic may not cover scenarios where attackers utilize other methods to obscure their access, such as manipulating event logs outside the registry or employing third-party tools that do not interact with the RDP registry settings. The alert assumes that the logging of registry changes is enabled and that the relevant registry keys have not been modified or deleted by legitimate user actions prior to the detection event. Continuous monitoring and additional telemetry, such as EDR or SIEM solutions logging system behavior, are required for comprehensive coverage.

