note: |
  ### Technical Context

  This Sigma rule detects the deletion of specific registry keys related to the Microsoft Terminal Server Client (MSTSC) connection history. An attacker might clear this registry information to hide their Remote Desktop Protocol (RDP) access and make it difficult for analysts to identify unauthorized connections. This behavior is relevant to the MITRE ATT&CK tactic of Defense Evasion (T1070) and Lateral Movement (T1112). The primary telemetry sources are Windows Registry event logs, particularly registry deletion events that reflect unauthorized attempts to erase connection histories. If malicious, this action can significantly impact the security posture by concealing nefarious access points. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also lead to similar registry modifications.

  ### Investigation Steps

  - **Check for registry deletion events:** Review Security Event ID 4657 or Sysmon Event ID 10 for DeleteValue or DeleteKey operations on the path `\Microsoft\Terminal Server Client\Default\MRU` or `\Microsoft\Terminal Server Client\Servers\`. Look for unexpected modifications from non-administrator accounts or during off-hours.

  - **Identify the user responsible for deletions:** Validate the account in the event logs to see if it is an expected administrator or a service account. Legitimate maintenance might show patterns of activity related to this user, while anomalies could indicate compromise.

  - **Review user access logs:** Look at Windows Event ID 4624 for RDP login activity. Identify any successful connections from user accounts prior to the registry deletion events indicating potential unauthorized access.

  - **Correlate with other logs:** Cross-reference with other telemetry sources such as Sysmon logs (Event ID 1 for process creation) to monitor for RDP client instances running suspicious processes just before registry modifications.

  - **Examine for residual artifacts:** Check for remnants of RDP activity on the system by ensuring the related connection logs from Windows Event ID 1149 (RDP Client Disconnections) don’t match the timeline of the registry deletions.

  ### Prioritization

  This alert should be treated with high priority because it indicates potential attempts to erase evidence of unauthorized access to critical systems through RDP. Given that RDP is commonly exploited in various attack scenarios, the likelihood of malicious abuse in this context is significant.

  ### Blind Spots and Assumptions

  This detection may not capture all legitimate administrative actions that can trigger the alert. Evasion techniques, such as altering logs at the same time as deletions, may obscure malicious behavior. Ensuring the configuration of audit policies for registry changes is critical for reliable detection. Additionally, companion detections, such as monitoring for abnormal user behavior trends or failed RDP connection attempts, can enhance overall security visibility.

