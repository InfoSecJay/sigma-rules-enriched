note: |
  ### Technical Context

  This Sigma rule detects actions that clear the Remote Desktop Connection (RDP) history, specifically targeting the registry keys associated with the Microsoft Terminal Server Client. The likely attacker objective is to remove traces of RDP connections, which may indicate unauthorized access to systems. This behavior fits into the MITRE ATT&CK framework under the tactic of "Persistence" (TA0003) and the technique "Indicator Removal on Host" (T1070) and "Clear Windows Event Logs" (T1112).

  Primary telemetry sources for this detection include Windows Registry change logs, specifically capturing registry deletions like `DeleteValue` and `DeleteKey` events. If this activity is malicious, it could indicate an effort to obscure evidence of unauthorized access to systems, facilitating ongoing unauthorized presence. Importantly, this detection does NOT confirm that a compromise has occurred; benign administrative actions could also trigger these registry changes.

  ### Investigation Steps

  - **Identify the Event:** Review Security Event ID 4657 (Registry Value Deleted) and Event ID 4656 (Registry Object Access) to confirm the deletion of keys within the `\Microsoft\Terminal Server Client\Default\MRU` and `\Microsoft\Terminal Server Client\Servers\` paths.

  - **Correlate timestamps:** Verify the timestamps of the registry deletion events against other relevant logs, such as RDP connection logs (Event ID 4624), to identify if an RDP connection was active prior to the deletion, indicating possible malicious intent.

  - **Check for other signs of persistence:** Investigate if the account performing the deletion shows unusual activity by looking at Event IDs 4624 (Logon) and 4625 (Failed Logon), especially if a service or administrative account is implicated.

  - **Review user behavior:** Validate if the activity aligns with expected user behavior. Normal admin activity may involve legitimate clearing of this history, while deviations or actions outside of standard operating procedures may signal a potential compromise.

  - **Collect related host artifacts:** Look for file creation or modification artifacts around the same time as the registry changes. Use Sysinternals tools (e.g., Autoruns) to check for suspicious persistence mechanisms that may also be in place.

  ### Prioritization

  This alert is of high severity due to the potential for malicious actors attempting to obfuscate their activities on critical systems. The associated registry changes are indicative of potentially serious persistence tactics. Since clearing RDP history is often utilized by attackers to avoid detection, it necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering this alert, especially in environments with standard RDP usage. Required log sources include Registry logs and all relevant Event IDs related to logon sessions. Legitimate activities such as routine maintenance by administrators could lead to false positives. Related detections include monitoring for unusual RDP session activities (Event ID 4624) and any unauthorized registry modifications leading to suspicious application behaviors, enhancing overall monitoring coverage.

