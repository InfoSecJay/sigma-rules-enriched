note: |
  ### Technical Context

  This rule detects the removal of the Security Descriptor (SD) value from the Windows Registry, specifically within the Scheduled Tasks cache. This behavior is often associated with malware, such as Tarrask, aiming to conceal the existence of scheduled tasks from security monitoring. It fits within the MITRE ATT&CK framework under the tactic of Defense Evasion (ID: TA0005) and the technique of T1685 (Hide Artifacts).

  The primary telemetry source is Windows Registry change logs, specifically targeting events related to registry deletions within the TaskCache. If this behavior is confirmed malicious, it can indicate an attempt to manipulate scheduled tasks for nefarious purposes, potentially allowing further exploitation or persistence. Importantly, this detection does NOT confirm any active malicious activity on its own; further investigation is required to establish intent and impact.

  ### Investigation Steps

  - **Identify affected registry path:** Examine the Windows Registry for deletions in the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. Look for entries related to the security descriptor (SD) values that were removed.

  - **Review associated registry keys:** Check the scheduled tasks associated with the affected directory using `Get-ScheduledTask | Where-Object {$_.TaskPath -like "*TaskCache*"} | Format-Table` in PowerShell. Compare legitimate task entries present against missing tasks which could indicate malicious modification.

  - **Analyze event logs for registry activity:** Review Windows Security Event ID 4657 (A registry value was modified) linked to the same area to gain context on when and by whom the deletion occurred, confirming if this aligns with user actions or anomalous behavior.

  - **Correlate with other security telemetry:** Cross-reference with Windows Event ID 4697 (A service was installed) to check if there were any new services created at the same time as the registry changes. This could indicate an active installation of malicious software trying to hide its presence.

  - **Identify normal operations:** Look for standard administrative activities or system processes that modify registry settings, such as Windows updates or system maintenance tasks, in order to distinguish between legitimate and unauthorized modifications.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact on affected systems can be significant if a scheduled task is modified to run malicious payloads covertly. The likelihood of this specific technique being exploited for malicious purposes is high, given its use in known malware campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications that may alter registry settings for valid reasons, potentially causing false positives. A reliance on specific log sources is critical; ensure that detailed registry auditing is enabled in group policies to capture all relevant events. Related detection such as monitoring for unusual service installations or changes (e.g., Event ID 4702 for Service Control Manager) could enhance coverage and provide context to malicious activity.

