note: |
  ### Technical Context
  This detection rule identifies attempts to remove the Security Descriptor (SD) value from registry entries related to scheduled tasks in Windows. Specifically, the detection focuses on the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`, where attackers may manipulate registry settings to conceal scheduled tasks from administrative oversight. The threat actor likely aims to evade detection and persist in the environment by leveraging scheduled tasks for malicious purposes, which may include executing malware, utilizing backdoors, or maintaining footholds within the network.

  The relevant MITRE ATT&CK tactics for this behavior include "Defense Evasion" (TA0005), specifically technique "Indicator Removal on Host" (T1562), which outlines methods attackers use to remove traces of their presence. The primary telemetry sources for this detection are Windows Registry logs, specifically those that capture registry deletions and modifications, which can provide insights into unauthorized activities on the system.

  ### Investigation Steps
  - **Review Registry Logs:** Examine Windows Registry logs to identify the specific deletion of the SD value from the registry path associated with scheduled tasks. Look for any anomalous deletions or modifications around the time of the event.

  - **Audit Scheduled Tasks:** Investigate the scheduled task history to determine if any tasks have been created or modified just before or after the SD value modification. Pay attention to tasks with unusual trigger conditions or unknown origins.

  - **Analyze System Events:** Check Windows Event Logs for any related event IDs that indicate registry changes or scheduled task creations/modifications, particularly those generated by administrative users or unfamiliar accounts.

  - **Correlate Threat Intelligence:** Consult threat intelligence feeds or internal logs to investigate if the identified behavior aligns with known profiles of Tarrask malware or similar malware behaviors, validating the risk posed by the detected activity.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential impact on system integrity and the likelihood of malicious activity attempting to evade security controls. Effective threat actors can leverage this method to persist undetected, making timely investigation critical.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of scheduled task manipulation, particularly if attackers utilize alternate methods to modify those registry keys or if they perform tasks outside the defined registry path. The logic assumes that all relevant modifications will be logged, which may not be the case in misconfigured systems or in the presence of log tampering. Additionally, proper logging for registry modifications must be enabled for this detection to function effectively, necessitating sufficient log retention policies and monitoring practices in place.

