note: |
  ### Technical Context

  This Sigma rule detects the removal of the Security Descriptor (SD) value in the Windows registry path relating to Scheduled Tasks, particularly under `\Schedule\TaskCache\Tree\`. This behavior is commonly employed by the Tarrask malware to hide existing scheduled tasks from users and system monitoring tools. The relevant MITRE ATT&CK tactic is Defense Evasion (ID: T1562). The primary telemetry source is Windows registry delete events, specifically targeting entries in the registry related to task management. A successful evasion of detection can lead to malicious task execution without alerting security systems. However, this detection alone does not confirm that the behavior is solely malicious, as legitimate applications may also adjust task security parameters.

  ### Investigation Steps

  - **Verify registry deletion event**: Review Windows Event ID 4657 (Registry Value Changed) for deletions related to the Registry Path: `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\SD`. Look for events with "Deleted" in the `OperationType` field.
  - **Identify scheduled tasks**: Examine any tasks within the Task Scheduler that are suspected to have altered security descriptors. Use Task Scheduler logs (Event ID 106) to compile a list of tasks and their SD settings.
  - **Look for associated malwares**: Cross-reference the machines generating this alert with threat intelligence for indicators of compromise related to Tarrask malware. Events logged might include unusual command line executions (Event ID 4688 / Sysmon Event ID 1) involving malicious binaries.
  - **Review legitimate task activity**: Check for legitimate task operations to understand if the task modifications align with administrative tasks, such as those created by security products or maintenance scripts running in normal operating windows.
  - **Investigate account activities**: Look for unusual account behavior around the time of registry modification, such as abnormal logins (Event ID 4624) from privileged accounts, correlating with the registry events.
  - **Assess file artifacts**: Validate any new or modified scheduled task executable files which may implicate malicious intent. Check for file creation events (Event ID Creation 4663) in conjunction with the registry changes to backtrack to any potentially malicious artifacts.

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on the security integrity of scheduled tasks within an enterprise. The removal of security descriptors can directly enable persistence mechanisms that are often weaponized by advanced threats like Tarrask. The likelihood of malicious use requires immediate investigation to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may be limited if registry changes are not fully captured, which can occur during high-frequency events or insufficient logging settings. Legitimate applications may trigger this alert when modifying task security settings for operational purposes. A companion detection could involve monitoring for unusual Scheduled Task creations or modifications (MITRE ATT&CK T1053) to enhance visibility on this potential threat vector.

