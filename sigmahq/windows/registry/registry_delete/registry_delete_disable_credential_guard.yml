note: |
  ---

  ### Technical Context

  This Sigma rule detects the deletion of specific registry values associated with Windows Credential Guard, which is a security feature that uses virtualization to protect credential information. The likely attacker objective is to disable Credential Guard to gain access to sensitive credentials, such as NTLM hashes and Kerberos tickets, facilitating lateral movement and privilege escalation. This behavior is aligned with the MITRE ATT&CK tactic of **Defense Evasion** (ID: TA0005) and specifically technique **T1562.001 – Disable or Modify Security Tools**. The primary telemetry sources required for detection are Windows Registry logs, particularly those indicating registry deletions.

  If this behavior is indeed malicious, it could significantly compromise the security posture of the affected system. However, it is important to note that this detection does NOT confirm unauthorized access or exploitation on its own; it only indicates an attempt to disable a security feature.

  ---

  ### Investigation Steps

  - **Review Registry Changes:** Examine the Windows Registry logs for deletions of `\DeviceGuard\EnableVirtualizationBasedSecurity`, `\DeviceGuard\LsaCfgFlags`, `\DeviceGuard\RequirePlatformSecurityFeatures`, or `\Lsa\LsaCfgFlags` (Event ID 4657) to confirm the alert context.

  - **Check for Other Indicators of Compromise:** Look for additional suspicious activities in the Security Event logs (Event ID 4688) around the same timestamp, specifically for process creation events that might be associated with scripts or utilities known to disable security features.

  - **Validate Legitimate Behavior:** Verify if the deletion corresponds with any documented administrative actions or maintenance schedules that might explain the registry changes. Legitimate actions may follow a corporate policy or be part of a troubleshooting process.

  - **Identify Malicious Scripts or Activities:** Search for any executions of PowerShell scripts or other automation tools around the same timeframe that reference disabling of Credential Guard or making similar registry changes, which could reflect malicious intent.

  - **Assess the Asset Impact:** Determine the role of the affected host (e.g., server, workstation) and its criticality within the organization to prioritize response efforts effectively.

  - **Analyze Final State of the Registry:** Validate if any modification of the Credential Guard settings has occurred post-deletion using `Get-ItemProperty` in PowerShell to assess changes in the expected registry keys.

  ---

  ### Prioritization

  This alert has a **high severity** due to the critical nature of Windows Credential Guard in securing sensitive credential data. The ability to disable this feature suggests a high likelihood of malicious behavior, particularly as it is a known step in many exploitation workflows. This behavior is often weaponized in advanced threat scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative actions that may trigger this alert, such as changes performed by IT staff during troubleshooting or system upgrades. The required log sources must be configured correctly to capture relevant registry activity. Additionally, companion detections, such as monitoring for unusual process executions or system command line changes (using Sysmon Event ID 11), can provide enriched context to assess the legitimacy of the registry modification attempt.

