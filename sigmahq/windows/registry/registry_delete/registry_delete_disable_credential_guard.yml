note: |
  ### Technical Context

  This rule detects the deletion of specific registry values associated with Windows Credential Guard (WCG), which is designed to provide enhanced security for credential storage using virtualization-based security. The likely objective of an attacker triggering this behavior is to disable WCG, thus allowing access to sensitive credentials like NTLM hashes and Kerberos tickets, enabling lateral movement and privilege escalation. Relevant MITRE ATT&CK tactics are Defense Evasion and the technique ID T1562.001.

  Primary telemetry sources include Windows Registry change logs, particularly those related to deletions of key registry paths such as `\DeviceGuard\EnableVirtualizationBasedSecurity` and `\Lsa\LsaCfgFlags`. If this alteration is malicious, it may allow unauthorized access to critical credentials, thereby compromising the overall security posture of the affected system. However, this detection does NOT confirm that the deletion was executed by an unauthorized actor, as legitimate administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Check registry deletion events**: Analyze Security Event ID 4657 for registry value deletions in the relevant registry paths. Look for entries that confirm values related to `EnableVirtualizationBasedSecurity` and `LsaCfgFlags` were removed.

  - **Correlate with administrative actions**: Review Windows Event ID 4624 for logins by administrative users during the timeframe of the deletion. If the deletion aligns with expected administrative actions (e.g., maintenance tasks), this may indicate benign activity.

  - **Look for subsequent credential access**: Examine logs for unexpected NTLM authentication requests (Security Event ID 4648) and Kerberos ticket grants (Security Event ID 4769) immediately following the registry deletion, which may indicate malicious intent.

  - **Review system roles and applications**: Identify whether the affected host is a critical server or workstation. Ensure that any applications installed on the system do not require changes to Credential Guard settings for proper functionality.

  - **Identify abnormal process activity**: Utilize Sysmon Event ID 1 to examine process creation events around the deletion time. Look for unusual processes that may indicate a script or tool leveraging these registry deletions for exploitation.

  ### Prioritization

  The alert severity is high due to the potential impact on credential security in sensitive environments. The likelihood of malicious abuse is significant as disabling Credential Guard directly increases risk to credential theft and lateral movement by adversaries. This behavior is a known tactic among attackers.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is misconfigured or if registry activities are not captured accurately. Adversaries may employ scripting tools that could rewrite logs or execute discreetly to evade detection. Legitimate administrative actions may inadvertently trigger this alert, especially during system updates or maintenance. A related detection includes monitoring for Trust Policy changes (MITRE ATT&CK ID T1556) to have further visibility into potential lateral movement paths exploited after disabling WCG.

