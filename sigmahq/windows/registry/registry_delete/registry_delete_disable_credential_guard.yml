note: |
  ### Technical Context

  This rule detects attempts to disable Windows Credential Guard by monitoring deletions of specific registry values associated with its configuration. Credential Guard leverages virtualization-based security to safeguard sensitive credentials, making its deactivation a critical adversary objective to access NTLM hashes or Kerberos tickets. This behavior correlates with the MITRE ATT&CK technique "Impair Defenses" (T1685). The primary telemetry sources are Windows Registry logs, specifically monitoring deletions of values under the paths: `\DeviceGuard\EnableVirtualizationBasedSecurity`, `\DeviceGuard\LsaCfgFlags`, `\DeviceGuard\RequirePlatformSecurityFeatures`, and `\Lsa\LsaCfgFlags`. A successful disabling of Credential Guard can significantly increase the risk of credential theft and lateral movement within the enterprise environment. This detection does NOT confirm that a compromise has occurred; it merely indicates an attempt to weaken security defenses.

  ### Investigation Steps

  - **Check registry change history:** Review Security Event ID 4663 logs to identify the user or process that initiated the registry deletion. Look for deletions from the paths outlined above to gauge the potential legitimacy of the change.

  - **Correlate with other activity:** Investigate any concurrent events related to user privilege escalation or lateral movement attempts, inspecting Sysmon Event ID 10 for process creations involving Windows PowerShell commands that may align with credential harvesting.

  - **Identify legitimate usage patterns:** Determine if there are scheduled tasks, legitimate administrative actions, or deployments that could account for registry modifications. Consult Windows Event logs for Event ID 4608, which indicates system startup and may reveal when essential services like Credential Guard were last verified.

  - **Review system role effectiveness:** If the affected system is a Domain Controller or a critical server, prioritize follow-up actions. Evaluate if Credential Guard is intended or necessary on this host to ascertain the severity of the impact.

  - **Investigate potential indicators of compromise:** Focus on high-confidence malicious indicators such as any process executing commands from directories typically associated with malware, or scripts that include registry modification commands. Specifically, look out for unusual execution of `reg.exe` or PowerShell scripts that target the aforementioned registry keys.

  ### Prioritization

  This alert is of high severity, especially if it involves critical systems where Windows Credential Guard is expected to be active, as disabling it could facilitate credential theft and lateral movement. Given that credential harvesting techniques are frequently weaponized, the likelihood of malicious abuse is elevated.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of appropriate registry auditing settings. Legitimate administrative activities, such as system updates or changes by trusted IT personnel, may trigger this alert, necessitating context around the user and system roles. A companion detection to consider is monitoring for unusual process creation patterns via Sysmon Event ID 1, which could further validate suspicious behavior linked to registry changes.

