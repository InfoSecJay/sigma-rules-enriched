note: |
  ### Technical Context
  This detection rule identifies attempts by adversaries to disable Windows Credential Guard by monitoring for the deletion of specific registry values associated with the security feature. Windows Credential Guard enhances security by utilizing virtualization-based protection to isolate sensitive credentials, such as NTLM hashes and Kerberos tickets, from unauthorized access. By disabling Credential Guard, attackers may aim to exploit these credentials, facilitating lateral movement and privilege escalation within the targeted environment.

  The primary MITRE ATT&CK tactics relevant to this detection include **Defense Evasion** (TA0005) and the sub-technique **Disable or Modify Security Tools** (T1562.001), as the deletion of these registry keys directly undermines the security controls provided by Windows Credential Guard. Effective detection relies on registry delete logs, specifically targeting changes to critical system integrity settings that are pivotal for maintaining a secure computing environment.

  Key telemetry sources for effective monitoring of this activity include Windows registry delete event logs, which capture alterations made to the system registry, thus providing insights into attempted modifications that could signify malicious behavior.

  ### Investigation Steps
  - **Review Registry Logs**: Examine Windows registry deletion logs for entries related to the keys – `\DeviceGuard\EnableVirtualizationBasedSecurity`, `\DeviceGuard\LsaCfgFlags`, `\DeviceGuard\RequirePlatformSecurityFeatures`, and `\Lsa\LsaCfgFlags`. Pay attention to timestamps and user accounts that executed the deletions.
  - **Correlate with Process Creation**: Look for any anomalous process creation events around the same timeframe as the registry deletions. Investigate any instances of uncommon or unauthorized scripts or command line arguments that appear connected to these registry modifications.
  - **Audit User Activity**: Collect and analyze user activity logs to identify the context surrounding the registry changes. Investigate if users with elevated privileges carried out the deletions and verify whether those actions align with their roles and responsibilities.
  - **Evaluate System Integrity**: Assess whether other security features that rely on Credential Guard (like virtualization-based security) have been impacted. Cross-reference with other components of the system to identify additional vulnerabilities or misconfigurations that could facilitate successful credential theft.

  ### Prioritization
  Given the high-severity rating of this alert, swift investigation is essential as the disabling of Credential Guard significantly increases the risk of credential exposure and subsequent compromise of user accounts, leading to potential lateral movement throughout the network.

  ### Blind Spots and Assumptions
  Possible gaps in detection coverage include environments where logging is not configured to capture registry changes or systems where Windows Credential Guard is not implemented, which could lead to false negatives. The detection logic assumes that legitimate administrative actions will not frequently result in the deletion of these specific registry values. To function correctly, registry audit policies must be enabled to ensure that delete actions are logged appropriately, and sufficient logging infrastructure must be in place to capture this critical telemetry.

