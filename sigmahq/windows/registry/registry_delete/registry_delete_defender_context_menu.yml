detection:
  selection:
    TargetObject|contains: 'shellex\ContextMenuHandlers\EPP'
  filter_main_defender:
    Image|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\Program Files (x86)\Windows Defender\'
    Image|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely as this weakens defenses and normally would not be done even if using
  another AV.
level: medium
note: |
  ### Technical Context

  This alert detects the deletion of a registry key that enables the "Scan with Windows Defender" option in the context menu on Windows systems. This behavior can indicate an attacker’s objective to evict security features, making it easier to execute malicious activities without detection. The relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and the specific technique of Indicator Removal on Host (T1070). The primary telemetry source for this detection is registry delete events, specifically targeting entries under "shellex\ContextMenuHandlers\EPP" for Windows Defender. If malicious, this can significantly undermine endpoint protection and allow malware to operate undetected. However, this detection does NOT confirm that a security breach has occurred on its own, as legitimate software changes can also trigger it.

  ### Investigation Steps

  - **Review registry delete events:** Examine Windows registry logs for Event ID 4657 or 4660 entries that reflect changes to "shellex\ContextMenuHandlers\EPP". Look for timestamps that match alert triggers to correlate the deletion with other system activities.

  - **Identify related process activity:** Check for any recent process creation events (Security Event ID 4688 or Sysmon Event ID 1) involving `MsMpEng.exe` or other Defender processes around the time of the registry change to determine if there were attempts to manipulate the Defender service.

  - **Validate legitimate activity:** Investigate whether there have been any recent software updates or legitimate administrative actions on the system, especially involving third-party antivirus installations that may require altering the context menu.

  - **Assess system criticality:** Determine the role of the affected system and its criticality within your environment. High-value assets, such as servers handling sensitive data, warrant a deeper investigation.

  - **Cross-reference with threat intelligence:** Use contextual data from threat intelligence platforms to see if this behavior aligns with known tactics of recent malware families, especially those associated with evading detection, such as Ransomware and backdoors.

  ### Prioritization

  This alert should be treated with medium priority in an enterprise context. Systems affected by this behavior may be vulnerable to exploit, as removing security features is a common tactic among adversaries. Given that this behavior is not typical for routine administrative tasks, there is a reasonable likelihood that further investigation will reveal malicious intent.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might employ alternate processes to delete registry keys without triggering traditional alerts. It is vital to ensure that Windows registry auditing is enabled to capture relevant changes reliably. Legitimate activities, such as the installation of alternative antivirus solutions, might inadvertently trigger this alert. A related detection rule for monitoring unauthorized registry modifications would enhance the coverage and context surrounding such deletions.

