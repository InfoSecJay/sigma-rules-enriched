detection:
  selection:
    TargetObject|contains: 'shellex\ContextMenuHandlers\EPP'
  filter_main_defender:
    Image|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\Program Files (x86)\Windows Defender\'
    Image|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely as this weakens defenses and normally would not be done even if using another
  AV.
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized deletion of the registry key that adds the 'Scan with Defender' option in the Windows context menu. Attackers may manipulate this registry key to prevent users from easily scanning suspicious files with Windows Defender, thereby facilitating malicious activities. By removing this entry, threat actors aim to weaken the overall security posture of the system, making it easier to execute malware or conduct further exploitation without detection.

  The underlying threat scenario is indicative of various tactics employed in the MITRE ATT&CK framework, specifically under the Defense Evasion tactic. Techniques relevant to this detection include **T1211 - Exploitation for Client Execution**, where attackers might manipulate user-facing components to avoid security measures. The deletion of this registry key could be part of a broader strategy to disable security measures or achieve persistence without user awareness.

  Primary data sources that will yield the best evidence for this scenario include **Windows registry change logs**, which will show modifications made to context menu entries, as well as alerts from endpoint detection and response solutions capturing process execution related to registry changes.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate registry logs for the deletion of the `shellex\ContextMenuHandlers\EPP` key, ensuring you capture timestamps and any associated process IDs.
  - **Analyze Process Execution**: Look into process creation logs to identify any instances of `MsMpEng.exe` or related Defender processes that might have been involved during the time frame of the registry changes.
  - **Correlate with User Activity**: Check user activity logs to determine if there were any anomalous login patterns or unusual user actions that coincide with the time the registry key was deleted.
  - **Assess Endpoint Security Settings**: Validate the endpoint security configurations to ensure no other security tools have been disabled or modified, and confirm that Windows Defender is fully operational.

  ### Prioritization
  This alert carries a medium severity level due to its potential impact on system security. The removal of a built-in security feature could significantly decrease the likelihood of detecting malicious files, suggesting that proactive measures may be necessary to combat the potential for malware infection.

  ### Blind Spots and Assumptions
  The detection logic may be limited if registry logging isn’t enabled or properly configured in the environment, potentially missing crucial evidence of the attack. This rule assumes that the standard operational procedures for the environment involve using Windows Defender and that any deletions of registry keys related to it are not typical user behavior. If alternate security solutions are being used, the detection coverage can be further limited depending on the integration and logging capabilities of those tools.

