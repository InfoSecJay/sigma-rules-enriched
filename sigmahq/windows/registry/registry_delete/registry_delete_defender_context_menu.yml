detection:
  selection:
    TargetObject|contains: 'shellex\ContextMenuHandlers\EPP'
  filter_main_defender:
    Image|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\Program Files (x86)\Windows Defender\'
    Image|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely as this weakens defenses and normally would not be done even if using
  another AV.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deletion of a registry key associated with the "Scan with Windows Defender" context menu option. Attackers may perform this action to impair Defender’s usability and make it harder for users to scan potentially malicious files. This behavior is indicative of defense evasion tactics employed during the attack lifecycle, specifically under the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Indicator Removal on Host (T1070).

  The primary telemetry source is Windows Registry deletion logs, specifically monitoring for modifications to `HKEY_CLASSES_ROOT\shellex\ContextMenuHandlers\EPP`. If malicious, this action can significantly weaken endpoint security. This detection does NOT confirm active malicious activity on its own, as legitimate applications or users with administrative privileges might also delete this registry key.

  ### Investigation Steps

  - **Verify the registry change record: ** Check for registry deletion events in Security Event ID 4663 or Windows Event Log for registry modifications. Look for actions associated with `shellex\ContextMenuHandlers\EPP`, indicating potential tampering.

  - **Assess user privileges: ** Examine user account access levels and roles involved in the deletion. Legitimate administrators may modify this key, but anomalous behavior by non-privileged accounts is suspicious.

  - **Identify associated processes: ** Review Sysmon Event ID 1 for processes that interacted with the registry key around the same timestamp. Specifically, look for processes starting with `C:\ProgramData\Microsoft\Windows Defender\Platform\` or similar paths.

  - **Compare against known benign activity: ** Note that software installation or configuration changes may also trigger key deletions. Cross-reference with installation logs to verify legitimate modification.

  - **Correlate with threat intelligence: ** Cross-reference against known threat reports (e.g., IceID, LazyScripter) to determine if malicious entities are known to utilize similar behaviors or if this aligns with recent attack patterns against your organization.

  ### Prioritization

  This alert has medium severity due to its potential impact on endpoint security. The likelihood of malicious abuse is moderate, as attackers often aim to disable security features to facilitate further attacks. This behavior is less common but can be directly weaponized in targeted environments, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion by attackers who might restore the registry setting immediately after deletion to avoid detection. Reliable detection requires that Windows Event logging is properly configured to capture registry modifications. Legitimate scenarios might involve security software installation or updates that modify this setting. A related detection rule for monitoring the creation of new context menu handlers can enhance coverage and provide further insights into potential tampering.

