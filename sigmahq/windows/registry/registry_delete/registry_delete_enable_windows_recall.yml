note: |
  ### Technical Context

  This Sigma rule detects the deletion of the "DisableAIDataAnalysis" registry value, which enables the Windows Recall feature. The primary objective of an attacker in this context is to leverage the Windows Recall functionality to gather information from the endpoints post-exploitation, potentially facilitating data collection and analysis. This behavior correlates with the MITRE ATT&CK technique for data collection: *Data from Local System* (T1113).

  The primary telemetry source is Windows Registry logs that track modifications to the registry, specifically the deletion of registry values. If this activity is malicious, it could lead to unauthorized data collection or exposure of sensitive information. Importantly, this detection does NOT confirm malicious intent on its own; legitimate users may also enable Windows Recall as part of system functionality.

  ### Investigation Steps

  - **Verify registry deletion event:** Check for Event ID 4659, which logs a registry value deletion. Look specifically for deletions under the paths:
    `HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis` or
    `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis`.

  - **Identify the user initiating the change:** Examine the logs for Event ID 4663, which provides details on which user performed the deletion. Assess whether the user context is legitimate or unusual, and correlate with normal user activity patterns.

  - **Analyze recent process creation:** Look for associated process creation (Event ID 4688) around the time of the registry change. A legitimate process might include `wisptis.exe`, which could interact with the Recall feature, whereas suspicious command lines could indicate malicious intent.

  - **Review event log for expected behavior:** Confirm that the "DisableAIDataAnalysis" registry value was originally set to enabled (typically DWORD value of 1) before the deletion event occurred. If this value was not set to disabled prior, the action may be legitimate.

  - **Investigate for related registry modifications:** Look for other alterations around the same time (within a few minutes) in the registry logs that could indicate broader changes, suggesting malicious behavior rather than a standalone action.

  - **Check endpoint for known malware behaviors:** Run scans for indicators associated with post-exploitation frameworks (e.g., Cobalt Strike or Meterpreter) that may use data collection shortcuts including enabling Windows Recall.

  ### Prioritization

  Given that this behavior can facilitate unauthorized data gathering, it is classified as medium severity. The likelihood of exploitation is moderate, particularly in environments where Windows Recall is not widely used. Since enabling Windows Recall may be a part of known attack methodologies, it is important to prioritize the investigation of such alerts.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for accurate configurations for registry logging; if not enabled, malicious activities may go unnoticed. Legitimate administrative or user actions may also trigger the alert when troubleshooting or configuring features. A related detection could include monitoring for unexpected changes in registry values associated with auditing settings, which would strengthen coverage of suspicious activities around Windows features.

