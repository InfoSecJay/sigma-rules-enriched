  ---

  ### Technical Context

  This rule detects the deletion of the "Index" value in the registry key associated with scheduled tasks, specifically targeting the path: `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. The likely objective of an attacker could be to hide their scheduled tasks from detection by system administrators or security tools, as the absence of this index value enables malicious activities to occur without alerting monitoring tools like `schtasks /query`.

  This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically technique T1562: "Impair Defenses". The primary telemetry source for this detection is Windows registry delete logs, which document modifications made to registry keys. If malicious, the impact could be significant, as it often indicates an intentional effort to evade security measures. Importantly, this detection alone does not confirm active exploitation or malicious intent without additional context.

  ---

  ### Investigation Steps

  - **Review registry deletion events:** Correlate detected alerts with Windows Registry Event IDs 4657 (Registry value modified) and 4663 (Accessed an object) to establish context and confirm alterations to the scheduled task index.

  - **Identify recent task configurations:** Utilize scheduled task logs (Event ID 4698, creation of a new task) to identify existing scheduled tasks on the affected system. Check for any discrepancies between system configurations and expected normal operation.

  - **Check for expected benign removals:** Determine whether legitimate administrative actions may have led to the regressive index removal, such as authorized script-based management of tasks or system updates. Document and review relevant standard operating procedures (SOPs).

  - **Correlate with other evasion techniques:** Look for other related detection alerts, such as those targeting other registry keys relevant to scheduled tasks (e.g., manipulation of task triggered settings or associated executable paths), to build a more comprehensive understanding of possible evasion.

  - **Identify high-confidence indicators of compromise:** Look for concurrent suspicious behaviors, such as unusual scheduled task creation (Event ID 4698) or modifications (Event ID 4702, task changes), performed by unknown or non-administrative accounts that may indicate malicious activity.

  - **Investigate system role and criticality:** Understand the role of the affected system; if it holds critical data or is a server, prioritize investigations, and consider the potential for lateral movement or compromise of sensitive applications.

  ---

  ### Prioritization

  The severity of this alert is medium due to its potential impact on critical systems where scheduled tasks are used for maintenance and automated processes. The likelihood of malicious abuse is moderate, as the behavior aligns with common evasion tactics used by attackers to obfuscate their activities. While not frequently weaponized in isolation, it becomes more dangerous when combined with other malicious actions.

  ---

  ### Blind Spots and Assumptions

  This rule may produce false positives during legitimate administrative actions that involve modifying scheduled tasks. Additionally, it does not account for all evasion techniques, such as usage of less common task management tools that do not interact with Windows scheduled tasks. Reliable detection requires comprehensive logging settings for the Windows Event Log, including registry access audit policies. A related detection to enhance coverage could include monitoring for unauthorized creation or modification of scheduled tasks, helping identify comprehensive evasion attempts.

