note: |
  ### Technical Context
  This detection rule identifies when the "index" value of a scheduled task is removed or deleted from the Windows Registry. This activity is often indicative of an attacker attempting to hide a malicious scheduled task from system administrators and security tools. By removing the index value, an attacker can make their task undetectable through standard commands like `schtasks /query`, complicating detection and remediation efforts.

  The likely attacker objective is to maintain persistence on a target system while avoiding detection by security monitoring tools. If successful, this can lead to prolonged access to sensitive data, or the installation of additional malware. The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), particularly the technique **Indicator Removal on Host** (T1562). The primary data sources for this detection are Windows Registry deletion logs, which capture the removal of keys and values.

  ### Investigation Steps
  - **Review Registry Deletion Logs:**: Check logs for entries related to deletions in the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\` for any deletions of the "Index" value.
  - **Analyze Scheduled Task History:**: Use the `schtasks /query` command or similar tools to find any scheduled tasks that should be present but are missing or exhibiting suspicious characteristics.
  - **Correlate with EDR Signals:**: Look for any related process creation events around the time of the registry modification that may indicate the creation of the malicious scheduled task or its execution.
  - **Identify User Context:**: Determine the user account responsible for the registry modification. Investigate the context of this account, including the last login time, active sessions, and any recent changes to permissions or group memberships.

  ### Prioritization
  This alert carries a medium severity level due to its potential impact on system integrity and operational security. The ability for an attacker to hide scheduled tasks significantly increases the likelihood of a sustained compromise within enterprise environments.

  ### Blind Spots and Assumptions
  The detection may not cover all potential attack vectors if attackers utilize alternative methods to conceal tasks or manipulate the registry without removing index values. The rule assumes that registry deletion events are being adequately logged and monitored. Additionally, proper configurations in the SIEM or monitoring solution must be in place to capture and alert on registry deletions related to scheduled tasks for this alert to function correctly.

