note: |
  ### Technical Context

  This rule detects the deletion of the "Index" value from scheduled tasks in the Windows registry. This behavior is typically associated with an adversary attempting to conceal malicious scheduled tasks from detection mechanisms, such as the built-in `schtasks /query`. The objective is to maintain persistence while evading detection by security monitoring tools.

  The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) with the associated technique being Scheduled Task or Job (T1685). Primary telemetry sources include Windows Registry change logs, specifically targeting deletions under the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. If malicious, this behavior significantly impacts system integrity and the ability of defenders to detect unauthorized tasks.

  This detection does NOT confirm that a scheduled task is malicious on its own; it merely indicates a modification that could be a part of malicious behavior.

  ### Investigation Steps

  - **Check Registry Deletion Log:** Review Windows Registry logs (Event ID 4663) for entries indicating the deletion of the "Index" value under `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. Confirm if the entry was modified around the same time as suspicious task activity.

  - **Correlate with Task Creation:** Identify scheduled tasks created around the same time by using `schtasks /query` command output or Task Scheduler logs (Event ID 106). Verify whether these tasks are legitimate or associated with recent application installations or administrative actions.

  - **Identify Recent User Activity:** Investigate Windows Security logs (Event ID 4624) for logon events prior to the registry change. Determine if the activity correlates with known administrative user tasks or if it is from unfamiliar accounts that may indicate a breach.

  - **Account for Legitimate Changes:** Cross-reference other scheduled tasks that may have been modified legitimately, such as maintenance tasks by system administrators or automated updates. Established baselines for normal operations can help in distinguishing malicious activity.

  - **Validate Tooling and Environment:** Ensure that Anti-Virus or EDR tooling is operational and updated. Evaluate if previous alerts or findings illustrate a pattern of similar behaviors on critical systems or servers, indicating possible exploitation of known weaknesses.

  ### Prioritization

  This alert should be treated with medium severity. The impact can be significant if a critical system is involved, as hiding tasks implies a high likelihood of malicious intent. This behavior is often leveraged in attacks for persistence, making it vital for timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental configurations that do not thoroughly monitor registry changes. Legitimate administrative actions, such as routine task scheduling changes, could inadvertently trigger this alert. Additional companion detections could include alerts for unusual task creation or modification events (e.g., Task Scheduler event logs) to provide more context to potential threats.

