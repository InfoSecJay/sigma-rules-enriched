note: |
  ### Technical Context

  This Sigma rule detects the removal of the "Index" value for scheduled tasks in the Windows registry, specifically located under `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. The primary objective for an attacker utilizing this technique is to obscure the presence of malicious scheduled tasks, making them less likely to be discovered through typical query methods like "schtasks /query". This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562: "Impair Defense Mechanisms".

  The primary telemetry source is Windows Registry deletion events, specifically `Event ID 4659` (Deletion of an Object) that logs registry key modifications. If not legitimately managed, malicious deletions of this nature could allow persistent threats to operate undetected. It is crucial to note that this detection alone does not confirm malicious activity; legitimate administrative actions could also result in similar registry modifications.

  ### Investigation Steps

  - **Check for recent registry deletions:** Review Security Event ID 4659 for deletions related to the `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\` path and the "Index" value to establish the timeline of the alteration.

  - **Identify changes in scheduled tasks:** Use `schtasks /query /fo LIST` to list all active scheduled tasks. Look for tasks without an "Index" value that should be present. Benign tasks typically retain their index values unless explicitly modified for valid operational reasons.

  - **Correlate with other security logs:** Cross-reference Windows Event ID 4688 (Process Creation) for any unusual process launches, particularly around the time of the registry deletion. Pay attention to scheduled task execution or script execution that does not have proper origin.

  - **Investigate the modifying user account:** Identify the user or process responsible for the registry change. Use Event ID 4672 (Special Privileges Assigned to New Logon) to determine if elevated privileges were used during the modification, which is a strong indicator of potential malicious intent.

  - **Evaluate host role and asset criticality:** Determine whether the asset where the event was triggered is critical. Scheduled task modifications on servers and domain controllers are of higher concern than on non-critical user machines.

  - **Look for related malicious behaviors:** Search for other signs of evasion such as deletion of event logs (Event ID 1102), indicating an attempt to cover tracks or conceal further malicious activities. A correlation with T1562 is critical for assessing the overall security posture.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems if a malicious actor has successfully obscured their activities. The likelihood of abuse is considerable, as scheduled tasks provide a common method for executing persistent threats without detection. This behavior is recognized as a tactic employed by various advanced adversaries.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if logging levels are insufficient or if registry auditing is improperly configured. Legitimate administrative actions such as clean-up of obsolete tasks may trigger this alert, and therefore, investigation must consider context and intent. A related detection includes monitoring for unexpected task creation or modification events to bolster coverage against malicious scheduled task manipulation.

