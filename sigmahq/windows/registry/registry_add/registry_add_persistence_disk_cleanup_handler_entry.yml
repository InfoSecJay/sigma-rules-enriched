logsource:
  product: windows
  category: registry_add
detection:
  selection:
    EventType: CreateKey
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\'
  filter_main_default_keys:
        # Default Keys
    TargetObject|endswith:
    - '\Active Setup Temp Folders'
    - '\BranchCache'
    - '\Content Indexer Cleaner'
    - '\D3D Shader Cache'
    - '\Delivery Optimization Files'
    - '\Device Driver Packages'
    - '\Diagnostic Data Viewer database files'
    - '\Downloaded Program Files'
    - '\DownloadsFolder'
    - '\Feedback Hub Archive log files'
    - '\Internet Cache Files'
    - '\Language Pack'
    - '\Microsoft Office Temp Files'
    - '\Offline Pages Files'
    - '\Old ChkDsk Files'
    - '\Previous Installations'
    - '\Recycle Bin'
    - '\RetailDemo Offline Content'
    - '\Setup Log Files'
    - '\System error memory dump files'
    - '\System error minidump files'
    - '\Temporary Files'
    - '\Temporary Setup Files'
    - '\Temporary Sync Files'
    - '\Thumbnail Cache'
    - '\Update Cleanup'
    - '\Upgrade Discarded Files'
    - '\User file versions'
    - '\Windows Defender'
    - '\Windows Error Reporting Files'
    - '\Windows ESD installation files'
    - '\Windows Upgrade Log Files'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate new entry added by windows
level: medium
note: |
  ### Technical Context

  This detection identifies modifications to the registry related to disk cleanup handlers, which attackers might exploit to achieve persistence on a compromised system. The likely objective is to ensure that malicious payloads are executed by leveraging the disk cleanup manager, possibly evading standard detection mechanisms. This behavior fits within the MITRE ATT&CK framework under the Persistence tactic, specifically the "Schedule Task" technique (T1053).

  The primary telemetry source for this detection is the Windows registry, specifically monitoring the creation of keys within the path `\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\`. If malicious, this activity can enable persistent execution of malware even after system reboots. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify these registry keys.

  ### Investigation Steps

  - **Confirm registry key modification:** Review registry logs for Event ID 4657 to validate the creation of any keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\` that do not correspond to standard cleanup handlers.

  - **Identify additional affected keys:** Check for unusual entries by querying for created keys within the same registry path. Expected behavior includes the presence of default handlers such as `Recycle Bin` or `Temporary Files`.

  - **Correlate with process creation logs:** Investigate the presence of suspicious processes that may have been spawned in conjunction with registry modifications by checking Security Event ID 4688 for any command-line activities related to the new keys.

  - **Analyze system behavior:** Validate whether the affected system shows signs of uncommon disk activity or cleanup tasks that align with the creation of these handlers, especially focusing on the execution of unauthorized binaries or scripts.

  - **Cross-reference with known threat indicators:** Cross-check the modified registry key with a threat intelligence database for hashes or indicators of compromise associated with known malware that utilizes disk cleanup handlers for persistence.

  - **Review host roles and context:** If the modified registry keys pertain to systems critical to operations (e.g., domain controllers, file servers), prioritize the investigation due to possible higher impact. Determine whether the system is part of a typical user workstation or a back-end service.

  ### Prioritization

  This alert has a medium severity level due to the potential for significant impact if the persistence method is exploited by an attacker. The likelihood of malicious behavior is moderate, particularly in targeted environments or following successful initial access events. Although using disk cleanup handlers for persistence is less common than other methods, it is known to be weaponized.

  ### Blind Spots and Assumptions

  Detection relies heavily on the logging of registry activities, which may not be enabled by default in every environment. A potential evasion technique includes legitimate software modifications that create similar registry entries, thus leading to false positives. The detection may trigger on benign updates or legitimate application installations, especially if new handlers are added during regular maintenance. A companion detection to consider would include monitoring for unauthorized scheduled tasks (MITRE ID T1053), which can help reinforce signs of persistence techniques being employed.

