title: Potential Persistence Via Disk Cleanup Handler - Registry
id: d4f4e0be-cf12-439f-9e25-4e2cdcf7df5a
status: test
description: |
  Detects when an attacker modifies values of the Disk Cleanup Handler in the registry to achieve persistence.
  The disk cleanup manager is part of the operating system. It displays the dialog box […]
  The user has the option of enabling or disabling individual handlers by selecting or clearing their check box in the disk cleanup manager's UI.
  Although Windows comes with a number of disk cleanup handlers, they aren't designed to handle files produced by other applications.
  Instead, the disk cleanup manager is designed to be flexible and extensible by enabling any developer to implement and register their own disk cleanup handler.
  Any developer can extend the available disk cleanup services by implementing and registering a disk cleanup handler.
references:
- https://persistence-info.github.io/Data/diskcleanuphandler.html
- https://www.hexacorn.com/blog/2018/09/02/beyond-good-ol-run-key-part-86/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-02-07
tags:
- attack.persistence
logsource:
  product: windows
  category: registry_add
detection:
  selection:
    EventType: CreateKey
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\'
  filter_main_default_keys:
        # Default Keys
    TargetObject|endswith:
    - '\Active Setup Temp Folders'
    - '\BranchCache'
    - '\Content Indexer Cleaner'
    - '\D3D Shader Cache'
    - '\Delivery Optimization Files'
    - '\Device Driver Packages'
    - '\Diagnostic Data Viewer database files'
    - '\Downloaded Program Files'
    - '\DownloadsFolder'
    - '\Feedback Hub Archive log files'
    - '\Internet Cache Files'
    - '\Language Pack'
    - '\Microsoft Office Temp Files'
    - '\Offline Pages Files'
    - '\Old ChkDsk Files'
    - '\Previous Installations'
    - '\Recycle Bin'
    - '\RetailDemo Offline Content'
    - '\Setup Log Files'
    - '\System error memory dump files'
    - '\System error minidump files'
    - '\Temporary Files'
    - '\Temporary Setup Files'
    - '\Temporary Sync Files'
    - '\Thumbnail Cache'
    - '\Update Cleanup'
    - '\Upgrade Discarded Files'
    - '\User file versions'
    - '\Windows Defender'
    - '\Windows Error Reporting Files'
    - '\Windows ESD installation files'
    - '\Windows Upgrade Log Files'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate new entry added by windows
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activity where an attacker modifies registry keys related to the Disk Cleanup Handler in Windows. The Disk Cleanup Handler is primarily designed for maintaining system performance by removing unnecessary files. However, by creating or modifying these handlers, attackers can achieve persistence on a compromised system, ensuring their malicious payloads or remote access tools execute on system startup or at regular intervals.

  The possible attacker objective could involve maintaining long-term access to the system even after initial access vectors are closed. They may seek to execute malicious scripts or binaries disguised within legitimate system functions.

  Relevant MITRE ATT&CK techniques associated with this behavior include **T1547.001 - Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder**, as it leverages persistence through the Windows registry. Primary data sources for detection include Windows Registry add events, particularly those reflecting changes under the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\` path.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate recent registry modifications within the specified path. Log entries that show creation or significant changes to keys may indicate potential malicious persistence activity.

  - **Cross-Reference Known Keys**: Compare created or modified keys against known legitimate entries and the filter list. Any keys not aligned with standard handlers should be flagged for further analysis.

  - **Analyze System Behavior**: Monitor for unusual system behavior or performance issues following the detected change in registry settings. Check for the execution of unexpected applications or processes tied to the modified cleanup handlers.

  - **Collect and Evaluate Forensic Artifacts**: Gather system logs, including startup logs and application event logs, to confirm whether any suspicious actions were triggered by the registry modifications, particularly around system boot or user logon events.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of persistence mechanisms on enterprise environments. The likelihood of an attacker exploiting such a method for sustained access could contribute to severe breaches and prolonged compromise if undetected.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage as legitimate applications might also modify registry keys under this path without malicious intent. The detection logic assumes that key modifications from trusted processes are either minimal or well-documented. Moreover, proper logging settings must be enabled on Windows systems to capture registry changes; without this, the detection will not function effectively.

