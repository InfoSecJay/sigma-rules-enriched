logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\CurrentControlSet\Services\NTDS\DirectoryServiceExtPt'
    - '\CurrentControlSet\Services\NTDS\LsaDbExtPt'
  filter_domain_controller:
    Image: 'C:\Windows\system32\lsass.exe'
    Details:
    - '%%systemroot%%\system32\ntdsa.dll'
    - '%%systemroot%%\system32\lsadb.dll'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to load DLLs via the LSASS (Local Security Authority Subsystem Service) process using undocumented Registry keys. This technique can be leveraged by attackers aiming to perform privilege escalation or execute malicious payloads while evading detection. By manipulating LSASS, adversaries may steal credentials or insert their malicious code into a critical security process, thereby gaining elevated privileges and control over the system.

  The relevant MITRE ATT&CK tactics for this rule are Execution (T1203), Privilege Escalation (T1068), and Persistence (T1547.008), as it describes a method to maintain access to a compromised system via manipulation of a core Windows service. The primary sources of data that will contain crucial evidence for this detection are registry event logs focused on changes in LSASS-related subkeys.

  ### Investigation Steps
  - **Review Registry Logs**: Examine any registry event logs for entries pertaining to `\CurrentControlSet\Services\NTDS\DirectoryServiceExtPt` or `\CurrentControlSet\Services\NTDS\LsaDbExtPt`. Look for unauthorized modifications or unusual patterns that match the detection criteria.
  - **Analyze Process Activity**: Investigate process creation events related to `C:\Windows\system32\lsass.exe`. Cross-reference timestamps of registry modifications with process execution times to identify potential malicious activities.
  - **Check for DLL Injection**: Look into DLLs loaded by LSASS to see if `ntdsa.dll` or `lsadb.dll` are present in an unexpected context, or if any unheard-of modules are injected into LSASS.
  - **Evaluate Authorization Levels**: Assess the accounts involved in the suspicious registry modifications and DLL loads. Investigate their permissions and role assignments within Active Directory to determine if any unauthorized privilege escalations have occurred.

  ### Prioritization
  The severity of this alert is high due to the potential impact of unauthorized access to sensitive credential information and the risk of lateral movement within the network, which could lead to significant data breaches or system compromises in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly if logging is not enabled for registry events or if certain elevated privileges are used to obscure actions within LSASS. The detection logic assumes that any modification of the specified registry keys and the execution of certain DLLs for LSASS are malicious, and it may falter with legitimate administrative activities. Proper logging for registry modifications and process creation must be enabled for this alert to function effectively.

