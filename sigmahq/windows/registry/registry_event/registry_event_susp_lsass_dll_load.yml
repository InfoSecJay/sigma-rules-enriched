note: |
  ### Technical Context

  This Sigma rule detects the loading of dynamic link libraries (DLLs) into the Local Security Authority Subsystem Service (LSASS) process using specific undocumented registry keys. This behavior is commonly associated with privilege escalation and persistence techniques employed by attackers to illicitly access sensitive information such as credential data stored in memory. The likely attacker objective is to capture and exploit credentials or gain unauthorized access to systems requiring elevated privileges.

  Relevant MITRE ATT&CK tactics and techniques include "Privilege Escalation" (TA0004) and "DLL Injection" (T1547.008). The primary telemetry source involves Windows registry event logs, specifically monitoring the target object associated with LSASS. The potential security impact is significant since unauthorized access to LSASS can lead to credential harvesting and subsequent lateral movement within the network. This detection alone does not confirm malicious intent; it indicates potential exploitation requiring further investigation.

  ### Investigation Steps

  - **Review registry access logs:** Check Windows Registry logs (Event ID 4657) for modifications to `\CurrentControlSet\Services\NTDS\DirectoryServiceExtPt` and `\CurrentControlSet\Services\NTDS\LsaDbExtPt`. Legitimate modifications typically originate from known system processes and are not executed frequently.

  - **Correlate with process events:** Investigate Security Event ID 4688 to identify the creation of new processes related to `C:\Windows\system32\lsass.exe`. Look for suspicious parent processes, especially those without legitimate administrative context.

  - **Inspect specific DLL loads:** Validate the presence and integrity of `ntdsa.dll` and `lsadb.dll` loaded into LSASS. If found, examine the timestamps and file hashes against known good baselines.

  - **Identify possible credential access attempts:** Look for associated Sysmon Event ID 10 for process access events on LSASS that indicate suspicious activity, such as access by unexpected processes (e.g., tools like mimikatz).

  - **Consider host role relevance:** Assess the significance of the host. If the affected system is a Domain Controller, the potential impact is critical, warranting immediate containment and deeper investigation.

  ### Prioritization

  This alert carries a high severity level, primarily due to its association with potential credential theft and privilege escalation. The likelihood of malicious abuse is elevated, as this method is commonly weaponized by attackers. Given the sensitive role of LSASS in Windows security architecture, any detected anomalies here must be addressed urgently.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques; for example, attackers could employ alternative methods to load DLLs or use legitimate tools under a trusted process context. Ensuring a complete registry event log capture and Sysmon configuration is essential for reliable detection. Legitimate administrative tools might trigger the alert under certain configurations, complicating triage. Additionally, companion detections monitoring unauthorized LSA access attempts or abnormal process creation can bolster coverage against exploitation.

