  ### Technical Context

  This rule detects the creation of specific registry entries associated with the Azorult malware, indicating potential compromise or malicious persistence mechanisms. The primary objective of an attacker deploying Azorult is to exfiltrate sensitive information, such as credentials and personal data, from the infected system. This behavior fits within the MITRE ATT&CK framework under the tactic of Persistence and the technique of Registry Run Keys/Startup Folder (T1112).

  The primary telemetry sources for this detection are Windows registry event logs, specifically Event IDs 12 (Registry Key Creation) and 13 (Registry Key Value Set). If this behavior corresponds to malicious activity, it could lead to severe security impacts, including data breaches. It is critical to note that this detection alone does not confirm the execution of Azorult or any other malware without further investigation.

  ### Investigation Steps

  - **Review registry events:** Investigate Event IDs 12 and 13 for newly created entries under `HKEY_LOCAL_MACHINE\SYSTEM\services\localNETService`. Check the timestamps and user accounts associated with the changes.

  - **Cross-reference processes:** Validate against Windows Event ID 4688 (Process Creation) to identify if any processes were initiated concurrently with the registry changes, especially looking for known Azorult indicators (e.g., suspicious executables).

  - **Assess the legitimacy of service:** Determine whether `localNETService` is a legitimate service for your environment by comparing it against documented services. Documented entries should not normally be altered or created.

  - **Check for file artifacts:** Look for any newly created or modified files in the system associated with the registry entry, using Sysmon Event ID 11 (File Creation) or similar logs. Files created by Azorult could include executables or scripts in user directories or temporary folders.

  - **Analyze network activity:** Investigate any outbound connections during the timestamps of relevant registry changes using firewall logs or network traffic analysis tools, paying particular attention to unusual patterns indicative of data exfiltration.

  - **Identify potential evasion tactics:** Note if legitimate applications could enter or modify the registry for similar behaviors under system management scenarios, as this could lead to false positives.

  ### Prioritization

  The alert severity is critical, given the potential impact on sensitive information and the high likelihood of malicious abuse by known malware like Azorult. The specific behavior detected is commonly weaponized in various cybercriminal campaigns, warranting prompt attention.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as malware that avoids detection by altering registry keys in less-observed areas. Proper log configurations for registry events are required to ensure comprehensive coverage. Additionally, legitimate system administrative activities may trigger similar alerts, necessitating context for accurate assessment. Companion detections such as monitoring for unusual file creation or unexpected outbound connections can strengthen the overall coverage of this threat.

