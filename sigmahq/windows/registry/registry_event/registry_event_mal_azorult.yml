  ### Technical Context

  This rule detects the creation of a specific registry key associated with the Azorult malware, indicating an attempt at persistence on a compromised system. The likely objective of the attacker is to maintain access and facilitate exfiltration of sensitive data, including credentials and personal information, often targeting enterprise environments. This behavior aligns with the MITRE ATT&CK technique for Exfiltration Over Command and Control Channel (T1041) and Persistence via Registry Run Keys/Startup Folder (T1112).

  The primary telemetry source includes Windows registry event logs, specifically Event IDs 12 and 13, which relate to registry key creation and modification. If malicious, this activity could lead to potential data breaches and ongoing unauthorized access to systems. Importantly, this detection does NOT confirm the active presence of Azorult malware on a system or guarantee that the malware is operational; it only indicates registry manipulation consistent with its installation.

  ---

  ### Investigation Steps

  - **Review registry event logs:**
    Examine Windows Security Event ID 12 and ID 13 for alterations to the 'SYSTEM\services\localNETService' registry key. Confirm entries within the last 24 hours to establish relevance to the alert.

  - **Identify suspicious process activity:**
    Look for executed processes linked to the registry modification by querying Sysmon Event ID 1. Focus on processes spawned shortly after the registry change, especially those running from temporary or unusual directories.

  - **Correlate with known indicators of compromise (IOCs):**
    Cross-reference any captured hashes or URLs regarding 'localNETService' execution against threat intelligence feeds to confirm association with Azorult.

  - **Assess legitimate configurations:**
    Investigate for benign uses of the 'localNETService' key, noting that typical enterprise behavior may involve trusted service accounts or pre-approved applications modifying this registry key for legitimate network service configurations.

  - **Check for further network communications:**
    Use Windows Firewall logs or network monitoring tools to identify any outbound traffic associated with the processes linked to the registry event, specifically targeting unusual ports or connections.

  - **Validate persistence measures:**
    Confirm if other persistence mechanisms are present by assessing the Startup folder and Task Scheduler for additional tasks or registry run entries created alongside the detected entry.

  ---

  ### Prioritization

  The alert is critical due to its potential impact on sensitive information residing on the affected system and the high likelihood of Malicious use, as Azorult is a common threat in data exfiltration scenarios. The detection of registry changes for persistence is a tactic frequently weaponized by attackers to maintain footholds in networks.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded through techniques such as legitimate modifications by trusted applications or disabling registry auditing, which could prevent logging of relevant changes. Comprehensive logging of registry alterations is essential for reliable detection. Additionally, benign applications or authorized system configurations may inadvertently trigger the alert, requiring contextual review. A related detection to enhance coverage would be capturing anomalous PowerShell execution patterns, as attackers might employ PowerShell to manipulate registry settings indirectly.

