  ### Technical Context
  This detection rule targets registry entries associated with the Azorult malware, which is designed to steal sensitive information such as passwords, credit card data, and other confidential information from infected systems. The rule specifically identifies changes in the Windows registry that commonly occur during Azorult execution, indicating that the malware has likely been executed on the system. Attackers using Azorult aim to establish a foothold in the environment while exfiltrating sensitive data, making this detection particularly relevant for organizations concerned about information security threats.

  The Azorult malware primarily aligns with the following MITRE ATT&CK tactics and techniques:
  - **Execution (T1203)**: Through execution of the malware, attackers can gain initial access to a system.
  - **Persistence (T1112)**: By creating and modifying registry entries, Azorult ensures it can maintain its presence on the host.
  - **Defense Evasion (T1070)**: Modifying the registry may also allow the malware to evade detection from security solutions.

  To effectively detect these activities, primary data sources include Windows registry event logs, specifically Event ID 12 (Registry Key Created) and Event ID 13 (Registry Key Deleted), which would reveal unauthorized modifications to the registry.

  ### Investigation Steps
  - **Check Registry Event Logs**: Review the Windows registry event logs for Event ID 12 and Event ID 13. Look for any entries that include `SYSTEM\services\localNETService` to identify unauthorized registry modifications.
  - **Analyze Process Creation Events**: Investigate recent process creation events to see if there are processes associated with Azorult execution. Pay close attention to unusual or unexpected applications running around the same time as the identified registry changes.
  - **Identify Related Network Activity**: Examine outbound network traffic for any connections to known malicious domains or IP addresses associated with Azorult. Check for indicators of data exfiltration or command and control communication.
  - **Review Antivirus/Endpoint Detection Alerts**: Consult EDR/AV alerts related to malware detection on affected endpoints. Cross-reference these alerts with the timeline of the registry changes for correlation.

  ### Prioritization
  This alert is classified as critical due to the potential for significant data loss and compromise. The likelihood of such an event occurring increases if there are already existing vulnerabilities or exploits within the environment, making immediate investigation crucial.

  ### Blind Spots and Assumptions
  Detection may be limited if registry event logging is not fully enabled or configured properly on endpoints, particularly for systems with stringent logging policies. Additionally, the detection logic assumes that the specific registry key is consistent with Azorult infections, which may not hold if attackers modify their methods. Organizations must ensure comprehensive logging is turned on for registry activities to guarantee this rule is effective.

