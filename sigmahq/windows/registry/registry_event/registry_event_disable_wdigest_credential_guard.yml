  ---

  ### Technical Context

  This Sigma rule detects modifications to the registry key value of `IsCredGuardEnabled` in the path `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest`, which is used to disable Credential Guard. Attackers may target this setting to enable credential caching as a stepping stone for credential theft or lateral movement. This behavior aligns with MITRE ATT&CK tactics of Defense Evasion (T1112) and Persistence, as it modifies system security settings to facilitate unauthorized access.

  Primary telemetry sources for this detection include Windows registry event logs. If the modification is malicious, the impact could be severe, as it potentially allows attackers to leverage cached credentials, increasing their chances of lateral movement across the network. However, mere detection of this registry change does not confirm malicious intent; it must be corroborated with additional context.

  ---

  ### Investigation Steps

  - **Check Registry Modification Details:** Verify the `IsCredGuardEnabled` value in the registry (HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest). A change to `0` indicates potential malicious intent, while `1` reflects normal operations with Credential Guard enabled.

  - **Review Change Audit Logs:** Examine Windows Security Event ID 4663 for access attempts to the registry key. Look for entries correlating with the time of the modification, particularly those logged by unrecognized users or accounts with elevated privileges.

  - **Analyze User Accounts:** Assess the accounts that made the changes. Check for unusual user or service account activity in Active Directory logs (Event ID 4624). Legitimate system accounts, such as `SYSTEM` or administrative accounts, are standard; anything atypical should be scrutinized.

  - **Correlate with Lateral Movement Activity:** Cross-reference this change with other telemetry (e.g., Event ID 4769 for Kerberos service ticket requests). Unusual ticket requests shortly after the modification can indicate unwanted credential usage.

  - **Examine Process Creation Logs:** Check for process creation events (Event ID 4688) around the time of the registry change. Look for unusual processes like PowerShell or cmd.exe being executed by non-administrative users that may indicate a script used for exploitation.

  - **Determine System Role and Criticality:** Identify if the affected host has a critical role in the infrastructure (e.g., Domain Controllers or other sensitive servers). Compromise here could have extensive repercussions, necessitating immediate escalation.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact if Credential Guard is disabled on critical systems. The likelihood of malicious abuse is elevated, as this technique is a known method for attackers to facilitate credential theft and lateral movement within a network. Such modifications are often weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  This rule may have limitations as legitimate administrative actions or configuration changes could trigger the alert if not properly captured or evaluated. Proper registry auditing must be enabled to ensure reliable detection. Additionally, software updates or legitimate system tuning might lead to similar modifications. A related detection to strengthen coverage would be monitoring for unauthorized account creations or administrative changes (T1078) that may accompany such registry tampering.

