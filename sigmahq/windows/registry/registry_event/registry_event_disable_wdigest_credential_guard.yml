detection:
  selection:
    TargetObject|endswith: '\IsCredGuardEnabled'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to the Windows registry key responsible for enabling or disabling Credential Guard (`IsCredGuardEnabled`). Such changes typically aim to exploit credential caching mechanisms by disabling protections that prevent credential theft. The likely attacker objective is to compromise user credentials, facilitating unauthorized access and lateral movement within the network. This activity aligns with the MITRE ATT&CK technique T1112: Modify Registry, which falls under the Persistence and Defense Evasion tactics.

  The primary telemetry source for this detection is Windows Registry events, specifically focusing on modifications to the registry that indicate whether Credential Guard is enabled or not. If this modification is malicious, it significantly increases the risk of credential theft and unauthorized access to sensitive resources. This detection alone does not confirm that the modification was indeed malicious, as legitimate administrative changes or misconfigurations can also trigger this alert.

  ### Investigation Steps

  - **Check for registry modification details**: Review Event ID 4657 from Security logs or relevant registry monitoring logs to identify the time, user, and process responsible for the modification of `IsCredGuardEnabled`. Compare timestamps with relevant activity logs for context.

  - **Validate process behavior**: Look for any suspicious processes that may have executed around the time of the registry modification by reviewing Event ID 4688 (Process Creation) in the Security logs. Malicious indicators could include unexpected parent processes like `powershell.exe` or `cmd.exe`.

  - **Identify legitimate administrative actions**: Determine if any authorized personnel executed administrative tasks around the same timeframe. Check for documented changes in user or asset permissions that may explain a benign modification.

  - **Correlate with credential dump tools**: Search for known credential dumping tools (such as Mimikatz) in process execution logs (Event ID 4688). Look for associated commands or file creations that may indicate malicious use of the modification.

  - **Examine user account activity**: Review authentication logs (Event ID 4624) to identify any unusual logins or credential usage after the modification. Focus on accounts that exhibit lateral movement behavior in the network.

  ### Prioritization

  This alert is considered high severity due to the significant security implications of disabling Credential Guard on enterprise systems, which could lead to compromised credentials and potentially widespread unauthorized access. Given the nature of the registry change, there is a high likelihood of malicious intentions, particularly when correlated with unauthorized access attempts or known exploitation techniques.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative changes if sufficient logging is not enabled or if the registry monitoring is improperly configured. Legitimate software installations or updates may also trigger this alert. Additionally, adversaries might employ techniques to obfuscate changes or revert protections after execution. A related detection is monitoring for execution of credential dumping tools, which can enhance the investigative context surrounding this type of registry modification.

