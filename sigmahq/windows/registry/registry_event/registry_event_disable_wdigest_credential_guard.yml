detection:
  selection:
    TargetObject|endswith: '\IsCredGuardEnabled'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential malicious modifications to the Windows registry, specifically targeting the `IsCredGuardEnabled` property within the WDigest security provider settings. The objective of such modifications is often to disable Credential Guard (CredGuard), a security feature designed to protect credentials from being stolen, particularly in scenarios involving credential dumping and lateral movement. Attackers may perform this action to facilitate the use of cached credentials, making it easier for them to gain unauthorized access to critical systems.

  The relevant MITRE ATT&CK tactics and techniques for this detection include "Persistence" (TA0003) and "Defense Evasion" (TA0005), specifically the technique "Modify Registry" (T1112). These tactics highlight the intentions behind manipulating system configurations to maintain access and evade detection.

  The primary data source for this detection rule is Windows registry event logs, which capture changes to registry keys and values, allowing security analysts to monitor modifications that could indicate suspicious activities.

  ### Investigation Steps
  - **Review Registry Event Logs**: Examine Windows registry event logs for changes to the `IsCredGuardEnabled` property under `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest`. Look for unusual timestamps or changes from non-administrative accounts.

  - **Analyze Event Correlation**: Check for other events around the same time that could indicate malicious behavior, such as logon events or process creations that align with the modification to `IsCredGuardEnabled`.

  - **Investigate Process Activity**: Look for processes that may leverage the disabled credential guard, such as `Mimikatz`, or other credential dumping tools. Identify any processes spawned during or just after the registry modification.

  - **Assess User Account Activity**: Identify the user accounts making the registry changes and any recent system modifications or logins associated with those accounts, prioritizing those with administrative privileges.

  ### Prioritization
  The alert's severity is high due to the critical nature of credential protection within enterprise environments. Disabling Credential Guard significantly increases the risk of credential theft, lateral movement, and potential compromise of sensitive systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments that do not log changes to the Windows registry or lack appropriate security monitoring tools to identify such modifications. The detection logic assumes that the misuse of administrative privileges is involved since only users with high-level access can modify security configuration settings. Additionally, comprehensive logging configurations must be enabled to ensure that registry modifications are captured effectively for this alert to function properly.

