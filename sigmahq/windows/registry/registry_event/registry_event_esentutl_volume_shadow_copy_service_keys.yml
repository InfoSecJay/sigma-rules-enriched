title: Esentutl Volume Shadow Copy Service Keys
id: 5aad0995-46ab-41bd-a9ff-724f41114971
status: test
description: Detects the volume shadow copy service initialization and 
  processing via esentutl. Registry keys such as 
  HKLM\\System\\CurrentControlSet\\Services\\VSS\\Diag\\VolSnap\\Volume are 
  captured.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-3---esentutlexe-sam-copy
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: 'System\CurrentControlSet\Services\VSS'
    Image|endswith: 'esentutl.exe'     # limit esentutl as in references, too many FP to filter
  filter:
    TargetObject|contains: 'System\CurrentControlSet\Services\VSS\Start'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the initialization and processing of the Volume Shadow Copy Service (VSS) via `esentutl.exe`. Malicious actors may exploit VSS to create shadow copies of data, allowing them to backup files before deletion or to prepare for data exfiltration, which can aid in evading detection after an attack. This behavior aligns with the MITRE ATT&CK technique for Credential Access T1003.002, as attackers may attempt to access sensitive data stored within shadow copies.

  The primary telemetry source for this detection comprises Windows registry events, specifically targeting the Key `HKLM\System\CurrentControlSet\Services\VSS\Diag\VolSnap\Volume`. If malicious activities are confirmed, it could imply potential data theft or preparation for ransomware deployment. However, mere detection of this activity does NOT confirm that an adversary has successfully exfiltrated data; it only indicates that VSS was manipulated.

  ### Investigation Steps

  - **Verify the Execution of `esentutl.exe`:** Confirm if `esentutl.exe` was executed by reviewing Windows Security Event ID 4688 for process creation logs. Look for suspicious parent processes or unusual command-line arguments.

  - **Check Registry Modifications:** Investigate any changes or access attempts to the registry path `HKLM\System\CurrentControlSet\Services\VSS\Diag\VolSnap\Volume`. Look for unusual modifications that deviate from normal administrative activity.

  - **Identify Recent VSS Snapshots:** Use Windows commands like `vssadmin list shadows` to review recent shadow copies. Any unexpected creation timestamps, particularly closely timed with user or application activity, may indicate malicious intent.

  - **Establish Baseline Behavior:** Document normal use cases for `esentutl.exe` in your environment. Legitimate system maintenance or backup processes should align closely with routine windows maintenance cycles. Deviations from this could indicate suspicious activity.

  - **Determine Impact and Context:** Assess the criticality of the system involved. If `esentutl.exe` is executing in a highly-sensitive environment (e.g., domain controllers or critical databases), elevate the urgency level of the response.

  - **Search for Correlated Alerts:** Investigate for additional alerts related to data access in conjunction with this detection. Excessive or anomalous data access patterns surrounding shadow copies can indicate attempts at data exfiltration or preparation for ransomware attacks.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on sensitive data and systems where corruption, exfiltration, or unauthorized access could occur. The likelihood of malicious use is significant, especially given the increase of ransomware tactics that leverage shadow copies for data manipulation. This behavior is frequently observed in sophisticated attacks, making prompt investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into other methods adversaries could use to manipulate VSS without triggering the alert, such as using alternative utilities for manipulation or leveraging system permissions. Adequate logging configurations, especially around registry and process creation, are crucial for reliable detection. Legitimate administrative activities, such as backup operations using VSS, may inadvertently trigger this alert. Companion detections involving unusual file access patterns or other evidence of data manipulation would strengthen incident coverage.

