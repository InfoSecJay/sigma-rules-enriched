title: Esentutl Volume Shadow Copy Service Keys
id: 5aad0995-46ab-41bd-a9ff-724f41114971
status: test
description: Detects the volume shadow copy service initialization and processing
  via esentutl. Registry keys such as HKLM\\System\\CurrentControlSet\\Services\\VSS\\Diag\\VolSnap\\Volume
  are captured.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-3---esentutlexe-sam-copy
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: 'System\CurrentControlSet\Services\VSS'
    Image|endswith: 'esentutl.exe'     # limit esentutl as in references, too many FP to filter
  filter:
    TargetObject|contains: 'System\CurrentControlSet\Services\VSS\Start'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the Volume Shadow Copy Service (VSS) in Windows systems, specifically through the use of the `esentutl.exe` utility. The rule captures activity related to the initialization and processing of VSS, focusing on registry keys indicative of shadow copy manipulation. Attackers often target VSS to manipulate or delete shadow copies, which can hinder forensic analysis after a compromise, thereby enabling persistence or data exfiltration without detection.

  The likely objective of an attacker utilizing this technique is to cover their tracks or retain access to previous system states while evading security measures. An example of such a threat actor would be one employing malicious tactics similar to those associated with ransomware operations or APT groups focused on data theft. This detection aligns with the MITRE ATT&CK framework, specifically under the tactics of Credential Access (TA0006) and the technique for Credential Dumping (T1003.002).

  Key telemetry sources to focus on include Windows registry event logs, particularly those tracking changes made to the specified VSS registry paths. Monitoring the execution patterns of `esentutl.exe` alongside the associated registry edits can reveal suspicious activity indicative of malicious behavior.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the registry event logs for changes to `HKLM\System\CurrentControlSet\Services\VSS\Diag\VolSnap\Volume`. Look for unusual modification timestamps or unexpected values that may indicate malicious intent.
  - **Correlate with Process Logs**: Analyze process creation logs to identify instances of `esentutl.exe` execution. Pay attention to the command-line arguments used, as they may provide context on the specific operations being performed.
  - **Identify Related Network Activity**: Investigate any network traffic that occurred during the time `esentutl.exe` was executed. Look for connections to external or suspicious IP addresses, especially during the manipulation of volume shadow copies.
  - **Check for Artifacts of Past Activity**: Assess for the presence of shadow copies (using tools like `vssadmin`) to confirm whether copies have been altered or removed. This can provide insight into previous actions taken on the system that may correlate with the detected activity.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact on an organization's ability to perform post-incident analysis and data recovery. Given that shadow copies can be crucial for forensic investigations and data integrity, any unauthorized manipulation poses a serious risk to the enterprise.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, as legitimate administrative tasks may also trigger this rule, leading to potential false positives. Additionally, this detection assumes that logging is correctly configured for registry events and that `esentutl.exe` is being actively monitored. If registry logging is disabled or misconfigured, critical activity may go undetected, leaving opportunities for malicious actions unmonitored.

