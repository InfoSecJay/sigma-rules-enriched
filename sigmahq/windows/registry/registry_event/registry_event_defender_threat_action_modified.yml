description: |
  Detects modifications or creations of Windows Defender's default threat action settings based on severity to 'allow' or take 'no action'.
  This is a highly suspicious configuration change that effectively disables Defender's ability to automatically mitigate threats of a certain severity level,
  allowing malicious software to run unimpeded. An attacker might use this technique to bypass defenses before executing payloads.
references:
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
- https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/security-malware-windows-defender-threatseveritydefaultaction
- https://research.splunk.com/endpoint/7215831c-8252-4ae3-8d43-db588e82f952
- https://gist.github.com/Dump-GUY/8daef859f382b895ac6fd0cf094555d2
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
author: 'Matt Anderson (Huntress)'
date: 2025-07-11
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\'
    TargetObject|endswith:
    - '\1'         # Low severity
    - '\2'         # Moderate severity
    - '\4'         # High severity
    - '\5'         # Severe severity
    Details:
    - 'DWORD (0x00000006)'         # Allow
    - 'DWORD (0x00000009)'         # NoAction
  condition: selection
falsepositives:
- Legitimate administration via scripts or tools (e.g., SCCM, Intune, GPO enforcement).
  Correlate with administrative activity.
- Software installations that legitimately modify Defender settings (less common for
  these specific keys).
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious modifications to Windows Defender's default threat action settings, particularly those changing the severity classifications to 'allow' or 'no action.' Such changes enable malware to bypass automatic mitigation processes, significantly increasing the risk of infection. Attackers may exploit this tactic to weaken system defenses, permitting malicious software to execute without interference and aiming for broader exploitation within an organization.

  Relevant MITRE ATT&CK techniques include **T1562.001 - Disable or Modify Security Tools**, which encompasses actions taken to alter or disable protective software settings. By changing the default actions of Windows Defender based on threat severity, an attacker can ensure that even significant threats are not appropriately addressed, facilitating additional malicious activities.

  Primary data sources for this alert are registry event logs that track changes to Windows Defender settings. These logs will provide insights into which modifications were made and when, helping analysts understand if a change was made under suspicious circumstances or by authorized administrative actions.

  ### Investigation Steps
  - **Review Registry Event Logs**: Investigate registry changes related to `\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\` to identify unauthorized modifications. Look for timestamps and user accounts involved in these changes.

  - **Correlate Administrative Activity**: Check if the detected changes coincide with legitimate administrative actions or known administrative scripts (e.g., SCCM, Intune, or Group Policy Objects). This can help determine if the activity is valid or malicious.

  - **Assess User Privileges**: Evaluate the user accounts that performed the changes to the Defender settings. Ensure these accounts have appropriate permissions and investigate any anomalies.

  - **Look for Associated Malicious Indicators**: If suspicious modifications are confirmed, further investigate for signs of malware execution or other malicious activity, such as unusual process creation, network connections, or system performance anomalies.

  ### Prioritization
  The severity of this alert is classified as high due to the potential impact of disabling essential security features. Attackers leveraging this method can introduce severe malware threats into an environment, increasing the likelihood of a successful compromise and the subsequent need for expensive remediation efforts.

  ### Blind Spots and Assumptions
  While this detection rule effectively highlights suspicious changes to Windows Defender settings, it is possible that legitimate administrative actions may not be captured, leading to false positives. The detection logic assumes that registry changes are inherently malicious unless proven otherwise, which requires contextual analysis. Also, this rule relies on adequate logging of registry events; if policy settings do not enable this logging, detection effectiveness may be diminished.

