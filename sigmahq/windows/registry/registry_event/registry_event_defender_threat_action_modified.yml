  ---

  ### Technical Context

  This Sigma rule detects modifications or creations of Windows Defender's default threat action settings, specifically changes to severity levels that switch to 'allow' or take 'no action'. The likely attacker objective is to disable automatic threat mitigation, paving the way for malicious software execution. This detection relates to the MITRE ATT&CK technique T1562.001 (Impair Defenses - Disable or Modify Tools). The primary telemetry comes from Windows Registry Event logs focusing on specific keys tied to Defender settings. If malicious, this action could enable the execution of harmful software without the usual prevention measures in place. Importantly, this detection does NOT confirm compromise on its own; it indicates a change that warrants further investigation into potential malicious intent.

  ---

  ### Investigation Steps

  - **Identify modification timestamps: ** Check the Registry logs for Event ID 4663, focusing on the timestamps of changes made to the `\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\` path. Compare against recent administrative activities to assess legitimacy.

  - **Review current Defender settings: ** Examine the current values under `ThreatSeverityDefaultAction` using Registry Explorer or PowerShell. A legitimate value should reflect Defender's default settings (typically '0x00000000' for 'Block' and other appropriate DWORDs).

  - **Correlate with administrative activity: ** Investigate if the changes correlate with known legitimate administrative actions like Group Policy updates, System Center Configuration Manager (SCCM) deployments, or other authorized tools. Check for Event ID 4688 (Process Creation) to see if these changes align with authorized tasks.

  - **Identify malicious indicators: ** Search for unsupported DWORD values (0x00000006 for 'Allow' or 0x00000009 for 'NoAction') in the logs not associated with expected administrative actions. Use Event ID 5145 to track access to the registry that leads to these changes, indicating potentially malicious alterations.

  - **Search for related malware behavior: ** Investigate if the system has shown signs of malware activity in the vicinity of the time these changes occurred. Look for suspicious process creation events (Event ID 4688) or unusual network traffic (using Network Event logs) that might suggest exploitation or lateral movement occurring after the configuration changes.

  ---

  ### Prioritization

  This alert is of high severity due to its potential for significant security impact. The affected system runs critical security software, making it a prime target for malicious abuse. The behavior is frequently weaponized by attackers attempting to disable or bypass endpoint defenses, warranting prompt attention from SOC analysts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if Registry auditing isn't enabled or if log retention policies are overly restrictive, potentially leading to missed evidence of changes. Legitimate activities that could trigger this alert include authorized administrative changes via scripts or tools (e.g., GPO implementation). A related detection for comprehensive coverage could be monitoring for alterations in Windows Defender's "Real-time Protection" settings, which would strengthen overall visibility into potential tampering.

