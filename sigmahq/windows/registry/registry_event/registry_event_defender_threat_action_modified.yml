  enforcement). Correlate with administrative activity.
- Software installations that legitimately modify Defender settings (less common
  for these specific keys).
level: high
note: |
  ### Technical Context

  This Sigma rule detects changes to Windows Defender's default threat severity actions. Specifically, modifications that set the actions to "allow" or "no action" on threats of low, moderate, high, or severe severity levels are monitored. The likely attacker objective is to bypass automated defenses, facilitating the execution of malicious payloads without interference from Windows Defender. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001). Primary telemetry sources include Windows Registry events related to the Defender threat settings, capturing specific actions made to the registry keys. If malicious, such modifications severely weaken the endpoint's security posture. Importantly, this detection does NOT confirm malicious intent on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Check registry modifications:** Review Windows Registry Event IDs 4657 and 3702 for changes to `\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\`. Look for alterations corresponding to DWORD values of `0x00000006` (Allow) or `0x00000009` (NoAction) which indicate potentially malicious intent.

  - **Correlate with administrative activities:** Examine recent administrative actions, such as those through Group Policy Objects (GPOs) or configuration management tools (like SCCM or Intune), around the same timeframe as the detected modification. Legitimate changes often align with routine maintenance or security retrofits.

  - **Identify high-confidence indicators:** Look at Event ID 4688 for process creation events that occurred immediately before or after the registry modification. Frequent executions of PowerShell or scripts modifying Defender settings are strong indicators of a potential compromise.

  - **Review logged user activities:** Check the Security Event log for login events (Event ID 4624) and verify if system changes were made during anomalous login times, particularly after-hours or by non-administrative accounts.

  - **Analyze affected systems’ roles:** Assess the criticality of the systems affected by this modification. Systems with high value or sensitive data should be prioritized for deeper investigation against potential exploitation.

  - **Identify legitimate application updates:** Confirm whether any trusted applications were recently installed or updated, as this could provide context for benign modifications to Defender settings. Legitimate activity typically involves expected software management routines without drastic setting changes.

  ### Prioritization

  This alert should be treated as high severity due to the potential security impact a compromised Windows Defender configuration can harbor, especially if the affected system is critical or contains sensitive data. The likelihood of abuse is elevated, as modifications to defensive settings often precede malware deployment.

  ### Blind Spots and Assumptions

  Evasion techniques such as using legitimate administrative tools/scripts could lead to false positives, necessitating thoughtful correlation with expectant activity logs. Proper logging configuration and retention policies must be enforced to ensure reliable detection; missing Windows Registry logs could impede investigations. Additionally, administrative changes for legitimate purposes may trigger this alert, emphasizing the need for contextual awareness. A companion detection, such as monitoring for unusual process creation events around the same timeframe (e.g., Sigma rule for suspicious PowerShell usage), may provide stronger coverage against this behavior.

