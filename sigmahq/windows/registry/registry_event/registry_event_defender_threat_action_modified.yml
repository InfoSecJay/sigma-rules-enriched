logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\'
    TargetObject|endswith:
    - '\1'         # Low severity
    - '\2'         # Moderate severity
    - '\4'         # High severity
    - '\5'         # Severe severity
    Details:
    - 'DWORD (0x00000006)'         # Allow
    - 'DWORD (0x00000009)'         # NoAction
  condition: selection
falsepositives:
- Legitimate administration via scripts or tools (e.g., SCCM, Intune, GPO 
  enforcement). Correlate with administrative activity.
- Software installations that legitimately modify Defender settings (less common
  for these specific keys).
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows Defender's default threat action settings, where the response to threats is altered to either 'allow' or 'no action,' effectively undermining its defense capabilities. Attackers aim to disable or circumvent security mechanisms, thereby enabling the execution of malicious payloads without interference. This behavior corresponds to the MITRE ATT&CK tactic: **Defense Evasion (T1562)** and technique **Impair Defenses (T1685)**.

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring changes in the path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction`. If modified, this action poses a significant security risk as it can permit threats of varying severities to run unchecked. Importantly, this detection does not confirm direct malicious activity on its own; it signals a potential misconfiguration that requires further investigation.

  ### Investigation Steps

  - **Verify modification timestamps:** Check the Windows Registry for Event ID 4657 regarding changes in the `ThreatSeverityDefaultAction` keys to ascertain when they were altered and by which user.

  - **Correlate with administrative actions:** Investigate any recent administrative tasks or script executions (e.g., Group Policy updates, SCCM deployments) to validate if the changes were legitimate by referencing associated logs such as Event ID 4688 (Process Creation) for execution context.

  - **Identify malicious configuration:** Look for `DWORD (0x00000006)` for 'Allow' or `DWORD (0x00000009)` for 'NoAction' under the relevant registry keys. Presence of these values without legitimate justification is a strong indicator of malicious intent.

  - **Examine user roles involved:** Review user roles and their permissions on the affected system; ensure that only trusted administrators have access to change Windows Defender configurations.

  - **Assess legitimate activity:** Identify if there is legitimate usage of any management tools (Intune, SCCM, etc.) around the detected modification timestamp that could explain the changes, thereby ruling out false positives.

  - **Monitor subsequent threat activity:** If modifications are confirmed as suspicious, analyze post-change threat activity (e.g., Event ID 4104 – PowerShell command execution logs) to identify potential malware activity that may have succeeded due to the compromised settings.

  ### Prioritization

  This alert is high priority given it can directly undermine endpoint security measures, facilitating malware execution. The likelihood of abuse is significant because disabling critical security features is a common tactic used by adversaries in various attack scenarios, particularly in ransomware campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by attempts to evade monitoring—for instance, attackers may use legitimate administrative tools to execute changes unnoticed. Reliable detection requires proper configuration and continuous monitoring of relevant Windows Registry paths. Legitimate software installations might also trigger this alert but are less common for the key paths involved. Related detections, such as those monitoring changes in Windows Defender logs (e.g., Event ID 5007 for configuration changes), could strengthen oversight and improve detection capabilities.

