note: |
  ### Technical Context
  This detection rule identifies registry manipulations associated with the RedMimicry Winnti playbook, particularly focusing on changes to the `HKLM\SOFTWARE\Microsoft\HTMLHelp\data` registry key. Attackers leveraging the RedMimicry framework may alter this key to establish persistence on compromised systems or evade detection through changes that don't raise alarm during regular monitoring. The likely objectives of such activity are to maintain access over time, execute malicious payloads upon system startup, or conduct further malicious operations without immediate detection.

  The relevant MITRE ATT&CK techniques for this detection include:
  - **Persistence** (T1112): Modification of registry keys enables attackers to maintain persistence on the affected system.
  - **Defense Evasion** (T1112): By altering system registry keys, attackers may attempt to blend in with normal system operations and avoid detection by security measures.

  The best sources of telemetry for this detection are Windows registry event logs, as they capture activity related to changes in registry keys. Monitoring these logs can provide insights into unauthorized or suspicious alterations that may indicate malicious behavior.

  ### Investigation Steps
  - **Review Registry Event Logs**: Collect and examine Windows registry event logs surrounding the time of the detected manipulation. Look for details on who made the changes and what other actions occurred concurrently.
  - **Analyze Process Creation Events**: Investigate the process creation events around the time of manipulation. Pay attention to processes that may have created child processes linked to the registry changes, potentially unveiling the method of execution.
  - **Check for Installed Applications**: Look for unusual applications or services installed on the system correlating with the time of registry manipulation, as attackers may install additional tools to retain control.
  - **Examine Network Connections**: Review outbound network connection logs around the time of the alteration. Suspicious connections to known malicious IP addresses could indicate command and control (C2) communications related to the manipulation.

  ### Prioritization
  This alert is classified as high severity due to the significant impact of successfully maintained persistence by an attacker, which allows for ongoing control over the affected system. Given the potential for broad compromises associated with persistent threats, rapid investigation is critical to minimize breach ramifications.

  ### Blind Spots and Assumptions
  One potential gap in this detection method is that it may not capture all legitimate administrative changes made to the registry, leading to potential false positives. The logic assumes that the targeted registry key is a reliable indicator of malicious activity associated with persistence mechanisms. For effective detection, it is essential that Windows registry logging is enabled and correctly configured on the monitored systems, as absence of logs will prevent this rule from triggering appropriately.

