  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows registry, specifically changes to `HKLM\SOFTWARE\Microsoft\HTMLHelp\data`. Such activity is indicative of persistence mechanisms deployed by the RedMimicry Winnti attack playbook to maintain access to compromised systems. The likely objective of an attacker utilizing this technique is to evade detection and ensure their malware remains functional even after reboots or system updates.

  The relevant MITRE ATT&CK tactic is "Persistence" (TA0003) and the technique is "Modify Existing Registry Value" (T1112). Primary telemetry sources for this detection include Windows Security Event IDs related to registry modifications, specifically Event ID 4657 (Registry Value Modified). If malicious, the security impact could range from data exfiltration to further lateral movement within the network. This detection does NOT confirm an active compromise without correlating events or additional context, such as user behavior or system logs.

  ### Investigation Steps

  - **Check for recent registry modifications:** Review Windows Security Event ID 4657 for changes to `HKLM\SOFTWARE\Microsoft\HTMLHelp\data`. Look for modification timestamps correlating with user activities; benign modifications might occur during software installations or updates.

  - **Identify the user account making changes:** Examine the fields in Event ID 4657—specifically the "Subject User Name" and "User Security ID"—to determine if the modification was made by a legitimate administrative account or a potentially compromised account.

  - **Correlate with process creation events:** Investigate if the registry modification event coincides with unusual or unauthorized process creation (Event ID 4688 or Sysmon Event ID 1). Look for suspicious processes that may have initiated the registry changes.

  - **Review the system for other indicators of compromise (IoCs):** Conduct a full scan of the affected host for additional IoCs associated with Winnti or RedMimicry, such as unusual outbound network connections or the presence of known malicious artifacts.

  - **Validate against trusted applications:** Cross-reference the modifying application against a list of known trusted applications to assess whether the change was legitimate. Tools like Whitelist or Enterprise Application catalogs may provide useful insights.

  ### Prioritization

  The alert should be considered high severity due to the critical nature of persistent malware mechanisms, especially on sensitive systems. There is a high likelihood of abuse by threat actors utilizing Winnti playbooks, given their historical prevalence in targeted attacks. The overt nature of registry manipulation makes such actions significant warning signs of potential ongoing compromise.

  ### Blind Spots and Assumptions

  Detection limitations exist as skilled adversaries may employ obfuscation techniques to modify or hide registry changes, potentially bypassing detection. The required log sources for reliable detection include comprehensive Windows Security auditing settings. Legitimate activities, such as software updates or administrative changes, may trigger this alert; thus, careful context evaluation is essential. As a companion detection, consider implementing network-level monitoring for connections to known Command and Control (C2) servers frequently associated with Winnti campaigns to strengthen overall threat visibility.

