  ### Technical Context

  This Sigma rule detects modifications to the Windows registry focusing on the `HKLM\SOFTWARE\Microsoft\HTMLHelp\data` path, which is commonly manipulated by adversaries to alter application behaviors or enforce persistence mechanisms. The likely objective is to disrupt operations or maintain persistent access, fitting within the MITRE ATT&CK framework under the tactics of **Persistence** (TA0003) and **Defense Evasion** (TA0005), specifically technique **T1112**. The primary telemetry source for this detection is Windows Registry Event logs.

  If the behavior is malicious, it may enable unauthorized access or control of systems, leading to considerable risk, particularly if the affected systems are critical infrastructure or contain sensitive information. It is essential to note that the detection of registry changes does NOT, on its own, confirm malicious intent, as legitimate software installations or system configurations may also trigger this alert.

  ### Investigation Steps

  - **Check Event Logs for Modifications**: Review Windows Event ID 13 (Registry Key Change) to identify the context and source of the registry modification. Look for unexpected users or processes performing these changes, as legitimate applications typically modify this registry path only during installation.

  - **Investigate User Account Activity**: Examine logs for the user accounts involved in the modification. Leverage Security Event ID 4624 (Logon) to confirm if the modifications occurred during user sessions that align with expected administrative tasks or if there were anomalous logins indicative of potential compromise.

  - **Analyze Related Process Activity**: Cross-reference Sysmon Event ID 1 (Process Creation) for any processes spawned around the time of the registry modification. Focus on processes with unusual command lines or those not commonly associated with administrator functions, which may indicate malicious intent.

  - **Validate Registry Path Access Attempts**: Look for additional Registry Event ID 13 entries involving access to the `HKLM\SOFTWARE\Microsoft\HTMLHelp\data` path by suspicious processes or at unusual times, which can signal evasion tactics being employed by an attacker.

  - **Document Expected Behavior**: Note legitimate changes during software deployments that involve this registry key, typically initiated by system administrators or well-known software installation processes. This helps differentiate benign and malicious activities.

  ### Prioritization

  This alert carries a high severity due to the potential impact on affected systems, especially if they are part of critical business functions. The likelihood of abuse is significant because modification of this registry path is a known tactic used by advanced threats like RedMimicry, making it a prime target for malicious exploitation.

  ### Blind Spots and Assumptions

  Detection could be limited by monitoring configurations not capturing registry changes comprehensively. Evasion techniques include legitimate software installations that modify the registry, which could produce false positives. A related detection to consider is identifying abnormal script execution or task scheduling in conjunction with the registry modification, providing enhanced context around potential malicious activity.

