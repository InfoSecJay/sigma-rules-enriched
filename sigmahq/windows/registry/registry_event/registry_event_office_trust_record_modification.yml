  ---

  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry trust records, specifically under the path `\Security\Trusted Documents\TrustRecords`, which may indicate unauthorized execution of macros in documents. The likely attacker objective is to manipulate trust settings to execute malicious macros automatically, bypassing user prompts. This behavior correlates with the MITRE ATT&CK technique T1566.001 (Phishing: Spear Phishing Attachments).

  Primary telemetry sources include Windows Registry Event logs (typically Event ID 4657) that capture changes to registry keys. If malicious, this could lead to successful payload execution and further system compromise. Importantly, this detection does NOT confirm that a malicious activity has occurred on its own, as legitimate macro usage can also trigger similar modifications.

  ---

  ### Investigation Steps

  - **Identify the modified registry key:** Review Windows Security Event ID 4657 for modifications to the `\Security\Trusted Documents\TrustRecords` key. Legitimate entries should not typically show unexpected changes without user consent.

  - **Check for associated process execution:** Examine Sysmon Event ID 1 for any suspicious process creations that occur concurrently with the registry modification. Look for unexpected or known malicious binaries attempting to execute with elevated privileges.

  - **Review document usage:** Analyze Office application logs or event viewer logs pertaining to the applications (Event ID 307) related to the documents involved. Verify if the document was opened by a known user or if it appears in unexpected contexts.

  - **Assess user context and behavior:** Investigate the user account that made the registry change. Check for history of macros being used, expected document usage patterns, and any unusual access to sensitive files.

  - **Correlate alerts with existing detections:** Look for correlated alerts regarding macro execution or unusual PowerShell activity (such as Event ID 4104 logs) within the same timeframe as the registry modification.

  ---

  ### Prioritization

  This alert should be considered of medium severity as it could impact trusted systems and indicates potential compromise via macro exploitation. The likelihood of misuse is significant given the commonality of macro-based attacks in a user environment. However, the existence of benign macro use means context is critical before escalation.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate macro use to trigger alerts, thus requiring careful tuning to minimize false positives. Implementation of logging measures should include monitoring for Event ID 4657 alongside Sysmon logs to provide context. Normal employee activities, such as legitimate document editing or debugging sessions in development environments, may falsely trigger this alert. A related detection, such as monitoring for unusual VBA script execution (T1559), can complement this rule enhancing overall coverage.

