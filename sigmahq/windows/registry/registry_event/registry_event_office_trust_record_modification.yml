note: |
  ### Technical Context
  This detection rule identifies modifications to trust records within the Windows Registry, specifically targeting the path `\Security\Trusted Documents\TrustRecords`. Such modifications often indicate that malicious actors are attempting to exploit macros to facilitate their attacks, potentially leading to malicious code execution or data exfiltration. The trust record is critical in determining if a macro should be enabled in a document, thus altering the standard security protocols set by the organization to mitigate risks associated with macro use.

  Attack scenarios involving this rule typically involve adversaries using malicious documents that require macro execution to achieve their objectives. By altering trust records, attackers can bypass normal security mechanisms, making it easier to execute arbitrary code or implant malware. The relevant MITRE ATT&CK tactics for this detection include **Initial Access** corresponding with the technique **T1566.001 - Phishing: Malicious File**.

  The primary log sources aiding in this detection are Windows Registry event logs, which provide visibility into when and how modifications to trust records are made, enabling analysts to uncover suspicious activities related to macro usage.

  ### Investigation Steps
  - **Review Registry Event Logs:** Examine Windows Registry event logs for any modifications to the `\Security\Trusted Documents\TrustRecords` key, focusing on timestamps and associated user activities.
  - **Analyze Document Source:** Investigate the source of the documents involved in the macro execution, looking for indicators of phishing or other malicious delivery methods.
  - **Scrutinize Macro Behavior:** Assess any macros that have been executed in conjunction with the trust record modifications. Look for unexpected or rare behaviors that may indicate exploitation.
  - **Identify Unusual User Activity:** Check for abnormal user behavior patterns correlating with the timeframe of the registry modifications, such as elevated privileges or access to sensitive documents.

  ### Prioritization
  The medium severity of this alert reflects the potential risk of macro exploitation, which can lead to significant adverse impacts on data security and integrity in an enterprise environment. Given that legitimate macro usage also raises alerts, analysts should prioritize understanding the context of each detection to mitigate false positives.

  ### Blind Spots and Assumptions
  The rule may generate false positives from legitimate macro usage, indicating a need for additional tuning to reduce noise. It assumes that registry logging is enabled and properly configured on all endpoints. Without appropriate logging mechanisms in place or if users practice safe email habits, the detection may miss attempts to alter trust records by less sophisticated attackers.

