  ---

  ### Technical Context

  This Sigma rule detects modifications to trust records in the Windows Registry, specifically within the `\Security\Trusted Documents\TrustRecords` path. Such modifications suggest that a user or process is manipulating trusted documents, typically associated with the use of macros in Office documents. The likely attacker objective is to enable malicious macros for initial access or persistence on a system.

  Relevant MITRE ATT&CK tactics and techniques include "Initial Access" (TA0001) and "Spear Phishing Attachment" (T1566.001). The primary telemetry source comes from Windows Registry event logs tracking registry modifications. If malicious, this behavior can lead to unauthorized code execution, potentially compromising sensitive data or gaining foothold in the network. Importantly, this detection does NOT confirm criminal activity on its own, as legitimate macro usage can also trigger the rule.

  ---

  ### Investigation Steps

  - **Check for whitelisted macros:** Review the logs for legitimate Office documents that users have worked on recently (Event ID 4608). Legitimate macro activity generally follows a known user workflow and documented business needs.

  - **Identify the user context:** Analyze the registry changes made (Event ID 4663) by identifying the user account initiating the modification. Benign alterations will commonly come from known users in expected contexts.

  - **Review recent document activity:** Look for recent Office document accesses (such as Event ID 5145 for file share accesses) to see if there is a pattern of suspicious document usage correlating with the registry changes.

  - **Look for high-confidence suspicious indicators:** Investigate any unauthorized document or application modifications, especially those involving rare CLR assemblies or document types associated with known exploits.

  - **Analyze registry change details:** Review the specific values changed in the trust records (using registry monitoring logs) to identify unusual or unexpected entries, particularly in environments where macro usage is limited or tightly controlled.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on the integrity of systems and the likelihood of exploitation of macros, which are commonly weaponized in targeted phishing attacks. The context of the affected system's role and its exposure to untrusted documents or users further elevates the risk.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations due to legitimate macro use, which is common and expected in many enterprise environments. Effective detection relies on properly configured registry auditing and monitoring of user behavior. Legitimate activities, like installing updates to Office documents and utilizing approved templates, could trigger this alert. A related detection to strengthen coverage would involve monitoring macro execution events (e.g., Office Application logs) that can provide additional context around the use of macros tied to the registry changes.

