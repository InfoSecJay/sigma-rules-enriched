logsource:
  category: registry_event
  product: windows
detection:
  selection:
        # Sysmon gives us HKLM\SYSTEM\CurrentControlSet\.. if ControlSetXX is the selected one
  - TargetObject: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls'
        # key rename
  - NewName: 'HKLM\SYSTEM\CurentControlSet\Control\Session Manager\AppCertDlls'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the addition of a dynamic-link library (DLL) to the AppCertDlls registry key, which can be exploited by attackers to achieve persistence and privilege escalation. The likely attacker objective is to ensure that their malicious DLL is loaded by the operating system as part of process initialization, allowing them to run code in the context of various system processes. This behavior correlates with the MITRE ATT&CK tactics of Persistence (T1546.009) and Privilege Escalation.

  The primary telemetry source is Windows Registry event logs related to changes in the specified registry key. Detection of this behavior is critical as it may indicate an attempt to maintain long-term access to the system or escalate privileges. However, this detection does NOT confirm malicious activity on its own; legitimate applications may also modify this registry key.

  ### Investigation Steps

  - **Check for recent registry changes:**
    Review Windows Registry Event ID 4663 for evidence of access and modification activities on 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls'. Look for modifications by non-administrative user accounts, which could indicate malicious intent.

  - **Validate the integrity of the added DLL:**
    Inspect the filesystem for the DLL added under this key. Use Event ID 4663 or Sysmon Event ID 11 to locate the file creation time, size, and hash. Compare against known-good hashes to identify potentially malicious DLLs.

  - **Review program behavior associated with the DLL:**
    Investigate processes that are calling the added DLL using Sysmon Event ID 1 (Process Creation). Malicious activity may arise from unexpected processes, particularly those that are typically not associated with system operations.

  - **Identify normal application behavior:**
    Determine if legitimate applications on the system typically modify the AppCertDlls key. Binaries like security software or certain administrative tools may be expected to interact with this key without raising suspicion.

  - **Search for additional suspicious artifacts:**
    Use Windows Event ID 7036 to look for service creations that coincide with the registry change. Malicious actors may set up services as part of their exploitation and persistence strategies.

  - **Check for evasion techniques:**
    Review the system for any known indicators of DLL hijacking or benign services that invoke DLLs in an unusual way. Monitor for unusual paths or unexpected software signatures to highlight possible evasion tactics.

  ### Prioritization

  This alert should be regarded with medium severity due to its potential impact on system integrity and security, particularly in enterprise environments where sensitive data and operations reside. The likelihood of abuse for privilege escalation through this method is a known technique among advanced threat actors, making it a relevant concern.

  ### Blind Spots and Assumptions

  This detection may miss modifications made by legitimate administrative tools or trusted applications that also interact with the AppCertDlls key. Additionally, it relies on the availability of complete and accurate Windows Registry event logging; without proper logging policies, overlooked changes may evade detection. Related detections, such as monitoring for unusual process creation (Sysmon Event ID 1), could strengthen overall coverage against malicious behavior associated with the abuse of this registry key.

