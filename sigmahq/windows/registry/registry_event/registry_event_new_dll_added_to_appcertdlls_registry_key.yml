logsource:
  category: registry_event
  product: windows
detection:
  selection:
        # Sysmon gives us HKLM\SYSTEM\CurrentControlSet\.. if ControlSetXX is the selected one
  - TargetObject: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls'
        # key rename
  - NewName: 'HKLM\SYSTEM\CurentControlSet\Control\Session Manager\AppCertDlls'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the addition of new Dynamic Link Libraries (DLLs) to the AppCertDlls registry key in Windows systems. Attackers may manipulate this registry key to achieve persistence and privilege escalation by ensuring that malicious DLLs are loaded when certain processes are executed. This tactic can be utilized in various attack scenarios to maintain access to compromised systems and execute arbitrary code with escalated privileges.

  The MITRE ATT&CK framework identifies this behavior under the tactics of **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically the technique **Registry Run Keys / Startup Folder** (T1546.009). In this context, an attacker may aim to maintain a foothold within the environment by ensuring that their malicious code runs unnoticed alongside legitimate software.

  Primary data sources for this detection will be registry event logs. Specifically, logs capturing changes to the `HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls` key can provide insight into unauthorized modifications that might indicate malicious activity.

  ### Investigation Steps
  - **Review Registry Logs**: Examine registry event logs for changes to `HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls`, including details on new DLL entries and timestamps of modifications.
  - **Analyze Process Creation Events**: Investigate process creation events around the time of registry modifications to identify any associated processes loading the newly added DLLs.
  - **Correlate with File Integrity Monitoring**: Look for files associated with the newly added DLLs to ensure they are legitimate. Determine their file paths, signatures, and any related processes to evaluate the risk level.
  - **Assess System Behavior**: Monitor the affected systems for unusual behavior, such as unexpected network connections or abnormal system performance, which may indicate the execution of malicious code linked to the added DLL.

  ### Prioritization
  This alert has a medium severity rating due to the potential for significant impact from privilege escalation and persistence that can lead to further compromise within the enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where attackers utilize obfuscation techniques or use legitimate DLLs strategically to avoid detection. It assumes all relevant logs are captured by the SIEM or monitoring tools and that the registry hive being monitored (CurrentControlSet) is the one actively in use. Additionally, if registry logging is not correctly configured, this alert may fail to function effectively.

