note: |
  ### Technical Context
  This detection rule identifies the creation of a local hidden user account via Windows Registry manipulation, specifically focusing on registry events tied to the Security Account Manager (SAM). Attackers may leverage hidden user accounts to maintain persistence within a system while evading detection, enabling unauthorized access or control. The ability to create a hidden account typically signifies a malicious intent to establish a foothold and evade defensive measures, aligning with common tactics used by advanced adversaries.

  Relevant MITRE ATT&CK tactics for this detection include **Persistence** (TA0003) and the technique **Account Manipulation - T1136.001**, which pertains to modifying user accounts to create hidden or unauthorized access. The telemetry that supports this detection primarily comes from Windows Registry events logged by Sysmon, which provides detailed insights into changes in critical system settings and configurations.

  ### Investigation Steps
  - **Review Sysmon Registry Logs:** Check the Sysmon registry event logs for indications of changes within the `\SAM\SAM\Domains\Account\Users\Names\` path. Look for entries reflecting user accounts created with a name ending in `$(Default)`.

  - **Correlate with Process Activity:** Investigate process creation logs for `lsass.exe` around the same timestamp as the registry changes. Verify if any suspicious or unexpected parent processes exist that could indicate malicious behavior.

  - **Assess User Account Activity:** Examine local user account policies and logon events to detect any abnormal patterns or unauthorized access attempts associated with the newly created account.

  - **Check Event Logs for Anomalous Behavior:** Review Windows Event Logs for signs of account manipulation actions, such as failed logon attempts or unusual privilege escalations that correlate with the timing of the registry modifications.

  ### Prioritization
  The high severity of this alert reflects the potential risk posed by the creation of hidden user accounts in an enterprise environment, as such accounts can facilitate persistent access for attackers, significantly undermining security posture.

  ### Blind Spots and Assumptions
  One potential blind spot is the reliance on Sysmon being properly deployed and configured across all systems, as it may not be present in all environments. Additionally, the detection logic assumes that any registry changes in the specified path are inherently suspicious, which may not account for legitimate administrative activities. Finally, logs from devices must be adequately retained and accessible for analysis; without them, detection and response efforts will be significantly hampered.

