note: |
  ### Technical Context

  This Sigma rule detects the creation of a local hidden user account via modifications in the Windows registry, specifically targeting the `\SAM\SAM\Domains\Account\Users\Names\` path. Attackers often use this technique to establish a persistence mechanism while blending in with legitimate accounts, making them difficult to detect. This behavior correlates with the MITRE ATT&CK tactic of *Persistence* and specifically with the technique *Hidden User Accounts* (T1136.001).

  The primary telemetry source for this detection is the Sysmon registry event logs, capturing relevant operations related to the `lsass.exe` process interacting with the security account manager (SAM) database. If malicious, this activity could significantly compromise the integrity of the system by allowing unauthorized access to resources. Importantly, this detection does not confirm malicious intent on its own, as benign applications could potentially trigger similar registry changes.

  ### Investigation Steps

  - **Check Sysmon Registry Event**: Review Sysmon Event ID 13 for registry modifications that match the creation of hidden user accounts at `\SAM\SAM\Domains\Account\Users\Names\`. Evaluate the `Image` field for `lsass.exe` to identify the context of the modification.

  - **Identify User Modifications**: Utilize Windows Event Log Security Event ID 4720 to review all user account creations. Cross-reference timings to ascertain whether legitimate accounts are created during expected maintenance windows by administrators.

  - **Analyze Event Metadata**: Examine the `User` and `TargetObject` fields in the registry event log for changes made by unauthorized accounts or systems. Flag entries where the username ends with a `$` and was created by a non-admin context.

  - **Assess System Logs for Unauthorized Access**: Review Security Event IDs 4624 (logon) and 4625 (failed logon attempts) for new accounts with suspicious access patterns. Investigate any logon events tied to newly created users that occur shortly after the registry event.

  - **Review Group Policy Changes**: Check Group Policy Object (GPO) logs to ensure that appropriate permissions and user rights have not been altered, potentially allowing unauthorized account access.

  - **Monitor for Exfiltration Artifacts**: Identify any unusual process activity (Sysmon Event ID 1) involving outbound connections or file creation corresponding to new user accounts, indicating potential data exfiltration attempts.

  ### Prioritization

  This alert is of high severity due to the critical nature of the affected system, typically indicative of unauthorized persistence mechanisms or privilege escalation tactics. The likelihood of malicious abuse is high because creating hidden accounts is a common tactic adopted by attackers to maintain access to compromised systems, making this detection a crucial focus area in threat monitoring.

  ### Blind Spots and Assumptions

  Detection may be limited by obscured registry changes made by well-crafted malware that operates with high privileges. Additionally, any misconfigured logging settings may obstruct the capture of relevant Sysmon events, impacting detection reliability. It’s important to recognize legitimate administrative tasks that could create similar alerts, such as legitimate system maintenance operations. A related detection is monitoring for unusual `cmd.exe` or `powershell.exe` usage that also signals potential scripts designed to facilitate unauthorized account creation.

