note: |
  ### Technical Context

  This Sigma rule detects the modification of a Windows registry key associated with the "Office test" functionality, enabling a user to specify a custom Dynamic Link Library (DLL) that executes whenever an Office application is launched. The likely objective of an attacker using this method is to establish persistence by manipulating trusted Office applications to load malicious code, potentially allowing them to execute arbitrary commands or exfiltrate data without user consent.

  This behavior is relevant to the MITRE ATT&CK framework, specifically under the Tactic: "Persistence" and the Technique: "Application Layer Protocol" (ID: T1137.002). Primary telemetry sources include Windows Registry event logs, particularly the detection of changes to keys under `HKEY_CURRENT_USER\Software\Microsoft\Office test\Special\Perf`. If malicious, this behavior can facilitate unauthorized actions, leading to data compromise or system integrity breaches. However, this detection does NOT confirm that an actual malicious DLL is present; it only indicates that the registry modification has occurred.

  ### Investigation Steps

  - **Check the Registry Key Modification:** Review Windows Registry logs (Event ID 4657) for changes to the key `HKEY_CURRENT_USER\Software\Microsoft\Office test\Special\Perf`. If the key exists, identify when and by whom it was modified. A recent modification by an unexpected user or service account may indicate malicious intent.

  - **Validate Current DLL Entries:** Investigate the data values of the modified registry key for any suspicious DLL paths. Look for unusual file names or paths that do not align with known Office components. Valid entries should point to trusted Office directories (e.g., `C:\Program Files\Microsoft Office`).

  - **Correlate with Office Application Launch Events:** Analyze process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for instances of Office applications starting immediately after the registry modification. Legitimate activity usually involves known user accounts launching Office apps without registered modifications to this key.

  - **Review User Account Activity:** Examine user activity logs for accounts that modified the registry key. Check for any abnormal behavior such as unusual login times, access to sensitive files, or multiple failed login attempts.

  - **Check for Known Indicators of Compromise (IOCs):** Cross-reference any identified DLL paths with threat intelligence databases or malware repositories to determine if they are recognized malware. Known malicious DLLs will often have signatures in antivirus or EDR solutions.

  ### Prioritization

  This alert is of medium severity. The affected system may be critical in an enterprise environment if it hosts sensitive user data or business applications. The likelihood of malicious exploitation is moderate, especially given that such techniques are known to be weaponized in documented attacks, such as ones employed by the Sofacy group.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for user rights movements in the registry; if logs are not exhaustive or if Windows Event Forwarding is not configured properly, critical events may be missed. Legitimate applications or user customization may cause registry modifications that trigger this alert. Companion detections such as monitoring suspicious DLL loading events via Sysmon (Event ID 10) can provide additional context and strengthen overall detection.

