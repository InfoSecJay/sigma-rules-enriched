  ### Technical Context
  This rule detects the addition of a specific registry key related to Microsoft Office applications, allowing an attacker to specify a custom Dynamic Link Library (DLL) that will execute each time an Office application starts. This technique is commonly associated with persistence mechanisms leveraged by various threat actors, including the Sofacy group, aiming to maintain control over compromised systems by running malicious payloads within legitimate applications.

  The main objective of such an attack is to create a backdoor for ongoing access and to ensure that the malicious payload is executed whenever users interact with Office applications, making it more likely to go unnoticed. Relevant MITRE ATT&CK tactics include *Persistence* and *Execution*, with the specific technique being *Office Application Startup* (T1137.002).

  The primary data source for this alert is the Windows registry event logs, which track changes to registry keys and values that can indicate attempts to establish persistence through known malicious configurations.

  ### Investigation Steps
  - **Review Registry Event Logs**: Collect and analyze registry event logs for entries that correspond to the specified target object, specifically looking for unauthorized changes to the `HKEY_CURRENT_USER\Software\Microsoft\Office test\Special\Perf` path.
  - **Identify Recent Process Execution**: Monitor process creation events to check for any Office applications that have recently launched and potentially executed a DLL, particularly those with unusual command lines or parameters.
  - **Analyze System Behavior**: Investigate any suspicious behavior associated with Office applications, such as unexpected network activity or file modifications that may suggest the execution of malicious payloads.
  - **Conduct User Activity Checks**: Review user accounts with administrative privileges to identify if any accounts are used to make unauthorized registry changes or if any users display patterns of suspicious behavior (e.g., accessing unusual documents).

  ### Prioritization
  The severity of this alert is considered medium due to the potential for escalation; while the direct impact may not immediately be evident, the persistence mechanism indicates that an attacker can maintain long-term access, leading to further exploitation.

  ### Blind Spots and Assumptions
  This detection rule may miss other persistence methods not specifically related to the Office test registry key changes, and it assumes that the logs are thoroughly monitored for registry events. Additionally, alert functionality is dependent on appropriate logging configurations being in place; any lack of logging or misconfiguration in the Windows registry can prevent detection of malicious activities.

