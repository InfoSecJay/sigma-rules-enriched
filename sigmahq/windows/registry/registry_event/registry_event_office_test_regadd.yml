  ### Technical Context

  This Sigma rule detects the addition of a registry entry within the path `\Software\Microsoft\Office test\Special\Perf`, which allows an attacker to specify a dynamic-link library (DLL) executed every time an Office application is launched. The likely attacker objective is achieving persistence on the system, enabling potentially malicious code to run under the guise of legitimate Office application processes. This behavior aligns with the MITRE ATT&CK technique of "Registry Run Keys / Startup Folder" (T1137.002).

  The primary telemetry source for this detection is Windows Registry event logs that monitor registry modifications. The security impact is significant, as it may indicate an unauthorized method of maintaining long-term access to a compromised environment. However, this detection does NOT confirm that malicious activity is occurring; it merely indicates a change that could be utilized for persistence.

  ---

  ### Investigation Steps

  - **Check Registry Changes:** Review Windows Registry Event ID 4657 to identify the specific modification of the registry key at `\Software\Microsoft\Office test\Special\Perf`, noting the creating user or process for context. Look for entries created by unknown accounts.

  - **Correlate with Process Execution:** Examine Security Event ID 4688 for process creation events corresponding to Office applications (e.g., WINWORD.EXE, EXCEL.EXE) occurring shortly after the registry change. Malicious indicators may include unusual spawning of Office processes by non-standard users or automated tasks.

  - **Identify Legitimate Usage:** Verify if the user associated with the registry change is an administrator or has legitimate reasons to modify Office application settings. Typical administrative tasks may include software updates or configurations.

  - **Analyze for Evasion Techniques:** Consider any recent changes to endpoint detection configurations that may allow attackers to bypass monitoring tools, such as disabling logging or using tools to modify registry settings stealthily.

  - **Examine DLL Artifacts:** Investigate the filesystem for newly created DLL files that correspond with the registry entry by searching for recently modified files in the common Office directory paths (e.g., `C:\Program Files\Microsoft Office\`).

  - **Review Network Activity:** Check for unusual outbound connections from Office applications correlated with the timing of the registry change. This may involve analyzing proxy logs or endpoint DNS queries for suspicious activity, which could indicate that a malicious DLL is attempting to communicate with an external command and control (C2) server.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential persistence mechanism indicated by the registry change, which could lead to extended malicious presence on critical systems, such as user workstations. While it represents a legitimate attack vector, it is not yet confirmed malicious until further corroborating evidence of exploitation is observed.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via stealthy modification of registry settings or masking DLL files. Required log sources for reliable detection include Registry Event logs and Security Event logs for process creation, ensuring they are properly configured and enabled. Legitimate software installations or configurations might trigger this alert if they modify registry keys in unexpected ways. A companion detection such as monitoring for unusual modifications to trusted executable files (e.g., via Sysmon Event ID 1) can strengthen coverage against such persistence techniques.

