title: Suspicious Camera and Microphone Access
id: 62120148-6b7a-42be-8b91-271c04e281a3
status: test
description: Detects Processes accessing the camera and microphone from suspicious
  folder
references:
- https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
author: Den Iuzvyk
date: 2020-06-07
modified: 2022-10-09
tags:
- attack.collection
- attack.t1125
- attack.t1123
logsource:
  category: registry_event
  product: windows
detection:
  selection_1:
    TargetObject|contains|all:
    - '\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\'
    - '\NonPackaged'
  selection_2:
    TargetObject|contains:
    - microphone
    - webcam
  selection_3:
    TargetObject|contains:
    - ':#Windows#Temp#'
    - ':#$Recycle.bin#'
    - ':#Temp#'
    - ':#Users#Public#'
    - ':#Users#Default#'
    - ':#Users#Desktop#'
  condition: all of selection_*
falsepositives:
- Unlikely, there could be conferencing software running from a Temp folder accessing
  the devices
level: high
note: |
  ### Technical Context
  This detection rule identifies processes that access the camera and microphone, specifically when these actions occur from suspicious directories such as temporary folders or recycling bins. Attackers may exploit these features to conduct unauthorized surveillance or gather sensitive information, heightening the risk of privacy invasion and data breaches. The typical threat scenario involves malicious actors leveraging malware or compromised applications that utilize these functionalities to monitor users without their consent.

  Relevant MITRE ATT&CK techniques include:
  - **T1125: Video Capture**: This technique entails capturing video feed from cameras on the target devices.
  - **T1123: Audio Capture**: This technique encompasses the unauthorized use of microphones to intercept audio.

  Primary data sources for this detection include:
  - Registry event logs on Windows that capture changes or access patterns to capability access management settings.

  ### Investigation Steps
  - **Review Registry Logs**: Analyze registry event logs for access to `\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\` to determine which processes accessed the camera and microphone settings.
  - **Inspect Process Creation Events**: Look for any process creation logs around the times of suspicious accesses, particularly focusing on processes originating from unusual folder paths, such as Temp or Recycle Bin.
  - **Examine Network Activity**: Investigate outbound network traffic from the identified processes to check for potential data exfiltration attempts, indicating surveillance activity.
  - **Check Installed Applications**: Validate the legitimacy of applications and processes accessing audio and video features; ensure they are known, trusted applications and not rogue software.

  ### Prioritization
  The alert is classified as high severity due to the potential for significant privacy violations and data exposure, especially in sensitive environments where unauthorized access to audio and video feeds can lead to critical consequences for individuals and the organization.

  ### Blind Spots and Assumptions
  The detection may miss legitimate accesses from conferencing software or remote meeting applications that temporarily access the camera and microphone from standard directories. Assumptions include the reliance on registry events being properly logged and monitored. The successful functioning of this alert hinges on comprehensive registry logging configurations across all endpoints in the enterprise.

