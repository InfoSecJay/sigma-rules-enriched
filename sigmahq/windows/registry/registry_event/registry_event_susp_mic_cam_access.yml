title: Suspicious Camera and Microphone Access
id: 62120148-6b7a-42be-8b91-271c04e281a3
status: test
description: Detects Processes accessing the camera and microphone from 
  suspicious folder
references:
- https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
author: Den Iuzvyk
date: 2020-06-07
modified: 2022-10-09
tags:
- attack.collection
- attack.t1125
- attack.t1123
logsource:
  category: registry_event
  product: windows
detection:
  selection_1:
    TargetObject|contains|all:
    - '\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\'
    - '\NonPackaged'
  selection_2:
    TargetObject|contains:
    - microphone
    - webcam
  selection_3:
    TargetObject|contains:
    - ':#Windows#Temp#'
    - ':#$Recycle.bin#'
    - ':#Temp#'
    - ':#Users#Public#'
    - ':#Users#Default#'
    - ':#Users#Desktop#'
  condition: all of selection_*
falsepositives:
- Unlikely, there could be conferencing software running from a Temp folder 
  accessing the devices
level: high
note: |
  ### Technical Context

  This rule detects attempts to access camera and microphone resources from suspicious folders, which may indicate unauthorized surveillance or data collection. Attackers often seek to exploit these capabilities for espionage or credential theft, thereby compromising user privacy and security. This behavior is associated with the MITRE ATT&CK tactics of Collection (T1125) and Audio Capture (T1123).

  The primary telemetry sources are Windows Registry events capturing access to the Capability Access Manager, particularly the paths indicating access to microphone and camera settings. If malicious, these actions can lead to unauthorized monitoring of users. However, this detection alone does not confirm malicious intent, as legitimate applications (e.g., video conferencing tools) may also access these resources from similar directories.

  ### Investigation Steps

  - **Identify suspicious process activity:** Check for processes accessing Registry paths `\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\` (Event ID 4656 with Access Mask) that reference `microphone` or `webcam`. Investigate any process not recognized as a legitimate application.

  - **Review related application usage:** Confirm whether legitimate software (like conferencing tools) is running from Temp directories such as `C:\Users\<username>\AppData\Local\Temp\`. If so, document the application and allowlisting is appropriate.

  - **Analyze file creation in these directories:** Inspect for unusual file creation (Event ID 4663) within Temp or Recycle Bin paths. Confirm whether files being created or modified align with known application behavior or raise alerts for further investigation.

  - **Gather user context and complaint:** Look into user activity logs (e.g., Windows Event ID 4624) to determine if the accessed devices correlate with user behavior. Validate if users reported any strange behavior indicative of unauthorized monitoring.

  - **Investigate network connections initiated by suspect processes:** Check for outbound network traffic from suspect processes accessing the webcam or microphone (via Sysmon Event ID 3). Malicious attempts may manifest as unusual communication patterns.

  ### Prioritization

  This alert has a high severity level due to its potential for high privacy impact if exploited for malicious surveillance. The likelihood of attackers abusing microphone or webcam access is significant, especially in environments that contain sensitive information, making comprehensive monitoring imperative.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions or if legitimate applications are misconfigured to run from suspicious directories. Required logging includes comprehensive Registry audit logs for accurate monitoring. Legitimate conferencing applications may trigger similar alerts if set up in a non-standard manner. A related detection that strengthens coverage is monitoring for abnormal process behaviors, such as persistence mechanisms established via scheduled tasks or startup entries from similar locations.

