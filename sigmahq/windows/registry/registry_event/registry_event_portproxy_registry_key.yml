logsource:
  category: registry_event
  product: windows
detection:
  selection:
        # Example: HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\0.0.0.0/1337
    TargetObject|contains: '\Services\PortProxy\v4tov4\tcp\'
  condition: selection
falsepositives:
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. 
  https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
- Synergy Software KVM (https://symless.com/synergy)
level: medium
note: |
  ### Technical Context

  This rule detects the addition of new entries to the PortProxy registry key, which is commonly used to facilitate port forwarding on Windows systems. Attackers may exploit this vulnerability to create covert communication channels for lateral movement and command-and-control operations, aiming to bypass network restrictions or evade detection. Relevant MITRE ATT&CK tactics include **Lateral Movement (TA0008)** and **Command and Control (TA0011)**, specifically under **T1090: Connection Proxy**.

  Primary telemetry sources include Windows Registry Event logs, highlighting modifications to the `HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\` key. If malicious, this could enable unauthorized remote access or data exfiltration. Importantly, this detection does not confirm active exploitation or compromise; legitimate applications could trigger similar registry modifications.

  ### Investigation Steps

  - **Review PortProxy registry location:** Check registry path `HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\` for new entries. Legitimate activity may show expected entries related to approved applications or services rather than unusual ports and addresses.

  - **Verify event logs for registry modifications:** Analyze Security Event ID 4663 for registry key modifications linked to PortProxy. Focus on timestamps correlating with the alert and user accounts responsible.

  - **Identify unusual ports in registry entries:** Search for unexpected or common attack ports (e.g., TCP 4444 or 8080) within registry values. Legitimate entries often align with known services, while atypical ports may indicate malicious intent.

  - **Cross-reference with Network Traffic:** Utilize Sysmon Event ID 3 (Network Connection) to correlate with identified PortProxy settings, checking for suspicious outbound connections on unusual ports that match discovered registry entries.

  - **Check user account context:** Investigate the user account associated with the registry modification. Entries created by non-admin users or during anomalous hours may indicate potential exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact on network integrity and its likelihood for malicious use, especially in enabling lateral movement and evasion techniques. While modifying PortProxy settings can be part of legitimate configurations, the comparatively infrequent benign activity raises concern.

  ### Blind Spots and Assumptions

  Common evasion techniques include attackers altering or removing their footprints post-exploitation, potentially leaving behind no detectable changes. Reliable detection requires focused monitoring of registry changes and ensuring full event log collection for modifications. Legitimate use cases include port forwarding set up for specific applications, such as development environments. Companion detections related to lateral movement or unusual outbound connections could strengthen coverage and context for investigations.

