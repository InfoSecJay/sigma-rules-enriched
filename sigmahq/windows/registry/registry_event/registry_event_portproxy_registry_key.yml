title: New PortProxy Registry Entry Added
id: a54f842a-3713-4b45-8c84-5f136fdebd3c
status: test
description: Detects the modification of the PortProxy registry key which is used
  for port forwarding.
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
- https://adepts.of0x.cc/netsh-portproxy-code/
- https://www.dfirnotes.net/portproxy_detection/
author: Andreas Hunkeler (@Karneades)
date: 2021-06-22
modified: 2024-03-25
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: registry_event
  product: windows
detection:
  selection:
        # Example: HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\0.0.0.0/1337
    TargetObject|contains: '\Services\PortProxy\v4tov4\tcp\'
  condition: selection
falsepositives:
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
- Synergy Software KVM (https://symless.com/synergy)
level: medium
note: |
  ### Technical Context
  This detection rule monitors for modifications made to the PortProxy registry settings in Windows, specifically targeting the key responsible for port forwarding. The establishment of PortProxy entries enables attackers to bypass network restrictions, facilitating remote command execution or access to internal resources. By creating or manipulating these registry settings, adversaries can stealthily redirect traffic through compromised systems, enhancing their tactical advantage during lateral movement or command-and-control operations.

  The likely attacker objectives are to create covert paths for network traffic, thereby evading detection from security monitoring systems. This behavior aligns with several MITRE ATT&CK techniques, particularly **T1090: Network Sniffing**, which encapsulates methods of operating through backdoors or misconfigured services to access restricted information. Additional relevant tactics include **Lateral Movement** and **Command and Control**, associated with maneuvering within a network after gaining initial foothold access.

  Primary data sources that contain evidence for this detection rule include **Windows registry event logs**, specifically those pertaining to registry key modifications, which reveal changes to the PortProxy settings that could indicate unauthorized or suspicious activity.

  ### Investigation Steps
  - **Review Registry Logs**: Examine Windows registry event logs for any recent modifications to the `HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\<IP Address>/<Port>` entries. Look for any unusual patterns, such as multiple updates from unknown or unauthorized accounts.
  - **Correlate with Process Events**: Cross-reference the detected registry modifications with process creation logs. Identify any processes that initiated around the same time which may have modified the registry settings, focusing on PowerShell or other scripting languages that might have been used maliciously.
  - **Analyze Network Traffic**: Inspect network traffic for any unusual patterns or connections that align with the newly established PortProxy settings. Special attention should be given to unexpected external connections or tunneling behavior indicative of command-and-control activity.
  - **Investigate User Activity**: Review the user account activity surrounding the time of the registry modification. Look for any accounts that exhibited unusual login behavior, especially those accessing from non-standard locations or during odd hours.

  ### Prioritization
  This alert holds medium severity due to its potential implications for lateral movement and command-and-control operations in an enterprise environment. Modifications in registry settings related to network services can signify an unauthorized enablement of data exfiltration or intrusion efforts, which should be promptly investigated.

  ### Blind Spots and Assumptions
  There may be blind spots in detection if certain logs, such as registry event logs, are not enabled or adequately configured to capture modifications. Additionally, the alert assumes that any legitimate system changes will be well-documented and justifiable; however, this may not always be the case. False positives can arise from benign use cases such as those associated with WSL2 network bridges or software like Synergy, which rely on PortProxy functionality. Therefore, comprehensive logging and contextual understanding of valid administrative changes are essential for accurate detection.

