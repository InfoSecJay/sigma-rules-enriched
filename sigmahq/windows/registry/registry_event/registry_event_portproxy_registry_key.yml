logsource:
  category: registry_event
  product: windows
detection:
  selection:
        # Example: HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\0.0.0.0/1337
    TargetObject|contains: '\Services\PortProxy\v4tov4\tcp\'
  condition: selection
falsepositives:
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. 
  https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
- Synergy Software KVM (https://symless.com/synergy)
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the PortProxy registry key, specifically the configuration for port forwarding in Windows environments. Attackers may use this technique to tunnel traffic through the compromised host, facilitating lateral movement or command and control (C2) communications. The relevant MITRE ATT&CK techniques represented by this behavior include "Lateral Movement: Remote Services" (T1021) and "Command and Control: Application Layer Protocol" (T1071). Primary telemetry sources include Windows Registry events, specifically monitoring changes to the `HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\` path.

  If successful, the security impact is significant, as it enables an adversary to redirect traffic potentially leading to exfiltration or exploitation of internal resources. It is important to note that this detection alone does not confirm malicious intent; legitimate applications and services that alter the PortProxy settings may exist.

  ### Investigation Steps

  - **Check registry modifications: ** Review the Windows Security Event ID 4657 to identify the exact time and user account modifying the registry key under `HKLM\System\CurrentControlSet\Services\PortProxy\v4tov4\tcp\`. Consider legitimate scenarios like Docker or Kubernetes deployments that may trigger changes.

  - **Identify user context: ** Analyze the `SubjectUserSid` and `SubjectUserName` fields in the event logs to determine if the modification was executed by a known administrative account or a compromised user account.

  - **Correlate with network activities: ** Inspect network traffic captured by firewall logs or SIEM for unusual outbound connections that correspond to the newly created port forwarding rules. Look for connections to external IP addresses on non-standard ports.

  - **Confirm malicious indicators: ** Look for Sysmon Event ID 1 (Process Creation) that indicates suspicious child processes spawned under common PowerShell scripts or other means that manipulate the `netsh portproxy` command.

  - **Identify false positive triggers: ** Validate against any known legitimate applications that may have modified the PortProxy settings, such as WSL2 or third-party KVM software, and document these exceptions.

  - **Investigate system role: ** Determine the criticality of the affected host by identifying asset roles (e.g., server vs. endpoint) and whether its exposure to outside networks poses a higher risk if compromised.

  ### Prioritization

  This alert carries medium severity due to the potential for enabling lateral movement and C2 operations within the network. The impact of the affected systems being used for port forwarding can facilitate unauthorized access to sensitive areas of the environment. Furthermore, this technique is commonly weaponized by adversaries targeting internal networks.

  ### Blind Spots and Assumptions

  This detection may be evaded through direct modifications to the registry that bypass logging mechanisms, or by using malware designed to operate in memory without interacting with the registry. Ensure that Windows Registry auditing is enabled for reliable detection. Legitimate activities that may trigger this alert include configurations settings altered by container orchestration tools. A companion detection to strengthen coverage could involve monitoring for unusual network traffic patterns indicating potential use of the established port forwards.

