  ### Technical Context

  This rule detects attempts to manipulate the Windows 10 Narrator application by deleting specific registry values related to its shell execution commands. These modifications are typically used by attackers to establish persistence on a compromised system, allowing for unauthorized access or control. The likely attacker objective in this case is to leverage the Narrator as a means of ensuring continuity of a malware’s execution, as part of a more extensive privilege escalation strategy.

  The relevant MITRE ATT&CK techniques include Persistence via "Registry Run Keys/Startup Folder" (T1547.001) and Privilege Escalation. The primary telemetry sources for this detection are Windows registry event logs, specifically pertaining to Event Type deletions. If malicious, this behavior can lead to persistent access on a system with potentially escalated privileges. However, this detection alone does not confirm that compromise has occurred or that persistence is actively being exploited.

  ### Investigation Steps

  - **Check registry modifications**: Review Windows Registry logs for Event Type `DeleteValue` related to paths ending with `\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\DelegateExecute` and `\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\(Default)`. Benign changes usually involve updates during system use, not deletions.

  - **Audit recent software installations**: Investigate any installations of software, specifically applications potentially linked to the AppX package with the identified suffix. Legitimate applications should not manipulate registry entries for Windows Narrator in this manner.

  - **Correlate with user activity logs**: Review user activity logs (Event ID 4624, Logon events) to understand the context of the account making these modifications. Legitimate activity typically shows user actions that align with known software usage patterns, rather than registry manipulation.

  - **Identify anomalous user behavior**: Search for any unusual log entries or spikes in system changes. Look for Event IDs such as 4672 and 4688 to track any account that has been given special access or is creating processes that are not typical for that user.

  - **Examine execution context**: Validate if any associated processes are running or being invoked by the modified commands in the registry, especially looking for suspicious command-line arguments. This step checks for high-confidence malicious indicators if there is a process executing associated with these registry changes.

  ### Prioritization

  This alert is high priority due to the identification of potential registry manipulation that could indicate an attempt to create persistence mechanisms. If malicious, it poses a significant risk due to its ability to enable continued access to a potentially compromised system, which is a tactic frequently employed by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited due to the potential for legitimate application updates or user-side configurations that could prompt similar registry changes. Monitoring should ensure that the necessary Windows Event logs are being captured effectively. Furthermore, benign applications might also trigger similar modifications, especially during installation updates, which necessitates reviewing change context carefully. Related detections, such as those for unusual process creations (Sysmon Event ID 1), could complement this alert by confirming bad behavior around the same timeframe.

