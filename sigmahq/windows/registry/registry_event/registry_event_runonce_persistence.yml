title: Run Once Task Configuration in Registry
id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
status: test
description: Rule to detect the configuration of Run Once registry key. 
  Configured payload can be run by runonce.exe /AlternateShellStartup
references:
- https://twitter.com/pabraeken/status/990717080805789697
- https://lolbas-project.github.io/lolbas/Binaries/Runonce/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-11-15
modified: 2024-03-25
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains: '\Microsoft\Active Setup\Installed Components'
    TargetObject|endswith: '\StubPath'
  filter_optional_chrome:
    Details|contains|all:
    - 'C:\Program Files\Google\Chrome\Application\'
    - '\Installer\chrmstp.exe" --configure-user-settings --verbose-logging --system-level'         # In some cases the Details will contain an additional flag called "--channel=stable" at the end
  filter_optional_edge:
    Details|contains:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\'
    - 'C:\Program Files\Microsoft\Edge\Application\'
    Details|endswith: '\Installer\setup.exe" --configure-user-settings --verbose-logging
      --system-level --msedge --channel=stable'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate modification of the registry key by legitimate program
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the configuration of the Run Once registry key typically used for executing scripts or applications during user logon. The likely attacker objective is to maintain persistence on a compromised system by leveraging trusted executables (e.g., runonce.exe) to execute malicious payloads. This activity aligns with the MITRE ATT&CK persistence tactic, specifically technique T1112 (Run Keys / Startup Folder).

  Primary telemetry sources include Windows Registry event logs that capture modifications to registry keys, specifically under the path '\Microsoft\Active Setup\Installed Components'. If malicious, this indicates an unauthorized attempt to execute payloads automatically during startup. Importantly, this detection does not confirm critical analysis without additional context, such as identifying the payload being executed or the source of the modification.

  ### Investigation Steps

  - **Review registry modifications:** Examine Windows Registry logs for Event ID 4657 that indicate changes to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Active Setup\Installed Components\` key, focusing on `StubPath` values.
  - **Verify command line arguments:** Investigate the `Details` field for typical command lines such as `runonce.exe /AlternateShellStartup`. Be cautious of values containing paths to malicious executables or unusual parameters that deviate from standard operations.
  - **Identify expected legitimate behavior:** Document modifications to the Run Once key during Windows installation or updates (e.g., legitimate entries like `C:\Program Files (x86)\Microsoft\Edge\Application\Installer\setup.exe`). Compare current entries to baseline for anomalies.
  - **Check user escalation:** Confirm if the user making the registry modification had appropriate permissions and valid context (e.g., system accounts or authorized administrators). Look for Event ID 4670 indicating changes made by a user with high privileges.
  - **Search for high-confidence malicious indicators:** Look for known malicious file paths in the `StubPath`. Use threat intelligence sources to validate whether executed commands align with known malicious behavior.
  - **Assess potential persistence:** Review execution artifacts or logs indicating if additional tasks or scheduled jobs were created to complement the Run Once registry modifications—for instance, looking at Task Scheduler logs (Event IDs 106, 200).

  ### Prioritization

  The severity of this alert is medium due to its potential impact on user sessions and system integrity, especially if the affected systems are critical. The likelihood of malicious abuse is moderate, as attackers often leverage persistence mechanisms to regain access. This technique is commonly found in real-world exploits, making it a noteworthy indicator.

  ### Blind Spots and Assumptions

  This rule may miss sophisticated stealth techniques such as delayed execution or using alternative persistence mechanisms if the logs are incomplete. Reliable detection requires active monitoring of relevant registry paths and appropriate logging configurations within the environment. Legitimate activities, such as software installations or updates from trusted vendors, may trigger the alert. A related detection includes monitoring for suspicious use of runonce.exe itself, which could strengthen anomaly detection in user sessions.

