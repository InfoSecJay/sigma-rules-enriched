title: Run Once Task Configuration in Registry
id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
status: test
description: Rule to detect the configuration of Run Once registry key. Configured
  payload can be run by runonce.exe /AlternateShellStartup
references:
- https://twitter.com/pabraeken/status/990717080805789697
- https://lolbas-project.github.io/lolbas/Binaries/Runonce/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-11-15
modified: 2024-03-25
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains: '\Microsoft\Active Setup\Installed Components'
    TargetObject|endswith: '\StubPath'
  filter_optional_chrome:
    Details|contains|all:
    - 'C:\Program Files\Google\Chrome\Application\'
    - '\Installer\chrmstp.exe" --configure-user-settings --verbose-logging --system-level'         # In some cases the Details will contain an additional flag called "--channel=stable" at the end
  filter_optional_edge:
    Details|contains:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\'
    - 'C:\Program Files\Microsoft\Edge\Application\'
    Details|endswith: '\Installer\setup.exe" --configure-user-settings --verbose-logging
      --system-level --msedge --channel=stable'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate modification of the registry key by legitimate program
level: medium
note: |
  ---

  ### Technical Context

  This detection rule identifies modifications to the "Run Once" registry key, commonly used for executing payloads through `runonce.exe`. Attackers often use this technique to ensure persistence, enabling their malicious code to run at the next user login. The relevant MITRE ATT&CK tactic is **Persistence** and technique **T1112** - Modify Registry. The primary telemetry source for this detection comes from Windows registry events, specifically monitoring the **TargetObject** and **Details** fields relevant to registry changes. If this behavior is confirmed malicious, it may allow the adversary continued access or control over the system. However, this detection does NOT confirm malicious intent, as legitimate software may modify the same registry keys for valid purposes.

  ---

  ### Investigation Steps

  - **Check recent registry modifications:** Examine registry logs for Event ID **4663** to identify timestamps and user accounts associated with modifications to the `\Microsoft\Active Setup\Installed Components` path. Compare modifications against known software deployment schedules.

  - **Identify malicious command patterns:** Review registry modification **Details** for signs of suspicious command-line arguments like `--configure-user-settings`, particularly in non-standard installations or legitimate scenarios. Look for deviations from expected paths (e.g., non-default processes).

  - **Validate associated user accounts:** Determine the context of the user making the modifications. Look for user accounts with unusual privileges or those that should not be making changes in Event ID **4672** (Special Privileges Assigned).

  - **Search for related activity:** Investigate if other persistence mechanisms like scheduled tasks or logon scripts are also modified by referencing Event IDs **4697** (Service Installation) and **4688** (Process Creation), linking the registry change to potential malicious activity.

  - **Assess legitimate use cases:** Confirm if legitimate software, particularly installers of Chrome or Edge, are expected to modify these registry paths by reviewing deployment logs or recent updates. Compare the executing hashes against known safe versions.

  ---

  ### Prioritization

  This alert is of medium severity. The impact can range from minimal (standard user impact) to critical if an administrator system is affected. The likelihood of adversaries exploiting this behavior is high, as it is a common persistence method and can serve as a precursor for further malicious activity.

  ---

  ### Blind Spots and Assumptions

  This detection may miss attempts where adversaries use different registry keys or obscure the command-line arguments to bypass scrutiny. Reliable detection relies on proper logging configurations for registry changes and may miss legitimate actions if legitimate software installs are frequent. Monitoring tools like Sysmon can strengthen coverage in detecting related persistence techniques like scheduled tasks or services alterations.

