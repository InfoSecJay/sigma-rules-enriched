title: Run Once Task Configuration in Registry
id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
status: test
description: Rule to detect the configuration of Run Once registry key. 
  Configured payload can be run by runonce.exe /AlternateShellStartup
references:
- https://twitter.com/pabraeken/status/990717080805789697
- https://lolbas-project.github.io/lolbas/Binaries/Runonce/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-11-15
modified: 2024-03-25
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains: '\Microsoft\Active Setup\Installed Components'
    TargetObject|endswith: '\StubPath'
  filter_optional_chrome:
    Details|contains|all:
    - 'C:\Program Files\Google\Chrome\Application\'
    - '\Installer\chrmstp.exe" --configure-user-settings --verbose-logging --system-level'         # In some cases the Details will contain an additional flag called "--channel=stable" at the end
  filter_optional_edge:
    Details|contains:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\'
    - 'C:\Program Files\Microsoft\Edge\Application\'
    Details|endswith: '\Installer\setup.exe" --configure-user-settings --verbose-logging
      --system-level --msedge --channel=stable'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate modification of the registry key by legitimate program
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Run Once registry key related to `\Microsoft\Active Setup\Installed Components`. Such modifications can enable malicious payloads to execute on user login through `runonce.exe /AlternateShellStartup`. The likely attacker objective could be persistence, allowing an adversary to ensure execution of their code whenever the system starts or a user logs in. This behavior maps to the MITRE ATT&CK tactic of Persistence (T1053) and Defense Evasion (T1112). The primary telemetry source is Windows Registry event logs, specifically capturing registry changes (Event ID 4657). If malicious, the impact could be substantial, resulting in successful code execution upon user logon. However, this detection does NOT confirm that the activity is immediately malicious without further context, as legitimate applications may also modify this registry key.

  ### Investigation Steps

  - **Inspect registry modification details**: Check Windows Security Event ID 4657 for the specific modification details reported in the alert, paying close attention to the `TargetObject` and `Details` fields to determine the context of the change.

  - **Verify process parentage**: Review Sysmon Event ID 1 to identify the parent process of `runonce.exe`. Ensure that the parent process is a trusted application; if it originates from an unrecognized or suspicious source, this may indicate malicious intent.

  - **Assess frequency of modification**: Examine the historical data for the specific registry key using Powershell or relevant registry monitoring tools to establish a baseline for expected behavior. Legitimate applications may trigger these modifications periodically (e.g., Chrome updates), but unusual frequency could signal malicious activity.

  - **Cross-reference executable paths**: Analyze `Details` field to check the paths. For example, if it points to `C:\Program Files\Google\Chrome\Application\` or similar, investigate legitimate software versions against known malware leveraging the same paths to ensure validity.

  - **Evaluate environmental context**: Take note of the host role—whether it is a critical server or user workstation. Higher criticality systems warrant deeper investigation and potential isolation if malicious indicators are confirmed.

  ### Prioritization

  This alert should be treated with medium severity. Modifications to the Run Once registry key can indicate persistent malware deployment, particularly on endpoint systems where users log in regularly. While such behaviors are often weaponized, legitimate software can also modify this registry key, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of supporting telemetry; without robust logging configurations, legitimate activity may generate false positives. Assumptions include that not all legitimate programs will generate Registry Event ID 4657, potentially missing benign alterations. Related detections, such as monitoring for the execution behavior of `runonce.exe` (Sysmon Event ID 1), can enhance detection coverage and context.

