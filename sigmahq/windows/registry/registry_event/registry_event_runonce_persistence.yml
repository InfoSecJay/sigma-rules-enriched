title: Run Once Task Configuration in Registry
id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
status: test
description: Rule to detect the configuration of Run Once registry key. Configured
  payload can be run by runonce.exe /AlternateShellStartup
references:
- https://twitter.com/pabraeken/status/990717080805789697
- https://lolbas-project.github.io/lolbas/Binaries/Runonce/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-11-15
modified: 2024-03-25
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains: '\Microsoft\Active Setup\Installed Components'
    TargetObject|endswith: '\StubPath'
  filter_optional_chrome:
    Details|contains|all:
    - 'C:\Program Files\Google\Chrome\Application\'
    - '\Installer\chrmstp.exe" --configure-user-settings --verbose-logging --system-level'         # In some cases the Details will contain an additional flag called "--channel=stable" at the end
  filter_optional_edge:
    Details|contains:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\'
    - 'C:\Program Files\Microsoft\Edge\Application\'
    Details|endswith: '\Installer\setup.exe" --configure-user-settings --verbose-logging
      --system-level --msedge --channel=stable'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate modification of the registry key by legitimate program
level: medium
note: |
  ### Technical Context
  This rule detects modifications to the Windows Registry, specifically targeting the "Run Once" registry key, which can allow an attacker to execute a payload when a user logs in or the system starts. The presence of entries in this key can indicate persistent malware or other auto-executable actions that may align with malicious intent. Likely attacker objectives include stealthy persistence mechanisms, execution of malicious scripts, or exploitation of misconfigurations in legitimate software installations, such as those from Chrome or Edge.

  This detection relates primarily to the MITRE ATT&CK framework's Persistence tactics, particularly technique T1112: `Modify Registry`, and potentially T1203: `Exploitation for Client Execution`. The presence of potentially malicious entries, particularly those connected to program installations that utilize Chrome and Edge, heightens the concern for targeted exploitation or delivery of malware using legitimate tools.

  The most valuable data sources for detecting this behavior include Windows Registry event logs, which can highlight abnormal modifications to the Run Once key, and software inventory logs that track legitimate program installations.

  ### Investigation Steps
  - **Review Registry Event Logs:** Check for modifications to the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce` and `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce` keys. Pay particular attention to the `StubPath` entries for anomalous or unexpected executables.

  - **Analyze Process Creation Events:** Correlate modifications in the registry with process execution logs immediately after the registry changes. Look for instances of `runonce.exe` or other relevant executables that could indicate payload execution.

  - **Validate Software Installations:** Examine the logs of software installations, particularly those from `Google Chrome` and `Microsoft Edge`, for any unusual parameters indicating configurations that might have been altered for persistence.

  - **Correlate with User Activity:** Review the relevant user account activities surrounding the time of the registry changes. Investigate unusual login times or patterns that deviate from normal user behavior which might indicate compromise or misuse.

  ### Prioritization
  The alert carries medium severity due to the moderate impact of potential malware persistence combined with a relatively high likelihood of exploitation through misconfigured or legitimate software processes. Rapid action could be required to assess and mitigate risks, especially if it correlates with known vulnerable applications.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage relating to legitimate application behaviors that also modify the Run Once key for benign purposes, leading to potential false positives. Additionally, the detection assumes that the appropriate logging configurations and permissions are enabled to capture registry event changes effectively. Organizations should ensure that detailed logging of registry modifications is enabled to enable effective detection using this rule.

