title: CMSTP App Paths Registry Key Modification
id: b6d235fc-1d38-4b12-adbe-325f06728f37
status: stable
description: |
  Detects modifications to the CMSTP App Paths registry key. This may indicate abuse of
  Microsoft Connection Manager Profile Installer (CMSTP) for arbitrary code execution or UAC bypass.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Cmstp/
- https://web.archive.org/web/20190720093911/http://www.endurant.io/cmstp/detecting-cmstp-enabled-code-execution-and-uac-bypass-with-sysmon/
- https://web.archive.org/web/20190722224110/https://oddvar.moe/2017/08/15/research-on-cmstp-exe/
author: Nik Seetharaman
date: 2018-07-16
modified: 2026-08-27
tags:
- attack.execution
- attack.stealth
- attack.t1218.003
- attack.g0069
- car.2019-04-001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: 'SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\cmmgr32.exe\'
  filter_main_cmcfg32:
    TargetObject|endswith: 'SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\cmmgr32.exe\CmstpExtensionDll'
    Details:
    - 'C:\Windows\System32\cmcfg32.dll'
    - 'C:\Windows\SysWOW64\cmcfg32.dll'
  filter_main_empty:
    Details: '(Empty)'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate CMSTP use (unlikely in modern enterprise environments)
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the CMSTP App Paths registry key, specifically targeting the `Cmmgr32.exe` path, which may indicate an adversary is exploiting the Microsoft Connection Manager Profile Installer (CMSTP) for arbitrary code execution or User Account Control (UAC) bypass. The likely attacker objective is to deceive the system into executing malicious code or scripts with elevated privileges. This behavior fits the MITRE ATT&CK framework under the tactic of Execution (T1203) and the specific technique of CMSTP Execution (T1218.003).

  Primary telemetry sources include Windows Registry events, particularly those related to changes in the registry key structure under `SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\`. If detected maliciously, the impact could involve unauthorized execution of software leading to compromised system integrity and potential data breaches. Importantly, this detection does NOT confirm compromise on its own; further investigation into the context and intent behind the modification is necessary.

  ### Investigation Steps

  - **Review registry modification logs**: Check for Windows Registry Event ID 4657 to identify specific changes made to `SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\cmmgr32.exe\`. Validate the timestamp and user account associated with the modification.

  - **Assess modification intent**: Analyze the `Details` field of the event to see if any unusual DLLs (e.g., `CmstpExtensionDll`) were added. Compare against known legitimate entries to identify anomalies.

  - **Identify recent CMSTP executions**: Search for Sysmon Event ID 1 to find new process creations involving `cmstp.exe`. Legitimate use cases may show usage during VPN or enterprise configuration changes rather than during atypical hours or from non-administrative accounts.

  - **Check for elevated privileges**: Investigate User Account Control (UAC) related events (Event ID 4698) to determine if any actions were taken with elevated permissions that are suspicious or unnecessary, indicating potential abuse.

  - **Cross-reference Asset Criticality**: Confirm the role of the affected host. Modifications on critical servers could imply a higher risk compared to standard user workstations.

  ### Prioritization

  The alert should be classified as high severity due to the potential for deep system compromise through arbitrary code execution, especially if observed on critical infrastructure or servers. The likelihood of malicious abuse is pertinent given that CMSTP is a known vector for exploitation. This behavior is frequently weaponized in targeted attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software installations or updates that modify App Paths, potentially leading to false positives. Required log sources include comprehensive registry auditing, and both Sysmon and Event Logs must be properly configured for thorough visibility. Legitimate enterprise actions such as VPN deployments may trigger the alert. A related detection would involve monitoring for unusual command line arguments associated with `cmstp.exe` to strengthen coverage of exploit attempts.

