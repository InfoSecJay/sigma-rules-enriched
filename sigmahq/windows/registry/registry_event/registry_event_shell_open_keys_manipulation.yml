logsource:
  category: registry_event
  product: windows
detection:
  selection1:
    EventType: SetValue
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\SymbolicLinkValue'
    Details|contains: '\Software\Classes\{'
  selection2:
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\DelegateExecute'
  selection3:
    EventType: SetValue
    TargetObject|endswith:
    - 'Classes\ms-settings\shell\open\command\(Default)'
    - 'Classes\exefile\shell\open\command\(Default)'
  filter_sel3:
    Details: '(Empty)'
  condition: selection1 or selection2 or (selection3 and not filter_sel3)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects manipulation of registry keys related to "ms-settings" and "exefile" shell commands. Specifically, it captures unauthorized changes attempting to establish persistence while bypassing User Account Control (UAC) through tools like fodhelper.exe and computerdefaults.exe. Such actions typically indicate an attacker's objective to gain elevated privileges or execute commands without user consent.

  The relevant MITRE ATT&CK tactics include Persistence (T1548.002) and Defense Evasion (T1546.001). Primary telemetry sources include Windows Registry event logs tracking SetValue actions, specifically for key paths ending in `Classes\ms-settings\shell\open\command\` and `Classes\exefile\shell\open\command\`. The potential security impact is significant as it may allow unauthorized code execution with elevated privileges. However, this detection alone does NOT confirm malicious actions without corroborating evidence of exploitation or usage of the modified values.

  ### Investigation Steps

  - **Review registry changes:**
    Investigate Windows Registry event logs for Event ID 4657 or registry change logs focusing on `SymbolicLinkValue` or `DelegateExecute`. Look for unusual entries indicating potential manipulation.

  - **Validate command value analysis:**
    Check the command values in the registry at `HKEY_CLASSES_ROOT\Classes\ms-settings\shell\open\command\` and `HKEY_CLASSES_ROOT\Classes\exefile\shell\open\command\`. Expected values should align with legitimate application paths; any anomalous or empty values should raise flags.

  - **Identify high-confidence indicators:**
    Focus on entries where `Details` includes keyword patterns associated with unusual execution methods, such as `fodhelper.exe` or `computerdefaults.exe`. This indicates a higher likelihood of exploitation.

  - **Assess host role:**
    Determine the role of the affected host (e.g., server vs. client workstation). Malicious registry manipulations are more concerning on critical systems where UAC bypass could facilitate extensive damage.

  - **Correlate with known tool patterns:**
    Compare identified registry changes with documented behaviors from known toolkits, such as those mentioned in UAC bypass documentation. Look for similarities in command execution strategies.

  - **Identify legitimate behavior:**
    Review typical application usage and system configuration changes introduced during software installations or legitimate updates that manipulate these registry keys, ensuring they are accounted for.

  ### Prioritization

  This alert should be treated with high priority due to the potential for an attacker to exploit UAC bypass mechanisms, especially on critical systems where privilege escalation can lead to severe compromise. The likelihood of misuse is notable, as this behavior is often weaponized in attack campaigns targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may be limited if sufficient audit logging is not enabled or if registry changes are processed through non-standard means. Legitimate administrative actions could generate similar alerts, especially during system updates or configuration changes. A companion detection to reinforce coverage includes monitoring for unusual process creations using Sysmon Event ID 1, especially for known binaries associated with UAC bypass techniques.

