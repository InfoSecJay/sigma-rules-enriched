detection:
  selection_1:
    EventType: SetValue
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\SymbolicLinkValue'
    Details|contains: '\Software\Classes\{'
  selection_2:
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\DelegateExecute'
  selection_3:
    EventType: SetValue
    TargetObject|endswith:
    - 'Classes\ms-settings\shell\open\command\(Default)'
    - 'Classes\exefile\shell\open\command\(Default)'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_default_com:
    Details:
    - '{4813071a-41ad-44a2-9835-886d2f63ca30}'
    - '{A56A841F-E974-45C1-8001-7E3F8A085917}'
    - '{4ED3A719-CEA8-4BD9-910D-E252F997AFC2}'
    - '{BFEC0C93-0B7D-4F2C-B09C-AFFFC4BDAE78}'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects unauthorized modifications to specific Windows registry keys that control how shell commands are executed for certain file types, particularly `ms-settings` and `exefile`. These behaviors are often indicative of an attacker attempting to bypass User Account Control (UAC) or establishing persistence via file association manipulation. The relevant MITRE ATT&CK tactic is **Persistence** and the technique is **T1548.002: Bypass User Account Control**.

  The primary telemetry sources for this detection are Windows registry event logs, specifically capturing details about the `SetValue` action on the designated registry paths. If malicious, this activity can enable threat actors to execute programs without user consent, significantly impacting system security. Importantly, this detection does NOT confirm that the behavior is inherently malicious; it requires further investigation to assess intent.

  ### Investigation Steps

  - **Check registry modification events:** Review Windows Security Event ID 4657 (Registry value modified) for changes to `HKEY_CLASSES_ROOT\ms-settings\shell\open\command` and `HKEY_CLASSES_ROOT\exefile\shell\open\command`. Focus on `Details` containing `'\Software\Classes\{'` to identify potential UAC bypass attempts.
  - **Evaluate Default Values:** Analyze modifications to the `(Default)` value under the aforementioned keys. Legitimate software typically retains the original commands for system utilities or executables, such as `C:\Windows\System32\foo.exe`. Any unfamiliar or suspicious paths should be flagged.
  - **Correlate with user activity:** Investigate user activity logged around the same time in Windows Event IDs 4624 (Successful logon) and 4634 (Logoff). Confirm if the user was executing tasks that align with expected behavior during the period of registry changes.
  - **Identify high-confidence indicators:** Search for the presence of the executable `fodhelper.exe` being invoked shortly after any alerts triggered by this rule. This is a strong indicator of possible privilege escalation attempts.
  - **Consider asset criticality:** Determine if the system in question is a critical server or workstation by checking asset classifications in your CMDB. Higher criticality increases the urgency of the investigation.
  - **Look for related alerts:** Cross-reference alerts triggered by related Sigma rules for other persistence techniques (like process creation or task manipulation). This may provide context on a broader attack strategy.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant impact—such as unauthorized access to system functions or elevation of privileges. The likelihood of malicious abuse is moderate to high, as alterations to these registry settings are commonly associated with known attack methods.

  ### Blind Spots and Assumptions

  Detection may be limited by the context of legitimate administrative activities that could modify the same registry keys for valid purposes. Ensure logging for registry events is enabled and configured properly. Additionally, benign applications may also modify these keys, requiring further validation of intent. A related detection for comprehensive monitoring of UAC bypass attempts would be alerts from the process creation rule involving `fodhelper.exe` or other unexpected process executions related to these manipulations.

