logsource:
  category: registry_event
  product: windows
detection:
  selection1:
    EventType: SetValue
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\SymbolicLinkValue'
    Details|contains: '\Software\Classes\{'
  selection2:
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\DelegateExecute'
  selection3:
    EventType: SetValue
    TargetObject|endswith:
    - 'Classes\ms-settings\shell\open\command\(Default)'
    - 'Classes\exefile\shell\open\command\(Default)'
  filter_sel3:
    Details: '(Empty)'
  condition: selection1 or selection2 or (selection3 and not filter_sel3)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies malicious activity related to the manipulation of registry keys, specifically targeting the `ms-settings` and `exefile` classes. Attackers often exploit these registry settings to establish persistence or achieve an elevation of privileges via UAC (User Account Control) bypass techniques, such as those executed by `fodhelper.exe`, `computerdefaults.exe`, or `slui.exe`. These tactics would be used in scenarios where an adversary seeks to maintain access or elevate their permissions on a compromised system, ultimately aiming to execute arbitrary code or gain persistent footholds.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - Persistence (T1548.002) – through the modification of registry keys.
  - Defense Evasion (T1546.001) – via the use of registry-based methods for executing commands without triggering security defenses.

  Primary data sources for this rule consist of Windows registry event logs that capture the modification of registry keys and any associated details regarding the operations conducted in those keys.

  ### Investigation Steps
  - **Review Registry Events:** Examine registry event logs for any creation or modification actions related to `ms-settings` or `exefile` shell commands, focusing specifically on the EventType `SetValue`.

  - **Check UAC Bypass Behavior:** Investigate the usage of process and command lines around known UAC bypass executables (e.g., `fodhelper.exe`, `computerdefaults.exe`, `slui.exe`) to determine if they were invoked in an unusual context.

  - **Analyze Command Line Parameters:** Look for suspicious command line parameters associated with the executables mentioned above, especially those that could indicate potential misuse for establishing persistence.

  - **Correlate with User Behavior:** Assess any anomalous user behavior correlated with the timings of the detected registry modifications to understand potential insider threats or compromised accounts.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact of an attacker establishing persistence or elevating privileges within an environment, which can lead to significant and wide-ranging security breaches if not addressed promptly.

  ### Blind Spots and Assumptions
  This detection logic may not capture all registry manipulation actions, particularly if attackers employ less common methods or use obfuscation to disguise their activities. It assumes that the relevant registry event logging is enabled and properly configured across all endpoints. Furthermore, false positives may arise from legitimate administrative actions, which should be carefully assessed before drawing conclusions from the alerts generated.

