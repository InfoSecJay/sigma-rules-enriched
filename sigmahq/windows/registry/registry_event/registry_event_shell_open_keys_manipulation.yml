logsource:
  category: registry_event
  product: windows
detection:
  selection1:
    EventType: SetValue
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\SymbolicLinkValue'
    Details|contains: '\Software\Classes\{'
  selection2:
    TargetObject|endswith: 'Classes\ms-settings\shell\open\command\DelegateExecute'
  selection3:
    EventType: SetValue
    TargetObject|endswith:
    - 'Classes\ms-settings\shell\open\command\(Default)'
    - 'Classes\exefile\shell\open\command\(Default)'
  filter_sel3:
    Details: '(Empty)'
  condition: selection1 or selection2 or (selection3 and not filter_sel3)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects manipulation of registry keys associated with the `ms-settings` and `exefile` command shells, which are commonly exploited techniques for creating persistence mechanisms and performing User Account Control (UAC) bypass. The likely objective of an attacker is to gain elevated privileges and ensure persistent access to a compromised system. Relevant MITRE ATT&CK tactics include Persistence (T1548.002) and Privilege Escalation (T1546.001).

  The primary telemetry sources for this detection are Windows Registry events, specifically those related to registry modifications (Event Type SetValue). If successful manipulation occurs, it may allow external actors to maintain control even after system reboots. This detection does NOT confirm that a successful privilege escalation has occurred on its own; additional analysis is required to assess context and intent.

  ### Investigation Steps

  - **Identify suspicious registry changes:** Review Windows Registry events, focusing on Event Type `SetValue` for `TargetObject` paths ending in `ms-settings\shell\open\command\SymbolicLinkValue` or `exefile\shell\open\command\(Default)`. Look for any unexpected modifications, especially regarding symbolic links which may indicate malicious activity.

  - **Correlate with UAC bypass tools:** Check for execution of known UAC bypass executables such as `fodhelper.exe`, `computerdefaults.exe`, or `slui.exe` around the same timeframe as the registry modifications. Look for Event ID 4688 (Process Creation) that shows these executables running.

  - **Validate benign configurations:** Compare the detected registry values against a baseline of known good configurations. Legitimate administrative applications may use these registry keys; normal values should not include harmful paths or unexpected symbolic links.

  - **Define malicious indicators:** Pay particular attention to alterations in registry values that enable execution without prompting UAC or that redirect expected commands to malicious actors. This can be verified by checking the `Details` field for values containing `\Software\Classes\{`.

  - **Assess asset criticality:** Apply context to the affected asset. If the registry keys belong to a critical server or a machine used by privileged users, escalate the priority. This can involve cross-referencing asset categorization records or identifying system roles via CMDB.

  - **Look for exfiltration artifacts:** Investigate for any data exfiltration signals after the registry change; examine logs for network connections to known malicious IPs or unusual outbound connections that may suggest data theft.

  ### Prioritization

  The alert severity is high due to the potential impact of compromise given the ability to establish persistence and elevate privileges. The manipulative behavior detected is a common tactic used by sophisticated threats, increasing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection limitations exist with common administrative tasks that might cause similar registry changes, potentially resulting in false positives. Complete telemetry from Event ID 4657 (Registry value modified) and related Windows logs is necessary for comprehensive visibility. Legitimate software updates or installations may initiate changes to these registry keys. Related detections include monitoring for unusual process creations, specifically around known UAC processes, which helps strengthen overall security posture.

