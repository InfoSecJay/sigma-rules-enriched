  ---

  ### Technical Context

  This Sigma rule detects the installation of the Azure Hybrid Connection Manager service, a component often exploited for remote code execution via Azure functions. An attacker may aim to compromise a system to enable backend access or to facilitate unauthorized data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Resource Development (TA0042) and specifically technique T1608, which involves the legitimate use of services for malicious purposes.

  Primary telemetry sources include Windows Registry events, particularly monitoring modifications to service entries. Key log types are registry event logs noting the creation or modification of entries associated with the Hybrid Connection Manager. If this detection is confirmed to be malicious, it could lead to unauthorized access and potential data breaches. However, it's important to note that this alert alone does not confirm malicious intent without further contextual evidence.

  ---

  ### Investigation Steps

  - **Identify Registry Modification:** Examine Windows Security Event ID 4663 or registry log entries for access to `\Services\HybridConnectionManager`. Look for tools or activities associated with this registry path.

  - **Check for Hybrid Connection Manager Executable:** Review any events indicating the presence of `Microsoft.HybridConnectionManager.Listener.exe` (Event ID not specified). Validate if this executable is being executed from a trusted location or if there are anomalous execution paths.

  - **Assess Service Creation Activity:** Investigate event logs for service creation or modifications (Event ID 7045) against system context. Legitimate installations are typically from administrative scripts or trusted deployment methods—flag any deviations.

  - **Look for Recent Azure Function Deployments:** Analyze Azure activity logs for recent function app deployments from the same source. Verify if they align with known business objectives or unusual patterns that suggest exploitation.

  - **Evaluate Assets for Criticality:** Consider host role and criticality; installations on server roles with direct internet exposure are more concerning. Any unplanned installations on these systems should be prioritized for deeper investigation.

  - **Confirm Artifact Creation:** Validate presence of files related to the installation in system directories, focusing on timestamps. Comparing file creation times against the service registry modifications can help indicate malicious intent.

  ---

  ### Prioritization

  This alert carries high severity due to its association with the potential exploitation of Azure services, which can be critical in an enterprise. Given the likelihood of abusive scenarios facilitated by such installations, swift investigation is imperative. The behavior is not only rare but also commonly leveraged in advanced persistent threat (APT) operations.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all Windows Registry modifications if not adequately monitored. The potential for legitimate Azure Hybrid Connection Manager installations by admins under management processes can lead to false positives. Companion detections should include monitoring for anomalous Azure function activities or unauthorized registry changes that could indicate similar threat vectors.

