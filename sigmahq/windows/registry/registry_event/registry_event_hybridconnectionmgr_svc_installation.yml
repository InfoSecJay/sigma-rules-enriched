level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of the Azure Hybrid Connection Manager service on Windows machines. The Azure Hybrid Connection Manager facilitates remote code execution within Azure environments, enabling attackers to send malicious commands from Azure functions to compromised systems in an enterprise network. The threat scenario is particularly relevant in the context of cloud-native applications where hybrid connectivity is in use, as attackers may exploit this service to bridge cloud infrastructure with on-premises environments for malicious purposes.

  Relevant MITRE ATT&CK tactics include:
  - **Resource Development (TA0042)**: The establishment of infrastructure for the purpose of executing malicious actions.
  - **Execution (TA0002)**: Techniques involved in running malicious payloads on target machines.

  Primary data sources that will provide compelling evidence for this alert include Windows registry event logs that detail changes in system configurations, particularly focusing on the installation of services and their associated binaries.

  ### Investigation Steps
  - **Review Registry Logs**: Check for entries related to the installation of the 'HybridConnectionManager' service, specifically monitoring any changes to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\`.
  - **Analyze Event Logs**: Examine Windows Security/Event logs for records of the `SetValue` event type related to the service installation, looking for entries involving 'Microsoft.HybridConnectionManager.Listener.exe'.
  - **Investigate Network Traffic**: Monitor outbound network connections that may indicate communication attempts to Azure services, particularly from the newly installed service, which could suggest malicious exploitation.
  - **Assess Privilege Escalation Patterns**: Evaluate user permissions and roles associated with any accounts involved in the installation to determine if elevated privileges were abused during the process.

  ### Prioritization
  This alert is categorized as high severity due to the potential for remote code execution which poses significant risk to the integrity and confidentiality of enterprise systems. The likelihood of such attacks in modern cloud environments, especially with prevalent hybrid work setups, increases the urgency for investigation.

  ### Blind Spots and Assumptions
  There are several potential gaps in detection coverage; for instance, if the necessary Windows registry auditing is not enabled, related events may not be logged. Additionally, the detection logic presumes that the service installation follows standard procedures, which may not hold in cases of sophisticated attacks using obfuscation tactics. To ensure effective detection, consistent logging of registry events and proper configurations of alerting mechanisms must be maintained.

