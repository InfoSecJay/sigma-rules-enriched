note: |
  ### Technical Context

  This Sigma rule detects registry changes associated with the installation of the Azure Hybrid Connection Manager (HCM) service, specifically by monitoring for the creation or modification of registry keys related to it. Malicious actors may install this service to facilitate remote command execution via Azure Functions, potentially leading to unauthorized access or control over compromised systems. The relevant MITRE ATT&CK tactic is "Resource Development" (TA0042) and technique is "Application Layer Protocol" (T1608).

  Primary telemetry sources required for this rule include Windows registry event logs, particularly looking for registry modifications under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\HybridConnectionManager`. If the installation of the HCM is malicious, it poses a high security risk as it enables remote control capabilities. It is important to note that this detection alone does not confirm malicious intent or compromise without further investigation.

  ### Investigation Steps

  - **Check registry changes:** Query Windows registry logs for Event ID 4657 or relevant Sysmon Event ID 12 for alterations in any keys under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\HybridConnectionManager`. Look for entries with `SetValue` EventType to confirm changes. Legitimate installations by administrators should include business justification.

  - **Review associated process creation:** Look for process creation events (Security Event ID 4688 or Sysmon Event ID 1) for `Microsoft.HybridConnectionManager.Listener.exe`. Malicious instances may occur shortly after registry modification events.

  - **Analyze network traffic:** Utilize network telemetry to identify outbound connections associated with the Azure Hybrid Connection Manager. Monitor for unusual connections to Azure service endpoints from the affected system, which could indicate malicious remote access.

  - **Examine user accounts associated with changes:** Investigate the user account that initiated the registry change to determine legitimacy. Benign changes typically originate from known administrative accounts during approved operational processes.

  - **Identify related tasks or services:** Query for any scheduled tasks or services related to `HybridConnectionManager`. Investigate if any unexpectedly created tasks schedule execution of the newly installed service or related binaries.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on compromised systems, as Azure Hybrid Connection Manager is associated with remote command execution capabilities. The likelihood of adversaries leveraging this service for malicious purposes is significant, given its function as a remote control mechanism, which is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as attackers modifying the installation paths or disguising the service under legitimate-looking names. Reliable detection requires proper logging configuration, especially ensuring proper registry auditing is enabled. Legitimate activities, such as system administrators installing legitimate Azure services, may inadvertently trigger this alert. A complementary detection to enhance coverage could include monitoring for unusual Azure-related API calls in CloudTrail logs, which may indicate further abuse of Azure services.

