logsource:
  category: registry_event
  product: windows
detection:
  selection:
    Image|endswith:
            # Add more suspicious processes
    - '\mshta.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  filter_main_legit_wscript:
    Image|endswith: '\wscript.exe'
    TargetObject|contains:
    - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\'
    - '\Services\bam\State\UserSettings\S-1-'
    - 'Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\'
    - 'Software\Microsoft\Windows\CurrentVersion\Internet Settings\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some legitimate admin or install scripts may use these processes for registry 
  modifications.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized registry modifications executed by scripts (e.g., WScript.exe, CScript.exe), which are atypical for legitimate administrative tasks. The likely attacker objective is to establish persistence or modify system behavior for malicious purposes, aligning with the MITRE ATT&CK tactics of Defense Evasion (T1562) and Persistence (T1059.005). The primary telemetry source is Windows Registry Event logs (Event ID 13), capturing modifications to registry keys.

  If successfully executed, these registry changes can lead to issues like unauthorized data access or system instability by altering critical system settings. However, the detection alone does not confirm malicious intent; legitimate administrative tasks may trigger registry changes through these scripts.

  ### Investigation Steps

  - **Check Event ID 13 for Registry Modifications**: Review Windows Registry Event logs to identify specific registry keys modified by the suspicious processes. Focus on keys outside the expected legitimate modification locations (e.g., UserSettings or Internet Settings).

  - **Validate Process Origins**: Investigate the parent processes of WScript.exe or CScript.exe using Security Event ID 4688 or Sysmon Event ID 1. Look for indicators that the process was spawned by a known legitimate application versus anomalous entries, such as scripts from temp directories.

  - **Identify Malicious Registry Keys**: Specifically look for modifications to critical registry paths (e.g., HKCU\Software\Microsoft\Windows\CurrentVersion\Run). Changes here may indicate persistence mechanisms being established by an adversary.

  - **Correlate with System Integrity**: Assess the asset's criticality and expected behavior by verifying whether legitimate admin scripts are indeed modifying the registry. Review if these changes correspond to recent installations or updates.

  - **Review Telemetry for Evasion Indicators**: Cross-reference any detected script activity with anti-virus or application control logs for known malicious indicators (hashes, signatures, etc.). Focus on logs from endpoint security solutions for detection of malicious script execution.

  ### Prioritization

  The alert is of medium severity due to the potential impact on critical systems, as unauthorized registry modifications can facilitate persistence and further exploitation. The use of scripting tools for registry manipulation is not common in legitimate operations, increasing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that employ scripts for registry changes, potentially leading to false positives. Ensure logging is enabled for Windows Registry modifications (Event ID 13) to capture all necessary changes. Common evasion techniques include use of obfuscated scripts or execution from non-standard paths. Companion detections that reinforce coverage include process creation logs (Event ID 4688) to correlate script executions with changes made.

