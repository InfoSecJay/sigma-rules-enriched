logsource:
  category: registry_event
  product: windows
detection:
  selection:
    Image|endswith:
            # Add more suspicious processes
    - '\mshta.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  filter_main_binary_data:
    Details: 'Binary Data'
  filter_main_null:
    Details:
  filter_main_wscript_legit_1:
    Image|endswith: '\wscript.exe'
    TargetObject|contains:
    - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\'
    - '\Services\bam\State\UserSettings\S-1-'
    - 'Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\'
    - 'Software\Microsoft\Windows\CurrentVersion\Internet Settings\'
  filter_main_wscript_legit_2:
    Image|endswith: '\wscript.exe'
    TargetObject|contains: '\wscript.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some legitimate admin or install scripts may use these processes for registry 
  modifications.
level: medium
note: |
  ### Technical Context

  This rule detects suspicious modifications to the Windows registry made by uncommon processes such as WScript or CScript. These processes are typically not used for legitimate registry alterations, thus their invocation may indicate an attacker's attempt to manipulate the registry for evasion or persistence. The relevant MITRE ATT&CK tactics include Persistence (T1547) and Execution (T1059.005).

  The primary telemetry sources are Windows Registry Event Logs. Required log types include registry modification attempts with a focus on specific target objects likely associated with malicious activity. If malicious, this could enable an attacker to achieve persistence on the system, allowing them to execute malicious code or alter system behavior undetected. However, this detection does NOT confirm malicious activity on its own; further investigation is required to establish intent and impact.

  ### Investigation Steps

  - **Review the registry modification context**: Check Registry Event Logs (Event ID 4657) for modifications by processes like WScript.exe or CScript.exe targeting paths such as `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run`. Compare accessed paths with known legitimate entries.

  - **Check process invocation**: Cross-reference the suspicious process execution with Process Creation Events (Security Event ID 4688) for WScript or CScript. Look for unusual parent processes or execution paths that suggest misuse.

  - **Identify high-confidence malicious indicators**: Look for registry changes involving `SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\` made by suspicious processes (especially if executed from unexpected directories, such as user profile folders).

  - **Examine expected behaviors for legitimacy**: Identify typical administrative or install script activity that intentionally uses WScript or CScript for legitimate registry adjustments. This may include software installations or patch management processes that modify registry settings according to documented procedures.

  - **Validate executable signatures**: Ensure that the binaries executing the suspected modifications (WScript.exe, CScript.exe) are from known, valid sources. Use Microsoft’s signing databases or internal application whitelisting details to confirm legitimacy.

  - **Analyze potential evasion**: Assess for known evasion techniques, such as the use of unusual script arguments or runtime variables that deviate from expected operational practices. Identify documented use cases for malicious registry modifications using PowerShell or script engines.

  ### Prioritization

  This alert carries medium severity as it involves direct modifications to the system registry, which can severely disrupt system behavior if exploited. The likelihood of malicious abuse is moderate, particularly in environments where script hosts are misused. This behavior is moderately common in weaponized scenarios, especially in targeted attacks for persistence.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives from legitimate scripts modifying the registry, such as valid administrative configurations. Required log sources include comprehensive monitoring of Registry Event Logs without filters that could miss relevant entries. Common legitimate activities triggering the alert could involve scheduled tasks or deployment scripts. Related rules focusing on script execution monitoring or unauthorized binary modifications can enhance overall detection coverage.

