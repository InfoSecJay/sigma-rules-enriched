logsource:
  category: registry_event
  product: windows
detection:
  selection:
    Image|endswith:
            # Add more suspicious processes
    - '\mshta.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  filter_main_binary_data:
    Details: 'Binary Data'
  filter_main_null:
    Details:
  filter_main_wscript_legit_1:
    Image|endswith: '\wscript.exe'
    TargetObject|contains:
    - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\'
    - '\Services\bam\State\UserSettings\S-1-'
    - 'Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\'
    - 'Software\Microsoft\Windows\CurrentVersion\Internet Settings\'
  filter_main_wscript_legit_2:
    Image|endswith: '\wscript.exe'
    TargetObject|contains: '\wscript.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some legitimate admin or install scripts may use these processes for registry 
  modifications.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious modifications to the Windows Registry triggered by script engine processes like WScript or CScript. These processes are typically leveraged by attackers to manipulate the registry surreptitiously, often for persistence and evasion tactics. The likely attacker objective is to create or modify registry entries that allow malicious software to execute automatically on system startup. This behavior aligns with the MITRE ATT&CK techniques T1112 (Modify Registry) and T1059.005 (Command and Scripting Interpreter: Windows Script Host).

  The primary telemetry source for this detection is the Windows Registry event logs, specifically looking for registry modifications initiated by targeted process images. The security impact could involve persistent malware or unauthorized configuration changes. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is always required to distinguish between legitimate use and nefarious activity.

  ### Investigation Steps

  - **Check the process involved**: Review Windows Event ID 4657 to identify the process making registry changes. Look specifically for event timestamps that correlate with the alert generation time. If the process is primarily a known administrative tool, it may be benign.

  - **Review registry paths affected**: Analyze the changes to the registry using Windows Event ID 4657 or querying the registry directly. Legitimate modification example paths include 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\' which would imply normal operations rather than malicious intent.

  - **Identify suspicious modifications**: Cross-reference with the specific paths modified as indicated in the alert. Modifications outside common administrative keys, especially related to persistence or execution (e.g., keys under 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run'), could indicate a high-confidence malicious indicator.

  - **Examine legitimacy of scripts used**: For instances where WScript or CScript processes are involved, review the script content and execution context. If they are sourced from unexpected locations or executed by non-admin users, this raises red flags.

  - **Assess potential for evasion**: Document any patterns of legitimate activity that may appear similar to the alerts, such as software installation or updates that utilize WScript. This helps filter out false positives during ongoing investigations.

  - **Monitor for related events**: Utilize hunting techniques by correlating this event with similar detections (e.g., from related Sigma rules concerning lateral movement or remote access mechanisms) to strengthen your investigation. Look for patterns in the execution of script processes over time to identify any unusual behavior.

  ### Prioritization

  The alert is medium severity due to the potential impact on system integrity through unauthorized registry modifications. While the processes involved are not inherently malicious, their use for registry tampering in this context is often tied to adversarial actions. This behavior is indeed weaponized by attackers seeking to establish persistence mechanisms within the target environment.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative processes that also modify the registry but are not captured by the rule. A reliable detection requires thorough configuration of Windows Event logging to ensure registry changes are recorded. Routine administrative tasks, such as software installations or updates, may trigger this alert. A relevant companion detection might involve monitoring PowerShell usage (T1059.001), which could be used in conjunction with scripts that modify registry settings, enhancing overall visibility to malicious activities.

