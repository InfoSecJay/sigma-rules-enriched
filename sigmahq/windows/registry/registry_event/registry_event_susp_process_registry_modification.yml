note: |
  ### Technical Context

  This detection rule identifies potentially suspicious modifications to the Windows registry by uncommon processes, specifically script engine executables like WScript.exe and CScript.exe, which are rarely used for legitimate registry changes. The likely attacker objective is to manipulate the registry for persistence, evading traditional detection methods by using common, pre-installed Windows components instead of typical administrative tools. This behavior maps to the MITRE ATT&CK techniques of Defense Evasion (T1112) and Command and Scripting Interpreter: Windows Script Host (T1059.005).

  Primary telemetry sources include Windows Registry Event logs. The security impact of malicious activity may result in unauthorized persistence mechanisms or alterations that compromise system integrity or facilitate further attacks. Importantly, this detection does not definitively prove malicious intent, as legitimate administrative scripts may trigger the same alerts.

  ### Investigation Steps

  - **Identify the invoking process:** Review Event ID 4657 (Registry Value Modified) and correlate with Event ID 4688 (Process Created) to see which processes initiated registry changes. Look for processes ending in `mshta.exe`, `wscript.exe`, or `cscript.exe` as suspicious indicators.

  - **Correlate with user context:** Examine the user account associated with the detected registry modification. Anychanges initiated by non-admin users could heighten suspicion. Focus on logs containing `SubjectUserName` and `NewValueData`.

  - **Review for legitimate usage patterns:** Document any benign usage of script engines on the asset, such as scheduled tasks or regular maintenance scripts that involve registry changes. These behaviors often originate from trusted system processes or administrator accounts.

  - **Check for persistence indicators:** Look within the registry changes for any entries in `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations that indicate the creation of persistence mechanisms (Event ID 4657).

  - **Investigate simultaneous system changes:** Review for other security events around the same timestamp, such as unexpected service installations or changes in user rights. Correlating suspicious registry changes with these events can indicate a more comprehensive attack.

  - **Assess impact through process and file metrics:** Validate any potential file creations or suspicious activity associated with the processes in use. Check for unusual file paths and types (e.g., .vbs, .js) created around the time of the registry modification (Sysmon Event ID 11).

  ### Prioritization

  The alert severity is medium due to the potential impact on affected systems, which can serve as a foothold for further exploitation. While this behavior isn't as commonly weaponized as direct file execution, the use of scripting engines for registry tampering poses a significant risk if orchestrated by a malicious actor.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate administrative scripts use the same processes, possibly leading to false positives, especially during software installations. Effective detection requires detailed logging from the registry and process creation events, specifically around unusual registry modifications. Legitimate activities might include trusted administrative scripts. A related detection rule targeting executables with atypical command-line arguments could enhance overall detection capability in this area.

