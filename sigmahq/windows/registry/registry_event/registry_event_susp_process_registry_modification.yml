  ---

  ### Technical Context

  This alert detects potentially malicious modifications to the Windows Registry made by unusual processes, specifically script engine executables such as `WScript.exe` and `CScript.exe`. The detection is indicative of an attacker attempting to manipulate the registry for persistence or evasion purposes, often circumventing standard registry tools like `regedit.exe` or `reg.exe`. This behavior aligns with the MITRE ATT&CK techniques for Persistence (T1547.001) and Defense Evasion (T1112).

  The primary telemetry sources for this detection include Windows Registry event logs. In a malicious context, it can indicate attempts to establish persistence mechanisms that could lead to further exploitation. However, this detection does NOT confirm an active compromise on its own; legitimate administrative actions or software installs may also utilize these processes for benign registry modifications.

  ---

  ### Investigation Steps

  - **Identify specific registry modifications:** Review Registry Event logs (Event ID 4657) for changes made by `WScript.exe`, `CScript.exe`, or `Mshta.exe`. Look for unexpected modifications to keys related to startup items or software settings.

  - **Examine parent processes:** Use Sysmon (Event ID 1) to trace the parent process of the suspicious script engine activities. Legitimate use often involves common applications like installers or administrative scripts.

  - **Determine execution context:** Check for recent run history of `wscript.exe`, `cscript.exe`, or `mshta.exe` via the command line (Event ID 4688). Alert for unusual arguments that may indicate an attack vector, such as the presence of encoded commands.

  - **Validate artifact creation:** Look for the creation or modification of associated files in known paths (e.g., C:\Windows\System32\) tied to the script engines after suspicious registry edits, indicating potential persistence measures.

  - **Monitor modification timelines:** Cross-reference timestamps of registry changes with other security logs (e.g., Windows Security logs or Sysmon logs) for concurrent events that could correlate with a malicious activity timeline.

  ---

  ### Prioritization

  The severity of this alert is medium, as it indicates potential malicious behavior that can impact system integrity and security. The likelihood of abuse is moderate, particularly given that script engines are often utilized in both benign administrative tasks and malicious activities. However, the specific context and nature of the modifications are critical in assessing true risk.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate tools and administrative tasks to trigger similar alerts, leading to false positives. Comprehensive log collections from all relevant sources, particularly Windows Registry event logs and Sysmon, are essential for effective detection. Legitimate installation scripts, maintenance tasks, or administrative changes can also lead to such alerts. A related detection that strengthens coverage is checking for unauthorized access to administrative shares (MITRE ATT&CK T1077).

