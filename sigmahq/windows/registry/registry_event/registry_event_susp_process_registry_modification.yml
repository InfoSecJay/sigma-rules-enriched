note: |
  ### Technical Context
  This detection rule targets suspicious modifications to the Windows registry performed by potentially harmful processes such as `WScript.exe`, `CScript.exe`, and `mshta.exe`. These script engine processes are infrequently utilized for legitimate registry changes, making their activity a significant indicator of potential malicious intent. Attackers often leverage these processes to modify the registry in a manner that evades conventional detection mechanisms, facilitates persistence, or deploys malware components.

  The rule is associated with MITRE ATT&CK tactics including **Execution (T1059.005)** where attackers use scripting languages to execute commands or scripts, and **Persistence (T1112)**, focusing on the manipulation of the registry to ensure malicious software remains active across system reboots. The detection leverages registry event logs, providing a primary source of telemetry that can reveal unauthorized modifications linked to these processes.

  ### Investigation Steps
  - **Review Registry Event Logs:** Examine the logs for entries that indicate modifications made by `WScript.exe`, `CScript.exe`, or `mshta.exe`. Look for unusual keys or values that have been changed, particularly those associated with persistence such as Run keys.

  - **Analyze Process Activity:** Investigate the execution context of the identified processes. Check the parent processes and command-line arguments to ascertain if they exhibit behavior consistent with malicious activities, such as obscure paths or unusual options.

  - **Assess User and System Context:** Determine the user account under which the modifications occurred. Anomalies in user behavior or unexpected privilege levels during these registry changes could indicate a compromised account or insider threat.

  - **Cross-reference with Threat Intelligence:** Compare identified processes and registry changes against known threat actor behaviors and malware indicators. Leverage threat intelligence feeds to identify if the observed activities correlate with active campaigns or established TTPs.

  ### Prioritization
  This alert holds medium severity due to the potential implications of registry tampering, such as establishing persistence for malicious software. While the direct impact may vary based on the context of the environment, the likelihood of attackers utilizing such methods in advanced attacks necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The detection logic presumes that script engine processes are not used in legitimate administrative tasks but may miss legitimate scenarios where these processes are required for system configurations or installations. It also relies heavily on having detailed and timely registry event logs enabled. Any gaps in logging configurations or incorrect log retention policies could lead to missed indicators of compromise associated with malicious registry activities.

