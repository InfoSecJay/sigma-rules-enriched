logsource:
  category: registry_event
  product: windows
detection:
  selection_registry:
    TargetObject|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\utilman.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\osk.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\Magnify.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\Narrator.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DisplaySwitch.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\atbroker.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\HelpPane.exe\Debugger'
  condition: selection_registry
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry aimed at exploiting built-in accessibility tools, specifically the registration of a malicious debugger for Sticky Keys and other accessibility applications. Attackers often use this method to gain unauthorized access during the login screen, allowing them to execute arbitrary commands with elevated privileges. This behavior fits within the MITRE ATT&CK framework under the tactics of Privilege Escalation (TA0004) and Persistence (TA0003), specifically the technique T1546.008 (Event Triggered Execution).

  The primary telemetry source is the Windows Registry, where specific keys related to built-in tools like Sticky Keys, Utilman, and Narrator are monitored for suspicious debugger entries. If successful, this activity can lead to escalated privileges and unauthorized access to systems, representing a critical security impact. However, detection of registry modifications alone does not confirm that an exploitation was executed; it merely indicates that a setup for potential exploitation has occurred.

  ### Investigation Steps

  - **Identify registry modifications**: Review Windows Registry logs for alterations to keys ending in "\Debugger" for sethc.exe, utilman.exe, and others (e.g., Registry Event ID 13 for successful changes). Check for unusual debugger values, which may indicate malicious activity.

  - **Correlate with user activity**: Examine User Logon Events (e.g., Security Event ID 4624) that occur around the same time to determine if there were successful logins or attempts to leverage accessibility tools. Benign indicators include system admins accessing these tools for legitimate troubleshooting.

  - **Review process creations**: Analyze process creation logs, focusing on Sysmon Event ID 1, to correlate any new processes initiated by accessibility tools (e.g., sethc.exe or utilman.exe) just before the registry modifications. Legitimate activity is typically straightforward execution of these tools without debugger alterations.

  - **Check associated command-line arguments**: Look at Security Event ID 4688 for command-line execution that follows registry changes. Malicious indicators may include unusual parameters or paths pointing to non-typical binary locations.

  - **Inspect for previous alerts**: Conduct a historical search on security alerts related to user behavior around the time of registry changes, looking for patterns of unauthorized access or privilege escalations in Security Information and Event Management (SIEM) systems.

  ### Prioritization

  This alert is critical due to the high impact of unauthorized access if a malicious debugger is used to exploit built-in tools for privilege escalation. The likelihood of this technique being weaponized is significant, as it provides attackers with a stealthy method to bypass security controls and elevate privileges undetected.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate accessibility tool configurations causing false positives, especially in environments where these tools are regularly used. Proper configuration of log sources, such as enabling detailed registry auditing, is essential for effective detection. Legitimate activities, like administrative use of accessibility features for troubleshooting, may trigger similar alerts. A related detection rule would be monitoring for abnormal process execution from tools like utilman.exe or sethc.exe, providing complementary coverage.

