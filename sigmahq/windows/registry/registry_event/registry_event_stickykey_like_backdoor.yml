- car.2014-11-003
- car.2014-11-008
logsource:
  category: registry_event
  product: windows
detection:
  selection_registry:
    TargetObject|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\utilman.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\osk.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\Magnify.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\Narrator.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DisplaySwitch.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\atbroker.exe\Debugger'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\HelpPane.exe\Debugger'
  condition: selection_registry
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies the installation and usage of sticky key-like backdoors that exploit Windows' "Image File Execution Options" (IFEO) to replace legitimate executables with malicious ones. Attackers often leverage this technique as a persistence method, allowing them unauthorized access to a compromised system through commonly used accessibility tools (like sticky keys, on-screen keyboard, etc.) that can be triggered at the login screen. By setting a malicious debugger for these system executables, attackers can execute custom code or gain further control once the system boots.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), particularly technique **T1546.008** ("Embedded Account Credentials"). Attackers may be aiming to create a backdoor for continuous access, manipulate accounts, or escalate privileges without alerting traditional security mechanisms.

  Primary data sources for gathering evidence include Windows registry event logs that track changes, particularly those related to "Image File Execution Options" for system tools. These logs are crucial for spotlighting unusual or unauthorized modifications that could indicate malicious activity.

  ### Investigation Steps
  - **Review Registry Changes:** Examine Windows registry logs focusing on entries related to `Image File Execution Options`. Look specifically for debugger settings on `sethc.exe`, `utilman.exe`, and other specified executables to identify unauthorized alterations.

  - **Correlate with User Activity:** Analyze any user authentication logs that occurred around the same timeframe as the registry changes. Look for unusual login attempts or activity on accounts that align with potential backdoor usage.

  - **Assess Installed Software:** Investigate installed applications for known malicious tools or unauthorized software that could relate to the detected changes. Cross-reference this with threat intelligence feeds for similar identifiers.

  - **Monitor System Behavior:** Observe system behavior post-detection. Look for suspicious processes or actions initiated through common accessibility tools that align with the identified registry modifications.

  ### Prioritization
  This alert is critical due to its high potential impact on the enterprise's security posture. The presence of sticky key-like backdoors can facilitate unauthorized access and control, which poses significant risks for data exfiltration and further lateral movement within the network.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where Windows registry logging is not enabled or is improperly configured. The logic assumes that all changes to the specified registry paths are logged, which may not always be the case if systems are misconfigured. Additionally, there may be legitimate administrative actions that could trigger similar alerts, potentially leading to false positives in rare cases. Ensuring detailed logging of registry events is crucial for the effective functioning of this detection rule.

