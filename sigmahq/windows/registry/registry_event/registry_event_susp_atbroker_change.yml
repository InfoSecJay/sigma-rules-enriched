title: Atbroker Registry Change
id: 9577edbb-851f-4243-8c91-1d5b50c1a39b
status: test
description: Detects creation/modification of Assistive Technology applications and
  persistence with usage of 'at'
references:
- http://www.hexacorn.com/blog/2016/07/22/beyond-good-ol-run-key-part-42/
- https://lolbas-project.github.io/lolbas/Binaries/Atbroker/
author: Mateusz Wydra, oscd.community
date: 2020-10-13
modified: 2023-01-19
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1218
- attack.persistence
- attack.t1547
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
  filter_atbroker:
    Image: 'C:\Windows\system32\atbroker.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
    Details: '(Empty)'
  filter_uninstallers:
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
  condition: selection and not 1 of filter_*
falsepositives:
- Creation of non-default, legitimate at usage
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications or creations of registry entries associated with Assistive Technology applications, particularly those involving the Windows `atbroker.exe` process. Attackers may leverage registry manipulation techniques as part of a strategy to achieve persistence on compromised systems while also evading detection. The likely attacker objectives include maintaining access to the system or executing malicious payloads under the guise of legitimate processes.

  The relevant MITRE ATT&CK tactics include:
  - **Persistence (T1547)**: Attackers commit registry modifications to establish persistence mechanisms.
  - **Privilege Escalation (T1218)**: The manipulation of assistive technology processes can be used to escalate privileges unbeknownst to the user or system administrators.
  - **Defense Evasion (T1070)**: By using common system processes, attackers may aim to avoid detection.

  Primary data sources for evidential support include Windows registry event logs that monitor for changes related to key paths indicative of assistive technologies.

  ### Investigation Steps
  - **Review Registry Changes**: Check Windows registry logs for any suspicious modifications or creations under the paths `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs` and `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration`.
  - **Verify Process Integrity**: Look for instances of `atbroker.exe` executing in unusual contexts, especially in conjunction with the newly created or modified registry entries.
  - **Analyze User Activity Logs**: Examine user login events around the time of the registry changes to correlate user behavior and determine if unauthorized access occurred.
  - **Check for Installation Logs**: Investigate Windows Installer logs for any MSI installations that coincide with the suspicious registry entries, as these may indicate attempts to install malicious versions of assistive technology.

  ### Prioritization
  This alert is considered medium to high severity due to the potential for an attacker to gain persistent access to systems and escalate privileges, which can lead to broader network compromise. The likelihood of such activities occurring in an enterprise environment is notable, particularly in organizations where assistive technologies are utilized.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of comprehensive logging for all registry modifications, particularly if logging configurations are not correctly set. This detection logic assumes that all modifications to the specified registry paths are malicious and does not account for legitimate changes made by authorized users or applications. Required logs for the alert to function effectively include detailed Windows registry event logs, while any insufficient logging configurations may leave areas of risk unmonitored.

