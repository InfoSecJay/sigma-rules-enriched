logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
  filter_atbroker:
    Image: 'C:\Windows\system32\atbroker.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
    Details: '(Empty)'
  filter_uninstallers:
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
  condition: selection and not 1 of filter_*
falsepositives:
- Creation of non-default, legitimate at usage
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications or creations within the Windows registry, specifically targeting entries associated with Assistive Technology applications and the Atbroker process. The likely attacker objective is to establish persistence and elevate privileges by leveraging legitimate functionalities of Windows Accessibility features, alongside evading detection mechanisms. The relevant MITRE ATT&CK tactics include **Persistence (T1547)** and **Defense Evasion (T1218)**.

  Primary telemetry sources are Windows registry events focusing on changes to specific objects like `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs`. If executed maliciously, this behavior could lead to unauthorized access or remote code execution. However, this detection alone does not confirm malicious activity, as legitimate modifications to accessibility features can trigger the same alerts.

  ---

  ### Investigation Steps

  - **Review registry changes:** Inspect the Windows registry for modifications to `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs` and `Configuration`. Compare the changes against known good configurations or recent application installs to identify benign versus potentially harmful entries.

  - **Verify Atbroker execution:** Check for the process execution of `atbroker.exe` in combination with process creation events (Security Event ID 4688 or Sysmon Event ID 1). Confirm whether the execution is associated with expected user activities or if it appears anomalously initiated.

  - **Assess installation logs:** Identify recent MSI installation entries via Windows Installer logs (Event ID 1033) to determine if legitimate applications triggering registry changes were recently installed or removed, which can explain benign behavior.

  - **Analyze user context:** Investigate the user account context under which the registry modifications occurred. Legitimate administrative or assistive technology changes typically come from user accounts with known associations to accessibility services.

  - **Identify command-line parameters:** For detected instances of atbroker.exe, examine command-line arguments for unusual options or behavior that may indicate misuse or exploitation attempts.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential for privilege escalation via legitimate system components, as well as the likelihood of abuse in targeted attacks. However, since accessibility features are sometimes necessary for users, determining context is vital for effective prioritization.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of accessibility tools that can trigger similar registry changes, creating false positives. It is essential to ensure that relevant registry auditing is enabled to reliably capture changes. Additionally, activities such as legitimate software deployments or administrative changes can also create alerts. A companion detection to consider is monitoring direct executions of accessibility-related executables to better gauge whether the registry modification aligns with known user behavior.

