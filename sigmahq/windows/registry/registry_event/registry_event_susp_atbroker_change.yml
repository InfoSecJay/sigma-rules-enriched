logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
  filter_atbroker:
    Image: 'C:\Windows\system32\atbroker.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
    Details: '(Empty)'
  filter_uninstallers:
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
  condition: selection and not 1 of filter_*
falsepositives:
- Creation of non-default, legitimate at usage
level: medium
note: |
  ### Technical Context

  This rule detects modifications or creations of registry keys associated with Assistive Technology applications, specifically around the Atbroker component. The behavior is often exploited by attackers aiming to establish persistence on a compromised system. The relevant MITRE ATT&CK tactics and techniques include Persistence (T1547) and Privilege Escalation (T1218).

  The primary telemetry sources for this detection are Windows registry event logs, particularly focusing on changes in the paths related to Accessibility. If malicious, such behavior can allow an adversary to gain persistent access and elevate privileges within a target environment. However, this detection alone does not confirm malicious intent, as modifications could also result from legitimate actions by users or system processes.

  ### Investigation Steps

  - **Verify registry changes:** Check for registry modifications at `HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs` and `HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration`. Use Event ID 4657 (Registry value modified) for timelines on when these changes occurred.

  - **Check process execution:** Look for the presence of `atbroker.exe` (located in `C:\Windows\system32\`) executing around the same time as the registry changes. Confirm this using Sysmon Event ID 1 (Process Creation) to see if it correlates with the detected registry write.

  - **Identify legitimate usage:** Document any known legitimate applications or configurations using Atbroker. Consult recent change request logs or IT asset inventories to validate if any updated assistive technology software was recently deployed.

  - **Correlate with abnormal user behavior:** Review user activities in the Security Event Log (Event ID 4624) for logins or account creation events around the same time as the registry modifications. Look for unusual login locations or times that deviate from regular access patterns.

  - **Search for uninstaller registry entries:** Investigate for the absence of expected uninstaller keys at `HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs` which could directly indicate malicious or abnormal uninstallation attempts (use Event ID 4657).

  ### Prioritization

  The alert has medium severity due to its potential to indicate persistence mechanisms that can lead to escalated access within critical systems. The likelihood of abuse is moderate, given that Atbroker modifications are less common in regular enterprise operations and may often be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may miss legitimate changes from authorized accessibility software installations, which could lead to false positives. Reliable detection requires comprehensive logging settings for registry changes on endpoints. Additionally, the presence of other persistence-related activities (e.g., startup applications or scheduled tasks) could be an essential companion detection to fully assess security posture regarding potential adversarial actions.

