logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
    - 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
  filter_atbroker:
    Image: 'C:\Windows\system32\atbroker.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration'
    Details: '(Empty)'
  filter_uninstallers:
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: 'Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs'
  condition: selection and not 1 of filter_*
falsepositives:
- Creation of non-default, legitimate at usage
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of registry keys related to Assistive Technology applications, specifically tracking changes to `atbroker.exe`, which can be used for establishing persistence in a Windows environment. The likely objective of an attacker leveraging this behavior is to exploit accessibility features to maintain persistence or execute code with elevated privileges without raising suspicion. Relevant MITRE ATT&CK techniques include **Persistence (T1547)** and **Privilege Escalation (T1218)**.

  The primary telemetry source for this detection is Windows registry event logs, particularly monitoring the `Software\Microsoft\Windows NT\CurrentVersion\Accessibility` path. If malicious, this behavior could enable unauthorized access or control over user sessions while bypassing typical security restrictions. Importantly, this detection does not confirm that the identified changes are definitely malicious; legitimate applications or system updates may trigger the same registry modifications.

  ### Investigation Steps

  - **Check recent registry changes:** Query the Windows Registry logs for Event IDs 4657 (Registry Value Modified) and 4663 (Access to an Object), focusing on the keys `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs` and `Software\Microsoft\Windows NT\CurrentVersion\Accessibility\Configuration`. Look for unusual alterations or values not publicly associated with standard AT applications.

  - **Validate atbroker.exe execution context:** Review processes associated with `atbroker.exe` through Sysmon Event ID 1 (Process Creation) for unusual parent-child relationships or unexpected command-line arguments. A legitimate context would include `C:\Windows\system32\atbroker.exe` running under standard user processes, while high-risk indicators might include execution initiated by unexpected parent processes (e.g., a command shell or scripts).

  - **Examine installed Assistive Technology applications:** Utilize PowerShell or WMIC to enumerate installed applications that modify the Accessibility registry keys. Confirm if the applications align with normal enterprise configurations and investigate any newly installed software or versions that seem out of place.

  - **Identify file manipulation via Installer logs:** Investigate MSI logs for any recent software installations or modifications, specifically targeting paths prefixed with `C:\Windows\Installer\MSI`. This can reveal whether legitimate or suspicious uninstaller activities have occurred that could correlate with the registry changes.

  - **Correlate with user behavior analytics:** Review user activity logs (e.g., Windows Event ID 4624 for logins) around the time of registry changes, identifying if the behavior aligns with authorized user actions, such as installing accessibility tools for disabled users.

  ### Prioritization

  The alert is rated medium severity due to the potential high impact of an attacker leveraging these changes for persistence or privilege escalation on critical enterprise systems. The likelihood of misuse is moderate, as techniques involving accessible technologies, like `atbroker.exe`, are commonly utilized in evasion tactics and may present a legitimate use case under certain conditions.

  ### Blind Spots and Assumptions

  This detection may miss legitimate usage of accessibility tools utilized by authorized personnel, leading to potential false positives. Evasion could occur through attempts to change these registry settings without logging or through the alteration of parent processes to appear benign. Reliable detection depends on complete logging of registry changes and ensuring all user actions are adequately captured. A companion detection to consider is monitoring for anomalous process creation patterns associated with accessibility executables, helping to provide context for any identified registry changes.

