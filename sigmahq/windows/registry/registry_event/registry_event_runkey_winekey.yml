  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows Registry, specifically targeting the "Run" key associated with "Backup Mgr." This behavior typically indicates an attacker aiming to maintain persistence on a compromised system, allowing malicious programs to execute automatically when the system boots. The relevant MITRE ATT&CK tactics are **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, specifically technique **T1547** (Boot or Logon Autostart Execution).

  The primary telemetry source is Windows Registry Event logs, which capture changes to the Registry. If malicious, this can lead to persistent access by an adversary, enabling further exploitation of the system and possibly lateral movement. Importantly, while this detection highlights potentially malicious activity, it does NOT confirm the intent or effectiveness of the change without further investigation.

  ### Investigation Steps

  - **Review the event logs for Registry modification:** Check for Registry Event ID 4657 indicating modification at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run\Backup Mgr`. Legitimate user-initiated values will usually originate from administrative user activities.

  - **Correlate with process creation logs:** Look for Security Event ID 4688 or Sysmon Event ID 1 following the Registry modification. Confirm whether a corresponding process was executed as expected, particularly looking for unexpected executable paths or command-line arguments.

  - **Analyze user context:** Verify the user account context that made the modification. Security Event ID 4624 can help identify the logon type and user account, ensuring it aligns with expected administrative actions. Benign modifications should typically be made by known administrative accounts.

  - **Check for other indicators of compromise:** Investigate for other Registry autostart locations commonly manipulated (e.g., `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run`). Malicious entries often exhibit unusual names or point to non-standard file paths.

  - **Verify impacted system's criticality:** Determine the role of the affected system (e.g., server, client machine) to assess the potential impact of persistence. Critical systems require immediate remediation and isolation measures if malicious activity is confirmed.

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact on system integrity and security. The likelihood of this behavior being exploited by adversaries is moderate to high, especially given its association with persistence techniques commonly used by malware and backdoors.

  ### Blind Spots and Assumptions

  Evasion techniques such as using legitimate administrative tools to create or modify Registry values can obscure detection efforts. Reliable detection requires proper configuration and logging of Registry events; missing or misconfigured logs may lead to undetected modifications. Additionally, legitimate software installations can occasionally trigger this alert, especially in enterprise environments where automated deployment tools are utilized. Companion detections such as monitoring for unusual process creation linked to these Registry modifications can enhance coverage.

