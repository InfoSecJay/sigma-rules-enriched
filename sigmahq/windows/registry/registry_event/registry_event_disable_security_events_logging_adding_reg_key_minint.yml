detection:
  selection:
    # Sysmon gives us HKLM\SYSTEM\CurrentControlSet\.. if ControlSetXX is the selected one
  - TargetObject: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
    EventType: 'CreateKey'          # we don't want deletekey
    # key rename
  - NewName: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation or renaming of a registry key named 'MiniNt' under `HKLM\SYSTEM\CurrentControlSet\Control`, which is indicative of an attempt to disable Windows Event Logging. The attacker's objective is to avoid detection by preventing Windows from writing security events to the Event Log, covering their tracks during malicious activity. This behavior aligns with MITRE ATT&CK techniques for persistence (T1547) and defense evasion (T1562.001).

  The primary telemetry source for this detection is Windows Registry Event logs, specifically monitoring for Event IDs that indicate registry key creation or renaming activities. If this activity is indeed malicious, it significantly undermines the organization's ability to detect unauthorized activities and compromises overall security posture. However, it is important to note that the detection of this registry modification does not confirm that an attack is in progress; it merely indicates a change that could be leveraged for malicious purposes.

  ### Investigation Steps

  - **Verify registry modification:** Check for the creation of the key 'MiniNt' in the registry. Use `reg query HKLM\SYSTEM\CurrentControlSet\Control\MiniNt` to confirm its presence.

  - **Review registry event logs:** Analyze Windows Event Log for Security Event ID 4657 (Registry Value Set) related to `HKLM\SYSTEM\CurrentControlSet\Control`. Malicious indicators may include the absence of legitimate administrative activity preceding this entry.

  - **Compare expected activity:** Identify and document standard registry modifications performed by system management tools and software. Compare timestamps of the creation of 'MiniNt' against these known activities to assess legitimacy.

  - **Check for other defense evasion techniques:** Review for additional suspicious registry keys, such as other modifications under `HKLM\SYSTEM\CurrentControlSet\Control`, using Sysmon Event ID 13 (Registry Manipulation) for a broader context of possible evasion tactics.

  - **Analyze affected systems:** Determine if the affected system holds critical assets (e.g., domain controllers, file servers). If so, escalate the findings for immediate remediation steps.

  ### Prioritization

  This alert has high severity due to the critical nature of event logging in security monitoring frameworks. The likelihood of abuse is significant as disabling logging is a common tactic among attackers. This behavior is often weaponized as part of broader attack frameworks aimed at persistence and maintaining stealth.

  ### Blind Spots and Assumptions

  Detection may be limited if registry logging is not properly configured or if other user permissions prevent visibility into these changes. Legitimate applications or administrative scripts may occasionally trigger this alert when adjusting registry settings. Related detections to strengthen coverage include monitoring for suspicious process creation events (e.g., Sysmon Event ID 1) tied to processes that might modify critical system settings or other registry changes associated with defense evasion.

