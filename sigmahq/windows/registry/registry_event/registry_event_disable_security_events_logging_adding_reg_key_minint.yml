detection:
  selection:
    # Sysmon gives us HKLM\SYSTEM\CurrentControlSet\.. if ControlSetXX is the selected one
  - TargetObject: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
    EventType: 'CreateKey'          # we don't want deletekey
    # key rename
  - NewName: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the addition of a registry key called 'MiniNt' within the Windows operating system, which is a tactic often used by attackers to disable logging mechanisms. When this particular key is added, it signals that the Windows Event Log service will stop writing events upon reboot, effectively hiding malicious activity. This can indicate an attempt by an adversary to cover their tracks or reduce visibility into the server’s operations, thus making it easier for them to maintain persistence within the environment.

  The relevant MITRE ATT&CK techniques associated with this detection are T1562.002 (Impair Defenses: Disable or Modify Tools) and T1112 (Modification of Registry). Both techniques highlight the methods employed by attackers to undermine security defenses and diminish the capability of defenders to detect suspicious or malicious activities.

  The primary data source for this alert is Windows registry event logs, specifically those logs generated by Sysmon that document changes to registry keys. Monitoring and analyzing registry modifications can provide crucial insights into potential evasions being attempted by threat actors.

  ### Investigation Steps
  - **Review Registry Access Logs:** Examine Windows registry event logs for entries related to changes in the 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt' key. Look for the EventType: 'CreateKey', which indicates the key was added.

  - **Correlate with Process Activity:** Investigate the associated process activity around the same time the registry key was added. This can help identify if suspicious processes initiated the change.

  - **Analyze System Restart Events:** Check for any system reboot events post the addition of the 'MiniNt' key. This can confirm if logging has been disabled as a result of the registry modification.

  - **Look for Additional Registry Modifications:** Expand your search to other related registry keys that may also indicate attempts to evade detection or modify security settings.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the impact of disabling event logging, which significantly increases the risk of undetected malicious activities and leaves security teams blind to potential breaches.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly if the Sysmon logging or the registry auditing is not properly configured or if relevant Windows Update patches are not applied. The detection logic assumes that the Sysmon agent is actively monitoring and logging registry changes. If the agent is disabled or logs are not retained for sufficient time, this alert may not trigger effectively. Proper configurations and adequate logging levels are essential for the alert's success.

