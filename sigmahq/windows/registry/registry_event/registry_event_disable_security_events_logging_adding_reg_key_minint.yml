detection:
  selection:
    # Sysmon gives us HKLM\SYSTEM\CurrentControlSet\.. if ControlSetXX is the selected one
  - TargetObject: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
    EventType: 'CreateKey'          # we don't want deletekey
    # key rename
  - NewName: 'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a registry key named "MiniNt" under the path `HKLM\SYSTEM\CurrentControlSet\Control`, which enables a mechanism for disabling the Windows Event Log service. This behavior indicates an adversary’s objective to cover their tracks and avoid detection while maintaining persistence within the environment. This activity aligns with the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1562.002) and can also be associated with **Persistence** (ID: T1112).

  The primary telemetry source for this detection is Windows registry events, particularly focused on events triggered by the creation or renaming of registry keys. If malicious, this activity poses a significant security risk by allowing the adversary to operate undetected, thereby leading to potential data breaches or further exploitation. It is important to note that this detection does NOT confirm an active compromise on its own; legitimate applications or configurations may also trigger similar registry modifications.

  ### Investigation Steps

  - **Review the registry path and changes:** Validate whether the registry key `HKLM\SYSTEM\CurrentControlSet\Control\MiniNt` was indeed created by checking registry modification logs (Event ID 4657 in Windows Security logs). A legitimate cause may involve system or application updates that do not modify this key.

  - **Check recent user activity:** Look at the user accounts that initiated the event (Security Event ID 4663). Identify whether the activity originated from an administrative account. Legitimate administrative changes are expected under certain conditions (e.g., patch updates).

  - **Correlate with Sysmon Event IDs:** Use Sysmon logs to check for Event ID 13 (RegistryEvent). This will help confirm if there were other simultaneous suspicious registry activities, which could point to broader malicious behavior.

  - **Identify any associated process creation:** Cross-check the logs with Event ID 4688 (Process Creation) to identify any executables initiated around the same time as the registry modification. Look for known malicious executables or unusual command-line arguments that may indicate exploitation.

  - **Assess system trustworthiness:** Evaluate the system's role and criticality within the enterprise. Systems with high connectivity to sensitive data or critical infrastructure require immediate attention following this alert.

  - **Investigate for known malware:** Conduct a search for signatures or behavior associated with known malware that utilizes registry modifications for persistence. Begin with reviewing any related IntelliScan tools or antivirus alerts.

  ### Prioritization

  The severity of this alert is high because it involves potential tampering with Windows event logging capabilities, a common tactic used by adversaries to stealthily maintain persistence. The likelihood of malicious abuse is significant, given that similar techniques have been historically weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations may arise in scenarios where legitimate applications also attempt to modify the registry without logging activity, or when the rule is not applied uniformly across all endpoints. The required log sources for reliable detection include security event logs and Sysmon registry events; any misconfiguration may lead to missed detections. Legitimate activities, such as certain administrative actions or system patches, might also reasonably trigger this alert. A companion detection to strengthen coverage could focus on monitoring the integrity of important registry keys related to logging and audit processes.

