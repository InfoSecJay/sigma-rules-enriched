note: |
  ### Technical Context

  This rule detects the addition of a Security Support Provider (SSP) to the Windows registry, specifically targeting entries in `\Control\Lsa\Security Packages` and `\Control\Lsa\OSConfig\Security Packages`. The likely attacker objective is to enable malicious access to encrypted and plaintext passwords stored in the Windows Local Security Authority (LSA), which could facilitate privilege escalation or lateral movement within the environment. This behavior is associated with the MITRE ATT&CK framework under the Persistence tactic, specifically technique T1547.005 (Registry Run Keys / Startup Folder).

  The primary telemetry source is the Windows Registry, and relevant log types include registry event logs that capture changes made to these critical keys. If malicious, the security impact can be significant, potentially leading to full system compromise through credential extraction. However, it’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify LSA configurations for valid purposes.

  ### Investigation Steps

  - **Identify the Registry Change:**
    Review Windows Registry Event Logs (Event ID 4657) for changes to `HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\LSA\Security Packages`. Confirm the addition of any SSPs not recognized as part of standard system behavior.

  - **Check the Associated Process:**
    Analyze the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) around the time of the registry change for indications that `msiexec.exe` or similar installers were executed. Investigate whether these processes are executing scripts or modules related to suspicious behavior.

  - **Investigate the Anomalous SSP:**
    Cross-reference the added SSPs against known legitimate providers. Use documentation from trusted sources to validate whether the names of the SSPs are recognized or if they suggest malicious intent.

  - **Evaluate System Criticality:**
    Assess the role of the affected host; if it’s a Domain Controller or a sensitive server, prioritize the investigation due to the criticality of the assets involved. Explore for signs of elevated privileges or lateral movement attempts.

  - **Look for User Behavior:**
    Check user and administrative activity logs for any unusual access patterns or permissions escalations coinciding with the registry change event, indicating possible exploitation of the SSP.

  - **Identify Malicious File Indicators:**
    Monitor for creation of suspicious DLLs in the `C:\Windows\System32` or `C:\Windows\SysWow64` directories that align with known malicious SSPs or abnormal activities, such as unexpected file execution or access anomalies.

  ### Prioritization

  The alert severity is high due to the potential for significant impact on system confidentiality and integrity, especially if the host is critical or administrative. The likelihood of malicious abuse is high, as the addition of unrecognized SSPs is a known tactic used by adversaries to facilitate credential dumping and maintain persistence in an environment.

  ### Blind Spots and Assumptions

  Some detection limitations include potential evasion techniques where an attacker may modify registry keys without raising alerts or utilize valid administrator behavior to avoid detection. Reliable detection requires comprehensive logging of registry events and real-time monitoring configurations. Legitimate activities that may inadvertently trigger this alert include authorized software installations that modify SSPs as part of their functionality. Related detections, such as monitoring for suspicious new services or scheduled tasks (e.g., T1050 - New Service), can help provide additional context around suspicious activity within the environment.

