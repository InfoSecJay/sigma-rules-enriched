note: |
  ### Technical Context

  This Sigma rule detects the addition of a Security Support Provider (SSP) to the Windows registry, specifically under `\Control\Lsa\Security Packages`. The detection targets potential modifications made by attackers aiming to gain access to sensitive information, such as plaintext and encrypted passwords stored within Windows, thereby escalating privileges and maintaining persistence. This behavior falls under the MITRE ATT&CK tactics of Privilege Escalation (Tactic ID: TA0004) and Persistence (Tactic ID: TA0003), with the technique being T1547.005: Registry Run Keys / Startup Folder.

  The primary telemetry source is Windows Registry Event logs. Successful exploitation can lead to significant security risks as attackers can leverage SSPs to siphon confidential user credentials. It is important to note that this detection alone does not confirm malicious intent or successful exploitation; further investigation is necessary to contextualize this behavior.

  ### Investigation Steps

  - **Check for Unauthorized SSP Entry:** Review Windows Registry logs for new entries under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI\SecurityPackages`. Look for entries that do not align with known and expected SSPs.

  - **Validate SSP Legitimacy:** Compare newly added SSPs against a baseline of known, legitimate providers commonly found in environments, such as "Negotiate," "NTLM," or "Kerberos." If an unknown DLL is registered, escalate as potentially malicious.

  - **Examine Process Creation Events:** Review Security Event ID 4688 for process creation logs related to `msiexec.exe` before the SSP addition. Focus on command lines indicative of unusual installer behavior (e.g., unexpected parameters or invocation by non-administrative accounts).

  - **Identify Potential Abuse:** Check for login behavior associated with the added SSP, particularly focusing on Event IDs 4624 (Logon) and 4625 (Logon Failure). Multiple failed logon attempts or logins from unusual accounts may indicate exploitation.

  - **Correlate with EDR Data:** If using an EDR solution, look for alerts or logs indicating abnormal process behavior from `lsass.exe`, including attempts to access secure Windows data or API calls made to manage security packages.

  - **Investigate System Asset Role:** Determine the role of the system where the SSP was added. Servers or workstations with critical functions (e.g., domain controllers) are high-risk targets for this type of persistence mechanism and should be prioritized for remediation.

  ### Prioritization

  This alert should be considered high severity due to the potential for unauthorized access to sensitive credentials and the impact on system confidentiality. The likelihood of exploitation is significant, as malicious actors actively target the LSA for persistence and privilege escalation. Such behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by missing log sources if registry monitoring is not fully enabled or configured correctly. Legitimate administrative actions, such as software installation or updates that modify SSPs, can also trigger this alert. A companion detection to consider is monitoring for unauthorized changes to LSA configuration settings, which can provide additional context for any SSP modifications.

