logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|endswith:
    - '\Control\Lsa\Security Packages'
    - '\Control\Lsa\OSConfig\Security Packages'
  filter_main_msiexec:
    Image:
    - 'C:\Windows\system32\msiexec.exe'
    - 'C:\Windows\syswow64\MsiExec.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the addition of a Security Support Provider (SSP) to the Windows registry, specifically under the keys that manage Security Packages. Malicious actors may use this technique to install SSP DLLs, which can subsequently access sensitive information, including both encrypted and plaintext passwords stored in the Local Security Authority (LSA). The primary objective for an attacker utilizing this method is privilege escalation, enabling further unauthorized access within the compromised system or network.

  The rule aligns with the MITRE ATT&CK tactics related to **Persistence** (T1547.005), where adversaries maintain access through various techniques, and **Privilege Escalation** (T1068), allowing attackers to elevate their privileges after gaining initial access. The primary data source for this detection will be registry event logs that capture modifications made to the LSA key.

  ### Investigation Steps
  - **Review Registry Logs**: Examine registry event logs specifically for changes to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\Credential Providers` and `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\Security Packages` keys to confirm unauthorized SSP installations.

  - **Inspect Process Creation Events**: Investigate process creation logs for execution of `msiexec.exe` or other installation processes around the time of the registry modification, which may indicate potential malicious activity.

  - **Evaluate Security Packages**: Cross-reference the newly added SSPs with known legitimate providers to identify any anomalies or unrecognized entries that could signal compromise.

  - **Monitor Accounts with Elevated Privileges**: Check for anomalous usage patterns or account activity from users who have been granted elevated privileges post-SSP addition, as this could indicate exploitation of the installed provider.

  ### Prioritization
  The high severity of this alert stems from the potential for significant impact if an attacker successfully exploits an added SSP to capture sensitive credentials, facilitating further attacks within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where attackers use legitimate processes or benign registry changes to obscure their actions. Additionally, the logic assumes that any addition to the identified registry keys is malevolent, which may not always be the case. Proper logging of registry events is crucial for this alert to function effectively; without comprehensive logging in place or if certain legitimate changes are made without proper documentation, this alert may lead to false positives or missed detections.

