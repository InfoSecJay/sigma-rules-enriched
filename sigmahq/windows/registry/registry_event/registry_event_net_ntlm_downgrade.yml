title: NetNTLM Downgrade Attack - Registry
id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
status: test
description: Detects NetNTLM downgrade attack
references:
- https://web.archive.org/web/20171113231705/https://www.optiv.com/blog/post-exploitation-using-netntlm-downgrade-attacks
- https://www.ultimatewindowssecurity.com/wiki/page.aspx?spid=NSrpcservers
author: Florian Roth (Nextron Systems), wagga, Nasreddine Bencherchali (Splunk 
  STRT)
date: 2018-03-20
modified: 2024-12-03
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1685
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection_regkey:
    TargetObject|contains|all:
    - 'SYSTEM\'
    - 'ControlSet'
    - '\Control\Lsa'
  selection_value_lmcompatibilitylevel:
    TargetObject|endswith: '\lmcompatibilitylevel'
    Details:
    - 'DWORD (0x00000000)'
    - 'DWORD (0x00000001)'
    - 'DWORD (0x00000002)'
  selection_value_ntlmminclientsec:
    TargetObject|endswith: '\NtlmMinClientSec'
    Details:
    - 'DWORD (0x00000000)'         # No Security
    - 'DWORD (0x00000010)'         # Only Integrity
    - 'DWORD (0x00000020)'         # Only confidentiality
    - 'DWORD (0x00000030)'         # Both Integrity and confidentiality
  selection_value_restrictsendingntlmtraffic:
        # Note: The obvious values with issues are 0x00000000 (allow all) and 0x00000001 (audit).
        # 0x00000002 can be secure but only if "ClientAllowedNTLMServers" is properly configured
        # Hence all values should be monitored and investigated
    TargetObject|endswith: '\RestrictSendingNTLMTraffic'
  condition: selection_regkey and 1 of selection_value_*
falsepositives:
- Services or tools that set the values to more restrictive values
level: high
note: |
  ### Technical Context

  This Sigma rule detects configurations related to NetNTLM downgrade attacks, specifically changes to registry entries that could lower security settings for NTLM authentication in a Windows environment. The likely attacker objective is to weaken security protections to facilitate unauthorized access or credential capture. This behavior aligns with MITRE ATT&CK techniques such as **Exploitation for Client Execution (T1112)** and **System Information Discovery (T1685)**. The primary telemetry sources are Windows Registry event logs that capture modifications to keys related to security settings, specifically those under the `SYSTEM\ControlSet\Control\Lsa` path.

  If malicious, the security impact includes increased vulnerability to credential theft and exploitation of NTLM weaknesses. However, this detection does NOT confirm that a compromise has occurred; it only indicates a potential change in security posture that warrants further investigation.

  ### Investigation Steps

  - **Verify Registry Key Changes:** Review Windows Registry logs for modifications to the `HKEY_LOCAL_MACHINE\SYSTEM\ControlSet\Control\Lsa` path (Event ID 619 from the Security log or Sysmon Event ID 13 for registry changes) to confirm unauthorized alterations.

  - **Identify Specific Value Changes:** Check for values set to `DWORD (0x00000000)` or `DWORD (0x00000001)` for `lmcompatibilitylevel` and `NtlmMinClientSec`, which weaken NTLM security (focus on Event ID 619 for these fields).

  - **Cross-reference with Authorized Changes:** Determine if any legitimate applications, such as specific security tools or updates, are known to modify these registry settings. Look for corresponding timestamps in application logs.

  - **Monitor for Network Traffic Patterns:** Investigate traffic patterns and NTLM authentication requests (Windows Event ID 4624) to confirm potential exploitation, looking for high volumes or anomalous sources post-registry change.

  - **Check for High-Confidence Indicators:** Identify if any subsequent events were logged that indicate NTLM authentication failures or spikes in authentication attempts from abnormal sources after changes were made.

  ### Prioritization

  This alert is high severity due to the critical nature of the affected systems and the high likelihood of malicious abuse of weakened NTLM settings. Such configuration changes are often weaponized in attacks, making them a prime target for adversaries seeking to exploit authentication mechanisms.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate software that may alter these registry settings without malicious intent, such as group policy updates or system management tools. Continuous logging of registry changes must be ensured for reliable detection. Legitimate operations, such as software installations or system updates, could inadvertently trigger this alert. A related detection to reinforce coverage would be monitoring for unusual NTLM authentication activity or failed logins associated with these changes.

