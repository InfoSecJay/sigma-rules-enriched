title: NetNTLM Downgrade Attack - Registry
id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
status: test
description: Detects NetNTLM downgrade attack
references:
- https://web.archive.org/web/20171113231705/https://www.optiv.com/blog/post-exploitation-using-netntlm-downgrade-attacks
- https://www.ultimatewindowssecurity.com/wiki/page.aspx?spid=NSrpcservers
author: Florian Roth (Nextron Systems), wagga, Nasreddine Bencherchali (Splunk 
  STRT)
date: 2018-03-20
modified: 2024-12-03
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1562.001
- attack.t1112
logsource:
  product: windows
  category: registry_event
detection:
  selection_regkey:
    TargetObject|contains|all:
    - 'SYSTEM\'
    - 'ControlSet'
    - '\Control\Lsa'
  selection_value_lmcompatibilitylevel:
    TargetObject|endswith: '\lmcompatibilitylevel'
    Details:
    - 'DWORD (0x00000000)'
    - 'DWORD (0x00000001)'
    - 'DWORD (0x00000002)'
  selection_value_ntlmminclientsec:
    TargetObject|endswith: '\NtlmMinClientSec'
    Details:
    - 'DWORD (0x00000000)'         # No Security
    - 'DWORD (0x00000010)'         # Only Integrity
    - 'DWORD (0x00000020)'         # Only confidentiality
    - 'DWORD (0x00000030)'         # Both Integrity and confidentiality
  selection_value_restrictsendingntlmtraffic:
        # Note: The obvious values with issues are 0x00000000 (allow all) and 0x00000001 (audit).
        # 0x00000002 can be secure but only if "ClientAllowedNTLMServers" is properly configured
        # Hence all values should be monitored and investigated
    TargetObject|endswith: '\RestrictSendingNTLMTraffic'
  condition: selection_regkey and 1 of selection_value_*
falsepositives:
- Services or tools that set the values to more restrictive values
level: high
note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry that indicate a NetNTLM downgrade attack. Such an attack aims to weaken NTLM authentication security by downgrading the security levels set within the registry settings, potentially allowing criminals to exploit legacy authentication mechanisms. Relevant MITRE ATT&CK techniques include T1562.001 (Impair Defense: Disable or Modify Tools) and T1112 (Modify Registry).

  Primary telemetry sources for this detection include Windows Registry Event logs, specifically focusing on changes made to `HKEY_LOCAL_MACHINE\SYSTEM\ControlSet\Services\LanmanServer\Parameters`. If successful, an attacker may gain the ability to authenticate using weaker credentials, thereby compromising sensitive resources. This detection does not prove that an attack has occurred; it merely indicates that configuration changes have been made that could facilitate such an attack.

  ### Investigation Steps

  - **Verify registry changes: ** Check the Windows Registry for key values under `HKEY_LOCAL_MACHINE\SYSTEM\ControlSet\Services\LanmanServer\Parameters` for any suspicious modifications. Review Event ID 4663 (an attempt to access an object) to correlate changes with user accounts or services responsible.

  - **Analyze current NTLM settings: ** Inspect the values for `lmcompatibilitylevel` and `NtlmMinClientSec`. Legitimate settings typically include `DWORD (0x00000005)` for `lmcompatibilitylevel` (Send NTLMv2 response only) and values indicating secure client/ server security compatibility for `NtlmMinClientSec`.

  - **Investigate service accounts: ** Review the associated user or account that made changes. Use Security Event ID 4672 (Special privileges assigned to new logon) to identify if elevated privileges were leveraged to make the registry changes.

  - **Identify previous configurations: ** Compare current registry settings to historical log entries or baselines. This can be done using Sysmon (Event ID 13) logs to identify whether similar values were present prior to the changes.

  - **Correlate with NTLM traffic: ** Monitor network traffic for NTLM authentication requests using tools like Wireshark. Look for signs of traffic from machines using downgraded security protocols after registry changes were detected, particularly connections that should utilize NTLMv2 or Kerberos.

  - **Evaluate potential false positives: ** Assess whether any administration tools or system hardening measures executed legitimate changes to the LM and NTLM parameters to enforce stricter settings. Note the timing and context of changes related to deployments or security policy updates.

  ### Prioritization

  This alert is of high severity due to its potential impact on the integrity of Windows authentication protocols, allowing attackers to sidestep security controls. The likelihood of malicious exploitation through outdated NTLM settings is significant, especially in environments with outdated configurations. Such behaviors are often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, as attackers may revert changes quickly or employ scripts to modify registry values stealthily. Furthermore, legitimate administrative actions—such as system updates or policy changes—could trigger this alert inadvertently. Ensure that auditing of registry changes is enabled to capture all relevant activity. A companion detection to strengthen coverage could include monitoring for authentication failures paired with NTLM traffic analysis (TLM-specific traffic).

