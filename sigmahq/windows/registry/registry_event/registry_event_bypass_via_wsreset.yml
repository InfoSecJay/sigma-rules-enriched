  ### Technical Context

  This Sigma rule detects a method for bypassing User Account Control (UAC) on Windows 10 systems using the WSReset.exe utility. The likely objective of an attacker is to escalate privileges without triggering UAC prompts, potentially allowing unauthorized access to sensitive resources. The relevant MITRE ATT&CK technique is "Bypass User Account Control" (T1548.002). Primary telemetry sources include Windows Registry events, specifically monitoring changes to command execution paths associated with WSReset. If malicious, this behavior could enable escalation of privileges and execution of arbitrary code with elevated permissions. It is important to note that this detection alone does not confirm malicious intent, as legitimate applications may also modify registry entries.

  ### Investigation Steps

  - **Assess Registry Changes:** Investigate Registry Event IDs related to the target object path: look for Event ID 4657 (registry value modified) focusing on the command associated with 'AppX82a6gwre4fdg3bt...' to identify potential abuse.

  - **Cross-reference WSReset Execution:** Check for any executions of WSReset.exe via Process Creation logs (Event ID 4688) around the same time. Look for parent-child process relationships indicating suspicious invocation paths.

  - **Validate Legitimate Usage Patterns:** Identify expected valid usage of WSReset.exe: typically invoked by Windows Store updates or system maintenance tasks, running under normal user account privileges without UAC bypass.

  - **Monitor for Anomalous Parent Processes:** Review Process Tree structures to identify irregular parent processes for WSReset.exe, such as those initiated by scripts or executables that are not typical for system maintenance (e.g., PowerShell or cmd.exe).

  - **Correlate with Other Indicators:** Search for related indicators of compromise (IoCs): review Security Event IDs 4624 (logon events) and 4672 (special privileges assigned) to analyze suspicious account activity that coincides with the UAC bypass attempts.

  ### Prioritization

  This alert should be treated as high severity due to the potential for privilege escalation on affected systems, which can lead to serious breaches of security. The likelihood of these methods being weaponized in the wild, especially by sophisticated threat actors, warrants prompt investigation.

  ### Blind Spots and Assumptions

  Possible evasion techniques may include legitimate users modifying the registry for valid reasons. Detection relies on complete and accurate Registry Event logs, and any gaps in logging configurations can hinder detection effectiveness. Additionally, legitimate software that also uses WSReset may trigger false positives. Companion detections, such as monitoring for unusual command line arguments in conjunction with regular use of WSReset, can help validate the context of the activity.

