  ---

  ### Technical Context

  This Sigma rule detects potential User Account Control (UAC) bypass attempts via the misuse of the `Wsreset.exe` utility, specifically targeting a registry key associated with the Windows Store application. The likely objective of an attacker utilizing this technique is to escalate privileges while evading security controls, allowing them to execute commands with elevated privileges under the illusion of a benign application process. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique for Privilege Escalation via UAC Bypass (T1548.002).

  The primary telemetry source is Windows Registry event logs, focusing on modifications related to the specified command path. If malicious, this detection could indicate a significant security risk, as it allows unauthorized elevation of privileges. However, this detection does NOT confirm actual exploitation or malicious intent without corroborating evidence.

  ---

  ### Investigation Steps

  - **Check Registry Modifications**: Review Windows Registry changes for Event ID 4657 indicating a modification to keys under `HKEY_CLASSES_ROOT\Local Settings\Software\Microsoft\Windows\CurrentVersion\AppContainer\Packages\` and validate if the associated command points to `Wsreset.exe` with the undesirable behavior.

  - **Review Process Creation Events**: Investigate Security Event ID 4688 for instances where `Wsreset.exe` is executed alongside any command-line parameters that may indicate misuse, such as launching another executable or script.

  - **Identify Known Bad Artifact**: Look for the presence of Event ID 4663, specifically targeting attempts to access `\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\Shell\open\command`. Cases where the ‘Access Mask’ indicates "Execute" are a strong indicator of malicious intent.

  - **Analyze Typical Legitimate Usage**: Confirm expected functionality of `Wsreset.exe` as typically invoked with no additional parameters, primarily showcasing system maintenance activities like resetting Windows Store caches.

  - **Assess Host Role**: Understand the criticality of the device the alert triggered on and any potential impact if compromised. For example, servers hosting sensitive applications warrant higher investigation urgency.

  - **Correlate Network Traffic**: Review any outbound connections made by ‘Wsreset.exe’ processes for unusual network activity or attempts to contact external domains, which may suggest automated post-exploitation behavior.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential for privilege escalation on critical systems within the enterprise. The likelihood of malicious abuse is marked, as UAC bypass techniques are often weaponized in a variety of attack vectors, including ransomware and data exfiltration campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging for all registry activity, failing to capture all instances of misuse. Legitimate system maintenance or updates to the Windows Store might trigger similar logs and generate false positives. Companion detections that can enhance coverage include monitoring for unauthorized instances of other application evasion techniques, such as alterations to UAC settings (T1548.001) or monitoring for suspicious script execution following process creation events.

