note: |
  ### Technical Context

  This detection identifies attempts to bypass User Account Control (UAC) using the `Wsreset.exe` utility on Windows 10 systems. The technique exploits a low-privilege registry entry to execute commands without the user's knowledge, potentially allowing an attacker to escalate privileges or run malicious code stealthily. This behavior aligns with the MITRE ATT&CK Tactic "Privilege Escalation" (ID: TA0004) and the specific Technique "Bypass User Account Control" (ID: T1548.002).

  The primary telemetry source for this detection is the Windows Registry event logs, specifically tracking modifications to signs of the `Wsreset.exe` execution. If malicious, this behavior can lead to unauthorized actions on critical enterprise systems. Importantly, this detection does not confirm that a breach has occurred by itself; legitimate use of this utility may also trigger the alert.

  ### Investigation Steps

  - **Verify the execution path**: Check for Event ID 4657 (Registry Value Modified) or Event ID 4663 (An object was accessed) targeting the path `\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\Shell\open\command`. Determine if the command launched is unusual for typical operational activities.

  - **Assess associated processes**: Review the process tree leading to the `Wsreset.exe` execution using Sysmon Event ID 1 (Process Created). Look for indications of parent-child relationships that should not occur in normal operations (e.g., unexpected parent processes launching `Wsreset.exe`).

  - **Identify benign use cases**: Validate if the `Wsreset.exe` was executed as part of standard application support. Note that legitimate use typically involves Windows Store operations and can include user interaction, such as a user troubleshooting the Windows Store.

  - **Collect user context**: Investigate applicable user accounts for irregular activity around the time of the alert. Check for abnormal logon patterns (Event ID 4624) or failed attempts (Event ID 4625) that could indicate misuse or account compromise.

  - **Review related log artifacts**: Look for signs of additional malicious activity such as file creation under the `C:\ProgramData\Microsoft\Windows\AppRepository` path or suspicious child processes spawned from `Wsreset.exe`. Event ID 4663 can be used to confirm file access or changes made to sensitive directories.

  ### Prioritization

  This alert should be treated with high severity, particularly on endpoints where sensitive applications are stored. The likelihood of exploitation is increased, as techniques for UAC bypass are commonly weaponized. Affected systems with elevated privileges are particularly critical and vulnerable.

  ### Blind Spots and Assumptions

  Detection may miss legitimate usage scenarios where administrative users access the Windows Store and run `Wsreset.exe` for maintenance. It is crucial to configure logging for registry events correctly to ensure reliable detection. Additionally, applications that utilize standard methods for resetting app states may inadvertently trigger similar alerts. A companion detection to consider includes monitoring for unusual account activity within the security logs (Event IDs 4624 and 4625) to strengthen overall detection coverage.

