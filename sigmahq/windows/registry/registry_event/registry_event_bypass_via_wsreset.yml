  ### Technical Context
  This detection rule is designed to identify a specific method of User Account Control (UAC) bypass using `Wsreset.exe`, particularly in the context of Windows 10. The rule targets a low-privilege registry key that, when manipulated, can execute commands or applications with escalated permissions without triggering UAC prompts. Attackers exploit this technique to silently run malicious payloads, aiming to gain unauthorized access or elevate their privileges on a compromised system.

  The suspected threat family includes variants of malware that utilize UAC bypassing techniques, such as TrickBot. The MITRE ATT&CK framework identifies this behavior under the tactics of **Defense Evasion** and **Privilege Escalation**, specifically using technique **T1548.002: Abuse Elevation Control Mechanism: Bypass User Account Control**.

  The primary source of telemetry that will capture this behavior is registry event logs that track access and modifications to UAC-related registry keys. Monitoring these logs can provide insights into unexpected command executions and potentially malicious activity.

  ### Investigation Steps
  - **Review Registry Event Logs**: Check registry event logs for access or modifications to the keys associated with `Wsreset.exe`. Look specifically for the key path `\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\Shell\open\command` to identify any unauthorized changes or executions.

  - **Analyze Process Creation Events**: Examine process creation logs to determine if `Wsreset.exe` was invoked in combination with any suspicious or unexpected parent processes. This can indicate an attempt to execute malicious payloads through UAC bypass.

  - **Investigate Associated Network Traffic**: Look at network logs for any unusual outbound connections initiated just after the execution of `Wsreset.exe`. This could point to command and control communications or data exfiltration related to the UAC bypass attempt.

  - **Check System Logs for UAC Prompts**: Search the security logs to verify if there were any UAC prompts following the execution of `Wsreset.exe`. A lack of expected prompts can reveal a successful bypass.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to exploit UAC bypass mechanisms to gain elevated privileges and execute malicious operations discreetly. Given the impact of privilege escalation in enterprise environments, prompt investigation and remediation actions are crucial.

  ### Blind Spots and Assumptions
  One potential gap in this detection is the reliance on the specific key path for accurate detection, which means any changes to application deployment or configurations could hinder its effectiveness. The alert assumes that logs for registry events are enabled and adequately retained for analysis. Additionally, if the attacker has implemented further obfuscation techniques, such as renaming the executable or employing additional methods to mask malicious activities, the rule may not trigger. Required log configurations include enabling detailed registry event logging to ensure comprehensive coverage of these potential UAC bypass activities.

