note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious RUN keys in critical Windows registry locations, specifically targeting files located in user directories such as Downloads and temporary Internet/Outlook files. The likely objective of an attacker is to establish persistence on a compromised system, ensuring their malicious payload executes whenever the system restarts or a user logs in. The relevant MITRE ATT&CK tactics are Persistence (T1547.001).

  Primary telemetry sources include Windows registry event logs, particularly monitoring actions related to the creation or modification of registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. If malicious, this behavior can lead to unauthorized application execution, data exfiltration, or additional attacks. Importantly, this detection does NOT confirm active compromise on its own; legitimate applications may correspond with similar behavior.

  ### Investigation Steps

  - **Check registry modification details:** Review Windows registry event logs (Event ID 4657) for modifications to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Look for associated user accounts and timestamps, focusing on entries referencing the monitored directories.

  - **Examine command line parameters:** Cross-reference detected processes (Event ID 4688) with command line parameters for signs of abuse. Evaluate whether the command aligns with normal user activities or if it appears obfuscated to conceal intent.

  - **Identify high-confidence malicious indicators:** Specifically, look for registry entries that point to executables downloaded from known malicious sources (e.g., files executing from `\Downloads\` or Outlook temp folders). Use threat intelligence feeds to check the reputation of any suspicious executables.

  - **Assess legitimate behavior:** Determine if the RUN keys correspond to common applications (e.g., productivity software, security tools). Applications like MS Office and browsers may legitimately write to these directories for updates or temporary file handling.

  - **Review user access controls:** Evaluate the access permissions for the affected user accounts and systems. Ensure restrictive permissions are enforced, limiting unauthorized entities from modifying registry keys or running executables from non-standard locations.

  - **Validate file creation artifacts:** Investigate file creation timestamps within the detected directories (`\Downloads\`, `\Local Settings\Temporary Internet Files\`) to identify any anomalous or unexpected file creations correlating with the RUN registry modifications.

  ### Prioritization

  The alert is considered high severity due to the critical role of persistence mechanisms in facilitating further attacks. Given the common tactics employed by adversaries, such behavior can lead to undetected long-term compromise. This particular method of leveraging user directories for malware persistence is frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate software installers creating similar RUN keys, which could trigger false positives. Effective detection requires enabling detailed auditing for registry changes and ensuring full coverage of user directories. Routine application updates or configuration changes by authorized users can also trigger this alert. Consider companion detection rules that monitor network connections initiated by these processes to strengthen overall security coverage.

