logsource:
  category: registry_event
  product: windows
detection:
  selection:
    Image|contains:
    - '\AppData\Local\Packages\Microsoft.Outlook_'
    - '\AppData\Local\Microsoft\Olk\Attachments\'
    - '\Downloads\'
    - '\Temporary Internet Files\Content.Outlook\'
    - '\Local Settings\Temporary Internet Files\'
    TargetObject|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  condition: selection
falsepositives:
- Software installers downloaded and used by users
level: high
note: |
  ### Technical Context
  This rule detects suspicious creation of Windows RUN registry keys that originate from files stored in the Download folder or temporary directories associated with Outlook and Internet Explorer. Attackers may exploit these locations to bypass security measures and achieve persistence on compromised systems, enabling them to execute malicious payloads every time the user logs into their system. The likely objectives of the attacker include maintaining access, installing additional malicious tools, or executing commands with elevated privileges.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003): Utilizing RUN keys to ensure code execution upon user logon.
  - **Privilege Escalation** (TA0004): Harnessing this method to establish persistent control may allow adversaries to operate with greater privileges absent detection.

  Primary data sources for this rule's detection include Windows registry event logs that capture changes made to the system's RUN keys and processes related to file execution from known directories.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent entries in the Windows registry, particularly under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` and `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`, to identify any unauthorized or unusual modifications corresponding with the detected alert.
  - **Analyze File Execution Sources:** Investigate the files in the Download and temporary directories, checking for executables that correlate with the suspicious RUN keys. Pay close attention to any newly created or modified files.
  - **Correlate with User Activity:** Assess user account activity logs to determine if multiple logins or other anomalous behaviors correspond with the registry modifications, which could indicate an ongoing attack or misuse of credentials.
  - **Audit Application Behavior:** Utilize endpoint detection and response (EDR) tools to monitor for any unusual or malicious behavior originating from applications associated with the identified RUN keys, specifically focusing on processes that may exhibit atypical actions or network connections.

  ### Prioritization
  This alert is marked as high severity due to the potential for widespread compromise within the enterprise environment. The use of persistence mechanisms, such as RUN keys, can provide attackers with sustained access, increasing the likelihood of further exploitation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if logs for registry events are not properly aggregated or if audit logging for system modifications is disabled. The detection logic assumes that malicious actors will not disguise their malicious payloads effectively and that standard software installations are the only benign uses of these paths. Proper configuration of registry event logging and ensuring visibility across endpoint activities are essential for this alert to function accurately.

