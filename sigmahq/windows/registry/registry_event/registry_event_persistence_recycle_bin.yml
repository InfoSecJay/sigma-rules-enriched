note: |
  ### Technical Context

  This Sigma rule detects the creation and modification of specific registry keys associated with the Recycle Bin. The behavior indicative of an adversary attempting to establish persistence in a compromised environment is highlighted, specifically targeting the CLSID for Recycle Bin shell executions. The likely attacker objective is to maintain access to the system, executing malicious payloads upon user interactions with the Recycle Bin. This aligns with the MITRE ATT&CK framework tactic of Persistence (T1547). The primary telemetry sources involved include Windows Registry Event Logs, particularly focusing on events related to `RenameKey` and `SetValue` actions. If this behavior is confirmed malicious, it poses a significant security risk as an attacker can regain access even after an initial detection and remediation effort. Importantly, detection of these registry modifications does NOT confirm malicious intent without further context regarding the activities of legitimate users and software.

  ### Investigation Steps

  - **Review Event Logs for Registry Modification:** Analyze Windows Registry Event IDs related to registry changes, specifically Event ID 4657 for Registry Value Modification or Event ID 4656 for Registry Object Access. Verify if changes occurred during active user sessions or coincide with other suspicious activities.

  - **Validate Key Existence and Contents:** Check for the presence of the registry key `HKEY_CLASSES_ROOT\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open` and its `command` subkey. Confirm the values within the command field are legitimate and compare with baseline configurations.

  - **Check for User Permission Context:** Determine the user context during the registry modifications. A typical enterprise user should not possess permissions to make such changes in the system registry. Look for Event ID 4672 (Special Privileges Assigned) to identify user roles associated with the modifications.

  - **Identify Similar Activity Patterns:** Look for anomalous behaviors such as multiple modifications in a short timeframe or patterns mimicking known malware. This should include correlating against other detections of persistence mechanisms, specifically related to scheduling tasks or creating services.

  - **Assess Recent Software Installations:** Investigate recent software installations or updates on the system that may explain legitimate changes to the registry. Create a timeline of installation events versus registry modifications to differentiate between benign and suspected malicious activity.

  - **Monitor User Interactions with the Recycle Bin:** Observe user activities related to the Recycle Bin. Legitimate actions would typically involve the user deleting or restoring files without unusual execution behavior or registry changes.

  ### Prioritization

  This alert warrants high severity due to the impact on system integrity and the potential for persistent malware deployment. The likelihood of abuse is considerable as persistence mechanisms are commonly utilized by attackers to maintain control over compromised systems. Such behavior is frequently weaponized in targeted attacks and must be closely monitored.

  ### Blind Spots and Assumptions

  This detection may be evaded through manipulation of event logging and by using other less scrutinized registry paths for persistence. Accurate logging configurations are crucial for reliable detection; failure to audit registry changes can impede identification of malicious activity. Legitimate activities, such as system management or software updates, may inadvertently trigger the alert. Related detections involving scheduled tasks (T1053) or services (T1543) can enhance coverage against persistence methods.

