detection:
  selection_create:
    EventType: RenameKey
    NewName|contains: '\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open'
  selection_set:
    EventType: SetValue
    TargetObject|contains: '\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open\command\(Default)'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of persistence mechanisms that leverage the Recycle Bin in Windows systems. Attackers may employ these techniques to maintain access to a compromised system even after initial intrusion detection and remediation. The registry keys associated with the Recycle Bin can be modified to execute malicious payloads, ensuring that the malware remains active and capable of re-establishing a foothold on the target machine.

  The primary objective of such an attacker behavior is to ensure survivability and persistence. Often aligned with broader tactics, this can involve privilege escalation techniques as adversaries look to maintain control over compromised assets in a targeted environment. Related MITRE ATT&CK tactics include **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, specifically referencing technique **T1547** (Boot or Logon Autostart Execution).

  Key log sources for this detection rule include Windows registry event logs, specifically monitoring for `RenameKey` and `SetValue` event types that target the Recycle Bin. These logs provide insight into suspicious modifications that may indicate malicious persistence efforts.

  ### Investigation Steps
  - **Review Registry Logs:** Check Windows registry event logs for any recent `RenameKey` or `SetValue` events that reference the Recycle Bin CLSID. This can highlight potential unauthorized persistence mechanisms.
  - **Analyze Relevant Processes:** Investigate all processes associated with the flagged registry modifications. Look for any unusual execution paths or behavior patterns that suggest malicious intent.
  - **Correlate with User Activities:** Cross-reference the timestamps of the registry modifications with user activity logs to discern any anomalous behavior or unauthorized access attempts.
  - **Examine Endpoint Protection Alerts:** Consult alerts from endpoint detection and response (EDR) tools for related activities that may provide further context or confirm malicious behavior linked to persistence in the Recycle Bin.

  ### Prioritization
  This alert is assigned a high severity due to the potential risk associated with persistence techniques employed by attackers. A successful exploitation can allow adversaries to maintain prolonged access to sensitive environments, facilitating further attacks or data exfiltration.

  ### Blind Spots and Assumptions
  The detection logic may not capture all persistence mechanisms, particularly if attackers utilize alternate methods not involving the Recycle Bin or if they modify registry keys outside of the expected patterns. The assumption made by this detection is that all relevant registry logs are properly collected and accessible. Ensuring adequate logging configuration and monitoring practices is essential for the effectiveness of this alert; missing logs or improperly configured systems could lead to undetected malicious activities.

