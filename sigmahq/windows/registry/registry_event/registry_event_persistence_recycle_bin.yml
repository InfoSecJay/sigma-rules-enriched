  ---

  ### Technical Context

  This Sigma rule detects the creation and modification of registry keys associated with the Recycle Bin, specifically changes related to the CLSID for the Recycle Bin. Attackers may leverage this persistence mechanism to maintain access to a compromised system, often aiming to execute malicious commands after user logout or system restart. This behavior is relevant to the MITRE ATT&CK technique for Persistence (T1547).

  Primary telemetry sources include Windows Registry Event logs, specifically `RenameKey` and `SetValue` events. The security impact is significant; if malicious, it allows an attacker to achieve persistence, evading simple detection methods. Notably, this rule does NOT confirm malicious intent on its own; benign users or software may also interact with these registry keys.

  ---

  ### Investigation Steps

  - **Identify the event details:** Review Event ID 13 from the Windows Security Event Log to analyze the context of the registry modifications. Look for the user account and originating process associated with the event.

  - **Examine command modifications:** Check for the specific registry modification by querying the event logs for `TargetObject` containing the CLSID `{645FF040-5081-101B-9F08-00AA002F954E}`. Look at the `ValueName` to see if it indicates potential malicious commands.

  - **Validate legitimate behavior:** Look for similar entries that involve legitimate applications, such as system maintenance tools modifying the Recycle Bin registry keys. Document the process names and commands typically associated with these benign changes.

  - **Correlate with other logs:** Cross-reference the registry modifications with Sysmon Event ID 1 (Process Creation) to identify if any suspicious processes launched around the same time. Check for unusual parent-child process relationships.

  - **Assess for high-confidence indicators:** Identify if the modifications are accompanied by known malicious command signatures or base64 encoded payloads in the `command` value. Any detected base64 encoding is a strong indicator of potential malicious behavior.

  - **Review user privileges:** Determine the user's account level making the changes. Changes from non-admin accounts to sensitive or system-level registry entries should be treated as suspicious and warrant further investigation.

  ---

  ### Prioritization

  This alert is considered high severity due to the significant potential impact of persistence mechanisms employed by adversaries on critical systems. The likelihood of exploitation is notable as these techniques are commonly weaponized in various attack frameworks, thus demanding prompt attention from analysts.

  ---

  ### Blind Spots and Assumptions

  This detection has limitations for evasion techniques, as attackers could use legitimate software to modify the registry without triggering alerts. Full coverage requires monitoring Windows Registry Event logs effectively, and false positives may stem from benign applications interacting with these keys. Companion detections, such as monitoring for unusual process creation patterns (Sysmon Event ID 1), can strengthen the analysis of persistent threats.

