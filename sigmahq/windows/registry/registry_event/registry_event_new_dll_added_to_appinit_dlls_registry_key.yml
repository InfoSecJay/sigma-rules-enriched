logsource:
  category: registry_event
  product: windows
detection:
  selection:
  - TargetObject|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
    - '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
        # Key Rename
  - NewName|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
    - '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
  filter:
    Details: '(Empty)'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies when a new DLL is added to the `AppInit_DLLs` registry key on a Windows machine. This behavior is commonly associated with malicious activities, as adversaries may utilize this technique to persistently load malware into user32.dll, affecting all processes that engage with the user interface. The likely objective is to enable execution of malicious code or escalate privileges (MITRE ATT&CK Tactic: Persistence; Technique: T1546.010).

  The primary telemetry sources are Windows Registry logs that capture changes to the `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls` location. The security impact could allow for unattended execution of malicious DLLs, potentially compromising the confidentiality, integrity, and availability of the system. It is important to note that this detection does NOT confirm that the added DLL is malicious; further investigation is required to ascertain the legitimacy of the change.

  ---

  ### Investigation Steps

  - **Check for recent changes to registry keys:** Review Windows Registry logs filtered for Event ID 4657. Look for changes specifically under `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls` for any suspicious newly added DLL names.

  - **Validate newly added DLLs:** Identify the DLL name and file path via Windows Event ID 4688 (Process Creation). Cross-reference these details with known safe libraries to distinguish between benign and malicious indicators. Benign entries typically involve Microsoft libraries (e.g., `user32.dll`, `kernel32.dll`).

  - **Analyze process interactions:** Use Sysmon Event ID 7 (Image Loaded) to monitor processes that invoke the user32.dll. Capture the timestamps, and check for any corresponding creation of suspicious processes or unexpected DLLs loading within legitimate applications.

  - **Review system behaviors:** Observe behaviors of applications that load user32.dll using the Process Explorer tool to ensure no unusual activity (e.g., applications crashing, unexpected pop-ups). Legitimate applications typically exhibit stable interactions devoid of abnormal DLL injections.

  - **Examine file system for related artifacts:** Investigate for any recently introduced files or executables in `C:\Windows\System32` or app-related directories that could indicate lateral movement or persistence strategies. Correlate these with recent registry changes.

  - **Identify any restoration or rollback activities:** Assess for legitimate maintenance or remediation logs, which might involve restoring or changing DLL entries back to expected values, indicating normal administrative behavior versus malicious activity.

  ---

  ### Prioritization

  This alert is medium severity due to the potential for system compromise through persistent malicious activity. The likelihood of abuse is moderate, as techniques involving DLL injection into user32.dll are commonly weaponized by attackers targeting Windows environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full registry auditing or if logs are not retained long enough for review. Evasion techniques could include deleting the entry shortly after execution or using legitimate software to mislead detection efforts. Legitimate activities could include software installations or updates that modify the `AppInit_DLLs`. A companion detection to consider is monitoring for abnormal process creation (Event ID 4688) following any changes to the registry.

