title: New DLL Added to AppInit_DLLs Registry Key
id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
status: test
description: DLLs that are specified in the AppInit_DLLs value in the Registry key
  HKLM\Software\Microsoft\Windows NT\CurrentVersion\Windows are loaded by user32.dll
  into every process that loads user32.dll
references:
- https://eqllib.readthedocs.io/en/latest/analytics/822dc4c5-b355-4df8-bd37-29c458997b8f.html
author: Ilyas Ochkov, oscd.community, Tim Shelton
date: 2019-10-25
modified: 2022-12-25
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.010
logsource:
  category: registry_event
  product: windows
detection:
  selection:
  - TargetObject|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
    - '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
        # Key Rename
  - NewName|endswith:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
    - '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls'
  filter:
    Details: '(Empty)'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors changes to the `AppInit_DLLs` registry key, which is critical for maintaining the integrity of system processes on Windows machines. The presence of unauthorized or suspicious Dynamic Link Libraries (DLLs) in this registry entry indicates potential compromise, as attackers often use this technique to establish persistence on a system. By manipulating the `AppInit_DLLs`, malware can inject itself into various user-mode processes that load `user32.dll`, which could facilitate further malicious actions such as keylogging, credential theft, or privilege escalation.

  The likely objectives of an attacker leveraging this technique include maintaining a foothold within the environment and executing malicious payloads across multiple processes to evade detection. The relevant MITRE ATT&CK techniques for this detection rule include:
  - **T1546.010 - DLL Sideloading**: Utilizing malicious configuration to leverage DLL loading functionality for persistence.
  - **T1055 - Process Injection**: Injecting code into legitimate processes to execute malicious functionalities with elevated privileges.

  Primary data sources that can provide the best evidence for detecting this behavior include registry event logs, which capture the necessary changes to the registry, and process creation events that may reveal newly loaded DLLs in user processes.

  ### Investigation Steps
  - **Review Registry Event Logs**: Check the registry event logs for any modifications to the `AppInit_DLLs` key. Pay special attention to new entries or changes with the path `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls`.

  - **Correlate with Process Creation Events**: Analyze process creation events around the time of the registry modification to identify any newly spawned processes that might be leveraging the injected DLLs for malicious activities.

  - **Check for Known Suspicious DLLs**: Compare the loaded DLLs with known lists of malicious DLLs or run context checks against threat intelligence feeds to identify potential threats.

  - **Investigate User Accounts**: Determine which user accounts made the changes to the registry. Look for unauthorized or unusual user account activity that could indicate a compromised account.

  ### Prioritization
  This alert should be treated with medium severity, as changes to the `AppInit_DLLs` can facilitate persistence and code execution across processes, potentially leading to significant impacts, such as system compromise or data exfiltration, if exploited by an attacker.

  ### Blind Spots and Assumptions
  One potential gap in this detection could be the failure to capture registry modifications if logging is improperly configured or disabled. The rule assumes that the detection logic can adequately access registry event logs; if registry access is limited or filtered out in log aggregation, the rule may not trigger appropriately. Furthermore, the effectiveness of this detection is contingent upon comprehensive logging configurations for registry events and proactive monitoring for file integrity changes within the Windows environment.

