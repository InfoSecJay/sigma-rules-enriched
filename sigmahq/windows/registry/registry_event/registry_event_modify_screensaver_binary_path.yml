title: Path To Screensaver Binary Modified
id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
status: test
description: Detects value modification of registry key containing path to binary
  used as screensaver.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
- https://www.welivesecurity.com/wp-content/uploads/2017/08/eset-gazer.pdf
author: Bartlomiej Czyz @bczyz1, oscd.community
date: 2020-10-11
modified: 2021-11-27
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control Panel\Desktop\SCRNSAVE.EXE'     # HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE
  filter:
    Image|endswith:
    - '\rundll32.exe'
    - '\explorer.exe'
  condition: selection and not filter
falsepositives:
- Legitimate modification of screensaver
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying modifications to the Windows registry key that determines the path to the screensaver binary (SCRNSAVE.EXE). Attackers may manipulate this registry setting as part of their tactics to execute malicious payloads or maintain persistence on compromised machines. Specifically, they can replace the legitimate screensaver binary path with a path pointing to malicious software, often executed using common binaries like `rundll32.exe` or `explorer.exe`, which can obfuscate the attacker's actions and evade detection.

  In this scenario, the attacker may aim to maintain access to a system or execute code with the privileges of the user account associated with the changed registry value. The relevant MITRE ATT&CK tactics include **Persistence** (T1546.002), where adversaries may leverage the screensaver to maintain their foothold, and **Privilege Escalation** as they exploit user-level mechanisms to gain elevated access.

  Primary data sources for this detection include Windows registry event logs, which will contain records of the modifications made to registry keys, as well as process creation events that can provide insight into the context in which the privilege escalation attempt occurred.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows registry event logs focusing on modifications to `HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE`. Pay attention to the timestamps and user accounts making changes.
  - **Analyze Process Creation Logs:** Investigate any recent process creation events involving `rundll32.exe` or `explorer.exe`. Check for unusual command line arguments or execution paths that may indicate malicious activity.
  - **Check for Persistence Mechanisms:** Identify any other unusual modifications to registry keys that could indicate additional persistence hooks, such as other startup entries or scheduled tasks.
  - **Correlate with User Activity:** Look for correlations between the registry modification and user activity, such as logins from foreign IPs or access to sensitive files shortly before or after the registry change.

  ### Prioritization
  This alert is of **medium** severity due to the potential risk of unauthorized execution of malicious code on user systems, which could lead to broader breaches within the enterprise. While legitimate modifications may occur, the technique used implies a higher likelihood of nefarious actions.

  ### Blind Spots and Assumptions
  This detection logic will miss legitimate registry changes made by users or system administrators. Additionally, it assumes that the monitored registry key is not being modified by other legitimate applications or services. For effective detection, it is crucial to ensure that registry event logging is enabled and properly configured on all endpoints. Without the appropriate logging, the detection cannot function as intended, creating a gap in visibility for potential threats orchestrated through registry manipulation.

