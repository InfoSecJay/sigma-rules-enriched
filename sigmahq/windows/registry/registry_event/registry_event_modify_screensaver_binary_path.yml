title: Path To Screensaver Binary Modified
id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
status: test
description: Detects value modification of registry key containing path to 
  binary used as screensaver.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
- https://www.welivesecurity.com/wp-content/uploads/2017/08/eset-gazer.pdf
author: Bartlomiej Czyz @bczyz1, oscd.community
date: 2020-10-11
modified: 2021-11-27
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control Panel\Desktop\SCRNSAVE.EXE'     # HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE
  filter:
    Image|endswith:
    - '\rundll32.exe'
    - '\explorer.exe'
  condition: selection and not filter
falsepositives:
- Legitimate modification of screensaver
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the Windows registry key that specifies the path to the screensaver executable, typically found at `HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE`. The likely attacker objective is to establish persistence by replacing the legitimate screensaver binary with malicious code, which can then be executed whenever the screensaver is activated. This detection aligns with the MITRE ATT&CK tactic of Persistence and the technique T1546.002 (Event Triggered Execution: Screensaver).

  The primary telemetry source for this detection is the Windows registry events. Specifically, the registry modification events are captured, which detail changes to `SCRNSAVE.EXE`. If malicious, this behavior could enable an attacker to execute their own code undetected. However, it is critical to emphasize that this detection does NOT confirm malicious intent on its own, as legitimate users may modify screensaver settings.

  ### Investigation Steps

  - **Review registry modification logs**: Check Windows Registry Event IDs 4657 and 4663 for changes to `HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE`. Look for changes that involve non-standard executable paths rather than typical Windows screensaver paths.

  - **Identify the modifying process**: Analyze the process responsible for the registry change. Collect process creation logs (Security Event ID 4688 or Sysmon Event ID 1) to determine if `rundll32.exe` or `explorer.exe` was used. Legitimate modifications usually involve a user-initiated action from an installed utility or system settings.

  - **Correlate with user activities**: Inspect user activity logs around the time of the event. Check if users accessed screensaver settings through Control Panel or similar interfaces, as this may indicate benign behavior.

  - **Examine for additional persistence mechanisms**: Look for other related registry modifications or scheduled tasks that may indicate further persistence attempts. Check Event IDs 4697 (Service installed) or 4698 (Scheduled Task created) for suspicious or unexpected persistence implementations.

  - **Validate modified executable**: If a suspicious path is found, validate the binary’s integrity by checking its hash against known malware signatures. Use any endpoint detection and response (EDR) tools for file analysis.

  - **Assess criticality of the affected asset**: Determine if the system involved is a critical asset (e.g., a domain controller or a management workstation) which, if compromised, could escalate further attacks or insider threats.

  ### Prioritization

  The severity of this alert should be considered medium in an enterprise context. The potential impact on system integrity is considerable since altering execution paths for critical binaries can facilitate malware persistence. The likelihood of malicious abuse is moderate, as attackers frequently leverage such methods for evasion and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions that allow legitimate changes to screensaver settings. Additionally, this rule may not capture all registry modification events if auditing isn't appropriately configured across the environment. Legitimate activities, such as changing a screensaver for user customization, may trigger this alert. A related detection is monitoring for unusual process executions linked to screensaver processes, which can further strengthen coverage.

