note: |
  ### Technical Context

  This Sigma rule detects the loading of VB DLLs (VBE7.DLL, VBEUI.DLL, VBE7INTL.DLL) by common Microsoft Office applications (Excel, Word, Outlook, etc.). Such behavior typically signifies the use of VBA macros which can be employed by attackers to gain execution capabilities on a target machine or to deliver malicious payloads. The likely attacker objective may include data exfiltration or system compromise through malicious macros.

  This detection relates to the MITRE ATT&CK technique "Malicious Macro" (T1204.002). The primary telemetry sources include Windows image load events, specifically targeting Office application logs that indicate DLL loading. If the behavior is malicious, it may facilitate further exploitation, leading to significant security risks such as unauthorized access or data leakage. However, this detection does NOT confirm malicious intent on its own as legitimate macro functionality can also trigger this alert.

  ### Investigation Steps

  - **Identify image loading events**: Review Windows Event ID 4104 logs for any recent entries showing the loading of VBE7.DLL, VBEUI.DLL, or VBE7INTL.DLL by Office applications.

  - **Correlate with user activity**: Check if the triggering Office application (e.g., Excel) matches recent user activity. Look for legitimate usage patterns such as users working in a project involving macros.

  - **Analyze VBA code**: If possible, extract and review the VBA code associated with documents utilizing macros to analyze for suspicious functions or commands indicative of malicious behavior, typically found in Microsoft Office’s project explorer.

  - **Evaluate the context of the triggering files**: Examine the document or template associated with the Office application by checking file paths or shares for anomalies. Look for unusual source or transport locations (e.g., downloaded from a suspicious website or received via untrusted email).

  - **Check for repeated alerts**: Assess for patterns in multiple instances of alerts across systems that could indicate widespread exploitation attempts or a coordinated attack, especially if several documents across different systems exhibit the same behavior indicating a possible macro deployment strategy.

  ### Prioritization

  The alert severity is high due to the critical nature of the affected systems, as Microsoft Office applications are commonly used within enterprises and can serve as entry points for malicious actors. The likelihood of malicious abuse is significant because VBA macros are often weaponized in phishing campaigns.

  ### Blind Spots and Assumptions

  Evasion techniques may include suppressed logging through Group Policy or users disabling macro security settings, which can result in missed detections. Reliable detection requires enabling Office application logging and ensuring that event logging for image load events is appropriately configured. Legitimate activities such as businesses utilizing macros for automation can trigger this alert; therefore, analysts must differentiate benign usage from malicious intent. Complementary detections such as monitoring for unusual PowerShell usage or suspicious document downloads could enhance coverage and provide context for macro usage.

