logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|endswith:
    - '\VBE7.DLL'
    - '\VBEUI.DLL'
    - '\VBE7INTL.DLL'
  condition: selection
falsepositives:
- Legitimate macro usage. Add the appropriate filter according to your environment
level: high
note: |
  ### Technical Context
  This detection rule identifies the loading of Visual Basic (VB) DLL files by Microsoft Office applications, which can indicate the use of malicious VBA macros. Attackers may exploit VBA functionalities to execute payloads, establish persistence, or perform data exfiltration using seemingly benign documents. Common objectives include running unauthorized code, gaining access to sensitive data, or lateral movement within the organization.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002), particularly the technique **Malicious Macro** (T1204.002), where adversaries take advantage of macros in documents to trigger malicious activities. Primary data sources for this rule include **Image Load events** from Windows, which log the execution of applications and the DLLs they load, providing visibility into potentially malicious activities involving Office applications.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze logs from Windows indicating what DLLs were loaded by Office applications, particularly focusing on entries involving `VBE7.DLL`, `VBEUI.DLL`, or `VBE7INTL.DLL`.
  - **Correlate with User Activity**: Investigate the context of the user account that triggered the alert. Look for any other activities that suggest suspicious behavior, such as unusual document access or network connections.
  - **Examine Document Contents**: Check the Microsoft Office documents associated with the alert for any macros, particularly those that are obfuscated or not typically used in the enterprise environment.
  - **Consider Legitimate Use**: Validate whether the detected macros may be part of legitimate activities in your organization. Cross-reference with known good macro signatures or configurations.

  ### Prioritization
  This alert is considered **high-severity** due to the potential risk associated with malicious macro execution in Microsoft Office files, which can lead to significant impacts, including data breaches or compromise of internal systems.

  ### Blind Spots and Assumptions
  Detection may not capture all malicious macro usage scenarios if the VBA macros are signed or if attackers employ obfuscation techniques that disguise the use of common DLLs. The detection logic assumes that the presence of these specific DLLs loaded by Office applications during normal operations warrants further investigation. Comprehensive logging of image load events is essential for this detection to function effectively, and any environments with restrictive logging settings may risk missing these critical indicators.

