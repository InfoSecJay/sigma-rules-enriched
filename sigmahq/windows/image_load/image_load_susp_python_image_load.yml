title: Python Image Load By Non-Python Process
id: cbb56d62-4060-40f7-9466-d8aaf3123f83
status: test
description: |
  Detects the image load of "Python Core" by a non-Python process. This might be indicative of a execution of executable that has been bundled from Python code.
  Various tools like Py2Exe, PyInstaller, and cx_Freeze are used to bundle Python code into standalone executables.
  Threat actors often use these tools to bundle malicious Python scripts into executables, sometimes to obfuscate the code or to bypass security measures.
references:
- https://www.py2exe.org/
- https://unit42.paloaltonetworks.com/unit-42-technical-analysis-seaduke/
author: Patrick St. John, OTR (Open Threat Research)
date: 2020-05-03
modified: 2025-08-18
tags:
- attack.defense-evasion
- attack.t1027.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Description: 'Python Core'
  filter_main_generic:
  - Image|contains: 'Python'        # FPs with python38.dll, python.exe etc.
  - Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\ProgramData\Anaconda3\'           # Comment out if you don't use Anaconda in your environment
  filter_optional_null_image:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Py2Exe Binaries
- Known false positive caused with Python Anaconda
- Various legitimate software is bundled from Python code into executables
level: low
note: |
  ### Technical Context

  This rule detects loading of the "Python Core" library by non-Python processes, which may indicate that an attacker has bundled malicious Python scripts into standalone executables using tools like PyInstaller, Py2Exe, or cx_Freeze. The likely objective is to execute arbitrary code while evading detection, given that these bundled executables can mask the use of Python and its associated environments. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1027.002) as attackers leverage these methods to hide their malicious activities.

  The primary telemetry source is Windows image loading events, specifically looking for instances where non-Python executables interact with the Python Core DLL files (usually named `python38.dll`, for example). If malicious, this behavior can signify an ongoing compromise. Importantly, this detection does NOT confirm active malicious intent, as legitimate applications may also utilize bundled Python executables.

  ### Investigation Steps

  - **Verify the process making the call: ** Examine the process ID and parent process of the alerting event using Sysmon Event ID 1. Confirm whether the parent process is a known benign application or script invoking Python Core; malicious indicators include executables with unusual file paths.

  - **Investigate file paths and signatures: ** Cross-reference the executable path against a list of known safe applications. Benign examples typically come from established vendors, whereas paths like `C:\Users\Public\` or random strings indicate suspicious behavior.

  - **Analyze recent changes on the host: ** Review Security Event ID 4663 to find any modification to the Python Core DLL or any associated executables. Legitimate updates or installations of Python-related tools should be accounted for, while unexpected modifications may require further analysis.

  - **Check for scripted activity: ** Review scripting logs or execution policies using PowerShell logs (Event ID 4103). Legitimate software deployments or scripted tasks might invoke Python, while erratic or unexpected script executions could indicate malicious activity.

  - **Correlate with antivirus and EDR alerts: ** Cross-reference the alert with recent antivirus scans or EDR logs for detections that may have flagged the same executable. High-confidence malicious indicators would include detections of known malware signatures associated with Python bundlers.

  ### Prioritization

  The alert is of low severity as it is commonly generated by legitimate software using Python for functionality, such as data science applications or automation scripts. However, the potential for abuse exists since attackers frequently use bundling techniques to bypass security tooling. Analysts should consider the affected system's criticality in their prioritization efforts.

  ### Blind Spots and Assumptions

  Detection may miss legitimate, benign use cases of bundled Python applications, especially if these are prevalent in the environment. To ensure comprehensive coverage, it is crucial to configure endpoint detection systems to capture full image loading events without filtering potentially useful historical data. Companion detections could involve monitoring for suspicious command-line arguments or behaviors indicative of scripting activity (related ATT&CK technique T1059).

