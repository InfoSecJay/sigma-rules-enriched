title: Python Image Load By Non-Python Process
id: cbb56d62-4060-40f7-9466-d8aaf3123f83
status: test
description: |
  Detects the image load of "Python Core" by a non-Python process. This might be indicative of a execution of executable that has been bundled from Python code.
  Various tools like Py2Exe, PyInstaller, and cx_Freeze are used to bundle Python code into standalone executables.
  Threat actors often use these tools to bundle malicious Python scripts into executables, sometimes to obfuscate the code or to bypass security measures.
references:
- https://www.py2exe.org/
- https://unit42.paloaltonetworks.com/unit-42-technical-analysis-seaduke/
author: Patrick St. John, OTR (Open Threat Research)
date: 2020-05-03
modified: 2025-08-18
tags:
- attack.stealth
- attack.t1027.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Description: 'Python Core'
  filter_main_generic:
  - Image|contains: 'Python'        # FPs with python38.dll, python.exe etc.
  - Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\ProgramData\Anaconda3\'           # Comment out if you don't use Anaconda in your environment
  filter_optional_null_image:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Py2Exe Binaries
- Known false positive caused with Python Anaconda
- Various legitimate software is bundled from Python code into executables
level: low
note: |
  ### Technical Context

  This rule detects the loading of the "Python Core" dynamic-link library (DLL) by processes that are not native Python executables, which may indicate attempts to execute malicious payloads packaged with Python. The likely objective of an attacker utilizing this tactic is to leverage bundled Python scripts to evade detection by conventional security controls. This behavior aligns with the MITRE ATT&CK technique "Compiled Application" (T1027.002).

  Primary telemetry sources include Windows image load events, specifically those generated by Sysmon (Event ID 7) or analogous image load logs. If malicious, the system may be compromised or running unauthorized scripts disguised as legitimate applications. Importantly, the detection does not confirm the execution of malicious code on its own; further investigation is required to ascertain intent.

  ### Investigation Steps

  - **Verify the process involved:** Identify the process name and path using Sysmon Event ID 7 or Windows Event ID 4688. Check for suspicious or unexpected processes loading the "Python Core" DLL from non-standard locations.

  - **Confirm benign sources:** Review the context for known legitimate applications or PyInstaller bundles. Cross-reference against a list of trusted applications that may legitimately utilize Python, ensuring that any detected loads correspond to these applications.

  - **Assess image load paths:** Check if the loading process comes from standard application directories (C:\Program Files\, C:\Program Files (x86)\). Any deviations should be flagged for potential malicious behavior.

  - **Identify high-confidence indicators:** Look for processes that require elevated privileges or show unusual parent-child process relationships, particularly if they're loading "python37.dll" or similar from non-trusted locations or unexpected source paths.

  - **Inspect for artifacts of execution:** If malicious, check for temporary file creation or execution artifacts in directories such as C:\Users\<username>\AppData\Local\Temp\. Use file monitoring to identify executable files mimicking legitimate software behavior.

  - **Review operational context:** Determine the asset’s role. For example, if a server is loading Python Core without documented needs, it increases suspicion of compromise.

  ### Prioritization

  This alert is of low severity as it may represent a benign usage of Python-related binaries within the enterprise. However, given the potential for obfuscation and misuse in executing malicious code, analysts should treat it with a degree of caution. While not as commonly weaponized as other tactics, detection of this behavior could reveal underlying risks.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with legitimate software needing Python Core, which increases the likelihood of false positives from known tools like PyInstaller or Anaconda. The requirement for comprehensive logging, including Sysmon configuration, is vital for reliable detection. Further, legitimate Python applications, or updates to such applications, may trigger this alert. A companion detection would involve monitoring for unusual process command-line arguments or outbound network connections that could further establish context around detected behavior.

