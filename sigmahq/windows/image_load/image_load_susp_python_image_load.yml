title: Python Image Load By Non-Python Process
id: cbb56d62-4060-40f7-9466-d8aaf3123f83
status: test
description: |
  Detects the image load of "Python Core" by a non-Python process. This might be indicative of a execution of executable that has been bundled from Python code.
  Various tools like Py2Exe, PyInstaller, and cx_Freeze are used to bundle Python code into standalone executables.
  Threat actors often use these tools to bundle malicious Python scripts into executables, sometimes to obfuscate the code or to bypass security measures.
references:
- https://www.py2exe.org/
- https://unit42.paloaltonetworks.com/unit-42-technical-analysis-seaduke/
author: Patrick St. John, OTR (Open Threat Research)
date: 2020-05-03
modified: 2025-08-18
tags:
- attack.defense-evasion
- attack.t1027.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Description: 'Python Core'
  filter_main_generic:
  - Image|contains: 'Python'        # FPs with python38.dll, python.exe etc.
  - Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\ProgramData\Anaconda3\'           # Comment out if you don't use Anaconda in your environment
  filter_optional_null_image:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Py2Exe Binaries
- Known false positive caused with Python Anaconda
- Various legitimate software is bundled from Python code into executables
level: low
note: |
  ### Technical Context
  This rule detects instances where the "Python Core" library is loaded by processes that are not typically associated with Python environment execution. Threat actors often utilize tools like Py2Exe, PyInstaller, and cx_Freeze to bundle malicious Python scripts into standalone executables. By executing Python scripts in this way, attackers aim to obfuscate their code and potentially bypass traditional security measures, making it harder for defenses to detect malicious activities.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (Tactics) and the technique **Compiled Code (T1027.002)**, which pertains to the usage of compiled programming languages or environments like Python for malicious purposes. This detection focuses on the potential misuse of Python functionalities to execute malicious commands that may lead to further compromise of systems.

  Primary data sources for effective detection include **Windows image load logs**, which can provide insights into process behaviors and the dynamic loading of libraries. Anomalous patterns in these logs can signal potential exploits or combative actions taken by threat actors.

  ### Investigation Steps
  - **Review Image Load Logs**: Search for instances where "Python Core" is loaded by non-Python associated processes in the Windows image load logs. Pay attention to the file paths from which these images are loaded.
  - **Correlate with Process Activity**: Identify and correlate any suspicious process activity related to the execution of the identified Python Core image. Check for any unusual parent-child process relationships that may indicate malicious behavior.
  - **Investigate for Known Tools**: Look for indicators of popular bundling tools such as Py2Exe, PyInstaller, and cx_Freeze in conjunction with the identified malicious behavior. Investigating execution artifacts from these tools may provide evidence of intent or ongoing malicious activity.
  - **Contextualize with System/Network Activity**: Analyze related system and network activity to understand the context of the Python execution. This includes checking for outbound connections or unauthorized access attempts that may correlate with the timing of the alert.

  ### Prioritization
  The severity of this alert is considered low due to the potential for false positives from legitimate applications that may use Python for acceptable purposes. However, the alert must be monitored as it may signal attempts to execute malicious code within environments where Python is not expected.

  ### Blind Spots and Assumptions
  Gaps in detection coverage can arise from legitimate usage of Python bundling tools which may lead to unexpected alerts for approved uses. The detection logic assumes that "Python Core" being loaded by a process not regularly associated with Python execution is indeed suspicious. Required logs include image load entries and process creation logs, and configurations in security tools must be enabled to ensure that detailed logs are captured and analyzed effectively. Additionally, environments that utilize Anaconda may produce false positives, necessitating careful tuning to minimize disruption.

