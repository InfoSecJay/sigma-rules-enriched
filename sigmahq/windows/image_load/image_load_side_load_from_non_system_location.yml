  filter_main_generic:
        # Note: this filter is generic on purpose to avoid insane amount of FP from legitimate third party applications. A better approach would be to baseline everything and add specific filters to avoid blind spots
    ImageLoaded|contains:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemTemp\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\SyChpe32\'         # “hybrid” binaries containing x86-to-ARM stubs to improve the x86 emulation performance
  filter_main_windows_temp:
    ImageLoaded|startswith: 'C:\Windows\Temp\'
    Image|startswith:
    - 'C:\Windows\WinSxS\arm64'
    - 'C:\Windows\UUS\arm64\'
    Image|endswith:
    - '\TiWorker.exe'
    - '\wuaucltcore.exe'
  filter_main_dot_net:
    ImageLoaded|startswith: 'C:\Windows\Microsoft.NET\'
    ImageLoaded|endswith: '\cscui.dll'
  filter_main_defender:
    ImageLoaded|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ImageLoaded|endswith: '\version.dll'
  filter_main_directx:
    ImageLoaded|startswith: 'C:\Program Files\WindowsApps\Microsoft.DirectXRuntime_'
    ImageLoaded|endswith: '\d3dx9_43.dll'
  filter_optional_exchange:
    ImageLoaded|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
    ImageLoaded|endswith: '\mswb7.dll'
  filter_optional_arsenal_image_mounter:
    ImageLoaded|startswith: 'C:\Program Files\Arsenal-Image-Mounter-'
    ImageLoaded|endswith:
    - '\mi.dll'
    - '\miutils.dl'
  filter_optional_office_appvpolicy:
    Image: 'C:\Program Files\Common Files\microsoft shared\ClickToRun\OfficeClickToRun.exe'
    ImageLoaded: 'C:\Program Files\Common Files\microsoft shared\ClickToRun\AppVPolicy.dll'
  filter_optional_azure:
    ImageLoaded|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  filter_optional_dell:
    Image|contains:
    - 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
    - 'C:\Windows\System32\backgroundTaskHost.exe'
    ImageLoaded|startswith: 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
  filter_optional_dell_wldp:
    Image|startswith: 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
    Image|endswith: '\wldp.dll'
  filter_optional_checkpoint:
    Image|startswith:
    - 'C:\Program Files\CheckPoint\'
    - 'C:\Program Files (x86)\CheckPoint\'
    Image|endswith: '\SmartConsole.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files\CheckPoint\'
    - 'C:\Program Files (x86)\CheckPoint\'
    ImageLoaded|endswith: '\PolicyManager.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate applications loading their own versions of the DLLs mentioned in 
  this rule
level: high
note: |
  ### Technical Context

  This Sigma rule detects DLL sideloading by monitoring the loading of specific DLL files from non-standard directories, indicating that an attacker may be attempting to execute malicious payloads masquerading as legitimate Windows components. The likely attacker objective is to gain unauthorized code execution or escalate privileges while avoiding detection by utilizing trusted system libraries. This behavior aligns with the MITRE ATT&CK tactic “Defense Evasion” (T1203) and the technique “Sideloading” (T1574.001).

  The primary telemetry source for this detection is Windows Image Load logs, which track the loading of DLL files. Logs can include Event IDs from process creation (e.g., Event ID 4688) or Sysmon Event ID 7 for DLL loading. If the behavior is malicious, it may lead to unauthorized access, increased attack surface, or lateral movement within the environment. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is required to ascertain context and intent.

  ---

  ### Investigation Steps

  - **Review the DLL path:**
    Analyze the source path of the loaded DLL. Look for DLLs loaded from directories like "C:\ProgramData\", which may indicate sideloading activity. Legitimate applications typically load DLLs from "C:\Windows\System32\" or "C:\Windows\SysWOW64\".

  - **Check process creation logs:**
    Cross-reference Sysmon Event ID 1 (Process Creation) to identify parent processes associated with the loaded DLL. A high-confidence malicious indicator would be if a suspicious process (e.g., `cmd.exe` or `powershell.exe`) executed the loading.

  - **Inspect command-line arguments:**
    For process creation logs (Event ID 4688 or Sysmon Event ID 1), examine command-line arguments for clues of malicious behavior, such as obfuscation or command chaining, which may indicate intent to obscure the execution context.

  - **Identify related network activity:**
    Utilize network logs to see if there are any outbound connections initiated by the process that loaded the DLL. For example, look at DNS queries or connections to known malicious IPs, especially related to lateral movement.

  - **Assess user context:**
    Review the user account associated with the process. If the process is running under a privileged account without appropriate justification, that could indicate malicious activity.

  - **Baseline legitimate applications:**
    Compile baseline information on legitimate applications in your enterprise that may use the mentioned DLLs. This helps distinguish between benign and potentially malicious activity related to DLL loading.

  ---

  ### Prioritization

  This alert is of high severity due to the critical role DLLs play in the Windows operating system and the likelihood of exposure to privilege escalation or remote code execution if this technique is exploited. Attackers frequently use DLL sideloading as a means of bypassing defenses, making this behavior commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by threat actors who may use legitimate applications for loading dodgy DLLs without triggering this alert. Reliable detection requires consistent logging configurations for Windows Image Load and detailed process creation logs. Legitimate scenarios such as third-party applications loading their own versions of DLLs may trigger this alert. A related detection worth considering is monitoring for unusual reactionary commands or scripts executed post-DLL load from known legitimate paths, providing additional context to the behavior observed.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
