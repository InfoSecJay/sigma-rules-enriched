  filter_main_generic:
        # Note: this filter is generic on purpose to avoid insane amount of FP from legitimate third party applications. A better approach would be to baseline everything and add specific filters to avoid blind spots
    ImageLoaded|contains:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemTemp\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\SyChpe32\'         # “hybrid” binaries containing x86-to-ARM stubs to improve the x86 emulation performance
  filter_main_windows_temp:
    ImageLoaded|startswith: 'C:\Windows\Temp\'
    Image|startswith:
    - 'C:\Windows\WinSxS\arm64'
    - 'C:\Windows\UUS\arm64\'
    Image|endswith:
    - '\TiWorker.exe'
    - '\wuaucltcore.exe'
  filter_main_dot_net:
    ImageLoaded|startswith: 'C:\Windows\Microsoft.NET\'
    ImageLoaded|endswith: '\cscui.dll'
  filter_main_defender:
    ImageLoaded|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ImageLoaded|endswith: '\version.dll'
  filter_main_directx:
    ImageLoaded|startswith: 'C:\Program Files\WindowsApps\Microsoft.DirectXRuntime_'
    ImageLoaded|endswith: '\d3dx9_43.dll'
  filter_optional_exchange:
    ImageLoaded|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
    ImageLoaded|endswith: '\mswb7.dll'
  filter_optional_arsenal_image_mounter:
    ImageLoaded|startswith: 'C:\Program Files\Arsenal-Image-Mounter-'
    ImageLoaded|endswith:
    - '\mi.dll'
    - '\miutils.dl'
  filter_optional_office_appvpolicy:
    Image: 'C:\Program Files\Common Files\microsoft shared\ClickToRun\OfficeClickToRun.exe'
    ImageLoaded: 'C:\Program Files\Common Files\microsoft shared\ClickToRun\AppVPolicy.dll'
  filter_optional_azure:
    ImageLoaded|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  filter_optional_dell:
    Image|contains:
    - 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
    - 'C:\Windows\System32\backgroundTaskHost.exe'
    ImageLoaded|startswith: 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
  filter_optional_dell_wldp:
    Image|startswith: 'C:\Program Files\WindowsApps\DellInc.DellSupportAssistforPCs'
    Image|endswith: '\wldp.dll'
  filter_optional_checkpoint:
    Image|startswith:
    - 'C:\Program Files\CheckPoint\'
    - 'C:\Program Files (x86)\CheckPoint\'
    Image|endswith: '\SmartConsole.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files\CheckPoint\'
    - 'C:\Program Files (x86)\CheckPoint\'
    ImageLoaded|endswith: '\PolicyManager.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate applications loading their own versions of the DLLs mentioned in 
  this rule
level: high
note: |
  ### Technical Context

  This rule detects attempts to load specific dynamic link libraries (DLLs) from non-standard locations, potentially indicating DLL sideloading—a technique typically used to execute malicious payloads disguised as legitimate DLLs. The likely attacker objective is to gain persistence or escalate privileges by leveraging trusted DLLs such as `iphlpapi.dll` to execute malicious code within an application's process context. This behavior fits into the MITRE ATT&CK framework under the tactic of **Persistence** (T1546) and the technique of **DLL Search Order Hijacking** (T1574.001).

  The primary telemetry sources for this detection include Windows image load events, specifically captured in the Sysmon logs (Event ID 7) or native Windows Event Viewer logs related to DLL loading. If this behavior is malicious, it could provide attackers with persistent access or further footholds within the environment. However, it is important to note that this detection alone does NOT confirm malicious activity, as legitimate applications may also load these DLLs from non-standard locations without malicious intent.

  ### Investigation Steps

  - **Identify the process context**: Examine the parent process of the image load events using Sysmon Event ID 7. Look for abnormal or suspicious parent processes that may indicate exploitation or malice (e.g., unexpected or uncommon apps launching known DLLs).

  - **Examine the load paths**: Correlate the loaded DLL paths recorded in Sysmon with the expected locations. DLLs like `iphlpapi.dll` or `windowscodecs.dll` loading from directories outside of standard system locations (e.g., `C:\ProgramData\` or user profile directories) should raise immediate suspicion.

  - **Review legitimate behavior**: In cases where DLLs load from the `C:\Windows\System32` directory, verify whether they are invoked by known applications and assess their typical behavior to establish a baseline and differentiate between benign and malicious activity.

  - **Check for known malicious files**: Validate if the loaded DLL matches known malicious hashes from threat intelligence sources or reference databases (e.g., hybrid-analysis.com, VirusTotal) for `iphlpapi.dll`, `windowscodecs.dll`, etc.

  - **Monitor for subsequent malicious activity**: After identifying potentially malicious DLL loads, check for other related activity within the logs, such as process creation events (Event ID 4688) that could indicate further exploitation attempts stemming from the initial DLL sideloading.

  ### Prioritization

  This alert has a **high severity** level due to the potential impact on critical system components and because DLL sideloading techniques are frequently utilized by attackers for persistence and privilege escalation. Given the common weaponization of these techniques, swift investigation and remediation are warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that also load DLLs from uncommon locations, which could lead to false positives if not carefully analyzed. It is crucial to maintain comprehensive logging and telemetry capture capabilities (Sysmon logs, File Integrity Monitoring) to reliably detect this behavior. Additionally, monitoring tools need a baseline to distinguish between normal operational behavior and attempts at malicious DLL sideloading. Companion detections in the environment for process injection (e.g., Sysmon Event ID 10) can provide further context and help confirm malicious intent.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
