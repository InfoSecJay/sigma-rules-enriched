title: Potential ShellDispatch.DLL Sideloading
id: 844f8eb2-610b-42c8-89a4-47596e089663
status: test
description: Detects potential DLL sideloading of "ShellDispatch.dll"
references:
- https://www.hexacorn.com/blog/2023/06/07/this-lolbin-doesnt-exist/
author: X__Junior (Nextron Systems)
date: 2023-06-20
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\ShellDispatch.dll'
  filter_main_legit_path:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\'
  - ImageLoaded|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some installers may trigger some false positives
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading involving "ShellDispatch.dll," which is often abused by attackers to execute malicious code under the guise of a legitimate process. The attacker’s objective is typically to achieve persistence or elevate privileges by using existing system processes to load malicious libraries. This corresponds to the MITRE ATT&CK tactic of Persistence and technique T1574.001 (DLL Side-Loading).

  Primary telemetry sources include Windows Event Logs for image load events, particularly focusing on Event ID 2050 for image loads, and relevant data from the Windows API. If malicious, this behavior may allow an adversary to maintain foothold/exploitation on a system without detection. However, this detection rule does NOT confirm that the loaded DLL is inherently malicious; it only indicates that a potentially suspicious loading behavior has been observed.

  ### Investigation Steps

  - **Review image load events:** Search for Event IDs related to image loads, especially Event ID 2050 in Security logs. Identify any processes that have loaded `ShellDispatch.dll` and note their parent process for context.

  - **Check the file path:** Validate the image load path. Friendly paths should originate from system directories (e.g., `C:\Windows\System32`); unexpected paths like `C:\Users\<username>\AppData\Local\Temp\` should raise flags.

  - **Analyze parent process behavior:** Investigate the parent process of the loaded DLL. For instance, if the parent is a system-level process (e.g., explorer.exe) and the DLL is loaded from a known good path, it may indicate benign activity.

  - **Identify high-confidence indicators:** List all loaded images and check for hashes or file signatures. If `ShellDispatch.dll` is running but does not match known good hashes, consider it a malicious indicator.

  - **Assess legitimate application installations:** Be aware that some installers may load DLLs during installation. Document any related installer processes and verify their legitimacy using software inventory.

  ### Prioritization

  The alert severity is medium, as the loading of "ShellDispatch.dll" can indicate made attempts at establishing persistence or privilege escalation. While sideloading is a common technique among adversaries, it can also result from benign activities like application installations, requiring careful triage.

  ### Blind Spots and Assumptions

  Sideloading detections may be limited by the presence of legitimate installations that load the same DLL. Effective detection depends on having reliable image load event logging configured. Activities related to application installations or updates could inadvertently trigger this alert. A companion detection for malicious process creation (e.g., suspicious child processes from installers) would help strengthen alert coverage against such threats.

