title: Potential ShellDispatch.DLL Sideloading
id: 844f8eb2-610b-42c8-89a4-47596e089663
status: test
description: Detects potential DLL sideloading of "ShellDispatch.dll"
references:
- https://www.hexacorn.com/blog/2023/06/07/this-lolbin-doesnt-exist/
author: X__Junior (Nextron Systems)
date: 2023-06-20
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\ShellDispatch.dll'
  filter_main_legit_path:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\'
  - ImageLoaded|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some installers may trigger some false positives
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the potential side-loading of the "ShellDispatch.dll" file, which could be used by an attacker to execute malicious code in the context of a legitimate Windows process. The likely objective of the attacker is to gain persistence or elevate privileges by leveraging this commonly used DLL in a way that bypasses typical security measures. This behavior maps to the MITRE ATT&CK tactics of Persistence and Defense Evasion (T1574.001: DLL Side-Loading).

  The primary telemetry source is Windows image load events, specifically targeting process creation events that include DLL loading activities, with a focus on the 'ImageLoaded' field. If malicious, this behavior can lead to unauthorized access or control over the system, posing a significant risk to the enterprise ecosystem. Importantly, this detection alone does NOT confirm active exploitation or direct malicious intent—further investigation is required to establish context.

  ### Investigation Steps

  - **Identify process initiation context:** Review event logs for Security Event ID 4688 (Process Creation) to identify which process initiated the load of "ShellDispatch.dll" and assess whether that process is legitimate (e.g., "explorer.exe" or similar system processes).

  - **Verify file origin and integrity:** Check the file path for "ShellDispatch.dll" in the context of Event ID 4656 (Handle Access) and correlate it to common locations like 'C:\Windows\System32\' or 'C:\Windows\Temp\.' Legitimate instances will typically originate from system directories, while deviations could indicate malicious activity.

  - **Assess timing and user context:** Cross-reference the process creation time with user logon events (Event ID 4624) to verify that the process loaded by the DLL aligns with expected user behavior and timelines. Malicious DLL loads may occur outside of normal user activity hours.

  - **Confirm legitimate software associations:** Investigate any installers or software recently executed that may have legitimately triggered this alert, recognizing that some installer processes could lead to false positives. Validate using installation logs or MSI events.

  - **Look for supporting indicators of compromise:** Examine for additional signs of DLL side-loading in Sysmon logs (Event ID 7) that may capture file creation or unexpected network connections initiated by processes loading "ShellDispatch.dll" indicating exfiltration or command-and-control activity.

  ### Prioritization

  Given the potential impact on systems processing sensitive data and the likelihood of this tactic being weaponized by attackers, alerts generated by this rule should be treated as medium severity. While the behavior could have benign explanations, repeated occurrences or contexts involving non-standard processes elevate the risk of malicious activity significantly.

  ### Blind Spots and Assumptions

  There are limitations to this detection due to potential evasion techniques such as renaming or encryption of the DLL file that may not be logged by default. Reliable detection requires that image load events are properly configured in the Windows Event Log. Additionally, legitimate software installations and updates could also trigger this alert, necessitating further context to ascertain true malicious intent. For comprehensive coverage, consider pairing this alert with detections for other common LOLBins (living off the land binaries) that could also threaten system integrity.

