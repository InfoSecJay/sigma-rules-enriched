title: Potential ShellDispatch.DLL Sideloading
id: 844f8eb2-610b-42c8-89a4-47596e089663
status: test
description: Detects potential DLL sideloading of "ShellDispatch.dll"
references:
- https://www.hexacorn.com/blog/2023/06/07/this-lolbin-doesnt-exist/
author: X__Junior (Nextron Systems)
date: 2023-06-20
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\ShellDispatch.dll'
  filter_main_legit_path:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\'
  - ImageLoaded|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some installers may trigger some false positives
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential side-loading of the malicious DLL "ShellDispatch.dll". Side-loading occurs when a legitimate application loads a DLL from an untrusted or unexpected path, which attackers exploit to execute malicious code in the context of that application. In this case, the suspected threat is framed around the use of "ShellDispatch.dll," a common file associated with initial access and persistence techniques in Windows environments. Attackers may leverage this method to evade defenses, maintain access, or escalate privileges.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1574.001)**: The use of sideloading as a method to establish persistence on a system.
  - **Defense Evasion**: By using valid system processes to load the malicious DLL, attackers can evade traditional detection mechanisms.
  - **Privilege Escalation**: Once the DLL is executed, it may perform further actions that elevate the attacker's privileges.

  Key data sources for this detection include image load logs provided by Windows, which record the loading of DLLs and their paths, crucial for identifying potential exploitation attempts.

  ### Investigation Steps
  - **Review Image Load Logs**: Examine the image load logs for any instances where "ShellDispatch.dll" was loaded from abnormal paths, particularly those aligned with user profile directories or the temp folders.
  - **Correlate Application Behavior**: Investigate the processes that loaded the DLL to determine if they were executing legitimate functions or if their behavior appears suspicious following the DLL load.
  - **Check for Known Indicators**: Use threat intelligence to evaluate if the "ShellDispatch.dll" has been previously documented in malicious activity and cross-reference hashes and paths.
  - **Analyze User Activity**: Assess the user accounts associated with the DLL loading events to identify any anomalies in normal usage patterns or unauthorized access.

  ### Prioritization
  The severity of this alert is medium, as it indicates potential malicious activity behind the sideloading of a sensitive DLL. Given the likelihood of exploitation and ability to gain footholds within enterprise environments, it warrants prompt investigation to mitigate risks.

  ### Blind Spots and Assumptions
  This detection may not capture all malicious activity related to DLL sideloading, particularly if attackers use alternate DLL names or if the DLL is loaded from a legitimate directory without deviation from expected patterns. The rule assumes that appropriate Windows image load logs are being generated and retained; without these logs, the effectiveness of the detection is compromised. Additionally, false positives may arise from legitimate software installation processes, potentially hindering accurate response efforts.

