logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\ShellDispatch.dll'
  filter_main_legit_path:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\'
  - ImageLoaded|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some installers may trigger some false positives
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the potential sideloading of the "ShellDispatch.dll" file, which is often used as a means for persistence by attackers in Windows environments. The likely attack objective is to execute malicious payloads by exploiting the DLL loading mechanism, allowing for actions that could lead to privilege escalation or further network compromise. Relevant MITRE ATT&CK tactics include Persistence and Defense Evasion (T1574.001). The primary telemetry sources are Image Load events, particularly monitoring for instances of ShellDispatch.dll being loaded from atypical paths, such as `C:\Users\<username>\AppData\Local\Temp` or `C:\Windows\Temp`. If the behavior is malicious, it can lead to unauthorized access or remote code execution. This detection does NOT confirm that the loaded DLL is malicious without additional context, as legitimate applications may also invoke this DLL.

  ---

  ### Investigation Steps

  - **Identify loading event: **Review Image Load telemetry for Event ID 202, filtering for entries where ImageLoaded ends with `\ShellDispatch.dll`. Check the associated process and user context to assess legitimacy.

  - **Validate execution paths: **Assess if the loaded DLL originated from a common user profile (`C:\Users\`) or Temp directories (`C:\Windows\Temp`). Uncommon loading paths may indicate malicious activity.

  - **Check process parentage: **Use Process Explorer or the Windows API to analyze the parent process of the shell loading event. Legitimate installs typically originate from trusted processes, while suspicious processes may point to established attack frameworks.

  - **Review installation patterns: **Determine if installs from known software vendors are involved. Be on the lookout for installation activity triggering Event ID 11707 from Windows Installer logs that may coincide with the Image Load event.

  - **Correlate with known threat actors: **Consult threat intelligence sources for recent campaigns associated with `ShellDispatch.dll` usage, comparing against unique characteristics in the event logs to identify potential threats.

  - **Assess system role and criticality: **Identify the asset role (e.g., server, endpoint) and its criticality. High-impact system compromise (e.g., domain controllers, file servers) warrants immediate escalation.

  ---

  ### Prioritization

  This alert holds medium severity as it indicates a non-standard behavior associated with system DLL loading, which may signify an attempt at persistence or privilege escalation. The likelihood of malicious abuse is elevated given the context and the specific targeting of DLL sideloading techniques which are common among adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for file name collisions or legitimate software behavior that may inadvertently trigger the rule. Logging configurations should ensure comprehensive coverage of Image Load events for all user sessions. Legitimate software installation (especially from installers) may falsely trigger this alert. A related detection for monitoring the loading of other suspicious DLLs or validating DLL integrity can help strengthen the coverage and minimize the risk of false positives.

