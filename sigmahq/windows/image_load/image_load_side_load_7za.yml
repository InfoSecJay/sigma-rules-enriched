  filters as needed.
level: low
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading activities involving the "7za.dll" file in a Windows environment. Sideloading occurs when a legitimate application is tricked into loading a malicious DLL, which can lead to code execution that compromises the system. The suspected threat scenario involves attackers leveraging this technique to escalate privileges or maintain persistence on a compromised host while masquerading their activities under the guise of legitimate processes.

  The relevant tactics and techniques associated with this behavior are:
  - **Defense Evasion** (TA0005)
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **Sideloading of dynamic-link libraries** (T1574.001)

  To effectively gather evidence of this behavior, primary data sources include image load events recorded by the Windows operating system, particularly targeting the DLL loading processes that might originate from unconventional paths outside standard program directories.

  ### Investigation Steps
  - **Review Image Load Events:** Analyze the logs for instances where "7za.dll" has been loaded. Pay close attention to the context in which it was loaded, looking for any irregular paths or associated executable files that are not from default installation directories.

  - **Correlate with Process Creation Events:** Investigate the process creation logs around the time of the DLL loading. Look for new or unusual processes that appear to have loaded "7za.dll," especially those running from user profile directories or other non-standard locations.

  - **Check for Anomalous Parent Processes:** Identify if any parent processes that loaded "7za.dll" have been flagged as suspicious or are known to exhibit malicious behavior. This may indicate further compromise or an attacker’s toolset.

  - **Investigate Other DLL Loading Activity:** Broaden the scope to include additional DLL files that may have been loaded in conjunction with "7za.dll." Look for patterns that may indicate a deliberate effort to hide malicious behavior within legitimate application processes.

  ### Prioritization
  The severity of this alert is considered low in an enterprise environment due to its potential for false positives from legitimate third-party applications. However, vigilance is necessary since the likelihood of attackers using trusted methods for DLL injection increases with evolving threat vectors.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage with respect to legitimate applications that may use "7za.dll" for encryption or compression tasks, which can generate false positives. The detection logic assumes that any loading of "7za.dll" not originating from standard installation paths is suspicious, but this may miss legitimate use cases. Proper logging from Windows image load events is essential for this alert to function effectively, along with a suitable configuration that allows for monitoring of application behavior in less common directories, such as user profile paths.

