detection:
  selection:
    ImageLoaded|endswith: '\7za.dll'
  filter_main_legit_path:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate third party application located in "AppData" may leverage this DLL 
  to offer 7z compression functionality and may generate false positives. Apply 
  additional filters as needed.
level: low
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of the "7za.dll" file, which is typically associated with compression and extraction utilities. Attackers may exploit this behavior to load malicious payloads by using a legitimate DLL from an unexpected location, thereby evading detection. The relevant MITRE ATT&CK tactic is "Persistence" (T1543) and the technique is "DLL Side-Loading" (T1574.001). The primary telemetry source is Windows image load events that capture attempts to load DLL files.

  If this behavior is malicious, it may indicate that an adversary is attempting to maintain persistence on a system or escalate privileges by masking their payload as a legitimate application. This detection does not confirm that the activity is malicious on its own, as it may also be triggered by legitimate applications using the same DLL.

  ### Investigation Steps

  - **Review image load events:** Check Windows Event ID  sentido que 4103 for any occurrences of "7za.dll." Compare the file path against known good paths (e.g., 'C:\Program Files (x86)\' and 'C:\Program Files\') to identify if it was loaded from a suspicious location.

  - **Identify execution context:** Examine the parent process of the image loading the "7za.dll" (check Event ID 4688) to see if it is initiated by a legitimate application like the 7-Zip software. Uncommon or unexpected parent processes may indicate malicious behavior.

  - **Cross-reference file reputation:** Use endpoint detection tools to check the SHA256 hash of the "7za.dll" being loaded. Confirm whether it is a verified version from a trusted source or if it has been modified.

  - **Expected legitimate behavior:** Note that legitimate uses of "7za.dll" may occur in directories such as 'C:\Program Files\7-Zip\'. If the DLL is loaded from 'C:\Users\<Username>\AppData\', it may indicate potential misuse.

  - **Inspect for file creation or modification:** Validate if any files were created or modified around the same time using File System Event IDs 4663 or similar file monitoring logs to ensure there are no related malicious artifacts.

  ### Prioritization

  This alert has a low severity in many enterprise contexts as it may indicate benign usage of "7za.dll" with legitimate applications. However, as DLL sideloading is a known technique for persistence and privilege escalation, further investigation is warranted, particularly if it aligns with indicators of malicious behavior.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate applications may also load "7za.dll" from non-standard paths, generating false positives. Proper configuration of log sources, specifically ensuring image load events and detailed process creation events are captured, is essential for reliable detection. Legitimate third-party applications that use "7za.dll" for compression may inadvertently trigger this alert. A related detection to consider is monitoring for unusual command line arguments associated with processes invoking "7za.dll", which may provide additional context for potential malicious activity.

