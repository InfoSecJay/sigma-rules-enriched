  ---

  ### Technical Context

  This Sigma rule detects DLL sideloading for the file "7za.dll," which may indicate an attempt by an adversary to load a malicious version of a legitimate library in order to gain unauthorized control or maintain persistence on a compromised system. The likely attacker objective is to execute malicious code while avoiding detection by leveraging trusted application paths. This behavior relates to the MITRE ATT&CK technique "DLL Side-Loading" (T1574.001). The primary telemetry source is Windows Event Logs, specifically targeting image load events indicating which DLLs are being loaded on the system.

  If successfully executed, this attack could lead to privilege escalation and extended access to target systems. Importantly, this detection alone does not confirm malicious activity; it merely indicates the presence of potentially suspicious DLL loading behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review DLL loading events:** Check Windows Security Event ID 4688 for process creation events that correspond with the timestamp of the alert, focusing on those that include "7za.dll" in the command line.

  - **Examine the file path:** Verify if "7za.dll" is being loaded from a non-standard path (e.g., locations outside "C:\Program Files\" or "C:\Program Files (x86)\"). Legitimate installations of this DLL should be found only in the standard program directories.

  - **Identify parent processes:** Look for the parent processes of the loading event to determine whether it originated from a legitimate application or if it was spawned by a potentially malicious process. Security Event ID 4688 will provide this information.

  - **Check for related artifacts:** Search for file creation events around the time of the alert using Sysmon Event ID 11 (File Created) to identify if the DLL was downloaded or created in a suspicious manner, particularly in the "AppData" folder.

  - **Evaluate historical behavior:** Analyze historical log data for any prior occurrences of "7za.dll" being loaded outside of the legitimate paths, which may suggest a pattern of malicious activity.

  - **Correlate with known benign activity:** Identify if legitimate applications using "7za.dll" exist in the environment. Compare user incidents with known instances of the application—such as software that uses 7z compression—to rule out false positives.

  ---

  ### Prioritization

  This alert has a low severity in an enterprise environment mainly due to the common usage of "7za.dll" in legitimate applications. However, the likelihood of malicious abuse exists as DLL sideloading techniques are frequently weaponized by adversaries to bypass security mechanisms and gain persistence.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by scenarios involving legitimate applications that may utilize "7za.dll" from paths such as "AppData," leading to potential false positives. The security team must ensure logging for Windows image loads is adequately configured to catch these activities. Additionally, the tactic may not account for adversaries using other DLLs or methods for evasion. A related detection that strengthens coverage is the monitoring of unusual outbound connections made by processes that loaded "7za.dll," which could indicate data exfiltration attempts.

