detection:
  selection:
    ImageLoaded|endswith: '\7za.dll'
  filter_main_legit_path:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate third party application located in "AppData" may leverage this DLL 
  to offer 7z compression functionality and may generate false positives. Apply 
  additional filters as needed.
level: low
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of "7za.dll", indicating that a non-standard or potentially malicious version of this file is being loaded into memory. Attackers may leverage this behavior as a part of their persistence strategy or as a means of privilege escalation to execute arbitrary code. This aligns with the MITRE ATT&CK framework's tactic of Defense Evasion and Persistence, specifically technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources include Windows image load events, specifically where the "ImageLoaded" field reports the loading of the specified DLL. If malicious, this might enable attackers to execute code that can bypass security controls. Importantly, this detection does not confirm that the activity is malicious by itself; legitimate applications might also load "7za.dll" from expected paths.

  ### Investigation Steps

  - **Check the loading path:**
    Look for "ImageLoaded" events where the path ends with '\7za.dll'. Validate this against expected paths in "C:\Program Files" or "C:\Program Files (x86)". Malicious sideloading attempts may attempt to load from unexpected directories, e.g., user profiles or temporary folders.

  - **Review the process creation logs:**
    Examine Security Event ID 4688 for process creation events corresponding to the loading of the "7za.dll". Look for anomalies, like execution from paths such as "C:\Users\<username>\AppData\". Legitimate use typically involves recognizable processes like "7-Zip" or installer executables.

  - **Validate the parent process:**
    Identify the parent process of the DLL load events (e.g., Filtering for "NewProcessName"). Malicious indicators may involve suspicious executables or scripts initiating the loading, especially from non-standard directories.

  - **Evaluate DLL signature:**
    Analyze the "Image" field for the loaded DLL’s signature. Verify if it's signed by a legitimate owner. Unsigned or poorly signed versions of "7za.dll" may indicate malicious tampering.

  - **Assess system criticality:**
    Determine if the system running the detected behavior holds any critical data or services. Malicious activity in high-value assets raises severities significantly, emphasizing immediate action.

  - **Monitor related process behavior:**
    Correlate this alert with other telemetry, like Sysmon Event ID 10, which provides file create activity. High-frequency file creations or executions in proximity to the DLL load can indicate malicious activity such as file exfiltration or further command-and-control actions.

  ### Prioritization

  This alert is classified as low severity due to the low likelihood of widespread abuse specific to "7za.dll" unless correlated with other malicious behaviors. However, on systems hosting sensitive data or critical operations, the impact can escalate significantly; thus, vigilance is warranted.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as modifying DLL signatures or using legitimate third-party applications benignly utilizing "7za.dll". Reliable detection relies on comprehensive provisioning of Windows image load logs and ensuring proper Sysmon configurations are in place. Legitimate application updates may also trigger this alert. A companion detection, such as monitoring scripts for unusual execution paths or tracking API calls involved in executable loading, could enhance alerting fidelity.

