note: |
  ### Technical Context

  This rule detects the loading of unsigned modules by ClickOnce applications, which is a method used by adversaries to execute code with user permissions. The likely objective is to bypass security mechanisms such as Windows SmartScreen, enabling the execution of potentially malicious payloads without alerts or warnings. This behavior maps to MITRE ATT&CK techniques including Privilege Escalation (T1574.001) and Application Layer Protocol (T1071.001).

  The primary telemetry source is Windows image load events recorded under the Windows Event Log (specifically within the Application log), as well as Sysmon logs if configured. If malicious, this behavior could result in unauthorized code execution, leading to potential system compromise. It is important to note that the detection of this behavior does NOT alone confirm malicious intent; it requires further contextual investigation.

  ### Investigation Steps

  - **Check the loading application source: **Verify the path for the loaded module against known installations, focusing on `C:\Users\<username>\AppData\Local\Apps\2.0\`. Legitimate ClickOnce apps usually load from this directory.

  - **Review signature status: **In Windows Event ID 4658 (Image Load), inspect the `SignatureStatus` field for any entries marked as `Unsigned` or `Expired`. These statuses indicate potential risks, especially if paired with suspicious application behavior.

  - **Assess the execution environment: **Investigate the context of the ClickOnce application execution. Use Sysmon Event ID 1 to trace the parent process ID and confirm whether it originated from a trusted application.

  - **Correlate with other alerts: **Cross-reference this event with potential related logs (such as AppLocker or Device Guard logs) for additional signs of policy violations or other suspicious loading events.

  - **Evaluate system impact: **Determine the criticality of the affected system. For example, loading unsigned ClickOnce applications on a domain controller could result in higher risks than loading them on a user workstation.

  - **Collect further telemetry: **Look for file creation events (using Windows Event ID 4663) for any files created by the ClickOnce application. This can indicate whether the application is attempting to modify the system or escalate privileges.

  ### Prioritization

  This alert holds medium severity due to its potential for impacting user workstations or servers when executing unsigned applications. The likelihood of malicious abuse is moderate, as attackers often weaponize vulnerabilities in trusted application environments. This detection, however, is not commonly seen in benign user behavior.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not adequately configured to capture image loads and associated event IDs. Legitimate corporate applications may load unsigned modules for functionality, particularly during initial installations. Additionally, obtaining companion detections from process creation or network connections may provide a more comprehensive view of the application's behavior and intent.

