  ---

  ### Technical Context

  The rule detects the loading of an unsigned or expired signed module by a ClickOnce application, which is often exploited by attackers to execute malicious code on a Windows system. The primary objective of such behavior is to escalate privileges or maintain persistence by bypassing standard security checks like Windows SmartScreen. This behavior falls under the MITRE ATT&CK tactic of “Privilege Escalation” (T1068) and “Defense Evasion” (T1574.001).

  The primary telemetry source for this detection is image load logs from Windows, specifically observing the load paths associated with ClickOnce applications, typically found in the `C:\Users\<Username>\AppData\Local\Apps\2.0\` directory. If malicious, this behavior could lead to unauthorized access to sensitive information or system compromise. However, this detection does NOT confirm that the behavior is inherently malicious, as there are legitimate use cases for unsigned or expired modules in testing or controlled environments.

  ---

  ### Investigation Steps

  - **Verify the process context**: Check the parent process of the ClickOnce application using Sysmon Event ID 1. Look for any suspicious parent processes (e.g., unusual command-line arguments or signatures) that might indicate malicious activity.

  - **Inspect the module path**: Review any loaded modules associated with the ClickOnce application in the application directory (C:\Users\<Username>\AppData\Local\Apps\2.0\). Malicious indicators include paths that deviate from standard software installations or alternate locations outside the expected ClickOnce structure.

  - **Assess the signature status**: Analyze the digital signature status of the loaded module using Windows Event ID 4688 with the `NewProcessName` field. Modules with a signature status of 'Unsigned' or 'Expired' should be flagged for deeper inspection.

  - **Identify legitimate activity patterns**: Compare the behavior against known good usage patterns for your organization’s ClickOnce applications. Legitimate modules typically have valid signatures and are sourced from trusted publishers, which can be cross-referenced against internal software inventory.

  - **Correlate with user behavior**: Check user activity logs for any abnormalities, such as accessing the ClickOnce application during hours when the user normally isn't active, using logs from Microsoft 365 auditing or Windows Security Event ID 4624 (Logon).

  - **Look for evidence of persistence**: Examine the registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall\` for newly added entries matching the ClickOnce application to identify potential artifacts of persistence attempts.

  ---

  ### Prioritization

  This alert poses a medium severity in an enterprise context due to the potential impact on compromised systems and the likelihood of exploitation by adversaries seeking to evade defenses through signed or unsigned modules. The use of ClickOnce as a delivery mechanism for malware is recognized as a method employed in contemporary attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from the use of legitimate unsigned modules in internal applications or development routines, which could inadvertently trigger the alert without malicious intent. Ensure that appropriate image load logs are enabled for reliable detections, as well as correlation with software deployment logs. A related detection to consider enhancing coverage would be monitoring for unusual command-line parameters used by ClickOnce applications via Sysmon, which may identify further malicious behavior.

