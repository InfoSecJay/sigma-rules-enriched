note: |
  ### Technical Context

  This Sigma rule detects the loading of unsigned modules by ClickOnce applications, specifically targeting any executable loaded from the `\AppData\Local\Apps\2.0\` path. Attackers may exploit ClickOnce deployment mechanisms to execute unsigned or malicious code, often bypassing standard security measures. The rule aligns with the MITRE ATT&CK technique of "Trusted Developer Utilities" (T1574.001), which enables adversaries to leverage trusted execution frameworks to maintain persistence or facilitate privilege escalation.

  The primary telemetry source for this detection is Windows image load events, specifically monitoring the loading of executables within user profiles. If malicious, the loading of such unsigned modules could allow attackers to execute arbitrary code or implant malware on a targeted system. However, this detection alone does NOT confirm malicious intent; unsigned modules can also appear in legitimate software, particularly in development or testing scenarios.

  ### Investigation Steps

  - **Verify event logs for image loads:** Check Windows Event ID 4104 (from Sysmon) for details on any module loaded from `\AppData\Local\Apps\2.0\`. Look for the `Image` field containing this path.

  - **Check the signature status of the module:** Identify the `SignatureStatus` in the logs to establish if it is marked as 'false' or has an 'Expired' signature, which indicates non-compliance with security standards typical of legitimate software.

  - **Correlate user behavior:** Match the loading event with user activity logs. If the user had recently initiated a ClickOnce application download or installation, this may suggest benign activity.

  - **Identify known benign ClickOnce applications:** Prepare a list of expected applications within the organization that utilize ClickOnce for updates or installation. Compare logs against this list to differentiate between legit and suspicious activities.

  - **Review host impact:** Consider the criticality of the systems affected. If the ClickOnce application runs on critical infrastructure or servers, raise the urgency of the investigation due to potential severe impact.

  ### Prioritization

  This alert warrants medium severity due to the potential for privilege escalation and persistence in an enterprise environment. The likelihood of misuse is notable, given that the behavior aligns with known exploitation techniques. Unsigned module executions are less common in legitimate enterprise contexts, increasing concern for potential malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all ClickOnce applications executed in the environment, particularly if some instances rely on custom executables. It assumes proper logging configurations are in place to capture relevant telemetry. A common legitimate activity that may trigger this alert includes the installation of internal applications by developers or IT staff. Related detections, such as monitoring for new installations or updates of ClickOnce applications, can provide enhanced context and strengthen overall coverage against this technique.

