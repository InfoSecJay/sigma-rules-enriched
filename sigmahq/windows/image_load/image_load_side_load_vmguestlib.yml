title: VMGuestLib DLL Sideload
id: 70e8e9b4-6a93-4cb7-8cde-da69502e7aff
status: test
description: Detects DLL sideloading of VMGuestLib.dll by the WmiApSrv service.
references:
- https://decoded.avast.io/martinchlumecky/png-steganography/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-01
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|contains|all:
    - '\VMware\VMware Tools\vmStatsProvider\win32'
    - '\vmGuestLib.dll'
    Image|endswith: '\Windows\System32\wbem\WmiApSrv.exe'
  filter:
    Signed: 'true'
  condition: selection and not filter
falsepositives:
- FP could occur if the legitimate version of vmGuestLib already exists on the 
  system
level: medium
note: |
  ### Technical Context

  This detection rule identifies the loading of the `vmGuestLib.dll` file by the `WmiApSrv.exe` service, which is likely an indication of DLL sideloading. The attacker may aim to leverage this behavior to execute malicious payloads or maintain persistence on the system by hijacking a legitimate service. Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and **Persistence** (TA0003), specifically under the technique **DLL Search Order Hijacking** (T1574.001). The primary telemetry sources involved are image load events from Windows, particularly focusing on the paths and signatures of loaded DLLs. If malicious, the security impact could be severe, including unauthorized access or system compromise. However, this detection does NOT confirm malicious intent alone, as it can trigger from legitimate applications under specific conditions.

  ### Investigation Steps

  - **Review WmiApSrv service behavior:** Check Windows Service logs (Event ID 7036) for unusual start or stop events related to `WmiApSrv.exe`. Legitimate behavior includes a regular operational schedule and interaction with VMware Tools if installed.

  - **Analyze DLL loading instances:** Examine image load events; specifically, look for Event ID 1102 from Microsoft-Windows-Kernel-Process. Malicious indicators include `vmGuestLib.dll` being loaded by `WmiApSrv.exe` without a valid signature.

  - **Verify DLL signatures:** Use PowerShell or a similar tool to check the signature of `vmGuestLib.dll` loaded during the incident. A legitimate signature from VMware is expected; absence of a valid signature strongly indicates malicious manipulation.

  - **Inspect system for existing VMGuestLib:** Confirm the presence of a legitimate version of `vmGuestLib.dll` in the expected path (`C:\Program Files\VMware\VMware Tools\vmStatsProvider\win32`). If the file is absent, deeper investigation is warranted.

  - **Correlate with other telemetry:** Meld findings with endpoint detection logs (Sysmon Event ID 7) to understand context. Look for simultaneous suspicious behaviors such as unexpected network connections or process creations.

  ### Prioritization

  This alert is of medium severity due to the critical nature of the WMI service in Windows and its potential to be leveraged for persistence by an adversary. The likelihood of malicious abuse is significant, particularly as sideloading techniques are common in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may inaccurately trigger in cases where legitimate versions of `vmGuestLib.dll` are already present on the system, particularly in environments using VMware. Reliable detection depends on complete logging from image load events and service behavior. Legitimate application installations or updates from VMware can inadvertently trigger this alert. Companion detections such as unusual process creation events associated with `WmiApSrv.exe` would further strengthen coverage and accuracy.

