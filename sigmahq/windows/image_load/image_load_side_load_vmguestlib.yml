logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|contains|all:
    - '\VMware\VMware Tools\vmStatsProvider\win32'
    - '\vmGuestLib.dll'
    Image|endswith: '\Windows\System32\wbem\WmiApSrv.exe'
  filter:
    Signed: 'true'
  condition: selection and not filter
falsepositives:
- FP could occur if the legitimate version of vmGuestLib already exists on the 
  system
level: medium
note: |
  ### Technical Context

  This rule detects the DLL sideloading of `VMGuestLib.dll`, specifically when loaded by the `WmiApSrv.exe` service. This behavior is indicative of an adversary attempting to leverage a trusted process to execute potentially malicious code, facilitating persistence and possibly privilege escalation in a Windows environment. The relevant MITRE ATT&CK tactic is **Persistence** and the technique is **DLL Side-Loading (T1574.001)**.

  The primary telemetry sources are Windows event logs related to image loading, particularly `ImageLoad` events that contain the specific paths for the DLL and the executable. If malicious, this could lead to unauthorized access or control over the system, potentially allowing further attacks within the network. However, it’s important to note that this detection does not confirm that malicious behavior has occurred; it merely indicates a suspicious loading of the DLL that requires further investigation.

  ### Investigation Steps

  - **Verify the loading process: ** Check Windows Event ID 4104 for the loading of `vmGuestLib.dll` by `WmiApSrv.exe`. Analyze the timestamp and context to understand if the loading corresponds with unusual activity or known legitimate operations.

  - **Review DLL signature: ** Investigate the digital signature of the `vmGuestLib.dll` using PowerShell command `Get-AuthenticodeSignature 'PATH_TO_VMGuestLib.dll'`. Legitimate versions should be signed by VMware, while unauthorized versions may not be signed or have altered signatures.

  - **Identify legitimate WmiApSrv.exe behavior: ** Determine baseline activity for `WmiApSrv.exe`. It typically communicates with VMware tools and might have legitimate DLL loads. Document its behavior under normal conditions, such as the timing and content of its interactions with other services.

  - **Correlate with other telemetry: ** Cross-reference Event ID 4688 for process creation events and Event ID 4689 for process termination linked to `WmiApSrv.exe`. Look for unusual parent-child relationships that may suggest evasion techniques (e.g., loaded DLLs from non-standard locations).

  - **Check for known IOCs: ** Compare the hash of `vmGuestLib.dll` against known malicious indicators from threat intelligence sources. Use tools like Windows Security’s built-in capabilities or third-party solutions to automate this process.

  ### Prioritization

  The alert severity is medium due to the potential impact on enterprise systems. Given that DLL sideloading is an established technique used by attackers for persistence and privilege escalation, there is a moderate likelihood of malicious activity being evident. This behavior, although uncommon in standard operations, can be weaponized effectively by adversaries.

  ### Blind Spots and Assumptions

  This detection may miss evasion tactics if legitimate `vmGuestLib.dll` already exists on the system prior to an attack. Reliable detection requires logging of image load events, and if this logging is not appropriately configured, the system could overlook important alerts. Legitimate administrative activities involving VMware utilities may also trigger these alerts. A companion detection for a more robust approach could include monitoring suspicious parent processes using Event ID 4688 to observe the usage of `WmiApSrv.exe`.

