title: VMGuestLib DLL Sideload
id: 70e8e9b4-6a93-4cb7-8cde-da69502e7aff
status: test
description: Detects DLL sideloading of VMGuestLib.dll by the WmiApSrv service.
references:
- https://decoded.avast.io/martinchlumecky/png-steganography/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-01
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|contains|all:
    - '\VMware\VMware Tools\vmStatsProvider\win32'
    - '\vmGuestLib.dll'
    Image|endswith: '\Windows\System32\wbem\WmiApSrv.exe'
  filter:
    Signed: 'true'
  condition: selection and not filter
falsepositives:
- FP could occur if the legitimate version of vmGuestLib already exists on the system
level: medium
note: |
  ### Technical Context
  This detection rule identifies the malicious activity of DLL sideloading specifically targeting the `VMGuestLib.dll` library by the `WmiApSrv.exe` service on Windows systems. DLL sideloading occurs when an attacker places a malicious DLL file in a location where a legitimate application loads it instead of its intended, benign counterpart. This technique allows attackers to execute arbitrary code with the privileges of the application that has loaded the DLL. In this case, the likely objective is to maintain persistence, achieve privilege escalation, or evade detection by using functionality that is inherently trusted by the operating system.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1203)**: This technique relates to sideloading to avoid detection by leveraging trusted services or applications.
  - **Persistence (T1574.001)**: DLL sideloading can establish persistence on a system as the method can be reused across system reboots and application restarts.
  - **Privilege Escalation (T1068)**: Attackers may leverage the permissions of a benign service execution context to gain higher access privileges.

  To collect pertinent evidence regarding this detection, the primary data sources would include:
  - **Image Load Events**: Tracking DLL and executable loading can pinpoint untrusted DLLs being invoked by trusted processes.
  - **Process Creation Events**: Monitoring image loads alongside process creation assists in identifying which legitimate services are invoking potentially malicious DLLs.

  ### Investigation Steps
  - **Review Image Load Logs**: Inspect logs for the `WmiApSrv.exe` process to see if it has loaded `vmGuestLib.dll` from an untrusted location, indicating potential malicious activity.
  - **Analyze Process Creation Events**: Analyze associated process creation events around the time of the suspicion to observe any irregular spawning of processes that may correlate with the DLL loading.
  - **Check File Signatures**: Validate the digital signatures of `vmGuestLib.dll` to discern if an unexpected or unauthorized version is present in the trusted directories.
  - **Monitor for Unusual Behavior**: Watch for any signs of privilege escalation or unauthorized persistence associated with the `WmiApSrv.exe` service, including unexpected network connections or file modifications.

  ### Prioritization
  This alert carries a medium severity level as successful DLL sideloading can lead to significant security implications, including unauthorized access and persistence within an enterprise system. The likelihood of exploitation depends on the attacker's access level but remains a notable risk in environments with misconfigured trust boundaries.

  ### Blind Spots and Assumptions
  This detection may struggle with false positives should a legitimate version of `vmGuestLib.dll` already exist on the system. Moreover, it assumes that the `WmiApSrv.exe` has not been tampered or replaced, and that logging is adequately configured to capture image loads in real-time. Additionally, if the attacker's technique involves moving the DLL into a whitelisted path or altering normal file paths, detection may be evaded entirely without comprehensive telemetry across all critical endpoints.

