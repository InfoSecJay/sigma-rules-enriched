title: Potential CCleanerDU.DLL Sideloading
id: 1fbc0671-5596-4e17-8682-f020a0b995dc
status: test
description: Detects potential DLL sideloading of "CCleanerDU.dll"
references:
- https://lab52.io/blog/2344-2/
author: X__Junior (Nextron Systems)
date: 2023-07-13
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\CCleanerDU.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files\CCleaner\'
    - 'C:\Program Files (x86)\CCleaner\'
    Image|endswith:
    - '\CCleaner.exe'
    - '\CCleaner64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives could occur from other custom installation paths. Apply 
  additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading of "CCleanerDU.dll" when loaded alongside CCleaner executables. It targets malicious behavior where attackers leverage legitimate software to load malicious libraries, aiming to bypass security controls and achieve persistence or elevate privileges on compromised systems. The relevant MITRE ATT&CK techniques include Defense Evasion (T1574.001) and Persistence, as the sideloaded DLL is potentially leveraged for unauthorized actions on affected endpoints. Primary telemetry sources for this detection include image load events from Windows, specifically capturing the loading of DLL files using logs that track application behavior. If the detected DLL is indeed a malicious payload, it poses risks such as data theft, system compromise, or further lateral movement. It is important to note that this detection does NOT confirm malicious intent on its own; further context is required to determine the legitimacy of the DLL and associated activities.

  ### Investigation Steps

  - **Review image load events:** Check Windows Event ID 4688 or Sysmon Event ID 10 for image load events showing `CCleanerDU.dll` loaded by `CCleaner.exe` or `CCleaner64.exe`. Compare timestamps between the DLL load and user activity to assess if it aligns with normal operations.

  - **Validate legitimate installation paths:** Investigate the paths from which `CCleanerDU.dll` is loading. Legitimate installations typically reside in `C:\Program Files\CCleaner\` or `C:\Program Files (x86)\CCleaner\`. Any deviation from these may indicate suspicious behavior.

  - **Analyze process creation context:** Examine the parent process of the CCleaner executable loading the DLL. Use Event ID 4688 to ensure it's launched from a legitimate user session and not by an anomalous process such as `cmd.exe` or `powershell.exe`.

  - **Correlate with known malicious indicators:** Check for any reported hash values associated with `CCleanerDU.dll`, cross-referencing with threat intelligence platforms or internal reference data to identify any known malicious variants.

  - **Check for unusual outbound traffic:** Inspect network activity to detect potential exfiltration attempts from the host where the DLL was loaded. Look for unusual connections or large data transfers originating from `CCleaner` or related processes.

  - **Identify high-confidence indicators:** Look for a recent pattern of DLL loading that deviates from historical behavior, such as frequent loads of `CCleanerDU.dll` without related user actions, signaling a potential compromise.

  ### Prioritization

  This alert is of medium severity in enterprise contexts as it involves potential misuse of a widely used application, CCleaner. Given the tool's commonality and the likelihood of being weaponized for evasion techniques, it necessitates prompt investigation to assess the extent of any malicious exploitation.

  ### Blind Spots and Assumptions

  There are detection limitations such as potential evasion through custom installation paths, which could result in false positives. Comprehensive collection of image load telemetry across systems is essential for accurate detection. Legitimate activity may include routine maintenance tasks performed with CCleaner on systems. Companion detections such as monitoring file integrity changes or execution of scripts using PowerShell could strengthen overall coverage against this attack vector.

