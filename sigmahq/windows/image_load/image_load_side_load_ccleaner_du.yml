title: Potential CCleanerDU.DLL Sideloading
id: 1fbc0671-5596-4e17-8682-f020a0b995dc
status: test
description: Detects potential DLL sideloading of "CCleanerDU.dll"
references:
- https://lab52.io/blog/2344-2/
author: X__Junior (Nextron Systems)
date: 2023-07-13
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\CCleanerDU.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files\CCleaner\'
    - 'C:\Program Files (x86)\CCleaner\'
    Image|endswith:
    - '\CCleaner.exe'
    - '\CCleaner64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives could occur from other custom installation paths. Apply 
  additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This rule detects the potential sideloading of the "CCleanerDU.dll" library through the legitimate process loaders of CCleaner. An attacker may aim to execute malicious code by tricking the CCleaner executable into loading a compromised DLL, thereby evading standard detection mechanisms while maintaining the original process's functionality. This behavior fits within the MITRE ATT&CK framework under the tactic of Persistence and the technique of DLL Search Order Hijacking (T1574.001). The primary telemetry source for this detection comes from Windows event logs, specifically image load events that track DLL loading activities.

  If the detected behavior is malicious, it poses a significant risk of privilege escalation and unauthorized access to sensitive data or system resources. It’s important to note that this detection does NOT definitively confirm malicious behavior on its own, as legitimate applications may utilize the same DLL paths without nefarious intent.

  ### Investigation Steps

  - **Investigate process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for the execution of "CCleaner.exe" or "CCleaner64.exe" around the time the DLL was loaded. Legitimate instances will generally originate from known installation paths.

  - **Validate DLL file integrity:** Review file creation or modification timestamps of "CCleanerDU.dll" located in the specified directories. Legitimate installations will have consistent timestamps matching their main executable installation.

  - **Check parent process relationships:** Use Sysmon Event ID 1 to trace the parent process of the CCleaner executable. If an unexpected process (e.g., a download manager or script) launched CCleaner, this could indicate potential malicious exploitation.

  - **Examine command-line arguments:** For "CCleaner.exe" instances, inspect the command line for unusual flags or arguments that may indicate abuse or non-standard usage, such as automation via scripts or stealthy operations.

  - **Look for known malicious signatures:** Query threat intelligence sources for known malicious variants of "CCleanerDU.dll." Cross-reference SHA256 hashes against any indexed malicious DLLs to detect potential matches.

  - **Assess system roles and criticality:** Identify the host role where the alert triggered. If it’s on a critical server or asset, elevate the priority for deeper analysis, as sideloading campaigns may be more impactful in sensitive environments.

  ### Prioritization

  The alert has medium severity due to its potential to enable persistence or privilege escalation on user workstations or servers. The likelihood of abuse is notable, as DLL sideloading tactics are often weaponized by adversaries. However, the presence of this alert does not guarantee malicious intent and must be correlated with additional evidence.

  ### Blind Spots and Assumptions

  Evasion techniques for this detection may include altering the loading paths or methods of execution to obscure the true origin of the DLL. Reliable detection requires comprehensive logging from Sysmon or similar tools, capturing all relevant image loading events. Legitimate uses, such as regular software updates or custom installations of CCleaner, may inadvertently trigger this alert. Companion detections for process injection or other anomalies (e.g., abnormal network activity by the same process) can enhance awareness of potential threats.

