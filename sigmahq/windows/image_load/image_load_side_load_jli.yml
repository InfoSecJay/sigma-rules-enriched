title: Potential JLI.dll Side-Loading
id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
status: experimental
description: |
  Detects potential DLL side-loading of jli.dll.
  JLI.dll has been observed being side-loaded by Java processes by various threat actors, including APT41, XWorm,
  and others in order to load malicious payloads in context of legitimate Java processes.
references:
- https://securelist.com/apt41-in-africa/116986/
- https://lab52.io/blog/snake-keylogger-in-geopolitical-affairs-abuse-of-trusted-java-utilities-in-cybercrime-operations/
- https://hijacklibs.net/entries/3rd_party/oracle/jli.html
- https://www.proofpoint.com/us/blog/threat-insight/phish-china-aligned-espionage-actors-ramp-up-taiwan-semiconductor-targeting
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-25
modified: 2025-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\jli.dll'
  filter_main_legitimate_install_paths:
    ImageLoaded|startswith:
            # Keeping the paths generic as jli.dll was found inside various directories of installed software
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    Description: 'OpenJDK Platform binary'
    OriginalFileName: 'jli.dll'
    Product|startswith: 'OpenJDK Platform'
    Signed: 'true'
  filter_optional_eclipse:
    ImageLoaded|startswith: 'C:\eclipse\plugins\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious DLL side-loading activity involving the jli.dll file, commonly associated with Java processes. Threat actors, including APT41 and XWorm, have exploited this technique to load malicious payloads under the guise of legitimate Java operations. By leveraging DLL side-loading, attackers can minimize detection while executing their payloads in a trusted context, ultimately aiming for persistence, privilege escalation, or lateral movement within a network.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1070)
  - **Persistence** (T1547)
  - **Privilege Escalation** (T1068)
  - **DLL Search Order Hijacking** (T1574.001)

  Primary data sources for this detection include image load events from Windows processes, specifically focusing on logging mechanisms that capture DLL loading, such as process creation events and application logs.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze logs for any instances of jli.dll being loaded outside of trusted paths, especially if detected in user directories or application data paths, indicating potential malicious activity.

  - **Inspect Parent Processes**: Identify the parent processes loading jli.dll. Legitimate instances typically stem from OpenJDK binaries; any anomalies or unexpected processes should be investigated further.

  - **Check for Known Malicious Indicators**: Correlate the identified image loads with known malicious signatures or behaviors sourced from threat intelligence related to APT41 or XWorm to assess the risk level.

  - **Validate Install Paths**: Ensure that jli.dll is genuinely signed and originates from recognized vendors, such as Oracle or trusted installations, focusing primarily on those installed in designated program files paths.

  ### Prioritization
  The alert's severity is high due to the considerable potential for attackers to gain unauthorized access and execute malicious code while remaining undetected by traditional security measures. Given that this technique has been used in recent high-profile compromises, swift investigation and response are crucial in preventing further exploitation.

  ### Blind Spots and Assumptions
  The detection logic may not cover all side-loading techniques or indicators of compromise, particularly if attackers use non-standard installation paths or modify legitimate binaries. The efficacy of this rule relies on properly configured logging mechanisms that capture image load events accurately; any absence of such logs may result in missed detections. Furthermore, the detection assumes that jli.dll is not loading from alternate, non-standard, or hidden paths that could circumvent this rule.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
