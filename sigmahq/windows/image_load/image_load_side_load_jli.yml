title: Potential JLI.dll Side-Loading
id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
status: experimental
description: |
  Detects potential DLL side-loading of jli.dll.
  JLI.dll has been observed being side-loaded by Java processes by various threat actors, including APT41, XWorm,
  and others in order to load malicious payloads in context of legitimate Java processes.
references:
- https://securelist.com/apt41-in-africa/116986/
- https://lab52.io/blog/snake-keylogger-in-geopolitical-affairs-abuse-of-trusted-java-utilities-in-cybercrime-operations/
- https://hijacklibs.net/entries/3rd_party/oracle/jli.html
- https://www.proofpoint.com/us/blog/threat-insight/phish-china-aligned-espionage-actors-ramp-up-taiwan-semiconductor-targeting
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-25
modified: 2025-10-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\jli.dll'
  filter_main_legitimate_install_paths:
    ImageLoaded|startswith:
            # Keeping the paths generic as jli.dll was found inside various directories of installed software
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    Description: 'OpenJDK Platform binary'
    OriginalFileName: 'jli.dll'
    Product|startswith: 'OpenJDK Platform'
    Signed: 'true'
  filter_optional_eclipse:
    ImageLoaded|startswith: 'C:\eclipse\plugins\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `jli.dll` library in potentially unauthorized contexts, which is a technique often employed by attackers to exploit trusted software processes, particularly Java applications such as OpenJDK. The likely objective of the attacker is to execute malicious payloads while masquerading as legitimate Java processes, enabling persistence and privilege escalation on compromised systems. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution (TA0002) and specifically the technique of DLL Search Order Hijacking (T1574.001).

  The primary telemetry source for this detection is the Windows Image Load events, specifically focusing on `ImageLoaded` events. If malicious, this activity may lead to unauthorized access or control of systems, data exfiltration, or further compromise through persistence mechanisms. Importantly, this detection does NOT confirm that the loading of `jli.dll` is malicious on its own; it must be contextualized with other investigations and indicators.

  ### Investigation Steps

  - **Review loaded DLLs:** Examine Windows Event ID 4107 (Image Load) logs for instances of `jli.dll`. Determine the context in which it was loaded, especially focusing on paths outside legitimate program locations (such as `C:\Program Files\`). Unusual paths may indicate malicious intent.

  - **Analyze associated processes:** Identify the parent process of the `jli.dll` loads by correlating with Event ID 4688 (Process Creation). Check if the parent process is a known or trusted Java application (e.g., OpenJDK). A suspicious or unexpected parent process warrants further investigation.

  - **Check digital signatures:** Validate the digital signature of `jli.dll` loaded from unexpected directories. Legitimate installations from OpenJDK should have a valid signature attributed to Oracle or similar trusted entities. Unverified signatures indicate potential compromise.

  - **Monitor file activity:** Utilize Sysmon Event ID 11 to track file creation events around the time of the `jli.dll` load. Look for unusual file creation in common directories that may indicate attempts to stage malware alongside legitimate processes.

  - **Identify legitimate Java behavior:** Recognize that legitimate Java applications, including Eclipse and OpenJDK processes, often load `jli.dll` from standard program paths. Ensure that any instances of `jli.dll` in these contexts correlate with normal user activities or installed software.

  - **Catalog system criticality:** If the affected system is a server or handles sensitive data, prioritize further review, as such environments are typically targeted for persistence and privilege escalation by adversaries.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems when `jli.dll` is loaded maliciously. Given that this technique is actively weaponized by threat actors, including APT groups, a trained response team should prioritize investigation to avoid further compromise.

  ### Blind Spots and Assumptions

  Detection may be limited if `ImageLoad` logs are not consistently captured or if the attacker employs evasion techniques, such as altering the loading behavior of `jli.dll`. This rule may also generate false positives in environments with legitimate Java applications. It's essential to integrate additional detections, such as monitoring for unusual process behaviors or combining with process integrity checks, to provide a more holistic view of potential threats.

