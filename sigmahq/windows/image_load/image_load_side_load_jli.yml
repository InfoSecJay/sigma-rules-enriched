title: Potential JLI.dll Side-Loading
id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
status: experimental
description: |
  Detects potential DLL side-loading of jli.dll.
  JLI.dll has been observed being side-loaded by Java processes by various threat actors, including APT41, XWorm,
  and others in order to load malicious payloads in context of legitimate Java processes.
references:
- https://securelist.com/apt41-in-africa/116986/
- https://lab52.io/blog/snake-keylogger-in-geopolitical-affairs-abuse-of-trusted-java-utilities-in-cybercrime-operations/
- https://hijacklibs.net/entries/3rd_party/oracle/jli.html
- https://www.proofpoint.com/us/blog/threat-insight/phish-china-aligned-espionage-actors-ramp-up-taiwan-semiconductor-targeting
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-25
modified: 2025-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\jli.dll'
  filter_main_legitimate_install_paths:
    ImageLoaded|startswith:
            # Keeping the paths generic as jli.dll was found inside various directories of installed software
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    Description: 'OpenJDK Platform binary'
    OriginalFileName: 'jli.dll'
    Product|startswith: 'OpenJDK Platform'
    Signed: 'true'
  filter_optional_eclipse:
    ImageLoaded|startswith: 'C:\eclipse\plugins\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potential side-loading of the `jli.dll` file, which is often exploited in malicious scenarios by adversaries such as APT41 and XWorm. The objective is to leverage legitimate Java processes to execute unauthorized or harmful payloads without detection. This activity falls under the MITRE ATT&CK technique "DLL Side-Loading" (T1574.001) and is associated primarily with the Defense Evasion and Persistence tactics.

  The primary telemetry source for this detection is Windows image loading logs, particularly focused on application execution related to `jli.dll`. If this behavior is executed maliciously, unauthorized code can run within the context of trusted Java applications, potentially leading to data breaches or system compromise. It's critical to note that this detection does NOT confirm malicious activity on its own; further contextual analysis is required.

  ### Investigation Steps

  - **Check Image Load Events for Anomalous Paths**: Review Windows Event ID 4688 and Sysmon Event ID 1 for any processes loading `jli.dll` from non-standard directories (e.g., not `C:\Program Files\` or `C:\Program Files (x86)\`). Legitimate instances should be verified against these directories.

  - **Examine Process Tree and Parent Processes**: Investigate the parent process of `jli.dll` loading events. Focus on unconventional parent processes that may indicate malicious behavior, with particular attention to unexpected Java-related processes.

  - **Analyze Signed Status of the DLL**: Validate the digital signature of the loaded `jli.dll` using the `ImageLoaded` logs. Legitimate instances should indicate a `Signed: 'true'` status from known and trusted vendors, specifically the OpenJDK Platform.

  - **Identify Common Associations with Offensive Tools**: Utilize threat intelligence to flag known malicious applications or scripts that have been identified to side-load `jli.dll`, comparing against the executing process.

  - **Correlate with Known Threat Actor Tactics**: Review the context of other alerts or indicators of compromise (IOCs) from APT41 or XWorm that may tie into the same execution path. This can help confirm the legitimacy of the execution or highlight potential malicious associations.

  ### Prioritization

  Given the high severity level of this alert, its impact on enterprise operations can be significant, especially if it indicates persistence mechanisms or unauthorized access in critical systems. The likelihood of adversaries exploiting DLL side-loading techniques is well-documented, making this behavior a notable concern as it is commonly weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs from certain image load events or by malware that is deliberately masquerading as legitimate applications. Additionally, benign applications installing or updating Java or tools that load `jli.dll` can trigger this alert. It's advisable to pair this detection with related detections for anomalous process creations and file modifications, enhancing overall coverage for defensive measures.

