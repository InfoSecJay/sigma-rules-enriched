note: |
  ### Technical Context

  This rule detects potential sideloading of the "mpclient.dll" library by Windows Defender processes, specifically "MpCmdRun.exe" and "NisSrv.exe," from non-standard locations. An attacker may aim to leverage these processes to execute malicious code under the guise of legitimate Windows Defender operations, thereby evading detection and maintaining persistence on the infected host. The relevant MITRE ATT&CK tactic is **Persistence** and the technique is **Sideloading (T1574.001)**.

  The primary telemetry source for this detection is Windows image load events, particularly focusing on the loading behavior of executable files. If malicious, this behavior could allow unauthorized access or control over the affected system, potentially leading to further exploitation. This detection does NOT confirm that the activity is inherently malicious, as legitimate updates or configurations might also trigger this rule.

  ### Investigation Steps

  - **Verify process origin and execution path:** Review the execution path of "MpCmdRun.exe" and "NisSrv.exe" through Security Event ID 4688 or Sysmon Event ID 1. Legitimate executions should originate from their default directories: `C:\Program Files (x86)\Windows Defender\`, `C:\Program Files\Microsoft Security Client\`, or similar standard locations.

  - **Check for unexpected DLL loading:** Investigate Event ID 5140 and associated logs for any instances of "mpclient.dll" being loaded from non-standard directories. Malicious behavior may involve loading this DLL from paths such as user profile directories or temp folders.

  - **Correlate with other security events:** Look for related alerts or anomalies around the same timeframe, such as unusual process activity or unauthorized user actions (e.g., Event ID 4624 for logins). High confidence indicators of compromise might include unexpected parent processes or unfamiliar user accounts executing these commands.

  - **Review change logs for Defender configurations:** Check for unauthorized changes to Windows Defender settings utilizing Event ID 5002 (Windows Defender Config Change) and any alterations in enablement of real-time protections, which may indicate manipulation of the Defender itself.

  - **Monitor for data exfiltration attempts:** Validate presence of unexpected file creations or modifications that coincide with the execution of these processes (Event ID 4663) to check for any signs of data being sent out or modified in suspicious ways.

  ### Prioritization

  This alert should be treated with high severity due to its direct link to potential privilege escalation and the persistence of malware on critical systems. Malicious sideloading is an increasingly common tactic in sophisticated attacks, particularly from adversaries aiming to exploit trusted system processes for their operations.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from Windows Defender processes are not enabled or preserved. Adversaries may attempt to use legitimate update mechanisms or administrative operations to sideload malicious DLLs, leading to false positives. Additionally, related detections around DLL sideloading (e.g., tracking of changes in process integrity checks) may enhance detection capabilities and provide a more comprehensive view of the threat landscape.

