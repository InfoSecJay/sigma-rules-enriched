detection:
  selection:
    ImageLoaded|endswith: '\mpclient.dll'
    Image|endswith:
    - '\MpCmdRun.exe'
    - '\NisSrv.exe'
  filter_main_known_locations:
    Image|startswith:
    - 'C:\Program Files (x86)\Windows Defender\'
    - 'C:\Program Files\Microsoft Security Client\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the potential sideloading of the `mpclient.dll` library by Windows Defender processes, specifically `MpCmdRun.exe` and `NisSrv.exe`, from non-default directories. Sideloading is a technique adversaries use to execute malicious code within trusted processes, leveraging them to bypass security measures. In this scenario, an attacker may be attempting to utilize compromised versions of trusted Windows Defender executables to load malicious payloads, potentially to establish persistence or evade detection while executing further malicious activities.

  The relevant MITRE ATT&CK tactics for this detection rule include:
  - **Persistence** (T1547.001): This technique covers methods an attacker uses to maintain their foothold on a system.
  - **Privilege Escalation** (T1547.001): By using legitimate processes to load malicious libraries, attackers can often gain elevated privileges.
  - **Defense Evasion** (T1574.001): Adversaries may employ this technique to evade security measures by manipulating trusted applications.

  The primary data sources for this detection include Windows image load events, specifically logs related to process creation or modifications that signal the loading of DLL files by trusted executables.

  ### Investigation Steps
  - **Review Process Execution Logs**: Examine the logs for `MpCmdRun.exe` and `NisSrv.exe` execution events, looking for any instances that originate from non-standard directories.

  - **Analyze DLL Load Events**: Investigate image load events where `mpclient.dll` is loaded, focusing on the loading process to confirm if it occurred outside of expected directory paths.

  - **Correlate with Antivirus Logs**: Cross-reference findings with anti-virus or endpoint detection and response (EDR) logs to see if there were any alerts triggered by the loading of this DLL or suspicious activity linked to Windows Defender processes.

  - **Check for Anomalous Behavior**: Assess system behavior and network traffic anomalies that may be associated with the process, including unexpected command-line arguments or unusual outbound connections after `mpclient.dll` was loaded.

  ### Prioritization
  The severity of this alert is high due to the potential implications of an attacker leveraging trusted security processes to execute malicious code. The ability to sideload a DLL in this context directly hints at possible system compromise and significant risk to enterprise environments.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of sideloading, especially if attackers use other legitimate Windows processes or if the malicious DLL is named differently. The detection logic assumes that any loading of `mpclient.dll` outside of predefined directories is malicious, which may not account for legitimate, albeit rare, configurations. The effectiveness of this alert relies on comprehensive logging of image loads and process execution across all endpoints running Windows Defender, necessitating proper configuration to ensure all relevant events are captured.

