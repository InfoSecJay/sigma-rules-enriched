detection:
  selection:
    ImageLoaded|endswith: '\mpclient.dll'
    Image|endswith:
    - '\MpCmdRun.exe'
    - '\NisSrv.exe'
  filter_main_known_locations:
    Image|startswith:
    - 'C:\Program Files (x86)\Windows Defender\'
    - 'C:\Program Files\Microsoft Security Client\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the sideloading of `mpclient.dll` by Windows Defender processes (`MpCmdRun.exe` and `NisSrv.exe`) when these processes are executed from non-standard directories. Adversaries may sideload legitimate software to execute malicious code while evading traditional detection measures, which aligns with the objective of maintaining stealth during execution phases. Relevant MITRE ATT&CK tactics include **Persistence (T1547)** and **Execution (T1203)**, specifically sideloading techniques (T1574.001).

  The primary telemetry sources include Windows Event logs, especially from the `Image Load` category where the specific artifact `mpclient.dll` is registered. If sideloading is confirmed, it indicates a significant security risk, as this could lead to full compromise of affected systems. Importantly, this detection does NOT inherently confirm that malicious intent is present without further contextual analysis.

  ### Investigation Steps

  - **Check process execution paths**: Analyze associated process information from Security Event ID 4688, focusing on the directory paths of `MpCmdRun.exe` and `NisSrv.exe`. Legitimate executions will originate from typical locations like `C:\Program Files\Windows Defender\` or `C:\Program Files (x86)\Windows Defender\`.

  - **Verify the legitimacy of loaded DLLs**: Review Sysmon Event ID 7 (Image loaded) for any instances of `mpclient.dll`. Threat indicators may include path discrepancies, with detection possible if the DLL is loaded from outside the standard locations mentioned.

  - **Review for recent changes to Defender settings**: Check for any modifications to Windows Defender configurations or policies via Windows Event ID 4104 logs; this may indicate potential manipulation or abuse of the Defender processes.

  - **Investigate recent activity around affected systems**: Correlate timestamps from alerts with activity records in the Event Log, specifically looking for changes or anomalies in behavior from the affected endpoint activities, such as unusual file access or elevated privilege execution.

  - **Analyze file creation or modification timestamps**: Examine any associated file metadata for `mpclient.dll` and related processes. Unconventional timestamps or unexpected file creates in directories where benign DLLs are typically expected could highlight malicious activity.

  ### Prioritization

  This alert should be considered high-priority due to its association with potential system compromise via sophisticated sideloading techniques that could lead to significant access and data loss. Given the nature of the processes involved, there is a realistic possibility of these tactics being weaponized by adversaries for persistence and execution.

  ### Blind Spots and Assumptions

  Legitimate operations, such as updates or maintenance activities initiated by Windows Defender, may inadvertently trigger this alert. Detection efficacy relies on comprehensive logging configurations, especially ensuring detailed telemetry from Windows Event Logs and Sysmon is enabled. An identified companion detection to enhance visibility could relate to checks for the execution of processes from known malicious paths or extensions, strengthening detection of potentially obfuscated attacks.

