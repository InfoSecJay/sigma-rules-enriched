  ---

  ### Technical Context

  This rule detects the sideloading of the "mpclient.dll" library by two Windows Defender processes, "MpCmdRun" and "NisSrv," from non-default locations. An attacker aiming to leverage legitimate security applications for malicious purposes might exploit this to facilitate malware execution or command-and-control (C2) activities while avoiding detection. This behavior is indicative of the MITRE ATT&CK technique T1574.001 (Sideloading).

  The primary telemetry sources for this detection are Windows Event Logs, specifically the Image Load events. If malicious, the impact could be significant as it might lead to the execution of unauthorized or harmful software under the guise of legitimate Windows operations. However, it's critical to understand that this detection does NOT confirm malicious activity on its own, as legitimate processes can be manipulated in similar ways.

  ---

  ### Investigation Steps

  - **Review process creation details:** Examine Security Event ID 4688 for "MpCmdRun.exe" or "NisSrv.exe" creation. Compare the command line arguments and parent process IDs to identify any anomalies. Expected behaviors would show these processes initiated from their default installation paths.

  - **Inspect Image Load logs:** Check for Event ID 8000 or Sysmon Event ID 10 that contains details of the "mpclient.dll" loading. Validate the loading path to determine if it originated from a non-standard directory (e.g., not from C:\Program Files\*) which may indicate malicious activity.

  - **Identify registry modifications:** Query for recent changes in relevant registry keys, specifically under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\WdNisSvc, to identify any unauthorized changes that could correlate with the detected activity.

  - **Validate expected service behavior:** Assess the typical operations conducted by "MpCmdRun" and "NisSrv" by going through recent logs, looking for legitimate scanning and update operations versus unexpected network connections or command executions.

  - **Cross-reference with threat intelligence:** Use threat databases or IOC (Indicator of Compromise) lists to check if "mpclient.dll" has been associated with known malicious frameworks or indicators, focusing on any C2 domains or hashes related to this activity.

  ---

  ### Prioritization

  The alert is assessed as high severity due to the potential impact on critical systems leading to privilege escalation or persistence if exploited. The likelihood of malicious abuse is moderate, as this technique is recognized in various attacks but requires specific conditions to be achieved. Sideloading via defensive processes is increasingly weaponized by sophisticated adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection might miss instances where the sideloading is stealthily executed using other processes or tools that do not match the specified criteria. Dependable detection also relies on having Sysmon configured correctly to capture Image Load events fully. Legitimate software installations or updates could inadvertently trigger this alert. Consider additional coverage with detections for abnormal behaviors in other security processes and tools, such as unauthorized file access monitoring to provide a broader security framework.

