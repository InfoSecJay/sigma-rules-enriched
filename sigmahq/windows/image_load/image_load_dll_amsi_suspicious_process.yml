  ---

  ### Technical Context

  This rule detects the loading of the `Amsi.dll` file by a Living Off The Land (LOLBIN) process, indicating a potential "PowerShell without PowerShell" attack. Attackers may exploit legitimate Windows binaries to execute scripts or payloads in a stealthy manner, avoiding traditional detection mechanisms. This behavior is associated with the MITRE ATT&CK tactic "Defense Evasion" and the technique "Living off the Land binaries and scripts" (ID T1218).

  Primary telemetry sources for this detection include Windows Event logs related to process creation (Event ID 4688) and Sysmon logs (Event ID 11) that capture image loads. If malicious, the security impact is severe, as it may facilitate the execution of malicious scripts or payloads while bypassing security controls. However, this detection alone does not confirm malicious intent; legitimate applications may also load `Amsi.dll` under usual circumstances.

  ---

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 logs for the associated processes (`ExtExport.exe`, `odbcconf.exe`, `rundll32.exe`). Identify the parent process and execution context for anomalous behavior.

  - **Examine Sysmon Logs**: Look at Sysmon Event ID 11 to confirm that loading of `Amsi.dll` correlates with the detected LOLBIN processes. Establish if the context of execution appears suspicious.

  - **Identify Known Good Behavior**: Validate typical behavior of `ExtExport.exe`, `odbcconf.exe`, and other identified binaries in your environment to confirm they are not frequently loading `Amsi.dll`. Document usual execution patterns.

  - **Correlate with Network Activity**: Check for outbound traffic generated by the involved processes. Investigate any suspicious connections related to data exfiltration or command and control servers; cross-reference with firewall logs for unusual external IP addresses.

  - **Cross-Reference with User Activity**: Review user access logs for any anomalies, ensuring legitimate users are running these processes. Look for indicators of misuse, such as unexpected user privilege escalation or abnormal network access patterns.

  ---

  ### Prioritization

  This alert has medium severity, as it involves the use of legitimate tools for potentially harmful actions, with the risk of bypassing conventional defenses. The likelihood of malicious use is significant, as the technique is commonly weaponized by adversaries seeking to manipulate the environment stealthily.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the use of antivirus or endpoint protection solutions that block or log comparable behaviors. It requires proper configuration of Sysmon and comprehensive logging to capture the relevant events. Additionally, not all benign uses of `ExtExport.exe` or similar processes will be captured, which may lead to false positives. A related detection to strengthen coverage is monitoring for unusual command-line arguments or invocation patterns in these legitimate binaries.

