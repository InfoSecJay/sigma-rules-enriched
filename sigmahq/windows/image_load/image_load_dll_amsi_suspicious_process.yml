note: |
  ### Technical Context

  This rule detects the loading of the Amsi.dll library via a "living off the land" (LOLBIN) process, specifically targeting processes commonly used by attackers to bypass security controls such as the Windows AntiMalware Scan Interface (AMSI). The likely attacker objective is to execute malicious payloads without raising suspicion, typically for credential dumping or privilege escalation. Relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and the techniques "Bypass Anti-Malware Tools" (T1203) and "Living off the Land" (T1218). The primary telemetry source includes Windows image load events, particularly the Event ID 400, which captures the loading of dynamic link libraries (DLLs). If this behavior is confirmed as malicious, it could indicate a serious compromise of the system, allowing the attacker to effectively operate undetected. Importantly, this detection does NOT confirm actual malicious activity or the success of any attack on its own; further investigation is necessary.

  ### Investigation Steps

  - **Check for Amsi.dll loaded by LOLBIN processes:** Review Windows Event ID 400 logs for instances where Amsi.dll is loaded by processes such as ExtExport.exe, odbcconf.exe, or rundll32.exe. Focus on the ImageLoaded field for '/amsi.dll' and correlate with surrounding process execution timestamps.

  - **Identify known legitimate usages:** Investigate whether the identified LOLBIN processes (e.g., ExtExport.exe) are part of normal operation for the affected host role, such as a database server or legacy application server. Check expected execution patterns documented in system configuration.

  - **Gather contextual information from Sysmon logs:** Query Sysmon Event ID 7 for network connectivity related to the identified LOLBIN processes. Look for unexpected outbound connections, which could indicate malware communication.

  - **Correlate with other indicators of compromise (IoCs):** Verify if the behavior correlates with other known malicious indicators, such as unusual user account activity or alterations in permissions that may have occurred around the same time.

  - **Validate process integrity:** Review the file properties of the associated processes (e.g., integrity checks, signatures) to distinguish between benign and potentially malicious versions. Ensure files have not been altered or replaced.

  - **Monitor for follow-up execution steps:** If malicious activity is suspected, check subsequent logs (e.g., Windows Event ID 4688 for process creation) to track additional commands executed via PowerShell or other scripting engines.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems, especially those performing sensitive functions. The likelihood of abuse is moderate, as LOLBIN processes are often leveraged in attacks. While detection of Amsi.dll loaded via these means is concerning, it is not necessarily indicative of a fully realized compromise without further evidence.

  ### Blind Spots and Assumptions

  Detection limitations may arise if Amsi.dll is invoked by legitimate processes, which can create false positives. Reliable detection requires that image load event logging is fully enabled and monitored. Legitimate activities, such as administrative maintenance tasks involving database utilities, may occur and trigger this alert. Companion detections could include monitoring for PowerShell execution events (e.g., Event ID 4104) in unusual contexts to augment the analysis of potential blending abuse through LOLBIN processes.

