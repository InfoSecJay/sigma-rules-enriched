note: |
  ### Technical Context

  This Sigma rule detects the loading of "Amsi.dll" by various living-off-the-land binaries (LOLBINs), such as `ExtExport.exe` and `rundll32.exe`. The likely attacker objective is to bypass embedded security features in Windows, specifically the Windows AntiMalware Scan Interface (AMSI), often to execute malicious scripts or payloads without triggering a security alert. This behavior primarily falls under the MITRE ATT&CK tactic of Defense Evasion and the associated technique "TA0005 - Defense Evasion" (T1562).

  The primary telemetry source is Windows image load events, specifically focusing on processes that load the "Amsi.dll" library through suspicious binaries. If this behavior is malicious, it could indicate an effective evasion tactic used to bypass anti-malware detection. This detection rule does NOT confirm malicious intent on its own; it must be corroborated with further context and evidence.

  ### Investigation Steps

  - **Check process lineage for LOLBIN usage**: Review the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) related to the detected `Amsi.dll` load. Determine if these processes were invoked by other malicious or suspicious processes, as legitimate apps typically won’t invoke Amsi.dll through these LOLBINs.

  - **Analyze command-line arguments**: Investigate the command-line arguments of the parent processes to identify any suspicious parameters (e.g., encoded scripts) that might indicate malicious intent, specifically using Sysmon Event ID 1 or PowerShell logging (Event ID 4104).

  - **Review related event timestamps**: Confirm the timeline of execution for `Amsi.dll` loading by correlating timestamps with other alerts or logs, such as those from Windows Defender (Event ID 1116). Suspicious behavior often occurs in proximity to other alerts or confirmed breaches.

  - **Identify usage patterns**: Determine if `ExtExport.exe` or `rundll32.exe` are being used in a known and benign context, such as by IT or support personnel managing database connections or executing necessary system tasks, particularly in environments that frequently use these tools.

  ### Prioritization

  This alert is prioritized as medium severity given the affected process's potential role in executing scripts that bypass security measures. The likelihood of malicious abuse is moderate, as attackers often employ LOLBINs to evade detection, with the behavior being somewhat commonly weaponized.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate administrative activities could trigger it, particularly in environments where `rundll32.exe` or `ExtExport.exe` are used for routine tasks. Additionally, complete telemetry from the necessary log sources, particularly for PowerShell activity and Sysmon logs, is required for reliable detection. A related detection, such as monitoring for unusual PowerShell execution (T1059.001), could enhance coverage and context for potential threats.

