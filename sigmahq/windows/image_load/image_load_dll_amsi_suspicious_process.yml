title: Amsi.DLL Loaded Via LOLBIN Process
id: 6ec86d9e-912e-4726-91a2-209359b999b9
status: test
description: Detects loading of "Amsi.dll" by a living of the land process. This could
  be an indication of a "PowerShell without PowerShell" attack
references:
- Internal Research
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\amsi.dll'
    Image|endswith:
            # TODO: Add more interesting processes
    - '\ExtExport.exe'
    - '\odbcconf.exe'
            # - '\regsvr32.exe' # legitimately calls amsi.dll
    - '\rundll32.exe'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify when the `Amsi.dll` library is loaded by certain 'living off the land' (LOLBIN) processes on Windows systems. The presence of such a behavior often signifies an attempt by an adversary to bypass security measures, particularly those associated with PowerShell scripting. The use of `Amsi.dll`, which is primarily used for anti-malware scanning of scripts, in conjunction with LOLBIN processes, suggests that an attacker may be executing payloads in a stealthy manner, aiming to evade security detections and execute malicious commands without invoking PowerShell directly.

  In this context, attackers are likely striving to execute commands or scripts that can facilitate lateral movement or sustain access while remaining under the radar of conventional detection mechanisms. Furthermore, this behavior can fall under various tactics and techniques outlined in the MITRE ATT&CK framework, particularly in the **Defense Evasion** tactic. Relevant techniques that could encompass this activity include **T1222: Application Layer Protocol** and **T1203: Exploitation for Client Execution**.

  The primary sources of telemetry for this detection rule include image load events which log process execution and loaded libraries. It is critical to monitor for suspicious process activity involving `rundll32.exe`, `odbcconf.exe`, and other such tools known to be commonly abused in these scenarios.

  ### Investigation Steps
  - **Review Image Load Events:** Check the logs for instances of `Amsi.dll` being loaded through `ExtExport.exe`, `odbcconf.exe`, or `rundll32.exe` to correlate with the alert.
  - **Analyze Parent-Child Process Relationships:** Inspect the parent processes of the detected LOLBIN activities to identify how they were invoked and whether any suspicious command lines were used.
  - **Cross-reference with Known Indicators:** Compare the observed processes and their execution context against threat intelligence feeds for any known malware signatures or behavior patterns associated with PowerShell evasion tactics.
  - **Investigate Recent Changes:** Scrutinize recent changes in your environment, such as new software installations or changes to security policies, which might influence the observed behavior.

  ### Prioritization
  The severity of this alert is medium, primarily because the use of `Amsi.dll` in this context indicates potential evasion techniques that, if left unchecked, could facilitate deeper compromises within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in coverage regarding the detection of other LOLBIN processes that could load `Amsi.dll` or similar libraries not currently listed in the rule. Additionally, it assumes that auditing and logging are properly configured to capture image load events on all Windows hosts in the environment. Without comprehensive logging of these events, the detection mechanism may fail to trigger or miss pertinent details around certain suspicious activities.

