note: |
  ### Technical Context

  This Sigma rule detects instances where the `rundll32.exe` process loads a DLL from a remote location. Typically, attackers may use this technique to execute malicious code that resides on remote servers. The likely objective is to facilitate malware execution, exfiltration of data, or lateral movement within the network. This behavior is related to the MITRE ATT&CK technique for Execution via `rundll32` (T1204.002).

  The primary telemetry source for this detection is Windows Image Load events, specifically focusing on process creation events indicating `rundll32.exe` and the associated DLL being loaded from a remote UNC path. If executed maliciously, this behavior can lead to significant security impact, including data breaches or system compromise. However, detection of this event does NOT confirm that the action was malicious on its own—it requires further investigation.

  ### Investigation Steps

  - **Identify the process creation event:** Check Security Event ID 4688 for the creation of `rundll32.exe`. Confirm whether this occurred within the expected timeframe of the alert.

  - **Analyze the command line arguments:** Review the command line fields associated with the process creation. Look for any suspicious or unusual arguments that could indicate malicious intent, such as unexpected DLL names or remote server paths.

  - **Correlate with loaded DLLs:** Investigate loaded modules using Sysmon Event ID 7 or Windows Event ID 4104 PowerShell logs. Determine if the DLL being loaded is known or trusted versus the system's typical DLL load behavior.

  - **Compare with trusted activities:** Review other processes or users that legitimately use `rundll32.exe`, such as system updates or legitimate software installations. Document expected command line behaviors to establish a comparison.

  - **Check network activity:** Investigate network logs for any outbound connections from the host to the remote server after `rundll32.exe` execution. Use network telemetry to correlate suspicious connection attempts, particularly to known malicious IPs or domains.

  - **Look for persistence mechanisms:** Examine Event IDs 4657 or 4688 for changes to startup services or scheduled tasks that may relate to the `rundll32.exe` activity. Confirm whether any malicious persistence mechanisms were established during the execution.

  ### Prioritization

  This alert is of medium severity, given that the affected system could be critical to operations, and the technique is commonly exploited by attackers. The likelihood of malicious abuse is moderate as `rundll32.exe` has legitimate uses, but its misuse warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that trusted administrative actions can also trigger this alert, leading to potential false positives. It's critical to have Windows Imaging and Sysmon logging correctly configured to capture these events reliably. Legitimate activities like software installations or script executions may also trigger similar behavior. A related detection strategy would involve monitoring for remote access tools that leverage similar techniques, enhancing overall monitoring efficacy.

