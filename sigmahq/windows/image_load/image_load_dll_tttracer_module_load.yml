title: Time Travel Debugging Utility Usage - Image
id: e76c8240-d68f-4773-8880-5c6f63595aaf
status: test
description: Detects usage of Time Travel Debugging Utility. Adversaries can 
  execute malicious processes and dump processes, such as lsass.exe, via 
  tttracer.exe.
