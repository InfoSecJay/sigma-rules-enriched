note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of "SmadHook.dll," which is associated with SmadAV antivirus, potentially implicating malicious activity by loading this DLL from unexpected locations. The likely attacker objective is to evade detection by leveraging trusted processes while executing malicious code, which aligns with the MITRE ATT&CK techniques of "DLL Search Order Hijacking" (T1574.001) and "Persistence" tactics. The primary telemetry source is Windows Image Load Logs, specifically focusing on the occurrence of unexpected DLL loading in conjunction with specific legitimate executable paths. If successful, this could lead to privilege escalation and further network compromise. Importantly, this detection does NOT confirm malicious activity on its own without further context or correlation with other indicators.

  ### Investigation Steps

  - **Verify DLL loading correlation:** Check for instances of `SmadHook32c.dll` or `SmadHook64c.dll` being loaded through Windows Event Logs, specifically reviewing Event ID 4663 or Sysmon Event ID 10 for unauthorized paths outside the legitimate paths specified (`C:\Program Files (x86)\SMADAV\`, etc.).

  - **Identify path legitimacy:** Confirm if the executable launching the DLL loading (`SmadavProtect32.exe` or `SmadavProtect64.exe`) is being executed from one of the approved directories. Legitimate executions should correspond with process creations logged in Event ID 4688 or Sysmon Event ID 1.

  - **Assess process activity:** Review the process tree for the parent process of `SmadHook.dll` using Sysmon's Event ID 10 or Windows Event ID 4688 to identify any anomalous parent-child relationships that could indicate an exploit.

  - **Look for known malicious behaviors:** Utilize endpoint detection tools or threat intelligence feeds to check if the loaded DLL or its parent processes are associated with known malicious indicators. Validate against threat intelligence signatures for SmadHook.dll.

  - **Monitor system changes:** Record file creation timestamps and modification logs related to `SmadHook*.dll` in directories other than the legitimate paths. Investigate any recent changes (e.g., creation/deletion/modification) in directories that might indicate suspicious activity around the file.

  - **Contextualize user activity:** Determine if any user actions corresponded with the loaded DLL. Review related user login events (Security Event IDs 4624 and 4625) within the time window to identify if unusual logins or access patterns coincided with the DLL loading events.

  ### Prioritization

  Given the high severity level, this alert indicates a potentially serious threat to enterprise systems, especially if the affected machine has critical functions or handles sensitive data. The likelihood of malicious abuse is significant, particularly if the loading of `SmadHook.dll` occurs from non-standard paths, implying malicious intent. This behavior has been weaponized in other campaigns, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate variations in application behavior, especially if similar applications exist that legitimately use `SmadHook.dll` in authorized ways. It is also important that appropriate logging for Image Load Events is configured properly to ensure coverage. Some legitimate activities, such as applications using similar DLL names for valid operations, may inadvertently trigger this alert. Companion detections to strengthen coverage include monitoring for anomalous process creation events and tracking known benign processes used within the corporate environment to better distinguish false positives.

