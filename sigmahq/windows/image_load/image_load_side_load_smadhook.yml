title: Potential SmadHook.DLL Sideloading
id: 24b6cf51-6122-469e-861a-22974e9c1e5b
status: test
description: Detects potential DLL sideloading of "SmadHook.dll", a DLL used by SmadAV
  antivirus
references:
- https://research.checkpoint.com/2023/malware-spotlight-camaro-dragons-tinynote-backdoor/
- https://www.qurium.org/alerts/targeted-malware-against-crph/
author: X__Junior (Nextron Systems)
date: 2023-06-01
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\SmadHook32c.dll'
    - '\SmadHook64c.dll'
  filter_main_legit_path:
    Image:
    - 'C:\Program Files (x86)\SMADAV\SmadavProtect32.exe'
    - 'C:\Program Files (x86)\SMADAV\SmadavProtect64.exe'
    - 'C:\Program Files\SMADAV\SmadavProtect32.exe'
    - 'C:\Program Files\SMADAV\SmadavProtect64.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\SMADAV\'
    - 'C:\Program Files\SMADAV\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading related to "SmadHook.dll", which is associated with the SmadAV antivirus. DLL sideloading is a technique that malware can exploit by loading a malicious DLL file that shares the name with a legitimate library, thereby evading detection and executing unauthorized actions. Attackers may employ this tactic to modify the behavior of trusted applications or to maintain persistence within compromised environments.

  The suspected threat family is likely attempting to evade defenses and gain elevated privileges by leveraging the SmadAV software. Attackers may be targeting specific systems where SmadAV is installed, aiming to exploit the trust placed in legitimate processes. This detection aligns with various MITRE ATT&CK techniques, notably **T1574.001 - DLL Search Order Hijacking** and can have implications for tactics related to persistence, defense evasion, and privilege escalation.

  To effectively detect this activity, the primary data sources include image load logs from Windows, which can provide insight into the DLL loading behavior of processes on the system. Anomalies within these logs can indicate potential abuse of legitimacy by unexpected DLL loads tied to known processes.

  ### Investigation Steps
  - **Review Image Load Events:** Examine the image load logs to identify any instances where `SmadHook32c.dll` or `SmadHook64c.dll` were loaded, ensuring the process path matches those related to the legitimate SmadAV executables.
  - **Correlate with Process Activity:** Investigate the associated process activities around the times when the suspicious DLLs were detected to discern any unusual behavior or additional indicators of compromise.
  - **Inspect Known Paths:** Validate that the paths from which the DLLs were loaded are legitimate and aligned with expected application locations, specifically under the `C:\Program Files (x86)\SMADAV\` or `C:\Program Files\SMADAV\` directories.
  - **Check for Privilege Escalation Indicators:** Assess whether any privilege escalation attempts align with the loading of the suspicious DLLs by reviewing logs for any changes in user privileges or account behavior that follows the DLL loading.

  ### Prioritization
  This alert carries a high severity in an enterprise environment due to the potential risks associated with DLL sideloading. The technique can lead to unauthorized code execution and may enable attackers to gain elevated privileges, thereby compromising sensitive systems.

  ### Blind Spots and Assumptions
  One key assumption of this detection rule is that the SmadAV software is installed and operational on the target systems; if it is not present, the rule will yield false negatives. Additionally, the detection logic may not account for legitimate DLL updates or changes made by the application, leading to possible false positives. Required logs include comprehensive image load logs with enough historical data to detect anomalous behaviors, highlighting the need for proper logging configurations to be established in the Windows environment for effective detection.

