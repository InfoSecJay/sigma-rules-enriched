  ---

  ### Technical Context

  This Sigma rule detects the potential sideloading of "SmadHook.DLL," a dynamic-link library often utilized by the SmadAV antivirus software. Attackers aim to leverage legitimate software's trust by loading malicious DLLs into memory, facilitating persistence, privilege escalation, or evasion of defenses. This behavior correlates with the MITRE ATT&CK Tactic of **Persistence** and the Technique **DLL Search Order Hijacking (T1574.001)**.

  The primary telemetry sources include Windows image load events, specifically monitoring DLLs loaded into a process's memory. Attackers may exploit this technique to run malicious code without raising alarms. Notably, detection of this behavior does not confirm that the sideloaded DLL is malicious on its own; further investigation is required to determine intent and impact.

  ---

  ### Investigation Steps

  - **Check the associated process:** Investigate the process loading "SmadHook32c.dll" or "SmadHook64c.dll" using Windows Event ID **262144** (Image Load). Identify if the parent process is legitimate (e.g., the legitimate Smadav executable). Any process outside the trusted paths warrants further scrutiny.

  - **Review the DLL path:** Identify the loading path for the DLL. Look for event fields indicating it is loaded from **C:\Program Files (x86)\SMADAV\** or **C:\Program Files\SMADAV\**. Paths that deviate from these may suggest malicious intent.

  - **Analyze process behavior:** Use Sysmon Event ID **1** to correlate unusual activity surrounding the SmadAV process. Look for signs such as unexpected outbound connections or process branching to non-standard executables—these may indicate compromised behavior.

  - **Identify benign use cases:** Consult with the asset owner to confirm whether "SmadHook.dll" is legitimately utilized within the environment for trusted functionalities associated with SmadAV. Whitelisted operations, such as regular updates or scheduled scans, can help differentiate between good and bad behavior.

  - **Correlate with existing threats:** Cross-reference any detected activity against known threat actor tactics mentioned in the **Checkpoint Research** documents. Consider identifying previously reported indicators of compromise (IoCs) linked with SmadAV exploitation.

  - **Assess system criticality:** Determine the role of the affected asset within the environment. If it is a critical server or endpoint, prioritize the investigation and seek to contain potential threats immediately.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential risk of unintentional execution of malware within the environment. The likelihood of malicious abuse is significant, particularly considering the use of trusted software to execute potentially harmful code. Since DLL sideloading techniques have been weaponized in various targeted attacks, prompt investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the reliance on specific DLL paths; adversaries may rename or relocate files to evade detection. The accuracy of detection also depends on comprehensive logging configuration through Sysmon and Windows Event logs. Legitimate instances of this alert may arise from routine updates or configurations within SmadAV, potentially leading to false positives. A related detection to strengthen coverage could involve monitoring for unusual parental relationships in process creation (Event ID **4688**) to detect unexpected processes spawned by legitimate applications.

