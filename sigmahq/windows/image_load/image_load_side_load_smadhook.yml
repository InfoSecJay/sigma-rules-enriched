logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\SmadHook32c.dll'
    - '\SmadHook64c.dll'
  filter_main_legit_path:
    Image:
    - 'C:\Program Files (x86)\SMADAV\SmadavProtect32.exe'
    - 'C:\Program Files (x86)\SMADAV\SmadavProtect64.exe'
    - 'C:\Program Files\SMADAV\SmadavProtect32.exe'
    - 'C:\Program Files\SMADAV\SmadavProtect64.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\SMADAV\'
    - 'C:\Program Files\SMADAV\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the loading of the `SmadHook.dll`—a DLL associated with the SmadAV antivirus software—under suspicious circumstances. Potentially, an attacker may seek to leverage this DLL through malcrafted execution or via DLL sideloading techniques to achieve persistence or escalate privileges. The relevant MITRE ATT&CK tactic is **Persistence** (T1574.001) and technique is **DLL Side-Loading**.

  Primary telemetry sources include Windows Event Logs related to image loads, specifically looking for Image Load events (Event ID 4624 from security logs and Sysmon Event ID 10). A successful malicious execution of this behavior can allow unauthorized code to run with potentially higher privileges. However, this detection alone does not confirm malicious activity without additional context, as legitimate software can also load this DLL.

  ### Investigation Steps

  - **Check event logs for image load events**: Review Windows Security Event ID 4624 (Logon) and Sysmon Event ID 10 for any references to `SmadHook.dll` being loaded by processes that are not part of the usual SMADAV execution paths.

  - **Identify the process spawning `SmadHook.dll`**: Investigate the parent process of the loaded DLL to confirm if it's a legitimate instance of the SmadAV executable located in `C:\Program Files (x86)\SMADAV\` or `C:\Program Files\SMADAV\`. Malicious loading may stem from unusual executables such as cmd.exe or powershell.exe.

  - **Assess the behavior of the parent process**: If identified as a legitimate SMADAV process, verify its integrity and execution path. Legitimate activity typically involves `SmadavProtect32.exe` or `SmadavProtect64.exe` as the parent process.

  - **Examine the system for persistence mechanisms**: Look for alterations in startup locations such as the registry (e.g., `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`) for entries related to SMADAV or unusual task scheduler modifications tied to the loading of `SmadHook.dll`.

  - **Correlate with other alerts**: Review for any previous alerts or logs in the last 24-48 hours indicating unauthorized access attempts, abnormal process launches, or other suspicious activity tied to the same host or user account as this DLL loading activity.

  - **Document known benign executables**: Maintain awareness of legitimate use cases for `SmadHook.dll`, as it may be triggered by normal operational usage of SMADAV. Review timestamps to correlate with regular operations, such as updates or scheduled scanning.

  ### Prioritization

  The alert is of high severity due to the criticality of Windows systems where security applications operate. The likelihood of exploiting DLL sideloading for malicious purposes is recognized as a prevalent tactic used by adversaries. If confirmed, unauthorized DLL execution may lead to a serious compromise of the system's integrity and security posture.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate application updates or benign software interactions that involve `SmadHook.dll`. It relies on consistent logging from Sysmon and security event logs; ensure Sysmon is deployed and configured correctly. Legitimate application behaviors, such as software updates or manual scans by users, may trigger this alert. A companion detection to consider is monitoring for suspicious process creation related to `Smadav` in the broader detection framework to enhance context.

