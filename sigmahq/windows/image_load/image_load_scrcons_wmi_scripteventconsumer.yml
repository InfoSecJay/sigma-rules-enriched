logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\scrcons.exe'
    ImageLoaded|endswith:
    - '\vbscript.dll'
    - '\wbemdisp.dll'
    - '\wshom.ocx'
    - '\scrrun.dll'
  condition: selection
falsepositives:
- Legitimate event consumers
- Dell computers on some versions register an event consumer that is known to cause
  false positives when brightness is changed by the corresponding keyboard button
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of the WMI script host process `scrcons.exe` loading specific scripting DLLs, which may indicate unauthorized use of **WMI ActiveScriptEventConsumers**. Such behavior is often leveraged by attackers during lateral movement, privilege escalation, or persistence strategies within a compromised environment. The attacker may aim to execute arbitrary scripts or payloads in the context of the host, allowing for further exploitation of the system.

  Relevant MITRE ATT&CK tactics and techniques associated with this activity include:
  - **Lateral Movement (T1021)**: Using WMI to remotely execute commands or scripts on a target machine.
  - **Privilege Escalation (T1548)**: Utilizing event consumers to gain elevated privileges within the network.
  - **Persistence (T1546.003)**: Abusing WMI for maintaining access over long periods.

  Primary data sources for this detection include:
  - **Image load events**: Capturing the loading of executables and their associated DLLs, providing visibility into unusual or malicious actions by system processes.

  ### Investigation Steps
  - **Review load logs:** Check image load events for the appearance of `scrcons.exe`, paying close attention to any associated DLLs like `vbscript.dll` and `scrrun.dll`. Identify any anomalies in their loading patterns.
  - **Examine WMI Event Consumers:** Query the WMI repository for any unusual or unauthorized ActiveScriptEventConsumers registered on systems. This involves validating the legitimacy of event consumers listed.
  - **Monitor Process Trees:** Investigate process creation logs surrounding the execution of `scrcons.exe` to identify any parent processes or command-line arguments that may indicate malicious intent or lateral movement.
  - **Correlate with User Activity:** Analyze user activity logs to determine if there is a legitimate business reason for the script host's execution. Identify any deviations from typical usage patterns associated with WMI and scripting activities.

  ### Prioritization
  This alert should be treated with medium to high severity due to the potential risk of lateral movement and privilege escalation. If successfully exploited, attackers could gain significant control over the network, making prompt investigation critical.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where WMI scripting is routinely used for legitimate business processes, leading to potential false positives. The detection logic assumes that the loading of `scrcons.exe` and specified DLLs indicates malicious activity, which may not always be the case for all systems. Proper event logging configurations for WMI and image load events are required to ensure accurate detection and reporting.

