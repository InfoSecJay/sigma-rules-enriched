note: |
  ### Technical Context

  This Sigma rule detects the loading of certain scripting DLLs by the Windows Management Instrumentation (WMI) script host process "scrcons.exe," which can indicate the use of WMI ActiveScriptEventConsumers. An attacker may utilize this technique to maintain persistence or execute scripts in response to specific events, possibly aiming to automate remote commands or escalate privileges. This behavior correlates with the MITRE ATT&CK technique T1546.003: Event Triggered Execution.

  The primary telemetry sources for this detection are image load events from Windows, specifically monitoring processes that load the identified scripting DLLs. If malicious, this behavior could allow an attacker to execute arbitrary scripts remotely, leading to unauthorized access or control over the system. This detection does NOT confirm malicious activity on its own; legitimate application behavior or system management functions could trigger the same alert.

  ### Investigation Steps

  - **Check scrcons.exe execution context:** Review Process Creation logs (Event ID 4688) to identify how and when `scrcons.exe` was launched, focusing on its parent process. Look for unusual parent processes or execution paths indicative of compromise.

  - **Analyze loaded libraries:** Investigate Image Load events (Sysmon Event ID 7) for `scrcons.exe`, paying attention to the loaded DLLs (`vbscript.dll`, `wbemdisp.dll`, `wshom.ocx`, `scrrun.dll`). If these DLLs are loaded in a non-standard context (e.g., not following a legitimate process), it may suggest malicious intent.

  - **Identify WMI EventConsumers configuration:** Query the WMI EventConsumers (e.g., using `wmic /namespace:\\root\subscription path __EventFilter`) to list existing subscriptions. Look for entries that seem unfamiliar or have anomalous configurations, which may point to unauthorized modifications.

  - **Expect legitimate behavior:** Acknowledge that several legitimate applications or management tasks might invoke `scrcons.exe`, especially in environments utilizing WMI scripts for automation. Events from Dell computers changing display settings can trigger this rule without malicious activity.

  - **Verify host state and criticality:** Determine if the affected server or workstation hosts critical applications or data. Assess the reconnaissance and lateral movement risks should the behavior be malicious, focusing on potentially privileged systems or sensitive data repositories.

  - **Investigate for related activity:** Cross-reference with known lateral movement or privilege escalation artifacts (e.g., suspicious PowerShell commands) that may accompany this behavior. Check for other indicators of compromise (IoC) associated with administrative tasks executing via WMI.

  ### Prioritization

  This alert warrants medium priority due to the potential for significant impact if malicious activity is confirmed, particularly regarding lateral movement and privilege escalation. Given the specific nature of the detection, it has a moderate likelihood of being exploited by adversaries using WMI for automation.

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate software behavior, such as automated system management or monitoring solutions that also utilize WMI scripting. Ensuring comprehensive log collection from Sysmon (particularly for process creation and image loads) is crucial for reliable detection. Legitimate activities, such as system updates or administrative scripts, might also trigger this rule. A related detection might include monitoring for suspicious WMI queries or abnormal PowerShell executions (T1059.001).

