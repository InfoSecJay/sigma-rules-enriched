note: |
  ### Technical Context

  This Sigma rule detects the loading of "RjvPlatform.dll" by the executable "SystemResetPlatform.exe", which can indicate a DLL side-loading technique. This behavior typically aligns with the attackers' objective of maintaining persistence or executing malicious code by leveraging trusted binaries to evade security controls. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Persistence (T1574.001).

  The primary telemetry sources required for this detection include Windows image load logs, particularly focusing on binaries executed from their designated paths. If malicious, this behavior can lead to unauthorized code execution, potentially allowing an adversary to maintain access or escalate privileges on the system. It is essential to note that this detection does NOT confirm malicious activity on its own without further context or corroborating evidence.

  ### Investigation Steps

  - **Analyze the process tree**: Check for the parent process of "SystemResetPlatform.exe" using Security Event ID 4688. Ensure the initiating process is legitimate (e.g., SYSTEM or an administrative user) to rule out malicious process spawning.

  - **Search for abnormal DLL locations**: Review Sysmon Event ID 7 (Image Load) to find instances where "RjvPlatform.dll" is loaded and verify that it originated from "C:\$SysReset\Framework\Stack\". This path is not standard and may indicate a compromise.

  - **Check for recent changes in settings**: Investigate System Event ID 7045 for any unusual service changes or registrations that may correlate with the execution of "SystemResetPlatform.exe". Look for native service modifications indicative of potential persistence mechanisms.

  - **Identify legitimate SystemReset activity**: Determine if "SystemResetPlatform.exe" is executing in its expected operational context through user-triggered resets or updates. Cross-reference with known events during system resets, focusing on the timeline of alerts.

  - **Confirm file integrity**: If suspicious behavior is confirmed, examine the filesystem for the presence of "RjvPlatform.dll" and check its properties (file hash, signature) using tools like Sysinternals' SigCheck. Verify if it matches known benign versions.

  ### Prioritization

  The severity of this alert is medium; while the affected system could be critical for operations, the likelihood of successful malicious abuse depends on the execution of the "SystemResetPlatform.exe" binary. DLL side-loading is a known and weaponized technique that could result in privilege escalation or persistence. Thus, prompt investigation is essential.

  ### Blind Spots and Assumptions

  This detection may be evaded if the adversary utilizes a different legitimate or custom service to execute the DLL or employs alternative loading techniques that do not trigger the rule. Reliable detection requires accurate logging configurations for image loads and process creations in Sysmon. Additionally, legitimate software updates or misconfigurations may trigger similar behavior. Related detection rules for file manipulation or service creation can complement this alert for a more comprehensive security posture.

