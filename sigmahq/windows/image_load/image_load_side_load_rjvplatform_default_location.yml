title: Potential RjvPlatform.DLL Sideloading From Default Location
id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
status: test
description: Detects loading of "RjvPlatform.dll" by the "SystemResetPlatform.exe"
  binary which can be abused as a method of DLL side loading since the "$SysReset"
  directory isn't created by default.
references:
- https://twitter.com/0gtweet/status/1666716511988330499
author: X__Junior (Nextron Systems)
date: 2023-06-09
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image: 'C:\Windows\System32\SystemResetPlatform\SystemResetPlatform.exe'
    ImageLoaded: 'C:\$SysReset\Framework\Stack\RjvPlatform.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the "RjvPlatform.dll" dynamic link library (DLL) is loaded by the "SystemResetPlatform.exe" executable. This method exemplifies a technique employed by attackers utilizing DLL sideloading to execute malicious code; in this case, the presence of the DLL in the non-default "$SysReset" directory hints at possible malicious activity. An attacker can exploit this vector to bypass security defenses and gain unauthorized privileges on the affected system.

  The primary objective of an attacker using this technique is to establish persistence, evade detection, and potentially escalate privileges. By loading a malicious DLL in a seemingly legitimate process, attackers aim to blend their malicious activities into normal system operations, making detection challenging. This activity corresponds with several tactics and techniques from the MITRE ATT&CK framework, notably Persistence (T1547), Defense Evasion (T1203), and Privilege Escalation (T1068).

  Key data sources for successful detection of this activity include process creation logs and image load events, specifically targeting logs that provide information on DLLs loaded into running processes on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate logs for the execution of "SystemResetPlatform.exe" to determine whether it was launched under normal circumstances or in conjunction with irregular behaviors or from unusual locations.
  - **Analyze DLL Load Events:** Check image load events to confirm the loading of "RjvPlatform.dll" and trace its origin, ensuring it correlates with the suspicious directory "$SysReset".
  - **Examine File System Changes:** Utilize file integrity monitoring tools to detect any unauthorized changes or creations within the "$SysReset" directory, focusing specifically on the presence of the "RjvPlatform.dll".
  - **Cross-reference with Known Threat Intelligence:** Compare the findings against organized threat intelligence sources to ascertain if "RjvPlatform.dll" has known malicious associations or if it appears in contexts related to other identified threats.

  ### Prioritization
  The severity of this alert is medium, as the detection of DLL sideloading activities can indicate an advanced threat attempting to maintain persistence within the environment. Lower precedence might be warranted if seen only once with benign attributes but should trigger further analysis if repeated or correlated with other suspicious activities.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage, particularly if the attacker uses alternative payloads or employes timing techniques to avoid detection. The detection logic assumes that the default location of the "$SysReset" directory would not be altered, which may not hold true in all environments. Additionally, the lack of comprehensive logging for image loads or process creations could hinder detection efficacy, necessitating correct configurations and logs from endpoints to trigger this alert appropriately.

