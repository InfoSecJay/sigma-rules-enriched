note: |
  ### Technical Context

  This Sigma rule detects the loading of the "RjvPlatform.dll" library by the "SystemResetPlatform.exe" executable. This behavior is indicative of DLL side loading, where an attacker may exploit the default directory structure of Windows to run malicious code while bypassing conventional security controls. The likely attacker objective is to establish persistence or escalate privileges by leveraging a trusted system executable to load a rogue dynamic-link library.

  This detection is associated with the MITRE ATT&CK technique T1574.001 (DLL Side-Loading). Primary telemetry sources include image load events, specifically Windows event logs or Sysmon data capturing executable load information (e.g., Sysmon Event ID 7). If malicious, this could compromise the integrity of the OS, allowing further exploitation within the environment. It is crucial to note that this detection does NOT confirm the execution of malicious activity on its own; additional context is required.

  ### Investigation Steps

  - **Check Sysmon logs for image load events:** Review Sysmon Event ID 7 for entries showing "SystemResetPlatform.exe" loaded "RjvPlatform.dll." Validate the timestamps for abnormal execution patterns indicative of compromise.

  - **Verify the integrity of the loading path:** Assess the presence of "C:\$SysReset\Framework\Stack\RjvPlatform.dll" to confirm its legitimacy. A default system should not have this path established. Suspicious file attributes or unusual last modified timestamps may indicate malicious activity.

  - **Identify running processes:** Use Task Manager or PowerShell to list running processes, ensuring "SystemResetPlatform.exe" is executing as expected. Legitimate instances typically run under SYSTEM context and involve user-related reset operations.

  - **Analyze user actions around the alert time:** Review Windows Security Event ID 4688 for process creation logs, focusing on the users who executed "SystemResetPlatform.exe." Legitimate uses may occur during scheduled maintenance or system recovery activities.

  - **Cross-reference with antivirus logs:** Check if any endpoint protection tools flagged "RjvPlatform.dll" or "SystemResetPlatform.exe" transactions. High-confidence malicious indicators include detections of the DLL or known threat signatures associated with it.

  ### Prioritization

  This alert has medium severity in an enterprise context. The affected system's role in maintenance could affect broader operational capabilities if compromised. The use of DLL side loading is a common technique leveraged by attackers, making it critical to investigate further.

  ### Blind Spots and Assumptions

  Detection may be evaded through the use of legitimate DLLs in conjunction with other trusted executables or through custom environment setups that obscure standard paths. It is essential to configure Sysmon correctly and ensure it captures all necessary image load events. Legitimate update processes or software installations may also generate similar behavior. Related detections, such as monitoring for unusual process creation patterns (e.g., high privileges executing non-standard applications), can strengthen coverage against such exploits.

