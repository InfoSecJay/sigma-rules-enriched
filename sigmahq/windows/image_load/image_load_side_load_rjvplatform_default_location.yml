title: Potential RjvPlatform.DLL Sideloading From Default Location
id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
status: test
description: Detects loading of "RjvPlatform.dll" by the 
  "SystemResetPlatform.exe" binary which can be abused as a method of DLL side 
  loading since the "$SysReset" directory isn't created by default.
