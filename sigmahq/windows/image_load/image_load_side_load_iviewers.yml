logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\iviewers.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Windows Kits\'
    - 'C:\Program Files\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets potential DLL sideloading scenarios involving the "iviewers.dll", part of the OLE/COM Object Interface Viewer. DLL sideloading is a technique where a malicious actor places a rogue DLL file in a location where a legitimate application would call it, allowing them to execute code under the guise of a trusted application. The likely objectives of an attacker using this technique are to maintain persistence and escalate privileges within a target environment while evading detection.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) due to the potential for maintaining an attacker foothold, and **Defense Evasion** (TA0005), as sideloading can circumvent standard security measures by leveraging trusted processes. Specifically, this detection aligns with the technique **DLL Search Order Hijacking** (T1574.001), where attackers exploit the way Windows locates DLL files, loading malicious code instead.

  Key data sources for this detection will include **Image Load events**, which provide insights into the DLL loading behavior of processes on Windows systems. These logs can reveal unusual behavior that could indicate the presence of malicious activity, particularly if the DLL being loaded comes from an untrusted location.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze logs for any instances where `iviewers.dll` is loaded outside of the expected paths. Focus on identifying the process that initiated the load and its execution context.
  - **Correlate with Process Creation Logs**: Look at the process creation events around the time `iviewers.dll` was loaded. Identify the parent process, which can provide context about how the DLL was invoked and if it was part of a legitimate workflow.
  - **Examine File Integrity**: Check the file attributes of `iviewers.dll` against known good versions. Analyze file hashes for any matches with known malware signatures or suspicious binaries.
  - **Assess User Activity**: Investigate any user account associated with the invocation of the DLL. Review their permissions and recent actions to determine if they were compromised or if the activity was anomalous for that user.

  ### Prioritization
  Given the high severity of the alert, any detection of potential DLL sideloading activities poses a significant risk to the enterprise. Such activities can lead to unauthorized access and escalation of privileges, which highlights both immediate and long-term impacts on the organization’s security posture.

  ### Blind Spots and Assumptions
  This detection method may not capture all instances of DLL sideloading, particularly if the malicious DLL is loaded from one of the trusted paths or if the attacker modifies standard behavior to evade detection. The logic assumes that the DLL is being loaded as part of a suspicious process and that baseline behavior for legitimate processes is well understood. Adequate logging of image loads must be enabled, and all relevant Windows event logs configured properly for this alert to function effectively.

