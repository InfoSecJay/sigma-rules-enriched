detection:
  selection:
    ImageLoaded|endswith: '\iviewers.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Windows Kits\'
    - 'C:\Program Files\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the potential sideloading of the "iviewers.dll" file, commonly associated with the OLE/COM Object Interface Viewer, from non-standard directories. The behavior typically points to an adversary attempting to execute malicious DLL files within a legitimate process context, potentially aiming for persistence, privilege escalation, or executing payloads without raising immediate alarms. This behavior fits into the MITRE ATT&CK framework under the tactic "Persistence" (TA0003) and the technique "Sideloading" (T1574.001).

  The primary telemetry source for this detection is Windows Image Load events, particularly focused on tracking DLLs being loaded into memory. If confirmed malicious, such activity could indicate a compromise, leading to unauthorized access or control over systems. However, it is important to note that this detection does NOT confirm that the loaded DLL is malicious on its own; it merely indicates a suspicious loading path that warrants further investigation.

  ### Investigation Steps

  - **Review Image Load events:** Check Windows Event ID  Audit Success (Event ID 4688) or Sysmon Event ID 7 for DLL loads associated with "iviewers.dll." Investigate if this event originates from atypical directories outside standard Program Files locations.

  - **Verify source directory:** Investigate the path of "iviewers.dll." If it is loaded from paths like 'C:\Program Files (x86)\Windows Kits\' or 'C:\Program Files\Windows Kits\', consider it benign. If it originates from any other directory, consider it suspect.

  - **Evaluate process parentage:** Identify the parent process using Event ID 4688 to check if it is a known legitimate process. Unexpected parent processes may indicate malicious activity (e.g., "cmd.exe" or "powershell.exe" as parents).

  - **Analyze for indicators of compromise:** Look for associated registry modifications or file system changes that align with the sideloading activity, such as unauthorized changes to COM objects or creation of unusual executables.

  - **Correlate with known activity:** Cross-reference with TI feeds or threat intelligence sources for any known associations of "iviewers.dll" with malicious campaigns, focusing on recent reports.

  ### Prioritization

  This alert is considered high priority due to the potential impact of the affected system, especially if critical enterprise assets are involved. The likelihood of malicious abuse is elevated given that DLL sideloading techniques are frequently used by attackers to evade detection tools. This behavior is also commonly weaponized in various attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant telemetry or logs due to security configurations on endpoints. Evasion techniques could include using legitimate directories or forged DLLs that are signed correctly. Legitimate applications running from development or testing environments might erroneously trigger this alert. Supplementary detections, such as monitoring for unusual process spawning or command-line arguments in conjunction with image loads, would strengthen surveillance against potential sideloading attempts.

