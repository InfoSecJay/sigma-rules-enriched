title: Potential Iviewers.DLL Sideloading
id: 4c21b805-4dd7-469f-b47d-7383a8fcb437
status: test
description: Detects potential DLL sideloading of "iviewers.dll" (OLE/COM Object
  Interface Viewer)
references:
- https://www.secureworks.com/research/shadowpad-malware-analysis
author: X__Junior (Nextron Systems)
date: 2023-03-21
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\iviewers.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Windows Kits\'
    - 'C:\Program Files\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the unauthorized loading of the "iviewers.dll" file, which may indicate DLL sideloading. This technique is typically employed by attackers to execute malicious DLLs under the guise of benign ones, potentially facilitating malware delivery or privilege escalation. The likely attacker objective is to maintain persistence and execute arbitrary code within a trusted process, leveraging the default Windows tooling and components.

  The relevant MITRE ATT&CK tactics and techniques include Persistence (ID: T1543.001) and Privilege Escalation (ID: T1674.001). The primary telemetry source is Windows image load events, specifically logs capturing DLL loads. If malicious, this could lead to significant security impacts such as data exfiltration or system compromise. It is important to note that this detection alone does not confirm malicious activity, as benign applications may also load this DLL under legitimate circumstances.

  ### Investigation Steps

  - **Confirm DLL Path and Signature:** Verify the path of the loaded `iviewers.dll` against known locations. Ensure it is not loaded from overridden directories (e.g., C:\Windows, C:\Program Files). Use Process Explorer to track instances of the DLL in memory.

  - **Check for Anomalous Parent Processes:** Investigate the parent processes associated with the DLL load (Security Event ID 4688). Look for unusual or suspicious processes, especially if they do not typically reference Windows SDKs.

  - **Review User Context:** Determine the user context that triggered the DLL load. Check for non-administrative users executing the load, especially if it does not align with expected roles (e.g., software developers).

  - **Monitor for Follow-On Activity:** Analyze recent activity around the time of the alert for lateral movement or privilege escalation actions. Use Windows Event IDs 4648 (Logon) and 4672 (Special Privileges Used) to track suspicious logon events.

  - **Validate Association with Known Threats:** Cross-reference the `iviewers.dll` activity with threat intelligence reports (such as Secureworks) to identify if this behavioral pattern has been associated with known malware campaigns.

  - **Assess Expected Behavior:** Legitimate activity may include a trusted application using `iviewers.dll` within its expected operational context. Compare against historical data to see if typical applications are using this DLL without anomalies.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the likelihood of malicious abuse, as DLL sideloading is a widely weaponized technique among adversaries. Given the nature of the affected system, immediate investigation is essential to prevent potential exploitation and lateral movement.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics like renaming or relocating the DLL to bypass the strict filtering. Reliable detection requires complete and unaltered image load event logging. Legitimate activities that may trigger this alert include authorized system administrations using development tools that involve `iviewers.dll`. A companion detection to enhance coverage could involve monitoring changes in process creation or events indicating unusual application behavior (e.g., unusual commands issued to known legitimate applications).

