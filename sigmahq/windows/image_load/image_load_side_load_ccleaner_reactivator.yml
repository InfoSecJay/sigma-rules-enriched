detection:
  selection:
    ImageLoaded|endswith: '\CCleanerReactivator.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files\CCleaner\'
    - 'C:\Program Files (x86)\CCleaner\'
    Image|endswith: '\CCleanerReactivator.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives could occur from other custom installation paths. Apply 
  additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This rule detects the loading of the "CCleanerReactivator.dll" potentially through sideloading, specifically when executed via the "CCleanerReactivator.exe" process. The likely attacker objective is to gain persistence, privilege escalation, or stealth, utilizing a legitimate application to execute malicious code. This behavior aligns with the MITRE ATT&CK tactic of Persistence and Privilege Escalation, specifically technique T1574.001 (DLL Sideloading).

  The primary telemetry sources include Windows image load logs, specifically focusing on events where the ImageLoaded ends with '\CCleanerReactivator.dll'. If malicious, the impact can range from unauthorized access to system privileges to further exploitation of the system. However, this detection does NOT confirm malicious intent on its own, as benign software installations can also trigger the alert.

  ### Investigation Steps

  - **Review image load events:** Examine relevant Windows event logs (Event ID 4104 or similar, depending on logging setup) for instances where `CCleanerReactivator.dll` is loaded. Focus on the process path associated with this file.

  - **Verify process lineage:** Trace the parent process of `CCleanerReactivator.exe` to determine the origin of its execution. Use process monitoring tools such as Sysmon Event ID 4688 to assess if it was started by a known or benign application.

  - **Identify known benign usage:** Check if `CCleanerReactivator.dll` is being loaded by the legitimate `CCleanerReactivator.exe` from `C:\Program Files\CCleaner\` or `C:\Program Files (x86)\CCleaner\`. Review recent installations or updates of CCleaner as potential validation.

  - **Correlate with other security events:** Assess surrounding security events, such as recent Windows Defender alerts or other endpoint protection logs that could indicate the presence of related suspicious behavior or malware.

  - **Assess file attributes:** Gather properties of `CCleanerReactivator.dll`, such as file size, digital signatures, and timestamps. Compare these against known attributes of legitimate files to rule out tampering or substitution.

  - **Check for other malicious indicators:** Look for attempts to execute subsequent malware or anomalous network connections originating from `CCleanerReactivator.exe`, such as unusual outgoing traffic or connections to known malicious IP addresses.

  ### Prioritization

  The severity of this alert is medium. The potential compromise of a system through DLL sideloading can lead to significant risk depending on the system's role, especially if it is a domain controller or an asset containing sensitive data. There is a realistic potential for malicious abuse, making this behavior a concern, though attacks using this tactic may not be as prevalent as other methods.

  ### Blind Spots and Assumptions

  Detection could miss attackers who evade detection via legitimate-looking executable names or those using different installation paths that are not covered by the current filtering. Reliable detection also depends on enabling adequate logging for image loads and related process execution. Certain benign applications might trigger this alert if they utilize similar loading techniques. A companion detection to strengthen coverage would be monitoring for unusual process execution patterns around `CCleanerReactivator.exe`, using process monitoring tools like Sysmon to capture execution details.

