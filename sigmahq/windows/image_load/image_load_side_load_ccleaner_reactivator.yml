title: Potential CCleanerReactivator.DLL Sideloading
id: 3735d5ac-d770-4da0-99ff-156b180bc600
status: test
description: Detects potential DLL sideloading of "CCleanerReactivator.dll"
references:
- https://lab52.io/blog/2344-2/
author: X__Junior
date: 2023-07-13
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\CCleanerReactivator.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files\CCleaner\'
    - 'C:\Program Files (x86)\CCleaner\'
    Image|endswith: '\CCleanerReactivator.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives could occur from other custom installation paths. Apply 
  additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This detection identifies the potential sideloading of the "CCleanerReactivator.dll" file, which is typically loaded by the legitimate "CCleanerReactivator.exe" executable. Sideloading occurs when a malicious DLL is injected into a trusted application to execute unauthorized code and is often used by adversaries to elevate privileges and persist in a target environment. This behavior aligns with the MITRE ATT&CK technique for DLL Sideloading (T1574.001), which is commonly employed to bypass security controls.

  The primary telemetry sources for this detection are Windows image load events. The rule specifically monitors for the loading of the "CCleanerReactivator.dll" file from designated paths linked to CCleaner installations. If malicious, this activity could lead to unauthorized execution of code, data exfiltration, or system compromise. Importantly, this detection alone does NOT confirm malicious intent; it merely indicates abnormal DLL loading behavior that requires further investigation.

  ### Investigation Steps

  - **Review image loading events:** Investigate Windows Event ID 4100 (Image Load) for the loading of the 'CCleanerReactivator.dll' from the paths specified in the detection rule. Cross-reference the timestamp with known legitimate CCleaner usage.

  - **Validate the executable process:** Check for the execution of "CCleanerReactivator.exe" by looking for Windows Security Event ID 4688 (Process Creation). Compare the parent process to confirm that it is legitimately CCleaner-related and from a trusted path.

  - **Check for unauthorized directories:** Verify any loading of "CCleanerReactivator.dll" from other than the allowed paths (C:\Program Files\CCleaner\ or C:\Program Files (x86)\CCleaner\). Any deviation from these paths may indicate malicious activity.

  - **Analyze DLL hash values:** Cross-reference the hash of "CCleanerReactivator.dll" against known good hashes or threat intelligence databases. If the DLL is unsigned or has a suspicious hash value, it is likely malicious.

  - **Investigate user behavior:** Analyze user activities around the time of the alert. Legitimate usage of CCleaner typically involves regular maintenance tasks and not frequent modifications to system settings or configurations.

  ### Prioritization

  This alert is of medium severity due to the potential for privilege escalation and persistence that sideloading can introduce into the environment. The involvement of a commonly used application heightens the likelihood of malicious abuse, especially if the behavior aligns with known tactics used in targeted attacks. While the rule detects potentially malicious behavior, its true severity may depend on the overall context of the environment and the impacted system's criticality.

  ### Blind Spots and Assumptions

  This detection may miss sideloading attempts that utilize other DLL files not specifically monitored or if attackers use application whitelisting or alternative methods to conceal their activity. Reliable detection requires proper logging configuration for image loads and process creation events. Additionally, legitimate custom installations of CCleaner might trigger false positives, requiring analysts to consider users’ installation patterns. A related detection that complements this rule could be monitoring for unexpected changes to CCleaner or its related executables.

