title: CredUI.DLL Loaded By Uncommon Process
id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
status: test
description: Detects loading of "credui.dll" and related DLLs by an uncommon 
  process. Attackers might leverage this DLL for potential use of 
  "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW".
references:
- https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
- https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
- https://github.com/S12cybersecurity/RDPCredentialStealer
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2026-06-29
tags:
- attack.credential-access
- attack.collection
- attack.t1056.002
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith:
    - '\credui.dll'
    - '\wincredui.dll'
  - OriginalFileName:
    - 'credui.dll'
    - 'wincredui.dll'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\SystemApps\'
  filter_main_full:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\regedit.exe'         # This FP is triggered for example when choosing the "Connect Network Registry" from the menu
  filter_optional_opera:
    Image|endswith: '\opera_autoupdate.exe'
  filter_optional_process_explorer:
    Image|endswith:
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\procexp.exe'
  filter_optional_teams:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\Teams\'
    Image|endswith: '\Teams.exe'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate processes loading those DLLs in your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of "credui.dll" or "wincredui.dll" by processes that are not typically associated with these DLLs, suggesting suspicious behavior. The likely attacker objective is credential theft, leveraging methods like "CredUIPromptForCredentials" to capture user credentials covertly. This detection aligns with the MITRE ATT&CK technique T1056.002 (Input Capture: Credential API Hooking).

  The primary telemetry source is Windows image load events, specifically focusing on event types related to DLL loading. If malicious, this could allow an adversary to siphon off credentials, granting unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm malicious intent on its own; it needs contextual analysis to interpret the findings.

  ### Investigation Steps

  - **Review process origins: ** Check the loading process source: Look for the event and verify Event ID 7 in the Sysmon logs to identify whether the "credui.dll" was loaded by common processes like "explorer.exe" or atypical ones.

  - **Validate DLL context: ** Analyze the paths associated with the loading of the DLL: Confirm that the loading paths for "credui.dll" or "wincredui.dll" are not from noted safe locations (like System32 or known applications) by inspecting field "Image".

  - **Correlate with user behavior: ** Look for associated user actions: Assess user activity around the time of the alert to determine if it matches expected behavior, such as logging in or accessing credential-related features within common applications.

  - **Identify high-confidence malicious indicators: ** Look for outlier processes, particularly any unrecognized applications executing the DLL: Event ID 7 should highlight unusual executables loading the DLL that could correlate with known malicious behavior.

  - **Assess system impact: ** Consider the role of the affected asset: Determine if the process in question pertains to a critical system that handles sensitive credentials, raising the stakes for any potential security breach.

  ### Prioritization

  This alert is of medium severity due to the potential for credential exposure on affected systems. The likelihood of exploitation through this attack vector is significant given the frequent targeting of credential capture methods in the wild. While not universally weaponized, malicious use of "credui.dll" for phishing attacks makes it a notable risk.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate processes that could trigger similar alerts, such as remote desktop access tools. Required log sources include Sysmon for detailed process tracking and Windows event logs. Legitimate activities like system tools accessing `credui.dll` for user login prompts can generate false positives. A companion detection covering unauthorized access attempts (e.g., failed logins or suspicious RDP sessions) would enhance overall detection capabilities.

