title: CredUI.DLL Loaded By Uncommon Process
id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
status: test
description: Detects loading of "credui.dll" and related DLLs by an uncommon 
  process. Attackers might leverage this DLL for potential use of 
  "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW".
references:
- https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
- https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
- https://github.com/S12cybersecurity/RDPCredentialStealer
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2025-12-09
tags:
- attack.credential-access
- attack.collection
- attack.t1056.002
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith:
    - '\credui.dll'
    - '\wincredui.dll'
  - OriginalFileName:
    - 'credui.dll'
    - 'wincredui.dll'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\SystemApps\'
  filter_main_full:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\regedit.exe'         # This FP is triggered for example when choosing the "Connect Network Registry" from the menu
  filter_optional_opera:
    Image|endswith: '\opera_autoupdate.exe'
  filter_optional_process_explorer:
    Image|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
  filter_optional_teams:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\Teams\'
    Image|endswith: '\Teams.exe'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate processes loading those DLLs in your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of "credui.dll" or "wincredui.dll" by processes that are not typical for these dynamic link libraries (DLLs). Attackers may leverage these DLLs to invoke credential prompting functions, particularly "CredUIPromptForCredentials," which can facilitate credential theft or unauthorized access. This behavior is associated with the MITRE ATT&CK technique: Credential Access - T1056.002.

  The primary telemetry source consists of Windows image load events, specifically tracking DLL loading patterns via Event ID 4104 or similar log types that capture process and DLL interactions. If malicious, this behavior could enable an attacker to compromise user credentials or escalate privileges within the environment. It is crucial to understand that this detection does not confirm malicious intent on its own, as legitimate applications can also load these DLLs under certain contexts.

  ### Investigation Steps

  - **Check process legitimacy**: Investigate the process that triggered the alert by reviewing telemetry for Event ID 4688 (Process Creation) to determine the parent process. If the parent is a common, trusted application (e.g., a known legitimate update process), this could indicate benign activity.

  - **Identify loaded DLLs**: Use Sysmon logs (Event ID 7 - Image Load) to enumerate DLLs associated with the detected process. Focus on any instance where "credui.dll" or "wincredui.dll" is loaded by an unexpectedly named process (e.g., not explorer.exe or system settings).

  - **Review execution context**: Analyze user account details associated with the triggering process. If a non-administrative user is running a high-risk process (like a custom script or a malicious tool), this could indicate a malicious use case.

  - **Examine process reputation**: Query the Tango or VirusTotal databases using the SHA256 hash of the triggering process to review the file for known malicious activity. Legitimate processes should generally be reputable with multiple positive detections.

  - **Look for credential theft patterns**: Search for artifacts in the Windows Event Logs (Security Event ID 4624 - Successful Logon) or application-specific logs, indicating unusual logon attempts or credential prompts that correlate with the alert’s timing.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive credential access when loaded by uncommon processes. The likelihood of malicious exploitation is moderate, given that the behavior could be weaponized. Moreover, attackers frequently use similar techniques to create credential prompts, making this a worthy alert for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers can employ legitimate processes to evade this alert, thereby blending with standard operations. The reliability of detection also depends on comprehensive logging configurations; ensure Sysmon and adequate event logging for image load events are enabled. Moreover, legitimate applications, such as those involving user authentication or system settings adjustments, can trigger this alert, necessitating context review. Companion detections to consider include monitoring suspicious credential dumps via tools like Mimikatz (MITRE ATT&CK T1003) for enhanced credential access strategy coverage.

