title: CredUI.DLL Loaded By Uncommon Process
id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
status: test
description: Detects loading of "credui.dll" and related DLLs by an uncommon process.
  Attackers might leverage this DLL for potential use of "CredUIPromptForCredentials"
  or "CredUnPackAuthenticationBufferW".
references:
- https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
- https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
- https://github.com/S12cybersecurity/RDPCredentialStealer
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2025-12-09
tags:
- attack.credential-access
- attack.collection
- attack.t1056.002
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith:
    - '\credui.dll'
    - '\wincredui.dll'
  - OriginalFileName:
    - 'credui.dll'
    - 'wincredui.dll'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\SystemApps\'
  filter_main_full:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\regedit.exe'         # This FP is triggered for example when choosing the "Connect Network Registry" from the menu
  filter_optional_opera:
    Image|endswith: '\opera_autoupdate.exe'
  filter_optional_process_explorer:
    Image|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
  filter_optional_teams:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\Teams\'
    Image|endswith: '\Teams.exe'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate processes loading those DLLs in your environment.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the loading of "credui.dll" (and related DLLs) by uncommon processes. The main concern is that attackers may exploit the "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW" functions within this DLL to capture user credentials stealthily. By running potentially malicious processes that load these libraries, attackers can gain unauthorized access to sensitive information, thereby facilitating credential theft.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Credential Access** (TA0006)
  - **Input Capture** (T1056.002)

  To substantiate these activities, primary sources of telemetry include image load logs from Windows systems, which detail which processes are loading which DLLs.

  ### Investigation Steps
  - **Review Image Load Events**: Examine logs for processes that have loaded "credui.dll" or "wincredui.dll". Focus on identifying any uncommon processes that are not typical applications or system services.
  - **Analyze Process Context**: Look at the command line and parent process information for the detected uncommon processes. This analysis will help identify the context in which the DLL was loaded and determine if it correlates with legitimate work or potential malicious activity.
  - **Correlate with User Activity**: Check for any recent user activities that might have led to the loading of "credui.dll". This includes looking at interactions with remote services or applications known to prompt for credentials.
  - **Conduct Threat Intelligence Review**: If the behavior falls outside normal parameters, review threat intelligence to assess whether similar technique usage has been reported in your industry or environment.

  ### Prioritization
  This alert has medium severity due to the potential impact of stolen credentials on enterprise resources and the relatively high likelihood of credential harvesting attempts in present-day cyber operations.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where "credui.dll" is loaded by legitimate applications that are not covered in the filters, potentially leading to false positives from benign processes. Additionally, the detection logic assumes that unusual processes will not legitimately load these libraries under normal circumstances. Adequate log collection from Windows image loads is necessary for this alert to function effectively, along with a properly configured logging environment capturing all relevant activities.

