title: CredUI.DLL Loaded By Uncommon Process
id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
status: test
description: Detects loading of "credui.dll" and related DLLs by an uncommon process.
  Attackers might leverage this DLL for potential use of "CredUIPromptForCredentials"
  or "CredUnPackAuthenticationBufferW".
references:
- https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
- https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
- https://github.com/S12cybersecurity/RDPCredentialStealer
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-10-20
modified: 2025-12-09
tags:
- attack.credential-access
- attack.collection
- attack.t1056.002
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith:
    - '\credui.dll'
    - '\wincredui.dll'
  - OriginalFileName:
    - 'credui.dll'
    - 'wincredui.dll'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\SystemApps\'
  filter_main_full:
    Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\regedit.exe'         # This FP is triggered for example when choosing the "Connect Network Registry" from the menu
  filter_optional_opera:
    Image|endswith: '\opera_autoupdate.exe'
  filter_optional_process_explorer:
    Image|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
  filter_optional_teams:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\Teams\'
    Image|endswith: '\Teams.exe'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate processes loading those DLLs in your environment.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the loading of the `credui.dll` and `wincredui.dll` libraries by uncommon processes in a Windows environment. Attackers may exploit these libraries using functions like `CredUIPromptForCredentials` to prompt for user credentials, aiming to collect sensitive information or perform unauthorized actions. This behavior correlates with the MITRE ATT&CK techniques for credential access and user input capture (T1056.002).

  The primary telemetry source is Windows Event logs capturing image load events, particularly targeting Event ID 4697 (Service Installation) and Sysmon Event ID 7 (Image loaded). If the detection is confirmed as malicious, it may indicate an attempt to capture user credentials, leading to potential credential theft or further infiltration. This detection does not confirm that credential theft has occurred but highlights suspicious activity requiring further investigation.

  ---

  ### Investigation Steps

  - **Identify the process loading the DLLs:** Examine Windows Security Event ID 4688 (Process Creation) or Sysmon Event ID 1 to determine which process triggered the rule. Look for processes that deviate from normal behavior (e.g., not part of standard application families).

  - **Assess the context of the loading event:** Cross-reference the loading event timestamp with user activity logs to check if it correlates with recent user actions or system events. Legitimate applications that commonly load these DLLs include Windows Explorer and system management tools.

  - **Review for credential-based telemetry:** Check for Windows Event ID 4624 (Successful Logon) around the same timestamps to see if there were any irregularities such as unexpected logins or usage of service accounts.

  - **Examine the original file names in the event:** If the `OriginalFileName` field reflects unusual entries (e.g., customized or misspelled file names), raise the threat level and consider it a high-confidence malicious indicator.

  - **Monitor for abnormal persistence mechanisms:** Inspect for persistence mechanisms such as scheduled tasks (Event ID 4698) or unusual startup entries that may have invoked this loading behavior, indicating attempts at stealthy access to user credentials.

  - **Correlate with network activity:** Monitor for outbound connections that originated from the involved processes. Any unusual command-and-control pattern (such as connections to unfamiliar IPs) could amplify the threat's severity.

  ---

  ### Prioritization

  This alert should be treated as medium severity. While not every instance indicates malicious intent, the abnormal loading of credential-related DLLs by uncommon processes poses a potential threat to user credential integrity. Given that attackers often weaponize such behaviors to exfiltrate credentials, prompt investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications running outside common paths that load these DLLs, potentially generating false positives. Ensure that logging configurations for process creation and DLL loading are enabled on all relevant endpoints. Additionally, consider companion detections such as lateral movement alerts (T1075), which contribute to detecting broader malicious credential misuse scenarios.

