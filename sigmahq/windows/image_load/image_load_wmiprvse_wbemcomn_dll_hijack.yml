note: |
  ### Technical Context

  This Sigma rule detects the creation of a suspicious `wbemcomn.dll` file located in the `C:\Windows\System32\wbem\` directory, which is subsequently loaded by the WMI process `wmiprvse.exe`. This behavior is indicative of a WMI DLL hijack, a technique that attackers use to execute malicious code under the guise of a trusted process. The likely objective here is to gain persistent remote access or covertly execute commands while avoiding detection.

  Relevant to MITRE ATT&CK, this activity falls under the tactic **Execution** and technique **WMI Event Subscription** (T1047), as well as **Lateral Movement** through WMI (T1021.002). The primary telemetry sources involved are Windows image load logs, specifically monitoring for the execution of `wmiprvse.exe` and checking for the loading of `wbemcomn.dll`. If confirmed malicious, this can lead to unauthorized access or data exfiltration. However, this detection does NOT confirm that the activity is malicious on its own; further context is necessary to assess intent.

  ### Investigation Steps

  - **Verify the creation of `wbemcomn.dll`:** Check the file system for the existence and timestamp of `C:\Windows\System32\wbem\wbemcomn.dll`. A recent creation time, especially outside of normal patch cycles, is a key indicator of potential compromise.

  - **Examine `wmiprvse.exe` activity:** Review Windows Security Event ID 4688 (Process Creation) logs for entries related to `wmiprvse.exe`. Unauthorized or unusual parameters during its creation can indicate suspicious behavior.

  - **Identify legitimate system use:** Look for cases where `wbemcomn.dll` is created or modified during standard administrative activities or routine maintenance, such as system updates. Legitimate entries should have timestamps aligning with these activities.

  - **Correlate with remote access logs:** Investigate Windows Event ID 4624 (Logon) and 4648 (Logon Attempt) for any unusual remote logins or access from non-administrative accounts leading up to the DLL creation, particularly focusing on times and user accounts used.

  - **Review application logs for WMI usage:** Check for relevant entries in Windows Event Viewer under Applications and Services Logs > Microsoft > Windows > WMI-Activity > Operational to trace WMI queries requesting the loaded DLL.

  - **Search for network anomalies:** Inspect firewall logs for outbound connections related to the system around the time of file creation or WMI process execution. Look for any unexpected external connections or DNS requests that could indicate command and control (C2) activity.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant impact on system integrity and security. The behavior demonstrates common tactics used in lateral movement and remote exploitation, making it a critical point of investigation. Such DLL injection techniques are frequently weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if logging levels are insufficient or if WMI Service is disabled, potentially masking the activity. False positives could arise from legitimate administrative actions or software installations that also utilize WMI for configuration. Companion detections such as monitoring for unusual WMI event subscriptions or script execution can enhance coverage and context for this alert.

