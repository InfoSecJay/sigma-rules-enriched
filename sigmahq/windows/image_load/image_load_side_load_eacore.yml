detection:
  selection:
    ImageLoaded|endswith: '\EACore.dll'
  filter_main_legit_path:
    Image|contains|all:
    - 'C:\Program Files\Electronic Arts\EA Desktop\'
    - '\EACoreServer.exe'
    ImageLoaded|startswith: 'C:\Program Files\Electronic Arts\EA Desktop\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading activities associated with the file "EACore.dll." DLL sideloading is a technique where a malicious version of a legitimate DLL is loaded by a program, leveraging the trust established by the original software. The primary objective of an attacker utilizing this technique is to execute malicious code with the same privileges as the legitimate application, thereby evading detection measures and compromising system security.

  The attack scenario is typically associated with attempts to maintain persistence, escalate privileges, or evade defenses after initial compromise. A successful exploitation can allow attackers to perform unauthorized actions, access sensitive data, or establish further footholds within a network.

  This rule maps to several MITRE ATT&CK techniques, particularly:
  - **T1574.001 - DLL Side-Loading** (Persistence)
  - **T1203 - Exploitation of Client-side Vulnerabilities** (Defense Evasion)
  - **T1068 - Exploitation of Vulnerability** (Privilege Escalation)

  The primary data sources for detection include image load events from Windows systems, focusing on instances where "EACore.dll" is loaded outside of its legitimate directory, specifically when it does not originate from the expected path associated with "C:\Program Files\Electronic Arts\EA Desktop\."

  ### Investigation Steps
  - **Review Image Load Logs:** Check the image load events in your logging solution to identify instances where "EACore.dll" was loaded from non-standard directories.
  - **Analyze Execution Context:** Evaluate the processes that initiated the load of "EACore.dll" to determine if it was invoked by legitimate applications or if there are signs of tampering.
  - **Correlate with User Activity:** Cross-reference the timestamps of the DLL load events with user activities or scheduled tasks to identify any abnormal patterns or unauthorized access attempts.
  - **Validate Legitimate Software Integrity:** Confirm the legitimacy of software installations related to Electronic Arts and ensure that no unapproved modifications or installations are present.

  ### Prioritization
  The severity of this alert is high due to the potential impact of successful DLL sideloading, which can lead to extensive privilege escalation and persistent access if malicious code is executed. Given the commonality of installed applications and the high stakes for user data and credentials, this rule warrants immediate investigation.

  ### Blind Spots and Assumptions
  There are inherent limitations in the detection coverage, such as the possibility of legitimate applications being incorrectly identified as suspicious due to updates or changes in file paths. The detection logic assumes that all instances of "EACore.dll" loaded from unexpected paths are malicious, which may not always be accurate. Required logs must be enabled for image loading events in Windows, and proper configurations must be in place to ensure comprehensive visibility into process activity.

