  ---

  ### Technical Context

  This rule detects potential DLL sideloading behavior involving the "EACore.dll" file, which may be loaded by applications under suspicious circumstances rather than legitimate usage. Adversaries may aim to stealthily execute malicious code or escalate privileges by exploiting the loading mechanisms of legitimate applications. This behavior aligns with MITRE ATT&CK Technique T1574.001 (DLL Search Order Hijacking). The primary telemetry source is the image load event log, particularly focusing on process creation and DLL loading activities.

  If malicious, this behavior could lead to unauthorized access and system compromise, enabling adversaries to execute arbitrary code with the privileges of the exploited application. However, it is critical to understand that this detection does NOT confirm malicious intent or action by itself, as legitimate software operations could trigger similar behavior.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for the parent process associated with the loading of "EACore.dll." Verify if the process (e.g., EACoreServer.exe) is executing from the expected directory (`C:\Program Files\Electronic Arts\EA Desktop\`).

  - **Analyze DLL load paths:** Assess logs for Sysmon Event ID 7 entries to examine the directory paths from which "EACore.dll" is being loaded. Any deviations from `C:\Program Files\Electronic Arts\EA Desktop\` could indicate malicious activity.

  - **Identify high-confidence malicious indicators:** Look for instances where "EACore.dll" is loaded but the parent process is not "EACoreServer.exe." This may suggest attempted sideloading of the DLL by a rogue application, indicative of a potential compromise.

  - **Evaluate legitimate behavior:** Confirm that all instances of "EACore.dll" loading are from authorized applications. Typical benign interactions will show no anomalies in the process lineage leading up to the DLL load.

  - **Capture additional telemetry:** Use tools like Sysinternals Process Monitor to track any file system changes related to "EACore.dll." Look for unusual write access or creation of files within the EA Desktop directory or its subfolders.

  - **Assess asset criticality:** Determine if the affected host runs critical applications or holds sensitive data. Priority should be given to investigating alerts from high-importance hosts (e.g., those with administrative users).

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on systems running electronic gaming applications, which may store sensitive user information. The likelihood of malicious abuse is significant, as hijacking DLLs is a common tactic employed by skilled adversaries to gain persistence or escalate privileges. This behavior has been known to be weaponized, increasing the urgency for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging settings or misconfigured event sources that fail to capture relevant image load events. Legitimate software updates or misconfigured application settings could trigger the alert. A recommended companion detection is monitoring for unexpected process injection (e.g., Sysmon Event ID 8), enhancing the overall detection capability for malicious activities targeting DLLs.

