note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of `EACore.dll`, where a malicious application may attempt to load a legitimate DLL from a trusted application folder to evade detection. The likely attacker objective is to deliver additional malicious payloads while leveraging the trust of the EA Desktop application to execute code without triggering security alarms. Relevant MITRE ATT&CK tactics include Defense Evasion (T1569 - Application Layer Protocol) and Persistence (T1574.001 - DLL Side-Loading). The primary telemetry sources include Windows image load events, specifically monitoring for DLL loading behaviors.

  If malicious, this behavior could lead to unauthorized access, privilege escalation, or persistent threats on affected systems. This detection does NOT confirm malicious activity on its own; further investigation is required to determine the legitimacy of process origins and integrity.

  ### Investigation Steps

  - **Check Event Logs for DLL Loads:** Review Security Event ID 4688 and Sysmon Event ID 7 for processes loading `EACore.dll`. Compare the parent process to validate its legitimacy. Expected benign use comes from `EACoreServer.exe`.

  - **Verify Process Path Integrity:** Confirm that `C:\Program Files\Electronic Arts\EA Desktop\` is the legitimate directory where `EACore.dll` was loaded from. Malicious indicators include the same DLL loaded from a non-standard or unexpected path.

  - **Assess Process Behavior:** Investigate any associated processes for abnormal behavior like unusual network connections or file modifications. Event ID 4688 of non-EA processes starting with `EACore.dll` may indicate malicious intent.

  - **Analyze User Context:** Determine the user account that executed the process. Privileged accounts or service accounts running `EACore.dll` in an unusual context could signify a malicious action.

  - **Review for File Creation or Modification:** Check for file creation or modification events (e.g., Sysmon Event ID 11) related to the execution of `EACore.dll`. Look for signs of persistence mechanisms, such as newly created or altered files in the EA Desktop directory.

  ### Prioritization

  This alert is of high severity given that it involves potential DLL sideloading, a method frequently used by attackers for persistence and privilege escalation. Given the potential for malicious abuse, especially in environments where EA applications are not strictly monitored, this behavior needs swift investigation.

  ### Blind Spots and Assumptions

  Evasion techniques related to this detection could include renaming `EACore.dll` or using similar-looking DLLs that do not trigger the rule. Reliable detection also depends on proper logging configurations for Sysmon and Windows event logs. Legitimate activities may include the standard operation of the EA Desktop application, which could also produce similar alerts. A related detection involves monitoring other applications’ DLL loads to further strengthen coverage against general DLL sideloading techniques.

