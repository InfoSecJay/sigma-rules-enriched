note: |
  ### Technical Context

  This rule detects the potential sideloading of the malicious DLL "EACore.dll" commonly associated with exploitation techniques. Attackers may aim to run arbitrary code remotely, often to achieve persistence or privilege escalation (MITRE ATT&CK Tactic: Persistence, T1574.001). The primary telemetry sources are Windows image load events, particularly focusing on the loading of DLLs from non-standard paths that may not align with legitimate execution contexts.

  If malicious, this behavior could lead to unauthorized access, data manipulation, or further system compromise. However, this detection does NOT confirm malicious intent or execution on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Analyze process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation that includes `EACoreServer.exe` or related processes. Compare the parent process to see if it aligns with expected execution flows from `C:\Program Files\Electronic Arts\EA Desktop\`.

  - **Verify DLL loading behavior:** Inspect Windows Event ID 4101 or Sysmon Event ID 7 for `ImageLoaded` entries. Confirm that `EACore.dll` is loaded from legitimate paths such as the documented EA Desktop directory. Unusual paths, such as temporary directories or user profile locations, indicate potential malicious activity.

  - **Check for related persistent tasks:** Look for scheduled tasks or startup items referencing `EACore.dll` by querying Task Scheduler or examining registry entries (e.g., `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`). Legitimate instances should avoid such dependencies.

  - **Monitor network activity:** Analyze outbound connections associated with the process using firewall logs or network traffic captures. Look for anomalous connections or communication with known malicious IPs which could indicate broader compromise.

  - **Examine file artifacts:** Look for file creation or modification timestamps related to `EACore.dll`. Check for recent changes that coexist with logs indicating its sideloading. Legitimate updates should correlate with application patch cycles.

  - **Identify user behavior:** Investigate user actions that may have led to this alert. Look for any recent installations or updates of EA Desktop applications, correlating legitimate usage patterns with timestamps in the logs.

  ### Prioritization

  This alert is flagged as high severity due to the potential impact on user data and system integrity through unauthorized access and manipulation. The likelihood of malicious abuse is significant, given that DLL sideloading is a recognized method exploited by attackers. This behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may not capture all instances of DLL sideloading, especially if the attacker employs uncommon paths or methods to conceal their actions. Reliable detection requires proper logging functionality for image load events and appropriate configurations. Legitimate software updates or installations could inadvertently trigger this alert. A related detection could focus on unauthorized modifications of executable files, enhancing the coverage against hidden threats.

