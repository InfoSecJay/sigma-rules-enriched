title: DLL Loaded From Suspicious Location Via Cmspt.EXE
id: 75e508f7-932d-4ebc-af77-269237a84ce1
status: test
description: Detects cmstp loading "dll" or "ocx" files from suspicious 
  locations
references:
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/TTPs/Defense%20Evasion/T1218%20-%20Signed%20Binary%20Proxy%20Execution/T1218.003%20-%20CMSTP/Procedures.yaml
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-30
modified: 2023-02-17
tags:
- attack.stealth
- attack.t1218.003
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\cmstp.exe'
    ImageLoaded|contains:
            # Add more suspicious paths as you see fit in your env
    - '\PerfLogs\'
    - '\ProgramData\'
    - '\Users\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    ImageLoaded|endswith:
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `cmstp.exe` loading DLL or OCX files from suspicious directories, such as `C:\PerfLogs\`, `C:\ProgramData\`, or `C:\Windows\Temp\`. The potential adversary objective is to execute malicious code through a technique known as “Signed Binary Proxy Execution,” allowing attackers to run malware without raising immediate suspicion due to the use of a legitimate process. This behavior corresponds to the MITRE ATT&CK Tactic: Execution, specifically Technique T1218.003 (CMSTP).

  The primary telemetry sources are Windows event logs documenting image loads, specifically image load events associated with executable processes (Event ID 11). If detected, this behavior could indicate a security breach or an attempt to execute unauthorized applications. However, it is critical to note that this detection alone does not confirm malicious intent; legitimate administrative tasks may also utilize `cmstp.exe` for valid purposes.

  ### Investigation Steps

  - **Verify the execution context of `cmstp.exe`:** Check for Event ID 4688 (Process Creation) to determine the parent process ID and user context. If `cmstp.exe` was launched under a benign or administrative context (e.g., by `powershell.exe` or `explorer.exe`), further investigation may be needed.

  - **Inspect loaded images for known hash values:** Compare the loaded DLL or OCX file hashes against known malicious samples using a threat intelligence database. If the hash is found in malicious databases, escalate as a confirmed indicator of compromise.

  - **Audit suspicious directories:** Investigate the contents of directories that may have loaded suspicious DLLs or OCXs. Authentic paths typically contain legitimate files; an unusual presence of executable files, especially from `C:\Temp\` or `C:\Users\`, can indicate malicious activity.

  - **Conduct a behavior analysis of the compromised system:** Review Sysmon logs (Event ID 7 for File Creation Time) and identify any high-volume or anomalous file creation events occurring in these directories around the same time as the initial detection, suggesting exfiltration or lateral movement.

  - **Check for command-line arguments:** Since `cmstp.exe` can take parameters, inspect the command line used to execute `cmstp.exe`. Legitimate usage often includes specific config files; queries without such arguments may indicate malicious behavior.

  ### Prioritization

  This alert is considered high severity due to the possibility of executing malware from a directory commonly used by adversaries for staging. The use of `cmstp.exe` is notably weaponized among attackers, increasing the potential impact on the environment if successful exploitation occurs.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not correctly configured, particularly if Sysmon isn't deployed for comprehensive visibility into process creation and image loads. Additionally, legitimate administrative activities could trigger this alert, such as valid software updates or installations. Companion detections related to suspicious PowerShell commands or known malware signatures loading via these methods can enhance monitoring for this type of behavior.

