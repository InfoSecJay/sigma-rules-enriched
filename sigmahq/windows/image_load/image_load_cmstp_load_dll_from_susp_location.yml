title: DLL Loaded From Suspicious Location Via Cmspt.EXE
id: 75e508f7-932d-4ebc-af77-269237a84ce1
status: test
description: Detects cmstp loading "dll" or "ocx" files from suspicious locations
references:
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/TTPs/Defense%20Evasion/T1218%20-%20Signed%20Binary%20Proxy%20Execution/T1218.003%20-%20CMSTP/Procedures.yaml
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-30
modified: 2023-02-17
tags:
- attack.defense-evasion
- attack.t1218.003
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\cmstp.exe'
    ImageLoaded|contains:
            # Add more suspicious paths as you see fit in your env
    - '\PerfLogs\'
    - '\ProgramData\'
    - '\Users\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    ImageLoaded|endswith:
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where `cmstp.exe` loads dynamic-link library (DLL) or ActiveX control (OCX) files from potentially suspicious locations. The `cmstp.exe` executable, part of Windows' Connection Manager, is sometimes exploited by attackers to execute malicious code hidden within these libraries, thereby circumventing traditional security mechanisms. By targeting DLL hijacking or loading malicious files from unexpected directories, attackers may aim to obfuscate their activity, maintain persistence, or execute arbitrary code, potentially leading to data exfiltration, lateral movement, or complete system compromise.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Defense Evasion (TA0005)**: Techniques specifically aimed at avoiding detection.
  - **Signed Binary Proxy Execution (T1218.003)**: This technique highlights how attackers can use legitimate system binaries to run their malicious payloads covertly.

  The primary data sources for this detection will include image load events from the Windows operating system, which log details about executables and their respective DLLs or OCX files.

  ### Investigation Steps
  - **Review Image Load Events**: Examine the image load events to identify instances where `cmstp.exe` has loaded DLL or OCX files from suspicious locations like `\PerfLogs\`, `\ProgramData\`, or `C:\Temp\`. Look for entries indicating unusual or unauthorized file access.

  - **Cross-Reference Loaded Files**: Validate the integrity and reputation of the loaded DLL or OCX files. Utilize threat intelligence sources to determine if the files have been associated with known malware or suspicious activity.

  - **Analyze Process Creation Logs**: Investigate related process creation events to ascertain the command-line arguments used when `cmstp.exe` was invoked. Look for any anomalies suggesting misuse or exploitation of this legitimate tool.

  - **Check Historical Access Patterns**: Utilize your logging tools to inspect historical events around the time of detection. This includes assessing for any prior instances of file access from unusual locations, potentially uncovering lateral movement or reconnaissance activities.

  ### Prioritization
  This alert is of high severity due to the potential for attackers to leverage `cmstp.exe` for executing malicious code, thereby compromising the integrity of systems and networks. The capability to run code from legitimate executables raises the likelihood of successful evasion against traditional detection mechanisms, making prompt investigation critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if certain logging mechanisms are not enabled or adequately configured within the environment, specifically for image load events. The detection logic assumes that threats are indeed attempting to load DLL/OCX files from unusual locations; therefore, typical applications using these binaries might generate false positives. Ensuring that the right logging configurations are in place—particularly for process creation and image load events—is essential for this rule to function effectively.

