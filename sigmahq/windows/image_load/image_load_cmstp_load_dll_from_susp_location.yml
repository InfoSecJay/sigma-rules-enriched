logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\cmstp.exe'
    ImageLoaded|contains:
            # Add more suspicious paths as you see fit in your env
    - '\PerfLogs\'
    - '\ProgramData\'
    - '\Users\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    ImageLoaded|endswith:
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of Dynamic Link Library (DLL) or Object Linking and Embedding (OLE) Custom Control (OCX) files from suspicious locations by the `cmstp.exe` binary, a configuration management tool that is often exploited by attackers to bypass security mechanisms. The likely attacker objective is to execute malicious code while appearing to use a legitimate Windows process, facilitating defense evasion. This detection corresponds to the MITRE ATT&CK tactic of Defense Evasion and the specific technique T1218.003 (Signed Binary Proxy Execution: CMSTP).

  The primary telemetry sources include Windows image load events with a focus on the paths from which these binaries are loaded, specifically monitoring the `Image` and `ImageLoaded` fields in the Windows Security Event Log. Should this detection indicate malicious behavior, the security impact could be severe, potentially leading to unauthorized access, data exfiltration, or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to establish context around the behavior.

  ### Investigation Steps

  - **Review the loading source for `cmstp.exe`:** Check Security Event ID 4688 for the parent process details. Confirm if the source path of `cmstp.exe` is from its legitimate directory (`C:\Windows\System32\cmstp.exe`). Any deviations signal potential malicious activity.

  - **Examine the loaded DLL/OCX files:** Cross-reference Event ID 4104 from PowerShell logs to capture the exact DLL/OCX paths and signatures. Typically, legitimate path loading occurs from `C:\Windows\System32\`. Suspicious paths should be flagged for immediate attention.

  - **Validate file hashes against known good indicators:** Use file integrity monitoring tools or scripts to compute and check hashes of the loaded DLL/OCX files against VirusTotal or other reputation services to identify known malicious artifacts.

  - **Inspect cmdlets executed in conjunction with `cmstp.exe`:** Review PowerShell logs for any unusual cmdlets executed right before or after the use of `cmstp.exe`. Monitor for commands like `Invoke-WebRequest` or `DownloadString`, which may indicate malicious file retrieval.

  - **Identify system impact and asset criticality:** Determine the affected system’s role within the enterprise (e.g., server, workstation) to gauge the potential impact of a successful exploitation. High-privileged systems should receive immediate attention.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of executing arbitrary code through a legitimate system process, thus facilitating further malicious activities. The behavior is frequently weaponized in real-world attacks, increasing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate `cmstp.exe` usage in standard administrative tasks, which may also trigger the alert. Consistent log sources must be ensured, such as Security Event Logs and PowerShell logs, for reliable detection. Additionally, benign usage patterns include authorized software installations or configurations that leverage `cmstp.exe`. A related detection that strengthens coverage is monitoring for unusual network activities post-execution of `cmstp.exe`, which may indicate successful exploitation.

