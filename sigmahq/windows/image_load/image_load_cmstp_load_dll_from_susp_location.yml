logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\cmstp.exe'
    ImageLoaded|contains:
            # Add more suspicious paths as you see fit in your env
    - '\PerfLogs\'
    - '\ProgramData\'
    - '\Users\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    ImageLoaded|endswith:
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects when `cmstp.exe` (Connection Manager Profile TPM) loads Dynamic Link Libraries (DLL) or ActiveX controls (OCX) from suspicious system paths. The behavior suggests potential abuse of the Connection Manager to execute malicious code, as legitimate operations typically involve standard libraries from trusted locations. The likely attacker objective is to evade detection by utilizing known system utilities for code execution, aligning with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Signed Binary Proxy Execution (T1218.003).

  Primary telemetry sources include Windows Image Load events, specifically looking at Event ID 4263 (from `Security` logs) or Sysmon Event ID 10 (Image Load). If malicious, this could lead to significant compromise of the affected system, potentially facilitating lateral movement or data exfiltration. Importantly, this detection does NOT confirm a system compromise on its own; it indicates potentially suspicious activity that requires further validation.

  ---

  ### Investigation Steps

  - **Review `cmstp.exe` execution context: ** Examine the Event ID 4688 (Process Creation) in the Security logs for `cmstp.exe`. Ensure it is initiated by a trusted process; unexpected parent processes may indicate malicious intent.

  - **Analyze DLL/OCX source: ** Inspect Sysmon Event ID 10 for the full file path of the loaded DLL/OCX files. Look for anomalies such as paths originating from `C:\Temp\`, `ProgramData\`, or `PerfLogs\`, which are unusual for legitimate operations.

  - **Confirm file integrity: ** Use hash verification (e.g., SHA256) to compare the loaded DLL/OCX files against known good file databases. Any discrepancies suggest potential compromise.

  - **Document legitimate use cases: ** Capture expected behavior for `cmstp.exe`, typically loading configuration files or trusted libraries located in `C:\Windows\System32\` or similarly secure paths. Cross-reference Event ID 4663 (File Access) for baseline activity.

  - **Investigate concurrent suspicious processes: ** Correlate this alert with other active alerts or log entries indicating malicious activity during the same window. Look for processes exhibiting high CPU usage or unusual outbound connections.

  - **Identify anomalous network activity: ** Review firewall logs (Event ID 5156) and proxy logs for unusual outbound connections associated with the process loading from the identified suspicious path. Track any unexpected data exfiltration behaviors.

  ---

  ### Prioritization

  This alert is high priority due to its potential impact on system integrity and the common misuse of `cmstp.exe` by attackers to evade detection. The likelihood of malicious use is high given that the behavior aligns with documented techniques used in real-world attacks, making prompt investigation essential.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded by attackers using alternative execution methods or obfuscating their DLL placement. Reliable detection hinges on robust Sysmon configuration for image loads and comprehensive monitoring of process creations. Legitimate administrative tasks, such as system maintenance scripts or software installations, may trigger this alert. A related detection to consider is the monitoring of unusual command-line arguments passed to `cmstp.exe`, which provides additional context on its usage.

