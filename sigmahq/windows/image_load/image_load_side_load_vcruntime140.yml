title: Potential Vcruntime140 DLL Sideloading
id: d7a63acb-1284-49bc-bfea-7771146c8b1c
status: experimental
description: |
  Detects potential DLL sideloading of vcruntime140.dll, a common C++ runtime library.
  Threat actors have been observed using DLL sideloading techniques to load malicious payloads under the guise of legitimate applications such as SqlWriter, SqlDumper etc.
  Notably, APT29 has been documented leveraging WinELOADER to sideload vcruntime140.dll for executing malicious code.
references:
- https://www.mandiant.com/resources/blog/apt29-wineloader-german-political-parties
- https://www.zscaler.com/blogs/security-research/european-diplomats-targeted-spikedwine-wineloader
- https://www.nextron-systems.com/2023/09/15/detecting-janelarat-with-yara-and-thor/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-12
modified: 2026-05-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vcruntime140.dll'
  filter_main_legitimate_path:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_legitimate_signer:
    Signed: true
    SignatureStatus: 'Valid'
    Description|endswith: 'C Runtime Library'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_side_load_vcruntime140/info.yml
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of `vcruntime140.dll`, commonly used in C++ applications. Attackers aim to exploit legitimate application contexts to execute malicious payloads, disguising them as authentic operations. The behavior fits within the MITRE ATT&CK framework under the tactics of Persistence and Execution, specifically technique T1574.001 (DLL Search Order Hijacking). Primary telemetry sources include Windows image load events, particularly focusing on unauthorized loads outside trusted directories. If successful, the malicious code execution could result in significant security breaches. Importantly, this detection does not by itself confirm malicious activity, as legitimate applications may also sideload DLLs.

  ### Investigation Steps

  - **Check Image Load Path:** Review the `ImageLoaded` field in Windows event logs (Event ID 4688) to identify if `vcruntime140.dll` is being loaded from any unexpected locations (e.g., avoid paths outside `C:\Windows\` or `C:\Program Files\`). Legitimate loads should originate from these trusted directories.

  - **Examine Signature Validity:** Validate the `Signed` and `SignatureStatus` fields in the log for the loaded DLL. A legitimate load will have `Signed` set to true and `SignatureStatus` marked as 'Valid'. If these fields indicate an invalid signature, consider it as a higher confidence malicious indicator.

  - **Identify Application Context:** Analyze the parent process of the image load (use the `ParentProcessName` field) to determine if it corresponds with known legitimate applications (e.g., `SqlWriter` or `SqlDumper`). If the parent process is suspicious or unusual, escalate further.

  - **Document OneDrive Usage:** If loading occurs from a path containing `C:\Users\<username>\AppData\Local\Microsoft\OneDrive\`, evaluate the legitimate use of OneDrive applications, as adversaries might leverage this for covert operations. Confirm user activities and the context of OneDrive usage.

  - **Assess Endpoint Configuration:** Consider asset criticality. High-value endpoints running sensitive applications should be prioritized for this investigation, as DLL sideloading could significantly escalate access or impact confidentiality.

  - **Validate External Research Tactics:** Review previous alerts related to APT29 or similar groups that employ DLL sideloading techniques to load `vcruntime140.dll`, enriching the investigation context with historical threat intelligence data.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems where sideloading can enable unauthorized access. The likelihood of malicious abuse is elevated, given the documented use of this tactic by advanced persistent threats (APTs). Additionally, sideloading behavior has been widely weaponized in various attacks, presenting a clear risk to enterprise security.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not logging specific image load events or those with inadequate monitoring of DLL activities. Legitimate activities, such as benign application updates or configurations, may trigger this alert and should be taken into account. Consider companion detections for application manifest changes or unusual process behavior that may enhance overall situational awareness of potential threats.

