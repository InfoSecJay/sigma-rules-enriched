title: Potential Vcruntime140 DLL Sideloading
id: d7a63acb-1284-49bc-bfea-7771146c8b1c
status: experimental
description: |
  Detects potential DLL sideloading of vcruntime140.dll, a common C++ runtime library.
  Threat actors have been observed using DLL sideloading techniques to load malicious payloads under the guise of legitimate applications such as SqlWriter, SqlDumper etc.
  Notably, APT29 has been documented leveraging WinELOADER to sideload vcruntime140.dll for executing malicious code.
references:
- https://www.mandiant.com/resources/blog/apt29-wineloader-german-political-parties
- https://www.zscaler.com/blogs/security-research/european-diplomats-targeted-spikedwine-wineloader
- https://www.nextron-systems.com/2023/09/15/detecting-janelarat-with-yara-and-thor/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-12
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vcruntime140.dll'
  filter_main_legitimate_path:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_legitimate_signer:
    Signed: true
    SignatureStatus: 'Valid'
    Description: 'Microsoft® C Runtime Library'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_side_load_vcruntime140/info.yml
note: |
  ### Technical Context

  This rule detects potential DLL sideloading activities specifically involving the `vcruntime140.dll` library, commonly targeted by threat actors to execute malicious code while appearing as a legitimate application process. The likely objective of the attacker is to leverage this technique to maintain persistence, evade defenses, and execute payloads masked as trusted system libraries such as those associated with SQL Server components. This detection corresponds to the MITRE ATT&CK technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources are Windows image load events indicating DLL loading activities. Required log types include Windows Security Event IDs 4688 (process creation) in combination with Sysmon Event ID 7 (Image Load), which helps correlate the loading of the targeted DLL with parent process information. If confirmed as malicious, this behavior could lead to significant security impacts, including unauthorized access or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own without additional contextual information.

  ### Investigation Steps

  - **Review the DLL loading context:** Check Sysmon Event ID 7 for `vcruntime140.dll` and correlate it with Event ID 4688 to identify the parent process. Look for loading related to known system processes like `SqlWriter.exe` or `SqlDumper.exe`, which are more likely benign.

  - **Validate legitimate signatures:** Confirm the `Signed`, `SignatureStatus`, and `Description` fields of the loaded `vcruntime140.dll`. If any deviations occur (e.g., unsigned or invalid signatures), flag for further analysis as potential malicious indicators.

  - **Investigate the parent process:** Examine the process tree for the parent process identified in the loading event. Ensure that it originates from a trusted path (like `C:\Windows\System32\` or `C:\Program Files\`). Malicious parent processes may originate from atypical locations, indicating potential compromise.

  - **Identify recent changes or anomalies:** Check change management logs for any recent updates or installations relating to the involved applications. Unexpected deployment of applications or changes to critical software can indicate a compromise path used by adversaries.

  - **Check for additional malicious indicators:** Look for known IOCs associated with the attacker’s tools in memory or file system scans. For example, check for regkeys or executables associated with APT29’s behaviors. The presence of any well-known malicious process names could reinforce malicious intent.

  - **Determine impacted assets' criticality:** Evaluate the role of the host running the detected activity. High-value hosts like database servers or administrative systems should be prioritized for deeper investigation, given the potential for severe security implications if breached.

  ### Prioritization

  This alert is of **high severity** due to the critical nature of the `vcruntime140.dll` library as an execution vector for attackers. The fact that DLL sideloading is frequently weaponized by advanced adversaries, such as APT29, increases the likelihood of malicious abuse, particularly within sensitive enterprise infrastructures.

  ### Blind Spots and Assumptions

  Detection may be limited by compliance configurations or lack of Sysmon deployment across all endpoints, potentially leading to gaps in visibility for image load events. Legitimate activities, such as updates to trusted applications or installations of updates from Microsoft, may trigger false positives. A related detection mechanism, like monitoring unusual parent processes executing `vcruntime140.dll`, could strengthen overall detection reliability and context for analysts.

