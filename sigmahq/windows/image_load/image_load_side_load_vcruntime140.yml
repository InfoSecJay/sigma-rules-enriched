title: Potential Vcruntime140 DLL Sideloading
id: d7a63acb-1284-49bc-bfea-7771146c8b1c
status: experimental
description: |
  Detects potential DLL sideloading of vcruntime140.dll, a common C++ runtime library.
  Threat actors have been observed using DLL sideloading techniques to load malicious payloads under the guise of legitimate applications such as SqlWriter, SqlDumper etc.
  Notably, APT29 has been documented leveraging WinELOADER to sideload vcruntime140.dll for executing malicious code.
references:
- https://www.mandiant.com/resources/blog/apt29-wineloader-german-political-parties
- https://www.zscaler.com/blogs/security-research/european-diplomats-targeted-spikedwine-wineloader
- https://www.nextron-systems.com/2023/09/15/detecting-janelarat-with-yara-and-thor/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vcruntime140.dll'
  filter_main_legitimate_path:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_legitimate_signer:
    Signed: true
    SignatureStatus: 'Valid'
    Description: 'Microsoft® C Runtime Library'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_side_load_vcruntime140/info.yml
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of `vcruntime140.dll`, which is often exploited by attackers to load malicious payloads disguised as legitimate applications, such as SqlWriter or SqlDumper. The likely objective for attackers is to execute unauthorized code while avoiding detection. The relevant MITRE ATT&CK tactics and techniques are Persistence (T1574.001) and Execution.

  The primary telemetry source is Windows image load events, specifically looking for image loads of `vcruntime140.dll`. The detection assumes that legitimate loads occur from well-known paths and are signed by a valid Microsoft certificate. If malicious, this could lead to unauthorized access, execution of malicious code, or lateral movement within the network. However, it is important to note that this detection does not confirm intent; further investigation is required to determine if the behavior is part of an attack.

  ### Investigation Steps

  - **Check event logs for DLL loads:** Review Windows Event Log for Image Load events (Event ID 4663) related to `vcruntime140.dll`. Look for entries outside of legitimate paths (`C:\Windows\System32\`, `C:\Program Files\`, etc.).

  - **Assess signature status:** Validate the digital signature of the loaded DLL. If the signature is invalid or not signed by Microsoft, this is a high-confidence malicious indicator.

  - **Identify the parent process:** Look into the process which initiated the DLL load. For benign activity, legitimate applications like `SqlWriter.exe` or other known system utilities should be the parent process. Malicious loads may occur from suspicious or unknown executables.

  - **Review process creation events:** Investigate related process creation events (Security Event ID 4688) around the same time as the image load. Identify processes that load `vcruntime140.dll` without a legitimate parent process.

  - **Monitor for changes in registry:** Check the registry for modifications associated with the DLL load, especially under `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run`. Legitimate applications should not frequently alter these registry locations.

  - **Investigate unusual network activity:** Use network logs to check for any unusual outbound connections that occur after the `vcruntime140.dll` load. Look for connections to suspicious or untrusted domains.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on the affected system and the likelihood that such techniques are employed by advanced persistent threats (APTs). DLL sideloading is a commonly weaponized method for carrying out malicious payloads, making it critical to investigate promptly.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers utilize obfuscation or load DLLs from legitimate paths without modification. It requires logs from all relevant security sources, especially monitoring for Windows image loads. Legitimate applications that use `vcruntime140.dll` might trigger this alert, such as well-known SQL Server support utilities. A companion rule monitoring execution from suspicious handlers (e.g., executed from temporary files) can enhance detection coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
