logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\fxssvc.exe'
    ImageLoaded|endswith: 'ualapi.dll'
  filter:
    ImageLoaded|startswith: 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts by the Windows Fax service (fxssvc.exe) to load a non-existent DLL (ualapi.dll). The behavior may indicate an attempt by an attacker to exploit DLL search order hijacking, allowing them to load a malicious DLL in place of the legitimate one. The likely attacker objective is to escalate privileges or achieve persistence on the system via malicious code execution.

  This detection aligns with the MITRE ATT&CK technique for "DLL Search Order Hijacking" (T1574.001). The primary telemetry source for this detection is Windows image load events, specifically focusing on those where the Fax service is trying to load DLLs. If the behavior is malicious, it could facilitate unauthorized access and control of the server.

  It is essential to note that this detection does NOT confirm that an attack occurred, as legitimate applications may attempt to load non-existent files for various benign reasons.

  ### Investigation Steps

  - **Check Image Load Events for the Fax Service:** Review Windows Event ID 4105 (Image Load) and confirm whether `fxssvc.exe` attempted to load `ualapi.dll` within the expected timeframe of the alert. Compare against typical events to establish a baseline for benign behavior.

  - **Correlate with Process Creation Events:** Investigate associated Security Event ID 4688 logs to find processes created around the same time as the DLL loading attempts. Ensure that `fxssvc.exe` was the only service attempting this load and check its parent process for legitimacy.

  - **Review for Known Malicious Indicators:** Examine the file path of the loaded DLL. High-confidence indicators include any DLLs found outside standard directories (e.g., C:\Windows\System32 or C:\Windows\WinSxS) that have similar names, indicating a potential malicious DLL.

  - **Analyze System Integrity and Permissions:** Determine if any recent changes to system permissions or group membership might allow unauthorized users to manipulate the Fax service. Check whether anyone had administrative access to the affected system.

  - **Identify Legitimate Use Cases:** Validate that there are no legitimate software or scheduled tasks that require loading `ualapi.dll`. If found, weigh against other context to assess if these claim the load attempt was legitimate.

  ### Prioritization

  This alert has a high severity rating because it involves a critical Windows service that, if exploited, may lead to system compromise and privilege escalation. The behavior is unlikely to be benign and is a potential indicator of advanced threat activity, which makes it a commonly weaponized attack vector.

  ### Blind Spots and Assumptions

  Detection could be evaded if an attacker uses legitimate DLLs or names that have not been identified. Ensure all necessary Windows logs (especially Image Load events) are retained and configured correctly for reliable detection. Some benign applications may trigger this alert, particularly during software updates or misconfigurations. Related detections for suspicious DLL activities, such as observing unexpected file creation or execution from known system folders, can provide additional coverage.

