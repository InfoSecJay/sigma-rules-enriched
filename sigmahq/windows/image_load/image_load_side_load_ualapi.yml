logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\fxssvc.exe'
    ImageLoaded|endswith: 'ualapi.dll'
  filter:
    ImageLoaded|startswith: 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule monitors for a potential DLL search order hijacking exploit involving the Windows Fax service (fxssvc.exe). The attacker can take advantage of the Fax service attempting to load a non-existent DLL (ualapi.dll) to inject a malicious DLL into the process. This allows for persistence and privilege escalation, as the attacker gains control over the Fax service's execution context. The likely objective of such an attack is to maintain access to the system while evading detection mechanisms, thereby enabling further malicious activities such as data exfiltration or lateral movement within the enterprise network.

  Relevant MITRE ATT&CK techniques include:
  - **T1574.001**: DLL Search Order Hijacking
  - **T1068**: Exploitation of Elevation of Privilege Vulnerability
  - **T1203**: Exploit Public-Facing Application (in the context of DLL hijacks)

  The primary data sources involved are image load events from Windows systems, specifically focusing on the loading of libraries associated with the Fax service.

  ### Investigation Steps
  - **Review Image Load Events**: Check logs for the process `fxssvc.exe` to identify instances where `ualapi.dll` was attempted to be loaded. Look for discrepancies in the loading path or unexpected DLL names.
  - **Examine DLL Locations**: Validate the existence of `ualapi.dll` in paths associated with legitimate system libraries, particularly `C:\Windows\WinSxS\`. Investigate any unauthorized DLLs located in this or related directories.
  - **Analyze Process Behavior**: Conduct an analysis of the fxssvc.exe process to determine any unusual behavior, including network connections, file system changes, or spawning of other processes that could indicate further malicious activity.
  - **Correlate with User Activities**: Review user activities and Windows logs leading up to the detection, including logins, session creation, and other administrative actions that could provide context for potential privilege escalation or persistence tactics.

  ### Prioritization
  Given that this alert points to the potential exploitation of the DLL search order, the severity is high in an enterprise environment. Successful exploitation could lead to a privilege escalation that undermines the security posture and integrity of critical systems.

  ### Blind Spots and Assumptions
  The detection coverage assumes that all relevant image load events are being logged and that no other legitimate processes are performing similar behaviors. A gap exists if there are misconfigured logging settings or if the attack employs techniques to obfuscate its presence. It is assumed that the detection logic is effective in identifying atypical DLL loading patterns. Required logs for optimal functionality include comprehensive image load events from Windows, specifically for processes modified or controlled by the user.

