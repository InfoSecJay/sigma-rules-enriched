logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\fxssvc.exe'
    ImageLoaded|endswith: 'ualapi.dll'
  filter:
    ImageLoaded|startswith: 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This alert detects attempts by the Windows Fax service (`fxssvc.exe`) to load the `ualapi.dll`, which is not a legitimate file within the Windows environment. Attackers can exploit this vulnerability to hijack the DLL search order and load a malicious DLL instead. The attacker’s likely objective is to achieve privilege escalation or persistence by leveraging a trusted service to execute their code stealthily. This activity falls under the MITRE ATT&CK framework’s "Privilege Escalation" tactic (TA-0004) through the "DLL Side-Loading" technique (T1574.001). The primary telemetry sources include Windows Image Load events, particularly focusing on image paths and the associated loaded libraries.

  If confirmed malicious, this action poses a significant security risk, as it allows attackers to execute arbitrary code with the privileges of the fax service. It is important to note that this detection does NOT confirm whether the loaded DLL is definitively malicious; it only indicates abnormal behavior indicative of a potential attack.

  ### Investigation Steps

  - **Check the loaded DLLs for `fxssvc.exe`:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation logs. Look for any `fxssvc.exe` entries that show `ualapi.dll` in logs, specifically under `ImageLoaded` field. Confirm that no legitimate application should expect to load this DLL.

  - **Identify the image load source:** Verify the `ImageLoaded` field for the loading path; it should not be from `C:\Windows\WinSxS\`. Legitimate processes typically load DLLs from secure paths. If it comes from an unexpected location, this is a strong indication of malicious activity.

  - **Review recent changes in the environment:** Analyze the logs for any recent changes related to the fax service configuration or unauthorized file manipulations around the time of the alert. Use Windows Event ID 7045 in the System log to find details regarding new service installations.

  - **Verify host role and criticality:** Determine whether `fxssvc.exe` is running on a critical system (e.g., domain controllers or servers handling sensitive data). Assessing asset criticality provides context on the urgency of response.

  - **Look for indicators of compromise (IoCs):** Search across endpoints for the presence of unauthorized `ualapi.dll` files. If found, cross-reference file hashes against known malicious databases.

  ### Prioritization

  This alert is classified as high severity due to the role of the fax service in potentially escalating privileges and the likelihood that such exploitation techniques are weaponized. The systems under scrutiny are critical as they may handle sensitive information and operations, increasing the potential impact of a successful attack.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques where attackers might use legitimate DLLs existing on the system. Reliant log sources must be properly configured; if Sysmon or detailed Windows logging is not enabled, detection risks will increase. Legitimate applications that might trigger similar alerts include certain software updates or configurations for authorized fax services. Complementary detections should be established, such as monitoring for unusual DLL loading patterns across other critical services to strengthen detection coverage.

