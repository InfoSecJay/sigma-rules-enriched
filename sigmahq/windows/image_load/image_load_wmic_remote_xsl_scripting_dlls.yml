- The command `wmic ntevent` loads vbscript.dll
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the use of Windows Management Instrumentation Command-line (WMIC) for executing malicious scripts that could be disguised as legitimate commands or processes. Attackers often exploit WMIC with the `/FORMAT` argument to execute scripts stored in XSL files, such as JavaScript (JS) or VBScript (VBS), thereby bypassing traditional security controls. Such actions may indicate a possible SquiblyTwo attack, where adversaries remotely execute code on compromised systems without triggering standard defenses, making it crucial to detect and investigate these occurrences promptly.

  The primary objectives of attackers utilizing this technique include delivering payloads, establishing persistence, or executing commands remotely while attempting to avoid detection by security solutions. Related MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and techniques like **Command and Scripting Interpreter: PowerShell (T1059)** and **Windows Management Instrumentation (WMI) (T1047)**, which detail methods associated with executing code in a stealthy manner.

  The best sources of evidence for this detection are the image load events for WMIC and the associated libraries it invokes, specifically referencing **jscript.dll** and **vbscript.dll**. Additionally, process creation events may provide context regarding anomalous WMIC executions, revealing the command lines used and their parent processes for further investigation.

  ### Investigation Steps
  - **Review Image Load Events:** Analyze recent image load events to identify instances where `wmic.exe` loaded libraries such as `jscript.dll` or `vbscript.dll`, noting any unusual activity or patterns.
  - **Examine Process Creation Logs:** Collect and review process creation logs for instances where WMIC was invoked. Focus on the command lines used and the parent-child relationships of processes to uncover potentially malicious behavior.
  - **Correlate with Other Logs:** Cross-reference findings with logs from your SIEM, EDR, or NGFW to identify any other indicators of compromise or suspicious outbound activity linked to the WMIC executions.
  - **Investigate Network Activity:** Look for unusual outbound connections or data transfers that coincide with the timing of WMIC executions, particularly to untrusted domains or IPs that might indicate exfiltration or command-and-control (C2) communication.

  ### Prioritization
  The alert is classified as medium severity due to the potential for adverse impacts on system integrity and confidentiality when WMIC is leveraged for malicious purposes. Given the ability to execute code remotely and circumvent security measures, timely investigation and response are essential.

  ### Blind Spots and Assumptions
  Detection may miss instances where WMIC is used in legitimate contexts or by trusted internal processes, leading to potential false positives. The detection logic assumes that sufficient logging is enabled to capture image loads and process creation events; without these logs, the detection may be ineffective. Additionally, certain attack techniques that utilize WMIC may not be represented in the log data, leading to gaps in awareness regarding ongoing exploitation attempts.

