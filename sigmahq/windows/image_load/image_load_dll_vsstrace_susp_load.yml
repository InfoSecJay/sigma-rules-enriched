logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vsstrace.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\ProgramData\Package Cache\{'            # Microsoft Visual Redistributable installer  VC_redist/vcredist EXE
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_recovery:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_main_null_image:
    Image:          # Observed through Aurora
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activity associated with the loading of the Volume Shadow Copy Service (VSS) DLL `vsstrace.dll` by uncommon executables. Attackers may utilize this technique to manipulate or delete shadow copies, which are often used for backup and recovery purposes. The ultimate objective may be to conceal their actions, destroy evidence, or facilitate lateral movement within a network by preventing recovery of critical artifacts.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005): Techniques that adversaries use to evade detection throughout their operational lifecycle.
  - **Impact** (TA0007): Techniques that adversaries use to disrupt availability or integrity of systems and data.
  - **T1490**: The specific technique of "Inhibit System Recovery," which encompasses actions that prevent recovery from backup systems.

  Primary data sources for this detection include image load logs, which provide visibility into dynamic link library (DLL) loading events on Windows systems, particularly focusing on the processes associated with potentially malicious behavior.

  ### Investigation Steps
  - **Review Image Load Events**: Check image load logs for instances where `vsstrace.dll` is loaded by non-standard or uncommon executables, particularly those outside typical Windows processes.
  - **Analyze Executable Origins**: Investigate the file path of the executable responsible for loading the DLL, noting any unusual or suspicious paths that deviate from standard applications.
  - **Correlate with System Activity**: Look for associated system activities during the time of the DLL load, such as creation or deletion of shadow copies, to understand the context and potential impact.
  - **Assess for Backup Solutions**: Confirm whether legitimate backup solutions are in use within the environment, as certain applications may also load this DLL during standard operations; filter out known legitimate cases to reduce false positives.

  ### Prioritization
  The severity of this alert is medium; while it does not represent immediate compromise on its own, the manipulation of shadow copies can indicate a significant threat to data integrity and recovery efforts, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage wherein benign applications or processes could use `vsstrace.dll` legitimately, potentially leading to false positives. The detection logic assumes that any loading of this specific DLL by uncommon applications is suspicious. To ensure the alert functions accurately, the organization must have comprehensive logging for all image loads and maintain an updated inventory of legitimate applications that might also use this DLL for valid purposes.

