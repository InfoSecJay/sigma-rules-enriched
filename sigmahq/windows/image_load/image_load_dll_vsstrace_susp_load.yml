logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vsstrace.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\ProgramData\Package Cache\{'            # Microsoft Visual Redistributable installer  VC_redist/vcredist EXE
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_recovery:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_main_null_image:
    Image:          # Observed through Aurora
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `vsstrace.dll` file by executables that are not typical hosts for this library, suggesting potential misuse related to Volume Shadow Copy operations. Attackers may employ this to manipulate system backups, delete restore points, or exfiltrate sensitive data that resides in shadow copies, aiming to obstruct forensic analysis.

  The relevant MITRE ATT&CK tactics include **Impact** (TA0040) and **Inhibit System Recovery** (T1490). Primary telemetry sources include Windows image load events that can be gathered from Event ID 4100 or Sysmon Event ID 10. If malicious, this could lead to data loss or obfuscation of malicious activity.

  This detection does NOT confirm that malicious activity has occurred on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Verify the Executable Source**: Review the executable loading `vsstrace.dll`. Check Event ID 4688 for process creation and confirm if the parent process is a known legitimate application (should typically be system processes or trusted backup solutions).

  - **Correlate Loaded DLLs with Activity**: Use Sysmon Event ID 10 to check for additional loaded DLLs. Validate the environment and ensure the process is not benign, such as backup software, which often utilizes this DLL for legitimate purposes.

  - **Review for Shadow Copy Related Activity**: Analyze the presence of shadow copies. Use Windows PowerShell command `Get-ComputerRestorePoint` or the `vssadmin list shadows` command to observe existing snapshots. An absence of expected restore points may indicate malicious actions.

  - **Cross-Examine Process Execution Path**: Investigate the file path of the executable to determine if it deviates from a standard installation path. For instance, processes originating from `C:\Windows\Temp` or similar non-standard locations are likely malicious.

  - **Check for Patterns of Evasive Behavior**: Look for multiple instances of `vsstrace.dll` being invoked by various executables in a short timeframe—a strong indicator of an attempt to manipulate shadow copies rapidly to cover tracks.

  ### Prioritization

  This alert should be regarded as medium severity. The potential impact on critical systems is significant, as it indicates possible attempts to delete or manipulate backup data. The likelihood of abusive behavior is moderate to high, given that shadow copy manipulation is a common tactic used in various attacks, including ransomware.

  ### Blind Spots and Assumptions

  The detection may miss instances where benign applications legitimately load `vsstrace.dll`, leading to false positives. It relies on appropriate logging configurations to capture image loading events, particularly Sysmon or similar logging solutions. Legitimate activities, such as backup operations, can also trigger this alert. To strengthen detection, consider additional rules that capture unusual PowerShell or command line activity related to VSS commands.

