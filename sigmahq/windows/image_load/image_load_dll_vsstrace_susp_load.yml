logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vsstrace.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\ProgramData\Package Cache\{'            # Microsoft Visual Redistributable installer  VC_redist/vcredist EXE
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_recovery:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_main_null_image:
    Image:          # Observed through Aurora
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies the loading of `vsstrace.dll`, a Volume Shadow Copy Service (VSS) DLL, by uncommon executables that are not typically associated with VSS operations. The likely attacker objective is the misuse of the VSS functionality to either capture sensitive data or delete/shadow copy malware, as part of broader data manipulation or exfiltration efforts. This activity relates to the MITRE ATT&CK technique **T1490: Inhibit System Recovery**, which encompasses actions meant to block recovery systems.

  The primary telemetry sources for this detection are Windows image load logs, specifically focusing on DLL loads and process execution from paths associated with non-standard executables. If malicious, this could indicate adversaries tampering with recovery mechanisms to conceal their activities. However, this detection does NOT confirm malicious intent on its own; benign applications could also load `vsstrace.dll` under certain circumstances.

  ### Investigation Steps

  - **Confirm the loading process:** Verify the process that loaded `vsstrace.dll`. Check Windows Security Event ID 4688 to identify the parent process and the command line used for execution as this provides context on whether it's from a known benign application.

  - **Identify the file's origin:** Inspect the file's hash (e.g., SHA-256) against known good lists. Legitimate `vsstrace.dll` loads typically originate from standard system processes like `explorer.exe` or control panels; non-standard paths could indicate malicious use.

  - **Review related logs:** Analyze Windows Event ID 4104 for PowerShell logs related to the process that executed the DLL load. Look for atypical scripts that might have called VSS commands, which may signify malicious activity.

  - **Check system criticality:** Confirm if the affected system is part of an essential service or high-value asset in your architecture. Systems hosting sensitive data or critical applications warrant higher scrutiny during investigation.

  - **Audit legitimate VSS usage:** Review scheduled tasks or backup software logs to verify whether legitimate VSS operations are routinely conducted by known applications. This can help distinguish between expected use and potential abuse.

  - **Look for additional indicators:** Check for indicators of compromise (IoCs) associated with this detection, such as the presence of other suspicious DLLs or scripts within the same execution context. Trends in file creation or modification time can provide insights into the potential exploit timeline.

  ### Prioritization

  This alert should be prioritized as **medium** due to the potential impact of malicious use of the Volume Shadow Copy Service, which can lead to data loss or concealment of malicious activities. The likelihood of exploitation is moderate, as advanced adversaries may weaponize this technique, although it may not be the first line of attack.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion techniques such as name obfuscation or the use of legitimate software to invoke `vsstrace.dll`. Reliable detection requires comprehensive coverage of Windows image load logs and potentially enables forensic investigation of process memory and connected I/O events. Legitimate administrative tools or backup applications might trigger this alert; thus, analyzing the context is crucial. A related detection rule for monitoring `vssapi.dll` loads would provide additional insights and strengthen overall detection efficacy against VSS manipulation.

