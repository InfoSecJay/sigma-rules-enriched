description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2023-02-17
modified: 2026-08-27
tags:
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vsstrace.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\servicing\TrustedInstaller.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\ProgramData\Package Cache\{'            # Microsoft Visual Redistributable installer  VC_redist/vcredist EXE
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_recovery:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_main_null_image:
    Image:          # Observed through Aurora
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the loading of the `vsstrace.dll`, which is used for managing Volume Shadow Copies, by uncommon executables that are not typically expected to interact with this functionality. Attackers might leverage this DLL to manipulate or delete shadow copies to hinder forensic analysis after malicious activity. It aligns with the MITRE ATT&CK technique T1490: Inhibit System Recovery, which focuses on disabling recovery options to solidify their foothold. The primary telemetry sources are Windows image load events, specifically where `vsstrace.dll` is invoked outside of known legitimate executables such as `explorer.exe` or `TrustedInstaller.exe`. A malicious load event here may indicate attempts to obstruct recovery efforts, particularly during or after data exfiltration or ransomware actions. However, this detection does NOT confirm malicious behavior on its own without additional context or corroborating indicators.

  ### Investigation Steps

  - **Identify the executing process**: Review Windows Security Event ID 4688 for new process creation related to `vsstrace.dll`. Focus on processes with unusual parentage or indicators that are unexpected for this DLL (e.g., processes not typically associated with system maintenance).

  - **Check for common mitigation paths**: Validate whether the loaded process is `explorer.exe`, `SystemSettings.exe`, or `TrustedInstaller.exe`. If the process does not match, further investigation is warranted as it could indicate potentially malicious behavior.

  - **Analyze related shadow copy activity**: Inspect Windows Volume Shadow Copy Service (VSS) logs for any unusual modification or deletion actions prior to the alert. Look for Event ID 8193 in the System log which may indicate issues with shadow copy creation or deletion.

  - **Review system configuration and criticality**: Consider the asset's context where the alert occurred. If it is a production server or a sensitive asset, prioritize immediate investigation due to higher risk associated with potential impact.

  - **Look for known malicious patterns**: Cross-reference the process invoking the DLL with threat intelligence sources to check for a history of exploitation or association with known malware that manipulates VSS to evade detection.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on systems running critical applications and the risk of malicious actions taking root. The likelihood of misuse is relevant, particularly within environments that retain sensitive information, making it a candidate for active monitoring.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the presence of legitimate activity that interacts with the Volume Shadow Copy Service, such as backup software that could trigger the alert. Required log sources include image load events and potential VSS logs, which must be accurately configured to ensure reliable detection. Another companion detection is focused on VSS manipulation, such as deletions or modifications in shadows, to provide a more comprehensive threat assessment.

