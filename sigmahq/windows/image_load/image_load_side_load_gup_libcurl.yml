title: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
status: test
description: Detects potential DLL sideloading of "libcurl.dll" by the "gup.exe" process
  from an uncommon location
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
    ImageLoaded|endswith: '\libcurl.dll'
  filter_main_notepad_plusplus:
    Image|endswith: '\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading activity involving `gup.exe`, which is commonly associated with software update mechanisms. In this context, the rule looks for instances where `gup.exe` loads `libcurl.dll` from an unusual path rather than its expected location. Attackers can exploit DLL sideloading to execute malicious code disguised as legitimate library files, thereby evading security measures and gaining unauthorized access or control over systems.

  The likely scenario involves an attacker leveraging the legitimate `gup.exe` process to load a compromised version of `libcurl.dll`. This technique can be employed as part of a broader attack lifecycle, potentially aiming for persistence, privilege escalation, or evasion tactics. Relevant MITRE ATT&CK techniques include **T1574.001: DLL Search Order Hijacking**, which describes methods for hijacking the search order for DLLs, creating a vector for executing malicious payloads, as well as tactics related to **Defense Evasion** and **Persistence**.

  To collect the most pertinent evidence regarding this activity, primary data sources include image load events that capture the processes and libraries loaded on Windows endpoints. Additionally, monitoring logs that detail process creation and the paths from which executables and libraries originate are essential for effective detection and mitigation.

  ### Investigation Steps
  - **Review Image Load Events:** Collect and analyze image load events to identify instances of `libcurl.dll` being loaded by `gup.exe`. Pay particular attention to the path from which `libcurl.dll` is being loaded to ascertain if it is legitimate.

  - **Check for Uncommon Paths:** Validate the file path of `gup.exe` and `libcurl.dll` against known good locations. Alert on any instances where these files originate from non-standard or uncommon paths that may indicate potential compromise.

  - **Analyze Process Creation Logs:** Examine process creation logs around the time of the alert to identify any suspicious parent-child relationships or unexpected command-line arguments used during the execution of `gup.exe`.

  - **Correlate with Other Sources:** Check other telemetry sources, such as endpoint detection and response (EDR) logs, for related activities that may indicate further malicious behavior, like unusual network connections associated with `gup.exe` or `libcurl.dll`.

  ### Prioritization
  The alert is rated as medium severity because DLL sideloading can lead to significant unauthorized access or software compromise if not properly addressed. The likelihood of exploitation is heightened when dealing with legitimate system processes that are trusted by users and security tools, increasing the risk of impact on the enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may miss variations in the attack such as different process names or the use of alternative libraries for sideloading. Additionally, the rule assumes that all DLL loading events will be logged accurately, which may not be the case if logging is disabled or misconfigured. The environment must ensure that comprehensive image load logging is enabled for effective detection, particularly in endpoint security configurations.

