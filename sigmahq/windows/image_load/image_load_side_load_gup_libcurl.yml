title: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
status: test
description: Detects potential DLL sideloading of "libcurl.dll" by the "gup.exe"
  process from an uncommon location
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
    ImageLoaded|endswith: '\libcurl.dll'
  filter_main_notepad_plusplus:
    Image|endswith: '\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading behavior where `gup.exe` loads `libcurl.dll` from an uncommon location. Attackers may use this technique to disguise malicious DLLs with benign names to maintain persistence or escalate privileges. This activity maps to the MITRE ATT&CK technique T1574.001 (DLL Side-Loading). The primary telemetry sources required for this detection include image load logs that capture DLL loading events for executable processes. If confirmed as malicious, this behavior could allow unauthorized access or code execution within the context of a trusted application. This detection does NOT confirm that `gup.exe` is inherently malicious; it merely indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Verify the loading process:** Check for `gup.exe` interactions with `libcurl.dll` by reviewing image load events (Windows Event ID 4102 or Sysmon Event ID 10). Note if `gup.exe` originates from `C:\Program Files\Notepad++\updater\gup.exe`, which is a legitimate path, as opposed to an uncommon location.

  - **Identify unusual file paths:** Investigate the file path from which `libcurl.dll` is loaded. Track the parent hierarchy using Sysmon Event ID 1 to determine if it runs from a suspicious or unique directory, indicating potential malicious intent.

  - **Analyze process lineage:** Use Sysmon logs to examine the process creation and parent-child relationships (Event ID 1). Legitimate `gup.exe` processes will typically have a parent process of `Notepad++` or an associated update process. Look for any parent process anomalies.

  - **Check for known indicators of compromise:** Cross-reference the observed hash of `libcurl.dll` against threat intelligence sources. Look for signs of other adversary techniques or evidence that the DLL is not signed by a known vendor.

  - **Review related activity logs:** Look for other suspicious activities around the same time in Windows Security Logs (Event ID 4688) that might indicate exploitation attempts or abnormal account behavior.

  - **Contextualize with host role assessment:** Determine the role of the host involved (e.g., is it a production server or desktop?). Higher criticality systems are tied to elevated risk if compromised and warrant immediate escalation based on findings.

  ### Prioritization

  This alert should be considered medium severity, as the potential for code execution through a trusted process poses a significant threat. If confirmed as malicious, this behavior could lead to system compromise, particularly on critical infrastructure. DLL sideloading is a known exploitation technique, thus warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by unique configurations or logging inadequacies, as not all hosts may have Sysmon or appropriate image load logging enabled. Legitimate applications or updates that utilize similar behavior may trigger the alert, complicating investigations. Companion detections for file creation (e.g., monitoring for creation of `libcurl.dll`) can enhance coverage by providing context to suspicious file activities.

