title: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
status: test
description: Detects potential DLL sideloading of "libcurl.dll" by the "gup.exe"
  process from an uncommon location
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
    ImageLoaded|endswith: '\libcurl.dll'
  filter_main_notepad_plusplus:
    Image|endswith: '\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading by monitoring instances of the process **gup.exe** attempting to load **libcurl.dll** from an unusual location. The likely attacker objective is to execute malicious code under the guise of a trusted application, allowing for persistence or privilege escalation while avoiding detection. This behavior aligns with the MITRE ATT&CK technique **T1574.001: DLL Search Order Hijacking**.

  The primary telemetry sources for this detection are Windows image load events, primarily tracked through **Event ID 4104** for the monitored process and the image loaded. If malicious, the sideloading of **libcurl.dll** could allow attackers to run untrusted code, affecting system integrity and confidentiality. However, this detection does NOT confirm that a compromise has occurred; further investigation is required to ascertain malicious intent.

  ### Investigation Steps

  - **Check process creation logs**: Review **Security Event ID 4688** (process creation) for instances of **gup.exe**. Compare with typical execution paths (e.g., **C:\Program Files\Notepad++\updater\GUP.exe**) to identify legitimate usage.

  - **Review image load events**: Examine **Event ID 4104** for any **gup.exe** processes showing loading of **libcurl.dll** from locations such as **C:\Windows\System32** or **C:\Program Files**. This can indicate potentially malicious activity if from unusual paths.

  - **Assess the legitimacy of the program**: Validate **gup.exe** against known installation directories. Legitimate processes are usually from software repositories and known update locations. If found outside expected paths, it may be suspicious.

  - **Correlate user activity**: Investigate user accounts that interacted with **gup.exe**. Check for unusual access patterns or user accounts with administrative privileges that could facilitate malicious sideloading.

  - **Validate file activity**: Check for any file creation or modification events associated with **libcurl.dll** using **Sysmon Event ID 11** to identify unauthorized changes. Malicious indicators include modifications at times that correlate with **gup.exe** executions.

  ### Prioritization

  This alert is a medium severity due to the potential impact on systems, particularly if **gup.exe** is commonly present and used. The likelihood of malicious abuse is moderate since this behavior can be weaponized for DLL hijacking, especially in environments where trust in update mechanisms is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that use similar update mechanisms or benign sideloading of DLLs. Required log sources include the Windows Security and Sysmon logs, which must be correctly configured for complete visibility. Common legitimate activities triggering this alert could be software updates from trusted sources or system maintenance tasks. A related detection to strengthen coverage includes monitoring for abnormal process calls using **Sysmon Event ID 1**, enhancing visibility into potentially exploitative behaviors.

