note: |
  ### Technical Context
  This detection rule identifies the loading of specific system Dynamic Link Library (DLL) files that are typically absent from the file system or located in system directories—indications of potential DLL sideloading or hijacking attacks. It targets scenarios where adversaries exploit the DLL search order to execute malicious DLLs masquerading as legitimate system binaries. These tactics aim to either maintain persistence on a compromised system, escalate privileges by executing malicious code, or evade detection by leveraging seemingly benign processes.

  The relevant MITRE ATT&CK techniques for this rule include:
  - **Persistence: DLL Search Order Hijacking (T1574.001)**
  - **Privilege Escalation: DLL Injection (T1055)**
  - **Defense Evasion: Masquerading (T1036)**

  Key data sources for detecting this behavior include image load events on Windows systems, particularly events documenting process behaviors around non-standard DLL imports from system directories.

  ### Investigation Steps
  - **Review Image Load Events:** Check image load events for occurrences of the detected DLLs, noting which processes loaded them and their file paths.
  - **Analyze Process Creation:** Investigate the process creation logs to identify the parent processes that initiated the loading of the suspicious DLLs. Look for unusual or unexpected parent-child relationships.
  - **Correlate with System Activity:** Cross-reference the load events with other system logs (e.g., authentication logs, file access events) to see if these DLL loads coincide with suspicious activity, such as unauthorized access attempts or lateral movement.
  - **Check for Abnormal Signatures:** Validate the digital signatures of the loaded DLLs and the processes that loaded them, ensuring they align with known legitimate Microsoft signatures. Note any discrepancies or 'valid but abnormal' signatures.

  ### Prioritization
  Given the high impact and likelihood of using DLL hijacking techniques for privilege escalation and further exploitation, this alert should be prioritized. The detection indicates a potential compromise, warranting immediate investigation to prevent further malicious activities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for benign applications that might load these DLLs under normal circumstances. The detection assumes that all DLLs listed are non-existent or unusual for the environment in question. Additionally, it requires that image load events and process creation logs are being recorded and accessible, which can depend on appropriate logging configurations and system monitoring tools in place.

