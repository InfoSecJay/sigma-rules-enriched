note: |
  ### Technical Context

  This rule detects the loading of specific system DLL files that are typically not present on the system, indicating possible phantom DLL hijacking attempts. The likely attacker objective is to execute malicious code through the loading of a DLL that masquerades as a legitimate system DLL, enabling privilege escalation or persistence. This behavior aligns with the MITRE ATT&CK technique: **DLL Search Order Hijacking (T1574.001)**.

  The primary telemetry source is Windows image load events, specifically focused on loading of DLL files from the System32 directory. Malicious activity could result in unauthorized access or control over systems, while this detection does NOT confirm that the action is indeed malicious without further context or corroborating evidence.

  ### Investigation Steps

  - **Identify the loaded DLLs: ** Check event logs for Event ID 4659 or Sysmon Event ID 10 for DLL loading. Specifically, look for `ImageLoaded` events ending with known phantom DLL names, such as `axeonoffhelper.dll` or `offdmpsvc.dll`.

  - **Verify the origin of the DLLs: ** Confirm the file paths of the detected DLLs by reviewing file system logs (Sysmon Event ID 11). Malicious DLLs may appear in expected system directories but may not physically exist on the system or may have been created recently.

  - **Check the process context: ** Review the parent process of the DLL loading (Sysmon Event ID 1). Legitimate processes loading these DLLs are rare. Validate if the parent process is known and legitimate, like legitimate enterprise applications or system services.

  - **Analyze signature validity: ** Confirm the digital signatures of detected DLLs using properties in the Sysmon logs. DLLs signed by legitimate Microsoft signatures should be validated; any discrepancies could indicate tampering or injection.

  - **Look for unusual manifest entries: ** Search for unusual executable behavior in application or system logs (Event ID 4688 for process creation). Monitor for new or unrecognized applications attempting to execute shortly after the DLL event.

  - **Cross-reference with other detections: ** Investigate various logs for correlated activities (such as lateral movement) that may reinforce the suspicion of DLL hijacking attempts, leveraging the related detection ID `df6ecb8b-7822-4f4b-b412-08f524b4576c`.

  ### Prioritization

  This alert is high-severity due to the potential impact on system integrity if malicious DLL execution takes place. The likelihood of exploitation through DLL hijacking techniques is significant, as this behavior has been widely weaponized to achieve persistence and privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary logging configurations, such as Sysmon or Windows Event log retention policies. Legitimate software updates or installation routines may trigger similar behavior, complicating triage. This rule can be augmented by companion detections that capture anomalous file creation or modification events in combination with DLL loading, helping to corroborate the malicious context.

