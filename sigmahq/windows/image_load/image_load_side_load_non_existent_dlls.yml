note: |
  ### Technical Context

  This Sigma rule detects the loading of specific system DLL files that are not typically present on the affected system, indicating possible DLL hijacking through the loading of phantom DLLs. The likely attacker objective is to execute arbitrary code under the guise of a legitimate process, leveraging the trust associated with system DLLs. This behavior aligns with the MITRE ATT&CK technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources include Windows Event ID 4657 (Notification of changes to an object) and Sysmon Event ID 7 (Image loaded), focusing on log types that include DLL loading activities. If confirmed as malicious, this behavior could enable the adversary to gain persistence or execute further attacks. However, this detection alone does not confirm that the activity is malicious; it may also result from benign or legitimate software updates.

  ### Investigation Steps

  - **Check DLL presence:** Review the system directories (e.g., `C:\Windows\System32\`) for the listed DLLs (e.g., `axeonoffhelper.dll`, `offdmpsvc.dll`). Malicious DLLs are unlikely to be present if this is a standard installation.

  - **Review loading process:** Examine the loading process using Sysmon Event ID 7 to determine which process loaded the suspicious DLL. Look for processes with unusual parent-child relationships likely used for exploitation.

  - **Validate digital signatures:** For any detected DLL file, verify the digital signatures to ensure they are signed by Microsoft. Use Windows Event ID 4657 for signatures. If the DLL is not from a legitimate source, it is likely malicious.

  - **Analyze recent system changes:** Inspect Windows Event ID 5145 (File Share Access) for any recent abnormal file access patterns that correlate to the suspicious DLL being loaded. Any unexpected read or execute requests from non-administrative or low-privilege users may indicate malicious activity.

  - **Observe legitimate behavior:** Maintain a baseline for expected DLLs in your environment. For instance, established applications should not attempt to load non-standard DLLs at runtime and should be using validated system DLLs.

  - **Identify indicators of compromise (IoCs):** Look for high-confidence malicious indicators such as anomalously high counts of DLL loads from the process identified in the previous steps, which could indicate systematic exploitation attempts.

  ### Prioritization

  This alert should be rated high due to the potential impact on sensitive systems, especially if critical infrastructure assets are involved. The likelihood of malicious abuse is significant, as DLL hijacking techniques are frequently weaponized by adversaries to maintain persistence or escalate privileges.

  ### Blind Spots and Assumptions

  Detection may miss attacks utilizing obfuscation or renamed DLLs to evade scrutiny. Reliable detection depends on ensuring appropriate logging configurations are active, such as enabling Sysmon for comprehensive event tracking. Legitimate software updates or installation procedures may trigger this alert if they utilize system DLLs in a non-standard way. A related detection technique is monitoring for anomalous process executions, which could further strengthen coverage for identifying malicious behaviors associated with this attack vector.

