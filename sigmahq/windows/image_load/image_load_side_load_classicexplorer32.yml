logsource:
  category: image_load
  product: windows
detection:
  selection_classicexplorer:
    ImageLoaded|endswith: '\ClassicExplorer32.dll'
  filter_classicexplorer:
    ImageLoaded|startswith: 'C:\Program Files\Classic Shell\'
  condition: selection_classicexplorer and not filter_classicexplorer
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading when `ClassicExplorer32.dll` is loaded from an unexpected file path, specifically when it does not originate from its legitimate installation directory, `C:\Program Files\Classic Shell\`. The likely attacker objective is to leverage a trusted application to execute malicious code, achieving persistence and privilege escalation. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion (ID T1574) and Persistence (ID T1546.001). The primary telemetry source is Windows Image Load events, particularly focusing on the image loaded and its path.

  If the behavior is confirmed malicious, it may indicate a compromise of the trusted application and subsequent unauthorized command execution. Notably, this detection alone does not confirm whether the code executed is indeed malicious or if it's a benign use of the Classic Shell application.

  ### Investigation Steps

  - **Check the image load path:** Investigate Event ID 4104 or Sysmon Event ID 7 for `ImageLoaded` paths. Validate if `ClassicExplorer32.dll` is loaded from `C:\Program Files\Classic Shell\` or an unusual path like `C:\Users\<username>\AppData\Local\Temp\`. An unexpected path suggests potential malicious activity.

  - **Review load order and execution context:** Analyze Event ID 4688 for process creation details where `ClassicExplorer32.dll` is called. Confirm if the parent process is a legitimate process like `ClassicShell.exe`. Any anomalous parent-child relationships may indicate malicious behavior.

  - **Identify system role and file validation:** Assess if the system is a critical asset, such as a server or domain controller, making the impact of potential compromise more significant. Also, cross-reference file hashes of the loaded DLL with known databases to check for any reported malicious versions.

  - **Document legitimate usage scenarios:** For context, consider standard usage of the Classic Shell application. Typical usage will often yield loads from the installation directory. Document instances of legitimate operations using `ClassicExplorer32.dll` for comparison.

  - **Look for other indicators of compromise:** Correlate findings with Windows Security Event IDs (e.g., 4624, 4672) for unusual logins or privilege escalations around the same time. Indicators like downloads from untrusted sources or suspicious network connections further support a malicious hypothesis.

  ### Prioritization

  This alert carries a medium severity level because it could indicate an attempt to exploit a commonly used legitimate application for malicious purposes. A successful attack using DLL sideloading techniques could severely impact an enterprise, particularly if it targets critical systems or sensitive data. This behavior is increasingly weaponized by adversaries, particularly in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if Windows Event logging or Sysmon configurations are not properly set, as these logs are essential for identifying DLL activity. Evasion techniques may include legitimate applications being compromised, leading to sideloading, or threat actors utilizing less common software for similar runs. Legitimate updates or changes in application environment could trigger this alert as well. A related detection to strengthen coverage is tracking process injection attempts or unauthorized DLL modifications in real-time, which can provide additional context to the current behavior being investigated.

