title: Potential DLL Sideloading Via ClassicExplorer32.dll
id: caa02837-f659-466f-bca6-48bde2826ab4
status: test
description: Detects potential DLL sideloading using ClassicExplorer32.dll from the
  Classic Shell software
references:
- https://blogs.blackberry.com/en/2022/12/mustang-panda-uses-the-russian-ukrainian-war-to-attack-europe-and-asia-pacific-targets
- https://app.any.run/tasks/6d8cabb0-dcda-44b6-8050-28d6ce281687/
author: frack113
date: 2022-12-13
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_classicexplorer:
    ImageLoaded|endswith: '\ClassicExplorer32.dll'
  filter_classicexplorer:
    ImageLoaded|startswith: 'C:\Program Files\Classic Shell\'
  condition: selection_classicexplorer and not filter_classicexplorer
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the loading of the `ClassicExplorer32.dll` file from unauthorized locations, which could indicate a DLL sideloading attack. Attackers may use DLL sideloading to execute malicious code under the guise of a legitimate application, achieving persistence or privilege escalation. This behavior aligns with the MITRE ATT&CK technique for DLL sideloading (T1574.001).

  The primary telemetry source for this detection is Windows image load events, specifically monitoring processes that may load DLLs. A successful sideloading exploit can allow attackers to gain footholds or escalate privileges in the environment. This detection does NOT confirm a successful exploit on its own; further investigation is required to determine if the activity is malicious.

  ---

  ### Investigation Steps

  - **Identify the process loading the DLL:** Cross-reference the `ImageLoaded` event (Event ID 9 for Sysmon) to determine which parent process is loading `ClassicExplorer32.dll`. Look for any suspicious parent processes that loaded DLLs from paths not associated with the Windows environment.

  - **Validate legitimate behavior:** Check for normal instances of `ClassicExplorer32.dll` being loaded from `C:\Program Files\Classic Shell\`. If this path is not consistent and originates from a different directory, it may indicate malicious intent.

  - **Correlate with user activity:** Investigate the user associated with the DLL load event. Verify whether the user has the credentials and permissions typical for running the Classic Shell application, and ensure their recent activity aligns with such execution.

  - **Check for high-confidence malicious indicators:** Look for associated Event ID 4688 (Process Creation) logs that signify unexpected creation or modification of system-critical applications around the DLL load time, such as CMD.exe or PowerShell.

  - **Analyze for additional suspicious DLL activity:** Search for other unusual DLLs being loaded on the same system and discern whether they coincide with the JavaScript or batch files frequently used in conjunction with DLL sideloading.

  ---

  ### Prioritization

  This alert should be considered medium priority as it indicates a potential avenue for malicious activities, such as DLL sideloading, which can enable persistent threats or privilege escalation. The impact could be significant if the affected asset is critical or contains sensitive data. While not all instances of this behavior are malicious, the potential for abuse warrants immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations based on the security configurations of endpoints and could be evaded by attackers utilizing alternative DLLs or known legitimate processes. The effectiveness of detection relies heavily on the correct configuration of Sysmon and Windows logging. Legitimate software updates or reinstallation of Classic Shell could trigger the alert and should be validated accordingly. Monitoring for process creation and modification events (Event ID 4688) would strengthen response capability in conjunction with this rule.

