logsource:
  category: image_load
  product: windows
detection:
  selection_classicexplorer:
    ImageLoaded|endswith: '\ClassicExplorer32.dll'
  filter_classicexplorer:
    ImageLoaded|startswith: 'C:\Program Files\Classic Shell\'
  condition: selection_classicexplorer and not filter_classicexplorer
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading behavior by identifying when the ClassicExplorer32.dll is loaded from an unusual directory, instead of its expected location within the Classic Shell installation directory. DLL sideloading is often exploited by attackers to execute malicious payloads by leveraging trusted executables to load untrusted libraries. The likely attacker objective here is to escalate privileges, maintain persistence, or execute arbitrary code on the host.

  This behavior aligns with MITRE ATT&CK tactics: **Persistence** (TA0003) and **Privilege Escalation** (TA0004) through the technique of **DLL Search Order Hijacking** (T1574.001). The primary telemetry source is Windows process load logs, specifically image load events that track DLLs being loaded. If successful, the security impact could be significant, including unauthorized access to sensitive data or disruption of critical services. It is important to note that this detection alone does not confirm malicious intent, as the DLL may have been loaded by legitimate software installations or configurations.

  ### Investigation Steps

  - **Check DLL Load Path:** Review the Event ID 10 logs (Image Load events) for the ClassicExplorer32.dll. Confirm the file load path is `C:\Program Files\Classic Shell\ClassicExplorer32.dll`. If the path is different (e.g., local user directories), this is a potential malicious indicator.

  - **Validate Process Parent:** Identify the parent process associated with the loading of the ClassicExplorer32.dll via Event ID 4688 (Process Creation). Ensure the parent process is a legitimate application from Classic Shell. An unusual or suspicious parent process (e.g., cmd.exe or powershell.exe) can indicate potential abuse.

  - **Review User Context:** Analyze the user account that triggered the DLL load. If it is a low-privilege user initiating the load under unusual circumstances, this could raise red flags. Normal activity should involve admin or system accounts executing Classic Shell components.

  - **Examine System Changes:** Look for additional signs that could indicate a compromise, such as recent changes to system policies or task scheduler configurations that might reflect persistence mechanisms typically used in DLL sideloading.

  - **Check for Related Alerts:** Look for alerts that may indicate related malicious behaviors, such as unauthorized modifications in the Windows Event Logs (Event ID 4624 for successful logons) or unusual file creations in the Classic Shell directory through Sysmon Event ID  creations.

  ### Prioritization

  This alert carries a medium severity level due to the potential privilege escalation risk it poses if malicious. The impact is heightened if the affected system is a critical endpoint, such as a server or administrative workstation, and the likelihood of this technique being used in active attacks is notable, especially amongst targeted threat actors.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate applications that may load the same DLL in unconventional paths under certain configurations. It's essential that the appropriate configuration captures all image loads from potential directories. Alternatives such as legitimate software updates may also trigger similar alerts, reinforcing the need for thorough investigation. A companion detection to consider is monitoring for unusual execution of scripts or binaries that could leverage the DLL for account manipulation (related to T1064 - Scripting).

