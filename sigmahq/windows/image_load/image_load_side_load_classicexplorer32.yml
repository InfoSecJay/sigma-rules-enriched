title: Potential DLL Sideloading Via ClassicExplorer32.dll
id: caa02837-f659-466f-bca6-48bde2826ab4
status: test
description: Detects potential DLL sideloading using ClassicExplorer32.dll from the
  Classic Shell software
references:
- https://blogs.blackberry.com/en/2022/12/mustang-panda-uses-the-russian-ukrainian-war-to-attack-europe-and-asia-pacific-targets
- https://app.any.run/tasks/6d8cabb0-dcda-44b6-8050-28d6ce281687/
author: frack113
date: 2022-12-13
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_classicexplorer:
    ImageLoaded|endswith: '\ClassicExplorer32.dll'
  filter_classicexplorer:
    ImageLoaded|startswith: 'C:\Program Files\Classic Shell\'
  condition: selection_classicexplorer and not filter_classicexplorer
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potential DLL sideloading attempts involving the `ClassicExplorer32.dll` file associated with the Classic Shell software. DLL sideloading is a technique attackers use to execute malicious code by tricking a legitimate application into loading a malicious DLL placed in the same directory. In this case, the attacker may leverage `ClassicExplorer32.dll` to maintain persistence, evade detection, and escalate privileges through its interactions with trusted applications that load the DLL.

  The likely attacker objectives encompass gaining unauthorized access to systems, escalating privileges, and compromising sensitive information. This behavior falls under several MITRE ATT&CK tactics, notably "Defense Evasion" (TA0005) and "Persistence" (TA0003), and more specifically utilizes the technique "DLL Search Order Hijacking" (T1574.001). For effective investigation, primary data sources include image load events that capture details regarding DLLs loaded by processes on Windows systems, as these will reveal suspicious or anomalous DLL load behavior.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze image load logs specifically targeting instances of `ClassicExplorer32.dll` to identify any anomalies in its loading behavior.
  - **Correlate with Process Creation Logs**: Check associated process creation logs to determine which parent processes loaded the DLL and assess their legitimacy.
  - **Examine File Path Validity**: Validate the file paths of `ClassicExplorer32.dll` by ensuring it is located in its expected directory (`C:\Program Files\Classic Shell\`). Look for instances where it may be loaded from atypical locations.
  - **Investigate Related Network Activity**: Monitor network traffic for signs of callbacks or communications initiated by processes using `ClassicExplorer32.dll`. This could indicate malicious activity or connections to command-and-control infrastructure.

  ### Prioritization
  This alert is of medium severity due to the potential impact of successful DLL sideloading, which could lead to unauthorized access and elevated privileges. The likelihood of encountering such tactics is moderately high, particularly in environments using legacy or third-party applications like Classic Shell.

  ### Blind Spots and Assumptions
  This detection rule may not cover instances where the DLL is inappropriately loaded from legitimate directories by other forms of malware that do not utilize the `ClassicExplorer32.dll`. It assumes that the image load events are reliably logged and that there are no application or operating system anomalies preventing detection. Necessary log configurations must be in place to capture the image load activity comprehensively, alongside the requisite permissions for monitoring process interaction on the endpoint.

