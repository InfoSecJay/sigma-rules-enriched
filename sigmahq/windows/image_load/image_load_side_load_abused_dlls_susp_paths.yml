title: Abusable DLL Potential Sideloading From Suspicious Location
id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
status: test
description: Detects potential DLL sideloading of DLLs that are known to be 
  abused from suspicious locations
references:
- https://www.trendmicro.com/en_us/research/23/f/behind-the-scenes-unveiling-the-hidden-workings-of-earth-preta.html
- https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
author: X__Junior (Nextron Systems)
date: 2023-07-11
tags:
- attack.execution
- attack.t1059
logsource:
  category: image_load
  product: windows
detection:
  selection_dll:
    ImageLoaded|endswith:
            # Note: Add more generic DLLs that cannot be pin-pointed to a single application
    - '\coreclr.dll'
    - '\facesdk.dll'
    - '\HPCustPartUI.dll'
    - '\libcef.dll'
    - '\ZIPDLL.dll'
  selection_folders_1:
    ImageLoaded|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\Temporary Internet'
    - '\Windows\Temp\'
  selection_folders_2:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Pictures\'
  condition: selection_dll and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading by monitoring the loading of specific DLLs from suspicious directories. Adversaries may leverage this technique to execute malicious code by loading DLLs from non-standard or insecure locations, thereby bypassing security controls that would typically protect system directories. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **DLL Search Order Hijacking** (T1203).

  Primary telemetry sources include Windows image load events, specifically looking at logs that capture the paths of loaded images (DLLs). If malicious, this behavior may enable persistent threats or facilitate further exploitation of the system. Notably, this detection does NOT confirm that the executed code is malicious; it only indicates that a potentially risky behavior has occurred.

  ### Investigation Steps

  - **Check the source of loaded DLLs:** Review Event ID 4104 for suspicious DLL paths, such as those from `C:\Users\Public\`, `C:\Windows\Temp\`, or browser cache directories. Legitimate applications typically load DLLs from their own installation directories.

  - **Identify the loaded DLLs:** Inspect the specific DLLs loaded by using Event ID 4657 (Registry Value Modifications). Look for entries matching `coreclr.dll`, `libcef.dll`, or others from the defined list. Legitimate DLLs from expected sources should match application signatures.

  - **Evaluate the process lineage:** Use Sysmon Event ID 1 to analyze the parent process of DLL loads. A process spawned by a known or expected application (e.g., `explorer.exe` or `msiexec.exe`) is less suspicious than one initiated by an unexpected or uncommon process.

  - **Cross-reference with installed applications:** Validate the legitimacy of the DLL by checking against known installed applications. Use tools like Microsoft Sysinternals' Process Explorer to verify the application's integrity and examine DLLs in context.

  - **Review known benign usage patterns:** Document and evaluate cases where specific applications legitimately load DLLs from these directories, such as user-installed software that may temporarily deploy DLLs during an operation.

  ### Prioritization

  This alert is high-severity due to the critical nature of DLL sideloading techniques in executing arbitrary code on systems, potentially leading to a significant breach. The likelihood of adversaries employing this method is high, especially considering the increasing sophistication of attacks that target DLL loading mechanisms.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations for DLL loads on all endpoints. Adversaries might attempt to evade detection using legitimate-looking paths or promotions to trusted applications. Additionally, benign applications can trigger this alert if they load DLLs from unusual locations, complicating the investigation. A companion detection could involve monitoring for **Process Creation** events (Sysmon Event ID 1) to further validate the context surrounding suspicious DLL loads.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
