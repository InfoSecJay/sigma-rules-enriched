title: Abusable DLL Potential Sideloading From Suspicious Location
id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
status: test
description: Detects potential DLL sideloading of DLLs that are known to be abused
  from suspicious locations
references:
- https://www.trendmicro.com/en_us/research/23/f/behind-the-scenes-unveiling-the-hidden-workings-of-earth-preta.html
- https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
author: X__Junior (Nextron Systems)
date: 2023-07-11
tags:
- attack.execution
- attack.t1059
logsource:
  category: image_load
  product: windows
detection:
  selection_dll:
    ImageLoaded|endswith:
            # Note: Add more generic DLLs that cannot be pin-pointed to a single application
    - '\coreclr.dll'
    - '\facesdk.dll'
    - '\HPCustPartUI.dll'
    - '\libcef.dll'
    - '\ZIPDLL.dll'
  selection_folders_1:
    ImageLoaded|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\Temporary Internet'
    - '\Windows\Temp\'
  selection_folders_2:
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ImageLoaded|contains|all:
    - ':\Users\'
    - '\Pictures\'
  condition: selection_dll and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading attacks by monitoring the loading of specific abuse-prone DLL files from suspicious directories. DLL sideloading is a technique used by attackers to execute malicious code by masquerading it as a legitimate DLL file. Attackers aim to exploit the application's legitimate access to load malicious code from a resource that typically should not be executing such files. This behavior can lead to unauthorized access, data theft, or further compromise of the system.

  The relevant MITRE ATT&CK tactics include **Execution** (T1203: Exploitation of a Vulnerability) and **Command-Line Interface** (T1059: Command and Scripting Interpreter). This highlights that the rule is designed to detect suspicious behaviors often associated with sophisticated malware families that utilize base-level executables or installed software for covert payload delivery.

  Primary data sources include **image load logs** from Windows, which contain information about loaded libraries and their paths. Investigating these logs can reveal whether these dangerous DLLs are executed from unexpected locations, aiding analysts in identifying potential breaches.

  ### Investigation Steps
  - **Review DLL Loading Events:** Analyze image load logs for instances where the specified potentially malicious DLLs (`coreclr.dll`, `facesdk.dll`, etc.) are loaded. Focus on the associated paths to confirm whether they originate from suspicious directories.

  - **Correlate Processes:** Investigate the parent processes that initiated the DLL loading. Check if they are legitimate applications or known benign processes, as this context can help distinguish between normal operations and potential malicious activity.

  - **Inspect System Behavioral Changes:** Observe the behavior of the system following the loading of these DLLs. Look for any unusual network connections, file creation or modification, or attempts to access sensitive data that could indicate malicious activities.

  - **Confirm User Context:** Validate the user account under which the DLL loading occurred. Look for anomalies such as non-administrative users loading DLLs that typically require elevated privileges or accessing uncommon system folders.

  ### Prioritization
  This alert is prioritized as high severity because DLL sideloading can lead to significant compromise of a system, allowing attackers to execute arbitrary code without detection. The likelihood of exploiting these vectors is heightened, especially in environments with insufficient malware protection measures.

  ### Blind Spots and Assumptions
  The rule may have gaps in detection coverage regarding environment-specific configurations or legitimate use cases involving the loading of these DLLs. Assumptions include the idea that these DLL files should not normally be loaded from the specified directories; however, there could be valid scenarios that aren't accounted for. Required logs include comprehensive image load events, which must be enabled and properly configured to accurately capture this detection activity.

