note: |
  ---

  ### Technical Context

  This rule detects the loading of Global Assembly Cache (GAC) DLLs by Microsoft Office applications, which can indicate potential misuse of these applications to run arbitrary or malicious code. An attacker may leverage Office documents to execute code indirectly, aiming to bypass security controls while achieving their objectives such as data exfiltration or system compromise.

  Relevant MITRE ATT&CK techniques include **Execution: User Execution (T1204.002)**. The primary telemetry sources are derived from Windows Event Logs, specifically image load events detailing application executions. If the detected GAC DLLs are malicious, it could lead to significant security impacts including data breaches or unauthorized access. Importantly, the detection does NOT confirm malicious intent on its own, as legitimate use cases for loading GAC DLLs do exist.

  ---

  ### Investigation Steps

  - **Check for GAC DLL loading:** Review image load events for processes (Event ID 4100) associated with the specified Office applications, such as `winword.exe` or `excel.exe`. Look for `ImageLoaded` entries that start with `C:\Windows\Microsoft.NET\assembly\GAC_MSIL` to identify suspicious behavior.

  - **Identify specific GAC DLLs:** Search for the loaded GAC DLLs in the relevant events. Malicious indicators include known malicious assemblies or custom GAC DLLs not typically associated with Office apps. Cross-reference against threat intelligence for known malicious GAC DLLs.

  - **Assess document metadata:** Analyze the Office document (if applicable) for user editing history and metadata that includes the file's source. Look for unusual external sources or unexpected changes that may indicate malicious tampering.

  - **Correlate with other alerts:** Check for additional anomalous behavior, such as unauthorized access attempts or network traffic originating from the same endpoint. This correlates with broader patterns of exploitation typically associated with DLL sideloading.

  - **Evaluate legitimate usage:** Consider potential legitimate activities that could trigger this alert, such as the use of enterprise-managed macros for non-malicious purposes. Confirm users are authorized to run such macros from trusted sources.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for exploitation of critical systems that run Office applications. The use of GAC DLLs in this manner often indicates an attacker leveraging known execution techniques, with documented instances of such methods being exploited in the wild.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for image loads is not enabled or configured incorrectly; ensure the appropriate event logging settings are applied. Legitimate macro usage within business operations could trigger this alert, thus thorough investigation is crucial to differentiate between benign and malicious actions. A companion detection for monitoring unusual command-line execution (e.g., using Sysmon Event ID 1) can enhance visibility into potential exploitation pathways.

