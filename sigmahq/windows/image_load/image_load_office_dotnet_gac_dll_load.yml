detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|startswith: 'C:\Windows\Microsoft.NET\assembly\GAC_MSIL'
  condition: selection
falsepositives:
- Legitimate macro usage. Add the appropriate filter according to your environment
level: high
note: |
  ### Technical Context
  This rule detects the loading of Global Assembly Cache (GAC) DLLs by Microsoft Office applications such as Excel, Word, PowerPoint, and others. The presence of GAC DLLs being loaded in this context is concerning as it can indicate malicious behavior where an attacker uses Office applications to execute code that may not be readily apparent to the user. This is often associated with methods of code execution that evade standard security measures, potentially leading to further exploitation or data exfiltration.

  The likely attacker intention behind this behavior is to leverage commonly trusted applications to run malicious code, making the attack less detectable. This technique falls under the MITRE ATT&CK framework's Execution tactic, specifically technique T1204.002, which addresses the use of user execution for malicious payloads hidden within trusted software environments.

  Primary data sources for this detection include Image Load event logs, which capture details about the processes and DLLs loaded by executable files running on Windows systems, particularly during the execution of Microsoft Office applications.

  ### Investigation Steps
  - **Review Image Load Events:** Investigate recent image load events to identify instances where GAC DLLs were loaded by Office applications. Pay close attention to the event timestamps and cross-reference them with known legitimate activities.

  - **Analyze Process Creation Logs:** Check process creation logs linked to the same time frame to establish a sequence of operations. Look for any processes that spawned the Office applications in question and analyze their parent processes for anomalies.

  - **Examine Office Document Metadata:** Review any Office documents that were opened or executed around the time of the image loading events. Look for suspicious macros or embedded code that may have initiated the DLL loading.

  - **Correlate With Threat Intelligence:** Cross-reference findings with threat intelligence databases to identify potential known threat actors or families that utilize GAC DLL malicious loading, enhancing the understanding of the threat actor's tactics.

  ### Prioritization
  The alert carries high severity due to its potential to enable an attacker to execute arbitrary code via trusted applications, posing a significant risk to enterprise environments. The likelihood of exploitation through this method is elevated, especially in organizations where users regularly use Office applications.

  ### Blind Spots and Assumptions
  This detection logic may have blind spots, particularly in environments where legitimate macro usage is normatively high, which can lead to false positives. It assumes that all relevant GAC DLL loading activities are captured in the logs and does not account for DLLs loaded from unusual or non-standard locations outside the GAC. Required logs include detailed image load event logging for Windows systems and properly configured logging for Office applications to ensure comprehensive coverage.

