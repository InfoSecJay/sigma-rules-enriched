note: |
  ---

  ### Technical Context

  This Sigma rule detects the loading of `dbgcore.dll` or `dbghelp.dll` by `WerFaultSecure.exe`, which can be indicative of the EDR-Freezing technique used by adversaries to evade detection. The intent behind this action is often to temporary suspend security controls like endpoint detection and response (EDR) or antivirus processes to execute malicious activities undetected. This behavior maps to the MITRE ATT&CK technique TA-1562.001 (Impair Defenses: EDR-Freezing).

  The primary telemetry sources are Windows image load events, specifically from the Event ID 4104 (from Sysmon) or the image load logs. If malicious, the suspension of security measures could lead to a compromised environment, allowing attackers to execute further actions with reduced oversight. However, this detection does NOT confirm that malicious activity is taking place; further investigation is required to validate attacker intentions.

  ---

  ### Investigation Steps

  - **Check event logs for process creation:** Look for Security Event ID 4688 related to `WerFaultSecure.exe` creation. This process should not typically execute frequently on standard endpoints.

  - **Identify loaded DLLs:** Examine the Sysmon Event ID 7 or Windows Event ID 4104 to find `dbgcore.dll` or `dbghelp.dll` loaded by `WerFaultSecure.exe`. If either DLL is present, note the time and the initiating user context for further examination.

  - **Correlate with existing EDR or AV products:** Determine if the processes being suspended are critical security products. Look for log entries indicating if any processes related to EDR or antivirus tools were recently running at the same time as the anomaly.

  - **Validate expected usage:** Identify legitimate instances of `WerFaultSecure.exe` and its associated DLLs by reviewing system administration practices. Determine typical patterns of execution and enumerate processes that should not trigger this alert frequently on normal operations.

  - **Review for known malicious patterns:** Search for earlier indicators in the environment, such as unusual events leading up to the notification, originating from known bad IP addresses or associated with previous incidents, leveraging logs from firewalls or proxies.

  - **Analyze impact on critical assets:** Consider host criticality; if this behavior occurs on systems critical to business operations such as servers or domain controllers, escalate the alert for immediate containment measures.

  ---

  ### Prioritization

  Given that the detected process can potentially suspend key security processes, this alert is medium severity. The impact of its execution is significant, particularly if it is found on critical endpoints, as it indicates a high likelihood of malicious use, especially if associated with known adversary tactics.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments lacking proper telemetry configurations for image loads or without the Sysmon agent properly deployed. Adversaries may also employ alternative mechanisms to evade detection by using different processes or DLLs. Routine administrative tasks might inadvertently trigger this alert, necessitating the analysis of the operational context. Monitoring additional MITRE ATT&CK techniques, particularly other evasive techniques related to TA-1562, can augment overall coverage against such tactics.

