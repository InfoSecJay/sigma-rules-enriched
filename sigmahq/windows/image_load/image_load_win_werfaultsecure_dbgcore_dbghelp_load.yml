note: |
  ---

  ### Technical Context

  This rule detects the loading of `dbgcore.dll` or `dbghelp.dll` by `WerFaultSecure.exe`. This behavior indicates a potential bypass of endpoint detection and response (EDR) solutions, as the `MiniDumpWriteDump` function is used to create minidumps by suspending all threads in a target process. The likely attacker objective is to execute malicious code while evading detection, manifesting a behavior known as "EDR-Freeze."

  This detection relates to the MITRE ATT&CK tactic for Defense Evasion (ID: T1562.001). Primary telemetry sources include Windows Event ID 4688 (process creation) and Sysmon Event ID 10 (image load). If malicious, this could impact the security of critical systems by allowing undetected persistent threats. Importantly, this detection does not confirm that malicious activity is occurring on its own; it should be corroborated with additional evidence.

  ---

  ### Investigation Steps

  - **Check recent process creation events**: Review Security Event ID 4688 logs for the creation of `WerFaultSecure.exe`. Look for timestamps correlating with the alert. Legitimate usage typically involves user applications, not unexpected `dbgcore.dll` interactions.

  - **Identify loaded DLLs**: Investigate Sysmon Event ID 10 logs for `WerFaultSecure.exe` loading `dbgcore.dll` or `dbghelp.dll`. Legitimate applications should not invoke these classes of files under unusual conditions, such as execution by a non-standard user context.

  - **Examine associated processes**: Query related processes for any suspicious activity tied to `WerFaultSecure.exe`, such as other recently created processes that may indicate lateral movement or secondary payload execution.

  - **Review EDR solution logs**: Validate if any EDR or AV solutions logged abnormal activity or halted operations during the time around the alert, which may indicate malicious evasion attempts.

  - **Look for indicators of exfiltration**: Inspect logs for file creation or modification events that coincide with the suspicious process activity. Files related to minidumps may indicate underlying malicious behavior, especially if unusual in volume or created in critical system directories.

  ---

  ### Prioritization

  This alert should be treated as medium severity. The potential impact is high, particularly on critical systems where protection against evasion tactics is crucial. The use of EDR-Freeze techniques is increasingly weaponized by adversaries, making any indication of such behavior significant for immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses alternative methods to disable or bypass EDR solutions without utilizing `WerFaultSecure.exe`. Reliable detection requires comprehensive logging of image loads and process creations. Legitimate activities, such as debugging tools or software updates that may invoke `WerFaultSecure.exe`, can result in false positives. For enhanced coverage, correlate this detection with other indicators of exploitation, such as querying for abnormal network activity (e.g., related to suspicious outbound connections or data transfers).

