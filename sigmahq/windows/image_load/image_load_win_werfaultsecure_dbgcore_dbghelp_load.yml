note: |
  ### Technical Context
  This rule detects the suspicious activity of the `WerFaultSecure.exe` process loading the `dbgcore.dll` or `dbghelp.dll` libraries. This scenario is indicative of a potential EDR (Endpoint Detection and Response) evasion technique known as "EDR-Freeze." When exploited by an attacker, `WerFaultSecure.exe` can serve as a Protected Process Light (PPL), which can suspend other security solutions running on the endpoint. By calling the `MiniDumpWriteDump` function from these dynamic link libraries, the attacker can suspend and manipulate processes, circumventing detection mechanisms during the critical suspension period.

  The threat scenario typically involves an attacker attempting to hide their activities or maintain persistent access by disabling security controls. The likely objective is to allow for the execution of malicious code without detection, leading to potential data exfiltration and further compromise within the environment. Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (TA0005)**: The overarching tactic of avoiding detection by security measures.
  - **Process Injection (T1055)**: Although primarily focused on traditional injection, this technique applies here through the manipulation of process suspension.

  Primary data sources for effective detection include image load events within Windows that will capture process interactions and loaded libraries.

  ### Investigation Steps
  - **Review Image Load Events**: Check logs for events where `WerFaultSecure.exe` loads `dbgcore.dll` or `dbghelp.dll` to confirm the detection of this potential evasion technique.
  - **Analyze Process Activity**: Investigate related process creation events before and after the detection. Look for any unusual or unexpected behavior surrounding `WerFaultSecure.exe`.
  - **Correlate with EDR Logs**: Examine EDR telemetry and relevant alerts to identify if other security solutions were suppressed during the time of detection, indicating potential evasion.
  - **Inspect Memory Snapshots**: If available, assess memory dumps from the affected system for the presence of malicious payloads or unexpected processes that may have executed during the suspension.

  ### Prioritization
  This alert is of medium severity as the use of EDR-Freeze techniques directly undermines security controls, potentially allowing an attacker to execute malicious processes unnoticed. Given the critical nature of endpoint protections, any detection of this technique should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments where the visibility of image loading events is limited or where logging is not configured to capture all relevant activities. The detection logic assumes that the built-in Windows logging adequately captures these events, and that `WerFaultSecure.exe` is present in the environment. Adequate logging settings, including image load monitoring, are essential for this alert to function effectively.

