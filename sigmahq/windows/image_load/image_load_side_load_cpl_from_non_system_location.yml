title: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
status: test
description: |
  Detects image load events of system control panel items (.cpl) from uncommon or non-system locations that may indicate DLL sideloading or other abuse techniques.
references:
- https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
- https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
- https://github.com/mhaskar/FsquirtCPLPoC
- https://securelist.com/sidewinder-apt/114089/
author: Anish Bogati
date: 2024-01-09
modified: 2026-02-17
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith:
    - '\appwiz.cpl'         # Usually loaded by fondue.exe
    - '\bthprops.cpl'         # Usually loaded by fsquirt.exe
    - '\hdwwiz.cpl'         # Usually loaded by hdwwiz.exe
  filter_main_legit_location:
    ImageLoaded|startswith:
    - 'C:\Windows\Prefetch\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_side_load_cpl_from_non_system_location/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the loading of system control panel items (.cpl files) from uncommon or non-standard locations in Windows, signifying potential misuse such as DLL sideloading. Attackers may load these files from atypical directories to evade security controls, often to gain persistence or escalate privileges. The relevant MITRE ATT&CK technique is **"Sideloading" (T1574.001)**. The primary telemetry source is Windows image load events, specifically targeting the loading of .cpl files outside expected directories (like C:\Windows\System32).

  If malicious, this behavior can allow an adversary to execute arbitrary code or escalate permissions on a target system. This detection does NOT confirm malicious intent on its own; legitimate applications may also load these files from non-standard paths for various reasons.

  ### Investigation Steps

  - **Identify the loading process:** Examine the loading process for the .cpl file by checking Event ID 4688 (Process Creation) to see which executable triggered the .cpl loading. Look for parent processes such as `fondue.exe`, `fsquirt.exe`, or `hdwwiz.exe`.

  - **Review file paths:** Validate the file path of the loaded .cpl file. Legitimate system control panel items are expected in known system paths. Any loading from directories like user folders or temp directories may indicate suspicious activity.

  - **Check for uncommon execution:** Investigate the timestamp of the image load events against known good use cases within your organization. Look for Time-based anomalies in Sysmon Event ID 11 (Image Load) to find discrepancies in expected behavior.

  - **Correlate with other logs:** Cross-reference the detected loading activity with related logs. For example, query Security Event ID 4688 for processes that might have executed shortly before the .cpl load, looking for known malicious indicators such as suspicious command-line arguments.

  - **Assess system impact:** Identify affected system roles (e.g., Domain Controllers, servers) and evaluate the potential impact of this activity, particularly if it’s on a system with sensitive data or critical functions.

  ### Prioritization

  This alert is of **high severity** due to the potential for privilege escalation and persistence via non-standard execution paths, especially for critical systems. The likelihood of malicious use is significant, considering common APT behaviors. Such evasion techniques are frequently weaponized in environment-specific attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging level is insufficient or if the image load events are filtered out due to noise. Adversaries may also employ valid applications to execute this behavior, leading to false positives. Ensure Sysmon is configured correctly to capture image load events for reliable detection. Related detections, such as **“Suspicious Process Creation” (T1059)**, could strengthen coverage by capturing potentially malicious parent-child process relationships.

