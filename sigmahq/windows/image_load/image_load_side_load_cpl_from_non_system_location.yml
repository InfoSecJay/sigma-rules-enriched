title: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
status: test
description: Detects image load events of system control panel items (.cpl) from
  uncommon or non-system locations which might be the result of sideloading.
references:
- https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
- https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
author: Anish Bogati
date: 2024-01-09
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith:
    - '\hdwwiz.cpl'         # Usually loaded by hdwwiz.exe
    - '\appwiz.cpl'         # Usually loaded by fondue.exe
  filter_main_legit_location:
    ImageLoaded|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies the loading of system control panel items (.cpl) from uncommon or non-standard locations, which may indicate malicious activity such as sideloading of malware. Attackers may exploit these files to masquerade malicious executables as legitimate control panel items, gaining unauthorized access or executing payloads. The relevant MITRE ATT&CK technique is "Sideloading" (T1036).

  Primary telemetry sources include Windows Image Load events, specifically monitoring `ImageLoaded` actions to capture the paths of loaded control panel items. If detected activity is malicious, it could lead to further lateral movement, data exfiltration, or system compromise. Importantly, this detection alone does not confirm that the loaded .cpl file is malicious, as legitimate applications may also load control panel items from uncommon locations under specific circumstances.

  ### Investigation Steps

  - **Verify the source path of the .cpl file:** Inspect the `ImageLoaded` field for the file path of the loaded .cpl. Legitimate loading should occur from `C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`. Loading from other directories may indicate potential malice.

  - **Check process relationships:** Identify the parent process using Sysmon Event ID 1 or Windows Event ID 4688. Look for unusual parent processes that may indicate an attacker execution chain (e.g., if `hdwwiz.exe` is parented by PowerShell or another non-standard process).

  - **Review execution timestamps:** Examine the timestamps of the `.cpl` loads against recent system changes or new deployments. Unexpected .cpl executions during off-hours or in rapid succession may signify malicious behavior.

  - **Investigate related artifacts:** Look for any accompanying files (DLLs or other executables) loaded into memory alongside the flagged .cpl. Check API calls for `LoadLibrary` or `CreateProcess` that correspond to the .cpl’s execution.

  - **Cross-reference with threat intelligence:** Utilize threat intelligence feeds to check if the observed .cpl files have known associations with malicious activity or malware campaigns.

  - **Document any legitimate system usage:** Identify and record instances where common applications or legitimate scripts utilize the flagged .cpl files appropriately as part of system maintenance or legitimate workloads.

  ### Prioritization

  This alert should be treated with medium priority. The potential impact of exploitation may allow adversaries to gain system control, with the likelihood of it being abused by attackers being moderate. Additionally, sideloading methods are increasingly weaponized in targeted campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, specifically if Image Load events are not being generated consistently. Legitimate applications or admin scripts may trigger this alert when accessing system control panel items from uncommon locations. For improved coverage, integrating related detections like process creation and DLL loading events (e.g., Event ID 4688 and Sysmon Event ID 7) can help validate the indicators of compromise further.

