title: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
status: test
description: Detects image load events of system control panel items (.cpl) from uncommon
  or non-system locations which might be the result of sideloading.
references:
- https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
- https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
author: Anish Bogati
date: 2024-01-09
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith:
    - '\hdwwiz.cpl'         # Usually loaded by hdwwiz.exe
    - '\appwiz.cpl'         # Usually loaded by fondue.exe
  filter_main_legit_location:
    ImageLoaded|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the loading of system control panel items (with a `.cpl` extension) from uncommon or non-system directories on Windows systems. Such behavior can indicate potential sideloading of malicious code, where attackers attempt to evade detection by executing malicious code that mimics legitimate system functionality. Sideloading can occur when attackers exploit trust in native programs (such as `hdwwiz.exe` and `fondue.exe`) to run payloads hidden within seemingly benign files.

  The likely objectives of an attacker utilizing this technique include maintaining persistence, evading defenses, and executing malicious tasks that could lead to further compromise within the enterprise network. This activity is related to the MITRE ATT&CK techniques for **Defense Evasion** (T1036: Masquerading) and reflects a wider trend of abuse of system trusted executables for malicious purposes.

  Primary data sources for this rule include Windows Event Logs, specifically those related to image load events that capture when applications or libraries are executed. The detection of these events will be essential for confirming potential sideloading attempts and understanding the context of the loaded components.

  ### Investigation Steps
  - **Review Event Logs:** Investigate Windows Event Logs for image load events corresponding to the `.cpl` files detected by the rule. Pay attention to the source application to understand its legitimacy.

  - **Analyze Application Paths:** Check the paths from which the control panel items were loaded. Any instance where a `.cpl` file is loaded from directories outside the standard system directories like `C:\Windows\System32`, `C:\Windows\SysWOW64`, or `C:\Windows\WinSxS` should be treated with suspicion.

  - **Cross-reference with Known Binaries:** Cross-reference the identified executables (such as `hdwwiz.exe` and `fondue.exe`) with known-good software inventories to confirm their integrity and legitimacy.

  - **Monitor Related Processes:** Track any related processes spawned from the flagged image loads, as they could indicate further malicious activities, such as privilege escalation or lateral movement within the network.

  ### Prioritization
  This alert has medium severity, as the loading of system control panel items from uncommon locations may indicate an active attack or compromise. Given the potential for sideloading techniques to facilitate deeper infiltrations within the enterprise environment, swift investigation is crucial.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the EDR or image load event logging is not correctly configured, or if critical directories are improperly whitelisted. The detection logic assumes that .cpl files will only be executed from trusted locations; however, legitimate applications may be misconfigured or misused. For the alert to function optimally, it requires accurate logging of image load events and appropriate monitoring of process creation associated with executed binaries.

