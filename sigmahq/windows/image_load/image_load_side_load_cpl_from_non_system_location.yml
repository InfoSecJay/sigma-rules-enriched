title: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
status: test
description: |
  Detects image load events of system control panel items (.cpl) from uncommon or non-system locations that may indicate DLL sideloading or other abuse techniques.
references:
- https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
- https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
- https://github.com/mhaskar/FsquirtCPLPoC
- https://securelist.com/sidewinder-apt/114089/
author: Anish Bogati
date: 2024-01-09
modified: 2026-02-17
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith:
    - '\appwiz.cpl'         # Usually loaded by fondue.exe
    - '\bthprops.cpl'         # Usually loaded by fsquirt.exe
    - '\hdwwiz.cpl'         # Usually loaded by hdwwiz.exe
  filter_main_legit_location:
    ImageLoaded|startswith:
    - 'C:\Windows\Prefetch\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_side_load_cpl_from_non_system_location/info.yml
note: |
  ### Technical Context

  This rule detects the loading of control panel items (.cpl files) from uncommon or non-standard locations, which may indicate attempts at DLL sideloading or other malicious exploitation techniques. Attackers typically aim to leverage legitimate processes to execute rogue code, thereby escalating privileges or establishing persistence on the system. The relevant MITRE ATT&CK techniques include Persistence via Sideloading (T1574.001) and Defense Evasion.

  Primary telemetry sources required for this detection include Windows image load events, specifically tracking Event ID 1102 from the Security Event Log or Sysmon Event ID 7. If this behavior is confirmed as malicious, it poses a significant risk by potentially allowing unauthorized code execution with the privileges of a trusted system process. However, it is critical to note that this detection does NOT confirm that malicious activity has occurred exclusively; further investigation is needed to validate intent and execution context.

  ### Investigation Steps

  - **Examine the loading source: ** Check the `ImageLoaded` field for paths. Confirm if the .cpl file is being loaded from standard locations (`C:\Windows\System32\`, etc.) or uncommon locations (e.g., user profile directories, temporary files). Malicious sources may significantly deviate from expected behavior.

  - **Review associated processes: ** Investigate the parent process of the .cpl loading event via Sysmon Event ID 10 or Security Event ID 4688. Look for known benign processes such as `fondue.exe`, `fsquirt.exe`, or `hdwwiz.exe`. Any deviation may indicate a malicious context.

  - **Check for additional file activity: ** Validate file creation events in the vicinity of the alert using Sysmon Event ID 11. Unexpected file creation alongside .cpl loading may suggest an attempt to deploy malicious payloads.

  - **Identify rare .cpl files executed: ** List other recently executed .cpl files from uncommon directories. If the same non-standard directory is being used for multiple .cpl loads, it could indicate a persistence mechanism.

  - **Cross-reference alerts with threat intelligence: ** Query threat intelligence sources for known bad hashes or family indicators linked to any visible .cpl files or processes. Look for alerts associated with HTA files or known malicious Mimikatz variants.

  ### Prioritization

  This alert should be prioritized as high due to the potential for significant impact on critical systems if exploited, particularly with domain admin-level access. The likelihood of malicious abuse is substantial, given the use of common and trusted system processes for side-loading .cpl files that are typically loaded from secure system locations. This behavior is increasingly weaponized by sophisticated threat actors.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as the use of obfuscation or renaming authorized files. Accurate alerts depend on the proper configuration of Sysmon installation and log retention policies to capture detailed process and image load events. Legitimate activities like software installations or IT troubleshooting may trigger this alert. A related detection to consider is monitoring for unusual process creation events that may accompany this alert to improve coverage against coordinated attacks.

