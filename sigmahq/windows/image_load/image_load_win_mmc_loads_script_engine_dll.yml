title: MMC Loading Script Engines DLLs
id: a9c73e8b-3b2d-4c45-8ef2-5f9a9c9998ad
status: experimental
description: |
  Detects when the Microsoft Management Console (MMC) loads the DLL libraries like vbscript, jscript etc which might indicate an attempt
  to execute malicious scripts within a trusted system process for bypassing application whitelisting or defense evasion.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
- https://www.elastic.co/security-labs/grimresource
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1218.014
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\mmc.exe'
    ImageLoaded|endswith:
    - '\vbscript.dll'
    - '\jscript.dll'
    - '\jscript9.dll'
  condition: selection
falsepositives:
- Legitimate MMC operations or extensions loading these libraries
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of scripting DLLs (vbscript.dll, jscript.dll, jscript9.dll) by the Microsoft Management Console (MMC). This behavior often indicates an attacker attempting to execute malicious scripts under a trusted process, potentially for the purpose of bypassing application whitelisting or evading detection mechanisms. The relevant MITRE ATT&CK tactics are Execution (T1059.005) and Defense Evasion (T1218.014).

  Primary telemetry sources include image load events from Windows, specifically monitoring for event IDs related to process and DLL loading. The security impact if malicious could involve executing arbitrary scripts and potentially leading to system compromise. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate MMC operations can also load these DLLs under normal circumstances.

  ### Investigation Steps

  - **Check Event IDs 263 and 4688 for process creation details:** Review logs for MMC (mmc.exe) spawning processes. Validate the parent-child process relationship to ensure no irregularities in execution flow.

  - **Examine DLL load events in Sysmon:** Look for Sysmon Event ID 10 entries to correlate DLL loading activity with the specific MMC process. Confirm the presence of malicious or unexpected DLLs, focusing on timing and context of execution.

  - **Identify expected behavior of normal MMC operations:** Cross-reference with known legitimate usage patterns. Typical activity should involve specific, authorized scripts and recognized admin tasks with no unusual command-line arguments.

  - **Review syslog entries for script execution commands:** Check for any prior PowerShell or command prompt executions (Event IDs 4104, 4688) that might have invoked the DLLs, ensuring you categorize these as benign or suspicious.

  - **Assess for known malwares associated with this behavior:** Utilize threat intelligence sources to verify if the observed behavior corresponds to various attack vectors or tactics suggested by ongoing adversary frameworks.

  ### Prioritization

  This alert is of medium severity due to the potential for significant security risk if malicious code execution is confirmed. While not every occurrence indicates nefarious intent, the loading of scripting engines via MMC is a known tactic employed by sophisticated adversaries and warrants urgent investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the usage of non-standard DLLs or variations of script engines that do not match those listed in the rule. Reliable detection requires appropriate logging configurations on Windows, specifically with Sysmon and image load events properly established. Legitimate administrative functions may trigger these alerts, particularly during maintenance activities or when extensions are updated. Companion detections, like monitoring for unusual PowerShell executions, may strengthen overall coverage and decrease false positives related to this rule.

