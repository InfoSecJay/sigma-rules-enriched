title: MMC Loading Script Engines DLLs
id: a9c73e8b-3b2d-4c45-8ef2-5f9a9c9998ad
status: experimental
description: |
  Detects when the Microsoft Management Console (MMC) loads the DLL libraries like vbscript, jscript etc which might indicate an attempt
  to execute malicious scripts within a trusted system process for bypassing application whitelisting or defense evasion.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
- https://www.elastic.co/security-labs/grimresource
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.005
- attack.t1218.014
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\mmc.exe'
    ImageLoaded|endswith:
    - '\vbscript.dll'
    - '\jscript.dll'
    - '\jscript9.dll'
  condition: selection
falsepositives:
- Legitimate MMC operations or extensions loading these libraries
level: medium
note: |
  ### Technical Context
  This rule detects instances where the Microsoft Management Console (MMC) loads Dynamic Link Libraries (DLLs) such as `vbscript.dll`, `jscript.dll`, and `jscript9.dll`. The use of these libraries within a trusted application like MMC can be indicative of an attempt by an attacker to execute malicious scripts. This behavior is often associated with bypassing application controls and evading detection mechanisms in place, as attackers leverage trusted processes for executing their payloads.

  In this threat scenario, attackers may seek to deploy malicious scripts that execute commands, gather credentials, or perform lateral movements across the network. By executing scripts in the context of a trusted process, they could avoid security alerts that would typically flag suspicious operations. The relevant MITRE ATT&CK tactics include Execution (T1059.005 - Command and Scripting Interpreter: Visual Basic) and Defense Evasion (T1218.014 - Signed Script Executions).

  Key data sources for detecting this behavior include image load events from Windows, which can provide insight into loaded libraries and help analysts assess any unusual DLL calls associated with MMC.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze the logs for instances where `mmc.exe` has loaded `vbscript.dll`, `jscript.dll`, or `jscript9.dll`. Pay special attention to the context in which these libraries were loaded and any corresponding process activity.

  - **Examine Command Execution History**: Check for irregular command execution immediately following the DLL load events. Look for any execution of scripts that may have been initiated within the MMC environment, which could indicate an attempt to leverage the trusted process.

  - **Investigate User Context**: Determine the user account under which the MMC was executed. Evaluate whether this account frequently launches MMC or if there are unusual patterns surrounding the user’s activity, such as operating outside normal business hours.

  - **Correlate with Security Alerts**: Cross-reference the detection with previous security alerts, logs from endpoint detection and response tools (EDR), and any antivirus/anti-malware logs to identify if previous actions may indicate prelude to the event.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant implications if malicious scripts are executed within the MMC context. Given the privileged nature of the MMC and its task of managing various system functions, any suspicious activity warrants careful investigation.

  ### Blind Spots and Assumptions
  This detection rule may not catch cases where attackers are using different scripting engines or less common DLLs to achieve similar objectives. The detection logic assumes that the logs capturing image load events are incredibly reliable and comprehensive in monitoring process interactions within the environment. Required logs must include precise and unobstructed image load events from Windows to ensure solid coverage and efficacy of the detection rule.

