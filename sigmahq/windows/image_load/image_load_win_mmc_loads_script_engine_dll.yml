note: |
  ### Technical Context

  This Sigma rule detects the loading of specific DLL libraries (vbscript.dll, jscript.dll, jscript9.dll) by the Microsoft Management Console (MMC) process (mmc.exe). This behavior is typically associated with attempts by adversaries to execute malicious scripts using a trusted system process, which can circumvent application whitelisting and other security controls. The relevant MITRE ATT&CK tactics are Execution (T1059.005) and Defense Evasion (T1218.014).

  The primary telemetry sources for this detection are Windows image load events, specifically looking for Event ID 4104 from PowerShell logs or Sysmon Event ID 7. If the behavior is malicious, it may enable the execution of unauthorized scripts, leading to potential system compromise or data exfiltration. It's important to note that the mere detection of this behavior does not confirm malicious intent; legitimate administrative operations could trigger similar alerts.

  ### Investigation Steps

  - **Identify the process invoking the DLLs**: Check for Event ID 4688 (Process Creation) to verify which parent process initiated mmc.exe. Look for unusual parent processes that could indicate malicious behavior.

  - **Verify loaded DLLs**: Review Sysmon Event ID 7 for loaded modules when mmc.exe is running. Confirm the presence of vbscript.dll, jscript.dll, or jscript9.dll, especially in conjunction with unexpected scripts.

  - **Assess file system artifacts**: Check for recently created or modified files, particularly scripts (.vbs, .js) in C:\Windows\Temp or user directories. Legitimate use typically includes administrative script files in standard script folders.

  - **Analyze user activity**: Cross-reference user activity logs (Event ID 4624 - Logon) to determine if the user executing MMC commands has a legitimate need for their actions. Look for administrative users accessing sensitive systems during unusual hours.

  - **Consider application whitelisting policies**: Review your organization's application whitelisting configurations to determine if they allow the execution of these scripts and the loading of these DLLs from MMC, which can signify a loophole.

  - **Check for known indicators of compromise**: Investigate if any additional TTPs (Tactics, Techniques, and Procedures) associated with known malicious actors are present, such as unusual network traffic patterns or communication with known malicious IPs.

  ### Prioritization

  The alert has medium severity due to the potential for malicious abuse through trusted system processes. Although this behavior can be exploited by adversaries, it is also common in legitimate system administration, increasing the need for additional context before determining threat status.

  ### Blind Spots and Assumptions

  Detection limitations may include benign use cases of MMC, as system administrators frequently use it to load scripts for management tasks. Ensure logging for all related DLL calls is enabled to increase detection reliability. This alert could be triggered by legitimate system updates or third-party applications that require similar functionality. Related detections, like monitoring for the creation of script files or abnormal PowerShell activity, can provide additional context and strengthen overall monitoring capabilities.

