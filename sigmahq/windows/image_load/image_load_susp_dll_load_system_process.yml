note: |
  ### Technical Context

  This rule detects when a system process, such as those in the Windows system directories (C:\Windows\ and C:\Windows\SysWOW64\), loads a Dynamic Link Library (DLL) file from potentially suspicious or permissive locations, including common user directories like C:\Users\Public\. The likely attacker objective is to bypass security controls and execute malicious code by leveraging trusted system processes to disguise their actions.

  The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically the technique of "File and Directory Permissions Modification" (T1045), as well as "Stealthy Execution" (T1070). The primary telemetry source is Windows image load logs that capture details about DLL loads, specifically targeting events where system-level processes load libraries from non-standard or insecure paths. If this behavior is malicious, it can lead to system compromise, unauthorized access, or lateral movement within the network. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also load DLLs from these paths.

  ### Investigation Steps

  - **Check the loading process: **Investigate the process that loaded the DLL by correlating the Event ID modules—look for Event ID 4688 (process creation). Ensure that the loaded DLL is not an expected part of the system or application.

  - **Identify suspicious DLLs: **Examine the loaded DLL's path and permissions. DLLs from "C:\Users\Public\" or "C:\PerfLogs\" with full control for "Everyone" are generally suspicious. Malicious indicators include anomalous file signatures or unknown publishers.

  - **Review legitimate behaviors: **Verify documented and expected application behaviors to see if legitimate applications routinely use DLLs from the paths triggering this alert. Common applications should not exhibit this behavior.

  - **Analyze process parentage: **Review parent process information in the logs for context regarding how the suspicious DLL was invoked. Use Sysmon Event ID 1 for additional clarity on parent-child relationships. Legitimate processes typically have expected parent processes (e.g., explorer.exe).

  - **Confirm long-term file activity: **Check the Windows Security Event ID 4663 for file access attempts to determine if there were multiple loads or attempts to interact with the suspicious DLL, indicating potential exploitation attempts.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical system processes being compromised, which can lead to broader network vulnerabilities. The likelihood of malicious exploitation is moderate, as adversaries frequently utilize such techniques to hide their activities. This behavior has been seen in real-world attacks, making it a noteworthy alert for SOC analysts.

  ### Blind Spots and Assumptions

  Detection limitations may arise from certain legitimate applications loading DLLs from common paths, leading to false positives. It’s critical to have comprehensive logging for image loads and specifically monitor for security settings in the Windows file system that may allow these manipulations. Related detection strategies involve monitoring for anomalous process creations alongside filesystem access patterns to strengthen coverage against this behavior.

