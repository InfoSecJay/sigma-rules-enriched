  ---

  ### Technical Context

  This rule detects when a Windows system process loads a Dynamic Link Library (DLL) from non-standard, potentially insecure directories, such as "C:\Users\Public" or "C:\PerfLogs". The likely objective of this behavior is to execute malicious code or perform actions that evade detection, leveraging the trust typically afforded to system processes. This aligns with the MITRE ATT&CK technique for Defense Evasion: **T1070 - Indicator Removal on Host**.

  The primary telemetry source is Windows Image Load events, specifically monitoring paths from which DLLs are loaded. If malicious, this activity can indicate an attempt by an adversary to manipulate system processes for persistence or privilege escalation. Importantly, this detection alone does not confirm malicious activity; further investigation is necessary to establish intent and context.

  ---

  ### Investigation Steps

  - **Identify the process loading the DLL:**
    Review Security Event ID 4688 or Sysmon Event ID 1 to identify the parent process initiating the DLL load. Examine the process name and path to ascertain if it is a legitimate system binary.

  - **Check the DLL source path for permissions:**
    Inspect the file system permissions of the DLL loaded from "C:\Users\Public" or "C:\PerfLogs" using `Get-Acl` in PowerShell. Malicious indicators include overly permissive access (e.g., "Everyone" with "Write" permission).

  - **Correlate timestamps and source activity:**
    Cross-reference the event timestamps with recent user activity logs. Legitimate applications may load DLLs from these locations (e.g., software updates or user-installed applications), while unexpected loads should raise suspicion.

  - **Analyze DLL contents for known malware signatures:**
    Use antivirus or threat detection solutions to analyze the DLL file. High-confidence malicious indicators include hashes matching known malware signatures or the presence of suspicious API calls.

  - **Review behavior of parent process:**
    Assess any anomalous behavior of the parent process, such as network connections or further file modifications. Look for Sysmon Event ID 3 (Network Connection) logs that correlate with DLL loading events.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential for high impact on compromised systems. The likelihood of malicious behavior is moderate, as attackers often utilize similar tactics to embed malicious code or evade detection. The behavior detected is not uncommon in adversary techniques, emphasizing the need for timely investigation.

  ---

  ### Blind Spots and Assumptions

  Limitations in detection may arise due to potential evasion techniques, such as attackers mimicking legitimate file paths or using acceptable file permission settings. Reliable detection requires ensuring all relevant log sources, particularly Sysmon, are properly configured to capture image load events. Legitimate installations or configurations could trigger this alert, such as authorized programs loading necessary DLLs. Companion detections worth considering include monitoring for unusual API calls within loaded DLLs, enhancing contextual understanding of the detected behavior.

