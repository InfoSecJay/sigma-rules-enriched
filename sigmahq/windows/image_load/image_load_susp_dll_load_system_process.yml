logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|startswith: 'C:\Windows\'
    ImageLoaded|startswith:
            # TODO: Add more suspicious paths as you see fit in your env
    - 'C:\Users\Public\'
    - 'C:\PerfLogs\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the loading of Dynamic Link Libraries (DLLs) by system processes from suspicious locations, particularly areas with less restrictive permissions such as "C:\Users\Public". Attackers often leverage DLL hijacking or loading techniques to execute malicious code within the context of trusted system processes, which can facilitate actions like privilege escalation or lateral movement in the network. By using DLLs from unconventional locations, threat actors can bypass security mechanisms that typically monitor or restrict code execution from more controlled directories.

  Relevant MITRE ATT&CK tactics include Defense Evasion (T1070), as attackers may aim to conceal their activity by utilizing system processes to execute malware. Additionally, this behavior can be associated with technique T1107 (File and Directory Permissions Modification) when the permissions of suspicious directories are tampered with to facilitate easier code execution. Primary data sources for detecting this behavior include image load logs specific to Windows, which capture process interactions with files on the system.

  ### Investigation Steps
  - **Review Image Load Logs**: Investigate the logs for any instances where system processes load DLLs from "C:\Users\Public" or other non-standard directories. Pay attention to the names and known legitimacy of the DLLs involved.

  - **Analyze Process Creation Events**: Examine the associated process creation events for the system process that loaded the DLL. Determine the command line parameters, parent processes, and any suspicious activity leading up to the event.

  - **Check Permissions of Suspicious Locations**: Assess the permissions on directories such as "C:\Users\Public" and "C:\PerfLogs". Look for any unusual modifications that could indicate an attacker is manipulating access rights to execute malicious code.

  - **Correlate with Additional Threat Intelligence**: Utilize threat intelligence sources to identify any known indicators of compromise (IOCs) related to the detected DLLs or system processes. Check if there are any historical data points tied to the behavior in the environment.

  ### Prioritization
  This alert should be considered medium severity due to its potential implications for system security. The likelihood of exploitative behavior increases when system processes load from less secure locations, posing a risk of privilege escalation and further lateral movement within the network.

  ### Blind Spots and Assumptions
  There may be gaps in detecting variants of suspicious DLL loading techniques that do not fit the specified paths in the detection logic. The rule assumes that logs specific to image load events are enabled and that system processes are closely monitored for DLL interaction. Additionally, there is reliance on the integrity of the permissions set within the observed folders, which can be manipulated by advanced threat actors. Proper configurations and comprehensive logging must be ensured for effective detection and response capabilities.

