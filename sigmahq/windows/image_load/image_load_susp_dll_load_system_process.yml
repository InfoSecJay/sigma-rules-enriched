note: |
  ### Technical Context

  This Sigma rule detects when a system process, typically located in system directories such as C:\Windows\, loads a Dynamic Link Library (DLL) from a potentially insecure or suspicious location like C:\Users\Public\. This behavior is often leveraged by attackers to inject malicious code into trusted processes, circumventing security measures. The likely attacker objective could be privilege escalation or executing malware in the context of a legitimate process. The relevant MITRE ATT&CK tactics are Defense Evasion (TA0005) and Path Interception (T1070).

  The primary telemetry source is Windows image load events, specifically the Event ID  loaded from non-standard directories. If detected, this behavior could indicate an attempted exploit or compromise, impacting system integrity and confidentiality. It is crucial to note that this detection alone does not confirm malicious activity; benign applications may also load DLLs from similar paths depending on usage context.

  ### Investigation Steps

  - **Check the loading process:** Validate the process name and its path to determine if it is a legitimate Windows process (e.g., svchost.exe, lsass.exe) using Event ID 4688 for process creation alongside Sysmon Event ID 1 for image load.

  - **Inspect loaded DLL paths:** Review the parent process for the DLL load event and confirm if it is originating from a trusted directory. Focus on the `ImageLoaded` field for suspicious paths, specifically those loaded from C:\Users\Public\ or C:\PerfLogs\.

  - **Identify high-confidence malicious indicators:** Look for known malicious DLL names or hashes associated with previous incidents in the environment. Cross-reference with threat intelligence tools to validate against known malware signatures.

  - **Evaluate past activity:** Check historical logs (Event ID 4688 and Sysmon) for any previous occurrences of similar behavior from the same process or user account, indicating a pattern of potentially malicious activity.

  - **Verify legitimate usage patterns:** Assess if similar DLLs were expected to load at that process through your application’s standard operation. Review related documentation or asset inventories for business justification.

  ### Prioritization

  This alert has a medium severity. The loading of DLLs from untrusted locations by critical system processes poses a significant risk of compromise. While this behavior is indicative of potential malicious activity, its likelihood of abuse in a real-world scenario varies based on environment-specific risk factors.

  ### Blind Spots and Assumptions

  Detection may miss advanced evasion techniques if attackers use legitimate DLLs from trusted locations or disguise malicious DLLs with similar names. Reliable detection requires logs from Sysmon for image loads alongside Windows Security logs (Event ID 4688). Legitimate applications may load DLLs from user directories for valid reasons, necessitating context for incident triage. A related detection to consider is monitoring for unusual process behavior, such as unexpected network activity from the same processes.

