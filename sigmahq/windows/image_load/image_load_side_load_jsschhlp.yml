note: |
  ### Technical Context

  The Sigma rule detects potential DLL sideloading, specifically when an image loaded from the common Justsystems path attempts to load `JSESPR.dll`. This behavior may indicate an attacker trying to leverage a legitimate process to execute malicious code, as DLL sideloading is often used to bypass application whitelisting and execute payloads under the guise of a trusted application. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), with technique **DLL Search Order Hijacking** (T1574.001). Primary telemetry sources include Windows Event IDs associated with image loading, specifically image load events that show unexpected DLLs being called by trusted processes. If the activity is confirmed malicious, it could lead to privilege escalation or persistence on the compromised system.

  This detection does NOT confirm outright that malicious activity is occurring; legitimate applications could be loaded with the same DLLs under benign circumstances.

  ### Investigation Steps

  - **Verify image load events**: Check Windows Event ID iert to identify the process attempting to load `JSESPR.dll` and verify the parent process. Ensure that it does not originate from an unusual location.

  - **Review process execution history**: Analyze Sysmon Event ID 1 for the process loading the DLL to confirm the command line used and ensure it aligns with expected behavior for the application.

  - **Cross-reference application legitimacy**: Validate the existence and intended behavior of `JsSchHlp` as a component of the Justsystems application. Confirm it was recently updated and matches expected checksum values.

  - **Investigate other loaded DLLs**: Look for other unusual or unexpected DLLs being loaded by the same process, specifically those not commonly associated with `JsSchHlp`, as this could indicate malicious tampering.

  - **Monitor file system changes**: Check for any new or modified files within `C:\Program Files\Common Files\Justsystem\JsSchHlp\` around the time of the alert, particularly focusing on newly created files or changes to existing DLLs.

  - **Understand legitimate user behavior**: Identify if there are known business processes requiring the use of `JsSchHlp`. Document how these processes work in your environment to differentiate between benign and suspicious activity.

  ### Prioritization

  This alert should be treated with medium urgency due to potential exposure within sensitive environments. The affected system may hold critical data or function as a gateway for subsequent intrusion if exploited. The likelihood of this technique being weaponized is moderate, particularly in targeted attacks aimed at obfuscating malicious activity.

  ### Blind Spots and Assumptions

  There are detection limitations such as attackers using obfuscation techniques that may bypass standard monitoring. The use of non-standard logging configurations could hinder the capture of relevant image load events needed for effective detection. Legitimate software or misconfiguration of Justsystems may trigger this alert unintentionally. A companion detection to consider is monitoring other known malicious DLLs being loaded to strengthen overall coverage against similar evasion techniques.

