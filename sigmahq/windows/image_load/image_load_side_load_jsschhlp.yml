  ### Technical Context

  This Sigma rule detects potential DLL sideloading via the JustSystems Japanese word processor, specifically looking for instances where a DLL named `JSESPR.dll` is loaded from an unexpected path. This behavior is often indicative of an attacker’s intent to execute malicious code by exploiting a legitimate application to load a malicious DLL, thereby maintaining persistence and executing unauthorized actions while camouflaged as legitimate software.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **DLL Search Order Hijacking** (T1574.001). Primary telemetry sources include image load logs specifically related to Windows systems, where `ImageLoaded` events are monitored to detect anomalies in the loading of DLL files. If malicious, this action can lead to privilege escalation, unauthorized access, and further compromise of the system and network. Notably, this detection does NOT confirm actual exploitation or malicious intent without further context and supporting evidence.

  ### Investigation Steps

  - **Identify the process loading the DLL:** Examine `Windows Security Event ID 4688` and `Sysmon Event ID 1` to find which process is triggering the loading of `JSESPR.dll`. Look for processes executed from the JustSystems installation directory; legitimate processes would commonly be `JsSchHlp.exe` or its child processes.

  - **Validate DLL origin and hash:** Review the path and hash value of `JSESPR.dll` using file system logs (`FileSystem Access Audit Logs` or `Sysmon Event ID 10`). Compare hashes against known good and pivot to public repositories like VirusTotal. A hash mismatch indicates potential malicious activity.

  - **Check for contextual anomalies:** Analyze network communications associated with the process using network logs (`Firewall logs` or `Windows Event ID 5156`) to identify suspicious outbound connections. Legitimate usage would typically connect to known JustSystems services, while any unusual or encrypted traffic could signify compromise.

  - **Monitor for abnormal execution patterns:** Look for signs of execution outside normal operation by reviewing application logs or behavior (e.g., frequent access to `JSSEPR.dll`). A high frequency of loads or access times outside expected operational windows can indicate misuse.

  - **Explore logon history and user details:** Investigate user access patterns to determine if the account associated with loading the DLL shows abnormal behavior using `Windows Security Event ID 4624`. If a high-privilege account triggers the alert, it should be treated with heightened scrutiny.

  ### Prioritization

  This alert has medium severity due to the risk posed by potential DLL sideloading, which can lead to persistence and deeper system compromise if exploited. The likelihood of malicious abuse remains moderate as similar techniques are frequently weaponized by adversaries to subvert sign-on processes and elevate privileges without detection.

  ### Blind Spots and Assumptions

  Detection limitations include the variability of DLL path configurations and the possibility of legitimate applications triggering the alert unintentionally. Required log sources must include complete image load telemetry and application-specific logs to provide context. Legitimate use cases may involve needed software updates or maintenance activity that accesses DLLs under the JustSystems path. A related detection to enhance coverage would be monitoring for unusual file modifications in the JustSystems directories, adding another layer of context to potential modifications.

