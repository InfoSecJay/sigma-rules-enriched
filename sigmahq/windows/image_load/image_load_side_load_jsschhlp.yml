  ### Technical Context

  This Sigma rule detects potential DLL sideloading behavior associated with the `JsSchHlp.exe` process from the JUSTSYSTEMS Japanese word processor. The likely objective of an attacker using this technique is to execute malicious code by leveraging a legitimate binary to load a malicious DLL, thereby bypassing security mechanisms. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (T1574) and the technique of DLL Search Order Hijacking (T1574.001).

  The primary telemetry sources include Windows image load events, specifically targeting `ImageLoaded` log types to identify when DLLs are loaded by processes. If malicious, this behavior can lead to unauthorized execution of code and persistence on the affected system. It is important to note that this detection alone does not confirm malicious intent; it requires context and further investigation into the loaded DLL and the invoking process.

  ---

  ### Investigation Steps

  - **Check loaded DLLs: ** Investigate loading of `JSESPR.dll`: Review Windows Event ID 4104 logs for any instances where `JSESPR.dll` is loaded by `JsSchHlp.exe`. Document the timestamps and any execution context around these events.

  - **Analyze process parents: ** Inspect the parent process hierarchy: Utilize Process Explorer or Sysinternals tools to confirm the parent process of `JsSchHlp.exe`. Legitimate instances should be initiated by known applications such as the Justsystems word processor.

  - **Review file integrity: ** Validate the integrity of `JSESPR.dll`: Cross-check the file hash of `JSESPR.dll` against known good signatures using tools like VirusTotal or internal whitelists. Any mismatches may indicate malicious tampering.

  - **Identify abnormal behavior: ** Search for abnormal runtime behaviors: Use Sysmon logs (Event ID 1) to assess whether `JsSchHlp.exe` exhibits unusual behavior, such as unexpected network connections or file writes to sensitive locations.

  - **Assess system role and criticality: ** Determine the asset's role: Review the criticality of the impacted system. If it is a server or handles sensitive information, escalate the investigation due to higher risks.

  - **Correlate with previous alerts: ** Check for related alerts: Look for past alerts linked to DLL sideloading or suspicious behavior from `JsSchHlp.exe`. This correlational data can provide context into ongoing or repeated attack attempts.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of executing malicious code within a legitimate process. While DLL sideloading techniques are increasingly exploited, it remains less commonly seen relative to other methods of code execution, necessitating careful review by analysts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for all DLL loads if the required telemetry is not enabled. Attackers may attempt to evade detection by using legitimate software paths or by exploiting different binaries. Legitimate use cases include typical operations of the Justsystems word processor, which may inadvertently trigger the alert. Companion detections for process manipulation (such as process injection or code execution) could enhance coverage and alert response.

