title: Potential AVKkid.DLL Sideloading
id: 952ed57c-8f99-453d-aee0-53a49c22f95d
status: test
description: Detects potential DLL sideloading of "AVKkid.dll"
references:
- https://research.checkpoint.com/2023/beyond-the-horizon-traveling-the-world-on-camaro-dragons-usb-flash-drives/
author: X__Junior (Nextron Systems)
date: 2023-08-03
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\AVKkid.dll'
  filter_main_legit_path:
    Image|contains:
    - 'C:\Program Files (x86)\G DATA\'
    - 'C:\Program Files\G DATA\'
    Image|endswith: '\AVKKid.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\G DATA\'
    - 'C:\Program Files\G DATA\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential sideloading of the "AVKkid.dll" library, which may indicate malicious activity leveraging legitimate software environments. Specifically, attackers may use DLL sideloading techniques to exploit the normal loading process of applications like G DATA software, inserting their malicious DLL into the process. The likely objectives of an attacker utilizing this method include persistence on the system, evasion of defenses, and potential privilege escalation by executing malicious code within the context of a trusted application.

  The relevant MITRE ATT&CK tactics associated with this activity include **Persistence** (T1546), **Defense Evasion** (T1562), and **Privilege Escalation** (T1068). Each of these techniques outlines methods through which adversaries maintain presence in a system, evade detection, and elevate their access rights, thus reinforcing the critical nature of monitoring for such activities.

  Primary data sources that may provide evidence of DLL sideloading include **Image Load events**, which report on all dynamically loaded libraries in a Windows environment—especially useful for identifying anomalies surrounding DLLs loaded by legitimate processes.

  ### Investigation Steps
  - **Review DLL Load Events:** Analyze image load events that capture instances where "AVKkid.dll" is loaded, specifically looking for unusual timestamps or out-of-place user accounts initiating these loads.
  - **Examine Parent Process Relations:** Investigate the parent processes for any suspicious activity. Validate whether "AVKKid.exe," the legitimate executable, is indeed the parent of the image load events and verify its directory path.
  - **Look for Anomalous Process Command Lines:** Check command line arguments associated with the parent processes, focusing on unfamiliar or obfuscated parameters that may indicate evasion techniques commonly used in DLL sideloading attacks.
  - **Correlate with Application Logs:** Access logs from the G DATA application to validate whether its behavior aligns with the detected DLL activity, ensuring no legitimate updates or patches are incorrectly flagged.

  ### Prioritization
  This alert holds medium severity due to the potential risks involved with DLL sideloading, which could enable attackers to gain significant footholds on targeted systems, especially if the application involved is widely used within the enterprise.

  ### Blind Spots and Assumptions
  This detection logic may have coverage gaps if the targeted software or its pathways are misconfigured or if logging for image load events is not enabled. It assumes that instances of "AVKkid.dll" should only come from the defined G DATA directories; thus, deviations from these established paths raise suspicion. Furthermore, sufficient logging configurations must be in place to capture image load events accurately to trigger this alert effectively.

