logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\RjvPlatform.dll'
    Image: '\SystemResetPlatform.exe'
  filter_main_legit_path:
    Image|startswith: 'C:\Windows\System32\SystemResetPlatform\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects potential DLL sideloading of "RjvPlatform.dll" by "SystemResetPlatform.exe" when executed from a non-default location that does not match typical Windows paths. The behavior indicates an attempt to execute malicious code by leveraging a legitimate binary to sideload a potentially harmful DLL. The likely attacker objective is to establish persistence or escalate privileges while using a trusted application to circumvent security controls. Relevant MITRE ATT&CK tactic is Persistence, with technique ID T1574.001 (DLL Search Order Hijacking).

  Primary telemetry source includes Windows image load logs and process creation events, specifically monitoring for Event ID 4688 (process creation) and image load events for DLLs. If the behavior is malicious, there is a significant risk of unauthorized access, data exfiltration, or lateral movement within the environment. However, this detection does NOT confirm that the DLL is indeed malicious on its own; further context is needed.

  ### Investigation Steps

  - **Identify the Process Creation Event:** Check Security Event ID 4688 for the creation of "SystemResetPlatform.exe." Review fields such as `ProcessId`, `ParentProcessId`, and `CommandLine` for suspicious arguments or non-standard behavior.

  - **Examine Image Load Events:** Analyze image load logs for any instances of "RjvPlatform.dll" being loaded. Confirm the `Image` field corresponds to "SystemResetPlatform.exe" and verify the file path is not within the legitimate `C:\Windows\System32\SystemResetPlatform\` directory.

  - **Correlate with File Locations:** Verify the file location from which "RjvPlatform.dll" is loaded. If found outside the expected directory, such as user or temporary directories, mark it as suspicious and gather additional contextual information.

  - **Review Recent Changes and Context:** Check for any recent changes to "SystemResetPlatform.exe," including modifications or updates. If it coincides with any known security updates or installations, note this as potential benign context.

  - **Compare Against Known Good Samples:** Validate the checksum of "RjvPlatform.dll" against known good versions, if available. Any discrepancies may indicate tampering or potential malicious intent.

  - **Observe System Behavior:** Review recent system logs and application behavior for any unusual activities correlated with the execution of "SystemResetPlatform.exe," such as network connections or modifications to sensitive files.

  ### Prioritization

  This alert carries high severity due to the potential impact of compromise on the affected system, particularly if it serves a critical role in the enterprise environment. The likelihood of malicious abuse is elevated, as DLL sideloading is a common tactic used by adversaries to maintain persistence or escalate privileges. The behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of adequate image load logging or potential evasion through file path alteration. It assumes that "SystemResetPlatform.exe" is only operating within its designated directory and that deviations are abnormal. Legitimate software updates or administrative actions could also trigger this alert. A related detection could be monitoring for abnormal parent-child process relationships, providing additional context around process spawning behavior.

