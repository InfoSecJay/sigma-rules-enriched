title: Potential RjvPlatform.DLL Sideloading From Non-Default Location
id: 0e0bc253-07ed-43f1-816d-e1b220fe8971
status: test
description: Detects potential DLL sideloading of "RjvPlatform.dll" by "SystemResetPlatform.exe"
  located in a non-default location.
references:
- https://twitter.com/0gtweet/status/1666716511988330499
author: X__Junior (Nextron Systems)
date: 2023-06-09
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\RjvPlatform.dll'
    Image: '\SystemResetPlatform.exe'
  filter_main_legit_path:
    Image|startswith: 'C:\Windows\System32\SystemResetPlatform\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential malicious DLL sideloading of "RjvPlatform.dll" executed by "SystemResetPlatform.exe" when it is loaded from a non-standard directory. The sideloading technique typically allows attackers to execute malicious code by masquerading as legitimate system processes, aimed at enhancing persistence or evading defenses. By placing a malicious DLL in a non-default location, attackers can bypass traditional security measures, leading to privilege escalation or further infiltration into the system.

  The corresponding MITRE ATT&CK techniques included are:
  - **T1574.001: DLL Side-Loading** - This technique involves placing a malicious DLL in a location that is loaded by a legitimate executable.
  - Associated tactics include **Persistence**, **Defense Evasion**, and **Privilege Escalation**.

  Primary data sources that provide useful evidence for this detection include image load logs from Windows systems, focusing on changes to system file execution paths and identification of unexpected DLLs being loaded by legitimate processes.

  ### Investigation Steps
  - **Review Image Load Logs:** Analyze Windows Image Load logs to confirm the loading of "RjvPlatform.dll" by "SystemResetPlatform.exe" and verify the path from which it is being executed.
  - **Correlate Process Creation Events:** Investigate process creation events for "SystemResetPlatform.exe" to identify its execution context and the parent processes, especially around the time of the detection.
  - **Validate File Paths:** Check for the presence of "RjvPlatform.dll" in non-standard directories. Any unrecognized paths should be treated with suspicion, and further inspection of the associated files is advised.
  - **Assess Registry Changes:** Look for unusual registry manipulations that correspond to the execution of "SystemResetPlatform.exe," as attackers may modify registry keys to achieve persistence without detection.

  ### Prioritization
  This alert is considered high severity due to the potential for unauthorized privilege escalation and persistence on enterprise systems. DLL sideloading is often leveraged in sophisticated attacks, and its identification warrants immediate investigation to prevent a potential breach.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where the logging of image load events may be misconfigured or not enabled, leading to incomplete visibility of the sideloading activities. Additionally, the detection logic assumes that "SystemResetPlatform.exe" should only be executed from a default location, which may not always hold true in customized or legacy systems. Proper configuration of Windows logging and monitoring of image load activities is essential for this alert to function effectively.

