logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\RjvPlatform.dll'
    Image: '\SystemResetPlatform.exe'
  filter_main_legit_path:
    Image|startswith: 'C:\Windows\System32\SystemResetPlatform\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects potential DLL sideloading activity involving "RjvPlatform.dll," loaded by "SystemResetPlatform.exe" from a non-default path. Attackers may aim to deploy malicious code under the guise of legitimate system processes, facilitating persistence while evading detection. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique of **Sideloading of DLLs** (T1574.001). The primary telemetry source includes Windows image load events, specifically tracking processes that load DLLs outside their expected paths.

  If confirmed malicious, such activity could grant attackers elevated privileges and a foothold within the system, potentially compromising sensitive data. Importantly, this detection does not confirm malicious intent by itself, as it may also capture benign processes that use non-standard paths.

  ### Investigation Steps

  - **Verify the process path:** Check if "SystemResetPlatform.exe" is running from an unexpected location using Windows Security Event ID 4688. Look for paths not starting with "C:\Windows\System32\".

  - **Check for DLL loading:** Examine logs for Event ID 46528 (Windows DLL loaded) for entries specifically related to "RjvPlatform.dll" and note the loading process.

  - **Identify related activities:** Investigate any recent changes in system configurations related to this process, such as execution via a scheduled task or changes in Group Policy (Event ID 4704).

  - **Assess the legitimacy of "RjvPlatform.dll":** Cross-reference hashes or file properties of “RjvPlatform.dll” against known malware repositories (e.g., VirusTotal) to determine legitimacy.

  - **Monitor for further persistence techniques:** Review other processes that may exhibit similar sideloading behaviors, utilizing Sysmon Event ID 6 for process access.

  - **Consider user behavior:** Validate access logs to confirm whether the user or service account running "SystemResetPlatform.exe" is expected and has a legitimate reason for executing from that path.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on enterprise systems. The loading of a DLL from a non-default path indicates possible exploitation or malicious persistence techniques. While not all occurrences of sideloading are malicious, the current trend shows an increase in weaponization of such techniques, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate applications sideloading DLLs for purpose-specific functionality, which could trigger false positives. Reliable detection requires monitoring of file path integrity, pointing to the necessity of comprehensive image load event logging. Legitimate software installations and updates may also trigger similar alerts, complicating triage efforts. A related detection of "Process Injection" (T1055) can strengthen monitoring capabilities across the environment, capturing other potential exploit paths.

