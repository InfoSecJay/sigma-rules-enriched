title: Potential Chrome Frame Helper DLL Sideloading
id: 72ca7c75-bf85-45cd-aca7-255d360e423c
status: test
description: Detects potential DLL sideloading of "chrome_frame_helper.dll"
references:
- https://hijacklibs.net/entries/3rd_party/google/chrome_frame_helper.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2023-05-15
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\chrome_frame_helper.dll'
  filter_main_path:
    ImageLoaded|startswith:
    - 'C:\Program Files\Google\Chrome\Application\'
    - 'C:\Program Files (x86)\Google\Chrome\Application\'
  filter_optional_user_path:
    ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects attempts to load the "chrome_frame_helper.dll" from locations that are not legitimate, indicating potential DLL sideloading, a technique commonly used by attackers to execute malicious code. The likely attacker objective is to gain persistence and escalate privileges by injecting malicious code into legitimate application processes. This behavior correlates with the MITRE ATT&CK tactic of **Persistence** (T1547) and specifically technique **DLL Search Order Hijacking** (T1574.001).

  The primary telemetry sources include image load events from Windows, specifically focusing on the paths through which "chrome_frame_helper.dll" is loaded. If the DLL is loaded from any unauthorized directory, it can signify a compromise. A malicious event could give an attacker a foothold in the environment, leading to further exploitation. It is important to note that this detection does NOT confirm that a successful compromise has occurred on its own; it only indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review event logs for suspicious DLL loads:** Check Windows Event ID 4104 (PowerShell), Event ID 4688 (Process Creation), and Sysmon Event ID 7 (Image loaded) for references to "chrome_frame_helper.dll" and log file paths. Look for baselines in legitimate processes that load this DLL as a comparison point.

  - **Validate loaded image paths:** Investigate the paths from which "chrome_frame_helper.dll" is being loaded. If found under `C:\Program Files\Google\Chrome\Application\` or similar trusted directories, the event may be benign; otherwise, it may require deeper investigation.

  - **Check for known malicious indicators:** Look for high-confidence malicious indicators such as a recently modified timestamp or unusual parent processes in the Event ID 4688 logs that initiated the loading of this DLL.

  - **Investigate user context:** Determine the user and their role associated with the process loading the DLL. For example, if a standard user account initiates a process that loads "chrome_frame_helper.dll" from an unexpected directory, this raises suspicion.

  - **Document any associated artifacts:** Check for other potentially malicious downloaded files in the user's temporary or application data folders, including logs or data indicating unauthorized downloads or file executions during the timeframe around the alert.

  - **Compare against baseline legitimate behavior:** Reference legitimate instances of "chrome_frame_helper.dll" loading in your environment to establish a baseline. Review for expected behavior related to Chrome updates or system interactions.

  ### Prioritization

  This alert has medium severity due to the potential impact on system integrity if the malicious DLL is successfully executed. The likelihood of abuse is moderate, as DLL sideloading is a known technique utilized in various cyber attacks. This behavior can be commonly weaponized, particularly in targeted phishing or malware distribution campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the adversary's ability to obfuscate DLL paths or by their use of alternative file names. Ensuring comprehensive logging for user activities, including application path access, is vital for reliable detection. Legitimate applications, such as software updates or user actions related to Chrome extensions, may trigger this alert inadvertently. Companion detections such as process injection or unusual network requests should be in place to bolster monitoring and context around the initial alert.

