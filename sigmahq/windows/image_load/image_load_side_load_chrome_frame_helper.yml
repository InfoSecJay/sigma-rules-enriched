title: Potential Chrome Frame Helper DLL Sideloading
id: 72ca7c75-bf85-45cd-aca7-255d360e423c
status: test
description: Detects potential DLL sideloading of "chrome_frame_helper.dll"
references:
- https://hijacklibs.net/entries/3rd_party/google/chrome_frame_helper.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
date: 2022-08-17
modified: 2023-05-15
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\chrome_frame_helper.dll'
  filter_main_path:
    ImageLoaded|startswith:
    - 'C:\Program Files\Google\Chrome\Application\'
    - 'C:\Program Files (x86)\Google\Chrome\Application\'
  filter_optional_user_path:
    ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading involving the "chrome_frame_helper.dll" file. DLL sideloading occurs when an attacker places a malicious DLL in a directory that the target application accesses, leading to the execution of the malicious code when the application runs. The primary objective behind this technique usually includes the installation of malware, establishing persistence, or escalating privileges within the compromised system.

  The relevant MITRE ATT&CK tactics and techniques this rule targets are primarily related to Defense Evasion (T1203), Persistence (T1574.001), and Privilege Escalation (T1068). Attackers may attempt to exploit trusted applications like Google Chrome and execute malicious code under the guise of legitimate processes to avoid detection. The relevant telemetry sources for this detection include image load events on Windows systems, which document when DLLs are loaded by applications, serving as crucial evidence of potentially malicious actions.

  ### Investigation Steps
  - **Review Image Load Events:** Analyze recent image load events to identify any instances where "chrome_frame_helper.dll" has been loaded outside of the standard application directories. Pay particular attention to any occurrences in user profile paths, like AppData, that deviate from typical operational norms.

  - **Correlate with Installed Applications:** Verify if the version of Chrome installed aligns with legitimate updates. Inconsistencies may indicate tampering. Investigate if unusual or unexpected applications are co-existing in the directory paths, which could suggest they are being used to execute the malicious DLL.

  - **Examine Process Creation Logs:** Check for any suspicious process creation events that correlate with the loading of the DLL, particularly those initiated from the Chrome application directory. Look for unusual parent-child process relationships that may indicate malicious activity.

  - **Conduct a System Scan for Malicious DLLs:** Utilize endpoint detection and response (EDR) tools or antivirus software to perform a scan for known malicious DLL files. Ensure to inspect for any unauthorized or suspicious files associated with Google Chrome installations.

  ### Prioritization
  The alert's medium severity rating reflects a moderate likelihood of the threat being active within the environment. The potential for compromised systems underlines the importance of timely investigation, as successful DLL sideloading could lead to further exploitation or data breaches.

  ### Blind Spots and Assumptions
  This detection may not capture sideloading attempts if attackers use different DLLs or executable names, or if they leverage other legitimate applications similarly. The effectiveness of this detection assumes that the logging configuration for image load events is correctly enabled on monitored endpoints. If logs are not retained properly, or if there are gaps in monitoring certain directories, the evidence may be insufficient to verify or address these threats effectively.

