title: Potential Chrome Frame Helper DLL Sideloading
id: 72ca7c75-bf85-45cd-aca7-255d360e423c
status: test
description: Detects potential DLL sideloading of "chrome_frame_helper.dll"
references:
- https://hijacklibs.net/entries/3rd_party/google/chrome_frame_helper.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2023-05-15
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\chrome_frame_helper.dll'
  filter_main_path:
    ImageLoaded|startswith:
    - 'C:\Program Files\Google\Chrome\Application\'
    - 'C:\Program Files (x86)\Google\Chrome\Application\'
  filter_optional_user_path:
    ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading of the `chrome_frame_helper.dll` file, which could indicate an attempt to load malicious code under the guise of a legitimate Chrome component. An adversary may aim to maintain persistence on a system by using this tactic to execute arbitrary code without raising suspicion. This behavior fits within the MITRE ATT&CK tactic for Defense Evasion and the technique of DLL sideloading (T1574.001). The primary telemetry source used is Windows event logging related to image loads, particularly from ImageLoad events. If malicious, this can lead to unauthorized code execution and possible system compromise. Notably, this detection does NOT confirm that malicious activity has occurred on its own; further investigation is required to validate intent and impact.

  ### Investigation Steps

  - **Validate image load event:** Examine Windows Event ID 4657 and Sysmon Event ID 7 for instances of `chrome_frame_helper.dll` being loaded from unusual paths (e.g., non-standard application directories). Legitimate loads typically occur from `C:\Program Files\Google\Chrome\Application\` or its corresponding program files.

  - **Check for file integrity:** Investigate the file properties of `chrome_frame_helper.dll` using Windows Explorer or PowerShell. Look for digital signatures and creation dates. A legitimate file should be signed by Google, with recent creation dates correlating to standard Chrome updates.

  - **Review parent process context:** Analyze Event ID 4688 to identify what process initiated the DLL load. A suspicious parent process (like `cmd.exe` or a non-browser executable) can indicate malicious intent. Legitimate loads typically originate from processes like `chrome.exe`.

  - **Correlate user activity:** Examine user access logs to verify if there was legitimate user interaction with the Chrome application around the time of the alert. Look for user agent strings and browsing history that match expected behavior.

  - **Assess file system changes:** Check for additional artifacts in the user's AppData directory or temporary directories that could indicate malicious persistence mechanisms, such as scheduled tasks or scripts left behind.

  - **Identify known malicious artifacts:** Cross-reference the file path and hash of `chrome_frame_helper.dll` against threat intelligence sources to identify any confirmed associations with malware campaigns or known exploits.

  ### Prioritization

  This alert is of medium severity in a corporate environment, given that it targets a commonly used software component and could indicate an attempt to exploit browser vulnerabilities. The likelihood of malicious abuse is moderate, as DLL sideloading techniques are sometimes weaponized in real-world attacks, but they may also result from benign misconfigurations or legitimate application updates.

  ### Blind Spots and Assumptions

  This detection may have evasion limitations, as sophisticated adversaries may employ techniques to mask the DLL's true source or modify it to appear benign. Required log sources include Sysmon and Windows event logging enabled for comprehensive coverage. Legitimate application installations or updates may trigger this alert, particularly if file paths deviate due to misconfigured environments. A related detection to strengthen coverage includes monitoring for abnormal process creation (Event ID 4688) adjacent to DLL loads.

