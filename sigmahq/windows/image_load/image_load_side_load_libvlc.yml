title: Potential Libvlc.DLL Sideloading
id: bf9808c4-d24f-44a2-8398-b65227d406b6
status: test
description: Detects potential DLL sideloading of "libvlc.dll", a DLL that is 
  legitimately used by "VLC.exe"
references:
- https://www.trendmicro.com/en_us/research/23/c/earth-preta-updated-stealthy-strategies.html
- https://hijacklibs.net/entries/3rd_party/vlc/libvlc.html
author: X__Junior
date: 2023-04-17
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\libvlc.dll'
  filter_main_vlc:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\VideoLAN\VLC\'
    - 'C:\Program Files\VideoLAN\VLC\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives are expected if VLC is installed in non-default locations
level: medium
note: |
  ### Technical Context

  This rule detects the loading of "libvlc.dll" from non-standard locations, which can indicate DLL sideloading, a technique often leveraged by attackers to execute malicious code under the guise of legitimate processes. Attackers may aim to gain persistence, escalate privileges, or perform stealthy execution of malicious payloads. This behavior aligns with the MITRE ATT&CK technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources for this detection are Windows image load events, particularly observing DLL load operations from the `ImageLoaded` category. If legitimate, the DLL would typically load from expected paths such as `C:\Program Files (x86)\VideoLAN\VLC\`. Malicious uses of this technique can severely compromise system integrity and enable unauthorized access to sensitive data. Importantly, this detection alone does not confirm malicious intent or compromise without additional context.

  ### Investigation Steps

  - **Verify DLL load path:** Examine image load events (Windows Event ID 4104 for PowerShell or Sysmon Event ID 10) involving `libvlc.dll` to confirm if it originated from paths outside the `C:\Program Files\VideoLAN\VLC\` directories.

  - **Correlate with process execution:** Investigate the parent process of the VLC-related DLL loading by reviewing Sysmon Event ID 4688 for any unexpected or known malicious parent processes, such as uncommon executables spawning VLC.

  - **Analyze file integrity:** Check if the `libvlc.dll` file has been modified by validating its hash against known good hashes in your organization's approved software repository. Use a tool like Tripwire or a checksum verifier.

  - **Identify legitimate usage patterns:** Review recent user activity associated with the VLC executable (Event ID 4688) to see valid use cases, which typically include file formats supported by VLC such as `.mp4`, `.avi`, or `.mkv`.

  - **Check for related artifacts:** Look for signs of data exfiltration or further compromise, such as unusual outbound network connections (Firewall logs) originating from the system now showing DLL sideloading behavior.

  ### Prioritization

  This alert has medium severity due to the potential impact on affected systems, particularly if malicious code is executed. The likelihood of malicious abuse through DLL side-loading is significant as it is a common tactic among attackers to evade detection and maintain persistence. The alert should be treated with urgency, particularly on critical assets running unmonitored software.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion tactics where attackers may place the DLL in legitimate paths or use various renaming techniques. Reliable detection requires proper logging settings for image loads (Sysmon) and may produce false positives if VLC is installed in non-default locations. Legitimate software installation activities may trigger this alert, especially if software is directed to custom installation paths. Companion detections around suspicious execution patterns of VLC and monitoring unexpected modifications to critical libraries would enhance coverage and context for the investigation.

