title: Potential Libvlc.DLL Sideloading
id: bf9808c4-d24f-44a2-8398-b65227d406b6
status: test
description: Detects potential DLL sideloading of "libvlc.dll", a DLL that is 
  legitimately used by "VLC.exe"
references:
- https://www.trendmicro.com/en_us/research/23/c/earth-preta-updated-stealthy-strategies.html
- https://hijacklibs.net/entries/3rd_party/vlc/libvlc.html
author: X__Junior
date: 2023-04-17
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\libvlc.dll'
  filter_main_vlc:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\VideoLAN\VLC\'
    - 'C:\Program Files\VideoLAN\VLC\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives are expected if VLC is installed in non-default locations
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading involving the `libvlc.dll`, which is associated with the VLC media player. The likely attacker objective is to execute malicious payloads under the guise of a legitimate application, which can lead to persistence and privilege escalation on the affected system. This activity correlates with the MITRE ATT&CK technique of DLL Sideloading (T1574.001). The primary telemetry source is Windows image load events, specifically focusing on the paths from which `libvlc.dll` is loaded. If the activity is malicious, it may allow attackers to bypass security controls by executing code that appears to be from a trusted application. It is essential to note that this detection does not confirm malicious intent or compromise on its own, as legitimate applications may also raise similar alerts.

  ### Investigation Steps

  - **Identify the DLL source path:** Examine the `ImageLoaded` logs for Event ID 4104 or Sysmon Event ID 7 to find the exact file path of the loaded `libvlc.dll`. Malicious indicators would include paths outside of default installation directories: `C:\Program Files (x86)\VideoLAN\VLC\` or `C:\Program Files\VideoLAN\VLC\`.

  - **Verify the parent process:** Check for the parent process of the loaded `libvlc.dll` using the same telemetry. Legitimate activity typically shows VLC.exe as the parent process. Look for unexpected parent processes like `cmd.exe` or `powershell.exe`, which can indicate potential abuse.

  - **Cross-reference file signatures:** Conduct a file analysis for the `libvlc.dll` loaded from non-standard paths to validate its integrity. Check if the file hash matches genuine VLC distributions (available through official channels).

  - **Monitor process behavior:** Review additional logs for anomalous behavior following the loading of `libvlc.dll`. This includes unexpected outbound connections or process creation (Event IDs 4688/4697) that could signal exploitation.

  - **Review system modifications:** Look at changes in security settings or user privileges around the time the `libvlc.dll` was loaded. Such changes could indicate an attempt to maintain persistence or escalate privileges post-exploitation.

  ### Prioritization

  The severity of this alert is medium. If malicious activity is confirmed, it can lead to significant impacts, especially if executed on critical systems or endpoints susceptible to privilege escalation. The likelihood of abuse increases as DLL sideloading is a recognized tactic used by adversaries in real-world attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications residing in non-standard directories that might also trigger the alert. Key logging sources must be enabled, specifically Sysmon for tracking image loads, to ensure comprehensive detection. Legitimate application behavior such as devoting resources to run VLC and loading `libvlc.dll` from correct paths may trigger this alert frequently. Related detections, such as monitoring for unusual parent processes using Sysmon, can strengthen overall coverage against potential DLL-based attacks.

