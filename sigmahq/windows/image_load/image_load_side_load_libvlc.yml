title: Potential Libvlc.DLL Sideloading
id: bf9808c4-d24f-44a2-8398-b65227d406b6
status: test
description: Detects potential DLL sideloading of "libvlc.dll", a DLL that is legitimately
  used by "VLC.exe"
references:
- https://www.trendmicro.com/en_us/research/23/c/earth-preta-updated-stealthy-strategies.html
- https://hijacklibs.net/entries/3rd_party/vlc/libvlc.html
author: X__Junior
date: 2023-04-17
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\libvlc.dll'
  filter_main_vlc:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\VideoLAN\VLC\'
    - 'C:\Program Files\VideoLAN\VLC\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives are expected if VLC is installed in non-default locations
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading of `libvlc.dll`, which is typically associated with the VLC media player. DLL sideloading is a tactic where an attacker places a malicious DLL in the same directory as a legitimate executable (in this case, `VLC.exe`), tricking the system into loading the malicious DLL instead of the genuine one. This method can provide an attacker with a means of executing arbitrary code under the context of a trusted application, thereby bypassing security measures and evading detection.

  The primary threat scenario here is rooted in the abuse of legitimate software to execute harmful code, which can lead to unauthorized remote access or privilege escalation. Attackers are likely attempting to either exploit user trust in VLC to deliver malware or use VLC's privileges to run malicious activities undetected. The relevant MITRE ATT&CK tactics involved include **Defense Evasion** (T1074) and **Persistence** (T1574.001), given that DLL sideloading can allow attackers to maintain access while masking their presence.

  The primary data sources for this detection include **image load logs** from Windows, specifically monitoring the `ImageLoaded` events that register DLL loading activities. Analysts should focus on instances where `libvlc.dll` is being loaded from unexpected directories, especially if it deviates from its usual installation paths.

  ### Investigation Steps
  - **Review Image Load Events**: Examine recent image load logs to identify instances of `libvlc.dll` being loaded. Look for any paths that do not match the default VLC installation directories.

  - **Analyze Parent Process**: Investigate the parent process of the detected `libvlc.dll` loads. Ensure that it originates from the legitimate `VLC.exe` binary and investigate any anomalies.

  - **Correlate with Known Indicators**: Cross-reference findings with MITRE ATT&CK techniques and threat intelligence sources to identify if the observed behavior aligns with known malicious activities related to DLL sideloading.

  - **Conduct File Integrity Checks**: Validate the integrity of `libvlc.dll` being loaded by comparing its hash against known-good files. Check for modifications or anomalies in the file attributes.

  ### Prioritization
  This alert has a medium severity rating due to the potential impact of malicious code execution through trusted applications, coupled with the relatively low likelihood of occurrence in a controlled environment where VLC is authorized software. However, given the risks associated with software abuse, timely investigations are warranted.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for legitimate use cases where users install VLC in non-default locations, which could lead to false positives. The detection logic assumes that all instances of `libvlc.dll` should be loaded from specified directories; therefore, configurations that alter default install paths may evade this rule. Additionally, proper logging of image loads must be enabled for this detection to function effectively, and monitoring must be comprehensive to capture all necessary data points for analysis.

