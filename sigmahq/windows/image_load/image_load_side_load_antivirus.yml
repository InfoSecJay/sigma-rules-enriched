title: Potential Antivirus Software DLL Sideloading
id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
status: test
description: Detects potential DLL sideloading of DLLs that are part of 
  antivirus software suchas McAfee, Symantec...etc
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Bitdefender
  selection_bitdefender:
    ImageLoaded|endswith: '\log.dll'
  filter_log_dll_bitdefender:
    ImageLoaded|startswith:
    - 'C:\Program Files\Bitdefender Antivirus Free\'
    - 'C:\Program Files (x86)\Bitdefender Antivirus Free\'
  filter_log_dll_dell_sar:
    Image: 'C:\Program Files\Dell\SARemediation\audit\TelemetryUtility.exe'
    ImageLoaded:
    - 'C:\Program Files\Dell\SARemediation\plugin\log.dll'
    - 'C:\Program Files\Dell\SARemediation\audit\log.dll'
  filter_log_dll_canon:
    ImageLoaded|startswith: 'C:\Program Files\Canon\MyPrinter\'
  filter_log_dll_avast:
    ImageLoaded:
    - 'C:\Program Files\AVAST Software\Avast\log.dll'
    - 'C:\Program Files (x86)\AVAST Software\Avast\log.dll'
  filter_log_dll_avg:
    ImageLoaded:
    - 'C:\Program Files\AVG\Antivirus\log.dll'
    - 'C:\Program Files (x86)\AVG\Antivirus\log.dll'
    # F-Secure
  selection_fsecure:
    ImageLoaded|endswith: '\qrt.dll'
  filter_fsecure:
    ImageLoaded|startswith:
    - 'C:\Program Files\F-Secure\Anti-Virus\'
    - 'C:\Program Files (x86)\F-Secure\Anti-Virus\'
    # McAfee
  selection_mcafee:
    ImageLoaded|endswith:
    - '\ashldres.dll'
    - '\lockdown.dll'
    - '\vsodscpl.dll'
  filter_mcafee:
    ImageLoaded|startswith:
    - 'C:\Program Files\McAfee\'
    - 'C:\Program Files (x86)\McAfee\'
    # CyberArk
  selection_cyberark:
    ImageLoaded|endswith: '\vftrace.dll'
  filter_cyberark:
    ImageLoaded|startswith:
    - 'C:\Program Files\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    - 'C:\Program Files (x86)\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    # Avast
  selection_avast:
    ImageLoaded|endswith: '\wsc.dll'
  filter_wsc_dll_avast:
    ImageLoaded|startswith:
    - 'C:\program Files\AVAST Software\Avast\'
    - 'C:\program Files (x86)\AVAST Software\Avast\'
  filter_wsc_dll_avg:
    ImageLoaded|startswith:
    - 'C:\Program Files\AVG\Antivirus\'
    - 'C:\Program Files (x86)\AVG\Antivirus\'
    # ESET
  selection_eset_deslock:
    ImageLoaded|endswith: '\DLPPREM32.dll'
  filter_eset_deslock:
    ImageLoaded|startswith:
    - 'C:\program Files\ESET'
    - 'C:\program Files (x86)\ESET'
    # Trend Micro Titanium
  selection_titanium:
    ImageLoaded|endswith: '\tmdbglog.dll'
  filter_titanium:
    ImageLoaded|startswith:
    - 'C:\program Files\Trend Micro\Titanium\'
    - 'C:\program Files (x86)\Trend Micro\Titanium\'
  condition: (selection_bitdefender and not 1 of filter_log_dll_*) or 
    (selection_fsecure and not filter_fsecure) or (selection_mcafee and not 
    filter_mcafee) or (selection_cyberark and not filter_cyberark) or 
    (selection_avast and not 1 of filter_wsc_dll_*) or (selection_titanium and 
    not filter_titanium) or (selection_eset_deslock and not filter_eset_deslock)
falsepositives:
- Applications that load the same dlls mentioned in the detection section. 
  Investigate them and filter them out if a lot FPs are caused.
- Dell SARemediation plugin folder (C:\Program 
  Files\Dell\SARemediation\plugin\log.dll) is known to contain the 'log.dll' 
  file.
- The Canon MyPrinter folder 'C:\Program Files\Canon\MyPrinter\' is known to 
  contain the 'log.dll' file
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading involving antivirus software by monitoring for the loading of specific DLLs that are part of known antivirus packages, such as McAfee or Avast, in unexpected or unauthorized contexts. Adversaries may aim to exploit legitimate DLL paths to load malicious payloads, thereby bypassing traditional security measures. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactics of Defense Evasion (TA0005) and Persistence (TA0003), utilizing techniques such as DLL Search Order Hijacking (T1574.001).

  The primary telemetry source for this detection is Windows image load events, specifically those indicating which DLLs are being loaded by executable processes. If this behavior is confirmed to be malicious, it can lead to privilege escalation, unauthorized access to systems, or data breaches via malware disguising itself as legitimate software. Notably, this detection does NOT confirm that a malicious action has occurred without further corroborating evidence, such as the detection of abnormal process behavior or network communications.

  ### Investigation Steps

  - **Verify the source of the alert:** Check Security Event ID 4688 for details on the process that triggered the DLL load, focusing on the parent process, command line, and user context. Specifically, examine the Image field for unexpected execution paths that diverge from standard antivirus execution paths.

  - **Correlate DLL loads with known paths:** Review the image load telemetry (Sysmon Event ID 10 or equivalent) to confirm if the DLLs were loaded from expected directories. Compare against standard paths such as `C:\Program Files\McAfee\` or `C:\Program Files\Avast Software\` to identify discrepancies.

  - **Assess the legitimacy of activities:** Compare current activity against expected antivirus operations. For instance, legitimate antivirus functions may execute with parent processes indicating expected malware analysis tasks rather than atypical parent processes, like command line utilities or unusual scripts.

  - **Identify high-confidence malicious indicators:** Look for unusual DLL loading patterns in the telemetry, such as `\ashldres.dll` or `\lockdown.dll` loaded outside of designated directories, which should raise suspicion of potential sideloading.

  - **Determine the asset criticality:** Assess the role of the affected system within the organization (e.g., endpoint, server) and its standard software configurations to understand the implications of a potential compromise.

  - **Examine for file creation or exfiltration artifacts:** If sideloading is confirmed, investigate Network Event Logs and Data Loss Prevention logs for any unexpected outbound communications or file accesses related to the activity, especially concerning potential data theft.

  ### Prioritization

  This alert should be regarded with medium severity as it indicates potential abuse of legitimate antivirus software, which can lead to significant impact if malicious. The likelihood of exploitation through DLL sideloading is substantial as it is a common tactic among adversaries to evade detection and escalate privileges, making this behavior critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications that load the same DLLs, which could trigger false positives; hence, context is crucial in analysis. The rule relies on accurate and comprehensive telemetry from image load events, and configurations must ensure all relevant directories and processes are logged thoroughly. Legitimate applications, such as Dell SARemediation or Canon MyPrinter, may produce similar alerts, necessitating additional review. A related detection to strengthen monitoring efforts is the tracking of unusual process creation patterns associated with the identified legitimate antivirus processes.

