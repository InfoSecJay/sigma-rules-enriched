title: Potential Antivirus Software DLL Sideloading
id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
status: test
description: Detects potential DLL sideloading of DLLs that are part of 
  antivirus software such as McAfee, Symantec...etc
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
- https://www.huntress.com/blog/clickfix-matanbuchus-astarionrat-analysis
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2026-10-19
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Bitdefender
  selection_bitdefender:
    ImageLoaded|endswith: '\log.dll'
  filter_log_dll_bitdefender:
    ImageLoaded|startswith:
    - 'C:\Program Files\Bitdefender Antivirus Free\'
    - 'C:\Program Files (x86)\Bitdefender Antivirus Free\'
  filter_log_dll_dell_sar:
    Image: 'C:\Program Files\Dell\SARemediation\audit\TelemetryUtility.exe'
    ImageLoaded:
    - 'C:\Program Files\Dell\SARemediation\plugin\log.dll'
    - 'C:\Program Files\Dell\SARemediation\audit\log.dll'
  filter_log_dll_canon:
    ImageLoaded|startswith: 'C:\Program Files\Canon\MyPrinter\'
  filter_log_dll_avast:
    ImageLoaded:
    - 'C:\Program Files\AVAST Software\Avast\log.dll'
    - 'C:\Program Files (x86)\AVAST Software\Avast\log.dll'
  filter_log_dll_avg:
    ImageLoaded:
    - 'C:\Program Files\AVG\Antivirus\log.dll'
    - 'C:\Program Files (x86)\AVG\Antivirus\log.dll'
    # F-Secure
  selection_fsecure:
    ImageLoaded|endswith: '\qrt.dll'
  filter_fsecure:
    ImageLoaded|startswith:
    - 'C:\Program Files\F-Secure\Anti-Virus\'
    - 'C:\Program Files (x86)\F-Secure\Anti-Virus\'
    # McAfee
  selection_mcafee:
    ImageLoaded|endswith:
    - '\ashldres.dll'
    - '\lockdown.dll'
    - '\vsodscpl.dll'
  filter_mcafee:
    ImageLoaded|startswith:
    - 'C:\Program Files\McAfee\'
    - 'C:\Program Files (x86)\McAfee\'
    # CyberArk
  selection_cyberark:
    ImageLoaded|endswith: '\vftrace.dll'
  filter_cyberark:
    ImageLoaded|startswith:
    - 'C:\Program Files\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    - 'C:\Program Files (x86)\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    # Avast
  selection_avast:
    ImageLoaded|endswith: '\wsc.dll'
  filter_wsc_dll_avast:
    ImageLoaded|startswith:
    - 'C:\Program Files\AVAST Software\Avast\'
    - 'C:\Program Files (x86)\AVAST Software\Avast\'
  filter_wsc_dll_avg:
    ImageLoaded|startswith:
    - 'C:\Program Files\AVG\Antivirus\'
    - 'C:\Program Files (x86)\AVG\Antivirus\'
    # ESET
  selection_eset_deslock:
    ImageLoaded|endswith: '\DLPPREM32.dll'
  filter_eset_deslock:
    ImageLoaded|startswith:
    - 'C:\Program Files\ESET'
    - 'C:\Program Files (x86)\ESET'
    # Trend Micro Titanium
  selection_titanium:
    ImageLoaded|endswith: '\tmdbglog.dll'
  filter_titanium:
    ImageLoaded|startswith:
    - 'C:\Program Files\Trend Micro\Titanium\'
    - 'C:\Program Files (x86)\Trend Micro\Titanium\'
    # Zillya Antivirus
  selection_zillya:
    ImageLoaded|endswith: '\SystemStatus.dll'
  filter_zillya_ovron:
    ImageLoaded|startswith:
    - 'C:\Program Files\Zillya Antivirus\'
    - 'C:\Program Files (x86)\Zillya Antivirus\'
    - 'C:\Program Files\Zillya Total Security\'
    - 'C:\Program Files (x86)\Zillya Total Security\'
    - 'C:\Program Files\Ovron Total Security\'
    - 'C:\Program Files (x86)\Ovron Total Security\'
  condition: (selection_bitdefender and not 1 of filter_log_dll_*) or 
    (selection_fsecure and not filter_fsecure) or (selection_mcafee and not 
    filter_mcafee) or (selection_cyberark and not filter_cyberark) or 
    (selection_avast and not 1 of filter_wsc_dll_*) or (selection_titanium and 
    not filter_titanium) or (selection_eset_deslock and not filter_eset_deslock)
    or (selection_zillya and not filter_zillya_ovron)
falsepositives:
- Applications that load the same dlls mentioned in the detection section. 
  Investigate them and filter them out if a lot FPs are caused.
- Dell SARemediation plugin folder (C:\Program 
  Files\Dell\SARemediation\plugin\log.dll) is known to contain the 'log.dll' 
  file.
- The Canon MyPrinter folder 'C:\Program Files\Canon\MyPrinter\' is known to 
  contain the 'log.dll' file
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading involving well-known antivirus software components, specifically targeting the loading of certain DLLs that do not originate from their typical installation paths. The likely attacker objective is to exploit vulnerabilities in trusted antivirus binaries, allowing malicious code execution under the guise of legitimate processes.

  The relevant MITRE ATT&CK techniques are T1574.001 (DLL Search Order Hijacking), which falls under the persistence and execution tactics. The primary telemetry sources include Windows Image Load events, particularly focusing on processes that load DLL files such as `ImageLoaded` from `Windows Event Logs` or `Sysmon logs`. If malicious, this action can compromise the integrity of security systems, potentially enabling further unauthorized access or malware execution. Importantly, this detection does NOT confirm that the activity is malicious on its own; further investigation is necessary to assess context.

  ### Investigation Steps

  - **Check for known legitimate DLLs:**
    Review the loaded DLLs against the list of known legitimate DLLs (found at hijacklibs.net) to determine if they correspond to valid antivirus installations.

  - **Inspect process creation events:**
    Examine Security Event ID 4688 for the parent process that initiated the suspicious DLL load. Ensure the parent process belongs to a legitimate antivirus application, which would indicate benign behavior.

  - **Monitor for unexpected paths:**
    Identify whether the `ImageLoaded` paths match their respective antivirus product installation paths (e.g., `C:\Program Files\McAfee\`). Any deviation could indicate malicious activity.

  - **Look for unusual registry modifications:**
    Check for recent changes in registry keys related to antivirus software (e.g., under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall`). Suspicious adds or modifications could suggest tampering.

  - **Identify failed access attempts:**
    Review Security Event ID 4625 for any access failures that may correlate with the alert, indicating unauthorized attempts to load malicious DLLs under the context of antivirus processes.

  - **Validate exfiltration attempts:**
    Use network activity logs to confirm if the affected system made unusual outbound connections following the DLL load, which could indicate exfiltration of data or further command and control communication.

  ### Prioritization

  This alert is categorized as medium severity. The affected systems' role as security appliances makes the likelihood of malicious abuse significant. Additionally, the behavior is notably utilized in real-world attacks, particularly targeting security software weaknesses.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications loading similar DLLs, leading to false positives. Accurate detection requires proper log configurations, including Sysmon and Windows Security event logs. Common legitimate activities such as software updates may unintentionally trigger this detection. A related detection to consider is active monitoring of unusual process injection attempts against these antivirus processes to strengthen overall security posture.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
