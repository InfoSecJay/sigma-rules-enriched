title: Potential Antivirus Software DLL Sideloading
id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
status: test
description: Detects potential DLL sideloading of DLLs that are part of 
  antivirus software suchas McAfee, Symantec...etc
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2025-10-07
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Bitdefender
  selection_bitdefender:
    ImageLoaded|endswith: '\log.dll'
  filter_log_dll_bitdefender:
    ImageLoaded|startswith:
    - 'C:\Program Files\Bitdefender Antivirus Free\'
    - 'C:\Program Files (x86)\Bitdefender Antivirus Free\'
  filter_log_dll_dell_sar:
    Image: 'C:\Program Files\Dell\SARemediation\audit\TelemetryUtility.exe'
    ImageLoaded:
    - 'C:\Program Files\Dell\SARemediation\plugin\log.dll'
    - 'C:\Program Files\Dell\SARemediation\audit\log.dll'
  filter_log_dll_canon:
    ImageLoaded|startswith: 'C:\Program Files\Canon\MyPrinter\'
  filter_log_dll_avast:
    ImageLoaded:
    - 'C:\Program Files\AVAST Software\Avast\log.dll'
    - 'C:\Program Files (x86)\AVAST Software\Avast\log.dll'
  filter_log_dll_avg:
    ImageLoaded:
    - 'C:\Program Files\AVG\Antivirus\log.dll'
    - 'C:\Program Files (x86)\AVG\Antivirus\log.dll'
    # F-Secure
  selection_fsecure:
    ImageLoaded|endswith: '\qrt.dll'
  filter_fsecure:
    ImageLoaded|startswith:
    - 'C:\Program Files\F-Secure\Anti-Virus\'
    - 'C:\Program Files (x86)\F-Secure\Anti-Virus\'
    # McAfee
  selection_mcafee:
    ImageLoaded|endswith:
    - '\ashldres.dll'
    - '\lockdown.dll'
    - '\vsodscpl.dll'
  filter_mcafee:
    ImageLoaded|startswith:
    - 'C:\Program Files\McAfee\'
    - 'C:\Program Files (x86)\McAfee\'
    # CyberArk
  selection_cyberark:
    ImageLoaded|endswith: '\vftrace.dll'
  filter_cyberark:
    ImageLoaded|startswith:
    - 'C:\Program Files\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    - 'C:\Program Files (x86)\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    # Avast
  selection_avast:
    ImageLoaded|endswith: '\wsc.dll'
  filter_wsc_dll_avast:
    ImageLoaded|startswith:
    - 'C:\program Files\AVAST Software\Avast\'
    - 'C:\program Files (x86)\AVAST Software\Avast\'
  filter_wsc_dll_avg:
    ImageLoaded|startswith:
    - 'C:\Program Files\AVG\Antivirus\'
    - 'C:\Program Files (x86)\AVG\Antivirus\'
    # ESET
  selection_eset_deslock:
    ImageLoaded|endswith: '\DLPPREM32.dll'
  filter_eset_deslock:
    ImageLoaded|startswith:
    - 'C:\program Files\ESET'
    - 'C:\program Files (x86)\ESET'
    # Trend Micro Titanium
  selection_titanium:
    ImageLoaded|endswith: '\tmdbglog.dll'
  filter_titanium:
    ImageLoaded|startswith:
    - 'C:\program Files\Trend Micro\Titanium\'
    - 'C:\program Files (x86)\Trend Micro\Titanium\'
  condition: (selection_bitdefender and not 1 of filter_log_dll_*) or 
    (selection_fsecure and not filter_fsecure) or (selection_mcafee and not 
    filter_mcafee) or (selection_cyberark and not filter_cyberark) or 
    (selection_avast and not 1 of filter_wsc_dll_*) or (selection_titanium and 
    not filter_titanium) or (selection_eset_deslock and not filter_eset_deslock)
falsepositives:
- Applications that load the same dlls mentioned in the detection section. 
  Investigate them and filter them out if a lot FPs are caused.
- Dell SARemediation plugin folder (C:\Program 
  Files\Dell\SARemediation\plugin\log.dll) is known to contain the 'log.dll' 
  file.
- The Canon MyPrinter folder 'C:\Program Files\Canon\MyPrinter\' is known to 
  contain the 'log.dll' file
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading attempts for various antivirus software, such as McAfee, Symantec, and others. DLL sideloading is a technique where a malicious actor places a malicious DLL in a directory where a legitimate application expects to find its own DLL, thus enabling the execution of malicious code under the guise of a trusted application. The likely attacker objective is to maintain persistence or escalate privileges on a system by exploiting trusted applications.

  The detection aligns with the MITRE ATT&CK framework under the tactics of Persistence (T1547) and Privilege Escalation (T1068), specific to the technique of DLL Side-Loading (T1574.001). Primary telemetry sources include Windows Event Logs related to image loads, particularly focusing on the `ImageLoaded` field associated with security event logs for process executions and C2 behavior. If successfully executed, this could lead to significant security impacts, including full system compromise. However, this detection does NOT confirm that the software being hijacked is indeed malicious on its own; further context and investigation are necessary.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Event ID 4688 logs for associated process creations around the time of the alert. Look for parent processes, especially legitimate antivirus executables, as potential benign indicators.

  - **Correlate Image Loaded Events:** Identify relevant `ImageLoaded` events from Windows Security logs where the path ends with known potentially malicious DLLs (e.g., `log.dll`, `ashldres.dll`). Focus on `Event ID 4104` from Sysmon to verify chains of execution related to the detected DLLs.

  - **Examine DLL Path Validity:** Confirm that any detected DLL loads are consistent with known trusted installation paths of the antivirus software as per the detection criteria. If the DLL is loaded from atypical directories, this may indicate malicious activity.

  - **Cross-Reference with Known DLLs:** Use the list of known benign DLLs from a resource like hijacklibs.net to filter legitimate software applications that might be flagged and eliminate false positive cases.

  - **Investigate Endpoint Activity:** Analyze the behavior of the host from which the alert originated. Consider asset criticality; higher value endpoints running sensitive tasks (e.g., domain controllers, financial systems) should be prioritized for in-depth investigation.

  - **File Creation and Modification Checks:** Confirm if there are any recent file creations or modifications within the directories associated with the antivirus installations, focusing on suspicious log files or DLLs that could indicate an attempted manipulation or sideloading (e.g., `C:\Program Files\Antivirus\`).

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential for significant impact if a benign antivirus process is leveraged for malicious activity. The likelihood of malicious abuse is elevated given that DLL sideloading is a known evasion technique. However, the behavior may occur in legitimate applications that utilize similar DLLs, necessitating careful triage.

  ### Blind Spots and Assumptions

  Detection limitations exist if the antivirus software is configured improperly or if necessary logging levels are not set. Legitimate applications using similar DLL names may inadvertently trigger alerts, leading to false positives. Adversaries could also employ code obfuscation or operate outside of typical paths to evade detection. A related detection is monitoring for unusual parent-child process relationships that involve known antivirus processes, further enhancing visibility on potential malfeasance.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
