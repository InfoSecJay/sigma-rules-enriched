title: Potential Antivirus Software DLL Sideloading
id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
status: test
description: Detects potential DLL sideloading of DLLs that are part of antivirus
  software suchas McAfee, Symantec...etc
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
date: 2022-08-17
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Bitdefender
  selection_bitdefender:
    ImageLoaded|endswith: '\log.dll'
  filter_log_dll_bitdefender:
    ImageLoaded|startswith:
    - 'C:\Program Files\Bitdefender Antivirus Free\'
    - 'C:\Program Files (x86)\Bitdefender Antivirus Free\'
  filter_log_dll_dell_sar:
    Image: 'C:\Program Files\Dell\SARemediation\audit\TelemetryUtility.exe'
    ImageLoaded:
    - 'C:\Program Files\Dell\SARemediation\plugin\log.dll'
    - 'C:\Program Files\Dell\SARemediation\audit\log.dll'
  filter_log_dll_canon:
    ImageLoaded|startswith: 'C:\Program Files\Canon\MyPrinter\'
  filter_log_dll_avast:
    ImageLoaded:
    - 'C:\Program Files\AVAST Software\Avast\log.dll'
    - 'C:\Program Files (x86)\AVAST Software\Avast\log.dll'
  filter_log_dll_avg:
    ImageLoaded:
    - 'C:\Program Files\AVG\Antivirus\log.dll'
    - 'C:\Program Files (x86)\AVG\Antivirus\log.dll'
    # F-Secure
  selection_fsecure:
    ImageLoaded|endswith: '\qrt.dll'
  filter_fsecure:
    ImageLoaded|startswith:
    - 'C:\Program Files\F-Secure\Anti-Virus\'
    - 'C:\Program Files (x86)\F-Secure\Anti-Virus\'
    # McAfee
  selection_mcafee:
    ImageLoaded|endswith:
    - '\ashldres.dll'
    - '\lockdown.dll'
    - '\vsodscpl.dll'
  filter_mcafee:
    ImageLoaded|startswith:
    - 'C:\Program Files\McAfee\'
    - 'C:\Program Files (x86)\McAfee\'
    # CyberArk
  selection_cyberark:
    ImageLoaded|endswith: '\vftrace.dll'
  filter_cyberark:
    ImageLoaded|startswith:
    - 'C:\Program Files\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    - 'C:\Program Files (x86)\CyberArk\Endpoint Privilege Manager\Agent\x32\'
    # Avast
  selection_avast:
    ImageLoaded|endswith: '\wsc.dll'
  filter_wsc_dll_avast:
    ImageLoaded|startswith:
    - 'C:\program Files\AVAST Software\Avast\'
    - 'C:\program Files (x86)\AVAST Software\Avast\'
  filter_wsc_dll_avg:
    ImageLoaded|startswith:
    - 'C:\Program Files\AVG\Antivirus\'
    - 'C:\Program Files (x86)\AVG\Antivirus\'
    # ESET
  selection_eset_deslock:
    ImageLoaded|endswith: '\DLPPREM32.dll'
  filter_eset_deslock:
    ImageLoaded|startswith:
    - 'C:\program Files\ESET'
    - 'C:\program Files (x86)\ESET'
    # Trend Micro Titanium
  selection_titanium:
    ImageLoaded|endswith: '\tmdbglog.dll'
  filter_titanium:
    ImageLoaded|startswith:
    - 'C:\program Files\Trend Micro\Titanium\'
    - 'C:\program Files (x86)\Trend Micro\Titanium\'
  condition: (selection_bitdefender and not 1 of filter_log_dll_*) or (selection_fsecure
    and not filter_fsecure) or (selection_mcafee and not filter_mcafee) or (selection_cyberark
    and not filter_cyberark) or (selection_avast and not 1 of filter_wsc_dll_*) or
    (selection_titanium and not filter_titanium) or (selection_eset_deslock and not
    filter_eset_deslock)
falsepositives:
- Applications that load the same dlls mentioned in the detection section. Investigate
  them and filter them out if a lot FPs are caused.
- Dell SARemediation plugin folder (C:\Program Files\Dell\SARemediation\plugin\log.dll)
  is known to contain the 'log.dll' file.
- The Canon MyPrinter folder 'C:\Program Files\Canon\MyPrinter\' is known to contain
  the 'log.dll' file
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading involving DLLs associated with various antivirus software, such as Bitdefender, McAfee, and Avast. DLL sideloading is a technique where an attacker misuses a legitimate application by placing a malicious DLL in the expected directory, allowing the application to load and execute it, thereby evading detection by traditional security measures. This technique can enable the attacker to gain persistence, escalate privileges, or execute malicious code while appearing legitimate to security systems.

  The identified threat scenario typically involves an attacker attempting to compromise systems by leveraging trusted applications to run malicious code. The attacker's objectives are likely to gain elevated privileges, conduct reconnaissance, or install additional malware without detection. This rule links to several MITRE ATT&CK tactics and techniques, particularly **Defense Evasion** (T1074), **Persistence** (T1574.001), and **Privilege Escalation** (T1068), highlighting the multifaceted nature of the threat.

  The primary data sources that will provide valuable context for investigation include image load events from Windows system logs, which capture what DLLs are loaded by running processes. Additionally, application logs from relevant antivirus software and process creation logs may also assist in assessing the legitimacy of activity.

  ### Investigation Steps
  - **Review Image Load Events**: Examine Windows image load events for any DLLs loaded by antivirus applications that differ from their expected behavior or path. Pay attention to unusual process names or paths that indicate potential sideloading.

  - **Analyze Process Creation Logs**: Look at the process creation logs, focusing on processes associated with antivirus software. Determine whether there are any unexpected command-line arguments or parent processes that might indicate malicious activity.

  - **Cross-reference Known DLLs**: Use the references from common DLLs susceptible to sideloading (as noted in hijacklibs.net) to identify legitimate versus suspicious DLLs that may not be expected in the installation directories of antivirus software.

  - **Check for Anomalous Network Connections**: Monitor network activity linked to the processes identified in the previous steps. Look for unusual outbound connections or data exfiltration attempts that could indicate further malicious activities.

  ### Prioritization
  The severity of this alert is medium because the exploitation of trusted antivirus software through DLL sideloading can lead to significant security breaches, including unauthorized access and system compromise. Given that many users rely on these applications for protection, an alert indicates a heightened risk that requires timely investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the presence of legitimate applications that also load the same DLL files as those associated with the detected antivirus software, leading to possible false positives. Assumptions include the expected behavior of antivirus applications and system configurations, which may vary across different environments. The alert requires comprehensive logging of image load events, process creations, and additional logging configurations for forensic analysis and proper functioning.

