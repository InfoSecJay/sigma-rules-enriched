  ---

  ### Technical Context

  This rule detects potential sideloading of the "appverifUI.dll" library when it is loaded in an unexpected manner, indicating possible malicious actions such as executing a rogue version of a legitimate application. The likely objective of an attacker employing this technique is to gain persistence or escalate privileges on a compromised system by leveraging trusted binaries. This behavior aligns with the MITRE ATT&CK technique of DLL side-loading (T1574.001).

  The primary telemetry sources include Windows image load events, specifically tracking processes loading the "appverifUI.dll". If malicious, this technique could allow adversaries to operate undetected while utilizing existing trusted executable paths. It is essential to note that this detection does NOT confirm malicious intent by itself, as legitimate applications may also load this DLL under specific circumstances.

  ---

  ### Investigation Steps

  - **Check process details:** Review process creation logs (Windows Security Event ID 4688 or Sysmon Event ID 1) to identify the parent process of any loading instances of "appverifUI.dll". Look for unusual parent processes that do not typically load this DLL, as benign instances usually stem from "C:\Windows\SysWOW64\appverif.exe" or "C:\Windows\System32\appverif.exe".

  - **Verify DLL source location:** Confirm the file path from which "appverifUI.dll" was loaded. Malicious instances commonly originate from non-standard directories (e.g., user directories or temp folders), while legitimate loads should originate from "C:\Windows\SysWOW64\" or "C:\Windows\System32\".

  - **Cross-reference known applications:** Investigate if any recent installations or updates of applications could explain legitimate usage. Review software inventory logs or deployment solutions to identify possible updates to any impacted software.

  - **Analyze DLL checksum and reputation:** Use file analysis tools to generate checksums of the loaded "appverifUI.dll". Check against threat intelligence sources for any known malicious signatures. Legitimate files from Microsoft will have specific hashes.

  - **Look for related file behavior:** Monitor for the creation or modification of files in suspicious directories following the loading of "appverifUI.dll". Specifically, confirm any related artifacts in temporary folders or home directories that may indicate exfiltration or malicious payload installation.

  - **Consult asset criticality:** Consider the role of the affected host within the enterprise environment. Higher-value systems (e.g., domain controllers) warrant swifter and more thorough investigations, while standard user workstations may require context-based follow-ups only if further malicious indicators are present.

  ---

  ### Prioritization

  This alert is high severity due to the potential for privilege escalation or persistence if the behavior is exploited maliciously. The likelihood of abuse is significant, especially as DLL sideloading techniques are commonly weaponized in various attack vectors, particularly targeting trusted applications.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications triggering similar alerts under rare circumstances, such as legitimate use of "appverif.exe" leading to DLL load events. Required configurations for reliable detection include ensuring Windows image load events are enabled in logging settings. A related detection to consider is monitoring process creation of all executables nested within "C:\Windows\System32\" as this increases visibility for potential DLL exploitation attempts.

