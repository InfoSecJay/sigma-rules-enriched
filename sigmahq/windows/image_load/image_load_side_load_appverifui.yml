title: Potential appverifUI.DLL Sideloading
id: ee6cea48-c5b6-4304-a332-10fc6446f484
status: test
description: Detects potential DLL sideloading of "appverifUI.dll"
references:
- https://web.archive.org/web/20220519091349/https://fatrodzianko.com/2020/02/15/dll-side-loading-appverif-exe/
author: X__Junior (Nextron Systems)
date: 2023-06-20
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\appverifUI.dll'
  filter_main_legit_path:
    Image:
    - 'C:\Windows\SysWOW64\appverif.exe'
    - 'C:\Windows\System32\appverif.exe'
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects potential DLL sideloading involving the "appverifUI.dll" file. DLL sideloading is a technique used by attackers to execute malicious code by leveraging legitimate applications to load a malicious DLL. In this scenario, if an attacker successfully sideloads "appverifUI.dll," they can bypass security controls, escalate privileges, and persist within the environment while masquerading as a legitimate process. The attacker’s goal is typically to gain unauthorized access or maintain a foothold in the system, making it crucial for defenders to identify such tactics promptly.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003), **Defense Evasion** (TA0005), and **Privilege Escalation** (TA0004). Specific techniques would be **DLL Side-Loading** (T1574.001), which directly aligns with this detection rule. Data sources for this detection primarily include **image load events** in Windows which reveal when a process loads a DLL file, thereby indicating potentially malicious activity if the conditions specified in the rule are met.

  ### Investigation Steps
  - **Review Image Load Events:** Collect and analyze image load events for instances of "appverifUI.dll" being loaded. Focus on the context of the loading process to determine if it aligns with its legitimate usage.
  - **Examine Parent Processes:** Investigate the parent processes that initiated the loading of "appverifUI.dll." Malicious processes will often exhibit unusual characteristics or originate from unexpected locations.
  - **Check File Paths:** Validate the file paths for "appverifUI.dll" against known legitimate paths. Any discrepancies or unusual paths accessing this DLL require further investigation.
  - **Correlate with Execution Context:** Assess the execution context of loaded DLLs. Look for patterns indicating that the DLL was loaded in an anomalous manner consistent with a potential sideloading attack, especially if executed with elevated privileges.

  ### Prioritization
  This alert is considered of **high severity** due to the potential impact on system integrity and security. DLL sideloading can lead to unauthorized execution of code with privileges that could further compromise sensitive data or the overall network infrastructure, making timely investigation essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if image load events are not fully enabled or logged within the Windows environment. The detection logic assumes that legitimate files will not deviate from specified paths; thus, any unauthorized access or anomalies in legitimate file usage could indicate suspicious behavior. Furthermore, sufficient logging at the image load level is required for this alert to function effectively; without it, detection may be bypassed, leading to missed incidents.

