detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\outlook.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|contains:
    - '\System.Management.Automation.Dll'
    - '\System.Management.Automation.ni.Dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the loading of PowerShell Core DLLs by Microsoft Office applications, an unusual behavior that suggests possible misuse of Office software to execute PowerShell scripts for malicious purposes. Attackers may use this method to leverage trusted applications as a means to evade detection, aligning with tactics aimed at executing arbitrary code and maintaining persistence. The relevant MITRE ATT&CK techniques include Execution (T1203: Exploitation of Public-Facing Applications) and Defense Evasion (T1218: Signed Binary Proxy Execution).

  Primary telemetry sources include Windows event logs that capture image load events, with a focus on Event ID 7 (Image Load) from Sysmon, or equivalent telemetry from Windows. If malicious, this behavior can facilitate lateral movement, remote code execution, or the deployment of payloads. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use cases for PowerShell and Office integrations do exist.

  ### Investigation Steps

  - **Verify the loaded DLL paths:** Check for logs indicating loading of '\System.Management.Automation.Dll' or '\System.Management.Automation.ni.Dll' in conjunction with Office application paths. Look at Sysmon Event ID 7 for relevant fields such as `ImageLoaded` and `User`.

  - **Assess the running Office process:** Identify the process that triggered the alert, focusing on Excel (excel.exe), Word (winword.exe), or PowerPoint (powerpnt.exe) for users with no legitimate reason to use PowerShell within these contexts. Reference Process ID and User fields in the logs.

  - **Check user activity and context:** Review user account activity for any signs of unauthorized access or strange actions correlating with the time of alert. Focus on atypical commands issued through PowerShell, cross-referencing with Security Event ID 4688 for any unusual process creation events.

  - **Understand legitimate PowerShell integrations:** Identify how PowerShell is normally used in your environment within Office applications. Document common usage patterns and approved scripts that may involve loading PowerShell DLLs, comparing these against the alert context.

  - **Investigate network communications:** Look for any outgoing connections from the Office applications that coincide with the DLL loading, particularly connections that are atypical for allowed Office traffic. Impress on firewall or proxy logs to identify any suspicious outbound requests or potentially harmful domains.

  ### Prioritization

  This alert carries medium severity due to the potential impact on sensitive systems, especially if the Office applications involved are used for critical business functions. The likelihood of malicious abuse is moderate, as adversaries frequently leverage Office applications for code execution. This behavior is concerning given its capacity to bypass traditional defenses.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate PowerShell usage in Office applications can trigger false positives; many organizations employ PowerShell for automation within those tools. Accurate detection depends on comprehensive logging (e.g., Sysmon configuration) to capture all image load events, as missing data may lead to gaps in visibility. Related detections could include monitoring for unusual PowerShell command executions (e.g., T1059.001) to reinforce coverage and validate findings from this alert.

