title: PowerShell Core DLL Loaded Via Office Application
id: bb2ba6fb-95d4-4a25-89fc-30bb736c021a
status: test
description: Detects PowerShell core DLL being loaded by an Office Product
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
tags:
- attack.stealth
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\outlook.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|contains:
    - '\System.Management.Automation.Dll'
    - '\System.Management.Automation.ni.Dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the loading of PowerShell Core DLLs by Microsoft Office applications such as Excel, Word, and Outlook. This behavior indicates a possible attempt by adversaries to use these trusted applications as a conduit for executing malicious PowerShell scripts, which could facilitate various attacks, including data exfiltration or remote code execution. Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and "Command and Scripting Interpreter" (T1059).

  The primary telemetry source for this detection is Windows image load events, specifically focusing on processes associated with Office applications. If this behavior is indeed malicious, it can lead to unauthorized actions on the host or network, endangering sensitive information. It's important to note that detection of this behavior does NOT confirm that an attack is underway; further investigation is required to ascertain intent and context.

  ### Investigation Steps

  - **Verify the Office Application Executed:** Check for the originating process via Security Event ID 4688, specifically for an instance of `excel.exe`, `winword.exe`, etc. Analyze the command line arguments for unusual flags or scripts, which may indicate malicious intent.

  - **Examine Loaded Modules:** Review Sysmon Event ID 7 on hosts for details on loaded DLLs. Focus on instances of `System.Management.Automation.Dll` or `System.Management.Automation.ni.Dll` loaded by Office applications. Any unexpected loading of these DLLs warrants further scrutiny.

  - **Check for Previous PowerShell Activity:** Review PowerShell logs (Event ID 4104) for recently executed scripts. Correlate timestamps of the alert with execution timestamps to identify if prior scripts may have established a contextual link.

  - **Assess User Activity and Behavior:** Analyze the user's activity in the context of legitimate use cases. Look for typical Office tasks performed by the user (like document creation or sending emails) during the time of DLL load. Legitimate Office usage may involve typical document files, not paired with script execution.

  - **Identify Signs of Compromise:** Look for unusual network traffic (e.g., outbound connections to unknown IPs) that coincides with the timing of the alert using network logs. Establish baseline network behavior for your environment to better identify abnormal outbound requests.

  ### Prioritization

  This alert has medium severity due to its potential impact on systems running critical business applications and the likelihood of an attacker using a trusted app for malicious purposes. Given that this method is commonly weaponized, swift investigation is critical to determine whether it is a benign occurrence or indicative of broader compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration and availability of Sysmon or relevant logging settings, which are often not uniform across all enterprise environments. Benign activities, such as legitimate administrative tasks or scripted automation for report generation, could trigger this alert. Companion detections, such as monitoring for unusual PowerShell commands (T1059.001), can bolster your ability to recognize malicious conduct in conjunction with these image loads.

