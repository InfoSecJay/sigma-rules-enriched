title: PowerShell Core DLL Loaded Via Office Application
id: bb2ba6fb-95d4-4a25-89fc-30bb736c021a
status: test
description: Detects PowerShell core DLL being loaded by an Office Product
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
tags:
- attack.defense-evasion
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\outlook.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|contains:
    - '\System.Management.Automation.Dll'
    - '\System.Management.Automation.ni.Dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the loading of PowerShell core DLLs by Microsoft Office applications such as Excel, Word, PowerPoint, Outlook, and OneNote. Attackers may exploit this behavior to execute malicious PowerShell scripts or commands within a trusted application environment, thereby bypassing detection by security tools. The objective of such an attack could include executing malware, harvesting credentials, or establishing persistence within the victim's environment using legitimate software tools.

  The relevant MITRE ATT&CK tactics and techniques for this detection rule include **Defense Evasion (T1562)**, wherein adversaries attempt to conceal their malicious actions within legitimate applications, and **Execution (T1059)**, specifically focusing on scripting languages like PowerShell. Such tactics make it crucial for defenders to monitor aberrant behaviors related to trusted applications that typically wouldn't invoke PowerShell directly.

  The primary data sources containing valuable evidence to validate alerts generated by this rule include **image load logs** that register applications opening dynamic link libraries (DLLs), in addition to **process creation events** that provide insights into the context and lineage of executed commands within the Office applications.

  ### Investigation Steps
  - **Review Image Load Logs**: Examine image load logs to identify instances where PowerShell core DLLs are loaded into Office applications, focusing on the timestamps and contextual users involved in the activity.
  - **Analyze Process Creation Events**: Investigate process creation events correlating with the Office applications identified in the rule. Pay close attention to parent-child relationships indicating how PowerShell was invoked.
  - **Inspect Recent Office Document Activity**: Check for any recent actions or modifications to Office files that coincide with the suspicious DLL loading events to assess the legitimacy of the associated documents.
  - **Cross-reference User Behavior**: Analyze the behavior of users triggering these events to determine if they are consistent with their regular patterns or indicative of compromised accounts.

  ### Prioritization
  The severity of this alert is medium given that executing PowerShell via Office applications is a common technique for attackers pursuing stealthy initial access or lateral movement within a network. The potential impact could lead to data breaches or unauthorized access to sensitive systems.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to the possibility of false negatives from other legitimate applications loading PowerShell DLLs. The detection logic assumes that these specific Office applications are primarily used and monitored in the environment, reducing the likelihood of benign activity being incorrectly flagged. Additionally, proper logging configuration is necessary for capturing image load and process creation events effectively to ensure this alert functions accurately.

