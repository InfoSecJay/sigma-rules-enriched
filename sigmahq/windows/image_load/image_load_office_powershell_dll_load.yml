  ---

  ### Technical Context

  This rule detects the loading of the PowerShell core DLL (`System.Management.Automation.Dll`) by various Microsoft Office applications—specifically Excel, Publisher, Outlook, OneNote, PowerPoint, and Word. Attackers may use this behavior to execute malicious PowerShell commands to perform actions like drop and execute malware, steal data, or maintain persistence in the environment. The relevant MITRE ATT&CK techniques includes: **Defense Evasion (T1218)** as this technique is often employed to bypass security measures while executing code.

  The primary telemetry sources for this detection are Windows image load logs, particularly focusing on the loading of DLLs by Office applications. The security impact is significant, as successful exploitation can lead to unauthorized command execution and system compromise. It is important to note that the detection of a DLL being loaded does NOT itself confirm malicious intent; legitimate usage of PowerShell by Office applications may occur in administrative tasks or scripted automation.

  ---

  ### Investigation Steps

  - **Verify application context:** Review the usage of the identified Office application (e.g., `excel.exe`, `winword.exe`) during the alert timeframe. Access Application logs (Event ID 1000) to determine whether users were performing expected activities like creating or editing documents.

  - **Identify the loaded DLLs:** Check the Event ID 4104 for PowerShell logs, focusing on command execution and arguments directly before and after the DLL loading. Look for commands that deviate from normal usage patterns, such as those invoking remote scripts or encodings.

  - **Assess execution contexts:** Analyze Windows Event ID 4688 (Process Creation) for the parent process responsible for launching the Office application. This considers whether the Office application was initiated by a legitimate user process or as a result of suspicious activity (e.g., from a CMD or unexpected process).

  - **Look for PowerShell artifacts:** Review Sysmon Event ID 7 (Image loaded) for additional context regarding the loaded `System.Management.Automation.Dll`. Generate a list of processes that loaded this DLL and correlate with known benign processes to verify legitimacy.

  - **Examine user activity logs:** Monitor users associated with the event for a history of automation through PowerShell in applications like Excel. Confirming a pattern of legitimate usage can indicate benign behavior.

  - **Investigate broader indicators:** Cross-reference other telemetry (e.g., email security logs for suspicious attachments or links) during the time of the alert to identify possible triggers or phishing attempts that could have led to this DLL load.

  ---

  ### Prioritization

  The severity of this alert is medium, as the impacted applications are commonly exploited in various attack scenarios, particularly with phishing campaigns or script-based attacks. While this behavior is not as prevalent as direct PowerShell script execution, its presence still indicates a significant potential for malicious abuse if associated with suspicious commands or user behavior.

  ---

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques where an attacker employs different, non-standard methods to load PowerShell without triggering alerts. Required telemetry must be comprehensive; ensure proper Sysmon configuration to capture DLL loads and PowerShell execution. Legitimate tasks—like using PowerShell for automation or integration in spreadsheets—could also generate alerts. A related detection to reinforce this alert is monitoring for scripts executed via PowerShell (MITRE ID T1059.001) to identify concurrent behaviors indicative of an attack chain.

