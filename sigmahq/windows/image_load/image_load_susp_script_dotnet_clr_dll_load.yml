logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msxsl.exe'
    - '\regsvr32.exe'
            # - '\svchost.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    ImageLoaded|endswith:
    - '\clr.dll'
    - '\mscoree.dll'
    - '\mscorlib.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the loading of .NET Common Language Runtime (CLR) DLLs by scripting applications such as `wscript`, `cscript`, `cmstp`, or other associated executables. The behavior suggests potential misuse of these scripting tools to execute malicious payloads or to carry out privileged operations, given that scripting languages can interface with various system components. It is indicative of adversarial objectives like executing code in a stealthy manner or carrying out privilege escalation attacks.

  The relevant MITRE ATT&CK tactics include Execution (T1203) and Privilege Escalation (T1068). Primary telemetry sources include Windows Event Logs for image load events, particularly focusing on logs indicating process creation (Event ID 4688) correlated with the loading of .NET assemblies. If malicious, this behavior can lead to unauthorized code execution or elevation of privileges. Importantly, this detection does NOT confirm malicious intent solely based on the act of loading a CLR DLL; additional context is required.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for entries containing script host processes (`wscript.exe`, `cscript.exe`, etc.) that are invoking .NET CLR DLLs such as `mscoree.dll` or `mscorlib.dll`. Look for unusual parent processes that deviate from expected behavior.

  - **Cross-reference image loading events:** Verify Windows Event ID 4104 and Sysmon Event ID 10 for any suspicious `.NET` assembly load attempts by the identified processes. Note any instances where a known malicious DLL might be loaded; this serves as a high-confidence indicator.

  - **Identify legitimate usage patterns:** Assess the environment for legitimate applications or scripts that typically load CLR DLLs. For instance, standard system maintenance scripts or internal tools may be expected to invoke `mshta.exe` without malicious payloads.

  - **Analyze script content or execution commands:** If possible, obtain the contents of any scripts or commands executed by the detected processes. Review for encoded or obfuscated commands indicating potential exploitation.

  - **Investigate command-line parameters:** Inspect the command lines used by the associated processes, focusing on unusual flags or arguments that might suggest tampering or unauthorized actions to load DLLs.

  ### Prioritization

  Given the potential impact of executing malicious code on critical systems, this alert warrants immediate attention. The likelihood of misuse is significant, as loading .NET CLR components through scripting applications can be a common tactic for adversaries seeking to gain footholds or elevate privileges. Such activities are often weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations do not capture all relevant events, particularly if script executions are allowed under legitimate user contexts. Common evasion techniques include encoding payloads or using legitimate system scripts to mask malicious behavior. Expected legitimate activities may include automation scripts for internal processes or maintenance tasks. A related detection could involve monitoring for unusual script execution patterns that lack valid user context, further strengthening coverage against potential misuse.

