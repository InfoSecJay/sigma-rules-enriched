title: DotNet CLR DLL Loaded By Scripting Applications
id: 4508a70e-97ef-4300-b62b-ff27992990ea
status: test
description: Detects .NET CLR DLLs being loaded by scripting applications such 
  as wscript or cscript. This could be an indication of potential suspicious 
  execution.
references:
- https://github.com/tyranid/DotNetToJScript
- https://thewover.github.io/Introducing-Donut/
- https://web.archive.org/web/20230329154538/https://blog.menasec.net/2019/07/interesting-difr-traces-of-net-clr.html
- https://web.archive.org/web/20221026202428/https://gist.github.com/code-scrap/d7f152ffcdb3e0b02f7f394f5187f008
author: omkar72, oscd.community
date: 2020-10-14
modified: 2023-02-23
tags:
- attack.defense-evasion
- attack.execution
- attack.privilege-escalation
- attack.t1055
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msxsl.exe'
    - '\regsvr32.exe'
            # - '\svchost.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    ImageLoaded|endswith:
    - '\clr.dll'
    - '\mscoree.dll'
    - '\mscorlib.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the loading of .NET Common Language Runtime (CLR) DLLs by scripting applications such as `wscript.exe`, `cscript.exe`, and others. Such behavior could indicate an attempt by an attacker to execute malicious code or scripts, leveraging the scripting host to execute potentially harmful .NET assemblies. The primary MITRE ATT&CK tactics and techniques relevant here are Execution (T1059) and Defense Evasion (T1218).

  The main telemetry sources for this rule include Windows Image Load logs, specifically capturing events where CLR-related DLLs are loaded. If this activity is malicious, it can lead to arbitrary code execution or privilege escalation. It is essential to note that this detection does NOT confirm malicious intent on its own, as there are benign scenarios where legitimate scripts may load these DLLs.

  ### Investigation Steps

  - **Check for triggered alert in EDR tool:** Look for recent alerts related to `.NET CLR` loading by identified scripting engines (Event ID related to image loads).

  - **Examine the script path and arguments:** Inspect the command-line arguments used with `wscript.exe` or `cscript.exe` (e.g., `process command line` field). Legitimate usage typically includes well-known paths and no obscure arguments.

  - **Validate the loaded DLLs:** Verify the loaded DLLs in the application by analyzing the `ImageLoaded` field in the logs. High-fidelity indicators include `mscoree.dll` or `mscorlib.dll` being loaded by non-standard Windows applications.

  - **Review historical context of similar activities:** Cross-reference the timing and behavior with known patterns of legitimate administrative tasks using PowerShell or scripts.

  - **Assess the asset type and user roles:** Determine if the host is a critical server or workstation and check if the user account involved in the alert has a legitimate need for running such scripts.

  ### Prioritization

  This alert is tagged as high severity due to the potential impact of arbitrary code execution, depending on the privileges of the scripting host. The likelihood of abuse is significant, as attackers commonly utilize these scripting applications for executing malicious scripts. The behavior being monitored is often weaponized in various attack scenarios, underscoring the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection could be limited if the monitoring for image loads is not correctly configured across all systems. Adversaries may attempt to evade detection by using encrypted scripts or disguising malicious intent within benign-looking scripts. Additionally, legitimate system administration tasks can trigger this alert if they involve script-based automation. A companion detection to consider is monitoring for unusual PowerShell command execution that may accompany this type of behavior.

