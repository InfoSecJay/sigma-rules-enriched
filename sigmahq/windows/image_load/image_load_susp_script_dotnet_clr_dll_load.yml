title: DotNet CLR DLL Loaded By Scripting Applications
id: 4508a70e-97ef-4300-b62b-ff27992990ea
status: test
description: Detects .NET CLR DLLs being loaded by scripting applications such as
  wscript or cscript. This could be an indication of potential suspicious execution.
references:
- https://github.com/tyranid/DotNetToJScript
- https://thewover.github.io/Introducing-Donut/
- https://web.archive.org/web/20230329154538/https://blog.menasec.net/2019/07/interesting-difr-traces-of-net-clr.html
- https://web.archive.org/web/20221026202428/https://gist.github.com/code-scrap/d7f152ffcdb3e0b02f7f394f5187f008
author: omkar72, oscd.community
date: 2020-10-14
modified: 2023-02-23
tags:
- attack.defense-evasion
- attack.execution
- attack.privilege-escalation
- attack.t1055
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msxsl.exe'
    - '\regsvr32.exe'
            # - '\svchost.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    ImageLoaded|endswith:
    - '\clr.dll'
    - '\mscoree.dll'
    - '\mscorlib.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where .NET Common Language Runtime (CLR) DLLs are loaded by scripting applications such as `wscript` or `cscript`. This behavior can indicate potential execution of malicious code, especially if it is being triggered by non-standard or unauthorized scripts. Attackers may exploit these scripting environments to execute payloads, perform privilege escalation, or evade detection mechanisms by leveraging well-known Windows components.

  The suspected threat scenario often revolves around threat actors executing payloads covertly via a scripting host, aiming to establish persistence or execute malicious functionality in a stealthy manner. These techniques can be associated with various attack motivations, including data exfiltration, lateral movement, or establishing a foothold within the environment.

  Relevant MITRE ATT&CK Tactics and Techniques include:
  - Execution (T1203): Exploitation for Client Execution
  - Defense Evasion (T1070): Indicator Removal on Host
  - Privilege Escalation (T1055): Process Injection

  The primary data sources that will yield the necessary evidence to investigate these occurrences include image load events, specifically monitoring for any instances of `cscript.exe`, `wscript.exe`, or related applications initiating loads of DLLs typical to .NET frameworks.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate logs for entries corresponding to the execution of `cscript.exe`, `wscript.exe`, or similar applications to identify the context and parameters used during invocation.

  - **Analyze Image Load Events:** Correlate image load events from the logging sources to determine if these scripting applications are loading .NET CLR DLLs, specifically `clr.dll`, `mscoree.dll`, or `mscorlib.dll`.

  - **Check for Anomalous Scripts:** Conduct a thorough review of the scripts being executed by these applications. Look for unusual execution paths, modifications, or obfuscated commands that may indicate malicious intent.

  - **Verify Endpoint Activity:** Review other endpoint activities, including file changes, network connections, and user behavior, that align with the timestamps of the suspicious script executions to understand the broader context of potential malicious behavior.

  ### Prioritization
  The alert is classified as high severity due to the elevated risk posed by malicious use of scripting applications to execute unauthorized code. The ability of attackers to leverage these common tools increases the likelihood of successful exploitation and impacts system integrity and security.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage related to legitimate administrative tasks that commonly use these scripts and DLLs, which may lead to false positives. The detection logic assumes that any invocation of .NET CLR DLLs by scripting applications is suspect, which may not account for all legitimate uses in an enterprise environment. This rule requires comprehensive image load logging and process creation logs to function effectively, necessitating proper configurations in the logging settings to capture these events accurately.

