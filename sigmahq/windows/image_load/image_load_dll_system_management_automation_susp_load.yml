  type: obsolete
status: test
description: |
  Detects loading of essential DLLs used by PowerShell by non-PowerShell process.
  Detects behavior similar to meterpreter's "load powershell" extension.
references:
- https://adsecurity.org/?p=2921
- https://github.com/p3nt4/PowerShdll
author: Tom Kern, oscd.community, Natalia Shornikova, Tim Shelton, Roberto 
  Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2019-11-14
modified: 2026-07-28
tags:
- attack.t1059.001
- attack.execution
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - Description: 'System.Management.Automation'
  - OriginalFileName: 'System.Management.Automation.dll'
  - ImageLoaded|endswith:
    - '\System.Management.Automation.dll'
    - '\System.Management.Automation.ni.dll'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'         # PowerShell 7 preview
    - 'C:\Program Files\PowerShell\7\pwsh.exe'         # PowerShell 7
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\WINDOWS\System32\RemoteFXvGPUDisablement.exe'
    - 'C:\Windows\System32\runscripthelper.exe'
    - 'C:\WINDOWS\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\SyncAppvPublishingServer.exe'
    - 'C:\Windows\System32\winrshost.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\winrshost.exe'
    - 'C:\Windows\SysWOW64\wsmprovhost.exe'
  filter_main_dotnet:
    Image|startswith:
    - 'C:\Windows\Microsoft.NET\Framework\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
    - 'C:\Windows\Microsoft.NET\Framework64\'
    Image|endswith: '\mscorsvw.exe'
  filter_optional_gethelp:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.GetHelp_'
    Image|endswith: '\GetHelp.exe'
  filter_optional_sql_server_mgmt:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft SQL Server Management Studio'
    - 'C:\Program Files\Microsoft SQL Server Management Studio'
    Image|endswith: '\IDE\Ssms.exe'
  filter_optional_sql_server_tools:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft SQL Server\'
    - 'C:\Program Files\Microsoft SQL Server\'
    Image|endswith: '\Tools\Binn\SQLPS.exe'
  filter_optional_citrix:
    Image|endswith: '\Citrix\ConfigSync\ConfigSyncRun.exe'
  filter_optional_vs:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    - 'C:\Program Files\Microsoft Visual Studio\'
  filter_optional_chocolatey:
    Image|startswith: 'C:\ProgramData\chocolatey\choco.exe'
  filter_optional_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
    Image|endswith:
    - '\thor64.exe'
    - '\thor.exe'
        # User: 'NT AUTHORITY\SYSTEM'   # if set, matches all powershell processes not launched by SYSTEM
  filter_optional_aurora:
        # This filter is to avoid a race condition FP with this specific ETW provider in aurora
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Used by some .NET binaries, minimal on user workstation.
- Used by Microsoft SQL Server Management Studio
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `System.Management.Automation.dll` by processes that are not PowerShell executables. This behavior can indicate an attempt by an adversary to use PowerShell functionalities without invoking PowerShell directly, thus evading some detection mechanisms commonly associated with PowerShell usage. The likely attacker objective is to execute malicious commands or scripts stealthily through a non-standard process, which is a technique seen in various attacks, including those leveraging Meterpreter.

  This detection corresponds to the MITRE ATT&CK technique **Execution: PowerShell (T1059.001)**. The primary telemetry sources for this detection are Windows event logs relating to image loads, specifically monitoring for `ImageLoaded` event types. If the detected behavior is malicious, it could result in unauthorized access, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that malicious activity has occurred on its own, as benign applications sometimes load the same DLLs legitimately.

  ### Investigation Steps

  - **Check the image loading process:** Examine the process that triggered the alert by reviewing the relevant process creation logs (Windows Event ID 4688 or Sysmon Event ID 1). Look for anomalous process names or parent processes that are not typical for legitimate applications.

  - **Review DLL loading context:** Analyze the Windows Event logs or Sysmon logs for details on DLLs loaded during the detected event. Focus on Event IDs 10 (for Sysmon) or related fields that provide insights into other recently loaded DLLs and the associated process.

  - **Identify legitimate uses:** Cross-reference the detected process name against known legitimate applications (e.g., SQL Server Management Studio or system applications like 'dsac.exe'). Document any benign processes that have successfully loaded `System.Management.Automation.dll`.

  - **Look for high-confidence malicious indicators:** Investigate if the process loading the DLL operates from non-standard locations (i.e., not from `C:\Program Files\` or similar trusted directories) or if there are other suspicious behaviors, such as unusual network connections initiated by the corresponding process.

  - **Assess asset criticality:** Determine the role of the affected system within the environment (e.g., production server vs. isolated development machine). Higher risk is associated with critical infrastructure or data repositories.

  - **Filenames and artifacts:** Monitor for the creation or modification of files associated with PowerShell scripts or malicious payloads, specifically looking in common temp directories (e.g., `C:\Windows\Temp\`) that could indicate file stashing or exfiltration.

  ### Prioritization

  This alert is of **medium severity** due to the potential risk of PowerShell being misused for malicious purposes, especially if occurring on a high-value system. The likelihood of this technique being weaponized is moderate, considering its common usage in penetration testing and legitimate administration, which necessitates careful contextual analysis during investigation.

  ### Blind Spots and Assumptions

  Detection methods may be limited since legitimate applications can also load `System.Management.Automation.dll`, potentially leading to false positives. It’s essential to ensure proper logging configurations are in place for both process creation and image loads to accurately capture relevant activities. Additionally, benign administrative tasks could occur that trigger this alert, such as certain automation scripts or management operations. A related detection to consider would be monitoring for unusual PowerShell execution instances (using PowerShell event logs), providing additional context to this detection.

