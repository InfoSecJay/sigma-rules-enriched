description: |
  Detects loading of essential DLLs used by PowerShell by non-PowerShell process.
  Detects behavior similar to meterpreter's "load powershell" extension.
references:
- https://adsecurity.org/?p=2921
- https://github.com/p3nt4/PowerShdll
author: Tom Kern, oscd.community, Natalia Shornikova, Tim Shelton, Roberto 
  Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2019-11-14
modified: 2025-10-07
tags:
- attack.t1059.001
- attack.execution
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - Description: 'System.Management.Automation'
  - OriginalFileName: 'System.Management.Automation.dll'
  - ImageLoaded|endswith:
    - '\System.Management.Automation.dll'
    - '\System.Management.Automation.ni.dll'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'         # PowerShell 7 preview
    - 'C:\Program Files\PowerShell\7\pwsh.exe'         # PowerShell 7
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\WINDOWS\System32\RemoteFXvGPUDisablement.exe'
    - 'C:\Windows\System32\runscripthelper.exe'
    - 'C:\WINDOWS\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\SyncAppvPublishingServer.exe'
    - 'C:\Windows\System32\winrshost.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\winrshost.exe'
    - 'C:\Windows\SysWOW64\wsmprovhost.exe'
  filter_main_dotnet:
    Image|startswith:
    - 'C:\Windows\Microsoft.NET\Framework\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
    - 'C:\Windows\Microsoft.NET\Framework64\'
    Image|endswith: '\mscorsvw.exe'
  filter_optional_sql_server_mgmt:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft SQL Server Management Studio'
    - 'C:\Program Files\Microsoft SQL Server Management Studio'
    Image|endswith: '\IDE\Ssms.exe'
  filter_optional_sql_server_tools:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft SQL Server\'
    - 'C:\Program Files\Microsoft SQL Server\'
    Image|endswith: '\Tools\Binn\SQLPS.exe'
  filter_optional_citrix:
    Image|endswith: '\Citrix\ConfigSync\ConfigSyncRun.exe'
  filter_optional_vs:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    - 'C:\Program Files\Microsoft Visual Studio\'
  filter_optional_chocolatey:
    Image|startswith: 'C:\ProgramData\chocolatey\choco.exe'
  filter_optional_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
    Image|endswith:
    - '\thor64.exe'
    - '\thor.exe'
        # User: 'NT AUTHORITY\SYSTEM'   # if set, matches all powershell processes not launched by SYSTEM
  filter_optional_aurora:
        # This filter is to avoid a race condition FP with this specific ETW provider in aurora
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Used by some .NET binaries, minimal on user workstation.
- Used by Microsoft SQL Server Management Studio
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `System.Management.Automation.dll`, a key library for PowerShell, by non-PowerShell processes. Such behavior may indicate an attacker utilizing PowerShell's functionality without starting its executable, potentially leveraging tools like Meterpreter to bypass typical security controls. This behavior typically relates to the Execution tactic within the MITRE ATT&CK framework, specifically under technique T1059.001, which focuses on command and scripting interpreters.

  The primary telemetry source for this detection is the Windows image load events logged in Event ID 10 (Image Load) from the Windows Event Log. If malicious, this behavior can lead to unauthorized command execution, malware deployment, or privilege escalation. Importantly, this detection does not confirm malicious intent or activity on its own as legitimate applications may also load this DLL.

  ### Investigation Steps

  - **Examine Image Load Events:** Review Windows Event Log (Event ID 10) specifically filtering for entries with `ImageLoaded` containing `System.Management.Automation.dll`. Check the `ProcessId` and `ImageLoaded` fields to identify the non-PowerShell process.

  - **Identify Process Origins:** For each flagged event, correlate the `ParentProcessId` from the log to identify what initiated the loading of the DLL. A legitimate invocation usually comes directly from a PowerShell process, whereas a non-PowerShell parent (e.g., `cmd.exe`, `powershell_ise.exe`) might indicate suspicious behavior.

  - **Look for Known Malicious Indicators:** Investigate the presence of known attack tools within the same process. For example, if the parent process is identified as `C:\Windows\Temp\asgard2-agent\thor.exe`, flag it as potentially malicious due to its association with malicious behavior.

  - **Validate Legitimate Use Cases:** Cross-reference the alerting entry with legitimate applications known to utilize this DLL, like Microsoft SQL Server Management Studio (SSMS) or ASP.NET applications, to determine if the behavior can be expected in your environment.

  - **Check for Concurrent Alerts:** Assess the system for related detections such as process creation events (Event ID 4688) that correspond to instances where the same non-PowerShell process was launching other unusual processes.

  - **Evaluate Timeframes and User Privileges:** Determine the context by checking timestamps of the DLL load incidents relative to user login sessions and privilege elevating activities. Unusual times or low-privilege users triggering the load can be suggestive of compromise.

  ### Prioritization

  Given that this detection signals a non-PowerShell process trying to load PowerShell-related libraries, it should be treated with high priority due to the potential for malicious execution. Non-standard use of PowerShell's libraries can lead to advanced persistent threat behavior if abused. The likelihood of malicious use is elevated, as attackers commonly exploit PowerShell for post-exploitation tasks.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use obfuscation techniques or custom DLLs to mimic legitimate behavior. Additionally, it assumes that Windows Event Log (Event ID 10) is enabled and correctly configured; without this logging, the detection will fail. Legitimate activities, such as those initiated by trusted applications or service accounts, may inadvertently trigger the alert. A related detection is monitoring for suspicious commands executed in PowerShell (e.g., T1059.001) across your environment, as this enhances visibility into potential exploitation attempts.

