logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith: '\RstrtMgr.dll'
  - OriginalFileName: 'RstrtMgr.dll'
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\ProgramData\'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\SysNative\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\WUDownloadCache\'
  filter_main_user_software_installations:
    Image|startswith: 'C:\Users\'
    Image|contains|all:
    - '\AppData\Local\Temp\is-'
    - '.tmp\'
    Image|endswith: '.tmp'
  filter_main_admin_software_installations:
    Image|startswith: 'C:\Windows\Temp\'
  filter_optional_onedrive_1:
    Image|startswith: 'C:\Users\'
    Image|endswith:
    - '\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
    - '\AppData\Local\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe'
  filter_optional_onedrive_2:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'     # AppData\Local\Microsoft\OneDrive\26.062.0402.0002\OneDrive.Sync.Service.exe
    Image|endswith: '\OneDrive.Sync.Service.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate Windows processes not currently listed
- Processes related to software installation
level: low
note: |
  ### Technical Context

  This Sigma rule detects the loading of the Restart Manager DLL (RstrtMgr.dll) by processes that typically are not associated with legitimate system operations. Malicious actors may employ this behavior to terminate critical processes during ransomware attacks, which facilitates file encryption (e.g., Conti and Cactus ransomware) or to hinder analysis by shutting down security tools. The relevant MITRE ATT&CK tactics include Impact (T1486) and Defense Evasion (T1685).

  Primary telemetry sources include Windows Image Load events, specifically focusing on Event ID 4688 (Process Creation) and Sysmon Event ID 10 (Image Loaded) to monitor which process is invoking RstrtMgr.dll. If malicious, this behavior can have severe security implications by allowing attackers to manipulate or disrupt essential services or data. Importantly, this detection alone does not confirm malicious activity; further investigation is necessary to correlate it with malicious intent or context.

  ### Investigation Steps

  - **Validate process legitimacy:** Check the process loading RstrtMgr.dll against known benign processes. Look for typical paths like `C:\Windows\System32\` and common applications versus paths like `C:\Users\<username>\AppData\Local\Temp\` that might indicate malicious behavior.

  - **Review Event ID 4688 and Sysmon ID 10:** Analyze Windows Security Event ID 4688 to see the complete command line and parent process details of the process initiating RstrtMgr.dll. Focus on unusual or unexpected parent-child relationships (e.g., scripts or executable files not usually associated with system maintenance).

  - **Correlate with previous alerts:** Check the threat intelligence database for any historical instances of the reported process and RstrtMgr.dll loading. Cross-reference with documented behaviors of known ransomware like Conti or Cactus to identify possible attack patterns.

  - **Inspect for high-confidence indicators:** Look for any additional signs of ransomware activity from the process, such as file modifications in sensitive directories (`C:\Users\<username>\Documents`) or unusually high CPU usage via Task Manager.

  - **Identify legitimate activity:** Highlight common Windows processes or system services that routinely interact with RstrtMgr.dll. Activities such as system updates or user-initiated restarts that invoke the Restart Manager for legitimate purposes can be expected.

  - **Assess host risk and criticality:** Confirm if the affected system has critical roles such as domain controller or database server. Prioritize investigation of alerts where RstrtMgr.dll loading occurs on systems with sensitive data or high-value targets.

  ### Prioritization

  The alert severity is considered low due to the low likelihood of malicious abuse under typical conditions. The behavior is not commonly weaponized unless in conjunction with additional suspicious activity. However, if this behavior is observed on critical systems (e.g., servers), the potential impact escalates due to the risk of significant business disruption.

  ### Blind Spots and Assumptions

  This detection may miss instances where legitimate software installations or updates invoke RstrtMgr.dll due to process manipulation or system configuration changes. Ensure Windows Event Log and Sysmon configurations are set to capture all relevant image load events for comprehensive coverage. Legitimate activities, such as software installation processes and system maintenance tasks, can generate similar alerts. A companion detection to streamline coverage includes monitoring for abnormal process startups that interact with critical system DLLs, enhancing overall threat visibility.

