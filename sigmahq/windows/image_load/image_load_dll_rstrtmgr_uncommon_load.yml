title: Load Of RstrtMgr.DLL By An Uncommon Process
id: 3669afd2-9891-4534-a626-e5cf03810a61
related:
- id: b48492dc-c5ef-4572-8dff-32bc241c15c8
  type: derived
status: test
description: |
  Detects the load of RstrtMgr DLL (Restart Manager) by an uncommon process.
  This library has been used during ransomware campaigns to kill processes that would prevent file encryption by locking them (e.g. Conti ransomware, Cactus ransomware). It has also recently been seen used by the BiBi wiper for Windows.
  It could also be used for anti-analysis purposes by shut downing specific processes.
references:
- https://www.crowdstrike.com/blog/windows-restart-manager-part-1/
- https://www.crowdstrike.com/blog/windows-restart-manager-part-2/
- https://web.archive.org/web/20231221193106/https://www.swascan.com/cactus-ransomware-malware-analysis/
- https://taiwan.postsen.com/business/88601/Hamas-hackers-use-data-destruction-software-BiBi-which-consumes-a-lot-of-processor-resources-to-wipe-Windows-computer-data--iThome.html
author: Luc Génaux
date: 2023-11-28
modified: 2025-12-08
tags:
- attack.impact
- attack.defense-evasion
- attack.t1486
- attack.t1562.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith: '\RstrtMgr.dll'
  - OriginalFileName: 'RstrtMgr.dll'
  filter_main_generic:
    Image|startswith:
    - C:\$WINDOWS.~BT\'
    - C:\$WinREAgent\'
    - C:\Program Files (x86)\'
    - C:\Program Files\'
    - C:\ProgramData\'
    - C:\Windows\explorer.exe'
    - C:\Windows\SoftwareDistribution\'
    - C:\Windows\SysNative\'
    - C:\Windows\System32\'
    - C:\Windows\SysWOW64\'
    - C:\Windows\WinSxS\'
    - C:\WUDownloadCache\'
  filter_main_user_software_installations:
    Image|startswith: C:\Users\'
    Image|contains|all:
    - '\AppData\Local\Temp\is-'
    - '.tmp\'
    Image|endswith: '.tmp'
  filter_main_admin_software_installations:
    Image|startswith: C:\Windows\Temp\'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate Windows processes not currently listed
- Processes related to software installation
level: low
note: |
  ### Technical Context
  This detection rule identifies scenarios where the RstrtMgr.DLL (Restart Manager) is loaded by processes that are not typically associated with legitimate operations. The Restart Manager is a Windows service designed to help applications restart during Windows updates or system restarts, but it has been exploited in various malware campaigns, notably by ransomware families such as Conti and Cactus. The purpose of using this DLL in a malicious context is often to terminate processes that would otherwise block file encryption or to facilitate the shutdown of security software, thereby aiding the execution of harmful activities.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Impact (T1486)**: Data Encrypted for Impact — This technique is used by ransomware to encrypt files on the victim's system.
  - **Defense Evasion (T1562.001)**: Impair Process Control — By manipulating process control with tools like RstrtMgr.DLL, attackers can evade detection and disrupt system defenses.

  Primary data sources that can provide valuable telemetry for this detection include image load events from Windows, particularly where anomalous behavior is displayed by applications attempting to load the RstrtMgr.DLL.

  ### Investigation Steps
  - **Review Image Load Events**: Collect and analyze image load events from Windows logs to identify the specific process that attempted to load RstrtMgr.DLL. Look for uncommon processes or those that do not typically interact with this DLL.
  - **Analyze Process Hierarchies**: Investigate the parent-child relationships of the processes involved. Suspicious processes loading RstrtMgr.DLL may have unusual parent processes or execute in odd behavioral patterns indicative of malicious intent.
  - **Inspect Associated File Paths**: Check the file paths from which the RstrtMgr.DLL was loaded. Legitimate processes typically load this DLL from standard system directories, while loads from unusual paths (e.g., user temporary files, custom installations) could indicate malicious activity.
  - **Correlate with Known Threats**: Cross-reference the detected process with known information about ransomware and wiper malware that utilize the RstrtMgr.DLL for malicious actions, such as killing processes to secure file encryption.

  ### Prioritization
  The alert is classified as low severity due to the potential for legitimate processes to load RstrtMgr.DLL in benign scenarios, such as software updates or installations. However, the likelihood of exploitation increases in environments that have experienced previous ransomware incidents, making prompt investigation advisable.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate processes that are not currently captured in the false positive list but could validly interact with RstrtMgr.DLL. The rule assumes that the telemetry for image load events is enabled and sufficiently detailed to trigger an alert. If logs from unusual image loads are missing or misconfigured, detection could be impaired, potentially allowing malicious activity to go unnoticed.

