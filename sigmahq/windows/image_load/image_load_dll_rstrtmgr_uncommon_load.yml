logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith: '\RstrtMgr.dll'
  - OriginalFileName: 'RstrtMgr.dll'
  filter_main_generic:
    Image|startswith:
    - C:\$WINDOWS.~BT\'
    - C:\$WinREAgent\'
    - C:\Program Files (x86)\'
    - C:\Program Files\'
    - C:\ProgramData\'
    - C:\Windows\explorer.exe'
    - C:\Windows\SoftwareDistribution\'
    - C:\Windows\SysNative\'
    - C:\Windows\System32\'
    - C:\Windows\SysWOW64\'
    - C:\Windows\WinSxS\'
    - C:\WUDownloadCache\'
  filter_main_user_software_installations:
    Image|startswith: C:\Users\'
    Image|contains|all:
    - '\AppData\Local\Temp\is-'
    - '.tmp\'
    Image|endswith: '.tmp'
  filter_main_admin_software_installations:
    Image|startswith: C:\Windows\Temp\'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate Windows processes not currently listed
- Processes related to software installation
level: low
note: |
  ### Technical Context

  This Sigma rule detects the loading of the RstrtMgr.dll (Restart Manager) by uncommon processes, which often indicates potential malicious activity. Attackers may be leveraging this DLL to terminate processes that would interfere with ransomware operations, such as file encryption, or for anti-analysis measures during malware execution. This behavior maps to the MITRE ATT&CK technique T1486 (Data Encrypted for Impact) and technique T1562.001 (Impair Defenses: Disable or Alter Tools).

  Primary telemetry sources include Windows image load logs, specifically looking for Event ID 300 (Image Load) with the appropriate fields indicating the loaded image and its source. If malicious, the security impact could be significant, potentially leading to data loss or system compromise. It is crucial to note that this detection does NOT confirm that an incident has occurred on its own; further investigation is necessary to establish intent and impact.

  ### Investigation Steps

  - **Identify the process loading RstrtMgr.dll:** Check Windows event logs (Event ID 300 - Image Load) for instances where 'RstrtMgr.dll' is loaded by processes that do not match known benign patterns or regular installation paths.

  - **Check the source of the loading process:** Validate the loading path of the process. Benign usages typically originate from the 'C:\Windows' or 'C:\Program Files' directories. Any process loading this DLL from user directories or temporary folders ('C:\Users\<USER>\AppData\Local\Temp\') should raise suspicion.

  - **Review associated process activity:** Cross-reference with related logs for the invoking process (Event ID 4688 - Process Creation) to capture the command line parameters used, especially looking for suspicious prefixes or arguments that might indicate an offensive intent.

  - **Assess the system criticality:** Determine the role of the affected system (e.g., server, workstations, or critical infrastructure) to understand the potential impact of a malicious actor successfully leveraging this detection.

  - **Document expected behavior:** Legitimate processes, such as Windows Update or authorized software installers, may use RstrtMgr.dll during updates or installations. Identify any recent updates or installations related to affected systems.

  - **Confirm known malicious indicators:** Investigate if the process name or its path closely matches known malicious behaviors related to ransomware, such as presence in threat intelligence feeds. Processes originated from directories designed for user-level software installation rather than system operations should be a high-confidence indicator of compromise.

  ### Prioritization

  This alert should be considered high severity within an enterprise context due to the implications of process termination related to ransomware activities. With the critical nature of the systems involved, the likelihood of malicious abuse by adversaries is elevated, particularly because this DLL is weaponized in known campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for comprehensive logging configurations; if certain paths are not logged or monitored, legitimate activity may bypass detection. Additionally, typical software installation processes could result in false positives if they utilize RstrtMgr.dll. A companion detection to strengthen coverage would be the monitoring of processes terminating via Event ID 4689 (Process Termination) in conjunction with this alert to provide a clearer picture of potential threats.

