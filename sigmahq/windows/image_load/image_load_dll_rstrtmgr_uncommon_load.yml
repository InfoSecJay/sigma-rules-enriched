logsource:
  category: image_load
  product: windows
detection:
  selection:
  - ImageLoaded|endswith: '\RstrtMgr.dll'
  - OriginalFileName: 'RstrtMgr.dll'
  filter_main_generic:
    Image|startswith:
    - C:\$WINDOWS.~BT\'
    - C:\$WinREAgent\'
    - C:\Program Files (x86)\'
    - C:\Program Files\'
    - C:\ProgramData\'
    - C:\Windows\explorer.exe'
    - C:\Windows\SoftwareDistribution\'
    - C:\Windows\SysNative\'
    - C:\Windows\System32\'
    - C:\Windows\SysWOW64\'
    - C:\Windows\WinSxS\'
    - C:\WUDownloadCache\'
  filter_main_user_software_installations:
    Image|startswith: C:\Users\'
    Image|contains|all:
    - '\AppData\Local\Temp\is-'
    - '.tmp\'
    Image|endswith: '.tmp'
  filter_main_admin_software_installations:
    Image|startswith: C:\Windows\Temp\'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate Windows processes not currently listed
- Processes related to software installation
level: low
note: |
  ### Technical Context

  This rule detects when the RstrtMgr.dll (Restart Manager) is loaded by an uncommon process. Attackers may utilize this DLL to terminate processes that would hinder file encryption, especially during ransomware incidents such as those involving Conti or Cactus ransomware. The MITRE ATT&CK techniques relevant to this detection include T1486 (Data Encrypted for Impact) and T1685 (Data Destruction).

  The primary telemetry sources are Windows image load events, specifically looking for ImageLoaded-related events. If the alert is associated with a malicious actor, the security impact could involve data loss or service disruption. However, this detection alone does not confirm malicious activity, as benign processes may also invoke this DLL under specific conditions.

  ### Investigation Steps

  - **Review process origins:** Check the process initiating the RstrtMgr.dll load using Sysmon Event ID 1 for 'CommandLine' and 'ProcessId' fields. Legitimate loads occur from standard Windows paths; query logs for paths like `C:\Windows\System32\` or `C:\Program Files\`. Uncommon paths indicate potential malicious activity.

  - **Analyze loading processes:** Gather Windows Event ID 4688 (process creation) logs for the process associated with the RstrtMgr.dll load. Look for unusual parent-child relationships or execution from non-standard directories, especially those less frequently used by trusted software.

  - **Evaluate execution frequency:** Review frequency and context of RstrtMgr.dll usage across the environment over the last 30 days. Sudden spikes or usage by processes not traditionally associated with application installs may indicate malfeasance.

  - **Identify potential process trees:** Use parent process analysis to establish context; guard against benign activity initiated by regular systems, like Windows Update components. Malicious exploitation often shows inconsistent or unexpected parent-child hierarchies.

  - **Correlate with other alerts:** Check for any related alerts or entries in the security logs, particularly those reflecting T1486 or T1685 activities. A pattern of malicious behavior across systems may increase the confidence in a threat being present.

  ### Prioritization

  This alert is considered low severity due to its potential benign triggers, typically arising from legitimate software installations. However, given the involvement of RstrtMgr.dll in notable ransomware campaigns, any detection warrants timely investigation, particularly in sensitive environments where data protection is paramount.

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate software using RstrtMgr.dll during installations, which may dilute detection rates. Ensure Windows image load event logging is correctly configured to capture all relevant data. Additionally, scheduled system updates could inadvertently trigger this alert, reflecting normal operations rather than malicious intent. Related detections, such as process terminations involving RstrtMgr.dll, would enhance monitoring of potential attack vectors.

