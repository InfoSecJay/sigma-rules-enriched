detection:
  selection:
    ImageLoaded|endswith: '\mfdetours.dll'
  filter_main_legit_path:
    ImageLoaded|contains: ':\Program Files (x86)\Windows Kits\10\bin\'
    SignatureStatus: 'Valid'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the sideloading of the unsigned DLL "mfdetours.dll" through the execution of "mftrace.exe," which may allow an adversary to manipulate arbitrary processes on the system. The likely attacker objective is to achieve persistence and escalate privileges within the environment by injecting malicious functionality into legitimate processes. This behavior corresponds to the MITRE ATT&CK technique for DLL Side-Loading (T1574.001).

  Primary telemetry sources include Windows image load events, specifically targeting Event ID 4104 from PowerShell, as well as Sysmon Event ID 7, which logs DLL loading information. The security impact of successful exploitation includes potential unauthorized access and system control by an attacker. This detection does NOT confirm that the activity is indeed malicious without additional context, as benign applications could also perform similar actions.

  ### Investigation Steps

  - **Check image load events for mfdetours.dll:** Verify Sysmon Event ID 7 for instances of "mfdetours.dll" being loaded in unusual directories outside of trusted paths, which may suggest malicious intent.

  - **Assess the execution of mftrace.exe:** Review Security Event ID 4688 for process creation logs detailing command-line parameters used with "mftrace.exe". Malicious uses often involve paths that do not follow standard application directories.

  - **Validate legitimate behavior:** Determine if "mfdetours.dll" is loaded from the legitimate installation path (e.g., `C:\Program Files (x86)\Windows Kits\10\bin\`). Confirm that the signature status of the DLL is "Valid".

  - **Identify known malicious indicators:** Search for hierarchical paths or file names linked to known malware that also use "mfdetours.dll". Cross-reference with threat intelligence for associated hashes or known file artifacts.

  - **Correlate with additional telemetry:** Check for related PowerShell logs (Event ID 4104) where "mftrace.exe" is invoked, particularly concerning suspicious arguments indicating attempts to attach to critical system processes.

  ### Prioritization

  This alert is high severity due to its potential impact on critical systems and the likelihood of abuse by adversaries employing DLL sideloading techniques. Given the sophistication associated with DLL injection, this behavior may be a precursor to more extensive attacks.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of necessary logging configuration, as not all systems log image loads by default. Legitimate applications may also invoke "mfdetours.dll" without malicious intent, which could generate false positives. A related detection to enhance coverage is monitoring for exploits related to process injection techniques, as they may provide additional context surrounding the threat landscape.

