note: |
  ### Technical Context

  This Sigma rule detects the execution of the 'mfdetours.dll' file, which may indicate potential DLL sideloading—an attack technique where a malicious DLL is loaded in place of a legitimate library. The likely objective of this activity is to gain persistence or escalate privileges by injecting code into a legitimate process. This behavior aligns with the MITRE ATT&CK tactic for "Persistence" (TA0003) using the technique ID "DLL Side-Loading" (T1574.001).

  The primary telemetry source is Windows Image Load logs, specifically watching for instances where 'mfdetours.dll' is loaded outside of the expected directory, i.e., not from valid paths such as 'C:\Program Files (x86)\Windows Kits\10\bin\'. If successful, this could allow an adversary to run arbitrary code with the permissions of the host process. Importantly, while this detection indicates potential suspicious behavior, it does not confirm that malicious activity has definitively occurred without further investigation.

  ### Investigation Steps

  - **Check process execution context:** Review the parent process of any observed 'mfdetours.dll' loading using Security Event ID 4688 and confirm if it is a trusted application, such as 'mftrace.exe'. Malicious indicators include loading from locations outside trusted paths.

  - **Audit system log sources:** Query Event ID 1074 from the Windows System log for unexpected system restarts or shutdowns that may indicate attempts by the attacker to manipulate the system state around the DLL load.

  - **Identify legitimate usage:** Cross-reference the process and DLL activity with known legitimate usage of 'mftrace.exe' in your environment, noting expected directory paths and authorized personnel. Legitimate usage generally involves 'mftrace.exe' loading 'mfdetours.dll' from ['C:\Program Files (x86)\Windows Kits\10\bin\'].

  - **Analyze signature information:** Look at the SignatureStatus of DLLs using Sysmon Event ID 7 to confirm whether 'mfdetours.dll' is signed. Unsigned DLLs loaded unexpectedly could indicate malicious activity.

  - **Search for unusual command line arguments:** Use Sysmon Event ID 1 to inspect the command line parameters of the process invoking 'mfdetours.dll'. Suspicious indicators include arguments that don't align with legitimate function calls or parameters.

  - **Correlate with threat intelligence and other alerts:** Check for any related alerts for similar DLL sideloading behaviors either using other detection rules or by referencing the identified relationship to the similar Sigma rule (ID: d2605a99-2218-4894-8fd3-2afb7946514d).

  ### Prioritization

  This alert holds high severity as it involves the potential execution of arbitrary code which could lead to significant breaches of integrity and availability. The likelihood of malicious usage is high due to the nature of DLL sideloading being frequently weaponized by attackers to insert malicious payloads into legitimate processes.

  ### Blind Spots and Assumptions

  Detection may be limited by log configuration; ensuring that Image Load logs are properly captured is essential. Attackers could employ evasion techniques such as altering the DLL's signature or using process hollowing. Legitimate software installation or debugging may trigger the alert coincidentally. Companion detections include monitoring for suspicious modifications in process integrity checks or registry changes which might enhance coverage around persistence mechanisms.

