title: Potential Rcdll.DLL Sideloading
id: 6e78b74f-c762-4800-82ad-f66787f10c8a
status: test
description: Detects potential DLL sideloading of rcdll.dll
references:
- https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
author: X__Junior (Nextron Systems)
date: 2023-03-13
modified: 2023-03-15
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\rcdll.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading attempts involving the `rcdll.dll` file. DLL sideloading is a method commonly employed by attackers to execute malicious payloads by loading a DLL from a trusted executable path instead of the malicious file’s true location. The attacker’s objective could be to maintain persistence, elevate privileges, or evade detection by utilizing seemingly legitimate software.

  In this scenario, an attacker may compromise a system through various vectors and subsequently attempt to load `rcdll.dll` to execute arbitrary code or deliver malware on the target system while hiding the malicious behavior behind legitimate processes. The relevant tactics and techniques from the MITRE ATT&CK framework include **Persistence (T1547)** and **Defense Evasion (T1574.001)**, both of which encompass methods for maintaining a foothold in a system and avoiding detection mechanisms, respectively.

  The primary data sources that will provide evidence for this detection include image load events on Windows systems, which log dynamic link library (DLL) loads and their respective process information. Monitoring these events can highlight abnormal behaviors indicative of sideloading attempts.

  ### Investigation Steps
  - **Review Image Load Events**: Examine recent image load events for instances where `rcdll.dll` is loaded, especially from paths outside of legitimate software directories, such as the ones listed in the rule.

  - **Check Affiliated Processes**: Identify the parent process associated with the loading of `rcdll.dll`. Determine whether the parent process is a trusted application or an anomaly that could indicate malicious activity.

  - **Correlate with Other Logs**: Cross-reference logs from related sources such as EDR (Endpoint Detection and Response) and SIEM (Security Information and Event Management) to identify any other suspicious activities or known indicators of compromise associated with the timeframe of the DLL load.

  - **Investigate System Changes**: Look for changes in system configuration or applications that may correlate with the loading of `rcdll.dll`, as this may provide context for potential exploitation or lateral movement within your environment.

  ### Prioritization
  The severity of this alert is high due to the potential impact of a successful DLL sideloading attack, which can lead to significant privilege escalation, system compromise, and data exfiltration. The likelihood of attackers using such techniques is high, given the efficacy and stealth they provide.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is the reliance on the monitoring of image load events specifically for `rcdll.dll`, which may not cover other similarly malicious DLLs that attackers could deploy. The detection logic assumes that there are no other legitimate instances of `rcdll.dll` that could arise from benign activity. This rule requires complete image load logs, which may not be enabled or collected consistently across all endpoints, limiting the potential for detection.

