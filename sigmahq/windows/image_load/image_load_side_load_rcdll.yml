logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\rcdll.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the loading of the `rcdll.dll` file from potentially unsafe paths that do not correspond to known safe directories associated with Microsoft Visual Studio or Windows SDKs. The likely attacker objective is to achieve persistence or privilege escalation by loading a malicious DLL masquerading as a legitimate system component. This behavior fits within the MITRE ATT&CK tactics of Persistence (T1547) and Defense Evasion (T1574.001).

  The primary telemetry sources include Windows Event Logs related to image loading (specifically ImageLoad events). If malicious, the impact could involve unauthorized access to system resources and potential system compromise. It is critical to note that this detection does NOT confirm that the loaded DLL is malicious on its own; further investigation is required to assess the context fully.

  ### Investigation Steps

  - **Check loaded images: ** Investigate Event ID 4688 (process creation) and correlate with Sysmon Event ID 7 (Image Load) to identify the complete process chain for `rcdll.dll`. Look for abnormal parent processes that differ from typical development tools or applications.

  - **Identify process origin: ** Examine the process loading `rcdll.dll` to determine if it originated from known safe paths. Investigate potential anomalies in the Image Load events, prioritizing instances not initiated from directories like `C:\Program Files (x86)\Microsoft Visual Studio\`.

  - **Assess digital signatures: ** Validate the digital signature of `rcdll.dll` by checking the file properties and content in the file system. Legitimate loads from Microsoft should show valid signatures from known Microsoft entities.

  - **Review process activity: ** Monitor for related suspicious behavior from the process that loaded the DLL, such as unusual network connections (e.g., outbound connections to uncommon IPs or domains) or attempts to access sensitive resources.

  - **Correlate with known threats:** Check against threat intelligence sources to see if `rcdll.dll` or related indicators have been reported in the context of active threats or known exploits.

  ### Prioritization

  This alert should be treated with high priority due to the implications of potential DLL sideloading. Given that this technique is often weaponized in attacks targeting persistence and evasion, it signals a credible risk, especially if triggered on an endpoint with sensitive information or critical functions.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques employed by attackers to mask the loading of malicious DLLs. Required log sources include comprehensive logging of ImageLoad events, necessitating Sysmon installation. Legitimate applications, especially custom or development tools, may trigger this alert if they utilize `rcdll.dll` or similar names. A companion detection rule focusing on unusual parent processes or a combination of API calls related to DLL loading could enhance overall visibility and context around this potential threat.

