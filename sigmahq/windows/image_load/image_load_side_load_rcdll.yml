  ---

  ### Technical Context

  The Sigma rule detects the unauthorized loading of `rcdll.dll`, which may indicate a potential DLL sideloading attack. This behavior aligns with an adversary's objective to maintain persistence on a system by tricking it into loading a malicious DLL instead of the legitimate one. The relevant MITRE ATT&CK tactic is Persistence, specifically Technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources are Windows Image Load logs, specifically monitoring for image load events indicating that `rcdll.dll` has been loaded from unauthorized paths. If malicious, this can have significant security implications, potentially allowing an adversary to run arbitrary code with the privileges of the application that loaded the DLL. This detection does NOT confirm that the DLL is malicious by itself; additional context and investigation are required to determine its intent.

  ---

  ### Investigation Steps

  - **Check the Image Load Path:** Review the logs for ImageLoaded events (Event ID 36868) where the loaded image is `rcdll.dll`. Confirm none of the paths start with the legitimate sources mentioned in the filter (e.g., `C:\Program Files (x86)\Microsoft Visual Studio\`).

  - **Assess Associated Processes:** Identify the parent process of `rcdll.dll` using Security Event ID 4688 (Process Creation) to determine if the process is legitimate (e.g., `devenv.exe` for Visual Studio) or potentially malicious (i.e., processes not aligned with standard operations).

  - **Validate Image Signature:** Use Sysinternals tools (e.g., sigcheck) to verify the digital signature of `rcdll.dll`. Legitimate versions should be signed by Microsoft. An unsigned or invalid signature could indicate malicious activity.

  - **Check for Other Suspicious DLL Loads:** Review the same image load logs for other potentially harmful DLLs or unusual loading patterns that accompany the `rcdll.dll` loading, especially if these involve obscure or non-standard locations.

  - **Identify Network Activity:** If possible, analyze network logs for any outbound connections from the process that loaded `rcdll.dll`. Look for anomalies, such as connections to known malicious IPs or unusual data exfiltration attempts, using tools like Windows Firewall logs (Windows Event ID 5156).

  ---

  ### Prioritization

  This alert should be treated as high severity due to its association with potential persistence mechanisms that adversaries frequently exploit. The impacted systems may have critical roles in the enterprise, and DLL sideloading is often utilized in attack strategies, making it crucial to address promptly.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by cases where legitimate applications utilize DLL sideloading for valid purposes. It is essential to ensure that detailed logging is enabled for image loads and that any legitimate sideloading practices are well documented. Companion detections include monitoring for unusual parent-child process relationships and process creations that follow the loading of `rcdll.dll`, which can strengthen the investigation.

