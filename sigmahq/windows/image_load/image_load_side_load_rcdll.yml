logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\rcdll.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Windows Kits\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential sideloading of the malicious `rcdll.dll` file in a Windows environment. An attacker may use DLL sideloading to execute malicious code by placing a malicious DLL alongside a legitimate application, exploiting trust in the application's directory. This activity typically aligns with the MITRE ATT&CK tactic of Persistence (TA0003), specifically technique T1574.001 (DLL Side-Loading).

  The primary telemetry source is Windows image load events, specifically monitoring for processes loading the `rcdll.dll` file outside of designated directories. If successful, this behavior could lead to unauthorized execution of code, privilege escalation, and potential control over the affected system. Notably, this detection does NOT confirm that the loaded DLL is malicious on its own; further investigation is necessary.

  ### Investigation Steps

  - **Check the execution context:** Verify the parent process of the image load. Investigate if a legitimate program like `VS.exe` or `Windows Kits` initiated the load. Use Security Event ID 4688 for process creation details.

  - **Identify the path of the DLL:** Review the full file path associated with the `rcdll.dll`. Legitimate loads would be from specific Microsoft directories (e.g., `C:\Program Files (x86)\Microsoft Visual Studio\`). Any loads from other locations (e.g., `C:\Users\Public\`) could indicate malicious activity.

  - **Extract file attributes:** Perform a file analysis on `rcdll.dll` using tools like Sysinternals’ `Sigcheck` or PowerShell to inspect the file signature, hash, and created date. Malicious DLLs often lack valid signatures or have suspicious metadata.

  - **Correlate with network activity:** Check for related outbound connections using network logs. Monitor for unusual traffic patterns or connections that may indicate data exfiltration tied to the process invoking the DLL.

  - **Examine system changes:** Look for modifications in system configurations or other file manipulations that correspond with the DLL loading event. Relevant logs include Windows Event ID 5140 for file share access or any file creation events in critical directories.

  ### Prioritization

  This alert is high-severity due to the potential impact on system integrity and the likelihood of exploit in environments where trusted applications are present. DLL sideloading is a well-documented method for initial access and persistence used by various adversaries, making it a significant vector for compromise.

  ### Blind Spots and Assumptions

  The detection may miss sophisticated evasion techniques such as renaming the DLL or altering the loading path. Reliable detection requires proper logging configurations for image load events, which might not always be enabled. False positives could arise from legitimate development scenarios where valid DLLs are loaded. A related detection to consider is monitoring for process injection attempts, which can indicate attempts to manipulate already running processes.

