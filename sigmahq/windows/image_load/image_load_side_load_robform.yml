logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\roboform.dll'
    - '\roboform-x64.dll'
  filter_main_path:
    Image|startswith:
    - ' C:\Program Files (x86)\Siber Systems\AI RoboForm\'
    - ' C:\Program Files\Siber Systems\AI RoboForm\'
    Image|endswith:
    - '\robotaskbaricon.exe'
    - '\robotaskbaricon-x64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- If installed on a per-user level, the path would be located in 
  "AppData\Local". Add additional filters to reflect this mode of installation
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of `roboform.dll`, which is utilized by the RoboForm Password Manager. The attacker objective behind this behavior could involve executing malicious code under the guise of a legitimate application, thus likely aiming to maintain persistence or escalate privileges on the target system. The relevant MITRE ATT&CK tactics are **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically the technique for **DLL Search Order Hijacking** (T1574.001).

  Primary telemetry sources include Windows image load events, particularly looking for Event IDs that relate to DLL loading activities. If malicious, this detection can indicate unauthorized software execution or a compromised system state. However, it is important to note that the detection alone does not confirm malicious intent; it may also encompass legitimate behaviors such as authorized installations or updates of RoboForm.

  ### Investigation Steps

  - **Examine loaded DLLs: ** Investigate Windows Event ID 4104 or Sysmon Event ID 7 to check for the specific loading of `roboform.dll` or `roboform-x64.dll`. Observe the image path to confirm it originated from `C:\Program Files\Siber Systems\AI RoboForm\`. Benign instances will show the legitimate installation path without suspicious parent processes.

  - **Assess process lineage: ** Review process execution context using Sysinternals Process Explorer or Sysmon Event ID 1, particularly focusing on `robotaskbaricon.exe` or `robotaskbaricon-x64.exe` as the parent process. Anomalies such as unexpected parent-child relationships with non-legitimate software need to be flagged as suspicious.

  - **Check for installation methods: ** If the DLL is located within a user profile path (e.g., `AppData\Local`), it might suggest per-user installations. Legitimate installations will have distinct timestamps and associated user IDs. If deviations from standard installation patterns are observed, these should be flagged for further review.

  - **Identify any related activity: ** Monitor network connections via Windows Firewall logs (Event ID 5156) and identify if `robotaskbaricon.exe` makes external requests. Malicious behavior typically includes unexpected outbound connections or communication with known malicious IPs.

  - **Validate change logs: ** Review relevant logs for changes or updates to the RoboForm installation, including MSI logs or Windows Installer events (Event IDs 1033/1034). Legitimate updates will include documented software version changes and regular vendor release timelines.

  ### Prioritization

  This alert poses a medium severity level due to the possibility of DLL sideloading leading to escalation of privileges or persistent threats within the environment. The likelihood of this behavior being malicious is non-trivial as adversaries often exploit legitimate software mechanisms to embed harmful payloads, though this technique is not universally weaponized.

  ### Blind Spots and Assumptions

  Detection limitations include potential benign applications that utilize RoboForm libraries for genuine purposes, which could generate false positives. Evasion techniques might involve altering or hiding the legitimate path of DLL files or using code signing to disguise malicious payloads. Required log sources include Sysmon and Windows Event logs for comprehensive coverage. A related detection could involve monitoring anomalous process executions that fall outside the ordinary behavioral patterns for `robotaskbaricon.exe` to strengthen alert validity.

