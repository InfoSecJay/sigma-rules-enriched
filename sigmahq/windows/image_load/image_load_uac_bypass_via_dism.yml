  ---

  ### Technical Context

  This Sigma rule detects the behavior of loading a fake version of `dismcore.dll` through `dism.exe`, which is indicative of an attempt to bypass User Account Control (UAC). The likely attacker objective is to execute privileged commands without proper consent, thereby escalating privileges and maintaining persistence on the target system. This technique relates to the MITRE ATT&CK tactics of “Persistence” (TA0003) and “Privilege Escalation” (TA0004), specifically techniques T1548.002 (Bypass UAC: DLL Search Order Hijacking) and T1574.001 (Code Signing).

  The primary telemetry sources include Windows image load events, specifically monitoring the loading process of `dism.exe` and associated modules. If the alert is triggered, it could indicate a high security impact, as successful execution may allow an attacker to modify system settings or gain further access. However, this detection does NOT confirm malicious intent on its own, as legitimate processes may interact with `dism.exe` and load `dismcore.dll` under controlled circumstances.

  ---

  ### Investigation Steps

  - **Check process execution details:** Review Security Event ID 4688 for `dism.exe`. Determine the parent process and verify if it is spawned from a suspicious source or legitimate administrative tools.

  - **Analyze image load events:** Investigate Windows Event ID 4104 (PowerShell logs) or Sysmon Event ID 10 (Image Load) for the loading of `dismcore.dll`. Look for the file path to ensure it is loaded from `C:\Windows\System32\Dism\dismcore.dll`. Loading from unexpected paths is a malicious indicator.

  - **Correlate with user activity logs:** Analyze the User Access logs or authentication logs to determine if the user executed the `dism.exe`, and cross-reference against known administrative activities. Look for unusual command-line arguments that indicate potential abuse.

  - **Identify benign interactions:** Investigate if legitimate software or scripts on the system were designed to utilize `dism.exe`, such as system configuration tools, which may show expected usage of `dismcore.dll`.

  - **Check for additional compromise indicators:** Look for other indicators of compromise such as unusual network activity during the time of the alert. Check for outbound connections related to data exfiltration or command and control, specifically during the execution time of `dism.exe`.

  ---

  ### Prioritization

  This alert should be considered high priority due to its indication of a potential privilege escalation attempt in sensitive environments. The capability to bypass UAC directly affects administrative integrity, and this behavior is commonly weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  There may be evasion techniques that involve legitimate use of `dism.exe` by approved applications or administrators, which could trigger this alert. Reliable detection requires appropriate configuration of Sysmon and the monitoring of image load events. Legitimate tools performing UAC operations may also lead to false positives. Related detections, such as monitoring task creations or command-line usage of `dism.exe`, can enhance overall visibility into this behavior.

