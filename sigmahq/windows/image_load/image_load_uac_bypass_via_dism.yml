level: high
note: |
  ### Technical Context

  This rule detects attempts to load a malicious DLL (`dismcore.dll`) following a process execution of `dism.exe`, indicative of potential User Account Control (UAC) bypass techniques commonly seen in privilege escalation attempts. The likely objective of the attacker is to execute unauthorized code with elevated privileges to gain control over the system or to perform system-level changes. This behavior aligns with the MITRE ATT&CK tactic of **Privilege Escalation** and the technique **T1548.002: Abuse Elevation Control Mechanism: Bypass User Account Control**.

  The primary telemetry sources for this detection are Windows Event logs related to image load events, specifically looking at the process creation events from Sysmon (Event ID 1) and the image load events which indicate when executables and DLLs are loaded into memory. If this rule is triggered, it signifies that a process attempted to load a non-standard or unexpected DLL, which is indicative of a potentially malicious activity, leading to concerns about unauthorized system access. However, this detection does NOT confirm that the operation was malicious on its own, as it may also be triggered by benign uses of the `dism.exe` utility.

  ### Investigation Steps

  - **Verify process creation details:**
    Check Sysmon Event ID 1 for the creation of `dism.exe`. Confirm if the parent process is legitimate (e.g., system applications) or unusual (e.g., unknown scripts or executables).

  - **Inspect DLL loading events:**
    Review Sysmon Event ID 7 for the loading of `dismcore.dll`. Verify that the loading source is only from legitimate paths (e.g., `C:\Windows\System32\Dism\`) and not from temporary or suspicious directories.

  - **Identify unusual command-line arguments:**
    Look for suspicious command-line parameters associated with `dism.exe` in Event ID 4688. Legitimate usages should generally have standard switches (e.g., `/Image`, `/Online`) and should not call for unauthorized operations.

  - **Check for indicators of persistence:**
    Investigate for any scheduled tasks or registry modifications adding persistence related to `dismcore.dll`. Cross-reference with Windows Event ID 4801 (registry key modification) to understand any changes made.

  - **Assess the affected system's role:**
    Identify if the affected host is a critical asset (e.g., a domain controller or a server hosting sensitive data). Systems with elevated privilege roles must be prioritized for response.

  - **Look for related file creation:**
    Correlate the activity with potential file creation events by checking Windows Event ID 4663, looking for access to `C:\Windows\System32\Dism\dismcore.dll` to confirm if it was indeed created or modified as part of malicious actions.

  ### Prioritization

  This alert is of high severity because it is associated with privilege escalation, which could allow an adversary to gain control over sensitive systems or data. The likelihood of abuse is significant, as this specific behavior has been weaponized in various attacks targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion tactics like renaming the DLL or using a different file path for injection that would not trigger the rule. Ensure that telemetry from Sysmon is properly configured and capturing all necessary image loads; without this, detection will be incomplete. Legitimate processes, such as software updates or automated scripts, may inadvertently trigger this alert. Companion detections, such as monitoring for other DLL injection techniques (e.g., T1574: Hijacking, T1203: Exploitation of Client Execution), can enhance detection coverage for similar threats.

