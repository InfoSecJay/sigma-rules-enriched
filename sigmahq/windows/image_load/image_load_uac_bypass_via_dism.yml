detection:
  selection:
    Image|endswith: '\dism.exe'
    ImageLoaded|endswith: '\dismcore.dll'
  filter:
    ImageLoaded: 'C:\Windows\System32\Dism\dismcore.dll'
  condition: selection and not filter
falsepositives:
- Actions of a legitimate telnet client
level: high
note: |
  ### Technical Context
  This detection rule identifies potential User Account Control (UAC) bypass techniques through the loading of a malicious DLL (`dismcore.dll`) when the legitimate `dism.exe` process runs on Windows systems. Attackers may utilize this method to escalate privileges or execute arbitrary code in the context of a higher-privilege user, circumventing security measures that restrict processes from executing at elevated privilege levels.

  The primary attack scenario involves an adversary aiming to exploit vulnerabilities within the Windows operating system's privilege management, thereby gaining unauthorized access to sensitive resources or data. The attacker may drop the fake DLL into the system and ensure it is loaded by the legitimate `dism.exe` executable, effectively deceiving the operating system's security mechanisms while executing potentially harmful commands.

  This rule aligns with the following MITRE ATT&CK tactics and techniques:
  - **Persistence (T1548.002)**: Exploiting UAC bypass for maintaining access.
  - **Defense Evasion (T1574.001)**: Leveraging DLL side-loading to evade detection.

  The key data sources for this detection include:
  - Windows image load logs, which record details regarding processes that load runtime libraries, capturing the context and metadata about the operations performed by processes like `dism.exe` and `dismcore.dll`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for `dism.exe` invocation, especially instances where it is called unexpectedly or from unusual locations, to identify possible malware execution attempts.
  - **Analyze Image Load Events**: Inspect image load logs for entries that show `dismcore.dll` being loaded by `dism.exe`, alerting you to any non-standard loading behavior that deviates from expected patterns.
  - **Correlate with Other Security Logs**: Cross-reference findings with other security logs (e.g., EDR alerts, AV logs) to identify prior suspicious activities or known malicious intents associated with the detected DLL and process.
  - **Investigate File and Path Integrity**: Perform integrity checks on `dismcore.dll` and ensure it resides in verified paths. Look for signs of tampering or presence in directories that may suggest compromise.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of privilege escalation and the likelihood of successful exploitation by sophisticated adversaries using UAC bypass techniques. The ability to run code with higher privileges poses a significant risk to the security posture of the organization.

  ### Blind Spots and Assumptions
  There may be blind spots in environments not logging DLL load events or where the configuration is not capturing all relevant image loads. Furthermore, this detection logic assumes that the legitimate behavior of `dism.exe` does not frequently load custom DLLs outside typical operations. Effective monitoring relies on proper configuration of logging policies for Windows systems to ensure coverage of image load events and related process details.

