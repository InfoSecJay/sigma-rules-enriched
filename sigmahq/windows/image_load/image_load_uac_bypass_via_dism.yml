detection:
  selection:
    Image|endswith: '\dism.exe'
    ImageLoaded|endswith: '\dismcore.dll'
  filter:
    ImageLoaded: 'C:\Windows\System32\Dism\dismcore.dll'
  condition: selection and not filter
falsepositives:
- Actions of a legitimate telnet client
level: high
note: |
  ### Technical Context

  This rule detects the attempt to load a malicious DLL (`dismcore.dll`) following the execution of a legitimate Windows process (`dism.exe`). The behavior indicates a potential UAC (User Account Control) bypass, where an attacker aims to escalate privileges by replacing a legitimate DLL with a malicious one. This aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1548.002) and Execution (T1574.001). The primary telemetry source is image load events, specifically focusing on Windows event logs related to process execution and DLL loading.

  If this detection alerts, it is indicative of attempted privilege escalation, which can lead to significant security impacts if successfully executed. However, this detection does NOT confirm that the DLL executed successfully or was initiated by a malicious actor, as it may also be triggered by benign processes or applications misusing the DLL.

  ### Investigation Steps

  - **Identify endpoint context:** Review the host role and ensure it aligns with appropriate usage of `dism.exe`. Focus on Windows systems where administrative tasks are performed.

  - **Correlate with process creation logs:** Check Security Event ID 4688 for process creation details around the alert time. Look for `dism.exe` execution, including the parent process to identify how it was initiated.

  - **Analyze image load events:** Review Windows Event ID 165 (from Sysmon) or relevant logs capturing DLL loads to confirm the presence of `dismcore.dll`. Validate the file path is as detected, as abnormal paths indicate malicious behavior.

  - **Evaluate execution of dismcore.dll:** Assess the capabilities and behaviors of `dismcore.dll` through process monitoring tools or static analysis. If the file does not match known good hashes, it further indicates a threat.

  - **Investigate for false positives:** Confirm whether a legitimate application or service is attempting to load `dismcore.dll`. Check documentation for any telnet or administrative tasks using the DLL to rule out benign activity.

  ### Prioritization

  This alert is high priority due to the potential impact on the affected system, specifically with respect to privilege escalation capabilities. The likelihood of malicious abuse is significant, as techniques for UAC bypass are commonly weaponized by adversaries to gain elevated permissions.

  ### Blind Spots and Assumptions

  The detection may not catch attempts if the DLL is renamed or if alternative methods for execution are utilized. Ensure that all relevant Windows image load logs are configured to avoid missing this alert. Legitimate actions, such as those performed by authorized administrative tools or scripts, may trigger this detection. A related detection to monitor is the execution of unusual DLLs or processes alongside `dism.exe` to build a better context for alerts in this area.

