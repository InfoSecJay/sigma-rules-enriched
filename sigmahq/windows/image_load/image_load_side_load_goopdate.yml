title: Potential Goopdate.DLL Sideloading
id: b6188d2f-b3c4-4d2c-a17d-9706e0851af0
status: test
description: Detects potential DLL sideloading of "goopdate.dll", a DLL used by googleupdate.exe
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-15
modified: 2025-10-07
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\goopdate.dll'
  filter_main_generic:
    ImageLoaded|startswith:
            # Many third party chromium based apps use this DLLs. It's better to create a baseline and add specific filters
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
  filter_optional_dropbox_installer_temp:
    Image|contains|all:
    - '\AppData\Local\Temp\GUM'
    - '.tmp\Dropbox'
    ImageLoaded|contains|all:
    - '\AppData\Local\Temp\GUM'
    - '.tmp\goopdate.dll'
  filter_optional_googleupdate_temp:
    Image|contains:
    - '\AppData\Local\Temp\GUM'
    - ':\Windows\SystemTemp\GUM'
    Image|endswith: '.tmp\GoogleUpdate.exe'
    ImageLoaded|contains:
    - '\AppData\Local\Temp\GUM'
    - ':\Windows\SystemTemp\GUM'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- False positives are expected from Google Chrome installations running from user
  locations (AppData) and other custom locations. Apply additional filters accordingly.
- Other third party chromium browsers located in AppData
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading of "goopdate.dll," a dynamic link library (DLL) associated with the Google Update service. DLL sideloading is a technique that attackers may use to execute malicious code by placing a malicious DLL in a directory where a legitimate executable, such as "googleupdate.exe," will load it instead of its intended, benign version. The likely attacker objective here is to exploit the trust associated with the Google Update service to deliver and execute malicious payloads without raising suspicion.

  Relevant MITRE ATT&CK techniques involved in this scenario include **T1574.001 - DLL Side-Loading** under the **Persistence** tactic, which focuses on ensuring continued access to systems. This technique facilitates the loading of malicious code through a legitimate application, thereby circumventing standard security measures. In terms of data sources, the primary telemetry for detecting this activity stems from image load events on Windows systems, particularly focusing on the loading of DLLs in specified directories.

  ### Investigation Steps
  - **Review Image Load Events**: Collect and analyze image load events looking for instances where "goopdate.dll" is loaded unexpectedly, especially outside of typical installation paths such as `C:\Program Files` or `C:\Program Files (x86)`.

  - **Examine Process Creation Logs**: Investigate any associated process creation logs that document instances of "googleupdate.exe" running from unusual or temporary directories, particularly those under `\AppData\Local\Temp\GUM`.

  - **Analyze File System Changes**: Check for any recent modifications to the file system in the `\AppData\Local\Temp\GUM` directory or similar paths that may indicate the placement of unauthorized DLL files or executables.

  - **Confirm Legitimate Installations**: Validate legitimate installations of Google applications or Chromium-based browsers in the environment that may produce false positives, ensuring all installations occur in expected paths.

  ### Prioritization
  The alert is considered medium severity due to the potential for attackers to gain persistence on enterprise systems through trusted applications. The likelihood of exploitation through DLL sideloading in environments with unmonitored or poorly secured applications warrants prompt investigation.

  ### Blind Spots and Assumptions
  Detection logic may miss instances of DLL sideloading if attackers leverage custom applications or different executable names, particularly in other bespoke environments. The rule assumes accurate monitoring and logging of image load events and the integrity of path comparisons against known legitimate software installations. For this alert to function correctly, appropriate logging configurations must be in place across all endpoints, ensuring comprehensive capture of image load activities.

