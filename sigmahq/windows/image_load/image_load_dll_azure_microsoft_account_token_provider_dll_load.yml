title: Potential Azure Browser SSO Abuse
id: 50f852e6-af22-4c78-9ede-42ef36aa3453
status: test
description: |
  Detects abusing Azure Browser SSO by requesting OAuth 2.0 refresh tokens for an Azure-AD-authenticated Windows user (i.e. the machine is joined to Azure AD and a user logs in with their Azure AD account) wanting to perform SSO authentication in the browser.
  An attacker can use this to authenticate to Azure AD in a browser as that user.
references:
- https://posts.specterops.io/requesting-azure-ad-request-tokens-on-azure-ad-joined-machines-for-browser-sso-2b0409caad30
author: Den Iuzvyk
date: 2020-07-15
modified: 2023-04-18
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded: 'C:\Windows\System32\MicrosoftAccountTokenProvider.dll'
  filter_main_bgtaskhost:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    Image|endswith: '\BackgroundTaskHost.exe'
        # CommandLine|contains: '-ServerNameBackgroundTaskHost.WebAccountProvider'
  filter_optional_devenv:
    Image|startswith:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    Image|endswith: '\IDE\devenv.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_onedrive:
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
  filter_optional_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- False positives are expected since this rules is only looking for the DLL load
  event. This rule is better used in correlation with related activity
level: low
note: |
  ### Technical Context

  This Sigma rule detects unauthorized attempts to request OAuth 2.0 refresh tokens through the MicrosoftAccountTokenProvider.dll, typically utilized by Azure AD-authenticated users for Single Sign-On (SSO) authentication in the browser. The probable objective for an attacker is credential theft or unauthorized access to Azure resources, leveraging the victim’s session. This behavior maps to the MITRE ATT&CK tactics of Persistence (TA0003), Defense Evasion (TA0005), and the Privilege Escalation technique (T1574.001).

  The primary telemetry sources for this detection are Windows event logs tied to image loads, specifically targeting the loading of MicrosoftAccountTokenProvider.dll by potential malicious processes. If successfully exploited, this can enable an adversary to impersonate the user and gain access to sensitive data and resources. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate applications may trigger similar events under normal operations.

  ### Investigation Steps

  - **Review loaded DLLs:**
    Check for instances of MicrosoftAccountTokenProvider.dll being loaded using Security Event ID 4688 or Sysmon Event ID 7. Focus on processes that should not normally load this DLL.

  - **Analyze command line arguments:**
    Inspect the command line of the parent process related to the invocation. Look for specific arguments indicating a possible malicious intent, such as `-ServerNameBackgroundTaskHost.WebAccountProvider`.

  - **Validate user context:**
    Identify the user associated with the process invoking the DLL load. Cross-reference against user login times and behavior for authentic Azure AD users. This can help distinguish between legitimate use versus potential abuse.

  - **Identify normal behavior:**
    Understand the expected processes that should be using MicrosoftAccountTokenProvider.dll, such as Microsoft Edge or OneDrive during standard SSO logins. Any loading outside of these expected applications may indicate malicious activity.

  - **Cross-check other security logs:**
    Examine related logs, such as Azure AD sign-in logs and Sysmon Event ID 23 (Process Termination) to identify if there has been any unusual activity in conjunction with the DLL loading. Look for failed login attempts or abnormal usage patterns.

  ### Prioritization

  This alert should be treated with a moderate severity level in the enterprise context. The impact could potentially be significant as it may open pathways for unauthorized access to sensitive Azure resources. The likelihood of abuse is plausible, given the method is known to be weaponized for credential harvesting.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated methods that attackers employ to load the DLL, such as through process hollowing or using alternative DLLs. Reliable detection relies on proper logging configurations for Windows Event IDs and Sysmon events. Legitimate actions, such as SSO requests by internal users or automated services, may inadvertently trigger this alert. Companion detections, such as monitoring for unusual OAuth token requests or suspicious user sign-ins in Azure AD, can enhance overall coverage and context.

