title: Potential Azure Browser SSO Abuse
id: 50f852e6-af22-4c78-9ede-42ef36aa3453
status: test
description: |
  Detects abusing Azure Browser SSO by requesting OAuth 2.0 refresh tokens for an Azure-AD-authenticated Windows user (i.e. the machine is joined to Azure AD and a user logs in with their Azure AD account) wanting to perform SSO authentication in the browser.
  An attacker can use this to authenticate to Azure AD in a browser as that user.
references:
- https://posts.specterops.io/requesting-azure-ad-request-tokens-on-azure-ad-joined-machines-for-browser-sso-2b0409caad30
author: Den Iuzvyk
date: 2020-07-15
modified: 2023-04-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded: 'C:\Windows\System32\MicrosoftAccountTokenProvider.dll'
  filter_main_bgtaskhost:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    Image|endswith: '\BackgroundTaskHost.exe'
        # CommandLine|contains: '-ServerNameBackgroundTaskHost.WebAccountProvider'
  filter_optional_devenv:
    Image|startswith:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    Image|endswith: '\IDE\devenv.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_onedrive:
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
  filter_optional_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- False positives are expected since this rules is only looking for the DLL load
  event. This rule is better used in correlation with related activity
level: low
note: |
  ### Technical Context

  This rule detects unauthorized requests for OAuth 2.0 refresh tokens made by processes that have loaded the `MicrosoftAccountTokenProvider.dll` on Azure AD-joined Windows machines. The likely attacker objective is to gain access to Azure AD resources by impersonating an authenticated user through browser Single Sign-On (SSO). This behavior aligns with the MITRE ATT&CK technique for account manipulation (T1574.001). The primary telemetry source includes Windows event logs capturing DLL load activities, specifically targeting ImageLoaded events. If malicious, this can lead to unauthorized access and data exfiltration. This detection does NOT confirm whether the attack is successful or if legitimate processes are incorrectly flagged.

  ### Investigation Steps

  - **Check process details:**
    Examine the process associated with the ImageLoaded event capturing `MicrosoftAccountTokenProvider.dll` (Event ID 4688 or Sysmon Event ID 1) to determine the user context and command line arguments used. Legitimate processes will typically involve standard user applications without suspicious command-line options.

  - **Identify unusual process behavior**:
    Review process creation events (Event ID 4688) for any unexpected child processes spawned from browser applications like ‘iexplore.exe’ or ‘msedge.exe’ that were not initiated by a user action, indicating possible malicious activity.

  - **Validate Azure AD authentication events:**
    Query Azure AD sign-in logs (via Azure Monitor or Azure Portal) to identify successful sign-ins from the affected machine, checking for unusual sign-in locations, times, or devices. Indicators of compromise would include sign-ins from unauthorized geographical locations or unusual times.

  - **Inspect parallel DCOM and authentication errors:**
    Look for DCOM (Event ID 10009) and authentication failure logs in the Security event log to identify if other unauthorized access attempts correlate with the detected event, indicating a potential broad attack.

  - **Investigate user account behavior:**
    Analyze the behavior and access patterns of the subject Azure AD account in Azure AD logs for unusual activities or excessive token requests around the time of the alert. Ensure legitimate access patterns are maintained, such as collaborating on files relevant to the user’s job function.

  ### Prioritization

  This alert should be considered low severity due to its context in an enterprise environment, as it may arise from legitimate application behavior. However, since the abuse of SSO can result in unauthorized access to critical resources, it demands timely review to ensure that the detected behavior does not indicate an active compromise, especially in environments where Azure AD is heavily utilized.

  ### Blind Spots and Assumptions

  The detection may be limited due to legitimate applications that load `MicrosoftAccountTokenProvider.dll`, which can result in false positives linked to user behavior or application updates. Required log sources include Windows event logs and Azure AD logs, which must be configured for proper collection and analysis. Legitimate activities that may trigger this alert include standard application updates or authentications during routine user tasks. A related detection to strengthen coverage could involve monitoring for unusual OAuth token usages or requests outside of normal access patterns.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
