title: Potential SolidPDFCreator.DLL Sideloading
id: a2edbce1-95c8-4291-8676-0d45146862b3
status: test
description: Detects potential DLL sideloading of "SolidPDFCreator.dll"
references:
- https://lab52.io/blog/new-mustang-pandas-campaing-against-australia/
author: X__Junior (Nextron Systems)
date: 2023-05-07
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\SolidPDFCreator.dll'
  filter_main_path:
    Image|endswith: '\SolidPDFCreator.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\SolidDocuments\SolidPDFCreator\'
    - 'C:\Program Files\SolidDocuments\SolidPDFCreator\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading by monitoring the loading of `SolidPDFCreator.dll` in conjunction with the execution of `SolidPDFCreator.exe`. The likely attacker objective is to leverage legitimate software to execute malicious code, thereby evading detection. This behavior fits within the MITRE ATT&CK framework under the tactic of Persistence and the technique T1574.001 (DLL Side-Loading).

  The primary telemetry source for this detection is from Windows image load events, specifically focusing on executable and DLL load logs. If malicious, this could lead to system compromise or unauthorized data access under the guise of a trusted application. However, this detection does NOT confirm that an attack has occurred on its own, as legitimate applications may also load these DLLs under normal circumstances.

  ### Investigation Steps

  - **Check Process Initiation:** Review Security Event ID 4688 logs for the process `SolidPDFCreator.exe`. Validate the process command line for unusual arguments that deviate from standard usage patterns.

  - **Review DLL Load Events:** Investigate Sysmon Event ID 7 logs for the loading of `SolidPDFCreator.dll`. Compare timestamps and user context with the execution of `SolidPDFCreator.exe` to identify any discrepancies indicating suspicious activity.

  - **Analyze Parent Process Hierarchy:** Examine the parent-child process relationship by correlating Event IDs 4688 and 592 (for process termination). If `SolidPDFCreator.exe` was initiated by a less trustworthy application, this may indicate malicious activity.

  - **Evaluate System Changes:** Look for recent modifications or installations of `SolidPDFCreator` files using File System Change events (e.g., Event ID 4663). Ensure legitimate software lifecycle management practices were followed.

  - **Identify Expected Behavior:** Determine normal usage of `SolidPDFCreator` within the environment. Typical benign usage should involve the application processing PDF documents without unusual DLL loads or external references to suspicious paths.

  - **Establish high-confidence indicators:** Confirm if files associated with `SolidPDFCreator.dll` are located in non-standard directories (e.g., `C:\Temp` or user-specific `AppData` folders) which may be indicative of abuse.

  ### Prioritization

  This alert holds medium severity due to the potential compromise of systems that utilize `SolidPDFCreator`, a commonly used application. The likelihood of malicious abuse is moderate; however, DLL sideloading is a recognized technique by adversaries. Given that this behavior can lead to privilege escalation, it warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate versions of the software that may also trigger this alert. Required log sources include Sysmon and Security Event logs, must be properly configured for optimal effectiveness. Legitimate software installations and updates may also generate benign alerts. A related detection to consider is monitoring for unusual behavior in software installations, which could complement this rule by providing additional context on application lifecycle events.

