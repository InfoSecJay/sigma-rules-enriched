title: Potential SolidPDFCreator.DLL Sideloading
id: a2edbce1-95c8-4291-8676-0d45146862b3
status: test
description: Detects potential DLL sideloading of "SolidPDFCreator.dll"
references:
- https://lab52.io/blog/new-mustang-pandas-campaing-against-australia/
author: X__Junior (Nextron Systems)
date: 2023-05-07
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\SolidPDFCreator.dll'
  filter_main_path:
    Image|endswith: '\SolidPDFCreator.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\SolidDocuments\SolidPDFCreator\'
    - 'C:\Program Files\SolidDocuments\SolidPDFCreator\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading events involving the "SolidPDFCreator.dll" file. DLL sideloading is a technique employed by attackers to execute malicious code by exploiting the way Windows loads dynamic link libraries (DLLs). In this scenario, the attacker likely aims to execute arbitrary code within the context of a legitimate application, SolidPDFCreator.exe, potentially leading to unauthorized access, data exfiltration, or further exploitation of the compromised environment.

  Relevant MITRE ATT&CK tactics include **Persistence (TA0003)**, **Defense Evasion (TA0005)**, and **Privilege Escalation (TA0004)**. The specific technique related to this detection is **DLL Search Order Hijacking (T1574.001)**. Attackers leverage this technique to load a malicious DLL instead of the expected DLL file, allowing them to gain control over the application's execution flow.

  The primary data sources providing evidence for this detection are **image load logs**, which capture DLL loading events, and **process creation events**, which may reveal the context in which SolidPDFCreator.exe was executed.

  ### Investigation Steps
  - **Review Image Load Logs:** Check for instances where "SolidPDFCreator.dll" has been loaded, noting the parent process to determine if it aligns with expected operations.
  - **Analyze Process Creation Events:** Investigate the execution of "SolidPDFCreator.exe" to verify its source and integrity, confirming it originated from the legitimate installation paths defined in the rule.
  - **Inspect File Integrity:** Validate the integrity of "SolidPDFCreator.dll" and "SolidPDFCreator.exe" by comparing their hashes against known good values to identify any unauthorized modifications.
  - **Look for Unusual Activity:** Assess for any unusual network or system activity associated with the processes running SolidPDFCreator, which could indicate further exploitation or malicious actions.

  ### Prioritization
  The alert has a medium severity due to the potential risks associated with DLL sideloading techniques, which can lead to significant impacts such as unauthorized data access or exploitation. Given the existence of legitimate use cases for SolidPDFCreator, it is crucial to validate alerts against known workflows.

  ### Blind Spots and Assumptions
  This detection may miss sideloading attempts where the DLL is not named "SolidPDFCreator.dll" or when the execution stems from an unauthorized path not defined in the filter conditions. Assumptions made by the detection logic include the presence of standard logging settings for image loads and process creation events. Without these logs, the detection may fail to trigger, highlighting a potential gap in monitoring configurations that need to be addressed to ensure comprehensive detection coverage.

