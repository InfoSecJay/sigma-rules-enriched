detection:
  selection:
    ImageLoaded|endswith: '\SolidPDFCreator.dll'
  filter_main_path:
    Image|endswith: '\SolidPDFCreator.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\SolidDocuments\SolidPDFCreator\'
    - 'C:\Program Files\SolidDocuments\SolidPDFCreator\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the sideloading of the "SolidPDFCreator.dll" through the execution of "SolidPDFCreator.exe." Sideloading involves the use of a legitimate executable to load a malicious DLL, which may compromise the integrity of the system. The likely attacker objective is to execute malicious payloads or gain persistence on the target system while maintaining a facade of legitimacy. This activity correlates with the MITRE ATT&CK techniques for Persistence (T1574.001) and Defense Evasion.

  Primary telemetry sources include Windows Image Load events with log types such as Event ID 4688 (Process Creation) and Sysmon Event ID 7 (DLL loaded), specifically monitoring DLL paths. If the activity is malicious, it could lead to unauthorized access or data breach. This detection does NOT confirm malicious activity on its own; the context of execution and source must be analyzed.

  ### Investigation Steps

  - **Examine process execution history:** Review Event ID 4688 logs to determine the creation time and originating user of "SolidPDFCreator.exe." Identify if it was executed from an unusual or unauthorized path.

  - **Verify DLL path integrity:** Check Sysmon Event ID 7 logs for "SolidPDFCreator.dll" loading from C:\Program Files\SolidDocuments\SolidPDFCreator or C:\Program Files (x86)\SolidDocuments\SolidPDFCreator. Any deviations may indicate malicious activity.

  - **Assess user context:** Look at the user account that executed the process. Legitimate use should involve administrative accounts or specific application service accounts; unexpected user contexts could signify malicious intent.

  - **Analyze for known malicious behavior:** Search for additional signs of compromise in the same logs, such as unusual process parents or siblings indicating exploitation attempts. For example, if "SolidPDFCreator.exe" is launched by a suspicious process, further investigation is warranted.

  - **Monitor for file creation artifacts:** If applicable, check for the existence of temporary files or unexpected file paths created by SolidPDFCreator. Look at Event ID 4663 logs for file creation events related to the DLL or executable.

  ### Prioritization

  This alert holds medium severity due to the potential impact on systems using SolidPDFCreator, which may handle sensitive documents. The likelihood of abuse is moderate, as sideloading techniques are commonly used in targeted attacks. However, this behavior is not as frequently weaponized in generic threats, warranting further context before escalating.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may use renamed or benign DLLs. Comprehensive logging configurations are necessary to ensure visibility into DLL loads and process creation. Legitimate activities may occur, such as software updates or internal deployments of SolidPDFCreator, which could trigger the alert. A related detection to consider is monitoring for unusual process chains or parent-child relationships that often accompany sideloading techniques for enhanced coverage.

