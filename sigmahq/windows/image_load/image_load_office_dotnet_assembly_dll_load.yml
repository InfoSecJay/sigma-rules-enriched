title: DotNET Assembly DLL Loaded Via Office Application
id: ff0f2b05-09db-4095-b96d-1b75ca24894a
status: test
description: Detects any assembly DLL being loaded by an Office Product
references:
- https://medium.com/threatpunter/detecting-adversary-tradecraft-with-image-load-event-logging-and-eql-8de93338c16
author: Antonlovesdnb
date: 2020-02-19
modified: 2023-03-29
tags:
- attack.execution
- attack.t1204.002
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|startswith: 'C:\Windows\assembly\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a .NET assembly DLL is loaded by Microsoft Office applications such as Excel, Word, PowerPoint, and others. Attackers often utilize this technique to execute malicious payloads while masquerading as benign Office applications, thereby evading detection. By leveraging .NET assemblies, adversaries can execute arbitrary code, exfiltrate data, or establish persistent access to compromised systems.

  The likely attacker objectives include executing malware, conducting data manipulation, or gaining unauthorized access to sensitive information within the enterprise. The detection aligns with the MITRE ATT&CK tactic of Execution, specifically the technique T1204.002, which pertains to the execution of malicious content via user applications.

  Primary data sources for this detection include Windows image load event logs, which capture the activity of DLLs being loaded by specific processes. Monitoring these logs allows defenders to identify potentially malicious use of Office applications in executing unauthorized code.

  ### Investigation Steps
  - **Examine Image Load Events**: Review the image load event logs for occurrences of .NET assemblies being loaded by specified Office applications. Focus on events tied to `C:\Windows\assembly\` paths, as these indicate potentially suspicious behavior.

  - **Investigate Process Parentage**: Determine the parent process of these Office applications to identify how they were launched. Investigate whether unusual or unexpected parent processes initiated the Office applications.

  - **Correlate with User Activity**: Check for user activity logs around the times of the detections. Look for any anomalies, such as actions taken by privileged users or unusual access patterns that might indicate an exploitation attempt.

  - **Review Organization Policies**: Assess current application control policies to see if strict execution policies are enforced. Consider whitelisting trusted applications to mitigate risks posed by unauthorized assemblies.

  ### Prioritization
  This alert carries a medium-severity rating due to the potential threat posed by the execution of unauthorized code through trusted applications. The likelihood of such attacks is significant in environments where Office applications are widely used, presenting a considerable risk to organizational data security and integrity.

  ### Blind Spots and Assumptions
  This detection rule may miss .NET assemblies loaded from other less common Office applications or alternative execution pathways not captured by the current logging configuration. Additionally, the detection logic assumes that events are accurately logged by the image load event, requiring Windows event logging to be appropriately configured and enabled. If the logging of image load events is not active, detection will be ineffective.

