detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|startswith: 'C:\Windows\assembly\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of .NET assembly DLLs by Microsoft Office applications, specifically targeting processes like Excel, PowerPoint, Word, and Outlook. Attackers often use this technique to execute malicious code within trusted applications to evade detection. The primary MITRE ATT&CK tactic is "Execution" (TA0002), with the associated technique being "Malicious File Execution" (T1204.002). The main telemetry sources for this detection are Windows image load logs, particularly those that log DLL loading events.

  If this behavior is confirmed as malicious, it could lead to unauthorized code execution, data exfiltration, or lateral movement within the network. However, this detection alone does not confirm whether the loaded DLL is indeed malicious, nor does it confirm the intent behind the action or the presence of other related malicious activities.

  ### Investigation Steps

  - **Verify loaded modules: ** Examine the Windows image load logs (Event ID 1704 or Sysmon Event ID 10) to identify the specific .NET assemblies loaded by the Office application. Look for assembly names that are suspicious or not commonly used within the organization's environment.

  - **Investigate process origins: ** Check the file paths of the Office applications (e.g., `C:\Program Files\Microsoft Office\...`) using Windows Security Event IDs 4688 and 4689 to ensure that the Office application is running from a legitimate and expected location, as unexpected paths may indicate a potential compromise.

  - **Analyze abnormal execution flows: ** Review the execution history of the Office application around the time of the alert using Process Monitor logs or Sysmon logs for any unusual process creation patterns (Sysmon Event ID 1). Look for instances of the Office applications spawning command-line interpreters or other executables.

  - **Identify legitimate behavior: ** Confirm the presence of known benign DLLs that are typically loaded by the Office applications. Typical legitimate assembly DLLs include those from Microsoft, especially within the `C:\Windows\assembly\` directory. If these are being loaded, it may indicate normal operational behavior.

  - **Check Office application versions: ** Review the version information of the Office applications using deployed software inventory logs. Ensure that the applications are up-to-date and also not in a version known to be vulnerable to exploitation.

  - **Correlate with network activity: ** Examine network logs from Proxy or firewall devices to corroborate any outgoing traffic from the Office application post-DLL load (e.g., HTTP requests, DNS queries). This may reveal potential data exfiltration or callback activities if malicious.

  ### Prioritization

  This alert should be treated with medium severity as it indicates potentially risky behavior within a trusted application environment. However, the likelihood of malicious abuse does exist due to the common exploitation of trusted applications for payload execution, particularly in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of DLLs that are legitimate and commonly used within Office applications. Additionally, if logging for image loads is not enabled or incomplete, false negatives may occur. Legitimate activities, such as Office add-in installations or employee use of automation scripts, could trigger this alert. A related detection worth considering would be monitoring for unusual script execution (e.g., PowerShell or Windows Script Host) from the Office applications, which could provide enhanced context for evaluating potential threats.

