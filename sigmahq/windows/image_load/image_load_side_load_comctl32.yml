logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\logonUI.exe.local\'
    - 'C:\Windows\System32\werFault.exe.local\'
    - 'C:\Windows\System32\consent.exe.local\'
    - 'C:\Windows\System32\narrator.exe.local\'
    - 'C:\windows\system32\wermgr.exe.local\'
    ImageLoaded|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading behavior by monitoring for instances where the system attempts to load `comctl32.dll` from specific, unusual locations, indicating possible privilege escalation or execution of malicious code. The primary objective for an attacker employing this technique is to masquerade malicious DLL files as legitimate system files to gain elevated privileges without being detected. This aligns with MITRE ATT&CK tactic **Persistence** and technique **DLL Search Order Hijacking (T1574.001)**.

  The primary telemetry sources for this detection come from Windows image load events, specifically logging events related to DLL loading from Windows security logs (Event ID 4688) and Sysmon Event ID 7 (Image loaded). If the behavior is indeed malicious, it may compromise system integrity or escalate privileges that enable further network compromise. Importantly, this detection does NOT confirm that the loading of `comctl32.dll` is malicious on its own, as legitimate applications might also load this DLL during operation.

  ### Investigation Steps

  - **Review Image Load Events:** Cross-reference Event ID 7 from Sysmon to identify instances of `comctl32.dll` being loaded from paths such as `C:\Windows\System32\logonUI.exe.local\`. Look for excessive or unusual occurrences that deviate from normal application behavior.

  - **Validate Legitimate Usage:** Confirm typical application behavior by identifying processes that should normally use `comctl32.dll` without loading from suspicious paths. For instance, `explorer.exe` should not reference the monitored local paths.

  - **Identify Associated Elevated Processes:** Investigate any parent processes linked with the DLL load events that could indicate escalated privileges. For example, if `consent.exe` is the parent process, examine its typical execution context for anomalies.

  - **Check for Known Malicious Hashes:** Compare loaded DLL hashes against known malicious signatures by leveraging threat intelligence feeds. Focus on any matches stemming from the non-standard paths noted.

  - **Extract and Analyze Binary:** If a malicious load is confirmed, extract the binary of `comctl32.dll` from the unusual path and analyze it using tools such as VirusTotal or hybrid-analysis.com for additional indicators of compromise.

  - **Log Configuration Verification:** Ensure that Sysmon and Windows event logging are correctly configured to capture all image load events, and validate that the log retention policy aligns with organizational reporting and investigative needs.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems if malicious DLL side-loading occurs, as it can lead to privilege escalation or execution of arbitrary code under the guise of a legitimate process. Given that this technique is frequently weaponized in sophisticated attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection might be evaded if the attacker uses legitimate paths or if the DLL is loaded in a manner that doesn't trigger the logged patterns (e.g., through custom execution techniques). Ensure that Sysmon is properly deployed on all critical systems to improve coverage. The alert may also trigger from legitimate applications that utilize custom file structures or local testing environments. Companion detection such as monitoring for unusual parent-child process relationships (Sysmon Event ID 1) can enhance coverage against similar sideloading techniques.

