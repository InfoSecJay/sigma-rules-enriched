detection:
  selection:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\logonUI.exe.local\'
    - 'C:\Windows\System32\werFault.exe.local\'
    - 'C:\Windows\System32\consent.exe.local\'
    - 'C:\Windows\System32\narrator.exe.local\'
    - 'C:\windows\system32\wermgr.exe.local\'
    ImageLoaded|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading activities specifically involving the legitimate Windows dynamic-link library (DLL) `comctl32.dll` being loaded in the context of applications with altered paths, such as `logonUI.exe.local` or `werFault.exe.local`. The likely attacker objective is to escalate privileges by loading a malicious version of `comctl32.dll` while masquerading the attempt as legitimate system activity; thus maintaining stealth and persistence within the environment. This behavior aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion and Persistence, specifically technique ID T1574.001.

  The primary telemetry source for this detection is Windows image load events. Relevant log types include Windows Event ID 4104 (for script blocks) and Sysmon Event ID 7 (Image Loaded) which capture the loading of DLLs. If this behavior is malicious, it can lead to system compromise and unauthorized access to sensitive data. Notably, this detection does NOT confirm malicious intent on its own; the mere presence of a DLL loading in a non-standard manner requires context-specific investigation to determine legitimacy.

  ### Investigation Steps

  - **Check image load events for anomalies**: Review Sysmon Event ID 7 for instances where `comctl32.dll` is loaded from unconventional paths (e.g., ending with `.local`). Compare against known good paths for these binaries.

  - **Identify command line execution**: Look for Windows Event ID 4688 to pinpoint the parent process and command line used when `comctl32.dll` was loaded. Focus on indicators suggesting non-standard executions that could hint at adversarial tactics.

  - **Review user permissions**: Validate if the user executing these processes has elevated privileges typical of administrative tasks, utilizing Active Directory logs or User Account Control settings.

  - **Determine legitimate processes**: Verify typical behavior for the impacted executables (`logonUI.exe`, `werFault.exe`, etc.). A legitimate execution may invoke `comctl32.dll`, but occurs from its original path and not the altered path.

  - **Examine audit logs for anomalies**: Check for unusual account activity using Event IDs 4624 (Logon) and 4625 (Logon Failure) around the same time as the DLL load events to capture potential credential abuse or lateral movement.

  - **Assess file behavior post-load**: Investigate if any files were created or modified at the time of the event (e.g., using Sysmon Event ID 11 - File Create). Look for unusual file creations in temp directories which might indicate exfiltration or persistence mechanisms.

  ### Prioritization

  This alert is considered high severity due to the impact of enabling unauthorized system-level access and potential control over critical systems. The likelihood of malicious misuse is high, especially since DLL sideloading is a common tactic among threat actors seeking persistent footholds within enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging or if DLL images are signed and unaltered from original sources. Legitimate activities such as system maintenance scripts might trigger similar loads, but should not use altered paths. Another relevant detection to consider is unauthorized access attempts (e.g., Event ID 4625) that could indicate misuse alongside potential DLL sideloading events, strengthening the overall security posture.

