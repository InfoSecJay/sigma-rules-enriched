title: Potential DLL Sideloading Via comctl32.dll
id: 6360757a-d460-456c-8b13-74cf0e60cceb
status: test
description: Detects potential DLL sideloading using comctl32.dll to obtain system
  privileges
references:
- https://github.com/binderlabs/DirCreate2System
- https://github.com/sailay1996/awesome_windows_logical_bugs/blob/60cbb23a801f4c3195deac1cc46df27c225c3d07/dir_create2system.txt
author: Nasreddine Bencherchali (Nextron Systems), Subhash Popuri (@pbssubhash)
date: 2022-12-16
modified: 2022-12-19
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\logonUI.exe.local\'
    - 'C:\Windows\System32\werFault.exe.local\'
    - 'C:\Windows\System32\consent.exe.local\'
    - 'C:\Windows\System32\narrator.exe.local\'
    - 'C:\windows\system32\wermgr.exe.local\'
    ImageLoaded|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading activity using `comctl32.dll`, a common Windows library. DLL sideloading involves an attacker placing a malicious DLL within the search path of a legitimate executable. When the executable runs, it loads the malicious DLL instead of the legitimate one, allowing attackers to escalate privileges and potentially execute arbitrary code with higher privileges. This technique can enable stealthy persistence and facilitate further system exploitation.

  The suspected threat scenario may involve an attacker leveraging a legitimate application to maliciously load their DLL file, resulting in unauthorized actions on the system or network. The attacker's objectives are likely to gain elevated privileges, maintain persistence within the environment, and evading detection by security measures. This tactic falls under the MITRE ATT&CK framework, specifically the **Defense Evasion** (T1203), **Persistence** (T1543), and **Privilege Escalation** (T1574.001) techniques, where the adversary aims to manipulate or exploit trusted systems to execute untrusted code.

  Primary data sources for this detection include Windows image load events, specifically event logs that capture process creation and DLL loading activity—these logs can provide insight into which DLLs are being loaded by which processes and whether any unexpected paths or behaviors are observed.

  ### Investigation Steps
  - **Review Image Load Events:** Examine recent image load events for entries indicating `comctl32.dll` loaded from unconventional or remote paths, particularly the specified `.local` directories in the rule.
  - **Check Process Execution Paths:** Identify the paths of the associated parent processes responsible for loading the malicious DLL. Investigate their origins and validate their legitimacy against known software vendors and signatures.
  - **Analyze User Privileges:** Assess the privileges of the user context in which the loading occurred. Determine if there are any discrepancies that may suggest privilege escalation or unauthorized access.
  - **Correlate with Security Logs:** Cross-reference findings with other security logs (e.g., EDR endpoint logs, SIEM alerts) to detect any previous suspicious behaviors leading up to the DLL loading event.

  ### Prioritization
  The alert is rated as high severity due to the significant impact of potential privilege escalation and the risk of malicious code execution, which can severely compromise the security posture of the enterprise.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of DLL sideloading, particularly if the malicious DLL is not specifically named or if legitimate applications are misused in a non-standard way. The detection logic assumes that DLLs loaded from local user directories signify a deviation from the norm and may have elevated privileges. Additionally, proper logging of image loading events in the Windows environment must be enabled and monitored in order for this alert to function effectively, ensuring comprehensive coverage of all potentially affected processes.

