title: Potential DLL Sideloading Using Coregen.exe
id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
status: test
description: Detect usage of the "coregen.exe" (Microsoft CoreCLR Native Image 
  Generator) binary to sideload arbitrary DLLs.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Coregen/
author: frack113
date: 2022-12-31
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1218
- attack.t1055
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\coregen.exe'
  filter_main_legit_paths:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Silverlight\'
    - 'C:\Program Files\Microsoft Silverlight\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `coregen.exe`, a Microsoft CoreCLR Native Image Generator, which has been leveraged by adversaries to sideload arbitrary Dynamic Link Libraries (DLLs). Such behavior is often associated with privilege escalation attempts, as attackers may seek to execute malicious payloads under the guise of a legitimate process, thus bypassing security controls. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) with the technique "Sideloading" (T1218).

  The primary telemetry source for this detection is Windows image load logs, specifically tracking where `coregen.exe` is invoked. If the execution is malicious, it could lead to unauthorized code execution or system compromise. It is important to highlight that this detection does NOT confirm that the execution of `coregen.exe` is inherently malicious; additional context is required to determine intent.

  ### Investigation Steps

  - **Check execution context:** Review `Security Event ID 4688` for the creation of the `coregen.exe` process. Ensure that it was invoked by a legitimate user or service. Login context and user behavior analysis can help differentiate between benign and potential malicious execution.

  - **Analyze loaded DLLs:** Investigate `ImageLoad` events for DLLs loaded in association with `coregen.exe`. Look for unexpected or suspicious DLL paths that are not part of the standard Silverlight directories. Malicious DLL paths often contain obfuscated names or may reside in temporary folders.

  - **Verify legitimate usage:** Confirm that known legitimate applications in your environment are using `coregen.exe` correctly. Typical applications may include custom Silverlight applications or specific development tools. Record their expected execution paths and compare against the alert.

  - **Inspect for lateral movement:** Determine if `coregen.exe` was executed on critical servers or endpoints that could serve as a jump-off point for lateral movement. Collect logs from `Event ID 4688` and correlate with network traffic flows to identify unusual outbound connections post-execution.

  - **Identify known bad signatures:** Check threat intelligence feeds or endpoint security product alerts for indicators of compromise (IOCs) linked to the execution of `coregen.exe`. Cross-reference any identified hashes of loaded DLLs or `coregen.exe` itself against known malicious submissions.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on business-critical systems, especially if `coregen.exe` is being used to execute malicious DLLs. The likelihood of abuse is moderate, as sideloading techniques are commonly weaponized in real-world attacks; thus, vigilance is warranted.

  ### Blind Spots and Assumptions

  This detection relies heavily on accurate image load telemetry; therefore, any obfuscation techniques or process renaming by an attacker could evade detection. Additionally, legitimate applications using `coregen.exe` may inadvertently trigger this alert if not properly configured. Further detection coverage could be enhanced by correlating this rule with logs for known exploitation frameworks, such as Cobalt Strike or Empire, which may utilize DLL sideloading tactics.

