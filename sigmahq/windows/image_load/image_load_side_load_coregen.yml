title: Potential DLL Sideloading Using Coregen.exe
id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
status: test
description: Detect usage of the "coregen.exe" (Microsoft CoreCLR Native Image 
  Generator) binary to sideload arbitrary DLLs.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Coregen/
author: frack113
date: 2022-12-31
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1218
- attack.t1055
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\coregen.exe'
  filter_main_legit_paths:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Silverlight\'
    - 'C:\Program Files\Microsoft Silverlight\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the usage of the "coregen.exe" binary, which is part of Microsoft's CoreCLR, to potentially sideload malicious DLLs. The likely attacker objective involves leveraging coregen.exe to load unauthorized DLLs into a process, enabling privilege escalation or evasion of defenses. This behavior aligns with the MITRE ATT&CK tactic 'Privilege Escalation' (TA0004) and the technique 'Sideloading' (T1218).

  The primary telemetry sources are Windows image load events, specifically looking for Event ID  4101 (Image loaded) where the specified file matches 'coregen.exe'. If detected, this could indicate a significant security risk, allowing unauthorized code execution. This rule does NOT confirm the malware presence on its own, as coregen.exe can be used legitimately in various scenarios.

  ### Investigation Steps

  - **Verify coregen.exe execution path:** Check for the full execution path of coregen.exe. Legitimate paths typically include C:\Program Files (x86)\Microsoft Silverlight\. Unusual paths may indicate malicious intent.

  - **Review loaded DLLs:** Utilize Sysinternals Process Explorer or PowerShell `Get-Process` with `-IncludeUserName` and inspect the DLLs loaded by processes using coregen.exe. Look for any DLLs loaded that are not from the Microsoft directories specified in the Sigma rule.

  - **Check Event ID 4101 logs:** Analyze Windows Event ID 4101 logs for image load events indicating coregen.exe execution. Identify any unusual parent processes or command-line arguments that deviate from normal usage.

  - **Assess system criticality:** Determine the role of the affected system. If it is a server that handles sensitive data or critical application functions, escalate further investigation.

  - **Identify high-confidence malicious indicators:** Look for DLLs that are unsigned or known malware hashes within the process using coregen.exe. Compare against threat intelligence feeds or internal resources for known malicious signatures.

  - **Document legitimate behavior:** Correlate findings with typical Silverlight application activity, such as application deployment or updates that would use coregen.exe, differentiating between benign usage and suspicious activity.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for privilege escalation in critical systems. While coregen.exe is a legitimate Microsoft tool, its use for DLL sideloading is a known tactic of attackers. Since DLL sideloading is commonly weaponized in attacks, further investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as renaming coregen.exe or using other binaries with similar functionalities. Reliable detection requires proper logging configurations to capture image loads accurately. Legitimate activities like application updates or application-specific installations may inadvertently trigger this alert. A companion detection could include monitoring for known malicious DLL creations in conjunction with this alert to strengthen overall detection coverage.

