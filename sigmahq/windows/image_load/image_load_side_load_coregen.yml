title: Potential DLL Sideloading Using Coregen.exe
id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
status: test
description: Detect usage of the "coregen.exe" (Microsoft CoreCLR Native Image Generator)
  binary to sideload arbitrary DLLs.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Coregen/
author: frack113
date: 2022-12-31
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1218
- attack.t1055
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\coregen.exe'
  filter_main_legit_paths:
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Silverlight\'
    - 'C:\Program Files\Microsoft Silverlight\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of `coregen.exe`, a legitimate Microsoft binary known as the CoreCLR Native Image Generator, to facilitate DLL sideloading. DLL sideloading is a technique where attackers place a malicious DLL in the same directory as a legitimate executable, which is then loaded when the executable is run. This technique allows attackers to execute arbitrary code under the context of that executable, typically aiming to gain elevated privileges or evade detection by utilizing trusted processes.

  The threat scenario often plays out in environments where an attacker seeks to exploit legitimate software to execute code undetected. The attacker's objectives may include privilege escalation or establishing a foothold within a network. This rule maps to multiple MITRE ATT&CK techniques, including **T1218** (System Binary Proxy Execution) and **T1055** (Process Injection), highlighting its use for evading defenses while achieving malicious outcomes.

  Primary data sources relevant for this detection include **image load logs** that capture the processes and binaries that are being executed, specifically monitoring for instances where `coregen.exe` is used to load DLLs not from legitimate paths.

  ### Investigation Steps
  - **Review Image Load Logs**: Examine image load logs to identify instances of `coregen.exe` execution. Pay particular attention to the command line arguments and parent process information.

  - **Analyze Parent Processes**: Investigate the parent processes associated with `coregen.exe` instances. Look for unusual or suspicious parent processes that may indicate an attempt to hide activity or processes initiated by malware.

  - **Correlate with File System Activity**: Check file system logs for any DLL files being loaded in conjunction with `coregen.exe`. Make sure to identify DLLs that are not located in the legitimate installation paths of Silverlight or system directories.

  - **Assess User Context**: Determine the user context under which `coregen.exe` is being executed. If it is being run by non-administrative accounts in unexpected contexts, raise a flag for further analysis.

  ### Prioritization
  The severity of this alert is medium due to its potential to indicate privilege escalation or code execution under a legitimate process, thereby posing a significant threat to the security of the enterprise environment if left unchecked.

  ### Blind Spots and Assumptions
  This detection logic may not cover instances where attackers utilize non-standard paths for `coregen.exe` or manipulate the binary in ways that are not captured by standard image load logs. It assumes that the relevant image load logs are enabled and properly configured, which may not be the case in all environments, resulting in potential gaps in detection coverage. Additionally, malicious actors could potentially obfuscate their activities further, complicating detection efforts.

