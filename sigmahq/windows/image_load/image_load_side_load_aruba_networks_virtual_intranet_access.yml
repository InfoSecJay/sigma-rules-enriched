title: Aruba Network Service Potential DLL Sideloading
id: 90ae0469-0cee-4509-b67f-e5efcef040f7
status: test
description: Detects potential DLL sideloading activity via the Aruba Networks 
  Virtual Intranet Access "arubanetsvc.exe" process using DLL Search Order 
  Hijacking
references:
- https://twitter.com/wdormann/status/1616581559892545537?t=XLCBO9BziGzD7Bmbt8oMEQ&s=09
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-03-15
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\arubanetsvc.exe'
    ImageLoaded|endswith:
    - '\wtsapi32.dll'
    - '\msvcr100.dll'
    - '\msvcp100.dll'
    - '\dbghelp.dll'
    - '\dbgcore.dll'
    - '\wininet.dll'
    - '\iphlpapi.dll'
    - '\version.dll'
    - '\cryptsp.dll'
    - '\cryptbase.dll'
    - '\wldp.dll'
    - '\profapi.dll'
    - '\sspicli.dll'
    - '\winsta.dll'
    - '\dpapi.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potential DLL sideloading activity involving the "arubanetsvc.exe" process, which is part of Aruba Networks' Virtual Intranet Access. The behavior indicates that an adversary may be attempting to load malicious DLLs using legitimate processes to evade detection. The relevant MITRE ATT&CK tactics include Persistence and Execution (TA0003, TA0002) and the technique specifically associated is DLL Search Order Hijacking (T1574.001).

  Primary telemetry sources include Windows Event logs for image load events that capture details about process execution and library loading. If this detection corresponds to malicious activity, it poses a significant risk of privilege escalation, as successful DLL sideloading can allow attackers to execute malicious code with the privileges of the targeted process. This detection does not confirm that the activity is malicious on its own, as legitimate software updates or misconfigurations can also result in similar behaviors.

  ### Investigation Steps

  - **Verify process legitimacy:** Check if "arubanetsvc.exe" is running under expected parent processes (e.g., `services.exe` for system services). Use Security Event ID 4688 (process creation) to validate the process lineage and ensure it is not being spawned by an unusual or malicious parent.

  - **Check loaded DLLs:** Investigate the DLLs loaded by "arubanetsvc.exe" using Sysmon Event ID 7 (Image load). Look specifically for any instances of the specified DLLs loaded from unauthorized paths, such as those not included in the typical Windows directory structure.

  - **Look for indicators of compromise:** Identify if any of the loaded DLLs (e.g., `msvcr100.dll`, `cryptsp.dll`) are executed from suspicious locations (e.g., user directories, application data). Validate this with FileCreationTime and Path fields from Event ID 5140 (File Share Access) to see if any DLLs were recently created in these locations.

  - **Review system roles and context:** Confirm that the affected system has a legitimate use case for "arubanetsvc.exe" (e.g., on networking devices). Systems without a valid reason to have this service should be prioritized for review.

  - **Assess user activity:** Cross-reference user activity around the detected events. Review User Logon Events (Event ID 4624) to establish if there were recent administrative or unusual logon patterns corresponding with the alert timeline.

  - **Document legitimate usage:** Note expected operations of "arubanetsvc.exe," which should primarily involve communication to manage VPN sessions rather than unusual file access or network traffic patterns outside normal operational hours.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the likelihood of harm if malicious behavior is confirmed. The presence of the "arubanetsvc.exe" alongside DLL sideloading patterns indicates possible exploitation scenarios, which are often weaponized by adversaries seeking persistence or privilege escalation on affected systems.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques, such as encrypted or obfuscated DLLs that may not be identified during standard analysis. Complete coverage relies on ensuring Sysmon and relevant Windows logging configurations are enabled. Legitimate applications that may trigger this alert include other network services that utilize similar DLLs but are not related to Aruba Networks. Complementary detections include monitoring for unusual process parent-child relationships as another layer of context in evaluating potential threats.

