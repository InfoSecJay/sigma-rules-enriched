logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\arubanetsvc.exe'
    ImageLoaded|endswith:
    - '\wtsapi32.dll'
    - '\msvcr100.dll'
    - '\msvcp100.dll'
    - '\dbghelp.dll'
    - '\dbgcore.dll'
    - '\wininet.dll'
    - '\iphlpapi.dll'
    - '\version.dll'
    - '\cryptsp.dll'
    - '\cryptbase.dll'
    - '\wldp.dll'
    - '\profapi.dll'
    - '\sspicli.dll'
    - '\winsta.dll'
    - '\dpapi.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential DLL sideloading activities associated with the "arubanetsvc.exe" process used by Aruba Networks Virtual Intranet Access. DLL sideloading is a technique where an attacker places a malicious DLL in the same directory as a legitimate executable file, exploiting the way Windows loads DLLs to execute malicious code when the legitimate process runs. The goal of such an attack is often to gain persistence, escalate privileges, or evade detection while performing malicious actions.

  In the context of this detection, an attacker might leverage this method to ensure that when "arubanetsvc.exe" is executed, a malicious DLL from an unexpected path is loaded, potentially leading to serious security breaches such as data exfiltration or unauthorized access. Relevant MITRE ATT&CK tactics include Defense Evasion (TA0005), Privilege Escalation (TA0004), and Persistence (TA0003). The primary telemetry sources for this detection are image load logs, which record details about the executables and DLLs being loaded by processes on Windows systems.

  ### Investigation Steps
  - **Review Image Load Logs**: Analyze image load events related to "arubanetsvc.exe" to identify unusual or unexpected DLLs being loaded that do not originate from standard Windows directories.
  - **Check DLL Origins**: For each detected malicious DLL loaded with "arubanetsvc.exe", trace its file path and verify its signature and source to confirm its legitimacy.
  - **Monitor for Persistence Techniques**: Investigate if there are any registry or scheduled task entries that correlate with the behavior of "arubanetsvc.exe" and the loaded DLLs to identify methods of persistence that may have been established.
  - **Correlate with Other Security Tools**: Utilize endpoint detection and response (EDR) tools to correlate alerts and logs that may indicate further malicious activity associated with the "arubanetsvc.exe" process.

  ### Prioritization
  Given the ability of DLL sideloading to bypass traditional security measures and potentially lead to privilege escalation or persistent threats in an enterprise environment, this alert is classified as high severity. The likelihood of a successful attack using this method increases when attackers can leverage trusted tools like "arubanetsvc.exe".

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process monitoring via image load logs, which may not capture all instances of DLL hijacking if logs are not properly configured or if the attacker employs techniques to obscure their activities. Additionally, this detection assumes that the normal behavior of "arubanetsvc.exe" is well understood and that any deviations in loaded DLLs are indeed suspicious. Required logs for this alert to function effectively include comprehensive image load activity logs from Windows systems, ensuring that all DLL load events are captured.

