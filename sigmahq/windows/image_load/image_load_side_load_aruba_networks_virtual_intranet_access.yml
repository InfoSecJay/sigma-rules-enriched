title: Aruba Network Service Potential DLL Sideloading
id: 90ae0469-0cee-4509-b67f-e5efcef040f7
status: test
description: Detects potential DLL sideloading activity via the Aruba Networks 
  Virtual Intranet Access "arubanetsvc.exe" process using DLL Search Order 
  Hijacking
references:
- https://twitter.com/wdormann/status/1616581559892545537?t=XLCBO9BziGzD7Bmbt8oMEQ&s=09
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-03-15
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.persistence
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\arubanetsvc.exe'
    ImageLoaded|endswith:
    - '\wtsapi32.dll'
    - '\msvcr100.dll'
    - '\msvcp100.dll'
    - '\dbghelp.dll'
    - '\dbgcore.dll'
    - '\wininet.dll'
    - '\iphlpapi.dll'
    - '\version.dll'
    - '\cryptsp.dll'
    - '\cryptbase.dll'
    - '\wldp.dll'
    - '\profapi.dll'
    - '\sspicli.dll'
    - '\winsta.dll'
    - '\dpapi.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potential DLL sideloading activity related to the `arubanetsvc.exe` process, which could indicate an attempt to load malicious DLLs in a manner that exploits the Windows search order for dynamic link libraries. The likely attacker objective is to execute arbitrary code in the context of a trusted service, which may facilitate privilege escalation or persistence within the environment. This behavior is mapped to the MITRE ATT&CK tactic of Defense Evasion (T1203), specifically DLL Search Order Hijacking (T1574.001).

  The primary telemetry source for this detection is Windows process execution logs, specifically the image load events which capture details about which DLLs are loaded into a process. If successful, this behavior can lead to significant security impacts, including unauthorized access to sensitive data and disruption of service integrity. Notably, while the detection indicates potential malicious behavior, it does NOT confirm that the loaded DLL is indeed malicious or that exploitation has occurred.

  ### Investigation Steps

  - **Check process execution:** Review Windows Security Event ID 4688 for the execution of `arubanetsvc.exe`. Verify the user context and parent process to determine if it aligns with expected behaviors.

  - **Analyze loaded DLLs:** Cross-reference Sysmon Event ID 7 logs for `arubanetsvc.exe` to see which DLLs were loaded. Look for any DLLs loaded from unexpected directories (e.g., any directory other than `C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`) which could indicate malicious activity.

  - **Identify legitimate use cases:** Determine if `arubanetsvc.exe` and the loaded modules are part of normal operations for your organization. Investigate recent changes in user behavior or system configuration that could explain benign use.

  - **Assess for high-confidence indicators:** Look for DLLs like `wtsapi32.dll`, `msvcr100.dll`, or `dbghelp.dll` being loaded within the context of `arubanetsvc.exe`. If found, check their paths; DLLs originating from non-standard paths are credible indicators of a malicious exploit.

  - **Evaluate system criticality:** Consider the role of the affected host in your network (e.g., critical infrastructure vs. standard user workstation). Higher criticality systems should prompt immediate investigation and response.

  - **Correlate with other detection mechanisms:** Review for additional detection signals in your environment that may relate to DLL sideloading, such as alerts for unusual process parents or execution from non-whitelisted paths.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and data integrity. The methodology behind DLL sideloading is commonly exploited by adversaries for privilege escalation and persistence, making it a likely candidate for malicious behavior within the enterprise.

  ### Blind Spots and Assumptions

  Detection may be evaded using well-known legitimate DLLs or by utilizing system-level DLLs that are signed and commonly present on Windows systems. Consequently, ensuring comprehensive logging from Sysmon or equivalent agent is critical for reliable detection. Legitimate activity may occur if `arubanetsvc.exe` is used in a regular operational context, such as remote access solutions. One related detection to consider is monitoring for abnormal process creation patterns indicative of defense evasion techniques that leverage service executable paths.

