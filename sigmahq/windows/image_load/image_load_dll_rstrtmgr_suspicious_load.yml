note: |
  ### Technical Context

  This Sigma rule detects the loading of the `RstrtMgr.dll` (Restart Manager) by processes located in suspicious file paths. This behavior is particularly alarming as the Restart Manager is known for its role in process termination during ransomware attacks, specifically targeting processes that could hinder file encryption, as evidenced in campaigns such as Conti and Cactus, and more recently in the BiBi wiper. The relevant MITRE ATT&CK tactics include Impact (T1486) and Defense Evasion (T1562.001). The primary telemetry source is Windows image load events, particularly focusing on Event ID 4064 from Sysmon or security logs capturing DLL loads.

  Malicious use of this behavior can be severe, creating significant operational disruption and data loss. However, the detection alone does not confirm malicious intent, as legitimate applications may also utilize `RstrtMgr.dll` for valid purposes like installing software.

  ### Investigation Steps

  - **Review the loading process:** Identify the process that loaded `RstrtMgr.dll` by correlating it with Sysmon Event ID 7 (Image Load). Pay particular attention to the process path; if it originates from suspicious locations such as `C:\Users\Public\` or `C:\Perflogs\`, escalate for further analysis.

  - **Identify the parent process:** Examine the process tree of the loading process by referencing Sysmon Event ID 1 (Process Creation), specifically the `ParentImage` field. Legitimate installers may show paths like `C:\Windows\Installer\` while suspicious activities may show unknown or unusual executables.

  - **Analyze command-line arguments:** Investigate command-line arguments associated with the loading process through the Sysmon Event ID 1 entry. Malicious indicators may include arguments linked to process ownership or behavioral flags common in ransomware, such as silent or forceful process termination.

  - **Check for additional DLL loads:** Cross-reference with Security Event ID 4688 (Process Creation) to identify any other suspicious DLLs that were recently loaded alongside `RstrtMgr.dll`. Multiple unusual DLLs being loaded can signify an orchestrated attack.

  - **Validate file integrity and timestamps:** Assess the file properties of `RstrtMgr.dll` and the loading process for any anomalies in creation or modification dates that do not align with Windows default. Legitimate files will not display recent changes outside of standard OS updates.

  - **Monitor for related alerts:** Given the association with past ransomware and wiper behaviors, check for other triggered alerts, especially those related to file encryption or data destruction which could indicate an escalated incident. Utilize any associated companion detection from the relevancy list provided.

  ### Prioritization

  This alert should be considered high priority due to the critical nature of the affected systems and the high likelihood of malicious exploitation based on historical attack patterns. The loading of `RstrtMgr.dll` in non-standard environments is frequently weaponized in ransomware operations, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as legitimate applications utilizing `RstrtMgr.dll` for valid purposes, potentially creating false positives. Comprehensive logging configurations for Sysmon and security event logs are essential for reliable detection. Additionally, legitimate scheduled tasks or software installations can trigger this alert, confounding analysis. Related detections capturing unauthorized file encryption activities can enhance the reliability of incident validation.

