note: |
  ### Technical Context

  This Sigma rule detects the loading of the RstrtMgr.dll (Restart Manager) by suspicious processes, which is often indicative of hostile activities, particularly in ransomware campaigns (e.g., Conti, Cactus) that aim to terminate processes to facilitate file encryption. The likely attacker objective is to disable protective processes or disrupt normal system functionalities to open pathways for further malicious actions. This behavior aligns with MITRE ATT&CK tactics such as Impact (T1486) and Defense Evasion (T1685). The primary telemetry source is Windows Image Load events, specifically focusing on Event IDs from the `image_load` category which logs details about loaded libraries and their parent processes. If malicious, this behavior can lead to significant data loss and operational downtime. However, this detection does NOT confirm that an attack is currently in progress; further investigation is necessary to ascertain intent and context.

  ### Investigation Steps

  - **Review Image Load details:** Check for Windows Event ID 4104 or relevant Sysmon Event ID 7 logs to confirm the loading of `RstrtMgr.dll`. Analyze the process that loaded the DLL and its parent process for suspicious characteristics, such as a command-line argument indicative of malicious activity (e.g., unusual flags or paths).

  - **Validate process parentage:** Inspect Event ID 4688 logs for the suspicious process that loaded `RstrtMgr.dll` to confirm its execution context. Look for known malicious indicators such as the use of obfuscated or unusual executable names in user profile directories.

  - **Identify benign behavior:** Cross-reference with typical software installation processes which may legitimately load RstrtMgr.dll. For instance, legitimate installation of Microsoft software or updates could trigger this rule, especially when initiated by processes like `msiexec.exe`.

  - **Correlate with file changes:** Review file system activity (e.g., using Sysmon Event ID 11) to identify any file modifications or deletions immediately following the DLL load. This would indicate potential ransomware behavior attempting to encrypt or destroy files.

  - **Check for multiple hits:** Look for repeated occurrences of this behavior in short succession that could indicate a broader attack vector or campaign. High frequencies of this DLL load across multiple endpoints may point towards coordinated malicious activity.

  - **Assess host criticality:** Determine if the affected system has high sensitivity or operational impact (like servers containing critical data) which would elevate the need for immediate response actions upon detecting this behavior.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on critical systems and the likelihood of malicious exploitation during ransomware attacks. The behavior is known to be weaponized in specific ransomware campaigns, necessitating immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited by systems with inadequate logging configurations where image loading events are not captured. Evasion techniques may include renaming processes or using legitimate tools for malicious ends that often obfuscate intent. The alert may also be triggered by legitimate administrative tasks or software updates that use the Restart Manager functionality. A companion detection to enhance coverage could be tracking for unusual process terminations shortly after RstrtMgr.dll load events, indicative of process killing by attackers.

