title: Unsigned DLL Loaded by Windows Utility
id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
status: test
description: |
  Detects windows utilities loading an unsigned or untrusted DLL.
  Adversaries often abuse those programs to proxy execution of malicious code.
references:
- https://www.elastic.co/security-labs/Hunting-for-Suspicious-Windows-Libraries-for-Execution-and-Evasion
- https://akhere.hashnode.dev/hunting-unsigned-dlls-using-kql
- https://unit42.paloaltonetworks.com/unsigned-dlls/?web_view=true
author: Swachchhanda Shrawan Poudel
date: 2024-02-28
modified: 2025-10-07
tags:
- attack.t1218.011
- attack.t1218.010
- attack.defense-evasion
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith:
            # Note: Add additional utilities that allow the loading of DLLs
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  filter_main_signed:
    Signed: 'true'
  filter_main_sig_status:
    SignatureStatus:
    - 'errorChaining'
    - 'errorCode_endpoint'
    - 'errorExpired'
    - 'trusted'
    - 'Valid'
  filter_main_signed_null:
    Signed:
  filter_main_signed_empty:
    Signed:
    - ''
    - '-'
  filter_main_sig_status_null:
    SignatureStatus:
  filter_main_sig_status_empty:
    SignatureStatus:
    - ''
    - '-'
  filter_main_windows_installer:
    Image:
    - 'C:\Windows\SysWOW64\rundll32.exe'
    - 'C:\Windows\System32\rundll32.exe'
    ImageLoaded|startswith: 'C:\Windows\Installer\'
    ImageLoaded|endswith:
    - '.tmp-\Microsoft.Deployment.WindowsInstaller.dll'
    - '.tmp-\Avira.OE.Setup.CustomActions.dll'
  filter_main_assembly:
    Image|startswith:
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\Microsoft.NET\Framework64'
    Image|endswith: '\RegAsm.exe'
    ImageLoaded|endswith: '.dll'
    ImageLoaded|startswith: 'C:\Windows\assembly\NativeImages'
  filter_optional_klite_codec:
    Image:
    - 'C:\Windows\SysWOW64\regsvr32.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\K-Lite Codec Pack\'
    - 'C:\Program Files\K-Lite Codec Pack\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where Windows utilities are loading unsigned or untrusted DLLs. Attackers frequently exploit trusted system utilities, such as `rundll32.exe` and `regsvr32.exe`, to execute malicious code while bypassing standard security measures. The rule specifically highlights potential use of these utilities to load components that have not been properly signed or validated, dramatically increasing risk of code injection and exploitation.

  Adversaries may use this technique as part of a larger strategy to maintain persistence, escalate privileges, or evade detection mechanisms. The associated MITRE ATT&CK techniques include:
  - **T1218.010**: Signed Binary Proxy Execution (e.g., `regsvr32`)
  - **T1218.011**: Signing Binary Proxy Execution (e.g., `rundll32`)

  For effective detection, the primary data sources for analysis should include process creation events, system logs, and image load events to identify any unauthorized or suspicious loading of DLLs.

  ### Investigation Steps
  - **Analyze Image Load Events**: Review logs that capture image load events to identify any instances of Windows utilities loading DLLs that are unsigned or originate from untrusted locations.
  - **Examine Process Creation Logs**: Investigate recent process creation events to correlate potentially malicious utilities being invoked alongside the loaded unsigned DLLs.
  - **Deploy File Integrity Checks**: Use file integrity monitoring to check for changes to known critical system directories, particularly where unsigned DLLs may reside.
  - **Assess DLL Signing Status**: Evaluate the signing status of the DLLs being loaded alongside these utilities, specifically looking for errors or null values indicating improper signatures.

  ### Prioritization
  This alert has medium severity due to the potential impact of unauthenticated code execution within enterprise environments. The likelihood of threat actors abusing trusted system utilities to load malicious code necessitates prompt attention and investigation.

  ### Blind Spots and Assumptions
  The detection logic may miss instances of malware using fully compliant signed DLLs or exploit methods that do not involve these specific utilities. It assumes that the logging configurations are appropriately set to capture all image load events and that the system's integrity checks are enabled. A lack of visibility into certain directories or executables may create blind spots that could allow adversaries to evade detection mechanisms. Proper configuration and comprehensive logging of process images are crucial for the accuracy of this alert.

