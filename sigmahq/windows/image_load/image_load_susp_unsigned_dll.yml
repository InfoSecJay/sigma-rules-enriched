title: Unsigned DLL Loaded by Windows Utility
id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
status: test
description: |
  Detects windows utilities loading an unsigned or untrusted DLL.
  Adversaries often abuse those programs to proxy execution of malicious code.
references:
- https://www.elastic.co/security-labs/Hunting-for-Suspicious-Windows-Libraries-for-Execution-and-Evasion
- https://akhere.hashnode.dev/hunting-unsigned-dlls-using-kql
- https://unit42.paloaltonetworks.com/unsigned-dlls/?web_view=true
author: Swachchhanda Shrawan Poudel
date: 2024-02-28
modified: 2025-10-07
tags:
- attack.t1218.011
- attack.t1218.010
- attack.defense-evasion
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith:
            # Note: Add additional utilities that allow the loading of DLLs
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  filter_main_signed:
    Signed: 'true'
  filter_main_sig_status:
    SignatureStatus:
    - 'errorChaining'
    - 'errorCode_endpoint'
    - 'errorExpired'
    - 'trusted'
    - 'Valid'
  filter_main_signed_null:
    Signed:
  filter_main_signed_empty:
    Signed:
    - ''
    - '-'
  filter_main_sig_status_null:
    SignatureStatus:
  filter_main_sig_status_empty:
    SignatureStatus:
    - ''
    - '-'
  filter_main_windows_installer:
    Image:
    - 'C:\Windows\SysWOW64\rundll32.exe'
    - 'C:\Windows\System32\rundll32.exe'
    ImageLoaded|startswith: 'C:\Windows\Installer\'
    ImageLoaded|endswith:
    - '.tmp-\Microsoft.Deployment.WindowsInstaller.dll'
    - '.tmp-\Avira.OE.Setup.CustomActions.dll'
  filter_main_assembly:
    Image|startswith:
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\Microsoft.NET\Framework64'
    Image|endswith: '\RegAsm.exe'
    ImageLoaded|endswith: '.dll'
    ImageLoaded|startswith: 'C:\Windows\assembly\NativeImages'
  filter_optional_klite_codec:
    Image:
    - 'C:\Windows\SysWOW64\regsvr32.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\K-Lite Codec Pack\'
    - 'C:\Program Files\K-Lite Codec Pack\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the loading of unsigned or untrusted dynamic link libraries (DLLs) by legitimate Windows utility processes such as `rundll32.exe`, `regsvr32.exe`, and `InstallUtil.exe`. Attackers often exploit these utilities to execute malicious code in the context of a trusted system process, aiming to bypass security controls and establish persistence on the target system. This behavior aligns with the MITRE ATT&CK technique for "Executable Application Layer Protocol" (T1218.010) and "Trusted Relationship" (T1218.011).

  The primary telemetry source is Windows image load logs (which include Event ID 4688 or Sysmon Event ID 10) that capture process creation and DLL loads. If malicious, this behavior could result in unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does not inherently prove the intent behind the DLL loading; further investigation may be necessary to determine whether it is part of legitimate software functionality or malicious activity.

  ### Investigation Steps

  - **Verify the DLL being loaded:** Check the `ImageLoaded` field for DLL names associated with common vulnerabilities. Malicious DLLs may show unusual naming conventions or originate from non-standard directories, unlike legitimate components typically loaded from system folders.

  - **Examine the process origin:** Use Event ID 4688 to inspect the parent process of the utility (e.g., `rundll32.exe`), looking for unusual parent-child relationships. A legitimate process, such as a system update, is less concerning than one initiated by unexpected or suspicious user-generated activity.

  - **Analyze signed status:** Review the `Signed` field in the image load logs. Malicious DLLs are often unsigned or exhibit signature errors. If the `SignatureStatus` shows values like 'errorChaining' or 'errorExpired', this may indicate malicious intents.

  - **Identify legitimate usage patterns:** Understand expected business processes that require these utilities. For example, installations or system maintenance performed by IT departments may use `InstallUtil.exe` to register components. Compare this to the timing and usual usage context of the alert.

  - **Check for known malicious signatures:** Use threat intelligence sources to cross-reference the loaded DLLs against known malicious signatures or hashes. High-confidence indicators may include DLLs known to be involved in recent exploits or malware families.

  - **Inspect system integrity and persistence mechanisms:** Look for changes in system configurations, auto-start services, or scheduled tasks that may coincide with the alert. The detection of unsigned DLLs could correlate with attempts to establish persistence, indicating a higher level of potential compromise.

  ### Prioritization

  This alert should be treated with medium priority, as it highlights a potentially serious security risk involving unsigned DLLs being loaded by trusted Windows processes. The impacted systems could be critical to operations, and although such behavior can be legitimate, it is often weaponized by sophisticated adversaries. Continuous vigilance is warranted to discern between legitimate administration and malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations do not capture image loads comprehensively, or if filtering mechanisms prevent logging of all relevant events. Adversaries might employ code signing techniques or manipulate legitimate software to evade detection. Additionally, legitimate software updates or administrative scripts might trigger this alert under specific circumstances, requiring contextual awareness. Companion detections, such as monitoring for unusual parent-child process relationships or cross-referencing event logs for behavioral patterns, can enhance the robustness of the detection strategy.

