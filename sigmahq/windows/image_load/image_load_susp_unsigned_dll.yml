title: Unsigned DLL Loaded by Windows Utility
id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
status: test
description: |
  Detects windows utilities loading an unsigned or untrusted DLL.
  Adversaries often abuse those programs to proxy execution of malicious code.
references:
- https://www.elastic.co/security-labs/Hunting-for-Suspicious-Windows-Libraries-for-Execution-and-Evasion
- https://akhere.hashnode.dev/hunting-unsigned-dlls-using-kql
- https://unit42.paloaltonetworks.com/unsigned-dlls/?web_view=true
author: Swachchhanda Shrawan Poudel
date: 2024-02-28
modified: 2025-10-07
tags:
- attack.stealth
- attack.t1218.011
- attack.t1218.010
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith:
            # Note: Add additional utilities that allow the loading of DLLs
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  filter_main_signed:
    Signed: 'true'
  filter_main_sig_status:
    SignatureStatus:
    - 'errorChaining'
    - 'errorCode_endpoint'
    - 'errorExpired'
    - 'trusted'
    - 'Valid'
  filter_main_signed_null:
    Signed:
  filter_main_signed_empty:
    Signed:
    - ''
    - '-'
  filter_main_sig_status_null:
    SignatureStatus:
  filter_main_sig_status_empty:
    SignatureStatus:
    - ''
    - '-'
  filter_main_windows_installer:
    Image:
    - 'C:\Windows\SysWOW64\rundll32.exe'
    - 'C:\Windows\System32\rundll32.exe'
    ImageLoaded|startswith: 'C:\Windows\Installer\'
    ImageLoaded|endswith:
    - '.tmp-\Microsoft.Deployment.WindowsInstaller.dll'
    - '.tmp-\Avira.OE.Setup.CustomActions.dll'
  filter_main_assembly:
    Image|startswith:
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\Microsoft.NET\Framework64'
    Image|endswith: '\RegAsm.exe'
    ImageLoaded|endswith: '.dll'
    ImageLoaded|startswith: 'C:\Windows\assembly\NativeImages'
  filter_optional_klite_codec:
    Image:
    - 'C:\Windows\SysWOW64\regsvr32.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\K-Lite Codec Pack\'
    - 'C:\Program Files\K-Lite Codec Pack\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where Windows utilities (such as `rundll32.exe` or `regsvr32.exe`) load unsigned or untrusted Dynamic Link Libraries (DLLs). Such behavior is commonly associated with adversarial tactics aimed at executing malicious code by abusing trusted utilities. The relevant MITRE ATT&CK tactics include Execution (TA0002), specifically techniques for executing DLLs in untrusted contexts (T1218.010 and T1218.011). The primary telemetry sources for this detection are Windows Event Logs related to image loading, particularly those capturing process creation and image loads. Malicious execution of unsigned DLLs can lead to significant security incidents, such as unauthorized access or system compromise. It's critical to note that this detection alone does not confirm malicious intent; legitimate software operations or system misconfigurations can also produce similar telemetry.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 to identify the parent process of the utility loading the unsigned DLL. Legitimate activities frequently involve known system utilities triggered by trusted processes. Look for expected parent processes like `msiexec.exe` or `setup.exe` in benign cases.

  - **Analyze image load events:** Review Sysmon Event ID 7 or Windows Event Log showing the image load behaviors. Identify the `ImageLoaded` field to see which DLLs are being invoked and their paths. Malicious indicators include DLLs located in temporary folders or unusual paths outside the software’s expected directory.

  - **Check signature status:** Investigate the `SignatureStatus` field within the telemetry to determine the trust level of the loaded DLL. Malicious activity is strongly indicated if the DLL reports an error status (e.g., `errorChaining` or `errorExpired`) or has no signature.

  - **Identify high-risk DLLs:** Validate if the image loaded is associated with malicious activity by cross-referencing against known signatures of malicious DLLs or using threat intelligence feeds. Libraries that are unduly complex or non-standard for the utility used (i.e., `rundll32.exe`) may signal potential exploitation.

  - **Review asset criticality:** Consider the role of the machine involved. High-impact systems such as domain controllers or critical infrastructure should be prioritized for immediate investigation as they pose higher risks if compromised.

  ### Prioritization

  This alert is medium severity as it indicates potential attempts to execute unauthorized code on critical systems, which could severely impact the organization. The likelihood of malicious abuse is moderate as the use of unsigned DLLs is a common technique among adversaries. However, it can also arise from benign software behavior, necessitating careful analysis.

  ### Blind Spots and Assumptions

  The detection is limited by the accuracy of signature status evaluations and may be evaded by more sophisticated adversaries using signed but malicious DLLs or using alternative execution methods that do not involve these utilities. Required log sources must be correctly configured; without Sysmon or extensive process creation logging, such detections may be incomplete. Legitimate activities, such as the normal execution of software installations or system updates, could trigger this alert. A related detection is monitoring for DLL search order hijacking (MITRE ID T1218.011), which could complement coverage for execution through different approaches.

