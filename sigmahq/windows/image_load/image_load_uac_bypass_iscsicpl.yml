title: UAC Bypass Using Iscsicpl - ImageLoad
id: 9ed5959a-c43c-4c59-84e3-d28628429456
status: test
description: Detects the "iscsicpl.exe" UAC bypass technique that leverages a DLL
  Search Order hijacking technique to load a custom DLL's from temp or a any user
  controlled location in the users %PATH%
references:
- https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC
- https://twitter.com/wdormann/status/1547583317410607110
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-17
modified: 2022-07-25
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image: C:\Windows\SysWOW64\iscsicpl.exe
    ImageLoaded|endswith: '\iscsiexe.dll'
  filter:
    ImageLoaded|contains|all:
    - 'C:\Windows\'
    - 'iscsiexe.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential User Account Control (UAC) bypass attempts utilizing the `iscsicpl.exe` executable, which may be manipulated to load a custom dynamic link library (DLL) through a malicious file path, specifically targeting `iscsiexe.dll`. The technique employs a DLL search order hijacking method, wherein the attacker relies on placing a rogue DLL in a location that is searched before the legitimate DLL, effectively allowing unauthorized code execution with escalated privileges.

  The primary threat scenario revolves around an attacker seeking to bypass Windows UAC protections to execute malicious payloads with elevated privileges without raising suspicion. Such actions typically indicate an attempt to establish a foothold or perform further actions within the compromised system, aligning with tactics focused on evading defenses and escalating privileges.

  Relevant MITRE ATT&CK techniques include:
  - **T1548.002**: Abuse Elevation Control Mechanism: Bypass User Account Control
  - **T1083**: File and Directory Discovery (context for searching for paths)

  The essential telemetry to support the investigation includes image load events from Windows systems, tracking which DLLs are loaded by various executables, particularly the malicious `iscsicpl.exe`.

  ### Investigation Steps
  - **Review Image Load Events**: Investigate logs for `iscsicpl.exe` and check for any associated DLL loads, particularly focusing on instances where `iscsiexe.dll` is loaded from non-standard paths.

  - **Analyze Process Creation Logs**: Look into the process creation logs to identify any recent executions of `iscsicpl.exe`, especially those that seem anomalous in time or context.

  - **Inspect User's PATH Variable**: Check for recent modifications to the user's `%PATH%` environment variable. Analyze if any directories that are controlled by users are present that could host the rogue DLL.

  - **Correlate with EDR Alerts**: Utilize endpoint detection results to find out if there were any alerts related to privilege escalation or suspicious behavior from the identified processes.

  ### Prioritization
  The severity of this alert is classified as high due to the implications of successful UAC bypass attempts, which could lead to significant privilege escalation and the installation of malware or further exploitation within the enterprise environment. Attackers often leverage such techniques to execute attacks undetected, increasing threat potential.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage for variants of the UAC bypass technique not specifically using `iscsicpl.exe` or where the DLL is named differently. It assumes that the targeted systems have correct configurations to log image loads comprehensively. Additionally, the rule requires complete logging of process and image loads, which may not be consistently enabled across all systems, leading to possible missed detections.

