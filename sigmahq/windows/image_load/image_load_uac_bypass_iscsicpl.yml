title: UAC Bypass Using Iscsicpl - ImageLoad
id: 9ed5959a-c43c-4c59-84e3-d28628429456
status: test
description: Detects the "iscsicpl.exe" UAC bypass technique that leverages a 
  DLL Search Order hijacking technique to load a custom DLL's from temp or a any
  user controlled location in the users %PATH%
references:
- https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC
- https://twitter.com/wdormann/status/1547583317410607110
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-17
modified: 2022-07-25
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image: C:\Windows\SysWOW64\iscsicpl.exe
    ImageLoaded|endswith: '\iscsiexe.dll'
  filter:
    ImageLoaded|contains|all:
    - 'C:\Windows\'
    - 'iscsiexe.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to exploit the "iscsicpl.exe" process to bypass User Account Control (UAC) through a DLL search order hijacking technique. An attacker may aim to elevate privileges by leveraging the hijacked DLL, `iscsiexe.dll`, located in a user-controlled path. The relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and **Privilege Escalation (T1548.002)**. Primary telemetry sources include Windows Event logs associated with image loading activities, specifically the Image Load events.

  If successfully executed, this attack could allow the malicious actor to gain higher privileges on the compromised system, thus posing a critical security risk. Importantly, this detection alone does not confirm malicious intent, as legitimate applications may also interact with the `iscsicpl.exe` process.

  ### Investigation Steps

  - **Check event logs for image load activity:** Inspect Windows Security Event ID 4663 for `C:\Windows\SysWOW64\iscsicpl.exe` and subsequent loading of `iscsiexe.dll`. Focus on the process creation timestamp and parent process to assess workflow origin.

  - **Investigate DLL path and signatures:** Analyze the originating path of `iscsiexe.dll` against common legitimate paths (e.g., C:\Windows\) using Sysmon Event ID 7. Non-standard locations may indicate malicious activity, particularly if found in the user’s Temp or %PATH% directories.

  - **Examine parent process relationships:** Using Process Explorer or equivalent tools, review the parent-child process trees involving `iscsicpl.exe`. Legitimate usage typically involves system-level processes; deviations may suggest an attacker’s workflow.

  - **Identify potential high-confidence indicators:** Look for the presence of `iscsiexe.dll` loaded from an unexpected directory in Sysmon Event ID 7 logs. If the `ImageLoaded` paths point to a custom user-controlled location outside of standard directories, treat this as a high-confidence malicious indicator.

  - **Validate user/system roles:** Consider the role of the affected host (e.g., servers vs. workstations) and account under which processes are running. Privileged accounts executing `iscsicpl.exe` in unusual contexts escalate risk.

  ### Prioritization

  This alert should be prioritized as high due to the potential impact on system integrity and the likelihood of exploitation through UAC bypass techniques. Such behavior has been documented in real-world attacks, indicating it is a common vector for privilege escalation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics where attackers may use encrypted or obfuscated DLLs, which may not be easily identified. It is critical to ensure proper configurations exist to capture relevant image load telemetry, as incomplete log sourcing may lead to missed detections. Legitimate administrative actions, such as software installation and updates, could generate similar alerts. A related detection rule focusing on unusual process creation events could reinforce coverage against these tactics.

