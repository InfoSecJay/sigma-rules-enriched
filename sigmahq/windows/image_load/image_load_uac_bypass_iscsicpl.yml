title: UAC Bypass Using Iscsicpl - ImageLoad
id: 9ed5959a-c43c-4c59-84e3-d28628429456
status: test
description: Detects the "iscsicpl.exe" UAC bypass technique that leverages a 
  DLL Search Order hijacking technique to load a custom DLL's from temp or a any
  user controlled location in the users %PATH%
references:
- https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC
- https://twitter.com/wdormann/status/1547583317410607110
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-17
modified: 2022-07-25
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image: C:\Windows\SysWOW64\iscsicpl.exe
    ImageLoaded|endswith: '\iscsiexe.dll'
  filter:
    ImageLoaded|contains|all:
    - 'C:\Windows\'
    - 'iscsiexe.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies the misuse of the legitimate `iscsicpl.exe` binary to perform a User Account Control (UAC) bypass through DLL Search Order Hijacking. Attackers may use this technique to escalate privileges or execute malicious code with elevated permissions without alerting the user. The relevant MITRE ATT&CK tactic is Privilege Escalation, specifically technique T1548.002 (Bypass User Account Control).

  The primary telemetry sources include Windows Image Load events indicating when executables or DLLs are loaded. Specifically, the key log types are captured through Event ID 4657 and Sysmon Event ID 7 (Image Load). The security impact could be significant if exploited, allowing an attacker to execute malicious DLLs with elevated privileges. This detection does NOT confirm that the activity is malicious on its own; additional context is necessary to determine intent.

  ### Investigation Steps

  - **Review Image Loaded Events:** Check for Sysmon Event ID 7 that shows `iscsiexe.dll` being loaded by `iscsicpl.exe`. Analyze the `ImageLoaded` field to confirm it matches `C:\Windows\SysWOW64\iscsicpl.exe`.

  - **Identify DLL Source:** Verify the path of `iscsiexe.dll` in the `ImageLoaded` field. If the path is outside of `C:\Windows\`, this might indicate a malicious payload.

  - **Check for UAC Bypass Activity:** Investigate if `iscsicpl.exe` was executed with arguments typical of elevated tasks (local administrative operations). Review Event ID 4688 for process creation associated with `iscsicpl.exe`.

  - **Legitimate Use Case Examination:** Determine if `iscsicpl.exe` was recently accessed by legitimate admin tasks. Cross-reference the event logs to confirm expected usage patterns such as scheduled maintenance or system configuration.

  - **Cross-reference with Security Solutions:** Validate whether any endpoint detection solutions flagged `iscsicpl.exe` or `iscsiexe.dll` as potentially malicious. Check current threat intelligence sources for any similar indicators.

  ### Prioritization

  This alert should be prioritized as high severity in an enterprise context due to the potential impact of privilege escalation. Given that UAC bypass techniques are often weaponized in attacks for lateral movement or exploitation, the likelihood of malicious abuse remains high.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate administrative actions that utilize `iscsicpl.exe`, especially in environments where system configurations are routinely updated. Reliable detection requires the configuration of Sysmon and proper logging of image load events. Additionally, tools and processes that perform legitimate administrative tasks may inadvertently trigger the alert. Companion detections, such as monitoring for abnormal parent-child process relationships or suspicious Windows Service modifications, can enhance overall detection capability.

