  rule if you consider them as safe locations
level: medium
note: |
  ### Technical Context

  This rule detects Microsoft Excel loading an Add-In (`.xll`) file from non-standard or unusual paths such as `Desktop`, `Downloads`, or `Temp`. The typical attacker objective is to use malicious Excel Add-Ins to execute harmful code, often as part of a payload delivery mechanism or to enable further exploitation within an environment. This behavior is categorized under the MITRE ATT&CK framework as Execution (T1204.002).

  The primary telemetry sources include Windows image load events, specifically targeting Event ID 4688 for process creation or Sysmon Event ID 7 related to Load Image events. If malicious, this behavior can lead to unauthorized code execution, data exfiltration, or lateral movement within the network. Importantly, the detection does not confirm that the `.xll` file is malicious on its own; it merely indicates that an add-in was loaded from an atypical location.

  ### Investigation Steps

  - **Identify the file path of the loaded Add-In:** Check Sysmon Event ID 7 (Load Image) for the `ImageLoaded` field and note the path. Paths such as `C:\Users\<username>\Downloads\malicious.xll` indicate potential malicious activity, while paths like `C:\Program Files\Microsoft Office\` suggest benign usage.

  - **Review execution context in Event ID 4688:** Analyze Event ID 4688, focusing on the `NewProcessName` field where the Excel executable (`excel.exe`) is launched. Compare the timestamps and user accounts to identify anomalies, such as execution from service accounts or unusual operational hours.

  - **Correlate with user behavior:** Validate the user's activity leading up to the alert. If the user typically does not utilize Excel Add-Ins or has a history of accessing files from the suspicious locations mentioned, it raises red flags.

  - **Check for digital signatures:** Investigate whether the loaded `.xll` file has a valid digital signature. Absence of a signature or one from an unrecognized or suspicious publisher can indicate malicious intent.

  - **Investigate companion logs for file creation:** Review Windows Security logs (Event ID 4663 - Access Attempted to File), particularly focusing on file access events around the time of the alert to confirm whether any executable activity precedes or follows the add-in load, indicating potential exploitation methods.

  ### Prioritization

  This alert should be treated with medium severity. Systems involved in this detection are often critical for business operations (e.g., finance, reporting), making them attractive targets for attackers. The presence of add-ins loaded from uncommon locations is a tactic that is increasingly weaponized by adversaries to execute payloads unnoticed.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate users may occasionally load `.xll` files from uncommon paths due to mishandling or local policies. Proper configurations, including full logging of process creations and image loads, are necessary for effective detection. Additionally, users accessing safe add-ins from their personal directories may inadvertently trigger this alert. A related detection that can augment coverage includes monitoring for unusual file creation or modifications in `C:\Users\<username>\Downloads`.

