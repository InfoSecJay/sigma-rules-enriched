detection:
  selection:
    Image|endswith: '\excel.exe'
    ImageLoaded|contains:
            # Note: Add or remove locations from this list based on your internal policy
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - '\Temp\'
    - '\Users\Public\'
    - '\Windows\Tasks\'
    ImageLoaded|endswith: '.xll'
  condition: selection
falsepositives:
- Some tuning might be required to allow or remove certain locations used by the rule
  if you consider them as safe locations
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where Microsoft Excel loads an Add-In (.xll file) from uncommon or potentially suspicious locations on a Windows system. Attackers often use malicious Excel Add-Ins to execute commands or to drop malware onto a victim's machine unnoticed. Upon successfully executing the malicious code, the attacker may aim to escalate privileges, exfiltrate data, or further compromise the environment.

  This activity is aligned with several MITRE ATT&CK tactics and techniques, specifically under Execution (T1204.002 - Malicious File Delivery). The use of Add-Ins is a known tactic among threat actors, particularly those affiliated with advanced persistent threats (APTs) or financially motivated groups like FIN7, leveraging such techniques to bypass security detections through seemingly legitimate software functionality.

  Primary data sources for this detection include image load events which provide visibility into when and where executables and their accompanying files are loaded in memory. Monitoring these events helps analysts identify unusual patterns that could indicate compromised activity.

  ### Investigation Steps
  - **Examine Image Load Events:** Review the logs for image load events where Excel (.exe) loads .xll files. Pay particular attention to the locations from where these files are being loaded to identify any uncommon sources.
  - **Audit Common Directories:** Specifically look into files loaded from directories such as '\Desktop\', '\Downloads\', or '\Temp\'. Check for any known safe files versus newly created or updated files that might seem suspicious.
  - **Correlate with User Activity:** Analyze user activity logs leading to the image load events. Identify if there was unusual user behavior preceding the execution of the .xll file which could suggest spear-phishing or social engineering attempts.
  - **Evaluate Contextual Intelligence:** Utilize threat intelligence resources to determine if the detected .xll files correlate with known malicious hashes or signatures associated with threat actors like FIN7 or other relevant groups.

  ### Prioritization
  The alert warrants medium severity as the loading of .xll files from uncommon locations can indicate opportunistic or targeted attacks. Given that Excel is widely used in enterprises, such incidents can enable substantial data exfiltration or lateral movement if not promptly addressed.

  ### Blind Spots and Assumptions
  This rule may not cover all potential malicious activity, particularly if Excel Add-Ins are employed from locations deemed safe by the organization's policies. The detection logic assumes that the common directories outlined will not contain legitimate tools used by employees. Without comprehensive logging for all image loads or if policies are not created to catch evolving tactics, detection efficacy could be diminished, thus requiring proper configuration of logging across all potential attack vectors.

