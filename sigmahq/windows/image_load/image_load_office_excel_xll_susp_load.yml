  ---

  ### Technical Context

  This Sigma rule detects the loading of a Microsoft Excel Add-In (.xll) file from uncommon directory locations, which may indicate unauthorized or malicious activity. Attackers use malicious Excel Add-Ins to execute code or facilitate payload delivery with the intent to compromise systems or exfiltrate data. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and technique **Malicious Add-ins** (T1204.002).

  The primary telemetry source includes Windows image load logs, specifically targeting Excel executable activity. If malicious, the security impact can include unauthorized data access, remote control, or increased lateral movement within the organization. It is essential to note that this detection does **NOT confirm** malicious intent or execution on its own, as legitimate business operations could still trigger such alerts.

  ---

  ### Investigation Steps

  - **Review the loaded file path:** Check the `ImageLoaded` field for paths such as `\Desktop\`, `\Downloads\`, and `\Public\`. Legitimate add-ins typically load from known or administrative locations (e.g., `C:\Program Files\Microsoft Office\`).

  - **Examine Event IDs for Excel activity:** Investigate Windows Event ID 4688 (Process Creation) for logs showing `excel.exe` alongside the detected .xll file, correlating it with other potentially suspicious processes.

  - **Identify unusual add-in behavior:** Determine if the .xll files make unusual API calls or attempt to connect to external resources. Check network logs for outbound connections around the time of the activity.

  - **Check user context:** Analyze the `SubjectUserName` field or equivalent to see if the action was performed by a legitimate user account. Unexpected or administrative accounts executing these actions could indicate malicious intent.

  - **Validate against whitelisted add-ins:** Compare the detected .xll files against a list of known safe add-ins. If the detected add-in does not appear on the whitelist, flag it for further investigation.

  - **Look for creation or modification timestamps:** If the .xll file has recently been created (check file system logs), this could indicate potential malicious upload or delivery attempts, which warrants deeper investigation.

  ---

  ### Prioritization

  This alert should be considered of **medium severity** as it involves the execution of potentially harmful code within a commonly trusted application (Excel). Given the increasing prevalence of Excel in cyber-attacks, especially via weaponized documents, a careful review is warranted to assess the likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  One limitation of this detection is that attackers may disguise malicious .xll files in common locations, making it difficult to distinguish between benign and harmful activity. Additionally, the rule may miss activity if logging configurations do not capture all Excel process executions (e.g., if image load logs are not enabled). Common legitimate activities include loading add-ins during normal business operations or updates from trusted sources. A companion detection to strengthen coverage could include monitoring for unusual process creations associated with macros or scripts (e.g., VBA Activity - T1059.005).

