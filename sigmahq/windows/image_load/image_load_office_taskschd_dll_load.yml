title: Microsoft Office Application Loading Task Scheduler DLL
id: 8d1e674c-5c03-4be1-949c-4b85a472dc16
status: experimental
description: |
  Detects a Microsoft Office application loading taskschd.dll, which exposes COM interfaces for managing Windows Scheduled Tasks.
  This load is an early precursor to scheduled task creation or modification and has been frequently observed in macro-enabled
  malicious documents attempting to establish persistence.
references:
- https://github.com/saksham-17/detection-lab/blob/cbc25dfe1e5eda0c4e5a7d66b6d3bbd27829e158/T1053.005-scheduled-task/tests/test5-task-scheduler-via-VBA/report.md
author: Saksham Bhattarai, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-11-04
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
- attack.execution
- attack.t1204.002
logsource:
  category: image_load
  product: windows
detection:
  selection_dll:
  - ImageLoaded|endswith: '\taskschd.dll'
  - OriginalFileName: 'taskschd.dll'
  selection_exe:
    Image|endswith:
    - '\eqnedt32.exe'
    - '\excel.exe'
    - '\fltldr.exe'
    - '\graph.exe'
    - '\msaccess.exe'
    - '\mspub.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'
    - '\onenotem.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\visio.exe'
    - '\winproj.exe'
    - '\winword.exe'
  condition: all of selection_*
falsepositives:
- Legitimate add-ins or automation scripts that use Office applications to 
  manage scheduled tasks (rare in most environments)
level: medium
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_office_taskschd_dll_load/info.yml
note: |
  ### Technical Context

  This Sigma rule detects instances where Microsoft Office applications (e.g., Word, Excel) load the `taskschd.dll`, a component for managing Windows Scheduled Tasks. This behavior is indicative of an attacker attempting to establish persistence through malicious Office macros, which leverage the Windows Task Scheduler for execution. Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Execution** (TA0002) with specific technique IDs T1053.005 (Scheduled Task/Job) and T1204.002 (Malicious File). The primary telemetry sources are Windows image load events (e.g., Event ID 10 from the Windows Event Log), specifically focusing on DLL loads. If malicious, this behavior can lead to unauthorized task creation or modification, allowing further malicious actions. This detection alone does not confirm malicious intent, as it may also be associated with legitimate automated processes using Office applications.

  ### Investigation Steps

  - **Check the source of `taskschd.dll` loads**: Review Telemetry (Event ID 10) around Office application execution (e.g., `excel.exe`, `winword.exe`). Look for anomalies, such as unfamiliar applications loading the DLL. Legitimate use cases are rare and may include automation scripts.

  - **Correlate with other activities**: Look for scheduled tasks created shortly after the DLL load. Check the Task Scheduler (Event ID 4698) for any new, unexpected tasks. Malicious tasks usually run executables that are not part of standard installations.

  - **Analyze the context of the Office application**: Investigate the originating document or context from which the Office application was launched. Documents with macros should be flagged; review their source and user interactions (e.g., recent document opened).

  - **Review for patterns indicative of malware**: Cross-reference recent DLL load activities against known threat intelligence lists for the Office applications listed in the Sigma rule. Look for matches or signatures of known malware.

  - **Confirm the legitimacy of task management usage**: Determine if any known legitimate automated scripts or add-ins are using the Office applications in question (e.g., Office add-ins that utilize Windows Task Scheduler). Most environments do not use these mechanisms extensively.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on affected systems if persistent malicious tasks are created. Given that this activity is a known precursor to further exploitation and that the loading of `taskschd.dll` by common Office applications is frequently weaponized by adversaries, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by malware that uses alternative methods to create scheduled tasks without loading `taskschd.dll` directly. Adequate telemetry collection is required, specifically ensuring logging for image load events is correctly configured. Legitimate use cases may include Office add-ins managing scheduled tasks, particularly in automated environments. A companion detection rule could focus on unusual scheduled task creation patterns to provide context for the alerts generated by this rule.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
