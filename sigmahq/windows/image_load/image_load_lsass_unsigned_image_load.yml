note: |
  ### Technical Context
  This detection rule identifies attempts to load unsigned images (DLLs or EXEs) into the Local Security Authority Subsystem Service (LSASS) process, which is critical for handling sensitive credentials in a Windows environment. Attackers often target LSASS to perform credential dumping, enabling them to extract user credentials for lateral movement within an enterprise network. The primary objective of this activity is to facilitate unauthorized access to systems by leveraging compromised credentials.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Credential Access** (TA0006) and **Credential Dumping** (T1003.001). Unsanctioned modifications to LSASS can bypass security measures, hence detection is crucial in preventing credential theft within the network.

  The primary data sources for this detection are the Windows image load event logs, which provide information on process executions and the signatures of loaded images. Monitoring event logs specifically related to the LSASS process can help identify unauthorized access attempts and potentially malicious behaviors.

  ### Investigation Steps
  - **Review Image Load Logs:** Examine the image load event logs related to the process `lsass.exe` to identify any instances of unsigned images being loaded. Look for timestamps and the user context under which this action occurred.

  - **Correlate with Process Activity:** Investigate the processes that attempted to load unsigned images into LSASS. Validate the legitimacy of these processes by checking their paths and signatures against known safe applications.

  - **Analyze User Activities:** Assess the user activity around the time of the alert. Check for any unusual logins, especially from remote desktop sessions or administrative accounts, which could indicate a potential compromise.

  - **Check for Credential Dumping Tools:** Look for traces of common credential dumping tools or scripts that may have been executed prior to or after the unsigned image load event. Consider reviewing command history and process command lines.

  ### Prioritization
  The severity of this alert is medium in an enterprise environment because it highlights potential credential dumping activity, which, if successful, could lead to significant internal threats or breaches. The likelihood of malicious actors attempting to exploit LSASS for credential access is moderate, given that this is a common tactic among advanced persistent threats (APTs).

  ### Blind Spots and Assumptions
  This detection logic assumes that all malicious activity will involve loading unsigned images, which may not cover sophisticated attacks utilizing signed but potentially compromised images. Furthermore, the effectiveness of this rule is dependent on comprehensive logging settings to capture image loading events from the LSASS process. If logging configurations aren't set to capture this level of detail, detection efficacy may be significantly impaired.

