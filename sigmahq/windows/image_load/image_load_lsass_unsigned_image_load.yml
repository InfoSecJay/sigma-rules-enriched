  ---

  ### Technical Context

  This Sigma rule detects the loading of unsigned images (DLLs or EXEs) into the LSASS (Local Security Authority Subsystem Service) process. Attackers often target LSASS to extract sensitive credentials, which can facilitate further unauthorized access within a compromised environment. The relevant MITRE ATT&CK tactic is **Credential Access**, specifically technique **T1003.001 (Credential Dumping: LSASS Memory)**.

  The primary telemetry source is the Windows image load events, specifically leveraging image loading logs that capture process interactions. If malicious, the security impact could involve credential theft, leading to lateral movement and data exfiltration. This detection does not confirm that credential dumping has occurred; rather, it flags suspicious behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check process creation history:** Review Security Event ID **4688** for any recent LSASS process creation details, including the user context. Legitimate operations generally do not involve unsigned images.

  - **Examine image load events:** Analyze Windows Event logs for events related to image loading; look for entries indicating an unsigned image loaded into the LSASS process. Note the `Image` field for specific file paths.

  - **Identify user context:** Check the user account associated with the process that loaded the unsigned image. Analyze against known user behavior; typical RDP users may present deviations from established patterns.

  - **Look for credential accesses:** Investigate additional logs for any signs of credential dumping activities following the alert, specifically looking for Security Event ID **4624** (logon events) around the same time. Multiple failed logon attempts post-event raise higher suspicion.

  - **Correlate with application whitelisting:** If application whitelisting tools are employed, verify if the loaded unsigned image is an exception vs. a policy violation. Legitimate applications are usually signed by trusted publishers.

  ---

  ### Prioritization

  This alert holds medium severity due to the sensitive nature of the LSASS process. While the likelihood of malicious abuse is significant given the known techniques for credential dumping, this behavior is less common in standard operations, making it a noteworthy indicator for further review.

  ---

  ### Blind Spots and Assumptions

  The detection may miss signed images used maliciously, as attackers often use signed binaries to blend in. Reliable detection depends on proper logging configurations for image loads and process tracking. Valid administrative actions, such as remote desktop connections or certain application updates, can mistakenly trigger the alert. A related detection could involve monitoring for direct access or modification events on LSASS itself (e.g., Event ID **4907**), which reinforces credential access monitoring.

