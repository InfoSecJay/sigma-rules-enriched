detection:
  selection:
    Image|endswith: '\BaaUpdate.exe'
    ImageLoaded|endswith: '.dll'
    ImageLoaded|contains:
    - ':\Perflogs\'
    - ':\Users\Default\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Favorites\'
    - '\Favourites\'
    - '\Links\'
    - '\Music\'
    - '\Pictures\'
    - '\ProgramData\'
    - '\Temporary Internet'
    - '\Videos\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the BitLocker Access Agent Update Utility (BaaUpdate.exe) loads DLLs from potentially insecure or publicly writable locations. Such behavior may indicate malicious activity, particularly lateral movement through exploitation of COM Hijacking techniques. Attackers could leverage the BaaUpdate.exe process to execute arbitrary code within the context of the currently logged-in user, potentially gaining unauthorized access to sensitive information or systems.

  The primary threat scenario involves an attacker leveraging the COM classes that are configured to run as an interactive user, specifically targeting the BDEUILauncher Class (CLSID ab93b6f1-be76-4185-a488-a9001b105b94). By manipulating the execution environment of BaaUpdate.exe, they can run malicious code without needing to compromise credentials directly. This aligns with the MITRE ATT&CK tactics of Defense Evasion (T1203) and Lateral Movement (T1021.003), highlighting the risk of both executing unauthorized commands and moving laterally within the network.

  Key data sources for this detection include Windows process creation and image load events, specifically monitoring locations that are known to be less secure, such as temporary directories or publicly writable paths.

  ### Investigation Steps
  - **Review Process Logs:** Analyze process creation logs to identify instances of BaaUpdate.exe execution, particularly those triggering DLL loads from suspicious directories.
  - **Inspect DLL Load Logs:** Monitor image load logs for DLLs loaded by BaaUpdate.exe; focus on those originating from non-standard directories for malicious behavior.
  - **Correlate User Activity:** Examine user session logs to understand the context in which BaaUpdate.exe was launched and whether it coincides with other suspicious activities.
  - **Assess File Integrity:** Investigate any DLLs loaded from writable directories for known malicious signatures or behaviors, and correlate with threat intelligence feeds.

  ### Prioritization
  This alert is classified as high severity due to the potential for attackers to exploit COM Hijacking techniques, granting them elevated privileges and facilitating lateral movement within an enterprise network, which could lead to significant data breaches or operational disruptions.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that sufficient logs are being captured for process creation and DLL loading events. Gaps may arise if alternate execution paths or security mechanisms are in place that prevent BaaUpdate.exe from being invoked via COM. Additionally, results could be skewed by benign uses of BaaUpdate.exe that involve legitimate processes loading DLLs from user-owned directories, requiring further context to differentiate between malicious and legitimate behavior.

