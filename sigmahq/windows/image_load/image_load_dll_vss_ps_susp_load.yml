  type: similar
status: test
description: |
  Detects the image load of vss_ps.dll by uncommon executables. This DLL is used by the Volume Shadow Copy Service (VSS) to manage shadow copies of files and volumes.
  It is often abused by attackers to delete or manipulate shadow copies, which can hinder forensic investigations and data recovery efforts.
  The fact that it is loaded by processes that are not typically associated with VSS operations can indicate suspicious activity.
references:
- https://www.virustotal.com/gui/file/ba88ca45589fae0139a40ca27738a8fc2dfbe1be5a64a9558f4e0f52b35c5add
- https://twitter.com/am0nsec/status/1412232114980982787
author: Markus Neis, @markus_neis
date: 2021-07-07
modified: 2025-07-11
tags:
- attack.defense-evasion
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vss_ps.dll'
  filter_main_legit:
    Image|startswith: 'C:\Windows\'
    Image|endswith:
    - '\clussvc.exe'
    - '\dismhost.exe'
    - '\dllhost.exe'
    - '\inetsrv\appcmd.exe'
    - '\inetsrv\iissetup.exe'
    - '\msiexec.exe'
    - '\rundll32.exe'
    - '\searchindexer.exe'
    - '\srtasks.exe'
    - '\svchost.exe'
    - '\System32\SystemPropertiesAdvanced.exe'
    - '\taskhostw.exe'
    - '\thor.exe'
    - '\thor64.exe'
    - '\tiworker.exe'
    - '\vssvc.exe'
    - '\vssadmin.exe'
    - '\WmiPrvSE.exe'
    - '\wsmprovhost.exe'
  filter_main_update:
    CommandLine|startswith: 'C:\$WinREAgent\Scratch\'
    CommandLine|contains: '\dismhost.exe {'
  filter_main_image_null:
    Image:
  filter_optional_programfiles:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the loading of the `vss_ps.dll` library by processes that are not typically associated with the Volume Shadow Copy Service (VSS). The `vss_ps.dll` is utilized by the VSS to manage shadow copies of files and volumes. Attackers often exploit this DLL to manipulate, delete, or bypass shadow copies, which can severely obstruct forensic investigations and jeopardize data recovery efforts. The involvement of uncommon executables in loading this DLL indicates a potential malicious activity targeting system integrity and evidence preservation.

  The suspected threat family could include actors employing techniques for lateral movement and data destruction or exfiltration, possibly aligning with tactics such as Defense Evasion and Impact. Relevant MITRE ATT&CK techniques include T1490 (Inhibit System Recovery), which encompasses methods for disabling or interfering with system recovery tools.

  The primary data sources for this detection rule include image load events on Windows systems, which provide insight into what libraries are being used by executables in the environment. System process logs that track image loads can reveal uncommon usage patterns of `vss_ps.dll`, which, when correlated with other system activity, can strengthen the case for required investigative prioritization.

  ### Investigation Steps
  - **Review Image Load Events**: Examine the logs for any image loads of `vss_ps.dll` and identify the parent processes responsible for these events. Look for anomalies such as infrequent or non-standard executables calling this DLL.

  - **Analyze Process Command Lines**: Investigate the command lines associated with the parent processes loading `vss_ps.dll`. Pay attention to suspicious or non-standard parameters which may indicate malicious intent.

  - **Correlate with Shadow Copy Activity**: Check for recent activity related to shadow copies, such as deletions, modifications, or access by unauthorized users. This can help assess whether the shadow copies are being manipulated post-DLL loading.

  - **Check System Integrity**: Utilize host-based file integrity monitoring to determine if critical system files or restore points have been altered or deleted following this alert, supporting understanding if system restoration capabilities are at risk.

  ### Prioritization
  The alert's high severity is warranted due to the potential significant impact of shadow copy manipulation on forensic investigations and incident response efforts. The likelihood of such activity indicating genuine attacks makes timely and effective response critical.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious activity due to potential misconfigurations in logging or insufficient coverage of custom executables used within an organization. The rule assumes that all relevant processes generate image load events, which might be circumvented by advanced persistent threats utilizing stealth techniques. For optimal functionality, logging for image loads must be properly configured to ensure comprehensive visibility into DLL usage across the environment.

