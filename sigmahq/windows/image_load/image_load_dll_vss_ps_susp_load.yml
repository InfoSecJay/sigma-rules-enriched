  type: similar
status: test
description: |
  Detects the image load of vss_ps.dll by uncommon executables. This DLL is used by the Volume Shadow Copy Service (VSS) to manage shadow copies of files and volumes.
  It is often abused by attackers to delete or manipulate shadow copies, which can hinder forensic investigations and data recovery efforts.
  The fact that it is loaded by processes that are not typically associated with VSS operations can indicate suspicious activity.
references:
- https://www.virustotal.com/gui/file/ba88ca45589fae0139a40ca27738a8fc2dfbe1be5a64a9558f4e0f52b35c5add
- https://twitter.com/am0nsec/status/1412232114980982787
author: Markus Neis, @markus_neis
date: 2021-07-07
modified: 2025-07-11
tags:
- attack.defense-evasion
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vss_ps.dll'
  filter_main_legit:
    Image|startswith: 'C:\Windows\'
    Image|endswith:
    - '\clussvc.exe'
    - '\dismhost.exe'
    - '\dllhost.exe'
    - '\inetsrv\appcmd.exe'
    - '\inetsrv\iissetup.exe'
    - '\msiexec.exe'
    - '\rundll32.exe'
    - '\searchindexer.exe'
    - '\srtasks.exe'
    - '\svchost.exe'
    - '\System32\SystemPropertiesAdvanced.exe'
    - '\taskhostw.exe'
    - '\thor.exe'
    - '\thor64.exe'
    - '\tiworker.exe'
    - '\vssvc.exe'
    - '\vssadmin.exe'
    - '\WmiPrvSE.exe'
    - '\wsmprovhost.exe'
  filter_main_update:
    CommandLine|startswith: 'C:\$WinREAgent\Scratch\'
    CommandLine|contains: '\dismhost.exe {'
  filter_main_image_null:
    Image:
  filter_optional_programfiles:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `vss_ps.dll` by uncommon executables, a behavior that often indicates a potential attempt to manipulate or delete volume shadow copies by an adversary. The objective may be to hinder forensic investigations and data recovery efforts post-compromise. This detection aligns with the MITRE ATT&CK techniques of Defense Evasion (T1490).

  The primary telemetry source includes Windows image load events, specifically looking for Event ID 4688 (Process Creation) where `vss_ps.dll` is loaded. If the load is performed by non-standard executables, it raises the risk of malicious activity on the system. While this detection indicates a potential misuse of shadow copy functions, it does NOT confirm malicious intent by itself, as there can be benign use cases for this DLL.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation**: Review Security Event ID 4688 logs for process creation events that show the loading of `vss_ps.dll`. Filter for unusual parent processes not listed in the legitimate filter. Look for timestamps correlating with alert events.

  - **Analyze command line arguments of parent processes**: If the parent process is `dismhost.exe`, verify that the command line does not include abnormal or suspicious arguments that could indicate a manipulation attempt (e.g., `dismhost.exe {SOME_UNEXPECTED_FLAG}`).

  - **Assess typical behavior of cited executables**: Confirm benign loads of `vss_ps.dll` to see if they originate from expected executables like `vssadmin.exe`, `taskhostw.exe`, or other common Windows processes. Refer to organization documentation for legitimate operational contexts.

  - **Identify high-confidence malicious indicators**: Look for processes such as `cmd.exe`, or `powershell.exe` spawning and loading `vss_ps.dll`. This combination is often associated with script-based exploitation tactics. Verify these events in Windows Security Event ID 4688 logs.

  - **Review parent-child relationships in process creation**: Use Sysmon Event ID 1 to analyze the process tree for suspect executable and DLL loads. Examine closely any processes historically leveraged in prior incidents.

  - **Inspect for signs of shadow copy manipulation**: Check for unusual creation or deletion logs in VSS through `vssadmin list shadows` and review for any unexpected activity, particularly around times when alerts were triggered.

  ### Prioritization

  The alert severity is high due to the implications of potential data destruction or forensic obstruction. The use of `vss_ps.dll` in unusual contexts strongly suggests an attempt by adversaries to interfere with critical backup functionalities, which could be weaponized during an active compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by processes that are legitimately using `vss_ps.dll`, leading to false positives. Heavy reliance on certain log sources, like Windows Event logs for abnormal image loads, is critical for reliability. Typical legitimate activities may occasionally involve tools like backup software or system utilities that use this DLL as part of standard operations. A related detection worth implementing is tracking unusual command line executions (e.g., through PowerShell) that directly interact with VSS functions to ensure coverage on a broader attack surface.

