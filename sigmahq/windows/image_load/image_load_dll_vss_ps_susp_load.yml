  type: similar
status: test
description: |
  Detects the image load of vss_ps.dll by uncommon executables. This DLL is used by the Volume Shadow Copy Service (VSS) to manage shadow copies of files and volumes.
  It is often abused by attackers to delete or manipulate shadow copies, which can hinder forensic investigations and data recovery efforts.
  The fact that it is loaded by processes that are not typically associated with VSS operations can indicate suspicious activity.
references:
- https://www.virustotal.com/gui/file/ba88ca45589fae0139a40ca27738a8fc2dfbe1be5a64a9558f4e0f52b35c5add
- https://twitter.com/am0nsec/status/1412232114980982787
author: Markus Neis, @markus_neis
date: 2021-07-07
modified: 2025-07-11
tags:
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vss_ps.dll'
  filter_main_legit:
    Image|startswith: 'C:\Windows\'
    Image|endswith:
    - '\clussvc.exe'
    - '\dismhost.exe'
    - '\dllhost.exe'
    - '\inetsrv\appcmd.exe'
    - '\inetsrv\iissetup.exe'
    - '\msiexec.exe'
    - '\rundll32.exe'
    - '\searchindexer.exe'
    - '\srtasks.exe'
    - '\svchost.exe'
    - '\System32\SystemPropertiesAdvanced.exe'
    - '\taskhostw.exe'
    - '\thor.exe'
    - '\thor64.exe'
    - '\tiworker.exe'
    - '\vssvc.exe'
    - '\vssadmin.exe'
    - '\WmiPrvSE.exe'
    - '\wsmprovhost.exe'
  filter_main_update:
    CommandLine|startswith: 'C:\$WinREAgent\Scratch\'
    CommandLine|contains: '\dismhost.exe {'
  filter_main_image_null:
    Image:
  filter_optional_programfiles:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the loading of the `vss_ps.dll` by processes not typically associated with the Volume Shadow Copy Service (VSS). Attackers may use this technique to manipulate or delete shadow copies, hindering forensic efforts and data recovery. This behavior aligns with the MITRE ATT&CK technique T1490 - "Inhibit System Recovery."

  The primary telemetry sources are Windows image load events, specifically identifying instances where `vss_ps.dll` is loaded by uncommon executables. If this activity is malicious, it could signify potential data exfiltration or destruction. Importantly, this detection does NOT confirm malicious intent or behavior without additional context or correlation with other alerts.

  ### Investigation Steps

  - **Identify the loading process:** Check for events with `ImageLoaded` indicating `vss_ps.dll`. Focus on Event ID 4688 (Process Creation) and Sysmon Event ID 7 (Image Load) to find unusual loading processes.

  - **Examine command lines:** Review CommandLine fields in conjunction with the image load for suspicious execution context. Look for evidence of non-standard command lines associated with `dismhost.exe` or other legitimate processes.

  - **Correlate with known benign processes:** Cross-reference identified processes against a list of legitimate processes that typically use `vss_ps.dll`, such as `vssvc.exe` or `svchost.exe`.

  - **Investigate system criticality:** Assess the affected host's role (e.g., server, endpoint) and its criticality to determine the potential impact of the malicious behavior.

  - **Monitor for high-confidence indicators:** Be alert for correlated events indicating malicious intent, such as subsequent attempts to delete shadow copies (using commands like `vssadmin delete shadows`) or excessive use of `vss_ps.dll`.

  - **Identify benign file creation:** Check for legitimate scheduled tasks or maintenance activities, like backups, which may normally invoke `vss_ps.dll`, to differentiate them from suspicious uses.

  ### Prioritization

  This alert warrants high priority due to the potential impact on data integrity and the likelihood of exploitation. The loading of `vss_ps.dll` by untrusted processes is a tactic commonly weaponized by attackers seeking to disrupt investigations or evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for legitimate processes that trigger the rule, or due to unmonitored endpoints that do not have security logging enabled (e.g., older systems). Processes that run legitimate backup tasks might unintentionally trigger alerts, such as `backup.exe` or other backup solutions using `vss_ps.dll`. A companion detection to reinforce coverage is monitoring for changes or deletions of shadow copies, correlating with this alert for context.

