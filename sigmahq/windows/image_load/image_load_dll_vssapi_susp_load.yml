logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the loading of the **VSS API DLL (vssapi.dll)** by processes not typically associated with legitimate use, indicating potential manipulation or deletion of volume shadow copies. This behavior may be leveraged by attackers to obscure their tracks or delete evidence of compromise, aligning with their objective of maintaining access or covering up previous activity.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1562)** and **Impact (T1490)**. Primary telemetry sources for this detection are Windows image load logs, specifically focusing on Event 36868 in the Windows Security Event Log. If this behavior is malicious, it can lead to data loss or the successful evasion of forensic investigations. However, this detection does NOT confirm that malicious activity is occurring—it merely indicates the presence of atypical behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review process origins**: Check the process path of the executable triggering the alert. Legitimate paths include known applications such as backup solutions from `C:\Program Files\`. Any processes spawning from less common directories may signal potential compromise.

  - **Examine parent-child relationships**: Investigate the parent process of the executable that loaded vssapi.dll. Use Process Explorer or Sysinternals tools to verify if the parent is a common application or an unusual one, indicating possible malicious activity.

  - **Analyze recent volume shadow copy manipulations**: Look for alterations or deletions of volume shadow copies using PowerShell commands like `Get-ShadowCopy` or `vssadmin list shadows`. A lack of legitimate shadow copy use prior to the alert could indicate suspicious activity.

  - **Check for related alerts**: Review logs for similar behavior involving related shadow copy manipulation libraries (`vss_ps.dll` or `vsstrace.dll`). Multiple alerts involving these could point to a coordinated attack attempt.

  - **Identify high-confidence malicious indicators**: Focus on processes loading vssapi.dll from unexpected locations (e.g., temp folders or user directories). If the process path is from `C:\Windows\Temp\`, this is highly suspicious, especially if unrecognized.

  - **Document and escalate unexpected findings**: If any malicious indicators appear (e.g., unexpected file paths or unauthorized execution attempts), escalate these findings to Tier 2 or 3 analysts for deeper investigation.

  ---

  ### Prioritization

  This alert holds a **high severity** rating in an enterprise context. The impact of compromising systems that utilize shadow copies can lead to significant data loss or functionality disruption. Given the likelihood of malicious abuse surrounding volume shadow copy manipulation and its common use in advanced persistent threats, it is crucial to address these alerts promptly.

  ---

  ### Blind Spots and Assumptions

  Detection is limited as an attacker may employ techniques to obfuscate or mimic legitimate use of VSS API functions, potentially bypassing this rule. Comprehensive logging configurations must be in place to capture all relevant image load activities. Additionally, legitimate activities such as automated backup processes or maintenance tasks may trigger this alert, necessitating careful analysis of context. For increased detection capability, consider implementing companion rules for monitoring `vss_ps.dll` and `vsstrace.dll`, as they provide further coverage on similar techniques used by adversaries.

