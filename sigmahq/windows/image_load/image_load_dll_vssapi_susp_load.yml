description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
modified: 2025-10-17
tags:
- attack.defense-evasion
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the Volume Shadow Copy Service (VSS) DLL, `vssapi.dll`, by unusual executables not typically associated with legitimate backup or volume management processes. The behavior suggests potential malicious intent, such as attempting to manipulate volume shadow copies, which could aid in data exfiltration or ransomware activities. This relates to the MITRE ATT&CK tactic of Defense Evasion (T1560) and Impact (T1490).

  Primary telemetry sources include Windows image load logs. The relevant log types are from the Windows Event Log and may include Event ID 4688 (Process Creation) for process creation and associated DLL loads. If this activity is malicious, it could indicate an attempt to create, delete, or manipulate shadow copies to hide evidence of compromises or prepare for data encryption. Importantly, this detection alone does not confirm malicious activity and should be corroborated with additional context from endpoint behaviors.

  ### Investigation Steps

  - **Check process and parent process ID:** Reference Event ID 4688 for the creation of processes associated with `vssapi.dll`. Identify the parent process and investigate its legitimacy. Ask if the parent process is a common or expected application (e.g., backup software) or suspicious.

  - **Analyze execution paths:** Validate the full path of the executable loading `vssapi.dll`. Use Windows Event ID 4688 records and filter for image paths that indicate the process is not a known background service or administrative task.

  - **Investigate affected machines:** Determine the role of the machine where the alert was generated. If it's a critical server (e.g., file server, database server), escalate appropriately due to potential impact.

  - **Review recent changes:** Cross-reference Windows Event Logs for any recent changes or activities that could explain why an uncommon executable is loading the VSS API. Look for high-severity log entries that indicate unusual activity around the same timeframe.

  - **Identify malicious indicators:** Look for processes using `vssapi.dll` that are not associated with known legitimate applications, focusing on newly introduced or rare executables in environments. Malicious indicators could include unexpected execution from `C:\Windows\Temp` or unexpected command-line arguments.

  - **Evaluate scheduled tasks:** Check for any suspicious or unauthorized scheduled tasks that may attempt to invoke the loading of `vssapi.dll`. Use Task Scheduler logs (Event ID 106) to identify tasks invoking backup scripts or commands.

  ### Prioritization

  This alert is high severity due to the potential implications for data integrity and security. The affected system's role, particularly if it handles sensitive data or is part of critical infrastructure, elevates the risk of malicious use. While the loading of `vssapi.dll` may be legitimate, its occurrence in uncommon contexts often indicates an attempt to misuse the Volume Shadow Copy functionality, frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logs from image loading are not properly configured or if legitimate software misuses the VSS API. Common evasion techniques include utilizing remote execution tools or processes mimicking legitimate applications. Legitimate activities that might trigger the alert include backup operations performed by allowed software or updates. A related detection, such as monitoring for unusual shadow copy command-line activities, can help strengthen coverage and correlate findings.

