title: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
related:
- id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70     # vss_ps.dll
  type: similar
- id: 48bfd177-7cf2-412b-ad77-baf923489e82     # vsstrace.dll
  type: similar
status: test
description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
modified: 2025-10-17
tags:
- attack.defense-evasion
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the loading of the Volume Shadow Copy Service (VSS) library (vssapi.dll) by processes that are not typical, such as executables outside of expected paths. Loading this library can be a tactic utilized by attackers to create shadow copies of a system's disk state, facilitating later access to files or potentially helping to cover their tracks by creating data remnants. Specifically, attackers might aim to manipulate backups or data snapshots for malicious purposes, which can further lead to data exfiltration or system compromise.

  Relevant MITRE ATT&CK techniques include:
  - **T1490**: Inhibited Recovery - This represents the attackers' ability to disrupt recovery mechanisms, including the manipulation of backup tools or shadow copies to erase detection traces or restore access after an attack.

  The primary data source for this rule is the image load events in Windows, which log when executables load dynamic link libraries (DLLs). Monitoring these events for unusual loading patterns can help highlight potentially malicious activity that leverages VSS functionalities.

  ### Investigation Steps
  - **Review Image Load Events**: Check for any instances of vssapi.dll being loaded by non-standard executables. Investigate the parent processes and their command-line arguments for any suspicious activity.
  - **Examine Execution Context**: Look for any recent changes in the environment that may correlate with the alert, such as new software installations or updates to existing applications that might misuse VSS.
  - **Analyze Active Sessions**: Investigate user sessions for any abnormal activity or access attempts linked to the time the alert was triggered. Identify if there were any privileged accounts active that may exploit VSS functions.
  - **Correlate with Other Logs**: Cross-reference the detection with other logs within the environment, such as EDR or SIEM alerts, for indicators of broader compromise or lateral movement that could connect back to the suspicious load of vssapi.dll.

  ### Prioritization
  The severity of this alert is considered high due to the potential for attackers to leverage VSS for malicious purposes, thereby compromising system integrity and potentially leading to data loss or unauthorized access.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential cases where attackers leverage VSS due to reliance on known executable paths and behaviors. There could be gaps in detection if legitimate administrative tools also make legitimate use of the VSS DLL. The effectiveness of this rule assumes that image load logs for Windows are enabled and properly configured in the security monitoring tools used, as well as that the monitoring of application paths is appropriately tailored to the organization's environment.

