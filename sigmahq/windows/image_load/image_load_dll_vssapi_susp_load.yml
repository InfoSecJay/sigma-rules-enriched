title: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
related:
- id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70     # vss_ps.dll
  type: similar
- id: 48bfd177-7cf2-412b-ad77-baf923489e82     # vsstrace.dll
  type: similar
status: test
description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
modified: 2026-05-18
tags:
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\$WinREAgent\Scratch\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the loading of the `vssapi.dll` library by uncommon executables, which may indicate an attempted malicious action against the volume shadow copy service. Attackers may leverage this behavior to manipulate or delete shadow copies, potentially to hinder forensic investigation after executing malware or to recover deleted files. The relevant MITRE ATT&CK tactic is Impact, specifically technique T1490: Inhibit System Recovery. The primary telemetry source is Windows image load events, specifically capturing operations where certain executables invoke the `vssapi.dll`. If successfully executed by malicious actors, this behavior could allow them to erase traces of their activities. This alert does not confirm that malicious activity has occurred, as benign applications could also load this DLL under certain circumstances.

  ### Investigation Steps

  - **Check Event Log for Image Load Events**: Review Windows Security Event ID 4688 for process creation events that include vssapi.dll being loaded, particularly from uncommon executables not typically associated with legitimate administrative tools.

  - **Identify the Executable Path**: Focus on the executable paths related to the alert. If the image loading `vssapi.dll` originates from `C:\Program Files`, consider it benign if related to recognized backup or system tools. Conversely, execution from temporary or system directories could indicate malicious use.

  - **Examine Parent Processes**: Investigate the parent process of the exe loading vssapi.dll through Sysmon Event ID 1 to determine the context. Legitimate processes, such as backup tools (e.g., `C:\Program Files\YourBackupSolution\YourBackup.exe`), may often interact with this DLL.

  - **Analyze File Modification Events**: Look for file modification events (Windows Event ID 4663) related to shadow copy storage locations, specifically for unusual deletion or modification actions shortly after the alert. Evidence of deletion of `.vss` files may be indicative of an attack.

  - **Cross-Reference with Existing Shadow Copies**: Use PowerShell commands to list existing shadow copies (`Get-WmiObject -Class Win32_ShadowCopy`) shortly after the triggering event to check for the presence or absence of shadow copies, as an attack may attempt to remove them.

  ### Prioritization

  This alert is classified as high severity as it involves potential systemic impacts on endpoint recovery capabilities. Given the critical role of shadow copies in restoring compromised systems, the likelihood of this behavior being weaponized in attacks is high, warranting immediate analyst attention.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as OS-level anomalies that can suppress legitimate image load logging. The successful identification of vssapi.dll loading relies on comprehensive event logging configurations being maintained across all endpoints. Legitimate activities, such as administrative updates or well-known backup software operations, might inadvertently trigger this alert. A companion detection to consider is the monitoring of shadow copy creation events (Windows Event ID 5120) to provide context to any modifications detected through this rule.

