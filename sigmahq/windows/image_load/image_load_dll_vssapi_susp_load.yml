title: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
related:
- id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70     # vss_ps.dll
  type: similar
- id: 48bfd177-7cf2-412b-ad77-baf923489e82     # vsstrace.dll
  type: similar
status: test
description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
modified: 2026-08-27
tags:
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\servicing\TrustedInstaller.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
    - 'C:\$WinREAgent\Scratch\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `vssapi.dll` library by processes that are not typical for its usage, which may indicate potential malicious activity. Attackers often utilize Volume Shadow Copy Service (VSS) functionality to manipulate or delete shadow copies on a system to hide malicious activity, like restoring an environment after deploying ransomware or covering tracks post-exploitation. This behavior falls under the MITRE ATT&CK tactic "Impact" (TA0040) and the technique "Indicator Removal on Host" (T1490).

  The primary telemetry source for this detection is Windows image loading events, specifically related to process execution patterns where `vssapi.dll` is unexpectedly called by non-standard executables. If exploited, this could allow an adversary to erase forensic evidence or restore systems under their control. However, it is essential to note that this detection alone does not confirm malicious intent or actions without further context or corroborative evidence.

  ### Investigation Steps

  - **Review loaded DLLs for context**: Use Sysinternals Process Explorer to identify which executable is loading `vssapi.dll` and examine its full command line (e.g., Process ID, parent process). This can shed light on the legitimacy of the action.

  - **Identify the loading process**: Check Windows Event ID 4688 (Process Creation) to see if the process that loaded `vssapi.dll` corresponds to known, legitimate software, or if it is an unusual or uncommon binary.

  - **Examine recent backup operations**: Look at the Windows Event Log for Backup API events (Event IDs related to VSS operations) around the same timeframe to verify if legitimate backup or restore actions had occurred, which may justify the loading of `vssapi.dll`.

  - **Corroborate against configuration changes**: Investigate whether there were any recent changes in persistence or configurations on the host by examining Windows Event ID 4732 (Group Membership) and any modifications to scheduled tasks (Event ID 4698) that could indicate anomalous behavior related to backups or restores.

  - **Confirm file creation/deletion activity**: Investigate file system activity with Sysmon logs (Event ID 11) for any unusual creation or deletion operations associated with shadow copies or the relevant directories (`C:\System Volume Information\`), as these can further indicate the nature of the actions taken.

  - **Establish a behavioral baseline**: Understand what legitimate applications (like backup software) typically utilize `vssapi.dll` by reviewing internal infrastructure documentation or querying known systems, allowing for differentiating benign usage patterns from potential abuse.

  ### Prioritization

  The alert is classified with high severity due to the potential impact on critical systems, as misuse of VSS can lead to data loss or evasion of detection mechanisms. The likelihood of malicious exploitation is heightened given that attackers commonly employ these techniques during post-exploitation phases. This behavior has been weaponized in various ransomware campaigns and data tampering incidents.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate applications and system maintenance tasks may also trigger the alert when using `vssapi.dll`. Ensuring comprehensive logging configurations such as Sysmon deployments and Windows Event Logging is crucial to maintain detection reliability. Activities such as legitimate system updates or backups could incorrectly generate alerts. A related detection to bolster coverage could include monitoring for unexpected file deletions via Sysmon Event ID 23, which can capture anomalous file operations that align with malicious behavior surrounding VSS usage.

