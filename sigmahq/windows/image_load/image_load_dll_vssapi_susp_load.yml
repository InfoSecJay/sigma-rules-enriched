title: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
related:
- id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70     # vss_ps.dll
  type: similar
- id: 48bfd177-7cf2-412b-ad77-baf923489e82     # vsstrace.dll
  type: similar
status: test
description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
modified: 2025-10-17
tags:
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\vssapi.dll'
  filter_main_windows:
  - Image:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\Temp\{'           # Installers
    - 'C:\Windows\WinSxS\'
  filter_main_program_files:
        # When using this rule in your environment replace the "Program Files" folder by the exact applications you know use this. Examples would be software such as backup solutions
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_null_image:
    Image:
  filter_optional_programdata_packagecache:
        # The following filter is required because of many FPs cause by:
        #   C:\ProgramData\Package Cache\{10c6cfdc-27af-43fe-bbd3-bd20aae88451}\dotnet-sdk-3.1.425-win-x64.exe
        #   C:\ProgramData\Package Cache\{b9cfa33e-ace4-49f4-8bb4-82ded940990a}\windowsdesktop-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{50264ff2-ad47-4569-abc4-1c350f285fb9}\aspnetcore-runtime-6.0.11-win-x86.exe
        #   C:\ProgramData\Package Cache\{2dcef8c3-1563-4149-a6ec-5b6c98500d7d}\dotnet-sdk-6.0.306-win-x64.exe
        #   etc.
    Image|startswith: 'C:\ProgramData\Package Cache\'
  filter_optional_avira:
    Image|contains|all:
    - '\temp\is-'
    - '\avira_system_speedup.tmp'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `vssapi.dll` by executables that are not common for this activity. This behavior may indicate an attempt to manipulate Volume Shadow Copies for malicious purposes, such as data exfiltration or destruction. The likely attacker objective is to access or delete backups, which can hinder recovery efforts after a ransomware attack or similar incident.

  This detection aligns with MITRE ATT&CK technique T1490: Inhibit System Recovery. The primary telemetry source is Windows Image Load activity, specifically monitoring for the load events of `vssapi.dll` that originate from unusual or unexpected executables. If malicious, the security impact could be severe, potentially involving data loss or operational downtime. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also invoke `vssapi.dll` under certain scenarios.

  ### Investigation Steps

  - **Check the process loading `vssapi.dll`:** Review the process details in Windows Security Event ID 4688 logs for the instance where `vssapi.dll` was loaded. Look for incongruous parent-child process relationships, especially if the parent is a system service or script runner.

  - **Confirm user context of the action:** Validate the user executing the process loading `vssapi.dll` using Event ID 4624 logs. Legitimate users, like system administrators, should have appropriate context for such activity, while a service account might indicate automation tools or scripts could be used for malicious purposes.

  - **Correlate with Volume Shadow Copy usage:** Query for recent Volume Shadow Copy events using `wmic shadowcopy` or operational logs (Event ID 8193). Legitimate activities will typically have their creation, deletion, or utilization documented in regular system maintenance logs.

  - **Investigate related processes:** Analyze Sysmon Event ID 10 logs to determine if the suspicious process is interacting with the shadow copies. Presence of additional malware-related behaviors (such as file modification or unauthorized network access) will strengthen the case for malicious intent.

  - **Check for common evasion patterns:** Review for legitimate applications that commonly use `vssapi.dll`, such as backup solutions running successfully in the environment. Unexpected loading from unusual paths (e.g., `C:\Users\Public\` or in temp directories) is an indicator of potential abuse.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on critical systems that leverage Volume Shadow Copies for data recovery. The likelihood of malicious abuse is notable, particularly in environments targeted by ransomware, making this behavior a well-known attack vector.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate tools frequently utilize `vssapi.dll`, leading to potential false positives. Additionally, if the system does not have comprehensive log configurations in place, critical telemetry may be missing. Activities like administrative scripts or legitimate backup software execution may trigger the alert. A related detection monitoring unauthorized deletions of shadow copies could enhance coverage and confirm potential malicious actions.

