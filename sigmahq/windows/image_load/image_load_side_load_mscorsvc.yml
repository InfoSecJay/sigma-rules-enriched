title: Potential DLL Sideloading Of MsCorSvc.DLL
id: cdb15e19-c2d0-432a-928e-e49c8c60dcf2
status: test
description: Detects potential DLL sideloading of "mscorsvc.dll".
references:
- https://hijacklibs.net/entries/microsoft/built-in/mscorsvc.html
author: Wietze Beukema
date: 2024-07-11
modified: 2025-02-26
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\mscorsvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\Microsoft.NET\Framework\'
    - 'C:\Windows\Microsoft.NET\Framework64\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in 
  this rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the potential sideloading of the `mscorsvc.dll`, a .NET Framework service, which could indicate an unauthorized process loading the DLL from non-standard directories. Attackers may aim to exploit this behavior to gain elevated privileges or maintain persistence on the system. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1068), Persistence (T1547.001), and Defense Evasion (T1574.001). Primary telemetry sources include Windows Image Load event logs, specifically looking for paths that deviate from the expected locations of legitimate `mscorsvc.dll` files. If malicious, this behavior could lead to undetected execution of harmful payloads that compromise system integrity or data security. This detection does NOT confirm compromise by itself; further investigation is necessary to ascertain malicious intent.

  ### Investigation Steps

  - **Check event logs for DLL loading behavior:** Review Windows Security Event ID 4688 to identify processes loading DLLs. Focus on any events for `mscorsvc.dll` that originate from untrusted or unexpected parent processes.

  - **Verify DLL source paths:** Evaluate the `ImageLoaded` field in the image load logs (Event ID 13) to see if the `mscorsvc.dll` is loading from legitimate directories (`C:\Windows\Microsoft.NET\Framework\`, etc.) versus atypical or user-created directories.

  - **Look for recent process creation:** Inspect Security Event ID 4688 for processes that may have initiated the DLL load. Identify if any of these processes had unusual command-line arguments or originate from uncommon system directories.

  - **Identify benign software usage:** Cross-reference identified processes with an inventory of approved applications that might legitimately load `mscorsvc.dll`. This can help establish whether the behavior arises from standard software operations.

  - **Flag high-confidence malicious indicators:** Take note of any unusual parent/child process relationships that do not align with normal operational behavior; for example, if the DLL is loaded by a process typically not associated with .NET development.

  - **Monitor for persistent access attempts:** If `mscorsvc.dll` is loaded outside of its usual path, look for associated indicators of persistence, such as registry modifications (Event ID 4657) or scheduled tasks that might be created post-loading.

  ### Prioritization

  This alert has medium severity as it indicates a potential attempt at privilege escalation or persistence using a system DLL. The impact could be significant if successful, especially on critical servers. While DLL sideloading can often be exploited, it also occurs during legitimate application updates and maintenance, warranting careful evaluation.

  ### Blind Spots and Assumptions

  Evasion techniques could include modifying the DLL while maintaining its expected name, or malware may use legitimate system accounts to sideload the DLL. Reliable detection requires comprehensive logging of Windows Event ID 13 (Image Load) and Event ID 4688 (Process Creation). Legitimate development processes or software auto-updates may unintentionally trigger this alert, so understanding organizational context is vital. Companion detections for unusual parent-child process associations (e.g., through other unusual metrics in Event ID 4688) could strengthen detection coverage.

