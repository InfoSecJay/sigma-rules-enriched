logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\mscorsvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\Microsoft.NET\Framework\'
    - 'C:\Windows\Microsoft.NET\Framework64\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in this
  rule.
level: medium
note: |
  ### Technical Context
  This rule detects potential DLL sideloading of "mscorsvc.dll," a legitimate Microsoft .NET framework service that can be misused by attackers to execute malicious code. DLL sideloading involves placing a malicious DLL in a location where a legitimate application is likely to load it, misleading the system into executing the attacker's code instead of the genuine library. The attacker's objective could be to gain persistence on a system, escalate privileges, or evade detection mechanisms by utilizing the trusted name of a system file.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)**, where the attacker attempts to gain elevated permissions, and **Defense Evasion (TA0005)**, which involves techniques used to circumvent security measures. Specific techniques referenced are **T1574.001: DLL Sideloading**, highlighting that attackers often exploit the loading of DLLs to run malicious code undetected. Primary data sources for this detection rule will be **Windows image load event logs**, which provide insights into the libraries loaded by various processes.

  ### Investigation Steps
  - **Review Image Load Events:** Analyze logs for occurrences of `mscorsvc.dll` being loaded, noting the process and user context in which the loading occurs. Look for anomalies in process execution patterns.

  - **Correlate with Process Creation Logs:** Cross-reference with process creation logs to identify the parent processes responsible for loading the DLL. Verify if these processes have legitimate use cases or are exhibiting unusual behavior.

  - **Inspect File Location and Attributes:** Check the file path of `mscorsvc.dll` to ensure it originates from trusted directories. Pay special attention to any DLL versions located in non-standard paths which could indicate an attempted sideloading.

  - **Monitor Network Activity:** Review network activity associated with the processes that loaded `mscorsvc.dll` to detect any suspicious outbound connections that could signify command and control communication or data exfiltration.

  ### Prioritization
  The alert's medium severity reflects the potential impact of DLL sideloading, which can lead to significant security breaches, including unauthorized access and data loss. Given the common occurrence of legitimate applications loading this DLL, the likelihood of false positives must be considered but does not diminish the necessity for thorough investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover all methods of DLL sideloading; for example, if attackers use unrelated or non-standard DLL names, these would go undetected. Additionally, the detection logic assumes that loading of `mscorsvc.dll` in non-standard paths is always malicious, which may not be the case for some legitimate software setups. For effective alerting, logs from Windows image loading events must be reliably captured and analyzed, which requires proper logging configurations in place.

