logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\mscorsvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\Microsoft.NET\Framework\'
    - 'C:\Windows\Microsoft.NET\Framework64\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in 
  this rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of the `mscorsvc.dll`, indicating an attempt by an attacker to execute a malicious payload under the guise of a trusted Microsoft component. The likely objective is privilege escalation, maintaining persistence, or executing code while bypassing standard security mechanisms. The relevant MITRE ATT&CK tactics and techniques include Privilege Escalation (T1068) and the DLL Search Order Hijacking (T1574.001).

  The primary telemetry sources required for this detection include Windows Image Load events, specifically focusing on events related to DLL loading. If malicious, this behavior could allow an attacker to gain escalated privileges and execute arbitrary code. Importantly, this detection does NOT confirm malicious activity on its own; it requires further validation to ascertain whether the DLL in question is indeed being exploited.

  ### Investigation Steps

  - **Review Event Logs for DLL Load:** Examine Windows Event ID 4104 and Sysmon Event ID 7 logs for entries that include `mscorsvc.dll`. Determine if the loading occurs from non-standard directories or user profiles, which could indicate malicious intent.

  - **Check Origin of the DLL:** Validate the file path and hash of `mscorsvc.dll`. Legitimate loads typically originate from `C:\Windows\Microsoft.NET\Framework\` locations. Suspicious entries from user directories or temporary paths could indicate a potential attack.

  - **Analyze Parent Process:** Identify the parent process that loaded `mscorsvc.dll` by reviewing Sysmon Event ID 1 logs. A legitimate application or service should be evident; abnormal parent processes could suggest malicious activity.

  - **Investigate Process Anomalies:** Use Task Manager or PowerShell to list all processes with `mscorsvc.dll` loaded, looking for unusual CPU or memory usage that may indicate exploitation. Focus on unusual process names or unexpected executions.

  - **Evaluate File System Changes:** Check for recent changes to system files or the presence of additional suspicious files in the .NET framework directory. Use Windows File Audit logs to identify any changes around the time of the detected event.

  ### Prioritization

  This alert is of medium severity as it targets a critical system component potentially abused for privilege escalation. Given that sideloading techniques are common in advanced attacks, a thorough investigation is warranted to rule out malicious intent, especially on systems running sensitive operations.

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers employing legitimate applications that might load modified versions of `mscorsvc.dll` without triggering the alert. Reliable detection requires detailed logging of image loading events, which may not be enabled by default. Legitimate software updates or installations may also trigger this alert, and companion detection rules that monitor changes to Windows directory integrity can provide additional context for investigations.

