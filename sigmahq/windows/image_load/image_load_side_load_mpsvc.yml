title: Potential DLL Sideloading Of MpSvc.DLL
id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
status: test
description: Detects potential DLL sideloading of "MpSvc.dll".
references:
- https://hijacklibs.net/entries/microsoft/built-in/mpsvc.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\MpSvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\Windows Defender\'
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in this
  rule.
level: medium
note: |
  ### Technical Context
  This rule detects potential DLL sideloading of the `MpSvc.dll`, which is associated with the Microsoft Defender Antivirus service. DLL sideloading is a technique used by attackers to execute malicious code by exploiting legitimate DLLs that an application may load. In this case, an attacker could attempt to place a malicious version of `MpSvc.dll` in a directory where a trusted application is likely to load it, potentially leading to privilege escalation or the persistence of malware on infected systems.

  The primary attacker objective may include gaining unauthorized access to sensitive systems while evading detection capabilities that rely on monitoring known good binaries. This behavior aligns with several MITRE ATT&CK techniques, particularly `T1574.001 - DLL Side-Loading`, which falls under the tactics of `Privilege Escalation`, `Persistence`, and `Defense Evasion`.

  Key data sources for effective detection include Windows Event logs that log image loads, specifically targeting the loading of binaries from unusual paths that typically would not contain legitimate versions of system DLLs.

  ### Investigation Steps
  - **Review Image Load Events**: Examine Windows Event logs filtered by the timeframe of the alert to identify if `MpSvc.dll` was loaded from atypical directories, which may indicate potential sideloading.

  - **Analyze File Paths**: Look into the full file paths of the loaded DLLs. Verify that the loading process respected the expected directory structure of legitimate Microsoft Defender components.

  - **Check for Unusual File Modifications**: Investigate recent file modifications or installations of software applications that could have altered the expected DLLs. Pay special attention to executables that may interact with `Microsoft Defender`.

  - **Correlate with Other Security Tools**: Cross-reference findings with any EDR alerts or logs that may indicate abnormal behavior, such as unexpected process creations or network connections that occur in conjunction with the suspicious DLL load.

  ### Prioritization
  This alert carries a medium severity level due to the potential of exposing sensitive systems to privilege escalation and unauthorized access. While not every instance of DLL sideloading is indicative of malicious intent, the implications of successful exploitation warrant urgent investigation.

  ### Blind Spots and Assumptions
  The detection rule assumes that `MpSvc.dll` will be loaded from locations other than its legitimate paths. Therefore, if an attacker effectively masquerades the DLL in an expected directory or if legitimate applications behave similarly, this may yield false negatives. Additionally, adequate logging of image loads from Windows Event logs is necessary for this alert to function reliably, and environments without these logs may miss detection opportunities. It's also possible that certain legitimate applications may load their own versions of the DLL, which could lead to false positives without appropriate contextual analysis.

