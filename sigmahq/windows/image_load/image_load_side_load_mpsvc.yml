title: Potential DLL Sideloading Of MpSvc.DLL
id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
status: test
description: Detects potential DLL sideloading of "MpSvc.dll".
references:
- https://hijacklibs.net/entries/microsoft/built-in/mpsvc.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\MpSvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\Windows Defender\'
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in 
  this rule.
level: medium
note: |
  ### Technical Context

  This rule detects the loading of the `MpSvc.dll` file from non-standard paths, which may indicate malicious DLL sideloading attempts. Attackers often sideload malicious DLLs to evade detection by leveraging legitimate processes. The objective is typically to execute arbitrary code with elevated privileges or maintain persistence. Relevant MITRE ATT&CK tactics include Privilege Escalation (TA0004) and Defense Evasion (TA0005), specifically under technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources include Windows image load events, specifically focusing on the loading of DLL files. Security Event ID 4688 and Sysmon Event ID 7 are crucial in this context. If the behavior is confirmed as malicious, it could lead to unauthorized access or persistence on a system. However, it is important to note that this detection alone does not confirm malicious activity without additional context, as legitimate applications may also load their own versions of `MpSvc.dll`.

  ### Investigation Steps

  - **Confirm loading source:**
    Review Event ID 4688 or Sysmon Event ID 7 to verify which process is loading `MpSvc.dll`. Check the `ImageLoaded` field for paths outside of typical directories (like 'C:\Program Files\Windows Defender\'), which may indicate potential sideloading.

  - **Analyze associated process behavior:**
    Inspect the parent process of the DLL loader. If the parent process is unrelated or flagged previously for suspicious activity, it raises the likelihood of a malicious action. Look for unusual parent-child relationships in the logs.

  - **Identify legitimate use cases:**
    Check for processes associated with Windows Defender that legitimately load `MpSvc.dll` from expected paths (`C:\Program Files\Windows Defender\`). Validate that they are up to date and not modified.

  - **Examine process execution attributes:**
    Review the command line arguments and account names from Event ID 4688. If the process running the DLL loading is executing with unusual parameters or under a suspicious user account, it warrants further investigation.

  - **Cross-reference threat intelligence sources:**
    Utilize threat intelligence feeds to determine if the specific DLL or the loading process has been previously reported or associated with known malware or threat actors. Affected assets should also be evaluated based on their criticality.

  - **Check for indicators of persistence:**
    Review registry entries and scheduled tasks for potential persistence mechanisms that may be tied to the detected DLL loading. Look for suspicious modifications that coincide with the `MpSvc.dll` load event.

  ### Prioritization

  The severity of this alert should be classified as medium. If this detection occurs on critical systems, the potential impact could be significant, allowing an attacker to gain unauthorized access. DLL sideloading techniques are frequently utilized in the wild, indicating a likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of obfuscation techniques or modifications to legitimate binaries that could bypass the rule. Reliable detection requires the proper configuration of Sysmon and Windows event logging. Legitimate applications, including cloud and IT management services, might trigger this alert if they load similar DLL files. Companion detections such as monitoring for abnormal process creation events or file integrity checks on the DLL paths can enhance coverage.

