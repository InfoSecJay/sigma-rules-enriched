title: Potential DLL Sideloading Of MpSvc.DLL
id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
status: test
description: Detects potential DLL sideloading of "MpSvc.dll".
references:
- https://hijacklibs.net/entries/microsoft/built-in/mpsvc.html
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: '\MpSvc.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\Windows Defender\'
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications loading their own versions of the DLL mentioned in 
  this rule.
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading of the "MpSvc.dll" library, indicating that an unauthorized or unexpected process is loading a potentially malicious version of this DLL. Attackers may use this technique to execute malicious code while masquerading as legitimate Windows Defender activity, thereby avoiding detection and gaining persistence within a system. The relevant MITRE ATT&CK tactics include Privilege Escalation (TA0004), Execution (TA0002), and the specific technique of DLL Search Order Hijacking (T1574.001).

  Primary telemetry sources include Windows Security Event ID 4688 for process creation and Sysmon Event ID 10 for image load events. If the rule triggers, it may signify active exploitation attempts or successful compromise with possible integration into the attacker's toolkit. This detection does not confirm successful execution or compromise on its own; further investigation is required.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 to identify which processes loaded "MpSvc.dll." Look for non-standard parent processes (e.g., custom applications) that aren't typically associated with Windows Defender.

  - **Review Sysmon image load logs:** Inspect Sysmon Event ID 10 logs for the loading of "MpSvc.dll." Pay particular attention to the "Image" and "FileVersion" fields to discern if it is the legitimate version or a potential imposter.

  - **Validate legitimate behavior:** Identify instances where processes should legitimately invoke "MpSvc.dll," such as from "C:\Program Files\Windows Defender\". Compare timestamps and parent-child relationships to ensure they are expected.

  - **Monitor for additional suspicious tools:** Cross-reference the loading event with Windows Event IDs that capture software installations (like Event ID 11724) or updates, to identify the deployment of potential malware.

  - **Identify high-confidence malicious indicators:** If "MpSvc.dll" is loaded from an atypical directory, such as user profiles or temporary folders, treat this as a strong indicator of malicious behavior; note the full path of the loading executable for follow-up.

  ### Prioritization

  The severity of this alert is medium due to the potential for attackers to leverage this tactic for privilege escalation and persistence, particularly on critical systems where Windows Defender operates. Different adversaries could exploit DLL sideloading as it’s a commonly weaponized method in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate applications also load custom DLLs, triggering false positives. Reliable detection requires proper logging configurations, particularly for Sysmon to capture image loads. Common benign activities could include legitimate software updates that alter the DLL. A related detection rule on the loading of other Windows DLLs from non-standard paths (e.g., suspicious PowerShell commands) could strengthen overall coverage against DLL-based attacks.

