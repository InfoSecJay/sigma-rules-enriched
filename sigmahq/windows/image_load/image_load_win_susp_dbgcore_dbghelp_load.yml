logsource:
  category: image_load
  product: windows
detection:
  selection_img:
    Image|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\Contacts\'
            # - '\Desktop\'
    - '\Documents\'
            # - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
            #  - '\AppData\Local\Temp\' some installers may load from here
  selection_dll:
    ImageLoaded|endswith:
    - '\dbgcore.dll'
    - '\dbghelp.dll'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context

  This rule detects the loading of `dbgcore.dll` or `dbghelp.dll` from atypical directories such as user folders or temporary locations. Attackers may leverage these DLLs to perform credential dumping or evade detection mechanisms by freezing processes. The relevant MITRE ATT&CK tactics are Credential Access (T1003) and Defense Evasion (T1685). Primary telemetry sources include Windows image load events, specifically the Event ID 4688 (process creation) and Sysmon Event ID 7 (image load). If successful, this behavior could lead to severe security implications, including unauthorized access to sensitive credentials. However, this detection alone does not confirm malicious intent, as legitimate processes may also use these DLLs from uncommon locations.

  ### Investigation Steps

  - **Identify Event Logs Involved:** Check for Sysmon Event ID 7 to confirm the loading of `dbgcore.dll` or `dbghelp.dll` and note the `ImageLoaded` field for the loaded DLL path.

  - **Verify Loading Locations:** Determine if the loaded DLLs came from uncommon paths like `C:\Users\Public\` or `C:\Temp\`. Legitimate activity typically involves DLLs being loaded from system directories like `C:\Windows\System32\`.

  - **Cross-reference Process Creation Events:** Look for accompanying Event ID 4688 process creation logs around the same timestamp. Identify related processes that initiated the loading based on the `New_Process_Name` field.

  - **Assess Process Owner and Permissions:** Check the process owner in the Event ID 4688 logs. If the DLL was loaded by a user account with administrative privileges that is not commonly associated with high-risk activities, escalate for review.

  - **Correlate with Other Security Tools:** If available, check for flags or alerts from EDR tools related to process freezing or abnormal behavior when interacting with `dbgcore.dll` or `dbghelp.dll`.

  - **Document Additional Context:** Record the system’s role and criticality. If this is a server or sensitive workstation, escalate immediately, as risk thresholds are heightened.

  ### Prioritization

  The severity of this alert is high due to the potential for credential theft and process evasion tactics. Given that these DLLs can be weaponized by adversaries, any unusual loading from atypical locations should receive immediate attention, especially on critical assets.

  ### Blind Spots and Assumptions

  Detection may be limited by a lack of comprehensive endpoint logging or configurations that do not track image loading uniformly across environments. Legitimate software installations or updates may also trigger this alert if they use these DLLs from uncommon locations. A companion detection to enhance coverage would include monitoring for unusual behaviors associated with other known credential dumping techniques, such as LSASS access attempts (T1003.001).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
