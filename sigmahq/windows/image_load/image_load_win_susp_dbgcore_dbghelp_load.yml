title: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
related:
- id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
  type: similar
status: experimental
description: |
  Detects loading of dbgcore.dll or dbghelp.dll from uncommon locations such as user directories.
  These DLLs contain the MiniDumpWriteDump function, which can be abused for credential dumping purposes or in some cases for evading EDR/AV detection by suspending processes.
references:
- https://blog.axelarator.net/hunting-for-edr-freeze/
- https://www.zerosalarium.com/2025/09/EDR-Freeze-Puts-EDRs-Antivirus-Into-Coma.html
- https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.credential-access
- attack.t1003
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: image_load
  product: windows
detection:
  selection_img:
    Image|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
            #  - '\AppData\Local\Temp\' some installers may load from here
  selection_dll:
    ImageLoaded|endswith:
    - '\dbgcore.dll'
    - '\dbghelp.dll'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context

  This rule detects the loading of `dbgcore.dll` or `dbghelp.dll` from uncommon locations, which may indicate malicious activity such as credential dumping or evasion of endpoint detection and response (EDR) systems. The likely attacker objective is to exploit the functionality of these libraries for covert credential harvesting or process manipulation. Relevant MITRE ATT&CK tactics include Credential Access (T1003) and Defense Evasion (T1562.001). Primary telemetry sources include Windows Image Load events, specifically focusing on the `Image` and `ImageLoaded` fields. If malicious, this behavior could lead to unauthorized access or data breaches. However, this detection does NOT confirm that credential dumping is occurring—it may also result from legitimate software installations or updates.

  ### Investigation Steps

  - **Review event source and type**: Check for Windows Image Load events related to DLL loading (Event IDs such as 10 for `dbghelp.dll` and `dbgcore.dll`). Focus on the `Image` and `ImageLoaded` fields to identify the locations from which these DLLs are loaded.

  - **Identify uncommon loading locations**: Look for instances where `dbgcore.dll` or `dbghelp.dll` are loaded from directories like `C:\Users\Public\`, `C:\Temp\`, or any user-specific directories (`Desktop`, `Documents`), which are atypical for these libraries.

  - **Assess for legitimate use cases**: Validate against known legitimate software installation behavior that may use these DLLs, e.g., during updates or installations of debugging tools or local applications.

  - **Check for significant indicators of compromise**: Investigate the process tree for any associated parent processes (using Sysmon Event ID 10) that could indicate if a known exploit tool is involved, particularly looking for tools related to credential dumping.

  - **Cross-verify with endpoint protection logs**: Look into any logs generated by EDR or antivirus tools around the time of the alert to assess for blocks or detections that may indicate compromised activity.

  - **Correlate with related alerts**: Search for companion detections that may have triggered simultaneously, which could include abnormal PowerShell scripts or process spawning events.

  ### Prioritization

  This alert has a high severity due to its association with potential credential theft and the ability to evade detection mechanisms. The systems where this alert is triggered, especially those handling sensitive information, are critical for enterprise security. The behavior is not commonly seen in benign operations, enhancing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software that frequently uses these DLLs during updates or installations, which could trigger false positives. Ensure that logging is properly configured to capture image load events effectively. Additionally, activities such as local testing and debugging could evoke these alerts. A related detection, such as monitoring for execution anomalies involving credential access tools, would provide complementary visibility into potential threats.

