logsource:
  category: image_load
  product: windows
detection:
  selection_img:
    Image|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
            #  - '\AppData\Local\Temp\' some installers may load from here
  selection_dll:
    ImageLoaded|endswith:
    - '\dbgcore.dll'
    - '\dbghelp.dll'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects the loading of `dbgcore.dll` or `dbghelp.dll` from unusual locations, which is often indicative of malicious activity. Attackers may target these libraries to utilize the `MiniDumpWriteDump` function for credential dumping or to evade endpoint detection and response (EDR) tools by freezing monitored processes. Relevant MITRE ATT&CK techniques include Credential Access (T1003) and Defense Evasion (T1562.001). Primary telemetry sources for this detection are image load telemetry from Windows, specifically focusing on process creation events that may contain DLL path information.

  If this behavior is confirmed as malicious, it poses a significant risk as it may lead to unauthorized access of sensitive information, facilitate lateral movement, or impede security defenses. It is crucial to note that this detection does not confirm that a dump is being successfully executed, nor does it inherently indicate that the system is compromised without additional corroborating evidence.

  ---

  ### Investigation Steps

  - **Check image load telemetry:** Review image load logs for Event ID 14 (Sysmon) and the corresponding DLL path fields to identify instances of `dbgcore.dll` or `dbghelp.dll` loaded from unusual directories such as `C:\Users\Public\` or `C:\Temp\`.

  - **Identify process creation history:** Investigate process creation events (Event ID 4688) that led to the loading of the suspicious DLLs. Note the parent process ID and verify the legitimacy of the parent application.

  - **Validate legitimate software installations:** Confirm whether any known applications or installers in your environment could necessitate loading these DLLs from uncommon locations, such as during software updates.

  - **Search for privilege escalation attempts:** Look for related signs of credential dumping by considering additional telemetry; for example, logs showing usage of `MiniDumpWriteDump` command-line arguments in conjunction with these DLLs.

  - **Correlate with user behavior:** Analyze user activity logs, specifically looking for unusual account behavior that corresponds with the DLL usage timeframe—unrecognized account access or failed login attempts may indicate malicious intents.

  - **Investigate high-confidence indicators:** Focus specifically on any instances where `dbgcore.dll` or `dbghelp.dll` are loaded from `C:\Users\[username]\AppData\Local\Temp\`, as this is atypical and can indicate exploitation attempts.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on credential security and the likelihood that attackers may exploit this behavior as a part of their operational toolkit. Compromised systems' integrity and information confidentiality may be significantly threatened if this activity is confirmed as malicious.

  ---

  ### Blind Spots and Assumptions

  Detection of abnormal DLL loading can be evaded if attackers use legitimate system processes or well-known applications to load these DLLs, potentially obscuring malicious intents. Effective logging of DLL loads along with process creation must be configured properly for accurate monitoring. Additionally, legitimate activities such as software updates may trigger this alert. A related detection that enhances coverage could include monitoring for the use of `MiniDumpWriteDump` in conjunction with process injection activities.

