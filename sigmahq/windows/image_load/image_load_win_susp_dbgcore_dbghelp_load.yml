title: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
related:
- id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
  type: similar
status: experimental
description: |
  Detects loading of dbgcore.dll or dbghelp.dll from uncommon locations such as user directories.
  These DLLs contain the MiniDumpWriteDump function, which can be abused for credential dumping purposes or in some cases for evading EDR/AV detection by suspending processes.
references:
- https://blog.axelarator.net/hunting-for-edr-freeze/
- https://www.zerosalarium.com/2025/09/EDR-Freeze-Puts-EDRs-Antivirus-Into-Coma.html
- https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.credential-access
- attack.t1003
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: image_load
  product: windows
detection:
  selection_img:
    Image|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
            #  - '\AppData\Local\Temp\' some installers may load from here
  selection_dll:
    ImageLoaded|endswith:
    - '\dbgcore.dll'
    - '\dbghelp.dll'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context
  This rule detects the suspicious loading of `dbgcore.dll` or `dbghelp.dll` from uncommon file locations, such as user directories. These DLLs provide functionality for creating memory dumps, which can be exploited by attackers to acquire sensitive information such as credentials from in-memory processes. The common objective of using these DLLs in unusual locations is to execute actions under the radar, either for credential dumping or for process manipulation evasion tactics, effectively bypassing endpoint detection and response (EDR) or antivirus (AV) solutions.

  Attackers targeting enterprise environments may leverage these DLLs as part of a larger credential access operation, specifically under the technique known as "Credential Dumping" (T1003). Additionally, they might attempt to evade detection mechanisms, utilizing techniques such as "Process Injection" (T1562.001) to freeze or manipulate processes silently. The primary data sources for this detection are image load logs from Windows systems that can reveal attempts to load these DLLs from non-standard paths.

  ### Investigation Steps
  - **Review Image Load Logs**: Examine image load logs for instances of `dbgcore.dll` or `dbghelp.dll` to identify irregular loading locations, specifically focusing on user directories and unconventional paths.
  - **Analyze Process Creation Events**: Investigate process creation logs around the timestamp of DLL loading to correlate any suspicious parent processes that may indicate malicious intent or behavior.
  - **Check for Suspicious Parent Processes**: Look for processes that typically do not interact with these DLLs, particularly in the context of systems and applications that should not need to load debugging components.
  - **Cross-reference with EDR Alerts**: Assess any related EDR alerts around the same time frame to identify potential patterns or commonalities in malicious activities, such as attempts at credential dumping or other forms of attack.

  ### Prioritization
  Given the high potential for credential access through the exploitation of legitimate system DLLs, this alert should be treated with high priority in an enterprise environment. Actions taken with these DLLs can lead to serious security breaches if not investigated promptly.

  ### Blind Spots and Assumptions
  One of the gaps in detection coverage includes the possibility of benign software operations that might also load these DLLs, such as during legitimate application installations or updates. The detection logic assumes that any loading from uncommon paths is suspicious; however, this may overlook legitimate activities. For the alert to function correctly, comprehensive logging of image loads must be enabled on Windows systems, and any configurations that prevent capturing such events could lead to undetected malicious actions.

