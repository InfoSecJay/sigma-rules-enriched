logsource:
  category: image_load
  product: windows
detection:
  selection_img:
    Image|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\Contacts\'
            # - '\Desktop\'
    - '\Documents\'
            # - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
            #  - '\AppData\Local\Temp\' some installers may load from here
  selection_dll:
    ImageLoaded|endswith:
    - '\dbgcore.dll'
    - '\dbghelp.dll'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/image_load/image_load_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the loading of `dbgcore.dll` or `dbghelp.dll` from uncommon user directories. These DLLs can be exploited to perform credential dumping through the `MiniDumpWriteDump` function or to evade detection mechanisms by suspending processes. The likely adversary objective is to extract sensitive credentials or to manipulate detection tools, limiting their effectiveness. This behavior aligns with the MITRE ATT&CK technique for Credential Access (T1003) and Defense Evasion (T1562.001).

  The primary telemetry of interest includes image load events from Windows systems, specifically the locations from which these DLLs are loaded. If the alert corresponds to malicious activity, the impact could be severe, resulting in compromised user credentials and elevated access. Importantly, this detection does NOT confirm that credential dumping has occurred; it only indicates that the loading of these DLLs has taken place from suspicious locations.

  ### Investigation Steps

  - **Identify suspect DLL loading location:** Review Windows Event ID 4104 logs for the `Dbgcore.dll` or `Dbghelp.dll` loading activities. Check the file paths for atypical origins, prioritizing paths such as `C:\Users\Public\`, `C:\Temp\`, or `C:\$Recycle.Bin\`.

  - **Determine the process responsible for DLL loading:** Use the Sysmon logs (Event ID 7) to trace the process that loaded these DLLs. Look for suspicious parent processes or unexpected command-line parameters that could indicate malicious behavior.

  - **Investigate process behavior:** Analyze the process listed in Event ID 4104 to see if any credentials are being accessed or dumped. Pay close attention to processes like `lsass.exe` or any other processes known for handling sensitive data.

  - **Look for legitimate usage patterns:** Review previous instances of `dbgcore.dll` and `dbghelp.dll` loading to establish a baseline of legitimate behavior. Identify if there is an expected use case, such as development activities or legitimate debugging processes by trusted users.

  - **Verify known malicious indicators:** Check for any known malicious hashes associated with `dbgcore.dll` or `dbghelp.dll`. Employ threat intelligence sources for indicators associated with credential dumping or EDR evasion techniques to validate against the observed activity.

  - **Examine system logs for anomalies:** Investigate Windows logs (Event IDs 4624 and 4625) for any unusual authentication attempts or changes to the environment that could correlate with the detected DLL loading activity.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive data if credential dumping is taking place. There is a significant risk of malicious abuse, as these DLLs are commonly weaponized by adversaries for illicit purposes. The unusual loading of these system DLLs raises immediate concerns for possible exploitation attempts.

  ### Blind Spots and Assumptions

  The detection may not capture all instances of DLL loading, as legitimate applications may occasionally use these files from atypical locations for debugging purposes. It relies on comprehensive logging configurations to catch all relevant events; missing telemetry may hinder precise detection. Additionally, standard software updates or legitimate development activity may cause these alerts to trigger, hence requiring contextual evaluation. Complementing this detection with related rules regarding process injection or suspicious process chains could enhance overall visibility and coverage against such threats.

