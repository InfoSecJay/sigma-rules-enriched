title: Unsigned .node File Loaded
id: e5f5c693-52d7-4de5-88ae-afbfbce85595
status: experimental
description: |
  Detects the loading of unsigned .node files.
  Adversaries may abuse a lack of .node integrity checking to execute arbitrary code inside of trusted applications such as Slack.
  .node files are native add-ons for Electron-based applications, which are commonly used for desktop applications like Slack, Discord, and Visual Studio Code.
  This technique has been observed in the DripLoader malware, which uses unsigned .node files to load malicious native code into Electron applications.
references:
- https://www.coreycburton.com/blog/driploader-case-study
- https://github.com/CoreyCBurton/DripLoaderNG
- https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
author: Jonathan Beierle (@hullabrian)
date: 2025-11-22
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.stealth
- attack.t1129
- attack.t1574.001
- attack.t1036.005
logsource:
  category: image_load
  product: windows
detection:
  selection_node_extension:
    ImageLoaded|endswith: '.node'
  selection_status:
  - Signed: 'false'
  - SignatureStatus: 'Unavailable'
  filter_optional_vscode_jupyter:
    Image|endswith: '\Code.exe'
    ImageLoaded|contains: '.vscode\extensions\ms-toolsai.jupyter-'
    ImageLoaded|endswith:
    - '\electron.napi.node'
    - '\node.napi.glibc.node'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- VsCode extensions or similar legitimate tools might use unsigned .node files. 
  These should be investigated on a case-by-case basis, and whitelisted if 
  determined to be benign.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of unsigned .node files, which are native add-ons used by Electron-based applications such as Slack and Visual Studio Code. By leveraging these unsigned files, adversaries can inject arbitrary code into trusted applications for various objectives, including persistence, privilege escalation, and execution of malicious payloads. This behavior is associated with the MITRE ATT&CK technique T1129: "Shared Modules" and T1574.001: "DLL Side-Loading."

  The primary telemetry source is Windows image load logs, specifically tracking unsigned .node files that are being loaded by relevant applications. If these files are malicious, they could facilitate additional compromise, data exfiltration, or lateral movement within the enterprise network. Importantly, this detection does NOT confirm that the behavior is always malicious; further investigation is necessary to determine the context of the activity.

  ### Investigation Steps

  - **Examine the image load artifacts**: Review Windows event logs for Event ID 4104 or Sysmon Event ID 7 to check for .node files loaded by the application. Look for the "Image" field containing paths ending with ".node".

  - **Cross-reference application legitimacy**: Identify if the loading application is a trusted process (e.g., Slack, Visual Studio Code). Assess the source of these applications to rule out unauthorized installations or versions.

  - **Identify high-confidence malicious indicators**: Search for known malicious file signatures in the loaded .node files. Check for associations with DripLoader and other known malware using threat intelligence feeds.

  - **Validate expected behavior**: Determine if similar unsigned .node files are regularly used by installed Electron applications. For instance, .node files loading from paths associated with legitimate VSCode extensions should be documented and whitelisted if confirmed to be benign.

  - **Check for persistence mechanisms**: Investigate the presence of scheduled tasks or Registry keys that might signal an attempt to maintain malicious activity across reboots, particularly if unsigned .node files are found.

  - **Document and escalate findings**: If any indicators raise suspicion, report and escalate the alert through your SOC's incident response protocols for further forensic analysis and remediation.

  ### Prioritization

  This alert is of medium severity as it involves potential abuse of trusted applications, which could significantly impact system integrity and security. Given the nature of unsigned files and their common usage in various applications, the likelihood of malicious abuse is moderate, particularly in environments where such applications are prevalent.

  ### Blind Spots and Assumptions

  Evasion techniques may include malicious actors employing signed .node files or using known and trusted applications to cover their tracks. Reliable detection requires proper logging of image load events, which may not be enabled by default. Legitimate extensions for tools like VSCode may also trigger this alert, necessitating thorough case-by-case evaluations. Related detections, such as monitoring for unusual API calls (Sysmon Event ID 10) or other executions of native code, can help provide additional context and assurance in identifying true threats.

