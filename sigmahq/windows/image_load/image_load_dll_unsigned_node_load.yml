title: Unsigned .node File Loaded
id: e5f5c693-52d7-4de5-88ae-afbfbce85595
status: experimental
description: |
  Detects the loading of unsigned .node files.
  Adversaries may abuse a lack of .node integrity checking to execute arbitrary code inside of trusted applications such as Slack.
  .node files are native add-ons for Electron-based applications, which are commonly used for desktop applications like Slack, Discord, and Visual Studio Code.
  This technique has been observed in the DripLoader malware, which uses unsigned .node files to load malicious native code into Electron applications.
references:
- https://www.coreycburton.com/blog/driploader-case-study
- https://github.com/CoreyCBurton/DripLoaderNG
- https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
author: Jonathan Beierle (@hullabrian)
date: 2025-11-22
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1129
- attack.t1574.001
- attack.t1036.005
logsource:
  category: image_load
  product: windows
detection:
  selection_node_extension:
    ImageLoaded|endswith: '.node'
  selection_status:
  - Signed: 'false'
  - SignatureStatus: 'Unavailable'
  filter_optional_vscode_jupyter:
    Image|endswith: '\Code.exe'
    ImageLoaded|contains: '.vscode\extensions\ms-toolsai.jupyter-'
    ImageLoaded|endswith:
    - '\electron.napi.node'
    - '\node.napi.glibc.node'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- VsCode extensions or similar legitimate tools might use unsigned .node files. These
  should be investigated on a case-by-case basis, and whitelisted if determined to
  be benign.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the loading of unsigned `.node` files within Electron-based applications like Slack or Discord. Attackers may exploit the lack of integrity checks for these files to inject and execute arbitrary code in trusted environments, leveraging popular applications as potential backdoors for malware such as DripLoader.

  The primary objective of such attacks is to gain unauthorized access to sensitive data or remote control over compromised systems, often bypassing traditional security mechanisms. The relevant MITRE ATT&CK techniques involved include **T1129 - Execution through API,** where adversaries utilize the application programming interfaces of legitimate software to execute malicious code, and **T1574.001 - Compromise Software Dependencies and Development Tools**, which involves manipulating native modules to maintain persistence and evade detection.

  The most pertinent data sources for this detection include image load logs specific to Windows systems, which track the execution of application binaries and their associated modules.

  ### Investigation Steps
  - **Review Event Logs:** Examine image load logs to identify instances of `.node` files being loaded within applications like Slack or Visual Studio Code, paying attention to their signed status.
  - **Correlate with Application Activity:** Cross-reference the detected `.node` file loads with user activity logs or session data to understand the context in which these files were executed. Look for unusual user behavior or application usage patterns.
  - **Analyze Installed Extensions:** Investigate any extensions installed within Electron-based applications that may utilize `.node` files, assessing whether they are legitimate or potentially malicious. Focus on extensions tied to recent events of concern or that are not well-known.
  - **Conduct Endpoint Investigation:** Utilize EDR tools to assess the impacted host for other indicators of compromise, such as unusual network traffic, recent file changes, or suspicious process hierarchies involving the affected applications.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant impact if malicious code is executed within trusted applications, which could lead to data exfiltration or lateral movement within the network. The likelihood of such exploitation varies based on the presence of vulnerable or improperly configured applications.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where applications rely heavily on legitimate unsigned `.node` files, such as certain third-party extensions in Visual Studio Code or similar tools. This logic assumes that unsigned files are usually indicative of malicious activity, which may not hold true for all organizations. Proper logging configuration and monitoring of image loads are essential for the effectiveness of this alert, necessitating that appropriate logs are enabled and retained within the environment.

