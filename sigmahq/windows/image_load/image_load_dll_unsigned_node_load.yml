title: Unsigned .node File Loaded
id: e5f5c693-52d7-4de5-88ae-afbfbce85595
status: experimental
description: |
  Detects the loading of unsigned .node files.
  Adversaries may abuse a lack of .node integrity checking to execute arbitrary code inside of trusted applications such as Slack.
  .node files are native add-ons for Electron-based applications, which are commonly used for desktop applications like Slack, Discord, and Visual Studio Code.
  This technique has been observed in the DripLoader malware, which uses unsigned .node files to load malicious native code into Electron applications.
references:
- https://www.coreycburton.com/blog/driploader-case-study
- https://github.com/CoreyCBurton/DripLoaderNG
- https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
author: Jonathan Beierle (@hullabrian)
date: 2025-11-22
modified: 2026-08-27
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.stealth
- attack.t1129
- attack.t1574.001
- attack.t1036.005
logsource:
  category: image_load
  product: windows
detection:
  selection_node_extension:
    ImageLoaded|endswith: '.node'
  selection_status:
  - Signed: 'false'
  - SignatureStatus: 'Unavailable'
  filter_optional_vscode_jupyter:
    Image|endswith: '\Code.exe'
    ImageLoaded|contains: '.vscode\extensions\ms-toolsai.jupyter-'
    ImageLoaded|endswith:
    - '\electron.napi.node'
    - '\node.napi.glibc.node'
  filter_optional_vscode_core:
    Image|contains: '\Microsoft VS Code\Code.exe'
    ImageLoaded|contains: '\Microsoft VS Code\resources\app\node_modules'
  filter_optional_evernote:
    Image|contains:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - '\AppData\Local\Programs\'
    Image|endswith: '\Evernote\Evernote.exe'
    ImageLoaded|contains: '\Evernote\resources\app'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- VsCode extensions or similar legitimate tools might use unsigned .node files. 
  These should be investigated on a case-by-case basis, and whitelisted if 
  determined to be benign.
level: medium
note: |
  ### Technical Context

  This rule detects the loading of unsigned `.node` files by applications, specifically targeting Electron-based desktop applications like Slack and Visual Studio Code. Unsigned `.node` files can allow adversaries to execute arbitrary code within trusted processes, potentially indicating malicious activity. This behavior fits within the MITRE ATT&CK framework under the Execution tactic, focused on executing a malicious payload (T1129) and Privilege Escalation (T1574.001) by exploiting application weaknesses.

  The primary telemetry sources are Windows Event Logs related to image loading (particularly processes initiating with `.node` files). If malicious, the impact can range from data theft to system control, effectively compromising the integrity of trusted applications. However, this detection alone does not confirm malicious intent; it only suggests further investigation is warranted.

  ### Investigation Steps

  - **Identify the triggering application: ** Check logs for `Image` and `ImageLoaded` fields using Security Event ID 4688 or Sysmon Event ID 1. Investigate which specific application (e.g., Slack, Visual Studio Code) is loading the unsigned `.node` files.

  - **Evaluate the file signature: ** Review the `SignatureStatus` field to confirm whether it is marked as 'Unauthorized' or 'Unavailable'. This will help differentiate potential malicious activity from benign uses by trusted applications.

  - **Review historical install paths: ** Validate origins of unsanctioned `.node` files. Legitimate installations typically reside in trusted directories such as `C:\Program Files\` or `C:\Users\{Username}\AppData\Local\`.

  - **Check for recent changes: ** Look into system logs or monitoring solutions for recent changes or installs associated with the applications involved, especially around the `C:\Users\{Username}\.vscode\extensions` and `C:\Program Files\Evernote\resources\app` paths.

  - **Cross-reference known malware signatures: ** Search local file indices or threat intelligence databases for hashes of detected unsigned `.node` files against known malware signatures such as DripLoader.

  - **Inspect application behavior: ** If the application appears benign, compare the loaded `.node` files with those typically seen under normal operations, noting discrepancies in the paths or behaviors that deviate from standard activity.

  ### Prioritization

  This alert holds medium severity due to its potential impact on widely-used applications that, if compromised, can be leveraged for further malicious activities. The likelihood of exploitation is reasonable, especially in environments where users may install unsigned extensions, increasing the risk of malicious code execution.

  ### Blind Spots and Assumptions

  Evasion tactics may include obfuscation through legitimate use of unsigned `.node` files in approved plugins. Reliable detection requires complete visibility and logging from applications, specifically Electron-based ones and their interactions. Legitimate activity may occur when developers use internal tools or plugins that require these extensions. A related detection to enhance coverage is monitoring for unauthorized process execution patterns, especially post-load of the `.node` files.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
