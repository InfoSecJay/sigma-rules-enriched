title: Unsigned .node File Loaded
id: e5f5c693-52d7-4de5-88ae-afbfbce85595
status: experimental
description: |
  Detects the loading of unsigned .node files.
  Adversaries may abuse a lack of .node integrity checking to execute arbitrary code inside of trusted applications such as Slack.
  .node files are native add-ons for Electron-based applications, which are commonly used for desktop applications like Slack, Discord, and Visual Studio Code.
  This technique has been observed in the DripLoader malware, which uses unsigned .node files to load malicious native code into Electron applications.
references:
- https://www.coreycburton.com/blog/driploader-case-study
- https://github.com/CoreyCBurton/DripLoaderNG
- https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
author: Jonathan Beierle (@hullabrian)
date: 2025-11-22
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1129
- attack.t1574.001
- attack.t1036.005
logsource:
  category: image_load
  product: windows
detection:
  selection_node_extension:
    ImageLoaded|endswith: '.node'
  selection_status:
  - Signed: 'false'
  - SignatureStatus: 'Unavailable'
  filter_optional_vscode_jupyter:
    Image|endswith: '\Code.exe'
    ImageLoaded|contains: '.vscode\extensions\ms-toolsai.jupyter-'
    ImageLoaded|endswith:
    - '\electron.napi.node'
    - '\node.napi.glibc.node'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- VsCode extensions or similar legitimate tools might use unsigned .node files. 
  These should be investigated on a case-by-case basis, and whitelisted if 
  determined to be benign.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to load unsigned .node files within Electron applications, such as Slack and Visual Studio Code. Attackers may leverage this behavior to execute arbitrary code within trusted applications, potentially facilitating exploitation, persistence, or privilege escalation. The relevant MITRE ATT&CK techniques include **Execution: Malicious Native Code (T1129)** and **Defense Evasion: Application Layer Protocol (T1574.001)**, as well as **Persistence: Boot or Logon Autostart Script (T1036.005)**.

  The primary telemetry source is the Windows image load event, specifically focusing on events that capture DLL and code execution. If malicious, the loading of unsigned .node files could enable significant compromise of host integrity and application security. Importantly, this detection does NOT confirm an active threat; it merely identifies potential risk indicators that require further investigation.

  ### Investigation Steps

  - **Identify the software loading the .node file:** Review the telemetry for the parent application responsible for loading the unsigned .node file. Look at Security Event ID 4688 for process creation details and ensure the process is legitimate (i.e., `Code.exe` for VSCode).

  - **Assess the .node file specifics:** Validate the file path of the loaded .node files. Significant paths can include `'\electron.napi.node'` or `'\node.napi.glibc.node'`. Determine if these files have been loaded from unusual locations, outside of typical application directories.

  - **Verify signature status:** Examine the properties of the .node file, specifically looking for the `Signed` status being false or `SignatureStatus` being 'Unavailable'. Unsigned or improperly signed files should raise flags for further scrutiny.

  - **Determine benign application usage:** Confirm legitimate usage of .node files. For example, if the `.vscode\extensions\ms-toolsai.jupyter-` path is detected, investigate current extensions in use to ensure they match known good lists from the organization.

  - **Monitor for other malicious indicators:** Cross-reference any other suspicious events surrounding the time of the alert. Utilize Sysmon Event ID 1 to look for concurrent unusual process behavior that might indicate exploitation of the application.

  - **Check for exfiltration artifacts:** If files were created or modified, validate against known paths of unauthorized data exfiltration to ascertain if this activity correlates with wider malicious behavior. Review log types like process creation and file access events.

  ### Prioritization

  The severity of this alert is medium, reflecting the potential for serious compromise within high-impact applications (Slack, Visual Studio Code). While loading unsigned .node files can indicate benign behavior in development, it poses a high risk for malicious exploitation, especially when employed in common attack vectors.

  ### Blind Spots and Assumptions

  Evasion techniques may include benign extensions using unsigned .node files, causing legitimate alerts; therefore, careful review is required. Reliability of detection hinges on accurate configuration of log sources with a focus on image load events in Windows. Be aware that legitimate software updates or misconfigured environments may trigger this alert. Related detections may include monitoring for unusual process execution patterns to provide context and enhance coverage of potential exploitation activities.

