  ### Technical Context

  This Sigma rule detects the loading of the `sdiageng.dll` library by `msdt.exe`, which is indicative of exploitation attempts targeting the Microsoft Support Diagnostic Tool (MSDT) via the Follina (CVE-2022-30190) and DogWalk vulnerabilities. The primary objective of an attacker executing this behavior is to execute arbitrary code remotely or initiate malicious payloads on a victim’s machine, leveraging the trust of a legitimate Windows process.

  The behavior primarily aligns with the MITRE ATT&CK technique T1202: **Command and Scripting Interpreter** and falls under the **Execution** tactic. Key telemetry sources include Windows Event Logs related to image loads, particularly focusing on the Image Load events. If successful, this technique can grant attackers full control over compromised systems. However, this detection does NOT confirm an active compromise on its own without additional supporting evidence; increased contextual analysis is essential.

  ### Investigation Steps

  - **Identify the process creation event:** Check Windows Security Event ID 4688 for instances of `msdt.exe` running. Compare the path against known legitimate locations. Legitimate instances are often executed through system maintenance tasks or genuine support operations.

  - **Corroborate the image load event:** Review Sysmon Event ID 7 for the image loading of `sdiageng.dll` under `msdt.exe`. Record the timestamp and process ID; highly suspicious activity often occurs shortly after `msdt.exe` execution.

  - **Examine command-line parameters:** Inspect the command-line arguments associated with `msdt.exe` using Event ID 4688. Look for unusual flags or references to documents, especially if originating from untrusted sources or recent downloads.

  - **Analyze related network activity:** Check network logs (proxy or firewall logs) for outbound traffic initiated by the `msdt.exe` process. Legitimate MS tools typically do not connect to external services; unusual DNS resolutions or HTTP/S requests can indicate malicious activity.

  - **Review Windows Defender events:** Investigate Windows Defender logs for any malware detections related to `msdt.exe` or `sdiageng.dll`. High-confidence malicious indicators include any detected exploits or files flagged as malicious.

  - **Monitor user activity prior to alert:** Look through logins and user actions within a timeframe leading to the detection (using Event ID 4624). Determine if users accessed files, emails, or links that could have triggered exploitation of `msdt.exe`.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of the msdt.exe process and the high likelihood of misuse for remote code execution. Systems running sensitive applications or handling critical data increase the risk of significant impact when exploited. Additionally, these vulnerabilities are commonly weaponized in cyber-attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  The main detection limitation lies in the possibility of evasion through modified behavior or alternative exploitation paths, where attackers may invoke `msdt.exe` differently. Additionally, proper logging settings must be enforced to capture the relevant telemetry, including ensuring Sysmon and appropriate Windows Event Logs are configured. Legitimate activities, such as remote support operations, may trigger this alert and need to be verified. A related detection to strengthen coverage is monitoring for suspicious parent-child relationship processes, particularly tracking how `msdt.exe` is invoked and its interactions with other applications.

