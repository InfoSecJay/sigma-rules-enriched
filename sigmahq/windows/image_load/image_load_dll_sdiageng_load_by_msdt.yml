  ### Technical Context

  This Sigma rule detects the loading of `sdiageng.dll` by the `msdt.exe` binary, which is indicative of exploitation attempts leveraging CVE-2022-30190 (Follina) and the DogWalk vulnerability. Attackers may utilize this behavior to execute arbitrary code, often aiming to gain remote control or steal sensitive information. This activity maps to the MITRE ATT&CK technique "Exploitation for Client Execution" (T1202).

  The primary telemetry sources are Windows image load events, particularly focusing on process interactions involving `msdt.exe` and the dynamic link library (DLL) being loaded. If the detected behavior is malicious, it could lead to substantial security impacts, such as unauthorized access to user data or system compromise. However, this detection alone does not confirm the successful execution of an attack; additional context is necessary to determine the intent and outcome.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for all instances of `msdt.exe` being executed. Look for unusual parent processes, as legitimate `msdt.exe` instances typically originate from user-initiated actions or trusted applications.

  - **Identify the loading of `sdiageng.dll`:** Cross-reference the image load events in Sysmon (Event ID 10) for instances where `sdiageng.dll` is loaded. Malicious indicators include unexpected load times or instances where the DLL is loaded from suspicious directories.

  - **Analyze the execution context:** Examine the command line arguments associated with `msdt.exe` in Event ID 4688. Malicious actors may employ unusual arguments that differ from legitimate usage, such as network or remote execution parameters.

  - **Review logs for lateral movement indicators:** Inspect for unusual network activity tied to the process, particularly connections initiated by `msdt.exe`. Event logs related to outbound or reverse shell behaviors can indicate malicious actions.

  - **Investigate historical file artifacts:** Check for the presence of the `sdiageng.dll` file in the file system (e.g., C:\Windows\System32\) and verify its creation or last modified timestamps. A newly created or altered file may indicate exploitation.

  - **Assess for known legitimate usage:** Document standard use cases for `msdt.exe` in your environment, noting expected behaviors such as proper user interactions with Microsoft Diagnostic Tool. Identify any deviations that would suggest potential abuse.

  ### Prioritization

  This alert holds high severity due to the potential impact of exploitation on sensitive systems. Given the nature of the `msdt.exe` and `sdiageng.dll` binary, the alert suggests a reasonable likelihood of malicious use, especially in contexts where users may not be aware of the application’s misuse. This behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific configuration settings for Sysmon or other logging methods that could capture the exploitation details comprehensively. Legitimate administrative tools or troubleshooting interventions can inadvertently trigger this alert. A related detection covering suspicious PowerShell activities or other code execution patterns would further bolster monitoring for exploitation attempts within the same context.

