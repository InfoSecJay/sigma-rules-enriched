note: |
  ### Technical Context
  This rule is designed to detect exploits related to the Follina vulnerability (CVE-2022-30190) and the DogWalk vulnerability, which leverage the msdt.exe binary to load the sdiageng.dll library maliciously. Attackers leveraging this technique may aim to bypass security controls, execute arbitrary code, or exfiltrate sensitive data from compromised environments. The exploitation typically occurs when a malicious document crafted with these vulnerabilities trick users into executing msdt.exe, thereby loading the DLL to perform unauthorized actions.

  The rule aligns with multiple MITRE ATT&CK tactics and techniques, notably:
  - **Execution** (TA0002): Utilizing msdt.exe to execute commands.
  - **Defense Evasion** (TA0005): Employing unexpected or benign-looking binaries to bypass detection.
  - **Exploitation for Client Execution** (T1202): The mechanism of executing arbitrary code through a vulnerable client application.

  Primary data sources for effective detection include:
  - **Image load events**: From Windows event logs to observe the dynamic linking of malicious libraries.
  - **Process creation events**: To monitor the execution of msdt.exe and related processes that could indicate exploitation attempts.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for instances where msdt.exe was executed. Look for unusual parent-child process relationships or execution from unexpected directories.
  - **Examine Image Load Events**: Investigate image load logs for any instances of sdiageng.dll being loaded, particularly from the context of msdt.exe, to confirm potential exploitation.
  - **Check User Context**: Identify the user context under which msdt.exe was executed to determine if it was run by privileged users or through methods that indicate potential credential misuse.
  - **Correlate with Document Activity**: Track document access or execution events that might correlate with the timing of msdt.exe executions to identify potential triggering documents.

  ### Prioritization
  This alert is categorized as high severity due to the critical risks associated with remote code execution vulnerabilities. The exploitation via msdt.exe can lead to significant impacts on confidentiality, integrity, and availability in the enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where logging for image loads or process executions is not fully enabled. The detection logic assumes that msdt.exe is being used in a manner consistent with known malicious patterns and does not account for legitimate uses of the executable. It is essential to ensure that precise logging is configured for Windows processes to allow effective detection and potential remediation.

