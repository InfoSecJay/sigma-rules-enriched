title: Microsoft Office DLL Sideload
id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
status: test
description: Detects DLL sideloading of DLLs that are part of Microsoft Office 
  from non standard location
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2023-03-15
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\outllib.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the loading of Microsoft Office DLL files from unauthorized directories, specifically targeting the `outllib.dll`. Attackers may utilize DLL sideloading to execute malicious code by leveraging legitimate Office programs while the library is loaded from a non-standard location. The likely objective is to maintain persistence or escalate privileges undetected, making use of trusted software to execute their payload.

  This behavior aligns with the MITRE ATT&CK tactic of "Persistence" and technique ID T1574.001, which describes the use of compromised DLLs to run arbitrary code within the context of a trusted application. The primary telemetry source is the Windows Event Log with a focus on image load events (via Security Event ID 4688 or Sysmon Event ID 7). If successful, this type of attack could allow the adversary to execute commands with the same privileges as the legitimate process. This detection does NOT confirm actual malicious intent or execution on its own; it indicates a potential abuse of normal software functionality.

  ### Investigation Steps

  - **Verify the loading source of the DLL:** Check the Event ID 4688 (Process Creation) logs and focus on the `New Process Name` field to identify if the application loading `outllib.dll` originates from a legitimate Microsoft Office directory or a suspicious path.

  - **Assess the process hierarchy:** Investigate the parent process of the loading event to determine if it aligns with standard Office execution flows. Any unexpected parent processes or anomalies may indicate malicious behavior.

  - **Check for additional artifact generation:** Validate the presence of new files or changes in the directories, particularly in temporary or user directories where malicious DLLs often reside (e.g., `%APPDATA%`, `%TEMP%`). Look for NTFS Event IDs that indicate file creation or modification.

  - **Identify legitimate usage patterns:** Review normal business processes that utilize Microsoft Office applications in your environment. Document expected usage patterns, particularly in conjunction with `outllib.dll`, to distinguish benign activity from suspicious behavior.

  - **Look for suspicious parameters in process arguments:** Analyze arguments passed to the Office application launching the DLL. Unusual command-line flags can signal an intent to manipulate standard application behavior (Event ID 4688).

  - **Correlate with threat intelligence:** Cross-reference with known malicious indicators associated with DLL sideloading and the specific DLL in question. Utilize threat intelligence feeds that may highlight specific actors or campaigns known to exploit this technique.

  ### Prioritization

  This alert is considered high priority due to the potential impact on system integrity. The likelihood of malicious use is elevated, as DLL sideloading is a commonly exploited technique in advanced attacks, especially by attackers aiming to evade detection while executing code in trusted environments.

  ### Blind Spots and Assumptions

  Detection is limited by the method used to obtain logs; if logging levels are not adequately configured, detection may not trigger for every relevant event. Attackers may also use obfuscation techniques to conceal the loading path or exploit legitimate software updates. Furthermore, legitimate third-party applications that interact with Microsoft Office may trigger similar alerts, adding noise to the investigation. Companion detections that could enhance coverage include monitoring of Office process creation events and DLL modification logs to track unauthorized changes in real-time.

