title: Microsoft Office DLL Sideload
id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
status: test
description: Detects DLL sideloading of DLLs that are part of Microsoft Office from
  non standard location
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
date: 2022-08-17
modified: 2023-03-15
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\outllib.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects instances of DLL sideloading involving Microsoft Office libraries loaded from non-standard locations, which can be indicative of an attack or exploitation attempt. Attackers may utilize DLL sideloading to compromise trusted software, enabling the execution of malicious payloads while evading security measures. By manipulating legitimate software paths, these threats aim to achieve persistence and maintain a foothold within the environment, ultimately leading to data exfiltration or lateral movement.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005)
  - **Persistence** (TA0003), specifically **Sideloading** (T1574.001)
  - **Privilege Escalation** (TA0004)

  Primary data sources for this detection rule are image load events, typically captured in Windows Event Logs, which can reveal when a DLL is loaded by an executable. These logs are crucial for identifying possible threats, especially when legitimate applications are used to load untrusted DLLs.

  ### Investigation Steps
  - **Review Image Load Events:** Check the logs for DLL loads that coincide with `outllib.dll` originating from directories outside of the standard Microsoft Office installation paths.
  - **Analyze Executable Behavior:** Investigate the parent processes that initiated the DLL load to determine if they were expected instances of Microsoft Office applications or if they appear suspicious.
  - **Correlate with User Activity:** Look at user behaviors surrounding the time of the DLL loading, such as recent file downloads or access to potentially malicious links that could have prompted DLL sideloading.
  - **Inspect System Integrity:** Utilize system integrity checks to identify whether any changes were made to the Office installation directories or other critical files, and look for indicators of compromise within the system.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant impact on the enterprise. DLL sideloading can lead to the execution of malicious code with the permissions of trusted applications, increasing the likelihood of successful attacks against sensitive data or systems.

  ### Blind Spots and Assumptions
  Detection may be limited in environments without comprehensive logging of image loads or where proper logging configurations are not enabled. The detection logic assumes that standard Microsoft Office installation paths are consistently utilized and that deviations indicate potential malicious activity. Additionally, the rule may not capture sophisticated evasion techniques that bypass typical image loading methods, requiring comprehensive monitoring and analysis to address these vulnerabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
