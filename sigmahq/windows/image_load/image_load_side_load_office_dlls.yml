title: Microsoft Office DLL Sideload
id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
status: test
description: Detects DLL sideloading of DLLs that are part of Microsoft Office 
  from non standard location
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
modified: 2023-03-15
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\outllib.dll'
  filter:
    ImageLoaded|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of the `outllib.dll` from non-standard directories within Microsoft Office installations. The likely objective of an adversary using this technique is to exploit legitimate Office processes to execute malicious payloads, circumventing security mechanisms. Relevant MITRE ATT&CK tactics and techniques associated with this detection are Defense Evasion (T1562) and Persistence through DLL sideloading (T1574.001).

  The primary telemetry source is Windows Image Load events, specifically monitoring the paths from which DLLs are being loaded. The security impact can be significant, as malicious DLLs could lead to further exploitation, data exfiltration, or unauthorized privilege escalation. However, this detection does not confirm malicious intent on its own; further investigation is required to link the DLL loading to a known malicious context.

  ### Investigation Steps

  - **Check loading paths for `outllib.dll`:** Verify if the DLL is loaded from standard Office installation paths (`C:\Program Files\Microsoft Office\OFFICE\`, etc.). Any loading from paths outside of these indicates potential malicious activity.

  - **Correlate with Office process execution:** Review Security Event ID 4688 to confirm the parent process that initiated the DLL load. Legitimate activities typically show known Office executables (e.g., `winword.exe`, `excel.exe`) as the parent processes.

  - **Analyze Image Load events:** Access Windows Event ID 4100 (Image Load) for full context of the loading event. Look for unusual timestamps or patterns suggesting non-standard operations.

  - **Investigate historical context:** Review Sysmon Event ID 7 (Image Load) for recent events related to the same Office application. Frequent anomaly patterns in history can indicate a malicious cycle.

  - **Identify high-confidence indicators:** Look for specific hashes or signatures of known malicious DLLs that may replace or masquerade as `outllib.dll`. Use reputation services to validate any suspicious hashes identified.

  ### Prioritization

  This alert is high severity as it involves persistent manipulation of commonly used applications. Non-standard DLL loading can be a precursor to significant compromise, particularly in enterprise environments with sensitive data. The behavior is often weaponized in targeted attacks where adversaries aim to gain a foothold.

  ### Blind Spots and Assumptions

  Some detection limitations include potential evasion tactics, such as renaming malicious DLLs to legitimate ones or loading them from standard paths using different names. Reliable detection relies on consistent logging configurations for both Image Load events and parent process tracking. Legitimate activities might include software installers or updates from trusted sources executing in a managed environment. A companion detection to strengthen coverage could include monitoring for unusual process creation associated with Office apps during non-business hours.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
