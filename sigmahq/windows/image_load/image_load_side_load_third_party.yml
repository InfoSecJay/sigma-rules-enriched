title: Third Party Software DLL Sideloading
id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
status: test
description: Detects DLL sideloading of DLLs that are part of third party software
  (zoom, discord....etc)
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
date: 2022-08-17
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Lenovo
  selection_lenovo:
    ImageLoaded|endswith: '\commfunc.dll'
  filter_lenovo:
  - ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  - ImageLoaded|startswith:
    - 'C:\Program Files\Lenovo\Communications Utility\'
    - 'C:\Program Files (x86)\Lenovo\Communications Utility\'
    # Toshiba
  selection_toshiba:
    ImageLoaded|endswith: '\tosbtkbd.dll'
  filter_toshiba:
    ImageLoaded|startswith:
    - 'C:\Program Files\Toshiba\Bluetooth Toshiba Stack\'
    - 'C:\Program Files (x86)\Toshiba\Bluetooth Toshiba Stack\'
    # Zoom (FP with System32)
    # selection_zoom:
    #     ImageLoaded|endswith: '\version.dll'
    # filter_zoom:
    #     ImageLoaded|startswith: 'C:\Users\'
    #     ImageLoaded|contains: '\AppData\Roaming\Zoom\bin\'
  condition: (selection_lenovo and not filter_lenovo) or (selection_toshiba and not
    filter_toshiba)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying DLL sideloading mechanisms that leverage third-party software, specifically targeting executables associated with Lenovo and Toshiba. DLL sideloading involves planting malicious DLL files into paths where legitimate applications look for them, allowing an attacker to execute arbitrary code under the guise of trusted processes. Attackers may employ this technique to maintain persistence, evade detection, or escalate privileges, depending on the malware's design and intent.

  The suspected threat family is likely associated with advanced persistent threats (APTs) or opportunistic attackers who exploit trusted applications to execute malicious payloads without raising suspicion. This behavior falls under several MITRE ATT&CK tactics and techniques, chiefly **Defense Evasion (T1562)** and **Persistence (T1179)**. By hijacking legitimate processes, attackers can blend their activities into regular user environments.

  Primary data sources for this detection include image load events from Windows systems, as they log the invocation of DLLs during the execution of applications. Understanding the context of these events is crucial; thus, having access to logs that detail all DLLs loaded by applications can provide valuable insight into potentially malicious activities.

  ### Investigation Steps
  - **Review Image Load Events:** Analyze Windows image load logs for instances where the applications associated with Lenovo or Toshiba libraries are loading DLLs that shouldn't originate from their stated directories.
  - **Correlate with Known DLL Lists:** Cross-reference any suspicious DLLs identified with lists of global top-level DLLs that are commonly abused for sideloading, such as those cataloged on hijacklibs.net.
  - **Examine User Behavior and Context:** Investigate the user account that executed the process to determine if this behavior is consistent with typical operations. Look for anomalies in user behaviors associated with legitimate applications.
  - **Monitor for Same-process Execution:** Check for cases where malicious DLLs are being loaded by applications that also execute in same processes, indicating that legitimate software is being compromised.

  ### Prioritization
  The impact of this alert is classified as medium severity in an enterprise environment due to the potential for severe consequences, including unauthorized access and control over critical systems. Given that attackers often use DLL sideloading as a preliminary step, detecting such activities early is essential for mitigating further exploitation.

  ### Blind Spots and Assumptions
  One potential blind spot is that this detection may not identify all types of DLL sideloading, particularly if attackers use custom paths or less common applications beyond Lenovo and Toshiba. The detection logic assumes that the loaded DLLs are flagged appropriately and that all relevant executables are monitored. Continuous access to Windows image load event logs is required for effective alerting, and proper configurations in the logging setup are essential to ensure no events are missed.

