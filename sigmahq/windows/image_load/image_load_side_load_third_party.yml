title: Third Party Software DLL Sideloading
id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
status: test
description: Detects DLL sideloading of DLLs that are part of third party 
  software (zoom, discord....etc)
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Lenovo
  selection_lenovo:
    ImageLoaded|endswith: '\commfunc.dll'
  filter_lenovo:
  - ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  - ImageLoaded|startswith:
    - 'C:\Program Files\Lenovo\Communications Utility\'
    - 'C:\Program Files (x86)\Lenovo\Communications Utility\'
    # Toshiba
  selection_toshiba:
    ImageLoaded|endswith: '\tosbtkbd.dll'
  filter_toshiba:
    ImageLoaded|startswith:
    - 'C:\Program Files\Toshiba\Bluetooth Toshiba Stack\'
    - 'C:\Program Files (x86)\Toshiba\Bluetooth Toshiba Stack\'
    # Zoom (FP with System32)
    # selection_zoom:
    #     ImageLoaded|endswith: '\version.dll'
    # filter_zoom:
    #     ImageLoaded|startswith: 'C:\Users\'
    #     ImageLoaded|contains: '\AppData\Roaming\Zoom\bin\'
  condition: (selection_lenovo and not filter_lenovo) or (selection_toshiba and 
    not filter_toshiba)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of third-party software components, specifically targeting Lenovo and Toshiba applications, which can be exploited by attackers to execute malicious code. The objective is typically to gain persistence on the system, escalate privileges, or exploit existing software vulnerabilities. This behavior aligns with the MITRE ATT&CK technique known as "DLL Side-Loading" (T1574.001).

  The primary telemetry sources are Windows image load events, specifically targeting `ImageLoaded` events that record DLL loading activities. If the detected behavior is malicious, it may lead to unauthorized code execution or elevate attacker privileges on the affected system. However, this detection alone does not confirm malicious intent; additional context is required to establish whether the activity is part of legitimate software operation.

  ### Investigation Steps

  - **Examine Image Load Events:** Check for Event ID 4656 (Handle Create) in the Security logs and investigate the `ImageLoaded` field for entries ending with `\commfunc.dll` or `\tosbtkbd.dll` that do not fit the file path criteria. Look for entries from `C:\Program Files\Lenovo\Communications Utility\` or `C:\Program Files\Toshiba\Bluetooth Toshiba Stack\`.

  - **Monitor Access to Executables:** Identify processes using sysinternals tools like Process Monitor to confirm if legitimate Lenovo or Toshiba applications are indeed the originators of the DLL loading or if another unauthorized process is involved. Legitimate use cases would typically involve expected application versions and known file paths.

  - **Review User Context and Timing:** Assess the user under which the DLL was loaded by analyzing Windows Event ID 4688 (Process Creation). Confirm it corresponds to an expected or authorized user account during normal business operational hours.

  - **Identify Malicious Indicators:** Alert for instances where the suspected DLL is loaded from unexpected paths, particularly if the loading occurs from directories like `C:\Users\[USERNAME]\AppData\Roaming\Zoom\bin\` or temporary directories. This indicates potentially suspicious manipulation.

  - **Correlate with Other Suspicious Events:** Cross-reference with any prior security alerts or anomalies related to the same user account to identify a pattern of suspicious behavior or potential lateral movement.

  - **Assess System Impact and Environment:** Consider the criticality of the affected system within the enterprise and prioritize investigation based on its role (e.g., endpoint vs. server), ensuring to check for any alerts indicating high-risk activity associated with privilege elevation.

  ### Prioritization

  This alert is assigned a medium severity due to the potential exploitation of trusted application runtimes for malicious code execution. The likelihood of such sideloading techniques being weaponized by adversaries is moderate, given the reliance on third-party software and the opportunistic nature of such attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to legitimate software updates or reconfigurations that involve similar DLL loading behaviors, which could inadvertently trigger alerts. Required log sources include comprehensive Windows Event logs and Sysmon monitoring for full visibility. Legitimate activities may include proper execution of application updates or installations from trusted sources. A companion detection that strengthens coverage could involve monitoring for unusual outbound network connections from the affected applications, indicating potential data exfiltration attempts.

