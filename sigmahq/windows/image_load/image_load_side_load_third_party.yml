title: Third Party Software DLL Sideloading
id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
status: test
description: Detects DLL sideloading of DLLs that are part of third party 
  software (zoom, discord....etc)
references:
- https://hijacklibs.net/     # For list of DLLs that could be sideloaded (search for dlls mentioned here in there)
author: Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and 
  research)
date: 2022-08-17
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
    # Lenovo
  selection_lenovo:
    ImageLoaded|endswith: '\commfunc.dll'
  filter_lenovo:
  - ImageLoaded|contains: '\AppData\local\Google\Chrome\Application\'
  - ImageLoaded|startswith:
    - 'C:\Program Files\Lenovo\Communications Utility\'
    - 'C:\Program Files (x86)\Lenovo\Communications Utility\'
    # Toshiba
  selection_toshiba:
    ImageLoaded|endswith: '\tosbtkbd.dll'
  filter_toshiba:
    ImageLoaded|startswith:
    - 'C:\Program Files\Toshiba\Bluetooth Toshiba Stack\'
    - 'C:\Program Files (x86)\Toshiba\Bluetooth Toshiba Stack\'
    # Zoom (FP with System32)
    # selection_zoom:
    #     ImageLoaded|endswith: '\version.dll'
    # filter_zoom:
    #     ImageLoaded|startswith: 'C:\Users\'
    #     ImageLoaded|contains: '\AppData\Roaming\Zoom\bin\'
  condition: (selection_lenovo and not filter_lenovo) or (selection_toshiba and 
    not filter_toshiba)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances of third-party software DLL sideloading, particularly through known libraries like `commfunc.dll` (Lenovo) and `tosbtkbd.dll` (Toshiba). Attackers may sideload these DLLs to execute malicious payloads under the guise of legitimate software, thereby maintaining persistence and escalating privileges. The relevant MITRE ATT&CK tactics include Persistence (T1547.001) and Privilege Escalation (T1068).

  Primary telemetry sources involve Windows image load activity, specifically via Windows Security Event ID 4688 for process creation and Sysmon Event ID 7 for image loading. If malicious, this behavior can lead to unauthorized access or control over affected systems. Importantly, the detection does NOT confirm whether the loaded DLL is indeed malicious without additional evidence.

  ### Investigation Steps

  - **Check loaded DLL paths**: Review the process creation logs (Event ID 4688) for any processes that loaded `commfunc.dll` or `tosbtkbd.dll` and ensure the path aligns with the software installation directory. Legitimate behavior typically loads these DLLs from their respective directories, not AppData or unusual locations.

  - **Validate parent process relationships**: Investigate the parent process of the detected image loads through Sysmon Event ID 1 to identify any suspicious or uncommon parent processes. A benign instance often shows a typical user interaction application as the parent.

  - **Search for additional unusual DLLs**: Query Sysmon Event ID 7 to identify any other DLL files loaded near the time of the alert. Compare these against known malicious DLLs relevant to attackers in the environment; a DLL from a non-standard location (e.g., `C:\Users\<username>\AppData`) may indicate malicious activity.

  - **Review execution contexts**: Evaluate the account context (user vs. system) under which the DLL was loaded. Sideloading under SYSTEM or an unexpected user account may indicate malicious intent.

  - **Assess asset criticality**: Determine if the affected machine is part of a critical infrastructure or contains sensitive data. Higher criticality increases the priority of the response.

  ### Prioritization

  This alert should be taken seriously in an enterprise context, especially on critical assets, due to the potential for privilege escalation and persistence via a commonly weaponized technique. The likelihood of malicious abuse is notable, as sideloading is a tactic frequently employed by adversaries to bypass security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging settings or lack of Sysmon deployment. Legitimate software updates or patching processes could inadvertently trigger this alert if they involve sideloading DLLs. A related detection, such as monitoring for anomalous process creation with unauthorized image loads, can strengthen overall coverage against malicious actors employing sideloading techniques.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
