detection:
  selection:
    Image|endswith:
    - '\KeyScrambler.exe'
    - '\KeyScramblerLogon.exe'
    ImageLoaded|endswith: '\KeyScramblerIE.dll'
  filter_main_legitimate_path:
    Image|contains:
    - 'C:\Program Files (x86)\KeyScrambler\'
    - 'C:\Program Files\KeyScrambler\'
    ImageLoaded|contains:
    - 'C:\Program Files (x86)\KeyScrambler\'
    - 'C:\Program Files\KeyScrambler\'
  filter_main_signature:
    Signature: 'QFX Software Corporation'
    SignatureStatus: 'Valid'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potential DLL sideloading by monitoring the loading of "KeyScramblerIE.dll" via "KeyScrambler.exe" or "KeyScramblerLogon.exe." The adversary’s objective may involve executing malicious payloads by leveraging a legitimate process, thereby gaining persistence and potentially elevating privileges without raising immediate suspicion. This behavior aligns with the MITRE ATT&CK tactic of Persistence and the technique T1574.001 (DLL Search Order Hijacking).

  The primary telemetry sources are Windows image load events, specifically looking for images and DLLs that match this condition. If malicious, successful exploitation could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm malicious activity on its own, as benign applications may also exhibit similar behavior.

  ### Investigation Steps

  - **Examine the process tree:** Review Security Event ID 4688 for newly created processes related to "KeyScrambler.exe" or "KeyScramblerLogon.exe." Compare parent-child relationships to identify unusual process spawning.

  - **Check DLL loading:** Investigate Sysmon Event ID 7 for "KeyScramblerIE.dll" loading to confirm its origin. Look for entries that do NOT have "C:\Program Files (x86)\KeyScrambler\" or "C:\Program Files\KeyScrambler\" as their valid path.

  - **Evaluate signature validity:** Verify the signature status of the "KeyScrambler.exe" process against the expected valid publisher, "QFX Software Corporation." Any deviation in signature status could indicate a spoofing attempt.

  - **Identify legitimate behavior:** Confirm that users in the organization use "KeyScrambler" in appropriate contexts, ensuring that it was installed from the expected locations. Check for usage in line with legitimate operational activities.

  - **Monitor for known malicious indicators:** Look for hash values and attributes of "KeyScramblerIE.dll" against threat intelligence feeds to identify if it matches known malicious samples.

  - **Log source review:** Ensure that the logging for image loads and DLLs is configured correctly in the Windows environment for accurate detection. If logging for Sysmon or Windows Event Logs isn't enabled, consider the need for enhanced monitoring.

  ### Prioritization

  This alert carries high severity due to its potential to indicate privilege escalation or persistence tactics by adversaries, often associated with APT actors. The likelihood of abuse is significant, as DLL sideloading techniques are frequently weaponized to avoid detection by security solutions.

  ### Blind Spots and Assumptions

  Detection may be limited by techniques such as process hollowing or using alternative methods for DLL injection that do not trigger image load events. Ensuring that logging for both Windows Event IDs and Sysmon is properly configured is crucial for reliable detection. Legitimate activities could involve developers or IT staff using the KeyScrambler application for legitimate purposes. Companion detections, such as monitoring for unusual outbound connections from compromised systems (e.g., T1071 - Application Layer Protocol), enhance overall security coverage.

