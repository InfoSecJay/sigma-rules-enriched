detection:
  selection:
    Image|endswith:
    - '\KeyScrambler.exe'
    - '\KeyScramblerLogon.exe'
    ImageLoaded|endswith: '\KeyScramblerIE.dll'
  filter_main_legitimate_path:
    Image|contains:
    - 'C:\Program Files (x86)\KeyScrambler\'
    - 'C:\Program Files\KeyScrambler\'
    ImageLoaded|contains:
    - 'C:\Program Files (x86)\KeyScrambler\'
    - 'C:\Program Files\KeyScrambler\'
  filter_main_signature:
    Signature: 'QFX Software Corporation'
    SignatureStatus: 'Valid'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading involving "KeyScrambler.exe" and "KeyScramblerIE.dll," which may indicate malicious exploitation of the legitimate application to load a compromised DLL. The likely attacker objective is to execute malicious code while masquerading as a trusted application, thereby evading detection by security mechanisms. This behavior aligns with the MITRE ATT&CK technique T1574.001, which focuses on DLL search order hijacking.

  The primary telemetry sources include Windows image load events, specifically monitoring process creation activities that make use of the key executable and the loading of associated DLL files. If confirmed as malicious, this action could allow an adversary to gain persistence and potentially escalate privileges within the environment. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is essential to validate intent.

  ### Investigation Steps

  - **Examine process creation events:** Review Windows Security Event ID 4688 for instances of "KeyScrambler.exe" or "KeyScramblerLogon.exe" creation. Check for the presence of suspicious command-line arguments or unusual parent processes.

  - **Review DLL loading events:** Check Windows Event ID 380 (if Sysmon is deployed) or relevant image load events for instances where "KeyScramblerIE.dll" is loaded by "KeyScrambler.exe." Confirm whether these events correlate with the trusted paths specified.

  - **Validate file integrity:** Assess the digital signatures associated with "KeyScrambler.exe" and "KeyScramblerIE.dll" using their properties. Ensure that the signature reflects "QFX Software Corporation" as valid and has not been tampered with.

  - **Identify normal operations:** Compare the anomalous loading of the DLL against typical behavior for "KeyScrambler," which includes loading from the standard installation paths (C:\Program Files (x86)\KeyScrambler\ or C:\Program Files\KeyScrambler\). Legitimate usage typically coincides with user login or scheduled tasks.

  - **Look for known malicious indicators:** Research the file hash of "KeyScramblerIE.dll" against threat intelligence databases or collective malware repositories such as VirusTotal to check for known malicious artifacts.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems where "KeyScrambler" may be used to protect sensitive keystrokes. The likelihood of this behavior being malicious is elevated given the history of DLL sideloading by threat actors. Additionally, tactics employing legitimate applications for exploitation are commonly weaponized in cyber attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of appropriate logging; both Sysmon and adequate security event logging configurations must be enabled to ensure effective monitoring. Legitimate instances, such as software updates or standard application behavior, can unintentionally trigger this alert. A related detection to consider is monitoring for any unusual changes in DLL files within the application's directory, which may indicate tampering or malicious activity.

