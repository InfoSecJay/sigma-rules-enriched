note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading activity involving the executable file "KeyScrambler.exe" attempting to load a potentially malicious version of "KeyScramblerIE.dll". DLL sideloading is a common technique used by threat actors to execute malicious code by embedding it within legitimate applications. In this scenario, attackers may seek to deliver spyware, keyloggers, or other forms of malware under the guise of a well-known application, leveraging trust in the software to bypass security controls and evade detection.

  The likely objectives of attackers utilizing this technique include maintaining persistence within a compromised environment, capturing sensitive user data, or escalating privileges. This activity falls under several MITRE ATT&CK tactics and techniques, specifically:
  - **Persistence (T1055)**: By installing malicious DLLs alongside legitimate software.
  - **Defense Evasion (T1574.001)**: Using DLL sideloading to bypass application controls and detection mechanisms.
  - **Privilege Escalation (T1068)**: Gaining elevated privileges through the exploitation of misplaced trust in legitimate software.

  Key telemetry sources that will provide evidence for this rule include image load logs from Windows, process creation events, and application log files related to KeyScrambler.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for the instantiation of "KeyScrambler.exe" and "KeyScramblerLogon.exe," noting the parent processes and user context to identify any suspicious activity or deviations from normal behavior.
  - **Examine Loaded DLLs**: Investigate the loaded modules associated with the identified executables to determine if "KeyScramblerIE.dll" was loaded from an unexpected or untrusted path, particularly outside of standard installation directories.
  - **Scan Known Paths**: Check for any instances of "KeyScramblerIE.dll" in locations that are not typical for legitimate software installations to identify potential malware presence.
  - **Verify Digital Signatures**: For any instances of "KeyScramblerIE.dll" being loaded, assess their digital signatures for validity. Signature validation should confirm that they are issued by "QFX Software Corporation" and are not tampered with.

  ### Prioritization
  The severity of this alert is high due to the potential for significant compromise and data exfiltration tied to DLL sideloading. Given the stealthy nature of this attack vector, it is critical to act swiftly to identify and remediate any incidents.

  ### Blind Spots and Assumptions
  This detection may not cover all scenarios of DLL sideloading, especially if the attacker employs different techniques or uses alternate file paths or names. Furthermore, the detection relies on the existence of logs that capture image loads, process creations, and digital signature validations. Assumptions include that the paths to legitimate binaries are known and monitored, and that sufficient logging is enabled on Windows systems to detect this behavior effectively. Missing logs or misconfigurations could lead to undetected malicious activities.

