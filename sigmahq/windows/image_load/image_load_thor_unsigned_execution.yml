note: |
  ### Technical Context

  This rule detects the loading and execution of an unsigned Thor scanner binary, specifically `thor.exe` and `thor64.exe`. The likely objective of an attacker using this tool is to perform network reconnaissance or vulnerability scanning on systems within the environment. This behavior aligns with the MITRE ATT&CK framework under the tactic of "Privilege Escalation" (TA0004) and the technique "Sudo and Sudo Caching" (T1574.001). The primary telemetry source is Windows image load events, captured through event logs that detect image loads and executions.

  If executed maliciously, the security impact could result in exposure of sensitive information, network vulnerabilities, and potential lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use cases may exist where Thor scanners are employed within the environment with proper management and approvals.

  ### Investigation Steps

  - **Verify loading and execution events:** Review Security Event ID 4688 (Process Creation) for instances of `thor.exe` or `thor64.exe` running, noting user context and parent process to distinguish between legitimate use and potential abuse.

  - **Check for absence of certificate:** Inspect Sysmon Event ID 7 (Image Load) for `thor.exe` or `thor64.exe`, ensuring the `SignatureStatus` is marked as `invalid` or `not signed`. This is a strong indicator of malicious use.

  - **Identify legitimate scenarios:** Check internal documentation or security policies to confirm any approved uses of Thor scanner binaries. If found running under expected accounts, consider these benign.

  - **Correlate with network activity:** Analyze network traffic logs (Firewall/IDS) for unusual outgoing connections or scanning behavior following the execution of the scanned binaries, particularly looking for high-frequency requests to multiple IPs within a short time frame.

  - **Determine asset criticality:** Identify the host where `thor.exe` executed. Prioritize investigation based on the criticality of the asset if the execution appears suspicious. Examine files created or modified around the same time for artifacts that indicate attempts at exfiltration or system compromise.

  ### Prioritization

  This alert is of high severity due to the potential impact on the security posture of critical systems. The likelihood of abuse is moderate to high, especially since tools like Thor are often utilized by adversaries for scanning networks. This behavior is also commonly weaponized for reconnaissance, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate usage of Thor by authorized personnel, which could lead to false positives. Additionally, systems may lack proper logging configurations if not monitored appropriately, particularly Sysmon or file integrity monitoring. Related detections to consider include alerts for unusual outbound network connections or other reconnaissance tools executing, further enriching context for analysis.

