note: |
  ### Technical Context

  This rule detects the loading and execution of an unsigned binary associated with the Thor Scanner, a security tool used for scanning networks for vulnerabilities, potentially wielded by attackers for reconnaissance. The likely attacker objective is to gain information about system configurations and vulnerabilities, facilitating further exploitation. This behavior is associated with the MITRE ATT&CK techniques T1574.001 (Code Signing) and broadly relates to tactics in privilege escalation and execution.

  The primary telemetry sources are Windows image load events, specifically relating to the execution of `.exe` files. The key log types include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 7 (Image Load). A successful detection indicates a potential security threat as malicious actors could be using the Thor Scanner for unauthorized scanning activities. It is essential to note that this detection alone does not confirm the malicious intent without additional corroborating evidence.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for new process creation of "thor.exe" or "thor64.exe." Pay attention to parent processes for unusual execution paths (e.g., command line arguments indicating stealthy execution).

  - **Examine image load events:** Analyze Sysmon Event ID 7 for any instances where "thor.exe" or "thor64.exe" are loaded without a valid signature. Look for discrepancies in image path comparisons with known legitimate installations.

  - **Assess legitimate usage scenarios:** Confirm whether local asset owners utilize the Thor Scanner for legitimate security assessments. Review related documentation or communication from the security team regarding approved software deployments.

  - **Identify high-confidence malicious indicators:** Flag any instances of "thor.exe" running outside of expected directories (e.g., C:\Program Files\Nextron Systems\) with specific attention to suspicious parent processes that may indicate malicious execution.

  - **Validate file activity:** Look for logs related to file creation, modification, or network connections (TCP/UDP) tied to the Thor Scanner's execution. Relevant telemetry includes Sysmon Event ID 11 (FileCreate) and Event ID 3 (Network Connection).

  ### Prioritization

  This alert is classified as high severity due to the potential impact on systems containing sensitive data or critical applications. The likelihood of abuse is heightened, given that unsigned binaries are often indicative of common attack methodologies. Unsigned executables like Thor, used maliciously, can lead to serious compromises if not properly contained.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate usages of Thor Scanner occur frequently without proper logging. Additionally, administrators must ensure logging for process creation and image loading settings are correctly configured for comprehensive detection. Legitimate system administration activities, such as security assessments, may trigger this alert, necessitating further investigation. A related detection to consider is monitoring for other unsigned binaries or unauthorized scanning tools, which may provide broader context for the alert.

