title: Suspicious Unsigned Thor Scanner Execution
id: ea5c131b-380d-49f9-aeb3-920694da4d4b
status: stable
description: Detects loading and execution of an unsigned thor scanner binary.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-10-29
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith:
    - '\thor.exe'
    - '\thor64.exe'
    ImageLoaded|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  filter_main:
    Signed: 'true'
    SignatureStatus: 'valid'
    Signature: 'Nextron Systems GmbH'
  condition: selection and not filter_main
falsepositives:
- Other legitimate binaries named "thor.exe" that aren't published by Nextron Systems
level: high
note: |
  ### Technical Context
  This rule detects the execution of the Thor scanner binary when it is not properly signed or does not originate from the expected publisher, Nextron Systems GmbH. Thor is a security tool often used in penetration tests and red teaming for reconnaissance, which makes its misuse by malicious actors particularly concerning. Attackers may leverage an unsigned version of this tool to conduct unauthorized scans or to establish persistence within a network while evading detection mechanisms.

  The detected activity relates primarily to the MITRE ATT&CK framework's tactics of *Privilege Escalation* (TA0004) and *Defense Evasion* (TA0005). Specifically, the technique *T1574.001: Hijack Execution Flow* is relevant here, as attackers may employ altered or unsigned binaries to manipulate system processes. The primary telemetry sources for collecting evidence of this activity include image load logs detailing executed binaries and the associated metadata that indicates signing status.

  ### Investigation Steps
  - **Review Image Load Logs:** Examine the image load logs to identify instances of thor.exe or thor64.exe, focusing on the context of their execution. Check for unusual execution pathways or execution from unexpected directories.

  - **Verify Digital Signatures:** For each instance of the suspected execution, verify the digital signatures of the binaries. Any instance of thor.exe or thor64.exe not signed by Nextron Systems GmbH warrants further scrutiny.

  - **Cross-Reference Execution Context:** Analyze process creation logs and correlate with the image load events detected. Look for unusual parent-child process relationships, which may indicate a scripted or nefarious execution context.

  - **Assess Network Activity:** If these binaries establish network connections, review network logs for suspicious outbound connections initiated by the executing process, especially to unknown or high-risk IP addresses.

  ### Prioritization
  The alert is deemed high severity due to the potential use of the Thor scanner in furthering unauthorized access or maintaining persistence within the environment, which poses a significant risk to enterprise security.

  ### Blind Spots and Assumptions
  This detection approach may miss other instances of similar unsigned tools or legitimate applications named "thor.exe" that are not authored by Nextron Systems. The rule assumes that the proper logging of image loads and process creations is enabled. Additionally, it relies on the presence of clearly defined execution paths and does not account for misconfigured environments that allow unsigned executables or binaries from different sources.

