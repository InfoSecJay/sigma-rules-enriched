title: Potential WWlib.DLL Sideloading
id: e2e01011-5910-4267-9c3b-4149ed5479cf
status: test
description: Detects potential DLL sideloading of "wwlib.dll"
references:
- https://twitter.com/WhichbufferArda/status/1658829954182774784
- https://news.sophos.com/en-us/2022/11/03/family-tree-dll-sideloading-cases-may-be-related/
- https://securelist.com/apt-luminousmoth/103332/
author: X__Junior (Nextron Systems)
date: 2023-05-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\wwlib.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
    Image|endswith: '\winword.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the sideloading of the "wwlib.dll" by monitoring for instances where the DLL is loaded in conjunction with "winword.exe" from designated Microsoft Office directories. DLL sideloading is often employed by adversaries to execute malicious code disguised as a legitimate DLL, enabling persistence and privilege escalation. The likely attacker objective is to execute arbitrary code while leveraging the trust associated with Microsoft Office applications.

  This behavior relates to MITRE ATT&CK techniques such as "DLL Search Order Hijacking" (T1574.001). The primary telemetry sources are Windows Image Load events that capture dynamic-link library operations (event types indicating DLL loads). If successful, this method can compromise system integrity, leading to further exploitation. Importantly, detection of DLL loading does not confirm malicious activity on its own; it requires additional context to assess the behavior's legitimacy.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 to identify instances of "winword.exe" launching with associated command-line parameters that may indicate suspicious behavior.

  - **Verify DLL load events**: Check Sysmon Event ID 7 for “wwlib.dll” being loaded; note the parent process to ensure it originated from a legitimate Office application (e.g., "winword.exe").

  - **Identify unique paths**: Ensure the DLL was loaded from the legitimate directories - "C:\Program Files (x86)\Microsoft Office\" or "C:\Program Files\Microsoft Office\". Deviations from this path could indicate malicious activity.

  - **Cross-reference with other events**: Look for associated commands in PowerShell (e.g., Event ID 4104 logs) right before or after the loading event that may indicate script execution or other suspicious behaviors.

  - **Establish baseline behavior**: Consider normal operations of “winword.exe” by checking typical file access and DLL dependencies; legitimate activities will often display known benign DLLs resolving correctly without loading "wwlib.dll".

  - **High-confidence malicious indicator**: If "wwlib.dll" is found loaded without "winword.exe" as the parent, or if it appears in any process running outside of Office directories, flag it as a significant threat for deeper investigation.

  ### Prioritization

  This alert possesses medium severity due to the impact on systems where Microsoft Office is critical for operations, as well as the ease of executing similar tactics by adversaries. Sideloading DLLs has been a common method for achieving malicious goals, highlighting the need for immediate response and deeper analysis.

  ### Blind Spots and Assumptions

  Detection may be limited if log settings do not capture DLL load events comprehensively; ensure Sysmon or equivalent logging is enabled for pertinent telemetry. Legitimate software updates or changes can trigger similar behaviors, particularly when Microsoft Office components are involved. Companion detections that enhance coverage include monitoring for unexpected parent-child process relationships or flags in Windows event logs indicating potential exploitation patterns.

