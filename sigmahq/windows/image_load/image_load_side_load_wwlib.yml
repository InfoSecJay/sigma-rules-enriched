title: Potential WWlib.DLL Sideloading
id: e2e01011-5910-4267-9c3b-4149ed5479cf
status: test
description: Detects potential DLL sideloading of "wwlib.dll"
references:
- https://twitter.com/WhichbufferArda/status/1658829954182774784
- https://news.sophos.com/en-us/2022/11/03/family-tree-dll-sideloading-cases-may-be-related/
- https://securelist.com/apt-luminousmoth/103332/
author: X__Junior (Nextron Systems)
date: 2023-05-18
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\wwlib.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
    Image|endswith: '\winword.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potential DLL sideloading of the "wwlib.dll," which may indicate malicious activity targeting Microsoft Word. DLL sideloading occurs when an application loads a malicious DLL masquerading as a legitimate one, often to evade security mechanisms. In this scenario, an attacker may leverage the trusted environment of Microsoft Office to execute arbitrary code and gain further access to the victim's machine. The objective is typically to install malware, exfiltrate data, or maintain persistence within the environment.

  The primary MITRE ATT&CK tactics involved in this rule are **Persistence (TA0003)**, **Defense Evasion (TA0005)**, and **Privilege Escalation (TA0004)**, particularly the technique of **DLL Side-Loading (T1574.001)**. By detecting attempts to load "wwlib.dll" from suspicious paths, the detection can help identify malicious activities that hijack legitimate processes.

  The primary data sources that will contain evidence include Windows image load logs, which track when executable files and libraries are loaded into memory; these logs provide insight into abnormal behavior associated with commonly trusted software like Microsoft Office.

  ### Investigation Steps
  - **Review Process Activity**: Analyze process creation logs to identify any commands or scripts that executed "winword.exe" before the "wwlib.dll" was loaded. Look for unusual parent-child relationships that could indicate a compromise.

  - **Inspect Image Load Events**: Investigate image load logs for instances of "wwlib.dll." Focus deeply on its load path to see if it originates from legitimate Microsoft Office installation directories or unexpected locations.

  - **Validate File Integrity**: Perform checks on "wwlib.dll" to verify its cryptographic signatures and file properties. Compare the file against known good hashes from verified sources to ensure it has not been tampered with.

  - **Correlate with Other Alerts**: Cross-reference this detection with other security alerts that may indicate broader compromise efforts, such as unusual login patterns, lateral movement attempts, or evidence of command-and-control communication.

  ### Prioritization
  The alert is categorized as medium severity due to the potential for an attacker to gain unauthorized access or control over the system using a trusted application. While the likelihood of true positives requires further investigation, the impact could be significant if not addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detecting all possible paths used for DLL sideloading, as attackers can obfuscate their methods or target less common applications. The detection logic assumes that "wwlib.dll" is not legitimately loaded from the identified directories and requires that logs for image load events are enabled and stored properly. Additionally, if protections such as application whitelisting or monitoring solutions are absent, the detection may miss malicious behavior altogether.

