title: Potential WWlib.DLL Sideloading
id: e2e01011-5910-4267-9c3b-4149ed5479cf
status: test
description: Detects potential DLL sideloading of "wwlib.dll"
references:
- https://twitter.com/WhichbufferArda/status/1658829954182774784
- https://news.sophos.com/en-us/2022/11/03/family-tree-dll-sideloading-cases-may-be-related/
- https://securelist.com/apt-luminousmoth/103332/
author: X__Junior (Nextron Systems)
date: 2023-05-18
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\wwlib.dll'
  filter_main_path:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
    Image|endswith: '\winword.exe'
    ImageLoaded|startswith:
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Program Files\Microsoft Office\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading of "wwlib.dll" when loaded in conjunction with "winword.exe" from Microsoft Office installation paths. The behavior suggests an attacker is leveraging the trusted application to load malicious code, intending to maintain persistence or evade detection. The relevant MITRE ATT&CK tactics include Persistence (T1574.001) and Defense Evasion. The primary telemetry source is Windows Image Load events, specifically looking for the loading of the DLL in the context of the executable.

  If this behavior is malicious, it can lead to unauthorized access or data exfiltration via the compromised application. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate uses of "wwlib.dll" may occur in the same contexts, especially if these updates or plugins are part of approved security measures.

  ### Investigation Steps

  - **Review the Image Load events:** Check for Event ID 4616 or Sysmon Event ID 10 related to "wwlib.dll" loaded by "winword.exe" to confirm the activity. Compare timestamps against known maintenance schedules for applications.

  - **Validate legitimate user activities:** Determine if the user associated with the event has a history of expected behavior, such as legitimate use of Microsoft Office products for document processing, which should appear in logs such as Office Application event logs.

  - **Correlate with other security events:** Examine the Windows Event logs (Security Event ID 4688 or Sysmon Event ID 1) for any unusual process creation patterns, especially those that might relate to office software launching other applications.

  - **Inspect for high-confidence indicators:** Look for altered or new DLL files in the directories specified, specifically "C:\Program Files (x86)\Microsoft Office\" or "C:\Program Files\Microsoft Office\", where timestamps may indicate unusual modification or creation dates.

  - **Monitor for repeat occurrences:** If the alert has triggered multiple times within a short window, escalate investigation efforts and review prior logs to identify a possible campaign or ongoing malicious behavior.

  ### Prioritization

  The alert’s severity is medium, as it involves the potential compromise of widely-used software with significant access to organizational data. The likelihood of malicious abuse is elevated given that DLL sideloading is a technique employed by advanced persistent threats (APTs). Such behavior is notably weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through alternative DLLs or file obfuscation techniques. Required log sources must include enabled Image Load events for comprehensive visibility which may not be configured on all systems. Legitimate software updates or corporate compliance installations could inadvertently trigger this alert. Related detections, such as command-line analysis of "winword.exe" for suspicious arguments or parent processes, can enhance coverage against this tactic.

