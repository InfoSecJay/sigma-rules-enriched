title: Potential Python DLL SideLoading
id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
status: test
description: Detects potential DLL sideloading of Python DLL files.
references:
- https://www.securonix.com/blog/seolurker-attack-campaign-uses-seo-poisoning-fake-google-ads-to-install-malware/
- https://thedfirreport.com/2024/09/30/nitrogen-campaign-drops-sliver-and-ends-with-blackcat-ransomware/
- https://github.com/wietze/HijackLibs/tree/dc9c9f2f94e6872051dab58fbafb043fdd8b4176/yml/3rd_party/python
author: Swachchhanda Shrawan Poudel
date: 2024-10-06
modified: 2025-08-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\python39.dll'
    - '\python310.dll'
    - '\python311.dll'
    - '\python312.dll'
  filter_main_default_install_paths:
  - ImageLoaded|startswith:
    - 'C:\Program Files\Python3'
    - 'C:\Program Files (x86)\Python3'
  - ImageLoaded|contains: '\AppData\Local\Programs\Python\Python3'
  filter_optional_visual_studio:
    ImageLoaded|startswith: 'C:\Program Files\Microsoft Visual Studio\'
  filter_optional_anaconda:
    ImageLoaded|startswith: 'C:\ProgramData\Anaconda3\'     # Comment out if you don't use Anaconda in your environment
  filter_optional_cpython:
    ImageLoaded|contains:
    - '\cpython\externals\'
    - '\cpython\PCbuild\'
  filter_optional_pyinstaller:
        # Triggered by programs bundled with PyInstaller
    ImageLoaded|startswith: 'C:\Users'
    ImageLoaded|contains: '\AppData\Local\Temp\_MEI'
  filter_main_legit_signature_details:
    Product: 'Python'
    Signed: 'true'
    Description: 'Python'
    Company: 'Python Software Foundation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate software using Python DLLs
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify potential malicious DLL sideloading involving Python DLL files such as `python39.dll`, `python310.dll`, `python311.dll`, and `python312.dll`. This technique can be leveraged by threat actors to execute malicious payloads while masquerading them as legitimate Python operations, thereby evading detection. Attackers often utilize DLL sideloading to escalate privileges or maintain persistence within an environment by exploiting trusted application paths.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003): ensuring continued access to a system.
  - **Privilege Escalation** (TA0004): gaining higher privileges within the environment.
  - **Defense Evasion** (TA0005): obfuscating malicious activity to evade security solutions.
  - **DLL Search Order Hijacking** (T1574.001): targeting the loading of DLLs to execute code in a different context.

  The primary data sources for this detection will include Image Load event logs from Windows, which track DLL loading activity, and may be enriched with process creation logs to provide context on the applications attempting to load the suspicious DLLs.

  ### Investigation Steps
  - **Review Image Load Events**: Examine Image Load events where the loaded DLLs end with `python39.dll`, `python310.dll`, `python311.dll`, or `python312.dll`. Identify any instances that do not originate from standard installation paths.

  - **Analyze Process Creation Logs**: Investigate the processes that attempted to load the identified Python DLLs. Look for unusual parent processes or command-line arguments that may indicate suspicious behavior.

  - **Check File Path and Signatures**: Verify the file paths of the loaded DLLs to ensure they are not being loaded from `AppData`, `Temp`, or any other non-standard directories. Confirm that the DLL has legitimate signatures from the Python Software Foundation.

  - **Investigate User Accounts**: Assess the user accounts associated with the event to determine if they have elevated privileges or if they are part of any known threat actor profiles within your environment.

  ### Prioritization
  The alert's severity is medium due to the risk of privilege escalation and potential persistence methodologies linked with DLL sideloading techniques. Given that threat actors often leverage benign-looking files and processes for malicious intents, prompt investigation is essential to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly regarding legitimate applications that may also utilize Python DLLs without exhibiting malicious behavior. The rule assumes that Python installations conform to expected directory structures; any deviations could result in missed detections. Additionally, if the logging is not enabled for Image Load events or if logs are truncated, the rule may not function properly. Properly configuring logging settings is essential for comprehensive monitoring and detection.

