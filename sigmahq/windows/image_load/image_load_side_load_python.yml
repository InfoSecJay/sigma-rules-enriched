title: Potential Python DLL SideLoading
id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
status: test
description: Detects potential DLL sideloading of Python DLL files.
references:
- https://www.securonix.com/blog/seolurker-attack-campaign-uses-seo-poisoning-fake-google-ads-to-install-malware/
- https://thedfirreport.com/2024/09/30/nitrogen-campaign-drops-sliver-and-ends-with-blackcat-ransomware/
- https://github.com/wietze/HijackLibs/tree/dc9c9f2f94e6872051dab58fbafb043fdd8b4176/yml/3rd_party/python
author: Swachchhanda Shrawan Poudel
date: 2024-10-06
modified: 2025-08-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\python39.dll'
    - '\python310.dll'
    - '\python311.dll'
    - '\python312.dll'
  filter_main_default_install_paths:
  - ImageLoaded|startswith:
    - 'C:\Program Files\Python3'
    - 'C:\Program Files (x86)\Python3'
  - ImageLoaded|contains: '\AppData\Local\Programs\Python\Python3'
  filter_optional_visual_studio:
    ImageLoaded|startswith: 'C:\Program Files\Microsoft Visual Studio\'
  filter_optional_anaconda:
    ImageLoaded|startswith: 'C:\ProgramData\Anaconda3\'     # Comment out if you don't use Anaconda in your environment
  filter_optional_cpython:
    ImageLoaded|contains:
    - '\cpython\externals\'
    - '\cpython\PCbuild\'
  filter_optional_pyinstaller:
        # Triggered by programs bundled with PyInstaller
    ImageLoaded|startswith: 'C:\Users'
    ImageLoaded|contains: '\AppData\Local\Temp\_MEI'
  filter_main_legit_signature_details:
    Product: 'Python'
    Signed: 'true'
    Description: 'Python'
    Company: 'Python Software Foundation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate software using Python DLLs
level: medium
note: |
  ### Technical Context

  This rule detects attempts to load Python DLL files that do not come from expected installation paths, which may indicate a DLL sideloading attack. The primary objective of such an attack is often to execute malicious payloads by exploiting legitimate functionality within the Python runtime, leveraging trusted DLLs to evade detection. This behavior aligns with the MITRE ATT&CK tactic of Persistence and Execution, specifically technique T1574.001 (DLL Side-Loading). The primary telemetry sources are Windows Image Load logs, particularly focusing on locations and signatures of loaded modules.

  If this detection is confirmed to be malicious, it could lead to unauthorized code execution, data loss, or lateral movement within the enterprise environment. It’s crucial to note that this detection does NOT confirm malicious activity by itself; it merely flags potential suspicious behavior based on image loading activity.

  ### Investigation Steps

  - **Identify the DLL paths: **Review the ImageLoad logs (Event ID 4663) for any loading of `python39.dll`, `python310.dll`, `python311.dll`, or `python312.dll` from non-standard paths. Specifically, check for paths that do not match `C:\Program Files\Python3`, `C:\ProgramData\Anaconda3\`, or other legitimate directories.

  - **Check for loading context:** Verify the process that loaded the DLL using Sysmon Event ID 1. Analyze the parent-child process relationships to detect any suspicious parent processes that executed unusual commands or are known to be used for malicious purposes.

  - **Review digital signatures:** Confirm the signature details of the loaded Python DLL. Legitimate Python DLLs should be signed by the "Python Software Foundation." Any DLLs lacking this signature or originating from unexpected directories should be flagged for further analysis.

  - **Examine for scripting activity:** Investigate recent PowerShell or Python scripts executed on the system (Event IDs 4103 for PowerShell). If there are recent executions coinciding with the suspicious DLL load, it may indicate a more significant malicious behavior pattern.

  - **Validate benign applications:** Ensure no legitimate software utilizing Python libraries is operational in the environment, especially applications that might reside in the user directory or utilize DLLs from non-standard paths. Document legitimate software that is known to function within the organization.

  - **Collect file artifacts:** If the suspicious loading is identified, check for indicators of file creations in `C:\Users\[Username]\AppData\Local\Temp\_MEI`, where malware might extract payload binaries temporarily. Validate logs for any recent file creations (FileCreate events) in this directory that correlate with the suspicious DLL load time.

  ### Prioritization

  This alert carries medium severity due to its potential impact on enterprise systems, particularly if successful exploitation occurs. Given that DLL sideloading techniques are frequently weaponized by attackers, especially in targeted campaigns, a prompt investigation is necessary to assess risk and remediate.

  ### Blind Spots and Assumptions

  Detection is limited if the DLLs come from legitimate third-party applications that may use Python. The rule relies on specific log sources; if Windows Image Load logs are not collected or configured properly, detection will be ineffective. Legitimate activities like internal scripts or tools leveraging Python may trigger this alert, creating false positives. As a related detection, consider monitoring for unusual script execution patterns or unusual child processes initiated from trusted applications to reinforce surveillance on this threat vector.

