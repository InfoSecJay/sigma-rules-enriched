title: Potential Python DLL SideLoading
id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
status: test
description: Detects potential DLL sideloading of Python DLL files.
references:
- https://www.securonix.com/blog/seolurker-attack-campaign-uses-seo-poisoning-fake-google-ads-to-install-malware/
- https://thedfirreport.com/2024/09/30/nitrogen-campaign-drops-sliver-and-ends-with-blackcat-ransomware/
- https://github.com/wietze/HijackLibs/tree/dc9c9f2f94e6872051dab58fbafb043fdd8b4176/yml/3rd_party/python
author: Swachchhanda Shrawan Poudel
date: 2024-10-06
modified: 2025-08-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\python39.dll'
    - '\python310.dll'
    - '\python311.dll'
    - '\python312.dll'
  filter_main_default_install_paths:
  - ImageLoaded|startswith:
    - 'C:\Program Files\Python3'
    - 'C:\Program Files (x86)\Python3'
  - ImageLoaded|contains: '\AppData\Local\Programs\Python\Python3'
  filter_optional_visual_studio:
    ImageLoaded|startswith: 'C:\Program Files\Microsoft Visual Studio\'
  filter_optional_anaconda:
    ImageLoaded|startswith: 'C:\ProgramData\Anaconda3\'     # Comment out if you don't use Anaconda in your environment
  filter_optional_cpython:
    ImageLoaded|contains:
    - '\cpython\externals\'
    - '\cpython\PCbuild\'
  filter_optional_pyinstaller:
        # Triggered by programs bundled with PyInstaller
    ImageLoaded|startswith: 'C:\Users'
    ImageLoaded|contains: '\AppData\Local\Temp\_MEI'
  filter_main_legit_signature_details:
    Product: 'Python'
    Signed: 'true'
    Description: 'Python'
    Company: 'Python Software Foundation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate software using Python DLLs
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL sideloading involving Python DLL files, specifically looking for instances where malicious or unsigned Python DLLs are loaded instead of legitimate ones. The attacker may aim to leverage DLL sideloading as a method for privilege escalation or persistence by executing malicious code that disguises itself as a legitimate Python library. This detection relates to the MITRE ATT&CK tactics of Privilege Escalation (T1068) and Defense Evasion (T1574.001).

  Primary telemetry sources are Windows Event Logs focused on image loads, specifically logs that capture DLL process creation and loading events. The potential security impact includes unauthorized code execution, leading to data compromise or system takeovers. It is crucial to understand that this detection does NOT confirm malicious intent on its own, as it could also be triggered by legitimate software using Python DLLs.

  ### Investigation Steps

  - **Identify recent DLL loads:** Review Windows Event ID 4104 (PowerShell logs) to see which Python DLL files have been loaded recently. Look specifically for `python39.dll`, `python310.dll`, `python311.dll`, and `python312.dll` not found in normal installation paths.

  - **Verify legitimate installations:** Check if the loaded Python DLLs are originating from authorized directories like `C:\Program Files\Python3` or `C:\AppData\Local\Programs\Python\Python3`. Legitimate installations will typically have valid signatures from the Python Software Foundation.

  - **Extract evidence from log sources:** Use Sysmon Event ID 7 (ImageLoad) to ensure that any detected DLLs are not coming from unusual or temporary locations, such as `C:\Users\{username}\AppData\Local\Temp\_MEI`. This indicates potential usage of bundled software that could be weaponized.

  - **Correlate with active processes:** Cross-reference the loaded DLLs with the Process ID and associated executable in Windows Security Event ID 4688 (Process Creation). If a known, malicious process is using these DLLs, it's a high-confidence indicator of malicious activity.

  - **Check for code execution:** Validate if there have been any unexpected command line executions in conjunction with the suspicious DLL loads by analyzing Sysmon Event ID 1 (Process Creation). Look for arguments that suggest runtime loading of malicious Python scripts.

  - **Identify false positive potential:** Review the application's legitimate activity to identify commonly used Python libraries in your environment, as many applications rely on Python DLLs. Significantly abnormal usage patterns with these DLLs could indicate malicious intent.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for privilege escalation and the risk of malware execution. While the behavior observed is not uncommon in normal operations, it can imply an elevated likelihood of malicious intent in certain contexts, especially if resulting from unusual paths or associations with known threat vectors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques where cyber adversaries may use signed libraries or legitimate Python installations to avoid detection. Additional log sources, such as detailed application or system logs, may be required for thorough investigation. Legitimate software utilizing Python libraries, such as data analysis tools or web applications, may trigger this alert, so context is critical. Enhancing detection with companion monitoring rules for suspicious process behavior (e.g., malware analysis tools) will strengthen overall security coverage.

