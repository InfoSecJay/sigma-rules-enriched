logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\mfdetours.dll'
  filter_main_legit_path:
    ImageLoaded|contains: ':\Program Files (x86)\Windows Kits\10\bin\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This rule detects potential DLL sideloading involving the "mfdetours.dll" file. Attackers can exploit the legitimate `mftrace.exe` utility to attach to arbitrary processes and force the loading of a DLL named "mfdetours.dll" from the current working directory. Such behavior is often characteristic of post-exploitation activities where adversaries sideload malicious libraries to maintain persistence, escalate privileges, or evade defenses.

  The threat scenario typically involves an attacker aiming to execute arbitrary code within a target process by tricking it into loading a maliciously crafted or hijacked DLL. This can allow the attacker to manipulate the target process or maintain stealthy access to the system. Relevant MITRE ATT&CK tactics include Persistence (T1547), Defense Evasion (T1562), and Privilege Escalation (T1574.001), which detail techniques for maintaining presence, evading defenses, and escalating privileges through various means, including DLL sideloading.

  Primary data sources for this detection include image load event logs from Windows, which can provide evidence of DLLs that are loaded into processes, particularly focusing on those loaded from locations outside of standard program directories.

  ### Investigation Steps
  - **Review Image Load Logs:** Examine image load events to identify any instances where `mfdetours.dll` has been loaded, focusing on the process that initiated the load and the current working directory from which it was loaded.

  - **Analyze Executable Path:** Investigate the executable path for `mftrace.exe` to determine if it resides in an unusual location, and confirm if the loading of `mfdetours.dll` happens outside of its legitimate installation directory, such as `C:\Program Files (x86)\Windows Kits\10\bin\`.

  - **Check Process Behavior:** Monitor the behavior of the process that loaded `mfdetours.dll` for any suspicious activities, such as unusual network connections, file modifications, or spawning of additional processes.

  - **Correlate with User Activity:** Cross-reference the events with user activity logs to identify any unauthorized or suspicious user actions that coincide with the DLL loading event, aiding in attributing the activity to a potential insider threat or compromised account.

  ### Prioritization
  This alert is prioritized as medium severity due to the potential impact of arbitrary code execution through DLL sideloading, which could lead to further compromise efforts such as data exfiltration or lateral movement within the network, depending on the attacker's goals and capabilities.

  ### Blind Spots and Assumptions
  There may be blind spots if other DLL sideloading techniques or variations of the `mftrace.exe` utility are used that do not involve "mfdetours.dll". The detection logic assumes that the initial execution context and working directory will be anomalous, which may not always be the case. Additionally, adequate logging of image load events is required for this alert to function, meaning that logging settings should be thoroughly configured to capture the necessary telemetry across all endpoints.

