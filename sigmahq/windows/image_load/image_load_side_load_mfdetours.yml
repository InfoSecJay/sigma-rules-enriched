logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\mfdetours.dll'
  filter_main_legit_path:
    ImageLoaded|contains: ':\Program Files (x86)\Windows Kits\10\bin\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to sideload the "mfdetours.dll" file during process execution. The likely attacker objective is to gain persistence or escalate privileges by injecting malicious behavior into legitimate processes using this DLL. This behavior aligns with the MITRE ATT&CK tactic for Persistence and Privilege Escalation, specifically technique T1574.001 (DLL Search Order Hijacking). The primary telemetry sources for this detection are Windows Image Load events, specifically looking for occurrences of DLL loads. If malicious, this could lead to unauthorized access or control over the targeted process. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate applications may also attempt to load "mfdetours.dll" under specific circumstances.

  ### Investigation Steps

  - **Verify Image Load events**: Check for Security Event ID 4688 (process creation) and Windows Event ID 4663 (access to an object) for the specific "mfdetours.dll" loading event. Analyze the process creation tree to assess the legitimacy of the parent process.

  - **Inspect process directory**: Review the path from which "mfdetours.dll" is being loaded. If it originates from a non-standard or temporary directory (e.g., C:\Users\*username*\AppData\Local\Temp), it may indicate malicious activity.

  - **Cross-reference with known good paths**: Validate the occurrence against standard installation directories (e.g., 'C:\Program Files (x86)\Windows Kits\10\bin\'). If the load does not match these paths, further investigation is warranted.

  - **Assess process parent/child relationships**: Investigate the parent process ID of the executing process that loaded "mfdetours.dll." Consider if the parent process is a well-known application (like mftrace.exe) or if it appears suspicious or anomalous.

  - **Identify common legitimate uses**: Confirm if "mfdetours.dll" is being loaded as part of normal operations by typical applications or tools that support debugging or tracing, such as Microsoft tools. Document expected behavior to differentiate it from potential exploitation attempts.

  - **Examine for malicious indicators**: Look for high-confidence indicators such as unusual network connections associated with the loading process (anomaly detection in Security Event ID 5156 for Windows Filtering Platform) that could suggest exfiltration or command and control activity.

  ### Prioritization

  The alert has a medium severity due to the potential impact on critical systems if the sideloading is indeed malicious. The likelihood of exploitation is moderate, as the behavior is not highly common but represents a known technique for privilege escalation and persistence used by adversaries.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the absence of proper logging configurations, such as failure to capture detailed Image Load events. Legitimate applications, particularly those related to development or testing, may trigger this alert during normal operations. A companion detection to consider is monitoring for execution anomalies of other DLLs or processes using similar sideloading techniques (e.g., with Event ID 4688 for process creation anomalies).

