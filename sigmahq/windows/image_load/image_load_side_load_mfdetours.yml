title: Potential Mfdetours.DLL Sideloading
id: d2605a99-2218-4894-8fd3-2afb7946514d
status: test
description: Detects potential DLL sideloading of "mfdetours.dll". While using 
  "mftrace.exe" it can be abused to attach to an arbitrary process and force 
  load any DLL named "mfdetours.dll" from the current directory of execution.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-03
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\mfdetours.dll'
  filter_main_legit_path:
    ImageLoaded|contains: ':\Program Files (x86)\Windows Kits\10\bin\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This rule detects the sideloading of the "mfdetours.dll" file, which can be maliciously loaded into a process using the legitimate "mftrace.exe" tool. The likely objective is for an attacker to gain persistence by executing arbitrary code within the context of a targeted process, leveraging DLL sideloading techniques. This behavior falls under the MITRE ATT&CK tactic "Persistence" (TA0003) and the technique "DLL Search Order Hijacking" (T1574.001).

  The primary telemetry source is Windows image load events that indicate when a DLL is loaded into memory. Specifically, this detection requires logs related to DLL loads, typically found in Event ID 4226 from the Windows Security logs or Sysmon Event ID 7 for image loads. If the detection is confirmed malicious, it may lead to significant unauthorized access or control over targeted systems. It is important to note that this detection does NOT confirm that the DLL is malicious on its own, as it may relate to benign activity in controlled environments.

  ### Investigation Steps

  - **Review the process that loaded mfdetours.dll**: Check Event ID 4688 (process creation) for the parent process that initiated loading mfdetours.dll. Look for unusual processes (e.g., those not found in system directories) that are children of legitimate executables like mftrace.exe.

  - **Validate the execution context**: Identify the command line parameters of the process that executed mftrace.exe via Event ID 4688. Legitimate usage often runs from 'C:\Program Files (x86)\Windows Kits\10\bin\.' Check for any mismatched paths that could indicate manipulation.

  - **Check DLL load paths**: Investigate Sysmon Event ID 7 for the image load entry of mfdetours.dll. Confirm that it originates from a known safe directory (e.g., 'C:\Program Files (x86)\Windows Kits\10\bin\'). Any load originating from a non-standard directory may indicate malicious activity.

  - **Cross-reference system integrity**: Look for any signs of modification to process permissions or attributes using Sysmon Event ID 10 (ProcessAccess) for processes related to mftrace.exe. Legitimate activity typically follows known workflows for analysis purposes.

  - **Identify high-confidence malicious indicators**: Note the hash of the mfdetours.dll used. A hash that does not match known-signed versions or has a low reputation score in threat intelligence feeds may indicate an attempt to execute unauthorized code.

  ### Prioritization

  This alert has a medium severity due to the potential impact on systems where this behavior is observed, particularly if it is happening in sensitive environments. The likelihood of malicious abuse is moderate, as DLL sideloading techniques are known to be weaponized in legitimate-looking contexts.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as using legitimate tools with altered configurations or loading DLLs from trusted directories. Reliable detection requires that image load events are properly configured and logged. Be aware that legitimate application debugging or monitoring activities may also trigger this alert, particularly in development environments. A related detection for monitoring abnormal file execution patterns from mftrace.exe may enhance coverage against these tactics.

