title: Potential Wazuh Security Platform DLL Sideloading
id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
status: test
description: Detects potential DLL side loading of DLLs that are part of the 
  Wazuh security platform
references:
- https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
author: X__Junior (Nextron Systems)
date: 2023-03-13
modified: 2023-05-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\libwazuhshared.dll'
    - '\libwinpthread-1.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_mingw64:
        # Note: Many third party apps installed in "AppData" or "ProgramData" and leverage "mingw64" make use of "libwinpthread-1.dll"
        # In production its best to make a list of these apps and replace this filter with a specific one.
    ImageLoaded|contains:
    - '\AppData\Local\'
    - '\ProgramData\'
    ImageLoaded|endswith: '\mingw64\bin\libwinpthread-1.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Many legitimate applications leverage this DLL. (Visual Studio, JetBrains, 
  Ruby, Anaconda, GithubDesktop, etc.)
level: medium
note: |
  ### Technical Context

  This rule detects the loading of specific dynamic link libraries (DLLs) associated with the Wazuh security platform, which could indicate potential DLL sideloading attacks. Attackers may exploit this behavior to execute malicious code under the guise of legitimate software, achieving persistence, privilege escalation, or stealthy execution. This activity aligns with the MITRE ATT&CK tactic for Persistence and Privilege Escalation, specifically technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources include Windows Image Load events, specifically watching for DLL files loaded from unexpected locations, such as user profile paths or temporary directories rather than standard installation paths. If this activity is malicious, it can lead to unauthorized system access and data breaches. However, it is crucial to note that this detection alone does not prove malicious intent; benign applications may also load these DLLs.

  ### Investigation Steps

  - **Identify image load events:** Review Windows Event ID 4688 (Process Creation) logs to find processes loading `libwazuhshared.dll` or `libwinpthread-1.dll`. Check for abnormal parent-child process relationships.

  - **Examine file paths:** Verify that the path of the loaded DLL is within `C:\Program Files\` or `C:\Program Files (x86)\`. Flag instances where these DLLs are loaded from `AppData\Local\` or `ProgramData\`, as these are indicative of potential sideloading.

  - **Assess process legitimacy:** Check the processes utilizing these DLLs. Review process command lines for signs of legitimate software versus potentially malicious ones (e.g., commands related to known development environments like Visual Studio).

  - **Investigate executable signatures:** For processes detected using `libwazuhshared.dll`, evaluate the digital signatures, creation timestamps, and origin of the executables to confirm they originate from expected vendors.

  - **Monitor asset criticality:** Identify the impacted host's role within the organization (e.g., server, developer machine). Higher criticality systems warrant immediate escalation and deeper forensic analysis.

  - **Validate expected behavior:** For legitimate applications that load these DLLs, confirm this is consistent with previous activity in your environment. Cross-reference with known operational baselines.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on privileged systems. The likelihood of exploitation exists, especially if the system is critical for operations. DLL sideloading is a known technique leveraged by adversaries, making it vital to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that commonly use the targeted DLLs; this could lead to false positives. It is crucial to ensure that the log sources for Windows Image Load events are comprehensively integrated for reliable detection. Additionally, benign activities, such as software updates or legitimate application behavior, may trigger this rule. A companion detection, such as monitoring for anomalous network connections from processes loading these DLLs, would enhance overall coverage against potential threats.

