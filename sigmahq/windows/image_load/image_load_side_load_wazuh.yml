title: Potential Wazuh Security Platform DLL Sideloading
id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
status: test
description: Detects potential DLL side loading of DLLs that are part of the 
  Wazuh security platform
references:
- https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
author: X__Junior (Nextron Systems)
date: 2023-03-13
modified: 2023-05-12
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\libwazuhshared.dll'
    - '\libwinpthread-1.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_mingw64:
        # Note: Many third party apps installed in "AppData" or "ProgramData" and leverage "mingw64" make use of "libwinpthread-1.dll"
        # In production its best to make a list of these apps and replace this filter with a specific one.
    ImageLoaded|contains:
    - '\AppData\Local\'
    - '\ProgramData\'
    ImageLoaded|endswith: '\mingw64\bin\libwinpthread-1.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Many legitimate applications leverage this DLL. (Visual Studio, JetBrains, 
  Ruby, Anaconda, GithubDesktop, etc.)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of the Wazuh security platform DLLs (`libwazuhshared.dll` and `libwinpthread-1.dll`). The likely objective of an attacker using DLL sideloading is to execute a malicious payload while posing as a legitimate process, enabling them to bypass security mechanisms. This behavior fits within the MITRE ATT&CK framework's "Defense Evasion" tactic (TA0060) and "DLL Search Order Hijacking" technique (T1574.001).

  The primary telemetry source is Windows image load events that indicate when a DLL is loaded by a process. The security impact of a successful DLL sideload can be severe, potentially leading to unauthorized access, data exfiltration, or system compromise. It’s crucial to note that detections of these DLLs do not confirm malicious activity on their own due to the prevalence of legitimate applications that use these libraries.

  ---

  ### Investigation Steps

  - **Review the loading process: ** Check the process initiating the DLL load using Security Event ID 4688 or Sysmon Event ID 1 for details such as process name and command line arguments. Identify if the parent process is a known legitimate application or service.

  - **Analyze the DLL path: ** Confirm if the `libwazuhshared.dll` and `libwinpthread-1.dll` are sourced from unusual locations. Legitimate instances should typically reside in `C:\Program Files\` or `C:\Program Files (x86)\`.

  - **Identify high-risk indicators:** Cross-reference the loaded DLL paths against a list of known malicious samples that target the Wazuh platform. Any loading from `C:\Users\<User>\AppData\Local\` or `C:\ProgramData\` should be scrutinized for abnormal behavior.

  - **Compare with expected behavior:** Investigate the use of `libwinpthread-1.dll` in context with legitimate applications like Visual Studio or GitHub Desktop. Document the applications installed on the host to benchmark typical usage patterns and usages of these DLLs.

  - **Check for persistence mechanisms:** Look for any registry modifications (using Event ID 4657) that may indicate attempts to maintain persistence through the DLL loading mechanism.

  - **Conduct a file integrity check:** Validate the integrity of the loaded DLL files to detect any unauthorized modifications or replacements potentially indicative of compromise.

  ---

  ### Prioritization

  This alert should be treated with medium urgency. While it involves the loading of potentially malicious DLLs, their presence does not always indicate exploitation, particularly on systems with extensive development tools. However, given the growing sophistication of DLL sideloading techniques, the alert warrants thorough investigation to preempt malicious use.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of whitelisted applications that legitimately load these DLLs, which could mask malicious activity. A requirement for reliable detection includes accurate logging from image load events (such as Sysmon). Legitimate activities, such as development environments utilizing these libraries, can trigger the alert. Companion detections like unauthorized process executions leveraging `CreateRemoteThread` (T1055) can provide additional context to bolster the investigation and analysis, helping confirm or dispel suspicions of malicious intent.

