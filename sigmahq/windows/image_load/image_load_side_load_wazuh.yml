title: Potential Wazuh Security Platform DLL Sideloading
id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
status: test
description: Detects potential DLL side loading of DLLs that are part of the Wazuh
  security platform
references:
- https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
author: X__Junior (Nextron Systems)
date: 2023-03-13
modified: 2023-05-12
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\libwazuhshared.dll'
    - '\libwinpthread-1.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_mingw64:
        # Note: Many third party apps installed in "AppData" or "ProgramData" and leverage "mingw64" make use of "libwinpthread-1.dll"
        # In production its best to make a list of these apps and replace this filter with a specific one.
    ImageLoaded|contains:
    - '\AppData\Local\'
    - '\ProgramData\'
    ImageLoaded|endswith: '\mingw64\bin\libwinpthread-1.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Many legitimate applications leverage this DLL. (Visual Studio, JetBrains, Ruby,
  Anaconda, GithubDesktop, etc.)
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the potential DLL sideloading associated with the Wazuh security platform, specifically targeting the loading of `libwazuhshared.dll` and `libwinpthread-1.dll` from locations that are unusual for these files. DLL sideloading is a method where a legitimate DLL is loaded by an executable, but the DLL itself is not located in a trusted directory, often indicating an attempt to execute malicious code disguised as legitimate behavior. The likely attacker objective includes maintaining persistence and privilege escalation within the system, employing techniques identified in MITRE ATT&CK under Tactic: Defense Evasion, Technique: DLL Side-Loading (T1574.001).

  Primary telemetry sources include Windows Image Load events, specifically the `ImageLoaded` event, which details when a DLL is loaded. The potential security impact of a successful DLL sideloading attack is severe, as it could allow an attacker to run arbitrary code with the privileges of the legitimate process. It is essential to highlight that detection of this activity does NOT by itself confirm malicious intent or compromise; it merely identifies an anomaly in the loading path of targeted DLLs.

  ---

  ### Investigation Steps

  - **Review the source of the DLLs:** Check logs for loading of `libwazuhshared.dll` and `libwinpthread-1.dll` under expected paths. Legitimate applications typically load these DLLs from `C:\Program Files\` or `C:\Program Files (x86)\`. If they have loaded from `AppData` or `ProgramData`, further scrutiny is needed.

  - **Validate process origins:** Utilize Event ID 4688 (Process Creation) to identify the originating process of the DLL loading event. Look for executables that are not recognized or are known to be associated with packing or obfuscation.

  - **Examine parent-child relationships:** Use Sysmon Event ID process creation logs to see the parent PID of the process that attempted to load `libwazuhshared.dll`. An uncommon parent process, particularly if it's a known system process, could indicate malicious activity.

  - **Identify known benign applications:** Cross-reference the applications triggering this rule against a whitelist of commonly used legitimate applications (e.g. Visual Studio, JetBrains) that utilize `libwinpthread-1.dll`. If the application is atypical for your environment, flag for further analysis.

  - **Assess file creation or modification artifacts:** Verify any recent changes to the filesystem where the libraries reside. Check Event ID 4663 (File Access) and use file integrity monitoring to determine if the files were recently modified or created in non-standard locations.

  - **Perform threat intelligence checks:** Investigate the behavior using threat intelligence resources to understand if there have been previous reports of similar DLL sideloading instances related to recent vulnerabilities or exploits within the Wazuh platform.

  ---

  ### Prioritization

  The alert warrants medium severity due to the potential for privilege escalation and code execution through DLL sideloading, which is a commonly weaponized technique. The likelihood of malicious usage is moderate, particularly if discrepancies are found in the loading path or parent process of the detected DLLs. The impact on a compromised system could be considerable, making timely investigation imperative.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by legitimate applications that commonly utilize `libwinpthread-1.dll`, leading to possible false positives. Reliable detection also requires consistent logging from Windows Image Load events alongside proper configurations for Sysmon. Certain legitimate applications located in user directories can trigger this alert, complicating the investigation. A companion detection method, such as monitoring unusual process launch patterns or script execution behaviors, can enhance coverage and help reduce false positives.

