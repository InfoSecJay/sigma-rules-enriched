title: Potential Wazuh Security Platform DLL Sideloading
id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
status: test
description: Detects potential DLL side loading of DLLs that are part of the Wazuh
  security platform
references:
- https://www.trendmicro.com/en_us/research/23/c/iron-tiger-sysupdate-adds-linux-targeting.html
author: X__Junior (Nextron Systems)
date: 2023-03-13
modified: 2023-05-12
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
    - '\libwazuhshared.dll'
    - '\libwinpthread-1.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_optional_mingw64:
        # Note: Many third party apps installed in "AppData" or "ProgramData" and leverage "mingw64" make use of "libwinpthread-1.dll"
        # In production its best to make a list of these apps and replace this filter with a specific one.
    ImageLoaded|contains:
    - '\AppData\Local\'
    - '\ProgramData\'
    ImageLoaded|endswith: '\mingw64\bin\libwinpthread-1.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Many legitimate applications leverage this DLL. (Visual Studio, JetBrains, Ruby,
  Anaconda, GithubDesktop, etc.)
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL side loading related to the Wazuh security platform, specifically looking for instances where the `libwazuhshared.dll` or `libwinpthread-1.dll` libraries are loaded under suspicious circumstances. DLL side loading is a technique frequently employed by attackers to exploit trusted applications or services, injecting malicious code into a legitimate process. In this scenario, an attacker might seek to leverage Wazuh's components to remotely control systems, exfiltrate data, or maintain persistence on compromised machines.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Persistence** (T1574.001). By loading a malicious DLL adjacent to a legitimate one, adversaries can bypass security measures, leading to further privilege escalation if the application runs with elevated rights. Primary data sources for this detection include **Windows Image Load logs**, which track DLL loading events, and can provide insight into the context in which these components are executed.

  ### Investigation Steps
  - **Review Loaded DLLs:** Analyze the list of loaded DLLs on the affected system. Look specifically for `libwazuhshared.dll` or `libwinpthread-1.dll` loaded from suspicious paths, especially those not typical for legitimate applications.

  - **Check Installation Paths:** Investigate the installation directories of the applications utilizing these DLLs. Verify if the paths conform to standard installation practices to identify any abnormal locations.

  - **Correlate with User Activity:** Examine user activity logs around the time these DLLs were loaded. Look for any unusual access patterns or high-risk actions that could indicate malicious intent.

  - **Monitor for Related Processes:** Identify processes that spawned the suspicious DLL loads. Cross-reference their behavior against known baselines for legitimate application use and other endpoint activity.

  ### Prioritization
  The severity of this alert is medium, as DLL side loading can indicate sophisticated attacker methodologies that may lead to significant compromise if unaddressed. Given the critical role of Wazuh in security monitoring, such activities pose a notable risk to enterprise environments.

  ### Blind Spots and Assumptions
  This detection logic assumes that logs from the required data sources are being collected and indexed properly; any gaps in logging, especially around DLL loads, could lead to missed detections. Additionally, the rule may produce false positives due to legitimate applications utilizing the same libraries, and analysts must exercise caution in differentiating between benign and malicious activity. Ensuring comprehensive logging configurations and continual updating of whitelisted applications is crucial for reducing false positives and improving overall detection accuracy.

