title: Potential Edputil.DLL Sideloading
id: e4903324-1a10-4ed3-981b-f6fe3be3a2c2
status: test
description: Detects potential DLL sideloading of "edputil.dll"
references:
- https://alternativeto.net/news/2023/5/cybercriminals-use-wordpad-vulnerability-to-spread-qbot-malware/
author: X__Junior (Nextron Systems)
date: 2023-06-09
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\edputil.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the potential sideloading of the "edputil.dll" file, a tactic commonly associated with malware deployment and persistence mechanisms. The detection focuses on instances where this DLL is loaded from unusual locations, which may indicate an attempt to exploit the vulnerability within applications like WordPad to execute malicious payloads, such as QBot malware. The typical objectives of attackers employing this technique include maintaining access to compromised systems, evading defenses, and ultimately achieving privilege escalation.

  Relevant MITRE ATT&CK tactics include **Persistence (TA0003)**, through the technique of **DLL sideloading (T1574.001)**, which enables attackers to execute arbitrary code by loading malicious DLLs during legitimate application execution. The technique is also linked to **Defense Evasion (TA0005)**, as the use of trusted applications for executing malware can help avoid detection by security tools. The primary data source for this detection is Windows image load events, which provide details about DLLs loaded into process memory, offering insight into potentially suspicious behavior.

  ### Investigation Steps
  - **Review Image Load Logs**: Analyze Windows image load logs for instances of "edputil.dll" being loaded from non-standard directories. Look for patterns that deviate from typical operations.
  - **Check Parent Process Context**: Investigate the parent processes that are spawning the requests to load "edputil.dll." This can reveal whether benign applications are being manipulated or if suspicious processes are involved.
  - **Correlate with Other Artifacts**: Cross-reference findings with other logs such as EDR or firewall logs to identify any related network activity that might indicate command and control communication or data exfiltration attempts.
  - **Assess Host and User Behavior**: Evaluate the behavior of the account associated with the DLL load event. Look for other anomalous activities such as privilege escalation attempts or unusual access patterns within the environment.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact of successful DLL sideloading, which can lead to persistent malware presence and significant compromise of enterprise systems. The likelihood of occurrence is also elevated given the prevalence of malware leveraging similar techniques to evade detection.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for instances where similar DLL sideloading occurs with other names or from different paths. The detection logic assumes that all relevant DLL loading events will be captured in the Windows image load logs. To function correctly, the environment must be configured to capture detailed image loading events, and any monitoring solutions must fully support and analyze these logs to detect manipulation effectively.

