detection:
  selection:
    ImageLoaded|endswith: '\edputil.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential DLL sideloading of "edputil.dll," primarily indicating a technique that may allow attackers to execute malicious code under the guise of legitimate processes. The objective of this behavior typically aligns with persistence through stealthy execution of malware while masquerading as trusted system libraries. This aligns with the MITRE ATT&CK tactics of **Persistence (T1547)** and **Defense Evasion (T1574.001)**.

  The primary telemetry source for this detection is Windows image load events, specifically monitoring logs that track DLL loading activity. The log types to focus on include Windows Event Logs related to image load (Event ID 4688) or Sysmon Event ID 7, which captures image loads in detail. If malicious, this behavior could enable the installation and execution of persistent malware components. Importantly, this rule does NOT confirm malicious activity on its own; it simply indicates suspicious DLL loading that warrants further investigation.

  ### Investigation Steps

  - **Check image load details:** Review Sysmon Event ID 7 for detailed image load logs. Look for entries where `ImageLoaded` ends with `\edputil.dll` and verify the parent process context to determine if it’s tied to unusual activities, such as non-standard software invoking it.

  - **Identify source of the DLL:** Investigate the loading path of `edputil.dll`. Confirm it is not residing in an unexpected directory, outside of `C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`. Legitimate DLLs should only load from these directories; any deviations raise red flags.

  - **Cross-reference with existing threat intelligence:** Use threat intelligence to correlate findings of `edputil.dll` with known indicators of compromise (IoCs) or recent malware campaigns, particularly associated with Qbot malware as mentioned in related references.

  - **Evaluate legitimate usage patterns:** Identify common applications or services that typically utilize `edputil.dll` during their operation. If observed with high-frequency legitimate processes (e.g., WordPad) and under normal operating conditions without anomalies, the likelihood of benign activity increases.

  - **Monitor for high-confidence malicious indicators:** Look for anomalous behavior where processes invoking `edputil.dll` also exhibit unusual command-line arguments or spawn child processes that do not adhere to established business operations, potentially indicating malicious intent.

  - **Validate system integrity:** Assess for file creation or modification timestamps related to `edputil.dll`. Investigate for any recent alterations in DLL files or associated executables that could indicate an attempt to weaponize the file.

  ### Prioritization

  This alert should be classified as high severity due to the potential for sensitive system compromise. The loading of suspicious DLLs is a common technique leveraged by threat actors for exploitation and persistence. Given that the behavior can be indicative of sophisticated attacks, including APT tactics, rapid analysis is crucial.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion through legitimate processes using `edputil.dll` for benign purposes. Log sources must be correctly configured to capture Sysmon image loading events adequately. Be aware that legitimate software installations or updates might trigger this alert if they include `edputil.dll`. A companion detection that could enhance coverage is monitoring for modifications to Windows registry keys related to DLL loading and application execution policies, which may indicate an ongoing attempt to manipulate system behavior.

