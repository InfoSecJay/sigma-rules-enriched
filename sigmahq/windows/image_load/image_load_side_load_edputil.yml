logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: '\edputil.dll'
  filter_main_generic:
    ImageLoaded|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This detection identifies potential DLL sideloading related to the "edputil.dll" file, commonly associated with malware distribution, specifically in the context of Qbot malware. The likely attacker objective is to maintain persistence, escalate privileges, and execute malicious payloads by exploiting Windows vulnerabilities in legitimate processes. This behavior fits under the MITRE ATT&CK technique for DLL sideloading (T1574.001).

  The primary telemetry source is Windows Image Load events, specifically focusing on the loading of DLLs. If this behavior is malicious, the impact may include unauthorized access, data exfiltration, and further compromise of the system. This detection does NOT confirm that the activity is indeed malicious on its own; it merely indicates the potential for malicious behavior that requires further investigation.

  ### Investigation Steps

  - **Review Image Load events (Event ID 46523)**: Examine Windows Security logs for Event ID 46523, confirming whether "C:\Windows\System32\edputil.dll" or similar paths are present in the ImageLoaded field. Compare loaded images with legitimate instances of "edputil.dll" from trusted sources.

  - **Investigate parent process behavior**: Check the Process ID of the parent process using Sysmon Event ID 1. Validate if the parent process (e.g., "wordpad.exe") is launching the DLL. Legitimate Wordpad usage should not involve unexpected administrative tasks or write operations to the System32 directory.

  - **Analyze file creation/modification**: Look for alterations in the DLL file properties using Sysmon Event ID 5 (FileCreate). The legitimate "edputil.dll" should have a creation date consistent with known updates or the OS installation date. Unusual creation times may indicate tampering.

  - **Correlate with network activity**: Use network logs (e.g., Firewall logs, DNS queries) to identify any outbound connections initiated by the parent process during or after DLL loading. Malicious activity may include connections to suspicious or known malicious domains.

  - **Check for multiple instances of DLL sideloading**: Review whether there are multiple instances of similar sideloading attempts across the environment. Consistency in patterns may indicate a widespread compromise and necessitate a higher priority for remediation.

  ### Prioritization

  This alert has a high severity level due to its association with privilege escalation and malware distribution techniques. The likelihood of malicious abuse is substantial, especially given the context of recent campaigns leveraging the vulnerability, making this behavior a recognized tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that do not log image load events or lack proper configurations for Sysmon. Legitimate applications, especially lesser-known third-party software, may trigger similar alerts through normal operation. A companion detection could involve monitoring for unusual process creation patterns linked to legitimate software, enhancing overall coverage against potential threats.

