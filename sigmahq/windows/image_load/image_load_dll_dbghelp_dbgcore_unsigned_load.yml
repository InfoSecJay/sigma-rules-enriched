note: |
  ### Technical Context

  This Sigma rule detects the loading of unsigned `dbghelp.dll` or `dbgcore.dll` libraries by processes, indicating potential misuse of these libraries commonly used for creating memory dumps. Attackers may leverage the `MiniDumpWriteDump` API functions from these DLLs to extract credentials or sensitive information from processes like `lsass.exe`. The relevant MITRE ATT&CK technique for this behavior is Credential Dumping (T1003.001).

  Primary telemetry sources include Windows Event ID 4697, which logs service creation or changes, and Sysmon Event ID 7, which captures the image load activity. If the behavior is malicious, it can lead to significant security impacts such as credential theft or privilege escalation. However, this detection does not confirm malicious intent on its own; further analysis is required to establish context and intent.

  ### Investigation Steps

  - **Check process parentage:** Review the process tree for any parent processes associated with the loading of `dbghelp.dll` or `dbgcore.dll`. Use Sysmon Event ID 1 to find the parent process ID (PPID) and verify if it is a known suspicious tool (e.g., ProcessHacker).

  - **Identify high-confidence malicious indicators:** Search for Sysmon Event ID 7 logs containing the image load with the following criteria: "ImageLoaded" ends with `dbghelp.dll` or `dbgcore.dll` AND "Signed" is `false`. Flag these instances for potential malicious activity.

  - **Review legitimate usage context:** Look for typical Windows applications (e.g., built-in crash handlers) that may be using the same DLLs legitimately. The presence of `dbghelp.dll` during ordinary application crashes (e.g., application execution failures) could be considered benign.

  - **Correlate with network activity:** If the process under investigation is associated with suspicious outbound connections (e.g., DNS queries to known malicious domains), this increases suspicion. Analyze relevant logs such as Windows Firewall or proxy logs for outbound communication.

  - **Examine file artifact creation:** Verify if there are any MiniDump files generated in temp directories (`C:\Users\<username>\AppData\Local\Temp`) within a short interval post DLL loading. Look for files with extensions like `.dmp` associated with the identified process.

  ### Prioritization

  The alert severity is high due to the potential impact on credential theft or data exfiltration, particularly if it occurs on critical systems like domain controllers or servers with sensitive information. The techniques leveraged in this detection are actively weaponized in modern attacks, increasing the urgency for a thorough investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate applications using these DLLs, which can lead to false positives. Additionally, if logging for Sysmon or Security Event IDs is not properly configured, legitimate activity may go undetected. Other benign scenarios include application debugging sessions where these libraries are legitimately invoked. Related detection to consider is monitoring for unusual process execution patterns involving known memory analysis tools to strengthen coverage against credential dumping activities.

