note: |
  ### Technical Context
  This detection rule identifies when suspicious processes load the `dbghelp.dll` or `dbgcore.dll` files, which are typically associated with memory dump operations. Attackers may exploit these libraries to extract sensitive information from processes like `Lsass.exe`, which can lead to credential theft and further compromise of the target environment. The use of unsigned versions of these DLLs is particularly concerning, as it suggests malicious intent, given that legitimate applications would typically leverage signed versions.

  The relevant MITRE ATT&CK tactics for this detection are **Credential Access** (TA0006) and the technique of **Credential Dumping** (T1003.001), which covers various methods, including the use of memory dump APIs to extract sensitive data. This behavior can facilitate attacker objectives such as gaining unauthorized access to systems, escalating privileges, or exfiltrating credentials.

  The primary data source for this detection is **Windows image load logs**, which can capture details about the loading of DLLs, including their signed status and the parent process that initiated the load.

  ### Investigation Steps
  - **Review Image Load Logs**: Collect and analyze logs related to image loading events, specifically looking for entries that indicate the loading of `dbghelp.dll` or `dbgcore.dll` by processes associated with suspicious activity or that appear unusual based on their context.

  - **Examine Process Trees**: Utilize process monitoring tools to retrieve the full execution lineage of any suspicious processes observed loading these DLLs. Assess whether any parent processes have known associations with malicious behavior or have low reputations.

  - **Investigate Memory Dumps**: If feasible, check if any memory dumps were created in the timeframe of the observed DLL load events. This can provide critical insights into whether the attacker's objectives were realized, such as sensitive credential extraction.

  - **Cross-Reference Threat Intelligence**: Compare the identified processes and DLL loads against threat intelligence sources for known bad actors or campaigns that utilize similar techniques, such as SilentTrinity or other commonly used C2 frameworks associated with credential dumping.

  ### Prioritization
  The alert should be treated with high priority due to the significant potential impact of successful credential dumping on an enterprise environment. Given the nature of the activity, it indicates an active attempt to gather sensitive information, which could lead to further compromise and data breaches if not addressed promptly.

  ### Blind Spots and Assumptions
  This detection strategy relies on the availability of comprehensive logging for image loads. If these logs are not configured or retained appropriately, the detection will fail. Additionally, the detection may miss signed DLL uses that might be malicious but appear legitimate. Assumptions made include that unauthorized processes will be documented in the image load logs and that analysts will have the necessary context to assess suspicious activities based on the collected data.

