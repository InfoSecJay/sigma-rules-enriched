title: Potential DLL Sideloading Via VMware Xfer
id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
status: test
description: Detects loading of a DLL by the VMware Xfer utility from the non-default
  directory which may be an attempt to sideload arbitrary DLL
references:
- https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
modified: 2023-02-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: '\VMwareXferlogs.exe'
    ImageLoaded|endswith: '\glib-2.0.dll'
  filter:   # VMware might be installed in another path so update the rule accordingly
    ImageLoaded|startswith: 'C:\Program Files\VMware\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential DLL sideloading attempts using the VMware Xfer utility. Specifically, it looks for instances where a DLL (glib-2.0.dll) is loaded from a non-default directory, indicating a possible attempt by an attacker to execute malicious code under the guise of legitimate software. This technique is often employed as part of a larger attack strategy, allowing adversaries to escalate privileges or maintain persistence within a system while evading detection by leveraging trusted applications.

  The primary motivations behind such an attack include the execution of payloads without raising suspicion, evading traditional security measures, and establishing a foothold in the network for subsequent malicious actions. Relevant MITRE ATT&CK tactics/techniques associated with this behavior include **Persistence (TA0003)**, **Privilege Escalation (TA0004)**, and **Defense Evasion (TA0005)**, specifically the technique **DLL Side-Loading (T1574.001)**.

  The best evidence for detecting this behavior can be found in Windows image load events, particularly those related to process creation and the loading of dynamic link libraries (DLLs). These logs can provide insights into which DLLs are being loaded and their corresponding origins.

  ### Investigation Steps
  - **Review Image Load Logs:** Inspect Windows image load logs for instances where `VMwareXferlogs.exe` loaded `glib-2.0.dll` from a non-default directory, indicating potential sideloading activity.
  - **Analyze Process Creation Events:** Examine process creation events around the time of the detection to identify any anomalies or related processes that may suggest a broader attack strategy.
  - **Verify VMware Installation Path:** Ensure that VMware and its components are installed in the expected directories. If they are installed in unconventional paths, investigate the legitimacy of those paths further.
  - **Correlate with Network Activity:** Check for any unusual outbound connections or activity correlating with the execution of VMware Xfer utility in the detected time frame, which may indicate command and control communication or other malicious activity.

  ### Prioritization
  Given the high severity level of this alert, it is critical to prioritize investigations involving DLL sideloading as they potentially indicate advanced persistent threats (APTs) or targeted attacks. The likelihood of successful privilege escalation and persistence through such techniques necessitates a swift response in an enterprise environment.

  ### Blind Spots and Assumptions
  There are some gaps in detection coverage related to the varied installation paths of VMware products that might not be accounted for in the detection logic. The rule assumes that logs from image load events will be properly collected and accessible, and that potential forwardings to network or system logs are configured adequately for correlation efforts. If logging settings are misconfigured or if the utility was executed in a significantly different context, the detection might fail to trigger.

