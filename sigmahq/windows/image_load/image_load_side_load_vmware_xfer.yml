title: Potential DLL Sideloading Via VMware Xfer
id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
status: test
description: Detects loading of a DLL by the VMware Xfer utility from the 
  non-default directory which may be an attempt to sideload arbitrary DLL
references:
- https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
modified: 2023-02-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: '\VMwareXferlogs.exe'
    ImageLoaded|endswith: '\glib-2.0.dll'
  filter:   # VMware might be installed in another path so update the rule accordingly
    ImageLoaded|startswith: 'C:\Program Files\VMware\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of a DLL file (glib-2.0.dll) by the VMware Xfer utility from a non-default directory, which is indicative of potential DLL sideloading activity. Attackers may attempt to use this technique to execute malicious code by leveraging a trusted application (VMware Xfer) to run unauthorized DLLs. This behavior aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) and the technique "Sideloading" (T1574.001).

  The primary telemetry sources for this detection are Windows image load events, specifically focusing on executable images and their associated loaded DLLs. If this activity is malicious, it can lead to unauthorized access and persistence on the system. It is important to note that this detection does NOT confirm that the executed process is malicious without further context; it only raises an alert for further investigation.

  ### Investigation Steps

  - **Identify the process execution:**
    Check Security Event ID 4688 for the execution of VMwareXferlogs.exe. Look for unusual parent processes that may indicate a suspicious launch context.

  - **Examine the loaded DLL:**
    Review Sysmon Event ID 7 for Image loaded where Image loaded: endswith `\glib-2.0.dll`. Verify the file path; it should not originate from outside standard VMware installation paths (e.g., `C:\Program Files\VMware\`).

  - **Assess legitimate VMware usage:**
    Investigate for legitimate use cases of VMware Xfer and related applications in your environment. This includes confirming recent user activities and common application pathways that would involve the expected loading of glib-2.0.dll.

  - **Correlate with other logs:**
    Cross-check this telemetry with Process Monitor logs for file system access involving `.dll` files, particularly any recent modifications or accesses to the directories hosting such files.

  - **Determine previous history:**
    Check for any existing incidents related to unauthorized DLL loading, especially in conjunction with the VMware product suite, using historical log data to identify patterns.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on system integrity and persistence threats associated with DLL sideloading. The use of a legitimate VMware utility for loading potentially malicious DLLs is a known tactic among adversaries and frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by the presence of legitimate administrative operations involving VMware tools, which may raise false positives. Reliable detection requires comprehensive logging of image load events and Sysmon configurations. Additionally, evasion techniques may include altering the executable path or using other legitimate processes to sideload malicious DLLs. Companion detections include monitoring for unauthorized DLL signatures or process injection methods that may enhance detection of lateral movement or privilege escalation attempts.

