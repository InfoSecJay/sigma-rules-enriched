title: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
id: 8cde342c-ba48-4b74-b615-172c330f2e93
status: test
description: Detects rundll32 loading a renamed comsvcs.dll to dump process 
  memory
references:
- https://twitter.com/sbousseaden/status/1555200155351228419
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
modified: 2023-02-17
tags:
- attack.credential-access
- attack.defense-evasion
- attack.t1003.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    Hashes|contains:
            # Add more hashes for other windows versions
    - IMPHASH=eed93054cb555f3de70eaa9787f32ebb         # Windows 11 21H2 x64
    - IMPHASH=5e0dbdec1fce52daae251a110b4f309d         # Windows 10 1607
    - IMPHASH=eadbccbb324829acb5f2bbe87e5549a8         # Windows 10 1809
    - IMPHASH=407ca0f7b523319d758a40d7c0193699         # Windows 10 2004 x64
    - IMPHASH=281d618f4e6271e527e6386ea6f748de         # Windows 10 2004 x86
  filter:
    ImageLoaded|endswith: '\comsvcs.dll'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This detection identifies instances where `rundll32.exe` has been invoked with a renamed version of the `comsvcs.dll` file, typically associated with non-standard behavior that indicates an attempt to dump process memory. Attackers use this method to gather sensitive information and execute code in a way that avoids detection by traditional security measures. The likely attacker objective is to carry out credential access or establish persistence.

  This behavior aligns with the MITRE ATT&CK technique for Credential Dumping, specifically T1003.001. The primary telemetry sources for this detection include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) and image load events that capture application activity. Should this behavior be malicious, it poses a significant security risk, potentially allowing attackers to extract sensitive data. Importantly, this detection does NOT confirm malicious intent on its own; further investigative steps are required to determine the context and legitimacy of the activity.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 (or Sysmon Event ID 1) to identify the command line arguments passed to `rundll32.exe`. Look for any abnormal or unusual parameters that may indicate malicious intent.

  - **Verify DLL file integrity**: Cross-reference the `comsvcs.dll` file loaded with known good hashes. Look for any matches against the provided IMPHASH values. Legitimate versions of `comsvcs.dll` should match these hashes.

  - **Analyze parent-child process relationships**: Use Sysmon Event ID 5 to investigate the parent process of `rundll32.exe`. Malicious execution unlikely originates from common legitimate apps (e.g., system processes or trusted software); look for suspicious parent processes like `powershell.exe`.

  - **Investigate recent changes to system files**: Check for recent modifications or renaming of `comsvcs.dll` and other related system files using File System Monitoring logs (i.e., Windows file system events). A creation or modification timestamp preceding the `rundll32.exe` execution may indicate malicious activity.

  - **Correlate event timing with user activity**: Review logs for user login events (Security Event ID 4624) to see if the suspicious activity occurred during known maintenance windows or anomalous times. Legitimate scheduled tasks could produce similar behaviors.

  - **Consider asset criticality**: If the process activity was detected on critical servers (e.g., domain controllers, database servers), prioritize the investigation accordingly, as this setup heightens the risk of credential dumping and system compromise.

  ### Prioritization

  This alert should be considered high-severity due to the potential impact on sensitive data and the ability for attackers to gain elevated privileges. The behavior detected is infrequently observed in normal operations, increasing the likelihood of malicious abuse, particularly in credential dumping attempts.

  ### Blind Spots and Assumptions

  Limitations include that this detection may be evaded by renaming the executing file or using different process executables. Comprehensive logging must be enabled for reliable detection, including all necessary Windows event sources (Sysmon and Security logs). Legitimate updates or misconfigurations could unintentionally trigger this alert. A related detection to complement this coverage could include monitoring for unusual process executions initiated from `powershell.exe`, which often precedes credential dumping attempts.

