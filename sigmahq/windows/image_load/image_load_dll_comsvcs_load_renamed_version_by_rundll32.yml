title: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
id: 8cde342c-ba48-4b74-b615-172c330f2e93
status: test
description: Detects rundll32 loading a renamed comsvcs.dll to dump process memory
references:
- https://twitter.com/sbousseaden/status/1555200155351228419
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
modified: 2023-02-17
tags:
- attack.credential-access
- attack.defense-evasion
- attack.t1003.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    Hashes|contains:
            # Add more hashes for other windows versions
    - IMPHASH=eed93054cb555f3de70eaa9787f32ebb         # Windows 11 21H2 x64
    - IMPHASH=5e0dbdec1fce52daae251a110b4f309d         # Windows 10 1607
    - IMPHASH=eadbccbb324829acb5f2bbe87e5549a8         # Windows 10 1809
    - IMPHASH=407ca0f7b523319d758a40d7c0193699         # Windows 10 2004 x64
    - IMPHASH=281d618f4e6271e527e6386ea6f748de         # Windows 10 2004 x86
  filter:
    ImageLoaded|endswith: '\comsvcs.dll'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the `rundll32.exe` process loads a renamed version of `comsvcs.dll`, a legitimate Windows system file typically used for handling Component Object Model (COM) services. Attackers may abuse this behavior to evade detection while performing malicious actions such as memory dumping or injecting malicious code into other processes. The primary objectives of the attacker could include credential harvesting, lateral movement, or persistence.

  This rule is linked to several relevant tactics and techniques within the MITRE ATT&CK framework, specifically:
  - **Credential Access (TA.credentials-access)**
    - Technique: Credential Dumping (T1003.001)

  To effectively detect this behavior, monitoring of the Windows event logs, particularly the image load logs, is crucial. These logs can provide visibility into unusual interactions with legitimate system binaries like `rundll32.exe` and `comsvcs.dll`, which may indicate malicious activity.

  ### Investigation Steps
  - **Review Image Load Logs:** Analyze the image load logs for instances where `rundll32.exe` has imported a renamed version of `comsvcs.dll`. Pay particular attention to the context in which this action occurs.
  - **Correlate with Process Creation Events:** Cross-reference with process creation logs to determine which process initiated the `rundll32.exe`. Investigate the parent process for any suspicious characteristics or patterns.
  - **Check for Unusual Behavior Post-Execution:** Monitor for unusual or unauthorized activities following the execution of `rundll32.exe` loading `comsvcs.dll`, such as abnormal network connections or attempts to access sensitive data.
  - **Validate Hashes Against Known Good:** Confirm the integrity of the DLL being loaded by verifying its hash against known legitimate hashes of `comsvcs.dll` for the specific Windows versions in use within the environment.

  ### Prioritization
  This alert should be treated as high severity due to the potential for credential dumping and unauthorized access to sensitive information. The likelihood of exploitation via this method within an enterprise environment is significant, making timely response critical.

  ### Blind Spots and Assumptions
  There are several potential gaps in detection coverage, including the possibility that other legitimate system processes may be similarly abused without detection. The detection logic assumes that the renamed `comsvcs.dll` will be loaded via `rundll32.exe`, which may not cover all variations attackers might employ. Additionally, the effectiveness of this alert relies on having complete and uncorrupted image load logs and process creation event records configured correctly, which may not always be the case in every environment.

