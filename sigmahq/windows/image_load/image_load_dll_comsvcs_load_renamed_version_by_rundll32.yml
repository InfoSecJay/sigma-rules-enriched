title: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
id: 8cde342c-ba48-4b74-b615-172c330f2e93
status: test
description: Detects rundll32 loading a renamed comsvcs.dll to dump process 
  memory
references:
- https://twitter.com/sbousseaden/status/1555200155351228419
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
modified: 2023-02-17
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    Hashes|contains:
            # Add more hashes for other windows versions
    - IMPHASH=eed93054cb555f3de70eaa9787f32ebb         # Windows 11 21H2 x64
    - IMPHASH=5e0dbdec1fce52daae251a110b4f309d         # Windows 10 1607
    - IMPHASH=eadbccbb324829acb5f2bbe87e5549a8         # Windows 10 1809
    - IMPHASH=407ca0f7b523319d758a40d7c0193699         # Windows 10 2004 x64
    - IMPHASH=281d618f4e6271e527e6386ea6f748de         # Windows 10 2004 x86
  filter:
    ImageLoaded|endswith: '\comsvcs.dll'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the loading of a renamed version of `comsvcs.dll` by the `rundll32.exe` process. This behavior is characteristic of credential dumping techniques, where attackers attempt to extract sensitive information, such as passwords and tokens, from memory by abusing legitimate system processes. The rule aligns with the MITRE ATT&CK framework under the tactic of Credential Access (TA0006) and the specific technique of Credential Dumping (T1003.001).

  The primary telemetry sources for this detection are Windows event logs related to image loading activities. The key log types include image load events that indicate which DLLs are loaded into memory and by which processes. If the detected activity is malicious, it could lead to significant security impacts, such as unauthorized account access, credential theft, or further lateral movements within the organization. Importantly, this detection does not confirm malicious intent on its own; further investigation is required to substantiate the context and intent behind the activity.

  ### Investigation Steps

  - **Confirm the process identity:** Use Windows Security Event ID 4688 to review the creation of the `rundll32.exe` process. Determine if it was launched in a legitimate context. Legitimate instances typically have command-line arguments associated with system maintenance or configuration.

  - **Check for DLL name integrity:** Validate the `comsvcs.dll` being loaded by examining Sysmon Event ID 7 (Image loaded). Confirm if the hash (IMPHASH) of the DLL matches the known safe versions of `comsvcs.dll`. Any deviation points to potential malicious activity.

  - **Analyze parent-child process relationships:** Cross-reference Event ID 4688 for the parent process that initiated `rundll32.exe`. Look for unusual parent processes such as `powershell.exe` or `cmd.exe`, which can indicate an anomalous execution chain.

  - **Evaluate system impact:** Ascertain the role of the affected system based on asset criticality. Systems used for administrative tasks or housing sensitive data should be scrutinized more closely, as credential dumping here poses higher risks.

  - **Collect memory snapshots:** If justified, utilize forensic tools to capture memory dumps of the affected system to analyze any extracted credentials or running processes, corroborating the behavior with legitimate administrative tasks.

  ### Prioritization

  This alert is high priority due to the potential impact of credential theft in enterprise environments. The likelihood of malicious abuse is high, as this technique is widely used by adversaries to escalate privileges and maintain persistence within compromised networks. Such behaviors are typically weaponized in targeted attacks and should be acted upon promptly.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers using obfuscation or legitimate native tools to avoid triggering this alert. Businesses should ensure that logging for image loads is properly configured and that the relevant event sources are monitored. Legitimate administrative activities, such as software updates or system maintenance by trusted IT personnel, may inadvertently trigger this alert. To enhance detection coverage, monitoring for suspicious command-line arguments related to `rundll32.exe` or other DLL load activities would be beneficial.

