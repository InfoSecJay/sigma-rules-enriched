detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\outlook.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|contains: '\clr.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of the CLR (Common Language Runtime) DLL by specific Office applications (Excel, PowerPoint, Word, etc.), which is not typical behavior for legitimate Office usage. This activity might indicate an attacker’s attempt to run a .NET-based malicious payload or script, facilitating unauthorized execution of code on the victim's machine. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **User Execution: Malicious File** (T1204.002).

  Primary telemetry sources include Windows Image Load events, specifically focused on process creation logs from Office applications (identified by executable names). If this behavior is initiated by an attacker, it has significant security implications, potentially leading to malware execution and system compromise. Notably, this detection does NOT confirm malice on its own; additional context must be gathered to understand the nature of the loaded DLL and the user's operational intent.

  ### Investigation Steps

  - **Examine Image Load Event Logs**: Review Windows event logs for Image Load events (Event ID 4104) that show the loading of `clr.dll` alongside the specific Office application executables. Validate whether the event correlates with unusual activity around the working user’s session.

  - **Identify User Context**: Check the user account executing the Office applications. If the user is a standard employee with no known development environment, this could indicate potentially malicious activity.

  - **Confirm Legitimate Usage**: Determine if the Office applications (Excel, Word, etc.) were being used for common tasks, such as document editing or presentation creation. Legitimate use cases generally do not involve loading CLR DLLs unless explicitly related to development or debugging.

  - **Correlate with Other Security Events**: Look for other suspicious security events around the same timestamps, such as execution of PowerShell scripts or unexpected process creation (Event ID 4688) to build evidence of potential malicious activity.

  - **Assess Parent-Child Process Relationships**: Investigate parent process relationships (using Sysmon Event ID 1) to see if legitimate Office processes launched unexpected child processes that may indicate exploitation or malicious downloads.

  - **Validate Host Environment**: Check the system's context and role. If the affected host is a critical system (e.g., a server hosting sensitive data), prioritize this alert for immediate escalation due to the heightened risk associated with exploitation.

  ### Prioritization

  This alert carries a medium severity level, as the affected systems (Office applications) are common entry points for malicious vectors. The likelihood of abuse is notable, especially within corporate environments where attackers seek to leverage familiar software to execute payloads stealthily. While the behavior can occasionally be benign, the context and potential for weaponization warrant careful investigation.

  ### Blind Spots and Assumptions

  The detection may face limitations from environments with legitimate CLR use, such as development setups where .NET applications are common. Reliance on proper logging configurations for Image Load events is crucial for reliable detection. Legitimate activities, such as certain development or debugging scenarios, may trigger this alert. Companion detections, like monitoring for unusual script execution (e.g., running PowerShell from Office applications), can enhance coverage and provide additional context for investigation.

