detection:
  selection:
    Image|endswith:
    - '\excel.exe'
    - '\mspub.exe'
    - '\outlook.exe'
    - '\onenote.exe'
    - '\onenoteim.exe'         # Just in case
    - '\powerpnt.exe'
    - '\winword.exe'
    ImageLoaded|contains: '\clr.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the loading of the Common Language Runtime (CLR) DLL by Microsoft Office applications such as Excel, Outlook, and Word. Loading CLR DLLs can indicate the presence of potentially harmful executable code being introduced into trusted office environments, as attackers may exploit Office applications to run malicious scripts or software. This behavior is often associated with attacking techniques aimed at executing unauthorized code or gaining persistence via Office Macros or add-ins.

  The likely threat scenario involves an attacker using social engineering to trick victims into opening specially crafted documents that load external code. This tactic could be employed for various malicious intents, including data exfiltration, establishing command and control, or deploying additional payloads within a compromised environment.

  Relevant MITRE ATT&CK techniques include:
  - **Execution - User Execution (T1204.002)**: Using user interaction to execute malicious content embedded in documents.
  - **Execution - Process Injection (T1055)**: In some cases, if the CLR is leveraged for code execution, it could lead to injected processes operating with the privileges of trusted applications.

  Primary data sources include:
  - Image load event logs that capture DLL loading activity in Windows environments, which are critical for identifying when potentially malicious code is executed in trusted applications.

  ### Investigation Steps
  - **Review Image Load Logs**: Examine recent image load events for instances where `clr.dll` was loaded by Microsoft Office applications. Identify the user context and timestamps associated with these events.
  - **Analyze Document Activity**: Investigate document activity and access patterns to determine whether users have engaged with suspicious or unexpected Office documents, focusing on any files that may have triggered `clr.dll` loads.
  - **Correlate with Endpoint Events**: Check endpoint detection and response (EDR) logs for any related execution events or alerts around the same time `clr.dll` was loaded, particularly scrutinizing for unusual process chains or parent-child relationships.
  - **Assess Network Traffic**: If possible, analyze network traffic during the timeframe of the alert to identify any unauthorized external connections or exfiltration attempts that may coincide with the suspicious loading of CLR DLLs.

  ### Prioritization
  The alert is rated medium severity because loading of CLR DLLs in trusted office applications could indicate a precursor to more significant threats, such as malware deployment or data exfiltration. In enterprise environments, the use of Office applications is prevalent, which increases the likelihood of this vector being exploited by attackers.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if image load logging is not enabled or properly configured on endpoints, leading to missed detection of malicious activity. The detection logic assumes that any loading of `clr.dll` in the specified Office applications is suspicious, which may not always be the case, particularly in environments where legitimate applications and plugins are utilized. Ensuring comprehensive logging of application events is essential for the alert to function accurately, and analysts should be aware of the potential for false positives due to legitimate use cases of CLR in Office products.

