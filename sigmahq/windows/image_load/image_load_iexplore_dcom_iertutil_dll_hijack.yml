  ---

  ### Technical Context

  This Sigma rule detects potential DLL hijacking involving the `iertutil.dll` file in the context of the Internet Explorer application (`iexplore.exe`). The rule indicates that an attacker may aim to exploit this hijacking to run malicious code, potentially gaining unauthorized access to the system or executing further attacks through lateral movement or privilege escalation. This behavior fits within the MITRE ATT&CK framework under the techniques: Lateral Movement (T1021) and Remote Services (T1021.002, T1021.003).

  The primary telemetry sources for this detection come from Windows Image Load events, specifically monitoring image creation and loading activities. If the action is malicious, it could lead to significant security incidents such as data exfiltration or unauthorized access. It is important to note that this detection alone does not confirm direct malicious access or activity; further investigation is necessary to establish intent and context.

  ---

  ### Investigation Steps

  - **Review the loaded images for `iexplore.exe`:** Check for Event ID 4688 logs that show the process creation of `iexplore.exe`. Look for unusual parent processes or command-line arguments often associated with malice, such as unexpected arguments or scripts.

  - **Verify the image loading from `iertutil.dll`:** Analyze Event ID 10 logs from Windows Event Viewer under the “Security” category. Examine fields containing the `Image Loaded` values, specifically identifying the presence of local or newly created versions of `iertutil.dll`. Legitimate installations typically utilize default Windows paths.

  - **Assess related COM object registrations:** Explore registry keys associated with DCOM under `HKEY_CLASSES_ROOT\Wow6432Node\AppID` and `HKEY_CLASSES_ROOT\CLSID`. Look for any alterations or additions that deviate from a standard configuration. Legitimate registrations will correspond with Microsoft documentation.

  - **Investigate user context and action:** Identify the user context under which `iexplore.exe` was executed. Look at logs from `C:\Windows\System32\winevt\Logs\Security.evtx` and match to specific user IDs to see if they correlate with known admin or non-admin users.

  - **Check for subsequent network activity:** Review network traffic generated by the promoted instance of `iexplore.exe` to identify any connections to suspicious external IPs or domains. Use firewall or proxy logs to verify data flows, focusing on potential exfiltration endpoints.

  - **Cross-reference with other alerts:** Correlate findings with existing detections for anomalous Windows processes or DCOM exploitation events. Combine insights from similar alerts, like those relating to COM object manipulations or unexpected process startups, to build a comprehensive understanding.

  ---

  ### Prioritization

  This alert is critical due to the potential impact of a successful DLL hijacking on sensitive systems. The likelihood of such exploits being weaponized is high, particularly given known vulnerabilities in older applications like Internet Explorer. Quick response to this kind of behavior is necessary to mitigate risks of lateral movement and data breaches.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not sufficiently configured to capture all image loads or process creations. Evasion techniques could include legitimate DLL replacements or use of alternate processes to achieve similar outcomes. Additionally, legitimate administrative activities, such as software updates, may trigger this alert. It would benefit the environment to have companion detections for abnormal process creations or unusual COM object access patterns to improve overall coverage.

