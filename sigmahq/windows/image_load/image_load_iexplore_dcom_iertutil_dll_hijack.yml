note: |
  ### Technical Context

  This Sigma rule detects potential DLL hijacking attempts involving `iertutil.dll` during the loading of `iexplore.exe`, associated with the DCOM (Distributed Component Object Model) infrastructure of Internet Explorer. The likely objective of an attacker exploiting this vulnerability would be to execute malicious code that masquerades as a legitimate Internet Explorer process to evade detection. This behavior maps to the MITRE ATT&CK tactic of lateral movement (TA0008) and technique T1021.002 (Remote Services: DCOM) and T1021.003 (Remote Services: Windows Management Instrumentation).

  The primary telemetry source is the Windows Event Logs, specifically image load events related to DLL usage. The security impact of a successful DLL hijack could lead to arbitrary code execution, potential data theft, or further system compromise. Importantly, this detection does NOT prove malicious intent solely by itself; it indicates suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Review image load events:** Check Windows Security Event ID 160 from the System or Application log for entries indicating the image `iexplore.exe` is loading `iertutil.dll`. Establish if this correlates to a known good usage pattern.

  - **Identify the command lineage:** Analyze parent process details for `iexplore.exe` via Sysmon Event ID 1 and determine if it's being executed by a suspicious parent process or unusual execution context.

  - **Examine DCOM configurations:** Validate that DCOM permissions are properly configured. Run `dcomcnfg` and ensure Windows settings align with expected configurations for the environment; unusual modifications may indicate a malicious actor's access.

  - **Look for execution anomalies:** Determine the execution path of `iexplore.exe` and investigate for any deviations from standard system paths (C:\Program Files\Internet Explorer\iexplore.exe). Legitimate paths would not typically include user directories or temporary folders.

  - **Correlate with threat intelligence:** Cross-reference activity with known threat intelligence relating to DLL hijacking tactics and techniques. Use threat feeds to identify if the specific DLL loading behavior matches patterns associated with known malware.

  ### Prioritization

  This alert is of critical severity due to the potential impact on sensitive systems, as exploitation can lead to compromised data and system integrity. The likelihood of malicious abuse is high given that DLL hijacking is a well-documented technique frequently leveraged by adversaries for lateral movement.

  ### Blind Spots and Assumptions

  Detection is limited by whether the relevant logging is enabled on the system. Attackers may evade detection by utilizing legitimate DLLs, and benign scenarios, such as normal system updates or application installations, may trigger the alert. Related detections to consider include monitoring for unusual processes spawned by `iexplore.exe`, which can strengthen contextual understanding of the application behavior and support forensic efforts.

