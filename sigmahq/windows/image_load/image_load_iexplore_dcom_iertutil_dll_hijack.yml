note: |
  ### Technical Context
  This detection rule identifies potential attempts by an attacker to execute a DLL hijack involving the "iertutil.dll" file within the DCOM (Distributed Component Object Model) infrastructure of Internet Explorer. In this threat scenario, attackers may exploit this vulnerability to control or manipulate the behavior of Internet Explorer, often with the objective of executing malicious code or gaining unauthorized access to sensitive information. These techniques may be employed during lateral movement in an enterprise environment, where attackers aim to navigate through the network undetected.

  Relevant MITRE ATT&CK tactics include **Lateral Movement** (TA:0040) with specific techniques such as **Remote Services** (T1021) and **Remote DCOM** (T1021.002). This behavior may be associated with well-known threat families that leverage DLL injection techniques to bypass security controls.

  Primary data sources that will provide the most relevant evidence include image load logs from Windows and process creation events that can confirm unusual application behaviors or paths. Analysts should consider the context of Internet Explorer's usage to distinguish legitimate from potentially malicious activities.

  ### Investigation Steps
  - **Review Image Load Events**: Analyze the image load logs for instances of `iexplore.exe` loading `iertutil.dll`. Pay particular attention to the timing and frequency of these events to identify any anomalies.

  - **Examine Process Creation Logs**: Investigate the process creation events for any unexpected execution of `iexplore.exe` around the same time that `iertutil.dll` was loaded. Look for unusual parent processes or command-line arguments.

  - **Correlate with Network Activity**: Identify if there are any associated outbound network connections triggered by Internet Explorer that correspond with the DLL load events. This can reveal potential data exfiltration or command-and-control activity.

  - **Audit System Configuration**: Check system and application configuration settings for Internet Explorer to ensure that no unauthorized or unnecessary DCOM settings are enabled, which may facilitate such attacks.

  ### Prioritization
  This alert is of critical severity due to its implications for lateral movement within the network and the potential for privilege escalation or data compromise. Given that DLL hijacking can provide attackers with the means to run malicious code with escalated privileges, effective and timely response actions are necessary.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the telemetry from image load logs is not consistently captured across all endpoints, as some security configurations may not log such events. The detection logic assumes that the loaded library will always match the expected filename, which may not be true if attackers rename or obfuscate their payloads. Additionally, correct configuration of logging and monitoring for DCOM activities is required to ensure the alerting functionality operates effectively.

