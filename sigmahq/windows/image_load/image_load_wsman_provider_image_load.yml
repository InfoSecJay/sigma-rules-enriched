title: Suspicious WSMAN Provider Image Loads
id: ad1f4bb9-8dfb-4765-adb6-2a7cfb6c0f94
status: test
description: Detects signs of potential use of the WSMAN provider from uncommon 
  processes locally and remote execution.
references:
- https://twitter.com/chadtilbury/status/1275851297770610688
- https://bohops.com/2020/05/12/ws-management-com-another-approach-for-winrm-lateral-movement/
- https://learn.microsoft.com/en-us/windows/win32/winrm/windows-remote-management-architecture
- https://github.com/bohops/WSMan-WinRM
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-06-24
modified: 2025-10-17
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.003
logsource:
  category: image_load
  product: windows
detection:
  request_client:
  - ImageLoaded|endswith:
    - '\WsmSvc.dll'
    - '\WsmAuto.dll'
    - '\Microsoft.WSMan.Management.ni.dll'
  - OriginalFileName:
    - 'WsmSvc.dll'
    - 'WSMANAUTOMATION.DLL'
    - 'Microsoft.WSMan.Management.dll'
  respond_server:
    Image|endswith: '\svchost.exe'
    OriginalFileName: 'WsmWmiPl.dll'
  filter_general:
    Image:
    - 'C:\Program Files (x86)\PowerShell\6\pwsh.exe'
    - 'C:\Program Files (x86)\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\6\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\services.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  filter_svchost:   # not available in Sysmon data, but Aurora logs
    CommandLine|contains:
    - 'svchost.exe -k netsvcs -p -s BITS'
    - 'svchost.exe -k GraphicsPerfSvcGroup -s GraphicsPerfSvc'
    - 'svchost.exe -k NetworkService -p -s Wecsvc'
    - 'svchost.exe -k netsvcs'
  filter_mscorsvw:   # Image: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\mscorsvw.exe
    Image|startswith:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\mscorsvw.exe'
  filter_svr_2019:
    Image:
    - 'C:\Windows\System32\Configure-SMRemoting.exe'
    - 'C:\Windows\System32\ServerManager.exe'
  filter_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
  filter_citrix:
    Image|startswith: 'C:\Program Files\Citrix\'
  filter_upgrade:
    Image|startswith: 'C:\$WINDOWS.~BT\Sources\'
  filter_mmc:
    Image|endswith: '\mmc.exe'
  svchost:
    Image|endswith: '\svchost.exe'
  commandline_null:
    CommandLine:
  condition: ( request_client or respond_server ) and not 1 of filter* and not (
    svchost and commandline_null )
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of specific Windows Management Instrumentation (WMI) provider images, primarily focused on WSMAN-related binaries. This behavior is indicative of potential lateral movement or remote command execution, often associated with adversarial tactics seeking to execute unauthorized commands on target systems. The relevant MITRE ATT&CK tactic is **Execution** (ID: T1072) and the technique is **Command-Line Interface** (ID: T1059.001) as well as **Lateral Movement** (ID: T1021.003).

  The primary telemetry sources include image load events primarily in Windows event logs related to executable file interactions, specifically `Image Loaded` logs for unusual processes. If malicious, this activity could allow an attacker to execute commands or scripts remotely, leading to greater system compromise or exfiltration of sensitive data. Notably, this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also trigger similar alerts.

  ### Investigation Steps

  - **Review event logs for WSMAN binaries: ** Check for Windows Event ID 13 in the Security log or the Sysmon Event ID 10 to identify instances of `WsmSvc.dll`, `WsmAuto.dll`, or `Microsoft.WSMan.Management.ni.dll` being loaded from unexpected parent processes. Benign sources could include expected system management tools but unusual parent processes may imply malicious intent.

  - **Identify the parent process: ** Investigate the `Image` and `OriginalFileName` fields in the Event ID 13 logs to verify the parent process of the WSMAN provider loads. Legitimate loads often come from trusted system services; watch for abuse through common executables such as `powershell.exe`.

  - **Check command-line arguments of svchost.exe: ** Search for any command-line executions of `svchost.exe` tailored for unusual services using Sysmon Event ID 7, especially those with flags like `-k netsvcs` or non-standard service names that might indicate a pivot point for lateral movement.

  - **Correlate with specific host roles: ** Validate if the system in question is a critical asset such as a domain controller or a server with administrative rights; improper usage of WSMAN on these systems raises the risk of account compromise and high data exposure.

  - **Assess WMI event subscriptions: ** Use PowerShell to query for WMI event subscriptions that might interact with WSMAN processes (e.g., `Get-WmiObject -Query "SELECT * FROM __InstanceCreationEvent WHERE TargetInstance ISA 'Win32_Process'"`). Unexpected subscriptions can indicate persistence mechanisms being employed by attackers.

  ### Prioritization

  The alert is of medium severity, as the potential for lateral movement or command execution can lead to significant security incidents if exploited. The likelihood of malicious abuse is present given the irregular usage of WSMAN providers; however, this behavior is occasionally used in legitimate administrative tasks.

  ### Blind Spots and Assumptions

  The detection may have limitations against evasion techniques such as process hollowing or run-time modifications of legitimate binaries. Reliable detection relies on the configuration of Windows event logging and Sysmon setup to capture detailed process data. Legitimate administrative operations, such as management scripts or system updates, may trigger similar alerts. A companion detection that enhances coverage could include monitoring for successful or failed authentication events related to WinRM access (Security Event ID 4625/4624).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
