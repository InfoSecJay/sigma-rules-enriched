title: Suspicious WSMAN Provider Image Loads
id: ad1f4bb9-8dfb-4765-adb6-2a7cfb6c0f94
status: test
description: Detects signs of potential use of the WSMAN provider from uncommon 
  processes locally and remote execution.
references:
- https://twitter.com/chadtilbury/status/1275851297770610688
- https://bohops.com/2020/05/12/ws-management-com-another-approach-for-winrm-lateral-movement/
- https://learn.microsoft.com/en-us/windows/win32/winrm/windows-remote-management-architecture
- https://github.com/bohops/WSMan-WinRM
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-06-24
modified: 2026-07-28
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.003
logsource:
  category: image_load
  product: windows
detection:
  request_client:
  - ImageLoaded|endswith:
    - '\WsmSvc.dll'
    - '\WsmAuto.dll'
    - '\Microsoft.WSMan.Management.ni.dll'
  - OriginalFileName:
    - 'WsmSvc.dll'
    - 'WSMANAUTOMATION.DLL'
    - 'Microsoft.WSMan.Management.dll'
  respond_server:
    Image|endswith: '\svchost.exe'
    OriginalFileName: 'WsmWmiPl.dll'
  filter_general:
    Image:
    - 'C:\Program Files (x86)\PowerShell\6\pwsh.exe'
    - 'C:\Program Files (x86)\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\6\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\services.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  filter_svchost:   # not available in Sysmon data, but Aurora logs
    CommandLine|contains:
    - 'svchost.exe -k netsvcs -p -s BITS'
    - 'svchost.exe -k GraphicsPerfSvcGroup -s GraphicsPerfSvc'
    - 'svchost.exe -k NetworkService -p -s Wecsvc'
    - 'svchost.exe -k netsvcs'
  filter_mscorsvw:   # Image: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\mscorsvw.exe
    Image|startswith:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\mscorsvw.exe'
  filter_gethelp:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.GetHelp_'
    Image|endswith: '\GetHelp.exe'
  filter_svr_2019:
    Image:
    - 'C:\Windows\System32\Configure-SMRemoting.exe'
    - 'C:\Windows\System32\ServerManager.exe'
  filter_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
  filter_citrix:
    Image|startswith: 'C:\Program Files\Citrix\'
  filter_upgrade:
    Image|startswith: 'C:\$WINDOWS.~BT\Sources\'
  filter_mmc:
    Image|endswith: '\mmc.exe'
  svchost:
    Image|endswith: '\svchost.exe'
  commandline_null:
    CommandLine:
  condition: ( request_client or respond_server ) and not 1 of filter* and not (
    svchost and commandline_null )
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious image loads related to Windows Remote Management (WSMAN) components, which may indicate lateral movement attempts via uncommon processes. An attacker may utilize WSMAN for remote execution to gain access to other systems and establish control in a network, facilitating the movement of malware or data exfiltration. The relevant MITRE ATT&CK tactics and techniques are Execution (T1059.001) and Lateral Movement (T1021.003).

  Primary telemetry sources include Windows Image Load events, particularly involving DLLs such as `WsmSvc.dll`, `WsmAuto.dll`, or unusual invocation of `svchost.exe`. If malicious, it can indicate compromised credentials or an unauthorized process running methods commonly involved in lateral movement. However, this detection alone does not confirm malicious activity without further correlation with additional indicators of compromise or context.

  ### Investigation Steps

  - **Identify the process initiating the WSMAN DLL load:** Review Security Event ID 4688 for process creation details that include `WsmSvc.dll` or `WsmAuto.dll`. Look for unusual parent-child process relationships or commands that indicate adversarial behavior.

  - **Examine the command line parameters of any svchost.exe instances:** Check for instances of `svchost.exe` seen with commands such as `-k netsvcs` and ensure they are valid dependencies. Legitimate instances typically show no unusual parameters and are linked to required services.

  - **Confirm the legitimacy of WSMAN activity:** Investigate any recent administrative activities logged via PowerShell (Event ID 4103). Valid use cases include script execution by IT admins for system management or updates, focusing specifically on timestamps.

  - **Analyze network logs for remote access attempts:** Look for connections to or from uncommon IPs or geographic regions that don't correspond to expected administrative activity. This could further indicate lateral movement or exploitation attempts through protocols associated with WSMAN.

  - **Validate any related file creations or modifications:** For more context, correlate file system events (using Sysmon Event ID 11) to see if any unexpected files are created or modified in paths linked to WSMAN, which could indicate exploitation or C2 activity.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system integrity if used maliciously. The nature of the detected behavior often correlates with lateral movement techniques and may be exploited in targeted attacks. However, the likelihood of false positives is present, particularly in environments where WSMAN is leveraged for legitimate administrative operations.

  ### Blind Spots and Assumptions

  Detection may miss cases where attackers utilize unique custom processes to load WSMAN DLLs or employ direct memory injection techniques, circumventing standard image loading detection. Reliable detection necessitates comprehensive logging of Windows Event IDs relevant to both process creation and system events. Legitimate administrative activities that could trigger this rule include routine maintenance operations performed by IT staff. Companion detections concerning PowerShell script executions and unusual network traffic patterns would enhance defensive coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
