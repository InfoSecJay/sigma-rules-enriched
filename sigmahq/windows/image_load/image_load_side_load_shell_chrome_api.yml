note: |
  ### Technical Context

  This rule detects the loading of a non-existent DLL named "ShellChromeAPI.dll" by processes, particularly related to the "DeviceEnroller" binary. This behavior indicates a potential attempt by an attacker to utilize DLL sideloading, where a maliciously crafted DLL is being dropped and executed under the guise of a legitimate process. The likely attacker objective is to maintain persistence or execute arbitrary code while evading detection.

  This detection corresponds to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique DLL Search Order Hijacking (T1574.001). The primary telemetry source for this detection is Windows Image Load events, specifically monitoring for processes attempting to load this malicious DLL. If this activity is malicious, it can lead to further exploitation of the targeted system, unauthorized access, or data compromise. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate applications or misconfigured systems could also attempt to load this DLL under certain circumstances.

  ### Investigation Steps

  - **Check the process initiating the DLL load:** Investigate the parent process of the DLL loading event. Look for Security Event ID 4688 and/or Sysmon Event ID 1 to understand the context of execution and whether it originates from a suspicious or unusual source (e.g., a non-system process).

  - **Review command-line arguments for DeviceEnroller.exe:** Examine the command line used by DeviceEnroller.exe to determine if the "PhoneDeepLink" flag is present. This is a significant indicator of potential malicious activity as it indicates specific intent to load the DLL. Look for fields in Event ID 4688 (New Process Creation) for the presence of this flag.

  - **Identify known benign uses of ShellChromeAPI.dll:** Understand legitimate applications or scenarios that might reference ShellChromeAPI.dll. For intentional benign usage, refer to trusted documentation to differentiate between legitimate and unrecognized activity.

  - **Collect supporting log artifacts for anomalies:** Use Windows Event Logs and Sysmon logs to identify if other suspicious activity correlates with the loading of ShellChromeAPI.dll. Look for additional malicious indicators such as unusual process trees or network activity associated with the DeviceEnroller process.

  - **Verify system integrity and DLL presence:** Confirm that ShellChromeAPI.dll is not present on critical systems. Use file integrity monitoring tools or Windows file system logs to ensure that unauthorized modifications to the system have not occurred.

  - **Check for established persistence mechanisms:** After identifying the suspicious loading of the DLL, monitor for any attempts by the associated process to leverage persistence methods (e.g., scheduled tasks, registry modifications). These can compound the threat posed by the initial event.

  ### Prioritization

  The alert is considered high severity due to the potential impact on critical enterprise systems. The likelihood of malicious abuse is moderate, given that DLL sideloading techniques are commonly weaponized in targeted attacks. Additionally, the involvement of legitimate processes like DeviceEnroller raises the risk of oversight in detection.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include renaming the malicious DLL or using other methods of DLL injection. Effective detection relies on proper logging configurations, including Sysmon for process creation and image load events. Legitimate application behavior, such as misconfigured software processes, may inadvertently trigger this alert. A related detection rule for monitoring unusual process creation (Event ID 4688) can strengthen overall monitoring efforts.

