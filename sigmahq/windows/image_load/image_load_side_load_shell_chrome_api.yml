note: |
  ### Technical Context

  This Sigma rule detects attempts to load a non-existent DLL, "ShellChromeAPI.dll," which is indicative of potential DLL sideloading attacks. The likely attacker objective is to leverage the "DeviceEnroller.exe" binary to execute malicious code disguised as a legitimate DLL. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) and technique DLL Search Order Hijacking (T1574.001). The primary telemetry source is the Windows image load events, particularly those relevant to process and DLL loading. If malicious, this could allow an adversary to maintain persistence or escalate privileges undetected. This detection does NOT confirm malicious intent on its own, as benign processes may improperly reference this DLL.

  ### Investigation Steps

  - **Check Image Load Events:** Review Windows Event ID 4101 logs to identify instances where "ShellChromeAPI.dll" was loaded. Look for process names such as "DeviceEnroller.exe" and validate the file paths.

  - **Identify Legitimate Use Cases:** Cross-reference the loading instances of "ShellChromeAPI.dll" with known legitimate activities of "DeviceEnroller.exe." Legitimate calls typically should not reference this DLL.

  - **Correlate with Malicious Indicators:** Search for related processes (such as "powershell.exe" or "cmd.exe") spawned from "DeviceEnroller.exe" around the same timestamp. High-confidence malicious indicators include command lines with suspicious parameters such as flags tied to DLL modification or use.

  - **Analyze Parent-Child Process Relationships:** Utilize Sysmon (Event ID 1) to investigate the process tree. Ensure that parent processes are legitimate, and note any unintended parentage or suspicious execution flows that lead to "DeviceEnroller.exe."

  - **Check for Suspicious File System Activities:** Look for file creations or modifications related to "ShellChromeAPI.dll" in directories like C:\Windows\System32 or similar privileged locations. Track creation events in Windows Security Event ID 4663.

  ### Prioritization

  This alert is high-severity due to the potential impact on system integrity and the likelihood of malicious abuse via DLL sideloading techniques, which are commonly weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  This detection has limitations as legitimate software behavior might unintentionally trigger the alert, especially in legacy systems. It requires accurate log configurations to capture all relevant image load events effectively. Activities such as software updates or system configurations that involve "DeviceEnroller.exe" may result in false positives. A related detection includes monitoring for the execution of unsigned or unknown DLLs loaded by processes commonly associated with device management operations.

