title: Scheduled Task Executed Uncommon LOLBIN
id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
status: test
description: Detects the execution of Scheduled Tasks where the program being 
  run is located in a suspicious location or where it is an unusual program to 
  be run from a Scheduled Task
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2023-02-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: taskscheduler
  definition: 'Requirements: The "Microsoft-Windows-TaskScheduler/Operational" is
    disabled by default and needs to be enabled in order for this detection to trigger'
detection:
  selection:
    EventID: 129     # Created Task Process
    Path|endswith:
    - '\calc.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\regsvr32.exe'
            # - '\rundll32.exe'
    - '\wscript.exe'
    # filter_system:
    #     Path|endswith: '\rundll32.exe'
    #     TaskName|startswith: '\Microsoft\Windows\'
    # condition: selection and not 1 of filter_*
  condition: selection
falsepositives:
- False positives may occur with some of the selected binaries if you have tasks
  using them (which could be very common in your environment). Exclude all the 
  specific trusted tasks before using this rule
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Scheduled Tasks that run uncommon living-off-the-land binaries (LOLBINs) from suspicious locations. The objective of an attacker may include executing malicious payloads while evading detection, often leveraging trusted system binaries to perform unauthorized actions. This behavior fits into the MITRE ATT&CK framework under the **Execution** tactic (TA0002) and the technique of **Scheduled Task/Job Execution** (T1053.005).

  The primary telemetry source for this detection is the Windows Task Scheduler logs, specifically where Event ID 129 is recorded for task execution. If exploited maliciously, this could lead to unauthorized code execution, privilege escalation, or persistence on the system. This detection does NOT confirm malicious activity on its own, as legitimate tasks may also utilize these binaries from similar paths.

  ### Investigation Steps

  - **Check Task Scheduler for existing tasks:** Review the Windows Task Scheduler (Event ID 4698) to identify legitimate tasks that utilize the detected binaries and their paths. Compare the Task Name against known legitimate tasks to distinguish between benign and suspicious activity.

  - **Examine the execution path:** Confirm the execution path of the detected processes (Event ID 129). Verify if the path is a commonly used one for system operations. Legitimate tasks will typically run from system folders like `C:\Windows\System32`, while suspicious tasks might originate from user directories or temporary folders.

  - **Correlate with system activity:** Review the Windows Event Log for suspicious behavior around the time of execution (e.g., Event IDs 4624 for logon events, Event ID 4688 for new process creation). Identify the user context and whether there were previous failed access attempts by that user.

  - **Investigate associated handles and connections:** Use Sysinternals tools like Process Explorer to check if the detected binaries create unusual network connections or access sensitive files. This could indicate malicious intent.

  - **Review for signs of privilege escalation:** Check local security policy changes (Event ID 4670) or any unauthorized modifications to sensitive files after the task execution. Be wary of common binaries like `calc.exe` and `notepad.exe` being used for more than their intended purpose.

  ### Prioritization

  This alert should be considered medium severity due to the potential for abuse of system binaries that can lead to privilege escalation or unauthorized persistence. The likelihood of malicious use is moderate, especially since LOLBINs are commonly utilized in attack scenarios. Thus, while this behavior may not always indicate an attack, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection relies on the proper configuration of Windows Task Scheduler logs (Microsoft-Windows-TaskScheduler/Operational), which may be disabled by default. Legitimate administrative tasks or system updates may trigger this rule, adding noise. Adversaries may attempt to evade detection by running tasks with usual binaries from known trusted paths. Complement this detection with rules monitoring for abnormal account activity (e.g., Event ID 4740 for account lockouts) to strengthen overall coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
