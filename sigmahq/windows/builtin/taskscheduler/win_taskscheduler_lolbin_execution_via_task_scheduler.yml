title: Scheduled Task Executed Uncommon LOLBIN
id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
status: test
description: Detects the execution of Scheduled Tasks where the program being run
  is located in a suspicious location or where it is an unusual program to be run
  from a Scheduled Task
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2023-02-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: taskscheduler
  definition: 'Requirements: The "Microsoft-Windows-TaskScheduler/Operational" is
    disabled by default and needs to be enabled in order for this detection to trigger'
detection:
  selection:
    EventID: 129     # Created Task Process
    Path|endswith:
    - '\calc.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\regsvr32.exe'
            # - '\rundll32.exe'
    - '\wscript.exe'
    # filter_system:
    #     Path|endswith: '\rundll32.exe'
    #     TaskName|startswith: '\Microsoft\Windows\'
    # condition: selection and not 1 of filter_*
  condition: selection
falsepositives:
- False positives may occur with some of the selected binaries if you have tasks using
  them (which could be very common in your environment). Exclude all the specific
  trusted tasks before using this rule
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where Scheduled Tasks on Windows systems execute processes that are unusual or located in suspicious directories. The focus is on common living-off-the-land binaries (LOLBINs), such as `calc.exe`, `cscript.exe`, `mshta.exe`, and others, which are often leveraged by attackers for various malicious activities. The primary goal of tracking such executions is to uncover potential misuse of these benign tools as part of privilege escalation, execution, or persistence techniques, contributing to an overall compromises of the environment.

  Attackers may use these scheduled tasks to automate malicious scripts or commands, leveraging the inherent trust of legitimate system processes while evading detection. This behavior may signal that an attacker is trying to maintain persistence on the system or prepare for further exploitation. Key MITRE ATT&CK techniques relevant to this detection are "Scheduled Task/Job" (T1053) and "Execution via Scheduled Task" (T1053.005), which facilitate the automation of tasks that could lead to greater control over the system.

  The primary data source for this detection is Windows Task Scheduler logs, specifically from the "Microsoft-Windows-TaskScheduler/Operational" log. This has to be enabled in the system settings for the detection to function correctly. Additionally, process creation events may provide supporting evidence regarding the context of task execution.

  ### Investigation Steps
  - **Review Scheduled Task Logs**: Examine the logs under "Microsoft-Windows-TaskScheduler/Operational" to identify the creation and execution of scheduled tasks involving the identified LOLBINs. Note the task names, execution times, and any associated user accounts.
  - **Correlate with Process Creation Events**: Check Windows Process Creation Event logs to correlate with the detected scheduled task executions. Look for anomalies, such as unusual user accounts executing scheduled tasks or unexpected command-line parameters.
  - **Examine Task Configuration**: Investigate the properties of the scheduled tasks, including triggers, actions, and user context. Assess whether the execution context aligns with legitimate operational practices or if it indicates possible compromise.
  - **Identify False Positives**: Review the environment for legitimate scheduled tasks that utilize the flagged binaries. Document any necessary exclusions based on trusted processes to reduce noise in future alerts.

  ### Prioritization
  The alert is considered medium severity because while the use of these binaries can be legitimate, their execution via scheduled tasks often indicates a potential attempt to secure persistence or perform malicious actions. Rapid investigation is essential to mitigate risks associated with potential account compromise or system exploitation.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage related to variations of LOLBINs that may not be included in the rule, as well as cases where benign scheduled tasks are frequently executed using these binaries. The detection assumes that the necessary logs for task scheduling are enabled and that the environment has established baseline behaviors for task execution. Additionally, this rule may generate false positives based on legitimate use cases found in the enterprise, which need to be clearly defined and managed.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
