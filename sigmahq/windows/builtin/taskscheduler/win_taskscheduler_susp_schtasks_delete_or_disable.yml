note: |
  ### Technical Context

  This Sigma rule detects the deletion or disabling of critical Windows scheduled tasks that protect system integrity, such as those related to System Restore, Windows Defender, and BitLocker. The likely attacker objective is to disable security mechanisms or backup processes, facilitating data destruction or unauthorized access to sensitive systems. This behavior aligns with the MITRE ATT&CK technique T1489 (Impact - Data Destruction).

  Primary telemetry sources include Windows Event Logs, specifically the "Microsoft-Windows-TaskScheduler/Operational" channel, where Event IDs 141 (Task Deleted) and 142 (Task Disabled) can be found. If malicious, this could enable data loss or compromise system recovery processes. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; further investigation is needed to establish context.

  ### Investigation Steps

  - **Review scheduled task modifications**: Analyze Event ID 141 and 142 in the Task Scheduler Operational logs (Event Log channel) for the specified task names (e.g., '\Windows\SystemRestore\SR'). Look for unusual activity where the user context does not match typical administrative users.

  - **Correlate with user activity**: Check Windows Security Event logs (Event ID 4624) for logins around the timestamp of the task deletion or disabling. Validate user behavior against known legitimate administrative actions to distinguish benign from malicious actors.

  - **Investigate associated processes**: Review process creation logs (Windows Event ID 4688 or Sysmon Event ID 1) around the same time. Look for the use of PowerShell or command-line utilities (like schtasks.exe) that were used to modify scheduled tasks. Legitimate processes may include administrative tasks scheduled by known users.

  - **Assess system role and criticality**: Confirm if the affected system has a critical role (e.g., domain controller, gateway, or data server). Malicious modification of tasks on essential systems poses higher risks and should be prioritized for immediate response.

  - **Monitor for additional indicators of compromise**: Check for related alerts or events that may suggest ongoing compromise, like subsequent attempts to access or disable security features (e.g., Windows Defender events or BitLocker status changes).

  - **Validate restoration options**: Examine logs for evidence of backup activity that would normally precede task changes (e.g., Event ID 107 (Task Started) on Backup Operation) to determine legitimate scheduled task behavior against malicious modifications.

  ### Prioritization

  This alert is high severity given that critical system tasks are being deleted or disabled, which can significantly compromise system security. The likelihood of malicious abuse is high, especially when it aligns with common attack vectors targeting known Windows features. This behavior is weaponized in various forms of cyberattacks, particularly those focused on data destruction.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using administrative privileges to mask their changes or legitimate users inadvertently altering task configurations during maintenance activities. Reliable detection requires that the Task Scheduler Operational log is enabled, as it is disabled by default. Legitimate administrative actions, such as scheduled updates or system reconfigurations, may trigger alerts. Related detection rules might include those monitoring for direct process creation events that correlate with task modifications (e.g., schtasks.exe executions).

