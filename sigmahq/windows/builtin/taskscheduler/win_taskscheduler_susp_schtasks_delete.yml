note: |
  ### Technical Context

  This Sigma rule detects the deletion of significant scheduled tasks related to system restore, Windows Defender, BitLocker, Windows Backup, Windows Update, and other critical system functions. The likely attacker objective is to disable these security mechanisms, protecting their malicious activities and facilitating further exploitation or data destruction. This activity correlates with the MITRE ATT&CK technique "Impact" (T1489).

  The primary telemetry source is the Microsoft-Windows-TaskScheduler/Operational log, specifically Event ID 141, which indicates a task deletion. If this behavior is indeed malicious, it can lead to potentially catastrophic impacts on system recovery and integrity. However, this detection does NOT confirm that the deletion was malicious on its own, as legitimate administrative actions could also trigger it.

  ### Investigation Steps

  - **Review Task Scheduler Event Logs:** Look for Event ID 141 in the Microsoft-Windows-TaskScheduler/Operational log to identify the specific tasks that were deleted. Verify if the tasks align with critical system functions like Windows Defender or System Restore.

  - **Examine User Context:** Check the `UserName` field associated with the deletion for any accounts with administrative privileges or those indicative of automated systems (e.g., users containing 'AUTHORI' or 'AUTORI').

  - **Identify Task Legitimacy:** Confirm whether the deleted tasks are legitimate or expected by examining established task schedules on other similar systems. Compare with backup configurations or documented policies.

  - **Correlate with Other Events:** Analyze other security logs (e.g., Security Event ID 4688, indicating process creation) around the same time frame to find any anomalous behavior, such as processes or script executions that could indicate malicious intent.

  - **Check for High-Confidence Indicators:** Determine if the deletion is preceded by any known malicious behavior, such as unusual remote access sessions or exploitation attempts logged via Event ID 4624 (successful login) from unusual locations.

  - **Assess Asset Criticality:** Prioritize investigation based on the system affected. High-value assets or those pertaining to sensitive data should be investigated first to mitigate potential damage caused by the deletion of critical tasks.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical system operations and the increased likelihood of malicious abuse, particularly in environments where scheduled tasks manage essential functions. This behavior is often weaponized during attacks, making swift response crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the default status of the Task Scheduler Operational log, which needs to be enabled for full visibility. Legitimate administrative activities, such as scheduled task maintenance or application updates, could inadvertently trigger this alert. Companion detections, such as those related to process execution (e.g., ProcCreation schtasks delete) bolster coverage and help validate the context of this alert.

