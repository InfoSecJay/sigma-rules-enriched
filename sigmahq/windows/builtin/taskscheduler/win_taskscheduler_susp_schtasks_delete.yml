note: |
  ### Technical Context
  This detection rule identifies the deletion of critical system scheduled tasks by adversaries, which may indicate an intent to disrupt system functionality or cover their tracks during malicious activities. Attackers often target scheduled tasks linked to essential services such as Windows Update, System Restore, and security features like Windows Defender to facilitate their objectives, which may include data destruction or evasion of security mechanisms.

  In terms of the MITRE ATT&CK framework, this rule maps to the **Impact** tactic, specifically technique **T1489 - Data Destruction**. By removing scheduled tasks that facilitate system resilience and recovery, the adversary reduces the system's defenses and operational capabilities, potentially leading to significant impacts on business continuity and data integrity.

  The primary data sources for this detection are Windows Task Scheduler logs, specifically the **Microsoft-Windows-TaskScheduler/Operational** event logs. It’s essential to ensure this logging is enabled, as it is disabled by default in many environments.

  ### Investigation Steps
  - **Collect Task Scheduler Logs**: Verify that the `Microsoft-Windows-TaskScheduler/Operational` log is enabled and collect logs for the time frame around the alert to find any entries related to task deletions.

  - **Analyze Event ID 141**: Focus on Event ID 141, which specifically tracks the deletion of scheduled tasks. Look for the presence of tasks that are crucial for system operations, especially those mentioned in the detection logic.

  - **Check User Activity**: Investigate the user accounts associated with the deletions, especially those that include 'AUTHORI' in their username. Look for unusual access patterns or logins that coincide with the task deletions.

  - **Review Recent Changes**: Examine other related system logs around the time of the deletion event (e.g., process creation logs) to identify any further malicious actions or potential lateral movement by the threat actor.

  ### Prioritization
  This alert should be considered high-severity due to the critical nature of the affected scheduled tasks. The likelihood of attack scenarios exploiting task deletions for persistence or to accomplish further malicious objectives emphasizes the need for immediate investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the necessary logging (Microsoft-Windows-TaskScheduler/Operational) is not enabled, as many environments do not activate this by default. Additionally, the detection logic assumes that malicious actors use specific task names and usernames that match the conditions outlined. Any deviations in attacker methodology, such as using different usernames or targeting less-known tasks, could lead to missed detections. It is vital for teams to configure logging correctly and ensure comprehensive monitoring of task scheduler events for effective alerting.

