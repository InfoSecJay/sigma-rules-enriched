title: Scheduled Task Executed From A Suspicious Location
id: 424273ea-7cf8-43a6-b712-375f925e481f
status: test
description: Detects the execution of Scheduled Tasks where the Program being run
  is located in a suspicious location or it's an unusale program to be run from a
  Scheduled Task
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2023-02-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: taskscheduler
  definition: 'Requirements: The "Microsoft-Windows-TaskScheduler/Operational" is
    disabled by default and needs to be enabled in order for this detection to trigger'
detection:
  selection:
    EventID: 129     # Created Task Process
    Path|contains:
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - 'C:\Temp\'
    # If you experience FP. Uncomment the filter below and add the specific TaskName with the Program to it
    # filter:
    #     TaskName: '\Exact\Task\Name'
    #     Path: 'Exact\Path'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of scheduled tasks from locations that are generally considered suspicious, such as temporary folders or user profile directories. Attackers may use scheduled tasks to maintain persistence on compromised systems or to execute malicious programs covertly, and running tasks from these locations often indicates an evasion tactic or an abnormal operation. Such behavior can stem from various threats, including but not limited to malware deployments, lateral movement tactics, or even system misconfigurations.

  The relevant MITRE ATT&CK techniques include **Scheduled Task/Job (T1053.005)**, which covers persistence mechanisms where attackers create scheduled tasks to execute payloads at specific intervals or events. The tactic of **Execution** is also pertinent, as the detection focuses on the execution of potentially harmful applications triggered by task scheduler events.

  Primary data sources for this detection rule include Windows Event Logs, specifically the Task Scheduler operational logs. These logs provide insight into the creation and execution status of scheduled tasks on Windows machines, allowing for the identification of anomalous activities.

  ### Investigation Steps
  - **Review Task Scheduler Logs**: Examine the "Microsoft-Windows-TaskScheduler/Operational" logs for EventID 129 to identify recently created or modified tasks, focusing on those that originate from unusual paths.

  - **Correlate File Paths**: Analyze the paths from which the scheduled tasks are executed, looking for patterns or inconsistencies associated with typical enterprise applications. Identify any tasks originating from locations like `C:\Windows\Temp\`, `C:\Users\Public\`, or `C:\Temp\`.

  - **Analyze Task Properties**: Check the task properties for unusual configurations such as unexpected execution triggers or the use of uncommon executables. Determine if the task executes scripts or binaries that are not typically used in the organization's environment.

  - **Investigate Running Processes**: After identifying suspicious tasks, cross-reference the running processes during the times of task execution. Look for any associated processes that may exhibit malicious behavior or that have been flagged in prior alerts.

  ### Prioritization
  This alert carries a medium severity level in an enterprise environment due to the potential for attackers to exploit scheduled tasks to establish persistence and execute malicious payloads. Given that such activities can lead to further compromise of sensitive data or systems, they warrant prompt investigation.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if the Task Scheduler logs are not enabled, as they are disabled by default. Additionally, the detection logic assumes that suspicious tasks will predominantly execute programs from well-known anomalous paths. Organizations must ensure that necessary logs are enabled and properly collected in their SIEM for this detection to function correctly.

