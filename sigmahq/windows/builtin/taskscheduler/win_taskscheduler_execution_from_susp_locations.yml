title: Scheduled Task Executed From A Suspicious Location
id: 424273ea-7cf8-43a6-b712-375f925e481f
status: test
description: Detects the execution of Scheduled Tasks where the Program being 
  run is located in a suspicious location or it's an unusale program to be run 
  from a Scheduled Task
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2023-02-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: taskscheduler
  definition: 'Requirements: The "Microsoft-Windows-TaskScheduler/Operational" is
    disabled by default and needs to be enabled in order for this detection to trigger'
detection:
  selection:
    EventID: 129     # Created Task Process
    Path|contains:
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - 'C:\Temp\'
    # If you experience FP. Uncomment the filter below and add the specific TaskName with the Program to it
    # filter:
    #     TaskName: '\Exact\Task\Name'
    #     Path: 'Exact\Path'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the execution of Scheduled Tasks originating from suspicious locations such as temporary folders (e.g., `C:\Windows\Temp\`, `C:\Users\<User>\AppData\Local\Temp\`) or public directories (e.g., `C:\Users\Public\`). This behavior may indicate an attacker’s objective to maintain persistence in a compromised environment or to execute malicious code without detection. The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1053.005)** and **Execution**.

  Primary telemetry sources include the Windows Task Scheduler operational logs, specifically **Event ID 129**, which logs the creation of task processes. If malicious, this behavior could lead to the execution of malware or exploitation techniques that escalate privileges. However, detection does not confirm malicious intent on its own, as legitimate administrative tasks may also use similar locations, necessitating further investigation to establish context.

  ### Investigation Steps

  - **Review Scheduled Task Information:**
    Check logs for the creation of tasks (Event ID 129) and note the TaskName and the full execution Path. Compare against expected tasks within the environment. Legitimate tasks should typically be stored in `C:\Windows\System32\Tasks\`.

  - **Identify Suspicious Execution Paths:**
    Focus on the task execution paths listed in the Sigma rule for signs of malicious behavior. Paths like `C:\Windows\Temp\`, `C:\Users\<User>\Downloads\`, or others as indicated should be flagged. Assess if these paths are unusual for the associated TaskName.

  - **Correlate Task Creation with User Context:**
    Investigate the user account that created the scheduled task. Access User Logon events (Event IDs 4624 and 4634) to determine if the account and session align with legitimate administrative actions or if they show signs of compromise or misuse.

  - **Check Process Creation Logs:**
    After the task execution, search for subsequent process creation events (Event ID 4688) to monitor what executable was triggered by the task. Look for known malicious indicators such as unusual parent processes or command-line arguments associated with malware execution.

  - **Assess Timing and Frequency of Execution:**
    Review the task’s execution schedule. Abnormal timings (e.g., during off-hours) or frequent execution outside standard operations may highlight potential malicious intent.

  - **Monitor for Known Evasion Techniques:**
    Be aware that adversaries may utilize scheduled tasks in legitimate folders to blend in. Investigate any patterns or anomalies that suggest misuse of Task Scheduler for persistence, such as creation of multiple tasks in short timeframes.

  ### Prioritization

  This alert holds medium severity due to the potential risk associated with tasks executing from non-standard directories, which may indicate malicious activity. The likelihood of abuse is significant, as attackers commonly utilize such techniques for persistence and execution. However, some legitimate applications may also use tasks from these locations.

  ### Blind Spots and Assumptions

  Detection may be limited by the disabled state of the **Microsoft-Windows-TaskScheduler/Operational** logs, which must be enabled for effective monitoring. Legitimate activities such as administrative maintenance or automated updates may trigger this alert. A related detection could involve monitoring for unusual process creation events indicative of illegitimate task executions, further enhancing coverage.

