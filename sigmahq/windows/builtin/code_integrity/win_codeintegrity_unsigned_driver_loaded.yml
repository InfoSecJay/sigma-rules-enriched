  ### Technical Context
  This detection rule identifies the loading of unsigned kernel modules on a Windows system. Kernel modules are essential components that allow the OS to extend its capabilities, but if they are unsigned, they may originate from untrusted sources, posing a significant security risk. Attackers frequently exploit unsigned kernel modules to gain deeper access to a system, facilitating covert activities such as privilege escalation, persistence, and data exfiltration.

  The threat scenario generally involves malicious actors deploying unsigned kernel modules as part of their toolkit to evade security measures and achieve objectives such as maintaining persistence, bypassing security controls, or executing arbitrary code. For instance, an attacker may load a rogue module to manipulate system behavior or intercept sensitive data.

  Relevant MITRE ATT&CK tactics include:
  - **Privilege Escalation** (TA0004), specifically the technique **Kernel Mode Execution** (T1185), which allows attackers to execute code at the kernel level, enabling powerful manipulations of the system.

  The primary data source for this detection includes **Code Integrity operational logs**, which provide detailed information about the signed status of kernel modules loaded into the system.

  ### Investigation Steps
  - **Review Event Logs**: Examine Code Integrity operational logs, specifically looking for Event ID 3001, to identify any unsigned kernel modules loaded on the system. Document the names and locations of these modules for further analysis.
  - **Correlate with System Changes**: Analyze system change logs (like process creation or modification logs) around the time the unsigned module was loaded to identify potential related malicious activities or deviations from standard operations.
  - **Check for Known Malware Patterns**: Investigate any reported unsigned modules against known threat intelligence databases to see if they are associated with known malware or attack frameworks.
  - **Inventory Kernel Modules**: Compile an inventory of all currently loaded kernel modules using tools like Windows PowerShell. Identify any modules that lack valid signatures and determine their necessity for the operation of the system.

  ### Prioritization
  This alert carries a high severity level in an enterprise environment due to the inherent risk posed by unsigned kernel modules, which can indicate compromise or exploitation of system vulnerabilities. The likelihood of abuse fits well within various attack vectors, substantiating its critical response need.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage is the reliance on the Code Integrity feature being properly configured and enabled; if it’s disabled or poorly monitored, unsigned kernel module loading may go unnoticed. The detection logic assumes that any loaded unsigned kernel module is a cause for concern, which may not always be the case in controlled environments where such modules may be purposely used for legitimate development or testing. Additionally, without proper logging settings, this alert may fail to trigger, leading to missed detection opportunities.

