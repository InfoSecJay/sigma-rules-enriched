  ### Technical Context

  This rule detects the loading of unsigned kernel modules on Windows systems, signaling a potential compromise or improper system configuration. Attackers often use unsigned kernel modules to escalate privileges or evade defenses, facilitating further malicious actions such as rootkits or unauthorized data access. This activity corresponds to the MITRE ATT&CK tactic **Privilege Escalation** (TA0004) and technique **Kernel Driver Abuse** (T1543.003).

  The primary telemetry source for this detection is the Code Integrity Operational log, specifically monitoring for Event ID **3001**. If malicious, the loading of an unsigned kernel module could allow for unauthorized access and manipulation of system resources. However, this detection does not confirm malicious intent on its own, as legitimate unsigned modules can exist, especially in test environments or legacy systems.

  ### Investigation Steps

  - **Verify event details:** Cross-check **Event ID 3001** in the Code Integrity Operational logs to confirm the presence of an unsigned kernel module. Note the filename and path of the module, as well as the timestamp of when it was loaded.

  - **Assess module legitimacy:** Research the loaded module's publisher and digital signature status. Use tools such as SigCheck to determine if the module is known and trusted, or if it has a history of malicious activity.

  - **Identify expected behavior:** In typical enterprise environments, kernel modules should be properly signed. Legitimate unsigned modules may include driver updates or legacy components. Compare the timestamp and system context against known deployments or updates.

  - **Review system roles and critical assets:** Determine if the affected system is a critical server or workstation with elevated privileges. Higher-impact systems are more likely to be targeted by malicious actors.

  - **Search for related artifacts:** Investigate other indicators of compromise, such as unexpected service creation or process injection attempts in correlation to the time the module was loaded, using **Event ID 4688** for process creation.

  - **Check for companion detections:** Review existing detections for related behaviors, especially **event sources indicating unauthorized privilege escalation** or abnormal behavior following the loading of the kernel module to inform a comprehensive assessment.

  ### Prioritization

  The alert severity is high due to the risk of privilege escalation via an unsigned kernel module loaded on potentially critical systems. The likelihood of malicious abuse is significant, as the behavior is commonly weaponized by sophisticated attackers leveraging such tactics in their operations.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by the presence of legitimate unsigned kernel modules that can trigger false positives. Required log sources include Code Integrity Operational logs that must be enabled. It’s crucial to consider that legitimate administrative tasks or driver updates might produce similar alerts. A related detection that strengthens coverage could involve monitoring for unexpected changes or installations of kernel drivers beyond standard updates.

