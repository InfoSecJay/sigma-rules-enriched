  ### Technical Context
  This detection rule monitors for block events related to files that have been disallowed by the Code Integrity feature for protected processes on Windows systems. The objective of this rule is to alert on attempts by potential threat actors to execute unauthorized or malicious files within critical processes. Attackers often target sensitive environments to exploit vulnerabilities, escalate privileges, or establish persistence using disallowed executables.

  The likely threat scenario involves an attacker attempting to bypass application control protections by executing a malicious payload targeting protected processes. MITRE ATT&CK tactics relevant to this detection include **Privilege Escalation** (TA0004) and the technique **Exploitation of Vulnerability** (T1203). The primary source of telemetry for this detection includes the Code Integrity operational logs, specifically looking for Event ID 3104, which indicates that a block event occurred for a file deemed disallowed for protected processes.

  ### Investigation Steps
  - **Review Block Event Details:** Investigate the blocked file event (Event ID 3104) in the Code Integrity logs to identify the specific file attempting execution, including its path and hash.
  - **Correlate with Process Activity:** Check for any associated process creation events or unusual activity around the time the block occurred, which may provide context on how the file was invoked.
  - **Analyze Protected Process Configuration:** Assess the configuration of the protected processes to understand what legitimate applications are expected to run and determine whether the blocked file was malicious or part of an authorized process.
  - **Check for Indicators of Compromise:** Utilize threat intelligence to evaluate the blocked file against known malware hashes or signatures, and examine previous alert history for similar events.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact on critical systems and the likelihood that an unauthorized file execution attempt indicates active exploitation or breaches in security posture.

  ### Blind Spots and Assumptions
  One gap in detection coverage is that benign applications may occasionally trigger this rule if they are neither whitelisted nor part of the organization’s standard configuration. The detection logic assumes that all disallowed files are malicious; however, legitimate software updates or changes may also be marked disallowed. For proper functioning, it is essential to have Windows Code Integrity logging enabled and properly configured across the environment to ensure comprehensive monitoring.

