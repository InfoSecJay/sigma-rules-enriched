  ### Technical Context

  This rule detects instances where Windows blocks files that are disallowed for protected processes, specifically through event ID 3104. The behavior being detected is indicative of attempts by potentially malicious software or unauthorized users to manipulate or inject code into critical system processes that are protected by Code Integrity policies. The likely attacker objective is privilege escalation or evading security controls to execute malicious payloads within a trusted process context.

  This detection aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (Tactic ID: T1068) and technique "Exploitation of Vulnerability" (Technique ID: T1203). The primary telemetry source for this detection is the Windows Code Integrity operational logs, specifically events associated with file blocks for protected processes. If malicious, the security impact could lead to unauthorized access, data breaches, or system compromise. Importantly, this detection does NOT confirm whether the blocked file is inherently malicious; it only indicates that an attempt was made to use it in a protected process context.

  ### Investigation Steps

  - **Check Event ID 3104 occurrences:**
    Review the Code Integrity operational logs for Event ID 3104 to confirm what specific file was blocked and which protected process was targeted. Look for the 'File Name' field within the event details.

  - **Extract process details:**
    Investigate associated process information by reviewing Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) to identify the process that attempted to invoke the disallowed file. Analyze the 'Command Line' and 'Parent Process ID' fields for context.

  - **Assess file legitimacy:**
    Identify characteristics of the blocked file, such as its file path and hash. Conduct a reputation lookup using threat intelligence sources or services (e.g., VirusTotal) to ascertain if it's known to be malicious.

  - **Validate expected behavior:**
    Determine if the disallowed file is part of legitimate software deployments or system maintenance processes (e.g., Windows updates) on critical systems by consulting application whitelisting policies or software inventory databases.

  - **Cross-reference with other alerts:**
    Look for any correlated alerts within the SIEM or security monitoring tools across the same timeframe that may indicate malicious activity, such as unusual logins or privilege escalations.

  ### Prioritization

  This alert carries a high severity due to its potential impact on protected processes, which are critical to system integrity and stability. The likelihood of malicious abuse is significant, as adversaries often target these processes to execute their payloads or persist within environments. Such techniques are commonly weaponized in advanced persistent threats (APTs) and other sophisticated attacks.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility that legitimate applications that require code injection may occasionally trigger this alert, leading to potential false positives. Reliable detection requires proper configuration of Code Integrity logs; without them, the event would not be recorded. A related detection could be monitoring for suspicious activity in the same protected process space, such as unexpected process creations (Event ID 4688) or modifications to protected process protections (e.g., changes to Code Integrity policies).

