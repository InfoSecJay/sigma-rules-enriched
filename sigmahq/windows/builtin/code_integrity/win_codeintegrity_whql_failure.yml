logsource:
  product: windows
  service: codeintegrity-operational
detection:
  selection:
    EventID:
    - 3082         # Code Integrity determined kernel module %2 that did not meet the WHQL requirements is loaded into the system. However, due to code integrity auditing policy, the image was allowed to load
    - 3083         # Code Integrity determined kernel module %2 that did not meet the WHQL requirements is loaded into the system. Check with the publisher to see if a WHQL compliant kernel module is available
  filter_optional_vmware:
    FileNameBuffer:
    - 'system32\drivers\vsock.sys'
    - 'System32\drivers\vmci.sys'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the loading of kernel modules that do not comply with Windows Hardware Quality Labs (WHQL) signing requirements. Such incidents can indicate attempts by attackers to introduce malicious or untrusted code into the kernel space, which can easily lead to privilege escalation or system compromise. Attackers may leverage kernel mode exploits to bypass security controls, allowing them to manipulate system behavior or steal sensitive information.

  The rule correlates with the MITRE ATT&CK tactic of **Privilege Escalation** (Tactics: TA0004) and the technique **Kernel Module and Driver (T1201)**. By identifying unapproved kernel modules, defenders can gain insight into potential adversarial activity that aims to maintain persistence or gain elevated privileges within the Windows operating environment.

  Primary data sources for this detection include the Windows Code Integrity operational logs, specifically Event IDs 3082 and 3083, which document instances where kernel modules fail to meet WHQL requirements yet are still loaded, potentially indicating further investigation is needed.

  ### Investigation Steps
  - **Review Windows Code Integrity Logs**: Access the Windows Code Integrity operational logs to examine Event IDs 3082 and 3083. Look for entries that indicate the loading of non-WHQL signed modules.

  - **Correlate with Process Creation Events**: Analyze relevant process creation events to identify the parent processes that initiated the loading of the detected kernel modules. This can help establish the context of the loading operation.

  - **Examine Recent Driver Installations**: Check system logs for recent driver installations or updates that coincide with the loading of non-compliant kernel modules. Compare signatures and vendor information to identify potential unauthorized changes.

  - **Assess System Behavior and Integrity**: Conduct an integrity check on the impacted systems to find any other anomalies that could signal a broader compromise, including unexpected network connections or unusual resource usage.

  ### Prioritization
  The severity of this alert is high, as unauthorized kernel module loading can significantly compromise system integrity and potentially allow threat actors to escalate their privileges, resulting in severe implications for organizational security.

  ### Blind Spots and Assumptions
  This detection rule may not cover all scenarios involving malicious kernel modules, particularly in environments where application control policies are excessively relaxed or where legitimate non-WHQL signed drivers are regularly used. It assumes that all Windows systems are configured to log Code Integrity events adequately, and there are no disruptions to the logging process. The absence of required logs may inhibit the detection's effectiveness, resulting in false negatives in compromised environments.

