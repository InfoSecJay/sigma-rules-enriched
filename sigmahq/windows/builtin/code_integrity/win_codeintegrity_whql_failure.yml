note: |
  ---

  ### Technical Context

  This Sigma rule detects the loading of kernel modules that do not meet Windows Hardware Quality Labs (WHQL) signing requirements. Malicious actors may exploit this by leveraging unsigned kernel modules to gain elevated privileges or execute arbitrary code within the kernel, possibly allowing them to establish persistence or evade detection. The relevant MITRE ATT&CK technique is **Privilege Escalation (T1068)**.

  Primary telemetry sources include Windows Code Integrity Operational Logs, specifically Event IDs 3082 and 3083. If malicious, the security impact can be severe, leading to system compromise, data theft, or further penetration into the network. Importantly, this detection does not confirm malicious activity on its own, as there may be legitimate reasons for unsigned modules to be loaded, such as custom drivers in development or controlled environments.

  ---

  ### Investigation Steps

  - **Check the Event ID:** Verify Event ID 3082 or 3083 in Code Integrity log entries. Document the timestamp and affected kernel module name captured within the `FileNameBuffer` field.

  - **Identify the kernel module source:** Research the kernel module %2 to determine its origin and legitimacy. Cross-reference against known vendor records or WHQL databases.

  - **Review system context:** Investigate the system's role (e.g., server, workstation) and criticality. New or unusual kernel modules on high-value assets (e.g., Domain Controllers) should be prioritized.

  - **Look for other indicators of compromise:** Check for recent process creation on the affected host using Security Event ID 4688 or Sysmon Event ID 1 that might correlate with the loading of the unsigned module. Look for unexpected or rare executable names.

  - **Assess legitimate activity:** Verify whether any authorized administrative actions or reputable software installations were conducted around the timestamp of the alert that might explain the presence of the unsigned module.

  - **Evaluate hardware changes:** Inspect Event IDs related to hardware changes or driver installations in the System event logs (Event ID 20001 and others) to provide context for potential benign reasons for loading the unsigned module.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for privilege escalation and exploitation of system vulnerabilities. The likelihood of malicious abuse is significant given that unsigned kernel modules are often utilized by adversaries to bypass security mechanisms. Instances of malicious kernel module loading are commonly observed in advanced attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where signed drivers are not strictly enforced or in cases where legitimate applications use unsigned modules. Logs must be appropriately configured to capture Code Integrity events; missing logs may hinder detection reliability. Legitimate development tools may also load unsigned drivers, prompting false positives. A related detection, such as monitoring for abnormal process creation initiated by these kernel modules, could enhance overall coverage.

