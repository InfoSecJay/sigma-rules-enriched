note: |
  ### Technical Context

  This Sigma rule detects kernel modules loaded on Windows systems that do not meet Windows Hardware Quality Labs (WHQL) signing requirements. The behavior typically indicates a potential bypass of the operating system's integrity checks, which adversaries might exploit to introduce unauthorized drivers or malware. The likely objective of the attacker is to escalate privileges or gain persistence on the system by loading malicious kernel-mode code.

  This detection aligns with the MITRE ATT&CK framework under the tactic of Privilege Escalation and specifically the technique: "Kernel Modules and Extensions" (T1152). Primary telemetry sources include Windows Event Logs from the Code Integrity operational log, specifically looking for Event IDs 3082 and 3083. If malicious, this activity can compromise the security integrity of the system. However, this detection alone does not confirm malicious intent, as legitimate signed kernel modules may still fail to meet WHQL compliance under certain circumstances.

  ### Investigation Steps

  - **Review Event IDs for Signatures**: Check for Event ID 3082 or 3083 in the Code Integrity operational logs (Event Viewer > Applications and Services Logs > Microsoft > Windows > CodeIntegrity > Operational). Note the loaded module name for further analysis.

  - **Analyze Signatures of Loaded Modules**: Validate the publisher's signature of the identified kernel module using tools like "signtool" or a checksum comparison. Legitimate drivers typically have valid WHQL certificates, while unsigned drivers may indicate potential malicious activity.

  - **Determine System Role and Context**: Identify the system role (e.g., server, endpoint) and criticality. Context matters; for example, security servers should not load unsigned kernel modules, whereas certain virtualization environments might have exceptions.

  - **Correlate with Known Threats**: Cross-reference the loaded module with known malicious signatures or threat intelligence feeds. Check if the driver has been linked to previous incidents or threat actor tools, indicating malicious intent.

  - **Identify Usage Patterns**: Analyze the usage patterns of the affected module. Legitimate modules may display consistent usage with known processes, whereas suspicious activity might include non-standard behaviors or interactions (e.g., unauthorized service creation).

  ### Prioritization

  This alert is high severity because it involves kernel-level modifications that can lead to complete system compromise. The likelihood of abuse is significant, as adversaries frequently target kernel modules for privilege escalation. Additionally, the misuse of unsigned modules is commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques like the use of valid signed drivers that have been modified after signing. It requires proper logging configurations for accurate event capture, including ensuring Code Integrity auditing is enabled. Legitimate operations may involve custom drivers in specialized environments, which could trigger this alert. A companion detection, such as monitoring for driver installation processes, can strengthen coverage related to unauthorized driver installation.

