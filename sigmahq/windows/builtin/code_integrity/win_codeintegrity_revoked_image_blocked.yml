  ---

  ### Technical Context

  This rule detects instances where a Windows system attempts to load software or drivers that are signed with a revoked certificate, resulting in a blocked image load event. Attackers may use maliciously crafted drivers or software to gain elevated privileges or execute arbitrary code, leveraging the code integrity service to bypass regular security checks. This behavior aligns with the MITRE ATT&CK framework under the tactic "Privilege Escalation" (ID: T1068), specifically the technique of "Exploitation for Client Execution" (ID: T1203).

  The primary telemetry source for this detection is Windows Code Integrity operational logs, particularly Event ID 3036. If an attacker successfully loads a malicious driver using this tactic, they can gain unauthorized access or control over the system, leading to potential data exfiltration or lateral movement. However, this detection alone does NOT confirm that a malicious action was executed; it only indicates a failed attempt to load a compromised image.

  ---

  ### Investigation Steps

  - **Review Event ID 3036 logs:** Check Code Integrity operational logs for Event ID 3036. Confirm the blocked image load attempts and inspect the specific details of the revoked certificate, including file path and publisher.

  - **Identify known software:** Cross-reference the blocked software or driver against an internal software inventory. If the software is legitimate and used within the organization, it may be a false positive.

  - **Assess certificate status:** Use tools to check the certificate revocation list (CRL) or Online Certificate Status Protocol (OCSP) for the revoked certificate. Indicators of compromise can be inferred if the certificate belongs to unknown or suspicious publishers.

  - **Validate similar behaviors:** Look for other related blocked image load events in the timeframe. Multiple occurrences may indicate a broader compromise attempt or configuration issue.

  - **Check for legitimate conditions:** Determine if recent updates were applied to the system that may have impacted certificate validation. Legitimate patches or driver updates from trusted vendors should not trigger this alert.

  ---

  ### Prioritization

  Due to the potential for privilege escalation and malicious control over the system, this alert is considered high severity in an enterprise context. The likelihood of adversaries utilizing revoked certificates to bypass security mechanisms means that immediate investigation is crucial, as this behavior is commonly weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as attackers using their own certificates or valid but misconfigured certificates to bypass blocks. Reliable detection requires all relevant Windows Code Integrity logs to be collected and configured correctly. Legitimate activities that may trigger the alert include software or driver updates that have not been adequately signed. Companion detections, such as monitoring for "Process Creation" events related to newly loaded drivers, can provide stronger validation of potential threats.

