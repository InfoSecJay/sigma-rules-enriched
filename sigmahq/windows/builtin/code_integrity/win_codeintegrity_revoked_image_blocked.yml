note: |
  ### Technical Context
  This detection rule is designed to identify attempts to load software images that have been blocked due to revoked certificates by Windows Code Integrity. When a certificate used to sign a file is revoked, Windows prevents that file from executing, which can indicate an attempt by an attacker to run potentially malicious code that has not been correctly validated. The objective of this kind of attack may vary from deploying malware to attempting privilege escalation by using unsigned or improperly signed kernel modules.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation** (TA0004), as attackers may exploit revoked certificates to run unauthorized code with higher privileges. Specifically, this aligns with the technique known as **Abuse Elevation Control Mechanism** (T1548), where an attacker seeks to increase their level of access within the system. The primary data source for this detection will come from Windows Code Integrity operational logs, particularly Event ID 3036, which captures events where the integrity verification of a file has failed due to revoked certificates.

  ### Investigation Steps
  - **Review Code Integrity Logs:** Analyze the Windows Code Integrity operational logs for Event ID 3036 to identify instances where code execution was blocked due to revoked certificates. Note the specific files involved and their paths.
  - **Analyze File Signatures:** Investigate the digital signatures of the blocked files to determine the publisher and the reasons for revocation. Check for any known vulnerabilities associated with the publisher to understand potential threats.
  - **Check for Related Activity:** Look for any processes or user accounts that attempted to load the blocked images, including examining process creation logs for unusual behavior coinciding with the block events.
  - **Correlate with Behavioral Indicators:** Use other SIEM tools to correlate events from EDR or NDR systems that could indicate a larger suspicious activity pattern, such as abnormal file access requests or unusual network traffic related to the associated file paths.

  ### Prioritization
  This alert should be treated with high severity due to the potential for attackers to exploit revoked certificates to execute malicious payloads or escalate privileges, representing a significant threat to the enterprise's security posture.

  ### Blind Spots and Assumptions
  The main gap in detection coverage could arise from scenarios where logs may be insufficiently detailed or not retained for the duration needed for effective investigation. This detection logic assumes that the Windows Code Integrity operational logs are properly configured and enabled. If these logs are not collected or if there are issues with the configuration on affected endpoints, the detection will not function as intended. Additionally, external factors beyond revoked certificates may lead to similar blocking events, which means that analysts should contextualize findings within the broader security landscape.

