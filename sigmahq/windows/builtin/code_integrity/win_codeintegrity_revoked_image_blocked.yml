  ### Technical Context

  This Sigma rule detects instances where Windows Code Integrity has blocked the loading of an image (such as a driver or executable) due to a revoked signing certificate. The behavior indicates potential tampering or the use of malicious software that has not met the integrity requirements set by Windows, which a hostile actor may exploit to inject malicious code into the system. This activity is relevant to the MITRE ATT&CK framework under the tactic "Privilege Escalation" (TA0004) and the technique "Exploitation for Client Execution" (T1203).

  The primary telemetry source for this detection is the Code Integrity operational logs, specifically Event ID 3036. If the detection is confirmed as malicious, it could indicate significant risks, including unauthorized privilege escalation or system compromise. Importantly, this detection does NOT on its own confirm that an attack is occurring; it merely indicates that blocked images are attempting to load due to certificate issues, which could be a sign of either a legitimate application misconfiguration or malicious intent.

  ### Investigation Steps

  - **Identify the blocked image:** Review Event ID 3036 logs in the Code Integrity operational log. Focus on the `%2` field to determine the exact path of the blocked file or module. This may provide insight into whether the file is part of an enterprise-approved application or a potentially malicious one.

  - **Check for known legitimate software:** Correlate the blocked image against a list of known legitimate software to confirm if the application has been improperly signed or compromised. Use application control databases or internal documentation for validation.

  - **Assess the signing authority:** Investigate the certificate authority (CA) used for the revoked certificate. Query with `Get-AuthenticodeSignature <path to file>` in PowerShell to see details regarding the signer and the reason for revocation, distinguishing if it is expected or symptomatic of larger issues.

  - **Monitor for patterns of repeated occurrences:** Analyze if this event has been logged multiple times in a short period. Frequent occurrences could indicate a persistent attempt to load malicious files, suggesting a more serious incident.

  - **Investigate system impact:** Review the role and criticality of the affected system within the network. Systems performing sensitive operations, or ones that could introduce or escalate privilege within the environment, should be prioritized for further forensic investigation.

  - **Look for related evasion tactics:** Assess for broader activity that could indicate evasion attempts, such as unusual process creation around the time of the alert, leveraging Sysmon Event ID 1 for process tracking.

  ### Prioritization

  This alert has a **high** severity in an enterprise environment due to the possibility of blocked malicious code execution that could lead to privilege escalation. The likelihood of malicious actors trying to exploit revoked certificates for code execution is substantial, as they may utilize compromised or unpatched software to facilitate their activities.

  ### Blind Spots and Assumptions

  Detecting this event relies on accurate Code Integrity logging configurations; missing these logs could lead to unnoticed malicious load attempts. Additionally, legitimate software updates or misconfigurations can trigger this alert if signing certificates are revoked. A companion detection such as monitoring for unauthorized process creation (Sysmon Event ID 1) can further enhance detection of potential abuse stemming from this behavior.

