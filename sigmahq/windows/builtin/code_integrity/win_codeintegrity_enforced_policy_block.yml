  ### Technical Context

  This Sigma rule detects events where the Windows Code Integrity service has blocked a process from loading a driver or image that does not meet the required code signing level. This behavior is indicative of a potential persistence mechanism being employed by an attacker who may be attempting to load unapproved or malicious code onto the system. The likely attacker objective is to escalate privileges, establishing persistence or executing malicious payloads. Relevant MITRE ATT&CK tactics and techniques include "Persistence" (TA0003) and "Executable Code Execution" (T1203).

  The primary telemetry source is the Code Integrity operational logs, specifically Event ID 3077, which captures blocked load events. If this behavior is maliciously triggered, it could allow an attacker to bypass security mechanisms, leading to compromised systems. It is crucial to note that this detection does not confirm malicious intent solely based on the event—benign applications that do not comply with signing requirements may legitimately trigger this alert.

  ### Investigation Steps

  - **Review Event ID 3077 logs**: Look for entries indicating a blocked image or driver load. Analyze the process name (%4) and the blocked image (%2) for known benign applications. Document the Policy ID (%XX) associated with the violation.

  - **Cross-reference against trusted software**: Check if the blocked image or driver is from a reputable source or is a known legitimate application. Utilize the software's publisher information query to validate signatures.

  - **Inspect application whitelisting policies**: Examine the Code Integrity policy configurations to understand which executables are permitted. Find configurations in the Group Policy Management Console or relevant XML policy files.

  - **Identify prevalent threat patterns**: Research if the blocked driver or image has been reported in threat intelligence as associated with malicious activities, particularly for privilege escalation or persistence.

  - **Assess the environment for further indicators**: Look for other suspicious activities, such as unusual process creation events (Event ID 4688) around the same time frame, indicating a larger attack pattern may be at play.

  - **Document standard operational activities**: Gather examples of legitimate behavior that may cause similar alerts, such as software updates or installations by IT. These are critical for honing in on true positives versus false alerts.

  ### Prioritization

  This alert carries high severity due to the potential impact on the system's security posture if it successfully allows a malicious actor to load unverified code. The likelihood of malicious use is significant, as many attackers exploit unsigned drivers or malicious executables for persistence and privilege escalation. Given the frequency of attempts to bypass code integrity controls, this behavior is often weaponized.

  ### Blind Spots and Assumptions

  Detection limitations may include instances where legitimate software may inadvertently trigger this alert, such as updates from less common vendors or custom applications lacking proper signing. Ensure that the Code Integrity logging is enabled at the system level for reliable detection. Additionally, be aware that development environments or administrative installations may also produce frequent legitimate alerts. A related detection that strengthens coverage could be monitoring for Event ID 4688 to analyze additional process creation behavior leading up to the blocked event.

