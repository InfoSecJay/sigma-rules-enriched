note: |
  ### Technical Context
  This detection rule targets events where the Windows Code Integrity service blocks the loading of images or drivers that do not adhere to the required Authenticode signing level or violate established code integrity policies. This typically indicates an attempt by unauthorized or malicious code to run on the system, potentially representing a threat actor's effort to deploy malware, unwanted software, or rootkits that could compromise system integrity.

  Attackers often aim to exploit vulnerabilities in legitimate software or introduce malicious code by bypassing security measures. By failing to meet the signing requirements, these threat actors may attempt to load unsigned drivers or executables to maintain persistence, escalate privileges, or execute malicious payloads. The relevant MITRE ATT&CK tactics applicable here include **Persistence (T1543)**, as attackers may be seeking to maintain presence on the system, and **Privilege Escalation (T1543)**, since loading unauthorized drivers could enable elevated access.

  Primary data sources for this detection include Windows Code Integrity operational logs, specifically looking for Event ID 3077, which captures these blocked loading attempts and can reveal insights into unauthorized modification attempts.

  ### Investigation Steps
  - **Review Code Integrity Logs:** Examine the Windows Code Integrity operational log for Event ID 3077 to identify blocked loading attempts and gather details such as the process name and the specific code or driver being loaded.
  - **Correlate with Security Events:** Check for related security events, such as process creation events that occurred around the same time as the blocked attempts, to identify potentially malicious processes starting prior to the violation.
  - **Analyze System Behavior:** Investigate any unusual behavior associated with the processes or drivers in question, such as network connections, file modifications, or scheduled tasks that may suggest malicious activity.
  - **Validate Signing Certificates:** Research the digital signing certificates for the blocked images/drivers to determine their legitimacy and assess if they are associated with known vendors or flagged as malicious.

  ### Prioritization
  The alert should be prioritized as high severity because the blocking of code or driver loads indicates a potential security breach or an attempt to bypass security controls, which can lead to significant impacts on system security and data integrity.

  ### Blind Spots and Assumptions
  There may be detection gaps, particularly in environments with custom or third-party applications that may inadvertently generate false positives when blocking legitimate signed applications. Assumptions include that the environment is using Code Integrity policy enforcement and that relevant logs are enabled and retained adequately. Monitoring needs to ensure that all systems monitor and properly log Code Integrity events for this detection to be effective.

