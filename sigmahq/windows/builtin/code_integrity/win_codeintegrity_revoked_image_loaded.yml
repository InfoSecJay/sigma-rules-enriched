  ---

  ### Technical Context

  This rule detects instances where a revoked image is loaded into a Windows system, as indicated by Event IDs 3032 and 3035 from the Code Integrity operational logs. The likely objective for an attacker may involve executing malicious code that has been previously disallowed due to security policies, thus evading protections designed to enforce code signing. This behavior relates to the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and technique: "Abuse Elevation Control Mechanics" (T1548).

  The primary telemetry sources for this detection are the Windows Code Integrity logs, specifically looking at operational logs for revocation events. The security impact is significant as loading a revoked image could indicate an unauthorized attempt to execute potentially harmful software. It is important to clarify that this detection does NOT confirm that the loaded image is malicious, only that it has been revoked due to security concerns.

  ---

  ### Investigation Steps

  - **Review Code Integrity logs for Event ID 3032/3035**: Check Windows Event Logs under Applications and Services Logs -> Microsoft -> Windows -> CodeIntegrity -> Operational. Look for events indicating revoked images loaded into the system.

  - **Identify the involved image**: Verify the name and hash of the revoked image reported in the logs. Compare it with known benign software to determine whether the alert is likely malicious or a false positive.

  - **Inspect system processes and parent-child relationships**: Use Sysmon (Event ID 1) to review the process creation logs around the time of the event. Confirm if the detected image was spawned by a legitimate process or from suspicious activities (e.g., if a well-known benign process is observed making the call).

  - **Correlate with recent administrative changes or updates**: Review activity from Event ID 4624 (logon events) for any recent administrative logins, especially from privileged accounts, which may have recently installed new software that could be falsely detected or suspects loading vulnerable components.

  - **Assess user roles and asset criticality**: Determine if the affected asset is a high-value target (e.g., domain controller, database server) and consider the implications of a security incident associated with that asset.

  ---

  ### Prioritization

  This alert should be prioritized as high due to the potential impact on critical enterprise systems. The likelihood of malicious actors exploiting revoked images is significant, especially in environments targeted by advanced persistent threats (APTs) that may attempt to bypass security controls to escalate privileges.

  ---

  ### Blind Spots and Assumptions

  Common evasion techniques may include attackers using legitimate troubleshooting or testing modes (e.g., kernel mode debugger) to bypass code integrity checks. Reliable detection requires effective enforcement of Code Integrity policies and complete logging of CodeIntegrity operational events. Furthermore, processes that normally load //images in a testing or development context may inadvertently trigger this alert, warranting further investigation of baseline application behavior. A related detection would include monitoring for attempts to disable Code Integrity itself, providing a more comprehensive view of potential risks.

