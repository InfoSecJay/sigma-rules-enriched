note: |
  ### Technical Context
  This rule detects the loading of images with revoked digital certificates, which indicates that potentially malicious or unauthorized code is being executed in the Windows operating environment. Attackers may utilize methods that involve injecting revoked images to bypass security controls, aiming to escalate privileges or maintain persistence on compromised systems. The primary objective could range from executing malicious payloads unnoticed, to utilizing compromised software for further exploitation of the environment.

  The relevant tactics and techniques associated with this detection relate to MITRE ATT&CK's privilege escalation (T1068) and defense evasion (T1203). This captures scenarios where adversaries manipulate the operating system’s behaviors regarding application control to execute malicious code that should have been blocked.

  The primary data sources that provide evidence for this detection are Windows Code Integrity operational event logs. These logs capture significant details about process image loads, especially those associated with certificate validation failures.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Code Integrity operational event logs for Event IDs 3032 and 3035 to identify which revoked images were loaded and under what circumstances. This will provide insights into the possible entry points for the attackers.

  - **Identify Source and Process:** Investigate the source of the invoked image by checking the file path and publisher details. This helps establish whether the image is associated with known software or potentially malicious activity.

  - **Analyze System Behavior:** Look for unusual behavior or subsequent actions taken by the system after the revoked image was loaded, such as unexpected internet connections or process creation events.

  - **Correlate with Other Logs:** Cross-reference findings with application logs, endpoint detection and response (EDR) logs, and firewall logs to trace communications and actions taken by the process associated with the revoked image.

  ### Prioritization
  The alert is considered high severity due to the potential for privilege escalation and the execution of malicious code within the enterprise environment, which could lead to further compromise or data loss if unaddressed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for images that do not utilize revoked certificates but still pose a threat. The detection logic assumes that all processes utilizing revoked images are indeed malicious, which might not always be the case. It also relies on the proper logging of Code Integrity events, which must be enabled in the environment for the rule to function effectively. In <1fig-ibody> environments where Code Integrity settings are not correctly configured or are disabled, detection will not occur as intended.

