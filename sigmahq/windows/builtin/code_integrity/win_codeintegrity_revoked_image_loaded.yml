note: |
  ### Technical Context

  This Sigma rule detects the loading of images with revoked certificates, which typically indicates that the binaries are no longer trustworthy. The likely attacker objective is to execute potentially malicious software that has previously been scrutinized and marked as unsafe, bypassing code integrity protections. This activity aligns with the MITRE ATT&CK technique of "Kernel Modules and Extensions Implantation" (T1218). The primary telemetry sources for detection are Windows Event Logs, specifically the Code Integrity operational logs, capturing Event IDs 3032 and 3035. If this behavior is malicious, it could facilitate privilege escalation and further compromise of the affected system. It is important to note that this detection does NOT confirm the intent behind the loading, as certain debug scenarios may also trigger this alert.

  ### Investigation Steps

  - **Check Event IDs related to revoked image loading:** Review Windows Event Log for Code Integrity Operational Logs (Event ID 3032 and 3035). Focus on the timestamp and user context to identify any suspicious patterns.

  - **Identify if a debugger is attached:** For Event ID 3035, determine if a kernel-mode debugger was intentionally or unexpectedly attached. Legitimate use would involve known, authorized debugging sessions, while unapproved instances should raise suspicion.

  - **Examine the loaded image's path and signature:** Investigate the file path and gather details about the revoked image by checking its digital signature. Use PowerShell (Get-AuthenticodeSignature) or other signature verification methods to ascertain its origin and publishing status.

  - **Cross-reference with known malware signatures:** Use malware threat intelligence sources to check if the revoked image matches any known malicious binaries, enhancing confidence in the detection’s legitimacy.

  - **Review recent administrative tasks:** Check for any recent administrative activity via Windows Event ID 4688 logs (Process creation) that may correlate with the loading of the revoked image, indicating possible privilege escalation attempts.

  ### Prioritization

  The severity of this alert is high due to the critical nature of the affected system and the likelihood of malicious exploitation of revoked images. Since this behavior is indicative of a potential privilege escalation attempt, it is both uncommon and significant, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist if logging configurations are not correctly set for Code Integrity logs. Evasion techniques may include using legitimate digital signature revocations to mask malicious activity or employing debuggers to circumvent detection. Legitimate activities, such as developmental work or authorized debugging scenarios, could trigger this alert. A companion detection to enhance coverage would be monitoring for abnormal kernel debugger activities (MTRE technique T1218.005).

