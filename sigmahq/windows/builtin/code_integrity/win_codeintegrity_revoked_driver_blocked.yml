  ### Technical Context

  This Sigma rule detects attempts to load drivers that have been revoked by Microsoft, which often signifies that they have been flagged due to security concerns. The likely attacker objective is to either gain persistence on a system or to escalate privileges by executing malicious code that relies on driver functionality. This relates to the MITRE ATT&CK framework, particularly under the tactics of Persistence and Privilege Escalation (Tactics: TA0003, TA0004), with the relevant technique being T1543 (Create or Modify System Processes).

  Primary telemetry sources for this detection include Windows Code Integrity Operational logs, specifically Event ID 3023. If malicious, the impact can include unauthorized access and control over system resources, potentially leading to data exfiltration or further compromise. It is important to note that this detection does NOT confirm that a successful attack occurred; it only indicates an attempted loading of a revoked driver.

  ### Investigation Steps

  - **Identify Event Context:** Review Code Integrity logs for Event ID 3023 to find instances of blocked driver loads, specifically noting the path and signature status of the driver mentioned.
  - **Examine the Driver Signature:** Cross-reference the driver path against known malicious hashes and verify if the digital certificate has been revoked using Microsoft’s public Certificate Transparency logs.
  - **Assess System Impact:** Determine the role of the affected system (e.g., server, workstation) and assess if it has critical functions or contains sensitive data, which can heighten incident severity.
  - **Analyze Recent Changes:** Investigate recent changes to system settings or software installations that may have introduced the revoked driver attempt, looking at installation logs (Application event log, Event ID 1033).
  - **Correlate with Additional Indicators:** Check for other related events that occurred around the same time, such as process creation events (Security Event ID 4688) or unusual network connections (Windows Firewall logs) that may indicate further malicious activity.
  - **Review Legitimate Driver Loads:** Confirm expected behavior by identifying legitimate drivers approved or signed for use in the environment, which should not appear in the revoked list.

  ### Prioritization

  This alert carries high severity due to the potential impact on the integrity and security of the affected system, particularly if used in conjunction with other malicious activities. The likelihood of malicious abuse is significant, as adversaries may leverage such tactics to maintain persistence or escalate privileges. This behavior is not commonly seen in legitimate operations, thus warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations may exist if the Code Integrity logs are not properly configured or if there are gaps in the log retention policies. Legitimate activities, such as software updates or maintenance scripts, may inadvertently trigger this alert if they employ revoked drivers. A related detection, such as monitoring for driver signature violations (Event ID 5038), can complement this rule to enhance detection capabilities related to driver integrity issues.

