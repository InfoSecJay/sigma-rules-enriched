note: |
  ### Technical Context
  This rule detects instances where an unsigned image is loaded into a Windows system. Unsigned images may introduce vulnerabilities or be indicative of malicious software execution, as legitimate software is typically signed by a trusted publisher. In a typical attack scenario, an adversary may leverage unsigned binaries to bypass application controls, thereby executing unauthorized code with potentially elevated privileges. The primary objective of attackers using this tactic is to maintain persistence or conduct further attacks by executing malicious payloads without triggering security defenses.

  This detection relates primarily to the MITRE ATT&CK tactic of **Privilege Escalation** (TA0004), specifically focusing on the technique **Exploitation of Vulnerability** (T1203) and **Bypass User Account Control** (T1088), where unsigned images can exploit processes without normal scrutiny. The best sources of telemetry for this detection are Windows Code Integrity logs that capture operational events concerning image loads, specifically `EventID 3037`, which signals that an unsigned image has been detected in the system.

  ### Investigation Steps
  - **Review Code Integrity Logs:** Collect and analyze Windows Code Integrity operational logs looking for `EventID 3037`. This will provide details on which unsigned image was loaded and the context of its execution.
  - **Correlate Process Creation Events:** Cross-reference the logged unsigned image events with process creation logs (e.g., `EventID 4688`) to identify the parent process and its origin, assessing if the execution correlates with any known malicious activities.
  - **Assess Image Publisher Information:** Investigate the publisher of the unsigned image to determine if it's a known or trusted vendor. Use tools or services that check the reputation of the executable to further assess risk.
  - **Evaluate System Changes:** Look for any recent changes in system configuration that could have allowed for the execution of unsigned code, such as modifications to application control policies or exploits of known vulnerabilities.

  ### Prioritization
  This alert has a **high** severity level due to the potential for unsigned images to facilitate privilege escalation, leading to system compromise and data breaches. The risk of exploitation is significant, particularly in environments with sensitive data or critical infrastructure.

  ### Blind Spots and Assumptions
  Detection logic relies on the presence of Code Integrity logs, which must be properly configured on Windows systems to capture unauthorized code execution. If the Code Integrity feature is disabled or improperly configured, unsigned image load events will not be captured. Additionally, the detection assumes that the absence of a digital signature correlates with malicious intent, which may not always be the case, especially in custom or legacy applications. There is a potential blind spot for unsigned images that are executed under benign circumstances, so manual investigation and context are crucial for confirming threats.

