  ### Technical Context

  This Sigma rule detects the loading of unsigned images into the Windows operating system, specifically captured by Event ID 3037 from the Code Integrity operational logs. The likely objective of an attacker may include privilege escalation, deployment of malicious code, or exploitation of system vulnerabilities by bypassing application control mechanisms. The relevant MITRE ATT&CK tactics and techniques are: **Execution (T1203)** and **Privilege Escalation (T1068)**. The primary telemetry source is the Windows Code Integrity operational logs, which capture when unsigned images are loaded.

  If the detected behavior is malicious, it could lead to significant security impacts such as executing unauthorized software, compromising system integrity, or facilitating further attacks within the enterprise environment. However, this detection does NOT on its own confirm malicious intent, as there are legitimate scenarios where unsigned images may be loaded, such as during software development or when using test utilities.

  ### Investigation Steps

  - **Check Event ID 3037 logs**: Review logs for Event ID 3037 in the Code Integrity operational log. Look for specific unsigned image paths. Identify if these images are commonly associated with known applications or development tools.
  - **Identify image execution origin**: Determine the parent process of the unsigned image using Sysmon Event ID 1. A legitimate process might be Windows Update or a known application installer, whereas a suspicious parent could suggest malicious activity.
  - **Validate file signatures**: Use the `sigcheck` tool or Windows built-in utilities to verify the digital signature of the loaded image. Unsigned images that appear unexpectedly should be treated with suspicion.
  - **Review recent changes in software deployment**: Investigate if there were any recent installations or updates of software that might explain the loading of the unsigned image. Validate against sanctioned software lists.
  - **Analyze host environment**: Confirm the role of the affected host (e.g., domain controller, web server). Unsigned images on critical systems, such as servers, should be prioritized for in-depth analysis.
  - **Monitor for follow-up behavior**: Look for subsequent unusual actions following the loading of the unsigned image, such as modifications in user privileges or attempts to establish network connections to unknown IPs.

  ### Prioritization

  The severity of this alert is high because the detection is indicative of potential privilege escalation or exploitation, especially on critical systems. Given the likelihood of malicious abuse, especially if combined with further suspicious activities, immediate triage is warranted. Additionally, the loading of unsigned images is a known tactic among adversaries looking to bypass application controls.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like the use of signed images that have been modified or repackaged by an adversary to appear legitimate. For reliable detection, ensure that Code Integrity logs are enabled and adequately configured. Legitimate activities may trigger this alert during development cycles or while testing new software. A related detection for enhanced visibility is monitoring software installation logs (e.g., Windows Installer Event ID 1033) to correlate software changes with unsigned image loading events.

