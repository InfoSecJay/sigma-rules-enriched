  ---

  ### Technical Context

  This Sigma rule detects the loading of a revoked kernel driver in a Windows environment. Attackers may aim to use revoked drivers to gain kernel-level privileges, facilitating unauthorized access or persistent control over the system. This behavior is linked to the MITRE ATT&CK tactic of Privilege Escalation (Tactics: TA0004, Techniques: T1203). The primary telemetry source comes from Windows Code Integrity operational logs, specifically Event IDs 3021 and 3022. If malicious, the security impact could be significant, potentially allowing the attacker control over the machine at a high privilege level. Importantly, this detection does NOT confirm the malicious intent of the driver on its own; further investigation is necessary to determine if the driver is indeed harmful or has legitimate purposes.

  ---

  ### Investigation Steps

  - **Check Event Details**: Examine Event ID 3021/3022 in Windows Code Integrity operational logs, looking for the specific driver name and publisher details. Legitimate drivers are typically signed by known publishers, while revoked drivers may lack credible signatures.

  - **Verify Driver Origin**: Use file system forensic tools to locate the driver file referenced in the logs (e.g., located in C:\Windows\System32\drivers). Check its properties to confirm when it was created and its digital signature. A driver created or modified recently from an unknown source is suspicious.

  - **Investigate Kernel Debugger Associations**: For Event ID 3022, identify if a kernel mode debugger was attached at the time of the event. If a debugger is present, cross-reference debugger logs to verify if legitimate debugging activities correspond with the loaded driver behavior.

  - **Analyze Process Creation Events**: Look for associated malicious behavior by reviewing Security Event ID 4688 for process creation tied to the revoked driver. Identify any unusual parent processes or command-line arguments that could indicate exploitation or manipulation.

  - **Assess System Functionality**: Evaluate whether the system shows any unusual behavior, such as crashes or instability, after the driver was loaded. Legitimate drivers should not induce significant instability or performance degradation.

  - **Cross-Reference with Other Alerts**: Check for any related alerts or detections from endpoint security solutions that may indicate further malicious activity. Correlate findings to see if this alert aligns with additional suspicious behavior on the network or endpoints.

  ---

  ### Prioritization

  This alert is high-severity due to the potential impact of a compromised kernel driver on critical systems. Malicious actors often exploit revoked drivers for privilege escalation, making it a significant threat vector in enterprise environments. Such behavior is not commonly benign and often leads to system-level intrusions.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the possible absence of certain logging configurations; ensure that Code Integrity logging is enabled in the Windows environment. Certain legitimate activities, such as development work or debugging by internal IT staff, may trigger this alert without malicious intent. Related detections include monitoring for other privilege escalation attempts (e.g., abnormal use of PowerShell or exploitation of known vulnerabilities) which can provide additional context to the alert.

