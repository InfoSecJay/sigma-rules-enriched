note: |
  ### Technical Context
  This detection rule focuses on identifying the loading of revoked kernel drivers within a Windows operating system environment. Revoked kernel drivers can indicate unauthorized or potentially malicious modifications to the system, as these drivers are no longer trusted by the operating system to operate safely. Attackers may leverage revoked drivers to bypass security measures, escalate privileges, or persist within the system undetected. The goal of this detection is to alert security teams when such potentially harmful drivers are loaded, thereby allowing for immediate investigation and response.

  The relevant MITRE ATT&CK tactics for this behavior include **Privilege Escalation** (T1068) as attackers may load unauthorized drivers to gain elevated access to system resources. The attack could also be part of an ongoing effort to establish a foothold within the network or to execute malicious payloads with higher privileges. The primary data source for this detection will be Windows Code Integrity operational logs, specifically Event IDs 3021 and 3022, which provide information about any revoked kernel modules being loaded and any conditions under which they were allowed to load.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Code Integrity operational logs for Event ID 3021 and 3022 to identify which revoked kernel driver was loaded and the context surrounding its loading event.
  - **Analyze Driver Signature**: Verify the digital signature of the loaded kernel driver to confirm its revoked status. This may involve checking against trusted signature databases or certificate authorities.
  - **Investigate Related Processes**: Identify processes related to the loading of the revoked driver. Look for unusual parent-child relationships or unexpected execution paths that could indicate malicious intent.
  - **Check for System Changes**: Assess the system for any recent changes or unusual modifications (e.g., system files, registry, or configurations) that may correlate with the loading of the revoked driver.

  ### Prioritization
  This alert warrants a high severity rating due to the potential implications of loading revoked kernel drivers, which could indicate unauthorized access, system compromise, and the execution of malicious activities. Prompt investigation is critical to minimizing risk and malware persistence within the enterprise.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments with inadequate logging practices for Windows Code Integrity events, as this could prevent detection of revoked driver loads altogether. The detection logic assumes that the security posture of the organization effectively utilizes driver signing and that no legitimate processes operate revoked drivers for necessary functions. For the alert to function correctly, Code Integrity logging must be enabled and properly configured to capture relevant events.

