note: |
  ### Technical Context

  This Sigma rule detects the loading of a revoked kernel driver on a Windows system, as indicated by the Code Integrity operational log events (Event IDs 3021 and 3022). The likely attacker objective is to exploit vulnerabilities in the kernel driver to gain elevated privileges, execute malicious code, or maintain persistence. This behavior is relevant to the MITRE ATT&CK tactic of Privilege Escalation (ID: T1068) and the technique involving Exploitation for Client Execution (ID: T1203).

  The primary telemetry source for this detection is the Code Integrity operational log, specifically Event IDs 3021 and 3022. If malicious, this action can lead to significant security impact, including system compromise and unauthorized access to sensitive data. However, this detection does NOT confirm malicious activity on its own, as legitimate applications or drivers could potentially be misconfigured or improperly revoked.

  ### Investigation Steps

  - **Review Event Log details:** Check the Code Integrity operational log for Event IDs 3021 or 3022. Look for details such as the image path and publisher information to determine if the loaded kernel module is expected or known to be malicious.

  - **Verify driver integrity:** Cross-check the identified kernel driver against trusted repositories or Microsoft documentation to confirm if it is indeed revoked. Legitimate drivers should be signed and authorized by a known publisher.

  - **Check for debugger status:** Investigate whether a kernel mode debugger was attached at the time of the event (Event ID 3022). If so, determine the legitimacy of the debugger attached to the system.

  - **Identify related malicious activity:** Investigate for other signs of privilege escalation. Review Security Event ID 4672 to check for attempts to make use of special privileges by processes running at the time the revoked driver was loaded.

  - **Search for previously loaded drivers:** Use Sysinternals tools (like Autoruns) to identify any previously loaded drivers that may have been part of a malware installation process or related to suspicious activity on the host.

  - **Assess host role and criticality:** Determine the role of the affected system. If it is a domain controller, database server, or other critical infrastructure, prioritize further forensic analysis.

  ### Prioritization

  The alert has high severity due to the potential for privilege escalation and system compromise. The affected system may support critical operations, making the likelihood of malicious abuse significant, particularly if the revoked driver is not from a verified source and known to be exploitable.

  ### Blind Spots and Assumptions

  Detection may miss legitimate kernel drivers that have been revoked due to misconfiguration or transient conditions. Required log sources include enabled Code Integrity operational logs. Common scenarios that can trigger this alert may involve legitimate software updates or mismanagement of driver signatures. A companion detection rule for monitoring high-privilege account logins (e.g., Event ID 4624) may strengthen coverage.

