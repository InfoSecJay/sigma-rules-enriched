logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'Application Error'
    EventID: 1000
    Data|contains|all:
    - 'MsMpEng.exe'
    - 'mpengine.dll'
  condition: selection
falsepositives:
- MsMpEng might crash if the "C:\" partition is full
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious crashes of the Microsoft Malware Protection Engine (MsMpEng.exe), specifically when the application reports an error involving the mpengine.dll module. Such events could indicate potential tampering or exploitation attempts against the security software, undermining its capability to protect the system from malware. Attackers may aim to disable or bypass security controls, thereby enabling malware execution or lateral movement within the environment.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (TA0005)**, where attackers use techniques to avoid detection or impact the security controls. Particularly, techniques such as **T1211: Exploitation for Client Execution** and **T1562.001: Disable or Modify Tools** are applicable, as these actions are directly associated with disabling the Malware Protection Engine. The primary telemetry sources to investigate include Windows application logs that capture crashes (Event ID 1000), which can provide insights into the context and frequency of these events.

  ### Investigation Steps
  - **Review Application Logs:** Examine Windows Application event logs for multiple instances of Event ID 1000 related to MsMpEng.exe, paying attention to the timing and frequency of these crashes.
  - **Analyze Environment Health:** Assess system storage to check for disk space issues or other environmental factors that might cause legitimate crashes, differentiating between benign and suspicious activity.
  - **Check Other Security Events:** Look for additional security events or anomalies surrounding the time of the crash, such as unexpected file modifications or alterations to security settings that could indicate an attempted exploitation.
  - **Correlate with User Activity:** Investigate potential user actions or software updates that coincide with the crash events, such as installation of unverified applications or changes to system configurations that could affect security operations.

  ### Prioritization
  This alert is marked as high severity due to the potential immediate impact on endpoint protection. A successful compromise of the Malware Protection Engine can expose the system to malware and post-exploitation threats, increasing the likelihood of further breaches within the enterprise.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include misses on non-standard configurations of the Malware Protection Engine or instances where the engine's crash is triggered by legitimate environmental conditions. The detection logic assumes that abnormal crashes are not due to benign operational issues, which may not always hold true. Additionally, proper logging of application errors must be enabled within the Windows event logging configuration for effective detection and monitoring of the rule.

