note: |
  ### Technical Context

  This rule detects crashes of the Microsoft Malware Protection Engine (MsMpEng.exe) due to certain errors in the execution environment. An attacker may exploit this crash to disable critical security features, thereby achieving their objective of evading detection during malicious activities such as malware execution or data exfiltration. This behavior correlates with the MITRE ATT&CK tactics of Defense Evasion (T1203) and Impact (T1685).

  The primary telemetry source for this detection is application event logs, specifically focusing on Event ID 1000 for application errors related to MsMpEng.exe. If this behavior is confirmed to be malicious, it could result in significant security vulnerabilities as it disables core protective mechanisms. However, this detection does NOT confirm that an attack is occurring; it merely indicates that the Malware Protection Engine has crashed.

  ### Investigation Steps

  - **Check Event Logs for Crash Details:** Review Windows Event Viewer under Application logs for Event ID 1000 where the faulting application is MsMpEng.exe. Look for additional fields like "Faulting module name" to identify if any specific modules (e.g., mpengine.dll) were involved.

  - **Correlate with Antivirus Activity:** Validate if there has been recent legitimate antivirus activity before the crash. Check for scheduled scans or updates in the Windows Event Logs (Event ID 7030), which can explain a benign cause.

  - **Identify High-Confidence Malicious Activity:** Look for associated events that indicate malware activity around the same time as the crash, particularly any abnormal or unauthorized execution of files flagged by the Microsoft Malware Protection Engine (using Event ID 4688 for process creation).

  - **Evaluate Disk Space on the System:** Analyze available disk space on the C:\ drive, as a full disk partition is a common benign reason for MsMpEng to crash. Ensure that at least 10% of the drive is free to rule out this benign cause.

  - **Cross-Reference with Known Vulnerabilities:** Investigate any presence of reported vulnerabilities associated with MsMpEng or mpengine.dll. Check for any recent updates or patches that should have been applied (Windows Update logs).

  - **Monitor Subsequent Behavior:** If the engine crash is confirmed non-malicious, ensure continuous monitoring for repeat occurrences to rule out system instability or recurring exploits. Use log sources like Sysmon for any follow-on suspicious behavior from the same host.

  ### Prioritization

  This alert is considered high severity due to the potential impact on the affected system, as it disables critical security measures. The likelihood of malicious exploitation is significant since attackers frequently target security products to enable undetected operations. This behavior is commonly weaponized, especially in sophisticated attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the logs' retention settings or lack of coverage if Event ID 1000 is not collected due to misconfiguration. Legitimate system issues, such as full disk warnings, may trigger this alert without indicating actual attacks. Companion detections, such as monitoring for unusual process creation (Event ID 4688) immediately following the crash, strengthen overall detection capabilities and context for investigation.

