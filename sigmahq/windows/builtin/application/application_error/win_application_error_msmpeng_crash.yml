detection:
  selection:
    Provider_Name: 'Application Error'
    EventID: 1000
    Data|contains|all:
    - 'MsMpEng.exe'
    - 'mpengine.dll'
  condition: selection
falsepositives:
- MsMpEng might crash if the "C:\" partition is full
level: high
note: |
  ### Technical Context

  This Sigma rule detects a abnormal termination of the Microsoft Malware Protection Engine (MsMpEng.exe), which can indicate an attempt by an attacker to evade detection by crashing the antivirus engine. The likely attacker objective is to disable endpoint protection mechanisms, facilitating subsequent malicious actions such as malware execution or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic “Defense Evasion” (ID: TA0005) and technique “Indicator Removal on Host” (ID: T1112).

  The primary telemetry sources for this detection are Windows application event logs, specifically targeting Event ID 1000 that logs application errors. If this event is triggered maliciously, it can pose significant security risks by leaving endpoints vulnerable to further attacks. However, this detection alone does not confirm malicious intent; for example, legitimate application crashes can occur under various circumstances.

  ### Investigation Steps

  - **Verify event details: **Review the Event ID 1000 entries in the Windows Event Viewer under Application logs to confirm the crashing details of MsMpEng.exe. Check the "Faulting module name" and "Faulting application path" for anomalies.

  - **Determine the conditions of the crash:** Assess surrounding events (Event IDs before or after 1000) in the application logs for patterns. For example, the presence of Event ID 7031 indicating service crashes closely following Event ID 1000 may suggest coordinated abuse.

  - **Identify potentially malicious indicators:** Look for accompanying events in the Windows Security log, such as Event ID 4688 (Process Creation) showing execution of unknown processes or suspicious command-line arguments shortly before the crash. Focus on unusually named or newly created executables.

  - **Contextualize with legitimate behavior:** Determine if the environment had legitimate activities that can cause such crashes, such as recent updates to Microsoft Defender or disk space issues. Check if the C:\ partition is full, as this can lead to application instability.

  - **Assess asset criticality:** If the endpoint associated with the crash is a critical server (e.g., domain controller, file server), prioritize the investigation as malicious activity may have a higher impact.

  - **Monitor for additional symptoms:** Correlate with other detections of exploits or malicious files related to MsMpEng.exe. Review for any recent security alerts related to Microsoft vulnerabilities (e.g., CVE-2020-17087) that may provide context to the engine's crash.

  ### Prioritization

  The alert severity is high due to the potential impact on endpoint security and the likelihood of exploitation by attackers attempting to disable antivirus capabilities. This behavior is not commonly observed during regular operations and points to possible weaponization in attacks targeting Microsoft environments.

  ### Blind Spots and Assumptions

  There are known evasion techniques, such as crashing the malware engine using malformed entries or scripts, that may not be captured by this detection. Further, if the logging level for the application errors is not set correctly, the necessary Event ID 1000 logs might not be available. Legitimate activities, such as misconfigurations or corruption in the antivirus database, could trigger similar alerts. A related detection to strengthen coverage would be monitoring for unusual process creations or service interruptions associated with Microsoft Defender services (e.g., Event ID 7031).

