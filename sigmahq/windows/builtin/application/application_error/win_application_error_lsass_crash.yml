title: LSASS Process Crashed - Application
id: a18e0862-127b-43ca-be12-1a542c75c7c5
status: experimental
description: |
  Detects Windows error reporting events where the process that crashed is LSASS (Local Security Authority Subsystem Service).
  This could be the cause of a provoked crash by techniques such as Lsass-Shtinkering to dump credentials.
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
- https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-07
modified: 2025-12-03
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: application
detection:
  selection:
    Provider_Name: 'Application Error'
    EventID: 1000
    AppName: 'lsass.exe'
    ExceptionCode: 'c0000001'     # STATUS_UNSUCCESSFUL
  condition: selection
falsepositives:
- Rare legitimate crashing of the lsass process
level: high
note: |
  ### Technical Context

  This rule detects instances where the LSASS (Local Security Authority Subsystem Service) process crashes, indicated by Windows event logs featuring Event ID 1000 from the 'Application Error' source with an ExceptionCode of 'c0000001'. Typically, this behavior may arise from malicious activities such as "Lsass-Shtinkering," where an adversary intentionally crashes LSASS to extract credentials stored in memory for further exploitation. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), specifically technique T1003.001 (LSASS Memory).

  The primary telemetry source for this detection is Windows Application Event Logs. A malicious LSASS crash could lead to significant security issues, as it may enable unauthorized access to sensitive credentials. However, this detection does NOT confirm that any credential theft has occurred on its own; further investigative steps are necessary to confirm exploitation.

  ### Investigation Steps

  - **Review Windows Event Logs for Event ID 1000:** Check Application logs for event entries that indicate "lsass.exe" as the faulting application with an ExceptionCode of 'c0000001'. Take note of the timestamp for correlation with other alerts.

  - **Correlate with Credential Dumping Tools:** Investigate for the presence of known tools or techniques that facilitate credential extraction, such as Mimikatz or similar, coinciding with the LSASS crash. Look for any anomalous process executions (Event ID 4688) preceding the reported crash.

  - **Examine Recent Network Connections:** Review Windows Firewall logs (Event ID 5156) and network traffic for any unusual outbound connections originating from the affected host shortly after the LSASS crash. Look for connections targeting remote machines or indicative of lateral movement.

  - **Validate System Configurations:** Ensure that no recent changes were made to services related to LSASS or security configurations. Check for any modifications in Local Security Policies that might allow non-privileged users to access LSASS memory.

  - **Identify Legitimate Process Behavior:** Confirm expected behavior on the affected system by validating processes that typically interact with LSASS (like Windows authentication activities). Typical legitimate activity should show regular access patterns without affecting LSASS stability.

  - **Check for Multiplicity of Crashes:** Determine if this incident is a one-time event or part of a series of LSASS crashes. Frequent crashes can indicate attempts by an adversary to exploit vulnerabilities or perform credential dumping continuously.

  ### Prioritization

  This alert is considered high severity due to the critical role of LSASS in managing system security and user authentication. The likelihood of malicious abuse is elevated, as credential dumping techniques are commonly weaponized by attackers. Any crash of LSASS could potentially expose sensitive credentials, making it imperative for SOC teams to respond swiftly.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as legitimate applications inadvertently causing LSASS crashes or attackers using refined methods that do not trigger conventional error codes. Reliable detection requires comprehensive log collection from Windows Event Logs and monitoring for legitimate software that might inadvertently induce these alerts. Legitimate activities, such as debugging tools or misconfigurations, might also trigger this rule. A companion detection could include monitoring for abnormal behavior in credential access logs, such as repeated failed login attempts.

