logsource:
  product: windows
  service: application
detection:
  selection:
    Provider_Name: 'Application Error'
    EventID: 1000
    AppName: 'lsass.exe'
    ExceptionCode: 'c0000001'     # STATUS_UNSUCCESSFUL
  condition: selection
falsepositives:
- Rare legitimate crashing of the lsass process
level: high
note: |
  ### Technical Context

  This rule detects instances where the LSASS (Local Security Authority Subsystem Service) process crashes, specifically indicated by Windows Application Error events (Event ID 1000) with an exception code of `c0000001`. Attackers may trigger this behavior as part of credential dumping techniques, particularly through methods like "Lsass-Shtinkering." The primary objective likely involves obtaining sensitive credential information stored in memory.

  This detection is associated with the MITRE ATT&CK technique for Credential Access: LSASS Memory (T1003.001). The primary telemetry source is Windows Application logs, specifically looking for error events linked to the LSASS process. If malicious, this behavior may lead to unauthorized access to user credentials and potentially compromise the entire system. It is important to note that the detection of this crash does not confirm that credential dumping has occurred; further investigation is required to establish malicious intent.

  ### Investigation Steps

  - **Check for LSASS crash logs:** Review Windows Application logs for Event ID 1000 with `AppName: lsass.exe` and `ExceptionCode: c0000001`. Confirm the presence of this event within a clear timeframe of other unusual activities such as process creation by non-system accounts.

  - **Correlate legitimate activity:** Assess any known legitimate maintenance or software updates that may have caused the LSASS process to crash. If other legitimate processes or applications have crashed around the same time, document these for context.

  - **Identify high-confidence malicious indicators:** Cross-reference the crash events with Sysmon logs (Event ID 10) to check for any processes that may have spawned immediately prior to the LSASS crash, particularly those with behavioral signatures of credential dumping (e.g., `procdump.exe`, custom scripts).

  - **Analyze user activity logs:** Investigate Windows Security logs (Event ID 4624) for user logon attempts consistent with the crash timing. Look for any suspicious account behavior, especially failed login attempts or administrative account logins from unusual locations.

  - **Validate potential credential dumping:** Examine memory dump artifacts if available. Use tools like Volatility to analyze memory images for signs of credential dumping tools being executed, or check for unusual file accesses that involve LSASS memory.

  ### Prioritization

  Alerts triggered by LSASS process crashes should be treated with high severity due to their potential impact on credential security. The likelihood of this behavior being abused by adversaries is significant, as techniques targeting LSASS memory are well-documented and commonly used in attacks.

  ### Blind Spots and Assumptions

  Detection may miss instances where legitimate software updates or system events crash LSASS, creating false positives. Reliable detection requires logging configurations that capture Application Error events; ensure that logging levels are appropriately configured. Legitimate activities that could cause LSASS to crash include system updates or third-party software interacting with security policies. To strengthen coverage, consider monitoring for related events like abnormal memory access attempts (Sysmon Event ID 10) that could indicate additional attempts at credential extraction.

