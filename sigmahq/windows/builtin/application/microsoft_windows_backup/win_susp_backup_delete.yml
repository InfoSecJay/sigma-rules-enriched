  ### Technical Context

  This rule detects the deletion of a backup catalog via Event ID 524 from the Microsoft-Windows-Backup provider. The likely attacker objective is to disrupt data recovery capabilities or to cover tracks by destroying evidence of previous backups, potentially affecting business continuity. This behavior correlates with the MITRE ATT&CK technique "Indicator Removal on Host" (T1070.004). The primary telemetry source is Windows application logs, specifically capturing events related to backup operations. If malicious, the impact could lead to significant data loss and inability to recover critical systems or data. Importantly, this detection does NOT confirm that the deletion was malicious on its own; legitimate administrative activities could also trigger this alert.

  ---

  ### Investigation Steps

  - **Check Windows Event Logs for Deletion Events:** Review Security Event ID 524 in the Windows Event Log, filtering by the Provider_Name "Microsoft-Windows-Backup". Legitimate backup deletions will typically show administrative users and timestamps aligned with scheduled maintenance windows.

  - **Verify User Activity:** Identify the user or process that triggered the backup catalog deletion by examining related logs for user authentication (Event ID 4624) or process creation (Event ID 4688). A pattern of actions from an administrative account may indicate legitimate behavior, while unexpected user accounts may warrant further investigation.

  - **Review Backup Solution Configuration:** Investigate configurations for backup applications (e.g., Windows Server Backup or third-party solutions) to ensure proper logging is enabled to capture all relevant deletion activities. Lack of logging might indicate a blind spot in backup monitoring.

  - **Analyze System Integrity and Recovery Options:** Assess the state of backup and recovery systems, including verifying existing backup copies against known good states. Missing or corrupted backups post-deletion should be flagged for immediate remedial action.

  - **Check for Compromise Indicators:** Look for high-confidence malicious indicators, such as unauthorized scheduled tasks or persistent modifications to systems (Event ID 4697 for service creation). This may suggest that the deletion of backup catalogs was part of a broader attack.

  ---

  ### Prioritization

  The medium severity of this alert considers the potential impact on systems that rely on backups for recovery, paired with the likelihood of malicious use to conduct further exploitation. Such actions are known tactics in ransomware and destruction of evidence scenarios, underscoring the need for timely investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded through backup solutions configured without adequate logging, making it difficult to distinguish between legitimate and malicious deletions. Legitimate automated cleanup and maintenance processes may trigger this alert without malicious intent. Consider implementing companion detections, such as monitoring for unusual file access patterns to backup directories or irregular deletion activity across sensitive system logs, to enhance monitoring coverage.

