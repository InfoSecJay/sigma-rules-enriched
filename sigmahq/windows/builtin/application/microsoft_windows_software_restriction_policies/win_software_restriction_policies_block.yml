note: |
  ### Technical Context

  This Sigma rule detects instances where access to applications is restricted by Software Restriction Policies (SRP) in a Windows environment. The likely attacker objective is to circumvent security measures to execute unauthorized applications, potentially leading to lateral movement or execution of malicious payloads. Relevant MITRE ATT&CK technique includes **T1072: Software Deployment Tools** under the **Execution** and **Defense Evasion** tactics. Primary telemetry sources for this detection are Windows Event Logs, specifically monitoring Event IDs (865-868) associated with SRP violations. If malicious, unauthorized application execution could lead to severe system compromises and data breaches. This detection does NOT confirm that an attack is occurring; it only indicates that an attempt to access a restricted application has been made.

  ### Investigation Steps

  - **Review Event Logs for Violations**: Check Windows Event Logs for Event IDs 865–868 related to restricted software access. Identify the application name involved and the user account attempting access to determine the context of the violation.

  - **Validate the Configuration of SRPs**: Verify the current Software Restriction Policies in place for the affected system (using `Get-AppLockerPolicy` in PowerShell). Confirm if the blockage aligns with organizational policy or if it highlights a potential misconfiguration.

  - **Determine User Intent**: Investigate legitimate use cases for the blocked application. Contact the user associated with the violations to ascertain if the application was needed for their role or if they are performing unauthorized actions.

  - **Identify Malicious Indicators**: Look for patterns in the blocked applications that are known to be frequently abused (e.g., PowerShell, cmd.exe, or other scripting tools). Focus on Event IDs where the file path or publisher indicates potential malicious use.

  - **Analyze IT Asset Criticality**: Consider the criticality of the host reporting the violation. If it's a highly privileged system (e.g., domain controller), prioritize investigation as it could indicate an advanced persistent threat attempting to escalate access.

  - **Audit File Creation or Exfiltration**: If applicable, cross-reference with Sysmon Event ID 11 (file creation time) or Windows Security Event ID 4688 (process creation) to identify any related malicious file operations leading up to the alert.

  ### Prioritization

  This alert carries a high severity status due to its potential impact on critical systems and the likelihood that an adversary could exploit restricted software access to facilitate lateral movement or execute unauthorized applications. Such behaviors are commonly observed in targeted attacks, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations include possible legitimate activity when users encounter blocked software if they unknowingly attempt to launch applications restricted by SRP. Required log sources must be properly configured to capture all relevant SRP events; failure to do so may result in undetected malicious activity. Related detections, such as monitoring for abnormal login attempts or unusual process creation patterns, can strengthen overall coverage against potential evasion techniques that an attacker might employ.

