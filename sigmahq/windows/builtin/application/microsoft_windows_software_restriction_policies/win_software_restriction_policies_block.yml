  ---

  ### Technical Context

  This rule detects attempts to access applications that are restricted by Software Restriction Policies (SRP) on Windows systems, indicating potential unauthorized or malicious behavior. The likely objective of an attacker triggering this rule would be to bypass security measures in an attempt to execute unauthorized software or gain further access to the system. This activity relates to the MITRE ATT&CK tactics, specifically **Lateral Movement (TA0008)** and **Execution (TA0002)**, employing techniques such as **T1072: Software Deployment Tools**.

  The primary telemetry source for this rule is the Windows Event Log, specifically events generated by the Software Restriction Policies provider. A significant security impact would arise if an adversary successfully bypasses these restrictions, allowing the execution of malware or other unauthorized applications, which could lead to system compromise or data exfiltration. Importantly, this detection does NOT confirm that a malicious action has occurred, as legitimate software-related activity could trigger similar logs.

  ---

  ### Investigation Steps

  - **Review triggered event details**: Check Windows Event IDs 865-868 and 882, focusing on the Event Message for application paths and rule identifiers. Identify if the restricted applications are known and whether the paths correlate with legitimate operations.

  - **Correlate with user activity**: Investigate user account activity logged within Security Event ID 4624 (Logon) around the same time the SRP events were generated. Look for patterns of repeated attempts to access restricted applications that deviate from typical user behavior.

  - **Identify high-risk applications**: Cross-reference the restricted applications with commonly exploited software such as remote access tools or known vulnerable applications. If these applications appear in the logs, report for further investigation.

  - **Evaluate expected behavior**: Determine the legitimate software needs within the organization. Confirm if there are valid exceptions in place that require access to restricted applications by authorized personnel; unexpected access attempts may indicate compromise.

  - **Assess asset criticality**: Identify the role of the affected system (e.g., domain controller, workstation, server) to ascertain the potential impact. A violation on a critical asset or server warrants increased urgency for investigation.

  - **Check for evasion signatures**: Monitor for common evasion techniques, such as unusual process creation events associated with restricted applications, by reviewing Sysmon Event ID 1. Identify if processes are being spawned in a non-standard way indicating malicious activity.

  ---

  ### Prioritization

  This alert holds high severity due to its potential impact on critical systems. The likelihood of malicious abuse is significant, especially in environments where users may attempt to execute unauthorized tools for lateral movement or execution of malware. This behavior is also a common vector adopted by adversaries, making timely investigation crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by systems that do not enforce SRPs or configurations that fail to log these events correctly. Legitimate activities, such as software updates or administrative tasks, can trigger similar alerts if not understood in context. A companion detection to consider is monitoring for unauthorized software installations via Windows Event ID 11724 as it may further highlight attempts to circumvent software policy controls.

