note: |
  ### Technical Context
  This detection rule identifies instances where applications have been restricted from executing on Windows systems based on Software Restriction Policies (SRP). The alerts are triggered when SRP logs indicate that access to specified applications is blocked, which may suggest abnormal behavior or an attempt by malicious actors to evade detection while executing unauthorized software. Attackers may seek to leverage restricted software for lateral movement within the network or to conduct other malicious activities, which aligns with their objectives of maintaining persistence or exfiltrating data.

  The relevant MITRE ATT&CK tactics that apply here include *Execution* (TA0002), as the policy restricts the execution of processes, and *Defense Evasion* (TA0005), as attackers often attempt to bypass security controls to run their tools or scripts undetected. The specific technique represented in this detection is *Software Deployment Tools* (T1072), which encompasses various methods of executing unauthorized applications.

  Primary data sources for this detection include Windows event logs, specifically application event logs that capture SRP-related events. These logs can provide insights into unauthorized access attempts to applications that are governed by SRP, helping security teams assess whether these attempts are legitimate or potentially indicative of malicious activity.

  ### Investigation Steps
  - **Review SRP Log Events:** Analyze Windows application event logs for Event IDs 865, 866, 867, 868, and 882 to identify specific applications being blocked and the associated paths or publisher information. This can help determine the context and legitimacy of the attempted access.

  - **Correlate with User Activity:** Check user account activities during the timeframe of the restricted access events to verify whether the actions align with normal user behavior or if they suggest anomalous activity indicative of a more significant security concern.

  - **Investigate Anomalous Applications:** Conduct a review of the applications that are being restricted to determine if they are known, trusted applications or if they are potentially harmful tools typically used in threat scenarios. Focus on any unfamiliar applications that may require scrutiny.

  - **Examine System Changes:** Check for any system or policy changes that may have occurred just before the blocked access events, such as modifications to the SRP configurations or installations of new software that could lead to blocked execution attempts.

  ### Prioritization
  This alert is considered high severity due to the potential implications of unauthorized software attempting to run in an enterprise environment. Restricted applications often relate to tools that can perform malicious activities, and their execution attempts may indicate ongoing exploitation efforts or lateral movement within the organization.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to applications not governed by SRP or in environments where SRP is not enforced consistently. The detection logic assumes all relevant software restriction events are logged and accessible, and that the SRP is appropriately configured on all systems. It also assumes that event logs are being collected and retained by the organization's logging infrastructure. Necessary configurations must ensure that the relevant event logging for SRP events is enabled on affected systems to maximize detection effectiveness.

