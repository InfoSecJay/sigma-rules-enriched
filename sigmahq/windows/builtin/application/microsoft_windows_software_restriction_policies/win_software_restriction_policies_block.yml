note: |
  ### Technical Context

  This rule detects restricted access attempts to applications as enforced by Software Restriction Policies (SRP) on Windows systems. Attackers might employ this tactic to execute malware or unauthorized software that is explicitly blocked by the organization's SRP, potentially aiming to maintain persistence or evade detection. This behavior aligns with the MITRE ATT&CK technique "Software Deployment Tools" (T1072), reflecting an adversarial move to bypass security controls.

  The primary telemetry sources include Windows Event Logs, specifically Event IDs 865, 866, 867, 868, and 882 generated by the Microsoft-Windows-SoftwareRestrictionPolicies provider. If malicious, this behavior indicates an attempt to bypass administrative controls and may signal a deeper compromise. Importantly, this detection does not confirm that the initiated access is malicious on its own, as there may be legitimate reasons for the blocked access.

  ### Investigation Steps

  - **Check relevant Event IDs:** Review Windows Security Event ID 865, 866, 867, 868, and 882 in the Event Viewer under Applications and Services Logs > Microsoft > Windows > SoftwareRestrictionPolicies to identify what application access was restricted and the policy applied.

  - **Identify the source of the access attempt:** Examine the originating process for the blocked application using Sysmon Event ID 1. Look for suspicious parenting relationships or unusual command line arguments that could indicate an attacker attempting to execute malware.

  - **Assess for benign conditions:** Review the system’s policy configurations to confirm if SRP is appropriately implemented and used as intended. Legitimate software access may trigger events if users attempt to install approved software that has not been properly whitelisted in SRP.

  - **Correlate user activity:** Validate the user context associated with the restricted access attempt. Check logs for recent user activity, particularly in the Security Event logs (Event ID 4624) for account logon events, ensuring that the user is not part of a normal operational workflow.

  - **Cross-check against known good data:** Compare the detected attempts with a list of sanctioned applications within the organization. If a flagged application is known and part of the business workflow, consider it a false positive.

  ### Prioritization

  This alert is high-severity due to the potential impact on critical systems when unauthorized software execution is attempted. The likelihood of exploitation is significant as malicious actors often attempt to maneuver around security policies. This behavior is commonly weaponized in targeted attacks to disable or bypass security mechanisms.

  ### Blind Spots and Assumptions

  Detection limitations include possible scenarios where legitimate software may be misconfigured or improperly deployed, inadvertently triggering SRP violations. Ensure that Windows Event Logging is properly configured to capture all relevant SRP events for comprehensive monitoring. Regular software updates and configurations are necessary to minimize false positives from legitimate software deployments. Considerations for companion detections could include monitoring for related process creation events or unusual network connections from identified suspicious applications.

