title: MSSQL Add Account To Sysadmin Role
id: 08200f85-2678-463e-9c32-88dce2f073d1
status: test
description: Detects when an attacker tries to backdoor the MSSQL server by 
  adding a backdoor account to the sysadmin fixed server role
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.persistence
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains|all:
    - 'object_name:sysadmin'
    - 'statement:alter server role [sysadmin] add member '
  condition: selection
falsepositives:
- Rare legitimate administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the addition of an account to the MSSQL `sysadmin` role, signaling a potential backdoor attempt by an attacker. The likely objective of this attack behavior is to establish ongoing access and control over the MSSQL server, allowing the adversary to perform data manipulation and extraction or to elevate privileges within the server environment. This activity aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) using the technique **Account Manipulation** (T1098).

  Primary telemetry sources include Windows Application Logs that capture MSSQL-specific events, particularly Event ID 33205, which requires prior enforcement of MSSQL audit policies. If malicious, this behavior could significantly undermine database integrity and security, facilitating unauthorized access and possible data exfiltration. This detection does NOT confirm malicious intent on its own, as it may result from rare legitimate administrative changes by database administrators.

  ### Investigation Steps

  - **Examine Event Logs:** Review Windows Application Logs for Event ID 33205. Focus on the `Data` field for entries containing 'object_name:sysadmin' and 'statement:alter server role [sysadmin] add member'. Record the actor's account used for this modification, as this will help in determining legitimacy.

  - **Identify account changes:** Verify the user or service account that executed the alteration. Trusted accounts typically have documented administrative roles. Unknown or unusual accounts performing this action should raise suspension.

  - **Assess audit logging configuration:** Confirm that MSSQL audit policies are properly implemented. Lack of these logs may indicate an unconfigured system that limits detection capabilities.

  - **Review recent administrative activities:** Look for other recent modifications made by the same account in the Windows Event Log (IDs 4624 and 4672). Compare patterns of behavior to identify potential anomalies indicative of malicious intent.

  - **Investigate legitimate usage:** Check for historical context on legitimate administrative tasks. For example, if an account is typically used for routine maintenance or updates, validate that this behavior aligns with established change management policies.

  - **Cross-reference related detections:** Notice if any detected lateral movement or privilege escalation behaviors exist in conjunction with this MSSQL modification. Use Event IDs related to privilege escalation (e.g., 4672) to identify extra-ordinary access patterns.

  ### Prioritization

  This alert carries a **high** severity level due to the critical nature of MSSQL servers in enterprise environments. If successfully exploited, it could allow an attacker to maintain persistent control over the server. The likelihood of malicious use is significant, as adding accounts to high-privilege roles is a known tactic for attackers seeking long-term access.

  ### Blind Spots and Assumptions

  Detection may have limitations due to reliance on the correctness of MSSQL auditing configurations. Attackers may utilize obfuscation techniques, such as using legitimate administrative accounts or naming conventions that mimic genuine administrative actions, to bypass detection. Additionally, routine administrative processes, such as automated scripts for maintenance or role adjustments, might trigger this alert without malicious intention. A related detection that strengthens coverage would be monitoring for unusual login attempts or access patterns from service accounts that correlate with changes to role memberships.

