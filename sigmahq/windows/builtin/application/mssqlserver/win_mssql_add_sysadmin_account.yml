title: MSSQL Add Account To Sysadmin Role
id: 08200f85-2678-463e-9c32-88dce2f073d1
status: test
description: Detects when an attacker tries to backdoor the MSSQL server by adding
  a backdoor account to the sysadmin fixed server role
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.persistence
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains|all:
    - 'object_name:sysadmin'
    - 'statement:alter server role [sysadmin] add member '
  condition: selection
falsepositives:
- Rare legitimate administrative activity
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to add an unauthorized account to the `sysadmin` fixed server role in Microsoft SQL Server (MSSQL). Attackers often aim to backdoor database access, which would grant them elevated privileges to either exfiltrate sensitive data or maintain a persistent presence within an enterprise environment. By leveraging SQL Server's role-based security model, rogue actors can facilitate further malicious activities without detection.

  The relevant MITRE ATT&CK tactics include **Persistence (T1546)**, as the attacker's goal is to implant a backdoor for continued access. Specifically, the technique employed here is **Privilege Escalation (T1068)** when the attacker gains administrative rights unchecked. The primary data sources necessary to capture this activity are MSSQL audit logs, which record administrative actions taken on the server when the MSSQL audit policy is enabled.

  ### Investigation Steps
  - **Examine MSSQL Audit Logs**: Review the MSSQL audit logs for Event ID 33205, which records any attempts to modify server roles, specifically looking for "add member" statements associated with the `sysadmin` role.
  - **Correlate with User Activity**: Analyze user account activity in your identity management system to determine if the account being added has a history of suspicious behavior or lacks an administrative purpose.
  - **Review Application Access Policies**: Check the access policies and roles assigned within the MSSQL environment for unusual configurations or recently modified privileges that might correlate with unauthorized access.
  - **Inspect Whitelisted Changes**: Identify legitimate administrative activity to rule out false positives, such as known scheduled administrative tasks or configurations that may have required similar adjustments.

  ### Prioritization
  This alert is considered high-severity due to the potential impact of unauthorized administrative access on database integrity and confidentiality. The likelihood of these actions being malicious increases, especially when observed across accounts with no prior administrative roles.

  ### Blind Spots and Assumptions
  The detection rule assumes that the MSSQL audit policy is enabled; without this configuration, logs relevant to unauthorized privilege changes may not be captured. Additionally, the rule may miss context from legitimate administrative activities that are rare but authorized, thus leading to potential false positives. Gaps in coverage may arise if attackers use other methods to escalate privileges that do not directly involve altering the `sysadmin` role.

