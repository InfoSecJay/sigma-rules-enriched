title: MSSQL XPCmdshell Option Change
id: d08dd86f-681e-4a00-a92c-1db218754417
status: test
description: |
  Detects when the MSSQL "xp_cmdshell" stored procedure setting is changed.
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2024-06-26
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 15457
    Data|contains: 'xp_cmdshell'
  condition: selection
falsepositives:
- Legitimate enable/disable of the setting
- Note that since the event contain the change for both values. This means that this
  will trigger on both enable and disable
level: high
note: |
  ### Technical Context
  This detection rule identifies changes to the setting of the "xp_cmdshell" stored procedure in Microsoft SQL Server, which is often abused by attackers to execute arbitrary commands on the underlying operating system. The "xp_cmdshell" procedure allows SQL Server to run shell commands, granting potentially malicious actors the capability to manipulate the server or escalate privileges. The rule focuses on monitoring a specific event (EventID 15457) that indicates whether this feature is enabled or disabled.

  Attackers often leverage this capability during lateral movement, privilege escalation, or when maintaining persistence in an environment. By enabling "xp_cmdshell," an attacker can execute command-line instructions, deploy malware, or extract sensitive information, all while masquerading their activities as legitimate database operations. Relevant tactics from the MITRE ATT&CK framework include Execution (T1203), as they enable the execution of commands from within the database environment.

  To effectively detect such activities, the most relevant data sources include SQL Server logs that contain detail on stored procedure executions and configurations. Specifically, EventID 15457 logs changes in the "xp_cmdshell" setting and should be monitored closely for any unauthorized modifications.

  ### Investigation Steps
  - **Review Event Logs:** Collect and analyze SQL Server logs for EventID 15457 to determine when "xp_cmdshell" was modified, noting the previous and current settings.
  - **Identify User Actions:** Investigate the user accounts that executed the change, checking for any anomalous user activity or privilege escalation attempts prior to the modification.
  - **Check for Related Execution:** Look for any instances of "xp_cmdshell" being called shortly after it was enabled; this may indicate malicious activity initiated by an attacker.
  - **Audit SQL Server Permissions:** Verify the privileges of users who have the ability to change the "xp_cmdshell" setting to ensure that only trusted administrators have access.

  ### Prioritization
  This alert is categorized as high severity due to the significant potential impact on security, where enabling "xp_cmdshell" can lead to compromise of the underlying operating system and unauthorized data access. The likelihood of exploitation increases when considering the capabilities it affords to threat actors.

  ### Blind Spots and Assumptions
  There may be detection gaps if SQL Server logs are not configured correctly to capture EventID 15457, or if logging retention periods are insufficient to analyze past changes. The detection logic assumes that any modification of "xp_cmdshell" is potentially malicious, which might not account for legitimate administrative updates or maintenance tasks. Proper logging configurations are required to ensure all relevant changes to SQL Server settings are captured.

