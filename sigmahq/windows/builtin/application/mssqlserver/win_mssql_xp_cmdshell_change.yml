logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 15457
    Data|contains: 'xp_cmdshell'
  condition: selection
falsepositives:
- Legitimate enable/disable of the setting
- Note that since the event contain the change for both values. This means that 
  this will trigger on both enable and disable
level: high
note: |
  ### Technical Context

  This Sigma rule detects changes to the `xp_cmdshell` stored procedure setting in Microsoft SQL Server, specifically monitoring for Event ID 15457 related to configuration alterations. An attacker may aim to enable `xp_cmdshell` to execute operating system commands, potentially leading to greater access or lateral movement within a network. The activity aligns with the MITRE ATT&CK technique T1059.003 (Command and Scripting Interpreter: Windows Command Shell).

  Primary telemetry sources include SQL Server logs where Event ID 15457 is recorded. If this behavior is deemed malicious, it poses a significant security risk as it enables an attacker to execute arbitrary commands on the SQL Server host, facilitating data exfiltration or further escalation of privileges. However, this detection does NOT independently confirm malicious intent, as legitimate database administrators may also enable or disable this feature during routine maintenance.

  ### Investigation Steps

  - **Check SQL Server logs for Event ID 15457**: Review the SQL Server logs associated with Event ID 15457 for changes to the `xp_cmdshell` setting. Look for entries mentioning `'xp_cmdshell'` in the `Data` field, which indicates whether it was enabled or disabled.

  - **Identify the user account responsible for the change**: Examine the logs for the `Session Login Name` or `Login Name` fields. Legitimate changes should typically be performed by known database administrators or service accounts.

  - **Review recent command execution via xp_cmdshell**: Investigate if `xp_cmdshell` was invoked subsequently. Look for corresponding Event ID logs where command execution may have occurred, indicating potential exploitation. Valid commands for administrators may include backup scripts, while unexpected or unauthorized commands could signal malicious use.

  - **Verify asset criticality of the affected SQL Server instance**: Assess the role of the SQL Server instance (e.g., production database, development, etc.) and its exposure to the internet. If the affected instance is publicly accessible or contains sensitive data, prioritize accordingly.

  - **Analyze access and permissions**: Determine if the account modifying the setting had the appropriate roles and permissions, such as sysadmin or db_owner. Deviations from standard permission levels may indicate possible account compromise.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact on the security of sensitive databases. The likelihood of malicious abuse is moderate to high, particularly in environments where `xp_cmdshell` should remain disabled. Given its historic use in attacks, such as malware deployment and data exfiltration, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of sufficient logging configurations or if SQL Server auditing is not properly set up. Legitimate administrative activities, especially during system changes or upgrades, can trigger false positives. Companion detections involving suspicious command executions following changes to `xp_cmdshell` can enhance coverage, particularly focusing on logs around SQL command execution within the application logs.

