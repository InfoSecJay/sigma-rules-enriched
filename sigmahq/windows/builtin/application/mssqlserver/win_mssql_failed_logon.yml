note: |
  ### Technical Context

  This Sigma rule detects failed logon attempts to Microsoft SQL Server, specifically via Event ID 18456. The behavior typically indicates an unauthorized access attempt, which aligns with an adversary's objective to exploit credential access vulnerabilities within the SQL Server environment. This detection falls under the MITRE ATT&CK framework tactic of Credential Access (T1070) and technique Brute Force (T1110). Primary telemetry sources involve SQL Server logs where authentication failures are recorded, especially those enabled for logging failed logins.

  The security impact of malicious activity in this context could lead to unauthorized data access or SQL injection attempts, compromising sensitive information stored in the database. However, this detection alone does NOT confirm that an adversary is present; it may also reflect legitimate activities, such as users changing their passwords.

  ### Investigation Steps

  - **Check the logon event details:** Review the SQL Server logs for Event ID 18456 and note the error codes associated with the failed logins. Error codes like 18456 indicate a failed login due to wrong credentials, while codes such as 18461 (invalid login) suggest other issues.

  - **Identify the source of the failed logons:** Determine the originating IP address and username associated with the failed login attempts. This can be cross-referenced with `sys.dm_exec_sessions` in SQL Server to identify active sessions and determine if the account is legitimate or flagged for unusual activity.

  - **Assess legitimate activities:** Investigate legitimate applications or services that may be using saved credentials to connect to the SQL Server. Review relevant scripts or jobs (e.g., SQL Server Agent jobs) that might match the timing of failed login attempts to ensure they are functioning correctly.

  - **Monitor for patterns:** Analyze the frequency and timing of the failed logon attempts. Successful connections immediately following multiple failed attempts from the same IP or username could indicate malicious behavior, while sporadic failures from diverse IPs may suggest benign user errors.

  - **Examine current user account settings:** Evaluate any recent changes to user account passwords or permissions that might have led to these failed logon attempts. Use the SQL Server Management Studio (SSMS) to review the settings and ensure compliance with security policies.

  ### Prioritization

  The alert is considered low severity since it indicates failed logon attempts rather than successful unauthorized access. However, frequent occurrences could suggest a brute force attack, especially on critical database servers, necessitating higher scrutiny. Successful exploitation in such environments can lead to severe data breaches or data loss, thus maintaining a level of importance in monitoring.

  ### Blind Spots and Assumptions

  Detection limitations include potential noise from legitimate password change processes or automated systems attempting to connect with outdated credentials. It is crucial to ensure that MSSQL Server authentication logging is adequately configured to capture such events reliably. Activities such as legitimate application updates or misconfigured services can result in similar alert triggers. A similar detection to enhance coverage would involve monitoring successful logins (Event ID 540) following a series of failed attempts, indicating possible credential stuffing or account compromise attempts.

