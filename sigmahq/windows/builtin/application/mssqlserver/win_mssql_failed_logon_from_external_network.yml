note: |
  ### Technical Context
  This detection rule identifies failed logon attempts to Microsoft SQL Server (MSSQL) from client IP addresses that are external to the organization’s network. Such activity is commonly associated with brute-force attacks, where an attacker systematically tries various username and password combinations to gain unauthorized access to the database server. If attackers succeed, they can exfiltrate sensitive data or manipulate the database, leading to significant security breaches.

  The primary MITRE ATT&CK tactics and techniques relevant to this detection are Credential Access (TA0006) and Brute Force (T1110). These frameworks help understand the threat's nature, as attackers may leverage weak or compromised credentials to exploit MSSQL and gain further access to internal systems.

  Data sources that provide valuable insights for this rule include MSSQL authentication logs and Windows event logs, which contain Event ID 18456 indicating failed logon attempts. Analyses of such logs can reveal not only the number of unsuccessful logins but also the originating external IP addresses, thus helping to narrow down potential threat actors.

  ### Investigation Steps
  - **Review Failed Logon Events:** Examine MSSQL Event ID 18456 logs to identify specific failed logon attempts and corresponding client IP addresses that triggered the alert.
  - **Analyze External IP Addresses:** Cross-reference the detected external IP addresses with threat intelligence sources to assess if they are known malicious or risky entities.
  - **Correlate with Other Security Events:** Investigate whether there are concurrent security incidents, such as alerts from the EDR and firewall logs, that might indicate coordinated attack efforts targeting the MSSQL server.
  - **Assess Authentication Mechanisms:** Evaluate the MSSQL server's authentication configurations and user access to ensure strong password policies and account lockout policies are enforced to mitigate brute-force risks.

  ### Prioritization
  This alert holds medium severity due to the potential for significant impact should a brute-force attempt succeed. The likelihood of exploitation increases particularly if weak or default credentials are in use, which is common in enterprise environments.

  ### Blind Spots and Assumptions
  This detection rule assumes that MSSQL authentication logging is properly enabled and configured on the server, which may not always be the case. Potential blind spots include environments where MSSQL authentication logs are not available or where attackers use more sophisticated techniques to bypass authentication altogether. Additionally, if the logs do not capture all failed attempts due to misconfiguration, this could lead to gaps in detection coverage. Ensuring that logging is comprehensive and notable events are captured is critical for the effectiveness of this alert.

