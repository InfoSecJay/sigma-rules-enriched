note: |
  ### Technical Context

  This Sigma rule detects failed logon attempts to an MSSQL server originating from external network IP addresses. The behavior indicates attempts to access the database improperly, potentially signifying a brute-force attack aimed at compromising user credentials or discovering vulnerabilities. This is associated with the MITRE ATT&CK technique of Credential Access (T1110), particularly through authentication attempts.

  The primary telemetry source for this detection is MSSQL server logs, specifically Event ID 18456, which logs failed login attempts. If the behavior detected is determined to be malicious, it can lead to unauthorized data access or service disruptions, impacting the confidentiality, integrity, and availability of the database. It is important to note that this detection does NOT confirm successful access or exploitation on its own; it solely indicates failed login attempts.

  ### Investigation Steps

  - **Check the origin of the failed logon attempts**: Review Event ID 18456 logs from MSSQL. Look for 'CLIENT IP:' fields indicating external IP addresses. Any IP not part of the internal ranges (10.x.x.x, 172.x.x.x, 192.168.x.x) is suspicious and warrants further investigation.

  - **Identify user accounts involved in the failed attempts**: Analyze the MSSQL logs for specific usernames associated with the failed logons. Legitimate users should typically show a consistent pattern of access from known IPs, and multiple failed attempts from the same user could indicate an attack.

  - **Correlate with firewall logs**: Review any firewall event logs to identify corresponding blocked connection attempts to the MSSQL server from external IPs. Look for high volumes of traffic using common MSSQL ports (1433 or 1434) in short timeframes, indicating a brute-force attempt.

  - **Evaluate historical log attempts**: Assess MSSQL login history over recent weeks to determine if the failed attempts are part of a larger trend. If substantial failed logon events have existed before this alert, it could indicate persistent adversarial activity.

  - **Examine legitimate operations**: Verify expected behavior during routine maintenance or user activities. For instance, scheduled tasks or internal application connections that might involve multiple connections from a predictable external IP.

  - **Assess the affected MSSQL server's criticality**: Determine the role of the SQL server within your environment (e.g., production, development). High-value production servers may require immediate incident response actions if malicious activity is confirmed.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized access to sensitive database systems. While the failed logon attempts suggest possible brute-force attacks, the impact escalates based on the criticality of the affected MSSQL server and the likelihood of further exploitation or data compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the logging configuration of the MSSQL server. If authentication logging is not enabled, failed attempts may not be captured. Additionally, legitimate tools or services performing tasks that involve multiple failed logons could trigger this alert, such as system migrations or user support scenarios. A companion detection related to successful logins (e.g., an anomalous spike of successful logins after this alert) can enhance the understanding of potential breach attempts.

