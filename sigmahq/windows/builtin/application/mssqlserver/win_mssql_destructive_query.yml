logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event (event id 33205)'
detection:
  selection:
    Provider_Name: 'MSSQLSERVER$AUDIT'
    EventID: 33205
    Data|contains:
    - 'statement:TRUNCATE TABLE'
    - 'statement:DROP TABLE'
    - 'statement:DROP DATABASE'
  condition: selection
falsepositives:
- Legitimate transaction from a sysadmin.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of destructive SQL queries such as "DROP TABLE", "DROP DATABASE", and "TRUNCATE TABLE". Such actions can indicate a malicious actor’s intent to delete or corrupt valuable data, often as part of a broader attack objective like data tampering or destruction. The relevant MITRE ATT&CK technique is Data Destruction (T1485).

  Telemetry for this detection relies on MSSQL audit logs, specifically Event ID 33205, which must be properly configured in the MSSQL audit policy. If malicious, the impact can be severe, resulting in loss of critical data and operational disruption. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger these events.

  ### Investigation Steps

  - **Check MSSQL Audit Log for Event ID 33205**: Review Event ID 33205 logs for the relevant SQL instance. Look for entries that include the phrases "statement: TRUNCATE TABLE", "statement: DROP TABLE", or "statement: DROP DATABASE". Confirm the SQL statement's legitimacy based on timestamps and expected administrative activity.

  - **Analyze User Context**: Identify the user account that executed the query. Verify whether it is a known sysadmin or an account with elevated privileges. Cross-reference with usual business hours and recent account activity logs.

  - **Inspect Related Database Backups**: Verify if recent database backups exist and are accessible. Successful restoration of backups can mitigate data loss. Check for recent backup events in the MSSQL server logs or related administration logs.

  - **Determine Query Frequency**: Investigate the frequency of such destructive commands over the past week. Anomalous patterns, such as multiple destructive commands executed in a short period, may indicate malicious activity.

  - **Review Application Logs for Related Activity**: Look for any application logs (e.g., web application logs) that executed queries around the same time as the detected event. Specifically search for entries that indicate actions leading to the destructive query.

  - **Identify Normal Usage Patterns**: Establish a baseline of normal database operations to identify legitimate administrative tasks versus suspicious activity. Typically, sysadmin queries are performed during regular maintenance windows.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on the affected database and its critical role in enterprise architecture. The likelihood of abuse is moderate, as destructive SQL commands are often weaponized in data breach scenarios. The severity also accounts for the potential loss of sensitive data and operational capability.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques where attackers use legitimate administrative accounts impersonally or schedule destructive queries outside of regular hours. Reliable detection requires MSSQL audit policies to be correctly configured; without this, the necessary logs may not be captured. Additionally, routine maintenance or migrations may trigger these alerts, reflecting legitimate activity. A companion detection to consider is monitoring for unusual access patterns to the MSSQL server or changes to database user roles.

