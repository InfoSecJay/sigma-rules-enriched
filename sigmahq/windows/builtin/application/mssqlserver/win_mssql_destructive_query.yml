title: MSSQL Destructive Query
id: 00321fee-ca72-4cce-b011-5415af3b9960
status: experimental
description: |
  Detects the invocation of MS SQL transactions that are destructive towards table or database data, such as "DROP TABLE" or "DROP DATABASE".
references:
- https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-table-transact-sql?view=sql-server-ver16
- https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-database-transact-sql?view=sql-server-ver16
- https://learn.microsoft.com/en-us/sql/t-sql/statements/truncate-table-transact-sql?view=sql-server-ver16
author: Daniel Degasperi '@d4ns4n_'
date: 2025-06-04
tags:
- attack.exfiltration
- attack.impact
- attack.t1485
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event (event id 33205)'
detection:
  selection:
    Provider_Name: 'MSSQLSERVER$AUDIT'
    EventID: 33205
    Data|contains:
    - 'statement:TRUNCATE TABLE'
    - 'statement:DROP TABLE'
    - 'statement:DROP DATABASE'
  condition: selection
falsepositives:
- Legitimate transaction from a sysadmin.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially harmful SQL queries executed against Microsoft SQL Server databases, specifically those that could result in data loss. The rule specifically looks for destructive commands like "DROP TABLE," "DROP DATABASE," and "TRUNCATE TABLE," which can irreversibly remove data and structure within the database. The detection indicates a potential insider threat, external attack, or misconfiguration where unauthorized or malicious actors seek to disrupt operations, erase traces, or manipulate data.

  The likely attacker objectives may include data destruction, attempting to cover their tracks after a data breach, or sabotaging operations by rendering data unavailable. Such actions align with various MITRE ATT&CK techniques, notably under the tactic of **Impact** and technique **Data Destruction (T1485)**.

  For optimal detection, telemetry from **MSSQL audit logs** is essential, particularly focusing on event ID 33205, which logs the execution of SQL statements, including those capable of data destruction. It is crucial that the MSSQL audit policy is configured correctly to capture these events, alleviating potential blind spots in detection.

  ### Investigation Steps
  - **Review MSSQL Audit Logs**: Begin by examining the MSSQL audit logs for event ID 33205 to identify the timestamps of destructive queries. Pay close attention to the execution context and user accounts involved.
  - **Analyze User Privileges**: Investigate the privileges of the users executing the destructive queries to verify if their access is justified. Look for any recent changes in roles or permissions that could indicate a compromised account.
  - **Correlate with Application Logs**: Cross-reference the audit log findings with application and web access logs to identify any anomalous behavior or access patterns, such as unauthorized logins or unusual application requests preceding the SQL execution.
  - **Assess Impact on Business Operations**: Evaluate the affected databases and tables to determine the criticality of the data that may have been impacted by the destructive actions. Assess any operational downtime or data recovery processes that may be required.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of data loss and disruption to business operations if malicious actors successfully execute these types of queries. The likelihood of encountering such destructive activities in an enterprise environment, whether as a result of an insider threat or an external attack, warrants prompt investigative follow-up.

  ### Blind Spots and Assumptions
  A potential blind spot in detection coverage is the reliance on the proper configuration of MSSQL auditing policies; if these audits are disabled or misconfigured, destructive actions may go unnoticed. It is assumed that logs will be regularly reviewed and retained for adequate timeframes to identify malicious activities. Additionally, this rule does not take into account legitimate system administrators performing sanctioned maintenance or data management tasks, which may lead to false positives. Proper access control and monitoring configurations are essential for the alert's validity.

