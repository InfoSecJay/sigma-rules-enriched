title: MSSQL XPCmdshell Suspicious Execution
id: 7f103213-a04e-4d59-8261-213dddf22314
status: test
description: Detects when the MSSQL "xp_cmdshell" stored procedure is used to execute
  commands
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2024-06-26
tags:
- attack.execution
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy to monitor for "xp_cmdshell" must
    be enabled in order to receive this event in the application log (Follow this
    tutorial https://dba.stackexchange.com/questions/103183/is-there-any-way-to-monitor-execution-of-xp-cmdshell-in-sql-server-2012)'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains|all:
            # You can modify this to include specific commands
    - 'object_name:xp_cmdshell'
    - 'statement:EXEC'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the "xp_cmdshell" stored procedure in Microsoft SQL Server, which allows execution of arbitrary commands on the server hosting the database. Attackers may leverage this functionality to gain command shell access, execute malicious scripts, or install malware on the underlying operating system. The use of "xp_cmdshell" can indicate compromise, particularly if it is invoked unexpectedly or in ways inconsistent with typical database operations.

  The attacker’s objectives may include data exfiltration, lateral movement within the network, or establishing persistence. This aligns with the MITRE ATT&CK techniques for execution (T1203 - Exploitation for Client Execution) and privilege escalation (T1068 - Exploitation for Privilege Escalation). The primary data sources for this detection are MSSQL application logs that capture events related to stored procedure executions.

  ### Investigation Steps
  - **Review MSSQL Audit Logs**: Examine the SQL Server audit logs specifically for EventID 33205 to identify instances of the "xp_cmdshell" execution and assess the context of the commands being run.
  - **Analyze SQL Statements**: Investigate the specific SQL statements associated with the "xp_cmdshell" execution to determine if any unauthorized or suspicious commands were issued that could indicate malicious activity.
  - **Check User Activity**: Correlate the executions with the user accounts running the commands. Determine if these users have legitimate reasons for executing "xp_cmdshell" or if they appear suspicious based on their usual behavior and permissions.
  - **Monitor for Lateral Movement**: If "xp_cmdshell" is executed in conjunction with commands that indicate network activity (such as using tools like `net` or `cmd`). Look for unusual connections initiated from the SQL Server to other systems on the network.

  ### Prioritization
  The alert is assigned high severity because unauthorized use of "xp_cmdshell" could lead to critical security incidents, including full system compromise. The risk is escalated in environments where sensitive data resides within their databases, making it a highly attractive target for attackers.

  ### Blind Spots and Assumptions
  One potential blind spot is the reliance on MSSQL audit policies being properly configured to log executions of "xp_cmdshell." If these policies are not enabled, the detection may fail to trigger. The detection logic assumes that notifications for stored procedure executions are logged consistently and that legitimate administrative activities are well documented. Additionally, if users with elevated privileges routinely use "xp_cmdshell" for legitimate maintenance, there may be an increased risk of false positives. Monitoring environments must ensure that appropriate logging configurations are in place for this detection to function effectively.

