title: MSSQL Disable Audit Settings
id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
status: test
description: Detects when an attacker calls the "ALTER SERVER AUDIT" or "DROP SERVER
  AUDIT" transaction in order to delete or disable audit logs on the server
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-transact-sql?view=sql-server-ver16
- https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-server-audit-transact-sql?view=sql-server-ver16
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains:
    - 'statement:ALTER SERVER AUDIT'
    - 'statement:DROP SERVER AUDIT'
  condition: selection
falsepositives:
- This event should only fire when an administrator is modifying the audit policy.
  Which should be a rare occurrence once it's set up
level: high
note: |
  ### Technical Context
  This detection rule monitors for attempts to alter or disable audit settings in Microsoft SQL Server, specifically by detecting the execution of the `ALTER SERVER AUDIT` or `DROP SERVER AUDIT` statements. Such actions are typically indicative of an attacker's intent to cover their tracks by preventing the logging of potentially malicious activities, thus concealing their presence in the environment. The ability to modify audit settings can allow attackers to operate with reduced risk of detection, thereby reaching their objectives more effectively.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1565), as attackers seek to evade logging and monitoring controls, as well as possibly **Privilege Escalation** (T1068), should an entity manipulate audit settings to gain higher privileges. The primary data sources providing evidence for this detection include the MSSQL server application logs that capture events related to audit policy changes, specifically Event ID 33205.

  ### Investigation Steps
  - **Review MSSQL Application Logs:** Analyze the MSSQL application logs for Event ID 33205, focusing on any entries that log alterations to server audits. Pay attention to the timing and context of these actions.

  - **Correlate User Accounts:** Identify the user accounts executing these statements. Investigate their permissions and roles to determine whether they have the authority to modify audit settings legitimately.

  - **Examine Recent Administrative Activity:** Investigate any recent administrative changes or activities on the MSSQL server that may correlate with the timing of the detected alterations to audit settings, looking for unusual patterns or timing.

  - **Check for Preceding Reconnaissance Activities:** Correlate recent user activities with reconnaissance indicators, such as unusual queries or access patterns that may precede attempts to disable auditing.

  ### Prioritization
  This alert is considered high severity due to the potential impact of an attacker effectively disabling audit logs, which can hinder incident response efforts and allow malicious activities to proceed undetected. The likelihood of this occurring in a well-defended environment is moderate, as proper controls typically limit who can alter audit configurations.

  ### Blind Spots and Assumptions
  Potential blind spots include scenarios where audit policies were intentionally modified by legitimate administrators without prior notification, leading to false positives. The detection logic assumes that the MSSQL audit policy is enabled; if it is not, the necessary logging information will not be available, rendering the alert ineffective. Additionally, reliance on the `Data` field to accurately capture the intended actions may not apply if logging configurations are not universally applied across servers.

