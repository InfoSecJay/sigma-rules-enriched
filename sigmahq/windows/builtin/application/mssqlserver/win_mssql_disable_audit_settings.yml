title: MSSQL Disable Audit Settings
id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
status: test
description: Detects when an attacker calls the "ALTER SERVER AUDIT" or "DROP 
  SERVER AUDIT" transaction in order to delete or disable audit logs on the 
  server
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-transact-sql?view=sql-server-ver16
- https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-server-audit-transact-sql?view=sql-server-ver16
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.defense-impairment
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains:
    - 'statement:ALTER SERVER AUDIT'
    - 'statement:DROP SERVER AUDIT'
  condition: selection
falsepositives:
- This event should only fire when an administrator is modifying the audit 
  policy. Which should be a rare occurrence once it's set up
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable or delete Microsoft SQL Server audit logs by capturing the execution of the `ALTER SERVER AUDIT` or `DROP SERVER AUDIT` commands. An attacker may aim to undermine security monitoring by erasing traces of their access or malicious activity, thereby facilitating further exploitation within the environment. This activity correlates with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique: Indicator Removal on Host (T1070).

  The primary telemetry source is the Windows application event log, specifically looking for Event ID 33205 associated with MSSQL. If this behavior is confirmed as malicious, it could lead to undetected surveillance or ongoing access by the attacker. Importantly, this detection does not confirm the presence of a successful attack by itself, as legitimate administrators may also invoke these commands during rare audit policy modifications.

  ### Investigation Steps

  - **Check Event Logs for MSSQL activity:** Review Windows Application logs for Event ID 33205. Look for "statement:ALTER SERVER AUDIT" or "statement:DROP SERVER AUDIT" in the Event Data fields, confirming the commands were executed.

  - **Validate account permissions:** Identify the user account that triggered the event. Cross-reference against a list of authorized database administrators. Legitimate administrators should infrequently modify audit settings.

  - **Monitor for related activity:** Investigate surrounding log entries for potential suspicious queries or activities by the same user or host. Look for Event ID 33000 (SQL Server login) followed by the audit commands within a short time frame.

  - **Assess the criticality of affected SQL Server instances:** Determine if the SQL Server hosting the logs is a critical database service. High-value targets should heighten urgency and response actions.

  - **Extract detailed event logs:** Retrieve the raw event data for the run of the ALTER or DROP commands, focusing on the 'data' field for any parameters that clarify the context or intent behind the commands.

  - **Identify benign alternatives:** Confirm approval or scheduled maintenance activities that may explain legitimate attempts to modify audit settings. Document business continuity processes to support activity credential verification.

  ### Prioritization

  This alert is high severity due to its potential impact on the security posture of critical database systems. The likelihood of malicious abuse is significant, given that disabling logging directly undermines detection capabilities. Such behavior is frequently weaponized in advanced attacks as part of the attacker’s effort to maintain persistence without detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement that MSSQL audit policies must be properly configured to capture related events. Evasion techniques could include legitimate administrators executing commands for valid purposes, which may lead to false positives. Additionally, relying solely on this rule does not account for other activity that could indicate malicious intent; companion detections such as failed login attempts (Event ID 18456) may reinforce the investigation’s context.

