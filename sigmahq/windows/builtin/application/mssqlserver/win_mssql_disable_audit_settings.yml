title: MSSQL Disable Audit Settings
id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
status: test
description: Detects when an attacker calls the "ALTER SERVER AUDIT" or "DROP 
  SERVER AUDIT" transaction in order to delete or disable audit logs on the 
  server
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-transact-sql?view=sql-server-ver16
- https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-server-audit-transact-sql?view=sql-server-ver16
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy must be enabled in order to receive
    this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains:
    - 'statement:ALTER SERVER AUDIT'
    - 'statement:DROP SERVER AUDIT'
  condition: selection
falsepositives:
- This event should only fire when an administrator is modifying the audit 
  policy. Which should be a rare occurrence once it's set up
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the SQL Server's audit settings, specifically when an attacker executes the "ALTER SERVER AUDIT" or "DROP SERVER AUDIT" commands to disable or delete audit logs. The likely attacker objective is to suppress evidence of malicious activities or changes made within the SQL Server environment. This behavior is related to the MITRE ATT&CK technique "Disable or Modify Tools" (T1070), which covers evasion tactics used to obscure actions from detection systems.

  The primary telemetry source for this rule is the Windows application log, specifically targeting Event ID 33205 associated with MSSQL. If malicious, the security impact can be severe, undermining visibility into database activities and thereby facilitating unauthorized access or data breaches. Importantly, detecting this action alone does not confirm malicious intent, as it could also result from legitimate administrative tasks.

  ### Investigation Steps

  - **Check the application event log for specific Event ID 33205:** Review the Windows application logs for Event ID 33205. Look for entries containing 'statement:ALTER SERVER AUDIT' or 'statement:DROP SERVER AUDIT'. This indicates attempts to modify audit settings.

  - **Identify the source of the alteration:** Correlate the user account performing this action with recent activity. Review the context of their role—administrative actions should be logged; compare against expected behavior for legitimate administrators.

  - **Analyze SQL Server Audit Policies:** Examine current audit policies via SQL Server Management Studio (SSMS) or T-SQL to determine if any audit settings were indeed altered or dropped. This will help ascertain if any legitimate modifications were made.

  - **Monitor for additional suspicious SQL commands:** Review logs for sequences of SQL commands leading up to the Alter or Drop statements to identify potential pre-cursors of malicious activity, such as unauthorized data access or unusual user activity.

  - **Look for related network activity:** Check for anomalous network activity around the same timeframe using network intrusion detection systems (NIDS) logs, focusing on connections to the MSSQL server (e.g., unusual source IPs or increased connections).

  - **Cross-reference with other detection mechanisms:** Verify if there are correlating detections regarding privilege escalations or unauthorized access attempts. This can provide additional context and validation of malicious intent.

  ### Prioritization

  This alert is of high severity due to the potential impact on database integrity and visibility. Successful execution of these commands likely indicates a malicious actor attempting to conceal their actions, making this behavior a significant threat vector in an enterprise environment where MSSQL is critical.

  ### Blind Spots and Assumptions

  The detection may have limitations, particularly if detailed logging for SQL Server is not consistently monitored or configured. Legitimate administrative actions may trigger the alert, such as necessary changes during auditing configurations. Assumptions about user roles might also lead to misinterpretation. To enhance security posture, implement complementary detections for SQL Server privilege escalations and unauthorized data access attempts, as they can reinforce the context of potential malicious behavior.

