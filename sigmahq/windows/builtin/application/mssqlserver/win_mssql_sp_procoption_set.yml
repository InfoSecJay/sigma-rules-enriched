title: MSSQL SPProcoption Set
id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
status: test
description: Detects when the a stored procedure is set or cleared for automatic
  execution in MSSQL. A stored procedure that is set to automatic execution runs
  every time an instance of SQL Server is started
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-procoption-transact-sql?view=sql-server-ver16
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.persistence
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy to monitor for "sp_procoption" must
    be enabled in order to receive this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains|all:
    - 'object_name:sp_procoption'
    - 'statement:EXEC'
  condition: selection
falsepositives:
- Legitimate use of the feature by administrators (rare)
level: high
note: |
  ### Technical Context

  This Sigma rule detects when a stored procedure in Microsoft SQL Server is set or cleared for automatic execution using the `sp_procoption` command. Adversaries may utilize this technique to establish persistence, ensuring that their malicious payload or scripts run automatically whenever the SQL Server instance starts. This behavior relates to the MITRE ATT&CK technique **Persistence** (T1547.001).

  The primary telemetry source for this detection is the MSSQL logs, specifically targeting `Event ID 33205` which signifies changes to stored procedures. If malicious, this behavior could grant attackers continuous access to the system and facilitate further exploitation. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative actions can also trigger this event, particularly in rare scenarios.

  ### Investigation Steps

  - **Check Event ID 33205:** Review logs for `Event ID 33205` in MSSQL, indicating an alteration to a stored procedure via `sp_procoption`. Focus on the `data` field for context regarding what changes were made.

  - **Identify the user account:** Determine the user account responsible for the `sp_procoption` execution. Check the `login_name` field in the event log to assess whether it belongs to a legitimate admin or appears suspicious.

  - **Examine the stored procedure:** Look for indications of obfuscation or unusual commands within the stored procedure specified by `object_name:sp_procoption`. Malicious procedures may contain non-standard SQL commands.

  - **Validate expected behavior:** Compare to known legitimate usage. Review internal documentation or previous changes to stored procedures for confirmation that `sp_procoption` was used for valid purposes, such as automatic execution for maintenance scripts.

  - **Correlate with other events:** Cross-reference with other logs such as SQL agent log schedules or significant database actions occurring around the same time, helping to establish a broader picture of changes and intentions.

  - **Monitor for lateral movement:** Analyze any subsequent user activity following the `sp_procoption` execution to identify unusual patterns that may indicate lateral movement attempts or unauthorized data access.

  ### Prioritization

  This alert should be considered high-priority due to the potential security impact of unauthorized persistence mechanisms in database systems. The likelihood of exploitation is elevated, as establishing persistence is a common tactic among attackers. Since setting stored procedures to automatic execution is a known technique for maintaining access, it warrants immediate attention from the SOC analysts.

  ### Blind Spots and Assumptions

  Detection may be limited if the MSSQL audit policy is not enabled for monitoring `sp_procoption`, which is essential for generating `Event ID 33205`. Legitimate administrative tasks may occasionally set stored procedures for auto-execution without malicious intent. An associated detection such as monitoring for unusual stored procedure calls (Event ID 4688 or equivalent) can enhance the coverage and provide additional context to potential threats.

