title: MSSQL SPProcoption Set
id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
status: test
description: Detects when the a stored procedure is set or cleared for automatic execution
  in MSSQL. A stored procedure that is set to automatic execution runs every time
  an instance of SQL Server is started
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-procoption-transact-sql?view=sql-server-ver16
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-13
modified: 2024-06-26
tags:
- attack.persistence
logsource:
  product: windows
  service: application
  definition: 'Requirements: MSSQL audit policy to monitor for "sp_procoption" must
    be enabled in order to receive this event in the application log'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name|contains: 'MSSQL'     # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
    EventID: 33205
    Data|contains|all:
    - 'object_name:sp_procoption'
    - 'statement:EXEC'
  condition: selection
falsepositives:
- Legitimate use of the feature by administrators (rare)
level: high
note: |
  ### Technical Context
  This detection rule identifies when the stored procedure option in Microsoft SQL Server is set or cleared for automatic execution. Specifically, it focuses on monitoring events where the `EXEC` command is used alongside `sp_procoption`, which indicates a stored procedure is being configured to run automatically at the SQL Server instance's startup. Such behavior can signify an attempt to maintain persistence within the environment, as attackers may exploit this feature to create mechanisms that execute malicious code whenever SQL Server is restarted.

  The threat scenario typically involves a malicious actor gaining access to the SQL Server instance and modifying stored procedures to inject obstructive or harmful logic that runs automatically. This is often a tactic employed to ensure continued access or to maintain a foothold within an organization’s infrastructure. The relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and the technique **Startup Items (T1547.001)**, highlighting the threat's intent to persist across restarts and maintain control over the database.

  Primary data sources for detecting this behavior include application logs from MSSQL, where events related to stored procedure executions and modifications are recorded. Enabling the appropriate MSSQL audit policy is essential to capture these events effectively.

  ### Investigation Steps
  - **Review MSSQL Logs**: Examine MSSQL application logs for Event ID 33205 to identify instances of the `EXEC sp_procoption` command, paying close attention to any unusual user accounts or times that deviate from normal business hours.

  - **Analyze Process Creation Events**: Look for related process creation events in the Windows event logs that might provide context for the execution of SQL Server and any associated commands being run by users with elevated privileges.

  - **Correlate User Activity**: Investigate user account activity leading up to the event. Determine if there were previous logins or actions that indicate suspicious behavior from the executors of the stored procedure changes.

  - **Verify Audit Policy Settings**: Check the audit policy settings in MSSQL to ensure that the monitoring for `sp_procoption` changes is active. Document whether these settings were appropriately configured prior to the detection event.

  ### Prioritization
  This alert is prioritized as **high** due to the potential impact of unauthorized changes to stored procedures in critical database systems, which could facilitate data exfiltration, unauthorized access, or service disruption.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if the MSSQL audit policy for monitoring the `sp_procoption` command is not enabled, preventing the capture of relevant events. The detection logic assumes that legitimate administrative actions are rare and thus could still produce false positives under certain conditions. To address this, it is essential that security teams maintain awareness of normal administrative practices to better differentiate between legitimate activities and potential threats. Required logs include MSSQL application logs with the correct audit policy enabled to capture all pertinent events.

