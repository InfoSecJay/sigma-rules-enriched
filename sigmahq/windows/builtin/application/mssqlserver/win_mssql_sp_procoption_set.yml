  ---

  ### Technical Context

  This Sigma rule detects when a stored procedure is set or cleared for automatic execution in Microsoft SQL Server using the `sp_procoption` command. The primary objective for an attacker leveraging this technique is to maintain persistence on the database server, ensuring that their malicious code runs automatically each time the SQL Server starts, thereby enhancing their foothold in the targeted environment. The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1547.001 - Boot or Logon Autostart Execution: Windows Services**.

  The primary telemetry source is the MSSQL audit logs, specifically monitoring for Event ID 33205 related to procedure options. If malicious, this could enable an attacker to execute arbitrary commands upon SQL Server initialization, leading to data exfiltration or further exploitation. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger the alert.

  ---

  ### Investigation Steps

  - **Review alert context for Event ID 33205**: Analyze the MSSQL application logs for Event ID 33205 to confirm the execution of the `sp_procoption` command. Focus on the `object_name` and `statement` fields to understand the purpose of the command.

  - **Identify the user context of the action**: Check the `login_name` field associated with the event to determine which user executed the command. If it's performed by a legitimate administrative account during normal maintenance windows, it may be benign.

  - **Validate stored procedure behavior**: Query the `sys.sql_modules` view to confirm if the stored procedure associated with the command is known, expected, and has not undergone unauthorized changes. Document any deviations from expected processes.

  - **Correlate with recent changes**: Cross-reference any recent security changes or network activity that might align with the timing of the logged `sp_procoption` executions. Use logs from firewall or intrusion prevention systems for suspicious outbound traffic linked to the SQL server post-execution.

  - **Look for indicators of compromise**: Search for additional logs that may reveal unauthorized changes to SQL Server settings or configurations, such as changes in the SQL Server Agent jobs or creation of new administrative accounts that could indicate further exploitation (e.g., Event ID 15401).

  - **Assess legitimate uses of `sp_procoption`**: Understand the typical workflow of legitimate administrators setting procedures to auto-execute, such as during system maintenance or upgrades, to distinguish these from the potential malicious usage by monitoring timing and user identities.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on system integrity; if exploited, it could lead to unauthorized access to sensitive data. The likelihood of malicious abuse is significant, as attackers often seek persistent access methods within database environments, making this behavior commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  There are several limitations to this detection. Attackers may use methods to obfuscate their activities, such as running the command under a legitimate administrative account or manipulating the event logging settings. Reliable detection requires that the MSSQL audit policy be appropriately configured to capture these events. Legitimate activities, although rare, may include authorized database maintenance procedures performed by sysadmins. A related detection that would enhance coverage is monitoring for abnormal login patterns or privilege escalations within SQL Server.

