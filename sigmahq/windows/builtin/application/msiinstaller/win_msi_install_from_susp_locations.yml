title: MSI Installation From Suspicious Locations
id: c7c8aa1c-5aff-408e-828b-998e3620b341
status: test
description: Detects MSI package installation from suspicious locations
references:
- https://www.trendmicro.com/en_us/research/22/h/ransomware-actor-abuses-genshin-impact-anti-cheat-driver-to-kill-antivirus.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-31
modified: 2023-10-23
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains:
            # Add more suspicious paths
    - ':\Windows\TEMP\'
    - '\\\\'
    - '\Desktop\'
    - '\PerfLogs\'
    - '\Users\Public\'
            # - '\AppData\Local\Temp\'  # too many FPs
            # - '\Downloads\'  # too many FPs, typical legitimate staging directory
  filter_winget:
    Data|contains: '\AppData\Local\Temp\WinGet\'
  filter_updhealthtools:
    Data|contains: 'C:\Windows\TEMP\UpdHealthTools.msi'
  condition: selection and not 1 of filter_*
falsepositives:
- False positives may occur if you allow installation from folders such as the 
  desktop, the public folder or remote shares. A baseline is required before 
  production use.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects installations of MSI packages from suspicious directories, such as temporary locations and public folders, which are commonly used by attackers to execute malicious software. The probable objective of an attacker is to install unauthorized software, potentially leading to compromise or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic "Execution" (TA0002), specifically the technique "User Execution" (T1203).

  The primary telemetry sources are Windows Event Logs, particularly capturing Event IDs 1040 and 1042 from the MsiInstaller. If malicious, the security impact could involve system compromise or unauthorized access, potentially exposing sensitive data or systems to additional attacks. This detection alone does not confirm malicious activity; it indicates that an MSI install occurred from a specific directory deemed suspicious and must be evaluated in context.

  ### Investigation Steps

  - **Review installation event details:** Check Event ID 1040 and 1042 for the MSI installation in the Windows Security logs. Look for the `Product` field to identify the installed application and the `Data` field for the originating path. Log paths such as `C:\Windows\TEMP\` or `\Users\Public\` are indicators of potential malicious activity.

  - **Validate legitimate installations:** Examine any MSI installations from expected directories, such as `C:\Program Files\` or `C:\Program Files (x86)\`. Low-risk software installations typically originate from these paths, especially for enterprise applications.

  - **Identify high-risk installations:** Look for MSI installations that originate from anomalous network shares (`\\\\`) indicated in the `Data` field of the event. Such installations may warrant immediate escalation due to their connection to potential remote attacks.

  - **Check for related processes:** Correlate MSI installation events with process creation events (Windows Event ID 4688) around the same time. Look for suspicious command lines or parent processes that may indicate payload execution following the installation.

  - **Assess asset criticality and exposure:** Consider if the affected system is a critical asset (e.g., domain controllers, servers hosting sensitive applications). High-value targets have a greater impact from successful compromises and warrant immediate attention.

  ### Prioritization

  The severity of this alert is medium; it indicates potentially unauthorized activity from a directory often exploited by attackers. The likelihood of malicious abuse is significant, as malicious MSI packages can be used to install malware or other unwanted software, thus posing a potential security risk. This behavior is not uncommon in various forms of cyber attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions allowing legitimate installations from `C:\Users\Public` or `Desktop`, leading to false positives unless a baseline of normal behavior is established. Required logging sources must include detailed MSI installer logs to capture all relevant MSI installations clearly. Moreover, users downloading legitimate software may inadvertently trigger this alert, making contextual analysis critical. A related detection to consider is monitoring for abnormal behavior from newly installed applications, which may indicate follow-on malicious activities.

