title: MSI Installation From Suspicious Locations
id: c7c8aa1c-5aff-408e-828b-998e3620b341
status: test
description: Detects MSI package installation from suspicious locations
references:
- https://www.trendmicro.com/en_us/research/22/h/ransomware-actor-abuses-genshin-impact-anti-cheat-driver-to-kill-antivirus.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-31
modified: 2023-10-23
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains:
            # Add more suspicious paths
    - ':\Windows\TEMP\'
    - '\\\\'
    - '\Desktop\'
    - '\PerfLogs\'
    - '\Users\Public\'
            # - '\AppData\Local\Temp\'  # too many FPs
            # - '\Downloads\'  # too many FPs, typical legitimate staging directory
  filter_winget:
    Data|contains: '\AppData\Local\Temp\WinGet\'
  filter_updhealthtools:
    Data|contains: 'C:\Windows\TEMP\UpdHealthTools.msi'
  condition: selection and not 1 of filter_*
falsepositives:
- False positives may occur if you allow installation from folders such as the desktop,
  the public folder or remote shares. A baseline is required before production use.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of MSI packages from suspicious or potentially malicious locations, such as the Windows `TEMP` folder and `Desktop`, which are commonly targeted by attackers to execute malware. Attackers may leverage these MSI installations to deploy ransomware or other malicious software to compromise systems, often aiming to evade traditional security mechanisms and maintain persistence within the environment.

  The rule maps to the MITRE ATT&CK framework, specifically under the **Execution** tactic, with techniques such as **User Execution (T1203)** and **Scheduled Task/Job (T1053)** in mind. These techniques are often utilized by threat actors to execute code and install malware using seemingly legitimate applications. The primary telemetry sources for this detection are Windows event logs, specifically logs generated by the Windows Installer service, which are crucial for monitoring and analyzing installation activities.

  ### Investigation Steps
  - **Review Installation Logs:** Analyze Windows event logs focusing on Event IDs 1040 and 1042 to trace MSI installation activities, noting the source paths and any user or system accounts involved.
  - **Inspect Suspicious Directories:** Investigate the contents of the identified suspicious directories such as `\Windows\TEMP\`, `\Desktop\`, and `\Users\Public\` for any unauthorized or unexpected files that may indicate malicious activities.
  - **Collect Endpoint Context:** Examine process creation events around the time of the MSI installation to identify any processes that may have executed the installation, looking for unusual parent-child relationships or execution from atypical locations.
  - **Analyze User Behavior:** Evaluate the user accounts responsible for the installations to determine if there are patterns of unusual activity or if accounts have been compromised, which may include checking for lateral movement or privilege escalation events.

  ### Prioritization
  This alert is of medium severity in an enterprise environment due to the potential impact of malicious MSI installations, which can lead to system compromise and data loss. However, it is moderated by the likelihood of false positives from legitimate software installations occurring from common paths.

  ### Blind Spots and Assumptions
  This detection rule may not cover cases where MSI packages are legitimately installed from authorized sources, leading to potential false positives; establishing a baseline of normal installation behavior within your environment is necessary to minimize these incidents. The rule assumes that Windows Installer event logging is properly configured and functioning, and it may not account for installations executed through different methods or tools that do not use the Windows Installer service. Additional log sources may be required to enhance detection capabilities, such as application whitelisting logs or endpoint detection and response (EDR) telemetry.

