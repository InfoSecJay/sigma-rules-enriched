title: MSI Installation From Suspicious Locations
id: c7c8aa1c-5aff-408e-828b-998e3620b341
status: test
description: Detects MSI package installation from suspicious locations
references:
- https://www.trendmicro.com/en_us/research/22/h/ransomware-actor-abuses-genshin-impact-anti-cheat-driver-to-kill-antivirus.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-31
modified: 2023-10-23
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains:
            # Add more suspicious paths
    - ':\Windows\TEMP\'
    - '\\\\'
    - '\Desktop\'
    - '\PerfLogs\'
    - '\Users\Public\'
            # - '\AppData\Local\Temp\'  # too many FPs
            # - '\Downloads\'  # too many FPs, typical legitimate staging directory
  filter_winget:
    Data|contains: '\AppData\Local\Temp\WinGet\'
  filter_updhealthtools:
    Data|contains: 'C:\Windows\TEMP\UpdHealthTools.msi'
  condition: selection and not 1 of filter_*
falsepositives:
- False positives may occur if you allow installation from folders such as the desktop,
  the public folder or remote shares. A baseline is required before production use.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of MSI packages from potentially suspicious locations within a Windows environment. The behavior indicates an attempt to execute software, which could be part of a broader strategy to deploy malware or manipulate system settings for malicious purposes. The likely attacker objective is to deliver harmful payloads under the guise of legitimate software installations.

  This detection maps to the MITRE ATT&CK tactic "Execution" (T1203) and technique "Exploitation for Client Execution" (T1203). The primary telemetry sources include Windows Event Logs capturing MsiInstaller events (Event IDs 1040 and 1042). If the MSI installation is malicious, it could compromise system integrity, exfiltrate data, or facilitate further attacks. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to establish context.

  ---

  ### Investigation Steps

  - **Review Event Details: ** Examine Event ID 1040 and 1042 for instances of MSI installations from suspicious paths such as `C:\Windows\TEMP\`, `\Desktop\`, and `\Users\Public\`. Look for unusual timestamps or repetitive installation patterns that might indicate active exploitation.

  - **Correlate with User Activities: ** Investigate user account activities around the time of the MSI installation. Check for Event ID 4624 (Logon) to identify which user executed the installation and analyze if they have a legitimate reason to perform this action.

  - **Identify Malicious Indicators: ** Check for known malicious file signatures or hashes associated with the installed MSI package. Query antivirus logs or endpoint protection data that correspond to the event timestamp to see if the file was flagged as malicious.

  - **Assess Legitimate Activity: ** Determine if the user has a legitimate reason for installing software from the identified paths. Common scenarios include authorized software updates or user-initiated installations. Cross-reference installed applications from legitimate directories (like Program Files) for consistency.

  - **Validate Installation Sources: ** If MsiInstaller logs show installations from `\AppData\Local\Temp\WinGet\`, confirm whether WinGet is a valid utility in use for software deployment within your organization and if it was expected to install software at that time.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on system security and the likelihood of misuse by adversaries seeking to execute malicious scripts or software. MSI installations from suspicious locations are relatively uncommon and typically associated with adversarial workflows.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activity, as approved software installations could trigger this alert. Ensure that all relevant Windows Event Logs, particularly those focusing on MsiInstaller events, are enabled and retained for sufficient periods. Additionally, awareness of legitimate software deployment practices is essential to reduce false positive rates. Companion detections for abnormal process creation or network connections initiated by newly installed applications could enhance overall threat coverage.

