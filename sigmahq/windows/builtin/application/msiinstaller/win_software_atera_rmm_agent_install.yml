  ### Technical Context

  This rule detects the installation of the Atera Remote Monitoring & Management (RMM) agent, which has been linked to adversary activities, particularly by the Conti ransomware group. The likely objective of the attacker is to establish remote access for subsequent malicious actions, including data exfiltration and lateral movement within the network. This behavior correlates to the MITRE ATT&CK framework under the Command and Control tactic (T1219.002).

  The primary telemetry source is the Windows Event Log, specifically monitoring for events associated with MsiInstaller (Event ID 1033) that indicate the installation of software, including the naming of AteraAgent. If malicious, the installation of this agent could result in significant security impacts, such as unauthorized access to sensitive data and system compromise. It is essential to note that this detection does NOT confirm that an attack is in progress; legitimate installations by authorized personnel may trigger this alert.

  ### Investigation Steps

  - **Check Installation Source: ** Review the installer path for EventID 1033 logs. Expected legitimate installation paths include "C:\Program Files (x86)\Atera" or "C:\Program Files\Atera". Any installation from an unusual user or directory warrants further scrutiny.

  - **Verify User Context: ** Analyze the user associated with EventID 1033. Determine if the installation was executed by an administrative user. Unauthorised executors, especially on critical assets, may indicate suspicious activity.

  - **Cross-reference with Security Logs: ** Correlate with Event ID 4624 (logon events) to determine when the user logged on and any preceding suspicious events. Look for logins from unusual locations or times that may point to compromise.

  - **Identify Additional Artifacts: ** Review for the creation of files in "C:\ProgramData\Atera" or similar directories post-installation. Check for unauthorized scripts or executables that may accompany this agent, indicating further malicious intent.

  - **Document Expected Behavior:** Successful installation of the Atera agent may include benign activity related to remote management and alerting by the systems or admins. Determine if there is documentation or support infrastructure in place for Atera in the environment.

  ### Prioritization

  The alert severity is high due to the potential impact of unauthorized remote access on critical systems. Given the malicious use of Atera by threat actors, the likelihood of it being abused in an enterprise environment is significant, especially if deployed without proper oversight or authorization.

  ### Blind Spots and Assumptions

  Evasion techniques, such as file renaming or using alternate installers, may bypass detection while still allowing the agent's installation. The required logs need to be adequately enabled and configured to ensure comprehensive visibility into all installation events. Legitimate remote management tools and software installations may trigger the alert, necessitating thorough contextual analysis. A related detection to consider is monitoring for abnormal outbound connections indicative of command-and-control activities following the installation.

