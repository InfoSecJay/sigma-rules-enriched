note: |
  ### Technical Context

  This rule detects when applications are uninstalled via Windows Installer events, specifically Event IDs 1034 and 11724. The likely objective of the attacker could be to remove security software, backdoors, or other tools to conceal their presence on a compromised system. It aligns with the MITRE ATT&CK tactic of "Impact" (TA0040) and technique "Application Layer Denial of Service" (T1489). Primary telemetry sources include Windows Event Logs pertaining to the Microsoft Windows Installer (MsiInstaller). If malicious, this indicates potential tampering with system integrity, particularly on critical assets. Notably, this detection does NOT confirm that the uninstallation was performed with malicious intent; it only highlights that an application has been removed.

  ### Investigation Steps

  - **Review Event Logs for App Removal:** Check Windows Event Logs (Event IDs 1034 and 11724) for any recent uninstallation activities related to critical applications such as antivirus or endpoint protection tools.
  - **Identify Critical Applications:** Determine if uninstalled applications fall under critical security categories. This can be referenced through your organization's application inventory or any change management documentation.
  - **Correlate with User Activity:** Investigate the user account associated with the uninstallation events to verify if it aligns with expected administrative tasks. Look for Event ID 4624 (Logon) to check the account's login history around the time of the uninstall events.
  - **Assess for Multiple Uninstalls:** Verify if there are multiple uninstallation events in a short timeframe that could indicate automated or malicious behavior. This may suggest a batch uninstall by malware or a user attempting to remove several protective measures.
  - **Check for Scheduled Tasks or Scripts:** Look for scheduled tasks or user scripts that may indicate automated processes responsible for the uninstallation. Investigate via Task Scheduler for any recent changes (Event ID 4698).
  - **Validate Installation History:** Examine the installation history (Windows Event ID 1033) to confirm if the uninstalled application was critical or benign. Properly functioning systems will generally not show frequent removals of installed applications without legitimate reasons.

  ### Prioritization

  The alert is of low severity due to its common occurrence in environments with regular software updates or changes. However, it warrants attention on critical systems where the uninstallation of key applications, such as security tools, indicates a higher likelihood of malicious abuse. Attackers often remove defenses prior to or after gaining unauthorized access.

  ### Blind Spots and Assumptions

  The detection may be bypassed if logging levels are inadequately set or if direct uninstallation methods are employed that do not trigger Windows Installer events. Reliable detection requires enabling detailed logging for Windows Installer events. Legitimate administrator activity, such as routine software maintenance or troubleshooting, can trigger these alerts. A related detection to consider is monitoring Windows Event ID 4657 for changes to the file system or application state, which helps correlate and reinforce insights about potential unauthorized changes.

