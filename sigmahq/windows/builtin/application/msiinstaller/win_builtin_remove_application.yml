note: |
  ### Technical Context
  This detection rule identifies instances where applications were uninstalled on Windows systems, specifically focusing on events triggered by the Microsoft Installer service. This could indicate basic maintenance activities but may also reflect potential malicious actions, especially if critical applications are removed without proper authorization. Attackers could seek to remove security or monitoring tools, thereby deepening their foothold within the network or enhancing their operational stealth.

  The relevant MITRE ATT&CK tactics for this detection include **Impact (TA0040)**, specifically technique **Application Layer Protocol Manipulation (T1489)**, as removing applications could drastically affect system configuration and availability. Primary data sources that provide supporting evidence for this detection include Windows Event Logs, specifically MSI logs that track installation and uninstallation events.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Event Logs for EventID 1034 and EventID 11724 to identify recently uninstalled applications, noting the timestamps and affected systems.
  - **Validate Application Removal**: Cross-reference application uninstallation events against an inventory of critical applications to assess whether any business-critical software was removed.
  - **Identify User Context**: Investigate the user accounts responsible for the uninstallation. Check if these accounts have the necessary permissions and whether their activities align with expected usage patterns.
  - **Monitor for Repeat Actions**: Set up alerts for successive application uninstalls or look for patterns that might indicate a broader uninstallation campaign possibly linked to malicious activity.

  ### Prioritization
  The alert is categorized as low severity due to the high volume of legitimate application removals typical in enterprise environments. However, critical applications being uninstalled without oversight could pose significant risks, warranting further investigation.

  ### Blind Spots and Assumptions
  The detection rule may miss uninstallation events that do not trigger the MSI logs, such as applications removed through direct file deletion or uninstallation via alternative means not monitored by the Windows Installer service. The logic assumes that all critical applications are known and tracked, and that all user account activities are logged satisfactorily. Reliable logging configurations must be in place for event IDs 1034 and 11724 to ensure full coverage of uninstallation activities.

