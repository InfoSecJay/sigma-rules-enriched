logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains: '://'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the installation of an MSI (Microsoft Installer) file originating from a remote URL, indicating potential unauthorized software installation on a Windows system. The likely attacker objective is to deliver malicious software through covert installation methods, often as part of a broader attack strategy involving initial access or persistence. This behavior aligns with the MITRE ATT&CK technique for “Software Installation” (T1218) and more specifically “Repurposed Software” (T1218.007).

  The primary telemetry sources include Windows Event Logs, specifically Event IDs 1040 and 1042 generated by the MsiInstaller service when remote MSI files are executed. If this is a malicious installation, it could lead to data compromise, system integrity issues, or lateral movement within the environment. Importantly, this detection does not confirm that the installed software is malicious, as legitimate applications can also be delivered via remote installation.

  ### Investigation Steps

  - **Check Event ID 1040 and 1042 logs:** Review Windows Event Logs (Event IDs 1040 and 1042) for any entries indicating remote MSI installations. Look for the “Data” field containing URLs, noting any domains that are unfamiliar or flagged as malicious.

  - **Identify the source of the MSI:** Examine the complete URL from the log entries to ascertain the domain hosting the MSI file. Legitimate enterprise software should come from recognized software vendors; flag any installations from suspicious or unknown sources.

  - **Verify user activity before installation:** Correlate the timestamp of the MSI installation logs with user activity logs (Event ID 4624 for logon events) to confirm if the initiating user had appropriate privileges and was actively logged into the system during the installation.

  - **Inspect for persistence mechanisms:** Check for additional artifacts of persistence related to the installed software. Investigate registry keys relevant to MSI installations, particularly under `HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall` for signs of unknown or unexpected installations.

  - **Cross-reference installed application lists:** Compare the installed applications list (via PowerShell or `wmic product get`) against known good baselines. Pay special attention to any recently installed MSI applications not authorized by enterprise policies.

  - **Monitor for unusual network connections:** Use tools like network monitoring (e.g., Windows Firewall logs or network traffic analysis) to scrutinize any outbound connections associated with the newly installed software. Look for unusual traffic patterns or communications to unfamiliar IPs.

  ### Prioritization

  This alert is considered medium severity since it may indicate a potential malware installation but does not inherently confirm malicious intent. The likelihood of abuse is moderate, as MSI files are commonly weaponized in attacks for software distribution, reflecting a critical need for attention given the potential impact on compromised systems.

  ### Blind Spots and Assumptions

  This detection may miss installations performed via script or command line without generating MSI events. Ensure that logging for MsiInstaller events is enabled on systems to avoid gaps in detection. Legitimate software updates may trigger this alert when sourced from the web, such as updates from enterprise-approved applications. Additionally, consider companion detections for file downloads or script execution (like PowerShell activity) that could bolster context around software installations from the web.

