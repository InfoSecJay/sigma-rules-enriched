title: MSI Installation From Web
id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
status: test
description: Detects installation of a remote msi file from web.
references:
- https://twitter.com/_st0pp3r_/status/1583922009842802689
author: Stamatis Chatzimangou
date: 2022-10-23
tags:
- attack.defense-evasion
- attack.t1218
- attack.t1218.007
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains: '://'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of Microsoft Installer (MSI) packages that originate from web sources. The installation of remote MSI files can indicate malicious behavior, especially in contexts where an attacker may attempt to deploy tools or payloads remotely to execute malicious actions. Typical attacker objectives include establishing persistence, executing malware, or escalating privileges within an environment.

  The rule aligns with the MITRE ATT&CK framework, particularly focusing on techniques related to Defense Evasion, such as T1218 (Signed Binary Proxy Execution) and T1218.007 (Installer Abuse). By leveraging public web resources to download and execute MSI files, attackers can bypass some traditional defenses and install unauthorized software.

  The primary data sources for this detection are Windows Event Logs, specifically Event IDs 1040 (Installation started) and 1042 (Installation completed) generated by the MsiInstaller service. These events can provide insight into installation activities and their associated origins.

  ### Investigation Steps
  - **Review MsiInstaller Event Logs**: Investigate Event IDs 1040 and 1042 in the Windows Event Logs for unexpected or unauthorized MSI files being installed.

  - **Analyze Source URLs**: Cross-reference the detected MSI installation sources with known malicious URLs or domains to assess potential threat indicators.

  - **Check Process Creation Logs**: Examine process creation logs for any suspicious or unexpected processes spawned by the MsiInstaller, ensuring there is no lateral movement or escalation attempts.

  - **Investigate System Changes**: Review any subsequent changes in system configuration or installed software that may correlate with the detected MSI installation to understand the impact and objectives of the activity.

  ### Prioritization
  This alert is of medium severity due to the potential for malicious software installation in an enterprise environment. Unauthorized MSI installations can lead to significant risks, including system compromise and data exfiltration, especially if they enable persistent or covert attacker presence.

  ### Blind Spots and Assumptions
  One gap in detection coverage is that this rule may not capture installations initiated from non-web sources or other direct methods that do not utilize MsiInstaller events. The detection logic assumes that the presence of `://` in the installation data indicates a web-based source, but this may not cover all malicious scenarios. Additionally, comprehensive logging configuration must be ensured to capture MsiInstaller events accurately; otherwise, this detection may miss critical artifacts from attacks leveraging similar techniques.

