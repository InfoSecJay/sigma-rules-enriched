logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'MsiInstaller'
    EventID:
    - 1040
    - 1042
    Data|contains: '://'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the installation of a remote MSI file from the web, specifically through the Windows Installer service. The likely attacker objective is to execute potentially malicious code leveraging MSI files that are fetched from a remote server, indicating possible software deployment or malicious download attempts. This behavior is associated with the MITRE ATT&CK tactic: **Execution** (TA0002) and technique: **Windows Installer Abuse** (T1218.007). The primary telemetry sources are Windows Event Logs, particularly Event IDs 1040 and 1042 from the MsiInstaller provider. If malicious, this could enable an attacker to deploy malware or unwanted applications. However, this detection does NOT confirm that the executed MSI file is malicious, as legitimate applications may also be installed from external sources.

  ### Investigation Steps

  - **Check Event Logs for specific Event IDs**: Review Security Event Logs for MsiInstaller Events 1040 and 1042, focusing on logs that contain URLs in the 'Data' field, indicating remote installation attempts.

  - **Analyze the source of the MSI file**: Validate the URL associated with the installation. Check for known safe domains or certificates and correlate with threat intelligence sources.

  - **Review user activity around installation time**: Examine logs for user activities within the past few hours of the alert to determine if there is a legitimate need for remote MSI file installation (e.g., software deployment schedules).

  - **Identify high-confidence indicators of compromise (IoCs)**: Look for atypical source IP addresses associated with the MSI file's download and check against threat intelligence databases for any known malicious activity.

  - **Correlate installation with other system behaviors**: Confirm if there are additional suspicious behaviors or processes associated with the same user profile following the installation event; check for unusual process creation (Event ID 4688).

  - **Document legitimate installations**: Identify any recent legitimate installations from approved software repositories and cross-reference them against the detected event to rule out false positives.

  ### Prioritization

  This alert carries a medium severity level due to the potential risk of remote code execution through malicious MSI installations. The likelihood of abuse is moderate, as attackers can employ this method to install malware, but legitimate installations from trusted sources may occur frequently, necessitating careful review.

  ### Blind Spots and Assumptions

  Detection limits exist, as malware authors may obfuscate MSI file URLs or may use trusted domains for downloads, evading detection. Accurate logging must be configured to capture Event IDs 1040 and 1042 reliably. Legitimate activities such as managed software installations via IT processes may trigger the alert. Related detections, such as tracking changes in installed software (Event ID 1033), can strengthen monitoring by indicating additional context around software changes in the environment.

