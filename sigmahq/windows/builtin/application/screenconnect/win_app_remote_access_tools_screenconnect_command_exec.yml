note: |
  ### Technical Context

  This Sigma rule detects command execution via the ScreenConnect remote management tool, which attackers may misuse to gain unauthorized access to systems. The likely objective for an attacker would be to execute commands remotely for data exfiltration or system manipulation. The relevant MITRE ATT&CK technique is Remote Command Execution (T1059.003). Primary telemetry sources include application logs generated by ScreenConnect, specifically focusing on Event ID 200 that indicates a command being executed. The potential security impact is significant if the command execution is unauthorized, as it can lead to data breaches or unauthorized system changes. This detection does NOT confirm the intent behind the command execution; it merely identifies that a command was executed.

  ### Investigation Steps

  - **Verify ScreenConnect usage:** Check for legitimate organizational use of ScreenConnect by identifying authorized users or documented cases of remote administration in relevant tickets or change management records.

  - **Analyze Event ID 200 logs:** Review application logs for Event ID 200 specifically filtering for instances where the "Data" field contains "Executed command of length." This is a strong indicator of legitimate command execution.

  - **Identify unusual command length:** Look for executed commands with unusual lengths or patterns in the "Data" field within the Event ID 200 logs. Extended command lengths may indicate a scripted attack.

  - **Correlate with user activity:** Cross-reference the timestamps of alert logs with user login events (Windows Security Event ID 4624) to determine if the command execution correlates with an authenticated session.

  - **Assess impact on critical assets:** Identify whether the system executing the command is a critical server or workstation to evaluate potential impact. Prioritize investigations on high-value assets like domain controllers or databases.

  ### Prioritization

  The severity of this alert is low; however, it requires prompt investigation, especially if executed on critical systems. Although the likelihood of malicious abuse is moderate due to the potential for misuse of legitimate tools like ScreenConnect, this command execution behavior may not always indicate nefarious activity.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative activities, especially in environments where ScreenConnect is used regularly. Evasion techniques could include code obfuscation or utilizing alternative remote management tools. It's crucial to ensure logging is properly configured and comprehensive to capture all relevant events from ScreenConnect. A companion detection method could involve monitoring for credential usage associated with RMM tools, helping to establish context for remote commands executed.

