  ---

  ### Technical Context

  This rule detects command execution activities using ScreenConnect, a legitimate remote management tool. Attackers may exploit this tool to execute remote commands on compromised machines, possibly aiming for lateral movement or data exfiltration as part of their toolkit. The relevant MITRE ATT&CK technique is Remote Command Execution (T1059.003). The primary telemetry source comes from the ScreenConnect application logs, specifically looking for Event ID 200. If malicious, this activity can lead to unauthorized access and control over critical systems. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate users may also execute commands through ScreenConnect for administrative purposes.

  ---

  ### Investigation Steps

  - **Review ScreenConnect logs for Event ID 200:** Focus on logs that indicate 'Executed command of length.' Check for unusual command lengths (e.g., excessive or truncated commands) that do not fit normal usage patterns.

  - **Correlate with user account activity:** Validate the identity of users executing commands via ScreenConnect. Look for anomalies such as atypical user accounts (Service accounts) executing commands or access from unexpected geographic locations.

  - **Identify legitimate ScreenConnect usage:** Assess the context around legitimate use by reviewing the command history and confirming scheduled administrative tasks. Ensure that the execution aligns with known operational patterns.

  - **Check for common attack commands:** Investigate the specifics of executed commands for any known malicious patterns (e.g., commands that access sensitive data, establish reverse shells, or persistently modify system settings).

  - **Monitor for process-related logs:** Verify related Windows Security Event ID 4688 for process creation linked to ScreenConnect commands. Focus on entries indicating the creation of suspicious remote processes or commands often used in exploitation scenarios.

  - **Inspect for associated behavioral indicators:** Look for any lateral movement patterns within the network following the command execution, such as unexpected SMB connections or abnormal logins to adjacent systems.

  ---

  ### Prioritization

  The severity of this alert is low due to the common use of ScreenConnect for legitimate remote administration. However, the presence of command execution in this context can be a red flag for malicious activity, warranting further scrutiny. Such behavior could be weaponized in environments where remote management tools are not strictly monitored.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate ScreenConnect usage can lead to false positives. The effectiveness of this detection relies on having adequate logging from the ScreenConnect application enabled. Additionally, understanding trusted internal processes may be necessary to differentiate between benign and malicious activity. It is also helpful to monitor for remote access software misuse as a complementary detection to strengthen overall visibility in the environment.

