  ### Technical Context

  This rule detects file transfer activities conducted via the ScreenConnect remote management tool, specifically monitoring for events indicating files being moved. Attackers may leverage such remote access tools to exfiltrate data or deliver malicious payloads undetected by traditional security mechanisms. The relevant MITRE ATT&CK tactic is "Execution," and the technique is "Command and Scripting Interpreter: Windows Batch" (T1059.003).

  The primary telemetry source for this detection is Windows application logs from the ScreenConnect service, where Event ID 201 indicates file transfer actions. If the activity is confirmed to be malicious, it could lead to data breaches or compromise of sensitive information. However, this detection alone does not confirm that the file transfer was malicious; legitimate use of ScreenConnect by authorized personnel could trigger similar alerts.

  ### Investigation Steps

  - **Check Security Event Logs:**
    Review the Windows Security Event Log for Event ID 4624 (Logon) associated with the user account that initiated the ScreenConnect file transfer. Ensure the account is known to have legitimate ScreenConnect access.

  - **Validate File Transfer Activity:**
    Cross-reference the ScreenConnect application logs for Event ID 201, noting timestamps and file names in the transferred file actions. Look for unusual file names or sizes, which may indicate malicious intent (e.g., executable files).

  - **Analyze Network Traffic:**
    Inspect network logs for external connections or data sent to unfamiliar IP addresses coinciding with ScreenConnect file transfer events. This can help identify potential data exfiltration attempts.

  - **Assess User Behavior:**
    Determine if the user account has established patterns of legitimate use, such as regularly performing file transfers for support tasks. Compare with historical activity to identify anomalies.

  - **Evaluate Touchpoints:**
    Identify other activities in the surrounding timeframe, such as additional Event ID 201 entries, to determine if this is part of a broader, suspicious pattern of activity involving the same user.

  ### Prioritization

  This alert is categorized as low severity due to the common use of ScreenConnect for legitimate remote support activities. While the potential for misuse exists, this behavior is often associated with legitimate administrative tasks rather than being widely weaponized for malicious purposes.

  ### Blind Spots and Assumptions

  The detection is limited by the potential for legitimate users to conduct file transfers without malicious intent, leading to false positives. It requires that ScreenConnect logs are properly configured and retained for accurate monitoring. Legitimate activities, such as routine system maintenance or support, may trigger this alert. A related detection for unauthorized access through ScreenConnect sessions can enhance overall coverage against potential misuse.

