title: Dump Ntds.dit To Suspicious Location
id: 94dc4390-6b7c-4784-8ffc-335334404650
status: test
description: Detects potential abuse of ntdsutil to dump ntds.dit database to a suspicious
  location
references:
- https://twitter.com/mgreen27/status/1558223256704122882
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj574207(v=ws.11)
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
modified: 2023-10-23
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection_root:
    Provider_Name: 'ESENT'
    EventID: 325     # New Database Created
    Data|contains: 'ntds.dit'
  selection_paths:
    Data|contains:
            # Add more locations that you don't use in your env or that are just suspicious
    - ':\ntds.dit'
    - '\Appdata\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - '\Temp\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- Legitimate backup operation/creating shadow copies
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the `ntdsutil` tool to dump the Active Directory (AD) database file, `ntds.dit`, to suspicious locations on a Windows system. Attackers may target this database to harvest credentials and sensitive information, allowing them to escalate privileges or move laterally within the network. The primary objective is often to gain unauthorized access to AD data for the purposes of credential dumping or establishing persistent access.

  The relevant MITRE ATT&CK tactics/techniques include:
  - **TA0002: Execution**
    - **T1040: Tool Usage** - The execution of tools such as `ntdsutil` indicates an attempt to deploy a legitimate tool for malicious purposes.

  Primary data sources for detecting this activity include Windows Application logs, specifically tracking the creation of new databases and monitoring file paths that are commonly associated with suspicious activity (e.g., user profile directories, temporary locations).

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Event Logs for Event ID 325, which indicates the creation of a new database. Filter events for suspicious patterns that involve `ntds.dit`.

  - **Analyze Suspicious File Paths**: Investigate any occurrences where `ntds.dit` has been detected in non-standard file paths such as `C:\Users\Public\` or `C:\Temp\`. This may indicate unauthorized access or activity.

  - **Examine User Activity**: Audit the user activity associated with the execution of `ntdsutil`. Look for unusual user accounts or elevated privileges that may suggest potential malicious intent.

  - **Correlate with Other Logs**: Correlate findings with other data sources like EDR alerts or proxy logs to identify any unusual command line arguments, remote connections, or file transfers that align with the suspicious creation of `ntds.dit`.

  ### Prioritization
  This alert is of medium severity due to the potential for substantial impact if an attacker gains access to the AD database, which could lead to significant breaches of sensitive data and increased risk of lateral movement within the organization.

  ### Blind Spots and Assumptions
  This detection rule may not capture all possible methods of AD database dumping, especially if performed under alternative user contexts or through less common tools. It assumes that the monitored systems are logging necessary event IDs and that monitoring configurations have been correctly set to cover these logs. Detection efficacy may vary depending on the organization's baseline for normal activity and the presence of legitimate backup operations that could generate false positives.

