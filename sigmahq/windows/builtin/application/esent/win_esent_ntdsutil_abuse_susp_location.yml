title: Dump Ntds.dit To Suspicious Location
id: 94dc4390-6b7c-4784-8ffc-335334404650
status: test
description: Detects potential abuse of ntdsutil to dump ntds.dit database to a 
  suspicious location
references:
- https://twitter.com/mgreen27/status/1558223256704122882
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj574207(v=ws.11)
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
modified: 2023-10-23
tags:
- attack.execution
logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection_root:
    Provider_Name: 'ESENT'
    EventID: 325     # New Database Created
    Data|contains: 'ntds.dit'
  selection_paths:
    Data|contains:
            # Add more locations that you don't use in your env or that are just suspicious
    - ':\ntds.dit'
    - '\Appdata\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - '\Temp\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- Legitimate backup operation/creating shadow copies
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential misuse of the `ntdsutil` tool, which is often leveraged by attackers to dump the Active Directory database file `ntds.dit` to non-standard or suspicious locations. The likely objective of such an action is to exfiltrate sensitive credential and identity information from the Active Directory store, aiding in lateral movement, privilege escalation, or long-term access persistence.

  The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006), specifically the technique **NTDS.dit Dump** (T1003.003). Primary telemetry sources include Windows application logs, particularly focusing on Event ID 325, which indicates a new database creation. If malicious, this behavior could facilitate unauthorized access to user credentials, posing significant risk to the organization’s security posture. It’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks, such as backup operations, could trigger similar events.

  ### Investigation Steps

  - **Check Event ID 325 for the `ntds.dit` Creation**: Look for Event ID 325 in the Windows Application logs indicating a new database creation. Confirm that this event references `ntds.dit` in the Data field.

  - **Identify the Creation Path**: Analyze the full path specified in the event's Data field. Legitimate backup paths typically include trusted locations (e.g., backup drives), whereas suspicious locations include `C:\Users\Public\` or `C:\Temp\`.

  - **Examine User and Process Context**: Investigate the user account associated with the event. Administrative or system accounts triggered are high-risk. Additionally, verify the initiating application; usage of `ntdsutil` directly by unrecognized or atypical processes raises suspicion.

  - **Correlate with Other Security Events**: Review previous logs for related or preparatory activities. If there are failed logins or privilege escalations via Event ID 4672 (Special privileges assigned to new logon), this amplifies concern over the legitimacy of the action.

  - **File Activity Monitoring**: Validate the presence of the `ntds.dit` download or copy in the suspicious destination through File Creation Events (Sysmon Event ID 11 for file creation), ensuring it has not been deleted or altered post-action.

  ### Prioritization

  This alert is of medium severity due to the potential compromise of credential data if the action is malicious. The presence of sensitive database dumps in suspicious directories involves a high likelihood of adversarial activity, particularly in environments with Active Directory deployments, where such techniques are frequently weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by the absence of detailed logging or the potential for attackers to disguise their actions through deletion or modification of logs. Legitimate activities could include administrative backups or system maintenance that may trigger the rule. A companion detection that enhances coverage includes monitoring for base-level Windows event logs related to privilege escalation actions, such as Event ID 4672, which can indicate prior malicious attempts to elevate privileges before dumping actions are taken.

