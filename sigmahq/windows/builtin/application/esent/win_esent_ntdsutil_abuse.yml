note: |
  ### Technical Context

  This Sigma rule detects potential abuse of the `ntdsutil` tool, specifically when it is used to dump the `ntds.dit` database, which contains Active Directory (AD) data, including user credentials. The likely attacker objective is to harvest sensitive information to facilitate further unauthorized access within the network. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (T1003.003).

  Primary telemetry sources include Windows Event logs (Event IDs 216, 325, 326, and 327) generated by the ESENT provider, which relate to database operations. If malicious, extracting the `ntds.dit` can lead to significant security breaches, enabling attackers to impersonate users or escalate privileges. Importantly, this detection does not confirm that credentials were successfully extracted or misused; further investigation is necessary to ascertain intent and immediate risk.

  ### Investigation Steps

  - **Review Event Logs for Abnormal Patterns**: Check Windows Event Logs (Event IDs 216, 325, 326, 327) for entries related to `ntds.dit`. Look for timestamps and originating user accounts that do not align with typical administrative activities.

  - **Correlate with User Behavior**: Identify the user account triggering the alert. If the account is a known administrator executing `ntdsutil` under expected backup procedures, this may indicate benign activity. Normal backups will typically show periodic timing and may involve other matching service logs.

  - **Validate Processes and Command Line Usage**: Inspect Sysmon Event ID 1 (process creation) to analyze whether `ntdsutil` was invoked in a suspicious manner. Look for unusual command-line arguments or parent processes that may indicate exploitation.

  - **Check for Other Compromise Indicators**: Cross-reference logs for lateral movement or account enumeration activities leading up to the ntdsutil usage. Look particularly for any use of Mimikatz or other credential dumping tools in conjunction.

  - **Monitor for Subsequent Access Attempts**: After identifying the ntdsutil activity, review authentication logs (Event ID 4624 for successful logins) for any subsequent unauthorized access attempts using the potentially compromised credentials.

  - **Examine Backup Creation Logs**: If backup operations were legitimate, confirm their execution in backup logs (e.g., Windows Backup Event ID 4 or relevant job execution logs) to distinguish between legitimate backups and potential abusive activity.

  ### Prioritization

  The alert has medium severity due to the potential impact on Active Directory, which houses critical user and service authentication data. The likelihood of malicious abuse is high as attackers commonly exploit the ntdsutil tool for credential harvesting. This behavior is weaponized in various attack scenarios, especially in targeted intrusions.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate backup operations and scheduled tasks that similarly utilize ntdsutil, which can lead to false positives. Required log sources include comprehensive Windows logs and Sysmon configurations for effective monitoring. Additionally, legitimate administrative activities, such as authorized backups, may trigger the alert. Companion detections that could strengthen overall coverage include alerts for unusual user activity patterns or other credential access attempts during the same timeframe.

