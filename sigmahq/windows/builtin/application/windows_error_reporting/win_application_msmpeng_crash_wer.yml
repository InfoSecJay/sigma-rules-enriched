logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'Windows Error Reporting'
    EventID: 1001
    Data|contains|all:
    - 'MsMpEng.exe'
    - 'mpengine.dll'
  condition: selection
falsepositives:
- MsMpEng might crash if the "C:\" partition is full
level: high
note: |
  ### Technical Context
  This rule detects a suspicious crash of the Microsoft Malware Protection Engine (MsMpEng.exe), which is a critical component of Microsoft’s antivirus service. The crash may indicate an attempted evasion technique where an attacker manipulates the system to disable malware protection, potentially providing an opportunity to deploy malicious payloads without detection. An attacker targeting this vulnerability may aim to exploit unprotected systems or as part of a larger campaign to compromise enterprise environments.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005): The attacker attempts to evade detection by disabling or crashing security mechanisms.
  - **Exploitation for Client Execution** (T1211): This class of activity includes attempts to exploit software vulnerabilities, which could lead to the execution of malicious code.

  The primary data sources that will provide the most valuable evidence for investigating this alert include Windows Error Reporting logs, which furnish specific details about application crashes, and other event logs that can track the health and operational status of MsMpEng.exe.

  ### Investigation Steps
  - **Verify the Crash Event:** Review Windows Error Reporting logs for Event ID 1001 that indicate a crash involving MsMpEng.exe to confirm the incident's authenticity.
  - **Analyze Recent Changes:** Check for any recent software changes, updates, or installations that may have affected the Microsoft Malware Protection Engine, specifically looking for known vulnerabilities.
  - **Investigate Surrounding Activity:** Examine other system and security logs for unusual activity or processes running around the time of the crash, looking for indicators of compromise or signs of exploitation.
  - **Assess Environment Health:** Evaluate the health and configuration of the Windows environment, ensuring that resources such as disk space are sufficient, to rule out benign causes for the crash.

  ### Prioritization
  Given the potential impact of an attacker successfully disabling antivirus protection, this alert is classified as high severity. If an attacker exploits this functionality, it could lead to undetected malware execution and significant risk to enterprise data.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, especially with legitimate crashes caused by benign factors such as a full C: drive. The detection logic assumes that a crash event involving MsMpEng.exe is indicative of malicious activity, which may not always be the case. Additionally, the effectiveness of this rule relies on the appropriate logging configurations being enabled in the Windows environment, specifically for Windows Error Reporting. Without these logs, the detection will not function as intended.

