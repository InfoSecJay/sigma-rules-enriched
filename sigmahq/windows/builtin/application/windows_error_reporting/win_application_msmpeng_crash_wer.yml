logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'Windows Error Reporting'
    EventID: 1001
    Data|contains|all:
    - 'MsMpEng.exe'
    - 'mpengine.dll'
  condition: selection
falsepositives:
- MsMpEng might crash if the "C:\" partition is full
level: high
note: |
  ### Technical Context

  This rule detects the crash of the Microsoft Malware Protection Engine, specifically identified through Windows Error Reporting events associated with its executable (MsMpEng.exe) and key libraries (mpengine.dll). An attacker may exploit vulnerabilities in the Malware Protection Engine to disable security measures, creating opportunities to deploy malware or perform other malicious actions without detection. This behavior aligns with the MITRE ATT&CK techniques T1211 (Exploitation of Trusted Relationships) and T1685 (Defacement).

  Primary telemetry sources include Windows Event Logs, specifically Event ID 1001 from the 'Windows Error Reporting' provider. If malicious, such a crash can indicate a failure to effectively protect the system from malware, potentially allowing for unauthorized access or data exfiltration. Importantly, this detection does not confirm an attack on its own; a legitimate crash can occur due to system issues, such as insufficient disk space or resource conflicts.

  ### Investigation Steps

  - **Check the crash details:** Review the Windows Error Reporting log for Event ID 1001. Identify if the crash includes "MsMpEng.exe" and "mpengine.dll" in the Data field. A consistent presence of these with elevated system privileges could be suspicious.

  - **Analyze system resource use:** Monitor disk usage, memory allocation, and CPU usage leading up to the crash. System Resource Monitor (resmon) or Task Manager can show if high resource use contributed to the crash, indicating potential benign activity if resources were indeed exhausted.

  - **Determine recent changes:** Review logs for recent software deployments or updates, particularly those involving Microsoft security tools. Look in the Windows Update log (Event ID 20) for updates applied prior to the incident, which may relate to existing vulnerabilities or performance issues.

  - **Identify related security incidents:** Cross-reference alerts from other security solutions (e.g., EDR, AV platforms) logged around the same time. Any concurrent alerts may indicate attempted exploitation of the Malware Protection Engine.

  - **Check for known vulnerabilities:** Utilize vulnerability databases or security intelligence platforms to determine if there are any known CVEs affecting the version of MsMpEng.exe running on the system. This could reveal if the crash correlates with exploitation attempts.

  - **Validate legitimate application behavior:** Ensure that routine operations of the Malware Protection Engine are intact. Normal functionality includes periodic scanning and responses to threats. Monitoring logs for expected activity such as Event ID 2004 (threat detection) can validate that the engine has not been compromised.

  ### Prioritization

  This alert warrants high severity due to the potential impact on system security if the Malware Protection Engine is disabled. The likelihood of exploitation is significant, given the prevalence of attacks targeting security software drivers, making this behavior a known tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate application crashes triggered by system resource constraints or other non-malicious processes. Comprehensive logging must be configured for Windows Error Reporting to ensure reliable detection. Legitimate operations such as system updates or resource-heavy applications can lead to similar crash reports. Companion detections from threat-hunting processes against other security application logs may strengthen coverage against exploitation attempts.

