logsource:
  product: windows
  service: application
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    Provider_Name: 'Windows Error Reporting'
    EventID: 1001
    Data|contains|all:
    - 'MsMpEng.exe'
    - 'mpengine.dll'
  condition: selection
falsepositives:
- MsMpEng might crash if the "C:\" partition is full
level: high
note: |
  ### Technical Context

  This rule detects suspicious crashes of the Microsoft Malware Protection Engine (MsMpEng.exe) via Windows Error Reporting (WER) Event ID 1001. Such behavior may indicate an attempt to exploit vulnerabilities within the anti-malware engine, potentially allowing an adversary to evade detection or disable defenses. The relevant MITRE ATT&CK techniques are Defense Evasion (T1203) and Impact (T1562.001).

  Primary telemetry sources include Windows Event Logs specifically for Application logs where Event ID 1001 is recorded. If the crash is exploited, it could allow the execution of malicious payloads or hinder malware detection capabilities. It’s crucial to note that this detection does NOT confirm malicious intent without further investigation into context and additional evidence.

  ---

  ### Investigation Steps

  - **Check Event ID 1001 logs:**
    Review the Windows Application logs on the affected host for Event ID 1001. Look for crash reports that indicate MsMpEng.exe and mpengine.dll. If both are present with timestamps aligning to the alert, it raises suspicion.

  - **Analyze system disk usage:**
    Verify disk space usage on the affected system. A full "C:\" partition could legitimately trigger crashes of MsMpEng.exe. If space exceeds 90%, this may explain benign behavior, suggesting low priority.

  - **Identify recent changes or updates:**
    Investigate any recent updates or installation of third-party security software on the impacted system. Review relevant logs such as Windows Update logs (Event ID 19) to ensure context aligns without introducing instability.

  - **Correlate with process execution logs:**
    Look for associated process creation logs using Sysmon Event ID 1 and Event ID 4688 to identify any processes that executed around the same time as the crash. Focus on any suspicious parent/child relationships that might indicate malicious activity.

  - **Monitor for subsequent antivirus actions:**
    Check for any subsequent actions taken by Windows Defender post-crash, such as quarantine or delete operations (Event ID 5007). If no remediation actions are logged, it raises concern for ongoing evasion attempts.

  - **Assess system status and alerts:**
    Review overall security status of the system using Microsoft Defender or third-party security tools to check if other alerts triggered or if the system is in a degraded state, indicating compromise.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on security defense mechanisms and the likelihood of being exploited by adversaries. Crashes of security engines are common indicators of attempts to evade detection by malicious actors. Prompt investigation is necessary to mitigate risks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the accuracy of Windows Error Reporting and may be evaded if logs are improperly configured or if the crash is due to other benign software conflicts. Legitimate activities, such as system full-disk notifications or misconfigured software, can also trigger this alert. Consider implementing companion detections for anomalous process creation patterns that could strengthen overall analysis and coverage.

