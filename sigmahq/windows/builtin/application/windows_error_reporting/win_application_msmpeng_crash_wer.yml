  ---

  ### Technical Context

  This rule detects crashes of the Microsoft Malware Protection Engine (MsMpEng.exe), particularly when associated with specific components like mpengine.dll. Such crashes may indicate an adversary’s attempt to exploit weaknesses in security software to disable malicious detection. The relevant MITRE ATT&CK tactics include Defense Evasion (TA0005) and specifically the technique for "Exploitation of Vulnerability" (T1211) and "Manipulation of Software Environment" (T1562.001).

  The primary telemetry source for this detection is Windows Error Reporting (WER), specifically event logs that indicate application errors (Event ID 1001). If the crash is maliciously induced, it could lead to undetected malware activity or allow persistence mechanisms to establish footholds. This detection does NOT confirm malicious behavior by itself; it merely indicates that the malware protection engine has crashed, which could also occur due to benign reasons, such as system resource issues.

  ---

  ### Investigation Steps

  - **Review Event Logs:** Check for Event ID 1001 in the Windows Application log to confirm the crash details. Look for `Provider_Name: 'Windows Error Reporting'`, which specifies the crash is associated with MsMpEng.exe.

  - **Analyze Crash Data:** Investigate the `Data` field in the event log event to correlate crash reports with specific timestamps or actions that preceded the crash. Note whether any known malicious indicators are present, such as unusual execution commands or processes launched prior to the event.

  - **Validate System Resource Usage:** Investigate whether the "C:\" drive is indeed full, as this is a common benign reason for MsMpEng crashes. Look for disk usage metrics in Performance Monitor or Task Manager prior to the crash event for context.

  - **Identify Recent Software Changes:** Cross-reference any recent software installations, updates, or configurations that could influence the stability of MsMpEng. This may include updates to the Windows Defender or third-party applications that interact with it.

  - **Search for High-Confidence Indicators:** Look at the timing and frequency of the crash events; multiple occurrences within a short duration could suggest exploitation attempts. Match this against threat intelligence to see if similar behavior has been observed in active campaigns.

  - **Document Legitimate Activity:** Consider legitimate operational activity that could cause this crash, such as heavy scanning during system updates or backups that tax system resources. This might be noted in IT deployment logs or maintenance schedules.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on endpoint security mechanisms. If exploited, it poses a risk of undetected malicious activity, making the likelihood of abuse high, especially given the historical exploitability of the Malware Protection Engine. This behavior is occasionally weaponized by adversaries actively targeting security software.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as adversaries staging other software crashes to mask their activity. Required log sources include Windows Error Reporting; without this, the detection would be ineffective. Legitimate maintenance operations, like system updates or full disk usage, could also trigger this alert. A complementary detection to consider is monitoring for abnormal process creations related to the Malware Protection Engine for more comprehensive visibility.

