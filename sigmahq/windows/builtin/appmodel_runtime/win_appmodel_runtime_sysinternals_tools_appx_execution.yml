title: Sysinternals Tools AppX Versions Execution
id: d29a20b2-be4b-4827-81f2-3d8a59eab5fc
status: test
description: |
  Detects execution of Sysinternals tools via an AppX package.
  Attackers could install the Sysinternals Suite to get access to tools such as psexec and procdump to avoid detection based on System paths.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/microsoft-store
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-16
modified: 2023-09-12
tags:
- attack.defense-evasion
- attack.execution
logsource:
  product: windows
  service: appmodel-runtime
detection:
  selection:
    EventID: 201
    ImageName:
    - 'procdump.exe'
    - 'psloglist.exe'
    - 'psexec.exe'
    - 'livekd.exe'
    - 'ADExplorer.exe'
  condition: selection
falsepositives:
- Legitimate usage of sysinternals applications from the Windows Store will 
  trigger this. Apply exclusions as needed.
level: low
note: |
  ### Technical Context

  This rule detects the execution of Sysinternals tools, such as psexec and procdump, via AppX packages in a Windows environment. Attackers may utilize these tools to facilitate lateral movement, perform process dumping, or gather system information while attempting to evade detection mechanisms associated with traditional system paths. The relevant MITRE ATT&CK tactics are **Execution** (TA0002) and **Defense Evasion** (TA0005).

  The primary telemetry source for this detection is the AppModel Runtime logs, specifically tracking Event ID 201, which indicates the execution of an application. If this activity is malicious, it could indicate a compromised system and unauthorized access privileges. However, it is crucial to note that this detection does NOT confirm malicious intent or activity on its own, as legitimate system administrators may also use these tools for legitimate purposes.

  ### Investigation Steps

  - **Review the execution details**: Investigate Event ID 201 from the AppModel Runtime logs. Look for the 'ImageName' field containing vulnerable tools (e.g., psexec.exe, procdump.exe). Compare the user context executing the tool against known administrator accounts for legitimacy.

  - **Analyze triggering accounts**: Check the 'SubjectUserName' field in the Event ID 201 logs to determine who executed the application. Cross-reference the account with user roles. Legitimate use cases would typically involve IT staff or system admins executing Sysinternals tools during troubleshooting.

  - **Examine process creation**: Look at Sysmon Event ID 1 logs to track process creation details surrounding the execution of these tools. Check the 'ParentImage' field for traces of how the tool was launched to identify potential chained attacks.

  - **Identify file impacts**: Review application logs and file system changes (e.g., .dmp files for procdump) to find evidence of unusual file creation or exfiltration. Validate the integrity and location of newly created files—legitimate usage may not modify sensitive directories significantly.

  - **Correlate with endpoint security alerts**: Cross-check against any endpoint protection alerts or logs indicating suspicious behavior or policy violations triggered by these tools. A high-confidence malicious indicator would be attempts to execute psexec from non-administrative accounts or unexpected source locations like TEMP directories.

  ### Prioritization

  This alert should be treated with low severity but requires further investigation. While Sysinternals tools have legitimate use in environments for administrative tasks, their execution by non-administrative users or in atypical scenarios may indicate attempts at evasion or lateral movement. Given that these tools are often weaponized by attackers, continuous monitoring is critical.

  ### Blind Spots and Assumptions

  This detection may have limitations against advanced evasion techniques, such as renaming tools or using other legitimate System applications. To improve detection reliability, ensure comprehensive AppModel Runtime logging is enabled across all systems. Be aware that legitimate administrative tasks may trigger this alert, particularly during system maintenance or troubleshooting. A related detection strategy could include monitoring for anomalous scheduling tasks with Sysinternals tools, which complement this rule’s coverage.

