title: Sysinternals Tools AppX Versions Execution
id: d29a20b2-be4b-4827-81f2-3d8a59eab5fc
status: test
description: |
  Detects execution of Sysinternals tools via an AppX package.
  Attackers could install the Sysinternals Suite to get access to tools such as psexec and procdump to avoid detection based on System paths.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/microsoft-store
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-16
modified: 2023-09-12
tags:
- attack.defense-evasion
- attack.execution
logsource:
  product: windows
  service: appmodel-runtime
detection:
  selection:
    EventID: 201
    ImageName:
    - 'procdump.exe'
    - 'psloglist.exe'
    - 'psexec.exe'
    - 'livekd.exe'
    - 'ADExplorer.exe'
  condition: selection
falsepositives:
- Legitimate usage of sysinternals applications from the Windows Store will trigger
  this. Apply exclusions as needed.
level: low
note: |
  ### Technical Context
  This rule detects the execution of certain Sysinternals tools (such as procdump, psexec, psloglist, livekd, and ADExplorer) when run via an AppX package. These tools are commonly leveraged by attackers to perform a range of malicious activities including process manipulation, system monitoring, and data acquisition while attempting to evade detection mechanisms. The use of AppX packaging allows these processes to bypass traditional security measures by executing from less scrutinized locations than standard executable paths.

  The suspected threat family includes generic malicious actors who exploit administrative tools like Sysinternals to establish persistence or exfiltrate data without triggering standard security alerts. By utilizing these tools, attackers can achieve their objectives over stealthy means, gaining a foothold within the network, escalating privileges, or accessing sensitive data. Relevant MITRE ATT&CK techniques include **Execution (T1203)** and **Defense Evasion (T1218)**, as attackers may aim to execute potentially harmful processes while avoiding detection.

  The primary data sources that are crucial to collecting evidence for this detection are Windows AppModel Runtime logs, particularly focusing on EventID 201, which logs the execution of applications via the AppX model. Additional systems monitoring logs from EDR solutions can enrich the context around these tool executions.

  ### Investigation Steps
  - **Review AppModel Runtime Logs:** Examine the Windows AppModel Runtime logs for EventID 201, specifically targeting instances where the listed Sysinternals tools are executed from AppX packages.
  - **Correlate with Process Creation Events:** Query process creation events from the EDR to identify any correlating entries that show these tools' execution, along with parent processes for insights into how malicious activity was initiated.
  - **Analyze Network Traffic:** Investigate any unusual outbound connections or other network traffic that correlates with the timestamps of the detected executions, as attackers might use these tools to send sensitive data outside the enterprise.
  - **Identify User Context:** Check the user accounts that initiated the executions to determine if they align with known administrative accounts or show suspicious behavior patterns, indicating possible account compromise.

  ### Prioritization
  The alert has a low severity level as it may frequently occur with legitimate administrative activities; however, it requires attention due to the potential misuse of trusted tools by malicious actors, which could indicate an ongoing attack.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios involving the legitimate use of these tools in a non-malicious context, leading to potential false positives. The detection logic assumes that any execution of the identified Sysinternals tools via AppX installations indicates suspicious behavior, which might not always hold true. For optimal alert functionality, it is essential to configure logging settings for AppModel Runtime and ensure that monitoring of process creation events is enabled across the environment.

