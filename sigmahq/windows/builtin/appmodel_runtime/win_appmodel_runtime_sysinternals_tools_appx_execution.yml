title: Sysinternals Tools AppX Versions Execution
id: d29a20b2-be4b-4827-81f2-3d8a59eab5fc
status: test
description: |
  Detects execution of Sysinternals tools via an AppX package.
  Attackers could install the Sysinternals Suite to get access to tools such as psexec and procdump to avoid detection based on System paths.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/microsoft-store
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-16
modified: 2023-09-12
tags:
- attack.execution
- attack.stealth
logsource:
  product: windows
  service: appmodel-runtime
detection:
  selection:
    EventID: 201
    ImageName:
    - 'procdump.exe'
    - 'psloglist.exe'
    - 'psexec.exe'
    - 'livekd.exe'
    - 'ADExplorer.exe'
  condition: selection
falsepositives:
- Legitimate usage of sysinternals applications from the Windows Store will 
  trigger this. Apply exclusions as needed.
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals tools that are installed via an AppX package, which may indicate an attacker using these tools to perform reconnaissance, process dumping, or remote command execution while avoiding detection by traditional monitoring methods. The primary objective of the adversary could be privilege escalation, data exfiltration, or establishing persistence.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)**, specifically techniques like **Command-Line Interface (T1059)** and **Scripting (T1064)**. The primary telemetry source is the Windows Event Logs, specifically AppModel runtime logs. If the activity is malicious, it might lead to unauthorized access, privilege escalation, or data compromise. This detection alone does not confirm malicious intent; it identifies tool execution that requires further analysis to establish intent and context.

  ### Investigation Steps

  - **Check for previously logged Sysinternals executions**: Review Event ID 201 logs from the AppModel runtime to correlate previous usage of Sysinternals tools like `procdump.exe` and `psexec.exe`. Look for execution under unusual user accounts or at uncommon times, which may indicate malicious activity.

  - **Identify legitimate use cases**: Verify the context of Sysinternals tool execution by assessing business operations or administrative tasks that necessitate their usage. Common benign use may include IT workflows or system diagnostics initiated by IT administrators.

  - **Evaluate the command-line arguments used**: Inspect the command-line arguments in Event ID 201 logs for `psexec.exe` or `procdump.exe`. Check for signs of unauthorized remote execution, such as execution against multiple systems or with unusual parameters not aligning with standard operational practices.

  - **Cross-reference with process creation logs**: Check for Sysmon Event ID 1 or Security Event ID 4688 that may provide details on parent-child process relationships. Look for suspicious parent processes or arguments that suggest exploitation techniques, like attempts to evade detection (e.g., executing scripts through legitimate-looking applications).

  - **Assess the user account leveraging the tools**: Validate the user account executing these tools against internal policy. If the account does not have a legitimate reason to run these tools or belongs to a user with a low privilege level, escalate for further investigation into possible compromise.

  ### Prioritization

  The alert severity is low given that legitimate use of Sysinternals tools from the Windows Store occurs frequently in enterprise environments, often by IT staff for troubleshooting. However, the possibility of exploitation remains, as tools like `psexec` are commonly weaponized in lateral movement techniques.

  ### Blind Spots and Assumptions

  Detection is limited by the use of AppX-installed tools, which may bypass more conventional monitoring setups. Evasion techniques may include running applications under user accounts with appropriate privileges to avoid scrutiny. Legitimate administrative tasks may trigger these alerts anew, especially among IT personnel. A companion detection involving monitoring for unusual command-line arguments from Event ID 4688 could enhance detection capabilities surrounding this behavior.

