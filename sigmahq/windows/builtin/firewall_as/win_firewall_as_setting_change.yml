note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Firewall settings, which may indicate an attempt by an adversary to manipulate firewall rules, potentially to bypass security measures or enable further malicious activities. The likely attacker objective is to open ports or allow specific inbound/outbound traffic to facilitate lateral movement or data exfiltration undetected. This behavior aligns with the MITRE ATT&CK tactic “Defense Evasion” and the technique “Modify System Image” (T1686.003).

  The primary telemetry sources include Windows Security Event logs, specifically Event IDs related to firewall configurations and group policy changes. If malicious, a successful alteration can lead to increased attack surface and vulnerability exploitation. However, this detection does NOT confirm that the changes are malicious on their own; there may be legitimate administrative actions or updates.

  ### Investigation Steps

  - **Review relevant Event IDs:** Check for Event IDs 2002, 2083, 2003, 2082, and 2008 in the Windows Security Event logs to gather specific details on what firewall settings were altered.

  - **Check for additional context in logs:** Look at associated logs for user account activity, particularly elevated privileges, around the time of firewall rule changes—knowledge of admin users involved can help verify legitimacy.

  - **Identify expected legitimate configurations:** Compare current firewall settings against established baseline configurations for the host and verify if changes align with scheduled maintenance or updates.

  - **Assess high-confidence malicious indicators:** Investigate if the changes allow connections on unusual ports or protocols (e.g., HTTP/S, SSH) not typically used for the asset’s role. This deviation from norms indicates potential malicious intent.

  - **Correlate with other security alerts:** Examine if there are any other concurrent alerts or events, such as unusual login attempts or command execution (e.g., via Event ID 4688 for process creations), that could indicate a correlated attack.

  - **Validate unauthorized modifications:** Check the firewall settings to determine if rules permit external traffic that should be blocked, and document any inappropriate access patterns from the last few hours.

  ### Prioritization

  The alert's severity is low, but it demands attention due to the potential impact on system integrity and security if malicious. The likelihood of abuse is moderate, especially in environments where control over the firewall is critical. Although such changes are not the most common initial attack vectors, they can lead to or facilitate further exploitation.

  ### Blind Spots and Assumptions

  The detection may have limitations if log retention policies are insufficient, risking the loss of relevant Event IDs. Evasion techniques might include legitimate administrative tasks or configuration changes during scheduled maintenance windows. Additionally, benign activities, such as group policy updates, may trigger this alert. Companion detections to consider include monitoring for unusual outbound traffic patterns that correlate with firewall changes, which could reinforce indicators of an ongoing attack.

