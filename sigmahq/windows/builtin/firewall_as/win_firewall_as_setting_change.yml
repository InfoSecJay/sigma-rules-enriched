note: |
  ### Technical Context

  This rule detects changes to Windows Firewall settings, which can indicate potential attempts to alter security controls to allow malicious traffic or block legitimate security measures. The likely attacker objective is to manipulate firewall configurations to facilitate network access for unauthorized activities or to hinder detection tools. This behavior corresponds with the MITRE ATT&CK tactic of Defense Evasion (T1562.004).

  Primary telemetry sources include Windows Event Logs, specifically focusing on Event IDs 2002, 2003, 2008, and their counterparts in Windows 11. The security impact of such changes could be significant, leading to unauthorized access or data exfiltration. However, this detection does not confirm malicious intent on its own; legitimate administrative actions can also trigger alerts.

  ### Investigation Steps

  - **Check Event IDs:** Review Windows Security Event Logs for Event IDs 2002, 2003, 2008, and 2083 to identify the exact nature of the firewall changes. Focus on the timestamp and user context of these events to determine if they align with expected administrative activity.

  - **Identify the User Account:** Verify the user account that initiated the change. Cross-reference with legitimate administrative users or roles, such as system administrators or security personnel, who may routinely configure firewall settings.

  - **Examine Recent Firewall Rules:** Review the specific changes made in the firewall configurations by analyzing the associated log entries. Look for added, removed, or modified rules, especially those that enable inbound traffic or deny outbound security features.

  - **Legitimate Behavior Verification:** Confirm if the changes occurred during scheduled maintenance windows or updates. Investigate any requested adjustments documented in IT change management logs, which can indicate benign administrative actions.

  - **Assess Network Impact:** Analyze network traffic logs from security appliances (e.g., IDS/IPS) to detect any unusual patterns that correspond with the changes made. Look for traffic that was previously blocked but allowed after the firewall alterations.

  - **Check Against Baseline Configurations:** Compare the changed firewall settings against established baseline configurations or security standards mandated by your organization. Significant deviations may indicate suspicious activity.

  ### Prioritization

  The severity of this alert is moderate. Changes to firewall settings can substantially impact network security and may be exploited by attackers for lateral movement or exfiltration. Frequent exploitation of similar tactics by adversaries raises concern around potential malicious activity, especially on critical systems.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative changes if logs are not consistently collected or if Event Log auditing is not adequately configured. Common evasion techniques include disabling logging or performing changes during periods of low monitoring activity. Legitimate activity such as patch management or software installation may also lead to settings changes. A related detection could be unauthorized changes to security group policies, enhancing overall coverage of firewall settings manipulations.

