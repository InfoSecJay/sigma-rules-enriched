title: A Rule Has Been Deleted From The Windows Firewall Exception List
id: c187c075-bb3e-4c62-b4fa-beae0ffc211f
status: test
description: Detects when a single rules or all of the rules have been deleted 
  from the Windows Defender Firewall
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2024-08-29
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2006         # A rule has been deleted in the Windows Defender Firewall exception list
    - 2052         # A rule has been deleted in the Windows Defender Firewall exception list. (Windows 11)
  filter_main_generic:
    ModifyingApplication|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\WinSxS\'
  filter_main_svchost:
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  filter_main_null:
    ModifyingApplication:
  filter_main_empty:
    ModifyingApplication: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deletion of rules from the Windows Defender Firewall exception list. Such behavior can indicate an attempt by an adversary to impair defense mechanisms, potentially allowing malicious traffic to bypass network controls. The likely objective of the threat actor may involve establishing persistent access or facilitating lateral movement by reducing visibility and protection against outbound connections.

  This detection maps to the MITRE ATT&CK tactic of Defense Evasion (ID: TA0057), specifically targeting the technique of Disable Security Tool (ID: T1686.003). Primary telemetry sources include Windows Security Event Logs (Event ID 2006 and Event ID 2052). If malicious, this activity could create pathways for an attacker to execute malicious commands undetected. However, this detection does not confirm that a deletion was malicious or part of an attack, as legitimate administrative activity may also result in similar log entries.

  ### Investigation Steps

  - **Review relevant security event logs**: Check Windows Security Event Logs for Event ID 2006 or 2052 to confirm rule deletions. Look for fields indicating which application performed the deletion and the specific rules that were affected.

  - **Identify the modifying application**: Examine the `ModifyingApplication` field associated with the event logs. Legitimate applications typically include `svchost.exe` or known management tools. Unusual paths (e.g., custom executables or scripts) indicate potential malicious activity.

  - **Correlate user activity**: Investigate the user account associated with the event. Check for any recent administrative activity or related tasks. Legitimate activity might include maintenance tasks carried out by IT personnel.

  - **Assess firewall configuration**: Verify the current firewall rules using Windows Firewall with Advanced Security console. Assess whether critical rules for inbound or outbound traffic have been removed or altered.

  - **Look for suspicious network traffic**: Utilize network monitoring tools to analyze outbound connections from systems that registered deletions. High volumes of unexplained or suspicious connections may indicate exploitation of the removed rules.

  - **Check for related logs**: Review Application and System Event Logs for any other unusual behavior around the time of the event, such as privilege escalation attempts or changes to security policies that may further indicate malicious intent.

  ### Prioritization

  The severity of this alert is moderate due to the potential impact on the security posture of affected systems, creating a risk of unauthorized communication that could lead to data exfiltration or further compromise. While this behavior could result from benign administrative actions, it is also indicative of a common tactic among threat actors aiming to exploit weaknesses in firewall configurations.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative changes that also result in deletions, leading to false positives. Reliable detection requires configured logging for Windows Firewall events, which may not always be enabled in all environments. This alert may also trigger during routine maintenance or policy updates, highlighting the need for context around user activity. A related detection for unusual process creation (Event ID 4688) can strengthen coverage against broader exploitation tactics.

