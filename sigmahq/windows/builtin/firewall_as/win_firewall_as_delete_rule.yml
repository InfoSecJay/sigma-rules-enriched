title: A Rule Has Been Deleted From The Windows Firewall Exception List
id: c187c075-bb3e-4c62-b4fa-beae0ffc211f
status: test
description: Detects when a single rules or all of the rules have been deleted from
  the Windows Defender Firewall
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2024-08-29
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2006         # A rule has been deleted in the Windows Defender Firewall exception list
    - 2052         # A rule has been deleted in the Windows Defender Firewall exception list. (Windows 11)
  filter_main_generic:
    ModifyingApplication|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\WinSxS\'
  filter_main_svchost:
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  filter_main_null:
    ModifyingApplication:
  filter_main_empty:
    ModifyingApplication: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context
  This detection rule identifies events related to the deletion of rules within the Windows Defender Firewall exception list. Such deletions can signify attempts to bypass or evade security measures, particularly in the context of malicious activities. Attackers may aim to disable protections or enable easier access to compromised systems, facilitating further network exploitation or lateral movement within the environment.

  The suspected threat behavior falls under the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and specifically leverages the technique of **Indicator Removal on Host** (T1562.004). This technique encompasses actions where an attacker alters or removes protective measures, such as firewall rules, to reduce visibility and improve chances of maintaining persistence within the environment. The primary data sources relevant to this detection include Windows event logs, specifically Event IDs 2006 and 2052, which document modifications to the firewall configuration.

  ### Investigation Steps
  - **Review Firewall Event Logs**: Check Windows Firewall Event Logs for Event IDs 2006 and 2052 to identify any changes in firewall rules. Focus on the timestamps to correlate with potential malicious activity in the environment.
  - **Analyze Application Modifications**: Investigate the modifying application associated with the deletions, paying attention to whether it is a legitimate application or potentially malicious. Review any anomalous behaviors surrounding these applications during the time of rule deletion.
  - **Correlate with Other Security Logs**: Look for related security events in additional logs, such as EDR logs, to assess whether the deletion correlates with other suspicious activities or alerts that may indicate compromise.
  - **Evaluate System Integrity**: Conduct a thorough evaluation of system configurations and network activity for signs of lateral movement, persistence mechanisms, or other defense evasion behaviors that coincide with the firewall rule changes.

  ### Prioritization
  This alert is considered medium severity due to its potential impact; modifications to firewall rules can significantly alter the security posture of an enterprise network. The likelihood of such events being part of a malicious campaign increases if correlated with other suspicious activities or patterns.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise if logs for the relevant Event IDs are not retained or Sysmon is not configured to monitor firewall changes comprehensively. Additionally, the detection logic assumes that a legitimate administrative action will not typically result in simultaneous deletions of multiple rules; thus, false positives might occur in environments with high volumes of firewall management activities. Proper logging configuration and monitoring of administrative actions are essential for the effectiveness of this rule.

