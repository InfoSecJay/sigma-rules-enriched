title: A Rule Has Been Deleted From The Windows Firewall Exception List
id: c187c075-bb3e-4c62-b4fa-beae0ffc211f
status: test
description: Detects when a single rules or all of the rules have been deleted 
  from the Windows Defender Firewall
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2024-08-29
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2006         # A rule has been deleted in the Windows Defender Firewall exception list
    - 2052         # A rule has been deleted in the Windows Defender Firewall exception list. (Windows 11)
  filter_main_generic:
    ModifyingApplication|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\WinSxS\'
  filter_main_svchost:
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  filter_main_null:
    ModifyingApplication:
  filter_main_empty:
    ModifyingApplication: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This rule detects instances where a rule has been removed from the Windows Defender Firewall exception list, as indicated by Event IDs 2006 or 2052. Attackers may aim to disable defenses, enabling other malicious activities such as lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "Disable Security Tools" (T1562.004).

  The primary telemetry sources are Windows Security Event logs (Event ID 2006 or 2052). If malicious, the security impact could be significant, as it may allow unrestricted access to services and applications potentially exposing the network. This detection does not confirm malicious intent on its own; legitimate software and administrative actions may trigger these events.

  ### Investigation Steps

  - **Check Event Logs: ** Review Windows Security Event Logs for Event ID 2006 and Event ID 2052 on affected hosts to confirm the deletion of firewall rules.

  - **Identify Modifying Applications: ** Inspect the `ModifyingApplication` field for known legitimate applications (e.g., 'svchost.exe' or standard update processes) to rule out benign activity.

  - **Correlate with Other Security Events: ** Look for related log entries, like failed login attempts or unauthorized service startup, in the Windows Event Log (Event ID 4625) that may indicate a broader attack.

  - **Analyze Recent Changes: ** Review the timeline of detected deletions with configuration change logs (if available) to determine if they correlate with changes in network behavior or administrative tasks.

  - **Assess Router/Firewall Logs: ** Analyze firewall logs for allowed or blocked connections post the firewall rule deletion to identify any suspicious outbound connections that might indicate exploitation.

  - **Confirm Legitimate Activity: ** Evaluate legitimate administrative actions by looking for scheduled maintenance windows that might account for the rule changes or updates to the system.

  ### Prioritization

  This alert carries a medium severity level because the impact depends on the role of the affected system within the network. Although not frequently weaponized in isolation, the deletion of defenses can indicate preparatory steps for more significant malicious activity if combined with other indicators of compromise (IOCs).

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through altered logging configurations or actions orchestrated by legitimate administrators. Required log sources must include comprehensive Windows Security Event logs to capture the full context. Legitimate activities, such as automated software updates or administrative scripts, may also trigger this alert. A related detection would be monitoring for the creation or deletion of firewall rules in conjunction with outbound connection logs, which would enhance the overall coverage of network defense integrity.

