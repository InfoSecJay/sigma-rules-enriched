title: A Rule Has Been Deleted From The Windows Firewall Exception List
id: c187c075-bb3e-4c62-b4fa-beae0ffc211f
status: test
description: Detects when a single rules or all of the rules have been deleted 
  from the Windows Defender Firewall
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2026-10-19
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2006         # A rule has been deleted in the Windows Defender Firewall exception list
    - 2052         # A rule has been deleted in the Windows Defender Firewall exception list. (Windows 11)
  filter_main_generic:
    ModifyingApplication|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\WinSxS\'
  filter_main_local_system:
        # Added to filter out modifications made by the Local System account as these are typically legitimate system actions and cause false positives.
    ModifyingUser: 'S-1-5-18'
  filter_main_msiexec:
    ModifyingApplication:
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\msiexec.exe'
  filter_main_svchost:
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  filter_main_msmpeng:
    ModifyingApplication|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  filter_main_null:
    ModifyingApplication:
  filter_main_empty:
    ModifyingApplication: ''
  filter_optional_google_updater:
    ModifyingApplication|startswith: 'C:\Windows\SystemTemp\'
    ModifyingApplication|contains: 'GoogleUpdater'
    ModifyingApplication|endswith: '\setup.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of one or more rules from the Windows Defender Firewall exception list as indicated by Event IDs 2006 and 2052. This behavior may signify an attempt by an attacker to weaken firewall protections, potentially facilitating lateral movement, data exfiltration, or command and control (C2) communications. Relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1562) and the technique specifically is "Modify Firewall Rules" (ID: T1686.003). The primary telemetry source for this detection comes from the Windows Event Logs, specifically focusing on the Security logs and System logs for the aforementioned Event IDs. If malicious, this could lead to unauthorized access or exploitation of systems, increasing overall risk to the organization. This detection by itself does not confirm that malicious activity is occurring; it only indicates that a firewall rule has been altered or deleted, which could also be performed by trusted applications.

  ### Investigation Steps

  - **Check Event Details**: Review the Windows Security Event logs for Event IDs 2006 or 2052. Assess `SubjectUserName`, `SubjectDomainName`, and `SubjectLogonID` fields to identify the user or process responsible for the rule deletion.

  - **Analyze the Modifying Application**: Look at the `ModifyingApplication` field from the event logs. Verify if it matches any known legitimate applications (e.g., `msiexec.exe`, `svchost.exe`). An unknown or unexpected application may indicate malicious behavior.

  - **Cross-reference with Asset Inventory**: Confirm the role of the affected system (e.g., server, workstation) and its criticality to your organization. Deletion of firewall rules on critical assets poses a higher risk.

  - **Identify Recent Changes**: Investigate if there were recent software updates or installations around the time of the event. Corresponding Event IDs (e.g., 11724 for installation events) from the Application log may help validate legitimate changes.

  - **Evaluate Firewall Configuration History**: Check the firewall configuration history through Windows PowerShell or Group Policy changes to correlate any legitimate modifications that could explain the rule deletion.

  - **Monitor for Additional Signs of Compromise**: Since rule deletion can indicate lateral movement, review other related logs or alerts (e.g., unusual outbound traffic in Firewall logs or Authentication logs for unauthorized access attempts).

  ### Prioritization

  The alert is of medium severity due to potential impact on critical assets and the likelihood of exploitation if an attacker can bypass firewall protections. Since deletion of firewall rules can facilitate common attack paths, such as exfiltration or C2 communications, it should be investigated swiftly.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by configurations that do not log all firewall modifications or due to specific event filtering. Legitimate administrative actions, such as updates or configuration changes, may trigger this alert, thus necessitating context for investigative actions. A companion detection such as monitoring for unauthorized inbound/outbound traffic could strengthen overall security posture and provide supplementary context for assessing the potential impact of the alert.

