note: |
  ### Technical Context

  This Sigma rule detects the addition of a new rule to the Windows Firewall exception list for applications located in directories often associated with suspicious activities, such as temporary folders or public directories. Likely attacker objectives include bypassing firewall protections to enable communication with malicious software or command-and-control (C2) servers. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562.001: Impair Defenses) and Application Layer Protocol (T1071.001: Application Layer Protocol: Web Protocols).

  Primary telemetry sources include Windows Event Logs, specifically Event IDs 2004, 2071, and 2097, which capture the addition of rules to the firewall exception list. If malicious, this could lead to unauthorized network access and data exfiltration. However, this detection alone does not confirm that the application is malicious; it merely indicates potential evasion behavior that needs further investigation.

  ### Investigation Steps

  - **Confirm event details:** Review Windows Event ID 2004, 2071, or 2097 logs for associated timestamps, user accounts, and application paths. Look for paths containing suspicious directories like `C:\Temp\`, `C:\PerfLogs\`, or `C:\Users\Public\`; any rule adding an application from these locations is particularly concerning.

  - **Review application legitimacy:** Validate the application path against known software inventory. Legitimate software typically resides in `C:\Program Files\` or similar locations. Any deviation, especially if the application recently executed or was installed, should warrant scrutiny.

  - **Check user context:** Assess the user account that created the firewall rule. If it’s a system or administrative account without appropriate usage, flag it as potentially unauthorized.

  - **Correlate with other alerts:** Examine recent alerts linked to the affected system for additional context, especially related to unusual application behavior or known vulnerabilities. High-confidence indicators include simultaneous alerts from antivirus solutions about the same application.

  - **Investigate network activity:** Use network monitoring tools to analyze traffic from the application associated with the newly added firewall rule. Look for unusual outbound connections or C2 callbacks, which could suggest exploitation or data exfiltration.

  ### Prioritization

  This alert should be considered high priority due to its implications for system integrity and security. Applications circumventing firewall rules are often associated with malicious activity, especially when leveraging untrustworthy file paths. Such behavior is frequently exploited by attackers to facilitate unauthorized access and data breaches.

  ### Blind Spots and Assumptions

  Detection might be circumvented by legitimate administrative activities or automated processes that adjust firewall rules. Ensure logging is correctly configured for all relevant Windows Event Logs to maintain reliable detection. Legitimate software installation or updates might temporarily trigger this alert, especially for software that uses temporary directories for installation. Related detections of execution from these paths would strengthen coverage and provide context for further investigation.

