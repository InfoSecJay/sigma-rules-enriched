note: |
  ---

  ### Technical Context

  This rule detects the addition of a new rule to the Windows Firewall exception list, targeting applications located in potentially suspicious directories such as 'Temp', 'PerfLogs', or 'Public'. The likely attacker objective is to allow outbound network connections from a malicious application by bypassing firewall controls, facilitating data exfiltration or command-and-control communications. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.004 (Disable or Modify Security Tools).

  The primary telemetry sources for this detection are Windows Security Event Logs, particularly Event IDs 2004, 2071, and 2097. If malicious, this activity can lead to unauthorized access or data breaches. This detection does NOT confirm malicious intent on its own but indicates the need for further investigation into the application's behavior and context.

  ---

  ### Investigation Steps

  - **Review application path and context:** Check the `ApplicationPath` field in Event ID 2004/2071/2097 logs. Assess if the application triggering the rule resides in suspicious locations (e.g., `C:\Users\Public\`, `C:\Temp\`) which may indicate a legitimate application being misused.

  - **Correlate with recent system activity:** Investigate recent event logs (Event ID 4688) for process creation to see if the added firewall rule coincides with the execution of suspicious processes. Look for unusual parent processes or command-line arguments associated with the application.

  - **Analyze active connections:** Examine current outbound network connections (using tools like `netstat`) for the application to determine if suspicious communication is occurring. Note connections to known malicious IPs or unusual ports that the application is attempting to connect to.

  - **Check for additional security policy changes:** Review Group Policy logs (Event ID 4704) for any recent changes that could affect firewall configurations. Determine if these changes coincide with the firewall rule addition.

  - **Identify known malicious indicators:** Search for the presence of known indicators such as hashes of suspicious applications or check if the application path matches any previously documented malware behavior. Use threat intelligence sources for comparison.

  ---

  ### Prioritization

  This alert should be treated as high severity given that the behavior involves modifying firewall rules, which can significantly impact system security. The likelihood of this behavior being malicious is elevated, particularly given the known tactics of adversaries to evade detection by altering firewall settings. This specific activity is commonly weaponized in attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if necessary logs are not enabled or if legitimate applications reside in the same suspicious directories. Common evasion techniques include attackers placing their applications in non-standard locations or using legitimate software for malicious purposes. Legitimate administrative tasks, such as software updates, may also trigger similar alerts. Companion detections, such as monitoring changes to Windows Defender settings or using EDR solutions, can enhance overall coverage and provide a clearer context for this type of activity.

