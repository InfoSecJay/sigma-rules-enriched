note: |
  ### Technical Context

  This Sigma rule detects the addition of a new rule to the Windows Firewall exception list for applications located in potentially suspicious directories such as `Temp`, `PerfLogs`, or `Public`. The likely objective of an attacker is to allow unwanted network traffic for malicious applications, thereby facilitating data exfiltration or command and control communication. This activity is relevant to the MITRE ATT&CK tactic "Defense Evasion" (ID T1562), specifically the technique "Disable or Modify Tools" (ID T1562.004).

  The primary telemetry sources include Windows Security Event logs, specifically Event IDs 2004, 2071, and 2097. If this behavior is confirmed as malicious, it can lead to significant security impacts such as unauthorized data access, exfiltration, or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to understand the context and motivations behind the firewall change.

  ---

  ### Investigation Steps

  - **Review the Event IDs**: Check Event IDs 2004, 2071, and 2097 in Security Event logs for the specific account that made the modifications. Look for abnormal user behavior, such as changes made by non-administrative accounts or administrative tasks performed outside of normal hours.

  - **Analyze the Application Path**: Examine the `ApplicationPath` field in the event log. If the path contains suspicious directories (e.g., `:\Temp\`, `:\PerfLogs\`), further investigate those applications. Legitimate applications typically reside in `C:\Program Files\` or `C:\Program Files (x86)\`.

  - **Check for Firewall Block Actions**: If applicable, determine if any newly added rules for the application were configured to "Block" (Action: 2). This can indicate an attempt to restrict program access in a suspicious manner, warranting further scrutiny of the application behavior.

  - **Identify Known Malicious Indicators**: Correlate the application name and path with threat intelligence sources or internal indicators of compromise (IOCs). High-confidence malicious indicators may include executables known in the wild for misuse, particularly those with unusual file sizes or signatures.

  - **Examine User and Group Context**: Review the user and group permissions associated with the change. Focus on whether the change aligns with expected roles. If an operations account with limited permissions is modifying firewall settings, this raises red flags.

  - **Monitor for Related Changes**: Review the logs for related changes to firewall settings, such as Event ID 2005 (rule modification) or new outbound connection attempts logged in network telemetry, which could indicate leveraging the newly added exception.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential for malicious exploitation in critical systems, especially if the affected assets are part of sensitive environments. The likelihood of abuse is elevated given the common use of firewall rule modifications in various attack scenarios, including malware deployments and lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may modify legitimate applications or create new rules in trusted locations to avoid detection. Reliable detection depends on properly configured Windows security logs and the availability of real-time log monitoring. Legitimate activities that may trigger the alert include routine updates or modifications by system administrators for approved applications. A related detection rule that strengthens coverage would monitor for unauthorized process creations from modified applications, such as via Sysmon Event ID 1.

