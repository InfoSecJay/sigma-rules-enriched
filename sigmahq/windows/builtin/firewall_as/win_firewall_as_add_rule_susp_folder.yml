note: |
  ### Technical Context
  This detection rule identifies the addition of a new entry to the Windows Firewall exception list pertaining to applications located in potentially suspicious directories. The rule flags modifications related to application paths commonly associated with temporary file storage or logs, which are often abused by attackers to execute malicious code or evade detection.

  In scenarios where threat actors aim to compromise a network, they may use techniques to manipulate firewall settings to allow unauthorized communications or to install backdoors in the system. This behavior aligns with **MITRE ATT&CK** tactics and techniques such as **Defense Evasion (TA0005)** and **Application Layer Protocol (T1071)**. By monitoring for changes in the Windows Firewall settings, we can uncover potential indicators of attackers attempting to create persistence or to establish command and control channels.

  Key data sources for this detection include Windows event logs that register changes to the firewall settings (specifically, Event IDs 2004, 2071, and 2097). These logs provide the necessary context to assess whether the rule addition is legitimate or indicative of suspicious activity.

  ### Investigation Steps
  - **Review Firewall Logs:** Examine Windows event logs related to firewall rule changes (Event IDs 2004, 2071, and 2097) for any newly added exceptions. Look for unusual application paths that could indicate malicious activity.
  - **Verify Application Sources:** Investigate the source of the application by cross-referencing the detected application paths against known safe and malicious software repositories. Pay special attention to software located in `Temp`, `Public`, or `AppData` directories.
  - **Check System and Process Activity:** Analyze system process creation logs for any associated processes that were executed around the same time the firewall rule was added. Look for irregular command line parameters or execution from suspicious paths.
  - **Conduct Network Traffic Analysis:** Use network traffic logs to observe any connections initiated by the newly allowed application. Focus on outbound traffic patterns, especially connections to known malicious IPs or unexpected external services.

  ### Prioritization
  Given that this detection rule identifies potential manipulation of firewall settings, which could facilitate unauthorized access or lateral movement, it carries a **high severity level**. The likelihood of adversaries exploiting such configurations to maintain persistence or evade security measures justifies immediate attention.

  ### Blind Spots and Assumptions
  There may be blind spots if the organization uses third-party firewall solutions that do not log relevant events, or if logging levels are not set to capture detailed installation and configuration changes. This detection logic assumes that the standard paths for malicious applications have remained consistent, which may not account for custom or atypical installations. Additionally, it requires that firewall logging is properly enabled and configured to capture the relevant Event IDs for effective detection.

