logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
    Action: 3     # Allow
    ModifyingApplication|endswith: ':\Windows\System32\wbem\WmiPrvSE.exe'
  condition: selection
falsepositives:
- Administrator scripts or activity.
level: medium
note: |
  ### Technical Context

  This rule detects the addition of a new "Allow" firewall rule via the Windows Management Instrumentation (WMI) process (WmiPrvSE.EXE). This behavior is often indicative of a threat actor modifying firewall settings to permit unauthorized traffic, potentially facilitating lateral movement or data exfiltration. The relevant MITRE ATT&CK technique for this behavior is **Defense Evasion: Modify System Process** (T1562.004).

  Primary telemetry sources include Windows Event Logs, specifically Event ID 2004, 2071, or 2097 related to firewall rule changes. If malicious, the addition of new firewall rules could severely impact network security by allowing unexpected or harmful traffic. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Review Event Details**: Look at Event ID 2004, 2071, or 2097 in Security logs. Examine fields such as **`ModifyingApplication`** to confirm it's from **WmiPrvSE.EXE** and check the **`FriendlyName`** of the rule added for suspicious names like "Allow All Traffic."

  - **Validate Scheduled Tasks**: Check for any recent Windows Scheduled Tasks or scripts that utilize PowerShell or WMI to manage firewall rules. Look for tasks that invoke execution via **`New-NetFirewallRule`** or related PowerShell cmdlets.

  - **Cross-reference IP Allowlist**: Ensure the newly added firewall rules align with documented company policies. Determine if the **`RemoteAddress`** specified in the rule is a known legitimate range or IP.

  - **Identify Historical Changes**: Review historical firewall configuration changes to identify patterns. Look for unusual frequencies or changes that do not correlate with normal maintenance and updates in the **Windows Firewall logs**.

  - **Assess User Context**: Check the source account that performed this action through logs. If the action originates from a service account or unexpected user account, it raises the potential for suspicious activity.

  - **Review Recent Incident Reports**: Investigate any recent incidents tied to the systems involved. Correlate the timing of the rule addition with any known malicious activity, particularly references to know ransomware like the **Rhysida** ransomware.

  ### Prioritization

  This alert should be considered of **medium severity** due to the potential for significant impact on network security if misused. The likelihood of malicious abuse is moderate, as modifying firewall rules is often weaponized by attackers to exploit weaknesses or access restricted areas of the network.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions, such as planned or approved firewall rule changes by IT staff. Evasion techniques used by attackers could include utilizing legitimate administrative tools or services to mask their activity. To ensure reliable detection, Windows Firewall Event logging must be correctly configured and enabled on critical assets. A related detection to consider is monitoring for excessive Use of **WMI** commands or **PowerShell** executions that modify system configurations, as they can indicate broader defense evasion tactics being employed.

