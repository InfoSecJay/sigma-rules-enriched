logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
    Action: 3     # Allow
    ModifyingApplication|endswith: ':\Windows\System32\wbem\WmiPrvSE.exe'
  condition: selection
falsepositives:
- Administrator scripts or activity.
level: medium
note: |
  ### Technical Context
  This detection rule alerts on the addition of new "Allow" firewall rules through the Windows Management Instrumentation (WMI) process, specifically `WmiPrvSE.EXE`. The presence of these modifications can indicate a potential security risk if they are made outside of standard administrative practices. Attackers may leverage these events to create exceptions in the firewall, allowing unauthorized connections or facilitating lateral movement within the network. This type of activity can be associated with various threat actors using tactics to evade detection, including those involved in ransomware campaigns such as Rhysida.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562.004)**: Suppressing alarms by altering firewall rules.

  The primary data sources for this detection rule are Windows event logs related to firewall actions, particularly Event IDs 2004, 2071, and 2097, which track modifications to the firewall exception list.

  ### Investigation Steps
  - **Review Firewall Logs**: Examine Windows Firewall logs for entries corresponding to the identified Event IDs (2004, 2071, 2097) to verify the timing and details of the firewall rule changes.
  - **Analyze `WmiPrvSE.EXE` Activity**: Investigate the process tree to understand if `WmiPrvSE.EXE` was invoked by an authorized user or from another suspicious process, potentially pointing to a compromised script or tool.
  - **Assess Recently Created Rules**: Identify new firewall rules that have been added in a specific time frame around the alert. Check their parameters to determine if they facilitate unexpected traffic patterns.
  - **Correlate with User Activity**: Check for user actions or automated scripts around the time of the log entries. Look for any unauthorized or unusual behavior that may have triggered the rule addition.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for unauthorized access and the ability to create pathways for further malicious activities, especially if it stems from untrusted sources.

  ### Blind Spots and Assumptions
  There may be limitations in detection coverage for legitimate administrative actions, as this rule could alert on benign changes made by legitimate administrators executing scripts. The detection logic assumes that any addition to the firewall exception list through `WmiPrvSE.EXE` is suspicious unless verified. This requires that relevant Windows firewall logs are collected and that the logging level is properly configured to capture the necessary Event IDs associated with firewall modifications.

