logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
    Action: 3     # Allow
    ModifyingApplication|endswith: ':\Windows\System32\wbem\WmiPrvSE.exe'
  condition: selection
falsepositives:
- Administrator scripts or activity.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the addition of a new "Allow" firewall rule using the WMI process WmiPrvSE.EXE. Adversaries may exploit this to adjust network defenses, allowing unauthorized connections or exfiltration paths. This behavior typically indicates an attempt to facilitate lateral movement or maintain persistence in the environment. The relevant MITRE ATT&CK techniques are Defense Evasion (T1562.004).

  Primary telemetry sources include Windows Event Logs, specifically focusing on Event IDs 2004, 2071, and 2097, which log modifications to the Windows Firewall. If successful, these actions could enable an attacker to bypass firewall protections and increase their foothold within the network. However, the detection alone does not confirm malicious intent, as legitimate administrative actions might trigger the same alert.

  ---

  ### Investigation Steps

  - **Examine Event Logs**: Review Windows Security Event Log for Event IDs 2004, 2071, and 2097. Focus on timestamps and associated user accounts to determine if the firewall modifications coincide with known administrative activities.

  - **Identify the Modifying Application**: Verify that the modifying application is `WmiPrvSE.EXE` and correlate it with Process Monitor logs to check for unusual command-line arguments that could suggest malicious use.

  - **Check for Lateral Movement Tools**: Look for concurrent or related logs regarding tools like PowerShell (Event ID 4104) that indicate the execution of commands such as `New-NetFirewallRule`, which could reveal the specific intent behind the changes.

  - **Establish Legitimate Behavior**: Compare the observed changes against an established baseline of firewall rules typical for your environment. Legitimate changes usually stem from well-known admin scripts or system updates, so identify if they align with scheduled maintenance windows.

  - **Flag Abnormal User Accounts**: Investigate the accounts making the modifications. Any changes made by non-administrative users or accounts that have been recently escalated in privilege are highly suspicious.

  - **Monitor for Network Anomalies**: Assess network traffic data (e.g., NetFlow logs) for any unusual outbound connections that utilize the newly permitted rules. Look specifically for traffic towards known malicious IP addresses or data exfiltration patterns.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on network defenses and the likelihood of being weaponized by adversaries attempting to bypass security controls. Given the nature of firewall modifications, they can significantly alter the attack surface if exploited.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not enabled for these specific Event IDs or if WMI activity is suppressed. Legitimate administrative actions, such as firewall adjustments during routine maintenance or scripted configurations, may trigger alerts. A companion detection to strengthen coverage includes monitoring PowerShell execution logs to capture the use of `New-NetFirewallRule` and similar commands for context on firewall changes.

