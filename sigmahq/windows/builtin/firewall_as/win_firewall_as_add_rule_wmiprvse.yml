note: |
  ### Technical Context

  This Sigma rule detects the creation of new "Allow" firewall rules in Windows Defender Firewall by the Windows Management Instrumentation (WMI) provider service (WmiPrvSE.EXE). This behavior may indicate that an attacker is modifying firewall settings to facilitate unauthorized access to a system, potentially as part of a lateral movement or persistence tactic. The relevant MITRE ATT&CK tactics are Defense Evasion and Initial Access (T1562.004). Primary telemetry sources include Windows Event Logs, specifically Event IDs 2004, 2071, and 2097, which capture firewall rule modifications.

  If malicious, this could allow attackers to bypass security measures, enabling them to communicate with external command and control servers or propagate malware across the network. It is important to note that this detection does not confirm malicious intent on its own; legitimate administrative actions may trigger this alert as well.

  ### Investigation Steps

  - **Review Event Details**: Check Windows Event Logs for Event ID 2004, 2071, or 2097. Look specifically for entries where the ModifyingApplication field ends with `WmiPrvSE.exe`, indicating the firewall rule was modified via WMI.

  - **Identify Unusual Rule Configurations**: Analyze the newly created firewall rules for properties like unusual remote IPs or port numbers. Legitimate rules typically align with known enterprise application traffic and should not allow excessive access to high-risk ports (e.g., 23 for Telnet, 445 for SMB).

  - **Correlate with User Activity**: Gather contextual data from logins and recent administrative actions in the Security Event Log (Event ID 4624). Determine if the modifying user has legitimate administrative roles or if there are signs of unauthorized access.

  - **Check for Scripting Activity**: Review PowerShell logs (Event ID 4104) to identify any scripts executed that might have initiated the creation of the firewall rule. Look for cmdlets such as `New-NetFirewallRule`, which can indicate prior planning by an attacker.

  - **Monitor Network Connections**: Capture outbound network connections for the host using NetFlow or similar. Validate if the host is initiating connections to external IP addresses not typically associated with business operations, which could suggest exploitation of newly established firewall rules.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of unauthorized firewall modifications that could lead to malicious activities, such as data exfiltration or lateral movement within the network. Given that firewall rule changes can be weaponized by attackers to evade detection, timely investigation is critical.

  ### Blind Spots and Assumptions

  This detection may be circumvented by attackers using tools or methods that alter firewall rules without generating logs (e.g., direct API calls). It relies on appropriate logging configurations for Windows Firewall and WMI-related activities; if logging is disabled or incomplete, detections may fail. Legitimate administrative activities, particularly routine changes by IT personnel, may result in false positives. A related detection, such as monitoring for PowerShell command execution logs (e.g., Event ID 4104), can strengthen coverage and context for this rule.

