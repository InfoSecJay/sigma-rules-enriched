logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
    Action: 3     # Allow
    ModifyingApplication|endswith: ':\Windows\System32\wbem\WmiPrvSE.exe'
  condition: selection
falsepositives:
- Administrator scripts or activity.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of new firewall rules with "Allow" actions using the WMI (Windows Management Instrumentation) process WmiPrvSE.EXE. This behavior is a common tactic used by attackers to modify system settings in order to facilitate malicious activities, such as allowing unauthorized inbound or outbound connections. The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and the technique **Modify Existing Firewall Rule** (T1562.004).

  The primary telemetry sources include Windows Security Event IDs 2004, 2071, and 2097, which specifically capture changes to the Windows Firewall configuration. If malicious, the impact could be severe as it may enable an attacker to bypass critical network defenses. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate administrative actions by system administrators or scripts could trigger this alert.

  ### Investigation Steps

  - **Verify the source of the rule addition**: Check Event ID 4688 (Process Creation) logs to determine if WmiPrvSE.EXE was spawned by a legitimate process, such as PowerShell. Look for parent processes like "powershell.exe" or "cmd.exe" to assess if it was executed with administrative intents.

  - **Review the specific rule added**: Examine the associated Event ID 2004, 2071, and 2097 logs for details about the new firewall rule. Note the rule name, ports, and protocols specified. Common benign rules would typically involve well-known applications (e.g., allowing traffic for business applications).

  - **Check for abnormal process activity**: Investigate other related Event IDs (like 7045, service installations) originating from the same time frame to see if unfamiliar processes or services were launched, which may indicate malicious behavior.

  - **Cross-reference with administrative access logs**: Review Windows Security Event ID 4648 (Logon Attempt with Explicit Credentials) and 4672 (Special Privileges Assigned to New Logon) logs to see if any unauthorized accounts or abnormal privilege escalations align with the timing of the rule change.

  - **Search for related communications**: If the rule allows inbound connections, check for network logs indicating new connections on ports granted by the new rule, focusing on whether any unexpected IP addresses are communicating or transferring data.

  - **Identify historical changes**: Review past firewall-related Event IDs to determine if multiple firewall modifications have been made in a short time period, which may indicate ongoing reconnaissance or configuration efforts by an attacker.

  ### Prioritization

  The alert is of **medium severity** due to its potential to expose critical systems to external threats. The likelihood of exploitation is significant, as modifications to firewall rules are a common step among attackers to facilitate lateral movement or data exfiltration. While there is potential for legitimate use, this behavior is often weaponized in the context of evading security measures.

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of legitimate scripts or administrative tasks triggering the rule, especially in environments where firewall rules are frequently modified for operational needs. The effectiveness of this detection may also depend on the correct configuration of Windows logging, as failure to capture these Event IDs would result in missed alerts. Additionally, tools or activities that might evoke such changes include legitimate software installations or configurations that may pose risks yet might not be malicious. Related detections, such as Alert on PowerShell execution (T1059.001), could provide supplementary context and enhance coverage against scripting-based threats.

