logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2033         # All rules have been deleted from the Windows Defender Firewall configuration on this computer
    - 2059         # All rules have been deleted from the Windows Defender Firewall configuration on this computer. (Windows 11)
  filter_main_svchost:
    ModifyingApplication|endswith: ':\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|contains|all:
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context

  This rule detects the deletion of all firewall rules from the Windows Defender Firewall configuration, indicated by Event IDs 2033 or 2059. The likely attacker objective is to disable the firewall's protective capabilities, potentially allowing lateral movement, malware deployment, or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.004).

  The primary telemetry sources include Windows Security Event Logs, particularly the network firewall logging events. If malicious, the security impact could range from unauthorized data access to significant breaches. However, this detection does NOT confirm unauthorized access on its own, as legitimate applications and users could also trigger these events under certain circumstances.

  ### Investigation Steps

  - **Verify event details**: Check Security Event ID 2033 or 2059 in the Windows Event Viewer under Applications and Services Logs > Microsoft > Windows > Windows Firewall with Advanced Security > Operational. Confirm the timestamp aligns with the alert.

  - **Identify the modifying application**: Examine the `ModifyingApplication` field in the log entry. If it shows 'svchost.exe', this could indicate a benign system process. Analyze any associated command line arguments in Sysmon Event ID 1 for context.

  - **Check associated processes**: Look for concurrent process activity from Event ID 4688 (process creation) around the same timestamp. Confirm whether processes like `cmd.exe` or `powershell.exe` were executing commands to manipulate firewall rules, which are indicators of malicious intent.

  - **Assess for related indicators**: Review Security Event ID 5156 (Windows Filtering Platform) to check if any significant inbound or outbound connections were logged immediately before or after the rule deletion, indicating potential exploitation attempts.

  - **Investigate legitimate applications**: Confirm if legitimate maintenance activities occurred that might involve the deletion of rules (e.g., system updates, third-party firewall configuration). Document normal operational processes that could lead to similar events.

  ### Prioritization

  This alert should be considered high severity, given its potential to compromise the integrity of the firewall and allow malicious activities. The likelihood of abuse is significant, as attackers frequently target firewall configurations to facilitate other exploitative actions. The behavior is commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may miss transient evasion techniques, such as attackers using scripts to re-enable firewall rules immediately after deletion to conceal activity. Reliable detection requires comprehensive logging configurations for Windows Firewall; ensure logging is enabled on all relevant Windows systems. Legitimate scripts or software that modify firewall settings may generate similar events. Companion detections, such as monitoring process creation and network connections, can provide broader context and strengthen overall detection capacity.

