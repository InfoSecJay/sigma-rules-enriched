logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2033         # All rules have been deleted from the Windows Defender Firewall configuration on this computer
    - 2059         # All rules have been deleted from the Windows Defender Firewall configuration on this computer. (Windows 11)
  filter_main_svchost:
    ModifyingApplication|endswith: ':\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|contains|all:
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context

  This Sigma rule detects an event where all rules have been deleted from the Windows Defender Firewall configuration, specifically identified by Event ID 2033 or 2059. An attacker may leverage this behavior to disable critical security controls, facilitating further malicious actions such as lateral movement, data exfiltration, or system exploitation. This detection aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique of Firewall and Host-Based Intrusion Prevention System (HIPS) Bypass (T1686.003).

  The primary telemetry sources are Windows Security Event Logs, focusing on Event IDs 2033 and 2059. If successful, this action significantly impacts the security posture of the affected system by allowing unrestricted network traffic, effectively removing barriers against intrusion attempts. This detection does NOT confirm malicious intent solely; legitimate administrative changes or misconfigurations may also trigger this alert.

  ### Investigation Steps

  - **Check Event Logs for Alerts:** Review Windows Security Event Log for Event ID 2033 or 2059. Document the timestamp and user context under which the deletion occurred. Malicious indicators may include unexpected changes outside of maintenance windows.

  - **Identify Modifying Applications:** Investigate the `ModifyingApplication` field in the event log entry to determine the source application responsible for the deletion. Legitimate applications typically include system processes or authorized management tools.

  - **Review User Activities:** Examine the User Initiated actions around the timestamp of the event, querying Event ID 4624 (Logon) or 4648 (Logon attempts) to correlate user activity before the deletion occurred. Look for anomalous logins from unusual users or systems.

  - **Assess Firewall Configuration State:** Query the current configuration of the Windows Defender Firewall using `Get-NetFirewallRule` in PowerShell to identify the number of rules present post-deletion and document any irregularities. A significant reduction in rules may indicate malicious tampering.

  - **Monitor for Follow-Up Activities:** After deletion, conduct ongoing monitoring for unusual outbound network activity or any new firewall rules being created through Event ID 2004 (rules creation). Malicious actors may attempt to install persistence via new rule configurations.

  ### Prioritization

  This alert is high priority due to the potential impact on the affected system's security defenses. Given that the deletion of firewall rules can facilitate lateral movement within the network, the likelihood of this behavior being abused by attackers is high. Such actions are commonplace in known exploitation scenarios, making immediate investigation crucial.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative tasks or automated configurations that could falsely trigger the rule. Ensuring appropriate logging settings for Windows Defender Firewall and monitoring all return logs from the event IDs is vital for robust detection. Activities such as routine system updates, misconfigurations, or software deployments may also result in firewall rule deletions. A related detection to consider is monitoring for subsequent network traffic patterns or abnormal application behavior indicative of exploitation once the firewall defenses are lowered.

