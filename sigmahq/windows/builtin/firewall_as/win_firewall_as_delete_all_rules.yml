logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2033         # All rules have been deleted from the Windows Defender Firewall configuration on this computer
    - 2059         # All rules have been deleted from the Windows Defender Firewall configuration on this computer. (Windows 11)
  filter_main_svchost:
    ModifyingApplication|endswith: ':\Windows\System32\svchost.exe'
  filter_optional_msmpeng:
    ModifyingApplication|contains|all:
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context
  This detection rule identifies when all rules have been deleted from the Windows Defender Firewall configuration, which could indicate malicious activity. The deletion of firewall rules can serve as a precursor to unauthorized access or lateral movement within a network. In such scenarios, an attacker may aim to facilitate unimpeded network traffic or create a path for other nefarious activities without being blocked by the firewall.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005), specifically the technique **Indicator Removal on Host** (T1562.004). This technique focuses on modifying or deleting security controls that an attacker might find inhibiting. Primary data sources for evidence include Windows event logs, specifically Event IDs 2033 and 2059, which are triggered when the firewall rules are cleared.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Event Logs for Event IDs 2033 and 2059 to confirm the deletion of firewall rules. Check the timestamps and source applications associated with these events.
  - **Identify Contextual Changes:** Look for other related events in the firewall logs around the same time, including any modifications to security policies or unusual connection attempts that may indicate the impact of the deleted rules.
  - **Assess System Integrity:** Investigate running processes and services to see if related security applications, like Windows Defender, are operational and verify if there have been any attempts to disable or alter them.
  - **Cross-reference User Activities:** Analyze user account activities to identify any unauthorized changes or login attempts associated with the time of the rule deletion. Pay special attention to administrative accounts that may have been misused.

  ### Prioritization
  This alert is of high severity due to the critical role that the Windows Defender Firewall plays in protecting network boundaries. The likelihood of a successful exploit increases when firewall rules are absent, making immediate investigation necessary to mitigate potential threats.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging is not adequately configured or if event log retention settings do not capture the period before rule deletion. The detection logic assumes that all legitimate rule deletions are authorized or expected; therefore, it may not differentiate between administrative actions and malicious tasks without further context. Proper Windows Event Logging must be enabled to capture the relevant Event IDs for this alert to function effectively.

