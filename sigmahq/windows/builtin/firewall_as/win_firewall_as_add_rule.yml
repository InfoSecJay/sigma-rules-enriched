title: Uncommon New Firewall Rule Added In Windows Firewall Exception List
id: cde0a575-7d3d-4a49-9817-b8004a7bf105
status: test
description: Detects when a rule has been added to the Windows Firewall 
  exception list
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2026-08-06
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
  filter_main_block:
    Action: 2     # Block
  filter_main_generic:
    ApplicationPath|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  filter_main_covered_paths:
        # This filter is added to avoid duplicate alerting from 9e2575e7-2cb9-4da1-adc8-ed94221dca5e
    ApplicationPath|contains:
    - 'C:\PerfLogs\'
    - 'C:\Temp\'
    - 'C:\Tmp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
  filter_main_system_dllhost:
    ApplicationPath: 'System'
    ModifyingApplication: 'C:\Windows\System32\dllhost.exe'
  filter_main_tiworker:
    ModifyingApplication|startswith: 'C:\Windows\WinSxS\'
    ModifyingApplication|endswith: '\TiWorker.exe'
  filter_main_null:
    ApplicationPath:
  filter_optional_no_path:
        # This filter filters a lot of FPs related to Windows Services
    ModifyingApplication:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\dllhost.exe'
    ApplicationPath: ''
  filter_optional_msmpeng:
  - ModifyingApplication|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  - ApplicationPath|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ApplicationPath|endswith: '\MsMpEng.exe'
  filter_optional_systemApps:
    ApplicationPath|startswith: 'C:\Windows\SystemApps\'
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of a new rule to the Windows Firewall exception list, specifically identified by Event IDs 2004, 2071, and 2097. The behavior signifies potential changes in network access, which could indicate an adversary's attempt to enable communication for malicious activities, such as bypassing security controls. This detection aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and the technique Adding Firewall Rules (T1686.003).

  The primary telemetry source for this detection is the Windows Firewall Audit logs which include specific event IDs related to rule modifications. The security impact is significant, as unauthorized firewall rule changes could facilitate an attacker's communications, command and control (C2) access, or lateral movement within the network. Importantly, this detection does NOT confirm that the added rule is malicious without further context.

  ### Investigation Steps

  - **Check Event Logs for Related Activities:** Review Windows Security Event ID 4624 (successful logon) in conjunction with the firewall rule addition events. Look for logons from unfamiliar accounts or at suspicious times to identify potential unauthorized access.

  - **Compare Against Approved Rule Changes:** Verify if the added firewall rule corresponds to documented or authorized changes. Conduct a comparison with the last known good configuration in Windows Firewall settings to establish legitimacy.

  - **Inspect the Application Path Involved:** Analyze the ApplicationPath field in the log entries. Legitimate applications typically reside in standard directories (e.g., `C:\Program Files\`, `C:\Windows\System32\`). An entry from `C:\Temp\` or other non-standard paths may indicate malicious intent.

  - **Identify Known Malicious Modifying Applications:** Check for the modifying application in logs. The usage of `TiWorker.exe` or `dllhost.exe` as modifying applications paired with suspicious application paths should be considered high-confidence malicious indicators requiring further investigation.

  - **Monitor Network Traffic Post-Change:** Capture network traffic to identify any newly allowed communications post-firmware rule addition. Look for unexpected outbound sessions to unrecognized external IPs which could validate an attacker’s C2 setup.

  ### Prioritization

  This alert should be treated with medium severity. The impact is elevated if it occurs on critical assets, potentially allowing an attacker to bypass security postures. The likelihood of malicious abuse is moderate, particularly if associated with unauthorized user activities or anomalous patterns, as manipulating firewall rules is a common method for attackers to facilitate their commands.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of comprehensive logging configurations, such as not capturing all changes to firewall settings which could evade detection. Legitimate activities, such as administrative changes or automated system updates, may also trigger these alerts. A complementary detection could include monitoring for unusual inbound and outbound traffic patterns following any firewall rule modification to enhance overall visibility and threat detection.

