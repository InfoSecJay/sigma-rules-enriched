title: Uncommon New Firewall Rule Added In Windows Firewall Exception List
id: cde0a575-7d3d-4a49-9817-b8004a7bf105
status: test
description: Detects when a rule has been added to the Windows Firewall 
  exception list
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
  filter_main_block:
    Action: 2     # Block
  filter_main_generic:
    ApplicationPath|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  filter_main_covered_paths:
        # This filter is added to avoid duplicate alerting from 9e2575e7-2cb9-4da1-adc8-ed94221dca5e
    ApplicationPath|contains:
    - 'C:\PerfLogs\'
    - 'C:\Temp\'
    - 'C:\Tmp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
  filter_main_system_dllhost:
    ApplicationPath: 'System'
    ModifyingApplication: 'C:\Windows\System32\dllhost.exe'
  filter_main_tiworker:
    ModifyingApplication|startswith: 'C:\Windows\WinSxS\'
    ModifyingApplication|endswith: '\TiWorker.exe'
  filter_main_null:
    ApplicationPath:
  filter_optional_no_path:
        # This filter filters a lot of FPs related to Windows Services
    ModifyingApplication:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\dllhost.exe'
    ApplicationPath: ''
  filter_optional_msmpeng:
  - ModifyingApplication|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  - ApplicationPath|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ApplicationPath|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of new firewall rules to the Windows Firewall exception list, specifically targeting actions logged by Event IDs 2004, 2071, and 2097. Such modifications may indicate an attacker’s attempt to bypass security controls, enabling unauthorized network access or data exfiltration, aligning with the MITRE ATT&CK techniques for Defense Evasion (T1562.004). The primary telemetry source is Windows Security logs.

  If malicious, this behavior can allow external access to sensitive systems, potentially leading to data breaches or other significant security incidents. However, this detection does not confirm that the rule was added with malicious intent; legitimate administrative changes can also trigger the alerts.

  ### Investigation Steps

  - **Review Windows Security Event logs for Event ID 2004, 2071, or 2097:** Filter logs to check for rule changes made recently, noting the timestamps for any unusual activity.

  - **Examine the Application Path of new rules:** Look for new firewall rules targeting non-standard paths such as `C:\PerfLogs\`, `C:\Temp\`, or `C:\Users\Public\` since these are often associated with temporary files or public access.

  - **Identify legitimate administrative changes:** Cross-reference any changes against documented administrative policies and processes; confirmed changes by authorized personnel are benign.

  - **Check for unusual modifying applications:** Pay attention to the modifying application associated with the created rule; activity by known system processes like `svchost.exe` or `dllhost.exe` is typically normal, while unexpected executables may indicate malicious activities.

  - **Confirm if the action is allowed or blocked:** Any new rule with Action 2 (Block) could indicate a defensive move by an attacker trying to prevent detection, necessitating a deeper inquiry into network traffic related to the new rule.

  - **Correlate with other indicators of compromise:** Look for concurrent suspicious activities like abnormal outbound connections or file modifications in locations like `C:\Windows\Tasks\` as these may indicate a broader malicious campaign.

  ### Prioritization

  This alert is of medium severity, as new firewall rules can provide potential unauthorized access points to sensitive systems. The likelihood of malicious behavior increases if the affected system has critical roles, such as database management or handling sensitive data, and such modifications are frequently exploited by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by poorly configured logging settings on the Windows Firewall, potentially leading to missed modifications. Legitimate administrative activities, especially in shared environments, can also trigger the alert. A companion detection to consider includes monitoring for outbound traffic from applications that have recently had firewall exceptions added; this can help contextualize the firewall modification within broader suspicious activities.

