title: Uncommon New Firewall Rule Added In Windows Firewall Exception List
id: cde0a575-7d3d-4a49-9817-b8004a7bf105
status: test
description: Detects when a rule has been added to the Windows Firewall 
  exception list
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2026-08-27
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
  filter_main_block:
    Action: 2     # Block
  filter_main_generic:
    ApplicationPath|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  filter_main_covered_paths:
        # This filter is added to avoid duplicate alerting from 9e2575e7-2cb9-4da1-adc8-ed94221dca5e
    ApplicationPath|contains:
    - 'C:\PerfLogs\'
    - 'C:\Temp\'
    - 'C:\Tmp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
  filter_main_system:
    ApplicationPath: 'SYSTEM'
    ModifyingApplication:
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\oobe\Setup.exe'
    - 'C:\Windows\System32\svchost.exe'
  filter_main_ehome:
    ApplicationPath|startswith: 'C:\Windows\ehome\'
    ModifyingApplication: 'C:\Windows\System32\oobe\Setup.exe'
  filter_main_tiworker:
    ModifyingApplication|startswith: 'C:\Windows\WinSxS\'
    ModifyingApplication|endswith: '\TiWorker.exe'
  filter_main_null:
    ApplicationPath:
  filter_optional_no_path:
        # This filter filters a lot of FPs related to Windows Services
    ModifyingApplication:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\dllhost.exe'
    ApplicationPath: ''
  filter_optional_msmpeng:
  - ModifyingApplication|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  - ApplicationPath|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ApplicationPath|endswith: '\MsMpEng.exe'
  filter_optional_systemApps:
    ApplicationPath|startswith: 'C:\Windows\SystemApps\'
    ModifyingApplication: 'C:\Windows\System32\svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of a new rule to the Windows Firewall exception list, specifically when related to unusual applications. The likely attacker objective is to create openings for malicious traffic or backdoor communications by modifying firewall settings. This behavior corresponds to the MITRE ATT&CK tactic "Defense Evasion" (TA0040), specifically technique "Application Layer Protocol" (T1686.003). The primary telemetry source is Windows Security Event Logs, particularly Event IDs 2004, 2071, and 2097, related to firewall rule adjustments.

  If malicious, this activity could lead to unauthorized access or data exfiltration. This detection does NOT, on its own, confirm malicious intent; it merely indicates a configuration change that could be benign or part of standard operations if done by authorized users or processes.

  ### Investigation Steps

  - **Identify the modifying application:** Review Security Event IDs 2004, 2071, and 2097 to confirm which application added the rule. A legitimate application will typically show common system paths (e.g., `C:\Program Files\*`); any anomalies or uncommon paths may indicate potential misconfiguration or hostile activity.

  - **Correlation with user activity:** Check the Security Event Log for user logon events (Event ID 4624) around the timestamp of the firewall rule addition. Validate if the user or service account is authorized to modify firewall rules, ensuring this change aligns with expected admin behaviors.

  - **Inspect existing firewall rules:** Use `netsh advfirewall firewall show rule name=all` to review current rules. Look for any newly added trust relationships or exceptions that do not match organizational policies, flagging them as potential indicators of compromise (IoCs).

  - **Analyze network traffic behavior:** Investigate any traffic on unusual ports allowed by the new firewall rule using tools (e.g., Wireshark). Confirm whether the traffic aligns with the application identified or if it exhibits suspicious patterns characteristic of exploitation attempts.

  - **Document legitimate changes:** Reference recent change records in IT management systems (like ServiceNow or JIRA) to confirm if this firewall rule change was pre-approved and planned, providing context that may negate the alert.

  ### Prioritization

  The severity of this alert is medium due to potentially high impact if a malicious actor modifies firewall rules to facilitate unauthorized access. The likelihood of abuse is significant, as adversaries frequently exploit firewall settings to bypass security controls. However, benign configurations may occur during legitimate administrative activities.

  ### Blind Spots and Assumptions

  This detection may miss malicious modifications made by scripts or tools that disguise themselves as standard applications. Comprehensive logging configurations are required to ensure all relevant event logs are recorded accurately, including logs from all network devices involved. Legitimate activities, such as updates to firewall rules by IT operations, may trigger the alert. A companion detection to consider is monitoring for unusual outbound traffic patterns that may result from modified firewall rules.

