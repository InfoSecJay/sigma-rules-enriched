title: Uncommon New Firewall Rule Added In Windows Firewall Exception List
id: cde0a575-7d3d-4a49-9817-b8004a7bf105
status: test
description: Detects when a rule has been added to the Windows Firewall 
  exception list
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
author: frack113
date: 2022-02-19
modified: 2025-10-08
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
    - 2004         # A rule has been added to the Windows Defender Firewall exception list
    - 2071         # A rule has been added to the Windows Defender Firewall exception list. (Windows 11)
    - 2097
  filter_main_block:
    Action: 2     # Block
  filter_main_generic:
    ApplicationPath|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  filter_main_covered_paths:
        # This filter is added to avoid duplicate alerting from 9e2575e7-2cb9-4da1-adc8-ed94221dca5e
    ApplicationPath|contains:
    - 'C:\PerfLogs\'
    - 'C:\Temp\'
    - 'C:\Tmp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\Temp\'
    - '\AppData\Local\Temp\'
  filter_main_system_dllhost:
    ApplicationPath: 'System'
    ModifyingApplication: 'C:\Windows\System32\dllhost.exe'
  filter_main_tiworker:
    ModifyingApplication|startswith: 'C:\Windows\WinSxS\'
    ModifyingApplication|endswith: '\TiWorker.exe'
  filter_main_null:
    ApplicationPath:
  filter_optional_no_path:
        # This filter filters a lot of FPs related to Windows Services
    ModifyingApplication:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\dllhost.exe'
    ApplicationPath: ''
  filter_optional_msmpeng:
  - ModifyingApplication|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ModifyingApplication|endswith: '\MsMpEng.exe'
  - ApplicationPath|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    ApplicationPath|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of new entries to the Windows Firewall exception list, specifically monitoring events when a new rule is created (Event IDs 2004, 2071, and 2097). These activities could indicate an attacker’s attempt to create an avenue for unauthorized access to the network or to allow specific malicious traffic to bypass firewall controls, thereby facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and specific techniques such as Enabling Local Accounts (T1556) and Account Manipulation (T1098).

  The primary telemetry source is Windows Security Event logs, particularly focused on Firewall-related events. If malicious, this could lead to significant security impacts, including unauthorized access and data breaches. However, it is critical to note that the detection only indicates that a rule has been added; it does not confirm intent or whether the rule is being exploited for malicious purposes.

  ### Investigation Steps

  - **Review event details for Event ID 2004/2071/2097:** Examine the logs for the presence of these Event IDs in the Windows Security Event logs to confirm a firewall rule was added. Focus on the `ApplicationPath` field to identify if the applying application is legitimate or suspicious.

  - **Analyze the modifying application:** Identify the `ModifyingApplication` associated with the new rule addition. If it is a known system process like `dllhost.exe`, it may be benign; however, if it is unfamiliar or appears in unusual locations, it might indicate malicious activity.

  - **Check application paths for legitimacy:** Verify if `ApplicationPath` contains paths typically associated with legitimate applications (e.g., `C:\Program Files\`). Any paths leading to directories like `C:\Temp\` or `C:\Users\Public\` may raise suspicion and require further investigation.

  - **Confirm expected firewall rules:** Compare the newly added rule against documented firewall policies within the organization. If the rule is not part of established policies, classify it as a potential malicious action.

  - **Examine related network activity:** Look for network traffic using tools like NetFlow or IDS/IPS logs that may show connections corresponding to the new firewall rules, focusing on unusual outgoing connections or communications to external IPs not typical for the organization.

  ### Prioritization

  This alert should be considered medium severity. The impact can be significant if a critical asset is compromised, allowing attackers to tunnel undetected through the firewall using added exceptions. The likelihood of malicious abuse is high, as this technique is often weaponized by adversaries attempting to bypass security controls.

  ### Blind Spots and Assumptions

  This detection may be limited by the lack of contextual data on whether the added rule was a legitimate or benign action, which could lead to false positives if not investigated thoroughly. Reliable detection also hinges on capturing all relevant Windows Security Event logs; any gaps in logging could hinder accurate identification of malicious activities. Legitimate activities which may trigger the alert include routine firewall rule updates by IT personnel. A related detection that can complement this rule is monitoring for unusual outbound connections from the same host, which would provide context on whether an added exception is being exploited.

