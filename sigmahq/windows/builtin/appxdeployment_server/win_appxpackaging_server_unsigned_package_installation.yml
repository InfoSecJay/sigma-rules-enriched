note: |
  ### Technical Context

  This Sigma rule detects attempts to install unsigned MSIX/AppX packages through the use of the `-AllowUnsigned` parameter. The behavior suggests that an attacker may be attempting to deploy unverified applications that could compromise system integrity or deliver malicious payloads. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (T1204.002) and Execution (T1553.005). Primary telemetry sources include AppX Deployment Server logs, specifically looking for Event ID 603 that indicates package installation events. If malicious, this activity could allow unauthorized software to be deployed, leading to potential data leaks or further exploitation. This detection does NOT confirm that the action is malicious on its own; legitimate unsigned package installations can also trigger this alert.

  ### Investigation Steps

  - **Review the Event ID 603 log entry:** Look for the presence of Event ID 603 in the AppXDeployment logs. Focus on the parameters used, specifically the `-AllowUnsigned` flag. Malicious activity will typically show unusual package names or timestamps correlating with an attack.

  - **Analyze the package source:** Validate the source of the package being installed. Legitimate sources will typically be internal repositories, while suspicious packages may come from external or unknown sources. Cross-reference with known safe sources.

  - **Compare system logs for user behavior:** Check for administrative activities around the same time using Windows Security Event ID 4672 (Special privileges assigned to new logon), which may indicate malicious intent if the user is not supposed to perform such actions.

  - **Assess the context of installation:** Determine the routine for the host system's role and normal application deployment processes. Unsigned installations should be infrequent on production systems, making this behavior highly suspect if it occurs without prior context.

  - **Look for related suspicious activities:** Investigate for other indicators of compromise associated with this installation attempt by cross-referencing with similar detections, such as those indicated in the related Sigma rules, which could include additional unwanted or unexpected applications.

  ### Prioritization

  The alert severity is rated medium due to the potential for significant impact if malicious signed applications are installed on critical systems. The likelihood of abuse is notable, particularly in exploitation scenarios. While legitimate unsigned applications could trigger this rule during development, attackers often utilize similar methods for creating persistent access.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where AppXDeployment logging is not fully enabled or configured, which could lead to missed events. Additionally, legitimate software testing or development activities may occur in environments where unsigned applications are necessary. The presence of tools like Windows Defender Application Control could serve as a companion detection to mitigate risks associated with this type of installation.

