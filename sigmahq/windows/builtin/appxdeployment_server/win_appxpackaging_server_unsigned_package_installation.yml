note: |
  ### Technical Context

  This Sigma rule detects the installation of unsigned MSIX/AppX packages using the `-AllowUnsigned` parameter. Unsigned packages can be used by attackers to bypass security measures and deploy potentially malicious software. The likely attacker objective includes executing unauthorized applications or deploying malware that can evade detection. This behavior aligns with the MITRE ATT&CK technique: **Execution: Command-Line Interface (T1204.002)** and **Defense Evasion: Use of Web Service (T1553.005)**.

  The primary telemetry sources include the AppXDeployment-Server event logs, specifically focused on Event ID 603. If malicious, this could allow attackers to install harmful software on systems, leading to data compromise or a breach. Importantly, this detection does NOT confirm whether the installed package is malicious on its own and requires additional investigation.

  ### Investigation Steps

  - **Identify the installation event: **Check for Event ID 603 in AppXDeployment-Server logs. Focus on entries with `Flags` set to '8388608' to confirm use of the `-AllowUnsigned` parameter.

  - **Verify recent package installations: **Correlate timestamps of the suspicious event with recent application installations to determine if they align with expected enterprise usage patterns or if they are outliers.

  - **Assess the source of the package: **Investigate the origin of the unsigned package. Look for potential indicators of compromise (IoCs) in the package metadata or compare it against known malicious hashes.

  - **Review expected behavior: **Documentments of legitimate use of `-AllowUnsigned` for internal testing or development should be reviewed to contextualize the alert. Consider recent software developments within the organization.

  - **Correlate with other logs: **Cross-reference the event with Security Event ID 4688 logs to examine process creation associated with the installation. Look for commands related to `Add-AppxPackage` along with parent processes that might indicate malicious activity.

  ### Prioritization

  This alert has medium severity due to its impact on potentially exposing systems to unsigned code that could compromise security. The likelihood of exploitation exists as attackers commonly leverage this technique to install malicious software. However, the occurrence of legitimate unsigned package installations in enterprise environments should also be considered.

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for legitimate unsigned package installations, particularly in development or testing contexts. Reliable detection requires configuration of AppXDeployment-Server event log monitoring. Furthermore, threat actors may employ techniques to obscure or disguise their installations. A companion detection that can strengthen coverage includes monitoring for unusual process execution patterns related to app installations or command-line activity indicating abnormal behaviors.

