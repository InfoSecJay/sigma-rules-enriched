note: |
  ### Technical Context
  This rule detects attempts to install unsigned Microsoft MSIX/AppX packages using the `-AllowUnsigned` flag via AppXDeployment-Server events. The presence of an unsigned package installation can signify potential abuse, as attackers may leverage this capability to install malicious applications that are not properly vetted. This scenario can be part of a larger attack vector where an attacker is attempting to execute unauthorized code on a compromised system or to introduce malware to establish persistence.

  The motivation of an attacker may vary from data exfiltration to lateral movement within the network. By executing unauthorized unsigned packages, an attacker may attempt to bypass security controls, leading to further exploitation of system vulnerabilities. The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (T1204.002)** and **Execution (T1553.005)**.

  The primary data sources for this alert stem from **AppXDeployment-Server logs** on Windows systems, which provide insight into application installations and modifications, specifically regarding the use of unsigned packages. Monitoring these logs allows security teams to detect potentially dangerous activities tied to the execution of unverified code.

  ### Investigation Steps
  - **Review AppXDeployment Logs:** Check logs for Event ID 603 to identify any unauthorized unsigned package installations initiated with the `-AllowUnsigned` parameter.
  - **Correlate with User Activity:** Analyze user accounts associated with the unsigned package installations to determine if the individual has been involved in suspicious activities or if their account has been used in prior incidents.
  - **Examine Process Creation Events:** Investigate process creation logs around the time of the unsigned package installation for unexpected processes that may indicate malware execution resulting from the installed package.
  - **Validate Package Integrity:** Identify and verify the integrity of the installed packages against known good baselines to assess whether they correspond to legitimate applications or malicious content.

  ### Prioritization
  Given the ability of unsigned packages to introduce potentially harmful software into the environment, alerts for this detection rule should be treated with high priority. The likelihood of malicious intent in installing unsigned applications, coupled with the potential impact on system integrity and data security, underscores the need for immediate investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage includes environments where logging for AppXDeployment events is not enabled, which may prevent the identification of unsigned package installations. This detection logic assumes that the AppXDeployment-Server service is active and properly logging relevant events. Additionally, scenarios wherein unsigned packages are installed for legitimate purposes, such as development or testing, may lead to false positives, necessitating careful investigation to distinguish between malicious and benign activities.

