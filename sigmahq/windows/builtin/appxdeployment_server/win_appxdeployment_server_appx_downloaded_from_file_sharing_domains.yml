title: Remote AppX Package Downloaded from File Sharing or CDN Domain
id: 8b48ad89-10d8-4382-a546-50588c410f0d
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages which was downloaded from a file sharing or CDN domain.
references:
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-10
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
    Path|contains:
    - '.githubusercontent.com'               # Includes both gists and github repositories / Michael Haag (idea)
    - 'anonfiles.com'
    - 'cdn.discordapp.com'
    - 'ddns.net'
    - 'dl.dropboxusercontent.com'
    - 'ghostbin.co'
    - 'github.com'
    - 'glitch.me'
    - 'gofile.io'
    - 'hastebin.com'
    - 'mediafire.com'
    - 'mega.nz'
    - 'onrender.com'
    - 'pages.dev'
    - 'paste.ee'
    - 'pastebin.com'
    - 'pastebin.pl'
    - 'pastetext.net'
    - 'privatlab.com'
    - 'privatlab.net'
    - 'send.exploit.in'
    - 'sendspace.com'
    - 'storage.googleapis.com'
    - 'storjshare.io'
    - 'supabase.co'
    - 'temp.sh'
    - 'transfer.sh'
    - 'trycloudflare.com'
    - 'ufile.io'
    - 'w3spaces.com'
    - 'workers.dev'
  condition: selection
falsepositives:
- Unlikely, unless the organization uses file sharing or CDN services to distribute
  internal applications.
level: high
note: |
  ### Technical Context
  This detection rule monitors the download of AppX packages from potentially malicious file sharing or content delivery network (CDN) domains. AppX packages are commonly used to distribute software in Windows environments, including Universal Windows Platform (UWP) applications. Attackers may exploit this mechanism to deliver malicious payloads disguised as legitimate applications, thereby compromising the integrity of enterprise systems.

  The likely threat scenario involves an attacker utilizing these domains to bypass traditional security measures and distribute malware or backdoors through seemingly harmless software packages. Successful execution could lead to unauthorized access to sensitive data, increased lateral movement within the network, or installation of further malicious tools. This behavior aligns with the MITRE ATT&CK techniques of **T1071.001 (Application Layer Protocol: Web Protocols)** and **T1203 (Exploitation for Client Execution)**, where attackers leverage web-based resources for exploitation.

  Primary data sources for this detection include the AppX deployment server logs, which capture events associated with the handling of AppX packages, specifically focusing on EventID 854 that indicates a package was added to the processing pipeline. Furthermore, telemetry from endpoint detection and response (EDR) solutions can provide insights into the installation and execution of downloaded applications.

  ### Investigation Steps
  - **Review AppX Deployment Logs**: Examine logs from the AppX deployment server for EventID 854 to identify any instances of AppX packages being processed from suspicious domains listed in the detection rule.

  - **Assess Network Traffic**: Analyze network traffic logs for connections to the detected CDN or file sharing domains; focus on unusual patterns or spikes that coincide with the times of AppX package downloads.

  - **Evaluate Endpoint Activity**: Use endpoint detection tools to investigate any executions of the AppX packages that were downloaded. Look for indicators of compromise or any abnormal behavior that could suggest malicious activity.

  - **Cross-reference with Known Threat Intelligence**: Consult threat intelligence sources and check if the involved domains are associated with known malicious activities or malware distribution campaigns.

  ### Prioritization
  The alert severity is rated high due to the potential risk of malware delivery through trusted application channels. A successful compromise via these vectors could lead to significant data breaches or system manipulations within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic assumes that existing traffic from legitimate file-sharing or CDN domains does not contribute to the overall use of AppX packages in the organization. A gap in detection could occur if users inadvertently use compromised legitimate services to download packages. Successful detection requires proper logging from the AppX deployment service and may depend on effective network monitoring configurations to capture relevant outbound network traffic accurately.

