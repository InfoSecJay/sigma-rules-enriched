  condition: selection
falsepositives:
- Unlikely, unless the organization uses file sharing or CDN services to 
  distribute internal applications.
level: high
note: |
  ### Technical Context

  This detection identifies the download of .appx packages from file sharing or CDN domains, which may be suspicious behavior indicating potential misuse of the Windows App Installer mechanism. Attackers may exploit this method to deliver malicious software as a part of a lateral movement or initial access strategy, often aiming to deploy persistent malware. Relevant MITRE ATT&CK techniques include "Application Layer Protocol" (T1071) and "Malicious File" (T1203).

  Primary telemetry sources include Windows Event ID 854 from AppX deployment logs that track package installations. If this behavior is confirmed as malicious, the threat can impact endpoint integrity, facilitate data exfiltration, or lead to subsequent network breaches. Importantly, this detection does NOT confirm that the downloaded package is indeed malicious—it merely indicates that a package was sourced from potentially suspicious domains.

  ### Investigation Steps

  - **Check Event ID 854 logs:** Review Windows Event ID 854 for any recently downloaded .appx packages, focusing on the `Path` field to identify the sourcing domains specified, linking potential malicious activity to those domains.

  - **Correlate download with known threats:** Cross-reference the package SHA256 hashes or names with threat intelligence platforms to assess if these packages are associated with known malware campaigns.

  - **Determine legitimate usage:** Investigate whether any .appx packages were intentionally downloaded from file sharing or CDN domains as part of legitimate business operations. Look for documented procedures regarding approved applications within asset management systems.

  - **Search for subsequent execution events:** Look for any subsequent execution of the downloaded .appx package, specifically monitoring for Event ID 4688 (Process Creation) and Sysmon Event ID 1, indicating if the package was executed on the endpoint.

  - **Assess endpoint environment:** Identify the role of the affected host—whether it is a critical asset or a standard endpoint. Higher criticality could imply a greater security risk if compromised.

  - **Check for anomalous behaviors:** Review related logs for other unusual system behaviors, such as unusual outbound network connections or registry changes correlated with the download and execution of the .appx package.

  ### Prioritization

  The alert severity is high due to the potential risk associated with the download of executables from untrusted domains. The likelihood of attackers exploiting this behavior is significant, as using such channels for malicious payload delivery is a common tactic seen in various threat actor playbooks.

  ### Blind Spots and Assumptions

  There are limitations in this detection as legitimate applications may also utilize similar channels for updates. Organizations must ensure comprehensive logging for AppX deployment and execute regular endpoint monitoring for accurate detection. Additionally, common file-sharing services may be required for legitimate business workflows, potentially leading to false positives. An associated detection rule for lateral movement using "PowerShell Commands" (T1059.001) can enhance coverage and provide further context for the investigation.

