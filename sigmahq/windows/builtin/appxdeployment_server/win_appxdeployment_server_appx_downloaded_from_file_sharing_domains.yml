title: Remote AppX Package Downloaded from File Sharing or CDN Domain
id: 8b48ad89-10d8-4382-a546-50588c410f0d
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages which was downloaded from a file sharing or CDN domain.
references:
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-10
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
    Path|contains:
    - '.githubusercontent.com'               # Includes both gists and github repositories / Michael Haag (idea)
    - 'anonfiles.com'
    - 'cdn.discordapp.com'
    - 'ddns.net'
    - 'dl.dropboxusercontent.com'
    - 'ghostbin.co'
    - 'github.com'
    - 'glitch.me'
    - 'gofile.io'
    - 'hastebin.com'
    - 'mediafire.com'
    - 'mega.nz'
    - 'onrender.com'
    - 'pages.dev'
    - 'paste.ee'
    - 'pastebin.com'
    - 'pastebin.pl'
    - 'pastetext.net'
    - 'privatlab.com'
    - 'privatlab.net'
    - 'send.exploit.in'
    - 'sendspace.com'
    - 'storage.googleapis.com'
    - 'storjshare.io'
    - 'supabase.co'
    - 'temp.sh'
    - 'transfer.sh'
    - 'trycloudflare.com'
    - 'ufile.io'
    - 'w3spaces.com'
    - 'workers.dev'
  condition: selection
falsepositives:
- Unlikely, unless the organization uses file sharing or CDN services to 
  distribute internal applications.
level: high
note: |
  ### Technical Context

  This rule detects the downloading of AppX packages from file-sharing or CDN domains, indicating potentially unauthorized or malicious software distribution. The likely objective of an attacker utilizing this method is to deploy malware or unwanted applications on target systems to bypass traditional security controls. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), with the technique being "Impair Defenses" (T1562).

  The primary telemetry source for this detection is the Windows AppX deployment logs, specifically looking for Event ID 854. If malicious, the impact could result in unauthorized application execution, data theft, or compromised system integrity. This detection does NOT confirm that the AppX package is malicious on its own, as it could also be legitimate software downloaded for authorized use.

  ### Investigation Steps

  - **Review download source: ** Examine the download path for Event ID 854. Analyze if it originates from any of the specified file-sharing or CDN domains. Legitimate internal applications should originate from internal repositories or verified application stores. If the path contains one of the listed domains, be suspicious.

  - **Check for known malicious AppX packages: ** Verify the AppX package hash against threat intelligence feeds and databases. If the hash matches known malware, classify as high confidence malicious.

  - **Analyze user behavior: ** Use Windows Security Event ID 4624 to check which user account initiated the download. If the activity was performed by a non-privileged user account with no history of app deployments, flag this as suspicious.

  - **Validate system roles and purpose: ** Determine the role of the affected system. If it is a non-development or non-testing machine (e.g., production server), the alert warrants higher scrutiny due to the potential impact.

  - **Assess file system changes: ** Utilize Sysmon Event ID 11 to look for any changes to filesystem objects, specifically focusing on executable indicators or unusual modifications to the AppX deployment directory. Legitimate application processing should not result in these changes.

  ### Prioritization

  This alert has a high priority due to the potential for malicious application execution on critical systems. The use of file-sharing and CDN domains for software distribution is a common tactic employed to circumvent security measures. Such behavior can indicate significant risk if confirmed as malicious.

  ### Blind Spots and Assumptions

  The detection may have limitations as sophisticated adversaries could use custom domains that are not included in this rule, thus evading detection. Accurate logging from AppX deployment services is required to ensure this detection is effective. Legitimate internal software distribution mechanisms may also trigger this alert if domain configurations are not adequately understood. A related detection to consider is monitoring for abnormal application behavior post-installation, which could indicate exploitation or misuse of legitimate applications.

