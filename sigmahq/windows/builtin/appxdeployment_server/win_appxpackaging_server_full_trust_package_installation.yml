title: Windows AppX Deployment Full Trust Package Installation
id: e54279c7-4910-4e2c-902c-c56a25b549f6
status: experimental
description: Detects the installation of MSIX/AppX packages with full trust 
  privileges which run with elevated privileges outside normal AppX container 
  restrictions
references:
- https://www.splunk.com/en_us/blog/security/msix-weaponization-threat-detection-splunk.html
author: Michael Haag, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-03
tags:
- attack.execution
- attack.defense-impairment
- attack.t1204.002
- attack.t1553.005
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 400
    HasFullTrust: true
  filter_main_legitpath:
    PackageSourceUri|startswith:
    - 'file:///C:/Program%20Files/'
    - 'file:///C:/Program%20Files%20(x86)/'
  filter_main_microsoft:
  - PackageSourceUri|startswith: 'https://go.microsoft.com/fwlink/?linkid'
  - PackageSourceUri|contains:
    - '.cdn.microsoft.com'
    - '.cdn.office.net/'
  filter_main_callerprocess:
    CallingProcess|startswith:
    - 'sysprep.exe'
    - 'svchost.exe,AppReadiness'
  filter_optional_x_update:
    PackageSourceUri|startswith: 'x-windowsupdate://'
  filter_optional_microsoftclient:
    PackageFullName|startswith: 'MicrosoftWindows.Client.'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate applications installation which have been missed from 
  filtering can generate fps, thus baselining and tuning is recommended before 
  deploying to production
level: medium
regression_tests_path: 
  regression_data/rules/windows/builtin/appxdeployment_server/win_appxpackaging_server_full_trust_package_installation/info.yml
note: |
  ### Technical Context

  This rule detects the installation of MSIX/AppX packages that are granted full trust privileges, allowing applications to run with elevated permissions outside the standard confinement of AppX containers. Attackers may exploit this capability to deploy malicious applications that can manipulate system settings or access sensitive resources. This behavior is most aligned with the MITRE ATT&CK technique T1204.002 (Malicious File Execution) and T1553.005 (Subversion of Control). The primary telemetry source is Windows Event ID 400 from the AppX Deployment Server. If an installation is malicious, it may lead to unauthorized access and control over the affected system. However, this detection alone does not confirm malicious intent; legitimate applications may also use full trust privileges.

  ### Investigation Steps

  - **Verify Event Details**: Review Windows Event ID 400 logs from the AppX Deployment Server. Check the `PackageFullName` and `CallingProcess` fields. Look for unexpected source URIs or unknown application names that raise suspicion.

  - **Assess Installation Source**: Cross-reference the `PackageSourceUri` in Event ID 400 with known trusted sources. Legitimate installations usually originate from `file:///C:/Program Files/`, `file:///C:/Program Files (x86)/`, or Microsoft URLs. Anything outside of these ranges warrants further investigation.

  - **Identify Malicious Indicators**: Look for instances where `HasFullTrust` is true without matching legitimate filtering criteria (from `filter_main_*`). Examples include installations from unknown file URIs or unusual calling processes, such as those not typically associated with standard application deployment.

  - **Investigate Related Processes**: Check the activity of the `CallingProcess` specified in the logs (like `sysprep.exe` or `svchost.exe,AppReadiness`). Confirm if these processes were legitimately used for system configuration or if they appeared suspicious in the context of the installation.

  - **Record Legitimate Behavior**: Identify patterns of legitimate AppX installations under similar conditions. Note that normal trusted applications utilizing full trust will typically use processes like `AppReadiness` for deployment, and should originate from recognized Microsoft sources.

  - **Check for File Creation or Modification**: If applicable, verify the file system for any newly created directories or files related to the application being installed. Focus on the typical paths for installed applications (e.g., `C:\Program Files\...`) and check file timestamps for anomalies.

  ### Prioritization

  The alert severity is medium due to the impact on systems that may have legitimate applications but expose them to increased risk when granting full trust privileges. While full trust installation can be legitimate, it is often abused in adversarial contexts, making this behavior worth a focused investigation.

  ### Blind Spots and Assumptions

  Detection may be limited due to various legitimate applications that could trigger this rule, potentially leading to false positives. It is crucial to maintain updated log configurations for the AppX Deployment Server to ensure comprehensive monitoring. Additionally, such installations might occur as part of administrative updates or system maintenance, which could shield malicious behavior. Related detections that may strengthen overall coverage include monitoring for unusual process creations related to the installation of applications or the execution of scripts in conjunction with AppX deployment.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
