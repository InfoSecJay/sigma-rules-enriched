title: Windows AppX Deployment Full Trust Package Installation
id: e54279c7-4910-4e2c-902c-c56a25b549f6
status: experimental
description: Detects the installation of MSIX/AppX packages with full trust 
  privileges which run with elevated privileges outside normal AppX container 
  restrictions
references:
- https://www.splunk.com/en_us/blog/security/msix-weaponization-threat-detection-splunk.html
author: Michael Haag, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-03
tags:
- attack.execution
- attack.defense-impairment
- attack.t1204.002
- attack.t1553.005
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 400
    HasFullTrust: true
  filter_main_legitpath:
    PackageSourceUri|startswith:
    - 'file:///C:/Program%20Files/'
    - 'file:///C:/Program%20Files%20(x86)/'
  filter_main_microsoft:
  - PackageSourceUri|startswith: 'https://go.microsoft.com/fwlink/?linkid'
  - PackageSourceUri|contains:
    - '.cdn.microsoft.com'
    - '.cdn.office.net/'
  filter_main_callerprocess:
    CallingProcess|startswith:
    - 'sysprep.exe'
    - 'svchost.exe,AppReadiness'
  filter_optional_x_update:
    PackageSourceUri|startswith: 'x-windowsupdate://'
  filter_optional_microsoftclient:
    PackageFullName|startswith: 'MicrosoftWindows.Client.'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate applications installation which have been missed from 
  filtering can generate fps, thus baselining and tuning is recommended before 
  deploying to production
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of MSIX/AppX packages that are granted full trust privileges, allowing them to operate outside the usual restrictions imposed by the AppX container. Attackers may exploit this privilege escalation to execute malicious code with elevated permissions, which can lead to unauthorized data access or modifications. This behavior aligns with the MITRE ATT&CK tactic for Execution (TA0002) and the technique related to Windows AppX Deployment (T1204.002).

  The primary telemetry source is the Windows AppX Deployment Server, specifically capturing Event ID 400 that indicates a full trust installation. If this activity is deemed malicious, it can significantly impact system integrity and trust, bypassing standard security controls. Importantly, this detection does NOT confirm malicious intent or behavior by itself, as legitimate applications may also trigger the rule.

  ### Investigation Steps

  - **Assess the installation context:** Review the Event ID 400 logs from the Windows AppX Deployment service. Look for the PackageSourceUri field. Legitimate installations typically originate from 'file:///C:/Program Files/' or 'https://go.microsoft.com/fwlink/' URIs.

  - **Analyze the CallingProcess:** Identify the CallingProcess field in Event ID 400 logs. If it indicates processes like 'sysprep.exe' or 'svchost.exe,AppReadiness,' further validation is needed to confirm legitimacy.

  - **Check for suspicious sources:** Investigate any PackageSourceUri entries that do not conform to the legitimate sources identified. Unauthorized sources may include unique, non-standard URLs or local paths, which could signify malicious installations.

  - **Identify high-confidence malicious indicators:** Look for unusual patterns, like repeated installations from a single unauthorized source or installation attempts shortly after system boot, which may indicate automated malicious deployment.

  - **Validate file artifacts:** Confirm the presence of newly created files or executables in sensitive directories (e.g., C:\Program Files) immediately following the detected installation. Cross-reference these files against known malware signatures.

  - **Review for potential false positives:** Note that legitimate applications might trigger this alert. Regularly baseline and tune the detection to minimize false alarms from known business-critical software.

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized full trust applications on system integrity. While the likelihood of exploitation aligns with known vulnerabilities, legitimate applications may also trigger similar alerts, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of complete logging from the AppX Deployment service. Some adversaries may utilize standard installation tools or authorized software that could result in false positives. Legitimate activities, such as system updates or application installations from trusted vendors, might trigger this alert. Companion detections could include monitoring logs for anomalies in process creation (Event ID 4688) to reinforce alert validity and context.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
