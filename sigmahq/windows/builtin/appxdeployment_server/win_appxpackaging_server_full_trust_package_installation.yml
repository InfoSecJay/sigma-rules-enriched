title: Windows AppX Deployment Full Trust Package Installation
id: e54279c7-4910-4e2c-902c-c56a25b549f6
status: experimental
description: Detects the installation of MSIX/AppX packages with full trust 
  privileges which run with elevated privileges outside normal AppX container 
  restrictions
references:
- https://www.splunk.com/en_us/blog/security/msix-weaponization-threat-detection-splunk.html
author: Michael Haag, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-03
tags:
- attack.defense-evasion
- attack.execution
- attack.t1204.002
- attack.t1553.005
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 400
    HasFullTrust: true
  filter_main_legitpath:
    PackageSourceUri|startswith:
    - 'file:///C:/Program%20Files/'
    - 'file:///C:/Program%20Files%20(x86)/'
  filter_main_microsoft:
  - PackageSourceUri|startswith: 'https://go.microsoft.com/fwlink/?linkid'
  - PackageSourceUri|contains:
    - '.cdn.microsoft.com'
    - '.cdn.office.net/'
  filter_main_callerprocess:
    CallingProcess|startswith:
    - 'sysprep.exe'
    - 'svchost.exe,AppReadiness'
  filter_optional_x_update:
    PackageSourceUri|startswith: 'x-windowsupdate://'
  filter_optional_microsoftclient:
    PackageFullName|startswith: 'MicrosoftWindows.Client.'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate applications installation which have been missed from 
  filtering can generate fps, thus baselining and tuning is recommended before 
  deploying to production
level: medium
note: |
  ### Technical Context

  This rule detects the installation of MSIX/AppX packages with full trust, indicating the application is running with elevated privileges outside the usual AppX container restrictions. Attackers may leverage this to execute malicious code with higher permissions, circumventing security models. The relevant MITRE ATT&CK techniques are Execution (T1204.002) and Defense Evasion (T1553.005).

  The primary telemetry source is the Windows AppX Deployment Service, specifically Event ID 400. If malicious, this behavior could allow unauthorized execution of applications that could compromise system integrity. Notably, this detection does NOT confirm that an installation is malicious without further investigation.

  ### Investigation Steps

  - **Check Event ID 400 details**: Review Windows Event Logs for Event ID 400. Look for entries with `HasFullTrust` set to true and verify `PackageSourceUri`, as this indicates an MSIX/AppX package installation with elevated privileges.

  - **Assess package source**: Validate the `PackageSourceUri` field against known legitimate sources such as 'file:///C:/Program Files/' or 'https://go.microsoft.com/fwlink/?linkid'. If it originates from unknown or suspicious sources, it may indicate malicious activity.

  - **Evaluate calling process**: Identify the `CallingProcess` field in Event ID 400. Legitimate installations often come from `sysprep.exe` or `svchost.exe` under the `AppReadiness` service. Be cautious of other processes initiating the installation.

  - **Cross-reference installation logs**: Review System or App logs for unexpected installations around the same timeframe. Look for other indicators such as unusual software installations which may suggest coordinated malicious activity.

  - **Identify Service Impact**: Determine if the affected asset is a critical system, such as a server or device managing sensitive data. Elevated risks require immediate attention if detected.

  - **Document Unusual Behavior**: Record any anomalies discovered during the investigation, including unusual package names or behaviors that deviate from organizational baselines. This documentation may help in refining detection rules.

  ### Prioritization

  This alert has medium severity due to the potential impact of elevated privilege installations on critical systems and the likelihood of abuse by attackers to deploy malicious applications. Such installation vectors, especially when originating from non-standard sources, are often weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for AppX installations is not adequately configured or if legitimate applications frequently trigger the alert without proper filtering. Common evasion techniques could involve attackers disguising installations through legitimate paths or processes. As a complementary detection, monitor for unusual process creations (Event ID 4688) to capture any related suspicious behavior that could signify exploitation attempts.

