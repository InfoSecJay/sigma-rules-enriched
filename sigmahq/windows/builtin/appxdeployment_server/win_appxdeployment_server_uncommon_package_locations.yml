title: AppX Located in Uncommon Directory Added to Deployment Pipeline
id: c977cb50-3dff-4a9f-b873-9290f56132f1
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in uncommon locations.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-03
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
  filter_main_generic:
    Path|contains:
            # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Program%20Files'         # Also covers 'file:///C:/Program%20Files%20(x86)/'
    - ':/Windows/System32/'
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\ImmersiveControlPanel\'
    - ':\Windows\PrintDialog\'
    - ':\Windows\SystemApps\'
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'x-windowsupdate://'
  filter_main_specific:
    Path|contains:
    - 'https://installer.teams.static.microsoft/'
    - 'https://res.cdn.office.net'         # Example https://res.cdn.office.net/nativehost/5mttl/installer/v2/1.2025.617.100/Microsoft.OutlookForWindows_x64.msix
    - 'https://statics.teams.cdn.live.net/'
    - 'https://statics.teams.cdn.office.net/'
    - 'microsoft.com'         # Example: https://go.microsoft.com/fwlink/?linkid=2160968
  filter_optional_onedrive:
    Path|contains: 'AppData\Local\Microsoft\OneDrive\'
  filter_optional_winget:
    Path|contains:
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'AppData\Local\Temp\WinGet\Microsoft.Winget.Source'
  filter_optional_x_windowsupdate:
    Path|contains: 'x-windowsupdate://'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the addition of an AppX package to the deployment pipeline from uncommon directory locations, which often indicates potential misuse or malicious intent. The adversary objective could involve deploying unauthorized or harmful applications, leveraging the AppX deployment mechanism to install malware or tools for persistence. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion (T1203)** and **Indicator Removal on Host (T1070)**.

  Primary telemetry sources include Windows Event ID 854 from the AppX Deployment Server, which logs updates to application installation statuses. If the detected activity is malicious, it could lead to the compromise of the system, allowing further attacks or data exfiltration. This detection does NOT confirm that the application is malicious by itself; legitimate applications can also reside in unusual file paths.

  ---

  ### Investigation Steps

  - **Review Event Data:** Check Event ID 854 logs in the AppX Deployment Server telemetry for indications of unusual AppX package paths. Focus on events where the **Path** value does not match known safe directories such as `C:\Program Files` or `C:\Windows\System32`.

  - **Verify AppX Package Integrity:** Identify the AppX package specified in the alert. Use PowerShell or the Windows Package Manager to evaluate its origin and signature status. Legitimate packages often originate from well-known URLs related to Microsoft services.

  - **Assess Execution Context:** Analyze logs to determine if the AppX package was executed immediately after deployment. Look for processes initiated within a short timeframe (e.g., <5 minutes) using Event ID 4688 from Security logs. Legitimate deployments typically exhibit a delay between deployment and execution.

  - **Check for Multiple Instances:** Identify if the same AppX package has been flagged from multiple hosts. Use **Sysmon Event ID 1** to find instances of the executable across endpoints, noting that widespread activity may indicate a coordinated attack.

  - **Correlate with Other Threat Intel:** Search the organization's threat intelligence platform for any reported occurrences or associations with the detected AppX package. Link with external sources such as VirusTotal for reputation scoring.

  - **Examine System Changes:** Investigate any changes to system settings or configurations related to AppX installations using **Windows Event ID 4616** in the System log to ensure that no unauthorized system modifications have occurred.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems involved in application deployment and user productivity. Given that the detection targets uncommon directory usage, it indicates that there may be an active exploitation attempt. This behavior can be weaponized, making it important to assess the context closely.

  ---

  ### Blind Spots and Assumptions

  This detection may be circumvented by adversaries using legitimate-looking package names or paths that align with safe directory structures. Missing necessary log configurations or telemetry sources, such as event logging for PowerShell commands, could impede effective detection of sophisticated attacks. Legitimate software distribution processes, such as Microsoft Teams or OneDrive updates, may also trigger this alert. Monitoring related activities, such as file transfers or process executions in user directories, can strengthen this detection's overall efficacy.

