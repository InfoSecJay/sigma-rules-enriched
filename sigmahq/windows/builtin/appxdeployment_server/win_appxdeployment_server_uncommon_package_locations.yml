title: AppX Located in Uncommon Directory Added to Deployment Pipeline
id: c977cb50-3dff-4a9f-b873-9290f56132f1
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in uncommon locations.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-03
tags:
- attack.stealth
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
  filter_main_generic:
    Path|contains:
            # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Program%20Files'         # Also covers 'file:///C:/Program%20Files%20(x86)/'
    - ':/Windows/System32/'
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\ImmersiveControlPanel\'
    - ':\Windows\PrintDialog\'
    - ':\Windows\SystemApps\'
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'x-windowsupdate://'
  filter_main_specific:
    Path|contains:
    - 'https://installer.teams.static.microsoft/'
    - 'https://res.cdn.office.net'         # Example https://res.cdn.office.net/nativehost/5mttl/installer/v2/1.2025.617.100/Microsoft.OutlookForWindows_x64.msix
    - 'https://statics.teams.cdn.live.net/'
    - 'https://statics.teams.cdn.office.net/'
    - 'microsoft.com'         # Example: https://go.microsoft.com/fwlink/?linkid=2160968
  filter_optional_onedrive:
    Path|contains: 'AppData\Local\Microsoft\OneDrive\'
  filter_optional_winget:
    Path|contains:
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'AppData\Local\Temp\WinGet\Microsoft.Winget.Source'
  filter_optional_x_windowsupdate:
    Path|contains: 'x-windowsupdate://'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the presence of an `.appx` package added to the deployment pipeline from uncommon directories. Attackers may use this technique to deploy malicious applications by circumventing standard application vetting processes, potentially enabling the execution of unauthorized software on the system. The relevant MITRE ATT&CK tactic involved here is "Defense Evasion" (T1203), specifically the technique of "Exploitation for Client Execution" (T1193). The primary telemetry source is the AppX Deployment Service with a focus on Event ID 854. If the detected behavior is malicious, it can lead to unauthorized software installations, privilege escalation, or system compromise. However, this detection does NOT confirm that the application is inherently malicious since it may also indicate legitimate applications, depending on the deployment context.

  ### Investigation Steps

  - **Review deployment source:**
    Check the path of the detected `.appx` using Event ID 854 from the AppX Deployment Service logs. Legitimate deployments typically originate from predefined directories like `C:\Program Files` or trusted sources, while uncommon directories may indicate potential abuse.

  - **Verify application integrity:**
    Assess the metadata and digital signatures of the `.appx` package detected. Look for trusted publisher signatures versus unknown or suspicious publishers as a high-confidence indicator of potential malicious intent.

  - **Analyze recent changes:**
    Review system change logs (e.g., using Windows Event ID 4616 or relevant application logs) to determine if there were unusual modifications to deployment configurations or path settings prior to the detection.

  - **Identify user behavior:**
    Investigate user activity associated with the deployment, particularly on critical assets. Cross-reference the user’s recent actions leading up to the alert (Event IDs 4624 for logon and relevant app execution logs) to establish typical versus atypical usage patterns.

  - **Check for related alerts:**
    Look for additional alerts in the logging system associated with the same user or affected assets to establish a broader context of potential compromise or internal misuse.

  - **Correlate with threat intelligence:**
    Utilize threat intelligence tools to identify if the detected application has been reported as malicious or associated with known threat actors. This may involve checking against external databases or internal intelligence feeds.

  ### Prioritization

  The severity of this alert is medium due to the potential impact from an exploited application on sensitive systems, especially in environments with high-value assets. The likelihood of malicious abuse is moderate, as attackers often leverage uncommon paths to deploy payloads. However, legitimate application updates may result in similar behaviors, necessitating thorough investigation to assess the true risk.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging configuration for the AppX Deployment Service is not fully enabled or if common benign applications are frequently deployed from unconventional paths. Legitimate applications like custom enterprise tools may trigger the alert if deployed through less common directories. A related detection that strengthens coverage would be to monitor for unusual application execution patterns through Process Creation logs (Event ID 4688), linking deployment activity to execution.

