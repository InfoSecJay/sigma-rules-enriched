title: AppX Located in Uncommon Directory Added to Deployment Pipeline
id: c977cb50-3dff-4a9f-b873-9290f56132f1
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in uncommon locations.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-03
tags:
- attack.stealth
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
  filter_main_generic:
    Path|contains:
            # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Program%20Files'         # Also covers 'file:///C:/Program%20Files%20(x86)/'
    - ':/Windows/System32/'
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\ImmersiveControlPanel\'
    - ':\Windows\PrintDialog\'
    - ':\Windows\SystemApps\'
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'x-windowsupdate://'
  filter_main_specific:
    Path|contains:
    - 'https://installer.teams.static.microsoft/'
    - 'https://res.cdn.office.net'         # Example https://res.cdn.office.net/nativehost/5mttl/installer/v2/1.2025.617.100/Microsoft.OutlookForWindows_x64.msix
    - 'https://statics.teams.cdn.live.net/'
    - 'https://statics.teams.cdn.office.net/'
    - 'microsoft.com'         # Example: https://go.microsoft.com/fwlink/?linkid=2160968
  filter_optional_onedrive:
    Path|contains: 'AppData\Local\Microsoft\OneDrive\'
  filter_optional_winget:
    Path|contains:
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'AppData\Local\Temp\WinGet\Microsoft.Winget.Source'
  filter_optional_x_windowsupdate:
    Path|contains: 'x-windowsupdate://'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/builtin/appxdeployment_server/win_appxdeployment_server_uncommon_package_locations/info.yml
note: |
  ### Technical Context

  This detection identifies the addition of an AppX package to the deployment pipeline from uncommon directory locations. Attackers may use this technique to deploy malicious applications by masquerading them as legitimate software, leveraging the AppX deployment mechanism. This behavior aligns with the MITRE ATT&CK tactic of **Execution** (TA0002) through the technique **Native Application Execution** (T1203). The primary telemetry sources are Windows Event Logs, specifically **Event ID 854** from the AppX deployment service. If malicious, this could lead to unauthorized application execution or malware deployment, impacting system integrity. Notably, this detection alone does NOT confirm malicious activity; it only indicates anomalous application deployment behavior.

  ### Investigation Steps

  - **Review Event ID 854 logs**: Analyze logs from the AppX deployment service for Event ID 854 where "Path" indicates an uncommon location. Focus on the "Path" field to determine if the package’s source is unauthorized, especially if it originates from user profile directories.

  - **Correlate with known malicious sources**: Cross-reference the paths identified in the logs with documentation on common malicious source URLs, particularly references such as “https://installer.teams.static.microsoft/”. Note any instances that match these indicators.

  - **Check for legitimate behavior**: Identify expected AppX packages from common paths such as `C:\Program Files\` or `C:\Windows\SystemApps\`. Confirm that normal deployment activities align with these preferred locations and that the applications are pre-approved for use.

  - **Validate related artifacts**: Look for file creation or modification timestamps associated with suspicious paths. Use PowerShell commands or file auditing to confirm timestamp integrity and if any execution occurred shortly after deployment in the AppX pipeline.

  - **Examine system roles and context**: Determine the role of the affected machine within the network (e.g., endpoint, server, administrator workstation) to assess the potential impact and validate if the detected behavior is unusual for that asset.

  ### Prioritization

  This alert is medium severity due to the potential impact on enterprise systems if malicious deployment occurs. While uncommon paths suggest suspicious activity, this behavior can occasionally arise from benign administrative actions or application updates that integrate with enterprise software management practices, making contextual assessment essential.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient log configurations; ensure that AppX deployment logging is enabled on critical systems. Attackers may also rely on legitimately packaged applications or utilize similar paths to evade detection. Look for companion detections related to application installations in the same time window, such as powershell scripts or installer executions (e.g., Event ID 4688) that could indicate coordination with deployment activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
