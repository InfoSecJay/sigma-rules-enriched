title: AppX Located in Uncommon Directory Added to Deployment Pipeline
id: c977cb50-3dff-4a9f-b873-9290f56132f1
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in uncommon locations.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-03
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
  filter_main_generic:
    Path|contains:
            # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Program%20Files'         # Also covers 'file:///C:/Program%20Files%20(x86)/'
    - ':/Windows/System32/'
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\ImmersiveControlPanel\'
    - ':\Windows\PrintDialog\'
    - ':\Windows\SystemApps\'
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'x-windowsupdate://'
  filter_main_specific:
    Path|contains:
    - 'https://installer.teams.static.microsoft/'
    - 'https://res.cdn.office.net'         # Example https://res.cdn.office.net/nativehost/5mttl/installer/v2/1.2025.617.100/Microsoft.OutlookForWindows_x64.msix
    - 'https://statics.teams.cdn.live.net/'
    - 'https://statics.teams.cdn.office.net/'
    - 'microsoft.com'         # Example: https://go.microsoft.com/fwlink/?linkid=2160968
  filter_optional_onedrive:
    Path|contains: 'AppData\Local\Microsoft\OneDrive\'
  filter_optional_winget:
    Path|contains:
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'AppData\Local\Temp\WinGet\Microsoft.Winget.Source'
  filter_optional_x_windowsupdate:
    Path|contains: 'x-windowsupdate://'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the addition of an AppX package to the deployment pipeline that resides in uncommon directories. The presence of AppX files in atypical locations can indicate malicious activity, as attackers often aim to exploit legitimate application deployment methods to deliver malware, such as with BazarLoader. The detection specifically monitors EventID 854 from the Windows app deployment server, which logs AppX state changes.

  The primary objective of the attacker may involve deploying malware disguised as a legitimate application or modifying existing applications to introduce malicious functionality. Techniques common in these scenarios may include Defense Evasion (T1562) where attackers attempt to conceal malicious actions within legitimate application processes. Relevant techniques from the MITRE ATT&CK framework include “Abuse Elevation Control Mechanism” (T1548) and “Impair Defenses” (T1562).

  The best telemetry for this detection comes from Windows App Deployment logs, specifically those capturing deployment events and paths of packages. This information can help differentiate legitimate application installations from potentially malicious modifications.

  ### Investigation Steps
  - **Review Log Entries:** Examine logs for EventID 854 from the Windows app deployment server, looking for changes that include package paths outside conventional directories (e.g., Program Files, Windows System32).
  - **Analyze Path Uniqueness:** Investigate the added AppX package paths to assess whether they originate from known malicious sources or uncommon directories. Focus on URLs that differ from trusted application installation sources.
  - **Correlate User Actions:** Cross-reference the timing and user accounts associated with the deployment of the AppX packages to identify any suspicious or unauthorized actions.
  - **Check for Known Indicators:** Utilize threat intelligence to evaluate if the detected AppX file paths or source URLs have been previously associated with malicious activity or malware delivery.

  ### Prioritization
  Alerts generated from this detection rule should be treated with medium severity due to the potential impact of deploying malicious applications within the organization. The likelihood of such attacks is increasing as adversaries explore different techniques for exploiting software deployment frameworks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the telemetry from the Windows app deployment server is not consistently collected or if the logging level does not capture the needed details. The detection logic assumes that any AppX package located in non-standard directories is suspicious, which might lead to false positives in environments with legitimate applications stored in uncommon locations. Proper configuration of logging settings for the app deployment server is required for this detection to function effectively.

