title: AppX Located in Uncommon Directory Added to Deployment Pipeline
id: c977cb50-3dff-4a9f-b873-9290f56132f1
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in uncommon locations.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
modified: 2025-12-03
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection:
    EventID: 854
  filter_main_generic:
    Path|contains:
            # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Program%20Files'         # Also covers 'file:///C:/Program%20Files%20(x86)/'
    - ':/Windows/System32/'
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\ImmersiveControlPanel\'
    - ':\Windows\PrintDialog\'
    - ':\Windows\SystemApps\'
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'x-windowsupdate://'
  filter_main_specific:
    Path|contains:
    - 'https://installer.teams.static.microsoft/'
    - 'https://res.cdn.office.net'         # Example https://res.cdn.office.net/nativehost/5mttl/installer/v2/1.2025.617.100/Microsoft.OutlookForWindows_x64.msix
    - 'https://statics.teams.cdn.live.net/'
    - 'https://statics.teams.cdn.office.net/'
    - 'microsoft.com'         # Example: https://go.microsoft.com/fwlink/?linkid=2160968
  filter_optional_onedrive:
    Path|contains: 'AppData\Local\Microsoft\OneDrive\'
  filter_optional_winget:
    Path|contains:
    - 'AppData/Local/Temp/WinGet/Microsoft.Winget.Source'
    - 'AppData\Local\Temp\WinGet\Microsoft.Winget.Source'
  filter_optional_x_windowsupdate:
    Path|contains: 'x-windowsupdate://'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of an `.appx` package to the deployment pipeline from uncommon directories, which may indicate malicious activity, such as the use of unauthorized or potentially compromised applications. An attacker may leverage this technique to deploy software that bypasses security controls and is designed to execute harmful activities on the system, with objectives such as establishing persistence or distributing malware. This behavior correlates with the MITRE ATT&CK tactic of **Defense Evasion (TA0005)**, specifically the technique **Application Layer Protocol (T1071.001)**.

  The primary telemetry source for this detection is the AppX deployment server logs from Windows, specifically looking for Event ID 854. If a malicious app is deployed through the pipeline, it could lead to serious security incidents, including data breaches or unauthorized system access. However, this detection alone does not confirm that the app is indeed malicious; it only indicates it originated from an uncommon location that may warrant further investigation.

  ### Investigation Steps

  - **Verify the source path of the deployment:**
    Check the Event ID 854 logs for the source path of the `.appx` package. Look for paths not typical for legitimate app installations, such as user-specific directories or non-standard application folders.

  - **Identify the application:**
    Review the description of the application associated with the `.appx` package using the log field `AppName` in Event ID 854. Determine if the app is a known legitimate application or if it raises flags for being unrecognized or high risk.

  - **Check for legitimate deployments:**
    Inspect deployment patterns or a list of commonly used software within the organization. Legitimate activity should show deployment from recognized sources like `C:\Program Files\` or Microsoft update channels. Non-conformance to this can suggest malicious intent.

  - **Assess pivoting activity:**
    Analyze nearby logs for unusual user behavior related to the affected user account. Check User Authentication logs (Security Event ID 4624) for anomalous logins or the use of administrative privileges tied to the same timeframe.

  - **Look for related indicators of compromise (IoCs):**
    Review recent execution events relevant to the application using Sysmon Event ID 1. Note indicators such as unusual command line parameters, parent process relationships, or scripts that may signify exploitation attempts or payload execution.

  ### Prioritization

  This alert is medium severity due to the potential impact of compromised applications being deployed to critical systems, which could facilitate data exfiltration or persistent threats. Although the specific behavior is not commonly weaponized on its own, its alignment with known attack vectors raises concerns about potential exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by improper or non-existent logging configurations for AppX deployments, especially if logging levels are not set to capture all relevant events. Evasion techniques may include using common application paths or legitimate update channels to disguise malicious packages. Legitimate activities, such as software updates or new application deployments, could trigger this alert if they originate from uncommon sources. A related detection to consider is an alert for PowerShell commands executing potentially malicious scripts that could further invoke unwanted application behavior.

