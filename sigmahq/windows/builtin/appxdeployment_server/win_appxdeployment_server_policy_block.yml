note: |
  ### Technical Context

  This detection identifies instances where AppX package deployments have been blocked by local computer policies. These events serve as indicators of potential unauthorized or malicious attempts to install applications, often reflecting adversary attempts to manipulate or persist on a system. The likely objective of the attacker is to bypass administrative control measures that restrict application installations or updates to secure the attacker's foothold.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1203), specifically the technique for **Exploitation for Client Execution** (T1203). Primary telemetry sources include Windows Event Logs with specific focus on AppX deployment events (Event IDs 441, 442, 453, and 454). If an adversary successfully deploys unwanted applications, this could lead to significant security risks, including data exfiltration or further system compromise. However, this detection alone does not confirm malicious intent—it may also flag legitimate policy compliance or user actions.

  ### Investigation Steps

  - **Verify Event Details:**
    Check Windows Security Event Logs for Event IDs 441, 442, 453, or 454 in the AppXDeployment-Server logs to confirm the block reason. Pay attention to the fields indicating the package ID and the profile in which the deployment was attempted.

  - **Assess Package Legitimacy:**
    Cross-reference the package name with the organization's approved application list. Blocked corporate applications may require policy adjustment; however, unrecognized packages should prompt further investigation.

  - **Review User Activity:**
    Investigate user activity associated with the blocked deployment, focusing on user account details, time of the event, and any recent administrative changes. Use the **Security Event ID 4624** (Logon) to track user logon and usage patterns around the time of the alerts.

  - **Check for Related Auditing Events:**
    Look for Event ID 129 from the AppXDeployment log to see if there were prior successful deployments or configuration changes that align with the blocked attempts, indicating potential targeted behavior.

  - **Identify System Impact:**
    Evaluate the affected system's role within the network (e.g., a critical infrastructure server vs. a non-critical user workstation) to assess the potential impact of unauthorized application deployment.

  - **Monitor for Evasion Techniques:**
    Look for evidence of DLL side-loading or attempts to bypass AppX deployment policies through alternative channels. Review Application and Service Logs for abnormal behavior that correlates with the blocking events.

  ### Prioritization

  The severity of this alert is medium due to the potential for unauthorized applications to affect system integrity and security. While blocked packages may indicate a defense against malicious activity, there is also the risk that a determined adversary could bypass these restrictions. This behavior is frequently weaponized in targeted attacks aiming to install malware or unwanted applications.

  ### Blind Spots and Assumptions

  This detection may be limited by the configuration of local policies, as certain legitimate administration activities may also trigger these alerts. Required logging configurations include ensuring all relevant Windows Event Logs are retained for adequate review, specifically those related to AppX deployment. Legitimate activity such as routine software updates or administrative changes may generate similar alerts. A related detection to strengthen coverage could involve monitoring for execution attempts of AppX packages that bypass such deployment policies, using Event ID  4657 (Registry Value Modified) for registry changes in AppX settings.

