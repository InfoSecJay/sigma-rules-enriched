  ### Technical Context

  This rule detects when an AppX package deployment is blocked by AppLocker policy, indicating potential unauthorized software installation attempts. The likely attacker objective is to execute stateful or malicious applications that could lead to further compromise. This behavior fits into the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005) and the technique of Application Layer Protocol Abuse (T1071.001).

  The primary telemetry source is the AppX Deployment Server logs, specifically Event ID 412. If the behavior is malicious, it could result in user endpoint compromise. It’s important to note that this detection alone does not confirm that malicious activity has occurred, as legitimate applications may also be blocked by AppLocker policies.

  ### Investigation Steps

  - **Check Event Details:** Review Event ID 412 in the AppX Deployment logs. Look for the `PackageFamilyName` and `PackageName` fields to identify the blocked application. This can indicate potential unauthorized software attempts.

  - **Evaluate Legitimacy:** Compare the package details against your authorized software inventory. Legitimate installations are usually documented in your software deployment processes, while mismatched entries may indicate a security risk.

  - **Analyze User Context:** Investigate which user attempted the deployment. High-value targets or off-hours activity may raise flags. Look for the `UserPrincipalName` field in Event ID 412 for context.

  - **Cross-Reference Related Events:** Search for other security events around the same timestamp (Event ID 4624 for logon and Event ID 4688 for process creation) to identify if suspicious processes initiated the block.

  - **Review AppLocker Policies:** Examine AppLocker policy definitions to understand the rules that caused the block (often found in Group Policy settings). Misconfigurations could lead to unnecessary blocks of legitimate software.

  - **Document Findings:** Compile evidence if the activity falls outside typical user behavior or correlates with an attempted breach. This may involve malicious application hashes or user accounts with high-risk behaviors.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on endpoint integrity and the likelihood that attackers may attempt to circumvent application whitelisting controls. Since evasion of AppLocker is a known tactic, this behavior warrants immediate investigation, especially if associated with unrecognized applications.

  ### Blind Spots and Assumptions

  Detection may be limited by audit policy settings, as only configured AppX events will be recorded; ensure AppLocker logging is enabled. Legitimate software updates can mistakenly trigger this alert when they fall outside preset rules. Related detections, such as process creation alerts (Event ID 4688) for newly launched executables, can provide complementary insights into suspicious behaviors.

