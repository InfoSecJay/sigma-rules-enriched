  ### Technical Context

  This rule detects the failure of an AppX package deployment that was blocked by AppLocker policy, indicating a potentially unauthorized attempt to install software. The likely objective of an attacker could be to deploy malicious applications or payloads using legitimate-looking AppX packages. This behavior aligns with the MITRE ATT&CK technique “Application Layer Protocol” (T1071), especially in cases where the goal is to evade detection by using trusted channels to introduce malware.

  The primary telemetry source is the AppX deployment server's logs, specifically looking for Event ID 412. If an AppX installation is blocked, it may indicate an attempt by an adversary to bypass application control mechanisms. This detection does NOT confirm the source or intent behind the attempted installation on its own; further investigation is needed to determine if the action is malicious or part of legitimate administrative activities.

  ### Investigation Steps

  - **Verify Event Details**: Check App Event Log for Event ID 412 entries from the AppXDeployment-Server source. Look for the `PackageName`, `BlockReason`, and `UserName` fields to understand what application was targeted and who initiated the request.

  - **Identify Legitimate Activity**: Cross-reference with known-good packages to determine if the blocked AppX package is a standard application or a suspicious one. Legitimate software installations typically involve signed packages from trusted publishers.

  - **Investigate User Context**: Analyze the user context (`UserName` field) in the blocked event to identify whether it was an administrative user or a standard user account. Unusual activity by non-admin users should be further scrutinized.

  - **Assess Device Role**: For endpoints with critical functions (i.e., domain controllers or servers), consider the potential impact of any unauthorized software installations. Further inspect this asset's logs for abnormal behavior around the same timeframe as the blocked event.

  - **Cross-reference with Other Alerts**: Check for any related alerts or logs from antivirus or endpoint detection solutions that may indicate additional malicious behaviors preceding or following the blocked AppX deployment.

  - **Check for Evasion Attempts**: Look for patterns in AppX package names or distribution methods (e.g., unusual download sources or timestamps). Evaluate whether there were previous successful installations from the same or related users, which may indicate attempts to install software unbeknownst to the security posture.

  ### Prioritization

  This alert has medium severity due to the possibility of a blocked malicious installation attempt, particularly on high-privilege or critical systems. While AppLocker is designed to prevent unauthorized applications, attackers often leverage legitimate packages to achieve their objectives, making this behavior a potential vector for compromise.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with relaxed AppLocker policies or where AppX usage is legitimate and common. There’s a risk of false positives if legitimate software updates are misconfigured or blocked. Additionally, related detections such as the failure of script execution or logon events that precede package installation attempts can complement coverage and provide context for potential threats.

