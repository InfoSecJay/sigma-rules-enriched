title: AppX Located in Known Staging Directory Added to Deployment Pipeline
id: 5cdeaf3d-1489-477c-95ab-c318559fc051
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in a known folder often used as a staging directory.
references:
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection_eid:
    EventID: 854
  selection_paths_forward:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Perflogs/'
    - ':/Users/Public/'
    - ':/Windows/Temp/'
    - '/AppdData/Local/Temp/'
    - '/Desktop/'
    - '/Downloads/'
  selection_paths_back:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':\PerfLogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppdData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
  condition: selection_eid and 1 of selection_paths_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the addition of an AppX package to the deployment pipeline from known staging directories often exploited for malicious purposes. Attackers may use such behavior to execute malware disguised as legitimate applications, aiming for stealthy persistence or lateral movement within enterprise environments. This activity falls under the MITRE ATT&CK tactic of Defense Evasion (T1218) and the technique of Application Layer Protocol (T1071).

  The primary telemetry source is the Windows AppX deployment service, specifically Event ID 854. If malicious, this behavior could lead to unauthorized installations of rogue applications, potentially compromising sensitive systems or data. Importantly, this detection alone does not confirm malicious activity; it only indicates potential misuse of a legitimate application deployment process.

  ### Investigation Steps

  - **Review Event ID 854:** Check for Event ID 854 in the AppX deployment logs. Look for entries containing paths such as `C:\Users\Public\`, `C:\Windows\Temp\`, or other specified directories. Events originating from these locations could indicate suspicious activity.

  - **Validate the app package source:** Verify the origin of the AppX package. Cross-reference the package hash with known databases for malicious signatures or registries. Legitimate packages typically originate from trusted sources, while unverified or unusual source paths may indicate malicious intent.

  - **Assess deployment pipeline behavior:** Evaluate the frequency and pattern of AppX deployments. Frequent deployments from suspect directories, especially in non-standard operating hours, can be a strong indicator of malicious behavior.

  - **Examine file creation timestamps:** Check for creation or modification timestamps of files in the staging directories. Anomalies or unexpected timestamps that do not correlate with standard operational hours could highlight malicious activity.

  - **Identify known safe applications:** Cross-reference the AppX package names against an internal whitelist of approved applications. If an unknown or suspicious package is detected in the pipeline, consider it a strong malicious indicator.

  - **Consult system role and criticality:** Assess the system involved in the alert. High-value assets such as domain controllers or sensitive data repositories should prompt an immediate response due to the elevated risk associated with unauthorized application installations.

  ### Prioritization

  This alert is of high severity, especially if the affected system hosts critical infrastructure or sensitive data. The likelihood of malicious abuse is significant, as known staging directories are frequently used by adversaries to install malicious software or maintain persistence. Such behavior aligns with established tactics observed in various advanced persistent threat (APT) attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not capture all instances of AppX deployment logs or by deficiencies in baseline behavior analysis. Legitimate activities, such as routine software updates or installations by IT personnel, could trigger this alert. Companion detections include monitoring for atypical AppX installations alongside user account activity audits to strengthen the analysis of potentially malicious behavior.

