title: AppX Located in Known Staging Directory Added to Deployment Pipeline
id: 5cdeaf3d-1489-477c-95ab-c318559fc051
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in a known folder often used as a staging directory.
references:
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection_eid:
    EventID: 854
  selection_paths_forward:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Perflogs/'
    - ':/Users/Public/'
    - ':/Windows/Temp/'
    - '/AppdData/Local/Temp/'
    - '/Desktop/'
    - '/Downloads/'
  selection_paths_back:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':\PerfLogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppdData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
  condition: selection_eid and 1 of selection_paths_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies when an application package (APPX) is added to the deployment pipeline and is located in a directory commonly used as a staging area. Such staging directories—like `Temp`, `Public`, `Desktop`, and `Downloads`—can be exploited by attackers to deploy malicious applications using legitimate mechanisms, such as those inherent to Windows app deployment processes. The presence of an APPX package in these pathways might indicate a potential malware deployment attempt, particularly by threat actors leveraging techniques like BazarLoader, which abuses Windows' APPX packaging methods for malicious purposes.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), with techniques such as **Compromise Applications** (T1203) and **Trusted Developer Utilities** (T1218). Attackers may aim to obscure their activities by using benign file types (like APPX), taking advantage of normal application update channels to introduce malicious code into a target environment.

  Primary data sources for this detection include **APPX deployment server logs** and **Windows event logs** that capture file-handling events, particularly tracking any unusual activity within directories dedicated to application processing.

  ### Investigation Steps
  - **Review APPX Deployment Logs:** Examine APPX package addition events via the APPX deployment server logs to identify suspicious entries or packages that originate from dubious paths.
  - **Analyze File Metadata:** Gather metadata related to the detected APPX file to evaluate its origin. Check creation times, modification history, and the signer's digital certificate for legitimacy.
  - **Examine Related Process Activity:** Investigate any processes that initiated around the time of the APPX addition event. Look for unusual or unauthorized executables launching that might correlate with the suspicious APPX package.
  - **Conduct Network Analysis:** Check for network connections or communications initiated by the application after its deployment. Correlate these to known bad IP addresses or domains associated with malicious activity.

  ### Prioritization
  This alert is classified with high severity due to the potential for significant impact on an organization's security posture if an attacker successfully deploys malicious applications using leveraging evasion techniques. The likelihood of exploitation is heightened in enterprises that utilize APPX deployment in their workflow.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding other file types that could be used in nefarious ways beyond APPX packages, as well as legitimate uses of staging directories that could lead to false positives. The detection logic assumes that malicious packages will be specifically introduced in known suspicious paths and may not account for evasion tactics that avoid these paths. The necessary logs for effective detection include comprehensive logs from the APPX deployment server, and they must be configured correctly to capture all relevant events efficiently.

