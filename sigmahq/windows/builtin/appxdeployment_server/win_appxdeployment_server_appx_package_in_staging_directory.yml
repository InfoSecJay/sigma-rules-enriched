title: AppX Located in Known Staging Directory Added to Deployment Pipeline
id: 5cdeaf3d-1489-477c-95ab-c318559fc051
status: test
description: |
  Detects an appx package that was added to the pipeline of the "to be processed" packages that is located in a known folder often used as a staging directory.
references:
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
- https://learn.microsoft.com/en-us/windows/win32/appxpkg/troubleshooting
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
tags:
- attack.stealth
logsource:
  product: windows
  service: appxdeployment-server
detection:
  selection_eid:
    EventID: 854
  selection_paths_forward:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':/Perflogs/'
    - ':/Users/Public/'
    - ':/Windows/Temp/'
    - '/AppdData/Local/Temp/'
    - '/Desktop/'
    - '/Downloads/'
  selection_paths_back:
    Path|contains:     # Paths can be written using forward slash if the "file://" protocol is used
    - ':\PerfLogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppdData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
  condition: selection_eid and 1 of selection_paths_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the addition of an .appx package located in known staging directories frequently exploited by malicious actors. The likely objective of an attacker is to introduce a rogue or compromised application into a deployment pipeline, which may ultimately lead to further exploitation of systems through malware dissemination or data exfiltration. This behavior is associated with the MITRE ATT&CK technique for **Application Layer Protocol Manipulation (T1071)**, specifically leveraging the application deployment features of Windows.

  The primary telemetry source for this detection is Windows Event ID **854**, logged by the AppX Deployment Server. If malicious, the security impact could include the deployment of malicious software that compromises the integrity and availability of systems. It's essential to note that this detection does NOT confirm that malicious action has occurred; it simply indicates a potential vector for exploitation requiring further investigation.

  ### Investigation Steps

  - **Check Event ID 854 logs**: Review logs for Event ID **854** from the AppX Deployment Server to identify the initiated appx package deployment along with source paths. This will provide visibility into any recent changes to the deployment pipeline.

  - **Verify staging directory contents**: Assess contents in known staging directories, such as `C:\Users\Public\`, `C:\Windows\Temp\`, and `C:\Users\<username>\Downloads\`. Look for appx files that should not be present based on legitimate usage patterns.

  - **Confirm baseline appx usage**: Understand the legitimate appx package deployment process within your environment. Generate a list of authorized appx packages and compare them against the detected package to identify any unauthorized additions.

  - **Identify any behavioral anomalies**: Look for discrepancies in user or system behavior following the alert trigger. For example, sudden spikes in resource usage from associated processes may indicate malicious activity.

  - **Cross-check with antivirus/endpoint detection logs**: Review results from endpoint detection and response tools or antivirus logs to identify any flagged malicious behavior that corresponds with the appx deployment logs, indicating higher confidence of compromise.

  - **Assess for known threat indicators**: Utilize threat intelligence resources to identify the presence of known malicious appx signatures that may correlate with the detected package. This can help prioritize the investigation based on known threat actors.

  ### Prioritization

  This alert is considered high severity due to the significant risk posed by potential malware deployment through appx packages. The affected systems likely hold sensitive data or perform critical functions, increasing the likelihood of exploitation if the behavior is malicious. This type of attack mechanism has been weaponized in various campaigns, underscoring the need for timely and thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logs are not retained long enough or if the AppX service is configured incorrectly, potentially leading to missed alerts. Legitimate activities, such as typical software updates, may trigger this alert if not properly whitelisted. A related detection rule could include monitoring for **Task Scheduler events** that correlate with appx deployments, enhancing visibility into operational changes associated with the potential malicious activity.

