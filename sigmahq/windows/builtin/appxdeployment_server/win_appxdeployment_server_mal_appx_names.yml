  ### Technical Context

  This Sigma rule detects the installation or attempted installation of known malicious AppX packages, specifically targeting behavior linked to malware distribution mechanisms like BazarLoader. The likely attacker objective is to leverage the Windows AppX deployment framework to execute malicious payloads stealthily on the target system. Relevant MITRE ATT&CK tactics include Defense Evasion (T1218) and Execution (T1203). The primary telemetry sources are Windows Event logs related to AppX deployment, specifically Event IDs 400 and 401. If malicious, this activity can compromise system integrity and potentially lead to broader network exploitation. This detection does NOT confirm malicious intent solely based on the event; further context is necessary to differentiate between legitimate application updates and actual malware installation.

  ### Investigation Steps

  - **Review EventID 400/401 details:** Analyze the Windows Event logs (Event IDs 400 and 401) for the package installation attempts and extract the `PackageFullName` field to confirm if it matches the known malicious indicators.

  - **Validate package source integrity:** Check if the detected AppX package's source is legitimate by comparing it against the Microsoft Store or trusted repositories. Malicious installations often deviate from expected sources.

  - **Correlate with known IoCs:** Cross-reference any detected `PackageFullName` against the list of known malicious packages that include `3669e262-ec02-4e9d-bcb4-3d008b4afac9`. Confirm any matches are concurrent with suspicious user activity.

  - **Identify normal AppX usage:** Establish a baseline of typical AppX installations in your environment by analyzing historical installation data. Legitimate enterprise applications should match expected naming conventions, vendor sources, and timings.

  - **Examine related process activities:** Look into parent process information for any processes triggered by the AppX installation, leveraging Sysmon Event ID 1 to link the installation to other suspicious activities, such as unexpected command line arguments.

  - **Assess asset criticality:** Evaluate the risk associated with the affected endpoint. High-impact systems (e.g., servers, administrative workstations) should be prioritized for investigation to mitigate risks associated with unauthorized application installations.

  ### Prioritization

  This alert has medium severity due to the potential risk of system compromise via malicious app installations. The AppX deployment mechanism is a common method for attackers to deploy malware, making this behavior a significant indicator of potential compromise. Immediate investigation is warranted, especially on high-value systems.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques such as renaming of malicious packages or direct installation via alternative mechanisms that don't trigger AppX events. Ensure comprehensive collection of AppX deployment logs is configured correctly for effective detection. Legitimate software installations, particularly from third-party vendors that mimic naming conventions, may inadvertently trigger this alert. A related detection to strengthen coverage would be monitoring Sysmon logs for unexpected application execution immediately following an AppX package installation event.

