note: |
  ### Technical Context

  This Sigma rule detects attempts to install unsigned MSIX/AppX packages using the `-AllowUnsigned` parameter. A likely attacker objective is to bypass application security controls to install potentially malicious software on a system. This behavior falls under the MITRE ATT&CK tactics of Execution (T1204.002) and Defense Evasion (T1553.005). The primary telemetry source is the Windows AppX Deployment Server logs, specifically Event ID 603 from this service. From a security standpoint, unauthorized unsigned package installations can introduce malware, leading to system compromise and data exfiltration. This detection does NOT confirm malicious intent on its own; it merely indicates an installation attempt of an unsigned package.

  ### Investigation Steps

  - **Check event details: ** Review Event ID 603 in the AppX Deployment Server logs: Look for fields that include the `AllowUnsigned` flag set to '8388608'. Note the username and the path of the package being installed.

  - **Identify legitimate installations: ** Consider the context of the user account performing the installation. If the account belongs to a development team and the installation corresponds to known application development projects, it may be benign.

  - **Validate recent package signatures: ** Investigate the unsigned package metadata, including its publisher and certification details. Check for discrepancies in the package origin that may indicate malicious intent.

  - **Cross-reference with other logs: ** Review Windows Security Event ID 4688 for process creation events around the time of the installation. Identify any processes initiated that may correspond to known malicious tools or software.

  - **Assess asset criticality: ** Determine if the installation is on critical infrastructure or high-value targets. Malicious activities here pose a higher risk.

  - **Monitor user behavior post-installation: ** Check for unusual or unexpected behavior following the installation, such as elevated process activity, unusual network connections, or attempts to modify system configurations.

  ### Prioritization

  This alert should be considered medium severity, as the impact of installing unsigned packages on critical systems can be significant, leading to potential exploitation. The likelihood of malicious abuse is plausible given the common use of this technique by attackers to deploy malware, particularly in environments with weak application control policies.

  ### Blind Spots and Assumptions

  Detection limitations exist, particularly regarding the inherent legitimacy of unsigned package installations for development and testing purposes. Reliable detection necessitates proper logging configurations for the AppX Deployment Server. Legitimate activities might include installation of beta software or internal applications by trusted developers. A related detection would include monitoring file creation events (such as via Sysmon Event ID 11) for suspicious activity linked to the newly installed unsigned packages, enhancing overall monitoring efforts.

