  ### Technical Context
  This rule detects the use of ngrok, a reverse proxy tool that can tunnel traffic through a local port, specifically targeting the local Remote Desktop Protocol (RDP) service. Malicious actors often utilize such tools to bypass network defenses and maintain remote access to compromised systems. The presence of ngrok forwarding to the RDP port may indicate unauthorized remote access or potential nefarious activity in an enterprise environment.

  The likely attacker objective is to establish covert remote sessions on systems, which can facilitate further exploitation, data exfiltration, or lateral movement within the network. Since ngrok can mask an attacker's intentions by obfuscating the source of the connection, detection of its use is crucial in identifying potential command and control operations.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Command and Control** (T1071)
  - **Application Layer Protocol** (T1071.001)

  Primary data sources for detecting ngrok activity include Windows event logs focusing on terminal services, specifically the Session Manager logs which can indicate anomalous connections to the RDP service.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Event ID 21 logs to identify any entries indicating that ngrok is being used to forward connections to the RDP service. Look for patterns that deviate from normal usage.
  - **Analyze RDP Access Patterns**: Check for unusual RDP connection attempts, specifically from external IP addresses. Correlate these logs with the discovered ngrok usage to assess the legitimacy of the connections.
  - **Inspect Network Traffic**: Analyze network traffic and any established connections involving the RDP port to identify potential tunneling activity. Use NDR solutions to track down unexpected data flows that may indicate the use of ngrok.
  - **Investigate User Behavior**: Determine the accounts associated with the discovered ngrok instances. Examine their activity leading up to the event to identify whether it aligns with legitimate use cases or if it indicates malicious intent.

  ### Prioritization
  This alert is high-severity due to the potential for unauthorized access to sensitive systems via RDP. Given the serious implications of such access, including data breaches and compromise of critical infrastructure, swift investigation and response are imperative.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate use cases of ngrok; therefore, analysts should be cautious of false positives. The detection logic assumes the presence of specific logging configurations (e.g., enabling Event ID 21) and that no other legitimate processes are employing similar tunneling methods. It is important to ensure that logs are properly retained and accessible for thorough analysis.

