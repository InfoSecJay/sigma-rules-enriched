  ---

  ### Technical Context

  This rule detects failed DNS zone transfer requests, indicating potential reconnaissance activity by an adversary attempting to gather information about domain structure or internal resources. The likely attacker objective is to obtain zone information that includes hostnames and IP addresses of systems within the organization, which can be leveraged for further exploitation. This behavior aligns with the MITRE ATT&CK technique "DNS zone transfer" (T1590.002), under the tactic of reconnaissance.

  The primary telemetry source is Windows Server DNS logs, specifically Event ID 6004, which records failed zone transfer requests. If malicious, a successful zone transfer could expose sensitive network architecture information, leading to targeted attacks. However, this detection does NOT confirm that a zone transfer was successful or that any data was exfiltrated.

  ---

  ### Investigation Steps

  - **Check DNS Event Logs:** Review Windows DNS server logs for Event ID 6004 to confirm the failed zone transfer requests. Look for the source IP address (field: `%1`) and the requested zone (field: `%2`) to identify potential adversary activity.

  - **Identify Source IP Behavior:** Investigate the source IP of the failed requests. Cross-reference against known malicious IPs or check for unusual traffic patterns or incidents reported against this IP to assess if it aligns with known attacker signatures.

  - **Review DNS Configuration:** Confirm that DNS zone transfer settings are secured and restricted to authorized servers. Ensure only specific IP addresses are allowed for zone transfers and validate that there are no misconfigurations allowing broad access.

  - **Document Expected Legitimate Behavior:** Identify any legitimate systems or services that may generate legitimate zone transfer requests, such as authorized backup systems or secondary DNS servers. Record their IP addresses and compare them against the alerting source IP.

  - **Monitor Successful Transfers:** Ensure there are no recent successful zone transfers to unintended destinations within the last 30 days. Check logs for Event ID 6000 (successful transfers) for any transactions that may align with malicious intent.

  - **Assess Infrastructure Impact:** Review the potential impact of the systems involved in the failed zone transfers. Prioritize based on the criticality of affected DNS servers and their role in the organization’s infrastructure.

  ---

  ### Prioritization

  The severity of this alert is medium, as it involves failed reconnaissance attempts that could indicate probing by an external threat actor. Given that DNS zone transfers can lead to exposure of sensitive information, there is a moderate likelihood of malicious abuse. While the detection indicates failed attempts, it should be prioritized for further investigation, as successful transfers may become problematic.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if logging for Event ID 6004 is not enabled or if the DNS server configuration is not properly secured. Legitimate activities, such as misconfigured internal systems or authorized backup processes, could trigger this alert. Additionally, a companion detection involving successful zone transfer log entries (Event ID 6000) can strengthen coverage to identify any previously missed attempts.

