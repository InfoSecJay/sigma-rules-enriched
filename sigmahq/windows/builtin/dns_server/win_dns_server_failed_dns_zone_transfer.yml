  ### Technical Context

  This rule detects failed DNS zone transfer requests, which occur when a DNS server receives a request for a zone transfer for an authoritative or non-existent zone. Attackers may target DNS servers to gather information about a domain, facilitating further reconnaissance or exploitation. The relevant MITRE ATT&CK tactic is **Reconnaissance** (TA0043), specifically technique **DNS Query Heightening** (T1590.002).

  The primary telemetry sources are Windows DNS server logs, particularly Event ID 6004. If this behavior is malicious, it could indicate an unauthorized attempt to extract sensitive DNS information or configuration details, leading to further attacks such as phishing or lateral movement. Importantly, while this alert indicates a potentially malicious activity, it does NOT confirm an actual breach or successful information retrieval.

  ### Investigation Steps

  - **Review Event ID 6004 logs:** Check for instances of Event ID 6004 in the DNS logs. Look for source IP addresses indicating familiar or legitimate sources. This event specifically notes failed zone transfer requests.

  - **Validate DNS configurations:** Ensure the DNS server is configured to permit zone transfers only to trusted IP addresses. Legitimate zone transfers should originate from identifiable domain controllers or DNS servers.

  - **Correlate with source IP activity:** Investigate the source IP addresses associated with the failed transfer requests. Verify if they are part of a known or legitimate internal network or if they are unexpected external entities.

  - **Identify high-confidence malicious indicators:** Look for repeated failed attempts from the same IP address within a short time frame which could indicate a targeted reconnaissance effort, as attackers often perform multiple attempts to gather information.

  - **Assess host role:** Consider the role of the DNS server in your environment. If it is a critical infrastructure component, escalated monitoring and response may be necessary.

  - **Log additional telemetry:** Validate if there are associated network logs (e.g., firewall logs) showing abnormal DNS traffic patterns such as repeated queries or external DNS request explosions around the same time, potentially indicating broader reconnaissance attempts.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential reconnaissance activity against DNS servers, which are critical components of the network infrastructure. The likelihood of abuse is moderate, as DNS zone transfers are commonly exploited tactics for gathering sensitive information about domain structures.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if proper DNS logging is not enabled or if the firewall blocks the DNS traffic where the transfer requests originate. Legitimate activities, such as routine administrative tasks from authorized network devices, could trigger this alert. Complementary detections, like tracking successful zone transfers, can help provide context and verify if the transfer requests are part of normal operations.

