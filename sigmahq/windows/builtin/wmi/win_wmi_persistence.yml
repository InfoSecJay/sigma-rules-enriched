title: WMI Persistence
id: 0b7889b4-5577-4521-a60a-3376ee7f9f7b
status: test
description: Detects suspicious WMI event filter and command line event consumer based
  on WMI and Security Logs.
references:
- https://twitter.com/mattifestation/status/899646620148539397
- https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
author: Florian Roth (Nextron Systems), Gleb Sukhodolskiy, Timur Zinniatullin oscd.community
date: 2017-08-22
modified: 2022-02-10
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.003
logsource:
  product: windows
  service: wmi
  definition: 'WMI Namespaces Auditing and SACL should be configured, EventID 5861
    and 5859 detection requires Windows 10, 2012 and higher'
detection:
  wmi_filter_to_consumer_binding:
    EventID: 5861
  consumer_keywords:
  - 'ActiveScriptEventConsumer'
  - 'CommandLineEventConsumer'
  - 'CommandLineTemplate'
        # - 'Binding EventFilter'  # too many false positive with HP Health Driver
  wmi_filter_registration:
    EventID: 5859
  filter_scmevent:
    Provider: 'SCM Event Provider'
    Query: 'select * from MSFT_SCMEventLogEvent'
    User: 'S-1-5-32-544'
    PossibleCause: 'Permanent'
  condition: ( (wmi_filter_to_consumer_binding and consumer_keywords) or (wmi_filter_registration)
    ) and not filter_scmevent
falsepositives:
- Unknown (data set is too small; further testing needed)
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious use of Windows Management Instrumentation (WMI) for persistence mechanisms by monitoring the creation of suspicious WMI event filters and command-line event consumers. The use of WMI for persistence can enable attackers to maintain control over compromised systems even after a reboot or user logoff, which poses a significant risk to the security posture of an enterprise. Attackers leveraging this technique might aim to exfiltrate data, elevate privileges, or execute arbitrary code surreptitiously.

  The relevant MITRE ATT&CK tactics include:
  - **Persistence (T1546.003)**: WMI is commonly used to create persistent backdoors within systems.
  - **Privilege Escalation (T1050)**: WMI can be a conduit for privilege escalation by initiating actions as an administrative user.

  The primary data sources for this detection rule are:
  - **WMI Event Logs**: These logs contain events related to WMI execution, including the creation of event filters and consumers.
  - **Security Logs**: Events 5861 (WMI filter to consumer binding) and 5859 (WMI filter registration) are crucial to establish whether suspicious WMI activities are occurring.

  ### Investigation Steps
  - **Review WMI Event Logs**: Examine the events with EventID 5861 and 5859. Look for keywords associated with suspicious command line consumers such as 'ActiveScriptEventConsumer' or 'CommandLineEventConsumer'.

  - **Correlate with Command Line Activity**: Identify and analyze command line parameters for any unusual commands that may indicate malicious intent, particularly those executed via WMI.

  - **Check User Accounts**: Investigate the accounts involved in the creation of WMI components. Focus on operations triggered by accounts with administrative privileges, especially those listed as 'S-1-5-32-544', which indicates a local administrator.

  - **Assess System and Network Behavior**: Monitor for unusual outbound connections or processes initiated as a result of suspicious WMI operations. This could indicate further exploitation stemming from the WMI persistence.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential high impact of persistence mechanisms on system integrity and the likelihood that attackers will utilize these techniques to maintain access, making detection critical for effective incident response.

  ### Blind Spots and Assumptions
  This detection rule may miss other forms of WMI abuse that do not utilize the specific event IDs or keywords defined in the detection logic. It assumes that the WMI Namespaces Auditing and SACL are configured properly, which is typically not the default on many systems. If logging for WMI events isn't enabled or configured correctly, this alert would be ineffective, highlighting an essential requirement for log management and auditing configurations in the environment.

