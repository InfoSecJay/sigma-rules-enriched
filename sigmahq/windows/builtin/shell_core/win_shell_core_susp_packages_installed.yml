title: Suspicious Application Installed
id: 83c161b6-ca67-4f33-8ad0-644a0737cf07
status: test
description: Detects suspicious application installed by looking at the added shortcut
  to the app resolver cache
references:
- https://nasbench.medium.com/finding-forensic-goodness-in-obscure-windows-event-logs-60e978ea45a3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-14
tags:
- attack.execution
logsource:
  product: windows
  service: shell-core
detection:
  selection_name:
    EventID: 28115
    Name|contains:
            # Please add more
    - 'Zenmap'
    - 'AnyDesk'
    - 'wireshark'
    - 'openvpn'
  selection_packageid:
    EventID: 28115
    AppID|contains:
            # Please add more
    - 'zenmap.exe'
    - 'prokzult ad'         # AnyDesk
    - 'wireshark'
    - 'openvpn'
  condition: 1 of selection_*
falsepositives:
- Packages or applications being legitimately used by users or administrators
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of potentially suspicious applications on Windows systems by examining the application resolver cache for added shortcuts. Applications such as Zenmap, AnyDesk, Wireshark, and OpenVPN may facilitate unauthorized remote access, exfiltration of sensitive information, or network reconnaissance activities. Attackers often utilize these tools to perform malicious actions while remaining under the radar of traditional security measures.

  The likely intent behind installing these applications is to gain unauthorized access to the environment, conduct network scans, or manipulate network traffic without detection. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and techniques such as **User Execution** (T1203) and **Command and Scripting Interpreter** (T1059). The primary data sources that will provide the best evidence include Windows event logs, particularly those capturing application installations and shortcut creations.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Event ID 28115 logs for entries that indicate the installation of potentially suspicious applications noted in the detection rule.
  - **Analyze Shortcut Targets:** Investigate the destination paths of the created shortcuts for any anomalies or indications of unauthorized applications that do not align with organizational policy.
  - **Correlate with User Activity:** Check user account activity correlating with the installation time to assess if the application was installed by a legitimate user and if their behavior aligns with expected usage.
  - **Inspect Installed Applications List:** Generate a list of installed applications on the affected system(s) to identify any additional suspicious or unauthorized software that may have been overlooked.

  ### Prioritization
  The alert is assigned a medium severity due to the potential impact of unauthorized applications that may facilitate remote access or other malicious activities. Given the increasing trend of insider threats and remote exploitation, it is crucial to investigate such alerts promptly.

  ### Blind Spots and Assumptions
  The detection logic may not capture all instances of suspicious application installations, particularly if attackers use legitimate software tools not included in the defined list. It assumes that the targeted applications will be installed in a straightforward manner and that logging for application installations is configured correctly. Additionally, if the logging level for Event ID 28115 is not enabled, the rule will not produce alerts as intended. Therefore, proper configuration of Windows event logging is essential for reliable detection.

