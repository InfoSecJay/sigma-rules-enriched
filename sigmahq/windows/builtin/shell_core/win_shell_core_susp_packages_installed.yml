  ---

  ### Technical Context

  This Sigma rule detects the installation of suspicious applications by monitoring changes to the app resolver cache, specifically tracking events related to the creation of shortcuts for certain programs. The likely attacker objective may include establishing persistence, remote access, or reconnaissance through tools commonly used for malicious purposes. This behavior correlates with the MITRE ATT&CK tactic of Execution (TA0002) and the technique of User Execution (T1203).

  Primary telemetry sources include Windows Event Log with specific attention to Event ID 28115, which records changes to the app resolver cache, revealing the addition of shortcuts. If malicious, this could lead to unauthorized access to systems or sensitive data. However, it is essential to note that this detection does NOT confirm malicious activity on its own; legitimate applications can also trigger the same events.

  ---

  ### Investigation Steps

  - **Review installation details: ** Check Windows Event Log for Event ID 28115 and examine the related contextual information under the 'Name' and 'AppID' fields for entries containing 'Zenmap', 'AnyDesk', 'wireshark', and 'openvpn'. Confirm if these entries coincide with unauthorized installations.

  - **Validate user action: ** Cross-reference the installation timestamp with user logins using Security Event ID 4624. Determine if the installation correlates with a legitimate user activity, such as a helpdesk request, or if it appears anomalous (e.g., performed by non-administrators).

  - **Identify persistence mechanisms: ** Investigate processes linked to the applications detected. Check for auto-start entries or scheduled tasks that reference 'Zenmap', 'AnyDesk', or similar tools, indicating potential persistence (e.g., Registry paths, Event ID 4697).

  - **Correlate network activity: ** Analyze network traffic to identify communications initiated by the installed applications. Utilize logs from outgoing connections (Firewall or proxy logs) pointing to known IPs associated with remote access or command-and-control servers.

  - **Examine endpoint role: ** Take into account the device's role, such as whether it is a workstation or server. For example, installation of remote access tools like 'AnyDesk' on a server may indicate a heightened risk compared to standard workstations.

  - **Compare against known good: ** Cross-reference the application installations against an approved software list for your organization. Determine if similar applications have a documented use case within the organization, which might justify their presence on the systems in question.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential for high-risk applications to facilitate unauthorized access or compromise sensitive data. These applications are often weaponized in attacks, making them a target for adversarial behavior, thus warranting timely investigations.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as code obfuscation or repackaging of legitimate applications. Reliable detection requires proper logging configurations to ensure Event ID 28115 is captured, as some environments may not log all relevant events. Legitimate administrative installations of similar applications may trigger alerts, necessitating thorough validation. A related detection to enhance coverage could involve monitoring for the specific execution of these applications to catch in-progress malicious activity.

