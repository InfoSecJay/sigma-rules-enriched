  ### Technical Context

  This Sigma rule detects instances where the OpenSSH server (sshd) is enabled and starts listening for SSH connections on a socket. This behavior is often indicative of an attacker attempting to establish command and control (C2) to remotely access the system. The relevant MITRE ATT&CK tactic is **Lateral Movement**, specifically technique **T1021.004: Remote Service: SSH**.

  The primary telemetry source for this detection is the OpenSSH logs, specifically Event ID 4, which indicates the server's listening event. If malicious, this can lead to unauthorized remote access, data theft, or further lateral movement within the network. However, this detection does NOT confirm that the activity is malicious, as it may also result from legitimate administrative actions.

  ### Investigation Steps

  - **Check recent Event ID 4 logs**: Look for Event ID 4 entries in the OpenSSH log (located in Application Event Log). Events should show the process `sshd` with a payload starting with 'Server listening on '. Expected benign behavior is periodic checks or administrative tasks by users with proper privileges.

  - **Correlate with user activity**: Review security event logs (Event ID 4624 for logins and Event ID 4672 for special privileges) to correlate the timing of the listening event with user logins. Ensure that the initiating user has legitimate admin privileges.

  - **Identify high-confidence malicious indicators**: Look at the timestamp and process creation events (Event ID 4688 or Sysmon ID 1) related to `sshd.exe` to check for abnormal patterns such as unexpected service starts, particularly after hours or from unusual accounts.

  - **Examine network connections**: Use network monitoring tools to verify active connections on port 22 (default SSH port). Identify any anomalous IP addresses connecting to the host running `sshd`—particularly from external, untrusted networks.

  - **Check for recent changes in service configuration**: Validate if the OpenSSH service was enabled recently, using Services logs, System Event ID 7045. Legitimate administrators may enable it for valid needs, but a sudden change could indicate potential malicious activity.

  - **Review asset criticality**: Assess the host where the OpenSSH server is running. If it is a critical or sensitive system, elevate the priority for investigation, as a compromised host could lead to significant impact.

  ### Prioritization

  This alert holds medium severity due to the potential impact on system integrity and the likelihood of being weaponized for access and lateral movement by adversaries. The specific setup of an SSH server can be abused for unauthorized access, making it a significant concern in a matured enterprise environment.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques such as disabling logging or altering configurations to hide SSH activity. Reliable detection requires OpenSSH logging to be properly enabled and monitored. Legitimate activities, such as an administrator enabling the SSH server for remote access purposes, may trigger the alert. A related detection for better coverage includes monitoring for suspicious command executions via SSH sessions, which can highlight malicious sessions established after the server starts listening.

