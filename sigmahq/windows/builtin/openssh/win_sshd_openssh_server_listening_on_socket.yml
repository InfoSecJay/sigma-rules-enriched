  ### Technical Context
  This rule detects the activation of the OpenSSH server on a Windows system, specifically when it starts listening for SSH connections. An attacker may enable the OpenSSH service to gain unauthorized remote access to a system, allowing for potential lateral movement within the network. The attacker may aim to exploit this access to escalate privileges, exfiltrate sensitive data, or deploy additional malicious payloads.

  Relevant MITRE ATT&CK techniques include **T1021.004: Remote Service SSH**, which focuses on leveraging SSH for unauthorized remote access. Additionally, this behavior aligns with the tactic of **Lateral Movement**, indicating attempts to move across the network once initial access is gained. The primary data sources for this detection will be Windows event logs, particularly those related to the OpenSSH service.

  ### Investigation Steps
  - **Review OpenSSH Event Logs:** Analyze EventID 4 from the Windows OpenSSH logs to confirm if the SSH server is listening on the expected port, noting the timestamp and originating process.
  - **Check for Unusual Network Activity:** Examine network traffic logs for unexpected inbound connections or communication patterns, particularly from unfamiliar external IP addresses targeting the SSH listening port.
  - **Audit User Activity:** Investigate recent administrative actions to determine if legitimate changes were made to the OpenSSH service. Look for any sudden changes in user permissions or group memberships.
  - **Analyze Process and Service States:** Use process monitoring tools to verify whether the OpenSSH service was recently started and cross-reference against known legitimate activities to identify any anomalies.

  ### Prioritization
  The alert's severity is medium due to the potential for an attacker to establish a foothold in the environment through the OpenSSH service, enabling lateral movement and access to sensitive resources. Quick response is essential to mitigate the risk of escalation.

  ### Blind Spots and Assumptions
  This detection rule may not cover scenarios where the OpenSSH service is enabled by legitimate users or for authorized administrative purposes, leading to potential false positives. It assumes that OpenSSH logs are configured correctly and that relevant Windows event logging is enabled on the target systems. Ensuring the presence of comprehensive logs is crucial, as lack of visibility into unauthorized service changes may hinder detection effectiveness.

