title: Standard User In High Privileged Group
id: 7ac407cc-0f48-4328-aede-de1d2e6fef41
status: test
description: Detect standard users login that are part of high privileged groups
  such as the Administrator group
references:
- https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
- https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection
- https://github.com/nasbench/EVTX-ETW-Resources/blob/7a806a148b3d9d381193d4a80356016e6e8b1ee8/ETWProvidersManifests/Windows11/22H2/W11_22H2_Pro_20221220_22621.963/WEPExplorer/LsaSrv.xml
author: frack113
date: 2023-01-13
modified: 2023-05-05
tags:
- attack.credential-access
- attack.privilege-escalation
logsource:
  product: windows
  service: lsa-server
  definition: 'Requirements: Microsoft-Windows-LSA/Operational (199FE037-2B82-40A9-82AC-E1D46C792B99)
    Event Log must be enabled and collected in order to use this rule.'
detection:
  selection:
    EventID: 300
    TargetUserSid|startswith: 'S-1-5-21-'     # Standard user
    SidList|contains:
    - 'S-1-5-32-544'            # Local admin
    - '-500}'                   # Domain admin
    - '-518}'                   # Schema admin
    - '-519}'                   # Enterprise admin
  filter_main_admin:
    TargetUserSid|endswith:
    - '-500'                   # Domain admin
    - '-518'                   # Schema admin
    - '-519'                   # Enterprise admin
  condition: selection and not 1 of filter_main_*
falsepositives:
- Standard domain users who are part of the administrator group. These users 
  shouldn't have these right. But in the case where it's necessary. They should 
  be filtered out using the "TargetUserName" field
level: medium
note: |
  ### Technical Context

  This Sigma rule detects logins of standard users who are members of high-privileged groups, specifically targeting events where standard users authenticate against the Local Security Authority (LSA) while being part of administrative groups. The likely objective of an attacker triggering this alert is to gain unauthorized access or escalate privileges within the network. This behavior fits within the MITRE ATT&CK framework under the tactic of Credential Access (TA0006) and the technique of Exploiting User Credentials (T1075).

  The primary telemetry source for this alert is the Microsoft-Windows-LSA/Operational Event Log, specifically capturing Event ID 300, which provides information on login attempts and the roles associated with the user accounts. If malicious, this activity may lead to unauthorized administrative access, potentially compromising sensitive systems and data. It is important to note that this detection does NOT confirm malicious intent, as there could be legitimate use cases for standard users having access to high-privileged groups.

  ### Investigation Steps

  - **Identify Event Context:** Review Event ID 300 from the Microsoft-Windows-LSA/Operational log. Confirm details such as “TargetUserSid” and “SidList” for any standard users logging in and their associated group memberships.

  - **Check User Necessity:** Verify the necessity of standard users being in high-privileged groups by cross-referencing the “TargetUserName” field with internal access control policies.

  - **Correlate Login Timing:** Compare the timestamp of the logged event against known scheduled maintenance or administrative tasks to distinguish potential legitimate activity from malicious logins.

  - **Examine Login Behavior:** Determine if the standard user performed any high-privilege actions immediately after logging in, such as creating or modifying critical files (check for subsequent Event ID 4663).

  - **Look for Group Membership Changes:** Investigate any recent changes to the group memberships of the affected user in Active Directory via Security Event ID 4728 (adding a member to a group) or 4729 (removing a member from a group).

  ### Prioritization

  This alert is of **medium severity** due to the potential risk associated with unauthorized access to administrative privileges. The impact depends on the criticality of the affected system; if compromised, it could result in widespread security breaches. The likelihood of malicious abuse is moderate, particularly if the activity patterns exhibit deviation from expected user behavior.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for the Microsoft-Windows-LSA/Operational Event Log to be enabled and correctly configured. Legitimate administrative actions might trigger the alert, especially during maintenance periods when standard users are granted temporary elevated rights. Review of associated detections, such as Event ID 4663, can enhance coverage and context regarding actions taken after the login event.

