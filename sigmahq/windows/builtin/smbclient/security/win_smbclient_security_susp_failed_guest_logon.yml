  ### Technical Context

  This Sigma rule detects failed SMB guest logon attempts targeting Windows systems, specifically focusing on circumstances indicative of the PrintNightmare vulnerability (CVE-2021-1675). The behavior suggests that an attacker might be attempting to exploit SMB for unauthorized access or execute malicious commands through the Windows Print Spooler service. The relevant MITRE ATT&CK technique identified is Credential Access via Brute Force (T1110.001).

  The primary telemetry source for this detection is Windows Security logs, particularly focusing on Event ID 31017, which captures failed logon attempts over the SMB protocol. If malicious, this behavior could allow an attacker to gain unauthorized access to sensitive systems, potentially leading to data exfiltration or lateral movement. However, this detection does NOT confirm successful exploitation or actual command execution; it merely indicates that an unauthorized access attempt was made.

  ### Investigation Steps

  - **Check Event ID 31017 for failed logon details**: Review Security Event logs for Event ID 31017. Note the 'UserName' field; a blank username indicates a logon attempt using the default guest account.

  - **Identify the source IP of the logon attempt**: Investigate the source IP noted in the Event ID 31017 log to determine if it is recognized within your environment. Compare to known and trusted entities.

  - **Assess historical logon attempts from the same IP**: Cross-reference the logs for additional failed logon attempts from the same source over time—high frequency may indicate malicious intent.

  - **Document any legitimate activity**: Look for legitimate guest logins in the Security Event logs. Check if there are valid, infrequent guest access attempts in connection with internal workflows (e.g., maintenance, testing) on systems where guest access is expected.

  - **Validate network configuration for unexpected exposure**: Confirm that SMB services are not exposed externally on the network, which could facilitate external brute force attacks. Check firewall and network configuration logs.

  - **Identify any successful logon transitions**: Investigate subsequent access attempts following the failed logons. Look in logs for changes in Event IDs that might suggest the attacker has gained further access (e.g., Event ID 4624).

  ### Prioritization

  This alert should be considered medium-severity due to the risk associated with failed guest logon attempts, which may indicate a precursor to exploitation of the Print Spooler vulnerability. The exploit has a history of being weaponized, elevating its significance in environments where SMB may be externally accessible.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion techniques like IP whitelisting or suppression of failed logon events by attackers. Environment-specific configurations may also be necessary for reliable detection, as not all organizations log failed guest access attempts. Legitimate activities may trigger this alert, including automated scripts or legitimate testing scenarios involving guest accounts. A companion detection alert for successful logon attempts (Event ID 4624) should be established to provide visibility on potential escalations post-failure.

