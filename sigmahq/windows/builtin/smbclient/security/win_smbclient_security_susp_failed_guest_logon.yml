note: |
  ### Technical Context
  This rule detects suspicious rejected SMB (Server Message Block) logons that occur from guest accounts, indicating potential exploitation attempts of the PrintNightmare vulnerability (CVE-2021-1675). The PrintNightmare vulnerability involves remote code execution via the Windows Print Spooler service, allowing attackers to execute malicious code remotely by exploiting the service's inherent weaknesses. A rejected logon from an unauthorized or guest account could suggest reconnaissance activities or an attempt to gain unauthorized access, which is aligned with various credential access tactics used by attackers.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Credential Access** (TA0006)
  - **Brute Force** (T1110.001)

  The primary data sources for detecting these events are Windows Security Event Logs, particularly those that log SMB-related activities, including Event ID 31017 for the SMB service.

  ### Investigation Steps
  - **Collect Logs**: Retrieve Windows Security Logs focusing on Event ID 31017 to gather details about the rejected logon attempts, including timestamps and originating IP addresses.
  - **Analyze Failed Logins**: Investigate the specific guest account usage, looking for patterns or repeated attempts that may indicate brute force activity or an automated exploit attempt.
  - **Inspect Source IP**: Cross-reference the originating IP address against known threat intelligence sources for any associations with malicious activity, including previously reported IPs linked to PrintNightmare attacks.
  - **Review System and Network Activity**: Check for unusual network traffic patterns or system behaviors surrounding the time of the rejected logons, especially any interactions with the Windows Print Spooler.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential for escalation from rejected logon attempts to successful exploitation of vulnerable systems, which could lead to significant threats in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where SMB logging is not enabled or where alerts may be overwhelmed by legitimate guest account usage, leading to false negatives. The detection logic assumes that logs generated by the SMB service are consistently monitored and that the environment is configured to capture SMB authentication events accurately. Additionally, environments without proper segmentation of administrative and guest accounts might see increased noise in these logs.

