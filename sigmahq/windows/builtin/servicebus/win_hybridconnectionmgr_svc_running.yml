  ### Technical Context

  This Sigma rule detects the execution of the Hybrid Connection Manager service on Windows endpoints, specifically looking for Event IDs: 40300, 40301, and 40302. The behavior detected may indicate unauthorized persistence mechanisms set by an attacker aiming to create a covert channel for command and control (C2) or data exfiltration. This aligns with the MITRE ATT&CK tactic of Persistence (T1554) as attackers might use this service to maintain access after initial compromise.

  Primary telemetry sources include Windows event logs specific to the Hybrid Connection Manager service. The potential security impact is significant, as it could facilitate data leakage or unauthorized remote access if malicious. Importantly, this detection does not confirm malicious intent on its own, as legitimate applications and services can also utilize Hybrid Connection Manager.

  ### Investigation Steps

  - **Review relevant event logs:** Check Windows Event ID 40300, 40301, and 40302 in the Security and Application logs to identify if the Hybrid Connection Manager is running or being manipulated. Look for specific fields indicating service status or configuration changes.

  - **Identify authorized usage:** Determine if the Hybrid Connection Manager is expected to be running based on your organization’s Azure service integrations. Confirm legitimate applications utilizing this service, such as Azure Function Apps, to differentiate benign context.

  - **Check network connections:** Investigate outbound connections related to 'sb://' or 'servicebus.windows.net' using Windows Firewall logs (Event ID 5156) or other network monitoring tools to establish if unexpected data flows correlate with the Hybrid Connection Manager execution.

  - **Validate the service's lifecycle:** Monitor the creation and execution of the Hybrid Connection Manager service via Sysmon Event ID 7045 (Service Creation), noting when it was started and who initiated it. Legitimate startups should have clear attribution to authorized applications.

  - **Examine associated command history:** Analyze PowerShell command logs (Event ID 4104) for suspicious scripts that may register or manipulate the Hybrid Connection Manager, looking for evidence of obfuscation or unusual execution patterns.

  ### Prioritization

  The alert carries high severity due to the potential for adverse impact on critical systems, as the Hybrid Connection Manager can facilitate external connections and data exfiltration. The likelihood of malicious abuse is significant, given that this service can be weaponized by adversaries for persistence and data loss. As a commonly utilized part of Azure integrations, any unauthorized usage should be treated with urgency.

  ### Blind Spots and Assumptions

  This detection may miss attempts to disable or manipulate the service if log configurations don't capture all requisite event IDs. Furthermore, some legitimate business processes may trigger this alert if they involve Azure integrations. It's important to monitor related behaviors, such as abnormal outbound traffic through the service bus, to enhance coverage of persistence techniques related to Azure environments.

