  ### Technical Context

  This Sigma rule detects the installation of Exchange Transport Agents via the PowerShell command `Install-TransportAgent`. Such behavior is commonly associated with adversaries aiming to establish persistence in Exchange environments, facilitating unauthorized access or data exfiltration through email. The relevant MITRE ATT&CK tactic is **Persistence** (T1505.002).

  The primary telemetry sources for this detection include Windows event logs related to PowerShell execution and the Exchange Management Shell, particularly tracking commands executed within the Exchange Management framework. If malicious, this could lead to various impacts, including the compromise of entire email communications and dissemination of malware. It is critical to note that this detection does NOT confirm that malicious intent is present without additional context; legitimate installations of Transport Agents are common, especially during system administration.

  ### Investigation Steps

  - **Review PowerShell logs for command execution:** Check Security Event ID 4688 for the execution of `powershell.exe` with the command line containing `Install-TransportAgent`. Validate whether the installation is consistent with known admin activity.
  - **Examine AssemblyPath for context:** Investigate Exchange logs to see the AssemblyPath of the newly installed Transport Agent. A path associated with known benign installation sources may indicate legitimate activity.
  - **Identify the creator of the Transport Agent:** Assess the user or service account that executed the command. Authorized admin accounts performing the action may reduce the likelihood of malign intent.
  - **Correlate with other suspicious activity:** Look into recent logs for other Exchange Management Shell commands (e.g., Event ID 400, `Update-TransportAgent`) executed by the same user/process. A chain of anomalous commands could indicate deception.
  - **Check for unauthorized changes in Transport Agent configuration:** Validate whether there are any unexpected modifications in the Transport Agent settings or if new/unrecognized agents have been installed.
  - **Review maintenance windows:** Verify if the installation aligns with approved maintenance windows or administrative schedules to gauge legitimacy.

  ### Prioritization

  This alert should be treated with medium priority. While the impact of a compromised Exchange system can be significant, the likelihood of abuse is moderate since Transport Agent installations can occur during routine administrative tasks, leading to potential false positives.

  ### Blind Spots and Assumptions

  There could be legitimate activities, such as updates or maintenance, that trigger this rule and may lead to false positives. It’s vital to ensure that adequate logging configurations are in place for PowerShell and Exchange actions to capture all potential installations accurately. Additionally, related detections concerning PowerShell scripts (e.g., suspicious command execution via PowerShell) can enhance coverage against this tactic.

