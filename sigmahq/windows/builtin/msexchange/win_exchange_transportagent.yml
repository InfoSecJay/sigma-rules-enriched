  ### Technical Context
  This detection rule identifies the installation of a Microsoft Exchange Transport Agent, a process that can be leveraged by threat actors to persistently maintain access to an environment. The primary goal of this kind of activity is often to manipulate or intercept email communication, facilitate data exfiltration, or establish a foothold for further malicious activities within the organization. Properly managing Exchange Transport Agents is crucial to maintaining the integrity and confidentiality of email communications.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence** (T1053): The installation of a Transport Agent can facilitate persistence within the Exchange Server environment.
  - **Malicious Additions** (T1505.002): This technique covers the malicious installations of components such as Exchange Transport Agents to enable ongoing access and control over the email system.

  The most pertinent data sources for detecting this type of activity would include Microsoft Exchange Management logs, specifically focusing on installation commands and events tied to the Exchange server management processes.

  ### Investigation Steps
  - **Review Exchange Management Logs**: Collect and examine logs related to the Exchange Management service to identify any unauthorized instances of the `Install-TransportAgent` command.

  - **Assess Assembly Path**: Investigate the `AssemblyPath` of the installed Transport Agents to distinguish between legitimate and potentially malicious installations. Suspicious paths could indicate unauthorized changes.

  - **Check for Unusual Patterns**: Look for signs of unusual patterns in the installation activity, such as unexpected agent installations during off-hours or from non-administrative accounts.

  - **Correlate with User Activity**: Correlate the installation events with user activity logs to identify any anomalous behaviors leading up to the installation, helping to establish intent.

  ### Prioritization
  The alert is of medium severity due to the potential for significant impact on the security of email communications and systems. Factors such as the specialist nature of Exchange servers and their critical role in enterprise operations increase the likelihood that such activity could indicate a serious security incident.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the ability to identify all forms of legitimate installations of Transport Agents, particularly those conducted during standard maintenance windows. Assumptions made by the detection logic include that the presence of the `Install-TransportAgent` command inherently signifies malicious intent, not accounting for legitimate administrative actions. Additionally, comprehensive logging must be enabled on the Exchange Management service for effective detection, and organizations must ensure they have the necessary configurations in place to capture these important events.

