  ### Technical Context

  This Sigma rule detects the setting of the `OabVirtualDirectory` `ExternalUrl` property to a script in Microsoft Exchange Management logs. This behavior typically indicates an attempt by an attacker to manipulate the offline address book (OAB) feature to redirect clients to a malicious script, potentially facilitating information theft or further exploitation. Relevant MITRE ATT&CK tactics include Persistence (TA0003) and the technique of OabVirtualDirectory Manipulation (T1505.003). The primary telemetry sources involve Microsoft Exchange Management logs, which capture commands executed in the Exchange Management Shell, specifically focusing on Event IDs corresponding to command execution. If this action is malicious, it can lead to severe security impacts, such as data exfiltration and compromise of user information. However, this detection does NOT confirm that the script is executed or that exploitation has occurred.

  ### Investigation Steps

  - **Verify Command Context**: Review the Exchange Management logs for `Set-OabVirtualDirectory` command, specifically looking at Event ID 4000 in Exchange logs. Check the timestamp and user account used for the command execution to ensure it aligns with authorized administrative tasks.

  - **Determine User Legitimacy**: Cross-reference the executing user against Active Directory. Legitimate administrative accounts often have specific roles and responsibilities. Look for unusual usage patterns or accounts outside business hours.

  - **Check External URL Value**: Identify the specific URL being set in the `ExternalUrl` property. Malicious indicators include any URL that points to a suspicious or unrecognized domain, especially those that involve scripts (e.g., endings like `.js`, `.php`, or `.asp`).

  - **Monitor for Subsequent Malicious Activity**: After detecting this event, monitor for any unusual network activity related to the manipulated OAB, such as external connections or unauthorized data retrieval (e.g., utilizing Security Event ID 5154 for network connection logs).

  - **Examine Exchange Configuration**: Analyze `Get-OabVirtualDirectory` output to ensure no other settings are compromised. Legitimate changes will often leave no scripts and should point to standard internal or external URLs (e.g., `https://mail.company.com/oab`).

  ### Prioritization

  This alert is high severity due to the critical role of Microsoft Exchange in enterprise communications. The ability to manipulate OAB settings for malicious purposes is a recognized attack path and can lead to significant data breaches. Given the impact of affected systems and potential for exploitation, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by logging configurations; ensure that Exchange Management logging is properly enabled to capture all relevant configurations. Evasion techniques may include using legitimate administrator accounts that normally invoke such commands, complicating the identification of malicious actions. Additionally, routine administrative tasks may trigger this alert, particularly during maintenance windows when changes are expected. Companion detections, such as monitoring for unusual execution of scripts from URL calls related to OAB requests, can strengthen coverage against these types of attacks.

