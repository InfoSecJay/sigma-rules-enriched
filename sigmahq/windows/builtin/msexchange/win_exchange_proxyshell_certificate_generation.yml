title: Certificate Request Export to Exchange Webserver
id: b7bc7038-638b-4ffd-880c-292c692209ef
status: test
description: Detects a write of an Exchange CSR to an untypical directory or 
  with aspx name suffix which can be used to place a webshell
references:
- https://twitter.com/GossiTheDog/status/1429175908905127938
author: Max Altgelt (Nextron Systems)
date: 2021-08-23
modified: 2023-01-23
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  keywords_export_command:
    '|all':
    - 'New-ExchangeCertificate'
    - ' -GenerateRequest'
    - ' -BinaryEncoded'
    - ' -RequestFile'
  keywords_export_params:
  - '\\\\localhost\\C$'
  - '\\\\127.0.0.1\\C$'
  - 'C:\\inetpub'
  - '.aspx'
  condition: keywords_export_command and keywords_export_params
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This rule detects the export of a Certificate Signing Request (CSR) to atypical directories or with file extensions commonly associated with web application vulnerabilities, such as `.aspx`. The likely attacker objective is to store a web shell or malicious file on an Exchange server, which can enable persistent access to the environment. This behavior corresponds to the MITRE ATT&CK tactic of Persistence and the technique T1505.003 (Web Shell). Primary telemetry sources include logs from the msexchange-management service, specifically monitoring for PowerShell commands and their output related to certificate generation. If malicious, this could allow an attacker to exploit the web server for further attacks or data exfiltration. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may result in similar log entries.

  ### Investigation Steps

  - **Review PowerShell command logs:** Check logs from Event ID 4104 for `New-ExchangeCertificate` with parameters `-GenerateRequest -BinaryEncoded -RequestFile` being executed, focusing on the context of their execution.

  - **Analyze file paths for anomalies:** Investigate any export locations, looking for exports to `C:\inetpub` or network shares like `\\localhost\C$` or `\\127.0.0.1\C$`. Legitimate activity should primarily involve default save locations within the Exchange server’s directory structure.

  - **Identify unusual file extensions:** Search for `.aspx` files created in the exported path. File creation timestamps and paths can help distinguish between standard administrative workflows and potential malicious file placement.

  - **Correlate with historical context:** Check for similar commands in recent logs to identify patterns or repeated attempts. Look for additional Event ID 4104 entries that cluster around the same time frame.

  - **Inspect file access permissions:** Validate the security properties of any anomalous exports. Legitimate CSR exports should only be accessible by authorized admin accounts; any unauthorized access indicators could signify malicious activity.

  - **Query related logs for concurrent suspicious activity:** Review IIS logs and any other related web server logs (e.g., Event ID 5145 for file creation) that may signal attempts to execute or access the maliciously created file.

  ### Prioritization

  Given the critical nature of Exchange servers to enterprise operations, this alert warrants immediate attention. The likelihood of malicious abuse is significant, especially if the activity coincides with known exploitation techniques for web shells. This behavior is known to be weaponized, making it a high-priority security concern.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion via timestamp manipulations or obfuscated PowerShell scripts. Reliable detection requires proper logging configurations for PowerShell command auditing. Legitimate certificate exports for internal applications might trigger this alert, particularly if they utilize atypical export paths. A related detection to consider is abnormal usage of scheduled tasks (T1053.003) on the Exchange server, which may indicate an attacker attempting to execute payloads.

