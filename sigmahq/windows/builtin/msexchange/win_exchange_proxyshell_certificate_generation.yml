title: Certificate Request Export to Exchange Webserver
id: b7bc7038-638b-4ffd-880c-292c692209ef
status: test
description: Detects a write of an Exchange CSR to an untypical directory or with
  aspx name suffix which can be used to place a webshell
references:
- https://twitter.com/GossiTheDog/status/1429175908905127938
author: Max Altgelt (Nextron Systems)
date: 2021-08-23
modified: 2023-01-23
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  keywords_export_command:
    '|all':
    - 'New-ExchangeCertificate'
    - ' -GenerateRequest'
    - ' -BinaryEncoded'
    - ' -RequestFile'
  keywords_export_params:
  - '\\\\localhost\\C$'
  - '\\\\127.0.0.1\\C$'
  - 'C:\\inetpub'
  - '.aspx'
  condition: keywords_export_command and keywords_export_params
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies the export of a Certificate Signing Request (CSR) to an atypical directory or with an .aspx suffix on a Microsoft Exchange server. Such behavior can indicate an attacker’s attempt to generate a CSR with the intent of deploying a malicious web shell, thereby gaining unauthorized access and control over the web server environment. Attackers may leverage this technique to persist within the network, exfiltrate data, or facilitate further exploitation of other systems.

  The rule is linked to the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (TA0003) and the technique **Web Shells** (T1505.003). The misuse of Exchange servers for certificate exports is critical, as it can directly lead to unauthorized web access, posing significant security risks.

  Primary data sources for this detection include logs from the Microsoft Exchange management service, specifically those related to Exchange command execution. This could encompass logs of PowerShell command executions that align with the activity of creating and exporting CSRs.

  ### Investigation Steps
  - **Review Exchange Management Logs:** Examine logs from the Exchange management service for the `New-ExchangeCertificate` command usage, focusing on timestamps and user accounts involved in the command execution.
  - **Inspect Exported Files:** Investigate the destination directories mentioned in the detection logic, notably those with .aspx file extensions or common web directories, looking for newly created certificates or files that may indicate malicious web shell placement.
  - **Analyze User Privileges:** Check the permissions and roles of users executing the commands, especially if they are not typical administrators, to uncover potential misuse of credentials or compromised accounts.
  - **Monitor for Remote Access:** Look for unusual network connections, particularly those leveraging SMB protocol or remote access to the Exchange server, to identify potential command and control (C2) or exfiltration attempts related to the CSR export.

  ### Prioritization
  This alert is deemed critical due to the potential impact of an attacker successfully deploying a web shell on an Exchange server, which could allow for extensive compromise of organizational data and services. The likelihood is elevated given the increasing targeting of web-accessible services by threat actors.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the configurations of the Exchange management logging settings, which must be enabled to gather comprehensive logs. There is an assumption that any user executing the `New-ExchangeCertificate` command is doing so legitimately, and deviations from normal operational behavior are not accounted for without adequate baselining. Additionally, the rule may miss manual attempts to export CSRs directly through the file system or via alternate command paths if those executions do not match the defined keywords in this detection logic.

