title: ProxyLogon MSExchange OabVirtualDirectory
id: 550d3350-bb8a-4ff3-9533-2ba533f4a1c0
status: test
description: Detects specific patterns found after a successful ProxyLogon exploitation
  in relation to a Commandlet invocation of Set-OabVirtualDirectory
references:
- https://bi-zone.medium.com/hunting-down-ms-exchange-attacks-part-1-proxylogon-cve-2021-26855-26858-27065-26857-6e885c5f197c
author: Florian Roth (Nextron Systems)
date: 2021-08-09
modified: 2023-01-23
tags:
- attack.t1587.001
- attack.resource-development
logsource:
  product: windows
  service: msexchange-management
detection:
  keywords_cmdlet:
    '|all':
    - 'OabVirtualDirectory'
    - ' -ExternalUrl '
  keywords_params:
  - 'eval(request'
  - 'http://f/<script'
  - '"unsafe"};'
  - 'function Page_Load()'
  condition: keywords_cmdlet and keywords_params
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This rule detects post-compromise actions associated with the ProxyLogon vulnerabilities affecting Microsoft Exchange servers (CVE-2021-26855, CVE-2021-26858). Specifically, it identifies patterns related to the invocation of the `Set-OabVirtualDirectory` commandlet, which is commonly leveraged by attackers to modify the Offline Address Book (OAB) configuration in Exchange. This modification can facilitate further exploitation by allowing attackers to host malicious scripts and manipulate user data.

  The threat scenario primarily involves attackers who exploit the ProxyLogon vulnerabilities to gain initial access and then use the `Set-OabVirtualDirectory` to craft responses that could lead to remote code execution on clients. The likely attacker objectives are to maintain persistence within the compromised environment, harvest user credentials, or deploy additional payloads.

  Relevant MITRE ATT&CK tactics and techniques include **Initial Access (TA0001)** via exploitation of vulnerabilities (T1203), and **Resource Development (TA0002)** through the modification of OAB settings (T1587.001). The primary data sources for this detection include Microsoft Exchange management logs, especially those that record commandlet invocations and any associated parameters.

  ### Investigation Steps
  - **Review Exchange Management Logs**: Check logs for any instances of `Set-OabVirtualDirectory` commandlet usage and the associated parameters that follow it. Pay particular attention to any unusual or malicious URLs that could indicate an attempt to deliver malware.

  - **Analyze Network Traffic**: Look for outbound connections from the Exchange server following the commandlet execution. Investigate any suspicious requests that align with the identified parameters, especially those containing `eval(request` or similar patterns.

  - **Examine User Account Activity**: Analyze activities related to user accounts that may have been targeted as part of the campaign, including any unusual patterns of access or changes to user details that could indicate credential harvesting.

  - **Correlate with Known Threat Intelligence**: Cross-reference any findings with current threat intelligence to identify if similar tactics have been used in other incidents, particularly focusing on the ProxyLogon exploitation attempts and associated commandlet manipulation.

  ### Prioritization
  The critical severity of this alert stems from the potential impact of compromised Exchange servers, which can lead to widespread information theft and unauthorized access across the enterprise environment. Given the likelihood of exploitation and the severity of the vulnerabilities involved, timely investigation and response are essential.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the Exchange management logs are incomplete or if logging is not appropriately configured to capture commandlet executions. The detection logic assumes that command executions occur in a manner consistent with the patterns identified in the rule; however, advanced attackers may obfuscate their activities. Effective detection relies on proper logging levels for the Exchange Management service, and logs from non-administrative accounts may not be fully captured.

