title: Failed MSExchange Transport Agent Installation
id: c7d16cae-aaf3-42e5-9c1c-fb8553faa6fa
status: test
description: Detects a failed installation of a Exchange Transport Agent
references:
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=8
author: Tobias Michalski (Nextron Systems)
date: 2021-06-08
modified: 2022-07-12
tags:
- attack.persistence
- attack.t1505.002
logsource:
  service: msexchange-management
  product: windows
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
  selection:
    EventID: 6
    Data|contains: 'Install-TransportAgent'
  condition: selection
falsepositives:
- Legitimate installations of exchange TransportAgents. AssemblyPath is a good 
  indicator for this.
level: high
note: |
  ### Technical Context

  This rule detects failed attempts to install a Microsoft Exchange Transport Agent, indicated by Event ID 6 with a specific data field containing the term 'Install-TransportAgent'. This behavior typically signifies an adversarial attempt to establish persistence through the malicious use of Exchange Transport Agents to intercept or manipulate email communications. The relevant MITRE ATT&CK technique is Persistence via Microsoft Exchange (T1505.002).

  Primary telemetry sources include Windows Event Logs specifically from the MSExchange Management service. If malicious, successful installation of unauthorized transport agents could lead to data exfiltration or unauthorized access to communications. This detection does NOT confirm a successful compromise on its own, as it merely highlights attempts that ultimately failed.

  ### Investigation Steps

  - **Examine Event ID 6 details:** Check Windows Event Logs for Event ID 6 from the MSExchange Management source. Review the `AssemblyPath` field to assess whether this failed installation originated from a legitimate source or is suspicious.

  - **Identify unusual user accounts:** Review the user account associated with the failed installation attempt. If the account has no documented role in Exchange management, this might indicate malicious activity. Look for correlation in Security Event ID 4624 (logon events).

  - **Analyze `Data` field contents:** Inspect the `Data` field in captured events for anomalies or known malicious strings. Check for other command arguments that may indicate non-standard behavior.

  - **Determine legitimate installation patterns:** Understand the expected process for Transport Agent installations in your environment. Installation processes typically originate from specific administrative accounts during scheduled maintenance or updates.

  - **Cross-reference with Security Incident Logs:** Correlate failed installation events with other security incident logs for suspected indicators of compromise from related events. Check for other potentially malicious activities occurring around the same timeframe.

  - **Enable additional logging if necessary:** Ensure that auditing for Exchange Management actions is properly configured to capture additional details on future installation attempts. This might involve enabling verbose logging for Exchange components to collect more telemetry.

  ### Prioritization

  The alert is classified as high severity due to its potential impact on the Exchange server, which is critical for organizational communications. The likelihood of malicious abuse is elevated, as adversaries often target Exchange systems for persistence and data manipulation activities. The technique noted is commonly weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via legitimate installation actions that may inadvertently trigger the alert; therefore, proper logging configurations are crucial. Legitimate maintenance operations or updates could trigger this alert, leading to false positives. Companions to this detection include alerts for successful Transport Agent installations to enhance threat coverage by establishing a baseline for normal activities.

