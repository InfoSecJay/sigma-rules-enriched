  for this.
level: high
note: |
  ### Technical Context
  This detection rule identifies failed installations of Exchange Transport Agents on Microsoft Exchange servers. The suspected threat scenario involves an adversary attempting to install malicious transport agents as a means of establishing persistence on the targeted environment. By exploiting the vulnerabilities within the Exchange server, attackers may aim to intercept or manipulate email traffic, thereby gaining unauthorized access to sensitive information.

  The relevant MITRE ATT&CK tactics associated with this detection are "Persistence" and the technique "Install Application" (T1505.002). This technique can be leveraged by attackers to maintain access to a compromised system even after initial entry has been detected and remediated. Primary data sources for this alert include Exchange server logs specifically related to administrative actions and system events, such as logs from the msexchange-management service.

  ### Investigation Steps
  - **Review Event Logs**: Examine the EventID 6 logs from the Exchange server to confirm failed installation attempts and gather contextual information about the installation process.
  - **Analyze Assembly Paths**: Check the AssemblyPath associated with the failed transport agent installation to differentiate between legitimate and potentially malicious activities.
  - **Monitor SMTP Traffic**: Investigate email traffic patterns and anomalies that could indicate unauthorized email manipulation or interception due to the presence of a rogue transport agent.
  - **Cross-Reference with Change Management**: Verify any legitimate change requests or documented installations to rule out false positives from authorized administrative actions.

  ### Prioritization
  This alert carries high severity due to the potential for significant impacts on email security and the overall integrity of the organization's communications infrastructure. The likelihood of exploitation in environments using Exchange makes it a critical detection point.

  ### Blind Spots and Assumptions
  One key gap in detection coverage is the possibility of successful installations of malicious transport agents that do not exhibit failed installation logs. The detection logic assumes that failed attempts are indicative of an unauthorized action; however, legitimate administrative activities may also trigger this alert. Additionally, effective monitoring requires proper configuration of Exchange logs and may necessitate integrating with existing SIEM systems to correlate events appropriately.

