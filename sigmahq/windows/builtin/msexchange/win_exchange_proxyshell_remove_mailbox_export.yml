note: |
  ### Technical Context
  This rule detects the removal of an exported mailbox in an Exchange web server environment. The specific command of interest is `Remove-MailboxExportRequest`, used to delete mailbox export requests that may have been created during a data exfiltration attempt or as part of an attacker's effort to conceal their tracks following the exploitation of the ProxyShell vulnerability. The focus on this activity is critical, as it may indicate an attempt to cover up unauthorized actions performed against the Exchange server.

  The threat scenario typically involves an attacker who has exploited vulnerabilities in the Exchange server, in particular, the ProxyShell exploit, to gain credentials and possibly export mailbox data. Once the attacker has achieved their goals, one objective may be to delete evidence of their actions, including exported mailbox requests. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (TA0005) and **Indicator Removal on Host** (T1070), as the action of removing mailbox exports directly correlates with efforts to minimize traces of malicious activities.

  Primary data sources that provide the best evidence in this case are logs from the **Microsoft Exchange Management** service, specifically focusing on PowerShell command logs that record administrative operations performed within the Exchange environment.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check the logs for entries related to `Remove-MailboxExportRequest` to identify if any suspicious or unauthorized commands were executed.
  - **Analyze User Context:** Investigate the context of the user account that executed the removal command; ensure the account was authorized for such actions and has proper operational scope.
  - **Inspect Recent Mailbox Export Requests:** Examine recent mailbox export requests logged prior to the deletion to ascertain which mailboxes were being accessed and if the requests appear legitimate.
  - **Correlate with Other Indicators:** Look for other suspicious activities such as unusual login attempts, failed authentication logs, or patterns indicative of lateral movement or privilege escalation that might suggest the presence of an ongoing attack.

  ### Prioritization
  This alert should be treated with high priority due to the potential impact on data confidentiality and integrity. The likelihood of an attack correlating to the removal of mailbox exports following the ProxyShell exploit is significant, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detecting all instances of mailbox removal if certain PowerShell logging configurations are not enabled or if logs are not retained long enough for forensic analysis. The detection logic assumes that any removal of mailbox export requests is inherently suspicious and may not account for legitimate administrative actions taken by authorized personnel. Proper logging settings and retention policies for PowerShell commands will be critical for the operation of this alert.

