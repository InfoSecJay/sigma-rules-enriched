note: |
  ### Technical Context

  This Sigma rule detects the removal of an exported mailbox on Microsoft Exchange through the command `Remove-MailboxExportRequest`, which can indicate an attempt to cover tracks following a ProxyShell exploit. The likely attacker objective is to erase evidence of mailbox data extraction, potentially as part of lateral movement or data exfiltration tactics. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Indicator Removal on Host" (T1070).

  The primary telemetry source for this detection is the Microsoft Exchange Management logs, specifically the service logs that capture management commands executed on the Exchange server. If malicious, this activity could compromise sensitive data and provide attackers with persistent access to the environment. However, this detection does NOT confirm that the associated mailbox export was malicious in objective or intent; it only indicates that the export request was canceled.

  ### Investigation Steps

  - **Review relevant Exchange Management logs:** Analyze logs for Event IDs associated with mailbox export requests and removals. Look for `Remove-MailboxExportRequest` commands, noting the corresponding `-Identity` and any user context.

  - **Identify all recent mailbox export activity:** Locate recent `New-MailboxExportRequest` commands tied to the same user or suspected threat actor. This can be found in the Exchange Management logs or PowerShell command outputs.

  - **Examine user account activity:** Investigate the user accounts that executed the removal command. Check for any anomalies in logins or permission use (e.g., Security Event ID 4624) within the previous days to assess whether the actions were made by authorized users.

  - **Validate legitimate mailbox management practices:** Compare the suspect mailbox removal with regular maintenance activity. For instance, correct use of `Remove-MailboxExportRequest` should be documented and aligned with organizational policy, indicating legitimate admin roles performing typical tasks without urgency or irregularity.

  - **Assess for high-confidence malicious indicators:** Look for patterns or commands issued from unusual administrative accounts, especially if done during unexpected hours or from isolated IP addresses not part of the organization's typical traffic.

  ### Prioritization

  This alert is of high severity due to the significant risk posed by its potential link to a ProxyShell exploit. The removal of exported mailboxes can indicate a highly malicious intent to obscure unauthorized access or data exfiltration. Such behaviors can often be weaponized by adversaries looking to maintain stealth post-exploitation.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if Exchange logs are not properly configured to capture administrative commands. Malicious actors might employ evasion techniques such as using benign administrative accounts to mask their actions. Additionally, legitimate mailbox management operations triggered by automated processes or scheduled jobs may also produce similar alerts. Regularly reviewing other detection rules such as "Mailbox Export Request" activities could enhance coverage and context for incidents related to mailbox handling.

