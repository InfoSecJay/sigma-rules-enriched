  ### Technical Context

  This rule detects the removal of an exported mailbox in Microsoft Exchange, specifically through the command `Remove-MailboxExportRequest`. This action may indicate an attempt to cover tracks following exploitation, such as the ProxyShell vulnerability. The primary MITRE ATT&CK tactic applicable here is Defense Evasion (ID: T1070). The main telemetry source is the Exchange Management logs, capturing command execution events related to mailbox export management.

  If executed maliciously, this behavior could indicate a significant compromise, as it allows an attacker to delete evidence of prior activities or access. However, the detection does NOT confirm malicious intent on its own; legitimate administrative actions may result in the same command being run under appropriate circumstances.

  ---

  ### Investigation Steps

  - **Review logs for `Remove-MailboxExportRequest`:** Check Exchange Management logs for command invocations; look for entries containing `Remove-MailboxExportRequest`. Expect the user to be an administrative role such as Exchange Admin, and verify if the action aligns with standard operational procedures.

  - **Identify the timestamp of the removal event:** Correlate the removal event with previous mailbox export requests using Event ID 10001 (Mailbox Export Request) to establish a timeline of actions and determine if the removal is part of routine housekeeping or suspicious activity.

  - **Analyze user context:** Assess the user account that executed the command. Look for any elevated privileges or unusual activity patterns in logs, such as Event ID 4624 (logon events) or anomalous logon types (e.g., network logons).

  - **Cross-reference alerts for associated ProxyShell activity:** Check for any previous alerts or logs indicating exploitation attempts or known exploits related to ProxyShell (T1070). Use HTTP logs (e.g., IIS logs) to confirm web-based access patterns leading up to the command invocation.

  - **Evaluate the mailbox's history and purpose:** Validate the purpose of the exported mailbox. Analyze if it contained sensitive information or if it was a high-impact target for exfiltration, essentially looking for common legitimate reasons versus suspicious patterns.

  ---

  ### Prioritization

  This alert ranks high in severity since the affected system (Exchange Server) contains sensitive information critical to organizational operations. The likelihood of malicious abuse is elevated due to its connection with the ProxyShell exploit, which has been weaponized in numerous attacks. Thus, prompt investigation of any triggered alerts is essential.

  ---

  ### Blind Spots and Assumptions

  This detection may be circumvented by an adversary using alternative command options or executing the command in a legitimate context. Reliable detection requires comprehensive logging from the Exchange Management module, which must be correctly configured. There’s a possibility that routine administrative changes could erroneously trigger the alert if not appropriately contextualized. Companion detections include monitoring for `New-MailboxExportRequest` events (T1070) to identify a broader scope of mailbox management actions.

