note: |
  ### Technical Context

  This rule detects the execution of the `Remove-MailboxExportRequest` PowerShell command, which is used to delete mailbox export requests from Microsoft Exchange. An attacker exploiting vulnerabilities such as ProxyShell may perform this action to eliminate evidence of mailbox data exfiltration, potentially covering up their malicious activity. Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1107) and **Indicator Removal on Host** (T1070). The primary telemetry source is the Microsoft Exchange management logs, specifically logs related to PowerShell command executions. If malicious, the impact could be significant, as it may facilitate unauthorized access to sensitive data. However, this detection does NOT confirm that the initial compromise occurred, nor does it indicate whether any data was actually exfiltrated.

  ### Investigation Steps

  - **Review PowerShell command logs:** Check for execution of the `Remove-MailboxExportRequest` command in Exchange management logs (Event ID 4104), focusing on the context and parameters passed (e.g., `-Identity` and `-Confirm` flags).

  - **Identify related activities:** Look for prior Mailbox export requests (e.g., `New-MailboxExportRequest` command) in the logs, confirming if such actions were performed before the deletion to gather context about user behavior.

  - **Assess user permissions:** Verify the account executing the command. Check the role and permissions assigned using Exchange management logs. Ensure that only authorized accounts (e.g., administrators) performed the action; unauthorized user activity may indicate malicious intent.

  - **Examine related security events:** Look at Sysmon Event ID 1 (process creation) for PowerShell instances initiated around the same timeframe as the removal command to detect any preceding activities that could indicate exploitation.

  - **Look for benign use cases:** Determine if the activity aligns with expected administrative practices in your environment. Compare the command's occurrence with scheduled maintenance or backup activities to validate legitimacy.

  - **Check for concurrent suspicious activity:** Cross-reference alerts about suspicious logins or privilege escalations that occurred around the same time as the command execution to identify a broader pattern of potential compromise.

  ### Prioritization

  This alert is considered high severity due to its capability to conceal evidence of harmful activity within critical Exchange servers. The likelihood of malicious abuse is substantial, as the behavior directly correlates with post-exploitation tactics seen in sophisticated attacks. Such activity can lead to data loss or compliance violations, emphasizing the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if management logging is improperly configured or if logs are not stored long enough for retrospective analysis. Legitimate administrative actions, such as scheduled maintenance or mailbox management processes, could trigger this alert, leading to potential false positives. A related detection could include monitoring for the creation of mailbox export requests, as unusual patterns could indicate foreboding behavior further enhancing overall coverage.

