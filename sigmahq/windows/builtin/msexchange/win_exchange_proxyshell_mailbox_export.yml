title: Mailbox Export to Exchange Webserver
id: 516376b4-05cd-4122-bae0-ad7641c38d48
status: test
description: Detects a successful export of an Exchange mailbox to untypical directory
  or with aspx name suffix which can be used to place a webshell or the needed role
  assignment for it
references:
- https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
author: Florian Roth (Nextron Systems), Rich Warren, Christian Burkard (Nextron Systems)
date: 2021-08-09
modified: 2023-04-30
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  export_command:
    '|all':
    - 'New-MailboxExportRequest'
    - ' -Mailbox '
  export_params:
  - '-FilePath "\\\\'       # We care about any share location.
  - '.aspx'
  role_assignment:
    '|all':
    - 'New-ManagementRoleAssignment'
    - ' -Role "Mailbox Import Export"'
    - ' -User '
  condition: (export_command and export_params) or role_assignment
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This rule detects the unauthorized export of Exchange mailboxes to unusual directories or with file names that end in `.aspx`. Such exports may indicate potential threat actor activity aimed at implanting web shells on the Exchange server, enabling further exploitation and persistence. By leveraging the `New-MailboxExportRequest` command along with atypical file path specifications, attackers could be manipulating exported data for malicious purposes, which often aligns with objectives such as data exfiltration and maintaining access.

  The relevant MITRE ATT&CK tactics implicated in this detection include **Persistence (T1505.003)**, as attackers may set up roles that allow the import/export of mailboxes as a means of establishing a foothold within the target environment. The detection is particularly significant in enterprise settings where the security of email communications and sensitive data is paramount.

  Primary data sources for identifying this behavior include logs from the **Microsoft Exchange management service**, which record commands related to mailbox exports and the assignment of management roles that control mailbox access. Focusing on these logs will provide critical evidence for investigating suspicious activity.

  ### Investigation Steps
  - **Review Mailbox Export Logs:** Look at the `New-MailboxExportRequest` command usage in Exchange logs to identify instances exporting mailboxes to unexpected file paths or with `.aspx` extensions.
  - **Check Role Assignments:** Examine logs for the `New-ManagementRoleAssignment` command to see if there are any unauthorized allocations of the "Mailbox Import Export" role, especially to unexpected users.
  - **Analyze Share Access:** Investigate any file shares specified in the `-FilePath` parameter for unusual access patterns or configurations that may indicate potential abuse.
  - **Correlate with User Activity:** Cross-reference the user accounts associated with these commands against known administrative accounts to determine if there are any unauthorized or abnormal accesses.

  ### Prioritization
  This alert is classified as critical due to the potential for significant impact stemming from mailbox export operations. Successful exploitation may lead to data breaches or unauthorized persistence mechanisms that compromise the integrity and confidentiality of enterprise email communications.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging configurations for Microsoft Exchange do not capture all relevant command executions or if there are filter settings that exclude specific user actions. The detection logic assumes that the common command patterns (`New-MailboxExportRequest` and role assignments) are indicative of potential malicious behavior. Organizations must ensure that logging for Exchange management activities is enabled and detailed enough to capture all mailbox export requests and role assignments for effective detection.

