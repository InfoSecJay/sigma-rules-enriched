title: Mailbox Export to Exchange Webserver
id: 516376b4-05cd-4122-bae0-ad7641c38d48
status: test
description: Detects a successful export of an Exchange mailbox to untypical 
  directory or with aspx name suffix which can be used to place a webshell or 
  the needed role assignment for it
references:
- https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
author: Florian Roth (Nextron Systems), Rich Warren, Christian Burkard (Nextron 
  Systems)
date: 2021-08-09
modified: 2023-04-30
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  export_command:
    '|all':
    - 'New-MailboxExportRequest'
    - ' -Mailbox '
  export_params:
  - '-FilePath "\\\\'       # We care about any share location.
  - '.aspx'
  role_assignment:
    '|all':
    - 'New-ManagementRoleAssignment'
    - ' -Role "Mailbox Import Export"'
    - ' -User '
  condition: (export_command and export_params) or role_assignment
falsepositives:
- Unlikely
level: critical
note: |
  ---

  ### Technical Context

  This rule detects the export of an Exchange mailbox using the `New-MailboxExportRequest` command, specifically to atypical directories or file paths that include `.aspx`, which may indicate an attempt to upload a webshell. The attacker’s objective is likely to gain persistence or establish a foothold within the environment by manipulating mailbox exports in conjunction with a management role assignment. This behavior aligns with the MITRE ATT&CK tactic for persistence (T1505.003).

  The primary telemetry source for this detection is the Exchange Management logs. If malicious, the activity could lead to unauthorized access to mailbox data or the introduction of a malicious payload capable of evading traditional security measures. Importantly, this detection does NOT confirm that a compromise has occurred on its own; additional context around intent and execution is required.

  ---

  ### Investigation Steps

  - **Review Export Command Activity:**
    Check for `New-MailboxExportRequest` commands in Exchange Management logs (Event ID X). Look for unusual parameters such as file paths pointing to non-standard directories or those ending with `.aspx`. Malicious indicators include exports targeting paths like `\\<unknown-share>\<folder>\malicious.aspx`.

  - **Analyze Role Assignment Events:**
    Investigate any `New-ManagementRoleAssignment` commands logged (Event ID Y) relating to the "Mailbox Import Export" role. Confirm if this is being assigned to a user without legitimate reasons. Malicious indicators could involve unexpected users receiving sensitive permissions.

  - **Evaluate Access Patterns:**
    Examine user access logs to determine if the mailbox export is initiated from unusual locations or by task users. Legitimate activity generally involves recognized admin accounts operating from standard workstations.

  - **Check for Anomalous File Creation:**
    Search through file system logs for unexpected creation events of `.aspx` files in the output directory (File Creation Event ID Z). Legitimate use should correspond with expected operational procedures and timing.

  - **Correlate with Previous Alerts:**
    Cross-reference this indicator with prior security alerts to identify if any recent suspicious behaviors (e.g., unsuccessful login attempts, unusual mailbox access) coincide with the suspect export activity, reinforcing the potential for a chained attack.

  - **Assess Asset Importance:**
    Consider the criticality of the involved mailboxes and identify if any contain sensitive information that could be leveraged. Prioritize investigations on mailboxes tied to high-value users or sensitive departments.

  ---

  ### Prioritization

  Given the potential impact of unauthorized mailbox access and the likelihood of exploitation for sustained internal access, this alert should be prioritized as critical. The specific combination of mailbox export and atypical file creation can signal active attempts to deploy malicious payloads, a behavior often weaponized in malicious campaigns targeting Exchange environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of misconfigured logging settings that may omit key command executions. Legitimate administrative activity, such as planned migrations or support operations, may inadvertently trigger this alert. To enhance coverage, integrate alerts for unusual command executions in tandem with logon event anomalies from the same source to gather comprehensive context on potential threats.

