  ---

  ### Technical Context

  This rule detects the use of a vulnerable Netlogon secure channel connection, associated with CVE-2020-1472. Attackers may exploit this vulnerability to perform unauthorized actions within Active Directory environments, potentially allowing them to escalate privileges or impersonate legitimate domain accounts. The relevant MITRE ATT&CK tactic is **Privilege Escalation** (TA0004), and the technique is **Windows Admin Shares** (T1548).

  The primary telemetry source is Windows Event Log, specifically capturing **Event ID 5829** from the NetLogon provider. If malicious, successful exploitation can lead to critical security breaches, such as domain controller compromise. Notably, this detection does NOT confirm that an exploitation has occurred, as it may also include benign misconfigurations or network behavior.

  ---

  ### Investigation Steps

  - **Review the event details:**
    Check Windows Event ID 5829 for any unusual source IP addresses making connections to the NetLogon service. Look for patterns that are not typically seen in the environment.

  - **Verify legitimate domain connections:**
    Compare the detected connection against expected network behavior. Review normal NetLogon traffic patterns from known domain controller IPs and ensure connections originate from legitimate user accounts or servers.

  - **Analyze for privilege escalation attempts:**
    Look for subsequent Event IDs that indicate changes in permissions or unauthorized account usage immediately following the NetLogon connection. Cross-reference with Event ID 4672 (Special privileges assigned to a new logon) for additional indicators of compromise.

  - **Assess the asset criticality:**
    Prioritize investigations if the affected system is a domain controller or another critical asset. Compromise of these systems can have extensive ramifications for overall network security.

  - **Document any unusual account behavior:**
    Check for abnormal user account behaviors post-connection, such as additional login attempts or resource access that diverges from typical user activity, which may indicate exploitation attempts.

  ---

  ### Prioritization

  This alert is high priority due to the potential impact of a compromised domain environment. The likelihood of exploitation is significant, as this behavior is frequently weaponized by threat actors for privilege escalation and lateral movement within networks.

  ---

  ### Blind Spots and Assumptions

  This detection may not account for legitimate temporary changes to NetLogon due to misconfigurations or benign maintenance actions. Evasion techniques include the potential for attackers to leverage legitimate accounts or impersonation tactics to mask exploitation attempts. Required logs for reliable detection include comprehensive monitoring of Active Directory event logs. Companion detections include monitoring for abnormal authentication attempts or failed logon activities (e.g., Event ID 4625) which may indicate a follow-up to identified NetLogon vulnerabilities.

