title: Invoke-Obfuscation Obfuscated IEX Invocation - System
id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
status: test
description: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
date: 2019-11-08
modified: 2022-11-27
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    EventID: 7045
  selection_imagepath:
  - ImagePath|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ImagePath|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ImagePath|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ImagePath|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ImagePath|re: '\\*mdr\*\W\s*\)\.Name'
  - ImagePath|re: '\$VerbosePreference\.ToString\('
  - ImagePath|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to invoke obfuscated PowerShell scripts using the Invoke-Obfuscation framework. Attackers utilize obfuscation techniques to disguise malicious PowerShell commands, making it difficult for traditional security measures to detect and block them. The primary objective of employing obfuscation is to evade detection systems while executing potentially harmful actions, such as downloading additional payloads or executing commands on compromised systems.

  The relevant MITRE ATT&CK tactics involved include **Defense Evasion** (TA0005) and the technique **Obfuscated Files or Information** (T1027). By leveraging obfuscation, attackers aim to confuse security analysts and tools, thereby increasing the chances of successfully executing their payloads without raising alerts. The primary data sources for capturing this activity include Windows Event Logs, specifically Event ID 7045, which logs changes to the service configuration that can be indicative of malicious PowerShell activity.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Event Logs for Event ID 7045 to identify any new service configurations that indicate PowerShell invocation, especially those involving obfuscation patterns.
  - **Analyze Command-Line Arguments**: Inspect the command-line arguments associated with PowerShell processes to determine if any variable assignments or obfuscation techniques are being applied.
  - **Examine Detailed Process Creation Events**: Look for abnormal patterns in process creation related to PowerShell, particularly those involving scripts that reference obfuscation strings or encoded commands.
  - **Correlate with Threat Intelligence**: Utilize threat intelligence sources to validate if the observed obfuscation patterns are associated with known threat actors or malware campaigns leveraging the Invoke-Obfuscation framework.

  ### Prioritization
  This alert is categorized as high severity due to the significant risk it poses; obfuscated PowerShell commands are commonly used in the early stages of an attack, such as initial access or payload delivery, making quick detection essential to mitigate potential damage.

  ### Blind Spots and Assumptions
  One critical gap in detection coverage is the potential for legitimate applications or scripts to be misidentified as malicious due to their use of obfuscation techniques. The detection rule assumes that any invocation of PowerShell with these obfuscation patterns is malicious; however, benign usage may also exist. Certain configurations and logging must be enabled for Event ID 7045 to ensure comprehensive coverage; without this, the rule may fail to trigger on relevant activity, leaving an opportunity for evasion.

