title: Invoke-Obfuscation Obfuscated IEX Invocation - System
id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
status: test
description: Detects all variations of obfuscated powershell IEX invocation code
  generated by Invoke-Obfuscation framework from the code block linked in the 
  references
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
date: 2019-11-08
modified: 2022-11-27
tags:
- attack.stealth
- attack.t1027
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    EventID: 7045
  selection_imagepath:
  - ImagePath|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ImagePath|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ImagePath|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ImagePath|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ImagePath|re: '\\*mdr\*\W\s*\)\.Name'
  - ImagePath|re: '\$VerbosePreference\.ToString\('
  - ImagePath|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts that utilize the Invoke-Obfuscation framework, specifically focusing on the use of the `IEX` (Invoke-Expression) command. The likely objective of an attacker utilizing this method is to bypass detection mechanisms by obscuring the true nature of their commands while delivering malicious payloads or facilitating post-exploitation activities. The relevant MITRE ATT&CK tactic is **Defense Evasion**, with techniques including **Obfuscated Files or Information (T1027)**. The primary telemetry sources required are Windows Event ID 7045 (Service Creation) along with command execution logs which may provide context on the executed scripts. If malicious, this behavior could lead to unauthorized system access, data exfiltration, or lateral movement. This detection does NOT confirm that the script invoked is malicious or that any payload has been delivered.

  ### Investigation Steps

  - **Verify Event Data:** Review Windows Event ID 7045 for service creation instances. Look for entries where the `ImagePath` matches patterns indicative of obfuscated PowerShell commands being executed, particularly those involving `IEX`.

  - **Check Command Log Entries:** Examine PowerShell command history files (`Microsoft.PowerShell_Core` logs) for any commands running `IEX` with obfuscated strings. Look for high entropy strings or sequences typical of obfuscation, which may indicate malicious activity versus legitimate admin scripting.

  - **Identify Legitimate Patterns:** Assess the command usage against baseline behavior. For legitimate usage, expected PowerShell commands should consist of clear, concise scripts without obfuscation and low entropy. Compare against known good configurations or previously logged commands.

  - **Investigate Script Locations:** Look at the contexts from which these obfuscated scripts are executed, including user profiles, temporary directories, and any unusual locations. Check for the presence of scripts in default locations, such as `C:\Windows\SysWOW64\WindowsPowerShell\v1.0\Modules`, which might indicate legitimate usage versus potential compromise.

  - **Correlate with Threat Intelligence:** Match the identified obfuscation patterns against threat intelligence feeds. High-confidence malicious indicators may involve known hash values or command structures from threat actors that employ such techniques.

  - **Assess Impact and Context:** If detected on critical assets (e.g., domain controllers or file servers), prioritize immediate triage efforts. Monitor for downstream effects such as lateral movement or data exfiltration attempts linked to the execution of these scripts.

  ### Prioritization

  This alert should be treated with high priority due to its potential impact on system integrity and the likelihood of being abused to evade detection. The use of obfuscation in PowerShell is a common tactic among threat actors to hide malicious behaviors, making this a significant concern that warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the need for proper logging settings in PowerShell. If command logging is not enabled, legitimate activities (like scheduled scripts or administrative tasks using PowerShell) could trigger false positives. Additionally, the detection may miss other forms of obfuscation not covered by the rule. A related detection to enhance coverage would be the monitoring of anomalous PowerShell startup events, which could indicate other forms of malicious script execution outside of the obfuscation context.

