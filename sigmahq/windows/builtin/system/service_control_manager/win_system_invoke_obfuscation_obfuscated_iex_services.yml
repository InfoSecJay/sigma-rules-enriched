title: Invoke-Obfuscation Obfuscated IEX Invocation - System
id: 51aa9387-1c53-4153-91cc-d73c59ae1ca9
status: test
description: Detects all variations of obfuscated powershell IEX invocation code
  generated by Invoke-Obfuscation framework from the code block linked in the 
  references
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
date: 2019-11-08
modified: 2022-11-27
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    EventID: 7045
  selection_imagepath:
  - ImagePath|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ImagePath|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ImagePath|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ImagePath|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ImagePath|re: '\\*mdr\*\W\s*\)\.Name'
  - ImagePath|re: '\$VerbosePreference\.ToString\('
  - ImagePath|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects obfuscated PowerShell invocation code generated by the Invoke-Obfuscation framework. Attackers commonly use this technique to evade detection systems and execute malicious commands without revealing their true intent. The likely objective is to execute malware or conduct lateral movement within the target environment. This behavior relates to MITRE ATT&CK technique T1027 (Obfuscated Files or Information), which falls under the Defense Evasion tactic.

  Telemetry sources for this detection include Windows Event ID 7045, which logs any new service installation, alongside the relevant PowerShell execution logs. If successful and malicious, the impact could lead to system compromise, data exfiltration, or persistent access to the environment. However, this detection alone does NOT confirm malicious intent; it merely suggests suspicious behavior associated with potential obfuscation techniques.

  ### Investigation Steps

  - **Check Event ID 7045:** Review the Windows Event Log for Event ID 7045 to identify newly created services associated with obfuscated IEX invocation. Look for entries with ImagePath matching the specified regex patterns for obfuscation.

  - **Validate PowerShell Execution Logs:** Examine PowerShell logs (Event ID 4104) for the presence of commands indicating the use of `Invoke-Obfuscation`. Focus on command lines that include patterns matching obfuscated strings or unusual parameters.

  - **Identify Legitimate PowerShell Use:** Cross-reference the logs with known good PowerShell practices within your organization. File creation and execution from `$PSHome` or `$env:ComSpec` paths while following legitimate usage patterns can indicate benign activity.

  - **Assess the Host’s Role:** Determine if the affected host typically runs administrative tasks using PowerShell. Hosts with high privilege roles (e.g., domain controllers, servers) should be scrutinized more closely due to their potential impact on security.

  - **Correlate with Endpoint Protection Alerts:** Look for additional alerts from endpoint detection tools that report on obfuscated or suspicious PowerShell executions. High-confidence indicators may include documented malicious hashes or patterns related to known threats that utilize such invocation.

  ### Prioritization

  This alert should be considered high priority due to the potential for significant impact on affected critical systems. The obfuscation techniques employed are commonly weaponized by adversaries to bypass security controls, indicating a higher likelihood of malicious intent.

  ### Blind Spots and Assumptions

  This detection may miss other forms of obfuscation not tied to the Invoke-Obfuscation framework, as well as custom obfuscation scripts. It requires correct logging configurations on endpoint devices for accurate detection. Legitimate activities, such as DevOps tasks utilizing PowerShell scripts, could inadvertently trigger this alert. Companion detections include monitoring for periodic PowerShell command execution (T1059.001) for greater context and validation.

