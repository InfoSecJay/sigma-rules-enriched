logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_img_paths:
  - ImagePath|re: '^[Cc]:\\[Pp]rogram[Dd]ata\\.{1,9}\.exe'
  - ImagePath|re: '^[Cc]:\\.{1,9}\.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the installation of Windows services that create executable files in suspicious folder patterns, particularly in directories that are not typically associated with legitimate application installations. Attackers often leverage the creation of malicious services to maintain persistence within targeted environments, which allows them to execute arbitrary code or maintain control over compromised systems. The likely objectives of such attackers include establishing a foothold in the environment, escalating privileges, or moving laterally within the network.

  Relevant MITRE ATT&CK tactics include **Persistence** (T1543.003), where attackers install services to ensure their malicious payloads run at system startup, and **Privilege Escalation** (T1543), as these services can often be configured to run with higher privileges than a standard user account. The primary data sources for this detection are the Windows Event Logs, specifically, the Service Control Manager logs that record when new services are installed, including details about their binary paths.

  ### Investigation Steps
  - **Review Service Creation Logs**: Analyze Windows Event ID 7045 from the Service Control Manager to identify recent service installations. Pay special attention to the service names and their parameters for any irregularities.
  - **Examine Executable Paths**: Check the `ImagePath` of the services for executable files residing in suspicious locations (e.g., `C:\ProgramData\...` or deeply nested paths), which may indicate malicious intent.
  - **Cross-reference with Known Good**: Compare the detected services against a known list of legitimate services within your environment. Identify any unfamiliar services that may require further investigation.
  - **Monitor for Anomalous Behavior**: Investigate related system activities such as process creation and network connections associated with newly created services, noting any behaviors that deviate from the norm.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to maintain persistence and escalate privileges by leveraging service installations in unusual directories. Such behavior significantly increases the risk of further compromise within the organization.

  ### Blind Spots and Assumptions
  One blind spot in this detection rule is the possibility of legitimate applications using similar folder patterns, which could lead to false positives. The assumption is made that the employed regular expressions effectively cover the malicious patterns without excluding common benign cases. For the alert to function effectively, it's essential to have logging enabled for the Service Control Manager, specifically capturing Event ID 7045, and ensuring that log retention policies allow for adequate historical analysis.

