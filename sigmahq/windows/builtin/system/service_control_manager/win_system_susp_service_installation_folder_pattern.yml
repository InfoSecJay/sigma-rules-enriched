note: |
  ### Technical Context

  This Sigma rule detects the installation of Windows services that use suspicious folder patterns, particularly those located in non-standard paths such as `C:\ProgramData` or paths containing excessive dots. This behavior could indicate an adversary's objective of establishing persistence or leveraging privilege escalation techniques in the target environment. The relevant MITRE ATT&CK tactics include Persistence (T1543.003) and Privilege Escalation.

  The primary telemetry source for this rule is the Windows Event log, specifically targeting the System log for Event ID 7045, which records service installations. If detected as malicious, this behavior could lead to unauthorized control over system services, potentially allowing an attacker to maintain a foothold or escalate privileges. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also utilize these patterns.

  ### Investigation Steps

  - **Review Event Details:** Inspect Event ID 7045 in the System log (Event Viewer > Windows Logs > System) for the specific service installation details, including the `ImagePath` field, which indicates where the service executable resides.

  - **Examine Service Path:** Verify the `ImagePath` for known patterns; suspicious paths like `C:\ProgramData\.exe` or paths with suspicious characters (multiple dots) should raise flags. Document the directory structure to ascertain legitimacy.

  - **Identify Parent Process:** Check for the process that triggered the service installation by examining the `ProcessId` and `EventLog` fields in the event. Legitimate installations typically originate from established software installers, not ad-hoc processes.

  - **Cross-Reference Registry Entries:** Investigate related registry entries under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services` for the service name. Malicious services often have entries that do not correlate with legitimate software.

  - **Correlate with Other Alerts:** Look for associated alerts or logs from endpoint detection and response (EDR) solutions that may indicate related malicious behavior, such as unusual command line arguments or unusual parent-child process relationships.

  ### Prioritization

  This alert is high priority due to the potential for significant impact on affected systems through unauthorized service installations. The likelihood of malicious abuse is notable, as attackers frequently exploit service configurations for persistence. Such behaviors are commonly weaponized in threat actor toolkits.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper logging configurations or if service installations occur outside of normal logging scopes. Legitimate software installations may also trigger this alert, such as software that does perform installations in uncommon directories. Related detections for abnormal process behavior or lateral movement (e.g., command-line monitoring) can provide additional coverage to enhance security posture.

