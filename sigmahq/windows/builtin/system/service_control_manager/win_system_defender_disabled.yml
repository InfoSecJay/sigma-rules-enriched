note: |
  ### Technical Context

  This rule detects when the "Windows Defender Threat Protection" service is disabled, which typically indicates an attempt to bypass security defenses by an adversary. The likely objective of the attacker is to create a vulnerability in the system for further exploitation or to facilitate malware execution without detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  The primary telemetry source is the Windows Security Event Log, specifically Event ID 7036 generated by the Service Control Manager. If the "Windows Defender Threat Protection" service is turned off, it significantly increases the risk of successful malware deployment and other exploitative actions. However, it is essential to recognize that this detection alone does NOT confirm malicious activity; legitimate administrative actions could also disable the service.

  ### Investigation Steps

  - **Verify the service status:** Check the Windows Event Log for Event ID 7036. Confirm that the 'Windows Defender Antivirus Service' has a status of 'stopped'. If the service was stopped by an administrator, a review of the surrounding events should show typical administrative patterns or timeframes.

  - **Assess system role and criticality:** Identify if the affected host is a critical system (e.g., domain controller, web server). If the system is business-critical, escalate the investigation due to the higher potential impact of disabled defenses.

  - **Check for user activity around the change:** Look for signs of recent administrative activities, such as Event ID 4624 (Logon) for users with administrative privileges (e.g., SYSTEM, Administrators). Any unexpected or unrecognized accounts triggering the service disablement should be investigated further.

  - **Examine for related alerts:** Correlate with other detections of suspicious behavior. For example, review recent alerts related to process creations (Event ID 4688/Sysmon Event ID 1) that may coincide with the service stop event, indicating potential malicious activity.

  - **Look for potential evasion attempts:** Investigate if there were related changes to system configurations or security settings that could indicate an attempt to evade detection. This might include local policy changes or alterations to the Windows Registry.

  ### Prioritization

  This alert has medium severity. The impact is elevated if the affected system is critical, as defense mechanisms are disabled, thus increasing vulnerability. The likelihood of this behavior being malicious is moderate, particularly if other red flags are present, as disabling endpoint defenses is often weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative tasks or routine maintenance activities which also disable the Microsoft Defender service. Ensure logging is enabled for all service events to provide complete coverage. Additionally, benign configurations, such as auto-updating processes or legitimate security software modifications, may trigger the alert. A related detection to consider is the monitoring of process creation events (Event ID 4688) for patterns that correlate with the service status change, which can reinforce findings.

