note: |
  ### Technical Context

  This rule detects when the "Windows Defender Threat Protection" service is disabled by monitoring Windows Event ID 7036 from the Service Control Manager. An attacker may disable this service to remove a layer of security, facilitating further malicious actions such as malware installation or data exfiltration. The behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001). Primary telemetry sources include Windows System Event Logs, specifically Event ID 7036, which indicates service status changes.

  If an attacker disables this service, they could potentially implant undetected malware, leading to severe security impacts such as data breaches or ransomware setups. However, the detection of this event does NOT confirm that malicious activity has occurred, as there are legitimate reasons for service changes, such as administrative actions or system maintenance.

  ### Investigation Steps

  - **Review service status changes**: Check Event ID 7036 logs for 'Windows Defender Antivirus Service' stopping. Validate against recent administrative logs to see if this action corresponds to legitimate IT maintenance.

  - **Identify responsible users**: Use Event ID 4624 (Account Logon) to identify the user or account that performed the action. Focus on unusual accounts that do not typically modify security settings.

  - **Check for related malicious indicators**: Look for subsequent processes that indicate malware activity. Pay attention to Event ID 4688 (Process Creation) to see if any new executable has launched right after the service was stopped.

  - **Evaluate host role and asset criticality**: Determine if the affected host is a critical endpoint such as a server or a high-value user workstation. Increased attention is required for such assets due to their potential impact on the organization.

  - **Identify recent updates or installed software**: Review application logs (e.g., Event ID 1033 from Windows Update) for any prominent software updates or installs around the time of service disablement. Legitimate automatic updates can cause temporary service disruptions.

  ### Prioritization

  The alert is medium severity due to the potential impact on the affected system, especially if it's a critical endpoint. The likelihood of malicious abuse is moderate. Disabling security services is a common technique employed by attackers to facilitate further exploitation.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers using administrative privileges to disable the service without generating logs. Reliable detection requires consistent logging of system events and oversight on service configurations. Legitimate maintenance practices, such as updates or configuration changes by IT admins, may trigger this alert. Companion detections to consider include monitoring for unauthorized installations or unexpected process launches following service disablement.

