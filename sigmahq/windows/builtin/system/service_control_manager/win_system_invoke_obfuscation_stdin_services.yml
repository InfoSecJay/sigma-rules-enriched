title: Invoke-Obfuscation STDIN+ Launcher - System
id: 72862bf2-0eb1-11eb-adc1-0242ac120002
status: test
description: Detects Obfuscated use of stdin to execute PowerShell
references:
- https://github.com/SigmaHQ/sigma/issues/1009      # (Task 25)
author: Jonathan Cheong, oscd.community
date: 2020-10-15
modified: 2022-11-29
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection_main:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
        # ImagePath|re: 'cmd.{0,5}(?:\/c|\/r).+powershell.+(?:\$\{?input\}?|noexit).+\"'
        # Example 1: c:\windows\sYstEm32\CmD.eXE /C"echO\Invoke-Expression (New-Object Net.WebClient).DownloadString | POwersHELl -NoEXiT -"
        # Example 2: c:\WiNDOws\sysTEm32\cmd.EXe /C " ECHo Invoke-Expression (New-Object Net.WebClient).DownloadString | POwersHELl -nol ${EXEcUtIONCONTeXT}.INvOkEComMANd.InvOKEScRIPt( $InpUt )"
    ImagePath|contains|all:
    - 'cmd'
    - 'powershell'
    ImagePath|contains:
    - '/c'
    - '/r'
  selection_other:
  - ImagePath|contains: 'noexit'
  - ImagePath|contains|all:
    - 'input'
    - '$'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the obfuscated use of `cmd.exe` to execute PowerShell commands leveraging standard input (stdin). Attackers typically aim to execute scripts or commands stealthily, bypassing security measures that monitor command execution in a more linear manner. This behavior corresponds with MITRE ATT&CK techniques for Execution (T1059.001 - PowerShell) and Stealth (T1027 - Obfuscated Files or Information).

  The primary telemetry source is Windows Security Event logs, particularly Event ID 7045 that captures service creation events. If confirmed as malicious, this behavior could indicate an attacker trying to persist on or control a system within a network. Note that this detection does NOT confirm that the executed commands are inherently malicious without further context.

  ### Investigation Steps

  - **Review Event 7045 Details**: Look for Event ID 7045 in the Windows Event Viewer under "Applications and Services Logs > Microsoft > Windows > Servicing > Operational". Check the `ImagePath` for obfuscation patterns, specifically containing both "cmd" and "powershell" with `/c` or `/r`.

  - **Identify Malicious Command Line Patterns**: Examine the `ImagePath` field for the presence of unusual scripts or obfuscated commands. Malicious command lines may include patterns like "Invoke-Expression" or download strings something like "DownloadString".

  - **Compare with Known Good Behavior**: Investigate if the detected command line corresponds to legitimate usage. Common benign activity may involve typical administrative scripts invoking PowerShell without obfuscation.

  - **Examine Additional Event IDs**: Inspect related Event IDs (e.g., 4688) for process creation logs that track the parent-child process relationship. Look for anomalies, such as `cmd` or `powershell` launched by unexpected processes.

  - **Check for Service Creation Patterns**: Validate whether regular services associated with administrative actions are being created. Legitimate service creation should have well-known binaries and paths that don't involve obfuscation.

  - **Monitor for Further Malicious Indicators**: Look for signs of subsequent activity such as file manipulations or outbound connections that follow the execution of detected commands. Validate any newly created files or elevated privileges for suspicious modifications.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems if a malicious actor gains control. The likelihood of abuse is considerable, as this method of command execution is commonly employed in various attack scenarios, including post-exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by techniques used to further encode or obfuscate commands beyond typical patterns. Required sources include a complete logging configuration for Windows Event Logs that capture service creation events. Legitimate scripting activity, such as automated administrative scripts, may trigger the alert. Implementing complementary detections for process injection or abnormal script execution can strengthen overall coverage against this behavior.

