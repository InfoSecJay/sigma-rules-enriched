logsource:
  product: windows
  service: system
detection:
  selection_main:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
        # ImagePath|re: 'cmd.{0,5}(?:\/c|\/r).+powershell.+(?:\$\{?input\}?|noexit).+\"'
        # Example 1: c:\windows\sYstEm32\CmD.eXE /C"echO\Invoke-Expression (New-Object Net.WebClient).DownloadString | POwersHELl -NoEXiT -"
        # Example 2: c:\WiNDOws\sysTEm32\cmd.EXe /C " ECHo Invoke-Expression (New-Object Net.WebClient).DownloadString | POwersHELl -nol ${EXEcUtIONCONTeXT}.INvOkEComMANd.InvOKEScRIPt( $InpUt )"
    ImagePath|contains|all:
    - 'cmd'
    - 'powershell'
    ImagePath|contains:
    - '/c'
    - '/r'
  selection_other:
  - ImagePath|contains: 'noexit'
  - ImagePath|contains|all:
    - 'input'
    - '$'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the obfuscated execution of PowerShell commands through the command-line interface, specifically when invoked via `cmd.exe`. Attackers may use such techniques to avoid detection by security monitoring tools. By obfuscating their PowerShell commands and using standard Windows executables, they can blend in with normal system activities while executing malicious scripts. The rule targets behavior associated with tactics like **Defense Evasion** and **Execution**, as attackers often aim to evade detection mechanisms while executing binaries or scripts on compromised systems.

  The relevant MITRE ATT&CK techniques include:
  - **T1027:** Obfuscated Files or Information
  - **T1059.001:** Command and Scripting Interpreter: Windows PowerShell

  Primary data sources for this detection include Windows system event logs, particularly those related to service management (Event ID 7045), which logs the installation of a new service. This will help identify potentially unauthorized or suspicious service executions that leverage PowerShell.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Event Logs for Event ID 7045 to find instances of services being created or modified, especially those with command-line arguments involving PowerShell.
  - **Analyze Image Paths:** Look for commands in the ImagePath that contain both `cmd` and `powershell`, particularly those using `/c` or `/r`, which indicate command execution.
  - **Inspect Obfuscation Patterns:** Focus on commands that include terms like `noexit`, `input`, and `$`, as these may signify obfuscated PowerShell payloads or command invocations.
  - **Correlate with Other Sources:** If applicable, cross-reference findings with EDR, firewall logs, or network traffic to identify any outbound connections initiated by the suspicious PowerShell commands that could indicate command-and-control communication.

  ### Prioritization
  Given that this detection pertains to PowerShell's obfuscation techniques often used by sophisticated attackers to evade security measures, the alert should be treated with high priority. The likelihood of attempted exploitation via these methods in an enterprise is significant, as attackers commonly leverage such tactics to gain persistence or execute additional payloads.

  ### Blind Spots and Assumptions
  This detection rule is contingent upon having complete and accurate event logging enabled for Windows systems, particularly for service management events. A potential gap is the reliance on traditional detection mechanisms that may not recognize nuanced obfuscation or evasion techniques. Additionally, variations of command-line obfuscation that do not follow the specified patterns may be missed. The detection logic assumes that commands will utilize recognizable invocation patterns typical of obfuscated PowerShell execution.

