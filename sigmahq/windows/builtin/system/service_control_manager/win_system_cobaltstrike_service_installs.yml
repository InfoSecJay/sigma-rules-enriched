title: CobaltStrike Service Installations - System
id: 5a105d34-05fc-401e-8553-272b45c1522d
status: test
description: Detects known malicious service installs that appear in cases in which
  a Cobalt Strike beacon elevates privileges or lateral movement
references:
- https://www.sans.org/webcasts/119395
- https://www.crowdstrike.com/blog/getting-the-bacon-from-cobalt-strike-beacon/
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Florian Roth (Nextron Systems), Wojciech Lesicki
date: 2021-05-26
modified: 2022-11-27
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.lateral-movement
- attack.t1021.002
- attack.t1543.003
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_id:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection1:
    ImagePath|contains|all:
    - 'ADMIN$'
    - '.exe'
  selection2:
    ImagePath|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  selection3:
    ImagePath|contains: 'powershell -nop -w hidden -encodedcommand'
  selection4:
    ImagePath|base64offset|contains: "IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:"
  condition: selection_id and (selection1 or selection2 or selection3 or selection4)
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies the installation of malicious services typically associated with the Cobalt Strike framework. Cobalt Strike is a legitimate penetration testing tool that can easily be weaponized by threat actors to facilitate privilege escalation and lateral movement within targeted environments. By monitoring specific service installation events, the rule aims to capture instances where attackers may be attempting to maintain persistence or execute malicious payloads hidden from regular scrutiny.

  The likely attacker objective is to achieve a foothold within the network, allowing for further exploitation of compromised systems while evading detection. Attackers often utilize services to execute control commands stealthily, thereby manipulating or exfiltrating sensitive data without immediate detection. The relevant MITRE ATT&CK tactics include:
  - **Persistence (T1543.003)**: Establishing a malicious service that runs automatically.
  - **Execution (T1569.002)**: Running arbitrary code through legitimate system services.
  - **Privilege Escalation (T1068)**: Exploiting service configuration to gain elevated access.
  - **Lateral Movement (T1021.002)**: Using compromised credentials to access other systems in the network.

  Primary data sources for this detection include Windows Event Logs, specifically the Security and System logs capturing service-related events (Event ID 7045), which provide insights into new service installations.

  ### Investigation Steps
  - **Review Event Logs**: Investigate Windows System and Security Event logs for Event ID 7045, which corresponds to service installations. Look for services that may act as a backdoor or be linked to Cobalt Strike.

  - **Analyze ImagePath**: Analyze the `ImagePath` of newly created services for any suspicious indicators, such as references to administrative shares (ADMIN$) or command shell references, including `powershell` commands.

  - **Validate PowerShell Activity**: Examine PowerShell execution logs for commands like `powershell -nop -w hidden -encodedcommand` to identify any encoded scripts that may suggest an attempt to run malware or connecting back to an external command and control (C2) server.

  - **Correlate with Network Activity**: Check network traffic logs for any unusual outbound connections from the affected host that may coincide with the installation of new services, particularly to IPs that appear to be related to command and control infrastructure.

  ### Prioritization
  This alert is categorized as critical due to the high potential impact of malicious service installations on enterprise security, indicating that a threat actor may have successfully established persistence and is preparing for further exploitation within the network.

  ### Blind Spots and Assumptions
  The detection logic is dependent on the completeness of Windows event logging, specifically ensuring that service installation events are being captured correctly. There may be blind spots if logs are not retained for a sufficient period or if certain filters are applied that omit relevant events. Additionally, it assumes that systems are not fully compromised or that other methods of service installation are not being used, such as direct registry modifications or use of alternative binaries to install services. Without proper configuration, logging may be insufficient, resulting in gaps in detection.

