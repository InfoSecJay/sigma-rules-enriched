title: CobaltStrike Service Installations - System
id: 5a105d34-05fc-401e-8553-272b45c1522d
status: test
description: Detects known malicious service installs that appear in cases in 
  which a Cobalt Strike beacon elevates privileges or lateral movement
references:
- https://www.sans.org/webcasts/119395
- https://www.crowdstrike.com/blog/getting-the-bacon-from-cobalt-strike-beacon/
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Florian Roth (Nextron Systems), Wojciech Lesicki
date: 2021-05-26
modified: 2022-11-27
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.lateral-movement
- attack.t1021.002
- attack.t1543.003
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_id:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection1:
    ImagePath|contains|all:
    - 'ADMIN$'
    - '.exe'
  selection2:
    ImagePath|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  selection3:
    ImagePath|contains: 'powershell -nop -w hidden -encodedcommand'
  selection4:
    ImagePath|base64offset|contains: "IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:"
  condition: selection_id and (selection1 or selection2 or selection3 or 
    selection4)
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the installation of malicious Windows services typically associated with Cobalt Strike, a popular post-exploitation toolkit used by threat actors for privilege escalation and lateral movement. The presence of such services can indicate that an adversary is attempting to maintain persistence on a compromised host or execute commands remotely. Relevant MITRE ATT&CK tactics include Persistence (T1543.003) and Lateral Movement (T1021.002).

  Primary telemetry sources are Windows System Event logs, particularly focusing on Event ID 7045, which relates to service installations. If found to be malicious, this behavior can lead to full system compromise, allowing attackers to run arbitrary commands or pivot to other systems. Importantly, this detection does NOT confirm active exploitation or command execution on its own; further investigation is required.

  ### Investigation Steps

  - **Review Service Creation Logs:** Check for Event ID 7045 in the Windows System logs (`Security->System Log`). Look for services created with suspicious images such as `ADMIN$\*` or those containing `powershell -nop -w hidden -encodedcommand`.
  - **Identify Known Malicious Patterns:** Look for service entries where `ImagePath` includes `IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:`. This is a common command used by adversaries when utilizing Cobalt Strike.
  - **Verify Legitimate Services:** Investigate whether any detected services are part of legitimate applications by cross-referencing their `ImagePath` against known software. Legitimate administration tools may utilize the `ADMIN$` share.
  - **Audit PowerShell History:** Check the PowerShell execution history (Event ID 4104) for any encoded commands that align with the patterns identified in the Cobalt Strike behavior. Look for commands containing `DownloadString` or unusual API calls.
  - **Review for Unusual Network Activity:** Monitor for outbound connections from newly installed services to external IPs, particularly any connections that utilize known indicators of compromise (IOC) associated with Cobalt Strike.

  ### Prioritization

  This alert is critical due to the high impact on system integrity if exploited; a successful installation of a malicious service can lead to data breaches or further compromise. The likelihood of malicious abuse of this behavior is significant, as Cobalt Strike is regularly weaponized in cyber incidents, especially during targeted attacks and red team engagements.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if service logging is not enabled or incorrectly configured, as Event ID 7045 must be captured for effective monitoring. Legitimate administrative actions may trigger similar alerts, such as normal application updates or service installations by IT personnel. Companion detections such as PowerShell execution logs (Event ID 4104) could help identify scripted behavior associated with Cobalt Strike, enhancing overall detection and investigation efficacy.

