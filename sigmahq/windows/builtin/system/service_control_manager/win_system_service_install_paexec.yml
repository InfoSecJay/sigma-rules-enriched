logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_image:
  - ServiceName|startswith: 'PAExec-'
  - ImagePath|startswith: 'C:\WINDOWS\PAExec-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of a service associated with PAExec, a tool that can be used in both legitimate system administration and malicious exploitation contexts. The likely attacker objective is to create a persistent remote access mechanism on compromised systems by installing the PAExec service to execute commands remotely. This behavior fits within the MITRE ATT&CK framework under the tactic "Execution" (TA0002) and the technique "Remote Service Session" (T1569.002).

  The primary telemetry source is the Windows Security Event Log, specifically Event ID 7045, which logs the creation of new services. If malicious, the installation of this service can lead to unauthorized access and control over the system. Importantly, this detection does NOT confirm that the activity is malicious by itself; legitimate administrative use of PAExec can also trigger this alert.

  ### Investigation Steps

  - **Check Event ID 7045 Logs:** Review Windows Event Logs for Event ID 7045. Look for any newly installed services beginning with "PAExec-". Verify the timestamp and the account used to install the service.

  - **Analyze Service Configuration:** Confirm the service's ImagePath. A legitimate install would typically appear as `C:\WINDOWS\PAExec-<name>`. Investigate any unusual paths or accounts associated with the installation.

  - **Correlate with User Activity:** Cross-reference the installation event with historical user activity logs (e.g., Logon events ID 4624 or 4648). Determine if the user account has a legitimate reason to install this service.

  - **Identify Malicious Indicators:** Look for known malicious hashes or signatures associated with PAExec. If the service name matches any other indicators from threat intelligence or internal investigations, flag them as suspicious.

  - **Review Active Services:** Use `Get-Service` or similar commands in PowerShell to list currently running services. Look for signs of other rogue or unexpected services that may indicate a broader compromise.

  - **Assess Legitimate Situations:** Document instances where PAExec is legitimately used in your organization, such as for remote administration by security teams. Establish baselines to differentiate between normal and suspicious behavior.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of persistent remote access to the affected systems. Since PAExec can be weaponized for unauthorized execution of commands, the likelihood of malicious abuse is moderate. Organizations should prioritize alerts based on the sensitivity of the affected systems and review past usage of PAExec to avoid false positives.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the service or using legitimate administrative activity to mask malicious intent. Reliable detection requires proper logging configurations for Windows Event Logs, specifically ensuring that Event ID 7045 is being captured. Legitimate usage scenarios for PAExec may occur within the organization, such as during managed service provider operations. A related detection could involve monitoring for command execution from the newly created service, providing a fuller context of system integrity.

