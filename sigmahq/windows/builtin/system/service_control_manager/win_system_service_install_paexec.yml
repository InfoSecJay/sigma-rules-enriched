title: PAExec Service Installation
id: de7ce410-b3fb-4e8a-b38c-3b999e2c3420
status: test
description: Detects PAExec service installation
references:
- https://www.poweradmin.com/paexec/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-26
tags:
- attack.execution
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_image:
  - ServiceName|startswith: 'PAExec-'
  - ImagePath|startswith: 'C:\WINDOWS\PAExec-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies installations of the PAExec service on Windows systems. PAExec is a tool commonly used for executing commands on remote systems, which can pose a significant threat if used maliciously. Attackers may utilize PAExec to gain access to and control over remote systems within the network, allowing them to execute procedures that could lead to data theft, lateral movement, or further exploitation. This behavior aligns with tactics such as Execution and Persistence, where attackers seek to maintain ongoing access to affected systems.

  Relevant MITRE ATT&CK techniques include:
  - **T1059.001: Command and Scripting Interpreter: PowerShell** - Commonly used for executing scripts remotely.
  - **T1569.002: Service Execution** - The specific use case of establishing a service for execution purposes.

  Primary data sources for detecting this activity include:
  - **Windows Security Event Logs**, specifically from the Service Control Manager, which logs service installations (Event ID 7045).
  - **Process creation events**, which can help identify the execution of the PAExec application itself.

  ### Investigation Steps
  - **Review Security Event Logs**: Check the Windows Security Event Logs for Event ID 7045 which logs the installation of services, focusing on any entries associated with 'PAExec'.
  - **Analyze Service Configuration**: Investigate the configuration of any detected PAExec services, including their startup types, service accounts used, and dependencies. Look for anomalies that deviate from standard operational configurations.
  - **Examine Process Creation Events**: Collect and review process creation logs to identify instances of PAExec being executed, noting the user account and command-line arguments to assess potential misuse.
  - **Verify Network Connections**: Analyze network traffic to determine if the PAExec service is being used to communicate with remote hosts. Look for unusual outbound connections that could indicate command execution or data exfiltration.

  ### Prioritization
  The severity of this alert is considered medium due to the potential risks posed by unauthorized or malicious installations of remote command execution tools like PAExec. Given that effective exploitation could lead to significant impacts on network security, timely investigation is essential.

  ### Blind Spots and Assumptions
  This detection relies on the presence of Windows Security Event Logs and may not account for environments where logging is insufficiently configured or where Event ID 7045 is not captured. There is an assumption that PAExec installations are indicative of potentially malicious activity; however, legitimate use cases may exist that could result in false positives. Therefore, organizations must ensure comprehensive logging of service management events is enabled for effective detection.

