logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'rundll32.exe'
    - 'shell32.dll'
    - 'shellexec_rundll'
    - 'powershell'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts via the RUNDLL32 command, specifically when initiated through the Service Control Manager (SCM). Attackers often use this technique to facilitate their execution while bypassing detection mechanisms, which can allow them to execute malicious PowerShell scripts for various objectives, such as data exfiltration or lateral movement within a network. This behavior is aligned with MITRE ATT&CK technique T1059.001 (PowerShell) and T1027 (Obfuscated Files or Information).

  The primary telemetry source for this detection is the Windows Event Log, specifically Event ID 7045, which logs events related to service installations. If malicious, the impact could range from data loss to full system compromise. However, it's important to note that the detection of a specific process does not confirm malicious intent without further corroborating evidence, as legitimate applications may also invoke RUNDLL32.

  ### Investigation Steps

  - **Check Event ID 7045:** Review Windows Event Logs for Event ID 7045, focusing on the `Provider_Name` field to confirm it corresponds to the Service Control Manager. Note any unusual or unexpected service names associated with the `ImagePath` containing `rundll32.exe`.

  - **Analyze ImagePath parameters:** Identify and validate the full command-line arguments for any `rundll32.exe` processes, especially looking for paths containing `shell32.dll` or `shellexec_rundll`. Legitimate usages will likely invoke standard system processes without unusual parameters.

  - **Evaluate PowerShell execution:** Cross-reference logged data for concurrent PowerShell executions initiated from unusual parent processes or service accounts. Look for the presence of obfuscation techniques, such as Base64 encoding in command outputs.

  - **Review recent software installations:** Check for recent or unexpected service installations using the `Get-WmiObject -Class Win32_Service` PowerShell command. Malicious activity might correlate with services running from unusual directories or by unknown authors.

  - **Investigate related processes:** Use Sysmon logs (Event ID 1) to map process creation for `rundll32.exe` and any child processes it spawns. Malicious indicators include suspicious child processes initiating network connections or attempting to access sensitive files.

  ### Prioritization

  This alert should be considered medium severity due to the potential for high impact across enterprise systems if executed maliciously. The likelihood of abuse is realistic, as attackers commonly exploit RUNDLL functionality to obfuscate malicious PowerShell commands in a stealthy manner.

  ### Blind Spots and Assumptions

  Detection limitations may result from obfuscation techniques that mask the actual intent of the executable. Ensure Windows Event Logs are configured to capture Event ID 7045 accurately. Legitimate administrative tasks, such as service management, could trigger this alert. A related detection to consider for enhanced coverage includes monitoring for unusual PowerShell execution patterns to detect additional forms of obfuscation (T1059.001).

