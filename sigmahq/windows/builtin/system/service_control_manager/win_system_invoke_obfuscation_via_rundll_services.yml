note: |
  ---

  ### Technical Context

  This rule detects the execution of potentially obfuscated PowerShell commands initiated via the rundll32.exe process, specifically when scheduled by the Service Control Manager (Event ID 7045). The behavior suggests an attacker may be attempting to bypass standard security controls, execute malicious scripts, or gain initial access to a system. The relevant MITRE ATT&CK techniques are "T1027: Obfuscated Files or Information" and "T1059.001: Command and Scripting Interpreter: PowerShell." Primary telemetry sources include Windows Security Event logs, specifically Event ID 7045, detailing service creation. If malicious, such actions could lead to unauthorized code execution and compromise system integrity. Importantly, this alert does NOT confirm that the activity is malicious by itself.

  ---

  ### Investigation Steps

  - **Validate Event ID 7045 details:** Review Windows Security Event Logs (Event ID 7045) to collect details such as the service name, ImagePath, and user context. Look for specific strings such as "rundll32.exe" combined with "powershell" — these indicate potential malicious usage.

  - **Check for known paths:** Correlate the ImagePath against known safe execution paths (e.g., `C:\Windows\System32\rundll32.exe`). Any deviations or unusual path locations may indicate malicious activity.

  - **Assess PowerShell logs:** Review Windows PowerShell logs (Event ID 4104) to analyze command history and script execution. Legitimate use cases may include admin scripts, while suspicious commands concerning obfuscation or invocation via rundll32.exe should be flagged.

  - **Look for process creation anomalies:** Use Sysmon logs (Event ID 1) to identify processes spawned by rundll32.exe. Check parent processes for any unauthorized or unexpected origins, supporting indicators of possible lateral movement or persistence mechanisms.

  - **Monitor for service creation frequency:** Identify patterns or multiple instances of Event ID 7045 within a short time frame related to processes involving rundll32.exe. Increased frequency may suggest an attacker attempting to establish multiple footholds.

  - **Review attacker objectives:** Determine if there are known recent incidents involving similar techniques (T1027, T1059.001) in your environment. Understanding attacker methodology can help in assessing the urgency and potential impact.

  ---

  ### Prioritization

  This alert is of medium severity due to its potential association with advanced evasion techniques manifested through obfuscated PowerShell execution. Given the critical role of the affected system in enterprise environments, this behavior poses a moderate risk of exploitation but may commonly be exploited in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via custom or less common methods of PowerShell execution that do not utilize the rundll32.exe methodology. Reliable detection requires accurate logging of Service Control Manager events and PowerShell execution logs. Legitimate administrative tasks using PowerShell may inadvertently trigger the alert, which should be considered during analysis. A companion detection to consider is monitoring for changes in execution policy via Event ID 4103 to strengthen coverage against PowerShell abuse.

