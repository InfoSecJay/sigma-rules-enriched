title: Invoke-Obfuscation RUNDLL LAUNCHER - System
id: 11b52f18-aaec-4d60-9143-5dd8cc4706b9
status: test
description: Detects Obfuscated Powershell via RUNDLL LAUNCHER
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task 23)
author: Timur Zinniatullin, oscd.community
date: 2020-10-18
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'rundll32.exe'
    - 'shell32.dll'
    - 'shellexec_rundll'
    - 'powershell'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell commands launched via the RUNDLL launcher, which can indicate attempts at evading detection by adversaries. The execution of PowerShell through RUNDLL is a tactic often employed by threat actors to execute malicious scripts without triggering traditional security alerts. Attackers leverage this method to achieve objectives such as executing payloads, circumventing security controls, and maintaining persistence in a targeted environment.

  In terms of MITRE ATT&CK, this detection rule is relevant to the following tactics and techniques: **Defense Evasion** (TA0005), specifically **Obfuscated Files or Information** (T1027), and **Execution** (TA0002) focusing on **PowerShell** (T1059.001). These techniques illustrate common approaches adversaries take to hide their activities from defenders, emphasizing the importance of monitoring for such behaviors.

  The primary telemetry sources for detecting this behavior include Windows System event logs, particularly those capturing event ID 7045 related to service control management. This log hosts the details needed to understand when RUNDLL is invoked in suspicious contexts.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows System event logs for Event ID 7045 and look for instances involving 'rundll32.exe' alongside the presence of 'shell32.dll' or 'powershell' in the process execution path.
  - **Analyze Process Execution**: Examine the execution context of the detected processes. Determine if any abnormal parent-child relationships exist, such as RUNDLL processes initiated by unexpected parent processes.
  - **Inspect Command Line Arguments**: If EDR solutions are in place, gather detailed command line arguments for any related processes to understand the exact PowerShell commands executed. Look for signs of obfuscation or unusual script behavior.
  - **Correlate with Other Events**: Cross-reference the detected events against other logs, such as Windows Security logs and network traffic logs, for any associated lateral movement, privilege escalation attempts, or other potentially malicious activities.

  ### Prioritization
  The medium severity of this alert reflects the potential risk posed by obfuscated PowerShell execution. While not all instances indicate imminent threats, their occurrence warrants thorough investigation due to their association with evading security measures and executing malicious operations.

  ### Blind Spots and Assumptions
  This rule may not capture all instances of malicious PowerShell execution, especially if adversaries utilize alternative methods that do not invoke RUNDLL or if they employ legitimate tools in a benign context. The detection logic assumes that event logging for service control management is appropriately configured and that the relevant logs are being collected, which may not always be the case in all environments. Ensuring comprehensive logging configurations and employing supplementary detection mechanisms might be necessary for full coverage of this threat vector.

