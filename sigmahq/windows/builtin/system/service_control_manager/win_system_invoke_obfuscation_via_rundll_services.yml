logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'rundll32.exe'
    - 'shell32.dll'
    - 'shellexec_rundll'
    - 'powershell'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `rundll32.exe` to execute obfuscated PowerShell commands, which is a common technique used by attackers to bypass security controls. This behavior often indicates an attempt to perform malicious actions such as executing scripts for further access, data exfiltration, or lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1027) and Execution (T1059.001).

  The primary telemetry sources for this detection include Windows Event logs related to the Service Control Manager, specifically Event ID 7045 which tracks service installations. If malicious, an attack leveraging this method could compromise the integrity of a system by allowing unauthorized code execution. It’s important to note that this detection alone does not confirm malicious activity; legitimate applications may sometimes employ similar techniques for valid operations.

  ### Investigation Steps

  - **Verify Event ID 7045 details**: Review specific Event ID 7045 logs from the Windows Event Viewer under `System` logs. Look for suspicious `ImagePath` containing `rundll32.exe`, `shell32.dll`, or `powershell`.

  - **Investigate command-line arguments**: If available, correlate with Sysmon Event ID 4688 logs which reveal the command-line executed along with `rundll32.exe`. High-confidence malicious indicators may include obfuscated or hidden PowerShell commands or any base64 encoded strings.

  - **Check service installation log**: Analyze the service name and created timestamp associated with the `Event ID 7045`. Unscheduled or unusual service installations could suggest malicious intent, especially if linked to temporary or non-standard service names.

  - **Review legitimate use cases**: Identify any known valid processes or services that use `rundll32.exe`. Confirm if the logs contain entries for common applications or scripts that would typically invoke `shell32.dll`.

  - **Cross-reference affected systems**: Identify the host's role within the network (e.g., server, workstation) to assess the criticality. A compromised server represents a higher risk than a non-critical workstation.

  - **Look for file artifacts**: Check for temporary files that may have been created during the execution of the PowerShell command. Use file system monitoring tools to find any .tmp or other executable files created during the event time window.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems that may be engaged in sensitive tasks. While the occurrence of obfuscated PowerShell execution through `rundll32.exe` can indicate a sophisticated attack vector, its presence can also be tied to legitimate software. Therefore, analysts should prioritize investigations based on the context of affected systems.

  ### Blind Spots and Assumptions

  This detection may be evaded through various methods, such as using alternative tools or legitimate administrative scripts that utilize `rundll32.exe` without obfuscation, thus staying undetected. Reliable detection requires proper logging configurations across endpoints to capture Event ID 7045 and ensure Sysmon is in use to provide detailed process creation logs. Additionally, benign applications that utilize `rundll32.exe` for legitimate purposes could trigger this alert. A related detection to strengthen coverage could involve monitoring for unusual PowerShell scripts executed in conjunction with other suspicious behaviors, such as unusual PowerShell events (T1059.001).

