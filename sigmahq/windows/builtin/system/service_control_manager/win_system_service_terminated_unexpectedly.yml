title: Important Windows Service Terminated Unexpectedly
id: 56abae0c-6212-4b97-adc0-0b559bb950c3
status: test
description: Detects important or interesting Windows services that got 
  terminated unexpectedly.
references:
- https://www.randori.com/blog/vulnerability-analysis-queuejumper-cve-2023-21554/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-14
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7034     # The X service terminated unexpectedly. It has done this Y time(s).
  selection_name:
        # Note that these names contained in "param1" are "Display Names" and are language specific. If you're using a non-english system these can and will be different
  - param1|contains: 'Message Queuing'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '4d0053004d005100'           # MSMQ (Microsoft Message Queuing). Encoded in upper case just in case
    - '6d0073006d007100'           # msmq
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to
  multiple reasons
level: high
note: |
  ### Technical Context

  This Sigma rule detects unexpected terminations of critical Windows services, specifically targeting the Microsoft Message Queuing (MSMQ) service. The behavior indicates a potential compromise, given that adversaries may terminate essential services to disrupt operations or cover their tracks. This is relevant to the MITRE ATT&CK technique "Service Stop" (T1489).

  Primary telemetry sources include Windows Event Logs, specifically Security Event ID 7034 generated by the Service Control Manager, which documents unexpected terminations of services. If malicious, the impact could be significant, affecting reliability and availability of services dependent on MSMQ, potentially leading to data loss or exploitation of further vulnerabilities. It is crucial to note that this detection alone does not confirm malicious activity; further investigation is needed to ascertain context and intent.

  ### Investigation Steps

  - **Review Windows Event Logs:** Examine Security Event ID 7034 for the termination of MSMQ. Note the surrounding events (Event IDs 7036 and 7035) to understand the service’s previous state and other related activities.

  - **Investigate logged user actions:** Cross-reference the termination event time with user activity logs (e.g., Event ID 4624 for logon). Determine if the activity correlates with administrative user logins that may indicate legitimate service management.

  - **Identify potential malicious indicators:** Look for repetitive unexpected service terminations (e.g., multiple Event ID 7034 entries) within a short timeframe. Such behavior could indicate an adversary attempting to disrupt services or introduce instability.

  - **Analyze network activity related to MSMQ:** Investigate network logs for unusual traffic patterns (e.g., unusually high volume or external connections to MSMQ endpoints) around the time of service termination, potentially identifying exfiltration attempts or lateral movement.

  - **Examine host role or asset criticality:** If the system hosting the terminated service is a critical application server, the response should be prioritized due to its potential business impact and susceptibility to further exploitation.

  - **Assess legitimate activities:** Most benign service management occurs during planned maintenance, typically logged with details on administrative actions (Event ID 7036: Service Started) shortly before any termination events.

  ### Prioritization

  The alert is considered high severity due to the potential for service disruption on critical systems and the likelihood of service terminations being exploited in attacks. This behavior is not commonly benign and is often weaponized to gain footholds or evade detection during malicious activities.

  ### Blind Spots and Assumptions

  Detection may be evaded through services being stopped by legitimate processes or applications that may mislead analysis. Required log sources must include comprehensive Service Control Manager events to ensure accurate monitoring. Legitimate administrative activities, such as scheduled maintenance, may trigger similar alerts. A related detection to enhance coverage would be the monitoring of "Service Start" events to identify patterns of service management that can indicate both benign and malicious behavior.

