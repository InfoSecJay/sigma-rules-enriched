title: Important Windows Service Terminated Unexpectedly
id: 56abae0c-6212-4b97-adc0-0b559bb950c3
status: test
description: Detects important or interesting Windows services that got terminated
  unexpectedly.
references:
- https://www.randori.com/blog/vulnerability-analysis-queuejumper-cve-2023-21554/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-14
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7034     # The X service terminated unexpectedly. It has done this Y time(s).
  selection_name:
        # Note that these names contained in "param1" are "Display Names" and are language specific. If you're using a non-english system these can and will be different
  - param1|contains: 'Message Queuing'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '4d0053004d005100'           # MSMQ (Microsoft Message Queuing). Encoded in upper case just in case
    - '6d0073006d007100'           # msmq
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to multiple
  reasons
level: high
note: |
  ### Technical Context
  This rule detects unexpected terminations of important Windows services, specifically targeting the Microsoft Message Queuing (MSMQ) service. An attacker may aim to disrupt or manipulate messaging services to hinder business operations or to cover tracks after conducting other malicious activities. By terminating services tied to critical infrastructure, threat actors can leverage their actions as a stepping stone toward further infiltration or persistence within the network.

  Relevant tactics include **Defense Evasion** (T1203), as attackers often attempt to disable security services or critical system functions to evade detection or response mechanisms. This rule primarily gathers data from Windows Event logs, specifically looking for Event ID 7034 recorded by the Service Control Manager. Such logs are critical as they not only indicate service outages but could also alert analysts to the potential misuse of services tied to communication and application layer controls.

  ### Investigation Steps
  - **Review Event Logs:** Examine the Service Control Manager logs for Event ID 7034 entries. Pay special attention to the timestamps and service names involved in unexpected terminations.
  - **Correlate with Active Incidents:** Compare the logs to any ongoing incidents that may correlate with the service terminations. Look for patterns in timing and other associated events.
  - **Inspect System Integrity:** Investigate any changes in the system configurations or installations around the time of the service termination. Check for modifications that could indicate malicious configuration changes.
  - **Analyze Network Activity:** Evaluate outbound traffic for anomalies or communication with known malicious IPs or domains immediately following the service terminations to identify potential data exfiltration or command and control activities.

  ### Prioritization
  The alert's high severity is justified in an enterprise environment due to the potential severe impact on business operations if crucial services are unexpectedly terminated, coupled with the likelihood of these events being indicators of larger deception or attack strategies.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, as legitimate service interruptions can occur for various benign reasons in typical operational scenarios. The detection logic assumes that the terminated services are critical and that no legitimate administrative actions caused the termination, which may not always hold true. The rule requires proper logging configuration of Windows Event IDs to ensure that the Service Control Manager logs are consistently recorded and available for analysis.

