title: Important Windows Service Terminated Unexpectedly
id: 56abae0c-6212-4b97-adc0-0b559bb950c3
status: test
description: Detects important or interesting Windows services that got 
  terminated unexpectedly.
references:
- https://www.randori.com/blog/vulnerability-analysis-queuejumper-cve-2023-21554/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-14
tags:
- attack.stealth
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7034     # The X service terminated unexpectedly. It has done this Y time(s).
  selection_name:
        # Note that these names contained in "param1" are "Display Names" and are language specific. If you're using a non-english system these can and will be different
  - param1|contains: 'Message Queuing'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '4d0053004d005100'           # MSMQ (Microsoft Message Queuing). Encoded in upper case just in case
    - '6d0073006d007100'           # msmq
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to
  multiple reasons
level: high
note: |
  ### Technical Context

  This Sigma rule detects unexpected terminations of significant Windows services, specifically targeting the Microsoft Message Queuing (MSMQ) service. The likely objective of an attacker in terminating such a service may include disrupting communication channels or masking malicious activities that utilize MSMQ for data exfiltration. This behavior is relevant to the MITRE ATT&CK tactic of "Defense Evasion" (ID: T1203) and the technique "Masquerading" (ID: T1123), as attackers may disable services to avoid detection.

  The primary telemetry sources are Windows Security Event Logs, specifically looking for Event ID 7034, which indicates that a service terminated unexpectedly. If malicious, this could disrupt legitimate application functionalities and signal further underlying compromise or misconfiguration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may also terminate services due to system updates or errors.

  ### Investigation Steps

  - **Review Event Logs for Termination Events:** Check for Windows Event ID 7034 within the Security Event Logs, specifically filtering for instances where "param1" includes 'Message Queuing'. Legitimate terminations might show patterns correlating with application maintenance.

  - **Cross-check Service Status:** On affected systems, use `Get-Service` in PowerShell to confirm if the MSMQ service is currently stopped or in a non-operational state. A stopped service post-termination may indicate suspicious activity, especially if it has not been planned.

  - **Investigate System Change Trends:** Review the timeline of system changes around the time of the alert. Look for other related events, such as Event ID 7040, which indicates a change in service configuration. This could reveal whether someone intentionally modified service parameters.

  - **Identify Application Dependencies:** Determine if critical applications relying on MSMQ are affected. Affected business services could signal a higher priority for investigation, particularly if there are concurrent alerts or failures in related system components.

  - **Search for Malicious Indicators:** Look for correlation with Network events such as unusual outbound communications (e.g., C2 traffic) that may have coincided with the service termination. Also, analyze for any spawned processes related to MSMQ that appear unusual during the timeframe, especially those with Event ID 4688 (process creation).

  ### Prioritization

  The alert is high-severity due to the potential operational impact of terminating essential services like MSMQ, which are integral to application communication. The likelihood of malicious abuse is significant, as attackers often target services to disrupt functionality or traffic. This behavior can frequently be weaponized in attacks aiming for lateral movement or data theft.

  ### Blind Spots and Assumptions

  Detection may be limited if logging of service termination events or security event logs is not adequately configured. Legitimate application crashes or manual stoppages during maintenance may trigger the same alert, leading to false positives. A relevant companion detection would be tracking for unusual user logins or administrative access around the time of the service termination to strengthen the overall alerting system.

