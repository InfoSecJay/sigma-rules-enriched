logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - ' -nop '
    - ' -sta '
    - ' -w hidden '
    - ':\Temp\'
    - '.downloadfile('         # PowerShell download command
    - '.downloadstring('         # PowerShell download command
    - '\ADMIN$\'
    - '\Perflogs\'
    - '&&'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious commands used for the installation of services on Windows systems, which may indicate malicious activity. Attackers often leverage service installations to establish persistence on a compromised system, allowing them to maintain access and execute further malicious commands. Given the specific command patterns this rule looks for, it is likely that the suspected threat actors are employing PowerShell or other scripting techniques for service installation with the intent of evading detection.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1543.003)**: The creation of a new service can serve as a method for attackers to persist on a victim's system after initial compromise.
  - **Privilege Escalation (T1068)**: Manipulating service installations may enable attackers to gain elevated privileges, especially if they create or modify services under a higher-privileged user context.

  Primary data sources that will contain the best evidence include:
  - Windows Security Event Logs (specifically looking for EventID 7045) as these log attempted installations of services and can capture the exact command used.
  - System event logs may also provide context on other related events occurring before or after the service installation.

  ### Investigation Steps
  - **Review Security Event Logs**: Examine Windows Security Event Logs for EventID 7045 entries that match the specified criteria. Pay special attention to the `ImagePath` for any suspicious arguments or locations.
  - **Analyze Recent Service Changes**: Investigate recently installed or modified services using PowerShell commands like `Get-Service` and correlate with EventID 7045 findings. Look for common indicators of compromise, such as service names or paths that appear unusual.
  - **Check Process Creation Logs**: Use process creation logs from EDR solutions to track the execution of PowerShell commands pertaining to service installations. Look for anomalous parent-child relationships in the process tree.
  - **Correlate with User Account Activity**: Identify the user account associated with the service installation to determine if it's a legitimate administrator or a compromised account. This can provide insight into the risk level and context behind the service installation.

  ### Prioritization
  Given that this detection rule is marked as high severity, it is critical in an enterprise environment because malicious service installations can allow attackers to maintain persistence, leading to further exploits and potential data breaches. The impact of such activities can be severe, with high potential for account compromise and lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection may have gaps if the logging of EventID 7045 is not enabled or configured correctly, potentially leading to missed malicious service installations. The detection assumes that all services installed with suspicious patterns are malicious, which may overlook legitimate administrative activities; thus, further context from additional logs is crucial. Adequate auditing of Windows Event Logs must be enabled to ensure coverage for this alert to function effectively.

