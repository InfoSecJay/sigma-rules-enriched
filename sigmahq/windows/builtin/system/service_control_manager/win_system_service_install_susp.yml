logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - ' -nop '
    - ' -sta '
    - ' -w hidden '
    - ':\Temp\'
    - '.downloadfile('         # PowerShell download command
    - '.downloadstring('         # PowerShell download command
    - '\ADMIN$\'
    - '\Perflogs\'
    - '&&'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the installation of suspicious services via the Windows Service Control Manager, focusing on specific command patterns often associated with malicious activity. Attackers typically create services to maintain persistence or conduct privilege escalation, which aligns with the MITRE ATT&CK tactic for Persistence (T1543.003). The primary telemetry source is Windows Event ID 7045, which logs service installation events. A successful breach might lead to unauthorized control over critical systems, potentially impacting confidentiality, integrity, and availability. This detection does NOT confirm that the activity is solely malicious without further investigation.

  ### Investigation Steps

  - **Review service installation details**: Check Windows Event ID 7045 logs for fields such as `ServiceName`, `ImagePath`, and `User`. Look for entries containing suspicious strings like ` -nop ` or paths pointing to temporary directories (e.g., `:\Temp\`).

  - **Identify high-confidence malicious indicators**: A service created with the image path containing `-w hidden` or PowerShell commands such as `.downloadfile(` points to likely malicious behavior. Each case should be escalated immediately.

  - **Examine historical context**: Cross-reference the timestamps of the events with known initial access vectors or other suspicious activity (e.g., failed login attempts) in Security Event ID 4625.

  - **Evaluate legitimate services**: Verify if the service being created corresponds to expected applications, such as legitimate software updates or system maintenance tasks. Legitimate services might include entries from trusted vendors, with no suspicious command-line parameters.

  - **Investigate the user account**: Check the user account associated with the service creation to determine if it has administrative privileges and if its behavior aligns with authorized administrative patterns.

  ### Prioritization

  This alert is classified as high severity due to the potential for unauthorized persistence and privilege escalation on critical systems. Given the common use of service installations in attack scenarios, there is a high likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using valid administrator credentials to obscure their actions. Ensure Windows Event Logging is configured correctly, specifically for Service Control Manager logs (Event ID 7045), to capture all relevant data. Legitimate software installations, particularly from trusted vendors, may trigger this alert, necessitating thorough context checks. A related detection for anomalous command execution (e.g., PowerShell command logging) can provide a fuller picture of the incident.

