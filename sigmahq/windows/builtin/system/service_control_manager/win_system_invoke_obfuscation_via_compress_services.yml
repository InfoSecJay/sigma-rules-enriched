logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    - 'readtoend'
    ImagePath|contains:
    - ':system.io.compression.deflatestream'
    - 'system.io.streamreader'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands leveraging .NET compression techniques to execute potentially malicious scripts. The likely attacker objective is to execute code stealthily, avoiding detection by traditional security mechanisms. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1027) specifically related to Execution (T1059.001) through obfuscation techniques. The primary telemetry sources include Windows System logs with Event ID 7045, capturing indications of new service installations via the Service Control Manager. If malicious, this behavior can lead to unauthorized access, data exfiltration, and further compromise. However, this detection does NOT confirm malicious intent on its own, as similar techniques might be used in legitimate administrative tasks.

  ### Investigation Steps

  - **Verify the Event ID and Source:** Check for Windows Event ID 7045 in the System logs from the affected host. This event indicates a new service installation, which is essential to confirm that the alert is relevant.

  - **Identify PowerShell Command Execution:** Review the `ImagePath` field in Event ID 7045 for the presence of terms like `new-object`, `text.encoding]::ascii`, and `readtoend`. Legitimate PowerShell scripts may invoke compression, but errant use of these terms could indicate suspicious activity.

  - **Assess Endpoint Role:** Determine the role of the affected system (e.g., server, endpoint, admin workstation). Elevated privilege use on non-administrative assets could indicate malicious activity.

  - **Look for Known Malicious Indicators:** Investigate any occurrence of `System.IO.Compression.DeflateStream` and `System.IO.StreamReader` in combination with obfuscation techniques. These often correlate with malicious PowerShell executions targeting remote systems.

  - **Review Historic Process Behavior:** Analyze process creation logs (Event ID 4688 or Sysmon Event ID 1) to verify if the PowerShell process initiated through this mechanism has shown unusual invocation patterns or connections to known malicious IPs.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on systems that are critical for business operations. The behavior detected can be indicative of an active security incident, as obfuscated PowerShell commands are commonly associated with malicious activities. Attackers frequently employ such techniques to evade detection mechanisms, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative activities that utilize similar PowerShell behaviors. Ensure system logging configurations adequately capture Service Control Manager events to maintain reliable detection. Additionally, common administrative scripts might trigger similar alerts, requiring context regarding the environment and intentions of the users. Related detections for malicious PowerShell usage should be in place (e.g., detecting unusual PowerShell script executions) to enhance coverage and contextual understanding.

