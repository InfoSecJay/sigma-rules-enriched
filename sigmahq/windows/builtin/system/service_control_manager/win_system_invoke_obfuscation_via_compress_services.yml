title: Invoke-Obfuscation COMPRESS OBFUSCATION - System
id: 175997c5-803c-4b08-8bb0-70b099f47595
status: test
description: Detects Obfuscated Powershell via COMPRESS OBFUSCATION
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task 19)
author: Timur Zinniatullin, oscd.community
date: 2020-10-18
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    - 'readtoend'
    ImagePath|contains:
    - ':system.io.compression.deflatestream'
    - 'system.io.streamreader'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of obfuscated PowerShell commands that leverage the `COMPRESS` obfuscation technique to disguise potentially malicious behavior. Attackers often use obfuscation to hide their intentions and evade detection by security tools. The use of `new-object`, `text.encoding]::ascii` and `readtoend` in conjunction with system IO compression functions presents a strong indicator of an attempt to execute malicious scripts or payloads while attempting to bypass security measures.

  This behavior is likely associated with various threat actors focusing on defense evasion tactics, aiming to execute malicious code without raising alarms. Attackers may be seeking to establish persistence, escalate privileges, or exfiltrate data—all actions that compromise the integrity, confidentiality, and availability of the target environment. Relevant MITRE ATT&CK tactics for this detection include:
  - **Defense Evasion (T1560)**: Using obfuscation techniques to hide the execution of scripts.
  - **Execution (T1059.001)**: Running PowerShell commands as a method to execute malicious payloads.

  Key telemetry sources for this detection include Windows Event logs, specifically the System log where Event ID 7045 records service creation events.

  ### Investigation Steps
  - **Review Event Logs**: Check for Event ID 7045 in Windows System logs to identify instances of newly created services with suspicious PowerShell commands.
  - **Analyze PowerShell Activity**: Determine if any other PowerShell logs or command history files indicate additional obfuscation patterns or related malicious script execution.
  - **Correlate with Network Activity**: Look for outbound network connections that coincide with the timestamp of the obfuscation detection to identify potential command and control (C2) communication.
  - **Examine File System Changes**: Investigate any changes to files or directories that may correspond with the execution of the obfuscated PowerShell commands, including any newly created or modified scripts.

  ### Prioritization
  The alert is considered medium severity due to the potential risk posed by obfuscated PowerShell execution, which may facilitate various malicious activities within an enterprise environment. While obfuscation can also be a sign of legitimate use for scripting purposes, the presence of these indicators warrants close attention and investigation given the existing threat landscape.

  ### Blind Spots and Assumptions
  This detection may not catch all instances of obfuscated PowerShell; specifically, it may miss variations of obfuscation techniques that do not utilize the exact strings identified in the rule. It assumes that PowerShell is used in a way that triggers Event ID 7045, and thus may not detect obfuscation via other methods or scripting platforms. It’s crucial for logging of PowerShell activity and service creation events to be enabled in the environment for effective detection and response capabilities.

