logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    - 'readtoend'
    ImagePath|contains:
    - ':system.io.compression.deflatestream'
    - 'system.io.streamreader'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a Windows service that uses PowerShell obfuscation techniques specifically leveraging the `.NET` compression stream classes for executing potentially malicious scripts. The behavior indicates that an attacker may be attempting to conceal their actions or payloads, ensuring detection avoidance. This falls under the MITRE ATT&CK framework's "Obfuscated Files or Information" technique (T1027) and utilizes the "Command-Line Interface" tactic (T1059.001) for execution.

  Primary telemetry sources include Windows Event Logs, specifically Event ID 7045 from the Service Control Manager, which logs service creation details. If malicious, this could facilitate unauthorized access or control over the affected system. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also use similar obfuscation techniques.

  ### Investigation Steps

  - **Check Event ID 7045 for new services**: Review Windows Event Logs for Event ID 7045 on the affected system, noting any entries that match the search criteria for PowerShell obfuscation patterns (focus on ImagePath containing 'new-object', 'text.encoding]::ascii', 'readtoend', etc.).

  - **Inspect the command line used**: If using Sysmon, review Sysmon Event ID 1 for the process associated with the newly created service, paying close attention to the CommandLine field for additional obfuscation indicators or suspicious parameters.

  - **Analyze parent-child process relationships**: Verify Process Creation logs and assess the parent-child relationship. Expected benign behavior typically shows powershell.exe spawned through known scripts or legitimate administrative tools (check for expected parent processes like cmd.exe or powershell.exe).

  - **Identify high-confidence malicious indicators**: Look for obfuscated PowerShell commands containing construction patterns such as base64 encoded strings or other hard-to-read formats, especially if querying unauthorized external resources (could indicate data exfiltration).

  - **Review host role and criticality**: Consider the asset’s role—Determine if the affected host is a critical system (e.g., domain controller) or an endpoint. Malicious service creation is more concerning on critical systems.

  ### Prioritization

  This alert is medium severity due to its potential to enable stealthy execution of malicious code on potentially critical systems. While the use of obfuscation is not uncommon, the specific technique employed in this alert can be indicative of targeted attacks, notably when observed on enterprise environments where such behavior is not typical.

  ### Blind Spots and Assumptions

  There is a limitation in detecting all legitimate uses of PowerShell obfuscation, which may be common in some operational scripts. Reliable detection requires comprehensive logging to include all event types related to service creation and process execution. Legitimate automation tools or scripts could trigger this alert, potentially leading to false positives. Companion detections such as unusual outbound traffic or lateral movement attempts can augment the investigation of possibly malicious activity.

