note: |
  ### Technical Context

  This Sigma rule detects the obfuscated execution of PowerShell commands using environment variables, specifically through the Windows Service Control Manager logging Event ID 7045. The likely objective of the attacker is to execute malicious scripts stealthily, potentially for data exfiltration or lateral movement while avoiding detection through conventional means. This behavior aligns with the MITRE ATT&CK tactics of "Execution" (TA0002) and "Defense Evasion" (TA0005) using the technique "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter: Windows Command Shell" (T1059.001).

  The primary telemetry sources are Windows Security Event logs, particularly Event ID 7045, showing service installation activities. If this behavior is confirmed as malicious, the security impact could be significant, potentially leading to unauthorized access or control of the affected systems. It is important to note that this detection does NOT confirm that malicious activity has occurred on its own; further investigation is necessary to confirm any malicious intent or impact.

  ### Investigation Steps

  - **Review Event Logs for Installation Activity:** Check Windows Event ID 7045 in the Security logs. Look for recent entries with "ImagePath" values containing "cmd" and along with arguments indicating obfuscated PowerShell commands; focus on logs from high-privilege accounts.

  - **Identify Obfuscated Command Patterns:** Analyze the "ImagePath" field for patterns matching commands that include 'set' followed by obfuscated code; be wary of unusual command lengths or excessive use of escape characters (e.g., backticks).

  - **Examine User Context:** Identify the user associated with the Event ID 7045 entries. Actions performed by service accounts or administrative accounts without a legitimate context may indicate potential evasion or malicious use.

  - **Look for Known Malicious Indicators:** Correlate the detected commands with known attack patterns or behaviors from threat intelligence feeds. Check if the command is associated with active threat actors or malware strains.

  - **Establish Baseline for Legitimate Behavior:** Document typical commands or processes run in your environment by legitimate IT activities. Compare current findings against this baseline to differentiate between malicious and normal behavior.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on critical systems and the likelihood of being used in targeted attacks. The obfuscation of PowerShell commands is a tactic frequently observed among advanced persistent threats (APTs) and other adversaries looking to execute tasks stealthily.

  ### Blind Spots and Assumptions

  The detection may miss attempts using non-obfuscated or legitimate PowerShell commands that manipulate environment variables. Additionally, reliance on Windows Event ID 7045 necessitates proper logging configurations; if not enabled, detections may not trigger as expected. Legitimate activities, such as software installation tasks by system administrators, may mistakenly trigger this alert. Companion detections, such as monitoring for unusual PowerShell cmdlets (using Sysmon or PowerShell logs), could significantly strengthen the coverage against related threats.

