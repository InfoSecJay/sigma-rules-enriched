note: |
  ### Technical Context

  The rule detects the execution of obfuscated PowerShell commands through manipulated environment variables using the Windows Service Control Manager (Event ID 7045). Adversaries typically utilize this technique to execute malicious scripts while attempting to evade detection by obscuring their actions. This behavior aligns with the MITRE ATT&CK techniques for *Defense Evasion* (T1027) and *Execution* (T1059.001), focusing on PowerShell.

  The primary telemetry sources include Windows Security Event logs (Event ID 7045), indicating the installation of a new service. If malicious, such an action can lead to unauthorized access, data exfiltration, or lateral movement within the organization. It is important to note that this detection does NOT confirm malicious activity on its own; it only indicates a potentially questionable command execution behavior.

  ### Investigation Steps

  - **Check the Event Logs for PowerShell Execution:** Look for Windows Security Event ID 7045. Verify if there are additional correlated event logs (e.g., Event ID 4688) that indicate the specific PowerShell command executed. Legitimate executions may include benign scripts or admin-level actions that are regularly scheduled.

  - **Review the Service Creation Details:** Inspect the "ImagePath" associated with Event ID 7045. Malicious entries will often include common commands like `cmd.exe /C` followed by obfuscation patterns, while legitimate services typically reference known applications or system processes.

  - **Analyze the Environment Variables Set by the Command:** Query the currently set environment variables on the host using `Get-ChildItem Env:` in PowerShell. Look for anomalous entries often associated with obfuscation, such as long strings or variables resembling script content.

  - **Correlate with Network Activity:** Examine network logs (e.g., proxy logs or firewall logs) for outbound connections to unusual or suspicious URLs matched with the timestamps of service creation. Host Role criticality is key; servers with sensitive data usage may have stricter thresholds.

  - **Identify Malicious Indicators in Command:** Focus on specific obfuscation patterns within the command execution, such as usage of `Invoke-Expression` and downloading data from external sources via `Net.WebClient`. Look for patterns in decoded URLs or atypical IP addresses.

  ### Prioritization

  This alert is of **high severity** due to the potential for an attacker to execute arbitrary code and gain control over systems within the network. The likelihood of malicious activity is significant, as command obfuscation techniques are commonly weaponized by adversaries to bypass existing defenses.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of `Windows Event Log` configurations, specifically those capturing comprehensive command-line arguments. Common legitimate activities that might trigger the alert include scripted updates or maintenance tasks run by automation tools. A related detection to consider is monitoring for unusual PowerShell scripts or commands, as they together strengthen coverage of potential script-based attacks.

