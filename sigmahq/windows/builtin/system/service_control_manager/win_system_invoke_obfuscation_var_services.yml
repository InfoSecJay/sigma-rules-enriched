note: |
  ### Technical Context
  This rule detects the obfuscated execution of PowerShell commands using environment variables via system event logs, specifically targeting the Service Control Manager. The use of obfuscated commands is a common tactic employed by attackers to evade detection mechanisms while executing unauthorized scripts or malicious payloads. The objective of such actions typically centers around leveraging PowerShell's capabilities for executing payloads that may download additional malware, manipulate the system, or establish persistence.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion (T1027)** and **Execution (T1059.001)**. **Defense Evasion** manifests when attackers attempt to conceal their activities or evade security solutions, while **Execution** involves running malicious scripts or commands on the host operating system. The primary data sources involved in detecting this activity are system event logs generated by Windows, particularly those capturing the execution of Command Line Interface (CLI) commands and related events.

  ### Investigation Steps
  - **Review Event Logs:** Examine Event ID 7045 logs in the Windows System log to identify instances of command line executions involving `cmd` with parameters indicating obfuscated PowerShell commands.
  - **Analyze PowerShell Logs:** Investigate PowerShell logging settings; ensure script block logging and transcription are enabled to capture detailed execution traces and arguments used in suspicious commands.
  - **Inspect Running Processes:** Look for any processes spawned from `cmd.exe` that are executing PowerShell scripts, especially those with obfuscation patterns or unusual argument structures.
  - **Check Network Activity:** Monitor network connections initiated by any processes of interest, correlating unexpected outbound traffic with timestamps of suspicious events to identify potential external communication to command and control (C2) servers.

  ### Prioritization
  The alert is prioritized as high severity due to the significant threat posed by obfuscated PowerShell executions. Successful exploitation through such means can lead to defensive capabilities being circumvented, potential data exfiltration, or system compromise, making immediate investigation critical.

  ### Blind Spots and Assumptions
  This detection may have blind spots related to the execution of obfuscated scripts that do not utilize the identified methods or events. Assumptions include that all uses of PowerShell with `cmd` and environment variables for obfuscation are malicious, which might not always be the case. Additionally, the rule requires comprehensive logging configurations within the Windows environment; without the appropriate logging settings enabled, including those for PowerShell and system events, the detection may fail to capture relevant evidence.

