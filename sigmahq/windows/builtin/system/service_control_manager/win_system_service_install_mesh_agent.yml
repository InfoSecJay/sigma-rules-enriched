title: Mesh Agent Service Installation
id: e0d1ad53-c7eb-48ec-a87a-72393cc6cedc
status: test
description: Detects a Mesh Agent service installation. Mesh Agent is used to remotely
  manage computers
references:
- https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-28
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'MeshAgent.exe'
  - ServiceName|contains: 'Mesh Agent'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of the Mesh Agent service on Windows systems, which is a tool commonly used for remote management of computers. The presence of this service can indicate unauthorized remote access, especially in the context of adversaries leveraging such tools to maintain persistence and control over compromised systems. Attackers may install the Mesh Agent to facilitate further malicious activities, including data exfiltration or deploying additional malware.

  The relevant MITRE ATT&CK tactics for this detection include "Command and Control" (TA0011) and "Remote Services" (T1219.002). These tactics highlight the attacker’s intent to communicate with and control compromised systems remotely, utilizing legitimate software to blend in and evade detection. The primary data sources for this detection are Windows event logs, particularly those corresponding to the Service Control Manager activity, which log changes to system services.

  ### Investigation Steps
  - **Review Event Logs:** Analyze Windows Event Logs (Event ID 7045) for service installation entries. Focus on any recent additions of the Mesh Agent service, paying attention to the time of installation and the context of system activity.
  - **Correlate with Process Activity:** Utilize endpoint detection and response (EDR) tools to investigate process creation logs around the same time the Mesh Agent service was installed. Look for suspicious process activity that may indicate malicious behavior.
  - **Check for Unusual Network Connections:** Examine network traffic originating from the system where the Mesh Agent was installed. Investigate unusual outbound connections, especially to known command-and-control (C2) IP addresses or domains.
  - **Analyze User Accounts:** Assess the user accounts that performed the installation. Identify if the installation was conducted by a legitimate user or an account with unusual access rights, suggesting potential credential compromise or misuse.

  ### Prioritization
  This alert is categorized as medium severity due to its potential impact on system security. The likelihood of misuse is increased in environments where remote management tools are not deployed broadly or where they could facilitate unauthorized access.

  ### Blind Spots and Assumptions
  This detection may not account for legitimate use cases of the Mesh Agent, leading to potential false positives in environments where it is permitted for remote support. The detection logic assumes that installation will be logged correctly; however, discrepancies in logging configurations could impair detection. Additionally, if logs are not retained or properly monitored, the alert may be diminished in effectiveness.

