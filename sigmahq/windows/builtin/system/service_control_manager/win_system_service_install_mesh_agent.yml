logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'MeshAgent.exe'
  - ServiceName|contains: 'Mesh Agent'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of a Mesh Agent service on Windows systems. The detection identifies attempts to configure remote management software that could be leveraged for unauthorized access and control over the host. The likely attacker objective is to establish a persistent backdoor for remote command execution, aligning with the MITRE ATT&CK technique for Command and Control (T1219.002: Remote Access Software).

  Primary telemetry sources include Windows Security Event ID 7045, which logs service installations via the Service Control Manager. If malicious, this behavior could provide adversaries with extensive control over the affected system. Importantly, while this detection alerts on the service installation, it does NOT confirm malicious intent; legitimate uses for remote management tools exist.

  ### Investigation Steps

  - **Check Event ID 7045 details:** Review the Security event logs for Event ID 7045 to confirm the installation of the Mesh Agent service. Verify `ImagePath` contains 'MeshAgent.exe' and `ServiceName` includes 'Mesh Agent' as indicators of possible compromise.

  - **Analyze service behavior:** Determine the purpose of the Mesh Agent installation by evaluating the context of its usage (e.g., deployment via authorized IT management procedures) and associated user accounts.

  - **Identify related scheduled tasks:** Inspect for scheduled tasks associated with the newly installed service, particularly looking for tasks that run with elevated privileges which may indicate malicious intent. Review Task Scheduler logs (Event ID 106), noting `TaskName` and `ExecutionTime`.

  - **Examine recent system changes:** Verify if other unusual changes were made around the same time as the service installation by reviewing Windows Event IDs 4616 and 4697 for modified system settings or installed software.

  - **Document expected behavior:** For legitimacy, record details of known authorized installations of Mesh Agent by IT support personnel. Uptime and usage patterns might help distinguish benign activities from potential threats.

  - **Assess user activity logs:** Cross-reference user activity logs from Windows Event ID 4624 (logon events) to see if the installation coincided with unusual access times or accounts not typically associated with remote management tasks.

  ### Prioritization

  This alert is medium-severity, as an installation of a Mesh Agent service on critical assets may indicate potential malicious activity. The likelihood of this behavior being weaponized is moderate, especially in environments where remote access software is under strict control.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate use of Mesh Agent is common, potentially leading to false positives. Ensuring exhaustive logging configurations for all service-related events and regular updates to detection rules will enhance reliability. Be aware that similar legitimate activities might include authorized IT support using approved remote access software. Companion detections for other remote access tool installations can strengthen overall coverage and context around this alert.

