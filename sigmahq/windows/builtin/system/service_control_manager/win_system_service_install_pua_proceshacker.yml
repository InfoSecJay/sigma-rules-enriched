note: |
  ### Technical Context

  This detection rule identifies the installation of a service associated with ProcessHacker, a tool that can be employed for privilege escalation on Windows systems. The likely objective of an attacker using this tool is to escalate their privileges to LocalSystem, enabling them to bypass standard security controls and gain full control over the system. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Create or Modify System Process** (T1543.003).

  The primary telemetry source for this detection is the Windows System Event Log, specifically Event ID 7045, which logs the creation of a service. If this is a legitimate installation, it could indicate potentially unwanted software; however, if malicious, it poses a significant security impact as it indicates elevated privileges that could be exploited for more extensive attacks. Importantly, this detection does NOT confirm that any malicious activity has occurred; it only indicates that ProcessHacker has been initiated, which could be part of a legitimate administrative process.

  ### Investigation Steps

  - **Check Event ID 7045 Logs for Details:** Examine Windows System Event Log for Event ID 7045 with a ServiceName starting with "ProcessHacker." Look for fields such as **AccountName** and **ServiceName** to determine if the service was indeed created by the LocalSystem account.

  - **Assess Existing Processes:** Use Process Explorer or Task Manager to review currently running processes. Identify any legitimate instances of ProcessHacker in use and note their parent processes for context.

  - **Correlate with Other Security Events:** Search for related security events in the Windows Security Log (Event ID 4624) around the same timestamp to confirm user logins (account name) and system actions (like privilege escalation attempts) preceding the service creation.

  - **Identify Malicious Indicators:** Look for unexpected network connections or external commands executed by the "ProcessHacker" service, potentially using Sysmon logs (Event ID 22) to capture socket creation details and exfiltration attempts.

  - **Evaluate User Context and Alert Relevance:** Investigate the context of the service creation; if it is tied to a common administrative task or is an unexpected action by a service account. Malicious usage often lacks justification or is initiated under suspicious pretexts.

  - **Document and Analyze Anomalous Behavior:** If a user account or service is consistently associated with ProcessHacker installations without legitimate reason, categorize that as potential malicious activity and consider further action such as user education or endpoint isolation.

  ### Prioritization

  This alert carries high severity due to the potential for privilege escalation on critical systems that can enable attackers to execute further malicious actions. The likelihood of abuse is notable given the weaponization of tools like ProcessHacker in common attack scenarios, particularly among sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by user permission changes that prevent complete log visibility. Evasion techniques could include renaming the ProcessHacker executable or utilizing other tools with similar functionality. Legitimate activities may trigger this alert if administrator actions inadvertently engage ProcessHacker. A related detection to consider is the monitoring of other privileged actions, such as service creation (Event ID 7045) or elevated command executions (Event ID 4688, Sysmon Event ID 1), to strengthen overall detection coverage.

