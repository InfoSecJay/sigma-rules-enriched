note: |
  ### Technical Context
  This rule detects the usage of the ProcessHacker tool, known for its ability to manipulate system processes and elevate privileges. By monitoring for events indicating that a service associated with ProcessHacker has been created under the LocalSystem account, this detection aims to identify potential malicious activities where an attacker employs this tool to gain elevated privileges, bypassing standard security controls. The threat scenario typically involves an attacker attempting to maintain persistence on a compromised system or to facilitate further malicious actions by modifying system services or process control.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence (T1543.003)**: This technique involves creating or modifying system services to persist malicious capabilities.
  - **Execution (T1569.002)**: Indicates that an attacker may be executing unauthorized applications or scripts, often to control or observe system behavior.
  - **Privilege Escalation**: While not specific, privilege escalation techniques are central to the functionality of ProcessHacker, which allows unauthenticated users to escalate rights.

  Primary data sources for evidence include Windows Event Logs from the Service Control Manager, particularly Events with Event ID 7045, which document the creation of new services and are pivotal in revealing unauthorized privilege elevation attempts.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Event Logs for Event ID 7045 that record service creation events. Focus on entries where the `ServiceName` starts with 'ProcessHacker' and the `AccountName` is 'LocalSystem'.
  - **Investigate Service Properties:** Analyze the details of the created service. Look for unusual parameters or paths that can indicate malicious intent or misconfigurations.
  - **Cross-Reference User Activity:** Review other logs or telemetry that show user activity around the time the service was created, such as process creation events or authentication activities, to assess if there was suspicious behavior prior to or immediately following the event.
  - **Identify Related Processes:** Utilize EDR tools to identify if any other processes were spawned by the ProcessHacker service. Track any further privilege escalation attempts or unusual network connections that might indicate lateral movement.

  ### Prioritization
  The alert is categorized as high severity due to the potential for significant impact on system integrity and data security. ProcessHacker's functionality can enable attackers to maintain access, exfiltrate data, or further their control over the network by leveraging elevated privileges.

  ### Blind Spots and Assumptions
  The detection relies on the creation of specific services, meaning it may not capture all scenarios of privilege escalation or use of ProcessHacker, especially if attackers modify the service name or do not utilize Windows service creation mechanisms. Assumptions include that sufficient logging for the Service Control Manager is enabled and properly configured to capture Event ID 7045. Lack of comprehensive logging, such as missing event logs or configurations that suppress Service Control Manager events, could lead to missed detections.

