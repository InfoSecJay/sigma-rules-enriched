title: Meterpreter or Cobalt Strike Getsystem Service Installation - System
id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting
  a specific service installation
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
date: 2019-10-26
modified: 2023-11-15
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: system
detection:
  selection_id:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_cli_cmd:
        # meterpreter getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1b (expanded %COMSPEC%): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    ImagePath|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    ImagePath|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_cli_rundll:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    ImagePath|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  selection_cli_share:
    ImagePath|startswith: '\\\\127.0.0.1\\ADMIN$\'      # https://twitter.com/svch0st/status/1413688851877416960?lang=en
  condition: selection_id and 1 of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential exploitation attempts utilizing the `getsystem` command from Meterpreter or Cobalt Strike, specifically within the context of service installations on Windows systems. Attackers often use the `getsystem` command to escalate privileges and gain administrative rights on compromised machines. Once they have elevated privileges, they can install persistent malware or further exploit the environment by manipulating services.

  The relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Privilege Escalation (TA0004)**: The process of gaining elevated access to resources that are normally protected from privileged users.
    - **T1134.001**: Use of `getsystem` within Meterpreter.
    - **T1134.002**: Use of Cobalt Strike for privilege escalation.

  The primary data sources for detecting this behavior include Windows Event Logs, particularly logs from the Service Control Manager, which record service installations, and command execution logs capturing unusual command patterns indicative of malicious activity.

  ### Investigation Steps
  - **Review Windows Event Logs**: Check the Security and System logs for Event ID 7045, which indicate service installations that might show signs of privilege escalation attempts associated with `getsystem`.
  - **Analyze Command Execution Logs**: Look for command execution patterns in Security logs or via EDR that match known variants of `cmd.exe /c echo` and `rundll32.exe` commands linked to Meterpreter or Cobalt Strike.
  - **Investigate Network Shares**: Determine if there are unsanctioned connections to administrative shares (e.g., `\\127.0.0.1\ADMIN$`) that could indicate backdoor access or tampering with services.
  - **Correlate with Threat Intelligence**: Cross-reference any identified indicators with threat intelligence feeds for known Cobalt Strike or Meterpreter usage, verifying whether other alerts are present.

  ### Prioritization
  Given that successful execution of the `getsystem` command can lead to significant compromise of a host, including the installation of backdoors or persistent threats, alerts triggered by this detection rule are considered high severity in an enterprise environment.

  ### Blind Spots and Assumptions
  This rule may have limited detection coverage if the logs needed for its function are not enabled or if the services are installed silently or without appropriate logging. The detection logic assumes that the Event ID 7045 and command invocation patterns are reliable indicators of malicious behavior; however, in benign circumstances, legitimate administrative actions could generate similar logs. Ensuring comprehensive logging and monitoring of service activities, command executions, and network share access is crucial for accurate detection.

