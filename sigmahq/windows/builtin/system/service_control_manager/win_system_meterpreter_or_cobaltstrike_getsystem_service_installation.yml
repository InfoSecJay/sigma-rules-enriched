title: Meterpreter or Cobalt Strike Getsystem Service Installation - System
id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service installation
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
date: 2019-10-26
modified: 2023-11-15
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: system
detection:
  selection_id:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_cli_cmd:
        # meterpreter getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1b (expanded %COMSPEC%): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    ImagePath|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    ImagePath|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_cli_rundll:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    ImagePath|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  selection_cli_share:
    ImagePath|startswith: '\\\\127.0.0.1\\ADMIN$\'      # https://twitter.com/svch0st/status/1413688851877416960?lang=en
  condition: selection_id and 1 of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of a Windows service associated with privilege escalation attempts using Meterpreter or Cobalt Strike's `getsystem` command. The behavior indicates potential exploitation of vulnerabilities to gain elevated privileges on a target system, aligning with the MITRE ATT&CK tactic of Privilege Escalation (TA0004), specifically techniques T1134.001 and T1134.002. The primary telemetry sources include Windows Event ID 7045 from the Service Control Manager, with relevant log types indicating service installation activities.

  If this detection is confirmed as malicious, it poses a high-security impact by potentially allowing an adversary to gain administrative control over the system. However, this detection alone does not confirm an active compromise or successful exploitation without additional context and corroborating evidence.

  ### Investigation Steps

  - **Review Event IDs for Service Creation**: Check Windows Security Logs for Event ID 7045 to confirm the creation of a new service and determine the service name and binary path. Look for unexpected names or paths indicative of malicious activity.

  - **Analyze Command Line Elements**: Investigate command line details in process creation logs (e.g., Sysmon Event ID 1) to find evidence of command executions featuring `cmd.exe`, `rundll32.exe`, or references to `\pipe\`. Malicious examples would include commands that utilize `echo` to create pipes, while legitimate commands typically do not.

  - **Identify Malicious Indicators**: Validate the command execution paths for any running processes related to `Cobalt Strike` or `Meterpreter`. Confirm any associated files or DLLs in the temporary directory that match the behavior observed in the alert.

  - **Investigate Side Effects of Service Creation**: Examine the functionality of the newly created service for signs of legitimate usage; e.g., if it corresponds to a known application or service. Legitimate services will typically have known publishers and established behaviors, whereas unknown services may require further scrutiny.

  - **Check for Network Traffic Anomalies**: Look for outbound traffic in Network Security Logs, particularly to unusual external IP addresses that may correspond with command and control (C2) infrastructure or anomalous local communications to services on `localhost (127.0.0.1)`.

  - **Verify Host Integrity**: Ensure your investigation involves scraping file system details or running a hash check against known good files for any suspicious executables found alongside the installed service. High confidence in malicious activity may arise from unexpected file modifications or new files in critical system paths.

  ### Prioritization

  This alert is high-severity due to the potential for significant impact if a system is compromised through privilege escalation methods. Given that tools like Meterpreter and Cobalt Strike are commonly used in real-world attacks to facilitate lateral movement and deeper infiltration into enterprise environments, the likelihood of malicious intent is substantial.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative scripts that may generate similar service installations, leading to false positives. Logs must be reliably configured to capture Event ID 7045 for accurate detection, as unmonitored environments could miss this telemetry. Additionally, legitimate applications might sometimes call `getsystem`, necessitating careful differentiation of context. A companion detection that strengthens coverage would involve monitoring Sysmon logs for suspicious process creations that correlate with service installations, providing a more comprehensive picture of potential attacks.

