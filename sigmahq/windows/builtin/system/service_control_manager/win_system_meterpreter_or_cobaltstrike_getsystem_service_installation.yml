title: Meterpreter or Cobalt Strike Getsystem Service Installation - System
id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service installation
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
date: 2019-10-26
modified: 2023-11-15
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: system
detection:
  selection_id:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_cli_cmd:
        # meterpreter getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1b (expanded %COMSPEC%): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    ImagePath|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    ImagePath|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_cli_rundll:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    ImagePath|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  selection_cli_share:
    ImagePath|startswith: '\\\\127.0.0.1\\ADMIN$\'      # https://twitter.com/svch0st/status/1413688851877416960?lang=en
  condition: selection_id and 1 of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of Windows services using the Meterpreter or Cobalt Strike `getsystem` command, indicative of a privilege escalation attempt by an adversary. The most likely objective is to gain elevated privileges on a compromised system, allowing further exploitation or persistence. This detection aligns with the MITRE ATT&CK tactic for Privilege Escalation, specifically techniques T1134.001 (Access Token Manipulation) and T1134.002 (Token Impersonation).

  The primary telemetry sources include Windows Event ID 7045 (Service Control Manager) which logs service installations, and command line activity indicative of the `getsystem` operations via cmd and rundll32. If malicious, successful execution could lead to significant security compromise, including unauthorized access to sensitive data and administrative capabilities. This detection does NOT confirm that an intrusion occurred without complementary context, such as the actor's behavior or system changes associated with the alert.

  ### Investigation Steps

  - **Review Windows Event ID 7045 logs:** Check for new service installations identified in the logs (Event ID 7045). Look for unexpected service names and the associated `ImagePath` to confirm if it correlates with known Meterpreter or Cobalt Strike behavior.

  - **Analyze command line for malicious patterns:** Investigate processes that include `cmd.exe` or `rundll32.exe`, particularly those executing commands with parameters similar to `echo 559891bb017 > \\.\pipe\5e120a`. Malicious indicators include the presence of command-line strings found in the detection logic.

  - **Identify authorized service modifications:** Confirm if the service installation correlates with legitimate system behavior (e.g., a known application or patch). Cross-reference with known good hashes for service binaries or existing application documentation.

  - **Correlate host activity with other telemetry:** Check network logs for connections to internal admin shares (e.g., `\\127.0.0.1\ADMIN$`) around the same time as the event. Verify the legitimacy of any service activity against user activity patterns to identify anomalies.

  - **Review user and privilege changes:** Assess local user accounts using Event ID 4672 (Special Privileges Assigned to New Logon) or Event ID 4720 (User Account Created) to determine if further privilege escalation was achieved, signifying that the initial detection was part of a larger exploit lifecycle.

  ### Prioritization

  The alert is categorized as high severity due to the direct implications on administrative access within enterprise systems. It represents a likely misuse of privilege escalation techniques which are commonly weaponized in targeted attacks, making it essential for prompt investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include altering command patterns to avoid detection (e.g., using obfuscated commands or legitimate command line tools). Reliable detection requires the event logging structure to be intact and configured to capture Service Control Manager logs properly. Legitimate activities that may trigger the alert include administrative software updates or changes performed by authenticated IT personnel. A related detection to consider for broader coverage includes anomalous account logins (Event ID 4624) that could indicate unauthorized access attempts prior to service installation.

