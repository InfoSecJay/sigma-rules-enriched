  ### Technical Context

  This rule detects the creation of a Windows service named "KrbSCM," which is indicative of the use of the KrbRelayUp tool. This tool operates within the context of privilege escalation attacks, specifically targeting environments where LDAP signing is not enforced, allowing an attacker to relay Kerberos authentication requests to create a service that can be exploited later.

  The primary MITRE ATT&CK techniques relevant to this detection are T1543 (Create or Modify System Process) under the Persistence tactic. The main telemetry source for this rule comes from Windows Event ID 7045, which logs service installation events. If malicious, this could lead to unauthorized access or control over critical systems. This alert does not confirm that a full compromise has occurred, only that an attempt was made to install a potentially malicious service.

  ---

  ### Investigation Steps

  - **Identify the service creation**: Check for Windows Event ID 7045 in System Event logs to confirm the creation of the service "KrbSCM". Validate the timestamp against other account activity around the same time.

  - **Examine the service properties**: Review the service configuration using PowerShell (`Get-Service KrbSCM`) or through services.msc to identify any unusual command line parameters or services that are set to start automatically.

  - **Check the host for known indicators**: Search for the presence of the KrbRelayUp executable on the system, looking specifically in common artifact locations and inspecting for abnormal file creation timestamps referencing suspicious behaviors.

  - **Review legitimate service creation patterns**: Determine if other legitimate services are usually installed at similar timestamps. Document legitimate service creation activity patterns known for your environment.

  - **Cross-reference user activity**: Investigate user access logs around the same timeframe (e.g., Logon Events 4624) to identify whether the service creation corresponds with anomalous account behavior such as failed logins or logins from unusual locations.

  - **Assess broader telemetry**: Look into network logs to track any outbound connections made by the "KrbSCM" service, especially to unknown external IP addresses, which may indicate exfiltration of credentials or other sensitive data.

  ---

  ### Prioritization

  This alert is of high severity due to the impact of the affected system, potentially allowing an attacker to gain elevated privileges and persist in the environment. The use of the KrbRelayUp tool is a known method for exploiting vulnerable systems, raising the likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited if Event ID 7045 logging is not enabled or configured correctly on domain controllers and servers. Additionally, legitimate administrative actions that create services could trigger this alert, such as software updates or security patches. A related detection that strengthens coverage would involve monitoring for unusual service modifications or deletions, which could indicate other forms of compromise.

