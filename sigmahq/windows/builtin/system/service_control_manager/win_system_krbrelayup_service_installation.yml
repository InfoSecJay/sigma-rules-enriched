  ### Technical Context
  This rule is designed to detect the installation of services associated with the KrbRelayUp tool, a technique used for privilege escalation in Windows domain environments, particularly when LDAP signing is not enforced. By leveraging service control manager (SCM) capabilities, attackers can create a malicious service that executes the KrbRelayUp tool to target Kerberos authentication protocols, potentially allowing them to escalate privileges and access sensitive resources.

  The threat scenario largely revolves around attackers exploiting vulnerabilities in domain environments to gain unauthorized access and control over accounts and resources. In the absence of strong LDAP signing configurations, attackers can utilize KrbRelayUp to relay authentication requests, indicating a significant risk to organizational security.

  This detection aligns with multiple MITRE ATT&CK tactics and techniques:
  - **Persistence (T1543)**: The creation of a service ensures that the malicious tool runs on system startup, thereby maintaining persistence.
  - **Privilege Escalation (T1543)**: The operation inherently elevates the attacker's privileges within the target environment.

  Data sources that will provide critical evidence include Windows system event logs, particularly those capturing service installations (e.g., Event ID 7045), which log service additions and modifications that can unveil malicious activities.

  ### Investigation Steps
  - **Review Service Creation Logs**: Investigate Windows Event Logs for Event ID 7045, specifically for any service named "KrbSCM." Look for unusual or unauthorized service installations, particularly on domain controllers or critical servers.
  - **Check for LDAP Signing Configurations**: Confirm whether LDAP signing is enforced within your organization's Active Directory environment. This will identify potential weaknesses that may have been exploited by the attacker.
  - **Analyze System Behavior**: Examine the behavior of the newly created service. Investigate executed commands, the service's run path, and any network connections made by the service to correlate with known indicators of compromise associated with KrbRelayUp.
  - **Conduct an Account Review**: Analyze recent account activity, focusing on privilege escalation attempts. Look for unusual access to critical resources or changes in user permissions that correspond with the service's installation timestamps.

  ### Prioritization
  Given the high severity of this alert, it is of utmost importance within an enterprise environment. The ability for an attacker to escalate privileges significantly heightens the risk of data breaches and system compromise, necessitating a swift investigation and response.

  ### Blind Spots and Assumptions
  There are several blind spots in this detection approach. The rule primarily depends on the presence of Event ID 7045, which can be missed if logging is inadequately configured or if the logs are improperly monitored. Additionally, the detection assumes that attackers will use the default service name "KrbSCM," which they may not always do if attempting to obfuscate their activities. A comprehensive logging strategy, including the configuration of Windows event logs and service monitoring, is essential for ensuring the effectiveness of this detection.

