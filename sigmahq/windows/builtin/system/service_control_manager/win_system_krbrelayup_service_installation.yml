note: |
  ### Technical Context

  The rule detects the creation of a Windows service named 'KrbSCM', which is indicative of the use of the KrbRelayUp tool. This tool is often employed by attackers to escalate privileges in environments where LDAP signing is not enforced, commonly seen in Active Directory configurations. The likely attacker objective is to enable ongoing access or to perform lateral movement, facilitating further exploitation within the network.

  This detection aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) through **Create or Modify System Process** (T1543). Primary telemetry sources include Windows Security logs specifically looking at Event ID 7045, which records service installation requests. If this behavior is malicious, it could lead to unauthorized access and control over sensitive systems. Importantly, this detection does NOT confirm that malicious activity occurred solely based on the service creation event and further context is required for a full assessment.

  ### Investigation Steps

  - **Check Event ID 7045 details**: Review the Windows event log for Event ID 7045 to confirm the creation of the service. Look for the `ServiceName` field containing 'KrbSCM'. This is a high-confidence indicator of potential malicious activity.

  - **Investigate Service Configuration**: Examine the service configuration to identify startup type and executable path. Legitimate services typically have clear documentation and should not be set to "Automatic" with obscure or unfamiliar paths.

  - **Validate LDAP Signing Enforcement**: Verify whether LDAP signing is enforced in your environment. Lack of enforcement can leave systems vulnerable to attacks leveraging tools like KrbRelayUp, which exploit this misconfiguration.

  - **Correlate with User Activities**: Investigate any related user activities or account logins around the same time. Review Event ID 4624 (Logon) and 4625 (Failed Logon) for users accessing the system around the event time, looking for anomalies.

  - **Review Related Security Events**: Check for other security logs, such as Event ID 4688 (Process Creation) or Sysmon Event ID 1, for new processes spawned by the service or related commands executed by user accounts.

  - **Assess System Role and Criticality**: Determine the role and criticality of the affected system. If it is a domain controller or an application server, escalate the investigation as it could have significant security implications.

  ### Prioritization

  The alert is considered high severity due to its potential impact on system integrity and the likelihood of malicious use for privilege escalation, which is especially dangerous in systems that handle sensitive data or have administrative functions. The behavior detected is weaponized in many advanced attacks, warranting urgent review.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the service or using other less-known service names to avoid detection, potentially bypassing this rule. Reliable detection requires logging configurations that ensure Event ID 7045 is captured. Legitimate activities, such as authorized service deployment for internal applications, could also trigger this alert. To strengthen detection coverage, consider implementing additional rules that monitor for modifications to the security policy or changes to user permissions in AD (e.g., T1548).

