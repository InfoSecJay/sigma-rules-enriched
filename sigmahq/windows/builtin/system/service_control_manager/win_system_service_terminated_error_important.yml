title: Important Windows Service Terminated With Error
id: d6b5520d-3934-48b4-928c-2aa3f92d6963
related:
- id: acfa2210-0d71-4eeb-b477-afab494d596c
  type: similar
status: test
description: Detects important or interesting Windows services that got terminated
  for whatever reason
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/11/guidance-for-investigating-attacks-using-cve-2022-21894-the-blacklotus-campaign/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-14
tags:
- attack.defense-evasion
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7023     # The X Service service terminated with the following error
  selection_name:
  - param1|contains:
              # Note that these names are "Display Names" and are language specific. If you're using a non-english system these can and will be different
    - ' Antivirus'
    - ' Firewall'
    - 'Application Guard'
    - 'BitLocker Drive Encryption Service'
    - 'Encrypting File System'
    - 'Microsoft Defender'
    - 'Threat Protection'
    - 'Windows Event Log'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '770069006e0064006500660065006e006400'           # windefend (Microsoft Defender Antivirus Service)
    - '4500760065006e0074004c006f006700'           # EventLog
    - '6d0070007300730076006300'           # mpssvc (Windows Defender Firewall)
    - '530065006e0073006500'           # Sense (Windows Defender Advanced Threat Protection Service)
    - '450046005300'           # EFS (Encrypting File System)
    - '420044004500530056004300'           # BDESVC (BitLocker Drive Encryption Service)
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to multiple
  reasons
level: high
note: |
  ### Technical Context
  This detection rule identifies the abnormal termination of critical Windows services, which can indicate malicious activity or misconfiguration. The rule specifically targets events logged by the Service Control Manager (SCM), particularly Event ID 7023, which indicates that important services such as antivirus, firewalls, or encryption services have stopped unexpectedly. Attackers may seek to disrupt security mechanisms to facilitate unauthorized access, lateral movement, or data exfiltration.

  The related MITRE ATT&CK techniques associated with this detection include **Defense Evasion (T1562)** and possibly **Impact (T1485)**, as terminating protective services could undermine the enterprise's defenses and organization integrity. Important data sources for this detection include Windows Event Logs that capture service termination events, specifically those related to service operations that are crucial for maintaining security and integrity.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Event Logs for Event ID 7023, focusing on the specific services that are being terminated, and note any corresponding timestamps or patterns that could indicate suspicious activity.
  - **Correlate with EDR/AV Logs**: Investigate output from endpoint detection and response (EDR) or antivirus solutions to determine if any other alerts or behaviors coincide with the termination of these services. Look for signs of process injection or unauthorized changes.
  - **Analyze Recent Changes**: Check for any recent configuration changes or updates to the Windows environment that could have led to the termination of these services. This includes reviewing system change logs or patch management records.
  - **Investigate Network Activity**: Analyze the network traffic around the time of the service terminations to identify any suspicious connections, especially outbound traffic that might indicate data exfiltration attempts or communication with known malicious IP addresses.

  ### Prioritization
  Given the critical nature of the services being monitored, any abnormal termination events warrant high priority. The potential impact of discontinuing services such as antivirus or firewall can lead to severe vulnerabilities, making this alert critical for immediate investigation.

  ### Blind Spots and Assumptions
  Gaps may exist in detection coverage if not all logs are being collected or if Windows logging settings do not capture the full scope of service terminations. The detection logic is built on the assumption that important services will generally not terminate without cause; hence, any termination should trigger scrutiny. Ensuring that Windows Event Logs, particularly the Security and System logs, are fully enabled is essential for this detection to function accurately.

