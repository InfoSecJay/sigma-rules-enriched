logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7023     # The X Service service terminated with the following error
  selection_name:
  - param1|contains:
              # Note that these names are "Display Names" and are language specific. If you're using a non-english system these can and will be different
    - ' Antivirus'
    - ' Firewall'
    - 'Application Guard'
    - 'BitLocker Drive Encryption Service'
    - 'Encrypting File System'
    - 'Microsoft Defender'
    - 'Threat Protection'
    - 'Windows Event Log'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '770069006e0064006500660065006e006400'           # windefend (Microsoft Defender Antivirus Service)
    - '4500760065006e0074004c006f006700'           # EventLog
    - '6d0070007300730076006300'           # mpssvc (Windows Defender Firewall)
    - '530065006e0073006500'           # Sense (Windows Defender Advanced Threat Protection Service)
    - '450046005300'           # EFS (Encrypting File System)
    - '420044004500530056004300'           # BDESVC (BitLocker Drive Encryption Service)
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to
  multiple reasons
level: high
note: |
  ### Technical Context

  This Sigma rule detects the termination of critical Windows services, such as antivirus, firewall, and event logging services. Malicious actors may aim to disable these defenses to conduct further intrusion, persistence, or data exfiltration without detection. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically targeting technique **Service Stop** (T1489).

  Primary telemetry sources include Windows Event Logs, specifically Security Event ID 7023 from the Service Control Manager, indicating service terminations with errors. If malicious, the impact could lead to reduced security posture and increased vulnerability to additional attacks. This detection alone does not confirm malicious intent; legitimate maintenance or system events may cause similar service terminations.

  ### Investigation Steps

  - **Check event details:** Review Windows Event ID 7023 logs to determine the service that was terminated, noting any relevant parameters or error messages in the event source fields to help distinguish between benign and malicious activity.

  - **Identify frequent terminations:** Look for a pattern of service terminations in the Security Event Log (Event ID 7023) in the last 48 hours. A high frequency of terminations, especially for services like 'Microsoft Defender' or 'Windows Event Log', may indicate malicious activity.

  - **Correlate with recent changes:** Examine change logs for the affected systems (if available) to see if there have been any recent deployments or updates. Legitimate maintenance activities should align with these records, whereas an absence of context may imply malicious intent.

  - **Monitor service status:** Use PowerShell (Get-Service) or Task Manager on affected hosts to verify if terminated services remain disabled or if they restart unexpectedly. Continuous failure of critical services may indicate an active attack.

  - **Analyze network connections:** Check for unusual network activity correlating with the service termination time using network logs. Specifically, monitor for outbound connections on ports commonly used by malware, such as HTTP/HTTPS (80/443).

  - **Cross-reference companion alerts:** Identify any related alerts from companion detection rules, such as those monitoring the lifecycle of service accounts or alterations to security settings. This can provide additional context to the current termination event.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical security services within the enterprise environment. The likelihood of malicious abuse is heightened, as attackers often target these services to bypass detection mechanisms. This behavior is also weaponized in various attack scenarios, making it imperative to investigate promptly.

  ### Blind Spots and Assumptions

  The detection may miss service terminations deliberately spoofed by adversaries or those occurring too quickly to detect in logs. Reliable detection requires proper logging configurations, including enabling detailed logging for critical services. Legitimate activities like system updates or reboots may trigger alerts, necessitating careful analysis. Companion detections, such as those identifying unauthorized service installations or modifications, can strengthen overall coverage against potential threats.

