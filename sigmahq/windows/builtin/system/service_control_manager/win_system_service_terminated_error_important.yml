detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7023     # The X Service service terminated with the following error
  selection_name:
  - param1|contains:
              # Note that these names are "Display Names" and are language specific. If you're using a non-english system these can and will be different
    - ' Antivirus'
    - ' Firewall'
    - 'Application Guard'
    - 'BitLocker Drive Encryption Service'
    - 'Encrypting File System'
    - 'Microsoft Defender'
    - 'Threat Protection'
    - 'Windows Event Log'
        # Use this If you collect the binary value provided from this event, which is the wide hex encoded value of the service name.
  - Binary|contains:
    - '770069006e0064006500660065006e006400'           # windefend (Microsoft Defender Antivirus Service)
    - '4500760065006e0074004c006f006700'           # EventLog
    - '6d0070007300730076006300'           # mpssvc (Windows Defender Firewall)
    - '530065006e0073006500'           # Sense (Windows Defender Advanced Threat Protection Service)
    - '450046005300'           # EFS (Encrypting File System)
    - '420044004500530056004300'           # BDESVC (BitLocker Drive Encryption Service)
  condition: all of selection_*
falsepositives:
- Rare false positives could occur since service termination could happen due to
  multiple reasons
level: high
note: |
  ### Technical Context

  This Sigma rule detects the termination of critical Windows services, specifically instances where these services stop with an error message (Event ID 7023), which may suggest malicious activity. The likely objective of an attacker triggering this alert is to disable security mechanisms and maintain persistence or to create a foothold within the system. This behavior aligns with the MITRE ATT&CK tactic **Defense Evasion** (ID: T1562) and technique **Disable or Modify Tools** (ID: T1212).

  The primary telemetry source for this detection is Windows Event Logs, specifically the System event log containing Service Control Manager events (Event ID 7023). If malicious, the impact includes potential disruption of security services like antivirus or firewalls, leaving the system vulnerable to further exploitation. Importantly, this detection alone does not confirm malicious intent, as legitimate application updates or administrative changes may also cause service terminations.

  ### Investigation Steps

  - **Identify terminated services**: Review Security Event ID 7023 in the System logs to identify which services were terminated. Focus on those related to security, such as Antivirus, Windows Event Log, and Firewall services.

  - **Correlate with user actions**: Check for any administrative actions (Event ID 4624) or user logins (Event ID 4625) in proximity to the service termination events. Confirm whether expected administrative users were involved in the session to validate legitimacy.

  - **Review service dependencies**: For terminated services, use **Get-Service** PowerShell command to determine any dependent services that may have also been affected. Legitimate updates will typically not cause critical service mismatches.

  - **Validate service restart events**: Look for Event ID 7036 in System logs, which logs when services start. Malicious service terminations may not be followed by legitimate restarts, while expected behavior will show a restart shortly after termination.

  - **Check for unusual processes**: Monitor for any anomalous process creation (Event ID 4688, Sysmon Event ID 1) around the same timeframe as the service termination. Look specifically for processes that have interactions with terminated services or are initiated by unusual users.

  - **Profile system criticality**: Assess the affected host’s role in the environment (e.g., domain controller, file server) to prioritize investigation. Critical systems warrant higher urgency for remediation, while non-critical systems may allow for a more measured approach.

  ### Prioritization

  The alert severity is high due to the potential impact on key services like antivirus and firewall, which are crucial for system security. The likelihood of malicious abuse is significant, as attackers often seek to disable security measures to execute further attacks. This behavior is commonly weaponized in targeted campaigns, indicating a need for swift investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by service restarts or administrative actions performed closely after terminations that could mask malicious intent. If key logs (e.g., Windows Event Logs) are not retained properly or if agents are misconfigured, detection may fail. Legitimate activities, such as planned maintenance or software updates, can trigger the alert. A related detection, such as abnormal process execution (Sysmon Event ID 1), can strengthen coverage and help confirm or refute suspicions of malicious activity.

