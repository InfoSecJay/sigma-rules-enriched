title: Sliver C2 Default Service Installation
id: 31c51af6-e7aa-4da7-84d4-8f32cc580af2
status: test
description: Detects known malicious service installation that appear in cases in
  which a Sliver implants execute the PsExec commands
references:
- https://github.com/BishopFox/sliver/blob/79f2d48fcdfc2bee4713b78d431ea4b27f733f30/client/command/commands.go#L1231
- https://www.microsoft.com/security/blog/2022/08/24/looking-for-the-sliver-lining-hunting-for-emerging-command-and-control-frameworks/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-25
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.t1543.003
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service_1:
    ImagePath|re: '^[a-zA-Z]:\\windows\\temp\\[a-zA-Z0-9]{10}\.exe'
  selection_service_2:
    ServiceName:
    - 'Sliver'
    - 'Sliver implant'
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify the installation of malicious services associated with the Sliver command-and-control (C2) framework, particularly those that leverage PsExec commands to establish persistence within an environment. Sliver is known for its stealthy methods of execution and service installation, making its detection critical in defending against unauthorized remote access and control. The primary objective for an attacker utilizing Sliver is to maintain persistence in a target environment, often allowing for remote management and additional malicious activities.

  Relevant tactics and techniques as per MITRE ATT&CK include:
  - **Persistence** (TA0003) – by installing a malicious service.
  - **Remote Service Execution** (T1569.002) – utilizing PsExec commands for remote execution.
  - **Windows Services** (T1543.003) – by creating or modifying service configurations.

  Primary data sources for this detection include Windows event logs related to the Service Control Manager, specifically Event ID 7045, which records service installations. Additionally, the detection logic examines specific service names and image paths typical of Sliver implants.

  ### Investigation Steps
  - **Review Windows Event Logs:** Check the Service Control Manager logs (Event ID 7045) to find entries related to newly created services, particularly focusing on those with names containing 'Sliver' or 'Sliver implant.'
  - **Analyze Service Image Paths:** Investigate the image paths for any executable files stored within the C:\Windows\Temp directory that meet the regex pattern provided in the detection logic, which may indicate malicious activity.
  - **Cross-check with Process Creation Logs:** Track processes to identify any PsExec commands or similar execution activities that directly correlate with the creation of the malicious services; focus on unusual parent/child relationships that indicate remote execution.
  - **Correlate with Network Traffic:** Examine network logs for communications with known Sliver C2 servers or suspicious outbound connections generated by the detected services.

  ### Prioritization
  The severity of this alert is high due to the potential impact of Sliver as a persistent C2 framework, allowing attackers sustained access to sensitive systems. The likelihood of detection is also elevated, given the specific service characteristics and patterns associated with Sliver implants.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logging is not properly configured to capture Service Control Manager events or if Event ID 7045 is not consistently generated due to system configurations or group policies. The detection logic assumes that the systems in question are configured to log relevant events, and there may be false positives if legitimate service installations are misattributed to this detection. Continuous monitoring and validating the patterns of service installations are essential for maintaining effectiveness.

