title: Sliver C2 Default Service Installation
id: 31c51af6-e7aa-4da7-84d4-8f32cc580af2
status: test
description: Detects known malicious service installation that appear in cases 
  in which a Sliver implants execute the PsExec commands
references:
- https://github.com/BishopFox/sliver/blob/79f2d48fcdfc2bee4713b78d431ea4b27f733f30/client/command/commands.go#L1231
- https://www.microsoft.com/security/blog/2022/08/24/looking-for-the-sliver-lining-hunting-for-emerging-command-and-control-frameworks/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-08-25
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.t1543.003
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service_1:
    ImagePath|re: '^[a-zA-Z]:\\windows\\temp\\[a-zA-Z0-9]{10}\.exe'
  selection_service_2:
    ServiceName:
    - 'Sliver'
    - 'Sliver implant'
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of known malicious services associated with the Sliver command and control (C2) framework, particularly through the Windows Service Control Manager (SCM). The primary attacker objective is to establish persistence on compromised systems, enabling subsequent remote execution of commands and further exploitation. This behavior fits into the MITRE ATT&CK framework under the tactics of Persistence (T1543.003) and Execution (T1569.002).

  The primary telemetry source for this detection is Windows Event Log, specifically the Service Control Manager events (Event ID 7045). If successful, an adversary can maintain access and control over the target system, posing significant security risks. It is important to note that this detection alone does not confirm the presence of a Sliver implant; further investigation is required to establish context regarding the service's behavior and associated activities.

  ### Investigation Steps

  - **Review Event ID 7045 logs:** Check for Service Control Manager logs indicating services installed with the name 'Sliver' or 'Sliver implant'. Look in **Windows Event Log** under **System**.
  - **Examine ImagePath:** For any new services observed, validate the **ImagePath**; look for paths like `C:\Windows\Temp\[random_string].exe`. This indicates the use of crafted executables for persistence.
  - **Identify legitimate service installs:** Correlate service installations against known legitimate applications within your environment. Legitimate services do not typically install in the `C:\Windows\Temp` directory with random naming conventions.
  - **Analyze process creation logs:** Inspect **Event ID 4688** (Security) or **Sysmon Event ID 1** for suspicious processes that correspond with the timing of the service installation, especially those associated with `cmd.exe` or `powershell.exe` activities.
  - **Check for command execution patterns:** Search for evidence of PsExec or similar remote execution tools being used prior to the service installation. Review command-line arguments in process logs to find unusual behaviors.
  - **Investigate service behavior:** If identified, check the service's running status and configuration. Malicious services often exhibit unusual behaviors compared to legitimate services, such as high CPU usage or outbound network connections to unfamiliar domains.

  ### Prioritization

  Given the high impact of the Sliver C2 framework's capabilities on targeted systems, this alert should be treated with a high priority. The likelihood of malicious abuse is elevated, as this method is a known technique for establishing persistence in compromised environments. Such behavior is increasingly weaponized, particularly in targeted attacks.

  ### Blind Spots and Assumptions

  There is a risk of evasion if adversaries employ alternative directories or names for malicious services, thereby avoiding detection. Effective detection relies on comprehensive logging, such as ensuring that Service Control Manager events are being captured correctly. Legitimate activities that may trigger similar alerts include the installation of legitimate software that utilizes service installations in temporary directories. Additionally, companion detections, such as for PsExec usage or abnormal process creation, can enhance coverage.

