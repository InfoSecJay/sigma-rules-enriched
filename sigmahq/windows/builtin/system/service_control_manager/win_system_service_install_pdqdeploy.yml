title: New PDQDeploy Service - Server Side
id: ee9ca27c-9bd7-4cee-9b01-6e906be7cae3
status: test
description: |
  Detects a PDQDeploy service installation which indicates that PDQDeploy was installed on the machines.
  PDQDeploy can be abused by attackers to remotely install packages or execute commands on target machines
references:
- https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-22
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'PDQDeployService.exe'
  - ServiceName:
    - 'PDQDeploy'
    - 'PDQ Deploy'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of the PDQDeploy service on Windows systems by monitoring the Service Control Manager (SCM) for specific event logs. PDQDeploy is a legitimate software tool used for deploying applications and managing IT environments; however, it can also be misused by malicious actors to install unauthorized software or execute commands on target machines without user consent. An attacker with the ability to deploy this service can further their objectives, such as establishing persistence, exfiltrating data, or conducting lateral movement within the network.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically corresponding to the technique **Create or Modify System Service** (T1543.003). This highlights the potential for attackers to gain elevated privileges by manipulating system services to their advantage. The primary data sources for this detection rule are Windows Event logs, particularly those generated by the Service Control Manager, which record service installations and modifications.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Event logs (Event ID 7045) to identify the creation of the PDQDeploy service. Cross-reference the installation timestamp with other activity logs to determine if the installation is anomalous.
  - **Examine Service Attributes:** Analyze the service properties, including the ImagePath and ServiceName, to ensure they correspond to legitimate installations. Look for any unusual command line arguments or configurations that might indicate malicious intent.
  - **Monitor Network Activity:** Investigate network traffic for outbound connections made by the PDQDeploy service to detect any attempts to communicate with external command and control servers or unusual internal communications.
  - **Assess User Privileges:** Review the user and group permissions associated with the PDQDeploy service. Ensure that only authorized personnel have the ability to modify or interact with this service.

  ### Prioritization
  Alerts generated by this detection rule should be treated with medium severity due to the potential for attackers to exploit PDQDeploy for malicious purposes. Unauthorized deployments could lead to significant threats, including system compromise, data leakage, or further lateral movement across the enterprise.

  ### Blind Spots and Assumptions
  This rule may not capture PDQDeploy installations performed by legitimate administrative processes or changes made via remote management tools that do not log service events. The detection logic assumes that all installations of the service are unauthorized unless proven otherwise, which can result in false positives from legitimate use within the organization. Adequate logging configurations, including Event Log settings to capture service-related events, are required for this alert to function effectively.

