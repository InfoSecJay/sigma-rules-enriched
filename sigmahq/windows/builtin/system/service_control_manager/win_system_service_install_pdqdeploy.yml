title: New PDQDeploy Service - Server Side
id: ee9ca27c-9bd7-4cee-9b01-6e906be7cae3
status: test
description: |
  Detects a PDQDeploy service installation which indicates that PDQDeploy was installed on the machines.
  PDQDeploy can be abused by attackers to remotely install packages or execute commands on target machines
references:
- https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-22
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'PDQDeployService.exe'
  - ServiceName:
    - 'PDQDeploy'
    - 'PDQ Deploy'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  This rule detects the installation of the PDQDeploy service on Windows systems, which can be used for remotely deploying applications or executing commands. Malicious actors may leverage PDQDeploy to conduct unauthorized software installations or command executions on compromised systems. The relevant MITRE ATT&CK tactic is "Persistence," with technique T1543.003 (Create or Modify System Service). The primary telemetry source is the Windows System log, particularly monitoring Event ID 7045, which records changes to services. If established as malicious, this behavior can allow significant control over target systems. Notably, this detection does NOT confirm that malicious activity has occurred; the presence of the PDQDeploy service alone does not indicate nefarious intent.

  ### Investigation Steps

  - **Check for service details:** Review the logs for Event ID 7045 for specifics such as the service name "PDQDeploy" and the image path containing "PDQDeployService.exe." Look for a legitimate installation timeframe and verify the account used to create the service.

  - **Identify service user account:** Analyze the `CreatedBy` field to confirm the user account that installed the service. A system account (like Local System) may indicate legitimate deployment, whereas a user account with irregular patterns could suggest malicious intent.

  - **Review installed software:** Use PowerShell cmdlets (Get-Package or Get-Service) to review other installed packages on the system. Compare recent installations to the creation of the PDQDeploy service, which may reveal suspicious patterns.

  - **Evaluate network communication:** Examine network logs (Windows Firewall or proxy logs) for connections made by PDQDeploy to external IPs or URLs. Malicious activities may show unusual data exfiltration attempts or C2 communications.

  - **Document legitimate use scenarios:** Collect evidence of legitimate use cases, such as documented deployment schedules or known use of PDQDeploy in the environment. Analyze if these align with service creation timestamps.

  - **Correlate with other detections:** Assess for additional suspicious activity by cross-referencing with other detections for potential privilege escalation events or unauthorized software installations occurring in conjunction with the PDQDeploy service installation.

  ### Prioritization

  This alert has medium severity as it indicates a potential pivot point for attackers who misuse legitimate administrative tools. The risk is heightened in environments where PDQDeploy is not explicitly authorized or documented for use. The behavior detected is not common among typical user operations, making it noteworthy.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where attackers attempt to conceal their activity by renaming the service executable. Additionally, organizations must ensure that logs for Event ID 7045 are captured consistently across all relevant systems for reliable detection. Legitimate administrative use of PDQDeploy by IT teams can trigger this alert. A related detection to consider is monitoring for unusual process creations (Event ID 4688) that originate from the PDQDeploy service to detect further suspicious activities.

