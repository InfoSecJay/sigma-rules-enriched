note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts through the use of Clip.exe, indicative of potentially malicious scripting activity aimed at executing commands without detection. The likely attacker objective is to leverage obfuscation techniques to hide the true nature of their scripts as they attempt to execute payloads or perform unauthorized actions on the system. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1059.001) and Obfuscated Files or Information (T1027).

  Primary telemetry sources include Windows Event logs, specifically Security Event ID 7045, which relates to the Service Control Manager and logs when new services are created. If malicious, this activity can lead to unauthorized access or control over the affected system. Importantly, this detection does NOT confirm that the use of Clip.exe is inherently malicious; it requires further investigation to establish intent and impact.

  ### Investigation Steps

  - **Verify event context: ** Review Windows Event ID 7045 for the specific system where the alert was triggered. Check the `ImagePath` field for occurrence of 'Clip.exe' and the associated command line to determine if the execution is anomalous.

  - **Check for recent PowerShell activity: ** Investigate corresponding PowerShell logs (Event ID 4103) to determine if any obfuscated scripts were executed around the same timeframe as the Clip.exe incident. Look for suspicious parameters or encodings.

  - **Identify legitimate Clip.exe usage: ** Confirm if users have legitimate use cases for Clip.exe. For example, users occasionally rely on this for clipboard management. Track the usage pattern against known user behavior to assess anomalies.

  - **Analyze service creation patterns: ** Identify if new services related to Clip.exe were created under unusual circumstances (e.g., in non-administrative contexts). Document creation times and other related Event IDs (e.g., 7036 for service state changes).

  - **Look for lateral movement attempts: ** Correlate this activity with other alerts or logs indicating lateral movement, specifically analyzing if Clip.exe execution was followed by remote command execution (e.g., using PsExec).

  - **Examine endpoint security telemetry: ** Validate any endpoint protection alerts that coincide with this event. Pay attention to blocked activities or alerts raised by EDR systems that may indicate malicious behavior.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems where malicious obfuscation can lead to unauthorized access or system compromise. The likelihood of misuse is high, as evasion techniques, such as obfuscation, are commonly employed by adversaries during initial access or lateral movement in a network.

  ### Blind Spots and Assumptions

  Detection may be limited by users who legitimately utilize Clip.exe for normal operations, potentially resulting in false positives. Ambiguities exist in distinguishing benign from malicious use without contextual user behavior analysis. It is crucial to ensure that all related logs are configured correctly, including PowerShell logging and security event auditing. Another recommended detection that pairs well is monitoring for process command line arguments related to PowerShell execution (T1059.001) to enhance visibility into potential abuses of scripting automation.

