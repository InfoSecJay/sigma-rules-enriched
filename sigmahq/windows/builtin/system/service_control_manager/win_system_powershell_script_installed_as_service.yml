title: PowerShell Scripts Installed as Services
id: a2e5019d-a658-4c6a-92bf-7197b54e2cae
status: test
description: Detects powershell script installed as a Service
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
author: oscd.community, Natalia Shornikova
date: 2020-10-06
modified: 2022-12-25
tags:
- attack.execution
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - 'powershell'
    - 'pwsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the installation of PowerShell scripts as Windows services, which can indicate potential malicious activity. Attackers often leverage PowerShell due to its powerful capabilities for automation and remote management. By installing a PowerShell script as a service, they can ensure persistence, as the script runs automatically whenever the system is restarted. This behavior typically aligns with post-exploitation techniques where an adversary aims to maintain access or establish a foothold in a compromised environment.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002)
  - **Malicious File Execution** (T1569.002)

  Primary data sources for this detection include Windows Event Logs, specifically those generated by the Service Control Manager, which can capture event ID 7045 indicating service installation activities.

  ### Investigation Steps
  - **Review Service Installation Logs**: Check for Windows Event ID 7045 in the Service Control Manager logs to identify newly created services that may be executing PowerShell scripts.
  - **Analyze Image Paths**: Investigate the `ImagePath` field of the detected services for unusual PowerShell paths, especially those not typically associated with legitimate services.
  - **Assess Service Status and Dependencies**: Evaluate the status and dependencies of the identified services to determine if they are running, their set configurations, and whether they are dependent on other suspicious services.
  - **Correlate with User Activity**: Cross-reference the service installation with user login events or related process creation logs to ascertain the legitimacy of the activity.

  ### Prioritization
  The severity of this alert is high due to the capability of these installations to provide persistent access for adversaries, thus potentially facilitating further malicious actions within the network.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may occur if malicious actors use techniques to obfuscate or rename their scripts or if they utilize legitimate services for malicious purposes. This rule assumes that the standard logging levels for Windows services are enabled and that evidential logs are retained long enough to allow for meaningful investigation. Proper configurations ensuring the collection of relevant Event IDs from the System logs are essential for this detection to function effectively.

