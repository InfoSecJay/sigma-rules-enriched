detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - 'powershell'
    - 'pwsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the installation of PowerShell scripts as system services, indicating potentially malicious behavior. Attackers may utilize this technique to ensure persistence and execute scripts with elevated privileges, often aiming to maintain control over compromised systems and perform further actions without detection. The relevant MITRE ATT&CK tactic is Execution, specifically the technique T1569.002 (Service Execution).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 7045, which captures the creation of a new service. If malicious, this behavior could allow adversaries to persistently execute arbitrary code and evade manual detection methods. However, this detection does NOT confirm malicious intent on its own; it could also be due to legitimate administrative actions.

  ### Investigation Steps

  - **Check Service Creation Logs:** Review Windows Security Event ID 7045 logs to identify when the service was created. Anomalies in service creation, particularly subsequent to unusual user activity hours, may indicate potential compromise.

  - **Analyze ImagePath for Legitimate Scripts:** Validate the `ImagePath` field from Event ID 7045; legitimate services may contain paths to recognized system scripts or administrative automation processes, contrasting with indicators of malicious paths such as obfuscated file names or paths.

  - **Identify High-Risk User Accounts:** Correlate the service creation with user account activity; identify whether the action was performed by high-risk or privileged accounts. Look for accounts that typically do not install services or have an unusual context for service installation.

  - **Review Scheduled Tasks for Correlation:** Examine the Task Scheduler (Task Scheduler logs - Event ID 106) for any tasks scheduled by the same user around the time of the service creation. Legitimate administrative tasks often correspond with service installations by IT staff.

  - **Inspect System Resource Usage:** Use Windows Performance Monitor or Resource Monitor to check if the newly created service is consuming abnormal levels of CPU, memory, or network resources, indicative of malicious activity.

  ### Prioritization

  This alert carries a high severity due to its potential impact on the security posture of the organization. The likelihood of abuse is significant, as the installation of PowerShell scripts as services is a known tactic used by adversaries for persistence. This behavior is commonly weaponized in various threat campaigns, making it a vital focus for investigation.

  ### Blind Spots and Assumptions

  There are potential limitations to detection, as legitimate administrative activities may trigger the alert, such as system updates or approved script deployments. Reliable detection relies on having comprehensive logging configurations for Windows Event logs. One common evasion technique includes disabling service creation logging or using alternative scripts executed via different paths. A companion detection worthy of consideration is monitoring for unusual PowerShell command execution (e.g., PowerShell logs - Event ID 4104), which can complement findings of suspicious service installations.

