title: New PDQDeploy Service - Client Side
id: b98a10af-1e1e-44a7-bab2-4cc026917648
status: test
description: |
  Detects PDQDeploy service installation on the target system.
  When a package is deployed via PDQDeploy it installs a remote service on the target machine with the name "PDQDeployRunner-X" where "X" is an integer starting from 1
references:
- https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-22
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'PDQDeployRunner-'
  - ServiceName|startswith: 'PDQDeployRunner-'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the installation of a PDQDeploy service on a target Windows system, specifically looking for services named "PDQDeployRunner-X." This behavior indicates that remote deployment of applications or scripts is occurring, potentially for legitimate IT administrative reasons or for malicious actions such as establishing persistence or unauthorized software installation. The relevant MITRE ATT&CK tactics for this activity are "Persistence" (T1543.003) and "Privilege Escalation."

  Primary telemetry sources include Windows Event logs, specifically Event ID 7045 generated by the Service Control Manager. If malicious, this behavior could allow an adversary to maintain access to enterprise systems covertly. Importantly, this detection does NOT confirm that the activity is malicious on its own; legitimate use of PDQDeploy for software deployment can trigger the alert.

  ### Investigation Steps

  - **Check Event ID 7045 for service creation details**: Review Windows Security logs for Event ID 7045. Look for entries with "PDQDeployRunner-" in the ServiceName field to identify if a new deployment service was created.

  - **Verify the ImagePath**: Ensure the ImagePath for the detected service contains legitimate paths, typically pointing to known PDQDeploy installation directories (e.g., `C:\Program Files (x86)\PDQ Deploy`). Anomalous paths may indicate malicious activity.

  - **Review recent software deployment logs**: Cross-reference the installation time of the service with software deployment execution logs from PDQDeploy to determine if an authorized deployment occurred. Legitimate deployment will align with approved change management processes.

  - **Compare system roles**: Assess whether the host is part of a critical asset group or aligned with roles typically using PDQDeploy. Unusual service installations on non-targeted endpoints may warrant further investigation.

  - **Look for anomalous service configurations**: Identify whether the service is set to autostart and examine its startup type (automatic, manual). A manual start without clear justification could indicate potential misuse.

  ### Prioritization

  This alert carries a medium severity level due to the mixed potential for benign and malicious activity. Given that PDQDeploy is commonly used within IT operations, the likelihood of e abuse as a persistence mechanism remains a concern, especially if associated with other suspicious behaviors on critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Windows Event logging; missing logs could prevent effective monitoring. Legitimate administrative use cases for deploying software via PDQDeploy can often trigger this alert, complicating assessments. A related detection that may strengthen monitoring includes alerts for unusual changes to startup items (e.g., Task Scheduler events or modifications to registry startup settings) that may work in conjunction with service installations.

