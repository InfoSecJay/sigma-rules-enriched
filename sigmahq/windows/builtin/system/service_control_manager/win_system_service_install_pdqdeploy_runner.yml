title: New PDQDeploy Service - Client Side
id: b98a10af-1e1e-44a7-bab2-4cc026917648
status: test
description: |
  Detects PDQDeploy service installation on the target system.
  When a package is deployed via PDQDeploy it installs a remote service on the target machine with the name "PDQDeployRunner-X" where "X" is an integer starting from 1
references:
- https://documentation.pdq.com/PDQDeploy/13.0.3.0/index.html?windows-services.htm
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-22
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'PDQDeployRunner-'
  - ServiceName|startswith: 'PDQDeployRunner-'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of services associated with PDQDeploy, a remote management tool for deploying software on Windows systems. When a package is deployed using PDQDeploy, it installs a service with the naming convention "PDQDeployRunner-X", where "X" is an integer value. An attacker could exploit this tool to gain persistence on the target machine, allowing them to execute further malicious activities or escalate privileges. Compromised, misconfigured, or malicious use of PDQDeploy can lead to unauthorized software installations or even command control capabilities.

  The relevant MITRE ATT&CK tactics impacted by this activity include **Persistence (T1543.003)**, which relates to the installation of services to maintain access to the system. This tactic is crucial for an adversary looking to maintain prolonged control of compromised systems. Detection relies heavily on system-level logs that record changes to services, specifically `Event ID 7045`, which captures new service installations.

  Primary data sources include the Windows Service Control Manager (SCM) logs, which track events related to service installations, deletions, and modifications. Investigating these logs can help identify whether unauthorized services are being introduced to the environment.

  ### Investigation Steps
  - **Review Service Installation Events:** Check for `Event ID 7045` in Windows logs to identify newly created services. Focus on services named "PDQDeployRunner-X" to verify if the service matches the detection criteria.
  - **Analyze ImagePath and ServiceName:** Examine the `ImagePath` and `ServiceName` of newly created services for signs of exploitation or misconfiguration. Legitimate services will typically follow expected naming and path conventions.
  - **Cross-reference Approved Tools:** Validate the deployment of PDQDeploy against the list of approved software in the organization. Ensure that the detected service aligns with legitimate administrative practices and authorized usage.
  - **Check for Unusual Activity:** Assess system behavior around the time of service installation. Look for subsequent process executions or network activity that could indicate malicious use of the newly installed service.

  ### Prioritization
  The alert is classified as medium severity due to the potential for ongoing unauthorized access and the ability of attackers to leverage legitimate tools for malicious purposes. While PDQDeploy can be used for valid administrative needs, its capabilities can also be exploited, making close monitoring essential.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that not all instances of PDQDeploy can be monitored if logging is not properly configured on all endpoints. The detection logic assumes that the `Event ID 7045` is enabled and thoroughly collected within the environment. If administrative privileges are compromised, an adversary might deploy the service without triggering alerts. Additionally, the presence of the service does not guarantee malicious intent, as legitimate users may install PDQDeploy for appropriate workstation management. Adequate configurations and monitoring must be in place to ensure comprehensive detection.

