title: HackTool Service Registration or Execution
id: d26ce60c-2151-403c-9a42-49420d87b5e4
status: test
description: Detects installation or execution of services
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-21
modified: 2023-08-07
tags:
- attack.execution
- attack.t1569.002
- attack.s0029
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID:
    - 7045
    - 7036
  selection_service_name:
    ServiceName|contains:
    - 'cachedump'
    - 'DumpSvc'
    - 'gsecdump'
    - 'pwdump'
    - 'UACBypassedService'
    - 'WCE SERVICE'
    - 'WCESERVICE'
    - 'winexesvc'
  selection_service_image:
    ImagePath|contains: 'bypass'     # https://gist.github.com/tyranid/c24cfd1bd141d14d4925043ee7e03c82#file-scmuacbypass-cpp-L159
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify the installation or execution of potentially malicious Windows services that are commonly associated with credential dumping and privilege escalation tools. These services may be registered or executed as part of an attacker's toolkit to facilitate unauthorized access to user credentials or sensitive information. Tools like cachedump, gsecdump, and WCE (Windows Credential Editor) can leverage these services to gain further access or move laterally within the network.

  The rule correlates to multiple techniques within the MITRE ATT&CK framework, specifically under the tactics of Execution (TA0002) and Credential Access (TA0006). Techniques such as Service Execution (T1569.002) and Process Injection (T1055) may be applicable as they highlight how attackers can use services to run malicious payloads and extract credentials without detection. The primary data sources for this evidence include Windows Event Logs related to the Service Control Manager (Event IDs 7045 and 7036), which provide insight into changes made to service registrations.

  ### Investigation Steps
  - **Review Service Control Manager Logs:** Examine Windows Event Logs for Event IDs 7045 and 7036 to identify any unauthorized or suspicious service registrations or executions.
  - **Analyze Service Names and Paths:** Investigate the names and paths of recently created services for indicators matching known credential dumping tools (e.g., cachedump, gsecdump) or any unusual naming conventions that may signify obfuscation.
  - **Check for Service Dependencies:** Look for any services that depend on or call other suspicious services as this could indicate further malicious activity or lateral movement within the environment.
  - **Correlate with Process Creation Logs:** Cross-reference the detected service activity with process creation events to identify if these services are being invoked by other potentially malicious processes or users.

  ### Prioritization
  The severity of this alert is rated as high due to the potential impact of credential dumping tools and techniques on an enterprise environment, which can lead to significant data breaches, unauthorized access, and lateral movement within networks.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage, including potential evasion techniques employed by attackers who may use legitimate services or tools not detected by this rule. The detection logic assumes the normal operational baseline for services and may miss variations. Additionally, proper logging and configuration of Windows Event Logs are required for the alert to function effectively; any misconfigurations or lack of logging could hinder detection capabilities.

