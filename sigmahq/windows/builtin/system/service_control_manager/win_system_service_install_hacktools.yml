title: HackTool Service Registration or Execution
id: d26ce60c-2151-403c-9a42-49420d87b5e4
status: test
description: Detects installation or execution of services
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-21
modified: 2023-08-07
tags:
- attack.execution
- attack.t1569.002
- attack.s0029
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID:
    - 7045
    - 7036
  selection_service_name:
    ServiceName|contains:
    - 'cachedump'
    - 'DumpSvc'
    - 'gsecdump'
    - 'pwdump'
    - 'UACBypassedService'
    - 'WCE SERVICE'
    - 'WCESERVICE'
    - 'winexesvc'
  selection_service_image:
    ImagePath|contains: 'bypass'     # https://gist.github.com/tyranid/c24cfd1bd141d14d4925043ee7e03c82#file-scmuacbypass-cpp-L159
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the registration or execution of suspicious Windows services associated with known hacking tools. Typical attacker objectives may include credential dumping, privilege escalation, or maintaining persistence on compromised systems. This behavior fits within the MITRE ATT&CK framework under the Execution tactic (T1203) and the technique for Service Execution (T1569.002).

  Primary telemetry sources include Windows Security Event Logs, specifically Event IDs 7045 (service installation) and 7036 (service state change). If malicious, the establishment of these services could allow adversaries to access sensitive data or retain command over the compromised system. However, this detection alone does NOT confirm that malicious activity occurred without further context from additional logs or evidence of exploitation.

  ### Investigation Steps

  - **Review Service Installation Events:** Check Windows Security Event ID 7045 for any new service registrations. Look specifically for services named 'cachedump', 'DumpSvc', 'gsecdump', 'pwdump', 'UACBypassedService', 'WCE SERVICE', 'WCESERVICE', or 'winexesvc'.
  - **Examine Service State Transitions:** Review Event ID 7036 for the state changes of suspicious services immediately following the 7045 events. Malicious services typically show rapid transitions to running state after creation.
  - **Identify Service Image Paths:** Analyze the 'ImagePath' field in Event ID 7045 for paths containing 'bypass'. Any path that indicates an attempt to bypass security features (such as UAC) should be treated with high suspicion.
  - **Check for Legitimate Services Running:** Validate established services against known good services in your organization. Compare service names and paths against an inventory of legitimate services to differentiate benign behavior from potentially malicious activity.
  - **Correlate with Process Creation Events:** Investigate for related process creation events (Security Event ID 4688 or Sysmon Event ID 1) that coincide with the service registration. Look for unexpected execution of processes that interact with the newly created service.
  - **Evaluate Asset Criticality:** Focus on high-value assets (such as domain controllers, database servers) that would be most impacted by service installation of these nature. Increased vigilance is needed on these systems due to higher risks of credential harvesting and persistence.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems and the rarity of legitimate services being installed with such names. The likelihood of malicious abuse is significant, as these naming conventions are often associated with known exploitation tools. Moreover, the behavior aligns with common tactics employed by adversaries during attacks.

  ### Blind Spots and Assumptions

  Detection may be evaded by renaming legitimate services or using obscure service names. Reliable detection requires comprehensive logging of Event IDs 7036 and 7045, as well as configurations for Sysmon to capture process creation events. Legitimate software installations or updates may trigger this alert if they mimic the signature of the detected services. A companion detection to consider would be monitoring for unusual outbound connections or parent-child process relationships consistent with service execution.

