title: Service Installation in Suspicious Folder
id: 5e993621-67d4-488a-b9ae-b420d08b96cb
status: test
description: Detects service installation in suspicious folder appdata
author: pH-T (Nextron Systems)
references:
- Internal Research
date: 2022-03-18
modified: 2024-01-18
tags:
- attack.persistence
- attack.privilege-escalation
- car.2013-09-005
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - '\AppData\'
    - '\\\\127.0.0.1'
    - '\\\\localhost'
  filter_optional_zoom:
    ServiceName: 'Zoom Sharing Service'
    ImagePath|contains: ':\Program Files\Common Files\Zoom\Support\CptService.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects instances where a Windows service is installed in suspicious folders, specifically within the AppData directory. This behavior is often leveraged by attackers to persist malicious payloads or maintain access to compromised systems. By installing services in less scrutinized directories, such as AppData, attackers can evade detection and ensure the persistence of their malware even after restarts or user logouts.

  The possible threat scenario here involves an attacker using malware to create or install a service that can run on system startup, potentially facilitating further malicious activities like privilege escalation or lateral movement within the network. The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1543.003)** and **Privilege Escalation (T1068)**, indicating a focus on maintaining access and escalating permissions.

  Primary data sources that provide the best evidence for this detection include **Windows Event logs**, specifically **Service Control Manager events (Event ID 7045)**, which log attempts to install new services. Analyzing these logs can reveal unauthorized service installations that may indicate malicious activity.

  ### Investigation Steps
  - **Review Event Logs**: Collect and analyze Windows Event Logs, specifically focusing on Event ID 7045. Look for unusual service installations, particularly those pointing to the AppData directory.

  - **Examine Image Paths**: Investigate the paths associated with newly installed services, paying close attention to any that include `\AppData\`, `\\127.0.0.1`, or `\\localhost`. Services running from these locations may be suspect.

  - **Identify Unusual Services**: Cross-reference newly created services against known legitimate services. Investigate any services with suspicious names or those originating from uncommon directories.

  - **Check Service Dependencies**: Analyze the dependencies of the installed services to determine if they are linked to legitimate processes or other suspicious activities that could indicate a deeper compromise.

  ### Prioritization
  This alert is considered medium severity due to the potential for malware persistence and system manipulation. The likelihood of encountering this behavior in an enterprise environment is increased, especially in sectors susceptible to cyber threats, making it crucial to monitor for such indicators.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logs for Event ID 7045 are not properly collected or if the Security Event Logging policies are not configured to capture all necessary details. The detection logic assumes that any service installed in the AppData folder is suspicious, potentially leading to false positives from legitimate applications that may follow similar installation patterns. Adequate logging configurations and monitoring of service installations are necessary for the alert to function effectively.

