title: Service Installation in Suspicious Folder
id: 5e993621-67d4-488a-b9ae-b420d08b96cb
status: test
description: Detects service installation in suspicious folder appdata
author: pH-T (Nextron Systems)
references:
- Internal Research
date: 2022-03-18
modified: 2024-01-18
tags:
- attack.persistence
- attack.privilege-escalation
- car.2013-09-005
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - '\AppData\'
    - '\\\\127.0.0.1'
    - '\\\\localhost'
  filter_optional_zoom:
    ServiceName: 'Zoom Sharing Service'
    ImagePath|contains: ':\Program Files\Common Files\Zoom\Support\CptService.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of a Windows service into a suspicious folder, specifically targeting paths that include the AppData directory. This behavior is often associated with malware attempting to persist on a system by creating services in non-standard directories, thereby evading detection mechanisms focused on conventional service locations. The attacker’s objective is to ensure that malicious code is executed on system startup by leveraging the Windows service infrastructure.

  This detection aligns with the MITRE ATT&CK framework under the Persistence tactic (TA0002) and involves the technique of Windows Service Installer (T1543.003). The primary telemetry source is the Windows System Event Log, specifically Event ID 7045, which logs service installations. If malicious, this behavior could lead to full control of the system, potential data exfiltration, or lateral movement within the network. Importantly, the detection does NOT confirm malicious intent or activity on its own, as legitimate applications may also install services in these locations.

  ### Investigation Steps

  - **Review Service Installation Logs:**
    Examine Windows System Event Log for Event ID 7045. Focus on logs where the `Provider_Name` is 'Service Control Manager' and `ImagePath` contains '\AppData\'.

  - **Identify Malicious Indicators:**
    Look for `ImagePath` values containing suspicious executables or known malware signatures. For example, any paths that reference executables like `CptService.exe` in non-standard locations may signal malicious intent.

  - **Assess Normal Application Behavior:**
    Cross-reference the service installation against known legitimate applications. Services installed in `C:\Program Files\` or `C:\Program Files (x86)\` are typically benign, while installations in user-specific paths like `AppData` may warrant further scrutiny.

  - **Check Service Configuration and Permissions:**
    Investigate the service's configurations by querying `sc qc <ServiceName>`. Note any irregularities like high privileges (e.g., Local System) that deviate from standard operational protocols.

  - **Validate Network Connections:**
    If applicable, monitor for outbound connections from the newly created service using tools like Sysmon (Event ID 3). Determine if the service is connecting to external IP addresses, especially those flagged as malicious.

  - **Consider Host Role:**
    Identify the role of the affected host. For instance, on domain controllers or critical application servers, unauthorized services could have a more significant impact and should be escalated for immediate action.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the system, especially if the service is part of a broader lateral movement or persistence strategy employed by attackers. The likelihood of malicious abuse is moderate given the common practice of employing such techniques in attacks, but it may also represent benign activity from newly deployed legitimate software.

  ### Blind Spots and Assumptions

  One limitation is the potential for evasion techniques, such as rootkits hiding service installations. Furthermore, without comprehensive logging configurations, some Event IDs may not be captured, resulting in incomplete visibility. Legitimate software installations, such as auto-updaters or background services, may trigger this alert. A related detection could involve monitoring for unusual file modifications within the AppData directory (e.g., tracking changes to `CreateFile` operations for suspicious executables).

