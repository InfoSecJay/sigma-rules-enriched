logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID:
    - 7045
    - 7036
    ServiceName|contains:
            # Based on https://github.com/SigmaHQ/sigma/pull/2841
    - 'AmmyyAdmin'         # https://www.ammyy.com/en/
    - 'Atera'
    - 'BASupportExpressSrvcUpdater'         # https://www.systemlookup.com/O23/6837-BASupSrvcUpdater_exe.html
    - 'BASupportExpressStandaloneService'         # https://www.systemlookup.com/O23/6839-BASupSrvc_exe.html
    - 'chromoting'
    - 'GoToAssist'         # https://www.goto.com/it-management/resolve
    - 'GoToMyPC'         # https://get.gotomypc.com/
    - 'jumpcloud'
    - 'LMIGuardianSvc'         # https://www.logmein.com/
    - 'LogMeIn'         # https://www.logmein.com/
    - 'monblanking'
    - 'Parsec'
    - 'RManService'         # https://www.systemlookup.com/O23/7855-rutserv_exe.html
    - 'RPCPerformanceService'         # https://www.remotepc.com/
    - 'RPCService'         # https://www.remotepc.com/
    - 'SplashtopRemoteService'         # https://www.splashtop.com/
    - 'SSUService'
    - 'TeamViewer'
    - 'TightVNC'         # https://www.tightvnc.com/
    - 'vncserver'
    - 'Zoho'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of remote access tools (RATs) on Windows systems, which may indicate malicious activity or unauthorized access. These tools are often leveraged by threat actors to maintain persistence, execute commands remotely, and infiltrate systems unnoticed. By monitoring for specific service names and event IDs related to the System Service Control Manager, this rule aims to spotlight potential intrusions where attackers install malicious software for unauthorized access.

  The suspected threat behaviors align with MITRE ATT&CK tactics such as **Persistence** (T1543.003) and **Execution** (T1569.002). The primary goal of an attacker utilizing a remote access tool is to establish a foothold in the network, enabling further exploitation or reconnaissance operations. Detection is crucial for timely mitigation because these tools can provide attackers with extensive control over victim machines.

  ### Investigation Steps
  - **Review Service Installation Logs**: Check Windows Event ID 7045 to identify newly installed services and correlate them with known legitimate services. Look for the specific service names listed in the detection rule.
  - **Analyze Process Creation Events**: Gather logs related to process creation (Event ID 4688) to check if any instances of the detected services are spawning processes that exhibit suspicious behavior, such as outbound network connections to unknown endpoints.
  - **Inspect Communication Patterns**: Investigate network traffic logs focusing on devices with newly detected services to identify any unauthorized remote connections that match the use of RATs.
  - **Validate User and System Context**: Analyze user privileges and contexts under which these services were installed to understand the legitimacy of their presence; this can help isolate potentially compromised accounts or systems.

  ### Prioritization
  The severity of this alert is medium due to the significant risk that unauthorized remote access tools pose to enterprise environments. Such tools can facilitate substantial data breaches and system compromises if left undetected.

  ### Blind Spots and Assumptions
  While this rule effectively identifies installations of known remote access tools, it may not cover custom or lesser-known RATs that do not match the specified service names. The detection logic assumes that all service installations are logged appropriately, which may not be the case if logging is misconfigured. Proper configuration of Windows event logging for the System service is necessary to ensure the effectiveness of this alert.

