detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID:
    - 7045
    - 7036
    ServiceName|contains:
            # Based on https://github.com/SigmaHQ/sigma/pull/2841
    - 'AmmyyAdmin'         # https://www.ammyy.com/en/
    - 'Atera'
    - 'BASupportExpressSrvcUpdater'         # https://www.systemlookup.com/O23/6837-BASupSrvcUpdater_exe.html
    - 'BASupportExpressStandaloneService'         # https://www.systemlookup.com/O23/6839-BASupSrvc_exe.html
    - 'chromoting'
    - 'GoToAssist'         # https://www.goto.com/it-management/resolve
    - 'GoToMyPC'         # https://get.gotomypc.com/
    - 'jumpcloud'
    - 'LMIGuardianSvc'         # https://www.logmein.com/
    - 'LogMeIn'         # https://www.logmein.com/
    - 'monblanking'
    - 'Parsec'
    - 'RManService'         # https://www.systemlookup.com/O23/7855-rutserv_exe.html
    - 'RPCPerformanceService'         # https://www.remotepc.com/
    - 'RPCService'         # https://www.remotepc.com/
    - 'SplashtopRemoteService'         # https://www.splashtop.com/
    - 'SSUService'
    - 'TeamViewer'
    - 'TightVNC'         # https://www.tightvnc.com/
    - 'vncserver'
    - 'Zoho'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the installation of services associated with various remote access tools (RATs) on Windows systems, specifically monitoring for specific service names and related event IDs. The likely objective of an adversary utilizing RATs is to establish persistent access to a compromised system, allowing for remote control and data exfiltration. This behavior falls under the MITRE ATT&CK tactic of Persistence and the technique ID T1543.003, which pertains specifically to the installation of application-layer services.

  The primary telemetry sources for this detection include Windows Security Event ID 7045 (for service installation) and ID 7036 (for service state changes), monitored via the System log. The security impact of these installations is significant, as they can enable unauthorized control over systems and facilitate further attacks. Importantly, this detection does NOT confirm malicious activity on its own; legitimate software installations can trigger the same alerts.

  ### Investigation Steps

  - **Verify the Service Installation Event**: Check for Windows Event ID 7045 in the System log. Investigate the `ServiceName` field for entries corresponding to known remote access tools, such as "TeamViewer" or "LogMeIn”.

  - **Evaluate Service Status Changes**: Review Windows Event ID 7036 in the System log for changes in the service status of detected remote access tools. Active services that become running shortly after installation may indicate suspicious activity.

  - **Investigate Authoritative Sources**: Cross-reference the installed services against your organization's approved software list. If an entry like "AmmyyAdmin" or "TightVNC" is not on this list, flag it for further investigation.

  - **Review Network Connections**: Analyze current network connections for the host by checking the output of `netstat` or equivalent monitoring tools. Look for outgoing connections to unusual IPs that correspond to the detected RATs.

  - **Check for User Activity**: Investigate user activity logs, and look for accounts that have installed or interacted with the remote access tools. Legitimate installations typically correlate with authorized personnel and tasks, while unauthorized installations might appear on user accounts without a clear reason.

  - **Examine Scheduled Tasks**: Assess for any scheduled tasks or startup entries that might be created during the installation of the RAT. These often indicate attempts to maintain persistence beyond the initial service installation.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of the affected systems. Since remote access tools are frequently abused by adversaries for unauthorized access, the likelihood of malicious use is moderate. These tools are commonly weaponized in attacks against enterprises, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  This detection might be evaded by threat actors using custom-built or less common remote access software that does not fit the specified patterns in the rule. Reliable detection requires comprehensive logging of Windows Event IDs related to service management. Legitimate activity that may trigger this alert includes administrative tool installations or IT support software. Related detections may include closely monitoring network traffic for remote access tool signature patterns to strengthen coverage against misuse.

