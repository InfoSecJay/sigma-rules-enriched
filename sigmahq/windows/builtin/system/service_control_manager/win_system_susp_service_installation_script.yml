logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_cmd_flags:
    ImagePath|contains|windash:
    - ' -c '
    - ' -r '
    - ' -k '
  selection_binaries:
    ImagePath|contains:
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious service installation scripts that may lead to unauthorized persistence and privilege escalation on Windows systems. Threat actors often deploy scripts leveraging various Windows scripting engines (such as PowerShell, WScript, or CScript) to create persistent services that can maintain access over time, bypassing traditional security controls. The manipulation of services can facilitate further exploitation, enable lateral movement, and establish footholds in a compromised environment.

  The rule correlates specific events from the Service Control Manager (EventID 7045) with the presence of command flags and known malicious binaries that suggest the installation of these services is not legitimate. Key tactics involved in this behavior include **Persistence (T1543)** and **Privilege Escalation (T1055)**, as attackers seek to maintain long-term access to the system while potentially elevating their privileges.

  Primary data sources for this detection include:
  - Windows Event Logs (specifically, the Service Control Manager logs for EventID 7045)
  - Process creation events that may indicate execution of suspicious binaries
  - Scripting engine logs, if available

  ### Investigation Steps
  - **Review Service Control Manager Logs:** Examine the Windows Event Logs for EventID 7045, specifically focusing on recent service installations noted in these logs to identify any unauthorized or unusual services created.
  - **Analyze Command Line Arguments:** Investigate the command line arguments associated with any identified service installations. Look for flags that may indicate unexpected behavior, such as `-c`, `-r`, and `-k`.
  - **Check Process Creation Events:** Collect and review Windows process creation logs for instances of binaries like `powershell`, `wscript`, `mshta`, and others mentioned in the detection logic. Evaluate the context of execution for potentially suspicious activity.
  - **Investigate Service Properties:** For any detected unauthorized services, check their properties for information indicating the source of installation, such as the account used to create the service and the binary path. Validate against known good configurations.

  ### Prioritization
  This alert should be considered high severity due to the potential impact of unauthorized service installations leading to long-term compromise of systems. The likelihood of exploitation is also marked as high, given that such scripting techniques are common among malicious actors aiming to gain persistent access.

  ### Blind Spots and Assumptions
  Detection may be limited if there are gaps in Windows Event Log collection, particularly if Service Control Manager logs (EventID 7045) are not being captured or are filtered. There is an assumption that the attacker has used well-known scripting binaries for installation, potentially missing custom or less common methods. Additionally, the effectiveness of this alert relies heavily on the correct configuration of logging within the Windows environment.

