note: |
  ### Technical Context

  This rule detects the installation of Windows services through scripts that may indicate malicious activity. Likely attacker objectives include establishing persistence on compromised systems or executing payloads with elevated privileges. This behavior is relevant to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Create or Modify System Process (T1543.003).

  Primary telemetry sources are Windows Event logs, specifically Security Event ID 7045 generated by the Service Control Manager, indicating service installations. If malicious, this behavior might allow an adversary persistent access to the network. This detection does NOT confirm an active compromise on its own, as legitimate applications may also use similar methods for service creation.

  ### Investigation Steps

  - **Check Event ID 7045:** Look for Event ID 7045 from the Service Control Manager in the Windows Security logs. Focus on recently created services, especially those containing `cscript`, `mshta`, `powershell`, `pwsh`, `regsvr32`, `rundll32`, or `wscript` in the ImagePath.

  - **Review ImagePath Flags:** Examine the ImagePath for custom flags such as ' -c ', ' -r ', or ' -k '. Legitimate services typically do not use these flags. If present in the ImagePath, this could indicate a malicious service installation.

  - **Correlate with Scheduled Tasks:** Check for associated scheduled tasks that may run these scripts (Event ID 4698). Malicious actors often set up both a service and a task to ensure persistence across reboots.

  - **Assess Service Behavior:** Investigate the service's registry entry under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services`. Look for attributes such as `Start` set to values like 2 (automatic) or 3 (manual). Legitimate services may typically have different configurations.

  - **Identify Recent Changes:** Cross-reference the creation time of the service with user activity around that timeframe. Actions by non-admin users creating services may indicate malicious behavior, as typical users lack the necessary permissions for such actions.

  - **Observe for Follow-on Activity:** Monitor for subsequent connections or executions initiated by the newly created service, especially those attempting to exfiltrate data or communicate with known command-and-control servers.

  ### Prioritization

  This alert is considered high severity due to its potential impact on system integrity. Affected systems might be compromised, allowing adversaries persistent access. The likelihood of this behavior being exploited by attackers is high, as techniques involving service installations are commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques like using legitimate application names or obscuring command execution methods. Reliable detection relies on properly configured logging, specifically Windows Security event logs for service creation. Legitimate service installations by administrative actions or third-party software may trigger alerts. Companion detections from related techniques, focusing on unauthorized PowerShell scripts (T1059.001), can strengthen overall coverage against related attack vectors.

