logsource:
  product: windows
  service: system
detection:
  selection_provider:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName|contains|all:
    - 'AnyDesk'           # Covers both AnyDesk Service and AnyDesk MSI Service
    - 'Service'
  - ImagePath|contains: 'AnyDesk'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the anydesk tool
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of AnyDesk, a remote access software, through Windows Event ID 7045 generated by the Service Control Manager. An adversary's objective in installing AnyDesk is typically to establish persistent remote access to the affected system for data exfiltration or further network compromise. The relevant MITRE ATT&CK techniques include Persistence (TA0003) through Remote Access Software (T1071.001). Key telemetry sources for this detection include Windows Event logs that capture service installations, specifically Event ID 7045.

  If malicious, the installation could allow an attacker to bypass traditional security measures and maintain control over a compromised environment. However, the detection does NOT confirm malicious intent on its own, as AnyDesk may also be used legitimately for remote work. This necessitates further investigation into the context of the installation.

  ### Investigation Steps

  - **Review event logs for installation details:** Check Windows Event ID 7045 in the Security log for the creation of the AnyDesk service. Look for the `ServiceName`, `ImagePath`, and `Provider_Name` fields to confirm installation specifics.

  - **Identify authorized AnyDesk usage:** Confirm if AnyDesk is typically used within the organization. Check documentation or user authorization requests that specify its installation on the endpoint in question.

  - **Analyze the installed service:** Investigate the `ServiceName` and `ImagePath` fields from Event ID 7045. A malicious installation may show unusual paths, while legitimate installations typically reside in the `C:\Program Files\AnyDesk` directory.

  - **Correlate with other endpoint activity:** Examine Sysmon Event ID 1 (Process Creation) related to AnyDesk processes for suspicious command-line arguments or unexpected parent processes that might indicate malicious usage alongside the service installation.

  - **Check for previous alerts or history:** Look for prior security alerts involving the endpoint or user to determine if this anomalous behavior aligns with patterns of previous incidents.

  ### Prioritization

  This alert has medium severity as the affected system's role in the network impacts its risk. The likelihood of malicious abuse is moderate, especially if AnyDesk is not sanctioned for use within the organization. Remote access software is commonly weaponized, making this alert significant for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of AnyDesk, making it crucial to have context around authorized software deployments. Evasion techniques could include renaming the AnyDesk service or using similar remote access tools. Essential log sources required for reliable detection include security logs that capture service control manager events. A related detection could involve monitoring for unusual remote access tool installations in conjunction with this alert, enhancing visibility into unauthorized remote access attempts.

