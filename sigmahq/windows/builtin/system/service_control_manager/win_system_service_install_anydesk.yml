detection:
  selection_provider:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName|contains|all:
    - 'AnyDesk'           # Covers both AnyDesk Service and AnyDesk MSI Service
    - 'Service'
  - ImagePath|contains: 'AnyDesk'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the anydesk tool
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of the AnyDesk remote access software on Windows systems by monitoring for specific service creation events. The likely attacker objective is to establish unauthorized remote access to a system, facilitating data exfiltration or further malicious actions. This behavior aligns with the Persistence tactic under the MITRE ATT&CK framework (TA0003) using the Remote Services technique (T1133). The primary telemetry source is Windows Event Logs, specifically looking for Service Control Manager Event ID 7045. If the installation is malicious, it could lead to significant compromises, including data theft or system manipulation. This detection does not confirm malicious intent by itself, as AnyDesk is a legitimate software that could be used in benign scenarios.

  ---

  ### Investigation Steps

  - **Check Event ID 7045 logs:** Review Windows Security Event ID 7045 logs to find instances of new service installations, focusing on any entries with `ServiceName` containing 'AnyDesk'. Look for the `ImagePath` associated with it to confirm the legitimacy of the installation.

  - **Validate service account:** Assess the account that installed the AnyDesk service. Legitimate installations usually occur from recognized IT or administrative accounts, whereas suspicious installations might come from unusual or service accounts.

  - **Examine related process logs:** Investigate the creation of processes associated with AnyDesk. Use Sysmon Event ID 1 to track process creation and look for AnyDesk-related executables (e.g., `AnyDesk.exe`) initiated shortly after the service installation.

  - **Monitor for lateral movement signs:** Check for unusual inbound connection attempts to the host running AnyDesk, particularly from unknown external IPs. This could indicate an attacker trying to access the system remotely after its installation.

  - **Assess asset criticality:** Identify the host where AnyDesk was installed. Critical systems (e.g., domain controllers, financial systems) should prompt immediate action due to higher risk exposure.

  - **Compare with known legitimate use:** Identify internal guidelines or documentation for authorized AnyDesk usage within the organization. If installations are in approved locations (like an IT helpdesk), it might be legitimate.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote access and the relatively high likelihood that adversaries could exploit this software. Remote access tools like AnyDesk are commonly weaponized, elevating the importance of timely investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if systems are configured not to log service installation events or if logging levels are insufficient. Legitimate installations might occur from IT staff using the software for remote assistance, which can trigger this alert. A related detection could include monitoring for unusual login activity after AnyDesk installation, providing additional context for the investigation.

