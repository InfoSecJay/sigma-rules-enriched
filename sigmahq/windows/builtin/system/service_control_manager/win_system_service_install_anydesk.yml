title: Anydesk Remote Access Software Service Installation
id: 530a6faa-ff3d-4022-b315-50828e77eef5
status: test
description: Detects the installation of the anydesk software service. Which could
  be an indication of anydesk abuse if you the software isn't already used.
references:
- https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron
  Systems)
date: 2022-08-11
modified: 2025-02-24
tags:
- attack.persistence
logsource:
  product: windows
  service: system
detection:
  selection_provider:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName|contains|all:
    - 'AnyDesk'           # Covers both AnyDesk Service and AnyDesk MSI Service
    - 'Service'
  - ImagePath|contains: 'AnyDesk'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the anydesk tool
level: medium
note: |
  ### Technical Context
  This rule detects the installation of the AnyDesk remote access software on Windows systems. The presence of AnyDesk can indicate possible abuse or unauthorized remote access activities, especially if the organization does not utilize this software as part of its approved toolset. Attackers may leverage remote access tools like AnyDesk to control compromised systems or escalate privileges, making their activities harder to detect.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003), as installing a remote access service is a common method for ensuring continued access to a compromised system. The specific technique associated with this action is **Install Application** (T1203), where malicious software is introduced into the environment under the guise of legitimate applications.

  Primary data sources for detecting this activity include **Windows Event Logs**, particularly focusing on the Service Control Manager logs that document service installations (Event ID 7045).

  ### Investigation Steps
  - **Review Service Control Manager Logs**: Look for Event ID 7045 entries correlating to AnyDesk. Examine the timestamp and context of the installation to determine if it aligns with known legitimate usage within the organization.

  - **Analyze System Image Path**: Validate the `ImagePath` associated with AnyDesk services. Investigate any atypical paths that may indicate malicious installations or alterations, particularly paths that deviate from standard installation locations.

  - **Correlate with User Activity**: Check for user account activity associated with the installation event. Investigate other related events such as logins around the installation time, particularly focusing on unusual login times or accounts not normally associated with software installations.

  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence feeds to check if AnyDesk installations correlate with known malicious behaviors or indicators, particularly those associated with past incidents of unauthorized access or related threat actors.

  ### Prioritization
  The alert is of medium severity, as the installation of remote access software can facilitate unauthorized access and enhance an attacker’s control over compromised systems, posing a significant risk to sensitive information and operational integrity.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage concerning user-invoked legitimate installations of AnyDesk, which can lead to false positives. The detection logic assumes that the presence of the software is unauthorized unless explicitly confirmed as approved within the organization. Required logs must be configured to include Event ID 7045 from the Service Control Manager to ensure that this detection operates effectively, necessitating that auditing and logging be correctly set on the relevant Windows systems to capture installation events.

