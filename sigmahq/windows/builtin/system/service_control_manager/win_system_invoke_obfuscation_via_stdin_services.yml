title: Invoke-Obfuscation Via Stdin - System
id: 487c7524-f892-4054-b263-8a0ace63fc25
status: test
description: Detects Obfuscated Powershell via Stdin in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task28)
author: Nikita Nazarov, oscd.community
date: 2020-10-12
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
        # ImagePath|re: '(?i)(set).*&&\s?set.*(environment|invoke|\${?input).*&&.*"'
    ImagePath|contains|all:
    - 'set'
    - '&&'
    ImagePath|contains:
    - 'environment'
    - 'invoke'
    - 'input'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies obfuscated PowerShell commands executed through standard input (stdin) in Windows environments, specifically by monitoring Windows Event Logs generated by the Service Control Manager (SCM). Attackers often use obfuscation techniques as part of malicious payloads to evade detection by security solutions. The main objective in these scenarios is to execute scripts or commands that manipulate system configurations or gather sensitive information while remaining undetected.

  The rule is relevant to several MITRE ATT&CK techniques, particularly:
  - **Defense Evasion (T1027)**: Utilizing obfuscation to hide malicious activity from security controls.
  - **Execution (T1059.001)**: The use of PowerShell as a scripting language to execute commands.

  The primary log sources for detecting these activities will include Windows Event Logs, especially those relating to service creations, which can provide insights into potentially malicious PowerShell invocations.

  ### Investigation Steps
  - **Review Event Logs:** Check the Windows Event Logs for Event ID 7045 to identify any new services created with obfuscated PowerShell commands.
  - **Analyze Command Line Arguments:** Investigate the command line associated with the identified services to understand the intention behind the obfuscated script. Look for common indicators of compromise or unusual arguments.
  - **Correlate with Other Logs:** Cross-reference findings with additional telemetry sources such as EDR (Endpoint Detection and Response) logs or network logs to identify any related suspicious activities or lateral movement.
  - **Examine User Context:** Determine the user account that initiated the command. Analyze the permission levels of the account to assess whether unauthorized access or escalation of privileges took place.

  ### Prioritization
  The severity of this alert is high due to the potential impact of malicious actors using obfuscation to execute unauthorized commands on enterprise systems. Given PowerShell's administrative capabilities, such activities could facilitate data exfiltration or further compromise of the environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for obfuscation techniques that do not involve creating new services. The detection logic assumes that all obfuscated PowerShell commands will utilize similar patterns seen in typical use cases; however, variations may exist. Additionally, this rule requires proper logging configuration for Event ID 7045 to function optimally, and any lapses in log retention or monitoring could diminish detection efficacy.

