logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
        # ImagePath|re: '(?i)(set).*&&\s?set.*(environment|invoke|\${?input).*&&.*"'
    ImagePath|contains|all:
    - 'set'
    - '&&'
    ImagePath|contains:
    - 'environment'
    - 'invoke'
    - 'input'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell commands via standard input (stdin) in Windows service logs, specifically focusing on the Service Control Manager events. The behavior suggests an attacker may be attempting to execute malicious scripts covertly while evading detection. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001 - Command and Scripting Interpreter: PowerShell) and Stealth (T1027 - Obfuscated Files or Information).

  Primary telemetry sources include Windows Event ID 7045 logs that capture service installation events. If this behavior is malicious, it can lead to system compromise, data exfiltration, or lateral movement within the network. Notably, this detection does NOT confirm that the script execution is inherently malicious; further context is necessary.

  ### Investigation Steps

  - **Review Event ID 7045 logs:** Examine Windows Event ID 7045 in the Security logs for details on service installations. Look for entries where `ImagePath` includes obfuscated commands utilizing 'set', '&&', and 'input' as these are indicators of potential malicious activity.

  - **Identify benign PowerShell uses:** Cross-reference any discovered service installations with known legitimate applications that use PowerShell scripts, such as system monitoring tools or administrative scripts. Check if the `ImagePath` corresponds to reputable vendors or organizational scripts.

  - **Evaluate service account context:** Assess the service account under which the suspect service is running. Services run by high-privilege accounts (e.g., SYSTEM or administrative accounts) are of greater concern than those running under low-privilege users.

  - **Correlate with other security events:** Check for related events like Execution (Event ID 4688 - Process Creation) that show if the PowerShell command was actually executed and if it spawned potentially malicious processes. Look for command line arguments that are obfuscated or suspicious.

  - **Examine file creation and modification times:** If file activity is logged, verify if any files associated with the obfuscation (e.g., temporary scripts) were created or modified around the same time as the service installation. Artifact locations to check include `%TEMP%`, PowerShell script directories, or any locations tied to the identified service.

  - **Monitor for follow-on behavior:** Watch out for lateral movements or exfiltration events occurring shortly after the rule-triggering event. Look for indicators like unusual outbound connections, process injections, or network traffic anomalies that could stem from the use of obfuscated scripts.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and the high likelihood that obfuscated PowerShell scripts are used for malicious purposes. The behavior is commonly associated with targeted attacks and intrusion methods.

  ### Blind Spots and Assumptions

  The detection may miss attacks that use non-standard obfuscation methods or encapsulation techniques that do not utilize traditional PowerShell scripting. Reliable detection requires proper logging configurations for Service Control Manager events (Event ID 7045). Legitimate application installations or updates may trigger this alert, particularly if administrative scripts are being updated. A related detection to consider is "Suspicious PowerShell Command Execution" to strengthen analysis coverage of PowerShell-related activity.

