logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
        # ImagePath|re: '(?i)(set).*&&\s?set.*(environment|invoke|\${?input).*&&.*"'
    ImagePath|contains|all:
    - 'set'
    - '&&'
    ImagePath|contains:
    - 'environment'
    - 'invoke'
    - 'input'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of obfuscated PowerShell commands executed via standard input, often indicating a misuse of scripting capabilities for malicious purposes. Likely attacker objectives include executing payloads without detection, bypassing security controls, or using legitimate scripting tools to achieve unauthorized access or data exfiltration. This behavior aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  Primary telemetry sources include Windows Event Logs, specifically Security Event ID 7045, which tracks Service Control Manager (SCM) events related to new service installations. If the behavior is malicious, it could lead to significant security incidents, such as system compromise or data breaches. It is crucial to note that this detection does NOT confirm an active compromise or unauthorized access on its own; further contextual analysis is required.

  ### Investigation Steps

  - **Review Event ID 7045 Details:** Examine the Service Control Manager log for Event ID 7045. Look for the presence of `ImagePath` containing 'set', '&&', 'environment', 'invoke', or 'input'. Malicious entries may have unusual or malformed paths indicating obfuscation.

  - **Correlate with PowerShell Logs:** Check for PowerShell logs (Event ID 4104) concerning command execution around the same timestamp. Look for commands containing obfuscated scripts or suspicious command line arguments that match the SCM entries.

  - **Identify Legitimate Usage:** Compare the detected event against your environment’s baseline for PowerShell usage. Legitimate scripts typically use clear command syntax without excessive chaining or unusual parameters.

  - **Analyze Parent Process Information:** Investigate the parent process of the detected invocation to determine if it was launched from a trusted application (e.g., script runner) or if it came from a potentially malicious or unknown source.

  - **Check for System Alterations:** Monitor for any new service creation that coincides with the detected event; noted service installations should align with known software and operational processes. New or unexpected services may indicate a security issue.

  - **Validate Output and Artifacts:** If data is being exfiltrated or commands are resulting in file creation, look for unusual file access patterns in the `$TEMP` directory or other temporary storage areas that might correlate with the execution of the obfuscated command.

  ### Prioritization

  This alert should be considered high severity as it indicates possible exploitation of PowerShell, a commonly weaponized tool used in attacks. The impact is especially critical if the affected system is a server or administrative workstation, increasing the potential for significant compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of advanced obfuscation techniques that can bypass standard logging. Ensure complete and accurate logging is enabled across PowerShell execution and Service Control Manager events. Legitimate administrative tasks, such as configuration updates or script testing, may also trigger this alert. A related detection rule for monitoring unauthorized PowerShell modules (T1059.001) could further enhance coverage and reduce false positives.

