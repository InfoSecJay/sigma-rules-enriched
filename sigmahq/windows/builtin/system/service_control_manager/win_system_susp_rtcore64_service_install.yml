note: |
  ### Technical Context

  This rule detects the installation of the RTCore service, commonly associated with the Micro-Star MSI Afterburner utility. An attacker might install this service to exploit vulnerabilities in the driver, providing elevated privileges to execute arbitrary code in the kernel, facilitating persistence or further exploitation. This behavior aligns with the MITRE ATT&CK technique for Persistence (T1547).

  The primary telemetry source is the Windows Event Log, specifically focusing on Event ID 7045 from Service Control Manager logs, which logs service installations. If this behavior is malicious, it could lead to further exploitation and compromise of the host system. This detection does NOT confirm that the service is inherently malicious, as it may also be installed for legitimate purposes associated with MSI Afterburner.

  ---

  ### Investigation Steps

  - **Check the service installation logs:** Review Windows Event ID 7045 for the RTCore64 service. Look for "ServiceName: RTCore64" and "Provider_Name: Service Control Manager" to confirm the installation event.

  - **Assess the host's software inventory:** Verify if MSI Afterburner is installed on the host. Check for legitimate installation paths (e.g., "C:\Program Files (x86)\MSI Afterburner\") to discern benign usage from potential misuse.

  - **Review service configuration:** Use PowerShell or command line to inspect the service configuration (`Get-Service RTCore64`). Look for unusual startup types or dependencies that deviate from the default settings.

  - **Validate process behavior:** Monitor for child process creation linked to the RTCore service (e.g., check Security Event ID 4688 or Sysmon Event ID 1 for process creation logs). Malicious activity would show anomalous process names or parent-child relationships.

  - **Examine network activity:** Analyze outgoing network connections (Windows Firewall logs or Sysmon Network Connection logs). Look for unusual traffic patterns or connections to known malicious IPs related to the exploitation of the RTCore driver.

  ---

  ### Prioritization

  Given its association with system exploitation and kernel-level access, this alert has a high severity. The potential impact on critical systems is significant, as the installation of this service could be leveraged for further compromise. While not broadly weaponized, this technique has been referenced in recent attacks, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where the RTCore service is installed without corresponding logs due to log retention policies or misconfigurations. Legitimate installations by users of MSI Afterburner could trigger this alert, especially on gaming or performance-optimizing systems. Companion detections, such as monitoring for known vulnerabilities related to MSI Afterburner, would enhance the security posture against this threat.

