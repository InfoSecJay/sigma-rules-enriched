  ### Technical Context
  This detection rule identifies instances where the RTCore service has been installed on a Windows system. The RTCore service is associated with MSI Afterburner, a tool commonly used for graphics card overclocking. However, its installation can also signify attempts by an attacker to exploit vulnerabilities in this driver for malicious purposes, such as escalating privileges or evading detection. In an enterprise setting, malicious actors might use such abuse to gain deeper access to systems or to manipulate performance monitoring.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1543)**, as the installation of a service can maintain continued access. Additionally, it may involve techniques such as **Privileged Escalation (T1068)** if an attacker leverages driver vulnerabilities to gain higher-level permissions. Primary data sources for detecting this activity include Windows Event Logs, specifically System logs that record Service Control Manager events.

  ### Investigation Steps
  - **Review Event Logs:** Inspect Windows System Event Logs for Event ID 7045 to confirm the installation of the RTCore64 service. Record timestamps and the account used for installation.
  - **Analyze Service Configuration:** Investigate the properties of the RTCore64 service. Look for unusual configurations such as non-standard execution paths or any signs of modification.
  - **Correlate with User Activity:** Identify the user account associated with the installation events. Investigate recent activity of that user for suspicious actions, such as the execution of unknown software or scripts.
  - **Check for Related Network Activity:** Use network logs to analyze any traffic tied to the system where the service was installed. Pay particular attention to any outbound connections that correlate with potential command and control behavior.

  ### Prioritization
  This alert is classified as high severity due to the potential for privilege escalation associated with the exploitation of a vulnerable driver. An attacker utilizing this method can gain significant control over affected systems, posing a considerable risk to the organization's security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where the Windows Event Logging policy is not configured to capture Service Control Manager events. The detection logic assumes that all installations of the RTCore service are suspicious; however, legitimate administrative actions may lead to false positives. For accurate detection, it is essential that Event ID 7045 logs are enabled and retained in the environment.

