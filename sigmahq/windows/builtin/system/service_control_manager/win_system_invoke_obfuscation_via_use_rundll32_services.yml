title: Invoke-Obfuscation Via Use Rundll32 - System
id: 641a4bfb-c017-44f7-800c-2aee0184ce9b
status: test
description: Detects Obfuscated Powershell via use Rundll32 in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task30)
author: Nikita Nazarov, oscd.community
date: 2020-10-09
modified: 2022-11-29
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ImagePath|contains:
    - 'value'
    - 'invoke'
    - 'comspec'
    - 'iex'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands using `rundll32.exe`, a common technique employed by adversaries to execute malicious payloads or scripts indirectly. The likely attacker objective behind this behavior is to execute unauthorized commands while minimizing detection, circumventing traditional security measures. Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and "Obfuscated Files or Information" (T1027).

  The primary telemetry sources include Windows Event Logs, specifically Event ID 7045 (Service Control Manager), which captures the creation of new services, including any spawned processes that utilize `rundll32.exe`. If the detected activity is indeed malicious, it may indicate a serious violation of system integrity and a potential compromise. This detection does NOT confirm in isolation whether the code was executed with malicious intent or if it was part of legitimate administrative activity.

  ### Investigation Steps

  - **Examine Event ID 7045 for new service entries:** Look for `ImagePath` that includes `rundll32`, `shell32.dll`, and additional obfuscation indicators. Note entries that contain `&&`, `value`, `invoke`, `comspec`, or similar strings to identify potential obfuscation.

  - **Identify expected legitimate use cases:** Check for legitimate administrative commands executing power shell scripts using `rundll32.exe` such as `Invoke-Expression` and other known good scripts in the organization. Compare timestamps and context of the event to identify benign activity.

  - **Validate process execution:** Use Process Explorer or similar tools to investigate any active instances of `rundll32.exe`. Check command-line arguments for keywords like `iex` or evidence of obfuscation, such as extensive use of ampersands (`&&`).

  - **Correlate findings with PowerShell logs:** Review Windows PowerShell logs (Event ID 4104) to see if the same obfuscation patterns align with PowerShell script execution, indicating a higher confidence level of malicious activity.

  - **Check for files or artifacts linked to this behavior:** Look for any newly created or modified files in the directories associated with the detected event's path, focusing on script files or unusual executable behaviors that could link back to the `rundll32` invocation.

  ### Prioritization

  This alert has high severity due to the potential impact it can have on critical systems, including complete system compromise. The likelihood of malicious abuse is significant, as the obfuscation technique is a known method leveraged by attackers to execute scripts stealthily. This behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by advanced obfuscation techniques beyond the specified patterns, which could evade this detection rule. Comprehensive logging must be enabled to capture all related telemetry, including PowerShell logging and deep system monitoring. Legitimate use cases, such as administrative tasks using `rundll32` for automation, may trigger this alert. Companion detections, such as monitoring for unusual network activity post `rundll32` executions, can strengthen coverage of potential malicious actions.

