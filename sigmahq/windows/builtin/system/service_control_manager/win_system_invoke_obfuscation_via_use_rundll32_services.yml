title: Invoke-Obfuscation Via Use Rundll32 - System
id: 641a4bfb-c017-44f7-800c-2aee0184ce9b
status: test
description: Detects Obfuscated Powershell via use Rundll32 in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task30)
author: Nikita Nazarov, oscd.community
date: 2020-10-09
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ImagePath|contains:
    - 'value'
    - 'invoke'
    - 'comspec'
    - 'iex'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands via the `rundll32` utility, which is often leveraged by attackers to evade detection. The likely objective is to execute malicious scripts in a stealthy manner by obscuring the command syntax, making it harder for traditional security tools to identify harmful activities. The relevant MITRE ATT&CK tactics include Defense Evasion (TA0011) and Execution (TA0002), specifically techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry sources for this detection are Windows Event Logs, specifically looking at Event ID 7045 generated by the Service Control Manager. If malicious, this behavior can compromise system integrity, execute arbitrary code, and could lead to lateral movement or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; the context of execution and the full command line used must be evaluated to determine the legitimacy.

  ### Investigation Steps

  - **Review Event ID 7045 details:** Check for Event ID 7045 in the System logs indicating newly created services. Look for anomalies in the `ImagePath` field such as "rundll32" along with suspicious strings like "&&", "invoke", or "iex".

  - **Correlate with Process Creation Logs:** Validate the creation of processes associated with this event by cross-referencing with Security Event ID 4688 or Sysmon Event ID 1 logs. Specifically, look for `rundll32.exe` execution with command-line arguments that contain obfuscated PowerShell commands.

  - **Identify Legitimate Uses:** Assess if the calls to `rundll32` relate to known legitimate software or regular administrative tasks, such as system updates or maintenance tasks, that could generate similar patterns in the logs.

  - **Seek Unusual Execution Contexts:** Investigate the user account associated with the execution. Determine if it matches known administrative accounts or anomaly in the user behavior that deviates from the established baseline.

  - **Analyze Process Tree:** Use Sysmon Event ID 1 to view the parent-child process relationship. A typical malicious behavior involves `rundll32` being spawned by a suspicious parent process usually indicative of evasion tactics.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical systems, as the ability to execute obfuscated scripts can be exploited for various nefarious actions such as malware delivery or credential theft. The likelihood of malicious abuse is elevated because `rundll32` is a common tool used in attacks for executing arbitrary code. This technique is frequently weaponized by threat actors.

  ### Blind Spots and Assumptions

  This detection can be circumvented using various evasion techniques, such as using different execution methods or leveraging other legitimate processes without obfuscation. Consistent logging of Service Control Manager events must be enabled to sustain detection reliability. Legitimate activity may trigger the alert in cases where system scripts or benign applications misuse the `rundll32` command. A related detection such as monitoring PowerShell Command-Line logs (Event ID 4104) would strengthen overall coverage against similar obfuscation tactics.

