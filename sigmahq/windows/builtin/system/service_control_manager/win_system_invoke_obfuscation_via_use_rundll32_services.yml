title: Invoke-Obfuscation Via Use Rundll32 - System
id: 641a4bfb-c017-44f7-800c-2aee0184ce9b
status: test
description: Detects Obfuscated Powershell via use Rundll32 in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task30)
author: Nikita Nazarov, oscd.community
date: 2020-10-09
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ImagePath|contains:
    - 'value'
    - 'invoke'
    - 'comspec'
    - 'iex'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where an attacker may be using obfuscated PowerShell commands executed through `rundll32.exe`, a legitimate Windows utility normally used for executing DLLs. By leveraging this executable in conjunction with obfuscation techniques, attackers can bypass traditional security mechanisms and execute malicious payloads stealthily. The objective of such an attack often includes executing malware, executing unauthorized commands, and maintaining persistence within the environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion (TA0005)**: Techniques that help attackers to evade detection or bypass security controls.
  - **Obfuscated Files or Information (T1027)**: Utilizing obfuscation as a method to conceal malicious code or commands.
  - **Command and Scripting Interpreter: PowerShell (T1059.001)**: Execution of PowerShell commands to carry out malicious activities.

  Primary data sources for this detection include logs from the Windows Service Control Manager, particularly Event ID 7045, which logs when a new service is installed. These logs provide insights into actions taken by `rundll32.exe`, which may indicate malicious behavior when suspicious arguments or paths are used.

  ### Investigation Steps
  - **Review Service Installation Logs**: Check Event ID 7045 in the Service Control Manager logs for any `rundll32.exe` invocations that include obfuscated arguments or unusual parameters, specifically looking for paths that include `&&`, `shell32.dll`, or `shellexec_rundll`.

  - **Examine Process Creation Events**: Correlate the identified service installations with process creation events to identify any corresponding PowerShell executions or other scripts run in a suspicious context, paying attention to their arguments for obfuscation patterns.

  - **Analyze System and Security Logs**: Inspect system and security logs for related events that indicate unusual changes, such as new services starting, or any direct calls to `rundll32` that aren’t part of normal system operations, particularly focusing on the user accounts involved.

  - **Correlate with Known Threat Indicators**: Use threat intelligence feeds or internal lists of known bad indicators to check if the detected behavior correlates with any known malicious activity or tools associated with obfuscation and PowerShell execution.

  ### Prioritization
  The severity of this alert is high due to the potential for significant malicious actions being executed on the network through obfuscated commands. The ability of attackers to execute code using legitimate tools and evade detection poses a considerable risk to enterprise environments.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage for cases where attackers may use other avenues for obfuscation or execute code without invoking `rundll32.exe`. This detection logic assumes that all necessary logging for Event ID 7045 is enabled and retained. If service management logs are not collected consistently, or obfuscation methods are varied, the rule may miss other instances of malicious behavior leveraging similar techniques. Additionally, variations in the arguments used may not be captured if they do not fit expected patterns defined in the detection logic.

