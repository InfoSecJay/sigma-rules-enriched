note: |
  ### Technical Context
  This detection rule identifies the installation of services on a Windows system by unusual clients—that is, clients with Process ID (PID) 0 or where the parent process has PID 0. Such events typically signal potentially malicious activities, including unauthorized privilege escalation or persistence mechanisms employed by attackers. In the Windows operating system, services are essential for running background processes, and manipulation of these services can allow attackers to establish lasting control over compromised systems.

  The likely threat scenario involves an adversary using service installation as a means to maintain persistence within the environment. By creating or modifying services, the attacker may aim to run malicious code during system startup or elevate privileges to access sensitive resources. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically techniques relating to creating or modifying Windows services (T1543).

  Primary data sources for this detection include the Security Event Logs from Windows, particularly logs generated by the Service Control Manager (EventID 7045). Monitoring these logs can help identify any unauthorized or suspicious service installations that deviate from typical organizational behavior.

  ### Investigation Steps
  - **Review Security Event Logs:** Check Windows Security Event logs for EventID 7045, focusing on entries where the Service Control Manager installed a service. Look for unusual client process IDs (0 or parent PID 0).
  - **Analyze Parent Process Relationships:** Correlate the service installation event with the process tree to understand the context of the parent process. Investigate the parent process’s legitimacy and behavior.
  - **Check for Service Configuration Changes:** Inspect the configuration and parameters of installed services for any suspicious entries, such as unexpected executable paths or command line arguments.
  - **Investigate User Activity:** Review user accounts and their activities around the time of service installation to correlate suspicious actions or unauthorized access with the detected event.

  ### Prioritization
  This alert is classified as high severity due to the potential for attackers to exploit installed services for persistence and privilege escalation, which can lead to significant compromise within the networked environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging is not properly enabled for the Service Control Manager or if the EventID 7045 is filtered out in the SIEM. There is an assumption that the environment has default security measures in place and that unusual service installations are indeed indicative of malicious activity, rather than benign administrative actions. Consistent configurations of event logging and monitoring for suspicious process activities are required for effective detection.

