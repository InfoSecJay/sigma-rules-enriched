note: |
  ### Technical Context

  This Sigma rule detects the installation of a Windows service by a client process that has a Process ID (PID) of 0 or whose parent process has a PID of 0. Such behavior is atypical as legitimate service installations should originate from user-mode processes with valid PIDs. The likely attacker objective is to establish persistence on a system by installing a service in a stealthy manner, bypassing usual security measures. This activity relates to the MITRE ATT&CK tactic of Persistence (ID: T1543) and Privilege Escalation (ID: T1543).

  Primary telemetry sources include Windows Event Logs, specifically filtering for System logs containing Event ID 7045 related to service creation. If malicious, the installation of hidden services could facilitate unauthorized control or further exploitation. However, this detection does NOT confirm that the activity is malicious without further context regarding the source of the service installation.

  ### Investigation Steps

  - **Check Event Details:** Review Event Log entries for Event ID 7045 in the System log. Look for attributes such as Service Name, Service Type, and the account under which the service was created to detect anomalies.

  - **Identify Client Process:** Investigate the client process with PID 0. Use Sysinternals tools or PowerShell to corroborate if any unusual processes correspond to this event, especially regarding legitimate services versus spontaneous random executables.

  - **Compare Parent PID:** Validate the parent process of the service installation. If its parent PID is also 0, further investigate processes that may have misused low-level system operations.

  - **Determine Expected Behavior:** For legitimate service installations, look for entries with typical user account processes (e.g., SYSTEM or known admin accounts) reflecting normal software installation workflow.

  - **Monitor Subsequent Service Behavior:** If a service is identified as suspicious, check for unusual service states via `Get-Service` command or relevant WMI queries. Look for services that automatically start, have no apparent associated files, or exhibit irregular resource usage.

  - **Review for Related Alerts:** Identify any associated security alerts or telemetry (such as the companion detection regarding similar anomalous installations). Such alerts might strengthen the case for malicious activity or reveal patterns of compromise.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems if a malicious service is installed. The likelihood of malicious abuse is significant, as stealthy service installations are commonly weaponized by advanced adversaries to maintain access to compromised environments.

  ### Blind Spots and Assumptions

  Detection limitations may arise from certain system events not being logged due to logging configurations. Evasion techniques might involve using legitimate services or processes to obscure malicious activity. Legitimate actions, such as system management or updates by trusted software, can trigger this alert when misconfigured. A related detection to consider for enhanced coverage is monitoring unexpected process creation (Event ID 4688) to correlate with unusual service installations.

