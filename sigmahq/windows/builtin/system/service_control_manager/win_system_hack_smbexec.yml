title: smbexec.py Service Installation
id: 52a85084-6989-40c3-8f32-091e12e13f09
status: test
description: Detects the use of smbexec.py tool by detecting a specific service installation
references:
- https://blog.ropnop.com/using-credentials-to-own-windows-boxes-part-2-psexec-and-services/
- https://github.com/fortra/impacket/blob/33058eb2fde6976ea62e04bc7d6b629d64d44712/examples/smbexec.py#L286-L296
- https://github.com/fortra/impacket/blob/edef71f17bc1240f9f8c957bbda98662951ac3ec/examples/smbexec.py#L60     # Old service name
author: Omer Faruk Celik
date: 2018-03-20
modified: 2023-11-09
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.002
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service_name:
    ServiceName: 'BTOBTO'
  selection_service_image:
    ImagePath|contains:
    - '.bat & del '
    - '__output 2^>^&1 >'
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying the installation of a service associated with the `smbexec.py` tool, a common exploitation utility used to execute commands on a remote Windows system over SMB (Server Message Block). The installation of a service named 'BTOBTO' with a suspicious command line often signifies an attacker attempting to achieve persistence on the compromised machine, allowing for continued access even after initial intrusion vectors may be closed.

  Attackers leveraging tools like `smbexec.py` aim to facilitate lateral movement within a network, enabling them to execute arbitrary commands and potentially escalate privileges. This aligns with the MITRE ATT&CK tactics of **Lateral Movement** (TA0008) and **Execution** (TA0002), specifically techniques such as **Remote Services: SMB/Windows Admin Shares** (T1021.002) and **Service Execution** (T1569.002).

  Primary evidence sources for this detection will include Windows Event Logs, particularly those related to the Service Control Manager and any process creation events that might capture the unusual command behavior.

  ### Investigation Steps
  - **Review Service Installation Logs:** Examine Windows Event ID 7045 logs to confirm the creation of the 'BTOBTO' service along with details about the installation event and any associated user or account context.

  - **Analyze Command Line Arguments:** Investigate the process creation events to capture the full command line of the service with a focus on identifying any suspicious command sequences, specifically those containing `.bat & del ` or related redirection methods (`2^>^&1 >`).

  - **Check for Unusual User Behavior:** Assess the user accounts that initiated the service installation and any prior activities to determine if there are indicators of compromise or if the account has been abused for lateral movement.

  - **Cross-Reference with Other Logs:** Look at other telemetry sources—such as security logs, EDR alerts, or NDR logs—to find potential indicators of related malicious activity in the network that may correlate with the service installation, including failed login attempts or unusual SMB traffic.

  ### Prioritization
  The alert is categorized as high severity due to the potential for attackers to establish a foothold within the network via persistence mechanisms. The ability to execute commands remotely from a compromised system poses serious risks, particularly in environments that rely heavily on Windows infrastructure.

  ### Blind Spots and Assumptions
  Detection may be limited by the presence of misconfigured logging settings, as Windows logs might not be adequately capturing relevant service events. Additionally, it assumes that an attacker would use the predefined service name 'BTOBTO,' which could vary in real-world scenarios. Finally, the alert relies on the monitoring of Event ID 7045 and certain command patterns, indicating a requirement for comprehensive logging and possibly custom alert rules configured to capture variations in service naming and installation behavior.

