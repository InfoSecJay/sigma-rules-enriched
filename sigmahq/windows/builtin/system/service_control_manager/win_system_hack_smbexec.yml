title: smbexec.py Service Installation
id: 52a85084-6989-40c3-8f32-091e12e13f09
status: test
description: Detects the use of smbexec.py tool by detecting a specific service 
  installation
references:
- https://blog.ropnop.com/using-credentials-to-own-windows-boxes-part-2-psexec-and-services/
- https://github.com/fortra/impacket/blob/33058eb2fde6976ea62e04bc7d6b629d64d44712/examples/smbexec.py#L286-L296
- https://github.com/fortra/impacket/blob/edef71f17bc1240f9f8c957bbda98662951ac3ec/examples/smbexec.py#L60     # Old service name
author: Omer Faruk Celik
date: 2018-03-20
modified: 2023-11-09
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.002
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service_name:
    ServiceName: 'BTOBTO'
  selection_service_image:
    ImagePath|contains:
    - '.bat & del '
    - '__output 2^>^&1 >'
  condition: selection_eid and 1 of selection_service_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the installation of a malicious service using the smbexec.py tool, typically employed in lateral movement and exploitation scenarios. Attackers aim to establish persistent access on compromised systems by creating Windows services that run scripts or malicious executables. The relevant MITRE ATT&CK tactics and techniques are "Lateral Movement" (TA0008) and "Service Execution" (T1021.002).

  Primary telemetry sources include Windows Event Logs, specifically Security Event ID 7045 which records the creation of new services, indicating potential misuse. If this behavior is confirmed as malicious, it poses significant security risks, including unauthorized access and execution of arbitrary code on the affected system. Importantly, the mere presence of an alert from this rule does not confirm malicious activity; further investigation is needed to assess context and intent.

  ### Investigation Steps

  - **Check for Event ID 7045:** Review Security Event ID 7045 in the Windows Event Viewer to find records of service installations. Look for the "ServiceName" field for 'BTOBTO' and "ImagePath" for signs of batch files or redirecting output, which may indicate malicious use.

  - **Validate service legitimacy:** Determine if the identified service is expected in the environment. Investigate known and approved services against a baseline inventory to distinguish between benign and potentially harmful installations.

  - **Review associated process creation logs:** Check for related process creation events (Security Event ID 4688 or Sysmon Event ID 1) that occurred around the same timestamp as the service installation. Look for suspicious parent-child relationships where a known good parent process initiates the malicious service.

  - **Analyze user accounts involved:** Examine the account context (using "SubjectUserSid" and "SubjectUserName" in the event log) under which the service was created. Assess if this was a legitimate administrative account or a potentially compromised user.

  - **Investigate system and network behavior:** Search for any network activity related to the service (DNS queries, outbound connections) following its installation. Indicators of Command and Control (C2) communication could further validate malicious intent.

  - **Identify common evasion patterns:** Be aware of attackers using variable service names or legitimate-looking script paths. Monitor for patterns in service naming conventions that could indicate attempts to blend in with normal operations.

  ### Prioritization

  This alert has a high severity level due to its potential impact on the entire network, as it suggests lateral movement and persistence mechanisms typically used by attackers. The likelihood of this behavior being exploited is elevated, particularly in environments where elevated privileges grant attackers the ability to install services unnoticed. Such tactics are frequently weaponized in advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection may miss variants where attackers employ different service names or obscure their footprints by deleting logs post-installation. Reliable detection requires configuration of comprehensive audit policies to catch all service-related logs. Legitimate software updates or administrative tasks might trigger similar alerts. Companion detections, such as monitoring for anomalous service start requests (Event ID 7036), could help corroborate the findings and enhance detection capabilities.

