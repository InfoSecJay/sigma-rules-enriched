note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands initiated from Windows Command Line interfaces, specifically through the Service Control Manager. The behavior typically illustrates attempts by an adversary to execute malicious scripts while bypassing detection mechanisms through obfuscation techniques. The likely attacker objective is to execute arbitrary code without raising alarms, potentially leading to further compromise, lateral movement, or data exfiltration.

  This action is mapped to MITRE ATT&CK tactics: Execution (T1203) and Obfuscated Files or Information (T1027). The primary telemetry source is Windows Event Log, focusing on Event ID 7045, which records the creation of services. If executed maliciously, this behavior can lead to significant system compromise. It's crucial to note that this detection does NOT confirm malicious intent by itself; legitimate administrative actions may also produce similar logs.

  ### Investigation Steps

  - **Review Event ID 7045:** Examine Windows Security Event ID 7045 logs for entries that show service creation. Check for suspicious `ImagePath` with obfuscation patterns like `cmd /C` with PowerShell commands.

  - **Analyze the Service Account:** Identify the account that initiated the service creation. If it's a non-administrative or unexpected account, that significantly raises the suspicion level.

  - **Check for Parent Process:** Investigate the parent process of the command. Legitimate PowerShell executions often originate from `powershell.exe` directly. A `cmd.exe` origin, especially with obfuscated arguments, is a red flag.

  - **Validate Obfuscation Patterns:** Look for standard obfuscation markers in the command's `ImagePath`, such as `&&set`, `/c`, and `-f`. Any anomalies in the formatting or unexpected sequences should be flagged for review.

  - **Correlate with Known Indicators:** Cross-check any C2 (Command and Control) URLs or known malicious hashes that may have been utilized in the PowerShell commands against threat intelligence sources.

  - **Determine Asset Role:** Consider the criticality of the affected system. High-value assets (e.g., domain controllers, file servers) require more immediate and thorough investigation compared to less critical endpoints.

  ### Prioritization

  This alert has a high severity due to the potential for significant security impact if the behavior is indeed malicious. The likelihood of exploitation is elevated, given that the execution of obfuscated PowerShell scripts is commonly weaponized by attackers during initial access or lateral movement phases.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate obfuscation performed during administrative scripting tasks, which could lead to false positives. Required logs must be properly configured to capture Event ID 7045; absence can result in undetected malicious activities. Additionally, benign administrative scripts may trigger similar logs under the right conditions, necessitating further context for full assessment. Companion detections, such as monitoring for anomalous command-line argument usage in PowerShell (T1059.001), are recommended to strengthen detection coverage.

