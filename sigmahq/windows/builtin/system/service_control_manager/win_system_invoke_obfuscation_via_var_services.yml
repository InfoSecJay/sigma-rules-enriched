note: |
  ### Technical Context

  This rule detects attempts to execute obfuscated PowerShell commands through CMD, utilizing multiple layers of encoding and the `Invoke-Expression` cmdlet. The likely objective of the attacker is to execute malicious scripts while bypassing security controls aimed at detecting obvious PowerShell usage. This behavior is relevant to the MITRE ATT&CK tactics of Defense Evasion (T1562) and Execution (T1059.001). The primary telemetry source for detection involves Windows system event logs, specifically Event ID 7045 from the Service Control Manager, which logs service installations, including potentially harmful ones. The security impact is high if malicious, as such commands can lead to unauthorized execution of arbitrary code. It is important to note that this detection does NOT confirm malicious intent or successful execution on its own—it merely highlights suspicious command invocation.

  ### Investigation Steps

  - **Check the Event ID:** Review Windows Event ID 7045 for services that were installed around the time of the alert. Look for unusually named services or paths indicating command execution through PowerShell.

  - **Analyze ImagePath details:** Examine the `ImagePath` field of the Event 7045 for the presence of the strings `&&set`, `cmd`, and `-f`. Pay close attention to additional obfuscation patterns that may indicate malicious usage.

  - **Validate legitimate activities:** Identify any known administrative or maintenance scripts running on the system. For example, administrators may run PowerShell commands with `-NoProfile` that follow common patterns like `Invoke-Expression` for double-checking configurations.

  - **Identify known malicious patterns:** Look for highly obfuscated command components like `{0}`, `{1}`, `{2}`, etc., in `ImagePath`. Any occurrences of these with calls to `cmd` and `PowerShell` are high confidence indicators of malicious intent.

  - **Correlate with recent user activity:** Review user access logs (Security Event ID 4624) around the time of the detection to see if the account executing the command was engaging in suspicious behavior, such as logins from unusual locations or times.

  - **Assess system role implications:** If the affected host is a critical server (e.g., domain controller, database server), prioritize the investigation. Higher criticality systems that execute obfuscated PowerShell commands could signify an escalated risk.

  ### Prioritization

  The alert is of high severity due to the potential for significant impact on critical systems if a successful obfuscated command execution occurs. Given that obfuscation techniques are commonly associated with malicious activities, there is a substantial likelihood of abuse. This behavior can regularly surface in sophisticated ransomware and other attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by proper whitelisting or prior legitimate use of obfuscated commands within the organization. There may also be instances where security products do not capture all variations of event logs related to service installations. Valid administrative actions, such as legitimate software deployments, may trigger this alert if they involve similar command constructs. Companion detections, like monitoring for unusual PowerShell command execution (via Event ID 4104), can help validate whether the initial alert indicates a broader attack framework.

