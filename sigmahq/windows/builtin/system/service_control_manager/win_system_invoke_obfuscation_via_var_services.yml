note: |
  ### Technical Context
  This detection rule identifies obfuscated PowerShell commands executed via a process controlled by the Service Control Manager (SCM) on Windows systems. Specifically, it looks for instances of `EventID 7045`, which logs the creation of service processes, where the `ImagePath` contains suspicious patterns indicative of command execution through PowerShell. Attackers often use such obfuscation techniques to bypass security controls and hide their malicious activities. The obfuscation can be a precursor to executing payloads, downloading additional malware, or even establishing persistence on the targeted system.

  In the threat landscape, this behavior is notably associated with adversaries employing **Defense Evasion tactics**, as categorized by MITRE ATT&CK techniques such as **T1027 - Obfuscated Files or Information**, and **T1059.001 - Command and Scripting Interpreter: Windows PowerShell**. The objective might be to execute malware or scripts while evading detection mechanisms such as antivirus solutions or intrusion detection systems.

  Primary data sources for gathering relevant evidence include Windows Event Logs (specifically, the System logs containing service creation events) and process creation events captured by endpoint detection and response (EDR) solutions. These logs can offer insights into what commands were executed and may assist in unraveling the obfuscation used by attackers.

  ### Investigation Steps
  - **Review Windows Event Logs:** Collect and analyze the Windows System event logs for EventID 7045. Look for unusual services starting with obfuscated scripts or commands.
  - **Examine Process Creation Logs:** Investigate process creation events that correspond to the detected obfuscation patterns. Focus on parent-child relationships to identify potential launch points for malicious activity.
  - **Check Command-Line Arguments:** Extract and scrutinize command-line arguments from the identified processes. Look for common signs of obfuscation such as unusual character patterns or concatenated strings.
  - **Analyze Network Activity:** Monitor for any network connections or downloads initiated by the suspicious services. This can help determine whether payloads are being fetched and executed.

  ### Prioritization
  Given the high likelihood of obfuscated commands indicating an attempt to execute malicious payloads, this alert should be treated with high severity. The potential impact could include data breaches, unauthorized access, or further lateral movement within the enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the inability to capture all PowerShell execution contexts or logs from poorly configured systems. The detection logic assumes that service creation events through SCM, which include obfuscation patterns, will indicate malicious intent and thus may generate false positives in certain administrative scenarios. For the rule to function correctly, it requires access to comprehensive Windows Event Logs, particularly for Service Control Manager activities, ensuring proper logging configurations are enabled in the Windows environment.

