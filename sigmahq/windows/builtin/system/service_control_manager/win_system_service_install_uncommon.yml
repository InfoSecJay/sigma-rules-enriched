logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  suspicious_paths:
    ImagePath|contains:
    - '\\\\.\\pipe'
    - '\Users\Public\'
    - '\Windows\Temp\'
  suspicious_encoded_flag:
    ImagePath|contains: ' -e'
  suspicious_encoded_keywords:
    ImagePath|contains:
    - ' aQBlAHgA'         # PowerShell encoded commands
    - ' aWV4I'         # PowerShell encoded commands
    - ' IAB'         # PowerShell encoded commands
    - ' JAB'         # PowerShell encoded commands
    - ' PAA'         # PowerShell encoded commands
    - ' SQBFAFgA'         # PowerShell encoded commands
    - ' SUVYI'         # PowerShell encoded commands
  filter_optional_thor_remote:
    ImagePath|startswith: 'C:\WINDOWS\TEMP\thor10-remote\thor64.exe'
  filter_main_defender_def_updates:
    ImagePath|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Definition Updates\'
  condition: selection and ( suspicious_paths or all of suspicious_encoded_* ) and
    not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious service installations on Windows systems that utilize uncommon image paths, especially those that reference encoded PowerShell commands or temporary directories. Attackers often create services using these uncommon paths as part of persistence mechanisms or privilege escalation strategies to exploit Windows environments. By detecting these patterns, analysts can identify suspicious activities likely associated with malware installation or lateral movement tactics.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, specifically using the technique **Service Creation (T1543.003)**. The rule focuses on peculiarities in service creation events (EventID 7045 from the Service Control Manager) that could indicate an attacker is establishing persistence through unusual methods.

  The primary data source for this detection is the Windows System log, particularly focusing on service installation events that can provide insights into system changes and potential exploitation efforts.

  ### Investigation Steps
  - **Review Service Installation Logs:** Collect and analyze Windows Event Logs for EventID 7045 to find instances of service creation that match the identified patterns.
  - **Correlate with Other Alerts:** Check for any other security alerts or logs generated around the same time, such as process creation events that may indicate suspicious activity coinciding with the service installation.
  - **Examine Image Path:** Investigate the specified `ImagePath` for any signs of tampering or unexpected behavior, especially if it points to temporary directories or contains encoded PowerShell commands.
  - **Analyze System Behavior:** Look at recent changes to system services and check both active and stopped services for anomalies in their paths or configurations, correlating this with known attack signatures or behaviors.

  ### Prioritization
  This alert is considered medium severity due to the potential threat of persistence in an enterprise environment. The installation of services with suspicious attributes could indicate an active compromise, making it crucial to investigate promptly to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, as not all malicious activity can be detected solely through service creation events, and legitimate applications may occasionally use similar paths. The detection logic assumes that encoded PowerShell commands are indicative of malicious intent, which may not always be the case. Additionally, the alert relies on the availability of accurate and comprehensive Windows System logs, specifically focusing on EventID 7045, meaning that any misconfigurations or log truncations could hinder effective detection.

