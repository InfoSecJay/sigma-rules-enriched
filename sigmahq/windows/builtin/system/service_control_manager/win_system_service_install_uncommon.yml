logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  suspicious_paths:
    ImagePath|contains:
    - '\\\\.\\pipe'
    - '\Users\Public\'
    - '\Windows\Temp\'
  suspicious_encoded_flag:
    ImagePath|contains: ' -e'
  suspicious_encoded_keywords:
    ImagePath|contains:
    - ' aQBlAHgA'         # PowerShell encoded commands
    - ' aWV4I'         # PowerShell encoded commands
    - ' IAB'         # PowerShell encoded commands
    - ' JAB'         # PowerShell encoded commands
    - ' PAA'         # PowerShell encoded commands
    - ' SQBFAFgA'         # PowerShell encoded commands
    - ' SUVYI'         # PowerShell encoded commands
  filter_optional_thor_remote:
    ImagePath|startswith: 'C:\WINDOWS\TEMP\thor10-remote\thor64.exe'
  filter_main_defender_def_updates:
    ImagePath|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Definition Updates\'
  condition: selection and ( suspicious_paths or all of suspicious_encoded_* ) 
    and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the installation of Windows services with uncommon or suspicious image paths, specifically those that include references to encoded PowerShell commands or temporary directories. An attacker may utilize these methods to establish persistence on a compromised system, suggesting intentions to maintain access and control. This behavior fits within the MITRE ATT&CK framework under the tactic "Persistence" and the technique "Create or Modify System Process: Windows Service" (T1543.003).

  The primary telemetry source is Windows event logging, specifically Service Control Manager events (Event ID 7045). If malicious, the impact can be severe, as unauthorized services may enable remote access or execution of malicious payloads. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate services may also utilize similar paths.

  ### Investigation Steps

  - **Examine Event ID 7045 logs**: Filter on Event ID 7045 to identify newly created services. Focus on the `ImagePath` field to isolate entries with uncommon paths, particularly those containing `\\.\pipe`, `\Users\Public\`, or `\Windows\Temp\`.

  - **Identify encoded PowerShell commands**: Check the `ImagePath` for strings like ` -e`, `aQBlAHgA`, or other listed encoded phrases. The presence of these specific patterns strongly indicates the use of obfuscation techniques typical of adversary behavior.

  - **Analyze service creation context**: Validate the legitimate behavior by identifying standard services created during application installation (e.g., Microsoft Defender updates). These typically reside in `C:\ProgramData\Microsoft\Windows Defender\Definition Updates\` and should not contain encoded commands.

  - **Correlate with process creation events**: Cross-reference with Security Event ID 4688 logs to see if a newly created service has initiated suspicious processes. Specifically, check if any of the service paths lead to executable files that are non-standard for the environment.

  - **Assess the asset’s sensitivity and role**: Determine the criticality of the affected host system. Compromised systems that hold sensitive information or are integral to business operations require immediate attention for potential risks.

  - **Review prior activity and owner**: Verify the change history of the service using Sysinternals tools like Autoruns or checking management service logs to understand legitimate service configurations. This aids in identifying if unexpected changes were made and by whom.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if non-legitimate services are established, particularly on critical systems. The likelihood of such techniques being weaponized by adversaries, especially in automated attacks, necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as using less obvious paths or legitimate-looking executables. It requires proper configuration of Windows event logging; without this, detection may not trigger. Additionally, legitimate administrative actions or software installations may generate similar alerts, potentially leading to false positives. A companion detection to consider would be the tracking of unusual process creation linked to these service installations to enhance detection efficacy.

