  ---

  ### Technical Context

  This rule detects the installation and execution of the PsExec service (PSEXESVC), typically used for remote command execution on Windows systems. Attackers may utilize PsExec to execute malicious payloads, move laterally within a network, or escalate privileges covertly. This behavior corresponds to the MITRE ATT&CK technique "Execution" (T1569.002) and "Windows Services" (S0029).

  The primary telemetry source for this detection includes Windows Event Logs, specifically Event ID 7045 from the Service Control Manager, which logs service installation events. If malicious, the security impact could be significant, as attackers could gain unauthorized access or control over sensitive systems. Importantly, this detection does NOT confirm malicious activity on its own, as PsExec may be used legitimately in administrative contexts.

  ---

  ### Investigation Steps

  - **Review Event ID 7045 logs:** Check for recent Service Control Manager logs where Event ID 7045 indicates the installation of a new service named "PSEXESVC" on critical assets, such as domain controllers or servers hosting sensitive applications.

  - **Evaluate ImagePath of PSEXESVC:** Look for the "ImagePath" field in Event ID 7045 logs to ensure it ends with `\PSEXESVC.exe`. If it points to unusual directories (e.g., user folders), this may indicate malicious use.

  - **Identify legitimate usage patterns:** Administrators often use PsExec for remote management. Verify if the user account associated with the service installation has been granted administrative privileges and check for known automated scripts or scheduled tasks that utilize PsExec.

  - **Correlate with process creation logs:** Cross-reference Event ID 4688 logs for the creation of processes that originate from `PSEXESVC.exe`. Inspect the command line arguments for suspicious activity, such as the execution of known malware or unauthorized scripts.

  - **Monitor outbound network connections:** Analyze network logs for connections made from the host running PSEXESVC. Suspicious connection attempts to external IP addresses (especially those associated with known threat actors) could suggest exploitation.

  - **Check for lateral movement indicators:** Investigate if the affected system shows signs of lateral movement patterns, including abnormal access to other machines, particularly after the installation of PSEXESVC.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential risk associated with PsExec's misuse for lateral movement and unauthorized execution of commands. Given that the behavior can often be weaponized by threat actors, prompt investigation is warranted to mitigate possible breaches on critical systems.

  ---

  ### Blind Spots and Assumptions

  Detection may miss instances where PsExec is executed successfully without service installation, using alternative command-line parameters directly. Ensure that logging for Service Control Manager is enabled and configured correctly to capture all relevant events. Additionally, legitimate administrative tasks may trigger this alert, such as system maintenance by trusted IT personnel. A related detection for "Event ID 4688" process creation could provide complementary insight into the specific actions taken by the newly installed service.

