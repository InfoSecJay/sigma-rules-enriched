detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName: 'PSEXESVC'
  - ImagePath|endswith: '\PSEXESVC.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the installation and execution of the PsExec service, specifically targeting the Windows Service Control Manager events related to PsExec's service creation (`EventID: 7045`). The likely attacker objective is to establish persistent remote access to a host for further exploitation or lateral movement within a network. This behavior corresponds to the MITRE ATT&CK technique for Remote Service Creation (T1569.002) and, more generally, Remote Execution (S0029).

  Primary telemetry sources include Windows Event Logs, specifically looking for Service Control Manager logs indicating new service installations. If detected, this behavior can indicate compromised systems, potentially leading to further attacks such as data exfiltration or system manipulation. Importantly, detection of this activity does not inherently confirm malicious intent, as PsExec can also be used for legitimate administrative tasks.

  ### Investigation Steps

  - **Check for Event Logs:** Review Security Event Logs (Event ID 7045) from the Service Control Manager for any service installations with ServiceName: `PSEXESVC` and ImagePath ending in `\PSEXESVC.exe`, ensuring to look for logs correlating with unusual timestamps or system user accounts.

  - **Verify PsExec Execution:** Look for execution artifacts linked to PsExec, notably in Sysmon Event ID 1 (Process Creation), filtering for `PSEXESVC.exe`. Identify parameters passed to the process to distinguish between legitimate uses and potential malicious executions.

  - **Assess User Context:** Identify the user account that initiated the PsExec installation. Legitimate use cases often involve known administrative accounts. Alerts from unexpected accounts, especially non-admins, may signal malicious activity.

  - **Cross-Reference Asset Roles:** Investigate the context of the host. Systems with sensitive roles (e.g., Domain Controllers or application servers) warrant higher scrutiny if PsExec appears in the event logs; this may indicate high-risk activity.

  - **Look for Anomalous Network Activity:** Check for outbound connections from the host to external entities within the timeframe of the PsExec installation. Use firewall or proxy logs to assess unusual connections or data exfiltration attempts that coincide with this event.

  ### Prioritization

  This alert has medium severity due to the critical nature of service installations on enterprise systems. While PsExec can be leveraged for administrative tasks, its common use by adversaries for lateral movement makes this alert particularly relevant to incident response efforts.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the PsExec executable or using alternative tools for remote execution, which this rule would not capture. Effective detection requires complete Windows Event Log coverage for Service Control Manager events. Legitimate administrative actions may trigger this alert, especially in environments with active systems administration. Related detections, such as those for unusual process creations or network connections aligned with service installations, can enhance coverage and reduce false positives.

