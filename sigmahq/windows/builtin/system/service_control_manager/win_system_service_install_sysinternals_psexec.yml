detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName: 'PSEXESVC'
  - ImagePath|endswith: '\PSEXESVC.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation and execution of the PsExec service, which is often used by attackers to facilitate remote code execution and lateral movement within a network. PsExec is part of the Sysinternals suite and allows command execution on remote systems, making it popular for both legitimate administrative tasks and malicious activities. The suspected threat scenario includes an attacker leveraging PsExec to execute commands on remote machines, potentially as a precursor to data exfiltration, further compromise, or sophisticated attacks targeting sensitive environments.

  The rule maps to the following MITRE ATT&CK tactics and techniques:
  - **Execution** (TA0002): The execution of arbitrary code on a target system.
  - **Remote Services** (T1569.002): Execution of applications on remote systems using remote services like PsExec.
  - **System Services** (S0029): The creation and management of services on Windows systems to maintain presence.

  Primary data sources for detection include Windows Event Logs, specifically the Service Control Manager (SCM) logs that record service installations and modifications.

  ### Investigation Steps
  - **Review Windows Event Logs**: Analyze Windows Event ID 7045 logs to identify the installation of the 'PSEXESVC' service, noting the date, time, and user account involved in the installation.
  - **Inspect Service Configurations**: Check the service configurations and startup types for 'PSEXESVC' to determine its intended function and any anomalies in its operational context.
  - **Correlate with Process Creation Events**: Examine process creation logs around the time of service installation, focusing on processes spawned by the 'PSEXESVC.exe' executable to look for suspicious command execution patterns.
  - **Identify Unusual User Activity**: Investigate users and accounts that initiated the service installation for unusual access patterns or privilege escalation that could indicate unauthorized activity.

  ### Prioritization
  This alert carries a medium severity due to the potential impact of unauthorized remote code execution across the enterprise. The likelihood of misuse by attackers leveraging legitimate tools for malicious actions amplifies the need for swift investigation and mitigation.

  ### Blind Spots and Assumptions
  This detection may miss instances where attackers utilize other methods for remote code execution, such as PowerShell remoting or other legitimate administrative tools. The assumption is that logging configurations for Windows Event Logs cover the appropriate events; insufficient logging may result in gaps in visibility. Additionally, the detection logic presumes that the environment consists of standard service installations without other software that mimics PsExec behavior. Adequate logging settings, especially for SCM events, must be ensured for the alert to effectively function.

