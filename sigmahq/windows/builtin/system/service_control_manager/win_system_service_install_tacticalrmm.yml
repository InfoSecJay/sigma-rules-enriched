note: |
  ### Technical Context
  This detection rule identifies the installation of a TacticalRMM service on Windows systems. Tactical RMM is a remote monitoring and management tool that is often used by IT support teams for legitimate purposes, but it can also be exploited by attackers to maintain persistence and remotely control compromised systems. The threat scenario typically involves an initial compromise, such as through a phishing campaign, which grants attackers access to install malicious software for ongoing control, data exfiltration, or lateral movement within a network.

  The relevant MITRE ATT&CK tactics for this detection include **Command and Control** (TA0011), which encompasses techniques for maintaining communication with compromised hosts, and **System Services** (T1219.002), as this rule targets the creation of a system service associated with the TacticalRMM tool. The most pertinent data sources for this detection are Windows System logs, particularly Event ID 7045, which logs the installation of new services.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Event Logs for Event ID 7045 to confirm the installation of the TacticalRMM service and identify any related service creation events.
  - **Correlate with User Activity:** Investigate user activity around the time of the installation to determine if the service was set up by an authorized user or if it correlates with malicious behavior.
  - **Inspect Service Properties:** Analyze the properties of the TacticalRMM Agent Service, including ImagePath, to ensure it points to a legitimate location and does not have any signs of tampering.
  - **Analyze Network Traffic:** Monitor outbound connections to identify any unusual communication patterns with known malicious IP addresses or domains that could suggest command and control activity.

  ### Prioritization
  The alert is of medium priority due to the potential impact of unauthorized remote access and management capabilities that the TacticalRMM tool can provide to an attacker. Given its legitimate use in IT operations, careful consideration is required to distinguish between valid use and malicious activity.

  ### Blind Spots and Assumptions
  This detection logic assumes the presence of adequate log collection for Windows Event IDs related to system service installations. A potential gap is the reliance on standard logging configurations which may not capture all service installations, especially in environments where logging has been configured minimally. Additionally, ties to legitimate usage of TacticalRMM may lead to false positives, as IT personnel may legitimately install this tool for remote management purposes. For this alert to function effectively, the organization must ensure that Event Log policies are set to capture all pertinent logs concerning service creation and modification.

