detection:
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: 'tacticalrmm.exe'
  - ServiceName|contains: 'TacticalRMM Agent Service'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  This rule detects the installation of the TacticalRMM service, which is a remote monitoring and management tool. The likely attacker objective would be to establish persistence and remote access to the compromised system, allowing for further exploitation or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (Command and Control) under the tactic ID T1219. The primary telemetry source is Windows Event Logs, specifically monitoring Event ID 7045 generated by the Service Control Manager when services are created. If malicious, this could enable an adversary to maintain control over the compromised network. Importantly, this detection alone does not confirm malicious intent, as TacticalRMM may also be used legitimately by administrators for system management.

  ### Investigation Steps

  - **Verify Event ID 7045 record:** Check Windows Event Logs for Event ID 7045. Review the `ServiceName` and `ImagePath` fields for entries containing 'TacticalRMM Agent Service' and 'tacticalrmm.exe'.
  - **Assess legitimacy:** Determine if the service installation occurred during a known maintenance window or if recent authorized changes were made by IT personnel. Document the logged username and the source of the installation.
  - **Cross-reference system roles:** Identify if the affected system is a critical asset (e.g., a server or domain controller). Check if there are any correlations with other alerts or unusual activities within critical systems.
  - **Check for malicious indicators:** Look for associated network connections or logins from suspicious IP addresses in conjunction with the service installation, particularly during odd hours. Review for any abnormal service dependencies or related processes.
  - **Evaluate service dependencies:** Investigate other services running under the same user context as the TacticalRMM Agent Service. Note any unusual services that could be indicative of persistence mechanisms.
  - **Identify common legitimate usage:** Document the typical operational activity associated with TacticalRMM usage in your enterprise to distinguish benign installations from potential threats.

  ### Prioritization

  The severity of this alert is medium due to the potential for a TacticalRMM installation to facilitate further malicious actions. While this behavior can occur in legitimate contexts, its alignment with remote access and management makes it a target for adversaries looking to exploit system vulnerabilities.

  ### Blind Spots and Assumptions

  Detection may be limited by overlooking the use of other remote access tools that could be used in conjunction with TacticalRMM for evasion. Reliable detection requires proper logging configurations to capture all service changes. Legitimate administrative usage of the TacticalRMM tool may trigger false positives, particularly if IT teams are actively deploying or managing assets. A related detection to fortify coverage would be monitoring for unexpected outbound connections to known TacticalRMM command and control servers.

