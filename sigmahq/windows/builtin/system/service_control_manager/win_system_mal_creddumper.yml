logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - 'cachedump'
    - 'dumpsvc'
    - 'fgexec'
    - 'gsecdump'
    - 'mimidrv'
    - 'pwdump'
    - 'servpw'
  condition: selection
falsepositives:
- Legitimate Administrator using credential dumping tool for password recovery
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of known credential dumping tools through service creation events in Windows, specifically targeting Event ID 7045 generated by the Service Control Manager. The likely objective of an attacker is to extract sensitive credentials from system memory or local accounts, facilitating unauthorized access to further targets within the environment. This behavior aligns with the MITRE ATT&CK techniques T1003.001 (Credential Dumping: LSASS Memory) and T1003.005 (Credential Dumping: Security Account Manager).

  The primary telemetry source is Windows Security Event Logs, particularly logs related to service creation events. If executed maliciously, the security impact is high, as adversaries can gain unauthorized access and control over user credentials. This detection does NOT confirm successful credential extraction; it merely indicates attempts to initiate known tools associated with credential dumping.

  ---

  ### Investigation Steps

  - **Check Service Creation Event**: Review Windows Event ID 7045. Look for unexpected services with ImagePath containing keywords like 'cachedump', 'pwdump', or 'fgexec' which are associated with credential dumping tools. Legitimate instances should have recognized, organization-approved service names.

  - **Validate Service Configuration**: Confirm that the service configuration aligns with known legitimate services within your organization. Suspicious or unauthorized entries raise red flags for malicious activity.

  - **Assess System Role and Context**: Consider the role of the asset where the alert was triggered. If it’s a critical server, prioritize further investigation. Normal behavior on workstation endpoints may differ due to authorized administrative actions.

  - **Investigate Process Creation Logs**: Review Sysmon Event ID 1 logs for any child processes spawned by the service after its creation. High-confidence malicious indicators include processes executing from known credential dumping paths or with unusual command-line arguments.

  - **Search for File Artifacts**: Check for new file creation linked to known credential dumping tools in the Windows file system, particularly in temporary or application-specific directories. Use file creation timestamps to correlate with the service start time.

  - **Analyze User Behavior**: Examine the account associated with the service creation event. Legitimate use cases typically involve authorized IT personnel performing system maintenance. Unauthorized or anomalous account activity could suggest malicious intent.

  ---

  ### Prioritization

  This alert should be treated with high severity, as the execution of credential dumping tools poses a significant risk to the integrity and confidentiality of an enterprise's credentials. The potential for adversary movement within the network is pronounced, particularly if these tools are weaponized in conjunction with other attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like renaming or modifying the tool's binaries to avoid signature-based detection. High fidelity requires correct configuration and storage of Windows Event Logs. Legitimate administrative actions, such as authorized password recovery using the same tools, may inadvertently trigger this alert. Companion detections such as monitoring related process injections or local privilege escalation attempts can bolster security coverage.

