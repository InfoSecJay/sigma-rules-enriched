logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains:
    - 'cachedump'
    - 'dumpsvc'
    - 'fgexec'
    - 'gsecdump'
    - 'mimidrv'
    - 'pwdump'
    - 'servpw'
  condition: selection
falsepositives:
- Legitimate Administrator using credential dumping tool for password recovery
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of known credential dumping tools through Windows service creation events. Credential dumping refers to the extraction of stored credentials from various sources in a system, which attackers often utilize to gain unauthorized access to sensitive data or to escalate privileges within an environment. By monitoring for the installation of these tools as services, defenders can thwart malicious attempts to exfiltrate credentials and prevent potential lateral movement within the network.

  Threat actors leveraging credential dumping techniques often conduct reconnaissance before executing payloads, aiming to harvest sensitive information from compromised systems. Using tools like Mimikatz, pwdump, or Gsecdump, attackers can exploit stolen credentials to further infiltrate the organization's infrastructure. This activity aligns with several MITRE ATT&CK tactics and techniques, particularly those associated with credential access (T1003.001, T1003.002, T1003.004, T1003.005, T1003.006) and execution (T1569.002).

  The primary data sources for this detection include the Windows Event Logs, specifically Event ID 7045 generated by the Service Control Manager. This event logs the addition of a new service, exposing the execution of potentially malicious credential dumping tools.

  ### Investigation Steps
  - **Check Service Creation Events:** Review Windows Event ID 7045 logs around the time of the alert to identify any new services that were created. Pay attention to the `ImagePath` and look for known credential dumping tool names.
  - **Correlate with User Activity:** Cross-reference the service creation events with user account activity in your organization to determine if the service was created by a suspicious account or during unusual hours.
  - **Inspect Process Creation Logs:** Analyze process creation logs for related processes spawning from these services. Validate if they were followed by any abnormal network connections or user logins.
  - **Collect Artifacts:** Gather artifacts from the system including the file path of the tool executed, any associated logs indicating execution attempts, and system state information to assess if further compromise occurred.

  ### Prioritization
  The high severity of this alert is warranted due to the potential risk of credential theft and subsequent unauthorized access to sensitive enterprise resources. If exploited, credential dumping can facilitate deeper network penetration and elevate an attacker’s privileges within the environment.

  ### Blind Spots and Assumptions
  This detection rule may miss credential dumping activities conducted through other means that do not utilize service execution—such as those directly executed by users without installing a service. Additionally, it assumes that logging for service creation events is enabled and retained adequately for analysis. Environments without comprehensive logging solutions or those not monitoring system logs may lack visibility into this threat vector. It's critical to ensure that adequate logging configurations are in place to capture necessary events related to service management.

