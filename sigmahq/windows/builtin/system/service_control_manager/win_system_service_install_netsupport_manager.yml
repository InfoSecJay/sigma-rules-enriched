  ---

  ### Technical Context

  This Sigma rule detects the installation of the NetSupport Manager service on a Windows system, specifically monitoring for the creation of the service named "Client32" and its associated executable path. The likely attacker objective is to establish remote access to the target system for persistent control, which aligns with the MITRE ATT&CK technique T1053.001 - "Scheduled Task/Job: Scheduled Task". The primary telemetry sources are Windows Event Logs, specifically Security Event ID 7045 which captures the event of service creation.

  If the detected installation is malicious, it can enable attackers to remotely control the system, potentially facilitating data exfiltration or lateral movement within the environment. It is important to note that this detection alone does not confirm malicious intent without additional context, as NetSupport Manager may also be legitimately used for remote support purposes.

  ---

  ### Investigation Steps

  - **Review Event ID 7045:** Look for a Security Event ID 7045 in Windows Event Logs. Verify that the `ServiceName` is "Client32" and the `ImagePath` contains `\NetSupport Manager\client32.exe`.

  - **Check service startup configuration:** Examine the `StartType` field for the service. A value of "auto start" could indicate a persistence mechanism, while "manual" might suggest legitimate usage.

  - **Correlate with asset inventory:** Validate if "Client32" is listed in the organization’s approved software or tools. If not, this could be a strong indicator of malicious activity.

  - **Identify user action leading to installation:** Investigate the preceding logs for signs of the user or system processes that executed the installation. Look for known administrative users in the logs or unusual account activity nearby.

  - **Assess network activity:** Review network logs for any connections made by the service to external IP addresses after installation, especially communications with known malicious IPs or domains.

  - **Determine legitimate use cases:** Understand typical usage of NetSupport Manager within your organization, including which teams utilize it, and when it is installed. Check if similar installations for updates or legitimate operations occurred concurrently.

  ---

  ### Prioritization

  This alert should be treated withmedium severity due to the potential impact on system integrity. The likelihood of malicious abuse is moderate, as remote access tools like NetSupport Manager are often targeted for exploitation. While such tools are commonly weaponized, the context must be assessed to determine the intent behind the installation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss obfuscation techniques, such as changing the executable name or path to avoid detection. Required log sources include Windows Event Logs configured to capture service creation events. Legitimate administrative activities, such as scheduled updates or support sessions, may trigger this alert. A related detection to consider is monitoring for unusual outbound connections post-installation to strengthen visibility into potential abuse scenarios.

