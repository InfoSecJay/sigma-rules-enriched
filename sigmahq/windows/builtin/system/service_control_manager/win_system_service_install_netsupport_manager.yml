note: |
  ### Technical Context
  This rule detects the installation of the NetSupport Manager service on Windows systems, specifically monitoring events related to the Service Control Manager. NetSupport Manager is a remote access tool that can be used for legitimate remote desktop support; however, its installation and usage may indicate unauthorized remote access attempts or insider threats aiming to maintain persistence within a compromised environment.

  The suspected threat scenario involves adversaries leveraging legitimate software for nefarious purposes, such as evading detection while remotely controlling target machines to exfiltrate information or manipulate systems. By installing the NetSupport Manager service, attackers can gain ongoing access with high privileges, making it critical to monitor these installations closely.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence** (T1547.001) - This technique involves establishing persistence through the installation of services that allow for remote management.
  - **Remote Access Software** (T1219) - Usage of legitimate remote access tools to maintain control over compromised systems.

  Primary data sources for detection include:
  - **Windows Event Logs** related to Service Control Management, particularly Event ID 7045, which indicates a new service installation.

  ### Investigation Steps
  - **Review Event Logs**: Look for Windows Event ID 7045 in the Security and System logs to identify instances of the NetSupport Manager service installation.
  - **Analyze Service Configuration**: Check the service configuration via `sc query Client32` to assess the service's properties, including its logon account and startup type.
  - **Investigate Related Processes**: Examine process creation logs around the time of the service installation for any related executable activity, particularly focusing on `client32.exe` and parent processes that initiated it.
  - **Cross-reference User Accounts**: Validate the account used for the service installation, and investigate any associated account activity or previous logons that may indicate an unauthorized user.

  ### Prioritization
  The severity of this alert is medium because while the presence of NetSupport Manager may be legitimate in some environments, its installation typically indicates a potential threat vector for remote access that should be closely monitored and validated.

  ### Blind Spots and Assumptions
  One significant gap is the reliance on event logs that could be disabled or cleared by a sophisticated attacker attempting to cover their tracks. The detection assumes that all installations of the service are inherently suspicious, which may not always be the case, as some IT departments may use it legitimately. Additionally, proper logging configurations must be enabled on Windows systems, specifically capturing Service Control Manager events, to ensure detection accuracy.

