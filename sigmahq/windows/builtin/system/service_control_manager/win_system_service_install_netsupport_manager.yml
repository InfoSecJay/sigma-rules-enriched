title: NetSupport Manager Service Install
id: 2d510d8d-912b-45c5-b1df-36faa3d8c3f4
status: test
description: Detects NetSupport Manager service installation on the target 
  system.
references:
- http://resources.netsupportsoftware.com/resources/manualpdfs/nsm_manual_uk.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
tags:
- attack.persistence
logsource:
  product: windows
  service: system
detection:
    # Example:
    #   <EventData>
    #       <Data Name="ServiceName">Client32</Data>
    #       <Data Name="ImagePath">"C:\Program Files (x86)\NetSupport\NetSupport Manager\client32.exe" /* *</Data>
    #       <Data Name="ServiceType">user mode service</Data>
    #       <Data Name="StartType">auto start</Data>
    #       <Data Name="AccountName">LocalSystem</Data>
    #   </EventData>
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains: '\NetSupport Manager\client32.exe'
  - ServiceName: 'Client32'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of the NetSupport Manager service, which is often used for remote administration and support. The behavior indicates potential persistence mechanisms utilized by an attacker aiming to maintain control over a compromised system. This detection correlates with the MITRE ATT&CK tactic for Persistence (T1050) and the technique for Service Installation (T1543.002).

  Primary telemetry sources include Windows Event ID 7045 from the Service Control Manager, specifically looking for the event where a new service is created. If malicious, this could allow an attacker persistent access to the affected system. It’s important to note that this detection does NOT, on its own, confirm malicious intent, as legitimate administrative activities may result in similar logs.

  ### Investigation Steps

  - **Check Event ID 7045 for service installation:** Review Windows Event ID 7045 logs to identify the creation of the "Client32" service, which indicates the installation of NetSupport Manager. Filter the logs for the relevant Event ID under 'Security' or 'System' logs.

  - **Verify the service account:** Confirm that the `AccountName` associated with the service installation is 'LocalSystem.' If it differs, it may indicate unauthorized configuration.

  - **Assess the ImagePath:** Evaluate the `ImagePath` of the new service and validate that it points to "C:\Program Files (x86)\NetSupport\NetSupport Manager\client32.exe". If found elsewhere, it may indicate potential evasion or malicious activity.

  - **Identify legitimate usage patterns:** Determine if there is an existing business need for remote support by reviewing service installation logs and user roles. Check for approved operational use cases that align with the deployment of NetSupport.

  - **Link to established anomalies:** If this service installation is an isolated incident or correlates with other anomalous behavior (e.g., unusual user account activity or network connections), elevate the investigation as potential indicators of compromise (IoCs).

  - **Review system impact and asset criticality:** Assess the impact of this service on the affected system and its role within the enterprise. Critical assets or sensitive environments may escalate the need for immediate response or containment.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of unauthorized remote access on sensitive systems. The likelihood of malicious abuse is moderate, as attackers commonly utilize remote administration tools for persistence. While not inherently malicious, this service's installation is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign administrative installations that may trigger this alert. Ensure proper log configurations are enabled for Event ID 7045 to maintain reliable detection. Legitimate network management activities, such as approved remote support software installations, could also set off this alert. A related detection to consider is the monitoring of remote access sessions, which could provide additional context to any identified anomalies.

