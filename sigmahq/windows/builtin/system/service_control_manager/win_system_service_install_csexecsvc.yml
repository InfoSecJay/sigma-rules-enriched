title: CSExec Service Installation
id: a27e5fa9-c35e-4e3d-b7e0-1ce2af66ad12
status: test
description: Detects CSExec service installation and execution events
references:
- https://github.com/malcomvetter/CSExec
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-07
tags:
- attack.execution
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName: 'csexecsvc'
  - ImagePath|endswith: '\csexecsvc.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium

note: |
  ### Technical Context
  This rule detects the installation and execution of the CSExec service, often associated with malicious activity, particularly by adversaries using Cobalt Strike for post-exploitation tasks. Cobalt Strike, a legitimate penetration testing tool, can be leveraged by attackers to create persistent access within a network. By installing a service like 'csexecsvc,' attackers aim to facilitate remote command execution, lateral movement, and potentially exfiltration of sensitive data. The installation of such a service is indicative of ongoing or potential compromise, thus elevating the urgency for investigation.

  Relevant MITRE ATT&CK tactics and techniques include **Execution** (TA0002) and **Service Execution** (T1569.002). These techniques are used by attackers to execute malicious commands or scripts within compromised environments, leading to further exploitation of the network. To provide effective detection and response capabilities, primary data sources include Windows event logs, specifically those generated by the Service Control Manager (Event ID 7045), which records the creation of new services, and process creation events that can indicate the associated command line execution.

  ### Investigation Steps
  - **Review Event Logs:** Investigate Windows logs for Event ID 7045 to discover the installation details of the 'csexecsvc' service. Pay attention to the user context under which the service was created and the timestamps compared to other suspicious activity.

  - **Analyze Process Creation Logs:** Check process creation events within the time frame of the service installation. Look for the execution of `csexecsvc.exe`, as well as any commands that reference Cobalt Strike or its common patterns, which may reveal additional methods the attacker used to gain access.

  - **Correlate Network Activity:** Examine network logs for unusual outbound connections possibly related to the CSExec service. Look for communication to known Cobalt Strike command and control (C2) infrastructure or attempts to lateral move to other systems.

  - **Conduct a Service Review:** Validate whether the 'csexecsvc' service is a known and legitimate application in your environment. If not, consider immediate containment measures such as stopping the service, isolating affected systems, and further investigation into potential endpoint compromise.

  ### Prioritization
  This alert has medium severity due to the significant risk associated with unauthorized service installations, which can indicate active compromise within the environment. Given the malicious use of CSExec, prompt investigation is crucial, as attackers may leverage this to gain further control and execute additional exploitative behaviors.

  ### Blind Spots and Assumptions
  There could be gaps in detection coverage if certain event logs are not properly configured or preserved, particularly if log retention policies are insufficient. The detection logic assumes that the presence of the 'csexecsvc' service is anomalous in the environment. For the alert to function correctly, the Service Control Manager logs must be enabled and monitored for Event ID 7045. Additionally, environments that do not regularly audit or log service changes may miss critical indicators of compromise.

