title: Remote Utilities Host Service Install
id: 85cce894-dd8b-4427-a958-5cc47a4dc9b9
status: test
description: Detects Remote Utilities Host service installation on the target 
  system.
references:
- https://www.remoteutilities.com/support/kb/host-service-won-t-start/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
tags:
- attack.persistence
logsource:
  product: windows
  service: system
detection:
    # Example:
    #   <EventData>
    #       <Data Name="ServiceName">Remote Utilities - Host</Data>
    #       <Data Name="ImagePath">"C:\Program Files (x86)\Remote Utilities - Host\rutserv.exe" -service</Data>
    #       <Data Name="ServiceType">user mode service</Data>
    #       <Data Name="StartType">auto start</Data>
    #       <Data Name="AccountName">LocalSystem</Data>
    #   </EventData>
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains|all:
    - '\rutserv.exe'
    - '-service'
  - ServiceName: 'Remote Utilities - Host'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of the Remote Utilities Host service, which could indicate an attempt to establish persistence by an attacker. The likely objective of the attacker is to gain unauthorized remote access to the target system while maintaining control over it through a remote desktop application. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique Remote Access Tools (T1219).

  The primary telemetry source for this detection is Windows Event logs, specifically the Service Control Manager logs capturing Event ID 7045, which logs any changes to the system services. If malicious, this installation could provide an attacker with the capability to remotely control a compromised host. However, this detection does NOT confirm that the Remote Utilities tool is being used maliciously—it could also be part of legitimate administration tasks or remote support solutions.

  ### Investigation Steps

  - **Identify the service creation event:** Review Windows Event ID 7045 to confirm that the Remote Utilities - Host service was created. Look for the `ServiceName` field with the value `Remote Utilities - Host` and `ImagePath` containing `rutserv.exe -service`.

  - **Assess service account legitimacy:** Confirm that the `AccountName` associated with the service is `LocalSystem`. If other users or non-standard accounts installed the service, it may indicate malicious intent.

  - **Review process execution history:** Check Sysmon Event ID 1 for process creation logs that reference `C:\Program Files (x86)\Remote Utilities - Host\rutserv.exe`. Look for associated command-line arguments that include `-service`. Unusual command lines may indicate malicious usage.

  - **Evaluate legitimate use cases:** Identify whether Remote Utilities is commonly utilized by your IT or support staff. Review prior documentation or ticketing systems for expected installations. If the installation aligns with legitimate business needs, it may not be malicious.

  - **Cross-reference with network activity:** Evaluate network logs for connections originating from the affected host to remote access endpoints, including external IP addresses associated with Remote Utilities. Monitor for unusual outbound traffic patterns indicating potential data exfiltration.

  ### Prioritization

  This alert is categorized as medium severity. The impact of a successfully deployed remote access tool on a critical asset could lead to significant data exfiltration or other forms of compromise. Moreover, remote access tools are frequently weaponized in cyber attacks, making detection essential.

  ### Blind Spots and Assumptions

  This detection may be limited by potential evasion techniques like renaming the executable or altering its startup parameters. The necessary log sources, such as Service Control Manager logs, must be properly configured to capture these events consistently. Legitimate remote support activities may inadvertently trigger this alert if Remote Utilities is authorized for use within the organization. Companion detections, such as monitoring for unusual outbound traffic or other remote access tool installations, could enhance coverage and confirm a malicious presence.

