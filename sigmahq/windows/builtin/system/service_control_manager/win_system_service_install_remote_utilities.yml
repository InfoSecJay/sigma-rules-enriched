title: Remote Utilities Host Service Install
id: 85cce894-dd8b-4427-a958-5cc47a4dc9b9
status: test
description: Detects Remote Utilities Host service installation on the target system.
references:
- https://www.remoteutilities.com/support/kb/host-service-won-t-start/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
tags:
- attack.persistence
logsource:
  product: windows
  service: system
detection:
    # Example:
    #   <EventData>
    #       <Data Name="ServiceName">Remote Utilities - Host</Data>
    #       <Data Name="ImagePath">"C:\Program Files (x86)\Remote Utilities - Host\rutserv.exe" -service</Data>
    #       <Data Name="ServiceType">user mode service</Data>
    #       <Data Name="StartType">auto start</Data>
    #       <Data Name="AccountName">LocalSystem</Data>
    #   </EventData>
  selection_root:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ImagePath|contains|all:
    - '\rutserv.exe'
    - '-service'
  - ServiceName: 'Remote Utilities - Host'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of the Remote Utilities Host service on Windows systems. Remote Utilities is a remote access tool that can be misused by attackers for unauthorized system access, potentially leading to data breaches or lateral movement within an enterprise network. An attacker may deploy this tool to maintain persistence on a compromised system, giving them continued remote access even after initial indicators of compromise have been addressed.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (TA0003)** - Installing remote access software can allow an attacker to maintain access across reboots and during administrator investigations.
  - **Remote Access Tools (T1219)** - The use of legitimate remote software can facilitate unauthorized access and actions across the network.

  The primary data sources for this detection include Windows Security Event Logs, particularly the Service Control Manager logs which provide details about service installations and modifications.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Event Logs for Event ID 7045, which indicates service installations, specifically looking for entries involving 'Remote Utilities - Host'.
  - **Analyze Service Behavior:** Investigate the service's characteristics by checking its ImagePath, confirming it points to the legitimate installation directory, and verifying the service account used.
  - **Correlate with User Activity:** Assess whether the installation corresponds with any unusual user activity or external connections that might indicate malicious use.
  - **Check for Related Artifacts:** Look for additional indicators such as spawned processes from the service executable, network connections from the service, and any system modifications made around the time of installation.

  ### Prioritization
  The severity of this alert is medium due to the potential for Remote Utilities to allow unauthorized access to systems. While it might have legitimate use cases, its presence without proper justification raises concerns about possible malicious activities.

  ### Blind Spots and Assumptions
  Detection coverage may miss legitimate installations of Remote Utilities during authorized activities, leading to false positives. The detection logic assumes that the installation of this specific service is abnormal in the context of the organization. Additionally, comprehensive monitoring of the Service Control Manager logs, alongside appropriate Windows Event Log configurations, is necessary for effective detection. If these logs are not retained or adequately monitored, the alert may not function as intended.

