note: |
  ### Technical Context

  The Sigma rule detects the use of MSHTA (Microsoft HTML Application Host) to execute obfuscated PowerShell scripts often a precursor to malware delivery or executing malicious payloads. The likely attacker objective is to execute arbitrary code on the system without raising suspicion, leveraging the `vbscript:createobject` method as a vector for execution. This behavior pertains to the MITRE ATT&CK tactics of Defense Evasion (TA0005) under the technique T1027 (Obfuscated Files or Information) and Execution (TA0002) under T1059.001 (Command and Scripting Interpreter: PowerShell). The primary telemetry source is the Windows Event Log, specifically Event ID 7045 associated with the Service Control Manager, indicating a service installation or modification.

  If confirmed malicious, this activity could lead to unauthorized access, data exfiltration, or lateral movement within the enterprise environment. However, this detection does NOT conclusively prove that malicious activity is occurring, as legitimate use of MSHTA in administrative scripts could trigger similar events.

  ---

  ### Investigation Steps

  - **Review Event ID 7045 logs:** Investigate the details of Event ID 7045 in Windows Event Logs. Check fields such as `ImagePath` for occurrences of `mshta.exe` along with `vbscript:createobject`. This combination indicates potential obfuscation used to execute PowerShell.

  - **Cross-reference execution context:** Examine the account running the `mshta.exe` process. Look for anomalies such as execution by a non-administrative account or unexpected user accounts in the `Subject User Name` field on Event ID 7045. Legitimate system services should primarily be initiated by system users or known administrative accounts.

  - **Check the script contents:** If available, analyze the scripts or commands being executed via `mshta.exe`. Pay attention to any lengthy character strings or strange parameters that suggest encoding or obfuscation techniques commonly used by threat actors.

  - **Monitor for post-execution activity:** Utilize Sysmon to review logs for related Sysmon Event ID 1 (Process Creation) and Event ID 11 (File Create), observing any suspicious process trees that follow the execution of `mshta.exe`. Look for execution of common malicious payloads or manipulations of critical system files as indicators of compromise.

  - **Identify related legitimate processes:** Identify benign use cases of `mshta.exe` in your environment, such as internal automation scripts using PowerShell that may utilize this functionality appropriately, rather than indicative of malicious behavior.

  - **Assess host role and criticality:** Determine whether the host running this command is critical to business operations. Increased scrutiny should be applied if the command was executed on a sensitive assets, such as domain controllers or servers holding critical applications.

  ---

  ### Prioritization

  Given that this alert triggers from a high-risk action involving a potentially obfuscated script execution, the severity should be rated high in an enterprise context. The likelihood of malicious abuse is significant, as the use of MSHTA for such purposes is a known tactic among adversaries, making this behavior commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through the use of similar benign scripts or legacy applications that might legitimately invoke `mshta.exe`. Dependence on the Windows Event Log for Event ID 7045 requires proper logging configuration; without it, certain exploit attempts may go unnoticed. Legitimate enterprise tools that utilize `vbscript:createobject` in an innocuous manner could inadvertently trigger this alert. A related detection to consider is monitoring for anomalous PowerShell scripts (based on Sysmon logs) that may run concurrently, enhancing the context around potential malicious behavior.

