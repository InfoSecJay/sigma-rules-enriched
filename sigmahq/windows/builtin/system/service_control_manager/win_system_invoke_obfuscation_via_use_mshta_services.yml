logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'mshta'
    - 'vbscript:createobject'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of MSHTA (Microsoft HTML Application Host) with obfuscated PowerShell commands, initiated by the Service Control Manager (Event ID 7045). The likely attacker objective is to execute malicious scripts in a stealthy manner, leveraging PowerShell's capabilities without triggering standard security mechanisms. This behavior corresponds to the MITRE ATT&CK tactics for Execution (T1203) and Stealth (T1027). The primary telemetry sources are Windows Event Logs, particularly focusing on Event ID 7045, which logs service installations, including the command line arguments used. If malicious, this could lead to unauthorized access or code execution on the host. Importantly, this detection does NOT prove malicious intent by itself, as legitimate administrative scripts may also trigger it.

  ### Investigation Steps

  - **Review the Event Log:** Check Windows Event ID 7045 for entries related to MSHTA. Look for the "ImagePath" to confirm the presence of 'mshta' and 'vbscript:createobject'. Compare the time and source of the event with expected administrative activities.

  - **Verify Parent Process:** Correlate the Event ID 7045 with Sysmon Event ID 1 (Process Creation) to identify the parent process. A legitimate process, such as an update script or scheduled task, is less likely to use MSHTA in this context compared to an unknown executable.

  - **Evaluate the Script Content:** Access the script or command executed via MSHTA, if logged or recorded, to determine if it includes obfuscation or suspicious PowerShell commands (e.g., heavy use of escape characters or encoded commands).

  - **Compare Against Baseline Behavior:** For legitimate operations, check for known applications or users using MSHTA for valid purposes. Document any recognized scripts as expected behavior, and contrast them against the alert's script.

  - **Look for Artifact Extraction:** If the behavior seems malicious, verify for any common exfiltration techniques, such as unusual network connections or file creation in temporary directories indicative of malware.

  ### Prioritization

  This alert has a high severity level due to the potential impact on critical systems if exploited. The likelihood of malicious abuse is high, as attackers often use techniques like obfuscated scripts to bypass security controls. MSHTA usage for launching malicious payloads has been commonly weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where MSHTA is used legitimately, such as enterprise software patches. If Service Control Manager logs are not configured correctly or if noise from legitimate administrative tasks predominates, false positives may occur. Companion detections such as monitoring for anomalous command line arguments in PowerShell execution can strengthen overall coverage against similar threats.

