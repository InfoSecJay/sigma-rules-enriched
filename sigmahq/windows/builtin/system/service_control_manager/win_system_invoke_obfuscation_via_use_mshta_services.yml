logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'mshta'
    - 'vbscript:createobject'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of MSHTA (Microsoft HTML Application Host) in conjunction with obfuscated PowerShell scripts, indicating potential malicious behavior. Attackers may utilize this technique to execute malware or gain unauthorized access to systems while evading detection mechanisms. This type of obfuscation can help conceal the true nature of a payload, making it a favored tactic among threat actors seeking to evade traditional security controls.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (T1562)**, as the obfuscation seeks to bypass security measures, and **Execution (T1059.001)**, which specifically pertains to the execution of script-based commands through scripting languages like PowerShell. The primary data sources that provide valuable insights into this behavior include Windows Event Logs, specifically focusing on Service Control Manager events which log the creation of services and could indicate the launching of potentially harmful scripts.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Event Logs for Event ID 7045 entries. Pay close attention to any instances where the `ImagePath` contains both `mshta` and `vbscript:createobject`, as this could indicate script execution triggering malicious activity.

  - **Analyze Script Behavior:** Gather and analyze the contents of the obfuscated PowerShell script being invoked. Understand the commands being executed and assess for any malicious intentions, such as attempts to download payloads or establish persistence.

  - **Correlate with Other Logs:** Look for indicators of lateral movement or unusual account activity in conjunction with the detected event. Correlate findings with other logs, such as process creation or network connection logs, to identify any additional instances of unusual behavior.

  - **Conduct a Threat Intelligence Review:** Utilize threat intelligence feeds to determine if the observed behavior aligns with known attack patterns associated with detected frameworks or malicious actors. This can help prioritize the incident response efforts.

  ### Prioritization
  Due to the potential for significant harm—including unauthorized access, data exfiltration, and system compromise—alerts generated by this rule are categorized with high severity in an enterprise environment. The likelihood of exploitation through obfuscated scripts is prevalent, making timely investigation critical.

  ### Blind Spots and Assumptions
  This detection may not cover all cases where MSHTA is used for legitimate purposes, potentially leading to false positives. It assumes that the logging level for Windows Event Logs, specifically for Service Control Manager events, is properly configured and that relevant data is being collected. If log retention policies are too aggressive, there may be instances where relevant events have been purged before they can be analyzed, leading to potential gaps in detection coverage.

