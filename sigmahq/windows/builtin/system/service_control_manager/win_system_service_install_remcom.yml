  ---

  ### Technical Context

  This Sigma rule detects the installation and execution of the RemCom service, a tool often used for remote command execution that can facilitate unauthorized access to systems. The objective of an attacker using this technique is typically to establish a persistent remote shell to execute commands on the compromised machine, potentially leading to further exploitation of the network. This activity is associated with the MITRE ATT&CK technique "Remote Service (T1569.002)."

  The primary telemetry sources are Windows Security Event logs, specifically Event ID 7045 from the Service Control Manager, which captures the creation of new services. If malicious, the security impact can be significant, as RemCom allows remote control over the system, making it vulnerable to further exploitation. This detection does NOT confirm that all instances of the RemCom service are malicious, as legitimate administrative use or benign testing may also invoke this rule.

  ---

  ### Investigation Steps

  - **Assess Service Installation Details:** Review Event ID 7045 for log entries where `ServiceName` is `RemComSvc` and `ImagePath` ends with `\RemComSvc.exe`. Investigate the service creation accounts and timestamps to determine if they are consistent with normal administrative behavior.

  - **Check Process Execution:** Verify associated processes by investigating Security Event ID 4688 (Process Creation) for instances where `ImagePath` is similar to `\RemComSvc.exe`. Track parent processes to identify anomalous execution patterns.

  - **Identify Unauthorized Remote Access Attempts:** Look for event logs indicating remote sessions (e.g., Event ID 4624 with Logon Type 3) around the time of service installation. Check for unusual accounts accessing the system or access from unexpected IP addresses.

  - **Review Network Connections:** Analyze Windows Firewall logs or NetStat output to identify any outbound connections initiated by `RemComSvc.exe`. Document any external IPs that the service communicates with, especially those that are known to be malicious or unfamiliar.

  - **Document Legitimate Use Cases:** Note any organizational policy that allows for the use of RemCom or similar remote services, and compare against the timing and execution of detected events. Consult with IT or security teams to verify if these are part of normal operations.

  ---

  ### Prioritization

  The alert is medium severity due to the potential for significant impact on compromised systems. The likelihood of malicious abuse is moderate, as RemCom is commonly weaponized by attackers for remote access. While the detection may indicate a security event, further investigation is needed to determine the intent behind the service installation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss malicious use cases if attackers modify service parameters or utilize alternative remote management tools to bypass the standard service checks. Ensure comprehensive logging is enabled across endpoints, including Application and Service logs, to capture necessary telemetry. Legitimate administrative tasks, such as remote support and troubleshooting, could trigger this alert. A companion detection to consider is capturing anomalous authentication (e.g., Event ID 4625 for failed logons) as it may indicate attempts to leverage the established service for unauthorized access.

