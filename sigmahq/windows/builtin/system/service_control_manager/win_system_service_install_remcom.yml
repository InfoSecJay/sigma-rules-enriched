note: |
  ### Technical Context

  This Sigma rule detects the installation and execution of the RemCom service on Windows systems. Typically, this indicates an adversary's objective to gain remote access to the compromised system, leveraging the service for command execution or data exfiltration. The relevant MITRE ATT&CK tactic is "Execution" with the technique ID T1569.002, indicating the exploitation of remote services to execute commands.

  The primary telemetry sources include Windows Event IDs, specifically Event ID 7045 logged by the Service Control Manager for service installation events. If the RemCom service is used maliciously, it can compromise the integrity and confidentiality of the system. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions could also trigger similar events.

  ### Investigation Steps

  - **Validate service installation event:** Review Security Event ID 7045 for the creation of 'RemComSvc' and note the 'ImagePath' field to confirm it ends with '\RemComSvc.exe'. This service is typically a malicious indicator due to its known association with unauthorized remote access.

  - **Cross-reference user account:** Check the 'SubjectUserName' and 'SubjectDomainName' fields in the same Event ID to determine if the service was installed by a legitimate account or one associated with potential compromise.

  - **Check for service status:** Use PowerShell or Task Manager on the host to verify the running status of 'RemComSvc'. A running state immediately after installation with no authorized change could indicate potential compromise.

  - **Review system logs for additional context:** Analyze additional logs such as Sysmon Event ID 1 for process creation events tied to 'RemComSvc.exe' to identify any triggering processes or parent-child relationships that deviate from standard operational behavior.

  - **Identify related network activity:** Examine firewall logs or network monitoring tools for outbound connections initiated by RemComSvc to abnormal IP addresses or domains; legitimate activity typically involves internal traffic to known infrastructure.

  ### Prioritization

  This alert is of medium severity as it can indicate a significant compromise if an affected system is critical or contains sensitive data. The likelihood of malicious abuse is moderate, given the historical association of the RemCom service with exploitation tactics by adversaries. While the behavior is not the most commonly weaponized, it is recognized among advanced persistent threat (APT) tactics.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate users installing the service for authorized purposes, highlighting a limitation in distinguishing malicious from benign installations. Reliable detection depends on consistent logging configurations for Windows Event IDs and Sysmon events. Legitimate administrative tasks, such as system maintenance, may inadvertently trigger this alert. Review companion detections for lateral movement, such as unauthorized RDP events or alternative remote access tools in use, to strengthen coverage against varied attack vectors.

