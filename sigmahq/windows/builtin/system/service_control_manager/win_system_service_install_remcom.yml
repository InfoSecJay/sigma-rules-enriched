logsource:
  product: windows
  service: system
detection:
  selection_eid:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  selection_service:
  - ServiceName: 'RemComSvc'
  - ImagePath|endswith: '\RemComSvc.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the installation and execution of the RemCom service on Windows systems. RemCom, which facilitates remote command execution, could be leveraged by attackers to establish unauthorized persistence and execute commands on compromised machines. This behavior is particularly concerning in enterprise environments, as it may indicate lateral movement or unauthorized access attempts.

  The primary attacker objective associated with RemCom usage is to maintain control over a system while evading traditional detection methods. The rule corresponds with the MITRE ATT&CK framework, specifically the Execution tactic (TA0002) and the Remote Services technique (T1569.002) which signifies the use of services to execute commands remotely. The detection relies on parsing Windows Event Logs generated by the Service Control Manager, which provides granular details on service interactions.

  The main telemetry source for this rule is Windows Event Logs, specifically Event ID 7045, which logs when a service is created, providing insight into potentially malicious service installations.

  ### Investigation Steps
  - **Review Windows Event Logs:** Verify Event ID 7045 in the Service Control Manager logs to confirm the installation of the RemCom service. Look for tampering, such as changes in service configurations.

  - **Inspect Service Binary Path:** Analyze the `ImagePath` of the `RemComSvc` service to ensure it is not running from a non-standard directory. Malicious services often utilize misleading paths to obscure their origin.

  - **Determine Service Dependencies and Configurations:** Investigate the service's startup configuration, dependencies, and whether it has been set to automatically start. This may reveal attempts by attackers to ensure persistence.

  - **Collect Network Traffic Data:** Review network traffic logs for unusual outbound connections initiated by the RemCom service (e.g., connections to external IP addresses not typically associated with legitimate business activity).

  ### Prioritization
  The medium severity rating of this alert reflects the potential for significant impact, as the presence of the RemCom service may indicate a compromised system and unauthorized administrative control. Given that it’s a method for attackers to execute commands remotely, the likelihood of abuse in sensitive environments is high.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where the RemCom service is installed in non-standard ways or is further obfuscated through file renaming or path alteration. The alert assumes that logging configurations for Windows Event Logs are enabled and that Event ID 7045 is being captured efficiently. If these logs are not being collected or if the service is modified by a skilled attacker, detection will fail.

