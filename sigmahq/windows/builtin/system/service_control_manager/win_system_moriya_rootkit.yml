  ### Technical Context

  This Sigma rule detects the installation of the Moriya rootkit, which is associated with stealthy persistence and privilege escalation techniques used by attackers. The likely attacker objective is to maintain unauthorized access and control over an infected system, often aiming for further lateral movement or data exfiltration. The relevant MITRE ATT&CK tactics are "Persistence" and "Privilege Escalation," with the specific technique being "Create or Modify System Process" (T1543.003).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 7045, which logs service installations via the Service Control Manager. If the behavior is malicious, it could lead to severe security impacts, such as unauthorized access to sensitive data and prolonged persistence in the environment. It is essential to note that the detection of this event does NOT confirm that the system is compromised — further investigation is required.

  ### Investigation Steps

  - **Check for service installation history:**
    Review Windows Event ID 7045 logs for the creation of the service named "ZzNetSvc." Analyze the "Provider_Name" field to confirm it's from "Service Control Manager."

  - **Verify service properties:**
    Confirm the service properties by querying the Service Control Manager (sc.exe) for "ZzNetSvc." Check the startup type and binary path to identify any suspicious behavior.

  - **Identify recent malware signatures:**
    Use an endpoint protection solution to scan for known signatures or anomalies related to the Moriya rootkit. Look for processes or files that match descriptions in threat intelligence feeds.

  - **Examine user account activity:**
    Investigate recent logins for accounts with administrative privileges around the time the service was created. Look for unusual account behavior or unauthorized changes to account permissions.

  - **Assess host criticality and network role:**
    Identify the affected host's role (e.g., domain controller, file server) in the organization. Prioritize investigation based on the criticality of the asset and its potential impact on the broader network if compromised.

  - **Document expected behavior:**
    Compare the event with baseline service installations in the environment. Document any legitimate services that are consistently installed, noting differences in the service name or behavior.

  ### Prioritization

  This alert is critical due to the high potential impact on sensitive systems if the Moriya rootkit is successfully deployed. The likelihood of its malicious use is significant, given its association with stealth operations and rootkit functionalities. Such behavior is commonly weaponized, especially in targeted attacks and advanced persistent threats.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques that involve using legitimate service names or disabling logging mechanisms. Reliable detection requires comprehensive logging configurations, including enabling detailed auditing for service installations. Legitimate activities, such as routine software updates or new service installations by IT teams, could trigger this alert. Complementary detections include monitoring for other suspicious service installations or modifications that contribute to broader persistence detection efforts.

