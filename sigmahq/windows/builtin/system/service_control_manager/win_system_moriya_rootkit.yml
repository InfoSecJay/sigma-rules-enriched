note: |
  ### Technical Context
  This detection rule identifies the installation and use of the Moriya rootkit on Windows systems. The Moriya rootkit is designed to provide persistent, undetectable control over targeted machines, allowing attackers to carry out various malicious activities, including data exfiltration or lateral movement. The primary objective of utilizing such a rootkit is to maintain unauthorized access to a system while avoiding detection from various security controls.

  The relevant MITRE ATT&CK tactics and techniques applicable to this scenario include:
  - **Persistence (T1543.003)**: The creation of a malicious service to establish persistence.
  - **Privilege Escalation (T1543.003)**: Using the rootkit to escalate privileges and gain further control over the operating system.

  The best evidence for detecting this behavior can be found in Windows system logs, specifically in service-related logs that record events such as the creation or modification of services.

  ### Investigation Steps
  - **Review Service Control Manager Logs**: Examine Windows Event ID 7045 logs to identify any anomalies, specifically looking for service names like "ZzNetSvc" which indicate the presence of the Moriya rootkit.
  - **Analyze File System Changes**: Look for unexpected file creations and modifications in system folders that may correlate with the installation of the rootkit or its services.
  - **Check Network Activity**: Investigate outbound network connections that could be associated with command and control (C2) communications initiated by the Moriya rootkit.
  - **Audit Installed Services**: Enumerate installed services on the affected systems for any unauthorized or suspicious entries, especially those that match known patterns associated with the Moriya rootkit.

  ### Prioritization
  This alert carries a **critical** severity due to the high impact and likelihood of a Moriya rootkit deployment. The potential for extensive system manipulation and data exfiltration poses a serious threat to enterprise security and integrity.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the potential for the rootkit to obfuscate its presence, making it difficult to spot via traditional logging mechanisms. The detection logic assumes that event logging for service creation is active and properly configured; if logs are truncated or not collected effectively, the detection may fail. Ensuring complete logging of Windows Event Logs, especially for Windows services, is critical for the effectiveness of this rule.

