  ### Technical Context

  This Sigma rule detects the installation of a malicious service named "ZzNetSvc," which is associated with the Moriya rootkit, utilized by adversaries to maintain persistence on compromised systems. The likely objective of such an attack is to establish a backdoor for ongoing access, enabling privilege escalation and control over the target environment. This behavior is categorized under the MITRE ATT&CK framework as "Create or Modify System Process" (T1543.003).

  The primary telemetry source is Windows Event ID 7045, generated by the Service Control Manager, which logs the addition of new services. If the detected service is indeed malicious, it could provide an adversary with significant operational oversight and control within the victim's network, leading to potential data breaches or further lateral movement. It is essential to note that the detection of the service itself does NOT confirm that the system is compromised; further investigation is necessary to determine the nature and intent of the service.

  ---

  ### Investigation Steps

  - **Check for the service creation event:** Review Windows Security Event ID 7045 for the creation of "ZzNetSvc." Identify if this event was logged recently and whether the service was authorized by a legitimate application or vendor.

  - **Inspect service properties:** Analyze the service properties via PowerShell (Get-Service -Name ZzNetSvc) or through services.msc. Focus on fields like Service Type, Start Type, and Binary Path. Malicious services often have irregular binary paths pointing to temporary directories or non-standard locations.

  - **Compare against known good configurations:** Verify if "ZzNetSvc" is present within your service baseline. Legitimate services should match documented installations, whereas the presence of the service in unknown or unusual contexts may indicate compromise.

  - **Investigate associated processes:** Using Sysinternals Suite's Process Explorer or Task Manager, check for running processes associated with "ZzNetSvc." Confirm any unexpected parent-child relationships, which could indicate suspicious execution chains.

  - **Look for additional T1543.003 activity:** Investigate other evidence of service manipulation or installation (e.g., Event ID 7036 for service status changes), as attackers may create multiple services to obfuscate malicious activity.

  - **Validate file system artifacts:** Verify the existence of related files on the system, especially in directories like C:\Windows\System32 or C:\Program Files. Investigate any unusual executable files with the timestamp of service installation that may indicate file creation or manipulation by an adversary.

  ---

  ### Prioritization

  Given the critical nature of the detected service installation on potentially high-value systems, this alert should be treated with high priority. The likelihood of this behavior being weaponized is significant, as rootkits are commonly employed by adversaries to maintain control over compromised environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by service modification logging settings; ensure that Windows Event Auditing is fully enabled for service installations. Additionally, legitimate software deployment, particularly from third-party tools or updates, may inadvertently trigger this alert. A companion detection, such as monitoring for unusual process creation patterns associated with the newly installed service, would enhance coverage against this type of attack.

