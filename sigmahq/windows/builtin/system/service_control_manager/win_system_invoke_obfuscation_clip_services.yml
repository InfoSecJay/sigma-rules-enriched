logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'cmd'
    - '&&'
    - 'clipboard]::'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the obfuscated use of `Clip.exe` executed via a command line that includes `cmd` and the `&&` operator, indicating a potential attempt to bypass security controls by using clipboard manipulation in PowerShell. The likely attacker objective is to execute malicious scripts or commands while evading detection mechanisms. This aligns with MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (Command and Scripting Interpreter: Windows Command Shell).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 7045 related to service creation events. If malicious, this could allow attackers to execute unauthorized commands leading to system compromise or data exfiltration. Importantly, this detection does NOT confirm malicious behavior on its own, as legitimate applications may also utilize similar command structures.

  ### Investigation Steps

  - **Review Event ID 7045 logs:** Check for the presence of Event ID 7045 in the Security logs on the affected host. Look specifically for the `Provider_Name` field indicating "Service Control Manager" and `ImagePath` containing `cmd`, `&&`, and `clipboard]::`.

  - **Validate command legitimacy:** Analyze the command line arguments associated with the detected execution. Legitimate tasks using `Clip.exe` often involve simple clipboard operations without obfuscation; ensure no complex commands are being executed.

  - **Identify known malicious indicators:** Look for additional indicators in the same Event ID 7045 logs, such as abnormal parent processes or scheduled tasks that might indicate exploitation attempts.

  - **Check related user activity logs:** Investigate recent user activity surrounding the alert’s timestamp. Identify if the executing user initiated any suspicious activity or if they have a history of anomalous behavior, referencing User Activity logs.

  - **Cross-reference system changes:** Inspect for any recent service installations, modifications, or unexpected reboots surrounding the detection timeframe, which might suggest a service was misused for malicious objectives.

  - **Confirm asset criticality:** Identify the role of the affected host (e.g., a workstation vs. a server). Services leveraged maliciously on critical assets bear higher risks and should be treated with urgency.

  ### Prioritization

  This alert is high severity, particularly on critical systems, as it can indicate sophisticated attempts to bypass defenses and execute commands stealthily. The use of obfuscated command lines is a common adversarial tactic, increasing the likelihood of successful malicious activity if left unaddressed.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications using similar command structures or by obfuscation techniques that evade simple keyword searches. Reliable detection relies on having comprehensive logging enabled for Security Event IDs. Legitimate clipboard operations by tools like clipboard managers can trigger this alert. A companion detection to enhance coverage might include monitoring for PowerShell script execution logs (Event ID 4104) to detect potentially malicious PowerShell behavior following obfuscated commands.

