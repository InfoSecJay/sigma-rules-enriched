logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'cmd'
    - '&&'
    - 'clipboard]::'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the obfuscated execution of remote commands via the use of Clip.exe, a legitimate Windows utility, which can be abused for malicious purposes. Attackers leverage this technique to bypass security controls and execute PowerShell commands indirectly. The objective may include executing payloads stealthily, moving laterally within a network, or establishing persistence. This behavior is particularly relevant in scenarios where attackers seek to evade detection by security tools that monitor direct command executions.

  The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1560)**: Techniques like obfuscating command and control communications to disguise behavior.
  - **Execution (T1059.001)**: Utilizing command-line interfaces to execute scripts and commands, which in this case is through obfuscated methods.

  The primary data sources that will provide evidence for this detection include:
  - **Windows Event Logs**: Specifically, logs related to service creation (Event ID 7045), which can highlight instances of Clip.exe being employed in a suspicious context.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Event Logs for Event ID 7045. Look for any entries where Clip.exe is involved, especially those with command-line arguments that contain obfuscation patterns (e.g., "&&", "clipboard]::").

  - **Analyze Command Line Arguments**: Collate instances of command-line execution involving Clip.exe. Determine if commands executed show signs of obfuscation, which could indicate an evasion attempt.

  - **Check Active Connections**: Investigate any associated outbound network connections or processes initiated around the time of the alerts. This may reveal command and control channels or other malicious activity linked to the execution.

  - **Correlate with Known Malware Behavior**: Use threat intelligence to cross-reference identified behaviors with known TTPs (Tactics, Techniques, and Procedures) of malware families that utilize obfuscation and PowerShell for execution.

  ### Prioritization
  This alert should be treated with high priority due to its potential to indicate active exploitation techniques. The obfuscation of Clip.exe may suggest that the attacker aims to bypass security measures, making it crucial to respond promptly to investigate and mitigate any ongoing threats.

  ### Blind Spots and Assumptions
  Possible gaps in detection coverage include environments where Event ID 7045 logging is disabled or not properly configured. The detection logic assumes that obfuscation is not usual within the organization's use of Clip.exe and relies on the presence of service creation logs. It also presumes that potential malicious use of these tools can be deemed out of the norm within the organization's operational context. Required logs for effective detection include active auditing policies that capture service creation events and command line arguments, which may need to be configured or enhanced.

