logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ImagePath|contains|all:
    - 'cmd'
    - '&&'
    - 'clipboard]::'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the obfuscated use of Clip.exe to execute PowerShell commands, indicating malicious behavior often associated with lateral movement or data exfiltration using the clipboard feature. The likely attacker objective is to execute scripts or commands stealthily without raising suspicion. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1027) and Execution (T1059.001), specifically targeting script execution. The primary telemetry sources for this detection are Windows System logs, specifically Event ID 7045, which documents service control events relating to command execution. If malicious, this activity can lead to unauthorized code execution and potential system compromise. It's important to note that this detection alone does not confirm the intent or result of the execution; additional context is necessary to assess the impact fully.

  ### Investigation Steps

  - **Check Event ID 7045:** Review Windows Event Log for Event ID 7045. If 'ImagePath' includes 'cmd' with '&&' and 'clipboard]::', it indicates a suspicious use of Clip.exe for command execution.

  - **Correlate with PowerShell logs:** Look for PowerShell logs (Event ID 4103) that correspond with commands executed through Clip.exe. Malicious indicators may include unusual scripts or commands that manipulate sensitive data.

  - **Identify legitimate use cases:** Review other instances of Clip.exe within the past 24 hours that do not contain obfuscation patterns (e.g., direct invocation without 'cmd' or '&&') to differentiate between benign and malicious behavior.

  - **Assess system roles:** Focus on critical or sensitive systems (e.g., servers storing confidential information) where the exploitation of this behavior would have a higher impact on the organization.

  - **Monitor for related artifacts:** Verify if any temporary or scheduled tasks were created or if unusual file creation timestamps coincide with the execution event indicating potential lateral movement or data exfiltration attempts.

  - **Evaluate user behavior:** Review the user account that executed the command for any anomalous activity, such as logins from uncommon locations or around unusual hours, which may indicate credential theft or misuse.

  ### Prioritization

  This alert carries high severity due to the potential impact on sensitive systems and the likelihood of malicious abuse. The obfuscation technique used is often weaponized in sophisticated attacks, making this behavior particularly concerning within an enterprise environment.

  ### Blind Spots and Assumptions

  Detection may be limited by systems not logging Event ID 7045 or other related logs not being properly configured. Adversaries could utilize various command obfuscation techniques to evade detection. Additionally, legitimate applications may trigger similar events, such as authorized scripts leveraging clipboard functionality. Companion detection mechanisms, such as monitoring for suspicious PowerShell activity (e.g., non-standard modules or CSP execution), can enhance detection capabilities.

