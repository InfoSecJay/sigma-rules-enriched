note: |
  ### Technical Context

  This Sigma rule detects the clearing of access bits on registry hives located in the temporary directory, specifically targeting the SAM and SECURITY hives. This behavior indicates an attempt to bypass security controls, typically aligning with attacker objectives to escalate privileges or extract credentials. This detection relates to the MITRE ATT&CK credential access tactic (T1003.002).

  The primary telemetry source for this alert comes from Windows Event Tracing for Windows (ETW), specifically the Kernel-General provider generating Event ID 16. If malicious, this action can allow attackers to gain unauthorized access to sensitive data within the registry. However, this detection alone does not confirm malicious intent without further context or supporting evidence.

  ### Investigation Steps

  - **Review Event ID 16 logs:** Check for Event ID 16 from the Microsoft-Windows-Kernel-General provider in the system event logs. Ensure to filter for the HiveName containing "\Temp\SAM" or "\Temp\SECURITY" to confirm the suspicious clearing of access bits.

  - **Correlate with known utilities:** Investigate whether registry hive dumping utilities such as QuarksPwDump have been executed on the system recently. Search for process creation logs (Event ID 4688) referencing these utilities, particularly in the temporary directory context.

  - **Identify recent access to registry hives:** Review the registry access logs to determine if there were attempts to read or write to SAM or SECURITY hives in the last week, which may indicate an expected operational need versus malicious activity.

  - **Check for abnormal user account activity:** Investigate user account behavior associated with this event to determine if any unauthorized accounts have been attempting to access sensitive registry data. Look for logon events (Event ID 4624) from unusual or unexpected user accounts.

  - **Analyze for mass access attempts:** Assess whether there have been multiple attempts to clear access bits on different registry hives. Such behavior may indicate automated scripts or tools employed by an attacker rather than benign administrative activities.

  ### Prioritization

  The alert severity is high due to the critical nature of the SAM and SECURITY hives, which contain sensitive account information. The likelihood of misuse is elevated since this behavior correlates with known credential dumping tactics. Furthermore, such activities are often weaponized in the later stages of a compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations if the logging of Event ID 16 is not consistently configured or if logging is disabled on certain hosts. Legitimate activities, such as certain software updates or administrative actions, may also clear access bits unintentionally. A related detection to consider is monitoring for the execution of known credential dumping tools, which can help provide context and additional confirmation of potential malicious behavior in conjunction with this alert.

