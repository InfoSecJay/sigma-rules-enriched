note: |
  ### Technical Context
  This detection rule identifies the invocation of TabTip, a touch keyboard interface on Windows, through the Component Object Model (COM) using its CLSID. This behavior is commonly associated with the JuicyPotatoNG tool, which is often employed by attackers for local privilege escalation. JuicyPotatoNG utilizes DCOM to exploit Windows services and elevate privileges by impersonating other processes, typically indicating a malicious actor’s attempt to gain higher access levels on the system.

  The threat scenario typically involves an attacker who has already compromised a system at a lower privilege level and is seeking to escalate their privileges to gain broader control over the environment. By leveraging vulnerabilities in DCOM, the attacker can potentially execute arbitrary code under the context of higher privileged accounts, which could lead to further exploitation or lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**
    - *Windows Service Execution (T1569.002)*
  - **Credential Access (TA0006)**
    - *Permission Groups Discovery (T1069)*
  - **Collection (TA0009)**
    - *Data from Local System (T1005)*

  Primary data sources for this detection include Windows event logs from the system service, specifically looking at DCOM logs that capture relevant events associated with process starts.

  ### Investigation Steps
  - **Review DCOM Event Logs:** Check the Windows Event Logs for DCOM-related entries, specifically focusing on EventID 10001 that indicate the invocation of TabTip.exe.
  - **Analyze Process Creation Events:** Look at the command-line arguments of any process instances related to TabTip or JuicyPotatoNG to identify unusual parameters that may imply malicious activity.
  - **Inspect User Permissions:** Evaluate user authentication attempts and current permissions to determine if there are unauthorized privilege escalation attempts targeting sensitive accounts.
  - **Correlate with Known Indicators:** Cross-reference discovered behaviors with known IOCs related to JuicyPotatoNG to establish connections with any ongoing attack campaigns.

  ### Prioritization
  The alert's severity is high due to the potential for significant impact stemming from local privilege escalation. If successfully executed, an attacker can gain extensive control over the compromised system and potentially the broader network, facilitating further attacks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the need for comprehensive logging of DCOM calls, which may not always be enabled by default in all environments. The detection logic assumes that the use of the specified CLSID directly correlates with malicious activity and requires configurations that enable capturing of the relevant Windows Event Logs. If these logs are not retained or monitored effectively, detection may be missed, allowing malicious activity to occur undetected.

