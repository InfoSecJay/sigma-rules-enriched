note: |
  ### Technical Context

  This Sigma rule detects the invocation of TabTip.exe using its CLSID through Distributed Component Object Model (DCOM) events, particularly under conditions associated with privilege escalation tactics. The likely attacker objective is to leverage the Windows Input Panel (TabTip) to execute a payload in the context of a higher-privilege user, often seen with tools like JuicyPotatoNG that exploit DCOM for local privilege escalation. This behavior aligns with the MITRE ATT&CK technique T1557.001 (Credential Access: Unsecured Credentials – DCOM).

  The primary telemetry source involves Windows Event logs, specifically System logs with Event ID 10001. If this behavior is malicious, it may indicate a compromised system where an attacker attempts to gain elevated privileges undetected. Importantly, this detection does NOT confirm successful privilege escalation or malicious intent on its own; other indicators must be reviewed for context.

  ### Investigation Steps

  - **Review the DCOM event logs:** Check Windows Security logs for Event ID 10001 related to TabTip.exe invocation. Focus on the Provider_Name field for 'Microsoft-Windows-DistributedCOM' to confirm the trigger.

  - **Identify authorized users:** Cross-reference user accounts that invoked TabTip.exe with legitimate roles. Expected behavior often stems from users performing specific tasks, such as system administrators configuring device settings.

  - **Examine associated processes:** Correlate the invocation of TabTip.exe with other process activities in Process Monitor or Sysmon. Identify Event ID 1 (Process Creation) for any suspicious parent/child process relationships that engage in unexpected networking activity.

  - **Search for indicators of compromise:** Look for files created or modified around the same timestamp as the DCOM event (use Windows file system logs or Sysmon Event ID 11). Check for unusual paths or known malicious artifacts that may suggest exploitation.

  - **Conduct a behavioral analysis of the system:** Verify outputs and system stability for any signs of compromise. Indicators like abnormal CPU or memory usage could hint at unauthorized privilege escalation attempts.

  ### Prioritization

  This alert should be treated as high severity due to the potential for local privilege escalation, which can allow full system control if malicious. The likelihood of exploitation via DCOM procedures is recognized, particularly in environments with poor patch management or security configurations.

  ### Blind Spots and Assumptions

  This detection may be limited by potential evasion tactics, such as modifying the TabTip.exe execution path or disguising it under legitimate processes. Ensure that all required Windows Event logs, including System and Security logs, are properly configured to enable thorough monitoring. Additionally, legitimate user activities—such as using TabTip for text input on touchscreen devices—could trigger this alert. A companion detection involving abnormal DCOM access patterns (like unexpected remote connections) could further enhance coverage against sophisticated attacks.

