title: Certificate Use With No Strong Mapping
id: 993c2665-e6ef-40e3-a62a-e1a97686af79
status: test
description: |
  Detects a user certificate that was valid but could not be mapped to a user in a strong way (such as via explicit mapping, key trust mapping, or a SID)
  This could be a sign of exploitation of the elevation of privilege vulnerabilities (CVE-2022-34691, CVE-2022-26931, CVE-2022-26923) that can occur when the KDC allows certificate spoofing by not requiring a strong mapping.
  Events where the AccountName and CN of the Subject do not match, or where the CN ends in a dollar sign indicating a machine, may indicate certificate spoofing.
references:
- https://support.microsoft.com/en-us/topic/kb5014754-certificate-based-authentication-changes-on-windows-domain-controllers-ad2c23b0-15d8-4340-a468-4d4f3b188f16
author: '@br4dy5'
date: 2023-10-09
modified: 2025-09-22
tags:
- attack.privilege-escalation
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name:
    - 'Kerberos-Key-Distribution-Center'
    - 'Microsoft-Windows-Kerberos-Key-Distribution-Center'
    EventID:
    - 39
    - 41         # For Windows Server 2008 R2 SP1 and Windows Server 2008 SP2
  condition: selection
falsepositives:
- If prevalent in the environment, filter on events where the AccountName and CN of
  the Subject do not reference the same user
- If prevalent in the environment, filter on CNs that end in a dollar sign indicating
  it is a machine name
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where a user certificate, although valid, cannot be securely linked to a specific user account. This situation is indicative of a potential attack leveraging elevation of privilege vulnerabilities, particularly CVE-2022-34691, CVE-2022-26931, and CVE-2022-26923. The identified behavior relates to a lack of strong mapping in certificate authentication processes, which could be exploited for unauthorized access or privilege elevation in an Active Directory environment.

  The relevant MITRE ATT&CK techniques include **Privilege Escalation (T1068)**, as the misuse of authentication can grant higher-than-intended access levels without proper validation. Primary telemetry sources include Windows Security and System logs, specifically Event IDs 39 and 41 from the Kerberos Key Distribution Center service. If this attack is successful, an adversary could gain unauthorized access to sensitive resources. Importantly, this detection does NOT confirm actual misuse of credentials but highlights suspicious certificate behaviors.

  ---

  ### Investigation Steps

  - **Examine triggered events: Event ID 39 or 41:** Review the logs for relevant Kerberos events. Check for instances where `AccountName` does not match the `CN` in the Subject. A mismatch or `CN` ending with a dollar sign may indicate potential spoofing attempts.

  - **Identify high-confidence malicious indicators: Look for specific mismatches:** If `AccountName` is a user and `CN` ends with a dollar sign, this warrants further investigation. This could suggest machine account exploitation or other impersonation attempts.

  - **Check legitimate usage patterns: Review user certificates:** Verify if any legitimate accounts have similar discrepancies in `AccountName` and `CN`. Document cases to differentiate benign from malicious conditions.

  - **Review related service impacts: Assess system roles affected:** Analyze whether the impacted accounts have administrative rights or control over critical assets. Elevation of privileges in these contexts could have severe security repercussions.

  - **Cross-reference with known vulnerability logs:** Inspect if any security events correlate with known CVEs that indicate attempts to exploit elevation of privilege vulnerabilities connected to certificate mapping.

  ---

  ### Prioritization

  This alert should be marked as medium severity due to the potential for privilege escalation within the enterprise environment. Although the behavior is indicative of attacks, it may not always imply malicious intent, particularly if legitimate accounts exhibit similar patterns. However, adversary exploitation of such vulnerabilities is well-documented, making it a concerning alert.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate certificate usage by accounts, which can trigger similar alerting conditions. This rule also relies on proper logging configurations for Kerberos events; if these are misconfigured or disabled, it may fail to detect actual incidents. Legitimate administrative tasks may inadvertently trigger the alert, particularly in environments with legacy or complex user and machine naming conventions. A companion detection rule for abnormal Kerberos ticket usage could strengthen overall monitoring coverage.

