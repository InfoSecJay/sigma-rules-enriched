logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name:
    - 'Kerberos-Key-Distribution-Center'
    - 'Microsoft-Windows-Kerberos-Key-Distribution-Center'
    EventID:
    - 39
    - 41         # For Windows Server 2008 R2 SP1 and Windows Server 2008 SP2
  condition: selection
falsepositives:
- If prevalent in the environment, filter on events where the AccountName and CN
  of the Subject do not reference the same user
- If prevalent in the environment, filter on CNs that end in a dollar sign 
  indicating it is a machine name
level: medium
note: |
  ### Technical Context

  This rule detects instances of certificate use in Kerberos authentication where the user certificate is valid but lacks a strong mapping to a user, potentially indicating certificate spoofing attacks. The likely attacker objective is to exploit vulnerabilities in the Key Distribution Center (KDC) for privilege escalation, particularly in contexts where the KDC allowed spoofed certificates to be accepted (CVE-2022-34691, CVE-2022-26931, CVE-2022-26923). This behavior aligns with the MITRE ATT&CK tactic of **Privilege Escalation (TA0004)**, specifically under the technique **Service Account Credential Dumping (T1003)**. The primary telemetry sources include Windows Security Event logs (Event IDs 39 and 41). If malicious, this behavior could lead to unauthorized access and privilege escalation. Importantly, this detection alone does not confirm malicious activity without additional context such as user behavior and permissions.

  ### Investigation Steps

  - **Confirm event details: **Review Kerberos authentication events with Event ID 39 and 41 in the Security log (Windows Event Log) to identify if the AccountName and certificate Subject CN mismatch. Look for discrepancies indicating potential spoofing.

  - **Evaluate user mappings:** Cross-reference authentication logs with Active Directory to determine if the detected user certificate has a strong user mapping. Legitimate mappings typically have matching AccountNames and CNs.

  - **Identify high-confidence indicators:** Look for AccountNames that do not correspond to known users or that incorporate machine identifiers (e.g., CNs ending with a dollar sign), which can indicate automated processes, not valid user logins.

  - **Correlate with other logs:** Check for related entries in Application and System logs that may provide context around user behaviors during the timeframe of the detected event, such as logins from unusual locations or unauthorized access attempts.

  - **Assess asset criticality:** Review the impacted asset's role within the environment. Systems that are domain controllers or serve critical functions warrant higher scrutiny due to the potential risks from privilege escalation.

  - **Validate expected behavior:** Ensure that legitimate use of certificates in your environment has been documented, including proper user mappings. Gather information on practices such as certificate issuance or usage for automated processes.

  ### Prioritization

  The alert is of **medium severity** due to the potential for privilege escalation within critical systems. While the malicious likelihood is moderate, the behavior observed is known to be weaponized in certain threat landscapes. Close monitoring is necessary but may not immediately indicate a compromise without further investigation.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers find ways to create valid certificates that still meet the criteria for mapping. Completing the necessary logging configurations for Kerberos authentication events is critical for reliable detection. Furthermore, identity services or legitimate certificate usages may generate similar alerts, complicating triage. A companion detection could involve monitoring for unauthorized modification of group memberships or sudden increases in user privileges that would help identify related infiltration attempts.

