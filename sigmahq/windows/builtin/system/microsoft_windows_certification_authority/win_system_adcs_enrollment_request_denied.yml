note: |
  ### Technical Context

  This Sigma rule detects denied certificate enrollment requests to Active Directory Certificate Services (AD CS). Such denials may indicate an attacker trying to exploit misconfigured certificate templates or permissions, which could facilitate unauthorized access to sensitive information or systems. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1553) and Defense Evasion (T1553.004). Primary telemetry sources include Windows Event Log with Event ID 53 from the Certification Authority.

  If the denied requests are indeed malicious, it can indicate an attempt by an adversary to circumvent security controls via authentication tokens or certificates. However, it is crucial to note that this detection alone does not confirm any malicious activity; legitimate misconfigurations or user errors may also cause denied certificate requests.

  ### Investigation Steps

  - **Check Event ID 53 for details**: Review Windows Event Log entries with Event ID 53. Look for specific reasons for denial, such as invalid signatures or permission issues related to certificate templates. If the denial reasons relate to valid internal processes, it might indicate benign activity.

  - **Correlate with permission changes**: Cross-reference the denied request with recent changes in Active Directory Group Policies or Certificate Templates. This can help determine if an administrative error or policy change is causing the alerts, indicating benign activity instead of an attack.

  - **Analyze user accounts involved**: Identify the user accounts generating the denied requests. Investigate high-risk accounts or service accounts that may have been misused. Look for abnormal patterns, such as automated scripts failing to authenticate, which could indicate malicious intent.

  - **Check for exploit attempts**: Review other logs (e.g., Security Event ID 5140 for file sharing or Event ID 4624 for successful logon attempts) for unusual access patterns from the same user or system generating the denied requests. Multiple failed certificate requests may align with a specific attack vector.

  - **Identify high-confidence malicious indicators**: Look for patterns of denied requests within a specific timeframe that correspond to known threat actor techniques for attempting credential acquisition. This includes records of continuous failed requests from external IPs or accounts that were recently compromised.

  ### Prioritization

  The alert is classified as low severity in an enterprise context due to its lower likelihood of immediate impact. However, it should be prioritized for further investigation, as it may indicate poorly configured systems that attackers can exploit. This behavior can be weaponized indirectly, as successful certificate issuance can provide an elevated foothold in the network.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions causing certificate denial events, leading to false positives. Reliable detection requires logging configurations on the Certificate Authority server to capture all denied requests. Additionally, notable legitimate activities like scheduled maintenance or changes in infrastructure may trigger similar alerts. A related detection combining failed logins (e.g., Security Event ID 4625) would enhance overall coverage of suspicious behavior associated with credential access attempts.

