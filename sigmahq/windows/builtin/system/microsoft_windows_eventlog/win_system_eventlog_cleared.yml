note: |
  ### Technical Context
  This rule detects the clearing of Windows Event Logs, specifically through the generation of Event ID 104 from the Microsoft-Windows-Eventlog provider. Log clearing can indicate malicious intent, as attackers often attempt to remove traces of their activities to evade detection. This behavior might be part of an operational security measure by a legitimate administrator, but it is closely associated with nefarious activities such as data exfiltration or lateral movement within a compromised environment.

  The likely attacker objectives in this scenario are to cover their tracks after executing malicious activities, thereby hindering forensic investigations. The attack may leverage tools like Mimikatz or PowerShell scripts that include the "wevtutil cl" command to manipulate logs.

  Relevant MITRE ATT&CK Tactics and Techniques include:
  - **Defense Evasion** (Tactic)
    - **T1070.001**: Clear Event Logs

  Primary data sources for this detection are Windows Event Logs, particularly the System log where Event ID 104 entries are generated.

  ### Investigation Steps
  - **Review Event Logs**: Check the Windows Event Logs for any Event ID 104 entries, noting the timeframes and users associated with the log clearing actions.
  - **Analyze User Context**: Identify the user account that executed the command to clear logs. Investigate other activities performed by this user around the same timeframe.
  - **Correlate with Other Alerts**: Look for related alerts or anomalous activity in EDR or SIEM data that may coincide with the log-clearing action.
  - **Examine System Changes**: Investigate any recent changes to the hosts or systems, such as agent rollouts or provisioning processes, that could explain the event or raise additional concerns.

  ### Prioritization
  The alert has a medium severity as it can suggest malicious intent or significant operational oversight. Given that log clearing is a common tactic employed by attackers to obscure their presence, it warrants close examination, especially in environments with sensitive data.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if the logs from specific channels that include critical security events are not being monitored or are excluded from the detection rule. The logic assumes that any clearing of logs without prior legitimate justification is suspicious. Furthermore, the detection relies on the availability of Event ID 104 logs, which may not be present if logs have been extensively purged or if log collection agents are involved in resetting logs as part of their initialization routines.

