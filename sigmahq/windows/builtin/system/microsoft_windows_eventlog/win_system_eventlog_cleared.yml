note: |
  ### Technical Context

  This Sigma rule detects the clearing of Windows Event logs, an action that may indicate an attempt to obscure malicious activity. Attackers may aim to delete logs to prevent detection of their actions, such as lateral movement or privilege escalation. This behavior is associated with the MITRE ATT&CK technique "Indicator Removal on Host" (T1490).

  The primary telemetry source for this detection comes from Windows Security and System logs, particularly focusing on Event ID 104, which signals a clearing of event logs. If this action is malicious, it poses a significant security risk as it may signify the presence of an active threat actor. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that event logs have been cleared, which could also be a result of legitimate administrative activity.

  ### Investigation Steps

  - **Check for Event ID 104:** Review the Security or System logs for Event ID 104. Analyze the timestamp, user account, and source process (e.g., "wevtutil"). Malicious indicators would include a non-administrative user executing this command at an unusual time.

  - **Analyze User Activity:** Investigate the user activity prior to the event log clearing. Review logon events (Event ID 4624) to identify abnormal login times or unexpected user accounts performing administrative actions, which could signal compromise.

  - **Correlate with Other Log Sources:** Look for elevated privileges in the event logs surrounding the clearing event. Check for processes associated with Mimikatz or other credential dumping tools that may also clear logs as part of their execution.

  - **Determine Legitimate Activity:** Consider benign scenarios such as system provisioning or log collection agent installations that typically clear local logs. Review company policy documents that outline expected behavior during these processes to distinguish them from potential threats.

  ### Prioritization

  This alert is medium severity due to the potential impact on incident response capabilities if logs are cleared maliciously. The likelihood of abuse is moderate, as adversaries commonly employ log-clearing techniques to evade detection, especially during targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss log-clearing actions performed in non-standard formats or tools that do not log as Event ID 104. Additionally, if logs are not configured to capture all necessary events, significant activity may go undetected. Legitimate activities like routine log collections can generate false positives. Companion detections focusing on process execution (e.g., Sysmon Event ID 1 for "wevtutil" execution) can enhance coverage and confirm malicious intent.

