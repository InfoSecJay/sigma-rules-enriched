note: |
  ### Technical Context

  This Sigma rule detects instances where Windows Eventlogs have been cleared, specifically through event ID 104 from the 'Microsoft-Windows-Eventlog' provider. Clearing event logs can signify an attempt by an attacker to obfuscate previous activities, aligning with tactics associated with defense evasion. The relevant MITRE ATT&CK technique is T1070.001: Clear Command History.

  The primary telemetry sources required for detection are Windows Event logs, specifically the System log. If malicious, this behavior indicates a potential compromise aimed at concealing unauthorized actions or malicious activity. However, this detection alone does not confirm malicious intent, as legitimate actions (e.g., system provisioning or log management) may also trigger the alert.

  ---

  ### Investigation Steps

  - **Check for Event ID 104:** Examine the System log for Event ID 104 entries. Look for recent timestamps that coincide with other suspicious activities, indicating potential clearing of logs following a security event.

  - **Validate by correlating activity:** Cross-reference Event ID 104 with other relevant events (e.g., Event ID 4688 for process creation) in the same timeframe. Legitimate administrative actions will usually correlate with known scheduled maintenance windows or privileged operations.

  - **Review log clearing frequency:** Assess the frequency of event log clearing incidents. Consistent clearing of logs without clear justification may indicate malicious behavior, particularly in sensitive or critical systems.

  - **Analyze user context:** Identify the user account associated with the log clearing event. Administrative accounts executing log clearing commands require further scrutiny, especially if such activity occurs outside normal working hours.

  - **Consider benign events:** Identify benign activities that could clear logs, such as routine log collection agent rollouts or system resets. Catalog timings and user accounts involved to distinguish between legitimate and suspicious activity.

  - **Investigate surrounding log activity:** Review logs for any preemptive actions leading up to the event log clearing, such as unexpected process executions or remote access, particularly on critical servers.

  ---

  ### Prioritization

  This alert has medium severity, as it highlights potential malicious activity aimed at covering tracks but does not necessarily indicate a compromise by itself. The impact of a cleared event log can be significant, especially on critical systems, making it essential to investigate the circumstances surrounding the log clearing.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by standard operating procedures allowing for legitimate log clearing which can mask malicious behavior. A comprehensive log retention and monitoring policy is essential for reliable detection. Additionally, legitimate log clearing actions during system provisioning may trigger this alert. Related detections to consider are those monitoring for immediate suspicious activities following event clearances, such as T1070.002: Clear Windows Event Logs, which can provide additional context for ongoing investigations.

