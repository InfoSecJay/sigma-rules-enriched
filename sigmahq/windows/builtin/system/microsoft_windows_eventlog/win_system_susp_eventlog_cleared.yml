note: |
  ### Technical Context

  This rule detects the clearing of Windows event logs, an action commonly executed through the command "wevtutil cl" or similar commands. This behavior is typically indicative of an attacker attempting to erase signs of their activities—a tactic aimed at obscuring their presence in a compromised system. The relevant MITRE ATT&CK technique is "Indicator Removal on Compromised Systems" (T1561.001) under the tactic of "Defense Evasion."

  The primary telemetry sources for this detection include Windows Event Logs, specifically looking for Event ID 104 from the `Microsoft-Windows-Eventlog` provider across various channels such as "Security" and "System." If malicious, the security impact is significant, as the clearing of logs can hinder investigations and remediation efforts. This detection does NOT confirm whether the activity was malicious, as legitimate system administration tasks, including the rollout of log collection agents, can also trigger this alert.

  ### Investigation Steps

  - **Inspect event logs for Event ID 104:** Review `Security`, `System`, and specific PowerShell operational channels for Event ID 104 logs. Note the time of the log clearing. Compare timestamps with other relevant system logs to identify suspicious correlations.

  - **Correlate with login events:** Check for recent user logins or system access around the time of the event log clearing using Security Event ID 4624 (Logon). Look for atypical accounts or access patterns that could indicate unauthorized access.

  - **Examine process execution history:** Review the Process Creation logs (Sysmon Event ID 1) for the execution of "wevtutil" or other log-clearing commands. Look for unusual parent-child process relationships indicating malicious behavior.

  - **Identify legitimate administrative activities:** Confirm if the log clearing corresponds to scheduled maintenance or legitimate IT actions. Review documentation for system administration tasks around the timeframe of the alert.

  - **Assess system roles and asset importance:** Determine the system's role within the organization (e.g., server, workstation, critical asset). Note that clearing event logs on critical infrastructure necessitates a higher level of scrutiny.

  - **Document any follow-up actions:** If clear findings of malicious intent or suspicious activity emerge, commence with incident response actions, including capturing volatile data and the state of the system for further analysis.

  ### Prioritization

  This alert is of high severity due to the significant implications of clearing event logs on critical systems, which may cover up malicious actions. The likelihood of abuse is high, especially in targeted attacks where adversaries seek to eliminate traces of their activity. It is a common tactic used by malicious actors to safeguard lateral movement and other unauthorized activities.

  ### Blind Spots and Assumptions

  The detection relies heavily on the logging configuration of Windows systems, which can be disabled or misconfigured, limiting visibility. Clearing logs is also a tactic seen during legitimate administrative procedures, such as system resets or maintenance, which can complicate investigations. A related detection is the monitoring of anomalous network activity or user behavior, providing additional context to assess if the log clearing was part of a broader malicious campaign.

