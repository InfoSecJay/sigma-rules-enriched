note: |
  ### Technical Context
  This detection rule identifies the clearing of Windows Core Event Logs, particularly utilizing the "wevtutil cl" command. Attackers often clear logs to obfuscate their activities after executing malicious actions, such as lateral movement or data exfiltration. The primary objective for an attacker in this scenario would be to hide evidences of their presence and operations on a compromised system, making forensic analysis challenging for incident responders.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (TA0005)**, specifically employing the technique **Indicator Removal on Host (T1070.001)**, whereby adversaries remove or alter logs to evade detection. The data sources most relevant for this detection include Windows Event Logs from the system channels such as Security, System, and various PowerShell operational logs, as these will contain the necessary information to identify when logs have been truncated or cleared unexpectedly.

  ### Investigation Steps
  - **Review Event Logs:** Check the Windows Event Logs for Event ID 104, which indicates a log clear operation. Concentrate on the timestamp of the event to correlate it with any suspicious activities.
  - **Analyze User Activity:** Investigate the user contexts and privileges under which the "wevtutil" command was executed. This includes checking for any unusual user accounts or administrative actions leading up to the log clearing event.
  - **Correlate with Other Data Sources:** Leverage additional telemetry, such as PowerShell execution logs or Sysmon logs, to spot any preceding commands or scripts that may indicate malicious activities occurred before the log clearing.
  - **Identify Affected Logs:** Determine which specific logs were cleared (e.g., Security, System) and assess potential gaps in monitoring that the attacker may have exploited.

  ### Prioritization
  The severity of this alert is high due to the potential for severe impacts on incident response and forensic analysis. The likelihood of this behavior being conducted by malicious actors, as opposed to benign administrative actions, necessitates immediate attention.

  ### Blind Spots and Assumptions
  This rule may not cover all instances of log clearing, particularly if executed through non-standard methods or by processes that do not generate the expected events. Assumptions made include that the "wevtutil" command is the primary method employed for log clearance; however, attackers may use other techniques. Additionally, adequate logging must be enabled for the specific channels and systems involved to ensure proper detection; any misconfigurations in log collection could lead to unnoticed activity.

