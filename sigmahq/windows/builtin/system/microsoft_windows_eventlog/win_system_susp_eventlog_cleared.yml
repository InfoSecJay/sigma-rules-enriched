note: |
  ### Technical Context

  This rule detects the clearing of Windows Core Event logs, specifically triggered by the use of commands like `wevtutil cl`. Such behavior can indicate an attacker’s attempt to erase traces of their activities to evade detection, aligning with the MITRE ATT&CK tactic of Defense Evasion (T1070.001). The primary telemetry sources for this detection include Windows Event ID 104 from the event logs, including channels such as Microsoft-Windows-PowerShell/Operational and Security logs.

  If an attacker successfully clears relevant logs, they can significantly hinder forensic investigations and incident response efforts. However, this detection alone does not prove malicious intent; legitimate system management activities—such as log finalization during the provisioning of new systems—can also result in this event.

  ### Investigation Steps

  - **Check for related command execution:** Review Security Event ID 4688 to see if there are any command line executions for `wevtutil` or similar PowerShell commands shortly before the log-clearing event.

  - **Correlate event timing:** Cross-reference the timestamps of Event ID 104 with any recent administrative changes or logon events (Security Event IDs 4624 and 4634) to determine if the log clearing is part of legitimate maintenance.

  - **Identify patterns of event clearing:** Examine the frequency of Event ID 104 occurrences across the environment. A sudden spike can indicate malicious behavior, particularly if it correlates with other suspicious activities.

  - **Identify legitimate behaviors:** Review typical operational procedures within the organization, particularly during system setup and maintenance. Document any standard practices, such as pre-provisioning processes, that legitimately cause event log clears.

  - **Analyze asset criticality:** Focus on systems with elevated privileges or critical roles, such as domain controllers or production servers, as their logs contain vital information that attackers might target for clearing.

  - **Capture file modification artifacts:** Check for potential indicators of malicious intent, such as the creation or modification of files related to log clearing processes (e.g., PowerShell scripts or batch files), which may appear in monitoring logs.

  ### Prioritization

  This alert carries high severity due to the potential impact on the integrity of forensic investigations. The likelihood of malicious abuse is significant, considering log clearing is a common tactic employed by attackers to hide their presence. This behavior is frequently weaponized in sophisticated intrusions.

  ### Blind Spots and Assumptions

  Limitations exist as this detection can be triggered by benign activities, such as log collection agent rollouts and system resets. Reliable detection requires complete and properly configured log source collection across all relevant channels. Additionally, common administrative tasks may result in similar logs being cleared. A companion detection to consider is monitoring for repeated failed login attempts (Event IDs 4625) followed by log clearing events, which may suggest malicious intent to obfuscate traces.

