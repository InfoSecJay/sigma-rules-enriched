title: ISATAP Router Address Was Set
id: d22df9cd-2aee-4089-93c7-9dc4eae77f2c
status: experimental
description: |
  Detects the configuration of a new ISATAP router on a Windows host. While ISATAP is a legitimate Microsoft technology for IPv6 transition, unexpected or unauthorized ISATAP router configurations could indicate a potential IPv6 DNS Takeover attack using tools like mitm6.
  In such attacks, adversaries advertise themselves as DHCPv6 servers and set malicious ISATAP routers to intercept traffic.
  This detection should be correlated with network baselines and known legitimate ISATAP deployments in your environment.
references:
- https://www.blackhillsinfosec.com/mitm6-strikes-again-the-dark-side-of-ipv6/
- https://redfoxsec.com/blog/ipv6-dns-takeover/
- https://www.securityhq.com/blog/malicious-isatap-tunneling-unearthed-on-windows-server/
- https://medium.com/@ninnesoturan/detecting-ipv6-dns-takeover-a54a6a88be1f
author: hamid
date: 2025-10-19
tags:
- attack.impact
- attack.credential-access
- attack.collection
- attack.initial-access
- attack.privilege-escalation
- attack.execution
- attack.t1557
- attack.t1565.002
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 4100
    Provider_Name: 'Microsoft-Windows-Iphlpsvc'
  filter_main_localhost:
    IsatapRouter:
    - '127.0.0.1'
    - '::1'
  filter_optional_null:
    IsatapRouter:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate ISATAP router configuration in enterprise environments
- IPv6 transition projects and network infrastructure changes
- Network administrators configuring dual-stack networking
- Automatic ISATAP configuration in some Windows deployments
level: medium
note: |
  ### Technical Context
  This detection rule identifies the configuration of a new ISATAP (Intra-Site Automatic Tunnel Addressing Protocol) router on Windows hosts, specifically by monitoring Event ID 4100 from the Microsoft-Windows-Iphlpsvc provider. ISATAP is a legitimate protocol used for transitioning to IPv6, but malicious actors may exploit this by configuring unauthorized ISATAP routers to conduct attacks such as IPv6 DNS takeover. In these scenarios, attackers can impersonate DHCPv6 servers, intercepting and redirecting network traffic, which can result in data exfiltration or further attacks on the network.

  The suspected threat family includes techniques associated with man-in-the-middle (MitM) attacks, specifically utilizing tools like mitm6, which target IPv6 networks for malicious purposes. The relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (T1071)**: Gaining entry into the network via malicious ISATAP configurations.
  - **Credential Access (T1557)**: Interception of authentication data as part of the DNS takeover.
  - **Impact (T1565.002)**: Manipulating network traffic to disrupt normal operations.

  Primary data sources for this detection include system logs from Windows Event Viewer, particularly for IP layer configuration changes related to ISATAP routers.

  ### Investigation Steps
  - **Review Router Configuration Logs**: Check Windows Event ID 4100 logs to identify any changes made to ISATAP router settings, noting the timestamp and source of the changes.
  - **Correlate with Network Traffic**: Analyze network traffic logs to detect any unusual communication patterns that may indicate an interception, paying particular attention to DHCPv6 and ISATAP-related traffic.
  - **Verify Baseline Deployments**: Confirm known legitimate ISATAP configurations in the organization to distinguish between expected and potentially malicious settings.
  - **Conduct Endpoint forensics**: Examine the affected Windows host for additional suspicious artifacts or processes, ensuring to analyze network connectivity history for anomalies.

  ### Prioritization
  Given the potential for significant impact from MitM attacks and the seriousness of unauthorized access to network resources, this alert warrants a medium prioritization level. Organizations need to act quickly to investigate these incidents to prevent data theft or further compromise.

  ### Blind Spots and Assumptions
  This detection rule may not cover all modifications made by sophisticated attackers who can camouflage their actions or events that do not generate an Event ID 4100. Assumptions include that there are no legitimate changes made to ISATAP configurations without prior notice and that all expected ISATAP configurations are tracked. For the detection to function effectively, logging for Windows Event 4100 must be enabled and properly configured across all relevant endpoints.

