title: ISATAP Router Address Was Set
id: d22df9cd-2aee-4089-93c7-9dc4eae77f2c
status: experimental
description: |
  Detects the configuration of a new ISATAP router on a Windows host. While ISATAP is a legitimate Microsoft technology for IPv6 transition, unexpected or unauthorized ISATAP router configurations could indicate a potential IPv6 DNS Takeover attack using tools like mitm6.
  In such attacks, adversaries advertise themselves as DHCPv6 servers and set malicious ISATAP routers to intercept traffic.
  This detection should be correlated with network baselines and known legitimate ISATAP deployments in your environment.
references:
- https://www.blackhillsinfosec.com/mitm6-strikes-again-the-dark-side-of-ipv6/
- https://redfoxsec.com/blog/ipv6-dns-takeover/
- https://www.securityhq.com/blog/malicious-isatap-tunneling-unearthed-on-windows-server/
- https://medium.com/@ninnesoturan/detecting-ipv6-dns-takeover-a54a6a88be1f
author: hamid
date: 2025-10-19
tags:
- attack.impact
- attack.credential-access
- attack.collection
- attack.initial-access
- attack.privilege-escalation
- attack.execution
- attack.t1557
- attack.t1565.002
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 4100
    Provider_Name: 'Microsoft-Windows-Iphlpsvc'
  filter_main_localhost:
    IsatapRouter:
    - '127.0.0.1'
    - '::1'
  filter_optional_null:
    IsatapRouter:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate ISATAP router configuration in enterprise environments
- IPv6 transition projects and network infrastructure changes
- Network administrators configuring dual-stack networking
- Automatic ISATAP configuration in some Windows deployments
level: medium
note: |
  ### Technical Context

  This detection identifies the creation of a new ISATAP router configuration on a Windows host, which can indicate an attempt to manipulate IPv6 traffic via unauthorized DNS takeover. Attackers may leverage tools such as mitm6 to set up malicious ISATAP routers, potentially resulting in traffic interception and credential theft. The relevant MITRE ATT&CK technique is **T1557: Adversary-Initiated Command and Control**. Primary telemetry sources include Windows system event logs with a focus on Event ID 4100 from the **Microsoft-Windows-Iphlpsvc** provider. If this behavior is malicious, it can compromise sensitive data integrity and confidentiality. However, this detection does not confirm malicious intent on its own; it requires correlation with network baselines and legitimate ISATAP configurations.

  ### Investigation Steps

  - **Check Event ID 4100 logs for router configuration details:** Review logs for Event ID 4100 in Windows Event Viewer under **Applications and Services Logs > Microsoft > Windows > Iphlpsvc**. Look for unexpected or unauthorized ISATAP router addresses that do not match known good configurations.

  - **Examine the network configuration:** Use the `ipconfig /all` command on the affected host to check if the ISATAP adapter is improperly configured. Valid configurations should match your enterprise’s documented ISATAP architecture.

  - **Identify the source of the ISATAP update:** Investigate which process or user initiated the ISATAP router configuration change by reviewing security logs, focusing on Event ID 4688 (Process Creation) for related CMD or PowerShell command invocations.

  - **Validate with network traffic analysis:** Review network traffic for DHCPv6 messages indicating potential rogue DHCPv6 server activity. Look at packet captures or flow data for unexpected ISATAP IPv6 addresses and unusual DHCP transactions.

  - **Review baselines for legitimate ISATAP use:** Cross-reference with inventory and documentation of known ISATAP configurations within your organization to differentiate between benign setups and potential intrusions.

  - **Alert for related behaviors:** If this alert is triggered, also assess for any associated events indicating lateral movement or privilege escalation techniques (e.g., Event ID 4624 for logins from unexpected accounts).

  ### Prioritization

  This alert can be considered medium severity as the potential impact hinges on whether sensitive information is intercepted through the malicious router setup. The likelihood of malicious abuse is moderate, especially given that ISATAP configurations are not commonly altered without administrative intent. While IPv6 threats are emerging, active exploitation of this specific technique may still be limited.

  ### Blind Spots and Assumptions

  The detection may struggle to identify advanced evasion techniques such as legitimate dual-stack configurations being tampered with. Reliable detection requires proper Windows log collection, particularly focusing on Event ID 4100. Legitimate network transitions or administrative actions can trigger this alert; continuous monitoring of network baselines is vital to discern authenticity. A related detection to consider is monitoring DHCPv6 logs for abnormal server addresses or erratic updates, reinforcing defense against IPv6 manipulation attempts.

