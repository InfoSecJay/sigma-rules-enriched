  ### Technical Context

  This rule detects when a DHCP server loads a specified Callout DLL, which may indicate unauthorized modifications to the DHCP service components typically used to implement malicious functionalities like network redirection or man-in-the-middle attacks. The likely adversary objective is to exploit DHCP services for privilege escalation or persistence, gaining control over network traffic and potentially redirecting users to malicious destinations. This detection correlates with the MITRE ATT&CK technique for DLL side-loading (T1574.001).

  The primary telemetry source is Windows Event ID 1033, generated by the DHCP server service when a Callout DLL is loaded. If the behavior is malicious, it poses a significant security impact as it can facilitate unauthorized network access and data interception. Importantly, this detection does NOT confirm that the behavior is malicious on its own; further investigation into the context and purpose of the loaded DLL is necessary.

  ### Investigation Steps

  - **Verify Event ID 1033 presence:** Review Security Event ID 1033 in the Windows Event Viewer, focusing on the Provider_Name field for "Microsoft-Windows-DHCP-Server". Document the timestamp and any associated user accounts.

  - **Check loaded DLL details:** Identify the DLL being loaded by analyzing the Event 1033 logs. Look at the `Callout DLL` registry settings to ensure the DLL is a legitimate Windows component or a trusted third-party application.

  - **Assess DHCP server role:** Confirm whether the affected server is genuinely intended to operate as a DHCP server. Check its role in the network architecture; unexpected DHCP servers could indicate rogue devices or compromise.

  - **Review recent changes:** Look for recent configuration or registry changes associated with the DHCP server. Check for any updates or new deployments that may legitimately involve DLL modifications.

  - **Identify legitimate behavior:** Note that expected behavior may involve legitimate DHCP callouts for network management tools or services. Confirm that known applications and system tooling are functioning correctly without unintended behaviors.

  - **Flag for malicious indicators:** Investigate for any indicators of compromise, such as unusual network traffic from the affected DHCP server or connections to known malicious IPs after the DLL load event. Utilize tools such as IDS logs or network monitoring to validate this.

  ### Prioritization

  This alert should be treated as high severity since it indicates a potential change in core networking functionality that can be exploited for privilege escalation and persistent access. DHCP services are often targeted by adversaries for malicious exploitation, making this detection relevant in the context of network security.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific logging configurations. Adversaries might employ DLL hijacking or other evasion techniques. Moreover, legitimate applications or services that utilize DHCP functionality may inadvertently trigger this alert. Companion detections for monitoring unauthorized modifications in service configurations or unusual network patterns from DHCP servers enhance overall coverage.

