note: |
  ### Technical Context
  This detection rule identifies the mounting of Volume Shadow Copies on Windows systems, specifically triggered by Event ID 98 from the Microsoft-Windows-Ntfs provider. Volume Shadow Copy Service (VSS) is commonly used in legitimate backup operations; however, its misuse can indicate malicious activities such as data exfiltration, unauthorized access, or preparation for ransomware attacks. Attackers may exploit shadow copies to access sensitive files or to restore their own encrypted files without detection.

  The relevant MITRE ATT&CK techniques for this detection include "Credential Dumping" (T1003) and "Credential Dumping: Volume Shadow Copy" (T1003.002), highlighting its association with the extraction of credentials from system images. Effective monitoring of this event helps safeguard against unauthorized access to sensitive data.

  Primary data sources for this detection include Windows event logs, specifically those from the system that document actions taken by the NTFS file system and VSS activity.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows event logs for Event ID 98 to assess the context in which volume shadow copy mounts were initiated. Pay attention to the timestamp and the initiating user account.
  - **Identify User Behavior**: Investigate the user account associated with the event for any previous suspicious activities or elevated privileges that are inconsistent with typical access patterns.
  - **Analyze Shadow Copies**: Check the list of mounted shadow copies using the `vssadmin list shadows` command. Look for unexpected shadow copies that might have been created without standard operational justifications.
  - **Cross-Reference Backup Procedures**: Validate against scheduled backup jobs or legitimate administrative activities to discern whether the shadow copy process aligns with expected operational use.

  ### Prioritization
  This alert has low severity due to the potential for legitimate administrative usage of volume shadow copies, such as scheduled backups; however, vigilance is necessary to ensure that this functionality is not being abused by attackers seeking to leverage backup systems for malicious purposes.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection is the potential for legitimate administrative actions to trigger similar alerts, leading to false positives. The detection logic assumes that volume shadow copy mounts are atypical for the monitored environment, which may not always hold true in cases where shadow copies are routinely used. Additionally, it requires appropriate logging configurations for Windows event IDs to be enabled for Event ID 98 to be captured effectively.

