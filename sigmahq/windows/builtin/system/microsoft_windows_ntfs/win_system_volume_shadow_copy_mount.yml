  ### Technical Context

  This Sigma rule detects the mounting of Volume Shadow Copies on Windows systems, indicated by Event ID 98 from the Microsoft-Windows-Ntfs provider. Such behavior may be leveraged by attackers to access shadow copies of files, potentially allowing for sensitive data retrieval or evasion of security measures. The relevant MITRE ATT&CK technique for this activity is Credential Access, specifically under T1003.002 (Credential Dumping: LSASS Memory).

  The primary telemetry source for this detection is the Windows System event log, specifically looking for indications of shadow copy mounts. If exploited maliciously, this could lead to the leakage of sensitive credentials or data. It's important to note that this detection alone does not confirm unauthorized access or exploitation; legitimate use cases exist for shadow copy mounts, such as backup processes.

  ### Investigation Steps

  - **Identify shadow copy mounts:** Review event logs for **Event ID 98** from the **Microsoft-Windows-Ntfs** provider. Look for logs indicating mounts of shadows from devices like **HarddiskVolumeShadowCopy**.

  - **Correlate with backup operations:** Check for scheduled tasks or services actively using volume shadow copies, such as Windows backup tools. Expected behavior includes logs from **Microsoft-Windows-Backup** events confirming legitimate backup activity.

  - **Verify user context:** Investigate the user identity associated with the Event ID 98 logs to determine if the initiator is a known backup service or an unusual user account, indicating potential abuse.

  - **Inspect timing and frequency:** Analyze the pattern of shadow copy mounts for unusual activity, focusing on timestamps that don't align with standard backup windows, which may suggest malicious intent.

  - **Cross-reference with file access logs:** Examine security event logs (Event ID 4663) for access to sensitive files around the same timeframe to confirm if the shadow copies may have been accessed maliciously.

  ### Prioritization

  The alert severity is low as the detection often relates to legitimate backup processes. However, the likelihood of malicious abuse exists, particularly in environments with sensitive data. This technique is not commonly weaponized on its own but can be part of broader credential dumping or data exfiltration activities.

  ### Blind Spots and Assumptions

  This detection may be limited by techniques that evade logging or obscure legitimate use cases, such as scheduled backups initiated by trusted processes. Ensuring the correct configuration of Windows event logging is essential for reliable detection. Legitimate operational activity, like legitimate backup tools using volume shadow copies, may trigger this alert. A related detection to enhance coverage could involve monitoring for unusual data access patterns or authentication events immediately following a shadow copy mount.

