  ---

  ### Technical Context

  This Sigma rule detects the mounting of volume shadow copies on Windows systems, specifically logged by Event ID 98 from the Microsoft-Windows-Ntfs provider. Such behavior may indicate an attacker attempting to exfiltrate sensitive data or perform a backup of the volume for evasion purposes. The relevant MITRE ATT&CK tactic is Credential Access, with the technique being T1003.002 (OS Credential Dumping: Security Account Manager).

  Primary telemetry sources include the Windows System Event log, specifically focusing on Event ID 98. If this behavior is malicious, it could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm that the behavior is necessarily malicious on its own; it might also represent legitimate administrative actions such as backups.

  ---

  ### Investigation Steps

  - **Check for Event ID 98 logs:** Review the Windows System Event log for Event ID 98 from the Microsoft-Windows-Ntfs provider. Look for events within a suspicious timeframe that might indicate non-administrative access to sensitive shadows.

  - **Validate legitimate administrative activity:** Determine if the volume shadow copy mount correlates with known scheduled tasks or administrative activities by analyzing Event ID 4704 (Task Scheduler) to see if the timing aligns with regular backup operations.

  - **Identify unusual user context:** Investigate which user initiated the mount by correlating the Event ID 98 with Security Event ID 4624 (Logon). Malicious mounts may originate from anomalous accounts or non-privileged users.

  - **Cross-check mounted volumes:** Review all currently mounted volumes with the command `vssadmin list shadows` to verify if the mount is on a volume that typically isn't interacted with in a normal operational context.

  - **Look for lateral movement indicators:** Check for subsequent events that may indicate credential dumping or lateral movement, such as Event ID 4625 (Failed Logon) or password hash extraction tools running (refer to Sysmon Event ID 1 for process creation).

  ---

  ### Prioritization

  This alert should be considered low to medium priority in an enterprise environment, as the security impact may vary based on the criticality of the affected system and the context of the event. However, mounting volume shadow copies could be an early indicator of an adversary trying to leverage known system vulnerabilities, making it a tactic that could be weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the reliance on event logging being adequately configured; if Windows systems do not log Event ID 98, this detection will not function reliably. Regular operations that involve backups using volume shadow copies may trigger the alert, leading to potential false positives. A related detection to enhance coverage could involve monitoring for the use of VSS-related commands invoked using tools like "vssadmin" or "diskshadow".

