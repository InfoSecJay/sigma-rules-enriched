note: |
  ### Technical Context
  This detection rule identifies instances where NTLMv1 authentication is used between a client and server. NTLMv1 is an outdated and insecure authentication protocol that employs weak encryption algorithms, making it susceptible to brute-force attacks by modern hardware. An attacker may exploit NTLMv1 to gain unauthorized access to systems, allowing for credential harvesting and man-in-the-middle attacks, which can facilitate lateral movement within a network. The objective for attackers leveraging this vulnerability is often to escalate privileges or gain persistent access to sensitive resources.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion** (T1203), which involves avoiding detection through the use of insecure protocols, and **Lateral Movement** (T1550.002), indicating that the attacker is seeking to pivot and navigate through the network. The primary data sources for capturing this event are Windows system logs that monitor security and event records related to authentication procedures, specifically events raised by the LsaSrv provider.

  ### Investigation Steps
  - **Review Authentication Logs:** Examine Windows security logs for Event IDs 6038 and 6039 from the LsaSrv provider to identify instances of NTLMv1 authentication. Check for patterns indicating misuse or excessive use of this protocol.
  - **Assess User and System Behavior:** Analyze the user accounts and systems involved in the NTLMv1 authentication events. Look for anomalies such as unexpected logins from unfamiliar locations or users attempting to access sensitive resources.
  - **Cross-Reference with Network Traffic:** Utilize network monitoring tools to inspect traffic between clients and servers during the timeframe of the NTLMv1 logon events. Look for signs of potential lateral movement or communication with known compromised systems.
  - **Implement Mitigation Strategies:** If NTLMv1 usage is detected, work to disable this protocol across the environment and replace it with more secure alternatives such as Kerberos to reduce the risk of exploitation.

  ### Prioritization
  This alert is classified as medium severity due to the potential risk NTLMv1 poses to the enterprise environment. The likelihood of exploitation is significant given the widespread use of legacy systems that may still rely on this insecure protocol.

  ### Blind Spots and Assumptions
  One blind spot in this detection is the potential for environments that still require the use of NTLMv1 for functionality, which may lead to false positives. The detection logic assumes the presence of relevant event logs generated by the LsaSrv provider; thus, it requires proper logging and monitoring configurations to function effectively. Furthermore, it does not account for instances where NTLMv1 might be hidden or obfuscated within legitimate operations, possibly leading to missed detections.

