note: |
  ### Technical Context

  This Sigma rule detects the use of NTLMv1 authentication between a client and server. NTLMv1 is considered insecure due to its vulnerable encryption mechanisms, making it susceptible to brute-force attacks by modern adversaries. The likely attacker objective is to exploit weaknesses associated with NTLMv1 to gain unauthorized access or escalate privileges within an enterprise environment.

  This behavior aligns with the MITRE ATT&CK framework under the tactics of Credential Access (TA0006) and Lateral Movement (TA0008), specifically techniques T1550.002 (Use of Credentials). The primary telemetry sources for detection include Windows Event Logs, specifically Event ID 6038 and Event ID 6039 from the LsaSrv provider. The security impact of a successful breach leveraging NTLMv1 could lead to unauthorized data access and potential lateral movement across the network. Note that this detection alone does not confirm malicious intent or successful exploitation; NTLMv1 may be used legitimately in certain controlled environments.

  ### Investigation Steps

  - **Check Event IDs for NTLMv1 Logon:** Review Windows Security Event log for Event ID 6038 (NTLMv1 logon attempt) and Event ID 6039 (NTLMv1 successful logon). Analyze log timestamp, source IP, and account name for correlations with suspicious activity.

  - **Identify suspicious IP addresses:** Cross-reference the source IP of the NTLMv1 logon events against known benign IP addresses or any approved client machines. An unfamiliar external IP may indicate malicious activity.

  - **Review user account behavior:** Analyze behavior associated with the user account listed in the events. Confirm if the account typically uses NTLMv1; legitimate accounts might use Kerberos or NTLMv2, suggesting a potential compromise or misconfiguration if NTLMv1 is detected.

  - **Investigate neighboring security logs:** Check for associated logs in the Windows Security Event Log (Event IDs 4624 for logon events, 4647 for logoff) around the same time frame to assess if unusual access patterns are present, signaling possible lateral movement.

  - **Correlate with known vulnerabilities:** Use threat intelligence to verify if the source or target system has known vulnerabilities related to NTLMv1. Systems flagged might require immediate patching or network segmentation.

  - **Document legitimate usage cases:** If NTLMv1 is used officially within the organization, document how and why. Provide guidance to the team for safer practices and consider remediating any necessary configurations to move towards stronger authentication methods.

  ### Prioritization

  This alert is given medium severity due to the potential risk involved with NTLMv1 usage. The likelihood of misuse exists, especially in environments where legacy systems are integrated, making it a common target for adversaries exploiting weak authentication protocols to gain access and move laterally.

  ### Blind Spots and Assumptions

  Detection may have limitations as legitimate applications still using NTLMv1 might trigger false positives. Adequately configured logging (especially for security events) is essential for reliable detection. Additionally, environments with controlled use of NTLMv1 should expect alerts without malicious intent. A related detection to enhance coverage is monitoring for unauthorized logon events (e.g., Event ID 4648) that may reveal further malicious credential access attempts.

