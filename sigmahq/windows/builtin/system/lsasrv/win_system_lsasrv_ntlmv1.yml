note: |
  ### Technical Context

  This Sigma rule detects the use of NTLMv1 authentication between a client and server, indicated by Event IDs 6038 and 6039 from the LsaSrv provider. The likely attacker objective is to exploit the deprecated NTLMv1 protocol to authenticate to systems or services, thereby gaining access to sensitive data or enabling lateral movement within the network. This behavior corresponds to the MITRE ATT&CK tactic “Lateral Movement” (TA0008) and technique “Pass-the-Hash” (T1550.002). The primary telemetry sources for this detection are Windows Event Logs related to authentication services. If NTLMv1 is being abused, it poses a significant security risk due to its susceptibility to brute-force attacks. However, this detection alone does NOT confirm malicious intent as NTLMv1 may also be employed in known legacy environments where it is still permitted.

  ### Investigation Steps

  - **Identify relevant authentication events:** Query Security Event Logs for Event ID 4624 (Logon) and Event ID 4648 (Logon with explicit credentials) to identify logon attempts using NTLMv1.

  - **Check for unusual client-server connections:** Investigate any corresponding Event IDs 6038 and 6039 in the Application log under LsaSrv provider, focusing on client-server pairs where NTLMv1 authentication occurs, particularly if they're non-standard communications.

  - **Evaluate asset criticality:** Assess the criticality of affected assets. For instance, if a domain controller or a sensitive database server is involved, the risk is significantly higher.

  - **Review known benign configurations:** Justify logged NTLMv1 usage by confirming whether the specific client and server are legacy systems that require NTLMv1 for operational purposes. Document known valid environments.

  - **Track down lateral movement attempts:** Monitor subsequent events (e.g., Event ID 4672) from the same client or session for any indicators of lateral movement attempts originating from the client employing NTLMv1.

  - **Inspect for brute-force attempts:** Check for signs of brute-force activity where NTLMv1 is engaged by utilizing tools like Windows Defender ATP and correlating with user account lockouts or multiple failed logon events (Event ID 4625).

  ### Prioritization

  This alert has medium severity, primarily due to the presence of NTLMv1 authentication in the enterprise, which is often a target during lateral movements or credential theft attempts. Given that NTLMv1 exposes systems to increased risk, especially in high-value environments, this behavior should be prioritized for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments still actively using NTLMv1, potentially masking malicious activity. Log sources require proper configuration to detect NTLMv1 effectively, and certain legitimate applications may trigger alerts during standard operations. Companion detections for failed logon attempts (Event ID 4625) strengthen coverage for understanding potential exploitation scenarios.

