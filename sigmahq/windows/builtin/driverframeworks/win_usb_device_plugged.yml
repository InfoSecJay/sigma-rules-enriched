  ---

  ### Technical Context

  This rule detects the plugging or unplugging of USB devices by monitoring Windows event logs specifically for Event IDs 2003, 2100, and 2102. Adversaries may use USB devices for initial access to deploy malware or exfiltrate sensitive data. This behavior relates to the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique of Exploit Public-Facing Applications (T1200). The primary telemetry source is the Microsoft-Windows-DriverFrameworks-UserMode/Operational event log, which captures Plug and Play (PnP) device events.

  If malicious, this activity can signify unauthorized data transfer or the introduction of malware into the organization’s environment. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate administrative activities involving USB devices may also trigger this alert.

  ---

  ### Investigation Steps

  - **Identify USB event details:** Review logs for Event IDs 2003, 2100, and 2102 in the Microsoft-Windows-DriverFrameworks-UserMode/Operational log. Check for device IDs and user accounts associated with the events.

  - **Correlate with user behaviors:** Analyze the timeline of the USB activity with user login and device access patterns. For example, if a USB was plugged in by an administrator during working hours on a corporate station, this may be benign.

  - **Look for high-risk indicators:** Investigate unusual USB device activity, such as multiple plug/unplug events within a short timeframe or connections occurring outside of regular business hours. These might be indicative of an attacker trying to exfiltrate or implant malicious software.

  - **Assess device legitimacy:** Cross-reference the device ID against known corporate assets or an allowlist. Unknown or blacklisted device IDs should be flagged for further investigation.

  - **Review additional telemetry:** If available, check antivirus or endpoint detection tools for alerts related to USB usage or specific processes initiated by actions on the USB device.

  ---

  ### Prioritization

  This alert has a low severity due to the typically benign nature of USB device usage. While it can indicate initial access behavior, the likelihood of malicious abuse will depend on the context of the device connection. USB devices are a common vector for data transfer, which makes the detection important but not urgent.

  ---

  ### Blind Spots and Assumptions

  Legitimate activities, such as authorized file transfers or system updates, may trigger this alert, making it critical to assess the context. Detection accuracy relies on the complete and correct configuration of the Microsoft-Windows-DriverFrameworks-UserMode/Operational event log. Adversaries may employ strategies to bypass detection, such as using unmonitored or personal devices. A related detection rule could involve monitoring for unusual file activities (e.g., copying or renaming files) on USB devices to enhance threat detection.

