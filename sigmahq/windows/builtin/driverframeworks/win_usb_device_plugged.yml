note: |
  ### Technical Context

  This rule detects the plugging and unplugging of USB devices on Windows systems by monitoring specific event logs related to driver management. Attackers often seek to gain initial access to systems using USB devices, which can be used for malware delivery or data exfiltration. This behavior is relevant to the MITRE ATT&CK framework under the tactic of Initial Access (TA0001) and technique USB Device Attack (T1200).

  The primary telemetry source is Windows Event Log, specifically the Microsoft-Windows-DriverFrameworks-UserMode/Operational event log, capturing Event IDs 2003, 2100, and 2102. If the USB device activity is malicious, it may indicate a breach of security policies, potential data theft, or the introduction of payloads like malware. However, this detection does NOT confirm that a malicious action has occurred; it merely indicates that USB devices were connected or disconnected.

  ### Investigation Steps

  - **Check Event IDs:** Review Windows Event Log entries for Event ID 2003 (USB device driver loading) and Event IDs 2100/2102 (Plug and Play or power management) in the Microsoft-Windows-DriverFrameworks-UserMode/Operational log. Validate the timestamps against the alert trigger time.

  - **Identify USB Device Types:** Determine the device type using the event log details, specifically the "DeviceName" or "InstanceId" fields. Look for known malicious device names or unrecognized hardware that could indicate potential threats.

  - **Review User Activity:** Cross-reference user activity with logs from Event ID 4624 (Logon events) around the time of the USB activity. Legitimate administrative actions often come from trusted user accounts, while anomaly detection may indicate unauthorized access.

  - **Analyze Recent Policy Changes:** Investigate if there were any recent changes in local or group policies regarding USB device usage. Find entries in security settings or configurations that might explain legitimate use cases versus unauthorized attempts.

  - **Correlate with File System Events:** Check for file system artifacts created or modified around the same alert time using Windows Event ID 4663 (Access attempts) to identify any evidence of exfiltration or malware files being accessed.

  ### Prioritization

  This alert has a low severity in a mature enterprise context, as it may indicate benign administrative actions. However, the potential for malicious USB usage persists, especially in environments with high-security sensitivities. Although USB exploitation is not the most common method of attack, it remains a well-documented vector for initial access.

  ### Blind Spots and Assumptions

  There are limitations in detection if the relevant logs are not properly configured and collected, particularly for devices logged in the operational event log. Legitimate activity, such as IT team hardware management or authorized hardware upgrades, may trigger this alert. A related detection that strengthens coverage is monitoring for unusual file read/write actions on USB devices (e.g., correlating with Event ID 4663), which may indicate unauthorized data manipulation.

