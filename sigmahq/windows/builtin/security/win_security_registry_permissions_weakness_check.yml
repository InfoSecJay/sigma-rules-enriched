detection:
  selection:
    EventID: 4663
    ObjectName|contains|all:
    - '\SYSTEM\'
    - 'ControlSet\Services\'
    AccessList|contains: '%%1538'     # READ_CONTROL
  condition: selection
falsepositives:
- Likely from legitimate applications reading their key. Requires heavy tuning
level: low
note: |
  ### Technical Context

  This Sigma rule detects "read access" requests on the Windows registry keys associated with service configurations. Attackers may exploit weaknesses in the permissions of these registry keys to redirect service executions to malicious payloads, thereby gaining persistence or escalating privileges in a target environment. The relevant MITRE ATT&CK tactics and techniques include Persistence (T1574.011: Registry Run Keys / Startup Folder) and Privilege Escalation.

  The primary telemetry source is Windows Security Event logs, specifically looking for Event ID 4663 involving successful access to the specified registry paths. If malicious, the security impact could include unauthorized service execution or persistence mechanisms established to evade detection. However, this detection does NOT confirm malicious intent on its own; legitimate applications may also access these registry keys for reading their configurations.

  ### Investigation Steps

  - **Verify Event ID**: Look for Windows Security Event ID 4663, focusing on access to registry paths under `\SYSTEM\ControlSet\Services\`. Confirm if the `AccessList` contains `%%1538` indicating "READ_CONTROL".

  - **Identify Legitimate Access Patterns**: Document typical applications known to read from service registry keys, such as service configuration tools or management scripts. Compare the access frequency and timing against these patterns to differentiate benign and suspicious behavior.

  - **Analyze Source Conditions**: Check the source process or user account generating the Event ID. Malicious access often comes from non-administrative accounts or unfamiliar processes. Look for anomalous names or locations that may indicate compromise.

  - **Investigate Related Access Events**: Correlate with other recent security events (e.g., Event ID 4688 for process creation) to see if the accessing process executed recently in a suspicious context, indicating a potential malicious exploitation scenario.

  - **Monitor Configuration Weaknesses**: Validate that appropriate Security Access Control Lists (SACLs) are in place for service registry keys to ensure that such read access logs are triggered only under legitimate circumstances.

  - **Check for Exfiltration Activities**: Lastly, assess if there have been any unusual file creation or modification activities (Event ID 4660), especially if the read access patterns involve multiple keys in a short timeframe, suggesting potential script activity or automated exploitation.

  ### Prioritization

  This alert has a low severity due to its potential for false positives arising from legitimate application behavior. However, given the impact of unauthorized service execution, there is a risk of malicious abuse if exploited, particularly if an adversary is attempting to gain persistence through registry manipulation, which is a known method in the attack lifecycle.

  ### Blind Spots and Assumptions

  Limitations include potential evasion by sophisticated attackers who may obscure legitimate activity. Detection is reliant on the configuration of SACLs to ensure reliable logging of access requests. Legitimate administrative tools may trigger these alerts during standard operations, and a lack of context could lead to misinterpretations. Related detections such as those monitoring process creation (Event ID 4688) can provide additional insight into the nature of the behaviors being observed.

