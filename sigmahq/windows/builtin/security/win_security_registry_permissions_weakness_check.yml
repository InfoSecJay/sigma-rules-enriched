detection:
  selection:
    EventID: 4663
    ObjectName|contains|all:
    - '\SYSTEM\'
    - 'ControlSet\Services\'
    AccessList|contains: '%%1538'     # READ_CONTROL
  condition: selection
falsepositives:
- Likely from legitimate applications reading their key. Requires heavy tuning
level: low
note: |
  ### Technical Context

  This Sigma rule detects read access requests to specific registry keys associated with services on Windows systems, indicating potential attempts to exploit weaknesses in service registration. The likely attacker objective is to hijack a service's execution path by modifying registry entries to redirect legitimate service starts to malicious payloads, thereby maintaining persistence and potentially escalating privileges. This activity corresponds to the MITRE ATT&CK technique: "Service Registry Permissions Weakness" (T1574.011). The primary telemetry source is Windows Security Event Logs, specifically Event ID 4663, which records access to registry keys. If malicious, the security impact includes unauthorized code execution and system compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may also require access to those registry keys.

  ### Investigation Steps

  - **Check Event ID 4663 logs**: Review Windows Security logs for Event ID 4663 with ObjectName containing `ControlSet\Services\`. Analyze the AccessList field for '%%1538' to identify read access requests relevant to service registry keys.

  - **Identify legitimate application behavior**: Verify if known legitimate applications (e.g., system services or management tools) are accessing these registry keys. Such behavior is typical during service configuration and should not raise concern.

  - **Inspect timestamp correlations**: Compare the timestamps of the Event ID 4663 entries with other related events such as service start events (Event ID 7036) to determine if there's a pattern suggesting misuse or suspicious activity.

  - **Look for anomalies in AccessList**: Identify any unusual accounts or unknown applications in the AccessList of Event ID 4663 entries. High-risk indicators may include accounts or processes not tied to authorized service management.

  - **Examine the registry for service associations**: Navigate to the registry paths `/SYSTEM/ControlSet\Services/` for any changes made to services following suspicious read access. Look for unusual executable paths that could indicate tampering.

  - **Validate corrective actions implemented on affected systems**: Confirm whether Security Access Control Lists (SACLs) are properly configured for the registry keys involved. Misconfigured keys can lead to further exploitation.

  ### Prioritization

  Given the potential impact of compromising service registry keys, alerting on read access requests carries moderate severity. The likelihood of malicious abuse is notable, especially in environments lacking robust access controls. The behavior is commonly weaponized in sophisticated attacks where persistence and privilege escalation are targeted.

  ### Blind Spots and Assumptions

  The detection may be evaded via specific user account permissions or when applications manipulate services without triggering registry access logs. Ensuring SACLs are correctly configured is essential for reliable detection. Legitimate maintenance operations on service keys, such as updates or audits, may trigger the alert. Related detections for service tampering or modifications, such as monitoring service execution paths, would enhance coverage.

