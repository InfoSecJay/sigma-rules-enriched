logsource:
  product: windows
  service: security
  definition: 'Requirements: SACLs must be enabled for "READ_CONTROL" on the registry
    keys used in this rule'
detection:
  selection:
    EventID: 4663
    ObjectName|contains|all:
    - '\SYSTEM\'
    - 'ControlSet\Services\'
    AccessList|contains: '%%1538'     # READ_CONTROL
  condition: selection
falsepositives:
- Likely from legitimate applications reading their key. Requires heavy tuning
level: low
note: |
  ---

  ### Technical Context

  This rule detects read access requests on the Windows Service Registry keys, specifically monitoring for attempts to access keys that control service behavior. Attackers may exploit improper permissions on these keys to hijack services and execute malicious code under the guise of legitimate service operations. The relevant MITRE ATT&CK technique is "Service Registry Permissions Weakness" (T1574.011). Primary telemetry sources include Windows Security logs, specifically Event ID 4663, which indicates object access attempts. If malicious, this could lead to persistent and stealthy execution of unauthorized code with potential system compromise. However, this detection does NOT confirm that malicious activity has occurred on its own; it only highlights access attempts that require further investigation.

  ---

  ### Investigation Steps

  - **Check Event IDs:** Review Windows Security Event ID 4663 logs for read access attempts on the respective registry keys related to services (e.g., `\SYSTEM\ControlSet\Services\`). Look for consistent patterns of access indicative of automation or scripting.

  - **Identify Malicious Behavior:** Look for access requests associated with unusual service accounts or from non-standard processes that frequently do not require registry access. Specifically, check if `AccessList` contains '%%1538' which indicates read control requests.

  - **Analyze Service Context:** Determine the context of the service involved in the request. Look for legitimate services accessing their own registry keys and compare their access frequency and timing to the alerts. Note the user account under which the service is running.

  - **Review Permission Settings:** Validate the permissions set on the registry keys using tools like `regedit` or PowerShell. Confirm whether the 'READ_CONTROL' permission is set inappropriately, allowing potential abuse.

  - **Assess Risk:** Evaluate the criticality of the affected system. Determine its role within the enterprise; for instance, servers hosting sensitive applications pose higher risks if compromised.

  - **Examine for File Creation:** Look for any file creation events simultaneous to the access alert, particularly in directories used by system services (e.g., `C:\Windows\System32`). This could indicate an adversary attempting to place a malicious executable alongside legitimate service files.

  ---

  ### Prioritization

  The alert is of low severity; while it indicates a potentially malicious behavior pattern, the likelihood of abuse greatly depends on the context of the access attempts, such as the system's criticality and the user account utilized. This behavior may be weaponized, but it also often occurs due to legitimate administrative activities.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion through legitimate service operations or misconfigured permissions allowing normal applications to trigger alerts. Accurate logging of registry accesses requires that SACLs are properly configured. Legitimate applications may frequently access their own registry keys, leading to false positives. A related detection to complement this is monitoring "Service Creation" events (Event ID 7045) to track newly created or modified services which could correlate with unauthorized registry changes.

