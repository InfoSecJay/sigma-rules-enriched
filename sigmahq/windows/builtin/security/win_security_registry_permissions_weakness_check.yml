title: Service Registry Key Read Access Request
id: 11d00fff-5dc3-428c-8184-801f292faec0
status: test
description: |
  Detects "read access" requests on the services registry key.
  Adversaries may execute their own malicious payloads by hijacking the Registry entries used by services.
  Adversaries may use flaws in the permissions for Registry keys related to services to redirect from the originally specified executable to one that they control, in order to launch their own code when a service starts.
references:
- https://center-for-threat-informed-defense.github.io/summiting-the-pyramid/analytics/service_registry_permissions_weakness_check/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.011/T1574.011.md#atomic-test-1---service-registry-permissions-weakness
author: Center for Threat Informed Defense (CTID) Summiting the Pyramid Team
date: 2023-09-28
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.011
logsource:
  product: windows
  service: security
  definition: 'Requirements: SACLs must be enabled for "READ_CONTROL" on the registry
    keys used in this rule'
detection:
  selection:
    EventID: 4663
    ObjectName|contains|all:
    - '\SYSTEM\'
    - 'ControlSet\Services\'
    AccessList|contains: '%%1538'     # READ_CONTROL
  condition: selection
falsepositives:
- Likely from legitimate applications reading their key. Requires heavy tuning
level: low
note: |
  ### Technical Context
  This detection rule identifies instances where "read access" requests are made on specific registry keys associated with Windows services. By leveraging these keys, adversaries aim to manipulate service configurations to execute malicious payloads or redirect execution to unauthorized binaries. This behavior is indicative of a privilege escalation or persistence tactic, as attackers may exploit weak permissions on registry entries to gain control over system services, potentially allowing the launch of malicious code on startup.

  The relevant MITRE ATT&CK tactics and techniques applicable to this rule include **Persistence (T1547)**, as the compromise of service registry entries can lead to an adversary maintaining access over an extended period. Similarly, it falls under **Privilege Escalation (T1574.011)**, where specific registry manipulations can elevate privileges through unauthorized access. The primary data sources necessary for effective detection are Windows security event logs, particularly those capturing registry access attempts (Event ID: 4663), where SACLs must be enabled to capture these events.

  ### Investigation Steps
  - **Review Event Logs:** Examine Event ID 4663 in the Windows Security logs to identify any read access requests targeting service registry keys, noting any user accounts involved and their corresponding permissions.
  - **Correlate with System Changes:** Investigate any recent modifications to service configurations or system behaviors, correlating them with identified read access instances that may indicate an attempt to alter service executions.
  - **Inspect User Permissions:** Analyze the access controls and permissions set on the registry keys used by services to ensure there are no undue privileges granted to user accounts that should have limited access.
  - **Monitor for Malicious Patterns:** Look for patterns or indicators of compromise that may align with known adversary behavior targeting service manipulations, such as the creation of new services or alterations to existing ones.

  ### Prioritization
  Given the potential for these read access requests to facilitate persistence and privilege escalation, alerts generated by this rule should be considered of **low to moderate severity**. While not all triggers indicate malicious intent, multiple alerts could signify coordinated efforts to manipulate service configurations, thus warranting further investigation.

  ### Blind Spots and Assumptions
  This detection logic may have gaps if SACLs are not properly configured on the target registry keys, which affects the ability to capture read access events. Additionally, legitimate service operations may trigger these alerts, as applications may need to read their service configurations. Thus, understanding the context of registry access is crucial. It is assumed that sufficient logging is enabled and that the environment is configured to record these specific security events, which may not be standard in all enterprise setups.

