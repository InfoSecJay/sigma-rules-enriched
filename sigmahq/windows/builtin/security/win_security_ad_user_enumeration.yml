title: Potential AD User Enumeration From Non-Machine Account
id: ab6bffca-beff-4baa-af11-6733f296d57a
status: test
description: Detects read access to a domain user from a non-machine account
references:
- https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf
- http://www.stuffithoughtiknew.com/2019/02/detecting-bloodhound.html
- https://learn.microsoft.com/en-us/windows/win32/adschema/attributes-all     # For further investigation of the accessed properties
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662
author: Maxime Thiebaut (@0xThiebaut)
date: 2020-03-30
modified: 2022-11-08
tags:
- attack.discovery
- attack.t1087.002
logsource:
  product: windows
  service: security
  definition: 'Requirements: The "Read all properties" permission on the user object
    needs to be audited for the "Everyone" principal'
detection:
  selection:
    EventID: 4662
        # Using contains as the data commonly is structured as "%{bf967aba-0de6-11d0-a285-00aa003049e2}"
        # The user class (https://learn.microsoft.com/en-us/windows/win32/adschema/c-user)
    ObjectType|contains: 'bf967aba-0de6-11d0-a285-00aa003049e2'
    AccessMask|endswith:
            # Note: Since the Access Mask can have more than once permission we need to add all permutations that include the READ property
    - '1?'         # This covers all access masks that are 1 bytes or shorter and the "Read Property" itself
    - '3?'         # Read Property + Write Property
    - '4?'         # Read Property + Delete Tree
    - '7?'         # Read Property + Write Property + Delete Tree
    - '9?'         # Read Property + List Object
    - 'B?'         # Read Property + Write Property + List Object
    - 'D?'         # Read Property + Delete Tree + List Object
    - 'F?'         # Covers usage of all possible 2 bytes permissions with any or none of the single byte permissions
  filter_main_machine_accounts:
    SubjectUserName|endswith: '$'     # Exclude machine accounts
  filter_main_msql:
    SubjectUserName|startswith: 'MSOL_'     # https://learn.microsoft.com/en-us/azure/active-directory/hybrid/reference-connect-accounts-permissions#ad-ds-connector-account
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrators configuring new users.
level: medium
note: |
  ### Technical Context

  This rule detects attempts to read access properties of a domain user object by non-machine accounts, which is often indicative of user enumeration techniques utilized by attackers. The primary attacker objective may involve gathering information about user accounts within a domain, potentially to facilitate phishing attempts or privilege escalation. This behavior aligns with the MITRE ATT&CK technique "Account Discovery" (T1087.002).

  The primary telemetry source for this detection is Windows Security Event ID 4662, which logs modifications and accesses to Active Directory objects. If malicious, this behavior can lead to unauthorized information disclosure about account structures, which adversaries can exploit for lateral movement. Importantly, this detection does NOT confirm actual compromise; it merely indicates an attempt to enumerate user accounts.

  ### Investigation Steps

  - **Identify relevant Event ID:** Review the security logs for Event ID 4662, focusing on `AccessMask` and `ObjectType` fields to identify read attempts on user objects from non-machine accounts. Look specifically for records indicating access operations to user objects (`ObjectType` containing 'bf967aba-0de6-11d0-a285-00aa003049e2').

  - **Validate Subject User:** Inspect the `SubjectUserName` field to ensure the account executing the enumeration is not a service or machine account (ending with '$'). Legitimate automation accounts might access this data under appropriate administrative roles; confirm proper usage procedures.

  - **Check for expected system behavior:** Consider typical user account access patterns; benign user enumeration might include authorized administrators checking user permissions or configurations. Compare frequency and contexts with normal operational behavior to assist in assessing severity.

  - **Identify malicious indicators:** Look for multiple accesses from the same non-machine account to AD user properties in a short time span (e.g., consecutive events from a single user within a few minutes). This may indicate a scripted or automated enumeration process.

  - **Cross-examine against known safe configurations:** Review the `AccessMask` used in the logs for any unusual access levels. Legitimate tasks often involve restricted or minimal access configurations; excessive read permissions should be treated as a red flag.

  - **Assess account history:** Query the targeted user account's login history and other activities using Event ID 4624 for unusual access patterns or correlation with the enumeration event, potentially identifying whether a breached account has engaged in reconnaissance.

  ### Prioritization

  The alert severity is medium because while user enumeration can indicate preparatory steps for an attack, not all such activities are indicative of immediate threats. The impact is higher if sensitive accounts are being targeted, and the likelihood of malicious use is moderate as this technique can be commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  This detection may not capture evasion techniques such as the use of legitimate tools by attackers disguised as administrative tasks. Reliable detection requires that AD permissions are accurately audited, particularly the "Read all properties" for user objects. Legitimate configurations, such as bulk user modifications or migrations by administrators, may trigger the alert. A related detection for more comprehensive coverage could include monitoring for logon events (Event ID 4624) from suspicious accounts or on a suspicious timeline.

