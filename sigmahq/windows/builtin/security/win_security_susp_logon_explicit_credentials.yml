title: Suspicious Remote Logon with Explicit Credentials
id: 941e5c45-cda7-4864-8cea-bbb7458d194a
status: test
description: Detects suspicious processes logging on with explicit credentials
references:
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford 
  @svch0st, Tim Shelton
date: 2020-10-05
modified: 2022-08-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.defense-evasion
- attack.t1078
- attack.lateral-movement
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4648
    ProcessName|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\winrs.exe'
    - '\wmic.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\reg.exe'
  filter1:
    TargetServerName: 'localhost'
  filter2:
    SubjectUserName|endswith: '$'
    TargetUserName|endswith: '$'
  condition: selection and not 1 of filter*
falsepositives:
- Administrators that use the RunAS command or scheduled tasks
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where processes on Windows systems are logging in with explicit credentials, specifically using tools commonly associated with administrative tasks, such as `cmd.exe`, `powershell.exe`, and other utilities. The primary goal of an attacker leveraging this behavior is often to move laterally within a network or escalate privileges by executing commands on remote systems while disguising their actions. This activity aligns with the MITRE ATT&CK technique for "Valid Accounts" (T1078) and "Lateral Movement" (T1021).

  The primary telemetry source is the Windows Security Event Log, particularly Event ID 4648, which logs when an account logs on with explicit credentials. If malicious, this behavior could indicate unauthorized access attempts or privilege escalation. However, it is important to note that the presence of such events does not confirm malicious intent since legitimate administrative tasks could also trigger this alert, especially by system administrators using tools like RunAs or scheduled tasks.

  ### Investigation Steps

  - **Check Event ID 4648 logs**: Look for Event ID 4648 in the Security Event Log. Verify the `ProcessName` field matches known utilities used for administrative tasks (e.g., `cmd.exe`, `powershell.exe`). Legitimate usage will show expected administrative activity, while anomalous entries should invoke further scrutiny.

  - **Identify user context**: Investigate the `SubjectUserName` and `TargetUserName` fields. Trusted administrative accounts ending with `$` indicate service accounts. Suspicious accounts or unexpected user names should raise concerns for potential unauthorized access.

  - **Analyze the target system**: Confirm if the `TargetServerName` is `localhost`. If the logon occurs on a remote system, assess the legitimacy of the access request and check for recent changes in user roles or privileges that may justify the behavior.

  - **Monitor for execution of scripts**: Review for simultaneous PowerShell or cmd script execution from Event IDs 4104 (PowerShell) and 4688 (process creation). Scripts run without clear business justification could indicate malicious activity.

  - **Correlate with other logs**: Look for companion events across the SIEM, such as failed logins or unusual account lockout events preceding or following this alert. Multiple unsuccessful login attempts from the same source could indicate an attacker trying different credentials.

  ### Prioritization

  This alert is of medium severity due to the potential impact on system integrity, particularly in enterprise environments where administrative tools are abused for lateral movement or privilege escalation. The likelihood of malicious usage is moderate, as attackers often exploit valid credentials to avoid detection; this behavior is relatively common in targeted intrusions.

  ### Blind Spots and Assumptions

  The detection may miss logged-on activities from legitimate users conducting administrative tasks, especially in environments with frequent remote management. Evasion techniques could include altering process names or using non-standard tools. Essential log sources include Windows Security logs, and to ensure reliable detection, proper log retention settings must be configured. A related detection to consider is monitoring for failed authentication attempts (Event ID 4625), which can provide context for potential unauthorized access attempts preceding this alert.

