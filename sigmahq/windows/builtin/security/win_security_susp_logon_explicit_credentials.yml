title: Suspicious Remote Logon with Explicit Credentials
id: 941e5c45-cda7-4864-8cea-bbb7458d194a
status: test
description: Detects suspicious processes logging on with explicit credentials
references:
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st,
  Tim Shelton
date: 2020-10-05
modified: 2022-08-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.defense-evasion
- attack.t1078
- attack.lateral-movement
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4648
    ProcessName|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\winrs.exe'
    - '\wmic.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\reg.exe'
  filter1:
    TargetServerName: 'localhost'
  filter2:
    SubjectUserName|endswith: '$'
    TargetUserName|endswith: '$'
  condition: selection and not 1 of filter*
falsepositives:
- Administrators that use the RunAS command or scheduled tasks
level: medium
note: |
  ### Technical Context
  This rule detects suspicious remote logon attempts utilizing explicit credentials, specifically targeting events generated when user accounts with administrative privileges log into systems using processes commonly associated with command-line utilities. The primary threat scenario revolves around an attacker attempting to gain unauthorized access to a system by injecting credentials or leveraging features like RunAs to elevate their privileges or perform lateral movements within the environment. Attackers may use this method to circumvent standard authentication mechanisms and gain access to sensitive resources.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (T1078)**: This technique involves the use of valid accounts to gain entry into systems.
  - **Privilege Escalation**: Utilizing processes to enhance permissions and access, often after initial access has been gained.
  - **Lateral Movement**: Moving through a network after gaining initial access using credential theft or exploitation of administrative privileges.
  - **Defense Evasion**: Techniques designed to avoid detection by utilizing explicit credentials and common administrative tools.

  The primary data sources for effective detection of this activity include Windows Security Event Logs, particularly focusing on Event ID 4648 related to logon attempts, process creation logs showing the execution of the aforementioned command-line utilities, and any logs indicating network connections that originate from these sessions.

  ### Investigation Steps
  - **Review Security Event Logs**: Analyze Windows Security Event Logs for Event ID 4648 that correlate with the suspected malicious activities. Pay close attention to the timestamps and correlating user accounts involved.
  - **Examine Process Creation Events**: Investigate process creation logs for unusual use of command-line utilities (e.g., `cmd.exe`, `powershell.exe`) that may suggest malicious intent. Look for patterns indicating that these tools were executed with elevated privileges.
  - **Check Lateral Movement**: Confirm any lateral movement attempts by reviewing logs for connections to other systems using the credentials derived from the initial suspicious activity. Focus on behavioral anomalies in network traffic.
  - **Analyze User Account Activity**: Assess privileged accounts involved in these logons. Specific attention should be paid to accounts ending with `$`, which signify possible service accounts, to determine if they are exhibiting unusual patterns or access.

  ### Prioritization
  This alert is of **medium** severity due to the potential for significant impact if an attacker successfully utilizes explicit credentials to access sensitive systems, thus compromising the integrity of the enterprise environment. The likelihood of occurrence can be high in environments with weak credential management practices or insufficient monitoring.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage where administrative users may legitimately use tools like `RunAs` for routine tasks, potentially leading to false positives. The detection logic assumes that user accounts are properly monitored and that logs for Event ID 4648 and process creation are consistently collected, which may not always be the case in all environments. Variations in system configurations and active directory policies can further affect the comprehensiveness of the detection.

