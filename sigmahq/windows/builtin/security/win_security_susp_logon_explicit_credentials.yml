title: Suspicious Remote Logon with Explicit Credentials
id: 941e5c45-cda7-4864-8cea-bbb7458d194a
status: test
description: Detects suspicious processes logging on with explicit credentials
references:
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford 
  @svch0st, Tim Shelton
date: 2020-10-05
modified: 2022-08-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.stealth
- attack.t1078
- attack.lateral-movement
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4648
    ProcessName|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\winrs.exe'
    - '\wmic.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\reg.exe'
  filter1:
    TargetServerName: 'localhost'
  filter2:
    SubjectUserName|endswith: '$'
    TargetUserName|endswith: '$'
  condition: selection and not 1 of filter*
falsepositives:
- Administrators that use the RunAS command or scheduled tasks
level: medium
note: |
  ### Technical Context

  This rule detects the use of explicit credentials for remote logon attempts, particularly when invoked by command-line tools such as `cmd.exe`, `powershell.exe`, and others. The likely attacker objective is to execute commands on a remote system by impersonating another user, which may indicate lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for valid accounts (T1078) under the privilege escalation and lateral movement tactics.

  Primary telemetry sources include Windows Security logs, specifically Event ID 4648, which logs attempted logons using explicit credentials. If malicious, this activity could lead to unauthorized access or escalation of privileges on critical systems. This detection alone does NOT confirm successful exploitation; it only indicates an attempt that warrants further investigation.

  ### Investigation Steps

  - **Review Event 4648 Details:** Check for Event ID 4648 in Security log. Focus on 'ProcessName' and 'SubjectUserName'. Look for regex matches on `$` to identify potential service accounts being abused.

  - **Analyze Network Activity for Additional Context:** Cross-reference with network monitoring data for unusual traffic patterns around the time of the alert. Look for SMTP, SMB, and RDP traffic logs indicating lateral movement.

  - **Identify Legitimate Usage Patterns:** Investigate the host's recent admin activity for authorized use of credential delegation. Scheduled task execution or service account logins may indicate legitimate use cases if logged in a typical pattern.

  - **Flag Malicious Indicators:** Investigate usage of `cmd.exe`, `powershell.exe`, or `wmic.exe` where 'SubjectUserName' or 'TargetUserName' matches unexpected accounts. Cross-check any of these processes running under non-administrative users as high-confidence malicious indicators.

  - **Check Host Context:** Validate if the alert is triggered on a critical host, such as domain controllers or financial systems, where the impact of access is significantly higher. Review logs for roles like `domain or application server`.

  - **File Integrity Monitoring:** Look for unusual file creation or modification timestamps on sensitive directories and execute a file integrity check. Suspicious scripts or executables may have been staged for execution post-login.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical systems by unauthorized access via explicit credentials. The likelihood of malicious abuse is significant, as attackers often leverage valid credentials for lateral movement within enterprise environments. This behavior is increasingly weaponized in advanced threats.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate admin activities such as using RunAs or scheduled tasks that also generate similar logs. Ensure all necessary security logs are collected and configured for comprehensive visibility, including those from credential managers and endpoint detection tools. Activities like service account usage or automation scripts may also trigger the alert, leading to false positives. A related detection could include monitoring for failed logon attempts (Event ID 4625) to correlate against this alert for identifying brute force or enumeration activity.

