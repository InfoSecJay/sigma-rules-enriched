  ---

  ### Technical Context

  This rule detects modifications to the Windows Defender exclusion registry key, which may suggest an attempt by an attacker to bypass security measures. The likely objective of an adversary in this case would be to disable or exempt certain files or directories from antivirus scanning, making it easier to execute malicious payloads or maintain persistence. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and T1562.001 (Impair Defenses). The primary telemetry sources for this detection are Windows Security Event Logs, particularly focusing on Event ID 4657, which records changes made to the registry.

  If the modification is malicious, it can significantly reduce the effectiveness of the endpoint protection, allowing malware to operate undetected. However, this detection alone does not confirm malicious intent as legitimate administrative actions to create exclusions could also trigger the alert.

  ---

  ### Investigation Steps

  - **Review Registry Change:** Examine Windows Security Event ID 4657 logs. Check the `ObjectName` field for entries containing `\Microsoft\Windows Defender\Exclusions\`. Note the modification time and associated user account. Legitimate administrative changes may correspond with known maintenance windows.

  - **Identify User Context:** Verify the user account linked to the exclusion modification. Legitimate actions usually involve domain admins or designated IT personnel. Any changes made by non-administrative accounts may be suspicious.

  - **Cross-Reference with Process Creation:** Analyze Event ID 4688 to identify any processes that may have spawned around the time of the exclusion change. Look for commonly abused processes, such as PowerShell or CMD, to see if they correlate with the exclusion modification, indicating a potential malicious actor.

  - **Check for Related Registry Modifications:** Look for other registry changes near the timestamp of Event ID 4657 that may indicate a broader pattern of activity. Events that modify security settings or other critical system components in conjunction with the exclusion change could signal malicious intent.

  - **Monitor for Malware Signatures:** Use threat intelligence feeds to check if the files or paths added to the exclusion list are associated with known malware. Artifacts such as file hashes can help identify if the exclusion may be part of a broader compromise.

  - **Validate Alert Frequency:** Review past alerts triggered by similar changes. High-frequency modifications may indicate ongoing adversary activity. Consider if any changes were made close together to points that align with known attack patterns.

  ---

  ### Prioritization

  This alert is considered medium severity due to its potential impact on endpoint security. While modifications to exclusion lists are not uncommon in enterprise environments, the behavior is commonly weaponized by adversaries to evade detection. The likelihood of this being a malicious action increases, especially if performed by a non-privileged account.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded if attackers employ techniques that don't involve registry changes, such as directly manipulating the Windows Defender service in memory. The effectiveness of the alert relies on properly configured audit policies for registry access. Legitimate activities could include updates by system administrators for necessary exclusions that coincide with software deployments. Companion detections include monitoring for abnormal process creations or file modifications, which could provide additional context around the exclusion changes.

