    # Don't forget to add it to the condition section below
    # filter:
        # SubjectUserName: "%name%"
  condition: selection
falsepositives:
- Modifications in the msDS-KeyCredentialLink attribute can be done legitimately
  by the Azure AD Connect synchronization account or the ADFS service account. 
  These accounts can be added as Exceptions. (From elastic FP section)
level: high
note: |
  ### Technical Context

  The rule detects the addition of shadow credentials to an Active Directory (AD) object by monitoring changes to the `msDS-KeyCredentialLink` attribute. This behavior is indicative of an attacker attempting to establish persistence within a network, potentially allowing unauthorized access without relying on valid credentials, aligning with MITRE ATT&CK techniques such as Persistence (T1546) and Credential Access (T1556). The primary telemetry source for detection includes Windows Security Event logs, specifically targeting Event ID 5136, which logs changes to AD objects. If malicious, this could severely compromise the security of the network, enabling an attacker to maintain access even after traditional credentials have been revoked. It is important to note that this detection alone does not prove malicious intent; legitimate administrative actions may also result in similar log entries.

  ### Investigation Steps

  - **Examine the event detail for specific attributes:** Review event ID 5136 to identify if the `msDS-KeyCredentialLink` attribute was modified. Check the "Attribute LDAP Display Name" and "Subject User Name" fields. Legitimate modifications often originate from Azure AD Connect or ADFS accounts.

  - **Analyze user account context:** Validate if the changes were made by known administrative accounts or service accounts like Azure AD Connect. Legitimate activity from these accounts should align with scheduled updates or maintenance tasks.

  - **Check for sudden changes in account behavior:** Look for any unconventional patterns prior to the event, such as sudden privilege escalations or access from unusual locations. Use Event ID 4624 (Logon) to assess user login patterns against baselines.

  - **Investigate related object changes:** Review associated modifications around the same time, focusing on Event IDs 5137 (object created) or 5141 (deleted) targeting the same user or group. Correlating multiple events can strengthen the case for potential malicious intent.

  - **Identify high-confidence malicious indicators:** Seek for occurrences of the `msDS-KeyCredentialLink` changes by non-standard accounts or during non-business hours. Flag accounts without a typical administrative role as suspicious.

  - **Document legitimate usage cases:** Note any instances where `msDS-KeyCredentialLink` updates align with organizational processes such as AD synchronization or third-party applications, documenting the expected behaviors to decrease false positives.

  ### Prioritization

  The alert severity is high, given that it involves changes to critical AD objects, which could facilitate prolonged unauthorized access if exploited. The likelihood of this behavior being weaponized is significant, particularly for targeted attacks that aim to maintain persistence post-compromise.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate operations performed by service accounts like Azure AD Connect, which must be accounted for in policy configurations. Reliance on the Audit Directory Service Changes log is necessary, and if not enabled, vital detection gaps may arise. Additionally, legitimate administrative activities, such as routine updates or synchronization processes, may trigger this alert. Implementing companion detections, such as monitoring for unusual Service Account activity or tracking specific `msDS-KeyCredentialLink` related actions, can enhance comprehensive monitoring and response capabilities.

