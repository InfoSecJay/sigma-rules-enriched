    # filter:
        # SubjectUserName: "%name%"
  condition: selection
falsepositives:
- Modifications in the msDS-KeyCredentialLink attribute can be done legitimately
  by the Azure AD Connect synchronization account or the ADFS service account. 
  These accounts can be added as Exceptions. (From elastic FP section)
level: high
note: |
  ### Technical Context

  This Sigma rule detects the addition of shadow credentials (specifically, modifications to the `msDS-KeyCredentialLink` attribute) to Active Directory objects. This behavior is typically associated with an attacker seeking to maintain access to a target environment by creating alternate authentication methods, potentially without detection. This detection aligns with the MITRE ATT&CK technique for persistence (T1556) and credential access.

  The primary telemetry source is Windows Security Event logging, specifically Audit Directory Service Changes, which requires the corresponding SACL configuration to generate relevant events (Event IDs 5136). If malicious, this behavior could enable adversaries to gain unauthorized access, potentially compromising the integrity of the Active Directory environment. Importantly, the detection of this rule does not confirm malicious intent on its own; legitimate accounts such as Azure AD Connect or ADFS service accounts may also perform these modifications.

  ### Investigation Steps

  - **Examine Event ID 5136 logs**: Review Security Event logs for Event ID 5136, specifically looking for modifications to the `msDS-KeyCredentialLink` attribute in Active Directory objects. Focus on the `AttributeLDAPDisplayName` field to confirm the change.

  - **Identify the modifying user account**: Check the `SubjectUserName` field in the relevant logs to determine the account that made the change. Cross-reference this account with known service accounts (e.g., Azure AD Connect, ADFS) to rule out benign modifications.

  - **Assess recent changes in Active Directory**: Investigate the timeframe around the alert for other related LDAP modification events (Event IDs 5137, 5138, 5139, 5141) to establish context, evaluating if there are patterns of activity consistent with potential credential manipulation.

  - **Review account roles and activity**: Validate the legitimacy of the modifying account's role by examining its activity logs and responsibilities. Ensure that its actions align with expected behaviors; for example, service accounts typically perform scheduled synchronization without frequent modifications.

  - **Look for additional anomalies**: Conduct a broader search for unusual behaviors associated with the affected Active Directory object, such as unauthorized access attempts, account lockouts, or changes in group memberships.

  - **Check for existing defense mechanisms**: Validate if the SACLs are properly configured to log necessary changes for the relevant objects. Also, check for any existing exceptions that might be applied to logging for certain accounts, preventing alerts.

  ### Prioritization

  Given the potential for significant impact on the integrity and security of the Active Directory environment, this alert should be treated with high priority. The likelihood of malicious exploitation is considerable, especially since shadow credentials are often weaponized by various threat actors for persistent access.

  ### Blind Spots and Assumptions

  The rule may have limitations due to potential evasion techniques, where attackers may disable auditing or attempt to modify attributes without triggering logging. Reliable detection requires that the "Audit Directory Service Changes" policy is correctly configured for the involved objects. Legitimate modifications by service accounts may trigger this alert, necessitating careful validation of user accounts involved. Additional coverage can be strengthened by deploying or reviewing alerts related to account abuse or unusual access patterns in conjunction with this detection.

