  condition: selection
falsepositives:
- Modifications in the msDS-KeyCredentialLink attribute can be done legitimately by
  the Azure AD Connect synchronization account or the ADFS service account. These
  accounts can be added as Exceptions. (From elastic FP section)
level: high
note: |
  ### Technical Context
  This rule detects potential addition of shadow credentials to an Active Directory (AD) object, which may indicate malicious actor activity aimed at maintaining persistence within a network. Shadow credentials refer to unauthorized credentials added to a user object, often enabling the attacker to access services without detection. Typically, an attacker aims to exploit weaknesses in authentication and access controls to further their objectives, which can include lateral movement, privilege escalation, and data exfiltration.

  Relevant MITRE ATT&CK tactics and techniques impacted by this detection include:
  - **Persistence** (T1547): Maintaining foothold in the network.
  - **Defense Evasion** (T1070): Hiding the presence of malicious activities.
  - **Credential Access** (T1556): Collecting or creating unauthorized access credentials.

  To provide effective detection coverage, monitoring should center around security logs, specifically those capturing changes to directory service objects. The primary data sources for this rule will include Windows Security event logs, particularly those associated with Active Directory changes, such as Event ID 5136, which logs updates to AD objects.

  ### Investigation Steps
  - **Review Security Logs**: Examine Windows Security event logs for Event ID 5136, which indicates a change to Directory Services, focusing on actions taken against the `msDS-KeyCredentialLink` attribute.
  - **Correlate with User Activity**: Analyze the user accounts making these modifications and correlate their actions with other endpoint and network activity to identify any suspicious behavior or unusual access patterns.
  - **Check for Service Accounts**: Determine if changes were made by known service accounts such as Azure AD Connect or ADFS, which may be legitimate creators of shadow credentials. Verification against a maintained whitelist is essential to minimize false positives.
  - **Investigate Network Connections**: Monitor for any anomalous connections from the modified accounts to other network resources, particularly focusing on unusual authentication attempts or claims to services.

  ### Prioritization
  The alert is classified as high severity due to the potential risk associated with unauthorized credential modifications in Active Directory, which could lead to undetected access and control over sensitive resources, making it attractive to malicious actors.

  ### Blind Spots and Assumptions
  There are potential gaps in coverage, particularly if the auditing policy for directory service changes is not properly configured. This detection mechanism assumes that Event ID 5136 is logged for the objects of interest, which may not occur if policies are incomplete. Additionally, the authenticity of activity from known service accounts is accepted, which could lead to missed detections if those accounts are compromised. Proper configuration of the Audit Directory Service Changes policy, including the necessary SACLs, is critical for this alert's effectiveness.

