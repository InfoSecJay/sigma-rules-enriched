logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be 
    enabled to log the EID 4697
detection:
  selection:
    EventID: 4697
    ServiceFileName|re: '^%systemroot%\\[a-zA-Z]{8}\.exe$'
    ServiceName|re: '(^[a-zA-Z]{4}$)|(^[a-zA-Z]{8}$)|(^[a-zA-Z]{16}$)'
    ServiceStartType: 3      # on-demand start, see https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4697
    ServiceType: '0x10'
  filter:
    ServiceName: 'PSEXESVC'
  condition: selection and not filter
falsepositives:
- Possible, different agents with a 8 character binary and a 4, 8 or 16 
  character service name
level: high
note: |
  ### Technical Context

  This rule detects the installation of services using Metasploit's SMB PsExec and Impacket's psexec.py by monitoring for specific Windows Event ID 4697 logs, which indicate a new service has been created. The likely attacker objective is to establish persistence on a target system by creating a service that can be initiated on-demand, thus facilitating further malicious actions without user intervention. This detection correlates with the MITRE ATT&CK tactic "Lateral Movement" (TA0008) and the technique "Remote Service Staging" (T1021.002). The primary telemetry source for this detection is Windows Security logs, specifically Event ID 4697, which captures the creation of a new service. If malicious, this activity may lead to unauthorized access or control over the target system. However, this detection does NOT confirm that the installed service is indeed used for malicious purposes without further context about the behavior of the service.

  ### Investigation Steps

  - **Review Event ID 4697 logs:**
    Check for Event ID 4697 entries in the Windows Security logs for service installations on the affected host. Look specifically for services with executable names matching the regex '^%systemroot%\\[a-zA-Z]{8}\.exe$' and service names conforming to the patterns defined in the detection (4, 8, or 16 character lengths).

  - **Identify the service executable:**
    Investigate the path and the hash of the executable file associated with the service (ServiceFileName). Malicious indicators often show executable filenames that do not correspond to known legitimate applications. Validate whether the file is present on disk using forensic tools or file system browsing.

  - **Assess the service configuration:**
    Analyze the service configuration to confirm its settings (ServiceStartType and ServiceType). A legitimate service typically has clear naming conventions and documented purposes. Look for services with unusual names like 'PSEXESVC' which correlate to known malicious tools.

  - **Cross-reference with known legitimate services:**
    Compare discovered services with documented legitimate software that may also install services using similar naming conventions or length. Look for internal or commonly used software that aligns with identified service characteristics.

  - **Capture additional context:**
    Utilize Sysmon logs (Event ID 1) to correlate process creation related to the service installation. Look for any process execution that coincides with the time of service installation, which might indicate whether the activity originated from a legitimate or unauthorized user context.

  - **Evaluate host criticality:**
    Determine the role and criticality of the affected host. Lateral movement activities on domain controllers or servers handling sensitive data represent a higher risk than on less critical systems, warranting expedited investigation and mitigation actions.

  ### Prioritization

  This alert carries a high severity in an enterprise context due to the potential for escalation of privileges through unauthorized service installations, particularly if they are on critical infrastructure or user systems. The likelihood of malicious abuse is considerable, as tools like Metasploit and Impacket are commonly used by adversaries for lateral movement. This behavior indicates a pattern of exploitation often seen in various compromise scenarios.

  ### Blind Spots and Assumptions

  Detection can be limited if proper logging configurations are not enabled, particularly the 'System Security Extension' audit subcategory for Event ID 4697. Adversaries may employ renaming tactics or use less obvious service names to evade detection. Legitimate activities that may trigger the alert could include service installations by authorized patch or update mechanisms. A related detection to consider is monitoring for unusual process behavior associated with newly created services (e.g., exploitation via Event ID 4688 for process creation) to strengthen coverage against evasion tactics.

