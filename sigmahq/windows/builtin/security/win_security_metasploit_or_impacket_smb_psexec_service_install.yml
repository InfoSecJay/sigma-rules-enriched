title: Metasploit Or Impacket Service Installation Via SMB PsExec
id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
related:
- id: 1a17ce75-ff0d-4f02-9709-2b7bb5618cf0
  type: derived
status: test
description: Detects usage of Metasploit SMB PsExec (exploit/windows/smb/psexec) and
  Impacket psexec.py by triggering on specific service installation
references:
- https://bczyz1.github.io/2021/01/30/psexec.html
author: Bartlomiej Czyz, Relativity
date: 2021-01-21
modified: 2022-10-05
tags:
- attack.lateral-movement
- attack.t1021.002
- attack.t1570
- attack.execution
- attack.t1569.002
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection:
    EventID: 4697
    ServiceFileName|re: '^%systemroot%\\[a-zA-Z]{8}\.exe$'
    ServiceName|re: '(^[a-zA-Z]{4}$)|(^[a-zA-Z]{8}$)|(^[a-zA-Z]{16}$)'
    ServiceStartType: 3      # on-demand start, see https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4697
    ServiceType: '0x10'
  filter:
    ServiceName: 'PSEXESVC'
  condition: selection and not filter
falsepositives:
- Possible, different agents with a 8 character binary and a 4, 8 or 16 character
  service name
level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of services via SMB using the Metasploit framework's PsExec and Impacket tools. Cyber attackers frequently leverage these tools to execute code on remote systems without needing to log in directly, which can facilitate lateral movement within a network. An attacker may exploit vulnerabilities or misconfigurations to deploy malicious software such as ransomware or remote access trojans, leading to significant risks like data theft and system compromise.

  The relevant MITRE ATT&CK tactics and techniques include Lateral Movement (T1021.002) and Execution (T1570) as attackers seek to gain access to additional systems by using Remote Service Execution methods. This detection will primarily utilize Windows Security event logs, specifically Event ID 4697, which records service installations, including details regarding the service name and file path.

  Key telemetry sources include:
  - Windows Security logs capturing Event ID 4697.
  - Any endpoint detection and response (EDR) tools monitoring process creations and network interactions.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Security logs for Event ID 4697, specifically focusing on the ServiceFileName, ServiceName, and ServiceStartType of the entries corresponding to suspicious activity.
  - **Correlate with Process Logs**: Cross-reference with process creation logs to identify any unexpected parent-child relationships that could indicate malicious execution flow from the service installation.
  - **Analyze Network Traffic**: Inspect network logs for SMB connections that may correlate with the timing of the detected service installations, providing context regarding the access points used by the attacker.
  - **Assess System Integrity**: Conduct a review of the affected system’s services to identify any other unusual or unauthorized services alongside the detected PSEXESVC to establish the full scope of potential compromise.

  ### Prioritization
  The alert is classified as high severity due to the critical risk posed by remote service execution tools like PsExec, which are commonly used in post-exploitation scenarios to compromise additional systems and spread throughout the environment.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of service installations as it is specific to those that match defined naming patterns and service types. There may be legitimate applications that also use similar service naming conventions, leading to possible false positives. The detection relies on the configuration of Windows Security auditing being appropriately set to log Event ID 4697, and any failure in logging could result in significant gaps in visibility. Tools or configurations that could obfuscate the service installation process or change the standard service names might go undetected by this rule.

