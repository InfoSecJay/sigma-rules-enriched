title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2026-03-29
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\ShellHost.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\System32\wimserv.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procmon.exe'
    - '\procmon64.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, 
  Sysinternals, CPU-Z, AVs etc. A baseline needs to be created according to the 
  used products and allowed tools. A good thing to do is to try and exclude 
  users who are allowed to load drivers.
level: medium
note: |
  ### Technical Context

  This rule detects the use of the 'SeLoadDriverPrivilege', which allows a user to load or unload device drivers. Such actions could be taken by adversaries attempting to install malicious drivers to gain kernel-level control over a system, potentially facilitating persistence, data exfiltration, or additional exploitation techniques. The primary relevant MITRE ATT&CK technique this aligns with is **Defense Evasion (T1212)**, as loading unauthorized drivers can hide malicious activities from security monitoring solutions.

  The primary telemetry source for detection is Windows Security Event ID **4673**, which logs privileged service operations. If malicious, the security impact includes unauthorized access to kernel functions, leading to system compromise and potential data leaks. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications or administrators may also trigger this alert.

  ### Investigation Steps

  - **Verify Event Details**: Review Security Event ID **4673** for the relevant fields including `SubjectUserName`, `ObjectType`, and `PrivilegeList`. Look for non-administrative user accounts, which may indicate unauthorized behavior.

  - **Correlate User Activity**: Check the user's activity around the time of the event using relevant log sources (Event ID **4624** for logon events). Confirm if the user has a legitimate reason for loading drivers or if they are unprivileged.

  - **Identify Malicious Indicators**: Investigate the **ProcessName** field for entries that should not be loading drivers (e.g., those not whitelisted such as `C:\Program Files (x86)\Dropbox\Dropbox.exe`). Unrecognized or unusual executable paths may indicate malicious behavior.

  - **Baseline Legitimate Behavior**: Review the historical usage of driver load operations within your environment, focusing on normal processes for authorized users or applications known to load drivers (e.g., trusted antivirus software). Compare to current alerts for anomalies.

  - **Examine Related  Sysinternals Tool Usage**: Look for the use of known tools like `procexp.exe` or `procmon.exe` in the timeline of events. If detected, correlate their invocation with the events logged by ID 4673 for context.

  - **Review Kernel Driver Loading Frequency**: Analyze Windows System or Application logs for patterns or spikes in driver loading activities. Frequent or unexpected driver load events could signal an attack or compromised host.

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on system integrity and security. While not common in routine operations, the misuse of kernel driver loading privileges is a known tactic employed by advanced adversaries to establish control over compromised systems.

  ### Blind Spots and Assumptions

  This detection may be bypassed by legitimate applications that also load drivers, such as certain management tools or antivirus solutions. An effective baseline of expected activities from trusted entities is crucial to limit false positives. Regular auditing and updating of the whitelists for drivers and applications that legitimately utilize this privilege is necessary. Additionally, a related detection for **Service Creation (T1543)** may aid in identifying other potential malicious actions correlating with driver load events.

