title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2026-06-29
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\ShellHost.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\System32\wimserv.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\procmon.exe'
    - '\procmon64.exe'
    - '\procmon64a.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, 
  Sysinternals, CPU-Z, AVs etc. A baseline needs to be created according to the 
  used products and allowed tools. A good thing to do is to try and exclude 
  users who are allowed to load drivers.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the 'SeLoadDriverPrivilege,' which allows a user or process to load or unload kernel-level device drivers. The likely objective of an attacker utilizing this privilege is to install malicious drivers for persistence, privilege escalation, or control over the system. This detection aligns with MITRE ATT&CK tactic **Defense Evasion** and technique **T1685: Driver Load Data Manipulation**. The primary telemetry source is Windows Security Event logs, specifically focusing on Event ID **4673** where this privilege is activated. If the behavior is malicious, it may lead to significant security impacts, including system compromise and unauthorized access to sensitive data. It is crucial to note that this detection does NOT confirm malicious activity on its own, as benign use by legitimate applications or administrative actions could also trigger the alert.

  ### Investigation Steps

  - **Check Event ID 4673 logs for privilege usage**: Review Security Event logs filtering on Event ID **4673** for entries where **PrivilegeList** includes 'SeLoadDriverPrivilege'. Look for unusual user accounts or processes invoking this privilege that are not in your whitelist.

  - **Identify the invoking process**: Analyze the **ProcessName** field in the Event ID 4673 log entries. Compare the process names against a known whitelist. For instance, entries involving processes such as `C:\Program Files (x86)\Dropbox\Dropbox.exe` or `C:\Windows\System32\svchost.exe` may be legitimate if they are known in your environment.

  - **Correlate with other security events**: Cross-reference the findings with other relevant events, such as process creation events (Event ID **4688**) to examine what processes were active around the same time the privilege was invoked. Look for suspicious parent process relationships.

  - **Look for unauthorized driver installations**: Investigate the output of kernel drivers by checking the output of command line tools like `driverquery` or similar administrative commands to see if new, unauthorized drivers are listed post-alert.

  - **Run baseline comparisons**: Compare current activity against established baselines of application behavior within your environment. Legitimate programs should not frequently load drivers unless specifically required for functionality.

  - **Assess risk based on asset criticality**: Consider the role of the asset reporting the alert. High-value systems (e.g., domain controllers, systems with sensitive data) should be prioritized for deeper investigation compared to lower-criticality systems.

  ### Prioritization

  Given that loading malicious drivers can lead to complete system compromise and unauthorized access, the alert carries a medium severity. The potential impact on critical systems raises the likelihood of malicious abuse, especially as such behavior is often used by sophisticated adversaries to bypass defenses.

  ### Blind Spots and Assumptions

  There are limitations with this detection; legitimate programs frequently load drivers and may trigger alerts. Tools such as Sysinternals and various legitimate AV solutions can utilize this privilege appropriately. Ensure comprehensive logging is enabled for Event ID **4673** and similar IDs for accurate detection. Additionally, be aware that users from the security team or administrators may regularly employ driver loading without malicious intent. A related detection to enhance coverage is monitoring for unusual process injection attempts (e.g., **T1055: Process Injection**).

