title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2026-03-29
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\ShellHost.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\System32\wimserv.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procmon.exe'
    - '\procmon64.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, 
  Sysinternals, CPU-Z, AVs etc. A baseline needs to be created according to the 
  used products and allowed tools. A good thing to do is to try and exclude 
  users who are allowed to load drivers.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the 'SeLoadDriverPrivilege', which allows users to load or unload device drivers in kernel mode. Attackers may leverage this privilege to deploy malicious kernel drivers for persistence or to manipulate system functionality, thereby gaining elevated control over the affected system. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562.001) as the attackers may seek to avoid detection while executing their payloads.

  The primary telemetry source is Windows Security logs, specifically Event ID 4673, which logs instances where the SeLoadDriverPrivilege is utilized. If executed by unauthorized or unexpected processes, this behavior poses significant security risks, potentially leading to system compromise or evasion of security mechanisms. This detection does NOT confirm malicious activity on its own; legitimate applications and users may also legitimately utilize this privilege.

  ### Investigation Steps

  - **Investigate the source of Event ID 4673:** Review the log entries for Event ID 4673 to identify the user and process name making the request. Focus on processes not included in the exemption filters, noting any unexpected activity.

  - **Check process hierarchy:** Utilize Sysinternals tools, such as Process Explorer, to check the parent-child relationship for the identified processes. Confirm if the parent process is a known or expected application. Legitimate entries typically originate from system processes or well-established applications.

  - **Assess associated DLLs:** Investigate the loaded modules for the identified process using Sysinternals' Process Explorer or similar tools. Look for any unsigned or unrelated DLLs that correspond with the event's timestamp to identify potential malicious activities.

  - **Correlate with additional logs:** Examine other security events around the same time frame, such as Event ID 4688 for process creation, which can show if the triggering process itself was launched maliciously. It helps correlate behavior indicating a broader pattern of suspicious activity.

  - **Understand established baselines:** Review the baseline of approved tools and applications that your organization regularly uses. Document any legitimate drivers or applications that utilize this privilege. This understanding is critical to distinguish between benign and malicious activity.

  - **Look for known unauthorized tools:** Search for the execution of processes like 'procexp.exe' or 'procmon.exe' in conjunction with event logs. If these processes are involved, ensure they are part of a legitimate investigation; otherwise, they could signal an attempt to obscure malicious activities.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on system integrity and confidentiality if a malicious actor successfully loads a driver. The likelihood of abuse is moderate, as attack techniques involving driver manipulation are known and periodically weaponized in attacks. Prompt investigation is crucial as undetected malicious drivers can lead to severe security breaches.

  ### Blind Spots and Assumptions

  The detection is limited by the possibility of legitimate tools that also require SeLoadDriverPrivilege, such as antivirus or system management tools, which may trigger false positives. Comprehensive logging configurations for security event auditing are essential, including regular monitoring of security logs and ensuring consistent coverage across all endpoint systems. Additionally, legitimate usage of related tools can generate alerts, emphasizing the need for clear baselines for acceptable activity. A related detection like monitoring for new or unusual driver installations can enhance coverage and mitigate blind spots.

