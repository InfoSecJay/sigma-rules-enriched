title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\wimserv.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\explorer.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, Sysinternals,
  CPU-Z, AVs etc. A baseline needs to be created according to the used products and
  allowed tools. A good thing to do is to try and exclude users who are allowed to
  load drivers.
level: medium
note: |
  ### Technical Context
  This detection rule identifies events where a user or process invokes the `SeLoadDriverPrivilege`, which is essential for loading or unloading device drivers in Windows operating systems. The detection is geared towards identifying potentially malicious activities where unauthorized users or processes attempt to manipulate system-level drivers, which could be indicative of kernel-level ransomware, rootkits, or other forms of advanced malware. Attackers may seek to gain control over the operating system or disable security mechanisms by loading malicious drivers.

  The primary MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion (T1562.001)**, as attackers may use this technique to bypass security controls by loading rogue drivers during an attack. The rule is particularly relevant when legitimate administrative users and processes are excluded from consideration, thus highlighting potential misuse of privileges.

  The best sources of telemetry for supporting this detection include Windows security event logs capturing event ID **4673**, which detail instances where the `SeLoadDriverPrivilege` is used. Additional context can be gathered from process creation events to identify which specific applications or users are attempting to load drivers.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security logs for event ID **4673** to identify occurrences of `SeLoadDriverPrivilege` being used. Look for any associated user accounts or processes that triggered these events.

  - **Correlate Process Activity**: Analyze process creation logs to correlate the activity of the processes listed in the rule with `SeLoadDriverPrivilege` usage. Focus on identifying any unusual parent-child relationships or atypical execution patterns.

  - **Examine Driver Loading**: Investigate which drivers were loaded or unloaded at the time of the detected privilege usage. This information may provide insights into whether a malicious driver was involved or if legitimate administrative actions were misclassified.

  - **Conduct Whitelist Review**: Establish and review a whitelist of legitimate applications that require the `SeLoadDriverPrivilege`, and cross-reference against the alert outputs. Assess if any flagged processes can be categorized under known trusted applications to reduce false positives.

  ### Prioritization
  Given the high stakes involved with kernel-level control and the potential impact of malicious driver loading on system integrity and security, alerts triggered by this rule should be considered medium severity. This reflects both the impact of potential exploitation and the likelihood of encountering techniques focused on evading security measures.

  ### Blind Spots and Assumptions
  Detection coverage is limited by the reliance on Windows security event logging and may miss driver load events generated by non-Windows systems or third-party logging solutions. The detection logic assumes that typical administrative users and legitimate processes have been properly identified and excluded; hence, any changes in privileges could lead to gaps. Additionally, this rule requires that security auditing policies for driver loading events (event ID **4673**) be enabled on monitored systems to function effectively.

