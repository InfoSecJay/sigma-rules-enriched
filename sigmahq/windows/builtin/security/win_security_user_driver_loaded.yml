title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\wimserv.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\explorer.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, Sysinternals,
  CPU-Z, AVs etc. A baseline needs to be created according to the used products and
  allowed tools. A good thing to do is to try and exclude users who are allowed to
  load drivers.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the 'SeLoadDriverPrivilege', which enables a user to load or unload device drivers into kernel mode. Malicious actors may attempt to exploit this privilege to introduce unauthorized kernel drivers, potentially leading to persistent malware, privilege escalation, or evasion of security defenses. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001) as attackers often leverage driver loading to conceal their activities from detection. The primary telemetry source for this detection is Security Event ID 4673, which logs attempts to use specific privileges. If malicious, the security impact could be significant, as it could lead to system compromise or data exfiltration. Importantly, this detection does not confirm that the detected activity is inherently malicious, as legitimate applications and administrative actions may also trigger this event.

  ---

  ### Investigation Steps

  - **Review Security Event ID 4673:** Check for any instances of Event ID 4673 related to the usage of 'SeLoadDriverPrivilege' in Windows Security logs. Focus on the 'Account' field to identify the user who triggered the event and verify if they have the appropriate administrative role.

  - **Validate Process Execution:** Investigate the 'ProcessName' field from the same event. Look specifically for common legitimate processes like 'C:\Windows\System32\rundll32.exe' or 'C:\Windows\System32\Dism.exe' which are expected. Presence of unexpected processes or unusual paths (e.g., processes from user profile directories) should raise concern.

  - **Cross-reference against Whitelisted Tools:** Check the source of the triggering process against an established whitelist of tools (e.g., Sysinternals' sysmon.exe, procmon.exe). Verify if the executing process corresponds with known legitimate usage or if it raises flags.

  - **Monitor Parent and Child Processes:** Analyze the parent-child relationships of the identified processes using Sysmon Event ID 1. Identify any suspicious parent process that initiated the action, particularly if it's linked to non-administrative activities.

  - **Identify Context of Use:** Clarify the context of the use of 'SeLoadDriverPrivilege' through additional logs. Check system logs like Application or System Event logs around the timeframe of the event for any context (e.g., driver installations, system updates) that could indicate legitimate activity.

  - **Correlate with Network Activity:** Investigate any outgoing connections or communications from the system around the alert timeframe, using network logs such as firewall logs or proxy logs. Look for abnormal patterns indicating data exfiltration or command and control communication.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems that utilize driver loading. The likelihood of malicious abuse is moderate, particularly in environments where non-privileged users can trigger this behavior. As such, attention is warranted, but contextual investigation is necessary to discern between false positives and actual threats.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by administrative activities and valid tools (e.g., AV software) loading legitimate drivers, making it essential to establish baseline behaviors for organizations. Additionally, reliance on Security Event ID 4673 may miss other relevant activities if logging is not properly configured or not enabled for relevant user actions. It's advisable to pair this detection with alerts for other types of privilege escalation attempts (e.g., suspicious use of 'SeDebugPrivilege') to enhance overall coverage.

