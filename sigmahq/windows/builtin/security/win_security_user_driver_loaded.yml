title: Potential Privileged System Service Operation - SeLoadDriverPrivilege
id: f63508a0-c809-4435-b3be-ed819394d612
status: test
description: |
  Detects the usage of the 'SeLoadDriverPrivilege' privilege. This privilege is required to load or unload a device driver.
  With this privilege, the user can dynamically load and unload device drivers or other code in to kernel mode.
  This user right does not apply to Plug and Play device drivers.
  If you exclude privileged users/admins and processes, which are allowed to do so, you are maybe left with bad programs trying to load malicious kernel drivers.
  This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs) and the usage of Sysinternals and various other tools. So you have to work with a whitelist to find the bad stuff.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4673
    PrivilegeList: 'SeLoadDriverPrivilege'
    Service: '-'
  filter_main_exact:
    ProcessName:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\rundll32.exe'
    - 'C:\Windows\System32\fltMC.exe'
    - 'C:\Windows\HelpPane.exe'
    - 'C:\Windows\System32\mmc.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\wimserv.exe'
    - 'C:\Windows\System32\RuntimeBroker.exe'
    - 'C:\Windows\System32\SystemSettingsBroker.exe'
    - 'C:\Windows\explorer.exe'
  filter_optional_others:
    ProcessName|endswith:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_main_startswith:
    ProcessName|startswith: 'C:\Program Files\WindowsApps\Microsoft'
  filter_optional_dropbox:
    ProcessName|startswith:
    - 'C:\Program Files (x86)\Dropbox\'
    - 'C:\Program Files\Dropbox\'
    ProcessName|endswith: '\Dropbox.exe'
  condition: selection_1 and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Other legimate tools loading drivers. Including but not limited to, 
  Sysinternals, CPU-Z, AVs etc. A baseline needs to be created according to the 
  used products and allowed tools. A good thing to do is to try and exclude 
  users who are allowed to load drivers.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the usage of the 'SeLoadDriverPrivilege' privilege, which permits the loading and unloading of device drivers in kernel mode. Attackers may leverage this privilege to install malicious kernel drivers, enabling persistent access or other malicious functionalities at a low system level. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically utilizing the technique **T1562.001: Impair Defenses** to manipulate system behavior. Primary telemetry sources include Windows Security logs, particularly **EventID 4673**, which logs privilege use. If malicious, this activity could lead to significant security breaches, potentially compromising system integrity. Notably, this detection alone does not confirm malicious intent; legitimate applications may also require this privilege.

  ### Investigation Steps

  - **Review the triggering event:** Check Windows Security logs for **Event ID 4673** concerning 'SeLoadDriverPrivilege' usage. Focus on the user account executing this event to determine if it's a known administrative account or a standard user.

  - **Validate process legitimacy:** Cross-reference the **ProcessName** with malicious threat intelligence indicators. Look for any processes that are not typically associated with system management or known legitimate applications, such as *Dism.exe* or *mmc.exe*.

  - **Examine usage context:** Determine if the event occurred during normal system operation hours versus anomalous times. Check for related events (e.g., **Event ID 4688**, which logs process creation) to analyze the execution context of the processes that triggered the alert.

  - **Identify benign behavior:** Document expected uses of 'SeLoadDriverPrivilege' by trusted applications within your environment, such as certain legitimate system or maintenance applications. Compare any alerts against this baseline to help identify false positives.

  - **Collect additional telemetry:** Review local file paths for any newly created files related to the triggering process to check for suspicious kernel driver installations. Investigate log locations typically used for driver installations, such as `C:\Windows\System32\drivers`.

  - **Correlate with installed software:** Generate a list of currently installed drivers using **Driverquery** or a similar command to assess if any newly installed drivers correspond with the alert. Investigate recent changes in system configurations, especially from high-privilege accounts.

  ### Prioritization

  This alert has medium severity because it indicates possible privileged activity that could lead to serious system compromises if exploited. The likelihood of malicious use exists, given that non-administrative accounts executing such operations are generally rare. The usage of kernel driver loading privileges is a known technique leveraged by advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion by sophisticated malware that uses legitimate tools to perform kernel manipulations. Reliable detection depends on capturing **Event ID 4673** consistently across all endpoints; ensure sufficient logging configuration is in place. Legitimate activities, such as the use of Sysinternals tools, may trigger the alert, necessitating the establishment of a comprehensive whitelist. A related detection that could strengthen coverage is monitoring the creation of kernel-mode driver files, which should generally be limited to trusted updates or installations.

