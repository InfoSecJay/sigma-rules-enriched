level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of newly observed remote named pipes, specifically targeting IPC$ (Inter-Process Communication) pipes. The likely attacker objective is to perform lateral movement or remote execution by utilizing these remote named pipes. This behavior is indicative of the MITRE ATT&CK technique for Lateral Movement via Remote Services (T1021.002). Primary telemetry sources include Windows Security logs with Event ID 5145, which track access to shared resources. If utilized maliciously, this behavior can lead to unauthorized access and potential system compromise. Importantly, this detection does NOT confirm an ongoing attack; it only identifies newly accessed remote named pipes that may warrant further investigation.

  ### Investigation Steps

  - **Review Event ID 5145 logs**: Check for entries that indicate access to `\\*\IPC$` in Windows Security logs. Look for the `RelativeTargetName` field to see if it matches any known legitimate named pipes (e.g., `atsvc`, `samr`, etc.) to aid in filter creation for false positives.

  - **Verify network connections**: Use network monitoring tools to inspect ongoing connections to the involved systems, correlating these with the timestamps from Event ID 5145. Look for unusual connections attempting to access the named pipes from previously unknown or untrusted IP addresses.

  - **Confirm expected behavior**: Identify any legitimate applications or services that may use named pipes in your environment. Document typical pipe connections and patterns for baseline comparison against anomalous usage seen in the logs.

  - **Assess user activity context**: Cross-reference the user account or service account associated with the alert in Event ID 5145. Investigate if these accounts have a known history of executing lateral movement or if their behavior has changed recently.

  - **Check for service accounts**: Evaluate whether the alert is linked to legitimate service accounts typically utilized for remote management tasks. Review timestamps and compare recent activities against these accounts to identify potential misuse.

  - **Analyze related logs**: Look for file share access events in conjunction with Event ID 5145 in logs, such as those from Sysmon Event ID 11 (FileCreate) or other file access events, which can help establish context around the access to named pipes.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on critical systems and the likelihood of such behavior being exploited for lateral movement by adversaries. Given named pipes' role in remote system communications, this technique is commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  The detection may miss legitimate activities unless the audit policy for “Object Access > Audit Detailed File Share” is configured to log all successful and failed access attempts, which could be an oversight in some environments. Adversaries might employ evasion techniques, such as using commonly excluded named pipes, to avoid detection. Legitimate applications may also trigger this alert if they access new named pipes post-deployment or changes. Companion detections, such as Sysmon monitoring for process creation (Event ID 1) that follows pipe access, can strengthen overall coverage of lateral movement attempts.

