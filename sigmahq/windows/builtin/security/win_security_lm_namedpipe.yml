note: |
  ### Technical Context
  This detection rule identifies the creation of new remote named pipes on Windows systems, particularly those that may indicate lateral movement or remote execution attempts by an adversary. Named pipes are a method of inter-process communication in Windows, and attackers can leverage them for unauthorized data transfer or to execute commands remotely. By monitoring for such activities on remote named pipes, an organization can gain insights into potential malicious behaviors occurring within its environment.

  The primary threat scenario involves an attacker who has gained access to one machine and seeks to move laterally within a network or execute arbitrary commands on other machines using named pipes. This is relevant to the MITRE ATT&CK tactics and techniques, specifically **Lateral Movement** (TA0008) and **Windows Remote Management** (T1021.002). The detection is particularly focused on identifying suspicious access patterns beyond known benign applications that typically communicate over these named pipes.

  Primary data sources for this detection include **Windows security event logs**, where Event ID 5145 tracks unauthorized access attempts to file shares, specifically those on the `\\*\IPC$` share, which is used for named pipe communication.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security Event Logs for Event ID 5145 to identify instances of remote access attempts to the `\\*\IPC$` share. Focus on timestamps and source/destination IP addresses to correlate activities.

  - **Analyze Contextual Information**: Gather information about the source process and user account associated with the creation of the named pipe, scrutinizing any behavior that deviates from established baselines.

  - **Correlate with Lateral Movement**: Examine other lateral movement techniques that were recently detected in the environment to identify if these events often accompany each other. Look for signs of exploitative behavior, such as unusual authentication attempts or patterns.

  - **Investigate Named Pipe Characteristics**: Cross-reference the detected named pipes against the established list of known benign named pipes to weed out false positives efficiently. Explore potential links to other logged activities or network traffic, especially those indicating privileged access.

  ### Prioritization
  This alert has a high severity level due to its potential implications for compromising multiple systems within the enterprise. The likelihood of lateral movement is significant if unusual named pipe activities are detected, necessitating immediate investigation to prevent escalation of attacks.

  ### Blind Spots and Assumptions
  The detection rule relies on the advanced audit policy setting "Object Access > Audit Detailed File Share" being configured to capture the relevant events (Event ID 5145). If this setting is not enabled, or if there are benign named pipes that have newly appeared and are not on the exclusion list, legitimate activity may be mistakenly flagged. Additionally, this rule assumes an established baseline of expected behaviors within the environment, which may not account for all potential legitimate communications via named pipes, thus risking false positives.

