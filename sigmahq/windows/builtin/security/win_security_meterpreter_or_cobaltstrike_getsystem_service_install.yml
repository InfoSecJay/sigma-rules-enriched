title: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
related:
- id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
  type: derived
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service installation
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
date: 2019-10-26
modified: 2023-11-15
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be 
    enabled to log the EID 4697
detection:
  selection_eid:
    EventID: 4697
  selection_cli_cmd:
        # meterpreter getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1b (expanded %COMSPEC%): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    ServiceFileName|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    ServiceFileName|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_cli_rundll:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    ServiceFileName|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  selection_cli_share:
    ServiceFileName|startswith: '\\\\127.0.0.1\\ADMIN$\'      # https://twitter.com/svch0st/status/1413688851877416960?lang=en
  condition: selection_eid and 1 of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the installation of services related to the Meterpreter or Cobalt Strike `getsystem` command, which is used by attackers to obtain system-level privileges on a compromised host. The likely objective of this behavior is to escalate privileges, enabling the adversary to gain greater control over the system and perform malicious actions. This activity aligns with the MITRE ATT&CK technique for privilege escalation (T1134.001 - Use of Service Execution and T1134.002 - Service Creation).

  The primary telemetry source is Windows Security Event Log with specific focus on Event ID 4697, which logs service installations. If confirmed as malicious, this behavior can lead to unauthorized access and control over critical systems. It is crucial to note that detection of this rule alone does not confirm a successful compromise, as legitimate purpose-driven service installations might trigger similar logs.

  ### Investigation Steps

  - **Check Event ID 4697 logs for service installations:** Review Windows Security logs (Event ID 4697) for recent service creation events. Note the `ServiceFileName` and check for unusual patterns, particularly entries containing 'cmd', 'rundll32', or paths leading to `\\.\pipe\`.

  - **Identify suspicious command execution patterns:** Search for logs of the command execution that includes parameters like `/c echo` and `\\.\pipe\` in the `ServiceFileName`. Example malicious indicators would be entries where `cmd.exe` or `%COMSPEC%` are used to create service files.

  - **Review for legitimate activities:** Investigate instances of service creation that may be expected in the environment, such as known internal applications or system updates. Compare timestamps and file paths against records of authorized changes to differentiate between benign and malicious activities.

  - **Correlate with process execution and network traffic:** Utilize Sysmon Event ID 1 for process creation logs during the same timeframe as the detection alert. Look for simultaneous execution of known Meterpreter or Cobalt Strike binaries that may indicate additional malicious activity.

  - **Validate the assets involved:** Confirm if the affected host is a critical system or typical user endpoint. Analyze any deviation from standard operational behavior on these assets, including unauthorized remote access attempts or service modifications.

  ### Prioritization

  The severity of this alert is high due to its association with privilege escalation techniques commonly used by attackers in the post-exploitation phase. The presence of service installations related to Meterpreter or Cobalt Strike indicates a high likelihood of malicious abuse, as these tools are frequently weaponized for unauthorized control over compromised environments.

  ### Blind Spots and Assumptions

  Detection might be limited by the requirement for specific logging configurations, such as ensuring the 'System Security Extension' audit subcategory is enabled for Event ID 4697. Legitimate activities, such as approved service modifications or internal maintenance tasks, may also trigger this alert. Related detections, such as those monitoring anomalous command line usage or service modifications, can strengthen coverage and provide additional context for investigations.

