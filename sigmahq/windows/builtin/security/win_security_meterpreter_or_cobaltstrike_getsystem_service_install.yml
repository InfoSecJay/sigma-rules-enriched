title: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
related:
- id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
  type: derived
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service installation
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
date: 2019-10-26
modified: 2023-11-15
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be 
    enabled to log the EID 4697
detection:
  selection_eid:
    EventID: 4697
  selection_cli_cmd:
        # meterpreter getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        # cobaltstrike getsystem technique 1b (expanded %COMSPEC%): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    ServiceFileName|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    ServiceFileName|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_cli_rundll:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    ServiceFileName|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  selection_cli_share:
    ServiceFileName|startswith: '\\\\127.0.0.1\\ADMIN$\'      # https://twitter.com/svch0st/status/1413688851877416960?lang=en
  condition: selection_eid and 1 of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of services using the Meterpreter or Cobalt Strike `getsystem` command, indicative of privilege escalation attempts by an adversary. The attacker aims to gain elevated permissions on a compromised host to execute unauthorized commands or manipulate system configurations. Relevant MITRE ATT&CK techniques include **Privilege Escalation** (T1134), specifically techniques T1134.001 (Service Installation) and T1134.002 (System Service Manipulation).

  The primary telemetry source is Windows Security logs. Specifically, Event ID 4697 logs service installations and should be monitored closely for anomalies in service creation. If malicious, this behavior significantly compromises the security posture, allowing an attacker to install and run malicious services with elevated privileges. This detection does NOT confirm malicious intent on its own, since legitimate service installations may occur under normal administrative operations.

  ---

  ### Investigation Steps

  - **Verify Event ID 4697**: Check for Event ID 4697 in Security logs, focusing on the `ServiceFileName` field. Look for suspicious command patterns involving `cmd` or `rundll32`, which can indicate misuse.

  - **Correlate Process Creation Events**: Review Security Event ID 4688 (Process Creation) to trace the parent process of the command associated with the service installation. Benign commands typically originated from `spoolsv.exe` or `services.exe`, while suspicious origins may include user profiles or known malicious tools.

  - **Check for Admin Shares Usage**: Investigate any access to `\\127.0.0.1\ADMIN$` noted in the service installation parameters. Legitimate operations rarely involve these administrative shares, whereas malicious activity often does.

  - **Review for DLL Executions**: Examine the existence of any DLL files under `C:\Users\test\AppData\Local\Temp\` or similar locations. Sample names like `tmexsn.dll` should raise red flags as they are often used in exploit scenarios.

  - **Assess Service Behavior**: Look for newly created services by checking Windows Services management (services.msc) and ensuring they align with known good configurations. Malicious services often disguise themselves as legitimate ones but should lack meaningful descriptions or vendors.

  - **Investigate Network Activity**: Analyze any outbound connections related to the process that triggered the rule. Use firewall or proxy logs to check for unusual destination IPs or URLs that correlate with the service creation timestamp.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the significant impact of a compromised system where services are covertly installed without authorization. The likelihood of malicious abuse is considerable, as the behavior is strongly aligned with known exploitation frameworks like Meterpreter and Cobalt Strike that are frequently weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of attackers to obfuscate service creation commands. False positives are unlikely, but legitimate maintenance scripts or administrative actions that use similar commands may trigger alerts. Ensure that Windows Security Event logs are properly configured to capture Event ID 4697 with the correct audit settings. Related detection techniques, such as monitoring for anomalous process execution flagged by Sysmon, can complement coverage and provide additional context for investigations.

