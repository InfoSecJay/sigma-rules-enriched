title: File Access Of Signal Desktop Sensitive Data
id: 5d6c375a-18ae-4952-b4f6-8b803f6c8555
status: experimental
description: |
  Detects access to Signal Desktop's sensitive data files: db.sqlite and config.json.
  The db.sqlite file in Signal Desktop stores all locally saved messages in an encrypted SQLite database, while the config.json contains the decryption key needed to access that data.
  Since the key is stored in plain text, a threat actor who gains access to both files can decrypt and read sensitive messages without needing the users credentials.
  Currently the rule only covers the default Signal installation path in AppData\Roaming. Signal Portable installations may use different paths based on user configuration. Additional paths can be added to the selection as needed.
references:
- https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/
- https://vmois.dev/query-signal-desktop-messages-sqlite/
author: Andreas Braathen (mnemonic.io)
date: 2025-10-19
tags:
- attack.credential-access
- attack.t1003
logsource:
  product: windows
  service: security
  definition: 'Requirements: System Access Control List (SACL) policy with attributes
    List folder/read data on Objects'
detection:
  selection:
    EventID: 4663
    ObjectType: 'File'
    ObjectName|contains: '\AppData\Roaming\Signal\'
    ObjectName|endswith:
    - '\config.json'
    - '\db.sqlite'
  filter_main_signal:
    ProcessName|endswith:
    - '\signal-portable.exe'
    - '\signal.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely, but possible from AV or backup software accessing the files.
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized access to sensitive data files associated with Signal Desktop, specifically `db.sqlite` and `config.json`, located in the user's AppData directory. The `db.sqlite` file contains encrypted messages, while `config.json` holds the decryption key in plain text. An adversary who accesses these files can decrypt and read sensitive messages without the user's credentials, undermining user privacy and data integrity.

  The likely threat scenario involves an insider threat or a credential-enabled external actor who has gained access to the endpoint through phishing, malware, or system exploitation. The attacker’s objective is to harvest sensitive communications potentially for espionage, corporate data theft, or personal information gathering. Key MITRE ATT&CK tactics relevant to this detection include Credential Access (TA0006) and the technique for Credential Dumping (T1003).

  The primary data sources for effective detection include Windows security event logs (specifically Event ID 4663), which log file access activities, and system access control logs to monitor folder read permissions and access attempts to sensitive directories.

  ### Investigation Steps
  - **Review File Access Logs:** Review Windows security event logs for Event ID 4663 related to `db.sqlite` and `config.json` to determine who or what process made the access request, including timestamps and user accounts involved.
  - **Correlate with User Activities:** Cross-reference the detected access with user activity logs and other related events around the same timeframe to identify any unusual patterns or potential identity compromises.
  - **Examine Process Context:** Analyze the process names associated with the file access. Look for anomalies in the event streams, such as access attempts from unexpected processes that are not part of the Signal application ecosystem.
  - **Assess User Privilege Levels:** Check the user accounts accessing these files to ensure they have appropriate permissions. Investigate any accounts with excessive privileges or anomalous behaviors that could indicate a compromise.

  ### Prioritization
  This alert holds medium severity due to its potential to expose sensitive communications and private user information if executed by a malicious actor. In environments where Signal is used, improper access could lead to significant privacy breaches or data leaks.

  ### Blind Spots and Assumptions
  This detection rule primarily relies on the presence of a defined System Access Control List (SACL) policy and assumes that the Signal Desktop application is installed in the default path. Gaps in detection may arise from non-standard installations, such as portable versions of Signal, which could store files in different directories not covered by this rule. For the alert to function effectively, it requires proper logging configurations that capture file access events and ensure timely analysis of these logs.

