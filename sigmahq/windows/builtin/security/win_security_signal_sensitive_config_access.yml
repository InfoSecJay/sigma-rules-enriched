title: File Access Of Signal Desktop Sensitive Data
id: 5d6c375a-18ae-4952-b4f6-8b803f6c8555
status: experimental
description: |
  Detects access to Signal Desktop's sensitive data files: db.sqlite and config.json.
  The db.sqlite file in Signal Desktop stores all locally saved messages in an encrypted SQLite database, while the config.json contains the decryption key needed to access that data.
  Since the key is stored in plain text, a threat actor who gains access to both files can decrypt and read sensitive messages without needing the users credentials.
  Currently the rule only covers the default Signal installation path in AppData\Roaming. Signal Portable installations may use different paths based on user configuration. Additional paths can be added to the selection as needed.
references:
- https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/
- https://vmois.dev/query-signal-desktop-messages-sqlite/
author: Andreas Braathen (mnemonic.io)
date: 2025-10-19
tags:
- attack.credential-access
- attack.t1003
logsource:
  product: windows
  service: security
  definition: 'Requirements: System Access Control List (SACL) policy with attributes
    List folder/read data on Objects'
detection:
  selection:
    EventID: 4663
    ObjectType: 'File'
    ObjectName|contains: '\AppData\Roaming\Signal\'
    ObjectName|endswith:
    - '\config.json'
    - '\db.sqlite'
  filter_main_signal:
    ProcessName|endswith:
    - '\signal-portable.exe'
    - '\signal.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely, but possible from AV or backup software accessing the files.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects unauthorized access to critical Signal Desktop files (db.sqlite and config.json) that contain sensitive message data and the decryption key. The likely attacker objective is to exfiltrate or read sensitive communications without using user credentials. This behavior aligns with the MITRE ATT&CK framework's credential access tactic (TA-1003), particularly with technique T1003. Primary telemetry sources include Windows Security Event ID 4663, which logs file access events, specifically targeting the Signal application default installation path. If malicious, compromised access to these files could lead to severe privacy violations and potential data breaches. This detection does NOT confirm that sensitive data was successfully accessed or exfiltrated, only that an attempt was made.

  ---

  ### Investigation Steps

  - **Review file access logs**: Check Windows Security Event ID 4663 for entries related to ObjectName containing '\AppData\Roaming\Signal\'. Look for access to db.sqlite and config.json files. Legitimate access may originate from known Signal processes or user-initiated actions.

  - **Identify the responsible process**: Confirm that the ProcessName in Event ID 4663 ends with 'signal.exe' or 'signal-portable.exe'. Access from other processes may indicate unauthorized behavior.

  - **Correlate user activity**: Investigate user access patterns to verify if the file access corresponds with legitimate user actions, such as sending or receiving messages using Signal. Look for unusual access times or unknown users.

  - **Check for related artifacts**: Validate the presence of sensitive data files by looking for the creation or modification timestamps of db.sqlite and config.json. Cross-reference dates with other security events to discern patterns of potentially malicious activity.

  - **Consider backup software interference**: Acknowledge that legitimate access could occur from backup or antivirus software scanning files. Review documentation or configuration settings for any installed applications that might reasonably access these files.

  ---

  ### Prioritization

  This alert should be treated with medium severity. Access to sensitive data files could lead to significant security impacts, especially if tied to real world adversary behavior. While there may be a legitimate need for applications to access these files, the likelihood of malicious exploitation is notable given the known vulnerabilities of storing sensitive information in plain text.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques where attackers use alternate file paths or rename Signal installations. Reliable detection requires appropriate SACL policy settings to log accesses. Legitimate activities, such as backup services or system maintenance tasks, could trigger this alert, leading to false positives. A related detection to enhance coverage might involve monitoring for unusual process creations in conjunction with access of these sensitive files.

