logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4720
    TargetUserName|endswith: '$'
  filter_main_homegroup:
    TargetUserName: 'HomeGroupUser$'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the creation of a local user account on a Windows system that has a name ending with a dollar sign ($), indicating it may be a hidden account. Attackers often aim to establish persistence by creating such accounts to maintain access to compromised systems. This behavior is tied to the "Persistence" tactic under MITRE ATT&CK (T1136.001 - Create Account). The primary telemetry source for this detection is Windows Security Event ID 4720, which logs account creation events. If malicious, such hidden accounts could be leveraged for further access and escalated privileges. However, this detection alone does not confirm malicious intent, as administrative users may create legitimate hidden accounts for system management.

  ---

  ### Investigation Steps

  - **Review the event details:** Check Windows Security Event ID 4720 logs for user accounts created. Look for accounts with names ending in `$` in the EventData's `TargetUserName` field.
  - **Examine account creation context:** Analyze who initiated the account creation. Validate the `SubjectUserName` and `SubjectDomainName` fields to confirm if an expected administrator performed the action or if an unusual user triggered it.
  - **Identify legitimate use cases:** Check for documented administrative tasks or policies that may justify the creation of hidden accounts. Look for a history of related Event IDs that could suggest routine account management activities.
  - **Search for abnormal account privileges:** Using Event ID 4624 (Logon), confirm whether the newly created account logs onto the system and if it attempts to execute sensitive actions that an authorized user typically performs.
  - **Correlate with other security events:** Cross-reference against other logs, such as Event ID 4672 (Special Logon) or other anomaly detection logs, to determine any suspicious activity following the hidden account creation.
  - **Flag high-confidence indicators:** If the account name corresponds to suspicious patterns (e.g., common names used by malware) and there are logs of unusual access post-creation, consider it a high-confidence malicious indicator.

  ---

  ### Prioritization

  The alert is high severity due to the potential for establishing unauthorized persistence on critical systems. Hidden user accounts are not typical in enterprise environments and can facilitate ongoing malicious activity. This behavior is known to be weaponized by various threat actors, especially within targeted attacks.

  ---

  ### Blind Spots and Assumptions

  One limitation of this detection is that an attacker could attempt to bypass it by using non-standard account names or legitimate administrative tools. Reliable detection requires that all relevant Windows security logs are enabled and properly configured, specifically Event ID 4720. Legitimate activities that may trigger the alert include authorized system configuration by domain administrators. A related detection to strengthen coverage would be monitoring for changes to existing accounts or auditing for logon behaviors of newly created accounts, enhancing the contextual understanding of the account's use.

