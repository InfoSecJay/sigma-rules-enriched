  ---

  ### Technical Context

  This rule detects the creation of a hidden local user account on Windows systems, specifically targeting accounts whose usernames end with a dollar sign ($), indicating a machine account. Attackers may create such accounts to establish persistence and to ensure ongoing access to compromised systems undetected. Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Local Account Creation (T1136.001). The primary telemetry source is Windows Security logs, specifically looking for Security Event ID 4720. If identified as malicious, this behavior can lead to prolonged unauthorized access and potential lateral movement within the network. Importantly, this detection alone does not confirm malicious intent; further investigation is required to confirm the legitimacy of the user account creation.

  ---

  ### Investigation Steps

  - **Check for Event ID 4720:** Retrieve Security Event ID 4720 logs to confirm the local user account creation event, querying for logs containing `TargetUserName` ending with '$' (e.g., `TargetUserName: "HiddenUser$"`).

  - **Identify legitimate system accounts:** Verify against a baseline of known valid local accounts. Legitimate local system accounts such as `HomeGroupUser$` should be documented and expected in enterprise environments. Any unfamiliar accounts should be flagged for further scrutiny.

  - **Cross-reference creation timestamps:** Correlate the timestamps of the Event ID 4720 with historical user activity logs within the relevant timeframe to identify any unusual behavior before or after account creation.

  - **Analyze the origin of account creation:** Check the `SubjectUserName` and `SubjectDomainName` fields from the event log to ascertain if the account creation was executed by a legitimate administrator or by an anomalous user, as this could indicate compromised credentials.

  - **Investigate account privileges and usage:** Review subsequent logins and activity associated with the newly created account, particularly any actions that leverage administrative privileges, to detect potential misuse.

  - **Monitor for lateral movement:** Look in logs for lateral movement activities initiated from the newly created account, using Security Event ID 4672 (Special Privileges Assigned to New Logon) to identify if the account has been employed to access other resources.

  ---

  ### Prioritization

  Given that this alert pertains to the creation of a hidden local user account, it is classified as high severity. The presence of such an account could facilitate unauthorized access and control for an attacker, especially if this behavior aligns with known tactics used in compromise scenarios. Additionally, while this behavior is less common in standard operations, its potential impact on system integrity necessitates urgent attention.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative actions, such as automated scripts or legitimate configuration changes that create hidden accounts. Ensuring comprehensive logging configurations are in place is critical for reliable detection, specifically for Event ID 4720. Additionally, benign activities, such as system maintenance or legitimate provisioning processes, can trigger this alert. A companion detection to consider includes monitoring for anomalous account logon events (Event ID 4624) associated with newly created accounts, which can strengthen overall visibility into account-related activities.

