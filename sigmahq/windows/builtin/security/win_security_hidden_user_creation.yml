logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4720
    TargetUserName|endswith: '$'
  filter_main_homegroup:
    TargetUserName: 'HomeGroupUser$'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the creation of hidden local user accounts in a Windows environment, specifically those that end with a dollar sign (`$`). Such accounts are typically service accounts or administrative accounts and are not meant to be user-facing. The creation of these hidden accounts under unusual circumstances may indicate malicious activity, such as an attacker attempting to establish persistence on a compromised machine by creating unauthorized accounts that can be leveraged for privilege escalation or lateral movement.

  In a common threat scenario, an attacker may compromise a system and create a hidden local user account to maintain access, conducting actions like data exfiltration or further infiltration into the network. This behavior aligns with the MITRE ATT&CK technique **T1136.001: Create Local Account** under the **Persistence** tactic. By monitoring for this activity, security teams can identify potentially malicious actions before they escalate into more significant security incidents.

  Primary data sources for detection include Windows Security Event Logs, specifically looking at Event ID 4720, which logs the creation of new user accounts. Security information from these logs will provide the necessary insights to determine the legitimacy of the account creation activity.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Security Event Logs for Event ID 4720 to identify the time and source of the account creation. Pay attention to the `TargetUserName` field, specifically looking for entries that end with `$`.
  - **Correlate with User Activity**: Investigate user account creation activity against established baselines for normal behavior in your environment. Look for accounts created outside of regular operational hours or by atypical administrative users.
  - **Check Active Directory**: If applicable, cross-reference the new local user accounts against Active Directory for any existing policies or legitimate users and to identify any unusual patterns or anomalies.
  - **Investigate Further Actions**: Analyze system logs for subsequent login attempts from the newly created accounts. Also, check for any associated processes or network connections originating from this account that may indicate further malicious activity.

  ### Prioritization
  The severity of this alert is high because the unauthorized creation of hidden local user accounts can facilitate persistence and potential data breaches. Given the impactful nature of such activity and the likelihood of it representing malicious intent, prompt investigation and response are warranted.

  ### Blind Spots and Assumptions
  This detection strategy may not cover all methods of unauthorized account creation, especially if attackers use legitimate administrative tools or methods to mask their actions. There is an assumption that the alerting infrastructure is correctly processing Windows Security logs for Event ID 4720. Additionally, if security logging is misconfigured or unavailable, this alert will not function as intended due to a lack of pertinent data. Ensuring that Windows auditing is properly configured and that relevant logs are retained is crucial for accurate detection.

