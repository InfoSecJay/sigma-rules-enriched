logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection:
    EventID: 5145
    ShareName: '\\\\\*\\ADMIN$'      # looking for the string  \\*\ADMIN$
    RelativeTargetName|contains|all:
    - 'SYSTEM32\'
    - '.tmp'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential Active Directory credential dumping activities using Impacket's SecretDump tool. SecretDump is designed to extract credentials from Windows systems and is commonly used by attackers to gain unauthorized access to sensitive information. The threat scenario typically involves an attacker who has already established an initial foothold within the environment, seeking to escalate their privileges by obtaining hashes or clear-text passwords stored within Local Security Authority Subsystem Service (LSASS) or AD.

  The relevant MITRE ATT&CK techniques associated with this detection include "Credential Dumping: DCOM Abusing  (T1003.002)," "Credential Dumping: LSASS Memory (T1003.004)," and "Credential Dumping: Security Account Manager (SAM) (T1003.003)." These techniques highlight that an attacker may attempt to access sensitive credential stores via Remote Procedure Call (RPC) or directly interact with memory processes to extract credential information.

  Primary data sources that will yield critical evidence for this detection algorithm include Windows security and application logs, specifically looking for EventID 5145, which captures access to file shares—particularly the ADMIN$ share where credential dumping may take place.

  ### Investigation Steps
  - **Review EventID 5145 Logs**: Check Windows security logs for EventID 5145 entries that indicate access to the ADMIN$ share. Look for unusual source IP addresses or user accounts that do not typically access these resources.

  - **Analyze Share Access Patterns**: Identify if there were any recent changes to file share permissions or if the ADMIN$ share is being accessed outside of normal operational hours, indicating potential malicious activity.

  - **Inspect Process Creation Events**: Use EDR tools to gather process creation events to detect if any known malicious processes (e.g., SecretDump) were initiated during the period of suspicious file access. Cross-reference parent and child processes.

  - **Correlate with Other Security Logs**: Check for other logs (such as firewall logs or EDR telemetry) that may indicate lateral movement or connections to different hosts in a manner that aligns with credential dumping attempts.

  ### Prioritization
  This alert is categorized as high severity due to the significant impact that successful credential dumping can have on overall system integrity and security. Given the ease with which attackers can leverage dumped credentials for lateral movement across the network, prompt investigation is essential to mitigate risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for different methods of credential dumping that do not generate the specific EventID 5145 logs or use share names other than the ADMIN$ share. The detection logic assumes that auditing of the object access to the ADMIN$ share is properly configured and logs are being collected. Without correct log configuration or comprehensive audit policies in place, this detection may produce false negatives or fail to trigger altogether.

