note: |
  ### Technical Context

  This Sigma rule detects potential credential dumping activity related to Active Directory using Impacket's SecretDump tool. This behavior typically indicates an attacker seeking to harvest credentials from the Windows domain to escalate privileges or further infiltrate the environment.

  The rule maps to the MITRE ATT&CK tactic of **Credential Access** and specifically targets techniques such as **Dumping Credentials from LSASS** (T1003.002), **Dumping Cached Credentials** (T1003.004), and **Credential Dumping** (T1003.003). The primary telemetry sources involved are Windows Security logs, specifically focusing on **Event ID 5145**, which records file share access attempts, along with path and filename details. If this behavior is malicious, it could lead to unauthorized access to sensitive accounts and resources.

  It is crucial to note that this detection does NOT confirm that credential dumping occurred; it merely highlights a high-risk behavior associated with certain access patterns.

  ### Investigation Steps

  - **Review Event ID 5145 logs for unauthorized activity**: Examine logs for Event ID 5145 to identify File Share access events. Focus on entries where ShareName is '\\ADMIN$' and verify if the activity was performed by non-administrative user accounts, which could indicate malicious intent.

  - **Identify the process initiating the file access**: Use Windows Sysmon Event ID process creation log (ID 1) to check for processes linked to the suspicious file access. Pay special attention to processes named `secretdump.py`, `powershell.exe`, or any suspicious executables that correlate with this activity.

  - **Check for the presence of .tmp files in SYSTEM32**: Investigate file system activity for newly created or modified files with a `.tmp` extension within the `C:\Windows\System32\` directory, as they may indicate credential dumping operations.

  - **Correlate user activity with legitimate access patterns**: For context, check regularly scheduled tasks or maintenance scripts that might legitimately access ADMIN$ shares, confirming known good activity from administrative accounts and scheduling tasks against the timestamps of the event.

  - **Analyze for anomalous user accounts and login times**: Review user account activity for unusual login times or behavior, especially for accounts that do not regularly access the ADMIN$ share, and cross-check against user entitlement and roles.

  ### Prioritization

  The alert severity is high due to the critical nature of potential credential theft impacting Active Directory environments. The likelihood of malicious abuse is significant, as credential dumping techniques are commonly weaponized by attackers for lateral movement and privilege escalation within targeted networks.

  ### Blind Spots and Assumptions

  Detection may be limited by inadequate logging configurations, particularly if Advanced Audit Policy settings for detailed file access are not enabled. Additionally, legitimate administrative scripts may inadvertently trigger this alert, leading to false positives. It is recommended to have complementary detections such as monitoring for abnormal account activity (e.g., MFA failures or unusual location logins) to enhance visibility into potential threats.

