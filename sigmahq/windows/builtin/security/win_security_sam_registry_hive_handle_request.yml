  ### Technical Context

  This Sigma rule detects attempts to access handles related to the Security Account Manager (SAM) registry hive on a Windows system, identified by Event ID 4656. The likely attacker objective is to gather sensitive credential information, such as user account details and password hashes, which would facilitate unauthorized access or lateral movement within the network. Relevant MITRE ATT&CK techniques include Discovery (T1012) and Credential Access (T1552.002).

  The primary telemetry source for this detection is Windows Security logs, specifically monitoring for Event ID 4656, which records system object handle requests. If the detected behavior is malicious, it could lead to significant security risks such as credential theft and unauthorized elevation of privileges. Importantly, this detection does NOT confirm that credential access was successfully achieved; it only indicates that a request to the SAM hive was made.

  ---

  ### Investigation Steps

  - **Verify Event ID 4656 details:** Review Windows Security logs for Event ID 4656. Investigate the `ObjectName` field to confirm it is ending with `\SAM`, indicating a request to the SAM registry hive.

  - **Identify the querying user/process:** Cross-reference the Event ID 4656 logs with the `SubjectUserName`, `SubjectDomainName`, and `ProcessId` fields to identify the user and process making the request. Look for any anomalous user behavior.

  - **Check for normalized access permissions:** Investigate normal access patterns for the identified user or process. Legitimate access to the SAM hive is rare and typically limited to system-level processes or administrators.

  - **Look for correlated suspicious behavior:** Search for other related Event IDs (like 4663 - An attempt was made to access an object) in proximity to the Event ID 4656 to uncover a potential pattern of malicious behavior, such as repeated access attempts.

  - **Monitor for known malicious processes:** Validate if the process attempting to access the SAM hive matches any known malicious indicators (e.g., atypical software or recently compromised software tools). Use threat intelligence sources to cross-reference hashes.

  - **Audit system roles and asset criticality:** Consider the role of the affected system in your environment. If it is a domain controller or contains sensitive information, the alert's priority escalates, necessitating immediate investigation.

  ---

  ### Prioritization

  The alert is deemed high severity primarily because accessing the SAM registry hive typically implies an attempt to compromise sensitive credential information. Given that credential theft is a common tactic among adversaries, the likelihood of malicious abuse is significant, especially on critical infrastructure systems like domain controllers.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture all access attempts if logging is misconfigured or insufficiently detailed. Attackers may use evasion techniques such as clearing logs or using system utilities to obscure their actions. Legitimate administrative maintenance might also trigger this alert, especially during system updates. A related detection could include monitoring for abnormal registry modifications (e.g., Event ID 4657 - A registry value was modified) to provide additional context and coverage.

