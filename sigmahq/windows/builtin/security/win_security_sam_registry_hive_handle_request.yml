note: |
  ### Technical Context

  This rule detects attempts to access the Security Account Manager (SAM) registry hive on Windows systems, which is commonly targeted by attackers seeking to extract credentials or user information. The likely objective of an attacker triggering this rule is to harvest sensitive account details for lateral movement or privilege escalation within the environment. This behavior falls under the MITRE ATT&CK tactics of Credential Access (TA0011) and Discovery (TA0007), specifically techniques T1552.002 (Application Layer Protocol: Credentials in a file) and T1012 (Query Registry).

  The primary telemetry source for this detection is the Windows Security event logs, specifically focusing on Event ID 4656, which indicates a handle request to access an object. If successful and malicious, such access could lead to credential compromise and deeper network infiltration. Importantly, this detection alone does NOT confirm malicious activity, as legitimate administrative tasks may also involve access to the SAM hive.

  ### Investigation Steps

  - **Check Event ID 4656:** Review Security Event ID 4656 with `ObjectName` fields ending in `\SAM`. Validate the account name triggering this request for any unauthorized or suspicious accounts.

  - **Correlate with Event ID 4672:** Investigate concurrent Event ID 4672 (Special privileges assigned to new logon) events to identify if the account requesting access has special privileges, indicating potential misuse.

  - **Identify User Context:** Determine the user context under which the handle request was made. Administrative accounts are more common for legitimate access; however, any unexpected user accounts making this request should raise suspicion.

  - **Evaluate Process Context:** Reviewing the `ProcessId` and `ProcessName` fields in Event 4656 could provide insight into the associated process making the registry request. URL request patterns and parent process information may also reveal anomalous behavior.

  - **Monitor for Expected Behaviors:** Legitimate system maintenance tasks from trusted accounts may involve accessing the SAM hive. Validate that expected maintenance schedules and user access policies align with the detection timeline.

  - **Map Against Known Indicators:** Look for specific malicious indicators such as known exploit tools (e.g., Mimikatz) or techniques used for credential dumping in the process names associated with the handle requests.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on security if sensitive credentials are extracted. The likelihood of malicious abuse is significant as accessing the SAM hive is commonly a preliminary step in credential dumping attacks that often lead to broader network compromises.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative tools that access the SAM hive for routine tasks, potentially leading to false positives. Reliable detection requires that Windows Security auditing is properly configured to log Event ID 4656. Additionally, monitoring should account for legitimate access by domain administrators. A related detection to strengthen coverage would be monitoring for unusual logon attempts (Event ID 4624) from accounts that accessed the SAM hive.

