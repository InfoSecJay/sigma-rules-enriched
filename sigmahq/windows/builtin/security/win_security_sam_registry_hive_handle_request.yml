note: |
  ### Technical Context
  This detection rule identifies attempts to access the Security Account Manager (SAM) registry hive on Windows systems. These access requests are significant because the SAM contains sensitive user account data and password hashes. Attackers often attempt to access the SAM to extract credentials, escalate privileges, or pivot within an environment. By monitoring for handle requests specifically targeting the SAM hive, organizations can better understand and mitigate potential credential theft activities or lateral movement attempts.

  The primary MITRE ATT&CK tactics applicable to this detection include **Credential Access** (TA0006) and **Discovery** (TA0007). The specific techniques outlined include **Credential Dumping** (T1003) and **Registry Run Keys / Startup Folder** (T1552.002). Detecting unauthorized access to the SAM can signal an ongoing attack where the adversary aims to gather credentials for further exploitation.

  The best data sources for evidence include Windows Security Event logs, specifically focusing on Event ID 4656, which indicates handle requests. Collecting this log type will help corroborate suspicious activities targeting the SAM registry.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Security Event logs for Event ID 4656 related to handle requests to the SAM registry hive. Identify the source process making these requests and its user context.
  - **Correlate Attempts:** Investigate any other log sources, such as process creation events, to correlate with the handle requests. Look for unusual execution patterns or unexpected applications initiating these requests.
  - **Analyze User Behavior:** Cross-reference the user accounts in question with their recent activities to assess whether the handle request was legitimate or indicative of suspicious behavior patterns.
  - **Consult Additional Telemetry:** Examine other telemetry sources such as EDR alerts, network logs, or endpoint behavior that might suggest lateral movement or credential theft, ensuring a comprehensive context for the incident.

  ### Prioritization
  The high severity of this alert stems from the potential impact on the organization, as unauthorized access to the SAM can lead to credential theft and account compromise, making it a critical focus for incident response efforts.

  ### Blind Spots and Assumptions
  There may be gaps in detection if not all Windows Security Event logs are collected or if audit policies are not correctly set to track such access attempts. The detection logic assumes that any handle request to the SAM is suspicious and may not account for legitimate administrative actions. Additionally, configurations must be in place to ensure Event ID 4656 is generated and captured reliably to enable effective monitoring of SAM access attempts.

