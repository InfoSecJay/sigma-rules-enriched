  ### Technical Context

  This Sigma rule detects attempts to install a device that is explicitly forbidden by system policy, typically an indicator of unauthorized hardware access or configuration changes. The likely attacker objective is to introduce unauthorized peripheral devices to gain foothold, exfiltrate data, or manipulate system functionality. This behavior aligns with the MITRE ATT&CK technique T1200 (Hardware Additions).

  The primary telemetry source is Windows Security logs, specifically looking for Event ID 6423, which documents blocked device installations. If malicious, this can lead to data breaches or loss of system integrity. The detection does NOT confirm that the blocking was due to malicious intent; it may reflect legitimate administrative security policies in place.

  ### Investigation Steps

  - **Review Security Event ID 6423:** Look for Event ID 6423 in the Windows Security logs (Event Viewer under Security). This event will indicate that a device installation was denied due to policy settings.

  - **Correlate with Device Installation Logs:** Check for recent device installation events in the same time frame (Event ID 20001 typically) to identify what device was blocked and confirm whether it correlates with known or expected devices in the environment.

  - **Assess Asset Role and Policy Compliance:** Validate the asset role of the impacted system to determine if legitimate users would typically attempt to install devices. Many business environments restrict peripheral installations for security reasons.

  - **Identify Patterns of Malicious Behavior:** Look for repeated Event ID 6423 entries in a short period from the same user or system, which may suggest an adversary's efforts to bypass security measures. Unusual accounts should be flagged for review.

  - **Check for Related Alerts:** Investigate other related alerts around the same time to assess if further suspicious behavior, such as unusual user activities or multiple blocked installations, corroborate the malicious intent.

  - **Validate Network Telemetry for Exfiltration Risks:** Analyze network logs to see if there are outgoing connections (e.g., Event ID 5156) related to the blocked devices. An unexpected data transfer immediately following the blocked event may indicate a more severe incident.

  ### Prioritization

  This alert is considered medium severity as it involves a protected system potentially being targeted by an unauthorized device installation attempt. The impact is heightened if the affected asset has access to sensitive data or critical infrastructure. The likelihood of malicious abuse is moderate, as adversaries may frequently attempt hardware addition to facilitate lateral movement.

  ### Blind Spots and Assumptions

  The detection has limitations against sophisticated evasion techniques, such as using legitimate administrator credentials to attempt the installation or altering system policies. Required log sources include properly configured Windows Security logs for Event ID 6423 and device installation event audits. Legitimate activities such as IT personnel updating system hardware may generate similar alerts. A related detection is monitoring for changes in Group Policy settings that could allow device installations, offering complementary insights into potential weaknesses in security configurations.

