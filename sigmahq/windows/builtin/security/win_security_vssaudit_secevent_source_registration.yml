  ### Technical Context

  This Sigma rule detects the registration of the security event source VSSAudit, specifically through Windows Security Event IDs 4904 and 4905. This behavior is typically observed during volume shadow copy operations, which may indicate an attempt to facilitate credential theft or lateral movement by capturing system states or preparing for data exfiltration. The relevant MITRE ATT&CK tactic is "Credential Access" (ID: T1003.002).

  Primary telemetry sources include Windows Security logs, specifically Event IDs 4904 (indicating the creation of a new source) and 4905 (indicating changes to the audit source). If these events are generated by an unauthorized user, they can indicate an elevated risk, as malicious actors may leverage VSS to access sensitive data. Importantly, this detection does not confirm malicious intent on its own, as legitimate backup or restore operations can also trigger these events.

  ### Investigation Steps

  - **Verify event source registration:** Review Security Event Logs for Event IDs 4904 and 4905, confirming the entry lists “AuditSourceName: VSSAudit.” Note the account that performed this action; a non-standard account may indicate malicious activity.

  - **Identify user and process context:** Check the user account associated with the logged events. If the process is initiated by C:\Windows\System32\VSSVC.exe and a known, valid administrator account, this may indicate benign activity, e.g., during scheduled backup operations.

  - **Assess recent shadow copy activity:** Examine other Security Event Logs or Volume Shadow Copy Service logs for related events (e.g., Event ID 5145) within a similar time frame. This may indicate a pattern of authorized activity.

  - **Check process creation logs:** Investigate Windows Event ID 4688 for recent process creation events to determine what processes were active during the time of the VSSAudit registration. Look for unusual processes or command-line arguments around the same timestamps, which could signal suspicious activity.

  - **Validate backup software:** If legitimate backup software is in use, consult its documentation or logs to cross-reference any related VSS activity and align its operations with the timings of the detected events.

  ### Prioritization

  This alert is deemed informational in a typical enterprise context, but it merits attention due to the potential impact of unauthorized access to sensitive data through VSS operations. While not every registration indicates malicious intent, the technique is known to be weaponized by adversaries for credential access, raising the need for careful scrutiny of associated events.

  ### Blind Spots and Assumptions

  Detection may miss incidents where attackers modify or disable logging to obscure their activity. Reliable detection also requires proper configuration of Windows Security Event Logging to capture all relevant events. Legitimate backup and recovery operations by system administrators or scheduled tasks may frequently trigger these alerts, which can complicate prioritization. Related detections to consider include monitoring for unusual backup tool behavior or unexpected Administration tasks (e.g., Event IDs 4697).

