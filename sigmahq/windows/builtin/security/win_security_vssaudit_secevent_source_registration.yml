note: |
  ### Technical Context
  This rule detects the registration of the security event source known as VSSAudit, specifically triggered by Event IDs 4904 and 4905. These events are related to the Volume Shadow Copy Service (VSS), which is often utilized by attackers to create snapshots of system drives, allowing them to capture data without detection. The presence of VSSAudit registrations can indicate attempts by adversaries to utilize volume shadow copies for credential harvesting, data exfiltration, or other malicious activities aimed at exploiting sensitive system information.

  The likely attacker objectives in this scenario include gaining unauthorized access to sensitive data and covering their tracks by utilizing shadow copies to bypass traditional data access controls. Relevant MITRE ATT&CK tactics and techniques include **Credential Access** (TA1206) related to **Shadow Copy** (T1003.002). Primary data sources for this detection includes Windows security logs that capture event details when the VSS service manipulates shadow copies.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows security logs for Event IDs 4904 and 4905 to identify instances of VSSAudit registration, noting the timing and frequency of these events.
  - **Analyze Process Activity:** Investigate the associated processes during these event logs, particularly looking for any instance of `VSSVC.exe` to differentiate between legitimate backup operations and possible malicious activities.
  - **Cross-Reference User Accounts:** Correlate the activity with user accounts that triggered the VSSAudit events, focusing on unusual or unauthorized accounts that might indicate a potential breach.
  - **Inspect Shadow Copy Locations:** Investigate the locations where shadow copies are stored and any recent modifications or accesses, as these will provide insight into potential unauthorized data access or manipulation.

  ### Prioritization
  The alert's severity is relatively low in an enterprise environment where legitimate backup operations could trigger these events. However, repeated or unusual occurrences of VSSAudit registrations could indicate an elevated risk of credential theft and should be monitored for further investigation.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where VSS is used in legitimate administrative tasks or by authorized personnel executing backup operations. It assumes that sufficient logging is enabled to capture these event IDs from the Security log, which is not always the case in all environments. Additionally, if log retention policies are overly aggressive, critical data might be lost. Ensuring proper configurations and extended log retention will aid in reducing these gaps.

