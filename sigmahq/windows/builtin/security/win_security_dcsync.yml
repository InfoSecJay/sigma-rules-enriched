logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
    - 'Replicating Directory Changes All'
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
    - '9923a32a-3607-11d2-b9be-0000f87a36b2'
    - '89e95b76-444d-4c62-991a-0facbeda640c'
    AccessMask: '0x100'
  filter1:
    SubjectDomainName: 'Window Manager'
  filter2:
    SubjectUserName|startswith:
    - 'NT AUT'
    - 'MSOL_'
  filter3:
    SubjectUserName|endswith: '$'
  condition: selection and not 1 of filter*
falsepositives:
- Valid DC Sync that is not covered by the filters; please report
- Local Domain Admin account used for Azure AD Connect
level: high
note: |
  ### Technical Context

  This rule detects attempts to use Mimikatz for Domain Controller (DC) synchronization by monitoring specific event logs. The primary behavior involves accessing directory changes with high-level permissions, often indicating an attacker attempting to extract sensitive credential data from Active Directory. The likely objective of the attacker is to maintain persistence and lateral movement across the network. The relevant MITRE ATT&CK technique is Credential Access (T1003.006), specifically targeting directory services.

  The primary telemetry sources for this detection are Windows Security logs, particularly Event ID 4662, which records directory service changes. The security impact of malicious DC synchronization can lead to the compromise of domain credentials, allowing unauthorized access to critical systems and data. It's important to note that while this detection can signal suspicious behavior, it does NOT confirm a breach or malicious intent without additional corroborating evidence.

  ### Investigation Steps

  - **Verify Event ID 4662:** Retrieve Event ID 4662 from Security logs. Confirm processes involve `Replicating Directory Changes All` and relevant GUIDs. Benign entries typically include automated service accounts or validated domain administrative actions.

  - **Check Subject User Account:** Investigate the `SubjectUserName` in logs for patterns that match `'NT AUT*'` or `'*MSOL_*'`. Legitimate accounts for domain sync actions usually contain clear identifiers (e.g., user service IDs) and won't end in `$`.

  - **Assess Access Mask Permissions:** Review the `AccessMask` field should show `0x100`, which indicates high-level permissions. Malicious actions will have limited attribution to legitimate processes or services.

  - **Review Related Event Logs:** Cross-reference with other security events such as Event ID 4741 (computer account creation) or Event ID 4624 (logon attempts) originating from the same user or IP to establish a timeline of potentially malicious activity.

  - **Look for Anomalous Access Patterns:** Evaluate for non-standard access times or unusual geographic login attempts associated with the `Domain Admin` service accounts, which could indicate active exploitation attempts.

  - **Corroborate with Threat Intelligence:** Compare collected indicators against known Mimikatz signatures and reported threat actor behaviors. If aligning with known attack patterns, elevate the investigation for immediate containment.

  ### Prioritization

  This alert carries a high severity due to the critical role of the affected systems, which manage user authentication and authorization across the enterprise. The likelihood of malicious exploitation is high, as this behavior is commonly used in credential theft and lateral movement tactics.

  ### Blind Spots and Assumptions

  There may be evasion techniques such as the use of legitimate domain accounts that perform similar DC sync operations, potentially leading to false positives. Reliable detection requires correct logging configuration for Event ID 4662, and any legitimate large-scale sync operations may trigger this alert (e.g., Azure AD connections). A related detection enhancing security coverage is monitoring for anomalous `Event ID 4742` (computer account modifications), which can indicate domain account compromise activities.

