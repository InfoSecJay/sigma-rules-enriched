logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
    - 'Replicating Directory Changes All'
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
    - '9923a32a-3607-11d2-b9be-0000f87a36b2'
    - '89e95b76-444d-4c62-991a-0facbeda640c'
    AccessMask: '0x100'
  filter1:
    SubjectDomainName: 'Window Manager'
  filter2:
    SubjectUserName|startswith:
    - 'NT AUT'
    - 'MSOL_'
  filter3:
    SubjectUserName|endswith: '$'
  condition: selection and not 1 of filter*
falsepositives:
- Valid DC Sync that is not covered by the filters; please report
- Local Domain Admin account used for Azure AD Connect
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify unauthorized attempts to perform a Directory Synchronization (DC Sync) operation using the widely-known tool, Mimikatz. Specifically, it targets the security events generated when a user or process attempts to replicate directory changes in Active Directory, which is a common tactic used by attackers to extract sensitive credentials and account information. The ultimate objective of the threat actor may include credential theft, lateral movement, or establishing persistent access within the network.

  The relevant MITRE ATT&CK tactics associated with this detection are **Credential Access** (Tactic ID: TA0006), under which the technique **Credentials from Password Stores** (Technique ID: T1003.006) is identified. The use of Mimikatz to exploit vulnerabilities in AD sync operations reflects the evolving landscape of credential theft techniques. Primary data sources for detecting this activity include Windows security event logs, specifically Event ID 4662, which logs permission changes and access of sensitive objects in Active Directory.

  ### Investigation Steps
  - **Review Windows Security Logs**: Inspect logs for Event ID 4662 containing the properties associated with Directory Changes. Focus on entries that indicate the use of 'Replicating Directory Changes All' permissions.

  - **Correlate User Accounts**: Identify the SubjectUserName in the logs and check for accounts beginning with 'NT AUT' or 'MSOL_' as well as service accounts ending with a dollar sign ($). Investigate these accounts to confirm their legitimate use or identify any unauthorized usage.

  - **Analyze Access Patterns**: Check for unusual patterns or timings in the detected events, particularly around administrative accounts leveraging DC sync features. Look for anomalies that may suggest lateral movement or privilege escalation attempts.

  - **Assess Associated Security Events**: Enrich the investigation with contextual information from the environment, such as correlating with other security events that could indicate an ongoing attack, including suspicious login attempts or abnormal access to sensitive resources.

  ### Prioritization
  This alert should be treated as a high priority due to the nature of DC Sync operations, which, if successfully executed by an attacker, can lead to massive credential compromise, potential lateral movement, and broader network exploitation. Given the high impact of such actions, timely investigation is critical to protecting enterprise assets.

  ### Blind Spots and Assumptions
  Detection may be limited by the configuration and retention policy of Windows security logs, particularly if logs are not retained long enough to analyze patterns over time. Additionally, the detection logic assumes that service accounts and domain accounts adhering to the filters provided are properly managed, as valid usage of these accounts can lead to false positives. Organizations need to ensure that logging for Event ID 4662 is enabled and that appropriate permissions are monitored to achieve effective detection coverage.

