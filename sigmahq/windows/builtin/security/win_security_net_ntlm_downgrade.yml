note: |
  ### Technical Context

  This rule detects attempts to modify registry settings associated with NTLM authentication protocol, specifically targeting the modification of `LmCompatibilityLevel`, `NtlmMinClientSec`, and `RestrictSendingNTLMTraffic`. These alterations can enable a downgrade attack, allowing attackers to coerce systems to use weaker NTLM authentication methods, facilitating credential theft and replay attacks.

  The likely attacker objective is to disable or weaken security mechanisms in Windows systems to exploit vulnerabilities in the NTLM protocol, achieving persistent unauthorized access. This behavior aligns with MITRE ATT&CK tactics for Persistence (T1547) and Defense Evasion (T1203). The primary telemetry source is Windows Security Event logs, particularly Event ID 4657, which captures Object Name and Object Value changes in the registry concerning NTLM settings.

  If these modifications are confirmed malicious, it could lead to increased risk of credential theft or exploitation of sensitive systems. However, the detection alone does NOT confirm that the attempt was successful or that exploitation has occurred.

  ### Investigation Steps

  - **Review Event IDs 4657 for registry changes**: Look for entries with `ObjectName` containing `\REGISTRY\MACHINE\SYSTEM\ControlSet\Control\Lsa` and `ObjectValueName` being `LmCompatibilityLevel`, `NtlmMinClientSec`, or `RestrictSendingNTLMTraffic`. Note any recent modifications made.

  - **Validate recent changes against policy standards**: Compare the detected registry values with your organization's security policy. Legitimate settings for `LmCompatibilityLevel` typically should be set to a value that enforces strong NTLM security (e.g., 3 or 4).

  - **Cross-reference with user activity logs**: Check for user actions around the time of the registry change using Security Event ID 4720 (user account creation) or 4726 (user account deletion) to see if unauthorized accounts were involved in iterating these settings.

  - **Identify high-confidence malicious indicators**: Investigate if changes were made by accounts that are not typically involved in administrative activities, especially look for processes with unexpected user context in Event ID 4688 (process creation) that correspond with the event.

  - **Determine asset criticality**: Assess if the affected system is a domain controller or a host that processes sensitive NTLM traffic, heightening the impact of a potential compromise.

  - **Search for related suspicious network traffic**: Review network logs for unusual NTLM authentication requests or responses that might indicate exploitation attempts, using Sysmon Event ID 2 (Network Connections).

  ### Prioritization

  This alert is of high severity due to the direct impact on the integrity of authentication systems. The likelihood of malicious abuse is elevated, given that NTLM downgrade attacks are a common vector for exploitation. Such changes are frequently weaponized by attackers to enable further access to enterprise resources.

  ### Blind Spots and Assumptions

  Potential evasion techniques include manipulation of timestamps to mask changes or altering values directly by privileged users, which may bypass standard monitoring. Ensure that logging is configured correctly for auditing registry changes. Legitimate administrative activities or misconfigurations might trigger the alert when system updates are performed. A related detection for enhanced coverage is monitoring for Regular NTLM authentication failures, which can indicate ongoing exploitation attempts linked with these registry modifications.

