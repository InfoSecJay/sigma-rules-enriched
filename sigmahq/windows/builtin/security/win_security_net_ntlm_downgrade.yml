# Windows Security Eventlog: Process Creation with Full Command Line
logsource:
  product: windows
  service: security
  definition: 'Requirements: Audit Policy : Object Access > Audit Registry (Success)'
detection:
  selection:
    EventID: 4657
    ObjectName|contains|all:
    - '\REGISTRY\MACHINE\SYSTEM'
    - 'ControlSet'
    - '\Control\Lsa'
    ObjectValueName:
    - 'LmCompatibilityLevel'
    - 'NtlmMinClientSec'
    - 'RestrictSendingNTLMTraffic'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to certain registry values related to NTLM authentication, specifically targeting NetNTLM downgrade attacks. In this attack, adversaries attempt to manipulate the client's NTLM settings so they can exploit weaker authentication protocols, allowing them to intercept and misuse credentials. This behavior aligns with the MITRE ATT&CK techniques T1562.001 (Impair Defenses: Disable or Alter Tools) and T1112 (Modify Registry).

  The primary telemetry sources are Windows Security Event Log, specifically Event ID 4657 related to registry modifications. If the behavior is malicious, it poses a significant security risk as it may enable unauthorized authentication and access, undermining credential security. It is important to understand that this detection does NOT confirm successful credential theft; it only indicates a change to the registry which could facilitate such an outcome.

  ### Investigation Steps

  - **Review Event ID 4657:** Examine logs for Event ID 4657 from Windows Security, focusing on ObjectName containing '\REGISTRY\MACHINE\SYSTEM' and ObjectValueName for 'LmCompatibilityLevel', 'NtlmMinClientSec', or 'RestrictSendingNTLMTraffic'. Confirm whether these changes correspond to unauthorized activities.

  - **Identify Meanings of Registry Changes:** Determine the values set for 'LmCompatibilityLevel' and 'NtlmMinClientSec'. Values indicating a downgrade (like '0' or '1') could suggest malicious intent. Legitimate settings typically enforce higher security levels (like '3' or '5').

  - **Analyze the Source of Changes:** Investigate the associated user or process that made the modification. Check for unusual administrative logins or service account activity that may indicate insider threats or compromised accounts.

  - **Check for Other Malicious Indicators:** Look for related artifacts, such as failed authentication attempts and successful NTLM logins around the same time frame as the registry changes, from Security Event ID 4625 and 4624 respectively.

  - **Correlate with Related Alerts:** Cross-reference this event with related detection rules focused on credential dumping or lateral movement activities, utilizing companion rules such as the one related to AKM attacks (id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2).

  ### Prioritization

  This alert is of high severity due to its potential impact on system security. The modification of NTLM settings indicates a high likelihood of malicious intent, as such behavior is often exploited by adversaries aiming to weaken authentication mechanisms for lateral movement or credential theft. Review of historical data shows this behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may be limited by potential evasion techniques like using legitimate administrative privileges to alter registry settings. It requires proper logging configurations of the Windows Security Event Log to ensure reliable capture of all relevant events. Legitimate administrative changes or updates may inadvertently trigger this alert. A related detection focused on credential dumping activities may enhance overall coverage and context around potential exploitation.

