# Windows Security Eventlog: Process Creation with Full Command Line
logsource:
  product: windows
  service: security
  definition: 'Requirements: Audit Policy : Object Access > Audit Registry (Success)'
detection:
  selection:
    EventID: 4657
    ObjectName|contains|all:
    - '\REGISTRY\MACHINE\SYSTEM'
    - 'ControlSet'
    - '\Control\Lsa'
    ObjectValueName:
    - 'LmCompatibilityLevel'
    - 'NtlmMinClientSec'
    - 'RestrictSendingNTLMTraffic'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential NetNTLM downgrade attacks, which involve an attacker manipulating the authentication process to force a compromised system to use a less secure version of the NTLM protocol. By degrading the authentication mechanism, attackers can capture weaker hashes and perform relay or replay attacks to gain unauthorized access to network resources. A common objective of such an attack is to escalate privileges and maintain persistence within an environment by exploiting legacy authentication methods.

  Relevant MITRE ATT&CK techniques associated with this rule include **T1562.001 - Impair Defenses: Disable or Modify Tools** and **T1112 - Modify Registry**, as the downgrade attack is executed by modifying specific Windows registry keys related to NTLM settings. The primary data sources that can provide the best evidence for this detection include Windows Security Event Logs, specifically those logging process creation events that reveal registry modifications.

  ### Investigation Steps
  - **Review Security Logs**: Investigate Windows Security Event Logs for EventID 4657, which will show any modifications made to registry keys relevant to NTLM settings.
  - **Analyze Registry Changes**: Examine changes to `LmCompatibilityLevel`, `NtlmMinClientSec`, and `RestrictSendingNTLMTraffic` to determine if there have been unauthorized adjustments that may indicate a downgrade attack occurred.
  - **Correlate with Network Traffic**: Look for corresponding anomalous network traffic patterns that could indicate NTLM authentication attempts occurring under less secure settings after a potential registry modification.
  - **Assess User Accounts**: Identify user accounts that may have been exploited or impacted by the downgrade, and verify their recent logins and access patterns for any indicators of compromise.

  ### Prioritization
  This alert is considered high severity due to the significant risk it poses to an enterprise's security posture. A successful NetNTLM downgrade could facilitate unauthorized access to sensitive systems, leading to data breaches or lateral movement within the network.

  ### Blind Spots and Assumptions
  One potential gap is that this detection may not capture all variants or timing of NetNTLM downgrade attacks, especially if they are poorly logged or if other logging settings are not properly configured. The detection logic assumes that monitoring of these specific registry keys is adequately configured across all endpoints. The effectiveness of this rule relies on proper audit policies being enabled to capture object access events related to registry changes. If these logs are not being consistently collected, it may lead to undetected downgrades.

