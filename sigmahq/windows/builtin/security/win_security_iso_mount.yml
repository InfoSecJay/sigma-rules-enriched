logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Removable
    Storage" must be configured for Success/Failure'
detection:
  selection:
    EventID: 4663
    ObjectServer: 'Security'
    ObjectType: 'File'
    ObjectName|startswith: '\Device\CdRom'
  filter_main_generic:
    ObjectName:
    - '\Device\CdRom0\autorun.ico'
    - '\Device\CdRom0\setup.exe'
    - '\Device\CdRom0\setup64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Software installation ISO files
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the mounting of ISO images on Windows endpoints, specifically monitoring for access to certain executable files within the ISO (e.g., `autorun.ico`, `setup.exe`). Attackers may use ISO files to deliver malware, such as RATs, or to facilitate initial access to a target system. The associated MITRE ATT&CK techniques are Initial Access via Malicious Attachments (T1566.001).

  The primary telemetry source is Windows Security logs, particularly Event ID 4663, which captures object access events. A successful detection could indicate malicious malware delivery or software installation attempts, both of which can compromise system integrity. However, this detection alone does not confirm actual exploitation or malicious intent without further context and corroborating evidence.

  ### Investigation Steps

  - **Examine Event ID 4663: **Review Event ID 4663 from Security logs for Object Name starting with `\Device\CdRom`. Time, user account, and remote source IP might provide initial context regarding the legitimacy of the mount.

  - **Identify malicious indicators: **Focus on Object Name entries for `\Device\CdRom0\setup.exe` or `\Device\CdRom0\setup64.exe`. If these entries are detected, investigate the process creation (Event ID 4688 or Sysmon Event ID 1) associated with these ISO mounts.

  - **Assess legitimate software installations: **Confirm if the ISO mount corresponds with known software installation practices. Look for documented software versions and installation times that match records. If legitimate software like operating system updates or corporate tools are being installed, mark as benign.

  - **Cross-reference user behavior: **Investigate the user account triggering the event and analyze the account's recent activities. Review logs for a typical role's expected behavior, including time of day and network activity aligning with normal work hours.

  - **Seek corroborative telemetry: **Check for any other related events during the same timeframe like suspicious file downloads (Web Proxy logs featuring file types or sources) leading up to the ISO mount as indicative of prior malicious activity.

  ### Prioritization

  This alert has medium severity due to the potential risk associated with unauthorized executable files being executed on critical systems. The likelihood of malicious exploitation is significant, especially since attackers frequently use ISO images as part of their delivery mechanisms. However, the prevalence of legitimate software installations can dilute the threat context.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers employ alternative file formats or encoding techniques to avoid detection. Proper configuration of security logging is essential for reliable detection; specifically, the 'Audit Removable Storage' policy must be enabled. Legitimate activities, such as authorized software deployments or imaging processes, can trigger the alert. A related detection mechanism might involve monitoring for unusual file creation logs (like .exe execution from mounting activities), strengthening investigation insights.

