detection:
  selection:
    EventID: 4663
    ObjectServer: 'Security'
    ObjectType: 'File'
    ObjectName|startswith: '\Device\CdRom'
  filter_main_generic:
    ObjectName:
    - '\Device\CdRom0\autorun.ico'
    - '\Device\CdRom0\setup.exe'
    - '\Device\CdRom0\setup64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Software installation ISO files
level: medium
note: |
  ---

  ### Technical Context

  This detection identifies the mounting of an ISO image file on a Windows endpoint. Attackers may utilize ISO files to deliver malware or facilitate unauthorized access, exploiting known vulnerabilities during the initial access phase of an attack lifecycle. The relevant MITRE ATT&CK tactic is **Initial Access**, with technique ID **T1566.001** (Phishing: Spear Phishing Attachment). The primary telemetry source for this detection is Windows Security Event ID **4663**, which tracks object access and requires the advanced audit policy for removable storage to be enabled. Malicious activity could lead to data exfiltration or the installation of persistent malware. However, this detection does NOT confirm malicious intent on its own; legitimate software installations may also trigger this event.

  ---

  ### Investigation Steps

  - **Review Event ID 4663 logs:** Check for access type indicating the mount of ISO files, focusing on ObjectName starting with `\Device\CdRom`. Confirm if the mounted ISO is from a trusted source or a known malicious repository.

  - **Identify the file name and path:** Look specifically for signs of unusual executables or autorun files (`autorun.ico`, `setup.exe`, `setup64.exe`) in the ObjectName field. Benign examples include standard software installation ISOs from recognized vendors.

  - **Correlate with email activity:** Investigate recent emails accessed by the user. Look for any patterns indicating spear-phishing campaigns associated with known malicious ISO attachments that could lead to this behavior.

  - **Monitor user behavior:** Check recent login sessions and user activity leading to the event. Determine if the user has administrative privileges, which could indicate a higher risk if they process untrustworthy files.

  - **Validate installation artifacts:** If the investigation leans toward malicious, confirm the presence of any associated artifacts post-mounting, such as new processes spawned or files created (e.g., malware installers), which may be located in `C:\Users\<username>\AppData\Local\Temp\`.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on endpoints that could be compromised by malware. The likelihood of malicious abuse is moderate, as attackers increasingly exploit ISO files to bypass traditional security mechanisms. Although software installation is common, discrepancies should be thoroughly investigated.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate software installations can trigger the same event. Evasion techniques may include using encrypted or obscure ISO contents that don’t raise suspicion during traditional checks. To ensure reliable detection, audit policies must be properly configured to log ISO mount activity. Related detection for further coverage includes monitoring for suspicious executable creations that follow the mounting of ISO files, particularly through Event ID **4688** for process creation.

