title: ISO Image Mounted
id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
status: test
description: Detects the mount of an ISO image on an endpoint
references:
- https://www.trendmicro.com/vinfo/hk-en/security/news/cybercrime-and-digital-threats/malicious-spam-campaign-uses-iso-image-files-to-deliver-lokibot-and-nanocore
- https://www.proofpoint.com/us/blog/threat-insight/threat-actor-profile-ta2719-uses-colorful-lures-deliver-rats-local-languages
- https://twitter.com/MsftSecIntel/status/1257324139515269121
- https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1553.005/T1553.005.md#atomic-test-1---mount-iso-image
author: Syed Hasan (@syedhasan009)
date: 2021-05-29
modified: 2023-11-09
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Removable
    Storage" must be configured for Success/Failure'
detection:
  selection:
    EventID: 4663
    ObjectServer: 'Security'
    ObjectType: 'File'
    ObjectName|startswith: '\Device\CdRom'
  filter_main_generic:
    ObjectName:
    - '\Device\CdRom0\autorun.ico'
    - '\Device\CdRom0\setup.exe'
    - '\Device\CdRom0\setup64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Software installation ISO files
level: medium
note: |
  ### Technical Context
  This detection rule identifies the mounting of ISO images on a Windows endpoint, which can potentially indicate malicious activities such as the execution of a payload or the delivery of malware. Attackers often utilize ISO files for initial access to systems, enabling them to deploy Remote Access Trojans (RATs) like Lokibot or NanoCore. The detection logic looks for specific security event logs that document when an ISO image is mounted, particularly focusing on the associated executable files that are commonly used in attack scenarios.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and **Phishing** (T1566.001), as malware delivery through ISO images often relies on phishing campaigns to gain access. Additionally, malicious practices involving ISO files usually leverage techniques such as **Exploitation for Client Execution** (T1553.005), highlighting the need for careful scrutiny of ISO mounting and associated activities.

  Primary data sources for this detection are Windows security logs, specifically observing event ID 4663, which signifies file access attempts. To successfully utilize this detection rule, proper logging configurations must be enabled to capture and audit removable storage activities.

  ### Investigation Steps
  - **Review Event Logs:** Analyze Windows Security Event ID 4663 for instances of ISO images being mounted. Pay attention to the `ObjectName` to identify any suspicious file paths pointing to executed payloads.
  - **Examine Executed Files:** Investigate the processes initiated from the mounted ISO, specifically looking for known malicious executables such as `setup.exe` or `autorun.ico`. Correlate these with threat intelligence to assess their legitimacy.
  - **Check User Context:** Identify the user account that mounted the ISO. Determine whether the user has a legitimate reason to perform this action, and assess for any anomalous behavior associated with the user's activities before and after the mount event.
  - **Monitor Network Activity:** Investigate outgoing connections associated with the mounted ISO. Look for potential C2 communications or data exfiltration attempts that may indicate compromise or lateral movement.

  ### Prioritization
  This alert carries a medium severity level, as the mounting of ISO files can often be benign, such as software installations. However, given the increasing use of ISO mounts in phishing campaigns and malware distribution, any unexpected activity should be treated with importance to prevent potential breaches.

  ### Blind Spots and Assumptions
  One potential blind spot is the reliance on the configuration of audit policies; if the "Audit Removable Storage" setting is not properly enabled, this detection may not trigger as expected. Additionally, there is an assumption that ISO file mounting through legitimate means (e.g., software installations) may lead to false positives. Organizations should ensure event log collection for the relevant security logs, as a lack of data may hinder the detection of this potential threat.

