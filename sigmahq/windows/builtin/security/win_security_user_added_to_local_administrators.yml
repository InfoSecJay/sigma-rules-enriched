  ---

  ### Technical Context

  This Sigma rule detects the addition of a user to the local Administrators group on a Windows system, which could indicate either legitimate activity or malicious privilege escalation. The likely attacker objective may include gaining elevated permissions on the system to execute unauthorized actions or maintain persistence. This behavior aligns with the MITRE ATT&CK tactic of **Privilege Escalation (T1068)** and technique **Valid Accounts (T1078)**.

  The primary telemetry source is Windows Security Event logs, focusing on **Event ID 4732**. If this activity is malicious, it can compromise the integrity of the system and lead to unauthorized access to sensitive resources. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger the same alert.

  ---

  ### Investigation Steps

  - **Check the event context: **Review Event ID 4732 in the Windows Security logs to identify the `SubjectUserName` making the change, along with the `TargetUserName` added to the Administrators group. Valid entries should come from known administrative accounts.

  - **Validate user role: **Cross-reference the user `TargetUserName` who was added against your organization's role and permissions policies. Legitimate administrators will generally have documented roles; unauthorized accounts or non-administrative accounts being added are red flags.

  - **Identify the source of changes: **Inspect the `SubjectDomainName` and `SubjectUserName` fields in Event ID 4732. Modifications made by `Domain Admins` or other legitimate administrative accounts may be acceptable, while local or service accounts could indicate potential misuse.

  - **Look for patterns or anomalies: **Check for multiple rapid additions or removals from the local Administrators group in a short timeframe. This could indicate malicious activity. Review telemetry for related Activity logs (especially around other `Event ID 4634` logs which indicate logoff behavior).

  - **Assess system criticality: **Determine if the impacted system is a critical asset (e.g., a server hosting sensitive applications). If so, prioritize investigation to avoid escalation.

  - **Check for file changes: **Investigate any new or unexpected files created in system directories (e.g., `C:\Program Files\` or `C:\Windows\`) or unexpected execution of processes using **Sysmon Event ID 1** within a timeframe close to the addition of the new user to the Administrators group.

  ---

  ### Prioritization

  This alert is medium severity because unauthorized privilege escalation can lead to significant security risks, especially if it involves critical systems. The likelihood of malicious abuse in contexts where unverified accounts are added is high, particularly if it aligns with other suspicious activities.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques include using legitimate administrative accounts for unauthorized changes, making it difficult to distinguish between benign and malicious activity. Reliable detection depends on proper logging configurations to capture Event ID 4732 across all relevant endpoints. Legitimate activities, such as administrative account management during an employee onboarding, may inadvertently trigger this alert. A companion detection to consider is unexpected logon events via **Event ID 4624**, which can help correlate potential unauthorized access related to privilege changes.

