detection:
  selection_eid:
    EventID: 4732
  selection_group:
  - TargetUserName|startswith: 'Administr'
  - TargetSid: 'S-1-5-32-544'
  filter_main_computer_accounts:
    SubjectUserName|endswith: '$'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the addition of a new member to the local administrator group in a Windows environment. Such activity can be legitimate, often performed during routine administrative tasks; however, it may also indicate malicious intent, particularly if unauthorized users gain elevated privileges. Understanding the context of why a user was added to the local administrator group is crucial for distinguishing between benign and malicious actions.

  Attackers target local administrator groups to gain elevated access to systems, facilitating further infiltration or lateral movement within a network. This behavior is aligned with the MITRE ATT&CK framework, particularly the techniques associated with **T1078: Valid Accounts**, **T1098: Account Manipulation** (for changing or creating accounts), and techniques related to **initial access** and **privilege escalation**. As such, detecting changes in local administration can be critical in identifying ongoing attacks.

  Primary data sources for this detection include Windows security logs, particularly event ID 4732, which logs the addition of a user to the local security group. Monitoring these logs allows for the identification of all changes in membership to critical user groups like the local Administrators group.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Security event logs for Event ID 4732 to identify the details of the user added to the local administrator group, including the responsible account and the timestamp of the action.
  - **Analyze User Context**: Look into the history of the user account added for any previous suspicious behavior or privilege escalations that might indicate a compromised account.
  - **Correlate Network Activity**: Investigate network traffic along with other logs, such as EDR or firewall logs, to uncover any abnormal connections or behaviors associated with the newly added account, especially focusing on outbound connections to external IPs.
  - **Cross-Reference with IAM Policies**: Validate whether the addition aligns with organizational policies and whether any recent administrative changes were communicated, ensuring there are no overlooked discrepancies.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized privilege escalation, which could lead to significant security incidents. The likelihood is heightened in enterprise environments where administrative credentials can be leveraged for further attacks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where security logging is not adequately configured or where logs are not retained for sufficient durations. The detection logic assumes that all administrative activities are properly logged and that the normal functionality of accounts does not obscure suspicious changes. Ensuring comprehensive logging of security events, particularly event ID 4732 for local group changes, is essential for this alert to be effective.

