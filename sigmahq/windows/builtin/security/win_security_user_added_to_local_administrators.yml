level: medium
note: |
  ### Technical Context

  This rule detects the addition of a user to the local Administrator group on Windows systems, which can indicate unauthorized privilege escalation attempts. Attackers may seek to elevate their privileges for further access or control over a target system, thereby compromising its security. This activity fits into the MITRE ATT&CK framework under the following tactic and technique: **Privilege Escalation** (TA0004, T1078 - Valid Accounts).

  The primary telemetry source required for detection is Security Event Logs, specifically Event ID 4732, which logs changes to local group memberships. The security impact of this behavior can be significant, as unauthorized users in the Administrator group may assume full control over the system, potentially leading to additional malicious actions such as lateral movement and data exfiltration. It is important to note that this detection alone does not confirm malicious intent, as the addition could be part of legitimate administrative activities.

  ### Investigation Steps

  - **Review Security Event ID 4732 logs:** Check for evasion where `TargetUserName` starts with 'Administr' and confirm the modification was not made to a computer account (i.e., does not end with '$'). Identify legitimate administrative activities in a baseline context.

  - **Cross-reference against known administrative actions:** Compare the event with recent Change Management records or system administration logs to investigate if the change had prior approval or documentation attached.

  - **Analyze recent logins of the user:** Look for Security Event ID 4624 (successful login) for the user in question to establish if their access pattern is aligned with expected administrative duties or if they exhibit unusual behavior (e.g., multiple login attempts across different hosts).

  - **Investigate Object SID and privilege characteristics:** Examine the `TargetSid` field to ensure that privilege changes align with organizational policies. Be on the lookout for anomalies in typical user roles.

  - **Check for subsequent suspicious activities:** Verify if there are any other correlating events (e.g., Event ID 4656 - Handle Opened) that suggest further actions post-registration. Malicious activity may include file access or alterations by the newly added user.

  - **Understand expected behavior for user lifecycle:** Document the standard operational processes for adding users to the local Administrator group within the organization. This will help to establish a benchmark for assessing deviations that may indicate malicious intent.

  ### Prioritization

  The alert has medium severity due to its potential impact on critical systems through unauthorized privilege escalation, which is a common tactic employed by adversaries to gain foothold and persistence. Given that the local Administrator group is critical for system control, this behavior warrants immediate investigation but may also encompass legitimate user modifications.

  ### Blind Spots and Assumptions

  Detection could be limited by the configuration of logging on target systems; missing or improperly configured Security Event Logs might fail to generate the required evidence. Legitimate administrative activities, especially during routine maintenance operations, may trigger this alert, complicating the investigation. Additionally, adversaries might employ techniques to evade detection, such as using credentialed accounts that are less likely to raise alarms. A companion detection to consider is tracking user logon events (Event ID 4624), as it helps establish a comprehensive view of the user's actions surrounding the privilege change.

