logsource:
  product: windows
  service: security
detection:
  selection_eid:
    EventID: 4732
  selection_group:
  - TargetUserName|startswith: 'Administr'
  - TargetSid: 'S-1-5-32-544'
  filter_main_computer_accounts:
    SubjectUserName|endswith: '$'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the event where a user is added to the local Administrator group on a Windows machine, identified by Security Event ID 4732. Such activity can indicate that an attacker is attempting to escalate privileges or maintain persistence within the environment. The relevant MITRE ATT&CK techniques include T1078 (Valid Accounts) for credential use and T1098 (Account Manipulation) for unauthorized addition to administrative groups.

  The primary telemetry source for this detection is Windows Security logs that capture event IDs associated with group membership changes. If malicious, adding users to the local Administrator group could allow unauthorized access to system-level privileges, enabling broader compromise of the affected host and potentially the network. It is important to note that this detection alone does not confirm malicious intent without further context or additional corroborating evidence.

  ### Investigation Steps

  - **Review Security Event ID 4732 logs**: Look for Event ID 4732 in Security logs on the affected host. Check the `TargetUserName` and `SubjectUserName` fields to ascertain who was added and who performed the addition.

  - **Identify recent administrative actions**: Investigate the timeline of account modifications by analyzing other related Event IDs (e.g., Event ID 4728 for group membership changes) around the same time to correlate patterns of activity that may indicate legitimate or malicious actions.

  - **Assess user account legitimacy**: Determine if the user added to the local Administrators group has a justified business reason for that privilege, such as IT personnel performing necessary administrative tasks, by checking account creation logs (Event ID 4720) and reviewing account roles.

  - **Check for automation or scripting tools**: Investigate whether PowerShell (Event ID 4104) or command-line tools were used that's not typical for the user. This can indicate potential abuse if unusual commands like `net localgroup Administrators /add` were executed.

  - **Examine asset criticality**: Ensure the asset where this event occurred is determined to be sensitive or high-value. Review the configuration and permissions of critical systems to prioritize your investigation on potential escalations on more impactful hosts.

  ### Prioritization

  This alert is classified as medium severity due to the potential for significant impact if a non-legitimate user gains administrative privileges. While this activity can be indicative of misuse, it may also occur in benign contexts, necessitating careful review of the user and context before escalation.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where credentials are exploited without an explicit membership change, and it may not capture automated administrative scripts that don't trigger logging. Proper logging configurations, including auditing for both successful and failed privilege changes, are necessary for reliable detection. Authorization scenarios, such as legitimate user account updates for admins by another admin, might trigger this alert. Complementing this rule with detections for unusual logon patterns (e.g., Event ID 4624) can provide additional context and improve detection fidelity.

