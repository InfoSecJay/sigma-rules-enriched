note: |
  ### Technical Context
  This detection rule focuses on identifying the use of the spoolss named pipe over SMB, which can signify potential lateral movement attempts within a network. Attackers may leverage this technique to facilitate NTLM authentication, allowing them to impersonate other users or services, especially in environments with misconfigured Active Directory settings. By exploiting the spoolss named pipe, malicious actors can gain unauthorized access to resources or escalate privileges within a compromised network.

  The relevant MITRE ATT&CK tactics for this detection include **Lateral Movement** (TA0008), specifically the technique **Lateral Movement - SMB/Windows (T1021.002)**. By monitoring specific event logs related to SMB operations, defenders can gain insights into suspicious activities that may indicate an ongoing attack. Primary data sources for this detection include security event logs from Windows systems, particularly those capturing the EventID 5145, which logs file share access and connection attempts over SMB.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows security logs for EventID 5145 entries that correspond to access attempts to the \\*\IPC$ share and verify the user and machine involved in the connection.
  - **Analyze SMB Activity**: Investigate any unusual SMB traffic patterns or connections to the spoolss named pipe from unexpected machines, which may indicate unauthorized access attempts.
  - **Cross-reference User Activity**: Correlate the identified SMB connections with user account activity to determine if any accounts exhibit behavior typically associated with lateral movement and unauthorized privilege escalation.
  - **Examine Stored Credentials**: Look for any potential NTLM authentication attempts that might indicate the use of credential dumping tools or replay attacks, particularly focusing on machines with spoolservice enabled.

  ### Prioritization
  The severity of this alert is marked as medium due to the significant impact that successful lateral movement can have in an enterprise environment. The ability for an attacker to access multiple systems or escalate privileges raises the likelihood of further compromising sensitive data or critical infrastructure.

  ### Blind Spots and Assumptions
  Current detection logic may not adequately cover scenarios where spoolservice is disabled or if attackers utilize alternative methods for lateral movement. Additionally, there is an assumption that the proper logging configurations for EventID 5145 are enabled across Windows systems. Ensuring comprehensive coverage in security logging is essential for this rule to function effectively and accurately detect potential malicious activity.

