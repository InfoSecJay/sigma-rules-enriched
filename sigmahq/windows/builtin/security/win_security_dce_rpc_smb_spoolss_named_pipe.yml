logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName: spoolss
  condition: selection
falsepositives:
- 'Domain Controllers acting as printer servers too? :)'
level: medium
note: |
  ### Technical Context

  This Sigma rule detects access to the spoolss named pipe over SMB, which can indicate an attempt to exploit Windows RPC (Remote Procedure Call) services for lateral movement within a network. The likely attacker objective is to leverage the spool service to authenticate to remote systems using NTLM, typically as a precursor to executing further actions on compromised systems. This behavior aligns with the MITRE ATT&CK technique for Lateral Movement via "Remote Procedure Call (RPC)" (T1021.002).

  The primary telemetry source is Windows Security Event Logs, specifically Event ID 5145 indicating file share access; relevant fields include ShareName and RelativeTargetName. If malicious, this may allow unauthorized access to system resources or facilitate credential theft. Importantly, this detection alone does not confirm malicious intent; it merely indicates that an RPC named pipe connection attempt has occurred.

  ### Investigation Steps

  - **Identify the source of the connection:** Review Event ID 5145 in Windows Security Logs focusing on Source Address and File Share fields. Analyze connections originating from external or unexpected hosts, which could indicate potential malicious activity.

  - **Check for legitimate use cases:** Determine if the affected system is operating as a print server. Domain Controllers might naturally log these events due to spool service activity; verify that the system's role aligns with its expected behavior.

  - **Correlate with authentication logs:** Investigate Security Event IDs 4624 (Logon) and 4625 (Logon failure) to check if there is a suspicious pattern of credential use that coincides with the spoolss pipe access. High volumes of failed access attempts could indicate credential abuse.

  - **Examine process and service activity:** Use Sysmon Event ID 1 to track the creation of processes and services that could leverage the spool service for malicious purposes. Look for child processes initiated from legitimate services like `spoolsv.exe` exhibiting unusual behavior.

  - **Assess asset criticality:** Consider the importance of the systems involved. If the operation is observed on critical systems like Domain Controllers, elevate the investigation priority due to the potential impact of a successful lateral movement.

  ### Prioritization

  This alert should be treated as medium severity. The impact could be significant if an adversary successfully gains unauthorized access to systems using the spool service. Additionally, the technique is commonly weaponized during lateral movement across networks, amplifying the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environment-specific configurations; if logging for SMB events is not enabled, genuine access attempts may not be captured. Similarly, legitimate administrative or development activities may trigger this alert, especially in multi-purpose servers. Ensuring that Event ID 5145, along with other relevant authentication logs, are consistently captured and reviewed will enhance detection capabilities. Related detections for suspicious SMB traffic or abnormal NTLM authentication attempts can provide additional context and bolster overall security monitoring.

