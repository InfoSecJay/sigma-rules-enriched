  ---

  ### Technical Context

  This Sigma rule detects the use of the spoolss named pipe over SMB, which is often used by attackers to conduct lateral movement within a network. The objective of leveraging this mechanism typically involves exploiting NTLM authentication vulnerabilities to gain unauthorized access to resources across machines with the spool service enabled. This behavior falls under the MITRE ATT&CK framework's "Lateral Movement" tactic, specifically technique T1021.002 (SMB/Windows Admin Shares).

  The primary telemetry source for this detection is Windows Security logs, specifically Event ID 5145, which records file sharing activity. If malicious, the security impact could include unauthorized access to sensitive systems or data compromise. It is important to note that this detection alone does not confirm malicious intent; it merely indicates that the specific named pipe was accessed and requires further investigation.

  ---

  ### Investigation Steps

  - **Review Event ID 5145 details:** Check the security logs for Event ID 5145. Look for the ShareName set to `\\\\*\\IPC$` and RelativeTargetName equal to `spoolss`. Confirm if the initiating process is expected or anomalous.

  - **Verify the source IP and hostname:** Identify the source of the alert by examining the originating IP and hostname for unusual or unauthorized machines attempting to access the spoolss pipe.

  - **Assess legitimate business activity:** Determine if recent printer activities were legitimate, particularly on servers or workstations known to host shared printers or services that interact with spooling. Such activity typically involves consistent access patterns from authorized administrative accounts.

  - **Check for high-confidence malicious indicators:** Discover if the requesting accounts or processes associated with this alert link to known lateral movement techniques or prior incidents. Patterns such as multiple failed authentication attempts or unusual timings may indicate malicious intent.

  - **Correlate with other telemetry:** Cross-reference Windows Security logs with Sysmon Event ID 1 (Process Creation) to track related command-line arguments or paths indicative of tool usage consistent with lateral movement strategies.

  - **Inspect account privileges:** Analyze access rights for the involved accounts to ensure they align with the organizational policy. Pay attention to accounts that possess more privileges than necessary for routine operations, particularly those accessing sensitive shares without clear need.

  ---

  ### Prioritization

  This alert should be treated with medium priority in an enterprise context due to the potential security implications of unauthorized lateral movement. The affected systems could have significant access to sensitive data, increasing the likelihood of malicious abuse if not monitored closely. While this behavior can be weaponized, it also occurs in legitimate scenarios that require careful investigation to avoid false positives.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential use of legitimate tools or services that operate over the spoolss pipe, leading to false positives. Comprehensive logging configurations must be enabled for Windows Security events for reliable detection. Legitimate administrative activities, such as routine printer testing or backend processes requiring spooler access, may trigger this alert. A companion detection involving alerts on NTLM authentication attempts or remote service calls could strengthen overall coverage and provide a more complete threat picture.

