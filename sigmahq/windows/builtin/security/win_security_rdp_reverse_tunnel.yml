detection:
  selection:
    EventID: 5156
  sourceRDP:
    SourcePort: 3389
    DestAddress:
    - '127.*'
    - '::1'
  destinationRDP:
    DestPort: 3389
    SourceAddress:
    - '127.*'
    - '::1'
  filter_app_container:
    FilterOrigin: 'AppContainer Loopback'
  filter_thor:    # checking BlueKeep vulnerability
    Application|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  condition: selection and ( sourceRDP or destinationRDP ) and not 1 of filter*
falsepositives:
- Programs that connect locally to the RDP port
level: high
note: |
  ### Technical Context
  This rule detects potentially suspicious Remote Desktop Protocol (RDP) traffic occurring over a reverse SSH tunnel on Windows systems. Specifically, it identifies instances where the `svchost` process manages RDP services, with traffic directed toward the loopback address (127.0.0.1). This scenario may indicate an attacker leveraging reverse tunneling to disguise unauthorized remote access and lateral movement within the network. The attacker’s objective could be to exfiltrate data, maintain persistence, or escalate privileges without being detected by traditional network monitoring tools.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Defense Evasion** (T1105): Using reverse tunnels to evade detection.
  - **Command and Control** (T1090.001): Covertly establishing communication channels within a compromised environment.
  - **Lateral Movement** (T1021.001): Utilizing RDP for moving laterally across systems in a network.

  Primary data sources include Windows Event Logs, specifically filtering for security-related events indicating process creation, network connections, and firewall activities, which provide clear evidence of outgoing and incoming connections on RDP ports.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Event ID 5156 logs to identify RDP traffic associated with the `svchost` process. Look for connections that originate from or are directed to the loopback address (127.0.0.1).

  - **Analyze Process Activity**: Investigate the execution of `thor.exe` or `thor64.exe` to confirm whether any related malware or tools are being used. Verify the legitimacy of the process by assessing its path and associated parent processes.

  - **Correlate Network Activity**: Examine network flow logs and firewall logs to identify any anomalous outbound connections on TCP port 3389 originating from internal machines, particularly those hosting RDP services.

  - **Monitor for Uncommon Applications**: Identify and scrutinize any legitimate applications utilizing RDP in unusual patterns. Pay attention to instances where RDP connections are made from unexpected hosts or user accounts.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the potential for unauthorized access and lateral movement that could lead to data breaches or system compromises. The use of reverse tunnels is particularly insidious as it can evade conventional security measures, indicating a substantial risk to the organization's information security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the reliance on Event ID 5156 logs; if these logs are not properly captured or retained, detecting this behavior may be challenging. The detection logic assumes the attacker is using common paths for malicious processes (like `thor.exe`), meaning variations or less recognized tools could bypass detection. Additionally, local RDP connections initiated by legitimate applications may generate false positives, and thorough investigation is necessary to validate the context of the alerts. Proper configuration of logging and firewall settings is crucial to ensure that all relevant network activity is captured for analysis.

