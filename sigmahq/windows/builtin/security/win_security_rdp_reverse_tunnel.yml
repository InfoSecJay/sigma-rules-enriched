  ---

  ### Technical Context

  This Sigma rule detects attempts to establish Remote Desktop Protocol (RDP) connections using the svchost process running under a loopback address (127.0.0.1). Such activity may indicate a lateral movement technique or a command-and-control (C2) method used by adversaries in an enterprise environment. The likely objective of the attacker is to access systems internally while evading detection using the local host's network interface.

  The relevant MITRE ATT&CK tactic is “Command and Control” under technique ID T1090.001 (Multi-hop Proxy) and T1090.002 (Reverse Proxy), as well as “Lateral Movement” under technique ID T1021.001 (Remote Services). The primary telemetry sources are Windows security logs, specifically Event ID 5156, which logs firewall events related to connections. If this behavior is malicious, it may lead to unauthorized access or manipulation of sensitive systems within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate local applications may also use RDP connections.

  ---

  ### Investigation Steps

  - **Review Event ID 5156 logs for RDP connections:** Look for entries indicating a connection initiated on SourcePort 3389 and either SourceAddress or DestAddress as 127.*. Note the process initiating the connection (e.g., svchost) for further contextual analysis.

  - **Validate network behavior:** Confirm whether this RDP connection attempt is expected behavior. Check for any legitimate applications on the host that typically connect to the RDP port, such as local administrative tools or virtualization management software.

  - **Identify high-confidence malicious indicators:** Investigate connections where the destination address is the loopback interface (127.0.0.1) alongside process names ending in 'thor.exe' or 'thor64.exe', which are associated with the exploitation of vulnerabilities like BlueKeep.

  - **Cross-reference with other logs:** Check security logs for anomalous usage of RDP by non-administrative accounts. Look for related authentication events (Security Event ID 4624) to identify unusual logon behaviors.

  - **Assess system criticality and host role:** Determine if the affected system is a critical server or workstation that handles sensitive information. Elevated risks are present if the system has administrative functionalities.

  - **Verify application behavior post-connection:** If a suspicious RDP connection is confirmed, look for artifacts of malicious actions or subsequent connections, such as file creation or modification logs in Windows (Event ID 4663) to identify any unauthorized access or data exfiltration.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for compromised systems used to establish unauthorized remote access. The configuration suggests that connections through RDP using local loopback addresses are atypical and indicate a method commonly used in lateral movement tactics by attackers. The likelihood of malicious abuse is elevated given the nature of the process and looping connections.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications accessing RDP services locally, leading to potential false positives. Reliable detection requires proper log source configuration for capturing Event ID 5156. Activities like legitimate administrative troubleshooting or user access through local RDP can trigger this alert, confusing its interpretation. A related detection to consider is monitoring for unusual inbound/outbound connections identified via Windows Firewall configuration changes (Event ID 4907) to strengthen overall coverage against this technique.

