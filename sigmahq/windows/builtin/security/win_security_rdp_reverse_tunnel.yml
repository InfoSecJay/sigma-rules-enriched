logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5156
  sourceRDP:
    SourcePort: 3389
    DestAddress:
    - '127.*'
    - '::1'
  destinationRDP:
    DestPort: 3389
    SourceAddress:
    - '127.*'
    - '::1'
  filter_app_container:
    FilterOrigin: 'AppContainer Loopback'
  filter_thor:    # checking BlueKeep vulnerability
    Application|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  condition: selection and ( sourceRDP or destinationRDP ) and not 1 of filter*
falsepositives:
- Programs that connect locally to the RDP port
level: high
note: |
  ### Technical Context

  This rule detects the use of Remote Desktop Protocol (RDP) over a reverse SSH tunnel, which can indicate an attempt by an adversary to establish a covert connection to a target system while operating within a local network. The likely objective is to facilitate unauthorized access to the system or conduct lateral movement, maintaining persistence through command-and-control (C2) channels. The relevant MITRE ATT&CK tactics and techniques are **Command and Control** (TA0011) and **Exfiltration over Alternative Protocol** (T1041).

  Primary telemetry sources include Windows Security event logs, specifically looking for **Event ID 5156**, which logs Windows Filtering Platform (WFP) events related to network traffic. The security impact of successful malicious activity could result in unauthorized access to sensitive information or compromise multiple systems within the network. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; legitimate applications may also connect locally using RDP.

  ### Investigation Steps

  - **Check Event ID 5156 occurrences:** Review Windows Security logs for Event ID 5156. Look for entries where `SourcePort` is 3389 (RDP) and `DestAddress` is 127.0.0.1 or ::1, indicating local RDP connections. Flag any unusual patterns, especially if multiple attempts are logged in rapid succession.

  - **Correlate with process creation logs:** Retrieve Sysmon Event ID 1 logs to identify any `svchost.exe` processes that are handling RDP connections. Validate if this process is legitimate by cross-referencing its parent process. Malicious indicators include unexpected parent processes or uncommon executable paths.

  - **Assess for legitimate RDP use:** Compare against expected behavior for hosts running known server roles (e.g., Remote Desktop Services). Legitimate activity typically involves established RDP sessions from trusted remote management tools at standard times.

  - **Investigate associated file activity:** Check for any file operations, such as creation or modification, associated with telemetries that correspond to RDP usage. Utilize Sysmon logs to track suspicious file activity linked to `thor.exe` or `thor64.exe`, as these are indicative of potential exploitation attempts.

  - **Review firewall/logging configurations:** Ensure that logging for WFP is properly configured to capture necessary telemetry. Misconfigurations could lead to undetected malicious behaviors or legitimate activities being erroneously flagged.

  ### Prioritization

  This alert is of high severity due to the potential impact if malicious activity is confirmed, especially on critical systems that could be compromised. The behavior outlined is not commonly used for benign purposes and is often weaponized by adversaries to exploit weaknesses in remote access configurations.

  ### Blind Spots and Assumptions

  There are limitations with detection if logs are not configured to capture all WFP events or if local connections go undetected. Legitimate administrative activities, such as IT personnel using RDP for maintenance, may trigger the alert. Related detections could include monitoring for unusual outbound connections or instances of privilege escalation, which help provide a fuller picture of the activity landscape.

