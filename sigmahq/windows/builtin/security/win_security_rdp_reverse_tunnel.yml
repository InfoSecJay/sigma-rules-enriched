logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5156
  sourceRDP:
    SourcePort: 3389
    DestAddress:
    - '127.*'
    - '::1'
  destinationRDP:
    DestPort: 3389
    SourceAddress:
    - '127.*'
    - '::1'
  filter_app_container:
    FilterOrigin: 'AppContainer Loopback'
  filter_thor:    # checking BlueKeep vulnerability
    Application|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  condition: selection and ( sourceRDP or destinationRDP ) and not 1 of filter*
falsepositives:
- Programs that connect locally to the RDP port
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious Remote Desktop Protocol (RDP) activity using the Windows Filtering Platform (WFP) that indicates the potential use of a reverse SSH tunnel via a local connection. The likely objective of an attacker would be to establish a covert channel to maintain access or control over the compromised system while evading detection. This activity aligns with the MITRE ATT&CK tactics of Command and Control (T1071), Lateral Movement (T1021.001), and Exfiltration Over Command and Control Channel (T1041).

  The primary telemetry sources are Windows Security Event logs, specifically looking for Event ID 5156, which logs WFP data related to network connections. If malicious, this behavior could indicate an attacker controlling a system internally and setting it up for lateral movement or exfiltration. It is critical to note that this detection alone does not confirm that malicious activity is occurring; it merely identifies potential misuse of RDP over a loopback interface.

  ### Investigation Steps

  - **Review Event Logs for RDP Connections:**
    Check for Event ID **5156** in Windows Security logs, filtering for the use of **source or destination IP addresses** starting with `127.*` or `::1` and **port 3389**. Look for repeated or unexpected entries, indicating potential misuse.

  - **Identify the Process Using RDP:**
    Investigate the parent process associated with the `svchost.exe` instance hosting RDP termsvcs. Examine process command lines for unexpected parameters or suspicious examples, especially on critical systems.

  - **Analyze Network Activity:**
    Utilize network analysis tools (e.g., Wireshark) to monitor inbound and outbound traffic on port **3389**. Validate that legitimate traffic originates from trusted internal systems and identify any anomalous or unauthorized sources.

  - **Check for Known Vulnerability Exploits:**
    Look for executables such as **thor.exe** or **thor64.exe** in combination with RDP traffic in the logs. The presence of these files along with an RDP connection indicates a probable attempt to leverage vulnerabilities (e.g., BlueKeep).

  - **Validate Legitimate Use Cases of RDP:**
    Determine if the RDP connections are expected by reviewing the asset's role and its authorized usage. Validate typical user connections and usage patterns with helpdesk or asset management records.

  - **Confirm No Resource Misuse:**
    Examine local policies and practices related to allowing RDP on sensitive assets, ensuring compliance with your organization’s security posture. Compare current activity against established baselines.

  ### Prioritization

  This alert is high priority due to the potential impact on enterprise systems using RDP for remote access, which could lead to unauthorized lateral movement or data exfiltration. The likelihood of malicious abuse is significant given the common exploitation of RDP services in attacks. RDP over reverse tunnels is a known tactic among sophisticated adversaries, raising concern for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to trigger the alert, leading to false positives. Effective detection requires proper logging configurations for Windows Filtering Platform telemetry. Additionally, legitimate internal processes may utilize RDP locally, necessitating contextual understanding of expected behaviors. A related detection rule for external RDP connections could enhance coverage and validate if the internal communication is being used maliciously.

