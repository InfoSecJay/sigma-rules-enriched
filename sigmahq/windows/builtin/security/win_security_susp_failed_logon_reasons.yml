logsource:
  product: windows
  service: security
detection:
  selection_eid:
    EventID:
    - 4625
    - 4776
  selection_status:
  - Status:
    - '0xC0000072'            # User logon to account disabled by administrator
    - '0xC000006F'            # User logon outside authorized hours
    - '0xC0000070'            # User logon from unauthorized workstation
    - '0xC0000413'            # Logon Failure: The machine you are logging onto is protected by an authentication firewall. The specified account is not allowed to authenticate to the machine
    - '0xC000018C'            # The logon request failed because the trust relationship between the primary domain and the trusted domain failed
    - '0xC000015B'            # The user has not been granted the requested logon type (aka logon right) at this machine
  - SubStatus:
    - '0xC0000072'            # User logon to account disabled by administrator
    - '0xC000006F'            # User logon outside authorized hours
    - '0xC0000070'            # User logon from unauthorized workstation
    - '0xC0000413'            # Logon Failure: The machine you are logging onto is protected by an authentication firewall. The specified account is not allowed to authenticate to the machine
    - '0xC000018C'            # The logon request failed because the trust relationship between the primary domain and the trusted domain failed
    - '0xC000015B'            # The user has not been granted the requested logon type (aka logon right) at this machine
  filter:
    SubjectUserSid: 'S-1-0-0'
  condition: all of selection_* and not filter
falsepositives:
- User using a disabled account
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious failed logon attempts associated with accounts that may have been tampered with or are otherwise restricted. By focusing on specific error codes from Windows Event Logs, the rule highlights potential unauthorized access attempts targeting disabled accounts, attempts from unauthorized workstations, or attempts made outside of permitted hours. Attackers may use these tactics to probe for weaknesses or gain access credentials to manipulate account statuses, which could ultimately lead to privilege escalation or unauthorized access to sensitive resources.

  The relevant MITRE ATT&CK tactics for this rule include:
  - **Persistence (TA0003)**: An attacker may attempt to maintain a foothold in the environment by using or unlocking disabled accounts.
  - **Defense Evasion (TA0005)**: By using restricted or disabled accounts, attackers may evade detection mechanisms.
  - **Privilege Escalation (TA0004)**: Successfully authenticating with tampered accounts can provide elevated privileges for malicious activities.
  - **Initial Access (TA0001)**: Gaining access using previously tampered or misconfigured accounts can serve as an entry point for attackers.

  Primary data sources for effective detection include:
  - Windows Security Event Log (specifically Events 4625 and 4776), which track failed logon attempts and relevant status codes.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Security Event logs for Event IDs 4625 and 4776 that match the specified error codes indicating tampered account access or logon failures.
  - **Analyze Failed Logon Reasons**: Focus on the specific status codes (e.g., 0xC0000072 for disabled accounts, 0xC000006F for logins outside authorized hours) to ascertain the context and legitimacy of these logon attempts.
  - **Correlate with User Access Logs**: Check for recent changes in user account permissions or status across identity management systems (e.g., Active Directory) to identify potential unauthorized modifications.
  - **Investigate Source Workstations**: Determine the contexts from which failed logon attempts originated; review system logs or endpoint detection tools to understand whether these workstations are legitimate.

  ### Prioritization
  This alert is considered of medium severity due to the risk that successful exploitation of disabled accounts could lead to unauthorized access and potentially severe impacts on security posture.

  ### Blind Spots and Assumptions
  This rule assumes that logs for Event IDs 4625 and 4776 are consistently recorded and accessible on all necessary systems. A potential blind spot exists if systems do not log these events or if the logging configuration excludes certain error codes. Additionally, false positives may occur if legitimate users are erroneously flagged while attempting to access their accounts after administrative changes. Proper log retention and configurations are essential for the effectiveness of this detection logic.

