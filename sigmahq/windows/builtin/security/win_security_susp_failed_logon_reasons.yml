  ---

  ### Technical Context

  This Sigma rule detects failed logon attempts using uncommon error codes, which may indicate suspicious account tampering or misuse of disabled accounts. The likely attacker objective is to gain unauthorized access to an account by attempting to log in despite its disabled status or other restrictions. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (T1078: Valid Accounts) and **Defense Evasion** (T1210: Exploiting Application Vulnerability).

  The primary telemetry sources for this detection are Windows Security Event logs, specifically Event IDs **4625** (failed logon) and **4776** (NTLM logon). If malicious, these failed logon attempts can signify active exploitation of credentials or attempts to leverage disabled accounts for unauthorized access. However, this detection does NOT confirm a compromise; legitimate administrative activity such as account maintenance can also trigger the alert.

  ---

  ### Investigation Steps

  - **Review failed logon Event IDs 4625 and 4776**: Focus on instances where the status or substatus includes error codes such as '0xC0000072' for disabled accounts or '0xC000006F' for authorized hour violations. Check the **Status** and **SubStatus** fields for these values.

  - **Identify the Source IP and Account**: Determine the IP address and account name (fields like **TargetUserName** and **Source Network Address**) associated with the failed logins. Legitimate accounts should have recent activity; unknown accounts could indicate a potential attack.

  - **Assess User Activity and Permissions**: Investigate the user account’s privileges and recent activity using logs (e.g., Event ID **4672** for special privileges assigned). Confirm if the account is indeed disabled or restricted by administration or security policies.

  - **Validate against expected logon behavior**: Check the account’s normal activity patterns during the expected time frame. Accounts configured not to log in after hours should not display successful logons during restricted times unless exceptions are in place.

  - **Look for correlated events**: Examine for related suspicious events, such as multiple logon failures followed by a successful login (Event ID 4624) from the same source. High confidence malicious indicators may include repetitive patterns of failed attempts followed by a triggered alert.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on the integrity of accounts in the enterprise. While malicious abuse of a disabled account is less common, it can lead to broader access if attackers leverage these accounts effectively. The likelihood of exploitation exists, particularly in environments where account management isn't tightly controlled.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if logging levels are not properly configured, as critical details might be missed. Attackers may use legitimate accounts that are incorrectly assumed to be disabled, posing a challenge for distinguishing benign from malicious activity. Additionally, scheduled scripts or automated tasks failing access due to account restrictions can trigger these alerts, causing false positives. A companion detection to consider is monitoring for Event ID **4725** (account disabled), which could enhance context for account status changes.

