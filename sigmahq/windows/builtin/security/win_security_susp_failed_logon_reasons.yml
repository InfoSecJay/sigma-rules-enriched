note: |
  ### Technical Context

  This Sigma rule detects specific failed logon attempts that indicate potential account tampering or suspicious activity. The behavior suggests an adversary may be trying to gain unauthorized access using accounts that are disabled or have restrictions, possibly for credential stuffing or privilege escalation. The relevant MITRE ATT&CK tactics and techniques are **Persistence (T1078)** and **Defense Evasion**.

  Primary telemetry sources include Windows Security logs capturing Event ID **4625** for failed logons and Event ID **4776** for failed authentication attempts. If malicious, the impact could range from unauthorized account access to lateral movement within the network. It is important to note that this detection alone does not confirm that an account compromise has occurred, as it may also be triggered by legitimate user behavior, such as login attempts by administrators testing permissions.

  ### Investigation Steps

  - **Review Failed Logon Events:** Check Windows Security Event ID **4625** logs. Look for status codes such as **0xC0000072** (disabled account) or **0xC000006F** (login outside authorized hours). Abnormal patterns here, especially for sensitive accounts, may indicate malicious behavior.

  - **Analyze Authentication Attempts:** Query Event ID **4776** logs for failed authentication reasons correlating with the same time frame. Events indicating a user is trying to access multiple resources in a short time frame may be suspicious.

  - **Verify User Account Status:** Cross-reference the affected accounts with user management records to confirm if the account is indeed disabled. Legitimate admin activities might include reviewing their own access; look for short bursts of activity.

  - **Investigate Source IP and Workstation:** Identify the IP address and workstation in the failed logon events. If these do not match the user's usual locations or past activities, it raises suspicion. Look for unauthorized workstations (Status **0xC0000070**).

  - **Check for Authentication Firewall Messages:** Look for logs indicating the authentication firewall is blocking logon (Status **0xC0000413**). This could point to a misconfiguration or an unauthorized access attempt.

  - **Examine Trust Relationship Issues:** Investigate the environment for domains that face trust relationship failures (Status **0xC000018C**). This could indicate an issue with domain trust or potential credential misuse.

  ### Prioritization

  This alert is of medium severity due to its potential impact on network security if a compromised account leads to lateral movement or privilege escalation. Failure to authenticate due to suspicious codes often indicates attempts to exploit weaknesses in account management, making prompt investigation crucial.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion tactics like disabling account locks or failing to generate logs if accounts are already disabled by policy. Ensure that all relevant Security logs are being captured correctly and that auditing is turned on for all user accounts. Legitimate activities may include testing account credentials by users or administrators for operational reasons. A companion detection to consider is monitoring for unusual lateral movement behaviors following such failed logon attempts to strengthen the investigation.

