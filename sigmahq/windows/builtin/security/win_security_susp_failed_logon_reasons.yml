note: |
  ### Technical Context

  This Sigma rule detects abnormal logon failure events, specifically those that return uncommon error codes associated with tampering or unauthorized attempts to access accounts that are disabled or restricted. The likely attacker objective is to exploit disabled or unauthorized accounts to gain access to systems, potentially leading to privilege escalation or lateral movement within the network. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), with techniques including **Valid Accounts** (T1078).

  The primary telemetry source is Windows Security logs, particularly looking for **Event IDs 4625** (failed logon) and **4776** (the system attempted to validate the credentials for an account), with a focus on specific sub-status codes indicating attempts to use disabled accounts or login attempts from unauthorized locations. If malicious, such behavior indicates proactive attempts to bypass security controls, leading to potential system compromise. However, this detection does NOT confirm successful account access or guarantee that the attempts are malicious without further context.

  ### Investigation Steps

  - **Identify Event IDs of interest**: Review the Windows Security logs for Event ID **4625** and **4776**. Filter on error codes like `0xC0000072`, `0xC000006F`, and `0xC0000070`. Malicious indicators include multiple instances of these statuses from a single user source over a short time period.

  - **Analyze account status**: Check the status of the accounts involved in these logon attempts using Active Directory tools. Look for accounts that are marked as **disabled** or have specific access restrictions. Legitimate activity may see occasional failed logins from disabled users during user management actions.

  - **Cross-reference with legitimate hours**: Review the timestamps of these failed logins against the organization’s defined login hours. Any attempts logged outside of the authorized hours may indicate malicious behavior.

  - **Investigate source IP**: Determine the source IP addresses of these logon attempts. Look for any **unauthorized workstations** or geographical anomalies. Authorized user workstations should map to known or persistent user locations.

  - **Review user account attributes**: Analyze any changes in the attributes of the involved user accounts, particularly looking for **unusual access rights grants** or group memberships that may indicate an effective privilege escalation attempt.

  - **Document findings**: Confirm whether these conditions are persistent across multiple logon attempts and if they correlate with other associated events (e.g., creation of rogue service accounts or unusual admin activity) that would substantiate malicious intent.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive systems and data. Unauthorized access attempts to disabled accounts can indicate an active threat aiming to exploit vulnerabilities in user management. Although this behavior is less common, it has been weaponized in targeted attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated adversaries utilizing methods to bypass standard logon security or those able to use legitimate accounts in compromised scenarios. Accurate detection relies on the proper configuration of Windows Security logs to capture pertinent Event IDs, especially in environments that may not centrally log or monitor access logs effectively. Legitimate administrative actions involving disabled accounts (for example, during account recovery processes) may inadvertently trigger this alert. A companion detection such as unusual account creation or modification logs may provide context and further strengthen coverage against account tampering activities.

