note: |
  ### Technical Context

  This rule detects the creation or modification of WMI event filters and consumers, which are common persistence mechanisms used by attackers to maintain access control. The likely attacker objective is to establish a method for executing malicious code silently when certain events occur, allowing for persistent control over a compromised system. This behavior fits into the MITRE ATT&CK framework under the tactics of Persistence and Privilege Escalation, specifically technique T1546.003 (WMI Event Subscription).

  The primary telemetry sources for this detection include Windows Security logs (Event ID 4662) that capture interactions with WMI namespaces. The security impact of malicious use is significant, as it can allow attackers to execute payloads undetected, leading to extended compromise of the affected systems. It's crucial to note that this detection alone does NOT confirm malicious intent; it merely indicates that a potential persistence mechanism has been created or modified. Further analysis is needed to establish whether it is benign or part of an attack.

  ### Investigation Steps

  - **Review Event 4662 details:** Examine Security Event ID 4662 logs for object types including 'WMI Namespace' and object names containing 'subscription.' Note the user account associated; legitimate system activity generally originates from system accounts.

  - **Validate WMI filter contents:** Utilize PowerShell with `Get-WmiObject -Namespace root\subscription -Class __Filter` to list WMI filters. Look for any unusual or unfamiliar filter names or command lines that indicate the execution of unknown scripts or applications.

  - **Analyze last execution times:** Correlate the timestamps of creating or modifying WMI filters (Event ID 4662) with any system events around the same time. Malicious indicators are when such modifications coincide with unexpected system behavior or alerts.

  - **Examine the event consumer settings:** Check for WMI consumers using `Get-WmiObject -Namespace root\subscription -Class __EventConsumer`. Identify any suspicious command lines or settings tied to external executable files or scripts.

  - **Identify historical modifications:** Use Windows Event Logs or a security information and event management (SIEM) system to analyze historical data around similar events. Frequent changes by non-IT accounts may indicate malicious activity.

  - **Identify legitimate use cases:** Consider WMI usage by enterprise applications or system maintenance tasks. Applications like System Center may implement WMI subscriptions legitimately, so correlate findings with known enterprise applications.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems if WMI is misused for persistence. The likelihood of this behavior being abused by adversaries is relatively high, especially among sophisticated threat actors who regularly leverage WMI for stealth operations. Such tactics are increasingly weaponized, making timely detection essential.

  ### Blind Spots and Assumptions

  There are detection limitations as legitimate administrative actions (e.g., software updates or configurations) may generate similar WMI modifications. Reliable detection requires comprehensive logging of WMI activity and configuration to ensure that all relevant events are captured. Additionally, operations like remote desktop management tools may trigger similar alerts. A companion detection involving unauthorized WMI querying (Event ID 4624 with unusual logon types) can enhance coverage and context surrounding suspicious activity.

