title: Azure AD Health Service Agents Registry Keys Access
id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
status: test
description: |
  This detection uses Windows security events to detect suspicious access attempts to the registry key values and sub-keys of Azure AD Health service agents (e.g AD FS).
  Information from AD Health service agents can be used to potentially abuse some of the features provided by those services in the cloud (e.g. Federation).
  This detection requires an access control entry (ACE) on the system access control list (SACL) of the following securable object: HKLM:\SOFTWARE\Microsoft\ADHealthAgent.
  Make sure you set the SACL to propagate to its sub-keys.
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_service_agent.yml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2022-10-09
tags:
- attack.discovery
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4656
    - 4663
    ObjectType: 'Key'
    ObjectName: '\REGISTRY\MACHINE\SOFTWARE\Microsoft\ADHealthAgent'
  filter:
    ProcessName|contains:
    - 'Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe'
    - 'Microsoft.Identity.Health.Adfs.InsightsService.exe'
    - 'Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe'
    - 'Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - 'Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors access attempts to specific registry keys related to Azure AD Health service agents, which play a crucial role in the health and functioning of Azure Active Directory Federation Services (AD FS). By effectively monitoring these registry key accesses, security teams can identify potential malicious behavior, as attackers could leverage this information to manipulate services and configurations within cloud environments. Typically, access to these keys indicates interest in influencing or manipulating federation services or obtaining sensitive information that could assist in privilege escalation or persistence in Azure environments.

  The potential attacker objectives may include reconnaissance to identify federation configurations or altering health service behaviors for unauthorized access. This behavior falls under the MITRE ATT&CK techniques for Discovery (T1012), which includes accessing system information with the intent to exploit vulnerabilities. The primary data source for this detection is security event logs, specifically the event IDs that track registry access, which include Event ID 4656 (Handle to an object was requested) and Event ID 4663 (An attempt was made to access an object).

  ### Investigation Steps
  - **Review Registry Access Logs:** Examine Windows security logs for Event ID 4656 and 4663 surrounding the time of the alert. Look specifically for entries that detail access attempts to the HKLM:\SOFTWARE\Microsoft\ADHealthAgent key and its sub-keys.

  - **Analyze Process Activity:** Investigate the processes indicated in the detection logic. Identify any unusual or unexpected instances of the processes associated with Azure AD Health services, which may suggest malicious intent or modification attempts.

  - **Cross-Reference User Accounts:** Cross-reference the accounts attempting to access these registry keys with known user roles. Look for suspicious or unauthorized accounts that do not typically interact with Azure services or AD FS configurations.

  - **Verify SACL Configuration:** Ensure that the System Access Control List (SACL) for the Azure AD Health service registry keys is correctly configured to log access attempts. Ensure that the SACL propagates to all sub-keys to maintain comprehensive coverage.

  ### Prioritization
  This alert is marked medium severity due to the potential for significant impact if an attacker successfully manipulates Azure AD configurations. The likelihood of such an attack can be moderate, particularly in environments where hybrid setups with Azure AD and on-premises AD are implemented.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on proper SACL configuration; if the SACL is not properly set up or propagating, legitimate access attempts may go undetected. Additionally, there may be false positives if legitimate administrative activity is misinterpreted as malicious behavior. The detection logic assumes that malicious actors will use the specified processes to access the registry keys, but advanced threats may circumvent this detection by utilizing other means. It is crucial to ensure that the relevant security event logs are enabled and properly configured on all Windows hosts within the environment for effective logging of the described activities.

