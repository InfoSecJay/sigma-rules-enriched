title: Azure AD Health Service Agents Registry Keys Access
id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
status: test
description: |
  This detection uses Windows security events to detect suspicious access attempts to the registry key values and sub-keys of Azure AD Health service agents (e.g AD FS).
  Information from AD Health service agents can be used to potentially abuse some of the features provided by those services in the cloud (e.g. Federation).
  This detection requires an access control entry (ACE) on the system access control list (SACL) of the following securable object: HKLM:\SOFTWARE\Microsoft\ADHealthAgent.
  Make sure you set the SACL to propagate to its sub-keys.
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_service_agent.yml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2022-10-09
tags:
- attack.discovery
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4656
    - 4663
    ObjectType: 'Key'
    ObjectName: '\REGISTRY\MACHINE\SOFTWARE\Microsoft\ADHealthAgent'
  filter:
    ProcessName|contains:
    - 'Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe'
    - 'Microsoft.Identity.Health.Adfs.InsightsService.exe'
    - 'Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe'
    - 'Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - 'Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the Azure AD Health service agents registry keys, potentially indicating malicious intent to exploit Azure AD functionalities. The likely attacker objective is to manipulate or gather information from the services that enable federation and identity management in Azure AD. This detection aligns with the MITRE ATT&CK technique for Discovery: **Account Discovery (T1087)**.

  The primary telemetry sources are Windows Security Event logs, specifically Event IDs 4656 and 4663, capturing attempts to access specific registry paths. A successful exploitation of these registry keys could allow an attacker to alter the behavior of Azure AD federation services, leading to unauthorized access or data exposure. It is important to note that this detection does NOT confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Verify the event source:** Check Security Event Logs for Event IDs 4656 and 4663 to confirm registry access on the key `HKLM:\SOFTWARE\Microsoft\ADHealthAgent`. Look for unusual access patterns or user accounts related to the process.

  - **Identify the accessing process:** Review the process name associated with the event. Look specifically for processes like `Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe` to distinguish between benign service activity and potential malicious access.

  - **Review legitimate access patterns:** Assess normal operational behavior by monitoring registry access patterns from Azure AD Health service agents during authorized maintenance or troubleshooting activities. Record expected event frequency and access origins.

  - **Cross-reference with user accounts:** Investigate the user account associated with the detected activity. If the account is non-administrative and not recognized as a service account, consider it suspicious.

  - **Conduct file and network activity checks:** Validate if the registry access correlates with unusual file creations/modifications related to Azure AD, or unexpected network connections to Azure AD services via network logs (e.g., HTTP requests to expected endpoints).

  - **Determine system criticality:** Evaluate the role of the impacted system within the enterprise. If it handles sensitive identity information or is part of the federation service, prioritize further investigation accordingly.

  ### Prioritization

  This alert is of medium severity due to the potential impact on identity management services critical to the enterprise. The likelihood of adversarial abuse is moderate, as accessing these keys can enable further exploitation of Azure AD features. This behavior is not commonly weaponized but poses significant risk if misused.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of audit policies on registry access, as not all systems may have the necessary SACL set. Legitimate activities such as auto-updating or maintenance of Azure AD services can trigger these alerts. It's vital to correlate this detection with other registry monitoring alerts for comprehensive coverage and to reinforce detection efforts for potentially suspicious activity around Azure AD services.

