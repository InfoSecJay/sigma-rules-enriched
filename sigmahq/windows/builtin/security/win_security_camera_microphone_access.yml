  ### Technical Context

  This rule detects processes accessing the microphone and webcam on Windows endpoints, focusing on specific registry keys that indicate permission changes to these audio-visual capabilities. The likely attacker objective is to surveil users by capturing audio or video without their consent. This behavior aligns with the MITRE ATT&CK technique for collection, specifically "Audio Capture" (T1123) and "Video Capture" (T1123).

  The primary telemetry source comes from Windows Security Event logs, specifically Event IDs 4656, 4657, and 4663, which document access to the capability manager's consent store. If this behavior is malicious, it poses a significant privacy and security risk to the affected user and enterprise. However, this detection alone does not confirm malicious intent; legitimate applications may also access these resources for valid purposes.

  ### Investigation Steps

  - **Identify recent access events:** Look for Security Event IDs 4656, 4657, and 4663 in Windows Security logs. Specifically, check for access to the following object names:
    - `\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged`
    - `\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam\NonPackaged`

  - **Verify the process origin:** For identified events, determine the Process ID (PID) and the associated executable path. Review if the path matches expected trusted software (e.g., video conferencing tools) or if it appears dubious.

  - **Check user permissions:** Correlate user accounts involved in the detected events with established permission levels. Legitimate applications should have necessary permissions through appropriate user consent.

  - **Look for high-confidence indicators:** Analyze the context of service access. For instance, the presence of background process access (PID 4, System) to these resources is atypical and may indicate an active compromise.

  - **Confirm application behavior:** Review the common software that utilizes the microphone and webcam (like Skype, Zoom) to confirm they were actually in use during the timeframe of the alert. Check system logs for UI notifications about permission requests.

  - **Assess critical assets:** Prioritize investigation on endpoints belonging to high-value users (executives, IT admins) or sensitive locations (R&D labs) where unauthorized access could have higher consequences.

  ### Prioritization

  This alert is medium severity; unauthorized access to personal audio and video on corporate devices poses significant risk, especially regarding user privacy and potential data exfiltration. Due to the increasingly common risks associated with surveillance software, it's important to treat alerts of this nature with urgency.

  ### Blind Spots and Assumptions

  Detection can be limited by legitimate software that accesses audio and video capabilities frequently, potentially generating false positives. Ensure the necessary security logs are enabled and properly configured for reliable detection. Legitimate applications like video conferencing tools may trigger these alerts, and companion detections such as network traffic analysis to identify unusual data transmissions during the same time frame can help strengthen overall coverage.

