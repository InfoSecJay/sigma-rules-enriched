  ---

  ### Technical Context

  This rule detects processes accessing the microphone and webcam on Windows systems, indicating potential unauthorized surveillance or privacy breaches. The likely attacker objective is to capture audio or video without the user's consent, which could lead to information theft or privacy violations. The relevant MITRE ATT&CK technique is **T1123: Audio Capture** and **T1124: Video Capture**.

  Primary telemetry sources include Windows Security Event logs, specifically Event IDs 4656, 4657, and 4663, which capture access attempts to critical system resources. If malicious, such behavior could lead to significant security impacts, particularly in environments handling sensitive personal or corporate information. It is important to note that this detection alone does not confirm malicious intent, as legitimate applications may also access these resources for valid purposes.

  ---

  ### Investigation Steps

  - **Identify process access events:** Review Windows Security Event IDs 4656, 4657, and 4663 for the object names containing `\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged` or `\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam\NonPackaged`. Check for user context and source process.

  - **Correlate with application usage:** Validate whether the access corresponds with known applications (e.g., video conferencing tools, voice recording software) being used at the time. If legitimate, these should show expected application names in the process access logs.

  - **Assess user behavior:** Check the user’s recent activity through logs or endpoint management tools to identify any unusual or unauthorized installations/new software accessing the camera/microphone.

  - **Review system alerts:** Look for corroborating anomalies in other security systems or EDR solutions regarding the same endpoints or users around the time of the access events.

  - **Document critical systems:** Note if the affected system holds critical data or is classified with a high asset criticality level, requiring more immediate and thorough investigation due to the potential impact.

  - **Look for indicative indicators:** Check for high-confidence malicious indicators such as unexpected processes associated with known remote access trojans (RATs) that access these capabilities, particularly if they exhibit unusual behavior.

  ---

  ### Prioritization

  The alert is medium severity given that it involves potential privacy violations that could impact reputation or compliance. The likelihood of malicious abuse is moderate, as surveillance functions are often weaponized in espionage or harassment cases, but there can be numerous benign reasons for access.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use legitimate applications to obscure their activities. Reliable detection requires proper logging configurations across endpoint security, particularly the activation of relevant Windows Security Event logs. Legitimate activities such as video conferencing or audio recording may trigger the alert, so contextual awareness is crucial. An example of a companion detection could include monitoring for unusual outbound connections from processes accessing the camera or microphone, reinforcing the need for a multi-layered investigative approach.

