title: Windows Network Access Suspicious desktop.ini Action
id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
status: test
description: Detects unusual processes accessing desktop.ini remotely over 
  network share, which can be leveraged to alter how Explorer displays a 
  folder's content (i.e. renaming files) without changing them on disk.
references:
- https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
author: Tim Shelton (HAWK.IO)
date: 2021-12-06
modified: 2022-01-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.009
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ObjectType: File
    RelativeTargetName|endswith: '\desktop.ini'
    AccessList|contains:
    - 'WriteData'
    - 'DELETE'
    - 'WriteDAC'
    - 'AppendData'
    - 'AddSubdirectory'
  condition: selection
falsepositives:
- Read only access list authority
level: medium
note: |
  ### Technical Context

  This rule detects suspicious access to "desktop.ini" files over network shares, specifically targeting actions such as writing or deleting entries. This behavior aligns with potential post-exploitation activities where an attacker aims to manipulate folder display settings without altering the underlying files. The likely attacker objective includes achieving persistence or altering the user experience to facilitate further malicious actions.

  Relevant MITRE ATT&CK tactic and technique: **Persistence, T1547.009** (Desktop.ini). The primary telemetry source is Windows Security logs, specifically Event ID 5145. The security impact, if malicious, could include unauthorized alteration of directory behavior that obfuscates further malicious activity. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can trigger similar alerts, necessitating further investigation.

  ### Investigation Steps

  - **Review Event ID 5145 details**: Analyze entries to confirm the process initiating the access. Check `ProcessName` and `SubjectUserName` fields; look for unusual processes or accounts (e.g., service accounts).

  - **Examine access pattern for benign behavior**: Identify whether the accessing process is legitimate (e.g., known management tools). Compare access timestamps with normal operational hours for asset usage.

  - **Correlate to host asset criticality**: Identify the affected machine's role. If it's a critical server or endpoint, prioritize it for investigation as compromise would impact broader systems.

  - **Look for high-confidence malicious indicators**: Check for any unexpected or unauthorized processes accessing the "desktop.ini" file. Flag processes like "cmd.exe" or "powershell.exe" if they exhibit unusual parent-child relationships or unusual execution context around this event.

  - **Validate file integrity and alterations**: Inspect the relevant directory for any changes made in conjunction with the detected access, such as modifications in the content of "desktop.ini" or unexpected file creations.

  - **Assess concurrent activities**: Review other security events occurring around the time of the desktop.ini access. Look for anomalies such as failed logons or other Event ID 5145 accesses that could indicate spread or lateral movement.

  ### Prioritization

  This alert carries medium severity due to the potential for abuse in high privilege environments. The likelihood of malicious exploitation for achieving persistence is notable, particularly in enterprises employing network shares extensively. Given its capability to masquerade malicious behavior, this technique is weaponized by advanced adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through legitimate administrative tasks that may perform similar actions on "desktop.ini" files. It’s critical to ensure that Security Event logging is appropriately configured to capture Event ID 5145 reliably. Legitimate activities such as IT admin management could unwittingly trigger this alert, making it essential to correlate context with personnel authorization. Companion detection for related actions (e.g., process creation events under Event ID 4688 where “cmd.exe” or “powershell.exe” is involved) could enhance detection capability for broader campaign detection.

