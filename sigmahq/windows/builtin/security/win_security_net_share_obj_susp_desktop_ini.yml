title: Windows Network Access Suspicious desktop.ini Action
id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
status: test
description: Detects unusual processes accessing desktop.ini remotely over network
  share, which can be leveraged to alter how Explorer displays a folder's content
  (i.e. renaming files) without changing them on disk.
references:
- https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
author: Tim Shelton (HAWK.IO)
date: 2021-12-06
modified: 2022-01-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.009
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ObjectType: File
    RelativeTargetName|endswith: '\desktop.ini'
    AccessList|contains:
    - 'WriteData'
    - 'DELETE'
    - 'WriteDAC'
    - 'AppendData'
    - 'AddSubdirectory'
  condition: selection
falsepositives:
- Read only access list authority
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity related to the manipulation of the `desktop.ini` file over a network share. The `desktop.ini` file is a configuration file in Windows that can dictate how folders are displayed, and attackers may exploit it post-compromise to conceal malicious activity or modify folder visibility, allowing further exploitation or persistence within the environment. Such behavior could signify an attempt to maintain access or escalate permissions by preventing users or security personnel from effectively discerning compromised folders or files.

  The rule touches upon relevant MITRE ATT&CK techniques, particularly T1547.009 (Shortcut Modification) and T1060 (Registry Run Keys / Startup Folder), given that altering desktop behavior can lead to stealthy persistence scenarios or privilege escalation efforts. The primary sources of telemetry for this detection are Windows file access logs, particularly Event ID 5145, which logs access to shared files, including write, delete, and other pertinent operations against the desktop.ini file.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Security Event Logs for Event ID 5145 entries that indicate access to `desktop.ini` files. Pay close attention to the `AccessList` for operations like `WriteData` or `DELETE`.
  - **Analyze Process Activity:** Correlate the detected access events with process creation logs to identify which processes accessed `desktop.ini` and ascertain whether they exhibit suspicious behavior indicative of post-exploitation efforts.
  - **Inspect Network Activity:** Look at any related network share activity involving the systems suspected of tampering with `desktop.ini` files. Analyze for unusual patterns or connections from untrusted sources.
  - **Verify User Permissions:** Investigate the permissions and roles of the user accounts involved in the event detection. Ensure that only authorized accounts have access to modify desktop.ini files on shared resources.

  ### Prioritization
  The severity of this alert is medium due to the potential for privilege escalation and persistence associated with controlling folder visibility and access. The likelihood is elevated if such actions are not typical for the users or systems involved in the event.

  ### Blind Spots and Assumptions
  This detection may have gaps if file access logs are not properly monitored or if there are constraints in logging configuration, such as limited retention periods. The detection logic assumes that any non-standard (i.e., unexpected) access to `desktop.ini` is indeed malicious, which may not always hold true in environments where benign applications might also exert such access. It is imperative that Windows logging features are fully enabled and configured to capture the necessary Event IDs for effective monitoring and analysis.

