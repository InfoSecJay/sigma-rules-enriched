detection:
  selection:
    EventID: 4697
    ServiceName|contains:
            # Based on https://github.com/SigmaHQ/sigma/pull/2841
    - 'AmmyyAdmin'         # https://www.ammyy.com/en/
    - 'AnyDesk'         # https://usersince99.medium.com/windows-privilege-escalation-8214ceaf4db8
    - 'Atera'
    - 'BASupportExpressSrvcUpdater'         # https://www.systemlookup.com/O23/6837-BASupSrvcUpdater_exe.html
    - 'BASupportExpressStandaloneService'         # https://www.systemlookup.com/O23/6839-BASupSrvc_exe.html
    - 'chromoting'
    - 'GoToAssist'         # https://www.goto.com/it-management/resolve
    - 'GoToMyPC'         # https://get.gotomypc.com/
    - 'jumpcloud'
    - 'LMIGuardianSvc'         # https://www.logmein.com/
    - 'LogMeIn'         # https://www.logmein.com/
    - 'monblanking'
    - 'Parsec'
    - 'RManService'         # https://www.systemlookup.com/O23/7855-rutserv_exe.html
    - 'RPCPerformanceService'         # https://www.remotepc.com/
    - 'RPCService'         # https://www.remotepc.com/
    - 'SplashtopRemoteService'         # https://www.splashtop.com/
    - 'SSUService'
    - 'TeamViewer'
    - 'TightVNC'         # https://www.tightvnc.com/
    - 'vncserver'
    - 'Zoho'
  condition: selection
falsepositives:
- The rule doesn't look for anything suspicious so false positives are expected.
  If you use one of the tools mentioned, comment it out
level: medium
note: |
  ### Technical Context

  This rule detects the installation of various remote access tools (RATs) on Windows systems, specifically by monitoring the creation of services associated with these tools. The likely attacker objective is to gain unauthorized access and control over compromised systems, enabling further exploitation or lateral movement within the network. Relevant MITRE ATT&CK techniques include "Create or Modify System Process" (T1543.003) and "Remote Access Tools" (T1569.002). The primary telemetry source is Windows Security Event ID 4697, which records the installation of new services. If these tools are maliciously installed, they can facilitate unauthorized remote access, posing a significant security risk to the organization. This detection does NOT confirm actual evil behavior or compromise without additional context—legitimate use cases for these tools exist.

  ### Investigation Steps

  - **Check Event ID 4697 details**: Look for recently logged Event ID 4697 entries that indicate the installation of services with names matching the predefined list (e.g., TeamViewer, AnyDesk). Note timestamps and the account responsible for the installation.
  - **Confirm legitimate usage**: Review the service list; if an installed remote access service is authorized for use (e.g., for IT support), gather further context from documentation or change logs to ensure it aligns with expected operational behavior.
  - **Verify service attributes**: Examine the Startup Type field in the service configuration (e.g., through PowerShell `Get-Service`). A service set to "Automatic" or "Delayed Start" from an unknown source may indicate malicious intent.
  - **Cross-reference system integrity**: Review other security logs (e.g., Sysmon Event ID 1 for process creation) for related suspicious activity associated with the identified service name to indicate potential exploitation attempts.
  - **Analyze endpoint security product alerts**: Check for alerts from endpoint protection solutions indicating suspected malicious behavior linked to the newly installed RAT, focusing on indicators related to system access attempts or lateral movement.
  - **Identify unusual network traffic**: Use firewall or network monitoring logs (e.g., proxy logs detailing SNI, HTTP requests) to seek abnormal outbound connections that may correlate with the usage of newly installed RATs, such as irregular IP addresses or uncharacteristic protocols.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact if unauthorized remote access is achieved. The likelihood of malicious abuse is moderate, as many of the identified tools are frequently weaponized by attackers for ease of access. Organizations should remain vigilant as such tools are common in both legitimate and illicit remote support scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of certain legitimate remote access tools triggering the alert without malicious intent, potentially leading to false positives. It is critical to ensure that logging of Event ID 4697 for service installations is enabled for complete visibility. Legitimate IT administrative actions could trigger this detection, especially in organizations utilizing remote support applications. Companion detections that could enhance coverage include monitoring lateral movement via "Remote Execution" techniques (T1021) to confirm the use of these applications for any heightened risk behavior.

