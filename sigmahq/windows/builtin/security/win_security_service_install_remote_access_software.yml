detection:
  selection:
    EventID: 4697
    ServiceName|contains:
            # Based on https://github.com/SigmaHQ/sigma/pull/2841
    - 'AmmyyAdmin'         # https://www.ammyy.com/en/
    - 'AnyDesk'         # https://usersince99.medium.com/windows-privilege-escalation-8214ceaf4db8
    - 'Atera'
    - 'BASupportExpressSrvcUpdater'         # https://www.systemlookup.com/O23/6837-BASupSrvcUpdater_exe.html
    - 'BASupportExpressStandaloneService'         # https://www.systemlookup.com/O23/6839-BASupSrvc_exe.html
    - 'chromoting'
    - 'GoToAssist'         # https://www.goto.com/it-management/resolve
    - 'GoToMyPC'         # https://get.gotomypc.com/
    - 'jumpcloud'
    - 'LMIGuardianSvc'         # https://www.logmein.com/
    - 'LogMeIn'         # https://www.logmein.com/
    - 'monblanking'
    - 'Parsec'
    - 'RManService'         # https://www.systemlookup.com/O23/7855-rutserv_exe.html
    - 'RPCPerformanceService'         # https://www.remotepc.com/
    - 'RPCService'         # https://www.remotepc.com/
    - 'SplashtopRemoteService'         # https://www.splashtop.com/
    - 'SSUService'
    - 'TeamViewer'
    - 'TightVNC'         # https://www.tightvnc.com/
    - 'vncserver'
    - 'Zoho'
  condition: selection
falsepositives:
- The rule doesn't look for anything suspicious so false positives are expected. If
  you use one of the tools mentioned, comment it out
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the installation of multiple remote access tools (RATs) on Windows systems. Such tools enable remote control, which, while sometimes benign, can be abused by adversaries for persistence, lateral movement, or data exfiltration. The objective for attackers is typically to maintain access to a compromised system without detection. The relevant MITRE ATT&CK tactics are **Persistence** (TA0003) and **Remote Access Tools** (T1219). The primary telemetry source includes Windows Security logs, specifically Event ID 4697 for service installation events. If malicious, the impact can range from unauthorized system access to complete exploitation of the network. This detection does NOT confirm active exploitation or successful communication with a command and control (C2) server.

  ---

  ### Investigation Steps

  - **Review Event ID 4697 logs:** Check Windows Security logs for Event ID 4697. Look specifically for service installation of names associated with common RATs (e.g., ‘TeamViewer’, ‘AnyDesk’, ‘LogMeIn’).

  - **Identify irregular service installations:** Evaluate whether the detected services were installed on critical systems (e.g., domain controllers, sensitive databases) versus standard user machines, which may indicate malicious intent.

  - **Assess user and account context:** Analyze the account context that performed the service installation (through Event ID 4624 - Logon) to determine if it was an authorized admin or a suspicious account, noting the username and associated privileges.

  - **Compare against legitimate baselines:** Validate if the installed tools are part of a known IT support workflow or legitimate business use based on company standards. Record any expected usage patterns.

  - **Check for network communication:** Investigate whether the installed services are initiating outbound connections, particularly to external IP addresses on uncommon ports, indicating potential exfiltration or command and control activity.

  - **Monitor installation patterns over time:** Identify multiple installations of such services across different machines in a short timeframe which could indicate a coordinated installation by an attacker for lateral movement or widespread access.

  ---

  ### Prioritization

  The alert demonstrates medium severity in an enterprise context due to potential impacts on system integrity and confidentiality. The likelihood of malicious use is significant, given the prevalence of remote access tools in attacks. While some legitimate uses exist, the rapid emergence of multiple installations across systems should elevate the investigative priority.

  ---

  ### Blind Spots and Assumptions

  Limitations include possible evasion techniques like legitimate installation of remote access tools by users or IT staff, thus producing false positives. Reliable detection requires that the Windows Security audit policy is properly configured to log Event ID 4697. Legitimate remote support tools may trigger this alert, especially in environments with IT support workflows. Companion detections, such as monitoring for anomalous outbound traffic or the presence of malicious command and control indicators (e.g., known malicious domains), can enhance coverage and context for incidents involving RAT installations.

