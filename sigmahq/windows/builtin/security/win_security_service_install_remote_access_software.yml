detection:
  selection:
    EventID: 4697
    ServiceName|contains:
            # Based on https://github.com/SigmaHQ/sigma/pull/2841
    - 'AmmyyAdmin'         # https://www.ammyy.com/en/
    - 'AnyDesk'         # https://usersince99.medium.com/windows-privilege-escalation-8214ceaf4db8
    - 'Atera'
    - 'BASupportExpressSrvcUpdater'         # https://www.systemlookup.com/O23/6837-BASupSrvcUpdater_exe.html
    - 'BASupportExpressStandaloneService'         # https://www.systemlookup.com/O23/6839-BASupSrvc_exe.html
    - 'chromoting'
    - 'GoToAssist'         # https://www.goto.com/it-management/resolve
    - 'GoToMyPC'         # https://get.gotomypc.com/
    - 'jumpcloud'
    - 'LMIGuardianSvc'         # https://www.logmein.com/
    - 'LogMeIn'         # https://www.logmein.com/
    - 'monblanking'
    - 'Parsec'
    - 'RManService'         # https://www.systemlookup.com/O23/7855-rutserv_exe.html
    - 'RPCPerformanceService'         # https://www.remotepc.com/
    - 'RPCService'         # https://www.remotepc.com/
    - 'SplashtopRemoteService'         # https://www.splashtop.com/
    - 'SSUService'
    - 'TeamViewer'
    - 'TightVNC'         # https://www.tightvnc.com/
    - 'vncserver'
    - 'Zoho'
  condition: selection
falsepositives:
- The rule doesn't look for anything suspicious so false positives are expected. If
  you use one of the tools mentioned, comment it out
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of remote access tool (RAT) services on Windows systems. These tools, such as TeamViewer, AnyDesk, and AmmyyAdmin, provide remote control capabilities and can be exploited by threat actors to gain unauthorized access, conduct surveillance, or execute malicious actions on compromised systems. The presence of these services can indicate malicious activity, especially when installed without proper oversight.

  Attackers may utilize RATs to maintain persistent access to a network, perform reconnaissance, or facilitate lateral movement, aligning with their objectives to exfiltrate data or disrupt operations. The relevant MITRE ATT&CK tactics/techniques associated with this detection include Persistence (T1543.003), Execution (T1569.002), and Privilege Escalation.

  The primary data source for this alert is the Windows security logs, specifically Event ID 4697, which records the installation of new services. Properly configuring the System Security Extension audit is vital for capturing these events.

  ### Investigation Steps
  - **Review Event Logs:** Leverage Windows Event Viewer to filter for Event ID 4697 which denotes service installations. Focus on entries that correspond to known remote access tools listed in the detection logic.

  - **Analyze Service Configuration:** Check the configuration and startup type of the identified services. Investigate whether they are set to start automatically and consider assessing the context of their installation—especially if done by unfamiliar accounts.

  - **Correlate with User Activity:** Investigate recent logins and user activity on the affected systems to determine if the installation correlates with unauthorized user activity or unusual login times.

  - **Examine Network Traffic:** Utilize network detection and response (NDR) tools to analyze outbound connections from the affected systems. Look for communication patterns to known RAT domains or unusual IP addresses that could signify malicious traffic.

  ### Prioritization
  This alert carries medium severity due to the potential risk posed by unauthorized remote access tools, which can facilitate significant security breaches if leveraged by malicious actors. The likelihood of an attacker utilizing such tools for exploitation necessitates timely investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the deployment of legitimate remote access tools in the environment, leading to potential false positives. The effectiveness of this detection relies on the proper configuration of Windows security logging to capture Event ID 4697. Additionally, the detection logic assumes that all installed RAT services are unauthorized, which may not always be the case, emphasizing the need for contextual investigation prior to conclusions.

