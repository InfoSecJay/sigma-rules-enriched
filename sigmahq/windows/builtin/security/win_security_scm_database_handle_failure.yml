note: |
  ### Technical Context

  This Sigma detection rule identifies instances where non-system users attempt and fail to obtain access handles for the Service Control Manager (SCM) database, specifically the 'ServicesActive' object. The likely attacker objective is to enumerate or manipulate services on the machine, which aligns with the MITRE ATT&CK tactic of Discovery (T1057) and the technique of Process Discovery (T1010). Primary telemetry sources include Windows Security Event logs, specifically Event ID 4656, which log access attempts, and filter for failures associated with the SCM database.

  If successful, such access could lead to unauthorized manipulation of system services, potentially allowing an attacker to disrupt operations or gain a foothold in the environment. However, this detection does NOT confirm any successful access or compromise, as it only registers failed access attempts.

  ### Investigation Steps

  - **Review Event ID 4656 logs**: Investigate Windows Security logs for Event ID 4656, focusing on entries where the ObjectType is 'SC_MANAGER OBJECT' and ObjectName is 'ServicesActive'. Failures will indicate an unauthorized access attempt.

  - **Check Source User Accounts**: Identify the SubjectLogonId associated with the failure. Non-system accounts (i.e., those not using '0x3e4') should raise flags for further scrutiny.

  - **Cross-reference with logged actions**: Compare the failure logs against legitimate administrative activities in the environment, such as authorized service checks or configurations typically performed by system administrators.

  - **Analyze the Access Mask**: Focus on the AccessMask field. Values such as '0xf003f' indicate comprehensive access requests; a legitimate user rarely requires such extensive permissions, signaling a potential maliciousness.

  - **Investigate the asset criticality**: Identify if the affected systems (e.g., domain controllers, critical application servers) have higher criticality, as the impact of service manipulation would be more significant in these contexts.

  - **Monitor for additional subsequent activities**: Examine for related logs indicating further actions post-failure, such as repeated access attempts or changes in user account behavior, which can indicate an ongoing reconnaissance effort.

  ### Prioritization

  This alert should be treated as medium severity. The failure of non-system users to interact with crucial service management functionalities indicates potential reconnaissance or pre-attack activities. While not uncommon, such behavior can be indicative of advanced persistent threats attempting to gain insights into service configurations.

  ### Blind Spots and Assumptions

  This detection may miss legitimate activities, such as service management by poorly configured user roles or automation scripts. Evasion techniques could include using system account impersonation to bypass this detection. Ensure that Event ID 4656 logging is enabled and properly configured across all critical systems. A related detection to consider is monitoring for successful access requests to the SC_MANAGER, which can provide a broader context for investigative efforts.

