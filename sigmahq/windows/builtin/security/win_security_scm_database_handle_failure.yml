level: medium
note: |
  ### Technical Context
  This rule detects failed attempts by non-system users to gain access to the Service Control Manager (SCM) database. In a typical attack scenario, malicious actors can exploit service control mechanisms to enumerate services, manipulate service configurations, or elevate privileges to take control of services or achieve persistence on the target system. By monitoring SCM access failures, security teams can identify potential reconnaissance or attempting privilege escalation activities that could lead to a breach.

  Relevant MITRE ATT&CK tactics include **Reconnaissance (TA0043)** and **Access Token Manipulation (T1134)**. The specific techniques associated with these actions are **Service Hijacking (T1193)** and **User Execution (T1203)**, which outline the various methods attackers may use to interact with system services as part of their intrusion strategy.

  Primary data sources for detecting this rule are Windows Security Event Logs, particularly those capturing Event ID 4656, which logs access attempts to objects in the operating system. These logs will provide insights into who is attempting to access the SCM and how frequently these attempts result in failures.

  ### Investigation Steps
  - **Review Failed Access Events**: Analyze Windows Security Event Logs for Event ID 4656 associated with the SCM database to identify failed handle requests from non-system users.

  - **Cross-reference User Accounts**: Investigate the accounts triggering these failed attempts. Compare the logon IDs against a baseline of legitimate user accounts to identify potentially malicious or unauthorized activity.

  - **Monitor for Correlation**: Look for patterns in the failed access attempts over time or in conjunction with other suspicious activities (e.g., unusual logon locations or times).

  - **Assess Service Configurations**: Evaluate the service configurations on the affected systems to ensure that there are no anomalies or potential vulnerabilities that could be exploited, such as improperly set permissions that might allow unauthorized access.

  ### Prioritization
  This alert carries medium severity due to its indication of potential reconnaissance or privilege escalation activity in the environment. Such actions could pave the way for more malicious activities, increasing the likelihood of a successful breach if not addressed promptly.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes environments where the logging of Event ID 4656 may not be enabled or adequately configured, limiting visibility into access attempts. The detection logic assumes that any non-system user is malicious if failing to access the SCM, which may not always be correct, potentially leading to false positives. Proper configuration of Windows Security Auditing is required to capture these event logs effectively for accurate detection and response.

