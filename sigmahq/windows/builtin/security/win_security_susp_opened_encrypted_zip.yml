title: Password Protected ZIP File Opened
id: 00ba9da1-b510-4f6b-b258-8d338836180f
status: test
description: Detects the extraction of password protected ZIP archives. See the 
  filename variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.stealth
- attack.t1027
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  filter:    # avoid overlaps with 54f0434b-726f-48a1-b2aa-067df14516e4
    TargetName|contains: '\Temporary Internet Files\Content.Outlook'
  condition: selection and not filter
falsepositives:
- Legitimate used of encrypted ZIP files
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the opening of password-protected ZIP files, signified by Event ID 5379 in Windows security logs. The behavior suggests that an attacker may be attempting to extract malicious payloads or sensitive data encapsulated within these archive files, which could be part of a data exfiltration effort or initial access vector. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1027), and the technique includes **Obfuscated Files or Information** (ID: T1027) since compressed files can obscure malicious content.

  The primary telemetry source is Windows Security logs, specifically Event ID 5379, which records when a password-protected ZIP file is accessed. If this extraction behavior is triggered by an adversary, it poses a risk of data compromise or deployment of malware. However, this detection alone does not prove malicious intent; legitimate users may also open encrypted ZIP files for benign purposes.

  ### Investigation Steps

  - **Review Event ID 5379 details:** Check the specific logged Event ID 5379 in the Windows Security logs to confirm the user context, including `SubjectUserName` and `TargetName`. Note the filename for further context regarding its legitimacy.

  - **Validate file integrity:** Examine the file path associated with the accessed ZIP file. Legitimate access often occurs in user directories or known safe locations, not within sensitive areas like `\Temporary Internet Files\Content.Outlook`.

  - **Inspect associated processes:** Use Sysmon Event ID 10 (Process Access) to check for related activity around the time of the ZIP file extraction. Look for unusual parent-child process relationships which may indicate malicious processes.

  - **Correlate with user behavior:** Assess whether the user’s access patterns align with normal behavior. Review logs within the last 30 days for context on whether the user commonly handles encrypted archives or if this is anomalous.

  - **Identify known malicious artifacts:** Cross-reference the filename against threat intelligence sources or internal datasets for known malicious ZIP files or patterns associated with exfiltration or malware delivery.

  ### Prioritization

  The alert's severity is medium as it involves potentially sensitive data access; however, the likelihood of malicious use depends on user behavior and the context of the file. Since adversaries often use password-protected archives to evade detection, this behavior warrants immediate investigation to rule out escalation.

  ### Blind Spots and Assumptions

  This detection may be limited if logs for Event ID 5379 are not consistently collected or if the user has legitimate reasons to access encrypted files. It is also susceptible to evasion if an adversary uses unrelated tools to extract content without triggering this event. The presence of encrypted files alone does not confirm malicious intent, and other related detections, such as file creation events or anomalies in user access patterns, should be included in the analysis for a more comprehensive understanding.

