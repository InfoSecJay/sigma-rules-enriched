title: Password Protected ZIP File Opened
id: 00ba9da1-b510-4f6b-b258-8d338836180f
status: test
description: Detects the extraction of password protected ZIP archives. See the filename
  variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  filter:    # avoid overlaps with 54f0434b-726f-48a1-b2aa-067df14516e4
    TargetName|contains: '\Temporary Internet Files\Content.Outlook'
  condition: selection and not filter
falsepositives:
- Legitimate used of encrypted ZIP files
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the extraction of password-protected ZIP files using Windows Event ID 5379, indicating a user or process has accessed this compressed archive. This behavior aligns with data exfiltration or lateral movement objectives, as attackers may use password-protected ZIPs to obscure malicious payloads from security monitoring. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) with the associated technique T1027 (Obfuscated Files or Information).

  Primary telemetry comes from Windows Security logs, particularly Event ID 5379 detailing COM application activities related to file manipulations. If malicious, it could signify that sensitive or compromised files are being accessed. However, this detection does NOT confirm that the extracted content is malicious or that the extraction itself is explicitly harmful.

  ---

  ### Investigation Steps

  - **Verify Event ID 5379 occurrence**: Check the Windows Security logs for Event ID 5379. Pay attention to the `TargetName` field for indications of file extraction, particularly looking for file paths that include ZIP archives.

  - **Analyze file paths**: Investigate the `TargetName` field for references to any known sensitive directories, such as `\Temporary Internet Files\Content.Outlook\`. If the ZIP is extracted from suspicious or uncommon locations, consider it a higher risk.

  - **Identify legitimate use cases**: Review typical business processes involving ZIP files in your organization. Confirm if users commonly access password-protected ZIPs for justified purposes (e.g., secure file sharing).

  - **Look for patterns in extraction**: Assess the surrounding logs for unusual user behavior leading to this event, such as multiple extractions within a short timeframe or access by non-privileged users indicating potential malicious intent.

  - **Investigate associated user accounts**: Determine the user account involved in the extraction. If the account has a history of suspicious activities or is linked to sensitive roles, escalate accordingly.

  - **Review anti-virus or EDR response**: Check if any endpoint protection tools have flagged the corresponding process or file creation as suspicious or malicious, providing additional context on the alert's severity.

  ---

  ### Prioritization

  The severity of this alert is medium. While it indicates a potentially malicious action—extraction of a password-protected archive—context matters significantly, such as the sensitivity of the affected system and user activity history. The likelihood of this behavior being weaponized increases if associated with known threat actors or indicators of compromise.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of password-protected ZIP files, and evasion techniques could involve using encryption to obscure file contents. Ensure configurations are in place to capture all relevant log sources, as certain user actions may not generate the expected Event ID. Related detection for obfuscation techniques or malicious extraction attempts would enhance visibility, such as monitoring for network connections initiated after file extraction events.

