title: Password Protected ZIP File Opened
id: 00ba9da1-b510-4f6b-b258-8d338836180f
status: test
description: Detects the extraction of password protected ZIP archives. See the 
  filename variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  filter:    # avoid overlaps with 54f0434b-726f-48a1-b2aa-067df14516e4
    TargetName|contains: '\Temporary Internet Files\Content.Outlook'
  condition: selection and not filter
falsepositives:
- Legitimate used of encrypted ZIP files
level: medium
note: |
  ### Technical Context

  This rule detects the extraction of password-protected ZIP files on Windows systems. Attackers may use this technique to obfuscate malicious payloads, making it harder for security products to identify them during transit or at rest. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) and the technique is Unusual Encoded Files or Formats (T1027).

  The primary telemetry source is Windows Security Event logs, specifically Event ID 5379, which indicates the use of the open file dialog to extract files from ZIP archives. If the ZIP file contains malware, this action could lead to system compromise, data exfiltration, or lateral movement within the enterprise environment. However, this detection does NOT confirm malicious intent on its own; legitimate use of encrypted ZIP files is common in business operations.

  ### Investigation Steps

  - **Check extraction context:** Review the Event ID 5379 logs for the `TargetName` field. Look for file extraction actions occurring outside of known operational directories, which may indicate suspicious behavior versus legitimate user activity.

  - **Verify file content:** If the extracted file path includes network paths or unusual folders such as `\Temporary Internet Files\Content.Outlook`, further investigate the contents of the ZIP file. Legitimate extraction should typically involve organizational paths like `C:\Users\<username>\Documents`.

  - **Assess user behavior:** Examine the user account associated with the extraction. Investigate if the user has a history of accessing or extracting password-protected files. A user with no previous activity related to such files may warrant escalation.

  - **Look for associated processes:** Cross-reference with Sysmon Event ID 1 to see if any suspicious process created or modified files after the extraction. Identify processes with names or hashes that do not originate from trusted sources.

  - **Review access patterns:** Investigate the system's file access logs for unusual patterns following the extraction event. Log files (like Security and Sysmon) may reveal subsequent file accesses that suggest exfiltration or command-and-control activity.

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system, especially if it exposes sensitive data. The likelihood of malicious abuse is considerable, given attackers' history of using password-protected ZIP files to bypass detection. While not commonly weaponized, it can support other attack vectors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users opening encrypted ZIP files, which can produce false positives. Reliable detection requires that Security Event logs are correctly configured and monitored. Common benign triggers include remote work scenarios where employees receive password-protected ZIP files from clients. A related detection worth considering is tracking unusual process creation following file extraction events, which could highlight a deeper compromise.

