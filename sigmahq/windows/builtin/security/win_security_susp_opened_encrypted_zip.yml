title: Password Protected ZIP File Opened
id: 00ba9da1-b510-4f6b-b258-8d338836180f
status: test
description: Detects the extraction of password protected ZIP archives. See the filename
  variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  filter:    # avoid overlaps with 54f0434b-726f-48a1-b2aa-067df14516e4
    TargetName|contains: '\Temporary Internet Files\Content.Outlook'
  condition: selection and not filter
falsepositives:
- Legitimate used of encrypted ZIP files
level: medium
note: |
  ### Technical Context
  This rule detects instances where a user opens a password-protected ZIP file on a Windows system. Attackers commonly use encrypted archives to transfer malicious payloads while evading detection mechanisms that may normally inspect file contents or behaviors. By extracting sensitive information or malware from these archives, attackers aim to achieve their objectives, which may include data exfiltration, lateral movement, or deploying backdoors.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (T1560)**, as password-protected files may be used to conceal the presence of malicious content from standard security analysis tools. The technique **Application Layer Protocol (T1027)** also applies here, as it encompasses the methods of using applications, such as file compression tools, to facilitate stealthy communication or execution.

  Primary data sources for this detection include Windows Security Event logs, specifically focusing on Event ID 5379 related to file accesses. Analysts can gain insights into which specific files were accessed and if any unusual patterns emerge that warrant further investigation.

  ### Investigation Steps
  - **Review Security Logs**: Analyze Windows Security Event logs for Event ID 5379 to identify entries related to the opening of password-protected ZIP files, paying close attention to the `TargetName` field and the context of the accessed files.

  - **Examine User Behavior**: Cross-reference the access timelines with user activity logs to assess whether the access aligns with normal user behavior or if it deviates significantly, indicating a potential compromise.

  - **Inspect Temporary File Locations**: Investigate the `Temporary Internet Files\Content.Outlook` directory for any unusual files or recent activity that might indicate the presence of loaded malware or unauthorized access.

  - **Assess Network Traffic**: Analyze network logs for any subsequent outbound connections from the system that opened the ZIP file, as this may reveal attempts to exfiltrate data or communicate with known malicious domains.

  ### Prioritization
  This alert carries a medium severity level in an enterprise environment due to the potential for attackers to use password-protected files to bypass security measures, thus indicating potential malicious activity. However, false positives may occur from legitimate use cases, necessitating careful investigation.

  ### Blind Spots and Assumptions
  One potential blind spot is the lack of monitoring on the actual contents of the ZIP files, which might mask true malicious intent if they are not examined. The detection logic assumes that the use of encryption is inherently suspicious; thus, legitimate cases of encrypted archives for business purposes may create false positives. Required configurations include ensuring that Windows Event Logs are properly configured to capture Security Event ID 5379 and that the data retention policy allows for sufficient logs to be analyzed in the event of an alert.

