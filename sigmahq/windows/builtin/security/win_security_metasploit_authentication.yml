detection:
  selection1:
    EventID:
    - 4625
    - 4624
    LogonType: 3
    AuthenticationPackageName: 'NTLM'
    WorkstationName|re: '^[A-Za-z0-9]{16}$'
  selection2:
    EventID: 4776
    Workstation|re: '^[A-Za-z0-9]{16}$'
  condition: 1 of selection*
falsepositives:
- Linux hostnames composed of 16 characters.
level: high
note: |
  ### Technical Context

  This Sigma rule detects failed and successful SMB authentications using NTLM on Windows systems, specifically focusing on workstation names that are 16 characters long, which is atypical for legitimate users and indicates potential automated attacks or tools like Metasploit. The likely attacker objective is to establish unauthorized access through lateral movement using stolen credentials or exploiting SMB vulnerabilities. The relevant MITRE ATT&CK tactic is **Lateral Movement** and the technique is **Remote Services: SMB/Windows Admin Shares (T1021.002)**.

  The primary telemetry source is the Windows Security log, specifically Event IDs 4624 (successful logon) and 4625 (failed logon), along with Event ID 4776 (Domain controller authenticated). If malicious, this behavior could lead to unauthorized access and potential escalation privileges throughout the network. Importantly, this detection does not confirm compromise on its own; further investigation into contextual evidence is required.

  ### Investigation Steps

  - **Review authentication attempts:** Analyze Windows Security logs for Event ID 4625 and Event ID 4624 focusing on LogonType 3 authentication attempts. Look for patterns of rapid failed logons from a single source, as repeated failures followed by a success can indicate credential enumeration.

  - **Identify workstation names:** Ensure workstation names at the origin of the log entries contain 16 alphanumeric characters as indicated in the rule. Cross-reference these names against known legitimate assets or operational procedures; unexpected names may indicate malicious activity.

  - **Examine NTLM usages:** Investigate failed authentication log entries (Event ID 4625) that show 'NTLM' as the AuthenticationPackageName. In general environments, NTLM should be phased out, and frequent misuse may indicate an exploit attempt.

  - **Detect legitimate connections:** Verify expected behavior by comparing successful logins (Event ID 4624) against the user access policies and schedules. Legitimate user workstation names should not frequently exhibit end-user logon failures, especially during off-hours.

  - **Correlate with domain controller logs:** Cross-reference Event ID 4776 data from domain controllers for any authentications that align with suspicious workstation names. High numbers of logon events from these nodes should be scrutinized for potential unauthorized access.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact of lateral movement and infiltration into critical systems or data. The likelihood of this behavior being malicious is heightened given the specificity of the workstation name pattern, which is commonly associated with automated tools. Such SMB authentication activities are frequently exploited by attackers during the lateral movement phase.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers using non-NTLM authentication methods or legitimate systems employing automated processes that may trigger similar logs, such as legitimate administrative tasks. Reliable detection requires complete and accurate logging from security event sources. Furthermore, the use of legitimate scripts or tools that might interact with SMB services could lead to false positives. Companion detections involving remote execution attempts (e.g., PowerShell event logs) can provide additional context and enhance overall coverage against lateral movement threats.

