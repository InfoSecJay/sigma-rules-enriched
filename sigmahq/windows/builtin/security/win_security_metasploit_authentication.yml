logsource:
  product: windows
  service: security
detection:
  selection1:
    EventID:
    - 4625
    - 4624
    LogonType: 3
    AuthenticationPackageName: 'NTLM'
    WorkstationName|re: '^[A-Za-z0-9]{16}$'
  selection2:
    EventID: 4776
    Workstation|re: '^[A-Za-z0-9]{16}$'
  condition: 1 of selection*
falsepositives:
- Linux hostnames composed of 16 characters.
level: high
note: |
  ### Technical Context
  This Sigma rule detects authentication attempts originating from hosts that are likely controlled by the Metasploit framework, specifically targeting SMB (Server Message Block) services. The rule triggers upon the observation of failed (EventID 4625) or successful (EventID 4624) logins with NTLM authentication and where the workstation name resembles a 16-character alphanumeric string, which is a common pattern for Metasploit-generated hostnames. Such activity may indicate that an attacker is attempting to exploit SMB for lateral movement within the network, potentially seeking further access or sensitive data.

  The likely attacker objectives include gaining unauthorized access to systems, moving laterally through the network, and executing further malicious payloads. This behavior aligns with the MITRE ATT&CK framework, particularly the tactics of Lateral Movement (TA-0008) and the technique SMB/Windows Admin Shares (T1021.002), where adversaries leverage established SMB protocols to traverse networks and access other devices.

  Primary data sources for this detection include Windows Security logs, particularly those monitoring authentication events which capture logon attempts and type, such as EventID 4624 and 4625 for successful and failed logins respectively, as well as EventID 4776 which logs domain-based NTLM authentication attempts.

  ### Investigation Steps
  - **Review Security Logs:** Analyze the Windows Security logs for EventIDs 4624, 4625, and 4776 that correlate with the detected authentication patterns. Focus on the timestamps and the users associated with the attempted logins.
  - **Check Workstation Names:** Validate the workstation names against known legitimate devices in your environment. If they follow the detected pattern of 16 alphanumeric characters, consider them suspicious and investigate further.
  - **Assess Network Traffic:** Examine network traffic flows from the identified sources to any unusual internal destinations, paying special attention to SMB ports (TCP 445) and any file shares that may have been accessed.
  - **Correlate with Other Threat Indicators:** Cross-reference the detected logins with other telemetry, such as EDR alerts or behavior anomalies in the environment that may indicate suspicious lateral movement or privilege escalation attempts.

  ### Prioritization
  This alert is considered high severity due to the potential impact of lateral movement facilitated by unauthorized SMB authentication, which could lead to further compromises within the organization’s network and sensitive data exposure.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if the infrastructure includes Linux workstations not adequately monitored for equivalent authentication types, as these may produce similar log patterns. The detection logic assumes that the alphanumeric pattern is specifically indicative of Metasploit activity; however, legitimate systems may also use similar naming conventions, leading to possible false positives. For the alert to function properly, it requires continuous logging of relevant Windows security events and correct configurations on the domain to track NTLM authentications comprehensively.

