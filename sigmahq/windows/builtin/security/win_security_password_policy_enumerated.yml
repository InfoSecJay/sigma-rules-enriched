  ---

  ### Technical Context

  This rule detects attempts to enumerate the password policy by monitoring for event ID 4661, which indicates a request to access the Security Account Manager (SAM) for password-related parameters. The likely attacker objective is to gather information about password policies, such as complexity requirements or minimum lengths, which can aid in crafting effective password guessing or brute-force attacks. This behavior aligns with the MITRE ATT&CK technique "Account Discovery" (T1087).

  The primary telemetry source is Windows Security Event logs, specifically focusing on Event ID 4661. If malicious, successful enumeration can lead to targeting user accounts with weak passwords, increasing the risk of unauthorized access. Importantly, this detection does NOT by itself confirm successful account compromises or actual malicious activities; it merely highlights attempts to gain sensitive information.

  ---

  ### Investigation Steps

  - **Review Event ID 4661 details:** Check Security Event logs for Event ID 4661 to confirm enumeration occurred. Look for fields indicating access to 'ReadPasswordParameters' in the AccessList, and verify that the ObjectServer is 'Security Account Manager'.

  - **Identify source of enumeration request:** Check for the process initiating the request in the Event logs. Trusted processes (e.g., services or legitimate admin tools) may indicate benign activity, while unusual executables or scripts may suggest malicious intent.

  - **Correlate with other activities:** Cross-reference the time of the enumeration with other high-risk activities, such as unusual login attempts, using Security Event ID 4625 (Failed Logon).

  - **Monitor for user permissions changes:** Investigate changes in user account permissions leading up to the event by checking for Security Event ID 4728 (Member added to a group), which could indicate an attacker preparing to exploit the information.

  - **Verify legitimate access patterns:** Determine if legitimate administrative activities occurred around the same timeframe, such as password policy audits by IT personnel, to differentiate between benign and malicious events.

  - **Assess asset criticality:** If the enumeration is traced back to a critical system or service account, classify this as a higher priority threat, increasing the urgency of further analysis and response.

  ---

  ### Prioritization

  This alert is of medium severity, as the enumeration of password policies can indicate preparatory steps for a potential attack. While not immediately malicious, the likelihood of exploitation exists if credentials or weak passwords are involved. Attackers frequently employ this technique, emphasizing the need for prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded through the use of legitimate tools mimicking malicious behavior, or if logging is insufficiently configured. Ensure that auditing is enabled on systems accessing the SAM to capture all relevant events. Legitimate administrative tasks, such as routine audits or security assessments, may trigger this alert, potentially leading to false positives. A companion detection to consider is monitoring for "Account Modification" (T1098), which relates to changes in account security posture following enumeration.

