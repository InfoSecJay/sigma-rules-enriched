note: |
  ### Technical Context

  This Sigma rule detects enumeration attempts of Windows password policy settings through access requests to the Security Account Manager (SAM). The likely attacker objective is to gather information about password policy parameters, such as minimum password length or complexity requirements, which could aid in crafting more effective password attacks. This behavior aligns with the MITRE ATT&CK technique "Credential Dumping" (T1201).

  The primary telemetry source is Windows Security Event logs, specifically Event ID 4661, which indicates that a handle to a security object was requested, focusing on attempts to read password parameters. If successful, an attacker could leverage this information to formulate tailored brute-force attacks or phishing schemes. However, this detection does not confirm that a malicious action was executed; it merely indicates an attempt to enumerate sensitive information that could be misused.

  ### Investigation Steps

  - **Review Event Logs for Enumeration Attempts:** Check for Security Event ID 4661 in the relevant Windows Security logs. Look for entries with ObjectServer set to 'Security Account Manager' and AccessList containing '%%5392' (ReadPasswordParameters). Multiple entries may suggest suspicious activity.

  - **Correlate with User Context:** Verify the user account that generated these events. Accounts with administrative privileges attempting enumeration may warrant a higher level of scrutiny than standard user accounts.

  - **Identify Legitimate Access Patterns:** Inspect recent changes to password policy configurations in the group policy management logs (Event ID 5136). Ensure that any policy enumeration aligns with expected administrative behavior, such as troubleshooting or compliance checks.

  - **Assess the Frequency of Successful Enumeration:** Examine how often Event ID 4661 is logged for the same user account over a defined period. Increased frequency beyond standard operational behavior may indicate probing by a malicious actor.

  - **Determine System Role and Criticality:** Evaluate the affected system's role. Servers handling sensitive data or accounts with higher privilege levels typically require stricter scrutiny if enumeration events are logged.

  - **Check for Companion Activities:** Look for other related detections, such as failed login attempts or abnormal access patterns (e.g., Event ID 4625 for failed logins), that may indicate an active attack pattern related to credential exploitation.

  ### Prioritization

  The severity of this alert is medium, as it indicates potential reconnaissance activity that could lead to credential theft or system compromise. While enumeration alone does not confirm malicious intent, it indicates that an adversary is gathering intelligence, which could easily be weaponized in a further attack, especially if done against critical assets.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of security logging; if Event ID 4661 is not logged consistently due to audit policy settings, malicious activity might go unnoticed. Legitimate users, such as administrators performing routine audits, may trigger this alert, complicating incident response. Related detection methods, such as monitoring the access and usage of Group Policy Objects (GPOs), can enhance coverage against credential dumping tactics.

