note: |
  ### Technical Context
  This detection rule identifies instances where an attacker is attempting to enumerate the password policy settings on a Windows system, which can be indicative of reconnaissance activities aimed at gathering information about user credentials and account security configurations. The attacker may have objectives such as discovering weak password policies, which could be exploited for further attacks, including password spraying or brute force attempts against user accounts.

  The relevant MITRE ATT&CK techniques include **T1201 (Password Policy Discovery)**, which directly relates to enumerating password policies, and the associated tactic of **Discovery**. Attackers leveraging this technique are likely looking to exploit gaps in password security or plan effective attacks on user accounts.

  The primary data sources for detecting this behavior will be Windows security event logs, specifically the logs capturing Event ID 4661. This event indicates that a handle to an object, in this case, the Security Account Manager (SAM), was requested and can reveal access attempts that involve querying user account restrictions and policies.

  ### Investigation Steps
  - **Review Security Logs**: Examine logs for Event ID 4661 to identify instances where the Security Account Manager was accessed. Look for any unauthorized or unexpected requests to read password parameters.
  - **Analyze Access Attempts**: Investigate the `AccessList` entries in the logs to find instances where the 'ReadPasswordParameters' privilege was invoked. Cross-reference source IPs and user accounts involved for any anomalies.
  - **Verify User Account Activity**: Confirm whether the accounts making the requests have legitimate roles. Investigate unusual behavior, especially if service accounts or administrative accounts were involved.
  - **Assess Active Directory Configuration**: Review Active Directory security policies to ensure that access control settings are properly configured and that users are subjected to secure password policies.

  ### Prioritization
  The severity of this alert is medium because while the enumeration of password policies is not an immediate threat, it signals potential pre-attack reconnaissance that could lead to further exploitation. Given the critical role of password policies in overall security, it is essential to address these findings proactively.

  ### Blind Spots and Assumptions
  This detection may not cover environments where logging for Event ID 4661 is disabled or not properly configured, leading to potential gaps in monitoring. The detection logic assumes that any attempt to read password parameters outside of authorized contexts is suspicious. Additionally, configurations must ensure that detailed auditing is enabled to capture all relevant security events for this rule to function effectively.

