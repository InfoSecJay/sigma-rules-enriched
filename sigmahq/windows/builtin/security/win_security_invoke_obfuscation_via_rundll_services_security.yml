note: |
  ### Technical Context
  This detection rule targets the use of obfuscated PowerShell commands executed through the `rundll32.exe` launcher. Attackers may leverage this technique to execute malicious scripts or commands while evading detection mechanisms, acting to compromise systems or exfiltrate data. Obfuscation, such as encoding PowerShell commands, can help malicious payloads evade signature-based detection tools and flood alerts with non-malicious activity.

  The primary MITRE ATT&CK techniques relevant to this rule include:
  - **Execution - Command and Scripting Interpreter: PowerShell (T1059.001)**: This technique involves the execution of scripts via PowerShell, which is common for executing payloads.
  - **Defense Evasion - Obfuscated Files or Information (T1027)**: The attackers obfuscate their commands to hide malicious intentions.

  The best evidence for this detection arises from **Windows Security Log** events, particularly Event ID 4697, which logs service creation, and it can reveal instances of `rundll32.exe` executing potentially malicious commands.

  ### Investigation Steps
  - **Review Security Logs**: Analyze Event ID 4697 in the Windows Security logs to identify instances of `rundll32.exe` associated with user-generated obfuscated PowerShell commands.
  - **Inspect Command Arguments**: Investigate the command line arguments passed to `rundll32.exe` for any unusual or suspicious patterns, particularly those invoking PowerShell scripts or commands.
  - **Correlate with Other Logs**: Check the EDR logs for related malicious activity, such as unusual process creation and network connections initiated by the `rundll32.exe` process.
  - **Check System and User Context**: Examine the user accounts that triggered these events for any signs of compromise or unusual activity patterns.

  ### Prioritization
  Alerts generated by this rule should be treated with a medium severity level due to the potential for significant impact. The use of obfuscated commands can indicate an attempt to execute malicious actions stealthily within the environment, which may lead to data breaches or system compromises.

  ### Blind Spots and Assumptions
  This detection rule may not catch all instances of obfuscated PowerShell execution, especially if the execution method changes or if attackers utilize alternative methods to conceal their commands. The detection assumes that the `System Security Extension` audit subcategory is enabled to log Event ID 4697, and any misconfiguration in logging may result in missed detections. Additionally, attackers may find ways to obfuscate their activities further, which could limit the scope of detection mechanisms.

