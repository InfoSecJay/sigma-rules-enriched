note: |
  ### Technical Context

  This Sigma rule detects the creation (Event ID 4741) or removal (Event ID 4743) of computer accounts in Active Directory. It is indicative of potential unauthorized changes to the domain environment, often associated with tactics like domain persistence or lateral movement by an attacker. The likely attacker objective is to manipulate Active Directory objects to impersonate or establish rogue systems for further exploitation. This behavior aligns with the MITRE ATT&CK framework under the tactic "Defense Evasion" (TA0005) and technique "Domain Object Modification" (T1207).

  Primary telemetry sources include the Windows Security Event Log with specific focus on Event IDs 4741 and 4743. If malicious, these actions can compromise the integrity of the entire Active Directory, enabling attackers to gain access to sensitive resources or conduct further attacks. This detection does not confirm that an attack is occurring but indicates an observable change in the environment that warrants further investigation.

  ### Investigation Steps

  - **Review Event IDs 4741 and 4743:** Check for recent logged events in the Windows Security log that correspond to the creation or deletion of computer accounts. Focus on the time of the event and the account making the change (fields: SubjectUserName, TargetUserName).

  - **Evaluate the target computer names:** Cross-reference the names of newly created accounts against a list of legitimate asset names and standards in your environment. Legitimate additions should be part of a documented provisioning process.

  - **Assess the initiating account:** Investigate the account that performed the changes (SubjectUserName). Focus on accounts with elevated privileges, such as Domain Admins. Legitimate activities often involve well-known administrative accounts.

  - **Analyze related user activities:** Look for spikes in login attempts or administrative tasks performed by the initiating account around the same time as the creation or deletion events. Fields to examine: LogonType, Event ID 4624.

  - **Check for SPN configurations:** For newly created computers, confirm if Service Principal Names (SPNs) were configured. This can indicate an attempt to facilitate recon or lateral movement within the network.

  - **Correlate with additional telemetry:** If available, review network traffic logs for unusual outbound connections or service requests originating from the newly created computer accounts, which could indicate misuse. Relevant fields include Source IP, Destination IP, and URL queries.

  ### Prioritization

  The severity of this alert is considered low in a routine review context but should be treated with caution due to the potential impact on the Active Directory environment. The likelihood of malicious abuse is moderate; attackers may leverage account creation and deletion to establish persistence. This technique is not uncommon in sophisticated attacks, although it may also occur due to legitimate administrative actions.

  ### Blind Spots and Assumptions

  This detection may not capture scenarios where an adversary uses legitimate administrative privileges to execute changes, thus assuming a benign context. Log source reliability is crucial; ensure that security auditing for Directory Services is correctly enabled to capture necessary events. Legitimate activities, such as reimaging or replacing hardware, may trigger this alert. A related detection rule would be monitoring for changes to Group Policy Objects (GPO), which could reinforce the monitoring of changes made in Active Directory environments.

