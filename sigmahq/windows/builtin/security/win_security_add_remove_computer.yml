  ### Technical Context

  This rule detects the creation (Event ID 4741) or removal (Event ID 4743) of computer accounts in Active Directory. Potential attacker objectives for these actions include establishing persistence or attempting to impersonate machines for lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Account Manipulation (T1207).

  The primary telemetry sources include Windows Security logs, specifically looking for Event ID 4741 for the creation of a computer account and Event ID 4743 for the removal of a computer account. If malicious, this could signify a compromised domain controller being used to facilitate further attacks such as DCShadow. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could trigger these events.

  ### Investigation Steps

  - **Review Event ID 4741 or 4743 logs**: Check Windows Security logs (Event IDs 4741 and 4743) for timestamp, user account performing the action, and the computer account involved. Malicious activity may manifest as unexpected accounts created or removed by non-admin users.

  - **Check user account permissions**: Verify the privileges of the user account that triggered the alerts by examining the Domain Controller logs and Group Membership (e.g., Event ID 4728 for added to group). Benign actions may be performed by administrators with necessary permissions.

  - **Correlate actions with recent network activity**: Analyze the network access logs (e.g., Windows Firewall or Sysmon logs) for suspicious access patterns around the same timestamp (e.g., Event ID 3 for network connection) that coincide with the changes made to computer accounts.

  - **Validate against expected organizational changes**: Identify if the change could be a result of planned IT operations, such as device upgrades or changes, by reviewing change management records. Legitimate events are usually documented and approved.

  - **Assess related DC activity**: Check for other suspicious events in the Domain Controller logs (Event IDs 5136: modifications, 4662: permissions changes, etc.) around the same time frame as the computer account changes. Presence of multiple AD changes could indicate broader attacks.

  - **Benchmark against known good configurations**: Gather baselines of regular Active Directory modifications to identify anomalies, focusing on unusual SPN entries or modifications, as these could indicate attempts to configure rogue services or impersonate legitimate machines.

  ### Prioritization

  This alert should be classified as low severity in a mature enterprise SOC context due to the relative infrequency of legitimate need for such changes, combined with the potential for malicious abuse that could lead to significant security implications. While computer account modifications can occur in routine operations, elevated or unauthorized changes necessitate deeper investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper auditing configurations or by adversaries disabling logging. Legitimate actions, such as IT personnel making routine changes, could also trigger this alert. Additionally, companion detections based on unusual authentication (e.g., Event ID 4624 for logon) can strengthen overall visibility into potential incidents involving compromised accounts.

