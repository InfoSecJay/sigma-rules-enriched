  ### Technical Context

  This rule detects the addition or removal of computer objects in Active Directory, specifically through the security events 4741 and 4743. An attacker may use this technique to manipulate the domain environment, potentially creating malicious entities for lateral movement or privilege escalation. The relevant MITRE ATT&CK tactics include Defense Evasion (T1207) as attackers attempt to hide or impersonate valid domain configurations.

  The primary telemetry sources come from Windows Security Event logs, specifically Event IDs 4741 (computer account creation) and 4743 (computer account deletion). If malicious, these actions may manipulate trust relationships within an organization. It is crucial to understand that the mere occurrence of these events does not confirm malicious intent without context; legitimate administrative actions can trigger these alerts.

  ---

  ### Investigation Steps

  - **Verify event timestamps:** Cross-reference timestamps of Event ID 4741 or 4743 with other user activity logs (e.g., Security Event ID 4624 for logon events) to establish a context of legitimacy. Administrative actions generally coincide with scheduled maintenance windows.

  - **Validate user permissions:** Determine if the user or service account that triggered the event has legitimate administrative permissions for Active Directory management. Users with delegated permissions may perform these actions as part of their role.

  - **Analyze created computer objects:** Check for anomalies in the attributes of newly created computer objects (Event ID 4741). Look specifically for unusual names, Service Principal Names (SPNs), or configurations that do not align with organizational naming conventions.

  - **Monitor for lateral movement patterns:** Investigate subsequent events (e.g., credential access events such as Event ID 4625 for failed logins) from the same host or the newly created computer object as it may indicate an attempt to leverage the created accounts for lateral movement.

  - **Review historical trends:** Compare the frequency of computer account modifications over time. A sudden spike may indicate malicious activity. Normal levels should align with planned IT changes within your organization.

  - **Identify legitimate administrative activities:** Recognize that internal IT teams may trigger events for maintenance or updates, such as deploying new machines for user onboarding. Confirm whether these tasks were documented in change logs or tickets.

  ---

  ### Prioritization

  The alert severity is low; however, its context becomes critical depending on the affected system's role within the network. Since the manipulation of computer accounts can signify preparatory steps for lateral movements or credential abuse, response actions may escalate based on the investigation findings and any anomalies in user activity patterns.

  ---

  ### Blind Spots and Assumptions

  This detection rule may miss fraudulent activities if an attacker utilizes legitimate administrator accounts to perform these actions, making their detection challenging. Ensure comprehensive logging configurations are in place to capture all relevant event IDs and account activities for reliable detection. Legitimate automated processes or administrative scripts may trigger the alert, necessitating awareness of ongoing IT operations. A related detection that enhances coverage is monitoring for unusual logon patterns around the same timeframe, which may indicate the abuse of recently created accounts.

