note: |
  ### Technical Context
  This detection rule identifies the creation or removal of computer accounts in Active Directory by monitoring specific Security Event IDs (4741 for creation and 4743 for deletion). Such activities are particularly relevant when considering possible tampering with Active Directory resources, potentially tied to sophisticated attacks like DCShadow. Attackers may use this behavior to manipulate domain controllers, create rogue systems, or remove legitimate computers to obscure their presence and elevate privileges.

  In a typical threat scenario, an attacker with sufficient privileges might seek to enact changes to computer accounts to establish persistence, facilitate lateral movement, or execute maneuvers aimed at undermining security controls. This activity can suggest a compromise, especially if unauthorized or unexpected changes are observed. Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) via the technique **Valid Accounts** (T1078) and **Account Manipulation** (T1098).

  The primary data sources for detecting these actions include Windows security logs, which can provide insight into the event types related to account management and other security-auditing activities.

  ### Investigation Steps
  - **Review Security Event Logs:** Examine Windows security event logs focusing on Event IDs 4741 and 4743 to identify any recent computer account creations or deletions, noting the user or system that initiated the action.
  - **Analyze Source IP Addresses:** Determine if the events originated from expected IP addresses or user accounts, and cross-reference against known assets in the environment to look for anomalies.
  - **Check for Associated Activities:** Investigate other security events that occurred around the same time, including account logins or service changes, which may indicate coordinated malicious activity.
  - **Correlate with Other Alerts:** Utilize SIEM tools to correlate these events with other suspicious alerts, such as abnormal account access patterns or identity-related changes within the network.

  ### Prioritization
  This alert is categorized as low severity due to its specific nature; however, it may point to a critical security incident if linked with other irregular activities, particularly in an enterprise environment where integrity of Active Directory is paramount.

  ### Blind Spots and Assumptions
  Gaps may exist in detection coverage involving direct access to security logs or specific logging policies that may not be enforced consistently across the enterprise. Additionally, the detection logic assumes that changes made are unauthorized without context, meaning legitimate administrative actions could generate false positives. For this alert to function effectively, Windows Security Auditing must be configured correctly to log the relevant events, which requires appropriate user privilege and policy settings across domain controllers.

