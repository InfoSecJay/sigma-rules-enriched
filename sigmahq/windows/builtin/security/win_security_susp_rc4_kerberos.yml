detection:
  selection:
    EventID: 4769
    TicketOptions: '0x40810000'
    TicketEncryptionType: '0x17'
  reduction:
    ServiceName|endswith: '$'
  condition: selection and not reduction
falsepositives:
- Service accounts used on legacy systems (e.g. NetApp)
- Windows Domains with DFL 2003 and legacy systems
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious Kerberos service ticket requests that utilize RC4 encryption. The use of RC4, especially noted in the context of Kerberoasting, raises red flags as attackers may exploit service accounts to request and subsequently crack these tickets offline to obtain sensitive account credentials. Attackers typically aim to gather secrets from service accounts, escalate privileges, or move laterally within a network. It is essential to monitor such activities, especially in environments that contain legacy systems or where older domain functional levels (DFL) are in use.

  Relevant MITRE ATT&CK tactics and techniques for this rule include:
  - Credential Access (TA1003)
  - Kerberoasting (T1558.003)

  The primary data sources for detecting this activity are Windows security logs, particularly Event ID 4769, which records service ticket requests. These logs can provide insights into organizations' usage of service accounts and highlight potential misuse.

  ### Investigation Steps
  - **Review Security Event Logs**: Analyze Windows Security Event ID 4769 for service ticket requests utilizing the RC4 encryption type. Pay attention to patterns involving service accounts, especially those ending with a dollar sign.

  - **Identify Suspect Accounts**: Cross-reference the accounts making the suspicious requests with your organization's service account list. Focus on accounts with elevated privileges or those that should not have Kerberos service tickets requested in their usage patterns.

  - **Analyze Ticket Requests**: Investigate the timestamp and context surrounding the Kerberos service ticket requests. Look for timings and patterns that may suggest automated or scheduled tasks instead of legitimate user behavior.

  - **Correlate with Other Logs**: Use additional logs, such as those from endpoint detection tools, to identify any further suspicious activity linked to the compromised service accounts, like unusual login times or failed authentication attempts.

  ### Prioritization
  This alert should be treated with medium severity due to the potential implications of Kerberoasting on organizational security. The risk level is heightened in environments with numerous service accounts or where privileged activities by these accounts can impact overall system integrity.

  ### Blind Spots and Assumptions
  Detection capabilities may be limited by legacy systems that do not properly log or generate the expected Event ID 4769 entries. Additionally, the rules may not account for false positives, particularly if service accounts are used legitimately on older systems (such as certain NetApp configurations). The detection logic assumes that all legitimate service accounts follow modern security practices and may not adequately monitor some edge cases or legacy implementations. Required logs for this alert's efficacy must include configured security auditing on all relevant Windows systems to capture the ticket requests effectively.

