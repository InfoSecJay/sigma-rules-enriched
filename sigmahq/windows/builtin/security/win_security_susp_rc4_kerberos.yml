detection:
  selection:
    EventID: 4769
    TicketOptions: '0x40810000'
    TicketEncryptionType: '0x17'
  reduction:
    ServiceName|endswith: '$'
  condition: selection and not reduction
falsepositives:
- Service accounts used on legacy systems (e.g. NetApp)
- Windows Domains with DFL 2003 and legacy systems
level: medium
note: |
  ### Technical Context

  This rule detects the use of RC4 encryption types (TicketEncryptionType: '0x17') in service ticket requests, which is indicative of Kerberoasting attempts. Attackers may exploit weak service account configurations to obtain service tickets for offline password cracking, aiming to retrieve plaintext passwords of these accounts. This activity aligns with the MITRE ATT&CK techniques of Credential Access (T1558.003) and is commonly initiated from networked systems with access to Active Directory services.

  The primary telemetry source is the Windows Security log, specifically Event ID 4769, which captures service ticket requests. If successfully executed by an adversary, this behavior can lead to unauthorized access and lateral movement within the network. Importantly, while this detection indicates anomalous use of encryption type, it does not confirm that passwords have been successfully extracted or cracked.

  ### Investigation Steps

  - **Check event logs for suspicious ticket requests:** Review Windows Security Event ID 4769 for accounts issuing service ticket requests using RC4 encryption (TicketEncryptionType: '0x17'). Look for unusually high volumes of requests from specific accounts, particularly those associated with low privilege or service accounts.

  - **Identify service accounts with legacy configurations:** Check for any accounts with ServiceName ending in '$' that have a history of advanced usage of Kerberos. These should generally use more secure encryption types. Use PowerShell cmdlets like `Get-ADServiceAccount` to enumerate such accounts.

  - **Validate the environment's Domain Functional Level:** Ensure the domain functional level is not set to 2003 or below, as this may lead to more frequent legitimate occurrences of this behavior. Query with `Get-ADDomain` and confirm compliance with security best practices.

  - **Look for signs of password cracking activity:** Search for unusual file creation or access patterns on systems that service accounts connect to, as indicators that the attacker might be exporting the requests to break them offline. Use Sysmon logs (Event ID 11) to examine command-line activity and File System Activity.

  - **Assess historical access patterns:** Compare the behavior of flagged accounts with typical usage patterns over time. Look for anomalies such as ticket requests occurring outside of normal business hours or from unusual source IP addresses.

  ### Prioritization

  This alert should be considered medium priority due to its detection of potentially malicious activity targeting service accounts, which are crucial for system functionality. However, the actual impact may vary depending on the sensitivity of the service accounts involved and the specific context of their usage.

  ### Blind Spots and Assumptions

  This detection is limited by the presence of legacy systems that may generate false positives, such as NetApp configurations. It relies on correct logging configurations to capture Event ID 4769; without these, detection is unreliable. Legitimate activities including the use of outdated encryption methods in legacy systems may trigger the alert. Companion detections such as monitoring for anomalous user behavior or excessive failed authentication attempts may enhance overall threat detection capabilities.

