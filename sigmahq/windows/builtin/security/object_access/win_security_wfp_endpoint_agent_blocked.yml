note: |
  ### Technical Context

  This Sigma rule detects blocked connection events from various Endpoint Detection and Response (EDR) agent binaries by the Windows Filtering Platform (WFP). An attacker might attempt to disable or impede EDR functionality to avoid detection during malicious activities, such as data exfiltration or malware deployment. This behavior relates to MITRE ATT&CK tactic "Defense Evasion" (T1562) and technique "Impair Defenses" (T1685).

  The primary telemetry source for this detection is Windows Security event logs, specifically looking for Event ID 5157. If malicious, the security impact is significant as it indicates an adversary may be circumventing security controls, potentially leading to system compromise. Importantly, this detection does NOT confirm that a malicious action has occurred without further context; it simply indicates an EDR communication attempt was blocked.

  ### Investigation Steps

  - **Review blocked connections:** Check Windows Security logs for Event ID 5157. Look for entries indicating connections blocked from EDR agent binaries listed in the rule (e.g., *\MsMpEng.exe* for Microsoft Defender). If the timestamps align closely with other suspicious activities, it may indicate possible evasion attempts.

  - **Identify the origin of the blocking event:** Analyze the source of the blocked connection in the Event ID 5157 details. Determine if the connection was made from a legitimate process within the organization's EDR suite or by an unauthorized application.

  - **Check recent EDR agent activity:** Query the relevant EDR's logs for any failed reports or abnormal behaviors, such as processes not performing expected scans or updates. This is crucial for discerning whether this blocked event is part of an ongoing evasion tactic.

  - **Correlate with other security events:** Look for related security events around the same timeframe (Event IDs 4688 for process creation) to examine if any known malicious processes were executed leading up to the blocked connection.

  - **Identify legitimate behavior:** Explore any instances where EDRs are performing normal operations without interruptions. Validate regular update schedules, scan activities, and network communication patterns expected from the legitimate EDR agent binaries.

  - **Watch for high-confidence indicators:** Pay special attention to frequent blocked attempts from EDR binaries linked with known malicious IPs or domains; this may indicate attempts to disable the EDR functionality.

  ### Prioritization

  The alert severity is high, as a compromised EDR agent could significantly increase the risk of successful data breaches and evade detection. The behavior is likely malicious if associated with unusual execution patterns and notable in the context of targeted adversary tactics. EDR agents are often prime targets for attackers and are regularly weaponized in breach attempts.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using internal IPs or legitimate-looking processes to block EDR communications without raising suspicion. The requirement for enabling Audit Filtering Platform Connection is critical for proper detection; without this, the rule cannot trigger. Legitimate scenarios, such as troubleshooting or routine maintenance of EDR tools, may also trigger the alert. To enhance detection coverage, consider implementing companion detections focusing on known exploit behaviors (e.g., Tactic: Lateral Movement, Technique: Remote Services T1021).

