note: |
  ### Technical Context
  This detection rule identifies instances where Windows Filtering Platform (WFP) has blocked network connections originating from common Endpoint Detection and Response (EDR) agents. This behavior is concerning as adversaries may employ WFP filters to obstruct EDR functionalities, effectively silencing critical security alerts that these tools would otherwise generate. Attackers may aim to bypass detection capabilities, maintain persistence, or conduct unauthorized actions within the environment without interference from security monitoring tools.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique **Indicator Removal on Host** (T1562). By blocking communication from EDR agents, attackers can evade detection of their malicious activities, thereby enhancing their chances of successful exploitation. The primary data sources for this rule will include Windows Security event logs, specifically those logs capturing connection events related to EDR application binaries.

  ### Investigation Steps
  - **Review Windows Security Event Logs:** Examine logs for EventID 5157 to identify blocked connection attempts initiated by EDR agent binaries. Pay attention to the source and destination addresses for potential relationships with compromised systems.

  - **Analyze EDR Agent Activity:** Investigate the operations performed by the identified EDR agents prior to the blocked event. Look for patterns indicating unusual behavior, such as accessing sensitive resources or generating unexpected alerts.

  - **Correlate with Network Traffic Logs:** Cross-reference the blocked connection events with network logs (from NDR or firewalls) to determine if there are any unusual outbound connections or patterns that coincide with the EDR agent's blocked communications.

  - **Inspect Policy and Configuration Changes:** Check for any recent modifications to WFP configurations or security policies that might explain the blocking of EDR connections. Ensure that these configurations are in line with organizational security policies.

  ### Prioritization
  This alert is classified as high severity due to its potential impact on the security posture of the enterprise. The likelihood of blocked EDR communications indicates a possible active evasion technique being employed by an adversary, necessitating immediate investigation to mitigate any ongoing threats.

  ### Blind Spots and Assumptions
  One gap in this detection coverage is the dependency on adequate logging configuration; if the Audit Filtering Platform Connection isn’t enabled, relevant events may not be logged. The detection logic assumes that all EDR agents follow the common naming conventions specified in the rule and that blockage of their connections is indicative of evasion attempts. Additionally, there may be legitimate administrative actions that result in blocked communications, which could lead to false positives. Without clear visibility into network changes or EDR functionality, investigations could miss contextual details needed for a complete analysis.

