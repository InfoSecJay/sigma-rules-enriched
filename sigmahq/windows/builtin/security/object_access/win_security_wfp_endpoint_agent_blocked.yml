note: |
  ---

  ### Technical Context

  This Sigma rule detects blocked connection events by the Windows Filtering Platform (WFP), specifically targeting processes associated with various Endpoint Detection and Response (EDR) agents. The likely attacker objective is to disable or interfere with the functionality of EDR solutions to evade detection of malicious activities, a technique often referred to within the MITRE ATT&CK framework under the tactic of "Defense Evasion" (TA0005), specifically technique T1562: Impair Process Control.

  Primary telemetry sources include Windows Security logs, where Event ID 5157 indicates a blocked connection event. If the behavior detected is due to an adversary's interference with EDR agents, the security impact would be significant, as it may allow for undetected lateral movement or malware execution. Importantly, while a detected blocked connection indicates potential evasion techniques in play, it does not confirm malicious activity on its own, as legitimate processes may trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review Event ID 5157 logs:** Validate security logs for Event ID 5157. Ensure the affected application matches known paths for listed EDR binaries (e.g., `\MsMpEng.exe` for Microsoft Defender). Legitimate behavior would involve these processes actively reporting or blocking threats.

  - **Investigate previous events for context:** Check for prior security events (Event IDs 4624 and 4688) involving the same binary that may provide insight into normal operations or anomalous behavior prior to the blocked event. A pattern of blocked connections over time could suggest malicious tampering.

  - **Analyze network configurations:** Examine if any active WFP filters exist through commands like `netsh wfp show filters`. Legitimate activities may include benign filtering for application security, while unusual configurations should raise suspicion.

  - **Verify EDR functionality:** Check EDR dashboards or logs to see whether the impacted services are operational, including recent detection alerts or reports. A disabled or non-functional EDR agent provides high confidence of malicious indicator status.

  - **Examine system criticality and roles:** Identify the impacted system's role within the environment (e.g., server, endpoint) and its importance to core operations. An attack on a critical server using network filtering may indicate higher risk.

  - **Investigate for signs of evasion tools:** Search for artifacts related to known evasion tools or techniques, like EDRSilencer or EDRNoiseMaker, which could include specific file paths or registry modifications. Flags indicating installations can suggest malicious intent.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on the integrity of security monitoring in the enterprise. The likelihood of malicious abuse is significant, as attackers frequently target EDR agents to avoid detection. Such behavior is well-documented and commonly weaponized to enable further attacks.

  ---

  ### Blind Spots and Assumptions

  The primary detection limitation is that legitimate administrative actions or misconfigurations can also trigger this alert, complicating the ability to differentiate between benign and malicious intent. The effective operation of this rule relies on proper logging configurations within the Windows operating system. Additionally, tools that broadly interact with Windows processes could trigger false positives. Related detections, such as unusual parent-child relationships around EDR binaries indicating potential exploitation, would further strengthen coverage.

