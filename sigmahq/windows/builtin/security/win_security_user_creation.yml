note: |
  ### Technical Context
  This rule detects the creation of local user accounts on Windows servers within an Active Directory (AD) environment, which typically should not occur. The creation of unauthorized local accounts can indicate lateral movement or persistence mechanisms employed by an attacker. In such scenarios, an adversary might seek to establish footholds on critical systems to further their objectives, such as gaining unauthorized access or maintaining control within the network.

  Relevant MITRE ATT&CK tactics include **Persistence** and the associated technique of **Local Account Creation (T1136.001)**. Attackers may leverage this technique to ensure continued access to a system after an initial compromise, especially when modifying existing accounts or creating new ones that could evade detection. The primary data source for this detection rule is Windows Security event logs, specifically targeting Event ID 4720 which captures the creation of a local user account.

  ### Investigation Steps
  - **Review Windows Event Logs**: Examine the Windows Security event log for Event ID 4720 to identify details about the account creation, such as the account name and the creator’s user ID.
  - **Assess Timing and Context**: Correlate the timestamp of the account creation with other logged events to understand the operational context and determine if there are related suspicious activities occurring around that time.
  - **Identify Anomalous Accounts**: Look for naming conventions that deviate from standard practices. Unusual or generic account names (e.g., "Admin1" or "User123") may indicate malicious intent.
  - **Evaluate Group Membership Changes**: Investigate if the newly created user accounts were granted elevated privileges or added to sensitive groups, which could indicate an attempt to leverage their access for further exploitation.

  ### Prioritization
  This alert is considered low severity because while local user account creation may not always indicate malicious activity, its occurrence in an Active Directory environment is unusual and warrants further investigation to rule out potential exploitation attempts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments that utilize privileged account management tools managing local accounts, as such cases may result in false positives. The detection logic assumes that local account creation is inherently unauthorized, which may not hold true for some server configurations where temporary or service accounts are allowed. For accurate detection, it is essential to have Windows Security logs enabled to capture event details relating to user creation.

