note: |
  ### Technical Context

  This rule detects the creation of local user accounts on Windows servers, indicated by Security Event ID 4720. In a well-structured Active Directory (AD) environment, such activity is unusual and raises concerns about potential unauthorized changes to system access. The likely attacker objective is to establish a foothold or facilitate further exploitation by creating new user accounts, potentially with escalated privileges. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003), and the technique is "Create Account" (T1136.001).

  Primary telemetry sources are Windows Security logs, specifically looking for Event ID 4720, which logs information on local accounts being created. If this activity is initiated by an unauthorized user, it could lead to severe security impacts such as unauthorized data access, lateral movement, or data exfiltration. It’s important to note that this detection does NOT confirm malicious activity on its own; additional context is required to ascertain the intent behind the account creation.

  ### Investigation Steps

  - **Review Event ID 4720 data**: Check the logs for Event ID 4720 which includes the username, creator, and target machine. Look for unusual user names (e.g., "Admin1", "TempUser") that deviate from standard naming conventions.

  - **Verify the creator's identity**: Cross-reference the creator's user account against existing user and administrative roles. Legitimate account creations should originate from known administrative accounts or privileged account management tools.

  - **Inspect account attributes**: Analyze the attributes of the newly created account for atypical properties. Assess properties like "Account is Disabled" or "Password Not Required" which can indicate malicious intent.

  - **Identify system roles**: Confirm if the host is a server where local user account creation is unauthorized. Local user accounts should not be created on domain-joined servers unless specifically justified by business requirements (e.g., for isolated applications).

  - **Check for related events**: Look for subsequent events related to the newly created account (e.g., Event ID 4624 for logon events). Multiple logins after the creation may indicate potential misuse of the account.

  - **Monitor for suspicious behavior**: Watch for unusual activities associated with the newly created user account, such as attempts to access sensitive directories or service start events that deviate from normal operational behavior.

  ### Prioritization

  The alert should be treated with moderate severity due to the potential misuse of newly created accounts on critical servers. The risk is elevated if the affected system is critical for operations, as it could indicate lateral movement or persistence tactics employed by an attacker. While not universally weaponized, the creation of unauthorized accounts is a known method in exploitation frameworks.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of privileged account management tools or scripts which could perform legitimate local account creations. Organizations must ensure Security Event logging is adequately configured to capture Event ID 4720. The alert could also be triggered by legitimate system maintenance activities or system misconfigurations. A related detection to enhance coverage would be monitoring of account logon events (Event ID 4624) to identify anomalous logins following user creation.

