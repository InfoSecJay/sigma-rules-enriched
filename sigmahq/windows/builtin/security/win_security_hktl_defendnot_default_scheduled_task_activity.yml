title: HackTool - Defendnot Default Scheduled Task Activity
id: 015ff932-4156-41ae-9d4c-1443995611fd
status: experimental
description: |
  Detects the default scheduled task activity of the hacktool Defendnot, which is used to disable Windows Defender Security.
  It abuses Microsoft's undocumented WSC API to register itself as a fake antivirus product, allowing it to disable Windows Defender.
  During installation, Defendnot creates a scheduled task named 'defendnot' with the argument '--from-autorun' for persistence.
references:
- https://github.com/es3n1n/defendnot/blob/525176a37721ead27d3f9f77f59b58abfc305988/README.md
- https://www.huntress.com/blog/defendnot-detecting-malicious-security-product-bypass-techniques
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-10-18
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
- attack.t1053.005
- attack.t1685
logsource:
  product: windows
  service: security
detection:
  selection_eid:
    EventID:
    - 4698
    - 4702
  selection_task:
  - TaskName: '\defendnot'
  - TaskContent|contains:
    - 'defendnot'
    - '<Arguments>--from-autorun</Arguments>'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation and configuration of a scheduled task named "defendnot" on Windows systems, which is associated with a known hacktool designed to disable Windows Defender Security features. The likely attacker objective is to bypass security measures, allowing malware to operate undetected. This behavior fits into the MITRE ATT&CK tactics of Execution (T1053.005) and Persistence (T1685). The primary telemetry source includes Windows Security Event logs, specifically Event IDs 4698 and 4702, which track scheduled task creation and modification activities. If malicious, the security impact is significant, as it enables unauthorized persistence and potential exploitation of the system. This detection does NOT confirm malicious activity on its own, as legitimate applications may also create scheduled tasks.

  ### Investigation Steps

  - **Check scheduled tasks: **Review the list of scheduled tasks on the affected system. Use PowerShell command `Get-ScheduledTask | Where-Object {$_.TaskName -like "defendnot"}`. A task with this name is suspect, especially if it was created recently and its purpose is not aligned with known software.

  - **Examine event logs for task creation: **Correlate Event IDs 4698 (scheduled task creation) and 4702 (task modification) in the Security Event log. Look specifically for entries related to the 'defendnot' task. Legitimate tasks will often have clear, descriptive names and associated purposes.

  - **Review task arguments for anomalies: **Investigate the arguments and content of the scheduled task. The presence of '<Arguments>--from-autorun</Arguments>' is indicative of malicious intent. Validate against known legitimate tasks for discrepancies.

  - **Analyze associated processes: **Use Sysmon Event ID 1 (Process Creation) to identify if 'defendnot' triggered any outbound connections or executed suspicious executables. Any processes that depend on this task running could indicate malicious intentions if they deviate from expected functionality.

  - **Check for system changes: **Investigate recent changes to Windows Defender settings via Event ID 5007 in Security logs. Disablement of Windows Defender can be a compelling indicator of the presence of the 'defendnot' hacktool.

  - **Identify potential persistence: **Evaluate system startup or autorun settings by checking HKLM\Software\Microsoft\Windows\CurrentVersion\Run registry keys. Legitimate entries will typically correspond to known software, whereas any reference to 'defendnot' or unusual entries may signal malicious persistence.

  ### Prioritization

  This alert represents a high severity due to the potential impact on critical systems, especially in environments relying on Windows Defender for endpoint protection. The likelihood of this behavior being malicious is considerable, as hacktools that disable security measures pose significant risks. Such techniques are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by user account privileges that prevent visibility into scheduled tasks and modifications. Legitimate applications with obscure names could also trigger this alert, leading to potential false positives. Required logs include comprehensive Security Event logs from Windows servers; lacking these may hinder detection. A related detection is monitoring for API calls to Windows Management Instrumentation (WMI), which can complement the identification of abnormal scheduled task behaviors.

