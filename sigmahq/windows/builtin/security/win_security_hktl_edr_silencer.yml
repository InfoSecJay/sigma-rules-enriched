note: |
  ### Technical Context
  This detection rule identifies the execution of EDRSilencer, a malicious tool designed to interfere with endpoint detection and response (EDR) solutions by leveraging the Windows Filtering Platform (WFP). Specifically, it adds filters that block outbound communications from EDR agents, effectively rendering them incapable of reporting malicious activity or threats to a centralized logging or SIEM solution. The primary threat scenario involves an attacker attempting to maintain stealth by using this tool to eliminate visibility into their activities during or after a compromise. The likely objectives include data exfiltration, lateral movement, or persistence within the system.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion** (TA0005)
  - **Filter Driver** (T1562.001)

  The primary data sources for this detection are Windows Security logs, specifically those capturing WFP events such as Event IDs 5441 and 5447. Ensuring that the Audit Filtering Platform Policy change is enabled will provide the necessary logs for tracking such activities.

  ### Investigation Steps
  - **Review Filter Changes:** Examine Windows security logs for Event IDs 5441 and 5447 to identify newly added outbound filters, particularly those containing the string 'Custom Outbound Filter'.
  - **Analyze EDR Behavior:** Investigate any recent changes or unusual behavior in EDR agents on the affected systems, assessing their functionality and communication patterns with the SIEM.
  - **Check Process Execution Logs:** Utilize EDR or Windows Process Creation logs to trace the execution of EDRSilencer and any associated command line arguments that indicate its use.
  - **Evaluate Network Traffic:** Monitor outbound network traffic for anomalies or communications that could indicate evasion attempts or manipulation of data flows by the identified filter.

  ### Prioritization
  The alert is classified as high severity due to the critical role EDR solutions play in endpoint protection and incident response. An attacker using EDRSilencer poses a significant risk by disabling defenses and creating potential pathways for further malicious activity.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage if Audit Filtering Platform Policy Change is not enabled, which is necessary for logging WFP filter changes. The detection logic assumes that the EDRSilencer tool will use the specified filter name, thus it may not capture variants of the tool or obfuscated executions. Furthermore, this rule relies on the availability of specific event logs which may not be present on all Windows systems or configurations.

