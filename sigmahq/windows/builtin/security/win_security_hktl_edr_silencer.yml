note: |
  ### Technical Context

  This rule detects the execution of EDRSilencer, a malicious tool that manipulates the Windows Filtering Platform (WFP) to create outbound filters, effectively obstructing traffic from Endpoint Detection and Response (EDR) agents. The likely attacker objective is to disable EDR capabilities to facilitate undetected malicious activity, thereby maintaining a prolonged presence within the compromised environment. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1685 (Manipulation of Filtering/Control Lists).

  The primary telemetry sources include Windows Security Logs, specifically focusing on Event IDs 5441 (WFP filter addition) and 5447 (Policy change). If exploited, this could enable attackers to circumvent security monitoring and detection measures, leading to data exfiltration or lateral movement. It is crucial to note that this detection does NOT confirm a successful compromise on its own; additional evidence must be gathered to ascertain malicious intent.

  ### Investigation Steps

  - **Review security event logs for suspicious filters:** Check Windows Security Event IDs 5441 and 5447 for any instances of filter names containing 'Custom Outbound Filter'. Legitimate filter additions will typically involve standard company-defined filter names and should not deviate from established naming conventions.

  - **Correlate implement time with reported incidents:** Analyze the timestamps of the detected filters against recent security incidents or anomalies in the environment, particularly around the time of any known active threats in your organization.

  - **Identify high-confidence malicious indicators:** Look for unauthorized scripts or executables associated with the EDRSilencer tool on endpoints, specifically those found in the context of suspicious PowerShell commands or system processes. This includes checking for known paths or hashes of the EDRSilencer executable.

  - **Validate legitimate activities:** Confirm that users or processes making changes to filtering strategies are authorized personnel or system processes associated with regular administrative tasks, as typical behavior should not generate outbound filter modifications unexpectedly.

  - **Monitor affected systems for following red flags:** Check for the absence of expected EDR agent network communication or logs of EDR service activity following the filter creation as evidence of an evasion attempt.

  ### Prioritization

  This alert is of high severity, considering it targets systems that may critically impact organizational security via EDR disruption. The likelihood of malicious abuse is high due to the established use of tools like EDRSilencer in the attack lifecycle. Defense evasion techniques, particularly those targeting detection mechanisms, are commonly weaponized by adversaries, amplifying the urgency of response.

  ### Blind Spots and Assumptions

  Detection may be limited if not all relevant logs are enabled; specifically, auditing for Filtering Platform Policy Changes must be configured to ensure comprehensive coverage. Legitimate activities such as routine firewall adjustments may trigger the alert, potentially leading to false positives. A companion detection that strengthens coverage could be alerting on unusual application behavior or unexpected process creations, as these scenarios may indicate an attempt to execute other evasion techniques in conjunction with EDRSilencer.

