note: |
  ### Technical Context

  This Sigma rule detects the execution of EDRSilencer, a tool that manipulates the Windows Filtering Platform (WFP) to create custom outbound filters that can block traffic from endpoint detection and response (EDR) agents, thereby attempting to evade detection. The likely objective of an attacker using this tool is to prevent detection of malicious activity occurring on a compromised system, facilitating further exploitation or data exfiltration.

  This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (T1562) and specifically with the technique of **Impair Process Control** (T1562.001). The primary telemetry source is Windows Security logs, particularly focusing on events related to WFP filter modifications. If malicious, this action significantly reduces the visibility of potential threats within the environment. It is important to note that this detection alone does not confirm malicious activity; legitimate security configurations or troubleshooting could also trigger similar WFP changes.

  ### Investigation Steps

  - **Review WFP-related Event Logs:** Check for Security Event ID **5441** or **5447** in Windows Security logs. Look for filters containing 'Custom Outbound Filter'. An unexpected addition of such filters might indicate malicious intent.

  - **Correlate with EDR Activity:** Analyze the timestamps of the detected events against any recorded EDR agent activity. If EDR agents show signs of being stopped or errors following the filter addition, this is a strong indicator of potential abuse.

  - **Examine the Source of the Command:** Investigate command line activity around the time of the event, specifically looking for the execution of `EDRSilencer`. Validate against Sysmon Event ID **4688** entries for unusual parent-child process relationships indicative of the tool being invoked.

  - **Identify Legitimate Use Cases:** Verify if there are documented cases of legitimate use or troubleshooting that necessitated the filter addition. Understand normal behavior in terms of WFP configuration within your organization to contextualize detections.

  - **Assess for Additional Malicious Artifacts:** Check the system for other indicators of compromise that might align with the use of EDRSilencer, such as the presence of known hacking tools or anomalous network traffic patterns. Utilize network logs to identify blocked outbound connections post-filter creation.

  ### Prioritization

  This alert is high-severity due to its potential to undermine the functioning of EDR systems, which are crucial for detecting and responding to threats in an enterprise environment. The likelihood of malicious abuse is significant, as tools like EDRSilencer are specifically crafted to evade detection and maintain persistence.

  ### Blind Spots and Assumptions

  Detection may be limited if auditing parameters for WFP changes are not correctly configured, leading to false negatives. Legitimate activities, such as system updates or troubleshooting of traffic filtering, might inadvertently trigger this alert. Related detections, such as unauthorized process executions or modifications to other security settings (e.g., firewall rules), can provide additional context to investigate.

