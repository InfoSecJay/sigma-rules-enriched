  ### Technical Context

  This rule detects the execution of EDRSilencer, a tool that manipulates the Windows Filtering Platform (WFP) to create outbound traffic filters aimed at circumventing Endpoint Detection and Response (EDR) solutions. The likely attacker objective is to disable or evade detection by security solutions, allowing for lateral movement, data exfiltration, or further payload deployment without alerting security teams.

  This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562), specifically focusing on the technique of Impair Defenses (T1562.001). The primary telemetry sources for this detection include Windows Security logs where Event IDs 5441 and 5447 indicate changes to filtering policies. If malicious, this activity severely compromises the organization's security posture and visibility. However, this detection does NOT confirm that malicious activity has occurred—only that EDRSilencer was executed.

  ---

  ### Investigation Steps

  - **Check logged filter changes:** Review Windows Security logs for Event ID 5441 and 5447. Look for modifications to filtering policies with FilterName containing 'Custom Outbound Filter.' Malicious indicators include repeated filter modifications in quick succession without a corresponding legitimate process or administrator activity.

  - **Validate expected EDR activity:** Investigate expected filtering configurations by contrasting current settings against a known baseline. Legitimate activity typically shows rarely changing outbound filters reflecting standard security protocols, not frequent custom entries.

  - **Identify suspicious parent processes:** Analyze the parent process of EDRSilencer by checking related executable paths and verifying if they correlate with known malicious binaries or unusual user activity. This can be deduced from related process tree data in Sysmon Event ID 1.

  - **Cross-reference user activity:** Review user access logs (e.g., Event ID 4624) to find unusual access patterns or accounts tied to the initiated EDRSilencer execution. Look for access outside of regular hours or from atypical locations.

  - **Assess system role and criticality:** Determine the role of the affected system (e.g., a domain controller vs. a regular workstation). Higher-impact systems, like those hosting sensitive data or critical services, should be prioritized.

  - **Monitor related artifacts:** If EDRSilencer was executed, look for associated file creations or modifications. Investigate file path changes in C:\Windows\System32\ or temporary directories that may indicate the tool's deployment process.

  ---

  ### Prioritization

  This alert is high severity due to the critical impact on system integrity and the likelihood of malicious exploitation in environments where EDR tools are deployed. The evasion tactic employed by EDRSilencer is widely weaponized, making immediate investigation crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if auditing for Filtering Platform Policy changes is not enabled. Legitimate application behavior might inadvertently trigger the alert, especially during maintenance activities or legitimate EDR updates. Related detections, such as unexpected modifications to Group Policy Objects (GPOs) (T1060), should be monitored to bolster defense measures.

