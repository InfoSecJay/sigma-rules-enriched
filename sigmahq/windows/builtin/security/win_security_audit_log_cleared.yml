  ---

  ### Technical Context

  This rule detects the clearing of Windows event logs, specifically through Event ID 517 and 1102, typically initiated by the execution of commands like "wevtutil cl." Such behavior often indicates an attempt to cover up malicious activities or the removal of traces after unauthorized access. The primary MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **T1070.001** (Indicator Removal on Host). Key telemetry sources include Windows Security Event logs and associated log types from Microsoft-Windows-Eventlog. If the event is malicious, it can impair forensic investigations, allowing an adversary to conceal their actions. This detection does NOT confirm that an adversary has successfully executed an attack, as legitimate system processes could also trigger log clearance.

  ---

  ### Investigation Steps

  - **Check event log clearance timestamps:** Review Event ID 1102 and Event ID 517, focusing on when the logs were cleared. Compare timestamps against other system logs to identify unusual times that could indicate evasion efforts.

  - **Identify the user context:** Determine the user account that performed the log clearing by checking the "SubjectUserName" field in the relevant Windows Security Event logs. Legitimate administrative tasks may occur, but unexpected accounts or non-standard hours should be treated cautiously.

  - **Review system changes and administrator activity:** Investigate log files and Event ID 4688 (Process Creation) for any commands associated with "wevtutil." Legitimate administrative activities may also trigger this, so context is essential.

  - **Evaluate event logs integrity:** Check for logs from the past week using Event ID 4624 (Logon) for sign-ins that correspond to the clearing event. Abnormal or failed login attempts accompanying the log clear event could indicate malicious behavior.

  - **Correlate with other detections:** Examine for high-confidence malicious indicators such as processes spawned from the command prompt leading to the event clearance. Look for concurrent Event IDs indicating suspicious network connections or data exfiltration.

  - **Assess asset criticality:** Verify the security posture of the system involved in the log clearance. Critical assets, such as domain controllers or financial databases, warrant higher scrutiny. Document any deviations from typical behaviors expected for these systems.

  ---

  ### Prioritization

  This alert is considered high severity due to its association with critical operational security events. The potential for malicious abuse is significant, as clearing logs is a common tactic used by adversaries to obstruct forensic investigations. Given its relevance in incident response, monitoring for this behavior is crucial in enterprise environments.

  ---

  ### Blind Spots and Assumptions

  This detection is limited by the potential for legitimate activities, such as log agent installation or system resets, to trigger alerts. Reliable detection relies on comprehensive logging configurations, particularly ensuring that Windows Event logs are captured accurately. Actions like routine maintenance may inadvertently trigger these alerts, necessitating contextual investigation. A related detection of process executions associated with log clearing can bolster the identification of malicious intent.

