  ---

  ### Technical Context

  This Sigma rule detects the clearing of Windows Event logs, specifically via Event IDs 517 and 1102, which typically occurs through the execution of commands like "wevtutil cl." The likely objective for an attacker is to remove audit trails that would expose their actions, effectively covering their tracks after a malicious event has occurred. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion: T1070.001 - Indicator Removal on Host.

  The primary telemetry sources are Windows Security logs, notably Event ID 517, indicating changes made to log security and Event ID 1102, which signals log clearance. If this behavior is confirmed as malicious, it could indicate a significant security incident, such as a breach or an insider threat attempting to erase footprints. Importantly, this detection alone does NOT confirm that a compromise has occurred; it merely highlights a behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review Security Event Logs:**
    Examine Event Logs for Event ID 517 and 1102 (Event log clearance). Indicators to note include timestamps, user accounts, and the context in which logs were cleared.

  - **Identify User Context:**
    Check the user account associated with the Event ID, looking for accounts with elevated privileges or service accounts. Common legitimate users would include system admins, while atypical accounts should raise suspicion.

  - **Correlate with Other Activity:**
    Cross-reference the log-clearing events with any recent critical changes, such as malware execution (e.g., executable files being run that align with known malicious activity). Look for Sysmon Event ID 1 (process creation) for suspicious processes that executed around the same time.

  - **Assess Host Integrity:**
    Validate running services and processes on the affected system (use Task Manager or Sysinternals tools). Confirm legitimate operations typical for that host role, such as automated logging or maintenance scripts.

  - **Investigate Application Logs:**
    Check for application logs that may provide context for the log clearing action (like security management software logs), looking for correlations that indicate legitimate maintenance versus malicious intent.

  ---

  ### Prioritization

  This alert should be treated with high urgency due to the potential for significant security impact if logs are cleared maliciously. The likelihood of abuse is high, as this behavior is a common tactic used during active compromise scenarios to obfuscate an attacker's activities. As such, it is a critical indicator that further investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if log retention policies are too brief; clearing logs can evade detection if the timeframe for log collection does not encompass suspicious activity. Legitimate activities like log agent setups or system provisioning might trigger this alert, leading to false positives. A companion detection, such as monitoring for high rates of failed login attempts (Event ID 4625), could strengthen coverage and context for this alert by highlighting potential intrusion attempts that might precede log clearing.

