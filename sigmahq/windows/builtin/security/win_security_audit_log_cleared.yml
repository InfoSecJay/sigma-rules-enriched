note: |
  ### Technical Context
  This rule detects the clearing of Windows Event Logs, which is a technique often associated with potential malicious activity such as evading detection during an attack. Attackers may execute commands like `wevtutil cl` to remove traces of their actions, making it more difficult for security teams to backtrack and understand what occurred during a compromise. The suspected threat family includes various malicious actors who utilize log-clearing to facilitate their operations, thereby obscuring their activities from forensic analysis.

  The relevant MITRE ATT&CK tactics are **Defense Evasion** (T1070), which encompasses various methods that threat actors employ to hide their tracks. The specific technique for this detection is **Indicator Removal on Host** (T1070.001), highlighting the importance of detecting when logs are manipulated or cleared. Primary data sources for this detection include Windows Security Event logs (specifically looking for Event ID 517 and Event ID 1102).

  ### Investigation Steps
  - **Review Security Event Logs**: Check for Event ID 517 and Event ID 1102 in the Windows Security Event logs to confirm clearings of event logs and gather context on when and why this action occurred.
  - **Analyze User Activity**: Investigate the user account that performed the log-clearing action, correlating it with other related activities (e.g., logins, credential usage) to assess if the account was compromised or being used for malicious purposes.
  - **Monitor Command Execution**: Look for the command execution history in the system to see if `wevtutil cl` or similar commands were run around the same timeframe as the log-clearing events, indicating potential user or scripted activity indicative of a threat.
  - **Check for Other Anomalies**: Determine if there are other indicators of compromise or anomalies around the time the logs were cleared, such as unexpected application behavior, unusual system performance, or unauthorized access attempts.

  ### Prioritization
  This alert is classified as high severity due to the potential impact on incident response and forensic investigations. The likelihood of log clearing being associated with malicious activity raises significant concerns about an ongoing compromise or an attempt to evade detection.

  ### Blind Spots and Assumptions
  The detection coverage may miss events if log clearing occurs through methods not captured by identified Event IDs, or if logs are not retained long enough to analyze historical data effectively. The detection logic assumes that the relevant security Event IDs are properly generated and collected; therefore, environments that do not enforce robust logging policies may not trigger this alert. Additionally, false positives could occur during legitimate maintenance activities, such as the rollout of log collection agents or system provisioning processes. It is essential to ensure that necessary configurations and log settings are correctly implemented for this detection to function effectively.

