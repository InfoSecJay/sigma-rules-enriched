note: |
  ### Technical Context

  This Sigma rule detects the clearing of Windows event logs, specifically through event ID 517 and event ID 1102. The likely attacker objective behind this behavior is to erase any traces of malicious activity and hinder forensic analysis, reflecting an intent to obfuscate actions taken during a compromise. Relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and "Indicator Removal on Host" (T1070). The primary telemetry sources for this detection are Security Event logs on Windows systems, particularly events logged by the Security provider.

  If malicious, the impact can be significant as it could indicate an ongoing attempt to conceal unauthorized access or data exfiltration activities. However, this detection does NOT confirm that a compromise has occurred solely based on the clearing of event logs; further investigation is necessary to validate any malicious intent.

  ### Investigation Steps

  - **Check event log clearing entries:** Review Security Event logs for Event ID 517 and 1102 (event log clearing). Look for timestamps close to unusual or suspicious activity to confirm if log clearing coincides with possible malicious actions.

  - **Identify recent administrative actions:** Investigate administrative logins (Event ID 4624) and operations (Event ID 4672) around the time the logs were cleared. Benign activity may include scheduled maintenance or legitimate security operations.

  - **Review system health:** Collect telemetry from Event Viewer logs (Application and System), looking for any installation or configuration tasks executed shortly before log clearing. Updates or software installations might indicate benign reasons for cleared logs.

  - **Correlate with suspicious network activity:** Analyze network traffic logs (e.g., firewall or proxy logs) during the same timeframe as log clearing events for high-confidence malicious indicators, such as unexpected outbound connections or communication with suspicious IP addresses.

  - **Alert for frequent clearing:** Note excessive frequencies or multiple instances of log clearing within a short timeframe. This could be indicative of repeated attempts to hide malicious actions.

  ### Prioritization

  The alert severity is high due to the potential compromise of critical systems if event logs are cleared by an adversary. The likelihood of malicious abuse is significant, as attackers often clear logs to obfuscate their actions. Furthermore, this behavior is commonly weaponized in post-exploitation phases to impede incident response.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions, as legitimate administrators could clear logs during maintenance without malicious intent. Accurate detection requires proper Windows event logging configurations and may miss if event log storage is misconfigured or if logs are automatically rotated. Additionally, legitimate activities like system upgrades or reset workflows can trigger this alert. Companion detections, such as those for unusual administrative logins, strengthen coverage by contextualizing the log-clearing behavior.

