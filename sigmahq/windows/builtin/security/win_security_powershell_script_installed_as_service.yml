note: |
  ### Technical Context

  This rule detects the installation of PowerShell scripts as Windows services, which is indicative of an attacker attempting to establish persistence within a compromised environment. By installing malicious PowerShell scripts as services, an adversary can ensure the scripts execute automatically upon system startup, achieving long-term access to the system. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique of Windows Service Creation (T1569.002).

  The primary telemetry source for this detection is Windows Security Event ID 4697, related to service creation logs. If this behavior is malicious, it could allow persistent control over a system and potentially facilitate further attacks or data exfiltration. Importantly, this detection does NOT confirm malicious intent by itself; legitimate applications can install PowerShell as a service for valid reasons.

  ### Investigation Steps

  - **Check for unusual service names:** Review Event ID 4697 for PowerShell-related services and assess if the service name appears obfuscated or suspicious (e.g., non-descriptive naming conventions, random characters).

  - **Validate the service executable path:** Inspect the `ServiceFileName` field in Event ID 4697 to see if it points to a known and trusted location. Legitimate PowerShell services should reference typical installation paths, such as `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`.

  - **Review service configuration:** Use PowerShell or the Service Control Manager to query the service configuration for any unusual startup types or dependencies that could indicate tampering (e.g., `Get-Service` command).

  - **Cross-reference with other PowerShell activity:** Examine Sysmon Event ID 1 and Windows Event ID 4688 (process creation) to check for earlier PowerShell executions that initiated the service installation. Look for high suspicion indicators such as encoded commands or execution from temporary files.

  - **Correlate user activity:** Review user activity logs for the account that created the service. Legitimate administrative user behavior might include installation of services related to managed applications, while unexpected or unauthorized user actions should raise further concerns.

  ### Prioritization

  This alert is classified as high-severity due to the impact of potential persistence mechanisms on critical systems, combined with the likelihood of malicious abuse by threat actors leveraging PowerShell for unauthorized access. The use of PowerShell as a service is a common technique in modern attacks, making this detection vital for timely incident response.

  ### Blind Spots and Assumptions

  Detection may be limited if the 'Security' audit policies are misconfigured or not enabled, particularly for Event ID 4697, potentially allowing undetected service installations. Furthermore, legitimate administrative actions, such as installing monitoring tools or other enterprise applications, might trigger this alert. Complementary detections, such as monitoring scheduled tasks or abnormal process communications, can help to enhance coverage and confirm malicious activity.

