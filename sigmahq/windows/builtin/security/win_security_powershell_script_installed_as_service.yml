note: |
  ### Technical Context
  This rule detects instances where PowerShell scripts are installed as Windows services, which may indicate malicious activity. Attackers often leverage PowerShell due to its powerful scripting capabilities, and installing such scripts as services allows for persistence mechanisms, enabling malicious actors to maintain access even after a system reboot. The likelihood is that an attacker aims to execute malicious commands or scripts with system-level privileges over extended periods.

  The relevant MITRE ATT&CK tactics include **Execution** (ID: TA0002) and the technique **Windows Services** (ID: T1569.002). The attackers may use this method to execute malicious scripts stealthily, utilizing the legitimate capabilities of the operating system to masquerade their activities.

  The primary data sources for this detection rule consist of Windows Security event logs, particularly focusing on Event ID 4697, which indicates the creation of a service. Additional logs may include process creation events, which can provide context regarding the execution of PowerShell scripts, as well as system logs for further verification.

  ### Investigation Steps
  - **Review Service Creation Events**: Check Event ID 4697 in Windows Security logs to identify when PowerShell scripts were installed as services. Look for any unusual service names or paths that do not align with standard applications.

  - **Analyze Script Contents**: If a suspicious PowerShell service is identified, retrieve the script associated with the service. Analyze the script for harmful intentions such as data exfiltration or system manipulation commands.

  - **Inspect Process Aactivities**: Monitor process creation events for unexpected PowerShell executions that may occur shortly after the service installation. Events related to command execution may provide insight into how the PowerShell script is being utilized.

  - **Check for Persistence Mechanisms**: Investigate other potential persistence methods that may correlate with the PowerShell service, such as scheduled tasks or additional services that could indicate coordinated efforts by an attacker to maintain access.

  ### Prioritization
  The alert is tagged as high severity due to the significant risk posed by malicious scripts installed as services, potentially granting attackers persistent access to critical systems. The likelihood of such exploitation scenarios increases in environments where PowerShell is commonly used for automation and scripting tasks.

  ### Blind Spots and Assumptions
  Detection may be limited to environments where the proper logging configuration is in place, especially for Windows Security event logs capturing Event ID 4697. An assumption made is that all PowerShell scripts run within the environment are scrutinized similarly; however, legitimate administrative scripts may be erroneously flagged as suspicious. Additionally, the alert does not account for other techniques attackers may employ to establish persistence without using PowerShell, which may lead to blind spots in detection coverage, such as modifications to startup folders or the registry.

