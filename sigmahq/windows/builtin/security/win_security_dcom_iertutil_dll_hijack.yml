  ### Technical Context

  This Sigma rule detects the creation of a file named `iertutil.dll` in the `C:\Program Files\Internet Explorer\` directory, indicating a potential DLL hijacking attack via DCOM (Distributed Component Object Model) against the Internet Explorer application. The likely objective of an attacker is to leverage this hijacked DLL to execute malicious code under the context of a trusted application, enabling lateral movement or persistence within the environment.

  This detection aligns with MITRE ATT&CK tactics of Lateral Movement (TA0008) specifically targeting the Windows Management Instrumentation (WMI) and DCOM (T1021.002, T1021.003) techniques. The primary telemetry source involves Windows Security event logs, specifically looking for Event ID 5145, which indicates a Network Share Object Access event related to file creation. If malicious, the impact can be substantial, as successful DLL hijacking can lead to remote code execution and system compromise.

  It is crucial to note that this detection does NOT confirm malicious activity on its own; legitimate applications or administrative actions could also trigger the event.

  ---

  ### Investigation Steps

  - **Review Event ID 5145 logs:** Check Windows Security logs for Event ID 5145, focusing on entries for the `C:\Program Files\Internet Explorer\` directory. Confirm that the target file is `iertutil.dll` and note the associated user account.

  - **Identify SubjectUserName:** Look for the `SubjectUserName` field in the logs. If the username ends with `$`, it indicates a service account or system process, which is typical in legitimate scenarios but warrants further inquiry for suspicious behavior.

  - **Analyze process creation events:** Correlate with Sysmon Event ID 1 (Process Creation) to identify any parent process that initiated the creation of `iertutil.dll`. Legitimate alterations will often originate from trusted system processes like `explorer.exe`, whereas suspicious activity may stem from unusual processes.

  - **Check for recent changes in directory permissions:** Use filesystem logs to determine if there were recent changes to the permissions of the `C:\Program Files\Internet Explorer\` directory, as this may indicate preparation for malicious file placement.

  - **Look for network activity related to DCOM:** Analyze logs from the Windows Firewall or network appliances for DCOM traffic that might correspond with the file creation event. Suspicious connections, especially to external IPs shortly before the event, raise red flags.

  - **Validate legitimate usage:** Establish a baseline for expected behavior; confirm if there have been recent, known updates to Internet Explorer that would justify the legitimate installation or modification of `iertutil.dll`.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its association with potential lateral movement and remote code execution capabilities. The impacted system, being a key application (Internet Explorer), holds critical enterprise data, increasing the likelihood of malicious exploitation if exploited. While DLL hijacking is known in the threat landscape, the specific parameters of this detection lend particular concern regarding attacker behavior.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as sophisticated attackers may employ techniques to obfuscate the malicious creation of files by using legitimate processes or scheduled tasks. Effective logging configuration is vital; ensure that both Security Event logs and Sysmon are properly configured for comprehensive visibility. Additionally, legitimate administrative actions, such as updates or maintenance scripts affecting `iertutil.dll`, could lead to false positives. Companion detections, such as monitoring for abnormal WMI or DCOM activity (T1047), can help strengthen coverage against this technique.

