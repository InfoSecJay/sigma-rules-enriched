  ### Technical Context

  This Sigma rule detects the creation of the `iertutil.dll` file in the `C:\Program Files\Internet Explorer\` directory via DCOM, indicative of a DLL hijacking technique often leveraged to achieve persistence or execute malicious code. The likely attacker objective is to exploit the Internet Explorer application, using it as a vector for executing unauthorized code on a compromised host.

  The relevant MITRE ATT&CK tactics and techniques are **Lateral Movement** (TA0008) and **Lateral Movement: DCOM** (T1021.002) and **Credential Dumping: Lsass** (T1003.001), respectively. The primary telemetry sources include Windows Security Event Logs, specifically monitoring Event ID 5145 to capture filesystem accesses. If malicious, this behavior poses significant risks, including unauthorized access to systems and potential data exfiltration. Importantly, this detection does NOT confirm that the malware was executed; it merely indicates that an anomalous file creation attempt occurred.

  ### Investigation Steps

  - **Review Event ID 5145 logs:** Investigate Windows Security Event ID 5145 for entries indicating access to the path `C:\Program Files\Internet Explorer\iertutil.dll`. Look for SubjectUserName entries that end with '$', indicating a service account.

  - **Identify the originating IP and user:** Cross-reference the logs with network logs or DCOM RPC activity tracking the source IP address and user account initiating the file creation to determine if it's from an expected administrative source or a suspicious remote request.

  - **Examine file creation timestamp:** Check the file creation timestamp of `iertutil.dll` against normal system activities. Legitimate installations or updates typically co-occur with known patch cycles or admin tasks, whereas anomalies may indicate unauthorized access.

  - **Assess DLL integrity:** Validate the SHA256 hash of the `iertutil.dll` file against known benign and critical threat hash databases. Any irregularities may indicate compromise or malicious intent.

  - **Look for additional file behavior:** Investigate related DLL files or any other binaries created in or around the same time and directory. Malicious indicators might include file names or signatures associated with known malware.

  ### Prioritization

  The alert holds a high severity due to the criticality of the Internet Explorer application in enterprise environments, where it can be exploited for significant lateral movement and command execution. Given the simplicity and frequency of DLL hijacking attacks, there is a high likelihood of malicious abuse, especially against outdated or unpatched systems.

  ### Blind Spots and Assumptions

  Detection may be limited in environments lacking comprehensive logging or where DCOM communication is heavily utilized for legitimate administrative tasks. Additionally, legitimate software updates may inadvertently trigger this alert when deploying or updating DLLs. Companion detections, such as monitoring for unauthorized process creations related to Internet Explorer (like `werfault.exe`), can strengthen overall coverage and response capabilities.

