note: |
  ### Technical Context
  This detection rule identifies the creation of a malicious `iertutil.dll` file within the `C:\Program Files\Internet Explorer\` directory, which could be part of a Distributed Component Object Model (DCOM) attack targeting Internet Explorer. By hijacking the legitimate DLL, an attacker can execute arbitrary code with elevated privileges when Internet Explorer is launched. The objectives behind this attack often include gaining persistence, executing unauthorized actions on the host, or conducting further lateral movement across the network.

  The relevant MITRE ATT&CK tactics for this detection are **Lateral Movement** (TA.0008) and the techniques **DCOM** (T1021.002) and **Remote Services** (T1021.003), which encompass methods attackers utilize to remotely access systems over the network. The primary data sources for this detection are Windows Security logs, specifically focusing on Event ID 5145, which records file and folder access attempts, especially those made by network users.

  ### Investigation Steps
  - **Review Security Logs:** Check Windows Security Event logs for Event ID 5145 around the time of the alert. Focus on entries related to file creations in the specified directory, noting the subject user and their machine name.

  - **Analyze User Account Activity:** Investigate the initiating account by correlating the alert with the account's recent activity. Look for other unusual patterns, such as external logins or access attempts to sensitive directories that could indicate lateral movement.

  - **Examine Process Creation Events:** Validate whether the malicious `iertutil.dll` was executed by monitoring process creation logs. Look specifically for instances of Internet Explorer launching under contexts that appear suspicious or originate from administrative accounts.

  - **Identify Network Traffic Patterns:** If available, analyze network logs to check for DCOM-related traffic that correlates with the time of the alert. Look for unusual external connections or communication attempts from devices that don't typically interact with the Internet Explorer process.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of successful DLL hijacking, which can lead to unauthorized remote control of systems, data exfiltration, or further compromises within the enterprise network. The likelihood of exploitation, combined with the critical nature of the targeted application, necessitates immediate investigation.

  ### Blind Spots and Assumptions
  Gaps in detection may arise if logging is not correctly configured on all endpoints, particularly regarding security event logging. Additionally, the detection logic assumes standard user naming conventions (e.g., accounts ending with '$' are service accounts) and might overlook advanced techniques where attackers hide their activities. Adequate logging for file creation and remote access events, particularly in sensitive system directories, is crucial for maintaining effective coverage.

