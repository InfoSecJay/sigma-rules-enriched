title: Suspicious LDAP-Attributes Used
id: d00a9a72-2c09-4459-ad03-5e0a23351e36
status: test
description: Detects the usage of particular AttributeLDAPDisplayNames, which are
  known for data exchange via LDAP by the tool LDAPFragger and are additionally not
  commonly used in companies.
references:
- https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
- https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
- https://github.com/fox-it/LDAPFragger
author: xknow @xknow_infosec
date: 2019-03-24
modified: 2022-10-05
tags:
- attack.t1001.003
- attack.command-and-control
logsource:
  product: windows
  service: security
  definition: The "Audit Directory Service Changes" logging policy must be configured
    in order to receive events. Audit events are generated only for objects with configured
    system access control lists (SACLs). Audit events are generated only for objects
    with configured system access control lists (SACLs) and only when accessed in
    a manner that matches their SACL settings. This policy covers the following events
    ids - 5136, 5137, 5138, 5139, 5141. Note that the default policy does not cover
    User objects. For that a custom AuditRule need to be setup (See https://github.com/OTRF/Set-AuditRule)
detection:
  selection:
    EventID: 5136
    AttributeValue|contains: '*'
    AttributeLDAPDisplayName:
    - 'primaryInternationalISDNNumber'
    - 'otherFacsimileTelephoneNumber'
    - 'primaryTelexNumber'
  condition: selection
falsepositives:
- Companies, who may use these default LDAP-Attributes for personal information
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious usage of specific LDAP attributes that are typically uncommon in enterprise environments, notably those associated with the LDAPFragger tool. LDAPFragger is a reconnaissance tool often used by attackers to facilitate command and control (C2) using LDAP signaling, making it a relevant threat to organizations with Active Directory (AD) infrastructures. By monitoring unauthorized access or unusual queries against these uncommon attributes, security teams can detect potential data exfiltration or lateral movement before attackers can achieve their objectives.

  The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) and more specifically, the technique for **Application Layer Protocol** (T1001.003) that highlights the use of LDAP for non-standard operations. This detection requires a thorough analysis of LDAP query logs and directory service changes. Primary data sources include the "Audit Directory Service Changes" logs, particularly events such as Event ID 5136, which captures modifications to directory attributes.

  ### Investigation Steps
  - **Review Audit Logs:** Examine LDAP audit logs for Event ID 5136, focusing on entries related to the specified AttributeLDAPDisplayNames. Note any unusual access patterns that deviate from baseline behavior.
  - **Identify Attribute Usage:** Investigate the context in which the detected LDAP attributes were used; cross-reference against known applications and services that may legitimately access these attributes.
  - **Check for Suspicious Connections:** Look for any associated connections to external IPs or unusual internal activities that coincide with the LDAP queries, particularly those that suggest data exfiltration.
  - **Collate User Activity:** Gather account activity logs for users involved in the event, identifying any signs of privilege escalation or lateral movement that may accompany the unauthorized LDAP access.

  ### Prioritization
  Given the potential impact of unauthorized LDAP attribute access—such as data exfiltration and unauthorized commands—this alert is classified as high severity. The likelihood of exploitation with tools like LDAPFragger suggests an immediate response may be necessary to prevent further compromise.

  ### Blind Spots and Assumptions
  This detection logic may overlook legitimate uses of the monitored LDAP attributes, particularly if they are commonplace within the specific organization. Additionally, it assumes proper configuration of audit policies to capture relevant events; if these policies are not in place or improperly scoped, detections will be ineffective. Organizations must ensure that their "Audit Directory Service Changes" policies are appropriately configured, including the necessary custom AuditRule for User objects, to facilitate effective monitoring.

