title: Suspicious LDAP-Attributes Used
id: d00a9a72-2c09-4459-ad03-5e0a23351e36
status: test
description: Detects the usage of particular AttributeLDAPDisplayNames, which 
  are known for data exchange via LDAP by the tool LDAPFragger and are 
  additionally not commonly used in companies.
references:
- https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
- https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
- https://github.com/fox-it/LDAPFragger
author: xknow @xknow_infosec
date: 2019-03-24
modified: 2022-10-05
tags:
- attack.t1001.003
- attack.command-and-control
logsource:
  product: windows
  service: security
  definition: The "Audit Directory Service Changes" logging policy must be 
    configured in order to receive events. Audit events are generated only for 
    objects with configured system access control lists (SACLs). Audit events 
    are generated only for objects with configured system access control lists 
    (SACLs) and only when accessed in a manner that matches their SACL settings.
    This policy covers the following events ids - 5136, 5137, 5138, 5139, 5141. 
    Note that the default policy does not cover User objects. For that a custom 
    AuditRule need to be setup (See https://github.com/OTRF/Set-AuditRule)
detection:
  selection:
    EventID: 5136
    AttributeValue|contains: '*'
    AttributeLDAPDisplayName:
    - 'primaryInternationalISDNNumber'
    - 'otherFacsimileTelephoneNumber'
    - 'primaryTelexNumber'
  condition: selection
falsepositives:
- Companies, who may use these default LDAP-Attributes for personal information
level: high
note: |
  ### Technical Context

  This rule detects suspicious activity involving specific LDAP attributes that are not commonly used within enterprises, such as `primaryInternationalISDNNumber`, `otherFacsimileTelephoneNumber`, and `primaryTelexNumber`. These attributes are often observed during data exfiltration attempts using LDAP, particularly associated with the tool LDAPFragger. The likely objective of an attacker using this method is to facilitate command-and-control communication through legitimate LDAP queries.

  This detection aligns with the MITRE ATT&CK tactic of Command and Control (ID: TA0011) and the specific technique T1001.003 - Data Exfiltration over Command and Control Channel. Primary telemetry sources include Windows Security Event logs, specifically Event ID 5136, which captures changes to directory service objects. If this activity is malicious, it can result in significant data loss or unauthorized access to user information. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate uses of these attributes may exist in certain organizational contexts.

  ### Investigation Steps

  - **Review Event 5136 details**: Examine the associated Event ID 5136 logs to identify the `AttributeLDAPDisplayName` and `AttributeValue` fields for matching attribute usage. Pay specific attention to log entries involving `'primaryInternationalISDNNumber'`, `'otherFacsimileTelephoneNumber'`, or `'primaryTelexNumber'`.

  - **Identify the source of LDAP requests**: Correlate the Event ID 5136 against other logs to establish the originating user account and system. This includes checking for elevated permissions or abnormal access patterns that may indicate misuse.

  - **Assess normal usage in the environment**: Determine if these attributes are legitimately used in your organization. Consult with application owners or business units to confirm expected attribute usage against the alert.

  - **Flag high-confidence malicious indicators**: Look for combinations of events where these attributes are accessed by non-administrative accounts or from locations atypical to the organization, which may suggest exfiltration attempts.

  - **Check for custom SACL configurations**: Investigate if custom audit settings are in place that might prevent legitimate AD changes from logging, as these may mask malicious activity relying on these attributes.

  - **Collect evidence of data exfiltration**: If applicable, validate network traffic logs around the time of the alert to identify any unusual patterns or behaviors, such as LDAP traffic with large data transfers or unexpected external destinations.

  ### Prioritization

  This alert is of high severity due to the potential risk of data exfiltration through unauthorized LDAP access. The likelihood of malicious exploitation is significant, especially when leveraging non-standard LDAP attributes known to be used by tools like LDAPFragger. Such behavior is not commonplace and often indicates a tactical shift toward less-obvious methods of attack.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary audit log settings are not appropriately configured or if attackers employ tactics to mask their activities by using commonly utilized LDAP attributes. Legitimate applications or internal tools may also trigger this alert if they use these attributes for authorized purposes. A related detection to reinforce this coverage would involve monitoring for unusual LDAP query patterns or abnormal account activity within LDAP directory services.

