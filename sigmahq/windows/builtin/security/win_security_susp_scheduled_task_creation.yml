title: Suspicious Scheduled Task Creation
id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
status: test
description: Detects suspicious scheduled task creation events. Based on 
  attributes such as paths, commands line flags, etc.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2022-12-07
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: 'The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.'
detection:
  selection_eid:
    EventID: 4698
  selection_paths:
    TaskContent|contains:
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - 'C:\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Temporary Internet'
    - 'C:\ProgramData\'
    - 'C:\Perflogs\'
  selection_commands:
    TaskContent|contains:
    - 'regsvr32'
    - 'rundll32'
    - 'cmd.exe</Command>'
    - 'cmd</Command>'
    - '<Arguments>/c '
    - '<Arguments>/k '
    - '<Arguments>/r '
    - 'powershell'
    - 'pwsh'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'certutil'
    - 'bitsadmin'
    - 'bash.exe'
    - 'bash '
    - 'scrcons'
    - 'wmic '
    - 'wmic.exe'
    - 'forfiles'
    - 'scriptrunner'
    - 'hh.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious scheduled tasks based on their attributes, such as execution paths and command-line flags. Attackers often create such tasks to maintain persistence on compromised systems or execute malicious scripts unnoticed. This activity aligns with the MITRE ATT&CK framework, specifically under the tactic "Execution" (TA0002) and technique "Scheduled Task/Job" (T1053.005).

  Primary telemetry sources include Windows Security Event ID 4698, which logs the creation of scheduled tasks. If malicious, this behavior can facilitate persistent access for adversaries, allowing them to execute harmful commands or scripts at specified intervals or startup events. However, this detection does NOT confirm that the task is indeed malicious; it only highlights suspicious characteristics warranting further investigation.

  ### Investigation Steps

  - **Review Event ID 4698 details**: Look for Event ID 4698 in Windows Security logs. Pay attention to the `TaskContent` field for suspicious paths (e.g., `\AppData\Local\Temp\`, `\Users\Public\`) or commands (such as `powershell` or `cmd.exe`).

  - **Identify high-confidence malicious indicators**: Specifically check for task creation with command-line arguments that include potentially harmful commands like `regsvr32` or `mshta`, which are often associated with malware executions.

  - **Determine typical benign behavior**: Scheduled tasks for software updates or system maintenance that run legitimate programs (like Windows Update) can be expected. Verify the path and application name used in such benign tasks against known legitimate processes.

  - **Validate task execution history**: Use Task Scheduler (Taskschd.msc) to see if the newly created task triggers were executed or if there are immediate future triggers, indicating the potential for imminent malicious activity.

  - **Search for alterations or new files**: Examine the file system for any changes or new files in the directories indicated by the task creation. For instance, check `C:\ProgramData\` or `C:\Temp\` for newly created scripts or executables typical to malware (e.g., files with `.bat`, `.exe`, or `.ps1` extensions).

  - **Assess asset criticality**: Review the host's role and criticality; for instance, if the event originates from a domain controller or critical server, prioritize investigation, as compromised tasks here can significantly impact the entire organization.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of compromised systems executing malicious tasks and the likelihood of such techniques being used in further attacks. Given that scheduled tasks are often leveraged for persistence in environments, there is a credible threat that this behavior is weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by not capturing all scheduled task creations if the Advanced Audit Policy is not properly configured to log Object Access events. Legitimate scheduled tasks, such as those created by system maintenance software or legitimate applications, may also trigger this alert. Companion detections such as monitoring for Event ID 4688 (Process Creation) can strengthen overall coverage and provide context for associated command executions related to suspicious tasks.

