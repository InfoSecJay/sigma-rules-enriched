title: Suspicious Scheduled Task Creation
id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
status: test
description: Detects suspicious scheduled task creation events. Based on attributes
  such as paths, commands line flags, etc.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-05
modified: 2022-12-07
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: 'The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.'
detection:
  selection_eid:
    EventID: 4698
  selection_paths:
    TaskContent|contains:
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - 'C:\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Temporary Internet'
    - 'C:\ProgramData\'
    - 'C:\Perflogs\'
  selection_commands:
    TaskContent|contains:
    - 'regsvr32'
    - 'rundll32'
    - 'cmd.exe</Command>'
    - 'cmd</Command>'
    - '<Arguments>/c '
    - '<Arguments>/k '
    - '<Arguments>/r '
    - 'powershell'
    - 'pwsh'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'certutil'
    - 'bitsadmin'
    - 'bash.exe'
    - 'bash '
    - 'scrcons'
    - 'wmic '
    - 'wmic.exe'
    - 'forfiles'
    - 'scriptrunner'
    - 'hh.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious scheduled task creation events in Windows systems, specifically focusing on tasks created in unusual directories or with suspicious command-line arguments. Attackers often leverage scheduled tasks to maintain persistence or execute arbitrary commands on a compromised system, making this activity crucial for detection. The primary objective of such actions is typically to maintain access to a system over time or deploy additional payloads without raising immediate alarm.

  The relevant MITRE ATT&CK techniques include:
  - **T1053.005**: Scheduled Task/Job: Windows Task Scheduler
  - **T1203**: Exploitation for Client Execution
  - **T1543**: Create or Modify System Process

  To effectively implement this detection, the primary data sources include Windows Security Event Logs, specifically Event ID 4698, which logs the creation of a scheduled task, alongside the command line and location attributes that may indicate potential abuse.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Security Event Log entries for Event ID 4698 to identify newly created scheduled tasks, focusing on the 'TaskContent' and 'Command' fields for suspicious arguments or locations.
  - **Check Task Locations**: Look for scheduled tasks created in atypical directories such as `C:\AppData\Local\Temp\`, `C:\ProgramData\`, or any non-standard directories indicating possible evasion tactics.
  - **Evaluate Command Line Usage**: Investigate any utilized command-line arguments within tasks for indicators of malicious behavior, such as the presence of `powershell`, `cmd.exe`, or other known tools often exploited by attackers.
  - **Cross-Reference with Other Artifacts**: Correlate the findings with other logs or telemetry, such as process creation events or network activity logs, to identify any associated malicious behavior or persistent threats.

  ### Prioritization
  The alert's severity is rated high due to the potential impact of a successful attack leveraging scheduled tasks for persistence, combined with the likelihood of this technique being used in various threat scenarios, including advanced persistent threats (APTs) and opportunistic attacks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Windows audit policies are not properly configured, particularly the Advanced Audit Policy setting for Object Access. This rule assumes that Event ID 4698 logging is enabled; without it, the detection will fail. Additionally, false positives could arise from legitimate administrative activities, necessitating a thorough contextual investigation for each alert.

