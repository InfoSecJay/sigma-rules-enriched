  ---

  ### Technical Context

  This rule detects modifications to Group Policy Object (GPO) attributes, specifically to add permissions or user accounts as local administrators. The likely objective of an attacker is to escalate privileges within a Windows domain environment, allowing them to gain unauthorized access to systems and sensitive data. This behavior aligns with MITRE ATT&CK technique: **Privilege Escalation, T1484.001**.

  The primary telemetry source for this detection is Windows Security logs, specifically looking for **Event ID 5136**. If an attacker successfully modifies group policies, they may establish persistent access and control over targeted systems, leading to significant security impacts. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions by authorized users can also trigger this rule.

  ---

  ### Investigation Steps

  - **Review Group Policy modification details:** Analyze Event ID 5136 logs in Windows Security. Pay attention to the **SubjectUserName**, **ObjectDN**, and **AttributeLDAPDisplayName** fields. Determine if the modifier was an authorized administrator or if the action was out of character for the user.

  - **Identify affected user accounts:** Check which accounts were modified in the logs and whether they have administrative access. Look for fields such as **NewValue** and **OldValue** for privilege escalation patterns.

  - **Correlate with user roles:** Verify the role of the user making the changes against expected behavior. Authorized personnel typically manage GPOs during maintenance windows, while unexpected changes outside these hours may indicate malicious activity.

  - **Assess audit policy configuration:** Confirm that the "Audit Directory Service Changes" policy is correctly configured to ensure comprehensive logging of GPO modifications. This can help identify other potential blind spots.

  - **Look for concurrent events:** Investigate other logs from the time of the modification (e.g., Event ID 4672 for special privileges assigned) to identify patterns indicating malicious behavior, such as failed login attempts followed by successful GPO modifications.

  - **Perform a threat assessment of the system:** Evaluate the criticality of the affected system and the potential impact if the changes were malicious. High-value targets should prompt additional investigation and possibly responding measures.

  ---

  ### Prioritization

  This alert is of **medium severity** due to its potential ability to facilitate privilege escalation. While not every detected modification indicates malicious activity, the behavior is known to be weaponized in various attack scenarios, thereby warranting timely investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on specific configurations for audit logging; if "Audit Directory Service Changes" is not enabled, modifications may go unnoticed. Legitimate administrative modifications by IT personnel could trigger alerts, emphasizing the need for context. A related detection that strengthens coverage is monitoring for **Event ID 4670** to capture permission changes on GPOs, providing a broader view of potentially malicious actions.

