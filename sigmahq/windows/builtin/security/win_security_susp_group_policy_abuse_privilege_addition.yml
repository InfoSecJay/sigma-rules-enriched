note: |
  ### Technical Context

  This Sigma rule detects modifications to Group Policy Object (GPO) attributes focused on adding privileges to user accounts or elevating them to local administrators. The likely attacker objective is to gain elevated privileges across the network, facilitating further malicious activities such as lateral movement or data exfiltration. This activity relates to the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and specifically technique T1484.001: Domain Accounts - Role Modification.

  The primary telemetry source for this detection is the Windows Security logs, specifically Event ID 5136, which logs modifications to Active Directory (AD) objects. If malicious, this behavior can lead to unauthorized access and control over critical systems. However, it is important to note that this detection does NOT confirm whether the activity was authorized or executed by a legitimate administrator.

  ### Investigation Steps

  - **Verify the source of the change:** Check Event ID 5136 in the Security log (fields: SubjectUserName, ObjectDN, and NewValue). Identify whether the user modifying the GPO is a known administrator or part of an authorized group.

  - **Review prior GPO modifications:** Look for related modifications to GPO attributes around the same timestamp (Event ID 5136). Ensure that there is no indication of multiple rapid changes often associated with malicious intent.

  - **Assess legitimate usage:** Confirm if the modification was expected by cross-referencing with change management records. Legitimate users typically provide evidence of planned changes, which might include approval tickets.

  - **Correlate with user account changes:** Cross-examine changes to accounts linked to the modified GPO. Investigate accounts that have been added as local admins, noting fields such as ModifiedAttribute and ModifiedValue in the logs.

  - **Identify high-confidence malicious indicators:** Look for GPO attribute values containing '827D319E-6EAC-11D2-A4EA-00C04F79F83A' or '803E14A0-B4FB-11D0-A0D0-00A0C90F574B'. Such values are explicitly associated with privilege escalation.

  - **Determine asset role and criticality:** Categorize affected systems based on their role within the network (e.g., servers vs. workstations). High-value assets such as domain controllers or databases are of greater concern if modified.

  ### Prioritization

  This alert should be considered medium severity in an enterprise context due to the potential impact on system integrity. The likelihood of malicious abuse is moderate, as only privileged users can make these changes, but the behavior is weaponized by adversaries to escalate privileges, thus increasing the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative changes may trigger the alert frequently, potentially overwhelming analysts. The "Audit Directory Service Changes" logging policy must be enforced to ensure reliable detection criteria. Common legitimate activities, such as regular administrative tasks or updates performed by IT, may produce similar alerts. A companion detection to consider is monitoring for Event ID 4728 (member added to a security-enabled global group), which helps provide context to group membership changes following GPO modifications.

