  ---

  ### Technical Context

  This rule detects modifications to Group Policy Object attributes aimed at adding privileges to user accounts or adding users as local administrators. The likely attacker objective is to escalate privileges within a Windows environment, thereby gaining elevated access to sensitive resources or providing persistent access for future exploitation. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the technique of Group Policy Abuse (T1484.001).

  The primary telemetry source is Windows Security logs, specifically Audit Directory Service Changes, capturing Event ID 5136. If such modifications are performed maliciously, they could significantly impact system security and integrity. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can trigger this alert if users with appropriate permissions are involved.

  ---

  ### Investigation Steps

  - **Review Event ID 5136 logs:** Examine the Windows Security log (Event ID 5136) for modifications to the Group Policy attributes, focusing on the `gPCMachineExtensionNames` attribute. Look for changes initiated by unexpected `SubjectUserName`.

  - **Identify the modifying user:** Confirm the identity of the user or service account making the change. Ensure it is not an account listed in your organization's administrative roles. Suspicious modifications may come from non-administrative users.

  - **Cross-reference with other logs:** Check Directory Service logs and Event ID 4662 (Audit Directory Service Changes) for trends or patterns related to group policy modification activity to validate the legitimacy of the action.

  - **Look for correlated admin activities:** Review recent changes to user group memberships. A legitimate activity might involve a known administrator adding a user as a local admin. Contrast the timing and context with the detected modification.

  - **Assess potential unauthorized changes:** If unexpected users are added as local admins or if changes point to an unusual privilege elevation pattern, validate against known baselines for admin memberships and group policies.

  - **Validate policy modification history:** Utilize tools like PowerShell to retrieve the version history of the group policy objects to confirm whether the modifications align with standard operating procedures or documented changes.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact of exposing sensitive data through unauthorized privilege escalation on critical systems. The likelihood of malicious abuse is moderate; while group policy modifications can be legitimate, they may also signify a precursor to broader attacks. Attackers frequently leverage this technique to gain a foothold in the environment.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete audit logging configurations; ensure "Audit Directory Service Changes" is enabled for accurate monitoring. Legitimate administrative activities, such as scheduled privilege adjustments during software deployment, may also trigger this alert. A related detection, such as monitoring for suspicious user account creations (T1136), can provide complementary visibility into potential abuse scenarios.

