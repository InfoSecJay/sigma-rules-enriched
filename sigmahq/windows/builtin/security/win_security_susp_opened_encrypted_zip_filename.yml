title: Password Protected ZIP File Opened (Suspicious Filenames)
id: 54f0434b-726f-48a1-b2aa-067df14516e4
status: test
description: Detects the extraction of password protected ZIP archives with 
  suspicious file names. See the filename variable for more details on which 
  file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.command-and-control
- attack.stealth
- attack.t1027
- attack.t1105
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  selection_filename:
    TargetName|contains:
    - 'invoice'
    - 'new order'
    - 'rechnung'
    - 'factura'
    - 'delivery'
    - 'purchase'
    - 'order'
    - 'payment'
  condition: selection and selection_filename
falsepositives:
- Legitimate used of encrypted ZIP files
level: high
note: |
  ### Technical Context

  This rule detects the extraction of password-protected ZIP archives with filenames commonly associated with financial transactions or deliveries, which could indicate potential data exfiltration or command-and-control (C2) activity. The likely attacker objective may involve retrieving sensitive information, such as credentials or financial data, by leveraging seemingly benign file names to bypass initial scrutiny. This activity aligns with the MITRE ATT&CK framework under the tactics of Command and Control (TA0011) and Data Exfiltration (TA0010), specifically utilizing techniques T1027 (Obfuscated Files or Information) and T1105 (Ingress Tool Transfer).

  The primary telemetry source is Windows Security Event logs, specifically Event ID 5379, indicating the extraction of files from ZIP archives. If the extraction activity is confirmed malicious, it could lead to data theft or unauthorized command execution. Importantly, this detection does NOT confirm malicious intent on its own; the filename alone is not a conclusive indicator of compromise.

  ### Investigation Steps

  - **Review extraction details**: Check Windows Security Event ID 5379 for specific TargetName attributes. Confirm if file names contain terms like "invoice," "new order," or "payment."

  - **Validate filename context**: Investigate the context of previously identified file paths or user activities related to the extraction. Legitimate usage often involves recognized business processes around financial documentation.

  - **Identify high-confidence indicators**: Look for any related suspicious activities around the same timestamp, such as other Event IDs (e.g., 4624 for logon) that correlate with the user who initiated the action, indicating potential unauthorized access.

  - **Correlate with C2 patterns**: Check if there are associated outbound connections (i.e., investigate Firewall logs) from the system to external IPs or domains during the extraction period, which could indicate data exfiltration efforts.

  - **Assess the asset's role**: Determine the role of the host involved in the extraction. If it's a sensitive system (e.g., handling financial data), prioritize the investigation due to higher risks.

  - **Strictly monitor password-related artifacts**: If related logs show repeated ZIP extraction events, validate for any file creation or transfer (e.g., via file monitoring tools) to ensure no unauthorized data is being extracted.

  ### Prioritization

  Given that this activity is occurring on potentially sensitive financial documents, the alert is of high severity. The likelihood of malicious abuse is elevated due to the use of obfuscated filenames that overlap with common business transactions, which can often be weaponized for social engineering or exfiltration techniques.

  ### Blind Spots and Assumptions

  This detection may be limited by the ability of adversaries to employ alternate filenames or formats that do not trigger the alert. Reliable detection relies on accurate configuration for Windows Security Event logging; if logging is disabled, relevant activity may go undetected. Legitimate business operations, such as IT or finance departments handling ZIP files for data sharing, may also trigger this alert. A related detection that strengthens coverage would be monitoring for outbound network traffic anomalies concerning sensitive data after ZIP file extraction events.

