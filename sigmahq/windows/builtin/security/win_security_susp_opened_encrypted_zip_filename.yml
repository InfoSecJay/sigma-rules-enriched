title: Password Protected ZIP File Opened (Suspicious Filenames)
id: 54f0434b-726f-48a1-b2aa-067df14516e4
status: test
description: Detects the extraction of password protected ZIP archives with suspicious
  file names. See the filename variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.command-and-control
- attack.defense-evasion
- attack.t1027
- attack.t1105
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  selection_filename:
    TargetName|contains:
    - 'invoice'
    - 'new order'
    - 'rechnung'
    - 'factura'
    - 'delivery'
    - 'purchase'
    - 'order'
    - 'payment'
  condition: selection and selection_filename
falsepositives:
- Legitimate used of encrypted ZIP files
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where a password-protected ZIP file with suspicious filenames has been opened on a Windows system. The targeted filenames suggest a potential fraudulent or malicious activity, such as the delivery of sensitive information, or an attempt to obfuscate the nature of the content. Attackers may use such ZIP files to circumvent security configurations by disguising malware, exfiltrated data, or other illicit material within an encrypted archive, making detection by traditional means more challenging.

  The relevant MITRE ATT&CK tactics and techniques stemming from this detection include **Command and Control (T1071)**, which relates to how attackers communicate with compromised systems and manage their operations, and **Defense Evasion (T1036)**, as the use of password-protected archives is a method to evade security controls designed to inspect file contents for malicious activity. Additionally, **T1027 (Obfuscated Files or Information)** and **T1105 (Ingress Tool Transfer)** are pertinent, as they describe methods of hiding or transferring potentially harmful files.

  The primary data sources for this detection are Windows security event logs, specifically focusing on Event ID 5379, which records when a password-protected ZIP file is accessed. Analysts should leverage file activity logs in conjunction with contextual data about the filenames to discern potential malicious actions.

  ### Investigation Steps
  - **Review Security Event Logs:** Collect and analyze Windows security event logs, specifically Event ID 5379, to pinpoint the exact time and context in which the password-protected ZIP file was accessed.
  - **Examine Filenames for Patterns:** Investigate the filenames of opened ZIP files for known suspicious indicators (e.g., "invoice," "new order") to determine if they correlate with typical malicious behavior or phishing attempts.
  - **Analyze User and Process Context:** Look into the user account and process under which the ZIP file was opened to identify any unusual activity or privilege escalation that may indicate compromise.
  - **Correlate with Threat Intelligence:** Cross-reference detections with threat intelligence sources or previous incidents to see if similar filename patterns or methods have been reported in conjunction with known threat actors.

  ### Prioritization
  This alert is rated high due to the potential risks associated with the opening of ZIP files containing misleading filenames that could be used to deliver malware or sensitive data. The likelihood of such incidents occurring in enterprise environments, particularly in contexts involving financial or sensitive information, warrants immediate attention.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on specific filename patterns that might not cover all malicious instances, especially if attackers use alternative naming conventions that appear legitimate. The detection logic assumes that the presence of certain filenames always indicates malicious intent; however, legitimate business activities could also trigger the alert. Furthermore, for this alert to function effectively, logging for Windows security events must be properly configured and enabled, capturing the necessary file access events securely.

