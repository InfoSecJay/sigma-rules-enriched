title: Password Protected ZIP File Opened (Suspicious Filenames)
id: 54f0434b-726f-48a1-b2aa-067df14516e4
status: test
description: Detects the extraction of password protected ZIP archives with 
  suspicious file names. See the filename variable for more details on which 
  file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.command-and-control
- attack.defense-evasion
- attack.t1027
- attack.t1105
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains: 'Microsoft_Windows_Shell_ZipFolder:filename'
  selection_filename:
    TargetName|contains:
    - 'invoice'
    - 'new order'
    - 'rechnung'
    - 'factura'
    - 'delivery'
    - 'purchase'
    - 'order'
    - 'payment'
  condition: selection and selection_filename
falsepositives:
- Legitimate used of encrypted ZIP files
level: high
note: |
  ### Technical Context

  This Sigma rule detects the opening of password-protected ZIP files containing suspicious filenames associated with financial transactions or personal data, such as invoices and orders. The likely attacker objective is to exfiltrate credentials, sensitive information, or bypass cybersecurity defenses by disguising malicious payloads in encrypted archives. This behavior aligns with the MITRE ATT&CK techniques for Command and Control (T1027 - Obfuscated Files or Information) and Defense Evasion (T1105 - Ingress Tool Transfer).

  The primary telemetry source involves Windows Security logs, specifically focusing on Event ID 5379. If malicious, the security impact could include data loss or breach of sensitive information. However, this detection alone does not confirm malicious intent, as legitimate users may also access password-protected ZIP files during business operations.

  ### Investigation Steps

  - **Check Event ID 5379:** Review Windows Security Event ID 5379 logs to identify the opening of password-protected ZIP archives. Cross-reference with the `TargetName` field for filenames containing terms like 'invoice' or 'payment'.

  - **Assess the filename context:** Analyze the content of the opened files referenced in the alert for any authentication or personal data. Check for unexpected file contents relative to standard operating procedures.

  - **Identify user and system roles:** Determine if the user accessing the archive typically handles financial documents. Investigate any deviation from their normal behavior to assess risk.

  - **Review anomalous access patterns:** Examine for any additional related events in the same time frame that may indicate a pattern of suspicious activity, such as repeated access to sensitive files or unexplained credential use.

  - **Evaluate benign usage:** Confirm whether legitimate employees use password-protected ZIP files in a standard context, such as for secure document sharing during transactions, by reviewing access logs and historical usage patterns.

  - **Correlate with other detection rules:** Look for companion detections that may indicate a broader attack (e.g., file downloads via malware or unusual remote access attempts) to strengthen incident validation and context.

  ### Prioritization

  This alert should be considered high severity due to the potential sensitivity of the exposed data and the common exploitation of unmonitored file transfers in enterprise environments. The likelihood of abuse is significant since attackers often utilize ZIP files to conceal malicious payloads.

  ### Blind Spots and Assumptions

  Detection may be evaded if an attacker alters the filename to escape suspicion or if standard encryption methods obscure the contents of ZIP files. The rule requires enabled Windows Security logging for Event ID 5379 to function effectively. Legitimate actions, such as IT personnel conducting file audits, may also trigger this alert. A related detection for generic file extraction activities could enhance defensive positioning against such threats.

