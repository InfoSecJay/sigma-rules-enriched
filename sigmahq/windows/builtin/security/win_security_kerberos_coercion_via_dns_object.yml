logsource:
  product: windows
  service: security
  definition: |
    By default these events are not logged by default for MicrosoftDNS objects in Active Directory.
    To enable detection, configure an AuditRule on the DNS object container with the "CreateChild" permission for the "Everyone" principal.
    This can be accomplished using tools such as Set-AuditRule (see https://github.com/OTRF/Set-AuditRule).
detection:
  selection_directory_service_changes:
    EventID:
    - 5136
    - 5137
    ObjectClass: 'dnsNode'
    ObjectDN|contains|all:     # ObjectDN">DC=foo-11UWhRCAAAAAAAAAAAAAAAAAAAAAAAAAAAAwbEAYBAAAA,DC=domain.com,CN=MicrosoftDNS,DC=DomainDnsZones,DC=domain,DC=com</Data>
    - 'UWhRCA'
    - 'BAAAA'
    - 'CN=MicrosoftDNS'
  selection_directory_service_access:
    EventID: 4662
    AdditionalInfo|contains|all:     # AdditionalInfo">DC=foo-11UWhRCAAAAAAAAAAAAAAAAAAAAAAAAAAAAwbEAYBAAAA,DC=domain.com,CN=MicrosoftDNS,DC=DomainDnsZones,DC=domain,DC=com</Data>
    - 'UWhRCA'
    - 'BAAAA'
    - 'CN=MicrosoftDNS'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to DNS records in Active Directory, specifically the creation or alteration of `dnsNode` objects containing a base64-encoded blob associated with Kerberos coercion attacks. The likely attacker objective is to manipulate DNS records to spoof Service Principal Names (SPNs), thereby coercing victim systems to authenticate against attacker-controlled hosts. This behavior aligns with the MITRE ATT&CK framework under the credential access tactic (T1557.003) and can also connect to persistence and privilege escalation techniques.

  The primary telemetry sources are Windows Security Event logs, particularly Event IDs 5136 and 5137 for directory service changes and Event ID 4662 for service access events. If malicious, such actions could enable an attacker to gain unauthorized access to resources, potentially leading to further network compromise. It's important to note that this detection does NOT independently confirm that a successful Kerberos coercion has occurred; it indicates the likelihood of an attempt and requires further investigative validation.

  ### Investigation Steps

  - **Identify the user account responsible for the change:** Review Event ID 5136 and Event ID 4662 logs. Focus on the `SubjectUserName` field to determine if a low-privileged account made the changes, which may indicate compromise.

  - **Check for the presence of encoded strings:** Look for base64-encoded blobs in fields like `ObjectDN` and `AdditionalInfo` of Event IDs 5136 and 4662. A match for "UWhRCA" or "BAAAA" is a strong indicator of potential malicious intent.

  - **Validate DNS change purpose:** Query recent DNS modifications for the affected domain names using tools like dnscmd or PowerShell. Confirm whether legitimate service changes were documented or communicated.

  - **Review for suspicious DN patterns:** Utilize logs or Active Directory scripts to audit `dnsNode` changes over the last 30 days for suspicious patterns. Legitimate changes often involve routine service adjustments or expansions.

  - **Correlate with other security events:** Investigate for related alerts, such as suspicious authentication attempts targeting SPNs within Event ID 4624. Any failed authentication events from unusual IPs or accounts could indicate a correlated bit of malicious activity.

  - **Assess network connectivity for external DNS lookups:** Examine network firewall or proxy logs for unusual outbound DNS queries to external IPs, indicating potential efforts to redirect traffic post-authentication.

  ### Prioritization

  This alert is prioritized as high severity due to the critical nature of Active Directory DNS infrastructure. The manipulation of DNS records can lead to significant security breaches if successfully exploited. Given that similar methods are commonly weaponized in advanced persistent threat scenarios, prompt investigation is crucial.

  ### Blind Spots and Assumptions

  There are limitations in this detection, particularly if logging settings are not appropriately configured for DNS object changes. Evasion techniques may include using legitimate accounts to alter DNS records without raising suspicion. This alert could also be triggered by benign administrative actions such as routine DNS maintenance. A related detection for suspicious DNS query patterns can strengthen overall coverage against Kerberos coercion attempts.

