logsource:
  product: windows
  service: security
  definition: |
    By default these events are not logged by default for MicrosoftDNS objects in Active Directory.
    To enable detection, configure an AuditRule on the DNS object container with the "CreateChild" permission for the "Everyone" principal.
    This can be accomplished using tools such as Set-AuditRule (see https://github.com/OTRF/Set-AuditRule).
detection:
  selection_directory_service_changes:
    EventID:
    - 5136
    - 5137
    ObjectClass: 'dnsNode'
    ObjectDN|contains|all:     # ObjectDN">DC=foo-11UWhRCAAAAAAAAAAAAAAAAAAAAAAAAAAAAwbEAYBAAAA,DC=domain.com,CN=MicrosoftDNS,DC=DomainDnsZones,DC=domain,DC=com</Data>
    - 'UWhRCA'
    - 'BAAAA'
    - 'CN=MicrosoftDNS'
  selection_directory_service_access:
    EventID: 4662
    AdditionalInfo|contains|all:     # AdditionalInfo">DC=foo-11UWhRCAAAAAAAAAAAAAAAAAAAAAAAAAAAAwbEAYBAAAA,DC=domain.com,CN=MicrosoftDNS,DC=DomainDnsZones,DC=domain,DC=com</Data>
    - 'UWhRCA'
    - 'BAAAA'
    - 'CN=MicrosoftDNS'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies modifications to DNS records within Active Directory that contain a base64-encoded blob indicative of a Kerberos coercion attack. The encoded string typically corresponds to a CREDENTIAL_TARGET_INFORMATION structure used by attackers to force authentication requests from victim systems to attacker-controlled hosts. By spoofing Service Principal Names (SPNs) via DNS manipulation, adversaries aim to redirect legitimate authentication processes, allowing them to collect credentials or establish unauthorized access. The primary objective of this attack is to escalate privileges and maintain persistence through manipulated authentication pathways.

  The rule relates to the MITRE ATT&CK framework, specifically aligning with the "Credential Access" tactic (TA-0006) and the technique "Kerberos Coercion" (T1557.003). This indicates the potential for significant security breaches, as successful coercion could lead to unauthorized access to critical systems or sensitive data. Essential data sources for this detection include security event logs from Windows, particularly focusing on Event IDs 5136, 5137, and 4662, which capture modifications and accesses to DNS records.

  ### Investigation Steps
  - **Analyze Security Event Logs**: Review Windows security event logs to identify events 5136 and 5137 related to DNS modifications. Pay attention to entries containing the base64 patterns 'UWhRCA' and 'BAAAA' to confirm potential Kerberos coercion activities.
  - **Identify User Account**: Investigate the user account responsible for the DNS changes. Compile a list of recent activities for this account to check for any signs of compromise or unusual behavior, especially if the account has low privileges.
  - **Correlate with Network Traffic**: Examine network logs for any unusual or unauthorized DNS queries and responses around the time of the detected modifications. This may provide context on whether the changes resulted in any active Kerberos authentication attempts to attacker-controlled services.
  - **Review DNS Configuration**: Ensure that DNS logging and auditing are properly configured on the AD DNS server. Confirm that audit logs capture CreateChild events and any changes to DNS object settings in Active Directory.

  ### Prioritization
  This alert should be prioritized as high due to the potential for significant impact if an attacker successfully executes a Kerberos coercion attack. The likelihood of such attacks occurring within enterprise environments can be elevated, particularly if there are known vulnerabilities (e.g., CVE-2025-33073) associated with existing systems.

  ### Blind Spots and Assumptions
  The detection logic relies on specific DNS object changes logged by Microsoft's Active Directory and assumes that auditing for these modifications is properly configured and enabled. If the necessary audit rules are not applied, these events may not be logged, leading to potential gaps in detection. Additionally, the rule assumes genuine events where base64-encoded strings are indeed malicious, but benign scenarios might exist where legitimate changes generate false positives. Proper configurations and the auditing of DNS records are essential for effective detection.

