note: |
  ### Technical Context
  This detection rule identifies potential backdoor access in an Active Directory (AD) environment by monitoring changes to user account properties that allow delegation. Successful exploitation can enable attackers to impersonate other users without needing their credentials, granting them significant capabilities within the network. The main objective of attackers employing this technique is to maintain persistent access to sensitive accounts or resources, allowing them to evade detection and conduct further malicious activities within the organization's infrastructure.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1098)**, which involves establishing methods to retain access to systems across reboots and credential rotations, and **Privilege Escalation (T1078)**, with the technique allowing for unauthorized elevation of privileges. This detection leverages primary data sources such as Windows Security event logs, specifically focused on event IDs that track changes to user accounts and delegation permissions.

  ### Investigation Steps
  - **Review Security Logs:** Examine Windows Security event logs for Event ID 4738, which indicates modifications to user accounts, particularly focusing on changes to delegation attributes.
  - **Inspect LDAP Changes:** Analyze Event ID 5136 for any alterations to the attributes `msDS-AllowedToDelegateTo` and `servicePrincipalName`, which are critical indicators of potential backdoor configurations.
  - **Correlate User Activity:** Cross-reference the accounts identified in the alerts with recent logins or access attempts to sensitive resources to determine if unauthorized actions occurred.
  - **Verify Group Policy Settings:** Ensure that audit policies for user account management and directory service changes are properly configured to prevent any unmonitored modifications to delegation settings.

  ### Prioritization
  Given the high-impact nature of unauthorized access to user accounts and the potential for widespread compromise within the network, alerts generated by this rule should be treated with high priority. The likelihood of misuse, particularly in environments with extensive user management and sensitive data, underscores the need for prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may not account for legitimate administrative changes made to delegation settings by authorized personnel, which could lead to false positives. Additionally, if audit policies for account management and directory service changes are not appropriately configured, this detection may fail to capture relevant events. Therefore, it's essential for organizations to ensure that the requisite logs are enabled and that staff are trained to recognize legitimate administrative actions versus malicious attempts to create backdoors.

