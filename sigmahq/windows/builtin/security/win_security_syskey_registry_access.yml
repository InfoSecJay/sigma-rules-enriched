note: |
  ### Technical Context
  This detection rule identifies attempts to access specific Windows registry keys associated with the SysKey feature, which is used for securing the Local Security Authority (LSA) secrets. The main objective of an attacker could be to manipulate or retrieve encryption keys related to stored user credentials, potentially leading to unauthorized access to sensitive information. By detecting access requests to these specific registry keys, security teams can identify potential pre-attack activity indicative of credential theft or privilege escalation efforts.

  The relevant MITRE ATT&CK techniques for this rule include **Discovery** (T1087) and **Credential Dumping** (T1003), as attackers targeting the SysKey typically aim to gather sensitive authentication information. The primary data sources for detecting this activity are Windows Security logs, particularly logs that capture event IDs 4656 (Handle Request) and 4663 (Object Access), which reflect access to registry keys.

  ### Investigation Steps
  - **Review Security Logs:** Examine Windows Security logs for Event IDs 4656 and 4663 that indicate access attempts to SysKey-related registry keys. Look specifically for the "lsa\JD," "lsa\GBG," "lsa\Skew1," and "lsa\Data" registry paths.
  - **Correlate with User Behavior:** Analyze the user accounts associated with the access attempts. Determine if these users have a legitimate business need for accessing these keys or if they are unusual for the context of the environment.
  - **Check for Credential Dumping Tools:** Look for any known indicators of compromise related to credential dumping tools or techniques. This can include logs for unusual parent-child process relationships or the presence of associated binaries on endpoints.
  - **Assess Endpoint Configurations:** Ensure that all endpoints are configured to log registry access adequately and that logging covers the necessary security events to avoid missing similar activities in the future.

  ### Prioritization
  This alert should be treated with high priority due to the impact potential. Access to SysKey-related registry keys can indicate a significant threat, as it may enable a malicious actor to compromise credential storage, leading to further access and exploitation within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if registry access logging is not uniformly enabled across all endpoints or if specific keys are not actively monitored. The detection logic assumes that the access to the registry keys is malicious unless proved otherwise, which may not take into account benign administrative activities. Proper configuration and consistent security logging must be in place for this alert to function effectively, especially regarding Windows Security auditing settings.

