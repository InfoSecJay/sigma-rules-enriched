note: |
  ### Technical Context

  This rule detects changes to user account control settings that enable weak encryption mechanisms, such as those utilizing weak Kerberos encryption types. The likely objective of an attacker exploiting these settings is to facilitate hash or password cracking to gain unauthorized access to user accounts. This behavior corresponds to the MITRE ATT&CK technique "Kerberoasting" (T1558), which falls under the tactic of "Defense Evasion."

  The primary telemetry source for this detection is the Windows Security Event logs, specifically focusing on Event ID 4738 (A user account was changed). If malicious, this behavior can lead to credential theft, unauthorized access, and potentially larger compromise of the environment. Importantly, this detection does NOT confirm that an account has been compromised; it merely indicates that weak encryption has been enabled, which could increase susceptibility to attacks.

  ### Investigation Steps

  - **Review Event Details for User Account Changes:** Look for Event ID 4738 in the Security logs (Windows Event Viewer) and verify the specific user account modified along with any changes in the "OldUacValue" and "NewUacValue" fields.

  - **Check Previous UAC Settings:** Validate previously set User Account Control values by cross-referencing against historical logs to establish a baseline. If weak encryption was never before present, the change should be scrutinized closely.

  - **Identify Weak Encryption Settings:** Analyze the "NewUacValue" field from Event ID 4738 to check for values ending with "8", "9", "A", "B", "C", "D", "E", or "F" indicating weak encryption types.

  - **Assess for Active Exploitation Indicators:** Check for unauthorized access attempts around the same timeframe as the UAC changes. Monitor for failed logins (Event ID 4625) or unexpected service principal name (SPN) queries in the Security logs that may indicate an active Kerberoasting attempt.

  - **Correlate User Behavior with Legitimate Activities:** Examine user login patterns and activities. For example, typical Kerberos usage does not involve modifying cryptographic settings. Shifts in user behavior or attempts to query service accounts should be flagged as suspicious.

  - **Investigate Additional Logs for Context:** Collect and analyze relevant logs from Active Directory (e.g., Directory Service logs) for any account enumeration activities or suspicious adjuncts that correlate with high-value asset accounts.

  ### Prioritization

  This alert has high severity due to the potential impact of altered settings on user accounts, especially those with access to critical systems. The likelihood of misuse is significant, as weak encryption configurations are a common exploitation vector for adversaries aiming for credential theft. Kerberoasting is widely recognized as a commonly weaponized attack technique.

  ### Blind Spots and Assumptions

  This detection may be limited by configurations that do not log user account management events appropriately. Additionally, legitimate activities like regulatory changes or system upgrades may trigger these alerts without malicious intent. Some adversaries may use obfuscation methods to suppress account modification logs. A companion detection, such as anomalous login attempts (via failed login events), would strengthen overall coverage by correlating user behavior with potential misuse.

