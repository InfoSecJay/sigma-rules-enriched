note: |
  ### Technical Context

  This rule detects the modification of user accounts to enable weak encryption settings in Active Directory. Likely attacker objectives could include facilitating credential theft via account enumeration and subsequent hash cracking. The relevant MITRE ATT&CK technique is "Account Manipulation" (T1562.001). Primary telemetry sources should include Windows Security Event logs, specifically Event ID 4738, which logs changes made to user accounts and the associated user account control (UAC) flags. If malicious, these alterations could significantly weaken account security, leading to unauthorized access or privilege escalation. This detection does NOT confirm malicious intent on its own as legitimate administrative actions could also modify UAC settings.

  ### Investigation Steps

  - **Review Event Details**: Check Security Event ID 4738 in the Windows Security logs. Specifically, examine the fields for "OldUacValue" and "NewUacValue" to identify any encryption settings changed to weak configurations (e.g., ending with 8F, 9F, or similar).

  - **Investigate User Account Modification History**: Cross-reference the timestamps of the Event ID 4738 with previous logs of the same user or related accounts, focusing on admin-level activities to assess if legitimate changes are documented, ensuring consistency with organizational policy.

  - **Check User Roles**: Identify whether the account in question holds elevated privileges (e.g., Domain Admin). Review account responsibilities to correlate legitimate use cases against the detected changes in UAC settings.

  - **Identify Malicious Indicators**: Look for patterns or repeated occurrences of weak encryption settings being enabled for multiple user accounts, particularly if these accounts are not known to require such settings, as this indicates possible malicious activity.

  - **Assess for Companion Events**: Monitor for other related logs, such as group policy changes (Event ID 4739), which may accompany the weak encryption configuration and indicate more extensive account management abuses.

  - **Document Expected Legitimate Activity**: Identify thresholds of normal user behavior and account configurations in your environment. For instance, note typical UAC settings for standard users versus administrative users and define the baseline to differentiate between benign and malicious changes.

  ### Prioritization

  This alert indicates high severity due to the potential for significant security impact if weak encryption settings are manipulated. Attackers commonly exploit weak encryption to facilitate password cracking, thus this behavior can be frequently weaponized. Systems with administrative accounts are particularly critical as they are prime targets for escalated access.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimately changing accounts for operational reasons, which can lead to false positives. Reliable alerts require properly configured auditing for user account management and related group policies. Organizational changes, such as user role adjustments or system updates, could trigger similar alerts. A companion detection that strengthens coverage is monitoring for lateral movement techniques, such as Kerberoasting (T1558), which may occur alongside weak encryption settings being enabled.

