note: |
  ### Technical Context

  This Sigma rule detects instances where auditing for critical Windows events, such as "Process Creation" and "Logon" events, has been disabled. The likely attacker objective is to evade detection mechanisms by altering audit policies, allowing malicious actions to proceed undetected, which can facilitate lateral movement, data exfiltration, or other malicious activities. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and specifically the technique related to Modify Registry (T1112) or Disable/Remove Logging (T1562.002).

  The primary telemetry source for this detection is Windows Security logs, particularly Event ID 4719, which logs changes to the audit policy. If malicious, the impact could be significant, as it directly relates to the ability to monitor and respond to system activities. However, this detection alone does NOT confirm that an intrusion has occurred; it merely indicates a change in auditing settings, which could also result from misconfiguration or administrative actions.

  ### Investigation Steps

  - **Check for recent auditing changes**: Review Security Event ID 4719 to identify any modifications made to auditing policies. Focus on timestamps and the user account making these changes. Look for unexpected or unauthorized accounts making these changes.

  - **Identify legitimate admin activities**: Cross-reference auditing change events with known administrative tasks (e.g., scheduled maintenance or policy reviews) to determine if changes were part of routine operations. Legitimate changes typically originate from IT Security or System Admin accounts.

  - **Correlate with other security events**: Investigate related Event IDs such as 4624 (Logon), 4688 (Process Creation), and 4625 (Failed logon) to confirm whether the system shows signs of malicious logon attempts or process execution patterns that may indicate exploitation.

  - **Assess the scope of audit changes**: Use PowerShell commands or Group Policy Management tools to ensure audit settings are aligned with organizational policy and check if necessary subcategories (like Process Creation or Logon) are still enabled.

  - **Evaluate user access levels**: Review account permissions and role-based access control to confirm that the accounts making changes have appropriate levels of authority. If necessary, check if there are accounts with excessive privileges that correlate with audit changes.

  - **Analyze for concurrent malicious indicators**: If attainable, review logs for files or configurations changes made in close temporal proximity (e.g., unauthorized software installations or unexpected configuration changes) that might indicate attempts to exploit the auditing changes.

  ### Prioritization

  Given that the alert indicates possible evasion of monitoring controls, the severity is high. The affected systems are likely critical for operations, and the likelihood of malicious abuse is high, especially if this change aligns with other suspicious activities. This behavior has been commonly weaponized by adversaries to disable visibility and maintain persistence in environments.

  ### Blind Spots and Assumptions

  Although this detection is effective, it may fail to capture all audit policy changes if relevant logging is not configured correctly or if Event ID 4719 is suppressed by an insider threat. Legitimate activities such as routine maintenance by IT staff could inadvertently trigger this alert. Monitoring for lateral movement (T1086) or file and directory permissions changes (T1586) can provide additional context and strengthen overall detection capabilities.

