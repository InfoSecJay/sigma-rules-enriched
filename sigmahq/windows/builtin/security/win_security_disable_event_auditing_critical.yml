note: |
  ### Technical Context

  This Sigma rule detects when critical Windows event auditing is disabled, specifically for events such as Process Creation and Logon activities. The likely attacker objective would involve evading detection by disabling logging capabilities that could expose malicious activities, thereby achieving stealthy persistence or lateral movement within the environment. The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1562) and the technique is "Disable or Modify Tools" (ID: T1685.001).

  The primary telemetry sources involved are Windows Security Logs, specifically Event ID 4719, which captures changes to audit policies. If malicious, the impact includes a significant reduction in visibility into user activities and potential entry points for undetected malicious actions. This detection does NOT confirm that the change is malicious on its own; legitimate administrative actions could also lead to these events being logged.

  ### Investigation Steps

  - **Check Event ID 4719 for Audit Policy Changes:** Review Security Event logs (Event ID 4719) for audit policy changes. Look for GUIDs related to critical categories such as Process Creation and Logon. A legitimate change may be accompanied by user accounts typical of administrative actions.

  - **Review Historical Audit Policy Settings:** Query the Security logs for past audit configurations using Event IDs 4718 and 4719. Compare the audit settings before and after the identified change to determine if there is a trend towards reduced auditing inappropriate for your security posture.

  - **Identify User Accounts Initiating Changes:** Investigate the user account associated with Event ID 4719 changes, looking for signs of malicious intent. Legitimate changes should typically come from known administrative users rather than service accounts or unfamiliar usernames.

  - **Look for Subsequent Attacks or Unusual Activity:** Cross-reference the time of the policy change with other relevant logs. An uptick in suspicious activities, particularly following the disabling of audit events (e.g., failed logon attempts visible in Event ID 4625), could indicate malicious intent.

  - **Analyze System Configuration Changes:** Examine both Event ID 4688 (Process Creation) and Security Event logs to spot processes initiated around the time of the audit policy disablement. Malicious changes may introduce unfamiliar or unexpected processes that normally don’t interact with critical system files.

  - **Verify Monitoring Configurations:** Ensure that all appropriate logging configurations are enabled on critical systems and check if alerts are properly set up to notify of future audit policy alterations, especially in high-value assets or domain controllers.

  ### Prioritization

  This alert indicates a high severity in an enterprise context as disabling important event auditing directly undermines the ability to detect suspicious activities. Given that this behavior can often be weaponized by advanced persistent threats (APTs), immediate investigation is warranted to assess potential breaches or malfeasance.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility that legitimate administrative activities can lead to the same alert if not properly documented. Reliable detection requires ensuring that audit policy logging is consistently configured and monitored across all endpoints. Legitimate scenarios such as scheduled maintenance or policy updates may trigger this alert. A related detection, such as monitoring for Event ID 4662 (Object Modified), can enhance coverage by indicating what operations occur post-policy changes.

