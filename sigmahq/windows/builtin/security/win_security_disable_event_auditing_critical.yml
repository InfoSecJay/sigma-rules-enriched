note: |
  ### Technical Context
  This rule detects scenarios where auditing for critical Windows events is disabled. Key events that establish a security baseline, such as "Process Creation" and "Logon," being turned off can signal potential adversarial activity aiming to manipulate or cover tracks in an IT environment. Attackers may disable auditing to reduce visibility into their actions, facilitating maintain access and executing malicious tasks without detection.

  Relevant MITRE ATT&CK tactics involved include **Defense Evasion** (TA0005) and specifically the technique **Audit Policy Modification** (T1562.002), which highlights methods adversaries use to alter auditing policies to evade detection. The primary data source for this detection is Windows Security logs, specifically Event ID 4719, which captures changes in audit policy settings.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the Windows Security Event Logs focusing on Event ID 4719 to identify any changes to critical auditing categories, especially around the time of logging a policy modification.
  - **Examine Recent Changes**: Investigate system configuration changes or group policy alterations that coincide with the disabling of key audits. This may include querying Group Policy Objects (GPOs) for recent modifications.
  - **Monitor for Correlations**: Correlate the timing of audit modifications with other security events, such as suspicious logon attempts or privilege escalations, which could indicate an active threat.
  - **Assess System Integrity**: Check for additional signs of compromise such as tampering with Windows Event Forwarding, unauthorized administrative account activity, or anomalies in baseline behaviors related to user and process activity.

  ### Prioritization
  The severity of this alert is high, as disabling critical auditing directly undermines an organization's ability to detect and respond to unauthorized activities, significantly increasing risk for potential data breaches or continued exploitation.

  ### Blind Spots and Assumptions
  Gaps in detection may include scenarios where auditing is disabled outside the context of legitimate changes or in environments where security logging is not properly configured or collected. There is an assumption that complete logging of relevant security events is enabled and properly functioning. For this alert to work effectively, continuous monitoring of Windows security logs and regular audits of auditing configurations must be enforced to ensure timely detection of such configurations changes.

