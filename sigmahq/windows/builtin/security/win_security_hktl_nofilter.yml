note: |
  ### Technical Context

  This rule detects the execution of the NoFilter tool, which manipulates the Windows Filtering Platform to escalate privileges by leveraging specific hardcoded policy names like 'RonPolicy'. The likely attacker objective is to alter or create filtering policies to gain unauthorized access to system resources or to change the behavior of the Windows Firewall. This behavior aligns with the MITRE ATT&CK technique for privilege escalation (T1134) and specifically falls under the sub-technique a (T1134.001).

  The primary telemetry sources for this detection are Windows security logs, specifically focusing on Event IDs 5447 and 5449, which signify changes to filtering policies. If malicious, the security impact can be significant as it may allow an attacker to evade security controls or gain unauthorized administrative access. However, this detection does NOT confirm an active exploitation attempt on its own and should be correlated with additional investigative efforts.

  ### Investigation Steps

  - **Review Event IDs 5447 and 5449:** Check Windows Security logs for Event ID 5447 (Policy changed) and Event ID 5449 (Provider context modification) to identify actions involving the filter policy 'RonPolicy'.

  - **Validate the source of modifications:** Investigate the user accounts associated with the events. Ensure that they are legitimate users or administrators with expected rights to modify Windows Filtering Platform settings.

  - **Analyze administrative actions:** Correlate the detected events with other administrative activity on the host, such as Windows Event ID 4624 (successful logon) and 4672 (special privileges assigned), for context regarding legitimate administrative access.

  - **Identify application activity:** Look for related process creation (Event ID 4688 or Sysmon Event ID 1) occurring around the same timeframe. Check if processes spawned are known or authorized management tools versus suspicious or unknown executables.

  - **Document expected policy state:** Understand the normal state of filtering policies on the host. Legitimate behavior generally should not include arbitrary filter names like 'RonPolicy'. Compare current settings with baseline configurations.

  - **Assess host criticality and risk:** Consider the function of the affected host within the environment. Systems with elevated privileges or sensitive data are more critical and should be investigated promptly if this alert triggers.

  ### Prioritization

  Given that the execution of NoFilter can allow elevation of privileges and manipulation of firewall rules, this alert is high severity. The likelihood of malicious abuse is significant, especially if the affected system plays a critical role in security or administrative functions. Such behaviors are often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may have limitations due to its reliance on specific filtering policy names, which could be altered or obfuscated by sophisticated adversaries. Accurate log collection is crucial; without enabling auditing for Windows Filtering Platform Policy Changes, the detection will not function effectively. Legitimate administrative tasks may also trigger this alert, such as authorized changes to filtering policies. A companion detection could be the monitoring of Windows PowerShell activity (Event IDs 4104, 4103) for additional context on potentially malicious scripting or tool use related to privilege escalation attempts.

