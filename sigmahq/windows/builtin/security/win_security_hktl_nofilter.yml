note: |
  ### Technical Context

  This Sigma rule detects the execution of "NoFilter," a tool that exploits the Windows Filtering Platform (WFP) for privilege escalation. The likely attacker objective is to manipulate filtering policies to gain elevated access to the system without detection. This behavior is categorized under the MITRE ATT&CK framework as "Privilege Escalation" (T1134) and "Privilege Escalation via Process Injection" (T1134.001). The primary telemetry sources for this detection include Windows security logs related to WFP policy changes, specifically Event ID 5447 and Event ID 5449. The security impact is significant, as successful exploitation could allow an attacker to escalate privileges or maintain persistence. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administration activities may also modify WFP policies.

  ### Investigation Steps

  - **Review recent policy changes:** Examine Windows security logs for Event ID 5447 or 5449, focusing on filter or provider context names containing 'RonPolicy' to identify irregular modifications.
  - **Determine the actor's context:** Check for the user account associated with the events. Review Event ID 4624 (Logon) for the contextual usage of the account, ensuring it aligns with expected administrative activity.
  - **Verify legitimate use cases:** Investigate whether 'RonPolicy' has been previously documented as a necessary filter change for your environment, and assess the timing around any change requests or recent system updates that may explain the log entries.
  - **Identify elevated privileges:** Look for corresponding Event ID 4672 (Special Privileges Assigned to New Logon) within the timeframe of the suspicious events to confirm if an account running this process had elevated privileges, marking a potential security concern.
  - **Search for related anomalies:** Utilize SIEM tools to correlate this event with other potentially suspicious activities, such as unexpected process creation events (Event ID 4688) that may have occurred shortly before or after the WFP modifications.
  - **Cross-reference with known tools:** Validate the presence of the NoFilter executable, which may be found in common application directories (e.g., %TEMP%) or through antivirus logs, assessing file hashes against known malicious signatures.

  ### Prioritization

  This alert carries high severity due to the potential for privilege escalation on critical systems, which might be prime targets for adversaries. The likelihood of this behavior being malicious is significant, given the nature of the detected tool and its association with stealthy privilege escalation techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by the necessity of enabling auditing for the Windows Filtering Platform Policy Change, which is not always configured in all environments. Legitimate activities, such as IT maintenance or troubleshooting, may trigger this alert, potentially resulting in false positives. A related detection method includes monitoring for arbitrary process injection attempts (e.g., Event ID 4688 for newly created processes), which can provide further context to validate suspicious behavior.

