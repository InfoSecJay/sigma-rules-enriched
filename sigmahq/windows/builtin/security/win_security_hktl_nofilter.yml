  ---

  ### Technical Context

  This Sigma rule detects the execution of the NoFilter tool, which abuses the Windows Filtering Platform for privilege escalation through manipulation of hardcoded policy names such as "RonPolicy." The likely attacker objective is to escalate privileges on compromised systems, enabling further malicious activities. This detection aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1134) and specifically with the abuse of filtering mechanisms (T1134.001).

  The primary telemetry sources are Windows Security logs, particularly Event ID 5447 (Policy change) and Event ID 5449 (Provider context name), both of which indicate modifications or executions related to network filtering policies. If the activity is malicious, it could allow an attacker to elevate privileges and gain unauthorized access to sensitive resources. Importantly, this rule does NOT confirm malicious intentions solely based on execution; further investigation is required to establish context and intent.

  ---

  ### Investigation Steps

  - **Check triggered events: ** Examine Windows Security Event IDs 5447 and 5449 for the presence of "RonPolicy." Look for fields like `FilterName` for 5447 or `ProviderContextName` for 5449 to confirm execution.

  - **Analyze the context: ** Review logs for the account executing the events. Correlate with other user behavior (e.g., Event IDs 4624 and 4625) to determine if the executing user has known malicious activity or anomalous access patterns.

  - **Identify legitimate usage: ** Validate if "RonPolicy" is associated with any legitimate filtering configurations in your organization. Many environments may have custom policies, and confirming pre-established policies will help rule out false positives.

  - **Assess system impact: ** Evaluate the target system’s role. Check if it is a critical server or workstation and consider the potential security ramifications if the activity is confirmed as malicious.

  - **Look for further indicators: ** Investigate for additional suspicious activities such as changes to user privileges (Event ID 4670) or unusual network connections (Windows Firewall logs). Link to processes for privilege elevation.

  - **Correlate with other detections: ** Compare with other detections of privilege escalation or filtering manipulation in the environment, as multiple detections can reinforce the severity of this incident.

  ---

  ### Prioritization

  This alert is of high severity because it indicates a privilege escalation attempt that could allow attackers to gain elevated access, especially if it occurs on critical systems. The likelihood of malicious use is high, given the prevalence of abuse associated with Windows Filtering Platform manipulation in many attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may miss obfuscated executions of NoFilter or variants using different filter names. Reliable detection requires that Audit Filtering Platform Policy Change logging is enabled across all relevant systems. Legitimate activities with filtering policies may generate similar alerts. Related detections for monitoring abnormal Windows Filtering Platform changes strengthen overall security posture.

