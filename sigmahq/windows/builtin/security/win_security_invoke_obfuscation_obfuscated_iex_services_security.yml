  type: derived
status: test
description: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
date: 2019-11-08
modified: 2022-11-27
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection_eid:
    EventID: 4697
  selection_servicefilename:
  - ServiceFileName|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ServiceFileName|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ServiceFileName|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ServiceFileName|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ServiceFileName|re: '\\*mdr\*\W\s*\)\.Name'
  - ServiceFileName|re: '\$VerbosePreference\.ToString\('
  - ServiceFileName|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework, particularly focusing on the invocation of commands through the PowerShell `IEX` (Invoke-Expression). Such obfuscation techniques are commonly exploited by attackers to evade detection while executing malicious scripts, often to download and execute additional payloads or perform actions stealthily on compromised systems.

  Attackers leveraging this technique typically seek to maintain stealth while conducting a range of nefarious activities, such as data exfiltration, lateral movement, or establishing persistence within a network. The use of obfuscation makes it challenging for traditional detection mechanisms to flag malicious activities, thereby increasing the likelihood of success in their offensive operations.

  Relevant MITRE ATT&CK tactics that apply to this detection rule include:
  - **Defense Evasion (TA0005)**: The technique of disguising malicious activity to evade detection.
  - **Obfuscated Files or Information (T1027)**: Specifically targets methods used to obfuscate content, making it difficult for security solutions to analyze.

  Primary data sources include:
  - **Windows Security Logs**: Specifically Event ID 4697, which records changes to service configuration and can reveal obfuscated PowerShell execution attempts.
  - **Process Creation Events**: Logs that track command-line executions may also provide insight into suspicious command invocations.

  ### Investigation Steps
  - **Inspect Security Logs**: Review Windows Security Event ID 4697 for any obfuscated PowerShell command invocations, focusing on unusual service configurations or changes that relate to IEX usage.
  - **Analyze Command-Line Arguments**: Examine process creation logs for any commands that include `IEX` or PowerShell execution patterns indicative of obfuscation techniques being used.
  - **Correlate with Known Threats**: Cross-reference threat intelligence related to Invoke-Obfuscation and similar PowerShell usage patterns to identify any known malicious actors or campaigns that have utilized these obfuscation techniques.
  - **Monitor Network Activity**: Analyze outbound network traffic for connections from PowerShell sessions that show signs of invoking obfuscated scripts, particularly focusing on unusual domains or IPs that may indicate command-and-control communication.

  ### Prioritization
  This alert is classified as high severity due to the significant impact that obfuscated PowerShell commands can have on enterprise security, as they are commonly associated with successful intrusions and subsequent lateral movement or payload delivery.

  ### Blind Spots and Assumptions
  The detection logic may not catch all obfuscation attempts, particularly if attackers employ new obfuscation methods or tools not covered by current regex patterns. The rule assumes that relevant Windows security logs (specifically Event ID 4697) are enabled and properly configured for collection and analysis. Additionally, false positives could arise from legitimate administrative activities or third-party software utilizing similar obfuscation techniques for benign purposes.

