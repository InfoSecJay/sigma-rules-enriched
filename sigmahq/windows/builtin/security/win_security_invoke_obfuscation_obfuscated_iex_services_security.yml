detection:
  selection_eid:
    EventID: 4697
  selection_servicefilename:
  - ServiceFileName|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ServiceFileName|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ServiceFileName|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ServiceFileName|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ServiceFileName|re: '\\*mdr\*\W\s*\)\.Name'
  - ServiceFileName|re: '\$VerbosePreference\.ToString\('
  - ServiceFileName|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell invocation through the use of the Invoke-Obfuscation framework, specifically by monitoring the `ServiceFileName` field for characteristic patterns. The likely objective of an attacker leveraging this technique is to execute malicious PowerShell commands while evading detection by security solutions and analysts. This behavior is relevant to the MITRE ATT&CK tactic "Execution" (T1203) and technique "Obfuscated Files or Information" (T1027).

  Primary telemetry sources include Windows Security logs, specifically focusing on Security Event ID 4697, which pertains to a new service being installed. If malicious, this could allow the attacker to gain control over the system or execute further attacks. Note that this detection does NOT confirm malicious intent by itself, as legitimate PowerShell usage may also generate similar patterns.

  ### Investigation Steps

  - **Review Event ID 4697 logs**: Inspect Security Event ID 4697 for the presence of obfuscated command patterns within the `ServiceFileName` field. Look for entries that match regex signatures described in the rule.

  - **Analyze surrounding events**: Evaluate additional logs related to the same user or system around the time of the alert; correlate with event data from Event ID 4688 (process creation) to identify the parent process executing the obfuscated PowerShell command.

  - **Identify legitimate PowerShell usage**: Check for authorized administrators or automated scripts that may invoke PowerShell, focusing on processes like Windows Task Scheduler (Event ID 4698) or Group Policy updates, which may also create services but typically will not exhibit the obfuscation patterns noted in the rule.

  - **Validate user activity on the system**: Assess the account associated with the alert; review User Activity logs to determine if the account has been logged in actively and has a legitimate history of PowerShell usage or if it exhibits anomalies.

  - **Look for high-confidence malicious indicators**: Identify any known malicious hashes or command line parameters associated with the execution of PowerShell scripts generated by the Invoke-Obfuscation framework, cross-checking against threat intelligence repositories.

  - **Check for related outbound connections**: Examine Windows Firewall or network traffic logs for unusual outbound connections that correlate with the timing of the detected event. Look for unexpected IPs or domains that the obfuscated command may be targeting.

  ### Prioritization

  This alert should be treated as high priority due to the significant impact of successful exploitation on the affected system, particularly if it is a critical server or workstation. The likelihood of adversarial exploitation through obfuscated PowerShell invocations is moderate to high, as this technique is commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may fail against advanced evasion techniques, such as further obfuscation of the PowerShell commands. Reliable detection requires enabling the appropriate audit policies to capture Event ID 4697; without it, this rule won't trigger. Additionally, legitimate administrative tasks may trigger this alert, especially in environments where PowerShell is extensively used. Companion detections include monitoring for unusual process tree patterns associated with PowerShell execution, which can strengthen overall threat detection capabilities.

