detection:
  selection_eid:
    EventID: 4697
  selection_servicefilename:
  - ServiceFileName|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ServiceFileName|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ServiceFileName|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ServiceFileName|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ServiceFileName|re: '\\*mdr\*\W\s*\)\.Name'
  - ServiceFileName|re: '\$VerbosePreference\.ToString\('
  - ServiceFileName|re: '\String\]\s*\$VerbosePreference'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell command invocations using the `Invoke-Obfuscation` framework. Attackers typically utilize obfuscation techniques to hide the execution of malicious commands, which may include downloading and executing payloads, exfiltrating data, or performing reconnaissance on the environment. The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1027), focusing specifically on the use of **Obfuscated Files or Information**.

  The primary telemetry source for this detection is Windows Security logs, particularly Event ID 4697, which tracks the creation of service processes. Malicious exploitation can lead to unauthorized command execution, data breach, or system compromise. It’s important to note that while this detection highlights potentially suspicious activity, it does NOT conclusively prove that an attack occurred; further investigation is needed to confirm intent and impact.

  ### Investigation Steps

  - **Review Event ID 4697 log entries**: Check for newly created services indicating possible obfuscation techniques. Look for entries with `ServiceFileName` containing suspicious strings such as `$PSHome` or `$ShellId`, indicating obfuscation efforts.

  - **Examine PowerShell command history**: Use PowerShell module logs or host logs to review executed commands. Investigate if valid administrative tasks were executed to determine legitimate use versus potential malicious activity.

  - **Analyze parent process relationships**: Investigate the parent process of the PowerShell instances using Sysmon Event ID 1. Legitimate PowerShell scripts typically run from recognized management applications like PowerShell ISE or specific administrative tools, while obfuscated commands often stem from unknown or suspicious parents.

  - **Check host Role and Activity**: Evaluate the role of the affected host. Servers in production with essential functions (e.g., database servers) should have limited PowerShell use, whereas administrative workstations might see more frequent use. Document any deviations from normal activity.

  - **Look for Indicators of Compromise (IOCs)**: Identify any associated malicious file paths or command executions that align with known attack patterns, such as the use of encoded commands. Verify if the detected behavior correlates with established threat intelligence feeds.

  ### Prioritization

  This alert should be categorized as high severity due to the potential for significant impact if an attacker is executing obfuscated commands to evade detection. The behavior is commonly weaponized in attacks where stealth is critical, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if the obfuscation is highly sophisticated, which could evade standard detection methods. Legitimate administrative activities, such as maintenance scripts or automated deployment tools, may also trigger this alert. A related detection to enhance contextual understanding would involve monitoring for abnormal PowerShell execution patterns listed in the MITRE ATT&CK framework, particularly those not utilizing obfuscation (T1059.001).

