note: |
  ### Technical Context

  This rule detects unauthorized access to authentication tokens and accounts within the Microsoft Teams application, specifically targeting the application's cookie and local storage mechanisms. Attackers may seek to harvest credentials or session tokens to impersonate legitimate users, facilitating further access to sensitive information or organizational resources.

  The relevant MITRE ATT&CK tactic is Credential Access, with the technique identified as Credential Dumping (T1528). The primary telemetry source required for this detection is Windows Security Event ID 4663, which logs attempts to access sensitive objects. If successful, an attacker could gain unauthorized access to user accounts, posing a significant security risk to the organization. It is important to note that this detection alone does not confirm malicious intent; legitimate users may access these files for various reasons.

  ### Investigation Steps

  - **Review Event ID 4663 for access activity**: Look for Event ID 4663 in the Security logs, specifically focused on access attempts to paths under `\Microsoft\Teams\Cookies` and `\Microsoft\Teams\Local Storage\leveldb`. Legitimate access should originate from processes associated with the user's standard activities within Teams.

  - **Check for unusual process behavior**: Validate the associated process name and see if the triggering event originated from a known Teams process (e.g., `Teams.exe`). Any access logged from other executables may indicate a malicious attempt to retrieve user credentials.

  - **Analyze user context and access frequency**: Examine the user context associated with the access attempt. Multiple, rapid access attempts from the same user or from a user that is not normally interacting with Teams could be suspicious and warrant further investigation.

  - **Correlate with other credential access detections**: Cross-reference alerts with other credential-access-related detections, such as abnormal WinLogon events or other Token Dumping techniques. This can strengthen the investigation context and provide a more comprehensive view of potential compromise.

  - **Examine unique identifiers for malicious activity**: Identify and highlight unusual identifiers (such as external IP addresses or atypical user-agents) if present alongside legitimate log entries. Mark these as high-confidence malicious indicators.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on affected user accounts, which can lead to further compromise within the organization. Given the specifics of this detection, chances of malicious use are significant, considering the criticality of credential access and the popularity of Microsoft Teams among enterprises. The behavior detected is also actively weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use legitimate processes to access these tokens or employ tools to manipulate logging to avoid detection altogether. Reliable detection relies on fully enabled Windows Security Auditing policies and correctly configured log collection. Legitimate user access to these files may occur during standard usage or when troubleshooting the application. Related detections that bolster coverage include monitoring for unauthorized access to other application local storage files or logs that track user session activities.

