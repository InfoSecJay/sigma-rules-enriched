note: |
  ### Technical Context
  This rule detects access to sensitive file extensions on a network share by monitoring Windows security event logs. The detected file types, including `.bak`, `.dmp`, `.edb`, and others, are often associated with sensitive data such as backups, dumps, and email archives. Attackers may target these files to exfiltrate confidential information, manipulate backups, or find credentials stored in formats like `.pst` or `.kirbi`. The underlying objective is typically data theft, persistence, or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Collection (TA0009)**, focusing on harvesting sensitive data. Specifically, the technique **Data from Information Repositories (T1039)** applies, as it involves accessing critical files that may contain privileged information or sensitive operational data. This rule relies on security event logs to identify potentially unauthorized access to shared directories that contain these file types.

  The primary data sources for this detection are Windows security event logs, particularly EventID 5145, which indicates file and folder access attempts. By analyzing these logs, security analysts can identify potentially suspicious activities involving sensitive file extensions on network shares.

  ### Investigation Steps
  - **Review Security Event Logs:** Start by examining Windows security event logs for EventID 5145 to identify instances of access to the specified sensitive file extensions. Focus on unusual access times and user accounts.

  - **Correlate User Activity:** Cross-reference the logged file accesses with known user activities and roles. Look for patterns that deviate from normal behavior, especially for users who typically do not handle sensitive file types.

  - **Assess File Ownership and Permissions:** Investigate the permissions and ownership of the accessed files. Ensure that the users accessing the files have appropriate authorization and that there are no misconfigurations.

  - **Monitor Network Shares Activity:** Utilize network share logs to determine if the suspicious file access correlates with other anomalous activities, such as high data transfer rates or access from unusual endpoints.

  ### Prioritization
  Given the potentially high impact of unauthorized access to sensitive files, this alert carries medium severity. In an enterprise environment, the likelihood of an attacker accessing such files to exfiltrate data or disrupt operations warrants prompt investigation to mitigate potential risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to legitimate access by help desk operators or automated backup processes, which can lead to false positives. The detection logic assumes that sensitive file accesses outside normal operating hours or by unauthorized users are indeed suspicious. Adequate logging and Windows security configurations are essential for this alert to function effectively, including the proper logging of EventID 5145.

