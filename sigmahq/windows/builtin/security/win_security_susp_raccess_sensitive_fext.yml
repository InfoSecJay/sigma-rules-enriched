note: |
  ### Technical Context

  This Sigma rule detects access attempts to sensitive file extensions, indicative of potential data exfiltration or unauthorized access to critical files. The attacker objective is often to collect sensitive information, which could include user credentials, email archives, or system configurations. This behavior aligns with the MITRE ATT&CK technique "Data from Information Repositories" (T1039).

  The primary telemetry source is the Windows Security log, specifically Event ID 5145, which records access to shared folders. If malicious, this behavior could result in unauthorized data exposure, significant financial or reputational damage, or compliance violations. This detection does NOT confirm that data exfiltration is occurring without further corroborative evidence.

  ### Investigation Steps

  - **Assess Event ID 5145 logs:** Review Windows Security Event ID 5145 logs for any access to files with the extensions: .bak, .dmp, .edb, .kirbi, .msg, .nsf, .nst, .oab, .ost, .pst, .rdp. Document the user, timestamps, and source IP to determine if the activity is anomalous.

  - **Identify user intent:** Determine if the user account associated with the alert is a Help Desk operator or part of a legitimate backup process. If the access aligns with known operational roles, it may be benign.

  - **Check file access patterns:** Analyze the frequency and time of access to these file types. Multiple rapid access attempts in a short timeframe from a single user or IP may indicate malicious intent.

  - **Review shared folder permissions:** Verify the permissions on the relevant network share where the access occurred. Legitimate user roles should correlate with access attempts; unusual access by administrative accounts may warrant further investigation.

  - **Correlate with additional logs:** Cross-reference the Event ID 5145 with other logs such as Windows File System (Sysmon Event ID 11) or DNS logs to detect potential command and control activities or lateral movement prior to or after the suspicious access.

  ### Prioritization

  This alert should be treated with medium priority. The impact may vary based on the sensitive nature of the files accessed and the user account involved. The likelihood of malicious behavior is moderate as attackers frequently target sensitive file types; however, benign access can be common due to standard user and operational activities.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications or user behaviors (e.g., backup operations) to trigger this alert, resulting in false positives. Reliable detection requires properly configured logging for Windows file access activities. As a companion detection, implementing alerts for anomalous user behavior (e.g., unusual access times or geolocation) can strengthen the overall monitoring capabilities.

