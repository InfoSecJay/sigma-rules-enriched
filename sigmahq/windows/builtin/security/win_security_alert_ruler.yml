note: |
  ### Technical Context

  This rule detects the use of the Ruler hacking tool, which is employed to exploit NTLM vulnerabilities by performing NTLM relay attacks. The likely attacker objective is to harvest credentials or perform lateral movement across systems, leveraging weak or misconfigured NTLM authentication settings. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1087), Execution (T1059), and Lateral Movement (T1550.002).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 4776, which indicates NTLM authentication attempts, and Event IDs 4624 and 4625, which indicate successful and failed logons, respectively. If exploited, this activity could lead to unauthorized access to critical systems and data exfiltration. However, this detection does NOT confirm that an attack is successful or that malicious intent is present without additional context.

  ### Investigation Steps

  - **Review Event ID 4776 for NTLM authentication:** Check Security logs for Event ID 4776 with `Workstation: "RULER"` to identify NTLM relay attempts. Malicious activity would consistently show relay attempts towards other hosts.

  - **Analyze successful logon events (Event ID 4624):** Inspect Event ID 4624 for logons attributed to `WorkstationName: "RULER"` to identify valid user accounts connected to potential attacks. Look for unexpected accounts or common service accounts being used, which may indicate credential harvesting.

  - **Investigate failed logon attempts (Event ID 4625):** Review Event ID 4625 logs to identify repeated attempts to log in from the Ruler tool. A high volume of failures from a single source may indicate brute-force tactics or credential stuffing.

  - **Validate legitimate tool usage:** Cross-reference with known applications that utilize NTLM (e.g., certain Go utilities) to check for benign usage of the term "Ruler" in logs. Confirm whether the context aligns with usage of organizational tools.

  - **Correlate with system criticality:** Assess if alerts come from sensitive systems or high-privilege accounts. Engagement on critical systems (e.g., Domain Controllers) increases the priority of the alert.

  - **Check for evidence of lateral movement:** Review logs for network connections, and file access attempts indicative of lateral movement post-authentication; this may include Event IDs related to process creation or unusual network activity towards multiple hosts.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on critical systems and the likelihood of malicious abuse. Ruler is a known tool for exploitation attacks, making the behavior commonly weaponized among adversaries.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by factors such as disabled auditing or non-standard log settings, which could prevent important authentication events from being logged. Legitimate administrative tasks or third-party applications conducting NTLM authentication may also trigger this alert. A companion detection rule monitoring for unusual outbound network activities or connections from the system running Ruler may strengthen overall security posture.

