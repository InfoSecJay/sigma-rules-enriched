note: |
  ### Technical Context
  This detection rule is designed to identify the use of the hacktool Ruler, a utility developed by Sensepost, which facilitates NTLM (NT LAN Manager) authentication spoofing and enumeration. Ruler may be employed by threat actors looking to exploit vulnerabilities in NTLM, particularly in environments where legacy systems are in use. The primary objective of an attacker leveraging Ruler is typically to gain unauthorized access or perform lateral movement within a network, especially where NTLM authentication is still prevalent.

  The relevant MITRE ATT&CK tactics and techniques applicable here include **Credential Access (T1550.002)**, as attackers can harvest credentials through NTLM manipulation, and **Discovery (T1087)**, since the tool can also be utilized to gather information about users and systems within the environment. Additional techniques that may be leveraged alongside this tool include **Execution (T1059)** and **Lateral Movement (T1075)**, where the functionality of Ruler can facilitate moving across systems after initial access.

  Primary sources of data that will provide evidence of Ruler's activity include security event logs specifically related to Windows authentication events, such as:
  - EventID 4776, which logs NTLM authentication attempts.
  - EventIDs 4624 and 4625, which log successful and failed logon attempts, respectively.

  ### Investigation Steps
  - **Review Security Event Logs:** Analyze Windows security logs for EventIDs 4776, 4624, and 4625 specifically filtered by the workstation name 'RULER' to identify instances of Ruler being executed.
  - **Investigate Authentication Patterns:** Examine patterns of NTLM authentication requests to detect any surges or anomalies in logon attempts from the Ruler utility, noting any accounts frequently targeted.
  - **Correlate with User Behavior:** Look for correlations with user account activity and determine if the accounts targeted align with known administrative or high-value targets within the organization.
  - **Assess Network Traffic:** Collect and analyze network traffic logs to identify any unusual SMB or RPC communications originating from or targeting the Ruler workstation, suggesting potential lateral movement or exploitation.

  ### Prioritization
  This alert is classified as high severity due to the significant threat posed by tools like Ruler that facilitate credential access and lateral movement, which can undermine network security and lead to potential breaches or unauthorized data access.

  ### Blind Spots and Assumptions
  One major gap in detection coverage could be instances where Ruler is used but does not generate the anticipated logs due to misconfiguration or absence of auditing. The detection logic assumes that EventIDs 4776, 4624, and 4625 will accurately capture all relevant activity related to the hacktool. Additionally, effective monitoring relies on ensuring that appropriate security logging is enabled on all Windows systems and that logs are retained for a sufficient duration to support investigations.

