note: |
  ### Technical Context

  This rule detects authentication events generated by the low-level penetration testing tool, Hacktool Ruler, which is known for exploiting NTLM authentication. Attackers may utilize this tool to capture and relay NTLM hashes in order to gain unauthorized access to systems or steal credentials. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1087) and Lateral Movement (T1550.002). Primary telemetry sources required for detection are Windows Security Event logs, specifically Event IDs 4776 (NTLM authentication) and 4624/4625 (successful and failed logon attempts). If confirmed malicious, such activity can lead to significant security breaches, including unauthorized access to sensitive resources. This detection does NOT confirm actual credential theft or misuse without further contextual information.

  ### Investigation Steps

  - **Verify event context:** Review Security Event IDs 4776, 4624, and 4625 for the workstation labeled 'RULER.' Check fields such as `Account Name`, `Logon Type`, and `Source Network Address` to assess if authentication attempts are anomalous or legitimate.

  - **Assess login attempts:** Determine the frequency and pattern of successful (4624) vs. failed (4625) logins attributed to 'RULER.' Multiple failed logins before a successful one may indicate credential stuffing or an attacker's use of the tool.

  - **Evaluate legitimate usage:** Identify if any known administrative tasks or scheduled jobs are regularly using 'RULER' for authorized activities. Cross-check with processes initiated by accounts that are typically associated with those tasks.

  - **Investigate log credentials:** Cross-reference captured NTLM hashes from Event ID 4776 against a known credential store to validate if these credentials have been previously leaked or are associated with a legitimate account.

  - **Check host security posture:** Assess the endpoint security controls on the system where 'RULER' was detected. Confirm if the device has been exposed to other unauthorized software installations or vulnerabilities.

  - **Alert on concurrent events:** Correlate this detection with other security events, such as unusual outbound connections, processes starting from 'RULER,' or other indicators of potential lateral movement to identify a coordinated attack action.

  ### Prioritization

  This alert should be treated with high severity as it indicates potentially critical credential access or lateral movement attempts. The 'RULER' tool is specifically crafted for penetration testing, which indicates that it may be weaponized by an adversary to exploit system vulnerabilities. Given the highly sensitive nature of NTLM credentials, any positive match necessitates immediate investigation.

  ### Blind Spots and Assumptions

  Alerts generated by this rule can be evaded if administrators or legitimate users employ the 'RULER' tool for tasks related to network management or testing. Ensuring accurate log collection and maintaining reliable configurations are crucial for effective detection. Some legitimate Go utilities might also trigger this alert if they rely on the NTLM library. A related detection to enhance coverage could be prominent tracking around command and control traffic or other tools that typically accompany credential access techniques.

