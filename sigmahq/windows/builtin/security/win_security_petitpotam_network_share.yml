logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Detailed File Share"
    must be configured for Success/Failure'
detection:
  selection:
    EventID: 5145
    ShareName|startswith: '\\\\'     # looking for the string \\somethink\IPC$
    ShareName|endswith: '\IPC$'
    RelativeTargetName: lsarpc
    SubjectUserName: ANONYMOUS LOGON
  condition: selection
falsepositives:
- Unknown. Feedback welcomed.
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to coerce authentication via the PetitPotam vulnerability, which allows an attacker to use the `lsarpc` service to authenticate against a target machine using an unauthenticated user (ANONYMOUS LOGON). The likely attacker objective is to gain access to sensitive information or systems without providing valid credentials. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and specifically the technique T1187 (Forced Authentication).

  The primary telemetry sources include Windows Security logs, specifically looking for Event ID 5145, which logs file share access attempts. If successful, this behavior could lead to unauthorized access to files and configurations on the target system, enabling broader network compromise. Notably, this detection does NOT confirm successful authentication or access; it only indicates a coercion attempt.

  ### Investigation Steps

  - **Review Event ID 5145 logs for anomalies**: Check for entries where `ShareName` starts with `\\` and ends with `\IPC$`. Significant anomalies include repeated attempts from the same source IP or unique accounts typically not used for such access.

  - **Correlate source IP and user behavior**: Utilities like `Netstat` or `Whoami /user` after identifying the source IP can provide context. Look for IPs that are external or not on the corporate VPN.

  - **Identify legitimate use cases**: Confirm if the `ANONYMOUS LOGON` event corresponds to an internal system process or service known to use the IPC$ share legitimately. Expect regular access attempts from internal tools or services; discrepancies should raise flags.

  - **Evaluate related systems’ logs**: Examine domain controller logs for related Kerberos authentication attempts, including `Event ID 4768`, which may indicate a correlation with authentication processes during the same time frame.

  - **Check for known vulnerabilities**: Search for known software versions in the environment that correspond to the PetitPotam exploit. This can include reviewing asset inventory for affected systems and ensuring they have been patched or mitigated against this vulnerability.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems, as successful exploitation could lead to unauthorized access and lateral movement across the network. The likelihood of malicious abuse is significant, given that credential coercion techniques are commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of auditing settings on target systems; without proper logging, the rule may not trigger. Legitimate administrative tasks (e.g., network scanner activities) may inadvertently trigger this alert. A related detection for brute-force authentication attempts could strengthen coverage, especially if paired with monitoring for unusual access patterns on share resources.

