logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Detailed File Share"
    must be configured for Success/Failure'
detection:
  selection:
    EventID: 5145
    ShareName|startswith: '\\\\'     # looking for the string \\somethink\IPC$
    ShareName|endswith: '\IPC$'
    RelativeTargetName: lsarpc
    SubjectUserName: ANONYMOUS LOGON
  condition: selection
falsepositives:
- Unknown. Feedback welcomed.
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to coerce authentication using the PetitPotam technique, which can enable attackers to exploit Windows systems. PetitPotam allows attackers to force a machine to authenticate to a service under the attacker's control, potentially enabling unauthorized access to sensitive resources and lateral movement within a network. The attackers likely aim to gain access to critical systems by tricking them into authenticating using NTLM to a malicious endpoint.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and the technique **Credential dumping: NTLM** (T1187). This attack is typically used by threat actors who seek to obtain sensitive credentials from compromised machines or leverage them for lateral movement, making it a significant concern in enterprise environments.

  Data sources indicative of this behavior include Windows security logs, specifically those configured to capture detailed file share events. The required configuration involves having the advanced audit policy setting "Object Access > Detailed File Share" configured for logging both successes and failures.

  ### Investigation Steps
  - **Review Event Logs**: Inspect Windows security logs for Event ID 5145, looking specifically for records that show access attempts to shares named with the pattern `\\*\\IPC$` and initiated by the user **ANONYMOUS LOGON**.
  - **Investigate Share Access**: Analyze the circumstances around the access to the `IPC$` share. Determine if there are any legitimate processes or user accounts that should be accessing this share, and identify any anomalies.
  - **Correlate with Network Traffic**: Monitor network logs for suspicious outbound connections that may correspond to the time of the detected events. Pay attention to communication with unfamiliar IP addresses or servers that may indicate a command and control (C2) presence.
  - **Assess User Activity**: Evaluate the activity of accounts interacting with the targeted systems to determine if any other suspicious authentication attempts or access patterns are present, potentially revealing a broader compromise.

  ### Prioritization
  This alert is categorized as high severity due to its ability to signal potential unauthorized access to critical network resources, which can lead to credential theft and lateral movement, posing significant risk to enterprise security.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the advanced audit policies are not properly configured on all endpoints, as this rule relies heavily on detailed file sharing logs. Additionally, the detection logic assumes that unauthorized access attempts to the IPC$ share by **ANONYMOUS LOGON** are atypical and warrant investigation, which could lead to false positives if there are legitimate services operating under similar conditions. Ensuring that all relevant logs are collected and appropriately configured is crucial for the effectiveness of this alert.

