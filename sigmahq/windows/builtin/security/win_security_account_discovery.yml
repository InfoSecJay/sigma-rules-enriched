  definition: 'Requirements: enable Object Access SAM on your Domain Controllers'
detection:
  selection:
    EventID: 4661
    ObjectType:
    - 'SAM_USER'
    - 'SAM_GROUP'
  selection_object:
  - ObjectName|endswith:
