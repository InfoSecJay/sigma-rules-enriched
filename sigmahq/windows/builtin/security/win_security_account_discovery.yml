logsource:
  product: windows
  service: security
  definition: 'Requirements: enable Object Access SAM on your Domain Controllers'
detection:
  selection:
    EventID: 4661
    ObjectType:
    - 'SAM_USER'
    - 'SAM_GROUP'
  selection_object:
  - ObjectName|endswith:
    - '-512'
    - '-502'
    - '-500'
    - '-505'
    - '-519'
    - '-520'
    - '-544'
    - '-551'
    - '-555'
  - ObjectName|contains: 'admin'
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and selection_object and not filter
falsepositives:
- If source account name is not an admin then its super suspicious
level: high
note: |
  ### Technical Context

  This Sigma rule detects enumeration of Active Directory privileged users or groups by identifying access attempts to specific Security Accounts Manager (SAM) objects based on Event ID 4661. The likely attacker objective is to gather information on users and groups with elevated privileges, which can facilitate lateral movement or privilege escalation within the network. This behavior aligns with the MITRE ATT&CK tactic of Discovery and the technique of Account Discovery (T1087.002).

  Primary telemetry sources include Windows Security logs with Event ID 4661, specifically focusing on SAM_USER and SAM_GROUP object types. If malicious, successful enumeration can enable further exploits against high-privilege accounts. Importantly, this detection does NOT confirm malicious intent on its own, as benign administrative activities could also trigger the detection.

  ### Investigation Steps

  - **Examine Event ID 4661 logs:** Review Windows Security logs for Event ID 4661. Check the `ObjectType` field for `SAM_USER` or `SAM_GROUP`, and inspect the `ObjectName` field for indicators of privilege groups (e.g., contains '-500' or '-512') to determine if the query is targeting known admin accounts.

  - **Identify the subject account:** Analyze the `SubjectUserName` field. Flag events where accounts end with '$', as this may indicate a service account performing the enumeration which could be benign or suspicious based on context.

  - **Verify legitimate administrative actions:** Cross-check the timing and nature of the alert against known administrative schedules. If the querying activities align with legitimate administrative practices (like audits), consider the alert benign.

  - **Correlate with other suspicious activities:** Look for concurrent logs of failed login attempts or lateral movement in the same time window in Windows Event logs (Event ID 4625). Presence of failed attempts along with enumeration could indicate malicious intent.

  - **Assess for expected account permissions:** Cross-reference against known organizational roles to see if the querying account has legitimate privileges. An account not normally associated with administrative tasks accessing privileged groups is a high-confidence malicious indicator.

  ### Prioritization

  This alert is classified as high severity due to the critical nature of privileged accounts in an enterprise environment. The likelihood of their abuse for lateral movement or privilege escalation makes this behavior a common target for adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient log configurations, as Object Access auditing for the SAM must be enabled on Domain Controllers to capture relevant events. Legitimate activities, such as administrative reviews or audits, may also trigger this alert. Companion detections related to failed access (Event ID 4625) could strengthen monitoring and provide further context for suspicious behaviors.

