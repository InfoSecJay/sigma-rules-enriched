note: |
  ### Technical Context
  This detection rule identifies reconnaissance activities targeting privileged user accounts and groups in Active Directory (AD) environments. Specifically, it monitors for Event ID 4661, which signals attempts to access security objects such as user accounts and groups, particularly those associated with elevated privileges. The detection logic is designed to pinpoint events related to known privileged accounts or groups (e.g., administrators) and filter out machine account lookups, thus narrowing down potential malicious reconnaissance activity.

  The threat scenario involves an attacker looking to enumerate and map out privileged users within an organization’s AD, likely as a precursor to lateral movement or privilege escalation. Such reconnaissance is foundational in attacks that leverage tools and techniques from privileged escalation frameworks, aiding adversaries in formulating a plan to compromise high-value targets. The relevant MITRE ATT&CK tactics and techniques include **Discovery** (TA0007) and specifically **Account Discovery** (T1087.002).

  Primary data sources for effective monitoring include Windows Security Event Logs, particularly those that capture Object Access events (with Event ID 4661 being key) and audits of changes or requests involving privileged accounts.

  ### Investigation Steps
  - **Review Security Event Logs:** Examine the Windows Security event logs, especially for Event ID 4661 entries that have targeted Object Types of `SAM_USER` or `SAM_GROUP`. Look for patterns indicating unauthorized or suspicious enumeration of privileged accounts.

  - **Correlate Account Activity:** Analyze the context of the events by correlating them with recent authentication attempts and other related security logs. Identify if these account enumerations coincide with other suspicious activities, such as unusual logins or privilege escalations.

  - **Identify Privileged Groups and Users:** Compile and double-check the list of privileged accounts defined in your environment, such as 'Domain Admins', 'Enterprise Admins', and other groups with sensitive permissions, matching them against the logs detected by the rule.

  - **Investigate Related Artifacts:** Look into additional telemetry around the suspected event times, such as process creation logs that may indicate legitimate administrative tools being used or any potentially malicious behavior emanating from a particular host.

  ### Prioritization
  This alert is categorized as high severity due to the sensitive nature of privileged account enumeration activities, making it a precursor to potential elevated privilege abuses or account compromises, which can significantly impact the security posture of the enterprise.

  ### Blind Spots and Assumptions
  The detection logic assumes that Object Access auditing is properly configured and enabled on all Domain Controllers, specifically for the Security Accounts Manager (SAM). If this auditing is not consistent, there may be gaps in visibility of malicious enumeration attempts. Additionally, the rule may lead to false positives when non-admin users perform legitimate tasks that involve accessing privileged accounts. Analysts must manually distinguish between these benign actions and true threats, particularly if monitoring restrictions are in place that limit log retention or coverage.

