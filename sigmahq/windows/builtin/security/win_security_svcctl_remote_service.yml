logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName: svcctl
    AccessList|contains: 'WriteData'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential unauthorized remote access to the SVCCTL named pipe, a critical component used for service management in Windows environments. Attackers may use this method to achieve lateral movement within a network, often aiming to evade traditional security measures by manipulating native Windows functionality to establish persistence or gather information about other systems. By exploiting the SVCCTL named pipe, an attacker can interact with remote services and potentially escalate privileges.

  The primary objectives of such an attack include gaining unauthorized access to sensitive information or further compromising the system’s integrity. The associated MITRE ATT&CK tactics include **Lateral Movement** (TA0020) and **Persistence** (TA0003), with the specific technique being **Remote Services: SMB/Windows Admin Shares** (T1021.002). This highlights the importance of monitoring remote service activities, particularly those involving the IPC$ share and the svcctl named pipe.

  Key telemetry sources for this detection include Windows security event logs, specifically looking for Event ID 5145, which records detailed file share access incidents. Monitoring this event will provide valuable data regarding unauthorized write access attempts targeting the svcctl pipe.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Security logs for Event ID 5145, focusing on access attempts to `\\*\IPC$`. Look for abnormal patterns, particularly concerning the `svcctl` named pipe.

  - **Analyze User Activity:** Investigate the account initiating the remote service access. Check for unusual login times, geographic locations, or correlating activities that diverge from normal user behavior.

  - **Confirm Permissions and Share Configurations:** Validate the permissions set on the IPC$ share and the svcctl named pipe. Ensure that access is restricted to legitimate administrative users only.

  - **Cross-reference with Network Traffic:** If possible, enrich your investigation by analyzing network traffic associated with the detected activity. Use NDR tools to identify unusual connections, particularly from internal hosts to other endpoints on the network.

  ### Prioritization
  This alert should be treated with medium priority, as unauthorized access to system services can lead to significant security breaches, including data exfiltration or further exploitation of the network. Given the likelihood of such remote access attempts being employed by malicious actors, prompt investigation is critical to mitigate potential risks.

  ### Blind Spots and Assumptions
  There are potential gaps in detection that include systems where auditing for detailed file share access is not enabled, potentially leading to missed events. The detection logic assumes that legitimate administrative activity will not involve remote access to the svcctl named pipe using unusual accounts or during odd hours. It requires proper configuration of advanced audit policy settings, specifically the "Object Access > Audit Detailed File Share," to be effective. Without these logs, the detection capability may be compromised.

