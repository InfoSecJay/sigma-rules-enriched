note: |
  ### Technical Context

  This rule detects remote access attempts to the Windows `svcctl` named pipe via the IPC$ share, specifically looking for write access attempts (Event ID 5145). The likely attacker objective is to invoke service control functions remotely, which could facilitate lateral movement or persistence by exploiting services running on the host. The relevant MITRE ATT&CK tactic is **Lateral Movement** and the technique is **Remote Service Session** (T1021.002).

  The primary telemetry source for this detection is Windows Security Events with a focus on Event ID 5145, which logs access to shared resources. If malicious, successful exploitation of this behavior may enable an attacker to manipulate or control services on the target system. However, this detection does NOT confirm an ongoing compromise on its own, as legitimate administrative tasks can also invoke this behavior.

  ### Investigation Steps

  - **Review Event ID 5145 logs:** Search for Event ID 5145 in the Security Event Logs. Filter for logs where `ShareName` is `\\*\IPC$`, `RelativeTargetName` is `svcctl`, and `AccessList` contains `WriteData`. Look for user accounts that show anomalous access patterns.

  - **Identify authorized access:** Cross-reference the detected access with known administration accounts or IT personnel to establish if the access was legitimate. Document expected service control activities for those accounts to discern normal versus abnormal use.

  - **Correlate with other telemetry:** Check additional logs around the same timeframe (such as Sysmon Event ID 10) for related network connections or process creation events that might indicate malicious activity following the access attempt.

  - **Analyze remote service calls:** Look for further evidence of remote service manipulation. Review relevant logs like `PowerShell` command logs (Event ID 4104) or `WMI` activity (Event ID 4688) to see if there are any remote procedure calls made post access.

  - **Check for legitimate alternatives:** Compare findings against known IT operations that might invoke similar access patterns (e.g., system updates, approved external access). Document this alternative behavior for context.

  - **Examine endpoint security alerts:** Review alerts from endpoint detection tools or antivirus solutions that may indicate further suspicious activities initiated by the same user or host following the remote access log.

  ### Prioritization

  This alert is of medium severity. The potential impact lies in the ability to manipulate critical services or conduct lateral movement within the enterprise. The likelihood of this behavior being malicious increases due to the fact that it often precedes additional exploitation tactics, which are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Evasion techniques might include legitimate users accessing services as part of regular administrative tasks, which can trigger false positives. Reliable detection requires the "Audit Detailed File Share" setting configured properly across all relevant systems. Additionally, Windows services frequently accessed may mask malicious actions, suggesting a need for contextual awareness of normal operations. A related detection could involve monitoring for unauthorized use of administrative tools like PsExec or WinRM, enhancing visibility into lateral movement activities.

