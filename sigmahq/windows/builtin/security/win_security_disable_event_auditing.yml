note: |
  ### Technical Context
  This detection rule identifies when Windows event log auditing settings are altered to disable specific types of audit logging. By monitoring for changes in audit policies, particularly when event IDs 4719 are generated reflecting the removal of success and failure audits, the rule highlights a potential attempt by an attacker to evade detection after gaining access to a system. Disabling logging mechanisms allows attackers to perform malicious activities without leaving traces that would normally be captured in the event logs.

  Attackers may aim to disable auditing to reduce the likelihood of detection while they conduct various malicious actions, such as privilege escalation, lateral movement, or data exfiltration. This behavior is often associated with advanced persistent threats (APTs) and malicious insiders who have administrative privileges on the target systems.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005)
  - **Modify System Image** (T1562.002)

  Primary data sources for detecting such activity include:
  - Windows Security Event Logs, which record security-related events and changes to audit policies.

  ### Investigation Steps
  - **Review Security Event Logs**: Investigate Windows Security Event Logs for Event ID 4719 around the time of the suspected policy change to determine if the audit policy was indeed modified.
  - **Check Group Policy Logs**: Analyze Group Policy operational logs for configurations applied to the affected systems to confirm if local group policy changes were made inappropriately.
  - **Correlate with User Activity**: Identify any unusual user activity or administrative actions that correlate with the timing of the policy change to assess potential insider threats or compromised accounts.
  - **Assess Local Group Policy Settings**: Examine the local group policy settings on the affected systems to ensure that they align with the organization's policy and that unauthorized changes have not been made.

  ### Prioritization
  The alert's severity should be regarded as **low**, given that changes to audit policy could be part of legitimate administrative actions. However, rapid or unplanned changes, especially by unusual accounts or in sensitive environments, warrant further investigation due to their potential use as a cover for malicious activities.

  ### Blind Spots and Assumptions
  This detection may miss legitimate administrative activities if they are part of expected maintenance or updates. Additionally, it assumes that all relevant logs are collected and that group policy settings are configured to ensure local changes are visible to oversight tools. If logging is not enabled for event IDs related to audit policy changes, this rule may not trigger. Organizations must ensure the appropriate logging level is set on all endpoint devices to detect these types of modifications effectively.

