note: |
  ### Technical Context

  This rule detects when Windows event auditing is disabled, specifically focusing on changes to audit policy that could allow an attacker to evade detection. The likely attacker objective is to alter logging settings to prevent tracking of malicious activities, thereby maintaining stealth while executing further attacks. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1562) and specifically System Integrity Protection (T1685.001). Primary telemetry sources include Windows Security Event logs, specifically Event ID 4719, which captures audit policy changes. If successful, an attacker could potentially avoid detection of their activities, leading to unauthorized access or data breaches. This detection does not confirm that malicious activity has occurred; it merely indicates a change to audit settings.

  ### Investigation Steps

  - **Review the event details for Event ID 4719:** Check for changes in the Audit Policy, particularly looking for ‘Success removed’ (%%8448) or ‘Failure removed’ (%%8450) messages. Pay attention to the users responsible for these changes and whether they align with typical administrative accounts.

  - **Verify the legitimacy of the modifying user:** Analyze user account behavior through User Account Management logs (Event IDs 4720 for account creation, 4726 for account deletion) to confirm if the account making the changes has legitimate administrative privileges or if unusual accounts are involved.

  - **Cross-reference GPO settings:** Check the Group Policy settings applied to the affected system via the `gpresult /h` command or relevant Group Policy Management logs to see if these changes align with intended organizational policies, noting any discrepancies in the application of GPOs.

  - **Baseline normal audit settings:** Compare current audit settings with established benchmarks for the organization, noting what logging configurations are standard. Investigate deviations from baseline settings for potential indicators of compromise.

  - **Identify other related alerts:** Investigate if other Sigma alerts, such as those for privilege escalation or sensitive access attempts, have been triggered around the same time frame to build context around the potential incident.

  - **Determine host role and criticality:** Identify if the affected system is a critical asset, such as a Domain Controller or database server. This can escalate the urgency of the investigation based on its role within the enterprise.

  ### Prioritization

  This alert has a low severity rating initially due to the nature of the auditing change. However, the potential impact could be significant if something malicious goes undetected as a result of these logging changes. The likelihood of this behavior being malicious is moderate, especially if it aligns with other suspicious activities like unauthorized privilege modifications.

  ### Blind Spots and Assumptions

  While this rule can capture disabling of auditing, it may not account for all evasion techniques, such as using alternative methods to modify logging settings without generating this log. Comprehensive log management is critical; ensure that Security Event logs are retained and reviewed regularly. Legitimate administrative activities, such as GPO modifications, could trigger this alert; context is crucial in assessment. A companion detection to consider would be monitoring for unauthorized privilege escalation (T1068) that often accompanies such attempts to disable logging.

