note: |
  ### Technical Context

  This detection identifies instances where Windows event log auditing has been disabled, as indicated by Event ID 4719. The likely objective of an attacker employing this tactic is to evade detection during malicious activities by altering audit policies. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.002). The primary telemetry source consists of Windows Security logs, specifically focusing on Event ID 4719 that documents changes in the audit policy. If an attacker successfully disables auditing, they may execute further malicious actions with less risk of detection. Importantly, this detection does not confirm malicious intent on its own; benign policies could be misconfigured or modified.

  ### Investigation Steps

  - **Review Event ID 4719 Logs:** Check for Event ID 4719 in the Security logs. Look for entries indicating "Audit Policy Change" and verify the specific changes made to the auditing settings. Changes like 'Success removed' or 'Failure removed' are potential indicators of malicious intent.

  - **Analyze AuditPolicyChanges Field:** In the log details, examine the `AuditPolicyChanges` field for entries containing '%%8448' (success removed) or '%%8450' (failure removed). These entries suggest that an attempt to evade ongoing monitoring has occurred.

  - **Validate Current Audit Policies:** Confirm current auditing settings against established organizational standards. Use the command `auditpol /get /category:*` on the affected system to verify if critical audit policies are still enabled.

  - **Identify Legitimate Change Requests:** Assess whether any recent administrative requests or IT operations justified the audit policy changes. Cross-reference with helpdesk tickets or documented procedures to determine if the change was authorized.

  - **Check for Related Indicator Events:** Investigate for other related or companion events, such as Event ID 4663 (File Access), which may indicate suspicious activity correlating with the time of the audit policy change.

  - **Evaluate Potential Evasion Techniques:** Understand that attackers may try to re-enable auditing or modify Group Policy Objects (GPO). Monitor for any subsequent changes that revert the audit settings back to a more secure posture.

  ### Prioritization

  Given that auditing is crucial for detecting and responding to potential threats, alerts triggered from this behavior warrant attention, particularly on critical assets handling sensitive information. The likelihood of malicious abuse is significant due to its association with evasion techniques, making this alert a high priority for investigation.

  ### Blind Spots and Assumptions

  There are limitations to this detection; for example, evasion techniques such as using other means to change policies or employing lateral movement without administrative controls may bypass alerts. This detection relies on the proper configuration of Security logs to capture Event ID 4719, so ensure logging is appropriately enabled. Lastly, legitimate administrative actions, such as authorized GPO changes, may trigger this alert, reinforcing the need to contextualize findings with organizational change management processes. A related detection to consider is the monitoring of GPO changes themselves, which can provide additional layers of visibility into potential abuse.

