note: |
  ### Technical Context
  This detection rule identifies the installation of the Hybrid Connection Manager service on Windows systems. The Hybrid Connection Manager is a service that facilitates secure communication between on-premises applications and Azure platform services. While legitimate use cases exist, attackers may exploit this service to create a backdoor for persistent access or exfiltration pathways to cloud environments. The primary concern is that the presence of this service may indicate an attempt to establish unauthorized outbound connections to Azure or other cloud services.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1050)**, as attackers may seek to ensure their presence within the environment through service installations. Additionally, this could relate to **Lateral Movement (T1554)**, particularly if the service is used to assist in moving between systems within a network or to an external destination.

  The best evidence for this detection will typically come from Windows Security logs that record event ID 4697, which pertains to service installation events. Investigators should prioritize examining logs for unauthorized or unexpected service activity to gather context about potential attacker behavior.

  ### Investigation Steps
  - **Review Security Logs**: Collect and analyze Windows Security Event logs, specifically searching for Event ID 4697, which indicates the installation of the Hybrid Connection Manager service. Look for any unusual entries associated with installation timestamps.
  - **Assess Service Parameters**: Analyze the parameters associated with the Hybrid Connection Manager service, including the ServiceName and ServiceFileName, to determine if the configuration is consistent with known organizational practices.
  - **Correlate with Other Logs**: Examine related logs, such as firewall (NGFW) or network logs (NDR), to identify any unusual outbound connections to Azure or other cloud services following the service installation.
  - **Investigate User Context**: Determine the user account under which the service was installed. Analyze the account’s activities prior to the installation for signs of suspicious behavior or privilege escalation.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to create persistent access points within cloud environments, which can lead to significant data breaches or lateral movement across the enterprise network.

  ### Blind Spots and Assumptions
  One identified blind spot is the reliance on logging for Event ID 4697, which may not be configured in all environments. The detection logic assumes that attackers will install the Hybrid Connection Manager in a detectable manner, which may not always hold true if they employ more stealthy methods. Furthermore, adequate logging must be enabled for the 'System Security Extension' subcategory in Windows to capture the relevant events for this alert to be effective. This necessitates ensuring that all Windows servers and endpoints have consistent security auditing policies configured.

