note: |
  ### Technical Context

  This Sigma rule detects non-system users attempting to perform privileged operations on the Windows Service Control Manager (SCM) database, specifically leveraging the 'SeTakeOwnershipPrivilege'. This behavior suggests that an attacker may be attempting to elevate privileges or manipulate services on a Windows host, often with the goal of establishing persistence or altering service configurations. The relevant MITRE ATT&CK technique is "Privilege Escalation" (T1548). Primary telemetry sources include the Windows Security logs, specifically Event ID 4674. If exploited maliciously, this activity could lead to unauthorized control over services, impacting system integrity and availability. Importantly, this detection does NOT confirm the success of the operation; it only indicates an attempt has been made.

  ### Investigation Steps

  - **Check Event ID 4674 logs:** Review Security Event logs for Event ID 4674. Filter for events where the 'ObjectName' is 'servicesactive' and 'PrivilegeList' includes 'SeTakeOwnershipPrivilege'. Assess which non-system user triggered the event.

  - **Correlate with process details:** Identify the associated 'ProcessName' for the detected events by checking for 'services.exe' in the logs. Confirm if the parent process aligns with legitimate service configuration actions, indicating benign activity.

  - **Investigate user permissions:** Examine the user's permissions and roles in Active Directory to determine if they should be capable of performing the detected actions. Legitimate administrative users typically have elevated permissions on SCM actions.

  - **Identify high-confidence malicious indicators:** Look for repeated executions of Event ID 4674 from the same non-system user within a short timeframe, which may suggest malicious intent rather than typical administrative use.

  - **Review surrounding context:** Validate if there are any associated logs from ID 4688 (Process Creation) for notable processes that may have executed around the same time. Check for instances indicating unusual service handling, like creating or deleting critical services.

  ### Prioritization

  The alert is assigned medium severity due to the potential risk of privilege escalation on affected systems. Given that non-system users generally should not perform such operations, the likelihood of malicious abuse is significant, particularly if correlated with known attack vectors, making this behavior a focal point for investigation.

  ### Blind Spots and Assumptions

  This detection may be bypassed by sophisticated adversaries who use stealthy privilege escalation techniques or modify their actions to blend in with normal activity. Reliable detection relies on proper logging configuration for Windows Security Events, specifically ensuring Event ID 4674 is being logged. Legitimate administrative activities such as service ownership changes by authorized personnel or system maintenance tasks could trigger the alert. Related detections include monitoring for suspicious account logins or unusual service startup events to further strengthen coverage against potential privilege escalation activities.

