logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4674
    ObjectType: 'SC_MANAGER OBJECT'
    ObjectName: 'servicesactive'
    PrivilegeList: 'SeTakeOwnershipPrivilege'
  filter:
    SubjectLogonId: '0x3e4'
    ProcessName|endswith: ':\Windows\System32\services.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to monitor for non-system users executing privileged operations on the Service Control Manager (SCM) database, specifically looking for activities that involve the `SeTakeOwnershipPrivilege`. This could indicate unauthorized or suspicious actions being taken against active services within the Windows environment, often employed by attackers to manipulate services for covert persistence or privilege escalation. The relevance of monitoring SCM operations is significant as it pertains to the configuration and management of services, which are critical to system stability and security.

  The likely threat scenario involves an unauthorized user attempting to take ownership of services to manipulate configurations or gain elevated privileges that could lead to further exploitation of the system. Attackers may leverage this capability to install unwanted services or continue their operations unnoticed. The relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)** and the technique **Privilege Escalation via Service Creation (T1548)** which may employ similar methods to gain heightened privileges through existing system services.

  Primary data sources for detecting this behavior include Windows Security Event logs, specifically monitoring EventID 4674, which records attempts to modify ownership attributes of service control manager objects.

  ### Investigation Steps
  - **Review Security Logs:** Collect and examine Windows Security Event logs for EventID 4674 to identify the details of the privileged operations conducted. Look for unusual SubjectLogonId values associated with non-system user accounts.

  - **Analyze User Activities:** Investigate the activities of the user account involved in the event. Determine if there were legitimate reasons for this access or if it deviates from usual patterns associated with that user.

  - **Check for Service Modifications:** Look into the SCM logs for any subsequent changes to service states or configurations that occurred around the time of the flagged event. This helps in understanding the intent and impact of the operation performed.

  - **Correlate with Other Events:** Correlate the findings with other monitoring solutions like EDR or SIEM to identify any additional anomalous activities from the same logon session, potentially highlighting a broader attack vector.

  ### Prioritization
  The alert is classified as medium severity due to the potential for significant impact: unauthorized access to critical system services can lead to substantial security breaches, including malware installation or lateral movement within the network. Given that the actions are being performed by non-system users, the risk of malicious intent is heightened.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include benign administrative actions that also leverage the `SeTakeOwnershipPrivilege` for legitimate purposes, which could lead to false positives. The detection logic assumes that any operation involving this privilege by a non-system user is malicious, which may not always be the case. Ensuring full visibility into all SCM-related activities requires configuration of appropriate audit policies and retention of detailed event logs to capture all necessary events for reliable analysis.

