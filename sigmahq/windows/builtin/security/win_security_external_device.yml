  ---

  ### Technical Context

  This rule detects when an external disk drive or USB storage device is recognized by a Windows system. The likely objective of an attacker using this method may include data exfiltration or the introduction of malware through portable storage devices. This behavior fits within the MITRE ATT&CK framework, specifically under Initial Access (TA0001) with the technique ID T1091 (Replication Through Removable Media) and Lateral Movement (TA0008) with technique ID T1200 (Lateral Movement via Removable Media). The primary telemetry source for this detection is the Windows Security log, particularly Event ID 6416, which indicates USB device connection activity. If the alert is confirmed to be malicious, it could lead to significant data compromise or system integrity issues. However, this detection does NOT confirm malicious intent on its own, as many legitimate users may connect USB devices for valid purposes.

  ---

  ### Investigation Steps

  - **Verify external device details:** Check Event ID 6416 for the fields ClassName and DeviceDescription. Look for values indicating non-corporate USB mass storage devices. Confirm if the device identifier aligns with known corporate devices; unknown devices raise flags.

  - **Review user activity:** Analyze the user's recent configurations or changes around the time of the USB connection (e.g., Windows Event IDs 4624, 4625 for logon attempts) to understand the user's intent. Legitimate access should correlate with business functions and scheduled tasks.

  - **Inspect file access logs:** Check for file access events related to the USB device (Event ID 4663) to identify any sensitive data interactions. Unusual read/write activity on sensitive files indicates a higher risk for data exfiltration.

  - **Examine the asset's role:** Assess the role of the host where the device was connected. Systems with higher access to sensitive data (e.g., file servers, financial systems) require immediate attention due to higher risk factors associated with USB devices.

  - **Look for malware indicators:** Leverage endpoint detection and response (EDR) to identify any executable files or scripts launched from the USB (e.g., Event ID 4688 for process creation) that could indicate malicious activity.

  ---

  ### Prioritization

  The alert is categorized as low severity given that external USB devices can be commonly used for legitimate purposes in corporate environments. However, the risk of malicious abuse exists, especially in sensitive environments where such behavior is not expected. Given that USB devices are a common attack vector, any detection warranting investigation should be treated seriously.

  ---

  ### Blind Spots and Assumptions

  This detection may miss cases where malware is executed directly without generating an event or where legitimate users unintentionally trigger alerts by using personal devices. Reliable detection requires that Security Event logging is enabled and configured correctly on endpoints. Furthermore, legitimate activities such as IT department hardware upgrades or maintenance tasks could trigger this alert. Companion detections, such as monitoring for unusual file access (Event ID 4663) after device connection, can enhance overall coverage and context.

