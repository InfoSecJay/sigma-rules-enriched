title: Potentially Suspicious Explicit Credential Local Logon
id: e3c6d245-7b8f-4e2a-c17f-a9d0e5b38f62
status: experimental
description: |
  Detects potentially suspicious explicit credential logon events where the user
  is trying to logon with explicit credentials (username and password) that are
  different from the current user context. It might indicate an attacker attempting
  to escalate privileges after obtaining credentials for a different user account.
references:
- https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
- https://github.com/MSNightmare/LegacyHive
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-07-23
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134
- attack.t1134.003
logsource:
  product: windows
  service: security
detection:
  selection_eid:
    EventID: 4648
  selection_localhost:
  - TargetServerName: 'localhost'
  - TargetInfo: 'localhost'
  - IpAddress:
    - '127.0.0.1'
    - '::1'
  filter_main_computer_accounts:
    SubjectUserName|endswith: '$'
  filter_main_system_processes:
    ProcessName|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  filter_main_program_files:
    ProcessName|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_same_user:
    SubjectUserName|fieldref: TargetUserName
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- RunAs usage from user-installed applications outside Program Files
- Administrative scripts using explicit credentials from non-standard paths
level: medium
regression_tests_path: 
  regression_data/rules/windows/builtin/security/win_security_explicit_credential_local_logon/info.yml
note: |
  ### Technical Context

  This rule detects explicit credential logon events using different credentials than the currently logged-in user. The detection is indicative of potential privilege escalation attempts by an attacker who has obtained valid user credentials and is trying to access resources under another user's context. This behavior aligns with the MITRE ATT&CK technique for privilege escalation (T1134) and specifically targets credential dumping (T1134.003).

  The primary telemetry source for this detection is Windows Security logs, specifically Event ID 4648. If malicious, this behavior could allow attackers to perform operations with elevated privileges, potentially leading to data breaches or lateral movement within the network. However, it is crucial to understand that this alert does NOT confirm malicious intent or actual compromise on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Review Event ID 4648 Log Details:** Examine Security Event ID 4648 for the logged on user, `SubjectUserName`, and compare it with `TargetUserName`. A mismatch indicates suspicious activity, especially if the logon is not initiated through recognized processes.

  - **Identify Related Processes:** Check the `ProcessName` field in Event ID 4648 logs. Look for processes starting with `C:\Windows\System32\` or `C:\Program Files\` running during the logon attempt. Legitimate use may include known management tools, while processes from untrusted paths may indicate potential threat activity.

  - **Cross-reference with Device Context:** Verify if the logon attempt occurred from the same machine (`IpAddress` or `TargetServerName` is `localhost`). A local login under unusual user context on critical assets (such as servers) may heighten the risk assessment.

  - **Check for Scheduling Executables:** Look for any scheduled tasks or scripts that reference 'RunAs' or execute payloads using explicit credentials. Review logs from Task Scheduler (Event ID 106) to correlate timing with the explicit logon events for context.

  - **Monitor User Account Patterns:** Investigate the `SubjectUserName` for any accounts with recent password changes or unusual access patterns before the credential logon event. Frequent changes or logon attempts from multiple machines could suggest credential abuse.

  - **Evaluate for False Positives:** Consider scenarios such as administrative scripts or automated tasks that legitimately employ explicit credentials. Review the execution path to ensure they are not found in unusual locations outside `C:\Program Files\`.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems if an attacker successfully escalates privileges. The likelihood of malicious use is reasonable given that explicit credential use usually indicates either an administrative task or an attempted security incident. This behavior is often weaponized in targeted attacks to gain unauthorized access.

  ### Blind Spots and Assumptions

  Limitations in detection may arise from legitimate administrative functions that use explicit credentials, which could generate similar events without malice. Reliable detection relies on the complete capture of Security Event logs, particularly Event ID 4648. Additionally, user contexts involving automated processes or management tools may mistakenly trigger the alert. A companion detection, such as monitoring for abnormal user account logon patterns (Event ID 4624), can enhance coverage against credential abuse.

