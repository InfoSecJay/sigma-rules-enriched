note: |
  ### Technical Context

  This Sigma rule detects the event of a workstation session being locked due to a period of inactivity, specifically targeting Event ID 4800 in the Windows security logs. This behavior indicates that a user has not interacted with their machine for a defined duration, prompting a safety measure to protect unauthorized access to the open session. The likely objective of monitoring such locks is to ensure compliance with security policies that mandate session timeouts, which can mitigate insider threats and unauthorized access to sensitive data.

  This detection aligns with the MITRE ATT&CK technique for **Credential Dumping** (T1003) as part of efforts to prevent an unauthorized user from accessing sensitive information. The primary telemetry source is Windows Security logs, specifically the logs generated by Event ID 4800. If malicious, it signals an operational security practice, but the detection does NOT confirm whether the session was intentionally locked by the user or if a malicious actor is trying to exploit a locked machine.

  ---

  ### Investigation Steps

  - **Check the log source for Event ID 4800:** Review the Security log for Event ID 4800, which indicates the workstation/session has been locked; ensure the timestamp aligns with the user activity.

  - **Verify user activity before session lock:** Look for Event ID 4801 (which indicates a session unlock) or Event ID 4672 (indicating special privileges assigned to a user) shortly before the lock event to confirm that a legitimate user was interacting with the session.

  - **Monitor for concurrent activity:** Investigate if there were any adjacent Events (e.g., suspicious logons or unauthorized access attempts) by looking at the Security log for Event ID 4624 (successful logon). This could indicate potentially malicious behavior during the same or adjacent timeframes.

  - **Review legitimate workstation lock behaviors:** Understand expected user behaviors where employees step away from their workstations for short intervals. Ideally, these lock events should coincide with breaks or after hours and not frequently during active hours.

  - **Identify patterns of suspicious lock/unlock:** Correlate multiple lock/unlock events against user accounts to identify unusual or frequent patterns that deviate from baseline behavior, which could indicate unauthorized access or attempts to evade detection.

  - **Check for automated scripts or tools:** Look into event logs or scripts that might trigger locks unexpectedly, indicating potential misuse or configuration issues rather than genuine user activity.

  ---

  ### Prioritization

  The alert's severity is low to medium in an enterprise context, given that workspace locks are common practice. While they help reduce the risk of unauthorized access, they are typically a part of standard security policy enforcement and are less likely to indicate direct malicious intent or compromise.

  ---

  ### Blind Spots and Assumptions

  The detection may miss cases where legitimate users frequently lock/unlock their sessions due to distractions. If security logging is misconfigured or Event IDs are not generated, detection reliability diminishes significantly. Additionally, automated tools or scripts that mimic user behavior might trigger the alert without actual user interaction involved. Companion detections, such as monitoring for anomalous logon patterns (Event ID 4624), can provide additional insights into potential malicious activities.

