note: |
  ### Technical Context
  This detection rule identifies instances of a locked workstation session, specifically monitoring for Windows Security Event ID 4800, which indicates that a workstation has been locked due to a predefined period of inactivity. This rule serves to ensure that systems are appropriately secured when users are away from their desks, preventing unauthorized access to sensitive information and assets. The underlying threat scenario involves attackers who may take advantage of an unlocked workstation to gain unauthorized access to the network or sensitive data.

  From a security posture perspective, the detection aligns with the MITRE ATT&CK framework, particularly under the tactic of **Defense Evasion** (TA0005) and the technique **Disable or Evade Use of Security Tools** (T1562). While this detection is primarily a compliance and security measure to prevent unauthorized access, it also highlights the importance of understanding user activity and maintaining session integrity within an organization. It can be closely monitored alongside other telemetry sources for user authentication events or workstation unlock events.

  The primary data sources for this rule include Windows Security Event logs, particularly focusing on logs that capture session changes and states. Additional context can be gathered from related logs, such as user authentication events and remote access events when integrated with VPN or EDR tools.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Security Event logs to correlate Event ID 4800 (workstation lock) with subsequent unlock events (Event ID 4801) to identify unusual patterns or potential unauthorized access attempts.
  - **Examine User Activity**: Investigate the timeline of user activity leading up to the workstation lock event. Look for any anomalies in user behavior, particularly if the workstation belongs to high-value targets or admin users.
  - **Correlate with Remote Access**: Check VPN or remote desktop logs to see if there have been any access attempts shortly before or after the workstation was locked. This could indicate that an attacker gained access after the user stepped away.
  - **Monitor for Unusual Access Requests**: Look for other related security alerts that involve access requests from accounts tied to the locked user. Evaluate if there have been attempts to access sensitive systems or data that coincide with the workstation lock event.

  ### Prioritization
  While the alert is categorized as informational, it remains important because frequent occurrences of workstation locks in conjunction with unauthorized access attempts can indicate potential insider threats or security breaches. Analysts should prioritize investigating these events, especially in high-risk environments.

  ### Blind Spots and Assumptions
  This detection relies on the completeness and accuracy of Windows Security Event logging, which may not always be enabled or configured correctly. Additionally, this rule assumes that users adhere to organizational policies regarding workstation locking. There may be blind spots if users do not lock their workstations regularly, leading to potential gaps in detection. Furthermore, the effectiveness of this rule depends on the ability to correlate with other telemetry sources, such as remote access logs and access control mechanisms, which must also be monitored for comprehensive oversight.

