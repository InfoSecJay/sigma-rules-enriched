  ### Technical Context

  This Sigma rule detects inbound network connections on Windows systems specifically targeting ports 5985 and 5986, which are typically used for Windows Remote Management (WinRM) and PowerShell Remoting. The likely attacker objective is to establish remote command execution capabilities on a targeted host, potentially allowing for lateral movement, data exfiltration, or deployment of additional malicious payloads. This behavior aligns with the MITRE ATT&CK technique T1059.001: Command and Scripting Interpreter: PowerShell.

  The primary telemetry source for this detection is Windows Security logs, specifically monitoring Event ID 5156, which indicates the creation of a network connection allowed by the Windows Filtering Platform. If this activity is malicious, the security impact could be severe, as it may allow unauthorized remote access to critical systems. However, it is essential to note that this detection alone does NOT confirm malicious intent, as legitimate administrative tasks or automated processes may also utilize remote PowerShell sessions.

  ### Investigation Steps

  - **Review Event ID 5156 details**: Check the event logs (Security Event ID 5156) for connections established to ports 5985 or 5986, paying attention to the Source and Destination IPs and user accounts involved.

  - **Correlate with user activity**: Cross-reference the event logs with user activities within the last 24 hours to determine if the originating user account typically utilizes remote PowerShell. Look for associated login events (Event ID 4624) or scheduled tasks (Task Scheduler Logs) to establish legitimacy.

  - **Identify high-confidence malicious indicators**: Verify if the source IP listed in the logs corresponds to external, untrusted, or unusual network locations that have been associated with previous unauthorized access attempts or known malicious IPs.

  - **Assess host role and criticality**: Determine if the affected system is a high-value asset (e.g., domain controller, financial database) and assess the risk posed by the detected remote connection attempt. This may elevate the need for immediate response actions.

  - **Examine WinRM configurations**: Look at WinRM configurations (using Command `winrm get winrm/config`) on the affected host to find any unauthorized modifications or enabled services that could aid adversaries.

  - **Review expected legitimate usage**: Note that legitimate administrative or automation tasks may regularly utilize WinRM; confirm via internal documentation or consultation with system administrators to gauge if these connection attempts align with known operations.

  ### Prioritization

  This alert is considered high severity due to the critical nature of the systems that WinRM typically manages. The likelihood of malicious abuse is significant, given that unauthorized remote PowerShell access is a common tactic for attackers. Given the weaponization of this method in targeted attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as the use of secure protocols (HTTPS) or tunneling through other communication channels that may not be logged. Required log sources are dependent on properly configured Windows Security Auditing, particularly for network connection logging. Legitimate activities that may trigger this alert could include valid remote management operations by system administrators. A companion detection that strengthens coverage could involve monitoring for unusual PowerShell activity (e.g., PowerShell execution events) or abnormal user access patterns to identify correlated suspicious behavior.

