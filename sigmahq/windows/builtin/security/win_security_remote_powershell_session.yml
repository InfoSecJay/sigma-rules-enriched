  ### Technical Context
  This detection rule identifies instances of basic PowerShell Remoting (WinRM) network connections by monitoring for inbound traffic to specific ports commonly used by WinRM, namely 5985 for HTTP and 5986 for HTTPS. By capturing Event ID 5156, which relates to allowed network connections, the rule aims to recognize potentially unauthorized remote PowerShell sessions that could indicate malicious activity. Attackers may leverage WinRM to execute commands or scripts on remote systems, facilitating lateral movement or data exfiltration within compromised environments.

  In the context of cybersecurity, the most significant threat family associated with this behavior includes targeted attacks leveraging tools that rely on PowerShell remoting for command execution. Attackers may exploit this functionality to gain unauthorized access to critical systems, manipulate configurations, or interrogate the system for sensitive data. The primary goals include maintaining persistence and escalating privileges while avoiding detection. The relevant MITRE ATT&CK tactics and techniques include **Execution** (TA0002) and **Command and Scripting Interpreter: Windows PowerShell** (T1059.001).

  The primary data sources for detecting these activities include Windows security event logs (specifically Event ID 5156) and potentially network logs, such as firewall records capturing traffic to the designated WinRM ports.

  ### Investigation Steps
  - **Review Event Logs:** Analyze Windows Security logs for Event ID 5156 to identify any recent connections to ports 5985 or 5986, associating these with user identities and source IP addresses.
  - **Evaluate Remote Sessions:** Check for active remote PowerShell sessions by investigating the output of `Get-PSSession` commands executed on target machines, correlating with the detected network events.
  - **Analyze Process Creation:** Investigate process creation events (Event ID 4688) around the time of the inbound connections to determine if any suspicious PowerShell scripts or commands were executed.
  - **Inspect Network Traffic:** Examine firewall and network traffic logs for unusual patterns or IP addresses attempting to connect to the WinRM ports, focusing on traffic that deviates from established baselines.

  ### Prioritization
  This alert has a high severity level in an enterprise environment due to the potential for unauthorized remote control over devices, which can lead to critical data breaches or system compromises. The use of PowerShell remoting inappropriately can signal an advanced threat, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage involves legitimate administrative activities that may result in false positives, as remote PowerShell execution is common in operational environments. The detection assumption relies on the configuration of appropriate Windows event logging, specifically the capturing of Event ID 5156 related to allowed network connections. If logging is inadequate or the ports are not monitored, the rule may fail to detect malicious activity effectively. Additionally, the rule does not account for other potential remote access methods that may evade detection.

