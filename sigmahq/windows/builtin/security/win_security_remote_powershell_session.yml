  ---

  ### Technical Context

  This rule detects inbound network connections to ports 5985 and 5986, which are used for Windows Remote Management (WinRM) over PowerShell. Attackers often utilize Remote PowerShell sessions to remotely execute commands and maintain control over compromised machines. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1059.001 (PowerShell). The primary telemetry source is Windows Security Event Log with the relevant event ID being 5156 that logs network connection events.

  If the detected connection is malicious, it can facilitate various attacker objectives such as data exfiltration, lateral movement, or system compromise. It is crucial to understand that this detection does NOT confirm that the connection is malicious on its own; legitimate administrative or scripted tasks may invoke remote PowerShell sessions.

  ---

  ### Investigation Steps

  - **Verify Event ID 5156 logs:** Check Security Event Logs (Event ID 5156) for connections to ports 5985 or 5986. Look for Source IP and Destination IP fields; connections from known administrative IPs or hostnames may be benign.

  - **Assess WinRM usage:** Determine if WinRM is legitimately used within the organization by reviewing any existing documentation or internal processes. Legitimate activity often reflects specific times and IP ranges associated with administrative tasks.

  - **Evaluate Source and Destination:** Investigate the source of the connection. Confirm if the source IP is from a legitimate administrative system or an unusual external entity that raises suspicion.

  - **Analyze Command Execution History:** Review the PowerShell Command logs (if enabled) or relevant script logs on the destination machine for any commands executed via WinRM. Look for unusual or unfamiliar commands as high-confidence malicious indicators.

  - **Check for Automation Tools:** Identify if operational automation tools (like SCCM, Ansible, etc.) are set up to use PowerShell Remoting. These can generate legitimate traffic and should not be flagged.

  - **Correlate with Other Alerts:** Check for related alerts in the logs, such as unusual account activity or authentication failures around the same time. This may indicate a more extensive malicious operation attempting to exploit remote management capabilities.

  ---

  ### Prioritization

  This alert is considered high priority due to the potential impact on critical systems and the likelihood of malicious usage in environments where PowerShell remoting is common. Attackers frequently weaponize remote management capabilities, making this behavior a critical vector for intrusion.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logs if logging for WinRM connections is not properly configured or enabled. Additionally, legitimate administrative activities and automated scripts may trigger this alert, leading to false positives. A related detection to enhance coverage would be monitoring for suspicious command execution via PowerShell (MITRE T1059), which can provide context around the usage of WinRM connections.

