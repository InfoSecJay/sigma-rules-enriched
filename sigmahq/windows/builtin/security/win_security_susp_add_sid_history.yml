title: Addition of SID History to Active Directory Object
id: 2632954e-db1c-49cb-9936-67d1ef1d17d2
status: stable
description: An attacker can use the SID history attribute to gain additional privileges.
references:
- https://adsecurity.org/?p=1772
author: Thomas Patzke, @atc_project (improvements)
date: 2017-02-19
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1134.005
logsource:
  product: windows
  service: security
detection:
  selection1:
    EventID:
    - 4765
    - 4766
  selection2:
    EventID: 4738
  selection3:
    SidHistory:
    - '-'
    - '%%1793'
  filter_null:
    SidHistory:
  condition: selection1 or (selection2 and not selection3 and not filter_null)
falsepositives:
- Migration of an account into a new domain
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious modifications to the Security Identifier (SID) history attribute of Active Directory objects. An attacker can exploit SID history to elevate privileges illegitimately, allowing them to gain control over resources or escalate their permissions without proper authorization. This behavior often indicates an attempt to maintain persistence within a compromised environment while evading detection.

  In this context, an attacker might perform actions such as manipulating the SID history of a user account to inherit the permissions of other accounts without proper ownership or oversight. The likely attacker objectives include unauthorized access to sensitive data and escalation of their privileges to perform further malicious actions within the network.

  The detection aligns with the MITRE ATT&CK tactics of **Defense Evasion (T1560)** and **Persistence (T1134)**, specifically technique **T1134.005 (SID History Injection)**. The primary telemetry sources useful for investigating this behavior include Windows security logs that capture Event IDs 4765 (a SID history was added to an object), 4766 (a SID history was removed), and 4738 (a user account was changed).

  ### Investigation Steps
  - **Review Security Logs:** Analyze Windows security logs for Event IDs 4765, 4766, and 4738 to identify any recent modifications to the SID history of user accounts, focusing on unusual activity or unauthorized changes.
  - **Check Account Ownership:** Verify the ownership of accounts that have had SID history modifications. Search for discrepancies in administrative permissions or unexpected upgrades in access rights.
  - **Evaluate User Activity:** Investigate the recent actions of accounts involved in SID history modifications. Look for suspicious logon patterns, especially from locations or times that don't align with normal behavior.
  - **Inspect Audit Policies:** Ensure audit policies are correctly set to log changes to SID history in an Active Directory environment. Confirm if auditing is comprehensive enough to capture all relevant actions.

  ### Prioritization
  The alert is considered medium severity in an enterprise environment due to the potential for significant impact on organizational security. Manipulating SID history can lead to unauthorized privilege escalation, making it a critical scenario that requires prompt investigation.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage arises if auditing for SID history changes is not enforced or if relevant logs are not retained for an adequate period. The detection logic assumes that not all SID history modifications are malicious, particularly during domain migrations. Thus, it's essential to validate the intent behind changes by correlating them with overall account activity and context. Log configurations must ensure capture of relevant Active Directory events to allow this detection to function effectively.

