detection:
  selection1:
    EventID:
    - 4765
    - 4766
  selection2:
    EventID: 4738
  selection3:
    SidHistory:
    - '-'
    - '%%1793'
  filter_null:
    SidHistory:
  condition: selection1 or (selection2 and not selection3 and not filter_null)
falsepositives:
- Migration of an account into a new domain
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the Security Identifier (SID) history of Active Directory objects, particularly when an attacker attempts to elevate privileges by adding SIDs from other accounts. The primary objective for an adversary using this technique is to gain unauthorized access by impersonating another account’s privileges. This behavior is associated with the MITRE ATT&CK tactic of Persistence and the technique T1134.005, which focuses on the exploitation of SID history.

  The primary telemetry source for this rule includes Windows Security logs, specifically Event IDs 4765 (A SID History was added) and 4766 (A SID History was removed), as well as Event ID 4738 (A user account was changed). If malicious, this activity potentially allows attackers unauthorized administrative capabilities. However, this detection does NOT confirm that the account is compromised on its own, as changes may also occur during legitimate administrative tasks.

  ### Investigation Steps

  - **Review recent account changes:** Examine Windows Security Event ID 4738 for accounts modified in the last 24 hours. Look for high-privilege accounts with unauthorized SID history modifications.

  - **Verify SID history additions:** Check Event ID 4765 for SIDs added to the SID history. Compare the SIDs against existing known accounts for any discrepancies or known malicious accounts.

  - **Assess account migration impact:** Determine if the account undergoing SID history change is part of a legitimate migration process. Look for additional logs or change approvals regarding domain migrations to understand the context.

  - **Identify unfamiliar SIDs:** For entries in Event ID 4765, investigate the origin of newly added SIDs. Check against internal databases or documentation to confirm if they are associated with authorized users or applications.

  - **Check for removal events:** Review Event ID 4766 for any associated SID removals that occurred alongside the SID additions. This may indicate an attempt to obscure malicious behavior.

  - **Correlate with other alerts:** Look for related alerts indicating lateral movement or unusual account activity. Review logs from endpoint detection solutions, such as Sysmon for process creation events involving these accounts.

  ### Prioritization

  This alert is of medium severity as it indicates possible privilege escalation, which can significantly impact sensitive systems. Given that SID history manipulations can lead to unauthorized access and are weaponized in targeted attacks, quick validation and investigation are warranted.

  ### Blind Spots and Assumptions

  The detection may be limited by specific security audit settings not being enabled for SID history changes. Legitimate account migrations can falsely trigger this alert, underscoring the importance of verifying context before acting on findings. A related detection for account creation or privilege escalation can enhance coverage, such as monitoring for Event ID 4672 (Special privileges assigned to new logon).

