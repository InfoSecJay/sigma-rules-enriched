note: |
  ### Technical Context

  This Sigma rule detects modifications to the Security Identifier (SID) history of Active Directory objects, which can be exploited by attackers to gain elevated privileges within a domain. The likely attacker objective is to maintain persistence and escalate privileges by leveraging SID history impersonation techniques. The relevant MITRE ATT&CK tactic is 'Privilege Escalation' (ID: T1134.005) and 'Defense Evasion' (ID: T1078). The primary telemetry sources include Windows Security Event Logs, specifically Event IDs 4765, 4766, and 4738. If malicious, the impact could lead to unauthorized access to sensitive resources or administrative controls. This detection does NOT confirm the malicious intent of the changes on its own, as legitimate account migrations can alter SID history.

  ### Investigation Steps

  - **Check the affected user account:** Review Event ID 4738 for changes made to the account in question. Look specifically for any additions to SID History. Benign modifications would typically not include suspicious external SIDs.

  - **Review SID History modifications:** Analyze Events 4765 and 4766 for any updates to SID history. Legitimate modifications may reflect expected activities such as domain migrations. Malicious activity often involves unexpected or non-standard SIDs being added.

  - **Correlate with user activity:** Assess the account's recent activity for any unauthorized access to sensitive resources or unusual login times. Examine Event ID 4624 for logon events related to the account.

  - **Identify administrative policies**: Confirm if any changes to SID history were made under administrative policy via security logs. Legitimate behavior may appear in organizational change logs.

  - **Evaluate security context:** Validate the security context of the SID entries being added. Look for anomalies such as non-domain SIDs or SIDs from unusual trusted domains, which could indicate a malicious attempt to escalate privileges.

  ### Prioritization

  This alert should be treated with medium priority due to the potential for privilege escalation by malicious actors. The system's criticality influences the impact of a successful attack, as compromised administrative privileges can lead to widespread exploitation. While not all modifications are immediately indicative of abuse, suspicious SID history changes warrant further investigation as they are often weaponized in lateral movement techniques.

  ### Blind Spots and Assumptions

  Detection of SID history modifications may not capture evasion techniques such as using legitimate administrative tools to manipulate SID history quietly. Organizations must ensure proper logging configurations are enabled for all relevant security events to maintain visibility. Legitimate migrations and changes during domain restructuring may trigger this alert, leading to false positives. Companion detections include monitoring for numerous logon attempts (Event ID 4624) after SID history changes, which can further strengthen detection capabilities.

