logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    TicketEncryptionType: '0x17'
    ServiceName: 'krbtgt'
    PreAuthType: 0
  condition: selection
falsepositives:
- Legacy systems or applications that legitimately use RC4 encryption
- Misconfigured accounts with pre-authentication disabled
level: medium
note: |
  ### Technical Context

  This rule detects suspicious Kerberos Ticket Granting Ticket (TGT) requests where pre-authentication is disabled, indicating potential AS-REP Roasting attempts. Attackers aim to retrieve AS-REP messages for accounts that do not require pre-authentication, allowing them to decrypt the tickets offline and potentially recover user passwords. This behavior falls under the MITRE ATT&CK technique "AS-REP Roasting" (T1558.004), where adversaries exploit weak configurations in Active Directory environments.

  The primary telemetry source is Windows Security logs, specifically Event ID 4768, which details TGT requests. If malicious, this behavior may lead to credential theft and unauthorized access. Importantly, it is critical to note that this detection does NOT confirm that the attacker has indeed successfully cracked passwords; it merely indicates potentially risky behavior.

  ### Investigation Steps

  - **Examine Event ID 4768 for anomalies**: Look for Kerberos TGT requests with `PreAuthType` set to `0` and `TicketEncryptionType` of `0x17`. Take note of the `TargetUserName` field to identify accounts being queried. Validation against expected account configurations (pre-authentication requirements) is crucial.

  - **Identify accounts with pre-authentication disabled**: Check Active Directory configurations for accounts that do not require pre-authentication. Account types like service accounts or legacy accounts may be legitimate; however, unusual accounts without this requirement could pose a risk.

  - **Correlate with account behavior**: Look through logs for account login activity (Security Event IDs 4624 and 4625) associated with the identified accounts. Legitimate accounts will demonstrate regular access patterns, while spikes in account requests may indicate suspicious activity.

  - **Assess ticket encryption methods**: Determine if the use of RC4 (Ticket Encryption Type 0x17) is part of normal operations within your domain by referencing logs or confirmation from system administrators. Many organizations now enforce stronger encryption types like AES, making the use of RC4 suspicious.

  - **Cross-reference legacy system usage**: Identify any legitimate systems or applications that require RC4 encryption and document their configurations. Validate whether these systems are known entities within your environment and have been properly configured.

  ### Prioritization

  This alert merits a medium severity rating due to the potential impact on user credentials and the likelihood of exploitation through AS-REP Roasting. If successful, it could lead to unauthorized access or lateral movement within the network. This behavior is recognized as a tactic commonly weaponized by attackers targeting Active Directory environments.

  ### Blind Spots and Assumptions

  Detection may be less effective if legacy systems or misconfigured accounts frequently trigger alerts, leading to potential false positives. Logging must be enabled for all relevant Windows Security events to maintain reliable detection capabilities. Additionally, legitimate use cases for specific accounts or legacy systems might trigger this detection. A companion detection would include monitoring for failed password attempts (Event ID 4771) following TGT requests, which could indicate further malicious activity targeting the same accounts.

