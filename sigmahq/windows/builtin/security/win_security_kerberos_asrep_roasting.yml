logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    TicketEncryptionType: '0x17'
    ServiceName: 'krbtgt'
    PreAuthType: 0
  condition: selection
falsepositives:
- Legacy systems or applications that legitimately use RC4 encryption
- Misconfigured accounts with pre-authentication disabled
level: medium
note: |
  ### Technical Context
  This rule detects potential AS-REP Roasting attacks targeting Kerberos tickets in a Windows environment. Specifically, it identifies requests for Ticket-Granting Tickets (TGTs) that have pre-authentication disabled, as indicated by a Pre-Authentication Type of 0. The Ticket Encryption Type of 0x17, which corresponds to RC4-HMAC, further reinforces the possibility of an AS-REP Roasting scenario where an attacker requests AS-REP messages for user accounts that do not require pre-authentication. The attacker's objective is to capture and later crack these encrypted tickets offline to obtain sensitive user passwords.

  In this context, the relevant MITRE ATT&CK techniques include **T1558.004: AS-REP Roasting**, which fall under the tactics of **Credential Access**. Attackers leveraging this technique are typically attempting to gain unauthorized access to network resources by obtaining valid user credentials, often targeting high-privilege accounts that could lead to further network exploitation.

  Primary data sources for detecting this activity include Windows security event logs, specifically focusing on Kerberos authentication events (Event ID 4768), which provide critical insights into TGT requests. Additional information may be gleaned from Active Directory logs and Kerberos ticket-granting service (TGS) traffic.

  ### Investigation Steps
  - **Review Windows Security Event Logs:** Look for Event ID 4768 to identify Kerberos TGT requests associated with pre-authentication disabled and RC4-HMAC encryption.
  - **Analyze Account Configurations:** Check the settings of the affected accounts for pre-authentication requirements. Identify any high-privilege or service accounts that lack this protection.
  - **Track Successful Logins:** Correlate alerting events with successful login attempts using the compromised credentials. Investigate unusual access patterns or privilege escalations linked to these accounts.
  - **Investigate Legacy Systems:** Confirm whether any legacy systems or application configurations are responsibly using RC4 encryption, potentially explaining the legitimate occurrences of alerts.

  ### Prioritization
  The severity of this alert is medium, as AS-REP Roasting can lead to significant security breaches, particularly when it involves high-privilege accounts. Given the likelihood of encountering misconfigured accounts combined with an attacker’s persistence, timely investigation is crucial to mitigate potential risks.

  ### Blind Spots and Assumptions
  This detection logic may miss activities due to the presence of legitimate systems that require pre-authentication to be disabled or that utilize RC4 encryption. It assumes that the environments being monitored do not have a valid reason to have TGT requests with these specific configurations. Additionally, the alert relies on the proper logging configurations for Windows security events and may not function correctly if such logs are not enabled or maintained consistently across the enterprise environment.

