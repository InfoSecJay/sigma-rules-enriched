note: |
  ### Technical Context
  This rule detects unauthorized attempts to extract the Data Protection API (DPAPI) domain backup key from Active Directory Domain Controllers. This key is crucial for decrypting user secrets and credentials, which makes it a prime target for attackers aiming to gain unauthorized access to sensitive information. The extraction of the DPAPI backup key usually indicates that an adversary is exploiting vulnerabilities within the environment to facilitate lateral movement or further credential theft.

  The primary objective of this behavior is likely to harvest credentials or sensitive data that can be used to escalate privileges within a domain. This attack aligns with the MITRE ATT&CK framework under the following tactics and techniques: **Credential Access** (TA1203) and **T1003.004: Credential Dumping: LSASS Memory**. Attackers may utilize tools such as Mimikatz or similar utilities to execute this extraction.

  Key data sources for hunting these events include **Windows Security Event Logs** where specific event IDs related to object access can be filtered, particularly focusing on Event ID 4662. Monitoring these logs helps identify any abnormal access patterns or unauthorized account activities on critical domain resources.

  ### Investigation Steps
  - **Review Security Event Logs**: Look for Event ID 4662 in the Security Event Log on Domain Controllers, focusing on entries where the ObjectType is 'SecretObject' and the ObjectName contains 'BCKUPKEY'.

  - **Analyze Access Patterns**: Investigate the access mask and identify the user accounts that attempted to retrieve the backup key. Validate whether these activities align with normal operational behavior.

  - **Identify Compromised Accounts**: Cross-reference suspicious access events against user account activity logs to determine if there are any indications of compromised accounts or abnormal login times/locations.

  - **Conduct Environment Audits**: Perform audits on the domain to identify any configurations that may allow unauthorized access to LSA secrets and review the effectiveness of existing security controls in place.

  ### Prioritization
  Given the high severity level of this alert, it is critical to respond promptly as the extraction of the DPAPI domain backup key can lead to widespread credential theft and potential domain compromise. The combination of the sensitive nature of the data and the capabilities it grants attackers underscores the importance of rapid investigation and remediation.

  ### Blind Spots and Assumptions
  This detection rule may have gaps if certain logs are not being monitored or if the environment lacks adequate logging configurations on Domain Controllers. An assumption made is that the attacker will not employ obfuscation techniques to hide their activities, which may lead to missed detections. Additionally, the effectiveness of the rule relies on correct logging settings; without proper configurations, such as enabling object access audits, the detection will not function as intended.

