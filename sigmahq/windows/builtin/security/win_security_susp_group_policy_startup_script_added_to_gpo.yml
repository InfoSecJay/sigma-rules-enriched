title: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
status: test
description: |
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon script to users or computer objects.
references:
- https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
author: Elastic, Josh Nickels, Marius Rothenbücher
date: 2024-09-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
- attack.t1484.001
- attack.t1547
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_eventid:
    EventID:
    - 5136
    - 5145
  selection_attributes_main:
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains: '42B5FAAE-6536-11D2-AE5A-0000F87571E3'
  selection_attributes_optional:
    AttributeValue|contains:
    - '40B6664F-4972-11D1-A7CA-0000F87571E3'
    - '40B66650-4972-11D1-A7CA-0000F87571E3'
  selection_share:
    ShareName|endswith: '\SYSVOL'
    RelativeTargetName|endswith:
    - '\scripts.ini'
    - '\psscripts.ini'
    AccessList|contains: '%%4417'
  condition: selection_eventid and (all of selection_attributes_* or 
    selection_share)
falsepositives:
- Legitimate execution by system administrators.
level: medium
note: |
  ### Technical Context

  This rule detects modifications to Group Policy Objects (GPOs) that introduce startup or logon scripts for user or computer objects, specifically looking for changes to attributes that indicate the addition of such scripts. The likely attacker objective is to establish persistence on a compromised system, executing malicious code at user logon. This behavior relates to the MITRE ATT&CK tactics of Persistence (T1547) and Privilege Escalation (T1484.001).

  The primary telemetry sources include Windows Security Auditing logs, specifically Event IDs 5136 (Directory Service Changes) and 5145 (File Share Access). The potential security impact is significant; malicious logon scripts could facilitate data exfiltration or create backdoors. However, this detection does NOT confirm that the change is malicious on its own—legitimate administrative actions can result in similar GPO modifications.

  ### Investigation Steps

  - **Review Event ID 5136:** Check logs for Event ID 5136 in the Security Event log. Look for changes to the 'gPCMachineExtensionNames' or 'gPCUserExtensionNames' attributes that include the identifiers '42B5FAAE-6536-11D2-AE5A-0000F87571E3'. Compare timestamps with known maintenance windows for legitimate admin changes.

  - **Examine Event ID 5145:** Investigate Event ID 5145 logs for access to the '\SYSVOL' share. Verify user accounts making the changes; expected behavior includes changes made by domain administrators, typically during business hours.

  - **Analyze Share Name Changes:** Check for modifications where the ShareName ends with '\SYSVOL' and the RelativeTargetName includes '\scripts.ini' or '\psscripts.ini'. Any additions of unexpected scripts should be flagged for further analysis.

  - **Identify Malicious Indicators:** Flag any changes that include access list entries with '%%4417', indicating a write-access modification to a crucial resource. If detected outside of expected admin activity, correlate with other suspicious behaviors.

  - **Validate Expected Behavior:** Cross-reference GPO changes with documented organizational practices. Legitimate changes would typically involve defined standard operating procedures (SOP) by IT staff and are generally logged with appropriate justifications.

  - **Assess Organizational Asset Impact:** Determine the role of the affected object (user or computer) and its criticality. Modifications on high-privilege accounts or key infrastructure components pose a more significant risk.

  ### Prioritization

  This alert is of medium severity. If malicious, it can compromise user environments and create long-term access for adversaries. The likelihood of abuse is elevated given that this technique is weaponized in various attack frameworks, particularly in organizations with inadequate GPO monitoring.

  ### Blind Spots and Assumptions

  Detection may be limited by potential logging gaps if auditing policies are not correctly configured or if relevant logs are overwritten. Administrative changes for legitimate purposes may inadvertently trigger this alert, complicating investigations. A related detection to consider is monitoring for unusual process creation from scripts associated with these changes, such as via Sysmon (Event ID 1) or PowerShell logging (Event IDs 4103, 4104).

