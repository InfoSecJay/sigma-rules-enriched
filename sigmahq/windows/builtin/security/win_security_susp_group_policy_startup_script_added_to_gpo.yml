title: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
status: test
description: |
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon script to users or computer objects.
references:
- https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
author: Elastic, Josh Nickels, Marius Rothenbücher
date: 2024-09-06
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1484.001
- attack.t1547
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_eventid:
    EventID:
    - 5136
    - 5145
  selection_attributes_main:
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains: '42B5FAAE-6536-11D2-AE5A-0000F87571E3'
  selection_attributes_optional:
    AttributeValue|contains:
    - '40B6664F-4972-11D1-A7CA-0000F87571E3'
    - '40B66650-4972-11D1-A7CA-0000F87571E3'
  selection_share:
    ShareName|endswith: '\SYSVOL'
    RelativeTargetName|endswith:
    - '\scripts.ini'
    - '\psscripts.ini'
    AccessList|contains: '%%4417'
  condition: selection_eventid and (all of selection_attributes_* or 
    selection_share)
falsepositives:
- Legitimate execution by system administrators.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the modification of Group Policy Objects (GPO) to add startup or logon scripts for user or computer objects. The likely attacker objective may include establishing persistence within the environment, allowing execution of malicious scripts during user logon. This behavior aligns with MITRE ATT&CK tactics such as Persistence (TA0003), specifically the technique "Create or Modify System Process: Windows Service" (T1547) and "Group Policy Modification" (T1484.001).

  The primary telemetry sources are Windows Security Event logs, particularly Event IDs 5136 (Directory Service Changes) and 5145 (File Share Access). If malicious, this modification can lead to unauthorized execution of code or scripts that may facilitate further exploitation or lateral movement. Importantly, this detection does NOT confirm the intent behind the modification; it indicates only that a change was made to GPOs.

  ### Investigation Steps

  - **Check Event IDs 5136 and 5145 for changes:** Review security logs for Event ID 5136, which indicates modifications to GPOs, and Event ID 5145 for access to the SYSVOL share. Look for changes aligned with the attributes containing 'gPCMachineExtensionNames' or 'gPCUserExtensionNames'.

  - **Evaluate the script path and file names:** Analyze the given share name ending with `\SYSVOL`, and confirm associated file paths for scripts in GPOs, specifically those containing 'scripts.ini' or 'psscripts.ini'. Confirm legitimacy based on known administrator practices.

  - **Identify who modified the GPO:** Look at the `securityIdentifier` field in Event ID 5136. Cross-reference this with user roles to ascertain whether the modification was made by authorized system administrators or potentially by an unauthorized user.

  - **Verify context of the modification:** Consider the time of the modification. Legitimate changes are often documented in a change management system. If this modification coincides with unusual user activity, more investigation is warranted.

  - **Review access list for unauthorized changes:** Investigate the modification’s access list for occurrence of '%%4417', which would indicate an unauthorized script execution privilege. Validate that those listed possess the necessary permissions.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for an attacker to exploit it for persistent access. The impact depends on the criticality of the affected systems, particularly if they are domain controllers or user environment configurations. This technique is weaponized in various environments, making it essential to assess potential malicious intentions behind the change.

  ### Blind Spots and Assumptions

  Detection relies on the comprehensive configuration of Windows auditing to capture all relevant modifications. If auditing settings for GPO changes are disabled, this will limit detection efficacy. Legitimate administrative changes may frequently trigger this alert; therefore, contextual investigation is essential. Companion detections would include monitoring for unusual file creating or modifying activities in SYSVOL that further correlates with GPO modifications, reinforcing comprehensive monitoring.

