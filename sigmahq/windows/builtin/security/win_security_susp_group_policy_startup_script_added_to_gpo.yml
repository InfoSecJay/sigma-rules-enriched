title: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
status: test
description: |
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon script to users or computer objects.
references:
- https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
author: Elastic, Josh Nickels, Marius Rothenbücher
date: 2024-09-06
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1484.001
- attack.t1547
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_eventid:
    EventID:
    - 5136
    - 5145
  selection_attributes_main:
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains: '42B5FAAE-6536-11D2-AE5A-0000F87571E3'
  selection_attributes_optional:
    AttributeValue|contains:
    - '40B6664F-4972-11D1-A7CA-0000F87571E3'
    - '40B66650-4972-11D1-A7CA-0000F87571E3'
  selection_share:
    ShareName|endswith: '\SYSVOL'
    RelativeTargetName|endswith:
    - '\scripts.ini'
    - '\psscripts.ini'
    AccessList|contains: '%%4417'
  condition: selection_eventid and (all of selection_attributes_* or selection_share)
falsepositives:
- Legitimate execution by system administrators.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects modifications to Group Policy Objects (GPO) where a startup or logon script is added for users or computer objects. The likely attacker objective is to execute malicious scripts during system startup or user logon, enabling persistence and potential privilege escalation. This behavior maps to the MITRE ATT&CK tactics of Persistence (T1547) and Defense Evasion (T1484.001). The primary telemetry sources include Windows Security logs, specifically Event ID 5136 (directory service modifications) and Event ID 5145 (file share access). If malicious, the impact could be severe as it allows the execution of arbitrary scripts, altering security postures, and potentially compromising sensitive data or credentials. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can also result in similar alerts.

  ---

  ### Investigation Steps

  - **Review Event IDs 5136 and 5145:** Check for recent events logged under Event ID 5136 that correspond to adding a startup/logon script in a GPO, specifically looking for gPCMachineExtensionNames or gPCUserExtensionNames attributes.
  - **Validate attributes:** Examine the AttributeValue field for specific GUIDs associated with logon scripts ('42B5FAAE-6536-11D2-AE5A-0000F87571E3' for startup and '40B6664F-4972-11D1-A7CA-0000F87571E3' for user scripts). Look for unauthorized modifications indicative of adversary activity.
  - **Analyze Share Access:** Review Event ID 5145 for file access to '\SYSVOL' shares that indicate script execution permissions. Benign events will generally be associated with standard administrative activity or legitimate path access.
  - **Identify Legitimate Administrative Tasks:** Verify if the detected modifications align with scheduled maintenance by system administrators, cross-referencing with changes in helpdesk tickets or maintenance logs.
  - **Correlate the Malware Indicators:** Check if scripts referenced in the GPO modification bear any signatures or hashes from security threat feeds, as they can indicate high-confidence malicious indicators.
  - **Assess Host Roles:** Consider the criticality of the affected hosts, particularly whether they serve as domain controllers or manage sensitive data, as exploitation could lead to extensive permissions and elevated access.

  ---

  ### Prioritization

  In an enterprise context, alerts based on this detection should be considered medium severity due to the potential impact on system integrity and user trust. There is a moderate likelihood of malicious intent, as this method is commonly weaponized for persistence during an attack, especially in enterprise environments.

  ---

  ### Blind Spots and Assumptions

  This detection may miss modifications from legitimate administrative actions that can trigger false positives, such as expected GPO changes during regular maintenance. It assumes that adequate auditing configurations are in place to capture object access, specifically around GPO modifications. Related detections that can bolster coverage include monitoring for unusual access patterns to SYSVOL or modification of user rights assignments in GPO.

