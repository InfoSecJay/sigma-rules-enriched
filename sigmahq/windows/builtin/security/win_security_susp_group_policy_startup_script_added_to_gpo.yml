title: Startup/Logon Script Added to Group Policy Object
id: 123e4e6d-b123-48f8-b261-7214938acaf0
status: test
description: |
  Detects the modification of Group Policy Objects (GPO) to add a startup/logon script to users or computer objects.
references:
- https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
author: Elastic, Josh Nickels, Marius Rothenbücher
date: 2024-09-06
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1484.001
- attack.t1547
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_eventid:
    EventID:
    - 5136
    - 5145
  selection_attributes_main:
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains: '42B5FAAE-6536-11D2-AE5A-0000F87571E3'
  selection_attributes_optional:
    AttributeValue|contains:
    - '40B6664F-4972-11D1-A7CA-0000F87571E3'
    - '40B66650-4972-11D1-A7CA-0000F87571E3'
  selection_share:
    ShareName|endswith: '\SYSVOL'
    RelativeTargetName|endswith:
    - '\scripts.ini'
    - '\psscripts.ini'
    AccessList|contains: '%%4417'
  condition: selection_eventid and (all of selection_attributes_* or selection_share)
falsepositives:
- Legitimate execution by system administrators.
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to Group Policy Objects (GPOs) that introduce startup or logon scripts for user or computer objects. It is often employed by attackers to establish persistence within a compromised environment, allowing them to execute malicious scripts each time a user logs on or a system starts. These activities can enable further exploitation, credential theft, or access to sensitive data.

  The likely attacker objective in this scenario is to maintain a foothold in the network while evading detection, aligning with the MITRE ATT&CK techniques of **Persistence (T1547)** and **Group Policy Modification (T1484.001)**. Altering GPOs can grant attackers ongoing control over various systems and users, allowing them to carry out additional malicious activities undetected.

  Primary data sources for this detection include Windows security logs that record events pertaining to GPO modifications. Specifically, events with IDs **5136** (for GPO modifications) and **5145** (for access to file shares) are crucial for tracing these activities. The rule relies on the advanced audit policy setting, "Object Access > Audit Detailed File Share," which must be configured for effective monitoring.

  ### Investigation Steps
  - **Review GPO Modification Logs**: Collect and analyze Windows security logs for Events 5136 and 5145. Focus on identifying modifications related to startup/logon scripts, specifically monitoring the attributes that indicate script additions.

  - **Check LDAP Query Logs**: Investigate LDAP bind/query logs for signs of unusual access patterns or changes made to GPOs, particularly any unusual administrative accounts that could indicate a breach.

  - **Analyze access to SYSVOL Shares**: Examine the access logs for the SYSVOL share to identify unauthorized or suspicious access to script files like `scripts.ini` or `psscripts.ini`, which can indicate potential exploitation.

  - **Assess Group Policy Object Configuration**: Review the configured GPOs to ensure that the modifications align with your organization’s policies, verifying that only legitimate changes by system administrators are reflected.

  ### Prioritization
  This alert should be considered medium severity due to its potential impact on enterprise security. While not every modification to GPOs implies malicious intent, unauthorized changes could lead to persistence mechanisms being established, which can significantly affect the security posture of the organization.

  ### Blind Spots and Assumptions
  One significant blind spot is the reliance on proper audit policies being enabled across all relevant systems. If the "Object Access > Audit Detailed File Share" setting is not correctly configured, this detection will be ineffective. The detection logic assumes that the typical behavior of legitimate system administrators will not generate excessive false positives; however, there is a risk that scheduled updates and legitimate administrative actions could trigger alerts. Regular reviews of audit logs and configurations are necessary to maintain effective monitoring.

