logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5156
    DestPort: 88
  filter_main_lsass:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith: '\Windows\System32\lsass.exe'
  filter_optional_chrome:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - '\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - '\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tomcat:
    Application|endswith: '\tomcat\bin\tomcat8.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Web Browsers and third party application might generate similar activity. An initial
  baseline is required.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects uncommon outbound network activity over Kerberos (TCP port 88), specifically when invoked by processes not typically associated with legitimate Kerberos requests. This behavior can indicate lateral movement attempts or initial stages of privilege escalation via delegation (T1558.003). The primary telemetry source is Security Event ID 5156, which logs outbound network connections, particularly those possibly misused by attackers to authenticate against other systems within the network.

  If successfully executed, such activity poses a significant risk, as it may allow unauthorized access to sensitive systems and data, often marking the early stages of a breach. However, this detection does NOT confirm malicious intent on its own; authorized applications (like web browsers) may generate Kerberos traffic under certain conditions.

  ---

  ### Investigation Steps

  - **Examine Event ID 5156 logs:** Review security logs for Event ID 5156 to identify unexpected outbound connections on port 88. Focus on `Application` field values indicating non-standard processes, such as those originating from `C:\Windows\System32\lsass.exe` in unauthorized contexts.

  - **Identify legitimate applications:** Compare the logged applications against a baseline of expected application behavior. Typical legitimate Kerberos requests should originate from system services (e.g., `lsass.exe`) and not user-level applications like web browsers or unrecognized executables.

  - **Check network connection details:** Review relevant logs to inspect the destination IP addresses of the Kerberos requests. Look for connections to uncommon or external IPs which may signify unauthorized access attempts.

  - **Verify process integrity:** Assess the process tree and execution paths of the applications that triggered the alert. Use Sysmon Event ID 1 to check for unusual parent-child relationships or paths that don't align with common usage based on your baseline.

  - **Assess overall system impact:** Determine the role and criticality of the affected system. If it hosts sensitive data or applications, escalate the investigation accordingly.

  ---

  ### Prioritization

  This alert is medium in severity due to the potential impact of unauthorized access and lateral movement. While uncommon connections via Kerberos can be indicative of malicious activity, they also occur during legitimate network operations, necessitating careful analysis to discern intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications that also make outbound Kerberos requests, leading to false positives. Ensure comprehensive logging configurations across Windows systems to capture all necessary events. Also, consider related alerts for unusual Kerberos ticket requests (T1558.003) as they can complement this detection by providing additional context on authentication anomalies.

