title: Uncommon Outbound Kerberos Connection - Security
id: eca91c7c-9214-47b9-b4c5-cb1d7e4f2350
related:
- id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
  type: similar
status: test
description: |
  Detects uncommon outbound network activity via Kerberos default port indicating possible lateral movement or first stage PrivEsc via delegation.
references:
- https://github.com/GhostPack/Rubeus
author: Ilyas Ochkov, oscd.community
date: 2019-10-24
modified: 2024-03-15
tags:
- attack.lateral-movement
- attack.credential-access
- attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5156
    DestPort: 88
  filter_main_lsass:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith: '\Windows\System32\lsass.exe'
  filter_optional_chrome:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - '\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - '\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tomcat:
    Application|endswith: '\tomcat\bin\tomcat8.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Web Browsers and third party application might generate similar activity. An 
  initial baseline is required.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unusual outbound Kerberos connections on the default port (88), which may indicate unauthorized lateral movement or initial privilege escalation attempts through delegated credentials. The likely attacker objective is to exploit Kerberos ticket-granting systems, facilitating access to sensitive resources or accounts without user interaction. It maps to the MITRE ATT&CK technique for Credential Access (T1558.003) and Lateral Movement (TA0008).

  Primary telemetry sources are Windows Security logs, specifically focusing on Event ID 5156, which logs filtered connection-related events. The security impact can be significant if these events indicate an unauthorized user attempting to hijack session tokens or access sensitive data. However, this detection does NOT confirm malicious intent on its own as similar activity may originate from legitimate applications or services.

  ### Investigation Steps

  - **Check outbound connection logs:** Review Event ID 5156 for connections to external IPs on port 88. Identify any unconventional source hosts or destinations that are not part of the standard network behavior.

  - **Identify legitimate Kerberos usage:** Determine if any identified hosts are known Kerberos clients or services (e.g., domain controllers). Verify that these hosts are not generating traffic to unexpected external addresses on port 88.

  - **Analyze the application context:** Examine the `Application` field in Event ID 5156. Verify if `lsass.exe` is initiating outbound connections; if it's not a known pattern, consider it potentially malicious. Legitimate traffic from browsers (Chrome/Firefox) or other applications should be accounted for.

  - **Check for exploited privileges:** Investigate the user accounts involved in these outbound connections. Validate that they are not service accounts or accounts commonly used for administrative function, as their misuse could indicate adversarial behavior.

  - **Cross-reference for alerts:** Utilize related detections that cover unusual account activity, such as unexpected use of administrative credentials or subsequent Kerberos ticket requests (see related rule ID e54979bd-c5f9-4d6c-967b-a04b19ac4c74).

  ### Prioritization

  This alert has medium severity due to the potential for exploitation of Kerberos credentials, which can lead to significant data breaches. The likelihood of abuse is notable, as attackers frequently leverage Kerberos for lateral movement. While not ubiquitous, specific exploit techniques against Kerberos are increasingly observed in the wild.

  ### Blind Spots and Assumptions

  Detection limitations include potential bypass techniques, such as the use of legitimate applications to create outbound connections that may trigger similar alerts. The configured security logs should capture all traffic for comprehensive monitoring; misconfigurations could lead to missed events. Additionally, normal administrative tasks or automated services might create similar traffic patterns that could generate false positives. Related detections, such as monitoring for abnormal Kerberos ticket requests, would enhance analytic accuracy.

