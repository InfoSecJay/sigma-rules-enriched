title: Uncommon Outbound Kerberos Connection - Security
id: eca91c7c-9214-47b9-b4c5-cb1d7e4f2350
related:
- id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
  type: similar
status: test
description: |
  Detects uncommon outbound network activity via Kerberos default port indicating possible lateral movement or first stage PrivEsc via delegation.
references:
- https://github.com/GhostPack/Rubeus
author: Ilyas Ochkov, oscd.community
date: 2019-10-24
modified: 2024-03-15
tags:
- attack.lateral-movement
- attack.credential-access
- attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5156
    DestPort: 88
  filter_main_lsass:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith: '\Windows\System32\lsass.exe'
  filter_optional_chrome:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - '\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Application|startswith:
    - '\device\harddiskvolume'
    - 'C:'
    Application|endswith:
    - '\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - '\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tomcat:
    Application|endswith: '\tomcat\bin\tomcat8.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Web Browsers and third party application might generate similar activity. An initial
  baseline is required.
level: medium
note: |
  ### Technical Context
  This rule detects uncommon outbound network activity through the Kerberos default port (88), which may indicate lateral movement or initial privilege escalation attempts using credential delegation. Attackers often exploit Kerberos for lateral movement in a network, using tools like Rubeus to manipulate Kerberos tickets or perform over-the-network actions on compromised accounts. By establishing outbound connections on port 88 without corresponding legitimate application activity, the detection rule aims to identify potential malicious behavior.

  The relevant MITRE ATT&CK tactics include **Lateral Movement (T1021)** and **Credential Access (T1558.003)**, specifically targeting methods of impersonation and ticket-granting ticket (TGT) manipulation in Kerberos environments. Common telemetry that provides insights into this activity includes Windows security event logs, specifically focusing on Event ID 5156 related to permitted connection attempts.

  ### Investigation Steps
  - **Review Security Event Logs**: Check for Event ID 5156 in the Windows security logs to identify potentially unauthorized outbound connections on port 88.
  - **Analyze Kerberos Ticket Usage**: Inspect ticket-granting ticket (TGT) usage patterns through Kerberos logs. Look for anomalies in ticket requests or unusual service principal names (SPNs).
  - **Correlate with Known Good Activity**: Compare the detected outbound traffic against established baselines for normal Kerberos activity within your environment to discern legitimate usage from anomalies.
  - **Investigate Related Processes**: Examine running processes to identify unauthorized usage of lsass.exe or other processes that may initiate unauthorized Kerberos connections to ensure they stem from legitimate applications.

  ### Prioritization
  This alert is of medium severity due to the potential for serious consequences arising from lateral movement activities, which can lead to further compromise of sensitive systems or data. Given the likelihood of attackers exploiting common services such as Kerberos for privilege escalation, it is crucial to assess the context surrounding the detected activity promptly.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate outbound Kerberos traffic generated by approved applications or in benign contexts, particularly if baseline behaviors are not well established. There is also an assumption that logging for Event ID 5156 is enabled and properly configured across endpoint devices. If logs are missing or if applications generate similar traffic, false positives may occur, underscoring the importance of thorough baseline analysis for application behavior in the environment.

