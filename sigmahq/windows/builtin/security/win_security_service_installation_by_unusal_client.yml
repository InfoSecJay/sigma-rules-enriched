note: |
  ### Technical Context

  This rule detects the installation of a Windows service by a client process with a Process ID (PID) of 0 or a parent process that also has a PID of 0. This behavior is suspicious because typical service installations are executed by legitimate processes associated with system components, user applications, or properly authorized scripts. An attacker might aim to establish persistence on compromised machines by installing malicious services. Relevant MITRE ATT&CK tactics include Persistence (T1543) and Privilege Escalation. The primary telemetry sources include Windows Security logs, specifically Event ID 4697. If malicious, the impact could be severe as it may indicate unauthorized changes to system configurations that can lead to prolonged access. However, this detection does NOT confirm intentional malicious behavior without further corroborating evidence.

  ### Investigation Steps

  - **Review Event ID 4697 Details**: Check Windows Security logs for Event ID 4697, specifically looking at the timestamp, ClientProcessId, and description for unusual values or services that shouldn’t be present.

  - **Identify the Service Name**: In the Event ID 4697 log details, note the service name being installed. Cross-reference it against known services to identify potential malicious services or known benign names.

  - **Examine Parent/Child Process Relationships**: Utilize Sysmon Event ID 1 to investigate the process tree where the service install initiated. Determine the first parent process and identify if it is a legitimate system process.

  - **Validate Normal Service Installation Behavior**: Review similar installations of services on the same host or similar hosts within your organization to establish a baseline of typical administrative activity.

  - **Check System Integrity**: Search for associated artifacts like file paths created (e.g., services created under "C:\Windows\System32\") to ensure no unexpected files have been created alongside the service installation.

  - **Analyze Contextual Information**: Gather context on the system's role, security updates, last known good configuration, and recent administrative activities surrounding the time of the alert to determine if there are legitimate explanations.

  ### Prioritization

  This alert should be treated with high priority due to the potential for severe impact on the affected system. The likelihood of malicious activity is elevated as this method of service installation is often weaponized by adversaries to maintain covert persistence in the environment.

  ### Blind Spots and Assumptions

  Detection is limited if the required logging for Event ID 4697 is not properly configured. Legitimate administrative tools or tasks may trigger this alert, particularly during software deployments or updates. Additionally, some adversaries might use methods to avoid detection, such as standard user processes or legitimate applications to install services. A companion detection rule monitoring for unusual process creation (Event ID 4688) could provide additional visibility into potential malicious activity.

