note: |
  ### Technical Context

  This rule detects potential tampering with the Sysmon event logging configuration, specifically targeting the disabling or modification of Sysmon’s operational channels. Attackers may manipulate these settings to hide their activities, achieve persistence, or evade detection mechanisms. This behavior aligns with the MITRE ATT&CK technique for "Indicator Removal on Host" (T1112).

  The primary telemetry sources for this detection are Windows Security Event Logs, capturing Event ID 4657 (which indicates changes to registry values) and Event ID 4663 (which logs access to objects). If malicious, this could severely impair incident response and detection capabilities. However, this alert on its own does not confirm that malicious activity is occurring; it only indicates that changes were made to Sysmon settings that require further investigation.

  ### Investigation Steps

  - **Identify the altered Sysmon channel settings:**
    Review the Event ID 4657 logs for changes related to 'WINEVT\Channels\Microsoft-Windows-Sysmon/Operational' where the NewValue equals 0. Trace who performed the action and when, correlating with user activity around that time.

  - **Examine the access attempts to Sysmon settings:**
    Analyze Event ID 4663 logs for access to 'WINEVT\Publishers\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}' to determine the account responsible for the attempts. A legitimate access pattern typically involves system administrators making authorized configuration adjustments.

  - **Investigate the involved user accounts:**
    Cross-reference the accounts observed in the logs with your organization's user directory. Confirm whether the account is legitimate or if it has been compromised. Watch for unusual access times or locations that deviate from normal patterns.

  - **Check for additional suspicious activity:**
    Validate if other security events accompany the changes, such as process creations (Event ID 4688, Sysmon Event ID 1) for known tools like PowerShell or rundll32.exe executing commands that might be used for persistence or evasion.

  - **Review the Sysmon configuration and state:**
    Confirm if Sysmon is currently enabled (check current Sysmon settings) and if logging functions have been impacted. If Sysmon or its operational channels are disabled, remediate quickly to restore logging capabilities.

  - **Evaluate the severity of the impacted host:**
    Identify the role and criticality of the host in question. Servers hosting sensitive data or critical infrastructure should be prioritized for immediate review to ensure no further tampering has occurred.

  ### Prioritization

  This alert is high severity due to the potential for an attacker to disable a critical logging tool like Sysmon, which could hinder future detection of malicious activity. The likelihood of abuse is significant, as attackers frequently utilize these techniques to operate stealthily. The behavior is often weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as using legitimate admin accounts to make the changes and thus impersonating trusted personnel. Ensure all Windows Security Event logs are configured and collected properly for reliable detection coverage. Legitimate administrative activities, such as updates or reconfigurations, may falsely trigger this alert. Complement this detection with monitoring for anomalous PowerShell executions to enhance detection capabilities.

