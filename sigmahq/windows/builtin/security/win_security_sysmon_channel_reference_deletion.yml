  ### Technical Context

  This Sigma rule detects potential tampering with Sysmon's configuration, specifically targeting the deletion of the Sysmon channel reference in Windows Event Logs. Such actions often indicate an attacker’s objective to disable Sysmon, thus hindering detection efforts related to their malicious activities. This aligns with the MITRE ATT&CK framework under the tactics of "Persistence" and "Defense Evasion," specifically techniques T1112 (Modify Registry) and T1562 (Impair Protection Mechanism).

  The primary telemetry sources include Windows Security Event Logs, specifically Event IDs 4657 and 4663, which capture modifications to Sysmon’s operation settings. If malicious, this could severely impact the organization's ability to detect ongoing attacks or maintain visibility into system activities. It's crucial to clarify that this detection does NOT confirm malicious intent on its own; benign applications or administrators may also change Sysmon settings.

  ### Investigation Steps

  - **Review Event ID 4657 logs:** Examine for alerts related to Sysmon’s channel reference (ObjectName contains ‘WINEVT\Channels\Microsoft-Windows-Sysmon/Operational’). Benign changes may include updates performed by authorized personnel or expected maintenance activities.

  - **Analyze Event ID 4663 logs:** Check for access to Sysmon's registry settings (AccessMask: '0x10000'). Look for unusual accounts or automated processes manipulating these settings; a high-confidence malicious indicator would include access from non-administrative user accounts.

  - **Correlate with authorized change management:** Verify if recent changes align with documented procedures or known maintenance schedules. Unexpected modifications in high-privileged environments may indicate potential malicious activity.

  - **Inspect Sysmon logging settings:** Validate current configurations of Sysmon using Sysmon configuration files. If Sysmon logging is found disabled or altered without legitimate reasons, raise the alert for further investigation.

  - **Examine system role implications:** Assess the role of the affected system; critical assets should maintain strict Sysmon monitoring. Changes on servers or endpoints that are critical for operations are particularly concerning and warrant heightened scrutiny.

  - **Cross-reference with previous alerts:** Identify if there are prior alerts regarding suspicious activities from the same user or device, which might indicate a broader attack strategy.

  ### Prioritization

  This alert is of high severity due to its association with the potential obstruction of visibility into malicious activities. Systems with Sysmon disabled are significantly exposed, and such behavior is commonly exploited by attackers to evade detection. Given the strategic implications, immediate triage is necessary.

  ### Blind Spots and Assumptions

  Detection may be limited if event logging settings are misconfigured, leading to missed alerts. Certain legitimate activities, such as authorized Sysmon configuration updates or scheduled maintenance, may trigger this alert, complicating assessments. Companion detections, such as reviewing alterations in system security policy settings (Event ID 4902), can enhance overall visibility and confirm potential adversary tactics.

