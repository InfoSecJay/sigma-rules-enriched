note: |
  ### Technical Context
  This detection rule identifies potential password dumping activities targeting the Local Security Authority Subsystem Service (LSASS) process on Windows systems. Specifically, it monitors for instances where a handle is opened on the LSASS process with an access mask indicating read permissions to the SAM (Security Account Manager) domain object. This behavior is characteristic of malicious actors utilizing tools or techniques to extract credential information for lateral movement or privilege escalation.

  The threat scenario typically involves attackers exploiting vulnerabilities to gain access to a victim system, followed by the use of credential dumping techniques to harvest sensitive account information stored within LSASS. This activity enables them to compromise additional accounts within the domain, potentially leading to further escalation of privileges and lateral movement across the network. This aligns with the MITRE ATT&CK framework under the following tactics and techniques: Credential Access (TA0006), specifically T1003.001 for "Credential Dumping: LSASS Memory."

  Primary data sources for effective detection include Windows security event logs, specifically Event ID 4656 that captures detailed information about object access attempts, as well as process creation events which can provide additional context on the invocations of lsass.exe.

  ### Investigation Steps
  - **Review Security Event Logs:** Check Windows Security logs for Event ID 4656 to identify any instances where there is access attempted on lsass.exe with the specified AccessMask and ObjectType.
  - **Extract Process Information:** Analyze recent processes created on the system to identify unusual or unauthorized processes running alongside or in relation to lsass.exe.
  - **Analyze User Activity Logs:** Conduct a review of user account activity around the time of the detected event, focusing on failed login attempts, account lockouts, or abnormal behavior patterns that could indicate a compromised user account.
  - **Correlate with EDR Alerts:** Utilize endpoint detection and response (EDR) tools to look for any indicators of malicious behavior or tools frequently associated with credential dumping, such as Mimikatz or similar utilities.

  ### Prioritization
  This alert is deemed high severity due to the significant risk it poses; successful credential dumping can lead to widespread compromise of user accounts and administrative privileges, greatly increasing an attacker’s foothold within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to environments where logging is insufficiently configured or where security event logs are not actively monitored. The detection logic assumes that the AccessMask and ObjectType are indicative of malicious intent when attached to lsass.exe and does not account for legitimate administrative activities. To optimize detection, it is crucial to ensure that security logging is enabled for process access attempts and that logs are centrally collected and analyzed for anomalous behavior.

