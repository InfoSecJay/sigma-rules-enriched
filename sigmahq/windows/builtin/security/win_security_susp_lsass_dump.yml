note: |
  ### Technical Context

  This Sigma rule detects attempts to access the LSASS (Local Security Authority Subsystem Service) process using specific access masks associated with credential dumping activities. The likely attacker objective is to steal user credentials stored in memory, enabling further unauthorized access to systems or services within the network. The relevant MITRE ATT&CK tactic is Credential Access (ID: TA0006), specifically the technique for Credential Dumping (ID: T1003.001). Primary telemetry sources include Windows Security Event logs, specifically Event ID 4656, which records access to objects in the security system. If malicious, such activity could lead to compromised user accounts and significant lateral movement within the enterprise. This detection does NOT confirm whether credentials were successfully dumped or used maliciously.

  ### Investigation Steps

  - **Check Event ID 4656:** Review Security Event ID 4656 logs for access to the LSASS process (`lsass.exe`) on critical systems, noting the time and source of the access. Legitimate processes should not frequently access LSASS in this manner.

  - **Identify Access Mask:** Look for logs where the `AccessMask` equals `0x705`. Malicious activity may indicate attempts to read or manipulate credential data, signifying a potential credential dumping attempt.

  - **Correlate Process Creation:** Check Sysmon Event ID 1 for recent process creations involving `lsass.exe`. Malicious incidents often exhibit unusual parent-child relationships or originate from non-standard processes like command shells.

  - **Assess User Context:** Verify the account executing the access. If the access is performed by service accounts or unknown users with no clear business justification, it raises suspicion.

  - **Review Related Activity:** Investigate any other events leading up to the suspicious access, especially around logon events (Event ID 4624) or account modifications (Event ID 4720). Cross-reference with lateral movement patterns.

  - **Note Legitimate Operations:** During investigations, document expected behavior, such as legitimate applications accessing LSASS as part of security auditing or monitoring tools, which may involve similar access.

  ### Prioritization

  This alert should be treated with high severity given that LSASS is a critical component for storing and managing credentials. The likelihood of malicious abuse is significant, as attackers frequently target LSASS for credential theft to facilitate attacks. The behavior is commonly weaponized in various threat actor methodologies.

  ### Blind Spots and Assumptions

  Detection may be limited by advanced evasion techniques, such as using legitimate processes or tools to access LSASS stealthily. Successful detection requires correctly configured Windows security auditing to ensure logs are captured. Legitimate applications, such as security tools or scripts, may generate similar access patterns. A related detection to consider is monitoring for abnormal login patterns or failed user credential attempts, which could provide context to potential credential theft.

