title: PetitPotam Suspicious Kerberos TGT Request
id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
status: test
description: |
  Detect suspicious Kerberos TGT requests.
  Once an attacer obtains a computer certificate by abusing Active Directory Certificate Services in combination with PetitPotam, the next step would be to leverage the certificate for malicious purposes.
  One way of doing this is to request a Kerberos Ticket Granting Ticket using a tool like Rubeus.
  This request will generate a 4768 event with some unusual fields depending on the environment.
  This analytic will require tuning, we recommend filtering Account_Name to the Domain Controller computer accounts.
references:
- https://github.com/topotam/PetitPotam
- https://isc.sans.edu/forums/diary/Active+Directory+Certificate+Services+ADCS+PKI+domain+admin+vulnerability/27668/
- https://github.com/splunk/security_content/blob/88d689fe8a055d8284337b9fad5d9152b42043db/detections/endpoint/petitpotam_suspicious_kerberos_tgt_request.yml
author: Mauricio Velazco, Michael Haag
date: 2021-09-02
modified: 2022-10-05
tags:
- attack.credential-access
- attack.t1187
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Account Logon > Kerberos Authentication
    Service" must be configured for Success/Failure'
detection:
  selection:
    EventID: 4768
    TargetUserName|endswith: '$'
    CertThumbprint|contains: '*'
  filter_local:
    IpAddress: '::1'
  filter_thumbprint:
    CertThumbprint: ''
  condition: selection and not 1 of filter_*
falsepositives:
- False positives are possible if the environment is using certificates for 
  authentication. We recommend filtering Account_Name to the Domain Controller 
  computer accounts.
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious Kerberos Ticket Granting Ticket (TGT) requests that may indicate abuse of Active Directory Certificate Services (ADCS) using the PetitPotam attack method. An attacker likely seeks to elevate privileges or gain lateral movement capabilities after exploiting vulnerabilities in ADCS, which allows them to obtain a rogue certificate and subsequently request a TGT using tools like Rubeus. The relevant MITRE ATT&CK tactic is Credential Access and technique is T1187.

  The primary telemetry source for this detection is Windows Security Event logs, specifically Event ID 4768, which records the Kerberos authentication requests. If this behavior is malicious, it could compromise sensitive resources or escalate privileges. However, this detection does NOT confirm that malicious activity is occurring on its own, as legitimate services may also request Kerberos tickets.

  ### Investigation Steps

  - **Verify Event 4768 Details**: Review Windows Security Event ID 4768 logs for suspicious TGT requests. Ensure that the `TargetUserName` ends with a '$' sign, indicating a computer account. Look for unusual `CertThumbprint` values in the logs.

  - **Correlate with recent Certificate Issuance**: Check for recent certificates issued by Active Directory Certificate Services, focusing on the `CertThumbprint` values associated with the suspicious TGT requests. Validate with Certificate Services logs and query for Certificate Requests in Event IDs 4871 or 4872.

  - **Assess Host Context**: Identify the affected Domain Controller and its role. Ensure it has a valid and expected operation. Refer to its assigned role in Active Directory, and assess if this machine typically processes TGT requests.

  - **Investigate Source IP**: Confirm the source IP address of the TGT request against expected ranges for controlled environments. Requests originating from unexpected sources (e.g., localhost IP '::1') may warrant deeper investigation for unauthorized internal actions.

  - **Establish Baseline Legitimate Behaviors**: Review typical patterns of TGT requests for the targeted Domain Controller. Base timing, frequency, and account usage patterns on legitimate administrator activities to identify deviations.

  - **Extract Lateral Movement Indicators**: Check for other potentially suspicious activity across systems, such as Event ID 4624 for logins or Event ID 4776 for credential validation attempts that could follow a TGT request. Confirm if they are tied to the same or other accounts.

  ### Prioritization

  This alert has a high severity due to the potential impact on the security posture of the Enterprise. The likelihood of malicious abuse is significant as PetitPotam is a well-known exploitation technique targeting Kerberos. This behavior is commonly weaponized for privilege escalation and lateral movement attacks, necessitating prompt investigative action.

  ### Blind Spots and Assumptions

  Legitimate certificate requests could falsely trigger alerts, particularly in environments utilizing certificates extensively for authentication. Detection may rely on correct configuration of the advanced audit policy; without proper logging in place, TGT requests may go undetected. Companion detections for lateral movement or elevation-of-privilege activities, such as monitoring Event ID 4672 (Special privileges assigned) could strengthen overall security visibility.

