title: PetitPotam Suspicious Kerberos TGT Request
id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
status: test
description: |
  Detect suspicious Kerberos TGT requests.
  Once an attacer obtains a computer certificate by abusing Active Directory Certificate Services in combination with PetitPotam, the next step would be to leverage the certificate for malicious purposes.
  One way of doing this is to request a Kerberos Ticket Granting Ticket using a tool like Rubeus.
  This request will generate a 4768 event with some unusual fields depending on the environment.
  This analytic will require tuning, we recommend filtering Account_Name to the Domain Controller computer accounts.
references:
- https://github.com/topotam/PetitPotam
- https://isc.sans.edu/forums/diary/Active+Directory+Certificate+Services+ADCS+PKI+domain+admin+vulnerability/27668/
- https://github.com/splunk/security_content/blob/88d689fe8a055d8284337b9fad5d9152b42043db/detections/endpoint/petitpotam_suspicious_kerberos_tgt_request.yml
author: Mauricio Velazco, Michael Haag
date: 2021-09-02
modified: 2022-10-05
tags:
- attack.credential-access
- attack.t1187
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Account Logon > Kerberos Authentication
    Service" must be configured for Success/Failure'
detection:
  selection:
    EventID: 4768
    TargetUserName|endswith: '$'
    CertThumbprint|contains: '*'
  filter_local:
    IpAddress: '::1'
  filter_thumbprint:
    CertThumbprint: ''
  condition: selection and not 1 of filter_*
falsepositives:
- False positives are possible if the environment is using certificates for authentication.
  We recommend filtering Account_Name to the Domain Controller computer accounts.
level: high
note: |
  ### Technical Context
  This rule detects suspicious requests for Kerberos Ticket Granting Tickets (TGT) that may be related to the PetitPotam attack vector. When an attacker successfully exploits Active Directory Certificate Services (ADCS) to obtain a computer certificate, they can leverage this certificate to manipulate Kerberos ticket requests, specifically using tools like Rubeus. Such requests can indicate an attempt to escalate privileges or gain unauthorized access to sensitive resources within an enterprise environment.

  The attacker’s objective is likely to compromise domain accounts, particularly those with elevated privileges, which allows them to move laterally within the network. This poses a significant risk, as it can lead to unauthorized access, data exfiltration, and the potential for further attacks within the organization. Relevant MITRE ATT&CK tactics for this behavior include "Credential Access" (TA-0006) and specifically the technique for "Use of Kerberos Tickets" (T1187).

  Key telemetry sources that will provide evidence for this rule include Windows Security Event logs, specifically Event ID 4768, which captures Kerberos authentication service requests. Additional context can be gathered from related logs around certificate issuance and management.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Security logs for Event ID 4768 related to TGT requests, filtering for Kerberos requests initiated from Domain Controller accounts. Focus on the `TargetUserName` and `CertThumbprint` fields.
  - **Analyze Certificates:** Investigate any newly issued certificates or changes to certificate templates in the Certificate Authority to identify potential unauthorized certificate issuance linked to the PetitPotam attack vector.
  - **Inspect Network Traffic:** Use network monitoring tools to analyze traffic for unusual requests to domain controllers that might indicate lateral movement or privilege escalation attempts.
  - **Correlate with User Behavior:** Review recent logins and administrative activities from accounts associated with the suspicious TGT requests to identify potential misuse or compromise.

  ### Prioritization
  The alert severity is high due to the critical nature of Kerberos TGT requests in maintaining the security of an Active Directory environment. Unauthorized access to TGTs can facilitate privilege escalation and lateral movement, significantly increasing the threat impact in an enterprise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the organization has legitimate certificate-based authentication in use, potentially leading to false positives if not properly filtered. The detection logic assumes that certificates will include thumbprints and will specifically target domain controllers, which may not encompass all scenarios. Furthermore, the auditing policies for Kerberos Authentication Services must be correctly configured to capture relevant Event ID 4768 logs for accurate detection.

