detection:
  selection:
    EventID: 4697
    ServiceFileName|contains:
    - 'pcap'
    - 'npcap'
    - 'npf'
    - 'nm3'
    - 'ndiscap'
    - 'nmnt'
    - 'windivert'
    - 'USBPcap'
    - 'pktmon'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of the Packet Capture (Pcap) driver on Windows systems, which is indicative of potential network monitoring or packet sniffing activities. An attacker may install these drivers to capture sensitive network information, potentially facilitating data exfiltration or credential harvesting. The relevant MITRE ATT&CK tactics and techniques include **Discovery (TA0007)** and **Credential Access (TA0006)**, specifically under **Network Sniffing (T1040)**.

  The primary telemetry source for this detection is Windows Security logs focusing on Event ID **4697**, which logs the installation of services. If the detected behavior is malicious, it could allow an adversary to eavesdrop on network traffic, leading to significant security impacts. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may use these drivers for network analysis.

  ### Investigation Steps

  - **Examine Event ID 4697 for Pcap drivers:** Look for Event ID 4697 in the Security logs (Windows Event Viewer → Security). The presence of service filenames containing "pcap," "npcap," or similar indicates the installation of packet capture drivers.
  - **Identify the user responsible for installation:** Cross-reference the user account associated with Event ID 4697. Compare against known accounts and their roles—administrative accounts performing changes should be scrutinized more closely.
  - **Check for prior related activities:** Investigate the system's logs for Event ID 4688 (Process Creation) for processes like "npcap.exe" or "Wireshark.exe" that may indicate further usage of the drivers. Legitimate use should correlate with authorized personnel engaging in network diagnostics.
  - **Assess uncommon network behaviors:** Analyze network traffic during and after the installation of the identified drivers. Look for anomalous connections or unusual packet captures originating from the affected host that deviate from normal operational patterns.
  - **Validate legitimate activity:** Look for documented use cases of Pcap drivers in the organization. If the installation aligns with known business functions or security testing phases, this can help clarify whether it's benign.
  - **Verify associated service operations:** Review the Service Control Manager logs for any corresponding start operations related to these drivers. Look for unusual service behaviors or configurations that could indicate misuse, such as services running with inappropriate permissions.

  ### Prioritization

  This alert is of **medium** severity in an enterprise context due to the potential for a high-impact data breach if malicious. While packet capture functionality is sometimes utilized for legitimate network monitoring, its misuse by adversaries makes it a concern. The likelihood of malicious abuse is elevated as these drivers are commonly weaponized for data exfiltration.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate software using Pcap drivers, which can lead to false positives. It is essential that security auditing for Event ID 4697 is enabled and configured properly across all endpoints. Additionally, standard network diagnostic tools may trigger alerts, and the environment’s network visibility may mask some malicious capture activities. For enhanced coverage, consider monitoring for unusual outbound connections or related alerts, such as those indicating suspicious use of network monitoring tools (e.g., excessive ARP requests or enhanced NMAP scans).

