logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection:
    EventID: 4697
    ServiceFileName|contains:
    - 'pcap'
    - 'npcap'
    - 'npf'
    - 'nm3'
    - 'ndiscap'
    - 'nmnt'
    - 'windivert'
    - 'USBPcap'
    - 'pktmon'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the installation of specific Windows Pcap drivers, which are often used for network packet capturing. Attackers may utilize these drivers to facilitate network monitoring, eavesdropping, or reconnaissance activities, effectively allowing them to capture and analyze network traffic for sensitive information such as credentials or proprietary data. The presence of these drivers can indicate malicious intent, particularly if installed without the knowledge of the system administrators.

  Relevant MITRE ATT&CK tactics for this detection include **Discovery** (TA0007) as the installation of these drivers relates to gathering information about the network environment, and **Credential Access** (TA0006), since capturing network packets can lead to the acquisition of sensitive information. The specific techniques include **Network Sniffing** (T1040), which highlights the use of such tools to monitor network traffic.

  The primary data source for this alert is the Windows security event logs, specifically Event ID 4697, which pertains to the installation of a service. This provides visibility into unauthorized or unexpected installations that may hint at malicious activities.

  ### Investigation Steps
  - **Review Event ID 4697 Logs**: Collect and examine logs for Event ID 4697 that indicate service installations related to Pcap drivers. Check for unusual timestamps or accounts involved in the installation.
  - **Analyze System Services**: Investigate the services registry to identify any newly installed services that correspond to the detected Pcap drivers. Look for anomalous configurations or behaviors associated with these services.
  - **Cross-Reference with Inventory**: Compare the list of installed drivers against a known good list for your organization. Identify any unauthorized installations and assess the risk they pose.
  - **Monitor Network Traffic**: If the installation is confirmed, conduct a thorough analysis of network traffic to identify any suspicious behavior or data exfiltration attempts stemming from the usage of the Pcap driver.

  ### Prioritization
  Given the role of Pcap drivers in facilitating network eavesdropping, alerts from this rule should be considered medium severity. While not all installations of these drivers indicate malicious intent, their presence poses a significant risk, especially in environments where sensitive data is handled.

  ### Blind Spots and Assumptions
  This rule may not detect instances where malicious actors use other means to capture network traffic without installing traditional Pcap drivers. It assumes that the relevant logging for Event ID 4697 is correctly configured and enabled in the Windows environment. If the logging configuration is inadequate or if other stealth techniques are employed, detection may be ineffective. Additionally, false positives may arise from legitimate network monitoring activities by IT staff or security personnel.

