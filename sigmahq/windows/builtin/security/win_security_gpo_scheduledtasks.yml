title: Persistence and Execution at Scale via GPO Scheduled Task
id: a8f29a7b-b137-4446-80a0-b804272f3da2
status: test
description: Detect lateral movement using GPO scheduled task, usually used to deploy
  ransomware at scale
references:
- https://twitter.com/menasec1/status/1106899890377052160
- https://www.secureworks.com/blog/ransomware-as-a-distraction
- https://www.elastic.co/guide/en/security/7.17/prebuilt-rule-0-16-1-scheduled-task-execution-at-scale-via-gpo.html
author: Samir Bousseaden
date: 2019-04-03
modified: 2024-09-04
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.lateral-movement
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_5136:
    EventID: 5136
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains:
    - 'CAB54552-DEEA-4691-817E-ED4A4D1AFC72'
    - 'AADCED64-746C-4633-A97C-D61349046527'
  selection_5145:
    EventID: 5145
    ShareName|endswith: '\SYSVOL'     # looking for the string \\*\SYSVOL
    RelativeTargetName|endswith: 'ScheduledTasks.xml'
    AccessList|contains:
    - 'WriteData'
    - '%%4417'
  condition: 1 of selection_*
falsepositives:
- If the source IP is not localhost then it's super suspicious, better to monitor
  both local and remote changes to GPO scheduled tasks.
level: high
note: |
  ### Technical Context
  This detection rule identifies potential malicious activity centered around the abuse of Group Policy Object (GPO) scheduled tasks in a Windows environment. Attackers can leverage GPOs to execute harmful scripts or payloads, especially ransomware, across multiple machines simultaneously. The primary objective of using GPO scheduled tasks is to gain persistence and enable lateral movement throughout the network, making this tactic particularly effective for rapid deployment of attacks.

  Relevant MITRE ATT&CK techniques include **T1053.005 - Scheduled Task/Job: Windows Task**, under the Tactics of **Persistence**, **Execution**, and **Lateral Movement**. This technique is often utilized during ransomware attacks, where malicious actors aim to disrupt business operations while encrypting sensitive data. The best evidence for detection can be obtained from Windows security logs, specifically monitoring Event IDs 5136 and 5145, which indicate changes to GPO attributes and access to scheduled task configurations on shared resources.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security Event logs for Event ID 5136 and 5145 for unusual modifications related to GPO scheduled tasks. Look specifically for changes involving designated attributes like `gPCMachineExtensionNames` and `gPCUserExtensionNames`.

  - **Analyze GPO Changes**: Investigate the history of GPO modifications for any unauthorized or unexpected changes, particularly those that involve the execution of scheduled tasks from the `\\*\SYSVOL` share.

  - **Examine Network Activity**: Analyze network traffic to and from critical servers to uncover any suspicious connections that could indicate lateral movement triggered by the scheduled tasks.

  - **Correlate with Known Threats**: Cross-reference detected activities with threat intelligence feeds or known bad indicators associated with observed ransomware campaigns or other malicious operations.

  ### Prioritization
  The alert's severity is high due to the potential for widespread impact within an enterprise environment. Malicious changes to GPO scheduled tasks can lead to rapid, large-scale infections and significant operational disruption.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the advanced audit policy settings are not enabled appropriately, which is necessary for capturing the relevant Event IDs. Additionally, this rule assumes that attackers will not use legitimate administrative accounts to make these changes, which could lead to overlooked malicious activities. To ensure the alert functions as intended, proper configurations for logging and auditing must be established within the Windows environment.

