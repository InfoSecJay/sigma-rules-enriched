logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection_5136:
    EventID: 5136
    AttributeLDAPDisplayName:
    - 'gPCMachineExtensionNames'
    - 'gPCUserExtensionNames'
    AttributeValue|contains:
    - 'CAB54552-DEEA-4691-817E-ED4A4D1AFC72'
    - 'AADCED64-746C-4633-A97C-D61349046527'
  selection_5145:
    EventID: 5145
    ShareName|endswith: '\SYSVOL'     # looking for the string \\*\SYSVOL
    RelativeTargetName|endswith: 'ScheduledTasks.xml'
    AccessList|contains:
    - 'WriteData'
    - '%%4417'
  condition: 1 of selection_*
falsepositives:
- If the source IP is not localhost then it's super suspicious, better to 
  monitor both local and remote changes to GPO scheduled tasks.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of Group Policy Objects (GPO) that are related to scheduled tasks, specifically if they deploy malicious tasks to run at scale, a tactic often employed in ransomware attacks. The likely objective of this behavior is to facilitate lateral movement within an enterprise by leveraging existing policies to execute malicious code across multiple machines without direct user interaction. The relevant MITRE ATT&CK techniques include Persistence via GPO Scheduled Task (T1053.005) and Lateral Movement (T1021.001).

  The primary telemetry sources are Windows Security Event logs, particularly Event IDs 5136 and 5145, which capture changes to GPOs and access to SACL objects, respectively. The security impact, if malicious, could be extensive as it allows adversaries to execute code remotely across numerous endpoints, potentially leading to widespread ransomware deployment or other malicious activities. Importantly, this detection does NOT confirm malicious activity on its own, as it requires context and corroborative evidence to ascertain intent.

  ### Investigation Steps

  - **Review GPO Modification Events:** Look for Event ID 5136 in the Security logs (e.g., Windows Event Viewer > Security) to identify changes to attributes 'gPCMachineExtensionNames' or 'gPCUserExtensionNames'. Check if these changes include the GUIDs 'CAB54552-DEEA-4691-817E-ED4A4D1AFC72' or 'AADCED64-746C-4633-A97C-D61349046527'.

  - **Analyze Share Access Details:** Check Event ID 5145 logs for access to '\\*\SYSVOL\ScheduledTasks.xml'. Review the `AccessList` field for any mention of 'WriteData' or '%%4417', which indicates attempts to modify the scheduled tasks within SYSVOL.

  - **Validate Source of GPO Changes:** Determine the source IP of the GPO modification events. Any changes made from non-localhost IPs (i.e., not '127.0.0.1') warrant increased scrutiny for potential malicious activity.

  - **Identify Legitimate Change Patterns:** Compare the timestamps of the GPO changes with known legitimate administrative activities or maintenance window activities. Document expected change patterns and responsible personnel to differentiate them from potentially malicious actions.

  - **Correlate with Endpoint Behavior:** Gather relevant endpoint telemetry (e.g., Process Creation Events - Event ID 4688) following the GPO changes. Look for scheduled task executions that are unusual or do not match expected operational behavior.

  - **Cross-Check with Recent Security Incidents:** Review any recent alerts regarding lateral movement or ransomware deployment within your environment. Correlate any findings from the GPO rule detection with known incidents to assess impact and urgency.

  ### Prioritization

  The alert is classified as high severity due to its potential to enable widespread execution of malicious software, particularly ransomware. The likelihood of malicious abuse is high given that attackers often exploit GPO modifications to maintain access and control within the environment. This behavior, especially when linked with notorious malware techniques, is commonly weaponized in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited if auditing policies are not configured correctly, particularly the "Audit Detailed File Share" setting. Administrators may legitimately modify GPO settings for routine updates or maintenance, which could trigger false positives. Evasion techniques might include modifying GPOs from less monitored hosts to avoid detection. A companion detection method could involve monitoring for unusual process execution patterns (e.g., scheduled tasks created via Event ID 4688) that correlate with GPO changes, enhancing overall detection capabilities.

