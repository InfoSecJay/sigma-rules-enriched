logsource:
  product: windows
  service: security
  definition: 'The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.'
detection:
  selection:
    EventID:
    - 4699         # Task Deleted Event
    - 4701         # Task Disabled Event
    TaskName|contains:
            # Add more important tasks
    - '\Windows\SystemRestore\SR'
    - '\Windows\Windows Defender\'
    - '\Windows\BitLocker'
    - '\Windows\WindowsBackup\'
    - '\Windows\WindowsUpdate\'
    - '\Windows\UpdateOrchestrator\Schedule'
    - '\Windows\ExploitGuard'
  filter_sys_username:
    EventID: 4699
    SubjectUserName|endswith: '$'      # False positives during upgrades of Defender, where its tasks get removed and added
    TaskName|contains: '\Windows\Windows Defender\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies malicious activities where adversaries delete or disable critical scheduled tasks, which can lead to significant operational disruption or even data loss. Threat actors often target scheduled tasks related to vital system functions, like system restore, Windows Defender, BitLocker, and others, to evade detection and achieve their objectives. By manipulating these tasks, an attacker can significantly impair system recovery and security mechanisms, facilitating further exploitation within the environment.

  The primary MITRE ATT&CK techniques relevant to this detection are **T1053.005 - Scheduled Task/Job: Windows Scheduled Tasks** and **T1203 - Exploitation for Client Execution**. These tactics involve attackers using scheduled tasks as a component of their operational strategy—either as persistence mechanisms or through job execution for later exploitation. The logs primarily relied upon for this detection include Windows Security event logs, specifically events 4699 and 4701, which denote task deletion and disablement.

  ### Investigation Steps
  - **Review Security Event Logs:** Collect and analyze Windows Security event logs for Event ID 4699 (Task Deleted) and Event ID 4701 (Task Disabled) to verify any unauthorized modifications to critical scheduled tasks.
  - **Correlate Task Names:** Focus on tasks that have been deleted or disabled, specifically those related to critical system functionalities such as `\Windows\SystemRestore`, `\Windows\BitLocker`, and `\Windows\Windows Defender`. Cross-reference with baseline data to identify anomalies.
  - **Identify User Context:** Investigate the `SubjectUserName` for these events, specifically looking for service accounts or unusual usernames ending with a dollar sign `$`, which may indicate a potential misuse of permissions or privilege escalation attempts.
  - **Assess Impact on Operations:** Determine the operational impact of any deleted or disabled tasks by evaluating how these tasks affect system recovery and security functionalities. Look for indications of broader follow-on actions that might compromise security further.

  ### Prioritization
  This alert is considered high severity due to the potential impact on critical system functionalities and security measures, indicating a high likelihood of adversarial activity aimed at maintaining persistence or exfiltrating sensitive data.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if the Advanced Audit Policy settings for Object Access are not correctly configured, which can prevent the detection of some unauthorized task actions. The detection logic assumes that all critical scheduled tasks are monitored and that standard operational procedures are in place. Adequate logging configurations must exist to enable collection and analysis of the relevant event data for effective detection.

