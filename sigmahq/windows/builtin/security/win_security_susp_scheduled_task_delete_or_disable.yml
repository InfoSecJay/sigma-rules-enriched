note: |
  ### Technical Context

  This detection identifies when important scheduled tasks are deleted or disabled on Windows systems, which may indicate malicious intent. Attackers may seek to disable legitimate security measures (like Windows Defender updates) or disrupt system stability and functionality. The relevant MITRE ATT&CK tactics and techniques are **Execution (T1053.005)** and **Privilege Escalation**.

  The primary telemetry source is Windows Security logs, specifically Event IDs **4699** (Task Deleted) and **4701** (Task Disabled). If these activities are malicious, they can lead to an increase in vulnerability to further attacks or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also lead to these events.

  ### Investigation Steps

  - **Check Event IDs 4699 and 4701:** Review Windows Security logs for Event IDs **4699** (Task Deleted) and **4701** (Task Disabled). Look for tasks related to system security, such as `\Windows\SystemRestore\SR`, `\Windows\Windows Defender\`, and others listed in the detection criteria.

  - **Identify the User Account:** Verify the `SubjectUserName` field associated with the events to determine if the actions were taken by a legitimate administrative account or a potentially compromised user account. Administrative accounts performing these actions may be benign, whereas unexpected user accounts can be suspicious.

  - **Assess Task Importance:** Review legitimate scheduled tasks that were deleted or disabled. Confirm if they're critical tasks for the system’s functionality and security (e.g., Windows Defender, BitLocker, or System Restore). Their absence can signal higher risk.

  - **Correlate with Other Logs:** Cross-reference the deletion or disabling events (Event IDs **4699** and **4701**) with other telemetry, such as process creation logs (Event ID **4688** or Sysmon Event ID **1**). Look for unusual parent-child process relationships indicating a possible script or malicious actor performed the tasks.

  - **Validate Against Known Maintenance:** Verify if these actions align with known maintenance schedules or updates (e.g., antivirus updates, system patches). Review past maintenance logs to determine if these changes fall within typical administrative behavior.

  - **Identify Scheduled Task Execution History:** Check for any recent executions of the tasks that were deleted or disabled to understand their last known state. This can help establish whether they had been functioning as intended prior to the alteration.

  ### Prioritization

  This alert is high severity due to the potential impact on critical system functionalities and security measures. The likelihood of adversarial activity is considerable, given that the manipulation of scheduled tasks is a known tactic used to disrupt system defenses and conduct further malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging at the required detail level is not enabled or where the `Audit Other Object Access Events` policy is not configured. Also, legitimate administrative tasks may occasionally trigger this alert when system updates or maintenance activities occur. A related detection that enhances coverage would involve monitoring for abnormal process creation linked to scheduled task modifications (e.g., alerts for Event ID **4688** associated with anomalous commands targeting scheduled task operations).

