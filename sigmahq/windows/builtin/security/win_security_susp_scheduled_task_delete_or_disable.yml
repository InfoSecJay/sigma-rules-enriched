logsource:
  product: windows
  service: security
  definition: 'The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.'
detection:
  selection:
    EventID:
    - 4699         # Task Deleted Event
    - 4701         # Task Disabled Event
    TaskName|contains:
            # Add more important tasks
    - '\Windows\SystemRestore\SR'
    - '\Windows\Windows Defender\'
    - '\Windows\BitLocker'
    - '\Windows\WindowsBackup\'
    - '\Windows\WindowsUpdate\'
    - '\Windows\UpdateOrchestrator\Schedule'
    - '\Windows\ExploitGuard'
  filter_sys_username:
    EventID: 4699
    SubjectUserName|endswith: '$'      # False positives during upgrades of Defender, where its tasks get removed and added
    TaskName|contains: '\Windows\Windows Defender\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the deletion or disabling of critical scheduled tasks, specifically those related to system maintenance and security (e.g., Windows Defender tasks, System Restore, Windows Update). Such actions could indicate an adversary's attempt to hinder system functionality, facilitate further exploitation, or achieve persistence without detection, aligning with the MITRE ATT&CK technique T1053.005 (Scheduled Task/Job). The primary telemetry sources include Windows Security Event logs, particularly Event IDs 4699 (Task Deleted) and 4701 (Task Disabled).

  If malicious, this behavior poses a significant security risk, suggesting an adversary is attempting to disrupt essential security processes or delete critical recovery options. However, this detection does NOT confirm malicious intent on its own; benign administrative actions or automated task management by third-party applications could trigger the same events.

  ### Investigation Steps

  - **Review relevant Event IDs:** Check Windows Security Event IDs 4699 and 4701 in the Security log to confirm the deletion or disabling of scheduled tasks. Focus on the associated `TaskName` field for any important system tasks listed in the rule.

  - **Identify and validate task behavior:** Compare the `TaskName` with expected legitimate activities. Tasks such as `\Windows\SystemRestore\SR` and `\Windows\WindowsUpdate\` should typically be present and enabled unless there is a documented maintenance window.

  - **Check user context of the action:** Examine the `SubjectUserName` field of the detected events. A username ending with `$` suggests the action occurred under a machine account, which might be legitimate for system tasks. However, unexpected actions by administrative users could indicate malicious activity.

  - **Correlate with process creation logs:** Review related logs for process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the same timeframe to find whether suspicious processes executed before or after the task modifications.

  - **Validate the execution context:** Ensure that the logon type associated with task deletion/disabling events shows expected indicators (e.g., logon type 2 or type 3) for routine administrative tasks, avoiding types 4 or 10 that may indicate unauthorized remote access.

  ### Prioritization

  This alert has high severity due to the critical nature of the scheduled tasks being monitored. The likelihood of malicious actions leveraging task modifications is significant, especially since adversaries commonly manipulate scheduled tasks to maintain persistence or degrade system security features.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations missing the Advanced Audit Policy setting for Object Access, which is required for this detection to function. Additionally, legitimate administrative activities, such as routine maintenance or software updates, can trigger alerts. Companion detections for task creation or modification (Event ID 4700) may provide further context and strengthen coverage against potential abuse.

