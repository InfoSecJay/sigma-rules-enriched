title: Failed Code Integrity Checks
id: 470ec5fa-7b4e-4071-b200-4c753100f49b
status: stable
description: |
  Detects code integrity failures such as missing page hashes or corrupted drivers due unauthorized modification. This could be a sign of tampered binaries.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5038
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6281
author: Thomas Patzke
date: 2019-12-03
modified: 2025-01-19
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 5038
    - 6281
  filter_optional_crowdstrike:
    param1|contains:
    - '\CSFalconServiceUninstallTool_'
    - '\Program Files\CrowdStrike\'
    - '\System32\drivers\CrowdStrike\'
    - '\Windows\System32\ScriptControl64_'
  filter_optional_sophos:
    param1|contains: '\Program Files\Sophos\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Disk device errors
level: informational
note: |
  ### Technical Context

  This rule detects instances of failed code integrity checks, which are indicative of unauthorized modifications to binaries or drivers. This activity typically signals an attacker’s objective to tamper with the system to evade detection or maintain persistence. The relevant MITRE ATT&CK tactic is **Defense Evasion** (Tactics ID: TA0005), specifically the technique **Indicator Removal on Host** (T1027.001). The primary telemetry sources include Windows Security Event logs with Event IDs 5038 and 6281. If malicious, such integrity failures can lead to compromised system functionality or unauthorized execution of malicious code. Importantly, this detection does NOT confirm that an attack occurred—it only indicates that an integrity check has failed without context regarding the source or intent.

  ### Investigation Steps

  - **Review Event IDs 5038 and 6281:**: Examine Windows Security logs for Event ID 5038 (code integrity check failure) and Event ID 6281 (driver signing failure). Look for indications of unusual or unauthorized binaries attempting to load.

  - **Identify benign applications:**: Cross-reference the application path provided in the Event data. Check whether the failing binaries are from known benign applications (e.g., CrowdStrike or Sophos) to rule out false positives.

  - **Look for known indicators of compromise (IoCs):**: Search for signs of binary modification on the system using hashes or paths reported in the event logs. Exact path checks against expected locations can highlight unauthorized changes.

  - **Assess asset criticality:**: Identify if the affected system is a critical asset, such as a domain controller or a server running sensitive applications, to prioritize further investigation based on impact potential.

  - **Validate process creation:**: Review Security Event ID 4688 for any process creation events linked to the respective binaries or drivers that failed the integrity check. Check for unexpected parent-child process relationships indicating potential malicious behavior.

  ### Prioritization

  The severity of this alert can vary, but it generally indicates potential malicious activity, especially in the context of critical systems. Since this behavior is a common technique used by adversaries to manipulate system integrity, a failed code integrity check warrants immediate follow-up, particularly on sensitive assets where the impact of compromise could be substantial.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate software updates or misconfigurations leading to code integrity check failures, which can trigger false positives. This alert relies on accurate logging configurations for the Windows Security logs. False alarms may arise from legitimate applications like CrowdStrike or Sophos, which should be whitelisted in response workflows. Another companion detection to consider is monitoring for suspicious file creation or modification events in application directories to strengthen detection capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
