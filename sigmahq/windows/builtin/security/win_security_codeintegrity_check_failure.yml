title: Failed Code Integrity Checks
id: 470ec5fa-7b4e-4071-b200-4c753100f49b
status: stable
description: |
  Detects code integrity failures such as missing page hashes or corrupted drivers due unauthorized modification. This could be a sign of tampered binaries.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5038
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6281
author: Thomas Patzke
date: 2019-12-03
modified: 2025-01-19
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 5038
    - 6281
  filter_optional_crowdstrike:
    param1|contains:
    - '\CSFalconServiceUninstallTool_'
    - '\Program Files\CrowdStrike\'
    - '\System32\drivers\CrowdStrike\'
    - '\Windows\System32\ScriptControl64_'
  filter_optional_sophos:
    param1|contains: '\Program Files\Sophos\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Disk device errors
level: informational
note: |
  ### Technical Context
  This rule detects failures in code integrity checks, specifically focusing on events indicating missing page hashes or corrupted drivers due to unauthorized modifications. Such failures may suggest an attacker has tampered with system binaries or drivers, potentially compromising the integrity of the operating system and enabling further malicious actions. Attackers typically aim to disable security mechanisms or install rootkits, which can facilitate persistent access to victim machines.

  The applicable MITRE ATT&CK tactics include *Defense Evasion* (TA0005), particularly technique T1027.001 - *Obfuscated Files or Information*. The nature of the detection revolves around identifying unexpected modifications to critical system components, which might indicate attacks aimed at evading security measures. Data sources that provide the most pertinent evidence include Windows Security logs, specifically Event IDs 5038 (indicating code integrity failures) and 6281 (related to integrity violations), along with related system event logs.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security logs for Event IDs 5038 and 6281 around the time of the alert to determine the nature of the code integrity failures. Investigate the specific binaries or drivers flagged in these events.

  - **Inspect Authorized Modifications**: Identify any legitimate applications or maintenance activity that may explain the integrity check failures. Cross-reference flagged binaries with known deployments in your environment.

  - **Analyze Binary Paths**: Examine paths for any unrecognized or suspicious binaries, especially those related to CrowdStrike or Sophos, as indicated in the detection logic. Validate their legitimacy and consider the context of their presence on the system.

  - **Assess System Integrity**: Conduct a thorough check of the affected system to verify the integrity of critical system files and applications. Look for unauthorized changes or installations, and consider running a system file checker tool (e.g., 'sfc /scannow').

  ### Prioritization
  This alert warrants attention due to the potential for severe impact on system integrity and security. Unauthorized modifications to code integrity can indicate active attempts to bypass security measures, making it critical to assess and remediate any suspicious activity promptly.

  ### Blind Spots and Assumptions
  Possible gaps in detection include legitimate administrative actions that may trigger integrity check failures, such as system updates or security software maintenance, leading to false positives. The detection logic assumes that any integrity failure is indicative of tampering without considering benign causes. It relies on the availability of Windows Security logs, particularly Event IDs 5038 and 6281, therefore proper logging configurations must be ensured for accurate detection capabilities.

