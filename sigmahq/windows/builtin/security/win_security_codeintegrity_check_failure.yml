title: Failed Code Integrity Checks
id: 470ec5fa-7b4e-4071-b200-4c753100f49b
status: stable
description: |
  Detects code integrity failures such as missing page hashes or corrupted drivers due unauthorized modification. This could be a sign of tampered binaries.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5038
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6281
author: Thomas Patzke
date: 2019-12-03
modified: 2025-01-19
tags:
- attack.stealth
- attack.t1027.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 5038
    - 6281
  filter_optional_crowdstrike:
    param1|contains:
    - '\CSFalconServiceUninstallTool_'
    - '\Program Files\CrowdStrike\'
    - '\System32\drivers\CrowdStrike\'
    - '\Windows\System32\ScriptControl64_'
  filter_optional_sophos:
    param1|contains: '\Program Files\Sophos\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Disk device errors
level: informational
note: |
  ### Technical Context

  This Sigma rule detects failed code integrity checks that indicate unauthorized modifications to binaries, such as missing page hashes or corrupted drivers. The likely attacker objective could be to tamper with code signatures to evade detection by security products or to ensure persistence on compromised systems. This behavior aligns with the MITRE ATT&CK technique "Code Signing" (T1027.001). The primary telemetry sources are Windows Security event logs, specifically Event ID 5038 and Event ID 6281, that log code integrity violations. If malicious, this could indicate a compromised system that is executing tampered executables or drivers, potentially facilitating further exploitation or data exfiltration. However, it is important to note that this detection does NOT confirm that the modification was malicious; additional context is needed to ascertain intention.

  ### Investigation Steps

  - **Check for Event IDs 5038 and 6281**: Review Windows Security logs for Event ID 5038 and Event ID 6281 to identify specific instances of code integrity failures. Look for the `param1` field, which contains the file path of the modified binaries.

  - **Determine if modifications are benign**: Investigate whether the detected changes involve known legitimate software updates or administrative actions. For instance, updates from trusted software vendors like CrowdStrike or Sophos may be expected.

  - **Identify high-confidence malicious indicators**: Look for attempts to modify critical Windows drivers or system binaries, particularly in paths like `\System32\drivers\` or `\Windows\System32\`. Any unrecognized binaries or anomalies in these directories should be scrutinized.

  - **Examine related process activity**: Cross-reference an execution process tree using Sysmon Event ID 1 to find out if the modified binaries were executed by suspicious processes. Look for execution from unexpected parent processes.

  - **Review for potential evasion techniques**: Consider the possibility that a threat actor could utilize tools to bypass integrity checks, such as using rootkits. Analyze for the presence of rootkit behaviors documented in respective MITRE techniques.

  - **Verify devices and systems involved**: Assess the criticality and role of the affected host. Systems involved in sensitive operations should be prioritized for deeper investigation to mitigate potential risks.

  ### Prioritization

  Due to the nature of the detected behavior, which involves integrity violations of system binaries, the alert is of moderate severity. This could indicate systemic compromise or an active attempt by an adversary to establish persistence. Given that such modifications are foundational to many attack vectors, the likelihood of malicious abuse is significant.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by sophisticated adversaries using stealth techniques to alter binaries with minimal exposure. The effectiveness of the detection relies on correct logging configurations for Event IDs 5038 and 6281. Legitimate software updates or system maintenance activities may trigger this alert. A related detection to consider is abnormal process creation from drivers, which may further indicate compromised code integrity in conjunction with this rule.

