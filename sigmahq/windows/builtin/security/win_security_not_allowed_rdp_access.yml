note: |
  ### Technical Context

  This rule detects denied Remote Desktop (RDP) connection attempts made by authenticated users who are not authorized for remote logon. The objective of the attacker may involve lateral movement within the network, often targeting Windows servers while attempting to exploit misconfigurations or weak credentials to gain unauthorized access. This behavior is aligned with the MITRE ATT&CK tactic of Lateral Movement and specifically utilizes the technique T1021.001 (Remote Desktop Protocol).

  The primary telemetry sources include Windows Security logs with Event ID 4825, indicating when an access attempt is denied. If malicious, this activity could signify a reconnaissance phase or an attempt to pivot within the network. However, it is important to note that this detection alone does not confirm that an attack is ongoing; it only indicates unauthorized access attempts by known users.

  ### Investigation Steps

  - **Review Event ID 4825 Details**: Check for Event ID 4825 in Security logs. Look for fields indicating the user account, source IP, and the targeted host. Malicious indicators include repeated attempts from unusual locations or accounts not typically associated with RDP access.

  - **Identify Expected RDP Access Patterns**: Cross-reference legitimate RDP usage. List users and IPs that are authorized for remote access and verify their connection attempts. Access by authorized personnel should align with normal work hours and expected IP ranges.

  - **Examine Failed Access Attempt Frequency**: Analyze the frequency of denied access attempts. A high number of attempts over a short period from a single account can indicate password guessing or brute force attempts, which are malicious.

  - **Track User Account Behavior**: Investigate the account's recent activities in Active Directory. If the user has not logged on to any workstation or has irregular usage patterns, further scrutiny is warranted.

  - **Check for Successful RDP Connections**: Look for any subsequent successful RDP connections by the same account from the same or different IP addresses post-denial events. This can indicate an attacker successfully exploiting credentials.

  - **Monitor Event Correlation with Network Traffic**: If using a network monitoring tool, correlate the denied access events with outbound traffic attempting to utilize RDP. Identify any connections to suspicious external IP addresses that could indicate data exfiltration efforts.

  ### Prioritization

  This alert is of medium severity. It indicates potential unauthorized access attempts by users, which could lead to lateral movement and system compromise. Given that RDP is a common target for attacks, especially in vulnerable environments, this warrants timely investigation to mitigate potential threats.

  ### Blind Spots and Assumptions

  This detection could miss instances where authorized users simply lack permissions due to misconfiguration, leading to false positives. There may also be legitimate administrative activities by users that result in denied access attempts if permissions are not correctly assigned. Configuring alerts for successful and failed RDP connections could provide comprehensive situational awareness and detection capabilities, while simulating known adversary tactics around credential misuse can enhance detection effectiveness.

