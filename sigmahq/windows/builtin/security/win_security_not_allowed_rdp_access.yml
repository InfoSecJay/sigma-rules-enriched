note: |
  ### Technical Context
  This rule detects instances where authenticated users who lack permissions for Remote Desktop Protocol (RDP) access attempt to connect to a Windows server. Such events, logged with Event ID 4825, may indicate attackers probing the network in search of exploitable machines or actively trying to gain access to the system by attempting unauthorized logins. The primary objective of attackers in this scenario is typically to conduct lateral movement, escalate privileges, or exfiltrate sensitive data.

  The relevant MITRE ATT&CK tactics associated with this detection include **Lateral Movement** (TA_LateralMovement) and the technique for RDP exploitation, specifically **Remote Services: RDP** (T1021.001). These tactics and techniques illustrate the attackers' methods of navigating through the compromised network environment, especially by leveraging legitimate credentials to gain unauthorized access.

  Primary data sources for this detection include Windows security logs, specifically those capturing failed authentication attempts related to remote access services. Insights from other logs, like RDP access attempts, may also provide additional context.

  ### Investigation Steps
  - **Review Windows Security Logs:** Analyze logs for Event ID 4825 to identify the specific accounts attempting to access RDP and note the timestamps to correlate with user activity.
  - **Examine Account Permissions:** Validate whether the accounts logged have been appropriately configured with access controls, focusing on group memberships that pertain to Remote Desktop users.
  - **Cross-reference with Network Activities:** Look for any unusual spikes in RDP access attempts or patterns indicating systematic probing of multiple machines within the network that could suggest attacker behavior.
  - **Check for Known Vulnerabilities:** Investigate whether any of the servers accessed could be susceptible to well-documented RDP vulnerabilities that could allow attackers to exploit the service.

  ### Prioritization
  The severity of this alert is medium due to the potential risk of unauthorized RDP attempts compromising sensitive systems and facilitating lateral movement within the enterprise network. Although not always indicative of successful breaches, repeated incidents can signal probing activities by threat actors, necessitating further scrutiny.

  ### Blind Spots and Assumptions
  This detection may miss attempts to access RDP through other methods that do not log resulting events under Event ID 4825, including attacks using compromised service accounts or those leveraging non-standard ports for RDP access. Additionally, the detection assumes that all Remote Desktop permissions are correctly set and enforced in the environment. Required logs for effective detection include comprehensive Windows security logs along with processed telemetry from potentially vulnerable systems to capture a full picture of remote access attempts.

