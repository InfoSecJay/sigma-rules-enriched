  ---

  ### Technical Context

  This Sigma rule detects instances where an authenticated user attempts to connect to a system via Remote Desktop Protocol (RDP) but is denied due to insufficient permissions. This behavior typically indicates reconnaissance or lateral movement by attackers, as they often probe RDP access on target systems to exploit weak credentials or vulnerabilities.

  The relevant MITRE ATT&CK tactic is "Lateral Movement," specifically technique T1021.001, which pertains to Remote Services. The primary telemetry source is Windows Security Event logs capturing Event ID 4825, which logs denied RDP access attempts. If this activity is malicious, it could indicate an attacker trying to gain control of a Windows server or workstation. However, this detection does NOT prove successful exploitation or unauthorized access on its own.

  ---

  ### Investigation Steps

  - **Verify Event ID:** Review Security Event ID 4825 in the Windows Event Viewer. Look for timestamps and usernames associated with the denied RDP connection attempts for correlation with other events.

  - **Analyze Failed Usernames:** Identify the usernames in the logs attempting the RDP connection. Compare against a known list of valid users allowed RDP access. Any unauthorized usernames may indicate malicious activity.

  - **Check Network Access Logs:** Review inbound connection logs on the host, focusing on Firewall Event IDs 5156-5158 for any recent traffic attempting to make RDP connections. Confirm whether the IP addresses associated with the attempts are recognized or need investigation.

  - **Inspect for Legitimate Activity:** Cross-reference denied access logs with any recent administrative changes that could affect RDP permissions. Ensure that valid user accounts that should have RDP access are added to the appropriate user groups.

  - **Identify High-Confidence Indicators:** Look for any pattern of repeated access attempts from the same IP address that is outside of normal operating activity. Continuous attempts in a short timeframe may indicate a brute force or automated attack.

  - **Evaluate Asset Criticality:** Determine the role of the affected system. If it hosts sensitive data or essential services, raise the priority for immediate investigation.

  ---

  ### Prioritization

  This alert has medium severity, as it indicates potential attempts by authenticated users to access sensitive systems. The likelihood of malicious abuse is moderate, especially in environments where RDP is heavily used. Since attackers frequently use RDP for lateral movement, it warrants prompt examination.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate users who lack remote access permissions to generate similar alerts. If logging for Event ID 4825 is not enabled or if RDP is not configured correctly, the alerts may not be generated. Additionally, users often perform legitimate access methods that could trigger similar logs (e.g., administrative username changes). A related detection to consider is monitoring for multiple failed login attempts prior to denied access, which can provide stronger evidence of a reconnaissance attempt.

