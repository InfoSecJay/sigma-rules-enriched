note: |
  ### Technical Context

  This Sigma rule detects the use of SDelete, a secure deletion tool that is often exploited by adversaries to wipe evidence of their activities. The behavior is characterized by interactions with files having extensions commonly associated with SDelete usage, such as `.AAA` and `.ZZZ`. The likely attacker objective is to cover their tracks after malicious actions, thus hindering forensic investigations.

  This activity aligns with the MITRE ATT&CK techniques of [Data Destruction (T1485)](https://attack.mitre.org/techniques/T1485/) and [Indicator Removal on Host (T1070.004)](https://attack.mitre.org/techniques/T1070/004/). Primary telemetry sources include Windows Security Event logs, specifically Event ID 4656 (Handle Request), 4663 (Object Access), and 4658 (Handle Closed). If malicious, the security impact could be profound, as it can allow attackers to eliminate evidence and hinder incident response. However, this detection does NOT confirm unauthorized actions on its own, as legitimate SDelete usage may trigger the rule.

  ### Investigation Steps

  - **Review Event IDs 4656, 4663, and 4658:** Inspect the events related to file access for any instances involving files with the extensions `.AAA` or `.ZZZ`. Look for unusual access patterns or ownership changes that suggest malicious intent, such as access by non-administrative user accounts.

  - **Validate File Access Source:** Identify the source process triggering these events by correlating with Process IDs found in the logs. Look for known benign processes or expected applications that typically interact with file types ending in `.AAA` or `.ZZZ`.

  - **Identify Affected Hosts' Roles:** Determine the role of the affected systems (e.g., endpoints, servers) in line with asset criticality. Investigate whether these systems typically handle sensitive files that would justify the use of SDelete.

  - **Correlate with User Activity Logs:** Check user activity logs to establish if there were recent administrative tasks or expected legitimate activities around the time of file access. Look for user patterns that may indicate an authorized use of file deletion processes.

  - **Match Against Known Malicious Indicators:** Investigate if the alerts triggered coincide with behaviors noted from previous incidents tied to data destruction or evidence wiping campaigns. Investigate known threat actor tactics that include the usage of SDelete.

  - **Document Expected Legitimate Uses:** Ascertain if there are documented organizational procedures that may involve using SDelete for legitimate purposes. Maintain a log of approved use cases and applicable user roles that may justify the observed activity.

  ### Prioritization

  This alert has medium severity due to the potential impact on forensic investigations and system integrity. Given that tools like SDelete can be readily weaponized, the likelihood of malicious abuse is substantial if uncorrelated with legitimate use. Monitoring is essential to distinguish between legitimate and suspicious activities surrounding secure deletion practices.

  ### Blind Spots and Assumptions

  Detection may miss instances where event logging for the relevant IDs is not properly configured or where EDR solutions mask the execution details. Legitimate cleanup processes and application behavior may also trigger this alert if not contextualized. A companion detection rule focusing on process creation events related to SDelete's execution (e.g., Process ID from Event ID 4688) would strengthen overall monitoring efficacy.

