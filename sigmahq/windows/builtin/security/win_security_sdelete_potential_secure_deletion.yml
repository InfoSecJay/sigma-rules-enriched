note: |
  ### Technical Context
  This detection rule identifies potential secure deletion activities using SDelete, a tool commonly used by both legitimate users and attackers to securely erase files beyond recovery. When an attacker seeks to cover their tracks after intrusion or while removing traces of their actions, they may leverage SDelete to wipe files with extensions like `.AAA` and `.ZZZ`. This could suggest malicious intent when the deletion activity occurs in sensitive contexts, such as environments handling critical data or during suspicious times.

  Relevant MITRE ATT&CK techniques for this detection include:
  - **T1070.004: File Deletion** - SDelete may be used to delete files to evading detection.
  - **T1027.005: Obfuscated Files or Information** - The use of uncommon file extensions can be seen as a tactic to obscure malicious activity.
  - **T1553.002: Subvert Trust Controls** - Tampering with the integrity of files to hide illicit activities falls under manipulative actions to persist undetected.

  The primary data sources for this rule are Windows Security event logs. Specifically, events related to access control and system file actions must be monitored, particularly Event IDs 4656 (Handle Requested), 4663 (An Attempt Was Made to Access an Object), and 4658 (The Handle to an Object Was Closed).

  ### Investigation Steps
  - **Review Security Event Logs:** Start by reviewing Windows Security logs for Event IDs 4656, 4663, and 4658 corresponding to the relevant timestamp of the alert to identify what actions were taken on files with the specified extensions.
  - **Examine File and System Activity:** Look for unusual file access patterns or processes related to SDelete running on the system. Analyze process creation logs or command line arguments to identify any suspicious command execution.
  - **Assess User Behavior:** Investigate the user account involved in the deletion activity. Determine whether it aligns with regular usage patterns for that user or if it deviates significantly, indicating potential compromise.
  - **Correlate with Other Alerts:** Cross-reference the detection with other alerts or logs (e.g., EDR data, network traffic) during the same timeframe to piece together a broader picture of activity that may indicate malicious behavior.

  ### Prioritization
  The severity of this alert is considered medium due to the potential threat it poses to data integrity and the likelihood of misuse in environments where sensitive or critical data is managed. Prompt action is recommended to ascertain whether the activity was legitimate or indicative of malicious intent.

  ### Blind Spots and Assumptions
  One notable gap is the reliance on specific file extensions; if SDelete is used with non-standard extensions or modifies file types, those events may not be flagged. The detection logic assumes SDelete will consistently be applied within monitored environments and that logs for these specific actions are enabled in the Windows Security log. Additionally, legitimate administrative use of SDelete could lead to false positives, requiring careful context evaluations for each alert generated.

