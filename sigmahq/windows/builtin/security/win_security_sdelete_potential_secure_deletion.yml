note: |
  ### Technical Context

  This Sigma rule detects file interactions involving specific extensions (.AAA and .ZZZ) that are typically associated with the use of SDelete, a command-line utility used for secure file deletion. The likely attacker objective is to conceal their tracks by securely deleting files following malicious activity, thereby eliminating evidence of data compromise or unauthorized access. This behavior corresponds with MITRE ATT&CK tactics such as Defense Evasion (T1070.004) and Artifact Removal (T1485).

  The primary telemetry sources required for detection include Windows Security Event logs, specifically Event IDs 4656 (Handle Created), 4663 (File Accessed), and 4658 (File Handle Closed). The security impact of these actions is significant, as they may indicate an attempt to destroy crucial forensic evidence. However, this detection does NOT confirm malicious intent on its own; legitimate usage of SDelete also exists.

  ### Investigation Steps

  - **Review log details for Event ID 4663**: Check for access to files with extensions .AAA and .ZZZ in Windows Security logs. Ensure the ObjectName field shows these extensions; benign indicators often appear as part of legitimate software processes or maintenance tasks.

  - **Correlate with Event ID 4656 and 4658**: Analyze the sequence of these events surrounding any file access. Malicious indicators include unusual access patterns preceding or following the secure deletion events, particularly in sensitive directories.

  - **Cross-check file access timestamps**: Investigate whether the timestamps of events align with any known legitimate system operations or user activities. Legitimate usage often involves known user accounts performing cleanup during maintenance hours.

  - **Validate context of executing user**: Inspect the user account that triggered the events. High-confidence malicious indicators are accounts with no known administrative tasks performing deletions, particularly on production systems.

  - **Monitor for related artifacts**: Check for the presence of other forensic artifacts, such as Shadow Copies or Windows Volume Shadow Copy Service logs. This can help identify if files were being interacted with or deleted without legitimate cause.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if secure deletion was performed maliciously. The likelihood of abuse is moderate, given SDelete’s potential for misuse during post-compromise cleanup efforts. This behavior can be weaponized by advanced adversaries looking to erase traces of their activities.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of SDelete for secure file handling within the organization, potentially leading to false positives. Required log sources must include stringent configurations for Windows Security logs to capture relevant events. Legitimate activities that might trigger this alert could include IT maintenance or user-driven cleanup processes. A related or companion detection, such as monitoring for suspicious process creation (Event ID 4688), can enhance visibility into potential misuse patterns.

