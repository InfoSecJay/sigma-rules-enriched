logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'set'
    - '&&'
    ServiceFileName|contains:
    - 'environment'
    - 'invoke'
    - '${input)'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the usage of obfuscated PowerShell scripts that utilize standard input (stdin) for code execution. Attackers often leverage such obfuscation techniques to bypass security measures, aiming to execute malicious payloads while avoiding detection. The use of stdin combined with strings like "set" and "&&" indicates potential attempts to manipulate the PowerShell environment dynamically, which is characteristic behavior of sophisticated threats.

  The likely objective of the attacker is to execute arbitrary commands under the radar of traditional detection mechanisms, facilitating tasks such as lateral movement or privilege escalation within a target environment. Given its relevance, this behavior aligns primarily with the MITRE ATT&CK techniques of [Execution (T1059.001)](https://attack.mitre.org/techniques/T1059/001) for PowerShell and [Obfuscated Files or Information (T1027)](https://attack.mitre.org/techniques/T1027), which cover methods of obfuscation used to hide malicious intent.

  Primary data sources for detecting this activity include Windows Security Event logs (specifically Event ID 4697) related to service creation events, which can provide insight into how processes are being initiated and if they are utilizing suspicious parameters.

  ### Investigation Steps
  - **Review Security Logs:** Examine Windows Event Logs for Event ID 4697 to identify any recent service creations that contain obfuscated PowerShell commands using stdin.
  - **Analyze Command-Line Arguments:** Investigate the command-line arguments associated with the identified services to understand the context and to spot any additional suspicious parameters used in the PowerShell invocation.
  - **Correlate with EDR Data:** Utilize endpoint detection and response (EDR) tools to analyze the execution context and any related processes that began at the same time, as well as their parent-child relationships.
  - **Determine the Source of Execution:** Identify the user and system context under which the obfuscated PowerShell script ran, and check if there were any previous indicators of compromise or abnormal user activity leading up to the event.

  ### Prioritization
  The alert has a high severity level due to the potential for obfuscated scripts to facilitate significant threats, including data exfiltration and lateral movement within the network. The use of such tactics often indicates advanced persistent threats aiming to compromise sensitive systems.

  ### Blind Spots and Assumptions
  This detection rule relies on the availability of specific Windows Event logs (Event ID 4697) being enabled in the system's security auditing policies. If these logs are not configured correctly, the detection may fail. Additionally, analysts should be aware that sophisticated attackers can further obfuscate commands or adopt completely different execution methods, which may not be captured by this rule. The detection logic assumes that obfuscation will frequently involve common PowerShell patterns, which may not always hold true.

