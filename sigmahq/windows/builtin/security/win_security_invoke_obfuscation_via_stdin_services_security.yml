note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands executed via standard input (stdin) through the monitoring of specific Windows events. The likely objective of an attacker utilizing this technique is to execute malicious payloads while evading detection mechanisms by obfuscating script content. This behavior aligns with the MITRE ATT&CK techniques "Command and Control" (T1071) and "Scripting" (T1059.001). The primary telemetry sources are Windows Security Event logs, specifically Event ID 4697, which requires the "System Security Extension" audit subcategory to be enabled. If malicious, the impact may include unauthorized remote access or data exfiltration. This detection, however, does NOT confirm that the activity is intrinsically malicious; legitimate administrative scripts may trigger these events.

  ### Investigation Steps

  - **Review Event ID 4697 details:** Look for specific log entries that indicate the execution of PowerShell scripts using obfuscation via stdin, noting fields such as `ServiceFileName`. Analyze the command content and context to ascertain intent or legitimacy.

  - **Identify high-confidence malicious indicators:** Check for occurrences of keywords like 'set', '&&', and 'invoke', particularly in conjunction with suspicious command patterns or unrecognized scripts. These often suggest obfuscated execution attempts.

  - **Analyze the executing process context:** Investigate the parent process associated with the Event ID 4697 entries. Look for common parent processes typically involved in legitimate workflows, like legitimate administrative tools or known software management systems.

  - **Validate expected PowerShell usage:** Compare the investigated commands against baseline PowerShell usage in your environment. Document any unusual or unauthorized script executions, especially those not linked to known administrators.

  - **Assess host role and criticality:** Remain aware of the role of the affected host. If it is a critical system (e.g., domain controller or sensitive data repository), prioritize further investigation and containment to assess potential impacts.

  ### Prioritization

  This alert should be considered high severity due to the critical systems often targeted and the potential for system compromise through obfuscated PowerShell commands. Given that attackers frequently weaponize these methods for command execution and lateral movement, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Evasion techniques may include using alternate interpreters or hiding processes. Log sources like PowerShell logs (Module logging) and detailed command line monitoring may be required for reliable detection. Legitimate automation scripts with obfuscation might trigger this alert, providing false positives, particularly in complex environments. Additionally, companion detections such as those monitoring PowerShell command history or file creation events could enhance visibility and strengthen overall coverage.

