note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands through stdin that often indicate the use of the `Invoke-Obfuscation` technique. The likely attacker objective here is to execute hidden or malicious code, typically employed to evade detection mechanisms while maintaining command and control (C2) functionalities. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1027) and Remote Script Execution (T1059.001).

  The primary telemetry source for this detection is Windows Security logs, specifically focused on Event ID 4697, which logs when a service is installed. If malicious, it can enable an adversary to run scripts unnoticed, potentially leading to system compromise. Notably, this detection does NOT independently confirm an exploit or compromise; further investigation is required to establish the context and intent behind the PowerShell usage.

  ### Investigation Steps

  - **Review service installation details:** Examine Event ID 4697 logs for the creation of suspicious services. Look for the ServiceFileName containing `set`, `&&`, `environment`, and `invoke`. Malicious entries will likely have unusual service names or unusual command combinations.

  - **Check for indicators of obfuscation:** Analyze the contents of PowerShell scripts referenced in the logs for common obfuscation patterns. Legitimate commands are usually straightforward and not overly complex or concatenated, while malicious cases will contain kinds of encoding or excessive chaining of commands.

  - **Correlate with PowerShell audit logs:** Look at Event ID 4103 (PowerShell script block logging) for scripts executed in the context of the detected service. Check for suspicious commands or unusual script constructs that indicate obfuscation.

  - **Identify affected system role and impact:** Note whether the affected service is on a critical asset or server (e.g., domain controller, file server). Malicious activity on such systems significantly raises the severity.

  - **Evaluate endpoint security logs:** Check for other high-confidence indicators of compromise (IoCs) such as suspicious processes initiated from PowerShell (Event ID 4688) or execution of known malicious scripts. This may include C2 connections or data exfiltration attempts that align with the timeline of service creation.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of executing obfuscated commands on critical systems. The likelihood of malicious usage is significant since obfuscation techniques are commonly weaponized in attacks to bypass security defenses. The presence of obfuscated PowerShell commands consistently signals an elevated risk level that merits immediate investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using legitimate PowerShell scripts or built-in system tools that do not trigger this detection. Reliable detection requires proper configurations to log Event ID 4697, along with enabling PowerShell script block logging. Legitimate administrative actions could inadvertently trigger this alert, such as maintenance scripts. A related detection such as the triggering of PowerShell commands via a known malicious C2 channel could complement coverage and improve detection fidelity.

