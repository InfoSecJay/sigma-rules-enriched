  ---

  ### Technical Context

  This rule detects failed operations related to Kerberos Ticket Granting Ticket (TGT) requests, indicating potential manipulation or abuse of ticketing processes within a Windows environment. An attacker may aim to leverage these failures to exploit Kerberos authentication, aiming for lateral movement or unauthorized access. Relevant MITRE ATT&CK tactics include Credential Access (TA0006) and specifically the technique of Kerberos Ticket Granting Ticket (TGT) Manipulation (T1212).

  Primary telemetry sources include Security Event logs (specifically Event IDs 675, 4768, 4769, and 4771). If malicious, this behavior can enable attackers to gain unauthorized access to resources using compromised identities. It is important to note that this detection alone does not confirm the occurrence of a successful compromise; it merely highlights potential issues that require further investigation.

  ---

  ### Investigation Steps

  - **Review specific event IDs**: Check Security Event logs for Event IDs 4768 (TGT request), 4769 (TGT service ticket request), and 4771 (failed TGT request) to identify the nature of the failures and their sources.

  - **Assess accounts involved**: Investigate which user accounts were attempting TGT requests and determine the legitimacy of these accounts. Pay particular attention to service accounts or administrative accounts that should have minimal usage for interactive logins.

  - **Identify status codes**: Look for specific status codes in the logs, such as '0x9' (Client not found), '0x10' (Service not found), and others listed in the detection rule. Analyze how frequently they occur and correlate them with other activities on the network.

  - **Compare against normal behavior**: Establish a baseline for normalized Kerberos request patterns within your environment. Investigate if legitimate applications or scheduled tasks may be generating failed TGT requests, noting any patterns.

  - **Search for high-confidence indicators**: Identify repeated failed TGT requests within a short time frame across multiple accounts, which may indicate credential dumping or systematic enumeration attempting to exploit weak accounts.

  - **Verify last known login and system roles**: For any suspicious accounts, check the last known login activity against their expected usage patterns (Event ID 4624); correlate with asset criticality to prioritize further actions.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential for credential manipulation and unauthorized system access, especially if it originates from high-privileged accounts. The lack of successful TGT calls may indicate an active attack scenario targeting authentication processes, which are often exploited in real assaults.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist regarding certain benign applications that may trigger similar TGT failures due to misconfigurations or legacy software faults. A requirement for reliable detection includes proper logging configuration across all domain controllers. Additionally, legitimate administrative tasks could lead to increased TGT failures. Companion detections, such as monitoring for anomalous authentication requests or account lockouts (Event ID 4625), can provide comprehensive coverage of potential Kerberos exploitation activities.

