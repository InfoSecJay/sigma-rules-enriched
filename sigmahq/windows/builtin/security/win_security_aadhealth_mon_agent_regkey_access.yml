title: Azure AD Health Monitoring Agent Registry Keys Access
id: ff151c33-45fa-475d-af4f-c2f93571f4fe
status: test
description: |
  This detection uses Windows security events to detect suspicious access attempts to the registry key of Azure AD Health monitoring agent.
  This detection requires an access control entry (ACE) on the system access control list (SACL) of the following securable object HKLM\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent.
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_monitoring_agent.yml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2022-10-09
tags:
- attack.discovery
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4656
    - 4663
    ObjectType: 'Key'
    ObjectName: '\REGISTRY\MACHINE\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent'
  filter:
    ProcessName|contains:
    - 'Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe'
    - 'Microsoft.Identity.Health.Adfs.InsightsService.exe'
    - 'Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe'
    - 'Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - 'Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized access attempts to the Azure AD Health Monitoring Agent registry keys, specifically targeting the key located at `HKLM\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent`. The likely intent of an attacker would be to manipulate configurations or extract sensitive information related to Azure Active Directory health reporting. This behavior correlates with the MITRE ATT&CK tactic of Discovery (TA0007) and technique ID T1012 (Query Registry). The primary telemetry sources include Windows Security Event logs, specifically Event IDs 4656 (Handle Request) and 4663 (Object Access). If the observed activity is confirmed malicious, it may lead to unauthorized changes in the Azure AD health monitoring configuration, severely impacting the organization's ability to monitor its Azure resources. Importantly, this detection alone does not confirm that malicious access was successful; further investigation is needed to ascertain intent and impact.

  ### Investigation Steps

  - **Review Security Event 4663:** Examine Event ID 4663 logs for access to registry keys related to Azure AD Health Monitoring Agent. Focus on the `ObjectName` field matching `\REGISTRY\MACHINE\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent` and evaluate the `Access Mask` for potentially unauthorized activity.

  - **Check Process Origins:** Investigate the `ProcessName` field in related Event IDs. Look specifically for unexpected instances of processes like `Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe` among those listed in the detection conditions. Legitimate behavior will typically show only expected Azure AD monitoring processes originating from known internal sources.

  - **Identify High-Confidence Malicious Indicators:** Correlate logs indicating access by processes not belonging to the Azure AD Health Monitoring Agent or originating from non-standard accounts. Malicious access attempts may show unusual or administrative accounts that do not regularly access the registry.

  - **Cross-Reference with Audit Rules:** Validate the access control entry (ACE) settings on the registry key to ensure that appropriate auditing is in place. Confirm that successful and failed audit events are being logged to capture both unauthorized access and legitimate system behavior.

  - **Assess Host Role and Impact:** Consider the role of the affected host. If it is a domain controller or management server, the potential impact of malicious registry access is significantly higher.

  - **Examine for File Creation or Alteration:** Review related telemetry for unauthorized file changes or creations, especially in the directory used for Azure AD Health Agent logs. Look for logs that might indicate attempts to alter logging mechanisms that could hide malicious actions.

  ### Prioritization

  This alert is of medium severity due to the critical nature of Azure AD services within an enterprise. The likelihood of malicious abuse is high, as attackers may target these configurations to disrupt monitoring capabilities or gather sensitive information. Given that registry manipulation is commonly weaponized in attacks, analysts should prioritize this review.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient audit policies on the registry, potentially missing legitimate administrative access that could trigger this alert. The required log sources, particularly Windows Security Event logs at the specified IDs, must be properly configured to enhance detection reliability. Legitimate activities, such as routine administrative tasks or system updates, may trigger this alert if adequate thresholds are not established. Companion detections may include monitoring for unusual account access patterns or logins tied to the Azure environment, enhancing overall visibility into potential threats.

