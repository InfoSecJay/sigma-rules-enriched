title: Azure AD Health Monitoring Agent Registry Keys Access
id: ff151c33-45fa-475d-af4f-c2f93571f4fe
status: test
description: |
  This detection uses Windows security events to detect suspicious access attempts to the registry key of Azure AD Health monitoring agent.
  This detection requires an access control entry (ACE) on the system access control list (SACL) of the following securable object HKLM\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent.
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_monitoring_agent.yml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2022-10-09
tags:
- attack.discovery
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4656
    - 4663
    ObjectType: 'Key'
    ObjectName: '\REGISTRY\MACHINE\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent'
  filter:
    ProcessName|contains:
    - 'Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe'
    - 'Microsoft.Identity.Health.Adfs.InsightsService.exe'
    - 'Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe'
    - 'Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - 'Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious access attempts to the registry key associated with the Azure AD Health Monitoring Agent. This activity is significant as an attacker may attempt to manipulate the monitoring agent to create backdoors, disable critical monitoring functions, or reconfigure security settings. By monitoring Event IDs 4656 and 4663, the rule captures access permissions to this sensitive registry key that, if tampered with, could indicate unauthorized operations or potential compromise.

  The likely threat scenario involves an attacker attempting to gain a foothold within the enterprise's Azure AD environment through malicious manipulation of monitoring and diagnostic tools. The primary objective may be to disable alerts or to evade detection by existing monitoring tools. Relevant MITRE ATT&CK tactics include **Discovery** (T1012), which pertains to techniques for gathering information related to system security measures, and potentially **Privilege Escalation** if the attacker is manipulating access controls.

  Primary data sources for effective detection include Windows security event logs, specifically those that relate to registry access, which provide insights into who accessed what and when.

  ### Investigation Steps
  - **Review Security Event Logs**: Analyze Windows security event logs for Event IDs 4656 and 4663 related to the specified registry key. Pay close attention to the account performing the access and the time of the event.
  - **Correlate Process Activity**: Investigate the associated process names that are listed in the filter. Any successful access logs from the specified processes should be closely scrutinized for signs of legitimate administrative actions versus malicious intent.
  - **Examine Access Control Lists**: Verify the access control entries (ACE) on the SACL for the registry key in question. Ensure that only authorized accounts have permissions to access or modify the Health Monitoring Agent registry key.
  - **Cross-Reference with User Activity**: Cross-reference the time of the suspicious access events with user activity logs to determine if there were any legitimate administrative actions that could explain the registry access or if it corresponds with other anomalous behavior.

  ### Prioritization
  This alert is of **medium severity** due to its potential impact on the security posture of Azure AD environments. While the activity itself may not denote immediate compromise, it suggests attempts to manipulate critical security components, leading to possible future risks.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if the system access control list (SACL) is not configured correctly or if the relevant logging is not enabled prior to an incident. The detection logic assumes that access to the registry key is indicative of malicious intent when it may also represent legitimate administrator actions. For the alert to function optimally, access control settings need to be appropriately configured, and the corresponding security event logging must be enabled and retained to capture all relevant access events.

