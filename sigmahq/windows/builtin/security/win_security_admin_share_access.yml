note: |
  ### Technical Context

  This Sigma rule detects access events to the ADMIN$ network share on Windows systems, which is typically used for administrative tasks such as remote management and file sharing. The likely adversary objective includes lateral movement within the network to gain further access or execute payloads, targeting the ADMIN$ share can provide an attacker with the necessary privileges to manipulate files on the system. This activity corresponds with the MITRE ATT&CK tactic for Lateral Movement (TA0008), specifically technique T1021.002 (Remote Services: Windows Admin Shares).

  The primary telemetry source is Windows Security logs, specifically Event ID 5140, which must be enabled via the "Audit File Share" policy. If this activity is malicious, it can lead to unauthorized access and potential exfiltration or modification of sensitive data on the target system. However, it is essential to note that this detection does not confirm whether the access was actually malicious or legitimate administrative activity by authorized personnel.

  ### Investigation Steps

  - **Check access time and user credentials:** Review Event ID 5140 for `TimeGenerated`, `SubjectUserName`, and `NetworkPath`. Legitimate access often occurs during business hours with known admin accounts. Compare against expected file share access patterns for your environment.

  - **Verify the source IP:** Investigate the originating IP address associated with Event ID 5140. Malicious activity may originate from unexpected or unauthorized sources, such as non-administrative workstations or external IPs.

  - **Inspect the authentication method:** Look for Event ID 4624 (successful login) tied to the same `SubjectUserName` to determine if access was via a legitimate connection. Unexpected authentication methods or accounts can indicate potential misuse.

  - **Identify changes made on the share:** Cross-reference file system changes using Sysmon Event ID 10 (FileCreate) and look for newly created or modified files within the ADMIN$ directory during the access timeframe. Legitimate activity usually involves known maintenance tasks.

  - **Cross-check with other administrative logs:** Review Windows PowerShell logs (Event ID 4104) for scripts executed around the time of the ADMIN$ access. Scripts initiated by legitimate admins often follow a documented change management process.

  ### Prioritization

  This alert is categorized as low severity given that it can result from routine administrative actions; however, the potential for malicious lateral movement exists, particularly if the access deviates from normal behavior patterns. The likelihood of abuse is moderate, especially in environments where administrative shares are frequently targeted by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper auditing configurations, as “Audit File Share” must be enabled to log this event. Legitimate administrative activities, such as system updates or maintenance routines, can trigger the alert and should be distinguished from malicious actions. Companion detections include lateral movement telemetry from tools like Sysmon or monitoring for unusual RDP access patterns, which can enhance overall detection capabilities.

