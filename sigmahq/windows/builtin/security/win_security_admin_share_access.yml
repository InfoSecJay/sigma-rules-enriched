note: |
  ### Technical Context
  This detection rule identifies unauthorized access to the ADMIN$ network share on Windows machines, typically utilized for remote administration purposes. Attackers may exploit access to the ADMIN$ share to execute commands, deploy malware, or move laterally within the network, thus elevating their reach and compromising sensitive systems. This behavior is often associated with post-exploitation scenarios where the attacker seeks to establish persistence and exploit administrative privileges within the environment.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Lateral Movement** (T1080): The act of moving through a network to gain access to additional systems.
  - **T1021.002**: Remote Services: SMB/Windows Admin Shares, which focuses specifically on utilizing SMB shares for administrative tasks.

  Primary data sources that provide valuable evidence for this detection include:
  - Windows Security Event Logs, specifically Event ID 5140, which logs file share access.
  - Configuration logs confirming the audit policy settings on systems to ensure tracking of file share access events.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Security Event ID 5140 logs for any unexpected access to the ADMIN$ share, noting the source IP address and user account involved.
  - **Assess User Permissions**: Verify the permissions of the user account accessing ADMIN$ to ensure it has appropriate authorization and is not a service or system account.
  - **Identify Lateral Movement**: Look for other related events that might indicate lateral movement, such as unsuccessful login attempts or suspicious activity on other administrative shares.
  - **Check for Anomalies**: Investigate any anomalies in SMB traffic patterns, focusing on access attempts outside of standard operating hours or from unrecognized hosts.

  ### Prioritization
  This alert has a low priority level but should not be ignored. Access to the ADMIN$ share may indicate legitimate administrative activity; however, it also poses a significant risk for lateral movement and privilege escalation if performed by an unauthorized user.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the audit policy for Object Access > Audit File Share is not properly configured across all systems. The detection logic assumes that access attempts that do not come from standard administrative accounts are potentially malicious. Additionally, the functionality of this alert relies on capturing Windows Security Event Logs, specifically Event ID 5140, which may not be present if logging settings are misconfigured or if log retention policies are not set adequately.

