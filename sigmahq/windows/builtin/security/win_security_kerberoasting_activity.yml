title: Kerberoasting Activity - Initial Query
id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
status: test
description: |
  This rule will collect the data needed to start looking into possible kerberoasting activity.
  Further analysis or computation within the query is needed focusing on requests from one specific host/IP towards multiple service names within a time period of 5 seconds.
  You can then set a threshold for the number of requests and time between the requests to turn this into an alert.
references:
- https://www.trustedsec.com/blog/art_of_kerberoast/
- https://adsecurity.org/?p=3513
author: '@kostastsale'
date: 2022-01-21
modified: 2025-10-19
tags:
- attack.credential-access
- attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    Status: '0x0'     # Translated as status from failure code field. Query only for successes
    TicketEncryptionType: '0x17'     # RC4 ticket encryption type
  filter_main_krbtgt:
    ServiceName|endswith:
    - 'krbtgt'         # Ignore requests for the krbtgt service
    - '$'         # Ignore requests from service names that end with $ which are associated with genuine kerberos traffic
  filter_main_machine_accounts:
    TargetUserName|contains: '$@'     # Ignore requests from machines
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legacy applications.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious Kerberoasting activity by monitoring for failed authentication requests for Kerberos service tickets. The likely attacker objective is to obtain service account credentials for lateral movement or privilege escalation. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1558.003). Primary telemetry sources are Windows Security Event Logs, specifically Event ID 4769 for ticket requests. If malicious, this activity poses a serious security threat, as it can enable attackers to gain unauthorized access to critical systems and data. However, this detection does NOT confirm successful credential extraction; it only indicates attempts to request service tickets.

  ### Investigation Steps

  - **Review Event ID 4769 logs**: Check for multiple occurrences from the same host/IP targeting different service names within a 5-second timeframe. This indicates potential Kerberoasting behavior. Look for entries with `Status: '0x0'` and `TicketEncryptionType: '0x17'`.

  - **Validate service names**: Assess the `ServiceName` field; requests ending with `$` or containing `krbtgt` should be excluded as they are legitimate Kerberos traffic. Document legitimate services for baseline comparisons.

  - **Identify suspicious configurations**: Examine accounts earning service tickets; ensure no machine accounts (`TargetUserName|contains: '$@'`) or other benign origins are generating excessive requests. Cross-reference against documented service accounts.

  - **Look for patterns of abuse**: Investigate any prior history of suspicious activity related to the involved endpoints. Legitimate actions typically involve limited frequency (e.g., typical requests for password resets or service initialization).

  - **Correlate with additional alerts**: Cross-check with related detections, such as failed login attempts (Event ID 4625) and abnormal account usage, to contextualize the behavior and assess the risk of the alerts.

  ### Prioritization

  The alert is of medium severity due to the potential impact on critical system integrity if Kerberoasting is successful. The behavior is likely malicious, particularly if observed in a domain with a higher number of service accounts. As this technique is a known method for attackers to gather credentials, it requires prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques if attackers employ sophisticated methods such as mimicking legitimate service accounts or if systems are misconfigured to exclude relevant logs. Ensure that Windows Security Logs are fully enabled, and consider companion detection for abnormal account activity (e.g., unusual logon times or locations). Legitimate administrative actions involving service accounts may also generate similar Kerberos ticket requests and should be reviewed in context.

