note: |
  ### Technical Context

  This Sigma rule detects unauthorized access to the `protected_storage` service via the network. Such access is commonly associated with adversaries attempting to extract sensitive information, specifically domain backup keys, from Domain Controllers using the Data Protection API (DPAPI). This activity correlates with the MITRE ATT&CK tactic of Lateral Movement, particularly the technique ID T1021.002 (Remote Services: SMB/Windows Admin Shares).

  The primary telemetry source for this detection is the Windows Security Event Log, specifically event ID 5145, which captures file share access attempts. If the access is malicious, it could lead to unauthorized access to critical domain credentials, posing a significant security risk to the entire enterprise network. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate access may trigger this event under certain circumstances.

  ### Investigation Steps

  - **Check for Event ID 5145:** Review Security Event Log for Event ID 5145. Focus on events with ShareName containing 'IPC' and RelativeTargetName equal to 'protected_storage' to identify potential unauthorized access attempts.

  - **Identify source IP address:** Analyze the event details for the SourceNetworkAddress field. Determine if the request originates from trusted internal sources or from anomalous or untrusted external IP addresses that warrant further investigation.

  - **Assess user account activity:** Investigate the user account associated with the access. Legitimate access would typically involve administrative accounts or service accounts; any access by non-administrative user accounts may indicate potential abuse.

  - **Cross-reference with authenticated sessions:** Check the Windows Session logs (Event ID 4624). Verify if the accessing user account was authenticated recently and if the session aligns with typical administrative workflows or scheduled tasks.

  - **Monitor subsequent activities:** If malicious access is confirmed, review subsequent logs for related suspicious behavior (e.g., attempts at accessing sensitive directories or initiating service account activity) to assess potential exfiltration or credential dumping.

  ### Prioritization

  This alert is of high severity due to its potential to expose critical domain credentials, leading to significant breaches of network security. The likelihood of malicious abuse is heightened, especially as this behavior is often weaponized by adversaries during lateral movement phases.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental configurations where logging for Event ID 5145 is not adequately enabled or where access to `protected_storage` is legitimate due to administrative practices. Some legitimate applications or scripts may also access this service. Companion detections such as monitoring for Event ID 4648 (Logon Attempt via Explicit Credentials) could strengthen coverage and validate access attempts further.

