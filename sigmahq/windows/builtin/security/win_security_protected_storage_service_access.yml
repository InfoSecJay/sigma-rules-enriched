note: |
  ### Technical Context
  This detection rule identifies unauthorized access to the "protected_storage" service, which is often a sign of an attacker attempting to exploit the Data Protection API (DPAPI). The objective of such access typically involves extracting sensitive data, such as domain backup keys from Domain Controllers, which could facilitate further attacks on the network, such as privilege escalation or lateral movement within the environment. Attackers may use this technique to gain unauthorized access to critical resources and maintain persistence within the network.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include **Lateral Movement (TA-0031)** and **Credential Dumping (T1003.002)**. The detection logic specifically looks for Windows Security Event ID 5145, which corresponds to network share access attempts, focusing on those where the share name contains 'IPC' and the target name is "protected_storage."

  Primary data sources include Windows Security Event Logs, where Event ID 5145 is logged, providing vital evidence of access attempts to network shares. Monitoring these logs can help identify potentially malicious activities by analyzing request patterns and correlating them with known attack behaviors.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Security Event Logs for Event ID 5145, specifically looking for accesses to the "protected_storage" service to determine the source, account, and timing of the access.
  - **Correlate with User Activity**: Examine user behavior and activity around the time of the access, particularly focusing on account privileges and whether any accounts involved show signs of compromise or anomalous behavior.
  - **Inspect Network Traffic**: Capture and analyze network traffic to assess any unusual communication patterns or attempts to access the protected storage service from unauthorized locations or devices.
  - **Check System Integrity**: Investigate the integrity of the Domain Controllers and review system integrity logs for changes that could indicate a compromised state as a result of the access to the DPAPI.

  ### Prioritization
  This alert should be treated as high severity due to the potential impact of accessing sensitive storage services that can lead to the extraction of domain backup keys. Successful exploitation of this vulnerability could allow attackers to gain elevated privileges and move laterally within the enterprise environment, posing significant risks to the overall security posture.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging for Event ID 5145 is not enabled or configured properly across all relevant systems. Moreover, the detection logic assumes that the presence of this specific access pattern is indicative of malicious behavior, which might not always be the case in legitimate administrative tasks. Required logs include detailed Windows Security Event Logs that capture access events, and all configurations must permit logging of this level of detail to ensure effective detection.

