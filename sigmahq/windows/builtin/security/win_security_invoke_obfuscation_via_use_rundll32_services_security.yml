detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ServiceFileName|contains:
    - value
    - invoke
    - comspec
    - iex
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of `rundll32.exe` to invoke obfuscated PowerShell commands, indicating potential malicious execution behavior. An attacker may use this technique to bypass conventional security controls while executing payloads or scripts remotely, often aiming for persistence or lateral movement within a network. This behavior aligns with the MITRE ATT&CK techniques for Execution (T1059.001 - PowerShell) and Defense Evasion (T1027 - Obfuscated Files or Information).

  Primary telemetry comes from Windows Event ID 4697, which logs service installation events. If this activity is confirmed as malicious, it can lead to unauthorized access, data exfiltration, or system compromise. However, this detection alone does not prove malicious intent without corroborating contextual information, such as the execution context of the command.

  ### Investigation Steps

  - **Check Event ID 4697 logs:** Review Windows Security Event ID 4697 for service creation related to `rundll32.exe` executed with parameters containing keywords such as `invoke`, `value`, or `iex`. Confirm if the service was created within a suspicious timeframe or unusual behavior.

  - **Analyze command-line arguments:** Examine any command-line arguments associated with the `rundll32.exe` process. Look for unusual or obfuscated strings, such as those starting with `get-`, `invoke-`, or containing excessive use of `&&`. Use Sysmon Event ID 4688 for detailed command-line logging.

  - **Validate legitimate usage:** Identify typical uses of `rundll32.exe` in your environment. If it is being employed for functions related to legitimate software installations, that may indicate innocence, especially if paired with Event ID 4688 showcasing processes like software updates.

  - **Correlate with IT management systems:** Cross-reference the logs against known management and update tasks occurring within the enterprise to identify common benign service creation patterns. Alert on the uncommon use of `rundll32.exe` with unusual arguments outside of these contexts.

  - **Identify high-confidence indicators:** Look for additional indicators, such as network activity associated with launched `rundll32.exe` commands. Investigate connections to known malicious IPs or domains using a threat intelligence feed or firewall logs.

  - **Assess recent user behavior:** Review user account logins around the time of the alert to identify anomalies or unauthorized access. Check for abnormal logon types (e.g., multiple failed logons or logons outside of normal hours) in Security Event ID 4625.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of a compromise on the affected system, which could lead to data loss or network infiltration. The likelihood of this behavior being malicious is high, as using `rundll32.exe` with obfuscated commands is often a tactic utilized by attackers to evade security measures.

  ### Blind Spots and Assumptions

  The detection may be bypassed through obfuscation techniques that do not utilize recognizable command patterns or legitimate use of `rundll32.exe` in internal applications. Reliable detection requires proper logging configuration and monitoring of Event ID 4697 and the related command lines. Common benign activities may include authorized software installations or system updates utilizing `rundll32.exe`. A related detection to consider is monitoring for unusual outbound connections following the execution of these commands, which may indicate a command and control (C2) attempt.

