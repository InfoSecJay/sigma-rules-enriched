detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ServiceFileName|contains:
    - value
    - invoke
    - comspec
    - iex
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the `rundll32` command in PowerShell scripts, particularly when obfuscation techniques are employed. The use of `rundll32` can indicate attempts to execute malicious code covertly, leveraging its capabilities as a legitimate Windows utility to run DLL files with a specified entry point. Attackers often use obfuscation to mask their intentions and make their activities more difficult to detect, thus attempting to evade security controls.

  The most likely objective of such activities is to execute remote code or initiate payloads that could facilitate the establishment of persistence, exfiltration of data, or lateral movement within a network. This behavior aligns closely with the MITRE ATT&CK framework, specifically the following tactics and techniques:
  - **Execution (T1059.001)**: Scripting - PowerShell
  - **Defense Evasion (T1027)**: Obfuscated Files or Information

  Primary data sources for detecting this behavior include Windows Security logs, specifically Event ID 4697 which logs the creation of a service, combined with telemetry from EDR solutions that can observe process creation events.

  ### Investigation Steps
  - **Review Event Logs**: Collect and analyze Windows Security logs for Event ID 4697 to identify any suspicious service creations involving `rundll32` and any obfuscated command line arguments.
  - **Examine Process Trees**: Investigate the process tree to trace the execution flow leading to the creation of the `rundll32` process, looking for anomalous parent-child relationships that may indicate an attacker's methodology.
  - **Analyze PowerShell Logs**: If available, scrutinize PowerShell logs to identify any obfuscated scripts or commands that invoke `rundll32`, paying particular attention to the use of malicious parameters.
  - **Check for External Connections**: Monitor for any unusual outbound connections initiated by the `rundll32` process, indicating potential data exfiltration or command-and-control communication.

  ### Prioritization
  This alert should be treated with high priority due to its association with obfuscated execution techniques that can lead to significant impacts, such as data compromise, unauthorized access, or the deployment of further malicious payloads.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Event ID 4697 is not enabled or monitored across all relevant systems. The detection logic assumes that obfuscated scripting will be evident in the naming patterns used within the service file names. Additionally, reliance on Windows Security logs means that any configurations or permissions preventing these logs from being written could lead to gaps in detection capabilities. Properly configured audit policies are essential for the successful operation of this alert.

