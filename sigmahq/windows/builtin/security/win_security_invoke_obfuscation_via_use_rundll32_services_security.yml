note: |
  ---

  ### Technical Context

  The rule detects the invocation of obfuscated PowerShell commands through `rundll32`, typically employed in evasion tactics to execute malicious scripts. This behavior is commonly used to bypass application whitelisting controls. The primary MITRE ATT&CK tactics relevant to this detection are **Defense Evasion** (T1203) and **Execution** (T1059.001). The main telemetry source for this detection is Windows Security Event 4697, which logs when services are created.

  If malicious, this behavior could lead to unauthorized access, data exfiltration, and system compromise. Importantly, this detection alone does NOT confirm that malicious activity has occurred. Further analysis is needed to establish context and intent.

  ---

  ### Investigation Steps

  - **Check Event ID 4697 Logs**: Review Windows Security event logs for Event ID 4697 related to service creation. Look for entries containing `rundll32`, `shell32.dll`, or `shellexec_rundll`. Confirm that it’s not part of legitimate service installation.

  - **Identify PowerShell Execution**: Verify additional logs for PowerShell execution, specifically looking for CommandLine arguments using `iex`, `invoke`, or heavily obfuscated commands. Use PowerShell Operational logs to trace any suspicious execution paths.

  - **Validate Service Paths**: Examine the path of the service associated with the Event ID 4697 log entry. Legitimate services typically use system folders (e.g., `C:\Windows\System32`). Path deviations may indicate malicious intent.

  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence sources to check if the hash or command patterns correspond to known malicious activity. High-confidence indicators might match identified threat actor behaviors.

  - **Monitor for Additional Dependencies**: Investigate if other obfuscation techniques or associated processes are triggered. Cross-reference with Sysmon logs to identify if there are parent-child process relationships indicative of the obfuscation technique.

  - **Assess User Context**: Evaluate the user account context that triggered the alert. Unprivileged accounts executing these commands may indicate misuse, whereas a system account might represent normal operations if properly vetted.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact resulting from malicious PowerShell executions facilitated through `rundll32`. The likelihood of abuse is high as this technique is frequently weaponized by adversaries to evade detection.

  ---

  ### Blind Spots and Assumptions

  This detection may miss unique obfuscation techniques not captured in the specified string patterns. Reliable detection requires that Windows Security auditing is properly configured to log Event ID 4697. Normal administrative tasks or legitimate software installations might inadvertently trigger this alert, which necessitates contextual evaluation. A related detection to monitor is for malicious PowerShell command execution (T1059.001) to provide additional context for potential threats.

