note: |
  ### Technical Context
  This rule detects the unauthorized transfer of files containing credential data via network shares, specifically targeting sensitive Windows files that could contain user passwords and security information. The threat scenario usually involves an attacker attempting to exfiltrate credentials or sensitive data that can facilitate further exploitation or lateral movement within the network. The attacker’s objective is likely to gain persistent access to systems or escalate privileges in order to reach high-value assets.

  Relevant MITRE ATT&CK tactics and techniques include Credential Access (TA0006) and specific techniques such as Credential Dumping using LSASS (T1003.001), DCOM Credential Dumping (T1003.002), and Memory Dumping with Minidumps (T1003.003). These techniques are often employed by attackers to obtain sensitive credentials needed for advanced attacks.

  Primary data sources for this detection are Windows Security Event Logs, specifically Event ID 5145, which logs file share access, and network monitoring tools that can capture file transfer activities across network shares.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Security Event Logs for Event ID 5145 to identify instances of file access from network shares that may involve sensitive credential files.
  - **Analyze Target Files:** Investigate any files transferred that include known sensitive filenames (e.g., ntds.dit, SAM, and SYSTEM) to determine the context of the file transfer and the legitimacy of the accessing user account.
  - **Monitor User Activities:** Correlate the file access events with user logins and other activities that may indicate unusual behavior or privilege escalations, especially for accounts not typically accessing these files.
  - **Check Network Share Configurations:** Validate the permissions and access controls on network shares to ensure they align with organizational policy, focusing on sensitive files that shouldn't be accessible to most users.

  ### Prioritization
  The severity of this alert is medium, as the transfer of credential-related files poses a significant threat to information security and can facilitate further unauthorized access or attacker persistence within the network. However, it is crucial to differentiate between malicious behaviors and legitimate administrative actions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, especially if log collection is not comprehensive for network file shares or if files are accessed through legitimate administrative actions not captured by the monitored event logs. The detection logic assumes that suspicious file names or paths may indicate malicious intent without considering the context of administrative tasks. Required configurations include ensuring that security event logging for file share access is enabled and that all relevant network share activities are being logged appropriately.

