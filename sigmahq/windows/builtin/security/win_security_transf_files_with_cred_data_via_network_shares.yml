note: |
  ### Technical Context

  This Sigma rule detects file transfers involving sensitive credential data through network shares, focusing on specific file paths that indicate potential credential harvesting activities. The likely attacker objective is to access or exfiltrate critical credential data from systems, which could grant elevated privileges in the network environment. The relevant MITRE ATT&CK tactics and techniques include Credential Access (TA0006), specifically Credential Dumping (T1003.001, T1003.002, T1003.003).

  Primary telemetry sources include Windows Security event logs, particularly Event ID 5145, which records file share access events. If malicious, the security impact can be severe, as it could facilitate unauthorized access to key resources. This detection alone does not confirm that unauthorized access has occurred; it merely indicates attempts to transfer potentially sensitive files.

  ### Investigation Steps

  - **Review event details for Event ID 5145**: Check logs for access instances to sensitive files like `\mimidrv`, `\lsass`, and `Windows\System32\config\SAM`. Look specifically at the "Relative Target Name" and "Security ID" fields to identify users involved.

  - **Analyze source and destination**: Identify the source machine and user account attempting the transfer. Legitimate administrative actions will typically involve known accounts (e.g., domain admins) and recognized systems. Unfamiliar accounts or systems may indicate potential misuse.

  - **Correlate with previous behavior**: Investigate the user’s historical actions, especially related to administrative tasks. Regular maintenance or security tasks may justify similar file accesses, while unfamiliar access patterns can suggest malicious intent.

  - **Examine potential malware presence**: Conduct a scan of the source host for known malware signatures or indicators of compromise (IOCs) associated with credential theft techniques such as mimikatz, corroborated by Event ID 4688 for suspicious process creation patterns.

  - **Verify legitimate administrative activity**: Confirm whether the file transfer aligns with legitimate activities. For example, administrative scripts or automated tools transferring backup files to known locations may not be suspicious.

  ### Prioritization

  This alert is prioritized as medium severity due to the potential for significant impact if sensitive credentials are accessed or exfiltrated. The likelihood of malicious abuse is high, given the nature of the files involved, which are commonly targeted by adversaries looking to escalate privileges and facilitate further attacks.

  ### Blind Spots and Assumptions

  Limitations of detection may include evasion techniques such as legitimate users performing sanctioned actions that trigger similar alerts, leading to false positives. The detection relies on the configuration of Windows Security logs and proper monitoring of network share access. Activities like legitimate administrative transfers may trigger the rule, so context is vital. A related detection, such as monitoring for unusual PowerShell activity (T1059.001), can strengthen coverage against credential harvesting attempts in combination with file transfer alerts.

