title: Powerview Add-DomainObjectAcl DCSync AD Extend Right
id: 2c99737c-585d-4431-b61a-c911d86ff32f
status: test
description: Backdooring domain object to grant the rights associated with 
  DCSync to a regular user or machine account using 
  Powerview\Add-DomainObjectAcl DCSync Extended Right cmdlet, will allow to 
  re-obtain the pwd hashes of any user/computer
references:
- https://twitter.com/menasec1/status/1111556090137903104
- https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf
author: Samir Bousseaden, Roberto Rodriguez @Cyb3rWard0g, oscd.community, Tim 
  Shelton, Maxence Fossat
date: 2019-04-03
modified: 2022-08-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1098
logsource:
  product: windows
  service: security
  definition: 'Requirements: The "Audit Directory Service Changes" logging policy
    must be configured in order to receive events. Audit events are generated only
    for objects with configured system access control lists (SACLs). Audit events
    are generated only for objects with configured system access control lists (SACLs)
    and only when accessed in a manner that matches their SACL settings. This policy
    covers the following events ids - 5136, 5137, 5138, 5139, 5141. Note that the
    default policy does not cover User objects. For that a custom AuditRule need to
    be setup (See https://github.com/OTRF/Set-AuditRule)'
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'ntSecurityDescriptor'
    AttributeValue|contains:
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
    - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter_main_dns_object_class:
    ObjectClass:
    - 'dnsNode'
    - 'dnsZoneScope'
    - 'dnsZone'
  condition: selection and not 1 of filter_main_*
falsepositives:
- New Domain Controller computer account, check user SIDs within the value 
  attribute of event 5136 and verify if it's a regular user or DC computer 
  account.
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to modify the access control list (ACL) of Active Directory (AD) objects to grant DCSync rights to regular users or machine accounts via the PowerView cmdlet `Add-DomainObjectAcl`. The likely attacker objective is to increase privileges by allowing unauthorized retrieval of password hashes, facilitating further lateral movement and credential harvesting. Relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)** and **Persistence (TA0003)**, with the specific technique being **"Domain Trust Modification" (T1098)**. The primary telemetry source is Windows Security logs, specifically Event ID 5136, which logs changes to AD objects. If malicious, this behavior can enable an attacker to maintain persistent access and extract sensitive data from the domain. However, this detection alone does not confirm that the activity was performed by an attacker; it could also be the result of legitimate administrative actions.

  ### Investigation Steps

  - **Review Event ID 5136 for changes:** Examine the log entry associated with Event ID 5136 to identify changes made to the `ntSecurityDescriptor` attribute. Focus on the `AttributeValue` field to find the specific GUIDs associated with DCSync rights.

  - **Validate user or machine account origins:** Cross-reference the Security Identifier (SID) within the `ntSecurityDescriptor` change against known users or machine accounts. Verify if the SID belongs to a regular user or is an authorized domain controller.

  - **Identify legitimate administrative actions:** Investigate recent administrative tasks or change requests involving ACL modifications to verify if this change corresponds with a legitimate line of business, which may involve reviewing change logs or incident tickets.

  - **Check concurrent suspicious actions:** Look for other suspicious logs during the same timeframe such as failed logins (Event ID 4625) or unusual account activity. This may indicate a broader attack strategy being employed concurrently.

  - **Assess unauthorized object modifications:** Confirm if other critical AD objects, apart from those indicated by the rule, have been modified during or around the same timestamp, which could suggest an extensive compromise.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the security of the domain. Granting DCSync permissions can lead to full domain takeover, making it a high-risk behavior. The likelihood of this tactic being malicious is significant, as it is frequently weaponized in post-exploitation scenarios by adversaries aiming to harvest credentials.

  ### Blind Spots and Assumptions

  Detection may be limited by the necessity for correctly configured audit policies, specifically "Audit Directory Service Changes," which must be enabled to capture relevant events. Evasion techniques may include legitimate administrative changes that mimic malicious behavior. Additionally, standard operations such as AD role reassignments might trigger this alert and should be carefully differentiated from actual compromises. A related detection to enhance coverage involves monitoring for unusual domain account creations or privilege escalations during the same period to identify patterns of abuse.

