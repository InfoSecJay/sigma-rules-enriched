title: User Couldn't Call a Privileged Service 'LsaRegisterLogonProcess'
id: 6daac7fc-77d1-449a-a71a-e6b4d59a0e54
status: test
description: The 'LsaRegisterLogonProcess' function verifies that the 
  application making the function call is a logon process by checking that it 
  has the SeTcbPrivilege privilege set. Possible Rubeus tries to get a handle to
  LSA.
