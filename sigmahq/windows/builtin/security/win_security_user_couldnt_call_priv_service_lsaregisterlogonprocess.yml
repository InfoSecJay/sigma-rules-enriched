note: |
  ### Technical Context
  This detection rule identifies attempts by unauthorized applications to call the `LsaRegisterLogonProcess` function, which is a key component in the Windows Local Security Authority (LSA) responsible for verifying logon processes. When legitimate applications invoke this function, they should have the appropriate `SeTcbPrivilege`. However, the detection of failure in this context can indicate malicious behavior, particularly by tools like Rubeus, which is known for manipulating LSA to achieve credential dumping and lateral movement objectives.

  In this threat scenario, an attacker may seek to bypass security controls by impersonating a legitimate logon process. This behavior is critical for stealth operations since success could allow the attacker to capture credentials or escalate privileges without detection. The relevant MITRE ATT&CK techniques associated with this activity include **Abuse Elevation Control Mechanism** (T1548.003), **Credential Access** (TA0006), and **Lateral Movement** (TA0008).

  The primary data sources for this detection are Windows security logs, specifically Event ID 4673, which logs sensitive service-related events, and indicates if a process invoked an unauthorized service call.

  ### Investigation Steps
  - **Review Security Logs**: Examine Windows Security event logs for Event ID 4673 entries that correspond with the `LsaRegisterLogonProcess()` failures. Look for anomalies or patterns in the processes attempting to register.
  - **Correlate with Process Creation Events**: Analyze process creation logs around the same timeframe as the detected failures to identify which processes are attempting to interact with LSA and whether they are legitimate.
  - **Identify Unusual User Activity**: Investigate any user accounts that triggered the detected events to assess if they are known or authorized to execute processes that require `SeTcbPrivilege`.
  - **Assess Network Behavior**: If NDR (Network Detection and Response) tools are available, check for unusual outbound connections from affected machines, particularly targeting authentication servers or lateral movement indications.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to leverage failed LSA calls for credential theft and privilege escalation, which can lead to significant security incidents in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the appropriate logging settings are not enabled within Windows Security logs. The logic for this detection assumes that any failure with `LsaRegisterLogonProcess()` indicated by the `0x8010000000000000` keyword is indicative of malicious activity; however, legitimate applications could also trigger this event under certain configurations or operational scenarios. Maintaining comprehensive logging and ensuring that critical Windows Security Auditing is enabled is essential for accurate detection of this behavior.

