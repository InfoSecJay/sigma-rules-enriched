note: |
  ### Technical Context
  This detection rule is focused on monitoring the creation of new trust relationships within a Windows domain environment, specifically through the logging of Event ID 4706. The establishment of new trusts is a rare occurrence and can indicate potential malicious activity, such as an attacker attempting to escalate privileges or create persistence mechanisms by linking compromised accounts or systems to trusted domains. Attackers may leverage this capability to gain broader access or facilitate lateral movement across the network.

  The rule aligns with several MITRE ATT&CK tactics, primarily focusing on **Persistence** (TA0003) and **Privilege Escalation** (TA0004). Techniques involved include **Create Account** (T1136) and **Active Directory Trust Exploitation** (T1098), both of which highlight the risk associated with unauthorized trust relationships. Key data sources for identifying this behavior include Windows Security Event logs, specifically those tracking changes in Active Directory.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Security Event logs for Event ID 4706 to identify any recent trust creations, noting the source account and timestamp.
  - **Correlate with Active Directory Changes**: Check for associated changes in Active Directory configuration around the same time, such as modifications to user attributes or group memberships that might indicate compromise.
  - **Assess Source of Trust Creation**: Investigate the originating accounts for the trust creation event, looking for patterns suggestive of credential theft or misuse.
  - **Verify Trust Relationships**: Validate the legitimacy of the newly created trust relationships by consulting with the Active Directory team to determine if these changes were authorized.

  ### Prioritization
  Alerts triggered by this rule are considered medium severity due to the potential for unauthorized privilege escalation or persistence mechanisms, which could lead to significant risk if exploited by an attacker.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if the logging of Event ID 4706 is not enabled on all domain controllers or if administrative actions around trust relationships are conducted outside the typical security monitoring policies. The detection logic assumes that any creation of trust relationships not pre-approved by the security team is suspicious. It also relies on adequate Windows Security log retention and configurational integrity for accurate event logging.

