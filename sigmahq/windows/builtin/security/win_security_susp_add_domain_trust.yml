note: |
  ### Technical Context

  This rule detects the creation of a new trust relationship between domains, which is logged under Windows Security Event ID 4706. The likely objective of an attacker leveraging this behavior is to escalate privileges or establish persistence in an environment by creating trusted connections with other domains. This relates to the MITRE ATT&CK techniques for Privilege Escalation (T1068) and Persistence (T1098). The primary telemetry source is the Windows Security log, specifically focusing on Event ID 4706 for changes to trust relationships. If malicious, the impact could allow unauthorized access to resources across trusted domains, potentially leading to domain escalation or lateral movement. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities can also result in new trust relationships.

  ### Investigation Steps

  - **Check Event ID 4706 details:** Review the specific Event ID 4706 that triggered the alert for details like the source and target domains, as well as the user account executing the action, focusing on unrecognized or suspicious domain pairs.

  - **Review user account activity:** Investigate the user account associated with the trust creation for unusual activity or recent privilege escalations. Validate against logon events (Event ID 4624) to determine if the user was operating normally prior to the trust creation.

  - **Analyze domain relationships:** Use Active Directory tools to enumerate existing trust relationships. Determine if the new trust is legitimate or if it deviates from normal domain trust patterns, checking for any non-standard configurations.

  - **Identify legitimate administrative actions:** Confirm recent administrative changes or planned integrations that could justify the trust creation. Contact the IT administration team to verify if this action aligns with organizational policies and practices.

  - **Check for related security events:** Review other security logs surrounding the time of the trust creation (e.g., account management events - Event IDs 4720, 4726) that may indicate concurrent suspicious activities like new account creations or deletions.

  ### Prioritization

  This alert is of medium severity, as the creation of a trust relationship could indicate potential privilege escalation pathways. The likelihood of malicious abuse is moderate, particularly in environments where attackers may seek lateral movement opportunities. Trust relationships are not commonly weaponized but can be critical indicators of escalation efforts if misused.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate users with administrative privileges, leading to false positives. Required log sources include the Windows Security logs with proper audit policy settings enabled for trust relationship auditing. Organizational changes or legitimate integrations may trigger this alert. Complementary detections for account management or domain enumeration activities further enhance visibility on potential malicious behavior.

