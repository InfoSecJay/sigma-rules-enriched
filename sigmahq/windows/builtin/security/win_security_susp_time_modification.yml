note: |
  ### Technical Context

  This Sigma rule detects unauthorized modification of system time on Windows machines, specifically by applications or users not flagged as legitimate by the detection filters. The likely attacker objective includes the manipulation of timestamps to conceal malicious activity or to enable evasion of detection mechanisms. This behavior aligns with the MITRE ATT&CK framework, particularly with the **Defense Evasion** tactic (T1070.006). The primary telemetry source for this rule is Windows Security Logs with Event ID **4616**, which captures changes made to the system time. If the activity is malicious, it could result in inaccurate timestamps on logged events, making forensic investigations difficult. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also change system time.

  ### Investigation Steps

  - **Check for Event ID 4616:**
    Review the Windows Security Logs for Event ID 4616, which indicates a change in system time. Pay attention to the **SubjectUserSid** field to identify if the request was made by a process other than those in the exclusion filters.

  - **Identify the Process Name:**
    Examine the **ProcessName** field in Event ID 4616. Legitimate processes like `svchost.exe` or `vmtoolsd.exe` may change the time, but any other process should raise a red flag for further investigation.

  - **Analyze Time Change Values:**
    Review the **NewTime** field in Event ID 4616 to determine the nature of the time change. Significant backward adjustments, especially at odd hours, can suggest malicious intent.

  - **Correlate with Other Events:**
    Look for correlated suspicious activities in the same timeframe (e.g., login attempts, service manipulations) using Event IDs **4624** (Logon) or **4688** (Process Creation). This can help establish context about what user or application triggered the time change.

  - **Review Relevant Exclusion Lists:**
    Validate against the exclusion criteria for legitimate applications such as VMware or Hyper-V components. If these processes are not involved, treat the activity as potentially malicious.

  - **Assess Asset Criticality:**
    Understand the role of the machine performing the time change. Changes on critical servers (e.g., domain controllers or application servers) should be handled with higher urgency than non-critical endpoints.

  ### Prioritization

  This alert is of **low severity** in the context of non-critical systems but may warrant higher priority on critical assets like domain controllers. The likelihood of malicious abuse exists, particularly in environments where timing manipulation is used to camouflage actions, as attackers often weaponize such tactics to evade detection.

  ### Blind Spots and Assumptions

  This detection may miss subtle evasion techniques where attackers use whitelisted processes for time changes undetected. Reliance on Windows Security Logs means any misconfigured audit policy could result in missed detections. It is important to note that legitimate system activities, such as scheduled administrative tasks or virtual machine services, may trigger this alert. A related detection to consider is **Event ID 4611**, which logs changes to the audit policy, enhancing the coverage of unauthorized system changes.

