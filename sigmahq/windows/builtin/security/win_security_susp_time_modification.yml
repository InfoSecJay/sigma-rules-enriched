note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to system time on Windows systems, specifically through the detection of Security Event ID 4616. The likely attacker objective is to manipulate timestamps for logging, file creation, or event logs, which can aid in evading detection during an attack. This behavior relates to the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Time Manipulation" (T1070.006). The primary telemetry sources are Windows Security logs, specifically focusing on Event ID 4616, which records changes to system time. If malicious, this can severely impact forensic investigations and threat detection capabilities, masking other nefarious activities. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate applications may also modify system time.

  ### Investigation Steps

  - **Check Event ID 4616 logs:** Review Windows Security logs (Event ID 4616) for records indicating time changes, focusing on timestamps, and correlating them with other system activities. Legitimate time changes typically happen via scheduled tasks or during system updates, rather than frequently or in unusual patterns.

  - **Identify suspicious process names:** Look for modifications initiated by processes not excluded in the filters—e.g., processes like `svchost.exe` or `vmtoolsd.exe`. Time modifications initiated by these processes may warrant suspicious review, especially if they are not typically responsible for such actions.

  - **Correlate with user activity:** Identify the SubjectUserSid in Event ID 4616 logs and check for related user logon events (Security Event ID 4624) around the same timeframe. Unauthorized users or service accounts making these changes could indicate malicious intent.

  - **Review virtual machine configurations:** If using Hyper-V or other virtualization technologies, validate that the time modification is indeed legitimate. Compare against expected configurations for time synchronization to eliminate false positives.

  - **Evaluate recent changes or incidents:** Investigate if any recent malware incidents correlate with time modification events. Be aware of sophisticated malware that utilizes time manipulation to obfuscate its activities or execution times.

  ### Prioritization

  This alert has low severity based on its low likelihood of immediate impact on critical systems and operations. However, malicious actors may weaponize time manipulation tactics to conceal their activities, making it important for SOC analysts to investigate thoroughly, especially in sensitive environments.

  ### Blind Spots and Assumptions

  This detection can be evaded if attackers use legitimate system processes not included in exclusions, or if legitimate applications are allowed to modify time without adequate control. A key assumption is that the auditing configurations for relevant Windows Security logs are enabled, which may not always be in place. There could also be false positives from virtualization tools not listed in the filtering criteria. A related detection would involve monitoring scheduled tasks (Security Event ID 4698) for modifications to legitimate behavior alongside time changes.

