note: |
  ### Technical Context
  This detection rule identifies unauthorized modifications to the system time on Windows operating systems. Such alterations can be indicative of various malicious activity including obscuring log timestamps to hinder forensic analysis or bypassing time-based security controls. Attackers may manipulate system time to evade detection, especially in environments where accurate timekeeping is crucial for operations or incident responses.

  The most relevant MITRE ATT&CK tactic for this activity is **Defense Evasion** (TA0005), specifically technique **T1070.006: Clear Command History**. The primary data source for this rule is Windows Security logs, particularly focusing on Event ID 4616, which tracks changes to system time settings. Analysts should be vigilant for any processes, particularly those not typically associated with legitimate time changes, attempting to alter system time without proper authorization.

  ### Investigation Steps
  - **Review Security Logs:** Check Windows Security logs for Event ID 4616 to investigate any unusual changes to system time. Pay attention to the timestamps and the user context of the events.
  - **Identify Processes:** Analyze the processes that triggered the time change. Look for non-standard applications executing around the time of the event and document their execution paths.
  - **Correlate with User Activity:** Examine user activity logs to understand if the change in system time correlates with particular user actions, especially from non-administrative accounts or times of inactivity.
  - **Assess Virtualization Impact:** Determine if the detection is influenced by known virtualization technologies like VMware or Hyper-V causing legitimate changes to the system time and filter those out to reduce false positives.

  ### Prioritization
  Given the potential impact of unauthorized time changes on security controls and forensic investigations, alerts generated by this detection rule should be treated with moderate priority. Such behavior could indicate an ongoing attack or compromise that warrants immediate scrutiny in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate time changes made by approved virtualization tools or other system processes not accounted for in the filter conditions. It operates under the assumption that any alteration not executed by standard processes or secure context is suspicious. Ensuring that the required audit policy for security state changes is configured correctly on all relevant systems is essential for accurate detection. If this audit policy is not enforced, Event ID 4616 may not generate, leading to missed detections.

