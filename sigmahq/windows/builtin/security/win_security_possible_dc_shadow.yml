note: |
  ### Technical Context
  This detection rule identifies potential DCShadow attacks, wherein an attacker attempts to manipulate the Active Directory (AD) by modifying the Service Principal Name (SPN) on a domain controller. This tactic allows an adversary to impersonate services or applications, leading to unauthorized access or privilege escalation within the network. The typical attacker objective is to establish a foothold in the environment and evade detection by masquerading legitimate services as their own.

  The relevant MITRE ATT&CK tactics and techniques applicable to this rule include **Credential Access** (TA-1207), which encompasses the creation of false service accounts, and **Defense Evasion** techniques employed to hide malicious behavior during periodical checks or audits. The detection primarily relies on logs generated from Windows security events, particularly related to directory service changes, such as Event IDs 5136 (for changes to AD objects) and 4742 (modifications to SPNs).

  Primary data sources for effective detection include:
  - Windows Security logs, specifically those configured to capture directory service changes.
  - Audit logs focusing on Service Principal Names and changes to AD attributes involved in event IDs 5136 and 4742.

  ### Investigation Steps
  - **Review Security Event Logs**: Examine Windows Security logs, focusing on Event IDs 5136 and 4742 related to SPN changes. Look for entries that involve the 'GC/' prefix to establish potential unauthorized activity.

  - **Check SACL Configurations**: Verify that the Audit Directory Service Changes policy is correctly configured across your domain controllers to ensure relevant changes are logged. Special attention should be directed to the configuration of system access control lists (SACLs).

  - **Analyze Unusual SPNs**: Investigate any newly created SPNs that include 'GC/' to identify potentially malicious entities impersonating legitimate services. Pay special attention to changes made during non-business hours or from unusual administrative accounts.

  - **Correlate with Other Logs**: Aggregate information from related telemetry sources, such as EDR logs, to identify other concurrent suspicious activities that might indicate broader malicious behavior or a coordinated attack.

  ### Prioritization
  This alert carries a medium severity level due to the potential impact of unauthorized service impersonation in an enterprise environment, which could lead to significant data breaches or compromise of critical infrastructure. The likelihood of such an attack is moderate, particularly in environments with high-value assets or sensitive data.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the Audit Directory Service Changes policy is not uniformly applied across all domain controllers, or if SACLs are not properly configured for all relevant AD objects. An assumption of the detection logic is that legitimate activity will not typically involve the modification of SPNs prefixed with 'GC/'. Required logs include specific security event IDs (4742, 5136) and a correctly configured auditing environment to capture relevant changes.

