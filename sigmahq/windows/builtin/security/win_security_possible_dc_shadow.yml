note: |
  ### Technical Context

  This Sigma rule detects potential DCShadow attacks by identifying the creation of a Service Principal Name (SPN) that starts with "GC/" on a domain controller. The likely attacker objective is to manipulate or impersonate Active Directory services to escalate privileges or maintain persistence. This detection aligns with the MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Service Principal Name Manipulation" (T1207). The primary telemetry sources are Windows security logs, specifically Event IDs 4742 and 5136, as these events capture changes in service principal names in Active Directory.

  If successful, malicious actors could gain unauthorized access to critical services, impacting system integrity and confidentiality. However, this detection does NOT independently confirm malicious activity and should be correlated with additional context to assess intent.

  ### Investigation Steps

  - **Review Event ID 4742 logs:** Look for logs with Event ID 4742 showing service principal names containing "GC/". Validate the account making the change and its expected role (e.g., domain administrator).

  - **Examine Event ID 5136 for SPN changes:** Focus on Event ID 5136 where `AttributeLDAPDisplayName` is "servicePrincipalName" and `AttributeValue` starts with "GC/". Confirm if the SPN change aligns with legitimate administrative actions.

  - **Identify legitimate administrative activity:** Check whether SPN changes were made by known domain administrators and if appropriate Action Delegation permissions were used. Document the administrators' usual SPN-related changes for reference.

  - **Cross-reference known DCs:** Exclude alerts triggered on recognized domain controllers configured in your environment. They may show legitimate SPN updates during routine activity or maintenance.

  - **Assess account privileges:** Analyze the privileges associated with accounts involved in the changes. Anomalous adjustments from non-administrative accounts may indicate unauthorized activity.

  - **Monitor for related settings changes:** Look for audit policy changes or modifications to SACLs on relevant objects, as these can signify efforts to evade detection during a DCShadow attack.

  ### Prioritization

  The severity of this alert is medium due to its potential impact on domain controller integrity and the likelihood that it may be weaponized by attackers. The behavior is not commonplace in typical administrative operations, warranting a quick investigation to prevent possible exploitation.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use legitimate administrative accounts to make SPN changes or if logging is misconfigured, limiting visibility of related audit events. The "Audit Directory Service Changes" policy must be properly configured to capture the required events. Legitimate activities such as scheduled maintenance or service updates might trigger similar alerts. A related detection that enhances visibility is monitoring for changes to other sensitive attributes in Active Directory, such as `userAccountControl` or `sAMAccountName`.

