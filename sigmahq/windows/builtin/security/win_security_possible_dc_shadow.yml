note: |
  ### Technical Context

  This rule detects the creation or modification of Service Principal Names (SPNs) that begin with 'GC/', which is indicative of a potential DCShadow attack. The likely objective of an attacker utilizing this technique is to manipulate Active Directory objects, facilitating unauthorized access or privilege escalation. This behavior aligns with the MITRE ATT&CK technique for Credential Access (T1207).

  The primary telemetry sources required for this detection include Windows Security logs, specifically Event IDs 5136 (to find changes to servicePrincipalName attributes) and 4742 (to monitor changes to user accounts, specifically those who may create or alter SPNs). If malicious, this activity could enable an attacker to gain unauthorized control of domain services. It is important to note that this alert does NOT confirm malicious intent on its own; legitimate administrative actions may trigger similar events.

  ### Investigation Steps

  - **Validate event logs for SPN changes:** Review Security Event ID 5136 for modifications to the servicePrincipalName attribute, particularly those starting with 'GC/'. Ensure these changes align with expected behavior for managed accounts.

  - **Analyze User Account changes:** Check Security Event ID 4742 to identify accounts with updated SPNs. Compare the modifying account against normal administrative practices; unexpected accounts with recent changes may indicate an attack.

  - **Check SACL configurations:** Ensure that the Audit Directory Service Changes policy is configured correctly on relevant Domain Controller Organizational Units (OUs). Misconfigurations can lead to missing significant log data related to unauthorized changes.

  - **Identify known legitimate activity:** Recognize that valid administrative accounts may create or modify SPNs as part of regular operations. If changes are consistent with scheduled maintenance windows or documented administrative tasks, categorization as benign may be appropriate.

  - **Correlate with other incident data:** Cross-reference incident reports or alerts related to privilege escalation or unusual account behavior. While this may be a standalone event, context from other sources can provide insights into the likelihood of active compromise.

  - **Collect and analyze Sysmon logs:** If available, check Sysmon Event ID 10 (ProcessAccess) for any processes accessing data or configurations linked to these SPN changes. This can help confirm if further exploitation is occurring.

  ### Prioritization

  This alert is of medium severity given that it could indicate a sign of compromise that targets critical domain services. The potential impact is significant as it may lead to unauthorized access to sensitive resources. While this behavior is not extremely common, awareness of its potential weaponization is necessary for timely incident response.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in SACLs, which can lead to missed events. Additionally, legitimate administrative changes to SPNs can trigger the alert, requiring context for evaluation. It is essential to ensure that logging for "Audit Directory Service Changes" is enabled and correctly configured to capture events. A related detection to strengthen coverage would be monitoring for privileged account usage trending upward around the time of SPN modifications.

