  ### Technical Context

  This Sigma rule detects WRITE_DAC access to domain objects in Active Directory. Such access typically signifies an intent to alter permissions on sensitive accounts or objects, which can lead to privilege escalation or unauthorized access to resources. The adversary's likely objective is to manipulate Active Directory (AD) permissions to maintain persistence or escalate privileges. This behavior aligns with the MITRE ATT&CK technique for "Permission Group Discovery" (T1069) and "Privilege Escalation" (T1068).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 4662, which tracks object access and modifications in Active Directory. If malicious, such actions can significantly impact system security by enabling unauthorized users to gain elevated privileges or access restricted data. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Check Event ID 4662 details**: Review Event ID 4662 in the Security log for the specific object accessed, focusing on the TargetObject field. Compare against known safe administrative actions to determine if the change is justified.

  - **Evaluate the AccessMask**: Confirm the AccessMask value of '0x40000' indicating WRITE_DAC permissions in the Event 4662 details. Unusual patterns of WRITE_DAC access by non-admin accounts are high-confidence indicators of malicious activity.

  - **Analyze the Actor Context**: Identify the subject (User/Account) performing the WRITE_DAC action as per the SubjectUserName field in Event ID 4662. Verify if this account typically performs such actions or if it seems abnormal.

  - **Investigate ObjectType relevance**: Confirm if the ObjectType corresponds to known sensitive AD objects, such as accounts or groups indicated by 'domainDNS'. Unauthorized changes to these objects are a strong indicator of a potential compromise.

  - **Review Legitimate Administrative Actions**: Investigate recent change records in the Active Directory. Look for documented administrative tasks or scheduled changes that would justifiably trigger WRITE_DAC access, differentiating between normal and suspicious activities.

  ### Prioritization

  This alert should be treated with high urgency due to the potential for privilege escalation associated with AD object modifications. Systems affected are likely critical infrastructure needed for enterprise operations. The likelihood of malicious exploitation is significant, especially in an environment with known vulnerabilities or recent targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative tasks may trigger this alert, leading to false positives. Accurate log collection configuration is essential, especially ensuring Security logs capture Event ID 4662. Possible evasion techniques include the use of legitimate admin accounts for malicious purposes, which may disguise the true intent of the action. Integrating this detection with alerts for unusual account activity or changes in user roles would strengthen overall coverage against malicious behavior.

