note: |
  ### Technical Context
  This detection rule identifies instances of WRITE_DAC access to a domain object within Active Directory (AD). This access type signifies that an attacker is attempting to modify the discretionary access control list (DACL) of an Active Directory object, potentially allowing them to escalate privileges or gain unauthorized access to sensitive resources. Attackers frequently target AD for reconnaissance or lateral movement, exploiting misconfigurations to manipulate permissions and maintain access.

  The relevant MITRE ATT&CK tactics associated with this rule include **Defense Evasion** (TA0005) as it involves altering security settings, and the technique **Modify Existing Permissions** (T1222.001), where attackers may write DACLs to change permissions on user accounts, groups, or other AD objects. The primary data sources for detecting these activities are Windows Security Event Logs, particularly those that capture events related to object access, such as EventID 4662, which records detailed information about the modifications made to objects within AD.

  ### Investigation Steps
  - **Review Security Event Logs**: Collect and analyze Windows Security Event Logs for EventID 4662, specifically focusing on events related to WRITE_DAC access to sensitive domain objects.
  - **Examine Object Details**: Verify the Object Type being accessed, ensuring it corresponds to critical AD objects such as user accounts or groups, which could indicate privilege escalation attempts.
  - **Analyze Access Patterns**: Assess who initiated the WRITE_DAC access and whether their actions coincide with abnormal behavior patterns, such as changes outside regular hours or from unusual IP addresses.
  - **Audit Group Policies**: Review relevant Group Policy Objects (GPOs) to determine if there are configurations that may have permitted unauthorized WRITE_DAC access or if there are any known weaknesses in the current AD setup.

  ### Prioritization
  The alert is classified as critical due to the potential impact of unauthorized modifications to AD object permissions, which can lead to elevated privileges, unauthorized access, and a compromised security posture.

  ### Blind Spots and Assumptions
  This detection rule relies on the logging of specific security events (EventID 4662), which may not be enabled by default in all environments. There is an assumption that legitimate administrative actions are appropriately logged and can be distinguished from potential malicious activities. Organizations must ensure that all necessary audit policies are configured correctly to avoid gaps in detection coverage, such as the omission of access changes by automated processes or legitimate administrative tasks that may appear suspicious.

