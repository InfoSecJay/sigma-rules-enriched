  ---

  ### Technical Context

  This Sigma rule detects the remote creation of scheduled tasks using the `at.exe` command or API interactions with the ATSVC named pipe, which can indicate malicious lateral movement or persistence techniques utilized by attackers. The likely objective is to execute commands or maintain access to a compromised system by setting up scheduled tasks remotely. This behavior aligns with MITRE ATT&CK techniques T1053.002 (Scheduled Task/Job: at) and T1021.001 (Remote Services: Windows Admin Shares).

  The primary telemetry source is Windows Security log (Event ID 5145), specifically capturing access to the IPC$ share, which is often exploited for remote task execution. If successful, this could lead to significant security impacts such as unauthorized access or control over the target system. It's important to note that the detection of this event does NOT confirm malicious activity on its own; further context is required.

  ---

  ### Investigation Steps

  - **Review Event ID 5145: ** Check the Security logs for Event ID 5145 where ShareName is `\\*\IPC$` and RelativeTargetName is `atsvc`. Investigate the AccessList field for 'WriteData' to confirm unauthorized task creation.

  - **Identify originating process: ** Note the account and originating process that triggered the access – pay attention to any non-standard or unexpected users/processes related to task creation, as legitimate activity typically involves administrative accounts and well-known scheduled tasks.

  - **Correlate with other logs: ** Check for additional logs that correspond to the same timestamp, such as PowerShell logs (Event ID 4104) or Sysmon (Event ID 1) to see if any scripts were executed around the same time that might indicate broader malicious behavior.

  - **Look for multiple alerts: ** Assess whether this alert appears in conjunction with other security alerts, such as unusual login attempts or process creations, suggesting a possible ongoing attack scenario or lateral movement.

  - **Validate legitimate use cases: ** Investigate whether the affected account is known to create scheduled tasks under normal operational conditions. Check internal documentation or recent changes that may have authorized such actions.

  - **Check for persistence techniques: ** Assess if there are other entries related to task creation or modification in the Task Scheduler (using Task Scheduler GUI or PowerShell commands) that could reinforce the intent behind the detected access.

  ---

  ### Prioritization

  This alert is of medium severity based on the potential impact of unauthorized scheduled task creation on the affected system, especially if the task introduces a backdoor or facilitates further malicious actions. The likelihood of abuse is moderate, as attackers frequently leverage this technique for lateral movement and persistence.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the appropriate audit policies for Object Access are not enabled, as evidence of legitimate interactions with IPC$ can erroneously trigger the alert without nefarious intent. Moreover, legitimate administrators may create scheduled tasks under normal operations, resulting in false positives. A related detection to strengthen coverage would involve monitoring for unusual WinRM or SMB traffic that could indicate external exploitation attempts.

