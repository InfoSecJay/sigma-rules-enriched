note: |
  ### Technical Context
  This detection rule looks for remote task creation events leveraging the `at.exe` utility or API interactions with the Advanced Telecommunication Service Named Pipe (`ATSVC`). When attackers gain access to a system, they may use this technique to schedule tasks remotely as a means of persistence, executing malicious commands or scripts with elevated privileges. This behavior is commonly associated with various threat actors attempting to maintain control over compromised systems.

  The primary motive behind this activity is typically to ensure that malware or unauthorized scripts can run at specified times or under particular conditions, which can circumvent other protective measures within the environment. This kind of behavior falls under several MITRE ATT&CK tactics, primarily **Persistence** (TA0003) using techniques such as **Scheduled Task/Job** (T1053.002), and it may also relate to **Lateral Movement** (TA0008) if the remote task creation is aimed at furthering access across systems.

  To effectively detect this behavior, key telemetry includes security log sources such as Windows Security logs, specifically looking for Event ID 5145. These logs are vital as they contain details regarding access to shared resources and the nature of interactions with named pipes, which can highlight suspicious remote activities.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security logs for Event ID 5145, focusing on entries that show access to the `\\*\IPC$` share and interactions with `atsvc`.
  - **Identify Task Creation**: Look for associated task creation events, which can indicate when and how the tasks were scheduled. Pay particular attention to any tasks that claim to use `at.exe` and ensure they are legitimate.
  - **Analyze Process Execution**: Investigate process creation events for the execution of `at.exe` or related commands. Cross-reference these events with user accounts that initiated the request to identify unusual or unauthorized activity.
  - **Correlate with User Behavior**: Examine user behavior analytics and logins around the timestamps of the events derived to look for abnormal access patterns or potential exploitation of privileges.

  ### Prioritization
  This alert should be considered medium severity due to the potential for significant impact on system integrity and the likelihood of detection in a well-monitored environment. Remote task creation can lead to prolonged access for attackers and enable further malicious activities.

  ### Blind Spots and Assumptions
  The detection logic may miss scenarios where the audit settings for sharing are improperly configured or where attackers use methods that do not invoke the `ATSVC` directly. It assumes that the necessary audit policies are enabled for both successful and failed access to file shares. Necessary logs include enabled Windows Security logs with the appropriate audit policies configured to catch detailed file share access. This means environments must ensure they are adhering to best practices for logging and monitoring Windows event logs to catch these activities effectively.

