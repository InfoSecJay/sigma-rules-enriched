detection:
  selection:
    EventID: 4661
    AccessMask: '0x2d'
    ObjectType:
    - 'SAM_USER'
    - 'SAM_GROUP'
    ObjectName|startswith: 'S-1-5-21-'
    ObjectName|endswith:
    - '-500'
    - '-512'
  condition: selection
falsepositives:
- Administrator activity
level: high
note: |
  ### Technical Context
  This rule detects suspicious reconnaissance activity targeting domain accounts within a Windows environment. Specifically, it identifies attempts to query the "Administrator" and "Domain Admins" groups using the commands `net user administrator /domain` and `net group domain admins /domain`. This activity could indicate that an attacker is trying to gather information about high-privileged user accounts to facilitate further attacks, such as privilege escalation or lateral movement within the network.

  The primary objective of such an action is typically to enumerate active directory (AD) groups and associated users, potentially preparing for targeted attacks that leverage administrative credentials. Relevant MITRE ATT&CK tactics include **Discovery** (TA0007), particularly techniques like **Account Discovery** (T1087.002), which involves identifying user accounts and their roles within the environment. This activity may also relate to **Permissions Groups Discovery** (T1069.002), where the attacker attempts to identify groups with elevated privileges.

  Effective telemetry for this detection includes Windows security logs that capture the events associated with access to security accounts. Specifically, Event ID 4661 logs provide insight into access attempts on Security Account Manager (SAM) objects. Therefore, it is crucial to ensure that security auditing policies for SAM and kernel objects are configured correctly in a monitoring environment.

  ### Investigation Steps
  - **Review Security Logs**: Examine Windows security logs for Event ID 4661 to identify the source of the access attempt and analyze the context around the request, including user accounts and timestamps.
  - **Analyze Network Activity**: Investigate network traffic for any suspicious remote or local commands that could reveal unauthorized enumeration of accounts or groups, including the use of PowerShell or remote command execution tools.
  - **Correlate with User Behavior**: Cross-reference user account activities with normal baselines to assess if the querying behavior is consistent with the account's normal operational duties or if it deviates significantly.
  - **Check for Anomalous Access Patterns**: Look for any simultaneous or unusual patterns of access from other accounts or systems, particularly focused on administrative credentials or patterns of privilege escalation.

  ### Prioritization
  The severity of this alert is high due to the potential impact of unauthorized access to privileged accounts, which could lead to serious compromises within the network if exploited. Additionally, the likelihood of such reconnaissance occurring before an attack makes it critical to detect early indicators of fraudulent account enumeration.

  ### Blind Spots and Assumptions
  This detection rule may miss other reconnaissance techniques that do not utilize the specific commands or access patterns characterized here, potentially allowing sophisticated attackers to employ alternative methods for account enumeration. The detection assumes that the auditing policies for SAM and kernel objects are correctly configured; if these settings are not enabled, relevant events and therefore suspicious activity may go undetected. Furthermore, potential overlaps with legitimate administrative activity could result in false positives during busy maintenance periods or during standard administrative tasks.

