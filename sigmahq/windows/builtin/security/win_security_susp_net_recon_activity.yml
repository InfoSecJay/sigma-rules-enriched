note: |
  ### Technical Context

  This Sigma rule detects enumeration of user accounts and groups on Windows domains by monitoring the execution of commands like "net user administrator /domain" and "net group domain admins /domain." The likely objective of the attacker is to gather information about privileged accounts, which can facilitate further attacks or lateral movement within the enterprise environment. The relevant MITRE ATT&CK tactics and techniques include Discovery (TA0007), particularly Account Discovery (T1087.002) and Group Membership Discovery (T1069.002).

  The primary telemetry source is the Windows Security logs, specifically Event ID 4661, which records access to Security Accounts Manager (SAM) objects. If malicious in nature, this detection can signal an active reconnaissance phase that may lead to privilege escalation or account compromise. However, it's important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may trigger similar logs.

  ### Investigation Steps

  - **Identify the source command:** Investigate the specific command executed linked to Event ID 4661. Look for instances of "net user" and "net group" activities in Security logs to identify the context of use (e.g., user ID, workstation IP).

  - **Examine user roles and permissions:** Review the account and group information accessed in the detected event. Verify if the actions were performed by legitimate administrative accounts or unexpected user accounts.

  - **Check for concurrent suspicious activity:** Cross-reference the times of the detected event with other suspicious logins or access patterns, such as failed login attempts or lateral movement activity, using the Security Event ID 4625 or Active Directory logs.

  - **Evaluate normal user enumeration patterns:** Determine baseline behaviors for legitimate administrative tasks in your environment by checking typical access logs for "net user" or "net group" executions, noting expected users and frequency.

  - **Identify high-confidence malicious indicators:** Look for repeated attempts or abnormal timing of enumeration commands (e.g., outside business hours) that may indicate adversary reconnaissance. Review the originating IP and correlate with known risk sources.

  - **Validate group memberships:** Utilize the Directory Service logs to confirm the integrity of group memberships. Check for any unauthorized changes or unusual enumeration patterns that coincided with the detected alerts, ensuring SAM data remains intact.

  ### Prioritization

  This alert has a high severity rating in an enterprise context due to its potential impact on system integrity and the likelihood of misuse for lateral movement or privilege escalation by adversaries. As reconnaissance is a common step in many attack chains, prompt analysis is warranted.

  ### Blind Spots and Assumptions

  Potential evasion techniques include using alternate methods for account enumeration that do not trigger event logging, such as custom scripts rather than built-in Windows utilities. Reliable detection requires that the advanced audit policies for Object Access are correctly configured to capture Event ID 4661. Legitimate administrative tasks, such as routine audits by IT staff, may trigger these alerts. A companion detection to consider is monitoring for suspicious account creations or modifications within the same timeframe to strengthen incident response.

