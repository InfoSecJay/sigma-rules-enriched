title: Suspicious PsExec Execution
id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
status: test
description: detects execution of psexec or paexec with renamed service name, 
  this rule helps to filter out the noise if psexec is used for legit purposes 
  or if attacker uses a different psexec client other than sysinternal one
references:
- https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
author: Samir Bousseaden
date: 2019-04-03
modified: 2022-08-11
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection1:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName|endswith:
    - '-stdin'
    - '-stdout'
    - '-stderr'
  filter:
    RelativeTargetName|startswith: 'PSEXESVC'
  condition: selection1 and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of PsExec or PaExec with a renamed service name, specifically targeting instances where the service name begins with "PSEXESVC". The behavior suggests an attacker may leverage unauthorized remote command execution as part of a lateral movement strategy within the network. The relevant MITRE ATT&CK tactic is **Lateral Movement** (TA0031) and the technique is **Remote Services: PsExec** (T1021.002).

  Primary telemetry sources include Windows Security logs, specifically Event ID 5145, which logs file share access. If malicious, such activity could indicate significant security risks, including unauthorized access to sensitive systems. This detection does NOT confirm malicious intent on its own, as PsExec can also be used legitimately in administrative tasks.

  ### Investigation Steps

  - **Check Event ID 5145 for suspicious access:** Review Security Event ID 5145. Confirm any access to share `\\*\IPC$` and note any associated usernames or session IDs. Legitimate usage should originate from trusted system admins.

  - **Identify non-standard service names:** Analyze logs for service names beginning with 'PSEXESVC'. If the `RelativeTargetName` ends with '-stdin', '-stdout', or '-stderr', verify the legitimacy of the execution context.

  - **Cross-reference timestamps:** Correlate the time of the events with other suspicious activity, such as a spike in user logon events (Event ID 4624) from unusual hosts. Shift in user behavior before the alert may indicate unauthorized activity.

  - **Validate the source of PsExec execution:** Investigate the process creation logs (Event ID 4688 or Sysmon Event ID 1) around the same time. Look for the parent process that initiated PsExec. Legitimate activity may originate from known administrative tools.

  - **Review endpoint for known tools:** If a system is flagged, validate the installed software on it; ensure it's built for administrative use, such as Sysinternals Suite. Malicious use may come from unauthorized or modified versions of PsExec.

  - **Check for file creation or scheduled tasks:** Investigate for new file artifacts or scheduled tasks created by the service. Legitimate PsExec usage typically does not lead to unexpected changes in the file system or task scheduler.

  ### Prioritization

  This alert should be considered high severity due to the potential for lateral movement across critical systems. The risk of malicious abuse is significant, especially as remote execution tools like PsExec are commonly weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of adequate logging configurations, specifically if detailed file share auditing is not enabled. Legitimate administrative processes may trigger this alert, particularly if systems are managed with PsExec for maintenance tasks. A companion detection to strengthen coverage would be monitoring for high-privilege account logons (Event ID 4624) to support context during investigations.

