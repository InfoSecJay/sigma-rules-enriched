title: Suspicious PsExec Execution
id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
status: test
description: detects execution of psexec or paexec with renamed service name, this
  rule helps to filter out the noise if psexec is used for legit purposes or if attacker
  uses a different psexec client other than sysinternal one
references:
- https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
author: Samir Bousseaden
date: 2019-04-03
modified: 2022-08-11
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection1:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName|endswith:
    - '-stdin'
    - '-stdout'
    - '-stderr'
  filter:
    RelativeTargetName|startswith: 'PSEXESVC'
  condition: selection1 and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious use of PsExec or PaExec, particularly when commands are executed with a renamed service name. PsExec is a legitimate tool from Microsoft's Sysinternals suite that allows remote execution of processes, often used in administrative tasks. However, attackers can also misuse PsExec to execute malicious code on remote systems, thereby facilitating lateral movement within a network. In this context, an attacker aims to gain further access or control over systems, which is often crucial for maintaining persistence or exfiltrating data.

  This rule is particularly aligned with the MITRE ATT&CK framework, specifically targeting tactics and techniques related to lateral movement. It falls under "Lateral Movement" (TA-0031) and specifically addresses the technique "Remote Services: PsExec" (T1021.002). Primary data sources for this alert include Windows Security logs that log detailed file share activity, particularly the event with ID 5145, which captures file share access events.

  ### Investigation Steps
  - **Review Security Logs**: Analyze logs for EventID 5145 to identify any instances of PsExec or PaExec being executed, particularly looking for patterns involving the `\\*\IPC$` share.
  - **Examine Process Activity**: Investigate process creation events for any instances where `PSEXESVC` is invoked, noting any unusual command line arguments or remote targets.
  - **Network Traffic Analysis**: Check for outbound connections that coincide with the timing of the suspicious PsExec executions, focusing on connections made to systems that typically do not communicate with the initiating host.
  - **Validate Service Names**: Cross-reference the service names used with legitimate services to determine if any renamed PsExec instances align with known good, as attackers often disguise their tools.

  ### Prioritization
  This alert is categorized as high severity due to the potential for lateral movement and the broad implications an attacker has when executing commands remotely. The exploitation of legitimate administrative tools increases the likelihood of undetected malicious activity.

  ### Blind Spots and Assumptions
  There may be gaps in detection for variants of PsExec or custom remote execution tools that do not utilize the typical command structure, leading to potential false negatives. The alert assumes that the audit policy "Object Access > Audit Detailed File Share" is accurately configured and operational across all necessary endpoints. Additionally, analysts should be aware that legitimate administrative use of PsExec might generate false positives, requiring contextual investigation to determine the validity of the alerts.

