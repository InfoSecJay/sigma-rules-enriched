logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|endswith: 'C$'
    AccessMask: '0x2'
  filter_main_subjectusername:
    SubjectUserName|endswith: '$'
  filter_optional_local_ip:
    IpAddress: '::1'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of a remote file over an SMB administrative share (e.g., C$) when initiated by a non-system account, signifying potential lateral movement or unauthorized access attempts on the network. The likely attacker objective is to establish persistence, exfiltrate data, or deploy malicious files in a target environment. This behavior aligns with the MITRE ATT&CK framework under the tactic "Lateral Movement" and technique "Lateral File Copy" (T1021.002).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 5145, which records SMB file share access events. If malicious, this behavior could lead to unauthorized data manipulation or lead to further compromise of the system. It is important to note that this detection does NOT confirm that a malicious activity actually occurred without reviewing the context and other related activities.

  ### Investigation Steps

  - **Check Event ID 5145 logs for the alert:** Gather logs where Event ID 5145 is present with the ShareName ending in 'C$' and AccessMask '0x2'. Validate the user account; non-system accounts accessing these shares should raise immediate concern.

  - **Identify the initiating user account:** Review the `SubjectUserName` field. If the username does not end with a '$' (indicating a service account), this may be indicative of potentially malicious activity.

  - **Assess the timestamp and source IP:** Verify the timestamp of the event and correlate it with known good behaviors or expected scheduled tasks. Check the `IpAddress` field to rule out local system activity (e.g., "::1" signifies localhost).

  - **Look for associated file activity:** Investigate the presence of any new or modified files in the administrative share's path using `FileSystem` audit logs (Security Event IDs 4663 or relevant Sysmon logs for file integrity changes), focusing on unusual file types or timestamps that do not match organizational norms.

  - **Consider legitimate administrative operations:** Review recent administrative changes or legitimate maintenance activities that may have necessitated this access, such as patch updates or script execution from a trusted account.

  - **Identify potential lateral movement:** Cross-reference the user account with recent successful logins and permission changes. Look for other logs indicating elevated privileges or abnormal connections to the SMB share, such as logs from Event ID 4624 and 4672, which indicate logon events and special privileges respectively.

  ### Prioritization

  Alerts generated by this detection rule should be regarded with high priority due to the elevated permissions associated with administrative shares. The likelihood of malicious abuse is significant, as SMB shares are commonly targeted by adversaries for lateral movement and data manipulation. This behavior is notably weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative actions to trigger this alert, where IT staff may require access for maintenance. Additionally, if necessary logging configurations are not in place (especially capturing Event ID 5145), this detection may fail. Administrators could also use service accounts to conduct legitimate access that mimics this activity. A related detection to strengthen coverage would be monitoring for unusual logon patterns (Event ID 4624) following remote file creation activities, as it can capture correlated suspicious behaviors.

