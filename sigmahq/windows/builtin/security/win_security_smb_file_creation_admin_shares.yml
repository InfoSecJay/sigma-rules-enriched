logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|endswith: 'C$'
    AccessMask: '0x2'
  filter_main_subjectusername:
    SubjectUserName|endswith: '$'
  filter_optional_local_ip:
    IpAddress: '::1'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious access to administrative shares, specifically the creation of files on the C$ share using non-system accounts. Administrative shares (e.g., C$) are common targets for attackers aiming to move laterally within a network, as they provide access to the file system of remote machines. Unauthorized file creation via administrative shares can indicate potential exploitation, data exfiltration, or placement of malicious payloads.

  The threat scenario typically involves insider threats or external attackers leveraging compromised credentials to gain elevated privileges within a network. Common attacker objectives include lateral movement, persistence establishment, and data compromise. The detection aligns with the MITRE ATT&CK framework, particularly the **Lateral Movement** tactic, specifically the technique **T1021.002: SMB/Windows Admin Shares**.

  To effectively monitor for this type of activity, telemetry from Windows security logs is essential, focusing on Event ID 5145, which records events related to network share access. This logging can help identify when non-system accounts attempt to interact with administrative shares in unusual ways.

  ### Investigation Steps
  - **Review Security Logs:** Check Windows Security logs for Event ID 5145 and confirm the User Account involved, ensuring it is indeed a non-system account attempting SMB access.
  - **Analyze Access Patterns:** Investigate the timeline of access events for the involved account, looking for any preceding authentication events or lateral movement patterns that may indicate compromise.
  - **Check for Other Indicators:** Validate if there are additional security alerts or anomalies related to the same endpoint or user account, such as multiple unsuccessful login attempts or access to sensitive data.
  - **Correlate with Network Traffic:** Utilize network detection tools to analyze traffic to and from the affected host, searching for unusual outbound connections or data transfers following the file creation event.

  ### Prioritization
  This alert should be classified as high severity due to the potential impact of lateral movement and unauthorized access to sensitive systems, which could lead to broader network compromise. The likelihood of such events signifies a critical need for prompt investigation.

  ### Blind Spots and Assumptions
  There are some gaps in detection coverage, particularly around identifying all potential user accounts that might access administrative shares. The detection logic assumes that non-system accounts are not permitted access; however, if legitimate accounts are misconfigured or if security policies are lax, this could lead to false negatives. For this alert to function properly, adequate logging must be enabled on Windows systems, specifically ensuring Event ID 5145 is being collected consistently across the environment.

