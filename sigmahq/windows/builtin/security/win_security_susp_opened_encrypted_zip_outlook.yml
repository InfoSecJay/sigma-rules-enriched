title: Password Protected ZIP File Opened (Email Attachment)
id: 571498c8-908e-40b4-910b-d2369159a3da
status: test
description: Detects the extraction of password protected ZIP archives. See the filename
  variable for more details on which file has been opened.
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
author: Florian Roth (Nextron Systems)
date: 2022-05-09
tags:
- attack.defense-evasion
- attack.initial-access
- attack.t1027
- attack.t1566.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains|all:
    - 'Microsoft_Windows_Shell_ZipFolder:filename'
    - '\Temporary Internet Files\Content.Outlook'
  condition: selection
falsepositives:
- Legitimate used of encrypted ZIP files
level: high
note: |
  ### Technical Context
  This detection rule identifies the opening of password-protected ZIP files that may have been received as email attachments. Attackers often use encrypted archives to deliver malicious payloads while evading detection by security tools. The threat scenario typically involves an adversary using social engineering tactics to coerce users into opening these files, potentially leading to malware execution upon extraction or other malicious activity. The alert specifically targets file access events that involve folders commonly associated with email clients, highlighting a potential initial access vector.

  Relevant MITRE ATT&CK tactics include **Initial Access (TA0043)**, as this behavior could indicate a method for delivering malware, and **Defense Evasion (TA0005)**, reflecting attempts to conceal malicious activities through obfuscated file formats. The technique involved is **T1027: Obfuscated Files or Information**, indicating the use of encrypted ZIP files to obscure their content. Primary data sources for this detection include **Windows security event logs**, specifically monitoring EventID 5379, which records the opening of files through Windows Explorer.

  ### Investigation Steps
  - **Review Security Logs:** Examine Windows security event logs for EventID 5379 to identify when and by whom the password-protected ZIP file was opened. Note the context for any unusual access patterns.
  - **Analyze Email Headers:** Check the originating email for headers, attachments, and links to confirm the legitimacy of the sender and assess any suspicious patterns in previous communications that might indicate a phishing attempt.
  - **Inspect Download Paths:** Look into the specific directory mentioned in the rule, `\Temporary Internet Files\Content.Outlook`, to verify the presence of the ZIP file and review recent activity in that folder for familiarization with user behavior and potential compromise.
  - **Conduct File Analysis:** If possible, analyze the contents of the ZIP file (if accessible, following proper protocols) to determine if it contains any known malware or malicious documents that could pose a risk to the organization.

  ### Prioritization
  This alert is classified as high severity due to the significant risk associated with the potential execution of malware delivered via encrypted ZIP files. Given the increasing sophistication of phishing efforts, the likelihood of an organization encountering such tactics is notably high, thus necessitating swift investigation and response.

  ### Blind Spots and Assumptions
  There may be gaps in detection if security logs are not properly configured to capture relevant events or if employees regularly and legitimately use password-protected ZIP files. Additionally, the detection logic assumes that the EventID 5379 is an accurate reflection of file access and that the files are malicious if they arrive in encrypted form. For this alert to function effectively, it is essential to ensure logging is enabled on Windows systems for security events and that email filtering tools are in place to flag suspicious attachments.

