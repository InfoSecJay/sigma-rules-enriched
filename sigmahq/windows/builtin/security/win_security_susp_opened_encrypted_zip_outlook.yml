logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5379
    TargetName|contains|all:
    - 'Microsoft_Windows_Shell_ZipFolder:filename'
    - '\Temporary Internet Files\Content.Outlook'
  condition: selection
falsepositives:
- Legitimate used of encrypted ZIP files
level: high
note: |
  ### Technical Context

  The rule detects the opening of password-protected ZIP files, which is often a vector for delivering malicious payloads or sensitive information. Attackers typically aim to extract files that may be compromised or contain further instructions for malware execution. This behavior falls under the MITRE ATT&CK tactics of Initial Access (TA0001) and Trusted Third Party Software (T1027), as it involves misuse of commonly trusted file formats.

  Primary telemetry sources include Windows Security logs, specifically Event ID 5379, which indicates the opening of potentially malicious file types within specific directories, such as Temporary Internet Files in Outlook. If malicious, the impact could range from data exfiltration to initial compromise of the system. This detection does NOT confirm that the ZIP file contents are malicious or that any follow-up actions (e.g., execution of payload) occurred.

  ### Investigation Steps

  - **Review Event Details: **Extract Event ID 5379 logs for the identified user session to confirm the file opened was indeed a password-protected ZIP file, noting the filename and source path.

  - **Analyze User Context: **Identify if the user account that opened the ZIP file has a history of risky behavior, such as accessing unsolicited emails or interacting with unfamiliar senders, which can indicate potential phishing activity.

  - **Check for Process Execution: **Correlate with Sysmon Event ID 1 (Process Creation) to see if any suspicious processes were executed following the ZIP file extraction, especially those running from the Temp folder.

  - **Determine Legitimate Behavior: **Look for instances of legitimate user activity involving password-protected ZIP files, such as if the user typically contacts trusted vendors or uses common business practices that necessitate secure file transfer.

  - **Verify File Integrity: **If possible, confirm if the files extracted were shared via trusted/reputable email accounts or if they appear on any threat intelligence lists.

  ### Prioritization

  This alert has high severity due to the potential risk involved in handling password-protected ZIP files, which are commonly used for obfuscation in malware delivery. The likelihood of malicious abuse is significant, as these tactics are frequently weaponized in phishing campaigns.

  ### Blind Spots and Assumptions

  Limitations of detection include potential evasion techniques such as renaming files or alternative compression methods not triggering this specific rule. Additionally, required logs must be correctly configured to capture Event ID 5379 reliably. Legitimate activities that may trigger this alert include regular business communications involving sensitive documents. A related detection that strengthens coverage could involve monitoring for other unusual file extraction activities within the same user environment, such as RAR or 7zip file extractions.

