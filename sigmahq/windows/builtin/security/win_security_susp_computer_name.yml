  product: windows
detection:
    # Not adding an EventID on purpose to try to match on any event in security (including use of account), not just 4741 (computer account created)
  selection1:
    SamAccountName|startswith: 'SAMTHEADMIN-'
    SamAccountName|endswith: '$'
  selection2:
    TargetUserName|startswith: 'SAMTHEADMIN-'
    TargetUserName|endswith: '$'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects newly generated computer accounts with names starting with "SAMTHEADMIN-" and ending with a dollar sign, indicative of potential automated or scripted account creation using known hack tools. The likely attacker objective is to establish persistence on a network or system, potentially followed by privilege escalation and lateral movement. This activity pertains to the MITRE ATT&CK tactic "Initial Access" (TA0001), specifically techniques like "Valid Accounts" (T1078).

  The primary telemetry sources are Windows Security logs, including entries related to computer account management. If malicious, such behavior indicates an adversary is establishing footholds within the environment, which could lead to further compromise. However, this detection alone does not confirm active compromise; it only narrows down potential malicious behavior related to account creation.

  ### Investigation Steps

  - **Examine event logs for account creation:** Review Windows Security Event IDs related to account management (e.g., 4741) for newly created accounts matching the pattern (e.g., SamAccountName: SAMTHEADMIN-001$). Be aware of account creation from unexpected hosts, especially those not typically managing accounts.

  - **Check for related authentication events:** Look for Event ID 4624 (Logon) for the new computer accounts to determine if they have been used to log into any systems. If these accounts show a pattern of logon attempts, it may signal active exploitation.

  - **Validate expected behavior of account creation:** Confirm with IT policies whether new account creation follows established naming conventions and procedures. Legitimate changes would typically be documented or aligned with a named individual or project.

  - **Identify additional suspicious indicators:** Review for lateral movement through event ID 4697 (Service Installation) or unusual administrative activities tied to the new accounts, such as applying for elevated privileges, which could signal malicious intent.

  - **Correlate with threat intelligence:** Investigate matches against known threat actor tactics or specific tools mentioned in threat reports linked to the "Samtheadmin" naming convention. This includes cross-referencing claims of exploits or identified methodologies used in recent attacks.

  ### Prioritization

  The alert holds critical severity due to the potential for significant impact on the affected systems, especially if they are critical infrastructure or administrative servers. The likelihood of malicious abuse is high, considering that the pattern indicates an adversarial workflow that bypasses traditional account creation protocols and standards.

  ### Blind Spots and Assumptions

  Detection is limited by the ability to monitor all account management events; if logging is not configured correctly, relevant events may be missed. Evasion techniques may include using legitimate administrative accounts or naming conventions that do not adhere to the identified pattern. Legitimate administrative accounts or applications that may create similar-sounding accounts should also be considered. A companion detection could involve monitoring for use of the vulnerable service (CVE-2021-42287) to strengthen detection against bypassing this alert.

