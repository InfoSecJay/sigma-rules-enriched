logsource:
  service: security
  product: windows
detection:
    # Not adding an EventID on purpose to try to match on any event in security (including use of account), not just 4741 (computer account created)
  selection1:
    SamAccountName|startswith: 'SAMTHEADMIN-'
    SamAccountName|endswith: '$'
  selection2:
    TargetUserName|startswith: 'SAMTHEADMIN-'
    TargetUserName|endswith: '$'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  The detection rule targets the creation or use of computer accounts in Active Directory that begin with "SAMTHEADMIN-" and end with a dollar sign ($), which is characteristic of a naming convention often utilized by attackers to establish persistence. The suspected threat family associated with this behavior involves malicious actors leveraging hack tools to create or manipulate these computer accounts. Their objective is typically to maintain access to a compromised network environment and evade detection by disguising their presence as legitimate administrative activities.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (T1078)**: Using legitimate credentials to gain access.
  - **Persistence**: Creating accounts to ensure long-term access to a network.
  - **Defense Evasion**: Employing tactics to conceal their activities and hinder detection.

  Primary data sources that will contain the most pertinent evidence include security logs from Active Directory, specifically LDAP query logs detailing computer account creations and modifications, as well as logs from endpoint detection and response (EDR) tools that capture process creation events associated with network communications.

  ### Investigation Steps
  - **Review Active Directory Logs**: Examine LDAP logs to identify any new computer accounts created with names starting with "SAMTHEADMIN-" and ending with "$". Pay attention to the timestamps to correlate with any other suspicious activity in the environment.

  - **Analyze Related Process Creation Events**: Investigate EDR logs for any process creation events that link to the creation or manipulation of these accounts. Look for scripts or tools that may align with the suspected hack tools highlighted in this rule.

  - **Inspect User Account Behavior**: Check for unusual activity associated with the accounts that resemble the naming convention. This includes any login attempts or access to sensitive resources that could indicate escalation of privileges or unauthorized access.

  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence tools to verify if the detected activity correlates with known indicators of compromise (IoCs) or tactics used by threat actors associated with credential misuse or account manipulation.

  ### Prioritization
  This alert is deemed critical due to the significant risk associated with malicious actor access and the potential for escalating privileges within the network, thus jeopardizing sensitive data and systems.

  ### Blind Spots and Assumptions
  There might be gaps in detection coverage for similar patterns of account manipulation if the rules do not account for variations in naming conventions that attackers may employ. The detection logic assumes that attackers will follow this specific naming format, which may not hold true in every instance. Additionally, logs from core security services must be correctly configured and retained to ensure visibility into account creation and related activities for this detection to function optimally.

