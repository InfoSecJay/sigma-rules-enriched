logsource:
  service: security
  product: windows
detection:
    # Not adding an EventID on purpose to try to match on any event in security (including use of account), not just 4741 (computer account created)
  selection1:
    SamAccountName|startswith: 'SAMTHEADMIN-'
    SamAccountName|endswith: '$'
  selection2:
    TargetUserName|startswith: 'SAMTHEADMIN-'
    TargetUserName|endswith: '$'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation or presence of a computer account with a name format beginning with "SAMTHEADMIN-" and ending with a dollar sign ($), which is indicative of possible malicious activities such as privilege escalation or persistence by threat actors. The likely attacker objective is to establish a foothold within the target environment while attempting to masquerade their activity as legitimate regarding the account and machine naming conventions. This corresponds to the MITRE ATT&CK technique **Valid Accounts** (T1078), as well as tactics associated with **Initial Access** and **Defense Evasion**.

  The primary telemetry sources include Windows Security logs, especially event IDs that log the creation of computer accounts and any relevant authentication events. Malicious activity in this context could lead to unauthorized access, lateral movement, or persistent frame injection within the environment. Importantly, this detection does NOT confirm that the account has been used maliciously on its own; it merely highlights a suspicious naming convention that warrants further investigation.

  ### Investigation Steps

  - **Check for corresponding Event ID 4741:** Review Windows Security logs for Event ID 4741, which indicates a computer account was created. Check for the naming pattern to confirm suspicious activity.

  - **Verify computer account usage:** Investigate the usage of any computer accounts matching the naming convention by inspecting Event ID 4624 for logon events. Look for abnormal logon times or unusual source IP addresses, which may indicate unauthorized access.

  - **Identify legitimate naming patterns:** Review your organization’s naming conventions for computer accounts to distinguish between benign instances. Legitimate accounts are typically created with standardized prefixes or organizational units (OUs), unlike the suspicious format in this rule.

  - **Conduct a security group audit:** Inspect the security groups associated with identified accounts to determine if the SAMTHEADMIN- accounts have elevated privileges that could be exploited maliciously.

  - **Analyze related network activity:** Monitor for unusual network traffic originating from any suspicious account. Check firewall logs for outbound connections from these accounts that may indicate data exfiltration or lateral movement attempts.

  - **Review past incidents and threat intelligence:** Consult incident logs and threat intelligence sources for previous reports regarding similar account naming schemes associated with known recent attacks or campaigns.

  ### Prioritization

  This alert should be classified as critical due to the potential impact of an account with administrative privileges and its likelihood for use in various attacks including lateral movement and persistence. Given the nature of the naming convention, it is a clear indicator of potential exploitation, especially if it corresponds with other suspicious activities.

  ### Blind Spots and Assumptions

  The detection relies heavily on the presence of comprehensive Windows Security logs, which must be correctly configured. Evasion techniques might include legitimate accounts being misnamed or the use of alternate naming conventions by the adversary. Users or systems that create multiple accounts for legitimate purposes, such as those included in automated deployment scripts, could trigger this alert as well. Related detections, such as monitoring for abnormal changes or access patterns associated with created accounts, would enhance coverage by validating suspicious behavior over time.

