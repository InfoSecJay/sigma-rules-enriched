detection:
  selection1:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName|contains:
    - 'RemCom_stdin'
    - 'RemCom_stdout'
    - 'RemCom_stderr'
  condition: selection1
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of Impacket's PsExec tool, a common utility used for remote system administration and lateral movement within a network. By monitoring Windows Security Event Logs for specific Event IDs tied to file share access, this rule highlights potential misuse of PsExec, which can be employed by attackers to execute arbitrary commands on remote systems, facilitating further compromise or establishing persistence.

  The primary threat scenario involves a malicious actor gaining initial access to a network and subsequently using PsExec to propagate their attack, taking control of additional hosts in an environment. The likely objectives include exfiltrating sensitive data, deploying malware, or leveraging compromised assets for further exploitation. The relevant MITRE ATT&CK techniques for this detection include **Lateral Movement (TA0008)** and **PsExec (T1021.002)**, which describes the exploitation of legitimate administrative tools for unauthorized access to remote systems.

  The primary data sources for this detection come from Windows Security Logs, specifically targeting events related to file share access, particularly those that monitor the use of the IPC$ share, which is often used for remote command execution.

  ### Investigation Steps
  - **Review Security Event Logs:** Examine Windows Security Event Logs for Event ID 5145 related to IPC$ share access. Pay attention to events involving `RemCom_stdin`, `RemCom_stdout`, and `RemCom_stderr`, as these entries indicate potential PsExec usage.
  - **Correlate with Process Execution Logs:** Check process creation events around the same timestamps to identify any unexpected or suspicious command-line arguments or parent-child process relationships that could reveal the use of PsExec or other malicious activity.
  - **Analyze Network Traffic:** Utilize network detection logs to identify any unusual outbound connections made from the host using PsExec, especially to internal or external IP addresses that do not align with normal operating behavior.
  - **Conduct Endpoint Forensics:** If a potential compromise is confirmed, conduct a forensic analysis on the endpoint involved, focusing on recent file changes, running services, and the presence of any malicious executables associated with PsExec or similar tools.

  ### Prioritization
  This alert should be prioritized as high due to the potential for significant impact on network integrity and confidentiality. The use of PsExec can facilitate lateral movement within the network, allowing attackers to spread their foothold and potentially control sensitive systems.

  ### Blind Spots and Assumptions
  Detection capabilities may be limited if logging configurations are not correctly set, specifically if "Object Access > Audit Detailed File Share" settings are not enabled on Windows servers. The detection logic assumes that attack scenarios involving PsExec are recognizable through the specified Event ID; however, sophisticated attackers may utilize alternate methods to achieve similar objectives without triggering these logs. Analysts should be aware that legitimate administrative activity could produce similar logs, causing potential false positives.

