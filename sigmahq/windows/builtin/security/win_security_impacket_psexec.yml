logsource:
  product: windows
  service: security
  definition: 'The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure'
detection:
  selection1:
    EventID: 5145
    ShareName: '\\\\\*\\IPC$'     # looking for the string \\*\IPC$
    RelativeTargetName|contains:
    - 'RemCom_stdin'
    - 'RemCom_stdout'
    - 'RemCom_stderr'
  condition: selection1
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Impacket's PsExec tool through specific network share access events. The behavior indicates that an attacker may be attempting lateral movement within the network to execute commands on other machines, potentially compromising additional systems. The associated MITRE ATT&CK technique is "Lateral Movement: Remote Services" (T1021.002).

  The primary telemetry source is Windows security logs, specifically Event ID 5145, which captures access attempts to shared resources like IPC$. If successful, this behavior may lead to further exploitation, data exfiltration, or a full network compromise. It’s crucial to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions can trigger similar events.

  ### Investigation Steps

  - **Verify Event ID 5145:** Look for Event ID 5145 in the Security logs. Focus on entries with ShareName set to '\\\\\*\\IPC$' and RelativeTargetName containing 'RemCom_stdin', 'RemCom_stdout', or 'RemCom_stderr'. A combination of these values indicates potential malicious PsExec usage.

  - **Assess source IP addresses:** Check the originating IP address from the logs. If the IP is not a recognized administrator workstation or is from an unexpected source, it raises suspicion. Use correlation with other logs to determine the host’s normal activity patterns.

  - **Evaluate user account activity:** Review the user accounts associated with the Event ID 5145. Legitimate administrative user accounts should show expected patterns of activity, while unknown or service accounts may indicate malicious behavior.

  - **Cross-reference with network logs:** Look for connections on port 445 to the affected IPs in Windows Firewall logs or network traffic logs. An outbound connection initiated by a compromised host to another system via SMB should be highlighted.

  - **Inspect for file creation or modification:** Validate any new files created or modified on the target machine around the time of the Event ID 5145 logs. Look for unusual scripts or executables in common PsExec temp directories (e.g., C:\Windows\Temp) that may confirm usage.

  - **Identify administrative usage:** Compare the logged activity against known legitimate administrative actions and tools used within your organization. Frequent use of PsExec in non-administrative roles, especially by generic or non-privileged accounts, should be flagged for further review.

  ### Prioritization

  The alert severity is high due to the potential impact of lateral movement and system compromise. The likelihood of malicious exploitation is significant if detected outside of administratively sanctioned workflows. This behavior is commonly weaponized in attacks to escalate privileges or spread malware across the network.

  ### Blind Spots and Assumptions

  Detection may be hindered by misconfigured audit settings which are necessary to capture Event ID 5145. Evasion techniques include using alternative lateral movement tools or invoking PsExec through legitimate user accounts which could mask malicious activity. Legitimate automated tasks, API calls, or system management actions might trigger the same alerts, necessitating thorough contextual analysis. A companion detection rule focusing on unusual account behavior or privilege escalation attempts would enhance overall coverage and accuracy.

