title: Potentially Suspicious AccessMask Requested From LSASS
id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
status: test
description: Detects process handle on LSASS process with certain access mask
references:
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Roberto Rodriguez, Teymur Kheirkhabarov, Dimitrios Slamaris, Mark 
  Russinovich, Aleksey Potapov, oscd.community (update)
date: 2019-11-01
modified: 2023-12-19
tags:
- attack.credential-access
- car.2019-04-004
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4656     # A handle to an object was requested.
    ObjectName|endswith: '\lsass.exe'
    AccessMask|contains:
    - '0x40'
    - '0x1400'
            # - '0x1000'  # minimum access requirements to query basic info from service
    - '0x100000'
    - '0x1410'            # car.2019-04-004
    - '0x1010'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
  selection_2:
    EventID: 4663     # An attempt was made to access an object
    ObjectName|endswith: '\lsass.exe'
    AccessList|contains:
    - '4484'
    - '4416'
  filter_main_specific:
    ProcessName|endswith:
    - '\csrss.exe'
    - '\GamingServices.exe'
    - '\lsm.exe'
    - '\MicrosoftEdgeUpdate.exe'
    - '\minionhost.exe'          # Cyberreason
    - '\MRT.exe'                 # MS Malware Removal Tool
    - '\MsMpEng.exe'             # Defender
    - '\perfmon.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\svchost.exe'
    - '\taskmgr.exe'
    - '\thor.exe'                # THOR
    - '\thor64.exe'              # THOR
    - '\vmtoolsd.exe'
    - '\VsTskMgr.exe'            # McAfee Enterprise
    - '\wininit.exe'
    - '\wmiprvse.exe'
    - 'RtkAudUService64'         # https://medium.com/falconforce/the-curious-case-of-realtek-and-lsass-33fc0c8482ff
    ProcessName|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - ':\Windows\SysNative\'
    - ':\Windows\System32\'
    - ':\Windows\SysWow64\'
    - ':\Windows\Temp\asgard2-agent\'
  filter_main_generic:
    ProcessName|contains: ':\Program Files'      # too many false positives with legitimate AV and EDR solutions
  filter_main_exact:
    ProcessName|endswith:
    - ':\Windows\System32\taskhostw.exe'
    - ':\Windows\System32\msiexec.exe'
    - ':\Windows\CCM\CcmExec.exe'
  filter_main_sysmon:
    ProcessName|endswith: ':\Windows\Sysmon64.exe'
    AccessList|contains: '%%4484'
  filter_main_aurora:
    ProcessName|contains: ':\Windows\Temp\asgard2-agent-sc\aurora\'
    ProcessName|endswith: '\aurora-agent-64.exe'
    AccessList|contains: '%%4484'
  filter_main_scenarioengine:
        # Example: C:\a70de9569c3a5aa22184ef52a890177b\x64\SCENARIOENGINE.EXE
    ProcessName|endswith: '\x64\SCENARIOENGINE.EXE'
    AccessList|contains: '%%4484'
  filter_main_avira1:
    ProcessName|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\is-'
    ProcessName|endswith: '\avira_system_speedup.tmp'
    AccessList|contains: '%%4484'
  filter_main_avira2:
    ProcessName|contains: ':\Windows\Temp\'
    ProcessName|endswith: '\avira_speedup_setup_update.tmp'
    AccessList|contains: '%%4484'
  filter_main_snmp:
    ProcessName|endswith: ':\Windows\System32\snmp.exe'
    AccessList|contains: '%%4484'
  filter_main_googleupdate:
    ProcessName|contains: ':\Windows\SystemTemp\'
    ProcessName|endswith: '\GoogleUpdate.exe'
    AccessList|contains: '%%4484'
  filter_optional_procmon:
    ProcessName|endswith:
    - '\procmon64.exe'
    - '\procmon.exe'
    AccessList|contains: '%%4484'
  condition: 1 of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software accessing LSASS process for legitimate reason; update the 
  whitelist with it
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious access requests to the LSASS (Local Security Authority Subsystem Service) process with specific access masks associated with credential dumping activities. The likely attacker objective is to gain unauthorized access to sensitive security information, such as user credentials, thus facilitating lateral movement within the network. This behavior is associated with the MITRE ATT&CK technique T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry sources include Windows Security Event logs, specifically Event IDs 4656 (handle request) and 4663 (object access attempt). The security impact of malicious access to LSASS is significant, as it may lead to credential theft. It is important to note that this detection alone does not confirm malicious activity; legitimate applications may also access LSASS for valid reasons.

  ### Investigation Steps

  - **Identify the initiating process:** Review Security Event ID 4688 for process creation events related to the detected access to LSASS. Look for unusual or unrecognized process names that initiated the access attempts and correlate the timestamps with Event IDs 4656 and 4663.

  - **Validate access masks in the context:** For each triggering event, check the AccessMask value to confirm high-confidence malicious indicators. Masks like '0x1400' or '0x1f0fff' indicate potentially malicious intent, whereas masks such as '0x1000' may denote legitimate access.

  - **Review recent changes in user permissions:** Examine the user accounts involved in the access attempts. Identify any recent elevation of privileges or account changes that could indicate malicious use. Use logs from Event ID 4704 (use of a privilege) for tracking such changes.

  - **Analyze legitimate access patterns:** Compare the detected access against known legitimate applications that interact with LSASS, such as system management tools and antivirus solutions. Ensuring these applications can be traced back to expected executables can help rule out false positives.

  - **Check for known malicious processes:** Investigate whether the access attempts originated from processes commonly associated with credential dumping tools, such as 'procmon64.exe' or any other executable in the previously provided filters.

  - **Correlate with historical data:** Review previous security events around the same time to identify other indicative behaviors or known patterns related to the entities triggering the alert. Leverage logs for unusual activity, such as failed login attempts or elevated execution privileges in proximity to the LSASS access.

  ### Prioritization

  This alert is rated as medium severity due to the sensitive nature of the LSASS process and its potential role in credential theft. The likelihood of abuse is notably high, as attacker tools commonly target this process for credential dumping. However, the presence of legitimate applications accessing LSASS may lead to false positives, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate software to generate similar access patterns to LSASS. Ensure comprehensive logging is enabled for Windows Security Event logs to capture all necessary artifacts for reliable detection. Legitimate activities such as routine system management or antivirus updates may trigger this alert. A related detection that strengthens coverage could involve monitoring for known credential dumping tools (e.g., Mimikatz, ProcDump) using additional telemetry sources, such as process command line arguments or PowerShell script execution logs.

