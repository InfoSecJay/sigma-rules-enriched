title: Potentially Suspicious AccessMask Requested From LSASS
id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
status: test
description: Detects process handle on LSASS process with certain access mask
references:
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Roberto Rodriguez, Teymur Kheirkhabarov, Dimitrios Slamaris, Mark 
  Russinovich, Aleksey Potapov, oscd.community (update)
date: 2019-11-01
modified: 2026-06-29
tags:
- attack.credential-access
- car.2019-04-004
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4656     # A handle to an object was requested.
    ObjectName|endswith: '\lsass.exe'
    AccessMask|contains:
    - '0x40'
    - '0x1400'
            # - '0x1000'  # minimum access requirements to query basic info from service
    - '0x100000'
    - '0x1410'            # car.2019-04-004
    - '0x1010'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
  selection_2:
    EventID: 4663     # An attempt was made to access an object
    ObjectName|endswith: '\lsass.exe'
    AccessList|contains:
    - '4484'
    - '4416'
  filter_main_specific:
    ProcessName|endswith:
    - '\csrss.exe'
    - '\GamingServices.exe'
    - '\lsm.exe'
    - '\MicrosoftEdgeUpdate.exe'
    - '\minionhost.exe'          # Cyberreason
    - '\MRT.exe'                 # MS Malware Removal Tool
    - '\MsMpEng.exe'             # Defender
    - '\perfmon.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\svchost.exe'
    - '\taskmgr.exe'
    - '\thor.exe'                # THOR
    - '\thor64.exe'              # THOR
    - '\vmtoolsd.exe'
    - '\VsTskMgr.exe'            # McAfee Enterprise
    - '\wininit.exe'
    - '\wmiprvse.exe'
    - 'RtkAudUService64'         # https://medium.com/falconforce/the-curious-case-of-realtek-and-lsass-33fc0c8482ff
    ProcessName|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - ':\Windows\SysNative\'
    - ':\Windows\System32\'
    - ':\Windows\SysWow64\'
    - ':\Windows\Temp\asgard2-agent\'
  filter_main_generic:
    ProcessName|contains: ':\Program Files'      # too many false positives with legitimate AV and EDR solutions
  filter_main_exact:
    ProcessName|endswith:
    - ':\Windows\System32\taskhostw.exe'
    - ':\Windows\System32\msiexec.exe'
    - ':\Windows\CCM\CcmExec.exe'
  filter_main_sysmon:
    ProcessName|endswith:
    - ':\Windows\Sysmon64.exe'
    - ':\Windows\Sysmon64a.exe'
    AccessList|contains: '%%4484'
  filter_main_aurora:
    ProcessName|contains: ':\Windows\Temp\asgard2-agent-sc\aurora\'
    ProcessName|endswith: '\aurora-agent-64.exe'
    AccessList|contains: '%%4484'
  filter_main_scenarioengine:
        # Example: C:\a70de9569c3a5aa22184ef52a890177b\x64\SCENARIOENGINE.EXE
    ProcessName|endswith: '\x64\SCENARIOENGINE.EXE'
    AccessList|contains: '%%4484'
  filter_main_avira1:
    ProcessName|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\is-'
    ProcessName|endswith: '\avira_system_speedup.tmp'
    AccessList|contains: '%%4484'
  filter_main_avira2:
    ProcessName|contains: ':\Windows\Temp\'
    ProcessName|endswith: '\avira_speedup_setup_update.tmp'
    AccessList|contains: '%%4484'
  filter_main_snmp:
    ProcessName|endswith: ':\Windows\System32\snmp.exe'
    AccessList|contains: '%%4484'
  filter_main_googleupdate:
    ProcessName|contains: ':\Windows\SystemTemp\'
    ProcessName|endswith: '\GoogleUpdate.exe'
    AccessList|contains: '%%4484'
  filter_optional_procmon:
    ProcessName|endswith:
    - '\procmon64.exe'
    - '\procmon64a.exe'
    - '\procmon.exe'
    AccessList|contains: '%%4484'
  condition: 1 of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software accessing LSASS process for legitimate reason; update the 
  whitelist with it
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to access the LSASS (Local Security Authority Subsystem Service) process with potentially suspicious access masks, indicating a high likelihood of credential dumping activities. Attackers often target LSASS to extract sensitive credentials, which can lead to further unauthorized access or lateral movement within the environment. This behavior aligns with the MITRE ATT&CK technique for Credential Dumping (T1003.001).

  The primary telemetry sources involved are Windows Security Event ID 4656 (a handle to an object was requested) and Event ID 4663 (an attempt was made to access an object), specifically focusing on access attempts to the LSASS executable's handle. If this activity is confirmed as malicious, it could lead to compromised user credentials and elevated privileges within the network. It is crucial to note that this detection does not confirm malicious activity on its own; further context must be gathered to assess intent.

  ### Investigation Steps

  - **Review Event IDs 4656 and 4663 for LSASS access:** Check the Security logs for Event ID 4656 or 4663 that indicates access to '\lsass.exe'. Focus on entries from unknown or unapproved processes that request rare access masks such as '0x40' or '0x1f0fff'.

  - **Identify legitimate process behavior:** Validate if common processes like 'svchost.exe' or Windows Defender components are attempting to access LSASS. These typically do not request high-security access masks, unlike potentially malicious processes.

  - **Look for high-confidence indicators of compromise:** Cross-reference any suspicious accesses from Event IDs with processes like 'csrss.exe' or 'GamingServices.exe' that are not typically expected to engage with LSASS. Document request attempts with masks not associated with standard operational activity.

  - **Examine process sourcing and context:** Investigate the path of the process making the request, verifying cleanliness and integrity of locations (noting any unapproved temporary directories, e.g., 'C:\Windows\Temp\asgard2-agent\').

  - **Check for repeated patterns or failed access attempts:** Analyze any patterns of failed or reversed successes in accessing LSASS to reveal orchestration of credential dumping tools, such as known malware signatures requesting elevated permissions.

  - **Investigate network traffic for exfiltration attempts:** If credential dumping is confirmed, triangulate with network logs (e.g., proxies or firewalls) for unusual outbound connections, particularly to unfamiliar IPs or domains which could signify exfiltration of stolen credentials.

  ### Prioritization

  This alert should be treated with medium severity. The security impact is significant, as unauthorized access to LSASS could lead to a full account compromise. The likelihood of malicious abuse is high, given that credential dumping is a well-known tactic among threat actors. This behavior is frequently weaponized in sophisticated attacks targeting Windows environments.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate software accessing LSASS for benign reasons, potentially leading to false positives. Accurate detection relies on complete and correctly configured logging, particularly in ensuring Windows Security events are being captured. Other legitimate service processes could unintentionally trigger this alert, such as Windows system updates or maintenance tasks. A related detection strategy would involve tracking typical credential dumping tools (e.g., Mimikatz) to strengthen detection of lateral movement following initial compromise.

