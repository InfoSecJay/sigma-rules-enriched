title: Potentially Suspicious AccessMask Requested From LSASS
id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
status: test
description: Detects process handle on LSASS process with certain access mask
references:
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Roberto Rodriguez, Teymur Kheirkhabarov, Dimitrios Slamaris, Mark 
  Russinovich, Aleksey Potapov, oscd.community (update)
date: 2019-11-01
modified: 2026-10-20
tags:
- attack.credential-access
- car.2019-04-004
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection_1:
    EventID: 4656     # A handle to an object was requested.
    ObjectName|endswith: '\lsass.exe'
    AccessMask|contains:
    - '0x40'
    - '0x1400'
            # - '0x1000'  # minimum access requirements to query basic info from service
            # - '0x100000'  # SYNCHRONIZE - cannot be used for credential dumping; high FP rate from AV/EDR agents synchronizing on LSASS
    - '0x1410'            # car.2019-04-004
    - '0x1010'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
  selection_2:
    EventID: 4663     # An attempt was made to access an object
    ObjectName|endswith: '\lsass.exe'
    AccessList|contains:
    - '4484'
    - '4416'
  filter_main_specific:
    ProcessName|endswith:
    - '\csrss.exe'
    - '\GamingServices.exe'
    - '\lsm.exe'
    - '\MicrosoftEdgeUpdate.exe'
    - '\minionhost.exe'          # Cyberreason
    - '\MRT.exe'                 # MS Malware Removal Tool
    - '\MsMpEng.exe'             # Defender
    - '\perfmon.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\svchost.exe'
    - '\taskmgr.exe'
    - '\thor.exe'                # THOR
    - '\thor64.exe'              # THOR
    - '\vmtoolsd.exe'
    - '\VsTskMgr.exe'            # McAfee Enterprise
    - '\wininit.exe'
    - '\wmiprvse.exe'
    - 'RtkAudUService64'         # https://medium.com/falconforce/the-curious-case-of-realtek-and-lsass-33fc0c8482ff
    ProcessName|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\Microsoft\Windows Defender\Platform\'
    - ':\Windows\SysNative\'
    - ':\Windows\System32\'
    - ':\Windows\SysWow64\'
    - ':\Windows\Temp\asgard2-agent\'
  filter_main_generic:
    ProcessName|contains: ':\Program Files'      # too many false positives with legitimate AV and EDR solutions
  filter_main_exact:
    ProcessName|endswith:
    - ':\Windows\System32\taskhostw.exe'
    - ':\Windows\System32\msiexec.exe'
    - ':\Windows\CCM\CcmExec.exe'
  filter_main_sysmon:
    ProcessName|endswith:
    - ':\Windows\Sysmon64.exe'
    - ':\Windows\Sysmon64a.exe'
    AccessList|contains: '%%4484'
  filter_main_aurora:
    ProcessName|contains: ':\Windows\Temp\asgard2-agent-sc\aurora\'
    ProcessName|endswith: '\aurora-agent-64.exe'
    AccessList|contains: '%%4484'
  filter_main_scenarioengine:
        # Example: C:\a70de9569c3a5aa22184ef52a890177b\x64\SCENARIOENGINE.EXE
    ProcessName|endswith: '\x64\SCENARIOENGINE.EXE'
    AccessList|contains: '%%4484'
  filter_main_avira1:
    ProcessName|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\is-'
    ProcessName|endswith: '\avira_system_speedup.tmp'
    AccessList|contains: '%%4484'
  filter_main_avira2:
    ProcessName|contains: ':\Windows\Temp\'
    ProcessName|endswith: '\avira_speedup_setup_update.tmp'
    AccessList|contains: '%%4484'
  filter_main_snmp:
    ProcessName|endswith: ':\Windows\System32\snmp.exe'
    AccessList|contains: '%%4484'
  filter_main_googleupdate:
    ProcessName|contains: ':\Windows\SystemTemp\'
    ProcessName|endswith: '\GoogleUpdate.exe'
    AccessList|contains: '%%4484'
  filter_optional_procmon:
    ProcessName|endswith:
    - '\procmon64.exe'
    - '\procmon64a.exe'
    - '\procmon.exe'
    AccessList|contains: '%%4484'
  condition: 1 of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software accessing LSASS process for legitimate reason; update the 
  whitelist with it
level: medium
note: |
  ### Technical Context

  This rule detects requests for specific access masks on the Local Security Authority Subsystem Service (LSASS) process, which is often a target for credential theft. Attackers may seek to access LSASS to extract sensitive information such as credentials or tokens, thereby facilitating lateral movement or privilege escalation within the environment. This behavior fits into the MITRE ATT&CK framework under the **Credential Access** tactic, particularly under the technique **Credentials from LSA** (T1003.001).

  The primary telemetry sources for this detection include Windows Security Event logs, specifically Event ID **4656** (indicating an object handle request) and **4663** (attempts to access an object). If the behavior is indeed malicious, successful access to LSASS can lead to credential theft, resulting in a serious breach of network security. However, this detection does NOT confirm malicious intent on its own; it merely indicates that an access attempt matching expected suspicious patterns occurred.

  ### Investigation Steps

  - **Review Event IDs 4656 and 4663:** Confirm the presence of Event ID **4656** with the ObjectName ending in `\lsass.exe` and the specified AccessMask values. This combination is indicative of potentially malicious access attempts.

  - **Identify legitimate access patterns:** Check recent logs for legitimate processes typically interacting with LSASS, such as `C:\Windows\System32\lsm.exe` or Windows Update tasks. Access from these processes could be benign.

  - **Analyze AccessMask values:** Focus on high-risk masks such as `0x40` (QUERY), `0x1400` (QUERY and READ_CONTROL), and particularly `0x1410`, which could indicate an attempt to dump memory. Mark these as high-confidence indicators of malicious activity.

  - **Examine Process Names associated with alerts:** Ensure that the triggering process does not match benign behaviors or well-known software (e.g., `\MicrosoftEdgeUpdate.exe`). If it does, consider it a false positive.

  - **Check for whitelisted applications:** Verify if the process generating the alert is part of known and trusted applications, as false positives may arise from legitimate software accessing LSASS for updates or management purposes.

  - **Collect additional context from Sysmon:** If Sysmon is deployed, retrieve logs for Event ID **1** to see if the parent process creating the LSASS handle request gives further insight into the threat actor's behavior.

  ### Prioritization

  The severity of this alert is medium due to the criticality of the LSASS process, which is essential for managing authentication and security policies in Windows systems. The likelihood of malicious use of LSASS access attempts is high, as credential dumping is a common tactic employed by attackers during lateral movement and exploitation phases of an attack.

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate software that may access LSASS for valid reasons, resulting in potential false positives. A thorough understanding of organizational software is necessary for effective whitelisting. This rule requires proper Windows security log configurations to ensure visibility of Event IDs 4656 and 4663. Additionally, monitoring related indicators such as abnormal parent-child process relationships often provides deeper context into suspicious activities surrounding LSASS access requests.

