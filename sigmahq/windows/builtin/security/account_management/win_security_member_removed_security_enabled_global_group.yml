note: |
  ### Technical Context
  This detection rule identifies events where a member is removed from a security-enabled global group within a Windows environment. Such group modifications can signify potential malicious activities, including privilege escalation by attackers or insider threats attempting to limit the access of legitimate users. Understanding the context of group membership changes is essential for securing sensitive resources in an organization.

  In scenarios where an attacker gains unauthorized access, they may attempt to manipulate group memberships to consolidate their control over resources or eliminate users who might pose a threat to their activities. By monitoring events linked to security-enabled global groups, such as those reflected by Event IDs 4729 and 633, security teams can track suspicious modifications and take appropriate action.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Privilege Escalation** (TA0004) - Specifically through **Group Membership Modification** (T1098).
  - **Persistence** (TA0003) - Using modified group memberships to maintain access.

  Primary data sources vital for capturing these events are Windows Security Event logs, particularly focusing on group membership changes.

  ### Investigation Steps
  - **Review Security Event Logs**: Inspect Windows Security Event Logs for Event IDs 4729 and 633, which indicate changes to security-enabled global groups. Cross-reference the timestamps with user activity for correlation.
  - **Analyze Group Membership Changes**: Look at the history of group membership changes within the affected global groups to identify any unusual patterns, such as repeated removals or additions, especially from administrative groups.
  - **Identify Affected Users**: Determine which user accounts were impacted by the membership changes. Pay special attention to the roles these accounts play within the organization and their permissions.
  - **Correlate with User Activity**: Check for any recent logins or other activities from the user(s) who were removed to contextualize their recent actions and understand if they had been targeted for removal by an unauthorized entity.

  ### Prioritization
  This alert is considered low severity due to the potential for false positives, however, any removal of users from security-enabled global groups warrants investigation due to the risk it poses for privilege escalation or insider threats within an enterprise environment. Monitoring these changes can assist in mitigating security risks before they escalate.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the configuration of security logs; if Windows Security Auditing is not properly enabled, these events may not be captured. The rule assumes that the logs are being collected consistently and that all modifications to group memberships are legitimate actions by administrators. Additionally, this detection relies on the availability of Event IDs 4729 and 633; if there are gaps or insufficient logging practices, the detection may fail to capture significant activity.

