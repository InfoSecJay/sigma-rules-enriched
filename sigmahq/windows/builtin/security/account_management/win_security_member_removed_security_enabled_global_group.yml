note: |
  ### Technical Context

  This rule detects events where a member is removed from a security-enabled global group in Active Directory, typically through Security Event ID 4729 (member removed from global group) or Event ID 633. The likely attacker objective is to modify permissions or access controls by removing users from roles that grant privileges, which could facilitate persistence or privilege escalation. This behavior aligns with the MITRE ATT&CK technique: Privilege Escalation - T1098.

  Primary telemetry sources include Windows Security Event logs where specific Event IDs (4729, 633) are generated. If the action is unauthorized, it may lead to broader attacks within the environment. It is essential to note that this detection does NOT confirm whether the activity was performed by a malicious actor or if it occurred during legitimate administrative changes.

  ### Investigation Steps

  - **Validate event context:**
    Check Security Event IDs 4729 and 633 in the Windows Security logs to confirm the removal event. Fields to review include `SubjectUserName`, `TargetGlobalGroupName`, and `MemberRemoved`.

  - **Review recent administrative changes:**
    Look for recent legitimate administrative activities in the logs (Event ID 4713 - Audit Directory Service Changes) to establish if this removal aligns with an authorized task. Analyze patterns in `AdminUserName` and `Timestamp`.

  - **Cross-reference group members:**
    Obtain the current membership of the affected global group using PowerShell (Get-ADGroupMember -Identity "GroupName"). Compare this against historical data to identify unusual member removal or reassignments.

  - **Identify indicators of compromise:**
    Investigate if the removal correlates with other suspicious activities such as abnormal logins or changes to critical security settings (Event ID 4672 - Special privileges assigned). Check relevant timestamps for correlation.

  - **Assess potential impact:**
    Determine the role of the removed member within the organization and whether their removal could facilitate activities contrary to security policies. Identify if they had elevated privileges that may expose sensitive assets or information.

  ### Prioritization

  This alert is of low severity but can indicate potentially malicious behavior dependent on the context of the removal. The impact on the organization depends on the removed user's role; if the individual had administrative or high privilege access, there is a higher likelihood of malicious exploitation. While not a common attack vector, this activity could be weaponized in specific scenarios.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative tasks may trigger this alert without malicious intent. Ensuring thorough logging and continuous monitoring of Windows Security Event logs is crucial for reliable detection. Evasion techniques could include valid administrators performing the action benignly. Related detections for monitoring changes in group memberships or authentication anomalies could enhance overall coverage and context for this activity.

