note: |
  ### Technical Context
  This rule detects the deletion of security-enabled global groups within a Windows environment, specifically targeting Event IDs 4730 and 634. This action can signal potentially malicious intent, as the removal of such groups may be leveraged by adversaries to disrupt permissions, manipulate access controls, or facilitate lateral movement and persistence in a compromised environment. Attackers may aim to erase traces of their presence, hinder defenses, or create confusion among security teams by removing important security groups.

  Relevant MITRE ATT&CK tactics that apply here include **Privilege Escalation** (TA0004) and **Persistence** (TA0003), specifically through the use of **Group Policy Modification** (T1098). The significance of this detection is heightened within enterprise settings, where critical security groups govern user rights and access levels across systems.

  Primary data sources for effective investigation include Windows Security event logs, particularly logs detailing group modifications and deletions. Analysts should focus on correlating these events with other user and system activities to assess the legitimacy of the deletion.

  ### Investigation Steps
  - **Review Security Logs**: Analyze Windows Security event logs for Event IDs 4730 and 634 to identify any recent deletions of security-enabled global groups. Check the user account associated with the deletion for unusual activity.

  - **Check Recent Changes**: Investigate other administrative changes related to group policy modifications or permission alterations in conjunction with the deletion, which might indicate coordinated malicious actions.

  - **Cross-reference User Activity**: Look for any logins or sessions from the same user account around the time of the deletion event. Pay special attention to logins from atypical locations or non-standard hours.

  - **Audit Group Membership**: Conduct an audit of group membership for affected global groups to determine the potential impact of the deletion and identify any users who may have lost access due to these changes.

  ### Prioritization
  This alert is considered low severity due to its limited potential for immediate impact; however, repeated occurrences may warrant increased attention as they could signal malicious activity or internal misconfiguration.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the logging of ephemeral or non-standard events that do not generate alerts in standard configurations. The detection logic assumes that the relevant logs are properly configured to capture these event IDs and that the deletions are not legitimate administrative actions. Ensuring comprehensive logging of Active Directory changes and regular review of group policies is necessary for the detection to function effectively.

