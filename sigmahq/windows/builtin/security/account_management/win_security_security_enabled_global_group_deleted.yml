  ### Technical Context

  This Sigma rule detects the deletion of security-enabled global groups in Active Directory, specifically via Event IDs 4730 and 634. The likely attacker objective is to disrupt access control mechanisms, create chaos, or facilitate lateral movement within an organization's network. This activity falls under the MITRE ATT&CK technique "Group Policy Modification" (T1098) and impacts the defense mechanisms of the organization by potentially allowing unauthorized access or privilege escalation.

  The primary telemetry sources are Windows Security Event logs, capturing critical information about group modifications. A successful deletion of a security-enabled global group could weaken security postures and expose sensitive resources. However, this detection does NOT confirm that malicious activity has occurred on its own, as deletions may happen due to legitimate administrative actions.

  ### Investigation Steps

  - **Validate log presence: ** Check for Windows Security Event IDs 4730 and 634 in the security logs within the last X minutes. These logs will explicitly show if a global security group has been deleted.

  - **Review deletion context: ** Identify the user account responsible for the deletion. Examine the Event ID 4730 log entry fields like "SubjectUserName" and "SubjectDomainName" to ascertain if it was done by an authorized administrator rather than a compromised account.

  - **Investigate group configuration: ** Analyze the deleted group details prior to removal by checking for configuration changes in the group settings. Look for critical roles or permissions associated with the deleted group to understand potential impacts.

  - **Identify expected behavior: ** Recognize legitimate deletion patterns, such as scheduled clean-up processes or organizational restructuring plans, by reviewing change management records and verifying pre-approved group deletion requests.

  - **Look for associated alerts: ** Assess if there are accompanying audit logs for any unusual behavior preceding the deletion event. For example, a spike in privilege escalation events associated with the same user account can indicate compromise in other events.

  - **Assess impact on asset inventory: ** Evaluate the current group members of the deleted security-enabled group to gauge the impact on active systems, especially high-value assets. This will help determine if immediate remediations or notifications are warranted.

  ### Prioritization

  The severity of this alert is moderate due to the potential impact on access controls, particularly if the deleted group managed high-privilege users or services. Additionally, the likelihood of malicious activity is moderate, as the deletion of groups is often weaponized by attackers to aid in unauthorized access. An enterprise should treat this alert with caution and investigate promptly to prevent fallout from incorrect access controls.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions that routinely delete groups, resulting in potential false positives. Ensure comprehensive log collection from Windows Event sources to support reliable detection. Other legitimate activities that could trigger this alert include routine administrative housekeeping and restructuring activity. A related detection to consider would be monitoring group membership changes (e.g., Event ID 4728 for member additions), which could strengthen context around group deletions.

