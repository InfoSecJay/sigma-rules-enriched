note: |
  ### Technical Context

  This detection rule identifies when a member is added to a security-enabled global group within a Windows environment, which could facilitate privilege escalation or lateral movement in the network. The likely objective of an attacker is to gain unauthorized access to resources by adding a compromised or malicious account to a group with elevated permissions. This behavior fits into the MITRE ATT&CK framework under the tactic of Privilege Escalation (T1068) and the technique of Abuse Elevation Control Mechanism (T1098).

  The primary telemetry source is the Windows Security Event Logs, specifically Event ID 4728 and Event ID 632, which log group membership changes. If malicious, this activity may lead to unauthorized access to sensitive data or critical system functions. It is important to note that this detection does NOT confirm intent; legitimate administrative activities can also trigger these events.

  ### Investigation Steps

  - **Check the user account involved**: Review Event ID 4728 or Event ID 632 to identify the account added to the group. Correlate this with user access levels and roles to determine if the account typically requires such access.
  - **Validate the group membership change**: Examine the specific security-enabled global group (e.g., Administrators). Legitimate additions typically occur during scheduled maintenance or administrative activities.
  - **Audit the source of the change**: Look for Event IDs 4624 (Logon) for the account making the change; confirm whether it comes from a recognized administrative workstation or server.
  - **Correlate with recent administrative changes**: Review recent changes in group memberships to identify patterns, using Event IDs 4727 and 4729 to see if there were multiple changes in a short period, which could indicate suspicious activity.
  - **Identify malicious indicators**: Look for any accounts being added to high-privilege groups (such as Domain Admins) by non-admin personnel or during non-business hours, using timestamps to validate.
  - **Review historical data**: Check for previous alerts or activity logs from tools like Sysmon (Event ID 10 – Process Access) to see if the added user account exhibited unusual behavior following the group change.

  ### Prioritization

  This alert is considered low severity due to its common occurrence in routine administrative activities. However, the impact can be significant if unauthorized accounts gain access to sensitive resources. The likelihood of malicious use is moderate, as attackers often exploit privilege escalation techniques.

  ### Blind Spots and Assumptions

  Evasion techniques may include utilizing legitimate administrative accounts to make group changes, making detection harder. The effectiveness of this detection relies on having comprehensive logging enabled for group membership changes and might miss legitimate activities such as onboarding processes. A related detection is monitoring for failed logon attempts (Event ID 4625) from users after being added to privileged groups, which could indicate attempted account misuse.

