  ### Technical Context

  The rule detects the creation of a logon event (Event ID 4624) with LogonType 9, indicating a RemoteInteractive logon using the deprecated default username "thisisnotvaliduser". This behavior is characteristic of attackers attempting to exploit the DiagTrackEoP privilege escalation method to gain unauthorized access and escalate privileges on a Windows system. This activity falls under the MITRE ATT&CK tactic of **Privilege Escalation (TA0004)** using the technique **Exploitation of Remote Services (T1210)**.

  Primary telemetry sources include Windows Security Event logs, particularly Event ID 4624. The security impact of this behavior is significant, as it may indicate an adversary successfully leveraging a known vulnerability to elevate privileges. However, this detection does NOT confirm that malicious activity is occurring on its own; it simply indicates that an unusual logon attempt using a default username took place.

  ---

  ### Investigation Steps

  - **Verify the logon context**: Review the full details of Event ID 4624, including account name and source IP address. Look for unusual source IP addresses not recognized as legitimate, which may indicate a potential attack.

  - **Check for legitimate usage**: Identify if "thisisnotvaliduser" has been queried or used historically in your environment. Legitimate uses of this account and their associated Event IDs can help in differentiating benign from malicious activity.

  - **Correlate with other logs**: Look for additional context around this event in related logs (e.g., Event ID 4634 for logoff events, Event ID 4648 for explicit credentials). This combination can indicate if an attacker is attempting persistence or lateral movement.

  - **Investigate account activity**: Query Active Directory for the last logon time of “thisisnotvaliduser”. If this account has no history of legitimate use in the environment, it constitutes a high-confidence malicious activity indicator.

  - **Audit for configurations**: Ensure logging settings for Windows Event logs, specifically for Logon and Logoff events, are correctly configured to capture sufficient detail for detection.

  - **Identify presence of DiagTrackEoP artifacts**: Look for any instances of the DiagTrackEoP binary or related artifacts on the host. Investigate any recent file creation events (e.g., Event ID  creation logs) that align with known malicious timestamps.

  ---

  ### Prioritization

  This alert is critical based on the potential impact on high-value servers where privilege escalation could lead to wider network compromise. The likelihood of malicious abuse is significant, as attackers commonly exploit default usernames to gain unauthorized access.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if logging doesn't capture all LogonType activities, especially if logs are not centrally collected or filtered. Additionally, legitimate remote administration tools may inadvertently trigger this alert, such as support staff using remote management software. A related detection to consider is monitoring for suspicious account creation or changes in Group Policy that may configure unauthorized remote access.

