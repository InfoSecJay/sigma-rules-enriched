  ### Technical Context

  This Sigma rule detects Remote Desktop Protocol (RDP) login attempts originating from localhost (127.0.0.1 or ::1), which could signify an attacker using tunneling techniques to bypass network restrictions. The likely objective for such behavior is lateral movement within the network, enabling intruders to access other systems without raising suspicion. This activity aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0008) and the specific technique T1021.001 - Remote Services: RDP.

  The primary telemetry sources for this detection are Windows Security Event logs, specifically looking for Event ID 4624 (An account was successfully logged on) with Logon Type 10 (RemoteInteractive). If this behavior is malicious, it may indicate an attacker exploiting existing local network configurations to gain unauthorized access, posing a critical security risk. Notably, this detection does NOT confirm that the RDP session is inherently malicious; it may also represent legitimate administrative tasks or misconfigurations.

  ---

  ### Investigation Steps

  - **Review login details: **Examine Event ID 4624 in Security Event logs to confirm if the account used for logging in is an administrative user. Legitimate administrative access should correlate with expected operational activities associated with that user.

  - **Check for RDP connections: **Verify if there are any concurrent or recent RDP connection attempts from external sources (different IP) to the same account in your RDP logs. Concurrent connections may indicate suspicious tunneling activity.

  - **Assess recent local activity: **Investigate Event ID 4688 (A new process has been created) for processes spawned by the same user or session around the time of the RDP login. Look for unexpected or malicious process launches (e.g., tunneling tools) that would indicate compromise.

  - **Correlate with firewall logs: **Review firewall configuration event logs to determine if there were any changes that allowed RDP connections over non-standard ports from the localhost. Unusual changes may indicate a misconfiguration or malicious intent.

  - **Identify User/Group membership: **Evaluate the permissions and group memberships of the user account that logged in via localhost. Ensure the account's privileges align with its intended use within the organization.

  - **Detect lateral movement: **Look for signs of lateral movement in network traffic logs, such as access to other hosts from the affected system immediately after this login session.

  ---

  ### Prioritization

  This alert warrants high priority, as RDP access from localhost can be a significant indicator of malicious activity such as privilege escalation or lateral movement within critical parts of the enterprise network. Given that RDP is commonly targeted for exploitation, the likelihood of abuse is elevated, especially in sensitive environments.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques may include attackers using legitimate accounts for RDP access, making it difficult to discern malicious activity. Additionally, if local policy configurations or security logs are improperly set or missing, the effectiveness of this detection may be compromised. Legitimate activities, such as system administrators accessing servers via RDP for routine maintenance, could trigger false positives. To bolster detection capabilities, consider implementing companion detections for suspicious process creation or abnormal user activity patterns associated with RDP sessions.

