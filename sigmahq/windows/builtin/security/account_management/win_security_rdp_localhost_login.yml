note: |
  ### Technical Context

  This rule detects Remote Desktop Protocol (RDP) login attempts originating from the localhost IP addresses (127.0.0.1 or ::1). Such behavior may indicate a malicious actor using RDP tunneling to bypass network restrictions, potentially allowing unauthorized remote access to systems. The objective of the attacker is likely to establish persistence or conduct lateral movement within a network environment.

  The relevant MITRE ATT&CK tactic is **Lateral Movement** and the technique is **T1021.001 - Remote Desktop Protocol**. Primary telemetry sources include Windows Security logs capturing successful logon events (Event ID 4624) filtered for Logon Type 10, which represents a RemoteInteractive logon. If the alert is confirmed as malicious, it can lead to unauthorized access, data exfiltration, or lateral movement within the network.

  It is important to note that this detection does NOT confirm malicious intent on its own, as RDP sessions from localhost may occur in legitimate scenarios, such as administrative tasks performed on the machine itself.

  ### Investigation Steps

  - **Review Event Details: ** Examine Windows Security Event ID 4624 for Logon Type 10. Verify that the event shows login from localhost (127.0.0.1 or ::1) to confirm the alert trigger.

  - **Check User Context: ** Determine the account used for the RDP login. Review the user permissions and previous login activity to identify if it corresponds with legitimate administrative roles or unusual patterns.

  - **Correlate with Tunneling Activity: ** Investigate any associated network activity or logs indicating the use of tunneling protocols (e.g., SSH or VPNs) at the time of the RDP login. Use logs such as firewall or network appliance telemetry to look for unusual outbound connections.

  - **Identify Legitimate Use Cases: ** Assess if there have been IT tasks planned or scheduled that would require RDP access from localhost, such as system updates or configuration changes made by administrative personnel.

  - **Examine Process Spawned: ** Utilize Sysmon (Event ID 1) to check if any unusual process spawned during the RDP session, indicating if further malicious activity was executed.

  - **Review Configuration Changes: ** Look for any changes to system configurations or services immediately preceding the login event. Use logs showing modifications to remote access settings, like Group Policy changes or firewall rules.

  ### Prioritization

  Alerts triggered by RDP logins from localhost are high severity due to their potential for indicating unauthorized access attempts. The likelihood of malicious abuse is significant, especially in environments with strict access controls where tunneling methods are frequently weaponized for lateral movement.

  ### Blind Spots and Assumptions

  This detection may miss abusive RDP sessions that use legitimate user accounts or originate from whitelisted systems. Reliance on the logging level for capturing Event ID 4624 is critical; without appropriate audit policies, successful logon events may not be logged. Legitimate activity may include local administrative activities or scripted tasks requiring RDP. A companion detection to consider is monitoring for unusual outbound traffic to detect external connections that could complement the local RDP login scenario.

