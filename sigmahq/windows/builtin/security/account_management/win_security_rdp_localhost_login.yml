note: |
  ### Technical Context
  This rule detects remote desktop protocol (RDP) logins originating from the localhost IP addresses (127.0.0.1 and ::1). The primary concern is that such logins might indicate an attacker tunneling their RDP session through a compromised host or establishing unauthorized access via a local connection point. Attackers may leverage these techniques to bypass network restrictions or extend their control over systems while masking their origin, potentially leading to lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Lateral Movement** (Tactic: TA0008)
    - **RDP (T1021.001)**: Using RDP to connect to different machines in the infrastructure while potentially hiding their activity by pretending to be local login sessions.

  The primary data sources involved in this detection are Windows Security logs, specifically focusing on security event ID 4624, which records successful logon events.

  ### Investigation Steps
  - **Review Event Logs**: Check Windows Security logs for Event ID 4624 to confirm the details of the RDP login attempts, noting the timestamp, user account involved, and source IP address.
  - **Analyze User Behavior**: Investigate the user account associated with the localhost login. Determine whether this account is expected to require access via RDP and its usual remote access patterns.
  - **Check for Tunneling Tools**: Look for known tunneling tools or malicious software running on the system related to RDP, such as SSH or VPN client software that may be used to tunnel RDP connections.
  - **Assess Firewall and Network Configurations**: Evaluate firewall rules and network configurations to identify any anomalies in access controls that allow RDP through local interfaces when unusual behavior is identified.

  ### Prioritization
  Given the potential for attackers to conceal their activities through local RDP logins, this alert should be treated with high priority. The ability of an attacker to tunnel into the network raises both the impact of the threat, in terms of critical systems being accessed, and the likelihood of such scenarios occurring within enterprise environments.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage exists in environments where logging may not adequately capture all RDP connection attempts or in scenarios where logging levels are not properly configured to account for such local logins. The detection logic assumes that there is no legitimate business use for RDP from these IP addresses, which may not hold true in all environments. Successful detection of this rule relies on enabled security logging for Windows events, particularly for successful logon events via RDP.

