  ### Technical Context

  This Sigma rule detects abnormal logon events characterized by the use of "ANONYMOUS LOGON" with LogonType 3, suggesting potential exploitation attempts via a RottenPotato-like attack. Attackers aim to escalate privileges or gain unauthorized access to resources using anonymous credentials, which can bypass authentication mechanisms. This activity aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Exploiting Authentication (T1557.001).

  The primary telemetry source is Windows Security logs, specifically focusing on Event ID 4624, which logs successful logon events. If malicious, the impact includes unauthorized system access, which could lead to data exfiltration or lateral movement within the environment. It is important to note that this detection does NOT confirm that an attack is occurring on its own; legitimate system services or misconfigurations could also generate similar logon events.

  ---

  ### Investigation Steps

  - **Review Event ID 4624 for context**: Focus on the LogonType of 3 and check the TargetUserName for "ANONYMOUS LOGON". Evaluate the associated timestamps and the source IP address (127.0.0.1 or ::1) for initial context regarding activity.

  - **Identify user account roles**: Assess the privileges of accounts logging in anonymously. Legitimate operational roles typically do not use "ANONYMOUS LOGON" outside specific service scenarios.

  - **Check for related account activity**: Correlate with other recent logon activities in Security Event logs by examining Event IDs 4624 and 4625 for patterns of repeated failed login attempts or high-risk application access.

  - **Analyze network activity from the host**: Use network logs to check for any suspicious outbound connections (unusual IPs or ports) from the source system, which may indicate further exploitation attempts post-logon.

  - **Investigate the host for persistence artifacts**: Use tools to check for unauthorized file creation or modifications in common persistence directories (e.g., C:\ProgramData). Look for any recent changes made to registry keys associated with logon.

  - **Look for previous alerts or anomalies**: Review the SIEM or alerting system for historical instances of this behavior, focusing on patterns that may indicate recurrent attempts or related malicious indicators.

  ---

  ### Prioritization

  Given the nature of anonymous logons, this alert is considered high severity due to its potential to indicate successful privilege escalation or resource exploitation. The likelihood of malicious intent is significant, as this behavior is not typical for benign user accounts and suggests possible lateral movement by sophisticated adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may miss logon events if advanced evasion techniques are employed to conceal the source or nature of logins. Reliable detection requires proper configuration of Windows Security logs to ensure Event ID 4624 is recorded. Legitimate administrative processes, automated scripts, or misconfigured applications may accidentally trigger this alert. Consider related detections, such as those for unusual Service Principal Name (SPN) requests, which can indicate other privilege escalation attempts that align with this behavior.

