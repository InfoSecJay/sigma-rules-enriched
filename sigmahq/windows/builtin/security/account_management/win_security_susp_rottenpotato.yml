note: |
  ### Technical Context
  This rule detects logon events that exhibit characteristics typical of a RottenPotato-like attack. Specifically, it alerts on remote logon attempts using the "ANONYMOUS LOGON" account with a LogonType of 3, which indicates network logons made through methods like SMB or Remote Desktop Protocol. Attackers leveraging this technique often aim to escalate privileges or conduct malicious activities without legitimate user credentials, commonly attempting to bypass authentication mechanisms on Windows systems.

  The relevant MITRE ATT&CK tactics and techniques involved in this detection include:
  - **Privilege Escalation** (TA0004)
  - **Credential Access** (TA0006)
  - **Service Account Manipulation** (T1557.001)

  Key data sources for this detection include Windows security logs, specifically focusing on EventID 4624, which documents logon attempts. Analyzing these logs can reveal unauthorized access patterns typical of attackers trying to escalate privileges.

  ### Investigation Steps
  - **Review Security Logs:** Collect Windows security logs, specifically looking for EventID 4624 entries that have a LogonType of 3 and involve the "ANONYMOUS LOGON" account.
  - **Analyze IP Addresses:** Investigate the IP addresses associated with the logon events; focus particularly on local loopback addresses (127.0.0.1 or ::1), as they may indicate lateral movement or hidden privilege escalation attempts.
  - **Correlate User Activity:** Examine the user activity around the time of these logon events. Look for any unusual or unauthorized account interactions or modifications that could indicate exploitation or privilege escalation attempts.
  - **Inspect Authentication Methods:** Check for any non-standard authentication methods or significant changes in authentication patterns that could suggest exploitation of vulnerabilities or misconfigurations allowing for anonymous access.

  ### Prioritization
  The severity of this alert is high due to the critical nature of unauthorized logon attempts, especially from anonymous accounts that can lead directly to privilege escalation and further compromise of sensitive systems and data.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Windows security logs are not enabled or adequately configured, particularly if the necessary level of logging is not present to capture EventID 4624. Additionally, the detection logic assumes that the anomaly in using "ANONYMOUS LOGON" within network logins is indicative of malicious intent and does not account for potential misconfigured systems that could lead to similar behavior without an actual attack. Ensuring comprehensive logging of authentication attempts across environments is essential for this alert to function effectively.

