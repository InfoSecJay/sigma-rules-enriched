note: |
  ### Technical Context

  This Sigma rule detects logon events signaling potential misuse of NTLM authentication, specifically when using the 'ANONYMOUS LOGON' user account from the local loopback address. Such behavior often indicates credential theft or privilege escalation attempts related to techniques like RottenPotato, where an attacker exploits vulnerable services to impersonate users and escalate privileges. This detection aligns with the MITRE ATT&CK framework under the tactic of Credential Access (T1557.001).

  Primary telemetry sources include Windows Security Logs, specifically Event ID 4624, which records logon events. If this behavior is malicious, it could allow unauthorized access to sensitive resources, circumventing normal authentication methods. Importantly, while this detection suggests suspicious activity, it does NOT confirm that a successful intrusion or attack has occurred by itself.

  ### Investigation Steps

  - **Identify the logon event details:** Review Windows Security Event ID 4624 logs for timestamp, source IP, and any associated accounts. Look for anomalies in the logon types, particularly any LogonType 3 (network logon) entries with user 'ANONYMOUS LOGON'.

  - **Assess network activity and endpoint logs:** Analyze the network access logs around the event timestamp for local system connections. Look for patterns indicating privilege escalation or service access that are inconsistent with normal operational behavior.

  - **Determine baseline behavior for legitimate users:** Identify known legitimate uses of 'ANONYMOUS LOGON' by reviewing past events. Document expected service accounts or system functions that may utilize this account to establish a baseline for comparison.

  - **Check for other suspicious activity:** Look for correlated events, such as failed logon attempts (Event ID 4625) or Account Lockout events, to indicate brute-force attempts or additional compromise indicators potentially linked to the authenticated session.

  - **Correlate IP usage and asset criticality:** If the logon event originates from crucial systems, escalate investigations as they represent a higher risk of lateral movement or data compromise, particularly when 'ANONYMOUS LOGON' is utilized from a less secure service.

  ### Prioritization

  The severity of this alert is high due to the direct implications for credential access and privilege escalation, particularly on critical systems where unauthorized access could lead to substantial data loss or breaches. Given that these behaviors are commonly associated with known exploitation techniques, prompt analysis and response are warranted.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques by attackers who may modify logon sequences or use legitimate accounts to hide malicious activity. Reliable detection requires a complete configuration of audit logging on critical systems to capture all relevant activity. Legitimate automated processes and services may occasionally trigger this alert, possibly leading to false positives. Complementary detections, such as monitoring for related service abuse (e.g., Event ID 4688 for process creation), can offer additional context and strengthen overall detection capabilities.

