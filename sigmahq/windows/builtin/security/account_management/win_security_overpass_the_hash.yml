level: high
note: |
  ### Technical Context

  This Sigma rule detects successful logon events with Logon Type 9, which indicates the use of new credentials to authenticate to a resource (e.g., a service or a remote system). This behavior is characteristic of Overpass the Hash attacks, where an attacker utilizes captured credentials to impersonate a user session, often leveraging tools like Mimikatz. The primary MITRE ATT&CK tactics and techniques relevant here include Lateral Movement (TA0008) and T1550.002 (Use Alternate Authentication Material).

  The primary telemetry source for this detection is Windows Security Event logs, specifically monitoring Event ID 4624. If confirmed malicious, this indicates the potential compromise of accounts and access to sensitive resources. However, it's important to note that this detection alone does not confirm the identity or intent of the user; it only indicates that a logon occurred using a different method of credential verification.

  ### Investigation Steps

  - **Review Logon Event Details:** Check Event ID 4624 within the Security Event log. Verify that Logon Type is 9, Logon Process Name is 'seclogo', and Authentication Package Name is 'Negotiate'. This combination indicates possible use of Overpass the Hash techniques.

  - **Correlate with User Activity:** Assess user activity leading up to the logon event. Scrutinize Event IDs 4648 (Logon with explicit credentials) and 4672 (Special privileges assigned) for any unusual patterns that may signify compromised credentials.

  - **Identify Malicious Indicators:** Look for specific accounts that should not be using Logon Type 9. Pay attention to the time of day and associated network connections or resource access for anomalous behavior. Use logs from Event ID 5140 (File Share Access) to see if any sensitive resources were accessed after the logon.

  - **Verify Legitimate Usage:** Determine if the user account in question typically requires or is known to use such access methods. Accounts executing administrative tasks across different hosts may be less suspicious than standard user accounts triggering this event unexpectedly.

  - **Monitor Network Connections:** Analyze network connections initiated after the logon event using related logs (e.g., Sysmon Event ID 3 - Network Connection). Unusual external connections shortly after a successful Logon Type 9 should prompt further investigation.

  ### Prioritization

  This alert carries high severity due to the potential for compromising critical systems or sensitive data through stolen credentials. The likelihood of malicious use is significant, especially in environments vulnerable to credential theft techniques. Overpass the Hash attacks are frequently targeted and can lead to escalated access within the network.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging configurations; ensure Security Auditing is enabled for detailed logon events. Legitimate administrative activities utilizing system privileges can inadvertently trigger this alert—e.g., accounts accessing resources using /netonly with the Runas command-line tool. For enhanced detection capabilities, consider implementing companion rules that detect credential dumping (e.g., Mimikatz usage) or anomalous authentication patterns.

