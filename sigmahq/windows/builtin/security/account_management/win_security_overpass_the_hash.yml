note: |
  ### Technical Context
  This detection rule identifies successful logons characterized by logon type 9 (NewCredentials) which are indicative of the "Overpass the Hash" technique commonly exploited by credential dumping tools such as Mimikatz. In this attack scenario, an adversary may utilize valid credentials and manipulate authentication methods to bypass typical security mechanisms, allowing them to gain unauthorized access to systems. The attacker's objective is often to escalate privileges or move laterally within the network, leveraging stolen credentials for malicious purposes.

  The relevant MITRE ATT&CK techniques for this detection include:
  - **T1550.002 - Use Alternate Authentication Material**: This technique encompasses the use of alternative credentials, such as stolen tokens or shadow copies, to authenticate to systems.
  - **T1075 - Pass the Hash**: Refers to an attack where an attacker uses a hashed password instead of the plaintext password to authenticate to systems or services.

  The primary data sources for evidence related to this detection include Windows Security logs, specifically Event ID 4624, which captures logon attempts, as well as potential logs from process monitoring solutions that could confirm the execution of the Mimikatz tool or similar processes.

  ### Investigation Steps
  - **Review Security Event Logs**: Investigate Event ID 4624 for a logon type of 9. Check for unusual accounts that may have been used and correlate with other logins to determine if the activity is legitimate.
  - **Analyze Logon Process**: Assess the `LogonProcessName`, ensuring it is legitimate (`seclogo`), and compare with expected values to identify anomalies or repeated occurrences indicative of exploitation.
  - **Correlate with Credential Use**: Look for additional security logs or alerts around the time of the suspicious login for any indications of credential theft or use, such as execution of Mimikatz or similar tools.
  - **Investigate Targeted Resources**: Confirm whether the target system was accessed or modified after the logon, focusing on any sensitive resources that could indicate privilege escalation or lateral movement.

  ### Prioritization
  This rule is marked with high severity due to the potential for significant security breaches. Successful exploitation of the Overpass the Hash technique can lead to unauthorized access to critical systems and sensitive data, making it crucial for immediate investigation in an enterprise context.

  ### Blind Spots and Assumptions
  There may be gaps in detection if auditing settings are not properly configured, possibly leading to missed Event ID 4624 entries. The detection logic assumes that the targeted systems are not leveraging alternative credential validation methods, such as multi-factor authentication, which could mitigate this risk. Ensuring that security logs are retained and monitored is essential for this alert to function effectively; without comprehensive logging, detection of the Overpass the Hash technique may fail.

