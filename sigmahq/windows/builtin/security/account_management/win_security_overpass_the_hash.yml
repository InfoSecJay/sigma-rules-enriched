logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: seclogo
    AuthenticationPackageName: Negotiate
  condition: selection
falsepositives:
- Runas command-line tool using /netonly parameter
level: high
note: |
  ### Technical Context

  This rule detects successful logon attempts using logon type 9 (NewCredentials), indicative of an Overpass the Hash (Pass-the-Hash) attack, often employed by attackers using tools like Mimikatz. The likely attacker objective is to authenticate to a remote service or system without having the plaintext password, thereby facilitating lateral movement within a compromised network. The relevant MITRE ATT&CK tactic is **Lateral Movement** and the technique is **Pass-the-Hash** (T1550.002).

  The primary telemetry source for this detection is Windows Security Logs, specifically Event ID 4624, which details successful logons. If malicious, this behavior can enable an attacker to control systems without being detected easily, potentially leading to data exfiltration or further compromise. Importantly, this detection does NOT confirm that the logon was malicious on its own, as legitimate administrative functions may use similar methods.

  ### Investigation Steps

  - **Identify logon details**: Review Security Event ID 4624 for the identified logon type (9). Check fields such as `LogonProcessName`, `AuthenticationPackageName`, and `SourceNetworkAddress` for anomalies against baselines.

  - **Correlate with account usage**: Verify if the user account (involved in logon type 9) has legitimate usage patterns or if it is associated with any known compromised accounts or unusual activity leading to escalation.

  - **Assess timing and context**: Check for other events around the time of this logon, focusing on processes like Unauthorized Access (Events 4663: Access to an Object) which can signify data access following credential theft.

  - **Validate legitimate behavior**: Determine if the runas command with the /netonly parameter is employed, suggesting legitimate use of the NewCredentials logon without risking plaintext passwords. Look for those command line parameters in Process Creation logs (Event ID 4688).

  - **Search for lateral movement patterns**: Look for other related logon events (especially logon type 3 for network logons) from the same user account or source IP to confirm sequential access attempts to different systems.

  - **Monitor for additional indicators**: Review for concurrent alerts or logs showing abnormal process creation or network traffic that might correlate with the Overpass the Hash detection, indicating multiple malicious activities.

  ### Prioritization

  This alert is categorized as high severity due to the impact of potential lateral movement across systems in an enterprise, which can compromise security postures. The likelihood of malicious abuse is significant, as this behavior is a known tactic for attackers aiming to expand their access through stolen credentials.

  ### Blind Spots and Assumptions

  Detection limitations may arise if Event ID 4624 logging is disabled or if systems have insufficiently configured audit policies. Legitimate administrative actions could trigger this alert, misleading investigations. A companion detection is monitoring Account Lockout events (Event ID 4740), which can provide additional context on potential brute force attempts or credential theft leading to compromised accounts.

