note: |
  ### Technical Context

  This Sigma rule detects remote logon attempts by administrator accounts on Windows systems, specifically targeting accounts that start with "Admin" and utilize a LogonType of 10, indicating a remote interactive logon. The attacker objective would typically be to gain unauthorized access to systems for privilege escalation, lateral movement, or establishing persistence. This activity aligns with the MITRE ATT&CK technique for "Valid Accounts" (T1078) and "Remote Services" (T1078.001).

  The primary telemetry sources include Windows Security logs, particularly Event ID 4624, which records logon attempts. If malicious, this behavior can lead to significant security breaches, including unauthorized administrative access. However, it is important to note that this detection alone does not confirm that the logon was malicious, as it could also represent legitimate administrative activities.

  ### Investigation Steps

  - **Review the logon details**: Examine Event ID 4624 logs in the Security log for entries where LogonType is 10, focusing on TargetUserName fields that start with "Admin". Look for unusual timestamps or remote IP addresses that are not normally associated with administrative tasks.

  - **Cross-verify IP addresses**: Query the firewall logs or network traffic logs to check if the source IP address aligns with known administrative access points or if it appears suspicious or unusual for your environment.

  - **Assess account mapping**: Identify other accounts associated with the administrator user being investigated. Check if these accounts have had recent modifications or anomalous logon patterns, particularly if they share network or resource access.

  - **Identify legitimate admin behavior**: Document expected behavior for legitimate remote administrative logins, including the typical source IPs, access times, and usage patterns. Compare these norms against the alerting instance for discrepancies.

  - **Look for anomalies in access patterns**: Evaluate the subsequent actions taken after the remote logon, such as file access, process creation (Event ID 4688), or any changes to system configurations. This can indicate whether the access was legitimate or prelude to a malicious action.

  - **Flag high-confidence malicious indicators**: Investigate if the targeted 'Admin' account executed any suspicious administrative commands or accessed sensitive directories immediately following the logon. Event ID 4697 (Service installation) could be a follow-up indicator of compromise.

  ### Prioritization

  This alert should be considered low to medium severity, primarily due to the possibility of benign remote administrative access. However, the alert warrants attention as there is a risk of misuse by actors leveraging valid credentials for unauthorized access. Remote administrative logon by administrator accounts can be weaponized, especially in environments that lack robust access controls.

  ### Blind Spots and Assumptions

  This detection may be evaded by using non-administrator accounts or through other logon types not monitored by this rule. Accurate logon detection requires proper configuration of Windows Security auditing to ensure Event ID 4624 is logged consistently. Legitimate administrative activities, such as scheduled remote maintenance or external vendor support, may unintentionally trigger this alert. Companion detections, such as monitoring for anomalous administrative tasks (e.g., privilege escalation attempts via Event ID 4672) will provide stronger overall security posture.

