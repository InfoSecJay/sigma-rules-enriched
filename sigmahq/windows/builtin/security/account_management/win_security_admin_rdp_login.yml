note: |
  ### Technical Context

  The Sigma rule detects remote logons by users with usernames starting with "Admin" to systems, particularly during logon type 10 (RemoteInteractive). The likely objective of this behavior is for an adversary to gain administrative access from a remote location, which can be used for lateral movement or executing commands. This detection aligns with the MITRE ATT&CK framework under the "T1078 - Valid Accounts" technique, specifically T1078.001 for local accounts.

  The primary telemetry sources required for this detection are Windows Security logs, specifically Event ID 4624, which captures successful logon events. If malicious, the security impact includes unauthorized access to administrative functions, which could lead to further compromise or control of the network. This detection does NOT confirm malicious intent on its own, as legitimate administrative users may conduct remote logons as part of their duties.

  ### Investigation Steps

  - **Verify logon details**: Review Windows Security logs for Event ID 4624. Check the 'TargetUserName' and 'LogonType' fields; confirm if any logons appear abnormal or outside of standard operational hours.

  - **Assess remote access configurations**: Identify if the logged administrator user has a legitimate need for remote access by checking the organization's remote access policies and confirming if the host's usage policy aligns with expected behavior.

  - **Investigate potentially benign activity**: Determine if the remote logon corresponds with known anticipated administrative tasks. Look for patterns in logon times and originating IP addresses that align with normal administrative work schedules.

  - **Identify malicious indicators**: Focus on other associated logs (e.g., Event ID 4740 for account lockouts) or logon attempts (Event ID 4625) that occur in proximity to the detected remote logon. Frequent failed attempts followed by a successful logon may indicate an adversary's brute-force method.

  - **Examine subsequent activity**: After identifying successful logon events, investigate for unusual process creation or permission changes on the affected assets within a short time frame. Reference Sysmon Event ID 1 for process creation anomalies.

  ### Prioritization

  This alert has low severity in the enterprise context due to the commonality of legitimate remote administrative activities. However, the presence of this logon can indicate potential malicious abuse if combined with other suspicious behavior or if occurring in unexpected time frames. Attackers frequently exploit valid accounts for lateral movement, increasing possible risk.

  ### Blind Spots and Assumptions

  Detection limitations may arise since legitimate administrator actions will generate similar logs, leading to potential false positives. Reliable detection requires comprehensive log collection from all systems where administrative access is possible, including proper configurations of Remote Desktop Protocol (RDP). Additionally, users may legitimately log on from various remote locations. Related detections that could enhance overall security posture include monitoring for unusual command execution (Sysmon Event ID 10) following such logons.

