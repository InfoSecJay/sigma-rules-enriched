note: |
  ### Technical Context
  This detection rule identifies instances of remote logins executed by users whose names start with "Admin," specifically targeting the use of Logon Type 10 (RemoteInteractive). The primary objective of this detection is to monitor potential unauthorized access or privilege escalation efforts by malicious actors leveraging administrator accounts, which are often prime targets due to their elevated permissions. The effective monitoring of such logins helps in identifying abnormal authentication behaviors that deviate from established access patterns defined by internal policies.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Initial Access** (TA0001) via the use of legitimate administrative accounts (T1078.001).
  - **Lateral Movement** (TA0008) as attackers may attempt to access other systems remotely.
  - **Privilege Escalation** (TA0004), whereby unauthorized users may gain higher-level access.

  The primary data sources for this detection include Windows Security Event Logs, particularly focusing on Event ID 4624 that logs successful account logon events.

  ### Investigation Steps
  - **Review Security Event Logs:** Check Windows Security Event Logs around Event ID 4624 for all entries that indicate a RemoteInteractive logon. Prioritize records displaying the "Admin" prefix to narrow down potential incidents.
  - **Correlate with Known User Activity:** Validate the legitimacy of the detected remote logins by cross-referencing with known user activities and scheduled administrative tasks to discern if the logons align with expected access patterns.
  - **Audit for Policy Compliance:** Ensure that internal policies regarding the use of admin accounts are being adhered to, particularly relating to the use of "Admin" accounts as secondary only. Investigate any unauthorized use instances.
  - **Analyze Account Behavior:** Look for unusual or suspicious administrative activities associated with the detected logins, such as unexpected changes in system configurations or access to sensitive data.

  ### Prioritization
  This alert is classified as low severity due to the potential for legitimate administrative activities that may trigger it. However, given the sensitive nature of administrative accounts, any unexpected remote logins warrant timely investigation to prevent lateral movement or privilege escalation by unauthorized users.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage due to the potential for false positives stemming from legitimate administrative tasks that involve remote logons. Additionally, this rule assumes that all administrative accounts follow the predefined naming conventions, which might not capture variations across different environments. To function correctly, it is essential that windows logs track Event ID 4624 with reliable retention and accessibility settings configured in the security logging policy.

