logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: 'Advapi'
    AuthenticationPackageName: 'Negotiate'
    ImpersonationLevel: '%%1833'     # Impersonation
  condition: selection
falsepositives:
- Anti-Virus
level: medium
note: |
  ### Technical Context

  This rule detects potential abuse of access tokens, specifically through the use of impersonation in a Windows environment. Attackers may leverage token duplication or impersonation to gain elevated privileges, execute malicious actions while appearing as a legitimate user, or circumvent access controls. The relevant MITRE ATT&CK technique for this behavior is "Token Impersonation/Theft" (T1134.001). Primary telemetry sources include Windows Security logs, specifically Event ID 4624, indicating logon events with specific conditions such as logon type, process name, and impersonation levels.

  If malicious, this behavior can lead to unauthorized system access, privilege escalation, and potential data compromise. It is important to note that this detection alone does not confirm malicious intent; legitimate applications, such as those managed by security software, may perform similar activities under controlled circumstances.

  ### Investigation Steps

  - **Verify the Event Details:** Check Event ID 4624 for logon type 9. Look for fields such as `LogonProcessName` and `AuthenticationPackageName`. Legitimate instances might involve trusted applications or administrative utilities.
  - **Analyze Impersonation Levels:** Examine the `ImpersonationLevel` field; a value of `%%1833` indicates impersonation. Assess if this corresponds with benign administrative actions or if it appears anomalous for the context.
  - **Review User Context:** Investigate the user account involved in the logon event. Cross-reference with normal operational roles. Abnormal roles performing actions related to impersonation can indicate malicious intent.
  - **Check for Token Duplication:** Look for evidence of "DuplicateToken" or "ImpersonateLoggedOnUser" calls within the application logs or other relevant telemetry that aligns with the time of the detected logon event.
  - **Correlate with Other Alerts:** Examine for related alerts or behavioral indicators around the same timeframe, such as other suspicious logon events (Event ID 4624) or privilege escalations (Event ID 4672) that may strengthen the case for potential misuse.
  - **Assess Host Role and Activity:** Determine the criticality of the affected system and its typical workload. Identify instances where elevated impersonation is expected (e.g., domain administrators performing maintenance) to differentiate between legitimate and suspicious behavior.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on security if successful impersonation occurs on critical systems. While not uniquely indicative of an attack, the likelihood of malicious abuse is significant, as impersonation techniques are commonly weaponized by adversaries for privilege escalation and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of additional context around legitimate administrative activities that can trigger similar events. Reliable detection requires comprehensive logging configurations to capture all necessary security events. Furthermore, legitimate applications, especially security tools, may use access token manipulation techniques. A companion detection for monitoring abnormal process creations (e.g., Sysmon Event ID 1) can enhance visibility of potentially malicious behaviors related to this alert.

