detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: 'Advapi'
    AuthenticationPackageName: 'Negotiate'
    ImpersonationLevel: '%%1833'     # Impersonation
  condition: selection
falsepositives:
- Anti-Virus
level: medium
note: |
  ### Technical Context

  This rule detects potential access token manipulation through the use of specific Windows logon events, particularly focusing on the creation of access tokens that may allow an attacker to impersonate other users. The likely attacker objective is to escalate privileges or elevate their access to perform unauthorized actions on behalf of a legitimate user. This activity relates to the MITRE ATT&CK framework under the tactic of Privilege Escalation (TA0004) and technique T1134.001 (Access Token Manipulation).

  The primary telemetry source is the Windows Security log, specifically Security Event ID 4624. If malicious, the impact could range from unauthorized access to sensitive data to full system compromise. Importantly, this detection does NOT confirm malicious intent; legitimate applications and services may perform similar actions under normal operational circumstances.

  ### Investigation Steps

  - **Verify Logon Event ID 4624: ** Examine Security Event ID 4624 for LogonType 9, indicating a service or batch logon; expect this for legitimate system services or administrative scripts. Look for associated user accounts and their permissions.

  - **Check for Impersonation Levels: ** Review the ImpersonationLevel field (should be '%%1833' for impersonation) in the event log entry. Legitimate applications may require impersonation but should match expected service accounts; unusual user accounts may indicate malicious activity.

  - **Analyze Process Names: ** Investigate the LogonProcessName field for 'Advapi'; confirm against known legitimate processes or services to ensure they align with expected behaviors on the host. Unrecognized processes could indicate malicious execution.

  - **Correlate Additional Events:** Cross-reference with other related events, such as Event ID 4672 (Special Permissions), which may indicate privilege escalation attempts corresponding to the access token manipulation.

  - **Evaluate Host Criticality: ** Consider the role of the affected system; access token abuse on a domain controller or critical server warrants a higher priority response compared to a less critical workstation.

  ### Prioritization

  This alert has medium severity as it indicates potential privilege escalation actions on a system, which, depending on the context, could lead to substantial impacts to sensitive resources. While access token abuse can be weaponized, the likelihood of abuse largely depends on the context of associated accounts and behaviors observed on the system.

  ### Blind Spots and Assumptions

  Evasion techniques include attackers using sophisticated methods to fabricate legitimate processes, thereby bypassing detection. Ensure that logging is configured properly to capture all authentication events; any gaps may lead to undetected malicious behavior. Legitimate scheduled tasks or system administrators performing necessary actions may trigger this alert. A companion detection such as monitoring for abnormal user behavior (e.g., unusual remote logins) can help strengthen overall coverage.

