title: Potential Access Token Abuse
id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
status: test
description: Detects potential token impersonation and theft. Example, when 
  using "DuplicateToken(Ex)" and "ImpersonateLoggedOnUser" with the 
  "LOGON32_LOGON_NEW_CREDENTIALS flag".
references:
