logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: 'Kerberos'
    IpAddress: '127.0.0.1'
    TargetUserSid|startswith: 'S-1-5-21-'
    TargetUserSid|endswith: '-500'
  filter_main_ip_null:
    IpPort: '0'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects successful logon events where the Logon Package is Kerberos, the IP address is localhost (127.0.0.1), and the target user SID corresponds to the built-in local Administrator account. This behavior may indicate an attacker attempting to perform a Kerberos relay attack to escalate privileges from a limited user account to local System privileges on a domain-joined machine. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1548) and Credential Access.

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 4624, which records successful logon events. If found to be malicious, this activity potentially compromises the integrity of critical systems, enabling unauthorized local administrator access. However, this detection alone does not confirm malicious intent, as legitimate administrative tasks could result in similar logon patterns.

  ### Investigation Steps

  - **Review Event ID 4624 entries:** Query Windows Security Event logs for Event ID 4624. Look specifically for logs where LogonType is 3, AuthenticationPackageName is 'Kerberos', and the IP address is '127.0.0.1'.

  - **Identify user activity context:** Correlate the timestamp of the suspicious logon attempt with previous logs of the user in question. Verify whether the user recently executed actions that would legitimate local admin access (e.g., software installations).

  - **Examine process creation around the time of logon:** Check for Event ID 4688 (Process Creation) in Sysmon logs. Validate if processes initiated post-logon (especially by local Administrator) show signs of credential harvesting or exploit attempts.

  - **Assess host role:** Confirm whether the affected system is a critical asset (e.g., Domain Controller or management server). Increased scrutiny should be applied if it is.

  - **Look for vulnerable services:** Identify any services or applications running on the localhost that may be susceptible to relay attacks. Review permissions and configurations that might facilitate such attacks.

  - **Check for known evasion signs:** If anomalous logon behavior is detected but classified as legitimate, assess for additional indicators of compromise (e.g., usage of a security bypass tool or previously known exploits).

  ### Prioritization

  This alert has high severity due to the potential impact of local administrative access on a domain-joined system, which can be used for lateral movement or compromising sensitive data. The likelihood of this behavior being exploited malicously is significant, as Kerberos relay attacks are commonly weaponized by adversaries to escalate privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by systems not logging or improperly configured Event IDs, leading to false negatives. Legitimate administrative actions, such as remote support sessions or script executions by trusted personnel, might trigger this alert. A companion detection focusing on anomalous high-privilege process executions (e.g., unexpected use of Task Scheduler by the local admin) would enhance coverage against potential attacks.

