note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious local logon events leveraging Kerberos authentication where the logon attempt comes from the localhost IP address (127.0.0.1) and targets the built-in local Administrator account (SID ending with -500). The likely attacker objective is to escalate privileges from a non-administrator account to the local system account using a Kerberos relay attack variant. This behavior aligns with the MITRE ATT&CK technique for Privilege Escalation (T1548) and could indicate an adversary attempting to elevate their access rights within the system without proper credentials.

  The primary telemetry source consists of Windows Security Event Logs, specifically Event ID 4624 (An account was successfully logged on). If malicious, this behavior could allow an attacker to gain extensive control over the affected system. Importantly, this detection does NOT confirm malicious intent on its own; it requires further investigation to determine the legitimacy of the logon.

  ---

  ### Investigation Steps

  - **Identify logon details**: Review Event ID 4624 logs for the action timestamp, user account, and workstation name. Note the logon type (should be 3) and verify if the authenticated user is a known legitimate administrator account or an unexpected one.

  - **Corroborate with process creation logs**: Investigate any related process creation events (Event ID 4688) occurring around the same timestamp to check for suspicious executable activity initiated by the Administrator account.

  - **Assess recent account activity**: Query Active Directory for recent changes or unusual patterns in the user account activity; this can help identify any legitimate administrative uses versus potentially malicious behavior.

  - **Look for lateral movement indicators**: Examine related logs (such as DNS or outbound connections) for unusual patterns that may indicate lateral movement attempts emanating from the local system’s network context, particularly around localhost connections.

  - **Evaluate expected behavior**: Consider legitimate administrative tasks executed by the Local Administrator account (e.g., software installations or system updates). Document any known instances where this account was used under expected conditions.

  - **Trace connection paths in logs**: Analyze network logs (e.g., Windows Firewall logs) for any traffic coming from or going to localhost around the event, especially querying unusual ports or services commonly associated with Kerberos relay attacks.

  ---

  ### Prioritization

  This alert should be treated as high severity due to its potential to indicate a privilege escalation attempt affecting critical systems. The likelihood of malicious abuse is notable given the specific user account and authentication method involved, and similar behaviors are often observed in active exploitation scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not being captured properly; ensure that Security Event Logs are configured for detailed logon events, specifically capturing Event ID 4624. This alert may also trigger from legitimate administrative functions, requiring context and a deeper investigation into recent account activities. Companion detections, such as monitoring for unusual account creations or modification events in Active Directory, can strengthen overall coverage against privilege escalation attempts.

