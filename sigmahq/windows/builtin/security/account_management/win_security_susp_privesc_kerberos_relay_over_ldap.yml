logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: 'Kerberos'
    IpAddress: '127.0.0.1'
    TargetUserSid|startswith: 'S-1-5-21-'
    TargetUserSid|endswith: '-500'
  filter_main_ip_null:
    IpPort: '0'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify potential privilege escalation attempts via local Kerberos relay attacks. Specifically, it flags successful logon events where the Logon Package is "Kerberos," the remote address is configured to localhost (127.0.0.1), and the target user is the built-in local Administrator account (S-1-5-21-*-500). This pattern may indicate malicious activity where an attacker, using a compromised or limited user account, attempts to elevate privileges on a domain-joined machine to gain local System level access.

  The primary objectives for an attacker using this technique typically include gaining elevated privileges on a compromised system — a critical step towards further exploitation or lateral movement within the network. Attackers are known to leverage Kerberos relay attacks to misuse the authentication process, allowing them to impersonate trusted services and escalate their privileges without needing direct access to sensitive credentials.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Privilege Escalation** (TA0004)
    - **Kerberos Ticket Granting Ticket (TGT)** (T1558.002)

  The best sources of telemetry for this detection are Windows security event logs, particularly those associated with Event ID 4624, which captures logon events, as they contain pertinent information about the authentication method and the user involved.

  ### Investigation Steps
  - **Review Security Logs:** Examine Windows security event logs for Event ID 4624, filtering for logon events with LogonType 3, AuthenticationPackageName "Kerberos," and the IP address set to localhost.
  - **Analyze User Activity:** Investigate the activity of the user account that triggered this event. Review prior and subsequent logon events and actions taken to discern any unusual or suspicious patterns.
  - **Correlate with System Changes:** Look for other system logs or alerts that coincide with the detected logon event, such as changes in user privileges, modifications to critical system files, or service startups that might indicate active exploitation attempts.
  - **Confirm User Compliance:** Verify whether the logged user account is authorized to perform actions as the local Administrator, and check if any unauthorized access has occurred on the system by cross-referencing with other access logs.

  ### Prioritization
  This alert is rated as high severity because it signals a critical risk of privilege escalation that can lead to significant breaches of sensitive systems or data. The likelihood of exploitation is notable, particularly in environments where local accounts have substantial permissions.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, including potential false negatives when attackers use authentic accounts or mimic legitimate activity to avoid detection. The logic assumes that no legitimate process would utilize a Kerberos logon with localhost to the local Administrator account in typical operations, which may not always hold true in every environment. Also, for this alert to function effectively, logging should be properly configured to capture Event ID 4624, and monitoring of Kerberos authentication should be enabled across the network.

