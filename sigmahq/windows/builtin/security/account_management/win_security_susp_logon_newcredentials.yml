  ### Technical Context
  This detection rule identifies outgoing logon events that utilize new credentials. Specifically, it focuses on instances where a user account logs on to a system using an alternative set of credentials as indicated by Windows Event ID 4624 and a Logon Type of 9 (New Credentials). This behavior may signify potential lateral movement by an adversary attempting to gain access to other systems within the network, often leveraging stolen or otherwise acquired credentials.

  In a threat scenario, an attacker leveraging this technique may aim to escalate privileges within the environment or pivot to additional systems in a network. Potential objectives include exfiltrating sensitive data, deploying further malware, or establishing persistence within the organization. By leveraging new credentials, attackers can bypass conventional measures that guard against access granted through legitimate user accounts.

  Relevant MITRE ATT&CK techniques related to this behavior include:
  - **T1075 - Pass the Hash**
  - **T1550 - Use Alternate Authentication Material**

  The primary data source for this detection is Windows security logs, specifically focusing on logon event records that expose attempts to authenticate with new credentials.

  ### Investigation Steps
  - **Review Windows Security Logs**: Examine logs for Event ID 4624 indicating logon events, particularly those with Logon Type 9. Pay attention to the user accounts involved and the source IP addresses.

  - **Cross-Reference User Activity**: Investigate the context of the user account performing the logon. Check for any prior or subsequent suspicious activities, such as unusual access patterns that may suggest account compromise.

  - **Correlate with Other Security Tools**: Utilize tools like EDR or SIEM to correlate this logon activity with other security events or alerts. Look for signs of privilege escalation or lateral movement that could indicate malicious intent.

  - **Analyze Network Traffic**: If available, inspect network traffic logs around the time of the event for any unusual outbound connections or data transfers that coincide with the logon activity.

  ### Prioritization
  The alert is categorized as low severity due to the potential for false positives, primarily from legitimate remote administration activity. However, the successful use of new credentials could indicate a compromised account, which requires immediate attention and further validation.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of unwanted access, particularly in cases where attackers have comprehensive knowledge of the environment and can blend into normal operational traffic. The rule assumes logs for Event ID 4624 with Logon Type 9 are being recorded and retained without gaps. Configuration of security logging levels must ensure these events are logged adequately for this detection to be effective.

