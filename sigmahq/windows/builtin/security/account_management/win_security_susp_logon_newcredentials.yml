  ---

  ### Technical Context

  This rule detects instances where new credentials are used for logon events on a Windows system, specifically focusing on logon type 9 (NewCredentials). The likely attacker objective is lateral movement within the network, allowing the adversary to access resources under the identity of another account without complete knowledge of its password. The relevant MITRE ATT&CK techniques are T1550 (Use Alternate Authentication Material) and T1075 (Pass the Hash).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 4624 for successful logon events. If malicious, this behavior can lead to unauthorized system access and privilege escalation. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also result in this logon type.

  ---

  ### Investigation Steps

  - **Investigate Event ID 4624:** Review Windows Security Event logs for Event ID 4624 entries with Logon Type 9 to identify the source system and account used for the logon. Look for timestamps that align with user activity.

  - **Check for Suspicious Source IPs:** Determine the originating IP address for the logon. Investigate if the IP is associated with known malicious actors or if it aligns with untrusted internal segments.

  - **Compare Against Normal Patterns:** Establish patterns of normal remote administration activities for the system and investigate if the logon event deviates from established behavior. Legitimate tasks typically use known admin accounts during business hours.

  - **Examine Account Compromise Indicators:** Look for high-confidence malicious indicators, such as Event ID 4648 indicating a logon attempt with explicit credentials, occurring around the same time window as the new credentials logon.

  - **Trace Process Creation Events:** Search for related process creation events around the same timestamp using Sysmon Event ID 1. This may reveal malicious scripts or tools being executed after the logon.

  - **Identify Anomalous User Behavior:** Review user activities associated with the account that performed the logon. Assess if there are any unauthorized access attempts to sensitive directories or resources following the logon event.

  ---

  ### Prioritization

  This alert has a low severity level in an enterprise context, as it can indicate legitimate administrative activities. However, the likelihood of malicious abuse exists due to its common use in lateral movement, especially in environments with unidentified credentials or accounts.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of legitimate admin credentials to mask malicious logon activity. This detection relies heavily on accurate logging configurations—if Event ID 4624 is not correctly logging, detection will fail. Legitimate remote management tasks, such as those performed by help desk staff, may also trigger this alert. A companion detection is the monitoring of Event ID 4648 to provide additional visibility into accounts using explicit credentials for access.

