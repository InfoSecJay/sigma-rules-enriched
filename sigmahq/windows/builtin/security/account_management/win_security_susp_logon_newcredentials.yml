  ---

  ### Technical Context

  This rule detects logon events using new credentials through Event ID 4624 and Logon Type 9. The behavior typically indicates an attacker attempting lateral movement by authenticating to a system using credentials obtained through phishing, credential dumping, or other means. This aligns with the MITRE ATT&CK techniques for Defense Evasion (T1203) and Lateral Movement (T1550). The primary telemetry source is Windows Security Event logs, specifically looking for logon event entries that match the defined parameters.

  If successful, this action can lead to unauthorized access to sensitive data and potential compromise of the affected system. However, it is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate remote administrative tasks can trigger this logon event.

  ---

  ### Investigation Steps

  - **Review Event Details**: Examine the attributes of Event ID 4624. Check for anomalies such as unusual user accounts or unfamiliar source IP addresses. Look for `NewCredential` in the "Logon Information" fields which indicates the use of new credentials.

  - **Correlate with Previous Activity**: Analyze recent events associated with the user account in question. Look for patterns of suspicious behavior, such as multiple logon attempts, failed logins, or access to sensitive resources. Filter on the same User ID to assess activity (e.g., events 4625, 4648).

  - **Identify Malicious Indicators**: Cross-reference the user account with known threat actor tactics. If the user is a non-privileged account logging in to sensitive systems, this could be a strong indicator of compromise.

  - **Check for Expected Legitimate Activity**: Confirm if the logon is consistent with known remote management tasks. For instance, verify if admins routinely access the target system and under which contexts (e.g., scheduled maintenance, updates).

  - **Asset Criticality Assessment**: Identify the significance of the affected asset. If the target system is critical infrastructure or contains sensitive data, escalate the investigation.

  - **Validate File Activity**: Check for recent file changes or access patterns on the target asset. Utilize EDR or file integrity monitoring tools to identify any unauthorized file modifications or potential exfiltration activities.

  ---

  ### Prioritization

  This alert should be treated with low severity within the enterprise context because it involves logon events which can often be attributed to legitimate administrative actions. However, the risk of lateral movement and credential misuse means it should not be dismissed, especially on high-value systems.

  ---

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by configuration issues; if logging settings for Windows Event ID 4624 are not enabled across all servers, this could prevent capturing important events. Legitimate actions such as administrative remote access and helpdesk support may inadvertently trigger this alert. A related detection should include monitoring failed logon attempts (Event ID 4625), helping identify potential brute-force attempts prior to successful credential usage.

