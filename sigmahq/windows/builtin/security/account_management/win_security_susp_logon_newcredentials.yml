  ### Technical Context

  This rule detects logon events that specify new credentials, specifically Event ID 4624 with Logon Type 9, which indicates a remote interactive logon using different credentials than those previously used. The likely attacker objective is to establish unauthorized access to a system, potentially to move laterally within the network or escalate privileges. This behavior aligns with the MITRE ATT&CK technique "Lateral Movement" (T1550).

  The primary telemetry source for this detection is Windows Security logs, particularly focusing on Event ID 4624. If malicious, this behavior can lead to unauthorized data access or system compromise. However, it's important to note that this detection does NOT confirm malicious intent on its own, as legitimate remote administrative activities can also generate similar logon events.

  ### Investigation Steps

  - **Review Event ID 4624 details:** Analyze the Security Event log for Event ID 4624. Look for fields such as Account Name, Source IP Address, and Workstation Name. Legitimate remote administrative sessions typically involve known IP addresses and authorized user accounts.

  - **Correlate logon time and user activity:** Check the time of the logon against the user’s typical activity patterns. If the login occurs outside of working hours or from an unusual location, it could indicate malicious activity.

  - **Inspect the Source IP Address:** Examine the Source IP Address associated with the logon. Flag any external or untrusted IP addresses, especially if they do not correspond to known administrative workstations.

  - **Analyze associated events:** Look for other Security Event logs that might correlate with the logon event, such as subsequent process creation events (Event ID 4688) to analyze what actions were taken immediately after the login.

  - **Identify user account elevation:** Check the user privileges associated with the logged-on account. An account that typically does not have elevated rights performing a logon using new credentials may indicate a security risk.

  ### Prioritization

  In an enterprise context, this alert is of low severity. However, if a high-privilege system or sensitive data is involved, the potential impact may increase. While malicious abuse is possible, this behavior can often occur through legitimate remote administration, thus requiring further validation.

  ### Blind Spots and Assumptions

  This detection may have limitations given the potential for legitimate remote administration activities to trigger it. It relies heavily on accurate Windows Security logging and may be affected by log rotation or omission. Common evasion techniques include using legitimate credentials for access or exploiting VPN connections. A related detection that complements this coverage is monitoring for anomalous network traffic following the logon event, which could reveal malicious lateral movement attempts.

