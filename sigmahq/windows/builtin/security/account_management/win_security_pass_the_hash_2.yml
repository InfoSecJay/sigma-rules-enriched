note: |
  ### Technical Context

  This rule detects lateral movement via the Pass-the-Hash (PtH) technique, where an attacker uses stolen hashed credentials to authenticate to other systems in the network without needing to know the plaintext password. The likely objective of this behavior is to gain unauthorized access to additional systems and move laterally to escalate privileges or obtain sensitive data. This activity correlates with the MITRE ATT&CK tactic of Lateral Movement (TA_0008) and the specific technique ID T1550.002. Primary telemetry sources include Windows Security logs, specifically looking for Event ID 4624 which indicates successful logins. If malicious, this behavior can lead to further compromise of systems and sensitive information loss. It is important to note that this detection does not confirm an intrusion on its own; further investigation is required to establish the context around the logon events.

  ### Investigation Steps

  - **Review the Event ID 4624 entries:** Look for entries with `LogonType: 3` (Network). Verify that `SubjectUserSid` is 'S-1-0-0' and `LogonProcessName` is 'NtLmSsp' to confirm potential PtH activity.

  - **Check for known admin activities:** Cross-reference detected logons occurring around the same time with scheduled admin tasks or legitimate third-party service actions to identify benign behavior.

  - **Identify anomalous credentials usage:** Match the detected logon events with the `TargetUserName: 'ANONYMOUS LOGON'` filter indicating potential unauthorized access. This usually implies the use of a stolen hash.

  - **Review source IP addresses:** Investigate the IP addresses associated with the logon events for abnormal traffic patterns or previous malicious activity. Validate with network logs for known infrastructure.

  - **Validate system role:** Determine if the target system is critical (e.g., domain controllers or servers with sensitive data) and whether the use of the detected logon method is expected for its role in the environment.

  - **Check recent credential store changes:** Investigate for any recent changes in the Local Security Authority (LSA) or SAM database that may correlate with the detected logon to identify prior credential theft events.

  ### Prioritization

  This alert merits medium severity due to the potential impact of unauthorized access to critical systems and/or sensitive data across the network. While the likelihood of abuse via Pass-the-Hash is moderate, it is a well-documented attack technique often leveraged during lateral movement in breaches, making it a significant concern.

  ### Blind Spots and Assumptions

  Detection may be limited by log retention policies or absence of Windows Security event logging for certain systems. Adversaries might use legitimate credentials or encryption to evade detection. Additionally, valid administrative activities or network services may trigger this alert unintentionally. Implementing companion detections for account lockouts (Event ID 4625) could provide more context and strengthen overall coverage against lateral movement activities.

