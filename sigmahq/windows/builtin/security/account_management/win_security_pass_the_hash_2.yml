note: |
  ### Technical Context

  This rule detects the use of the Pass-the-Hash (PtH) technique, indicated by specific Windows Security Event IDs that signal unauthorized lateral movement across a network. The attacker likely seeks to exploit compromised credentials to access additional systems, bypassing standard authentication protocols. This behavior relates to MITRE ATT&CK technique T1550.002 (Pass the Hash) under the Lateral Movement tactic. Primary telemetry sources include Windows Security logs, specifically Event ID 4624, which logs successful user logons. If malicious, this activity could lead to unauthorized access to sensitive data or systems, compromising overall network security. Importantly, this detection does NOT confirm intent or successful data exfiltration on its own.

  ### Investigation Steps

  - **Review Event IDs for suspicious logon types**: Check Security Event ID 4624 for LogonType 3 (Network) or LogonType 9 (NewCredentials). If these types are present with LogonProcessName 'NtLmSsp' or 'seclogo', they may indicate PtH activity.

  - **Identify the user context and asset**: Validate the TargetUserName against legitimate users within the organization, especially focusing on whether 'ANONYMOUS LOGON' was involved, which is a strong indicator of anomalous activity.

  - **Cross-reference with other logs**: Analyze related logs from Sysmon (if deployed), particularly Event ID 1 (Process Creation), to track processes that constructively initiated LogonType 3 logins. Look for unexpected parent-child relationships indicative of lateral movement.

  - **Establish baseline behavior**: Compare the logs with historical data to discern normal logon patterns. Legitimate logons will typically include users from known nodes in the network accessing expected resources without the use of anonymous or service accounts.

  - **Check for credential dumps or high-profile process events**: Review for evidence of tools used in PtH attacks (such as Mimikatz) on the endpoint, referencing Sysmon event IDs that indicate credential dumping or service creation that corresponds with detected logon events.

  ### Prioritization

  The severity of this alert is medium, as it relates to potential lateral movement within the network, presenting significant risks if successful. The likelihood of malicious abuse is heightened, given that Pass-the-Hash is common in post-exploitation scenarios where attackers attempt to deepen their access. This method is a well-known and weaponized technique among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full logging configurations; systems not collecting adequate logs could evade this detection. Additionally, legitimate administrative actions, such as system administration or management tasks, may trigger this alert when using service accounts improperly configured. A related detection that strengthens coverage is tracking unexpected adjustments to access controls or local administrator groups, which could indicate preparation for lateral movement.

