note: |
  ### Technical Context
  This detection rule identifies instances of Pass-the-Hash (PtH) attacks, a technique used by attackers to authenticate to remote systems by exploiting stolen hashed credentials rather than plain text passwords. Attackers executing this technique aim to move laterally across the network after gaining initial access, often leveraging misconfigured systems or weak security policies to escalate privileges and gain unauthorized access to sensitive resources.

  Relevant MITRE ATT&CK tactics for this rule include **Lateral Movement** (TA_0008) and **Credential Access** (TA_0006), specifically the sub-technique **Pass-the-Hash** (T1550.002). These techniques highlight the methods through which unauthorized users can use captured credentials to impersonate legitimate users, facilitating further exploitation.

  Primary data sources for detecting PtH activities include Windows Security logs that capture event IDs related to logon attempts. The use of Event ID 4624 is particularly significant, as it logs successful logon attempts that can provide insights into potentially unauthorized access through hashed credentials.

  ### Investigation Steps
  - **Review Security Logs**: Examine Windows Security logs for Event ID 4624. Focus on entries with LogonType 3 (Network logon) and LogonProcessName set to 'NtLmSsp' or 'seclogo' as they indicate potential Pass-the-Hash activity.
  - **Analyze User Access Patterns**: Investigate the TargetUserName field in the logs. Any logon attempts with 'ANONYMOUS LOGON' should be scrutinized for unusual patterns, particularly those occurring outside of normal operational hours.
  - **Correlate with Endpoint Data**: Cross-reference findings with EDR telemetry to identify any processes that were executed during the same time frame as the suspicious logon events, noting the origin and legitimacy of those processes.
  - **Assess Privilege Escalation Paths**: Evaluate any recent changes in user permissions or group memberships that may correlate with the PtH activities, as these can indicate unauthorized privilege escalation.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of successful lateral movement facilitated by PtH attacks. Given the likelihood of these attacks occurring in enterprise environments, where credential theft can lead to significant data breaches, timely detection is crucial.

  ### Blind Spots and Assumptions
  Detected activities could be masked by legitimate administrative tasks, leading to possible false positives from authorized users performing necessary actions. Additionally, the detection logic's reliance on specific Windows Security logs presumes that logging is correctly configured and maintained across all critical systems. If event logs are not generated or retained properly, detection may fail. The effectiveness of this rule is contingent upon having comprehensive logging enabled for all relevant user activity across the network.

