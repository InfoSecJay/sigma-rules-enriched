note: |
  ### Technical Context

  This rule detects the use of the `Clip.exe` utility to execute obfuscated PowerShell scripts on Windows systems. Attackers may leverage this to execute malicious payloads covertly, aiming to bypass detection mechanisms and maintain persistence or execute further commands. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Obfuscated Files or Information (T1027).

  The primary telemetry source is Windows Event ID 4697 from the Security Log, which logs attempts to create services, including instances of `Clip.exe` when invoked with obfuscated commands. If malicious, such behavior could lead to unauthorized execution of scripts that may inflict harm on the system or exfiltrate sensitive data. However, detection of this event does NOT prove malicious intent on its own, as legitimate applications may also use similar techniques.

  ### Investigation Steps

  - **Review Event ID 4697 logs**: Search for Event ID 4697 in the Security Log. Check for the service name containing "Clip.exe" and any associated user accounts. Legitimate instances may show usage by trusted applications or scripts documented within the organization.

  - **Analyze command line arguments**: If available, inspect the command line used with `Clip.exe` for any obfuscation methods, such as encoded commands or unusual script behavior. Malicious indicators may include strings like "Invoke-Obfuscation" or suspicious command patterns.

  - **Check related process creation logs**: Look for related process creation logs in Sysmon (Event ID 1) or Windows Security logs (Event ID 4688) to see if other potentially malicious processes were spawned around the same time as `Clip.exe`. Signs of legitimate execution will often correlate with well-formed, known scripts.

  - **Identify file modifications**: Look for any file creations or modifications that coincide with the execution of `Clip.exe`. Use File Integrity Monitoring (FIM) data or query file system logs to identify unauthorized script files that may have been created or altered.

  - **Assess the asset's role and environment**: Consider the context of the affected machine. For example, if it is a user workstation without direct scripting or administrative intent related to PowerShell or clipboard utilities, this should raise red flags for potential malicious activity.

  ### Prioritization

  This alert is considered high severity due to the potential impact of executing obfuscated PowerShell scripts on an enterprise system, which can lead to broader attacks or data breaches. The likelihood of malicious abuse is significant, especially as obfuscation techniques are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  A potential limitation includes the fact that legitimate applications can also invoke `Clip.exe`, which might lead to false positives. Reliable detection relies on having the `System Security Extension` logging enabled for Event ID 4697. Additionally, actions like scheduled tasks or other clipboard manipulations from trusted internal applications could trigger the alert. A related detection rule for monitoring the usage of PowerShell environment variable manipulation (MITRE ATT&CK T1059.001) could enhance coverage against obfuscation techniques.

