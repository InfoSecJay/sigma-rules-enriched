note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands executed via the .NET compression libraries, specifically using `COMPRESS OBFUSCATION`. The behavior indicates an attempt by an attacker to evade detection by presenting malicious commands in a non-readable format, likely aiming to execute payloads stealthily. This activity aligns with the MITRE ATT&CK tactics of Execution (TA0002) and the technique for Obfuscated Files or Information (T1027).

  The primary telemetry sources required for this detection include Windows Security Event logs, particularly Event ID 4697. If successful, the execution of obfuscated commands can lead to the deployment of malware, data exfiltration, or lateral movement within the network. Notably, this detection does NOT confirm that the command was executed successfully or had any harmful effects without further context.

  ### Investigation Steps

  - **Check for Event ID 4697:** Review the Security Event logs for Event ID 4697. Look specifically for the presence of commands involving `new-object`, `text.encoding]::ascii`, and `readtoend` in the `ServiceFileName` field. If found, treat this as a potential malicious activity.

  - **Verify the Source:** Identify the user or process that triggered the obfuscated PowerShell command. Assess whether the source user and host are legitimate within the organization. External accounts accessing production systems may indicate a compromise.

  - **Analyze the Full Command:** Investigate the entire command executed by checking Script Block Logging or Transcription Logs in PowerShell. Compare the command's context and parameters to a known baseline. Legitimate usage may involve standardized scripts for administration and configuration management.

  - **Assess Process Creation:** Examine related process creation events (Security Event ID 4688 and Sysmon Event ID 1) that may correlate with the obfuscated command. Check for parent processes that invoke PowerShell (e.g., cmd.exe, rundll32.exe) as potential indicators of malicious intent.

  - **Monitor for Following Activity:** After detecting the use of this obfuscation method, monitor for subsequent suspicious activities such as network connections made by PowerShell or other unusual system behaviors. These may indicate post-exploitation efforts or lateral movement.

  ### Prioritization

  This alert carries medium severity due to the nature of obfuscation often used in advanced persistent threats (APTs). While the system affected may be critical, the likelihood of this particular obfuscation being malicious is moderate, as some IT teams may utilize similar methods for legitimate purposes. However, this technique is commonly weaponized by adversaries to evade security controls.

  ### Blind Spots and Assumptions

  Detection can be limited if the necessary Windows logging configurations are not enabled, particularly for Event ID 4697. Some legitimate activities, particularly in development or scripting scenarios, may inadvertently trigger this alert. Implementing companion detections, such as monitoring for known executable patterns related to PowerShell execution (e.g., `Invoke-Expression`, `Invoke-Command`), can improve coverage against suspicious behavior.

