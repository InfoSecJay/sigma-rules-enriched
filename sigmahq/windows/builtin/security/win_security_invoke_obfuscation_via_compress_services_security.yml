detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    - 'readtoend'
    ServiceFileName|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell's obfuscated commands through the COMPRESS OBFUSCATION technique, specifically targeting the creation of a service using .NET classes for reading and decompressing data. The likely objective of an attacker using this method is to evade detection while executing malicious scripts or commands, often aiming to deliver payloads or establish persistence. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1027) and Execution (T1059.001).

  The primary telemetry source for this detection is Windows Security Event ID 4697, which logs the creation of a service. If malicious, this behavior could lead to unauthorized command execution or malware deployment, resulting in data breaches or system compromise. Importantly, this detection does NOT confirm that any malicious payload has been executed; it only indicates potential obfuscation techniques being employed.

  ### Investigation Steps

  - **Check the event details for Event ID 4697:** Review the creation details of the service in Windows Security logs. Look for unusual ServiceFileName entries or unexpected service names that may indicate malicious activity.

  - **Validate the parameters of the PowerShell command:** Look for the presence of 'new-object', 'text.encoding]::ascii', and 'readtoend' in the service configuration to support the alert's validity. Legitimate services do not typically utilize these specific obfuscation techniques.

  - **Cross-reference with known threats:** Use threat intelligence sources to check if the detected PowerShell commands or services correspond with any documented malicious campaigns or tools that utilize obfuscation.

  - **Monitor for additional suspicious PowerShell activity:** Investigate recent PowerShell execution logs (Event IDs 4103 or 4688 for process creation) to see if the service creation is associated with other known indicators of compromise (IoCs) or patterns of abnormal usage.

  - **Identify patterns of legitimate activity:** Assess if the behavior matches any legitimate administrative tasks or third-party applications within your environment, noting any discrepancies that may support a malicious hypothesis.

  - **Examine host criticality and network context:** Determine if the affected host has elevated privileges or if it interacts with sensitive areas of your network that could be exploited by an attacker, heightening the urgency to respond.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on the system and the likelihood of it being exploited by a malicious actor. While obfuscation techniques are increasingly common, their use can signify sophisticated attempts at evasion and persistence, making them a significant concern for enterprise security.

  ### Blind Spots and Assumptions

  Detection limitations include possible obfuscation techniques that may bypass signature-based detections or occur within trusted applications that utilize similar constructs. Reliable detection requires proper logging configurations to capture Event ID 4697, specifically the System Security Extension audit subcategory. Legitimate administrative use of PowerShell could trigger this alert, particularly during authorized software installations or updates. A related detection that could strengthen coverage includes monitoring for direct PowerShell command execution events (Event ID 4104 logs), which would provide additional layers of context around the alert.

