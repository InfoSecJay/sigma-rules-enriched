detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    - 'readtoend'
    ServiceFileName|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of obfuscated PowerShell scripts that employ the `COMPRESS OBFUSCATION` technique, which is often utilized by threat actors to evade detection by security systems. Specifically, this detection mechanism identifies PowerShell commands that manipulate and exploit the `System.IO.Compression` and `System.IO.StreamReader` classes, which are commonly used for reading compressed data streams. By executing such commands, attackers may attempt to disguise malicious activities, making it harder for security teams to recognize deployments of malware or unauthorized scripts.

  The likely threat scenario involves attackers attempting to execute obfuscated malicious PowerShell code relating to remote code execution or information theft. Attackers leverage obfuscation to bypass security controls and achieve stealth, thus aligning their operations with the MITRE ATT&CK techniques for evasion and execution. The relevant MITRE tactics and techniques are:
  - **Defense Evasion (TA0005)**: Obfuscated Files or Information (T1027)
  - **Execution (TA0002)**: PowerShell (T1059.001)

  The primary data sources for this detection are Windows Security Event logs, specifically focusing on audit logs that capture Event ID 4697, which logs service installations and changes. Other useful logs might include PowerShell operational logging and file access logs.

  ### Investigation Steps
  - **Review Security Logs**: Examine Windows Security logs (Event ID 4697) for any instances of service installations that match the obfuscation patterns detailed in this rule. Look for irregular service names or paths that may indicate an unauthorized installation.
  - **Analyze PowerShell Activity**: Check for unusual PowerShell command executions and arguments in the PowerShell logs. Pay special attention to any instances of `System.IO.Compression` or `System.IO.StreamReader` in command histories.
  - **Correlate with Known Indicators**: Cross-reference any detected obfuscated commands with an existing Threat Intelligence database to determine if they are associated with known malicious actors or methodologies.
  - **Assess Impact and Context**: If a suspicious command is identified, perform context analysis, including checking for lateral movement attempts or other suspicious behaviors such as unusual network traffic to discern the overall impact.

  ### Prioritization
  The alert is categorized as medium severity due to the moderate likelihood of encountering obfuscated PowerShell usage in environments exposed to advanced attackers. The impact on enterprise systems can be significant if such obfuscation is part of a broader attack strategy, potentially leading to data breaches, unauthorized access, or system compromise.

  ### Blind Spots and Assumptions
  The detection logic assumes that all service installations and changes will be properly logged by Windows Security Event logs and that the necessary audit settings for Event ID 4697 are enabled. If logs are not appropriately configured, instances of malicious activity may go undetected. Additionally, some obfuscation techniques may not be captured if they deviate from the specific patterns outlined in the detection criteria, leaving potential gaps in visibility against advanced obfuscation methods.

