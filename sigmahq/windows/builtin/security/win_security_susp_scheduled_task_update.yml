detection:
  selection_eid:
    EventID: 4702
  selection_paths:
    TaskContentNew|contains:
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - 'C:\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Temporary Internet'
    - 'C:\ProgramData\'
    - 'C:\Perflogs\'
  selection_commands:
    TaskContentNew|contains:
    - 'regsvr32'
    - 'rundll32'
    - 'cmd.exe</Command>'
    - 'cmd</Command>'
    - '<Arguments>/c '
    - '<Arguments>/k '
    - '<Arguments>/r '
    - 'powershell'
    - 'pwsh'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'certutil'
    - 'bitsadmin'
    - 'bash.exe'
    - 'bash '
    - 'scrcons'
    - 'wmic '
    - 'wmic.exe'
    - 'forfiles'
    - 'scriptrunner'
    - 'hh.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious updates to scheduled tasks on Windows systems, specifically those that include certain indicative keywords or path patterns often associated with malicious behavior. Threat scenarios include attackers leveraging scheduled tasks to maintain persistence or execute payloads at set intervals. The objective of these actions is to establish a foothold within the environment, facilitate lateral movement, or execute arbitrary commands that can lead to data exfiltration, credential theft, or other forms of compromise.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (T1053.005): Malicious actors often use scheduled tasks as a means to maintain persistence within a corporate network.
  - **Execution** (T1203): By using commands such as `powershell` or `cmd.exe`, attackers can execute their payloads dynamically.
  - **Privilege Escalation** (T1068): Modifying scheduled tasks can be part of broader strategies to gain higher privileges, enabling attackers to carry out administrative functions without detection.

  Primary data sources for this detection include Windows Security Event logs, particularly Event ID 4702, which records modified scheduled tasks, as well as logs detailing command execution and process creation activities.

  ### Investigation Steps
  - **Review Scheduled Task Logs**: Examine Windows Security Event logs for Event ID 4702 to identify specific changes made to scheduled tasks and the circumstances around those changes.
  - **Analyze Command Execution**: Check for any command execution logs that correspond with the modified tasks, focusing on whether the commands include suspicious keywords or patterns identified in the detection rule.
  - **Inspect Task Content and Paths**: Investigate the content of scheduled tasks and the paths they reference, looking for suspicious directories (like `Temp`, `Public`, etc.) that are commonly exploited by malicious actors.
  - **Correlate with EDR Data**: Utilize Endpoint Detection and Response (EDR) data to understand the broader context of the alert by checking for any related process creations or suspicious activities that occurred around the same time the scheduled task was updated.

  ### Prioritization
  The alert is considered high severity due to its potential impact on the organization. Modifying scheduled tasks often indicates an attempt by an attacker to establish persistence or execute malicious code, both of which can lead to severe compromise within the network if left unchecked.

  ### Blind Spots and Assumptions
  This detection may miss scenarios where scheduled tasks are legitimately updated by administrators without malicious intent, leading to false positives. An assumption made in the detection logic is that all modifications to scheduled tasks using the specified keywords are malicious; however, legitimate administrative activities may occur. Furthermore, Event ID 4702 must be properly configured through the Advanced Audit Policy settings for effective detection, and the command field must be extracted from the embedded XML in the event data to accurately analyze the contents of the task modifications.

