logsource:
  product: windows
  service: security
  definition: 'The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.'
detection:
  selection_eid:
    EventID: 4702
  selection_paths:
    TaskContentNew|contains:
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - 'C:\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Temporary Internet'
    - 'C:\ProgramData\'
    - 'C:\Perflogs\'
  selection_commands:
    TaskContentNew|contains:
    - 'regsvr32'
    - 'rundll32'
    - 'cmd.exe</Command>'
    - 'cmd</Command>'
    - '<Arguments>/c '
    - '<Arguments>/k '
    - '<Arguments>/r '
    - 'powershell'
    - 'pwsh'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'certutil'
    - 'bitsadmin'
    - 'bash.exe'
    - 'bash '
    - 'scrcons'
    - 'wmic '
    - 'wmic.exe'
    - 'forfiles'
    - 'scriptrunner'
    - 'hh.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies modifications to scheduled tasks that contain suspicious paths or commands often associated with malicious activity, such as executing PowerShell scripts or remote code execution utilities. Attackers may use scheduled tasks as a persistence mechanism to maintain access to compromised systems, especially during a lateral movement or initial access phase. This behavior aligns with the MITRE ATT&CK technique T1053.005 (Scheduled Task/Job).

  The primary telemetry sources for this detection are Windows Security Event logs, specifically Event ID 4702 (Audit Scheduled Task Updated). If the alert is confirmed as malicious, it could indicate an elevated risk of data exfiltration or system compromise. It's important to note that this rule does not, on its own, confirm malicious intent but highlights potential anomalies requiring further investigation.

  ### Investigation Steps

  - **Review recent changes to scheduled tasks:** Check Windows Security Event ID 4702 logs. Look for `TaskContentNew` entries with keywords indicating suspicious commands (e.g., `powershell`, `cmd.exe`). Analyze changes made within the last 72 hours for urgency.

  - **Verify command paths and arguments:** Cross-reference paths in the `TaskContentNew` field against known benign locations. Legitimate scheduled tasks should not point to common user directories like `\Temp\` or `\AppData\` unless specifically expected in your environment.

  - **Correlate with user activity:** Look at Event ID 4624 (Logon Events) to ascertain the user account associated with the task modification. Review the context of the user's activity; investigate if anomalous logons (e.g., at unusual times) correspond with task changes.

  - **Identify high-confidence malicious indicators:** If the `TaskContentNew` includes executables like `regsvr32`, `mshta`, or commands with `'/c '` or `'/k '`, mark these as strong indicators of potential exploitation attempts. Check for additional artifacts indicating execution of these commands.

  - **Look for additional signatures of adversarial behavior:** Cross-reference other events, such as those related to process creations (Event ID 4688) or command line arguments from Sysmon logs, to reveal evidence of execution following task modification.

  ### Prioritization

  The severity of this alert is high due to the potential impact on key systems where scheduled tasks are often used for essential operations. The likelihood of malicious abuse is also significant, as attackers frequently exploit this technique for persistence. Given the common use of scheduled tasks in attacks, rapid response is warranted.

  ### Blind Spots and Assumptions

  This detection may not capture all malicious modifications, especially if attackers employ evasion techniques (i.e., using legitimate tools in non-suspicious ways). The accuracy of alerts depends on proper logging settings; ensure that the Audit Other Object Access Events policy is enabled. Legitimate system updates or maintenance tasks could trigger similar alerts. Companion detections such as monitoring event 4688 for the execution of suspicious commands executed by a scheduled task can enhance overall detection coverage.

