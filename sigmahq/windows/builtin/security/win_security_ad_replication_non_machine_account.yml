logsource:
  product: windows
  service: security
  definition: |
    Requirements: A SACL must be configured on the domain NC root object (e.g. DC=domain,DC=com)
    to generate Event 4662. Add via ADSI Edit: navigate to the domain NC root → Properties →
    Security → Advanced → Auditing → add an ACE for Everyone, Type: Success, Applies to:
    This object only, rights: DS-Replication-Get-Changes and DS-Replication-Get-Changes-All.
    The OS audit subcategory must also be enabled:
    auditpol /set /subcategory:"Directory Service Access" /success:enable
detection:
  selection:
    EventID: 4662
    Properties|contains:
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'         # DS-Replication-Get-Changes-All
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'         # DS-Replication-Get-Changes
    - '9923a32a-3607-11d2-b9be-0000f87a36b2'         # DS-Replication-Synchronize
    - '89e95b76-444d-4c62-991a-0facbeda640c'         # DS-Replication-Get-Changes-In-Filtered-Set
  filter_main_machine_accounts:
    SubjectUserName|endswith: '$'
  filter_optional_subject_domain:
    SubjectDomainName: 'Window Manager'
  filter_optional_subject_usersid:
    SubjectUserName|startswith:
    - 'NT AUT'
    - 'MSOL_'         # https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/reference-connect-accounts-permissions#ad-ds-connector-account
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential misuse of the Active Directory Replication Service (ADRS) by monitoring for requests made from non-machine accounts to retrieve directory information using replication rights. The likely objective of an attacker may be to extract sensitive information such as user credentials or group memberships. This behavior corresponds to the MITRE ATT&CK technique T1003.006 (Credential Dumping: Active Directory Replication).

  The primary telemetry source is Security Event ID 4662, which indicates directory service access attempts. If these requests are found to be malicious, it can lead to significant security impacts, including credential theft and further domain compromise. However, this detection does NOT confirm that sensitive data was successfully extracted or that an attack is definitely underway without further investigation.

  ### Investigation Steps

  - **Check Event 4662 logs**: Review Security Event ID 4662 in the Windows Security logs. Look for events with `Properties` containing identifiers related to replication (e.g., `1131f6ad-9c07-11d1-f79f-00c04fc2dcd2`). Determine the `SubjectUserName` field to identify the user account making the request.

  - **Identify machine accounts**: Validate if the `SubjectUserName` ends with a `$`, indicating a service or machine account. If not, categorize as suspicious.

  - **Review account privileges**: Check the permissions assigned to the account using the `Active Directory Users and Computers` tool or similar. Legitimate accounts will typically have limited or no replication privileges.

  - **Analyze activity context**: Correlate Event IDs around the time of the alert. Look for access patterns that indicate potential compromise, such as repetitive access from the same non-machine account to the replication service.

  - **Investigate associated user behavior**: Review the `Account Logon Events` (Event ID 4624) and `Account Lockout Events` (Event ID 4740) for the subject account. Frequent login attempts or unusual access times may indicate account compromise.

  - **Cross-reference with trusted accounts**: Identify if the non-machine account is part of a legitimate administrative process. Note that accounts starting with `NT AUT` or `MSOL_` are expected in specific contexts related to Azure or custom automated processes.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for significant impact on Active Directory security if an attacker exploits these privileges. The likelihood of malicious abuse is moderate since non-machine accounts typically should not be accessing replication services, but false positives can arise from misconfigured accounts or legitimate administrative actions.

  ### Blind Spots and Assumptions

  Detection may be limited if auditing is not properly configured or if necessary logs are missing. Adversaries may use legitimate accounts or automated scripts to obfuscate their activities, potentially evading detection. Additionally, legitimate service accounts may occasionally trigger this alert during routine operations. A related detection to consider for additional coverage includes monitoring suspicious LDAP queries (such as Event ID 4788) or frequent service account logins to identify potential account compromise.

