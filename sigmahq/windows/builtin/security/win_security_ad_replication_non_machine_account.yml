logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    AccessMask: '0x100'
    Properties|contains:
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter:
  - SubjectUserName|endswith: '$'
  - SubjectUserName|startswith: 'MSOL_'       # https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/reference-connect-accounts-permissions#ad-ds-connector-account
  condition: selection and not filter
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This detection targets the unauthorized use of the Active Directory Replication Service (ADRS) by non-machine accounts, which is indicative of potential credential theft or privilege escalation attempts. Attackers may aim to extract sensitive data or system credentials through tampered replication requests.

  The relevant MITRE ATT&CK tactic is Credential Access, specifically technique T1003.006 (Credential Dumping: Active Directory). The primary telemetry comes from Windows Security Event Logs, particularly Event ID 4662, which logs detailed operations against Active Directory objects. If this behavior is malicious, it could lead to significant compromises of user credentials and access to further systems.

  This detection does NOT confirm that malicious activity has occurred; it indicates potential misuse that requires further investigation.

  ### Investigation Steps

  - **Identify the triggering event:** Review Security Event ID 4662 logs for the specified AccessMask ('0x100') and Properties containing '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2', '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2', or '89e95b76-444d-4c62-991a-0facbeda640c'. Look specifically for entries where `SubjectUserName` ends with '$' or starts with 'MSOL_'.

  - **Correlate account types:** Determine if the `SubjectUserName` is associated with a legitimate machine account or if it is an anomalous user account. Legitimate machine accounts typically appear in a standard naming convention, while non-standard logins may indicate exploitation.

  - **Assess replication behavior:** Investigate replication requests in AD logs for unusual patterns, such as requests originating from unexpected locations or times. Look for high-frequency queries that deviate from normal replication intervals.

  - **Review impacted systems:** Compile a list of machines involved in the replication event from the Event ID 4662 logs. Assess their criticality within the environment and verify if they have recent changes or incidents.

  - **Identify user activity:** Check associated user accounts for recent unusual activity (e.g., password changes, account lockouts) which may indicate potential credential compromise. Look in Security Event ID 4740 for account lockout events.

  - **Document follow-up actions:** If indicators of compromise (IOCs) are confirmed, initiate remediation steps including isolation of affected accounts, password resets, and further forensic investigation to establish the breadth of the incident.

  ### Prioritization

  This alert is classified as critical due to the potential impact on the security of the Active Directory environment, which could allow attackers to access sensitive systems and data. The likelihood of malicious use is high, as this behavior is commonly observed in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as attackers using legitimate accounts or service accounts, making it challenging to differentiate between benign and malicious actions. Reliable detection necessitates proper auditing settings in Active Directory to ensure Event ID 4662 is generated. Legitimate administrative changes or replication activities may also trigger this alert, necessitating further context review. Detecting changes in AD permissions or modifications to sensitive objects should be considered a companion detection that enhances overall security visibility.

