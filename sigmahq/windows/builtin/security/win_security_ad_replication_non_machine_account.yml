detection:
  selection:
    EventID: 4662
    AccessMask: '0x100'
    Properties|contains:
    - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
    - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter:
  - SubjectUserName|endswith: '$'
  - SubjectUserName|startswith: 'MSOL_'       # https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/reference-connect-accounts-permissions#ad-ds-connector-account
  condition: selection and not filter
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies suspicious Active Directory Replication Service (ADRS) activity originating from non-machine accounts. Typically, Active Directory replication is conducted by machine accounts (e.g., domain controllers) to synchronize directory information. The presence of replication requests from accounts that are not designated as machine accounts may indicate malicious actor activity, such as credential theft or manipulation, aiming to access sensitive information within the Active Directory.

  In this scenario, attackers may seek to exploit the replication mechanism to extract credentials or gain lateral movement privileges within the environment. This behavior aligns with the MITRE ATT&CK framework, specifically tactics such as Credential Access (TA0006) and the associated technique of Credentials from Password Stores (T1003.006). The primary log sources for detecting this activity are Windows Security Event Logs, particularly those logging Event ID 4662, which details object access for Active Directory.

  ### Investigation Steps
  - **Review Event Logs:** Investigate the Windows Security Event Logs for Event ID 4662 entries that indicate potential ADRS abuse. Pay special attention to the `AccessMask` value and any requested attributes that may suggest unauthorized access.

  - **Analyze User Accounts:** Examine the accounts initiating the replication requests. Identify any non-machine accounts, particularly those that do not follow the standard naming conventions for machine accounts (e.g., not ending with a `$`).

  - **Correlate with AD Changes:** Check for any recent modifications or changes in the Active Directory that could correlate with the suspicious replication attempts. Look for related events that may indicate a coordinated effort to compromise credentials.

  - **Investigate Network Traffic:** Look into network traffic logs for unusual patterns or connections related to the affected accounts during the time of the alert. This might reveal attempts to connect to sensitive services or servers.

  ### Prioritization
  The severity of this alert is classified as critical due to the potential for significant impact on the organization's security posture. Unauthorized access to Active Directory can lead to extensive credential theft and enable attackers to escalate privileges, making this behavior particularly concerning in an enterprise environment.

  ### Blind Spots and Assumptions
  One key gap in detection coverage could arise from relying solely on Event ID 4662, as not all suspicious ADRS activity may be captured if log retention policies limit historical data. The detection logic assumes that all non-machine accounts will follow predictable naming conventions. To ensure this alert functions correctly, it's essential to have comprehensive Windows Security logging enabled, including detailed settings for logging object access and replication events.

