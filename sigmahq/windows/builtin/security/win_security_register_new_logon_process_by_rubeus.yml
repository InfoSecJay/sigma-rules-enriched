  ---

  ### Technical Context

  This Sigma rule detects the registration of a new logon process with the name "User32LogonProcess," which is commonly associated with the Rubeus tool used for Kerberos ticket management and manipulation. Attackers may use Rubeus to escalate privileges, execute lateral movements, or access credentials through sophisticated methods such as Pass-the-Ticket (PTT) or Pass-the-Key (PTK) attacks.

  The relevant MITRE ATT&CK tactic is "Credential Access" (TA-0006) with technique "T1558.003: Credentials from Kerberos Ticket" as attackers aim to manipulate Kerberos tickets for unauthorized access. The primary telemetry source is Windows Security Event Logs, specifically looking for Event ID 4611. If malicious, this behavior could allow an adversary to perform lateral movements and escalate privileges, significantly compromising the environment's integrity and security posture.

  This detection does NOT confirm that an attack has occurred on its own; it merely indicates the potential misuse of tools designed for legitimate authentication processes that may include benign administrative activities.

  ---

  ### Investigation Steps

  - **Review Event 4611 details:** Examine Windows Security Event ID 4611 logs for the "User32LogonProcess" entry, focusing on fields like `AuthenticationPackage`, `SubjectUserName`, and `LogonProcessName` to obtain context about the logon operations.

  - **Correlate user actions:** Check for prior legitimate activity by validating the user’s recent logon history and task initiations within the last hour using Event IDs 4624 (Logon) and 4634 (Logoff) to ensure there is nothing abnormal related to authorized administrative tasks.

  - **Assess user privileges:** Identify whether the user associated with the new logon process has elevated permissions or if the actions executed were atypical for their role, utilizing Active Directory attributes to validate expected user behavior.

  - **Identify Rubeus usage indicators:** Look for other indicators of Rubeus activity in the environment such as unusual Kerberos ticket requests (Event ID 4769), which are often generated alongside new process registrations and can confirm malicious intent.

  - **Validate Kerberos ticket integrity:** Cross-reference Kerberos ticket granting logs with Event ID 4756 to ensure that no unauthorized changes were made, or tickets were issued that could indicate compromised credentials.

  ---

  ### Prioritization

  The severity of this alert is high due to the critical nature of privilege escalation in enterprise environments. The likelihood of malicious abuse is significant, as the techniques associated with Rubeus are commonly weaponized in real-world attacks. Detection of this behavior requires immediate investigation given the potential impact on user credentials and access controls.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging on the domain controllers is not sufficiently configured to include Event ID 4611. Evasion techniques may include legitimate administrative actions masking the malicious activity or alterations to logon process names. Other legitimate activities that could trigger this alert include the use of administrative tools that interface with authentication services. A related detection rule that strengthens monitoring is one that captures Kerberos ticket granting service requests (Event ID 4769).

