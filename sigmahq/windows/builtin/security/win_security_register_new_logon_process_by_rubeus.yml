note: |
  ### Technical Context
  This detection rule identifies the registration of a new logon process potentially associated with Rubeus, a tool commonly used for malicious credential manipulation and privilege escalation in Active Directory environments. This scenario is indicative of an attacker leveraging Rubeus to gain unauthorized access to resources by impersonating a legitimate logon process. Attackers using Rubeus may aim to obtain Kerberos tickets, manipulate service accounts, or escalate privileges, making the detection of this activity crucial for prompt incident response.

  Relevant MITRE ATT&CK tactics include **Lateral Movement (TA0008)**, as attackers are often attempting to move between systems to access sensitive resources. The associated technique **Credential Dumping (T1003)** is also relevant, particularly the sub-technique **T1558.003: Credentials from Password Stores**, as Rubeus can interact with and compromise stored passwords and Kerberos tickets. The primary telemetry for this alert comes from Windows Security Event Logs, particularly focusing on Event ID 4611, which records logon process registration.

  ### Investigation Steps
  - **Collect Security Event Logs**: Look for Event ID 4611 across all relevant systems, specifically examining logs around the time of the alert to gather context on the logon process registration.
  - **Review Logon Process Details**: Investigate the specifics of the registered logon process—particularly if the `LogonProcessName` indicates 'User32LogonProcesss', which may suggest the use of Rubeus.
  - **Inspect User Context**: Determine which user account registered the new logon process, verifying if it aligns with expected behavior or if it shows signs of compromise.
  - **Analyze Kerberos Ticket Activities**: Cross-reference the time of the alert with any Kerberos ticket-granting activities, checking for unusual ticket requests or alterations that coincide with the detected logon process registration.

  ### Prioritization
  This alert is classified as high severity due to the critical nature of credential manipulation activities; successful exploitation via tools like Rubeus can lead to significant security breaches and unauthorized access to sensitive systems, representing both a high-impact and likely threat if undetected.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if adversaries utilize alternative logon processes not captured by this rule or modify the registered names of processes to evade detection. The rule assumes that all relevant security logs are enabled and properly stored, particularly those capturing Event ID 4611. Also, if the environment employs custom or third-party logon processes, this detection may not activate, limiting its effectiveness against sophisticated threats.

