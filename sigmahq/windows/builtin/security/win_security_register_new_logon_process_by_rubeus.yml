  ### Technical Context

  This Sigma rule detects the registration of a new logon process specifically associated with the User32LogonProcess, which is often indicative of the Rubeus tool being employed in an environment. Rubeus is commonly used for credential theft and token manipulation, allowing attackers to impersonate valid users to gain unauthorized access or escalate privileges within Active Directory environments. The relevant MITRE ATT&CK tactics include "Lateral Movement" (T1075), "Privilege Escalation" (T1068), and "Credential Access" (T1558.003).

  The primary telemetry source is Windows Security logs, specifically Event ID 4611, which logs the registration of a logon process. If this behavior is identified as malicious, it may lead to unauthorized access and lateral movement within the network. However, this detection does not confirm malicious intent by itself; further investigation is required to establish the context, such as additional indicators of compromise or user behavior analytics.

  ---

  ### Investigation Steps

  - **Check Event ID 4611 Logs**: Review Windows Security logs for Event ID 4611 relating to User32LogonProcess. Note timestamp, user account, and originating IP address. Legitimate instances may include common user sessions during normal business hours.

  - **Correlate with User Activity**: Validate the user account associated with the logon process. Check for scheduled tasks or known administrative activities that could justify the logon process registration, highlighting benign behavior.

  - **Identify Unusual Logon Times**: Analyze if the logged activity occurred outside of normal business hours. Events happening during unusual times could indicate unauthorized attempts by an adversary.

  - **Cross-Check for Rubeus Activity**: Examine for associated activity indicative of Rubeus usage, such as Kerberos ticket requests or ticket-granting ticket (TGT) requests integrated with existing logs; specifically look for events related to Kerberos (Event IDs 4768, 4769).

  - **Investigate Logon Behavior**: Review any successful or failed login attempts in conjunction with Event ID 4625 or 4624 from the same timeframe, focusing on the source and destination machines for any links to known compromised assets.

  - **Assess Privilege Escalation Indicators**: Look for changes in user account privileges or group memberships following the logon process registration. These can indicate potential lateral movement facilitated by credential misuse.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential for significant impact on security, especially if the affected system holds sensitive or critical data. The likelihood of malicious use is elevated as Rubeus is frequently weaponized for attacks on Active Directory environments.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may involve the use of legitimate processes or variations in logon mechanisms that could bypass detection. Reliable detection requires consistent logging configurations, particularly for Windows Security logs capturing Event IDs 4611, 4624, and 4768. Legitimate user operations, such as scheduled logons or administrative access, may trigger this alert. Companion detections such as monitoring for unusual Kerberos ticket requests (Event ID 4768) can enhance threat visibility and response capability.

