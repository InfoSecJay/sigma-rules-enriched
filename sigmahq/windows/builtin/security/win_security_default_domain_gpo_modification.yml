note: |
  ### Technical Context

  This Sigma rule detects modifications to the Default Domain and Default Domain Controllers Group Policy Objects (GPOs) in a Windows environment. Attackers may alter these GPOs to implement malicious policies that affect multiple systems throughout the domain, potentially leading to increased privileges or lateral movement. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1484.001) and "Privilege Escalation."

  The primary telemetry source for this detection is Windows Security Event Log, specifically Event ID 5136, which indicates changes made to Active Directory objects. If malicious, these changes can impact the domain's security posture significantly. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; legitimate administrative modifications may trigger the alert.

  ### Investigation Steps

  - **Review Event ID 5136 details:** Check the specific details of Event ID 5136 in the Security log (Event Viewer > Windows Logs > Security). Look for alterations to `groupPolicyContainer` where ObjectDN starts with 'CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM' or 'CN={6AC1786C-016F-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM'.

  - **Identify the user making changes:** Identify the user or system account that initiated the modification. Check for unusual account names or service accounts in the `SubjectUserName` and `SubjectDomainName` fields, indicating potential abuse.

  - **Assess the changes made:** Examine the `AttributeName` field in Event ID 5136 for specific alterations. Changes to settings like password policies, user rights assignments, or other security configurations may signal localization of malicious activity.

  - **Look for related logs:** Correlate with Windows Security Event ID 4662 (Operation on an Active Directory object) to see if there are corresponding attempts to read or modify other critical Domain Controllers or GPOs that could indicate a reconnaissance stage prior to escalation.

  - **Establish normal GPO modification behaviors:** Determine the last legitimate changes made to default GPOs by reviewing recent change logs (if available) or consulting with IT personnel. Compare these against the detected modifications to establish context.

  - **Document suspicious modifications:** If you find malicious indicators such as changes made at unusual hours or by unauthorized accounts, document them thoroughly for escalation. Look for sequences of changes that indicate potential chaining of attack actions.

  ### Prioritization

  This alert is of medium severity due to the potential high impact on domain security configurations if exploited by an attacker. The likelihood of abuse is moderate, as modifications to GPOs are often targeted actions in attacks, particularly for privilege escalation or lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient auditing configurations; ensure 'Audit Directory Service Changes' is enabled and correctly configured across relevant domain controllers. Legitimate administrative activities—such as routine updates or changes during scheduled maintenance—may trigger this alert. Related detections include any unauthorized modifications tracked under Event ID 4662, which can complement this detection by revealing a broader context of activity against Active Directory.

