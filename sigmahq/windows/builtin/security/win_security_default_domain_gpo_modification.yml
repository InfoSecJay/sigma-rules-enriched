    - 'CN={6AC1786C-016F-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM'         # Default Domain Controllers Policy
  condition: selection
falsepositives:
- Legitimate modifications to Default Domain or Default Domain Controllers GPOs
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications made to the Default Domain and Default Domain Controllers Group Policy Objects (GPOs) within an Active Directory environment. Such changes can signify potential malicious activity where adversaries may attempt to alter these GPOs to enforce harmful configurations, enabling unauthorized access, privilege escalation, or other nefarious actions across the domain. The objective of an attacker modifying GPOs could range from deploying malware to manipulating security settings that benefit further exploitation.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** and **Privilege Escalation**. The specific techniques applicable to this detection include **T1484.001: Domain Policy Modification**. Attackers may utilize GPOs as a tool for lateral movement and establishing persistence within the network environment. The primary data sources for this alert revolve around Windows security logs, particularly focusing on events related to directory service changes and modifications to GPOs.

  ### Investigation Steps
  - **Review Security Logs:** Investigate Windows Security event logs for EventID 5136, which indicates modifications to directory service objects. Focus on entries pertaining specifically to the Default Domain and Default Domain Controllers policies.

  - **Examine GPO Change History:** Utilize the Group Policy Management Console (GPMC) to review the change history of the affected GPOs. Identify the user account responsible for the modification and determine if it aligns with usual administrative activity.

  - **Audit Directory Service Configuration:** Ensure that the 'Audit Directory Service Changes' policy is enabled and the System Access Control List (SACL) is correctly configured on the relevant containers in Active Directory. This configuration will provide additional context for any changes recorded.

  - **Investigate User Account Behavior:** Look for unusual behavior associated with accounts that have made GPO modifications, such as logging in from unfamiliar locations or executing commands typically reserved for system administrators.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of GPO modifications on overall network security and operational integrity, as these modifications can be used to escalate privileges or configure malicious settings.

  ### Blind Spots and Assumptions
  This detection rule assumes that the organization has properly configured auditing for directory services and maintained appropriate log retention policies. Gaps in detection coverage may occur if logging levels are insufficient or if legitimate administrative activities are mistaken for malicious actions, potentially leading to false positives. Additionally, organizations need to ensure that audit settings on GPO modifications are consistently applied across all domain controllers to capture relevant changes effectively.

