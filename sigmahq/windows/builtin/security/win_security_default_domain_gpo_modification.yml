note: |
  ### Technical Context

  This rule detects modifications to the Default Domain and Default Domain Controllers Group Policy Objects (GPOs) by monitoring for Event ID 5136 pertaining to objects classified as `groupPolicyContainer`. Attackers may alter these GPOs to deploy and enforce malicious configurations across the domain, potentially impacting local security controls or data protection policies. This behavior aligns with the MITRE ATT&CK technique **T1484.001: Domain Policy Modification** under the tactics of **Privilege Escalation** and **Defense Evasion**.

  The primary telemetry source includes Windows Security logs. The required log types are those capturing directory service changes, specifically ensuring that 'Audit Directory Service Changes' is enabled on the Default Domain Controllers Policy. If malicious, modifications to these GPOs could permit a variety of attacks, including credential theft or privilege escalation. Importantly, this detection does NOT confirm the malicious intent of the modification; it merely indicates that a change has occurred, which may also be legitimate.

  ### Investigation Steps

  - **Review Security Event Logs:** Check Windows Security Event ID 5136 for changes to `groupPolicyContainer`. Key fields include `ObjectClass` and `ObjectDN`. Changes to Default Domain and Domain Controllers policies must be further validated against legitimate administrative actions.

  - **Identify User Context of Changes:** Validate the subject user (`SubjectUserName` field) responsible for the modification. Legitimate changes typically involve administrative accounts performing known maintenance. Unrecognized accounts making changes are more suspicious.

  - **Assess GPO Change History:** Cross-reference the modification timestamps with known maintenance windows from IT or security operations. Unexpected changes outside of scheduled updates can indicate malicious activity.

  - **Inspect Related User Activity:** Look for unusual logins or administrative actions leading up to the change. Check for failed login attempts (Event ID 4625) or unusual successful logins (Event ID 4624) from the same user.

  - **Review SACL Configuration:** Ensure the SACL (System Access Control List) on `CN=Policies,CN=System` is correctly configured to monitor changes, capturing any unauthorized access or modifications.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on the domain's security posture. Modifications to GPOs can change security settings widely, presenting a high likelihood for malicious abuse if performed by unauthorized users. Such modifications are infrequent but can be significantly weaponized by attackers seeking persistence or privilege escalation.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as using valid credentials or automated scripts by authorized users to make modifications. Reliable detection requires properly configured audit policies and SACLs on GPOs to ensure changes are logged. Legitimate administrative activity, including routine updates or policy enforcement, can inadvertently trigger this alert. Companion detection rules, such as monitoring for unusual account privilege escalation (e.g., Event ID 4672), can enhance coverage and context for investigations.

