note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands executed via the Windows Command Prompt, specifically leveraging environment variables to launch potentially malicious scripts. Attackers may aim to maintain persistence, exfiltrate data, or execute payloads without being easily detected. This behavior fits within the MITRE ATT&CK framework under the tactics of Defense Evasion (TA0005) and Execution (TA0002), particularly the techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell). Primary telemetry sources include Windows Security Event logs, specifically Event ID 4697, which logs the creation of services that can indicate suspicious command execution. If this activity is confirmed to be malicious, it could lead to significant security incidents, such as unauthorized access to sensitive data or disruption of systems. However, it is essential to note that this detection does NOT confirm that the command executed was inherently malicious; context is critical.

  ### Investigation Steps

  - **Identify the service creation event: ** Review Windows Security Event ID 4697 logs for the creation of services linked with obfuscated PowerShell commands. Look for unusual ServiceFileNames that contain "cmd" along with "/C" or "/R".

  - **Search for obfuscated commands: ** Analyze fields within Event ID 4697 logs for obfuscated command patterns, particularly those utilizing `Invoke-Expression` or `DownloadString`. High-confidence malicious indicators may include usage of environment variables like `NOtI` or `SlDb`.

  - **Examine command behavior: ** For legitimate activity, verify if the command context relates to internal change management processes or known scheduled tasks. Look for established scripts or services that use PowerShell in a non-obfuscated manner.

  - **Cross-reference execution context: ** Assess the execution context in the logs to confirm whether the command was executed under a service account or user account with a role that typically runs legitimate scripts (e.g., sysadmin tasks), versus an account with unusual behavior patterns.

  - **Check for related artifacts: ** Investigate any associated artifacts or follow-up actions, such as file creations or network communications. For instance, validate the presence of scripts or files in known temporary or download paths after the command execution, which may indicate potential data exfiltration.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on sensitive systems and the likelihood of being exploited for malicious purposes. Obfuscation techniques are commonly used by attackers to bypass security measures, making this behavior a significant risk.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques, such as utilizing signed scripts or legitimate tools that may obfuscate their actions. Reliable detection requires that the 'System Security Extension' audit subcategory is enabled to capture Event ID 4697 logs. Legitimate administrative activities or maintenance tasks may trigger similar alerts, particularly if scripts are used for automation. A related detection to consider is monitoring for unauthorized use of PowerShell with unusual command parameters or access patterns to enhance threat detection capabilities.

