note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands that utilize environment variables to execute potentially malicious tasks. The likely attacker objective is to execute arbitrary code on the system without being easily detected, often as part of a larger attack mechanism such as bypassing security controls or evading detection. This behavior relates to the MITRE ATT&CK technique for Command and Scripting Interpreter - Windows PowerShell (T1059.001) and Execution through PowerShell Obfuscation (T1027).

  The primary telemetry sources include Windows Security Event ID 4697, which logs the creation of a new service, and may include relevant details about the executed command. If malicious, the impact could be significant; attackers could gain unauthorized access or compromise the system. Importantly, this detection does not confirm that a compromise has occurred, as it only indicates the execution of obfuscated commands which could also be benign under certain conditions.

  ### Investigation Steps

  - **Review Event ID 4697 details:** Check the event logs for Event ID 4697. Look for the ServiceFileName field containing 'cmd' with '/C' or '/R' and 'set' commands. Compare against known-good usages of similar commands on the host.

  - **Inspect command arguments:** Analyze the command syntax presented in the ServiceFileName. Malicious usage often shows complex PowerShell commands concatenated with environment variable manipulations, such as extensive use of "Invoke-Expression."

  - **Check for related processes:** Use Sysmon to determine if any processes spawned from cmd.exe with the obfuscated PowerShell command are linked to known malicious file paths or hashes (for example, reviewing Sysmon Event ID 1).

  - **Identify legitimate context:** Validate the expected usage of the cmd.exe command on the affected system by correlating logs from known administrative tasks. Legitimate commands will typically lack obfuscation and complex concatenation, appearing straightforward.

  - **Review for suspicious service creation:** Check for any associated Event ID 4697 logs that led to other suspicious services being created concurrently or soon after. This could indicate a more extensive compromise or persistence mechanism.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of the affected system, especially if it is a critical server or contains sensitive data. The likelihood of malicious abuse is high because obfuscation techniques are commonly used by threat actors to evade detection, and PowerShell is frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the 'System Security Extension' audit subcategory is not properly configured to log Event ID 4697. Legitimate activities that could trigger this alert include system admin tasks utilizing environment variables for automation. It's important to monitor for companion detections such as unusual outbound connections from the same host, which could further confirm malicious activity.

