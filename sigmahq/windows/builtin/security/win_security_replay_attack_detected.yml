  ### Technical Context

  This detection identifies potential Kerberos Replay Attacks by monitoring for "KRB_AP_ERR_REPEAT" messages returned to clients, which indicate that a replayed authentication request was sent to a domain controller. The objective of the attacker in this scenario is to exploit session tokens to gain unauthorized access or escalate privileges within the target environment. Relevant MITRE ATT&CK tactics include "Credential Access" (TA1203) and the technique "Valid Accounts" (T1558). The primary telemetry source is Windows Security logs, specifically focusing on Event ID 4649. If malicious, this could compromise account security by allowing an attacker to misuse authentication tokens. This detection does NOT confirm actual unauthorized access; it only indicates a potential replay attack.

  ---

  ### Investigation Steps

  - **Verify the alert source:** Check Windows Security Event Logs for Event ID 4649. Confirm that the event is recorded between system time and the alert trigger time, as this indicates a potential Kerberos replay scenario.

  - **Inspect client requests:** Review the client machine logs for any related authentication attempts just prior to the Event ID 4649 occurrence — particularly look for multiple login attempts using the same authentication credentials.

  - **Correlate with network logs:** Analyze network traffic logs for any abnormal patterns, such as repeated authentication attempts from the same source IP. Look for TCP traffic that shows a consistent pattern of requesting Kerberos tickets (ports 88/UDP).

  - **Identify expected behaviors:** Understand and document normal Kerberos authentication patterns in your environment, such as established session tokens and typical time intervals between requests for authentication.

  - **Search for high-confidence malicious indicators:** Review any anomalous Logon Type entries (e.g., Logon Types 3 and 4) associated with the user observed in the Event ID 4649. Unusual access times or methods may indicate malicious intent.

  - **Cross-check against recent changes:** Investigate any recent administrative changes or updates to Group Policies affecting Kerberos settings that could influence the authenticating processes.

  ---

  ### Prioritization

  Given that the alert pertains to Kerberos replay attempts on domain controllers, it signifies a high severity due to the critical nature of these systems. The likelihood of malicious abuse is significant, as replay attacks are common in exploitation scenarios to gain unauthorized access.

  ---

  ### Blind Spots and Assumptions

  The detection may miss replay attempts that occur without corresponding Event ID 4649 entries due to system misconfigurations or log retention issues. Reliable detection requires appropriate Windows event logging to be configured; otherwise, significant activities may go unrecorded. Legitimate activities that may trigger this alert include legitimate administrative scripts or monitoring tools that may inadvertently reuse credentials. A related detection to strengthen coverage includes monitoring for unusual user behavior patterns based on the authentication successes and failures, such as suspicious changes in user logon timings or locations.

