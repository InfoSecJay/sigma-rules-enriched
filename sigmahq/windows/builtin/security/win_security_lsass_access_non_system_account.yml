title: LSASS Access From Non System Account
id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
status: test
description: Detects potential mimikatz-like tools accessing LSASS from non 
  system account
references:
- https://threathunterplaybook.com/hunts/windows/170105-LSASSMemoryReadAccess/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-06-20
modified: 2026-10-20
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4663
    - 4656
    AccessMask:
            # - '0x100000'  # SYNCHRONIZE - cannot be used for credential dumping; high FP rate from AV/EDR agents synchronizing on LSASS
    - '0x1010'            # car.2019-04-004
    - '0x1400'
    - '0x1410'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x40'
    - '143a'            # car.2019-04-004
    - '1f0fff'
    - '1f1fff'
    - '1f2fff'
    - '1f3fff'
            # - '0x1000'  # minimum access requirements to query basic info from service
    ObjectType: 'Process'
    ObjectName|endswith: '\lsass.exe'
  filter_main_service_account:
    SubjectUserName|endswith: '$'
  filter_main_generic:
    ProcessName|contains:
            # Legitimate AV and EDR solutions
    - ':\Program Files\'
    - ':\Program Files (x86)\'
  filter_main_wmiprvse:
    ProcessName: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    AccessMask: '0x1410'
  filter_optional_steam:
    ProcessName|contains: '\SteamLibrary\steamapps\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the LSASS (Local Security Authority Subsystem Service) process from non-system accounts, indicating potential exploitation attempts using credential dumping tools like Mimikatz. The likely attacker objective is to extract sensitive credential information from the LSASS process to escalate privileges or conduct lateral movement within the network. This activity aligns with the MITRE ATT&CK framework, especially under the tactic of Credential Access (TA0006) and technique Credential Dumping (T1003.001).

  The primary telemetry source for this detection comprises Windows Security logs, specifically Event IDs 4656 and 4663, which capture object access events. If this behavior is malicious, the impact could be substantial, providing attackers with access to sensitive user credentials and compromising account security. However, it is essential to clarify that this detection alone does not confirm malicious activity; further investigation is required to determine the intent and context of the access attempt.

  ### Investigation Steps

  - **Review Event IDs 4656 and 4663:** Seek instances where the ObjectName ends with `\lsass.exe`. Focus on non-system accounts (username does not end with `$`) to identify suspicious access attempts.

  - **Analyze Access Masks for Suspicious Patterns:** In the detected events, check the AccessMask values for 0x1400, 0x1410, 0x1418, etc. These values indicate credential dump attempts. Verify against expected values that should come from legitimate applications or services.

  - **Identify Legitimate Activity:** Check for known legitimate services and scheduled tasks that may access LSASS legitimately. For instance, verify if antivirus or EDR solutions are accessing it (process names matching those in `:\Program Files\` paths).

  - **Investigate Process IDs and Parent Processes:** Cross-reference the Process IDs of the accessing processes with parent process trees (check for Event ID 4688) to identify whether a known application initiated the LSASS access or if it appears anomalous.

  - **Review for High-Confidence Malicious Indicators:** Investigate any access from binaries known for credential dumping (e.g., `mimikatz.exe`) or uncommon system processes that access LSASS that should not usually do so.

  - **Assess Asset Criticality and Context:** Focus on the asset where the alert was triggered. Systems with high user privilege or domain controller roles are critical targets and should be examined with high urgency.

  ### Prioritization

  This alert should be treated with medium severity. The ability to access LSASS can have significant impact, particularly on domain controllers or high-privilege user accounts. While these techniques are commonly leveraged by adversaries, contextual factors (such as the accessing account and process) will greatly influence the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection might be limited due to the use of legitimate processes or third-party applications that occasionally access LSASS under normal operational conditions. Proper logging configuration (including enabling audit log settings for object access) is critical for reliable detection. Legitimate administrative actions or some service updates may trigger this alert. A related detection rule for monitoring the use of known credential dumping tools can enhance overall coverage and provide additional context for investigations.

