title: LSASS Access From Non System Account
id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
status: test
description: Detects potential mimikatz-like tools accessing LSASS from non system
  account
references:
- https://threathunterplaybook.com/hunts/windows/170105-LSASSMemoryReadAccess/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-06-20
modified: 2023-12-11
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4663
    - 4656
    AccessMask:
    - '0x100000'
    - '0x1010'            # car.2019-04-004
    - '0x1400'
    - '0x1410'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x40'
    - '143a'            # car.2019-04-004
    - '1f0fff'
    - '1f1fff'
    - '1f2fff'
    - '1f3fff'
            # - '0x1000'  # minimum access requirements to query basic info from service
    ObjectType: 'Process'
    ObjectName|endswith: '\lsass.exe'
  filter_main_service_account:
    SubjectUserName|endswith: '$'
  filter_main_generic:
    ProcessName|contains:
            # Legitimate AV and EDR solutions
    - ':\Program Files\'
    - ':\Program Files (x86)\'
  filter_main_wmiprvse:
    ProcessName: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    AccessMask: '0x1410'
  filter_optional_steam:
    ProcessName|contains: '\SteamLibrary\steamapps\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized access attempts to the Local Security Authority Subsystem Service (LSASS) process from non-system accounts, which is often indicative of credential dumping activities associated with malicious tools like Mimikatz. The LSASS process stores sensitive information, including user credentials, and attackers commonly target this process to extract authentication tokens and passwords. By identifying these attempts, security teams can uncover potential attacks that aim to facilitate lateral movement within the network.

  The likely attacker objective is to gain unauthorized access to sensitive systems and data, ultimately leading to further exploitation or data exfiltration. This behavior aligns with several tactics in the MITRE ATT&CK framework, specifically under **Credential Access** (TA0006) and the technique **Credential Dumping: LSASS Memory** (T1003.001). Both tactics highlight the need for effective monitoring of processes that interact with LSASS, particularly when engaged by non-privileged processes.

  Primary data sources to collect include:
  - Windows Security logs, capturing Event IDs 4663 and 4656.
  - Process creation events, to record parent-child process relationships.
  - Potentially relevant network logs if lateral movement occurs after credential dumping.

  ### Investigation Steps
  - **Review Security Logs**: Analyze Windows Security event logs for Event IDs 4663 and 4656. Focus on instances where LSASS is accessed by processes not associated with system accounts (i.e., those not ending in '$').
  - **Correlate Process Activity**: Investigate the process creation timeline to determine if any suspicious parent processes spawned legitimate-looking child processes that accessed LSASS, indicating potential misuse.
  - **Examine Parent Process Relations**: Check the context of the access request to LSASS; identify the parent process and ensure it aligns with expected activities. Look for any anomalies that do not fit typical operational patterns.
  - **Conduct a Threat Hunt**: Utilize EDR tools to hunt for any known malicious hashes or behaviors tied to credential dumping attacks. Ensure that logging configurations for process execution are correctly set to capture all relevant events.

  ### Prioritization
  This alert should be treated as medium severity due to its potential to indicate a serious security breach involving credential theft. Given that credential dumping can provide attackers with elevated access, the likelihood of exploitation is high, especially if the compromised accounts belong to administrative users.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logs from certain endpoints are not captured or are misconfigured, specifically regarding process access to LSASS. The detection logic assumes that any access to LSASS from non-system accounts is suspicious, which may yield false positives in environments with custom applications or legitimate usage patterns. Proper configuration of Windows Security Event Log settings is necessary to ensure the effective functioning of this alert; specifically, logging Event IDs 4663 and 4656 across all relevant systems is crucial for comprehensive monitoring.

