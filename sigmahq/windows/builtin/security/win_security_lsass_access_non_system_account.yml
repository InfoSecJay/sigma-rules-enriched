title: LSASS Access From Non System Account
id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
status: test
description: Detects potential mimikatz-like tools accessing LSASS from non 
  system account
references:
- https://threathunterplaybook.com/hunts/windows/170105-LSASSMemoryReadAccess/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-06-20
modified: 2023-12-11
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4663
    - 4656
    AccessMask:
    - '0x100000'
    - '0x1010'            # car.2019-04-004
    - '0x1400'
    - '0x1410'            # car.2019-04-004
    - '0x1418'            # car.2019-04-004
    - '0x1438'            # car.2019-04-004
    - '0x143a'            # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x40'
    - '143a'            # car.2019-04-004
    - '1f0fff'
    - '1f1fff'
    - '1f2fff'
    - '1f3fff'
            # - '0x1000'  # minimum access requirements to query basic info from service
    ObjectType: 'Process'
    ObjectName|endswith: '\lsass.exe'
  filter_main_service_account:
    SubjectUserName|endswith: '$'
  filter_main_generic:
    ProcessName|contains:
            # Legitimate AV and EDR solutions
    - ':\Program Files\'
    - ':\Program Files (x86)\'
  filter_main_wmiprvse:
    ProcessName: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    AccessMask: '0x1410'
  filter_optional_steam:
    ProcessName|contains: '\SteamLibrary\steamapps\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized access to the Local Security Authority Subsystem Service (LSASS) process by non-system accounts, which is often indicative of attempts to extract credentials using tools like Mimikatz. The likely attacker objective is to harvest sensitive authentication data to facilitate lateral movement or privilege escalation. This behavior relates to the MITRE ATT&CK technique for Credential Dumping (T1003.001).

  The primary telemetry source is Windows Security Event logs, specifically Event IDs 4663 (Object Access) and 4656 (Handle Attempt), capturing detailed access attempts to LSASS. If this behavior is malicious, it can lead to significant security compromises, such as unauthorized access to resources or sensitive data extraction. It’s important to note that this detection alone does not confirm an attack; further investigation is required to determine intent and context.

  ### Investigation Steps

  - **Review Event ID 4663: Object Access Logs:** Check for Event ID 4663 logs corresponding to LSASS (ObjectName ends with `\lsass.exe`). Identify the SubjectUserName and look for non-system accounts (not ending with `$`), as this is a key indicator of suspicious behavior.

  - **Correlate with Event ID 4656:** Analyze Event ID 4656 for the same access instance. Focus on AccessMask values like '0x100000' and '0x1f0fff', which represent read access requests, a common signature of credential dumping activities.

  - **Identify known benign processes:** Cross-reference the ProcessName against known legitimate applications such as popular AV and EDR solutions (typically located in `C:\Program Files\` or `C:\Program Files (x86)\`). Legitimate access typically belongs to these processes, and their presence alongside access events should be documented.

  - **Check for legitimate account behavior:** Research scheduled or automated tasks linked to the identified accounts to confirm whether legitimate administrative actions or service operations are taking place, ensuring that benign account usage is validated against alerting events.

  - **Examine WMI activity:** Investigate any interaction with WmiPrvSE.exe (Event ID 4663 and AccessMask '0x1410') around the time of the alert. Unscheduled or unusual WMI queries may signal nefarious use of legitimate tools.

  - **Determine overall system criticality:** Assess the criticality of the affected host. Systems involved in sensitive operations (e.g., domain controllers or servers hosting sensitive applications) elevate the severity of findings related to this rule.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of compromised credentials and the likelihood of such access being weaponized by adversaries. In a mature SOC environment, non-system accounts accessing LSASS is often indicative of malicious activity requiring timely investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers utilize techniques such as process injection or service impersonation to bypass the monitoring of non-system accounts. Additionally, successful detection relies on adequately configured Windows auditing logs; missing log sources may lead to undetected malicious activities. Legitimate system management tasks, particularly by administrators, may inadvertently trigger the alert. Companion detections include monitoring for unusual network connections to LSASS from remote systems, enhancing overall coverage against credential dumping techniques.

