title: New or Renamed User Account with '$' Character
id: cfeed607-6aa4-4bbd-9627-b637deb723c8
status: test
description: |
  Detects the creation of a user with the "$" character. This can be used by attackers to hide a user or trick detection systems that lack the parsing mechanisms.
references:
- https://twitter.com/SBousseaden/status/1387743867663958021
author: Ilyas Ochkov, oscd.community
date: 2019-10-25
modified: 2024-01-16
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection_create:
    EventID: 4720     # create user
    SamAccountName|contains: '$'
  selection_rename:
    EventID: 4781     # rename user
    NewTargetUserName|contains: '$'
  filter_main_homegroup:
    EventID: 4720
    TargetUserName: 'HomeGroupUser$'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation or renaming of user accounts containing the '$' character. This tactic is often exploited by attackers to obfuscate malicious accounts or to integrate them into a trusted naming convention, potentially bypassing detection mechanisms. The relevant MITRE ATT&CK tactics include Defense Evasion (T1070) and the technique of Masquerading (T1036). The primary telemetry sources required for this detection are Windows Security Event logs, specifically Event IDs 4720 (for user creation) and 4781 (for user renaming). The security impact of detecting this behavior can indicate the presence of an unauthorized or suspicious user account, which might facilitate further malicious activities, such as lateral movement. It is important to note that this detection does NOT confirm malicious activity on its own; it merely draws attention to the unusual naming convention of the account.

  ### Investigation Steps

  - **Review Event ID 4720 for created users**: Check Windows Security log for Event ID 4720. Focus on the `SamAccountName` field. Benign examples typically include standard user naming conventions without special characters, while abnormal ($) naming patterns should be flagged for further analysis.

  - **Analyze Event ID 4781 for renamed users**: Investigate logs for Event ID 4781, which indicates user account renaming. Examine the `NewTargetUserName` field for any occurrences of accounts containing '$'. A legitimate name change would generally not include special characters.

  - **Cross-reference with existing accounts**: Validate whether the newly created or renamed accounts exist in active directory. Check for any associations with compromised or unrecognized machines, indicating potential malicious indicators.

  - **Inspect account activity post-creation**: Review recent logon events (Event ID 4624) associated with the user account to assess if there has been any unusual activity following its creation. Legitimate accounts usually display expected patterns of logon frequency and times.

  - **Check group memberships and privileges**: Look into the permissions and group memberships assigned to the suspicious accounts (Event ID 4728). Malicious accounts may be added to administrator groups or be granted privileges not typical for legitimate user accounts.

  ### Prioritization

  This alert has a medium severity level due to the potential for significant impact on the affected system if the account is maliciously controlled. The likelihood of abuse is moderate; while not all '$' character accounts are malicious, the presence of this naming scheme often indicates attempts to conceal malicious intent. The behavior is not commonly seen in legitimate account setups, raising its risk profile.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where legitimate software may create accounts with the '$' character. Ensuring comprehensive log source collection from Windows Security logs is vital for reliable detection. Legitimate activities that may trigger this alert could include automated account provisioning by management systems. As a companion detection, monitoring for unusual account creation patterns (e.g., multiple accounts created in a short timeframe) can enhance coverage and identify systemic abuse.

