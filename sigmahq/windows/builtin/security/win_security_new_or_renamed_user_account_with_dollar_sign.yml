title: New or Renamed User Account with '$' Character
id: cfeed607-6aa4-4bbd-9627-b637deb723c8
status: test
description: |
  Detects the creation of a user with the "$" character. This can be used by attackers to hide a user or trick detection systems that lack the parsing mechanisms.
references:
- https://twitter.com/SBousseaden/status/1387743867663958021
author: Ilyas Ochkov, oscd.community
date: 2019-10-25
modified: 2024-01-16
tags:
- attack.stealth
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection_create:
    EventID: 4720     # create user
    SamAccountName|contains: '$'
  selection_rename:
    EventID: 4781     # rename user
    NewTargetUserName|contains: '$'
  filter_main_homegroup:
    EventID: 4720
    TargetUserName: 'HomeGroupUser$'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation or renaming of user accounts that include the "$" character, which is an atypical pattern for legitimate user accounts in Windows environments. Attackers may employ this technique to create hidden or system-like accounts, enabling them to evade detection by security systems that do not adequately parse or alert on such naming conventions. The relevant MITRE ATT&CK technique for this behavior is T1036: Masquerading.

  The primary telemetry sources for this detection include Windows Security Event logs, specifically Event ID 4720 for user account creation and Event ID 4781 for renaming accounts. If an alert is triggered, it may indicate unauthorized user account activities, potentially leading to persistent access or privilege escalation within the network. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrative actions could also lead to similar events.

  ### Investigation Steps

  - **Review Account Creation Events**: Check Security Event ID 4720 details, focusing on `SamAccountName`, to see if the new account has an unusual "$" character. Benign examples would be accounts with identifiable roles, while suspicious accounts could have generic names or follow a pattern of known attack behaviors.

  - **Examine Account Rename Events**: Look at Security Event ID 4781 for account renaming, particularly inspecting `NewTargetUserName` for a "$" character. Legitimate renames will typically involve administrative users or service accounts, unlike potentially malicious ones that appear random or system-like.

  - **Correlate with Account Attributes**: Investigate the attributes associated with the new or renamed account using Active Directory tools. Malicious accounts might lack typical attributes of legitimate users (e.g., last logon, groups) and could have `userAccountControl` values suggesting unauthorized permissions.

  - **Identify Elevated Privileges**: Check if the newly created account has been assigned any groups such as Domain Admin or similar elevated privileges via Security Event ID 4728 (which records group membership changes). High-confidence malicious activity would show unauthorized escalation of privileges.

  - **Trace Account Activity**: Monitor subsequent logon attempts linked to the created/renamed account (Security Event ID 4624) to identify anomalous patterns or failed logins that suggest active exploitation attempts.

  - **Assess Impact on Critical Assets**: Determine if the user account is associated with sensitive systems or data. User accounts created for stealth typically target high-value resources, potentially indicating an active threat to critical infrastructure.

  ### Prioritization

  This alert is of medium severity due to the potential risk associated with stealth accounts that might enable unauthorized access or persistence by attackers. The likelihood of malicious activity is elevated as the "$" character is generally not present in legitimate account names, and this technique can be easily weaponized in data breaches and lateral movement scenarios.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques, such as attackers creating accounts but using names without "$" that may also appear legitimate. It requires that the appropriate logging configuration is enabled to capture Event IDs 4720 and 4781 effectively. Other benign activities that could trigger similar alerts include automated scripts or tools that create service accounts with this character. A complementary detection could involve monitoring failed authentication attempts related to these accounts, which enhances visibility into potential misuse.

