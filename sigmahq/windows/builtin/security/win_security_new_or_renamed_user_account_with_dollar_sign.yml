title: New or Renamed User Account with '$' Character
id: cfeed607-6aa4-4bbd-9627-b637deb723c8
status: test
description: |
  Detects the creation of a user with the "$" character. This can be used by attackers to hide a user or trick detection systems that lack the parsing mechanisms.
references:
- https://twitter.com/SBousseaden/status/1387743867663958021
author: Ilyas Ochkov, oscd.community
date: 2019-10-25
modified: 2024-01-16
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  product: windows
  service: security
detection:
  selection_create:
    EventID: 4720     # create user
    SamAccountName|contains: '$'
  selection_rename:
    EventID: 4781     # rename user
    NewTargetUserName|contains: '$'
  filter_main_homegroup:
    EventID: 4720
    TargetUserName: 'HomeGroupUser$'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation or renaming of user accounts that include a dollar sign (`$`) in their username, which is a technique often used by attackers to obfuscate malicious accounts within a Windows environment. The presence of a dollar sign is associated with service accounts or hidden administrative accounts that attackers may leverage to evade standard detection mechanisms. By manipulating usernames in this manner, malicious actors can create accounts that evade scrutiny, blending them in with legitimate accounts which could lead to unauthorized access or credential misuse.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique known as **Rename User Account** (T1036). These tactics emphasize the methods attackers employ to avoid detection while attempting to maintain access or blend in with network activity. Effective detection of these tactics hinges on the analysis of Windows security logs, particularly focusing on account management events.

  Primary data sources to monitor include Windows Security logs which record events related to user account management, specifically Event ID 4720 for user creation and Event ID 4781 for user renaming operations. Observing these logs can provide critical insights into potential anomalous account creation or modifications that may signal malicious activity.

  ### Investigation Steps
  - **Review User Creation Events**: Examine Windows Security event logs for Event ID 4720, focusing on any new user accounts that contain a dollar sign in the `SamAccountName` field.
  - **Analyze Renaming Events**: Look at Event ID 4781 logs to identify any renamed user accounts, particularly those changing to or from names that include the dollar sign character.
  - **Correlate with Other Logs**: Investigate associated logs such as authentication logs (e.g., failed logins) and any other suspicious username activity that may correlate with the newly created or renamed accounts.
  - **Assess Account Privileges**: Determine the privileges associated with accounts that contain a dollar sign. Identify if they are granted excessive permissions, especially if they are part of sensitive groups or roles within Active Directory.

  ### Prioritization
  The alert is categorized as medium severity due to the potential risk of unauthorized account creation or modification by attackers. The presence of such accounts can enable further malicious activity, increasing the likelihood of a security incident if not addressed promptly.

  ### Blind Spots and Assumptions
  The detection logic may have gaps in monitoring other types of account naming conventions that could also be used to evade detection. It assumes that logs for user creation and renaming events are enabled and accessible, which may not always be the case in all environments. Additionally, the rule does not account for legitimate administrative activities that may also use a similar naming pattern; thus, manual investigations may be necessary to differentiate between benign and malicious activity. Ensuring proper logging configurations is essential for accurate detection and response.

