logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be 
    enabled to log the EID 4697
detection:
  event_id:
    EventID: 4697
  selection1:
    ServiceFileName|contains|all:
    - 'ADMIN$'
    - '.exe'
  selection2:
    ServiceFileName|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  selection3:
    ServiceFileName|contains: 'powershell -nop -w hidden -encodedcommand'
  selection4:
    ServiceFileName|base64offset|contains: "IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:"
  condition: event_id and 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of malicious services commonly associated with Cobalt Strike, especially during privilege escalation or lateral movement phases in an attack. The likely attacker objective is to establish persistence on a compromised system by installing services that may invoke malicious payloads or scripts. Relevant MITRE ATT&CK tactics include Persistence (T1543.003) and Execution (T1569.002). The primary telemetry source is Windows Security logs, specifically focusing on Event ID 4697 for service creation events.

  If malicious, this behavior can lead to compromised systems being used to facilitate further attacks, data exfiltration, or lateral movement across the network. However, this detection alone does not confirm malicious intent; legitimate administrative tasks may also result in similar service creations.

  ### Investigation Steps

  - **Review Event ID 4697 Details**: Examine events with Event ID 4697 in Security logs. Look for service installations that contain "ADMIN$" or ".exe" in the ServiceFileName field, indicating possible malicious activity.

  - **Analyze Command-Line Arguments**: Check the ServiceFileName field for signs of encoded PowerShell commands or scripts (e.g., "powershell -nop -w hidden -encodedcommand"). Legitimate applications should not typically utilize encoded commands for service creation.

  - **Identify Anomalous Services**: Cross-reference newly created services against known benign services. New installations during off-hours or from unusual accounts may indicate malicious intent.

  - **Check for Local Management Tools**: Investigate if tools like PsExec or similar legitimate tools were used prior to the alert. Such usage may help differentiate between legitimate administrative activities and potential adversarial actions.

  - **Correlate with Elevated Privileges**: Identify any prior events indicating privilege escalation (e.g., Event ID 4672) linked to the alert. This can confirm if the service installation is associated with suspicious privilege elevation.

  ### Prioritization

  This alert is of high severity due to the critical role of potential service installations in maintaining persistence and executing malicious payloads. The likelihood of malicious abuse is significant, as such behaviors are common in Cobalt Strike operations, a well-known toolkit used by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; ensure that the 'System Security Extension' audit is enabled for capturing Event ID 4697. Legitimate administrative service installations may trigger this alert, particularly when using remote management tools. A related detection to consider is the monitoring of process creation (Event ID 4688 or Sysmon Event ID 1) to identify execution patterns tied to the newly created services.

