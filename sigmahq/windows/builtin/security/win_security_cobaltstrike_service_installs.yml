logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  event_id:
    EventID: 4697
  selection1:
    ServiceFileName|contains|all:
    - 'ADMIN$'
    - '.exe'
  selection2:
    ServiceFileName|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  selection3:
    ServiceFileName|contains: 'powershell -nop -w hidden -encodedcommand'
  selection4:
    ServiceFileName|base64offset|contains: "IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:"
  condition: event_id and 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the installation of malicious services likely associated with Cobalt Strike activity, specifically during scenarios of privilege escalation or lateral movement within a network. Cobalt Strike is a well-known adversary simulation tool often exploited by threat actors to facilitate unauthorized access and control over compromised environments. By monitoring service installations that bear distinct characteristics of Cobalt Strike, security teams can identify potentially harmful activities before they escalate into more severe incidents.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence** (T1543.003), which relates to the creation of services used for maintaining access; **Execution** (T1569.002), which pertains to the method employed to run the malicious code; and **Privilege Escalation** (T1021.002), which covers the attempt to gain higher-level permissions through service manipulation. These techniques are often leveraged by attackers seeking to implant beacons and maintain a foothold in targeted environments.

  Primary data sources to collect evidence supporting this detection include Windows Security Event Logs, particularly Event ID 4697, which logs the creation of service objects. Additional telemetry may be derived from process creation events, monitoring file system changes related to service files, and general network traffic logs.

  ### Investigation Steps
  - **Review Security Event Logs**: Examine Windows Event ID 4697 for newly created services that match the selection criteria outlined in the detection rule, noting any associated user accounts and timestamps.
  - **Analyze Service Configurations**: Inspect the configurations of identified services for unusual parameters or commands—especially those invoking PowerShell or downloading content from localhost, which may indicate compromise by Cobalt Strike.
  - **Correlate with Process Creation Logs**: Look into process creation events around the same timeframe to identify any suspicious PowerShell or command-line usage that might relate to service installation activities.
  - **Check Network Communication**: Investigate outbound network connections initiated by the identified services, particularly for unusual destinations or suspicious payloads indicative of beaconing behavior common to Cobalt Strike.

  ### Prioritization
  This alert warrants a high priority due to its association with critical persistence mechanisms often used by attackers to maintain access and control over compromised systems. The likelihood of successful exploitation following service installation further elevates its impact in an enterprise environment.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may arise from services installed with legitimate user credentials, which could result in false negatives if not logged or monitored properly. The detection logic assumes that all relevant logs are enabled and that Event ID 4697 is available for all systems, which may not be the case in every environment. Additionally, any misconfigurations in security settings that prevent the logging of service creations will hinder the detection capabilities of this rule.

