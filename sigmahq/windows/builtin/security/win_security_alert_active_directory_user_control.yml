note: |
  ### Technical Context

  This rule detects when the SeEnableDelegationPrivilege right is assigned to a user within Active Directory (AD). This behavior is concerning as it allows the assigned user to potentially control other AD user objects, posing a significant security risk. The likely objective of an attacker leveraging this privilege is to escalate their access within the environment, enabling them to manipulate user accounts and potentially perform lateral movement. This behavior is categorized under the MITRE ATT&CK tactic for Privilege Escalation (TA0004) and the technique ID T1098 (Account Manipulation).

  The primary telemetry source for this detection is Windows Security Event logs, specifically Event ID 4704, which logs changes in user rights and permissions. If this detection indicates malicious intent, it could lead to significant harm, such as unauthorized access to sensitive information or manipulation of user accounts. It should be noted that the detection of this privilege assignment does NOT confirm that malicious activity has occurred; it only indicates a potential for abuse.

  ### Investigation Steps

  - **Check for Event ID 4704**: Review Windows Security Event logs for Event ID 4704. Look for entries where the 'PrivilegeList' contains 'SeEnableDelegationPrivilege' and note who has been assigned this privilege.

  - **Identify recent changes**: Cross-reference the Event IDs related to the privilege assignment with the associated timestamps to identify any recent, unexpected changes in user roles, particularly focusing on administrative accounts.

  - **Evaluate legitimate usage**: Determine if the user who received this privilege has a legitimate business need for the SeEnableDelegationPrivilege. This could include confirming their role in the organization or if they manage delegated user services.

  - **Correlate with user behavior**: Validate user activity logs (Event ID 4624 for logons) and check for signs of anomalous behavior following the privilege assignment, such as accessing resources or performing actions that align with malicious intent.

  - **Assess user roles**: Analyze the affected account’s role within the AD structure. Accounts with high privileges (like Domain Admins or similar roles) should be scrutinized for any inappropriate privilege escalation.

  - **Monitor for lateral movement**: If the privileged assignment appears suspicious, look for lateral movement indicators, such as unauthorized access to critical servers or unusual authentication patterns among logs collected from endpoints.

  ### Prioritization

  Given the criticality of Active Directory in enterprise environments, alerts of this nature are of high severity. The impact can be profound, as unauthorized privilege assignment could lead to significant unauthorized access and data compromise. The likelihood of adversaries weaponizing this technique is elevated due to its potential for facilitating extensive control over user objects and accounts.

  ### Blind Spots and Assumptions

  Detection may be limited if audit policies are not appropriately configured to log authorization policy changes, which is crucial for capturing the relevant events. Legitimate administrative maintenance activities may sometimes trigger this alert if not conducted carefully. For additional coverage, monitoring for changes to other sensitive privileges (e.g., SeDenyNetworkLogonPrivilege) can serve as a companion detection to enhance overall security posture.

