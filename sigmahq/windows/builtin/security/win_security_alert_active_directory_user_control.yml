note: |
  ### Technical Context
  This detection rule monitors for the assignment of the **SeEnableDelegationPrivilege** user right within Active Directory (AD). Detection of this privilege assignment is critical, as it allows a user to control other user objects within AD. This capability is often sought by malicious actors who may aim to escalate their privileges and assume greater control over the domain environment. If an attacker successfully exploits this privilege, they could manipulate user accounts, potentially leading to further unauthorized access or lateral movement within the network.

  The likely threat scenario involves an insider threat or external attacker with initial access leveraging this privilege to create persistence or maneuver laterally through the organization’s network. The attacker might aim to maintain access, gather sensitive information, or perform destructive actions. This rule is mapped to the MITRE ATT&CK tactics of **Privilege Escalation** and **Persistence**, specifically the technique **T1098: Account Manipulation**, which encompasses manipulations of user accounts and their settings.

  The primary data source for this detection is **Windows Security Event Logs**, specifically looking for **Event ID 4704**, which captures privilege assignments along with the identity of the user making the changes. Additionally, configuring appropriate audit policies to ensure that these events are captured is critical for effective detection.

  ### Investigation Steps
  - **Review Security Event Logs**: Analyze Windows Security Event Logs for Event ID 4704 to identify instances where the SeEnableDelegationPrivilege has been granted. Look for associated user accounts and any patterns indicating unauthorized changes.

  - **Correlate with User Activity**: Check for unusual or suspicious activity from the user accounts that have been granted this privilege. This can include unexpected logon patterns, access to sensitive data, or changes made to other accounts.

  - **Audit Group Policies**: Review group policies related to user rights assignments and permissions. Verify that the assignment aligns with organizational policies and that no unauthorized groups or users have been assigned this right.

  - **Conduct Post-Incident Analysis**: If unauthorized privilege escalation is confirmed, analyze the scope of the incident by tracing the timeline of events leading to the change. This involves reviewing recent account modifications, logins, and other related security events to determine potential impacts.

  ### Prioritization
  The alert's severity is high due to the critical nature of the privileges involved, which, if misused, could lead to significant security breaches within the enterprise. The likelihood of an attacker exploiting the ability to control user objects amplifies the need for immediate investigation and response.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the auditing of privilege changes is not enabled or if the logs are not being properly retained or monitored. The current detection logic assumes that the correct auditing policies are configured to capture relevant events; without these logs, the alert may not function as intended. It is essential to ensure that the necessary audit policies for tracking authorization changes are in place and operational.

