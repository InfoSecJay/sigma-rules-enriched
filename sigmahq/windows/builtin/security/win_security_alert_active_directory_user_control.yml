  ---

  ### Technical Context

  This Sigma rule detects the assignment of the `SeEnableDelegationPrivilege` right to a user within Active Directory (AD), which can grant the ability to control other AD user objects. An attacker may aim to exploit this privilege for lateral movement, enabling them to impersonate other accounts or escalate further into the environment. This behavior falls under the MITRE ATT&CK tactic of **Privilege Escalation** and technique **T1098: Account Manipulation**.

  The primary telemetry source is Windows Security logs, specifically tracking Event ID 4704 related to privilege assignments. If malicious, an attacker could change permissions leading to unauthorized access and control over critical user accounts. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review Event ID 4704 details**: Examine the logs corresponding to Event ID 4704 for user privilege assignments. Focus on the `PrivilegeList` field and check if it contains `SeEnableDelegationPrivilege` to identify specific users impacted.

  - **Cross-reference user roles**: Identify the assigned user of the `SeEnableDelegationPrivilege` by checking their usual roles and responsibilities. Legitimate users typically do not need this privilege; look for non-admin accounts that have been assigned this right.

  - **Check for recent changes in permissions**: Assess the timeline of changes in permissions through the Security logs. If changes to `SeEnableDelegationPrivilege` occurred outside of standard business hours or do not align with typical administrative maintenance windows, flag this behavior.

  - **Investigate Group Policy settings**: Validate the Group Policy configurations to ensure that expected audit settings are correctly applied. Look for entries under `Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration`.

  - **Identify high-confidence malicious indicators**: Correlate the privilege assignment with contextual data such as abnormal access patterns or out-of-scope administrative activities occurring in conjunction with the event, which might suggest unauthorized escalation.

  ---

  ### Prioritization

  This alert has a high severity due to its potential impact on the ability of an unauthorized user to seize control over critical accounts and systems. The likelihood of abuse is significant, as similar privilege escalations are frequently employed by adversaries in both targeted attacks and widespread malicious activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging for policy changes isn’t adequately configured. Attackers may attempt to delegate privileges while masking their true intent, complicating detection. Legitimate administrative delegation of this privilege can occur in environments requiring such configurations. A related detection for monitoring suspicious changes in group memberships could strengthen coverage, such as alerts for modifications in the AD groups that include administrative users.

