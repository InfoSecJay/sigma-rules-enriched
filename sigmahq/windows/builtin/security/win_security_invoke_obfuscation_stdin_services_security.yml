note: |
  ---

  ### Technical Context

  This rule detects the use of obfuscated PowerShell commands via standard input (STDIN), often indicative of attempts to execute malicious actions while evading detection mechanisms. The likely attacker objective is to execute scripts or commands covertly, leveraging PowerShell's capabilities to manipulate or exploit the system without leaving straightforward traces. This behavior corresponds to the MITRE ATT&CK tactic `Defense Evasion` (T1560) and technique `Obfuscated Files or Information` (T1027) as well as the technique for `Command and Scripting Interpreter: PowerShell` (T1059.001).

  The primary telemetry source for this detection is Windows Security logs capturing Event ID 4697, which logs service creation. If this activity is malicious, it may lead to unauthorized access or manipulation of systems. However, this detection does NOT confirm that the activity is malicious or that any compromise has successfully occurred.

  ---

  ### Investigation Steps

  - **Review Security Event ID 4697:** Analyze Event ID 4697 logs for the execution of PowerShell commands. Look for suspicious `ServiceFileName` containing terms like `cmd` or `powershell`, particularly with `/c` or `/r`, which indicate command execution.

  - **Identify obfuscated command characteristics:** Check if the `ServiceFileName` includes `${input}` or `noexit`, which often indicate an intent to execute commands provided dynamically and are typical for obfuscation techniques.

  - **Assess legitimate PowerShell usage:** Determine whether the observed PowerShell execution correlates with known benign processes, such as scripts executed by automated task schedulers or verified administrative tasks that utilize standard input without obfuscation.

  - **Correlate with known malicious indicators:** Look for high-confidence indicators such as concurrent suspicious network connections or file creations (e.g., an unusual `.ps1` file) that align with the timing of the alerts. For example, check for newly created files in common execution directories such as `C:\Windows\Temp`.

  - **Verify asset criticality and context:** Consider if the originating system is a critical server or workstation. Services running on domain controllers or other key assets amplify the potential risk of malicious activity.

  - **Document user behavior patterns:** Establish if the user account associated with the alert has a history of executing PowerShell commands or if this is an anomaly, indicating potential compromise or misuse.

  ---

  ### Prioritization

  This alert is of high severity due to the significant potential impact of undetected malicious PowerShell executions, especially on high-value assets. The likelihood of abuse is considerable as such behaviors are commonly weaponized by sophisticated attackers employing evasion techniques to bypass security controls.

  ---

  ### Blind Spots and Assumptions

  Detection may miss obfuscated commands that do not interact with standard telemetry sources or utilize alternative scripting languages. Continuous logging configurations must be ensured for reliable detection of Event ID 4697. Legitimate application deployments using PowerShell for administrative purposes could inadvertently trigger the alert. A related detection to watch for includes abnormal process creation linked to PowerShell (e.g., Event ID 4688 for unusual process execution patterns), which strengthens coverage and context around these alerts.

