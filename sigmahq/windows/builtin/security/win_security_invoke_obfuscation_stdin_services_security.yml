detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'cmd'
    - 'powershell'
  selection2:
    ServiceFileName|contains:
    - '${input}'
    - 'noexit'
  selection3:
    ServiceFileName|contains:
    - ' /c '
    - ' /r '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the obfuscated invocation of PowerShell through standard input (stdin), often indicating an attempt to execute scripts or commands covertly on Windows systems. The likely attacker objective is to execute malicious code without detection, leveraging obfuscation techniques to evade security measures. The relevant MITRE ATT&CK tactics and techniques are Execution (T1203) and Obfuscated Files or Information (T1027).

  The primary telemetry sources are Windows Security logs. Specifically, this rule looks for Event ID 4697, which logs the creation of a service with potentially malicious intent. The security impact could include unauthorized remote code execution and further compromise of the affected system. Importantly, this detection alone does not confirm malicious activity; it indicates a suspicious event that requires further investigation.

  ### Investigation Steps

  - **Check Event ID 4697 details**: Review the specific event associated with the alert. Look for unusual ServiceFileName field values, particularly those containing ‘cmd’, ‘powershell’, or `${input}`. Malicious indicators include obfuscated commands or parameters that deviate from standard usage.

  - **Review recent PowerShell command history**: Use Windows Event Log (Event ID 4104) to obtain a snapshot of the PowerShell command history on the affected host. Legitimate usage typically does not involve complex obfuscation or unexpected arguments like ‘/c’ or ‘/r’.

  - **Analyze the context of service creation**: Identify the service that triggered Event ID 4697. Determine if the service is part of a legitimate application installation, focusing on its startup type and execution paths. Benign services are generally well-documented and associated with known applications.

  - **Investigate related process activity**: Correlate the ServiceFileName with process monitoring logs, specifically Sysmon Event ID 1, which tracks process creation. High-confidence malicious indicators may include unknown processes created by obfuscated PowerShell scripts.

  - **Collect indicators from host filesystem**: Validate the existence of associated files and scripts, particularly in common execution paths, using file system logs. Look for recent changes to scripts that coincided with the time of the Event ID 4697 alert.

  ### Prioritization

  This alert should be prioritized as high due to the potential for significant impact on the affected system. The obfuscation techniques often indicate a targeted attack, making it a common behavior among sophisticated adversaries seeking to maintain stealth. Proactive action is critical to mitigate any exploit before damage occurs.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions using PowerShell, which can inadvertently trigger this alert. Ensure that the relevant log sources, particularly for process creation and service manipulation, are consistently configured. Additionally, consider companion detections such as anomalous user shell execution (e.g., general PowerShell execution logs, Event ID 4104) to create a more comprehensive picture of the event and bolster analysis.

