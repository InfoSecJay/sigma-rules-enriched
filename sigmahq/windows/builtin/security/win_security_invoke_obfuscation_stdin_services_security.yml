detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'cmd'
    - 'powershell'
  selection2:
    ServiceFileName|contains:
    - '${input}'
    - 'noexit'
  selection3:
    ServiceFileName|contains:
    - ' /c '
    - ' /r '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the obfuscated use of PowerShell via standard input (stdin) to execute commands, which is a common technique employed by attackers to evade detection. The likely objective of the attacker is to execute malicious payloads while minimizing visibility into their actions, potentially leading to broader system compromise. The relevant MITRE ATT&CK tactics are Execution (TA0002) and Defense Evasion (TA0005), specifically techniques T1059.001 (Command and Scripting Interpreter: PowerShell) and T1027 (Obfuscated Files or Information).

  The primary telemetry source for this detection is Windows Security logs, particularly focused on Event ID 4697, which reports the creation of a service with obfuscated command-line entries. If malicious, this behavior can lead to unauthorized actions within the system, including data exfiltration, lateral movement, or installation of persistent malware. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also use similar obfuscation techniques.

  ### Investigation Steps

  - **Check Event ID 4697 for suspicious service creation:** Review the Security log for Event ID 4697 entries that match the detection criteria. Look for service names containing 'cmd' or 'powershell' along with parameters like '/c' or '/r'.

  - **Analyze command-line arguments:** Investigate the `ServiceFileName` field for obfuscation patterns, such as the presence of '${input}' or 'noexit'. Malicious indicators include unusual or unexpected command invocations.

  - **Validate against expected log activity:** Compare the findings against documented administrative procedures. Legitimate power users might use similar commands but should clearly align with organizational changes or maintenance tasks.

  - **Correlate with additional telemetry:** Check for related process creation events (such as Event ID 4688) on the machine to confirm the context of the service creation. Look for spawned PowerShell processes that leverage obfuscation techniques or unusual execution chains.

  - **Monitor for other indicators of compromise:** If malicious behavior is suspected, examine the system for lateral movement indicators, such as unusual network connections or access to sensitive resources.

  ### Prioritization

  This alert indicates high severity as it involves potentially harmful execution techniques on a sensitive system. The likelihood of malicious abuse is considerable given that obfuscated commands are commonly used by threat actors to bypass security measures. Since similar tactics are frequently weaponized in attacks, this alert should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Potential limitations of this detection include the fact that attackers might use tools or techniques that do not rely on Event ID 4697, hence bypassing detection if specific logging is not configured properly. There may also be legitimate cases where administrative scripts utilize similar obfuscation. It is advisable to complement this detection with monitoring for other execution-related alerts, such as process creation logs (e.g., Event ID 4688), to enhance detection fidelity.

