detection:
  selection:
    EventID: 4697
    ServiceFileName|contains|all:
    - 'cmd'
    - 'powershell'
  selection2:
    ServiceFileName|contains:
    - '${input}'
    - 'noexit'
  selection3:
    ServiceFileName|contains:
    - ' /c '
    - ' /r '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the obfuscated execution of PowerShell commands through standard input (STDIN) as part of potential post-exploitation activities. Attackers may leverage this technique to execute malicious scripts or commands while evading detection by traditional security measures that monitor for straightforward PowerShell usage. The primary objective of this activity is to maintain persistence, automate tasks, or manipulate the compromised system without raising alarms.

  The rule aligns with multiple MITRE ATT&CK tactics and techniques. Specifically, it relates to "Defense Evasion" (TA0005), utilizing obfuscation (T1027) to conceal the true intent of the executed commands. Moreover, it also reflects the execution of commands through PowerShell (T1059.001), where attackers reintroduce execution mechanisms commonly associated with legitimate administrative tasks.

  To gather relevant evidence, the primary data sources will include Windows Security logs, particularly those capturing the `EventID 4697`. These logs will provide a clear view of service creation and associated file names, which are critical in identifying obfuscated behaviors indicative of a malicious actor operating within the environment.

  ### Investigation Steps
  - **Review Security Logs:** Analyze Windows Security logs for EventID 4697 to identify service creation events that may indicate obfuscated PowerShell execution attempts.
  - **Examine Parent Processes:** Investigate the parent processes of suspicious service creations to understand the context and origin of the PowerShell invocation. Look for abnormal parent-child relationships that could indicate malicious intent.
  - **Evaluate File Hashes:** Check the hashes of identified service files against known malicious file signatures. This can help to determine if the invoked commands or scripts are malicious or potentially benign.
  - **Correlate with User Activity:** Cross-reference the detection findings with user activity logs to identify any anomalies or unusual access patterns, which may indicate an exploited account or a compromised user.

  ### Prioritization
  Given the high severity level assigned to this alert, it merits prompt attention in the enterprise environment. The potential for widespread impact from obfuscated command execution emphasizes the importance of quick mitigation to prevent further compromise or lateral movement within the network.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on specific Windows Security logs, which may not be enabled or may vary across different environments. The detection logic assumes that EventID 4697 will capture all relevant instances of obfuscated command execution, but it may miss cases where malicious actors utilize other execution methods not represented in this event. To ensure the alert functions effectively, proper logging configuration and monitoring must be in place for the 'System Security Extension' audit subcategory related to service creation events.

