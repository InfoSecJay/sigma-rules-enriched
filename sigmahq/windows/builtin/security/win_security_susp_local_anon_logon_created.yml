note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious accounts that resemble 'ANONYMOUS LOGON', particularly those that include variations with added spaces or characters. The likely attacker objective is to create accounts that blend in with legitimate anonymous access patterns to facilitate unauthorized persistence and lateral movement in the environment. This behavior corresponds to the MITRE ATT&CK technique for Account Creation (T1136.001) and Create Account (T1136.002).

  The primary telemetry source is Windows Security logs, specifically Security Event ID 4720, indicating the creation of a user account. If malicious, this could enable an attacker to perform unauthorized actions under an account designed to evade detection. However, this detection does NOT confirm malicious intent on its own; further context is required to assess the legitimacy of the account creation action.

  ### Investigation Steps

  - **Review account creation details:** Investigate Security Event ID 4720 for the account creation event. Check the `SamAccountName` field for variations of 'ANONYMOUS LOGON' (e.g., 'ANONYMOUS LOGON ', ' ANONYMOUSLOGON'). Determine whether this account creation corresponds to known administrative actions.

  - **Check the source of account creation:** Examine the `Subject` fields of Event ID 4720 to identify the initiating user. A legitimate admin account creating this user is less suspicious than an unknown or service account.

  - **Analyze login attempts:** Look at subsequent logon events (Event ID 4624) using the created account. Log Type 3 connections from this account can indicate attempts at network access. Note unusual patterns or high-frequency login attempts.

  - **Assess user role and criticality:** If the created account is intended for a non-privileged role but shows up in the `Administrators` or `Remote Desktop Users` groups, classify it as a high-risk indicator.

  - **Identify potential lateral movement:** Examine other Windows Event Logs (especially Security Event IDs 4768/4769 for Kerberos Ticket Granting Ticket requests) that correlate with the timeframe of account creation. Look for unusual cross-domain authentication requests that might point to lateral movement.

  ### Prioritization

  This alert has high severity due to the potential for a newly created account to enable an attacker to establish persistence within critical systems. The likelihood of malicious abuse is significant, given that creation of accounts resembling anonymous logon patterns is a known tactic in various cyber threats. This behavior is often weaponized during the initial phases of an attack, marking it essential for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the event log configurations do not capture all account creation events due to logging policy settings. Legitimate administrative activities, such as scheduled account maintenance, might trigger this alert. A complementary detection rule for unexpected modifications in local user groups can strengthen coverage against account misuse or privilege escalation attempts.

