  ### Technical Context

  This Sigma rule detects user logoff events through Windows Event IDs 4634 (An account was logged off) and 4647 (User initiated logoff). The likely objective of monitoring this behavior is to gather data for forensic investigations or user session activity analysis, which can help identify unauthorized cessation of sessions in cases of suspicious activity. This behavior may align with the MITRE ATT&CK tactic of "Impact" (TA0040), specifically technique "Account Access Token Manipulation" (T1531).

  The primary telemetry sources are Windows Security Event logs, specifically targeting Event IDs 4634 and 4647. If malicious, the security impact could indicate an unauthorized logoff to cover tracks or facilitate lateral movement. However, this detection does not confirm malicious intent on its own, as logoff events can be routine and expected.

  ### Investigation Steps

  - **Review logoff timestamps**: Check Event IDs 4634 and 4647 in Security logs (Log File: Security.evtx) to identify who logged off and when, focusing on unusual hours or user accounts with no prior activity.

  - **Correlate with logon events**: Look for paired Event ID 4624 (An account was logged on) within a short time window before logoff events to determine if the user was active before logging off, indicating normal behavior.

  - **Investigate account access history**: Query for any recent login attempts from the same user account using Event ID 4624 and compare to logoff events; multiple logoffs within short periods could indicate suspicious activity.

  - **Analyze remote connections**: If the logoff event involves a remote session, verify connections using Event ID 4624 (with Source Network Address field) to ensure that they match authorized remote access tools and sessions.

  - **Cross-check for administrative logoffs**: Focus on Event IDs that show administrative privileges (e.g., administrative accounts logging off) for out-of-band activity, especially if they're logged off when their activity is typically expected.

  - **Identify legitimate scheduled tasks**: Examine any scheduled tasks or automated scripts that might trigger logoff events. Expected behavior includes system maintenance logoff operations which should be logged in Event Viewer under Task Scheduler.

  ### Prioritization

  Logoff events are categorized as informational, but their relevance in investigation can escalate based on context. Affected systems could include critical infrastructure if leveraged for unauthorized access. The likelihood of malicious logoff tactics varies, though they can be part of escape techniques in active breaches, making monitoring essential.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not adequately configured to capture all relevant logoff events. Attackers can evade detection by terminating sessions rapidly or spoofing user identities. Legitimate activities, like system maintenance, may trigger these events. A companion detection could include monitoring for failed logon attempts using Event ID 4625 to provide a fuller picture of potential account compromise leading to logoff events.

