note: |
  ### Technical Context
  This detection rule focuses on identifying attempts to modify the Directory Services Restore Mode (DSRM) administrator password on Domain Controllers. The DSRM account is a critical local administrator account that allows access to the directory service in a low-privilege mode for recovery and maintenance tasks. Attackers might target this account to change the password for various malicious objectives, such as establishing persistence within the environment, potentially allowing them unauthorized access or recovery capabilities over the domain.

  The relevant MITRE ATT&CK tactics are **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically leveraging the technique **T1098 - Account Manipulation**. Monitoring for events related to password changes on such essential accounts is crucial as these actions could signify malicious activity before, during, or after a broader intrusion campaign. The primary data source for this detection is the Windows Security event logs, specifically focusing on Event ID 4794, which pertains to changes made to the DSRM account password.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Security event log for Event ID 4794. Identify the user account performing the action, the timestamp, and the source of the change for any indicators of unauthorized behavior.
  - **Analyze Access Patterns:** Investigate access logs around the time of the password change. Look for any unusual account activity, including atypical logon locations or times for the administrator account.
  - **Validate Administrative Changes:** Confirm whether the password change was part of a legitimate administrative process, such as routine maintenance or system configurations, or if it appears anomalous when compared against typical operational workflows.
  - **Check for Related Events:** Look for other security events associated with the same user or system that might indicate a broader attack, such as privilege escalation attempts, lateral movement, or access to sensitive resources.

  ### Prioritization
  This alert is classified as high severity because unauthorized changes to critical accounts like the DSRM administrator can facilitate ongoing attacks, leading to significant operational and security risks within an enterprise environment.

  ### Blind Spots and Assumptions
  There may be detection gaps if logging is not maintained at a sufficient level for all Domain Controllers or if Event ID 4794 is not captured due to misconfiguration. This detection logic assumes that any administrative user possessing the required permissions behaves according to expected patterns; deviations from these patterns may not fully be captured without contextual context surrounding system changes. Ensuring proper logging configurations and continuous monitoring of administrative actions are essential for the effectiveness of this alert.

