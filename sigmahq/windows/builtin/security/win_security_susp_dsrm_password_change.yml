  ---

  ### Technical Context

  This Sigma rule detects unauthorized attempts to change the password of the Directory Services Restore Mode (DSRM) account on Windows Domain Controllers. Attackers may seek to manipulate this account to establish persistence within a compromised domain environment, which can lead to further privilege escalation and lateral movement. The relevant MITRE ATT&CK techniques include Persistence (T1098) and Privilege Escalation.

  Primary telemetry sources are Windows Security event logs, specifically Event ID 4794, which logs changes to the DSRM account password. If malicious, this behavior can compromise the integrity of domain control, allowing attackers to regain access and execute further malicious actions. Importantly, this detection does NOT confirm that a compromise has occurred; it only indicates that a password change was attempted.

  ---

  ### Investigation Steps

  - **Review Event Details:** Analyze Security Event ID 4794 logs. Check for the `SubjectUserName` and `TargetUserName` fields. An unauthorized change by a non-admin account would indicate malicious intent, while expected changes may originate from a service account during installations or upgrades.

  - **Evaluate User Behavior:** Cross-reference the event with previous logins from the `TargetUserName`. Legitimate DSRM password changes usually occur during scheduled maintenance or setup of a Domain Controller. Look for patterns in timestamps to identify anomalies.

  - **Validate User Permissions:** Check if the user account associated with the event possesses the necessary privileges (Domain Admin or equivalent) to modify the DSRM password. Malicious activities are more likely if a standard user account is involved.

  - **Correlate with Other Alerts:** Look for related indicators, such as event logs associated with unexpected changes in group memberships (Event ID 4728) or modifications to critical security settings. A combination of these can reinforce the likelihood of an attack.

  - **Inspect Administrative Actions:** Investigate recent administrative actions or changes on the Domain Controller related to account management. Examine Event ID 4624 for logon events that occurred before the password change. Unscheduled administrative activity may indicate potential compromise.

  ---

  ### Prioritization

  This alert should be considered high-priority due to the critical role of the DSRM account in maintaining Domain Controller integrity. Unauthorized changes to this account suggest an active risk of exploitation, given that attackers often exploit such weaknesses for lateral movement across networks.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate password changes during the initial setup or reconfiguration of Domain Controllers if not properly correlated. Additionally, attackers might attempt to evade detection by using accounts that mimic legitimate administrative behavior. Ensure that logging for Event ID 4794 is enabled on all Domain Controllers to maintain visibility. A related detection for account manipulation is capturing group membership changes (Event ID 4728), which can help piece together potential malicious intent.

