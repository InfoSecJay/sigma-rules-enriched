note: |
  ### Technical Context

  This rule detects changes made to the Directory Services Restore Mode (DSRM) account password via Security Event ID 4794. This behavior is significant as it may indicate that an attacker is attempting to gain persistence within a domain environment by compromising a critical administrative account on domain controllers. The relevant MITRE ATT&CK techniques include Persistence (T1098) and Privilege Escalation (T1050).

  The primary telemetry source is Windows Security logs, specifically targeting Event ID 4794, which logs password changes for the DSRM account. If malicious, the impact can be severe, potentially allowing an adversary to regain access to the network even after initial exploitation has been remediated. Importantly, this detection does NOT confirm active exploitation; it merely indicates that a change has been attempted, which could be benign during legitimate administrative operations.

  ### Investigation Steps

  - **Validate log details**: Check for Event ID 4794 in Security logs. Focus on the "Target User Name" field. A username of "Administrator" under the service "Directory Services Restore Mode" can indicate malicious intent, especially outside of expected maintenance windows.

  - **Examine prior activities**: Review username and activity logs for related changes made to the system or accounts around the same timestamp. Cross-reference with suspicious logons (Event ID 4624) that may indicate unauthorized access.

  - **Identify legitimate behavior**: Determine if this event correlates with known scheduled maintenance or administrative tasks. For example, it may be typical to change the DSRM password during a DC setup, which can be validated against change management records.

  - **Look for anomaly indicators**: Analyze for other related or unusual events, like changes to Group Policy settings (Event IDs 4648/4672) or additional privilege escalation attempts, which often accompany such actions.

  - **Access credential and system impact**: Identify if any other accounts were targeted around the same time. Potentially compromised accounts, especially SYSKEY or Domain Admins, are red flags for further suspension.

  - **Validate the environment**: For systems marked as Domain Controllers, ensure appropriate monitoring and alerts are enabled for DSRM activities, which are critical in identifying malicious activity in high-value assets.

  ### Prioritization

  Given the critical role of domain controllers in enterprise environments, alerts related to changes in the DSRM password are of high severity. The likelihood of malicious abuse is significant, as attackers often target this account to establish a long-term foothold, and such behavior is commonly weaponized in attacks focused on privilege escalation and persistence.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative changes during routine maintenance to trigger this alert, which could result in false positives. Reliable detection necessitates proper logging configurations, including capturing Event ID 4794 consistently. Activities such as upstream password changes or account creation may also trigger similar alerts. A companion detection, like monitoring for User Account Control changes (Event IDs 4672), can enhance visibility for similar tactics and improve response measures.

