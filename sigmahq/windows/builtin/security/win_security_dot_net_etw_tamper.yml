detection:
  selection_etw_enabled:
    EventID: 4657
    ObjectName|endswith: '\SOFTWARE\Microsoft\.NETFramework'
    ObjectValueName: 'ETWEnabled'
    NewValue: 0
  selection_complus:
    EventID: 4657
    ObjectName|contains: '\Environment'
    ObjectValueName:
    - 'COMPlus_ETWEnabled'
    - 'COMPlus_ETWFlags'
    NewValue: 0
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity where attackers disable the Event Tracing for Windows (ETW) logging for .NET processes. By setting specific registry values, adversaries prevent the logging of .NET assembly loads, effectively shielding their malicious actions from visibility in Activity Monitors and Security Monitoring solutions. The ability to tamper with ETW logging indicates a serious intent to evade detection, as it directly affects the visibility of the attacker's actions.

  The threat scenario typically involves advanced persistent threats (APTs) or sophisticated attackers leveraging .NET for malicious purposes, such as injecting code or running malicious scripts without triggering alerts in security solutions. This behavior aligns with tactics such as **Defense Evasion** (T1562) and **Persistence** (T1112) in the MITRE ATT&CK framework, showcasing an attacker's desire to maintain stealth while executing their operations.

  Primary data sources for this detection include Windows Security Event Logs, specifically Event ID 4657, which captures modifications to registry keys indicating alterations to ETW settings.

  ### Investigation Steps
  - **Review Event Logs:** Check Security Event Logs for Event ID 4657, focusing on changes to keys related to `.NETFramework` and `Environment`, particularly looking for `ETWEnabled` or `COMPlus_*` keys set to 0.
  - **Analyze Registry Changes:** Use a tool to extract and analyze relevant registry snapshots before and after the event for any unusual alterations, especially around the time of suspicious process activity or user actions.
  - **Correlate with Process Activity:** Investigate process creation logs during the timeframe of the registry changes. Identify any associated processes that may indicate malicious behavior, especially those related to .NET execution or known malicious binaries.
  - **Check for User Behavior Patterns:** Look for unusual user behavior patterns preceding the registry changes, such as unsuccessful logins or attempts to access sensitive information, which can indicate an adversary's presence.

  ### Prioritization
  This alert is prioritized as high severity due to its implications for operational security. Disabling ETW logging not only suggests a significant evasion tactic employed by attackers but also puts the entire environment at risk by impairing the ability to track and respond to malicious actions.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may occur if systems are not configured to log all registry changes or if the relevant Windows Event logs are not being collected effectively. The detection logic assumes that log sources are properly configured to capture Event ID 4657, and it may miss attacks where this logging is not enabled or where other mechanisms are used to bypass these registry alterations. Therefore, it is crucial to ensure that Windows Security auditing is activated and configured to capture comprehensive registry modifications.

