note: |
  ### Technical Context

  This Sigma rule detects changes in the Windows registry that disable Event Tracing for Windows (ETW) for .NET processes, specifically by monitoring registry keys that modify ETW settings. The likely objective of an attacker utilizing this behavior is to avoid detection by security monitoring tools, as disabling ETW can prevent tracking of suspicious .NET assembly loads. This activity maps to the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1112 (Modification of Registry). The primary telemetry source is Windows Security log, particularly Event ID 4657 which logs registry value changes. If successful, malicious actors may conceal their activities, significantly increasing the risk of undetected persistence. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; it only indicates a potential evasion technique that may warrant further investigation.

  ### Investigation Steps

  - **Review registry change details:** Inspect Security Event ID 4657 for modifications to keys under `\SOFTWARE\Microsoft\.NETFramework` and `\Environment`. Look for values `ETWEnabled`, `COMPlus_ETWEnabled`, and `COMPlus_ETWFlags`, all set to 0. Legitimate software may adjust these values briefly during installation or updates.

  - **Correlate with application behavior:** Verify the types of .NET applications running on the system. High-frequency modifications by unknown or newly-installed applications to these keys without corresponding activity or expected patterns may indicate malicious intent.

  - **Check for abnormal process execution:** Examine processes that initiated shortly before the registry change using Sysmon Event ID 1. Look for unexpected .NET assemblies or unusual parent-child process relationships that might indicate exploitation or tampering.

  - **Look for persistent changes:** Determine if the registry change is a part of an established malware tactic by checking for recurrent modifications in a short timeframe or across multiple systems. Malicious actors may attempt to reset these values frequently.

  - **Validate ETW functionality:** Assess whether there are other ETW providers active on the host. Disabling ETW for .NET processes could also be accompanied by activity targeting other logging providers, indicating a broader attempt at concealment.

  ### Prioritization

  This alert should be considered high-severity due to the potential for significant impact on security monitoring capabilities and the likelihood that such registry modifications are initiated by malicious actors to evade detection mechanisms. The behavior explicitly targets established security controls, which is characteristic of advanced persistent threats and other sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where legitimate software might also modify these settings without being malicious; therefore, context is essential. Ensure that logging for registry changes (Event ID 4657) is consistently enabled across all production systems for reliable detection. Legitimate software installations may trigger these registry changes without indicating malicious activity. A companion detection, such as monitoring Sysmon logs for unusual process creation patterns or network connections relevant to .NET sessions, can enhance coverage and response capabilities.

