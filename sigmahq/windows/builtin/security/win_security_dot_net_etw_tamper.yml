note: |
  ### Technical Context

  This Sigma rule detects changes to registry settings that disable Event Tracing for Windows (ETW) in .NET processes. Adversaries may target ETW to prevent logging of potentially malicious activity associated with .NET applications, hindering detection efforts. This behavior corresponds to the MITRE ATT&CK tactics of Defense Evasion (T1203) and Persistence (T1112), as the attacker may seek to maintain a foothold while impeding forensic efforts.

  The primary telemetry source is Windows Security event logs, specifically Event ID 4657, which records changes to registry values. If malicious, disabling ETW could enable attackers to operate undetected, leading to escalated privileges, persistence, or data exfiltration. This alert does not confirm that an attack is occurring; it only indicates that a registry change has been made that could facilitate malicious activity.

  ### Investigation Steps

  - **Review Event ID 4657 logs:** Check for registry modifications where `ObjectName` ends with `\SOFTWARE\Microsoft\.NETFramework`, `ObjectValueName` is `ETWEnabled`, and `NewValue` is 0. Note that legitimate software updates may also trigger this.

  - **Identify COMPlus settings changes:** Inspect Event ID 4657 for modifications where `ObjectName` contains `\Environment` and `ObjectValueName` is `COMPlus_ETWEnabled` or `COMPlus_ETWFlags` with `NewValue` set to 0. This may indicate attempts to suppress logging in the environment.

  - **Examine process activity:** Use Sysmon Event ID 1 to identify any recent process creations associated with applications that leverage .NET. Malicious activity may show abnormal process parent-child relationships or unusual command-line arguments.

  - **Verify normal application behavior:** Evaluate logs for legitimate processes that use ETW disabled settings during development or testing phases. Applications typically should not disable ETW in production environments.

  - **Correlate with additional telemetry:** Look for combined events from other sources, such as PowerShell or WMI logs (Event IDs 4103 and 5861), that may point to scripting activity around the same timeframe as the registry modification. This could indicate a more extensive evasion tactic.

  - **Check for persistence indicators:** Analyze system and user profiles for other persistence mechanisms that might be present alongside the registry change. Malicious actors might attempt to establish further means of maintaining access once ETW is disabled.

  ### Prioritization

  This alert has high severity due to the critical nature of ETW in monitoring .NET application behavior. The likelihood of malicious abuse is significant, as disabling these logging mechanisms is a known tactic used by adversaries to evade detection. This behavior is not commonly benign and should be prioritized for analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging configurations needed for comprehensive ETW coverage. Attackers may leverage various evasion techniques, such as using different registry keys or modifying other ETW settings not covered by this alert. Legitimate system maintenance or application deployment might also trigger similar changes. Related detections, such as unauthorized PowerShell commands (T1059.001), should be monitored to strengthen overall defensive posture.

