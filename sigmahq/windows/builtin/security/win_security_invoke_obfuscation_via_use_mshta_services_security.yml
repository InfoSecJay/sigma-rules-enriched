note: |
  ### Technical Context
  This rule detects the use of obfuscated PowerShell commands executed via the Microsoft HTML Application Host (MSHTA). Attackers may leverage MSHTA to execute malicious scripts that are designed to evade detection mechanisms by obfuscating commands. This technique is often employed in various attack scenarios, including credential theft, data exfiltration, and initial access. Ultimately, the aim of the attacker is to execute arbitrary code on the victim's machine without raising suspicion.

  The relevant MITRE ATT&CK tactics and techniques for this activity include:
  - **Execution** (TA0002): The attacker is executing code on the target system using legitimate tools, in this case, MSHTA.
  - **Defense Evasion** (TA0005): The use of obfuscation techniques to bypass security measures falls under this tactic, specifically using **Obfuscated Files or Information** (T1027).
  - **Command and Scripting Interpreter** (T1059.001): Use of PowerShell, even indirectly through MSHTA, is indicative of this technique.

  Primary data sources for detecting this activity include Windows security event logs, particularly EventID 4697, which captures service creation events that could indicate the execution of MSHTA with suspicious command-line arguments.

  ### Investigation Steps
  - **Review Security Logs**: Check for EventID 4697 entries in Windows security logs for any instances of "mshta" invoking PowerShell scripts. Pay attention to the process command line for suspicious flags and arguments.
  - **Analyze Command Lines**: Analyze the command line arguments associated with mshta processes. Look for typical indicators of obfuscation, such as unusual characters, encoded strings, or commands to create VBScript objects.
  - **Correlate with User Activity**: Correlate the timing of the mshta execution with user activities, legitimate or illegitimate. Review the user's behavior to identify any anomalies during the period surrounding the event.
  - **Investigate Related Artifacts**: Search for additional artifacts like files with suspicious or obfuscated extensions that could be related to the execution of the MSHTA process, including .hta files or PowerShell script files.

  ### Prioritization
  The alert carries a high severity due to the potential impact of remote code execution and the likelihood of successful exploitation in an enterprise environment. The use of obfuscation techniques further increases the chance that malicious activity will go undetected.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Windows auditing for EventID 4697 is not enabled in the environment, as this specific log is crucial for identifying the execution of mshta. Additionally, the detection logic assumes that only malicious use of mshta will have these specific command-line parameters, which may not consider all legitimate use cases. The organization should ensure comprehensive logging configurations to facilitate the detection of these tactics effectively.

