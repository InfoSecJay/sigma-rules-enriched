note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts through the MSHTA (Microsoft HTML Application Host) utility, which is often used by attackers to execute malicious code while evading detection. The likely attacker objective is to execute a payload or command without tripping security alerts associated with traditional script execution methods. This activity maps to the MITRE ATT&CK technique for "PowerShell" (T1059.001) and "Obfuscated Files or Information" (T1027).

  The primary telemetry source is Windows Security Event ID 4697, which triggers when new services are created. This detection points to potentially malicious activity such as unauthorized service management or execution of obfuscated scripts by adversaries. However, this detection does NOT confirm that the behavior is malicious on its own, as legitimate applications may also create services.

  ### Investigation Steps

  - **Review Event ID 4697 logs**: Check for instances where the `ServiceFileName` contains "mshta." Look for execution context and user accounts associated with this event to differentiate between user-initiated vs. elevated service actions.

  - **Identify scripts and payload**: Examine the command line and script associated with the detected service creation. Look for parameters like `vbscript:createobject`, which can facilitate malicious code execution.

  - **Validate service legitimacy**: Assess whether the service creation relates to known software or administrative procedures. For example, legitimate activity would typically involve documented software installation or maintenance tasks.

  - **Check for abnormal timing**: Correlate timestamps of the event with other system activities or alerts. Malicious executions often happen after hours or during unusual patterns compared to historical activity logs.

  - **Confirm behavior in related detections**: Investigate any alerts related to known malicious payloads or processes linked to this event. Use additional detections like Event ID 4688 (process creation) to confirm if “mshta” is launching unusual or flagged binaries.

  ### Prioritization

  This alert is of high severity in an enterprise environment because systems running MSHTA can execute arbitrary scripts that may lead to significant compromise. The likelihood of abuse is elevated as attackers commonly use this utility to obfuscate their activities, and similar behaviors are frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion methods such as using alternative execution techniques or utilities that accomplish similar ends (e.g., using WScript or other scripting tools to run payloads). Required log sources include enabled Windows Event Logging capturing Service creations correctly. Legitimate activities that may trigger this alert include system administrators deploying custom scripts for automation. A related detection that strengthens coverage is monitoring for unusual script execution patterns through PowerShell logs (Event ID 4104).

