note: |
  ### Technical Context

  This rule detects the execution of AppX packages that are signed with known suspicious or malicious digital signatures. Such behavior is often indicative of attempts to deploy malware or perform malicious actions within a Windows environment. The likely objective of the attacker is to utilize legitimate signing techniques to execute malicious code while evading detection mechanisms. The relevant MITRE ATT&CK tactic is Execution, with the specific technique being App Store and AppX Modern Application Management (T1106).

  Primary telemetry sources include Windows Event Logs, specifically Event ID 157 from the AppX Packaging service, which logs the installation of AppX packages. If this detection is triggered, the potential security impact is significant, as it could allow a malicious actor to gain control over the system or spread malware. Importantly, this detection does NOT confirm that the executed AppX package is inherently malicious without additional context or review.

  ### Investigation Steps

  - **Check for Event ID 157:** Review Windows Event Logs for Event ID 157, indicating AppX package installation. Look for the package name associated with the suspicious digital signature for immediate context.

  - **Correlate against known malicious signatures:** Cross-reference the `subjectName` in Event ID 157 with internal threat intelligence feeds to identify if the signature belongs to a documented malicious actor or application.

  - **Identify legitimate AppX execution:** Investigate recent AppX installations for legitimate applications by analyzing `SubjectName` and `Publisher` fields, ensuring they align with known trusted vendors or authorized applications.

  - **Review affected system criticality:** Assess the role of the affected host (e.g., server, endpoint) and its environment. Critical systems showing this behavior warrant immediate escalation for further investigation.

  - **Monitor for subsequent malicious behavior:** Look for additional suspicious activity post-event, such as unexpected processes running from the AppX package’s directory or unusual outbound traffic to external IPs, which might indicate an exfiltration attempt.

  - **Validate integrity of AppX packages:** Investigate filesystem changes to the AppX package directory (e.g., `$ProgramFilesWindowsApps$`) to determine if the package was modified or moved post-installation, as this could indicate tampering prior to execution.

  ### Prioritization

  The alert should be considered medium severity due to the potential risk posed by malicious AppX package execution on critical systems. The likelihood of abuse is notable, as attackers often leverage signed software to bypass security measures. Moreover, the use of malicious AppX packages aligns with common weaponization techniques in the current threat landscape.

  ### Blind Spots and Assumptions

  Detection limitations include the ability of attackers to use legitimate certificates that might not be recognized as malicious yet. Reliable detection requires proper configuration of Windows Event Logging to ensure Event ID 157 is captured consistently. Legitimate applications may trigger this alert if they use the same suspicious signatures, highlighting the need for thorough contextual investigation. A related detection to strengthen coverage could include monitoring for unusual behaviors from AppX-installed applications, such as anomalous network traffic or process creation events.

