note: |
  ### Technical Context

  This rule detects DNS queries targeting subdomains associated with the "Put.io" file-sharing platform, specifically "api.put.io" and "upload.put.io". The likely attacker objective is to establish command-and-control (C2) communications or facilitate data exfiltration using this platform, which can be leveraged to store or share malicious files. This detection is classified under the MITRE ATT&CK framework as part of the command-and-control tactic (T1071.001 - Application Layer Protocol: Web Protocols).

  The primary telemetry source is the Windows DNS Client Event Log (Event ID 3008), which captures DNS query activity. The security impact of this alert is significant as it could indicate data theft or a C2 setup, reflecting unauthorized use of a file-sharing service. However, this detection does NOT confirm malicious intent by itself, as legitimate users may also query these domains for benign purposes.

  ### Investigation Steps

  - **Confirm DNS Query Event:** Review Windows Event Log for Event ID 3008. Check the "QueryName" field for the presence of "api.put.io" or "upload.put.io". Validate the source IP addresses to identify potential internal threats.

  - **Check for Related Network Activity:** Monitor relevant firewall logs (e.g., Event ID 5156) for outbound connections from the querying host to Put.io's IP addresses. Compare connection timestamps with the DNS query times for correlation.

  - **Identify Host Role:** Determine the role of the affected host (e.g., workstations versus servers). Workstations querying this domain without legitimate business justification should raise immediate concerns.

  - **Investigate User Context:** Review recent user activity and processes running on the affected host. Inspect any applications that may trigger legitimate queries to Put.io, such as those used for file sharing or transfers.

  - **Analyze Historical DNS Queries:** Check for patterns in DNS logs for consecutive queries to Put.io. Repeated queries without user activity may indicate malicious behavior or persistence.

  - **Assess for Malicious Indicators:** Look for indicators of compromise, such as associated malicious file downloads or unusual processes that utilize the queried subdomains. For example, newly created or modified executables that correlate with the query timestamps.

  ### Prioritization

  This alert is of medium severity due to the potential impact of data exfiltration or C2 use on the affected system. Considering the likelihood of malicious usage of file-sharing services, especially seen in targeted ransomware attacks, prompt investigation is warranted given the historical context of similar threats.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of properly configured DNS Client event logging, which can prevent visibility into these queries. Legitimate business activities, such as a corporate application utilizing Put.io for file backups, could trigger this alert. Companion detections such as monitoring HTTP traffic for PUT requests to Put.io can strengthen coverage and provide additional context for investigations.

