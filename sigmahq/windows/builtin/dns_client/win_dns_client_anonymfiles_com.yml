note: |
  ### Technical Context
  This detection rule identifies DNS queries made to the domain `anonfiles.com`, a platform frequently utilized for anonymous file uploads, often in the context of malicious activities. Attackers may leverage this domain to exfiltrate data, distribute malware, or share stolen information, ensuring anonymity in their operations. The detection of such queries can indicate potential data exfiltration attempts or interactions with known malicious infrastructure.

  Relevant MITRE ATT&CK tactics include:
  - **Exfiltration (TA0010)**: The primary goal of querying `anonfiles.com` could be to transfer sensitive data outside the organization unnoticed.
  - **Data from Information Repositories (T1567.002)**: This technique involves the use of external services to export sensitive information, such as using anonymous upload platforms.

  Primary data sources for this detection include Windows DNS Client event logs, which must be enabled to capture the DNS queries sent from endpoints within the enterprise environment.

  ### Investigation Steps
  - **Review DNS Logs**: Check the DNS Client event logs (Event ID 3008) for queries related to `anonfiles.com`; focus on the source IP addresses and timestamp to identify any anomalous behavior or patterns.
  - **Analyze Related Network Traffic**: Inspect network traffic to see if there are successful connections to `anonfiles.com`. Correlate the DNS query activity with any subsequent outbound traffic to identify potential data exfiltration.
  - **Correlate User Activity**: Look for user activity or processes that correlate with the DNS queries. This includes checking for any unusual applications running on the endpoint that may attempt to communicate with the domain.
  - **Identify Access Patterns**: Determine if there is a legitimate business need for connections to `anonfiles.com` by analyzing query frequency and identifying any users or systems that have made repeated requests.

  ### Prioritization
  This alert has a high severity level due to the potential impact of data exfiltration and the likelihood that DNS queries to `anonfiles.com` could indicate malicious activity within the organization’s network.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the requirement that Microsoft-Windows-DNS Client Events/Operational Event Log must be enabled and properly collected for analysis. Additionally, the detection assumes that all legitimate traffic to `anonfiles.com` is rare; however, there may be specific cases or users with legitimate reasons to access the domain. Without comprehensive logging of all network traffic, it's possible that some activity to `anonfiles.com` could go unnoticed, leading to gaps in assessment.

