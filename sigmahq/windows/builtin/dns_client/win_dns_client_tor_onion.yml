note: |
  ### Technical Context
  This detection rule identifies attempts to resolve .onion addresses, which are specific to the Tor network. Tor (The Onion Router) is often associated with anonymity and is used for a variety of purposes, some of which may include legitimate privacy needs, while others might be linked to malicious activities such as data exfiltration or access to illegal marketplaces. By flagging DNS queries for .onion domains, this rule can help security teams identify potential evasion tactics employed by threat actors looking to maintain operational security while engaging in illicit activities.

  The primary objective of an attacker utilizing Tor is to disguise their online activities and maintain anonymity, often to perform actions that would attract unwanted attention in a more open environment. Specifically, Tor is commonly used for command and control (C2) communication, data theft, and accessing illicit services. The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011), specifically the technique **Application Layer Protocol** (T1071) and **Proxy** (T1090.003) which cover the use of application layer protocols for C2 communications and leveraging proxies like Tor.

  To effectively detect this behavior, the primary data sources include the DNS Client logs that record DNS resolution events (EventID 3008). Ensuring that logging for these events is properly configured and enabled is crucial for obtaining the necessary telemetry to support this detection.

  ### Investigation Steps
  - **Review DNS Logs:** Examine DNS Client logs (EventID 3008) for queries that include .onion or other associated suffixes listed in the detection rule. Identify the source IP and the frequency of these queries for further context.

  - **Correlate with User Activity:** Analyze user activities around the time of the DNS queries. Look for unusual patterns such as recent changes in user behaviors, accessing sensitive resources, or the installation of non-standard applications.

  - **Evaluate Network Traffic:** Monitor outbound network traffic for connections to Tor nodes or other proxy services. Look for unusual patterns that suggest data exfiltration attempts or connection to known malicious IP addresses.

  - **Investigate Related Alerts:** Cross-reference any alerts related to application behavior that may suggest the use of Tor applications or services, thereby supporting a more comprehensive investigation into potential compromise.

  ### Prioritization
  This alert is marked as high severity due to the potential implications of an internal user connecting to the Tor network, which may indicate a malicious insider threat or an external breach attempting to obscure their activities. In an enterprise environment, this behavior warrants prompt investigation as it could lead to serious data breaches or loss of sensitive information.

  ### Blind Spots and Assumptions
  This detection rule assumes that DNS Client logging is properly enabled and configured to capture relevant events. There may be gaps in coverage if an organization uses local DNS resolution that does not log these queries or if users employ VPNs that mask their DNS requests. Additionally, organizations may encounter challenges in distinguishing legitimate use of Tor for privacy from malicious use cases, necessitating further context and investigation to rule out false positives.

