note: |
  ### Technical Context

  This Sigma rule detects DNS queries directed at .onion addresses and associated Tor routing networks, which are often used to obfuscate malicious activity. The likely attacker objective is to access hidden services, which can include black markets, forums for cybercriminals, or C2 (command and control) infrastructure. This behavior corresponds to the MITRE ATT&CK technique: Command and Control via Tor (T1090.003).

  The primary telemetry sources required for this detection are Windows Event Logs, specifically the Microsoft-Windows-DNS Client Events/Operational Event Log, particularly Event ID 3008. If the behavior is confirmed malicious, it can indicate attempts to establish covert communications or transactions related to illicit activities. Importantly, this detection does NOT confirm that an attack is occurring; further investigation is necessary to establish malicious intent.

  ### Investigation Steps

  - **Review DNS query details:** Analyze Event ID 3008 in the Windows DNS Client event logs. Look for queries where the `QueryName` field ends with any specified .onion or .hiddenservice.net suffix. Malicious indicators will include any matches to these domains.

  - **Correlate with user activity:** Check for any associated user activity or accounts related to the queries. Legitimate users may visit these sites for research or testing but should be rare in a corporate environment.

  - **Monitor for concurrent activities:** Investigate simultaneous network connections (e.g., proxy usage or remote desktop connections) on affected hosts. Use network telemetry to identify if connections to known Tor exit nodes have been established.

  - **Validate known good sites:** Establish a baseline of allowed or known good DNS queries. Verify against any flagged queries to determine if they match with legitimate business needs or are identified as suspicious or malicious.

  - **Check for networking tools installation:** Review the list of installed programs (e.g., via system management tools) for known Tor clients or related software that could indicate preparatory steps for Tor usage.

  ### Prioritization

  This alert should be deemed high priority due to the potential impact of the affected systems, especially if they host sensitive data or critical infrastructure. The likelihood of malicious abuse is significant, as the usage of Tor can facilitate various forms of cybercrime, and this behavior is known to be weaponized in numerous attacks.

  ### Blind Spots and Assumptions

  Detection can be limited by users employing advanced evasion techniques, such as using VPNs or other obfuscation methods, which may mask DNS queries. Ensure that DNS Client event logging is properly configured to capture the necessary logs for effective detection. Legitimate activities that may trigger this alert can include research by security teams or access to academic resources, requiring context in investigation. Complementary detections could focus on unusual outbound network traffic patterns or user behavior analytics to strengthen overall coverage.

