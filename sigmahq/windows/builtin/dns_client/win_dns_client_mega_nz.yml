  ### Technical Context

  This Sigma rule detects DNS queries for subdomains associated with the MEGA cloud storage service, specifically targeting the 'userstorage.mega.co.nz' domain. The likely attacker objective is exfiltration of sensitive data using MEGA as a staging or storage platform. This behavior aligns with the MITRE ATT&CK technique for Exfiltration Over Web Service (T1567.002).

  Primary telemetry sources include Event ID 3008 from the Windows DNS Client operational log, which must be enabled for accurate collection. If malicious, successful data exfiltration could lead to loss of sensitive information and potential breaches. However, this detection does NOT confirm actual data exfiltration on its own; it only indicates attempts to resolve known domains associated with MEGA.

  ### Investigation Steps

  - **Verify DNS query logs**: Examine Windows Event ID 3008 to gather details of the DNS queries made, specifically focusing on any queries to 'userstorage.mega.co.nz'. Look for the 'QueryName' field to confirm malicious indicators.

  - **Check query frequency**: Determine the rate of DNS queries to MEGA domains. Frequent queries from a single endpoint, especially during unusual hours, can indicate malicious intent compared to baseline behaviors.

  - **Assess legitimate use cases**: Identify any business processes that may legitimately use MEGA for file storage. Review user accounts and activities in conjunction with the DNS logs to establish whether the queries correlate with legitimate access patterns.

  - **Investigate related network activities**: Correlate the DNS queries with network traffic logs (Firewall or Proxy logs) to identify if any outbound connections match the IP addresses associated with MEGA. Look for HTTP/S requests to 'mega.co.nz' or 'mega.nz' domains.

  - **Review user permissions and roles**: Evaluate the user account initiating the DNS queries. High-risk roles with access to sensitive data querying MEGA may warrant increased scrutiny.

  - **Document the context**: Capture additional telemetry related to the endpoint (e.g., recent file access logs or process creation events - Security Event ID 4688) to gain further context around the user actions leading to the DNS queries.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive data exfiltration, especially if the affected systems handle critical information. While DNS queries to MEGA may not inherently indicate malicious activity, the behavior can be exploited by adversaries for data theft, making it crucial to assess context carefully.

  ### Blind Spots and Assumptions

  Detection limitations include possible false negatives if the DNS Client logs are not correctly configured or collected. Legitimate activities, such as employees accessing shared files on MEGA for work purposes, may inadvertently trigger this alert. Companion detections, such as monitoring for outbound connections to mega.co.nz via firewalls or proxies, can enhance coverage against this threat.

