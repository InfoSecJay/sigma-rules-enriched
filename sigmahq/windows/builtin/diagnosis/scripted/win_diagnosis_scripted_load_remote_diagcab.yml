logsource:
  product: windows
  service: diagnosis-scripted
detection:
  selection:
    EventID: 101
    PackagePath|contains: '\\\\'     # Example would be: \\webdav-test.herokuapp.com@ssl\DavWWWRoot\package
  condition: selection
falsepositives:
- Legitimate package hosted on a known and authorized remote location
level: high
note: |
  ### Technical Context

  This rule detects the loading of diagnostic cabinet (diagcab) packages from remote paths, which can indicate exploitation of vulnerabilities like DogWalk. The likely objective of this behavior is to execute malicious scripts or deliver payloads through crafted diagcab files. Relevant MITRE ATT&CK technique is **Execution via Remote File (T1059.001)**. The primary telemetry source is Windows Event ID 101 from the diagnosis-scripted service. If malicious, this activity could compromise the integrity and confidentiality of the system by enabling remote code execution. Importantly, it should be noted that the detection of this event does NOT confirm that the execution was malicious without further context.

  ### Investigation Steps

  - **Review Event ID 101:** Check Windows Event ID 101 logs for the occurrence of diagcab package loading from remote paths. Focus on the `PackagePath` field for any suspicious URLs that contain '\\'.

  - **Identify known remote paths:** Validate if the package paths correspond to known and authorized locations (e.g., internal web servers). Legitimate usage would generally involve trusted domains or internal IP ranges.

  - **Investigate additional file creation:** Check for any related file creation events around the same timestamp by correlating with Windows Security Event ID 4688 (process creation). Look for command lines that include the diagcab execution process.

  - **Examine network connections:** Review network logs or firewall logs for outbound connections to suspicious hosts (e.g., using a tool like IDS/IPS systems) at the time of event creation. Check for connections to any unrecognized remote servers.

  - **Analyze user context:** Determine the user context under which the diagcab package was executed. Malicious runs often occur under service accounts or other less privileged users in a way that deviates from normal operational patterns.

  ### Prioritization

  This alert is high severity due to the potential for significant impact on the affected system, as remote execution of diagcab files can be weaponized to install malware. The likelihood of malicious abuse is elevated given that such methods are increasingly used by adversaries to exploit vulnerabilities.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted protocols that obscure file transfers or misconfigured logging that fails to capture relevant events. Legitimate activities, such as IT-managed updates or package installations from authorized remote paths, may trigger this alert. A related detection that strengthens coverage is identifying execution of binaries or scripts from remote paths, which could complement the detection of diagcab execution.

