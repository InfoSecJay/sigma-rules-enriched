  ---

  ### Technical Context

  This detection rule identifies events where a certificate, potentially including its private key, is exported from the local Windows certificate store, a behavior which can indicate an unauthorized attempt to exfiltrate sensitive cryptographic materials. The likely attacker objective is to use the exported certificates for impersonation or unauthorized access to systems and data, leveraging the compromised cryptographic credentials. This aligns with the MITRE ATT&CK technique of Credential Access, specifically T1649 (Credential Dumping: Certificate Export).

  The primary telemetry source is Windows Event Logs, specifically Event ID 1007, which documents when a certificate is exported by an application. If this behavior is performed maliciously, the security impact could be severe, leading to credential theft and potentially enabling lateral movement within the environment. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also perform certificate exports under appropriate scenarios.

  ---

  ### Investigation Steps

  - **Review Event ID 1007 logs:** Collect and analyze Event ID 1007 from the Security log. Look for unusual patterns, such as exports initiated by non-administrative user accounts or scripts rather than authorized applications.

  - **Identify process context:** Investigate the process that requested the certificate export by correlating with Process ID from Event ID 1007. Use Sysmon Event ID 1 for process creation details (including command line arguments) to verify if the initiating process is common or known to be malicious.

  - **Validate certificate and key usage:** Check the exported certificate’s thumbprint against your organization’s trusted certificate list. Access the certificate’s private key storage to confirm if the private key was also exported, which is a high-confidence indicator of potential misuse.

  - **Analyze recent application activities:** Review the Application Event logs to determine whether the exporting application is legitimate and if it has performed standard operations in the recent past. This may include comparing against known trusted applications that have historically requested certificate exports.

  - **Examine user account behavior:** Investigate the user account associated with the export event for any abnormal behavior, such as unusual login times or accessing sensitive resources. This can help establish if the account has been compromised.

  - **Document network communications:** If the export coincided with network activity, analyze any associated outbound traffic logs for signs of exfiltration, such as attempts to send the exported certificate to external IP addresses or domains.

  ---

  ### Prioritization

  The alert indicates medium severity due to the potential security impact of certificate and private key exports. While this behavior can be legitimate, the likelihood of malicious abuse exists, particularly if occurring in sensitive or high-privilege environments. Attackers frequently weaponize certificate theft for lateral movement and establishing persistence.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited if logging configurations for certificate-related events are not comprehensive or if requisite event IDs are not enabled. Evasion techniques might include targeted malware designed to bypass standard logging or performing exports through authorized applications to mask activity. Legitimate activities, such as IT administrators managing certificates, can trigger this alert; hence, context is critical. A related detection could include monitoring for unusual access patterns to sensitive cryptographic material under MITRE ATT&CK T1555 (Credentials from Password Managers) for enhanced coverage.

