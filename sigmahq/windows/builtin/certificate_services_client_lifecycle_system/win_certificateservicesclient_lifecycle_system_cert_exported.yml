note: |
  ### Technical Context
  This rule detects when a certificate, and potentially the private key, is exported from the local Windows certificate store. In a typical threat scenario, attackers may seek to misuse certificates for various purposes, such as impersonating legitimate services, performing man-in-the-middle attacks, or gaining unauthorized access to secure systems by leveraging stolen keys. The exportation of a certificate, especially with the private key, can indicate nefarious activity, particularly if it occurs outside of regular administrative action or is conducted by non-administrative users.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) as attackers may aim to capture and utilize credentials stored in certificate formats, specifically technique **T1649: Exporting Credentials via Certificate Management**. The primary data sources for this detection include Windows event logs, particularly Event ID 1007, which signals that a certificate has been exported. Monitoring these events can help security teams identify unauthorized access to sensitive certificate data.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows Event ID 1007 logs to identify the source of the certificate export. Look for unusual user accounts or non-administrative user actions at unexpected times.
  - **Analyze Export Request Details:** Validate what application or service initiated the export. Confirm whether the request is legitimate by checking associated user behaviors and roles.
  - **Cross-Reference with ACLs:** Check access control lists (ACLs) for the certificate store to identify any unauthorized changes or access patterns that might indicate exploitation.
  - **Verify Certificate Purpose:** Investigate the purpose of the exported certificates. Determine if they were used for legitimate business processes or if their presence in the environment indicates a risk.

  ### Prioritization
  This alert is of medium severity as it indicates a potential compromise of sensitive credentials, which, if exploited, can lead to significant security breaches. The likelihood of such an event is elevated in environments that manage sensitive data or rely heavily on PKI implementations.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning legitimate administrative actions, as the detection logic could trigger false positives when valid applications initiate certificate exports. Assumptions in the detection process include the availability and proper configuration of Windows event logging for certificate services. This alert requires that specialized logs are actively collected and monitored to ensure timely detection of certificate exports.

