note: |
  ### Technical Context

  This rule detects when an application exports a certificate from the local Windows certificate store, signaled by Event ID 1007. The likely attacker objective is to harvest certificates, including private keys, to facilitate unauthorized access or impersonate legitimate services, thereby bypassing security controls. This activity aligns with the MITRE ATT&CK technique for Credential Access: `T1649 - Certificate Exporting`.

  The primary telemetry source for this detection is the Windows operating system logs, specifically the log type Events from the certificate services client. If this activity is malicious, it could lead to significant security impacts, including compromised system integrity and loss of data confidentiality. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also request certificate exports.

  ### Investigation Steps

  - **Check Event ID 1007:**
    Review Windows Event Viewer under Security logs immediately after receiving the alert for Event ID 1007, indicating a certificate export event. Note the process initiating the export and the time of the event.

  - **Identify exporting application:**
    Validate the application that initiated the certificate export by cross-referencing the Process ID (PID) in the Event ID 1007 log with the corresponding process information in Sysmon Event ID 1. Look for known benign applications or unusual entries (e.g., PowerShell, command line utilities).

  - **Evaluate for private key export:**
    Investigate if the export includes a private key by checking the certificate’s exportable attribute in the Event ID 1007 details. Legitimate certificate exports usually do not export private keys unless specifically intended by administrative actions.

  - **Review recent changes in certificate management:**
    Look for recent changes in certificate policies or permissions in both Certificate Services logs and Active Directory as these may indicate legitimate administrative actions or misconfigurations that could lead to misuse.

  - **Correlate with potential lateral movement:**
    If there are indications of a compromised account, analyze for related authentication events (e.g., Security Event ID 4624) from the same user account within a 24-hour window for additional suspicious access patterns.

  - **Document user behavior trends:**
    Check for a history of regular certificate exports by legitimate users who may have performed this activity previously. Anomalies in frequency or timing could indicate malicious intentions.

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential for an attacker to obtain sensitive credentials and further exploit the network. The likelihood of abuse is moderate, as certificate theft, especially with private keys, is a known tactic used by adversaries. This behavior is not commonly weaponized in isolation but could serve as a precursor to more severe compromises.

  ### Blind Spots and Assumptions

  This rule may not detect all instances of malicious certificate export due to legitimate applications triggering the same event. Required configurations include ensuring that logging for the Certificate Services client is adequately set up across all systems. Legitimate export requests from administrative or automation tools may trigger the alert, hence further context checks are needed. A related detection rule looking for unusual account activities (e.g., multiple failed logins or suspicious privilege escalations) could enhance monitoring effectiveness around certificate manipulation attempts.

