note: |
  ### Technical Context

  This rule detects potential remote desktop connections made using NTLM to hosts that are likely not part of the corporate domain. Attackers might leverage this behavior to establish unauthorized access to external or rogue systems, often as part of reconnaissance or lateral movement efforts. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, and the technique is **Application Layer Protocol (T1219.002)**.

  The primary telemetry source required for this detection is Microsoft Windows Event ID 8001 from the NTLM operational logs. If executed by an adversary, this activity could indicate the presence of a security breach, leading to potential data exfiltration or unauthorized control over compromised systems. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Review connection target:** Query Event ID 8001 to identify the `TargetName`. If it begins with `TERMSRV`, analyze if this connection is to a known, valid domain or a potentially unauthorized external host.

  - **Examine NTLM authentication requests:** Check the details in NTLM operational logs to see if the `SourceAddress` corresponds to internal or recognized systems. Unrecognized source IPs warrant higher scrutiny.

  - **Identify user context:** Investigate the `UserName` associated with the login attempt. Determine if the user has recent history of similar connections. Legitimate users typically connect to known or explicitly defined external hosts, while anomalous user activities should be flagged.

  - **Assess the timing and frequency of logins:** Review log timing in the Event ID 8001 entries to identify any suspicious patterns. High volumes of logins at odd hours may indicate malicious attempts to gain remote access.

  - **Confirm legitimate activity:** Compare against documented business activities, especially if there are maintenance windows for remote access that may justify the connections.

  - **Trace IP address:** If identified as suspicious, perform reverse lookups for `SourceAddress` to deduce ownership or verify if it is associated with known malicious IPs or malicious infrastructure.

  ### Prioritization

  This alert carries a medium severity due to the potential impact of unauthorized access to sensitive systems, particularly if the target host could be crucial to operations or data protection. Given that such remote desktop connections are commonly weaponized by attackers for lateral movement, the likelihood of malicious abuse remains significant.

  ### Blind Spots and Assumptions

  Detection relies on properly configured NTLM operational logging, which may be disabled in some organizations, limiting visibility. Evasion techniques include utilizing legitimate domain connections under false pretenses or employing tunneling methods to mask the true destination. Additionally, activities such as remote access for third-party support may trigger alerts; hence, understanding legitimate operational context is vital. Companion detections include monitoring for unusual network traffic toward unrecognized external hosts.

