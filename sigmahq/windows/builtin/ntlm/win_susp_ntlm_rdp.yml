level: medium
note: |
  ### Technical Context
  This detection rule monitors for potential remote desktop connections initiated via NTLM authentication to hosts that may not be part of the organization's domain. By flagging logons that begin with "TERMSRV," this rule aims to uncover potentially unauthorized access attempts by attackers exploiting remote desktop capabilities for lateral movement or data exfiltration. The objective of these attackers is often to gain footholds in networks and escalate privileges, which supports various stages of attack.

  The relevant MITRE ATT&CK tactics for this detection include **Command and Control (TA0011)**, which pertains to the use of established network protocols to establish remote connections, as well as **Exploitation of Remote Services (T1219)**, particularly the sub-technique **Exploitation of Remote Desktop Services (T1219.002)**. Primary data sources for this detection include the NTLM operational logs from Windows Event ID 8001, which detail authentication attempts over the NTLM protocol.

  ### Investigation Steps
  - **Review NTLM Logs:** Analyze the logs generated by Microsoft-Windows-NTLM/Operational to identify Event ID 8001 entries and their associated source IPs and target names.
  - **Cross-Check Domain Membership:** Verify the target host against your organization's asset inventory to determine if the connection is to a legitimate domain resource.
  - **Identify User Behavior:** Investigate the user account associated with the connection to establish whether this behavior is consistent with their normal operational activities.
  - **Network Connection Analysis:** Use network logs to trace any unusual traffic patterns or connections made to hosts not previously interacted with by the network users.

  ### Prioritization
  The medium severity of this alert reflects a notable risk for enterprise environments, as unauthorized access through remote services can lead to significant data breaches or service disruptions if exploited by malicious actors.

  ### Blind Spots and Assumptions
  This detection may not cover all cases of unauthorized remote access, particularly if connections are made using different authentication protocols or to hosts utilizing fully qualified domain names (FQDNs) that may not be captured in this rule. Assumptions include that the NTLM logs are collecting data consistently and that the target hosts can be accurately identified by their resource names. To ensure effective operation of this alert, proper configuration of event logging and monitoring for NTLM-based authentication is essential.

