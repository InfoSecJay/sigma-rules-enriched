note: |
  ### Technical Context
  This detection rule identifies potential NTLM brute force attacks by monitoring specific event IDs associated with NTLM authentication attempts targeting common device names. Brute force attacks are generally conducted by threat actors attempting to gain unauthorized access to accounts by systematically guessing passwords. The attacker’s objective is typically to exploit weak or compromised credentials to escalate privileges, move laterally within the network, or access sensitive data.

  Relevant MITRE ATT&CK tactics for this detection include **Credential Access (TA0006)**, specifically the technique **Brute Force (T1110)**. By correlating the detection with specific device names often targeted during these attacks, responders can effectively identify potentially malicious behavior amidst noise generated by legitimate activity.

  The primary data sources for this detection will be the Microsoft Windows Event Logs, particularly the **Microsoft-Windows-NTLM/Operational** logs, captured under Event ID 8004. This log will provide insights into NTLM authentication activities, including the originating device names, which are critical in determining whether an attack is in progress.

  ### Investigation Steps
  - **Review NTLM Event Logs:** Examine the Microsoft-Windows-NTLM/Operational event logs for Event ID 8004 to identify authentication attempts to the specified device names that match the detection parameters.

  - **Analyze User Account Activity:** Investigate the user accounts associated with unsuccessful authentication attempts to check for multiple failed logins, which may indicate a brute force attack attempt on user accounts.

  - **Monitor Failed Authentication Attempts:** Look for patterns of failed NTLM logins from the same or different source IP addresses over a short period. Correlate these with other logs (e.g., firewall or VPN logs) to assess potential lateral movement.

  - **Cross-Reference with Asset Inventory:** Validate whether the device names flagged are legitimate within the environment. This involves correlating the event log data with the organization's asset inventory to mitigate false positives.

  ### Prioritization
  Given the potential impact of credential compromise and unauthorized access stemming from brute force attacks, this alert is categorized as medium severity. It warrants prompt investigation to prevent lateral movement and escalated privileges within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may not cover all legitimate authentication attempts, especially if other device names are targeted that are not included in the detection logic. The rule assumes that the provided device names will not be present in legitimate organizational usage, which could lead to false positives. Required logs include comprehensive NTLM event logging settings, and if these logs are not configured correctly, detection will fail.

