  ---

  ### Technical Context

  This rule detects NTLM logon events (Event ID 8002) that may indicate either benign legacy authentication attempts or potentially malicious lateral movement attempts by an attacker. The likely attacker objective is to exploit weaker authentication mechanisms to access systems, posing a risk to sensitive data if exploited. This behavior corresponds to the MITRE ATT&CK technique "NTLM Authentication" (T1550.002), which falls under the tactics of Defense Evasion and Lateral Movement. The primary telemetry source for this detection is the Microsoft Windows NTLM operational logs. The security impact of successful exploitation could include unauthorized access to systems and data breaches. Notably, this detection does NOT confirm that all NTLM logons are malicious, as benign interactions from legacy systems are common.

  ---

  ### Investigation Steps

  - **Check event logs for Event ID 8002:** Review Microsoft-Windows-NTLM/Operational logs for Event ID 8002. Malicious indicators include unexpected logons from unusual hosts or accounts, while expected legitimate access may be from known legacy systems with scheduled tasks.

  - **Identify source IP addresses:** Cross-reference the source IP from the NTLM logon event with the organization’s asset inventory. Malicious indicators include IP addresses not belonging to authorized internal systems or known VPN endpoints.

  - **Verify user credentials involved:** Look into the user account associated with the NTLM logon. Accounts unrelated to system administrators or service accounts that log on from endpoints outside normal operational hours may indicate malicious activity.

  - **Analyze logon timestamps:** Investigate the timestamps of the logged NTLM authentication attempts. Repeated or unusual access patterns, such as multiple logons within a short time frame from the same user account, may indicate an attack.

  - **Review system roles of affected endpoints:** Assess the criticality of systems receiving NTLM logons. Higher impact if critical servers (e.g., domain controllers, file servers) are involved. Documenting the expected behavior for accessing these systems can help differentiate between legitimate and suspicious activity.

  ---

  ### Prioritization

  This alert is rated low priority given the high likelihood of benign legacy authenticating systems. However, if it originates from critical infrastructure or correlates with other suspicious activities, it may warrant further investigation. The behavior of NTLM usage is a known concern as it can be weaponized by adversaries looking to exploit weaker authentication methods.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments that utilize legacy systems heavily relying on NTLM, which could generate frequent false positives. Ensuring operational auditing for NTLM logs is essential for reliable detection. Additionally, legitimate scheduled tasks from these legacy systems may trigger this alert. A complementary detection to consider is monitoring for unusual outbound traffic following NTLM logon events, which may strengthen detection coverage against lateral movement.

