  ### Technical Context

  This Sigma rule detects NTLM logon events through Event ID 8002, which may occur when legacy systems authenticate to modern resources, or potentially through attacker lateral movement techniques. Attackers might seek to exploit NTLM due to its weaker security posture, using it for unauthorized access or privilege escalation. This activity is categorized under MITRE ATT&CK's **Defense Evasion** (T1203) and **Lateral Movement** (T1550.002).

  The primary telemetry source for this rule is the Microsoft-Windows-NTLM/Operational event log, specifically capturing authentication logs related to NTLM logons. If malicious, this behavior can indicate unauthorized system access, posing significant risks depending on the system’s role. Importantly, while this detection identifies NTLM logons, it does NOT confirm malicious intent on its own, as these events can also arise from benign legacy applications.

  ---

  ### Investigation Steps

  - **Review event details for anomalies:** Check Event ID 8002 logs for unusual source accounts or systems. Look for "Source Network Address" and "Source Workstation" fields to identify unexpected origins of NTLM logons.

  - **Identify legacy systems:** Cross-reference the logon events with a list of known legacy systems within the organization. If the logons are from these systems, they may be benign, but further investigation is warranted if events originate from newer systems.

  - **Assess account permissions:** Verify the permissions and roles of the accounts associated with the NTLM logons. Pay attention to user-level accounts performing logons typically expected only from privileged accounts.

  - **Examine logon timestamps:** Analyze the timestamp of the NTLM logon events. Look for activity outside of regular business hours, which may indicate malicious behavior, especially if associated with critical systems.

  - **Check for signs of lateral movement:** Investigate for multiple NTLM logons across various systems in a short time frame, which may suggest lateral movement techniques by an adversary attempting to gain access to additional systems.

  - **Utilize host-based indicators:** If NTLM logon events correlate with processes that create unusual registry keys or files (e.g., under `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`), this may indicate malicious activity.

  ---

  ### Prioritization

  The alert severity is moderate, as NTLM logons can signal potential security issues, especially in environments handling sensitive data. The likelihood of abuse increases in systems lacking sufficient security controls, making this behavior noteworthy but not urgent unless other indicators are present.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to legacy systems or network configurations that generate legitimate NTLM logon events, which can mask potentially malicious activity. Ensure that logging for Microsoft-Windows-NTLM/Operational is properly configured to capture all relevant events for reliable detection. Additionally, legitimate administrative actions or service credentials may trigger this alert, necessitating contextual reviews. A related detection for credential dumping techniques (such as Event ID 4624 for successful logon) can enhance coverage against potential lateral movement attacks.

