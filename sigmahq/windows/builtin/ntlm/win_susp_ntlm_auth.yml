  ### Technical Context
  This rule detects logon attempts using NTLM (NT LAN Manager), which is an authentication protocol used in Windows environments. While NTLM can be utilized for legitimate purposes, its presence may indicate either legacy systems that have not migrated to more secure authentication methods, or it may be exploited by attackers who seek to conduct lateral movements within a network. In scenarios where NTLM is leveraged by unauthorized personnel, the attackers typically aim to exploit vulnerabilities associated with this older protocol to gain access to resources or sensitive information.

  Relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005) and **Lateral Movement** (TA0008). Specifically, the techniques of interest include **Authentication Package** (T1550.002), which highlights the use of NTLM for authenticating user accounts across the network. Primary data sources for detecting these logons will include Windows event logs related to NTLM authentication (Microsoft-Windows-NTLM/Operational) and any logs that capture process creation events, as attackers often spawn processes to facilitate these unauthorized logon attempts.

  ### Investigation Steps
  - **Review NTLM Logon Events**: Examine logs for Event ID 8002 to identify NTLM logon instances. Pay attention to the source IP addresses and the accounts involved in these logins for unusual patterns or anomalies.
  - **Analyze Source Systems**: Investigate the systems generating NTLM logon events. Determine if these systems are legacy hosts or if there are unauthorized systems that may have been compromised.
  - **Monitor Lateral Movement Patterns**: Look for additional actions taken by accounts that logged in using NTLM. Correlate with process creation logs to identify possible lateral movements or privilege escalation attempts.
  - **Audit User Accounts**: Conduct an audit of user accounts involved in NTLM logons. Check for any unauthorized users or accounts that show suspicious login behaviors, particularly during after-hours periods.

  ### Prioritization
  The severity of this alert is relatively low, as NTLM is sometimes used legitimately by legacy systems. However, given that attackers may exploit NTLM's vulnerabilities for lateral movement, it is essential to monitor and respond to any unusual NTLM logon activity to mitigate potential security risks.

  ### Blind Spots and Assumptions
  Detection of NTLM logons may miss environments where NTLM is either minimally or not at all utilized. The rule assumes that both the relevant Windows event logging is enabled and that logging captures these NTLM-specific events. Additionally, there may be false positives generated from legitimate legacy system activity, requiring further contextual analysis of the alerts generated by this rule.

