  ### Technical Context

  This Sigma rule detects NTLM logon events (Event ID 8002) which may indicate the use of outdated authentication protocols. NTLM is often employed by attackers as a lateral movement technique within an environment, especially when interacting with legacy systems. The relevant MITRE ATT&CK tactic is "Lateral Movement" (TA0008) and the technique is "Lateral Movement: NTLM Authentication" (T1550.002).

  Primary telemetry sources include Windows Event Logs specifically from the Microsoft-Windows-NTLM/Operational log with Event ID 8002. If malicious, this behavior could allow attackers to gain unauthorized access to sensitive systems or data. Detection of this event does not confirm exploitative action on its own; legitimate use of NTLM may also be common in legacy applications.

  ### Investigation Steps

  - **Review NTLM logon events:** Check for Event ID 8002 in the Microsoft-Windows-NTLM/Operational logs. Confirm the source system and its intended role; any NTLM logons from high-value targets warrant further scrutiny.

  - **Identify related activity:** Correlate NTLM logons with associated events like successful or failed logon events (Event ID 4624/4625) from the Security logs. Examining timing and patterns can differentiate between legitimate legacy usage and potential compromise.

  - **Assess system roles and users:** Determine if the logon originated from legacy systems or users who frequently use NTLM for legitimate purposes. For example, if an NTLM logon occurs from a non-legacy endpoint or a user not known to use these protocols, escalate this as suspicious.

  - **Monitor authentication traffic:** Look for additional telemetry such as network traffic logs that reveal NTLM authentication requests, including source and destination IP addresses and ports. Malicious activity may accompany unusual patterns or attempts from compromised accounts.

  - **Review for repeat occurrences:** Examine whether the NTLM logon appears repeatedly within a short timeframe, particularly from multiple systems. This behavior could suggest an attacker attempting to spread laterally, signaling heightened risk.

  - **Document legitimate baseline:** Define normal behavior for NTLM usage in your environment. Typical legacy application access paths should be documented and observed. Any deviations from established baselines might warrant further investigation.

  ### Prioritization

  The alert is considered low severity due to the commonality of NTLM usage in legacy applications. However, its presence on critical systems or unusual accounts can indicate potential malicious activity, especially if correlated with other suspicious behaviors.

  ### Blind Spots and Assumptions

  This detection may miss circumventions where attackers exploit non-NTLM methods or systems configured not to generate these logs. Reliable detection requires that the Microsoft-Windows-NTLM/Operational logs are correctly configured and monitored. Legitimate activities include typical application access by users who authenticate with NTLM. A companion detection could include monitoring for failed logon attempts using NTLM, which may indicate initial reconnaissance or exploitation attempts.

