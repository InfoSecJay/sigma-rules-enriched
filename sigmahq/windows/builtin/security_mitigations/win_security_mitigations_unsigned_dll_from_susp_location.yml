note: |
  ### Technical Context
  This rule detects attempts to load unsigned dynamic link libraries (DLLs) from unusual or suspicious locations within the Windows operating system. It specifically looks for events where the Code Integrity (CI) engine blocks these processes, providing insight into potential malicious activities. Attackers often exploit unsigned binaries to bypass security measures, leading to a variety of threat scenarios such as privilege escalation or persistence mechanisms.

  The likely attacker objectives involve executing unauthorized code to gain higher privileges or maintain a foothold within the environment. Unsigned binaries loaded from common user-accessible directories (e.g., Downloads, Public, Temp) can indicate an evasion tactic aimed at hiding malicious activities from traditional security tools.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (TA0003)**
  - **Privilege Escalation (TA0004)**
  - **Defense Evasion (TA0005)**
  - **T1574.001 - DLL Side-Loading**

  Primary data sources for detection in this scenario are the security event logs related to Code Integrity, specifically events indicating blocked processes due to unsigned binaries.

  ### Investigation Steps
  - **Review Blocked Events:** Analyze Windows Event ID 11 and 12 logs for processes attempting to load unsigned DLLs. Focus on the specific filenames and paths of the blocked binaries.
  - **Investigate File Locations:** Correlate the paths of the flagged unsigned DLLs with known malicious directories. Look for patterns or repetition that may indicate an attempt at systematic exploitation.
  - **Assess Process Origin:** Determine the parent processes that triggered the loading of the unsigned DLLs. Check for any inconsistency or suspicious behavior from these parent processes, which may help link the activity to a larger infection chain.
  - **Consult User Activities:** Examine user activity logs to understand the context surrounding the use of locations like Downloads and Temp folders. Identify whether these actions correlate with employee behavior or point towards possible compromise.

  ### Prioritization
  This alert is prioritized as high severity due to its potential implications for system integrity and the likelihood of exploitation via unsigned binaries. In an enterprise environment, the presence of such activities could indicate attempts to bypass security controls, leading to significant operational risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for signed binaries that exhibit malicious behavior, as this rule strictly identifies unsigned DLL loading. It assumes that the Code Integrity engine is fully operational and that logs for Event IDs 11 and 12 are being generated and retained. The effectiveness of this alert relies on proper configuration of security policy settings related to Code Integrity and appropriate logging mechanisms in place across all endpoints.

