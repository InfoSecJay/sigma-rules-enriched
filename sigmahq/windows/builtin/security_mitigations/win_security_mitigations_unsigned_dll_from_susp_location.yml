logsource:
  product: windows
  service: security-mitigations
detection:
  selection:
    EventID:
    - 11
    - 12
    ImageName|contains:
    - '\Users\Public\'
    - '\PerfLogs\'
    - '\Desktop\'
    - '\Downloads\'
    - '\AppData\Local\Temp\'
    - 'C:\Windows\TEMP\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to load unsigned DLLs from suspicious directories such as user public folders or temporary directories by monitoring Code Integrity (CI) events. The likely attacker objective is to execute untrusted code to maintain persistence or escalate privileges on a compromised system. This behavior aligns with the MITRE ATT&CK technique for "Signed Binary Modification" (T1574.001), which indicates an evasion technique by leveraging unsigned binaries to bypass security measures.

  Primary telemetry sources include Windows Security Mitigation events, specifically Event IDs 11 and 12. If successful, such loading could facilitate malicious operations without raising immediate alarms. However, this detection does NOT confirm malicious intent on its own; it merely indicates the presence of unsigned binaries being loaded from suspicious locations.

  ### Investigation Steps

  - **Review Event IDs 11 and 12 for image load attempts:** Check Windows Security logs (Event Viewer > Applications and Services Logs > Microsoft > Windows > Security-Mitigations) for Event IDs 11 and 12 that correspond to blocked DLLs.

  - **Analyze the ImageName field for common malicious paths:** Look for DLLs loaded from paths such as `C:\Users\Public\` or `C:\Windows\TEMP\`, as these locations are often used by adversaries for dropping malicious payloads.

  - **Correlate with existing whitelists:** Cross-reference the DLLs with known legitimate software to identify benign activity. Legitimate applications should not load unsigned DLLs from these directories.

  - **Investigate execution context and parent processes:** Identify the parent process of any blocked execution using Sysmon Event ID 1. A legitimate parent (e.g., `explorer.exe`) may suggest benign behavior, whereas system processes or suspicious parent processes should raise flags.

  - **Check system integrity and previously executed commands:** Review PowerShell history (Event ID 4104 if enabled) for suspicious commands leading to the execution of unsigned binaries, focusing on common PowerShell usage patterns for persistence.

  - **Assess system role and criticality while responding:** Determine if the affected system is a high-value target (e.g., domain controller) to prioritize immediate investigation and remediation actions.

  ### Prioritization

  This alert should be treated with high severity, particularly on critical systems where unsigned binaries pose significant risks of privilege escalation or persistence mechanisms. The likelihood of misuse is heightened given adversaries frequently exploit temporary and user directories for malicious payloads.

  ### Blind Spots and Assumptions

  This detection may be limited by systems configured not to log certain security events, making its reliability contingent on proper logging configurations. Legitimate software updates, plugins, or misuse of admin tools can trigger alerts as well. Companion detections for file creation or modification events in the same suspicious directories would enhance coverage and mitigate false positives.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
