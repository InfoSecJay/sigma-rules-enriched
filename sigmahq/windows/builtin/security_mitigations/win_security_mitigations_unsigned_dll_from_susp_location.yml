logsource:
  product: windows
  service: security-mitigations
detection:
  selection:
    EventID:
    - 11
    - 12
    ImageName|contains:
    - '\Users\Public\'
    - '\PerfLogs\'
    - '\Desktop\'
    - '\Downloads\'
    - '\AppData\Local\Temp\'
    - 'C:\Windows\TEMP\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to load unsigned DLLs from suspicious locations on Windows systems, specifically when the Code Integrity (CI) engine blocks the process. The behavior indicates a potential exploitation attempt, where an adversary seeks to execute unauthorized code that may lead to privilege escalation or persistence. This detection aligns with the MITRE ATT&CK technique for "Signed Binary Proxy Execution" (T1574.001).

  The primary telemetry sources for this detection include Windows Security Event Logs, specifically Event IDs 11 and 12 related to code integrity violations, which reveal attempts to enforce robust execution policies. If confirmed malicious, this behavior could compromise system integrity and provide unauthorized access to sensitive resources. It's essential to note that this detection does NOT confirm active compromise on its own; further contextual analysis is required.

  ### Investigation Steps

  - **Check recent process activities**: Review Security Event ID 4688 for process creation events around the same time as Event IDs 11 and 12. Focus on processes attempting to load unsigned DLLs from the paths listed in the Sigma rule. Legitimate applications typically load DLLs from system or application directories, not user directories.

  - **Identify the specific DLLs**: Examine the events for the names of the DLLs being blocked. Compare these against known software to see if they belong to legitimate applications. Unsigned DLLs from suspicious directories are high-confidence malicious indicators.

  - **Correlate user activity**: Investigate the user account associated with the flagged events by examining Event ID 4624 for account logon details. High-risk activities, such as Administrator accounts performing routine tasks in unusual non-system directories, may indicate malicious behavior.

  - **Review file creation records**: For systems using Sysmon, validate File Creation events (Sysmon Event ID 11) around the timestamp of the detected block to see if any unsigned and potentially malicious DLLs were created or altered in suspicious locations.

  - **Assess application whitelisting**: Analyze Group Policy settings and local security policies regarding application control to determine if software restriction policies are effectively in place. An absence of controls may allow such suspicious activities to occur unchecked.

  ### Prioritization

  This alert is high priority due to the potential impact on the integrity of enterprise systems, especially if the affected system is critical infrastructure. The likelihood of malicious abuse is significant, given the common tactics employed by adversaries to deliver payloads using unsigned binaries from user-accessible directories. This behavior is frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  The detection may not capture instances where signed binaries are misused or when legitimate unsigned binaries are used in a company-managed setting, posing a risk of false positives. Required log sources for reliable detection include the full capture of Windows Security event logs and Sysmon logs for comprehensive telemetry. Legitimate administrative tasks or automated updates may trigger alerts if they involve loading DLLs from the specified directories. A related detection to consider would be monitoring for unusual process creation events that could signal malicious actions beyond just unsigned DLL loading.

