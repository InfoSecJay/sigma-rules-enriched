detection:
  selection:
    EventID:
    - 11
    - 12
    ImageName|contains:
    - '\Users\Public\'
    - '\PerfLogs\'
    - '\Desktop\'
    - '\Downloads\'
    - '\AppData\Local\Temp\'
    - 'C:\Windows\TEMP\'
  condition: selection
falsepositives:
