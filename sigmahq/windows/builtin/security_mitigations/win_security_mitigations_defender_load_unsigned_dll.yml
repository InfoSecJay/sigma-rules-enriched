note: |
  ### Technical Context

  This rule detects attempts to load unsigned Dynamic Link Libraries (DLLs) through Microsoft Defender processes, specifically `MpCmdRun.exe` and `NisSrv.exe`. These attempts may indicate an adversary’s intent to sideload unauthorized code, potentially allowing them to execute malware while masquerading as legitimate processes. The relevant MITRE ATT&CK tactics are **Privilege Escalation** and **Defense Evasion**, particularly technique **T1574.001** (Sideloading).

  Primary telemetry sources for this detection are Windows Security Mitigations logs, specifically focusing on Event IDs 11 (Indicating blocked DLL load attempts) and 12 (Indicating blocked non-Microsoft signed binaries). If successful, such activity poses a significant risk as it may lead to the execution of arbitrary code, privilege escalation, or other malicious activities. Importantly, this detection does NOT confirm that a successful compromise has occurred; it simply indicates a blocked loading attempt.

  ### Investigation Steps

  - **Verify blocked events:** Examine Security Mitigation logs for Event ID 11 and 12 specifically for the processes `MpCmdRun.exe` and `NisSrv.exe`. This confirms if a malicious actor attempted to sideload an unsigned DLL.

  - **Correlate with process activity:** Analyze Sysmon Event ID 1 (Process Creation) for `MpCmdRun.exe` and `NisSrv.exe` around the time of the blocked events. Look for unusual command line arguments or timestamps that don’t align with normal operational patterns.

  - **Identify legitimate uses:** Confirm benign use of these processes by cross-referencing the `ProcessPath` with the organization's operational baseline. Legitimate usage typically includes defined maintenance tasks for Microsoft Defender and should not feature unusual parameters.

  - **Check for known malware signatures:** Cross-reference blocked DLL attempts with threat intelligence databases to identify known malicious signatures associated with DLL sideloading tactics. This confirms high-confidence indicators of compromise.

  - **Review potential evasion techniques:** Investigate whether legitimate software or scripts might trigger this alert. Common examples include sysadmin tools or automated patching scripts that could inadvertently try to invoke unsigned DLLs.

  ### Prioritization

  This alert is assessed as high severity given the potential impact on system integrity and the likelihood of malicious abuse through DLL sideloading. The behavior is indicative of attacks aimed at evading detection by using trusted processes, a tactic seen in numerous exploit cases.

  ### Blind Spots and Assumptions

  Detection may be limited as attackers may use signed DLLs or other obfuscation techniques to bypass the alert. Reliable detection requires appropriate logging configurations for Microsoft Defender and could potentially miss legitimate signed software attempts. Related detection rules should focus on unauthorized code execution via other mechanisms, enhancing overall threat visibility through coverage against lateral movement.

