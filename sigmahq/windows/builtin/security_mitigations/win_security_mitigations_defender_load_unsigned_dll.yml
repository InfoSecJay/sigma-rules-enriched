  ---

  ### Technical Context

  This rule detects attempts to sideload unsigned DLLs via Microsoft Defender's processes, specifically `MpCmdRun.exe` and `NisSrv.exe`. These behaviors typically indicate an adversary's objective to execute malicious code under the guise of legitimate processes, a tactic often used in privilege escalation and defense evasion. The relevant MITRE ATT&CK techniques include **Defense Evasion: Signed Binary Proxy Execution (T1574.001)**.

  The primary telemetry sources for this detection are Windows Security event logs, specifically events with IDs 11 and 12 from the Code Integrity (CI) engine. If malicious, this behavior could lead to the execution of unauthorized code, potentially impacting system integrity and confidentiality. Importantly, this detection does NOT confirm that a successful malicious execution occurred; it merely identifies the attempt to load unsigned components.

  ---

  ### Investigation Steps

  - **Review Event Details:** Examine Windows Security Event ID 11 or 12. Check the process initiating the attempt and the exact paths of the attempted DLLs to ascertain their legitimacy. Paths ending with known malware signatures indicate threats.

  - **Analyze Process Relationships:** Use Sysinternals tools or Windows Task Manager to identify parent-child process relationships around `MpCmdRun.exe` or `NisSrv.exe`. Malicious processes often originate from unusual parent processes.

  - **Verify DLL Signatures:** Collect telemetry from `C:\Windows\System32\` for DLL signatures using PowerShell commands (Get-AuthenticodeSignature) on the DLLs in question. Unsigned or suspiciously signed DLLs may indicate malicious intent.

  - **Identify Legitimate Usage Patterns:** Confirm if `MpCmdRun.exe` or `NisSrv.exe` executed recently for legitimate operations, such as system updates or scans. Check corresponding event timestamps and processes to distinguish between benign and malicious scenarios.

  - **Cross-reference Incident Histories:** Investigate related alerts within the same timeframe; clustering of similar events may point to coordinated attack activity or persistent threats in the environment.

  - **Check for File Creation or Exfiltration:** Validate file system changes or creation events (Windows Event IDs 4663 and 5145) around the time of the alert to rule out potential file exfiltration or manipulation as a result of the attempted loading of unsigned DLLs.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on security-critical systems and the likelihood of being exploited for privilege escalation or other malicious activities. The behavior is commonly weaponized by adversaries for evading detection and executing unauthorized actions within target environments.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include using signed malicious binaries or legitimate software to bypass this alert. The detection relies heavily on proper configuration and availability of Windows Security logs, which must be enabled uniformly across endpoints. Legitimate software updates or configurations may trigger this rule, particularly if they load unsigned DLLs. Related detections include monitoring for unusual process spawning behaviors that may indicate an active sideloading attempt.

