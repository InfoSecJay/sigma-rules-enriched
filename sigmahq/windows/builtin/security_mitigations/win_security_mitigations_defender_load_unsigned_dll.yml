note: |
  ### Technical Context
  This rule detects instances where the Microsoft Defender Code Integrity (CI) engine has blocked its own processes, specifically MpCmdRun.exe and NisSrv.exe, from loading unsigned Dynamic Link Libraries (DLLs). This behavior is indicative of a potential attacker's attempt to sideload arbitrary DLLs, which could enable malicious payload execution or the evasion of security controls. The ability to manipulate defender processes is commonly exploited by threat actors to maintain access, persistently execute malware, or perform other nefarious activities.

  The primary objectives of attackers leveraging this technique include bypassing security mechanisms, enhancing privilege escalation opportunities, and maintaining persistence on compromised systems. The relevant MITRE ATT&CK tactics and techniques connected to this detection include:
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **Defense Evasion** (TA0005)
  - **Signed Binary Proxy Execution** (T1574.001).

  The best sources of evidence for this detection are Windows security and mitigation logs, specifically focusing on the events generated by Code Integrity when it identifies unsigned DLLs being loaded by Microsoft Defender's components.

  ### Investigation Steps
  - **Review Event Logs**: Analyze Windows Event IDs 11 and 12 from the security-mitigations log source to identify instances of blocked DLLs and associated processes.
  - **Identify Suspicious DLLs**: Check for any unsigned DLLs that were being loaded during the same timeframe; maintain a watch for unusual file paths or known malicious signatures.
  - **Examine Process Activity**: Investigate the parent-child relationship of processes related to MpCmdRun and NisSrv; this can reveal any irregularities in execution flows that may imply compromise.
  - **Conduct a Threat Hunting Exercise**: Use threat intelligence to cross-reference any flagged DLLs or processes against known malware hashes or TTPs associated with recent attacks, especially in the context of Cobalt Strike or similar frameworks.

  ### Prioritization
  The severity of this alert is high due to the implications of compromised security mechanisms within an enterprise environment. The likelihood of misuse is considerable, particularly if threat actors are employing techniques to evade detection and ensure successful execution of persistent malware.

  ### Blind Spots and Assumptions
  It is important to note that this detection rule may not capture all attempts to sideload malicious DLLs if attackers utilize custom or modified processes outside the detectable parameters. The detection logic assumes that Microsoft's default behavior for blocking unsigned DLLs is intact and functioning correctly. Additionally, proper logging and configuration of the Windows security and mitigation settings are necessary for the alert to be effective; any misconfiguration may result in missed detections.

