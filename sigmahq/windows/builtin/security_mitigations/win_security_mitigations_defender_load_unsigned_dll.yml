note: |
  ### Technical Context

  This Sigma rule detects instances where Microsoft Defender's Code Integrity (CI) engine blocks the loading of unsigned DLLs by critical processes (MpCmdRun and NisSrv). This behavior is typically exploited by attackers attempting to sideload malicious DLLs, potentially leading to unauthorized execution of code or privilege escalation within the environment. The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1574) with the sub-technique "Sideloading" (T1574.001).

  Primary telemetry sources include Windows Security Event logs, specifically Event ID 11 (for blocked DLLs by the Code Integrity engine) and Event ID 12 (related to blocked actions). If malicious, this indicates an attempt to compromise the integrity of a trusted security process, which could lead to broader system compromise or lateral movement within the network. However, the detection alone does not confirm actual malicious activity; it merely indicates a block event which could be a result of misconfiguration or legitimate software behavior.

  ### Investigation Steps

  - **Review Event IDs for block actions**: Check Security Event ID 11 and 12 in Windows Event Viewer to confirm the DLL was logged as blocked by the Code Integrity engine. Note the ProcessPath and relevant command-line arguments for suspicious patterns.

  - **Identify the DLL attempting to load**: Analyze the blocked DLL's name and source path. Look for indicators that suggest it is commonly associated with known malware or unauthorized software. Legitimate Windows DLLs should be signed; therefore, verify DLL signatures through properties.

  - **Cross-reference processes involved**: Collect details on the MpCmdRun.exe and NisSrv.exe processes, including their process IDs and command-line arguments (Sysmon Event ID 1). Compare against known safe usage for these processes—legitimate executions often include path details highlighting common AV command usage.

  - **Investigate recent configuration or software changes**: Review logs for any recent changes in Group Policies or security software updates that might have inadvertently triggered legitimate processes to load unsigned DLLs (e.g., Event ID 4739 for policy changes).

  - **Collect additional context from host activity**: Examine the timeline of events leading up to the alert to determine if there was any unusual file activity or network connections that may signify pre-attack reconnaissance or lateral movement attempts.

  - **Assess for evasion tactics**: Evaluate if there are signs of persistence mechanisms such as scheduled tasks or modifications to startup items associated with the blocked action, indicating an attempt to evade detection.

  ### Prioritization

  This alert is of high severity due to the criticality of the processes involved and the potential for malicious actors to exploit such mechanisms. The likelihood of malicious abuse is significant, especially as sideloading techniques are commonly weaponized by known adversaries seeking to bypass security measures.

  ### Blind Spots and Assumptions

  Detection may be limited if traffic logs are not reviewed alongside event logs, as attackers may use various evasion techniques, such as modifying legitimate processes. Required configurations for full visibility include enabling detailed logging for Code Integrity events. Legitimate software installations or updates may trigger this alert, so context is critical. A companion detection to consider is monitoring for unusual file modifications or process injections on the same host, which can confirm the presence of potential threats.

