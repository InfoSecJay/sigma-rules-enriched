title: Potential Active Directory Reconnaissance/Enumeration Via LDAP
id: 31d68132-4038-47c7-8f8e-635a39a7c174
status: test
description: Detects potential Active Directory enumeration via LDAP
references:
- https://techcommunity.microsoft.com/t5/microsoft-defender-for-endpoint/hunting-for-reconnaissance-activities-using-ldap-search-filters/ba-p/824726
- https://github.com/PowerShellMafia/PowerSploit/blob/d943001a7defb5e0d1657085a77a0e78609be58f/Recon/PowerView.ps1
- https://github.com/BloodHoundAD/SharpHound3/blob/7d96b991b1887ff50349ce59c80980bc0d95c86a/SharpHound3/LdapBuilder.cs
- https://medium.com/falconforce/falconfriday-detecting-active-directory-data-collection-0xff21-c22d1a57494c
- https://github.com/fox-it/BloodHound.py/blob/d65eb614831cd30f26028ccb072f5e77ca287e0b/bloodhound/ad/domain.py#L427
- https://ipurple.team/2024/07/15/sharphound-detection/
author: Adeem Mawani
date: 2021-06-22
modified: 2025-07-04
tags:
- attack.discovery
- attack.t1069.002
- attack.t1087.002
- attack.t1482
logsource:
  product: windows
  service: ldap
  definition: 'Requirements: Microsoft-Windows-LDAP-Client/Debug ETW logging'
detection:
  generic_search:
    EventID: 30
    SearchFilter|contains:
    - '(groupType:1.2.840.113556.1.4.803:=2147483648)'
    - '(groupType:1.2.840.113556.1.4.803:=2147483656)'
    - '(groupType:1.2.840.113556.1.4.803:=2147483652)'
    - '(groupType:1.2.840.113556.1.4.803:=2147483650)'
    - '(sAMAccountType=805306369)'
    - '(sAMAccountType=805306368)'
    - '(sAMAccountType=536870913)'
    - '(sAMAccountType=536870912)'
    - '(sAMAccountType=268435457)'
    - '(sAMAccountType=268435456)'
    - '(objectCategory=groupPolicyContainer)'
    - '(objectCategory=organizationalUnit)'
            # - '(objectCategory=Computer)' Prone to false positives
    - '(objectCategory=nTDSDSA)'
    - '(objectCategory=server)'
    - '(objectCategory=domain)'
    - '(objectCategory=person)'
    - '(objectCategory=group)'
    - '(objectCategory=user)'
    - '(objectClass=trustedDomain)'
    - '(objectClass=computer)'
    - '(objectClass=server)'
    - '(objectClass=group)'
    - '(objectClass=user)'
    - '(primaryGroupID=521)'
    - '(primaryGroupID=516)'
    - '(primaryGroupID=515)'
    - '(primaryGroupID=512)'
    - 'Domain Admins'
    - 'objectGUID=\*'
    - '(schemaIDGUID=\*)'
    - 'admincount=1'
  distinguished_name_enumeration:
    EventID: 30
    SearchFilter: '(objectclass=\*)'
    DistinguishedName|contains:
    - 'CN=Domain Admins'
    - 'CN=Enterprise Admins'
    - 'CN=Group Policy Creator Owners'
  suspicious_flag:
    EventID: 30
    SearchFilter|contains:
    - '(userAccountControl:1.2.840.113556.1.4.803:=4194304)'
    - '(userAccountControl:1.2.840.113556.1.4.803:=2097152)'
    - '!(userAccountControl:1.2.840.113556.1.4.803:=1048574)'
    - '(userAccountControl:1.2.840.113556.1.4.803:=524288)'
    - '(userAccountControl:1.2.840.113556.1.4.803:=65536)'
    - '(userAccountControl:1.2.840.113556.1.4.803:=8192)'
    - '(userAccountControl:1.2.840.113556.1.4.803:=544)'
    - '!(UserAccountControl:1.2.840.113556.1.4.803:=2)'
    - 'msDS-AllowedToActOnBehalfOfOtherIdentity'
    - 'msDS-AllowedToDelegateTo'
    - 'msDS-GroupManagedServiceAccount'
    - '(accountExpires=9223372036854775807)'
    - '(accountExpires=0)'
    - '(adminCount=1)'
    - 'ms-MCS-AdmPwd'
  narrow_down_filter:
    EventID: 30
    SearchFilter|contains:
    - '(domainSid=*)'
    - '(objectSid=*)'
  condition: (generic_search and not narrow_down_filter) or suspicious_flag or 
    distinguished_name_enumeration
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential Active Directory enumeration activities via LDAP searches that target specific object categories and attributes. The likely attacker objective is to gather information about users, groups, and permissions within the Active Directory environment to facilitate lateral movement or privilege escalation. This behavior aligns with the MITRE ATT&CK tactic of **Discovery**, specifically techniques **T1069.002: LDAP Enumeration** and **T1087.002: Account Discovery**.

  Primary telemetry sources include Windows LDAP client debug logs (EventID 30) collected from the **Microsoft-Windows-LDAP-Client** service. The security impact of malicious enumeration is high, as it enables attackers to map out the directory structure and identify target accounts for subsequent attacks. However, this detection alone does not confirm malicious intent; legitimate administrative activities can trigger similar LDAP queries.

  ### Investigation Steps

  - **Verify the Event ID and Source: ** Check logs for Event ID 30 from the Microsoft-Windows-LDAP-Client to confirm LDAP enumeration activity. Look for anomalies in the **SearchFilter** field to identify suspicious queries.
  - **Review LDAP Search Filters: ** Analyze the SearchFilter values for known patterns that indicate enumeration, such as '(sAMAccountType=805306369)' or group-specific queries like '(CN=Domain Admins)'. Legitimate searches typically involve broader or more generic object queries.
  - **Assess Timeframe and User Context: ** Investigate the user or service account associated with the LDAP queries. Identify if the user has legitimate business reasons for enumeration—such as scheduled audits—or if it appears anomalous based on their access patterns.
  - **Correlate with Other Data Sources:** Cross-reference findings with security logs (e.g., Event ID 4624 for logon events) and network traffic captures, if available, to check for other indicators such as unusual login activities before or after the LDAP query.
  - **Examine for High-Confidence Indicators:** Identify related administrative accounts or trusted users associated with high-privilege groups during enumeration. Look for indications of repeated queries from a non-administrative account that may suggest reconnaissance.
  - **Document Legitimate Use Cases: ** Note expected behaviors such as scheduled tasks or normal user behavior that would result in LDAP queries, as these can aid in differentiating between malicious and benign activities.

  ### Prioritization

  This alert is medium severity due to the sensitivity of the information potentially exposed by unauthorized enumeration. The impact can be significant if valuable credentials or permissions are harvested. While not all enumeration activities are malicious, this behavior is often weaponized by actors in the reconnaissance phase of an attack lifecycle.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the requirement for debug-level logging for the LDAP client, which might not be enabled in all environments. Attackers may employ obfuscation or randomization in their queries to evade detection. Legitimate administrative activities, such as compliance audits or maintenance tasks, can also trigger alerts. Related detections include monitoring for unauthorized access attempts (Event ID 4625) or lateral movement patterns that could reinforce the coverage around this detection approach.

