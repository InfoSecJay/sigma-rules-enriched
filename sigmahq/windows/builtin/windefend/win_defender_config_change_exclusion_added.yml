logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 5007     # The antimalware platform configuration changed.
    NewValue|contains: '\Microsoft\Windows Defender\Exclusions'
  condition: selection
falsepositives:
- Administrator actions
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where exceptions or exclusions have been added to Windows Defender, which is a key component of Microsoft’s security framework for Windows operating systems. By monitoring Event ID 5007, the rule flags configurations indicating that certain files, folders, or processes are being exempted from malware scanning. Attackers may leverage this feature to circumvent detection by security tools, thereby facilitating malicious activities like malware execution, data exfiltration, or system compromise.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (TA0005)** and more specifically the technique **Exclude processes from detection (T1562.001)**, as this rule helps highlight potential attempts to evade detection mechanisms. The primary data source for this detection is the Windows event logs, particularly the logs from Windows Defender (windefend service), which record configuration changes and security alerts.

  ### Investigation Steps
  - **Review Windows Defender Logs**: Examine Event ID 5007 for any patterns or multiple exclusions being set within a short time frame, which may indicate malicious intent rather than legitimate administrative actions.
  - **Correlate with User Activity**: Investigate the user accounts that initiated these exclusion changes. Assess their recent actions and privileges to determine if there are any signs of compromise or anomalies.
  - **Analyze File Integrity**: Check the integrity of the excluded files, folders, or processes. Use file hash checks against known databases to see if any exclusions relate to known malware or unauthorized applications.
  - **Monitor System Behavior**: Actively observe system behavior post-exclusion changes. Look for unusual processes, network connections, or changes in performance that could indicate exploitation of the exclusions set.

  ### Prioritization
  This alert should be treated with medium severity, as while legitimate administrative actions may trigger it, the potential for attackers to misuse this feature warrants careful examination, especially in environments where sensitive data is present.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the reliance on Windows event logs, which can be cleared or tampered with by malicious actors. The logic assumes that all legitimate exclusions will be appropriately documented and that administrators are not frequently engaging in benign exclusion activities. For the alert to function effectively, logging for Event ID 5007 must be enabled and properly configured on all relevant endpoints.

