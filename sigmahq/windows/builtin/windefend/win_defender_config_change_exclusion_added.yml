- Administrator actions
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Defender exclusion list, which is a configuration aimed at bypassing malware scans for specified files, folders, or processes. The likely objective of an attacker is to create paths for undetected malicious activity by excluding their tools or artifacts from the antivirus scans. The detection relates to the MITRE ATT&CK technique "Indicator Removal on Host" (T1486) under the defense-evading tactic.

  The primary telemetry source is Windows Security Event logs, specifically Event ID 5007, which indicates changes to the antimalware platform’s configuration. A successful exclusion setup can have serious security implications, as it may allow malicious processes or files to evade detection. However, this detection does NOT prove that the activity is malicious in isolation, as legitimate administrative actions may trigger the same event.

  ### Investigation Steps

  - **Verify Event ID 5007 details**: Review the event logs for Event ID 5007. Specifically, check the `NewValue` field for any modifications to the exclusion list containing '\Microsoft\Windows Defender\Exclusions'. Examine what entries were added or modified.

  - **Assess user context**: Check the `SubjectUserID` in Event ID 5007. Determine whether it is a known administrator account or a service account. Unexpected or unknown accounts may indicate potential malicious activity.

  - **Correlate with recent activity**: Investigate recent process creation events (Event ID 4688) around the same time as the exclusion change. Look for processes that commonly exploit antivirus exclusions, such as installers or persistence mechanisms.

  - **Review legitimate activity patterns**: Consider the usual behavior of system administrators in your organization. Exclusions added during scheduled maintenance or support activities may be normal. Document these patterns to distinguish them from abnormal behavior.

  - **Identify high-confidence malicious indicators**: Beyond exclusions, look for processes that traditionally should not be in the exclusion list, such as known malware or tools like PowerShell, Command Prompt, or suspicious executables typically used in attacks.

  - **Evaluate asset criticality**: If the alert involves servers or endpoints with sensitive data or critical applications, prioritize them higher due to the increased risk associated with potential malicious exclusion configurations.

  ### Prioritization

  This alert holds medium severity due to the potential for attackers to utilize exclusions to undermine antivirus protections. If identified on critical systems, the risk escalates significantly, especially if this behavior correlates with known exploitation patterns, making it a common tactic for stealthy attacks.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative actions that add exclusions for valid software, such as security tools. A required log source for reliable detection is the comprehensive logging of Windows Security Events, which must be enabled. An associated detection that strengthens coverage is monitoring for newly-created scheduled tasks (Event ID 4698) that could use excluded executions to maintain persistence without detection.

