  ---

  ### Technical Context

  This rule detects modifications to Windows Defender exclusions, specifically when a new exclusion is added. The likely attacker objective in this scenario is to evade detection by antivirus solutions, thereby allowing malicious files or processes to operate without being flagged. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1562.001). The primary telemetry source is Windows Event Log with a focus on Event ID 5007 indicating changes in the antimalware platform configuration. If malicious, this behavior could significantly weaken system defenses, allowing threat actors to execute code without detection. Importantly, this detection does NOT confirm malicious activity on its own and may include legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Review Event_ID 5007 details:** Check for Event ID 5007 in the Security logs. Look for any entries where `NewValue` contains `\Microsoft\Windows Defender\Exclusions`. Track the user associated with the change to assess if it's administrative or suspicious.

  - **Identify the user responsible:** Analyze the event logs for any account anomalies, especially if changes occur outside regular business hours or are initiated by non-administrative users. Look for synergies with user ID fields in Event ID 5007.

  - **Cross-reference with approved exclusions:** Consult internal documentation for known and approved exclusions. Compare these to the new entries to determine if the exclusions appear legitimate or if they diverge from organizational policies.

  - **Review system role and asset criticality:** Identify the affected host’s role (e.g., server vs. workstation) and asset criticality. Exclusions on critical systems (e.g., domain controllers) should be prioritized for deeper investigation.

  - **Check for additional suspicious behavior:** Look for correlated logs, such as process creation logs (Event ID 4688) or file modification logs, that indicate changes or executions of files in the excluded paths. Malicious changes would show new, unexpected processes being spawned with paths related to exclusions.

  ---

  ### Prioritization

  This alert carries medium severity due to its potential impact on systems where malware can operate undetected. The likelihood of malicious abuse is moderate, as altering Defender exclusions is a common tactic among threat actors seeking to bypass security mechanisms. While this behavior can indicate sabotage, it is also used for legitimate administrative management, making context essential for accurate assessment.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for changes to Defender settings isn’t properly configured, or if older logs have been purged. Evasion techniques could include employing legitimate administrative accounts to make changes or using timed scripts for exclusion setup. Legitimate activities that may trigger this alert include routine maintenance or troubleshooting by IT staff. A related detection could involve monitoring for unusual process executions (Event ID 4688) linked to excluded directories, providing additional context for assessment.

