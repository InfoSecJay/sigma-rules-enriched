  ---

  ### Technical Context

  This rule detects the restoration of files from Microsoft Defender's quarantine, specifically indicating that potentially malicious files have been reverted back to a usable state. The likely objective of an attacker restoring such files could be to re-establish access to a compromised resource or retain persistence on a target system. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (T1562) and the sub-technique "Restoration of Files" (T1562.001).

  The primary telemetry source for this detection is Windows Event Log with a focus on Event ID 1009, which records actions taken by the Windows Defender service. If successful restoration of malicious files occurs, the security impact could include re-establishing a foothold within the environment, potential data exfiltration, or lateral movement. However, this detection alone does not confirm malicious intent, as legitimate administrators can also restore files from quarantine.

  ---

  ### Investigation Steps

  - **Check Event Logs for Restoration Activity: ** Review Event ID 1009 in the Security log to identify if unauthorized restoration of files coincides with the alert timeframe.

  - **Establish User Context: ** Cross-reference the event with the user who initiated the restoration. Analyze additional logins from that user and determine if their behavior aligns with legitimate administrative activity or appears suspicious.

  - **Analyze File Details: ** Investigate the file path, hash, and attributes of the restored file. Malicious indicators may include unusual file locations or known malicious file hashes.

  - **Correlate with Recent Alerts: ** Review for any prior alerts related to malicious content detected by Windows Defender on the system. Multiple detections could signify an ongoing attack.

  - **Validate Legitimate Restoration: ** Compare the events against organizational policies. Identify if the restored files are part of an approved process, such as re-evaluating a falsely flagged application.

  - **Assess Impact on Critical Systems: ** If the host device is critical (e.g., a server), escalate the investigation. Critical hosts warrant thorough examination to prevent potential escalation of privileges or data compromise.

  ---

  ### Prioritization

  The alert should be treated as high severity due to the potential for misuse on critical systems where file restorations could indicate a security breach. The likelihood of malicious actors leveraging this functionality to regain control is significant, given recent trends in post-compromise behavior.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of domain admin rights to restore files without raising alerts. Log sources for this detection must be reliably configured, ensuring full visibility into Event ID 1009. Legitimate activities might occur in the form of regular IT procedures or application updates. A related detection that could enhance coverage is monitoring for modifications to Windows Defender settings (e.g., disabling real-time protection), which might indicate tampering or evasion techniques in play.

