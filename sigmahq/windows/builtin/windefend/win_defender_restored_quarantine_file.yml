  ---

  ### Technical Context

  This Sigma rule detects the restoration of files from Microsoft Defender quarantine, specifically focusing on Event ID 1009. The behavior indicates an attempt by an attacker to reintroduce malicious files that have previously been detected and quarantined, with the objective typically centered around regaining access to a compromised system or deploying further malicious payloads. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1562)**, specifically the technique **T1562.001** (Disable or Modify Tools).

  Primary telemetry comes from Windows Defender logs, specifically security event logs related to the restoration action. The security impact of such a restoration can be significant, as it may allow previously blocked malicious files to execute. It is important to note that this detection alone does NOT confirm that the restored file is malicious—it must be analyzed in conjunction with other indicators of compromise.

  ---

  ### Investigation Steps

  - **Review the Event ID 1009 log entry:** Examine Windows Security Event logs for Event ID 1009 to determine what file was restored, noting the timestamp and user context. Use fields such as `FileName`, `FilePath`, `Action`, and `User`.

  - **Verify file reputation:** Use file hashing (e.g., SHA256) for the restored file against threat intelligence feeds or services such as VirusTotal to determine if it is known to be malicious.

  - **Check user activity:** Confirm whether the user restoring the file is a legitimate administrator or if this action was taken by a non-privileged account. Cross-reference `User` and `Process` fields in the Event log with authorized personnel.

  - **Determine historical quarantine context:** Look into previous defensive actions recorded in the Windows Defender logs to establish if this file was indeed malicious or flagged on prior scans. This includes examining previous Event ID 1009 and related quarantine logs.

  - **Identify other suspicious activities:** Review the timeframe around the restoration for any other related security events, such as process creation (Event ID 4688) or unusual outbound connections in Firewall logs, indicating potential exploitation.

  - **Establish legitimate behavior:** Understand usual policies and practices regarding the restoration of files within your organization. Legitimate restoration typically involves documented justifications in ticketing systems for file recovery.

  ---

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for malicious reintroduction of previously contained threats. The likelihood of malicious abuse is considerable, especially if unusual user accounts or processes are involved. Restoration of quarantined files is often a precursor to deeper compromises and is commonly weaponized in certain attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detection may miss attempts to bypass this alert through scheduled tasks or scripts that restore files without triggering Defender logs. Proper configuration of Windows Defender logs is essential for reliable detection of these events. Legitimate administrative activities may inadvertently trigger this alert when files must be restored for business continuity. Companion detections, such as monitoring for abnormal process creation or network activity post-restoration, can significantly enhance the overall visibility and security posture.

