  ### Technical Context

  This Sigma rule detects the disabling of the Windows Defender virus scanning feature, an action often undertaken by attackers to facilitate the persistence of malicious software undetected. The likely objective is to weaken endpoint security defenses, allowing for lateral movement, data exfiltration, or installation of additional malware. This behavior correlates with the MITRE ATT&CK technique T1562.001 - "Disable or Modify Tools."

  The primary telemetry source is Windows Event Logs, specifically Event ID 5012, which reports changes in the configuration of Windows Defender. A security impact is substantial; if an attacker manages to disable this feature, it significantly increases the risk of successful compromise and undetected malicious activity. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative actions might disable virus scanning for troubleshooting or maintenance.

  ---

  ### Investigation Steps

  - **Check for Event ID 5012 in Security Logs:** Review Windows Event Logs for Event ID 5012 to confirm that the virus scanning feature was disabled. Note the user account responsible for this action; if it is a privileged account, escalate the investigation.

  - **Identify the Context of the Change:** Investigate the timing and frequency of Event ID 5012 occurrences. If the disable action coincides with other suspicious activities (e.g., unauthorized access), it may indicate malicious intent.

  - **Validate Legitimate Use Cases:** Compare against normal operational patterns for your organization. Administrative users may periodically disable Defender for testing. If there are no documented change requests or maintenance plans, this could indicate malicious activity.

  - **Monitor for Subsequent Malicious Indicators:** Look for subsequent event logs that indicate the presence of malware or other suspicious activities following the disable event. Check for indicators such as unusual process executions (Event ID 4688) or changes to critical file locations.

  - **Assess Host Role and Asset Rank:** Consider the asset's criticality if the disablement event comes from servers or endpoints managing sensitive data. Prioritize investigation on systems that can cause the most impact if compromised.

  - **Cross-reference with Related Detections:** Investigate alerts related to abnormal behavior post-disablement. Any logging failures or modifications in user privilege levels may corroborate a malicious campaign.

  ---

  ### Prioritization

  This alert should be prioritized as high due to the significant implications of disabling a critical security feature. An affected system's security posture is severely compromised, and this behavior can be a precursor to widespread exploitation, as disabling endpoint protection is a common tactic among adversaries seeking to deploy undetected malware.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by event log configurations; ensure that logging for Windows Defender is properly set to capture Event ID 5012 consistently. Legitimate activities like routine maintenance by IT administrators can also trigger this alert; therefore, context is crucial. As a related detection, consider tracking changes to User Account Control settings or Group Policy adjustments, which could correlate with attempts to disable security features, enhancing overall detection coverage.

