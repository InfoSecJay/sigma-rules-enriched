note: |
  ### Technical Context

  This rule detects the disabling of the Windows Defender virus scanning feature, which can compromise endpoint security by allowing malicious software to operate undetected. An adversary may disable this feature to evade detection, thereby facilitating further malicious activities such as data exfiltration, lateral movement, or persistence tactics. The relevant MITRE ATT&CK tactic is **Defense Evasion** with technique **T1562.001** (Disable or Modify Tools).

  The primary telemetry sources for this detection include Windows Event Logs, specifically targeting **Event ID 5012**, which indicates that virus scanning has been disabled. If malicious, this action significantly increases the risk of malware infections and sustained unauthorized access. However, this detection alone does not confirm that malicious activity has occurred—it only indicates a security tool has been disabled, which could be due to legitimate administrative actions.

  ### Investigation Steps

  - **Verify the event log:** Review Windows Security Event Log for **Event ID 5012** in the `Security` log to confirm the disabling action took place, along with timestamps and user accounts involved.

  - **Identify the user context:** Check the **User** field associated with Event ID 5012 to determine if the action was performed by a legitimate admin account or a potentially compromised user account.

  - **Check for recent policy changes:** Investigate Windows Group Policy settings for any recent changes that may have allowed the virus scanning feature to be disabled. Look for **GPO Event ID 4016** related to policy processing.

  - **Review related alerts:** Identify if there are other security alerts or events in proximity to this action, such as unusual logins or process creations (e.g., **Event ID 4688** for process creation) that may indicate malicious activity.

  - **Evaluate legitimate activity:** Understand the normal operational procedures for your environment concerning Windows Defender settings. If admins routinely disable scanning for legitimate reasons (e.g., software testing), document this context to differentiate benign from malicious threats.

  - **Search for evidence of exploitation:** Look for signs of malicious behavior post-disablement. Review logs for process execution of known malware or suspicious applications, using indicators of compromise (IOCs) associated with recent malware campaigns targeting disabled antivirus solutions.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on the security posture of the enterprise. The disabling of Windows Defender facilitates a higher likelihood of malicious abuse, particularly as this technique is commonly weaponized by adversaries to bypass detection systems.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations for Windows Defender are insufficient, particularly if audit logging is not enabled for relevant actions. Legitimate administrative tasks could trigger this alert, such as updates or troubleshooting activities. A companion detection to consider is monitoring for reinstitution of the antivirus function (e.g., re-enabling of Windows Defender), which could indicate remediation efforts following a potential compromise.

