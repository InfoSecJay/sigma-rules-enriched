note: |
  ### Technical Context

  This rule detects the disabling of the Windows Defender virus scanning feature, which is a critical component of endpoint security on Windows systems. An attacker may aim to disable this feature to bypass detection mechanisms, exposing the system to malware or other malicious activities. This behavior aligns with the MITRE ATT&CK technique for defense evasion (T1562.001 - Disable or Modify Tools). The primary telemetry source is Windows Security Event logs, specifically Event ID 5012, which logs changes to Windows Defender settings.

  If an attacker successfully disables this feature, the impact could be significant, leading to a higher risk of malware execution and potential data breaches. Importantly, this detection does NOT confirm that the disabling was malicious; legitimate administrative actions or misconfigurations may also result in the same logging event.

  ### Investigation Steps

  - **Review Event ID 5012:** Check for Event ID 5012 in the Security Event log, which indicates that virus scanning has been disabled. Look for entries with the 'UserID' field to identify who made the change. Legitimate entries often come from administrative accounts with defined roles.

  - **Assess User Account Activity:** Investigate the user account that triggered Event ID 5012. Query recent events surrounding this user from the Security Event log to identify unusual logon times or patterns. Anomalies, such as access from foreign IP ranges, increase suspicion.

  - **Cross-reference with System Performance Logs:** Check if there are any recent changes in system performance metrics or other security-related logs indicating abnormal behavior following the time of the configuration change (e.g., increase in CPU or memory usage, Event ID 4688 for process creation).

  - **Confirm Host Role/Reputation:** Identify whether the affected system is a critical server or workstation with sensitive data. Cross-reference the host name with asset inventory to assess potential risk based on its role in the organization.

  - **Investigate for Additional Malicious Indicators:** Use endpoint detection and response (EDR) tools to search for recently executed processes or spawned commands (Event ID 4688) following the disabling event. Focus on scripts or tools commonly associated with malware deployment.

  - **Documenting Expected Behavior:** Record what expected legitimate administrative actions should include, such as scheduled updates for software or monitored changes, typically performed within maintenance windows. Compare these against the event's timestamp to identify discrepancies.

  ### Prioritization

  This alert has high severity due to the potential impact on endpoint security. The likelihood of malicious abuse is significant, particularly in environments targeted by advanced persistent threats (APTs) that often disable security features during their operations. Disabling antivirus mechanisms is commonly weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  This detection may be limited by the possibility of false positives from legitimate administrative actions or automated scripts. It requires that Windows Security logs are retained and accessible for analysis. Additionally, benefits from careful change management procedures could result in legitimate disablement of the virus scanning feature. Consider related detections, such as rule sets for unauthorized changes to system settings or configurations for enhanced coverage against possible exploitation scenarios.

