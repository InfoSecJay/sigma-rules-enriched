  ### Technical Context

  This Sigma rule detects the specific action of disabling the Windows Defender virus scanning feature, which is logged as Event ID 5012. Adversaries often aim to disable antivirus products to facilitate undetected malware execution or data exfiltration, thereby enhancing their operational capabilities. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1211) and technique "Modification of Control" (T1562.001). The primary telemetry source is Windows Security Event logs where these specific events are recorded. If exploited maliciously, this could lead to significant system compromise or data breaches. However, this detection does NOT confirm the presence of malware on its own; it merely indicates an altered security posture.

  ### Investigation Steps

  - **Verify Event ID 5012 presence:** Check Windows Security Event logs for Event ID 5012, which indicates that virus scanning has been disabled. Note the timestamp and user context for further investigation.

  - **Review recent security logs:** Look into historical logs for previous Event IDs (e.g., 5025) related to Windows Defender to understand if this is an anomaly or part of a recent maintenance activity (such as updates or management changes from legitimate admin accounts).

  - **Identify user and system context:** Determine which user account executed the disable action. Valid administrator accounts may indicate benign changes, while unusual accounts, especially those with non-administrative roles, may signify potential malicious intent.

  - **Assess legitimate use cases:** Check for documentation or previous operational requirements that justify the disabling of Windows Defender, such as certain legacy applications that may not tolerate antivirus software.

  - **Follow up with threat intelligence:** Cross-reference the detected activity with threat intelligence feeds or logs for known malicious patterns associated with disabling security features to establish any correlation with identified threats.

  - **Monitor subsequent behavior:** After disabling the virus scanning feature, track subsequent application and process behavior on the affected system for indications of suspicious activities, such as unusual outbound connections or process spawning atypical for the environment.

  ### Prioritization

  This alert is classified as high severity due to the significant impact of compromised endpoints and the likelihood of adversary attempts to disable security features for malicious purposes. Disabling antivirus protections is a common tactic employed by various malware strains and adversarial techniques.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as attackers using administrative privileges to disable defenses without triggering alerts. Reliable detection requires enabling Windows Security logging and could be impacted by legitimate administrative activities, like system updates or maintenance. A related detection to consider is monitoring for abnormal process executions following the disabling event, which can provide additional context for potentially malicious intent.

