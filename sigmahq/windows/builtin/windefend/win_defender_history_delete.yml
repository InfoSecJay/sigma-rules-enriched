note: |
  ### Technical Context

  This rule detects the deletion of Windows Defender's malware detection history, indicated by Event ID 1013. The likely attacker objective is to erase evidence of prior malware infections or prevent tracking of malicious activities, aiding in maintaining persistence and covertness. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the technique of **Indicator Removal on Host** (T1070).

  The primary telemetry source for this detection is Windows Defender logs, specifically capturing antimalware events related to the deletion of detection history. If malicious, this behavior poses a significant security risk as it obscures the detection of previously identified threats. Importantly, this detection does NOT confirm that a system is compromised on its own, nor does it indicate what data may have been deleted.

  ### Investigation Steps

  - **Review Event Id 1013 logs:** Search for Event ID 1013 in the Windows Defender event logs. This identifies the deletion of threat history. Log path: `Event Viewer > Applications and Services Logs > Microsoft > Windows > Windows Defender > Operational`.

  - **Determine the context of deletion:** Check the timestamps of the deletion event against other significant logs. Look for unusual patterns or other events around the same timeframe such as suspicious process creations (Event ID 4688).

  - **Check related antivirus actions:** Cross-reference with other security logs (e.g., Windows Security logs Event ID 4624) to determine if there were recent malware detections before the history was deleted, indicating possible malicious intent.

  - **Identify legitimate history deletions:** Investigate for regular maintenance activities that typically prompt history deletions. These may relate to organization-wide cleaning policies or updates in antivirus definitions.

  - **Examine system roles and criticality:** For systems classified as critical infrastructure, the context of the deletion is particularly important. Alerts from these assets should be triaged with higher urgency to assess the risk of potential exploitation.

  - **Correlate findings with user actions:** Identify user accounts that have administrative privileges or access to Windows Defender settings. Ensure there is a benign justification for their actions during the alert timeframe.

  ### Prioritization

  This alert should be treated with medium to high severity, especially if triggered on critical systems. The likelihood of malicious abuse is significant, given attackers often delete evidence post-infection to evade detection. Although this behavior can be observed in legitimate maintenance scenarios, it is often weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate antivirus maintenance routines or user behaviors that may inadvertently trigger this alert. Ensure that logs for Windows Defender are consistently enabled and configured properly for accurate detection. A related detection such as suspicious activity around scheduled task creation or modification (e.g., Event ID 4698) can strengthen overall coverage for maintaining visibility on potential adversarial activities.

