  ### Technical Context

  This Sigma rule detects the deletion of Windows Defender malware detection history, specifically through Event ID 1013, indicating that the antimalware platform has removed the history of detected malware and potentially unwanted software. Attackers may aim to erase evidence of their activities, facilitating subsequent malicious actions without detection. The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1203), and the technique is **Clear Windows Event Logs** (T1070.001). The primary telemetry source is Windows Event Logs, particularly focusing on Microsoft Defender-related entries.

  If a malicious actor deletes this history, it can prevent security teams from identifying previous malware infections, potentially allowing threats to remain and persist undetected. However, the detection does NOT confirm malicious intent on its own, as legitimate activities or administrative actions may also result in history deletion.

  ### Investigation Steps

  - **Review Event ID 1013:** Check for Event ID 1013 in Windows Security Logs (Event Log > Application and Services Logs > Microsoft > Windows > Windows Defender > Operational). Note the timestamp and user context of the deletion.

  - **Identify user activity:** Investigate the account associated with the deletion. If a non-administrative account performed this action unexpectedly, flag this as a potential indicator of compromise.

  - **Examine recent malware events:** Review previous events related to malware detections (Event ID 1116) within a suitable time frame prior to deletion to ascertain if legitimate detections existed, indicating a potential cover-up by an adversary.

  - **Validate benign administrative actions:** Determine if the history deletion aligns with organizational policies or typical administrative tasks, as legitimate system maintenance may also result in such alerts.

  - **Cross-reference deletion against other logs:** Check for any concurrent suspicious activity in other logs, such as unexpected process termination in security logs (Event ID 4689) or significant changes in configuration (Event ID 5145), that could correlate with the history deletion.

  ### Prioritization

  This alert should be treated with moderate severity in an enterprise context. The impact hinges on the affected system's role; if it is a critical endpoint or server, the likelihood of malicious abuse increases. Although history deletion is not uncommon for benign reasons, it can also indicate an attempt by an attacker to erase traces of their activity, especially if linked to suspicious behavior.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion techniques such as using administrative privileges to delete logs without triggering alerts. Reliable detection requires proper configuration of Windows Event Logs; if logging is disabled or incorrectly configured, detection will fail. Legitimate activities, such as system cleanups or administrative maintenance, may trigger this alert. A companion detection that strengthens coverage could be monitoring for anomalous user behavior via User Behavior Analytics (UBA) solutions that assess account activity surrounding the log deletions.

