title: Microsoft Defender Tamper Protection Trigger
id: 49e5bc24-8b86-49f1-b743-535f332c2856
status: stable
description: Detects blocked attempts to change any of Defender's settings such as
  "Real Time Monitoring" and "Behavior Monitoring"
references:
- https://bhabeshraj.com/post/tampering-with-microsoft-defenders-tamper-protection
- https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus?view=o365-worldwide
author: Bhabesh Raj, Nasreddine Bencherchali
date: 2021-07-05
modified: 2022-12-06
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 5013     # Tamper protection blocked a change to Microsoft Defender Antivirus. If Tamper protection is enabled then, any attempt to change any of Defender's settings is blocked. Event ID 5013 is generated and states which setting change was blocked.
    Value|endswith:
    - '\Windows Defender\DisableAntiSpyware'
    - '\Windows Defender\DisableAntiVirus'
    - '\Windows Defender\Scan\DisableArchiveScanning'
    - '\Windows Defender\Scan\DisableScanningNetworkFiles'
    - '\Real-Time Protection\DisableRealtimeMonitoring'
    - '\Real-Time Protection\DisableBehaviorMonitoring'
    - '\Real-Time Protection\DisableIOAVProtection'
    - '\Real-Time Protection\DisableScriptScanning'
  condition: selection
falsepositives:
- Administrator might try to disable defender features during testing (must be investigated)
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to alter settings in Microsoft Defender Antivirus that are blocked by Tamper Protection. Tamper Protection is a security feature designed to prevent unauthorized modifications to important security configurations, thus safeguarding the integrity of the endpoint protection mechanisms. The rule specifically monitors for Event ID 5013, which records instances when access to critical settings is denied, indicating a potential evasion tactic employed by attackers.

  In a threat scenario, an attacker may seek to disable or modify Defender settings to establish a foothold or install malware without detection. The blocked modification attempts could indicate either an advanced persistent threat (APT) attempting to evade detection or a less sophisticated malware trying to disable security defenses. The relevant MITRE ATT&CK techniques include **Defense Evasion** (TA0005) and specifically **Indicator Removal on Host** (T1562.001), as the attacker may be trying to eliminate indicators of their presence.

  The primary data sources for this detection will be Windows security event logs, specifically focusing on logs from Microsoft Defender that capture tampering attempts. Monitoring Event ID 5013 allows security analysts to gain visibility into these potentially malicious activities.

  ### Investigation Steps
  - **Review the Incident Context**: Gather details about the event that triggered the rule, including timestamps, affected systems, and user context, to understand the scope of the incident.
  - **Analyze Windows Event Logs**: Examine the Windows security logs, specifically filtering for Event ID 5013, to identify which specific settings were attempted to be changed and by which user or process.
  - **Correlate with Other Security Events**: Look for related security events that may indicate malicious activity, such as unusual process creation events or network connections made around the same timestamp.
  - **Check for Administrator Activity**: Determine if the changes were attempted by legitimate users, particularly administrators performing testing or maintenance, to rule out false positives.

  ### Prioritization
  Given that successful tampering with antivirus settings can lead to significant security breaches and establishment of persistent threats, this alert is considered high priority within an enterprise environment. The likelihood of an attacker exploiting disabled security defenses warrants immediate investigation.

  ### Blind Spots and Assumptions
  Potential detection gaps include scenarios where Tamper Protection may be disabled altogether, thereby allowing settings to be altered without generating Event ID 5013. The detection logic assumes that Tamper Protection is enabled and functioning correctly on monitored endpoints. Additionally, continuous monitoring of relevant Windows logs must be ensured for effective alerting, including proper configuration of Microsoft Defender logs for receiving critical events related to tampering attempts.

