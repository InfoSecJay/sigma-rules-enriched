detection:
  selection:
    EventID: 5013     # Tamper protection blocked a change to Microsoft Defender Antivirus. If Tamper protection is enabled then, any attempt to change any of Defender's settings is blocked. Event ID 5013 is generated and states which setting change was blocked.
    Value|endswith:
    - '\Windows Defender\DisableAntiSpyware'
    - '\Windows Defender\DisableAntiVirus'
    - '\Windows Defender\Scan\DisableArchiveScanning'
    - '\Windows Defender\Scan\DisableScanningNetworkFiles'
    - '\Real-Time Protection\DisableRealtimeMonitoring'
    - '\Real-Time Protection\DisableBehaviorMonitoring'
    - '\Real-Time Protection\DisableIOAVProtection'
    - '\Real-Time Protection\DisableScriptScanning'
  condition: selection
falsepositives:
- Administrator might try to disable defender features during testing (must be 
  investigated)
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable various settings of Microsoft Defender Antivirus via tamper protection, specifically focusing on changes to real-time monitoring and behavior monitoring features. The likely objective of an attacker is to disable these protective measures to facilitate additional malicious activity such as malware installation or lateral movement within the network undetected. This behavior aligns with the MITRE ATT&CK tactic for Defense Evasion (T1562) and specifically targets technique T1685: Tamper Protection.

  The primary telemetry source comes from Windows Event Log, specifically Event ID 5013, which indicates that tampering with Defender has been blocked. A successful exploit could significantly impact the security posture of the enterprise by leaving systems vulnerable to threats. This detection alone does not confirm that a malicious actor is present; it indicates only that a change was attempted and blocked.

  ### Investigation Steps

  - **Review Event ID 5013 logs**: Check Windows Security logs for Event ID 5013 to confirm which Defender settings were targeted. Look for values like `DisableRealTimeMonitoring` or `DisableBehaviorMonitoring` showing intent to modify protection settings.

  - **Identify legitimate administrative actions**: Investigate accounts that may have legitimate reasons for attempting to change Defender settings, such as system administrators performing maintenance with appropriate credentials. Look for logs indicating administrative sessions and compare timestamps.

  - **Evaluate account behavior**: Correlate the user account activity against normal baseline behavior. Look for previously known benign activities, such as software updates or feature enablement, in Windows Event ID logs (e.g., 4688 for process creation) for users typically engaged in administrative duties.

  - **Determine potential malicious indicators**: Analyze the logs for accounts not typically associated with administrative access attempting to access or modify Defender settings. High-risk indicators may include attempts from service accounts or non-administrator accounts to block security features.

  - **Check the execution of security processes**: Validate if legitimate processes like `MsMpEng.exe` (Microsoft Defender Antivirus) are running without abnormal terminations. Refer to Event ID 4688 for process creation and examine fields for arguments indicative of tampering attempts.

  ### Prioritization

  This alert is high-severity due to the critical role of Defender Antivirus in an enterprise environment. The likelihood of malicious usage is significant, especially as many adversary techniques aim to bypass security controls. The attempt to modify or disable these defenses is commonly associated with established attack methodologies.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for legitimate administrative activities to trigger the alert, such as updates or maintenance operations that may involve changing security settings. Additionally, if tamper protection logs are not enabled on endpoints, detection may fail altogether. The detection can be strengthened by monitoring related indicators such as suspicious process execution from service accounts (cross-reference with other defense evasion tactics).

