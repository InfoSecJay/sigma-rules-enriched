detection:
  selection:
    EventID: 5013     # Tamper protection blocked a change to Microsoft Defender Antivirus. If Tamper protection is enabled then, any attempt to change any of Defender's settings is blocked. Event ID 5013 is generated and states which setting change was blocked.
    Value|endswith:
    - '\Windows Defender\DisableAntiSpyware'
    - '\Windows Defender\DisableAntiVirus'
    - '\Windows Defender\Scan\DisableArchiveScanning'
    - '\Windows Defender\Scan\DisableScanningNetworkFiles'
    - '\Real-Time Protection\DisableRealtimeMonitoring'
    - '\Real-Time Protection\DisableBehaviorMonitoring'
    - '\Real-Time Protection\DisableIOAVProtection'
    - '\Real-Time Protection\DisableScriptScanning'
  condition: selection
falsepositives:
- Administrator might try to disable defender features during testing (must be 
  investigated)
level: high
note: |
  ### Technical Context

  This rule detects attempts to change Microsoft Defender Antivirus settings that are blocked by Tamper Protection. The behavior indicates potential malicious activity, where an adversary may try to disable key protective features, such as real-time monitoring or behavior monitoring, to evade detection and maintain persistence. This aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  Telemetry is primarily sourced from Windows Defender logs, specifically Event ID 5013, which will indicate if a setting change was attempted and subsequently blocked. If an attacker succeeds in disabling defenses, it could significantly increase the risk of malware execution or lateral movement within the network. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrators may also trigger this alert when attempting to modify settings during troubleshooting or maintenance.

  ### Investigation Steps

  - **Review the specific alert details:** Check Event ID 5013 logs in the Windows Defender security logs. Look for logs indicating settings changes related to real-time monitoring and behavior monitoring. The event details will show which particular setting was blocked.

  - **Analyze user identities and roles:** Identify the user account that triggered the blocked change. Compare it against known administrative accounts and ensure it matches expected roles within the organization. Legitimate administrator attempts will typically originate from expected administrative accounts.

  - **Inspect for companion indicators of compromise:** Investigate the system for additional suspicious activities around the same timestamp. Look for recent installation or execution of unapproved software, which may include items listed in Event ID 4688 (Process Creation).

  - **Determine recent configuration changes:** Review the Windows Security settings and Windows Event logs (Event ID 4647 for logoff events) to see if any legitimate maintenance or configuration changes align with the timing of the blocked action.

  - **Check concurrent alerts or patterns:** Look for similar alerts across multiple hosts which may signal coordinated attempts to disable defenses. Alert aggregation in the SIEM may reveal a broader trend indicating potential malicious activity.

  ### Prioritization

  This alert is of high severity due to the critical role Microsoft Defender plays in protecting endpoints within the enterprise. The likelihood of malicious abuse is significant, as attackers commonly attempt to disable security features to facilitate further exploitation. Given that this behavior is strategically weaponized in various attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection effectiveness may be reduced if logs are not retained long enough or if configurations for Windows Defender logging are not properly set. Legitimate administrative activities, such as troubleshooting automated defenses or performing system updates, may trigger this alert. A related detection that strengthens coverage includes monitoring for unusual process executions (Event ID 4688) in conjunction with blocked changes, which can help identify potential threats.

