level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects failures and restarts of Windows Defender Real-Time Protection features via specific Windows Event IDs (3002 and 3007). The attacker objective may include evading detection by disabling essential security features, making it easier to execute malware or perform lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique "Application Layer Protocol: T1562.001."

  The primary telemetry sources are Windows Event Logs focusing on Windows Defender operations. The presence of these errors could point to a compromised system where security measures are intentionally disrupted. Notably, this alert does NOT confirm malicious activity on its own, as legitimate system crashes or manual administrative actions may produce similar event logs.

  ---

  ### Investigation Steps

  - **Check Event IDs:** Review Windows Security Event Log for Event ID 3002 and 3007. Look for patterns indicating repeated failures or restarts, which are more suspicious if they coincide with other unusual activity (e.g., failed logins or abnormal system performance).

  - **Validate System Health:** Examine additional telemetry (Windows Event ID 1000 and 1001) to find out if there were applications or system processes that crashed around the same time as the Defender events. A crash without any prior context could be a strong malicious indicator.

  - **Review Updates Status:** Inspect the device configuration to ensure it's up to date with Windows updates. Use PowerShell command `Get-WindowsUpdateLog` to verify if missing updates contribute to application failures.

  - **Identify Legitimate User Actions:** Confirm if there have been any recent legitimate administrative changes to security settings or updates by reviewing Windows Event IDs related to administrative actions (e.g., Event ID 4672 for special logon).

  - **Cross-reference with Network Traffic:** Analyze any related network activities that occurred around the same timeframe using network monitoring tools (e.g., packet captures or SIEM logs) to identify if suspicious outbound connections were initiated shortly after the Defender errors.

  - **Assess Endpoint Criticality:** Determine if the affected endpoint holds critical roles (e.g., domain controllers, file servers) that would heighten the impact of a potential compromise, demanding immediate escalation.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on security posture resulting from Windows Defender failures. Given the sophistication of modern threats, a disabled or malfunctioning security feature can amplify the risk of successful exploitation, making it a viable target for adversaries. This behavior can be weaponized, especially in targeted attacks focused on evading detection mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection can be bypassed by attackers who utilize legitimate administrative access to disable Defender features. Environments with inadequate logging configurations might miss relevant events; ensuring all Windows security logs are collected and retained is essential. Additionally, benign scenarios such as misconfigured updates or user troubleshooting actions could trigger this alert. A companion detection for improving coverage includes monitoring for abnormal process activities post-Defender failure through Sysmon's Event ID 1 for process creation.

