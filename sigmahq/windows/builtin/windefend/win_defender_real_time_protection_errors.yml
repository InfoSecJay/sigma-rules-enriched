logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID:
    - 3002         # Real-Time Protection feature has encountered an error and failed
    - 3007         # Real-time Protection feature has restarted
  filter_optional_network_inspection:
    Feature_Name: '%%886'     # Network Inspection System
    Reason:
    - '%%892'         # The system is missing updates that are required for running Network Inspection System.  Install the required updates and restart the device.
    - '%%858'         # Antimalware security intelligence has stopped functioning for an unknown reason. In some instances, restarting the service may resolve the problem.
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some crashes can occur sometimes and the event doesn't provide enough 
  information to tune out these cases. Manual exception is required
level: medium
note: |
  ### Technical Context

  This rule detects issues specifically related to Windows Defender Real-Time Protection, highlighting instances when it encounters errors and fails (Event ID 3002) or restarts (Event ID 3007). The potential attacker objective may include disabling or impairing endpoint protection to enable lateral movement or malware deployment. This aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1685 (Defensive Impairment).

  The primary telemetry source is Windows Event Logs, specifically related to Windows Defender operations. The security impact of malicious activity could lead to a compromised endpoint, putting sensitive data at risk. Importantly, this detection does NOT confirm malicious intent or activity on its own, as benign system issues can trigger these alerts.

  ### Investigation Steps

  - **Check Event Logs for failures:** Review Windows Security Event Logs for Event ID 3002 and 3007. Identify timestamps and the context around these events to determine if they indicate a system failure or unauthorized tampering.

  - **Analyze recent updates:** Examine the Windows Update log (Event ID 3) to see if the system has failed to install recent updates that could impact Windows Defender's performance, especially regarding the Network Inspection System.

  - **Identify malicious patterns:** Look for subsequent events indicating malware behavior or lateral movement, such as abnormal process creations (Event ID 4688) or unusual file creations related to known threat signatures.

  - **Review legitimate operations:** Validate regular system maintenance and scheduled scans from Windows Defender through historical logs. Confirm that no authorized administrative actions correlate with the detected failure or restart events.

  - **Assess host role and asset criticality:** Prioritize affected systems based on their role in the organization, giving higher attention to critical servers or endpoints handling sensitive data.

  ### Prioritization

  The alert is of medium severity due to the potential impact on endpoint security if Windows Defender is impaired, allowing malware or malicious actors to exploit the vulnerabilities. While not all occurrences represent a malicious breach, the combination of failure and restart should raise concerns regarding the likelihood of exploitation.

  ### Blind Spots and Assumptions

  The detection may not catch all evasion techniques, such as advanced malware that deliberately triggers Defender failures. Continuous logging and alerting configurations for Windows Defender must be reliably set to monitor these events. Legitimate installation failures or administrative changes may lead to false positives. Related detections, such as those for unusual network behavior or unauthorized file access, strengthen monitoring efficacy and context around the incident.

