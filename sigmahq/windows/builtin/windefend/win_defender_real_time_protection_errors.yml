title: Windows Defender Real-Time Protection Failure/Restart
id: dd80db93-6ec2-4f4c-a017-ad40da6ffe81
status: stable
description: Detects issues with Windows Defender Real-Time Protection features
references:
- Internal Research
- https://www.microsoft.com/en-us/security/blog/2023/04/11/guidance-for-investigating-attacks-using-cve-2022-21894-the-blacklotus-campaign/
- https://gist.github.com/nasbench/33732d6705cbdc712fae356f07666346     # Contains the list of Feature Names (use for filtering purposes)
author: Nasreddine Bencherchali (Nextron Systems), Christopher Peacock '@securepeacock'
  (Update)
date: 2023-03-28
modified: 2023-05-05
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID:
    - 3002         # Real-Time Protection feature has encountered an error and failed
    - 3007         # Real-time Protection feature has restarted
  filter_optional_network_inspection:
    Feature_Name: '%%886'     # Network Inspection System
    Reason:
    - '%%892'         # The system is missing updates that are required for running Network Inspection System.  Install the required updates and restart the device.
    - '%%858'         # Antimalware security intelligence has stopped functioning for an unknown reason. In some instances, restarting the service may resolve the problem.
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some crashes can occur sometimes and the event doesn't provide enough information
  to tune out these cases. Manual exception is required
level: medium
note: |
  ### Technical Context
  This detection rule identifies failures or restarts of Windows Defender Real-Time Protection, which can indicate attempts by an attacker to disable or evade security measures. Such actions might be a precursor to a more capable intrusion, as threat actors often seek to undermine security controls to facilitate lateral movement, data exfiltration, or deployment of malware. The suspected threat behavior aligns with evasive tactics used by malicious entities, particularly in scenarios where exploits are leveraged to bypass security solutions.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique **Indicator Removal on Host** (T1562.001), as attackers may exploit weaknesses to disable or bypass security tools. Data sources that provide the best insights into these activities include Windows Event Logs, specifically looking at Event IDs related to Windows Defender failures and restarts. Monitoring for these event logs can help identify abnormal functionality within Windows Defender that may signal a compromise.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Event Logs for Event IDs 3002 and 3007 associated with Windows Defender. Determine if these errors correspond with any recent changes in the environment or unusual user actions.
  - **Correlate with Other Alerts**: Investigate any related security alerts or logs from your SIEM that correspond with the identified Event IDs. Look for patterns of behavior that suggest coordinated attack efforts aimed at disabling real-time protection.
  - **Analyze System Updates**: Verify the system’s update status to ensure that Windows Defender and its features, particularly the Network Inspection System, are up to date. Missing updates can often lead to Defender malfunctions which can be exploited.
  - **Investigate User Activity**: Identify users who have administrative privileges and review their recent actions. Check for any suspicious logins or remote access that may coincide with the detected Defender failures, which could indicate potential insider threats or compromised accounts.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of allowing an attacker to evade detection if Windows Defender is disabled or failing. The likelihood of exploitation can increase following successful environmental assessments by adversaries, making swift investigation critical.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of Defender manipulation, as some legitimate system crashes may trigger these events without malicious intent. Additionally, the rule assumes that Windows Defender logs are being appropriately collected and that no additional noise is present from regular maintenance activities. Environments lacking the correct audit configurations or event logging settings might miss critical indicators, making vigilance in ensuring proper logging essential for this alert's effectiveness.

