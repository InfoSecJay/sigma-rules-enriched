  service: windefend
detection:
  selection:
    EventID:
    - 3002         # Real-Time Protection feature has encountered an error and failed
    - 3007         # Real-time Protection feature has restarted
  filter_optional_network_inspection:
    Feature_Name: '%%886'     # Network Inspection System
    Reason:
    - '%%892'         # The system is missing updates that are required for running Network Inspection System.  Install the required updates and restart the device.
    - '%%858'         # Antimalware security intelligence has stopped functioning for an unknown reason. In some instances, restarting the service may resolve the problem.
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some crashes can occur sometimes and the event doesn't provide enough 
  information to tune out these cases. Manual exception is required
level: medium
note: |
  ### Technical Context

  This Sigma rule detects failures and restarts of Windows Defender Real-Time Protection features, specifically capturing Event IDs 3002 and 3007. The likely attacker objective involves exploitation of vulnerabilities or weaknesses in endpoint security, potentially leading to successful malware execution or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and sub-technique of Disable or Modify Tools (T1562.001). The primary telemetry sources are Windows Event logs, specifically under the source of the Windows Defender service (windefend).

  If these events indicate malicious activity, it may expose the system to unprotected exploitation vectors, allowing threats to bypass security controls. Importantly, this detection does NOT confirm that the system is compromised or that malicious activity is occurring; rather, it indicates that security mechanisms are degrading or malfunctioning.

  ---

  ### Investigation Steps

  - **Review Event Logs for Failures/Restarts:** Analyze Security Event Log (Event ID 3002 and Event ID 3007) within the Windows Event Viewer to confirm the timestamps and context of any failures or restarts related to Real-Time Protection. Look for sudden spikes in occurrences, as multiple restarts could indicate tampering.

  - **Check for Update Status:** Validate that the system has the latest security updates installed. Reference Windows Update logs (e.g., System Event ID 19) to confirm the installation of the latest definitions and patches, specifically for the Network Inspection System. Legitimate systems should have updates applied regularly.

  - **Correlate with Other Security Events:** Investigate any associated security events during the same timeframe, such as indications within Security logs or Sysmon Event ID 1 that show process creation or unusual application activity, which may imply that an adversary is trying to exploit outdated security features.

  - **Identify Legitimate Activity:** Verify whether the system is executing expected processes that utilize Real-Time Protection features, such as legitimate antivirus operations or scheduled scans, by reviewing Windows Defender logs for feature usage and legitimate application behavior.

  - **Look for Malicious Indicators:** Check for any unusual network activity or application behavior that corresponds with the time of the Defender failures. Focus on spikes in outbound connections (such as Event ID 5156 in Windows Filtering Platform logs) and new process creations around the same timestamp as the Defender issues, which could heighten suspicion of active exploitation.

  - **Examine Endpoint Role and Criticality:** If the affected device is part of critical infrastructure (e.g., domain controllers, file servers), assign higher urgency to the investigation due to the potential impact of a compromised security tool. Assess logs for additional lifecycle events such as user logins (Event ID 4624) that could provide context on user activity before and after the detection.

  ---

  ### Prioritization

  This alert is considered medium severity as it indicates a failure in a primary security mechanism, potentially exposing systems to attack. The likelihood of exploitation is increased if the failure aligns with known vulnerabilities or simultaneous suspicious activities. This behavior is often indicative of ongoing attempts to evade detection or manipulate security settings and should be investigated promptly.

  ---

  ### Blind Spots and Assumptions

  Detecting these specific events may miss advanced evasion techniques, such as sophisticated malware that temporarily disables Windows Defender without generating failures. Event collection must be properly configured to ensure comprehensive visibility into Defender-related events, requiring logs from the windefend service to be forwarded for analysis. Legitimate software updates or maintenance tasks may lead to similar failures or restarts, complicating triage. Complementary detections, such as identifying anomalous login patterns or unusual changes in system configuration (e.g., Group Policy modifications), can provide additional context for understanding whether observed behavior is benign or malicious.

