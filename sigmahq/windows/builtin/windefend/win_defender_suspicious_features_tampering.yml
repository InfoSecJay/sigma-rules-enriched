  condition: selection
falsepositives:
- Administrator activity (must be investigated)
level: high
note: |
  ### Technical Context
  This rule detects suspicious changes to the Windows Defender configuration, specifically targeting modifications that may indicate an attempt to disable or alter the effectiveness of the endpoint protection framework. Attackers often seek to manipulate security configurations to facilitate their activities, such as evading detection mechanisms while deploying malware or performing unauthorized actions on a compromised machine. The event captured by this rule (Event ID 5007) is triggered when there are changes to key Windows Defender settings that are commonly abused.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and the technique **Modify Existing Service** (T1562.001), as the adjustments made to the Windows Defender settings can reflect efforts to avoid detection. Attackers may also aim to disable real-time protection or alter scanning parameters to streamline malware deployment. The primary data sources for this detection are Windows event logs specifically related to the Windows Defender service, particularly logs detailing configuration changes.

  ### Investigation Steps
  - **Review Change Logs:** Examine Windows Defender configuration logs (Event ID 5007) to identify the exact changes made, including timestamps and user accounts associated with the modifications.
  - **Correlate User Activity:** Check for any user accounts that made changes to the configuration, particularly those outside of normal administrative patterns or during off-hours.
  - **Analyze System Integrity:** Investigate other security logs for any potential indicators of compromise, such as unusual processes running at the same time or attempts to disable other protective measures like User Account Control (UAC).
  - **Check for Previous Alerts:** Review previous alerts related to Windows Defender changes or similar configurations to determine if this modification is part of a larger pattern of suspicious behavior.

  ### Prioritization
  The alert's high severity stems from the potential for significant impact if attackers successfully disable or modify endpoint protection mechanisms. In an enterprise environment, effective security configurations are critical, and unauthorized changes could lead to a higher likelihood of successful attacks.

  ### Blind Spots and Assumptions
  This detection logic may not cover instances where attackers utilize legitimate administrative accounts to make these changes, meaning that some attacks could evade detection. It assumes that log collection for Windows Defender configuration changes is enabled and properly configured. Additionally, it relies on certain values being indicative of malicious behavior, which may vary based on organizational policies or legitimate administrative tasks. Careful consideration must be given to potential false positives stemming from legitimate administrative work.

