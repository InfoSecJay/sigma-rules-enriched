  ---

  ### Technical Context

  This Sigma rule detects suspicious modifications to the Windows Defender configuration, specifically changes to settings that could disable protective features or reduce the efficacy of the antimalware platform. Attackers aim to weaken or disable endpoint defenses to facilitate malware execution, data exfiltration, or lateral movement within the environment. The relevant MITRE ATT&CK tactic is Defense Evasion (T1562.001).

  The primary telemetry source is the Windows event log with Event ID 5007, which indicates that the antimalware platform configuration has changed. If malicious, these changes can significantly lower the security posture of the affected system, potentially exposing it to various threats. It is important to note that this detection does NOT confirm malicious intent on its own; benign administrator actions may trigger the same alerts.

  ---

  ### Investigation Steps

  - **Review the event details for suspicious configuration changes:** Analyze Event ID 5007 entries in the Windows Security event log. Look for changes that contain `DisableAntiSpyware`, `DisableRemovableDriveScanning`, or `DisableScanningMappedNetworkDrivesForFullScan`.

  - **Identify legitimate administrative actions:** Confirm whether the configuration changes align with documented administrator activities. Legitimate changes often correlate with scheduled maintenance or updates of security protocols documented in change logs.

  - **Correlate with user actions:** Check for related user activity logs around the time of the event using Windows Security Event ID 4624 (Logon) for the initiating users. Elevated permissions for user accounts making these changes could indicate malicious intent.

  - **Assess device role and criticality:** Determine if the affected system is a high-value target such as a server or workstation containing sensitive data. This context can aid in assessing potential impact.

  - **Look for malicious indicators in the environment:** Search for additional suspicious activities leading to the configuration change by examining recent Windows Event IDs 4104 (PowerShell script block logging) or Process creation logs (Event ID 4688) that may indicate scripts used for disabling defenses.

  - **Validate the existence of persistent malware artifacts:** Check for unusual file creations or executables (e.g., Task Scheduler entries, registry changes) that might indicate malware trying to maintain persistence after Defender protection is altered.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential impact of reducing endpoint protection on critical systems. The likelihood of malicious use of these settings is elevated, as attackers commonly exploit defense evasion techniques to bypass security mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection might miss certain advanced evasion techniques where adversaries manipulate logs or employ legitimate tools to modify settings stealthily. Reliable detection is contingent on proper logging configurations; ensure Event ID 5007 is being collected and monitored consistently. Furthermore, legitimate administrative activities, such as routine security policy updates, may also trigger this alert. Companion detections include monitoring for related configuration changes targeted at globally significant Defender features (e.g., Event ID 5007 in conjunction with Event ID 5005 for broader analysis of Defender configurations).

