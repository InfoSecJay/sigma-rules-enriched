note: |
  ### Technical Context

  This rule detects the blocking of process creations originating from PSExec and WMI commands, which are often used for lateral movement in network attacks. These tools allow attackers to execute commands on remote systems, and their usage indicates an attempt to exploit administrative privileges to gain unauthorized access. The relevant MITRE ATT&CK tactics include Execution (T1203) and Lateral Movement (T1569.002). The primary telemetry sources are Windows Defender logs, specifically Event ID 1121, which indicates blocked actions from processes such as `wmiprvse.exe` and `psexesvc.exe`. If malicious, this behavior can hinder an attacker's attempt to pivot or escalate privileges within a network. Importantly, this detection does not confirm that all WMI or PSExec activity is malicious, as legitimate administrative tasks may also trigger these alerts.

  ### Investigation Steps

  - **Review Event ID 1121**: Check for logs associated with blocked process creations from `wmiprvse.exe` or `psexesvc.exe`. Malicious indicators include abnormal execution patterns from these processes, especially if originating from non-administrative user accounts.

  - **Correlate with Process Creation Logs**: Investigate recent process creation events (Event ID 4688) to identify parent processes that may have spawned legitimate or suspicious commands. Look for unusual parent-child process relationships, like typical administrative tools invoking PSExec or WMI commands.

  - **Identify Source of Invocation**: Determine which user or system invoked the commands leading to blocked process creation. Look at the fields "SubjectUserName" and "ProcessId" in Event ID 1121 logs to ascertain if the initiating account has legitimate administrative privileges.

  - **Examine Network Traffic**: Capture and analyze network logs for outbound connections made by the host within a relevant timeframe. Utilize logs from firewalls or proxy servers to check for unusual or unauthorized external communications from systems utilizing PSExec or WMI.

  - **Assess Environment for Legitimate Usage**: Evaluate known business processes or IT administrative operations that use WMI or PSExec for remote administration. Document expected patterns and behaviors to better discern legitimate activities from potential malicious actions.

  - **Review Recent Administrative Actions**: Cross-check any recent account activity or administrative actions conducted by users on the affected systems. Ensure there are documented and authorized use cases for PSExec or WMI to reduce false positive alerts.

  ### Prioritization

  This alert is deemed high severity due to its implications for lateral movement and privilege escalation. Systems impacted by this detection often play critical roles in enterprise environments, and the use of PSExec and WMI commands is a common tactic leveraged by adversaries. Rapid response is warranted to assess potential misuse.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfiguration of Windows Defender logs, so ensuring full and correct logging for process creations is crucial. Attackers might use obfuscation techniques or deploy legitimate administrative tools under unauthorized accounts to evade detection. Additionally, automated deployment solutions may generate legitimate instances of PSExec or WMI commands. A related detection involves monitoring for successful executions of PSExec (e.g., financial gain or credential theft), helping to build a clearer picture of both active and attempted exploitations.

