note: |
  ### Technical Context
  This detection rule monitors and alerts on the blocking of process creation events that originate from PSExec and Windows Management Instrumentation (WMI) commands. PSExec is a commonly used administrative tool that allows users to execute processes on remote systems, while WMI is a powerful interface for managing and querying system resources. Attackers often exploit these tools for lateral movement within a network, allowing them to execute commands on other machines, gather information, or deploy malicious payloads. The blocking of these process creations signifies a defensive measure implemented to thwart such unauthorized activities.

  The likely attacker objectives include establishing a foothold within an enterprise network, facilitating lateral movements, and executing commands remotely to compromise additional systems. As defined in the MITRE ATT&CK framework, relevant tactics for this rule include **Execution (T1203)** and **Lateral Movement (T1569.002)**, highlighting the possible methods attackers might employ to run processes or scripts on other machines unnoticed. Primary log sources for capturing evidence of this activity include Windows Event logs, specifically those associated with process creation events (EventID 1121), and Windows Defender logs detailing blocked events due to configured protection rules.

  ### Investigation Steps
  - **Review Blocked Process Events:** Examine EventID 1121 in Windows Event logs to identify any relevant instances of process creations blocked from PSExec and WMI sources. Pay attention to timestamps and the accounts initiating these commands.
  - **Analyze Process Command Line Arguments:** Investigate the command line arguments for any allowed executions that may angle into suspicious or unexpected actions, particularly focusing on parameter use that aligns with lateral movement.
  - **Check for Unusual User Activity:** Assess the accounts associated with blocked commands for unusual behavior, such as multiple failed login attempts, elevated access requests, or out-of-hours access patterns that may indicate a compromised account.
  - **Correlate with Network Activity:** Match any blocked process events with network logs to identify potential related outbound connections, especially connections to known malicious IP addresses or unusual ports that could signify attempted exploitation.

  ### Prioritization
  This alert carries a **high** severity level due to its implications for enterprise security. The detection of blocked PSExec and WMI activities could indicate attempts by potentially malicious actors to execute unauthorized commands remotely, which, if successful, would threaten the integrity of the entire organization's network.

  ### Blind Spots and Assumptions
  Potential gaps in detection include scenarios where attackers utilize alternative methods to execute similar commands or employ tools not captured by the configuration, such as built-in Windows tools or PowerShell scripts that bypass PSExec and WMI. This logic assumes that the prevention mechanism (Attack Surface Reduction rule) is enabled and functioning correctly. If proper log collection and monitoring aren't in place for Windows Event logs, especially those related to security and process creation, this alert may not trigger as expected, leading to undetected malicious activity.

