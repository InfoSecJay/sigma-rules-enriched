note: |
  ### Technical Context

  This Sigma rule detects the disabling of Windows Defender Real-time Protection, a critical security feature designed to guard against malware and threats in real-time. The primary attacker objective for disabling this feature is to reduce the defenses of a system, facilitating subsequent malicious activities such as malware installation or data exfiltration. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (T1562.001).

  The primary telemetry source for this detection is Windows Event Logs, specifically focusing on Security Event ID 5001, which indicates that real-time protection was disabled. If malicious, the impact can be significant, as it may allow threat actors unhindered access to compromise systems. Importantly, this detection does NOT confirm that an unauthorized user performed the action; legitimate administrator activity may also trigger this alert.

  ### Investigation Steps

  - **Check Event Logs for Event ID 5001:** Confirm the event is logged in Windows Event Viewer under Windows Defender, indicating that real-time protection has been disabled. Review the timestamp and initiating user account for context.

  - **Identify the User Account Involved:** Review the user account linked to Event ID 5001. If the account is an administrative account and recent changes to Defender settings align with scheduled maintenance, this may indicate benign activity.

  - **Examine for Following Activity:** Look for subsequent events around the same timeframe, particularly Event ID 5007 (Defender settings modified), which can indicate additional changes made to the security settings that may suggest malicious intent.

  - **Conduct a Process Analysis:** Use Sysmon Logs to identify any processes initiated shortly after real-time protection was disabled (Event ID 1). Look for unusual or suspicious process creation (e.g., unrecognized executables) that may indicate an attempted compromise.

  - **Review for Related Configuration Changes:** Look for configuration changes in Group Policy that could affect Windows Defender settings. Changes from previous logs (e.g., Event IDs 4700 and 4701) can confirm whether the disabling action correlates with legitimate environmental alterations.

  - **Assess System Criticality:** Evaluate the asset where real-time protection was disabled. If the system is critical (e.g., domain controller, database server), prioritize the investigation to mitigate high-risk scenarios.

  ### Prioritization

  High severity is warranted due to the critical role Windows Defender plays in endpoint security. The likelihood of malicious abuse is elevated, particularly as the disabling of protections is a common tactic used by adversaries to facilitate attack progression. This behavior is frequently weaponized in various malware attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not adequately configured to capture all relevant events or if administrative actions are frequent and legitimate. Evasion techniques include users disabling the feature temporarily or using alternative tools that may not trigger the alert. Additionally, scheduled updates or maintenance activities may frequently yield false positives related to Event ID 5001. Strengthening coverage can be aided by monitoring additional related detections, such as changes to Windows Group Policies that affect security settings.

