note: |
  ### Technical Context

  This Sigma rule detects when Windows Defender Real-time Protection is disabled, an event captured by Event ID 5001 from the Windows Defender service. Disabling real-time protection may be an indicator of malicious intent, as adversaries often seek to weaken endpoint defenses to facilitate malware deployment or other harmful activities. This behavior corresponds to the MITRE ATT&CK technique "Impair Defenses" (T1562) within the tactic of Defense Evasion.

  Primary telemetry sources include Windows Security Event logs, specifically looking for Event ID 5001 that indicates the status change. If malicious, this action can lead to increased system vulnerability, as it lowers the defensive posture against malware and other threats. However, this detection does NOT confirm that exploitation has occurred or that subsequent malicious activity is guaranteed.

  ### Investigation Steps

  - **Examine Event ID 5001: ** Review Windows Security Event logs for Event ID 5001 to confirm the action of disabling real-time protection. Note the timestamp and user associated with this action for further context.

  - **Identify legitimate administrative changes:** Investigate whether the action was performed by an authorized administrator or through legitimate maintenance activities, especially if this occurs during scheduled updates or patch management windows.

  - **Correlate with other events:** Look for related security events in the same timeframe, such as process creation (Event ID 4688) or file modifications, to identify potentially associated malicious behaviors.

  - **Assess user accounts involved:** Identify the user account that triggered the disabling of real-time protection. Monitor for known administrative accounts under scrutiny or any service accounts that should not typically perform such actions.

  - **Validate system compliance:** Check the organization's policy on endpoint protection to determine if real-time protection can be legitimately disabled under specific conditions and ensure systems are compliant with these policies.

  - **Track for subsequent malicious activity:** Search for indicators of compromise following the disabling event, such as abnormal network connections, unexpected file modifications, or the execution of known malware hashes in subsequent relevant logs.

  ### Prioritization

  The severity of this alert is high, especially in environments where Windows Defender is critical for endpoint security. The likelihood of misuse is significant, as attackers commonly seek to disable security mechanisms to execute malicious payloads without detection. As this behavior aligns with well-documented tactics commonly exploited in security breaches, it warrants immediate attention.

  ### Blind Spots and Assumptions

  Detection may overlook scenarios where legitimate administration actions occur, such as scheduled maintenance or system updates. Additionally, if logging is not properly configured or if audit policies are not enabled for Windows Defender, this event may not be recorded reliably. Legitimate updates or user errors can also trigger the alert. A related detection to strengthen coverage would be monitoring for the execution of scripts or binaries immediately before or after this event, which could indicate malicious intent (e.g., Event ID 4688 process creation logs).

