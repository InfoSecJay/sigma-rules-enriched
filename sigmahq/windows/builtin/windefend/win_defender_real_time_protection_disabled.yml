  ---

  ### Technical Context

  This Sigma rule detects the disabling of Windows Defender Real-time Protection via Event ID 5001. Such behavior may indicate an attacker’s objective to evade detection by disabling security controls, enabling subsequent malicious activities without interference. This aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion and technique T1562.001 (Disable or Modify Security Tools). The primary telemetry source is Windows security logs, specifically Event ID 5001 from Windows Defender, which indicates the state change of real-time protection.

  If successfully executed by an adversary, disabling Windows Defender could lead to heightened risk of malware infections and successful lateral movement within the network. It is important to note that this alert alone does not confirm malicious intent, as legitimate administrative actions or software updates could also trigger this event.

  ---

  ### Investigation Steps

  - **Review Event Details**: Check Event ID 5001 in the Windows security log to confirm that real-time protection was disabled. Look for the `<Username>` and `<Process>` fields to identify if the change was made by an administrative user or system process.

  - **Validate User Context**: Cross-reference the user account that made the change against your IAM policies. Legitimate administrative actions should be documented; if the user is non-privileged or recent, this could indicate a potential security incident.

  - **Check Recent Changes**: Look through the Windows Update logs (Event ID 20 and 21) to see if the disabling coincided with a legitimate update. If updates are not documented, this raises the suspicion of malicious activity.

  - **Correlate with Other Security Events**: Search for related security events around the same time (e.g., Event ID 4688 Process Creation and Event ID 4697 Service Installation) to identify any processes that could have been affected directly after Defender was disabled. High-confidence malicious indicators may include unusual executable paths or unknown service names.

  - **Assess System Impact**: Determine the criticality of the affected system. If it is a server or endpoint that processes sensitive data, the severity of the investigation escalates. Non-critical systems may require less immediate attention.

  - **Identify Evasion Tactics**: Review your environment for any recurring instances of this alert. If this is common due to administrative or software update procedures, develop processes to minimize false positives while ensuring appropriate security measures are in place.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of disabling key security measures on critical systems. The likelihood of malicious use is significant, as attackers frequently attempt to disable or bypass security tools to achieve their objectives. Given that this behavior is often weaponized in a range of attacks, timely investigation is critical.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by configurations that do not capture all administrative actions or by false positives from legitimate updates. Without full logging of administrative actions, it can be challenging to discern between benign and malicious activity. Common legitimate actions that could trigger this alert include manual disabling by administrators or automated tasks during system maintenance. Companion detections, such as monitoring for unauthorized Process Creation events (Event ID 4688), can strengthen coverage against malicious activities following the disabling of Defender.

