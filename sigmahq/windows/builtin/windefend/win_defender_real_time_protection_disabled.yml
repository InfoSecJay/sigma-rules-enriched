note: |
  ### Technical Context

  This Sigma rule detects the event where Windows Defender's Real-time Protection is disabled, indicated by Event ID 5001. The likely objective of an attacker is to bypass security measures, facilitating malware installation or system exploitation. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (T1562.001). The primary telemetry source is Windows Defender logs, specifically monitoring the security event that captures changes to the antivirus settings. If malicious, this action can expose the system to unmonitored threats and increase the risk of compromise. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative actions can disable Real-time Protection.

  ### Investigation Steps

  - **Identify the triggering user context**: Check the Windows Security Event logs (Event ID 5001) for the username associated with the event to establish whether it aligns with known administrative activities or anomalies.

  - **Review context for legitimate actions**: Analyze past logged activities of the same user to determine if disabling Real-time Protection correlates with scheduled updates or legitimate maintenance activities, which are often followed by Event ID 5002 (enabled protection).

  - **Assess system role and criticality**: Determine the role of the affected system (e.g., server, endpoint) and its criticality to the organization. Higher criticality assets requiring enhanced protection should be scrutinized closely for unauthorized changes.

  - **Correlate with security events**: Review related events in the security logs around the time of the disablement to identify signs of suspicious processes or malware activity (look for Event ID 4688 for new process creations).

  - **Inspect for policy changes**: Evaluate Group Policy Objects (GPOs) or endpoint configuration management logs that could indicate an administrator's policy change that led to disabling Real-time Protection, which might reduce the severity of the alert if justified.

  ### Prioritization

  This alert is of high severity due to its potential impact; disabling antivirus protections can facilitate the installation of malware or unauthorized software, significantly increasing risk. Additionally, the likelihood of malicious users attempting to disable security controls is common, as it is a frequent step in various attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of monitoring on user permission changes or direct actions taken by users without triggering policies. Legitimate system management, such as updates or maintenance by administrators, can trigger this alert. To enhance detection strength, consider correlating this rule with companion detections such as those for unauthorized software installations or privilege escalation attempts in the environment.

