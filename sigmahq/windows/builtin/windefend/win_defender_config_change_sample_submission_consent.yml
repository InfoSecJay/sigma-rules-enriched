note: |
  ### Technical Context

  This rule detects the disabling of the "Automatic Sample Submission" feature in Windows Defender by identifying changes in the Windows Defender configuration. The likely attacker objective is to prevent the automatic submission of potentially malicious files to Microsoft for analysis, thereby evading detection and analysis of malware. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion and the technique ID T1685 (Defensive Evasion).

  The primary telemetry source is the Windows event log, specifically Event ID 5007, which indicates changes in the antimalware platform configuration. If malicious, disabling this feature can impact the organization's ability to detect and respond to emerging threats. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also lead to this configuration change.

  ### Investigation Steps

  - **Review Event ID 5007 logs**: Check for Event ID 5007 in the Windows Security event logs. Look for the entry indicating `SubmitSamplesConsent = 0x0` to confirm the configuration change has occurred.

  - **Identify user context**: Determine the user context for the change. Ensure that it was not initiated by a legitimate administrator. Review the `SubjectUserName` and `SubjectDomainName` fields for authorized accounts or roles.

  - **Assess previous configuration**: Look for prior configurations of the Windows Defender settings to verify if "Automatic Sample Submission" was enabled before the change. This can offer insights into potential unauthorized activity.

  - **Investigate related administrative actions**: Cross-reference other administrative events around the same time in the event logs, specifically focusing on PowerShell (Event IDs 4103, 4104) or Group Policy changes (Event IDs 4739) to detect any other suspicious administrative activities.

  - **Check for known benign cases**: Reference the organization's documentation on legitimate administrative tasks or policies that involve disabling Windows Defender features, as some IT processes may require it temporarily for maintenance or testing.

  - **Examine system and file integrity**: Verify if there have been any unusual file creations or modifications on the endpoint by using Sysmon Event ID 11, which captures file creation events, especially in directories related to antivirus software.

  ### Prioritization

  This alert carries low severity in an enterprise context but requires prompt investigation. The impact of disabling Windows Defender's sample submission could be significant, especially if it enables a malicious actor to obscure their activities and evade detection. While this behavior is often weaponized by sophisticated threats, the overall context and surrounding events must be assessed before concluding malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all potential user accounts that can change this setting. Evasion techniques include legitimate administrative alterations or alterations made using system management tools outside of standard interfaces. This alert could also be triggered by authorized troubleshooting efforts, highlighting the need for thorough investigation. Companion detections could include monitoring for changes and queries related to other Windows Defender settings, enhancing overall visibility into potential defense evasion tactics.

