title: LSASS Access Detected via Attack Surface Reduction
id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
status: test
description: Detects Access to LSASS Process
references:
- https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction
author: Markus Neis
date: 2018-08-26
modified: 2022-08-13
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: windefend
  definition: 'Requirements:Enabled Block credential stealing from the Windows local
    security authority subsystem (lsass.exe) from Attack Surface Reduction (GUID:
    9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2)'
detection:
  selection:
    EventID: 1121
    Path|endswith: '\lsass.exe'
  filter_thor:
    ProcessName|startswith: 'C:\Windows\Temp\asgard2-agent\'
    ProcessName|endswith:
    - '\thor64.exe'
    - '\thor.exe'
  filter_exact:
    ProcessName:
    - 'C:\Windows\System32\atiesrxx.exe'
    - 'C:\Windows\System32\CompatTelRunner.exe'
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\System32\nvwmi64.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\Taskmgr.exe'
    - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  filter_begins:
    ProcessName|startswith:
    - 'C:\Windows\System32\DriverStore\'
    - 'C:\WINDOWS\Installer\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not 1 of filter_*
falsepositives:
- Google Chrome GoogleUpdate.exe
- Some Taskmgr.exe related activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the LSASS (Local Security Authority Subsystem Service) process, which is critical for handling security policies and storing credentials on Windows systems. Attackers often seek to extract sensitive information like user passwords and tokens to escalate privileges or perform lateral movement. This behavior is categorized under the MITRE ATT&CK framework as Credential Access (TA0006) with the technique ID T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry source is the Windows Defender service, specifically looking for Event ID 1121, which indicates attempts to interact with LSASS. If successful, such activities can compromise an entire system's security by allowing attackers access to credentials. This detection alone does not confirm malicious intent; it requires further investigation to determine the context and motivations behind the access.

  ### Investigation Steps

  - **Review Event ID 1121 details**: Check for Event ID 1121 logs that indicate access attempts to `lsass.exe`. Focus on the `ProcessName` and `Path` parameters to identify if they deviate from expected system processes.

  - **Identify the calling process**: Look for the parent process of the event in the logs. An unexpected or unauthorized process (e.g., `C:\Windows\Temp\asgard2-agent\thor.exe`) initiating access to LSASS indicates potential malicious activity.

  - **Validate legitimate behavior**: Cross-check logs for known system processes (like `msiexec.exe`, `svchost.exe`) accessing LSASS. Compare timestamps and user context to establish that regular operations, such as Windows updates or software installation, are not malicious.

  - **Check for abnormal file creation**: Investigate the presence of suspicious executables in the `C:\Windows\Temp` directory or any unexpected child processes spawned from known binaries, as they can serve as drop zones for credential theft tools.

  - **Analyze user account activity**: Review user authentication logs around the timestamp of the alert (e.g., Security Event ID 4624 for successful logons). Look for anomalies, such as access attempts from unexpected geographic locations or unusual times.

  - **Correlate with existing threats**: Look for simultaneous detection alerts like suspicious process creation (e.g., using Sysmon Event ID 1) that may indicate coordinated credential access attempts across the environment.

  ### Prioritization

  This alert is considered high severity due to the critical nature of LSASS in the Windows operating system. The likelihood of malicious abuse is significant, as attackers often target LSASS processes for credential dumping, which is a common operation in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if the environment lacks comprehensive logging policies for all relevant processes. Attackers may use legitimate processes to access LSASS to evade detection, leading to false positives for benign applications such as Google Chrome’s updater. It is beneficial to pair this detection with other rules related to process injection or credential dumping activities to enhance overall security visibility and response.

