title: LSASS Access Detected via Attack Surface Reduction
id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
status: test
description: Detects Access to LSASS Process
references:
- https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction
author: Markus Neis
date: 2018-08-26
modified: 2022-08-13
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: windefend
  definition: 'Requirements:Enabled Block credential stealing from the Windows local
    security authority subsystem (lsass.exe) from Attack Surface Reduction (GUID:
    9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2)'
detection:
  selection:
    EventID: 1121
    Path|endswith: '\lsass.exe'
  filter_thor:
    ProcessName|startswith: 'C:\Windows\Temp\asgard2-agent\'
    ProcessName|endswith:
    - '\thor64.exe'
    - '\thor.exe'
  filter_exact:
    ProcessName:
    - 'C:\Windows\System32\atiesrxx.exe'
    - 'C:\Windows\System32\CompatTelRunner.exe'
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\System32\nvwmi64.exe'
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\System32\Taskmgr.exe'
    - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  filter_begins:
    ProcessName|startswith:
    - 'C:\Windows\System32\DriverStore\'
    - 'C:\WINDOWS\Installer\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not 1 of filter_*
falsepositives:
- Google Chrome GoogleUpdate.exe
- Some Taskmgr.exe related activity
level: high
note: |
  ### Technical Context
  This detection rule identifies unauthorized access attempts to the Local Security Authority Subsystem Service (LSASS) process on Windows operating systems. Attackers often target LSASS to harvest credentials and gain unauthorized access to sensitive information on the network, making it a critical vector in credential theft and lateral movement scenarios. By monitoring LSASS access, the organization can proactively detect potential credential dumping attempts or exploitation of the system.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) with technique **Credential Dumping: LSASS Memory (T1003.001)**. This technique highlights how attackers, such as those using tools like Mimikatz, may access LSASS to extract login credentials or access tokens. Logs from Windows Event ID 1121 will provide insights needed to ascertain legitimate or malicious LSASS access, with a focus on distinguishing between normal system operations and anomalous behaviors.

  Primary data sources that will provide the best evidence for this detection include Windows Defender logs related to threat detection around LSASS access, as well as process creation events that may indicate suspicious activity around known tools for credential theft.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Event ID 1121 for instances of LSASS access, noting the timestamp and source processes to identify malicious behavior.
  - **Analyze Process Tree:** Examine the process tree surrounding the detected LSASS access. Investigate any parent processes or sibling processes that may indicate the context of the LSASS interaction.
  - **Identify Unusual Processes:** Look for unusual or unexpected processes interacting with LSASS, particularly those that originate from paths specified in the detection rule (e.g., `C:\Windows\Temp\asgard2-agent\`).
  - **Cross-Reference with Known Tools:** Validate any detected processes against known credential dumping tools such as Mimikatz or custom scripts to determine if they are legitimate or indicative of an attacker’s activity.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact it implies—successful credential dumping can lead to significant breaches of sensitive data and further lateral movements throughout the network, making it a critical alert in a comprehensive security posture.

  ### Blind Spots and Assumptions
  This detection method may miss attacks that do not generate sufficient evidence in the Event ID 1121 logs or when legitimate processes are modified or abused without triggering a detection. The logic assumes that all legitimate administrative or system processes will not access LSASS without generating alerts, which may not always hold true in complex enterprise environments. Adequate logging and the right configurations must be in place for this alert to function, especially ensuring that Windows Defender is correctly configured to monitor and block credential stealing activities.

