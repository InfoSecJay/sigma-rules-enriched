note: |
  ### Technical Context

  This rule detects actions taken by Windows Defender when it identifies potential malware or suspicious behavior on a Windows system. The behavior includes the detection of malware signatures, cancellation of infected processes, and actions taken to quarantine potentially harmful software. The likely attacker objective is to deliver and execute malicious payloads on enterprise endpoints, which can lead to data exfiltration, system compromise, or lateral movement. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and techniques include **Command-Line Interface** (T1059).

  The primary telemetry sources are Windows Event Logs, specifically Event IDs 1006, 1015, 1116, and 1117, generated by the Windows Defender service. If malicious, the impact can range from system performance degradation to the spread of malware across the network. Importantly, this detection does NOT prove that an actual compromise has occurred; it merely highlights that potentially harmful activity was attempted or detected.

  ### Investigation Steps

  - **Identify the triggering Event IDs:** Review Windows Security Event Logs for Event IDs 1006, 1015, 1116, and 1117. Look for recent timestamps correlating with the alert to analyze the detected activity.

  - **Analyze the action taken:** Examine Event ID 1117 details in Windows Defender logs, focusing on the `ActionType` field to determine if it quarantined or deleted malicious files. A quarantine action indicates higher confidence of malicious activity.

  - **Correlate with system behavior:** Assess if legitimate processes or scheduled tasks executed prior to the alert occurred, which may indicate benign behavior (e.g., updates, system scans) that could coincide with a detection.

  - **Examine related artifacts:** For a comprehensive view, evaluate related logs such as Sysmon Event ID 1 (Process Creation) to identify which processes attempted to execute around the same time as the alerts, looking for unknown executables or scripts.

  - **Check for previous incidents:** Investigate if similar alerts have been triggered on other endpoints recently, as recurrent incidents could indicate a broader malware campaign or targeting of specific assets.

  ### Prioritization

  This alert is categorized as high severity within an enterprise context due to the critical role of protected systems and the likelihood that detected behavior may represent active threats. The nature of malware detection makes it relevant as many attack vectors are currently weaponized to bypass traditional defenses.

  ### Blind Spots and Assumptions

  Detection may miss advanced threats that employ evasion techniques like packing or polymorphism, which can disguise malicious payloads. Depending on the environment's logging configuration, data may not be available if Windows Defender telemetry is not actively monitored. Legitimate software updates or system maintenance could trigger alerts under specific circumstances. A companion detection related to suspicious command-line arguments (such as **Execution via PowerShell** T1059.001) can enhance coverage against sophisticated threats.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
