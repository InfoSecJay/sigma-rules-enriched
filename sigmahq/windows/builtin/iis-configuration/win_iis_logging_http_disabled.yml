note: |
  ### Technical Context

  This Sigma rule detects changes to the IIS server configuration specifically aimed at disabling HTTP logging for successful requests, typically by altering the `dontLog` attribute to `true`. The likely attacker objective is to cover tracks by preventing the logging of web requests, thereby obfuscating malicious activities such as web shell access or exploitation of vulnerabilities. This behavior relates to the MITRE ATT&CK techniques of Defense Evasion (T1562.002) and Persistence (T1505.004). The primary telemetry source required for this detection is Windows IIS configuration logs, specifically focusing on Event ID 29, which logs configuration modifications. If malicious, this change could allow an attacker to execute undetected actions on the web server, leading to potential data breaches or service disruptions. It is critical to note that this detection alone does not confirm an active threat but indicates a potentially suspicious configuration change that warrants further investigation.

  ### Investigation Steps

  - **Review the IIS configuration changes:** Look for Event ID 29 in the IIS configuration logs to confirm the details of the modification. Check the `Configuration` field for the entry related to `/system.webServer/httpLogging/@dontLog`.

  - **Identify timestamp correlation:** Cross-reference the timestamp of the change with other security events (such as logins or uploads) within the same time frame. Malicious changes may coincide with unusual access patterns, such as logon events (Event ID 4624) or process creations with high-risk applications (Event ID 4688).

  - **Check for historical logging:** Evaluate past logs for the IIS server before the change to determine the logging status. Legitimate configurations typically have `dontLog` set to `false` and include entries for successful requests, indicating that logging was previously active.

  - **Investigate user accounts involved in the change:** Analyze the user context under which the change was made. Malicious activity is more likely if an unexpected user or a service account (such as NETWORK SERVICE) is responsible for modifying the IIS settings.

  - **Monitor for additional suspicious configurations:** Review associated logs for changes to other IIS settings or modules that may indicate an attempt to create a web shell or exploit other vulnerabilities. Look for Event ID 27 concerning module configurations.

  ### Prioritization

  The alert severity is high due to the impact of the IIS server being modified to disable logging, which increases the likelihood of malicious behavior going undetected. Given the public knowledge around web exploitation tactics, this behavior is often leveraged by attackers to evade detection and maintain persistence.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments where proper logging configurations are not consistently enforced, potentially leading to missed alerts. Legitimate administrative workflows, such as scheduled maintenance or performance tuning, might inadvertently trigger this alert. Additionally, companion detections for suspicious web requests or unusual user activity (like failed authentication attempts) could provide more context and strengthen coverage against potential threats.

