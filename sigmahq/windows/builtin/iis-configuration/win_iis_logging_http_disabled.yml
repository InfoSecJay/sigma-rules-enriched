note: |
  ### Technical Context

  This rule detects modifications to the IIS server's configuration that disable HTTP logging for successful requests by checking for Event ID 29, specifically monitoring adjustments to the `dontLog` attribute set to true. The likely attacker objective is to conceal web activity, such as malicious requests or exploitation attempts, by preventing the logging of HTTP requests. This behavior aligns with the MITRE ATT&CK tactics of Persistence (T1547) and Defense Evasion (T1562.001).

  Primary telemetry sources include IIS configuration logs, specifically looking for Event ID 29. If the modification is indeed malicious, it indicates a potential compromise, as attackers often seek to hide their operations. However, this detection does NOT confirm that the system has been compromised, as legitimate administrative activities could lead to similar modifications.

  ### Investigation Steps

  - **Review IIS Configuration Changes:**
    Check for Event ID 29 in IIS logs to see if the `dontLog` attribute has been changed to true within a suspicious timeframe. Look for multiple changes that suggest unauthorized access.

  - **Inspect User Accounts:**
    Verify the user account responsible for the configuration change. Legitimate users typically include system administrators. If the change was made by a non-administrative account, it could indicate malicious activity.

  - **Cross-check Recent HTTP Logs:**
    Analyze recent HTTP logs (IIS logs) prior to the disabling of logging. A spike in requests or unexpected patterns could indicate suspicious behavior that the attacker is attempting to hide.

  - **Monitor for Additional Modifications:**
    Look for subsequent Event ID 29 logs to identify any pattern of frequent configuration changes. Persistent or multiple disabling of logging could signal a more extensive compromise.

  - **Determine Legitimate Configuration Practices:**
    Confirm if the server is a designated asset that typically uses logging in a limited manner. Identify if there are known maintenance windows where logging might be altered as part of routine operations.

  ### Prioritization

  This alert is considered high severity due to the potential impact on monitoring and incident response capabilities, particularly on critical web server assets. The likelihood of malicious abuse is high since disabling logging can facilitate undetected malicious activities, and the behavior of disabling HTTP logging is commonly weaponized by attackers to evade detection.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate administrative actions or maintenance tasks, which can result in similar log entries. Ensure that IIS logging is consistently monitored and that logs are retained for an adequate duration to capture changes. Additionally, be aware that legitimate development or maintenance activities may trigger this alert, which requires contextual awareness. A related detection for unauthorized access to the web server's management interface can strengthen coverage for detecting initial compromise attempts.

