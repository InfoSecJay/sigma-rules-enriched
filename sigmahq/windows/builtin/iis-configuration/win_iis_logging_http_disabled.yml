note: |
  ### Technical Context
  This detection rule identifies the disabling of HTTP logging on Microsoft Internet Information Services (IIS) servers. HTTP logging is crucial for security monitoring, providing insights into web traffic, application behavior, and potential attacks. If an attacker successfully disables HTTP logging, they can obfuscate their activities, making it harder for defenders to analyze access patterns, audit logs, and identify malicious behavior.

  The likely attacker objectives could involve evading detection after unauthorized access or exploitation of web applications. With logging disabled, signs of compromise may be concealed, allowing the intruder to maintain persistence or conduct further malicious activities without alerting security teams. This scenario is aligned with MITRE ATT&CK tactics such as **Defense Evasion** (TA0005) and **Persistence** (TA0003), particularly techniques like **Modify Configuration** (T1562.002) and **Web Shell** (T1505.004).

  The primary data source for this detection is IIS configuration logs that record changes to settings. Monitoring these logs is essential for identifying unauthorized modifications, particularly in environments where web applications are critical to business operations.

  ### Investigation Steps
  - **Review IIS Configuration Logs**: Verify the IIS configuration logs to confirm the changes made to the HTTP logging settings. Specifically, look for Event ID 29 entries that indicate modifications in the `/system.webServer/httpLogging` settings to determine if logging has been disabled.
  - **Analyze Recent Activity**: Investigate recent requests and access patterns prior to the configuration change, focusing on unusual or unexpected activities that could indicate preemptive actions taken by an attacker.
  - **Inspect User Activity**: Check for user accounts with elevated privileges that were involved in making the configuration change. Cross-reference their activity logs for any signs of compromise or misuse.
  - **Perform System Integrity Checks**: Conduct checks on the web server for any unauthorized file changes or deployments, particularly looking for web shells or other exploitation frameworks that could facilitate further attacks.

  ### Prioritization
  This alert is classified as high severity due to its potential impact on the organization's security posture. Disabling HTTP logging significantly hampers the ability to detect and respond to malicious activity, increasing the likelihood of prolonged undetected breaches.

  ### Blind Spots and Assumptions
  A key blind spot in this detection logic is the possibility of legitimate administrative actions leading to similar configuration changes, which might result in false positives. The detection assumes that relevant logs for IIS configuration changes are enabled and correctly capturing Event ID 29. Ensuring comprehensive logging policy implementations and monitoring strategies are in place is essential for this alert to function effectively.

