note: |
  ### Technical Context
  This detection rule identifies events related to the removal of installed Internet Information Services (IIS) modules, specifically looking for changes in IIS configuration that indicate an administrator or potentially malicious user has uninstalled a module. The primary threat scenario involves attackers leveraging web shells or malicious IIS extensions, which can open persistent backdoors into servers. By removing modules, attackers can attempt to cover their tracks or disable security features, thus gaining more control over the web server.

  Relevant MITRE ATT&CK tactics for this behavior include **Defense Evasion (T1562.002)**, where attackers manipulate security controls to evade detection, and **Persistence (T1505.004)**, which involves maintaining access by ensuring that malicious tools or extensions remain operational. These tactics highlight the importance of monitoring IIS configurations as part of a broader security strategy.

  The primary data sources that will provide evidence for this detection include IIS configuration logs, specifically those logging changes to the module settings. Monitoring configuration changes is crucial for early detection of potential compromises.

  ### Investigation Steps
  - **Review IIS Configuration Logs:** Analyze the logs for Event ID 29 to determine the details of the module removal, including the timestamp, the user account responsible, and any other actions taken around the same time.
  - **Examine User Activity:** Investigate the user account that performed the module removal. Check for prior activities that might indicate unauthorized access, such as unusual login attempts or accounts used outside of normal business hours.
  - **Correlate with Other Logs:** Cross-reference the IIS logs with other telemetry sources such as Windows Security Event Logs and process creation events to identify any suspicious processes or network activity that occurred after the module removal.
  - **Assess Impact and Scope:** Evaluate if the module removed had any known legitimate use cases within your environment and determine whether additional malicious activity may be linked to the change, such as the presence of web shell files.

  ### Prioritization
  The severity of this alert is considered low in an enterprise environment; however, it should not be overlooked. The likelihood of exploitation exists, especially if it correlates with other suspicious activities, indicating a potential attempt to maintain unauthorized access or evade security measures.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate administrator actions if the change was part of a planned maintenance process. The coverage is also limited due to potential gaps in logging policies, as not all environments may have comprehensive IIS logging configured. The detection relies on having sufficient auditing enabled to capture configuration changes accurately, and any environments with default or insufficient logging will not trigger this alert.

