note: |
  ### Technical Context

  This Sigma rule detects the removal of previously installed IIS modules, indicating potential unauthorized changes to web server functionality. An attacker may remove an IIS module to disable security features or eliminate evidence of malicious web shells, thereby maintaining control over the environment. This behavior aligns with the MITRE ATT&CK technique for "Web Shell" (T1505.004) and "Application Layer Protocol" abuse (T1685.001).

  Primary telemetry sources include IIS configuration logs where Event ID 29 is generated upon modification actions. If exploited, this could grant an attacker ongoing access, compromising the integrity of the web server. Importantly, this detection does not confirm malicious intent on its own; legitimate administrator activity can also trigger it.

  ### Investigation Steps

  - **Check IIS configuration logs:** Look for Event ID 29 in the IIS logs, specifically targeting changes indicating the removal of modules (e.g., `Configuration contains '/system.webServer/modules/remove'`).

  - **Evaluate the timing of changes:** Compare the timestamp of the module removal with recent user activity. Legitimate administrator actions typically coincide with scheduled maintenance windows and can be verified against change management records.

  - **Identify the user account involved:** Analyze the logs to determine which user account triggered the module removal. Accounts with elevated privileges (e.g., domain admins) warrant more scrutiny than service accounts or less privileged users.

  - **Review recent module installations:** Cross-reference installed IIS modules against historical data. Look for unexpected installs accompanied by the removal action to identify possible backdoor installations or unauthorized changes.

  - **Correlate with web traffic:** Utilize application logs to monitor website performance and errors post-removal. Legitimate removals should not result in significant downtime or functionality loss.

  - **Document any malware indicators:** If known malicious modules (e.g., web shells) were recently installed or if unusual network connections to untrusted hosts are observed, establish a high-confidence malicious indicator.

  ### Prioritization

  This alert has low severity due to its potential for benign administrator activity. However, the risk of malicious activity remains, particularly given the common misuse of IIS modules for web shell installations. The likelihood of this being weaponized is moderate, requiring validation against context and additional indicators.

  ### Blind Spots and Assumptions

  Detection may miss attempts to legitimate changes if detailed logging is not enabled or if logs are not reviewed consistently. Evasion techniques include skilled defenders masking malicious behavior by mimicking standard administrator processes. Administrators legitimately removing modules for legitimate reasons (e.g., configuration changes or troubleshooting) could lead to false positives. Enhancing detection with real-time monitoring for changes in web configuration files would strengthen security measures against unauthorized alterations.

