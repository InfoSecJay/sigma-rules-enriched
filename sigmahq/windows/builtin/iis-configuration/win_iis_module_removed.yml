note: |
  ### Technical Context

  This Sigma rule detects the removal of previously installed Internet Information Services (IIS) modules, which can indicate potential malicious activity aimed at modifying a web server's configuration. The likely attacker objective is to disable security features or insert malicious modules, facilitating unauthorized access or persistent backdoors. This behavior aligns with MITRE ATT&CK tactics of Defense Evasion (T1562.002) and Persistence (T1505.004). The primary telemetry source is IIS configuration logs, specifically focusing on Event ID 29, which documents changes to IIS module configurations. If malicious, the security impact could include the introduction of vulnerabilities or persistent access for attackers. It is important to note that this detection does NOT confirm malicious intent by itself, as it may also capture legitimate administrative modifications.

  ### Investigation Steps

  - **Review IIS Configuration Change Logs**: Check IIS logs for Event ID 29 indicating module removals. Investigate the time stamps and the source of the changes to determine if they correspond with user activity or known maintenance schedules.

  - **Identify User Account Activity**: Examine the user accounts associated with the removal action. Look for any unauthorized or unfamiliar user accounts in the logs (using fields such as `UserName`), as legitimate admins should normally execute such actions.

  - **Check for Recent Modifications**: Cross-reference the event with change logs for recent updates or changes to the IIS environment that may have authorized the module removal. Ideally, legitimate activity should include prior audit logs demonstrating approved changes.

  - **Investigate Module Removal Context**: Analyze which specific modules were removed (content of field `Configuration`) and if their removal has a known legitimate purpose or if they are tied to vulnerabilities or backdoor access.

  - **Confirm with Additional Security Tools**: Utilize endpoint protection solutions or SIEM alerts to correlate other malicious indicators associated with the same timeframe, such as unusual HTTP requests or unexpected service disruptions.

  ### Prioritization

  This alert has low severity as it may often result from legitimate administrative actions. However, the potential for exploitation exists if an attacker is manipulating IIS configurations to introduce vulnerabilities. The behavior should be monitored closely, especially due to its relevance to persistence mechanisms in web services.

  ### Blind Spots and Assumptions

  This detection may miss removal actions if logging is improperly configured; ensuring comprehensive IIS logging is critical. Additionally, legitimate system maintenance can trigger this alert, necessitating context about the user performing the action. A related detection, such as monitoring for unexpected module installations (e.g., Event ID for additions), can strengthen overall coverage of IIS configuration changes.

