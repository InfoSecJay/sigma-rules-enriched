title: New Module Module Added To IIS Server
id: dd857d3e-0c6e-457b-9b48-e82ae7f86bd7
status: test
description: Detects the addition of a new module to an IIS server.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://www.microsoft.com/en-us/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
- https://learn.microsoft.com/en-us/iis/get-started/introduction-to-iis/iis-modules-overview
author: frack113
date: 2024-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1562.002
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|contains: '/system.webServer/modules/add'
  filter_main_builtin:
    NewValue:
    - 'AnonymousAuthenticationModule'
    - 'CustomErrorModule'
    - 'DefaultDocumentModule'
    - 'DirectoryListingModule'
    - 'FileCacheModule'
    - 'HttpCacheModule'
    - 'HttpLoggingModule'
    - 'ProtocolSupportModule'
    - 'RequestFilteringModule'
    - 'StaticCompressionModule'
    - 'StaticFileModule'
    - 'TokenCacheModule'
    - 'UriCacheModule'
  filter_main_remove:
    NewValue: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the addition of a new module to an Internet Information Services (IIS) server, highlighting potentially malicious changes made to the server's configuration. Attackers may manipulate IIS modules to deploy web shells, gain unauthorized access, or establish persistent backdoors in the server environment. The detection of unauthorized modules is crucial, as these could enable attackers to bypass security measures, escalate privileges, or execute malicious tasks within the context of the web server.

  The rule aligns with the MITRE ATT&CK tactics of **Persistence** (T1505) and **Defense Evasion** (T1562), specifically targeting the use of malicious IIS extensions (T1505.004). The primary data source for this detection comes from IIS configuration logs, particularly focusing on Event ID 29, which records changes in the server's module configuration.

  ### Investigation Steps
  - **Review Configuration Logs:** Examine IIS configuration logs for Event ID 29, focusing on any recent entries that indicate a new module has been added, as this is the primary evidence for this detection.

  - **Analyze Recently Added Modules:** Investigate the newly added modules for any known vulnerabilities or indications of malicious behavior. Reference external threat intelligence sources to determine if the modules are commonly associated with web shells or other attacks.

  - **Check for Administrative Changes:** Verify whether the module addition corresponds with documented changes performed by legitimate administrators. Cross-reference with user activity logs to identify any discrepancies.

  - **Monitor IIS Behavior:** Observe the behavior of the IIS server after the module addition. Look for any unusual traffic patterns or requests that could indicate exploitation attempts, such as unfamiliar endpoints or high rates of error responses.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized changes to the IIS configuration, which could lead to persistent access for attackers, making it a critical issue for enterprise environments where web servers are exposed to the internet.

  ### Blind Spots and Assumptions
  The detection logic assumes that all changes to the IIS modules are logged correctly and that Event ID 29 is reliably generated for module additions. If logging is not properly configured, this alert may miss significant changes. Additionally, the rule may generate false positives from legitimate administrator activities, which must be distinguished during investigations. It is crucial to ensure that IIS logging is enabled adequately to capture these configuration changes for effective detection.

