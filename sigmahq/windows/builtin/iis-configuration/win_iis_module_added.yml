title: New Module Module Added To IIS Server
id: dd857d3e-0c6e-457b-9b48-e82ae7f86bd7
status: test
description: Detects the addition of a new module to an IIS server.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://www.microsoft.com/en-us/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
- https://learn.microsoft.com/en-us/iis/get-started/introduction-to-iis/iis-modules-overview
author: frack113
date: 2024-10-06
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1685.001
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|contains: '/system.webServer/modules/add'
  filter_main_builtin:
    NewValue:
    - 'AnonymousAuthenticationModule'
    - 'CustomErrorModule'
    - 'DefaultDocumentModule'
    - 'DirectoryListingModule'
    - 'FileCacheModule'
    - 'HttpCacheModule'
    - 'HttpLoggingModule'
    - 'ProtocolSupportModule'
    - 'RequestFilteringModule'
    - 'StaticCompressionModule'
    - 'StaticFileModule'
    - 'TokenCacheModule'
    - 'UriCacheModule'
  filter_main_remove:
    NewValue: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context

  This rule detects the addition of new modules to an IIS server's configuration, specifically identifying events where the '/system.webServer/modules/add' configuration command is used. This behavior is commonly associated with adversary attempts to implant malicious modules that can facilitate persistence or provide unauthorized access to web applications. The relevant MITRE ATT&CK techniques are Persistence (T1547) and Web Shell (T1505.004).

  The primary telemetry source is IIS configuration logs, specifically targeting Event ID 29 which indicates changes in module configurations. If malicious, this activity may allow unauthorized actions to be performed via web applications, potentially leading to data exfiltration or further system compromise. Importantly, this detection does NOT confirm malicious activity on its own—legitimate administrators may also add modules for valid purposes.

  ### Investigation Steps

  - **Check Event ID 29 logs:** Review IIS configuration logs for Event ID 29. Focus on parameters under `Configuration` to determine if any unauthorized modules like web shells were added. Look for any unfamiliar or suspicious module names.

  - **Identify added modules:** Cross-reference the added module names against known legitimate IIS modules. If an unfamiliar module appears, assess its purpose and origin, especially if it is not part of standard IIS operations.

  - **Review administrative access:** Investigate who made the changes by checking the `User` field associated with Event ID 29. Legitimate administrators should have corresponding entries in Active Directory or local security logs (Event ID 4624).

  - **Compare with typical configurations:** Access the baseline configuration of the IIS server to identify significant deviations. Legitimate modules usually belong to a known configuration. Document any differences and assess their validity.

  - **Correlate with other alerts:** Look for related anomalies in web server access logs (IIS logs, Event ID 226) around the time the configuration change occurred to see if there were unusual access patterns indicative of exploitation attempt.

  - **Examine the host's role:** Determine the criticality of the host role (e.g., production web server, development environment) to prioritize the response. A change in a production server warrants immediate analysis and potential remediation steps.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the integrity of the web application. If successfully exploited, it could escalate to full system compromise or persistent access by an attacker. While the likelihood of malicious abuse is moderate, the common practice of adding legitimate modules requires careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging for IIS configuration changes is not enabled; configuration logs must be appropriately configured to capture these events. Legitimate activities, such as valid module additions by authorized administrators, may trigger this alert. Additionally, monitoring for related detections, such as unauthorized IIS module usage (e.g., suspicious access patterns to the web application), can strengthen overall coverage against potential threats.

