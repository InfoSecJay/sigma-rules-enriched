title: New Module Module Added To IIS Server
id: dd857d3e-0c6e-457b-9b48-e82ae7f86bd7
status: test
description: Detects the addition of a new module to an IIS server.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://www.microsoft.com/en-us/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
- https://learn.microsoft.com/en-us/iis/get-started/introduction-to-iis/iis-modules-overview
author: frack113
date: 2024-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1562.002
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|contains: '/system.webServer/modules/add'
  filter_main_builtin:
    NewValue:
    - 'AnonymousAuthenticationModule'
    - 'CustomErrorModule'
    - 'DefaultDocumentModule'
    - 'DirectoryListingModule'
    - 'FileCacheModule'
    - 'HttpCacheModule'
    - 'HttpLoggingModule'
    - 'ProtocolSupportModule'
    - 'RequestFilteringModule'
    - 'StaticCompressionModule'
    - 'StaticFileModule'
    - 'TokenCacheModule'
    - 'UriCacheModule'
  filter_main_remove:
    NewValue: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context

  This rule detects the addition of a new module to an IIS server, which can be a vector for persistent backdoors or web shells. Attackers may seek to exploit or manipulate IIS to establish unauthorized access, maintain persistence, or extend their attack surface. The relevant MITRE ATT&CK technique is "Web Shell" (T1505.004), fitting into the execution tactic (TA0002) as this only occurs after an attacker has gained sufficient access to deploy these modifications.

  The primary telemetry source is IIS configuration logs, specifically Event ID 29, which indicates modifications to the server configuration. If malicious, this behavior can lead to unauthorized access or control over the web server. Importantly, this detection alone does not confirm malicious intent; it could result from legitimate administrator activity.

  ### Investigation Steps

  - **Review IIS Configuration Logs:** Check Event ID 29 in IIS logs to identify any recent changes to the server module configuration, specifically the addition of modules (e.g., '/system.webServer/modules/add').
  - **Identify Context of Changes:** Look at the timestamps and user accounts associated with the Event ID 29 logs. Legitimate changes typically originate from known administrator accounts during scheduled maintenance periods.
  - **Correlate Other Events:** Examine related security events that may indicate the context of the change, such as failed logins (Event ID 4625) or unusual administrative activity (Event ID 4662).
  - **Evaluate Added Modules:** Assess the specific modules added by verifying against expected configurations. For example, modules such as "HttpLoggingModule" or "RequestFilteringModule" are common and not inherently malicious, whereas unfamiliar or custom modules should be scrutinized.
  - **Check for Persistence Mechanisms:** Validate if the IIS modules added correspond to known backdoor techniques or web shells by cross-referencing against threat intelligence platforms or resources.
  - **Monitor Network Traffic:** Review outbound traffic from the server for unusual connections or commands (e.g., unusual HTTP methods or destinations) that could signal exploitation or data exfiltration attempts.

  ### Prioritization

  The alert has medium severity due to the potential impact on web server integrity and functionality. Malicious actors often exploit IIS modules for web shells, making this behavior concerning. However, the likelihood of malicious exploitation will depend on the legitimate administrative context of the changes.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion methods such as manipulation of logging settings or hiding changes via legitimate user accounts. Reliable detection requires proper logging configuration in IIS, and operations must ensure comprehensive logging is enabled. Legitimate administrative activities may unintentionally trigger this alert when modules are added for valid operational purposes. Additionally, correlate findings with detection of remote code execution attempts (T1203), which can reinforce the assessment of ongoing attack vector visibility.

