title: ETW Logging/Processing Option Disabled On IIS Server
id: a5b40a90-baf5-4bf7-a6f7-373494881d22
status: test
description: Detects changes to of the IIS server configuration in order to disable/remove
  the ETW logging/processing option.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/sitedefaults/logfile/
author: frack113, Nasreddine Bencherchali
date: 2024-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1562.002
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|endswith: '@logTargetW3C'
    OldValue|contains: 'ETW'
  filter_main_etw_added:
    NewValue|contains: 'ETW'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context
  This rule detects a critical alteration to the Internet Information Services (IIS) server configuration that disables or removes the Event Tracing for Windows (ETW) logging/processing option. Attackers may aim to modify logging settings to hide illicit activities, such as deploying web shells or exploiting vulnerabilities within web applications. By evading logging mechanisms, they reduce the chances of detection by security teams, thereby maintaining persistence within the environment.

  Relevant MITRE ATT&CK techniques include:
  - **T1562.002** - Disable or Modify Tools: This technique encompasses actions taken to disable or modify logging tools or options, such as ETW, to evade detection.
  - **T1505.004** - Web Shell: Modifying configuration files like those for IIS is often a precursor to deploying a web shell for persistent access.

  Primary data sources that would provide the necessary evidence include IIS configuration logs and Windows Event logs specifically related to IIS, which would detail changes to the server configuration settings.

  ### Investigation Steps
  - **Review IIS Configuration Logs**: Analyze the IIS configuration logs for entries pertaining to changes in the logging settings, focusing on Event ID 29 which indicates modifications to the logging configuration.
  - **Check for Unusual Configuration Changes**: Look for discrepancies in configuration settings that correlate with the timing of the change. Pay attention to any alterations that disable essential logging features.
  - **Correlate with Other Security Logs**: Assess other related security log sources, such as Windows Security and Application logs, to identify any actions that may correspond with the disabling of ETW logging or suspicious activities around that timeframe.
  - **Investigate Recent Administrative Activities**: If legitimate administrative behavior is suspected, validate the actions of the administrators against change management policies and the organization’s log retention and monitoring practices.

  ### Prioritization
  Alerts triggered by the disabling of ETW logging on IIS servers are considered high priority because they indicate a potential attempt to evade detection, which can lead to significant security breaches. In an enterprise environment, such obfuscation of logging capabilities could allow attackers to maintain long-term persistence and execute further malicious activities without being noticed.

  ### Blind Spots and Assumptions
  The detection logic may miss changes made through legitimate administrative activities, as described in the false positive section. Additionally, if IIS configuration logs are not being properly collected or if configuration auditing is not enabled, then detection will fail. This strategy assumes all changes to the IIS server configuration are logged and that there are no gaps in logging practices or oversight in administrative permissions that could bypass detection capabilities.

