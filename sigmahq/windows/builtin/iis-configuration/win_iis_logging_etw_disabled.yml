logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|endswith: '@logTargetW3C'
    OldValue|contains: 'ETW'
  filter_main_etw_added:
    NewValue|contains: 'ETW'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects when ETW (Event Tracing for Windows) logging options are disabled or removed from an IIS (Internet Information Services) server's configuration. Such changes could indicate an attacker’s attempt to cover their tracks or disable logging mechanisms to evade detection. The likely objective is to maintain persistence or to conduct other malicious activities without generating traceable logs. This behavior aligns with the MITRE ATT&CK techniques for Defense Evasion (T1562.002) and Persistence (T1505.004).

  Primary telemetry sources include IIS configuration event logs with Event ID 29, indicating changes made to the logging configuration. If malicious, disabling ETW logging can significantly impair the organization’s ability to detect and respond to security incidents. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also result in similar log entries.

  ---

  ### Investigation Steps

  - **Check Event ID 29 for Configuration Changes:** Review the IIS logs for Event ID 29. Examine the `OldValue` and `NewValue` fields to identify any changes related to ETW logging. Any modification that converts ETW options to a different logging target likely indicates malicious intent.

  - **Validate Administrator Activity:** Assess user accounts associated with the log changes. Legitimate administrators should have appropriate roles and responsibilities, and their actions should align with documented maintenance activities. Look for timestamps and remote access patterns that align with known maintenance windows.

  - **Review Recent Activity on the IIS Server:** Investigate other related events in the IIS logs around the same timeframe. Check for changes in site configurations, security permissions, or anomalous user access patterns, which could indicate preparatory steps for an attack.

  - **Identify High-Confidence Malicious Indicators:** Look for patterns of suspicious account activity, such as unexpected timing or frequency of configuration changes by administrators. Changes made by unusual accounts, particularly non-administrative roles, are indicative of potential unauthorized access.

  - **Examine File System for ETW Artifacts:** Check the server's file system for any logs or artifacts that may have been deleted or altered. In a healthy environment, ETW-related logs should exist. Any unexpected absence of these logs could indicate cover-up actions by an adversary.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on the affected IIS server, which often hosts critical web applications. The likelihood of malicious abuse is significant, as disabling logging is a common tactic used by attackers to evade detection during exploitation and post-exploitation phases.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations or lack of complete IIS logging policies. Legitimate administrative activities, such as scheduled maintenance or logged-in administrative tasks, may trigger this alert. Additionally, custom scripts or automation processes that alter logging configurations might not trigger traditional detection measures. Companion detections involving unauthorized changes to user roles or unusual login patterns to the IIS admin console can enhance overall coverage.

