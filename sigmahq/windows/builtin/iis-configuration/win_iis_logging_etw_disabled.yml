title: ETW Logging/Processing Option Disabled On IIS Server
id: a5b40a90-baf5-4bf7-a6f7-373494881d22
status: test
description: Detects changes to of the IIS server configuration in order to 
  disable/remove the ETW logging/processing option.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/sitedefaults/logfile/
author: frack113, Nasreddine Bencherchali
date: 2024-10-06
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1562.002
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|endswith: '@logTargetW3C'
    OldValue|contains: 'ETW'
  filter_main_etw_added:
    NewValue|contains: 'ETW'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the modification of IIS server configuration settings that disable or remove the Event Tracing for Windows (ETW) logging option. The likely attacker objective is to inhibit the logging of their activities or modify logging configurations to facilitate obfuscation during malicious operations, such as web shell deployment or data exfiltration. This behavior aligns with the MITRE ATT&CK techniques of Defense Evasion (T1562.002) and Persistence (T1505.004).

  The primary telemetry source is Windows Event Log, specifically looking for Event ID 29, which captures changes in IIS configuration related to logging settings. If such behavior is malicious, it may signify an increased risk of undetected compromise or persistent access to web server environments. This detection does NOT confirm malicious intent on its own, as legitimate administrative actions could also trigger this event.

  ### Investigation Steps

  - **Review Event ID 29 details:** Check for Event ID 29 in the IIS server logs (Windows Event Log, Log Name: Microsoft-IIS-Configuration) to verify the configuration change details, especially the time, old value, and new value fields. Look specifically for changes indicating a switch from ETW logging.

  - **Compare historical configurations:** Validate if the configuration change aligns with any known authorized maintenance windows or scheduled administrative tasks. Examine logs for entries occurring during business hours versus off-hours.

  - **Identify high-risk changes:** Look for configurations that remove ETW logging (OldValue contains 'ETW', NewValue does not). Correlate these changes with recent access from unusual user accounts or IP addresses in IIS logs.

  - **Check for other mitigation changes:** Investigate whether similar configuration changes are reported on other related web servers. Look for patterns indicating batch changes, potentially targeting multiple installations.

  - **Document legitimate admin behaviors:** Identify typical administrative activities, including scheduled maintenance logs or legitimate patch installs that may coincide with the timing of the event to distinguish benign from malicious behavior.

  - **Cross-reference with web shell detection:** Correlate with any existing detections of web shell components or unusual request patterns in the web server logs (IIS logs: W3C format, with focus on script execution or unusual request methods).

  ### Prioritization

  This alert should be considered medium severity due to the pivotal role of IIS servers in web-facing environments. The likelihood of malicious abuse is significant, particularly in scenarios where adversaries aim to evade monitoring. Additionally, the behavior detected is commonly employed in weaponized attacks targeting web applications.

  ### Blind Spots and Assumptions

  The detection may have limitations if logging configurations are set to non-standard thresholds or settings are not consistently monitored. Attackers may also employ automated scripts to alter settings rapidly, leading to log gaps if low audit levels are set. Legitimate administrative activities, such as restructuring logging configurations during upgrades or maintenance, can trigger this alert. Companion detections such as unauthorized file uploads or sudden changes in web traffic patterns can provide stronger context to assess the risk level.

