title: ETW Logging/Processing Option Disabled On IIS Server
id: a5b40a90-baf5-4bf7-a6f7-373494881d22
status: test
description: Detects changes to of the IIS server configuration in order to 
  disable/remove the ETW logging/processing option.
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/sitedefaults/logfile/
author: frack113, Nasreddine Bencherchali
date: 2024-10-06
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1685.001
- attack.t1505.004
logsource:
  product: windows
  service: iis-configuration
detection:
  selection:
    EventID: 29
    Configuration|endswith: '@logTargetW3C'
    OldValue|contains: 'ETW'
  filter_main_etw_added:
    NewValue|contains: 'ETW'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context

  This rule detects changes to the IIS server configuration that disable or remove ETW (Event Tracing for Windows) logging options. The likely attacker objective is to hinder logging capabilities, making it more difficult to identify malicious activities and to cover their tracks once access has been gained. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Disable or Modify Tools (T1685.001) as well as Modify System Image (T1505.004).

  The primary telemetry source is the Windows Event Log, specifically the IIS configuration logs that may include Event ID 29, indicating changes to the logging settings. If malicious, this behavior can significantly impair the organization's ability to monitor and audit web server activity. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative activities could result in these events.

  ### Investigation Steps

  - **Review Event Details in IIS Logs**: Inspect Event ID 29 from the IIS configuration logs. Check the `OldValue` for 'ETW' and the `NewValue` for indications of logging configuration changes. If `NewValue` no longer indicates 'ETW', this may signal suppression of important logging.

  - **Validate Administrator Activity**: Cross-reference the timestamp of the configuration change with administrator login records (Security Event ID 4624). Look for expected activity and maintenance schedules to determine if this change could be legitimate.

  - **Check for Multiple Changes**: Examine for any patterns of multiple Event ID 29 logs around the same timeframe. A higher frequency of changes can indicate malicious intentions versus legitimate occasional updates.

  - **Assess Companion Tools**: Identify any associated tool usage or file modifications during the timeframe of the alert (e.g., unusual script executions that modify the IIS configuration). Investigate any anomalous creations or modifications in the `C:\inetpub\logs\LogFiles` directory.

  - **Monitor for Additional Evasion Techniques**: Review for other metadata that could suggest evasion, like unexpected .NET application configurations or unusual application pool performance logs that could reveal deeper misconfigurations (e.g., Application Insights data).

  ### Prioritization

  This alert has medium severity as it indicates a critical change in logging capabilities directly affecting the security posture of the IIS server. The likelihood of malicious abuse is moderate due to the common association of similar behaviors with adversarial tactics, particularly in web applications where any suppression of logging is often weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited if logging settings are not properly preserved or if auditing is misconfigured, leading to missed vital logs. Legitimate administrative activity, especially during scheduled maintenance, could mistakenly trigger this alert. A companion detection should include monitoring for unauthorized changes to IIS application configurations (e.g., changes to application pool settings) which can reinforce the detection of malicious activity in conjunction with this rule.

