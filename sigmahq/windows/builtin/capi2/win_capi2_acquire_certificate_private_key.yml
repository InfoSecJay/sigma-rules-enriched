note: |
  ### Technical Context

  This rule detects the acquisition of a certificate private key by an application on Windows systems, which can indicate potential credential theft or misuse of cryptographic assets. The likely attacker objective is to gain unauthorized access to protected resources or impersonate a legitimate service using stolen certificates. This behavior aligns with the MITRE ATT&CK tactic of Credential Access, specifically the technique T1649 (Certificate Services Abuse).

  The primary telemetry source required for this detection is the Windows CAPI2 Operational log, specifically monitoring for Event ID 70. If malicious, the impact can be significant, potentially allowing an attacker to impersonate trusted entities and bypass security controls. It is vital to note that this detection does NOT confirm malicious activity on its own; legitimate applications may also request private key access.

  ### Investigation Steps

  - **Check CAPI2 Operational logs for Event ID 70:** Look for log entries indicating certificate private key acquisitions. Legitimate behavior typically includes timestamps aligned with known application operations or scheduled tasks.

  - **Correlate with application behavior:** Identify the application that acquired the key by examining associated process IDs and ensuring the activity is expected for that application. Unauthorized applications show a high potential for malicious intent.

  - **Review recent certificate activities:** Validate any recent issuance or modification of certificates through Event ID 82 in the CAPI2 logs, which can provide context for whether the private key acquisition aligns with planned security measures.

  - **Identify unusual application execution paths:** Investigate any unexpected file paths or command-line arguments associated with the key acquisition. Legitimate applications typically operate from standard directories (e.g., C:\Program Files), while unusual paths may indicate malicious use.

  - **Monitor for subsequent suspicious transactions:** After a key acquisition, observe for abnormal connection attempts to external IPs or unauthorized access to sensitive resources, which could indicate intended misuse of the acquired keys.

  ### Prioritization

  This alert is of medium severity due to its potential impact on enterprise security. The acquisition of a certificate private key poses a high risk if exploited, enabling attackers to impersonate legitimate services. Although such behavior may not be frequently weaponized in common attacks, its occurrence warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement to enable CAPI2 Operational logging, which is not always configured by default. Legitimate activities, such as applications requesting keys for certificate renewal, may trigger this alert. An additional detection that strengthens coverage is monitoring Event ID 82 (Certificate Request) in conjunction, as it can show the context under which keys are being requested.

