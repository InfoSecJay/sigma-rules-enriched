note: |
  ### Technical Context
  This rule detects the acquisition of a certificate private key on Windows systems by monitoring Event ID 70 from the CAPI2 (Cryptographic Application Programming Interface) Operational log. When an application accesses a certificate's private key, it may indicate potential misuse or unauthorized access, often a precursor to credential theft, data exfiltration, or privilege escalation. Attackers may exploit vulnerabilities in certificate services or use stolen credentials to gain access to sensitive information and perform malicious activities.

  The likely attacker objectives include stealthy lateral movement within an environment, leveraging the compromised certificate for code signing, or invoking legitimate processes to mask their activities. This behavior aligns with the MITRE ATT&CK tactics, specifically **Credential Access** (TA0006) and the technique **Credential Dumping: Certificate Credential Dumping** (T1649).

  Primary data sources for detecting this activity include the CAPI2 Operational logs on Windows systems. These logs must be enabled to provide the necessary telemetry for effective detection.

  ### Investigation Steps
  - **Review CAPI2 Operational Logs**: Examine logs for Event ID 70, noting the timestamp, user accounts involved, and associated application names to determine if the access is suspicious or legitimate.
  - **Analyze Certificate Usage Patterns**: Check for unusual patterns related to certificate utilization, such as access by non-privileged accounts or on machines that typically do not handle certificate management.
  - **Investigate Application Behavior**: Identify applications attempting to acquire certificate private keys—especially unrecognized or unauthorized apps. Utilize process monitoring tools to track the context of their execution.
  - **Cross-reference with User Activity**: Use Active Directory logs to cross-reference the user accounts involved in the event, assessing if there are failed logins or other anomalous behavior leading up to the private key access.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of unauthorized private key access, which could facilitate significant data breaches or unauthorized system access. The likelihood of such attacks can be elevated in environments where sensitive certificates are housed, making this detection critical for protecting organizational assets.

  ### Blind Spots and Assumptions
  This detection may miss legitimate applications that routinely request certificate private keys, leading to potential false positives. The rule assumes that the CAPI2 Operational log is enabled and that all relevant applications are monitored for their activity. If certain applications or services bypass logging or utilize alternate certificate management mechanisms, those activities could remain undetected, creating gaps in the organization's overall security posture. Ensuring comprehensive logging configuration is essential to maintain detection efficacy.

