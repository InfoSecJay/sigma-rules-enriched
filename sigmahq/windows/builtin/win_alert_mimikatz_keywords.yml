logsource:
  product: windows
detection:
  keywords:
  - 'dpapi::masterkey'
  - 'eo.oe.kiwi'
  - 'event::clear'
  - 'event::drop'
  - 'gentilkiwi.com'
  - 'kerberos::golden'
  - 'kerberos::ptc'
  - 'kerberos::ptt'
  - 'kerberos::tgt'
  - 'Kiwi Legit Printer'
  - 'lsadump::'
  - 'mimidrv.sys'
  - '\mimilib.dll'
  - 'misc::printnightmare'
  - 'misc::shadowcopies'
  - 'misc::skeleton'
  - 'privilege::backup'
  - 'privilege::debug'
  - 'privilege::driver'
  - 'sekurlsa::'
  filter:
    EventID: 15      # Sysmon's FileStream Events (could cause false positives when Sigma rules get copied on/to a system)
  condition: keywords and not filter
falsepositives:
- Naughty administrators
- AV Signature updates
- Files with Mimikatz in their filename
level: high
regression_tests_path: 
