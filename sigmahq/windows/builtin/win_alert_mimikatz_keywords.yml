level: high
note: |
  ### Technical Context
  This rule detects the presence of keywords associated with Mimikatz, a well-known tool used for credential extraction and exploitation, in Windows Event Logs. Mimikatz can be used by attackers to extract plaintext passwords, Kerberos tickets, and other sensitive information from memory or to escalate privileges within a compromised environment. The detection logic leverages significant indicators that emerge from both new and lesser-known commands, highlighting a wide range of functionality utilized by different threat actors.

  The primary objectives of attackers leveraging Mimikatz include gaining access to user credentials to conduct lateral movement within networks (ATT&CK technique T1075) and undermining authentication protocols like Kerberos by creating forged tickets (ATT&CK technique T1550). This behavior poses a substantial threat, as successful exploitation can lead to significant breaches and data exfiltration.

  Relevant MITRE ATT&CK techniques include:
  - Credential Dumping (T1003)
  - Lateral Movement (T1021)
  - Abuse Elevation Control Mechanism (T1078)
  - Using Existing Access (T1094)

  Primary data sources for effective detection encompass Sysmon logs for FileStream events, Windows Security Event Logs for user and admin actions, and potentially EDR telemetry for process execution details.

  ### Investigation Steps
  - **Review Sysmon Logs**: Analyze Sysmon FileStream Event logs (EventID 15) for any suspicious process activity or unusual access patterns related to Mimikatz keywords.
  - **Check Security Event Logs**: Examine Windows Security Event Logs for related logon events, particularly those indicating account lockouts or multiple rapid authentication attempts, which may accompany Mimikatz usage.
  - **Analyze EDR Alerts**: Look into EDR telemetry to identify any processes executing Mimikatz or related commands; pay attention to process injection or unusual parent-child relationships indicative of credential dumping.
  - **Investigate Network Traffic**: Inspect network logs for anomalous traffic patterns that may suggest command and control communications or credential harvest attempt behaviors.

  ### Prioritization
  The severity of this alert is high due to the potential for a successful credential dump to allow attackers to move laterally across the network and escalate privileges, leading to data breaches or full domain compromise.

  ### Blind Spots and Assumptions
  This detection rule might miss activity from modified or obfuscated versions of Mimikatz that do not trigger the identified keywords. It also assumes that sufficient logging is enabled on Windows systems to capture the relevant events. Required configurations may include enabling Sysmon with the appropriate Event ID and ensuring that adequate monitoring of Security Event Logs is in place. Additionally, the effectiveness of this rule can be impacted by legitimate administrative activities that may produce false positives, such as authorized credential extraction or antivirus signature updates.

