note: |
  ### Technical Context

  This Sigma rule detects the presence of Mimikatz-related keywords in Windows event logs, specifically targeting actions associated with credential theft and lateral movement. Mimikatz is a well-known tool used by attackers to extract credentials from memory, which can lead to unauthorized access and privilege escalation in a compromised environment, specifically in a Windows domain. The primary MITRE ATT&CK tactics applicable to this detection are Credential Access (attack.t1003) and Lateral Movement (attack.s0002). The relevant telemetry sources include Sysmon logs, particularly File Stream events (Event ID 15), which can capture the execution context of malicious tools like Mimikatz. If malicious, the security impact is significant, potentially compromising multiple user accounts and allowing for further network exploitation. However, this detection does NOT confirm that a successful credential extraction has occurred; it merely indicates that Mimikatz-related actions have been logged.

  ### Investigation Steps

  - **Review detected keywords:** Analyze the event logs for specific Mimikatz keywords like 'sekurlsa::', 'kerberos::tgt', or 'dpapi::masterkey' in Sysmon Event ID 15 logs. Document any unusual occurrences that could indicate malicious activity.

  - **Compare against baseline activity:** Determine if the detected Mimikatz keywords correspond with known benign usage patterns, such as legitimate administrative functions or scheduled tasks that might invoke similar commands.

  - **Identify high-confidence indicators:** Look for repeated occurrences of Mimikatz keywords within a short timeframe in Sysmon logs (Event ID 15), as high frequency may indicate malicious exploitation versus routine administrative activities.

  - **Cross-reference associated user accounts:** Review the user accounts involved in accessing the logs via Security Event ID 4688 (process creation) to identify if any unfamiliar or unauthorized accounts initiated processes associated with Mimikatz.

  - **Investigate file paths and modifications:** Validate that no unauthorized copies of Mimikatz binaries (e.g., mimidrv.sys, mimilib.dll) exist in unexpected directories (e.g., C:\Windows\System32) through File System Event logs (Sysmon Event ID 11).

  - **Assess affected system criticality:** Evaluate the role of the impacted host(s); for example, domain controllers or file servers hold higher risks if compromised due to their importance in credential management and access control.

  ### Prioritization

  Given that Mimikatz is frequently used in real-world attacks to elevate privileges and lateral movement, alerts triggered by this detection should be treated as high severity. The presence of Mimikatz-related keywords could indicate active exploitation or compromised systems, especially in critical enterprise assets.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging in the environment, which is necessary for this analysis. Attackers may employ techniques to obfuscate Mimikatz usage or substitute similar tools that do not trigger these keywords. Legitimate activities, such as administrative tasks involving credential management, can inadvertently trigger this alert. A related detection, such as monitoring for unusual process creation patterns using Windows Event ID 4688, can enhance coverage and provide context for potential threats.

