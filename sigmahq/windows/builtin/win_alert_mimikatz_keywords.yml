logsource:
  product: windows
detection:
  keywords:
  - 'dpapi::masterkey'
  - 'eo.oe.kiwi'
  - 'event::clear'
  - 'event::drop'
  - 'gentilkiwi.com'
  - 'kerberos::golden'
  - 'kerberos::ptc'
  - 'kerberos::ptt'
  - 'kerberos::tgt'
  - 'Kiwi Legit Printer'
  - 'lsadump::'
