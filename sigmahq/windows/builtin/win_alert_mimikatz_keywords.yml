note: |
  ### Technical Context

  This rule detects various Mimikatz operation keywords often used in credential theft attacks. Mimikatz is typically employed by attackers to extract sensitive credentials, manipulate Kerberos tickets, or access secure data. The objective is generally to escalate privileges or maintain persistence within a system. This detection aligns with MITRE ATT&CK tactics: Credential Access (TA0006) and Lateral Movement (TA0008), specifically techniques like Credential Dumping (T1003) and Pass-the-Ticket (T1550).

  Primary telemetry sources include Windows Security logs and Sysmon logs, particularly Event ID 15 for FileStream Events, containing the potential signatures of Mimikatz usage. The security impact of a confirmed detection is high, as it could imply a breach of critical systems. However, this detection does not confirm successful credential extraction or malicious intent on its own, as legitimate administrative activities may also utilize Mimikatz.

  ### Investigation Steps

  - **Check for keyword presence in logs:** Search Sysmon Event ID 15 logs for keywords such as 'sekurlsa::', 'lsadump::', and 'kerberos::tgt'. If multiple keywords are present in a single log, this may indicate malicious activity.

  - **Correlate with user account activity:** Investigate recent logins and actions by user accounts associated with the logs. Compare against expected behavior for those accounts. Look for unusual login times or workstations.

  - **Evaluate Event ID 4624 or 4625:** Cross-reference system logs (Event ID 4624 for successful logins or 4625 for failed logins) during the same timeframe as the detected keywords. Look for accounts that do not match normal behavior patterns.

  - **Identify unrelated legitimate processes:** Confirm that other processes running on the host do not show Mimikatz-related keywords or processes indicating benign administrative functions, such as automated credential management processes.

  - **Review for rogue drivers:** Check for the presence of ‘mimidrv.sys’ or ‘mimilib.dll’ using Sysinternals tools or by querying running processes with a focus on unauthorized drivers or modifications.

  - **Assess alerts from related detections:** Review alerts from other detection rules that capture lateral movement or privilege escalation to get a more comprehensive view of potential credential misuse or system compromise.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and sensitive data access. Given the common use of Mimikatz in active credential theft campaigns, timely investigation is crucial to mitigating risks.

  ### Blind Spots and Assumptions

  Possible evasion techniques include the use of obfuscation or altered Mimikatz versions that may not trigger detection. Reliable detection requires configuring both Sysmon for comprehensive logging and ensuring logs are retained long enough for analysis. Legitimate administrative actions, such as updates or security audits that involve the use of Mimikatz for testing, could trigger the alert. A related detection to consider is one for unusual process creations that link to credential dumping behaviors, enhancing visibility.

