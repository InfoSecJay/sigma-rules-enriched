title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
status: test
description: Detects a suspicious download using the BITS client from a FQDN 
  that is unusual. Adversaries may abuse BITS jobs to persistently execute or 
  clean up after malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
author: Florian Roth (Nextron Systems)
date: 2022-06-10
modified: 2025-02-28
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1197
logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
  filter_main_generic:
    RemoteName|contains:
    - '.azureedge.net/'
    - '.com/'
    - '.sfx.ms/'
    - 'download.mozilla.org/'         # https://download.mozilla.org/?product=firefox-101.0.1-partial-101.0&amp;os=win64&amp;lang=en-US
    - 'cdn.onenote.net/'
    - 'cdn.office.net/'
    - 'tscdn.m365.static.microsoft/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule doesn't exclude other known TLDs such as ".org" or ".net". It's 
  recommended to apply additional filters for software and scripts that leverage
  the BITS service
level: medium
note: |
  ### Technical Context

  This detection rule identifies the use of the Background Intelligent Transfer Service (BITS) for downloading files from remote fully qualified domain names (FQDNs) that are deemed unusual or uncommon. The likely attacker objective is to leverage BITS to download malicious payloads or to maintain persistence, as BITS can operate in the background without raising immediate suspicion. This activity correlates with the MITRE ATT&CK tactics of Persistence (T1197) and Defense Evasion (T1070).

  Primary telemetry sources include Windows event logs specifically looking for Event ID 16403 from the BITS client, which logs job creation activities. The security impact of a malicious download via BITS could include data theft, installation of malware, or maintaining unauthorized access to the system. Importantly, this detection does not confirm malicious intent on its own; legitimate software updates or applications may also use BITS for file downloads.

  ### Investigation Steps

  - **Identify source of BITS jobs:** Check Event ID 16403 in the Windows Event log for details on the process that initiated the BITS job. Review the `RemoteName` field for FQDNs involved in the download.

  - **Examine remote domains:** Analyze the downloaded FQDNs against a list of known safe domains. Look for uncommon or suspicious TLDs, such as those that do not align with typical organizational use or recognized software vendors.

  - **Review historical BITS activity:** Cross-reference recent BITS jobs with historical data to see if there have been any repetitive downloads from the same or related FQDNs. Frequent downloads from obscure sources may indicate potential malicious activity.

  - **Assess legitimate usage:** Determine if any authorized applications or systems within the organization utilize BITS for legitimate purposes. Document any software that may trigger these alerts to contextualize the activity.

  - **Check for high-confidence malicious indicators:** Actively search for the presence of known malicious hashes or files that were downloaded via BITS, particularly focusing on file paths or executables that are unusual or unexpected for the organization.

  ### Prioritization

  This alert is rated medium severity due to the potential for significant impact if malicious downloads occur, especially if associated with sensitive systems. While the use of BITS for downloads is common for legitimate software, the unusual TLDs could indicate an increased likelihood of malicious abuse, making it essential to investigate further.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of filtering rules or legitimate applications that also use BITS for downloads, potentially leading to false positives. Ensuring comprehensive logging of BITS events and maintaining awareness of common benign FQDNs used by organizational applications is crucial for reducing misidentified alerts. Additionally, companion detections such as file execution logs (Event ID 4688 or Sysmon Event ID 1) could provide further context to identify malicious activity stemming from these downloads.

