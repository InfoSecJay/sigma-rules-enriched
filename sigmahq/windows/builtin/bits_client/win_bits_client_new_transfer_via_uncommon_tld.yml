title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
status: test
description: Detects a suspicious download using the BITS client from a FQDN that
  is unusual. Adversaries may abuse BITS jobs to persistently execute or clean up
  after malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
author: Florian Roth (Nextron Systems)
date: 2022-06-10
modified: 2024-12-25
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1197
logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
  filter_main_generic:
    RemoteName|contains:
    - '.azureedge.net/'
    - '.com/'
    - '.sfx.ms/'
    - 'download.mozilla.org/'         # https://download.mozilla.org/?product=firefox-101.0.1-partial-101.0&amp;os=win64&amp;lang=en-US
    - 'cdn.onenote.net/'
    - 'cdn.office.net/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule doesn't exclude other known TLDs such as ".org" or ".net". It's recommended
  to apply additional filters for software and scripts that leverage the BITS service
level: medium
note: |
  ### Technical Context
  This detection rule monitors the Background Intelligent Transfer Service (BITS) for suspicious download activities originating from uncommon or potentially malicious top-level domains (TLDs). Attackers may exploit BITS to conduct various nefarious activities, such as persisting malware, downloading additional payloads, or cleaning traces of their malicious actions. Understanding the TLDs involved is crucial since legitimate software and corporate applications typically use well-known domains for updates and downloads.

  The relevant MITRE ATT&CK tactics for this detection include "Defense Evasion" (ATT&CK ID: T1203) and "Persistence" (ATT&CK ID: T1197). The first allows adversaries to evade detection within established network protocols, while the latter focuses on methods to maintain a foothold in the environment, often through the misuse of legitimate services like BITS. The primary data source for this alert is the Windows BITS client logs, specifically Event ID 16403, which captures details of download activities initiated through this service.

  ### Investigation Steps
  - **Review BITS Logs:** Examine Windows Event logs for Event ID 16403 to identify the full context of the download event, including the source URL and timestamp.

  - **Identify Suspicious TLDs:** Cross-reference the downloads with known malicious TLDs and compare against a list of legitimate application domains, paying particular attention to unusual TLDs that might indicate a potential compromise.

  - **Correlate with Other Data Sources:** Check for additional telemetry from other security tools (like EDR or network traffic analysis) that might indicate related suspicious behavior, such as unusual process creation or outbound connections during the time of the download.

  - **Assess Application Context:** Investigate the application or user account that initiated the BITS download. Look out for any abnormal user behavior or applications that may suggest misuse of BITS.

  ### Prioritization
  The severity of this alert is considered medium because while the detection indicates potential misuse of a legitimate Windows service, not all downloads from uncommon TLDs are necessarily malicious. However, the likelihood of malware being delivered through such channels warrants prompt investigation to mitigate potential threats.

  ### Blind Spots and Assumptions
  This detection logic may have gaps regarding newly registered or less common TLDs that are not included in the filter list, potentially leading to false negatives for emerging threats. The logic assumes that notable downloads via the BITS service correlating with uncommon TLDs are malicious, which may not always be the case; legitimate applications can sometimes source updates from less popular domains. For this detection to function effectively, it requires comprehensive logging of BITS activities, particularly Event ID 16403, which must be enabled and monitored consistently within Windows environments.

