title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
status: test
description: Detects a suspicious download using the BITS client from a FQDN 
  that is unusual. Adversaries may abuse BITS jobs to persistently execute or 
  clean up after malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
author: Florian Roth (Nextron Systems)
date: 2022-06-10
modified: 2025-02-28
tags:
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1197
logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
  filter_main_generic:
    RemoteName|contains:
    - '.azureedge.net/'
    - '.com/'
    - '.sfx.ms/'
    - 'download.mozilla.org/'         # https://download.mozilla.org/?product=firefox-101.0.1-partial-101.0&amp;os=win64&amp;lang=en-US
    - 'cdn.onenote.net/'
    - 'cdn.office.net/'
    - 'tscdn.m365.static.microsoft/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule doesn't exclude other known TLDs such as ".org" or ".net". It's 
  recommended to apply additional filters for software and scripts that leverage
  the BITS service
level: medium
regression_tests_path: 
  regression_data/rules/windows/builtin/bits_client/win_bits_client_new_transfer_via_uncommon_tld/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of a BITS (Background Intelligent Transfer Service) job that attempts to download files from uncommon or suspicious top-level domains (TLDs). Attackers may abuse BITS to stealthily download or execute malicious payloads, leveraging its capabilities to blend in with legitimate traffic. This activity falls under the MITRE ATT&CK tactic of Persistence and Execution (T1197).

  The primary telemetry sources are BITS client logs, specifically Event ID 16403, which record the occurrence of download jobs. If malicious, the impact could involve unauthorized access, data exfiltration, or execution of malware facilitating further compromise. However, this detection does NOT confirm that a download was successful, nor does it guarantee the legitimacy of the source without further context.

  ### Investigation Steps

  - **Review BITS Job Logs:** Check for Event ID 16403 in the BITS logs. Analyze the `RemoteName` field for any unusual TLDs, particularly those not listed as known safe domains (e.g., common corporate or widely trusted domains).

  - **Identify Legitimate Sources:** Compare the detected TLDs against a whitelist of known safe domains used by the organization (e.g., microsoft.com, mozilla.org) to determine benign activity.

  - **Inspect Process Creation:** Look for associated process creation events, particularly Windows Security Event ID 4688 or Sysmon Event ID 1, that include the BITS client executable (e.g., `bitsadmin.exe`). Legitimate use will typically show BITS activity related to software updates or internal applications.

  - **Assess Network Traffic:** Analyze network logs to see if the suspicious TLD correlates with unexpected network connections. Reference firewall or proxy logs for unusual outbound connections, particularly focusing on HTTP status codes and requested URLs.

  - **Determine User Context:** Investigate the user account associated with the BITS job. Check for patterns in usage history; user accounts with no history of utilizing BITS may be a red flag.

  - **Check for Exfiltration Patterns:** Validate any anomalies by looking for file creation or access events that follow a similar timeline. Look for file types commonly associated with malware, such as executable files (e.g., .exe, .dll) that could follow a BITS transfer.

  ### Prioritization

  This alert carries medium severity due to the potential for malicious abuse of the BITS service, particularly in a high-value environment. The likelihood of adversaries implementing such techniques is notably raised given that BITS can facilitate stealthy operations. However, the specificity of the detected TLD will vary, necessitating further investigation to assess risk appropriately.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of BITS logs; ensure that logging for this service is enabled comprehensively. Legitimate activities may inadvertently trigger this alert, especially when using less common TLDs for valid applications. Additionally, an effective companion detection could involve monitoring the `bitsadmin` command-line parameters to further filter out benign uses of the BITS service.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
