title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
status: test
description: Detects a suspicious download using the BITS client from a FQDN 
  that is unusual. Adversaries may abuse BITS jobs to persistently execute or 
  clean up after malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
author: Florian Roth (Nextron Systems)
date: 2022-06-10
modified: 2025-02-28
tags:
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1197
logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
  filter_main_generic:
    RemoteName|contains:
    - '.azureedge.net/'
    - '.com/'
    - '.sfx.ms/'
    - 'download.mozilla.org/'         # https://download.mozilla.org/?product=firefox-101.0.1-partial-101.0&amp;os=win64&amp;lang=en-US
    - 'cdn.onenote.net/'
    - 'cdn.office.net/'
    - 'tscdn.m365.static.microsoft/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule doesn't exclude other known TLDs such as ".org" or ".net". It's 
  recommended to apply additional filters for software and scripts that leverage
  the BITS service
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the Background Intelligent Transfer Service (BITS) to download content from remote fully qualified domain names (FQDNs) that are not commonly associated with legitimate operations, such as software updates or corporate asset downloads. Such behavior can indicate the use of BITS for malicious purposes, such as downloading and executing malware to maintain persistence on a compromised host. The relevant MITRE ATT&CK technique is **T1197: BITS Jobs**.

  The primary telemetry sources include Windows Event ID **16403**, which logs actions taken by the BITS client, allowing for the detection of suspicious downloads. If identified as malicious, this activity could lead to unauthorized persistence on the affected system or facilitate further malicious operations. However, this detection does NOT confirm that a compromise has occurred without additional evidence of malicious payloads or execution.

  ### Investigation Steps

  - **Review BITS Job Creation Event:** Examine Windows Event ID **16403** for the specific timestamps correlated with the alert. Look for details in the `RemoteName` field to identify the FQDN used in the download.

  - **Cross-reference with known benign domains:** Identify if the `RemoteName` contains known benign services (e.g., `*.microsoft.com`, `*.mozilla.org`). If the FQDN matches one of these, it may be a legitimate download.

  - **Analyze download patterns:** Determine the process that invoked BITS by checking associated Event ID **4688** for the parent process that initiated the BITS job. Compare this to known legitimate processes; unusual parents may indicate malicious intent.

  - **Validate downloaded file content:** If possible, identify any files created in the `%TEMP%` directory or other common download locations following the BITS job. Use file hashes and antivirus scanning to check for known malware signatures.

  - **Review asset criticality:** Assess the host's role in the network (e.g., whether it is a critical server or workstation); higher-risk assets warrant immediate further investigation and potential containment.

  - **Document related historical events:** Check for other recent job executions with similar anomalies using Windows Logs or Sysmon data. Common legitimate BITS operations should normally show signatures of expected FQDNs associated with updates or internal tools.

  ### Prioritization

  The alert should be treated with medium severity due to the potential impact on the system's integrity, especially if related to a critical asset. While BITS is frequently utilized for legitimate software updates, exploit attempts using this service for downloading malicious payloads are noted, thus increasing likelihood of abuse.

  ### Blind Spots and Assumptions

  This detection may miss BITS jobs that utilize familiar TLDs, as it only identifies unusual domains. Required log sources for reliable detection include configurations that enable BITS logging. Legitimate software installations and updates could trigger similar alerts, especially when utilizing BITS for background downloads. A companion detection for active monitoring could include logging for suspicious PowerShell executions (e.g., leveraged to create BITS jobs) which can reinforce overall situational awareness.

