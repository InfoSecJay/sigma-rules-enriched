title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
status: test
description: Detects a suspicious download using the BITS client from a FQDN 
  that is unusual. Adversaries may abuse BITS jobs to persistently execute or 
  clean up after malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
author: Florian Roth (Nextron Systems)
date: 2022-06-10
modified: 2024-12-25
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1197
logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
  filter_main_generic:
    RemoteName|contains:
    - '.azureedge.net/'
    - '.com/'
    - '.sfx.ms/'
    - 'download.mozilla.org/'         # https://download.mozilla.org/?product=firefox-101.0.1-partial-101.0&amp;os=win64&amp;lang=en-US
    - 'cdn.onenote.net/'
    - 'cdn.office.net/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule doesn't exclude other known TLDs such as ".org" or ".net". It's 
  recommended to apply additional filters for software and scripts that leverage
  the BITS service
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the Background Intelligent Transfer Service (BITS) to download files from uncommon or suspicious top-level domains (TLDs). This behavior could indicate an adversary attempting to leverage BITS for persistence or to conduct post-exploitation activities, as BITS is often used to download or manage updates for legitimate software. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "T1197 - BITS Employee" which is related to persistent execution of malicious payloads.

  The primary telemetry sources include Windows Event Logs, specifically Event ID 16403, which captures BITS client activity, including job creation and file transfer details. Potential security impacts include the execution of malicious payloads, data exfiltration, or lateral movement within the network. It is important to note that the creation of BITS transfer jobs does not confirm malicious activity on its own, as legitimate applications may also use BITS for downloading updates.

  ### Investigation Steps

  - **Review captured BITS transfers**: Locate Event ID 16403 in the Windows Event Logs to identify the specific BITS job details and the remote domain used in the transfer.

  - **Evaluate the remote TLD**: Determine if the remote name belongs to a known benign source, such as Microsoft's domains (e.g., `cdn.onenote.net`, `cdn.office.net`). If the TLD is uncommon or has a history of being abused (e.g., `.xyz`, `.site`), this may indicate malicious behavior.

  - **Identify created files**: Check the file system for any artifacts or files created by the BITS transfer, particularly in default download directories. E.g., use Sysinternals’ Process Monitor to observe file system activity for modifications around the time of the event.

  - **Compare with legitimate behaviors**: Establish a baseline of expected BITS activity by reviewing logs for known software update patterns (e.g., Microsoft application updates). Any discrepancies could suggest unauthorized use.

  - **Correlate with additional alerts**: Cross-reference findings against other security alerts or logs, such as firewall logs, for unusual outbound connections that align with BITS jobs appearing malicious or foreign.

  - **Document investigation results**: Capture the findings of exited connections, registry changes, or indicators of later stage activities suggesting compromise or lateral movement within the network.

  ### Prioritization

  This alert is medium severity due to its potential to indicate misuse of a commonly used service for malicious purposes. While downloads initiated via BITS are not uncommon, the use of suspicious TLDs significantly raises the risk of abuse and exploitation, especially if combined with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate applications could also use BITS to interact with domains not included in the filter. Also, varying endpoint security configurations may not log or provide adequate detail for BITS activities consistently. Common legitimate activities that may trigger this alert include regular updates for enterprise applications. A related detection to strengthen coverage would be monitoring for unusual application behaviors or powershell scripts invoking BITS unexpectedly.

