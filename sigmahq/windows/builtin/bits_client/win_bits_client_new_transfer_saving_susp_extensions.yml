logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
    LocalName|endswith:
            # TODO: Extend this list with more interesting file extensions
    - '.bat'
    - '.dll'
    - '.exe'         # TODO: Might wanna comment this if it generates tons of FPs
    - '.hta'
    - '.ps1'
    - '.psd1'
    - '.sh'
    - '.vbe'
    - '.vbs'
  filter_optional_generic:
        # Typical updates: Chrome, Dropbox etc.
    LocalName|contains: '\AppData\'
    RemoteName|contains: '.com'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- While the file extensions in question can be suspicious at times. It's best to
  add filters according to your environment to avoid large amount false 
  positives
level: medium
regression_tests_path: 
  regression_data/rules/windows/builtin/bits_client/win_bits_client_new_transfer_saving_susp_extensions/info.yml
note: |
  ### Technical Context

  This rule detects the initiation of a Background Intelligent Transfer Service (BITS) job that saves local files with potentially suspicious extensions such as `.bat`, `.exe`, `.hta`, and others commonly associated with scripting or executable file types. The likely attacker objective here is to deliver malicious payloads or scripts to the endpoint for execution, aligning with tactics aimed at persistence (T1547), execution (T1203), and stealth (T1173). The primary telemetry sources for this detection are Windows Event Logs, particularly Event ID 16403 generated by the BITS service, which logs the creation of new transfer jobs.

  If the identified BITS transfer job is indeed malicious, it could serve as a mechanism to deploy malware or facilitate other malicious activities while evading traditional security tools. Importantly, this detection does NOT confirm that the delivered file is harmful; it merely indicates the downloading of files with suspicious extensions, which may warrant further investigations.

  ### Investigation Steps

  - **Retrieve BITS Job Details:** Obtain logs for Event ID 16403 from the Windows Event Viewer under Applications and Services Logs > Microsoft > Windows > BITS-Client > Operational. Look for `LocalName`, noting any files saved with suspicious extensions.

  - **Inspect the Directory Path:** Check the `LocalName` field for file paths indicating user profiles, especially under `C:\Users\<username>\AppData\`. Legitimate applications typically do not save `.exe` or `.bat` files here, so anything found could be suspect.

  - **Analyze File Behavior:** For files identified by the previous steps, confirm their behavior and purpose. Conduct a hash analysis against known databases (e.g., VirusTotal) to see if the files are recognized as malicious.

  - **Identify User Context:** Review relevant logs from the Security Event Log (Event ID 4624) to attribute the BITS job to a specific user account. Look for unusual administrative accounts or accounts with no legitimate reason to download files.

  - **Monitor for Execution Attempts:** Check for subsequent execution attempts of the downloaded files. This can include review of Event ID 4688 (Process Creation) to track if files with the suspicious extensions are executed soon after the BITS transfer.

  ### Prioritization

  This alert holds medium severity due to the potential for impact on critical systems if malicious payloads are executed. While not every use case for BITS transfer jobs is malicious, the likelihood of abuse for downloading executable files warrants timely investigation, especially as similar techniques are often weaponized in multi-stage attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded through whitelisting of specific extensions or by using non-suspicious file types. Additionally, environments not configured to log BITS activity may miss these events entirely. Legitimate activities might include automatic updates or installations by trusted software, which could fire this alert if they utilize suspicious extensions. A related detection that strengthens coverage includes monitoring for the execution of scripts (e.g., via Powershell logs), which could follow BITS file downloads.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
