logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
    LocalName|endswith:
            # TODO: Extend this list with more interesting file extensions
    - '.bat'
    - '.dll'
    - '.exe'         # TODO: Might wanna comment this if it generates tons of FPs
    - '.hta'
    - '.ps1'
    - '.psd1'
    - '.sh'
    - '.vbe'
    - '.vbs'
  filter_optional_generic:
        # Typical updates: Chrome, Dropbox etc.
    LocalName|contains: '\AppData\'
    RemoteName|contains: '.com'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- While the file extensions in question can be suspicious at times. It's best to
  add filters according to your environment to avoid large amount false 
  positives
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the initiation of BITS (Background Intelligent Transfer Service) transfer jobs that download files with potentially suspicious extensions, such as executable files (.exe, .bat) and script files (.ps1, .vbs). The likely objective of an attacker is to exploit BITS for stealthy file downloads, aiding in malware installation or data exfiltration while evading traditional detection mechanisms.

  This behavior is aligned with the MITRE ATT&CK tactics of Persistence (TA0003) and Execution (TA0002), specifically under technique T1197: BITS Jobs. The primary telemetry source for this detection comes from Windows event logs, specifically Event ID 16403 from the BITS client, which logs details about BITS transfer jobs. If such activity is malicious, it could lead to unauthorized code execution or the establishment of persistence on the system. It is important to note that this detection alone does not confirm malicious intent; it may also capture benign file transfers for legitimate updates or installations.

  ### Investigation Steps

  - **Check Event ID for BITS Jobs**: Investigate Event ID 16403 logs in the Windows Event Viewer under the `Applications and Services Logs > Microsoft > Windows > BITS-Client` category to identify the transfer job's `LocalName` and `RemoteName`.

  - **Review file extensions**: Analyze the downloaded file's extension; extensions like `.exe`, `.bat`, and `.ps1` are suspicious in context. Verify if downloaded files are present in the specified folders (e.g., `C:\Users\<username>\AppData\Local\Temp\`).

  - **Validate legitimate BITS transfers**: Confirm if the downloaded content is related to common legitimate applications (e.g., Chrome or Dropbox updates) and cross-reference the download source with known software vendors' signature IPs or domains.

  - **Identify unusual remote sources**: Determine if the `RemoteName` contains suspicious domains or IPs, especially those known for distribution of malware. Any unusual hosts should warrant higher scrutiny.

  - **Correlate with other telemetry**: Cross-examine the detected BITS activity with the process creation logs (Event ID 4688) to check if a newly created process executes the downloaded file, as this can be a strong indicator of malicious behavior.

  - **Assess asset criticality**: Evaluate the purpose and criticality of the affected asset to prioritize investigation; for instance, servers handling sensitive data should be treated with higher urgency in case of suspicious BITS transfer jobs.

  ### Prioritization

  This alert carries medium severity due to the potential for significant security impact if a critical system is compromised through unauthorized file downloads. The behavior is less common in standard operations, indicating a reasonable likelihood of malicious abuse, particularly in targeted attack scenarios.

  ### Blind Spots and Assumptions

  Detection may miss transient BITS jobs if they complete quickly and relevant logs are not retained or captured. Additionally, established whitelisted applications transferring files may generate false positives. Ensure that logging configurations for BITS are appropriately set to capture necessary events. A companion detection could involve monitoring PowerShell usage (e.g., Event ID 4104) to identify any script execution like those downloading from the detected suspicious extensions, enhancing overall detection fidelity.

