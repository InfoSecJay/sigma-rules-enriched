logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
    LocalName|endswith:
            # TODO: Extend this list with more interesting file extensions
    - '.bat'
    - '.dll'
    - '.exe'         # TODO: Might wanna comment this if it generates tons of FPs
    - '.hta'
    - '.ps1'
    - '.psd1'
    - '.sh'
    - '.vbe'
    - '.vbs'
  filter_optional_generic:
        # Typical updates: Chrome, Dropbox etc.
    LocalName|contains: '\AppData\'
    RemoteName|contains: '.com'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- While the file extensions in question can be suspicious at times. It's best to add
  filters according to your environment to avoid large amount false positives
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify potentially malicious BITS (Background Intelligent Transfer Service) transfer jobs that save local files with suspicious file extensions such as `.bat`, `.dll`, `.exe`, `.hta`, `.ps1`, `.psd1`, `.sh`, `.vbe`, and `.vbs`. BITS is often exploited by attackers to evade detection while downloading malicious payloads or tools quietly in the background. The likelihood is that an attacker aims to maintain persistence, deploy malicious scripts, or execute harmful binaries without raising immediate alarms.

  Relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (T1140)**, where attackers attempt to evade detection methods when transferring malicious payloads, and **Persistence (T1197)**, where malicious software is retained on a system. The primary data source for this rule comes from Windows logs related to BITS transfer jobs, particularly Event ID 16403, which provides insights into file downloads initiated by this service.

  ### Investigation Steps
  - **Review BITS Transfer Logs:** Examine the logs for Event ID 16403 to identify any recent BITS jobs, focusing on the specific file extensions flagged by the rule. Look for patterns that might indicate malicious intent, such as unusual remote sources.

  - **Collect Local File Information:** For any identified suspicious files, further investigate their properties (e.g., file size, creation date, and digital signatures) to ascertain their legitimacy and to determine if they correlate with any known threats.

  - **Analyze Network Connections:** Inspect network activity corresponding to the time of the BITS job to identify any outgoing connections to potentially malicious external sites, particularly those ending in `.com`, which may suggest data exfiltration or communication with command-and-control servers.

  - **Correlate with Other Telemetry:** Use other telemetry sources such as endpoint protection logs, process creation events, and system behavior data to correlate activities related to the identified files and the BITS transfer job to uncover any deeper malicious behavior.

  ### Prioritization
  This alert is of **medium** severity due to the potential risk of persistent threats being established via malicious file downloads. Attackers frequently use BITS to avoid detection, so timely investigation is critical to mitigate any possible harm.

  ### Blind Spots and Assumptions
  This detection rule may miss certain instances of malicious activity if attackers utilize non-standard file extensions or use encrypted communication channels to obscure file transfers. The detection logic assumes that typical file download activities do not generate high false-positive rates, but this may vary by environment. Additionally, without proper configurations for BITS logging, this detection may not function correctly, emphasizing the need for organizations to ensure comprehensive logging of Windows event IDs relevant to file transfers.

