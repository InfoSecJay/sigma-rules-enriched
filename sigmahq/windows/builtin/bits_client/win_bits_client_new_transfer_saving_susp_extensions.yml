logsource:
  product: windows
  service: bits-client
detection:
  selection:
    EventID: 16403
    LocalName|endswith:
            # TODO: Extend this list with more interesting file extensions
    - '.bat'
    - '.dll'
    - '.exe'         # TODO: Might wanna comment this if it generates tons of FPs
    - '.hta'
    - '.ps1'
    - '.psd1'
    - '.sh'
    - '.vbe'
    - '.vbs'
  filter_optional_generic:
        # Typical updates: Chrome, Dropbox etc.
    LocalName|contains: '\AppData\'
    RemoteName|contains: '.com'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- While the file extensions in question can be suspicious at times. It's best to
  add filters according to your environment to avoid large amount false 
  positives
level: medium
note: |
  ### Technical Context

  This detection identifies the initiation of potentially malicious BITS (Background Intelligent Transfer Service) transfer jobs that download files with suspicious extensions such as '.exe', '.bat', and '.vbs'. The objective of an attacker leveraging BITS is typically to persistently install malware or conduct lateral movement within an environment without raising immediate suspicion. This behavior aligns with the MITRE ATT&CK technique T1197: BITS Transfer, which indicates a method of software distribution or transfer often exploited for covert data retrieval or payload delivery.

  The primary telemetry source for this detection is the BITS client logs, specifically focusing on Event ID 16403, which captures the creation of transfer jobs and the details related to the downloaded files. If the downloaded files are indeed malicious, they can be used to execute arbitrary code or maintain presence on compromised systems. However, it is important to note that the mere detection of a BITS transfer involving these file extensions does not confirm malicious intent; legitimate software may also use these extensions during updates.

  ### Investigation Steps

  - **Examine BITS transfer details:** Review Event ID 16403 for the specifics of the BITS transfer job, including the `LocalName` and `RemoteName` fields. Look for downloads to `%AppData%` targeting suspicious extensions.

  - **Identify benign behavior:** Look for common Windows system updates or legitimate application transfers, such as those from known vendors (e.g., `google.com`, `microsoft.com`, etc.). Compare the `RemoteName` against an approved vendor list to distinguish between benign and potentially harmful transfers.

  - **Validate local file presence:** Check the file system at the path indicated in the `LocalName` of the transfer to confirm the presence of the downloaded file. Note any files ending in '.exe', '.bat', or '.vbs', which may be indicative of malicious intent.

  - **Cross-reference with active processes:** Use tools such as Sysinternals to list processes and verify if any recent downloads are associated with newly created or running processes. Focus on execution paths originating from `%AppData%` or similar locations.

  - **Review for high-confidence indicators:** Observe the usage of unusual download sources within the BITS logs. High-risk indicators include domains with string components typical of adversarial infrastructure or IP addresses known for malicious activity.

  ### Prioritization

  The alert is of medium severity primarily due to its potential impact on the system and its ability to facilitate malware deployment. While BITS traffic is common for software updates, the use of suspicious file extensions raises the likelihood of malicious activity. This technique is known to be weaponized by attackers for stealthy data downloads and persistent access.

  ### Blind Spots and Assumptions

  Detection may be limited by benign uses of BITS for legitimate software updates, leading to potential false positives if not appropriately filtered. Reliable detection requires proper logging configurations for the BITS service and retention of Event ID 16403 logs. Additionally, actors may leverage common file extensions in legitimate processes, which could trigger the alert. A related detection, such as monitoring for unusual process creations linked to BITS downloads (using Event ID 4688), could enhance coverage and reliability against evasion tactics.

