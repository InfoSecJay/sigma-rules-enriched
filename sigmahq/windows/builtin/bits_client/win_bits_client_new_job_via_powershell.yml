note: |
  ### Technical Context
  This detection rule monitors for the creation of a new Background Intelligent Transfer Service (BITS) job via PowerShell. BITS is a Windows service that facilitates asynchronous file transfers between a client and a server, often used for updates and large downloads. Attackers may exploit BITS for malicious purposes, such as transferring exfiltrated files or downloading additional payloads, while aiming to evade detection. By leveraging PowerShell for these actions, they can blend in with legitimate administrative activities, complicating detection efforts.

  The suspected threat behavior aligns with the MITRE ATT&CK framework, specifically under the tactics of **Defense Evasion** and **Persistence**. The relevant technique associated with this detection is T1197, which describes the use of BITS jobs to perform potentially harmful activities without triggering standard security measures. Analysts should primarily focus on logs generated by the BITS client and PowerShell execution events to identify malicious activity effectively.

  Key data sources for validating potential alerts include:
  - BITS client logs, capturing job events
  - PowerShell script execution logs, detailing commands run in the environment
  - Security Event logs, particularly those logging process creation events on Windows systems

  ### Investigation Steps
  - **Review BITS Logs:** Analyze the BITS client logs to identify newly created jobs, particularly those initiated from unexpected or unusual sources.
  - **Examine PowerShell Execution Logs:** Look into historical PowerShell command logs for any commands associated with job creation related to BITS, focusing on any obfuscated or atypical script executions.
  - **Detect Anomalous Process Execution:** Investigate security event logs for instances of `powershell.exe` or `pwsh.exe` initiating BITS jobs, and cross-reference with known good scripts or administrator activities to rule out false positives.
  - **Correlate with Other Security Tools:** Use the data from other security solutions (e.g., EDR, SIEM) to assess related network or filesystem activities during the same timeframe to uncover potentially suspicious behavior correlating with the BITS job creation.

  ### Prioritization
  Despite the low-severity classification, this alert should not be overlooked due to the potential for abuse in evading detection and establishing persistence. Given the context of enterprise environments, any abnormal use of BITS for file transfers requires immediate scrutiny.

  ### Blind Spots and Assumptions
  This detection relies on proper logging configuration of the BITS client and PowerShell execution policies. If logs are not enabled or PowerShell command logging is misconfigured, malicious activities may go unnoticed. Additionally, the rule may not correlate well with legitimate administrative tasks; hence, it assumes a baseline understanding of normal PowerShell activity within the environment. Any overlooked benign usages of BITS or legitimate administrative scripts can lead to false positives that may overwhelm security analysts.

