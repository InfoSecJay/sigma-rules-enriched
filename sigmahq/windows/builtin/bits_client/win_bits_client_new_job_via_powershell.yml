note: |
  ### Technical Context

  This Sigma rule detects the creation of a new Background Intelligent Transfer Service (BITS) job via PowerShell commands, indicating potential misuse for data exfiltration or malware persistence. The likely attacker objective is to enable covert data transfers while evading conventional detection methods. This behavior relates to the MITRE ATT&CK tactic of Persistence (T1547) and Execution (T1203), specifically the technique of BITS Jobs (T1197).

  The primary telemetry source is the Windows Event Log with Event ID 3 from the BITS client, which tracks job creation events. Malicious usage of BITS can lead to undetected data exfiltration, posing significant security risks. This detection does NOT confirm that the activity is malicious without further context; it could be legitimate administrative activity as noted in the false positive examples.

  ### Investigation Steps

  - **Check BITS Job Details**: Review the specific BITS job attributes through Windows Event Logs (Event ID 3). Look for jobs with unusual names or targeting unexpected external IP addresses.

  - **Correlate with PowerShell Activity**: Verify PowerShell commands executed around the same time by checking Security Event ID 4688 for process creation logs. Look for `powershell.exe` or `pwsh.exe` calls that are invoked by non-standard user accounts.

  - **Validate User Context**: Determine the user context of the command. Legitimate administrative actions should correlate with the intended administrative users and system roles, especially looking for actions originating from system administrators.

  - **Search for Related Network Traffic**: Investigate outbound network traffic logs for unusual activity correlating with the BITS job creation time. Look specifically for traffic patterns associated with data exfiltration or connections to untrusted external IP addresses.

  - **Review Alternatives to BITS**: Examine if alternative data transfer methods (e.g., FTP, HTTP uploads) were used in conjunction with the BITS job. Search for relevant logs (Firewalls/Sysmon Network connections) indicating file transfers that coincide with the job event.

  ### Prioritization

  The severity of this alert is low, as the event may be generated through legitimate administrative actions, but the potential misuse of BITS for stealthy data exfiltration warrants attention. Detection of this behavior also raises the likelihood of malicious activity due to its common utility in obfuscating data transfers.

  ### Blind Spots and Assumptions

  This detection may miss cases where BITS jobs are created through legitimate methodologies and can bypass detection if administrative scripts use standard job names. Accurate detection depends on having Windows Event Logs properly configured to capture Event ID 3. Legitimate BITS jobs may trigger this alert, particularly those initiated by system maintenance scripts. Companion detections, such as monitoring for unusual PowerShell usage or scrutinizing scheduled tasks, can provide additional context to strengthen incident response efforts.

