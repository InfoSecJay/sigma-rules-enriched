note: |
  ### Technical Context

  This Sigma rule detects the creation of a new BITS (Background Intelligent Transfer Service) job using PowerShell. Attackers may leverage BITS to execute file transfers or downloads stealthily, allowing them to transfer malicious payloads or exfiltrated data while evading detection. This behavior typically fits within the MITRE ATT&CK framework under Tactic: Defense Evasion (TA0005), Technique: Bypass User Account Control (T1088) and Miscellaneous, specifically T1197 (Bait and Switch).

  The primary telemetry sources are Windows Event Logs, particularly focusing on Event ID 3 from the BITS client. The security impact is significant if exploited for malicious purposes, as it could facilitate unauthorized data transfer or implant malware. It is crucial to note that this detection does NOT confirm malicious intent by itself; legitimate administrative tasks could trigger similar alerts.

  ### Investigation Steps

  - **Review Event ID 3 logs for BITS job creation:** Examine Windows Event Logs for Event ID 3. Look for PowerShell processes (processPath ending with '\powershell.exe' or '\pwsh.exe') which indicate a new BITS job was created. Check user context to differentiate between normal admin and potentially malicious actions.

  - **Identify the user context:** Verify the user who executed the PowerShell command that triggered the alert. Look for administrative accounts against expected user behavior, as unauthorized users initiating BITS jobs may indicate malicious activity.

  - **Correlate PowerShell execution logs:** Analyze PowerShell execution logs (Event ID 4103) and command-line arguments. Look for suspicious PowerShell commands that could indicate an attempt to manipulate BITS for unintended purposes, such as downloading executables or scripts.

  - **Validate presence and content of BITS jobs:** Use the `Get-BitsTransfer` PowerShell command to list currently active BITS jobs on the host. Investigate job URLs and status—malicious jobs may have URLs pointing to external servers or unusual destinations not typically accessed by your organization.

  - **Check for benign administrative activities:** Document legitimate scenarios where BITS jobs are created, such as system updates or approved maintenance scripts performed by IT personnel. Compare any available job descriptions against known legitimate activities.

  - **Look for concurrent suspicious events:** Correlate this alert with other logs, such as process creation logs (Event ID 4688) or network traffic logs that show outbound connections shortly after the BITS job was created. Such associations may indicate an active attack to transfer data or execute payloads.

  ### Prioritization

  This alert is of low severity in a mature enterprise context due to a history of benign administrative activities that could trigger the detection. However, the likelihood of malicious abuse exists as BITS is often exploited for stealthy data transfers. Awareness of common tactics that employ BITS is essential, particularly as they relate to data exfiltration and file delivery mechanisms.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by using legitimate administrative tools or configurations. Organizations must ensure that logs from the BITS client are consistently collected. Legitimate activities, such as scheduled updates or approved PowerShell scripts, may also trigger this alert. A companion detection worth noting is monitoring for common PowerShell invocation patterns or commands associated with malicious actors, enhancing the coverage for abnormal BITS job behaviors.

