note: |
  ### Technical Context

  This rule detects BITS (Background Intelligent Transfer Service) transfer jobs that download files from direct IP addresses rather than domain names. This behavior could indicate an attempt by an attacker to bypass DNS filtering controls, using BITS as a method to download malicious files or payloads covertly. The likely objective of such an action is to facilitate further exploitation or data exfiltration without raising alarms.

  This detection relates to the MITRE ATT&CK technique T1197: BITS Administration Tool, which falls under the tactic of Defense Evasion. The primary telemetry source includes Windows Event logs, specifically Event ID 16403 signifying a BITS transfer job. If detected, the security impact could be serious, potentially leading to compromised systems or data loss. However, this detection does NOT confirm that the download is malicious without additional context and investigation.

  ### Investigation Steps

  - **Review Event ID 16403 details**: Check the Windows Event logs for Event ID 16403. Look for the `RemoteName` field to identify the IP address or host from which the file was downloaded. Malicious indicators include non-local IP addresses and known malicious IP ranges.

  - **Investigate the downloaded files**: If the download was initiated, validate the content of the files downloaded. Use file integrity monitoring to check for unexpected file creations within critical directories (e.g., System32, User's Downloads). Legitimate BITS usage typically involves downloads from trusted domains.

  - **Cross-reference with other logs**: Examine other logs (Application logs, Sysmon Event ID 10) to cross-reference process creation and file access patterns related to the BITS service. Look for unusual executable files being run shortly after the download, which may indicate malicious execution.

  - **Validate system configuration for BITS**: Confirm if the BITS service is utilized correctly as intended for legitimate updates by reviewing group policies and deployed applications that might use BITS for updates. Common benign usage may involve Microsoft products.

  - **Identify historical data**: Review historical BITS transfer jobs on the system to identify any patterns or recurring suspicious activity. Any unexplained transfers outside of established operational procedures are potential red flags.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems if malicious downloads are executed. The likelihood of abuse from direct IP addresses is significant, as attackers may attempt to curry favor from legitimate BITS usage to blend in with normal traffic. Downloading files from direct IPs is a known tactic employed in various attacks.

  ### Blind Spots and Assumptions

  Detection might be circumvented if the attacker uses a DNS name, as certain configurations and network conditions might not trigger the alert. Reliable detection requires full BITS logs enabled, ensuring all Event ID 16403 logs are captured and monitored. Legitimate usage might occur if an application or service needs to fetch updates from a known direct IP, impacting the number of false positives. A related detection such as monitoring for the execution of downloaded executables (e.g., via Sysmon Event ID 1) can strengthen coverage and corroborate suspicious activities linked to BITS transfers.

