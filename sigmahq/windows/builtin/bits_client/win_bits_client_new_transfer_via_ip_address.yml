note: |
  ### Technical Context
  This detection rule identifies the use of Background Intelligent Transfer Service (BITS) to download files from direct IP addresses, which may indicate malicious activity. Attackers often utilize BITS for covertly transferring files due to its built-in ability to prioritize network traffic, thereby making it less noticeable. The observed behavior could potentially align with data exfiltration efforts, malware downloads, or the execution of other unauthorized tools on a compromised system.

  The relevant MITRE ATT&CK tactics and techniques this rule pertains to include **Defense Evasion** (T1203) and **Persistence** (T1197). Attackers may exploit BITS to maintain persistence by downloading payloads or configurations directly from hardcoded, known malicious IP addresses rather than relying on domain names that could be monitored or blacklisted.

  Primary data sources for this detection should include logs from the Windows BITS service, as well as telemetry related to network traffic, such as firewalls or proxy logs that capture outbound connections. These logs will provide the necessary evidence to establish whether such transfers are legitimate or potentially harmful.

  ### Investigation Steps
  - **Review BITS Transfer Logs:** Check Windows Event Logs for Event ID 16403 to identify any recent BITS transfer activities and investigate the associated files and their sources.
  - **Analyze Remote Connections:** Investigate any outbound connections to the remote IP addresses noted in the alerts to confirm if they have been linked to malicious activity or known bad actors.
  - **Examine File Integrity:** Assess the files downloaded via BITS for any signs of malware or suspicious behavior, including hash comparisons against known malware databases.
  - **Check Historical Activity:** Conduct a historical review of BITS jobs to identify any patterns or anomalies in the timing or origin of previous downloads, especially those from direct IPs.

  ### Prioritization
  This alert is categorized as high severity due to the potential implications of downloading files from direct IP addresses. Such behavior can indicate a concerted effort by attackers to exfiltrate sensitive data or deploy malicious payloads, which poses significant risks to enterprise environments.

  ### Blind Spots and Assumptions
  There may be gaps in detecting legitimate BITS usage that is uncommon for the organization's operations, as well as instances where malicious actors utilize local or private IP addresses that are whitelisted or frequently used internally. The detection logic assumes proper logging for BITS activities is enabled and that any event logs related to process creation and network connections are sufficiently detailed to correlate with the findings from BITS logs. In environments with low BITS usage, legitimate transfers could lead to false positives if not properly contextualized.

