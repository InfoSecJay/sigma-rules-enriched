  ### Technical Context

  This Sigma rule detects the creation of a new BITS (Background Intelligent Transfer Service) job using the Bitsadmin tool, which can be used to manage downloads and uploads in Windows environments. The behavior observed may suggest an attacker’s objective to download/remove malicious files or data stealthily, which is often part of post-exploitation phases in an attack lifecycle. The relevant MITRE ATT&CK tactic is **Persistence** (TA0030) and the technique is **BITS Jobs** (T1197).

  The primary telemetry source for this detection is Windows Event Log with Event ID 3 from the BITS client service. If the activity is malicious, it may lead to unauthorized file transfers or the persistence of malicious payloads on the system. Importantly, this detection does NOT confirm that the activity is malicious on its own, as there are legitimate use cases for BITS jobs, especially in software update or large file transfer scenarios.

  ### Investigation Steps

  - **Check for Event ID 3 logs**: Review Windows Event Logs for Event ID 3 from the BITS service. This event specifically records the creation of BITS jobs, including necessary details such as `JobID` and `ProcessPath`, which can indicate whether the job was initiated by `bitsadmin.exe`.

  - **Correlate JobID with Event ID 16403**: Investigate related Event ID 16403 for the same JobID to see if there is evidence of file download or creation. This correlation can help confirm if the BITS job was used for legitimate updates versus potential malicious activities.

  - **Identify suspicious command-line arguments**: Examine the command-line arguments used in the BITS job creation. Malicious activity may involve unusual URLs or file paths that do not match standard operations like software updates or patch management.

  - **Look for non-standard processes**: Validate whether the `bitsadmin.exe` process is running from a legitimate location (usually from `C:\Windows\System32`). Executable files running from temporary folders (like `C:\Users\<username>\AppData\Local\Temp`) or from suspicious paths may indicate malicious usage.

  - **Review legitimate BITS job patterns**: Compare the BITS job creation with documented IT operational procedures for legitimate software updates or scheduled tasks. Legitimate usages will typically involve standard software packages or update URLs approved by the IT department.

  - **Assess impact on sensitive assets**: Evaluate the asset's role where this event was recorded. Additional scrutiny is needed if the alert pertains to critical infrastructure components or systems with high-value data.

  ### Prioritization

  This alert has a low severity level due to its nature, as it may frequently occur in normal operations. However, it still warrants investigation for critical assets because malicious actors often exploit BITS for stealthy data transfers. It's important to verify context to avoid overlooking possible indicators of compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations if logs are not adequately configured to capture BITS job events or if there are existing evasion techniques that mask or spoof the command. Additionally, legitimate update processes, such as Microsoft updates or third-party software installations, may trigger the same alert. For enhanced coverage, consider monitoring for additional indicators related to HTTP/HTTPS file transfers or suspicious PowerShell activity which often accompany BITS usage.

