note: |
  ### Technical Context

  The Sigma rule detects instances where AppLocker has intervened to prevent applications, scripts, or DLLs from executing on a Windows endpoint. This behavior usually indicates an enforcement mechanism intended to control the execution of unauthorized software, thereby aligning with security policies. The likely attacker objective is to circumvent execution restrictions for malicious tools or scripts, potentially to install malware or exfiltrate data. This detection aligns with the following MITRE ATT&CK tactics: Execution (TA0040) and specifically the techniques for User Execution of malicious scripts (T1204.002) and Command-Line Interface (T1059).

  Primary telemetry sources include Windows event logs, specifically Event IDs 8004 for EXE and DLL, 8007 for MSI and scripts, 8022 for packaged app execution, and 8025 for app deployment. If detected maliciously, it indicates robust preventative measures that disrupt an attacker's workflow. However, it is important to note that this detection does not confirm intent to execute malicious software, as the blocked execution could also encompass benign applications incorrectly flagged by AppLocker settings.

  ### Investigation Steps

  - **Review AppLocker Event Logs**: Check Windows Event Viewer under Applications and Services Logs > Microsoft > Windows > AppLocker > Microsoft-Windows-AppLocker/EXE and DLL > Operational. Focus on Event ID 8004 for blocked EXE/DLL, 8007 for scripts, and validate the process names against a whitelist of known applications.

  - **Validate Legitimate Operations**: Identify the specific application or script that was blocked. Confirm if it belongs to the approved software list. Common benign blockers include administrative tools or applications that require elevated permissions but are not explicitly allowed by the AppLocker policy.

  - **Examine User Activity**: Cross-reference the blocked execution with the user's recent actions. Look for Event ID 4624 in the Security logs to determine if the user account was actively trying to run the blocked application shortly before the AppLocker event occurred.

  - **Identify High-Confidence Malicious Indicators**: Investigate any occurrences of Event ID 8004 that involve known malicious executables or suspicious paths (e.g., non-standard directories like user temp folders). Consult threat intelligence sources for hashes or path patterns linked to potential threats.

  - **Review System Role and Asset Criticality**: Assess the impact of the blocked execution based on the system’s role within the organization. High-risk systems, such as servers or endpoints that handle sensitive data, warrant closer scrutiny if they trigger this alert.

  - **Check for AppLocker Rule Misconfiguration**: If legitimate applications are frequently being blocked, review AppLocker policies to ensure that they are correctly configured. Misconfigurations could lead to unnecessary security alerts and hinder productivity.

  ### Prioritization

  This alert should be rated medium in severity given that it indicates a preventative measure against potential malicious execution attempts. The likelihood of abuse is moderate, particularly in targeted attacks where attackers could try to run unauthorized scripts or applications. While not a direct indication of compromise, frequent occurrences may signal probing activity or attempts to bypass security controls.

  ### Blind Spots and Assumptions

  The detection can miss instances where attackers may execute applications using techniques to circumvent AppLocker, such as using trusted code signing or running scripts from non-standard locations. Comprehensive logging configurations are necessary to ensure all relevant AppLocker events are captured. Additionally, legitimate administrative maintenance tasks may trigger these alerts if they involve executing scripts or applications that have not been whitelisted. A related detection could be monitoring for changes to AppLocker policies or rules, helping to provide coverage for alterations that might facilitate bypasses or exploitation attempts.

