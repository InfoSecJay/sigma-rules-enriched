note: |
  ---

  ### Technical Context

  This rule detects events where AppLocker prevents the execution of applications, scripts, DLLs, or packaged apps on Windows systems. The likely attacker objective is to execute malicious software or scripts to gain control or exfiltrate data from a compromised system. Relevant MITRE ATT&CK tactic is Execution, with techniques including Command-Line Interface Execution (T1059.001) and Script Execution (T1059.003).

  Primary telemetry sources are Windows Event Logs with specific Event IDs: 8004 (for EXE and DLL), 8007 (for MSI and Script), 8022 (for Packaged app execution), and 8025 (for Packaged app deployment). The security impact of blocked executions can prevent malicious actions, indicating a successfully enforced application control policy. However, this detection does NOT confirm malicious intent, as legitimate applications may also be prevented from executing.

  ---

  ### Investigation Steps

  - **Check AppLocker Event IDs: **Review Windows Event Logs for Event ID 8004, 8007, 8022, and 8025 related to AppLocker. Correlate against the application names to validate whether a benign or malicious application was blocked.

  - **Identify blocked applications: **Look for applications or scripts associated with known malicious activity (e.g., PowerShell scripts or unusual executables). Cross-reference with threat intelligence databases to assess the legitimacy of the blocked items.

  - **Review recent changes in AppLocker policies: **Examine any recent modifications to AppLocker rules that might explain the blocking of legitimate applications. Use the Security Event ID 4100 to identify changes in AppLocker configurations.

  - **Assess host context: **Identify the role of the affected system (e.g., server, workstation) and its criticality to operations. Review whether the blocked applications are regularly used within that environment to determine potential false positives.

  - **Validate legitimate executions: **Cross-check applications that are authorized to run under AppLocker rules against the blocked list. This validation will assist in confirming if legitimate applications are being unintentionally blocked.

  ---

  ### Prioritization

  This alert is of medium severity, given that blocking application execution can prevent a range of malicious activities. However, the likelihood of malicious abuse depends on the specific application or script being executed. This type of behavior is commonly weaponized in certain attack scenarios, especially in targeted environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion if attackers utilize signed or otherwise whitelisted applications to bypass AppLocker. Accurate detection relies on proper logging configurations across all pertinent systems, where any disabled or misconfigured logs could lead to false negatives. Legitimate activities that may trigger the alert include system updates or benign application installs. A companion detection for additional coverage would be monitoring for changes in user execution policies (Event ID 4100) to correlate with AppLocker events.

