logsource:
  product: windows
  service: applocker
detection:
  selection:
    EventID:
    - 8003         # EXE and DLL would have been blocked
    - 8006         # MSI and Script would have been blocked
    - 8021         # Packaged app execution would have been blocked
    - 8024         # Packaged app deployment would have been blocked
  condition: selection
falsepositives:
- Expected during AppLocker policy testing and audit mode deployments
level: medium
note: |
  ### Technical Context

  This rule detects when applications, scripts, or packaged apps would have been blocked by AppLocker's enforcement policy if it were set to “Enforce rules” rather than “Audit only.” The potential attacker objective could include executing unauthorized or malicious executables to compromise a system or to spread malware. This behavior relates to the MITRE ATT&CK technique **Execution (T1204.002)** for user execution, and **Command-Line Interface (T1059)** techniques for command execution.

  The primary telemetry source is the Windows Security Event Log, specifically focusing on AppLocker events (Event IDs 8003, 8006, 8021, 8024). If malicious, this behavior indicates potential unauthorized application or script execution, which could lead to data exfiltration or system compromise. However, this detection does NOT confirm that the application was executed; it only indicates that a block would have occurred under stricter controls.

  ### Investigation Steps

  - **Check AppLocker events**: Review Windows Security Event Log for Event ID 8003, 8006, 8021, or 8024. Search for the exact application names and paths referenced in these events to determine what would have been blocked.

  - **Identify high-risk applications**: Cross-reference the application names from the detected events against known malicious indicators or a malware threat database. If the application name appears in threat intelligence feeds, consider it a potential compromise.

  - **Evaluate legitimate usage**: Investigate if the blocked applications are part of approved software by confirming them against your organization’s application whitelist. Note the timestamps and user accounts associated with these attempts for benign context.

  - **Check for AppLocker policy testing**: Assess whether this alert aligns with planned testing or deployments of AppLocker policies. Events may legitimately appear during normal operations aimed at policy validation.

  - **Assess system roles**: Determine if the affected system is critical (e.g., a server hosting sensitive applications) or non-critical (e.g., a test machine). This can help gauge the potential impact if a security incident were confirmed.

  ### Prioritization

  The severity of this alert is medium. The blocked behavior indicates potential attempts to execute unauthorized software, which, if malicious, could severely impact system integrity. While the likelihood of malicious abuse exists, this event is not commonly weaponized unless linked with other indicators of compromise.

  ### Blind Spots and Assumptions

  Detection is limited by the "Audit only" configuration, allowing potentially malicious applications to run without actual enforcement. Evasion techniques may include legitimate applications being misused or administrative commands that bypass AppLocker restrictions. This alert could be triggered by legitimate activities like software testing or maintenance. A companion detection that strengthens coverage might include monitoring for direct execution of blocked applications through process creation events (e.g., Security Event ID 4688).

