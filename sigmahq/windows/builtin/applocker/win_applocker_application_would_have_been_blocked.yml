logsource:
  product: windows
  service: applocker
detection:
  selection:
    EventID:
    - 8003         # EXE and DLL would have been blocked
    - 8006         # MSI and Script would have been blocked
    - 8021         # Packaged app execution would have been blocked
    - 8024         # Packaged app deployment would have been blocked
    # Common FP examples (environment-specific, handle at AppLocker policy level):
    # filter_main_fp_examples:
    #     FullFilePath:
    #         - 'C:\Windows\system32\VERSION.dll'
    #         - 'C:\Windows\SYSTEM32\WINNSI.DLL'
    #         - 'C:\Windows\SYSTEM32\NetSetupEngine.dll'
    #         - 'C:\Windows\uus\AMD64\uusbrain.dll'
    #         - 'C:\Windows\SYSTEM32\ImplatSetup.dll'
    #         - 'C:\Windows\System32\bcrypt.dll'
    #         - 'C:\Windows\SYSTEM32\NETAPI32.DLL'
    #         - 'C:\Program Files\SplunkUniversalForwarder\bin\VCRUNTIME140.dll'
    #     EventID: 8003
  condition: selection
falsepositives:
- Expected during AppLocker policy testing and audit mode deployments
- Legitimate system DLLs and applications not yet covered by the AppLocker 
  policy (e.g. Windows system components, third-party software). False positives
  must be handled at the AppLocker policy level by the policy author, not via 
  Sigma filters.
level: low # Increase to medium or high based on the criticality of the applications being monitored and false positive tolerance.
note: |
  ### Technical Context

  This Sigma rule detects instances where applications, DLLs, scripts, or packaged apps would have been blocked by AppLocker if it were in "Enforce rules" mode, based on audit event IDs. The likely attacker objective could include executing unauthorized applications to perform malicious activities, such as lateral movement or data exfiltration. This corresponds to the MITRE ATT&CK tactics of Execution (TA0002) and the techniques T1204.002 (AutoIt) and T1059.001 (PowerShell), among others.

  The primary telemetry sources include Windows Event Logs, specifically Event IDs 8003, 8006, 8021, and 8024 related to AppLocker auditing. If malicious, this behavior could allow unauthorized code execution, potentially leading to data breaches or system compromise. However, this detection does NOT confirm that a malicious application has executed; it only indicates that an action was blocked if AppLocker was strictly enforced.

  ### Investigation Steps

  - **Review AppLocker Events:** Examine Windows Event Logs for Event IDs 8003, 8006, 8021, and 8024 associated with the detected alert. Look for the FullFilePath field to identify the specific application involved.

  - **Correlate with Policy:** Verify the reported FullFilePath against the current AppLocker policy. Check if the application or path is explicitly allowed or denied, indicating whether the event was expected behavior during testing.

  - **Identify Malicious Indicators:** Look for known malicious file paths, such as those associated with common malware families or indicators of compromise (IOCs). High-confidence malicious indicators would include paths that deviate from standard application directories, like C:\Users\Public\ or non-standard installation locations.

  - **Assess Legitimacy of Activity:** Determine if the execution path is associated with legitimate software installed in your environment. For example, common enterprise applications like Microsoft Word or organizational-approved tools should not be flagged unless they're misconfigured.

  - **Examine Execution Context:** Identify whether the event was triggered by a user with administrative privileges or a system context, as unauthorized access from elevated accounts adds risk.

  - **Monitor for Repeat Events:** If the alert is triggered frequently, it may indicate ongoing attempts to execute unauthorized applications. Establish a timeline of events to gauge any patterns or connections to known attacks.

  ### Prioritization

  The alert severity is considered low in a mature SOC, especially if the affected system is non-critical and the rule is likely to trigger due to common benign software testing. However, the presence of frequent alerts could suggest potential suspicious behavior that warrants closer monitoring and investigation.

  ### Blind Spots and Assumptions

  This detection may miss false negatives if critical applications are not adequately covered by the AppLocker policy, thus allowing prohibited software to execute without triggering alerts. Additionally, if logging for AppLocker events is disabled or misconfigured, these relevant entries will not be available for detection. Legitimate activities that may generate alerts include software updates or legitimate app testing. A related detection might involve monitoring execution attempts via Windows Event ID 4688 to identify potential execution of blocked applications in combination with AppLocker enforcement.

