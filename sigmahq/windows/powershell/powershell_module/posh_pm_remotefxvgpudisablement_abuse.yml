note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module containing the function definition for `Get-VMRemoteFXPhysicalVideoAdapter`. This behavior may indicate potential exploitation of the RemoteFXvGPUDisablement.exe binary, which is susceptible to module load-order hijacking. The likely attacker objective is to execute unauthorized commands on a Windows system while avoiding detection.

  This detection is associated with the MITRE ATT&CK technique **"Signed Binary Proxy Execution" (T1218)**. The primary telemetry sources are Windows PowerShell logs (Event ID 400), specifically targeting the logs related to module creation. If malicious, this action could lead to the unauthorized manipulation of virtual machine settings or other critical operations within a virtualized environment. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that a potentially suspicious PowerShell module has been created.

  ### Investigation Steps

  - **Check PowerShell Event Logs:** Review Windows PowerShell logs for Event ID 400 to find details of the module assembly process, specifically looking for entries that include `Get-VMRemoteFXPhysicalVideoAdapter`. Ensure to assess timestamps and the user context in which this action occurred.

  - **Verify Process Invocation:** Examine the process creation logs (Event ID 4688 or Sysmon Event ID 1) for any instances of `RemoteFXvGPUDisablement.exe` being invoked shortly after the PowerShell module creation. Look for command-line arguments that may suggest malicious intent.

  - **Assess User Context:** Analyze the user account associated with the module creation and subsequent process. Determine if this activity aligns with expected behavior for that user role. IT administrators may legitimately use this module, while unexpected executions by non-privileged users may indicate a higher risk.

  - **Look for Anomalous Scripts:** Search for any executing PowerShell scripts (Event ID 4688) that reference `RemoteFXvGPUDisablement.exe`, especially when paired with suspicious command-line options or contexts indicating misuse of administrative privileges.

  - **Investigate Network Connections:** Check for unusual network connections that may occur after the module creation. Analyze Windows Firewall logs or network logs to identify any outbound communications to unexpected IP addresses, particularly those known for malicious traffic.

  ### Prioritization

  Given the potential impact on virtualization environments, the severity of this alert is high. The likelihood of malicious abuse is significant due to the nature of the detected behavior. This technique has been weaponized by adversaries to gain unauthorized access to and control over virtualized infrastructures.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell logging is not sufficiently configured or where Event ID 400 is not monitored. Sophisticated adversaries may use evasion techniques such as obfuscation of the module contents or altering the user context to mask the malicious actions. Legitimate administrative use of PowerShell modules for RDP and virtualization management may trigger this alert. A related detection to strengthen coverage is monitoring for the use of `Invoke-Expression`, which could be used to dynamically execute code that leverages the created module for malicious purposes.

