note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module with contents containing the definition for the function `Get-VMRemoteFXPhysicalVideoAdapter`. This behavior may indicate an attempt to exploit vulnerabilities in the `RemoteFXvGPUDisablement.exe`, potentially allowing an attacker to bypass security mechanisms or execute arbitrary commands under the guise of legitimate operations. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Signed Binary Proxy Execution** (T1218).

  Primary telemetry sources include Windows PowerShell logs (Event ID 400), which capture the events when PowerShell modules are loaded. The security impact of this behavior is significant, as it may signal an ongoing exploitation effort that compromises system integrity. However, this detection does not confirm malicious intent on its own; it only highlights potential abuse of PowerShell module functionality.

  ### Investigation Steps

  - **Check PowerShell Module Creation:** Verify PowerShell logs (Event ID 400) around the time of the alert. Look for activities involving module creation that contain the payload: `ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {`. Benign activities may include standard module updates or known administrative tasks.

  - **Analyze User Context:** Retrieve the user account associated with the execution. This can be gleaned from PowerShell's get-logged command (Event ID 400). If the account is non-admin or unusual for the context (e.g., a service account), this may suggest malicious intent.

  - **Inspect Process Tree and Parent Process:** Validate the parent process of the PowerShell instance using Sysmon Event ID 1. If the parent is a known legitimate system process (e.g., `explorer.exe` or `powershell.exe` from trusted directories), it is less likely to be malicious.

  - **Review Additional Telemetry:** Collect endpoint activity logs for any outgoing connections or downloaded files that coincide with the timing of the alert. Check for suspicious payload downloads or command execution against high-value assets.

  - **Check for Historical Footprints:** Query if similar PowerShell module creations have been logged previously on the affected asset using Security Event ID 400. A pattern of similar activity could indicate a compromised system.

  ### Prioritization

  This alert is classified as high severity due to the sensitivity of the potential vulnerabilities being exploited via PowerShell module manipulation. The likelihood of malicious use is elevated, as attackers often exploit module creation for lateral movement and execution of arbitrary code, making it a commonly weaponized behavior in sophisticated attacks.

  ### Blind Spots and Assumptions

  There are limitations in detecting this activity, as legitimate administrative actions could trigger similar alerts, particularly during routine system updates or management tasks. Reliable detection relies on correctly configured PowerShell logging settings and the collection of appropriate telemetry. One related detection that complements this alert is monitoring for processes that leverage signed binary proxy execution techniques, such as `Invoke-Expression` or `Start-Process` with similar payloads.

