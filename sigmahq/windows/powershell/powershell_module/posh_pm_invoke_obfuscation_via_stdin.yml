note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands executed via standard input (stdin), which may indicate attempts to execute malicious scripts while avoiding detection. The likely objective of an attacker using this technique is to execute arbitrary code or payloads covertly on a target system to gain further control or deploy additional malware. This behavior aligns with the MITRE ATT&CK technique for command and scripting interpreter, specifically T1059.001 (PowerShell) and T1027 (Obfuscated Files or Information).

  The primary telemetry source for this detection is Windows PowerShell logs, particularly focusing on the command line arguments and the execution context of PowerShell scripts. If malicious, this behavior can result in unauthorized access to sensitive data, lateral movement, or further compromise of the network. Importantly, this detection does NOT confirm that the execution was definitively malicious—it may also include benign instances of obfuscated scripts being run for legitimate administrative tasks.

  ### Investigation Steps

  - **Check PowerShell command history:** Review PowerShell command history (Event ID 4103) for obfuscated commands using `Get-History` or similar. Look for suspicious command patterns containing `&&` and environment manipulation.

  - **Validate script source:** Inspect the command’s initial source. Check if it originated from a known script repository or non-standard location. Legitimately executed scripts typically reside in approved paths like `C:\Scripts\`.

  - **Assess PowerShell process details:** Monitor PowerShell processes (Event ID 4688 or Sysmon Event ID 1) and capture command line parameters for indications of obfuscation, especially if they involve extensive use of `set` and variable manipulation.

  - **Correlate with known bad indicators:** Cross-reference with malicious indicators, such as hashes of files involved in the execution or network behavior, using threat intelligence platforms to identify known malicious campaigns.

  - **Review Windows Event logs for anomalies:** Check for additional suspicious activities around the time of detection in the Windows Security log (Event IDs 4624, 4688) to look for unusual user logins or process creations.

  - **Examine endpoint behavior:** Investigate any files created or modified during this time span, particularly looking for unusual file types or sizes that may indicate payloads or exfiltration attempts (e.g., `.exe`, `.dll` files).

  ### Prioritization

  This alert should be considered high severity due to the potential for significant impact if an attacker successfully executes obfuscated commands. The likelihood of abuse is high, as attackers often leverage obfuscation techniques to mask malicious activities, and this specific method of execution is commonly weaponized in current threats.

  ### Blind Spots and Assumptions

  Detection efficacy may be hindered by legitimate administrative use of obfuscation or the use of tools that mimic PowerShell behavior, potentially generating false positives. Ensure logging is configured to capture all PowerShell activity effectively, including script block logging. Additionally, other detections related to PowerShell activity, such as command execution via WMI or Scheduled Tasks, can enhance coverage and provide context for deeper investigations.

