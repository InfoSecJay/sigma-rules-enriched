  ---

  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts utilizing standard input (stdin), typically leveraged by adversaries to evade detection. The attacker may aim to bypass security controls, execute malicious commands, or load payloads without attracting attention through clear text in script files. This behavior fits within the MITRE ATT&CK framework under the tactics of Execution (T1203) and Defense Evasion (T1027).

  The primary telemetry sources involve Windows PowerShell logs, specifically those related to module execution. If malicious, such behavior could lead to system compromise or lateral movement within the network. However, detecting this rule does NOT confirm that an actual attack occurred on its own; further investigation is required to understand intent and context.

  ---

  ### Investigation Steps

  - **Check PowerShell command history:** Review PowerShell Command History logs (Event ID 4103) for detailed commands executed. Look for unusual or complex commands combining "set" and "&&" operators, which may indicate obfuscated scripts initiating malicious tasks.

  - **Identify obfuscated scripts:** Investigate script block logs for any entries (Event ID 4104) revealing encoded or obfuscated commands. Compare against typical administrative scripts to identify deviations; obfuscation is a common red flag.

  - **Review recent changes in PowerShell modules:** Analyze module execution logs for PowerShell (Event ID Module), looking at recently loaded modules. Valid administrative scripts would typically involve known modules like "ActiveDirectory" or "AzureAD."

  - **Assess system criticality:** Correlate the alerts with host roles. If the initiating host is an endpoint with sensitive data or critical infrastructure tasks, prioritize further analysis. Conversely, alerts from less critical systems may require less immediate attention.

  - **Validate network activity:** Check if there are associated outbound connections (Event ID 5156) to known malicious IPs or domains post-execution. Unusual traffic patterns following the alert can indicate malicious intent.

  ---

  ### Prioritization

  This alert carries a high severity level due to the potential impact on sensitive systems if exploited. The likelihood of malicious abuse is significant, particularly as obfuscation techniques are commonly weaponized in modern attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of enforcement for PowerShell logging configurations since script block logging is not always enabled by default. Legitimate administrative activities may also trigger alerts when using obfuscation techniques for benign purposes (e.g., onboarding scripts). A related detection to strengthen coverage includes monitoring for failed logins (Event ID 4625), which can indicate unauthorized access attempts preceding the execution of obfuscated scripts.

