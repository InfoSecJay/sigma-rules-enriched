note: |
  ### Technical Context
  This detection rule identifies the use of the Invoke-Obfuscation PowerShell module attempting to execute obfuscated PowerShell commands via standard input (stdin). Defense evasion techniques, such as obfuscation, are commonly employed by attackers to bypass security controls and conduct malicious activities without detection. The primary objective of such an attack typically involves executing scripts that may lead to system compromise, data exfiltration, or further exploitation of the environment.

  This rule is aligned with several MITRE ATT&CK techniques, including **Defense Evasion** (T1027) through the use of obfuscation strategies, and **Command and Scripting Interpreter** (T1059.001), which specifically addresses PowerShell as an execution method. The primary data sources for this detection include Windows PowerShell module logs and process creation events displaying the use of PowerShell with potentially malicious payloads.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check Windows PowerShell module logs for any recent activities involving the Invoke-Obfuscation module or obfuscated commands being executed.
  - **Analyze Process Creation Events:** Look over process creation logs to identify any PowerShell commands executed with atypical parameters or unusual command-line arguments suggesting obfuscation.
  - **Investigate Parent Process Relationships:** Track the parent processes of detected PowerShell commands to determine if they were launched from unusual or suspicious sources, like known malware executables or administrative tools.
  - **Correlate Network Activity:** Examine network logs for unusual outbound connections initiated by PowerShell. This can indicate potential data exfiltration attempts or command-and-control communications initiated post-exploitation.

  ### Prioritization
  The alert is classified as high severity because the use of obfuscated PowerShell commands is a clear indication of malicious intent, which may facilitate other attack activities such as lateral movement or data exfiltration in an enterprise environment. Given the prevalence of PowerShell in administrative tasks, detecting obfuscation methods is crucial for identifying and mitigating potential threats.

  ### Blind Spots and Assumptions
  This detection logic may have blind spots related to non-obfuscated PowerShell executions that could also indicate malicious behavior. Additionally, this rule assumes that PowerShell logging is properly configured and that relevant logs are retained for sufficient duration to analyze potential incidents. The effectiveness of the detection also relies on having access to process creation events and PowerShell module logs; lack of these could hinder the accuracy of alerts.

