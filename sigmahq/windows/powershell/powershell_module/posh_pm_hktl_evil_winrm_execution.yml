logsource:
  product: windows
  category: ps_module
detection:
  selection_wsm:
    ContextInfo|contains:
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\wsmprovhost.exe'
  selection_payload_1:
    Payload|contains:
    - value="(get-location).path         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L592
    - value="(get-item*).length         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L490
    - 'Invoke-Binary '         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L740
    - Donut-Loader -process_id*-donutfile         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L761
    - Bypass-4MSI
    - IEX 
      ([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($a))).replace('???','')
  selection_payload_2:
    Payload|contains|all:
    - $servicios = Get-ItemProperty "registry::HKLM\System\CurrentControlSet\Services\"
    - Where-Object {$_.imagepath -notmatch "system" -and $_.imagepath -ne $null }
      | Select-Object pschildname,imagepath
  selection_payload_3:
    Payload|contains|all:
    - $a +=  \"$($_.FullName.Replace('\\','/'))/\"}else{  $a += \"$($_.FullName.Replace('\\',
      '/'))\" }                                                                                                 # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L1001
    - $a=@();$
  condition: selection_wsm and 1 of selection_payload_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the Evil-WinRM tool through PowerShell by analyzing specific logs for hardcoded strings and patterns present in the utility. Evil-WinRM is a well-known post-exploitation framework commonly used by attackers to facilitate lateral movement and gain unauthorized access to remote Windows systems, often taking advantage of weak or compromised credentials. By executing PowerShell scripts containing unique command sequences associated with Evil-WinRM, an attacker can exploit vulnerabilities in the target environment and gain increased privileges, allowing for the reconnaissance and enumeration of targets within the network.

  Relevant MITRE ATT&CK tactics and techniques potentially applicable here include:
  - **Lateral Movement** (TA0008)
    - **Windows Remote Management** (T1021.001)

  The primary data sources essential for detecting this activity include PowerShell module logs and process execution logs, which help in identifying the execution of suspicious or unauthorized PowerShell commands, specifically those that may relate to the usage of Evil-WinRM in a compromised environment.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell module logs for any entries that involve the execution of commands containing known Evil-WinRM strings such as 'Invoke-Binary' and payloads referencing registry services. Look for suspicious patterns or command syntax that aligns with the documented behavior of the tool.

  - **Analyze Process Creation Events:** Investigate process creation logs to identify the execution of PowerShell scripts. Pay special attention to instances where the `wsmprovhost.exe` process was spawned, indicating likely malicious PowerShell activity that could relate to the use of Evil-WinRM.

  - **Check Network Connections:** Evaluate network logs for outbound connections originating from PowerShell execution contexts, particularly those aimed at unauthorized or unexpected external IP addresses, which may indicate communications with a command and control server.

  - **Correlate with Authentication Logs:** Cross-reference detected PowerShell activity with authentication logs to identify any unusual login attempts or user sessions, especially from users or systems that should not be executing such administrative tasks.

  ### Prioritization
  Given the elevated threat level posed by Evil-WinRM, alerts generated by this rule should be considered **high severity**. The tool facilitates lateral movement and can lead to significant data breaches or network compromise, especially in environments that may lack adequate protective measures.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that detection may not capture all instances of Evil-WinRM usage, particularly if attackers modify the command strings or use obfuscation techniques to evade detection. The detection logic assumes that PowerShell logging is sufficiently enabled and properly configured across the environment. It also relies on the presence of PowerShell module logs and accurate process execution data. Log configurations and security policy adherence are critical for ensuring the effectiveness of this alerting mechanism.

