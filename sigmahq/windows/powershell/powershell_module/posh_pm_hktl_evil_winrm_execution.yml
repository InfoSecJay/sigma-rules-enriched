date: 2024-02-25
tags:
- attack.lateral-movement
logsource:
  product: windows
  category: ps_module
detection:
  selection_wsm:
    ContextInfo|contains:
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\wsmprovhost.exe'
  selection_payload_1:
    Payload|contains:
    - value="(get-location).path         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L592
    - value="(get-item*).length         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L490
    - 'Invoke-Binary '         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L740
    - Donut-Loader -process_id*-donutfile         # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L761
    - Bypass-4MSI
    - IEX 
      ([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($a))).replace('???','')
  selection_payload_2:
    Payload|contains|all:
    - $servicios = Get-ItemProperty 
      "registry::HKLM\System\CurrentControlSet\Services\"
    - Where-Object {$_.imagepath -notmatch "system" -and $_.imagepath -ne $null 
      } | Select-Object pschildname,imagepath
  selection_payload_3:
    Payload|contains|all:
    - $a +=  \"$($_.FullName.Replace('\\','/'))/\"}else{  $a += 
      \"$($_.FullName.Replace('\\', '/'))\" }                                                                   # https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb#L1001
    - $a=@();$
  condition: selection_wsm and 1 of selection_payload_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Evil-WinRM PowerShell module, which is commonly used for lateral movement in network environments. The attacker’s objective typically involves compromising a target system and gaining control over it remotely using Windows Remote Management (WinRM) protocols. The relevant MITRE ATT&CK tactic is **Lateral Movement** (TA0008) and the technique is **Windows Remote Management** (T1028).

  The primary telemetry sources are Windows PowerShell module logs, specifically looking for certain hardcoded strings used in Evil-WinRM scripts. If malicious, successful execution of this rule may indicate that an attacker is attempting to move laterally within the network and possibly exfiltrate sensitive data or further compromise other machines. This detection does NOT confirm a successful compromise on its own, as it identifies potentially malicious execution but does not guarantee malicious intent without further context.

  ### Investigation Steps

  - **Verify PowerShell Module Activity:** Check logs for specific Event IDs related to PowerShell execution (Event ID 400, 410, and 4688). Look for instances where `wsmprovhost.exe` is involved; this is benign in legitimate Windows management but critical in this case.

  - **Check for Suspicious Command Strings:** Investigate the presence of hardcoded strings detected by the rule, such as `Invoke-Binary` or variations of `IEX`). Extract samples from telemetry (PowerShell command output) that match these patterns, referencing the specific parameters used.

  - **Analyze Recent WinRM Connections:** Review WinRM related logs in Event ID 4648 (Logon Attempt) or 4688 (New Process) to identify if there were any recent authentic WinRM sessions from non-administrative machines, which indicate potential lateral movement.

  - **Cross-examine User Behavior:** Compare the detected activity against typical user behavior in operational logs. Investigate whether the user accounts initiate commands on this scope or if they typically generate baseline behaviors compatible with expected duties.

  - **Identify High-Confidence Malicious Indicators:** Look for additional context such as unusual outbound connections to known bad IPs or domains, and utilize threat intelligence feeds. For example, check for connections to command-and-control (C2) servers that may coincide with the detected string patterns.

  - **Monitor System Changes:** Examine registry changes reflecting commands run through PowerShell that modify service properties, specifically those involving `"To-Get-ItemProperty"` statements targeting `HKLM\System\CurrentControlSet\Services\`; signifying further probing activity that might precede an exploit.

  ### Prioritization

  This alert should be treated with high priority due to its implications for lateral movement, a critical aspect of post-compromise behavior. Given the high likelihood of malicious intent—especially in environments leveraging remote management tools—immediate response is necessary to investigate and contain any potential threats.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive PowerShell logging or if logs have been tampered with by an attacker. Malicious users may invoke PowerShell in a non-standard way that bypasses typical logging mechanisms, such as obfuscating command strings or using encoded commands. There is a possibility that legitimate administrative tasks may inadvertently trigger this alert, such as authorized use of PowerShell for system management. Complementary detections, such as monitoring for unauthorized changes in application or service configurations, can strengthen threat coverage and validation of any powershell activity.

