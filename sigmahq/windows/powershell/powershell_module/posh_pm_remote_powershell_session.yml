note: |
  ### Technical Context
  This rule detects remote PowerShell sessions initiated through the Windows PowerShell module, specifically targeting instances where the module is used in a potentially malicious manner. Attackers often utilize remote PowerShell sessions to execute commands or scripts on compromised systems, enabling them to maintain persistence, move laterally within a network, and deploy additional payloads. The primary objective of such activity is typically to establish a foothold in the target environment and manipulate it for further exploitation.

  The relevant MITRE ATT&CK tactics for this detection include **Execution (T1059.001)**, which pertains to the execution of commands via a command-line interface, and **Lateral Movement (T1021.006)**, which involves techniques that enable attackers to move between machines within a network environment. The detection is anchored on monitoring PowerShell's normal operation and identifying deviations indicative of potential hostile activity.

  Primary data sources for this detection include PowerShell module event logs that capture when remote sessions are initiated, as well as associated Windows event logs that record process creation under the relevant context. These logs can provide crucial evidence to determine whether the activity in question is benign or part of a larger attack strategy.

  ### Investigation Steps
  - **Review PowerShell Event Logs:** Examine the PowerShell event logs for unusual commands executed during remote sessions, particularly any that deviate from standard operational use cases.

  - **Inspect Process Creation Logs:** Analyze process creation logs for instances of `wsmprovhost.exe` being executed alongside associated remote session activities. Look for patterns or sequences that are atypical for your environment.

  - **Correlate with Network Activity:** Check network logs for traffic to and from the host systems where remote PowerShell sessions are initiated. Look for any unusual data exfiltration activities or unauthorized access attempts.

  - **Identify Anomalous User Behavior:** Cross-reference the user accounts associated with remote PowerShell activity against standard user behavior. Look for accounts showing variations in privilege or access patterns that could suggest compromise.

  ### Prioritization
  The alert is marked as high severity due to the potential impact of remote PowerShell sessions being abused for lateral movement and command execution in an enterprise environment. Such activities often signify breaches or attempts to escalate privileges, which pose significant risks to organizational data security and integrity.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the legitimate use of remote PowerShell sessions for administrative tasks, which could lead to false positives. The detection logic assumes that all significant PowerShell operations through remote sessions should be scrutinized, but it may miss subtler tactics employed by advanced attackers who can obfuscate their methods. Required logs include detailed Windows event logs and PowerShell execution logs that must be properly configured to capture all relevant activities for effective detection.

