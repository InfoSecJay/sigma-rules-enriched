  ---

  ### Technical Context

  This Sigma rule detects remote PowerShell sessions initiated via the `wsmprovhost.exe` process, which is commonly exploited by attackers for lateral movement within a network. The likely objective for an attacker using remote PowerShell is to execute commands on remote systems, exfiltrate data, or maintain persistence. This behavior is mapped to MITRE ATT&CK tactics: Execution (T1059.001) and Lateral Movement (T1021.006). The primary telemetry sources include PowerShell logs, specifically looking for context information that indicates remote sessions, such as logs generated by `wsmprovhost.exe`. If malicious, this activity can lead to unauthorized access and command execution on critical systems. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate use of remote PowerShell is common in administrative operations.

  ---

  ### Investigation Steps

  - **Identify the context of the session**: Review PowerShell logs (Event ID 4104) to confirm events related to session initiation. Validate that `wsmprovhost.exe` is the host application and check for associated commands executed, particularly those which appear suspicious or unusual.

  - **Check for known malicious behavior**: Look for execution of scripts or commands containing PowerShell obfuscation techniques or that interact with sensitive data. Indicators of compromise could include calls to untrusted URLs or file paths related to known malware.

  - **Assess legitimate administrative usage**: Verify if there are approved use cases for remote PowerShell in your environment, such as scheduled tasks or system management. Compare timestamps against scheduled maintenance windows or known IT activities.

  - **Correlate with other telemetry**: Review Windows Security logs (Event IDs 4624 and 4634) to establish the legitimacy of user accounts initiating the remote sessions. Identify patterns of authentication failures or unusual login times that could indicate credential misuse.

  - **Evaluate endpoint impact**: For critical systems, ascertain the system role and potential impact of a remote session. Ensure that policy controls around PowerShell execution are enforced and monitor for any unauthorized or unexplained administrative access.

  ---

  ### Prioritization

  This alert is considered high severity due to its potential impact on sensitive systems and the likelihood of exploitation by adversaries leveraging legitimate administrative tools. The behavior of initiating remote PowerShell sessions is a common tactic used by threat actors for lateral movement, making it a critical alert.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of legitimate administrative activity to mask malicious actions, as well as modifying the `wsmprovhost.exe` execution method. Accurate detection depends on having complete logging enabled for Windows PowerShell, and other administrative tools may trigger this alert. A companion detection that could strengthen coverage includes monitoring unusual PowerShell activity through full command logs (Event ID 4103), which can help correlate suspicious behavior with expected use cases.

