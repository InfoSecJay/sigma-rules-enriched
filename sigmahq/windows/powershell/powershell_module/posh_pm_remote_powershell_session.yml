detection:
  selection:
    ContextInfo|contains|all:
    - ' = ServerRemoteHost '         #  HostName: 'ServerRemoteHost'  french : Nom d’hôte =
    - 'wsmprovhost.exe'              #  HostApplication|contains: 'wsmprovhost.exe' french  Application hôte =
  filter_pwsh_archive:
