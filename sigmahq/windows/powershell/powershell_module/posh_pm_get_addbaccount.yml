  ---

  ### Technical Context

  This rule detects the suspicious invocation of the `Get-ADDBAccount` PowerShell script, which interacts with the `ntds.dit` file to extract Active Directory account information and potentially access credentials without traditional credential dumping tools. Attackers may employ this method to escalate privileges or maintain persistence by acquiring sensitive account data.

  Relevant MITRE ATT&CK tactics include Credential Access (T1003.003). The primary telemetry source is Windows PowerShell logs, specifically targeting PowerShell module execution records. If successful, this detection indicates a significant security risk, as it could lead to unauthorized access to accounts with elevated privileges. This detection does not confirm that a successful credential theft occurred, only that the script was executed in a suspicious context.

  ---

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check for PowerShell Event ID 4104 logs where `Get-ADDBAccount` is present in script block logging. Look for unusual times or patterns that deviate from typical administrative operations.

  - **Identify Command Parameters:** Validate whether log entries contain the parameters `BootKey` and `DatabasePath`. The presence of these parameters often indicates an attempt to access sensitive information.

  - **Determine User Context:** Assess the user account that executed the command. Legitimate administrative users typically invoke PowerShell for specific tasks. Any invocation by non-administrative accounts may warrant further scrutiny.

  - **Check for Known Malicious Indicators:** Examine system logs for any previous artifacts related to credential access tools such as Mimikatz or unusual AD behavior. Cross-reference log entries with security intelligence for any known malicious actors.

  - **Consider System Role:** If this command was executed on a Domain Controller, elevate its significance. This device's security is critical, as it could lead to a full domain compromise.

  - **Investigate for File Creation or Modification:** Look for changes to file modification logs in the NTDS directory, including timestamps and user accounts that would indicate unauthorized access attempts.

  ---

  ### Prioritization

  This alert should be treated with high severity as it pertains to potential credential access within the Active Directory environment. The systems involved, often Domain Controllers, are critical for maintaining security across the enterprise; thus, the likelihood of malicious abuse is notably high, particularly given the growing prevalence of such tactics among adversaries.

  ---

  ### Blind Spots and Assumptions

  This detection may encounter limitations if PowerShell logging is incomplete or misconfigured, as certain script executions might not be captured. Additionally, legitimate administrative tasks or specialized applications running similar commands could trigger this alert. Companion detections focusing on abnormal PowerShell usage or Active Directory access patterns can help strengthen coverage and improve context when this alert is triggered.

