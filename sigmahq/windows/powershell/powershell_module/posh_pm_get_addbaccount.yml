note: |
  ### Technical Context
  This rule detects suspicious usage of the `Get-ADDBAccount` PowerShell script, which interacts with the Active Directory Domain Services (AD DS) database files (ntds.dit) to extract user account information, including password hashes. Attackers may leverage this script to circumvent traditional credential dumping techniques, gaining unauthorized access to sensitive credentials within an Active Directory environment. The intention behind using such a script typically revolves around elevating privileges or furthering lateral movement within the enterprise network structure.

  This detection aligns with the MITRE ATT&CK framework, specifically targeting the **Credential Access** tactic (TA0006) and the associated technique **Credential Dumping: NTDS.dit** (T1003.003). By identifying execution of the `Get-ADDBAccount` script, defenders can intercept potential credential harvesting attempts by malicious actors seeking to exploit or move within a network undetected.

  Primary data sources for this detection include **Windows PowerShell logging**, which can capture execution details of the script, alongside **Security Event Logs** that may reveal context around user activities and related privilege escalation attempts.

  ### Investigation Steps
  - **Review PowerShell Execution Logs:** Analyze PowerShell logs for entries related to the `Get-ADDBAccount` command. Look for parameters like `BootKey` and `DatabasePath`, as these can indicate attempts to access sensitive user credentials.
  - **Check Security Event Logs:** Examine event logs for unusual account logon behaviors or privilege elevation activities coinciding with the execution of the script, which could indicate unauthorized access attempts.
  - **Correlate User Activity:** Investigate the user account that executed the `Get-ADDBAccount` invocation for any prior or concurrent malicious activity. Pay attention to timeframes of administrative actions and any lateral movement indicators.
  - **Assess Active Directory Changes:** Review any modifications to user accounts or group memberships shortly after the PowerShell script was run. This assessment helps determine if credentials obtained through this method were used for further exploitation.

  ### Prioritization
  Given the high potential impact of credential theft in an enterprise environment, this alert should be prioritized as it directly pertains to maintaining the integrity and security of Active Directory services. The likelihood of exploitation is significant due to the ease of access to these tools by attackers.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the execution of this script if PowerShell logging is not properly configured or if the cmdlet is executed in a non-standard manner that evades logging. The detection assumes that PowerShell logging is enabled and that there are enough protections in place to monitor and capture relevant security events. Additionally, if the script is run in environments where specific logging settings are altered or insufficient, alerts may not trigger, necessitating a review of log retention and monitoring capabilities.

