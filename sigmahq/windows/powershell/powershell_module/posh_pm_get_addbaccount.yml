note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell script `Get-ADDBAccount`, which is often used by adversaries to extract sensitive information from the Active Directory database (`ntds.dit`) without relying on traditional credential dumping tools. The likely attacker objective is to obtain credentials or sensitive user data for further exploitation or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for credential access labeled as **"Credential Dumping (T1003.003)"**.

  Primary telemetry sources include Windows PowerShell logs (Event ID 4104) and any custom logging capable of capturing PowerShell commands and their output, especially for events containing keywords like 'Get-ADDBAccount', 'BootKey', or 'DatabasePath'. If successful, this type of attack can lead to unauthorized access to user credentials, posing a significant security risk. However, the detection of this script invocation does NOT confirm that credential theft has occurred on its own, as the context of execution must be considered.

  ### Investigation Steps

  - **Review command log details**: Check PowerShell logs for Event ID 4104, filtering for commands containing `Get-ADDBAccount`. A benign invocation might show this command executed with legitimate administrative tasks.

  - **Identify the responsible user account**: Lookup the user associated with the logged PowerShell command. Legitimate administrative accounts may invoke similar commands for maintenance, but suspicious accounts or privileged users executing this command during odd hours should raise concern.

  - **Check for related system artifacts**: Validate if there are file creation or access logs associated with the `ntds.dit` file (e.g., using Event ID 4663). Legitimate access would typically not attempt to read sensitive databases outside authorized maintenance activities.

  - **Correlate with user access logs**: Examine Active Directory logs for unusual authentication attempts or modifications to user accounts around the same time (Event IDs 4624 and 4738), as this could indicate credential access and subsequent misuse.

  - **Verify any running instances of DSInternals**: If logs indicate installation or invocation of DSInternals, further investigate its context. A legitimate IT process would have ticket references or scheduled maintenance activities that are documented.

  ### Prioritization

  Given the high-risk nature of systems involved (Active Directory), this alert should be treated as high severity. The likelihood of this attack method being weaponized for credential access is moderate, particularly in environments where credentials can be leveraged for lateral movement or privilege escalation.

  ### Blind Spots and Assumptions

  Possible evasion techniques include adversaries using obscured variable names or obfuscated commands to mask their activities. Reliance on PowerShell logging and sufficient auditing configuration is crucial for effective detection. Legitimate administrative maintenance scripts may produce false positives if they interact with Active Directory account data. A companion detection involving monitoring for other PowerShell credential dumping activities (like `Mimikatz` outputs) can help strengthen overall detection capabilities.

