note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell cmdlets and modules to gather information about local groups on Windows systems. Adversaries may employ these commands, such as `Get-LocalGroup` and `Get-LocalGroupMember`, to identify users with specific permissions, particularly in groups like local administrators. This activity aligns with the reconnaissance phase of an attack, where the threat actor seeks to map out the environment and understand user roles, which can aid in planning privilege escalation or lateral movement.

  The relevant MITRE ATT&CK techniques associated with this behavior are **Discovery: Local Group Enumeration** (T1069.001) and **Discovery: Permission Groups Discovery** (T1069). Detection of this activity is crucial as it can indicate potential preparatory steps for further exploitation. The best telemetry sources for this detection include PowerShell execution logs, Windows Event Logs, and potentially EDR telemetry that captures command execution.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell logs for occurrences of `Get-LocalGroup`, `Get-LocalGroupMember`, `Get-WmiObject`, or any associated aliases, specifically focusing on user context and timestamps to identify suspicious activity patterns.

  - **Examine Event Logs:** Check Windows Event Logs for Event IDs that capture process creation (ID 4688) and any corresponding command-line arguments to trace the execution of commands related to local group enumeration.

  - **Investigate User Privilege Changes:** Look into Active Directory logs for any recent changes to user privileges and group memberships that align with the timing of the PowerShell commands detected, as this may indicate potential malicious activity.

  - **Assess PowerShell Scripting Activities:** Investigate any scripts or scheduled tasks that may correlate with the detected PowerShell commands, which could reveal systematic attempts to gather information on local groups.

  ### Prioritization
  While the severity of this alert is currently classified as low, it remains important in the enterprise context due to its potential to indicate reconnaissance efforts by an unauthorized entity. If observed in conjunction with other suspicious activities, it may warrant a higher level of scrutiny.

  ### Blind Spots and Assumptions
  This detection rule may not capture all potential enumeration methods, as attackers could employ tools or techniques bypassing PowerShell logging or utilize alternative scripting methods. Assumptions include that all PowerShell logging settings are correctly configured and that there is comprehensive visibility into execution logs. Required configurations to ensure full functionality of the alert include enabling detailed command logging for PowerShell and ensuring that sufficient retention policies are in place for audit logs.

