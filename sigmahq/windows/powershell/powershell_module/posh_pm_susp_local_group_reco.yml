note: |
  ### Technical Context

  This Sigma rule detects instances of PowerShell commands aimed at gathering information about local user groups on Windows systems. The detected behaviors include the use of cmdlets like `Get-LocalGroup`, `Get-LocalGroupMember`, `Get-WmiObject` and associated WMI methods to enumerate local groups and their members. The likely attacker objective is to gather intelligence about the system's user and group configurations, specifically identifying local administrator accounts or privileged users.

  This detection corresponds with the MITRE ATT&CK tactic "Discovery" (TA0007) and technique "Local Group Enumeration" (T1069.001). The primary telemetry sources include Windows PowerShell logs and WMI event logs. The security impact can be significant, as an adversary may exploit this information to elevate privileges or gain unauthorized access. Importantly, this detection does NOT confirm malicious activity on its own, as it may be triggered by legitimate administrative tasks.

  ### Investigation Steps

  - **Review the command context**: Check for the execution context of the detected PowerShell commands, focusing on user account and process initiating the commands. Look in Security Event ID 4688 for process creation details, particularly focusing on user accounts with administrative privileges.

  - **Analyze PowerShell logging**: Investigate relevant PowerShell events in Windows logs (Event ID 4103) to review command execution history for the presence of `Get-LocalGroup`, `Get-LocalGroupMember`, `Get-WmiObject`, or `Get-CimInstance`.

  - **Identify high-risk indicators**: Look for unusual command patterns or a high volume of local group enumeration activity from non-administrative accounts. This can indicate potential reconnaissance activity.

  - **Cross-reference legitimate behavior**: Verify if the detected PowerShell commands were executed during a maintenance window or by known administrative scripts (e.g., scheduled tasks or maintenance scripts) which are common in environment management.

  - **Examine logged user activity**: Use event information (e.g., Event ID 4624) to correlate the detected commands with user login events. Ensure that the user executing these commands is recognized and has a valid reason for running them.

  - **Look for changes in group memberships**: Investigate any recent modifications to local group memberships (Event ID 4728 or 4729) that could accompany enumeration efforts, as this may indicate malicious intent.

  ### Prioritization

  The alert is of **low severity** due to the nature of the detected actions, which are common in both benign administrative processes and nefarious reconnaissance scenarios. The likelihood of malicious intent is contingent on the context of the user account and the frequency of such queries in normal operational behavior. This technique is weaponized but often utilized for legitimate purposes by administrators.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative scripts executing similar commands, which could lead to false positives. Additionally, if PowerShell logging is not fully enabled or if WMI logging is misconfigured, this rule may produce incomplete results. Alternative authentication scenarios (such as RDP or local interactive logins) can also trigger this alert without malicious intent. Companion detections include monitoring for suspicious group membership changes (e.g., the addition of unauthorized users to local admin groups) to provide a more comprehensive view of potential threats.

