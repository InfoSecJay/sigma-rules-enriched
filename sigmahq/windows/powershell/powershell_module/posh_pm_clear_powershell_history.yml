detection:
  selection_1a_payload:
    Payload|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection_1b_payload:
    Payload|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_payload_2:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_payload_3:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_payload_* or all of selection_1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to clear PowerShell command history, which can indicate an attempt to obfuscate previous activities during a malicious operation. The likely attacker objective is to cover their tracks after executing potentially harmful commands, facilitating lateral movement or data exfiltration without leaving traces. This activity aligns with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1070.003), particularly focused on "Indicator Removal on Host."

  Primary telemetry sources required for this detection include PowerShell logs indicating executed commands and parameters, specifically within Windows Event Logs related to PowerShell (Event ID 4104 for script block logging) and modules. If successful, this malicious activity allows an attacker to maintain persistence and evade detection, significantly increasing the risk to the organization's assets. However, this detection does NOT confirm malicious intent on its own; legitimate scripts can also invoke these commands for benign purposes.

  ### Investigation Steps

  - **Review executed PowerShell commands:** Check Windows Event ID 4104 for any recent PowerShell command executions. Look for scripts that contain removal operations like 'Remove-Item' or 'del' to identify potential malicious activity.

  - **Correlate timestamp with user activity:** Analyze user activity logs around the time of the alert to determine if the PowerShell commands coincide with unauthorized access or anomalies in login behavior. Look for Event ID 4624 or 4625 to identify account usage patterns.

  - **Identify high-confidence malicious indicators:** Specifically search for any commands using `Set-PSReadlineOption` with `-HistorySaveStyle` set to 'SaveNothing'. This indicates a clear intent to prevent history saving, which is atypical in normal operations.

  - **Identify legitimate usage patterns:** Investigate whether this PowerShell history-clearing behavior matches known operational scripts used by IT staff for legitimate reasons, such as `Remove-Item *` in maintenance scripts. Scrutinize the context and associated users.

  - **Evaluate asset criticality:** Determine the role of the affected machine; if it is a critical system (e.g., domain controller or server handling sensitive data), escalate the alert based on increased risk.

  - **Check for file system changes:** Investigate file creation or modification events in PowerShell's typical history save path. Check the presence of `.txt` files in the user profile’s PowerShell history directory (e.g., `%userprofile%\Documents\WindowsPowerShell\`).

  ### Prioritization

  This alert is assessed as medium severity due to its potential to obscure malicious activities on critical systems. The likelihood of abuse is elevated as this behavior is often associated with adversarial actions designed to evade detection. The use of PowerShell to alter history is a known tactic among attackers, making this a noteworthy alert for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full PowerShell logging or prior configuration settings in Windows to allow for proper event capture; ensure that PowerShell logging is enabled across systems. Legitimate activities may include routine system maintenance operations, necessitating thorough context analysis. Companion detections could include monitoring for suspicious PowerShell execution patterns that precede history clearing actions, such as command execution of known exploitation frameworks (e.g., Meterpreter) or known malicious script signatures.

