logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection_1a_payload:
    Payload|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection_1b_payload:
    Payload|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_payload_2:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_payload_3:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_payload_* or all of selection_1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This rule detects potential attempts to erase or manipulate PowerShell command history. Attackers may utilize such techniques to hide their tracks after executing malicious commands, making it difficult for security teams to trace their activities. The main objective is obfuscation, aimed at evading detection and analysis of actions taken within the compromised environment.

  This activity maps to the MITRE ATT&CK framework under the tactic of **Defense Evasion** (TA0005) and specifically targets the technique **Indicator Removal on Host** (T1070.003).

  The primary data sources used for detection include PowerShell module logs, which capture the executed commands in a PowerShell session. Analyzing these logs helps security teams identify any attempts to clear the command history, thus highlighting suspicious user actions that may warrant further investigation.

  ### Investigation Steps
  - **Review PowerShell Activity Logs:** Analyze the PowerShell module logs to identify any executions of the commands tagged by the detection logic (e.g., `Remove-Item`, `Set-PSReadlineOption`) that indicate potential history-clearing actions.

  - **Correlate with User Activity:** Look at the user accounts associated with the detected commands and check for any patterns or anomalies in their behavior, including timing and frequency of command execution.

  - **Assess Surrounding Context:** Inspect related logs, such as Windows Event Logs or Sysmon logs, to determine whether other suspicious activities accompany the power shell history-clearing attempts, indicating a broader malicious campaign.

  - **Verify Compromise Indicators:** Conduct a broader investigation to determine if any indicators of compromise (IOCs) align with known malicious actors or techniques that might exploit PowerShell in the environment.

  ### Prioritization
  The medium severity of this alert stems from the potential impacts on incident response efforts. While clearing PowerShell history can be a legitimate administrative action, its use in the context of suspicious behavior raises the likelihood of malicious intent, making it critical for quick investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on PowerShell logs, which may not capture actions performed via alternate means or tools that achieve similar objectives. The detection logic assumes that any command clearing history is suspicious, which could lead to false positives from legitimate administrative tasks. For effective detection, the PowerShell logging must be correctly configured, ensuring command execution logs are captured in detail and that logging levels are set appropriately to monitor all relevant activities.

