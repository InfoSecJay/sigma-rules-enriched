logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection_1a_payload:
    Payload|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection_1b_payload:
    Payload|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_payload_2:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_payload_3:
    Payload|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_payload_* or all of selection_1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects attempts to clear PowerShell command history, indicative of an adversary trying to obfuscate their activities within a compromised environment. The likely attacker objective is to erase evidence of executed commands, which aids in maintaining stealth during a foothold or lateral movement phase of an attack. This behavior aligns with the MITRE ATT&CK technique T1070.003: Clear Command History. The primary telemetry sources include PowerShell logs categorized under the ps_module log source, specifically looking for PowerShell command payloads.

  If malicious, the security impact is significant, as it suggests an active effort to conceal unauthorized actions, potentially indicating a larger compromise. However, the presence of these commands alone does not confirm malicious intent, as legitimate administrative tasks can also invoke similar behaviors.

  ### Investigation Steps

  - **Examine PowerShell logs**: Review PowerShell command execution logs for Event IDs that contain the relevant payload (e.g., `Verbose` logging for PowerShell) and identify contexts where these commands were executed. Look for correlation with user sessions and process creation events.

  - **Identify common legitimate usage**: Look for typical administrative commands executed within the timeframe of the alert. Compare the command history to establish whether the detected behavior fits into a recognized workflow, such as routine maintenance or configuration changes.

  - **Correlate with user behavior**: Investigate the user account associated with the execution of the clearing commands. If the account shows unusual login patterns or is not typically associated with PowerShell activities, consider this a high-confidence malicious indicator.

  - **Inspect command context for alert criteria**: Focus on timestamps and surrounding scripts where the keywords 'del', 'Remove-Item', or 'Set-PSReadlineOption' appear. Validate if these were followed by commands indicative of malicious payloads or scripts, such as file deletions or unauthorized system modifications.

  - **Check for related logging**: Review system event logs (Event ID 4688) to identify process creation events around the same time as the alert, focusing on the parent process that initiated PowerShell. This may provide insight into the command's context and legitimacy.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of the affected system. The likelihood of malicious abuse is moderate, especially if correlated with known malicious activity patterns. Clear command history actions are often weaponized to obscure adversarial actions post-compromise.

  ### Blind Spots and Assumptions

  Detection may be circumvented through various evasion methods such as executing commands in memory or scripting techniques not captured in logs. Reliable detection requires comprehensive logging configurations specific to PowerShell activity, including enabling detailed command logging. Legitimate administrative scripts might trigger this alert, necessitating thorough contextual analysis during investigations. A related detection that strengthens coverage could be monitoring for suspicious script executions or PowerShell modules related to system changes.

