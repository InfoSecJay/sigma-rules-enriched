note: |
  ### Technical Context

  This Sigma rule detects the use of the "Import-Module" cmdlet to load the "Microsoft.ActiveDirectory.Management.dll" library, commonly utilized for Active Directory enumeration by attackers. The likely objective of an attacker utilizing this behavior is to gather information about users, groups, and computer accounts within Active Directory, often to facilitate later stages of an attack. This aligns with MITRE ATT&CK tactic and technique "Reconnaissance" (TA0043) and "Active Directory Enumeration" (T1087).

  The primary telemetry source for this detection is Windows PowerShell module logs. Specifically, it leverages logs from the security event or PowerShell-specific logs that capture cmdlets executed by users. If malicious, this behavior can lead to a compromise of sensitive user or organizational data. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate Admin activities may also invoke the same cmdlet.

  ### Investigation Steps

  - **Review cmdlet execution context:** Check for Security Event ID 4688 (Process Creation) for the invocation of PowerShell and ensure it originates from a legitimate administrative context. Look for parent processes such as `powershell.exe` or `pwsh.exe`.

  - **Inspect loaded modules:** Audit for Event ID 400 (PowerShell Module Usage) specifically focusing on the loading of `Microsoft.ActiveDirectory.Management.dll`. This DLL’s presence with the Import-Module cmdlet strongly indicates potential enumeration activity.

  - **Identify user account behavior:** Analyze related user account activity that may seem suspicious, such as accounts typically not performing administrative tasks executing the cmdlet. Note typical behavior for administrative accounts performing legitimate tasks related to Active Directory management.

  - **Cross-reference with network activity:** Examine network logs for any connections made after the execution of the cmdlet that may indicate data exfiltration or lateral movement attempts (e.g., unusual LDAP queries or API accesses).

  - **Look for historical patterns:** Cross-check whether this cmdlet execution correlates with other similar alerts or previous instances of enumeration attempts (related detection ID: 70bc5215-526f-4477-963c-a47a5c9ebd12).

  ### Prioritization

  This alert should be considered medium severity. While the immediate impact of a system being used to enumerate Active Directory could be significant, the likelihood of malicious abuse largely depends on the user context in which this behavior occurs. Furthermore, Active Directory enumeration is a common precursor to more severe attacks, so timely investigation is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; specifically, PowerShell transcription and module logging must be enabled for reliable coverage. Non-malicious activities, such as legitimate administrative tasks performed by authorized personnel, may inadvertently trigger this alert. Another effective detection approach includes monitoring for specific LDAP queries that follow this behavior, enhancing the overall visibility of potential reconnaissance activities.

