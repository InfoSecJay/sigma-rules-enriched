note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell’s `Import-Module` cmdlet to load the `Microsoft.ActiveDirectory.Management.dll` library, a DLL commonly associated with Active Directory (AD) enumeration activities. Attackers frequently utilize this mechanism to gather detailed information about AD environments, such as user accounts, security group memberships, and other sensitive organizational data, often bypassing traditional administrative privileges.

  The primary objective of utilizing such tools is to facilitate reconnaissance and subsequent exploitation by identifying potential vulnerabilities within the target environment. In particular, attackers may aim to gather information for privilege escalation, lateral movement, or to create a more detailed attack plan against critical assets.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Reconnaissance (T1087)
  - **Technique:** Account Discovery (T1087.001)

  The primary data sources for this detection are Windows PowerShell logs, specifically focusing on command execution events that involve the `Import-Module` command or interactions with the `Microsoft.ActiveDirectory.Management.dll` library.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell command logs for instances of `Import-Module` or `ipmo` commands that reference `Microsoft.ActiveDirectory.Management.dll`. Look for unusual execution patterns or timestamps that align with reported security incidents.
  - **Analyze Command Context:** Identify the user context under which the commands were executed. Verify whether the user had legitimate administrative privileges or if the command was executed under a potentially compromised account.
  - **Monitor Network Activity:** Inspect network traffic logs for connections to AD services or systems that correlate with the timing of the detected commands. Note any suspicious or unusual IP addresses that interacted with the directory.
  - **Evaluate User Activity:** Check the affected account's behavior surrounding the time of the PowerShell execution. This includes examining other logs (e.g., authentication logs, access logs) to identify any anomalies or indications of lateral movement.

  ### Prioritization
  The alert has a medium severity level due to its potential to reveal sensitive organizational information that can be exploited by malicious actors. Given that AD enumeration is frequently a precursor to further attacks, timely investigation is crucial to mitigating risk.

  ### Blind Spots and Assumptions
  There may be detection gaps surrounding legitimate administrative operations involving the AD PowerShell module, leading to potential false positives. The detection logic assumes that all instances of `Import-Module` related to the AD library are indicators of malicious behavior, neglecting legitimate administrative tasks. Additionally, for effective detection, the organization must have PowerShell logging enabled and properly configured for its environment, as well as centralized logging for analysis.

