note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Get-Clipboard`, which retrieves the contents of the clipboard. Attackers might utilize this command to capture sensitive information, such as user credentials or confidential data, that has been copied to the clipboard. This behavior typically indicates a tactic aimed at data collection, fitting within the MITRE ATT&CK framework under the technique "Data from Local System" (T1115).

  The primary telemetry source is PowerShell logs, specifically those that capture command executions. If malicious, the security impact could include unauthorized data exfiltration or compromise of sensitive information. It's important to note that this detection alone does NOT confirm malicious intent; it could also capture legitimate user actions.

  ### Investigation Steps

  - **Check PowerShell Logs for Command Execution:** Retrieve relevant PowerShell logs, specifically looking for Event ID 4104 that captures command invocations. Validate if other commands were issued in conjunction with `Get-Clipboard` that could indicate suspicious behavior.

  - **Analyze User Context and Timing:** Investigate the user associated with the PowerShell session and the timing of the command. Look for unusual hours or a user profile that typically does not perform such actions, indicating potential malicious use.

  - **Correlate with Clipboard Content Activities:** If accessible, review system clipboard usage to see if sensitive data (e.g., passwords, credit card information) was manipulated or accessed around the time of this command execution.

  - **Review Frequent Users of Get-Clipboard Command:** Identify any common tasks or applications that use `Get-Clipboard` in a legitimate context. For example, administrative scripts that utilize clipboard for copy-pasting might indicate benign usage.

  - **Validation of PowerShell Execution Policy:** Ensure that the PowerShell execution policy is set appropriately and not configured to allow for unrestricted script execution, which facilitates an easier attack surface for malicious activity.

  ### Prioritization

  The alert is medium severity due to the nature of the affected system; if an endpoint processes sensitive information, the data could be compromised. The likelihood of malicious abuse is moderate, as while `Get-Clipboard` can capture data, it is not exclusively used by attackers. This behavior is weaponized in specific scenarios, making it critical to investigate.

  ### Blind Spots and Assumptions

  Detecting `Get-Clipboard` may miss instances if PowerShell logging is not configured correctly or if logging levels are insufficient. Legitimate software applications or administrative automation can trigger this alert under normal operations. A companion detection, such as monitoring for `Set-Clipboard` commands (T1115), would enhance coverage by identifying potential data write operations to the clipboard.

