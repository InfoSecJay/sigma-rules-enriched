note: |
  ### Technical Context
  This rule detects the execution of the PowerShell command `Get-Clipboard`, which can be used by adversaries to capture clipboard contents from a victim's machine. The technique associated with this behavior falls under the MITRE ATT&CK framework's "Data from Local System" tactic (ID: T1115). Attackers may leverage this command to exfiltrate sensitive information, such as passwords or tokens, that might have been temporarily copied to the clipboard during a user session.

  The primary objective of an attacker using `Get-Clipboard` is to facilitate information gathering or exfiltration without raising immediate alarms. As organizations often rely on sensitive credentials being copied to the clipboard for various legitimate operations, detecting such activities can reveal potential data theft attempts or other malicious behavior. The presence of this command, especially in unexpected contexts, should warrant further investigation to uncover any underlying malicious intent.

  Relevant MITRE ATT&CK techniques related to this rule include:
  - **Tactic: Collection**
  - **Technique: Data from Local System (T1115)**

  The best evidence to support detection of this behavior comes from PowerShell logs that detail command execution, particularly logs generated by Windows that relate to PowerShell module activities.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell execution logs for occurrences of the `Get-Clipboard` command. Look for any unusual execution contexts or user accounts not typically associated with clipboard access.
  - **Correlate with User Activity**: Assess user activities surrounding the times of `Get-Clipboard` command execution. Investigate any recent changes in user behaviors or access patterns that may indicate compromise.
  - **Analyze Process Creation Events**: Inspect process creation events to identify whether the command was executed from a legitimate PowerShell session or if it was spawned by suspicious parent processes, which may indicate malicious usage.
  - **Check for Clipboard Contents**: If feasible, attempt to review clipboard contents (subject to legal and privacy concerns) to determine if sensitive data was captured and exfiltrated. This can further corroborate malicious intent.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of data theft and the likelihood of misuse in sophisticated attacks; the ability to exfiltrate sensitive information crucially risks the security and integrity of enterprise environments.

  ### Blind Spots and Assumptions
  Detection may miss legitimate uses of the `Get-Clipboard` command, particularly in environments where users frequently copy data as part of their normal workflow. The detection logic assumes that PowerShell logging is enabled and operational, without which this rule would not generate alerts. Additional logging for parent process information may also be necessary to contextualize the command execution further and identify whether it stems from a trusted or compromised path.

