note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell cmdlet `Compress-Archive` in scenarios where the output files are stored in potentially suspicious locations, such as the designated temporary folders used frequently by malware for exfiltration. Adversaries may use this technique to compress sensitive data prior to exfiltration, making it easier to transport and potentially bypassing some detection mechanisms, especially if data is being transferred in smaller chunks. This behavior can be part of a larger exfiltration strategy or data staging process that poses a significant risk to sensitive information within an organization.

  The relevant MITRE ATT&CK tactics include **Collection** (ID: T1074.001), which focuses on the gathering of information in preparation for exfiltration. By leveraging PowerShell's capabilities, adversaries can effectively script their malicious activities to perform data zipping in order to prepare files for later exfiltration. The primary data sources for this detection include **PowerShell script logs**, which capture command executions, as well as logs from systems that monitor file modifications and accesses in temporary directories.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine recently run PowerShell commands for instances of `Compress-Archive` targeting `$env:TEMP`, `C:\AppData\Local\Temp`, or `C:\Windows\Temp`. Look for anomalous user accounts or unexpected execution contexts.
  - **Check File Access Logs**: Analyze file access logs for any file creation or modification events in the aforementioned temporary directories immediately preceding or following an instance of `Compress-Archive` usage. Pay close attention to any large compressed files or patterns indicative of staging for exfiltration.
  - **Correlate with Network Activity**: Investigate outgoing network traffic to identify any connections to unusual external IP addresses or data transfers that may correlate with the timing of the compress command usage. Focus on file transfer protocols that can indicate potential data exfiltration.
  - **Assess User Behavior**: Evaluate the user accounts associated with the detected activity. Look for patterns in user behavior that may suggest compromise, such as accessing systems or files they don't typically interact with.

  ### Prioritization
  This alert should be classified with medium severity due to the potential impact of data exfiltration, especially if sensitive information is being targeted, and the likelihood of exploitation increases when attackers stage data for extraction in less monitored temporary directories.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of data compression used for legitimate purposes, potentially leading to false positives, particularly in environments where legitimate use of PowerShell for server maintenance is common. The detection logic assumes that PowerShell logging is enabled and appropriately configured to capture command executions. Without comprehensive logging of process creations and script executions, there is a gap whereby malicious activities may go undetected. Companies must ensure proper configurations for their logging mechanisms to effectively detect such behaviors.

