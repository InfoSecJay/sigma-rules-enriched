note: |
  ### Technical Context

  This rule detects the execution of the PowerShell `Compress-Archive` cmdlet, particularly when it compresses folders or files to temporary directories that are often targeted by adversaries for data exfiltration, such as `$env:TEMP`, `C:\Users\<Username>\AppData\Local\Temp\`, or `C:\Windows\Temp\`. The likely objective of an attacker is to package sensitive data collected during reconnaissance or prior compromise to facilitate easier exfiltration. This behavior aligns with the MITRE ATT&CK technique for Collection, specifically T1074.001 (Data Staged). The primary telemetry sources include PowerShell logs (Event IDs 4103 and 4104), potentially facilitated by enabling script block logging or transcription. If malicious, this action could indicate the staging of sensitive data for exfiltration. Importantly, this detection does NOT confirm actual data exfiltration or that the user's intention is malicious merely based on this cmdlet usage.

  ### Investigation Steps

  - **Check PowerShell execution history:** Review PowerShell Event ID 4104 logs for the presence of `Compress-Archive` commands and the specific parameters used. Look for paths leading to `$env:TEMP` or similar locations to find potentially suspicious command execution.

  - **Identify high-confidence malicious indicators:** Verify if any files or folders compressed to temporary directories contain sensitive information such as PII, financial records, or proprietary documents. Check metadata and content to establish the nature of the files.

  - **Examine recent user activity:** Analyze the timeline of user and system activities leading up to the execution of the cmdlet. Check for unusual file access in the same temp directories as documented in Security Event IDs 4663 (File Access) or Sysmon Event ID 11 (File Create).

  - **Correlate with ongoing threat intelligence:** Cross-check the use of `Compress-Archive` in temp directories with known malicious indicators or TTPs from threat intelligence feeds, especially those related to data exfiltration methods.

  - **Identify legitimate usage patterns:** Determine if the user account that triggered the alert routinely utilizes PowerShell for legitimate administrative tasks. Review typical commands executed by the user, focusing on work-related tasks that may involve file compression.

  - **Validate file activity in temp directories:** Check for the existence of compressed files using Windows Event ID 4663 and Sysmon Event ID 11 within `$env:TEMP` at the time of the alert. Assess file names and timestamps for suspicious creation activities.

  ### Prioritization

  This alert should be considered medium severity due to the potential risk of data exfiltration if executed by an unauthorized user. The likelihood of abuse is moderate, particularly if the event correlates with known patterns of post-exploitation behavior. Compressing data to temp directories is a tactic seen in various malware campaigns, making it a valid area of concern.

  ### Blind Spots and Assumptions

  Detection is limited by the need for PowerShell logging to be enabled for comprehensive visibility. Legitimate activities such as software installations or administrative scripts could trigger the alert. Additionally, sophisticated attackers may avoid detection by using alternative methods to compress or obfuscate their data. Companion detections include monitoring of network traffic for unusual outbound connections following the execution of the Compress-Archive cmdlet, which could indicate post-staging exfiltration attempts.

