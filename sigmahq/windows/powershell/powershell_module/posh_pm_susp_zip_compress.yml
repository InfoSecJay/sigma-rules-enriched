note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Compress-Archive` cmdlet to zip folders or files, specifically when the output is directed to common temporary file locations like `%TEMP%` or `%APPDATA%\Local\Temp`. The likely attacker objective is to package sensitive information for subsequent exfiltration by compressing data, thereby reducing the data size and making it easier to transfer covertly. This activity aligns with the MITRE ATT&CK tactic of Collection (T1074.001) under the technique "File and Directory Permissions Modification." The primary telemetry sources are Windows PowerShell logs, specifically monitoring the execution of PowerShell scripts and the cmdlets used.

  If malicious, compressing files in these directories may indicate an attempt to stage or prepare a data exfiltration process. However, this detection does NOT confirm that exfiltration has occurred; it solely highlights a potentially suspicious action that warrants further review.

  ---

  ### Investigation Steps

  - **Verify the PowerShell command execution:** Check for Event ID 4104 in PowerShell logs for any script block containing `Compress-Archive -Path` paired with suspicious file usage patterns in the `%TEMP%` or `%APPDATA%\Local\Temp` directories.

  - **Identify the source of the PowerShell command:** Look into process creation logs (Event ID 4688) to correlate the execution of PowerShell with the parent process. Investigate processes that initiated the PowerShell command for any signs of malicious behavior.

  - **Cross-validate the output location:** Inspect the contents of the `%TEMP%` and `%APPDATA%\Local\Temp` directories (via file system access) for recent compressed files created around the time of the alert. Look for file names or sizes that indicate sensitive data, which can support a malicious intent.

  - **Assess the host role:** Determine whether the affected host is a critical asset, such as a file server or database. If so, elevate the urgency of the investigation based on its role in the enterprise.

  - **Recognize legitimate use cases:** Note that legitimate administrative activities may require the use of `Compress-Archive`, especially during system maintenance. Contextualize alerts based on the role of the user executing the command.

  - **Utilize companion detections:** Monitor for related detections such as suspicious outbound traffic (e.g., unusual HTTP/S connections or data transfers) following the creation of compressed archives, which may indicate data exfiltration attempts.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of sensitive data being compressed for unauthorized transfer. While this activity could indicate staging for data exfiltration, it does not guarantee that such abuse is occurring. However, the use of common temp locations for compression is a known tactic among adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of attackers to leverage legitimate PowerShell functionalities without raising alarms, potentially avoiding logging. It requires PowerShell script logging to be enabled for comprehensive coverage. Legitimate administrative actions may also trigger this alert, underscoring the need for context in investigation. A related detection involving unusual file access patterns post-compression can enhance overall detection capabilities.

