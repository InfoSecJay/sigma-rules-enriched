note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Reset-ComputerMachinePassword`, which is typically used to modify the password of a computer account in Active Directory. The likely attacker objective in utilizing this command is to manipulate authentication mechanisms after gaining access to a system, allowing them to maintain persistence or execute further malicious actions. This behavior aligns with the MITRE ATT&CK techniques of Persistence (T1078), Privilege Escalation (T1068), and Initial Access (T1078).

  The primary telemetry sources include PowerShell logs, specifically event IDs 4103 (for non-interactive sessions), 4104 (for script block logging), and the Sysmon Event ID 1 (for process creation). If malicious, this action could facilitate unauthorized access and control over domain resources, leading to significant security impacts. It is crucial to note that this detection does NOT confirm malicious intent, as legitimate administrative tasks may invoke this cmdlet as part of normal operations.

  ### Investigation Steps

  - **Identify the PowerShell execution context:** Review Event ID 4104 and 4103 for the user context and specific command details. This will help determine if the action was performed by a known administrator or an unauthorized user account.

  - **Check user account activity:** Verify the user’s logon history for anomalies around the time of the command execution using Event ID 4624. Look for multiple failed logon attempts or logins from unusual locations.

  - **Monitor for suspicious process creation:** Review Sysmon Event ID 1 for parent processes that executed the PowerShell command. If the parent process is a common administrative tool or service, this may be benign. However, if launched by an unknown or rarely used process, further analysis is warranted.

  - **Assess legitimate use cases:** Document and review any legitimate scheduled tasks, scripts, or administrative actions known to invoke `Reset-ComputerMachinePassword`. This could include routine password management by IT staff.

  - **Look for associated lateral movement behaviors:** Monitor for any subsequent use of PowerShell commands or Windows event IDs indicating lateral movement (e.g., Event ID 4648, Credential Validation) following the password reset.

  ### Prioritization

  This alert carries a medium severity level in an enterprise context, as the action of resetting a machine password can indicate potential privilege escalation or persistence by an adversary. While the cmdlet can also have legitimate administrative purposes, its misuse is a common tactic among attackers attempting to leverage credentials for lateral movement or control.

  ### Blind Spots and Assumptions

  Detection relies heavily on proper logging configurations for PowerShell, meaning that if logging is not enabled, this activity may go unnoticed. Evasion techniques might include using obfuscated PowerShell commands or running scripts in memory to avoid triggering logging. Legitimate activities could stem from authorized system administrators performing routine domain management tasks. A companion detection to consider would be monitoring for failed authentication attempts or unusual account behavior leading up to the use of this cmdlet, enhancing overall visibility into potential security incidents.

