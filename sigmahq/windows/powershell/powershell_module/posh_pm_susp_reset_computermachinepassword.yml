note: |
  ### Technical Context
  This detection rule targets the use of the `Reset-ComputerMachinePassword` cmdlet in PowerShell, which is utilized to change a computer's account password for authenticating with domain controllers. While this command is legitimate and can be employed by system administrators for maintenance purposes, its misuse may indicate malicious activity, such as an attacker attempting to take control of a compromised machine or escalate privileges within the network.

  In a threat scenario, an attacker can utilize this cmdlet to reset the computer account password of a targeted machine to regain access or maintain persistence within the environment. Their objectives could include gaining unauthorized access to sensitive systems or establishing footholds for further exploitation. Related MITRE ATT&CK tactics include Privilege Escalation (TA0004), with techniques such as Valid Accounts (T1078), which emphasizes gaining and using valid authentication to access systems or data.

  Primary data sources for detecting this activity would include Windows PowerShell logs, specifically monitoring for the execution of pertinent cmdlets and arguments indicative of suspicious behavior.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell logs for instances of the `Reset-ComputerMachinePassword` cmdlet being executed. Look for unusual patterns or frequency of execution that deviates from normal administrative behavior.

  - **Analyze User Context**: Investigate the account context under which the command was executed. Assess whether it was executed by a legitimate admin account or if a potentially compromised account initiated the action.

  - **Cross-reference with Active Directory Logs**: Examine Active Directory change logs and event logs to confirm whether the computer password was actually reset. Look for multiple changes within a short time frame, which may signal an automated or nefarious script.

  - **Check for Lateral Movement**: Monitor for follow-up activities or commands issued from the affected machine. Identify if additional administrative actions or network connections to sensitive resources were made following the password reset.

  ### Prioritization
  The severity of this alert is medium due to the potential for attackers to manipulate authentication processes and maintain persistence in the environment. While PowerShell can be used legitimately by administrators, abnormal usage patterns warrant prompt investigation given the risk of privilege escalation or lateral movement within the organization.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate administrative uses of the `Reset-ComputerMachinePassword` cmdlet, thus potentially leading to false positives. Key assumptions include that any sudden or frequent use by non-administrative users is malicious. Furthermore, successful detection requires PowerShell logging to be enabled on target systems; without these logs, the use of this cmdlet could go unnoticed. The SIEM must also be configured to aggregate and correlate logs from various sources, including Active Directory and Windows Event logs, for effective detection.

