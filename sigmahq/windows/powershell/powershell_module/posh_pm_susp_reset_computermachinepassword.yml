  ### Technical Context

  This Sigma rule detects the invocation of the `Reset-ComputerMachinePassword` cmdlet in PowerShell, which is typically used for resetting the machine account password for Windows computers in a domain. The likely attacker objective is to exploit this functionality either for lateral movement or persistence within the network, particularly in a compromise scenario where an adversary gains administrative access. The relevant MITRE ATT&CK techniques associated with this behavior include "T1078 – Valid Accounts" and actions related to persistence methods.

  Primary telemetry sources include Windows PowerShell logs (Event ID 4103), which capture script execution details, as well as Security logs for potential related events (Event ID 4688). If performed maliciously, this action may allow an attacker to persistently manipulate domain authentication mechanisms. Importantly, while this detection indicates suspicious activity, it does NOT confirm malicious intent on its own; legitimate administrative tasks may also utilize this cmdlet.

  ---

  ### Investigation Steps

  - **Check for PowerShell execution context:** Review Event ID 4103 from the Windows PowerShell logs to identify the user context executing the cmdlet. Legitimate use should typically be limited to domain admins.

  - **Identify command parameters and context:** Analyze if the `Reset-ComputerMachinePassword` was executed with unexpected parameters or from non-standard locations (e.g., user home directories vs. System32).

  - ** Correlate with Security Event ID 4688:** Examine Security Event ID 4688 logs to see if this cmdlet was executed alongside other suspicious commands or from unusual processes (e.g., non-administrative accounts).

  - **Evaluate User Behavior:** Cross-reference the account that executed the command against established baselines of legitimate activity. Accounts with no history of administrative actions should raise flags.

  - **Look for concurrent suspicious activity:** Check for Event IDs indicating other high-risk behaviors, such as abnormal logins (Event ID 4624) or unexpected service creations (Event ID 4697), around the same timeframe to assess if there's a broader attack occurring.

  - **Assess network traffic:** If applicable, review network traffic captures for abnormal external communications that may indicate exfiltration or command and control (C2) interactions occurring after the execution of this cmdlet.

  ---

  ### Prioritization

  The alert severity is medium due to the potential risk of compromising domain authentication services, especially if executed by non-privileged accounts. While the cmdlet can be used for legitimate purposes, its invocation in a suspicious context raises concerns about possible malicious exploitation, which is a tactic often leveraged by attackers during lateral movement and persistence.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion tactics, such as legitimate administrators using the cmdlet for maintenance tasks. Reliable detection requires proper logging configurations to capture PowerShell activities fully, including transcription logging. Additionally, legitimate context, such as regular domain maintenance scripts, may trigger this alert. A related detection to consider includes monitoring for unauthorized use of administrative tools (e.g., ETW events related to WMIC or PsExec).

