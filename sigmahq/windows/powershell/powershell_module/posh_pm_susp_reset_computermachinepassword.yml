note: |
  ### Technical Context

  This Sigma rule detects the invocation of the PowerShell cmdlet `Reset-ComputerMachinePassword`, which is used to change the password for a computer account in a domain. The behavior typically indicates an attempt by an attacker to maintain persistence or escalate privileges within the environment, facilitating unauthorized access or manipulation of domain resources. The relevant MITRE ATT&CK tactics include **Persistence (T1547)** and **Privilege Escalation (T1068)**.

  The primary telemetry sources include PowerShell logs (Event ID 4104) and Security logs where suspicious PowerShell commands may be tracked. If the detection is triggered maliciously, the incident could lead to unauthorized domain access, potential lateral movement, and heightened risk of data breaches. This detection does NOT confirm an attack definitively, as legitimate administrative tasks may trigger the alert in a controlled environment.

  ### Investigation Steps

  - **Verify PowerShell command execution:** Check logs for **PowerShell Event ID 4104** to confirm the execution context of `Reset-ComputerMachinePassword`. Review the command’s parameters for anomalies and context, such as surrounding commands indicating scripted automation.

  - **Investigate the user context:** Cross-reference the user account executing the cmdlet with normal operational profiles. Legitimate administrative accounts executing this command are expected to have appropriate role permissions; unknown or service accounts may indicate malicious intent.

  - **Review account activity:** Look into the **Active Directory (AD)** logs for any recent changes to the targeted machine account or its password history. Examine **Event ID 4742** (Computer Account Changed) for suspicious modifications or patterns indicating unauthorized password resets.

  - **Inspect related scheduled tasks:** Examine **Task Scheduler** for any newly created tasks that may correlate with the execution of the cmdlet. Unsanctioned tasks running on the same timeline could signify an effort to automate further malicious actions.

  - **Identify high-confidence malicious indicators:** Look for any anomalous or frequent use of password-resetting commands outside typical IT maintenance windows (such as weekends or after hours) that correlate with other suspicious activity (e.g., unusual logon attempts).

  - **Analyze other PowerShell activities:** Review prior PowerShell commands in Event ID 4104 logs for links to other malicious behaviors, such as encoding or obfuscated commands (i.e., Base64 strings) that may indicate sophisticated attacks leveraging PowerShell beyond simple account management.

  ### Prioritization

  This alert should be considered medium severity due to the critical nature of domain controller interactions. While legitimate administrative tasks can execute this command, systematic misuse or unauthorized use poses a significant risk of privilege escalation or domain compromise, especially if followed by lateral movements within the environment.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers employ sophisticated obfuscation techniques or leverage alternative tools for account management. Reliable detection requires that PowerShell logging is adequately configured and enabled across all endpoints. Legitimate activities, such as planned IT maintenance or environment migrations, may also trigger this alert. Related detections that strengthen coverage include monitoring of **Event ID 4624** for account logins immediately preceding suspicious PowerShell commands.

