note: |
  ### Technical Context

  This rule detects the obfuscated execution of PowerShell commands that leverage environment variables, commonly used to hide the true nature of a script or command invoked by an attacker. The likely objective of the attacker is to execute arbitrary commands on the target system while evading detection. This behavior aligns with the MITRE ATT&CK framework, specifically the tactics of Defense Evasion (TA0005) and Execution (TA0002) using obfuscated commands (T1027) and PowerShell command and scripting (T1059.001). The primary telemetry sources include PowerShell module logs (Event ID 4103) where the command execution context is captured. If successful, malicious actions can lead to significant compromise of system integrity and confidentiality. Importantly, this detection does not confirm the intent or success of the execution action, nor does it indicate whether the command executed was malicious or benign.

  ### Investigation Steps

  - **Review PowerShell logs for Event ID 4103:** Filter logs for recent entries that match the command obfuscation pattern indicative of attacker behavior. Check for strings resembling "cmd" followed closely by commands that set environment variables in an unusual context.

  - **Evaluate process execution context:** Cross-reference the identified PowerShell process with Process Event ID 4688 logs. Look for unusual parent-child process relationships or unexpected scripts being called, indicating potential malicious intent.

  - **Identify legitimate use cases:** Examine PowerShell logs in your environment for common administrative actions that properly utilize environment variable manipulation without extensive obfuscation. Note common commands executed by known maintenance scripts that could create false positives.

  - **Investigate for further malicious indicators:** Look for subsequent network connections represented in logs (e.g., Event ID 5156 for Windows Filtering Platform) that originated from the PowerShell process, indicating potential command and control activity or data exfiltration.

  - **Validate presence of the Invoke-Obfuscation module:** Search the file system for the presence of PowerShell modules related to Invoke-Obfuscation. Ensure to check paths like `C:\Program Files\WindowsPowerShell\Modules\` for any unauthorized modules that could facilitate this tactic.

  ### Prioritization

  This alert should be considered high priority due to the potential high impact on affected systems, particularly if administrative privileges are exploited. The use of command obfuscation is a common technique among threat actors, indicating a likelihood of malicious use. Thus, it warrants immediate attention from analysts.

  ### Blind Spots and Assumptions

  The detection may be limited due to script execution policy configurations that permit legitimate scripts to operate similarly. Recording of PowerShell command outputs needs to be properly configured to ensure complete visibility. Additionally, legitimate administrative tasks involving PowerShell may inadvertently trigger this detection, particularly in environments where automation scripts are heavily utilized. Implementing related detections for network activity post-PowerShell execution will strengthen coverage against potential exfiltration attempts.

