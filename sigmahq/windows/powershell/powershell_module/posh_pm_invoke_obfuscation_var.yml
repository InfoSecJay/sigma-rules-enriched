note: |
  ### Technical Context
  This rule detects the execution of PowerShell commands that utilize obfuscation techniques to manipulate environment variables, commonly used by threat actors to evade detection. The use of tools such as Invoke-Obfuscation allows attackers to conceal their intent and avoid standard security controls, ultimately leading to the execution of malicious code within a compromised environment. Adversaries may leverage this technique during initial access or lateral movement phases, aiming to execute scripts that perform payload delivery, data exfiltration, or further infrastructure exploitation.

  In terms of the MITRE ATT&CK framework, this detection aligns with the following tactics and techniques:
  - **Defense Evasion** (T1070)
  - **Execution** (T1059.001)

  The primary data sources that provide evidence for such activities include PowerShell logs that capture script execution, including detailed logs of commands executed, environmental variables being manipulated, and potentially associated error messages.

  ### Investigation Steps
  - **Review PowerShell Logs**: Collect and analyze PowerShell execution logs for obfuscated commands, paying close attention to any scripts that manipulate environment variables and contain suspicious parameters.
  - **Check Process Creation Logs**: Analyze process creation events for any instances of PowerShell launching with parameters indicative of obfuscation (e.g., invocation of `cmd.exe` with environment variable manipulation).
  - **Correlation with Other Logs**: Cross-reference findings with Windows Event logs, looking for patterns linked to known malicious behaviors or indicators of compromise associating with Northward and lateral movement.
  - **Investigate Anomalous Execution Contexts**: Identify accounts and systems from which the scripts were executed, looking for deviations from normal user behavior or known safe applications.

  ### Prioritization
  This alert is given a high severity due to the potential impact of obfuscated PowerShell execution on enterprise environments. The likelihood of these activities correlating with advanced persistent threats or other malicious actors underscores the urgency for rapid investigation and response.

  ### Blind Spots and Assumptions
  Potential blind spots include the reliance on effective PowerShell logging, which may not be enabled or fully configured across all endpoints, potentially hindering detection capabilities. The detection logic assumes that obfuscated commands will be generated and executed directly from PowerShell, causing missed detections if alternate execution methods are employed. Required logs for this rule to function optimally include comprehensive PowerShell logs and process creation events across all Windows systems in the environment.

