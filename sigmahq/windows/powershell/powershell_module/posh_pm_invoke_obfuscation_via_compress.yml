  ---

  ### Technical Context

  This rule detects the use of obfuscated PowerShell scripts leveraging the COMPRESS OBFUSCATION technique, which can obscure the true intent of the code. Attackers typically use such obfuscation methods to evade detection while executing malicious commands or payloads. This behavior falls under the MITRE ATT&CK tactics of Defense Evasion (T1569) and Execution (T1059.001). The primary telemetry source is PowerShell logging, specifically capturing module execution and payloads through logs generated by the Windows Event IDs (e.g., 4103). If the detected behavior is indeed malicious, it could indicate an attempt to execute commands for information theft, system compromise, or lateral movement. Importantly, this detection does not confirm malicious intent on its own, as obfuscated PowerShell can also be employed in legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Review PowerShell Command Details:**
    Investigate the PowerShell command(s) associated with the alert, focusing on the Payload contents. Look for occurrences of 'new-object' and 'system.io.compression.deflatestream' in Event ID 4103 logs.

  - **Assess Context of Execution:**
    Check the user context and operational environment for the PowerShell execution (Event ID 4103) to identify if this script was run by an administrative user performing routine operations versus potentially unauthorised access.

  - **Analyze Related Files and Artifacts:**
    Validate any related file creation or changes on the system. Investigate for the presence of temporary files or artifacts typically associated with PowerShell compression techniques (e.g., look for files in the `%TEMP%` directory).

  - **Identify Malicious Indicators:**
    Look for other indicators of compromise (IoCs) associated with this execution, such as frequent PowerShell calls with obfuscated parameters, or previous alerts tied to the same user or system.

  - **Validate Legitimate Activity:**
    Identify if there are known scheduled tasks or maintenance scripts that legitimately utilize PowerShell compression or obfuscation to assess benign usage in the environment.

  - **Check Additional Detection Signatures:**
    Review for any related or companion detections, such as those targeting suspicious PowerShell activity or additional obfuscation methods, to strengthen coverage and context around the incident.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential risk involved if an endpoint is compromised, especially within critical systems. The use of obfuscation techniques is commonly weaponized by adversaries to bypass security measures and execute unauthorized commands, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of PowerShell logging configurations—if logging is not properly enabled, legitimate activity could trigger the alert unnoticed. Certain legitimate administrative tasks might also create similar obfuscated patterns. It is beneficial to cross-reference this alert with detection for other PowerShell execution patterns (e.g., base PowerShell activity alerts) to provide a broader context of potential threats.

