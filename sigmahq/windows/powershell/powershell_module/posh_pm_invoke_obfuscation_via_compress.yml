note: |
  ### Technical Context
  This detection rule is designed to identify the use of the Invoke-Obfuscation PowerShell module's COMPRESS OBFUSCATION feature, which is often leveraged by attackers to evade detection mechanisms through obfuscation techniques. The primary goal of an attacker employing obfuscated PowerShell is to execute potentially malicious commands while avoiding traditional security defenses such as Antivirus or Endpoint Detection and Response (EDR) solutions. By using obfuscation, attackers can conceal the true nature of their payloads, making their actions harder to detect and mitigate.

  Relevant tactics from the MITRE ATT&CK framework that apply to this detection include **Defense Evasion** (ID: T1027), as the obfuscation of commands aims to bypass security measures, and **Execution** (ID: T1059.001), which pertains to the execution of PowerShell scripts in a malicious context. The primary data sources for gathering evidence related to this detection are Windows PowerShell module logs, specifically those capturing PowerShell command executions that include obfuscated content and the use of compression libraries like `System.IO.Compression`.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell logs for instances of obfuscation, specifically focusing on the presence of commands that include `new-object`, `text.encoding]::ascii`, and compression libraries like `System.IO.Compression`.
  - **Examine System Event Logs**: Check for unusual system event logs that could indicate the execution of obfuscated scripts within a suspicious timeline, correlating with other network activity.
  - **Analyze Process Creation Events**: Look for process creation events that originate from suspicious or unexpected parent processes, especially those executing PowerShell with obfuscated commands.
  - **Evaluate Network Traffic**: Inspect any outbound network connections made during the execution of suspicious PowerShell commands, particularly monitoring for any connections to known malicious IPs or domains.

  ### Prioritization
  The alert's severity is determined as medium due to the potential impact of obfuscated PowerShell commands being indicative of a more extensive compromise. While obfuscation alone may not indicate a breach, it raises suspicion and warrants immediate investigation, particularly in high-value environments.

  ### Blind Spots and Assumptions
  One potential blind spot in the detection coverage is the reliance on accurate PowerShell logging, which must be enabled and properly configured to capture all necessary events. The detection logic assumes that attackers will utilize the standard patterns recognized by this rule; however, advanced adversaries may craft their obfuscation methods to evade this detection. Moreover, if logging is not enabled for PowerShell module activities, crucial data needed for effective detection may not be available, thereby limiting the effectiveness of the alert.

