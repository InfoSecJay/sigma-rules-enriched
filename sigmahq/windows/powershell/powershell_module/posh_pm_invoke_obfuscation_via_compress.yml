note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell module for obfuscation, specifically through strings typically associated with the `COMPRESS` obfuscation technique. The likely objective of an attacker employing this technique is to evade detection while executing malicious payloads or scripts in a discreet manner, potentially for data exfiltration or executing subsequent payloads. This behavior is associated with the MITRE ATT&CK tactics of Defense Evasion (T1027) and Execution (T1059.001) through obfuscated script execution.

  The primary telemetry source for this detection is PowerShell logging, particularly focusing on the command line arguments and payloads being executed. The security impact of malicious use can be significant, as it often signals attempts to bypass security controls and execute malicious code without detection. However, this detection does NOT confirm that the code executed was inherently malicious, as benign scripts can also use obfuscation for legitimate purposes.

  ### Investigation Steps

  - **Review PowerShell process invocations**: Check Security Event ID 4688 for the creation of PowerShell processes. Focus on command line arguments containing `new-object` and references to `text.encoding]::ascii`, as these are key indicators of potential obfuscation.

  - **Analyze the loaded modules**: Examine PowerShell module logs or Sysmon Event ID 22 for suspicious module loading associated with `system.io.compression.deflatestream` and `system.io.streamreader`. Identify if these modules are part of unauthorized or unexpected scripts.

  - **Assess payload contents for execution patterns**: Inspect PowerShell command outputs or logs for use of `readtoend`. Confirm if the PowerShell script is attempting to read compressed data, indicating potential exfiltration attempts.

  - **Identify legitimate uses of obfuscation**: Document legitimate PowerShell scripts used within the environment that may employ similar language constructs for authorized tasks, such as system maintenance or monitoring.

  - **Correlate with other telemetry**: Cross-reference findings with Windows Security Event logs or applications that regularly interact with PowerShell to determine if the behavior aligns with legitimate administrative tasks or if it deviates towards malicious intent.

  - **Determine asset criticality**: Consider the role of the host running the suspected PowerShell script; higher criticality assets (e.g., domain controllers or servers hosting sensitive data) warrant immediate attention if malicious indicators are confirmed.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems if malicious execution occurs. The likelihood of exploitation using obfuscation techniques is moderate; many adversaries use similar methodologies to circumvent detection. Given that obfuscation techniques are commonly used by threat actors, a prompt investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not enabled or if scripts utilize custom obfuscation techniques not covered by this rule. Legitimate administrative scripts may trigger this alert, particularly in complex environments with automation. A companion detection that strengthens coverage includes monitoring for unauthorized command line arguments in Sysmon Event ID 1, which can help to confirm or deny malicious intent when combined with this rule.

