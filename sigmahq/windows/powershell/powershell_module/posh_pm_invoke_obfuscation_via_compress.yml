note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts using the COMPRESS OBFUSCATION technique. Typically, attackers aim to evade detection while executing malicious commands or payloads that could lead to system compromise, data exfiltration, or further lateral movement. This behavior aligns with the MITRE ATT&CK framework, specifically under the Execution tactic (ID T1059.001) and the Stealth tactic (ID T1027).

  The primary telemetry source for this detection is PowerShell-related events, particularly logs capturing module activity and script execution details. If successful, this behavior can lead to unauthorized access or disruption of services. It is important to note that detection of this rule does NOT confirm malicious intent on its own; further investigation is necessary to ascertain the legitimacy of the activity.

  ### Investigation Steps

  - **Review PowerShell Module Logs:**
    Check for Event ID 4103 in PowerShell module logs, focusing on the usage of 'new-object', '[text.encoding]::ascii', 'system.io.compression.deflatestream', and 'system.io.streamreader'. Look for unusual scripts that utilize these functions.

  - **Analyze the Context of Script Execution:**
    Determine whether the PowerShell script was executed by a user account associated with administrative functions or if it originated from a typical user account. Check timestamps and execution context.

  - **Correlate with Other Security Events:**
    Use SIEM to correlate the PowerShell execution logs with other security events (e.g., Event ID 4688 for process creation). Confirm if the PowerShell process spawns suspicious child processes (e.g., cmd.exe).

  - **Examine Expected vs. Malicious Usage:**
    Validate legitimate use cases of compression in PowerShell, looking for workflows that include compressing data for archiving purposes with specific cmdlets. Legitimate scripts will usually not invoke obfuscated commands.

  - **Identify Indicators of Malicious Activity:**
    Look for patterns of known malicious payloads or callbacks in the logs, particularly following the obfuscation execution in PowerShell. Establish if any uploaded file or outbound network connections correlate with threat actor profiles.

  - **Check for Companion Detection:**
    Investigate related detections (e.g., derived ID: 20e5497e-331c-4cd5-8d36-935f6e2a9a07) for potential secondary activities indicative of exploitation or further command and control (C2) activity.

  ### Prioritization

  This alert should be regarded as medium severity due to the nature of obfuscation—a common technique used by adversaries to disguise malicious activity. The potential impact is significant, particularly if this technique is used to deploy additional payloads. While obfuscation is often employed, triggering this alert raises concerns about possible compromise or escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscated scripts that do not apply the typical patterns or by malicious actors employing various evasion techniques (e.g., using benign-looking PowerShell commands). Reliable detection necessitates comprehensive logging from PowerShell, including user and security event logs. Legitimate internal scripts for data management may trigger this alert, necessitating a contextual understanding of user workflows. Companion detections focused on file modifications or silent execution patterns may enhance the detection coverage.

