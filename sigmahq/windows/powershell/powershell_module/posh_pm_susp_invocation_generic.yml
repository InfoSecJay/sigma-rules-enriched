note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell invocations which include encoded commands and hidden execution parameters, such as `-enc`, `-EncodedCommand`, or `-window hidden`. These behaviors are commonly indicative of attempts to evade detection by stealthily executing malicious scripts. The likely attacker objective is to execute payloads that avoid conventional monitoring tools and system defenses, often leading to data exfiltration or lateral movement within the network.

  This detection aligns with the MITRE ATT&CK technique "PowerShell" (T1059.001) within the execution tactic. The primary telemetry sources include Windows PowerShell event logs, specifically focused on module-level logs indicating command execution. If malicious, these actions can lead to severe security impacts including system compromise and data breach. It's critical to note that the detection of these parameters does NOT confirm that malicious activity is occurring; it merely identifies potentially suspicious usage that requires further investigation.

  ### Investigation Steps

  - **Check PowerShell log events**: Review Windows Event ID 4104 for logs capturing PowerShell command invocations. Look for any invoked commands containing ` -enc`, ` -EncodedCommand`, or ` -w hidden`, which are indicative of potential malicious activity.

  - **Identify encoded commands**: If encoded commands are detected, decode them using a safe environment to reveal their original content. Compare the decoded output against known benign scripts and techniques to ascertain legitimacy.

  - **Assess for non-interactive flags**: Examine PowerShell logs for parameters like `-noni` or `-noninteractive`. If found, analyze the context to determine if this indicates a scripted or automated execution which is typically more suspicious compared to interactive use.

  - **Validate legitimate use cases**: Confirm if PowerShell execution is associated with known administrative tasks or internal scripts. For example, legitimate system management tasks might reference `-ExecutionPolicy Bypass`, unlike dubious encoded commands.

  - **Review surrounding activities**: Investigate additional logs for related suspicious activity, such as unexpected process creation (Event ID 4688) associated with the PowerShell process. Look for processes launched from unusual locations or unusual parent processes.

  - **Determine asset criticality**: Assess the role of the asset on which the alert was triggered. For critical servers, even minor anomalies can represent greater risk levels and warrant immediate response.

  ### Prioritization

  This alert should be prioritized as high severity. The potential compromise of systems executing PowerShell scripts can lead to significant impact, especially if an attacker gains foothold in critical infrastructure. Additionally, PowerShell is commonly weaponized in various cyberattacks, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging mechanisms; if PowerShell script blocks are not adequately logged, true malicious use may be missed. Genuine administrative scripts utilizing parameters like `-noninteractive` or `-Enc` could trigger this alert, necessitating careful context analysis. A related detection for improving coverage involves monitoring execution policies and script whitelisting, which can help reduce the risk of unauthorized PowerShell execution.

