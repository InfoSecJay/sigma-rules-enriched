note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell commands that exhibit suspicious invocation patterns. Specifically, it targets commands using encoded parameters, hidden window options, and non-interactive flags which are often employed by attackers to obfuscate their activity and maintain stealth. PowerShell is a powerful scripting language widely utilized for system administration, making it a prime target for various threat actors aiming to execute payloads or perform other nefarious activities without arousing detection.

  The underlying threat scenario may involve adversaries using PowerShell to execute malicious scripts or commands in an enterprise environment for purposes such as data exfiltration, lateral movement, or the deployment of malware. Attackers may leverage tools like Cobalt Strike or invoke custom scripts designed to evade security defenses, manipulating PowerShell’s features to execute their commands under the radar.

  Relevant MITRE ATT&CK tactics include **Execution** (T1203) and **Command and Scripting Interpreter: Windows PowerShell** (T1059.001). The primary data source for this detection is PowerShell event logs that capture command invocations and their parameters, enabling security teams to analyze potentially harmful activity effectively.

  ### Investigation Steps
  - **Review PowerShell Execution Logs:** Examine the PowerShell event logs for entries that match the suspicious parameters detected in this alert, particularly focusing on the execution time and the user context.

  - **Analyze Command Context:** Assess the full command line and parameters being passed during execution to identify potential obfuscation tactics such as encoded commands or hidden window settings.

  - **Identify Source and Destination:** Investigate the processes that invoked the PowerShell commands, checking for any links to known malicious actors or unusual internal communications that could indicate lateral movement.

  - **Assess User Behavior:** Look for anomalies in user behavior related to the invocation of PowerShell commands, especially by accounts that do not typically utilize PowerShell for their operational duties.

  ### Prioritization
  This alert carries a **high** severity due to the ability of PowerShell to facilitate significant post-exploitation activity. The execution of suspicious PowerShell commands can indicate an immediate risk of compromise and potential data breaches, making it essential for enterprise environments with critical data assets to respond swiftly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage when legitimate PowerShell scripts used for administrative purposes invoke similar parameters, which could lead to false positives. Additionally, this detection logic assumes that PowerShell logging is enabled and adequately configured across all endpoints. Without comprehensive logging, particularly those related to command execution and script block logging, critical data needed to validate alerts may not be available.

