note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of specific decompression commands in PowerShell, namely the `Expand-Archive` command. The presence of such commands in the environment could indicate that an adversary is attempting to extract files, potentially as a part of an attack scenario. Attackers may utilize decompression tools to retrieve and execute malicious payloads, aiding in the persistence and execution phases of an attack.

  Relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion** (TA0005) and **Command and Scripting Execution** (TA0002) with the specific technique of **Command-Line Interface** (T1059) and **Scripting** (T1064), as the use of PowerShell scripts can obfuscate malicious activities. Primary data sources for detecting this behavior will include PowerShell logs that capture command execution, providing insights into potentially unauthorized activities within the system.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell execution logs for entries containing `Expand-Archive` to identify instances where this command has been executed, focusing on the context of these commands (e.g., user accounts, IP addresses).
  - **Analyze Process Creation Events**: Investigate related process creation events to understand the origin of the decompression commands, noting any unusual parent-child process relationships that may indicate malicious intent.
  - **Correlate with File System Changes**: Look for changes in the file system that coincide with the execution of decompression commands, such as creation of executables or scripts in unusual directories, which may signal the deployment of malicious payloads.
  - **Assess User Activity and Anomalies**: Evaluate user behavior associated with the account executing the command, identifying any anomalies or deviations from normal activity that could suggest compromise.

  ### Prioritization
  Given the potential for significant impact on an enterprise environment—such as the extraction of sensitive data or deployment of malware—the alert's severity is classified as informational but requires immediate investigation to understand the context and intent behind the PowerShell command execution.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of decompression, especially if attackers use custom or less common tools for file extraction. Additionally, the detection relies on the assumption that PowerShell logging is enabled and properly configured to capture these events in a consistent manner. Organizations should ensure that appropriate logging is set up to facilitate the effective use of this detection rule.

