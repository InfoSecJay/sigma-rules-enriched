  ### Technical Context

  This Sigma rule detects the use of PowerShell commands to decompress files, specifically the `Expand-Archive` command. An attacker may leverage this behavior to extract malicious payloads or exfiltrated data, facilitating further compromise. The relevant MITRE ATT&CK technique is "Decompression of files" (T1140). Primary telemetry sources include PowerShell logs, specifically targeting command invocations and their arguments.

  If malicious, the presence of decompressed files could indicate an ongoing data exfiltration operation or malware deployment. However, this detection alone does not confirm malicious intent; it merely highlights that a known file decompression command was executed, which could also be part of legitimate administrative tasks.

  ### Investigation Steps

  - **Review PowerShell command logs:** Filter PowerShell logs for Event ID 4103 to identify instances of `Expand-Archive`. Confirm context by checking the user and system involved to distinguish between legitimate admin actions and potential misuse.

  - **Analyze file system changes:** Inspect the target file system for newly created files in common decompression directories (e.g., `C:\Users\<User>\Downloads`). Legitimate activity may show common file extensions like `.zip`, whereas suspicious files could have unusual extensions or names.

  - **Check parent processes:** Investigate parent processes of the PowerShell command (e.g., via Sysmon Event ID 1). Legitimate PowerShell sessions often originate from commonly used applications (e.g., Windows Explorer or automated scripts), while unexpected initiators can indicate malicious activity.

  - **Evaluate network activity:** Review network logs for associated connections or DNS queries following the decompression. Confirm if any newly created files initiate unexpected outbound connections, which might signify data exfiltration or communication with a command and control server.

  - **Correlate with other alerts:** Cross-reference with related detections (e.g., suspicious process behavior or unusual network activity involving the same user/system) to build a comprehensive picture of the incident.

  ### Prioritization

  The alert should be considered medium severity due to the potential for associated malicious activity. The impact can range from data loss to further system compromise. While this action is legitimate in many administrative contexts, it can also be weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative decompression tasks may frequently trigger this alert, resulting in false positives. Essential log sources like PowerShell and Sysmon need to be enabled and properly configured to ensure comprehensive visibility. Routine administrative tasks, such as software installs or updates, may inadvertently invoke this command. Companion detections, such as monitoring for unusual parent processes or network anomalies post-decompression, can enhance threat identification.

