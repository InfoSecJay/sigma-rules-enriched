note: |
  ### Technical Context

  The Sigma rule detects the use of PowerShell's `Expand-Archive` command, which is employed for decompressing files. This behavior could indicate an attacker extracting malicious files or payloads onto a system. The likely attacker objective is to gain access to additional malicious tools or data that can facilitate further compromise of the target environment.

  This detection aligns with the MITRE ATT&CK technique for Archive Collected Data (T1140). The primary telemetry sources are PowerShell logs, specifically capturing PowerShell command executions. If malicious, the decompression operation can lead to unauthorized access or lateral movement within the network. It is crucial to note that this detection alone does not confirm malicious intent, as legitimate administrative tasks may also trigger this activity.

  ### Investigation Steps

  - **Review PowerShell command logs:** Look for Event ID 4103 in PowerShell logs. Confirm whether the command includes `Expand-Archive` and analyze the context of its usage (e.g., command execution time, user context).

  - **Identify origin of the decompressed files:** Examine the source path of the files being decompressed. If sourced from temporary directories or user home directories, this may indicate suspicious behavior. Legitimate use typically involves known software directories.

  - **Correlate with recent file changes:** Check for associated file creation events (Windows Event ID 5145), particularly looking for newly created files immediately following the `Expand-Archive` command. Files created in sensitive directories or by non-administrative accounts may indicate compromise.

  - **Cross-reference user activity:** Assess the user's history in the system (Event ID 4624, logon events) to determine if the user has a legitimate reason to execute the command. Regular users triggering this command could warrant further investigation.

  - **Monitor for additional decompression commands:** Review for other related PowerShell commands (e.g., `Unblock-File`, `Invoke-Expression`) in proximity to the detected event to identify potential follow-up activities.

  ### Prioritization

  This alert is of medium severity due to its potential impact if misused, especially on critical systems. While decompression commands can be legitimate, their use is often associated with cyber threats, such as malware extraction. The technique is known to be weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be evaded through obfuscation or through the use of alternate decompression methods not covered by the rule. Reliable detection requires comprehensive PowerShell logging configurations to capture all command executions. Legitimate administrative tasks, such as software deployment or data archiving, may trigger this alert. Related detections, such as tracking PowerShell script block logging or monitoring command-line arguments, can help increase overall detection confidence.

