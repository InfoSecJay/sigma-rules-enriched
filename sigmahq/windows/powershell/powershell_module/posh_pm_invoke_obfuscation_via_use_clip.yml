note: |
  ### Technical Context

  This rule detects the use of the `Clip.exe` command in obfuscated PowerShell commands, typically employed by attackers to circumvent security measures. The primary objective of this behavior is to execute malicious scripts that leverage the Clipboard for data exfiltration or command execution without directly revealing the payload. This activity maps to the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0057) and the technique of Obfuscated Files or Information (T1027) as well as Command and Scripting Interpreter (T1059.001).

  The primary telemetry source for this detection is PowerShell logs, specifically looking for script executions that involve patterns containing the `Clip.exe` command. If malicious, this behavior could indicate a data breach or an attempt to execute further payloads without leaving clear traces in command history. Importantly, this detection does NOT inherently prove that malicious activity has occurred; it merely indicates the presence of potentially indicative but not definitive behavior.

  ### Investigation Steps

  - **Examine PowerShell Execution Logs**: Check for Security Event ID 4103 (PowerShell Script Block Logging) that corresponds to the detected behavior. Look specifically for scripts that reference `Clip.exe`, indicating potential obfuscation.

  - **Identify High-Confidence Malicious Indicators**: Look for commands executing `clip.exe` alongside base64-encoded strings or suspicious API calls in Event ID 4104. Such combinations are common in malicious PowerShell activities.

  - **Review Related Activity on the Host**: Cross-reference other recent PowerShell executions (Event ID 4688) to determine if similar obfuscation techniques or suspicious commands were executed around the same time.

  - **Assess System Role and Context**: Consider the criticality of the affected asset (e.g., is it a server, workstation, or privileged account?). Look for typical user behavior in the logs, such as legitimate clipboard usage by developers or administrative users shortly before the alert

  - **Analyze Network Traffic**: Utilize network logs to identify any outbound communication following the execution of the suspicious PowerShell command. Look for unusual HTTP/HTTPS requests that could indicate data exfiltration attempts.

  - **Document Any Legitimate Usage**: Note cases where the `Clip.exe` command is used legitimately, for example, by programmers or for automation scripts. This may include mundane uses, such as copying snippets of code to the clipboard.

  ### Prioritization

  This alert is high severity due to the potential for significant impacts on sensitive information if the behavior is indeed malicious. The use of obfuscation techniques suggests a higher likelihood of targeted attacks exploiting these vectors. Such behavior is increasingly weaponized by attackers aiming to bypass detection within enterprise environments.

  ### Blind Spots and Assumptions

  This detection may be evaded through legitimate PowerShell obfuscation techniques or through execution of scripts that do not use `Clip.exe`. The reliability of this detection depends on the configuration of PowerShell logging; if logging is not fully enabled, key events may be missed. Legitimate activities such as scripting automation or clipboard manipulation on development machines can trigger this alert. A related detection for comprehensive coverage would be for the use of encoded PowerShell commands (e.g., via `-EncodedCommand` parameter), which can also facilitate malicious activities.

