note: |
  ### Technical Context
  This detection rule focuses on identifying when adversaries utilize the PowerShell command `Get-NetTCPConnection` to enumerate network connections on compromised systems. The usage of this command is often a precursor to deeper reconnaissance activities, allowing attackers to gather information about open connections and potential targets for lateral movement or other hostile actions. In the context of an attack scenario, the goal of querying network connections is typically to assess the network landscape of the compromised system, leading to further exploitation or exfiltration efforts.

  Relevant MITRE ATT&CK tactics include **Discovery** (TA0007), particularly Technique **Network Service Discovery** (T1049). Attackers aim to map their network environment, facilitating subsequent actions such as lateral movement or privilege escalation. Primary data sources for detecting this activity include PowerShell logs that specifically capture executed commands and telemetry from Windows command logging.

  ### Investigation Steps
  - **Review PowerShell Command Logs**: Search for any instances of `Get-NetTCPConnection` in PowerShell command execution logs. Analyze the context in which these commands were executed, including user identity and execution context.
  - **Examine Network Connection Logs**: Inspect logs from network monitoring or firewall systems that might indicate unusual connections or traffic patterns correlating with the execution of the detected PowerShell command.
  - **Analyze User Behavior**: Investigate the user account associated with the command execution for any signs of compromise or abnormal behavior, such as unusual login times or patterns of access that deviate from normal operational behavior.
  - **Correlate with Lateral Movement Tools**: Look for related indicators of compromise (IoCs) that might indicate broader attack vectors, such as lateral movement tools that could be used alongside the information gathered from `Get-NetTCPConnection`.

  ### Prioritization
  The alert’s severity is classified as low due to the exploratory nature of the command; however, in the context of a larger incident involving unauthorized access, this behavior warrants further scrutiny as it may indicate preparatory actions for malicious activities.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include environments where PowerShell logging is not enabled or configured properly, leading to missed detections of legitimate reconnaissance activities or false negatives. It is assumed that any execution of `Get-NetTCPConnection` is suspicious, which may overlook benign administrative actions in a trusted environment. Effective detection relies on comprehensive PowerShell command logging to ensure visibility into potentially malicious activity.

