  ### Technical Context

  This Sigma rule detects the invocation of the PowerShell command `Get-NetTCPConnection`, which is used by adversaries to obtain information about active TCP connections on a host. The likely objective is to enumerate open connections, potential targets for lateral movement or further exploitation. This behavior aligns with the MITRE ATT&CK technique T1049: System Network Connections Discovery, which falls under the Discovery tactic.

  The primary telemetry source for this detection is from Windows PowerShell logs, specifically looking for Event ID 4104, which captures the script block logging of PowerShell commands. If this behavior is malicious, an attacker could exploit open network connections to establish unauthorized communications or escalate privileges. It is crucial to note that this detection does NOT confirm malicious activity on its own, as the command can be used for legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Check for recent PowerShell activity:** Review Windows Security Event ID 4104 logs for the execution of `Get-NetTCPConnection`. Look for script block logging to identify user identity and execution context.

  - **Evaluate the context of the PowerShell session:** Determine the parent process ID related to the PowerShell execution. If it originated from a system service or a trusted application (like Task Scheduler), it may be benign.

  - **Identify unusual connection listings:** After extracting `Get-NetTCPConnection` results, look for abnormal external IP addresses or ports that do not match business operations. Focus on connections to known malicious domains or illicit IP addresses.

  - **Examine for concurrent suspicious behavior:** Cross-reference the time of the `Get-NetTCPConnection` execution with any detected lateral movement activities or signs of compromise, such as unusual account logins (Event ID 4624) from the same user.

  - **Review legitimate uses of TCP connection enumeration:** In a typical operational environment, administrators may run `Get-NetTCPConnection` for troubleshooting network issues. Ensure that these instances are documented and part of scheduled maintenance.

  - **Document findings and escalate if needed:** If any indicators of compromise are confirmed, escalate for further investigation and remediation. Artifacts such as suspicious command parameters or anomalous user behavior should be prioritized.

  ---

  ### Prioritization

  This alert is of low severity due to its potential for both benign and malicious usage. The probability of exploitation depends on context, such as the privilege level of the user executing the command and any concurrent suspicious activities. While the command itself is commonly used for discovery purposes, context is critical to assess the urgency of the alert.

  ---

  ### Blind Spots and Assumptions

  Detecting `Get-NetTCPConnection` may miss instances where the command is executed outside of PowerShell (like through scripts or other thermal means). Additionally, environments without enabled PowerShell logging would not generate the necessary alerts. Legitimate administrative activities, such as troubleshooting or system audits, might trigger this alert. A companion detection to consider would be monitoring for unusual outbound connections or frequent usage of other network discovery commands to enhance overall visibility.

