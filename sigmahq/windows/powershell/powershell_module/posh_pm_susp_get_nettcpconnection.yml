  ### Technical Context

  This Sigma rule detects the use of the PowerShell command `Get-NetTCPConnection`, which can be employed by adversaries to enumerate network connections on the host. The primary objective of this behavior is to gather information about active and established connections, which may reveal potential targets or exfiltration channels. This behavior is categorized under the MITRE ATT&CK technique "Network Connections Discovery" (T1049).

  The relevant telemetry sources include PowerShell logs, specifically those captured by Windows Event ID 4104 (Windows PowerShell Script Block Logging), which should contain the context of executed commands. If this detection is confirmed as malicious, it could indicate an awareness of the system's network posture and preparations for lateral movement or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; benign uses of this command for network management may also trigger the alert.

  ### Investigation Steps

  - **Check PowerShell command context:** Review the logs for Event ID 4104 or equivalent telemetry to confirm that `Get-NetTCPConnection` was executed. Look for the "CommandLine" field to validate the presence of the command.

  - **Assess user account usage:** Determine if the command was executed by a known or authorized user account. Confirm that the account typically uses PowerShell commands for legitimate purposes, versus accounts that would be more atypical for such activity.

  - **Evaluate the output:** Investigate any associated logs or outputs that detail the results of `Get-NetTCPConnection`. Look for unusual hostnames or IP addresses, especially if they are outside normal operational patterns.

  - **Identify process origin:** Review Sysmon Event ID 1 or Security Event ID 4688 to determine the parent process of the PowerShell command execution. If launched from scripts or applications typically not used for networking tasks, this may indicate potential malicious activity.

  - **Correlate with network activity:** Cross-reference findings from this detection with network firewall or IDS logs for any correspondingly suspicious outbound connections that may indicate data exfiltration or command and control (C2) channels.

  ### Prioritization

  This alert is categorized as low severity primarily because the PowerShell command can be used legitimately by system administrators. However, if associated with unusual user behavior or unexpected execution contexts, the likelihood of malicious use increases, requiring further scrutiny.

  ### Blind Spots and Assumptions

  This detection may be bypassed through script obfuscation or by utilizing alternate methods of gathering network connection data that do not invoke PowerShell logs, such as via C2 frameworks. Ensuring that all relevant logging for PowerShell is enabled, especially script block logging and module logging, is crucial for reliable detection. Legitimate activities could include authorized scripts for network diagnostics. A related detection that strengthens coverage is monitoring for network activity anomalies after a `Get-NetTCPConnection` execution.

