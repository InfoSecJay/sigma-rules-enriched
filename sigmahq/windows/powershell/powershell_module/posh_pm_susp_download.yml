note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that utilize the `System.Net.WebClient` class to download files or strings, specifically through the methods `.DownloadFile()` and `.DownloadString()`. These activities are commonly associated with malicious actors who aim to retrieve and execute payloads or exfiltrate data as a part of their exploitation phase.

  The relevant MITRE ATT&CK technique is **T1059.001: Command and Scripting Interpreter: PowerShell**. Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and PowerShell logs (if enabled), specifically capturing PowerShell script execution details. The security impact of this behavior is substantial, as it may indicate the downloading of malware or data theft. Notably, this detection does NOT confirm that the downloaded content is malicious or that any subsequent execution will happen.

  ### Investigation Steps

  - **Inspect process creation logs**: Review Windows Security Event ID 4688 to identify the PowerShell process. Note the command line arguments and the parent process. Legitimate executions might include administrative tasks or legitimate script compilations, while suspicious logs show unexpected or obfuscated URLs.

  - **Analyze PowerShell command context**: Check for PowerShell logs or relevant telemetry fields that include `ContextInfo` for indications of `.DownloadFile()` or `.DownloadString()`. Validate any URLs used in these commands against known safe domains.

  - **Correlate with network logs**: Analyze firewall or proxy logs that correspond to the timestamps of detected PowerShell commands to identify any outbound connections to suspicious or unknown domains. Monitor for any patterns indicating data exfiltration.

  - **Identify high-confidence malicious indicators**: Look for any executed PowerShell commands that include obfuscated strings or encoded data targeting unusual network destinations (e.g., domains known for hosting malware).

  - **Cross-reference with recent changes**: Examine if any recent updates, software installations, or system changes correlate with the detected PowerShell commands. Legitimate IT activity usually correlates with authorized maintenance periods or scheduled updates.

  - **Validate temporary files**: Check the file system for any temporary files created at the time of the detected download, particularly in common temp directories (e.g., `C:\Windows\TEMP`). This may indicate whether a file was downloaded as part of the suspicious command.

  ### Prioritization

  This alert is medium severity due to the potential impact on the affected system. Given the likelihood that such behaviors can be exploited for malicious purposes, especially in a compromised environment, they warrant careful attention. While PowerShell is commonly used for legitimate administrative tasks, its misuse for downloading potentially harmful content is a key indicator of active threat engagement.

  ### Blind Spots and Assumptions

  Detection limitations include potential bypasses through encoding or obfuscation tactics that can mask the `.DownloadFile()` or `.DownloadString()` usage. Required log sources include comprehensive PowerShell logging and process creation logs for reliable detection. Legitimate activities, such as system updates or IT administration scripts, may trigger this alert. A related detection would be monitoring for unexpected PowerShell script execution via `Invoke-Expression` or `Invoke-WebRequest`, enhancing overall coverage and understanding of PowerShell execution patterns.

