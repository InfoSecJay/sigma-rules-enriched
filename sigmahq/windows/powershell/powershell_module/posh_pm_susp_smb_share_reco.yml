note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands related to retrieving information about SMB shares on remote systems. By executing "get-smbshare," attackers may be probing for shared drives and folders as part of their reconnaissance efforts. The ability to list these shares can provide critical insights into a network’s structure, potentially revealing valuable resources to target for information gathering and lateral movement.

  In a typical attack scenario, adversaries may first enumerate SMB shares to identify systems that hold sensitive data or that can facilitate further compromise. This behavior aligns with the MITRE ATT&CK techniques, particularly **Discovery: Network Share Discovery (T1069.001)**, which represents an attacker attempting to locate resources on the network necessary for their objectives.

  The primary data sources necessary to support this detection include PowerShell module logs that capture execution details of PowerShell commands, particularly those related to SMB share enumerations.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell execution logs for instances of the "get-smbshare" command to confirm unauthorized use or execution patterns associated with potentially malicious behavior.
  - **Analyze Network Traffic**: Inspect network traffic logs for any unusual queries or traffic patterns related to SMB, especially from unexpected hosts to shared drives or folders.
  - **Check for Contextual Metadata**: Look into the context information and associated user accounts that executed the "get-smbshare" command to identify if they are legitimate users or potentially an unauthorized access attempt.
  - **Assess User Activity**: Examine user account activity for recent logins, unusual access times, or elevated privilege use that may coincide with the execution of the SMB share discovery commands.

  ### Prioritization
  Although marked as low severity, alertsfrom this rule should not be overlooked. The detection indicates potential reconnaissance activity that could precede significant events like lateral movement or data exfiltration, making it essential to investigate in a timely manner.

  ### Blind Spots and Assumptions
  This detection may not capture all malicious attempts, especially if PowerShell command logging is not properly configured or is disabled on certain endpoints. The rule assumes that standard users do not commonly issue SMB share queries, which may not hold true in all enterprise environments. Additionally, it relies on the availability and integrity of PowerShell logging for accurate detection. Proper logging configuration is critical, or else the rule may fail to trigger on relevant events.

