  ---

  ### Technical Context

  This Sigma rule detects the use of the PowerShell command `get-smbshare`, which indicates that an actor is attempting to retrieve information about shared folders on Windows systems. The likely objective of this behavior is reconnaissance, specifically identifying shared drives or folders to target for data collection or lateral movement. This activity correlates with the MITRE ATT&CK technique for discovering shared resources (T1069.001).

  The primary telemetry source is Windows PowerShell logging, specifically monitoring for execution of relevant commands and their parameters. If performed by a malicious actor, this behavior can indicate preparation for further exploitation. Importantly, the presence of this command does NOT confirm malicious intent on its own, as legitimate administrative activities may also invoke this command.

  ---

  ### Investigation Steps

  - **Check PowerShell execution history:** Review the PowerShell logs for Event ID 4104, focusing on command execution context for `get-smbshare`. Legitimate use typically involves administrative accounts accessing known shares.

  - **Inspect user context:** Analyze the user context from which the command was executed. Look for any anomalous accounts (non-admins using administrative actions) and check log fields such as `UserName` and `UserSID` to identify potential misuse.

  - **Correlate with other activities:** Review related event logs (Event ID 4624) for the same time frame to determine if any suspicious logins occurred before the `get-smbshare` command was run. A high number of administrative logins might indicate suspicious behavior.

  - **Identify potential data exfiltration:** Scan the system for any recent file access or modifications that correlate with the `get-smbshare` execution. Use File System Auditing logs to validate any file access patterns, checking Event IDs 4663 and 5145 for read/write operations.

  - **Evaluate network shares:** Review the SMB shares on the affected system. Assess their configurations (permissions and intended users) to determine if the actor had legitimate reasons to query them, using tools or scripts to list active shares and their access rules.

  ---

  ### Prioritization

  This alert has a low severity in an enterprise context due to the common usage of `get-smbshare` by administrators for legitimate purposes. However, if detected in conjunction with suspicious login behaviors or in versions of PowerShell without administrative logging, the likelihood of malicious abuse increases, warranting further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not configured correctly, as administrators may disable logs to evade detection. Legitimate applications or scripts that query SMB shares may trigger this alert, leading to false positives. A related detection to consider is the monitoring of unauthorized access attempts to sensitive SMB shares, which can help validate if this reconnaissance behavior leads to further exploitation attempts.

