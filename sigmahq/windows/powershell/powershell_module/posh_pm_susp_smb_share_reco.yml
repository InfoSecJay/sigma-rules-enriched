note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `Get-SmbShare` PowerShell cmdlet, which adversaries may use to enumerate shared folders and drives on remote systems. The objective typically involves reconnaissance to discover accessible file shares that could contain sensitive information or serve as a target for lateral movement. This behavior aligns with the MITRE ATT&CK technique T1069.001: "Shared Drive Discovery." The primary telemetry sources are Windows PowerShell logs, particularly those capturing cmdlet execution events. If malicious, the unauthorized enumeration of SMB shares could indicate intent to gather sensitive data or move laterally within the environment. However, this detection alone does not confirm malicious intent—it could also arise from legitimate administrative activities.

  ### Investigation Steps

  - **Review PowerShell command execution:** Check Windows Security Event ID 4688 for the command line containing `Get-SmbShare`. Analyze who executed the command and the working directory to establish legitimacy.

  - **Check related user accounts:** Determine if the invoking user account has historically performed administrative tasks or if this activity is outside their normal behavior, referencing Event ID 4624 for successful logons.

  - **Examine network traffic for SMB queries:** Capture and analyze SMB traffic using the relevant network monitoring tools (e.g., Zeek or Wireshark) to identify the target systems being queried for shares.

  - **Identify expected behavior context:** Confirm if scheduled tasks or legitimate administrative scripts may invoke `Get-SmbShare`, noting the frequency and context of these events.

  - **Assess for lateral movement patterns:** If this action is linked with subsequent PowerShell commands (like accessing enumerated shares), cross-reference Event ID 4104 for potential follow-up activities indicative of a lateral movement attempt.

  ### Prioritization

  In an enterprise context, this alert should be treated with moderate urgency. While the affected system's impact is generally low unless coupled with sensitive data access, the intent to probe for SMB shares indicates potential for reconnaissance or preparation for lateral movement. The behavior is often encountered in pre-attack stages and can be a precursor to more harmful activities.

  ### Blind Spots and Assumptions

  This detection is limited by the environment's log collection capabilities; if PowerShell logging is incomplete, key events may be missed. Legitimate administrative activities, such as system audits, can trigger this alert and lead to false positives. To enhance detection quality, companion detections for abnormal SMB access patterns or lateral movement attempts should be monitored, as they can provide context to this behavior.

