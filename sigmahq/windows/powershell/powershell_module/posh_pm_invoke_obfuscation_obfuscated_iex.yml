note: |
  ### Technical Context
  This detection rule identifies all variations of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework, particularly those employing the use of the `Invoke-Expression` (IEX) method. The main objective of this detection is to catch malicious actors attempting to evade security measures by executing obfuscated code, which can often lead to downloading and running additional malware or executing unauthorized commands remotely. The attack typically follows a pattern of stealth to avoid traditional detection mechanisms.

  The relevant MITRE ATT&CK techniques highlighted by this detection include **Defense Evasion (T1027)** through obfuscation of commands, and **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**, as the focus here is specifically on PowerShell invocation to execute malicious payloads. The primary data sources that would provide visibility into this type of activity include PowerShell execution logs and telemetry from Windows event logs, specifically looking at process creation events and command-line argument logs.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell operational logs to identify executions of `Invoke-Obfuscation` or related IEX invocations, focusing on command-line arguments for obfuscation patterns.
  - **Analyze Process Creation Events:** Look at Windows process creation logs to track instances where obfuscated scripts may have spawned new processes, particularly those associated with PowerShell.
  - **Inspect Network Activity:** Check any related outbound network traffic from systems where obfuscated commands were detected, looking for connections to known malicious IPs or domains tied to malware distribution.
  - **Correlate with User Activity:** Cross-reference with user activity logs to identify any abnormal login patterns or anomalous behavior leading up to the obfuscation detection, indicating potential insider threats or compromised accounts.

  ### Prioritization
  Given the high likelihood of obfuscated PowerShell code being used for malicious activities and its strong association with advanced persistent threats (APTs), this alert should be treated with high severity. Incidents involving obfuscation can lead to significant compromise or data exfiltration if not addressed promptly.

  ### Blind Spots and Assumptions
  This detection mechanism may miss situations where obfuscation techniques are more sophisticated or when attackers use other methods to obscure their activities that do not fit the specific patterns outlined in the detection logic. Additionally, the implementation assumes that PowerShell logging is enabled on the monitored hosts, which is critical for capturing the necessary telemetry to support this detection. In environments where logging levels are insufficient, detections may not be generated for all appropriate IEX invocations.

