note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell commands that utilize the Invoke-Obfuscation framework, specifically targeting variations of the IEX (Invoke-Expression) invocation method. The likely attacker objective is to execute malicious scripts in memory, circumventing detection by hiding the true intent and functionality of the code. This behavior falls under MITRE ATT&CK technique T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry sources are Windows PowerShell logs, specifically using Script Block Logging and Module logging features. If executed maliciously, this activity could lead to unauthorized access, data exfiltration, or lateral movement within the network. However, this detection alone does not confirm the intent behind the execution; it does not distinguish between legitimate automation scripts or testing activities that might use similar obfuscation techniques.

  ### Investigation Steps

  - **Check PowerShell script block logs:** Query Security Event ID 4104 in the Windows Event Logs for evidence of obfuscated commands. Signs of malicious activity may include multiple obfuscations of IEX commands.

  - **Analyze command line arguments:** Investigate the command line history in the Windows Event Viewer for the Windows PowerShell logs (Event ID 4688) for instances of IEX usage, especially with heavily obfuscated parameters. Legitimate uses may show un-obfuscated, clear script paths.

  - **Validate the source of the execution:** Review the originating user account or service account involved in the execution. Anomalies in the user context (e.g., highly privileged accounts executing scripts) can indicate potential threats.

  - **Identify patterns of obfuscation:** Check for the use of named variables such as `$PSHome`, `$ShellId`, and `$env:Public` within the script blocks and correlate with the obfuscation patterns indicated by the rule's regex definitions. Patterns not conforming to normal usage for automation tasks should raise suspicion.

  - **Review the creation of temporary files:** Confirm if temporary PowerShell scripts were created in locations like `%TEMP%` or if there were artifacts indicating script writing or downloads just prior to IEX invocation, leading to data exfiltration.

  - **Cross-reference with known bad indicators:** Compare the hashes or paths of any downloaded scripts with threat intelligence databases to identify known malicious payloads or techniques tied to Invoke-Obfuscation usage.

  ### Prioritization

  This alert is of high severity due to its potential impact on the enterprise, as obfuscation techniques are frequently used by adversaries to execute payloads without detection. The likelihood of malicious abuse is significant, given that obfuscation is commonly weaponized in various attack vectors.

  ### Blind Spots and Assumptions

  Evasion techniques may include using commonly used PowerShell functions without obfuscation, making it challenging to assess intent purely based on command patterns. Logs may not be reliable without the proper PowerShell logging configurations enabled, such as Script Block Logging. Additionally, legitimate administrative or automation scripts may trigger this alert if they use similar obfuscation techniques. A related detection that strengthens coverage could be monitoring for execution of known malicious PowerShell modules or scripts that are commonly associated with attacks using obfuscation (e.g., T1086: PowerShell).

