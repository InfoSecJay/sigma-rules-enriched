note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework, specifically invoking the `IEX` (Invoke-Expression) command. Obfuscation techniques are often employed by attackers to hide malicious code and evade detection mechanisms. The primary attacker objective is likely to execute payloads that compromise or control a target system, facilitating actions like data exfiltration or lateral movement.

  This behavior corresponds to the MITRE ATT&CK framework under the tactics of "Defense Evasion" (T1562) and "Execution" (T1059.001). The primary telemetry source for detection is from PowerShell logs, specifically the PowerShell module logs. If successful, this malicious behavior could enable adversaries to operate undetected for extended periods, leading to potential data breaches.

  It is important to note that while this detection identifies the use of obfuscated PowerShell commands, it does NOT confirm malicious intent or payload execution on its own.

  ### Investigation Steps

  - **Check PowerShell Execution Logs:** Review PowerShell logs for Event ID 4104 that specifically contain the detected payload patterns. Look for instances of `IEX` being used alongside obfuscation techniques. This is indicative of potential malicious activity.

  - **Validate Script Source:** Determine the origin of the PowerShell execution. Check for local versus remote execution by examining the `Source` field in the logs. If sourced from known malicious IPs or domains, this heightens the suspicion.

  - **Identify Legitimate Uses:** Establish a baseline by identifying known trusted automation scripts or scheduled tasks that utilize `IEX`. Examine the timestamps for correlation with other legitimate administrative activities to assess normal behavior.

  - **Inspect for Command Execution Context:** Investigate the command execution context by reviewing the calling process ID (PID) in logs. Identify if the process originated from typical administrative tools or unusual contexts, such as a user-initiated PowerShell session. Unusual parent processes could indicate suspicious activity.

  - **Assess Additional Indicators:** Look for common malicious indicators related to this obfuscation technique, such as unusual URLs or domains in command output. Focus on the presence of unusual network connections generated from PowerShell commands.

  - **Document and Trend Analysis:** Record findings and conduct trend analysis for any repeated occurrences over time, especially if they align with known attack patterns, which may indicate ongoing or escalating threats within the environment.

  ### Prioritization

  This alert has high severity due to the potential impact on critical systems if obfuscated commands result in successful exploitation. The likelihood of malicious abuse is significant, as adversaries frequently utilize such techniques to evade detection. Obfuscated PowerShell commands are commonly associated with advanced persistent threats and should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the disablement of PowerShell logging, which would prevent accurate visibility into potentially malicious activities. Additionally, legitimate administrative tasks may inadvertently trigger this alert, including third-party automation tools that utilize obfuscation for routine operations. A companion detection, such as tracking unusual outbound connections from PowerShell (e.g., via Windows Firewall logs), would strengthen the coverage of malicious activity associated with this rule.

