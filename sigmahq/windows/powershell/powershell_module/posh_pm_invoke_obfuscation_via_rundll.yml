note: |
  ### Technical Context

  This detection rule identifies obfuscated PowerShell commands executed via the `rundll32.exe` process, particularly when loading `shell32.dll` and invoking `shellexec_rundll`. This behavior is often indicative of an attacker attempting to execute Windows commands in an obfuscated manner to evade detection, commonly targeting user systems for lateral movement, data exfiltration, or payload delivery.

  Relevant MITRE ATT&CK tactics include Execution (T1059.001) and Defense Evasion (T1027). Primary telemetry sources include Windows security logs and PowerShell logs, specifically monitoring for Process Creation events (Event ID 4688) or Sysmon logs (Event ID 1) showing such command invocations. If malicious, this technique could lead to unauthorized access and significant data compromise. Importantly, detection of this activity does not confirm that the behavior is definitively malicious without further analysis.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for `rundll32.exe` invoking `powershell`. Legitimate usage of these processes should involve clear command-line parameters without obfuscation.

  - **Examine command line details:** Look at the CommandLine field in Sysmon logs (Event ID 1) to identify any obfuscation techniques used, such as unusual use of encodings or complex strings. Any use of encoded commands may indicate malicious intent.

  - **Analyze parent-child process relationships:** Inspect the ParentProcessId in Event ID 4688 or Sysmon Event ID 1 to determine the parent process that spawned `rundll32.exe`. A legitimate system process (e.g., `explorer.exe`) is expected, while a non-standard parent may suggest malicious activity.

  - **Validate associated script activity:** Check for concurrent PowerShell logs (Event ID 4104) showing script blocks that may connect to the obfuscated command. Legitimate scripts typically have clear, human-readable commands and documentation.

  - **Cross-reference with network logs:** Investigate any outbound connections made following the detection using network telemetry (e.g., firewall logs). Unexpected connections after `rundll32` execution may help confirm malicious activity.

  - **Assess historical activity:** Use Sysmon logs to look for previous occurrences of similar execution patterns from the same user or workstation. Repeated obfuscation attempts may indicate an ongoing threat.

  ### Prioritization

  This alert is of medium severity due to the potential impact on user systems and data. The likelihood of malicious abuse is moderate as this technique is commonly weaponized by various threat actors for evasion purposes. Analysts should prioritize investigation accordingly, especially on critical systems.

  ### Blind Spots and Assumptions

  Obfuscation techniques may limit the effectiveness of detection; therefore, log sources such as Sysmon must be configured to capture detailed process details. Legitimate use cases might include scripted installations or administrative tasks that utilize similar commands. Companion detections could include monitoring for unusual PowerShell activity (e.g., T1059.001) to enhance coverage against related obfuscation tactics.

