note: |
  ### Technical Context
  This detection rule identifies the use of an obfuscated PowerShell command invoked through the RUNDLL launcher, specifically when `rundll32.exe` is utilized alongside `shell32.dll`. This behavior is characteristic of attackers attempting to bypass security measures through obfuscation techniques. By using tools like Invoke-Obfuscation, threat actors can execute malicious scripts while evading detection by conventional security solutions. The likely attacker objectives include data exfiltration, lateral movement within the network, or execution of further payloads without revealing their presence.

  The relevant MITRE ATT&CK tactics and techniques include:
  - Defense Evasion (TA0005): Utilizing obfuscation to evade detection mechanisms.
  - Command and Scripting Interpreter: PowerShell (T1059.001): Executing malicious commands through PowerShell to manipulate systems.

  Primary data sources for this detection include Windows PowerShell module logs and process creation events, particularly those containing command line arguments of executed processes.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell module logs for any commands that include `rundll32.exe`, `shell32.dll`, or obfuscated PowerShell commands. Look for patterns or anomalies in usage.
  - **Analyze Process Creation Events:** Check process creation logs to find instances of `rundll32.exe` being executed with suspicious parameters. Pay special attention to the command line arguments utilized in these executions.
  - **Investigate Suspicious Activity:** Look for indicators of lateral movement or unusual account behavior in the same time frame as the detection. This can include unusual logins, account privilege changes, or other unauthorized actions.
  - **Correlate with EDR Alerts:** Utilize EDR tools to cross-reference alerts or flags raised around the same time as this detection. Analyze any associated file system or registry changes for evidence of further malicious activity.

  ### Prioritization
  The medium severity of this alert reflects a significant potential impact in an enterprise environment, given the use of obfuscation techniques which may indicate active exploitation attempts or malicious scripts running undetected.

  ### Blind Spots and Assumptions
  This detection rule may not capture all obfuscated PowerShell activities, especially if attackers utilize different methods or tools not based on `rundll32.exe`. Additionally, the detection logic assumes that the logs for PowerShell execution and process creation are enabled and retained for analysis. If logging is misconfigured or not comprehensive, the effectiveness of this rule may be impaired. It is essential to ensure proper logging for both PowerShell and process activities to maximize detection capability.

