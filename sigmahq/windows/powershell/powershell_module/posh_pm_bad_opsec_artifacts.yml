note: |
  ### Technical Context
  This rule detects the use of PowerShell scripts that exhibit characteristics typical of offensive tools such as Cobalt Strike Beacon, PoshC2, and others known for their stealthy and fileless execution techniques. Specifically, it identifies specific tracking payloads and artifacts that attackers might not modify significantly due to poor operational security (opsec) practices. Attackers using these scripts may aim to establish a foothold within an environment, execute malicious commands, or exfiltrate data while attempting to remain undetected.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Execution (T1059.001)**: Execution of malicious PowerShell scripts.

  Primary data sources that provide visibility into this behavior include:
  - PowerShell module logs, which capture the execution of scripts and any command-line arguments used, providing insight into suspicious PowerShell activity.

  ### Investigation Steps
  - **Review PowerShell Module Logs**:: Analyze PowerShell module logs for any instances of the identified payload patterns ('\$DoIt', 'harmj0y', etc.). Look for anomalous execution times and correlation with other suspicious activity.

  - **Correlate with EDR Alerts**:: Check Endpoint Detection and Response (EDR) alerts focusing on PowerShell activity around the time of the detected scripts to identify additional evidence of the attack, such as unusual process trees or parent-child relationships.

  - **Inspect Process Creation Events**:: Examine process creation events on endpoints that executed the detected PowerShell payloads to identify any preceding or concurrent suspicious commands (e.g., obfuscated commands, encoded base64 strings).

  - **Analyze Network Traffic**:: Review outbound network connections from affected systems, especially those connecting to known malicious command and control servers or showing unusual patterns indicative of data exfiltration.

  ### Prioritization
  Given the potential for these obfuscated PowerShell scripts to achieve persistence or lateral movement within an enterprise environment, this alert is assigned a high severity rating. The likelihood of exploitation through these methods is significant, particularly from threat actors adept at leveraging such tools.

  ### Blind Spots and Assumptions
  This detection rule assumes that the PowerShell logging is enabled and configured across the environment, which may not be the case in all organizations. Additionally, there could be false negatives if attackers do modify their payloads significantly or employ alternative execution methods. The detection relies on identifying specific low-entropy strings; therefore, if the payloads are crafted to evade these detections, the rule may not capture all instances of malicious activity. Logs from systems where PowerShell execution is audited must be collected for this alert to function effectively.

