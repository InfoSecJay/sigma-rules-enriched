note: |
  ### Technical Context

  This rule detects the use of specific artifacts in PowerShell scripts that are commonly associated with poorly obfuscated or minimally altered offensive payloads from various threat actors, including Cobalt Strike and PowerSploit. The likely objective of an attacker using these artifacts is to gain unauthorized access and execute malicious commands while attempting to blend in with legitimate PowerShell usage.

  This detection is related to the MITRE ATT&CK framework under the execution tactic (T1059.001: PowerShell). Primary telemetry sources include PowerShell module execution logs, specifically filtering for script content that contains certain identifiable strings. Any malicious use of these identified patterns poses a critical security risk as it may indicate active exploitation of systems. Importantly, this detection does NOT confirm that a system compromise has occurred; it only highlights the use of suspicious code that warrants further investigation.

  ### Investigation Steps

  - **Check PowerShell Module Logs**: Review Windows Event Log (Event ID 4103) for PowerShell module logs to locate scripts containing any of the specified indicators such as '$DoIt', 'harmj0y', or '_RastaMouse'.

  - **Identify Script Context**: Analyze the full execution context of detected scripts, including the user context, execution policy, and parent processes to distinguish between legitimate administrative tasks and potentially malicious activity.

  - **Compare with Known Good Hashes**: Compare the detected PowerShell script contents against a repository of known legitimate scripts. Identify any deviations or variations that align with common attack patterns.

  - **Investigate Parent Processes**: Assess the parent process of the PowerShell execution to see if it originated from expected applications or known malicious executables or scripts that could suggest lateral movement or persistence.

  - **Monitor for Subsequent Malicious Activity**: After identifying the use of bad opsec artifacts, monitor for additional signs of compromise, such as unusual outbound network connections or persistent file creation (e.g., scheduled tasks, modifications to startup items).

  ### Prioritization

  This alert should be treated with high severity, given the critical impact associated with potential lateral movement and command execution privileges on sensitive systems. The identified behavior is known to be exploited actively by attackers, particularly those utilizing sophisticated toolkits and frameworks, which underscores the urgency for immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential of heavy obfuscation techniques that attackers may use beyond the specified keywords. Continuous logging of PowerShell activity is required for reliable detection; ensure PowerShell logging is enabled across all endpoints. Legitimate administrative tools and scripts may produce similar log artifacts, potentially leading to false positives. Companion detections, such as monitoring for unusual or unauthorized process creation (Security Event ID 4688), can enhance alert accuracy and provide deeper insight into the nature of the activity.

