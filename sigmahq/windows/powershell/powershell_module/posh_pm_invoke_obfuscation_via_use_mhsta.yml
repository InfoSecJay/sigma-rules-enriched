note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell scripts that invoke the MSHTA (Microsoft HTML Application Host) utility, which can be exploited by attackers to execute malicious code. The threat scenario typically involves an adversary using MSHTA to run potentially harmful scripts that may bypass traditional security mechanisms by disguising their true intent. Attackers leveraging such techniques often aim to achieve execution of arbitrary code or to facilitate further malware deployment within an environment.

  This behavior is relevant to the MITRE ATT&CK framework, specifically targeting techniques under the tactics of Execution and Defense Evasion. Notably, T1059.001 (PowerShell) and T1027 (Obfuscated Files or Information) highlight the means through which attackers can conceal their actions, complicating detection efforts. The primary sources of telemetry for this detection include PowerShell execution logs, process creation events, and potentially event logs related to MSHTA execution.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell execution logs for instances of commands that include 'mshta', 'vbscript:createobject', or obfuscation patterns indicating potential misuse.
  - **Analyze Event Logs**: Inspect Windows Event Logs, focusing on process creation events to identify unauthorized or suspicious execution of MSHTA, particularly in conjunction with PowerShell commands.
  - **Correlate with Network Activity**: Check for unusual outbound network connections that may correlate with the timing of the detected scripts, particularly those indicating command-and-control (C2) activity.
  - **Validate Contextuality of Scripts**: Look for the origin of the script (if available) and contextual details around its use—such as user, time of execution, and whether the script aligns with legitimate business processes.

  ### Prioritization
  This alert should be treated with high severity due to its potential to facilitate serious compromises through the circumvention of security controls, which can lead to further infiltration or data exfiltration.

  ### Blind Spots and Assumptions
  The detection logic may not capture all instances of obfuscated scripting, particularly if alternative obfuscation techniques are employed that don't include the specified patterns. Assumptions made include that the MSHTA execution will occur with recognizable scripting patterns, which may not cover all attacker methodologies. Additionally, correct logging and configuration of PowerShell and Windows Event Logs are essential for this alert to function effectively.

