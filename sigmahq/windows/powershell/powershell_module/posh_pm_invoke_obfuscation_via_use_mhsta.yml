  ---

  ### Technical Context

  This Sigma rule detects the use of MSHTA (Microsoft HTML Application Host) to execute obfuscated PowerShell scripts, which are often employed to bypass security controls by obscuring command execution. The likely attacker objective would be to gain access to a system, exfiltrate data, or deploy additional payloads without detection. This aligns with the MITRE ATT&CK executions techniques T1059.001 (Command and Scripting Interpreter: Windows PowerShell) and T1027 (Obfuscated Files or Information).

  The primary telemetry source includes PowerShell logs, specifically targeting event IDs related to script execution. If the behavior is malicious, it may indicate an attempt to leverage obfuscation techniques for executing potentially harmful scripts. This detection does NOT confirm actual system compromise or successful exploitation on its own; further investigation is required to ascertain the intent and impact.

  ---

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Inspect PowerShell logs (Event ID 4104) for command lines that include "mshta" along with obfuscation patterns. Look for suspicious base64-encoded strings or unusual command constructs indicative of evasion techniques.

  - **Check MSHTA Execution Instances:** Correlate logs to verify instances of mshta.exe (typically found in the Windows directory) being executed. Compare the execution context, such as the parent process (cmd.exe or PowerShell), to determine if it appears suspicious.

  - **Validate Expected Behavior:** In regular operations, mshta may be legitimately used for deploying HTML applications. Verify if the execution was part of expected business operations, such as internal tool deployment, and check if corresponding documentation or scheduling exists.

  - **Identify Malicious Indicators:** Look for indicators of compromise, such as obfuscated command segments that include 'set', '&&', or 'vbscript:createobject'. Any command phrases indicating malicious intent or unusual concatenation could be flagged as suspicious.

  - **Examine System Artifacts:** Investigate file artifacts in the temporary directories (e.g., %TEMP%) for any newly created files that may follow the mshta execution. Check creation timestamps and attributes to ascertain if they align with the detected command execution time.

  ---

  ### Prioritization

  This alert carries high severity, as it indicates potential use of obfuscation techniques that are commonly wielded by adversaries to execute malicious scripts undetected. The likelihood of malicious use is high due to the nature of the behavior being indicative of evasion strategies, which are frequently weaponized in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  Detection relies heavily on comprehensive logging of PowerShell and process execution events; missed logs could lead to undetected attacks. Legitimate activities, such as software deployment or authorized application usage, could trigger false positives. A related detection strategy includes monitoring for abnormal network connections following mshta executions, which could indicate further malicious actions, enhancing overall security monitoring.

