note: |
  ### Technical Context

  This rule detects the use of the MSHTA utility to execute obfuscated PowerShell scripts, which is indicative of attempts to bypass defenses and execute malicious code in a stealthy manner. The likely objective of the attacker is to leverage PowerShell's capabilities for executing scripts in a way that avoids detection, typically in furtherance of data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactics of Execution (TA0002) with the technique ID T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry sources for this detection are PowerShell logs (Windows Event ID 4104) capturing script block logs and associated execution context parameters. If the usage of MSHTA is malicious, the impact may involve unauthorized command execution, system compromise, or data theft. It is crucial to note that this detection alone does not confirm malicious intent; legitimate use of PowerShell commands may also trigger this alert.

  ### Investigation Steps

  - **Check PowerShell script logs**: Review Windows Event ID 4104 for any script block logging related to the alert, focusing on the payload to identify suspicious commands. Look for entries that include 'mshta' and other obfuscation patterns listed in the detection criteria.

  - **Analyze command-line behavior**: Inspect the command-line arguments of the invoking process (e.g., for Event ID 4688) to determine if there are any indications of malicious activity. Anomalous patterns using 'mshta' alongside obfuscation commands could indicate malicious use.

  - **Review parent process relationships**: Utilize Sysmon Event ID 1 to trace the process creation tree. Look for instances where MSHTA is spawned by unusual parent processes instead of common applications like browsers or administrative tools, which may suggest malicious activity.

  - **Identify expected usage contexts**: Assess typical MSHTA application usage within your environment, focusing on legitimate scenarios like internal applications. Document benign command usage that contains 'vbscript:createobject' without additional obfuscation to differentiate from malicious patterns.

  - **Examine network connections**: Check any outbound connections initiated by the malicious command's process via Windows Firewall logs (Event ID 5156) for unauthorized communication patterns, particularly to external IP addresses and unusual ports.

  - **Correlate with known indicators**: Compile a list of hashes from known good PowerShell scripts or legitimate MSHTA usages and compare against recent observations to confirm known benign behavior versus anomalous entries.

  ### Prioritization

  The alert severity is high due to the potential impact of a compromised system, especially if it pertains to critical assets. The use of obfuscated PowerShell execution is a common tactic among adversaries, thereby increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not logging PowerShell execution or not having script block logging enabled. Legitimate administrative tasks may trigger this alert, so context is crucial. Related detections to consider include those targeting direct PowerShell invocations (e.g., Event ID 4104 without MSHTA), which can provide additional insight into script origins and intentions.

