note: |
  ### Technical Context

  This rule detects obfuscated PowerShell scripts that use MSHTA (Microsoft HTML Application Host) to execute malicious VBScript. Such behavior often indicates an attacker attempting to bypass detection mechanisms by decoding their commands to evade security systems while executing payloads that can lead to further exploitation or command and control (C2) communication. The relevant MITRE ATT&CK techniques are Execution (T1059.001) and Defense Evasion (T1027). Primary telemetry sources include Windows PowerShell logs, specifically capturing events related to script execution, and System event logs, particularly those relating to MSHTA usage.

  If confirmed as malicious, this behavior could lead to data exfiltration, system compromise, or lateral movement within the network. It is important to note that the detection alone does not confirm a compromise; legitimate usage of MSHTA with PowerShell may also trigger this alert.

  ---

  ### Investigation Steps

  - **Identify obfuscated PowerShell execution:**
    Examine PowerShell Event ID 4103 logs for irregular patterns or scripts that utilize keywords like 'set', '&&', 'mshta', and 'vbscript:createobject' in their payload. Pay attention to the context of their execution.

  - **Check for malicious process creation:**
    Review Security Event ID 4688 for any PowerShell process spawned by MSHTA. Typical benign use cases may originate from trusted applications, while anomalous invocations could indicate a compromise.

  - **Validate the use of MSHTA:**
    Cross-check System Event Log entries (Event ID 800) for MSHTA executions coinciding with undocumented script executions, indicating possible misuse.

  - **Assess network activity:**
    Analyze network logs for any outbound connections initiated by the process identified (MSHTA) to unusual external IPs. Look for suspicious DNS requests or HTTP traffic originating from PowerShell scripts.

  - **Document expected behavior:**
    Identify baseline PowerShell usage by normal users, indicating typical command execution patterns. Compare against detected activity to discern deviations.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on the system and network integrity, especially if the affected system is prone to hosting critical applications or sensitive data. The likelihood of exploitation via this technique is high, given its association with common attack patterns used for lateral movement and command execution in compromised environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques that further disguise the PowerShell commands executed by MSHTA. Proper logging configurations for both PowerShell and MSHTA executions are essential for reliable detection. Legitimate activities such as IT maintenance scripts or administrative tasks may unintentionally trigger this alert. A related detection strategy would be monitoring for abnormal outbound network traffic from PowerShell sessions, providing additional context and confirmation of potential malicious activity.

