title: Alternate PowerShell Hosts - PowerShell Module
id: 64e8e417-c19a-475a-8d19-98ea705394cc
status: test
description: Detects alternate PowerShell hosts potentially bypassing detections
  looking for powershell.exe
references:
- https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-08-11
modified: 2025-10-17
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection:
    ContextInfo|contains: '*'
  filter_powershell:
        # This filter covers the following use cases
        #   - When powershell is called directly from commandline via keyword powershell or powershell.exe
        #   - Or called via path but not with full "".exe". Example: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
    ContextInfo|contains:
    - '= powershell'         # Host Application=...powershell.exe or Application hote=...powershell.exe in French Win10 event
    - '= C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - '= C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - '= C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
            # In some cases \??\C:.. is used
    - '= \\\?\?\C:Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= \\\?\?\C:Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
  filter_sdiagnhost:
    ContextInfo|contains: '= C:\WINDOWS\System32\sdiagnhost.exe -Embedding'     # When MSDT is launched for example
  filter_citrix:
    ContextInfo|contains: 'ConfigSyncRun.exe'
  filter_adace:    # Active Directory Administrative Center Enhancements
    ContextInfo|contains: 'C:\Windows\system32\dsac.exe'
  filter_winrm:
    ContextInfo|contains: 'C:\Windows\system32\wsmprovhost.exe -Embedding'
  filter_help_update:
    Payload|contains:
    - 'Update-Help'
    - 'Failed to update Help for the module'
  condition: selection and not 1 of filter_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated 
  interpreter
- MSP Detection Searcher
- Citrix ConfigSync.ps1
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of PowerShell through non-standard hosts that could be used to bypass traditional detection mechanisms focused on `powershell.exe`. Attackers may utilize alternate processes to execute malicious PowerShell scripts, with the goal of executing code, exfiltrating data, or performing lateral movement within the network. Relevant MITRE ATT&CK tactic is Execution, specifically technique T1059.001 (PowerShell).

  The primary telemetry source is Windows PowerShell logs, specifically filtering for contexts indicating execution without the default PowerShell host. Key artifacts include logs from `powershell` as the host application or legitimate administrative tools like `dsac.exe`. If malicious, this behavior could signify active exploitation or persistence. However, this detection does NOT confirm that the behavior is malicious on its own; legitimate applications may invoke PowerShell similarly.

  ### Investigation Steps

  - **Review the Alert Data**: Extract the `ContextInfo` fields from the triggering event. Look for values indicating calls to PowerShell that do not originate from `powershell.exe`. This could suggest stealthy usage by an adversary.

  - **Check for Standard PowerShell Invocation**: Compare logged activity with typical behavior for legitimate PowerShell usage. Legitimate calls should primarily originate from `powershell.exe` or authorized management processes.

  - **Identify High-Confidence Malicious Indicators**: Look for indicators related to known malicious activities, such as strange parameters or obfuscation in the `ContextInfo` string. Specific patterns may include unusual invocations from processes like `sdiagnhost.exe` or `dsac.exe`.

  - **Document System Context**: Assess the role of the affected host. Is it a sensitive server (e.g., domain controller or database server) that would raise the severity of malintent? Review asset management databases for roles and criticality.

  - **Correlate with Other Security Events**: Check for previous alerts or related events in security logs, such as unusual logins or anomalous network traffic, around the time this alert was triggered. Use Event ID 4688 for process creation logs to find prior executed commands.

  - **Investigate User Activity**: Analyze the user account associated with the PowerShell invocation. Cross-reference with recent changes in user roles or unusual logon behavior to establish whether the user has legitimate reasons to run PowerShell in this manner.

  ### Prioritization

  This alert carries medium severity due to the potential impact of an affected system, especially if it is critical infrastructure. The likelihood of malicious use is moderate, as attackers routinely look for ways to overcome standard defenses. Given that PowerShell is a commonly exploited tool, any non-standard invocation or host is worth immediate review.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as using legitimate management tools to launch PowerShell. Accurate detection requires comprehensive logging configurations to capture all PowerShell executions. Common legitimate activities triggering the alert might include Windows Management Instrumentation (WMI) or Azure Active Directory related administrative tasks. A related detection is monitoring for execution from `wsmprovhost.exe`, which can also indicate potentially malicious use of PowerShell.

