title: Alternate PowerShell Hosts - PowerShell Module
id: 64e8e417-c19a-475a-8d19-98ea705394cc
status: test
description: Detects alternate PowerShell hosts potentially bypassing detections looking
  for powershell.exe
references:
- https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-08-11
modified: 2025-10-17
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection:
    ContextInfo|contains: '*'
  filter_powershell:
        # This filter covers the following use cases
        #   - When powershell is called directly from commandline via keyword powershell or powershell.exe
        #   - Or called via path but not with full "".exe". Example: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
    ContextInfo|contains:
    - '= powershell'         # Host Application=...powershell.exe or Application hote=...powershell.exe in French Win10 event
    - '= C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - '= C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - '= C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
            # In some cases \??\C:.. is used
    - '= \\\?\?\C:Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= \\\?\?\C:Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
  filter_sdiagnhost:
    ContextInfo|contains: '= C:\WINDOWS\System32\sdiagnhost.exe -Embedding'     # When MSDT is launched for example
  filter_citrix:
    ContextInfo|contains: 'ConfigSyncRun.exe'
  filter_adace:    # Active Directory Administrative Center Enhancements
    ContextInfo|contains: 'C:\Windows\system32\dsac.exe'
  filter_winrm:
    ContextInfo|contains: 'C:\Windows\system32\wsmprovhost.exe -Embedding'
  filter_help_update:
    Payload|contains:
    - 'Update-Help'
    - 'Failed to update Help for the module'
  condition: selection and not 1 of filter_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated interpreter
- MSP Detection Searcher
- Citrix ConfigSync.ps1
level: medium
note: |
  ### Technical Context
  This rule detects instances where PowerShell modules are being executed from alternate hosts or environments, potentially allowing adversaries to bypass traditional detection methods that focus solely on the standard `powershell.exe` process. Attackers often leverage alternate PowerShell hosts or modified execution paths to execute scripts, particularly when trying to evade security monitoring.

  The threat scenario might involve a sophisticated attack leveraging tools and techniques to maintain persistence or execute malicious code undetected. Typical objectives might include data exfiltration, lateral movement, or remote administration. This behavior is particularly concerning as attackers can retain access while appearing legitimate by blending in with standard administrative operations.

  Relevant MITRE ATT&CK tactics include:
  - Execution (TA0002)
    - PowerShell (T1059.001)

  Primary data sources that will provide the best evidence include Windows event logs specifically related to PowerShell execution, process creation events, and any logs from systems configured to monitor alternate host activity related to PowerShell.

  ### Investigation Steps
  - **Review PowerShell Logs**: Collect and analyze PowerShell operational logs from the target systems to identify any unusual invocations of PowerShell modules from unexpected paths or hosts.
  - **Examine Execution Command Lines**: Investigate the command line execution details for processes that triggered this alert, focusing on arguments used to invoke PowerShell modules, especially those deviating from the standard user execution flow.
  - **Check for Anomalous Process Trees**: Analyze the parent-child process relationships in the process creation logs to understand if any unusual process hierarchies are present, indicating evasion techniques.
  - **Correlate Events with User Behavior**: Look for discrepancies in user activity, such as privileged user accounts executing PowerShell from uncommon locations or utilizing alternate hosts extensively compared to historical norms.

  ### Prioritization
  The alert has a medium severity level due to the potential for misuse by attackers to evade detection and execute malicious payloads. Given the critical role of PowerShell in Windows environments, any deviations from standard execution patterns warrant prompt investigation.

  ### Blind Spots and Assumptions
  This alert may miss detections of benign applications that utilize PowerShell without calling `powershell.exe` directly, such as managed scripts or legacy applications. The detection logic assumes that the context and command line structures will be consistent with known patterns of abuse. Required logs for effective detection include detailed process creation logs as well as those specifically capturing PowerShell usage, which may need configuration to ensure comprehensive coverage.

