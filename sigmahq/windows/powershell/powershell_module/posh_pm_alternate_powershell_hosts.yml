title: Alternate PowerShell Hosts - PowerShell Module
id: 64e8e417-c19a-475a-8d19-98ea705394cc
status: test
description: Detects alternate PowerShell hosts potentially bypassing detections looking
  for powershell.exe
references:
- https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-08-11
modified: 2025-10-17
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection:
    ContextInfo|contains: '*'
  filter_powershell:
        # This filter covers the following use cases
        #   - When powershell is called directly from commandline via keyword powershell or powershell.exe
        #   - Or called via path but not with full "".exe". Example: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
    ContextInfo|contains:
    - '= powershell'         # Host Application=...powershell.exe or Application hote=...powershell.exe in French Win10 event
    - '= C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - '= C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - '= C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
            # In some cases \??\C:.. is used
    - '= \\\?\?\C:Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= \\\?\?\C:Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
  filter_sdiagnhost:
    ContextInfo|contains: '= C:\WINDOWS\System32\sdiagnhost.exe -Embedding'     # When MSDT is launched for example
  filter_citrix:
    ContextInfo|contains: 'ConfigSyncRun.exe'
  filter_adace:    # Active Directory Administrative Center Enhancements
    ContextInfo|contains: 'C:\Windows\system32\dsac.exe'
  filter_winrm:
    ContextInfo|contains: 'C:\Windows\system32\wsmprovhost.exe -Embedding'
  filter_help_update:
    Payload|contains:
    - 'Update-Help'
    - 'Failed to update Help for the module'
  condition: selection and not 1 of filter_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated interpreter
- MSP Detection Searcher
- Citrix ConfigSync.ps1
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the invocation of PowerShell from alternate hosts, which often bypass traditional detection mechanisms focused solely on `powershell.exe`. An attacker may utilize these alternate hosts to execute PowerShell scripts for executing commands, launching additional payloads, or establishing persistence. This behavior falls under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of PowerShell (T1059.001).

  The primary telemetry source is the Windows event logs that capture PowerShell module activity, specifically from sources like Sysmon and PowerShell logging. If exploited, this can enable adversaries to run malicious scripts or commands undetected. It is crucial to note that this detection does NOT confirm malicious intent; it only highlights that PowerShell was invoked from a non-standard context.

  ---

  ### Investigation Steps

  - **Check PowerShell invocation details:** Review Windows Security Event ID 4688 for the `New Process Created` event, focusing on the Process Name and Command Line fields for evidence of `powershell.exe` or alternative PowerShell hosts.

  - **Identify malicious command patterns:** Look for suspicious command-line arguments in the PowerShell execution context (Event ID 4688) that may indicate exploitation attempts, such as the use of encoded commands or obfuscated scripts.

  - **Compare against known benign hosts:** Cross-reference the identified PowerShell invocation with legitimate business applications or maintenance scripts (e.g., update mechanisms) to ascertain typical usage patterns—this may include legitimate processes like `ConfigSyncRun.exe` for Citrix.

  - **Validate any file creation or modification:** Investigate for file artifacts in the user's temporary directories or AppData paths, which may correlate with malicious PowerShell activity (e.g., check for `.ps1` or `.exe` files), especially around the time of the triggered alert.

  - **Correlate against user activity:** Analyze associated Event ID 4624 (Logon) and 4625 (Failed Logon) entries to determine whether unusual user access patterns coincide with the PowerShell invocations.

  - **Inspect surrounding logs for exploit signals:** Review Sysmon Event IDs 1 (Process Creation) and 10 (ProcessAccess) for related process activities that may indicate a malicious chain of events or lateral movement.

  ---

  ### Prioritization

  This alert is medium severity due to its potential impact on systems considering that alternate PowerShell hosts are commonly utilized for legitimate administrative tasks, but they can also facilitate malicious activities. The likelihood of such behavior being weaponized is significant, particularly in campaigns utilizing PowerShell for lateral movement or data exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection efficacy is limited by the configuration of Windows Event logging; ensuring PowerShell transcription and module logging are enabled is essential for comprehensive oversight. Legitimate applications such as system maintenance tools could trigger this alert, potentially creating false positives. A companion detection to consider includes monitoring for Access Token manipulation (Tech ID T1134) to help correlate unauthorized privilege escalation attempts with PowerShell usage.

