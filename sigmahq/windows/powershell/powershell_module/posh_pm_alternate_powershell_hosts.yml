title: Alternate PowerShell Hosts - PowerShell Module
id: 64e8e417-c19a-475a-8d19-98ea705394cc
status: test
description: Detects alternate PowerShell hosts potentially bypassing detections
  looking for powershell.exe
references:
- https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-08-11
modified: 2026-10-19
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_module
  definition: 0ad03ef1-f21b-4a79-8ce8-e6900c54b65b
detection:
  selection:
    ContextInfo|contains: '*'
  filter_powershell:
        # This filter covers the following use cases
        #   - When powershell is called directly from commandline via keyword powershell or powershell.exe
        #   - Or called via path but not with full "".exe". Example: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
    ContextInfo|contains:
    - '= powershell'         # Host Application=...powershell.exe or Application hote=...powershell.exe in French Win10 event
    - '= C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - '= C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - '= C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
            # In some cases \??\C:.. is used
    - '= \\\?\?\C:Windows\System32\WindowsPowerShell\v1.0\powershell'
    - '= \\\?\?\C:Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
  filter_sdiagnhost:
    ContextInfo|contains: '= C:\WINDOWS\System32\sdiagnhost.exe -Embedding'     # When MSDT is launched for example
  filter_citrix:
    ContextInfo|contains: 'ConfigSyncRun.exe'
  filter_adace:    # Active Directory Administrative Center Enhancements
    ContextInfo|contains: 'C:\Windows\system32\dsac.exe'
  filter_winrm:
    ContextInfo|contains: 'C:\Windows\system32\wsmprovhost.exe -Embedding'
  filter_help_update:
    Payload|contains:
    - 'Update-Help'
    - 'Failed to update Help for the module'
  filter_wapshost:
    ContextInfo|contains: 'Host Name = WaPSHost'
  condition: selection and not 1 of filter_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated 
  interpreter
- MSP Detection Searcher
- Citrix ConfigSync.ps1
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential unauthorized use of alternate PowerShell host applications that could evade traditional PowerShell monitoring setups. The behavior suggests an attempt to execute PowerShell scripts or commands through alternate means rather than utilizing the standard powershell.exe executable, potentially indicating malicious power escalation or lateral movement. The attacker’s objective may be to execute scripts undetected, leveraging alternative Windows components (e.g., `sdiagnhost.exe`, `wsmprovhost.exe`) that can invoke PowerShell-like functionality.

  This detection aligns with the MITRE ATT&CK framework under the Execution tactic, specifically technique T1059.001 (Command and Scripting Interpreter: Windows Powershell). The primary telemetry source includes Windows event logs related to PowerShell module invocations, specifically focusing on log types that contain the PowerShell context, with an emphasis on the ContextInfo field for identifying alternate execution hosts. If confirmed malicious, this activity could lead to unauthorized access or control of the targeted systems. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate applications can invoke PowerShell without malicious consequences.

  ### Investigation Steps

  - **Review PowerShell invocation logs:** Check for Event ID 4104 (PowerShell Script Block Logging) for script blocks executed by non-standard hosts. Note any suspicious commands that deviate from normal administrative activity.

  - **Analyze ContextInfo field:** Investigate alerts triggered for `ContextInfo` containing paths to alternative PowerShell hosts such as `sdiagnhost.exe` or `wsmprovhost.exe`. This could indicate the potential evasion of protections targeting `powershell.exe`.

  - **Identify benign usage patterns:** Recognize regular administrative tasks where PowerShell is invoked by expected applications, such as system updates or authorized monitoring scripts, to distinguish from suspicious behavior.

  - **Correlate with additional threat intelligence:** Utilize security threat reports and internal logs to determine if any flagged hosts or user accounts exhibit behavior consistent with previous compromises related to this detection.

  - **Validate file creation or modification artifacts:** Check for script creation or modification within directories typically associated with malicious activity (e.g., user profile temp folders) following the invocation of alternate hosts.

  - **Mitigate false positives:** Be aware of legitimate uses, such as applications like Citrix running PowerShell scripts for configuration. Ensure to assess ContextInfo for clearly identified legitimate executables versus alternatives.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact if exploited on critical systems. The likelihood of exploitation increases when such executions are observed in environments where PowerShell usage is tightly controlled or monitored. Additionally, leveraging alternate hosts is a recognized technique among sophisticated adversaries, making it essential to prioritize the investigation of these alerts.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain logs if PowerShell logging is not enabled across all endpoints. Legitimate applications may trigger these alerts, thus assessments should include context around known benign uses of alternate hosts. It is also essential to enable comprehensive logging, including Process Creation events (Event ID 4688) for better visibility. Companion detections related to direct PowerShell invocation (e.g., detection of malicious PowerShell command execution) can bolster overall monitoring effectiveness.

