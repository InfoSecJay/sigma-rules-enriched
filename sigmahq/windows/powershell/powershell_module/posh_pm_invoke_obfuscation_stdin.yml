note: |
  ### Technical Context
  This rule detects the obfuscated execution of PowerShell commands using standard input (stdin) as a launch technique. Attackers often leverage obfuscation to conceal malicious PowerShell scripts and evade detection systems. Using the `Invoke-Obfuscation` PowerShell module, adversaries can manipulate script inputs to obscure their true intent, potentially leading to unauthorized access, data exfiltration, or the deployment of additional malware.

  The primary attacker objective is to execute malicious payloads while avoiding detection by traditional security measures. Techniques like this fit within the MITRE ATT&CK framework, specifically under the tactics of **Defense Evasion** and **Execution**. Relevant techniques include:
  - **T1027**: Obfuscated Files or Information
  - **T1059.001**: PowerShell

  To effectively detect this behavior, the primary data sources will be **PowerShell module logs** and **process creation events**, which help capture execution patterns and command-line arguments leveraged during such attacks.

  ### Investigation Steps
  - **Review PowerShell Logs**: Collect and analyze PowerShell module logs to identify any usage of `Invoke-Obfuscation` or other obfuscation techniques that may indicate malicious activity.
  - **Analyze Process Creation Events**: Investigate any unusual PowerShell process creation events. Look for command-line arguments that include obfuscation tactics, particularly involving stdin and the execution of remote scripts or encoded commands.
  - **Inspect Security Event Logs**: Filter through Windows Security Event Logs to identify any entries related to script execution that may correlate with the detected obfuscated commands, paying attention to the execution context.
  - **Cross-Reference Indicators of Compromise**: Check for known indicators associated with obfuscation techniques, including IP addresses, domains, or any associated file hashes that might indicate further compromise.

  ### Prioritization
  The alert is deemed high-severity due to the potential impact of successful obfuscation and execution of PowerShell scripts, which can lead to significant data breaches or system integrity compromise. Given the common usage of these tactics among advanced persistent threat (APT) actors, the likelihood of encountering such techniques is significant in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule might miss instances where obfuscation techniques do not utilize `Invoke-Obfuscation` or other known methods, as well as scenarios where attackers employ alternative scripting languages. There is an assumption that the necessary logs for PowerShell execution are enabled and that the PowerShell module logging feature is correctly configured. If PowerShell logging is not enabled on endpoints, or if obfuscated commands are executed in a non-standard manner, this alert may not trigger effectively.

