note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell invocations via standard input (stdin), indicating a potential use of PowerShell for execution of malicious commands or scripts. The likely attacker objective is to execute code stealthily on the target system without being easily detectable, utilizing techniques that evade conventional detection mechanisms. This behavior aligns with the MITRE ATT&CK tactics of Execution (TA0002) and T1027 - Obfuscated Files or Information.

  The primary telemetry sources include Windows PowerShell logs, specifically PowerShell module activity. The security impact is significant as malicious actors can exploit this technique to execute payloads that may lead to data theft, lateral movement, or system compromise. It is important to note that this detection does NOT confirm an active compromise on its own; it highlights suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check PowerShell History: Review PowerShell command execution history (Event ID 4103):** Look for any indications of obfuscated PowerShell commands or unusual parameters. Legitimate use cases typically involve clear commands without heavy obfuscation.

  - **Examine Execution Context: Validate the context under which PowerShell was executed (Event ID 4688):** Identify the parent process and user account. While systemadministrators may run commands, unexpected user accounts or processes (e.g., `cmd.exe` launching PowerShell) are red flags.

  - **Analyze for Known Malicious Patterns: Cross-reference command lines with known threat actor signatures:** Look for specific obfuscation techniques or strings in the command line inputs that align with documented malware behaviors.

  - **Correlate with Network Activity: Check outbound network connections during the timeframe (e.g., NetFlow logs):** Validate the presence of unusual external requests or connections initiated by the PowerShell session. Common benign activity may involve API calls to known business services.

  - **Investigate Log Source Configuration: Ensure PowerShell logging is enabled:** Validate the presence of detailed logging (like transcription logs) in place to capture full command execution for future analysis and understanding of common command usages.

  ### Prioritization

  Given that this rule targets obfuscated scripting activity that often precedes further malicious activities (like lateral movement or data exfiltration), it bears high severity. The impact of a successful exploitation can range from data breaches to full system compromises, and techniques to obfuscate command executions are frequently weaponized in attacks aimed at evading detection.

  ### Blind Spots and Assumptions

  Detection is limited by the effectiveness of logging configurations; if PowerShell logs are not properly configured, critical activities may fly under the radar. However, legitimate IT operations can trigger such alerts, such as software updates or script deployments that may use obfuscated commands for legitimate purposes. A companion detection that enhances coverage is monitoring for unexpected use of `Invoke-Expression` or `Invoke-Command` (T1059.001), which can also be associated with malicious behavior in PowerShell environments.

