note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands using standard input (stdin). Typically, an attacker may use this technique to run malicious commands or scripts while attempting to evade detection by making the code harder to read and analyze. The rule aligns with MITRE ATT&CK tactics, specifically 'Execution' (TA0002), and the techniques 'Obfuscated Files or Information' (T1027) and 'Command and Scripting Interpreter: Windows PowerShell' (T1059.001).

  The primary telemetry source for this detection is Windows PowerShell module logs, particularly focusing on command invocation patterns. If malicious, such activities can indicate a serious breach, as they may facilitate lateral movement, data exfiltration, or system compromise. However, this detection does NOT confirm that the activity is malicious on its own; further context is needed for a conclusive determination.

  ### Investigation Steps

  - **Review PowerShell command invocation:** Check Windows PowerShell Operational logs (Event ID 4103) for commands containing "cmd" and "powershell" with stdin obfuscation. A benign command might include typical administrative utilities executed without obfuscation.

  - **Analyze the execution context:** Verify the user account executing the command. Look for anomalies such as execution by a non-admin account on critical systems, which could indicate malicious activity.

  - **Inspect process creation logs:** Look for correlating Security Event ID 4688 logs to identify the parent process of the PowerShell command. Malicious activity may exhibit unusual parent process IDs, especially if originating from scripts or automated tasks.

  - **Check for additional obfuscation techniques:** Investigate logs for patterns indicative of other obfuscation methods or chaining of PowerShell commands that may further signify an attempt to execute malicious code.

  - **Evaluate asset criticality:** Focus on alerts from high-value assets or systems containing sensitive data, as the impact of malicious execution on these systems is significantly higher.

  - **Identify high-confidence malicious indicators:** Look for signatures or documentation related to known bad actors using similar techniques (e.g., use of "Invoke-Obfuscation" PowerShell module names or variants).

  ### Prioritization

  This alert is of high severity due to the potential impact of malicious PowerShell execution, particularly on systems with elevated privileges or sensitive data. The likelihood of misuse is significant, as the obfuscation technique is commonly employed by adversaries to evade detection in the execution phase of attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that do not adequately log PowerShell activity or where obfuscation is employed in legitimate administrative scripts, potentially giving rise to false positives. Required logs include detailed PowerShell execution logs and Security Event ID 4688. Legitimate activities, such as automated system management scripts, might trigger this alert. Related detections for additional coverage include monitoring for the use of specific PowerShell modules that have known malicious usage patterns.

