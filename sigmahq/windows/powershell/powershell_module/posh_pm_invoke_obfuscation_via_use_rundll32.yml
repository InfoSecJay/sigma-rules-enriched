note: |
  ### Technical Context
  This detection rule is designed to identify instances of obfuscated PowerShell scripts that utilize `rundll32`, a Windows command-line utility, to execute potentially harmful code. Attackers often employ this technique as part of their exploitation strategies, attempting to bypass security measures by disguising malicious payloads within legitimate system processes. This behavior may lead to unauthorized data access or the establishment of persistent access within the target environment.

  The likely objectives of an attacker using this method include evading detection, executing scripts that compromise system integrity, and escalating privileges within the network. This detection aligns with several tactics and techniques as outlined in the MITRE ATT&CK framework, most notably:
  - **Tactic: Execution** (TA0002)
  - **Technique: Command and Scripting Interpreter: PowerShell** (T1059.001)
  - **Technique: Obfuscated Files or Information** (T1027)

  The primary data sources pertinent for effective detection of this behavior are PowerShell module logs which track script execution, specifically looking for unusual patterns and commands that involve `rundll32` and obfuscated input.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate PowerShell logs to identify instances where `rundll32` is used alongside obfuscated commands, focusing on script execution patterns containing indicators like `&&`, `value`, and `iex`.

  - **Analyze Process Creation Events**: Look into process creation logs to find unusual command-line arguments associated with `rundll32` and its invocation of `shell32.dll`, which can help identify malicious activity and the execution flow of potentially harmful scripts.

  - **Correlate with User Activity**: Cross-reference the timings and users executing these scripts with typical user behavior to detect anomalies that may signify a compromised account or insider threat activity.

  - **Examine Network Traffic**: If applicable, review outbound network traffic for any connections made as a result of the PowerShell execution, particularly looking for data exfiltration attempts or communications with known malicious domains or IP addresses.

  ### Prioritization
  Given the high likelihood of evasion techniques being employed through obfuscated PowerShell scripts, this alert should be regarded as high severity. The potential impact includes full system compromise and the facilitation of nefarious activities, which underscores the critical nature of rapid investigation and response.

  ### Blind Spots and Assumptions
  There may be detection gaps for scripts that do not generate PowerShell logs, such as those executed in purely stealthy or scheduled contexts. The detection logic assumes that any use of `rundll32` alongside common obfuscation techniques indicates malicious intent, which may produce false positives in legitimate contexts. To ensure accurate alerting, proper logging configurations for PowerShell execution should be enabled, along with comprehensive monitoring of process creation and command-line arguments.

