note: |
  ### Technical Context

  The rule detects the execution of obfuscated PowerShell commands leveraging the `rundll32` executable in Windows, which is often utilized by attackers to execute malicious payloads covertly. The likely objective is to gain unauthorized access or control over a system, particularly in evading detection mechanisms. This behavior is associated with the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1027).

  Primary telemetry sources include Windows PowerShell logs (Event ID 4103) that capture information about PowerShell execution. If this behavior is malicious, the security impact can be significant as it may lead to system compromise or facilitate further attacks such as lateral movement or data exfiltration. Importantly, this detection does not confirm that the command was executed with malicious intent, as it may also indicate legitimate administrative activity.

  ### Investigation Steps

  - **Review PowerShell command details**: Check PowerShell logs (Event ID 4103) for the presence of commands containing `rundll32`, `shellexec_rundll`, and the `value` keyword. Verify if the full command line presents obfuscated parameters indicative of malicious intent.

  - **Correlate with process execution logs**: Retrieve Sysmon Event ID 1 for process creation events originating from `rundll32.exe`. Validate if suspicious parent processes (e.g., unusual PowerShell scripts) are creating multiple child processes rapidly.

  - **Identify legitimate uses of rundll32**: Investigate if the command is triggered by authorized IT operations typically relying on `rundll32` for legitimate automation tasks. Approved scripts should not feature heavy obfuscation or unusual command usages.

  - **Validate script origins**: Check file paths and sources where the PowerShell script is executed and whether they stem from trusted management tools or unexpected user profiles. Look for signs of tampering or unusual changes in access rights for these files.

  - **Monitor network behavior post-execution**: Analyze outbound network connections or data exfiltration logs that may follow the execution of the obfuscated command, particularly under suspicious hosts or IPs.

  - **Use threat intelligence sources**: Cross-reference the unique command components against threat intelligence databases to identify any known indicators of compromise or previously documented attack patterns.

  ### Prioritization

  This alert has high severity as it indicates potential execution of obfuscated PowerShell commands via `rundll32`, a technique commonly leveraged by threat actors for initial access and post-exploitation activities. The impact on affected systems can be severe, particularly if these commands facilitate further malicious actions.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using alternative PowerShell obfuscation methods that do not trigger this rule. The required log source for reliable detection includes fully enabled PowerShell logging and Sysmon for process monitoring. Legitimate administrative scripts or system maintenance tasks may also trigger this alert. A related detection to consider is the usage of encoded PowerShell commands, which further enhances coverage of PowerShell misuse.

