  ---

  ### Technical Context

  This rule detects the execution of obfuscated PowerShell commands initiated through `rundll32`, which is often used by attackers to execute malicious scripts while hiding their true intent. The likely attacker objective may be to execute payloads without raising alarms, leveraging the legitimate capabilities of Windows. This behavior is categorized under the MITRE ATT&CK technique "Command and Scripting Interpreter: PowerShell" (T1059.001) and "Obfuscated Files or Information" (T1027).

  Primary telemetry sources include Windows PowerShell logs (Event ID 4103) capturing the execution of PowerShell modules. The security impact could be significant if malicious actors gain unauthorized access or control over systems. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to establish intent.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for specific event IDs:** Check Windows Event ID 4103 for the presence of obfuscated command patterns that include `rundll32`, `shell32.dll`, and `shellexec_rundll`. Confirm that these commands are invoked under suspicious circumstances.

  - **Identify high-confidence malicious indicators:** Look for commands that not only contain `rundll32` but also include common obfuscation patterns such as `value`, `invoke`, `comspec`, or `iex`. Correlate this with known malicious hashes or command patterns.

  - **Assess legitimate PowerShell usage:** Validate if legitimate administrative scripts are using `rundll32` in expected contexts, such as system maintenance. Typically, PowerShell command execution should not involve `rundll32` in common administrative tasks.

  - **Check for file creation or exfiltration artifacts:** Review the file system for any newly created or modified files around the time of the alert. Look for unusual file names or paths that do not conform to normal operational behavior.

  - **Cross-reference with network logs:** Investigate related outbound connections through proxy or firewall logs to identify potential data exfiltration efforts or call-backs to known malicious IPs.

  - **Consider asset criticality:** If this alert emerges from a critical server or system, prioritize immediate investigation due to higher risks associated with compromise.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for significant system compromise if the execution of obfuscated PowerShell is confirmed as malicious. The likelihood of this technique being weaponized is high, as attackers frequently use obfuscation methods to evade detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques that could bypass analysis. The effectiveness of this rule is dependent on the logging level of PowerShell being adequately configured to capture all execution events. Legitimate administrative use cases could trigger this alert, such as normal script execution within approved IT processes. A related detection, monitoring for unusual scripts running via Windows Task Scheduler, can further strengthen threat coverage.

