note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands executed via `rundll32`, a Windows utility commonly abused by attackers to launch malicious payloads while evading detection. An attacker might use this technique to execute scripts that download or run additional malware, facilitating lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1059.001) and Defense Evasion (T1027). The primary telemetry source is Windows PowerShell logs, specifically capturing the output of PowerShell scripts and command executions. If malicious, this behavior could lead to unauthorized access or data breaches. Importantly, this detection does NOT confirm that a malicious payload was successfully executed; it only indicates an attempt.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious commands:** Examine Security Event ID 4688 and Sysmon Event ID 1 for process creation events that show execution of `rundll32` with obfuscating parameters (e.g., `&&`, `invoke`, `iex`). Note if the command leads to legitimate system processes or not.

  - **Identify expected legitimate `rundll32` usage:** Look for normal invocation patterns of `rundll32`, such as calls to `shell32.dll` for system tasks, which typically do not use obfuscated arguments.

  - **Check for malicious indicators in command output:** Analyze PowerShell command payloads for malicious signatures or commonly associated strings, such as `shell32.dll`, `shellexec_rundll`, and see if they are executed in unpredictable patterns.

  - **Correlate with other telemetry:** Validate if the obfuscated execution corresponds with other suspicious activity, such as file creations or changes (Event IDs 4608 and 4663) on the same host/asset, indicating potential malware installations or persistence mechanisms.

  - **Trace parent-child process relationships:** Review the parent process of `rundll32` calls to identify how the script was initiated. Legitimate processes often originate from known system or admin tools, whereas malicious execution may originate from unexpected applications.

  - **Assess user accounts involved:** Investigate the context in which the obfuscated command ran, including the user account. Unusual user actions or elevated permissions for service accounts should raise red flags.

  ### Prioritization

  The alert is of high severity as it suggests potential malicious behavior exploiting critical Windows utilities. The likelihood of abuse is elevated since techniques employing `rundll32` are common in sophisticated attacks, reflecting known malware tactics. Systems with sensitive information or administrative privileges magnify the impact of any successful exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques that disguise PowerShell execution patterns. It assumes that logging for PowerShell script execution is configured and operational on monitored endpoints. Legitimate IT operations utilizing PowerShell for automation may inadvertently trigger this alert. Companion detections, such as monitoring for anomalous binary executions in conjunction with unusual network activity (e.g., outbound connections with unusual traffic), would enhance overall detection fidelity.

