note: |
  ### Technical Context

  This rule detects attempts to enumerate Active Directory groups or users using PowerShell commands, specifically leveraging `Get-ADPrincipalGroupMembership` and `Get-ADUser`. The likely attacker objective is to gather information on domain-level permissions and users, which aids in identifying targets for privilege escalation. This activity correlates with the MITRE ATT&CK tactic of Discovery (TA0007) and the technique for Active Directory Discovery (T1069.002). The primary telemetry source required includes PowerShell logging with specific focus on PowerShell module activity.

  If the behavior is confirmed as malicious, it could lead to unauthorized access or escalation of privileges. It is crucial to note that this detection does NOT, by itself, confirm malicious intent because legitimate administrative scripts may execute similar commands.

  ### Investigation Steps

  - **Collect PowerShell logs for analysis**: Review the Windows Event Logs (Event ID 4104) for PowerShell script block logging that includes the `Get-ADPrincipalGroupMembership` or `Get-ADUser` command. Look for unusual execution contexts or timestamps.

  - **Inspect command context information**: Analyze the `ContextInfo` field for presence of the detected commands. Compare against known legitimate administrative activity to identify if execution was authorized.

  - **Identify legitimate administrative users**: Cross-reference users invoking these PowerShell commands against user roles or administrative groups in Active Directory. Look for typical accounts that run administrative scripts versus unexpected users.

  - **Check for abnormal frequency of queries**: Look for repeated execution of these commands in a short timeframe, which may indicate an attempted enumeration for malicious purposes. Patterns of automated execution may suggest adversarial behavior.

  - **Assess system criticality**: If the detections are observed on systems designated as domain controllers or sensitive infrastructure, prioritize investigation due to elevated risk.

  - **Document high-confidence malicious indicators**: Flag instances where unusual parameters, such as `-f` and `-pr`, are used alongside `Get-ADUser` commands which could indicate an attempt to bypass normal authentication requirements.

  ### Prioritization

  This alert is of low severity in typical environments, as it may arise from administrative scripts. However, if raised on critical infrastructure or unexpected accounts, it warrants higher scrutiny. The modifiable nature of PowerShell makes this behavior commonly weaponized by attackers for reconnaissance.

  ### Blind Spots and Assumptions

  Evasion techniques may involve disabling PowerShell logging or clearing logs post-exploitation, limiting the visibility of these actions. Reliable detection requires appropriate PowerShell logging configurations to be enabled. Legitimate activities such as scheduled scripts run by system administrators may also trigger the alert. A related detection is the observation of unauthorized AD changes, which could indicate the enumeration was followed by attempts at privilege escalation.

