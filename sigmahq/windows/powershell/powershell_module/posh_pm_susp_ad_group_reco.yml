note: |
  ### Technical Context
  This rule detects the enumeration of Active Directory (AD) groups or users using PowerShell, specifically through the `get-ADPrincipalGroupMembership` and `get-aduser` commands. Adversaries may leverage this information to identify user accounts with elevated privileges, such as those in administrative groups, and assess potential targets for future attacks. Understanding which users and groups exist can help attackers plan lateral movements or privilege escalation tactics.

  This behavior aligns with the MITRE ATT&CK techniques for Discovery, particularly T1069.001 (Permission Groups Discovery) and T1069.002 (Group Membership Enumeration). Both techniques involve querying AD to enumerate user and group relationships, potentially leading to identification of critical assets within the environment. The primary data sources that will yield the best evidence of this activity include PowerShell execution logs and Windows event logs related to PowerShell command usage.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell execution logs to check for the usage of `get-ADPrincipalGroupMembership` and `get-aduser` commands. Focus on commands executed with parameters that suggest enumeration efforts.
  - **Analyze Event Logs**: Look through Windows Security event logs (event IDs 400, 410) to identify the context of PowerShell execution, including user accounts and timestamps correlated with suspicious activity.
  - **Cross-reference User Privileges**: Cross-check the enumerated user accounts against your organization’s list of privileged accounts. Investigate anomalies such as unfamiliar accounts with elevated permissions or unexpected group memberships.
  - **Check for Anomalous Access Patterns**: Review logs for unusual access patterns related to Active Directory changes or queries, particularly from non-administrative user accounts or during off-hours.

  ### Prioritization
  Although this alert is categorized as low severity, it warrants attention due to the potential for misuse in planning subsequent attacks. Identifying early signs of enumeration can help prevent lateral movement and privilege escalation efforts within the enterprise.

  ### Blind Spots and Assumptions
  This detection strategy may miss instances of enumeration that occur through other means, such as LDAP queries not captured in standard PowerShell logging. Additionally, it assumes that PowerShell logging is enabled and correctly configured; without proper log collection, this alert may not function effectively. Analysts should ensure that appropriate telemetry is available to support comprehensive investigation efforts.

