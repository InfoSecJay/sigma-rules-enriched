detection:
  selection_convert_b64:
    ContextInfo|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex:
    ContextInfo|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc:
    ContextInfo|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg:
    ContextInfo|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    ContextInfo|contains:
    - '\software\microsoft\windows\currentversion\run'
    - '\software\wow6432node\microsoft\windows\currentversion\run'
    - '\software\microsoft\windows\currentversion\policies\explorer\run'
  selection_webclient:
    ContextInfo|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    ContextInfo|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    ContextInfo|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell invocations that employ command parameters typically associated with malicious behavior. The primary focus is on flags like `-nop` (No Profile), `-w` (WindowStyle), and obfuscation techniques via Base64 encoding or direct downloads from the internet. Attackers might leverage these methods to execute scripts stealthily or to maintain persistence by adding entries to the Windows registry for execution during system startup.

  The rule highlights potential behavior linked to the execution of payloads or scripts that may belong to various malware families or attackers employing PowerShell for post-exploitation activities. Likely objectives include privilege escalation, data exfiltration, or lateral movement within the target environment. The relevant MITRE ATT&CK techniques pertain to the execution tactics, particularly **T1059.001 - Command and Scripting Interpreter: Windows PowerShell**.

  Primary data sources for this alert include PowerShell logs capturing execution details, Windows Event Logs related to PowerShell, and potentially logs from endpoint detection platforms that monitor command executions.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine logs for PowerShell executions that include any of the suspicious parameters outlined in the detection logic. Pay close attention to commands executed with `-nop`, `-w`, or that utilize Base64 encoded content.

  - **Analyze Registry Modifications:** Check for registry changes, particularly within the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` key. Investigate any entries that reflect unauthorized persistence mechanisms employing PowerShell.

  - **Assess Network Requests:** If a PowerShell command attempts to download a script from the internet (e.g., using `System.Net.WebClient`), verify the source URL and ensure it is recognized as safe. Look for potential links to known malicious domains.

  - **Validate Against Known Tools:** Cross-reference the detected PowerShell commands and behaviors against indicators of compromise (IOCs) for known threat actors or malware, particularly those associated with PowerShell scripting exploits.

  ### Prioritization
  This alert is classified as high severity due to the potential threat actors' objectives, which often include significant impacts like data exfiltration or sustained access to the organization's environment. The likelihood of such PowerShell commands being used for malicious purposes is high, particularly in enterprise settings where PowerShell is widely employed.

  ### Blind Spots and Assumptions
  There may be gaps in detection if PowerShell logging is not comprehensively enabled or configured to capture all relevant events. The detection logic assumes that commands utilizing suspicious parameters are indicative of malicious intent, which may not always hold true in legitimate administrative tasks. Additionally, the rule relies on the availability of PowerShell logs and may not function effectively if logging is disabled or improperly managed.

