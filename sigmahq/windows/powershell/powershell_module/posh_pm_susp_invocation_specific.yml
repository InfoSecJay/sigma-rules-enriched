  ---

  ### Technical Context

  This rule detects suspicious PowerShell invocations that utilize specific command parameters associated with obfuscated and potentially malicious activities. Attackers often use such parameters to execute covert commands, download scripts, or establish persistence via PowerShell, with the objective of evading detection and maintaining access to compromised systems. The relevant MITRE ATT&CK techniques include "Command and Scripting Interpreter: Windows PowerShell" (T1059.001).

  The primary telemetry sources include Windows security logs and PowerShell transcript logs, focusing on PowerShell command execution details. If malicious, such behavior could lead to data exfiltration, unauthorized access, or system compromise. This detection does NOT confirm that the user executing the command is malicious; it merely indicates that suspicious PowerShell usage has been observed.

  ---

  ### Investigation Steps

  - **Review PowerShell Command Logs**: Examine logs for any PowerShell command execution (Event ID 4104 - PowerShell Script Block Logging) containing suspicious parameters (e.g., '-nop', '-c', 'iex') that are typical of obfuscation efforts.

  - **Examine ContextInfo Field**: Focus on the `ContextInfo` field for calls featuring `New-Object System.Net.WebClient` or .Download operations, which are commonly seen in malicious PowerShell scripts aimed at downloading additional payloads.

  - **Identify Legitimate Use Cases**: Analyze recent PowerShell activity in conjunction with user or system roles. Legitimate commands may include parameters without obfuscation, while commands run by non-admin users targeting system-wide registry keys should be viewed with heightened suspicion.

  - **Check for Scheduled Tasks or Auto-Run Entries**: Look for registry modifications in `\software\microsoft\windows\currentversion\run` or similar paths (Event ID 4657), which indicate attempts to establish persistence via PowerShell scripts.

  - **Correlate with Other Alerts**: Cross-reference this alert with other related detections (e.g., similar PowerShell command executions) to assess the overall risk context. Multiple alerts in a short timeframe may represent coordinated malicious activity.

  - **Assess Recent Network Activity**: Gather logs from your firewall or proxy to identify any outbound connections initiated by PowerShell that may relate to the commands detected (e.g., connections to known malicious domains, capture logs for any `.Download` calls).

  ---

  ### Prioritization

  This alert carries high severity due to the potential for significant impacts on system integrity and data security if executed successfully. The use of obfuscated PowerShell commands is a common tactic employed by threat actors, making it imperative to triage promptly to prevent escalation or further compromise.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded through techniques that rely on legitimate PowerShell commands or by disabling script block logging. Reliable detection requires enabling PowerShell transcription and monitoring essential logs like Event 4104. Additionally, benign actions may trigger the alert during legitimate script usage for software installations or updates. A related detection for general PowerShell invocation may enhance the overall monitoring of suspicious script execution.

