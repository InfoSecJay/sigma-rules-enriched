note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell invocation parameters that indicate potential malicious activity, such as command execution with obfuscation techniques. Common parameters observed often relate to invoking hidden windows, using base64 encoded payloads, or employing the `Invoke-Expression` and `New-Object` Cmdlets to execute arbitrary commands and download files. The likely objective of an attacker leveraging these methods is either to maintain persistence via autorun registry keys or to facilitate lateral movement and execution of additional payloads.

  This behavior maps to the MITRE ATT&CK tactic of Execution (TA0002), particularly technique T1059.001, which focuses on command-line interfaces like PowerShell. Key telemetry sources include Windows Security Event ID 4688 for process creation and Sysmon Event ID 1 for detailed process creation logs. If malicious, the impact could compromise system integrity, escalate privileges, or lead to the establishment of a backdoor.

  It is essential to note that while these detections indicate suspicious activities, they do not confirm malicious intent without additional context or evidence of compromise.

  ### Investigation Steps

  - **Review PowerShell command parameters:** Examine the process command line from Event ID 4688 (Windows Security) or Sysmon Event ID 1 for the presence of flags such as `-nop`, `-w`, `-hidden`, `-c`, or encoded content. Legitimate PowerShell commands do not commonly include these flags in the same context.

  - **Check for base64 encoded strings:** Look specifically for base64 content in the command line arguments (represented by `Convert]::FromBase64String`) in Sysmon logs to identify potential hidden payloads. Any use of base64 encoding outside normal administrative tasks should raise suspicion.

  - **Inspect registry modifications:** Query for registry changes associated with PowerShell commands to check for modifications under paths like `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Valid modifications are generally performed by known administrative tools rather than unknown executables or scripts.

  - **Identify high-confidence malicious indicators:** Confirm the presence of red flags such as `iex`, `New-Object System.Net.WebClient`, and `.DownloadString` indicating attempts to download scripts from the internet. The combination of these flags generally correlates with hostile activity.

  - **Analyze host behavior patterns:** Review the history of process creations and command invocations on the affected host for unusual spikes or patterns, particularly around the time of the alert. Normal user behavior should have identifiable activity within typical operational parameters.

  - **Investigate file download and execution:** Look for any related files indicated in the PowerShell execution command, especially those downloaded via web requests (e.g., logs indicating `InternetOpenUrl` or download completion). Validate against file hashes to check for known malicious signatures.

  ### Prioritization

  This alert is high priority due to its association with critical system commands and the potential for exploitation. If the behavior is confirmed as malicious, the impact on the system could be severe, leading to data exfiltration or denial of service. The methods noted in this rule are frequently weaponized in cyber attacks, warranting immediate attention.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of comprehensive logging configurations or PowerShell Transcription Logging, which can mask legitimate administrative activities mimicking malicious behaviors. Furthermore, commands executed via interactive sessions might not trigger alerts if not logged properly. Legitimate scripts utilizing similar patterns for automation or maintenance may inadvertently trigger this alert. A companion detection to enhance coverage would involve monitoring for typical lateral movement techniques or artifacts from known exploit kits.

