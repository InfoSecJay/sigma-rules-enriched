note: |
  ### Technical Context

  This rule detects suspicious command-line parameters used in PowerShell invocations that may indicate an attempt to obfuscate malicious activity. Commonly employed by adversaries, these behaviors often aim to execute payloads with the use of encoded commands, invoke hidden windows, or leverage system utilities in a stealthy manner. The relevant MITRE ATT&CK technique is Execution (T1059.001): PowerShell.

  Primary telemetry sources for this detection include PowerShell module logs, specifically those capturing context information regarding command executions. If malicious, this activity could lead to unauthorized code execution, privilege escalation, or persistence on compromised systems. However, this detection alone does not confirm malicious intent; further investigation is needed to establish the context of the invocation.

  ### Investigation Steps

  - **Review PowerShell command parameters:** Assess telemetry from PowerShell logs (Event ID 4104) and focus on commands containing `-nop`, `-hidden`, `-c`, or `-Enc`. Benign PowerShell commands typically do not use such obfuscation techniques.

  - **Analyze process details:** Check the parent process ID (PPID) in Event ID 4688 and any associated logs for typical benign parent processes (e.g., Explorer.exe) versus suspicious ones (e.g., cmd.exe or other scripting environments).

  - **Identify network connections:** Examine outbound network activity in Windows Firewall logs (Event ID 5156) for connections initiated by PowerShell processes that contain suspicious download URLs or endpoints, particularly those with ‘download’ in the command.

  - **Correlate with historical data:** Investigate the source user account responsible for the invocation using Security Event ID 4624 (successful logon). Regular administrative users engaging in legitimate PowerShell usage may indicate benign activity when compared against patterns of illicit data access.

  - **Examine registry modifications:** Look for registry changes linked to PowerShell invocations (Event ID 4657) that adjust startup configurations, such as adding entries in `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`, which may indicate persistence mechanisms.

  - **Verify associated files:** Check for the presence of temporary files or downloadable scripts generated by PowerShell execution. The existence of files created in unusual locations (e.g., `%TEMP%`) or with obfuscated naming can serve as high-confidence indicators of malicious activity.

  ### Prioritization

  This alert warrants high priority due to its potential impact on critical systems, especially if PowerShell is leveraged for malicious execution or lateral movement. The techniques detected are known to be weaponized by various threat actors, increasing the likelihood of malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive PowerShell logging, as certain benign scripts might utilize similar obfuscation techniques seen in the rule's parameters. Legitimacy may be questioned when authorized administrative users perform tasks that closely mirror the suspicious parameters. A companion detection rule focusing on external network connections established via PowerShell would enhance coverage by correlating suspicious activity across different telemetry sources.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
