title: Renamed Powershell Under Powershell Channel
id: 30a8cb77-8eb3-4cfb-8e79-ad457c5a4592
status: test
description: |
  Detects a renamed Powershell execution, which is a common technique used to circumvent security controls and bypass detection logic that's dependent on process names and process paths.
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
author: Harish Segar, frack113
date: 2020-06-29
modified: 2025-01-20
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1036.003
logsource:
  product: windows
  category: ps_classic_start
detection:
  selection:
    Data|contains: 'HostName=ConsoleHost'
    # Note: Powershell Logging Data is localized. Meaning that "HostApplication" field will be translated to a different field on a non english layout. This rule doesn't take this into account due to the sheer amount of possibilities. It's up to the user to add these cases.
  filter_main_ps:
    Data|contains:
    - 'HostApplication=powershell'
    - 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
    - 'HostApplication=C:\\\\WINDOWS\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
  filter_main_host_application_null:
        # Note: Since we're using the raw data field to match. There is no easy way to filter out cases where the "HostApplication" field is null (i.e doesn't exist). We're practically forced to use a regex.
        # If you're already mapping and extracting the field, then obviously use that directly.
    Data|re: 'HostId=[a-zA-Z0-9-]{36}\s+EngineVersion='
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This detection rule identifies instances where PowerShell is invoked with a renamed or altered name, a tactic often employed by attackers to evade detection mechanisms that rely on the standard naming of processes. The likely attacker objective is to execute malicious PowerShell scripts while bypassing security measures that might flag typical PowerShell execution. This behavior corresponds to the MITRE ATT&CK techniques of Execution: PowerShell (T1059.001) and Stealth: Masquerading (T1036.003). The primary telemetry source for this detection is Windows PowerShell event logs, particularly focusing on the "ps_classic_start" category. Malicious activity leveraging this technique can lead to unauthorized access, data exfiltration, and system compromise. It is crucial to note that this detection does NOT confirm that the activity is inherently malicious without further contextual investigation.

  ### Investigation Steps

  - **Verify the PowerShell invocation context:** Check for Event ID 4104 in the Windows Event Logs for PowerShell-related scripts. Analyze the script content to identify any malicious intentions; legitimate use typically involves administrative scripting or automation tasks.

  - **Examine the Process Name:** Look for discrepancies in the process name as seen in Event ID 4688 (Process Creation). Malicious activities often feature PowerShell execution with unconventional process names or paths that deviate from standard patterns.

  - **Check for Command Line Arguments:** Review command line arguments associated with the PowerShell process in Sysmon Event ID 1 or Windows Event ID 4688. Malicious command lines might be obfuscated or include suspicious parameters indicating exploit attempts.

  - **Identify User Behavior:** Investigate the user or account invoking the PowerShell script. Patterns indicating legitimate administrative actions—such as scheduled tasks or known automation scripts—should be noted. Anomalous execution by non-administrative accounts could indicate attempted exploitation.

  - **Assess for Host Context:** Determine the role of the host where the alert was triggered. Critical assets such as domain controllers or application servers need immediate attention, as compromise could result in widespread impact.

  - **Correlate with External Threat Intelligence:** Cross-reference the hash values or scripts identified with threat intelligence platforms to see if they are associated with known malicious activity or campaigns.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on critical systems if a malicious actor gains access. The likelihood of abuse is significant, as the evasion of standard detection mechanisms signifies intent. This behavior is becoming increasingly weaponized by adversaries seeking to circumvent traditional security measures.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of adequate logging configurations; if PowerShell logging is disabled or improperly configured, legitimate activities may evade detection. Evasion techniques may include standard PowerShell execution without renaming or the use of non-standard hosts where monitoring is insufficient. Additionally, benign activities such as automation workflows using renamed PowerShell instances may trigger the alert. A related detection that can augment coverage is monitoring for unusual network connections initiated by PowerShell, providing insight into potential exfiltration or command and control activities.

