title: Renamed Powershell Under Powershell Channel
id: 30a8cb77-8eb3-4cfb-8e79-ad457c5a4592
status: test
description: |
  Detects a renamed Powershell execution, which is a common technique used to circumvent security controls and bypass detection logic that's dependent on process names and process paths.
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
author: Harish Segar, frack113
date: 2020-06-29
modified: 2025-01-20
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.001
- attack.t1036.003
logsource:
  product: windows
  category: ps_classic_start
detection:
  selection:
    Data|contains: 'HostName=ConsoleHost'
    # Note: Powershell Logging Data is localized. Meaning that "HostApplication" field will be translated to a different field on a non english layout. This rule doesn't take this into account due to the sheer amount of possibilities. It's up to the user to add these cases.
  filter_main_ps:
    Data|contains:
    - 'HostApplication=powershell'
    - 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
    - 'HostApplication=C:\\\\WINDOWS\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
  filter_main_host_application_null:
        # Note: Since we're using the raw data field to match. There is no easy way to filter out cases where the "HostApplication" field is null (i.e doesn't exist). We're practically forced to use a regex.
        # If you're already mapping and extracting the field, then obviously use that directly.
    Data|re: 'HostId=[a-zA-Z0-9-]{36}\s+EngineVersion='
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects instances where PowerShell is executed under a renamed executable. Attackers may use this technique to evade detection mechanisms that filter on process names and paths, ultimately facilitating malicious activities like command execution, payload delivery, or lateral movement. This behavior falls under the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Command and Scripting Interpreter: Windows PowerShell" (T1059.001) as well as "Masquerading" (T1036.003).

  The primary telemetry source for this detection is PowerShell's classic start logs, specifically looking for log entries containing 'HostName=ConsoleHost' and variations in the 'HostApplication' field indicating renamed execution paths. If malicious, this behavior could indicate an adversary attempting to execute scripts or commands undetected. However, this detection alone does not confirm malicious intent or activity; further context is necessary to evaluate the legitimacy of the action.

  ### Investigation Steps

  - **Inspect the PowerShell execution details:** Review the relevant PowerShell classic start logs. Look for Event IDs that contain 'HostName=ConsoleHost' and 'HostApplication' fields indicating renamed executables. Check for variations in filenames or paths that are atypical for your environment.

  - **Identify legitimate PowerShell usage:** Compare the identified execution against known legitimate scripts and operations executed within the environment. Document verified scripts that commonly run under PowerShell, including any automation or administrative tasks scheduled.

  - **Analyze command history:** If available, investigate the command history through Event ID 4104 (PowerShell script block logging) or equivalent logging solutions. Look for commands preceding the renamed executable execution that may indicate malicious intent.

  - **Correlate with additional telemetry:** Validate whether the renamed PowerShell execution aligns with suspicious network activity or significant system changes. For example, check for Windows Event ID 4688 (Process Creation) to find associated command line arguments, or any indicators of lateral movement attempts (e.g., RDP connections).

  - **Check for high-confidence malicious indicators:** Look for established IOCs such as known malicious PowerShell command lines or common parameters used in past incidents. Monitor for unusual access patterns on sensitive systems or elevated privileges that deviated from standard user behavior.

  ### Prioritization

  The alert severity is low, as renamed PowerShell executions may indicate benign administrative activities; however, there is a risk of abuse by adversaries who often use PowerShell to execute malicious code. While this behavior is not uncommon, especially in automation scripts, it should be treated with caution and investigated to rule out any malicious intent.

  ### Blind Spots and Assumptions

  The detection may miss certain evasion techniques like altered file signatures or obfuscated scripts that don't utilize standard PowerShell execution pathways. Reliable detection relies on having comprehensive PowerShell logging enabled across systems, including detailed logging configurations. Additionally, legitimate activities such as automation tasks or script executions from trusted third-party applications may trigger this alert. A related detection rule for monitoring for malicious PowerShell command patterns (e.g., suspicious cmdlets or modules) could strengthen overall coverage.

