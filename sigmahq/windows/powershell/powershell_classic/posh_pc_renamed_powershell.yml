title: Renamed Powershell Under Powershell Channel
id: 30a8cb77-8eb3-4cfb-8e79-ad457c5a4592
status: test
description: |
  Detects a renamed Powershell execution, which is a common technique used to circumvent security controls and bypass detection logic that's dependent on process names and process paths.
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
author: Harish Segar, frack113
date: 2020-06-29
modified: 2025-01-20
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.001
- attack.t1036.003
logsource:
  product: windows
  category: ps_classic_start
detection:
  selection:
    Data|contains: 'HostName=ConsoleHost'
    # Note: Powershell Logging Data is localized. Meaning that "HostApplication" field will be translated to a different field on a non english layout. This rule doesn't take this into account due to the sheer amount of possibilities. It's up to the user to add these cases.
  filter_main_ps:
    Data|contains:
    - 'HostApplication=powershell'
    - 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
    - 'HostApplication=C:\\\\WINDOWS\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe'
  filter_main_host_application_null:
        # Note: Since we're using the raw data field to match. There is no easy way to filter out cases where the "HostApplication" field is null (i.e doesn't exist). We're practically forced to use a regex.
        # If you're already mapping and extracting the field, then obviously use that directly.
    Data|re: 'HostId=[a-zA-Z0-9-]{36}\s+EngineVersion='
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell scripts that have been renamed, a tactic commonly employed by attackers to evade detection mechanisms reliant on traditional process names and paths. Attackers may use this method to run malicious scripts with names that disguise their intent or blend in with legitimate system processes. The ability to execute PowerShell under a different name can help avoid detection by security tools that monitor specific executable names or paths, facilitating a broader exploitation strategy.

  In this context, an attacker may aim to leverage PowerShell's powerful scripting capabilities for various attack objectives such as executing payloads, establishing persistence, or exfiltrating data from the environment. This behavior falls under the MITRE ATT&CK framework techniques, specifically **Execution: PowerShell (T1059.001)** and **Defense Evasion: Masquerading (T1036.003)**. The primary data source for this rule includes logs from the PowerShell Classic Start event within Windows.

  ### Investigation Steps
  - **Review Process Execution Logs**: Analyze PowerShell execution logs focusing on instances where the `HostApplication` field indicates renaming has occurred. Look for discrepancies or unusual naming patterns that do not correspond to standard PowerShell operations.

  - **Examine PowerShell Script Block Logging**: Collect and analyze PowerShell script block logs, which may give insight into what scripts were run despite potentially masked by renamed instances, allowing you to trace the execution back to suspicious activities.

  - **Correlate with Network Activity**: Investigate network traffic logs to find any connections initiated by the renamed PowerShell process to external addresses, especially if these addresses are not typically associated with internal administrative tools.

  - **Cross-Reference User Behavior**: Compare the timestamps and context of the PowerShell executions against user behavior logs in order to identify any anomalies or patterns consistent with unauthorized access or operation.

  ### Prioritization
  The alert is deemed low priority as renamed PowerShell executions can occur legitimately, particularly by administrators or automated systems. However, continued monitoring is vital in the enterprise environment due to the likelihood of these tactics being used by adversaries to bypass security measures.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots in cases where logs are not properly configured to capture necessary PowerShell execution contexts or if PowerShell logging is disabled. There is an assumption that the detection environment can adequately extract and interpret fields from PowerShell logs, which may vary based on localization or OS configurations. Additionally, if the activity is done from a non-standard host or remote systems without proper logging, detection may be compromised. Ensuring comprehensive logging and monitoring practices is essential for the effective functioning of this alert.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
