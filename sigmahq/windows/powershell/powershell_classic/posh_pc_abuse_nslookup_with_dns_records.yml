note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell to execute a download cradle via `nslookup`, which may indicate an attacker attempting to retrieve malicious payloads from DNS records. The likely objective of the attacker is to execute arbitrary code on the target system without triggering traditional security controls. This behavior aligns with the MITRE ATT&CK technique of "Command and Scripting Interpreter: Windows PowerShell" (T1059.001).

  The primary telemetry sources for this detection are Windows' PowerShell logs and classic event logs that specifically capture PowerShell execution (`ps_classic_start`). If this behavior is malicious, it could lead to unauthorized execution of code or the installation of malware on the system. Importantly, this detection alone does not confirm that the payload has been successfully downloaded or executed.

  ### Investigation Steps

  - **Review PowerShell command execution logs**: Verify PowerShell command history in Event ID 4104 for entries containing `nslookup` and any associated query type parameters, confirming the command syntax aligns with the detection.

  - **Check DNS query logs**: Inspect internal DNS server logs for high-frequency `TXT` record queries from the IP address of the host running PowerShell. Unusual or excessive queries are indicative of potential abuse.

  - **Analyze process creation events**: Look for correlated Security Event ID 4688 or Sysmon Event ID 1 showing PowerShell processes starting with characteristics matching the `nslookup` command, paying attention to parent processes which should typically be `powershell.exe` or system tools.

  - **Identify legitimate behavior**: Validate expected use cases for PowerShell on the affected host—such as system administration or scripting tasks—by checking for recent, normal PowerShell usage patterns around the same timeframe.

  - **Correlate with known benign sources**: If the nslookup queries originate from known and trusted domains for valid internal applications, this may indicate benign behavior contrary to malicious intentions.

  - **Assess for malicious payload artifacts**: If payload download was confirmed, check for unusual files created in temporary directories or suspicious executables in the Downloads folder that could indicate successful exploitation.

  ### Prioritization

  This alert should be regarded as medium severity due to the potential impact on affected systems, especially if the host has a critical function or sensitive data. The likelihood of this technique being weaponized is moderate, as attackers frequently exploit PowerShell to bypass security defenses.

  ### Blind Spots and Assumptions

  Limitations exist in detecting obfuscated or encoded commands that may evade PowerShell logging if not properly configured. Additionally, if the environment does not log DNS queries or if DNS over HTTPS is utilized without visibility, detection capabilities are diminished. Legitimate administrative activity, particularly legitimate use of PowerShell in testing or routine maintenance, may also trigger this alert. A related detection for suspicious DNS lookups or other PowerShell command patterns can provide better coverage of potential adversarial activity.

