note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell to perform a "download cradle" via the `nslookup` command. A download cradle is a technique used by adversaries to retrieve malicious payloads or commands from remote locations, such as DNS records, rather than directly from a web server. Attackers may employ this method to evade typical network defenses and conduct malware delivery through DNS, which is more challenging to monitor and filter.

  The likely attack scenario is typical of command and control (C2) frameworks where adversaries seek to maintain persistence or execute further tasks within a compromised environment. This technique falls within the MITRE ATT&CK framework under the tactic of Execution, specifically technique T1059.001, which pertains to the use of command-line interfaces to carry out malicious activities.

  To effectively detect this behavior, telemetry sources such as PowerShell execution logs and process creation events are vital, as they provide direct evidence of the command's execution and parameters used.

  ### Investigation Steps
  - **Review PowerShell Execution Logs:** Look for instances of PowerShell invoking `nslookup` with parameters suggesting retrieval of DNS records, specifically those containing text records (`-q=txt`) and targeting HTTP payload delivery.

  - **Analyze Process Creation Events:** Identify and examine the processes spawned from the PowerShell command. Check for any unusual parent-child process relationships indicating potential malicious intent in the execution chain.

  - **Inspect DNS Query Logs:** Check for DNS requests for unusual domains or unexpected TXT record responses, which could indicate that the system is querying known malicious infrastructure or retrieving payloads.

  - **Correlate with Other Security Alerts:** Cross-reference findings with alerts from EDR or SIEM solutions to determine if there is additional suspicious behavior occurring on the same endpoints, providing a broader context to the PowerShell execution.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for significant impact if a malicious payload is successfully downloaded and executed. The likelihood of threat actors using such techniques in targeted attacks necessitates prompt investigation to prevent possible data breaches or environment compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell logging is not properly configured, which might lead to missing critical data associated with legitimate usage of the `nslookup` command. This rule assumes that the environment has not configured policies to restrict the use of such techniques and relies on detailed process auditing enabled in the PowerShell execution policy. Furthermore, if the command is executed with obfuscation or altered in a way that circumvents the defined detection logic (e.g., through encoding), it may evade detection entirely. Required logs include comprehensive PowerShell logs and DNS query logs, which must be adequately collected and retained for effective monitoring.

