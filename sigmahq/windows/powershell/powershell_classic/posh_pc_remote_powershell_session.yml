note: |
  ### Technical Context

  This Sigma rule detects instances of remote PowerShell session initiation, specifically those involving the `wsmprovhost.exe` process, which is a core component for Windows Management Instrumentation (WMI). The behavior indicates possible lateral movement or remote management by an adversary who may be attempting to execute commands on a remote host without proper authorization. This detection is relevant to the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Command and Scripting Interpreter: Windows PowerShell" (T1059.001) as well as "Lateral Movement" (TA0008) under "Remote Services" (T1021.006).

  The primary telemetry source is Windows event logging specifically looking for events related to PowerShell's classic remoting feature. The detection indicates potential malicious activity, especially in environments not employing PowerShell for legitimate purposes, as it may reflect unauthorized administrative access or malicious script execution. Importantly, this detection does NOT confirm that the session is maliciously intended on its own; legitimate administrative use of PowerShell may similarly trigger the same alert.

  ### Investigation Steps

  - **Evaluate the initiating process:** Check for process creation logs (Sysmon Event ID 1 or Windows Event ID 4688) to confirm that `wsmprovhost.exe` initiated the remote session. Malicious activity typically shows unusual parent processes or unexpected command lines.

  - **Review remote session connections:** Collect Windows Event ID 4648 (Logon Attempt using explicit credentials) and correlate it with the remote session events. Look for atypical user accounts connecting to sensitive systems that are not aligned with established user behavior.

  - **Identify command execution:** Analyze PowerShell command logs (Event ID 4104) related to the session. Look for execution of suspicious commands, particularly those not used in the normal administrative workload.

  - **Benchmark normal operations:** List legitimate activities performed via remote PowerShell within your organization (e.g., scheduled tasks, system updates) to compare against the identified behavior. Confirm the expected executing users and hosts align with established baselines.

  - **Examine network activity:** Assess the firewall logs and network connection events for outbound traffic from `wsmprovhost.exe`. Focus on unusual destination IPs or protocols that deviate from typical administrative workflows.

  - **Cross-reference with related detections:** Monitor for correlating alerts related to abnormal login times or failed login attempts (Windows Event IDs 4625 and 4624) to strengthen the suspicion of potential malicious activity.

  ### Prioritization

  This alert has a moderate severity in an enterprise context due to the criticality of affected systems, where unauthorized remote access can lead to data compromise or lateral movement within the network. The likelihood of abuse is notable, especially in environments where PowerShell remoting is not routine, increasing the risk of exploitation by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative activities, which can trigger the same alert. Requires proper log source configuration, including enabling detailed PowerShell logging and ensuring all relevant remoting activities are captured. The alert may also be triggered by benign scripted automation tasks that utilize remote PowerShell for system maintenance, making it essential to establish baseline behaviors. A related detection to enhance monitoring could involve tracking unusual scheduled tasks (Scheduled Task Event ID 4698) or group policy changes that utilize remote management practices.

