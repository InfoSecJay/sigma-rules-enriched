note: |
  ### Technical Context
  This detection rule identifies remote PowerShell sessions initiated from Windows environments, particularly monitoring for suspicious instances of `wsmprovhost.exe` being leveraged for remote execution. Attackers often use such methods to gain persistence, conduct lateral movement, or execute commands on remote systems without raising immediate red flags. The rule is critical for detecting potential misuse of PowerShell remoting capabilities against an enterprise's infrastructure, especially if an attacker seeks to manipulate sensitive data or settings on compromised hosts.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically the technique **PowerShell (T1059.001)**, and **Lateral Movement** (TA0008) through the technique **Remote Services: PowerShell Remoting (T1021.006)**. It is important to monitor these actions closely as they can be indicative of exploitation attempts or ongoing compromise.

  Primary data sources for this detection include logs related to PowerShell command executions, Windows event logs concerning process creation for PowerShell and `wsmprovhost.exe`, and potentially network traffic analytics if remote sessions are established over unencrypted channels.

  ### Investigation Steps
  - **Review PowerShell Execution Logs**: Analyze PowerShell logs for any remote session commands, especially focusing on the source host and the commands executed, to identify any unusual or unauthorized behavior.
  - **Inspect Process Creation Events**: Look into event logs for `wsmprovhost.exe` creation events to determine the context of its execution and identify any unusual parent processes that may indicate malicious activity.
  - **Analyze Network Connections**: Utilize Firewall logs or EDR telemetry to inspect outbound connections from the identified host. Look for anomalies such as connections to unusual IP addresses or excessive connections to remote systems.
  - **Correlate with User Activity**: Cross-reference the activities with user logon events to identify potential mismatches or unauthorized user behavior, particularly from accounts with elevated privileges or from unexpected locations.

  ### Prioritization
  This alert is rated as low severity due to the potential for legitimate administrative use of remote PowerShell sessions. However, environments with limited use of PowerShell remoting should consider elevating the alert's severity, as the likelihood of malicious activity in those contexts is higher.

  ### Blind Spots and Assumptions
  One major gap in detection coverage involves the potential for legitimate remote PowerShell sessions that are necessary for operational tasks, which may lead to false positives. The detection logic assumes that any execution of `wsmprovhost.exe` tied to remote connections is potentially malicious; thus, analysts must possess a solid context of normal operations. Required logs for effective detection include comprehensive event logging for PowerShell activities and sufficient configurations to capture related network activity and process creation details.

