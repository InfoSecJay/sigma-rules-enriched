note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module that defines the function `Get-VMRemoteFXPhysicalVideoAdapter`. This behavior is suspicious as it correlates with potential abuse of the `RemoteFXvGPUDisablement.exe` binary, which has a known vulnerability related to module load-order hijacking. The likely attacker objective is to leverage this vulnerability to execute arbitrary commands within a compromised environment, potentially leading to system exploitation or lateral movement.

  The relevant MITRE ATT&CK technique for this detection is **T1218 - Signed Binary Proxy Execution**, which describes methods used by attackers to execute malicious payloads while attempting to evade detection. Primary telemetry sources include PowerShell logs (specifically from Service: `powershell-classic`), which capture the execution and definition of PowerShell modules. If malicious, this activity could lead to an escalation of privileges or unauthorized access to system resources. Importantly, this detection does not confirm actual exploitation on its own; it only indicates that suspicious module behavior has occurred.

  ### Investigation Steps

  - **Analyze PowerShell Command Logs:** Review PowerShell command logs (Event ID 4104) for the presence of the command string indicating module creation. Check for abnormal or unexpected execution contexts, such as running on critical servers or out-of-hours activity.

  - **Identify Related Module Context:** Look into the modules loaded within the PowerShell session using the command `Get-Module`. Confirm if the suspicious module appears in contexts atypical for legitimate workflows, e.g., on servers not associated with virtualization tasks.

  - **Check for Anomalous Process Creation:** Investigate process creation events (Security Event ID 4688) to confirm if `RemoteFXvGPUDisablement.exe` or related processes are spawned shortly after the module's creation. This could indicate exploitation attempts.

  - **Review Event Logs for Similar Patterns:** Examine the Windows Event Logs for Event IDs related to application control (e.g., Event ID 3000 for AppLocker) that could indicate attempts at bypassing security controls through this PowerShell module.

  - **Correlate User Behavior:** Validate the user account related to the activity to determine if it represents expected behavior (e.g., a system admin performing legitimate maintenance). Deviation from routine patterns should raise suspicion.

  ### Prioritization

  This alert should be treated with high severity. The affected systems potentially include virtualization hosts, which are critical for business operations. The likelihood of malicious abuse is significant, as techniques involving module hijacking are commonly utilized by adversaries to gain control over environments. Given that RemoteFX is associated with virtualization, which contains valuable assets, attackers actively pursue such vectors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions that might inadvertently trigger the alert when valid PowerShell modules are created. Reliable detection requires proper configurations and comprehensive logging of PowerShell activities. The context of legitimate administrative tasks, such as system updates or configurations, may overlap with this behavior, making it challenging to discern. A related detection that enhances coverage would focus on monitoring for direct invocations of `RemoteFXvGPUDisablement.exe` or any subsequent use of its associated functions, thereby providing additional context to the alert.

