note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module that includes the function `Get-VMRemoteFXPhysicalVideoAdapter`, which can indicate potential abuse of the `RemoteFXvGPUDisablement.exe` binary. An attacker may attempt to leverage this vulnerability for privilege escalation or to run malicious code in the context of a compromised system. The relevant MITRE ATT&CK tactic is Defense Evasion (T1218), specifically under the technique for Signed Binary Proxy Execution.

  The primary telemetry source for this alert will be Windows PowerShell logs, particularly focusing on the command execution logs that capture module creation events. If this activity is malicious, it could lead to unauthorized execution of code, potentially compromising the integrity of the affected system. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger the same events.

  ### Investigation Steps

  - **Review PowerShell logs**: Check Security Event ID 4104 for completed PowerShell scripts. Look for the creation of the specific module and extract the command that triggered it, focusing on `RemoteFXvGPUDisablement.exe` execution.

  - **Verify process lineage**: Cross-reference with Event ID 4688 to determine if `RemoteFXvGPUDisablement.exe` was spawned by a suspicious process. Investigate its parent process for any indications of lateral movement.

  - **Assess module contents**: If the triggering module contains any references to system functions or external scripts beyond the expected, such as obfuscated logic or unusual API calls, mark these for deeper review.

  - **Identify legitimate usage**: Confirm if the environment typically utilizes `RemoteFXvGPUDisablement.exe` for its intended purpose, such as in virtual environments where GPU resources are managed. Document any known legitimate use cases.

  - **Look for exfiltration artifacts**: Validate if additional artifacts like `.log` files or temporary files were created during execution. Use tools like Sysinternals’ Process Monitor to see file system activity during the alert timeframe.

  - **Correlation with similar detections**: Cross-reference with related Sigma rules such as those for Process Creation (ProcCreation), PowerShell Module usage, and PowerShell ScriptBlock logging to identify additional suspicious behaviors.

  ### Prioritization

  This alert is of high severity because it may indicate an attacker's attempt to bypass security mechanisms using a known vulnerability. The potential impact is significant, particularly on critical systems utilizing RemoteFX for GPU virtualization. The likelihood of exploitation is raised due to active campaigns targeting similar weaknesses.

  ### Blind Spots and Assumptions

  Detection could be circumvented by attackers using alternative command structures or legitimate processes that do not engage this specific module creation pattern. Reliable detection requires that PowerShell logging is fully enabled, as incomplete logs may obscure malicious activity. Legitimate administrative tasks utilizing this binary may also trigger alerts, thus necessitating careful contextual analysis. A companion detection of PowerShell script block logging (T1059.001) could strengthen coverage against evasions.

