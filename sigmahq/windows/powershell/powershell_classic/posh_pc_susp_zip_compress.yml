logsource:
  product: windows
  service: powershell-classic
detection:
  selection:
    Data|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts utilizing the "Compress-Archive" cmdlet, specifically targeting files and folders located in temporary directories commonly associated with malware behavior. The primary objective of an attacker may be to compress sensitive files prior to exfiltration to reduce total data size and facilitate transport. This activity is associated with the MITRE ATT&CK technique "Archive Collected Data" (T1074.001), which falls under the Collection tactic.

  The primary telemetry sources include Windows PowerShell logs, which can be found in Event ID 4104 for script block logging or SYSLOG outputs in more comprehensive monitoring solutions. If malicious, this behavior may indicate a preparatory step for data exfiltration. Importantly, this detection does NOT confirm that exfiltration has occurred on its own; it only indicates potential preparatory activity.

  ### Investigation Steps

  - **Check PowerShell Execution Logs:** Review Event ID 4104 logs to retrieve the command line used, especially noting parameters like `-Path` and `-DestinationPath` to verify if they align with the alert criteria. Expected benign behavior typically includes well-known paths for legitimate administrative tasks rather than suspicious temp paths.

  - **Correlate with Other Activities:** Look for related suspicious activities around the same timestamp in security logs, such as Event ID 4688 for new process creations, particularly those invoking PowerShell. Cross-reference with legitimate applications to establish context.

  - **Identify High-Risk File Compression:** Search for compressed files in the `%TEMP%` or `C:\Windows\Temp` directories. Files with extensions like `.zip` created in these locations in conjunction with the alert indicate a high-risk scenario.

  - **Analyze User Context:** Determine if the user account executing the command has a legitimate need for compressing files. Look for anomalies in user behavior or if the account has recently shown signs of compromise.

  - **Validate File Transfers:** If the environment logs file creation activities, check for subsequent data transfers or uploads originating from the `%TEMP%` directory. Indicators of exfiltration like unusual outbound network connections can heighten suspicion.

  ### Prioritization

  This alert holds medium severity due to its potential implications for sensitive data being prepared for exfiltration. The risk escalates if the affected system harbors critical information that could be leveraged for further attacks. While not every instance of folder compression is malicious, the patterns typically observed are often leveraged by threat actors.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited if PowerShell logging is not configured accurately, particularly if script block logging is disabled. Legitimate administrative tools or tasks might misuse similar compression commands, creating false positives. A helpful companion detection would include monitoring for file transfers or suspicious outbound connections following this alert to provide broader context for validation.

