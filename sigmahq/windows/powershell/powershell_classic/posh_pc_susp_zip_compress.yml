logsource:
  product: windows
  service: powershell-classic
detection:
  selection:
    Data|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of PowerShell's `Compress-Archive` cmdlet to compress files and folders, specifically when the output is directed to locations commonly associated with data exfiltration, such as temporary directories. Attackers often employ this technique to package sensitive data (like documents or credentials) before transferring it out of the network, which makes the data easier to manage and reduces the load during exfiltration.

  The primary motivation for utilizing this method is to enable data theft while attempting to evade detection, as unusual file compressions in temporary folders may not readily attract attention in vast amounts of legitimate user activity. This technique is linked to the MITRE ATT&CK framework under the tactic of Collection, specifically technique T1074.001 (Data from Local System).

  The main data sources that will provide evidence for this detection include PowerShell command execution logs, particularly those that show script executions and the invocation of cmdlets. Additional logs, such as file system activity logs, can also aid in identifying suspicious file creations in the TEMP directory.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell execution logs to identify instances of the `Compress-Archive` cmdlet being invoked, focusing on the command structure and the parameters being used.
  - **Inspect TEMP Directory:** Investigate the contents of the TEMP directories (e.g., `$env:TEMP` and `\Windows\Temp\`) for unusually large or numerous compressed files that were recently created, as they may contain sensitive data.
  - **Cross-Reference with User Activity:** Correlate the timestamps of the PowerShell commands with user logon/logoff events to determine if their activity aligns with legitimate user behavior or if it is anomalous.
  - **Monitor Network Traffic:** Check for subsequent network traffic that follows the use of the `Compress-Archive` cmdlet, which could indicate data exfiltration attempts or interactions with external addresses.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of data theft within the enterprise environment. The likelihood of misuse of the `Compress-Archive` cmdlet increases with the prevalence of malware behaviors that utilize common scripting tools and compression techniques to facilitate exfiltration.

  ### Blind Spots and Assumptions
  Detection effectiveness may be limited in environments where PowerShell logging is not adequately configured or if logs are not retained for sufficient periods. Additionally, the analysis assumes that all legitimate uses of PowerShell and temporary directories are benign, which may not account for cases where users or processes inadvertently engage in suspicious behaviors. Adequate logging configurations for Windows PowerShell and file system activities are required for the successful detection of this pattern.

