level: medium
note: |
  ### Technical Context

  This Sigma rule detects PowerShell downgrade attacks, where an adversary exploits a PowerShell engine vulnerability by forcing the execution of an older version of PowerShell (specifically version 2.0). The likely objective of this attack is to bypass security controls set by newer versions of PowerShell, which enforce stricter execution policies and logging features, allowing the adversary to silently execute malicious commands. The relevant MITRE ATT&CK tactic is "Defense Evasion" and the technique is "Command and Scripting Interpreter: Windows PowerShell" (T1059.001).

  Primary telemetry sources include the Windows event logs, specifically capturing PowerShell execution logs (Event ID 4104 for script block logging). The security impact of a successful downgrade attack can lead to compromised systems as the attacker could execute malicious scripts undetected. Importantly, this detection does NOT confirm malicious behavior on its own, as there may be legitimate reasons to execute older versions of PowerShell, particularly in legacy environments.

  ### Investigation Steps

  - **Check PowerShell version:** Confirm the PowerShell version being executed. Use Event ID 4104 to review the command execution context and compare the `EngineVersion` field for 2.0 against the `HostVersion` in the same logs to identify downgrade attempts.

  - **Review script execution logs:** Look at Event ID 800 for any instances where scripts were executed alongside the downgrade, paying close attention to any suspicious commands that align with known malicious patterns.

  - **Identify legitimate PowerShell usage:** Determine if PowerShell commands executed are typical for the environment. Review recent changes in the system administration or development environment that may justify older PowerShell usage.

  - **Correlate with other security events:** Identify any associated suspicious behaviors (e.g., Event ID 4688 for process creation) that occur in proximity to the detected downgrade action, which could indicate more nefarious activities.

  - **Examine system roles and asset criticality:** Prioritize investigation on hosts with critical roles such as Domain Controllers or database servers where security controls are paramount.

  - **Validate file manipulations or exfiltrations:** Check for file downloads or uploads and inspect Event ID 4663 where sensitive objects may have been accessed or modified, particularly around the time of PowerShell downgrade events.

  ### Prioritization

  This alert should be treated with medium severity as it affects potentially critical systems where attackers could leverage older PowerShell versions to evade detection. Although downgrade attacks are less common, they can be effective when used. The possibility of malicious abuse is credible due to the known vulnerabilities in older PowerShell versions.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where logging is insufficient or where PowerShell logging is disabled altogether, as older versions do not record detailed logs. Legitimate use cases include legacy applications still dependent on PowerShell 2.0, which could trigger this alert without malicious intent. A companion detection rule that monitors for unusual script block execution patterns would strengthen coverage against potential exploitation.

