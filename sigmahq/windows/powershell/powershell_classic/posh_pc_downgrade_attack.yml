note: |
  ### Technical Context

  This Sigma rule detects a PowerShell downgrade attack by comparing the PowerShell engine version used during execution to the host version installed on the system. The primary behavior observed is the execution of a script or command using an outdated PowerShell engine (version 2.0), which may indicate an adversary's attempt to bypass security measures that mitigate risks associated with newer versions. This tactic relates to the MITRE ATT&CK framework under **Execution** (TA0002) and the technique **Command-Line Interface** (T1059.001).

  Key telemetry sources include Windows PowerShell logs and event logs related to script execution. Detection is critical, as using an older PowerShell version could allow an attacker to evade security controls and execute commands without triggering standard security detections. However, this detection does NOT confirm that malicious activity is occurring; it merely indicates that a downgrade attempt has been made.

  ### Investigation Steps

  - **Analyze PowerShell Execution Logs:** Review Windows PowerShell logs (Event ID 4104) for any command lines that exhibit suspicious patterns or are known malicious scripts executed under the lower engine version.

  - **Verify Engine and Host Versions:** Check host configurations by comparing the current PowerShell host version (via `Get-Host`) and the engine version reported in logs. Legitimate PowerShell usage should utilize the latest versions (typically 5.1 or 7.x); anything involving version 2.0 triggers concern.

  - **Correlate with User Activity:** Investigate user account activity to establish context around the execution. Identify if the user has a history of executing PowerShell scripts or if there were recent credentials obtained that could point to a compromised account.

  - **Identify High-Confidence Indicators:** Focus on command invocations that utilize `-ExecutionPolicy Bypass`, especially those executed by service accounts or from unusual processes that typically wouldn’t invoke PowerShell, indicating potential malicious use.

  - **Examine Process Creation Events:** Review Windows Security Event ID 4688 for process creation related to PowerShell (e.g., `powershell.exe`) to look for processes spawned with the `-WindowStyle Hidden` or `-EncodedCommand` flags that generally indicate obfuscation.

  - **Check for Unusual Network Activity:** Analyze network flow logs and DNS queries for atypical outbound connections from the affected host post-execution. Malicious PowerShell scripts may initiate command-and-control communications.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems that may be compromised using PowerShell to perform reconnaissance or lateral movement. While downgrade attacks may not be commonly observed, they align with known attacker techniques, making them a significant concern in an enterprise context.

  ### Blind Spots and Assumptions

  Detection may be limited if security configurations do not capture all PowerShell executions or if logging is improperly configured for relevant event IDs. Legitimate administrative activities, such as troubleshooting scripts run in legacy environments, may trigger this alert. Related detections, such as those identifying unusual command-line arguments or patterns in PowerShell execution logs, would bolster overall detection capabilities against this attack vector.

