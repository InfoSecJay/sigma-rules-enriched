  ---

  ### Technical Context

  This Sigma rule detects instances where an outdated PowerShell engine version (2.0) is being used on a host that is reported to support a newer version. The behavior of downgrading PowerShell versions can indicate an attempt by an attacker to leverage older, potentially less secure capabilities or evade detection mechanisms that are tailored to monitor newer versions. The likely objective is to execute malicious scripts with reduced scrutiny or to exploit known vulnerabilities in the older engine version.

  This detection aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the specific technique T1059.001: PowerShell. The primary telemetry source comes from Windows PowerShell logs where the `Data` field contains engine and host version information. If this activity is malicious, it could lead to the execution of harmful scripts while avoiding detection mechanisms designed for current versions. Importantly, this detection does NOT confirm that malicious activity is occurring without additional context or corroborative evidence, such as script content analysis.

  ---

  ### Investigation Steps

  - **Check PowerShell logs for discrepancies:** Review the PowerShell logs (Event ID 400) to determine if scripts were executed using PowerShell version 2.0 on hosts that should be utilizing a higher version. Look for unusual or unauthorized script execution patterns.

  - **Validate the version discrepancy:** Use `Get-Host` or `Get-HostVersion` in PowerShell to assess the installed PowerShell version on the asset. If the host is running a version above 2.0, yet logs show version 2.0 active, it could indicate a downgrade attack.

  - **Analyze recent script activity:** Investigate the ScriptBlock logging (Event ID 4104) to identify any scripts executed using the downgraded engine. Look for known malicious commands or obfuscated scripts that could indicate malicious intent.

  - **Confirm legitimate uses of PowerShell version 2.0:** Assess whether any necessary business processes or legacy systems within the organization specifically require PowerShell 2.0, documenting these as exceptions to prevent false positives.

  - **Investigate endpoint security alerts:** Review alerts from endpoint protection platforms (EPP) related to PowerShell activity, particularly those flagged for suspicious execution or behavior patterns. Ensure that any detected malicious behavior is corroborated with the downgraded version evidence.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential for system compromise by leveraging outdated PowerShell functionality, which can evade modern security countermeasures. The likelihood of malicious abuse is significant, as downgrading is a common tactic for circumventing defenses. This behavior is not rare; numerous threats are known to exploit older versions of PowerShell.

  ---

  ### Blind Spots and Assumptions

  This detection may miss sophisticated adversaries who manipulate PowerShell without reverting to an older version, using alternative evasion techniques. Proper configuration of PowerShell logging is essential for reliable detection; therefore, ensure that all relevant logging options are enabled. Legitimate enterprise activities may involve legacy applications needing older versions of PowerShell, which could trigger this alert. A companion detection, such as monitoring for abnormal script executions in conjunction with PowerShell versioning, enhances overall coverage and defense against evasion techniques.

