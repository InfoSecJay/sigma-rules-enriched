logsource:
  product: windows
  category: ps_classic_start
detection:
  selection:
    Data|contains: 'EngineVersion=2.'
  filter_main:
    Data|contains: 'HostVersion=2.'
  condition: selection and not filter_main
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential PowerShell downgrade attacks, where an attacker manipulates the PowerShell environment to force the use of an outdated engine version (e.g., 2.0) instead of a more recent one. This kind of attack may lead to the exploitation of vulnerabilities present in older engine versions, allowing adversaries to execute malicious scripts with greater ease. Typically, attackers endeavor to downgrade PowerShell in an effort to bypass security mechanisms that are tied to newer versions, thereby gaining an advantage in executing their malicious objectives without detection.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Execution (T1059.001)**, which focuses on script execution methods, and **Defense Evasion (T1203)**, as attackers use the downgrade tactic to evade detection by security measures that may not scrutinize older PowerShell versions as closely. The primary data sources for this detection include logs from the Windows PowerShell (Windows events specific to PowerShell execution), which can reveal inconsistencies between the expected engine version and the version utilized during execution.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell event logs for any signs of execution that indicate the use of PowerShell engine version 2.0 while the host version is higher, which could suggest an attempted downgrade attack.
  - **Analyze Script Execution**: Identify and analyze recent PowerShell scripts that invoked the outdated engine version. Look for unusual or suspicious scripts that may have been executed prior to the downgrade detection.
  - **Cross-Check with Updates**: Verify the host’s installed PowerShell version against the current system and security configurations. Ensure that no unauthorized changes have been made to PowerShell settings that could facilitate a downgrade.
  - **Detect Anomalous Commands**: Investigate any PowerShell commands or functions that suggest persistence or evasion strategies, indicating the likelihood of an attacker attempting to exploit the lower version.

  ### Prioritization
  This alert is classified as medium severity due to the inherent risk associated with running an outdated PowerShell engine, which could allow an attacker to exploit vulnerabilities and execute commands undetected. The likelihood of serious impact increases if the environment relies heavily on PowerShell for system management.

  ### Blind Spots and Assumptions
  Potential gaps exist in the detection coverage if log retention policies limit access to historic PowerShell execution logs, as attackers may perform their actions during periods of low visibility. The detection logic assumes that there is a clear delineation between host and engine versions and that logs are correctly configured to capture this data. Required configurations include the necessary logging level for PowerShell to track engine version usage in action, ensuring that both host and engine versions are properly logged and timestamped for effective comparison.

