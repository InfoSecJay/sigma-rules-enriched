detection:
  selection_webclient:
    Data|contains: 'Net.WebClient'
  selection_download:
    Data|contains:
    - '.DownloadFile('
    - '.DownloadString('
  condition: all of selection_*
falsepositives:
- PowerShell scripts that download content from the Internet
level: medium
note: |
  ### Technical Context
  This rule detects potentially malicious usage of PowerShell to download files from the Internet. When an attacker compromises a system, they often use scripts to fetch malicious payloads or tools, which can facilitate further activities such as data exfiltration, lateral movement, or execution of additional attacks. The ability to detect this behavior is crucial as it may indicate early attempts at establishing a foothold or executing a ransomware attack using scripts, as referenced in related research about the ProxyShell vulnerability.

  The relevant MITRE ATT&CK tactics involved are **Execution** (TA0002) since the rule detects commands run by PowerShell, and specifically **PowerShell** (T1059.001) which highlights the use of PowerShell as a command-line interface to execute the download commands. PowerShell, as a powerful scripting language built into Windows, is a common tool for attackers due to its flexibility.

  Primary data sources that will provide evidence include PowerShell command logs, specifically classic PowerShell start events which contain command-line activity. By analyzing these logs, security teams can identify potentially harmful download behaviors made by PowerShell scripts.

  ### Investigation Steps
  - **Collect PowerShell Logs**: Review PowerShell execution logs for entries that include both `Net.WebClient` and `.DownloadFile(` or `.DownloadString(` methods, as these signify a function executing a download command.
  - **Examine Related Processes**: Investigate processes initiated around the same time as the suspicious download commands, focusing on parent-child relationships to understand what may have triggered the download.
  - **Assess Network Activity**: Analyze network traffic logs for any unusual outbound connections or large volumes of data being sent from endpoints shortly after the download events, which may indicate data exfiltration.
  - **Correlate with Security Events**: Check SIEM alerts and other security logs for signs of prior exploitation attempts or command-and-control (C2) communications that may coincide with the timeline of detected downloads.

  ### Prioritization
  The severity of this alert is considered medium because while it does indicate potentially malicious behavior, such as the use of PowerShell to download external content which could lead to infection, there are legitimate use cases for PowerShell scripts that download files. Thus, further investigation is necessary to assess the context and actions taken by the script.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage for legitimate administrative scripts that may also utilize similar commands to download necessary files from trusted sources. The detection logic assumes the commands are initiated without valid operational context, which may not always be the case. Additionally, the detection relies on PowerShell logging being properly configured and enabled, which may not be consistent across all enterprise environments.

