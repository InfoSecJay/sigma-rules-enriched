detection:
  selection_webclient:
    Data|contains: 'Net.WebClient'
  selection_download:
    Data|contains:
    - '.DownloadFile('
    - '.DownloadString('
  condition: all of selection_*
falsepositives:
- PowerShell scripts that download content from the Internet
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that involve downloading files from the internet using methods like `DownloadFile` and `DownloadString`. Such behavior typically signals an attempt to retrieve and execute malicious scripts or payloads, which may align with various attack objectives, including malware deployment or data exfiltration. This activity fits into the MITRE ATT&CK framework under the Execution tactic, specifically technique T1059.001 (PowerShell).

  The primary telemetry sources include Windows Event Logs related to PowerShell command execution and Sysmon logs capturing process activities. If this behavior is malicious, it can result in significant security impacts, including system compromise or data breach. Importantly, the detection does not confirm whether the downloaded content is indeed malicious or if the PowerShell command was executed with legitimate intent.

  ### Investigation Steps

  - **Identify the PowerShell command execution**: Check Security Event ID 4688 for instances of PowerShell (`powershell.exe`) being executed around the time of the alert. Look for command lines containing `DownloadFile(` or `DownloadString(`.

  - **Examine the downloaded file location**: Validate where the files are being downloaded to by reviewing file system activities via Sysmon Event ID 11, which logs file creation activities. Malicious downloads often occur in temporary directories (e.g., C:\Users\{username}\AppData\Local\Temp).

  - **Monitor network connections for anomalies**: Review outbound connections made during the PowerShell execution using Windows Firewall logs (Event ID 5156 or equivalent) to identify if the alert is associated with connections to suspicious IPs or domains. Indicator domains may include those known for hosting malicious payloads.

  - **Review user context and permissions**: Analyze the context of the user executing the script. Ensure that the user has permissions appropriate for legitimate operational tasks; unfamiliar accounts or elevated privileges could indicate malicious activity.

  - **Contextualize with benign behavior**: Compare against legitimate PowerShell usage within your environment—documented scenarios that involve trusted scripts retrieving updates or configuration data. If the alert coincides with documented administrative tasks, it may indicate benign activity.

  ### Prioritization

  This alert has medium severity due to its potential to lead to system compromise and malware execution. The likelihood of malicious activity is heightened considering PowerShell's flexibility and common usage in targeted attacks. However, it is also necessary to assess the organizational context as benign downloads can occur in a mature environment.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing encoded PowerShell commands or directly invoking executables to download files, which can evade basic detection mechanisms. Consistent logging from both PowerShell and Sysmon is crucial for reliable analysis, while environments allowing unrestricted PowerShell executions increase the likelihood of benign activities triggering alerts. A companion detection for successful file executions (e.g., Sysmon Event ID 1 for process creation following downloads) can provide broader coverage and contextual clarity regarding potential threats.

