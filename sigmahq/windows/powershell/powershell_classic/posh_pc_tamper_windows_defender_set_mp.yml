detection:
  selection_set_mppreference:
    Data|contains: 'Set-MpPreference'
  selection_options_bool_allow:
    Data|contains:
    - '-dbaf $true'
    - '-dbaf 1'
    - '-dbm $true'
    - '-dbm 1'
    - '-dips $true'
    - '-dips 1'
    - '-DisableArchiveScanning $true'
    - '-DisableArchiveScanning 1'
    - '-DisableBehaviorMonitoring $true'
    - '-DisableBehaviorMonitoring 1'
    - '-DisableBlockAtFirstSeen $true'
    - '-DisableBlockAtFirstSeen 1'
    - '-DisableCatchupFullScan $true'
    - '-DisableCatchupFullScan 1'
    - '-DisableCatchupQuickScan $true'
    - '-DisableCatchupQuickScan 1'
    - '-DisableIntrusionPreventionSystem $true'
    - '-DisableIntrusionPreventionSystem 1'
    - '-DisableIOAVProtection $true'
    - '-DisableIOAVProtection 1'
    - '-DisableRealtimeMonitoring $true'
    - '-DisableRealtimeMonitoring 1'
    - '-DisableRemovableDriveScanning $true'
    - '-DisableRemovableDriveScanning 1'
    - '-DisableScanningMappedNetworkDrivesForFullScan $true'
    - '-DisableScanningMappedNetworkDrivesForFullScan 1'
    - '-DisableScanningNetworkFiles $true'
    - '-DisableScanningNetworkFiles 1'
    - '-DisableScriptScanning $true'
    - '-DisableScriptScanning 1'
    - '-MAPSReporting $false'
    - '-MAPSReporting 0'
    - '-drdsc $true'
    - '-drdsc 1'
    - '-drtm $true'
    - '-drtm 1'
    - '-dscrptsc $true'
    - '-dscrptsc 1'
    - '-dsmndf $true'
    - '-dsmndf 1'
    - '-dsnf $true'
    - '-dsnf 1'
    - '-dss $true'
    - '-dss 1'
  selection_options_actions_func:
    Data|contains:
    - 'HighThreatDefaultAction Allow'
    - 'htdefac Allow'
    - 'LowThreatDefaultAction Allow'
    - 'ltdefac Allow'
    - 'ModerateThreatDefaultAction Allow'
    - 'mtdefac Allow'
    - 'SevereThreatDefaultAction Allow'
    - 'stdefac Allow'
  condition: selection_set_mppreference and 1 of selection_options_*
falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for troubleshooting
  purposes. Must be investigated.
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to tamper with Windows Defender settings using PowerShell commands. It specifically looks for the execution of `Set-MpPreference` with parameters that could disable various security features, such as real-time monitoring, scanning capabilities, and default actions for handling threats. Attackers may leverage these commands to disable protections to facilitate malicious activity, deliver payloads, or maintain persistence without detection.

  The primary threat scenario includes potential insider threats or external attackers who have gained access to a system and are attempting to modify security controls to bypass detection. Their objective is likely to reduce the effectiveness of endpoint protections, thus allowing for a more successful execution of malware or unauthorized activities. This behavior falls under the MITRE ATT&CK technique T1562.001 - "Disable or Modify Tools," emphasizing the concept of defense evasion in cyber operations.

  The primary data sources for gathering evidence on this activity include PowerShell execution logs, Windows Event Logs related to process creation, and any logs related to system configuration changes. These logs can provide insights into unauthorized changes to Windows Defender's behavior, thus helping security analysts identify potential threats.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell operational logs to identify instances of the `Set-MpPreference` command and the associated parameters. Look for any suspicious usage patterns or unusual accounts executing these commands.

  - **Analyze Windows Event Logs:** Investigate Event IDs related to process creations (e.g., 4688) to confirm the execution of PowerShell scripts or commands modifying Windows Defender settings. Correlate these events with user activity.

  - **Examine Scheduled Tasks:** Check for any scheduled tasks that may have been created or modified to include disabling Windows Defender features. Investigate any unauthorized tasks especially running under high-privilege accounts.

  - **Assess AD Group Policies:** Review any applied Group Policies that affect Windows Defender settings to ensure no unauthorized modifications have been made that would allow defense evasion techniques.

  ### Prioritization
  The alert is considered high severity due to the critical nature of the activity it flags. Disabling core security features poses significant risks to the integrity and safety of enterprise systems, making it a priority response scenario in the event of detection.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if logging is not adequately configured for PowerShell execution or if PowerShell has been disabled or restricted on certain endpoints. The rule assumes that the relevant PowerShell logs and Windows Event Logs are being collected correctly and that the environment is configured to log all executions of PowerShell commands. Additionally, there may be legitimate use cases where Windows Defender is temporarily disabled for troubleshooting, which should be carefully investigated to avoid false positives.

