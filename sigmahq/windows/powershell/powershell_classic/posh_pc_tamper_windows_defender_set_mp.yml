falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for 
  troubleshooting purposes. Must be investigated.
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable critical components of Windows Defender ATP through PowerShell commands, particularly using the `Set-MpPreference` cmdlet. The likely attacker objective is to impair the defense mechanisms of Windows devices, allowing for easier exploitation, malware execution, or lateral movement within the environment. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (T1562) and technique "Disable or Modify Security Tools" (T1562.001).

  The primary telemetry source for this detection is Windows PowerShell logs, specifically events generated when commands such as `Set-MpPreference` are executed. If successful, the malicious activities can severely compromise endpoint security, leaving systems vulnerable to various forms of attack. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate troubleshooting activities can also utilize similar commands.

  ### Investigation Steps

  - **Review PowerShell command details:** Check for Security Event ID 4688 related to the execution of the `Set-MpPreference` cmdlet. Look for parameters indicating potential disabling of security features, such as `-DisableRealtimeMonitoring $true` or `-DisableIOAVProtection $true`.
  - **Verify execution context:** Identify the user or process that executed the command. Check for anomalies, such as execution by non-administrative accounts or at unusual times. Legitimate admin tasks usually involve documented workflows and business hours executions.
  - **Cross-check related logs:** Review Windows Defender logs for any corresponding events indicating a change in status or alerts around the time the PowerShell command was executed (e.g., Event ID 5007 for Windows Defender status changes).
  - **Investigate for known benign patterns:** Compare the execution of `Set-MpPreference` with known legitimate maintenance scripts that may disable Windows Defender temporarily for software installations or troubleshooting.
  - **Assess the broader situation:** Conduct an endpoint assessment for other signs of compromise, such as unusual process activity or network connections (using Sysmon Event ID 3 for process creations) that occurred around the same time to detect possible exploitation attempts.
  - **Document findings and escalate if appropriate:** Record all relevant details, including user context, time of execution, and any associated suspicious activities. If indicators of compromise (IOCs) are confirmed, escalate the incident as potentially malicious.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact on endpoint security. The likelihood of malicious abuse is elevated because disabling Windows Defender is a common tactic used by attackers to facilitate the execution of malware. This behavior is frequently weaponized, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include adversaries utilizing obfuscated PowerShell commands to evade detection or benign scripts that may trigger the alert unintentionally. Reliable detection requires proper logging configurations to capture PowerShell command execution. Legitimate activities such as IT maintenance or troubleshooting can trigger this alert, necessitating thorough investigation into the context. A related detection for lateral movement or known malware execution could strengthen overall coverage, ensuring that a comprehensive view of endpoint activity is obtained.

