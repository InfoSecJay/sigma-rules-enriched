falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for 
  troubleshooting purposes. Must be investigated.
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to alter Windows Defender settings via PowerShell, specifically using the `Set-MpPreference` cmdlet. The behavior suggests an attacker may be attempting to disable security features to facilitate malicious activity without detection, aligning with the objective of evading detection mechanisms. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1562.001).

  Primary telemetry sources include Windows PowerShell logs (Event ID 4104) and the event logs (Security Event ID 4688) related to process creation. If successful, such modifications could severely impact an organization's security posture by allowing undetected malware execution or lateral movement. It is crucial to note that this detection does NOT confirm malicious intent without further context; legitimate troubleshooting activities may trigger similar alerts.

  ### Investigation Steps

  - **Identify the initiating process: ** Review Security Event ID 4688 logs for process creation events. Look for `powershell.exe` or `pwsh.exe` as the initiating process, which can indicate a potential malicious use of PowerShell.

  - **Check specific cmdlet usage: ** Examine PowerShell logs (Event ID 4104) for any occurrences of `Set-MpPreference` along with arguments reflecting disabling features (e.g., `-DisableRealtimeMonitoring $true`). Focus on specific flags used, as these can indicate intent to modify security settings.

  - **Evaluate historical context: ** Review the system’s event logs for recent escalated privilege events (Event ID 4672) or anomalous logins immediately preceding the alert. This can provide insight into whether an unauthorized user initiated the command.

  - **Validate legitimate vs. suspicious activities: ** Determine if the detected commands were run by known administrative users during maintenance windows. Legitimate entries may include troubleshooting scripts executed by system administrators.

  - **Investigate related telemetry: ** Cross-reference with network logs to see if any traffic aligns with the timing of the cmdlet execution, particularly outbound connections that indicate potential data exfiltration or command and control communications.

  ### Prioritization

  The severity of this alert is high, given the potential impact on system security if Windows Defender functionalities are compromised. The likelihood of malicious abuse is significant since disabling security measures is a common tactic in advanced persistent threats (APTs) and other attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers use alternate methods to disable Defender without triggering logs or employ scheduled tasks. Reliable detection requires consistent logging configurations for PowerShell and defensive application logs. Legitimate activities, such as troubleshooting by IT staff, might cause false positives. A related detection to consider is monitoring for unusual PowerShell script executions or access patterns (refer to MITRE T1046).

