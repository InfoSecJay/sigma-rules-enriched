  ---

  ### Technical Context

  This rule detects the execution of PowerShell from an executable where there is a version mismatch between the PowerShell Engine and Host versions. Specifically, it identifies instances where an executable is using a mismatch strategy, which is often employed by attackers to evade detection while executing malicious scripts. The likely objective is to leverage PowerShell’s capabilities to execute code or establish persistence. The associated MITRE ATT&CK technique is T1059.001 (PowerShell).

  Primary telemetry sources include Windows Event Logs related to PowerShell execution (Event ID 4104 for script block logging) and Windows Security Logs (Event ID 4688 for process creation). The security impact is significant, as this behavior can indicate an attempt to execute malicious payloads stealthily. However, the detection does NOT confirm malicious activity on its own, as legitimate tools and scripts may exhibit similar behavior.

  ---

  ### Investigation Steps

  - **Check Event ID 4104 for script block logging:** Review logs for PowerShell events that show script execution. Look for unusual or obfuscated scripts that deviate from standard operational tasks.

  - **Review Process Creation Events (Event ID 4688):** Verify the parent process of the PowerShell execution. A mismatched execution from benign processes (like cmd.exe) could indicate an evasion technique. Legitimate execution usually involves standard applications (e.g., system management tools).

  - **Examine PowerShell Version Mismatch:** Investigate the recorded PowerShell EngineVersion and HostVersion in logs. Malicious indicators include instances where EngineVersion is 2, 4, or 5 while HostVersion is 3, as this suggests potential misuse.

  - **Validate system criticality and asset role:** Determine if the affected asset is a critical server or user workstation. High-value targets may attract more sophisticated attacks, elevating the need for thorough analysis.

  - **Look for low-frequency scripts or commands:** Identify any usage of uncommon commands or scripts, especially those typically weaponized for lateral movement or remote access operations.

  ---

  ### Prioritization

  This alert is high severity given its potential for critical impact on enterprise security, especially if targeting sensitive assets. The likelihood of malicious abuse is elevated, as version mismatches are common tactics used by threat actors to execute PowerShell in a stealthy manner.

  ---

  ### Blind Spots and Assumptions

  Detection may miss older PowerShell versions or bypass techniques that don't trigger this signature. Reliable detection requires enabling script block logging and auditing process creation events. Legitimate activities, such as scheduled tasks or administrative scripts, may inadvertently trigger this alert. Companion detections for process injection or suspicious command-line parameters (e.g., tools like Sysinternals) can enhance overall visibility into potential misuse.

