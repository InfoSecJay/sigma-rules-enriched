note: |
  ### Technical Context

  This Sigma rule detects instances where PowerShell is invoked from an executable, but the version used is inconsistent with the expected engine version. Specifically, it identifies calls where a PowerShell engine version of 2, 4, or 5 is executed from an executable reporting a host version of 3. This behavior could indicate attempts to bypass security controls, as attackers may leverage discrepancies in versions to execute potentially malicious scripts covertly.

  The relevant MITRE ATT&CK tactic is Execution, specifically technique T1059.001 (Command and Scripting Interpreter: Windows PowerShell). The primary telemetry source is Windows event logs capturing PowerShell activity, particularly those pertaining to PowerShell execution and process creation events. If malicious, the security impact is severe, as it may indicate the execution of unauthorized scripts or payloads, potentially facilitating further compromise within the network. This detection does NOT confirm that a successful compromise has occurred; it only indicates a potential misuse of PowerShell.

  ### Investigation Steps

  - **Identify PowerShell execution instances**: Review Windows Event Logs (Event ID 4688) or Sysmon Event ID 1, specifically looking for PowerShell process creation events. Confirm the presence of the suspicious version mismatch (EngineVersion and HostVersion).

  - **Correlate with known software**: Check if any legitimate scheduled tasks or maintenance tasks utilize PowerShell from a version misalignment. Look for descriptions in Task Scheduler or correlate with the processes’ command line arguments for context.

  - **Examine parent process relationships**: Analyze the parent process of the PowerShell execution using Sysmon logs (Event ID 1). Verify if the parent process is an expected legitimate application or a suspicious executable.

  - **Investigate script content**: If available, inspect the script executed by PowerShell (consider potential logging systems or external tools). Look for any indicators of malicious activity, such as obfuscation, known malicious commands, or remote execution patterns.

  - **Review recent changes and deployment**: Examine recent changes to the operational environment, including software deployments and configuration updates. Validate whether new software installations align with the observed PowerShell version behavior.

  - **Cross-reference with threat intelligence**: Utilize threat intelligence platforms to check if observed behaviors match known indicators of compromise (IoCs) for recent PowerShell exploits or prevalent malware tactics.

  ### Prioritization

  This alert is of high severity due to the potential impact of executing malicious PowerShell scripts on critical systems. The likelihood of malicious abuse is significant, as attackers often exploit PowerShell's capabilities for lateral movement and persistence. The behavior detected is commonly weaponized in targeted attacks, making it a priority for detailed investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logs or lack of visibility into PowerShell usage across all endpoints. Attackers could use legitimate scenarios, such as updates or software installations, to trigger this alert. It's also possible for security controls to block PowerShell execution based on policy, leading to false negatives in detection. A companion detection, such as monitoring for Windows PowerShell logging (Event ID 4103), can provide additional insight into executed commands and improve coverage.

