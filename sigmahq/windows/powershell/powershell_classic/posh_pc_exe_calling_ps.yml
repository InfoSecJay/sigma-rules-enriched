  ### Technical Context

  This Sigma rule detects attempts to execute PowerShell scripts from an executable where there is a version mismatch between the PowerShell engine invoked and the system's version. Such behaviors are often utilized by attackers to bypass security controls, potentially launching malicious scripts from a trusted environment with altered execution contexts. The relevant MITRE ATT&CK tactic is **Execution (TA0002)** and the technique is **PowerShell (T1059.001)**.

  The primary telemetry sources are Windows Event Logs that track PowerShell processes, particularly logs related to PowerShell executions. Specifically, the logs must provide information about the engine and host versions associated with the PowerShell instance. If this behavior is malicious, it could lead to unauthorized code execution or data exfiltration. However, it is crucial to note that this detection does not confirm the intent behind the execution or guarantee that the executed code is malicious.

  ### Investigation Steps

  - **Identify PowerShell process execution:** Review Windows Security Event ID 4688 for any new PowerShell process creation. Check for processes invoking PowerShell, noting any associated parent process that may indicate an executable attempting to obscure its activity.

  - **Verify version mismatch details:** Examine the PowerShell logs for instance of 'EngineVersion=2.', 'EngineVersion=4.', or 'EngineVersion=5.' alongside 'HostVersion=3.'. This disparity indicates a potential evasion technique leveraging an outdated or different version of PowerShell.

  - **Assess the legitimacy of the calling executable:** Determine if the parent process invoking the PowerShell command is known and legitimate (e.g., common system utilities). Check the integrity of the executable (hash verification) to rule out malicious actors using valid software to execute scripts.

  - **Correlate with additional telemetry:** Cross-reference with Sysmon Event ID 1 to trace any created or modified processes or connections, highlighting unusual outbound connectivity that may accompany a successful PowerShell execution.

  - **Identify a known baseline for secure execution:** Evaluate recent legitimate PowerShell activity within the environment by comparing executed scripts and versions of PowerShell commonly used by administrative processes. Document expected parameters for normal operations to distinguish anomalies accurately.

  ### Prioritization

  The alert is raised due to high severity based on the potential impact of the affected system, particularly if sensitive environments are targeted. The likelihood of malicious abuse is significant, as PowerShell is a well-known vector for exploitation and lateral movement. This technique is frequently weaponized in various attacks, making it crucial for immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as attackers modifying the PowerShell executable directly or using alternative encoders. A reliable detection framework requires comprehensive logging capabilities to capture all relevant PowerShell executions and process creations. Legitimate activities, such as administrative scripts executed by system administrators, may trigger this alert. A companion detection, like monitoring for anomalous outbound PowerShell web requests (using network logs), can enhance overall coverage against exploitation attempts.

