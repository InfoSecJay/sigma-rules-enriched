note: |
  ### Technical Context
  This rule detects the deletion of Volume Shadow Copies through Windows Management Instrumentation (WMI) commands invoked via PowerShell. Such activity is indicative of an attacker attempting to hinder forensic investigations or cover their tracks after performing malicious actions. Volume Shadow Copies are backups created by Windows for critical files, and their deletion can significantly impede recovery efforts following a security incident.

  Attackers may leverage this technique to erase evidence of their activities, particularly during or after data exfiltration or compromise. The primary objective is typically to prevent detection and make it more challenging for security teams to assess the extent of a breach. The relevant MITRE ATT&CK tactics and techniques include **Impact (TA0040)**, with a specific focus on **Data Destruction (T1490)**.

  The primary data sources for this detection include PowerShell logs, specifically tracking the use of commands associated with WMI, as well as event logs capturing system activities on Windows, which detail the invocation of these commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check PowerShell logs for instances of 'Get-WmiObject' and 'Remove-WmiObject' commands, particularly involving 'Win32_ShadowCopy'. Focus on identifying unusual execution times or origins that do not align with normal administrative activities.
  - **Analyze Event Logs:** Examine Windows Event Logs for events associated with WMI activity and shadow copies. Look for Event ID 4624 (Logon), Event ID 4688 (New Process Creation), and Event ID 7045 (Service Installation) that may correlate with the deletions.
  - **Correlate with User Activity:** Investigate the user’s behavior leading up to the execution of these commands. Determine if there are recent unauthorized access attempts or lateral movement indicators that suggest compromised accounts.
  - **Identify System State Changes:** Look into other changes in system states or file permissions that might coincide with the shadow copy deletions to assess the broader impact on system integrity and possible data loss.

  ### Prioritization
  This alert is rated high in severity due to the critical nature of Volume Shadow Copies in forensic investigations and their potential deletion by malicious actors to conceal evidence of data breaches or system compromises.

  ### Blind Spots and Assumptions
  Detection coverage may miss events if PowerShell transcription logging is not enabled or if the command execution occurs outside of logged sessions. The logic assumes that the deletion of shadow copies via WMI is not a common legitimate administrative action. Further, the alert will not function without proper logging configurations to capture PowerShell command executions and related Windows events.

