note: |
  ### Technical Context

  This rule detects the deletion of Volume Shadow Copies using Windows Management Instrumentation (WMI) commands executed via PowerShell. This behavior is indicative of an attacker attempting to eliminate restore points to hinder forensic investigation or cover malicious activities, such as data exfiltration or system compromise. The relevant MITRE ATT&CK tactic is "Impact" (T1485), specifically technique "Data Destruction" (T1490). The primary telemetry source is Windows PowerShell logs, particularly focusing on commands that invoke WMI and affect shadow copies. If malicious, this activity can significantly impede recovery efforts and forensic investigations after an attack. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate administrators may also perform these actions.

  ### Investigation Steps

  - **Review PowerShell script execution logs:** Examine Windows PowerShell logs for Event ID 4104 that capture command execution. Look for any "Get-WmiObject" and deletions involving "Win32_ShadowCopy" to confirm rule triggering.

  - **Assess the execution context:** Check the user account that initiated the PowerShell command. Legitimate enterprise administrators would typically use service accounts or specific usernames tied to system maintenance.

  - **Identify timing of deletion commands:** Analyze event timestamps. Malicious deletions are frequently executed after unauthorized access or other suspicious activities (e.g., Event ID 4624 for successful logins).

  - **Corroborate with forensic artifacts:** Validate absence or presence of shadow copies by inspecting Volume Shadow Copy Service (VSS) logs and commands that typically list available shadow copies. Legitimate activity shows routine maintenance tasks, while malicious activity logs an abrupt lack of copies.

  - **Check for additional indicators of compromise (IOCs):** Look for Event ID 4697 indicating service installations or changes, especially close in time to the PowerShell commands, suggesting possible malware deployment.

  - **Monitor other abnormal behavior:** Correlate this detection with network traffic logs showing unusual outbound communications, which may indicate data exfiltration attempts occurring concurrently with the shadow copy deletions.

  ### Prioritization

  The alert should be treated as high severity due to its potential impact on system recovery, especially if it involves critical assets that store important data. The likelihood of abuse is significant, as shadow copy deletions are commonly weaponized by attackers seeking to evade detection or compromise recovery options following their actions.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate administrative tasks cause similar behavior, leading to false positives. Reliable detection requires proper configuration of PowerShell logging, particularly script block logging and module logging, to capture all relevant commands. Legitimate activities such as system maintenance or troubleshooting may also trigger this alert unduly. A related detection rule for monitoring suspicious account logins or command prompt execution could enhance the overall detection strategy.

