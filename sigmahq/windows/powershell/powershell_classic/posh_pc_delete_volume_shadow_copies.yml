  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell commands to delete Volume Shadow Copies via WMI, specifically using operations like `Get-WmiObject` targeting `Win32_ShadowCopy` and invoking `Delete()` or `Remove-WmiObject`. The likely attacker objective is to eliminate forensic artifacts that could provide insight into their activities, thereby hindering incident response efforts. This behavior aligns with the MITRE ATT&CK technique T1490: Inhibit System Recovery.

  The primary telemetry sources include PowerShell logs (Event ID 4104 for transcript logs) and WMI event logs. If successful, a malicious deletion of shadow copies can severely impact recovery options following an attack, as it removes a key data recovery method. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrators may perform similar actions for valid reasons.

  ---

  ### Investigation Steps

  - **Review PowerShell command logs:** Check for Event ID 4104 in PowerShell logs to find command executions containing 'Get-WmiObject', 'Win32_ShadowCopy', 'Delete()', or 'Remove-WmiObject'. Compare against the expected administrative command patterns for volume management.

  - **Identify high-confidence malicious indicators:** Look for unusual execution of PowerShell scripts that manipulate WMI and shadow copies, specifically any instances where 'Win32_ShadowCopy' and 'Delete()' are executed without preceding legitimate commands or administrative alerts.

  - **Correlate WMI log access with account history:** Examine Windows Security Event ID 4624 (Logon) to validate if an account that executed these commands holds legitimate administrative privileges and review timestamps for unusual activity hours.

  - **Identify legitimate activity:** During normal operations, verify any scheduled maintenance tasks by administrators that may leverage shadow copy manipulation. Look for predefined job schedules or log entries that align with common IT maintenance routines.

  - **Check for associated artifacts:** Investigate if any event logs or system logs indicate subsequent creation of shadow copies immediately following deletions, as a recovery operation may indicate legitimate activity; notable Event ID 7036 (Service Control Manager) can signal VSS service statuses.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of affected systems and the potential impact of erasing Volume Shadow Copies. The behavior detected is known to be weaponized in sophisticated attacks, particularly in ransomware situations, where adversaries seek to limit recovery options for victims.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations, as PowerShell logging needs to be enabled for maximum efficacy. Evasion techniques could involve obfuscation of PowerShell commands or using alternative scripting languages. Legitimate system administrators may also trigger this alert during routine maintenance or cleanup activities. A related detection to strengthen coverage would be monitoring for Event ID 7036 that logs VSS service status changes, which could further confirm the context of shadow copy deletions.

