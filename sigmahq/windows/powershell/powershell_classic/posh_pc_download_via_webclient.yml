note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's Net.WebClient class to download files or strings via the `.DownloadFile()` or `.DownloadString()` methods. Such behavior is often leveraged by attackers to retrieve malicious payloads or scripts, potentially facilitating additional compromise on the target system. The likely MITRE ATT&CK tactics are Execution (T1059.001) and Command and Control (T1105). The detection primarily relies on Windows PowerShell telemetry, specifically logs that capture command execution details. If confirmed malicious, this activity poses a significant security threat, as it may lead to further exploitation or data breaches. However, this detection does NOT confirm that the downloaded content is harmful by itself; legitimate software may trigger the same rule.

  ### Investigation Steps

  - **Review PowerShell command history**: Retrieve PowerShell Event ID 4103 logs for specific command execution, focusing on commands containing 'Net.WebClient' and '.DownloadFile(' or '.DownloadString('. Compare the command’s parameters against known tools or legitimate applications.

  - **Check for file downloads**: Investigate the file system for recent downloads initiated via PowerShell. Look for modifications in directories commonly targeted for persistence (e.g., C:\Temp, C:\Users\[Username]\Downloads) that were created around the time an alert was triggered.

  - **Correlate with other telemetry**: Use Sysmon Event ID 1 logs to identify related process creation events that involve PowerShell. Look for suspicious parent processes that initiated the PowerShell command, such as rundll32.exe, cmd.exe, or other unexpected binaries.

  - **Examine process execution time**: Investigate the execution timestamp of the PowerShell instance in the alert. Legitimate software behavior typically involves scheduled tasks or updates executed during maintenance windows, while malicious downloads may occur at odd hours or under abnormal user activity patterns.

  - **Identify known indicators of compromise (IoCs)**: Cross-reference the downloaded file names or URLs against threat intelligence feeds for known malicious content. Pay particular attention to files downloaded from unfamiliar external sources.

  ### Prioritization

  The alert severity is categorized as low; however, it can be escalated based on the context of the affected system. High-value assets or critical servers may warrant immediate attention due to the likelihood of exploitation. While this technique is indeed commonly weaponized in various attack vectors, legitimate applications can trigger similar behavior.

  ### Blind Spots and Assumptions

  This detection rule may be evaded through encoding PowerShell commands or using alternative download mechanisms. Reliable detection necessitates comprehensive logging of PowerShell activities, and configurations may need to be adjusted to capture all relevant events. Additionally, legitimate software like patch managers often uses similar commands; analysts should be aware of such scenarios. A related detection for outbound network connections (e.g., T1071.001 Application Layer Protocol) can help corroborate suspicious behavior.

