title: Suspicious Non PowerShell WSMAN COM Provider
id: df9a0e0e-fedb-4d6c-8668-d765dfc92aa7
status: test
description: Detects suspicious use of the WSMAN provider without PowerShell.exe
  as the host application.
references:
- https://twitter.com/chadtilbury/status/1275851297770610688
- https://bohops.com/2020/05/12/ws-management-com-another-approach-for-winrm-lateral-movement/
- https://github.com/bohops/WSMan-WinRM
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-06-24
modified: 2025-10-22
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: powershell-classic
detection:
  selection:
    Data|contains: 'ProviderName=WSMan'
  filter_main_ps:
    Data|contains:
    - 'HostApplication=powershell'
    - 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
  filter_main_host_application_null:
        # Note: Since we're using the raw data field to match. There is no easy way to filter out cases where the "HostApplication" field is null (i.e doesn't exist). We're practically forced to use a regex.
        # If you're already mapping and extracting the field, then obviously use that directly.
    Data|re: 'HostId=[a-zA-Z0-9-]{36}\s+EngineVersion='
  filter_optional_hexnode:
    Data|contains: 'HostApplication=C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious use of the WMI Service Management (WSMAN) COM provider that does not involve PowerShell as the host application. This behavior may indicate an attacker attempting lateral movement or executing commands via WMAN to gain unauthorized access to systems. The likely attacker objective is to leverage WMAN for remote execution or command-and-control (C2) functionality. The relevant MITRE ATT&CK tactic and technique for this alert is Execution via command-line interface (T1059.001) and Lateral Movement using Windows Remote Management (T1021.003).

  Primary telemetry sources are Windows event logs related to WMI activity, particularly focusing on system logs that capture WMI event details, such as Event ID 4688 for process creation. The security impact can be significant, as it may indicate unauthorized or malicious remote activities that could facilitate broader access or data compromise. This detection does NOT confirm malicious intent on its own; further investigation is required to determine whether the activity is benign or part of an attack.

  ### Investigation Steps

  - **Review event logs: Identify related Event ID 4688:** Examine Windows Security Event Log for Event ID 4688 (Process Creation) that correlates with WSMAN activity. Look specifically for unusual host applications that are not PowerShell, indicating possible malicious activity.

  - **Analyze command execution context:** Search through logs for lines containing ‘ProviderName=WSMan’ combined with process details. Validate if this is accompanied by unusual or unknown executable names that deviate from expected PowerShell-based interactions.

  - **Baseline legitimate WMAN usage:** Identify typical WMAN usage patterns in your environment by referencing known applications or systems that use WMAN. Verify if the detected event aligns with these known legitimate behaviors.

  - **Identify high-confidence malicious indicators:** Look for uncommon host application entries in the process creation logs that exclude known benign applications (such as PowerShell). Any execution of WMI commands through non-standard hosts should be flagged for immediate review.

  - **Cross-reference with network activity:** Check for any associated network traffic related to the identified process. Investigate if there is outbound communication to unusual or non-business-related destinations, which can indicate exfiltration or command and control.

  - **Evaluate installed software:** Investigate if the device has legitimate software that could cause the detection, such as management agents. Confirm the presence of known benign applications like Hexnode Agent using files from their official installation paths.

  ### Prioritization

  This alert carries a medium severity level in an enterprise context. The potential impact involves critical systems being compromised via lateral movement mechanisms. Given that WSMAN is commonly exploited for such purposes, the likelihood of malicious abuse is significant and warrants urgent investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations based on logged telemetry; environments that do not fully capture WMI and PowerShell interactions may miss critical indicators. Legitimate administrative tools or scripts executing WMI commands may trigger false positives. Companion detections such as abnormal process creation from remote execution activity or unusual remote management processes should be implemented to enhance detection capabilities.

