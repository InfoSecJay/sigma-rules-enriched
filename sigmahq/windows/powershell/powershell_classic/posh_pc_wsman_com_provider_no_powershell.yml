title: Suspicious Non PowerShell WSMAN COM Provider
id: df9a0e0e-fedb-4d6c-8668-d765dfc92aa7
status: test
description: Detects suspicious use of the WSMAN provider without PowerShell.exe as
  the host application.
references:
- https://twitter.com/chadtilbury/status/1275851297770610688
- https://bohops.com/2020/05/12/ws-management-com-another-approach-for-winrm-lateral-movement/
- https://github.com/bohops/WSMan-WinRM
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-06-24
modified: 2025-10-22
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: powershell-classic
detection:
  selection:
    Data|contains: 'ProviderName=WSMan'
  filter_main_ps:
    Data|contains:
    - 'HostApplication=powershell'
    - 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell'
    - 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell'
            # In some cases powershell was invoked with inverted slashes
    - 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell'
    - 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'
  filter_main_host_application_null:
        # Note: Since we're using the raw data field to match. There is no easy way to filter out cases where the "HostApplication" field is null (i.e doesn't exist). We're practically forced to use a regex.
        # If you're already mapping and extracting the field, then obviously use that directly.
    Data|re: 'HostId=[a-zA-Z0-9-]{36}\s+EngineVersion='
  filter_optional_hexnode:
    Data|contains: 'HostApplication=C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the Windows Remote Management (WSMAN) COM provider without the conventional PowerShell.exe host application, which may indicate lateral movement techniques employed by attackers. In this context, adversaries leverage WSMAN to execute commands remotely, potentially bypassing traditional security controls that monitor for PowerShell usage. The absence of PowerShell from the command execution context raises red flags, suggesting that the execution may be part of an attempt to evade detection.

  The primary objectives of an attacker using this method might include gaining unauthorized access to remote systems, establishing persistence, or executing malicious payloads for further exploitation within the environment. This activity aligns with the following MITRE ATT&CK techniques:
  - **Execution (T1059.001)**: Command and Scripting Interpreter: PowerShell
  - **Lateral Movement (T1021.003)**: Remote Services: Windows Remote Management

  The best evidence can typically be found in **Windows event logs**, specifically process creation events which capture details about command executions and associated host applications.

  ### Investigation Steps
  - **Review Windows Event Logs**: Examine Windows event logs for Process Creation (Event ID 4688) that include WSMAN provider activity. Pay particular attention to the absence of the PowerShell host application.
  - **Analyze Command Parameters**: Look for WSMAN command parameters that may indicate suspicious activity, such as unusual or unauthorized commands being executed through the WSMAN provider.
  - **Correlate with Network Activity**: Investigate network logs for unusual traffic patterns or connections related to WSMAN, particularly targeting internal systems that may not typically communicate with each other.
  - **Inspect Installed Software**: Check for any non-standard software installations or agents (e.g., Hexnode Agent) that could be misusing the WSMAN protocol and ensure their legitimacy.

  ### Prioritization
  This alert carries medium severity due to its potential impact, as unauthorized use of WSMAN can lead to significant breaches of security and data integrity in an enterprise environment, especially when lateral movement within the internal network is facilitated.

  ### Blind Spots and Assumptions
  There may be gaps in detection for legitimate administrative activities that also leverage WSMAN, potentially leading to false positives. The detection logic assumes the absence of PowerShell is indicative of malicious behavior, as some legitimate applications may also use WSMAN without it. Specific logs like Windows Event IDs for process creation must be enabled and properly configured for the alert to function as intended.

