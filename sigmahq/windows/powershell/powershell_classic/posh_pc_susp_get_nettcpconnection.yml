note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell command `Get-NetTCPConnection`, which is utilized by attackers to discover active network connections on a compromised system. By executing this command, adversaries can gather intelligence about both incoming and outgoing connections, helping them to map out the network and identify potential targets for further exploitation or lateral movement. This behavior is indicative of reconnaissance phases of an attack, where understanding network topology is crucial for an attacker’s objectives.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Discovery** (TA0007) and **Network Service Discovery** (T1049). These techniques involve gathering information about network services and connections that can be exploited. The primary data source for detecting this activity is process creation events on Windows systems, which log command execution details, including the command lines used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for instances of the `Get-NetTCPConnection` PowerShell command. Focus on correlating these instances with known user accounts or unusual times that may indicate malicious activity.

  - **Correlate with Network Traffic**: Analyze network traffic logs to identify any unusual outbound connections that coincide with the command execution. This may provide insights into the intent behind the reconnaissance activity.

  - **Assess User Activity Context**: Investigate the user account that executed the command. Look for anomalies in their regular behavior or any signs that they are a compromised account.

  - **Analyze System Logs for Persistence Mechanisms**: Explore system logs to determine if any additional steps were taken following the use of this command, such as the establishment of remote access tools or creation of new accounts for persistence.

  ### Prioritization
  The alert is prioritized as **low severity** because, while it indicates reconnaissance behavior that could lead to further attacks, the command can also be used legitimately for network administration tasks. Additional context and correlation are essential to assess the risk level accurately.

  ### Blind Spots and Assumptions
  This detection may miss instances where the command is executed with obfuscation techniques, such as using encoded commands or through scripts that do not directly log the command in traditional formats. The detection logic assumes that PowerShell logging is enabled and properly configured to capture sufficient details, including command line inputs. In environments with strict script execution policies, legitimate administrative usage may lead to false positives if not carefully monitored. Ensuring comprehensive logging of PowerShell activities is essential for effective detection.

