  ### Technical Context

  The detection rule identifies the use of the PowerShell command `Get-NetTCPConnection`, which is frequently employed by adversaries to query system network connections. This behavior suggests an information-gathering objective, wherein the attacker seeks to map out active network communications on the compromised system, aiding further exploit or lateral movement efforts. The relevant MITRE ATT&CK tactic is Discovery and the technique is Network Service Discovery (T1049).

  Primary telemetry for this rule includes Windows PowerShell execution logs and relevant telemetry related to command execution (e.g., Sysmon Event ID 1 or Security Event ID 4688). If this command is run maliciously, it could indicate the adversary is preparing to exploit exposed services or gathers intel on the network. This detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also invoke this command.

  ### Investigation Steps

  - **Review recent PowerShell executions:** Check the relevant Security Event ID 4688 logs for the execution of `powershell.exe` and identify the parent process. Look for unusual parent processes such as `cmd.exe` or `wscript.exe` which could indicate malicious use.

  - **Analyze PowerShell arguments:** Validate the `CommandLine` field for the execution of `Get-NetTCPConnection`. Legitimate administrative scripts may include this command, but suspicious parameters could signify malicious intent.

  - **Check for unusual network connections:** Use Sysmon Event ID 3 logs to observe DLL and network connection activity made by the identified process. High-risk connections to known bad IPs should be noted as malicious indicators.

  - **Identify context around execution:** Examine the timestamps of the PowerShell command relative to other suspicious activity on the host. If it follows system compromise signs (like unexpected account logins), it strengthens the chance of malicious intent.

  - **Look for multiple query commands:** Confirm if the same user or account has executed `Get-NetTCPConnection` multiple times in a short period. This behavior can point to ongoing reconnaissance activities that are atypical for legitimate users, especially on critical assets.

  ### Prioritization

  Given the low severity of the alert, the impact on affected systems typically warrants lower priority unless correlated with other malicious indicators. However, the likelihood of abuse increases within compromised hosts used for reconnaissance, making it essential to analyze within the context of other alerts and anomalies. This command is known to be leveraged by adversaries during lateral movement attempts.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative methods to list network connections, such as using compiled executables or other scripting languages. For reliable detection, ensure that both PowerShell logging is enabled and Sysmon is configured to capture process creation events. Legitimate use cases may include administrative tasks during network diagnostics. A related detection to strengthen coverage would be PowerShell commands related to process discovery (e.g., `Get-Process`), as this can corroborate network reconnaissance behaviors.

