note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell to invoke the `Remove-ADGroupMember` cmdlet, which is typically employed to revoke user accounts from a specific group, such as removing accounts from the Domain Admin group. The behavior indicates a potentially malicious action where an adversary may attempt to disrupt legitimate user access or privilege, lowering the overall security posture of the organization. Relevant MITRE ATT&CK tactics and techniques include **Impact (TA-0039)** and **Valid Accounts (T1078)**.

  The primary telemetry sources required for this detection are Windows PowerShell logs, specifically those that capture script block execution (i.e., Event IDs related to PowerShell and Script Block Logging). If malicious, the security impact could be severe, as it may result in loss of administrative access for critical accounts or services. This detection does NOT confirm if the action was authorized or if the underlying intent was malicious without further context and supporting evidence.

  ### Investigation Steps

  - **Check PowerShell Execution Logs:** Review Windows Event ID **4104** to identify the exact command and context surrounding the `Remove-ADGroupMember` invocation. Analyze the timestamp and the user account executing the command for anomalies.

  - **Identify User Account Modifications:** Utilize Active Directory event logs (Event ID **4728** for group membership changes) to correlate and confirm if legitimate administrative processes occurred around the same time. Look for patterns such as normal operational hours and expected accounts.

  - **Assess Account and Group Membership Changes:** Validate any changes made to the Domain Admin group by checking the AD group memberships with tools such as `Get-ADGroupMember`. Compare the current membership against a known baseline or the last authorized change.

  - **Review PowerShell Remoting Sessions:** Examine PowerShell remoting logs and Active Directory event logs (Event ID **4624**) for atypical logins or remotely initiated sessions by non-administrative accounts that may have executed the command.

  - **Investigate External Collaborators or Third Parties:** Look for any recent changes to permissions for contractor or third-party accounts that might indicate legitimate administrative activity versus potentially malicious intent. Trace back actions against the timeline of group membership adjustments.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact on critical systems and the risk associated with removing administrative access. While there are legitimate reasons for modifying group memberships, the specific use of the `Remove-ADGroupMember` cmdlet often indicates an attempt to exploit permissions, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may be circumvented if Script Block Logging is not properly configured or if logging is disabled. Legitimate administrative tasks or automated scripts performing group modifications might trigger this alert. Companion detections such as those capturing `Add-ADGroupMember` actions (to highlight contrasting membership changes) can provide additional context and strengthen investigation coverage.

