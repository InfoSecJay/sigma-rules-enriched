note: |
  ### Technical Context
  This detection rule identifies attempts to remove accounts from the Domain Admin group using PowerShell commands. The logged activity reveals adversarial behavior aimed at disrupting access for legitimate users, potentially facilitating further compromise or denial of service against critical system resources. Attackers may exploit this tactic to elevate their privileges or deny operational capabilities to security personnel, thereby achieving their objectives of lateral movement or service interruption.

  This behavior is associated with the MITRE ATT&CK technique T1531 - "Account Access Removal," wherein adversaries make modifications to user accounts to hinder access or control over administrative resources. Detecting such actions early can prevent unauthorized escalation and mitigate the impact before further exploitation occurs. The primary data sources providing critical insights for this detection include PowerShell script block logs, which must be enabled to capture the specific commands executed in the context of the malicious action.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate PowerShell script block logs to identify any usage of the `Remove-ADGroupMember` command, which indicates attempts to modify group memberships.
  - **Check Group Membership Changes**: Analyze changes in Active Directory group memberships, particularly for the Domain Admin group, to confirm if any unauthorized removals have occurred.
  - **Audit Account Activity**: Review logs for related account activities, such as login attempts and account lockouts, to determine whether the affected accounts were used in suspicious activity before removal.
  - **Verify Script Block Logging**: Ensure that script block logging is enabled in your PowerShell environment, as this is critical for capturing and analyzing the commands that trigger the alert.

  ### Prioritization
  Given the potential impact of an attacker removing legitimate admin account access, this alert is considered medium priority. If not addressed, it could lead to weakened security posture and loss of access to critical administrative functions.

  ### Blind Spots and Assumptions
  Detection coverage could be limited in environments where script block logging is not enabled or where PowerShell logs are not retained effectively. The detection logic assumes that malicious actors will employ the specific command and that there are adequate logging mechanisms in place to capture and correlate these actions. Additionally, variations in PowerShell command usage or obfuscation techniques might evade detection if not accounted for in logging practices.

