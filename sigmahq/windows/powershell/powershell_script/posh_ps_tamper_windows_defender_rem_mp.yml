note: |
  ### Technical Context

  This rule detects attempts by an adversary to modify or disable Windows Defender settings using the `Remove-MpPreference` PowerShell cmdlet. The likely objective of the attacker is to evade detection and protection mechanisms of Windows Defender, reducing the effectiveness of the host's defensive posture against malware and other malicious activities. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion: T1562.001 – "Modify/Create System Process: Tactics".

  Primary telemetry sources include Windows PowerShell script block logs with Script Block Logging enabled, specifically looking for events where the `Remove-MpPreference` cmdlet is used. If malicious, this activity could lead to unauthorized access, data exfiltration, or deployment of additional malware on the system. This detection does NOT confirm that the device has been compromised or that malicious activity is occurring; additional context and investigation are required.

  ### Investigation Steps

  - **Review executed PowerShell commands**: Check Windows PowerShell log entries (Event ID 4104) for specific occurrences of the `Remove-MpPreference` cmdlet, filtering for timestamps around the alert to assess the context of the command usage.

  - **Analyze associated process creation**: Investigate Security Event ID 4688 to identify parent process events related to the execution of the PowerShell cmdlet, looking for indications of suspicious parent processes or unusual execution patterns.

  - **Establish established baseline**: Review past usage of `Remove-MpPreference` in your environment by checking for legitimate IT operations that detail the use of controlled folder access or similar settings, establishing what normal behavior looks like.

  - **Identify high-confidence indicators**: Look for alterations to Defender configurations, such as changes to `ControlledFolderAccessProtectedFolders` or modifications to `AttackSurfaceReductionRules`, by monitoring the Windows Defender configuration logs, specifically fields related to `MpPreference`.

  - **Correlate with other alerts**: Cross-reference this detection with any alerts related to lateral movement or command and control (C2) indicators such as unusual network traffic (proxy or firewall logs) that may signify attempted exploitation or a more comprehensive attack pattern.

  ### Prioritization

  This alert is considered high-severity due to the critical nature of Windows Defender in maintaining endpoint security. The likelihood of malicious abuse is high, as disabling or altering security configurations is a common tactic among adversaries. The behavior is well-documented and frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  The detection may be limited by potential evasion techniques, such as attackers running scripts from obfuscated or remote locations that do not generate the expected logs. Required configurations include ensuring Script Block Logging is enabled across all endpoints. Legitimate administrative scripts may trigger this alert; hence, context is critical. Related detections involving unauthorized changes to Group Policy settings or similar security configurations can enhance overall coverage.

