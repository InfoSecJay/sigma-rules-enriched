note: |
  ### Technical Context
  This detection rule identifies attempts to alter the configuration of Windows Defender by using the `Remove-MpPreference` cmdlet via PowerShell script block logging. The primary threat scenario is that an attacker may aim to disable or modify Windows Defender settings to evade detection while executing malicious activities on a compromised system. By tampering with these configurations, an attacker can gain a foothold in the environment, leverage persistence mechanisms, and perform further nefarious actions with a reduced risk of being detected by built-in defenses.

  The following MITRE ATT&CK tactics and techniques apply to this detection:
  - **Tactics**: Defense Evasion
  - **Techniques**: T1562.001 - Remove/Modify Security Tools

  Relevant telemetry for this detection primarily focuses on PowerShell script logs, specifically those that document the execution of scripts and associated commands being invoked. Enabling Script Block Logging is crucial as it provides visibility into the command execution context, allowing anomalies like the removing of Windows Defender preferences to be detected.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script logs for events that indicate the execution of `Remove-MpPreference` within a user session or scheduled tasks. Look for associated parameters that may signal broader tampering efforts.

  - **Analyze Recent Changes**: Assess the configuration settings of Windows Defender by checking the current preferences using the `Get-MpPreference` cmdlet. Compare these settings against historical data to identify unauthorized changes.

  - **Inspect Event Logs**: Look through Windows Event Logs, particularly the Security and Microsoft-Windows-PowerShell logs, for related activities that may correlate with suspicious `Remove-MpPreference` executions.

  - **Correlate User Behavior**: Identify the user accounts associated with the PowerShell activity. Cross-reference with user behavior analytics to ascertain if the activity deviates from normal usage patterns, especially if the executed commands suggest insider threats or compromised accounts.

  ### Prioritization
  The alert is of high severity in an enterprise environment, as tampering with security configurations can have critical implications on the organization's overall security posture, enabling attackers to operate undetected for extended periods.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage for legitimate administrative scripts that might inadvertently trigger this rule, potentially leading to false positives. The detection logic assumes that Script Block Logging is enabled and correctly captures all relevant PowerShell executions. If the logging is not configured or is disabled, critical events may go undetected, validating the necessity for comprehensive logging solutions across endpoints.

