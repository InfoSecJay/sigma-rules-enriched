note: |
  ### Technical Context

  This Sigma rule detects the removal of Windows Defender configurations using the `Remove-MpPreference` cmdlet via PowerShell. Attackers likely aim to disable security controls and defenses, such as controlled folder access or attack surface reduction rules, to facilitate further actions undetected. Relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and specifically the technique of Impair Defenses (T1685). The primary telemetry sources for this detection are PowerShell script block logs, which must be enabled on the target systems. If malicious, this behavior significantly reduces the system's defenses, increasing exposure to threats and potential breaches. It is important to note that this detection does not confirm successful exploitation or compromise on its own, as benign administrative actions may yield similar command usage.

  ### Investigation Steps

  - **Review PowerShell command execution logs:** Validate logs showing the execution of `Remove-MpPreference` with Event ID 4104. Look for abnormal contexts or user accounts executing this cmdlet that deviate from enterprise norms.

  - **Identify configuration changes:** Check for changes in Defender settings post-command execution in the Windows Event log (Event ID 5007) related to the Windows Defender service. Look for indications that specific rules were disabled or altered.

  - **Understand expected user behavior:** Determine if the user account executing the command is associated with legitimate administrative tasks. Note legitimate usage typically involves IT personnel making incremental Defender configuration changes, with corresponding justification in change management records.

  - **Correlate with user activity patterns:** Cross-reference user account activity during the time frame of the alert with the Security Event Log (Event ID 4624) for logon events, particularly focusing on unusual logon types or times that don’t match user roles.

  - **Investigate potential automation or scripts:** Collect details around any PowerShell scripts containing `Remove-MpPreference`, analyzing Script Block logging (Event ID 4103) to assess if this behavior is part of a larger automated attack pattern rather than a one-off command.

  - **Match against baseline configurations:** Compare the current settings from Windows Defender Settings (using `Get-MpPreference`) against established security policies and settings to identify unauthorized changes that may represent malicious intent.

  ### Prioritization

  This alert is deemed high-severity due to the potential implications of disabling critical security features on impacted systems. The likelihood of malicious abuse is high, as tampering with Windows Defender configurations is a common tactic employed by adversaries to gain persistence or control over systems.

  ### Blind Spots and Assumptions

  Detection limitations include adversaries' potential use of obfuscation techniques or different cmdlets to achieve similar outcomes, which could evade this specific detection. Log sources must be consistently configured for PowerShell script block logging to ensure reliable detection, as any lapses can result in gaps in visibility. Legitimate administrative scripts may trigger this alert if not properly justified. Related detections that strengthen coverage include monitoring for other cmdlets that modify Defender settings or logs indicating suspicious PowerShell usage in conjunction with process creation events.

