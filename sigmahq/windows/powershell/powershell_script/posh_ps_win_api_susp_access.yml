logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
    # Note: Add more suspicious combinations in the form of different selections
  selection_injection:
    ScriptBlockText|contains|all:
    - 'VirtualAlloc'
    - 'OpenProcess'
    - 'WriteProcessMemory'
    - 'CreateRemoteThread'
  selection_token_steal:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'LookupPrivilegeValue'
    - 'AdjustTokenPrivileges'
  selection_duplicate_token:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'DuplicateTokenEx'
    - 'CloseHandle'
  selection_process_write_read:
    ScriptBlockText|contains|all:
    - 'WriteProcessMemory'
    - 'VirtualAlloc'
    - 'ReadProcessMemory'
    - 'VirtualFree'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of Windows API calls within PowerShell scripts, which may indicate malicious behavior such as process injection, privilege escalation, or token manipulation. Attackers often use PowerShell as a preferred method for executing commands because it can be powerful and stealthy, allowing them to leverage the underlying Windows functionality without triggering immediate alarms from traditional security tools. By observing calls to functions such as `VirtualAlloc`, `OpenProcess`, and `WriteProcessMemory`, the rule aims to identify potentially unauthorized or nefarious activities that align with the tactics of sophisticated threat actors.

  The likely attacker objectives could range from installing malware (such as injectors that load malicious payloads into legitimate processes) to conducting credential theft by manipulating process tokens or creating backdoors in system processes. These methodologies are heavily featured in advanced persistent threats (APTs) or other actors employing techniques outlined in the MITRE ATT&CK framework, specifically *Execution* tactics: `T1059.001` (PowerShell) and `T1106` (Execution of Unmanaged Code).

  Primary data sources for this detection include PowerShell script block logs, which must be enabled, as they provide insight into the specific commands being executed by PowerShell, making it possible to recognize patterns indicative of malicious activity.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Examine PowerShell script block logging for the specific script block text that triggered the alert, focusing on the presence of API calls like `VirtualAlloc` and `OpenProcess`.

  - **Analyze Process Activity**: Check the process creation and termination logs around the time of the script execution to identify any related processes that might have been spawned or manipulated, including unexpected parent-child relationships.

  - **Investigate Token Manipulation**: Verify if there is any unusual token manipulation by cross-referencing the `OpenProcessToken` and `AdjustTokenPrivileges` calls with the associated user accounts and their permission levels.

  - **Correlate Events with Threat Intelligence**: Utilize any available threat intelligence to correlate the behaviors observed with known malicious activities or actors, helping to validate whether this is part of a larger attack campaign.

  ### Prioritization
  The severity of this alert is high due to the potential impact on the enterprise's security posture. Successful exploitation of these techniques can lead to significant compromise, including unauthorized access to sensitive data, lateral movement within a network, and deployment of persistent threats.

  ### Blind Spots and Assumptions
  One possible blind spot in this detection could include environments where script block logging is not enabled, leading to potential loss of visibility into PowerShell activities. Additionally, the detection logic assumes that the presence of certain functions in scripts directly correlates to malicious intent, which might not account for benign use cases. Proper logging of process creation and successful API calls is essential for comprehensive alerting, and any misconfiguration may hinder the effectiveness of this detection rule.

