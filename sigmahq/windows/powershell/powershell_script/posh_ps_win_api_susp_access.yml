logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
    # Note: Add more suspicious combinations in the form of different selections
  selection_injection:
    ScriptBlockText|contains|all:
    - 'VirtualAlloc'
    - 'OpenProcess'
    - 'WriteProcessMemory'
    - 'CreateRemoteThread'
  selection_token_steal:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'LookupPrivilegeValue'
    - 'AdjustTokenPrivileges'
  selection_duplicate_token:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'DuplicateTokenEx'
    - 'CloseHandle'
  selection_process_write_read:
    ScriptBlockText|contains|all:
    - 'WriteProcessMemory'
    - 'VirtualAlloc'
    - 'ReadProcessMemory'
    - 'VirtualFree'
  selection_local_shellcode_injection:
    ScriptBlockText|contains|all:
    - 'VirtualAlloc'
    - 'GetDelegateForFunctionPointer'
    - 'Marshal.Copy'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of specific WinAPI functions in PowerShell scripts, indicating potential malicious activities such as process injection, token theft, or memory manipulation. Attackers may utilize these WinAPI calls to execute code directly in memory, evading traditional detection mechanisms based on file signatures or system-level changes. The relevant MITRE ATT&CK tactics include Execution (T1059.001) and Defense Evasion (T1106).

  The primary telemetry source is PowerShell Script Block Logging, which captures the executed script content, allowing the detection of suspicious function calls. If malicious, the impact can be severe, including unauthorized access, persistence mechanisms, or system compromise. Importantly, this detection does NOT confirm whether an attack has occurred on its own, as legitimate scripts may also use these API calls for valid purposes.

  ### Investigation Steps

  - **Check PowerShell Execution Policy:** Verify the execution policy with `Get-ExecutionPolicy`. If set to "Unrestricted" or "Bypass," it may indicate a higher risk of malicious usage.

  - **Review Script Block Logs:** Examine PowerShell script logs for Event ID 4104, specifically filtering for entries that contain any of the suspicious API calls. Look for unusual contexts or combinations not typical in standard operations.

  - **Identify Host Roles:** Assess the affected system's criticality and role (e.g., server, endpoint). Malicious usage is more concerning on critical infrastructure or domain-joined systems.

  - **Compare Against Legitimate Usage:** Search for known benign PowerShell scripts within the environment that utilize similar API calls but serve legitimate purposes, such as scripts for automation or administration.

  - **Correlate with Other Logs:** Investigate the surrounding logs (e.g., Event ID 4688 for process creation) to identify any parent-child process relationships that elucidate the context of the PowerShell execution. A command line with notable parameters should be considered suspicious.

  - **Identify High-Confidence Malicious Indicators:** Look for script artifacts like file paths or unusual execution times (e.g., outside of business hours) in conjunction with the detected API calls, which serve as strong indicators of compromise.

  ### Prioritization

  This alert carries a high severity level due to the potential for severe impact on the compromised system, including system-level control. The likelihood of abuse is moderate to high, as many adversaries utilize these techniques to evade detection and maintain persistence. Additionally, process injection and token manipulation are commonly weaponized tactics in the current threat landscape.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of Script Block Logging, which must be enabled for reliable coverage. Legitimate administrative scripts may trigger this alert, making careful context evaluation critical. Moreover, detection may not cover all variations of API calls or implementations. Companion detections, such as monitoring for abnormal parent-child process relations or additional logging from EDR solutions, enhance coverage and provide a better investigative context.

