note: |
  ### Technical Context

  This Sigma rule detects the use of Windows API functions in PowerShell scripts, which could suggest attempts to exploit system processes for malicious purposes such as process injection or token stealing. The likely attacker objective is to execute code in memory, evading traditional detection capabilities that rely on file-based monitoring. Relevant MITRE ATT&CK tactics include Execution (T1059.001) and Credential Access (T1003). Primary telemetry sources are Windows Script Block Logging, specifically capturing PowerShell script execution events related to API calls. If malicious, this behavior can lead to unauthorized access to system processes. However, this detection does NOT confirm that malicious activity necessarily occurred, as legitimate applications can also leverage WinAPI calls.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Check Windows Event ID 4104 for script block logs containing suspicious API calls like 'VirtualAlloc', 'OpenProcess', or 'WriteProcessMemory'. Compare with known good scripts to identify anomalies.

  - **Validate the Source of the Command**: Identify the user or process that executed the PowerShell script by examining Event ID 4688 (Process Creation) for any unexpected or unauthorized accounts.

  - **Identify Legitimate Use Cases**: Determine if known applications or administrative scripts routinely use these WinAPI calls. Familiarize yourself with the organization's standard PowerShell usage patterns.

  - **Check for High-Confidence Malicious Indicators**: Look for sequences of WinAPI functions that are closely associated with known malware techniques, specifically those related to process injection or token manipulation.

  - **Correlate with Other Security Events**: Look for correlating suspicious activities documented in Security Event ID 5156 (Windows Filtering Platform) that could indicate lateral movement or exploitation.

  - **Assess Script Context**: Analyze the context in which the script block was executed, including paths and referencing parent processes to assess if the execution environment was valid or indicative of malicious intent.

  ### Prioritization

  This alert warrants high severity due to the potential impact on critical systems and the likelihood of malicious abuse. The techniques detected are well-known for evasion and exploitation, making them a common vector for attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where Script Block Logging is not enabled, making it essential for proper configuration. Legitimate administrative tasks and internal scripts may incorrectly trigger this detection, leading to false positives. A companion detection to consider is monitoring for abnormal PowerShell command-line parameters, enhancing the overall coverage for PowerShell abuse scenarios.

