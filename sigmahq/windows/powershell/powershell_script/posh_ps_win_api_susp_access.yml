logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
    # Note: Add more suspicious combinations in the form of different selections
  selection_injection:
    ScriptBlockText|contains|all:
    - 'VirtualAlloc'
    - 'OpenProcess'
    - 'WriteProcessMemory'
    - 'CreateRemoteThread'
  selection_token_steal:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'LookupPrivilegeValue'
    - 'AdjustTokenPrivileges'
  selection_duplicate_token:
    ScriptBlockText|contains|all:
    - 'OpenProcessToken'
    - 'DuplicateTokenEx'
    - 'CloseHandle'
  selection_process_write_read:
    ScriptBlockText|contains|all:
    - 'WriteProcessMemory'
    - 'VirtualAlloc'
    - 'ReadProcessMemory'
    - 'VirtualFree'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of Windows API calls via PowerShell scripts that may indicate malicious intent to manipulate process memory, escalate privileges, or perform token manipulation. The likely attacker objective is to execute code in the context of another process or manipulate user privileges, often as part of lateral movement or persistence strategies.

  This detection aligns with the MITRE ATT&CK tactics of Execution (T1059.001) and Credential Access (T1106). The primary telemetry sources required for this rule include PowerShell Script Block Logging, specifically looking at the `ScriptBlockText` field. A malicious use of these APIs could lead to unauthorized access or data exfiltration, posing significant security risks. Importantly, this alert does NOT confirm malicious activity on its own, as legitimate administrative tasks may trigger similar behaviors.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs:** Search for Security Event ID 4104 in Windows event logs. Review the `ScriptBlockText` to identify any usages of the flagged WinAPI calls such as `VirtualAlloc`, `OpenProcess`, or `WriteProcessMemory`.

  - **Review Context of PowerShell Execution:** Determine the context in which the PowerShell script was executed by investigating the parent process and the command line arguments in Security Event ID 4688 (Process Creation). Look for unusual parent processes or unexpected command-line usage.

  - **Identify Known Good vs. Malicious Patterns:** Compare the identified `ScriptBlockText` against known legitimate administrative scripts within your environment to establish a baseline of expected behaviors.

  - **Analyze Event Logs for User Privilege Changes:** Depending on the usage of functions related to privilege escalation (e.g., `OpenProcessToken`, `AdjustTokenPrivileges`), check Security Event IDs 4670 or 4672 for any abnormal privilege assignments or token manipulations that align with these function calls.

  - **Investigate Remediation Protocols:** If a malicious indicator is confirmed, such as the use of `CreateRemoteThread` with suspicious processes, initiate incident response procedures and isolate affected systems.

  ### Prioritization

  This alert is of high severity given that any detected usage of these functions typically indicates an attempt to exploit system processes or escalate privileges. The likelihood of malicious abuse is substantial, as these methods are commonly leveraged in attack scenarios to bypass defenses or carry out unauthorized actions.

  ### Blind Spots and Assumptions

  Evasion techniques may involve obfuscation of scripts or using legitimate PowerShell functionality, making detection challenging. The reliability of this detection relies on having Script Block Logging enabled; without it, related activities may go undetected. Legitimate administrative actions or application updates could trigger the alert. Related detections, such as those for unusual process creations or anomalous user access patterns, can strengthen overall coverage and context.

