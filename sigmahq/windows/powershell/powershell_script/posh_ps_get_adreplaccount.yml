note: |
  ### Technical Context

  This Sigma rule detects the use of the `Get-ADReplAccount` command via PowerShell, which is part of the DSInternals module. This command is commonly used to query replication information for Active Directory accounts, typically with the objective of gathering sensitive information about AD objects. The relevant MITRE ATT&CK tactic is Credential Access and the technique is T1003.006. Primary telemetry sources include Windows PowerShell logs, specifically Script Block Logging, which captures commands executed within PowerShell sessions.

  If executed by an unauthorized adversary, this behavior could lead to information disclosure of Active Directory accounts and their replication status. However, this detection alone does not confirm malicious intent; legitimate administrative scripts may also utilize this command.

  ### Investigation Steps

  - **Check PowerShell script logs**: Review Windows PowerShell logs (Event ID 4104) for Script Block Logging to identify instances of `Get-ADReplAccount` used. Look for any unusual patterns in execution time or user accounts running the commands.

  - **Identify user context**: Determine the user context in which the command was run. Compare the executing user's role against expected behavior; for example, domain admins may legitimately use this command, while non-admin users typically should not.

  - **Review related processes**: Investigate surrounding PowerShell process executions (Event ID 4688 or Sysmon Event ID 1) for suspicious activity. Look for anomalies such as command lines including `-All` or `-Server`, which may indicate bulk querying or targeting specific servers.

  - **Correlate with AD account access**: Cross-reference the executed command with recent account access logs from Active Directory (e.g., Security Event ID 4662). Look for related changes or enumerated accounts that could indicate reconnaissance activities by an attacker.

  - **Check for legitimate use cases**: Identify any scheduled tasks or known maintenance scripts that may legitimately utilize `Get-ADReplAccount`. This can help in distinguishing benign activities from potential malicious ones.

  - **Monitor for file manipulation**: If applicable, validate any file creation or modifications related to DSInternals outputs, especially on systems hosting AD. Look for unexpected artifacts or data exfiltration signs via file share or remote access logs.

  ### Prioritization

  This alert is medium severity due to the potential impact on the security of Active Directory infrastructure. While the behavior could indicate reconnaissance efforts by adversaries, it is also leveraged commonly in administrative contexts, necessitating thorough investigation before classifying as malicious.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques such as obfuscation of the command or execution from a compromised service account with elevated privileges. Consistent and complete logging from both PowerShell and Active Directory is essential for reliable detection. Legitimate administrative activities could trigger this alert; therefore, correlating contextual user actions is vital. A companion detection would be monitoring for the execution of other DSInternals commands which might indicate more extensive reconnaissance or exploitation attempts in conjunction with `Get-ADReplAccount`.

