title: Suspicious Get-ADReplAccount
id: 060c3ef1-fd0a-4091-bf46-e7d625f60b73
status: test
description: |
  The DSInternals PowerShell Module exposes several internal features of Active Directory and Azure Active Directory.
  These include FIDO2 and NGC key auditing, offline ntds.dit file manipulation, password auditing, DC recovery from IFM backups and password hash calculation.
references:
- https://www.powershellgallery.com/packages/DSInternals
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.006/T1003.006.md#atomic-test-2---run-dsinternals-get-adreplaccount
author: frack113
date: 2022-02-06
tags:
- attack.credential-access
- attack.t1003.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Get-ADReplAccount
    - '-All '
    - '-Server '
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the use of the `Get-ADReplAccount` cmdlet from the DSInternals PowerShell Module, which allows access to sensitive features of Active Directory and is often used by attackers for credential access. The cmdlet can be employed to gather detailed information about Active Directory replication and account states, which attackers typically exploit to perform reconnaissance or privilege escalation within a compromised environment.

  In a threat scenario, an attacker may utilize the DSInternals module to enumerate Active Directory replicas and obtain sensitive information, including password hashes and account attributes, potentially leading to further system compromise and unauthorized access. The presumed goal of such an attack is to leverage this information for lateral movement or credential harvesting within the network.

  The relevant MITRE ATT&CK tactics and techniques applicable here include:
  - **Credential Access** (TA0006)
  - **Credential Dumping** (T1003.006)

  The primary data source for this detection will be Windows PowerShell script logs, specifically monitoring for script block logging that captures the execution of these potentially harmful commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Collect and analyze PowerShell script logs for instances of `Get-ADReplAccount` to confirm execution and gather context about the environment and user involved.
  - **Examine User Context:** Investigate the user account that executed the command. Check for unusual login patterns and any prior indications of compromise that may suggest malicious intent.
  - **Analyze Run Frequency:** Look for repeated executions of the command or other associated cmdlets from the DSInternals module, indicating possible automated or scripted reconnaissance activities by an attacker.
  - **Cross-Reference Logging Data:** Validate findings with additional data sources like Windows Security Event Logs and Active Directory logs to identify any subsequent unauthorized access attempts or privilege escalations.

  ### Prioritization
  This alert is marked as medium severity due to the potential for credential exposure and the significant impact it can have on securing sensitive systems within the enterprise. Given the likelihood of exploitation in Active Directory environments, timely investigation is crucial.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage to consider. The detection logic assumes that Script Block Logging is consistently enabled across all relevant PowerShell environments, which may not be the case in every organization. If logging is not configured, instances of `Get-ADReplAccount` will go undetected. Additionally, the detection might yield false positives from legitimate administrative tasks, necessitating further contextual analysis to differentiate benign from malicious activity.

