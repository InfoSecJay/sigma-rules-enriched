  ---

  ### Technical Context

  This rule detects the execution of the `Get-ADReplAccount` command from the DSInternals PowerShell Module. This command is typically used to query Active Directory replication information, which could signify reconnaissance efforts within the environment, commonly aimed at gathering sensitive information or exploiting vulnerabilities related to Active Directory replication. The relevant MITRE ATT&CK tactic and technique are Credential Access (TA0006) and Credential Dumping (T1003.006).

  The primary telemetry source for this detection is PowerShell script execution logs, requiring Script Block Logging to be enabled. If malicious, successful execution may enable an adversary to extract privileged information such as user credentials or configuration settings, facilitating further unauthorized access. Notably, this detection does NOT confirm successful data extraction or exploitation by itself; it merely indicates that the command was invoked.

  ---

  ### Investigation Steps

  - **Check for legitimate usage: Review recent PowerShell scripts:** Examine recent script executions for expected usage of Active Directory commands or administrative tasks. Legitimate scripts may include regular AD maintenance or auditing activities, while unusual parameters in scripts should be scrutinized.

  - **Identify suspicious execution contexts: Verify user context of the command:** Investigate the executing user, especially if it's a low-privilege account or service account. Cross-reference with known administrative roles using Security Event ID 4624 or PowerShell Event ID 4104.

  - **Review PowerShell logs for details:** Look at the PowerShell console logs (Event ID 4104) for parameters used with `Get-ADReplAccount`, focusing on unusual flags or server arguments. Legitimate use cases typically target expected domain controllers or omit unnecessary parameters.

  - **Correlate with other logs for signs of compromise:** Assess relevant Active Directory logs (e.g., Windows Event ID 4662, Audit Directory Service Changes) to identify any related modifications or unauthorized access patterns. Multiple failed access attempts preceding the command execution may indicate malicious intent.

  - **Evaluate system role and asset criticality:** Determine if the host executing the command is a domain controller or an administrative machine. Given that any interaction with domain controller information can impact the overall network security, pay special attention to alerts from these types of systems.

  - **Identify high-confidence malicious indicators:** Look for established patterns involving DSInternals—such as frequent or repetitive use of `Get-ADReplAccount` from non-administrative accounts, especially during unusual hours. This behavior might indicate misuse of the DSInternals toolset for unauthorized access.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on the Active Directory environment. The likelihood of malicious intent is plausible as the behavior leverages internal administrative tools commonly used in both legitimate and malicious contexts.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through obfuscation of PowerShell commands. This rule primarily relies on Script Block Logging being enabled, which may not always be configured. Furthermore, legitimate administrative scripts may trigger this alert if they call `Get-ADReplAccount` for valid purposes, necessitating careful analysis. Related detections, such as monitoring for unusual PowerShell module invocations or significant changes in AD structures (Event ID 4661), can provide additional context to enhance visibility into potentially malicious activity.

