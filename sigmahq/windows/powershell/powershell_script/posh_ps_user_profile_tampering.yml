title: Potential Persistence Via PowerShell User Profile Using Add-Content
id: 05b3e303-faf0-4f4a-9b30-46cc13e69152
status: test
description: Detects calls to "Add-Content" cmdlet in order to modify the content
  of the user profile and potentially adding suspicious commands for persistence
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.013/T1546.013.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-08-18
modified: 2023-05-04
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.013
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_add:
    ScriptBlockText|contains: 'Add-Content $profile'
  selection_options:
    ScriptBlockText|contains:
            # Note: You can add more suspicious values
    - '-Value "IEX '
    - '-Value "Invoke-Expression'
    - '-Value "Invoke-WebRequest'
    - '-Value "Start-Process'
    - "-Value 'IEX "
    - "-Value 'Invoke-Expression"
    - "-Value 'Invoke-WebRequest"
    - "-Value 'Start-Process"
  condition: all of selection_*
falsepositives:
- Legitimate administration and tuning scripts that aim to add functionality to a
  user PowerShell session
level: medium
note: |
  ### Technical Context
  This rule detects the invocation of the PowerShell cmdlet `Add-Content`, specifically when it targets the user profile. The primary objective of this tactic is to modify a user's PowerShell profile script, potentially allowing an attacker to introduce malicious commands that execute automatically whenever the user starts a PowerShell session. This behavior is indicative of a persistence mechanism, as it can enable an adversary to maintain access to a compromised system.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1546.013)**, which involves techniques used by attackers to establish and maintain footholds in environments. Attackers may leverage this technique to ensure that malicious payloads are executed without direct user intervention, thus avoiding detection and increasing the likelihood of future successful attacks.

  The primary data sources for this detection include PowerShell script block logs, which require script block logging to be enabled on the targeted Windows systems. These logs provide insights into the scripts executed, helping responders identify unauthorized modifications made to user profiles.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs**: Analyze the logs for occurrences of `Add-Content $profile`, focusing on the context and content being added. Identify any potentially malicious entries or unusual patterns that may indicate nefarious activity.

  - **Cross-Reference User Activity**: Correlate the identified activities with user logs and any recent changes in user behavior. Determine whether there have been any suspicious logins or escalated privileges that may coincide with the execution of the detected command.

  - **Examine Compromised User Profiles**: Inspect the affected user profiles for newly added content or modifications to existing scripts. Look for any indicators of compromise or commands that might facilitate further unauthorized access, such as obfuscated scripts or calls to external resources.

  - **Conduct Contextual Threat Analysis**: Explore other logs and telemetry sources, such as Windows Event Logs or authentication logs, to elucidate the broader context of potential attacks. Look for patterns of lateral movement or privilege escalation that may relate to the detected powershell execution.

  ### Prioritization
  Given the nature of the detected activity and its potential to establish persistence, this alert should be treated with medium to high severity in an enterprise environment. The ability to embed malicious commands within user profiles poses an increased risk of ongoing access and data compromise.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if script block logging is not enabled on all relevant systems, as the rules rely on these logs for detection. Additionally, the detection assumes that legitimate administrative actions are not frequently using `Add-Content` to modify profiles in benign ways; therefore, legitimate scripts could trigger false positives. Environments must ensure that all necessary logging and monitoring configurations are properly set up to capture and evaluate PowerShell execution effectively.

