title: Potential Persistence Via PowerShell User Profile Using Add-Content
id: 05b3e303-faf0-4f4a-9b30-46cc13e69152
status: test
description: Detects calls to "Add-Content" cmdlet in order to modify the 
  content of the user profile and potentially adding suspicious commands for 
  persistence
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.013/T1546.013.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-08-18
modified: 2023-05-04
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.013
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_add:
    ScriptBlockText|contains: 'Add-Content $profile'
  selection_options:
    ScriptBlockText|contains:
            # Note: You can add more suspicious values
    - '-Value "IEX '
    - '-Value "Invoke-Expression'
    - '-Value "Invoke-WebRequest'
    - '-Value "Start-Process'
    - "-Value 'IEX "
    - "-Value 'Invoke-Expression"
    - "-Value 'Invoke-WebRequest"
    - "-Value 'Start-Process"
  condition: all of selection_*
falsepositives:
- Legitimate administration and tuning scripts that aim to add functionality to 
  a user PowerShell session
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Add-Content` to modify user profile scripts, potentially enabling persistence mechanisms by embedding malicious commands. The likely attacker objective is to create or modify PowerShell profile scripts to ensure that malicious code executes whenever a user opens a new PowerShell session. This behavior fits under the MITRE ATT&CK tactic of Persistence (TA0003) and specifically targets the technique T1546.013 (Event Triggered Execution).

  The primary telemetry source includes Windows PowerShell logs with Script Block Logging enabled. The security impact of this behavior is significant, as it allows attackers to maintain access or execute code automatically on system startup or user logon. However, this detection alone does NOT confirm malicious intent and may capture legitimate administrative activities that involve modifying user profiles for intended purposes.

  ### Investigation Steps

  - **Examine Powershell Logs for `Add-Content`:** Check Windows PowerShell logs (Event ID 4104) for instances of `Add-Content $profile`. Filter on fields that show the command's context to identify if the command was executed as part of a legitimate administration effort or automated tasks.

  - **Correlate with User Activities:** Review the timeline of user activities leading to the alert, considering legitimate activities involving PowerShell, such as script execution for user sessions (e.g., user-provided scripts). Use Event ID 4624 (Logon event) to correlate and understand user behavior.

  - **Identify Additional Command Usage:** Investigate other commands in the same ScriptBlock. Look for common malicious patterns (like `Invoke-Expression`, `Invoke-WebRequest`, or `Start-Process`) in Event ID 4104 fields. These commands combined with `Add-Content` raise confidence in malicious activity.

  - **Verify Script Path for Legitimate Context:** If the profile script being altered belongs to non-privileged users or unusual paths not used for legitimate purposes, document this as a high-confidence indicator of compromise.

  - **Assess Impact on Configured User Profile:** Evaluate the system's role and the criticality of the user profile being modified. Assess if any sensitive data or privileges may be leveraged through the changed profile, focusing on systems that handle critical business operations.

  ### Prioritization

  This alert carries a medium-severity rating due to the potential high impact of persistence on critical systems, the ease with which such techniques can be weaponized by adversaries, and their applicability in both legitimate administrative contexts and malicious exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection relies heavily on PowerShell Script Block Logging being enabled; without it, these actions may go unnoticed. Adversaries may use obfuscation techniques to disguise their payloads, potentially evading detection. Legitimate administrative operations, such as configuring user profiles for automation, might also trigger this alert. A complementary detection rule for identifying modifications to actual profile scripts can strengthen coverage, ensuring better defense against potential persistence mechanisms.

