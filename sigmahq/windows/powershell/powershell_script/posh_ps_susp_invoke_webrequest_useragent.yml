title: Change User Agents with WebRequest
id: d4488827-73af-4f8d-9244-7b7662ef046e
status: test
description: |
  Adversaries may communicate using application layer protocols associated with web traffic to avoid detection/network filtering by blending in with existing traffic.
  Commands to the remote system, and often the results of those commands, will be embedded within the protocol traffic between the client and server.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1071.001/T1071.001.md#t1071001---web-protocols
author: frack113
date: 2022-01-23
modified: 2025-07-18
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_webrequest:
    ScriptBlockText|contains:
    - 'Invoke-WebRequest'
    - 'Invoke-RestMethod'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a variable
    - 'iwr '
  selection_useragent:
    ScriptBlockText|contains: '-UserAgent '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the usage of PowerShell commands that manipulate the User-Agent header within web requests, specifically `Invoke-WebRequest` and `Invoke-RestMethod`. This behavior is indicative of adversaries attempting to obfuscate their communications with remote servers by mimicking legitimate web traffic, making it harder for security controls to flag their activities. The likely objective from the attacker’s perspective is data exfiltration or command-and-control (C2) communication, fitting within the MITRE ATT&CK framework under the **Command and Control** tactic (TA0011) and specifically the **Application Layer Protocol** technique (T1071.001).

  Primary telemetry sources include Windows PowerShell logs with **Script Block Logging** enabled, capturing details around the execution of scripts and commands. If the behavior is malicious, it can lead to unauthorized data disclosure or system compromise. However, this detection does NOT confirm that malicious activity is taking place, as legitimate applications might also employ similar web request patterns.

  ### Investigation Steps

  - **Verify the execution context**: Review PowerShell logs for Event ID 4104 capturing the specific Script Block Text. Confirm if the execution came from a trusted context (e.g., administrative scripts) or user-level scripts that appear suspicious.

  - **Identify the nature of User-Agent modifications**: Check for unusual or non-standard User-Agent strings being set with the `-UserAgent` flag. Compare against known legitimate User-Agent strings or document any anomalies (e.g., non-browser User-Agent in typical user environments).

  - **Correlate API usage with known malicious signatures**: Compare User-Agent strings from the logs against Threat Intelligence repositories for known malicious indicators. Look for strings commonly used in C2 environments.

  - **Assess legitimate operations**: Audit for instances where legitimate applications utilize `Invoke-WebRequest` or `Invoke-RestMethod`. Note the command frequency; typically, trusted applications would trigger such requests at predictable intervals or during specific workflows.

  - **Look for command-and-control indicators**: Analyze for unusual outbound connections linked to the detected PowerShell commands. Use network logs to validate the destination IP addresses or domain names and highlight any that are flagged as malicious.

  - **Check for related artifacts**: Validate any file creations or suspicious activities by correlating with Event ID 4688 for new process creations, particularly if a PowerShell instance spawned unusual parent-child relationships indicative of exploitation.

  ### Prioritization

  This alert holds medium severity due to its potential impact on sensitive systems and the moderate likelihood of malicious abuse. Altering User-Agent strings is a common evasion technique employed by attackers to disguise unauthorized communications, making it necessary for prompt investigation.

  ### Blind Spots and Assumptions

  Detection may miss advanced evasion techniques, such as modifications to PowerShell logging settings or the use of non-standard PowerShell execution policies. Reliable detection requires that Script Block Logging is enabled on all relevant endpoints. Legitimate activities, such as scripts used for automated health checks or integrations, may cause false positives. An additional detection rule focusing on anomalous outbound network connections (e.g., DNS requests or HTTP traffic) can enhance monitoring for similar malicious behaviors.

