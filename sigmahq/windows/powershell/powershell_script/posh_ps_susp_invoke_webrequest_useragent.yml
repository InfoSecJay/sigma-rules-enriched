title: Change User Agents with WebRequest
id: d4488827-73af-4f8d-9244-7b7662ef046e
status: test
description: |
  Adversaries may communicate using application layer protocols associated with web traffic to avoid detection/network filtering by blending in with existing traffic.
  Commands to the remote system, and often the results of those commands, will be embedded within the protocol traffic between the client and server.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1071.001/T1071.001.md#t1071001---web-protocols
author: frack113
date: 2022-01-23
modified: 2025-07-18
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_webrequest:
    ScriptBlockText|contains:
    - 'Invoke-WebRequest'
    - 'Invoke-RestMethod'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a variable
    - 'iwr '
  selection_useragent:
    ScriptBlockText|contains: '-UserAgent '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential command-and-control (C2) activity through the manipulation of user agents in PowerShell WebRequests. Adversaries often use application layer protocols associated with web traffic, such as HTTP or HTTPS, to stealthily communicate with remote systems and evade detection by blending in with legitimate traffic. By modifying the user agent string, attackers can disguise their network activity, effectively hiding their commands and any results from security monitoring tools.

  The relevant MITRE ATT&CK techniques for this detection include **T1071.001: Application Layer Protocol: Web Protocols**. This tactic is associated with attackers using common web protocols to create covert channels, making it harder for defensive measures to detect malicious activity. The primary data sources that will provide the best evidence for this rule include PowerShell event logs, specifically Script Block Logging, which captures the commands that are executed within PowerShell, including any alterations to user agents in web requests.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine the PowerShell event log entries for `ScriptBlockText` containing `Invoke-WebRequest` or `Invoke-RestMethod` with the `-UserAgent` parameter. Pay attention to the context of these commands, including timestamps and the user account executing them.

  - **Correlate Network Traffic:** Investigate network logs and traffic associated with the times of the specific PowerShell executions. Look for outbound web requests that match the user agent strings used in the identified PowerShell commands.

  - **Analyze Context of Commands:** Check for other indicators of compromise in the same session. Review process creation logs to identify if any suspicious processes were spawned in conjunction with the PowerShell commands.

  - **Identify Known User Agents:** Compile a list of known legitimate user agent strings for your environment, and compare them against the ones used in the suspicious requests to confirm any anomalies.

  ### Prioritization
  The medium severity of this alert in an enterprise environment is justified by the potential for undetected C2 channels, which could lead to further intrusion, data exfiltration, or persistence. Given that attackers often leverage application layer protocols to blend in, timely detection is crucial to mitigating risks.

  ### Blind Spots and Assumptions
  This rule may have gaps in detection coverage if PowerShell Script Block Logging is not enabled, as this would prevent capturing the relevant command executions. The detection logic assumes that attackers will use common PowerShell web commands with altered user agents, but more sophisticated attackers may disguise their methods further or utilize other scripting languages that do not invoke PowerShell's logging features. For the alert to function effectively, ensure that Script Block Logging is enabled and that network traffic monitoring is in place to correlate PowerShell activities with outgoing web requests.

