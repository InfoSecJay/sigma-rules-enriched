logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_webrequest:
    ScriptBlockText|contains:
    - 'Invoke-WebRequest'
    - 'Invoke-RestMethod'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a variable
    - 'iwr '
  selection_useragent:
    ScriptBlockText|contains: '-UserAgent '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_invoke_webrequest_useragent/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell cmdlets such as `Invoke-WebRequest` and `Invoke-RestMethod` with the modification of the User-Agent header. Adversaries may modify User-Agent strings to evade detection by blending malicious traffic with benign web requests. This behavior aligns with the MITRE ATT&CK technique T1071.001 (Application Layer Protocol: Web Protocols), which is commonly associated with command-and-control (C2) activities.

  The primary telemetry sources are PowerShell script block logs, specifically looking for events that capture the execution of web requests using these cmdlets with customized User-Agents. If malicious, this behavior might indicate data exfiltration or the execution of additional payloads. However, this detection does NOT confirm that the activity is inherently malicious, as legitimate scripts may also utilize these methods for benign purposes.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Examine PowerShell events (Event ID 4104) for executions containing `Invoke-WebRequest` or `Invoke-RestMethod` alongside `-UserAgent`. Focus on instances where the User-Agent is not from known applications or standard browser strings.

  - **Identify Malicious Indicators:** Look for unusual User-Agent strings that do not correlate with legitimate use. For example, a User-Agent that mimics a common web browser yet appears in an unexpected context (e.g., triggered from a non-interactive server) can indicate malicious activity.

  - **Evaluate Contextual Script Execution:** Determine if the script was executed from a scheduled task or a known administrative script. PowerShell scripts run on servers or user workstations should be validated against a whitelist to assess legitimacy.

  - **Inspect Network Traffic:** Utilize network monitoring to analyze outgoing traffic related to the identified PowerShell executions. Capture the destination domains or IP addresses to see if they correlate with known malicious infrastructure.

  - **Correlate With Other Alerts:** Cross-reference the execution of PowerShell scripts with additional alerts around suspicious outbound network traffic or unusual user behavior to identify patterns of compromise.

  ### Prioritization

  The severity for this alert is medium due to the potential impact on data confidentiality and integrity across the environment. Given that this detection may indicate attempts to establish command-and-control channels, albeit through benign-looking traffic, the likelihood of abuse is moderate. However, the use of customized User-Agents is a tactic that adversaries frequently employ, thus warranting close monitoring.

  ### Blind Spots and Assumptions

  Possible evasion techniques include the use of legitimate User-Agent strings and mimicking standard web traffic patterns, which can obscure malicious intent. Reliable detection requires ensuring that PowerShell script block logging is enabled and correctly configured. Legitimate activities may include automated systems reporting to APIs or legitimate administrative scripts. A complementary detection strategy might involve monitoring for changes to User-Agent strings in other contexts or analyzing similar command-line arguments in other scripting environments.

