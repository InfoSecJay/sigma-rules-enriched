note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell command `Get-AdDefaultDomainPasswordPolicy`, which is typically leveraged by attackers to enumerate the password policy of an Active Directory (AD) domain. By discovering the password policy, an attacker can gain insights into password complexity requirements, expiration periods, and other security settings, which could facilitate various attacks, such as password guessing or credential dumping.

  The primary MITRE ATT&CK tactic associated with this activity is **Discovery**, specifically technique **T1201: Password Policy Discovery**. This technique involves the enumeration of password policies to gain a better understanding of user account security settings, ultimately aiding in planning further attacks against the environment. The best telemetry sources to monitor this activity include PowerShell script logs, specifically when script block logging is enabled, as these logs will capture the exact commands being executed.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell script block logs for any instances of the command `Get-AdDefaultDomainPasswordPolicy`. Verify the context in which it was executed and the user account responsible.
  - **Analyze User Activity**: Assess the activity of the user account that executed this command. Look for any suspicious logins, particularly from unusual geographical locations or times, which could suggest compromised credentials.
  - **Examine Prior Activity**: Investigate whether the user performed any additional discovery-related commands or unusual account enumeration activities leading up to this event that may signify initial reconnaissance efforts.
  - **Check for Legitimate Use Cases**: Identify if the command was used in legitimate scripts or system administration duties. Cross-reference with expected administrative activities to determine if there may be a benign explanation.

  ### Prioritization
  The severity of this alert is considered low due to the potential for false positives stemming from legitimate administrative tasks. However, given the sensitive information that can be extracted through password policy discovery, it remains important to investigate recurrent or non-contextual occurrences.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage related to environments where script block logging is not enabled, as it relies on this logging to capture command usage effectively. Additionally, the detection's logic assumes that any use of `Get-AdDefaultDomainPasswordPolicy` is suspicious, which may overlook legitimate scenarios within administrative tasks. Organizations must ensure that proper logging configurations are in place to support this alert and that analysts are equipped to differentiate between benign and malicious activity.

