note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Get-AdDefaultDomainPasswordPolicy`, which queries the default password policy for an Active Directory (AD) domain. The likely attacker objective is to gather valuable information about password policies that could facilitate further attacks, such as password guessing or exploitation of weak password settings. This behavior aligns with the MITRE ATT&CK technique for discovery, specifically "Account Discovery" (T1201).

  The primary telemetry sources for this detection include PowerShell script logs, specifically those generated by Script Block Logging, which must be enabled for the rule to trigger. If malicious, obtaining this information can allow an adversary to plan credential attacks more effectively. Importantly, this detection does NOT confirm an attack on its own; legitimate administrative tasks may trigger similar activity.

  ### Investigation Steps

  - **Review Script Block Logging:**
    Obtain PowerShell logs (Event ID 4104) where `Get-AdDefaultDomainPasswordPolicy` was executed. Look for unusual timestamps, accounts, or parameters that may indicate malicious intent.

  - **Check User Sessions:**
    Analyze user activity from the same user account as the alert. Normal administrative users may execute this command, but look for any unexplained account access or abnormal login patterns indicating compromise.

  - **Identify Contextual Environment:**
    Verify if the command was run from an expected administrative host (e.g., Domain Controller). Unrecognized hosts executing this command may indicate lateral movement or unauthorized access.

  - **Compare Password Policy Information:**
    Assess the queried password policy against corporate security guidelines. Check if an adversary is targeting a domain with known weak policies; this can show intent or planning.

  - **Investigate Related Activities:**
    Look for additional commands or scripts running around the same time that may indicate suspicious behavior (e.g., enumerating users or searching for weak credentials).

  ### Prioritization

  The alert level is considered low due to the benign context of this command and the requirement of coordinating user privilege. However, if detected in unusual circumstances or by non-administrative accounts, it raises concerns as this behavior could be a precursor to more significant credential abuse or lateral movement activities.

  ### Blind Spots and Assumptions

  Detection relies on active enforcement of Script Block Logging; if not enabled, this command may go unnoticed. Legitimate PowerShell scripts executed by administrators may trigger the alert, making context crucial. Companions to this detection include monitoring for other account discovery commands like `Get-ADUser` and `Get-ADGroup`, which can signal broader reconnaissance activity.

