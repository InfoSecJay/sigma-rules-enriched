  ### Technical Context

  This detection identifies the use of the PowerShell command `Get-AdDefaultDomainPasswordPolicy`, which is designed to query details about the password policy set in an Active Directory (AD) domain. The likely attacker objective is to gather information about password complexity and expiration settings, which can aid in crafting credential attacks or guessing attacks. This activity correlates with the MITRE ATT&CK technique "Account Discovery" (T1087). The primary telemetry sources include PowerShell logs, specifically those generated by Script Block Logging, which need to be activated to capture relevant activity. If malicious, this behavior could lead to increased vulnerability for credential theft, allowing an attacker to exploit weak password policies. It is crucial to note that while this detection indicates that the command has been executed, it does not confirm malicious intent, as legitimate administrative activities may also result in this log entry.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for the command**: Check Event ID 4104 for entries containing `Get-AdDefaultDomainPasswordPolicy`. Look for unusual or unexpected execution in non-admin contexts.

  - **Analyze the user context**: Identify the user executing the command. If it’s a non-privileged user outside of expected administrative roles, this could indicate potential malicious activity.

  - **Cross-reference with account activity**: Verify if the user account has recently attempted other enumeration or reconnaissance commands, such as `Get-ADUser` or `Get-ADGroup`, which can signify an intent to prepare for further attacks.

  - **Evaluate the frequency of the command use**: Determine if there have been multiple triggers of this alert in a short timespan. Repeated password policy checks can indicate reconnaissance activity leading to an attack.

  - **Identify legitimate process execution**: Validate if the execution aligns with scheduled administrative tasks or routine maintenance scripts that are documented, as this can help distinguish benign from adversarial actions.

  - **Monitor for subsequent credential access activities**: If this command is followed by suspicious login attempts or credential dumping activities, this could corroborate potential exploitation efforts.

  ---

  ### Prioritization

  This alert is considered low priority due to the relatively benign nature of the command, which on its own may not indicate an immediate compromise. However, if executed by unauthorized users or followed by other suspicious activities, the severity could increase significantly since account discovery is a common precursor to more intrusive attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may miss activity if Script Block Logging is not enabled, potentially omitting crucial log entries. Attackers may evade detection by disguising this command within legitimate scripts or using alternative methods to gather password policy information. Furthermore, administrative tasks may trigger the rule unintentionally, necessitating a clear definition of expected behaviors. A related detection to consider is the monitoring of other AD-related enumeration commands, which could provide additional context for user activities.

