note: |
  ### Technical Context

  This Sigma rule detects the execution of Rubeus, a hack tool used for interacting with Kerberos tickets for credential access and lateral movement within a network. Likely attacker objectives include tableau credential theft via AS-REP Roasting, ticket-granting ticket (TGT) extraction, and the manipulation or issuance of service tickets to exploit authenticated sessions. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1003) and Lateral Movement (T1558.003).

  Primary telemetry sources include PowerShell script block logs, specifically requiring Windows Script Block Logging to be enabled. If malicious, successful execution could grant attackers elevated privileges, facilitate unauthorized access to systems, or compromise sensitive data. Importantly, this detection does NOT confirm successful credential theft or lateral movement on its own; further investigation is needed to assess the impact.

  ### Investigation Steps

  - **Inspect Script Block logs for indicators of Rubeus execution:** Review PowerShell script block logs (Event ID 4104) for the presence of Rubeus-related command line arguments such as 'asreproast' or 'kerberoast'.

  - **Verify the legitimacy of the executing user:** Check the user account (e.g., via Event ID 4624), focusing on whether this user typically runs security tools or has administrative privileges; anomalous behavior may indicate malicious intent.

  - **Correlate with network traffic logs:** Look for unusual Kerberos traffic (Event ID 4769, Service Ticket Requests) from the machine executing Rubeus. Legitimate requests are generally tied to non-malicious services.

  - **Check for persistence or follow-on activity:** Investigate subsequent authentication events to determine if additional lateral movements were attempted (e.g., Event ID 4624 with suspicious service names or remote sessions).

  - **Identify process ancestry:** Use the Event ID 4688 or Sysmon Event ID 1 to trace the command-line process tree up to the execution of Rubeus to understand the initiation context.

  - **Review execution paths for evidence of tampering:** Assess the execution path of Rubeus; legitimate administrative scripts might have predictable paths, contrasting with random or user profile directories often used by attackers.

  ### Prioritization

  This alert should be considered high priority due to its implications for credential theft and control over network resources. The likelihood of malicious use is significant, as Rubeus is deliberately designed for exploitative activities tied to authentication protocols. This behavior is known to be weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled or if attacks employ stealthy encoding techniques to obfuscate command execution. False positives are unlikely due to the specificity of Rubeus commands. Legitimate activities might include authorized administrative tasks involving Kerberos tickets. A related detection to strengthen coverage would be monitoring logins and privileges escalations associated with the user accounts that execute such scripts.

