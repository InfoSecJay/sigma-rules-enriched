note: |
  ### Technical Context

  This rule detects the execution of Rubeus, a hacktool used in credential theft and Kerberos attacks via specific command-line flags. The likely attacker objective is to harvest Kerberos tickets and perform lateral movement within a network, often targeting sensitive accounts. The relevant MITRE ATT&CK techniques include credential access (T1003) and Kerberoasting (T1558.003), as well as lateral movement methods (T1550.003). The primary telemetry source is Windows PowerShell Script Block logging, which captures intricate details of script execution, including specific command-line flags used by Rubeus. If the behavior is malicious, it poses a significant security threat as it enables attackers to gain unauthorized access to accounts and resources. Importantly, this detection does not confirm successful credential theft or lateral movement on its own, as it solely identifies the execution of Rubeus.

  ### Investigation Steps

  - **Verify Script Block Logs: ** Review PowerShell Script Block logs (Event ID 4104) to extract the specific command-line arguments used with Rubeus. Look for key command phrases such as 'kerberoast', 'asreproast', and 'createnetonly'.

  - **Assess User Context: ** Identify the user account executing the Rubeus script. Determine if the account has legitimate administrative privileges or if it is unusual for that account’s usage pattern.

  - **Check for Other Anomalous Activity:** Look for related logs in the Windows Security Event log (Event ID 4624) for any suspicious sign-ins or event patterns correlating with the execution time of Rubeus.

  - **Determine Legitimate Usage Scenarios:** Identify expected usage of PowerShell and legitimate administrative tasks that might incorporate similar command structures, such as scheduled tasks or automation scripts authorized by IT staff.

  - **Identify Malicious Indicators:** Confirm the presence of additional malicious indicators, such as DNS queries or outbound connections to known bad IPs associated with credential harvesting or lateral movement.

  - **Validate Presence of Artifacts:** Check for the creation of Kerberos ticket dump files or other artifacts. Use file creation timestamps and file paths to detect unauthorized dumps or unusual file locations.

  ### Prioritization

  This alert carries a high severity due to the potential impact on sensitive systems and the likelihood of credential abuse by malicious actors. Rubeus is commonly weaponized, particularly in targeted attacks against enterprises, where access to privileged accounts can lead to significant data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement of PowerShell Script Block logging being enabled. It can also produce false positives from legitimate administrative scripts or activities that may incorporate similar command flags. Additionally, attackers can employ evasive techniques to mask or obfuscate their command execution. A related detection worth considering is the monitoring of abnormal Kerberos ticket requests, which could complement findings related to command execution via Rubeus.

