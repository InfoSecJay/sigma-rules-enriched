note: |
  ### Technical Context
  This detection rule identifies the execution of Rubeus, a tool used for various Kerberos-related attacks, through specific command line flags commonly utilized by attackers. Rubeus leverages existing credentials for actions such as ticket granting and ticket renewal, enabling unauthorized access to resources in a network. Attackers deploying Rubeus aim to escalate privileges, conduct lateral movements, or exfiltrate sensitive credentials without detection.

  Related to the MITRE ATT&CK framework, this rule maps to the following tactics and techniques:
  - **Credential Access (T1003)**: Rubeus aids in credential theft via methods like "AS-REP Roasting" and "Kerberoasting," enabling attackers to compromise accounts.
  - **Defense Evasion (T1558)**: Through the misuse of legitimate tools, Rubeus evades detection mechanisms, making it easier for attackers to maintain their foothold.
  - **Lateral Movement (T1550.003)**: Utilizing harvested credentials, attackers can move laterally across the network to access other systems.

  The primary data sources for this detection include PowerShell script block logs, which must be enabled to capture the command line invocations associated with Rubeus executions.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logs for entries containing keywords outlined in the detection logic, such as 'asreproast' and 'kerberoast'. Ensure that the logs cover the period before and after the alerted activity.

  - **Correlate with User Activity**: Check for any unusual or suspicious user account activity in conjunction with the identified Rubeus commands. Look for patterns suggesting lateral movement or privilege escalation, especially involving administrative accounts.

  - **Analyze Event Logs**: Investigate Event ID 4624 (Logon) and 4672 (Special Privileges Granted to New Logon) across affected systems. Identify any anomalies, such as logins during unusual hours or from unexpected locations.

  - **Conduct Endpoint Forensics**: Collect and analyze forensic data from endpoints where Rubeus was detected. Check for additional suspicious processes or indicators of compromise (IoCs) that may suggest further intrusion by threat actors.

  ### Prioritization
  Given the high impact of credential theft and potential for lateral movement enabled by Rubeus, this alert is of high severity. The likelihood of exploit due to an active threat actor using this tool in a Targeted Enterprise environment justifies immediate investigation and response.

  ### Blind Spots and Assumptions
  This detection logic relies on the capability of PowerShell script block logging being enabled across the enterprise. If it is disabled, instances of Rubeus execution may go unnoticed. Furthermore, the methodology assumes that attackers primarily use the specified command flags, potentially overlooking alternative execution patterns that invoke Rubeus without these keywords. Additional logs from security tools like EDR or network monitoring may be required to provide a comprehensive view of the environment and detect Rubeus use in other contexts.

