note: |
  ### Technical Context

  This Sigma rule detects the execution of the hacktool Rubeus, which is often used by attackers to perform Kerberos ticket manipulation and credential harvesting techniques. The likely attacker objective is to gain unauthorized access to system resources through Kerberos ticket abuse, including obtaining valid tickets or escalating privileges. This behavior maps to the MITRE ATT&CK tactics of Credential Access (TA0006), particularly techniques such as Credentials from Password Stores (T1003) and Kerberoasting (T1558.003).

  The primary telemetry source for this detection is Windows PowerShell Script Block Logging, which must be enabled to capture detailed command executions. If malicious, successful execution of Rubeus could lead to credential theft or lateral movement within the environment. Importantly, this detection does NOT confirm that the executed command was successful or that any further exploitation occurred.

  ### Investigation Steps

  - **Verify Script Block Logging status**: Check if PowerShell Script Block Logging is enabled (Event ID 4104) to ensure that the relevant logs are being captured for this alert.

  - **Review command execution details**: Investigate the specific command executed by accessing PowerShell logs (Event ID 4104) and look for any of the following patterns: 'asreproast', 'kerberoast', or 'dump /service:krbtgt'. Legitimate commands typically will not contain these patterns.

  - **Identify user account and context**: Determine the user account that executed the command. Verify the account's privilege level and role to assess if the activity aligns with normal behavior (e.g., administrative accounts executing security-related scripts).

  - **Look for high-confidence malicious indicators**: Search for additional indicators associated with Rubeus usage. Focus on specific command patterns that include 's4u /user:' or 'asktgt /user:' and check for any associated processes (Sysmon Event ID 1) that may show unusual parent-child relationship patterns or unexpected parent executables.

  - **Correlate with other telemetry**: Investigate related events from Windows Event Logs such as Event IDs 4624 (logon events) and 4625 (failed logins) to identify anomalous authentication attempts following the Rubeus command execution.

  - **Examine asset criticality and impact**: Evaluate the severity and criticality of the impacted host, especially if it provides domain services or administrative access, as these could be prime targets for further compromise.

  ### Prioritization

  This alert should be considered high severity due to the potential for significant security impact on the enterprise. The capability to manipulate Kerberos tickets poses a serious risk of credential abuse and lateral movement, which is commonly leveraged by attackers in many engagement frameworks.

  ### Blind Spots and Assumptions

  The detection is limited by the need for Script Block Logging to be enabled, which may not always be the case in every environment. Potential evasion techniques include disabling logging or executing Rubeus in a manner that avoids detection (e.g., through encoded command execution). Legitimate administrative activities may occasionally trigger this alert if they involve legitimate Rubeus usage for testing purposes. A companion detection to strengthen coverage could include monitoring for atypical account behavior using Azure AD Sign-ins or suspicious Kerberos authentication patterns in Security Event logs.

