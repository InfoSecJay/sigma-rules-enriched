  ### Technical Context
  This detection rule aims to identify the use of the PowerShell command `Get-GPO`, which is leveraged to retrieve information about Group Policy Objects (GPOs) within a Windows domain. The ability to enumerate GPOs is a common tactic employed by threat actors seeking to understand an organization's security posture and to identify potential targets for privilege escalation or lateral movement. By gaining insight into GPO configurations, attackers can strategize on how to manipulate or evade security controls.

  The relevant MITRE ATT&CK tactics for this detection include **Discovery** (T1087), as the command is utilized specifically for gathering reconnaissance on the domain’s GPOs, falling under the technique identifier **T1615**, which pertains to **Accessing GPOs**. The primary data sources for this detection are PowerShell Script Block logs, which must be enabled to capture all executed PowerShell commands. The detection focuses on anomalous executions of this command, especially in contexts where its invocation would be atypical.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Investigate the script block logs to identify the specific invocation of `Get-GPO`, including the user context and any arguments passed during execution.
  - **Check User Activity Context:** Assess the account used to execute the command. Look for accounts that traditionally do not perform such operations, potentially indicating suspicious behavior.
  - **Analyze GPO Configuration and Permissions:** Examine the GPOs being queried to determine the permissions and settings present. Identifying any misconfigured or overly permissive GPOs can reveal potential weaknesses for exploitation.
  - **Correlate with Other Discovery Commands:** Look for other PowerShell commands indicating reconnaissance activity within the network, such as `Get-ADGroup`, `Get-ADUser`, or `Get-ACL`, that might suggest broader enumeration efforts.

  ### Prioritization
  The alert has a **low severity** due to the possibility of legitimate administrative activities triggering the detection rule. However, the presence of this behavior in non-admin users or during unusual hours can tighten its risk profile, warranting further investigation.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage regarding the monitoring of legitimate administrative actions, which may result in false positives when authorized users execute `Get-GPO` for valid purposes. The detection logic assumes that Script Block Logging is enabled, which is essential but may not always be the case in all environments. It also does not account for users executing similar commands through means other than PowerShell, which could lead to missed detections for malicious activities mimicking normal operations.

