  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Get-GPO`, which is used for querying Group Policy Objects (GPOs) in a domain environment. An attacker may use this command to enumerate GPOs as part of an information-gathering phase, potentially leading to privilege escalation or lateral movement. This behavior relates to the MITRE ATT&CK technique for Discovery, specifically T1615 (Group Policy Discovery).

  The primary telemetry source is Windows PowerShell script logs, specifically Script Block Logging, which must be enabled to capture this activity. If malicious, the implications include the exfiltration of sensitive information related to domain configurations and security settings. It is important to note that executing `Get-GPO` alone does not confirm malicious intent; it could also be part of legitimate administrative activities.

  ### Investigation Steps

  - **Verify PowerShell Script Block Logging status:**
    Check if PowerShell Script Block Logging is enabled on the host. Expected configuration logs can be found in the Group Policy settings under Administrative Templates → Windows Components → Windows PowerShell.

  - **Examine Script Block logs for `Get-GPO`:**
    Review the PowerShell logs for Event ID 4104, specifically filtering for script blocks containing `Get-GPO`. Analyze the context of command usage, including user identity and time of execution.

  - **Identify user roles and behavior:**
    Confirm if the user executing `Get-GPO` has administrative privileges and whether this command aligns with their typical job function. Legitimate use cases typically involve admin users during policy updates or assessments.

  - **Correlate with GPO changes:**
    Cross-reference the `Get-GPO` execution time with changes in Group Policy that might indicate an attempt to modify settings during enumeration. This could be found in Event ID 5145 from Security logs.

  - **Detect suspicious user patterns:**
    Look for unusual patterns of use, such as `Get-GPO` execution from non-admin accounts, or from endpoints that typically do not interact with Group Policy. Such anomalies could signal potential misuse.

  ### Prioritization

  This alert is of low severity, primarily because `Get-GPO` can have legitimate administrative uses. However, given that attack scenarios for gathering Group Policy information are recognized, a high volume of such queries from non-administrators could indicate potential compromise and warrant higher scrutiny.

  ### Blind Spots and Assumptions

  The detection may be limited by the requirement for Script Block Logging to be enabled; if not, attempts to execute `Get-GPO` may go unnoticed. Legitimate administrative scripts may trigger this alert if they include the command for acceptable purposes. Related detections could include alerts for unauthorized GPO modifications (T1484.001), providing more comprehensive coverage for GPO-related anomalies.

