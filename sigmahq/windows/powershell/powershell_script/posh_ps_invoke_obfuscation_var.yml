note: |
  ### Technical Context
  This rule detects the obfuscated use of environment variables to execute PowerShell commands, leveraging a method identified as Invoke-Obfuscation. It indicates potential malicious activity by observing the exploitation of environmental variables in a crafted PowerShell command. Attackers often seek to evade detection by using such obfuscation techniques to execute scripts that may be harmful, such as those associated with data exfiltration or lateral movement within the network.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (ID: TA0005) via **Obfuscated Files or Information** (ID: T1027), which describes techniques used to hide the true nature of a script. The **Execution** tactic (ID: TA0002) is also pertinent, specifically under **PowerShell** (ID: T1059.001), which encompasses techniques used to execute commands or scripts in a PowerShell environment.

  Primary data sources for detecting this activity include **Windows PowerShell script execution logs**, particularly those generated when Script Block Logging is enabled. These logs provide insights into the specific command executions occurring within the PowerShell environment, enabling forensic analysis during investigations of suspected malicious execution patterns.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logs (event ID 4104) for suspicious commands that leverage environment variables, focusing on any obfuscation patterns indicative of malicious intent.
  - **Analyze Process Creation Events**: Investigate associated process creation logs (event ID 4688) for PowerShell instances that may have been spawned using obfuscated command lines or unusual arguments.
  - **Inspect Parent Process Information**: Correlate the identified PowerShell executions with their parent processes to uncover if they are initiated from known benign applications or suspicious executables.
  - **Check for Anomalous User Activity**: Evaluate logs for unusual user behavior or authentication patterns, particularly around the time of the detected PowerShell execution, to identify compromised accounts or insider threats.

  ### Prioritization
  This alert carries a high severity due to the potential impact of executing obfuscated PowerShell scripts, which can lead to unauthorized access, data breaches, or the deployment of malware across systems. The likelihood of such scripts being part of a broader attack makes timely investigation critical.

  ### Blind Spots and Assumptions
  Detection coverage may be incomplete if Script Block Logging is not enabled across all Windows systems, as this log is essential for capturing the obfuscated PowerShell execution behavior. The detection logic assumes that obfuscation techniques employed conform to the defined regex patterns, meaning novel methods may evade detection. Organizations must ensure that logging configurations are consistently applied to prevent any gaps in observability.

