note: |
  ### Technical Context

  This Sigma rule detects the obfuscated use of environment variables in PowerShell commands, specifically through the invocation of `cmd.exe` to execute a command that sets variables. Attackers typically leverage such techniques to evade detection mechanisms while executing malicious scripts. The relevant MITRE ATT&CK tactics involved include Defense Evasion (T1560) and Execution (T1059.001). The primary telemetry source required for this detection is Windows PowerShell logs with script block logging enabled, particularly focusing on log entries from Event ID 4104. If malicious, the security impact could involve executing payloads that may lead to system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also use similar PowerShell constructs.

  ### Investigation Steps

  - **Check the specifics of the PowerShell command: ** Review Event ID 4104 for instances of `cmd` or environment setting commands in ScriptBlockText; legitimate usage may involve standard system administration tasks without obfuscation.

  - **Correlate with execution history: ** Investigate recent PowerShell command logs (Event ID 400) to determine the context of the execution; legitimate power users or administrators may have expected execution patterns that should be noted.

  - **Identify user context: ** Validate the user account involved in executing the command. High-confidence malicious indicators include execution by non-administrator accounts or unusual users at odd hours.

  - **Assess for known malware signatures: ** Utilize endpoint antivirus or EDR solutions to check for malware signatures or indicators of compromise associated with known obfuscation techniques or payloads.

  - **Validate environment variable usage: ** Analyze the script for what environment variables are being set and whether they match known benign patterns, such as standard application deployments or admin tasks.

  ### Prioritization

  This alert is of high severity due to the potential impact on the enterprise, especially if it occurs on critical systems. The obfuscation technique is commonly utilized by adversaries to avoid detection, making the likelihood of malicious abuse significant. While not all occurrences indicate malicious behavior, the context must be closely examined.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative use triggering this alert, especially in a skilled operations environment. Additionally, reliance on PowerShell script block logging must be ensured, as disabled logging would compromise detection efficacy. Related detections, such as monitor alerts for direct PowerShell command invocations (e.g., Event ID 4103), can enhance coverage and context for observed activities.

