note: |
  ### Technical Context

  The rule detects the obfuscated execution of PowerShell scripts that utilize environment variables through a command pattern resembling `cmd.exe` calls. Attackers may employ this technique to execute malicious payloads while evading detection, attempting to confuse security tools and analysts. The likely objective is to execute unapproved code, such as payloads for lateral movement or data exfiltration.

  This behavior is linked to the MITRE ATT&CK technique for "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter: Windows Powershell" (T1059.001). The primary telemetry source required is PowerShell script block logging, specifically focusing on events captured under Windows Event ID 4104. If malicious, this behavior may lead to data breaches or system compromise. Importantly, this detection does NOT confirm outright malicious activity without further context, such as additional indicators of compromise or abnormal behavior patterns.

  ### Investigation Steps

  - **Review PowerShell Event Logs:** Check Windows Event ID 4104 for instances of script block logging capturing the specific obfuscation pattern (e.g., `cmd.{0,5}(?:/c|/r)(?:\s|)"set\s[a-zA-Z]{3,6}.*(?:\{\d\}){1,}\\"\s+?-f(...)`). Look for unusually high frequencies of these events which may indicate an ongoing attack.

  - **Correlate with Process Creation:** Cross-reference the script block log with Windows Event ID 4688 to identify the parent process invoking PowerShell. A legitimate PowerShell execution typically originates from known administrative tools or scheduled tasks, whereas unexpected sources (e.g., user desktops) could indicate malicious activity.

  - **Inspect Related Network Activity:** Analyze network logs for any outbound connections initiated by the PowerShell process. Collect relevant data from firewall or proxy logs that show unusual communication patterns (e.g., unexpected IPs or domains) following the execution of the script.

  - **Validate Environment Variables Usage:** Examine the affected system's environment variables using `Get-ChildItem Env:` in PowerShell to assess any anomalies or modifications that appear unusual. Malicious scripts often manipulate environment variables, which should remain consistent with organizational standards.

  - **Identify Escalated Permissions:** Investigate if there are any user accounts with escalated privileges executing these commands. Use Windows logs (Event ID 4624) to check for logons from service accounts or admin users around the time of the obfuscation alerts.

  - **Assess File System Changes:** Check the file system for any newly created or modified scripts in locations commonly associated with malicious activity. Filenames that are unusually obfuscated or placed in temporary directories may indicate underlying malicious intent.

  ### Prioritization

  This alert carries a high severity due to the potential for significant impact on system integrity and data security. The likelihood of malicious abuse is notable given that obfuscation techniques are routinely used in exploitation scenarios by advanced adversaries. Such behavior is often weaponized in targeted attacks to establish persistence or move laterally within a network.

  ### Blind Spots and Assumptions

  The detection may have limitations due to possible evasion tactics, such as direct PowerShell execution without obfuscation, which may escape detection. Reliability of this alert is dependent on the enablement of script block logging. Legitimate software updates or administrative scripts may inadvertently trigger this alert, necessitating contextual understanding. A related detection, such as monitoring for “PowerShell Script Execution” (T1059.001), can provide enhanced coverage of potentially dangerous PowerShell activities.

