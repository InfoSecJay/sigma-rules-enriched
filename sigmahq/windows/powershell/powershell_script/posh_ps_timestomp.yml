title: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
status: test
description: |
  Adversaries may modify file time attributes to hide new or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in the same folder.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
author: frack113
date: 2021-08-03
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1070.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
    ScriptBlockText|contains:
    - '.CreationTime ='
    - '.LastWriteTime ='
    - '.LastAccessTime ='
    - '[IO.File]::SetCreationTime'
    - '[IO.File]::SetLastAccessTime'
    - '[IO.File]::SetLastWriteTime'
  condition: selection_ioc
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands that modify file timestamps, a technique known as "timestomping." Adversaries may employ this method to obscure their activities by altering the creation, last access, and last modification times of files. Such manipulation can help attackers evade detection by making malicious files appear as though they were created or modified legitimately or by hiding their true timeline of events. This behavior is often associated with efforts to retain persistence and to cover tracks following unauthorized access.

  The rule specifically targets the active use of PowerShell commands that explicitly set these timestamps, indicating the potential presence of malicious activity. Relevant MITRE ATT&CK tactics include **Defense Evasion** (ID: TA0005) and the technique **Timestomp** (ID: T1070.006). These tactics and techniques illustrate a threat actor's intent to manipulate system artifacts and evade forensic scrutiny.

  Primary data sources for this detection include Windows PowerShell script block logs, which capture the execution of PowerShell commands, including any potentially malicious activities. Ensuring that script block logging is enabled is critical for this detection to function effectively.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs to identify any instances of the detected timestomping commands. Look for unusual patterns or timings that suggest an attempt to disguise file activity.

  - **Analyze File Timestamps:** Inspect the file timestamps on any files targeted by the detected commands. Compare these timestamps with actual system and application logs to determine any discrepancies indicating possible manipulation.

  - **Investigate Related Activity:** Look for other suspicious activities occurring around the same time as the PowerShell commands; this may include unauthorized file access or modifications. Correlate these findings with endpoint detection data.

  - **Query for User Context:** Investigate the user account associated with the execution of the PowerShell commands. Determine whether the user was acting within their defined role or if the actions appear anomalous for that particular context.

  ### Prioritization
  The severity of this alert is medium because while timestomping can indicate advanced persistent threat behaviors, it may also occur in legitimate administrative scenarios. However, the potential for data hiding and evasion tactics in an enterprise context warrants a prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if PowerShell script block logging is not enabled or if logging settings are misconfigured, leading to a lack of telemetry needed for effective detection. The rule assumes that malicious actors will use common timestomping commands, but sophisticated threats may utilize methods not covered by this detection. Additionally, it may overlook legitimate administrative activities that also alter timestamps, leading to false positives that could complicate incident response efforts.

