title: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
status: test
description: |
  Adversaries may modify file time attributes to hide new or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in the same folder.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
author: frack113
date: 2021-08-03
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1070.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
    ScriptBlockText|contains:
    - '.CreationTime ='
    - '.LastWriteTime ='
    - '.LastAccessTime ='
    - '[IO.File]::SetCreationTime'
    - '[IO.File]::SetLastAccessTime'
    - '[IO.File]::SetLastWriteTime'
  condition: selection_ioc
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that modify file time attributes, specifically targeting the creation, last access, and last write timestamps. This behavior is indicative of attempts to conceal the presence of malicious files or to manipulate the perceived timeline of file activity, a common tactic employed by adversaries to avoid detection. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) and the technique is Timestomp (T1070.006).

  The primary telemetry sources required for this detection include PowerShell Script Block Logging, which must be enabled to capture the command invocations that change file attributes. The security impact of this activity is significant, as it can allow attackers to obscure their digital footprints and complicate forensic investigations. It’s important to note that this detection does not, on its own, confirm malicious intent; legitimate administrative tasks can also invoke similar commands.

  ### Investigation Steps

  - **Review PowerShell command usage:** Check Security Event ID 4104 logs to identify instances of PowerShell commands containing keywords like '.CreationTime', '.LastWriteTime', or '.LastAccessTime'. Focus on unusual users or processes executing these commands.

  - **Identify legitimate activity:** Look for normal administrative scripts that might use timestamp manipulation, such as backup or system maintenance scripts. Compare the context of the command execution to established baselines for legitimate administrative activities.

  - **Correlate with file modifications:** Cross-reference the timestamps of the files in question with the PowerShell command execution times. Unusual discrepancies between file timestamps and their modification history may indicate malicious intent.

  - **Check for related artifacts:** Inspect for the presence of file manipulation based on System Event IDs 4663 and 5145, which can reveal unauthorized access or modifications to file objects corresponding with the PowerShell command usage.

  - **Evaluate the affected hosts:** Analyze the role of the host executing the commands for critical assets. A PowerShell command modifying timestamps on a sensitive database server could indicate a higher threat level than on a non-critical workstation.

  - **Identify high-confidence malicious indicators:** Monitor for the execution of commands originating from untrusted locations or contexts, especially those invoking file modifications through PowerShell in conjunction with known malicious hashes.

  ### Prioritization

  Given that this alert involves potential timestamp manipulation on files, it can signify a targeted attempt to obscure malicious activities. The impact escalates if it occurs on critical systems, as it indicates a higher likelihood of sophisticated adversary behavior. Since timestomping is a known and weaponized technique, this alert warrants prompt attention and investigation.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques, as sophisticated adversaries might utilize legitimate tools to perform similar actions, diluting the accuracy of the alert. Ensuring that Script Block Logging is always enabled is critical for reliable detection. Legitimate administrative scripts may trigger this rule; therefore, analysts must contextualize findings before escalating. Companion detections, like monitoring for unusual process creation patterns (e.g., Security Event ID 4688), can enhance coverage and provide broader context for investigations into file manipulations.

