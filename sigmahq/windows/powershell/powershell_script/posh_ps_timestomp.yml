title: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
status: test
description: |
  Adversaries may modify file time attributes to hide new or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in the same folder.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
author: frack113
date: 2021-08-03
modified: 2022-12-25
tags:
- attack.stealth
- attack.t1070.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
    ScriptBlockText|contains:
    - '.CreationTime ='
    - '.LastWriteTime ='
    - '.LastAccessTime ='
    - '[IO.File]::SetCreationTime'
    - '[IO.File]::SetLastAccessTime'
    - '[IO.File]::SetLastWriteTime'
  condition: selection_ioc
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to modify file timestamps using PowerShell commands. The typical behavior involves adjusting the create, last write, and last access times of files, primarily to obscure malicious activities or alter digital footprints. The likely attacker objective is to evade detection by making newly created or modified files appear as though they were present previously. This behavior falls under the MITRE ATT&CK tactic of “Defense Evasion” (TA0005) and the technique of “Timestomp” (T1070.006).

  The primary telemetry source is Windows PowerShell script block logging, requiring that this feature be enabled to capture the relevant events. The potential security impact is significant as it can indicate attempts to conceal unauthorized activity or system compromises. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks or maintenance scripts may also perform similar timestamp modifications.

  ### Investigation Steps

  - **Check PowerShell script block logging entries:** Review PowerShell logs for Event ID 4104 to locate any ScriptBlockText containing timestamp modifications, particularly for ‘.CreationTime’, ‘.LastWriteTime’, and ‘.LastAccessTime’. Correlate against points in time when unauthorized changes might have occurred.

  - **Identify abnormal file creation or modification times:** Investigate pertinent file attributes using 'Get-Item' or 'Get-ChildItem' commands in PowerShell to identify discrepancies in expected timestamps, especially against legitimate files in the same directory.

  - **Analyze historical context of the affected files:** Use log sources (e.g., Security Event ID 4663) to track file access and modification history. If multiple timestamps are inconsistent, further indicator of potential malicious behavior will have been established.

  - **Document expected legitimate admin behavior:** Understand that legitimate administrative scripts may adjust timestamps for maintenance or updates. Review historical justification for such modifications and the context surrounding them to differentiate from malicious attempts.

  - **Validate asset criticality:** Assess the role of the impacted system within your enterprise environment, particularly if it holds sensitive information or is integral to operations. High-impact systems should escalate any findings regarding potential timestamp tampering.

  - **Correlate with file integrity monitoring alerts:** If any external file integrity monitoring tools are in use (e.g., OSSEC, Tripwire), verify alerts related to the same files or timestamps. Cross-reference PowerShell modifications against these integrity check logs for further insights into file alteration activities.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on the affected system, especially if it is a critical asset. The likelihood of malicious abuse is plausible, as timestamp alterations are a common tactic employed by adversaries to mask their actions. This behavior is known to be weaponized, particularly in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled, providing a blind spot for activities that could go undetected. The alert could also be triggered by legitimate maintenance tasks, particularly if administrators regularly adjust timestamps for system utilities. Related detections, such as monitoring for anomalous access to sensitive files (e.g., using Security Event ID 4656), would enhance overall coverage and context for observed suspicious activities.

