title: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
status: test
description: |
  Adversaries may modify file time attributes to hide new or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in the same folder.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
author: frack113
date: 2021-08-03
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1070.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
    ScriptBlockText|contains:
    - '.CreationTime ='
    - '.LastWriteTime ='
    - '.LastAccessTime ='
    - '[IO.File]::SetCreationTime'
    - '[IO.File]::SetLastAccessTime'
    - '[IO.File]::SetLastWriteTime'
  condition: selection_ioc
falsepositives:
- Legitimate admin script
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects PowerShell commands that modify file timestamps, specifically targeting attributes such as creation time, last write time, and last access time. The likely objective of an attacker employing this technique (known as "timestomping") is to conceal malicious activities by altering file metadata to resemble legitimate files, thereby evading detection mechanisms. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.006 (Timestomping).

  The primary telemetry sources necessary for detection include PowerShell Script Block Logging, which captures the content of executed commands. If malicious, successful timestomping can significantly impair incident response efforts and forensic investigations by obscuring the timeline of file modifications. However, it's important to note that detection of this behavior does NOT confirm malicious intent; legitimate administrative actions may also trigger this rule.

  ---

  ### Investigation Steps

  - **Check for PowerShell events**: Review PowerShell event logs (Event ID 4104) for the specific ScriptBlockText patterns: '.CreationTime =', '.LastWriteTime =', and '.LastAccessTime ='. Look for direct matches to these keywords as high-confidence indicators of potential timestomping.

  - **Identify the script executor**: Examine the user context under which the PowerShell commands were executed, using Security Event ID 4688. Look for anomalous users or service accounts typically not performing file management tasks.

  - **Review file timestamps**: Assess the target file's timestamps using `Get-Item` in PowerShell or checking via file properties. Evaluate if changes occur at odd hours or in quick succession following malicious activity. A noticeable midday modification could indicate manipulation.

  - **Determine legitimate processes**: Analyze common administrative scripts likely to run on the affected host. If the script references typical administrative tasks, this might denote benign activity, helping to inform your conclusion on intent.

  - **Correlate with other logs**: Look for recent file access or modification events in Windows Security Event ID 4663 for the affected file. If timestamp modifications do not match actual access or modification events, this could suggest suspicious activity.

  ---

  ### Prioritization

  The alert's severity is medium based on the potential impact of a compromised file system and the likelihood of malicious actors utilizing timestomping as a stealth technique. While not extremely prevalent, timestomping is a recognized method employed by advanced threat actors, warranting focused investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging; specifically, Script Block Logging must be enabled in PowerShell. Legitimate activities, such as routine maintenance scripts run by IT staff, can inadvertently trigger this alert. A related detection to consider is the monitoring of unusual file access patterns (e.g., sudden access by administrative users) which could help in establishing context around the timestomping event.

