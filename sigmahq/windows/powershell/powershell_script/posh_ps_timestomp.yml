title: Powershell Timestomp
id: c6438007-e081-42ce-9483-b067fbef33c3
status: test
description: |
  Adversaries may modify file time attributes to hide new or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in the same folder.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
author: frack113
date: 2021-08-03
modified: 2022-12-25
tags:
- attack.stealth
- attack.t1070.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
    ScriptBlockText|contains:
    - '.CreationTime ='
    - '.LastWriteTime ='
    - '.LastAccessTime ='
    - '[IO.File]::SetCreationTime'
    - '[IO.File]::SetLastAccessTime'
    - '[IO.File]::SetLastWriteTime'
  condition: selection_ioc
falsepositives:
- Legitimate admin script
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_timestomp/info.yml
note: |
  ### Technical Context

  This Sigma rule detects behaviors indicative of a Powershell script modifying file timestamp attributes, a tactic commonly used by adversaries to conceal the existence or modification of files. The likely objective is to hide malicious artifacts or create confusion about file modification timelines, helping them evade detection. This behavior is associated with the MITRE ATT&CK technique T1070.006: Timestomping.

  The primary telemetry source for this rule is Windows PowerShell Script Block Logging, which must be enabled to capture the necessary log events. If malicious, the security impact is significant, as it can lead to undetected file alterations that may be critical in forensic investigations. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may also utilize similar timestamp modifications.

  ### Investigation Steps

  - **Identify suspicious script activity:** Review PowerShell logs (Event ID 4104) for script block logging entries containing `CreationTime`, `LastWriteTime`, or `LastAccessTime`. Pay particular attention to scripts being executed from unusual locations.

  - **Check for high-confidence malicious indicators:** Look for the use of `[IO.File]::SetCreationTime`, `[IO.File]::SetLastAccessTime`, or `[IO.File]::SetLastWriteTime` in the script block logs. The presence of these calls in scripts run outside of expected administrative processes may indicate malicious behavior.

  - **Evaluate benign behavior scenarios:** Compare log entries with expected administrative activity. Legitimate administrative scripts would typically appear during authorized maintenance windows and may utilize timestamp modification for backup processes or legitimate file management tasks.

  - **Analyze execution context:** Identify the user account initiating the PowerShell execution. High-risk accounts, such as those with administrator privileges, executing such scripts should trigger further scrutiny.

  - **Validate against file system artifacts:** Check for mismatched file timestamps on affected files compared to when the file was created or last accessed as reported by file system metadata. Use PowerShell commands or filesystem auditing to inspect `CreationTime`, `LastAccessTime`, and `LastWriteTime` attributes.

  ### Prioritization

  The alert severity is medium due to the potential impact on affected systems, especially if critical file modifications go unnoticed. Adversaries often exploit timestamp manipulation during attacks to avoid detection, making this behavior relevant. While not every timestamp modification indicates a threat, this technique is commonly associated with malicious activity.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on Script Block Logging, which may not be enabled on all systems, leading to gaps in visibility. Legitimate administration activities, particularly during maintenance or troubleshooting, may trigger this alert, necessitating careful review to separate anomalies from standard operations. Companion detections for file modifications, such as monitoring for anomalous file creation or changes in file hashes, would enhance coverage and reduce false positives.

