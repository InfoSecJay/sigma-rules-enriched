note: |
  ### Technical Context

  This Sigma rule detects the use of the `New-ADServiceAccount` cmdlet with parameters indicating the creation of a delegated Managed Service Account (dMSA) in specified Organizational Units (OUs) within Active Directory environments. The likely attacker objective is to exploit the privilege escalation vulnerability known as "BadSuccessor" in Windows Server 2025, enabling unauthorized elevation of privileges. This behavior aligns with the MITRE ATT&CK tactics of Privilege Escalation (TA-0052), specifically technique T1078.002, which involves using valid accounts for unauthorized access.

  Primary telemetry sources include Windows PowerShell logs (Event ID 4103) and security logs capturing administrative activities (Event ID 4672 for Special Privileges Assigned). If exploited, malicious creation of these accounts could allow an adversary to execute unauthorized actions under elevated privileges. This detection does NOT confirm that privilege escalation has occurred; it only identifies suspicious account creation activity.

  ### Investigation Steps

  - **Check Powershell Invocation:** Review PowerShell logs for Event ID 4103 with `ScriptBlockText` containing `New-ADServiceAccount`. Look for unusual user accounts running the command, indicating potential misuse by unauthorized personnel.

  - **Identify Privileged User Activity:** Examine Event ID 4672 logs to see if the user executing the command has been granted special permissions. Legitimate administrators typically create accounts in a controlled manner using established processes, not directly via ad-hoc commands.

  - **Analyze OU Policy Enforcement:** Validate the OU in which the dMSA account is created. Compare against organizational policies to ensure that legitimate service accounts align with documented practices. Unexpected ou usage could signal unauthorized behavior.

  - **Correlate with Known Accounts:** Cross-reference the account used to create the dMSA with a list of designated administrative accounts. A non-administrative account triggering this alert is a strong indicator of malicious activity.

  - **Look for Excessive Account Creation:** Query for multiple dMSA accounts being created in a short timeframe within the same OU. Legitimate actions would typically show a more distributed or singular account creation based on needs.

  ### Prioritization

  This alert has medium severity due to the potential for privilege escalation within critical server environments. The likelihood of abuse is significant, particularly in misconfigured Active Directory where privileges are inappropriately assigned. Similar exploitation techniques are frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The primary detection limitation is that authorized administrators could mistakenly trigger this alert during legitimate activities. Required event logging configurations need to be verified to ensure PowerShell execution and sensitive Active Directory changes are captured reliably. Additionally, consider companion detections such as monitoring for failed authentication attempts or unauthorized PowerShell access logs (Event ID 4104) to enhance overall visibility into suspicious activities.

