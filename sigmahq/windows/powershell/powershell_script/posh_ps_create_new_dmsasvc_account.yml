note: |
  ### Technical Context

  This rule detects the creation of a delegated Managed Service Account (dMSA) using the PowerShell cmdlet `New-ADServiceAccount`, particularly when executed in specific Organizational Units (OUs). The likely attacker objective is to exploit the BadSuccessor privilege escalation vulnerability in Windows Server 2025, potentially allowing unauthorized changes to Active Directory configurations and elevated access within the environment. This behavior maps to the MITRE ATT&CK techniques for Privilege Escalation (T1078.002) and Defense Evasion (T1098).

  Primary telemetry sources include PowerShell script logs capturing the execution of commands and Active Directory event logs related to account creation. If malicious, this could lead to significant security impacts such as unauthorized access and account abuse. However, this detection alone does NOT confirm that the action was indeed malicious, as legitimate administrative tasks by authorized personnel may also trigger this alert.

  ### Investigation Steps

  - **Check for authorized account creation:**
    Review the Active Directory logs (Event ID 4720) to confirm whether the account was created by a legitimate user (e.g., a known administrator) who possesses the necessary permissions.

  - **Identify PowerShell command usage:**
    Look for related PowerShell events (Event ID 4104) containing `New-ADServiceAccount -CreateDelegatedServiceAccount -path`. Verify if these commands were run from unexpected or unauthorized hosts.

  - **Evaluate the OU context:**
    Assess if the account was created in a sensitive or unusual OU. Legitimate dMSA accounts should typically reside within designated administrative OUs.

  - **Detect related malicious activity:**
    Cross-reference with failed login attempts in Security Event ID 4625. A spike in failed login attempts after the account's creation suggests potential misuse of the dMSA.

  - **Review account properties:**
    Analyze attributes of the created service account (e.g., `servicePrincipalName`, `msDS-ManagedServiceAccount`) to ensure they align with valid operational practices and do not reveal suspicious configurations or properties.

  ### Prioritization

  The severity of this alert is medium. While the potential impact of unauthorized service account creation could lead to significant security breaches, such activities may occur in legitimate administrative processes. However, the exploitation of the BadSuccessor vulnerability is an emerging threat and can be weaponized by adversaries aiming for privilege escalation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as executing PowerShell commands through encoded shells or alternative execution methods that do not use direct cmdlet syntax. Reliable detection requires enabling PowerShell transcription and logging, as well as comprehensive Active Directory auditing. Legitimate activities that may trigger this alert could include a legitimate administrator performing maintenance or updates. Related detections include monitoring for unauthorized changes in Active Directory (e.g., Event ID 5136) to strengthen coverage against privilege escalation attempts.

