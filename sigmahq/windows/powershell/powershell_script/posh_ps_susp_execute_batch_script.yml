title: Powershell Execute Batch Script
id: b5522a23-82da-44e5-9c8b-e10ed8955f88
status: test
description: |
  Adversaries may abuse the Windows command shell for execution.
  The Windows command shell ([cmd](https://attack.mitre.org/software/S0106)) is the primary command prompt on Windows systems.
  The Windows command prompt can be used to control almost any aspect of a system, with various permission levels required for different subsets of commands.
  Batch files (ex: .bat or .cmd) also provide the shell with a list of sequential commands to run, as well as normal scripting operations such as conditionals and loops.
  Common uses of batch files include long or repetitive tasks, or the need to run the same set of commands on multiple system
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.003/T1059.003.md#atomic-test-1---create-and-execute-batch-script
author: frack113
date: 2022-01-02
tags:
- attack.execution
- attack.t1059.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_start:
    ScriptBlockText|contains: Start-Process
  selection_batch:
    ScriptBlockText|contains:
    - '.cmd'
    - '.bat'
  condition: all of selection_*
falsepositives:
- Legitimate administration script
level: medium
note: |
  ### Technical Context

  This detection rule identifies when PowerShell scripts invoke batch files (.cmd or .bat) using the `Start-Process` command. This technique can be employed by adversaries to execute malicious scripts or commands under the guise of legitimate administrative tasks. The likely objective here is to gain persistence, execute payloads, or perform lateral movement within an environment.

  Relevant tactics from the MITRE ATT&CK framework include Execution (T1203) and Command and Scripting Interpreter (T1059.003). The primary telemetry source for this detection is PowerShell script block logging, which captures specific command executions along with their effects. If malicious, the potential impacts could range from unauthorized access to sensitive information to further system compromise and data exfiltration. Importantly, this detection does NOT confirm that the activity is malicious on its own; further investigation is required to assess context and intent.

  ### Investigation Steps

  - **Check PowerShell logs for batch execution**: Review PowerShell event logs (Event ID 4104) for any entries that indicate `Start-Process` followed by a batch file. Confirm that the scripts run from an unexpected or unusual location, such as temporary folders or user profile directories.

  - **Correlate with process creation logs**: Examine Windows Security Event ID 4688 to find corresponding process creation events linked to the PowerShell process. Validate whether the parent process, such as `powershell.exe`, relates to user-initiated actions.

  - **Analyze network activity**: Review network logs for outbound connections made shortly after the batch file execution. Look for irregular patterns, such as connections to suspicious IP addresses or domains that deviate from typical network behavior.

  - **Identify legitimate batch file usage**: Determine if the executed batch files are part of a known administrative or automated task within your environment. This could include maintenance scripts scheduled through Task Scheduler or standard operational procedures.

  - **Look for malicious indicators**: Specifically search for batch scripts that include commands for disabling security settings or retrieving sensitive information (e.g., commands like `net user`, `net localgroup`, or `netsh`). These may suggest adversarial intent.

  ### Prioritization

  In an enterprise context, this alert should be prioritized given that batch file execution via PowerShell can indicate potential abuse for malicious objectives. The likelihood of such execution being weaponized is moderate to high, especially in environments where scripting is commonplace for routine tasks, thus necessitating keen vigilance.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like disabling script block logging or running the commands through obfuscated scripts. The required log sources for reliable detection include properly configured PowerShell script block logging, which must be enabled beforehand. Legitimate activities that may trigger this alert include authorized automated administration scripts deployed across systems. A related detection that strengthens coverage is monitoring for direct command shell access with Event ID 4688, providing broader context on command execution.

