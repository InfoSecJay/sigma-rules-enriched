title: Powershell Execute Batch Script
id: b5522a23-82da-44e5-9c8b-e10ed8955f88
status: test
description: |
  Adversaries may abuse the Windows command shell for execution.
  The Windows command shell ([cmd](https://attack.mitre.org/software/S0106)) is the primary command prompt on Windows systems.
  The Windows command prompt can be used to control almost any aspect of a system, with various permission levels required for different subsets of commands.
  Batch files (ex: .bat or .cmd) also provide the shell with a list of sequential commands to run, as well as normal scripting operations such as conditionals and loops.
  Common uses of batch files include long or repetitive tasks, or the need to run the same set of commands on multiple system
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.003/T1059.003.md#atomic-test-1---create-and-execute-batch-script
author: frack113
date: 2022-01-02
tags:
- attack.execution
- attack.t1059.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_start:
    ScriptBlockText|contains: Start-Process
  selection_batch:
    ScriptBlockText|contains:
    - '.cmd'
    - '.bat'
  condition: all of selection_*
falsepositives:
- Legitimate administration script
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of batch scripts initiated through PowerShell, which may indicate malicious activity or abuse of legitimate administrative tasks. Adversaries can exploit the Windows command shell and PowerShell to execute a series of commands within batch files (with extensions `.bat` or `.cmd`), enabling them to perform a variety of actions on a compromised system. This behavior often aims to manipulate system settings, install malware, or conduct reconnaissance.

  The relevant MITRE ATT&CK techniques for this detection include **Execution: Command and Scripting Interpreter** (T1059.003) which specifically addresses the use of batch files. Attackers leveraging this technique may seek to execute arbitrary commands or deploy additional payloads, making it crucial for security teams to monitor such activity closely. Primary data sources that will yield valuable insights include PowerShell script block logs, which must have Script Block Logging enabled to capture detailed command execution information.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Collect logs that include PowerShell command execution details, focusing on any entries containing the terms "Start-Process," ".cmd," or ".bat" to identify potentially unauthorized batch script executions.

  - **Analyze Command Line Arguments**: Examine the command line arguments provided during the execution of the identified commands. Pay attention to any unusual or unexpected arguments that may suggest malicious intent.

  - **Cross-Reference with Execution Context**: Determine the user context under which the batch scripts were executed. Investigate whether the executing user has legitimate administrative rights or if the action appears anomalous for their role.

  - **Check for Related Artifacts**: Look for other indicators of compromise associated with the batch scripts, such as newly created scheduled tasks, file changes in sensitive directories, or connections to known malicious IP addresses.

  ### Prioritization
  This alert is rated as medium severity due to its potential impact on system integrity and the likelihood of misuse, particularly in environments where administrative scripts are common, making it essential to discern between legitimate and suspicious usage.

  ### Blind Spots and Assumptions
  One notable blind spot in this detection is the reliance on Script Block Logging being enabled; if this feature is disabled on any systems, relevant execution events would not be captured. Additionally, the rule assumes that batch scripts are indicative of malicious activity, which may not always be the case, as legitimate administrative tasks could also trigger these alerts. Ensuring that comprehensive PowerShell logging and monitoring configurations are in place is crucial for the alert to function effectively.

