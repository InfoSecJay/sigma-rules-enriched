note: |
  ### Technical Context

  This Sigma rule detects the execution of batch scripts (.bat or .cmd) through PowerShell, particularly by identifying the use of the `Start-Process` cmdlet. The likely attacker objective is to execute a series of commands or malicious scripts that may assist in further system compromise or lateral movement. Relevant MITRE ATT&CK tactic is **Execution** and technique is **Command and Scripting Interpreter: Windows Command Shell (T1059.003)**.

  The primary telemetry sources include Windows PowerShell logs with Script Block Logging enabled. Key fields to monitor are `ScriptBlockText` for command content. If malicious, the execution of unauthorized batch scripts can lead to significant system compromise, data theft, or lateral movement within the network. Crucially, this detection does NOT confirm malicious activity by itself; legitimate administrative scripts may trigger the same alert.

  ### Investigation Steps

  - **Review PowerShell logs for block text**: Confirm presence of `ScriptBlockText` entries indicative of `.bat` or `.cmd` execution. Look for commands that are unusual in context, such as calls to external servers or scripting not typical for the environment.

  - **Cross-reference with process creation events**: Check Security Event ID 4688 for any new process instances created by PowerShell that correlate with the detected batch execution. Ensure that parent processes are expected (e.g., an admin user executing a standard script).

  - **Identify high-confidence malicious indicators**: Look for `ScriptBlockText` containing commands that attempt to access sensitive files or perform network operations, such as `net use`, or any obfuscating commands (e.g., encoded commands).

  - **Establish legitimate activity baseline**: Determine if legitimate administrative tasks, such as software deployments or routine maintenance, involve the execution of similar batch files. Documenting the normal execution context can assist in distinguishing between benign and malicious actions.

  - **Evaluate system roles or criticality**: Assess if the affected system is critical (e.g., a domain controller or database server). Malicious activity on these targets warrants higher prioritization in incident response.

  - **Check for file creation or exfiltration**: Look for creation events of files typically associated with malicious activity. This includes Event ID 4663 (File Access) to review the paths accessed and types of files modified or created subsequent to the batch execution.

  ### Prioritization

  The alert has medium severity. Its impact depends on the criticality of the executed batch script and the potential for privilege escalation or data compromise. Given that this method is commonly leveraged by adversaries in live environments, it requires immediate investigation to rule out malicious intent.

  ### Blind Spots and Assumptions

  This detection may not capture obfuscated or indirect scripting methods that do not explicitly invoke batch scripts. It also assumes that Script Block Logging is correctly configured and enabled. Legitimate system administration may trigger this alert during routine tasks involving batch files. To strengthen coverage, companion detections such as monitoring unusual PowerShell command execution (T1059.001) can enhance visibility into potentially malicious behavior.

