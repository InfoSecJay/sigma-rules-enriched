title: PowerShell Web Access Installation - PsScript
id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
status: test
description: Detects the installation and configuration of PowerShell Web Access,
  which could be used for remote access and potential abuse
references:
- https://docs.microsoft.com/en-us/powershell/module/powershellwebaccess/install-pswawebapplication
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
- https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
author: Michael Haag
date: 2024-09-03
tags:
- attack.persistence
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_install:
    ScriptBlockText|contains: 'Install-WindowsFeature WindowsPowerShellWebAccess'
  selection_config:
    ScriptBlockText|contains: 'Install-PswaWebApplication'
  selection_auth:
    ScriptBlockText|contains|all:
    - 'Add-PswaAuthorizationRule'
    - '-UserName *'
    - '-ComputerName *'
  condition: 1 of selection_*
falsepositives:
- Legitimate PowerShell Web Access installations by administrators
level: high
note: |
  ### Technical Context
  This rule detects the installation and configuration of PowerShell Web Access (PsWA), a feature that allows remote access to Windows PowerShell through a web-based interface. While legitimate in administrative scenarios, PsWA can be misused by attackers seeking to maintain access to compromised systems with minimal detection. The likely attacker objectives include establishing persistent access for ongoing control and exploitation of the network.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Execution** (TA0002), with the specific technique being **Command and Scripting Interpreter: Windows PowerShell** (T1059.001). The behavior associated with this detection rule may indicate potential abuse by adversaries aiming to leverage remote management capabilities without proper authorization.

  Primary data sources for obtaining evidence include **PowerShell script block logs**, which capture the execution of PowerShell commands, and **Windows Event logs**, specifically those related to PowerShell activities. Ensuring that script block logging is enabled enhances visibility into potentially malicious configurations.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script block logs for entries that match the identified command patterns (`Install-WindowsFeature WindowsPowerShellWebAccess`, `Install-PswaWebApplication`, and `Add-PswaAuthorizationRule`) to corroborate potential unauthorized installations.

  - **Correlate User Activity**: Investigate the account used for executing these commands. Look for irregular user behavior or logins (e.g., non-administrative accounts performing administrative tasks) prior to the identified activity.

  - **Inspect Network Traffic**: Review network logs to check for unusual outbound connections or attempts to establish sessions over HTTP/S that may indicate remote access attempts leveraging PsWA.

  - **Evaluate Group Policy Settings**: Check relevant Group Policy settings that could indicate modifications that allow PsWA installation, confirming if changes were made compliant with organizational policy.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to establish persistent, unauthorized access within the environment, significantly increasing the risk of data compromise and further exploitation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if script block logging is not enabled on all systems, which might prevent capturing the relevant PowerShell commands. The detection logic assumes that any installation or configuration of PsWA is nefarious unless defined by approved administrative measures. Required configurations include adhering to logging settings for PowerShell and ensuring that only designated administrative accounts are authorized for such installations.

