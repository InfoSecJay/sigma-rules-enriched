title: PowerShell Web Access Installation - PsScript
id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
status: test
description: Detects the installation and configuration of PowerShell Web 
  Access, which could be used for remote access and potential abuse
references:
- https://docs.microsoft.com/en-us/powershell/module/powershellwebaccess/install-pswawebapplication
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
- https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
author: Michael Haag
date: 2024-09-03
tags:
- attack.persistence
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_install:
    ScriptBlockText|contains: 'Install-WindowsFeature WindowsPowerShellWebAccess'
  selection_config:
    ScriptBlockText|contains: 'Install-PswaWebApplication'
  selection_auth:
    ScriptBlockText|contains|all:
    - 'Add-PswaAuthorizationRule'
    - '-UserName *'
    - '-ComputerName *'
  condition: 1 of selection_*
falsepositives:
- Legitimate PowerShell Web Access installations by administrators
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation and configuration of PowerShell Web Access (PsWA) through specific PowerShell commands. The likely attacker objective could be to establish a persistent remote access mechanism for later exploitation or lateral movement within the network. This detection correlates with the MITRE ATT&CK tactic of Persistence (T1059.001 - Command and Scripting Interpreter: PowerShell).

  Primary telemetry sources for this detection include event logs generated by PowerShell Script Block Logging, specifically capturing ScriptBlockText data. If malicious, the successful deployment of PsWA could facilitate unauthorized access to resources and lead to significant operational impacts. Importantly, this detection does NOT confirm malicious intent; it could also capture legitimate administrative actions by system administrators.

  ### Investigation Steps

  - **Review PowerShell logs for installation commands:** Check PowerShell event logs (Event ID 4104) for ScriptBlockText that includes 'Install-WindowsFeature WindowsPowerShellWebAccess' or 'Install-PswaWebApplication'. Legitimate installations should include context from authorized administrators, with proper documentation, typically originating from known system administrators' accounts.

  - **Identify unauthorized authorization rules:** Search for any additions to PsWA authorization rules using Event ID 4104 with ScriptBlockText containing 'Add-PswaAuthorizationRule'. Verify if these rules correspond to unexpected user accounts or computers. Malicious rules may include non-standard usernames or devices.

  - **Assess the execution context:** Review the user account associated with the PowerShell command execution in Event IDs 4104, 4688. Staff roles should align with administrative privileges. If the account is a non-admin or a low privilege account, it warrants further investigation.

  - **Examine Windows Feature Installations:** Review the Windows Feature Installation logs for any anomalies or unauthorized features installed around the same time as the PsWA installation. Compare this log against normal baseline installations which are typically limited to scheduled maintenance windows.

  - **Check for post-installation traffic:** Monitor network connections from the host machine where PsWA was configured to identify any unusual remote connections that could indicate compromise. Look for outbound traffic patterns that deviate from normal behavior, particularly to unrecognized external IPs.

  ### Prioritization

  This alert is of high severity due to the potential for significant security implications if PsWA is exploited. The likelihood of malicious abuse is considerable, given that adversaries may leverage PsWA for unauthorized remote access, and similar techniques are frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, which is a prerequisite for capturing this activity. Legitimate activity may include administrative installations of PsWA, particularly during system updates or new deployments. A related detection to consider is monitoring for abnormal remote access patterns (e.g., suspicious RDP sessions) to bolster overall security visibility.

