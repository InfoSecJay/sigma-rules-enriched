note: |
  ### Technical Context
  This detection rule is designed to identify the creation of a Volume Shadow Copy on Windows systems using PowerShell, specifically through the utilization of the `Win32_ShadowCopy` class. The primary threat scenario involves attackers attempting to create a backup of the Active Directory domain database to extract sensitive credential information. This technique is often used as part of larger credential access efforts to facilitate unauthorized access to user accounts and further compromise the network.

  The relevant MITRE ATT&CK tactics include **Credential Access** and **Task Automation**. The related techniques are **T1003.003: Credential Dumping: NTDS.dit** and **DS0005: Shadow Copy**. These techniques highlight the potential risk posed by unauthorized shadow copy creation, which can act as a precursor to extracting sensitive data from the Active Directory.

  The best sources of telemetry for this detection rule include PowerShell script logs, particularly those that capture script block execution events, and Windows Event Logs that record PowerShell activity. It is essential that Script Block Logging is enabled to capture the specifics of PowerShell commands being executed on the system.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for any instances of `Win32_ShadowCopy` method calls, focusing on the creation commands and parameters used during execution.
  - **Analyze System Events:** Look into Windows Event Logs for indications of shadow copy creation, such as Event ID 104 or related entries that might correlate with the timings of the suspicious PowerShell activity.
  - **Inspect Active Directory Access Attempts:** Investigate any unusual access patterns or authentication attempts against the Active Directory around the time of the shadow copy creation to determine if other credential access methods were employed.
  - **Assess Recovery and Backup Activities:** Identify any legitimate backup processes or scheduled tasks that may coincide with the detected activity to rule out false positives and ensure the activity is indeed malicious.

  ### Prioritization
  This alert is considered high severity due to the potential impact of credential exposure and domain compromise it represents. The likelihood of an attacker successfully leveraging shadow copies to gain unauthorized access to sensitive data is significant in enterprise environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Script Block Logging is not enabled, as essential PowerShell command details would be missing. This detection rule assumes that the logs are being collected in a timely manner and that other indicators of compromise (e.g., unusual login patterns, system configuration changes) are also being monitored. Additionally, this rule may produce false positives in environments where legitimate administrative tasks are performed without adequate context or analysis.

