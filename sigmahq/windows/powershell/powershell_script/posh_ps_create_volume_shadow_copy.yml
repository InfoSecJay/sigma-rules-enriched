note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that create Volume Shadow Copies, specifically targeting the `Win32_ShadowCopy` WMI class. Attackers may exploit this to capture a snapshot of the Active Directory database, facilitating credential theft or lateral movement across the network. This behavior aligns with the MITRE ATT&CK techniques for credential access (T1003.003) and data exfiltration via accessing domain databases (DS0005).

  The primary telemetry source is Windows PowerShell script logs, which are generated when Script Block Logging is enabled. If malicious, this activity may lead to unauthorized access to sensitive credential information and facilitate further attacks. Importantly, this detection does NOT confirm that sensitive data was successfully obtained; it merely shows that a command indicative of a potential credential access attempt was executed.

  ### Investigation Steps

  - **Review PowerShell script logs:** Check for Security Event ID 4104 related to PowerShell with the following fields: `ScriptBlockText`, which should show references to `Win32_ShadowCopy` and `.Create(`.

  - **Identify suspicious script activity:** Look for uncommon user accounts or service accounts executing the shadow copy command, especially during odd hours or from unexpected hosts, as this can indicate malicious activity.

  - **Validate legitimate use cases:** Cross-reference with known legitimate PowerShell scripts that utilize shadow copying for backup purposes. These would typically be executed by IT administrators from designated management workstations.

  - **Correlate with Active Directory configuration changes:** Check the Security Event Log for any changes (Event ID 5136) in the Active Directory schema that occurred around the same time, which could indicate a broader intrusion attempt.

  - **Examine system event logs:** Look at System Event ID 1074 to find any unexpected system shutdowns or reboots that could indicate malicious script execution altering system behavior.

  - **Identify known malicious indicators:** Look for the use of PowerShell command line parameters such as `-ExecutionPolicy Bypass` or obfuscated command strings. These can act as red flags signaling potential harmful intent.

  ### Prioritization

  This alert is high severity due to the potential impact on a domain environment if unauthorized access to sensitive credential information occurs. The likelihood of this technique being weaponized is high, as adversaries often look for ways to exfiltrate credential information from systems they compromise effectively.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, potentially missing legitimate administrative actions. Evasion techniques could include altering standard PowerShell scripts to hide the execution of `Win32_ShadowCopy`, or using alternate tools that do not trigger script-based logging. Legitimate activities can include routine backup operations involving shadow copies, particularly in disaster recovery scenarios. A related detection that enhances coverage includes monitoring the creation of unusual Volume Shadow Copies using Windows Event ID 5040 to capture both the creation and alteration of shadow copies.

