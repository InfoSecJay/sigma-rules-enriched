note: |
  ### Technical Context

  This rule detects the usage of PowerShell to create Volume Shadow Copies through the `Win32_ShadowCopy` WMI class. Such actions are typically associated with adversaries seeking to exfiltrate sensitive data, including credential information from the Active Directory database. This behavior aligns with the MITRE ATT&CK framework, specifically under the Credential Access tactic (TA0006) and the technique of Credential Dumping via Volume Shadow Copy (T1003.003). The primary telemetry source for this detection is PowerShell script block logging, which captures the scripts executed and their contents. If successful, this malicious behavior can lead to unauthorized access to sensitive user credentials, posing a significant risk to the organization's security posture. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate PowerShell scripts may also invoke similar functionality.

  ### Investigation Steps

  - **Review PowerShell execution logs**: Check PowerShell events (Event ID 4104) for script block logs that include `Win32_ShadowCopy` and the method 'Create'. Verify the script's context and execution environment.

  - **Identify the user account that executed the command**: Look for the Actor details in the PowerShell event logs. Determine if the account is a known administrator or a user with the appropriate permissions, which could indicate potential abuse.

  - **Examine the surrounding activity**: Analyze related Windows Event Logs (Security Event ID 4624 for logon events) to identify unusual account logins or escalated privileges around the time of the invocation, which may suggest reconnaissance or lateral movement.

  - **Document legitimate usage patterns**: Compare observed actions with known legitimate PowerShell scripts used by your organization. Identify authorized administrator actions or backups that might explain the usage of Volume Shadow Copy.

  - **Check for file creation or transfer**: Monitor for any file activity related to Volume Shadow Copies, such as file creation timestamps that match the execution time of the script. Cross-reference with backups or restoration processes to validate benign operations.

  - **Look for anomalous artifacts**: Search for unusual WMI event logs (Event ID 5858) or processes spawned by PowerShell related to shadow copy creation; correlate timestamps, user accounts, and system roles to identify possible exploitation.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive credentials and the likelihood of malicious use to facilitate further attacks, particularly in enterprise environments where attacker interest in credential access is high. The technique of creating shadow copies is commonly weaponized by threat actors during credential theft operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for script block logging being enabled; without this, such PowerShell activities may go unnoticed. Legitimate administrative activities, such as backups or system repairs using Volume Shadow Copy, can trigger this alert. An associated detection to enhance coverage would be monitoring for unusual administrative actions or abnormal access patterns to WMI objects.

