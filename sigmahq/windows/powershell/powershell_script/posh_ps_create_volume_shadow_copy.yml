  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts that create Volume Shadow Copies using the `Win32_ShadowCopy` class. Such actions may be indicative of an attacker attempting to acquire copies of sensitive data, such as the Active Directory domain database, for credential theft. This behavior aligns with the MITRE ATT&CK technique "Local File Inclusion" (ID: T1003.003) and the tactic "Credential Access."

  The primary telemetry source is PowerShell script logging, specifically designed to detect script block invocations. If successfully executed, this action may lead to unauthorized access to confidential information, leading to a significant security compromise. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may utilize similar commands.

  ---

  ### Investigation Steps

  - **Check PowerShell script block logs:** Review Windows Event ID 4104 to find instances of the relevant PowerShell command (`Win32_ShadowCopy`). Look for non-administrative users executing this command as a potential indicator of compromise.

  - **Identify system context:** Determine the user and context in which the command was executed. If the user is not typically responsible for backup or shadow copying tasks and is on a non-administrative workstation, this raises suspicion.

  - **Examine recent system change history:** Investigate Event ID 7011 (Windows Backup) or other relevant logs to check for legitimate backup schedules. If there was no scheduled task or previous record of volume shadow copy creation, this is a red flag.

  - **Review execution context:** For non-legitimate activity, ensure the `ScriptBlockText` field contains the full command including all `Create` parameters. Legitimate activity often includes additional context or variations (like specifying distinct storage paths).

  - **Look for follow-on malicious indicators:** Examine logs for subsequent file creation from the shadow copy. Check for Event ID 4663 where files are accessed or copied from shadow storage—indicative of sensitive data exfiltration.

  - **Corroborate with malware activity:** Cross-reference detected command sequences with known malware signatures or patterns, potentially using Endpoint Detection and Response (EDR) solutions for deeper visibility into code execution flow.

  ---

  ### Prioritization

  This alert should be prioritized as high severity due to the significant impact on sensitive data if malicious. The likelihood of abuse is elevated, as creating Volume Shadow Copies is commonly associated with credential harvesting and lateral movement tactics used by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist when script block logging is not enabled or fails to capture obfuscated scripts. Legitimate PowerShell scripts executing similar commands may also trigger false positives, such as system backup operations. To enhance detection coverage, companion detections on file access and data exfiltration activities should be implemented, monitoring anomalies related to Volume Shadow Copies.

