logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  empire:
        # better to randomise the order
    ScriptBlockText|contains|all:
    - 'System.Diagnostics.Process'
    - 'Stop-Computer'
    - 'Restart-Computer'
    - 'Exception in execution'
    - '$cmdargs'
    - 'Close-Dnscat2Tunnel'
  dnscat:
        # better to randomise the order
    ScriptBlockText|contains|all:
    - 'set type=$LookupType`nserver'
    - '$Command | nslookup 2>&1 | Out-String'
    - 'New-RandomDNSField'
    - '[Convert]::ToString($SYNOptions, 16)'
    - '$Session.Dead = $True'
    - '$Session["Driver"] -eq'
  condition: empire and dnscat
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This rule detects the execution of scripts related to the Silence malware, specifically the use of the EmpireDNSAgent, which allows attackers to establish command-and-control communication using DNS. The likely attacker objective is to maintain persistent access to the victim network, execute commands, and exfiltrate data without detection. Relevant MITRE ATT&CK techniques include Command and Scripting Interpreter (T1059.001) and Application Layer Protocol (T1071.004). The primary telemetry sources are PowerShell Script Block Logging, which must be enabled for effective monitoring, and logs related to DNS queries and responses. If confirmed as malicious, the threat could lead to data breaches and extensive operational disruptions. This detection does NOT confirm that a system has been compromised without further validation and context.

  ### Investigation Steps

  - **Validate PowerShell Script Block Logging:** Check for the presence of Security Event ID 4104 in the Windows Event Log, which logs PowerShell script blocks. Ensure that the ‘ScriptBlockText’ contains elements indicating the presence of EmpireDNSAgent or suspicious DNS commands.

  - **Identify Potential Malicious Commands:** Look for specific strings in the script blocks such as 'Close-Dnscat2Tunnel', 'Stop-Computer', or any PowerShell command attempting DNS resolution (`nslookup`). These are indicative of Silence activities and should raise suspicion of malicious intent.

  - **Review DNS Query Patterns:** Examine DNS logs for unusual queries that are not typical for regular operations, particularly those associated with domains known to be used by Silence. Common benign activity includes standard domain lookups for internal services, while anomalies may suggest exfiltration attempts.

  - **Check for Remote Execution Events:** Identify if there are any user accounts performing remote commands via PowerShell (using Event ID 4688 for process creation) that coincide with the identified script execution to correlate suspicious internal activity or lateral movement.

  - **Establish Legitimate Baselines:** Review normal PowerShell usage patterns within your environment, including authorized administrative operations or regular operational tasks. Anomalies against these baselines can indicate potential malicious behavior.

  - **Correlate with Known Indicators of Compromise (IOCs):** Cross-reference any observed command patterns or script executions with published IOCs related to Silence malware. Confirm any matches with threat intelligence sources to enhance the confidence level on the alert.

  ### Prioritization

  This alert should be treated with high priority due to its potential impact on the organization, particularly since it involves command-and-control capabilities potentially leading to data theft or infrastructure compromise. The behavior detected is a common tactic used by sophisticated adversaries, highlighting a significant likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers using obfuscation techniques to bypass detection by altering script content. It is essential that PowerShell Script Block Logging is consistently enabled and configured across all endpoints to guarantee comprehensive visibility. Legitimate activities such as network maintenance or administrative tasks using PowerShell may also trigger this alert. Other companion detections, like monitoring for unusual DNS request patterns associated with known malicious domains, can enhance coverage and increase detection confidence.

