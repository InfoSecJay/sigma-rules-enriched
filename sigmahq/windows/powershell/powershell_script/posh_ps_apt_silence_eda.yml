title: Silence.EDA Detection
id: 3ceb2083-a27f-449a-be33-14ec1b7cc973
status: test
description: Detects Silence EmpireDNSAgent as described in the Group-IP report
references:
- https://www.group-ib.com/resources/threat-research/silence_2.0.going_global.pdf
author: Alina Stepchenkova, Group-IB, oscd.community
date: 2019-11-01
modified: 2023-04-03
tags:
- attack.execution
- attack.t1059.001
- attack.command-and-control
- attack.t1071.004
- attack.t1572
- attack.impact
- attack.t1529
- attack.g0091
- attack.s0363
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  empire:
        # better to randomise the order
    ScriptBlockText|contains|all:
    - 'System.Diagnostics.Process'
    - 'Stop-Computer'
    - 'Restart-Computer'
    - 'Exception in execution'
    - '$cmdargs'
    - 'Close-Dnscat2Tunnel'
  dnscat:
        # better to randomise the order
    ScriptBlockText|contains|all:
    - 'set type=$LookupType`nserver'
    - '$Command | nslookup 2>&1 | Out-String'
    - 'New-RandomDNSField'
    - '[Convert]::ToString($SYNOptions, 16)'
    - '$Session.Dead = $True'
    - '$Session["Driver"] -eq'
  condition: empire and dnscat
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  The "Silence.EDA Detection" rule is designed to identify the execution of Silence's EmpireDNSAgent, a malicious tool linked to the Silence threat group. This tool operates by utilizing DNS tunneling techniques to establish covert command-and-control channels while performing other nefarious activities within the network. The primary attacker objective is likely to exfiltrate data and maintain persistence within compromised systems, often leading to further exploitation or lateral movement within the target environment.

  This detection rule aligns with several MITRE ATT&CK tactics and techniques, notably:
  - Execution (T1059.001): PowerShell
  - Command and Control (T1071.004): Application Layer Protocol: DNS
  - Impact (T1529): Resource Hijacking
  - Various specific threat techniques associated with the use of covert channels and remote access tools.

  The primary data sources for effective detection include PowerShell script block logging, which captures detailed information about executed scripts, as well as network logs that record DNS requests and anomalies within DNS traffic patterns.

  ### Investigation Steps
  - **Review Script Logs**: Analyze PowerShell script block logs for any instances of the detected key characteristics, such as the use of `Stop-Computer`, `Restart-Computer`, or DNS tunneling clues like `nslookup` commands.
  - **Investigate Network Traffic**: Examine DNS logs for unusual queries or patterns, specifically those that deviate from typical operational behavior, such as frequent DNS requests to uncommon domains.
  - **Assess Endpoint Activity**: Check for potential indicators of compromise on endpoints where the detection was triggered, including process creation logs to correlate with PowerShell activity.
  - **Correlate with Threat Intelligence**: Utilize threat intelligence correlating Silence group activity and known behaviors to inform triage and pivot further investigations effectively.

  ### Prioritization
  This alert is considered critical due to the high potential impact associated with advanced persistent threat (APT) activities, which can lead to severe data breaches or system compromises, along with the low likelihood of false positives from legitimate administrative scripts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if script block logging is not enabled or if network DNS logs are not retained adequately. The detection logic assumes that the threat will utilize typical commands associated with the Silence group, which may vary in different attack scenarios. Proper logging configurations and retention policies must be in place to ensure all necessary evidence is collected for effective detection.

