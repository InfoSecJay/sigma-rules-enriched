note: |
  ### Technical Context

  This rule detects the execution of Base64 encoded shellcode via PowerShell scripts. The likely attacker objective is to execute malicious payloads that could facilitate privilege escalation, data exfiltration, or lateral movement within the environment. This activity is relevant to multiple MITRE ATT&CK techniques, notably **Execution** (T1059.001: PowerShell) and **Stealth** (T1055: Process Injection). The primary telemetry sources are PowerShell script block logs, which require Script Block Logging to be enabled to capture the relevant events. If malicious, this behavior can lead to significant security compromises, including the installation of malware or unauthorized access. This detection does NOT confirm that an actual compromise has occurred, as legitimate scripts may also use encoded commands.

  ### Investigation Steps

  - **Check script block logging status:** Validate that PowerShell Script Block Logging is enabled on monitored systems (Event ID 4104). If not enabled, any potential executions will not be captured.

  - **Examine the specific PowerShell command:** Investigate Event ID 4104 entries for the presence of commands containing 'OiCAAAAYInlM' or 'OiJAAAAYInlM'. Pay attention to the process ID, parent process ID, and user context to identify any potential malicious execution.

  - **Determine the legitimacy of the invoking process:** Identify the parent process (e.g., WinRM, a scheduled task) that spawned the PowerShell execution. Legitimate administrative tasks typically involve known management processes or scripts, while unexpected origins may indicate suspect behavior.

  - **Look for additional indicators of compromise:** Cross-reference the detected PowerShell commands with other telemetry sources (e.g., process creation logs - Event ID 4688) to identify if there are any suspicious parent processes initiating PowerShell instances that match the detected script block.

  - **Identify the frequency of detection:** Evaluate how often these Base64 encoded commands are being executed over a specific timeframe. High frequency in a short period could indicate a scripted attack or automated exploitation attempt.

  ### Prioritization

  This alert signifies a high severity in an enterprise environment due to the potential for remote code execution or privilege escalation if exploited. Given that encoded shellcode is often utilized in targeted attacks, the likelihood of malicious abuse is substantial, especially in environments with robust PowerShell usage.

  ### Blind Spots and Assumptions

  Detection may be evaded by obfuscating the Base64 encoding or using different encoding techniques. Additionally, PowerShell may be used legitimately by administrative personnel for automation and system management tasks, which could potentially trigger this alert. Ensuring not only the analysis of PowerShell logs but also the validation of surrounding context (like user behavior and other log sources) will provide a clearer picture. A related detection to bolster coverage would be monitoring for **PowerShell cmdlets** that invoke network connections to understand potential data exfiltration risks.

