note: |
  ### Technical Context
  This detection rule identifies instances of Base64 encoded shellcode being executed via PowerShell, which is often employed by attackers to evade detection and execute malicious payloads in a stealthy manner. The use of PowerShell for such purposes is a common tactic in the initial stages of an attack, wherein the attacker aims to bypass security controls, maintain persistence, or directly execute arbitrary commands on a compromised system. By attempting to run Base64 encoded payloads, adversaries capitalize on PowerShell's powerful scripting capabilities while obscuring their activities.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Execution (T1059.001): PowerShell
  - Defense Evasion (T1055): Process Injection
  - Privilege Escalation (T1055): Process Injection

  To effectively detect this behavior, the primary data source required is PowerShell Script Block Logging, which must be enabled on the system. This source captures the details of scripts being executed, providing insights into potentially malicious activities leveraging PowerShell.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for entries containing the Base64 encoded strings 'OiCAAAAYInlM' and 'OiJAAAAYInlM'. Look for unusual command activities, especially in user accounts with elevated privileges.
  - **Analyze Recent Activity:** Investigate recent user activity associated with accounts that triggered the alert. Determine if there were prior indications of suspicious behavior or if the account has been compromised.
  - **Inspect Network Traffic:** Check for outbound network connections initiated during the execution of the detected scripts. Investigate any unexpected or anomalous connections to external IP addresses or domains.
  - **Evaluate System Changes:** Review changes to system configurations or any unauthorized installations around the time of the alert. This can reveal further indicators of compromise or malicious intent.

  ### Prioritization
  Given the high potential impact of this alert in an enterprise environment, the severity is elevated due to the likelihood that Base64 encoded shellcode could facilitate the execution of malicious payloads, leading to system compromise and data loss.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if PowerShell Script Block Logging is not enabled across all relevant systems, leading to potentially missed executions. Additionally, if attackers use alternative encoding methods or different scripting techniques that do not match the signatures provided, they may evade detection. Assumptions also include a standard operating environment where PowerShell is widely used; thus, any deviations from expected usage patterns might not be captured. To ensure effective detection, it is crucial that logging configurations are reviewed and updated as necessary.

