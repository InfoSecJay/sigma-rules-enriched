note: |
  ### Technical Context

  This Sigma rule detects the presence of Base64 encoded Shellcode within PowerShell scripts, indicative of potential exploitation techniques often employed by attackers to execute malicious payloads. The likely objective of such encoded shellcode usage is to bypass security controls and execute arbitrary code in the context of a user's session, which can lead to privilege escalation or system compromise. Relevant MITRE ATT&CK tactics and techniques include “Defense Evasion” (TA0005) and “PowerShell” (T1059.001).

  The primary telemetry sources include PowerShell script block logs, specifically requiring that Script Block Logging is enabled. If malicious, the use of PowerShell for executing encoded shellcode poses a significant security risk, potentially leading to data breach, system integrity compromise, and lateral movement within the network. However, this detection does NOT confirm that the executed script was successful or that any subsequent malicious behavior occurred without further contextual validation.

  ### Investigation Steps

  - **Verify the script block logging status**: Check if PowerShell Script Block Logging is enabled in the environment using Event ID 400 in the Security log or by reviewing Group Policy settings (under Computer Configuration > Administrative Templates > Windows Components > Windows PowerShell).

  - **Examine the specific script block text**: Look for Event ID 4104 logs for PowerShell script block execution, filtering for occurrences of the strings 'OiCAAAAYInlM' or 'OiJAAAAYInlM' in the `ScriptBlockText` field as indicators of suspicious activity.

  - **Identify expected PowerShell usage**: Review recent PowerShell activity (Event ID 4104) for legitimate administrative tasks, such as common script executions or approved automation, noting the context and specific commands being executed.

  - **Check for abnormal parent process**: Investigate the parent process of the PowerShell execution; a suspicious parent process (e.g., cmd.exe or rundll32.exe) can confirm malicious intent compared to benign origins like an administrator’s command line (using logs that include Event ID 4688).

  - **Review the system for file creation or modification**: Validate whether any new executables or suspicious files were created during this period by checking file system logs or using Sysmon Event ID 11 (FileCreate) to determine if malicious shellcode was written to disk.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems and the likelihood that encoded shellcode in PowerShell can be weaponized for various attacks. The threat is significant as encoded payloads are commonly utilized by adversaries to subvert defenses and gain unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be circumvented by attackers who use alternative encoding methods or PowerShell obfuscation techniques to hide malicious behavior. Ensure that Script Block Logging is reliably configured across all Windows assets to achieve optimal coverage. Legitimate administrator activities can also trigger this alert if they inadvertently utilize base64 encoded script segments. Related detections, such as those monitoring unusual PowerShell command lines or the execution of scripts from non-standard directories (File System integrity monitoring), can enhance overall detection capabilities.

