logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
        # 4194304 DONT_REQ_PREAUTH
    ScriptBlockText|contains|all:
    - 'Get-ADUser'
    - '-Filter'
    - 'useraccountcontrol'
    - '-band'
    - '4194304'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_as_rep_roasting/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts that enumerate Active Directory user accounts targeting those with the UserAccountControl flag set to indicate that pre-authentication is not required (4194304). The likely attacker objective is to gather information about sensitive user accounts that can be exploited for AS-REP roasting, a method to extract Kerberos Ticket Granting Ticket (TGT) hashes. This corresponds with the MITRE ATT&CK tactic of Discovery, specifically technique T1033 (System Owner/User Discovery). The primary telemetry source for this detection is PowerShell script block logging, specifically identifying commands and their arguments. If malicious, this behavior could lead to credential theft and unauthorized access to sensitive systems. It's essential to note that this detection does not confirm an ongoing attack; it indicates a potential reconnaissance step.

  ### Investigation Steps

  - **Check PowerShell Execution Policy:** Verify if the execution policy allows for script execution. Look for Event ID 4104 (PowerShell Script Block Logs) capturing any instances of 'Get-ADUser' commands containing '-Filter' and the flag '-band 4194304'.

  - **Correlate with User Account Data:** Cross-reference the targeted accounts with Active Directory logs (Event ID 4720 for account creations) to confirm if flagged accounts exist and assess their previous activities.

  - **Assess Legitimate PowerShell Usage:** Determine if legitimate scheduled tasks or automated scripts are running that require enumerating user accounts. Refer to documentation or logs from system administrators to confirm benign usages.

  - **Identify High-Confidence Malicious Indicators:** Look for unusual PowerShell command paths or the presence of encoded commands that might indicate obfuscation. Specific flags in the command can indicate a direct attempt to leverage AS-REP roasting.

  - **Review Anomalies in UserAccountControl Flags:** Analyze other UserAccountControl flags set for listed accounts in AD to check for misconfigurations or changes. This can help identify if suspicious activities align with recent legitimate administration tasks.

  ### Prioritization

  This alert is medium severity, as it indicates potential pre-attack reconnaissance that could lead to credential theft. The impact is significant if targeting critical accounts, especially in environments where sensitive applications or data are accessed. However, this behavior is not frequently weaponized, primarily due to the specific conditions required.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell script block logging is not enabled or configured correctly, potentially allowing malicious activity to go undetected. Legitimate administrative tasks may inadvertently trigger alerts, particularly if administrators frequently check account properties. A related detection could be monitoring for unusual authentication attempts (e.g., Event ID 4768 for Kerberos TGT requests) following such enumeration activities, enhancing overall investigation coverage.

