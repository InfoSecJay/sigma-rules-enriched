title: Get-ADUser Enumeration Using UserAccountControl Flags
id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
status: test
description: Detects AS-REP roasting is an attack that is often-overlooked. It 
  is not very common as you have to explicitly set accounts that do not require 
  pre-authentication.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md#atomic-test-11---get-aduser-enumeration-using-useraccountcontrol-flags-as-rep-roasting
- https://shellgeek.com/useraccountcontrol-flags-to-manipulate-properties/
author: frack113
date: 2022-03-17
tags:
- attack.discovery
- attack.t1033
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
        # 4194304 DONT_REQ_PREAUTH
    ScriptBlockText|contains|all:
    - 'Get-ADUser'
    - '-Filter'
    - 'useraccountcontrol'
    - '-band'
    - '4194304'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects PowerShell scripts that leverage the Get-ADUser cmdlet to enumerate Active Directory user accounts based on specific UserAccountControl flags, especially the absence of pre-authentication (flag: 4194304). An adversary using this method may aim to identify accounts that could be exploited for AS-REP Roasting attacks, facilitating the extraction of hashed credentials without further pre-requisites. The relevant MITRE ATT&CK tactic is Discovery, specifically the technique T1069.002 (Permission Groups Discovery).

  The primary telemetry comes from Windows PowerShell logs, specifically those related to script block logging, which must be enabled to capture related events. If malicious, this behavior can compromise credentials and potentially lead to unauthorized access within the network. It is critical to note that this detection does not confirm that a successful attack has occurred; it only highlights potentially suspicious enumeration activity.

  ### Investigation Steps

  - **Review PowerShell Script Logs:** Check for Event ID 4104 in Windows PowerShell logs to identify the execution of scripts that include the Get-ADUser cmdlet, especially those with parameters indicating the use of UserAccountControl by value 4194304.

  - **Identify User Account Targeting Patterns:** Analyze the output of the detected script for any specific usernames or account patterns. Look for multiple queries against common service usernames (e.g., "krbtgt") that could indicate targeted reconnaissance.

  - **Verify Script Legitimacy:** Cross-check recent PowerShell executions for known legitimate scripts that might employ similar commands. Look for documentation or change control approvals for routine administrative tasks that can explain the use of these parameters.

  - **Evaluate Execution Context:** Analyze the user context under which the PowerShell script was executed. If executed from a non-administrative or unexpected user account within a sensitive environment, this could be an indicator of malicious intent.

  - **Cross-reference with AD Logs:** Look at Event ID 4662 in the Security logs for any corresponding changes or accesses to Active Directory objects around the time the PowerShell script was executed. This may help correlate potential unauthorized actions.

  ### Prioritization

  The severity of this alert is medium due to the critical nature of Active Directory within an enterprise environment. While enumeration on its own does not suggest immediate compromise, the high likelihood of leveraging discovered accounts for further attacks warrants timely investigation. This method is not commonly used, making legitimate occurrences rarer.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled or if PowerShell has been disabled by organizational policy, leading to potential missed detections. Legitimate administrative tasks may trigger this alert, such as regular audits or account management scripts. A related detection to consider for enhanced coverage is monitoring for unusual patterns of login failures (T1075.001), which could indicate attempts to exploit accounts discovered through enumeration.

