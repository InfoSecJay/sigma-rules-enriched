title: Get-ADUser Enumeration Using UserAccountControl Flags
id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
status: test
description: Detects AS-REP roasting is an attack that is often-overlooked. It is
  not very common as you have to explicitly set accounts that do not require pre-authentication.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md#atomic-test-11---get-aduser-enumeration-using-useraccountcontrol-flags-as-rep-roasting
- https://shellgeek.com/useraccountcontrol-flags-to-manipulate-properties/
author: frack113
date: 2022-03-17
tags:
- attack.discovery
- attack.t1033
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
        # 4194304 DONT_REQ_PREAUTH
    ScriptBlockText|contains|all:
    - 'Get-ADUser'
    - '-Filter'
    - 'useraccountcontrol'
    - '-band'
    - '4194304'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the `Get-ADUser` PowerShell cmdlet with specific filters targeting `UserAccountControl` flags, particularly those that indicate accounts set to not require pre-authentication (flag value `4194304`). This behavior is associated with the technique of AS-REP roasting, where an attacker seeks to enumerate user accounts in Active Directory that have disabled pre-authentication. These accounts can be exploited to retrieve encrypted authentication tickets, facilitating unauthorized access to network resources.

  The likely objective of an attacker using this method is to identify accounts that can be compromised without needing prior authentication, making it easier to crack the Kerberos tickets obtained. This aligns with the MITRE ATT&CK framework, particularly under the tactics of Discovery and the technique T1069.002, which focuses on Active Directory enumeration methods. The primary data source for this detection includes PowerShell script block logging from Windows endpoints, which captures detailed information about executed commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for occurrences of the `Get-ADUser` command with `-band 4194304`. Look for parameters that suggest enumeration of accounts.
  - **Analyze UserAccountControl Flags:** Check the `UserAccountControl` flags of user accounts in Active Directory to identify any that are marked to not require pre-authentication and are being queried.
  - **Correlate with Account Activity:** Look for any recent logins or activities from accounts flagged in the detection, especially those that align with attempted or successful unauthorized access.
  - **Inspect Authentication Requests:** Review Kerberos authentication logs for AS-REP requests to identify if any pre-authentication disabled user accounts were targeted.

  ### Prioritization
  This alert has medium severity due to the potential for significant impact on the security of the enterprise environment if an account with `DONT_REQ_PREAUTH` is successfully exploited. Although AS-REP roasting attacks may not be prevalent, the existence of such accounts poses a substantial risk, warranting prompt investigation.

  ### Blind Spots and Assumptions
  The primary gap in this detection logic is the reliance on PowerShell script block logging, which may not be enabled on all systems by default, leading to missed detections. The detection assumes that the accounts being queried are indeed inactive or have no legitimate need to bypass pre-authentication. Additionally, if logs are not sufficiently retained or collected, analysts may lack the historical data necessary for thorough investigations. Ensuring that script block logging is enabled and that logging practices meet compliance is critical for this alert to function effectively.

