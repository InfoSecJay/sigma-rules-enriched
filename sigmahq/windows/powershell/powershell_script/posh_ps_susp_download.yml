  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  webclient:
    ScriptBlockText|contains: 'System.Net.WebClient'
  download:
    ScriptBlockText|contains:
    - '.DownloadFile('
    - '.DownloadFileAsync('
    - '.DownloadString('
    - '.DownloadStringAsync('
  condition: webclient and download
falsepositives:
- PowerShell scripts that download content from the Internet
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell commands utilizing the `System.Net.WebClient` object for downloading content from the internet, leveraging methods such as `.DownloadFile()`, `.DownloadString()`, and their asynchronous counterparts. The likely objective of an attacker utilizing this behavior is to retrieve malicious payloads or scripts to execute on a target system, assisting in subsequent exploits or data exfiltration. This activity falls under the MITRE ATT&CK tactic of Execution (T1203) and the technique for Command-Line Interface (T1059.001).

  Primary telemetry sources include Windows PowerShell logs, specifically Script Block Logging, which must be enabled to capture the relevant details. If malicious, this behavior could signify an early stage in a compromise or an attempt to facilitate further malicious activity within the environment. Importantly, this detection alone does not confirm malicious activity; legitimate use cases exist where PowerShell is used for downloading content, particularly by system administrators or IT personnel.

  ### Investigation Steps

  - **Review PowerShell logs for script block execution**: Check Windows event logs for Security Event ID 4104, which should detail the script block containing the suspicious WebClient commands. Pay attention to the associated user account and context of execution to differentiate between benign and malicious usage.

  - **Validate process lineage**: Use Sysmon logs (Event ID Process Create, ID 4688) to trace the PowerShell process. Look for unusual parent processes, indicating the PowerShell script might have been invoked by a suspicious process, which could suggest malicious intent.

  - **Check for external connections**: Examine network logs (e.g., Windows Firewall logs or IDS alerts) for outbound connections initiated around the same timeframe as the PowerShell execution. Look for connections to known malicious IPs or domains, which would signify a higher likelihood of malicious activity.

  - **Document legitimate uses in the environment**: Establish a baseline for acceptable usage of `System.Net.WebClient` in your environment. Identify known internal scripts or administrative tasks that involve downloading files and document their typical command patterns for reference.

  - **Look for simultaneous suspicious behavior**: Investigate for other signs of compromise, such as additional suspicious processes or file modifications within the system (Event ID 4663), which can demonstrate a coordinated attack vector often seen in exploitation scenarios.

  ### Prioritization

  Given the potential impact of arbitrary code execution and data compromise resulting from this behavior, the alert should be treated with medium severity. Although such PowerShell downloads can be leveraged for legitimate administrative tasks, they are commonly exploited techniques for initial entry points in various attack vectors.

  ### Blind Spots and Assumptions

  This detection may miss commands if Script Block Logging is not enabled, leading to gaps in visibility. An attacker could use obfuscation techniques or alternate methods of downloading, such as using `Curl` or `wget`, which would bypass this detection. Legitimate automated tools or scripts that download updates or configuration files may frequently trigger this alert. A related detection could involve monitoring outbound network traffic for subsequent connections to command and control (C2) infrastructure, strengthening overall detection efficacy.

