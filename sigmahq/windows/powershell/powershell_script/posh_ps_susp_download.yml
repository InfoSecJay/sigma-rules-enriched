note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious PowerShell commands that utilize the `System.Net.WebClient` methods to download files or strings from the internet. The likely attacker objective is to retrieve a malicious payload or script from a remote location for execution on the compromised host. This activity corresponds to the MITRE ATT&CK technique "Command and Scripting Interpreter: Windows PowerShell (T1059.001)."

  The primary telemetry sources for this detection include PowerShell script logs, specifically requiring Script Block Logging to be enabled on Windows systems to capture the relevant command executions. If malicious, this behavior could lead to unauthorized code execution or malware installation, potentially compromising the integrity and confidentiality of the system. Notably, this detection does NOT confirm that the command resulted in successful exploitation or that the downloaded content is inherently malicious.

  ---

  ### Investigation Steps

  - **Validate the log source configuration**: Confirm that PowerShell Script Block Logging is enabled. Check in Group Policy under `Computer Configuration\Administrative Templates\Windows Components\Windows PowerShell` for the setting "Turn on PowerShell Script Block Logging."

  - **Review the specific Script Block logs**: Look at Security Event ID 4104 for lines containing `System.Net.WebClient` with associated method calls. Investigate any associated command context to identify intent.

  - **Identify high-confidence malicious indicators**: Check for known malicious URLs in the command log, examining the complete command that includes `.DownloadFile(` or `.DownloadString(`. Compare against threat intelligence databases for recent malicious domains.

  - **Determine legitimate usage**: Valid PowerShell scripts often download necessary updates or files from trusted internal or external sources. Validate IP addresses and URLs against whitelist entries or known good repositories.

  - **Assess host environment**: Consider the criticality of the host—servers, workstations, or admin systems are prioritized. Identify if the action was initiated by an admin or an unauthorized user.

  - **Check for file creation artifacts**: Look for file creation events related to the downloaded content, such as Security Event ID 4663, focusing on paths commonly associated with malicious activities (e.g., temporary folders, local user directories).

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact of downloading untrusted content onto critical systems. The likelihood of malicious abuse is moderate, as attackers commonly leverage PowerShell for scripting malicious downloads. While not universally weaponized, PowerShell download commands frequently precede executed payloads.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via obfuscation of the PowerShell commands or the use of alternate command execution methods that do not invoke `System.Net.WebClient`. Reliable detection requires logging configurations that might not be universally applied in all environments. Legitimate activities, such as automated backup scripts or administrative updates, might trigger this alert. A related detection to strengthen coverage would be monitoring for execution of alerts for PowerShell scripts post file download, providing context for the execution conditions.

