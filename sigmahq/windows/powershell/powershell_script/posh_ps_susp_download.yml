logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  webclient:
    ScriptBlockText|contains: 'System.Net.WebClient'
  download:
    ScriptBlockText|contains:
    - '.DownloadFile('
    - '.DownloadFileAsync('
    - '.DownloadString('
    - '.DownloadStringAsync('
  condition: webclient and download
falsepositives:
- PowerShell scripts that download content from the Internet
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious use of PowerShell commands that download content from the internet, particularly utilizing the `System.Net.WebClient` class. By monitoring these PowerShell script events, the rule aims to uncover scenarios where an attacker may be attempting to retrieve malicious payloads or exfiltrate data. These commands can be employed as part of a larger attack chain, allowing adversaries to execute malware or data-stealing scripts remotely.

  The threat scenario typically involves attackers using PowerShell for execution, representing straightforward yet effective methods to bypass traditional security controls. Common objectives include establishing a foothold within the environment, moving laterally, or executing further malicious actions. Relevant MITRE ATT&CK tactics include **Execution** and the technique **T1059.001: Command and Scripting Interpreter: Windows PowerShell**. The primary data sources that contain the best evidence are PowerShell script logs, specifically those produced by Script Block Logging, which must be enabled to capture command execution details effectively.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine logs from PowerShell with Script Block Logging enabled to identify instances of the `System.Net.WebClient` class being invoked, focusing on commands that use `.DownloadFile()` or `.DownloadString()`.
  - **Analyze Parent Processes**: Investigate the parent processes of PowerShell instances executing these download commands to determine if they were spawned by expected applications or through suspicious means.
  - **Check for Network Activity**: Correlate the PowerShell logs with network traffic data to see if connections are made to unusual or suspicious external IP addresses during the time the download commands were executed.
  - **Validate Script Sources**: Determine the source of the scripts being downloaded by checking the associated URL or IP address for indicators of compromise (IOCs) or known malicious behavior.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for an attacker to download and execute malicious content, which could lead to significant compromise within an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Script Block Logging is not enabled on all endpoints, potentially missing malicious activity. The detection logic assumes that attackers will employ common downloads methods using `System.Net.WebClient` but may overlook scripts that utilize alternative libraries or methods. Comprehensive logging from PowerShell and proper configurations to ensure logging is preserved are crucial for the alert to function effectively.

