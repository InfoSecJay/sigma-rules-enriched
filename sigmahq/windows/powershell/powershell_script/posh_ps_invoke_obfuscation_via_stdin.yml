logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|re: '(?i)(set).*&&\s?set.*(environment|invoke|\$\{?input).*&&.*"'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell scripts that utilize standard input (stdin) to execute commands. Attackers often employ obfuscation techniques to hide malicious behavior from security tools and analysts. The goal of such obfuscation is typically to execute payloads without raising alarms, making it easier to maintain persistence or execute additional attacks undetected. This specific technique may be employed by sophisticated threat actors aiming to bypass security defenses and execute malicious scripts in a stealthy manner.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1070) and **Execution** (T1059.001), indicating an effort to obfuscate execution as a means to avoid detection. Primary data sources for this detection include Windows PowerShell script block logging, which must be explicitly enabled to capture the necessary events. This logging provides visibility into potentially malicious commands and allows responders to analyze their context and execution flow.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Examine logs from PowerShell script block logging to identify instances of obfuscated commands being executed. Focus on anomalies in the `ScriptBlockText` which match the detection criteria.

  - **Analyze Parent Process Information:** Investigate the parent processes associated with the identified obfuscated PowerShell instances. Determine whether they originated from legitimate applications or appear to be spawned by other suspicious processes.

  - **Inspect Execution Context:** Check the execution context of the PowerShell command. Noting whether it’s running under a user account with elevated privileges can help assess the potential impact of the activity.

  - **Correlate with Threat Intelligence:** Look for known indicators of compromise (IOCs) associated with PowerShell obfuscation techniques in the context of your organization. Determine if there are any links to current threat actor activity that may leverage such obfuscation.

  ### Prioritization
  Given the high potential for obfuscated PowerShell scripts to facilitate malicious actions, this alert is considered high severity. Detecting such activity in an enterprise environment indicates a significant risk of compromise, especially if the obfuscation is tied to known attack patterns.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on PowerShell script block logging, which may not be enabled in all environments. This rule assumes that PowerShell activity can be properly logged and analyzed; thus, environments lacking these logging configurations cannot generate the necessary events for detection. Additionally, the detection logic may generate false positives from benign scripts that utilize similar obfuscation techniques but are not malicious in intent. Regular review of trigger conditions and updates to the detection logic may help in reducing these potential false positives.

