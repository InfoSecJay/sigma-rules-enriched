note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell scripts that utilize standard input (`stdin`) to execute potentially malicious commands. The likely attacker objective is to execute code while evading detection mechanisms that are traditionally used to identify malicious PowerShell scripts. This behavior aligns with MITRE ATT&CK Technique T1027 (Obfuscated Files or Information) and T1059.001 (Command and Scripting Interpreter: Windows PowerShell).

  The primary telemetry source required for this detection is Windows PowerShell Script Block Logging, which generates logs capturing details about the executed scripts. If malicious, this activity could lead to unauthorized command execution, data exfiltration, or privilege escalation. Importantly, while this detection indicates the presence of suspiciously obfuscated commands, it does not confirm that a compromise has occurred on its own.

  ### Investigation Steps

  - **Review PowerShell Script Logs**: Check PowerShell log entries for Event ID 4104. Pay attention to any scripts containing obfuscation patterns, specifically those leveraging `stdin` with environment variables or related commands.

  - **Analyze Command Execution Context**: Validate the user context under which the PowerShell script was run. Look for the `UserName`, `ProcessId`, and `ExecutionPolicy` fields in the logs to determine if the behavior aligns with typical administrative or benign user actions.

  - **Identify Malicious Indicators**: Look for commands that manipulate environment variables or utilize the `Invoke-*` cmdlets alongside obfuscation techniques. Indicators such as the presence of `&&` and suspiciously encoded strings are likely to signify malicious intent.

  - **Correlation with Other Security Logs**: Examine logs from endpoint detection solutions, such as EDRs, for complementary alerts that might indicate a larger attack pattern. Cross-reference the timestamps of the detected obfuscation with lateral movement or privilege escalation events.

  - **Baseline Legitimate Activity**: Identify benign PowerShell scripts run within the environment that might use obfuscation for legitimate purposes, such as system automation or configuration management. Compare these with detected logs to understand the scope of normal usage.

  - **Monitor for File Creation or Exfiltration**: Check for any file creation or modification events (Event IDs 4663 or 5145) that coincide with the execution of the obfuscated script, indicating potential data exfiltration or unauthorized file tampering.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems if malicious PowerShell commands are executed. The likelihood of abuse is significant, as obfuscated PowerShell is a common technique among adversaries for executing payloads and manipulating systems. This behavior is frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of Script Block Logging and the potential for adversaries to employ alternate encoding or command execution techniques to evade detection. Ensure that logging is properly configured across all relevant systems to capture this activity reliably. Legitimate administrative tasks or A/V software may generate similar logs, which could trigger this alert. Another relevant detection to consider is monitoring for unusual PowerShell module imports or execution methods which can enhance coverage against various obfuscation techniques.

