note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell scripts that utilize standard input (Stdin) to execute commands through a chained `set` statement. The likely objective of the attacker is to execute code stealthily, bypass traditional security controls by evading detection, and maintain persistence within the environment. This behavior aligns with the MITRE ATT&CK techniques Execution (T1059.001) and Defense Evasion (T1027). The primary telemetry source required for this detection is PowerShell script block logging, specifically Event ID 4104, which captures the execution of PowerShell commands and scripts. If malicious, successful exploitation could lead to a range of attacks, including data exfiltration or lateral movement. However, this detection alone does not confirm that the activity is purely malicious; legitimate administrative tasks may also generate similar script executions.

  ### Investigation Steps

  - **Review PowerShell script block logs:** Check for Event ID 4104 entries. Look for script block text that matches the obfuscation pattern "set && set" related to the execution of commands. Evaluate the user context and any associated processes.

  - **Validate legitimacy of invoking command:** Identify if the executed commands align with known administrative tasks or user behavior. Typical benign usage may involve `set` commands related to environment variable management without additional obfuscation.

  - **Analyze User and Asset Behavior:** Determine if the user account executing the script has administrative privileges or if it's a service account. Assess the asset's criticality—if it affects a domain controller, prioritize this alert higher.

  - **Cross-reference source logs:** Investigate related security logs such as Windows Event Logs for anomalous event patterns or unusual network connections made by the initiating process. Correlate with Event ID 4688 for process creation and potential parent processes.

  - **Check for other obfuscation patterns:** Look for multiple instances of obfuscation in the script block logs, as attackers may use varied methods to maintain stealth. Document characteristics like frequent chaining and alternative command structures.

  - **Identify high-confidence malicious indicators:** Look for recognized malware signatures or executions that invoke `Invoke-Expression` or similar commands in the context of obfuscated input handling. These are strong indicators of an active compromise.

  ### Prioritization

  This alert should be considered high priority due to the potential impact of executing obfuscated PowerShell commands on critical systems and the high likelihood of this technique being weaponized in targeted attacks. The capability to execute undetected commands poses significant risks to enterprise integrity and security.

  ### Blind Spots and Assumptions

  Detection might miss cases where effective obfuscation bypasses script block logging if not all required logs are enabled. It assumes that script block logging is appropriately configured on monitored systems. Additionally, legitimate administrative uses of PowerShell can trigger this alert, particularly for IT operations. A related detection to consider is monitoring for direct use of `Invoke-Expression` (T1059.001), which complements the coverage of potentially harmful obfuscation techniques.

