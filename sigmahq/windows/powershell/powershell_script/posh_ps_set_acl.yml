note: |
  ### Technical Context

  This rule detects the use of PowerShell commands to change access control lists (ACLs) on files or folders via the `Set-Acl` cmdlet. The likely attacker objective is to alter permissions on sensitive files to prevent detection or to facilitate unauthorized access. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (ID: T1222), specifically targeting permissions to obscure malicious activities.

  The primary telemetry sources are Windows PowerShell logs, specifically those capturing script block execution. The security impact of malicious activity is significant; successful ACL modification can lead to unauthorized data access or manipulation, severely impacting data integrity and confidentiality. It is important to note that this detection alone does not confirm that the command was executed with malicious intent, as legitimate administrative tasks may also invoke `Set-Acl`.

  ### Investigation Steps

  - **Review PowerShell logs for Set-Acl usage**: Check Event ID 4104 in Windows PowerShell logs for any instances of `Set-Acl`, specifically searching for parameters `-AclObject` and `-Path` to determine what ACL changes were made.

  - **Analyze affected files or folders**: Identify the specific files or folders whose ACLs were modified. Investigate their usual permissions to assess any unauthorized access changes.

  - **Correlate with user activity**: Examine the user context under which the command was executed, focusing on log entries around the same time (Event ID 4624 for logon events) to determine if the user has legitimate permissions.

  - **Verify legitimate administrative changes**: Look for documented approval or expected change requests related to the modification of the file permissions as part of operational processes, distinguishing between typical admin behavior and potential malicious activity.

  - **Detect high-confidence indicators of compromise**: Search for additional suspicious commands or behaviors executed by the same user in the corresponding timeframe, focusing on commands often associated with privilege escalation or unauthorized access.

  ### Prioritization

  This alert has a low severity rating primarily because not all `Set-Acl` usage indicates malicious intent, and it may reflect legitimate administrative activity. However, given the critical nature of ACL modifications, any detection should still be investigated promptly, especially if the impacted systems hold sensitive or critical data.

  ### Blind Spots and Assumptions

  One limitation of this detection is that it may yield false positives from legitimate administrative tasks, primarily when system administrators adjust permissions for compliance or operational needs. Additionally, if PowerShell logging is not adequately configured, potential activities may go unrecorded. It is crucial to monitor for related actions, such as abnormal account behavior or subsequent access to modified resources, for comprehensive detection coverage.

