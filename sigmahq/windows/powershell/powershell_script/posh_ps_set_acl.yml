note: |
  ### Technical Context
  This rule detects the use of PowerShell scripts that modify the Access Control List (ACL) of files or folders using the `Set-Acl` cmdlet. Attackers often leverage this functionality to alter permissions on sensitive files, potentially allowing unauthorized access or modification. This behavior is typically associated with attempts to evade detection by modifying security controls, thereby facilitating lateral movement or privilege escalation within a compromised environment.

  The relevant MITRE ATT&CK tactic involved is **Defense Evasion**, particularly the technique **T1222: Application Layer Protocol**. Attackers may also be attempting to manipulate permissions to establish persistence or control over sensitive documents and directories, thereby achieving their objectives without raising alarms. Key telemetry for detecting these behaviors includes logs from PowerShell activity, specifically those capturing script execution details and related modifications.

  Primary data sources for this detection rule would include Windows PowerShell operational logs, which record script executions, as well as file system access logs and Windows security event logs capturing file permission changes.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script logs for entries containing `Set-Acl`, `-AclObject`, and `-Path` to identify potential unauthorized changes to file permissions. Look for unusual patterns or scripts executed by unfamiliar users.

  - **Check File System AUDIT Logs**: Verify changes in Access Control Entries (ACEs) on critical files or folders using Windows Security Event logs (Event ID 4670) to correlate any detected PowerShell activity.

  - **Analyze Process Creation Events**: Inspect recent process creation logs to identify any suspicious PowerShell sessions that coincide with the detected `Set-Acl` activity. Look for anomalous parent-child relationships that may indicate malicious activity.

  - **Investigate User Account Activity**: Check the user accounts running the detected scripts for any signs of compromise or unusual behavior, particularly focusing on privileged accounts that should not be altering permissions.

  ### Prioritization
  This alert has a low severity level as it may be generated from benign administrative activity; however, it should not be ignored in an enterprise environment. Unauthorized changes to file permissions can indicate potentially malicious intent, particularly if identified in conjunction with other suspicious behavior.

  ### Blind Spots and Assumptions
  This detection rule may miss PowerShell activity if logging mechanisms are insufficient or improperly configured. The rule assumes that PowerShell logging is enabled and operational, as well as that sufficient permissions are in place to audit file access and modification events. Environments without comprehensive logging policies or those that do not monitor PowerShell activity may result in significant blind spots in detecting malicious behavior related to permission changes.

