note: |
  ### Technical Context

  This Sigma rule detects when a PowerShell script uses the `Set-Acl` cmdlet to change the access control list (ACL) of a file or folder. This behavior is often leveraged by attackers to manipulate permissions, enabling unauthorized access or persistence within a system. The related MITRE ATT&CK techniques are Defense Evasion (T1222) and Privilege Escalation (T1068). The primary telemetry sources are PowerShell script execution logs or specific Security Event IDs related to PowerShell activity. If malicious, this behavior can lead to unauthorized data access or modification, significantly impacting system integrity and confidentiality. It’s important to note that this detection alone does not confirm that malicious intent exists; further context is required.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Event ID 4104 in Windows PowerShell log files to identify the specific command execution. Look for instances of `Set-Acl` with `-Path` and `-AclObject` parameters to find potentially malicious activity.

  - **Verify file permissions after the action:** Cross-reference the file or folder path indicated in the script with the actual permissions using Get-Acl in PowerShell. Compare with baseline permissions to identify unsanctioned changes.

  - **Assess host role and criticality:** Identify if the host running the PowerShell script is a server with elevated privileges (e.g., Domain Controller, file server). Increased risk due to the potential for lateral movement if exploited.

  - **Identify legitimate uses of Set-Acl:** Confirm if the script tag is part of established IT operations, such as administrative scripts for managing file permissions as part of routine maintenance. Check against documented operational processes.

  - **Check for indicators of compromise:** Look for the presence of known malicious PowerShell scripts or cmdlets that may attempt to modify ACLs in unauthorized ways, such as RATs or exploitation frameworks.

  ### Prioritization

  This alert should be considered of low to medium severity depending on the context of the affected system. While changing ACLs can be a common administrative task, its use in a suspicious context may indicate malicious activity, especially if performed unexpectedly on critical infrastructure.

  ### Blind Spots and Assumptions

  Detection may fail if logs are not properly configured to capture PowerShell events. Additionally, legitimate system administration tasks may generate similar alerts, potentially leading to false positives. A related detection to enhance coverage is monitoring for suspicious command-line processes that include `Set-Acl`, combined with Process Creation events (Event ID 4688) to correlate process execution and context.

