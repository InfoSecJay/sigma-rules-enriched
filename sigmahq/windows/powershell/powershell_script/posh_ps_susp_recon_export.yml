logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - 'Get-Service '
    - 'Get-ChildItem '
    - 'Get-Process '
  selection_redirect:
    ScriptBlockText|contains: '> $env:TEMP\'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands aimed at collecting information about services, files, and processes on a Windows system. The behavior often correlates with reconnaissance activities where an adversary gathers data post-compromise to understand the environment. This activity falls under the MITRE ATT&CK tactic "Collection" (T1119). Primary telemetry sources required for this detection include Windows PowerShell script logs, specifically those logging script block execution, contingent on the proper configuration of Script Block Logging.

  If malicious, the impact may include adversaries preparing for lateral movement, data exfiltration, or other malicious actions by dissecting organizational resources. It should be noted that finding these commands does NOT confirm an active compromise without further contextual evidence, as they may also appear in legitimate administrative tasks.

  ### Investigation Steps

  - **Check PowerShell scripts run on the device:** Review Windows Event ID 4104 for PowerShell script block logging events containing 'Get-Service', 'Get-ChildItem', or 'Get-Process'. Compare timestamps and contexts—legitimate administrative scripts will have expected user IDs (e.g., SYSTEM or authorized admins) and normal frequencies.

  - **Inspect redirections to temporary files:** Look for occurrences of '>$env:TEMP\' in script block logs (Event ID 4104). A legitimate script may redirect to a unique temp file name, while suspicious activity could show a pattern of automated file creations.

  - **Validate historical context of command execution:** Cross-reference Event ID 4104 logs with user activity logs (e.g., login/logout times, user role changes). Investigate if a low-privilege account executed the commands unexpectedly, indicating potential malicious intent.

  - **Examine process creation related to the activity:** Utilize Sysmon Event ID 1 to track process creation linked with the aforementioned commands. Identify if any commands are run by processes with unusual parent-child relationships that deviate from normal operations.

  - **Identify unusual network activity post-event:** Correlate PowerShell execution with network logs (Firewalls or Intrusion Detection Systems) to detect any unauthorized outbound connections shortly after the script execution. A lack of legitimate traffic may indicate data exfiltration efforts.

  ### Prioritization

  This alert should be considered medium severity as it indicates potential reconnaissance activity that could lead to further compromise. The likelihood of malicious abuse is notable, especially in environments where attackers may blend in using PowerShell for legitimate tasks. Such enumeration techniques are commonly weaponized in post-exploitation phases.

  ### Blind Spots and Assumptions

  Detection may be limited by the proper configuration of Script Block Logging and whether logs have been retained in a timely manner. There may also be instances of benign administrative scripts triggering this alert, especially if they utilize the same PowerShell commands. Related detections to strengthen coverage could include alerts for unusual remote access software or direct API calls by applications leveraging PowerShell for data collection.

