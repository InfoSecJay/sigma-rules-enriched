logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - 'Get-Service '
    - 'Get-ChildItem '
    - 'Get-Process '
  selection_redirect:
    ScriptBlockText|contains: '> $env:TEMP\'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially suspicious PowerShell commands used for collecting internal system information, specifically commands like `Get-Service`, `Get-ChildItem`, and `Get-Process`. The likely objective of an adversary utilizing these commands is to gather data about the operating environment, which could assist in further actions such as lateral movement or data exfiltration. This behavior fits within the MITRE ATT&CK framework under the tactic of Collection (TA0023) and the technique of Data from Information Repositories (T1119).

  The primary telemetry sources for this detection rely on PowerShell logs, specifically Script Block Logging, which must be enabled to capture the relevant events. If malicious, this behavior can lead to unauthorized data gathering and potential exploitation of sensitive information within the environment. It is important to note that this detection does NOT confirm malicious intent on its own as legitimate administrative tasks may invoke similar commands.

  ---

  ### Investigation Steps

  - **Review PowerShell Logs:** Check Security Event ID 4104 for the presence of the flagged PowerShell commands in the `ScriptBlockText` field. Look for contextual usage such as who executed the commands and from which machine.

  - **Identify User Context:** Determine the user executing the script. Legitimate administrative users may invoke these commands for system maintenance; verify if the user context aligns with known administrator activities.

  - **Inspect Temporary Files:** Confirm creation of files in the TEMP directory as indicated by `'> $env:TEMP\'`. Investigate any unusual file types or names created around the time of the alert, which could indicate malicious usage.

  - **Cross-Reference with Other Alerts:** Assess if there are concurrent alerts related to lateral movement or data exfiltration, such as unusual outbound traffic or Windows Event ID 4688 showing process creation tied to the user involved.

  - **Collect Asset Information:** Review additional logs like Sysmon Event ID 3 (Process Creation) on the affected asset to analyze command line arguments for more context around the executed PowerShell commands.

  ---

  ### Prioritization

  This alert should be treated with medium severity. Although the commands detected are commonly used by both administrators and adversaries, their execution in sensitive environments can indicate potential reconnaissance activities. Given that this behavior can precede malicious actions, prompt investigation is critical to mitigate possible threats.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, as this is a prerequisite for capturing relevant PowerShell activity. Legitimate activities include system checks by administrators or automated scripts run for maintenance tasks that could trigger the alert. A related detection that enhances operational visibility includes monitoring for unauthorized access to administrative shares or file exports to external services, which could signal further malicious action.

