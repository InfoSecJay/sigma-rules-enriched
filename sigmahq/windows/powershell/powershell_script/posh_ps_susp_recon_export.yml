logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - 'Get-Service '
    - 'Get-ChildItem '
    - 'Get-Process '
  selection_redirect:
    ScriptBlockText|contains: '> $env:TEMP\'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_recon_export/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands often leveraged by adversaries for data collection and reconnaissance within a network. The identified commands, such as `Get-Service`, `Get-ChildItem`, and `Get-Process`, suggest an attacker is gathering system information, which may indicate an attempt to prepare for later stages of a malicious campaign. This behavior aligns with the MITRE ATT&CK tactic **Collection** and the technique **T1119: Automated Collection**.

  The primary telemetry source for this detection is PowerShell script block logging, which must be enabled for effective monitoring. If the behavior is malicious, it indicates that the attacker is likely preparing to exfiltrate sensitive information or establish further persistence. However, this detection does NOT confirm that the actions are malicious on their own, as similar scripting might be performed for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify PowerShell logs:** Check PowerShell logs (Event ID 4104) for Script Block events containing the keywords `Get-Service`, `Get-ChildItem`, or `Get-Process`. Ensure to review the full command context to assess intent.

  - **Identify output redirection:** Look for lines in the PowerShell logs that redirect output to `$env:TEMP\`. This often signifies an attempt to stage data for further processing or potential exfiltration.

  - **Assess normal operations:** Review baseline PowerShell usage patterns for the affected host or user account. Legitimate administrative scripts may also utilize these commands; ensure they align with known operational usage.

  - **Check processes running:** Cross-reference the listed processes from `Get-Process` with active processes on the system. Analyze if these processes are tied to unexpected software or anomalies indicative of lateral movement or installation of backdoors.

  - **Review file activity:** Investigate the `$env:TEMP\` directory for unexpected files created around the same time as the detected PowerShell activity. The absence of known legitimate files could indicate malicious preparation.

  - **Host criticality assessment:** Determine the criticality of the affected host. If it hosts sensitive data or critical applications, prioritize this investigation accordingly, as it increases the potential security impact.

  ### Prioritization

  The alert is of medium severity, as it may indicate reconnaissance activity by an adversary. If confirmed malicious, the impact could affect critical systems, especially if the host is part of a sensitive infrastructure. While not all uses of these commands are malicious, they are frequently employed in automated data gathering scenarios by threat actors.

  ### Blind Spots and Assumptions

  The detection may miss script executions if script block logging is not enabled. Furthermore, benign PowerShell usage from legitimate administrative tasks can trigger the alert, potentially leading to false positives. Consider companion detections such as command-line activity monitoring (Event ID 4688) to augment coverage against abnormal process creation or execution patterns commonly tied to malicious behavior.

