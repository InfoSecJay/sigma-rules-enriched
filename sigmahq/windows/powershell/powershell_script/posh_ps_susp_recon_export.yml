title: Recon Information for Export with PowerShell
id: a9723fcc-881c-424c-8709-fd61442ab3c3
status: test
description: Once established within a system or network, an adversary may use automated
  techniques for collecting internal data
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
author: frack113
date: 2021-07-30
modified: 2022-12-25
tags:
- attack.collection
- attack.t1119
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - 'Get-Service '
    - 'Get-ChildItem '
    - 'Get-Process '
  selection_redirect:
    ScriptBlockText|contains: '> $env:TEMP\'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule targets the use of PowerShell scripts that may be leveraged by adversaries to gather internal reconnaissance data within a network. Attackers, having gained unauthorized access, often employ automated tools to extract information about services, processes, and file structures. By utilizing commands like `Get-Service`, `Get-ChildItem`, and `Get-Process`, a malicious actor could systematically collect intelligence that aids in further exploitation or lateral movement.

  The relevant MITRE ATT&CK tactics here include "Collection" (TA0009) and specifically the technique "Data from Local System" (T1119). The techniques highlight the behavior of gathering sensitive information from the local host environment. The primary data sources for detecting these activities include PowerShell script block logging, which captures the text of executed PowerShell scripts, and potentially EDR solutions that alert on the execution of specific commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for occurrences of scripts that include `Get-Service`, `Get-ChildItem`, or `Get-Process`, especially those that redirect output to `$env:TEMP\`.
  - **Correlate with User Activity:** Investigate the user context under which the PowerShell commands executed. Look for anomalous user behavior or accounts that should not have executed reconnaissance commands.
  - **Analyze Process Creation Events:** Check for newly spawned processes that correlate with the PowerShell command executions to identify other potentially malicious activities occurring concurrently.
  - **Inspect File System Activity:** Assess changes in the file system, particularly in the %TEMP% directory, for unauthorized or suspicious output files that may contain sensitive information.

  ### Prioritization
  This alert has medium severity due to the potential for an attacker to gather internal information that can lead to further compromises. The likelihood of such activity indicates a hostile presence within the environment, warranting immediate investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that Script Block Logging is enabled and that the logs are being captured correctly in the security event logs. One gap in detection coverage is the potential for script obfuscation or alternative methods to invoke similar commands without triggering this heuristic. Analysts should ensure that logging levels are adequate and review broader command execution patterns for comprehensive insight.

