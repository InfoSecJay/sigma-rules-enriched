note: |
  ### Technical Context

  This Sigma rule detects the usage of the PowerShell `Set-Service` cmdlet to modify the Security Descriptor of a Windows service, specifically to hide the service from standard service enumeration tools like `sc.exe` and `Get-Service`. The objective of this behavior is often tied to persistence and evasion, as attackers may seek to conceal malicious services after establishing initial access. This activity relates to the MITRE ATT&CK technique T1574.011 (Hide Services).

  The primary telemetry source involves PowerShell script block logging, which must be enabled to capture necessary details from the executed scripts. The security impact of this behavior can be severe, as it may indicate an attempt by an attacker to persist presence while avoiding detection by security tools. Detection of this command alone does not confirm malicious intent, as it may also occur in rare legitimate scenarios, such as administrative tasks involving hidden services.

  ### Investigation Steps

  - **Review PowerShell Logs for Suspicious Commands:** Check for PowerShell Script Block logs (Event ID 4104) containing `Set-Service` along with `-SecurityDescriptorSddl` or `-sd`. Focus on the context of execution—uncommon source users or scripts warrant deeper investigation.

  - **Identify the Target Service:** Determine which service is being modified by capturing the parameters passed to `Set-Service`. Look for unusual service names or services that are not regularly associated with standard system operations.

  - **Assess Service Enumeration Indicators:** Validate whether the affected service is indeed hidden from tools like `Get-Service` or `sc.exe`. This can confirm if the modification was successful. A legitimate background service would not need modifications that hide its presence.

  - **Look for Other Malicious Indicators:** Identify any co-occurring PowerShell commands or actions that suggest a malicious context, such as service creation (Event ID 4697) or unusual file modifications in directories related to the affected service.

  - **Correlate User Activity:** Review logs for the identity of the user who executed the PowerShell command. Check for anomalous login times or behaviors, particularly if the user is not typically involved with service management or PowerShell scripting.

  - **Identify Impacted Assets:** Determine the role and criticality of the affected system. A hidden service on a domain controller or a mission-critical server carries higher risk compared to less important endpoints.

  ### Prioritization

  This alert should be treated as high priority due to its potential impact on systems where critical services may be hidden by malicious actors. The likelihood of abuse is significant, especially since hiding services is a common evasion technique among advanced persistent threats. Such behavior is not typical for legitimate user actions, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled, allowing evasion through disabled logging or misleading benign scripts that utilize similar cmdlets. Legitimate activities may occasionally trigger this alert, such as system administrators configuring services for specific purposes. A related detection to consider includes monitoring for service creation or deletion events (Event ID 4697) to identify potential chaining of malicious activities.

