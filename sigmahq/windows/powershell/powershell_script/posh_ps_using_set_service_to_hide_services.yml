logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - 'DCLCWPDTSD'
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  condition: selection
falsepositives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
level: high
note: |
  ### Technical Context

  This rule detects the use of the PowerShell cmdlet `Set-Service` to alter a service’s `SecurityDescriptor`, enabling it to be hidden from standard service management utilities like `sc.exe` and `Get-Service`. This tactic is often utilized by attackers to create stealthy persistence mechanisms on compromised systems. The MITRE ATT&CK framework tactic involved here is **Persistence** (TA0003), particularly the technique **Hide Services** (T1574.011).

  The primary telemetry sources are Windows PowerShell script logs, specifically Script Block logging, which needs to be enabled to capture detailed command execution. If malicious intent is behind this activity, it could lead to an undetected foothold on the target system, possibly facilitating further exploitation or lateral movement. However, this detection alone does not confirm that the service manipulation is malicious, as there may be legitimate use cases for hiding services.

  ### Investigation Steps

  - **Verify the command execution context:** Review PowerShell logs for Event ID 4104 showing execution of the `Set-Service` command. Check for unusual user accounts, timings, or associated processes that are not part of regular admin activity.

  - **Identify the specifics of the SecurityDescriptor modification:** Analyze the parameters used in the `Set-Service` command, particularly the `-SecurityDescriptorSddl` flag within the captured ScriptBlockText to determine if a standard SDDL was altered in an unusual manner.

  - **Check for legitimate service visibility:** Confirm if the services being hidden are typically visible through other management tools (e.g., `Get-Service`). If they are standard services (like Windows Update or Security Center), this activity may be suspicious.

  - **Correlate with other system logs:** Cross-reference with Event ID 7045 (Service Created) to see if any new services were created around the same time as the `Set-Service` command execution, which could indicate an active attempt to hide a malicious service.

  - **Investigate related alerts:** Leverage the companion detection rule that identifies `New Service Creation` (ID: 514e4c3a-c77d-4cde-a00f-046425e2301e) to reduce false positives and enhance the investigation’s context by looking for service creation in conjunction with modifications to existing ones.

  - **Monitor for known malicious patterns:** Check against threat intelligence feeds for any indicators associated with service hiding by known malware families or threat actors, focusing on common SDDL patterns that would indicate evasion techniques.

  ### Prioritization

  This alert is of **high severity** within an enterprise context due to the potential impact on system visibility and control. Given that stealth tactics like hiding services are frequently seen in advanced adversarial behavior, the likelihood of malicious abuse is significant, especially in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block logging to be enabled; without it, this behavior may not be visible. Legitimate activities may involve rare use cases for hiding services, leading to potential false positives. It's critical to also consider other stealth tactics that might not rely on `Set-Service`, such as DLL side-loading or other privilege escalation techniques, as companion detections to strengthen overall coverage.

