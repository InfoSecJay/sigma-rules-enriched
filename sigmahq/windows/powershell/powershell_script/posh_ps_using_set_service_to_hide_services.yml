status: test
description: Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities such
  as "sc.exe", "Get-Service"...etc. (Works only in powershell 7)
references:
- https://twitter.com/Alh4zr3d/status/1580925761996828672
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - 'DCLCWPDTSD'
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  condition: selection
falsepositives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
level: high
note: |
  ### Technical Context
  This detection rule identifies the misuse of the `Set-Service` cmdlet in PowerShell to manipulate the security descriptor of a Windows service, allowing it to be hidden from traditional service enumeration tools like `sc.exe` or `Get-Service`. Attackers may employ this technique to conceal malicious services or persistence mechanisms, thereby evading detection by security personnel. The ability to hide services can facilitate a range of malicious objectives, including maintaining access to a compromised system or escalating privileges within a network.

  This behavior is associated with the MITRE ATT&CK framework, specifically under the tactics of **Persistence** (T1547), **Defense Evasion** (T1561), and **Privilege Escalation** (T1068). The relevant technique is **Service Registry Permissions Weakness** (T1574.011), which describes methods used to undermine the detection of malicious services through manipulation of service configuration settings.

  Key data sources that could provide insight into this behavior include PowerShell script block logs, which capture script execution details including cmdlets used and arguments provided. Having Script Block Logging enabled is essential for detecting this specific abuse.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze script block logging to identify instances of the `Set-Service` cmdlet, especially those containing the `-SecurityDescriptorSddl` or `-sd` parameters. Look for unusual service names or security descriptors that suggest manipulation.

  - **Examine Service Configuration**: Use command-line tools or APIs to query the service configuration (`sc query` or `Get-Service`) on the affected system to detect hidden services that are no longer visible through standard enumeration methods.

  - **Investigate Related Activity**: Check for additional PowerShell commands executed before and after the suspicious activity that may indicate further attempts to establish persistence or evade detection, such as monitoring for other cmdlets related to service management.

  - **Assess System Integrity**: Conduct a broader examination of the system for other signs of compromise or modifications to service configurations that may indicate an underlying threat actor's presence or ongoing malicious activities.

  ### Prioritization
  The alert is categorized as high severity due to the potential serious impact of an attacker gaining the ability to hide services on a system, which significantly hampers visibility and response efforts by security teams. The likelihood of exploitation increases in environments where administrative privileges are poorly managed.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage could arise from environments where Script Block Logging is not enabled, rendering the detection ineffective, or in situations where legitimate administrative actions occur that may lead to false positives. Furthermore, the assumption exists that the only method of hiding a service involves this specific PowerShell cmdlet, potentially overlooking other techniques or tools that could be used to achieve similar ends. It is crucial to ensure that logs are collected from all Windows systems and that Script Block Logging is configured correctly to facilitate these detections.

