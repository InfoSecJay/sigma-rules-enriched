logsource:
  product: windows
  category: ps_script
  definition: Script Block Logging must be enable
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Add-AppPackage '
    - 'Add-AppxPackage '
  selection_flag:
    ScriptBlockText|contains: ' -AllowUnsigned'
  condition: all of selection_*
falsepositives:
- Installation of unsigned packages for testing purposes
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the PowerShell cmdlet `Add-AppxPackage` or its alias `Add-AppPackage`, specifically when attempting to install unsigned AppX packages with the `-AllowUnsigned` flag. This behavior is often indicative of an adversary's attempt to deploy unauthorized applications, potentially facilitating persistence or executing malicious payloads. The relevant MITRE ATT&CK techniques are T1203 (Exploitation for Client Execution) and T1059.001 (PowerShell).

  The primary telemetry sources include PowerShell script block logging, which must be enabled to capture the command executions. The security impact could be significant, as installing unsigned packages can lead to the execution of malicious applications that compromise the system or data. It's important to note that while this detection identifies the attempt to install an unsigned package, it does NOT confirm whether the package itself is malicious or whether a legitimate administrative action is taking place.

  ### Investigation Steps

  - **Verify the cmdlet execution:** Check for PowerShell Event ID 4104 to find script block logs that include `Add-AppxPackage` or `Add-AppPackage` with `-AllowUnsigned`. Scrutinize the surrounding context for other executed commands.

  - **Identify the user context:** Review Event ID 4624 (Logon) to determine who executed the cmdlet and under what session. Look for unusual accounts, especially those without administrative rights running this command.

  - **Inspect for targets of installation:** Examine the PowerShell command outputs or logs that might provide details on the specific AppX package being installed. Malicious indicators may include unknown or suspicious package names or paths.

  - **Review recent activities:** Check system logs (Event ID 1555 / 1602) to identify any recent installations or modifications of AppX packages. Legitimate activities often include installations from trusted sources or for known company applications.

  - **Look for execution context:** Assess the device type and role (e.g., Domain Controller vs. User Workstation). Higher criticality assets running unsigned installations warrant more scrutiny due to the potential impact.

  - **Correlate with related detections:** Investigate if additional alerts regarding application installations or script executions triggered within a short timeframe, indicating malicious workflows might be present.

  ### Prioritization

  The alert is considered medium severity due to the implications of unauthorized software installation, which could lead to system compromise or data breaches. The likelihood of malicious behavior is elevated, as unsigned AppX installations are often weaponized by adversaries to introduce backdoors or persistence mechanisms.

  ### Blind Spots and Assumptions

  Detection relies on the availability and proper configuration of PowerShell script block logging; if not enabled, attempts may go unnoticed. Legitimate activities, such as software testing or internal development, could trigger this alert. A related detection to strengthen coverage could involve monitoring for the execution of other PowerShell commands associated with installation or modification of software, enhancing the context around possible unsanctioned changes.

