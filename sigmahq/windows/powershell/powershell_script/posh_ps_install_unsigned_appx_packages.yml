detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Add-AppPackage '
    - 'Add-AppxPackage '
  selection_flag:
    ScriptBlockText|contains: ' -AllowUnsigned'
  condition: all of selection_*
falsepositives:
- Installation of unsigned packages for testing purposes
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to install unsigned AppX packages via PowerShell commands, specifically using the `Add-AppPackage` or `Add-AppxPackage` cmdlets with the `-AllowUnsigned` flag. The likely objective of an attacker employing this method is to introduce potentially malicious applications or backdoors into the environment, thereby achieving persistence or asset exploitation. This behavior correlates with MITRE ATT&CK tactic T1547.001 (Boot or Logon Autostart Execution: Application Layer) and T1059.001 (Command and Scripting Interpreter: Windows Command Shell).

  The primary telemetry source consists of PowerShell Script Block Logging, enabling the capture of specific commands executed in PowerShell. If malicious, this behavior could compromise system integrity and enable unauthorized access or control. Importantly, while this detection indicates an attempt to install unsigned packages, it does NOT confirm that the activity is malicious; legitimate testing or administrative tasks could trigger the alert.

  ### Investigation Steps

  - **Review PowerShell Script Logs:** Check Event ID 4104 for PowerShell Script Block logs corresponding to the alert time. Look for the exact command `Add-AppxPackage` or `Add-AppPackage` accompanied by the `-AllowUnsigned` flag.

  - **Verify Source of Installed Package:** Identify the source location of the unsigned AppX package being installed. Analyze any URLs or local paths in the command that can be linked to known safe installations versus suspicious or external sources.

  - **Assess Recent Software Changes:** Examine system or application logs (Windows Event ID 1033 for AppX installation) for relevant additions to the software stack. Note any unexpected software installations following the execution of the PowerShell command.

  - **Identify Legitimate Usage:** Confirm if organizational policy allows for the installation of unsigned AppX packages, particularly in a testing or controlled environment. Documentation of legitimate testing procedures should be cross-referenced.

  - **Correlate with User Activity:** Investigate the user account executing the command. Check for administrative privileges and evaluate if there's a historical context (e.g., previous installations) that aligns with regular business operations or system maintenance.

  - **Monitor System and Network Behavior:** Look for any inbound or outbound network connections made by the installed AppX package. Suspicious activity could indicate a compromised system or command and control (C2) communication.

  ### Prioritization

  The alert is of medium severity due to the potential risk associated with executing unsigned code, which could lead to system compromise. Given that this behavior can be exploited for backdoor installations, organizations should stay vigilant, especially in environments with strict software policies.

  ### Blind Spots and Assumptions

  Detection may be bypassed if Script Block Logging is not properly configured or enabled, limiting visibility into PowerShell execution. Additionally, legitimate scenarios such as development, testing, or administrative overrides could trigger this alert without malicious intent. A companion detection to consider is monitoring Application Installation events (Event ID 1033) for any correlation between unauthorized installations and Windows Event logs that capture external installation attempts.

