description: Detects usage of the "Add-AppxPackage" or it's alias "Add-AppPackage"
  to install unsigned AppX packages
references:
- https://learn.microsoft.com/en-us/windows/msix/package/unsigned-package
- https://twitter.com/WindowsDocs/status/1620078135080325122
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-31
tags:
- attack.persistence
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: Script Block Logging must be enable
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Add-AppPackage '
    - 'Add-AppxPackage '
  selection_flag:
    ScriptBlockText|contains: ' -AllowUnsigned'
  condition: all of selection_*
falsepositives:
- Installation of unsigned packages for testing purposes
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell commands that attempt to install unsigned AppX packages using the `Add-AppxPackage` or its alias `Add-AppPackage` cmdlets. These commands, particularly when paired with the `-AllowUnsigned` flag, can be indicative of unauthorized software installations that may bypass security controls. Attackers often seek to exploit such capabilities to deploy malicious applications that could facilitate further compromise, data exfiltration, or persistence within the environment.

  The monitoring of unsigned AppX package installations falls under the MITRE ATT&CK framework, specifically within the tactics of **Persistence** (TA0003) and **Defense Evasion** (TA0005). The techniques relevant to this rule include **Software Deployment Tools** (T1203) and potentially others related to script execution and application exploitation.

  The primary data source for this detection is PowerShell script block logging, which captures detailed information about commands executed in the PowerShell environment, including context and parameters used in invocations. This logging must be enabled to capture the required data effectively.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine the PowerShell script block logs for instances of the `Add-AppxPackage` or `Add-AppPackage` commands, particularly focusing on occurrences that include the `-AllowUnsigned` flag.
  - **Inspect Installed Applications**: Cross-reference the timestamps of detected commands with the installed applications on the Windows system to identify any unauthorized or unsigned AppX packages that were installed.
  - **Evaluate User Context**: Analyze the user account executing the installation command to determine if it aligns with typical administrative practices or if it appears anomalous with atypical privilege usage.
  - **Search for Related Artifacts**: Look for additional artifacts that may accompany the installation, such as logs in the Event Viewer under the Application, Security, and SysMon logs that could indicate further suspicious activities.

  ### Prioritization
  This alert has medium severity due to the potential risk associated with unauthorized software installations, which can lead to broader attacks or data breaches. The likelihood of impact is heightened in enterprise environments where unsigned applications can introduce vulnerabilities or backdoors.

  ### Blind Spots and Assumptions
  There may be gaps in detection if script block logging is not enabled on all relevant systems or if PowerShell execution policies allow bypassing these detections. The detection logic assumes that installations of unsigned packages are always illegitimate, which may not hold true for all environments, such as test or development scenarios where unsigned packages may be necessary for legitimate purposes. Proper configuration and enabling of script block logging are essential for this alert to function correctly.

