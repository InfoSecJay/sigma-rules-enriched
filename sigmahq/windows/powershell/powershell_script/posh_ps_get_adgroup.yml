note: |
  ### Technical Context

  This rule detects the execution of the "Get-AdGroup" PowerShell cmdlet, which is commonly used to enumerate groups within Active Directory (AD). The likely objective of an attacker using this technique is to gather information about user privileges and group memberships, potentially facilitating lateral movement or privilege escalation. This behavior corresponds to the MITRE ATT&CK technique: "Active Directory Group Enumeration" (T1069.002).

  The primary telemetry sources include Windows PowerShell logs, specifically for script block execution, which require Script Block Logging to be enabled. If this behavior is indeed malicious, it may indicate an attempted reconnaissance phase in the attack lifecycle. However, it’s important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may produce similar logs.

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check Windows Event ID 4104 from the PowerShell log to identify instances of the "Get-AdGroup" cmdlet. Look for unusual execution times or patterns not aligned with typical administrative workflows.

  - **Analyze the Script Block Source:** Verify the source of the script that triggered the event. Legitimate use should be from authorized system administrators. Focus on "User ID" fields to confirm if the executor is an expected admin.

  - **Check Group Memberships:** Validate the groups being enumerated against known business roles. Legitimate behavior usually involves enumeration by system administrators for permission assessments relative to their duties.

  - **Assess Machine and User Context:** Look at the user’s logon history (Security Event ID 4624) and recent activity. Anomalies such as a non-admin user executing this command on sensitive systems suggest possible malicious intent.

  - **Identify High-Confidence Indicators:** Look for patterns consistent with known attack techniques, such as enumeration followed by unusual account creation or modification actions (Event IDs like 4720 or 4722), suggesting privilege escalation.

  ### Prioritization

  The severity of this alert is low; however, it warrants attention because it could indicate preparatory reconnaissance by a malicious actor, especially if initiated from a non-admin account or during unusual hours. Despite being a common administrative action, its occurrence in sensitive contexts requires thorough validation.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled, without which this cmdlet invocation will not be captured. Legitimate activities may trigger the alert when administrators perform routine audits or management tasks. Companion detections, such as those for changes in group memberships or new user access (T1078.001), can provide a stronger context and signal for potential malicious behavior.

