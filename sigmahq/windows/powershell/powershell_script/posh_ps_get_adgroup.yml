logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-AdGroup '
    - '-Filter'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule is designed to identify the use of the PowerShell cmdlet `Get-AdGroup` for enumerating groups within Active Directory (AD). Attackers frequently target Active Directory to gather information about existing groups as part of their reconnaissance phase, enabling them to identify potential targets for further exploitation or privilege escalation. The ability to enumerate AD groups can assist in mapping out the organization's structure and the privileges associated with different user groups, which is essential for planning future attacks.

  The relevant MITRE ATT&CK techniques related to this detection include "Active Directory Enumeration" (T1018) and its sub-technique "Group Enumeration" (T1069.002). These techniques fall under the "Discovery" tactic, where an attacker seeks to understand the existing resources and permissions within the environment. Primary data sources for this detection include PowerShell script block logs, which capture executed commands and can reveal unauthorized or suspicious cmdlet usage.

  ### Investigation Steps
  - **Review PowerShell Scripts: **Analyze the Script Block Logging to identify any occurrences of `Get-AdGroup` along with the accompanying parameters. Check for unusual frequency or context in which this command is executed.
  - **Check User Context: **Determine the identity of the user account that executed the `Get-AdGroup` command. Investigate if the account belongs to a known administrator, a user with legitimate access, or if it is an anomalous account with suspicious activity.
  - **Audit Group Membership Changes: **Correlate any recent executions of `Get-AdGroup` with changes in group memberships. This might indicate preparation for lateral movement or privilege escalation.
  - **Investigate Anomalous Login Activity: **Look for failed and successful login attempts from the same user account or machine that executed the command, especially from unusual locations or at odd hours.

  ### Prioritization
  The alert is classified as low severity; however, it warrants attention due to the potential for an attacker to gather valuable information regarding group structures in Active Directory. If combined with other suspicious behaviors, it may indicate reconnaissance efforts that precede a more severe attack.

  ### Blind Spots and Assumptions
  This detection might not catch all instances of AD group enumeration, especially if attackers use alternative methods such as custom scripts or utilize obfuscation techniques to mask their activity. The detection logic assumes that Script Block Logging is enabled on Windows systems, which might not be the case in all environments. Without appropriate logging configurations, this detection will fail to trigger, potentially leaving a gap in monitoring for malicious activities targeting Active Directory.

