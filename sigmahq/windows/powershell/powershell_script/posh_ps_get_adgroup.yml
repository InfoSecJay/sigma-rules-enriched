  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Get-AdGroup`, which is commonly used to enumerate groups within Active Directory. The likely attacker objective is information gathering, specifically to identify user groups that may help them escalate privileges within the environment. This behavior falls under the MITRE ATT&CK tactic of Discovery (TA0007), specifically technique T1018: Remote System Discovery.

  Primary telemetry sources include PowerShell script block logging, which captures executed commands and their parameters. If malicious, the security impact is significant, as it may indicate that an attacker is profiling the environment to exploit user group permissions. However, this detection does NOT confirm malicious activity on its own; it simply indicates group enumeration attempts through PowerShell.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for anomalies:** Check Security Event ID 4104 for script block logs that include `Get-AdGroup` and `-Filter`. Look for unusual execution contexts, especially from non-administrative accounts or systems not typically involved in AD management.

  - **Identify user roles associated with the execution:** Examine the user account executing the command, referencing Event ID 4624 for logon events. Determine if the user is part of a group with expected permissions for AD management, such as Domain Admins or other administrative roles.

  - **Monitor for related cmdlet usage:** Look for other AD-related PowerShell cmdlets in conjunction with `Get-AdGroup`, such as `Get-AdUser`, noted in Event ID 4104. This could indicate further reconnaissance that strengthens the case for malicious intent.

  - **Correlate timing with other alerts:** Cross-reference the execution timestamp of the detected command with other security incidents or alerts within the SIEM. This could highlight coordinated malicious activity, demonstrating a pattern of unauthorized access or exploration.

  - **Document legitimate use cases:** Identify and document expected usage patterns for `Get-AdGroup` within your environment, including who typically runs it and for what purpose (e.g., regular AD maintenance tasks by administrators).

  - **Examine script execution context:** Assess the context in which `Get-AdGroup` was called. Check for unusual parent processes (e.g., was it called directly, or was a potentially malicious script acting as a wrapper?), looking for Sysmon Event ID 1 for process creation details.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to its potential for leading to further access and privilege escalation if exploited. The risk is elevated in environments where sensitive information is stored or where user group permissions can be easily misused. Though enumeration actions are common in both legitimate administrative tasks and adversarial maneuvers, context is crucial for determining intent.

  ---

  ### Blind Spots and Assumptions

  Limitations in detection include potential evasion techniques, such as using obfuscated PowerShell or encrypted command executions, which would bypass script block logging. Reliable detection requires that PowerShell script block logging is enabled and properly configured. Legitimate activities such as standard administrative tasks or troubleshooting scripts can trigger this alert. A companion detection rule for monitoring AD user enumeration via LDAP queries would strengthen overall coverage.

