title: AMSI Bypass Pattern Assembly GetType
id: e0d6c087-2d1c-47fd-8799-3904103c5a98
status: test
description: Detects code fragments found in small and obfuscated AMSI bypass PowerShell
  scripts
references:
- https://www.mdsec.co.uk/2018/06/exploring-powershell-amsi-and-logging-evasion/
- https://twitter.com/cyb3rops/status/1588574518057979905?s=20&t=A7hh93ONM7ni1Rj1jO5OaA
author: Florian Roth (Nextron Systems)
date: 2022-11-09
tags:
- attack.defense-evasion
- attack.t1562.001
- attack.execution
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '[Ref].Assembly.GetType'
    - 'SetValue($null,$true)'
    - 'NonPublic,Static'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of obfuscated PowerShell scripts that employ Anti-Malware Scan Interface (AMSI) bypass techniques. The rule specifically looks for fragments that include commands to manipulate assemblies and set values in non-public static contexts, which are indicative of attempts to evade security measures while executing malicious payloads. Attackers utilize these techniques to avoid detection by traditional antivirus solutions and to execute potentially harmful code in the environment.

  The threat scenario often involves attackers who aim to install malware, conduct reconnaissance, or establish persistence within a target system. The likely techniques used in these attacks include evasion tactics to obfuscate malicious activities as benign operations. Relevant MITRE ATT&CK tactics/techniques associated with this detection include Defense Evasion (T1562.001) and Execution tactics that focus on executing malicious payloads via obfuscated scripts.

  Primary data sources that will provide the best evidence for this detection include Script Block Logging data from Windows PowerShell (when enabled), which captures the details of PowerShell commands executed on the system, including potentially malicious obfuscation patterns.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell Script Block Logging events to identify the specific scripts and commands executed around the time of the alert. Look for instances of `Assembly.GetType`, `SetValue`, and any unusual or unexpected script behavior.

  - **Investigate Related Processes:** Check for any suspicious processes that executed PowerShell scripts, particularly those that do not typically use PowerShell in normal operations. Focus on parent-child process relationships that could indicate malicious activity.

  - **Assess Security Tool Alerts:** Collect alerts from security solutions, such as EDR or AV, to see if there are any related detections. Investigate any flagged activities for context regarding how the script was delivered or executed.

  - **Collect Environment Context:** Gather contextual logs such as user login sessions, system changes, and network connections to help identify the source and potential impact of the executed command. Look for any anomalies or deviations from standard user behavior.

  ### Prioritization
  This alert should be considered high severity due to its potential to indicate active attempts to bypass security controls in an enterprise environment, which could lead to unauthorized access, data exfiltration, or deployment of malicious software.

  ### Blind Spots and Assumptions
  There are potential blind spots in detecting sophisticated obfuscation methods used by attackers, as these techniques can evolve rapidly and may not be covered by standard logging. The detection logic assumes that Script Block Logging is enabled and functioning correctly, which may not always be the case in all environments. Additionally, the lack of context around the execution environment and user behavior may hinder accurate analysis of the detected scripts.

