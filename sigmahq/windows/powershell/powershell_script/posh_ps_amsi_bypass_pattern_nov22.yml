note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell scripts that attempt to bypass the Anti-Malware Scan Interface (AMSI) by leveraging specific assembly methods. These behaviors are often indicative of an attacker's objective to execute malicious code without detection by security products. The relevant MITRE ATT&CK tactics and techniques are: Defense Evasion (TA0005) and AMSI Bypass (T1562.001).

  Primary telemetry sources include PowerShell Script Block Logging, which must be enabled for effective detection. The security impact is significant; if exploited, it can lead to undetected execution of harmful code on the system. It's important to note that this detection does not confirm an active compromise; it only indicates potential attempts to evade defenses.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Look for Event ID 4103 in the Windows PowerShell logs and verify if the ScriptBlockText contains phrases like '[Ref].Assembly.GetType' or 'SetValue($null,$true)'. Malicious activity will involve these specific patterns.

  - **Validate PowerShell Execution Context:** Check logs for the process that invoked the PowerShell script (Event ID 4688) to determine if it originated from a legitimate process (e.g., Microsoft Office applications) or a suspicious one (uncommon executables or scripts).

  - **Cross-reference Execution Time:** Compare timestamps of the alert with other logging sources (e.g., Windows Security, Sysmon) to identify any correlating suspicious activity, such as unusual network outbound connections or file modifications around the same time.

  - **Investigate User Activity:** Review user access logs to determine if the user account executing the script has any previous anomalies or if it belongs to a service account that is commonly used for automation.

  - **Identify Legitimate Use Cases:** Consider scenarios where PowerShell is used for legitimate administrative tasks, particularly those using 'SetValue' for configuration settings. Check if any authorized automation scripts relate to the detected activity.

  ### Prioritization

  Given the high impact of this detection on enterprise security, it is critical to prioritize it due to the likelihood of malicious use, especially targeting sensitive or vital systems. This technique is commonly weaponized in attack chains, making it a high-severity alert for further investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative, less detectable command patterns or legitimate scripts that incidentally contain suspicious phrases. Reliable detection requires Script Block Logging to be enabled across all relevant endpoints. Additionally, benign scripts from automated tasks may trigger this alert, necessitating careful review. A related detection to strengthen coverage would be monitoring for outbound connections from the PowerShell process, which could indicate further malicious behavior.

