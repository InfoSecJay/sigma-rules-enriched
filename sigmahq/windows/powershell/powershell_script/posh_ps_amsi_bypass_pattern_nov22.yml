  ---

  ### Technical Context

  This rule detects the use of obfuscated PowerShell scripts designed to bypass the Antimalware Scan Interface (AMSI). Attackers may use this technique to evade detection by security mechanisms during the execution of malicious payloads. The likely objective is to execute malicious code stealthily within a compromised environment without triggering alerts typically raised by AMSI. This behavior correlates with the MITRE ATT&CK technique for Defense Evasion: T1562.001 (AMSI Bypass).

  Primary telemetry sources include Windows PowerShell logs, which must have Script Block Logging enabled to capture the relevant details. If this detection proves true, the security impact could be significant, as it may indicate a successful evasion tactic used by an adversary to execute harmful scripts. However, this detection alone does not confirm that the execution resulted in a compromise or that malicious software was successfully deployed.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution Logs**: Review PowerShell logs (Event ID 4104) for any script block logs containing the specified obfuscation patterns: `Assembly.GetType`, `SetValue($null,$true)`, and `NonPublic,Static`.

  - **Review Recent PowerShell Activity**: Assess the context of the detected script within PowerShell's process tree. Use Sysmon Event ID 206 (Process Access) to correlate parent and child processes, identifying potentially malicious PowerShell sessions.

  - **Investigate for Evasion Indicators**: Look for other signs of evasion across systems, such as unusual command line arguments in Windows Event ID 4688 (Process Creation) or frequent use of encoded commands (e.g., `-EncodedCommand`).

  - **Identify Legitimate Use Cases**: Confirm whether the activity correlates with known administrative tasks or legitimate applications that use the AMSI API. Analyzing scheduled tasks or software deployments may provide context to distinguish benign from malicious behavior.

  - **Correlate User Context**: Verify the user account that initiated the PowerShell session. Use Active Directory logs to ensure that this account has the appropriate administrative privileges and isn't associated with known compromise indicators.

  ---

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on critical systems if malicious. The likelihood of abuse is significant, as AMSI bypass techniques are commonly employed by adversaries during exploitation phases. This behavior is often weaponized in targeted attacks, making immediate investigation essential.

  ---

  ### Blind Spots and Assumptions

  The detection may have limitations if Script Block Logging is not enabled or configured properly, potentially allowing malicious scripts to go undetected. Legitimate administrative scripts that utilize similar techniques could trigger this alert. One related detection to strengthen coverage would be monitoring for encoded PowerShell commands, which could indicate attempts to obfuscate malicious payloads.

