logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '[Ref].Assembly.GetType'
    - 'SetValue($null,$true)'
    - 'NonPublic,Static'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential exploitation of Windows AntiMalware Scan Interface (AMSI) by identifying code patterns commonly found in AMSI bypass techniques within PowerShell scripts. The behavior typically indicates that an attacker is attempting to evade security controls by executing malicious scripts that manipulate .NET assembly types to disable or bypass malware detection mechanisms. The relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Defense Evasion (T1562.001).

  The primary telemetry source is the PowerShell script block logging, which requires that logging be enabled to capture script execution details. If successful, this behavior can lead to execution of undetected malware. It is crucial to note that this detection does NOT confirm that an actual compromise occurred, nor does it indicate whether the executed code was indeed malicious without further context.

  ### Investigation Steps

  - **Review PowerShell logs for anomalies:** Examine PowerShell script block logs (Event ID 4104) for occurrences of `[Ref].Assembly.GetType`. Compare the context of the script execution (e.g., user, time, and process ID) against benign usage patterns.

  - **Check for Script Block Logging status:** Confirm that PowerShell script block logging is enabled on the affected system (PowerShell execution policies). If logging is not configured, it may limit the ability to analyze and respond to the alert.

  - **Investigate parent processes:** Identify parent processes associated with the executed PowerShell script. Look for anomalies or unusual processes such as “cmd.exe” or “powershell.exe” initiated by less common parent processes, like “wscript.exe.”

  - **Correlate user behavior:** Validate the user context by correlating the execution with known user behavior. Legitimate PowerShell usage patterns typically include administrative tasks or automated scripts running in scheduled tasks.

  - **Identify high-confidence indicators:** Determine if there is a direct impact on system files or processes where the script interaction includes calls that change the state of known critical security components, such as modification of the AMSIInterface.

  - **Look for obfuscation indicators:** Check for additional signs of obfuscation in the scripts or PowerShell commands being executed, such as large quantities of encoded command bytes or unusual command structures that deviate from expected administrative use.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the security integrity of the system. The capability to bypass AMSI is commonly leveraged by attackers to deploy malware stealthily, increasing the likelihood of exploitation in mature threat environments.

  ### Blind Spots and Assumptions

  Detection may be limited by inadequate PowerShell logging configurations; if script block logging is disabled, legitimate administrative actions may inadvertently trigger alerts. Also, skilled adversaries could use alternative methods, such as legitimate administrative tools, to achieve similar objectives while avoiding detection. A related detection mechanism would be monitoring for unusual modifications within the AMSI interface, reinforcing overall defense against evasion techniques.

