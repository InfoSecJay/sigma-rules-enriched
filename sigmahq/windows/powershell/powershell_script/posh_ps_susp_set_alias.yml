description: Detects Set-Alias or New-Alias cmdlet usage. Which can be use as a 
  mean to obfuscate PowerShell scripts
references:
- https://github.com/1337Rin/Swag-PSO
author: frack113
date: 2023-01-08
modified: 2026-09-17
tags:
