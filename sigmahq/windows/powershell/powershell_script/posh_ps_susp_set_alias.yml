note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlets `Set-Alias` or `New-Alias`, which are often leveraged by attackers to obfuscate malicious scripts. By creating aliases for PowerShell commands, an attacker can obscure their true intent, making it harder for defenses to recognize malicious activities. This behavior fits primarily within the Execution tactic of the MITRE ATT&CK framework, specifically under techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry source required for this detection is PowerShell script block logging, which must be enabled on the endpoints. If malicious, the use of aliases can facilitate actions like remote code execution or lateral movement hidden from traditional security monitoring. It is important to note that the detection of these cmdlets alone does not confirm malicious intent, as benign administrative tasks could also utilize similar cmdlets.

  ### Investigation Steps

  - **Check PowerShell script block logging details:** Examine the Event ID 4104 logs for `ScriptBlockText` entries that include `Set-Alias` or `New-Alias`. Evaluate the associated `InvocationId` for correlation to ensure you're analyzing complete context.

  - **Identify suspicious alias usage patterns:** Look for unusual aliases created that correspond to common security or administrative functions (e.g., aliases for `Get-Process`, `Start-Process`). Compare these with known administrative behaviors to determine legitimacy.

  - **Verify context of PowerShell execution:** Correlate the detected PowerShell commands with Event ID 4688 logs to see if they are being executed by legitimate administrative users or potentially compromised accounts. Unusual parent process activity could indicate malicious behavior.

  - **Review commands associated with identified aliases:** For any detected aliases, analyze subsequent PowerShell commands invoked in the same session (Event ID 4104). Check for commands that may indicate persistence or lateral movement such as `Invoke-Command` or `New-PSSession`.

  - **Evaluate system role and criticality:** Assess the host running the detected commands. Identify if the system is a sensitive target (e.g., domain controllers, servers) as malicious actions could have more impact on these systems.

  - **Compare against established benchmarks:** Review the organization's scripts or documented administrative procedures that utilize aliases, ensuring that the detected behavior aligns with expected operational practices.

  ### Prioritization

  This alert is of low severity given that the use of aliases can be legitimate in administrative contexts. However, the ability to obfuscate commands makes it a potential indicator of malicious behavior, primarily when seen in conjunction with suspicious scripts or contexts. While not commonly weaponized in day-to-day operations, additional context must be analyzed to ascertain intent.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled, leading to missed malicious PowerShell activities. Additionally, legitimate administrative actions or unauthorized privilege escalation could trigger this detection, complicating analysis. The detection can be complemented by monitoring for other malicious PowerShell techniques such as T1086 (PowerShell) or T1071 (Application Layer Protocol) to help build a more comprehensive security posture.

