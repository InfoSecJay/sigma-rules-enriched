logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Set-Alias '
    - 'New-Alias '
  filter_main_cim:
    ScriptBlockText:
    - 'Set-Alias -Name ncms -Value New-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name gcls -Value Get-CimClass -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncso -Value New-CimSessionOption -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcms -Value Get-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcms -Value Remove-cimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcie -Value Register-CimIndicationEvent -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcai -Value Get-CimAssociatedInstance -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcim -Value Get-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name scim -Value Set-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncim -Value New-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncim -Value New-CimInstance  -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcim -Value Remove-cimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name icim -Value Invoke-CimMethod -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the usage of the PowerShell cmdlets `Set-Alias` and `New-Alias`, which are often utilized to obfuscate scripts by creating shortcuts to commands or functions. The likely attacker objective is to conceal malicious actions from security monitoring, making it harder for detection systems and analysts to identify the actual commands being executed. This behavior corresponds with the MITRE ATT&CK technique "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter: PowerShell" (T1059.001). The primary telemetry source is PowerShell Script Block Logging, which must be enabled to capture relevant logs. If malicious, this behavior can facilitate unauthorized system access or data exfiltration. Importantly, this detection by itself does NOT confirm malicious intent; benign usage by legitimate administrators can trigger the alert as well.

  ### Investigation Steps

  - **Review PowerShell execution history:** Check for related PowerShell events (Event ID 4104) in the Windows Event Logs, focusing on the timestamps of the alerts and any nearby commands to contextualize the activity.

  - **Analyze Script Block Logs:** Examine the contents of the captured script blocks for specific commands that have been aliased. Look for unusual or suspicious commands resulting from the use of `Set-Alias` or `New-Alias` that deviate from normal operational behavior, such as `ncms` resolving to malicious commands.

  - **Identify legitimate use cases:** Determine if the detected aliases are part of known administrative tasks in your environment. For instance, a common alias for `Get-Process` might be benign, while aliases pointing to `Invoke-WebRequest` or system manipulation functions may warrant further scrutiny.

  - **Evaluate asset criticality:** Assess the host's role within the environment. If the alert is triggered on a highly privileged server or a critical system, it requires immediate escalation and investigation compared to alerts on less critical workstations.

  - **Look for external indicators:** Investigate other related log sources (e.g., Windows Defender, EDR solutions) for signs of lateral movement or unexpected command chains, as PowerShell scripting is frequently associated with broader attack campaigns.

  - **Confirm artifact presence:** Check for file creation or modification events in directories commonly used by PowerShell scripts (e.g., `C:\Windows\Temp` or user profile script directories) to validate any script execution. Event IDs 4663 (Access this object) and 5145 (File Share Access) would be relevant.

  ### Prioritization

  This alert is of low severity but should not be ignored. The likelihood of malicious abuse is moderate as adversaries often use obfuscation techniques, particularly in environments where PowerShell is enabled. Moreover, while using aliases can be typical in administrative practices, their prevalence in malicious scripts raises the need for closer examination.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on Script Block Logging, which may not capture all PowerShell activity if not enabled universally. Adversaries might evade detection by using legitimate aliasing in their scripts. Common legitimate activities, such as routine administrative scripts or monitoring, can also trigger this alert. Related detections, such as monitoring for actual command execution (e.g., checking for the execution of `Invoke-Expression`), can complement this rule and enhance overall monitoring efficacy.

