- id: e8314f79-564d-4f79-bc13-fbc0bf2660d8
  type: derived
status: test
description: Detects Set-Alias or New-Alias cmdlet usage. Which can be use as a mean
  to obfuscate PowerShell scripts
references:
- https://github.com/1337Rin/Swag-PSO
author: frack113
date: 2023-01-08
modified: 2025-10-22
tags:
- attack.defense-evasion
- attack.execution
- attack.t1027
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Set-Alias '
    - 'New-Alias '
  filter_main_cim:
    ScriptBlockText:
    - 'Set-Alias -Name ncms -Value New-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name gcls -Value Get-CimClass -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncso -Value New-CimSessionOption -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcms -Value Get-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcms -Value Remove-cimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcie -Value Register-CimIndicationEvent -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcai -Value Get-CimAssociatedInstance -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcim -Value Get-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name scim -Value Set-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncim -Value New-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcim -Value Remove-cimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name icim -Value Invoke-CimMethod -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the usage of PowerShell's `Set-Alias` and `New-Alias` cmdlets. These commands can be employed by attackers to obfuscate scripts, particularly by creating shortcuts to commonly used commands or functions that might facilitate malicious activities without raising immediate awareness. The threat scenario typically involves a skilled adversary seeking to evade defenses and perform actions stealthily, such as running malicious scripts or commands without exposing their true intent.

  The relevant MITRE ATT&CK tactics associated with this detection include **Defense Evasion** (T1562) as the aliasing may be used to manipulate command visibility, and **Execution** (T1059.001) which pertains to the execution of PowerShell scripts. The primary telemetry necessary for effective detection includes Windows PowerShell script block logs, which must be enabled to capture the relevant data.

  ### Investigation Steps
  - **Review PowerShell Logs:** Investigate Windows PowerShell script block logging to identify instances of the `Set-Alias` and `New-Alias` cmdlets, focusing on the context in which these commands are executed.
  - **Analyze Created Aliases:** Look for any newly created aliases that may relate to potentially harmful commands or obfuscation techniques. Investigate the command lines or script contents associated with these aliases.
  - **Check for Script Execution Patterns:** Examine the frequency and timing of PowerShell executions following alias creation. Look for unusual execution patterns that may indicate malicious behavior.
  - **Correlate with Other Anomalies:** Cross-reference the findings with other alerts or unusual activity within the environment that may suggest an escalation scenario or a coordinated attack.

  ### Prioritization
  This alert has a **low severity rating** due to the potential for benign usage. However, in an enterprise environment, the presence of aliasing in PowerShell could indicate an attempt to obscure malicious actions, necessitating careful investigation.

  ### Blind Spots and Assumptions
  The detection logic relies on the assumption that script block logging is enabled on all relevant systems; any gaps in this logging may result in undetected malicious activity. Additionally, there may be legitimate use cases for the `Set-Alias` or `New-Alias` commands that could lead to false positives, especially in environments where administrative users frequently write scripts. As such, awareness of the operational context and typical PowerShell usage patterns is critical for accurate triage and response.

