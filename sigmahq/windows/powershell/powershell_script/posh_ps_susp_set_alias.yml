logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Set-Alias '
    - 'New-Alias '
  filter_main_cim:
    ScriptBlockText:
    - 'Set-Alias -Name ncms -Value New-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name gcls -Value Get-CimClass -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncso -Value New-CimSessionOption -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcms -Value Get-CimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcms -Value Remove-cimSession -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcie -Value Register-CimIndicationEvent -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcai -Value Get-CimAssociatedInstance -Option ReadOnly, AllScope
      -ErrorAction SilentlyContinue'
    - 'Set-Alias -Name gcim -Value Get-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name scim -Value Set-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name ncim -Value New-CimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name rcim -Value Remove-cimInstance -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
    - 'Set-Alias -Name icim -Value Invoke-CimMethod -Option ReadOnly, AllScope -ErrorAction
      SilentlyContinue'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the usage of PowerShell's `Set-Alias` and `New-Alias` cmdlets, which may be employed by attackers to obfuscate scripts and command executions. The likely attacker objective is to disguise malicious activity, making it harder for defenders to monitor and analyze script behavior. The relevant MITRE ATT&CK tactics and techniques associated with this rule include Defense Evasion (T1562) and Execution (T1059.001). Primary telemetry sources required to trigger this alert include PowerShell logs (specifically, Script Block Logging) which capture details about command executions and configurations. If malicious, such activity can lead to unauthorized data access and manipulation. It is essential to note that the detection of these cmdlets alone does not confirm malicious intent; benign usage may exist in legitimate administrative tasks.

  ### Investigation Steps

  - **Review PowerShell logs for Script Block Logging**: Identify Event ID 4104 entries associated with suspected scripts. Look for instances of `Set-Alias` or `New-Alias`, focusing on if they are coupled with suspicious commands that could indicate further evasion tactics.

  - **Check for known obfuscation patterns**: Investigate for specific alias assignments that correlate with known malicious scripts, such as aliases pointing to potentially dangerous cmdlets or workflows (e.g., `ncms` to `New-CimSession`).

  - **Identify related processes**: Correlate detected PowerShell activity with other process creation events (Event ID 4688) on the system. Investigate parent processes that initiated the PowerShell execution to assess its legitimacy.

  - **Analyze historical actions of the account**: Look into user behavior leading up to the alert; verify whether the account’s activity aligns with operational norms. Legitimate PowerShell usage typically involves administrative tasks with recognizable script patterns.

  - **Validate against whitelisted operations**: Cross-reference command usage against documented and authorized PowerShell-based administration tasks. Check for any justification for the cmdlet aliasing in operational procedures.

  - **Ascertain potential exfiltration or lateral movement**: Monitor for outbound connections or suspicious network activity (e.g., Event ID 5156 for firewall events) originating from the affected host following the use of these aliases, as they might indicate further exploitation attempts.

  ### Prioritization

  This alert should be considered low severity in the enterprise context. The likelihood of malicious abuse exists, particularly if the command usages are associated with known obfuscation techniques. However, the general usage of PowerShell and its cmdlets in administrative tasks reduces the immediate risk without additional contextual indicators.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on Script Block Logging, which may not be enabled in all environments, potentially leaving gaps in coverage. Additionally, legitimate administrative activity may trigger this alert, making context essential for proper interpretation. As a companion detection, consider monitoring for Process Creation events to capture broader activity surrounding PowerShell executions, enriching your investigation of potential obfuscation techniques used in tandem with alias creation.

