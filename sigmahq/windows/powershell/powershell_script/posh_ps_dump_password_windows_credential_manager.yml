title: Dump Credentials from Windows Credential Manager With PowerShell
id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
status: test
description: |
  Adversaries may search for common password storage locations to obtain user credentials.
  Passwords are stored in several places on a system, depending on the operating system or application holding the credentials.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1555
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_kiddie:
    ScriptBlockText|contains:
    - 'Get-PasswordVaultCredentials'
    - 'Get-CredManCreds'
  selection_rename_Password:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Windows.Security.Credentials.PasswordVault'
  selection_rename_credman:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Microsoft.CSharp.CSharpCodeProvider'
    - '[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())'
    - 'Collections.ArrayList'
    - 'System.CodeDom.Compiler.CompilerParameters'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands to extract credentials from the Windows Credential Manager and other common credential storage locations. The likely attacker objective here is the unauthorized retrieval of user credentials, potentially leading to further access and privilege escalation within the network. This behavior aligns with the MITRE ATT&CK framework under the tactic "Credential Access" and specifically targets technique T1555, which focuses on credential dumping.

  The primary telemetry source is PowerShell script block logging, specifically identifying events where command text contains certain credential access keywords. If successful, this detection could indicate a serious security breach. However, it does NOT confirm that a successful credential extraction occurred, as legitimate administrative activities may also generate similar logs.

  ### Investigation Steps

  - **Check PowerShell logs for suspicious commands**: Review Security Event ID 4104 for script block logs containing `Get-PasswordVaultCredentials` or `Get-CredManCreds`, which are strong indicators of malicious activity.

  - **Identify expected legitimate usage**: Compare the command execution context with known administrative scripts or maintenance tasks that utilize similar command patterns. Legitimate usage often includes `Get-PasswordVaultCredentials` in contexts relating to user support without harmful intent or broad credential extraction.

  - **Analyze the script execution history**: Use the PowerShell command `Get-WinEvent -LogName Microsoft-Windows-PowerShell/Operational` to inspect for unusual execution times or unknown user accounts executing these commands.

  - **Look for signs of script obfuscation**: Investigate if any of the script block logs contain obfuscated commands or references to `New-Object` creating a `PasswordVault` or `CSharpCodeProvider`, as this could indicate a malicious attempt to evade detection.

  - **Confirm the presence of the credential dumps**: On endpoints where suspicious activity is detected, verify the existence of unexpected files or logs produced during the execution of PowerShell scripts, such as temporary files generated by `CSharpCodeProvider`.

  ### Prioritization

  This alert is medium severity due to the potential for high-impact credential theft on critical systems. The likelihood of malicious abuse is moderate, as adversaries often target credentials for lateral movement. Such behavior has been weaponized and frequently appears in attacks aiming for broader access within environments.

  ### Blind Spots and Assumptions

  This detection may miss activities due to PowerShell logging not being enabled or properly configured, which limits visibility into potentially malicious behavior. Additionally, legitimate administrative tasks such as credential retrieval during support operations could trigger the alert. A companion detection for related credential access methods would be monitoring for API calls to the `Windows.Security.Credentials` namespace, further enhancing coverage for credential access attempts.

