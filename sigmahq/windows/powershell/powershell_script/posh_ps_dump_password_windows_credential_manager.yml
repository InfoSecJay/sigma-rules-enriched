logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_kiddie:
    ScriptBlockText|contains:
    - 'Get-PasswordVaultCredentials'
    - 'Get-CredManCreds'
  selection_rename_Password:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Windows.Security.Credentials.PasswordVault'
  selection_rename_credman:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Microsoft.CSharp.CSharpCodeProvider'
    - '[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())'
    - 'Collections.ArrayList'
    - 'System.CodeDom.Compiler.CompilerParameters'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_dump_password_windows_credential_manager/info.yml
note: |
  ### Technical Context

  This rule detects attempts by adversaries to extract credentials from the Windows Credential Manager using PowerShell commands. Specifically, behaviors indicative of credential dumping are identified by commands like `Get-PasswordVaultCredentials` and `Get-CredManCreds`, which are utilized to retrieve stored credentials. The likely attacker objective is to harvest user credentials for lateral movement or unauthorized access to systems.

  The relevant MITRE ATT&CK tactic is Credential Access (TA0006), with techniques T1555: Credentials from Password Stores. Primary telemetry sources include PowerShell script block logging, capturing events where potentially malicious commands are executed. If malicious, this activity could lead to unauthorized account access and data breaches. Importantly, this detection does NOT confirm that credentials were successfully exfiltrated; it only indicates an attempted access.

  ### Investigation Steps

  - **Review script execution logs:** Check PowerShell script block logs (Event ID 4104) for instances containing `Get-PasswordVaultCredentials` or `Get-CredManCreds`. Identify whether the execution originated from a user with valid access or unusual account behavior.

  - **Analyze command context:** Examine the context under which PowerShell was executed. Identify if these commands were run from an administrative context or another privileged role, which might indicate malicious intent versus legitimate administrative tasks.

  - **Identify high-confidence malicious indicators:** Look for multiple instances of the use of `New-Object` and `Windows.Security.Credentials.PasswordVault` in a short timeframe within PowerShell logs. A rapid succession of these commands often indicates an automated or scripted credential harvesting attempt.

  - **Check for legitimate usage:** Review the script block logs for known benign PowerShell scripts, such as organizational scripts used for password management. Compare timestamp and user identity against documented administrative activities to rule out false positives.

  - **Incident response procedure:** If malicious activity is confirmed, isolate the affected system immediately, conduct a forensic examination of PowerShell command history (Event ID 4103), and check for any potentially exfiltrated credentials in emails or online accounts.

  ### Prioritization

  This alert is of medium severity as it indicates potential credential theft activity on a Windows system, which could lead to unauthorized access to sensitive resources. The likelihood of malicious abuse is moderate; credential dumping is a commonly weaponized technique by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as obfuscation of commands or the use of non-standard scripts that may not be captured in traditional logging. Reliable detection requires that PowerShell script block logging is enabled and properly configured. Legitimate administrative tools or user actions related to credential management might trigger this alert, such as automated backup scripts. A related detection to strengthen coverage is monitoring for unusual account logins or system access patterns following these alerts.

