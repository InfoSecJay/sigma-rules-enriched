title: Dump Credentials from Windows Credential Manager With PowerShell
id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
status: test
description: |
  Adversaries may search for common password storage locations to obtain user credentials.
  Passwords are stored in several places on a system, depending on the operating system or application holding the credentials.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1555
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_kiddie:
    ScriptBlockText|contains:
    - 'Get-PasswordVaultCredentials'
    - 'Get-CredManCreds'
  selection_rename_Password:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Windows.Security.Credentials.PasswordVault'
  selection_rename_credman:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'Microsoft.CSharp.CSharpCodeProvider'
    - '[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())'
    - 'Collections.ArrayList'
    - 'System.CodeDom.Compiler.CompilerParameters'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects attempts to extract credentials from the Windows Credential Manager using PowerShell commandlets that specifically target stored passwords. Attackers often leverage this technique to gain access to sensitive accounts, facilitating further compromises in an environment. The detection logic identifies specific PowerShell script blocks that involve commands like `Get-PasswordVaultCredentials` and `Get-CredManCreds`, which are associated with credential extraction activities.

  The likely objectives for an attacker employing this method include gathering saved credentials for subsequent lateral movement, privilege escalation, or executing additional attacks on critical systems. Success in this approach can significantly amplify an attacker’s access, enabling them to exploit user-level privileges for more significant gains within an enterprise network.

  Relevant MITRE ATT&CK tactics include:
  - **Credential Access** (TA0006)
    - **Credentials from Password Stores** (T1555)

  Primary data sources for effective detection include PowerShell Script Block logs, as these will contain the executed script commands and parameters.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check Windows PowerShell logs, specifically for Script Block logging. Identify any scripts containing the terms `Get-PasswordVaultCredentials` or similar commands targeting credential stores.
  - **Collect Event Logs**: Gather relevant Windows Security Event logs (Event ID 4104) that detail PowerShell script execution. Look for unusual execution patterns or scripts from non-administrative users.
  - **Correlate with User Activity**: Analyze user account activity around the time of the detection. Investigate any anomalous login attempts or access requests that correspond with PowerShell activity.
  - **Examine Credential Storage**: Consider inspecting Windows Credential Manager on affected systems to identify unauthorized access or any indicators of credential dumping.

  ### Prioritization
  Given that losing credentials can lead to severe breaches within the enterprise, this alert should be treated as medium severity. The likelihood of impact is significant, especially if the attacker gains access to highly privileged accounts.

  ### Blind Spots and Assumptions
  This detection may miss instances where attackers use modified or obfuscated commands to access the Credential Manager, as well as scenarios where Script Block logging is not enabled. The detection logic assumes that PowerShell usage is monitored appropriately in the environment, and that configurations are in place to log relevant activities. If PowerShell logging is disabled or improperly configured, the effectiveness of this rule will be compromised.

