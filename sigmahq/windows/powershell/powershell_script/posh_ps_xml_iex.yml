logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_xml:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'System.Xml.XmlDocument'
    - '.Load'
  selection_exec:
    ScriptBlockText|contains:
    - 'IEX '
    - 'Invoke-Expression '
    - 'Invoke-Command '
    - 'ICM -'
  condition: all of selection_*
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell commands that utilize XML processing, specifically the use of `New-Object`, `System.Xml.XmlDocument`, and `.Load`. A likely attacker objective is to manipulate XML data in memory and execute arbitrary commands, thereby potentially compromising the host or extracting sensitive data. This behavior falls under the MITRE ATT&CK tactic of Execution, specifically technique T1059.001 (PowerShell).

  The primary telemetry source for this detection is Windows PowerShell logs, with the requirement that Script Block Logging is enabled to capture the necessary details. If malicious, this behavior could lead to data exfiltration or unauthorized command execution, posing a significant security risk. It's important to note that while this detection indicates potentially malicious PowerShell activity, it does not confirm that the behavior is indeed malicious without further contextual investigation.

  ### Investigation Steps

  - **Review PowerShell logs for ScriptBlockText:** Check for Event ID 4103 entries that include `New-Object` with `System.Xml.XmlDocument` and `.Load`. Look for irregular command structures typically not used in administrative tasks.

  - **Verify PowerShell command context:** Identify the user context of the PowerShell execution. Investigate accounts and roles associated with the execution. Legitimate activities may include scheduled tasks or administrative scripts; see if the execution corresponds to known job schedules.

  - **Analyze parent process details:** Examine the parent processes of the PowerShell instances by reviewing Event ID 4688 (Process Creation) for any unusual execution paths or parent processes, such as rundll32 or similar scripting hooks often associated with lateral movement.

  - **Check for invocation patterns:** Look for patterns of invocation where `Invoke-Expression`, `Invoke-Command`, or `ICM -` commands are leveraged, particularly in rapid succession. This could indicate automated or scripted attack behavior.

  - **Identify network connections made:** If the PowerShell script interacts with external resources, analyze network logs (e.g., Windows Firewall logs or proxy logs) for outbound connections made around the time of the alert. Look for connections to unknown or suspicious domains/IPs.

  ### Prioritization

  This alert holds medium severity due to the potential for compromise and the capability of PowerShell in executing malicious scripts. The likelihood of abuse is moderate, as attackers commonly leverage PowerShell for lateral movement and command execution. Such behaviors are frequently weaponized, increasing the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the disabling of Script Block Logging, which could lead to missed alerts. Legitimate activities such as XML manipulation for automation or configuration purposes in a corporate setting could inadvertently trigger this alert. Monitoring related artifacts, such as unusual WMI queries or abnormal PowerShell script executions, may strengthen coverage and improve detection capabilities.

