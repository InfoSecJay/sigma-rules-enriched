title: Powershell XML Execute Command
id: 6c6c6282-7671-4fe9-a0ce-a2dcebdc342b
status: test
description: |
  Adversaries may abuse PowerShell commands and scripts for execution.
  PowerShell is a powerful interactive command-line interface and scripting environment included in the Windows operating system. (Citation: TechNet PowerShell)
  Adversaries can use PowerShell to perform a number of actions, including discovery of information and execution of code
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-8---powershell-xml-requests
author: frack113
date: 2022-01-19
modified: 2023-01-19
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_xml:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'System.Xml.XmlDocument'
    - '.Load'
  selection_exec:
    ScriptBlockText|contains:
    - 'IEX '
    - 'Invoke-Expression '
    - 'Invoke-Command '
    - 'ICM -'
  condition: all of selection_*
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious usage of PowerShell to execute XML-related commands, specifically focusing on script blocks that create and load XML documents. Adversaries may leverage PowerShell’s rich functionality to execute unauthorized commands and scripts, aiming to establish persistence, perform reconnaissance, or facilitate lateral movement. This behavior is indicative of attackers exploiting the power of PowerShell to execute code that could lead to further compromises within the network.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include **Execution (T1203)**, particularly focused on **Command and Scripting Interpreter (T1059.001)**. Attackers often manipulate PowerShell to execute malicious commands or scripts, making detection crucial in identifying potential breaches before they escalate.

  The primary data sources for effective detection will be Windows PowerShell script logs, specifically logs generated when script block logging is enabled. This includes logging of executed commands and their arguments, allowing analysts to trace back suspicious executions to their origins.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Look for the presence of 'New-Object', 'System.Xml.XmlDocument', and '.Load' in script block logs to confirm unauthorized XML document manipulations or executions.
  - **Analyze Administrative Scripts:** Determine if the detected commands originate from legitimate administrative tasks or are anomalous rather than typical administrative usage.
  - **Check for Related Processes:** Investigate any parent processes initiated by PowerShell, especially those indicating unusual execution contexts or system anomalies.
  - **Correlate with Other Logs:** Cross-reference detections with Windows Event Logs or endpoint logs to identify any signs of lateral movement, suspicious network connections, or unexpected user behavior associated with these PowerShell executions.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for significant impact if used maliciously. While PowerShell is commonly used for legitimate purposes, its abuse in executing unauthorized commands can lead to widespread compromise, making it a risk to enterprise environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the requirement that PowerShell script block logging must be enabled; if it is disabled, legitimate activity and potential threats may go undetected. The logic assumes PowerShell usage for XML commands is rare and indicates potential compromise; however, benign administrative scripts may generate false positives. Additionally, without comprehensive logging configurations for PowerShell activity, the detection may miss critical events that lead to full exposure of a system.

