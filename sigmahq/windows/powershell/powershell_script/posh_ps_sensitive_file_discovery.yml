detection:
  selection_action:
    ScriptBlockText|contains:
    - ls
    - get-childitem
    - gci
  selection_recurse:
    ScriptBlockText|contains: '-recurse'
  selection_file:
    ScriptBlockText|contains:
    - '.pass'
    - '.kdbx'
    - '.kdb'
