  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - ls
    - get-childitem
    - gci
  selection_recurse:
    ScriptBlockText|contains: '-recurse'
  selection_file:
    ScriptBlockText|contains:
    - '.pass'
    - '.kdbx'
    - '.kdb'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands associated with the enumeration of sensitive files, such as those with extensions commonly related to password management or databases (e.g., .pass, .kdbx, .kdb). The likely attacker objective is to identify and exfiltrate sensitive information that could facilitate a larger compromise, like unauthorized access to accounts or services. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically the technique "File and Directory Discovery" (T1083).

  The primary telemetry source for this detection is PowerShell script block logging, which captures the executed command line text. If exploited successfully, this activity could lead to unauthorized access to critical data. Importantly, this detection does NOT confirm the success of an attempt to access or exfiltrate sensitive files, as legitimate users could also perform similar actions.

  ### Investigation Steps

  - **Review detected PowerShell commands: ** Investigate the PowerShell command captured in the event logs for ScriptBlockText (Event ID 4104), focusing on the presence of commands like 'ls', 'get-childitem', or their aliases, particularly with the '-recurse' flag.

  - **Identify sensitive file types: ** Note the file extensions searched for in the command. Look for references to sensitive data files (.pass, .kdbx, .kdb) in recent file activity logs (Event ID 4663) to determine if any attempts to access these files were made.

  - **Correlate with authentication logs: ** Check for concurrent login events (Security Event ID 4624) from the same user account in which the PowerShell script was executed and identify if the access was legitimate or unusual.

  - **Check for expected behavior: ** Verify whether legitimate users (e.g., system administrators or developers) may have run similar commands as part of normal operations. Cross-reference with user activity logs to confirm expected user behavior.

  - **Determine the host context: ** Assess the role of the host system (e.g., sensitive data servers vs. general user workstations) to evaluate the severity of the detected activity, as usage on critical assets may indicate a higher risk.

  - **Look for indicators of further action: ** Confirm if there were additional events (e.g., file creation or modification logs - Event ID 4663 for Access Attempted on sensitive files) following the script execution, indicating possible data exfiltration or further malicious activity.

  ### Prioritization

  The severity of this alert is medium due to the moderate impact of sensitive file exposure, coupled with a notable likelihood of this behavior being weaponized by adversaries for data theft. Given that file enumeration is often a prelude to exfiltration, it warrants prompt investigation to prevent potential data breaches.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of script block logging, as it is a prerequisite for capturing the relevant telemetry. Legitimate activities such as system audits or script testing by users with sufficient permissions could also trigger the alert. It's crucial to have complementary detections for unusual file access patterns or attempts to access sensitive file types that could enhance coverage against potential data breaches.

