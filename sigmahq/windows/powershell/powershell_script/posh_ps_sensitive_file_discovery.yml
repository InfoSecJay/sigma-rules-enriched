note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands commonly utilized by adversaries to enumerate sensitive files, specifically those with extensions related to password caches and vaults (like `.pass`, `.kdbx`, `.kdb`). The likely attacker objective here is to identify and potentially exfiltrate sensitive credentials or keys that may facilitate further access within the target environment. This behavior aligns with the MITRE ATT&CK framework under the tactic of Discovery, particularly the technique T1083 (File and Directory Discovery).

  Primary telemetry sources include Windows PowerShell script block logs, which require that Script Block Logging be enabled. The security impact of these actions can be significant, as discovering sensitive files might lead to unauthorized access to critical systems. However, this detection does not confirm whether malicious intent exists; legitimate users could run similar commands under normal operational scenarios.

  ### Investigation Steps

  - **Check executed PowerShell commands:** Review PowerShell script block logs (Event ID 4104) for commands containing `ls`, `get-childitem`, or aliases like `gci`. Compare against expected scripting practices for authorized users.

  - **Evaluate file access patterns:** Identify if the commands are targeting sensitive files by checking the ScriptBlockText for extensions like `.pass`, `.kdb`, or `.kdbx`. Access by known admins vs. unauthorized users can indicate potential malicious behavior.

  - **Validate normal operations:** Investigate the context of PowerShell executions by determining whether the commands were run by authenticated users who typically engage in file discovery, such as system administrators, within appropriate timeframes.

  - **Identify high-confidence malicious indicators:** Look for patterns suggesting abuse, including recursive directory scans (indicated by `-recurse` in ScriptBlockText) targeting sensitive directories.

  - **Monitor for lateral movement:** Track any subsequent actions following the file discovery commands, such as further access to identified sensitive files, as this may suggest a pivot to more privileged activities.

  - **Review Script Block Logging status:** Ensure that script block logging is properly configured and enabled. Lack of logging can lead to gaps in visibility for similar future activities.

  ### Prioritization

  This alert should be treated with medium severity. The systems potentially affected may contain sensitive information, making them prime targets for exploitation. While the likelihood of a malicious activity exists, further context is needed to determine if the actions are part of a systematic attack, as legitimate administrative tasks might involve similar commands.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate administrative activities may trigger alerts due to routine file discovery. If Script Block Logging is not enabled, no visibility will be gained into the command executions. Additionally, adversaries may use obfuscation techniques or alternative scripting languages to evade detection. Relating this to companion detections, rules monitoring for unexpected file access or administrative command executions may enhance threat assessment and mitigate blind spots.

