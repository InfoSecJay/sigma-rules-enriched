note: |
  ### Technical Context
  This detection rule is designed to identify potential adversarial activity related to the enumeration of sensitive files on Windows systems using PowerShell. Attackers may use PowerShell commands such as `Get-ChildItem` (aliased as `gci`) to search for specific files, particularly those that may contain sensitive information, such as passwords or cryptographic keys. The goal of this activity could be to gather intelligence for further exploitation, including privilege escalation or lateral movement within the target environment.

  The relevant MITRE ATT&CK tactics for this rule are **Discovery**, particularly technique **T1083: File and Directory Discovery**. This technique involves an adversary searching for files that can provide insights into the organization's assets, credentials, or configuration, increasing their privileged access to the environment. Primary data sources for this detection include PowerShell script block logging which captures the commands executed in PowerShell, allowing investigators to correlate actions with suspicious behavior.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine the PowerShell script block logs for instances of file enumeration commands including `Get-ChildItem`, `ls`, or `gci`, especially when used with the `-recurse` flag. Pay close attention to the context in which these files are searched.

  - **Correlate with Active Directory Logs**: Check for any corresponding logs in Active Directory that may suggest unauthorized accesses or unusual user behaviors coinciding with the detection of sensitive file enumeration.

  - **Identify Targeted File Types**: Specifically look for attempts to access files with extensions like `.pass`, `.kdbx`, or `.kdb`. Document the path locations of these files and understand their significance within your organizational context.

  - **Analyze User Behavior**: Investigate the user account that executed these commands to determine if their activities align with standard operational procedures. Look for unusual account behavior or activities outside of regular working hours.

  ### Prioritization
  The alert's severity is considered medium due to the potential impact of an attacker discovering sensitive files, which could lead to unauthorized access or credential compromise. The likelihood of attack vectors using such enumeration commands is prevalent in sophisticated attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions
  This detection rule assumes that Script Block Logging is enabled across all relevant Windows systems, which is a common requirement but might not be universally enforced. If logging is disabled or improperly configured, this alert will fail to capture instances of this potentially malicious behavior. Additionally, the detection logic may miss more sophisticated file discovery techniques that do not involve standard PowerShell commands or that rely on alternate encoding or obfuscation methods.

