logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
        # Whole words only: as plain substrings, 'ls' and 'gci' also match words such as 'false' or 'credentials'
    ScriptBlockText|re|i: '\b(?:get-childitem|gci|ls|dir)\b'
  selection_recurse:
    ScriptBlockText|contains: '-recurse'
  selection_file:
    ScriptBlockText|contains:
    - '.pass'
    - '.kdbx'
    - '.kdb'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_sensitive_file_discovery/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commandlets that are commonly employed to enumerate sensitive files on Windows systems, specifically through the invocation of commands such as `Get-ChildItem` or its aliases. The likely attacker objective is to locate sensitive credential files (e.g., passwords, keystores) to facilitate lateral movement or privilege escalation. This behavior fits within the MITRE ATT&CK framework under the tactic of Discovery (TA0007) and the technique of File and Directory Discovery (T1083).

  The primary telemetry source is Windows PowerShell script logs, requiring the activation of Script Block Logging to capture relevant events. If exploited maliciously, an attacker could gain unauthorized access to sensitive information. However, this detection alone does not confirm malicious activity; legitimate administrative tasks may trigger the same alerts.

  ### Investigation Steps

  - **Identify the PowerShell script context**: Review the associated Script Block Logging events (Event ID 4104) to assess the process context (e.g., calling user, parent process) for any anomalies. Verify if the script was run by expected administrative users.

  - **Check for sensitive file types**: Confirm the presence of the sensitive file extensions being targeted (e.g., `.pass`, `.kdbx`, `.kdb`) in the output of the command. Check for their existence using file audit logs (Event ID 4663) and correlate findings.

  - **Evaluate legitimate administrative activity**: Review if scheduled tasks or administrative scripts are using similar commands without malicious intent. Cross-reference user roles to validate expected behavior for tools such as configuration management or monitoring scripts.

  - **Identify high-confidence malicious indicators**: Investigate if there are sequences of commands involving multiple sensitive file types. An attacker may run recursive searches (`-recurse` flag) across multiple directories; track this against logs for additional suspicious activities or data exfiltration attempts.

  - **Collect process creation logs**: Look for suspicious process creation (Event ID 4688) instances from the PowerShell executable, and review command-line arguments for signs of automation or unusual user inputs that deviate from baseline behavior.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive data exposure. The likelihood of abuse is notable since enumerating credential-related files can often precede further exploits. While not universally weaponized, this behavior is common in various adversarial tactics, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise from insufficient Script Block Logging configuration, which could lead to unrecorded execution commands. Legitimate administrative scripts or routine maintenance could also trigger these alerts, potentially generating false positives. Companion detection, such as user behavior analytics for abnormal PowerShell usage patterns, enhances coverage against evasion tactics.

