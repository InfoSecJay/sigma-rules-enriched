title: PowerShell Script With File Upload Capabilities
id: d2e3f2f6-7e09-4bf2-bc5d-90186809e7fb
status: test
description: Detects PowerShell scripts leveraging the "Invoke-WebRequest" cmdlet
  to send data via either "PUT" or "POST" method.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1020/T1020.md
- https://www.w3.org/Protocols/rfc2616/rfc2616-sec9.html
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-webrequest?view=powershell-7.4
author: frack113
date: 2022-01-07
modified: 2025-07-18
tags:
- attack.exfiltration
- attack.t1020
logsource:
  product: windows
  category: ps_script
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - 'irm '
    - 'iwr '
  selection_flag:
    ScriptBlockText|contains:
    - '-Method "POST"'
    - '-Method "PUT"'
    - '-Method POST'
    - '-Method PUT'
    - "-Method 'POST'"
    - "-Method 'PUT'"
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This rule detects potentially malicious PowerShell scripts that utilize the `Invoke-WebRequest` or `Invoke-RestMethod` cmdlets to upload data to remote servers using HTTP methods like `POST` or `PUT`. Attackers may exploit these capabilities to exfiltrate sensitive information, download additional payloads, or establish command-and-control (C2) channels. The detection focuses specifically on script block text to identify malicious intentions behind typical PowerShell commands that could be used for data transfer.

  Potential attacker objectives include stealing data from the compromised system or performing lateral movement within the network. The tactics and techniques relevant to this detection rule fall under the MITRE ATT&CK framework, specifically **Exfiltration over Command and Control Channel** (T1041) and **Data Exfiltration** (T1020). The primary data sources for effective detection include PowerShell script logs that capture command executions, authentication logs for network connections, and any web proxy logs that may record outgoing HTTP requests.

  ### Investigation Steps
  - **Review PowerShell Execution Logs:** Analyze recent PowerShell execution logs to identify suspicious command line arguments that include `Invoke-WebRequest` or `Invoke-RestMethod` with `-Method POST` or `-Method PUT`.
  - **Correlate with Network Traffic:** Examine network traffic for outgoing connections to unauthorized or unusual external IP addresses, particularly after detecting suspicious PowerShell activity.
  - **Inspect Web Proxy Logs:** Scrutinize web proxy logs for entries related to the detected HTTP requests, focusing on payload sizes and response codes, which might reveal unusual patterns of data exfiltration.
  - **Check for Lateral Movement Signs:** Investigate other systems for similar PowerShell activity to determine if this is part of a larger coordinated attack targeting multiple hosts.

  ### Prioritization
  This alert is of low severity due to its broader range of possible benign uses, but it should not be ignored, as it could indicate an initial foothold by an attacker attempting to exfiltrate data or further exploit the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of PowerShell logging in environments where it is disabled or not properly configured. Furthermore, there is an assumption that legitimate uses of `Invoke-WebRequest` do not occur frequently, which might contribute to false positives. For this alert to function effectively, it is essential to ensure that detailed logging of PowerShell commands is enabled in the environment.

