title: PowerShell Script With File Upload Capabilities
id: d2e3f2f6-7e09-4bf2-bc5d-90186809e7fb
status: test
description: Detects PowerShell scripts leveraging the "Invoke-WebRequest" 
  cmdlet to send data via either "PUT" or "POST" method.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1020/T1020.md
- https://www.w3.org/Protocols/rfc2616/rfc2616-sec9.html
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-webrequest?view=powershell-7.4
author: frack113
date: 2022-01-07
modified: 2025-07-18
tags:
- attack.exfiltration
- attack.t1020
logsource:
  product: windows
  category: ps_script
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - 'irm '
    - 'iwr '
  selection_flag:
    ScriptBlockText|contains:
    - '-Method "POST"'
    - '-Method "PUT"'
    - '-Method POST'
    - '-Method PUT'
    - "-Method 'POST'"
    - "-Method 'PUT'"
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts using the "Invoke-WebRequest" or "Invoke-RestMethod" cmdlets, specifically when these are employed to upload data via HTTP "POST" or "PUT" requests. The likely attacker objective is to exfiltrate data from the target environment, which can include sensitive information or malware. This activity is aligned with the MITRE ATT&CK framework's "Exfiltration Over Web Service" tactic (T1020). The primary telemetry sources are Windows PowerShell logs, specifically targeting Script Block logs. If malicious, this behavior can lead to a significant data leak or compromise of sensitive information. Importantly, this detection does NOT confirm that exfiltration has occurred, as legitimate use cases exist for these commandlets.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution History:** Review relevant PowerShell logs (e.g., Event ID 4104) for execution times and parameters used in the scripts, specifically looking for 'Invoke-WebRequest' or 'Invoke-RestMethod' commands.

  - **Analyze Network Traffic:** Investigate outbound traffic for HTTP/HTTPS requests originating from impacted hosts. Focus on any POST or PUT requests targeting unusual or unauthorized external IP addresses.

  - **Identify Legitimate Use Cases:** Validate if known applications or scheduled tasks utilize PowerShell for legitimate purposes. Often, these would involve recognized internal communications, not involving external endpoints unexpectedly.

  - **Review Web Server Logs:** Inspect server-side logs for any incoming POST or PUT requests matching the identified suspicious request patterns. Check for headers and payload content for anomalies.

  - **Correlate with User Activity:** Look at associated user accounts to determine if there’s a history of previous breaches or unusual login behavior, aligning with the timeline of the PowerShell activity.

  - **Check for Downloads:** Validate whether payloads were downloaded before the upload actions by checking Event IDs 4103 (script block logging) and ensuring there are no unauthorized file creations in targeted directories.

  ---

  ### Prioritization

  The severity of this alert is moderate. The affected systems likely contain sensitive data, making them high-value targets for attackers. The use of PowerShell for exfiltration is a common tactic among adversaries, raising the likelihood of malicious intent behind the alerts.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through encoded commands or use of legitimate scripts to mask malicious activity. Reliable detection requires Script Block logging to be enabled on monitored endpoints. Legitimate tools like backup solutions or data transfer applications might trigger this alert. For enhanced coverage, consider monitoring for suspicious outbound connections alongside this rule.

