title: Replace Desktop Wallpaper by Powershell
id: c5ac6a1e-9407-45f5-a0ce-ca9a0806a287
status: test
description: |
  An adversary may deface systems internal to an organization in an attempt to intimidate or mislead users.
  This may take the form of modifications to internal websites, or directly to user systems with the replacement of the desktop wallpaper
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1491.001/T1491.001.md
author: frack113
date: 2021-12-26
tags:
- attack.impact
- attack.t1491.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'Get-ItemProperty'
    - 'Registry::'
    - 'HKEY_CURRENT_USER\Control Panel\Desktop\'
    - 'WallPaper'
  selection_2:
    ScriptBlockText|contains: SystemParametersInfo(20,0,*,3)
  condition: 1 of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects modifications made to user desktop wallpapers via PowerShell scripts, specifically targeting the registry settings that control wallpaper configurations. The likely objective of an attacker using this tactic would be to intimidate users or disrupt normal operations by altering visual elements of the desktop environment. The relevant MITRE ATT&CK tactics are "Impact" and the technique is T1491.001 - "Defacement".

  Primary telemetry sources include PowerShell logs (Event ID 4104 for script block logging) where the script will call for Registry manipulation commands. The security implications of a successful attack could range from user disorientation to broader operational insecurity, especially if this behavior is linked to more destructive actions. It is crucial to note that this detection alone does not confirm a compromise or malicious actor, as legitimate administrative functions may also cause similar changes.

  ### Investigation Steps

  - **Check PowerShell log entries:** Review PowerShell logs for any Event ID 4104 entries related to the script block that includes 'Get-ItemProperty' and 'SystemParametersInfo(20,0,*,3' to identify the specific script execution and context.

  - **Verify registry changes:** Inspect the registry under `HKEY_CURRENT_USER\Control Panel\Desktop\` for non-standard wallpaper file paths that do not correspond to typical user wallpaper settings.

  - **Assess user activity:** Review user activity around the time of the alert by checking Event ID 4624 (Logon) to determine if the user context matches known patterns for legitimate changes, such as system administrators performing updates.

  - **Investigate process creation logs:** Look for Event ID 4688 or Sysmon Event ID 1 logs to identify if the PowerShell process was invoked by potentially malicious or suspicious parent processes.

  - **Document expected behavior:** Compare the user’s wallpaper change to organizational policy or expected user actions, particularly noting if the wallpaper change aligns with scheduled IT updates or user requests.

  ### Prioritization

  This alert carries a low severity in an enterprise context, primarily because while the action of changing wallpaper could be an indicator of a defacement attempt, it is relatively benign compared to other forms of exploitation. However, if correlated with hostile intent or followed by additional malicious behavior, it could indicate a nefarious attempt to disrupt services.

  ### Blind Spots and Assumptions

  This detection could be evaded by attackers using obfuscated scripts or employing benign-looking administrative tasks. Reliable detection requires PowerShell script block logging to be enabled. Additionally, legitimate administrative users may trigger this alert during system updates or when reinforcing company branding on user desktops. A companion detection to strengthen coverage would be monitoring for unusual PowerShell script executions, particularly those obfuscating or disguising their intent via complex command structures.

