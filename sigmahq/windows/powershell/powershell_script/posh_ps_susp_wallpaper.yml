logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'Get-ItemProperty'
    - 'Registry::'
    - 'HKEY_CURRENT_USER\Control Panel\Desktop\'
    - 'WallPaper'
  selection_2:
    ScriptBlockText|contains: SystemParametersInfo(20,0,*,3)
  condition: 1 of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell scripts that modify the desktop wallpaper on Windows systems. Such behavior can indicate malicious activity, where an adversary seeks to deface systems within an organization as part of a psychological tactic to intimidate or mislead users. While this may seem trivial, it could be a precursor to more significant malicious activity or serve as a smokescreen during an ongoing attack.

  The relevant MITRE ATT&CK techniques include T1491.001: **Defacement**, which falls under the tactic of **Impact**. This technique highlights the end goal of adversaries who aim to disrupt, degrade, or destroy the integrity of information or disrupt services. The primary data sources for detecting this activity are PowerShell script logs, specifically those generated by the Windows Script Block Logging feature, which must be enabled to capture the necessary artifacts.

  ### Investigation Steps
  - **Review PowerShell Command Logs:** Investigate the PowerShell logs for the execution of commands that modify registry keys related to desktop wallpaper. Pay close attention to any instances of `Get-ItemProperty` targeting `HKEY_CURRENT_USER\Control Panel\Desktop\WallPaper`.

  - **Examine Script Block Logs:** Collect and analyze script block logs for any occurrences of suspicious PowerShell commands, particularly those containing `SystemParametersInfo(20,0,*,3)`, which indicates wallpaper changes.

  - **Check User Behavior and Context:** Assess the context of the user and endpoint involved to ensure that the wallpaper change is consistent with normal user behavior. Look for any anomalies, such as changes occurring outside of business hours or by unauthorized accounts.

  - **Gather Endpoint Metadata:** Compile metadata from endpoints (such as installed applications and last login times) to identify any correlation with the wallpaper change events, which may indicate prior unauthorized access or compromised accounts.

  ### Prioritization
  Despite being classified as low severity, this alert should not be dismissed in an enterprise environment, as changes to desktop wallpaper can signify an adversary's foothold or ongoing reconnaissance before launching more impactful actions.

  ### Blind Spots and Assumptions
  This detection rule has limitations, such as the reliance on the enabling of Script Block Logging, which may not be consistently configured across all systems. Additionally, the detection logic assumes that malicious wallpaper changes can only be made through PowerShell without considering other methods such as direct registry modifications via non-PowerShell scripts. Furthermore, without additional context regarding user intent or authorization, the alert may miss cases of benign activity or legitimate administrative actions.

