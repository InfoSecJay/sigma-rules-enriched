logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'Get-ItemProperty'
    - 'Registry::'
    - 'HKEY_CURRENT_USER\Control Panel\Desktop\'
    - 'WallPaper'
  selection_2:
    ScriptBlockText|contains: SystemParametersInfo(20,0,*,3)
  condition: 1 of selection_*
falsepositives:
- Unknown
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that change the desktop wallpaper on Windows systems, which may indicate an adversary's attempt to deface systems for intimidation or misinformation purposes. The likely attacker objective is to modify user environments to cause confusion or establish malicious control over a system. This behavior aligns with the MITRE ATT&CK technique **T1491.001: Defacement**.

  The primary telemetry sources are Windows PowerShell logs and the Security Event log related to Script Block Logging. If malicious, this activity may undermine user trust and disrupt normal operations. This detection does NOT confirm a system compromise on its own; it only indicates that a wallpaper change attempt occurred, which could also be the result of legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for suspicious activity:** Examine Event ID 4104 (PowerShell Script Block Logging) for the specific ScriptBlockText showing `SystemParametersInfo(20,0,*,3)` or registry modifications targeting `HKEY_CURRENT_USER\Control Panel\Desktop\WallPaper`.

  - **Check for unauthorized wallpaper changes:** Assess the Windows registry (e.g., `HKEY_CURRENT_USER\Control Panel\Desktop\WallPaper`) to identify recent modifications. Sudden or unusual wallpaper setting changes by non-administrative user accounts may indicate malicious intent.

  - **Identify the executing user and account context:** Validate the execution context of the PowerShell commands by reviewing Event ID 4688 (Process Creation) logs to determine if the changes were executed by expected users or if there are service accounts being misused.

  - **Validate known benign activities:** Confirm expected behavior, such as IT department personnel updating wallpapers in a coordinated campaign (e.g., for corporate branding). Compare timestamps and user accounts against established change protocols.

  - **Assess potential pivot points:** Check for subsequent processes or network activity related to the account performing the wallpaper change to identify possible lateral movement or additional malicious actions.

  ---

  ### Prioritization

  This alert is low severity. While changing a desktop wallpaper may seem benign, it can be leveraged in targeted attacks or as part of a larger defacement effort. The likelihood of malicious abuse is present, especially in sensitive environments where user experience can significantly influence operational effectiveness. However, occurrences of this behavior being directly weaponized are relatively rare in comparison to other attack vectors.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques may include disabling PowerShell logging or using other scripting tools to change wallpaper settings without detection. The effectiveness of this detection relies on enabling Script Block Logging. Legitimate activities that could trigger this alert include direct IT support actions for branding purposes or user customization changes following corporate events. A related detection to strengthen coverage could involve monitoring for other registry changes under `HKEY_CURRENT_USER\Control Panel`, especially unexpected modifications to the `WallPaper` value.

