note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell to query and gather information about attached peripheral devices using the `Win32_PnPEntity` class. Attackers often utilize this information-gathering technique to enumerate hardware components, which can facilitate further malicious activities such as lateral movement or privilege escalation. The relevant MITRE ATT&CK tactic is **Discovery** (TA0007), specifically the technique **System Information Discovery** (T1120).

  The primary telemetry sources include PowerShell logs with Script Block Logging enabled. The detection indicates the potential for reconnaissance activities within the environment. However, it does NOT confirm malicious intent on its own, as legitimate administrative scripts may trigger similar behavior.

  ### Investigation Steps

  - **Review the PowerShell command context:** Check for the execution context in the PowerShell log events (Event ID 4104). Look at the user account and the script execution history to determine if the command was executed by a legitimate admin user during maintenance.

  - **Correlate with other system activity:** Look for accompanying events around the same timestamp, such as process creation events (Event ID 4688) showing PowerShell execution. If the querying is part of a larger orchestration, this could indicate malicious intent.

  - **Identify running scripts:** Search for other PowerShell logs that may display unusual script names or parameters being used. Legitimate PowerShell usage would typically involve well-documented and standardized scripts often found in common admin directories.

  - **Check for persistence mechanisms:** Investigate if there are established connections to known adversary infrastructure or if the querying has resulted in unexpected changes in device states. This can be seen in Event ID 20001 of Sysmon for a newly created or modified driver.

  - **Validate against threat intelligence:** Utilize threat intelligence feeds to see if the querying patterns align with known adversary behaviors or if any specific threat actor employs this approach extensively.

  ### Prioritization

  This alert has a **low severity** in an enterprise context due to its detection of potential reconnaissance behavior which might often be legitimate administrative activity. However, vigilance is needed as it may also serve as a precursor to malicious activity, especially if associated with further anomalous behavior.

  ### Blind Spots and Assumptions

  Detection may be limited as users frequently run PowerShell for legitimate reasons, especially system administrators; thus, false positives are common. Script Block Logging needs to be enabled to ensure reliable detection. Additionally, unusual legitimate activities, such as device maintenance or hardware inventory, may trigger this alert. Monitoring for adjacent techniques, like **File and Directory Discovery** (T1083), could provide enhanced visibility into potentially adversarial behavior.

