note: |
  ### Technical Context
  This detection rule identifies instances where PowerShell scripts utilize the `Win32_PnPEntity` class to gather information about peripheral devices connected to a Windows computer. Attackers may leverage this information to identify potential targets for further exploitation or to gather intelligence for post-exploitation activity. This could be indicative of reconnaissance activities as part of a wider attack strategy, where understanding the hardware configuration can inform subsequent lateral movement or privilege escalation attempts.

  The relevant MITRE ATT&CK technique for this detection is "System Information Discovery" (T1120). This technique falls under the "Discovery" tactic, highlighting an attacker's attempt to understand the environment better. Primary logs to review in this context include PowerShell script logs, specifically those captured when Script Block Logging is enabled, as they provide insight into the PowerShell commands executed on the system and any related outputs.

  ### Investigation Steps
  - **Review PowerShell Logs:** Investigate PowerShell script logs for any instances where commands related to `Win32_PnPEntity` were executed. Ensure that script block logging is enabled to capture detailed command instances.

  - **Analyze Process Creation Events:** Check for the processes created as a result of the PowerShell commands. Look for unusual parent-child process relationships, which might indicate compromise.

  - **Correlate with System Logs:** Cross-reference findings with system event logs to identify any corresponding logins or changes in user privileges that could provide context to the PowerShell execution.

  - **Investigate Contextual Data:** Assess any related output that may indicate device enumeration for unusual patterns, especially in organizational environments with strict asset management practices.

  ### Prioritization
  This alert is considered low priority in an enterprise environment primarily due to the prevalence of legitimate administrative tasks that may trigger similar behavior. However, continuous monitoring is encouraged as recurring patterns could signify potential reconnaissance efforts or early stages of a more significant compromise.

  ### Blind Spots and Assumptions
  A potential blind spot in this detection could arise from environments where script block logging is not enabled, resulting in the complete omission of relevant data. The detection logic assumes that any usage of `Win32_PnPEntity` within PowerShell is malicious, whereas this might also be legitimate administrative activity. Furthermore, to ensure the alert functions as intended, script block logging must indeed be enabled across all relevant systems for comprehensive visibility into PowerShell usage.

