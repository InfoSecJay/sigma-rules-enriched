note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module that initializes the function `Get-VMRemoteFXPhysicalVideoAdapter`. This behavior is associated with potential exploitation of the `RemoteFXvGPUDisablement.exe`, which has known vulnerabilities allowing for module load-order hijacking. The likely attacker objective is to execute malicious code under the guise of legitimate PowerShell functions, potentially leading to unauthorized access or system manipulation.

  This detection is relevant to the MITRE ATT&CK framework, specifically under the tactic of "Defense Evasion" (ID: TA0042) and the technique of "Signed Binary Proxy Execution" (ID: T1218). The primary telemetry source is PowerShell script logs, particularly those tracking script block execution. A successful exploit could enable attackers to bypass security controls and gain persistent access to the affected system. It is important to note that this detection does NOT confirm malicious intent or successful exploitation on its own.

  ### Investigation Steps

  - **Check PowerShell logs for script blocks:** Review PowerShell logs for Event ID 4104 to find instances of the detected script block text. Compare the timestamps with system activity to correlate actions.

  - **Identify the execution context:** Determine the user context under which the PowerShell command was executed by looking at Event ID 4648 (Logon attempt using explicit credentials). This can highlight whether the execution is abnormal.

  - **Verify against expected behavior:** Examine running scripts and modules using `Get-Module` to identify any legitimate usage of `Get-VMRemoteFXPhysicalVideoAdapter`. Legitimate activity may include expected user behavior related to virtualization management.

  - **Analyze network connections:** Check for unusual outbound connections that may correlate with the execution timings using Firewall logs or tools like EDR solutions. This can indicate potential data exfiltration or command-and-control communications.

  - **Detect high-confidence indicators:** Look for other suspicious script block patterns or unusual process creations (Event ID 4688) immediately following the detected entry, focusing on those involving PowerShell or known malicious binaries.

  - **Review impact on virtualization infrastructure:** If the host is critical for running virtual machines, evaluate the impact of such an exploit on virtual environments, which may lead to compromised VM resources or unauthorized access to sensitive data.

  ### Prioritization

  This alert signifies high severity due to the potential impact on critical virtualization infrastructure and the likelihood of exploitation through known vulnerabilities. Given that execution patterns often align with malicious intent, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  This detection can be limited by evasion techniques such as obfuscation of PowerShell scripts or execution of benign scripts under abnormal contexts. Reliable detection requires enabling PowerShell script logging and module logging. Legitimate activities such as VM management could trigger this alert, creating potential false positives. A related detection for comprehensive coverage would include monitoring for abnormal process creation involving PowerShell scripts that execute in conjunction with this PowerShell module signature.

