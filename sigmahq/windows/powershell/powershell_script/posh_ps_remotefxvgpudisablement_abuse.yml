note: |
  ### Technical Context
  This detection rule identifies instances of PowerShell module creation where the module contents are initialized with a specific function, "Get-VMRemoteFXPhysicalVideoAdapter". This behavior may indicate an attacker's attempt to exploit vulnerabilities associated with the "RemoteFXvGPUDisablement.exe" binary, particularly through load-order hijacking techniques. Attackers employ this method to gain unauthorized control or disrupt virtual GPU functionality, which could lead to privilege escalation or evasion of security measures.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005) as it relates to techniques such as **Signed Binary Proxy Execution** (T1218). This emphasizes the potential for attackers to masquerade their activities within legitimate system processes.

  For adequate detection, primary data sources to consider include PowerShell execution logs which capture script block invocation, along with process creation events that can provide contextual information about new scripts being run in the environment.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell execution logs for instances where the script block text matches the identified function. Pay special attention to the context of execution and user accounts involved.
  - **Analyze Process Creation Events**: Investigate Windows Event Logs for process creation events that coincide with the detection time frame, particularly focusing on processes related to PowerShell and RemoteFX binaries.
  - **Correlate with Active Directory Logs**: Look for any unusual activity in Active Directory, especially attempts to manipulate virtual machines or modify GPU-related settings which could indicate a broader exploitation attempt.
  - **Examine System Integrity**: Ensure that the integrity and configuration of the RemoteFXvGPUDisablement.exe binary have not been altered. Check for unexpected modifications or unusual file paths associated with PowerShell scripts.

  ### Prioritization
  Given the potential impact of privilege escalation and the obfuscation of malicious activities through legitimate binary use, this alert carries high severity within an enterprise environment. The likelihood of exploitation through these tactics makes it imperative to prioritize investigation.

  ### Blind Spots and Assumptions
  The detection logic may not account for all methods of execution or other legitimate use cases of the "Get-VMRemoteFXPhysicalVideoAdapter" function, which can lead to false positives. It assumes that the PowerShell logging is adequately enabled and that event retention covers the relevant time frames. Any gaps in retrospective scanning or monitoring of PowerShell activity could hinder detection capabilities. Additionally, the absence of specific logging for file and module auditing could mean missing indicators of compromise.

