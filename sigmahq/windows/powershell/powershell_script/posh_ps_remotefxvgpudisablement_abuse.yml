note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell module with the specific content inscription of the function `Get-VMRemoteFXPhysicalVideoAdapter`. This behavior indicates potential abuse of the `RemoteFXvGPUDisablement.exe`, which could be exploited in attacks leveraging module load-order hijacking techniques. The likely attacker objective is to execute malicious code or manipulate system settings by leveraging trusted binaries in an unauthorized manner.

  This detection aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1218 (Signed Binary Proxy Execution). The primary telemetry sources are PowerShell logs, specifically those that capture script execution events, such as PowerShell script block logging. If successful, this behavior can result in unauthorized access or misuse of the system’s graphics virtualization layer. Notably, this detection alone does not confirm malicious intent; it merely indicates that a specific PowerShell module has been invoked with atypical content that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review PowerShell ScriptBlock Logs:** Examine the relevant PowerShell logs (Event ID 4104) for script block logging. Look for entries starting with `function Get-VMRemoteFXPhysicalVideoAdapter` and identify the caller's context (user account and session).

  - **Check for Process Creation Events:** Cross-reference the detection with Windows Security Event ID 4688 (Process Creation) logs. Validate if `RemoteFXvGPUDisablement.exe` was executed around the same time as the suspicious PowerShell module invocation.

  - **Investigate Parent Process Relationships:** Determine the hierarchical relationship of processes. Legitimate usage typically involves administrative scripts initiated by trusted system processes. Check for unusual parent-child process trees, especially if initiated from non-administrative user sessions.

  - **Identify Command Line Arguments:** Analyze the command line arguments of the executed PowerShell scripts (from Event ID 4688 or Sysmon Event ID 1) to identify any further suspicious manipulations or indicators that would suggest malicious intent.

  - **Validate Known Good Behavior:** Document if `RemoteFXvGPUDisablement.exe` has been appropriately invoked within your environment for legitimate maintenance or updates. If a legitimate admin initiates it, the context should reflect authorized times and purposes.

  - **Correlate with Other Detections:** Leverage related detections like the ProcCreation or PS Classic detections to find overlapping indicators that may strengthen the evidence of malicious activity or identify broader exploitation patterns.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact on system integrity, especially within enterprise environments relying on graphics virtualization. There is a moderate likelihood of malicious abuse given the specific technique and its ability to compromise trusted execution paths. This behavior, while not commonly weaponized in all occasions, presents significant risks when leveraged by skilled adversaries.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for evasion via legitimate administrative actions using the same PowerShell module without malicious intent. Reliable detection requires proper configuration of PowerShell script block logging, and environmental baselines must be established to differentiate between legitimate and malicious activity. It is essential to monitor for similar behaviors from PowerShell logs to improve coverage—related detections like the ProcCreation alerts that capture unusual process behaviors should be implemented to enhance the detection strategy.

