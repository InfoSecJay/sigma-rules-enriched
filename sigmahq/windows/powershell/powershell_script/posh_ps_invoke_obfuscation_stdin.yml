note: |
  ### Technical Context

  This Sigma rule detects obfuscated usage of stdin to execute PowerShell commands, specifically searching for instances where the command includes manipulative input or is executed with parameters like '/c' or '/r'. The likely objective of an attacker is to execute malicious PowerShell scripts while avoiding detection mechanisms that typically monitor straightforward command execution patterns. This behavior aligns with the MITRE ATT&CK framework under the tactics of Defense Evasion (Tactics: TA0005) and Execution (Tactics: TA0002), particularly techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry source for this detection is Windows PowerShell scripts, specifically those that can generate logs related to script block execution. This may include Windows event logs generated with Event ID 4104 when script block logging is enabled. If confirmed malicious, this behavior could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent solely based on the use of obfuscation or stdin, as legitimate scripts may use similar methods for benign purposes.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs:** Review Windows Event Log for Event ID 4104. Investigate any script blocks that show suspicious use of stdin with parameters such as '/c' or '/r'. Malicious examples may include complex obfuscation patterns that attempt to call PowerShell with input redirection.

  - **Validate PowerShell Session Activity:** Examine PowerShell's command history using Get-History command or check logs for suspicious commands executed immediately before the detection event. Look for commands that invoke obfuscated scripts or manage file handles unusually.

  - **Inspect for Legitimate Use Cases:** Identify whether legitimate processes or scripts executed PowerShell with similar obfuscation techniques. For example, administrative automation scripts that use PowerShell for legitimate system management may also appear in logs.

  - **Correlate with Network Traffic Analysis:** If possible, check for outbound connections initiated by the PowerShell process. Use network logs to ensure that no unauthorized HTTP(S) connections or data exfiltrations occur following the obfuscated launch.

  - **Identify Suspicious Command Patterns:** Document any detected patterns that are not typical for normal operations, such as excessive use of bits of extraneous characters (e.g., excessive quotes or comments). This might suggest deliberate obfuscation.

  ### Prioritization

  This alert is of high severity, as it indicates potential attempts to execute malicious PowerShell commands on Windows systems, which are frequently targeted for exploitation. Given the capabilities of PowerShell combined with obfuscation techniques, the likelihood of malicious abuse is significant, as this method is commonly observed in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  This detection is limited by possible evasion techniques, as skilled attackers may use legitimate scripts or benign functions to evade detection. Reliable detection hinges on the configuration of Windows PowerShell script block logging, which is not universally enabled by default. Additionally, benign automated scripts for configuration management or maintenance may inadvertently trigger this rule. A companion detection that could enhance coverage is monitoring for anomalous PowerShell process execution patterns through Sysmon Event ID 1, capturing process creation events for enhanced context.

