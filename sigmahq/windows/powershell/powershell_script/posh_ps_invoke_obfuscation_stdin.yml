note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands through standard input (stdin), which indicates an attempt to evade detection by concealing the true command being executed. The typical attacker objective is to execute malicious scripts while avoiding analysis, often leveraging obfuscation techniques to make the command difficult to understand. This behavior maps to the MITRE ATT&CK technique T1059.001 (PowerShell).

  Primary telemetry sources include Windows PowerShell logs (specifically Event ID 4104 capturing script block logging), which must be enabled for effective detection. If malicious, this activity could lead to system compromise, data exfiltration, or lateral movement. Importantly, this detection alone does NOT confirm the execution is malicious; it indicates obfuscated command use requiring further investigation.

  ### Investigation Steps

  - **Review PowerShell scripts for obfuscation patterns:** Check Event ID 4104 for ScriptBlockText containing the regex pattern 'cmd.{0,5}(?:/c|/r).+powershell.+(?:\$?\{?input\}?|noexit).+". Analyze the structure for signs of obfuscation.

  - **Analyze the command's context:** Cross-reference Event ID 4688 (Process Creation) to identify the parent process and arguments. Look for unusual parent processes (e.g., cmd.exe or wscript.exe) that may correlate with malicious behavior.

  - **Correlate with known good configurations:** Verify if the behavior aligns with legitimate administrative tasks typically using the command line, such as patching or troubleshooting procedures. Reputable activities should not exhibit substantial obfuscation.

  - **Identify high-confidence malicious indicators:** Look for patterns indicating a known threat actor, such as frequent execution of obfuscated commands targeting specific files or systems, especially if occurring outside normal administrative hours.

  - **Check for lateral movement or persistence indicators:** Review for indicators of compromise (IOC) such as unauthorized task scheduler events (Event ID 4698) or new service creation (Event ID 7045) coinciding with detected obfuscation instances.

  ### Prioritization

  This alert is considered high severity due to the potential impact on enterprise systems if successful, as obfuscated PowerShell commands are a common tactic employed by attackers to maintain persistence and execute further malicious actions. The likelihood of malicious abuse is significant, as many adversaries leverage this technique in their operations.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using other means of executing PowerShell without writing scripts or through trusted applications. Script Block Logging must be enabled for effective monitoring; if it’s turned off, this rule will not trigger. Legitimate system maintenance routines involving heavy PowerShell usage may trigger the alert, necessitating contextual awareness for accurate triage. The companion detection of Event ID 4103 (Script Block Logging - invocation) can enhance coverage against obfuscation techniques in PowerShell usage.

