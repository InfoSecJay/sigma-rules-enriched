level: high
note: |
  ### Technical Context
  This detection rule identifies the obfuscated usage of PowerShell through standard input (stdin), which is a common technique employed by threat actors to evade detection mechanisms. Attackers often utilize obfuscation methods to hide malicious commands within legitimate-looking PowerShell scripts, allowing them to execute commands covertly. This behavior can signal potential malicious activity, as it may indicate an attempt to compromise a system or exfiltrate data while bypassing security controls.

  The typical threat scenario involves attackers leveraging obfuscated PowerShell commands to establish persistence, facilitate lateral movement, or execute payloads on compromised systems. By employing techniques like these, attackers seek to reduce the visibility of their actions within the network and evade traditional defenses.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (TA0005)**: Techniques that obfuscate actions or software.
  - **Execution (TA0002)**: Particularly **PowerShell (T1059.001)**, used for executing scripts and commands, and **Obfuscated Files or Information (T1027)**, which pertains to obfuscation practices aimed at bypassing detection.

  Primary data sources for this detection include process creation events and PowerShell script block logs, specifically where Script Block Logging is enabled, which is crucial for capturing the intended obfuscated command patterns.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logs for any entries matching the obfuscation pattern indicated by the detection rule. This is where obfuscated commands will be captured if logging is enabled.
  - **Analyze Process Creation Events**: Check for newly created processes that involve PowerShell, particularly focusing on command line arguments that may reveal 'cmd' usage combined with 'powershell' execution.
  - **Inspect Endpoint Activity**: Look into the endpoint's behavior for any malicious activity around the time of the alert. Investigate if any unauthorized software or scripts were executed.
  - **Cross-Reference with Threat Intel**: Utilize threat intelligence data to check if the hash of any suspicious executables or scripts aligns with known malware or attack vectors that utilize obfuscation techniques.

  ### Prioritization
  The alert's high severity is justified due to the potential impact of obfuscated PowerShell usage, which can lead to significant compromise of enterprise environments. Given the likelihood of attackers employing such techniques to breach defenses and execute malicious activities, timely investigation is critical.

  ### Blind Spots and Assumptions
  This detection may have coverage gaps if script block logging is not enabled or adequately configured on all systems, as the detection relies heavily on the availability of these logs. Additionally, the logic assumes that the obfuscation patterns specified will capture all instances of malicious behavior that match such criteria, potentially missing variations of obfuscation methods. Ensuring comprehensive logging and monitoring of PowerShell activities is essential for the effectiveness of this alert.

