  ---

  ### Technical Context

  This rule detects obfuscated PowerShell commands that utilize STDIN for execution, specifically through the use of `cmd.exe` invoking PowerShell. Attackers often aim to execute malicious scripts or commands undetected by security mechanisms through obfuscation techniques, with the objective of maintaining persistence or executing payloads within the environment. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1059.001) and Defense Evasion (T1027).

  The primary telemetry source is Windows PowerShell logs, specifically Script Block Logging (Event ID 4104), which must be enabled for effective detection. If malicious, this activity could facilitate unauthorized access or control over systems. It is important to note that this detection alone does not confirm that a successful attack occurred; it merely highlights the presence of obfuscated command execution.

  ---

  ### Investigation Steps

  - **Check Script Block Logs**: Review Windows Event ID 4104 logs for entries matching the regex pattern that the Sigma rule detects (e.g., `cmd.{0,5}(?:/c|/r).+powershell...`). Look for obfuscated commands and any references to potentially malicious PowerShell scripts.

  - **Identify Context Today**: Examine the user context for the execution of the command, focusing on the user account that initiated it. Determine if it's a known administrative account or a service account typically involved in automation.

  - **Review PowerShell Execution Policies**: Validate the PowerShell execution policies on the machine (Event ID 400) to check if they are set in a way that aligns with organizational policy (e.g., restricted or all signed). Look for deviations that might indicate an unsafe environment.

  - **Correlate with Network Activity**: Investigate any subsequent network connections, particularly to unfamiliar external IPs or domains, correlated with the timestamps of the detected event. Utilize proxy logs or firewall rules to assess outbound connectivity.

  - **Legitimate Use Cases**: Contrast the findings against known benign uses of PowerShell, such as automated processes or administrative scripts, confirming expected command structures and sources.

  - **Enrichment with Threat Intelligence**: Cross-reference the observed command strings against threat intelligence sources. Look for matches with known malicious indicators or techniques.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on critical enterprise systems. Obfuscation techniques are frequently utilized by adversaries to evade detection; thus, the likelihood of malicious abuse is significant, making this behavior a common tactic in sophisticated attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be bypassed by advanced adversaries using diverse obfuscation techniques or by disabling Script Block Logging. Ensure that it is adequately configured in your environment to maintain comprehensive logging capabilities. Legitimate administrative actions or scripting use cases could trigger the alert, necessitating careful context evaluation. A companion detection could include monitoring for atypical PowerShell command executions or abnormal JSON outputs in Event ID 4104 logs to improve detection fidelity.

