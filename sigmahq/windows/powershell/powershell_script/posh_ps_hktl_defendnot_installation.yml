note: |
  ### Technical Context

  This Sigma rule detects the execution of a PowerShell one-liner that downloads and runs the Defendnot script from a remote URL, specifically targeting the modification of Windows Defender settings. The primary objective of an attacker using this tool is to disable Windows Defender, thereby impairing the host's ability to detect and respond to malware. This behavior correlates with the MITRE ATT&CK technique “Application Layer Protocol” (T1685) under the tactic of "Defense Evasion." The primary telemetry source for this detection is PowerShell script logs, specifically those capturing script block text. If malicious, the impact is significant as it enables persistence and further exploitation of the system by disabling crucial endpoint defenses. Importantly, this detection alone does not confirm successful malicious activity; it only identifies the execution of a potentially harmful command.

  ### Investigation Steps

  - **Verify PowerShell command execution:** Check Windows PowerShell logs (Event ID 4103) for ScriptBlockText containing "https://dnot.sh/" and "/defendnot". Confirm the execution matches observed alert details.

  - **Identify execution context:** Review the process details that initiated the PowerShell command. Look for unusual parent processes (e.g., RunDll32.exe or suspicious script files) in Event ID 4688 (Process Creation) logs.

  - **Validate legitimate PowerShell usage:** Note that internal teams may use PowerShell for legitimate updates or installations. Look for logged scripts or scheduled tasks with origins that correlate with organizational management activity, such as IT deployments.

  - **Correlate outbound URL access:** Inspect web proxy or firewall logs to identify if there was an outbound connection to "https://dnot.sh" or GitHub URL patterns. Check HTTP request methods (e.g., GET) and timestamps aligning with the PowerShell execution.

  - **Review antivirus/malware settings:** Check for any modifications to Windows Defender settings via Security Event ID 5007 (Windows Defender Operational) logs. This can indicate attempts to disable defenses that the tool would enable.

  - **Search for further indicators of compromise:** Investigate for additional artifacts associated with Defendnot, including related file creations in %TEMP% and potential registry alterations under "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" for fake antivirus installations.

  ### Prioritization

  This alert is of high severity due to the potential impact on enterprise environments. The affected systems often hold critical data, and the likelihood of this specific behavior being malicious is high. Tools like Defendnot are commonly weaponized in targeted attacks to disable security mechanisms, increasing the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection may have limitations if PowerShell logging is misconfigured or disabled, making it difficult to capture relevant data consistently. Legitimate administrative activities may also trigger this alert, leading to potential false positives. A related detection, such as "Malicious PowerShell Command Execution" (id: 0aaa9689-9f38-491d-bd4d-a9af6eb43138), can help strengthen coverage and provide additional context for suspicious PowerShell usage.

