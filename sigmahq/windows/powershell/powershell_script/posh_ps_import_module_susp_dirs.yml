logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Import-Module "$Env:Temp\'
    - Import-Module '$Env:Temp\
    - 'Import-Module $Env:Temp\'
    - 'Import-Module "$Env:Appdata\'
    - Import-Module '$Env:Appdata\
    - 'Import-Module $Env:Appdata\'
    - 'Import-Module C:\Users\Public\'
            # Import-Module alias is "ipmo"
    - 'ipmo "$Env:Temp\'
    - ipmo '$Env:Temp\
    - 'ipmo $Env:Temp\'
    - 'ipmo "$Env:Appdata\'
    - ipmo '$Env:Appdata\
    - 'ipmo $Env:Appdata\'
    - 'ipmo C:\Users\Public\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell commands that import modules from known suspicious directories, such as `Temp` and `Appdata`, which are frequently utilized by threat actors to execute malicious code. The likely objective of such behavior includes execution of payloads for further compromise, data exfiltration, or establishing persistence on a compromised system. Relevant MITRE ATT&CK tactics are Execution (TA0040) and PowerShell (T1059.001). Primary telemetry sources include Windows PowerShell Script Block Logging, which is necessary to capture the specific command line arguments and module paths being executed. If malicious, this could lead to significant security impacts, including unauthorized access to system resources or data loss. Notably, this detection alone does NOT confirm that the execution is malicious, as importing modules from these directories can also occur due to legitimate use in certain scenarios.

  ### Investigation Steps

  - **Check the context of the PowerShell command: **Review the recorded PowerShell commands for Event ID 4104 in the Windows Event Log to determine the specific command and its parameters. Look for unusual or non-standard module names that do not appear in typical enterprise use.

  - **Identify the process parentage: **Review the process tree leading to the PowerShell execution (using Sysmon Event ID 4688) to establish whether the originating process (e.g., cmd.exe, wscript.exe) is a known legitimate application or possibly a suspicious one.

  - **Correlate with user behavior: **Examine the user account that executed the PowerShell command (Event ID 4624) to see if it matches expected operational patterns. Look for evidence of unusual account activity during this time frame.

  - **Assess legitimate activity: **Compare the discovered behavior against known good examples of PowerShell usage within your environment to see if importing from these locations is consistent with typical usage patterns for your organization or if it deviates significantly.

  - **Establish presence of malicious indicators: **Look for specific known malicious module names or suspicious functions being called within the imported modules. Cross-reference these with threat intelligence feeds to identify potential malware signatures.

  ### Prioritization

  While this alert has medium severity, its impact is dependent on the context of the involved system and user. Systems with elevated privileges or critical business functions can become a high-value target for attackers. The likelihood of malicious abuse is moderate, as the usage of `Temp` and `Appdata` for module imports is a common tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by disabled Script Block Logging, making this behavior undetectable under certain circumstances. Legitimate PowerShell scripts may use these directories for valid purposes, thus generating false positives. Additionally, if an attacker uses obfuscated or encrypted commands, they may evade detection. A related detection worth monitoring is the use of common administrative tools such as PsExec, which might indicate lateral movement in conjunction with suspicious PowerShell activity.

