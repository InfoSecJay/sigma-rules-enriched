logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Import-Module "$Env:Temp\'
    - Import-Module '$Env:Temp\
    - 'Import-Module $Env:Temp\'
    - 'Import-Module "$Env:Appdata\'
    - Import-Module '$Env:Appdata\
    - 'Import-Module $Env:Appdata\'
    - 'Import-Module C:\Users\Public\'
            # Import-Module alias is "ipmo"
    - 'ipmo "$Env:Temp\'
    - ipmo '$Env:Temp\
    - 'ipmo $Env:Temp\'
    - 'ipmo "$Env:Appdata\'
    - ipmo '$Env:Appdata\
    - 'ipmo $Env:Appdata\'
    - 'ipmo C:\Users\Public\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of PowerShell scripts that import modules from suspicious directories, such as `%Temp%`, `%AppData%`, and `C:\Users\Public\`. Such behavior typically indicates potential malicious activity or a compromised system, as attackers may leverage these directories to execute malicious scripts without raising immediate suspicion. The likely attacker objectives include executing arbitrary code, maintaining persistence, or stealing sensitive information.

  The relevant MITRE ATT&CK tactics/techniques are:
  - Execution (T1059.001: Powershell), which involves the use of PowerShell scripts to run malicious commands.
  - Persistent access may also be created via these imported modules.

  Primary data sources for detection include PowerShell script block logging, which captures the execution of PowerShell commands and scripts, providing critical visibility into the actions taken by both legitimate and malicious actors in an environment.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell script block logs to identify specific instances of commands that import modules from the specified directories. Look for entries that match the alerting criteria.
  - **Analyze Suspicious Scripts**: If malicious imports are detected, retrieve the related PowerShell scripts for analysis. Focus on understanding their capabilities and intentions.
  - **Correlate Timeline**: Investigate the timeframes of detected imports against other suspicious activities in your environment, such as unusual account logins or unauthorized changes to files.
  - **Assess Execution Context**: Determine the context in which these PowerShell commands ran, including identifying the user account and associated processes to understand the scope and origin of the potential compromise.

  ### Prioritization
  The alert's severity is medium due to the potential for significant impacts associated with arbitrary code execution and persistence mechanisms employed by attackers. While not every instance indicates a compromise, the likelihood of exploitation from suspicious PowerShell activity necessitates a timely response.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if script block logging is not enabled on all systems, as the rule relies on this logging to capture relevant PowerShell commands. The detection assumes that the threat actor will not obfuscate or disguise their command-line activity, which may not always be the case. Additionally, if organizations only monitor a subset of user accounts or endpoints, there could be a risk of missing critical alerts from compromised machines.

