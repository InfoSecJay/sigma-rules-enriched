logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_basic:
    ScriptBlockText|contains: 'Get-Keystrokes'
  selection_high:   # want to run in background and keyboard
    ScriptBlockText|contains|all:
    - 'Get-ProcAddress user32.dll GetAsyncKeyState'
    - 'Get-ProcAddress user32.dll GetForegroundWindow'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_keylogging/info.yml
note: |
  ### Technical Context

  The rule detects the execution of PowerShell scripts that include keylogging functionality, specifically those that utilize methods to intercept user keystrokes, such as `Get-AsyncKeyState` and `Get-ForegroundWindow`. The likely attacker objective is to capture sensitive user information, including credentials, as they are typed. This activity is relevant to the MITRE ATT&CK tactic of Credential Access (T1056.001: Keylogging). Primary telemetry sources include PowerShell script block logs, which must have script block logging enabled. If malicious, this behavior could lead to unauthorized access and exploitation of user credentials. This detection does NOT confirm that keystrokes were successfully captured or that the malware executed as intended; it only indicates an attempt to implement keylogging.

  ### Investigation Steps

  - **Review relevant PowerShell logs:** Check Windows Event ID 4104 for any script block logging events containing 'Get-Keystrokes'. Compare the script's execution context with expected authorized tasks to identify discrepancies in execution.

  - **Analyze process invocation history:** Use Sysmon Event ID 4688 to trace the command line of PowerShell processes related to user activity. Look for instances that exhibit unusual argument structures or are executed by non-standard processes.

  - **Validate expected behavior:** Confirm normal PowerShell usage patterns for the affected user or asset to differentiate between benign execution of scripts (e.g., IT automation scripts) versus suspicious ones leveraging keylogging techniques.

  - **Correlate with user activity:** Investigate any related Event IDs (e.g., 4624 for logon events) during the same timeframe as the script execution. Legitimate logons without concurrent access to keylogging scripts may indicate benign activity.

  - **Identify malicious indicators:** Look for evidence of the malicious payload, specifically searches for 'Get-ProcAddress user32.dll GetAsyncKeyState' in the Event ID logs. If found, this should be treated as a high-confidence malicious indicator.

  ### Prioritization

  This alert carries medium severity due to the potential impact on credential theft and system integrity, especially on critical assets or user accounts. The likelihood of malicious abuse is high, as keylogging is a well-established tactic used in various exploits. This behavior is commonly weaponized by adversaries to gain unauthorized access to sensitive systems.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using obfuscated scripts, which may not trigger warning logs. Reliable detection requires script block logging specifically enabled in PowerShell settings. Legitimate applications or administration tasks that may invoke similar PowerShell scripts could result in false positives. A related detection is monitoring for unusual network connections from the PowerShell process, which could indicate data exfiltration after credentials are captured.

