logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_basic:
    ScriptBlockText|contains: 'Get-Keystrokes'
  selection_high:   # want to run in background and keyboard
    ScriptBlockText|contains|all:
    - 'Get-ProcAddress user32.dll GetAsyncKeyState'
    - 'Get-ProcAddress user32.dll GetForegroundWindow'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts employing the `Get-Keystrokes` function or making calls to user32.dll functions that capture keystrokes. This behavior is indicative of keylogging, which adversaries use for intercepting sensitive information such as credentials. Relevant MITRE ATT&CK tactics include Credential Access (T1056.001) and Collection (T1218), as this technique focuses on harvesting user input with malicious intent. The primary telemetry source for this detection is Windows Script Block Logging, which must be enabled for effective monitoring. A successful keylogger deployment can lead to unauthorized access to systems and accounts, posing significant security risks. Importantly, this detection alone does not confirm successful keystroke capture or the usage of the logged data in a malicious context.

  ### Investigation Steps

  - **Verify the script content:** Review logs for any instances of PowerShell script execution with Script Block text containing 'Get-Keystrokes' (Log type: Windows PowerShell logs; specific field of interest: ScriptBlockText). Legitimate PowerShell scripts typically do not execute these specific commands.

  - **Examine process creation events:** Check for related process creation using Security Event ID 4688 or Sysmon Event ID 1 to identify the parent processes of suspicious PowerShell scripts. Look for indications of automation or scheduling, which might suggest malicious behavior.

  - **Assess user context:** Review the user and session information where the script execution occurred to determine if it is aligned with acceptable administrative tasks. Unexpected PowerShell script execution by non-privileged users may be indicative of malicious activity.

  - **Confirm PowerShell logging settings:** Validate that Script Block Logging is enabled in the environment (GPO: "Turn on PowerShell Script Block Logging" in Computer Configuration -> Administrative Templates -> Windows Components -> Windows PowerShell). Ensure logging has captured all relevant activities for accurate detection.

  - **Identify external command execution:** Look for additional commands executed in sequence within the same parent process that may correlate with the keylogging behavior, such as calls to `GetAsyncKeyState` or `GetForegroundWindow`. High-confidence malicious indicators include frequent or repetitive calls to these functions alongside configuration changes to run scripts in the background.

  ### Prioritization

  The alert has medium severity due to the potential impact of keylogging on credential theft, which can lead to further compromise within the organization. While the likelihood of malicious abuse is high, particularly in targeted environments, the detection may sometimes trigger under benign administrative actions that utilize PowerShell for legitimate purposes.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of requisite log sources like Script Block Logging, as it must be explicitly enabled and configured in the environment. Legitimate administrative scripts might also trigger this alert, complicating investigation efforts. Additionally, threat actors might obfuscate or rename keylogging scripts to evade detection. Pairing this rule with related detections for process injection techniques (e.g., T1055) can provide enhanced visibility and coverage against multifaceted attack methodologies.

