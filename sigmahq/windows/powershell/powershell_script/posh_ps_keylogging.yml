logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_basic:
    ScriptBlockText|contains: 'Get-Keystrokes'
  selection_high:   # want to run in background and keyboard
    ScriptBlockText|contains|all:
    - 'Get-ProcAddress user32.dll GetAsyncKeyState'
    - 'Get-ProcAddress user32.dll GetForegroundWindow'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential keylogging activity via PowerShell, where adversaries may use scripts to capture user keystrokes, particularly for intercepting credentials as they are typed. The use of scripts like `Get-Keystrokes.ps1` suggests an attempt to gather sensitive information without the user's knowledge, often indicative of credential theft or unauthorized access scenarios. By leveraging PowerShell's capabilities, attackers can implement these keyloggers stealthily, complicating detection efforts.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include "Credential Access" (TA0006) and "Input Capture" (T1056.001). The primary data sources for this detection are PowerShell script block logs, which must be enabled to capture and analyze the contents of executed scripts for suspicious patterns.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check for PowerShell execution logs that contain the script block text for `Get-Keystrokes` or other suspicious commands, particularly within timeframes that correlate with user activity.
  - **Analyze Process Creation Events:** Investigate any process creation events that may relate to PowerShell scripts executing unexpected keystroke logging operations. Focus on parent-child relationship chains that suggest a script was executed by a user shell.
  - **Examine Windows Security Logs:** Look for anomalies in user logins and session activity that coincide with the execution of keystroke logging scripts. Additionally, analyze interactive logon events for potential use of compromised credentials.
  - **Check for Script Block Logging Policy:** Ensure that Script Block Logging is enabled in your environment, as it is crucial to capture malicious PowerShell activity effectively.

  ### Prioritization
  The severity of this alert is medium due to the potential impact on user credentials and sensitive data. Keylogging provides attackers with a direct method to compromise accounts, especially in enterprises where credential theft may lead to broader access and insider threats.

  ### Blind Spots and Assumptions
  This detection rule may not catch all keylogging activities, particularly if attackers use obfuscation techniques to disguise their scripts or if they switch to other scripting languages. Additionally, the detection assumes that Script Block Logging is enabled and properly configured across all systems in the environment. Without these logs, the ability to detect such malicious behavior could be significantly hindered. Furthermore, false positives may occur due to benign usage of similar script patterns in legitimate administrative contexts.

