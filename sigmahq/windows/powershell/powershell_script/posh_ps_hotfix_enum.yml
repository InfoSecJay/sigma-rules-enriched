title: PowerShell Hotfix Enumeration
id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
status: test
description: Detects call to "Win32_QuickFixEngineering" in order to enumerate 
  installed hotfixes often used in "enum" scripts by attackers
references:
- https://github.com/411Hall/JAWS/blob/233f142fcb1488172aa74228a666f6b3c5c48f1d/jaws-enum.ps1
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-21
tags:
- attack.discovery
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Win32_QuickFixEngineering'
    - 'HotFixID'
  condition: selection
falsepositives:
- Legitimate administration scripts
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell scripts that invoke the `Win32_QuickFixEngineering` class to enumerate installed hotfixes on Windows systems. Attackers may employ this technique as part of their reconnaissance efforts to gather information about the system's patch level, which can inform their subsequent exploitation strategies. The relevant MITRE ATT&CK tactic is Discovery (TA0007), with the technique being System Information Discovery (T1082).

  The primary telemetry sources include PowerShell script logging, requiring script block logging to be enabled, and relevant event IDs such as 4104 (for transcription of the PowerShell command). If the activity is malicious, it can expose vulnerabilities present on the system due to unpatched software. However, this detection does NOT confirm any malicious intent on its own, as legitimate administration scripts may also perform this action.

  ### Investigation Steps

  - **Review source of execution**: Check for logged user sessions that executed the PowerShell command. Validate this against the Event ID 4688 (Process Creation) with `ParentImage` of typical PowerShell executables (`powershell.exe`, `pwsh.exe`).

  - **Assess PowerShell logs**: Examine logs for PowerShell Event ID 4104, specifically identifying the script block containing 'Win32_QuickFixEngineering' and 'HotFixID'. Compare the context and execution parameters to known administrative tasks.

  - **Identify concurrent system changes**: Look for Event IDs 5145 (File Share Access) or 4663 (File Access) indicating file modifications or access that coincide with the timing of the script execution. This can indicate if the enumeration was part of a broader malicious operation.

  - **Verify legitimate activity**: Cross-reference the user who executed the script with typical administrative accounts. If it's a known administrative task, record the context in which the script was executed.

  - **Look for additional exploitation indicators**: Check for subsequent process entries or network connections initiated shortly after this event that may indicate further malicious behavior, such as Event ID 5156 (Windows Filtering Platform) logs showing traffic to suspicious external IPs.

  - **Check for known script behavior**: Reference community repositories (e.g., GitHub) for common enumeration scripts that utilize `Win32_QuickFixEngineering` and assess if the observed script matches patterns found in malicious examples.

  ### Prioritization

  This alert has a medium severity due to the potential exploitation of unpatched vulnerabilities if a legitimate attack is underway. Since it involves reconnaissance behavior, the likelihood of malicious use is moderate but significant, emphasizing the need for verification of context.

  ### Blind Spots and Assumptions

  This detection may miss instances where script block logging is disabled or misconfigured, leading to false negatives. Legitimate administrative tasks may also trigger this alert, particularly when IT staff engage in script-based patch management. A related detection to consider is the recognition of abnormal account usage patterns (e.g., script execution outside of expected hours) to strengthen alert coverage.

