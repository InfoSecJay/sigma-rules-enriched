title: PowerShell Hotfix Enumeration
id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
status: test
description: Detects call to "Win32_QuickFixEngineering" in order to enumerate installed
  hotfixes often used in "enum" scripts by attackers
references:
- https://github.com/411Hall/JAWS/blob/233f142fcb1488172aa74228a666f6b3c5c48f1d/jaws-enum.ps1
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-21
tags:
- attack.discovery
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Win32_QuickFixEngineering'
    - 'HotFixID'
  condition: selection
falsepositives:
- Legitimate administration scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to enumerate installed hotfixes on a Windows system via PowerShell, specifically by leveraging the `Win32_QuickFixEngineering` class. Attackers may use such enumeration techniques to gather information about a target's patch status, aiming to identify potential vulnerabilities for exploitation. Understanding the hotfix state of a system is crucial for attackers seeking to exploit unpatched software or determine the security posture of targeted machines.

  The relevant MITRE ATT&CK tactics and techniques related to this behavior include **Discovery** (T1083 - File and Directory Discovery) and **System Information Discovery** (T1082). This detection can signify pre-attack reconnaissance, where the attacker aims to gather information before executing further attacks.

  The primary data sources for this detection include **PowerShell script logs** (especially those with Script Block Logging enabled), which can capture the executed commands and their parameters, making it possible to detect the suspicious enumeration behavior.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logs for any instances of the command containing `Win32_QuickFixEngineering` and `HotFixID` to verify if the enumeration occurred.
  - **Correlate with Other Logs**: Cross-reference the PowerShell logs with documented administrative scripts executed on the system to distinguish between legitimate and malicious use.
  - **Check User Context**: Investigate the account that triggered the enumeration. Determine if it was a valid administrative user performing routine tasks or if it was an anomaly that requires further scrutiny.
  - **Assess for Related Activity**: Look for additional reconnaissance patterns or privilege escalation attempts associated with the same user or system to determine the broader context of the investigated behavior.

  ### Prioritization
  This alert warrants medium severity because while it could indicate a legitimate administrative action, the potential for reconnaissance by an attacker attempting to exploit unpatched vulnerabilities makes it a relevant concern within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that PowerShell Script Block Logging is enabled; if it is not, there may be blind spots in coverage. Additionally, the detection may generate false positives if legitimate administrative scripts are called that include similar enumeration commands. Ensuring all necessary logging configurations and monitoring are in place is critical to maximizing detection effectiveness.

