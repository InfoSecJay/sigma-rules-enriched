  ---

  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands involving the `Clip.exe` utility, which is commonly used for clipboard manipulation. The behavior suggests that an attacker may be attempting to disguise malicious commands or payloads by using simple clipboard operations to bypass detection mechanisms. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (T1027) and Execution (T1059.001) with a focus on PowerShell scripting.

  The primary telemetry sources include PowerShell script block logs (Event ID 4104), which must be enabled for effective detection. If malicious, the security impact could be significant, potentially leading to data exfiltration or the execution of further malicious code. However, this detection does NOT confirm that malicious activity has occurred without corroborating evidence, as legitimate use of `Clip.exe` could trigger similar alerts.

  ---

  ### Investigation Steps

  - **Verify Script Block Logs: ** Ensure PowerShell Script Block Logging is enabled. This is critical to capture Event ID 4104 and related logs for analysis.

  - **Assess Command Nature: ** Review the specific command captured in Event ID 4104. Look for indications of unusual or complex commands involving `Clip.exe`, which could signify obfuscation or malicious intent.

  - **Contextualize Clipboard Usage: ** Identify legitimate use cases of `Clip.exe` within your organization. Common usage includes copying text to clipboard for application use or user-controlled operations, which should not involve complex obfuscation.

  - **Cross-Reference Execution Context: ** Investigate the parent process of the PowerShell execution (Event ID 4688). Look for indicators of malicious behavior such as execution from unusual paths or processes launching `powershell.exe` in suspicious contexts.

  - **Find Related Artifacts: ** Check for evidence of file creation or anomalous network activity that aligns with clipboard manipulation, such as unusual data being copied and sent out from the host.

  - **Identify Malicious Indicators: ** Look for patterns of execution involving obfuscated PowerShell commands in a historical context. High-confidence malicious indicators might include unusual command structures or heavily obfuscated script tests indicating an attack.

  ---

  ### Prioritization

  This alert is high severity due to the implications of using obfuscated PowerShell. Systems involved with clipboard activities are often user-critical. Obfuscated commands are frequently utilized in real-world attacks to evade detection, elevating the likelihood of malicious intentions.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion tactics such as changes to user permissions or the execution of scripts intended to mimic legitimate commands. Reliable detection requires that PowerShell script block logging is enabled across all relevant endpoints. Legitimate usage can include automated processes that manipulate clipboard contents, which could inadvertently trigger this alert. Monitoring of additional companion detections, such as script execution anomalies or unexpected parent process behaviors, reinforces the overall security posture.

