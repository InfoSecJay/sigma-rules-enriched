note: |
  ### Technical Context

  The Sigma rule detects the execution of obfuscated PowerShell scripts that utilize the `clip.exe` utility, a method often employed by attackers to exfiltrate sensitive information from the clipboard. This indicates potential malicious behavior aimed at data theft or remote command execution. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) and Use of Obfuscated Files or Information (T1027). The primary telemetry source required for effective detection is Windows PowerShell Script Block Logging, specifically monitoring for ScriptBlockText that contains specific regex patterns, which point to the misuse of `clip.exe`.

  If confirmed as malicious, this behavior could lead to unauthorized data access or loss. However, the detection on its own does not confirm whether the intent was malicious, as legitimate applications may also use similar PowerShell commands.

  ### Investigation Steps

  - **Review PowerShell Script Block logs:** Check for Event ID 4104 in Windows Event Logs, focusing on ScriptBlockText entries containing patterns like `echo.*clip.*&&.*(Clipboard|i`?n`?v`?o`?k`?e`?)`. Document the command context and parameters for further analysis.

  - **Identify clipboard usage patterns:** Evaluate historical usage of `clip.exe` across critical assets. Legitimate usage might include script tagging for data transfer or benign clipboard operations. Compare normal behavior with discovered logs.

  - **Correlate with clipboard data manipulations:** Look for relevant events indicating clipboard modifications around the same time as the detection, using Event ID 4616 (Audit Resource Share) or similar events to check for unauthorized data being manipulated or transferred.

  - **Assess system criticality and user context:** Determine whether the affected host is a high-value target or part of a critical operation environment. Review user roles to identify potential insider threats or misconfigurations.

  - **Identify malicious indicators:** Focus on automated tasks or scheduled jobs that may trigger these PowerShell commands, particularly those operating without user intervention, which can suggest malicious intent rather than typical administrative tasks.

  ### Prioritization

  This alert should be considered high-severity due to its potential to indicate data exfiltration, particularly if it originates from sensitive endpoints like domain controllers or databases. The likelihood of abuse is significant, as obfuscated PowerShell execution is a common tactic employed by adversaries to avoid detection.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on Script Block Logging, which may not be universally enabled, thus potentially missing executions of the malicious PowerShell commands. Legitimate applications utilizing `clip.exe` may inadvertently trigger this alert. A companion detection to consider is monitoring for abnormal outbound connections from the affected host to flag any exfiltration attempts that may correlate with PowerShell usage.

