note: |
  ### Technical Context

  This Sigma rule detects instances where obfuscated PowerShell scripts utilize `Clip.exe` to manipulate the clipboard, which is commonly associated with data exfiltration or command-and-control operations. The likely attacker objective is to execute potentially malicious commands while obscuring their behavior through obfuscation methods. This detection is aligned with the MITRE ATT&CK framework under the tactic of Defense Evasion (T1070) and the technique Execution (T1059.001).

  The primary telemetry source for this detection is Windows PowerShell Script Block Logging, specifically event logs that capture the text of executed scripts. If this behavior is malicious, it could indicate attackers are attempting to exfiltrate sensitive data using the clipboard mechanism, leading to potential data breaches. Importantly, this detection does NOT confirm malware presence or actual data exfiltration on its own; further investigation is required.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Check Security Event ID 4104 for obfuscated script execution. Look for actions containing `clip` and follow-on methods like `echo`, indicating potential data manipulation.

  - **Analyze user context**: Identify the user account executing the obfuscated script. Confirm if the user has legitimate privileges for such actions, particularly on sensitive systems.

  - **Examine external network connections**: Verify outbound connections (e.g., Event ID 5156 in Windows Firewall logs) that occur shortly after the execution of the suspicious PowerShell command. High-risk external IPs or unusual ports can indicate C2 communication.

  - **Identify legitimate use cases**: Check if the detected behavior corresponds with known administrative script usage or internal processes. For example, legitimate scripts may be documented in operation manuals or logged under authorized IT asset maintenance tasks.

  - **Correlate with other alerts**: Look for companion detections related to PowerShell activity, such as unusual module imports (Event ID 4103), which may provide additional context around potentially malicious behavior.

  - **Monitor for file creation**: Investigate if any temporary files or artifacts are created around the same time as the detection, which may indicate data staging or exfiltration actions (e.g., reviewing Event ID 4663 for file access activity).

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of data exfiltration or payload delivery affecting critical systems. The likelihood of malicious exploitation is moderate, as obfuscation techniques like this are regularly weaponized in various attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, which can prevent visibility into PowerShell activity. Legitimate clipboard manipulation by applications, such as during user actions or system processes, could trigger false positives. Companion detections, like monitoring for suspicious inbound PowerShell activity (Process Creation Event IDs), can strengthen overall threat detection capabilities.

