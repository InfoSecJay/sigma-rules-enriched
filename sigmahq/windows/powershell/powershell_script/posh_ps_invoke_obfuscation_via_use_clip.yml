  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|re: '(?i)echo.*clip.*&&.*(Clipboard|i`?n`?v`?o`?k`?e`?)'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell scripts that invoke clipboard operations, specifically via the `Clip.exe` utility. Attackers may use such techniques to exfiltrate sensitive information by copying data to the clipboard and then retrieving it from an external system. The use of obfuscated commands can often evade traditional security measures, making it a notable tactic in sophisticated attacks.

  The likely attacker objectives include data theft and lateral movement within a compromised environment, leveraging PowerShell's capabilities for malicious purposes. The detection logic is anchored in the recognition of specific patterns within PowerShell script blocks that contain obfuscated terms associated with the clipboard functionality.

  Relevant MITRE ATT&CK tactics and techniques:
  - **Execution** (T1203) - Execution of malicious scripts via PowerShell.
  - **Defense Evasion** (T1027) - Obfuscated files or information to avoid detection.

  The primary data sources to reference include:
  - **PowerShell Script Block Logging**: This must be enabled for capturing script activities and obfuscations.
  - **Windows Event Logs**: Particularly Event ID 4104, which includes details of script block logging.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check for Event ID 4104 in PowerShell script block logs to identify suspicious commands related to `Clip.exe` and associated clip-related obfuscations.
  - **Analyze Process Creation Events**: Investigate any process creation events that show invocation of PowerShell scripts containing `Clip.exe` to correlate with user activity and potentially identify lateral movement or data exfiltration.
  - **Examine User Activity**: Look for unexpected user activity patterns around the time of the alerts, particularly unusual logins or access to sensitive files that might be copied to the clipboard.
  - **Correlate with Network Traffic**: If applicable, analyze any network traffic that may correspond with clipboard data usage, especially if there are external communications occurring shortly after the PowerShell execution.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant data loss and the likelihood of evasion tactics being employed by attackers. The obfuscation indicates a determined effort to bypass detection mechanisms, increasing the risk to sensitive information within the enterprise.

  ### Blind Spots and Assumptions
  The detection logic primarily assumes that script block logging is enabled, which is not always the case in all environments, potentially leading to missed detections. Furthermore, any obfuscation patterns that do not match the defined regular expression may go undetected, creating a blind spot. Analysts should ensure comprehensive logging configurations are in place to capture suspicious PowerShell activity effectively.

