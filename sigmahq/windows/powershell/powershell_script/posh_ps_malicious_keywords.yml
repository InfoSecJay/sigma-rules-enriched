title: Malicious PowerShell Keywords
id: f62176f3-8128-4faa-bf6c-83261322e5eb
status: test
description: Detects keywords from well-known PowerShell exploitation frameworks
references:
- https://adsecurity.org/?p=2921
author: Sean Metcalf (source), Florian Roth (Nextron Systems)
date: 2017-03-05
modified: 2023-06-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'AdjustTokenPrivileges'
    - 'IMAGE_NT_OPTIONAL_HDR64_MAGIC'
            # - 'LSA_UNICODE_STRING'
    - 'Metasploit'
    - 'Microsoft.Win32.UnsafeNativeMethods'
    - 'Mimikatz'
    - 'MiniDumpWriteDump'
    - 'PAGE_EXECUTE_READ'
    - 'ReadProcessMemory.Invoke'
    - 'SE_PRIVILEGE_ENABLED'
    - 'SECURITY_DELEGATION'
    - 'TOKEN_ADJUST_PRIVILEGES'
    - 'TOKEN_ALL_ACCESS'
    - 'TOKEN_ASSIGN_PRIMARY'
    - 'TOKEN_DUPLICATE'
    - 'TOKEN_ELEVATION'
    - 'TOKEN_IMPERSONATE'
    - 'TOKEN_INFORMATION_CLASS'
    - 'TOKEN_PRIVILEGES'
    - 'TOKEN_QUERY'
  condition: selection
falsepositives:
- Depending on the scripts, this rule might require some initial tuning to fit 
  the environment
level: medium
note: |
  ### Technical Context

  This rule detects the use of specific keywords associated with known PowerShell exploitation techniques and tools, including Mimikatz and Metasploit. Attackers utilizing these keywords likely aim to escalate privileges, perform credential dumping, or manipulate system processes. This behavior aligns with the MITRE ATT&CK execution tactic, specifically technique T1059.001 (PowerShell).

  The primary telemetry source is PowerShell Script Block Logging, which captures the contents of script blocks executed in PowerShell. If malicious, this activity can significantly impact the security posture of affected systems through unauthorized access or data exfiltration. However, the detection of these keywords does NOT confirm malicious intent or activity on its own, as benign scripts can also contain these terms.

  ### Investigation Steps

  - **Review PowerShell Script Block logs:** Check for Script Block Logging artifacts in the Event Log (Event ID 4104) for the presence of the detected keywords. Look for unusual usage patterns that deviate from normal operational behavior.

  - **Identify the context of usage:** Determine the user context under which the PowerShell commands were executed. Evaluate whether it’s a privileged account performing expected administrative tasks versus a standard user account exhibiting unusual behavior.

  - **Correlate with additional telemetry:** Investigate related logs, such as Windows Event ID 4624 (Logon) or 4688 (Process Creation), to see if notable user actions coincided with the triggering of this rule. Look for process creation logs where PowerShell (powershell.exe) is spawned with parameters indicating potential abuse.

  - **Asses command legitimacy:** Compare the executed commands against known legitimate PowerShell scripts used within your organization. This helps validate benign activities versus potential exploit attempts.

  - **Identify known malicious behaviors:** Look for other indicators such as unexpected network connections or file creation patterns related to Mimikatz or Metasploit operations. Validate high-confidence malicious indicators like connections to known command and control (C2) servers or drops to unusual file paths.

  - **Check for endpoint protection alerts:** Review logs from endpoint protection solutions to assess if they have flagged the PowerShell activity as suspicious or malicious. This includes alerting on the usage of the same keywords in previous incidents.

  ### Prioritization

  This alert has medium severity due to the potential impact if malicious activity is confirmed, particularly on systems with high privileges. The likelihood of abuse is elevated as the detected keywords are frequently used in real-world exploitation scenarios. This behavior is commonly weaponized in attacks involving credential dumping and privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence or absence of PowerShell Script Block Logging, which is not always enabled by default. Legitimate administrative scripts may trigger this alert, especially in environments that utilize PowerShell for routine tasks. A companion detection to consider is monitoring for abnormal PowerShell execution patterns or command-line arguments, which can provide additional context and enhance incident response efforts.

