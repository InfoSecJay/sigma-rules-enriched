title: Malicious PowerShell Keywords
id: f62176f3-8128-4faa-bf6c-83261322e5eb
status: test
description: Detects keywords from well-known PowerShell exploitation frameworks
references:
- https://adsecurity.org/?p=2921
author: Sean Metcalf (source), Florian Roth (Nextron Systems)
date: 2017-03-05
modified: 2023-06-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'AdjustTokenPrivileges'
    - 'IMAGE_NT_OPTIONAL_HDR64_MAGIC'
            # - 'LSA_UNICODE_STRING'
    - 'Metasploit'
    - 'Microsoft.Win32.UnsafeNativeMethods'
    - 'Mimikatz'
    - 'MiniDumpWriteDump'
    - 'PAGE_EXECUTE_READ'
    - 'ReadProcessMemory.Invoke'
    - 'SE_PRIVILEGE_ENABLED'
    - 'SECURITY_DELEGATION'
    - 'TOKEN_ADJUST_PRIVILEGES'
    - 'TOKEN_ALL_ACCESS'
    - 'TOKEN_ASSIGN_PRIMARY'
    - 'TOKEN_DUPLICATE'
    - 'TOKEN_ELEVATION'
    - 'TOKEN_IMPERSONATE'
    - 'TOKEN_INFORMATION_CLASS'
    - 'TOKEN_PRIVILEGES'
    - 'TOKEN_QUERY'
  condition: selection
falsepositives:
- Depending on the scripts, this rule might require some initial tuning to fit the
  environment
level: medium
note: |
  ### Technical Context
  This rule detects the usage of specific keywords indicative of malicious activity within PowerShell scripts. These keywords stem from well-known exploitation frameworks, such as Mimikatz and Metasploit, which attackers often use to perform privilege escalation and information retrieval on compromised systems. The key objective of such an attacker is typically to gain access to sensitive data, perform lateral movement, or establish persistence within the target environment.

  The rule falls primarily under two relevant MITRE ATT&CK tactics: **Execution (TA0002)** and **Credential Access (TA0006)**. The corresponding techniques related to specific keywords detected in this rule include **PowerShell (T1059.001)** and various privilege escalation commands associated with token manipulation and process access.

  To effectively identify potential threats, the primary data sources should include Windows Script Block Logging, which captures detailed information about PowerShell executed scripts, particularly the contents of those scripts. This logging is essential for detecting the abnormal invocation of PowerShell with these high-risk keywords.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logs for instances of the detected keywords. Pay particular attention to the context in which these keywords are used to discern legitimate scripts from potential attacks.

  - **Correlate with Process Creation Events**: Analyze process creation events related to the detected PowerShell script executions. Look for unusual parent processes that may indicate an exploitation attempt, such as launching PowerShell from low-trust environments or scripting languages.

  - **Validate User Context**: Investigate the user account associated with the PowerShell execution. Assess whether the execution came from legitimate administrative tasks or if it raised flags for potentially malicious behavior by unauthorized users.

  - **Check for Lateral Movement Indicators**: Determine if the identified PowerShell activities correlate with additional signs of lateral movement within the environment, such as abnormal network connections or credential dumping attempts through tools like Mimikatz.

  ### Prioritization
  The alert should be classified as medium severity due to the potential for significant impact if malicious PowerShell commands are executed successfully. While not every detection will indicate a breach, the context of executing PowerShell with exploitation frameworks warrants timely investigation to prevent escalation.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if Script Block Logging is not enabled or properly configured, as these settings are essential for capturing the necessary data. The detection logic assumes that the keywords listed in the rule are conclusive indicators of malicious intent; however, benign scripts may also utilize similar terms. Organizations should ensure that logging is correctly set up across all endpoints to enhance detection efficacy.

