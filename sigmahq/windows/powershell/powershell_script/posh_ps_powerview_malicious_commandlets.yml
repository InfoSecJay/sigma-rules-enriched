note: |
  ### Technical Context

  This Sigma rule detects the execution of specific PowerShell Cmdlets associated with PowerView, a post-exploitation tool that is part of the PowerSploit framework. The detection targets behaviors indicative of reconnaissance within a Windows Active Directory environment, such as querying domain objects and user permissions. The likely attacker objective is to gather information about the network environment, user privileges, and potential targets for further exploitation.

  The relevant MITRE ATT&CK tactic for this detection is "Execution" (TA0002) with a specific technique of "Command and Scripting Interpreter: Windows PowerShell" (T1059.001). Primary telemetry sources include PowerShell Script Block logs, required for capturing the execution of these Cmdlets, which are enabled through Group Policy settings. If exploited, this behavior can lead to unauthorized access to sensitive data and escalation of privileges within the organization's infrastructure. This detection does NOT confirm malicious intent by itself, as legitimate administrative tasks might also trigger the alert.

  ### Investigation Steps

  - **Review Script Block Logs for suspicious Cmdlets:** Check Windows Event ID 4104 for script block logging entries containing the keywords associated with PowerView (e.g., 'Find-DomainUserEvent', 'Invoke-UserHunter') to ascertain execution context.

  - **Validate the context of Cmdlet execution:** Analyze the user context in which these Cmdlets were executed. Legitimate administrative users running PowerView scripts may indicate authorized activity; however, unexpected execution by non-administrative users should raise flags.

  - **Cross-check executed Cmdlets against scheduled tasks:** Identify if the executed Cmdlets were part of legitimate scheduled tasks (e.g., Event ID 4698). Scheduled or automated tasks that involve these Cmdlets may indicate normal operations, while ad-hoc execution may denote malicious activity.

  - **Examine parent process information:** Scrutinize the parent process of the PowerShell execution (Event ID 4688 or Sysmon Event ID 1) for unexpected initiators such as unknown user sessions or unauthorized applications attempting to run Powershell scripts.

  - **Assess logs from other security layers:** Review related logs such as Windows Security Auditing logs for failed logins or suspicious lateral movement patterns that might coincide with the execution of detected Cmdlets.

  - **Identify high-confidence malicious behavior indicators:** Look for patterns such as multiple executions of reconnaissance Cmdlets in short timeframes, or requests to transfer collected data externally, indicating possible data exfiltration or subsequent attacks.

  ### Prioritization

  The severity of this alert is high given the potential impact of compromised administrative accounts and the likelihood of malicious recon activities being weaponized in APT scenarios. The detection of PowerView Cmdlets indicates a methodical approach to network enumeration, which is often a precursor to further compromises.

  ### Blind Spots and Assumptions

  Detection may be limited due to potential evasion techniques such as disabling PowerShell logging, using obfuscation, or executing via a different interpreter. Script Block Logging must be enabled and properly configured to capture relevant events. Legitimate use cases such as internal audits or administrative assessments may generate similar alerts. A companion detection that strengthens coverage could include monitoring for unusual PowerShell execution contexts, such as execution from uncommon directories or by atypical user accounts.

