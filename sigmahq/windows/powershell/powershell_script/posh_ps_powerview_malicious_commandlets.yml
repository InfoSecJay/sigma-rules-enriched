note: |
  ---

  ### Technical Context

  This detection rule identifies the execution of specific PowerView PowerShell cmdlets that are commonly used for Active Directory reconnaissance. These cmdlets facilitate the gathering of information about domain users, groups, shares, and other critical system attributes, indicating a potential attempt to map the environment for later exploitation. The likely attacker objective is to enumerate sensitive information that can be leveraged for privilege escalation or lateral movement within the network.

  The relevant MITRE ATT&CK tactic for this behavior is **Discovery** (TA0007), with specific techniques including **Command and Scripting Interpreter: Windows PowerShell** (T1059.001). Primary telemetry sources include Windows PowerShell Script Block Logging, specifically monitoring events related to cmdlet execution. If these cmdlets are executed with malicious intent, this can lead to unauthorized access and compromise of sensitive organizational assets. It is crucial to note that the detection of these cmdlets does NOT confirm malicious activity by itself; legitimate administrative tasks may use similar commands.

  ---

  ### Investigation Steps

  - **Check for Script Block Logging**: Ensure that Script Block Logging (Windows Event ID 4104) is enabled on the affected endpoint to capture the execution context of the cmdlets.

  - **Review Script Block Logs**: Look for occurrences of the cmdlets listed in the detection rule within the logs. Pay close attention to unusual execution times or from non-administrative accounts which may indicate suspicious behavior.

  - **Validate User Roles**: Confirm if the user account executing the cmdlets has legitimate administrative roles or if it is a standard user account. Legitimate activity for IT support roles may include using cmdlets with a clear business purpose.

  - **Identify Malicious Patterns**: Focus on cmdlets like `Get-NetUser`, `Invoke-Kerberoast`, or `Find-ForeignUser`. If found associated with accounts lacking administrative privileges or in conjunction with unusual command-line arguments, consider escalating the alert.

  - **Correlate with Other Logs**: Cross-reference with authentication logs (Security Event IDs 4624 for logon events and 4625 for failed logins) to identify patterns of privilege escalation following the execution of these commands.

  - **Evaluate Impact on Critical Assets**: Determine if the activity has targeted critical systems or administrative accounts that could lead to damaging lateral movement or exploitation within the network.

  ---

  ### Prioritization

  This alert should be prioritized as high risk due to its potential impact on the network's security posture, especially if cmdlets are executed by accounts with low privileges but targeting sensitive systems or data. The likelihood of such behaviors being malicious is considerable, given that the utilization of PowerView is common among attackers for reconnaissance before executing further attacks.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include disabling Script Block Logging or using obfuscated scripts to bypass detection. Reliable detection requires that PowerShell logging be configured correctly across all endpoints, especially for server systems. Legitimate IT operations may trigger this alert during routine maintenance. A related detection that strengthens coverage includes monitoring the use of native Windows commands or scripts that could complement AD enumeration activities, thereby affirming the presence of malicious intent in the activity observed.

