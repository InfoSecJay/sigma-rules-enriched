note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerView PowerShell cmdlets commonly used for Active Directory reconnaissance. Attackers leverage these cmdlets to gather information about users, groups, shares, and permissions within a domain environment, with the objective of identifying potential attack vectors or footholds. This behavior correlates with the MITRE ATT&CK tactics of Execution and Discovery (Tactic ID: TA0001, Technique ID: T1059.001).

  The primary telemetry source for this detection is PowerShell script block logging, captured via Windows Event ID 4104, which logs the content of executed PowerShell scripts. If malicious, the use of these cmdlets poses significant security risks, as they can lead to account compromise, lateral movement, and further exploitation of domain resources. However, the detection of these commands alone does not confirm malicious intent; legitimate administrative or operational tasks from authorized users may also trigger this alert.

  ### Investigation Steps

  - **Check event logs for cmdlet execution**: Review Windows Event ID 4104 (PowerShell script block logging) for occurrences of the cmdlets listed in the detection. Compare against a baseline of legitimate PowerShell usage within your environment.

  - **Identify user accounts executing commands**: Analyze the user context under which these cmdlets were run. Legitimate administrative accounts typically execute these commands during routine audits. Look for unusual accounts or unfamiliar activity.

  - **Investigate script block content**: Examine the full command text in Event ID 4104. Check if it's part of a larger PowerShell script that may indicate mining for extensive domain information rather than a single, isolated cmdlet, which could suggest malicious intent.

  - **Correlate with other log sources**: Look for related events in Security Event ID 4688 (Process Creation) to assess if any processes initiated by PowerShell (e.g., unusual paths, unexpected parent processes) correspond with the execution of these cmdlets.

  - **Review recent access patterns**: For systems where these commands were executed, analyze Event ID 5140 (File Share Access) or Event ID 4663 (File Access) to identify any suspicious access to sensitive folders or files, as these might indicate data exfiltration or privilege escalation attempts.

  - **Identify known legitimate users**: Cross-reference the executing users with known administrators and personnel who have documented tasks requiring such PowerView cmdlets to help differentiate between normal and potentially malicious usage.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on sensitive organizational data and systems. The use of PowerView cmdlets for reconnaissance is a common tactic among attackers seeking to establish footholds or infiltrate systems within the enterprise, increasing the likelihood of malicious abuse if not addressed.

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of PowerShell logging configurations; if script block logging is not enabled, key activities may remain undetected. Additionally, legitimate administration activities, such as active directory audits or user management tasks, could trigger this alert. A related indicator of compromise would be the use of “Invoke-UserHunter” or similar cmdlets, which may strengthen coverage against reconnaissance behaviors.

