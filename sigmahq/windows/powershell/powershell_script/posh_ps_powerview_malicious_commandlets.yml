note: |
  ### Technical Context
  This detection rule identifies the execution of specific PowerShell cmdlets associated with PowerView, a tool within the PowerSploit exploitation framework. PowerView is commonly used by attackers to perform reconnaissance in Active Directory environments, enabling them to gather information on users, groups, processes, and resources. The detection focuses on various cmdlets that can help attackers enumerate domain objects, discover local groups, and identify permissions and accessible shares within the network.

  Attackers leveraging PowerView likely aim to facilitate lateral movement, privilege escalation, or data exfiltration by gaining insights into Active Directory structure and user privileges. The tactics covered under this rule align with the MITRE ATT&CK framework, specifically under the *Execution* tactic (ID: TA0002) and technique *Command and Scripting Interpreter: Windows PowerShell* (ID: T1059.001).

  Primary data sources for detection include PowerShell Script Block logs, which must be enabled on Windows systems to capture the commands being executed. Monitoring these logs will help identify potentially malicious activities performed in the environment using PowerShell, particularly those aligned with reconnaissance and exploitation.

  ### Investigation Steps
  - **Review Script Block Logs:** Analyze the PowerShell script block logs for the identified cmdlets. Focus on any occurrences of the specified cmdlets, including `Get-NetUser`, `Find-DomainUserEvent`, and others outlined in the detection specifications, to determine the context of their usage.
  - **Correlate with User Activity:** Examine user behavior and access patterns associated with the execution of these cmdlets. Identify if the user running these commands should have legitimate reasons for running recon queries or if their actions appear anomalous.
  - **Check for Lateral Movement Indicators:** Investigate related telemetry for signs of lateral movement or exploitation attempts, such as unusual logins to systems or access to sensitive domains following the execution of PowerView cmdlets.
  - **Validate Against Threat Intelligence:** Utilize threat intelligence feeds to correlate any detected PowerView activity with known malicious actors or recent breaches. This can help in assessing the severity of the detected activities and understanding potential risks.

  ### Prioritization
  Given the high potential for compromise through reconnaissance activities like those facilitated by PowerView, the alert is considered high severity. Attackers leveraging these cmdlets can quickly gather critical information to enhance their subsequent malicious actions, thereby posing a significant threat to enterprise security.

  ### Blind Spots and Assumptions
  The detection logic assumes that Script Block Logging for PowerShell is properly configured and operational within the environment. If this logging is disabled or not set up correctly, the detection will not function. Furthermore, there may be blind spots in detecting cmdlet usage if attackers obfuscate their operations or use alternative methods outside of PowerShell to gather information. An assumption is also made that the context around the cmdlet execution can be interpreted accurately from logs, which might not always be straightforward.

