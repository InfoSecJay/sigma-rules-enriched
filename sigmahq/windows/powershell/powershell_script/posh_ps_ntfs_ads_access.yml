note: |
  ### Technical Context

  This detection identifies when PowerShell commands are used to write data into NTFS alternate data streams (ADS), leveraging Script Block Logging. The behavior typically serves to hide data from standard file listings, which an attacker may use to conceal malicious payloads or data exfiltration. This activity aligns with the MITRE ATT&CK technique T1564.004 (Hide Data in Alternate Data Streams) under the tactic of Defense Evasion. The primary telemetry source includes PowerShell logs capturing events from Script Block Logging, specifically monitoring for content parameters indicating hidden stream utilization. If malicious, this could enable data obfuscation or covert communications. However, this detection alone does not confirm the intent behind the activity—legitimate administrative behaviors may also trigger this alert.

  ### Investigation Steps

  - **Verify Script Block Logs:** Review recent PowerShell logs for Event ID 4104 that match the specific commands: `set-content`, `add-content`, and `-stream`. Analyze the content being written for suspicious activity, such as executable code or network connection strings.

  - **Identify Target Files:** Examine the files being modified for alternate data streams. Use PowerShell commands to check for ADS existence with `Get-Item -Path <file_path>:<stream_name>` to validate any unexpected modifications.

  - **Assess User Context:** Determine the user context of the PowerShell execution. Look at related Event ID 4688 (Process Creation) to identify the user, host, and process parentage. Benign administrative tasks often originate from known management accounts versus unusual user accounts.

  - **Correlate with Known Threats:** Check the hash of any written files against threat intelligence sources to confirm if they are known malicious indicators or have been associated with past attacks.

  - **Review File Access Patterns:** If possible, ensure there are no unusual access patterns or file permissions on files written to, particularly if they reside on critical assets such as domain controllers or servers that handle sensitive data.

  ### Prioritization

  This alert is considered high severity due to the potential impact on data security and system integrity. The use of NTFS ADS can indicate malicious behavior aiming to evade detection. While not all instances are weaponized, the technique is well-documented as being utilized for backdoor creation and data hiding, warranting prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative activities that use NTFS ADS for data management tasks. Additionally, if Script Block Logging is not enabled, coverage will be inadequate. Adversaries can also evade detection by using alternative methods or tools to modify file streams. Companion detections from related behaviors, such as Event ID 4105 (PowerShell Script Block Logging) anomalies, can enhance coverage against suspicious use cases.

