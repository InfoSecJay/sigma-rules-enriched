logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_content:
    ScriptBlockText|contains:
    - set-content
    - add-content
  selection_stream:
    ScriptBlockText|contains: '-stream'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the use of PowerShell commands (`set-content`, `add-content`) that write data to NTFS Alternate Data Streams (ADS). Attackers may use ADS to hide malicious content, as this technique allows files to evade standard detection tools and stay under the radar while residing on disk. The likely objective is to store malicious payloads or exfiltrate data disguised within legitimate files, thereby exploiting the filesystem's hidden capabilities.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0022) and **Command and Scripting Interpreter** (T1059.001), specifically targeting alternative data streams (T1564.004). The primary source of telemetry comes from Windows PowerShell Script Block Logging, which must be enabled to capture the command executions. If malicious, the security impact is severe, potentially leading to data breaches or persistence mechanisms. Importantly, this detection does NOT confirm that malicious activity is occurring by itself, as legitimate use of ADS exists.

  ### Investigation Steps

  - **Review Script Block Logs**: Identify PowerShell scripts with Event IDs 4104 that include `set-content` or `add-content` commands that also reference `-stream`. Look for unusual or unauthorized stream names that are atypical for the environment.

  - **Correlate with File Metadata**: Use forensic tools to inspect files in the suspected path. Look for files with ADS using command-line tools such as `dir /R`. Benign indicators include standard file usage patterns without hidden data streams.

  - **Check Recent PowerShell Activity**: Review PowerShell logs for context (Event ID 400, 403, 4100). Assess user activity for known benign usage patterns, noting scripts run by automated systems or legitimate admin tasks.

  - **Identify Command Line Arguments**: Review command line usage through Sysmon Event ID 4688. Investigate instances of PowerShell executions with strings containing `-Stream`. Malicious indicators can include the absence of signed scripts or unexpected user accounts executing these commands.

  - **Examine Affected Hosts' Role**: Determine if the host is a critical asset (e.g., Domain Controller, application server). Attackers often target critical systems to increase impact. Legitimate activities from web servers or logging services may trigger the alert due to common administrative tasks.

  - **Assess for Additional Artifacts**: Look for remnants of data exfiltration or subsequent malicious activities, such as unusual outbound connections or file transfer logs. Ensure file creation logs indicate expected usage patterns without signs of volume changes.

  ### Prioritization

  This alert should be prioritized as high due to the potential for severe impacts on file integrity and data confidentiality. The use of NTFS ADS is a recognized method for hiding malicious content, making it a common tactic utilized in various attacks. The likelihood of malicious usage increases if associated with suspicious processes or user accounts.

  ### Blind Spots and Assumptions

  The detection may miss cases where Script Block Logging is not enabled or where attackers utilize obfuscation techniques to bypass detection. Requires consistent collection of PowerShell logs and inspection of NTFS attributes to ensure robust coverage. Legitimate administrative use of ADS (for storing metadata or other benign purposes) may trigger false positives. A related detection to consider is monitoring for changes in file integrity or suspicious modifications within the file system, which can strengthen overall coverage against such stealth tactics.

