note: |
  ### Technical Context

  This Sigma rule detects data being written into NTFS Alternate Data Streams (ADS) via PowerShell, specifically focusing on commands involving `Set-Content` and `Add-Content` with the `-Stream` parameter. The primary objective for an attacker is typically to hide malicious payloads or data within ADS to evade detection, as these streams can remain unnoticed by traditional file-system scans. This behavior aligns with the MITRE ATT&CK technique T1564.004 (Hide Implants and Files), and also relates to T1059.001 (PowerShell).

  The primary telemetry source for this detection is PowerShell script logs that must have Script Block Logging enabled. If an alert is triggered, it indicates possible malicious activity or evasion attempts; however, it does NOT confirm a compromise on its own, as legitimate applications and administrative tasks might also utilize ADS.

  ---

  ### Investigation Steps

  - **Verify PowerShell Script Block Logs**: Check for Security Event ID 400, which logs PowerShell script block execution. Look specifically for ScriptBlockText containing both `set-content` and `add-content`.

  - **Analyze the Stream Name**: Validate the data written to NTFS ADS by investigating file attributes within PowerShell using `Get-Item -Path <file>::$DATA`. Indications of malicious use could include unusual stream names such as `stream.txt`, which are atypical for legitimate use.

  - **Review for Legitimate Use Cases**: Identify any documented business processes that use NTFS streams for data storage. Legitimate entries may include application log files, whereas unexpected or unknown streams can indicate malicious activity.

  - **Examine File Creation Timestamps**: Investigate the file creation and modification timestamps. Legitimate entries should fit expected patterns (e.g., software deployments or updates), while timestamps that overlap with anomalous user behavior may signal malicious uploads.

  - **Correlate with Other Security Alerts**: Check the SIEM for correlated alerts within the same timeframe, such as unusual user account activity or execution of known malicious PowerShell commands (Event ID 4688, Process Creation logs). This can provide context to potential threat actor behavior.

  - **Monitor Asset Criticality**: Assess the criticality of the host where this detection triggered. Sensitive systems processing PII or critical infrastructure should escalate for immediate investigation.

  ---

  ### Prioritization

  This alert is high-severity due to the potential for data concealment tactics commonly used by skilled adversaries. The risk of compromise is significant, especially if critical systems are involved, and this behavior is often weaponized in sophisticated attacks aimed at evading detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell Script Block Logging is disabled, which can lead to missed activity. Additionally, legitimate use cases, such as applications that utilize NTFS ADS for configuration or logs, may trigger this alert. Companion detections, like monitoring for file attribute changes using Sysmon (Event ID 10), can strengthen visibility into potential data manipulation activities.

