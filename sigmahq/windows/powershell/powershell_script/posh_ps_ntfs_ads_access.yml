- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_content:
    ScriptBlockText|contains:
    - set-content
    - add-content
  selection_stream:
    ScriptBlockText|contains: '-stream'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where data is being written into NTFS Alternate Data Streams (ADS) using PowerShell commands. When an attacker wants to hide data in a file, they often utilize NTFS ADS to conceal malicious payloads or information, thereby avoiding detection by traditional security measures. The rule specifically targets commands such as `set-content` and `add-content`, along with the `-stream` argument, indicating that the functionality to manipulate alternate data streams is in use.

  The likely threat scenario involves an adversary employing techniques for data exfiltration or persistence, where hidden data maintains a low profile to evade detection mechanisms. Attackers may carry out these actions to store malware, scripts, or exfiltrated data in ADS as a method of obfuscation or to bypass security controls. Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1564.004)** and **Execution (T1059.001)**.

  Primary data sources for this detection include Windows PowerShell logs enabled with Script Block Logging, which capture the execution of PowerShell commands including their parameters.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate the PowerShell logs for entries containing `set-content`, `add-content`, or `-stream`. Look for anomalous executions, especially from non-administrative accounts or during non-standard hours.
  - **Assess File System Integrity**: Check the corresponding files for the presence of alternate data streams using tools like `dir /r` or third-party utilities. Pay attention to any large or unexpected streams associated with benign files.
  - **Correlate User Activity**: Validate the user activity around the time of the PowerShell executions. Look for any connections to known indicators of compromise or behaviours typically associated with account compromise.
  - **Monitor for Related Techniques**: Beyond the immediate detection, it is prudent to monitor for other suspicious behaviors, such as unusual process creation (e.g., spawning PowerShell from untrusted applications) and network connections indicative of data exfiltration.

  ### Prioritization
  The alert is prioritized as high severity due to the potential for significant data exfiltration or malicious payload placement. The ability of adversaries to utilize hidden data streams increases the likelihood of continued access to systems while evading detection mechanisms, making it essential to respond quickly.

  ### Blind Spots and Assumptions
  This detection logic assumes that Script Block Logging is enabled in the environment to capture the necessary PowerShell command executions. Not having this logging configured will lead to gaps in visibility for PowerShell activities. Additionally, the coverage may miss sophisticated evasion techniques where attackers utilize custom obfuscation methods or invoke the commands indirectly through scripts or other applications. Environments that do not extensively monitor filesystem changes might also miss the creation of alternate data streams, thus limiting overall visibility.

