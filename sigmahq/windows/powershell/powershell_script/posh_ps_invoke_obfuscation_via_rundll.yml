note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell scripts using the RUNDLL launcher, specifically through `rundll32.exe` invoking PowerShell commands. The likely attacker objective is to execute malicious scripts while evading detection mechanisms typically focused on straightforward PowerShell execution. This behavior is closely related to MITRE ATT&CK tactics and techniques such as Defense Evasion (T1027) and Execution (T1059.001).

  The primary telemetry source required for this detection is PowerShell script block logging (Event ID 4104). If malicious, this behavior may lead to unauthorized system access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm that the detected PowerShell script is malicious without further contextual information.

  ### Investigation Steps

  - **Review script block logs:** Check for Event ID 4104 entries containing keywords associated with the detection: `rundll32.exe`, `shell32.dll`, `shellexec_rundll`, and `powershell`. Examine the `ScriptBlockText` field for evaluation of the command context.

  - **Identify parent process correlation:** Investigate the parent process of `rundll32.exe` using Event ID 4688 (Process Creation) to ascertain whether it originates from an expected/benign source. A legitimate `rundll32.exe` invocation typically has a process parent such as `explorer.exe` or trusted management scripts.

  - **Look for indicators of compromise:** Determine if the `ScriptBlockText` is sending network requests or performing file operations by cross-referencing it with outbound connection logs (e.g., Firewall or EDR logs). Malicious scripts often connect to known malicious IPs or domains.

  - **Corroborate with a behavioral baseline:** Evaluate if this execution aligns with common PowerShell usage within the organization. Legitimate use is often seen in automation tasks or administrative scripts, while anomalies may indicate suspicious activity.

  - **Document user context:** Identify the user context under which the script was executed. Unauthorized execution by accounts that do not typically utilize PowerShell may indicate a compromise.

  - **Examine system logs for evasion techniques:** Ensure that Windows Auditing is configured to capture relevant events. Malicious actors may try to disable logging or modify event behaviors to evade detection.

  ### Prioritization

  This alert is considered medium severity as it could indicate a serious potential compromise, especially on high-value servers or workstations. The likelihood of malicious abuse is significant given that RUNDLL is commonly exploited in attack vectors. However, this activity may also arise from legitimate administrative operations.

  ### Blind Spots and Assumptions

  The detection may miss cases where script block logging is disabled or if obfuscation techniques are altered to avoid detection. Required log sources include PowerShell logging (Script Block Logging) and process creation logs. Legitimate administrative scripts that utilize RUNDLL for automation may trigger this alert. As a companion detection, monitoring for unusual PowerShell module imports (T1064) may strengthen overall coverage and alerting capabilities.

