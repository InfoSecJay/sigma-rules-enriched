note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands being executed via the `rundll32.exe` launcher, specifically targeting script blocks that include references to `shell32.dll` and the `shellexec_rundll` function. The likely attacker objective is to execute malicious scripts while evading detection through obfuscation techniques, often in an effort to exploit systems or maintain persistence. This technique maps to MITRE ATT&CK Tactics: Execution (T1059.001) and Defense Evasion (T1027).

  Primary telemetry sources for this detection include PowerShell logging, with a specific requirement for Script Block Logging to be enabled. If this behavior is malicious, it indicates an attacker may be executing unauthorized commands, potentially leading to further compromise or data exfiltration. It is important to note that this detection alone does not confirm malicious intent or the success of an attack—further investigation is required to assess context and impact.

  ### Investigation Steps

  - **Check PowerShell logs for relevant events:** Review Event ID 4104 (PowerShell Script Block Logging) for script block events containing `rundll32.exe`, `shell32.dll`, and `shellexec_rundll`. Legitimate use may show standard administrative scripts rather than obfuscated commands.

  - **Analyze process execution history:** Look for Event ID 4688 (New Process Created) related to `rundll32.exe`. A legitimate execution should not include such obfuscated arguments, while suspicious activity may have unusual parent processes like `cmd.exe` or `powershell.exe`.

  - **Examine command line arguments:** Review the command line of the `rundll32.exe` process for signs of obfuscation, such as encoded strings or concatenated commands. High-confidence malicious indicators include complex scripts that reference unauthorized URLs or commands.

  - **Identify related file activity:** Inspect file creation events (e.g., Event ID 4663 or file system logs) that may indicate script download or execution artifacts in conjunction with PowerShell use. Look for unusual files present in common writing directories like `%TEMP%`.

  ### Prioritization

  This alert is medium severity due to its potential impact if executed on key enterprise systems, especially if PowerShell is employed to manipulate or exfiltrate sensitive data. The likelihood of malicious abuse is moderate, given that obfuscation techniques are commonly leveraged by threat actors to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by PowerShell logging configurations; if Script Block Logging is not enabled, this activity won't be captured. Additionally, legitimate administrative actions or automation scripts may trigger this alert, for instance, during deployment tasks. Companion detections that enhance coverage include monitoring for unusual command-line executions by PowerShell (such as through Task Scheduler) or suspicious activity around PowerShell modules.

