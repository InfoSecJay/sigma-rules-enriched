note: |
  ### Technical Context
  This rule detects the execution of obfuscated PowerShell commands that utilize `rundll32.exe`, a legitimate Windows utility commonly abused by attackers to execute malicious scripts and evade detection. The typical threat scenario involves threat actors using obfuscation techniques to hide their true intent, often aiming to deploy payloads, facilitate lateral movement, or establish persistence within enterprise environments. Attackers may leverage PowerShell for automation and management tasks, making it a valuable tool in their arsenal.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1203)**: The use of obfuscation to disguise malicious scripts.
  - **Execution (T1059.001)**: The execution of scripts through PowerShell, particularly when the command is hidden within legitimate system processes like `rundll32.exe`.

  To effectively capture this activity, the primary data source will be:
  - PowerShell script block logging events, derived from Windows event logs (Event ID 4104), which provide critical insights into executed scripts and parameters.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script block logs (Event ID 4104) for any entries containing the terms 'rundll32.exe', 'shell32.dll', 'shellexec_rundll', or 'powershell'. Focus on identifying obscured command lines that may signal exploitation attempts.

  - **Cross-Reference Process Creation Events**: Examine process creation logs (Event ID 4688 or equivalent) for instances of `rundll32.exe` and verify the parent processes to assess the legitimacy of their execution context.

  - **Inspect Network Connections**: Look for any suspicious outbound network connections or unusual patterns of communication that may correlate with executed PowerShell commands. Analyze logs from firewalls or proxies if available.

  - **Evaluate System Changes**: Investigate any recent changes to system configurations or installed applications that may coincide with PowerShell script executions. Check for signs of privilege escalation or unauthorized access attempts.

  ### Prioritization
  This alert is deemed medium severity due to the potential for obfuscated PowerShell commands to indicate active attacks or reconnaissance efforts. The likelihood of an attacker successfully leveraging these techniques in an enterprise environment is significant, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  Possible gaps in detection coverage may arise from systems where Script Block Logging is not enabled or configured correctly. The detection logic assumes that such logging is active; without this, the rule will likely fail to capture relevant activities. Additionally, obfuscation techniques can continuously evolve, potentially leading to false negatives if not updated. Continuous monitoring and tuning of detection criteria will be required to maintain effectiveness.

