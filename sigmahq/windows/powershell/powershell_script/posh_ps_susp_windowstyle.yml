title: Suspicious PowerShell WindowStyle Option
id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
status: test
description: |
  Adversaries may use hidden windows to conceal malicious activity from the plain sight of users.
  In some cases, windows that would typically be displayed when an application carries out an operation can be hidden
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.003/T1564.003.md
author: frack113, Tim Shelton (fp AWS)
date: 2021-10-20
modified: 2023-01-03
tags:
- attack.defense-evasion
- attack.t1564.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'WindowStyle'
    - 'Hidden'
  filter:
    ScriptBlockText|contains|all:
    - ':\Program Files\Amazon\WorkSpacesConfig\Scripts\'
    - '$PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of PowerShell with the `WindowStyle` parameter set to `Hidden`, which is often employed by adversaries to execute malicious scripts while concealing their activity from users. Attackers may utilize this technique to run scripts unnoticed, enabling them to perform various malicious tasks such as data exfiltration or lateral movement without raising user suspicion. The typical objective is to maintain stealth and evade defensive measures that rely on visual cues or user interaction.

  This detection aligns with the MITRE ATT&CK framework under the tactic of **Defense Evasion** (TA0005) and the technique of **Indicator Removal on Host** (T1564.003). The primary data sources for this detection will be PowerShell script execution logs, contingent upon the enabling of Script Block Logging on the affected systems.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script execution logs to identify instances of the `WindowStyle` parameter set to `Hidden`, especially for scripts that exhibit unusual behavior or do not match typical execution patterns.
  - **Assess Related Processes:** Investigate the parent-child process relationships around the detected PowerShell instances to uncover potential malicious activity or additional tools launched in conjunction with the hidden window.
  - **Correlate with Endpoint Activity:** Collect and review associated endpoint security logs (EDR) for signs of anomalous behavior or known malicious indicators in proximity to the time of the PowerShell execution.
  - **Examine Script Origins:** Use logs to trace the origin of the executed scripts, looking for obscure folders, recent changes, or unusual accesses to the folder containing the PowerShell scripts (`\Program Files\Amazon\WorkSpacesConfig\Scripts\`).

  ### Prioritization
  The alert is assessed as medium severity due to the potential for significant harm if hidden executions are being utilized for malicious purposes such as data theft or unauthorized access. Given PowerShell's powerful capabilities in Windows environments, it is critical to investigate promptly to mitigate any potential threats.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that Script Block Logging is enabled; thus, any systems with this logging disabled will not generate relevant logs to trigger this rule. Additionally, there are gaps in detection coverage for PowerShell execution not involving the `WindowStyle` option or if scripts are spawned via alternate methods (e.g., command line without PowerShell). The analysis might miss certain legitimate administrative tasks where the hidden attribute could be present and not necessarily malicious.

