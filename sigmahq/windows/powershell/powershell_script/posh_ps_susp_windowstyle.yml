title: Suspicious PowerShell WindowStyle Option
id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
status: test
description: |
  Adversaries may use hidden windows to conceal malicious activity from the plain sight of users.
  In some cases, windows that would typically be displayed when an application carries out an operation can be hidden
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.003/T1564.003.md
author: frack113, Tim Shelton (fp AWS)
date: 2021-10-20
modified: 2023-01-03
tags:
- attack.defense-evasion
- attack.t1564.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'WindowStyle'
    - 'Hidden'
  filter:
    ScriptBlockText|contains|all:
    - ':\Program Files\Amazon\WorkSpacesConfig\Scripts\'
    - '$PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies the use of PowerShell scripts that apply the `WindowStyle` parameter with a value of `Hidden`. Attackers often employ this technique to execute commands discreetly, avoiding detection by users and security monitoring systems. The likely objective is to carry out malicious operations—such as downloading, executing malware, or performing reconnaissance—without creating visible windows that could alert users.

  This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique T1564.003, which focuses on hiding application windows. The primary telemetry source is Windows PowerShell logging, specifically requiring Script Block Logging to be enabled to capture relevant events. If this behavior is malicious, it may lead to credential theft, lateral movement, or installation of persistence mechanisms. However, this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks could also utilize similar scripting techniques for valid purposes.

  ### Investigation Steps

  - **Review PowerShell Script Execution logs:** Check for PowerShell-related processes using **Event ID 4104** (PowerShell Script Block Logging). Look for logs containing 'WindowStyle' and 'Hidden' but not including known legitimate paths (`C:\Program Files\Amazon\WorkSpacesConfig\Scripts\` or `$PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule`).

  - **Identify high-risk users**: Prioritize review of logs from non-administrative users executing hidden PowerShell scripts. Examine the context of **Event ID 4688** (Process Creation) for potential abuse of administrative PowerShell scripts by unauthorized users.

  - **Check for recent changes in system configuration:** Determine if any relevant changes were made to PowerShell execution policies or environment configurations that might explain the unexpected use of hidden windows. This can often be found in **Event ID 8004** (Windows PowerShell)

  - **Look for related network activity:** Investigate network logs for any outbound connections initiated by the PowerShell script. Presence of suspicious **HTTP/S requests** or other protocol communications immediately following the execution of the PowerShell command can indicate possible data exfiltration or command and control activity.

  - **Validate against known benign behavior:** Compare against regular administrative tasks that utilize hidden PowerShell functionalities (e.g., background administrative scripts). Document expected paths, parameters, and execution methods to identify deviations.

  ### Prioritization

  This alert is of medium severity as the affected systems may involve sensitive data or administrative functionalities. Although the use of hidden PowerShell windows can be indicative of potential malicious activity, it is not exclusive to threats and can sometimes represent benign administrative procedures. However, its common use in attacks makes it a notable red flag that warrants thorough investigation.

  ### Blind Spots and Assumptions

  Detection of this activity may be evaded by disabling script logging or using alternative scripting methods that do not trigger the same alerts. Therefore, it is essential to ensure that Script Block Logging is consistently enabled across the environment. Legitimate administrative scripts might also trigger this alert, especially those involving configuration or maintenance tasks. A related detection, such as monitoring for unexpected outbound PowerShell commands (T1059.001), strengthens overall visibility and helps differentiate between legitimate and suspicious activities.

