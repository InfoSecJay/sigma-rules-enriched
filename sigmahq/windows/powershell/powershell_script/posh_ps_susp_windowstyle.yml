title: Suspicious PowerShell WindowStyle Option
id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
status: test
description: |
  Adversaries may use hidden windows to conceal malicious activity from the plain sight of users.
  In some cases, windows that would typically be displayed when an application carries out an operation can be hidden
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.003/T1564.003.md
author: frack113, Tim Shelton (fp AWS)
date: 2021-10-20
modified: 2023-01-03
tags:
- attack.stealth
- attack.t1564.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'WindowStyle'
    - 'Hidden'
  filter:
    ScriptBlockText|contains|all:
    - ':\Program Files\Amazon\WorkSpacesConfig\Scripts\'
    - '$PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where PowerShell scripts utilize the `WindowStyle` option set to `Hidden`. This behavior may indicate attempts to conceal malicious activities from users by suppressing visible windows during execution. The likely attacker objective is to execute scripts stealthily, potentially for data exfiltration or system compromise. This behavior aligns with the MITRE ATT&CK technique T1564.003 (Hide App Window) under the tactic of Defense Evasion.

  The primary telemetry source for this detection is Windows PowerShell script logging, specifically the required event entries from Script Block Logging, which must be enabled for effective logging. If malicious, the impact could vary from data theft to establishing footholds within the system. Importantly, this detection alone does not confirm malicious intent, as legitimate applications may also use hidden windows for legitimate purposes.

  ### Investigation Steps

  - **Review PowerShell Script Block Logging:**
    Examine the Windows Event logs for Security Event ID 4104, focusing on the `ScriptBlockText` field to find entries containing 'powershell', 'WindowStyle', and 'Hidden'. Look for detailed context and parameters that may validate the intention.

  - **Identify Associated File Paths:**
    In the same logs, check for malicious indicators such as the script execution path. Alert on entries that do not belong to trusted software or exhibit unusual behavior (e.g., paths starting with `C:\Program Files\`).

  - **Inspect Process Creation Events:**
    Verify related process creation by looking for Security Event ID 4688 or Sysmon Event ID 1 logs. Investigate the parent process ID and command line arguments that initiated PowerShell activity. Legitimate process usage may involve commonly used Microsoft applications starting PowerShell.

  - **Monitor User Activity:**
    Check user activity around the time of the execution. If the hidden PowerShell instance occurred during a time of low user activity or from a non-admin account, flag this as suspicious and warrant further scrutiny.

  - **Correlate with Other Alerts:**
    Investigate other related alerts or logs that mention unusual PowerShell usage or potential data exfiltration. Cross-reference with network monitoring for any authorized data transfer anomalies or unexpected connections.

  ### Prioritization

  This alert is of medium severity due to the potential for malicious use, as hidden PowerShell executions may be used in data exfiltration or persistence techniques. While the infrequency of legitimate usage can raise flags, the likelihood that such behavior is tied to a broader attack vector makes it worthy of prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques by attackers who may obfuscate PowerShell commands or use legitimate scripts that leverage similar functionalities without malicious intent. Effective logging must be ensured through appropriate PowerShell security configurations, particularly enabling Script Block Logging. Legitimate applications, especially those involved in automation (e.g., Windows services), may trigger this alert. Companion detections such as monitoring for unusual outbound network connections can complement the visibility into this activity.

