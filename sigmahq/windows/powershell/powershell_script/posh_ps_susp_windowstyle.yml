title: Suspicious PowerShell WindowStyle Option
id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
status: test
description: |
  Adversaries may use hidden windows to conceal malicious activity from the plain sight of users.
  In some cases, windows that would typically be displayed when an application carries out an operation can be hidden
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.003/T1564.003.md
author: frack113, Tim Shelton (fp AWS)
date: 2021-10-20
modified: 2023-01-03
tags:
- attack.stealth
- attack.t1564.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'WindowStyle'
    - 'Hidden'
  filter:
    ScriptBlockText|contains|all:
    - ':\Program Files\Amazon\WorkSpacesConfig\Scripts\'
    - '$PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_windowstyle/info.yml
note: |
  ### Technical Context

  This rule detects the use of PowerShell scripts that incorporate the ‘WindowStyle’ parameter, specifically with the value set to ‘Hidden’. Malicious actors often leverage this technique to execute scripts invisibly, avoiding detection by users and security monitoring tools. The likely objective here is to perform actions without user awareness, potentially as part of a broader exploitation strategy.

  The relevant MITRE ATT&CK tactic is **Impact** and the technique is **Obfuscated Files or Information (T1027)**, specifically the sub-technique **PowerShell - T1564.003**. The primary telemetry source is Windows PowerShell script logging, which requires that Script Block Logging is enabled. If malicious, such activity can lead to data exfiltration, privilege escalation, or deployment of further malware. Importantly, this detection does NOT inherently confirm malicious activity—it indicates potential misuse of a standard administrative tool.

  ### Investigation Steps

  - **Review PowerShell Script Execution Context:**
    Check Event ID 4104 for the specific Script Block that triggered the alert. Ensure the affected script is not executed from a trusted directory or known initial context.

  - **Assess the PowerShell Command:**
    Analyze the full ScriptBlockText for indicators of nefarious usage. Look for other common malicious patterns or commandlets—particularly any that manipulate system settings or extract sensitive data.

  - **Identify Legitimate Usage:**
    Compare against known benign scripts that utilize similar PowerShell execution patterns, especially those related to WorkSpaces or automation settings, originating from trusted locations like `C:\Program Files\Amazon\WorkSpacesConfig\Scripts\`.

  - **Check for External Command Execution:**
    Look for Event ID 4688 to identify any parent processes that spawned the PowerShell process. Investigate if there are other related executables or processes that were simultaneously launched, which may indicate a multi-step attack.

  - **Verify Logged Script Parameters:**
    Confirm if the ‘WindowStyle’ parameter was indeed set to ‘Hidden’ in Event ID 4104. Note that the presence of ‘Hidden’ is unusual without valid reasons and can signify malicious intent.

  - **Assess Impact on Critical Assets:**
    Determine if the script was executed on high-value assets, such as domain controllers or endpoints with sensitive data, which would elevate the potential impact of the detected activity.

  ### Prioritization

  The alert should be considered medium severity due to its potential for abuse; hidden PowerShell commands can enable a range of malicious activities. The likelihood of exploitation is moderate given that typical administrative tasks can also employ similar patterns but are less common in practice.

  ### Blind Spots and Assumptions

  Detection may be evaded if Script Block Logging is disabled or if scripts use alternative means to execute (e.g., encoded commands). Additionally, legitimate administrative scripts may also invoke hidden windows for valid purposes, leading to false positives. Complementary detections for monitoring unauthorized scripts or abnormal PowerShell activity can enhance visibility and reduce blind spots. Consider monitoring for **PowerShell Profile modifications (T1086)** as a related countermeasure.

