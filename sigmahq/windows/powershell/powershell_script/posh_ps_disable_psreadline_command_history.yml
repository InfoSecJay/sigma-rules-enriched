title: Disable Powershell Command History
id: 602f5669-6927-4688-84db-0d4b7afb2150
status: test
description: Detects scripts or commands that disabled the Powershell command 
  history by removing psreadline module
references:
- https://twitter.com/DissectMalware/status/1062879286749773824
author: Ali Alwashali
date: 2022-08-21
tags:
- attack.stealth
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Remove-Module
    - psreadline
  condition: selection
falsepositives:
- Legitimate script that disables the command history
level: high
note: |
  ### Technical Context

  This detection rule identifies attempts to disable PowerShell command history by removing the `psreadline` module. Attackers often seek to obscure their activities within PowerShell, enhancing stealth and complicating post-incident investigations. The relevant MITRE ATT&CK technique for this behavior is "T1070.003 - Indicator Removal on Host." Primary telemetry sources include PowerShell script logging, specifically focusing on events generated from enabled Script Block Logging.

  If an attacker successfully disables command history, they can execute commands without leaving traces, significantly increasing their potential threat. However, this detection alone does NOT confirm malicious intent, as legitimate scripts may also perform this action for valid administrative reasons.

  ### Investigation Steps

  - **Inspect PowerShell event logs:** Query Security Event ID 4104 for Script Block logs that contain "Remove-Module" and "psreadline." Look for scripts without trusted signatures or those running from unexpected locations, which can indicate malicious behavior.

  - **Analyze user context:** Verify the user account executing the commands. Look for unusual user account activities in conjunction with the log entries (e.g., Event ID 4624 for successful logons). Legitimate administrative tasks should typically be performed by known admin accounts during regular operational hours.

  - **Check system state:** Evaluate the state of the `psreadline` module on the affected system using PowerShell cmdlet `Get-Module`. Ensure that the module is not missing when it's expected to be present. If it is missing without clear administrative action, investigate further.

  - **Evaluate script origins:** Cross-reference the script execution with the origin of the scripts (e.g., Script paths in Event ID 4104). Unmanaged or unexpected execution sources may indicate malicious scripts.

  - **Identify concurrent alerts:** Review recent alerts for other security events linked to the account or system where this detection triggered. A combination of alerts, such as privilege escalation (T1068) or lateral movement (T1075), can point to more extensive compromise.

  ### Prioritization

  This alert is of high severity due to the potential for significant security impact if the system is compromised. The ability to obfuscate PowerShell command history is frequently weaponized by attackers to evade detection, elevating the risk level in a mature enterprise environment.

  ### Blind Spots and Assumptions

  Detection may miss cases where attackers use alternative methods to disable command history or employ obfuscation techniques. Additionally, if Script Block Logging is not enabled, this rule will not trigger, creating gaps in visibility. Legitimate administrative scripts could yield false positives when disabling command history. A companion detection to consider is alerting on abnormal PowerShell execution patterns, which could indicate broader misuse.

