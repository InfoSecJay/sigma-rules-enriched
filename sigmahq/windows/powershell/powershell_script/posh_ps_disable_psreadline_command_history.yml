note: |
  ### Technical Context

  This rule detects actions where an attacker attempts to disable PowerShell command history by removing the `psreadline` module. This behavior is typically employed to conceal evidence of malicious activity, as command history can be instrumental in piecing together an attacker's methods and actions. The likely attacker objective is the enhancement of stealth during post-exploitation activity, ensuring their actions in PowerShell are not logged or easily retrievable. This aligns with the MITRE ATT&CK technique for defense evasion: **T1070.003: Tainting Log Files**.

  The primary telemetry source for this detection is PowerShell Script Block Logging, which must be enabled to capture the necessary events. The security impact of this action is significant; if malicious, it could indicate ongoing compromise or preparation for further malicious actions without leaving a trace. Importantly, this detection alone does NOT confirm malicious intent; it may also capture legitimate administrative actions where command history is purposely disabled.

  ### Investigation Steps

  - **Review script block logging events**: Check for Security Event ID 4104 in the PowerShell logs. Look for entries that contain "Remove-Module psreadline" to identify instances where the command history has been disabled.

  - **Validate the legitimacy of the action**: Determine if the user account executing the command is an authorized administrator. Unexpected user accounts performing this action raise suspicion.

  - **Investigate related recent PowerShell commands**: Review the command history in security events (Event ID 4103) leading up to the removal of `psreadline`. Legitimate processes typically do not include the removal of core modules.

  - **Correlate with other administrative actions**: Look for other Security Event IDs (e.g., 4697 for services) that might indicate abnormal changes in system services or user privileges by the same account around the same timeframe.

  - **Identify potential file obfuscation tactics**: Examine for the presence of abnormal file creations or modifications in known PowerShell script locations (e.g., C:\Users\Username\Documents\WindowsPowerShell). Files with unusual names or sizes may indicate a malicious intent.

  ### Prioritization

  This alert is considered high severity due to the potential impact on the integrity of the affected system. The likelihood of malicious abuse is high, as removing PowerShell command history is a common tactic in both malware execution and advanced persistent threat (APT) groups to avoid detection. This behavior is frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like attackers restoring the `psreadline` module after execution. Reliable detection requires that PowerShell Script Block Logging is enabled and adequately configured. Legitimate activities that may trigger this alert involve authorized administrative scripts that disable command history for valid security reasons. A related detection to strengthen coverage could be a rule monitoring for unusual PowerShell process creation (e.g., Security Event ID 4688) to correlate potentially disruptive activities with command history modifications.

