title: Disable Powershell Command History
id: 602f5669-6927-4688-84db-0d4b7afb2150
status: test
description: Detects scripts or commands that disabled the Powershell command history
  by removing psreadline module
references:
- https://twitter.com/DissectMalware/status/1062879286749773824
author: Ali Alwashali
date: 2022-08-21
tags:
- attack.defense-evasion
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Remove-Module
    - psreadline
  condition: selection
falsepositives:
- Legitimate script that disables the command history
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of scripts or commands that disable PowerShell command history by removing the `psreadline` module. This action is commonly employed by attackers to evade detection by preventing command history from being logged, thus hiding their activities from security teams. The ability to manipulate PowerShell settings can be indicative of an attempt to maintain persistence or conduct further malicious activities without detection.

  Attackers leveraging this technique may aim to conduct reconnaissance, escalate privileges, or execute additional payloads while avoiding scrutiny from security monitoring tools. The relevant MITRE ATT&CK tactics for this behavior include **Defense Evasion** (ID: TA0005) and specifically the technique **Indicator Removal on Host: Deletion of Event Logs** (ID: T1070.003). The data sources most pertinent for detecting this behavior are PowerShell script block logs, which capture command execution details that might not be visible through normal event logging.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Examine PowerShell script block logs for instances of `Remove-Module` or similar commands involving `psreadline`. Ensure that logging is properly configured to capture these events.
  - **Correlate with User Activity:** Investigate user activity surrounding the time of the command execution. Look for unusual account behavior or patterns that may indicate malicious intent.
  - **Analyze System Changes:** Check for any unexpected changes in system configuration or user permissions that may correlate with the disabling of command history.
  - **Cross-reference with Other Logs:** Utilize additional telemetry, such as Windows Event Logs or EDR data, to identify any subsequent PowerShell execution or suspicious processes initiated by the account in question.

  ### Prioritization
  The alert's severity is high due to the direct implications for security monitoring; if an attacker can disable command history, it poses a significant risk for undetected malicious activity within the environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection if PowerShell script block logging is not enabled or properly configured, as this could prevent the capture of related commands. The detection logic assumes that the removal of the `psreadline` module is anomalous behavior within the given context, which may not account for legitimate administrative actions. Required configurations include ensuring that Script Block Logging is enabled on all relevant systems to facilitate the detection of such commands effectively.

