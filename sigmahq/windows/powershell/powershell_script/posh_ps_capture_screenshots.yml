logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: '.CopyFromScreen'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `CopyFromScreen` method within PowerShell scripts, which is typically employed by attackers to capture screenshots of a compromised host's desktop. This behavior can signal post-compromise activity where adversaries seek to gather sensitive information displayed on the screen, such as credentials or data residing in applications. The effective use of this technique can provide attackers with insights into user behaviors, system configurations, and potential targets for their subsequent actions.

  The relevant MITRE ATT&CK tactics concerned with this behavior include **Collection** (TA0009) and the associated technique **Screen Capture** (T1113). Attackers may incorporate this method as part of a broader operation, potentially leveraging remote access tools (RATs) to achieve their objectives. The primary data source for this detection will be PowerShell script logs, specifically requiring Script Block Logging to be enabled for adequate observation of PowerShell commands and scripts executed within the environment.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Check relevant logs where Script Block Logging is enabled for occurrences of the `CopyFromScreen` method, focusing on the context in which it was called.
  - **Correlate User Activity**: Investigate user sessions during the time of the detection to identify potentially malicious behavior or any unauthorized remote access prior to the invocation of the screen capture command.
  - **Examine Running Processes**: Analyze currently running processes for any known remote access tools or suspicious applications that may have initiated the screen capture command.
  - **Identify External Communication**: Look for unusual outbound connections from the system involved to external IPs or domains, indicating potential data exfiltration or command-and-control (C2) activity.

  ### Prioritization
  This alert is assigned medium severity due to the potential implications of unauthorized screen captures on user privacy and data confidentiality. If an attacker successfully captures sensitive screen information, it could lead to further compromises within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detecting variations of screen capturing techniques that do not utilize PowerShell or employ non-standard methods. The detection logic assumes that Script Block Logging is enabled across relevant systems; if not, the rule may not function correctly, leading to missed detections. Additionally, environments that heavily utilize PowerShell may generate false positives, necessitating careful analysis and tuning of the rule to minimize noise.

