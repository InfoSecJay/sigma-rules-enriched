note: |
  ### Technical Context

  This rule detects the use of the `.CopyFromScreen` method in PowerShell scripts, which indicates that an entity may be attempting to capture screenshots of a system's desktop. The likely attacker objective is to gather sensitive information, such as passwords or confidential documents, during a post-compromise phase, facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1113: Screen Capture.

  Primary telemetry sources include PowerShell script logs with enabled Script Block Logging. The security impact upon malicious execution could lead to data leakage of sensitive information. It's important to note that this detection does NOT confirm that an adversary is present on the system, as legitimate applications may also invoke screen capture functionality.

  ### Investigation Steps

  - **Review PowerShell Logs:** Check for PowerShell script block logs (Event ID 4104) containing `.CopyFromScreen`. Malicious scripts may display abnormal or suspicious activity not typical in normal user behavior.

  - **Correlate with User Context:** Identify the user account triggering this detection. Legitimate tech support or training staff may require screen capture temporarily, while anomalous accounts should raise suspicion.

  - **Analyze Process Creation Events:** Look for Sysmon Event ID 1 and Security Event ID 4688 for process creation events that have `powershell.exe` with the script invocation containing `.CopyFromScreen`. Confirm if this process execution aligns with benign user activities or workflows.

  - **Investigate Network Activity:** Review network logs for unusual outbound connections during or immediately after the detection, particularly from endpoints triggering the alert. Check proxies or firewalls for any data exfiltration attempts.

  - **Validate Script Environment:** Ensure that Script Block Logging is enabled in the PowerShell environment. Analyze related scripts and functions to identify additional malicious methods used alongside `.CopyFromScreen`.

  ### Prioritization

  This alert is of medium severity due to the potential data leakage from screen captures. The likelihood of malicious abuse is moderate as such screen capture techniques are commonly utilized in advanced persistent threats (APTs) and post-exploitation scenarios. The impact is potentially significant if sensitive data is compromised, particularly on critical systems.

  ### Blind Spots and Assumptions

  Detection may be circumvented through obfuscation techniques or use of legitimate software with similar functionality. Proper log sources, specifically enabling Script Block Logging, are essential for reliable detection. Legitimate activities may include training sessions or support tasks, which can unintentionally trigger the alert. A related detection is monitoring for the provisioning or use of known remote access tools, enhancing coverage against screen capture usage in conjunction with remote sessions.

