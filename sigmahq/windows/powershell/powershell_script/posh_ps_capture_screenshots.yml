note: |
  ### Technical Context

  This Sigma rule detects the use of the `CopyFromScreen` method in PowerShell scripts, likely indicating an attempt by an adversary to capture screenshots of a user's desktop. The primary objective behind this behavior is information gathering, which can provide valuable data for further exploitation or intrusion. This action aligns with the MITRE ATT&CK technique T1113 (Screen Capture), under the collection tactic.

  The primary telemetry sources for detection are Windows PowerShell script logs, specifically those generated by script block logging in PowerShell. If exploited, this behavior can lead to unauthorized access to sensitive information displayed on the screen, potentially leading to data breaches or enablement of further malicious activity. Importantly, this detection alone does not confirm that a malicious actor is responsible; it merely indicates that a script utilizing screen capture functionality has executed.

  ### Investigation Steps

  - **Check for Script Block Logging:** Ensure that Script Block Logging is enabled on the host. This is crucial as the detection relies on these logs. Look for logs under `Windows PowerShell` with Event ID 4104 containing script block text.

  - **Identify the executing context:** Review the execution context of the PowerShell script. Check for processes listed in `Event ID 4688` (new process creation) to see which user executed the script, noting unusual accounts with admin privileges.

  - **Review script contents:** Inspect the contents of the captured scripts in the logs for the presence of `.CopyFromScreen`. Track the associated script IDs and timestamp for correlation with user activity.

  - **Analyze user activity:** Assess if the user is engaged in legitimate activities (such as remote support or testing) that would necessitate screen capture. Legitimate activities may include remote desktop sessions or usage of legitimate remote access software.

  - **Identify high-confidence malicious indicators:** Look for signs of unusual persistence or post-exploitation behavior, such as scripts running from non-standard directories or executed by unexpected accounts. Correlate with Event ID 4672 (Special privileges assigned to new logon) to identify privilege escalation.

  - **Validate potential exfiltration:** Check for any outbound data transfers following the screen capture, such as unusual file creation or transfers that could indicate exfiltration. Review Windows Event IDs 4663 for file access patterns.

  ### Prioritization

  This alert has medium severity given that the affected systems may involve sensitive user data. The risk of exploitation is moderate; while screen capture can be used by legitimate tools, its use in a compromised environment is often associated with malicious intent. The behavior is sometimes weaponized by threat actors during post-compromise operations.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation attempts or evasion techniques, such as encoding the function calls or using different methods to capture screens. Accurate detection requires Script Block Logging to be enabled; without it, legitimate PowerShell scripts may inadvertently trigger the alert due to common usage scenarios like remote troubleshooting. Consider companion detections like logs of remote access tools to improve context and support investigations into potential screen capture activities.

