note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell `Import-Module` cmdlet to load the `Microsoft.ActiveDirectory.Management.dll` library. In many cases, this behavior indicates potential enumeration of Active Directory (AD) resources, which is a technique frequently employed by attackers to gather information about the environment. An attacker may aim to discover user accounts, group memberships, and other critical details about the organizational structure, which can facilitate further attacks such as privilege escalation or lateral movement.

  The relevant MITRE ATT&CK tactics associated with this detection include **Reconnaissance** (TA0053) and **Discovery** (TA0007). The specific technique that pertains to this rule is **Active Directory Enumeration** (T1069). The presence of the `Microsoft.ActiveDirectory.Management.dll` library in a PowerShell script may signify an attempt to leverage administrative features, making it crucial to identify any unauthorized or suspicious usage.

  Primary data sources for this detection include PowerShell script block logging, which must be enabled to capture the events related to the execution of PowerShell commands. Additionally, reviewing process creation events tied to PowerShell activities can provide further insights into the context surrounding the code execution.

  ### Investigation Steps
  - **Review Script Block Logs:** Check PowerShell script block logs for instances of `Import-Module Microsoft.ActiveDirectory.Management.dll`. Look for unusual execution contexts or user accounts that may indicate malicious intent.

  - **Analyze Process Creation Events:** Investigate the process creation logs for the execution of PowerShell commands involving the AD module. Pay attention to the parent process to understand if it was initiated by an unexpected application or user.

  - **Correlate with User Behavior:** Assess the account used for the execution of the PowerShell script. Determine if the user typically performs Active Directory operations or if this is an outlier that may warrant further investigation.

  - **Check Network Activity:** Monitor for any subsequent network activity that may indicate ongoing enumeration or lateral movement within the environment, especially to sensitive systems or data repositories.

  ### Prioritization
  This alert has a medium severity level due to the potential risk posed by unauthorized AD enumeration activities. Given that an attacker often conducts reconnaissance to inform later actions, such detections should be taken seriously and prioritized accordingly.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if PowerShell script block logging is not enabled, which is a prerequisite for this rule to function properly. The detection logic assumes that any invocation of the `Microsoft.ActiveDirectory.Management.dll` for non-administrative tasks is suspicious, potentially leading to false positives if legitimate administrative work is conducted. Analysts must also consider that other methods of AD enumeration not involving this specific module may exist, which the rule does not cover.

