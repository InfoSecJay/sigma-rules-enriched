  ---

  ### Technical Context

  This rule detects attempts to load the "Microsoft.ActiveDirectory.Management.dll" DLL using the `Import-Module` cmdlet in PowerShell, which is often a precursor to Active Directory (AD) enumeration by attackers. The primary objective of the attacker is to gather information about AD objects, services, and users, potentially leading to further exploitation or lateral movement.

  This behavior aligns with the MITRE ATT&CK framework under the tactics of **Reconnaissance** (TA0043) and **Discovery** (TA0007), specifically techniques such as **Active Directory Enumeration** (T1069). The primary telemetry source for this detection comes from PowerShell Script Block Logging, which must be enabled. If this activity is malicious, it could lead to unauthorized access to sensitive AD information, enabling privilege escalation or credential harvesting. Importantly, this detection does NOT confirm malicious intent on its own, as the module can be legitimately used by administrators for valid tasks.

  ---

  ### Investigation Steps

  - **Check Script Block Logging status:** Ensure that Script Block Logging is enabled on the relevant hosts (Group Policy settings or local policy). Without logging, this detection will not be functional.

  - **Identify the executing user:** Review the PowerShell logs (Event ID 4104 for ScriptBlock logs) to identify the user executing the script. Compare this against known administrative roles; malicious activity is more likely from non-privileged users.

  - **Analyze the context of the command execution:** Assess the surrounding command inputs and parameters in the logs (e.g., Event ID 4104) for evidence of typical administrative usage versus unusual invocation patterns that may suggest malicious intent.

  - **Determine additional PowerShell commands executed:** Review the sequence of commands executed before and after the `Import-Module` command in the logs (Event ID 4104). Look for common enumeration commands such as `Get-ADUser`, `Get-ADGroup`, or `Get-ADOrganizationalUnit`.

  - **Look for related alerting behaviors:** Identify other alerts correlating with suspicious activities, such as unusual login times or attempts to access sensitive resources (using SIEM or log aggregation tools to correlate events across different types).

  - **Review asset criticality:** Consider the criticality of the affected domain controller or other involved assets. In particular, gain insight into whether the user’s activities align with roles appropriate for higher-privilege assets.

  ---

  ### Prioritization

  This alert should be treated with medium severity within an enterprise context. The impact of unauthorized AD enumeration can be significant, potentially leading to heightened risks of privilege escalation and lateral movement. While this behavior can be indicative of malicious activity, not all usage of the detection will be nefarious; thus, analysts must discern context carefully.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through PowerShell obfuscation techniques or disabling logging after the fact. Reliable detection requires that Script Block Logging is enabled and configured correctly across all servers handling AD queries. Legitimate administrative activities, including standard use of the AD module by IT staff, may trigger alerts, so context is critical. A related detection to strengthen coverage could involve monitoring for unexpected use of administrative PowerShell commands (e.g., creation or modification of AD objects).

