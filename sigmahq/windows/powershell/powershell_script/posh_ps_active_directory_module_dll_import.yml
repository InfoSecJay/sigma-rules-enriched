note: |
  ### Technical Context

  This Sigma rule detects the usage of the PowerShell cmdlet `Import-Module` to load the `Microsoft.ActiveDirectory.Management.dll`, indicating potential Active Directory (AD) enumeration. Attackers often use this command to gain insights into the AD environment, likely aiming to obtain user and group data or identify vulnerabilities for further exploitation. The relevant MITRE ATT&CK tactic is **Reconnaissance** and the technique is **Active Directory Enumeration (T1069)**.

  The primary telemetry source is PowerShell Script Block logging, which records script execution details. This detection suggests that a possibly malicious actor is gathering information about the AD environment, which could lead to privilege escalation or lateral movement if successful. However, this detection alone does not confirm malicious activity since legitimate administrators might also utilize this module for valid management tasks.

  ### Investigation Steps

  - **Review execution context:** Check the user account executing the script using Security Event ID 4624 for logon details. Legitimate administrative accounts might display regular working hours, whereas external accounts or unusual times could indicate misuse.

  - **Analyze script content:** Inspect the `ScriptBlockText` field in PowerShell logs for specific commands that follow the `Import-Module` statement. Look for patterns such as `Get-ADUser` or `Get-ADGroup` which indicate further enumeration attempts.

  - **Check for recent AD changes:** Query AD logs (Event ID 5136 from Directory Service) to identify if any groups or user attributes were altered around the time of detection. Malicious activity may correlate with unauthorized changes.

  - **Correlate with established baselines:** Compare the command execution with normal administrative activity within the environment. Regular administrative tasks should not frequently execute `Microsoft.ActiveDirectory.Management.dll` solely for enumeration.

  - **Identify high-confidence malicious indicators:** Flag occurrences where the `ipmo Microsoft.ActiveDirectory.Management.dll` command is executed repeatedly from non-administrative accounts or systems not typically used for AD maintenance.

  ### Prioritization

  This alert should be treated with medium urgency due to the potential impact on the environment from unauthorized AD enumeration. The detection of this activity suggests the likelihood of malicious use is elevated, especially if combined with other enterprise indicators of compromise. While PowerShell is a legitimate tool for admins, this specific Module is rarely needed for routine operations.

  ### Blind Spots and Assumptions

  Detection relies on PowerShell Script Block Logging being enabled, which may not always be the case in all environments, leading to missed enumeration attempts. Legitimate administrative scripts could lead to false positives if the usage of this module is common within the organization. A related detection to strengthen coverage would be monitoring for calls to sensitive AD functions like `Get-ADUser` or `Get-ADGroup` without proper context or authorization.

