note: |
  ### Technical Context

  This detection identifies suspicious PowerShell invocations by analyzing command parameters commonly associated with malicious activity, such as obfuscation techniques and execution of hidden scripts. Attackers often leverage PowerShell for activities like downloading and executing payloads in a stealthy manner, aiming to maintain a low profile during operation. The relevant MITRE ATT&CK tactic is Execution, and the technique is PowerShell (T1059.001).

  The primary telemetry source for this detection is Windows PowerShell script block logging. It requires detailed logs that capture the contents of executed scripts, particularly focusing on script blocks that include suspicious flags and command sequences. If malicious, successful execution of these commands could lead to unauthorized access or escalation of privileges. Importantly, this detection does NOT confirm a successful compromise on its own; it merely highlights potentially harmful execution patterns that warrant further investigation.

  ### Investigation Steps

  - **Verify the Script Block Logs:** Check Windows Security Event ID 4104 for PowerShell script block logging. Focus on recently executed scripts that contain the parameters `-nop`, `-c`, `-w`, or terms like `hidden`. These are common indicators of obfuscated commands.

  - **Analyze Execution Context:** Determine the user account and the context under which the PowerShell command was executed (Event ID 4688). Pay attention to whether the command was initiated from a typical user session or an unexpected account, such as a service account or SYSTEM.

  - **Determine Legitimate vs Malicious Usage:** Compare the PowerShell invocations against known legitimate administrative scripts (e.g., ones used for patch management or backup). Look for typical execution patterns involving benign parameters for commonly scheduled tasks.

  - **Identify High-Confidence Malicious Indicators:** Look for the presence of `Invoke-Expression (iex)` along with downloading commands like `New-Object System.Net.WebClient`. This combination is particularly indicative of attempts to fetch and execute remote scripts, which is a common tactic used in malware deployment.

  - **Correlate with Additional Threat Intelligence:** Cross-reference the detected PowerShell invocations with known malicious hashes or URLs linked to previous incidents. Utilize threat intelligence feeds to verify if the command attempts correspond to known malware behavior.

  - **Check for Malware Presence:** If suspicious command patterns are confirmed, conduct a full malware scan on the originating host with additional focus on common indicators of compromise (IOCs). Validate any file creation or network artifacts that indicate the execution of a malicious payload.

  ### Prioritization

  This alert is considered high severity due to the direct association of the detected PowerShell commands with known malicious behaviors. The potential impact on the systems involved is significant, particularly if administrative privileges are abused. The likelihood of this behavior being weaponized is high in modern threat landscapes, where attackers regularly use PowerShell for exploitation.

  ### Blind Spots and Assumptions

  Detection may miss certain evasion techniques, such as obfuscated PowerShell commands that do not match the identified patterns but are still malicious. Reliance on script block logging necessitates ensuring it is enabled; otherwise, detection will not occur. Legitimate activities, such as administrative scripts utilizing `-windowstyle hidden`, may trigger the alert, leading to potential false positives. A related detection rule focused on detecting encoded PowerShell command executions (e.g., `-Enc`) can enhance coverage against varied attack vectors.

