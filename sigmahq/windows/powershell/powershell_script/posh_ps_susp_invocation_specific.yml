logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_convert_b64:
    ScriptBlockText|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex_selection:
    ScriptBlockText|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc_selection:
    ScriptBlockText|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg_selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    ScriptBlockText|contains:
    - '\software\microsoft\windows\currentversion\run'
    - '\software\wow6432node\microsoft\windows\currentversion\run'
    - '\software\microsoft\windows\currentversion\policies\explorer\run'
  selection_webclient_selection:
    ScriptBlockText|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    ScriptBlockText|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    ScriptBlockText|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - "(New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1')"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious PowerShell invocations that may indicate malicious activity. Attackers often utilize PowerShell for exploitation, leveraging its capability to execute commands or scripts in a stealthy manner, making it a favored tool for lateral movement, privilege escalation, and execution of payloads. The rule focuses on specific command parameters that are frequently associated with obfuscation techniques and the execution of malicious scripts, such as encoding and hidden execution modes.

  Threat scenarios encompass attackers aiming to execute malicious payloads or persist within the environment by exploiting PowerShell capabilities. Common objectives may include downloading further malware, modifying system configurations, or installing backdoors on compromised systems. These actions align with MITRE ATT&CK techniques such as "Scripting" (T1064), "PowerShell" (T1059.001), and "Command-Line Interface" (T1059).

  Primary data sources for effective detection include PowerShell script block logging, which captures the execution of PowerShell commands and any embedded parameters, as well as process creation logs that can reveal when PowerShell is invoked with suspicious flags or configurations.

  ### Investigation Steps
  - **Review PowerShell Script Blocks:** Analyze the PowerShell script block logs for any instances of execution containing the suspicious flags or terms identified in the detection logic, such as `-nop`, `-w`, `hidden`, and `-Enc`.
  - **Investigate Process Creation Events:** Check process creation logs to identify PowerShell processes initiated around the same time as the suspicious script block activity, paying particular attention to command line arguments that indicate potential obfuscation.
  - **Query for System Modifications:** Look through registry changes, especially within the paths of `Run` and `Policies\Explorer\Run`, for any unauthorized updates that might indicate persistence mechanisms being established.
  - **Correlate with External Activity:** If applicable, review outbound connections or download requests associated with PowerShell invocations, particularly those involving `System.Net.WebClient` and any access to known malicious URLs.

  ### Prioritization
  Given that PowerShell is a powerful tool frequently misused for nefarious purposes, alerts generated by this rule should be treated with high severity. These alerts can indicate immediate threats within the environment that compromise security posture and pose risks for data exfiltration or system integrity.

  ### Blind Spots and Assumptions
  One key blind spot in this detection rule is the reliance on PowerShell script block logging being enabled on all endpoints, as disabled logging will result in missed detections. The logic assumes that any invocation including the specified parameters is suspicious without considering the context of legitimate PowerShell use, which could lead to false positives. Additionally, without enriched telemetry such as user behavior analytics or context about user permissions, further analysis may be required to ascertain the legitimacy of the activity.

