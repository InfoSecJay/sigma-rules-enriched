logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_convert_b64:
    ScriptBlockText|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex_selection:
    ScriptBlockText|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc_selection:
    ScriptBlockText|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg_selection:
    ScriptBlockText|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    ScriptBlockText|contains:
    - '\software\microsoft\windows\currentversion\run'
    - '\software\wow6432node\microsoft\windows\currentversion\run'
    - '\software\microsoft\windows\currentversion\policies\explorer\run'
  selection_webclient_selection:
    ScriptBlockText|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    ScriptBlockText|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    ScriptBlockText|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - "(New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1')"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell invocations characterized by specific command parameters often associated with malicious activities, such as invoking scripts in encoded formats and suppressing output. The attacker’s likely objective is to execute malicious scripts while evading detection, often for purposes like data exfiltration or privilege escalation. This activity aligns with the MITRE ATT&CK framework under the Execution tactic (TA0002), specifically the PowerShell technique (T1059.001).

  Primary telemetry sources include Windows PowerShell script logs, specifically those generated with Script Block Logging enabled. The security impact may be significant if malicious, potentially resulting in system compromise or unauthorized data access. However, this detection alone does not confirm malicious intent as legitimate administrative tasks could trigger similar PowerShell invocations.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Investigate PowerShell logs (Event ID 4104) for ScriptBlockText containing suspicious parameters like '-nop', '-w', 'hidden', and ' -c '. Look for unusual base64 encoded commands.

  - **Identify Known Malicious Use Cases:** Check for the presence of command strings such as '[Convert]::FromBase64String', 'iex', or 'New-Object System.Net.WebClient' which typically indicate malicious usage when accompanied by flags to suppress visibility.

  - **Evaluate the Context of Execution:** Determine the execution context by identifying the user account running the script. Verify if the account has administrative privileges and whether this command aligns with expected operational behavior for that role.

  - **Assess Scheduled Tasks or Startup Registry entries:** Inspect for unauthorized entries in registry paths such as '\software\microsoft\windows\currentversion\run' or scheduled tasks triggered by the invoked PowerShell command to find persistence mechanisms.

  - **Cross-reference with Threat Intelligence:** Utilize threat intel databases to correlate IP addresses or URLs accessed by the PowerShell commands against known malicious or suspicious domains, particularly those related to script hosting.

  ### Prioritization

  This alert should be regarded as high severity due to the potential for significant impact on compromised systems and the likelihood that this behavior is weaponized by adversaries for execution of further malicious payloads.

  ### Blind Spots and Assumptions

  Detection may be circumvented by disabling Script Block Logging or employing command obfuscation. Reliable detection requires that Script Block Logging is consistently enabled across the environment. Legitimate administrative PowerShell scripts may trigger this rule, particularly those that adjust system configurations. A related detection that strengthens coverage is monitoring for abnormal PowerShell execution patterns, such as unusual process parents (e.g., cmd.exe or wscript.exe spawning PowerShell).

