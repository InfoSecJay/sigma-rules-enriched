note: |
  ### Technical Context

  This Sigma rule detects the execution of specific commands from the DSInternals PowerShell module, which is capable of performing sensitive operations on Active Directory (AD) and Azure AD, such as dumping DPAPI backup keys and manipulating NTDS.DIT files. The likely attacker objective includes gaining unauthorized access to sensitive account information or leveraging administrative control over the directory services.

  This activity corresponds to the MITRE ATT&CK techniques ‘Execution’ (T1059.001). The primary telemetry sources are Windows PowerShell logs with requirements for Script Block Logging to be enabled. Malicious activities related to this detection can compromise AD security and potentially lead to unauthorized access to credentials or accounts. However, it does not confirm intent of misuse without additional context, as legitimate administrative activity may invoke similar command patterns.

  ### Investigation Steps

  - **Review execution details:** Examine PowerShell logs (Event ID 4104) for Script Block logging to identify the full command scripts and their execution context, particularly looking for anomalies around user accounts not typically making such requests.

  - **Check user context:** Verify the user or process executing these commands using Event ID 4624 (Successful Logon). Determine if the user has valid administrative permissions that would warrant this command execution.

  - **Identify benign activity:** Cross-reference the command execution time with the organization's scheduled administrative tasks, such as system backups or security audits, to validate if they are part of expected operational behavior for system administrators.

  - **Look for high-confidence indicators:** Focus on specific command strings like ‘Get-ADDBBackupKey’ or ‘Save-DPAPIBlob’ in the logs (Event ID 4104) as strong indicators of potential malicious intent.

  - **Validate system impact:** If a command was run against a domain controller or critical server (as noted in Event ID 4672 for special privileges), assess the implications of that action and possible responses needed.

  - **Correlate with related detections:** Monitor for related alerts regarding unauthorized Active Directory changes or unusual account activity (e.g., Event ID 4720 for user creation) that overlaps with the times these PowerShell commands were executed.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on Active Directory integrity and overall system security. The ability to manipulate sensitive components of AD indicates a likely adversary trying to escalate privileges or exfiltrate credentials. Although the use of such commands could also be legitimate, their application in inappropriate contexts suggests a significant risk of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by PowerShell Script Block Logging not being enabled on all hosts, potentially allowing malicious behavior to go unrecorded. Additionally, administrative operations could trigger this alert if improperly used. Companion detections like unauthorized account lockouts or suspicious modifications to account privileges should be monitored for enhanced coverage of potential threats.

