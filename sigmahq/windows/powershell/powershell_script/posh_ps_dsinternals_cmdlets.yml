note: |
  ### Technical Context
  This detection rule identifies the execution of the DSInternals PowerShell module, which is often used in suspicious activities such as dumping DPAPI backup keys or manipulating the NTDS.DIT files. Attackers may utilize this module to perform sensitive operations within Active Directory, potentially leading to unauthorized access or privilege escalation. The presence of these activities typically suggests that an attacker is attempting to compromise the security of Active Directory environments by obtaining sensitive information or modifying critical components.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution** (TA0002) and the technique of **Command-Line Interface** (T1059.001). These techniques highlight that adversaries might execute malicious PowerShell commands to interact with the system and obtain critical data. Organizations must monitor for such commands as they may indicate malicious intent, potentially paving the way for further attacks on the network.

  Primary data sources for this alert include Windows PowerShell script block logging, which reveals the commands being executed. Implementing this logging capability is crucial for effective monitoring, allowing analysts to capture instances of DSInternals usage and correlate them with other suspicious activities.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell script block logs for any occurrences of the detected commands related to the DSInternals module. Look for timestamps that correlate with other suspicious events.
  - **Audit Active Directory Access**: Investigate any recent changes made to Active Directory objects, especially those that utilize the commands flagged in the detection rule (e.g., `Get-ADDBBackupKey`, `Set-ADAccountPasswordHash`).
  - **Correlate with User Behavior**: Analyze the context of the user executing these commands. Consider whether the user has legitimate administrative roles or if this usage appears anomalous, suggesting possible credential compromise.
  - **Check for Other Indicators**: Look for any other potentially malicious activities or anomalies on the systems where the DSInternals module was executed, including unusual logins, privilege escalations, or unauthorized access to sensitive directories.

  ### Prioritization
  Given the significant impact that unauthorized actions against Active Directory can have on an organization's security posture, this alert is prioritized as high in severity. The likelihood of malicious use of DSInternals to manipulate critical identity components necessitates immediate investigation.

  ### Blind Spots and Assumptions
  This detection may have blind spots if PowerShell script block logging is not enabled or correctly configured, resulting in missed events. The rule assumes that the commands listed in the detection logic are indicative of malicious activity, which could lead to false positives in legitimate administrative scenarios. Consistent logging of script blocks is critical; without it, the alert would not function effectively and might not capture all relevant activity.

