note: |
  ### Technical Context

  This Sigma rule detects the execution of specific PowerShell cmdlets associated with the DSInternals PowerShell module, which exposes internal Active Directory features. The behavior observed could indicate an attacker attempting to access sensitive credentials, manipulate data structures (like NTDS.DIT files), or conduct unauthorized administrative activities. Relevant MITRE ATT&CK tactics include Execution (TA0002) and Command and Scripting Interpreter (T1059.001).

  The primary telemetry source is PowerShell script block logging, which requires enforcement through Group Policy settings. If malicious, the activities could lead to a significant security impact, such as credential theft, unauthorized access to accounts, or Active Directory manipulation. However, this detection does not confirm that the activity is malicious on its own, as legitimate administrative activities may trigger the same command executions.

  ### Investigation Steps

  - **Check script block logging configuration:** Verify that PowerShell script block logging is enabled on the system (Group Policy setting: `Turn on PowerShell Script Block Logging`) and that relevant logs are being collected.

  - **Review PowerShell logs for suspicious cmdlet usage:** Analyze PowerShell logs (Event ID 4104) for any executions of detected cmdlets such as `Get-ADDBBackupKey` or `Save-DPAPIBlob`. Look for characteristics such as unusual timestamps or execution context (user accounts).

  - **Identify the context of execution:** Determine if the cmdlets were run by domain administrators or other privileged users. Normal administrative activities may include password policy checks or credential management, but unexpected execution by non-admin users warrants further scrutiny.

  - **Correlate with other telemetry:** Cross-reference findings with Windows Security Logs (Event ID 4624) to identify associated user logins during the timeframe of the cmdlet execution. Determine if there are lateral movement patterns or suspicious access.

  - **Examine for high-confidence malicious behavior:** Look for indicators such as excessive or unusual cmdlet invocations in a short period, indicating potential credential dumping or privilege escalation attempts (e.g., using `ConvertTo-NTHash`).

  - **Evaluate host role:** Assess whether the affected host is a Domain Controller or contains sensitive data. Higher criticality may necessitate a more urgent response and deeper investigation on Domain Controllers.

  ### Prioritization

  The alert severity is high due to the potential impact on Domain Controller integrity and the likelihood of malicious abuse by adversaries aiming to compromise Active Directory. Furthermore, the capabilities provided by DSInternals are commonly exploited for malicious purposes, increasing the urgency of the investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative tasks triggering false positives. As such, it's crucial to maintain proper context for user activity. Additionally, script block logging must be properly configured on all relevant systems to ensure coverage. Legitimate administrative use of the DSInternals module may occur, but companion detections, such as monitoring for repeated failed accesses to sensitive accounts, can strengthen overall detection efficacy.

