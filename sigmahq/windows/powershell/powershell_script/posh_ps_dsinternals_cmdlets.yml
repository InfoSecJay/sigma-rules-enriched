note: |
  ---

  ### Technical Context

  This rule detects the execution of potentially malicious PowerShell commands from the DSInternals module, which allows manipulation of Active Directory objects and access to sensitive information, including password hashes and cryptographic keys. The likely attacker objective is to gain unauthorized access to system credentials or perform account manipulation, which can lead to lateral movement within an organization. Relevant MITRE ATT&CK techniques include **Execution via PowerShell (T1059.001)** as well as various techniques involving credential access.

  Primary telemetry sources include Windows PowerShell script logs with specific attention to Script Block Logging (required to be enabled for this detection). The security impact of malicious activity could be severe, leading to unauthorized data access and potential compromise of Active Directory environments. It is important to note that this detection alone does NOT confirm malicious intent; legitimate administrative tasks may also trigger this rule.

  ---

  ### Investigation Steps

  - **Verify Script Block Logging is enabled:** Check Group Policy or local settings to confirm that PowerShell Script Block Logging is enabled. If disabled, this detection won't function properly.

  - **Review logged PowerShell commands:** Look for Event ID 4103 in the Windows Security logs, focusing on the ScriptBlockText field for strings matching the DSInternals commands listed in the rule. Commands like `Get-ADDBAccount` or `Get-LsaBackupKey` are suspicious indicators.

  - **Identify the user context:** Ascertain the user account initiating the PowerShell commands. Capture relevant fields such as `UserName` and `ExecutionPolicy` from the logs to determine if the account shows anomalous behavior or patterns associated with previous incidents.

  - **Cross-reference with user roles:** Confirm if the executing user has legitimate administrative privileges or roles within Active Directory. Legitimate users may utilize these commands in authorized contexts, such as IT administrators performing maintenance.

  - **Check for unusual execution environments:** Investigate the host from which the script was run. Observe if the execution came from a non-standard environment or workstation not typically used for administrative tasks. Validate Event ID 4104, examining the `CallerPath` field for irregularities.

  - **Look for further indicators of compromise:** Gather other logs (like Windows Security Event ID 4624 for logon events) to see if there is a pattern of suspicious logins or actions correlated with the time frame of the detected command, indicating potential lateral movement or escalation attempts.

  ---

  ### Prioritization

  This alert is of high severity due to the critical nature of Active Directory environments. The likelihood of malicious abuse is significant, as the DSInternals module is commonly associated with advanced persistence and credential theft techniques. Given the specificity of the detected behavior, we can infer an intent to exploit sensitive information within the organization.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of elevated privileges being misused for legitimate administrative tasks, which may trigger false positives. The reliability of detection relies on the proper configuration of Script Block Logging, which, if not set, could lead to gaps in monitoring. Additionally, benign activities such as routine password audits may also trigger this alert. A companion detection to consider is monitoring for **PowerShell command-line execution (T1059.001)** in conjunction with audit logs, enhancing visibility into potentially malicious misuse of PowerShell.

