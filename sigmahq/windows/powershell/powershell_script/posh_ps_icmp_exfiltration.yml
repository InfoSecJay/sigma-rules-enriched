logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'System.Net.NetworkInformation.Ping'
    - '.Send('
  condition: selection
falsepositives:
- Legitimate usage of System.Net.NetworkInformation.Ping class
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential data exfiltration attempts over ICMP (Internet Control Message Protocol) using PowerShell scripts. Adversaries may leverage ICMP to covertly transfer data, taking advantage of its less scrutinized nature compared to traditional protocols like HTTP/HTTPS. The threat scenario typically involves an attacker who has already compromised a system and aims to discreetly exfiltrate sensitive data without attracting attention — ideally when monitoring controls are tuned to look for more conventional data transfer methods.

  The relevant MITRE ATT&CK tactics include **Exfiltration** (TA0010) and specifically the technique **Exfiltration Over Alternative Protocol - ICMP** (T1048.003). Primary data sources for detection include PowerShell script logs, specifically those generated by the Script Block Logging feature in Windows, which must be enabled for this rule to function effectively.

  ### Investigation Steps
  - **Review PowerShell logs:** Examine PowerShell script block logs, focusing on instances where the `System.Net.NetworkInformation.Ping` class is invoked, along with any functions that call `.Send(`, as these are indicative of potential exfiltration attempts.
  - **Analyze network traffic:** Inspect outbound network traffic for unusual ICMP traffic patterns, such as unexpected spikes in ICMP echo requests (pings) or responses, which may suggest covert data transfers.
  - **Cross-reference with incident context:** Correlate recorded activities with existing security alerts, user access logs, and system stable states, which may provide additional context around the execution of the suspicious PowerShell commands.
  - **Evaluate endpoint behavior:** Check the endpoint’s processes and any active connections during the time of the logged PowerShell activity to identify if there are concurrent unusual behaviors or connections to untrusted external IPs.

  ### Prioritization
  The severity of this alert is considered medium because while ICMP can indeed be a vector for exfiltration, it typically generates less traffic than most other protocols, potentially allowing for more stealthy operation by the attacker.

  ### Blind Spots and Assumptions
  A key blind spot in this detection logic is the possibility of legitimate administrative or system processes using ICMP, which can lead to false positives and requires careful contextual analysis. The detection assumes that Script Block Logging is enabled and properly configured on all relevant systems, which is not always the case in every enterprise environment. Additionally, significant actions taken via other protocols may go undetected if only ICMP is monitored, possibly leading to an incomplete picture of exfiltration attempts.

