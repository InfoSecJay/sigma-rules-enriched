logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'New-Object'
    - 'System.Net.NetworkInformation.Ping'
    - '.Send('
  condition: selection
falsepositives:
- Legitimate usage of System.Net.NetworkInformation.Ping class
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell scripts that utilize the `System.Net.NetworkInformation.Ping` class to exfiltrate data over ICMP, which is a method known as Exfiltration Over Alternative Protocol (T1048.003) in the MITRE ATT&CK framework. The likely attacker objective is to stealthily transmit sensitive information from the network to an external location, leveraging seemingly benign network traffic.

  The primary telemetry source is Windows PowerShell logs, specifically requiring Script Block Logging to be enabled. If malicious, this behavior represents significant security impact, exposing sensitive data without traditional detection methods. Importantly, this detection does NOT confirm that the data exfiltration was successful, nor does it indicate whether the action was indeed malicious without further contextual investigation.

  ### Investigation Steps

  - **Check PowerShell Logs for Event ID 4104**: Review the PowerShell logs to identify specific scripts that executed and contain 'New-Object', 'System.Net.NetworkInformation.Ping', and '.Send('. Investigate the context and the parameters used.

  - **Analyze Network Traffic for ICMP Activity**: Utilize network monitoring tools to analyze for excessive or anomalous ICMP traffic, particularly to unrecognized external IPs. Look for unusual patterns that correlate with the identified PowerShell execution.

  - **Identify Legitimate Use Cases**: Verify whether the PowerShell commands were initiated by legitimate administrative tasks or monitoring scripts. Document standard operational use of ICMP in your environment.

  - **Cross-reference with Asset Criticality**: Determine if the impacted host is a critical asset (e.g., domain controllers, servers). Investigate the user account executing the script for any previous suspicious behavior or elevated privileges.

  - **Look for Malicious Indicators**: Identify if the script attempts to access sensitive files or specific data payloads likely to be exfiltrated. Any encoding or obfuscation techniques used in the context of this traffic should be flagged as high confidence malicious.

  ### Prioritization

  The severity of this alert is medium due to the potential exfiltration of sensitive data from critical systems via ICMP. While ICMP is not traditionally associated with data transfers, the likelihood of malicious exploitation exists, especially if context suggests the data is sensitive.

  ### Blind Spots and Assumptions

  This detection may fail to capture obfuscation attempts such as base64 encoding or encrypted payloads sent over ICMP. Reliable detection requires proper configuration of PowerShell logging and continuous monitoring of ICMP traffic. Legitimate network diagnostics or monitoring activities can trigger this alert, requiring context to distinguish intent. Related detections could include monitoring for unusual file access patterns indicative of potential data theft prior to ICMP exfiltration.

