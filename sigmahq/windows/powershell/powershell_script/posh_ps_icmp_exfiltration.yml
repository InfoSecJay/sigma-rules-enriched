  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell to exfiltrate data over ICMP by utilizing the `System.Net.NetworkInformation.Ping` class. This behavior is indicative of an attacker attempting to bypass traditional security controls, leveraging ICMP as a covert communication channel to send data to an external destination. The relevant MITRE ATT&CK tactic is Exfiltration (TA0010), specifically the technique Exfiltration Over Alternative Protocol (T1048.003).

  The primary telemetry source for this detection is PowerShell script block logging, which must be enabled on the affected system. If this activity is malicious, it can have a significant security impact, potentially allowing sensitive data to leave the network unnoticed. However, it's important to note that this detection does NOT confirm that exfiltration occurred, as the same PowerShell commands could be executed in a benign context.

  ---

  ### Investigation Steps

  - **Inspect PowerShell logs for the triggering command:** Look for Event ID 4104 from PowerShell script block logging. Focus on logs containing `New-Object` and `System.Net.NetworkInformation.Ping`, which indicates an attempt to create a ping object, potentially for data exfiltration.

  - **Analyze the context of execution:** Determine the user and session context in which the command was executed. High-risk scenarios include execution by administrative accounts or uncommon user accounts. Check Event ID 4624 for logon events that match the PowerShell execution time.

  - **Identify network traffic patterns:** Use network monitoring tools to examine outbound ICMP traffic, particularly destination IP addresses and data sizes. Typical ICMP traffic is small and frequent, while malicious activities may involve more structured payloads and larger volumes.

  - **Correlate with other potential indicators of compromise (IoCs):** Look for additional suspicious behaviors, such as unusual outbound DNS queries or connections to known malicious C2 servers. Cross-reference with Event ID 5156 in Windows Firewall logs for blocked or allowed outbound connections.

  - **Review legitimate use cases:** Understand that legitimate administrative actions may involve the use of `System.Net.NetworkInformation.Ping`. Evaluate whether the activity aligns with documented processes, such as network diagnostics or monitoring, with a focus on expected scripts or command usage.

  - **Assess the asset role and importance:** Investigate the impact of the affected system—high-value systems (e.g., servers handling sensitive data) warrant more urgency in response. Confirm the asset's criticality through inventory or asset management systems.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for significant data loss if exploited. The likelihood of abuse is moderate, as ICMP exfiltration is less common than other methods, but it is increasingly utilized by sophisticated adversaries. Awareness and context around this behavior are crucial for timely and effective response.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell script block logging is not enabled or configured correctly. Additionally, legitimate network diagnostics could trigger this alert. It's important to have companion detections for unusual outbound traffic and administrative command executions to strengthen coverage against data exfiltration attempts via ICMP.

