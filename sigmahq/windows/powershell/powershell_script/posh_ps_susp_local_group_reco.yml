logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_localgroup:
    ScriptBlockText|contains:
    - 'get-localgroup '
    - 'get-localgroupmember '
  selection_wmi_module:
    ScriptBlockText|contains:
    - 'get-wmiobject '
    - 'gwmi '
    - 'get-ciminstance '
    - 'gcim '
  selection_wmi_class:
    ScriptBlockText|contains: 'win32_group'     # Covers both win32_group and win32_groupuser
  condition: selection_localgroup or all of selection_wmi_*
falsepositives:
- Inventory scripts or admin tasks
level: low
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell cmdlets and modules to enumerate local groups and their members on Windows systems, specifically targeting commands like `Get-LocalGroup` and `Get-LocalGroupMember`. Attackers may aim to identify user privileges by collecting information about local system groups, such as the presence of local administrators, to facilitate privilege escalation or lateral movement. The relevant MITRE ATT&CK techniques include Discovery tactics, specifically **Account Discovery (T1069.001)**.

  The primary telemetry sources include Windows PowerShell logs, specifically those reflecting script block logging, which must be enabled for effective detection. If exploited maliciously, this behavior could lead to unauthorized access or privilege escalation, significantly impacting security posture. It is critical to note that this detection does NOT confirm malicious intent on its own, as legitimate scripts and administrative tasks may trigger similar alerts.

  ### Investigation Steps

  - **Check script source and execution context:** Review PowerShell logs for Event ID 4104 to identify the source of the script execution. If the script originated from a known operational inventory device, it is likely benign.

  - **Identify specific cmdlet usage:** Look for Event ID 4104 entries containing `Get-LocalGroup`, `Get-LocalGroupMember`, or related WMI queries such as `Get-WmiObject -Class Win32_Group`. Focus on how often these commands are executed and from which user account.

  - **Review user privileges:** Use Active Directory monitoring to assess the user accounts involved, especially focusing on members of local administrator groups. Suspicious accounts (e.g., service accounts or non-administrative users executing these commands) may indicate malicious behavior.

  - **Analyze execution frequency and patterns:** Compare the frequency of the detected commands against baseline organizational usage patterns. Anomalous patterns, such as frequent execution during off-hours or from non-standard hosts, can signify potential compromise.

  - **Investigate related processes/job schedules:** Confirm whether any legitimate inventory or administrative scripts exist that utilize these cmdlets. Checking scripted tasks in Task Scheduler or invoking profiles in user home directories can provide context.

  - **Check for additional suspicious activity:** Look for correlated alerts or additional PowerShell activity indicative of enumeration or reconnaissance, utilizing security tool functionalities to filter by user actions during the alert timeframe.

  ### Prioritization

  The alert should be considered low priority unless correlated with other suspicious behaviors or executed by privileged accounts, which increases the likelihood of malicious intent. Such enumeration is weaponized in attack chains, particularly during the reconnaissance phase, making vigilance against this behavior important in defending critical systems.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is its susceptibility to evasion through legitimate scripts that may also invoke similar PowerShell commands, such as administrative scripts run by IT staff. The effectiveness of this detection relies on having PowerShell script block logging configured correctly. Additionally, benign administrative activities may trigger this alert, particularly in environments regularly performing audits of local groups. A companion detection, such as monitoring for abnormal remote PowerShell sessions or unusual administrative script execution times, would help strengthen overall security coverage.

