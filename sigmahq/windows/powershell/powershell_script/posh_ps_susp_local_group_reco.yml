description: |
  Detects the use of PowerShell modules and cmdlets to gather local group information.
  Adversaries may use local system permission groups to determine which groups exist and which users belong to a particular group such as the local administrators group.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.001/T1069.001.md
author: frack113
date: 2021-12-12
modified: 2025-08-22
tags:
- attack.discovery
- attack.t1069.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_localgroup:
    ScriptBlockText|contains:
    - 'get-localgroup '
    - 'get-localgroupmember '
  selection_wmi_module:
    ScriptBlockText|contains:
    - 'get-wmiobject '
    - 'gwmi '
    - 'get-ciminstance '
    - 'gcim '
  selection_wmi_class:
    ScriptBlockText|contains: 'win32_group'     # Covers both win32_group and win32_groupuser
  condition: selection_localgroup or all of selection_wmi_*
falsepositives:
- Inventory scripts or admin tasks
level: low
note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious use of PowerShell cmdlets that are commonly employed to gather information about local groups on Windows systems. These cmdlets include `Get-LocalGroup`, `Get-LocalGroupMember`, and several WMI commands that return information about user groups, such as `Get-WmiObject` and `Get-CimInstance`. Attackers may utilize this information to assess privilege levels and user memberships, particularly targeting local administrator groups to facilitate lateral movement or privilege escalation.

  The likely attacker objective is to enumerate user accounts and permissions within a system to identify potential targets for further exploitation. By understanding group memberships, adversaries can plan attacks that capitalize on elevated privileges or misconfigured permissions. The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and the specific technique **Account Discovery** (T1069.001).

  Primary data sources for this detection include PowerShell Script Block logs, which capture the execution of PowerShell commands, along with WMI query logs where applicable. Ensuring Script Block Logging is enabled is crucial for capturing this activity effectively.

  ### Investigation Steps
  - **Review PowerShell Logs:** Investigate PowerShell Script Block logs for instances of the detected cmdlets (`Get-LocalGroup`, `Get-LocalGroupMember`, `Get-WmiObject`, etc.), focusing on the context in which they were executed to determine whether they align with legitimate administrative activity.

  - **Examine User Account Listings:** Check the output of local group commands to identify any anomalous accounts or unexpected group memberships that could indicate an attacker gathering intelligence for further attacks.

  - **Investigate for Other Related Activities:** Correlate findings with other recent events on the host, such as logins from suspicious accounts, changes to group memberships, or abnormal outbound network connections, to build a more comprehensive view of potential malicious activity.

  - **Monitor Administrative Activity:** If legitimate administrative scripts are a possibility, ensure a review of the script execution context and confirm whether the scripts are following standard operational procedures.

  ### Prioritization
  Despite having a low severity level, this alert should not be dismissed, as continuous enumeration activities can indicate preparation for more serious attacks. If observed in conjunction with other suspicious behaviors, it could signify a higher threat level and warrant immediate investigation.

  ### Blind Spots and Assumptions
  This detection logic assumes that Script Block Logging is enabled; if it is not, the alert will not trigger despite potential malicious activity. Additionally, the rule may have blind spots for legitimate administrative scripts that carry out similar group enumeration actions, leading to false positives. Regular review of PowerShell commands used in approved admin scripts may help to refine detection accuracy.

