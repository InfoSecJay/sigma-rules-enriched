title: Suspicious TCP Tunnel Via PowerShell Script
id: bd33d2aa-497e-4651-9893-5c5364646595
status: test
description: Detects powershell scripts that creates sockets/listeners which could
  be indicative of tunneling activity
references:
- https://github.com/Arno0x/PowerShellScripts/blob/a6b7d5490fbf0b20f91195838f3a11156724b4f7/proxyTunnel.ps1
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-08
tags:
- attack.command-and-control
- attack.t1090
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '[System.Net.HttpWebRequest]'
    - 'System.Net.Sockets.TcpListener'
    - 'AcceptTcpClient'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell scripts that establish TCP sockets or listeners, which is a common behavior associated with tunneling activities. Attackers may use TCP tunneling to create covert channels for data exfiltration or remote command-and-control (C2) communication, circumventing traditional security measures. By leveraging PowerShell—which is built into Windows and often whitelisted—malicious actors can execute their tactics with a lower likelihood of detection.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Command and Control** (TA0011)
    - **T1090: Connection Proxy**: The use of tunneling allows the attacker to obfuscate their traffic and avoid detection.

  To effectively analyze this behavior, the primary data sources needed are:
  - PowerShell script block logs, which capture the contents of executed scripts, including any TCP-related functions.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logging to identify any scripts that create TCP listeners, focusing on specific commands like `TcpListener` and `AcceptTcpClient`.
  - **Inspect Network Traffic**: Analyze outbound network traffic for unusual connections, particularly any that correlate with the timestamps of the PowerShell script execution, to detect potential C2 activities.
  - **Evaluate Endpoint Behavior**: Check for processes spawned by PowerShell that may be establishing unauthorized connections, looking at both parent and child process relationships to identify the original trigger.
  - **Cross-Reference Indicators**: Compare identified behaviors and artifacts against threat intelligence to see if the detected PowerShell activity aligns with known malicious patterns or tools involved in tunneling.

  ### Prioritization
  This alert has medium severity due to the potential risk it poses; tunneling activities can facilitate data exfiltration, remote access, and exploitation of enterprise assets, making it crucial for security teams to address promptly.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include environments where PowerShell script block logging is not enabled or where other scripting tools are used instead. The detection logic assumes that the usage of the specified TCP-related commands correlates with malicious intent, which may not always be the case. For effective operation of this alert, PowerShell script block logging must be configured and enabled on all relevant endpoints.

