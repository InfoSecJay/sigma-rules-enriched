title: Suspicious TCP Tunnel Via PowerShell Script
id: bd33d2aa-497e-4651-9893-5c5364646595
status: test
description: Detects powershell scripts that creates sockets/listeners which 
  could be indicative of tunneling activity
references:
- https://github.com/Arno0x/PowerShellScripts/blob/a6b7d5490fbf0b20f91195838f3a11156724b4f7/proxyTunnel.ps1
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-08
tags:
- attack.command-and-control
- attack.t1090
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '[System.Net.HttpWebRequest]'
    - 'System.Net.Sockets.TcpListener'
    - 'AcceptTcpClient'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that establish TCP connections using `TcpListener` and `HttpWebRequest`, indicating potential tunneling activities typically employed by adversaries to create covert communication channels with compromised hosts. The primary objective of this behavior could be to facilitate command and control (C2) communications, allowing attackers to exfiltrate data or receive instructions from a remote server.

  The relevant MITRE ATT&CK tactics are **Command and Control (TA0011)**, specifically the technique **Application Layer Protocol (T1090)**. Primary telemetry sources include Windows PowerShell logs, specifically requiring Script Block Logging to be enabled (Event ID 4104). If detected, this behavior greatly impacts security, as it may indicate that an adversary has established persistent access to the environment. However, this detection does NOT confirm successful exploitation, persistence, or data compromise on its own.

  ### Investigation Steps

  - **Review the triggering PowerShell script**: Identify the script used in the alert by checking Windows Event ID 4104 for Script Block logs. Look for entries related to the `TcpListener` and `HttpWebRequest` components.

  - **Analyze the source IP address**: Cross-reference the originating IP address of the activity with known malicious IP lists and internal baselines using network logs. Identify whether the IP is associated with known threats or if it’s a typical user device.

  - **Correlate with user activity**: Examine recent user logon events (Security Event ID 4624) and interactions with systems to determine if the user typically runs PowerShell or similar scripts. Legitimate activity may include routine automation tasks created by system administrators.

  - **Inspect process creation logs**: Look for related process creation events (Security Event ID 4688 or Sysmon Event ID 1) initiated from PowerShell. Assess arguments passed to the PowerShell executable to identify unusual patterns or encoded commands.

  - **Evaluate outbound connections**: Review network connection logs for unusual outbound TCP connections (Firewall or Network Device logs). Specifically, check for non-standard ports and unusual destination domains that do not match normal patterns of behavior.

  - **Identify high-confidence malicious indicators**: If the script shows signs of invoking external URLs or patterns highlighting data exfiltration (such as large outbound traffic), flag these as indicators of compromise (IoC).

  ### Prioritization

  Given the potential for command and control activity, alerts generated from this rule should be prioritized as medium severity. Affected systems may hold sensitive data, and the likelihood of Kavala being weaponized for C2 activities is a genuine threat, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Script Block Logging; ensure it is enabled to reliably capture PowerShell activities. Adversaries may use encoding or obfuscation techniques to bypass detection. Additionally, legitimate administrative operations may invoke similar scripts for network monitoring or server configuration. To strengthen coverage, consider companion detections for outbound traffic to untrusted or suspicious IPs and ongoing process monitoring for anomalous PowerShell usage.

