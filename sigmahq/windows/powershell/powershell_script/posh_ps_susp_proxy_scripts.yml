  ---

  ### Technical Context

  This rule detects the use of PowerShell scripts that create TCP listeners, which are indicative of potential tunneling activities for command and control (C2) communication. The likely attacker objective is to establish a persistent connection for remote access or data exfiltration while evading traditional detection mechanisms. This behavior aligns with the MITRE ATT&CK technique for Command and Control—T1090 (Proxy).

  The primary telemetry source is Windows PowerShell Script Block Logging, which captures details of executed PowerShell commands, including any network-related activity. If malicious, the security impact includes unauthorized remote access or data exfiltration. It's important to note that this detection does NOT confirm an active breach on its own, as legitimate PowerShell use may also invoke similar methods.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution History:**
    Review PowerShell logs for Event ID 4104, focusing on commands associated with TCPListener or AcceptTcpClient. Look for suspicious usage patterns compared to known baselines of PowerShell activity.

  - **Investigate Script Block Logging:**
    Analyze the Script Block logs located at the Windows Event Viewer under Applications and Services Logs > Microsoft > Windows > PowerShell > Operational. Confirm the presence of the expressions '[System.Net.HttpWebRequest]' and 'System.Net.Sockets.TcpListener'.

  - **Identify Benign Usage Patterns:**
    Determine if the user or system initiating the PowerShell script typically executes legitimate network configurations or diagnostic scripts. Conduct user behavior analysis to recognize expected command patterns.

  - **Assess Parent Process Information:**
    Evaluate the parent process of the PowerShell instance by correlating it with Event ID 4688. Processes launched by known administrative tools (e.g., SCCM, WSUS) may indicate benign activity, while unexpected origins suggest malicious intent.

  - **Monitor Network Activity:**
    Examine network flow logs corresponding to the time of the alert for outbound traffic to unfamiliar IP addresses or unusual ports. This may indicate an active tunneling attempt. Check for Event ID 5156 in the Windows Firewall log for other established connections.

  - **Collect and Analyze File Artifacts:**
    If the script writes files as part of its execution (such as proxies or configuration files), validate their creation time and paths. Document any file creation or modifications linked with the PowerShell script through File Audit logs (Event ID 4663).

  ---

  ### Prioritization

  The medium severity of this alert is predicated on its potential to affect critical systems through unauthorized access, underscoring the importance of rapid investigation. With command and control tactics commonly utilized by adversaries, this behavior poses a notable risk if confirmed malicious.

  ---

  ### Blind Spots and Assumptions

  Detection relies heavily on the presence of Script Block Logging; failure to enable this could lead to missed alerts. Legitimate actions, such as IT administrative tasks or troubleshooting using PowerShell network commands, may trigger this rule. Additionally, related detections of outbound network anomalies or suspicious file creations would provide complementary insights to strengthen overall monitoring capabilities.

