title: Potential Suspicious Windows Feature Enabled
id: 55c925c1-7195-426b-a136-a9396800e29b
related:
- id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
  type: similar
status: test
description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: frack113
date: 2022-09-10
modified: 2022-12-29
tags:
- attack.stealth
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features to your env
    ScriptBlockText|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet "Enable-WindowsOptionalFeature" which can modify Windows operating features and configuration. The likely attacker objective is to enable features that could be leveraged for lateral movement, system exploitation, or evasion, such as enabling the Telnet Server or SMB1Protocol for unauthorized access or data exfiltration. This behavior aligns with the MITRE ATT&CK technique of "System Information Discovery" (T1082) and "Lateral Movement" (T1021).

  Primary telemetry sources required include PowerShell script block logging (enabled on all monitored hosts) to capture Command Line events. If exploited maliciously, this can lead to unauthorized configurations that compromise system security. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also trigger this rule.

  ### Investigation Steps

  - **Check PowerShell Execution Events:** Review PowerShell log entries (Event ID 4104) for instances of "Enable-WindowsOptionalFeature" to determine parameters and context of execution. Look for unusual FeatureNames indicating potential malicious intent.

  - **Identify Affected Features:** Analyze the specific features being enabled in the telemetry, focusing on potentially insecure options such as "TelnetServer" or "SMB1Protocol." These indicate a high-confidence malicious indicator if enabled without legitimate need.

  - **Correlate with Administrative Policies:** Verify if the user executing the cmdlet is part of an administrative role that justifies the enabling of those optional features. Record details like user accounts and their group memberships.

  - **Monitor for Unauthorized Access Attempts:** Review security logs (Event ID 4624) for unusual login attempts shortly following the execution of this cmdlet, particularly from remote or non-administrative accounts.

  - **Validate Legitimate Activities:** Document expected enterprise usage of optional features. Record baseline configurations and usage patterns to distinguish between benign administrative changes and suspicious alterations.

  ### Prioritization

  The alert is of medium severity given that it pertains to the potential enabling of features that could be exploited for unauthorized access. The likelihood of malicious abuse is moderate because certain features commonly targeted can allow attackers to perform actions such as remote access or file sharing. While not every occurrence signals an attack, a proactive investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell script block logging is not enabled. Attackers may use PowerShell obfuscation techniques to bypass detection. Legitimate administrative activities can also trigger this alert, especially during maintenance or updates. A related detection to consider is the monitoring of "Disable-WindowsOptionalFeature" for inverse activities that may indicate further possibly malicious alterations.

