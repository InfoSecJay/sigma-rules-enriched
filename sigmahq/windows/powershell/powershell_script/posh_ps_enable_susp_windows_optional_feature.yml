title: Potential Suspicious Windows Feature Enabled
id: 55c925c1-7195-426b-a136-a9396800e29b
related:
- id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
  type: similar
status: test
description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: frack113
date: 2022-09-10
modified: 2022-12-29
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features to your env
    ScriptBlockText|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the invocation of the PowerShell cmdlet `Enable-WindowsOptionalFeature`, which is utilized for managing Windows features and packages. By monitoring for instances where system administrators or attackers enable specific optional features, the rule aims to identify potentially suspicious activity that may indicate an attempt to exploit or leverage system capabilities. For instance, enabling features such as TelnetServer or SMB1Protocol can introduce vulnerabilities and facilitate lateral movement within the network.

  The primary objectives of an attacker leveraging this cmdlet include expanding their operational capabilities, utilizing deprecated or vulnerable features, and evading detection. These operations are commonly associated with the MITRE ATT&CK techniques related to Defense Evasion, specifically T1203 (Exploitation for Client Execution) and T1070 (Indicator Removal on Host), as these behaviors may allow attackers to obscure their activities while maintaining access.

  Evidence of such behavior can be primarily observed in PowerShell logs, specifically through script block logging, which captures details about PowerShell commands executed in the environment. Additionally, Windows event logs related to feature installations and modifications may also provide useful insights.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check Script Block Logging to identify instances of `Enable-WindowsOptionalFeature` usage, including command parameters that indicate optional features being enabled.
  - **Analyze Event Logs**: Examine Windows event logs related to feature change events to correlate with the timings of detected PowerShell commands.
  - **Identify Doomed Features**: Evaluate the specific Windows features that are being enabled, especially focusing on historically insecure features like TelnetServer and SMB1Protocol, which may raise red flags.
  - **Trace User Activity**: Correlate the commands with user activity in the environment by reviewing recent logins, privilege levels, and typical use cases for the affected accounts to determine if the command execution aligns with expected user behavior.

  ### Prioritization
  The alert is of medium severity because while enabling certain optional features may be part of legitimate administrative tasks, the specific features and contexts detected suggest potential malicious activity which could lead to security breaches. The likelihood of exploitation through enabled vulnerable features necessitates timely investigation.

  ### Blind Spots and Assumptions
  This detection logic assumes that Script Block Logging is enabled on target systems; without it, the detection will not function effectively. There may also be gaps in detecting PowerShell commands not logged due to environmental configurations or the use of obfuscation techniques. Additionally, legitimate activities by system administrators could generate false positives, making it critical to assess the context of each alert diligently.

