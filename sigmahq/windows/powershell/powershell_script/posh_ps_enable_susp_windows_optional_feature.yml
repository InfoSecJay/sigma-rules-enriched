description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: frack113
date: 2022-09-10
modified: 2022-12-29
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features to your env
    ScriptBlockText|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet "Enable-WindowsOptionalFeature," which is used to enable specific Windows features, a functionality similar to DISM. The likely attacker objective is to enable potentially unwanted or insecure features (e.g., Telnet, SMB1, WSL) that can facilitate lateral movement, exploitation, or the establishment of persistence mechanisms. This behavior is associated with the MITRE ATT&CK technique "T1203 - Exploitation for Client Execution" and "T1085 - Man-in-the-Middle Tool."

  The primary telemetry sources include PowerShell script block logging, specifically monitoring for commands containing "Enable-WindowsOptionalFeature" and the enabling of certain features. If malicious, enabling these features can create vulnerabilities in the environment, particularly if insecure features are activated. Importantly, this detection does NOT confirm that a system is compromised by itself; subsequent investigation is needed to determine intent and impact.

  ### Investigation Steps

  - **Review PowerShell Command History:** Verify scripts or commands associated with Event ID 4104 in the PowerShell operational logs. Look for unusual timings or users executing the command that don't typically enable Windows features.

  - **Identify Enabled Features:** Check the status of recently enabled features by querying the system with “Get-WindowsOptionalFeature -Online | Where-Object {$_.State -eq 'Enabled'}” in PowerShell. Features like Telnet or SMB1 may indicate malicious intent.

  - **Assess User Context:** Investigate the user account associated with executing the cmdlet. A legitimate admin account may have approved these features as part of maintenance, whereas unusual accounts (e.g., non-admin or service accounts) could indicate suspicious behavior.

  - **Correlate with Security Logs:** Look for complementary indicators in Windows Event IDs 4624 (logon) and 4688 (process creation). If the command was executed shortly after a successful logon, especially from a remote location, it raises risk.

  - **Identify System Context and Role:** Determine the affected host's role; for critical systems (e.g., domain controllers or sensitive servers), enabling insecure features is particularly alarming and warrants immediate response.

  - **Monitor for Evasion Techniques:** Be aware that adversaries may disable PowerShell logging or employ obfuscation techniques. Validate that script block logging is correctly configured to capture the relevant events.

  ### Prioritization

  This alert is categorized as medium severity due to the potential vulnerability introduced by enabling insecure Windows features. The likelihood of malicious abuse is moderate, as enabling features like Telnet or SMB1 is commonly seen in attacks, particularly in lateral movement scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to bypass logging by using alternate execution methods or disabling logging altogether. A necessary log source is PowerShell script block logging, which must be enabled for reliable detection. Legitimate administrative tasks may trigger this alert, such as enabling features for authorized applications. A related detection to consider is monitoring for unusual PowerShell commands that manipulate other system settings or feature states, enhancing overall visibility into potential malicious actions.

