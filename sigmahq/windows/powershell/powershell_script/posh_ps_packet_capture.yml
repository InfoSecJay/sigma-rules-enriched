note: |
  ### Technical Context

  The Sigma rule detects the execution of PowerShell scripts that invoke the "Start-NetEventSession" cmdlet, initiating network event sessions for packet capture. Attackers may use this method to gather sensitive information, such as user credentials, from unencrypted network traffic to facilitate further malicious operations. This behavior correlates to the MITRE ATT&CK framework's tactics of Credential Access (T1003) and Discovery (T1040).

  The primary telemetry sources needed for detection include PowerShell script logs, specifically Script Block Logging, which must be enabled on the target system. If malicious, this activity can lead to significant data breaches and unauthorized access, allowing attackers to gather sensitive user information. Importantly, this detection does not confirm malicious intent without additional context, as legitimate network diagnostics could also make use of the same cmdlet.

  ### Investigation Steps

  - **Review PowerShell logs for the command execution:** Examine Event ID 4104 (PowerShell Script Block Logs) for instances of 'Start-NetEventSession'. Look for unusual timestamps or context suggesting unauthorized access.

  - **Identify the script source:** Analyze the script path in the logs to determine if the PowerShell execution originated from a typical administrative tool directory (e.g., `C:\Windows\System32\WindowsPowerShell\v1.0\`). Uncommon or unexpected paths indicate potential malicious activity.

  - **Correlate network behavior:** Check network traffic logs (e.g., firewall logs, NetFlow) for any authenticated sessions around the time the cmdlet was executed. Look for unencrypted traffic involving sensitive data transmission.

  - **Investigate host role alignment:** Determine the host's role (e.g., workstation, server) and assess if the execution is consistent with its purpose. For example, server roles should not typically involve initiating packet captures unless justified by specific operations.

  - **Assess for prior suspicious activity:** Review recent alerts related to abnormal PowerShell usage or credential access. Presence of prior alerts may indicate ongoing malicious activity.

  - **Identify high-confidence malicious indicators:** Look for unusual packet capture activity in conjunction with external communications. Specifically, determine if the script has captured traffic passing through sensitive ports like 80 or 443 when such activity is atypical for the environment.

  ### Prioritization

  This alert is of medium severity due to the potential impact of undiscovered credential theft and network reconnaissance if exploited. While the likelihood of malicious abuse exists, particularly in targeted attacks, legitimate administrative activities may also trigger this rule.

  ### Blind Spots and Assumptions

  Common evasion techniques may include obfuscating PowerShell scripts or executing from trusted admin tools to bypass detection. Reliable monitoring of this cmdlet necessitates that Script Block Logging is enabled and that comprehensive logging mechanisms are in place. Legitimate activities, such as network diagnostics using Start-NetEventSession for troubleshooting, may trigger this alert. A related detection, such as capturing execution logs for other PowerShell network manipulation commands, would enhance visibility and coverage against credential theft attempts.

