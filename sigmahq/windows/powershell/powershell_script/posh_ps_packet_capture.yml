level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell scripts that contain calls to the `Start-NetEventSession` cmdlet. This cmdlet enables attackers to capture network packets, potentially collecting sensitive information such as user credentials sent over unsecured protocols. By leveraging this capability, adversaries can gather intelligence on network traffic, monitor sessions, and exploit unencrypted data streams.

  The threat scenario here involves attackers executing malicious PowerShell scripts to initiate network sniffing activities as part of a larger reconnaissance or credential theft operation. This behavior aligns with the MITRE ATT&CK technique T1040: Network Sniffing, which falls under the Credential Access and Discovery tactics. Attackers may exploit the captured data to escalate privileges or establish persistence within a compromised environment.

  Primary data sources relevant to detecting this activity include PowerShell Script Block logs, as the detection relies on identifying specific commands within PowerShell execution. Enabling Script Block Logging is essential for capturing the relevant telemetry that facilitates detection.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell Script Block logs for entries containing the `Start-NetEventSession` cmdlet. Look for anomalies or scripts executed from unconventional paths that could indicate malicious intent.
  - **Analyze Network Traffic**: Capture and inspect network traffic to identify unusual patterns or large amounts of traffic directed towards untrusted destinations. Monitor for any signs of credential harvesting tools that may be using this method.
  - **Investigate Recent Script Executions**: Check for recently executed scripts on endpoints, especially those that contain the cmdlet in question. Correlate with user actions to determine legitimacy and context.
  - **Evaluate User Permissions**: Identify the user accounts that executed the scripts. Verify whether they have appropriate permissions for network diagnostics or whether they could potentially represent compromised accounts.

  ### Prioritization
  This alert is classified with medium severity due to its potential to lead to significant security breaches, particularly if attackers successfully capture sensitive network data. The likelihood of such techniques being used in an enterprise environment increases with the prevalence of insecure protocols and poor network oversight.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where Script Block Logging is not enabled, which means legitimate use cases might go undetected. Additionally, the detection logic assumes that the malicious use of the `Start-NetEventSession` cmdlet is not buried within lengthy or obfuscated scripts. It also presumes that all PowerShell activity is logged and accessible for review, which may not always be the case depending on endpoint configurations.

