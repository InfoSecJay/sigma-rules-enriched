note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts that utilize the `Start-NetEventSession` cmdlet. This cmdlet is often employed by attackers to initiate event and packet capture sessions, potentially allowing them to gather sensitive data, such as user credentials transmitted over insecure protocols. The relevant MITRE ATT&CK tactic is **Credential Access** (ID: T1040), with an additional technique being **Discovery** when used for network mapping.

  The primary telemetry source is PowerShell script block logs (Event ID 4104), which require Script Block Logging to be enabled for effective detection. If the behavior is malicious, it poses a significant security threat by facilitating unauthorized data capture, which can lead to credential theft. This detection does NOT confirm that any data has been successfully captured or exfiltrated on its own; it merely indicates the command execution.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution **: Investigate Event ID 4104 for the presence of the `Start-NetEventSession` command in script block logs. Focus on the execution context to assess whether it originated from a legitimate user or an unexpected account.

  - **Identify script origin**: Trace the source of the PowerShell script to understand its intent. Check for any scheduled tasks, user activity, or lateral movement related to the script, utilizing logs from Event ID 4698 for task creation.

  - **Review Network Traffic**: Analyze network logs (e.g., NetFlow or Firewall logs) for unusual traffic patterns, especially protocols often exploited (e.g., HTTP, FTP) following the execution of this command. Look specifically for packet sizes and frequencies that deviate from normal usage.

  - **Correlate with User Activity**: Examine user activity logs (e.g., Windows Security Event ID 4624 - Logon) for privileged accounts alongside the script execution time. Legitimate users performing authorized network diagnostics are less likely to exhibit abnormal post-execution behavior.

  - **Identify Malicious Indicators**: Look for known indicators of compromise (IoCs) related to credential theft data, such as unauthorized remote connections (Event ID 4625 - Failed Logon) following the execution of the `Start-NetEventSession`.

  - **Validate Logging Configuration**: Ensure Script Block Logging is enabled across all hosts, as failure to capture these logs can lead to undetected malicious activity. Assess host roles; critical systems may demand heightened scrutiny for such behavior.

  ---

  ### Prioritization

  The alert is of medium severity as it indicates a potential misuse of PowerShell functionality to conduct packet capture. Given that this technique can be weaponized, especially in environments handling sensitive information, timely investigation is crucial. The likelihood of malicious abuse is moderate, particularly if combined with abnormal user behavior or access patterns.

  ---

  ### Blind Spots and Assumptions

  Detection limitations arise if Script Block Logging is not consistently enabled, allowing attackers to bypass detection by executing scripts without logging. Legitimate network diagnostic activities may trigger this alert, necessitating the context of the execution. Companion detections include monitoring for unusual outbound traffic to detect potential credential exfiltration, thereby providing additional coverage for credential compromise scenarios.

