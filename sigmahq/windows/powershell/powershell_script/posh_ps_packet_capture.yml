level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that include the `Start-NetEventSession` cmdlet, signaling potential illicit network monitoring by an attacker. The likely objective of this behavior is to capture sensitive data transmitted over the network, such as user credentials, especially if sent over insecure protocols. This activity maps to the MITRE ATT&CK techniques for Credential Access (T1040) and Discovery.

  The primary telemetry source for this rule is PowerShell script block logging, requiring that Script Block Logging is enabled on the Windows endpoints. If malicious, capturing network packets could lead to significant data compromise and unauthorized access. However, this detection does NOT confirm that the captured data is being exfiltrated or that the session is configured correctly for malicious purposes.

  ### Investigation Steps

  - **Verify script block logs:** Examine Windows Event Log Security Event ID 4104 for PowerShell script block logs where the `Start-NetEventSession` cmdlet is triggered. Look for unexpected execution on sensitive machines such as domain controllers or critical servers.

  - **Check for related processes:** Validate if unusual processes (e.g., executing cmdlets within unexpected PowerShell environments) are running by reviewing Sysmon Event ID 1 (Process Creation) alongside Event ID 4104. Legitimate monitored processes may include diagnostic tools like `Get-NetEventSession`.

  - **Identify suspicious network captures:** Review for any newly created packet capture files or ongoing packet capture sessions. This could involve checking common locations for capture files (e.g., `C:\ProgramData\Microsoft\Windows\NetEvent`) or using visibility tools to assess active network sessions.

  - **Cross-reference with scheduled tasks:** Look for persistent PowerShell scripts or scheduled tasks that may run the `Start-NetEventSession` cmdlet. Review Task Scheduler logs (Event ID 106) to identify if legitimate maintenance scripts or tasks have been altered or created for malicious intent.

  - **Validate against known benign use cases:** Identify and document any organizational scripts or scheduled tasks that purposely utilize `Start-NetEventSession` for legitimate diagnostic purposes, ensuring they are properly approved and communicated.

  ### Prioritization

  This alert is of medium severity due to its potential impact on sensitive data exposure via network monitoring. The likelihood of malicious abuse is tangible, as this behavior can lead to the collection of credentials and other sensitive information. While this technique is not among the most commonly weaponized methods, it remains a valid concern in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement that PowerShell Script Block Logging must be enabled; without this, successful detection may not occur. Legitimate network diagnostic activities, especially by IT staff, can inadvertently trigger this alert. Related detections, such as monitoring for suspicious outbound network traffic or packet captures, could enhance overall visibility and provide context around network events related to this rule.

