  ### Technical Context

  The Sigma rule detects the execution of the PSAsyncShell, which is an asynchronous TCP reverse shell implemented in PowerShell. This behavior is typical of post-exploitation activities conducted by attackers aiming to establish a command-and-control (C2) channel for remote access and control over compromised systems. This activity corresponds to the MITRE ATT&CK technique "Command and Control: Reverse Shell" (T1059.001).

  The primary telemetry source for this detection is Windows PowerShell logging, specifically requiring script block logging to be enabled to capture the ScriptBlockText field for any occurrences of the PSAsyncShell. If malicious, the impact could include unauthorized access, data exfiltration, and further compromise within the network. This detection does NOT confirm that a full breach has occurred; it merely indicates the presence of the reverse shell code in PowerShell.

  ---

  ### Investigation Steps

  - **Review Script Block Logging Data:** Check Windows Event ID 4104 for logs containing 'PSAsyncShell' in the ScriptBlockText. Look for instances with a high frequency of execution indicating potential abuse.

  - **Validate Base64 Command:** Inspect for Base64-encoded commands associated with the PSAsyncShell execution in Event ID 4104. Malicious instances may exhibit unusual encoding patterns or frequent execution while benign instances will typically show legitimate uses.

  - **Identify PowerShell Version & Execution Policy:** Confirm the PowerShell version (check Event ID 4104 for the 'Version' field) and execution policy on the host (via `Get-ExecutionPolicy`). Unexpected policies or versions might indicate an insecure configuration conducive to exploitation.

  - **Examine Network Connections:** Analyze the outbound network connections initiated by the host (use Windows Firewall logs or Sysmon Event ID 3). High outgoing connections to unfamiliar IPs or domains shortly after PSAsyncShell execution could suggest command-and-control activity.

  - **Assess Legitimate Usage Patterns:** Review historical PowerShell usage on the host (Event ID 4103) to differentiate typical from anomalous behavior. Expected usage patterns would show task automation scripts running at known intervals, without the presence of reverse shell indicators.

  ---

  ### Prioritization

  This alert severity is high due to the potential impact on the affected system, which could serve as a foothold for broader network compromise. Considering the ease with which adversaries can deploy reverse shells, the likelihood of malicious utilization is significant, especially in environments where defenses against such tactics may be underdeveloped.

  ---

  ### Blind Spots and Assumptions

  Detection is limited if PowerShell script block logging is not enabled, allowing evasion of monitoring. Additionally, legitimate administrative scripts may invoke the PSAsyncShell code, resulting in false positives. The deployment of companion detections, such as monitoring for known C2 network behavior or other PowerShell-based attacks, can enhance visibility and improve response capabilities.

