note: |
  ### Technical Context

  This rule detects the execution of the PSAsyncShell PowerShell reverse shell, which uses asynchronous TCP connections to establish outbound communication with a remote attacker-controlled server. The likely attacker objective is to maintain persistent access to a compromised system, exfiltrate data, or execute further malicious commands remotely. This behavior aligns with the MITRE ATT&CK technique for PowerShell Scripting (T1059.001).

  The primary telemetry sources include Windows PowerShell logs with script block logging enabled. The potential security impact is significant, as successful execution could lead to unauthorized access and control over the system, data exfiltration, or lateral movement in the network. This detection does NOT confirm that the remote connection was established successfully or that malicious intent was exercised beyond script execution.

  ### Investigation Steps

  - **Verify script block logging status:** Check if script block logging is enabled on the affected system by reviewing Windows Event Log (Event ID 4104 for PowerShell logs). If not enabled, the rule's effectiveness is compromised.

  - **Investigate PowerShell execution details:** Review PowerShell command logs (Event ID 4104) to extract the complete context of the command, focusing on parameters passed with PSAsyncShell execution.

  - **Identify abnormal outbound connections:** Analyze network traffic logs to detect any unusual outbound TCP connections from the affected host, especially to non-corporate IP ranges or unusual ports. This can indicate that a reverse shell is attempting to connect back to an attacker-controlled server.

  - **Assess host role and criticality:** Determine the role and criticality of the affected system within the organization (e.g., server, workstation). If it is a high-value asset, further investigation and immediate containment measures are warranted.

  - **Document legitimate PowerShell usage:** Identify legitimate scripts or administrative tasks that utilize PowerShell and ensure they do not invoke PSAsyncShell or similar reverse shell patterns, as this can help differentiate between benign and malicious behavior.

  - **Identify malicious indicators:** Look for additional indicators such as the presence of known related files or artifacts indicative of reverse shells, or unusual processes spawned by PowerShell (Event ID 4688), especially those running disguising themselves (e.g., using Process Name like "powershell.exe" with anomalous parent processes).

  ### Prioritization

  This alert carries a high severity due to the potential for significant impact on enterprise security. Given the common weaponization of PowerShell for establishing remote access, the likelihood of malicious abuse is considerable, especially in environments where script block logging is not consistently monitored.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through obfuscation or disabling of script block logging, which may lead to missed executions. It requires proper configuration to ensure script block logging is enabled across all endpoints to maintain effective coverage. Legitimate PowerShell automation scripts may trigger this alert inadvertently, necessitating careful analysis to avoid false positives. Monitoring for other related detection rules focusing on outbound traffic anomalies or common command and control (C2) patterns can enhance overall detection efficacy.

