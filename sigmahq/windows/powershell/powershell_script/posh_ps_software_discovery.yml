title: Detected Windows Software Discovery - PowerShell
id: 2650dd1a-eb2a-412d-ac36-83f06c4f2282
status: test
description: Adversaries may attempt to enumerate software for a variety of 
  reasons, such as figuring out what security measures are present or if the 
  compromised system has a version of software that is vulnerable.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518/T1518.md
- https://github.com/harleyQu1nn/AggressorScripts     # AVQuery.cna
author: Nikita Nazarov, oscd.community
date: 2020-10-16
modified: 2022-12-02
tags:
- attack.discovery
- attack.t1518
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
            # Example: Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\* | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Format-Table -Autosize
    - 'get-itemProperty'
    - '\software\'
    - 'select-object'
    - 'format-table'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell commands that enumerate installed software on Windows systems, specifically through the use of cmdlets like `Get-ItemProperty`, which queries the Windows registry. The likely attacker objective is to gather intelligence about the software environment, assess security measures, and identify vulnerable applications for exploitation. This activity falls under MITRE ATT&CK Discovery tactic (TA0007) and the technique Software Discovery (T1518). The primary telemetry source is PowerShell script execution logs, specifically those capturing Script Block logging. Malicious activity can lead to vulnerability exploitation and further compromise of the system. It's important to note that this detection does not confirm malicious intent on its own; legitimate administrative tasks may trigger the same alert.

  ### Investigation Steps

  - **Check the PowerShell command details**: Review the PowerShell command that triggered the alert. Look for Event ID 4104 in Windows event logs that contain Script Block logging. Identify if the command parameters are suspicious or contain typical enumeration patterns.

  - **Analyze user context and session**: Determine which user executed the PowerShell command by referencing Event ID 4688 for process creation logs. Check if the user is part of an administrative group or has been recently created, indicating potential misuse.

  - **Review recent system changes**: Inspect Windows Event ID 7045 for service creation and 4648 for credential use corresponding to the same time frame as the alert. This can reveal if the system was compromised before the software enumeration activity occurred.

  - **Identify expected legitimate activity**: Compare the PowerShell command against known legitimate administrative commands run by trusted accounts. Review logs for commands from Event ID 4104 that are regularly used by administrators, such as those related to system configuration and updates.

  - **Search for high-confidence malicious indicators**: Look for additional suspicious commands in PowerShell logs or other execution contexts from the same host (Event ID 4688), especially any activity that follows common exploitation patterns like extracting software vulnerability info prior to launching an attack.

  ### Prioritization

  This alert carries medium severity due to its potential impact on asset integrity. Discovered vulnerabilities can lead to successful attacks if exploited. While periodically running software discovery might not present immediate risk, the method of execution via PowerShell is commonly weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through obfuscated commands or alternate enumeration methods. Script Block Logging must be enabled for accurate detection, and if disabled, genuine security assessments could trigger alerts. Legitimate activities, such as system updates and audits, may generate false positives. Related detections, like unauthorized access attempts to administrative accounts (TA0006), can strengthen coverage by providing context around suspicious PowerShell activity.

