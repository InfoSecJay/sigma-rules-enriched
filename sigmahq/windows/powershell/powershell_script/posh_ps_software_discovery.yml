title: Detected Windows Software Discovery - PowerShell
id: 2650dd1a-eb2a-412d-ac36-83f06c4f2282
status: test
description: Adversaries may attempt to enumerate software for a variety of reasons,
  such as figuring out what security measures are present or if the compromised system
  has a version of software that is vulnerable.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518/T1518.md
- https://github.com/harleyQu1nn/AggressorScripts     # AVQuery.cna
author: Nikita Nazarov, oscd.community
date: 2020-10-16
modified: 2022-12-02
tags:
- attack.discovery
- attack.t1518
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
            # Example: Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\* | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Format-Table -Autosize
    - 'get-itemProperty'
    - '\software\'
    - 'select-object'
    - 'format-table'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule detects potential malicious activity related to software discovery on Windows systems through the use of PowerShell scripting. Attackers may employ software enumeration techniques to ascertain installed applications, identify vulnerable versions, and gather intelligence on security measures in place. This information assists adversaries in planning further actions, such as exploits or lateral movement, thus increasing the effectiveness of their attacks.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include the Discovery tactic (TA0007) and specifically software discovery (T1518). By leveraging PowerShell commands that query registry information, attackers can gain insights into the software environment, which can inform their next steps in the attack lifecycle.

  Primary data sources that provide pertinent evidence for this detection include PowerShell script block logs, event logs reflecting PowerShell execution (Event ID 4104), and possibly registry access logs if monitoring is in place for those events.

  ### Investigation Steps
  - **Review Script Block Logs:** Check PowerShell script block logs for any executed commands that include `Get-ItemProperty`, `Select-Object`, and references to registry paths indicating software enumeration. This can help identify the context of the command execution.
  - **Analyze Event Logs:** Look for Event ID 4104 in the Windows Security event logs, which logs output from PowerShell scripts. Pay attention to the time and user context to ascertain whether the execution was legitimate.
  - **Correlate with Other Logs:** Cross-reference findings from PowerShell logs with other relevant logs, such as EDR alerts, to determine if there were any subsequent activities, like exploit attempts or credential access, that could indicate further malicious behavior.
  - **Investigate User Context:** Investigate the user account that executed the PowerShell commands. Assess whether the activity aligns with expected administrative behavior or if it appears anomalous based on the user’s role and recent activity.

  ### Prioritization
  This alert is considered of medium priority in an enterprise environment as it indicates a potential reconnaissance phase of an attack. Given that software enumeration can reveal vulnerabilities, timely investigation is necessary to prevent further exploitation.

  ### Blind Spots and Assumptions
  The detection may not cover all software discovery techniques or tools that could be used by an attacker, especially if they utilize proprietary or novel methods not identified in this rule. Additionally, the detection logic assumes that script block logging is enabled, which is not always the case in every environment. Therefore, environments lacking this logging will not be able to generate alerts for this detection effectively. It is crucial to ensure that adequate logging configurations are in place to support this rule's operation.

