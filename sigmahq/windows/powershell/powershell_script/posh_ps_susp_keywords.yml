title: Potential Suspicious PowerShell Keywords
id: 1f49f2ab-26bc-48b3-96cc-dcffbc93eadf
status: test
description: Detects potentially suspicious keywords that could indicate the use of
  a PowerShell exploitation framework
references:
- https://posts.specterops.io/entering-a-covenant-net-command-and-control-e11038bcf462
- https://github.com/PowerShellMafia/PowerSploit/blob/d943001a7defb5e0d1657085a77a0e78609be58f/CodeExecution/Invoke-ReflectivePEInjection.ps1
- https://github.com/hlldz/Phant0m/blob/30c2935d8cf4aafda17ee2fab7cd0c4aa9a607c2/old/Invoke-Phant0m.ps1
- https://gist.github.com/MHaggis/0dbe00ad401daa7137c81c99c268cfb7
author: Florian Roth (Nextron Systems), Perez Diego (@darkquassar), Tuan Le (NCSGroup)
date: 2019-02-11
modified: 2023-04-21
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'System.Reflection.Assembly.Load($'
    - '[System.Reflection.Assembly]::Load($'
    - '[Reflection.Assembly]::Load($'
    - 'System.Reflection.AssemblyName'
    - 'Reflection.Emit.AssemblyBuilderAccess'
    - 'Reflection.Emit.CustomAttributeBuilder'
    - 'Runtime.InteropServices.UnmanagedType'
    - 'Runtime.InteropServices.DllImportAttribute'
    - 'SuspendThread'
    - 'rundll32'
            # - 'FromBase64'
            # - 'Invoke-WMIMethod' # Prone to FP
            # - 'http://127.0.0.1' # Prone to FP
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious PowerShell activity by targeting specific keywords that are often associated with exploitation frameworks. Such frameworks, like Covenant and PowerSploit, leverage advanced PowerShell techniques to execute malicious payloads, often seeking to bypass traditional security controls. Attackers typically utilize these methods to gain unauthorized access, exfiltrate data, or maintain persistence in the environment.

  The relevant MITRE ATT&CK tactics involved include "Execution" (TA0002) and the specific technique "PowerShell" (T1059.001), which highlights the use of PowerShell as a tool for executing commands and scripts. PowerShell's flexibility and power make it attractive to attackers, as it can operate in memory and manipulate various system resources without triggering conventional detection mechanisms.

  Primary data sources for this detection include PowerShell script block logs, which must be enabled to capture and analyze the content of PowerShell executions. By monitoring these logs, security analysts can gain insights into potentially dangerous actions being performed by attackers.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check PowerShell script block logging to identify the occurrence of the specified keywords. Pay close attention to the context of the command, execution origin, and the user account executing the script.
  - **Correlate with User Behavior:** Investigate the user account associated with the suspicious PowerShell execution. Look for anomalies in their behavior or history, like executing scripts from non-standard locations or elevated privileges being requested.
  - **Analyze Process Creation Events:** Cross-reference with process creation events to identify parent processes that initiated the PowerShell commands. Look for unusual parent process IDs or commands that may indicate exploitation patterns.
  - **Examine Network Connections:** Investigate outbound connections established as a result of the PowerShell execution, particularly those that might connect to known command and control endpoints or unusual IP addresses.

  ### Prioritization
  This alert holds medium severity due to the potential for serious impact stemming from PowerShell-based exploitation attempts, which can lead to data breaches, system compromise, and spread of malware. The likelihood of such attacks occurring in enterprise environments is elevated, especially given PowerShell’s prevalence in administrative tasks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell script block logging is not universally enabled across all systems, limiting visibility into potentially malicious activity. This detection assumes that the keywords listed are inappropriate within the context of the environment; however, legitimate administrative scripts may contain similar phrases, leading to potential false positives. Ensuring that logging settings are properly configured is essential for the effectiveness of this detection logic.

