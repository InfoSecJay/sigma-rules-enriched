title: Potential Suspicious PowerShell Keywords
id: 1f49f2ab-26bc-48b3-96cc-dcffbc93eadf
status: test
description: Detects potentially suspicious keywords that could indicate the use
  of a PowerShell exploitation framework
references:
- https://posts.specterops.io/entering-a-covenant-net-command-and-control-e11038bcf462
- https://github.com/PowerShellMafia/PowerSploit/blob/d943001a7defb5e0d1657085a77a0e78609be58f/CodeExecution/Invoke-ReflectivePEInjection.ps1
- https://github.com/hlldz/Phant0m/blob/30c2935d8cf4aafda17ee2fab7cd0c4aa9a607c2/old/Invoke-Phant0m.ps1
- https://gist.github.com/MHaggis/0dbe00ad401daa7137c81c99c268cfb7
author: Florian Roth (Nextron Systems), Perez Diego (@darkquassar), Tuan Le 
  (NCSGroup)
date: 2019-02-11
modified: 2023-04-21
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'System.Reflection.Assembly.Load($'
    - '[System.Reflection.Assembly]::Load($'
    - '[Reflection.Assembly]::Load($'
    - 'System.Reflection.AssemblyName'
    - 'Reflection.Emit.AssemblyBuilderAccess'
    - 'Reflection.Emit.CustomAttributeBuilder'
    - 'Runtime.InteropServices.UnmanagedType'
    - 'Runtime.InteropServices.DllImportAttribute'
    - 'SuspendThread'
    - 'rundll32'
            # - 'FromBase64'
            # - 'Invoke-WMIMethod' # Prone to FP
            # - 'http://127.0.0.1' # Prone to FP
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of suspicious PowerShell keywords commonly associated with exploitation frameworks that enable code execution and manipulation of assemblies within .NET applications. The likely attacker objective is to execute malicious code in-memory, bypassing traditional endpoint protections, to gain persistence or to leverage command-and-control (C2) communication. Relevant MITRE ATT&CK tactics include Execution (T1059.001) and possibly Credential Access tactics if exploitation aims to harvest credentials.

  Primary telemetry sources include PowerShell Script Block Logging, specifically targeting events where certain functions and keywords are invoked. If these keywords are exploited maliciously, they may indicate an attacker leveraging PowerShell for post-exploitation activities. It is emphasized that this detection does NOT confirm malicious intent on its own, as valid administrative scripting may also utilize similar keywords.

  ### Investigation Steps

  - **Review PowerShell logs for keywords:** Filter PowerShell script block logs (Event ID 4104) for specific terms like 'System.Reflection.Assembly.Load($' and 'rundll32', noting particularly whether they execute within a script context that lacks legitimate process initiation.

  - **Check for abnormal parent-child process relationships:** Look at Event ID 4688 (Process Creation) and identify if PowerShell is invoked via unusual parents, like 'rundll32.exe' or if it deviates from normal invocation behaviors from trusted applications.

  - **Identify command history:** Review PowerShell command history (using Get-History) for any commands executed around the same time as the detected keywords, checking for unrecognized commands or suspicious parameters indicative of exploitation attempts.

  - **Assess asset criticality:** Determine the role of the asset where this alert was triggered (e.g., a server vs. a desktop) to prioritize the investigation appropriately. High-risk systems would warrant immediate containment actions.

  - **Cross-reference with threat intelligence:** Use threat intelligence feeds or internal logs to see if the observed keywords correlate with known malicious activity or tools, particularly from C2 frameworks mentioned in context.

  - **Correlate with legitimate PowerShell uses:** Confirm if the keywords were used within an expected administrative context for routine maintenance or deployment activities (like assembly loading during software updates in a trusted environment).

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems if exploited, as it indicates possible attempts to execute malicious PowerShell code. The likelihood of malicious abuse is significant, given the historical prevalence of PowerShell misuse by adversaries for post-exploitation purposes. This behavior is a known tactic in many attack simulations and real-world breaches.

  ### Blind Spots and Assumptions

  This detection may have blind spots, as legitimate administrative operations might trigger the same keywords, leading to potential false positives. The effectiveness also relies on ensuring that PowerShell Script Block Logging is enabled and properly configured. Legitimate activities such as application updates or configuration changes by authorized personnel may cause alerts. A companion detection would be monitoring for anomalous PowerShell process execution patterns that might indicate a coordinated attack vector when combined with these keywords.

