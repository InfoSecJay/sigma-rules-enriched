note: |
  ### Technical Context

  This rule detects instances where PowerShell is using the `PromptForCredential` method, indicating a credential prompt dialog may be invoked. This behavior is commonly used by attackers to capture user credentials for malicious purposes, aligning with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Credential Dumping (T1059.001). The primary telemetry source for this detection is PowerShell script block logging, specifically looking for event data that contains the `PromptForCredential` call.

  If this behavior is malicious, it allows an adversary to harvest valid credentials, potentially leading to lateral movement, privilege escalation, or data exfiltration. However, the detection alone does NOT confirm that credentials were successfully harvested or misused; further investigation is necessary to validate the intent and outcome of the prompt.

  ### Investigation Steps

  - **Confirm PowerShell Script Block Logging is enabled:** Verify that Security Event ID 4104 is being captured to ensure that PowerShell script block logs are available for analysis.

  - **Review executed PowerShell commands:** Analyze the log for Script Block Text containing `PromptForCredential`. Check the context of execution, specifically if it's invoked from unexpected scripts or locations indicating potential malicious intent.

  - **Identify the user and context:** Determine which user account executed the PowerShell command by reviewing the `InitiatingUser` field in the logs. Compare against typical user behavior and legitimate tasks being performed.

  - **Examine command frequency and patterns:** Look for unusual patterns in execution frequency that deviate from normal operational behavior, such as multiple calls to `PromptForCredential` in a short time frame or by non-administrative accounts.

  - **Validate benign scenarios:** Understand legitimate contexts where `PromptForCredential` may be used, such as scripted automation or tools requiring user authentication within authorized administrative tasks.

  - **Check for related malicious behavior:** Correlate the activity with other potential indicators of compromise, such as failed login attempts or abnormal user behavior (e.g., multiple failed credential prompts followed by successful logins from the same IP address).

  ### Prioritization

  This alert holds high severity due to the potential impact on credential theft, which could lead to significant unauthorized access to sensitive systems. The likelihood of malicious abuse is high, as adversaries frequently employ credential prompts to harvest user credentials during an attack. Moreover, credential prompt behavior is commonly weaponized in various attack campaigns targeting users.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for script block logging to be enabled, which is not always the case in all environments. Legitimate administrative activities—such as system management scripts that require user authentication—can trigger this alert, leading to potential false positives. A related detection to enhance coverage would be identifying instances of credential dumping techniques or analysis of hash dumps that follow this behavior, supporting a broader scope of credential access detection.

