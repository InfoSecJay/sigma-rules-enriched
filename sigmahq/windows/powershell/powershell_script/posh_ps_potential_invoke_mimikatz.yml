title: Potential Invoke-Mimikatz PowerShell Script
id: 189e3b02-82b2-4b90-9662-411eb64486d4
status: test
description: Detects Invoke-Mimikatz PowerShell script and alike. Mimikatz is a credential
  dumper capable of obtaining plaintext Windows account logins and passwords.
references:
- https://www.elastic.co/guide/en/security/current/potential-invoke-mimikatz-powershell-script.html#potential-invoke-mimikatz-powershell-script
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: ps_script
  product: windows
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'DumpCreds'
    - 'DumpCerts'
  selection_2:
    ScriptBlockText|contains: 'sekurlsa::logonpasswords'
  selection_3:
    ScriptBlockText|contains|all:
    - 'crypto::certificates'
    - 'CERT_SYSTEM_STORE_LOCAL_MACHINE'
  condition: 1 of selection*
falsepositives:
- Mimikatz can be useful for testing the security of networks
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts associated with the Mimikatz credential dumping utility. It captures calls to fundamental Mimikatz functions such as 'DumpCreds', 'DumpCerts', and 'sekurlsa::logonpasswords', indicating an intent to harvest sensitive credential information. The likely attacker objective is to obtain plaintext usernames and passwords for lateral movement or persistence within the network. This behavior aligns with MITRE ATT&CK tactics for Credential Access (T1003).

  The primary telemetry sources include PowerShell logs (Event ID 4103) and potentially Sysmon logs that capture process creations and script block logging. If malicious, the exploitation could lead to unauthorized access to accounts, escalating privileges across the network. Notably, this detection does NOT confirm successful credential extraction or the sophistication of the attacker on its own.

  ---

  ### Investigation Steps

  - **Check PowerShell Logs for Suspicious Commands:** Review security logs, specifically PowerShell Event ID 4103, for any script blocks containing 'DumpCreds', 'DumpCerts', or 'sekurlsa::logonpasswords'. Malicious indicators are specific references to these terms.

  - **Identify the Process Initiation:** Examine Sysmon Event ID 1 to confirm the parent process of the PowerShell execution. PowerShell spawned by an unexpected or uncommon parent process (e.g., 'Winword.exe') could indicate malicious behavior.

  - **Review User Context of Execution:** Validate the user context in which the PowerShell scripts executed. Administrative accounts running these commands outside of standard operational hours or unusual patterns may indicate compromise.

  - **Determine the Script Source and Execution Path:** Check for the execution path of the PowerShell script. Legitimate paths include corporate scripts stored in expected directories, while scripts originating from temporary or user-profile directories may raise suspicion.

  - **Cross-reference with Antivirus Logs:** Look for entries in antivirus logs referencing Mimikatz or similar tools detecting known patterns. Any related alerts can strengthen the confidence of an ongoing credential compromise attempt.

  - **Analyze Network Traffic for Anomalies:** Investigate network activity correlated to the alert using firewall or proxy logs. Outbound requests related to credential data post-execution (e.g., attempts to connect to external IPs) could suggest exfiltration attempts.

  ---

  ### Prioritization

  This alert is classified as high severity due to the critical nature of credential theft in enterprise risk assessment. The potential for attackers to exploit stolen credentials for lateral movement or privilege escalation makes timely investigations essential. Credential dumping is a common and effective method weaponized by adversaries in breaches.

  ---

  ### Blind Spots and Assumptions

  Detection relies on adequate PowerShell logging and Sysmon configuration, and the absence of such sources may lead to missed alerts. Legitimate activities such as security assessments or authorized penetration testing using Mimikatz could trigger this rule. Companion detections such as abnormal authentication events or unusual account activity could strengthen the overall security posture and response measures.

