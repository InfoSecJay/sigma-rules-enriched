title: Potential Invoke-Mimikatz PowerShell Script
id: 189e3b02-82b2-4b90-9662-411eb64486d4
status: test
description: Detects Invoke-Mimikatz PowerShell script and alike. Mimikatz is a 
  credential dumper capable of obtaining plaintext Windows account logins and 
  passwords.
references:
- https://www.elastic.co/guide/en/security/current/potential-invoke-mimikatz-powershell-script.html#potential-invoke-mimikatz-powershell-script
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: ps_script
  product: windows
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'DumpCreds'
    - 'DumpCerts'
  selection_2:
    ScriptBlockText|contains: 'sekurlsa::logonpasswords'
  selection_3:
    ScriptBlockText|contains|all:
    - 'crypto::certificates'
    - 'CERT_SYSTEM_STORE_LOCAL_MACHINE'
  condition: 1 of selection*
falsepositives:
- Mimikatz can be useful for testing the security of networks
level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the Mimikatz credential dumping tool via PowerShell scripts. Specifically, it analyzes script block text for common Mimikatz functions that extract credentials and certificates, indicating a potential attempt to compromise user accounts or extract sensitive information. The likely objective of the attacker is to gain unauthorized access to accounts by harvesting credentials, which can facilitate lateral movement or further exploitation within the network.

  This behavior connects to the MITRE ATT&CK framework under the tactic "Credential Access" (TA0006) and specifically the technique "Credential Dumping" (T1003). The primary telemetry source is PowerShell script logs, capturing events related to script execution and containing specific keywords associated with Mimikatz functionality. If the detected activity is indeed malicious, it poses significant security risks by potentially allowing unauthorized access to sensitive systems and information. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate security testing practices may trigger similar alerts.

  ### Investigation Steps

  - **Review PowerShell logs for the specific script content:** Check PowerShell event logs (Event ID 4104) for script block text including 'DumpCreds', 'DumpCerts', or 'sekurlsa::logonpasswords'. Malicious indicators include occurrences of these keywords without preceding legitimate activity.

  - **Correlate with user context:** Investigate the identity of the user executing the PowerShell script. Determine if the account has a legitimate reason to run these scripts. Anomalous logins or unexpected activity from service accounts should be flagged as suspicious.

  - **Identify process execution timelines:** Cross-reference Event ID 4688 for any new processes spawned by PowerShell (e.g., Windows PowerShell or pwsh.exe) around the same timestamps when the suspicious script was detected. Malicious activity would typically show several related processes executed sequentially.

  - **Assess for credential or certificate extraction artifacts:** Look for files created or modified in the user’s profile directory indicative of credential dumping, such as temporary files or specifically named logs. These may indicate malicious intention.

  - **Compare against legitimate administrative tasks:** Identify common administrative tasks performed by the user or their role. Validate whether they typically include credential dumping activities or PowerShell scripts for audit or testing.

  - **Look for network connections by PowerShell:** Check Network Connection logs (Windows Filtering Platform logs or equivalent) for outbound connections initiated by PowerShell during the same activity window. An unusual destination or unexpected outbound traffic may indicate exfiltration attempts.

  ### Prioritization

  This alert should be treated with high severity due to the potential risk of credential theft and lateral movement within the environment. Systems affected may hold critical access, heightening the likelihood of malicious abuse. Moreover, credential dumping is a common tactic employed in many attacks, thus necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell logging is not fully enabled, potentially allowing malicious use to go undetected. Evasion techniques can include obfuscation of scripts or the use of non-standard execution methods. Legitimate activities like security assessments or authorized penetration testing could trigger the alert if they utilize Mimikatz. A related detection rule for monitoring process creation (e.g., Event ID 4688) could help strengthen coverage of overall suspicious activity.

