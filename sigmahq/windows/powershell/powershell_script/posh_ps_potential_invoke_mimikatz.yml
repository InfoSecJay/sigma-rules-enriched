title: Potential Invoke-Mimikatz PowerShell Script
id: 189e3b02-82b2-4b90-9662-411eb64486d4
status: test
description: Detects Invoke-Mimikatz PowerShell script and alike. Mimikatz is a 
  credential dumper capable of obtaining plaintext Windows account logins and 
  passwords.
references:
- https://www.elastic.co/guide/en/security/current/potential-invoke-mimikatz-powershell-script.html#potential-invoke-mimikatz-powershell-script
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: ps_script
  product: windows
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'DumpCreds'
    - 'DumpCerts'
  selection_2:
    ScriptBlockText|contains: 'sekurlsa::logonpasswords'
  selection_3:
    ScriptBlockText|contains|all:
    - 'crypto::certificates'
    - 'CERT_SYSTEM_STORE_LOCAL_MACHINE'
  condition: 1 of selection*
falsepositives:
- Mimikatz can be useful for testing the security of networks
level: high
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_potential_invoke_mimikatz/info.yml
note: |
  ### Technical Context

  This detection focuses on identifying the execution of PowerShell scripts that utilize Mimikatz-like commands, which can extract sensitive credential and certificate information from Windows systems. The likely attacker objective is credential theft, allowing access to user accounts and potential lateral movement within the network. This behavior fits within the MITRE ATT&CK framework under the tactic **Credential Access** (TA-0006) and the technique **Credential Dumping** (T1003). The primary telemetry source is PowerShell script logs, specifically **ScriptBlockText** for detecting specific commands indicative of Mimikatz usage. If identified as malicious, it can dramatically compromise system integrity and escalate privileges for unauthorized access. Notably, this detection alone does not confirm an ongoing compromise but merely indicates that a suspicious script has been executed.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious script blocks:** Filter for logs with **Event ID 4104** in PowerShell Universal, focusing on entries containing 'DumpCreds', 'DumpCerts', or 'sekurlsa::logonpasswords'. Legitimate use cases may include maintenance scripts from trusted IT personnel.

  - **Confirm script execution context and user account:** Cross-reference logs with **Event ID 4688** (process creation) to determine the user who executed the script. Ensure the user is not part of standard administrative roles unless justified by their responsibilities.

  - **Check for file creation related to Mimikatz:** Look for any new file artifacts like **mimikatz.exe** or similar binaries in directories commonly targeted for temporary execution (e.g., C:\Windows\Temp). Log types from file system event logs will help in this validation (File System Event ID 4663).

  - **Analyze network traffic patterns:** Review network logs for unusual outbound connections post-scripting execution. Pay attention to connections targeting unusual IPs that do not align with normal enterprise traffic.

  - **Examine recent admin actions on sensitive systems:** Investigate if there was a recent change in security settings or power-user privileges (Event ID 4672). High privileging may indicate preparation for a credential dumping attack.

  ### Prioritization

  This alert should be treated as high severity due to the potential for credential theft, which poses a significant risk to the enterprise's security posture. The likelihood of this behavior being weaponized is elevated, given the prevalence of Mimikatz in real-world attacks against Windows environments, especially in targeted operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive PowerShell logging settings or if script execution was conducted in a benign context (e.g., security assessments). It assumes that monitoring of PowerShell scripts is enabled and that the systems are logging appropriately. Legitimate security testing by authorized personnel could trigger this alert. Companion detections, such as monitoring for unusual admin logon behaviors (Event ID 4624) or remote desktop logins, can further strengthen overall detection coverage.

