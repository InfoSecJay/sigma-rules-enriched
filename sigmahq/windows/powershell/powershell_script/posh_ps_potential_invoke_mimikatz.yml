title: Potential Invoke-Mimikatz PowerShell Script
id: 189e3b02-82b2-4b90-9662-411eb64486d4
status: test
description: Detects Invoke-Mimikatz PowerShell script and alike. Mimikatz is a credential
  dumper capable of obtaining plaintext Windows account logins and passwords.
references:
- https://www.elastic.co/guide/en/security/current/potential-invoke-mimikatz-powershell-script.html#potential-invoke-mimikatz-powershell-script
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: ps_script
  product: windows
detection:
  selection_1:
    ScriptBlockText|contains|all:
    - 'DumpCreds'
    - 'DumpCerts'
  selection_2:
    ScriptBlockText|contains: 'sekurlsa::logonpasswords'
  selection_3:
    ScriptBlockText|contains|all:
    - 'crypto::certificates'
    - 'CERT_SYSTEM_STORE_LOCAL_MACHINE'
  condition: 1 of selection*
falsepositives:
- Mimikatz can be useful for testing the security of networks
level: high
note: |
  ### Technical Context
  This detection rule identifies instances of the PowerShell script `Invoke-Mimikatz`, a well-known tool used by attackers to extract credentials from the memory of Windows systems. Mimikatz is notorious for its ability to dump plaintext Windows account logins and passwords, making it a critical tool for credential theft. In a typical threat scenario, an attacker who gains entry to a network may deploy this script to harvest user credentials, which could subsequently be used for lateral movement or privilege escalation within the environment.

  The relevant MITRE ATT&CK tactics for this detection include **Credential Access** (TA0006) and the techniques: **Credential Dumping** (T1003) and **Credential Dumping: Mimikatz** (T1003.001). These techniques are aimed at extracting sensitive authentication information from operating systems and software. The primary sources of telemetry that provide actionable insights include PowerShell script block logs, which can capture the execution details of PowerShell commands used in credential dumping, along with additional logs from the Windows Event Log related to script execution.

  ### Investigation Steps
  - **Analyze PowerShell Logs:** Review PowerShell script block logs for instances where `DumpCreds`, `DumpCerts`, or `sekurlsa::logonpasswords` were invoked. Look for abnormal execution patterns that deviate from standard user behavior.

  - **Check Event Logs:** Investigate Windows Security Event Logs (Event IDs 4688 and 4697) for unusual process creation events or the execution of PowerShell scripts that may suggest malicious activities.

  - **Examine User Accounts:** Evaluate the permissions and roles of user accounts associated with the executed scripts. Look for any unauthorized access or accounts with elevated privileges that could have executed Mimikatz.

  - **Correlate with Network Activity:** Review network traffic logs for interactions with suspicious remote hosts, particularly inbound connections after the script execution. Identify any potential callbacks to known malicious domains or IPs related to credential theft.

  ### Prioritization
  The severity of this alert is high due to the potential impact of credential theft, which can lead to unauthorized access to sensitive systems and data. The likelihood of exploitation is significant, given the widespread use of Mimikatz in cyberattacks, particularly in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions
  This detection may miss instances where Mimikatz is executed in a non-PowerShell context or when obfuscation techniques are used to hide its invocation. Additionally, it assumes that PowerShell logging is enabled and properly configured to capture detailed script block logging. Without these logs, detection effectiveness will be significantly reduced. Analysts should ensure that logging settings are adjusted to avoid gap vulnerabilities in the detection capabilities for PowerShell-based threats.

