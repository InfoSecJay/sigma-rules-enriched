note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet `Unblock-File`, which is used to remove the Zone.Identifier alternate data stream that marks a file as having been downloaded from the internet. Attackers may use this to evade security mechanisms that rely on these markings to identify potentially harmful files, aiming to execute malicious payloads without triggering alerts. This behavior is indicative of the MITRE ATT&CK technique: **T1553.005 - Remove the Zone.Identifier Alternate Data Stream**.

  The primary telemetry sources for this detection are Windows PowerShell logs, specifically requiring Script Block Logging to be enabled to capture the command execution. If malicious, the impact could involve executing untrusted or harmful scripts that compromise system integrity or exfiltrate data. Importantly, triggering this detection does NOT inherently confirm malicious intent; legitimate use of the `Unblock-File` cmdlet can occur in trusted environments.

  ### Investigation Steps

  - **Check PowerShell Log Entries:** Examine Windows Event ID 4104 (PowerShell Script Block Logging) for the execution of `Unblock-File`, specifically looking for 'Unblock-File ' and '-Path ' arguments in the command text.

  - **Identify the File Path:** Review the `FilePath` used with `Unblock-File` to determine its origin. Look for files that are atypical or known to be associated with malicious activity. Benign examples include routine administrative scripts.

  - **Analyze Parent-Child Process Relationships:** Inspect for suspicious parent processes (Event ID 4688) that executed PowerShell. Legitimate executions often originate from administrative tools like SCCM or scripts managed by IT, whereas anomalous launches from user interactive sessions should raise concerns.

  - **Validate File Integrity:** Check for recent changes in associated Zone.Identifier data streams using PowerShell or forensic tools. Look for files that have just had their streams removed and confirm if they are known and expected (e.g., downloaded software).

  - **Correlate with Other Activities:** Review logs for irregular patterns of activity around the same timeframe, such as unusual outbound network connections or file access (Event ID 4663) related to the files processed with `Unblock-File`.

  ### Prioritization

  The alert has a medium severity due to the potential for abuse by malicious actors. Affected systems, especially those handling sensitive data, can significantly impact the enterprise if compromised. While the behavior is not exceedingly common, it can be a precursor to exploitation in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering this alert, leading to false positives. Script Block Logging must be enabled; otherwise, the detection will fail. Additionally, normal user activities like file management or safe downloads can occur harmlessly using `Unblock-File`. Related detections, such as monitoring for outbound connections initiated by PowerShell (T1059.001 - PowerShell), can provide a more comprehensive picture of suspicious activities.

