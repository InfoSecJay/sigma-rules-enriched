note: |
  ### Technical Context
  This rule detects the use of the `Unblock-File` PowerShell cmdlet, which is often employed to remove the Zone.Identifier alternate data stream from files. This data stream typically indicates that a file has been downloaded from the internet, and its removal could signal an attempt by an attacker to obscure the file's source, potentially facilitating malicious actions. An attacker might leverage this technique to execute malware or scripts without triggering security policies that might be in place, especially in environments that monitor downloaded files closely.

  The specific threat family linked to this behavior includes various malware and attack frameworks that aim to evade detection during the execution phase. The relevant MITRE ATT&CK tactics and techniques for this activity include **Defense Evasion** (TA0005) and specifically **T1553.005: Masking File Origin**. This technique may be particularly concerning in enterprise environments where downloaded files contain sensitive scripts that could lead to further compromise.

  Primary data sources that would provide useful evidence include PowerShell script block logs, which must be enabled for effective detection. Additionally, examining file metadata or system event logs could provide context on file access and modification.

  ### Investigation Steps
  - **Review PowerShell Logs:** Investigate PowerShell script block logs for the use of `Unblock-File`, focusing on the timestamp and the user context to identify potential malicious activity.
  - **Examine File History:** Check the provenance of the files being unblocked, such as whether they were downloaded from external sources, to establish their legitimacy.
  - **Analyze User Behavior:** Look for unusual patterns in user activity around the time of execution, particularly any escalations in privileges or access to sensitive resources.
  - **Correlate with External Threat Intelligence:** Utilize threat intelligence to assess if the files or scripts involved in the incident have been reported as malicious, particularly in relation to known attack vectors.

  ### Prioritization
  This alert is of medium severity due to the potential for attackers to leverage the `Unblock-File` cmdlet to mask their actions and execute further malicious payloads with a lower chance of detection, thus increasing the impact of their attack on the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities that legitimately involve the use of `Unblock-File`, which can lead to false positives in certain contexts. The detection logic assumes that script block logging is correctly configured and enabled; without this, alerts may be missed. Additionally, the absence of proper logging or monitoring for the network traffic associated with downloaded files could hinder the overall effectiveness of this detection.

