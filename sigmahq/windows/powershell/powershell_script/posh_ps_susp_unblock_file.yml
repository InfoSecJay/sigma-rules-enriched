note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Unblock-File`, which is typically used to remove the Zone.Identifier alternate data stream from files downloaded from the internet. The likely attacker objective is to facilitate the execution of potentially malicious scripts or executables by bypassing Windows security mechanisms that flag these files as unsafe. This behavior aligns with the MITRE ATT&CK technique `T1553.005 - Unblock-File` under the tactic of Defense Evasion. Primary telemetry sources include PowerShell Script Block logs, which require that Script Block Logging is enabled to capture the command executions. If malicious, this can allow attackers to run harmful scripts that compromise network security. Importantly, this detection alone does NOT confirm malicious intent, as legitimate use cases exist for unblocking files.

  ### Investigation Steps

  - **Verify PowerShell script execution source:** Review PowerShell Script Block logs, particularly looking for Event ID 4104 where `Unblock-File` appears. Check the parent process to identify whether this was spawned from a legitimate application or script.

  - **Analyze command context:** Examine the full command used with `Unblock-File`, including the `-Path` parameter. Identify if the file path leads to known safe scripts or downloaded executables. Legitimate activity may involve paths like user downloads for commonly used files.

  - **Correlation with other telemetry:** Cross-reference with other logs, such as Windows Security Event IDs 4688 (Process Creation) and 4663 (Access to an Object). This can reveal if the unblocked file was subsequently executed shortly after unblocking.

  - **Check for execution artifacts:** Investigate the file system for the existence of the target file after unblocking. Determine its creation or last modified timestamps for signs of unexpected changes or inline execution attempts.

  - **Assess system criticality:** Consider the role of the affected host in the enterprise architecture. Unblocking files on critical assets (like domain controllers) increases urgency for further investigation.

  ### Prioritization

  This alert carries medium severity due to the potential for abuse but varies widely based on the affected system's context. While endpoint hosts are common attack vectors, this specific behavior can also be observed in legitimate scenarios, making contextual analysis crucial.

  ### Blind Spots and Assumptions

  Detection limitations exist if Script Block Logging is not enabled, resulting in missed events. Evasion techniques may involve obfuscating the use of `Unblock-File` or executing it from non-standard contexts. Legitimate use cases may involve trusted scripts that require unblocking after initial downloads. A related detection to strengthen coverage might involve monitoring for the creation of alternate data streams (e.g., looking for modifications to Zone.Identifier using Sysinternals tools).

