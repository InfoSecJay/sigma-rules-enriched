  ---

  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command **Unblock-File**, which is typically used to remove the **Zone.Identifier** alternate data stream from files that are downloaded from the internet. The likely attacker objective is to bypass security mechanisms that warn users about potentially unsafe files. Relevant MITRE ATT&CK techniques include **Defense Evasion** (T1553.005). The primary telemetry sources are PowerShell script executions and specific PowerShell logging (Script Block Logging). If malicious, this behavior could facilitate the execution of harmful scripts or malware previously flagged as unsafe. This detection does NOT confirm that malicious activity has occurred, as legitimate PowerShell scripts may also call **Unblock-File**.

  ---

  ### Investigation Steps

  - **Review the script execution context:** Check the PowerShell logs for Event ID 4104 to determine whether **Unblock-File** was run in user-initiated scripts versus system-triggered processes. Legitimate scripts may routinely use **Unblock-File** in a known context.

  - **Identify the file path processed:** Investigate the arguments in the PowerShell command to review the file location. Check the source path (e.g., if it's in the User's Downloads directory) and the process that triggered the command to assess whether it's a known, benign application or user.

  - **Inspect the process lineage:** Use Process Explorer or Sysmon Event ID 4656 to check the parent process of the PowerShell execution. A parent process from an unusual application (e.g., not initiated by the user, or an unexpected application) could indicate suspicious behavior.

  - **Check Zone.Identifier data:** Use tools to check for the existence of the **Zone.Identifier** alternate data stream on the affected file before the **Unblock-File** command was executed. If it exists and is removed by the user or process unexpectedly, it could indicate malicious intent.

  - **Evaluate network activity:** Inspect network connections around the time of the script execution (e.g., using NetStat or firewall logs) to identify unusual outbound connections that may correlate with the execution of this command, potentially indicating an attempted data exfiltration.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on the enterprise environment, particularly if associated with a sensitive asset. The likelihood of malicious abuse is moderate, as attackers often use the **Unblock-File** command to facilitate malware execution. While this behavior may not always indicate an active threat, it is commonly weaponized in attack vectors aimed at evading defenses.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for specifics of the command to be obfuscated or invoked indirectly, making the alert less reliable. In environments where PowerShell logging is not fully enabled, detection fully depends on **Script Block Logging**. Legitimate PowerShell automation tools may routinely use **Unblock-File** without malicious intent. A related detection enhancing coverage could focus on other PowerShell defense evasion techniques, such as downloads from untrusted sources or the execution of obfuscated scripts.

