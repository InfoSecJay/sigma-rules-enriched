note: |
  ### Technical Context

  This Sigma rule detects the usage of specific PowerShell commandlets associated with known exploitation frameworks, indicating potential malicious activities such as credential dumping, backdoor creation, or data exfiltration. The likely attacker objective is to exploit administrative privileges to gather sensitive information or establish unauthorized access within an environment. This behavior corresponds to multiple MITRE ATT&CK tactics, notably Execution (T1203), Credential Access (T1003), and Discovery (T1087).

  The primary telemetry source is Windows PowerShell Script Block Logging, which captures script execution details. Required log types include PowerShell logs that contain events generated by the execution of these commandlets. If these actions are confirmed to be malicious, they could compromise system integrity, escalate privileges, or result in data breaches. However, this detection alone does NOT confirm malicious intent; a contextual understanding of the execution environment and user activity is essential.

  ### Investigation Steps

  - **Review PowerShell Script Block logs:** Examine Security Event ID 4104 for PowerShell script block events containing suspicious commandlets as specified in the rule (e.g., 'Get-Keystrokes', 'Invoke-Mimikatz'). Note the user context and execution time.

  - **Identify legitimate PowerShell usage:** Validate that typical administrative scripts or scheduled tasks do not contain the commandlets from the rule. Check for regular commandlets like 'Get-Process' or 'Set-Service' within the execution context.

  - **Correlate user activity:** Cross-reference the events with the corresponding user account activity in Event ID 4624 (Logon) to determine if the account has legitimate administrative duties or if it exhibits suspicious login patterns.

  - **Assess recent changes in AD or system configuration:** Look for modifications in Active Directory using Event ID 5136 if commandlets like 'Remove-ADIDNSNode' were executed, as they indicate potential changes to crucial DNS configurations.

  - **Evaluate outbound network traffic:** Investigate any unusual network connections in the logs (e.g., Firewall logs or IDS alerts) that coincide with the execution times of detected commandlets, particularly if they involve external IP addresses.

  - **Check for evidence of persistence mechanisms:** Search for any new Windows services or scheduled tasks created recently that align with the commandlets indicating backdoor creation (e.g., 'Add-Persistence'). Monitor for unusual startup entries or registry modifications.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on system security and the likelihood of malicious abuse. The proliferation of malicious PowerShell commandlets makes this behavior a common tactic among threat actors, especially in targeted attacks aiming for credential access and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the disabled Script Block Logging, which is necessary for capturing relevant events. Legitimate administrative tasks that execute PowerShell scripts could unintentionally trigger this alert, such as those performing routine system management. Additionally, self-signed scripts that contain these commandlets might evade detection. Companion detections include monitoring for unusual PowerShell execution patterns and correlating with other relevant MITRE ATT&CK techniques such as lateral movement activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
