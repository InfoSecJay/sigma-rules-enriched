level: high
note: |
  ### Technical Context
  This Sigma rule detects the use of potentially malicious PowerShell commandlets that are commonly associated with various exploitation frameworks. Attackers leverage PowerShell to execute commands that can facilitate tasks such as credential theft, lateral movement, and persistence mechanisms. The rule identifies specific commandlets that align with known threat behaviors, indicative of either direct exploitation or reconnaissance efforts against a target environment.

  In a typical attack scenario, adversaries may utilize these commandlets to extract sensitive information or manipulate system configurations for malicious purposes. The use of PowerShell as a tool allows attackers to operate stealthily and blend in with legitimate administrative activities. The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - Execution (T1059.001: PowerShell)
  - Discovery (T1087: Account Discovery)
  - Credential Access (T1003: Credential Dumping)

  Primary data sources for this detection strategy include Windows PowerShell script logs, specifically Script Block Logging, which must be enabled to capture the executed commandlets and their parameters.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine the PowerShell script block logs for instances where the detected commandlets are executed. Look at the timestamps and associated user accounts to assess the context of the execution.
  - **Analyze Contextual Activity:** Investigate whether the commandlet executions correlate with other suspicious activities on the network, such as unusual login attempts or lateral movement patterns.
  - **Identify Affected Systems:** Check the originating systems for any additional signs of compromise, such as the presence of malware or unauthorized software installations, especially those related to the detected commandlets.
  - **Cross-reference with Threat Intelligence:** Use threat intelligence sources to determine if any of the identified commandlets have been attributed to known threat actors or exploitation frameworks, enhancing the understanding of the potential impact.

  ### Prioritization
  This alert is considered high severity due to the potential impact of successful exploitation that can lead to data exfiltration, system compromise, and lateral movement within the environment. The likelihood of such attacks utilizing PowerShell is significant, making prompt investigation critical to mitigating risk.

  ### Blind Spots and Assumptions
  One key gap in detection coverage is the potential for authorized users or scripts to execute these commandlets legitimately, leading to false positives. The detection logic assumes that the necessary logging (Script Block Logging) is enabled on all Windows endpoints, which may not always be the case. Additionally, detection is limited to the specific commandlets listed; thus, new or customized commandlets that are not documented may evade detection.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
