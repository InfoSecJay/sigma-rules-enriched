note: |
  ### Technical Context

  This rule detects the use of the `System.Net.Security.SslStream` class in PowerShell scripts, specifically involving certificate validation callbacks and the `AuthenticateAsClient` method. The objective of such behavior is typically to create a disguised command-and-control (C2) channel, enabling attackers to communicate covertly with compromised systems. The relevant MITRE ATT&CK techniques are **Command and Control (T1573)**, which covers the use of encrypted channels for remote access.

  The primary telemetry source is PowerShell script block logs, which need to have Script Block Logging enabled. Malicious use of this connection could allow an attacker to exfiltrate data or execute commands undetected. However, this detection alone does not confirm whether the observed activity is indeed malicious, as legitimate administrative tasks may employ similar encryption mechanisms.

  ### Investigation Steps

  - **Review PowerShell execution context**: Check if the PowerShell script was executed by a known user account or an unexpected service account. Look for Event ID 4104 (PowerShell Script Block Logging) for the specific script invocation.

  - **Analyze the command arguments**: Identify the exact arguments utilized in the PowerShell command, focusing on the content of the `AuthenticateAsClient` call. Determine if the certification validation parameters point to known C2 infrastructure, and refer to Event ID 4104 for detailed script block output.

  - **Confirm expected administrative usage**: Investigate if the PowerShell script aligns with operational duties of system administrators, focusing on documentation or scheduled tasks that would necessitate similar SSL connections. Check for recorded usage patterns.

  - **Look for known C2 indicators**: Cross-reference the destination IPs or domains against threat intelligence databases for known malicious C2 servers. Use network logs or access logs that may indicate abnormal connections post script execution.

  - **Identify any unusual behavior patterns**: Examine subsequent network traffic logs or security event logs (e.g., Event IDs 5156 for Windows Filtering Platform) to detect unusual outbound connections from the system involved after the script execution.

  ### Prioritization

  Given the low severity rating, this alert should be triaged with caution. The potential impact is limited to specific user actions; however, if the affected machine is critical, any command and control activity could pose a risk. This behavior can be weaponized but is also seen in routine administrative scripts, necessitating thorough review.

  ### Blind Spots and Assumptions

  Detection will be limited if Script Block Logging is not enabled, potentially missing benign administrative activity that uses similar PowerShell functionalities. Legitimate use cases include SSL communications for internal services, which may falsely trigger this alert. Companion detections to consider include network traffic analysis for unusual outbound TLS connections or related PowerShell command executions that do not raise alerts.

