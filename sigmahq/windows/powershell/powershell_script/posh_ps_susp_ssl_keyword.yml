note: |
  ### Technical Context
  This rule detects the use of SSL connections established through PowerShell scripts that may involve suspicious activities indicative of command and control (C2) communications. Attackers often employ various encryption techniques to obscure their network traffic, potentially using tools like OpenSSL to conceal their malicious activities. By examining the presence of specific components in the script block that indicate the establishment of secure connections, the detection aims to highlight likely C2 traffic that has been obfuscated.

  The primary threat scenario revolves around an attacker using encrypted channels for C2 communications to avoid detection, manipulate data, or exfiltrate sensitive information. The objectives of such tactics may include remote control of compromised systems, data retrieval, or further penetration of the network infrastructure to escalate access and maintain persistence. This behavior aligns with the MITRE ATT&CK framework under the tactics of Command and Control (T1071) and specifically technique T1573 (Encrypted Channel).

  The most relevant data sources for detecting this behavior are PowerShell script logs, particularly those that capture script block logging. These logs will contain information regarding the contents of PowerShell commands that are being executed, enabling the identification of potentially malicious SSL-related functionality.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Analyze PowerShell script logs to detect any instances of SSL-related commands, particularly those that include `System.Net.Security.SslStream`, `Net.Security.RemoteCertificateValidationCallback`, and `.AuthenticateAsClient`.

  - **Correlate with Network Traffic**: Look for any outbound network traffic that matches the timing of the suspicious PowerShell execution, paying attention to any connections using abnormal ports or destinations that may indicate C2 activity.

  - **Conduct Behavioral Analysis**: Investigate the context of the PowerShell script execution, such as the user account used, source of the script, and whether it's part of a legitimate administrative task or out of the ordinary for the environment.

  - **Evaluate the Environment**: Cross-reference scripts identified with local policies and procedures. Consider legitimate cases of use for encrypted communications in PowerShell to differentiate between benign and malicious behaviors, but err on the side of caution with privileged or administrative use.

  ### Prioritization
  The alert is categorized as low severity due to the potential for false positives, such as legitimate administrative activities that use encryption for secure communications. However, given the evolving nature of threats utilizing decrypted channels for C2, any such detections warrant timely investigation.

  ### Blind Spots and Assumptions
  One potential gap in this detection coverage arises from the reliance on script block logging, which must be enabled for PowerShell on Windows systems. The detection logic assumes that any execution of these script components is indicative of malicious activity, lacking context that could explain legitimate use cases. Ensuring comprehensive PowerShell logging is essential for the effective functioning of this detection rule. Additionally, environments with limited logging capabilities or where PowerShell is heavily restricted may not capture this behavior appropriately.

