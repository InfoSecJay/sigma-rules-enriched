  ---

  ### Technical Context

  This rule detects the execution of PowerShell scripts that utilize SSL connections, particularly where the `SslStream` class and certificate validation callbacks are involved. Such behavior may indicate an adversary attempting to establish covert command and control channels without being easily detected through traditional methods. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1573 (Encrypted Channel).

  The primary telemetry sources are PowerShell script logs with Script Block Logging enabled, capturing details about executed scripts and their content. If malicious, this behavior can lead to unauthorized data exfiltration, remote command execution, or persistent access. However, this detection does NOT confirm malicious intent without additional context, as legitimate administrative scripts may exhibit similar patterns.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for Script Block Logging:** Check Windows Event ID 4103 to identify the script causing the alert. Look for `ScriptBlockText` fields containing key indicators like `System.Net.Security.SslStream`.

  - **Analyze the script context:** Determine if the script was initiated by a known administrative user or process versus anomalous user accounts. Use the `InitiatingUser` field in Event ID 4104 to support this analysis.

  - **Assess network activity during script execution:** Review outbound connections in firewall logs (Event ID 5156 or other relevant network logs) for suspicious SSL connections. Look for unusual destination IP addresses or domain names associated with known malicious infrastructure.

  - **Identify benign usage patterns:** Compare with known administrative scripts in your environment, looking for typical SslStream usages—such as legitimate remote management tasks or application-specific communications that routinely rely on these methods.

  - **Correlate with other security alerts:** Check for related security alerts or logs that may provide additional evidence of malicious activities (e.g., multiple failed login attempts prior to script execution), aiding in the assessment of potential compromise.

  - **Review for file creation or exfiltration:** Search through logs for unusual file access patterns or creations during the timing of the PowerShell execution. Validate against Event ID 4634 or similar file system logs for unexpected file movements or deletions.

  ---

  ### Prioritization

  The alert severity is moderate due to the potential impact on system integrity if command and control channels are established. The likelihood of malicious abuse is significant, particularly in environments where administrative scripts are not tightly controlled or monitored. This behavior is not uncommon in targeted attacks, where encrypted channels are weaponized to evade detection.

  ---

  ### Blind Spots and Assumptions

  Detection of this behavior can be evaded through various techniques such as obfuscation or using alternate PowerShell logging configurations. Script Block Logging must be properly configured to ensure comprehensive visibility. Legitimate activities, such as secure administrative communications, may also trigger this alert under specific conditions. A related detection to consider is monitoring for unusual outbound connections in network traffic analysis to further enhance visibility into potential command and control activities.

