note: |
  ### Technical Context

  This rule detects modifications to the `msDS-ManagedAccountPrecededByLink` attribute in Active Directory via PowerShell scripts. Such alterations may indicate an attempt to exploit the BadSuccessor privilege escalation vulnerability present in Windows Server 2025. The likely objective of an attacker would be to escalate privileges within an Active Directory environment, potentially gaining unauthorized access to sensitive resources.

  The detection relates to the MITRE ATT&CK tactics of **Privilege Escalation** (TA0004) and **Persistence** (TA0003), specifically targeting the technique **Exploitation for Client Execution** (T1078.002). Primary telemetry sources include PowerShell execution logs, particularly those tracking script blocks. If successful, this behavior could allow an attacker to gain elevated access rights that compromise system integrity. However, this detection does NOT confirm an attack on its own; further investigation is required to understand the context of the modification.

  ### Investigation Steps

  - **Review PowerShell logs for script execution:**
    Check PowerShell operational logs (Event ID 4104) for any script block that includes `.Put("msDS-ManagedAccountPrecededByLink` along with the timestamp of the alert. Ensure to correlate with Event ID 400 for process creation.

  - **Verify the attribute modification context:**
    Cross-check modifications in Active Directory using AD-specific event logs (Event ID 5136) to see if the `msDS-ManagedAccountPrecededByLink` attribute was changed by legitimate administrative users, indicating acceptable administrative tasks.

  - **Identify the executing user and session context:**
    Determine the user account executing the PowerShell command by checking associated event logs (Event ID 4657 or 4688). Validate if the account has a history of legitimate activity or if it is an anomalous account.

  - **Correlate with service accounts or privileged groups:**
    Investigate if the modification originated from service accounts or personnel within privileged groups that typically manage these attributes. Review the account role and any recent changes in group memberships.

  - **Check for subsequent access attempts:**
    After the modification, monitor for any abnormal access patterns or privilege escalations to high-criticality assets, especially if executed by the modified account.

  ### Prioritization

  This alert is assessed as **low severity** due to its context-driven nature, where legitimate administrative actions can trigger it. However, the likelihood of malicious abuse exists. Since exploitation techniques like BadSuccessor are documented, it is essential that this alert is not overlooked, especially in environments vulnerable to privilege escalation attacks.

  ### Blind Spots and Assumptions

  This detection may have limitations in identifying benign administrative modifications, which can generate false positives. Reliable detection requires proper configuration of PowerShell logging and Active Directory auditing. Legitimate tasks, such as regular maintenance by IT administrators, may inadvertently trigger this alert. A related detection to consider is monitoring failed logon attempts following the attribute modification, which can provide additional context on potential exploitation attempts.

