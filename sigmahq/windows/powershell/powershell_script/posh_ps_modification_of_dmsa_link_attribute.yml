note: |
  ### Technical Context

  This Sigma rule detects the modification of dMSA link attributes, specifically targeting the `msDS-ManagedAccountPrecededByLink` attribute using PowerShell commands. The likely attacker objective is to exploit the BadSuccessor privilege escalation vulnerability within Windows Server environments, particularly focusing on gaining higher privileges in Active Directory. This behavior corresponds to the MITRE ATT&CK techniques for Privilege Escalation (T1078.002) and Defense Evasion (T1098).

  The primary telemetry sources include PowerShell script logs that capture command line usage (Windows Event ID 4104 for PowerShell script block logging). If malicious, such modifications could lead to unauthorized access and privilege escalation within Active Directory environments. Importantly, while this detection can signal suspicious activity, it does NOT confirm that a successful privilege escalation has occurred on its own; additional context and investigation are necessary.

  ### Investigation Steps

  - **Review PowerShell script logs:** Examine PowerShell Event ID 4104 for instances containing ".Put("msDS-ManagedAccountPrecededByLink" and "CN=". Look for additional parameters or scripts that might indicate malicious intent.

  - **Correlate with Active Directory changes:** Check for corresponding changes in Active Directory logs (Event ID 5136 - Directory Service Change) that detail modifications to `msDS-ManagedAccountPrecededByLink`. Confirm if the changes align with legitimate administrative tasks.

  - **Identify running processes:** Use Sysinternals tools (e.g., Process Explorer) to identify any PowerShell processes (Process ID) running around the same time as the alert. Legitimate scripts should be linked to known administrative tasks.

  - **Assess historical context:** Investigate whether similar modifications have occurred previously on the affected asset. High-frequency changes or modifications in short timeframes can indicate malicious activity as opposed to rare legitimate updates.

  - **Cross-validate permissions:** Review the permissions associated with the user account executing the PowerShell command. Confirm if the account has legitimate reasons for modifying the dMSA attributes. Look for any anomalies or accounts without expected administrative rights that were used.

  ### Prioritization

  This alert carries low severity as it appears to indicate potential privilege escalation attempts. However, it may also reflect legitimate administrative activity, and its occurrence is niche compared to more common attack vectors. Close monitoring is warranted since successful exploitation can have significant impacts on system integrity and security.

  ### Blind Spots and Assumptions

  Detection limitations include the potential to miss obfuscated PowerShell commands, as attackers may use alternative scripting techniques to evade detection. Additionally, the required logging configuration for reliable detection relies on the enforcement of PowerShell script block logging. Legitimate administrative tasks, such as authorized changes to service accounts, can also trigger this alert. Companion detection rules, such as monitoring for failed authentication attempts (T1078.002), can help strengthen coverage by providing context around attack attempts.

