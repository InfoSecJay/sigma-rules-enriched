note: |
  ### Technical Context

  This rule detects the execution of specific Hyper-V PowerShell cmdlets such as `New-VM`, `Set-VMFirmware`, and `Start-VM`, which adversaries may leverage to provisioning virtual machines for illicit activities and to obfuscate their actions from traditional detection methods. The likely objective of such activity is to create isolated environments for malicious operations, such as data exfiltration or lateral movement across a network. This behavior is associated with the MITRE ATT&CK tactic “Defense Evasion” and technique “Create and Manage Virtualized Environments” (T1564.006).

  The primary telemetry source for this detection is Windows PowerShell script execution logs, specifically requiring that Script Block Logging is enabled. If these cmdlets are invoked maliciously, it could allow an attacker to operate in a stealthy manner, potentially compromising sensitive data or infrastructure. This detection does NOT confirm malicious intent on its own, as legitimate administrators may also use these cmdlets for valid purposes.

  ### Investigation Steps

  - **Review PowerShell Execution Logs**: Check for PowerShell events using Event ID 4103 that correspond to the detected cmdlets. Legitimate usage typically includes administrative scripts with comments or clear indications of purpose.

  - **Correlate User Activity**: Investigate the user context associated with the command execution through Event ID 4624 (Logon) to verify if the user has administrative permissions that legitimize PowerShell cmdlet use.

  - **Investigate VM Creation Events**: Look for Event ID 15000 and 15003 from Hyper-V logs indicating VM creation or configuration changes. High-confidence malicious indicators might include rapid, subsequent calls to create multiple VMs from the same user account in a short timeframe.

  - **Check for Suspicious Command Arguments**: Review the parameters passed with the cmdlets captured in the script block logs. Uncommon parameters or scripts generated without clear documentation may indicate malicious intent.

  - **Audit Related Access Controls**: Validate that proper permissions are enforced on the Hyper-V Manager. Low-privilege users leveraging these cmdlets could be a red flag indicating potential privilege escalation attempts.

  ### Prioritization

  This alert carries a medium severity level due to the potential impact on critical systems facilitated by an unauthorized user creating or manipulating virtual machines. While the likelihood of abuse exists, particularly in environments with extensive virtualization, such actions are not frequently detected and thus warrant prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through obfuscation or use of scripts that do not trigger script block logging under certain configurations. Performance of legitimate administrative activities, such as VM management by authorized personnel, may trigger this alert. Effective coverage may be enhanced by companion detections for unauthorized access attempts (e.g., multiple failed credential requests) around the time of the alert.

