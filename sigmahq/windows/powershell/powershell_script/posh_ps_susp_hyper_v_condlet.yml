note: |
  ### Technical Context

  The rule detects the use of suspicious Hyper-V Cmdlets in PowerShell scripts, specifically targeting commands like `New-VM`, `Set-VMFirmware`, and `Start-VM`. These cmdlets can be utilized by attackers to create and manage virtual machines, potentially serving as a means to obfuscate malicious activity from traditional security monitoring. The likely attacker objective involves using virtual instances to execute commands or deploy malware without drawing attention to a physical machine.

  This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the technique **Indicator Removal on Host** (T1564.006). The primary telemetry source is Windows PowerShell script logs (Event ID 4104), and success in detection relies on having PowerShell Script Block Logging enabled. If malicious, the impact could include unauthorized access to sensitive data, lateral movement, or further entrenchment within the environment. Importantly, this detection does NOT confirm that the activity is malicious on its own and requires further investigation into the context and usage of the commands.

  ### Investigation Steps

  - **Review PowerShell Logs**: Examine PowerShell Script Block logs (Event ID 4104) for the presence of monitored cmdlets (`New-VM`, `Set-VMFirmware`, `Start-VM`). Check the `ScriptBlockText` field for evidence of these commands being executed.

  - **Analyze the Context of Execution**: Investigate the `User` and `SessionId` fields within the logs to identify if the cmdlets were run under a legitimate user context or anomalous account. Justification from administrative users may indicate benign activity.

  - **Look for Additional Indicators of Compromise**: Correlate with process creation logs (Windows Event ID 4688) to identify if PowerShell was invoked from unusual or non-standard applications (e.g., web browsers or unprivileged executables).

  - **Validate Hyper-V Virtual Machine Configuration**: Check Hyper-V logs in the Windows Event Viewer (Event ID 83 for VM creation) to confirm if any legitimate virtual machines were created or if the timestamps correlate with the suspicious cmdlet detection.

  - **Identify Legitimate Use Cases**: Determine if the commands are part of scheduled maintenance or legitimate functions by documented procedures for Hyper-V usage in your enterprise. Seek approval or documentation to validate those jobs.

  - **Check for Evasion Techniques**: Be aware of potential evasion tactics like scripts executed from memory or obfuscated command lines that may not be captured by regular logging. Ensure all monitoring agents are configured and operational to capture these events.

  ### Prioritization

  The alert severity is medium, primarily because the presence of these Hyper-V Cmdlets may indicate an effort by adversaries to evade detection during their operations. The risk of malicious exploitation is moderate, given that such behavior can be both legitimate and malicious, depending on the context. However, the usage of these cmdlets can be weaponized, warranting a timely review.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block Logging to be enabled, which is not always configured in all environments. Additionally, legitimate administrative tasks could trigger this alert, complicating triage efforts. An effective companion detection would be monitoring for unusual Hyper-V administrative actions in the Windows Event Logs (e.g., event ID 83 for VM creation), which can help correlate and affirm or negate the suspicious activity.

