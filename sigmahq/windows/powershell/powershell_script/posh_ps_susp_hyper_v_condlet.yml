note: |
  ### Technical Context

  This Sigma rule detects the execution of specific PowerShell cmdlets associated with Hyper-V, such as `New-VM`, `Set-VMFirmware`, and `Start-VM`. These cmdlets can indicate malicious activity aimed at creating or manipulating virtual machines to evade detection or isolate malicious activities from the host system. The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1564.006).

  Primary telemetry sources include PowerShell logs, specifically Script Block Logging, which is essential for capturing the execution of these commands. If an adversary successfully uses Hyper-V for malicious purposes, it can enable them to conduct attacks while remaining undetected on the primary system. However, this detection alone does NOT confirm malicious intent, as legitimate system admins may perform the same operations for valid purposes.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:**
    Check logs for Script Block Logging (Event ID 4104) containing cmdlets like `New-VM`, `Set-VMFirmware`, and `Start-VM` executed on systems with Hyper-V installed.

  - **Identify related user activity:**
    Determine the user context under which these cmdlets were executed. Evaluate the user's permissions, recent activities, and typical behavior to distinguish between possible benign and malicious activity.

  - **Assess Hyper-V configurations:**
    Validate the presence of newly created virtual machines using Hyper-V Manager or PowerShell (`Get-VM`) to see if the creation aligns with expected operations, such as testing or development.

  - **Check for network/sandbox isolation:**
    Investigate whether the created virtual machines have isolated networking configurations which may indicate an attempt to evade detection. Look for unusual external IP connections that might suggest exfiltration or command and control behavior.

  - **Correlate with past incidents:**
    Analyze historical logs for similar cmdlet executions. Check for patterns or correlations with previous security incidents to enhance the context of the current alert.

  - **Look for companion detections:**
    Cross-reference with related detections of suspicious PowerShell usage or remote system changes (e.g., Event ID 4688 for new process creation) that occurred around the same timeframe as the alert.

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized virtual machine operations on systems that utilize Hyper-V, especially if critical infrastructure is involved. While the likelihood of malicious use exists, the prevalence of legitimate administrative actions mitigates some of the risk. Consequently, this behavior is somewhat commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled or properly configured. Adversaries may use common PowerShell obfuscation techniques to avoid detection. Legitimate administrative activities, such as testing or maintenance of virtual machines, could trigger this alert. Companion detections related to suspicious PowerShell commands (e.g., `T1059.001: Command and Scripting Interpreter: PowerShell`) can bolster coverage and context around suspicious activity within the environment.

