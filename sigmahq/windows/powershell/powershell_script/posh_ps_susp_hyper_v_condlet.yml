note: |
  ### Technical Context
  This detection rule identifies the use of suspicious Hyper-V cmdlets in PowerShell scripts, specifically commands that relate to the creation and management of virtual machines. Attackers may exploit Hyper-V technology to conduct malicious operations within a virtual instance, leveraging these environments to bypass conventional security controls and conduct activities with a lower risk of detection. The use of virtual machines can aid adversaries in evading detection techniques, as actions within a VM may not be monitored as closely as those on physical machines.

  The primary tactics and techniques relevant to this rule include **Defense Evasion** (ID: T1564) and specifically **Use of Hypervisor** (ID: T1564.006). The ability to create and manipulate virtual machines presents a potential attack surface, often under-monitored in many enterprise environments. Detection focuses on PowerShell scripts that utilize Hyper-V cmdlets, such as `New-VM`, `Set-VMFirmware`, and `Start-VM`.

  The primary data source for this detection is PowerShell script logs. More specifically, it requires that Script Block Logging is enabled to capture and analyze the PowerShell commands executed on Windows systems.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script logs to identify the execution of suspicious Hyper-V cmdlets. Pay particular attention to any unusual patterns or commands that are not associated with typical administrative tasks.

  - **Check for Unauthorized VM Instances**: Investigate the creation of new virtual machines within your Hyper-V environment. Look for instances that have been created during non-business hours or by users who do not typically manage VMs.

  - **Analyze User Activity**: Examine user account activity for any accounts that triggered the alerts. Cross-reference with user roles to determine if there has been unauthorized access or unusual behavior aligned with the execution of Hyper-V cmdlets.

  - **Correlate with Network and Event Logs**: Cross-check findings with network logs and other event logs to identify any outbound connections or anomalies that may indicate data exfiltration or lateral movement correlating with the suspicious Hyper-V cmdlet usage.

  ### Prioritization
  Due to the potential for significant impact stemming from a successful exploitation of Hyper-V capabilities, this alert is classified as medium severity. The likelihood of an attacker using these methods to conduct lateral movement or evade detection is plausible, especially in environments with less vigilant monitoring of virtualized infrastructure.

  ### Blind Spots and Assumptions
  One primary gap in detection coverage occurs if Script Block Logging is not enabled, which is required to capture the relevant PowerShell commands. Furthermore, the detection logic assumes that all activities involving Hyper-V cmdlets are suspicious, although legitimate administrative actions may trigger false positives. It's essential to have comprehensive logging and monitoring configurations across both physical and virtual environments to avoid blind spots in detection capabilities.

