note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet `New-MailboxExportRequest`, which is often leveraged by attackers to export mailbox data from Microsoft Exchange servers to a remote share. The likely attacker objective here is to exfiltrate sensitive email data, often as part of a broader compromise such as through the ProxyShell exploit chain. This behavior fits into the MITRE ATT&CK framework under the tactic "Exfiltration" (TA0010), specifically the technique "Exfiltration Over Other Network Medium" (T1041).

  The primary telemetry source for this detection is PowerShell script block logging, which must be enabled for accurate reporting. The security impact of a successful malicious action could include unauthorized data access and data leaks containing sensitive information. It is crucial to recognize that this detection alone does not confirm malicious intent, as legitimate administrative tasks may involve mailbox exports.

  ### Investigation Steps

  - **Review executed PowerShell commands**: Examine logs for PowerShell script block logging events (Event ID 4104). Look for entries containing `New-MailboxExportRequest` and associated parameters. Legitimate exports typically show specific mailboxes and a more controlled file path (e.g., a local file path rather than a network share).

  - **Identify risky file paths**: Check if the `-FilePath` parameter points to a suspicious network share (e.g., UNC paths such as `\\maliciousshare\export.pst`). This is a high-confidence indicator of potential exfiltration.

  - **Correlate with user activity**: Cross-reference the `New-MailboxExportRequest` execution (Event IDs 4104) with user logins in the Exchange logs (Event ID 4624). Verify if the user has legitimate administrative privileges and a valid business need for the export.

  - **Validate destination access**: If applicable, examine firewall logs or network activity that correspond with remote connections to the destination share. Look for unusually high data transfer volumes or connections to unfamiliar hosts.

  - **Check for associated alerts**: Investigate for related detections concerning abnormal logins or failed Exchange tasks around the same time to identify if this activity is part of a larger compromise scenario.

  ### Prioritization

  This alert is critical as it indicates potential data exfiltration from a sensitive system (Exchange Server). The likelihood of malicious abuse is high, especially given that similar behaviors have been weaponized in well-documented exploits, including ProxyShell. Affected systems are often integral to organizational security, underscoring the importance of immediate investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations if script block logging is not enabled, potentially leading to missed exports. Attackers might use obfuscation techniques to hide their commands or may execute exports using legitimate administrative accounts to blend in with normal operations. Related detections, such as unusual login patterns to the Exchange server or failed mailbox access attempts, could strengthen the overall security posture by detecting early signs of compromise.

