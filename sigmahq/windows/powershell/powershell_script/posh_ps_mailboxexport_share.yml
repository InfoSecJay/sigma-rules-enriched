note: |
  ### Technical Context
  This detection rule identifies the execution of the PowerShell command `New-MailboxExportRequest`, which is utilized to export mailboxes from Microsoft Exchange to a file, potentially on a remote or local share. This command can be exploited in scenarios such as the ProxyShell vulnerability, where attackers seek to exfiltrate sensitive data by exporting user mailboxes without appropriate authorization. The goal of such an attack typically includes gathering sensitive information for further attacks, credential harvesting, or lateral movement within the network.

  Relevant MITRE ATT&CK techniques include **Exfiltration Over Command and Control Channel (T1041)**, as the exported data might be sent to an external location, and **Exploitation of Public-Facing Application (T1190)**, due to the exploitation inherent in the ProxyShell vulnerability. Detection of this rule relies primarily on **PowerShell script block logs**, as enabling script block logging allows for analysis of the specific commands executed in PowerShell sessions, including potentially malicious actions.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell script block logs for entries that contain `New-MailboxExportRequest` with parameters indicating mailbox exports, noting the file paths and targeted mailboxes.
  - **Analyze User Activity**: Examine the account activities of the user executing the export command to determine if the user has legitimate permissions and access to export mailboxes and if they have exhibited any unusual behavior prior to the execution.
  - **Check Exchange Audit Logs**: Review the Microsoft Exchange audit logs for the mailbox export events. Specifically, assess timestamps and correlating actions, noting any irregularities or unauthorized access patterns.
  - **Investigate Network Traffic**: Analyze the network traffic to identify any connections or data transfers to the specified file path or destination where the mailbox export was directed, looking for signs of data exfiltration.

  ### Prioritization
  This alert is considered critical due to the high impact of exfiltrating sensitive information, typically stored within user mailboxes, which could lead to severe data breaches and compromise organizational security.

  ### Blind Spots and Assumptions
  The main gap in detection coverage may stem from the reliance on PowerShell script block logging; if logging is not enabled, the execution of suspicious commands will not be captured. It assumes that the environment effectively captures and retains the necessary PowerShell logs within its logging configuration, which can vary across different organizations. Furthermore, false positives could arise if legitimate administrators perform exports without proper context provided in the logs.

