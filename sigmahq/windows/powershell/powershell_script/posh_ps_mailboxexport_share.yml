  ---

  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet `New-MailboxExportRequest`, which is often used to export mailboxes to a file share. Attackers may leverage this command after conducting successful compromises, such as those related to the ProxyShell vulnerabilities, with the objective of accessing and exfiltrating sensitive mailbox data. The relevant MITRE ATT&CK tactic is "Exfiltration" (TA0010) and the technique is "Exfiltration Over Web Service" (T1041).

  The primary telemetry sources for this rule are Windows PowerShell logs, specifically requiring Script Block Logging to be enabled. If this behavior is malicious, it could indicate a serious breach where an adversary is attempting to steal sensitive information. However, this detection does NOT confirm that an actual exfiltration occurred, as legitimate use cases for this cmdlet also exist.

  ---

  ### Investigation Steps

  - **Check PowerShell logs for specific exports:** Review PowerShell logs for Event ID 4104. Look for entries containing `New-MailboxExportRequest` along with `-FilePath \\`, which indicates a mailbox export to a share. Legitimate exports may occur during administrative activities; note the user context and permissions.

  - **Verify export share destination:** Determine if the FilePath points to an internal or external share. Accessing external share paths (e.g., `\\malicious.example.com`) is highly suspicious and indicative of potential exfiltration.

  - **Analyze related user activities:** Correlate this event with user logons via Event ID 4624. Identify whether the exporting user has unexpected access levels or if the mailbox belongs to a high-value target.

  - **Detect unauthorized script execution:** Check for other PowerShell commands run by the same user prior to the export. Review Event ID 4103 for any suspicious script block executions linked to the export process.

  - **Assess script block logging configuration:** Confirm that Script Block Logging is enabled on the systems generating this alert. Without it, you may not capture critical events that could aid in identifying malicious activity.

  - **Identify historical export activities:** Search for previous successful export requests using the Exchange Management Shell to understand if this is an ongoing issue. Compare timestamps and involved mailboxes against known attack patterns.

  ---

  ### Prioritization

  The alert is of **critical severity** as it indicates a potential data exfiltration attempt, especially if targeted at sensitive or high-profile mailboxes. Given the common exploitation of the ProxyShell vulnerabilities, there is a significant risk of malicious abuse in this context.

  ---

  ### Blind Spots and Assumptions

  This detection may be circumvented by attackers using obfuscation techniques in PowerShell. Additionally, organizations must ensure that relevant logs, including PowerShell execution logs, are appropriately configured and retained for reliable detection. Legitimate administrative activities, such as routine mailbox exports by IT staff, can trigger this alert. Companion detection such as monitoring for unusual logins or privilege escalation events (e.g., Event ID 4672) can strengthen overall coverage.

