title: Suspicious PowerShell Get Current User
id: 4096a49c-7de4-4da0-a230-c66ccd56ea5a
status: test
description: Detects the use of PowerShell to identify the current logged user.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1033/T1033.md#atomic-test-4---user-discovery-with-env-vars-powershell-script
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1033/T1033.md#atomic-test-5---getcurrent-user-with-powershell-script
author: frack113
date: 2022-04-04
tags:
- attack.discovery
- attack.t1033
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Environment]::UserName'
    - '$env:UserName'
    - '[System.Security.Principal.WindowsIdentity]::GetCurrent()'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands to retrieve the current logged-in user's information. Attackers may employ this technique to gather intelligence about the environment and users, particularly during the reconnaissance phase of an attack. Knowledge of the current user can facilitate further exploitation efforts, as it provides context for suspicious activities and potential target selection.

  The primary MITRE ATT&CK technique relevant to this rule is **User Discovery** (T1033). This technique often appears in various attack scenarios, including lateral movement and privilege escalation, where attackers determine user identities to launch targeted attacks or maintain persistence. As PowerShell is a powerful scripting language available on Windows systems, it is frequently leveraged by both attackers and legitimate administrators alike.

  Primary data sources for detecting these events include PowerShell script block logs, which must be enabled to capture command execution details. Monitoring script execution through this logging can yield valuable insights into potentially malicious activities, especially when commands align with the typical patterns of reconnaissance.

  ### Investigation Steps
  - **Review PowerShell Logs**: Inspect relevant PowerShell script block logs for the detected commands. Focus on instances of `[System.Environment]::UserName`, `$env:UserName`, and `[System.Security.Principal.WindowsIdentity]::GetCurrent()` being executed.
  - **Correlate with User Activity**: Cross-reference the execution times of the PowerShell commands against user activity logs to determine if the commands align with legitimate administrative tasks or appear unusual.
  - **Assess User Context**: Identify the user account that executed the PowerShell commands. Understand their role within the organization and investigate whether that role justifies the execution of such commands.
  - **Monitor Subsequent Actions**: Look for any additional suspicious activities following the command execution, such as attempts to elevate privileges or access sensitive resources, which could indicate an ongoing or larger compromise.

  ### Prioritization
  The alert's severity is classified as low because, while the execution of these commands can be indicative of reconnaissance activity by potential attackers, they can also be executed for legitimate administrative purposes. However, the context and the environment in which these commands are used should guide prioritization.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell script block logging is not enabled on the monitored systems, as the rule relies on this feature to capture related activity. The detection logic assumes that any usage of the specified commands without an appropriate context is potentially malicious. Additionally, legitimate administrative scripts that contain similar commands could generate false positives, indicating that context analysis is essential for accurate incident response.

