logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Environment]::UserName'
    - '$env:UserName'
    - '[System.Security.Principal.WindowsIdentity]::GetCurrent()'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that query the current logged-in user. Such behavior is often indicative of an attacker attempting to gather user context during reconnaissance, which can aid in lateral movement or privilege escalation. The relevant MITRE ATT&CK techniques are Discovery (T1087) and User Discovery (T1033). Primary telemetry sources are Windows PowerShell logs, specifically those generated by Script Block Logging, which must be enabled for effective detection. If exploited maliciously, this behavior could assist an attacker in targeting credentials or executing further malicious actions on the system. However, this detection does NOT confirm malicious intent on its own, as these commands may be employed in benign contexts.

  ### Investigation Steps

  - **Check PowerShell logs for suspicious usage**: Review PowerShell logs (Event ID 4104) specifically for the Script Block Text showing any instances of '[System.Environment]::UserName', '$env:UserName', or '[System.Security.Principal.WindowsIdentity]::GetCurrent()'. Malicious usage will typically be part of a larger script involving unauthorized access attempts.

  - **Evaluate the context of PowerShell execution**: Identify the parent process in which the PowerShell commands were executed. For example, Event ID 4688 can provide insight into whether these commands were run from known tools (like `cmd.exe`, `powershell.exe`, or other system utilities) or questionable applications, indicating potential malicious activity.

  - **Validate the user context**: Confirm if the user account executing the PowerShell command is authorized and aligns with legitimate administrative processes. In cases of known administrative roles, this activity may signify expected behavior; unauthorized accounts executing these commands indicate potential malicious intent.

  - **Compare with baseline activity**: Cross-reference the detected activity against established baselines for your organization. Typical benign activities might include authorized personnel running these commands as part of regular maintenance or user support tasks.

  - **Investigate associated behavioral patterns**: Determine if there is a pattern of subsequent command executions following this detection. A series of reconnaissance queries, especially within a short timeframe, could indicate preparatory actions for an attack against the environment.

  ### Prioritization

  While the immediate impact of this alert may be low, the methodology used can be leveraged by attackers to facilitate further malicious actions within the environment. Given that user enumeration is a common step in many attack lifecycles, especially in environments rich with user privileges, this alert should still be taken seriously.

  ### Blind Spots and Assumptions

  Detection may miss commands if Script Block Logging is not enabled, highlighting a potential gap in logging configurations. Additionally, legitimate tools and administrative scripts could trigger this alert if they perform user enumeration, making context vital in investigation. A related detection could involve monitoring for unusual patterns in user account activity, such as Event ID 4768 (Kerberos Authentication Ticket (TGT) Request), which strengthens coverage in user-related activities.

