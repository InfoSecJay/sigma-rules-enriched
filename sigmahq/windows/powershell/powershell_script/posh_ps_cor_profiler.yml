title: Registry-Free Process Scope COR_PROFILER
id: 23590215-4702-4a70-8805-8dc9e58314a2
status: test
description: |
  Adversaries may leverage the COR_PROFILER environment variable to hijack the execution flow of programs that load the .NET CLR.
  The COR_PROFILER is a .NET Framework feature which allows developers to specify an unmanaged (or external of .NET) profiling DLL to be loaded into each .NET process that loads the Common Language Runtime (CLR).
  These profiliers are designed to monitor, troubleshoot, and debug managed code executed by the .NET CLR.
  (Citation: Microsoft Profiling Mar 2017)
  (Citation: Microsoft COR_PROFILER Feb 2013)
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.012/T1574.012.md#atomic-test-3---registry-free-process-scope-cor_profiler
author: frack113
date: 2021-12-30
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1574.012
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '$env:COR_ENABLE_PROFILING'
    - '$env:COR_PROFILER'
    - '$env:COR_PROFILER_PATH'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of environment variables related to .NET profiling—specifically `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, and `$env:COR_PROFILER_PATH`. This behavior is indicative of an attacker’s attempt to manipulate the execution flow of .NET applications by loading a potentially malicious unmanaged DLL into the Common Language Runtime (CLR). The likely objective is to maintain persistence or escalade privileges by executing untrusted code within the context of a legitimate .NET runtime.

  This activity maps to MITRE ATT&CK technique T1574.012: Registry Run Keys / Startup Folder, related to both defense evasion and privilege escalation. The primary telemetry source for this detection is Windows PowerShell script logs, specifically Script Block Logging, which captures instances of script executions and manipulations. If this behavior is malicious, it could facilitate the execution of unauthorized code and compromise the integrity of the systems involved. Importantly, this detection does NOT confirm that a malicious act has taken place; it only indicates that a potential misuse of .NET profiling features has occurred.

  ### Investigation Steps

  - **Review script block logs for related environment variable usage:** Examine PowerShell logs (Event ID 4104) for instances where `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, or `$env:COR_PROFILER_PATH` are set. Compare with known malicious profiles versus legitimate administrative scripts to differentiate intent.

  - **Identify potentially injected DLLs:** Check for DLLs referenced within the identified scripting context, including their paths and signatures. Malicious indicators include DLLs located in uncommon directories (e.g., user temp folders) or unsigned binaries.

  - **Analyze the impact on .NET processes:** Query for recently executed processes that load the CLR (e.g., Event ID 4688) and verify if any suspicious DLLs correspond with the profiling attempts. Pay attention to unexpected parent-child process relationships.

  - **Confirm legitimate usage scenarios:** Investigate organizational guidelines for .NET profiling. Document any legitimate use cases that your environment follows and verify against the alert to rule out false positives.

  - **Assess potential lateral movement:** Examine network connections and intranet traffic (using tools like Sysmon’s Event ID 3 for network connections) originating from the affected processes to identify any suspicious behaviors, such as outbound connections to unfamiliar IP addresses.

  ### Prioritization

  This alert should be treated with medium priority due to the potential for significant impact if exploited—particularly in environments running critical applications. The likelihood of misuse is moderate as this method may not be widely weaponized, but awareness is essential given its capability to lead to deeper system compromise.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell Script Block Logging is not enabled, potentially obscuring the activity. Legitimate administrative scripts that utilize .NET profiling for valid troubleshooting or monitoring could trigger this alert, introducing false positives. Related detections, such as monitoring for unusual DLL loads or process injection techniques (T1055), would enhance overall coverage and improve incident response capabilities.

