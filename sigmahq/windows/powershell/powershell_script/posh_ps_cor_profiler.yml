title: Registry-Free Process Scope COR_PROFILER
id: 23590215-4702-4a70-8805-8dc9e58314a2
status: test
description: |
  Adversaries may leverage the COR_PROFILER environment variable to hijack the execution flow of programs that load the .NET CLR.
  The COR_PROFILER is a .NET Framework feature which allows developers to specify an unmanaged (or external of .NET) profiling DLL to be loaded into each .NET process that loads the Common Language Runtime (CLR).
  These profiliers are designed to monitor, troubleshoot, and debug managed code executed by the .NET CLR.
  (Citation: Microsoft Profiling Mar 2017)
  (Citation: Microsoft COR_PROFILER Feb 2013)
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.012/T1574.012.md#atomic-test-3---registry-free-process-scope-cor_profiler
author: frack113
date: 2021-12-30
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1574.012
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '$env:COR_ENABLE_PROFILING'
    - '$env:COR_PROFILER'
    - '$env:COR_PROFILER_PATH'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the COR_PROFILER environment variable, which adversaries may exploit to hijack the execution flow of .NET applications. By utilizing the COR_PROFILER variable, attackers can load an unmanaged profiling DLL into .NET processes, potentially allowing them to execute malicious code or gain elevated privileges without leaving traditional indicators, thereby enabling stealthy attacks. This technique falls under MITRE ATT&CK's **Privilege Escalation (T1068)**, **Defense Evasion (T1560)**, and **Persistence (T1547)** categories, particularly within the sub-technique **T1574.012: Registry-Free Process Scope**.

  The primary data sources for detection consist of PowerShell script block logs. These logs will capture any script activities that reference the COR_PROFILER variable, enabling incident responders to detect malicious scripts that may attempt to manipulate .NET processes. Given the targeting of the .NET framework, such detections are critical in identifying anomalies in enterprise environments that utilize .NET applications.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logs for any commands that include the `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, or `$env:COR_PROFILER_PATH` environment variables. Look for unusual usage patterns or scripts executed by non-standard users.

  - **Analyze Process Creation Events**: Investigate recent process creation events linked to .NET applications. Pay special attention to any .NET processes that have loaded custom DLLs, as these may indicate misuse of the COR_PROFILER setting.

  - **Correlate with User Activity**: Cross-reference the timestamps of the identified PowerShell scripts with user activity logs to determine if the execution corresponds with unusual user behaviors or other indicators of compromise.

  - **Validate DLL Integrity**: Check the integrity and origin of any DLLs being loaded in association with identified .NET processes. Ensure they are legitimate and authorized components as per your organization's software inventory.

  ### Prioritization
  The severity of this alert is medium due to the potential for privilege escalation and execution of unauthorized code within .NET applications. While the attack likelihood may be lower compared to other vectors, the impact could be significant if successfully exploited.

  ### Blind Spots and Assumptions
  This detection may miss malicious activity if script block logging is not enabled or properly configured on the monitored systems. Additionally, legitimate administrative actions could trigger false positives, likely leading to the assumption that all script activity is benign unless proven otherwise. For effective detection, ensure all relevant logging settings are applied across systems used to run .NET applications.

