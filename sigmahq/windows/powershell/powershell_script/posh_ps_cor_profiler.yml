title: Registry-Free Process Scope COR_PROFILER
id: 23590215-4702-4a70-8805-8dc9e58314a2
status: test
description: |
  Adversaries may leverage the COR_PROFILER environment variable to hijack the execution flow of programs that load the .NET CLR.
  The COR_PROFILER is a .NET Framework feature which allows developers to specify an unmanaged (or external of .NET) profiling DLL to be loaded into each .NET process that loads the Common Language Runtime (CLR).
  These profiliers are designed to monitor, troubleshoot, and debug managed code executed by the .NET CLR.
  (Citation: Microsoft Profiling Mar 2017)
  (Citation: Microsoft COR_PROFILER Feb 2013)
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.012/T1574.012.md#atomic-test-3---registry-free-process-scope-cor_profiler
author: frack113
date: 2021-12-30
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.012
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '$env:COR_ENABLE_PROFILING'
    - '$env:COR_PROFILER'
    - '$env:COR_PROFILER_PATH'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of environment variables related to .NET profiling, specifically `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, and `$env:COR_PROFILER_PATH`. Attackers may manipulate these variables to load unauthorized profiling assemblies into .NET applications, allowing them to intercept or alter application execution for malicious purposes, such as establishing persistence or data exfiltration. This behavior aligns with MITRE ATT&CK tactics for Privilege Escalation (TA0004) and Execution (TA0002), specifically technique T1574.012 (Registry Free COM).

  The primary telemetry source required is PowerShell script block logging, which will capture relevant commands associated with the malicious use of these environment variables. If exploited, this could lead to unauthorized access or manipulation of critical applications. However, detection of this activity does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Inspect PowerShell logs for suspicious execution:** Review PowerShell script block logs (Event ID 4104) for any occurrences of `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, and `$env:COR_PROFILER_PATH`. Note command context and user identity to determine if it’s an authorized user.

  - **Identify expected usage patterns:** Assess previous activity patterns for known administrative scripts, which may legitimately use COR_PROFILER. Compare user roles and historical actions to discern anomalous behavior.

  - **Check for unauthorized DLLs:** Investigate for any loaded .NET profiling DLLs by correlating process creation events (Event ID 4688) with the detected environment variables. Look for processes spawned that are not expected within the application lifecycle, especially those involving unknown paths.

  - **Correlate with other events:** Review associated logs (e.g., Sysmon Event ID 7 for DLL loading) to trace any instance where the profiler was invoked. A sudden increase in .NET process execution with these environment variables may indicate suspicious activity.

  - **Examine system integrity:** Use host integrity monitoring tools to check for unexpected changes in system files or configurations, as malware may attempt to introduce persistent profiling behavior.

  ### Prioritization

  This alert has medium severity given the potential impact on critical .NET applications. While the specific use of COR_PROFILER is not commonly weaponized, its existence in environments not utilizing .NET profiling for legitimate purposes warrants priority. Continuous monitoring is essential, as this behavior could signify an elevated risk profile.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for PowerShell script block logging to be enabled, which is not always in place in enterprise environments. Legitimate administrative scripts may trigger similar alerts, leading to false positives. A companion detection rule monitoring for suspicious DLL loading in .NET applications can enhance coverage and provide critical context to these alerts.

