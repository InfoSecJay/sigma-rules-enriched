- attack.defense-evasion
- attack.persistence
- attack.t1574.012
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - '$env:COR_ENABLE_PROFILING'
    - '$env:COR_PROFILER'
    - '$env:COR_PROFILER_PATH'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the COR_PROFILER environment variable, which adversaries may exploit to hijack the execution flow of .NET applications by specifying a profiling DLL. The likely attacker objective is to manipulate the behavior of .NET processes for malicious outcomes, such as data exfiltration or code execution. The relevant MITRE ATT&CK tactic is **Privilege Escalation**, and the technique is **Registry-Free Process Scope COR_PROFILER (T1574.012)**. Primary telemetry sources include PowerShell script block logs, specifically looking for Event IDs relevant to PowerShell execution (e.g., Event ID 4104). If malicious, this behavior can lead to unauthorized access, control over applications, and potential compromise of sensitive data. This detection does NOT confirm that an attack has occurred but indicates possibility based on specific environmental variables being set.

  ---

  ### Investigation Steps

  - **Review Script Block Logging:** Examine PowerShell logs for Event ID 4104 entries where the `ScriptBlockText` includes `$env:COR_ENABLE_PROFILING`, `$env:COR_PROFILER`, or `$env:COR_PROFILER_PATH`. Ensure that these variables are not part of expected administrative scripts during normal operations.

  - **Identify related applications:** Cross-check the sender of the scripts against a list of known legitimate administrative tools that might reference COR_PROFILER without malicious intent, which can clarify if the detected activity is part of normal operations.

  - **Analyze calling process details:** Inspect the context of the calling process in the logs, specifically looking for any parent-child relationships with malicious known processes or sudden execution of unfamiliar PowerShell scripts. Check Event ID 4688 for process creation details.

  - **Check Execution Frequency:** Investigate how frequently the environment variables are being set and from which users or processes. Frequent changes or manipulations from non-administrative accounts may indicate suspicious activity.

  - **Collect file system artifacts:** Validate any created profiling DLL files or associated artifacts in the file system. This may include checking paths typically targeted by attackers, such as temporary directories, for suspicious file creations or modifications.

  ---

  ### Prioritization

  The severity of this alert is medium, as the affected system may host critical applications relying on the .NET CLR. The likelihood of malicious abuse is moderate given the stealthy nature of this technique, although the behavior itself can occur in legitimate scenarios where profiling is actually needed.

  ---

  ### Blind Spots and Assumptions

  Common evasion techniques include legitimate administrative activities where COR_PROFILER is used for benign debugging purposes, potentially triggering false alerts. This detection requires PowerShell Script Block Logging to be enabled to be effective, which may not always be the case in all environments. Legitimate activities may include troubleshooting application performance in development environments, and a related detection to consider is monitoring for abnormal process creations following script execution to enhance coverage.

