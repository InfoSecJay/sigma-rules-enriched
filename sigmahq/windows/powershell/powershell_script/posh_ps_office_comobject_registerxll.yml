note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that interact with Microsoft Office add-ins through the registration of XLL files. Such behavior is often indicative of an attacker seeking to establish persistence on a compromised system, making it possible to execute arbitrary code whenever the Office application is launched. The relevant MITRE ATT&CK tactic is **Persistence (T1137.006)**.

  The primary telemetry sources for this detection are Windows PowerShell logs, specifically requiring Script Block Logging to be enabled. If malicious in nature, this activity can allow an adversary remote access and control over the victim's machine, leading to a severe security impact. However, this detection does NOT confirm that the action was indeed malicious; it merely indicates potentially suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Examine the event logs for PowerShell execution:** Review Windows Security Event ID 4104 for Script Block Logging outputs. Look for entries containing 'new-object ', '-ComObject ', '.application', and '.RegisterXLL'. Confirm if the scripts are executed from legitimate user accounts.

  - **Identify the user context of the PowerShell script:** Determine which user account executed the script by checking the Creator User Name field in Event ID 4688 (Process Creation). Legitimate use cases may include trusted system administrators executing PowerShell for typical Office maintenance tasks.

  - **Check for other suspicious indicators in system logs:** Investigate the Windows Event Log for Event ID 4688 for any parent process creation that includes Office applications (e.g., excel.exe, winword.exe) invoking PowerShell commands, which indicates possible abuse.

  - **Verify the existence and behavior of the XLL file:** Determine whether the XLL file registered through '.RegisterXLL' is present in typical directories (e.g., C:\Program Files\Microsoft Office\root\OfficeXX\) and check its hash against known safe files.

  - **Evaluate the machine for known persistence mechanisms:** Conduct a thorough check for known persistence mechanisms by inspecting registry keys pertinent to Office applications (like HKEY_CURRENT_USER\Software\Microsoft\Office\Excel\Addins) looking for unauthorized entries.

  ### Prioritization

  This alert is of **high severity** as it may indicate attempts at establishing persistence by adversaries through Office applications, which are frequently exploited for attack vectors. The likelihood of malicious abuse is notable due to the scripted nature of the activity and its common misuse in real-world scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by user behaviors that script legitimate administrative tasks, potentially leading to false positives. It is crucial that Script Block Logging is enabled for effective capture of these events. Additionally, legitimate Office add-in registrations may trigger this alert; understanding typical user workflows is essential. A related detection would be monitoring execution of commands in Office applications (e.g., **T1137.001 - Office Application Add-ins**), which can complement persistence analysis.

