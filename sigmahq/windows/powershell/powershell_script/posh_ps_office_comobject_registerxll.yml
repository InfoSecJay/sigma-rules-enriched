title: Code Executed Via Office Add-in XLL File
id: 36fbec91-fa1b-4d5d-8df1-8d8edcb632ad
status: test
description: |
  Adversaries may abuse Microsoft Office add-ins to obtain persistence on a compromised system.
  Office add-ins can be used to add functionality to Office programs
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1137.006/T1137.006.md
author: frack113
date: 2021-12-28
tags:
- attack.persistence
- attack.t1137.006
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'new-object '
    - '-ComObject '
    - '.application'
    - '.RegisterXLL'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious activity involving the execution of code via Microsoft Office add-ins, specifically through the use of XLL (Excel Add-in) files. Threat actors may exploit Office add-ins to maintain persistence within a compromised system by using them to execute unauthorized scripts or commands. The primary objective of such an attack is often to perform tasks that facilitate further exploitation, such as data exfiltration, system reconnaissance, or additional payload delivery.

  Relevant MITRE ATT&CK techniques include **Persistence** via Office Add-ins (T1137.006). Attackers leveraging this technique typically aim to create a means for persistent access, evading detection while gaining elevated control over the target environment. The primary data sources for this detection primarily involve PowerShell script block logs, as they capture the execution context of scripts run on the system, which can reveal abnormal behavior associated with Office add-ins or other malicious payloads.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check PowerShell script block logs for any entries that match the detection logic, specifically looking for the execution of new objects, COM objects, and RegisterXLL commands.
  - **Examine Excel Add-ins:** Investigate any installed Excel add-ins on the affected system for unfamiliar or unauthorized entries that may correlate with suspicious activity.
  - **Analyze User Activity:** Correlate user activity logs to determine if the usage patterns around Office applications, particularly Excel, show anomalies or unexpected behavior that may suggest abuse.
  - **Check for Persistence Mechanisms:** Look for unexpected registry entries or file creation related to Office add-ins, especially those tied to the execution of the identified commands that could inform on persistence mechanisms.

  ### Prioritization
  Given the high severity level of this alert, the detection indicates a significant risk of persistent threats within the environment, as malicious actors may use Office add-ins to execute further malicious activities, thereby compromising sensitive data and system integrity.

  ### Blind Spots and Assumptions
  This detection may miss certain attack vectors where script block logging is not enabled, leading to gaps in coverage for alternative methods of executing malicious commands. The detection logic assumes an attacker will use recognizable patterns when attempting to exploit Office add-ins and that the target environment has sufficient logging configurations enabled. Additionally, variations in how add-ins are utilized by legitimate users may lead to false positives if not properly contextualized.

