note: |
  ### Technical Context

  This Sigma rule detects the execution of malicious code via Microsoft Office add-ins that utilize XLL (Excel Add-in) files. The likely attacker objective is to maintain persistence on the compromised system by leveraging Office’s extensibility features. This behavior is classified under the MITRE ATT&CK framework as "Persistence" (TA0003) with the specific technique of "Office Add-in" (T1137.006).

  The primary telemetry source required is PowerShell script block logging, capturing events related to the execution of potentially malicious Office add-in manipulations. If exploited, this could grant adversaries ongoing access to sensitive data and control over the affected systems. It is critical to note that detection of this activity does NOT confirm that the system has been compromised; further investigation is needed to assess whether the activity is malicious or benign.

  ### Investigation Steps

  - **Review PowerShell logs for Script Block Execution:** Check Windows Event ID 4104 for Script Block logging. Look for ScriptBlockText that contains 'new-object ', '-ComObject ', '.application', or '.RegisterXLL'. Malicious indicators include creation of objects related to Excel add-ins.

  - **Correlate with Office application usage:** Identify legitimate instances where Office applications interacted with XLL files. Review application logs to confirm usual business operations involving add-ins, focusing on timestamps that match the alert.

  - **Check for suspicious Scheduled Tasks:** Investigate Task Scheduler for tasks created that reference Office applications or XLL files. Malicious tasks may have naming conventions that differ from normal organizational practices.

  - **Analyze network traffic for unusual patterns:** Review outbound firewall logs to identify connections initiated by Office applications that are unusual for the asset in question. Look for connections to unusual external domains or IP addresses.

  - **Identify user account activity:** Examine logon patterns and user behavior related to the involved account for anomalies. A sudden increase in Office application usage or logons at odd hours may indicate compromise.

  ### Prioritization

  The alert is of high severity due to the potential impact on sensitive data and the likelihood of adversaries leveraging this technique for persistence. This behavior is commonly weaponized by attackers aiming to maintain long-term access to systems. Systems with a high level of sensitivity or criticality should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if PowerShell logging is not enabled or if script block logging is configured improperly. Legitimate activities, such as the use of internal Office add-ins for common business functions, may trigger this alert. A related detection for enhanced coverage would be monitoring for the creation of unusual Excel files or add-ins, which can indicate pre-attack reconnaissance efforts or active exploitation scenarios.

