title: WMImplant Hack Tool
id: 8028c2c3-e25a-46e3-827f-bbb5abf181d7
status: test
description: Detects parameters used by WMImplant
references:
- https://github.com/FortyNorthSecurity/WMImplant
author: NVISO
date: 2020-03-26
modified: 2022-12-25
tags:
- attack.execution
- attack.t1047
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'WMImplant'
    - ' change_user '
    - ' gen_cli '
    - ' command_exec '
    - ' disable_wdigest '
    - ' disable_winrm '
    - ' enable_wdigest '
    - ' enable_winrm '
    - ' registry_mod '
    - ' remote_posh '
    - ' sched_job '
    - ' service_mod '
    - ' process_kill '
            # - ' process_start '
    - ' active_users '
    - ' basic_info '
            # - ' drive_list '
            # - ' installed_programs '
    - ' power_off '
    - ' vacant_system '
    - ' logon_events '
  condition: selection
falsepositives:
- Administrative scripts that use the same keywords.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands associated with the WMImplant tool, which identifies and executes various administrative actions on compromised systems. The likely attacker objective is to maintain access and control over a target system while performing reconnaissance or lateral movement. This activity maps to the MITRE ATT&CK tactics of "Execution" (TA0002) and "Command and Control" (TA0011), using techniques T1047 (Windows Management Instrumentation) and T1059.001 (PowerShell).

  The primary telemetry source is Windows PowerShell script block logs, specifically events generated when script block logging is enabled. If the alert corresponds to malicious use of WMImplant, the security impact could be significant, potentially leading to unauthorized access and data exfiltration. It is important to note that this detection does NOT confirm a successful compromise on its own; further investigation is required to link the activity to an attacker.

  ### Investigation Steps

  - **Verify telemetry source:** Check for PowerShell script block logging (Event ID 4104) on the host to confirm the alerts are based on relevant log entries.

  - **Identify legitimate activity:** Investigate if legitimate administrative scripts using similar keywords are executed in the environment. Common benign usages might include routine administrative tasks by authorized personnel.

  - **Correlate malicious indicators:** Look for specific parameters like "WMImplant" or "command_exec" in the PowerShell script block logs (Event ID 4104) as strong indicators of malicious activity.

  - **Analyze user context:** Review the user context (user SID and username) associated with the execution to determine if it aligns with known administrative accounts or if it's anomalous.

  - **Check system impact:** Assess the criticality of the affected system (e.g., a domain controller vs. a non-critical endpoint) to prioritize the incident response.

  - **Review activity timeline:** Analyze the timeline of events around the alert to correlate with other suspicious activities, such as lateral movement attempts or unusual login times.

  ### Prioritization

  The alert is of high severity due to the potential impact on critical systems and the high likelihood that similar behaviors can be weaponized by adversaries. The use of WMImplant indicates a targeted attack vector that may facilitate further compromise within the network environment.

  ### Blind Spots and Assumptions

  Detection capabilities can be limited by the lack of enabled script block logging on Windows systems, which is required for this rule to function correctly. Legitimate administrative activities may inadvertently trigger this alert, especially if they involve direct PowerShell scripting. Companion detections that can enhance coverage include monitoring for known WMImplant persistence techniques, such as unusual service creation or registry modifications associated with malware behavior.

