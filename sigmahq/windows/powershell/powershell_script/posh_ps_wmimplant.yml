  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'WMImplant'
    - ' change_user '
    - ' gen_cli '
    - ' command_exec '
    - ' disable_wdigest '
    - ' disable_winrm '
    - ' enable_wdigest '
    - ' enable_winrm '
    - ' registry_mod '
    - ' remote_posh '
    - ' sched_job '
    - ' service_mod '
    - ' process_kill '
            # - ' process_start '
    - ' active_users '
    - ' basic_info '
            # - ' drive_list '
            # - ' installed_programs '
    - ' power_off '
    - ' vacant_system '
    - ' logon_events '
  condition: selection
falsepositives:
- Administrative scripts that use the same keywords.
level: high
note: |
  ### Technical Context
  This detection rule targets the WMImplant hacking tool, which is typically utilized for post-exploitation tasks such as managing and controlling compromised systems remotely. WMImplant is particularly notable for its ability to manipulate PowerShell and execute various commands that facilitate unauthorized access and persistence within a target environment. An attacker employing WMImplant aims to maintain a foothold in the system, extract sensitive information, or conduct lateral movement across the network.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - Execution (TA0002) – as WMImplant uses PowerShell scripts to execute commands (T1059.001).
  - System Services (TA0006) and Command and Control (TA0011) – given its functionalities of modifying service configurations and enabling remote access protocols to establish communication channels (T1047).

  Primary data sources for this detection include Windows PowerShell script block logs, which capture executed commands and their parameters if Script Block Logging is enabled. Monitoring these logs can help identify suspicious activity conducted through WMImplant.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Investigate logs for any commands or parameters associated with WMImplant, including potential keywords such as 'change_user' and 'command_exec'.
  - **Analyze Execution Context:** Determine the context in which the script was executed to assess whether it was initiated by a trusted user or program. Look for anomalies in the user’s activity patterns.
  - **Check for Persistence Mechanisms:** Examine scheduled tasks or service modifications that may indicate an attempt to maintain a presence on the system, specifically looking for any created or modified jobs related to WMImplant.
  - **Correlate with Other Data Sources:** Look for related indicators across other telemetry datasets, such as EDR and network logs, to identify potential lateral movement or command and control communications linked to the detected PowerShell activity.

  ### Prioritization
  This alert's severity is rated high due to WMImplant's capabilities as a post-exploitation tool directly related to unauthorized access and control within an enterprise, presenting a significant threat if left undetected.

  ### Blind Spots and Assumptions
  There are inherent limitations in detecting sophisticated adversaries who may utilize obfuscation techniques or custom scripts that do not trigger scripted block logging. The detection relies on the assumption that Script Block Logging is enabled on all relevant systems; if it is disabled, critical commands may not be captured. Additionally, administrative scripts that may employ similar command terminology could lead to false positives, thereby complicating analysis without context. Ensuring comprehensive logging and understanding the environment's normal activity patterns are essential for improving detection efficacy.

