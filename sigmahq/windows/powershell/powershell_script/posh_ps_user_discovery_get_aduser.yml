note: |
  ---

  ### Technical Context

  The rule detects the usage of the PowerShell cmdlet `Get-ADUser`, particularly when it is being employed to export user account information to a file. This behavior is frequently indicative of reconnaissance activities where an attacker attempts to enumerate or harvest user data from Active Directory. The likely attacker objective is to gather credentials or further understanding of the user landscape within an organization, which can facilitate subsequent attacks. This aligns with the MITRE ATT&CK technique: **Account Discovery (T1087)**.

  Primary telemetry sources for this detection include Windows PowerShell logs with Script Block Logging enabled, specifically capturing events that log command executions. If malicious in nature, this could result in sensitive account information being leaked or exploited. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may employ the same commands.

  ---

  ### Investigation Steps

  - **Review PowerShell logs:** Check Windows Event ID 4103 for ScriptBlock logging entries closely following the execution timestamp of the alert, focusing on user activities with elevated privileges to identify if the `Get-ADUser` cmdlet is used for information gathering.

  - **Assess command output destination:** Examine the output parameters used alongside `Get-ADUser`, specifically looking for `Out-File`, `Set-Content`, or `Add-Content`, which indicate data is being written to a file. Legitimate scripts generally use specific paths or formats (e.g., `.csv` or `.txt`) in expected locations.

  - **Cross-check user permissions:** Investigate the user account executing the command to understand its role. Administrative accounts or accounts with unusual privileges are more likely to indicate malicious intent versus standard user accounts.

  - **Identify external connections:** Check for unusual outbound connections following the script execution, using Windows Firewall logs (Event ID 5156) or other network monitoring tools. This can indicate potential data exfiltration.

  - **Look for anomalies in historical activity:** Use Sysmon logs (Event ID 1) to analyze recent PowerShell execution patterns against baselines to identify any unusual behavior. Legitimate administrative actions should demonstrate a consistent pattern.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the sensitive nature of user data in Active Directory and the likelihood of it being weaponized for further attacks. The impact of an active breach could lead to account compromise and elevated privileges throughout the organization.

  ---

  ### Blind Spots and Assumptions

  This detection may miss activities using alternate methods of user enumeration not utilizing `Get-ADUser`. It is crucial that Script Block Logging is enabled for reliable detection. Legitimate administrative activities, such as routine audits or user account clean-ups, can trigger this alert. A related detection to consider is monitoring for the use of `Set-Content` or file creation logs to catch output behavior more broadly.

