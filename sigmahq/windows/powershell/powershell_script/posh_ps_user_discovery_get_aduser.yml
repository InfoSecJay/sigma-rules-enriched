logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ADUser '
    - ' -Filter \*'
    ScriptBlockText|contains:
    - ' > '
    - ' | Select '
    - 'Out-File'
    - 'Set-Content'
    - 'Add-Content'
  condition: selection
falsepositives:
- Legitimate admin scripts may use the same technique, it's better to exclude 
  specific computers or users who execute these commands or scripts often
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the **Get-ADUser** cmdlet in PowerShell to gather user information, potentially indicating unauthorized user enumeration or reconnaissance. The likely attacker objective is to collect valuable data about users in the Active Directory environment, which may facilitate further attacks, such as privilege escalation or lateral movement. This behavior falls under the MITRE ATT&CK tactic of **Discovery (T1087)** and technique **Enumerate Account (T1033)**.

  The primary telemetry source is **PowerShell Script Block Logging**, which must be enabled to capture relevant activity. If malicious, this behavior can lead to significant security impacts, as it may expose user details to attackers. However, it’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also invoke similar commands.

  ### Investigation Steps

  - **Identify the command execution source**: Review **Windows Security Event ID 4688** for the process creation logs associated with PowerShell execution. Look for the specific invocation of the **Get-ADUser** cmdlet and correlate the process with user account permissions.

  - **Analyze the output redirection**: Check for **ScriptBlockText** parameters in PowerShell logs where the output is directed to a file using **Out-File**, **Set-Content**, or **Add-Content**. Cross-reference the output file path and contents to determine the nature and sensitivity of the data exported.

  - **Validate user role and activity**: Compare the user executing the command against expected administrative activities. Legitimate administrators often use the **Get-ADUser** cmdlet, but review if this user has a known role aligned with user enumeration.

  - **Detect high-confidence malicious indicators**: Look for unusual execution patterns, such as **Get-ADUser** combined with the `-Filter` parameter and output redirection, in environments not typically associated with administrative user queries (e.g., user workstations instead of server environments).

  - **Inspect related session activity**: Collect and correlate logs from **Sysmon Event ID 1 (Process Creation)** to assess the context of the process creation along with any preceding or subsequent actions that indicate suspicious behavior.

  ### Prioritization

  This alert is of **medium severity** within an enterprise context as it can indicate potential reconnaissance efforts and information gathering by an unauthorized user. The impact could escalate to data breaches if sensitive user information is harvested. While user enumeration is a common technique utilized by attackers, benign administrative scripts may also trigger this detection.

  ### Blind Spots and Assumptions

  Detection may be limited by factors such as disabled Script Block Logging or API call obfuscation techniques, allowing adversaries to bypass detection. Environments without PowerShell logging may miss these indicators. Additionally, legitimate administrative scripts may perform similar commands, leading to potential false positives. A companion detection to consider is monitoring for elevated privileges following user enumeration activities, thereby strengthening defensive postures.

