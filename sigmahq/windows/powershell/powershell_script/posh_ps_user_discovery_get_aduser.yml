title: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
id: c2993223-6da8-4b1a-88ee-668b8bf315e9
related:
- id: 1114e048-b69c-4f41-bc20-657245ae6e3f
  type: similar
status: test
description: Detects usage of the Get-ADUser cmdlet to collect user information and
  output it to a file
references:
- http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
- https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-17
tags:
- attack.discovery
- attack.t1033
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ADUser '
    - ' -Filter \*'
    ScriptBlockText|contains:
    - ' > '
    - ' | Select '
    - 'Out-File'
    - 'Set-Content'
    - 'Add-Content'
  condition: selection
falsepositives:
- Legitimate admin scripts may use the same technique, it's better to exclude specific
  computers or users who execute these commands or scripts often
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell `Get-ADUser` cmdlet, which is often employed by attackers to gather user information from Active Directory and potentially exfiltrate this data to a file. Such behavior may indicate reconnaissance activity where threat actors aim to identify user accounts, permissions, or relationships within the organization. This activity is typically aligned with the tactics of discovering information about the network, possibly in preparation for further attacks like credential harvesting or lateral movement.

  The relevant MITRE ATT&CK tactics and techniques implicated in this detection include:
  - **Tactic: Discovery** (ID: TA0007)
    - **Technique: Active Directory Enumeration** (ID: T1033)

  The primary data sources for this detection include Windows PowerShell script execution logs, specifically those that capture Script Block Logging. When configured correctly, these logs reveal the commands run via PowerShell, including those executed by both administrators and potential attackers.

  ### Investigation Steps
  - **Review PowerShell Execution Logs**: Examine Script Block Logging and PowerShell event logs for instances of the `Get-ADUser` cmdlet that conform to the detection logic, particularly focusing on commands that include output redirection or piping.
  - **Inspect User Privilege Levels**: Analyze the user account that executed the command to determine if it has elevated privileges. Check for any unusual access patterns or affiliations to administrative roles.
  - **Correlate with Network Activity**: Look for any outbound connections or data transfers that coincide with the timing of the `Get-ADUser` execution, as this may indicate potential data exfiltration.
  - **Review Recent Changes**: Investigate any recent configuration changes to Active Directory or related security postures, as attackers often exploit misconfigurations to facilitate their discovery activities.

  ### Prioritization
  This alert is assigned medium severity due to the potential for information gathering that could lead to further malicious activities, such as privilege escalation or account compromise. The likelihood of legitimate administrative use exists, but the context and frequency of these commands need to be assessed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Script Block Logging is not enabled or configured correctly on target systems—without this logging, instances of the `Get-ADUser` cmdlet may go undetected. The detection logic assumes that adversaries will use different output methods that can be represented clearly in log data. Additionally, legitimate administrative activities may result in false positives, thus requiring careful monitoring of user behavior patterns in context to this specific command.

