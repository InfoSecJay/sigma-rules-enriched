note: |
  ### Technical Context

  This rule detects the execution of the PSAttack PowerShell tool, indicated by the presence of the string “PS ATTACK!!!” in ScriptBlockLogging events. PSAttack is designed for various offensive security tasks such as post-exploitation and evading detection. The likely objective of an attacker using this tool is to facilitate lateral movement, escalate privileges, or perform reconnaissance within the target environment. This behavior aligns with the MITRE ATT&CK technique "Command and Scripting Interpreter" (T1059.001), specifically involving PowerShell.

  The primary telemetry source relies on Windows Script Block Logging, which must be enabled to capture the relevant events. If this activity is malicious, it can facilitate unauthorized access and manipulation of systems. This detection does NOT confirm a successful compromise by itself; further investigation is critical to determine the intent and context of the PowerShell execution.

  ### Investigation Steps

  - **Check ScriptBlockLogging events:** Review Windows Event IDs 4103 for instances of “PS ATTACK!!!” in the ScriptBlockText field. Look for frequency and context of the usage to assess legitimacy.

  - **Correlate with process creation logs:** Review Security Event ID 4688 to identify parent processes that triggered ScriptBlockLogging events for PSAttack. Legitimate executions would commonly be associated with trusted administrative tools like SCCM or legitimate management scripts.

  - **Assess execution context:** Validate the user account executing the PowerShell script. Check for administrative privileges and recent login activity through Event ID 4624 to determine if the user has a legitimate reason to run such scripts.

  - **Review related command history:** Check the PowerShell command history or transcripts if available for any suspicious commands or context leading up to the PSAttack execution. Use `Get-History` if available on the compromised host to see a list of executed commands for anomalies.

  - **Investigate lateral movement attempts:** Look for network traffic correlating with the execution of PSAttack, particularly outgoing connections that may indicate data exfiltration or command and control communication. Tools like Zeek or network appliance logs may help in identifying unusual outbound traffic patterns.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical systems and the increased likelihood of malicious use to exploit and traverse the network. PSAttack is frequently employed by adversaries, making this detection essential in identifying potential breaches.

  ### Blind Spots and Assumptions

  Detection may be bypassed if Script Block Logging is not enabled or if malicious actors obfuscate their PowerShell commands. Legitimate administrative scripts may trigger this alert if they accidentally contain the trigger string. A related detection might include monitoring for abnormal PowerShell usage patterns or command execution frequency which would enhance visibility into potential malicious behaviors.

