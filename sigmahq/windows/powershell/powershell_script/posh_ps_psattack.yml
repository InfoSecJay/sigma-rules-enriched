note: |
  ### Technical Context
  This rule is designed to detect the use of PSAttack, a PowerShell-based hacking tool that is used by attackers to facilitate various malicious activities, including penetration testing and exploitation of vulnerable systems. PSAttack typically leverages built-in Windows PowerShell functionalities, which makes its detection challenging yet critical in identifying potentially malicious behavior in enterprise environments.

  The likely attacker objectives when employing PSAttack include gaining unauthorized access to systems, elevating privileges, or conducting lateral movement within a network. By identifying script blocks that include specific keywords related to PSAttack, security teams can proactively respond to possible attacks before any damage occurs.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - Execution (TA0002)
  - Command and Scripting Interpreter: PowerShell (T1059.001)

  The primary data sources for detecting this activity are:
  - PowerShell script block logging, which captures detailed information about executed PowerShell commands and their associated parameters.

  ### Investigation Steps
  - **Review Script Block Logs:** Examine the PowerShell script block logs for instances of 'PS ATTACK!!!' being executed. Look for any unusual or unexpected PowerShell command activity around that time.
  - **Inspect Related Processes:** Check for processes initiated around the same time as the detected command, particularly focusing on parent-child relationships in process creation events to identify potential exploitation paths.
  - **Analyze User Behavior:** Review the user accounts executing the PSAttack command. Look for anomalous login patterns or behaviors that deviate from baseline levels, suggesting possible credential compromise.
  - **Correlate with Other Logs:** Cross-reference findings with network logs (such as EDR telemetry) and other relevant sources to identify any lateral movement or additional, malicious behavior indicators.

  ### Prioritization
  The alert is categorized as high severity due to the nature of the PSAttack tool, which can facilitate significant unauthorized activities, including system compromise and data exfiltration. Given the tool's use in penetration testing, detection indicates a potential active exploitation attempt or a compromised system.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include systems where PowerShell script block logging has not been enabled, which would result in missed detections. The detection logic assumes that the malicious use of PSAttack will always include the specific string 'PS ATTACK!!!', thus it may miss variations or obfuscations of the command. The effectiveness of this alert relies on the proper configuration and logging of PowerShell events and assumes that all relevant systems have the needed logging capabilities enabled.

