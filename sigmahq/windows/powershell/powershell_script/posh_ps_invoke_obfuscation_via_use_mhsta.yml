- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of MSHTA (Microsoft HTML Application Host) to execute obfuscated PowerShell scripts, often indicative of an attacker's attempt to bypass security measures. The likely objective of the attacker is to execute malicious scripts in a stealthy manner, taking advantage of the `mshta.exe` process to obscure their actions from traditional detection methods. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1059.001) and Defense Evasion (T1027).

  The primary telemetry sources include Windows PowerShell script logs, specifically Script Block Logging events (Event ID 4104). If the activity is malicious, it could lead to unauthorized system access, data exfiltration, or further attacks within the network. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Examine Script Block Log Events:** Check Windows Security Event ID 4104 for Script Block Logging entries. Focus on logs containing keywords such as `mshta`, `vbscript:createobject`, and the execution of obfuscated commands.

  - **Identify High-Risk Script Execution:** Look for any PowerShell scripts that include the command `mshta` and utilize obfuscated text. Malicious scripts typically try to conceal their intentions through complex expressions.

  - **Validate Legitimate Scripts:** Review the context of the execution by cross-referencing the user account that executed the script. Assess if this user typically runs PowerShell scripts and their role (e.g., administration, routine maintenance).

  - **Correlate with Other Security Events:** Investigate any recent or linked security alerts around the same time frame. Look for Event ID 4688 (Process Creation) to see if `mshta.exe` was spawned by a suspicious parent process, which can indicate potential malicious behavior.

  - **Check for File Creation or Modifications:** Inspect the file system for artifacts created by the invoked scripts. Look for temporary files, particularly in the `%TEMP%` directory, or any output files resultant from the script's execution.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems, especially if the affected asset is involved in sensitive operations. The likelihood of malicious use is significant, given that obfuscation techniques are commonly weaponized in attacks to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled, which is not always the case in all environments. Legitimate uses of MSHTA in authorized scripts may trigger this alert. A related detection rule for monitoring `mshta.exe` execution with an emphasis on its parent processes could provide supplementary insights into potential misuse.

