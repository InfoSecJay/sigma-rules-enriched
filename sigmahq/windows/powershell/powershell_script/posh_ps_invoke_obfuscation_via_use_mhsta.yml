  ---

  ### Technical Context

  The rule detects the execution of obfuscated PowerShell scripts that utilize MSHTA to execute VBScript commands. This technique is often employed by attackers to bypass security controls while executing malicious code, with the likely objective being to gain unauthorized access or control of a system. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1027)** and **Execution (T1059.001)**.

  The primary telemetry source includes PowerShell script block logs, specifically requiring that Script Block Logging is enabled (Event ID 4104), which captures the textual content of executed PowerShell scripts. If malicious, this behavior could lead to system compromise, data exfiltration, or lateral movement within the environment. Importantly, this detection does not confirm actual compromise; it merely raises suspicion regarding potentially malicious scripting activity.

  ---

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check Windows Event ID 4104 for with ScriptBlockText containing common obfuscation patterns like `set && mshta vbscript:createobject`. Look for high entropy strings typical in obfuscated scripts.

  - **Validate Legitimate Use Cases:** Identify and analyze events where legitimate software may invoke MSHTA for valid administrative tasks (e.g., applications that use MSHTA for help or update functionalities). Examine user accounts and context to determine if this aligns with known business practices.

  - **Assess User Context and Patterns:** Investigate the user account associated with the alert; if the account has no history of running MSHTA commands or if it’s a non-admin user executing this script, classify as high-risk.

  - **Correlate with Other Alerts:** Cross-reference the event with other logs (e.g., Sysmon Event ID 1 for process creation) showing PowerShell processes initiated by MSHTA. Identify if subsequent commands indicate data exfiltration or malicious downloads.

  - **Check for Process Chain:** Examine the parent-child process relationship, focusing on the process that initiated the MSHTA execution (e.g., a suspicious PowerShell process initiating MSHTA). Use Sysmon Event ID 10 for detailed process creation logs.

  - **Monitor Script Behavior:** If possible, capture and analyze any resulting scripts or network calls made by MSHTA to show suspicious behavior or C2 communication patterns. Validate any file creation events (e.g., by monitoring Event ID 4663 for access to sensitive files or folders).

  ---

  ### Prioritization

  This alert has a high severity level due to the potential for significant impact on the enterprise environment, particularly if it involves administrative systems or sensitive data. The likelihood of malicious abuse is high given that obfuscation techniques like this are frequently leveraged by threat actors in successful attacks. Such behavior is commonly weaponized in phishing and malware delivery campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the need for Script Block Logging to be enabled on all endpoints; without this, malicious activity may go unnoticed. Legitimate applications that use MSHTA for benign purposes may trigger this alert, requiring deep context for user activity. Additionally, threat actors may employ various evasion techniques such as disguising their scripts to avoid detection. Companion detections, such as PowerShell activity monitoring tools or abnormal network traffic logs post-execution, can reinforce visibility into this threat landscape.

