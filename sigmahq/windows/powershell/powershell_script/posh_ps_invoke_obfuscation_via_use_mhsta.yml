logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - 'set'
    - '&&'
    - 'mshta'
    - 'vbscript:createobject'
    - '.run'
    - '(window.close)'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is aimed at identifying obfuscated PowerShell scripts that utilize MSHTA for execution, a technique often employed by threat actors to execute malicious payloads while evading detection. By harnessing the capabilities of MSHTA, attackers can bypass security controls and execute scripts that could otherwise be flagged by traditional security measures. The primary motivations behind this behavior typically include executing malicious code, delivering payloads, or establishing a foothold within the enterprise environment.

  Relevant MITRE ATT&CK techniques include **Execution - PowerShell (T1059.001)**, which encompasses the execution of scripts to gain a foothold or perform malicious activities, and **Defense Evasion - Obfuscated Files or Information (T1027)**, which highlights the importance of concealing the true nature of the commands being run. The primary data sources for this detection include PowerShell script block logs that capture details about script execution, such as the content and context of scripts being executed.

  ### Investigation Steps
  - **Review Script Block Logs:** Collect and analyze PowerShell script block logs to identify instances where obfuscated scripts are executed, especially those containing terms like 'mshta' and 'vbscript:createobject'.
  - **Analyze Process Creation Events:** Check process creation logs for instances where MSHTA is invoked, paying particular attention to the parent and child processes to identify suspicious execution chains.
  - **Investigate Network Connections:** Examine network logs for outgoing or unusual connections initiated by the MSHTA process to identify potential command-and-control (C2) communications or data exfiltration attempts.
  - **Validate Security Configurations:** Ensure that Script Block Logging is enabled across all Windows endpoints to enhance visibility into PowerShell activities and strengthen detection capabilities.

  ### Prioritization
  This alert is rated high severity due to the malicious nature of obfuscated PowerShell scripts that can lead to significant security incidents, including data breaches and system compromise. The likelihood of exploitation is elevated as attackers frequently leverage such tactics to evade detection.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that Script Block Logging is enabled; without this, PowerShell activity may go undetected. There may also be blind spots in environments where obfuscation techniques evolve, requiring continual updates to detection rules. Additionally, the reliance on specific keywords means that non-malicious scripts using similar language could trigger false positives, necessitating further investigation to differentiate legitimate activity from potential threats.

