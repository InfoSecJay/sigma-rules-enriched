logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - 'set'
    - '&&'
    - 'mshta'
    - 'vbscript:createobject'
    - '.run'
    - '(window.close)'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the use of obfuscated PowerShell scripts executed via MSHTA (Microsoft HTML Application Host) that may indicate malicious activity. Attackers often leverage this technique to execute hidden commands while avoiding direct detection by traditional security solutions. This behavior aligns with the MITRE ATT&CK framework under the Execution tactic (T1059.001 - PowerShell) and the Defense Evasion tactic (T1027 - Obfuscated Files or Information).

  The primary telemetry sources for this detection include Windows PowerShell logs, specifically event ID 4104, which captures executed script block content, necessitating that Script Block Logging is enabled to generate the required logs. The security impact could be significant, as successful exploitation may lead to unauthorized access, lateral movement, or deployment of malware. However, this rule does not confirm that the activity is inherently malicious; benign scripts using MSHTA for valid purposes could also trigger this alert.

  ### Investigation Steps

  - **Validate script block logging status:** Check GPO settings to ensure Script Block Logging is enabled. This is vital as the detection relies on Event ID 4104.

  - **Review PowerShell event logs for suspicious script execution:** Look for Event ID 4104 entries containing the keywords: 'set', '&&', 'mshta', 'vbscript:createobject', '.run', '(window.close)'. Entries containing these may indicate malicious obfuscation.

  - **Identify known good uses of MSHTA:** Investigate previous successful use cases of MSHTA in your environment to establish a baseline of legitimate activity (e.g., administrative script execution during software deployments).

  - **Assess for abnormal parent processes:** Correlate the identified event with parent processes using event ID 4688 (Process Creation). Look for unusual parent processes such as `mshta.exe` initiated by processes like `explorer.exe` or non-interactive users.

  - **Inspect for network activity associated with the script:** Use firewall or proxy logs to identify any outbound connections from the host running the detected script. Malicious scripts often connect to command and control servers or exfiltrate data.

  - **Confirm presence of obfuscation patterns:** Evaluate the actual script execution for signs of obfuscation techniques, such as the use of '&&' for chaining commands or unusual cmdlets that are not part of standard operations.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on enterprise security. The use of obfuscated PowerShell via MSHTA is a common technique employed by threat actors and indicates potential compromise or malicious intent. Given the prevalence of PowerShell in attacks, this activity warrants immediate investigation.

  ### Blind Spots and Assumptions

  The main detection limitations include obfuscation techniques that may evade logging and variations in legitimate scripting practices that could trigger this alert. Accurate logging from PowerShell and MSHTA might require additional configurations, such as enabling extensive logging settings. Legitimate uses of MSHTA that may generate false positives can include administrative or automation scripts. A companion detection that enhances coverage is monitoring for unusual PowerShell cmdlet usage, especially when paired with suspicious parent processes.

