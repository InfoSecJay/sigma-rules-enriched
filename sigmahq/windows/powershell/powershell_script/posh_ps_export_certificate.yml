title: Certificate Exported Via PowerShell - ScriptBlock
id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
related:
- id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
  type: similar
status: test
description: Detects calls to cmdlets inside of PowerShell scripts that are used to
  export certificates from the local certificate store. Threat actors were seen abusing
  this to steal private keys from compromised machines.
references:
- https://us-cert.cisa.gov/ncas/analysis-reports/ar21-112a
- https://learn.microsoft.com/en-us/powershell/module/pki/export-pfxcertificate?view=windowsserver2022-ps
- https://www.splunk.com/en_us/blog/security/breaking-the-chain-defending-against-certificate-services-abuse.html
author: Florian Roth (Nextron Systems)
date: 2021-04-23
modified: 2023-05-18
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Export-PfxCertificate'
    - 'Export-Certificate'
  filter_optional_module_export:
    ScriptBlockText|contains: 'CmdletsToExport = @('
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate certificate exports by administrators. Additional filters might be required.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of PowerShell cmdlets specifically designed for exporting certificates from the local certificate store, such as `Export-PfxCertificate` and `Export-Certificate`. The detection is crucial as threat actors may exploit these commands to obtain private keys for certificates, ultimately facilitating lateral movement, data exfiltration, or impersonation attacks after compromising a machine. Compromised private keys can severely undermine security posture, enabling further attacks against the organization.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Credential Access** (TA0006)
    - **Application Layer Protocol** (T1552)
    - **Export of Certificates** (T1552.004)

  Primary data sources for this detection include PowerShell script block logs, which require Script Block Logging to be enabled to ensure comprehensive capture of PowerShell activity.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs to identify instances of `Export-PfxCertificate` or `Export-Certificate` being executed, especially from unexpected user accounts or during unusual times.
  - **Check User Context:** Investigate the user context in which the commands were executed, looking for signs of unauthorized access, such as accounts with elevated privileges or suspicious login patterns.
  - **Investigate Recent Certificate Changes:** Look for recent changes in the local certificate store that coincide with the detected activity, particularly focusing on the export of sensitive private keys.
  - **Correlate with Other Alerts:** Cross-reference this alert with other security detections, such as lateral movement indicators, to assess whether the exporting of certificates is part of a larger attack strategy.

  ### Prioritization
  This alert has a **medium** severity due to the potential impact on the organization's security if private keys are compromised. The likelihood of exploitation can be significant, especially in environments where attackers may gain footholds through credential theft or privilege escalation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if Script Block Logging is not enabled or configured correctly, which may lead to missed instances of certificate exports. The detection logic assumes attackers will use the specified cmdlets and that these activities will be logged effectively. Organizations must ensure that logging is configured for all relevant PowerShell activities to make this detection operationally viable.

