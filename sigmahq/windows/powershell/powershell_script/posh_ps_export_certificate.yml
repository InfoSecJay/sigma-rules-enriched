title: Certificate Exported Via PowerShell - ScriptBlock
id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
related:
- id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
  type: similar
status: test
description: Detects calls to cmdlets inside of PowerShell scripts that are used
  to export certificates from the local certificate store. Threat actors were 
  seen abusing this to steal private keys from compromised machines.
references:
- https://us-cert.cisa.gov/ncas/analysis-reports/ar21-112a
- https://learn.microsoft.com/en-us/powershell/module/pki/export-pfxcertificate?view=windowsserver2022-ps
- https://www.splunk.com/en_us/blog/security/breaking-the-chain-defending-against-certificate-services-abuse.html
author: Florian Roth (Nextron Systems)
date: 2021-04-23
modified: 2023-05-18
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Export-PfxCertificate'
    - 'Export-Certificate'
  filter_optional_module_export:
    ScriptBlockText|contains: 'CmdletsToExport = @('
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate certificate exports by administrators. Additional filters might be 
  required.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of specific PowerShell cmdlets, `Export-PfxCertificate` and `Export-Certificate`, which are typically used to export certificates from the local certificate store. The attacker objective behind this behavior may be to obtain private keys to gain unauthorized access to other systems or encrypt sensitive data for ransom. This activity aligns with the MITRE ATT&CK tactics of Credential Access (TA credential-access) and specifically the technique for Application Layer Protocol: T1552.004.

  The primary telemetry source for this detection is Windows PowerShell script block logs, necessitating that Script Block Logging is enabled on the target machine. If malicious, this may lead to significant security incidents as it can expose sensitive data such as private keys. However, this detection rule does NOT confirm malicious intent solely on its own, as it may also capture legitimate administrative actions performed by IT staff.

  ### Investigation Steps

  - **Review PowerShell Script Block logs:** Examine logs for Event ID 4104. Look for instances containing `Export-PfxCertificate` or `Export-Certificate`. Malicious indicators may include unexpected exports performed by non-administrative users during hours outside of standard operations.

  - **Check User Context:** Identify which user executed the command. If the user is non-administrative or from a department with no expected need for certification management, this raises the likelihood of malicious intent.

  - **Identify Target Certificates:** Investigate which certificates were targeted in the export process. Look for Event ID 4103 for additional context on the certificate's usage and any associated private keys.

  - **Verify Legitimate Usage:** Cross-reference any exports against known administrative operations. Legitimate activity should generally involve documented changes made from specific administrator accounts. Look for established patterns based on Sudo or Role-Based Access Control (RBAC) configurations.

  - **Review Script Authentication:** Check for signatures on the PowerShell script used. Unsigned scripts or those executed from unusual paths indicate a higher risk.

  - **Audit for Additional Threat Indicators:** Correlate this alert with other related detections such as abnormal authentication patterns or network traffic to known malicious sites, which can be crucial in confirming a broader attack.

  ### Prioritization

  This alert carries medium severity due to the potential impact of compromising certificate private keys, which could provide attackers with malicious access to sensitive systems. The likelihood of abuse is elevated as these command use cases may be exploit vectors commonly abused in real-world threats.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion by an attacker using obfuscated commands or non-standard PowerShell execution methods. The need for Script Block Logging to be enabled is critical for reliable detection; without it, detection capabilities are significantly hampered. Legitimate activities that may trigger this alert include authorized certificate exports by administrators for system maintenance. A related detection strategy includes monitoring for unusual PowerShell activity in conjunction with this rule, such as script usage patterns that deviate from the norm.

