title: Potentially Suspicious Call To Win32_NTEventlogFile Class - PSScript
id: e2812b49-bae0-4b21-b366-7c142eafcde2
status: test
description: Detects usage of the WMI class "Win32_NTEventlogFile" in a potentially
  suspicious way (delete, backup, change permissions, etc.) from a PowerShell script
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/desktop/legacy/aa394225(v=vs.85)
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-13
tags:
- attack.defense-evasion
logsource:
  category: ps_script
  product: windows
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection_class:
    ScriptBlockText|contains: 'Win32_NTEventlogFile'
  selection_function:
    ScriptBlockText|contains:
    - '.BackupEventlog('
    - '.ChangeSecurityPermissions('
    - '.ChangeSecurityPermissionsEx('
    - '.ClearEventLog('
    - '.Delete('
    - '.DeleteEx('
    - '.Rename('
    - '.TakeOwnerShip('
    - '.TakeOwnerShipEx('
  condition: all of selection_*
falsepositives:
- Legitimate administration and backup scripts
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious activities involving the WMI (Windows Management Instrumentation) class "Win32_NTEventlogFile" when targeted by PowerShell scripts. The detection focuses on actions such as deleting, backing up, or modifying permissions of event log files, which could indicate malicious behavior by an attacker attempting to cover their tracks or manipulate log data within a Windows environment. Attackers often utilize PowerShell for its powerful and flexible scripting capabilities, enabling them to perform actions that can evade traditional security controls.

  The likely attacker objectives include unauthorized access to sensitive event logs, deletion of critical security information, or altering log files to obfuscate actions taken during a compromise. This aligns with the MITRE ATT&CK techniques under the tactics of Defense Evasion, particularly using T1562 (Impair Defenses), where adversaries manipulate systems to avoid detection or disrupt security controls.

  Primary data sources for evidence include PowerShell script logs that show the invocation of the targeted WMI class along with command line activity, as well as Windows event logs that capture WMI events and PowerShell execution.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Check PowerShell logs for any usage of the "Win32_NTEventlogFile" class. Look for script commands that include the functions specified in the detection logic, such as `ClearEventLog`, `Delete`, and `BackupEventlog`.

  - **Analyze Command Line Activity:** Examine command line arguments for PowerShell processes to identify suspicious scripts or commands that manipulate event logs. This can provide context on the user's intent and the potential severity of their actions.

  - **Correlate with Event Log Data:** Investigate Windows event logs to find any corresponding events that might indicate a log deletion or modification occurred. Pay particular attention to event IDs associated with WMI and PowerShell execution.

  - **Evaluate User Context:** Determine if the user or service account executing the script has the appropriate permissions for such actions. Investigate if the account has a history of suspicious activities or a lack of legitimate business context for performing these operations.

  ### Prioritization
  The alert's severity is considered medium, reflecting the significant risk it poses in an enterprise environment. The manipulation of event logs can facilitate later stages of an attack by obscuring adversarial actions, making it critical to respond promptly to such alerts.

  ### Blind Spots and Assumptions
  Gaps in detection coverage include the possibility of legitimate administrative scripts that might trigger the same detections, leading to false positives. The detection logic assumes that relevant logs for PowerShell execution are enabled and properly configured. Without comprehensive logging of PowerShell activity and WMI events, the effectiveness of this rule may be compromised, as it relies heavily on the visibility of PowerShell interactions with system configurations and event logs.

