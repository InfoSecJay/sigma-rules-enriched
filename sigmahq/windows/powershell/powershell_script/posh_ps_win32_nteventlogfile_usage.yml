title: Potentially Suspicious Call To Win32_NTEventlogFile Class - PSScript
id: e2812b49-bae0-4b21-b366-7c142eafcde2
status: test
description: Detects usage of the WMI class "Win32_NTEventlogFile" in a 
  potentially suspicious way (delete, backup, change permissions, etc.) from a 
  PowerShell script
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/desktop/legacy/aa394225(v=vs.85)
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-13
tags:
- attack.defense-impairment
logsource:
  category: ps_script
  product: windows
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection_class:
    ScriptBlockText|contains: 'Win32_NTEventlogFile'
  selection_function:
    ScriptBlockText|contains:
    - '.BackupEventlog('
    - '.ChangeSecurityPermissions('
    - '.ChangeSecurityPermissionsEx('
    - '.ClearEventLog('
    - '.Delete('
    - '.DeleteEx('
    - '.Rename('
    - '.TakeOwnerShip('
    - '.TakeOwnerShipEx('
  condition: all of selection_*
falsepositives:
- Legitimate administration and backup scripts
level: medium
note: |
  ### Technical Context

  This rule detects the invocation of specific methods from the WMI class `Win32_NTEventlogFile` via PowerShell scripts. It focuses on potentially harmful actions such as deleting, modifying permissions, or clearing event logs which are common tactics employed by adversaries to cover their tracks or disrupt auditing capabilities. The likely attacker objective is to manipulate log files to evade detection or to disrupt the integrity of the system's auditing process. This activity falls under the MITRE ATT&CK framework's "Defense Evasion" tactic (T1562) with techniques like "Indicator Removal on Host" (T1562.001).

  The primary telemetry source is Windows PowerShell script logs, specifically monitoring the `ScriptBlockText` for relevant WMI method calls. If classified as malicious, such behavior can lead to system auditing failures and potential data breaches. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may trigger the same indicators.

  ### Investigation Steps

  - **Identify PowerShell script details**: Review PowerShell logs (Event ID 4104) for executed scripts corresponding to the alert. Look for indicators of a potentially malicious script (e.g., unusual script names, timestamps correlating with other suspicious activity).

  - **Examine the context of actions**: Check for arguments passed with methods like `.ClearEventLog(` or `.Delete(` to understand the intent. For example, specifying system logs vs. user logs can indicate a difference between benign and malicious activity.

  - **Review the script execution environment**: Validate the host’s role. If the alert is triggered from a non-administrative machine, it may warrant additional scrutiny. Compare with expected administrative activity to determine if this execution context is unusual.

  - **Assess for high-confidence malicious indicators**: Look for the presence of obfuscated script content or a chain of PowerShell commands that indicate a coordinated attack, particularly ones leading to the WMI class calls. Unusual prefixes in the processes may indicate exploitation tools.

  - **Correlate with log retention policies**: Investigate the backup or deletion queries with respect to existing log retention policies. Legitimate administrative scripts would typically adhere to these policies, while evasion tactics may not align with expected operational practices.

  - **Check for related alerts**: Cross-reference with endpoint detection alerts or alerts involving processes that manipulate or interact with event logs to confirm if this is part of broader malicious behavior.

  ### Prioritization

  This alert has medium severity, as it involves potential actions that threaten audit integrity and could indicate malicious behavior. The central concern lies in the likelihood of attackers attempting to erase or manipulate logs, which is a commonly weaponized tactic during post-exploitation phases.

  ### Blind Spots and Assumptions

  One limitation of this detection is its susceptibility to legitimate administrative actions, such as authentic log management scripts. Additionally, the rule relies heavily on the logging configuration of PowerShell, which must be enabled to capture all actions. Legitimate scripts for backup or cleanup tasks may also trigger this alert. A related detection for "Unusual Process Creation" (Event ID 4688) can be used in conjunction to strengthen coverage and provide context about the process initiating these calls.

