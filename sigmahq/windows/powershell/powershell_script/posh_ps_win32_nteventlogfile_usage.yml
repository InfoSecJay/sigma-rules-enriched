detection:
  selection_class:
    ScriptBlockText|contains: 'Win32_NTEventlogFile'
  selection_function:
    ScriptBlockText|contains:
    - '.BackupEventlog('
    - '.ChangeSecurityPermissions('
    - '.ChangeSecurityPermissionsEx('
    - '.ClearEventLog('
    - '.Delete('
    - '.DeleteEx('
    - '.Rename('
    - '.TakeOwnerShip('
    - '.TakeOwnerShipEx('
  condition: all of selection_*
falsepositives:
- Legitimate administration and backup scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the WMI class "Win32_NTEventlogFile" through PowerShell scripts, particularly operations that involve potentially suspicious actions like deleting or modifying event log files. Such activities may indicate an attacker attempting to manipulate log data to cover their tracks or hinder forensic investigations. The likely attacker objective includes evading detection by clearing logs or altering security settings.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1560)**, focusing primarily on techniques involving clearance or modification of logs. The primary telemetry source is PowerShell scripts, specifically ScriptBlock logs with references to the Win32_NTEventlogFile class and its methods (e.g., `.ClearEventLog()`, `.Delete()`). If malicious, this behavior can severely compromise incident response capabilities by altering or removing crucial logs. This detection does NOT confirm that malicious intent is present; it only indicates the potential for unauthorized or suspicious activity.

  ### Investigation Steps

  - **Review ScriptBlock logs for matches**: Examine PowerShell ScriptBlock logging for Event ID 4103 entries containing the terms associated with Win32_NTEventlogFile operations (like `.ClearEventLog`, `.Delete`). Filter for the user context executing this command.

  - **Verify context of PowerShell execution**: Check the source of the PowerShell execution, such as Event ID 4688 (Process Creation) and Event ID 4104 (PowerShell Script Block Logging). Validate if it comes from a trusted administrative account or a potentially compromised machine.

  - **Identify abnormal execution patterns**: Look for unusual times or frequencies of scripts that include the Win32_NTEventlogFile operations. Standard administrative scripts may appear during routine maintenance or incident response, with expected execution context from known administrators.

  - **Evaluate event log modifications**: Investigate System Event log entries (Event IDs 1102, 1100) around the same timeframe confirming if any logs were cleared or deleted. The date and time of these entries should correlate with the PowerShell event execution.

  - **Cross-reference with security policies**: Confirm against organizational policies if there are legitimate reasons for running such scripts by authorized personnel. Examine stored backup scripts within the environment, as they may also contain similar WMI calls without malicious intent.

  ### Prioritization

  This alert is of medium severity as it involves actions that could alter critical system logs, posing a direct threat to the integrity of security audits. The likelihood of malicious abuse is heightened since attackers often seek to manipulate event logs to conceal their activities. This behavior is weaponized in various attack scenarios, especially during post-exploitation phases.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative scripts may also execute these commands without malicious intent, leading to false positives. Required configurations should include consistent PowerShell logging and WMI event subscription across all critical hosts to ensure coverage. Additionally, benign operations could trigger an alert stemming from routine maintenance tasks or security software functioning normally. A companion detection to strengthen coverage could involve monitoring for unusual user privileges or access to log files, which may provide further context regarding potential misuse.

