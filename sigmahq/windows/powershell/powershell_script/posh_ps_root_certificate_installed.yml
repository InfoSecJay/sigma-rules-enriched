logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains|all:
    - 'Move-Item'
    - 'Cert:\LocalMachine\Root'
  selection2:
    ScriptBlockText|contains|all:
    - 'Import-Certificate'
    - 'Cert:\LocalMachine\Root'
  condition: 1 of selection*
falsepositives:
- Help Desk or IT may need to manually add a corporate Root CA on occasion. Need
  to test if GPO push doesn't trigger FP
level: medium
note: |
  ### Technical Context

  This detection identifies attempts to install a root certificate on a Windows system using PowerShell, which could be indicative of an adversary seeking to trust their own controlled certificates. The likely attacker objective is to prevent users from receiving warning messages when connecting to malicious web servers, facilitating man-in-the-middle (MitM) attacks or other malicious activities. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" and the technique "Install Root Certificate" (T1553.004).

  Primary telemetry sources include Windows PowerShell script block logging, specifically monitoring for the use of commands like `Move-Item` and `Import-Certificate`. If malicious, this could lead to unauthorized connections to adversary-controlled domains, severely impacting data confidentiality and integrity. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger the same events, such as corporate IT staff installing trusted root CAs.

  ### Investigation Steps

  - **Review PowerShell script logs:** Check for Security Event ID 4104 (PowerShell Script Block Logging) to identify the specific commands executed. Look for `Move-Item` or `Import-Certificate` related to path `Cert:\LocalMachine\Root`.

  - **Identify expected legitimate behavior:** Verify if the installation of root certificates aligns with scheduled policy updates from IT/GPOs, which may use similar commands. Cross-reference timestamps with corporate change management records to validate legitimacy.

  - **Check for related system activity:** Look at Windows Event ID 4656 (Handle Accessed) and 4663 (Attempted Access) for unauthorized access to the certificate store. This additional context may indicate anomalous usage patterns surrounding the certificate installation.

  - **Analyze the certificate details:** If a root certificate is found, check the subject and issuer against known trusted CAs. Malicious indicators may include not commonly recognized issuers or certificates with self-signed attributes.

  - **Validate asset criticality:** Determine if the affected asset is part of a critical system or high-risk environment. Machines handling sensitive data or admin tasks should be prioritized in the investigation.

  - **Inspect for exfiltration artifacts:** Search for indications of subsequent malicious actions, such as connections to known bad IPs or domains (e.g., through Web Proxy logs or DNS query logs). Look for unexpected outbound connections corresponding to the timing of root certificate installation.

  ### Prioritization

  This alert is medium severity due to the potential impact of a compromised root certificate, particularly if installed on critical systems. The likelihood of this attack vector being weaponized is moderate, as it provides adversaries with significant capabilities to intercept and manipulate traffic without alerting users.

  ### Blind Spots and Assumptions

  Detection may be limited by the organization’s PowerShell logging configuration; Script Block Logging must be enabled for this detection to be effective. Legitimate activities, such as internal IT operations for adding corporate certificates, could also trigger this alert, leading to false positives. A related detection could involve monitoring for unusual outbound connections to enhance coverage, as the installation of a root cert can lead to further suspicious activity.

