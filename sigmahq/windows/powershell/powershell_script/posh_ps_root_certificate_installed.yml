logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains|all:
    - 'Move-Item'
    - 'Cert:\LocalMachine\Root'
  selection2:
    ScriptBlockText|contains|all:
    - 'Import-Certificate'
    - 'Cert:\LocalMachine\Root'
  condition: 1 of selection*
falsepositives:
- Help Desk or IT may need to manually add a corporate Root CA on occasion. Need
  to test if GPO push doesn't trigger FP
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of a root certificate on a Windows system via PowerShell commands such as `Move-Item` or `Import-Certificate`, which adversaries may use to bypass security warnings when connecting to malicious servers. The objective of this behavior is typically to enable the adversary to perform man-in-the-middle (MitM) attacks without raising red flags from security mechanisms. This action corresponds to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique for Root Certificate Installation (T1553.004).

  The primary telemetry source comes from PowerShell logging, specifically requiring Script Block Logging to be enabled (Event ID 4104). If this behavior is malicious, it can allow an adversary to intercept and manipulate encrypted traffic. However, this detection does NOT confirm whether the root certificate is being installed for legitimate reasons, such as corporate management or infrastructure setups.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Event ID 4104 to identify the specific PowerShell commands executed around the alert time. Search for commands including 'Move-Item' and 'Import-Certificate' in the `ScriptBlockText` field.

  - **Identify the certificate's issuer:** Investigate the certificate installed in `Cert:\LocalMachine\Root` using `Get-ChildItem Cert:\LocalMachine\Root`. Legitimate corporate root CAs will have recognizable issuers. Look for any certificates issued by unrecognized entities or odd timestamps.

  - **Examine system roles:** Confirm the role of the affected system. Administrative systems or Domain Controllers are more critical; unexpected certificate installations on these systems warrant a higher priority for investigation.

  - **Review recent IT activity:** Check ticketing systems or documentation for any authorized root certificate installations. Legitimate activities may include IT personnel installing a corporate root certificate aligned with recent operational changes.

  - **Look for network abnormalities:** Utilize network monitoring tools to check for connections to known malicious domains or unusual external traffic patterns that may exploit the installed root certificate for MitM attacks.

  - **Evaluate the existence of pending IT changes:** Consult with the IT department about recent updates or planned changes that could involve root certificate installations. Documented processes should be aligned with expected behavior.

  ### Prioritization

  This alert should be considered medium priority due to its potential for high impact on the security posture of critical assets if exploited, particularly in environments where sensitive data is handled. While root certificate installations can be legitimate, the likelihood of malicious actors using this technique makes timely investigation essential.

  ### Blind Spots and Assumptions

  Common evasion techniques may include adversaries using legitimate CAs to blend in with normal operation patterns, potentially obscuring malicious intent. This detection relies on Script Block Logging being enabled in the environment; without it, the detection may not trigger. Legitimate activities, such as authorized IT personnel installing a corporate root CA, can trigger this alert. A related detection to consider for comprehensive coverage includes monitoring for unusual network traffic associated with certificates installed on the server, which could indicate misuse of a newly installed root certificate.

