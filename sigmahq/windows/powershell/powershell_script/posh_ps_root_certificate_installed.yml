title: Root Certificate Installed - PowerShell
id: 42821614-9264-4761-acfc-5772c3286f76
status: test
description: Adversaries may install a root certificate on a compromised system to
  avoid warnings when connecting to adversary controlled web servers.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.004/T1553.004.md
author: 'oscd.community, @redcanary, Zach Stanford @svch0st'
date: 2020-10-10
modified: 2022-12-02
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains|all:
    - 'Move-Item'
    - 'Cert:\LocalMachine\Root'
  selection2:
    ScriptBlockText|contains|all:
    - 'Import-Certificate'
    - 'Cert:\LocalMachine\Root'
  condition: 1 of selection*
falsepositives:
- Help Desk or IT may need to manually add a corporate Root CA on occasion. Need to
  test if GPO push doesn't trigger FP
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the installation of root certificates via PowerShell on Windows systems. Adversaries may use this technique to install malicious root certificates to establish trusted connections to their infrastructure, potentially leading to man-in-the-middle attacks. The presence of these certificates allows unauthorized access to encrypted traffic, thereby bypassing normal security warnings and controls.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1562)** and **Trusted Relationship (T1553.004)**. Attackers strive to embed themselves within trusted relationships or obscure their activities to avoid detection, making this detection crucial for identifying potential threats.

  Primary data sources for effective detection include PowerShell script block logs, which capture the content of scripts executed on Windows systems, as well as audit logs that might indicate changes to the certificate store.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for any entries that contain `Move-Item` targeting the `Cert:\LocalMachine\Root` path or the `Import-Certificate` command indicating installation of new root certificates.

  - **Analyze Certificate Store Changes:** Check the Windows certificate store for any recent modifications to the root certificate authorities. Look for certificates that are unknown to your organization.

  - **Investigate Network Connections:** Monitor for outbound connections to suspicious or unrecognized domains that may correlate with the newly installed root certificates, as these could be hosts controlled by attackers.

  - **Validate Corporate Certificate Policies:** Ensure that the installation of corporate root certificates is in line with organizational policies. Investigate any installations that do not match standard operating procedures or have not been authorized by IT.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of a compromised root certificate. The likelihood of this threat is elevated in environments where adversaries are focused on establishing persistent access or executing man-in-the-middle attacks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if script block logging is not enabled on all systems, which can lead to undetected root certificate installations. The detection logic assumes that benign activities, such as legitimate certificate installations by IT personnel, will not trigger the rule, but false positives may still occur. Additionally, proper log collection and retention policies must be configured to capture the necessary events for accurate detection.

