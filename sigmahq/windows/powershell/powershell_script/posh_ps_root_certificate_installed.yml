  ---

  ### Technical Context

  This rule detects the installation of a root certificate on a Windows system via PowerShell commands. Installations of root certificates can indicate an adversary's attempt to establish trust in their own malicious infrastructure, thereby preventing the user or system from recognizing potentially harmful connections. The likely objective is to facilitate MITRE ATT&CK technique T1553.004 (Root Certificate Installation) to ensure secure communication with adversarial servers without triggering alerts.

  Primary telemetry sources for this detection include PowerShell script block logs, specifically looking for the `ScriptBlockText` that indicates commands for moving items to `Cert:\LocalMachine\Root` or importing certificates into the root store. If this behavior is indeed malicious, it could lead to further network compromise or data exfiltration. Notably, this detection does NOT confirm that a compromised system has been successfully exploited, as legitimate instances of root certificate installation (e.g., by IT personnel) may occur as well.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution Logs**: Review PowerShell script block logs (Event ID 4104) for `ScriptBlockText` containing 'Move-Item' or 'Import-Certificate'. Evaluate the user context and execution environment for indications of unauthorized access.

  - **Assess user credentials**: Investigate the account executing the PowerShell commands. Verify if it belongs to a legitimate user or service account (+evaluate role permissions), as unauthorized accounts executing these commands can be a high-confidence indicator of malicious activity.

  - **Identify the certificate**: If root certificates were added, analyze associated certificate details (e.g., issuer, expiration date) by querying the local certificate store using commands like `Get-ChildItem Cert:\LocalMachine\Root`. Check for certificates from unknown or suspicious issuers.

  - **Review corporate exceptions**: Compare incidents against company policies for root CA management. Validate if the addition aligns with IT processes and user roles to distinguish between legitimate administrative actions and malicious installations.

  - **Monitor network traffic**: Employ network telemetry to look for connections to untrusted IP addresses that may correspond to the adversary's infrastructure. Identify DNS queries associated with newly installed certificates to verify if connections are being made.

  ---

  ### Prioritization

  This alert should be treated with medium severity, as the impact of unauthorized root certificate installations can compromise the confidentiality and integrity of secure communications. The likelihood of malicious exploitation is moderate, given that similar techniques are common in targeted attacks. This behavior is known to be weaponized in various attack scenarios, where adversaries seek to maintain persistent access.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not correctly configured or compliant with organizational standards, as it relies on script block logging to capture events. Legitimate activities that could trigger this alert include corporate IT personnel installing root certificates for trusted vendors, potentially creating false positives. Related detections include monitoring for certificate requests via Windows Event ID 4659 (Certificate Services) to strengthen coverage of certificate-related activities.

