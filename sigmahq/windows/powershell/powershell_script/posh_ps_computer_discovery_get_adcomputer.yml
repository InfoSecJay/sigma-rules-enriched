  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ADComputer '
    - ' -Filter \*'
    ScriptBlockText|contains:
    - ' | Select '
    - 'Out-File'
    - 'Set-Content'
    - 'Add-Content'
  condition: selection
falsepositives:
- Legitimate admin scripts may use the same technique, it's better to exclude 
  specific computers or users who execute these commands or scripts often
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `Get-ADComputer` cmdlet in PowerShell to collect information about domain computers and export this data to a file. The likely attacker objective is to enumerate and gather reconnaissance on active machines within the network, which can be a precursor to lateral movement or further exploitation. This technique aligns with the MITRE ATT&CK tactic of Discovery, specifically the technique ID T1033 (System Owner/User Discovery).

  The primary telemetry sources are PowerShell logs with a specific focus on script block logging, requiring enabling for accurate detection. If the behavior is malicious, it indicates reconnaissance activity that could lead to unauthorized access or further exploitation of the network. It’s important to note that this detection does NOT confirm that the activity is malicious on its own; context such as user identity, command lineage, and surrounding actions must be taken into account.

  ### Investigation Steps

  - **Review PowerShell script logs:** Check PowerShell script block logs for Event ID 4104 to identify the execution of `Get-ADComputer` with output commands (`Out-File`, `Set-Content`, `Add-Content`). Consider the context of the executing user.

  - **Identify running context:** Look for the user executing the command. Legitimate administrative tasks may invoke the same cmdlet, so correlate with normal admin activity patterns, focusing on known administrators or scheduled tasks.

  - **Check for output file creation:** Investigate file system modifications for any files created or modified in directories typically used for log storage (e.g., C:\Temp or user profile folders) corresponding to the output commands. Look for timestamps that align with the PowerShell execution.

  - **Analyze user account activity:** Investigate the user account in Active Directory for prior access patterns and privileges. High privilege users executing this command may warrant more scrutiny than standard users.

  - **Correlate with incident reports:** Review any existing incident reports or alerts that may have documented suspicious activity involving this user or similar cmdlet usage, linking them to wider threat actor behavior.

  ### Prioritization

  This alert should be treated as medium severity due to its potential for indicating reconnaissance by an attacker, especially if the affected account has substantial network privileges. While the `Get-ADComputer` cmdlet can be abused to gather sensitive information, it is also commonplace in legitimate administrative tasks, making the likelihood of malicious intent variable.

  ### Blind Spots and Assumptions

  There are limitations to detection if script block logging is not enabled, which is necessary to capture these events reliably. Legitimate administrative activities that may trigger this alert include regular auditing and inventory scripts run by IT staff. A related detection to enhance coverage could be monitoring for the execution of other reconnaissance cmdlets such as `Get-ADUser` or `Get-ADGroup` to understand broader activity patterns within the network.

