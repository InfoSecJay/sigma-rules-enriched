detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ADComputer '
    - ' -Filter \*'
    ScriptBlockText|contains:
    - ' | Select '
    - 'Out-File'
    - 'Set-Content'
    - 'Add-Content'
  condition: selection
