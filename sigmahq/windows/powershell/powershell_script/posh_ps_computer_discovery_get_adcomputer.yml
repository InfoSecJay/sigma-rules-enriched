note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell cmdlet `Get-ADComputer`, which is often employed by attackers to harvest information about computers in a target Active Directory (AD) environment. The cmdlet outputs this information to a file, which could indicate preparatory reconnaissance behavior by potential adversaries aiming to facilitate further exploitation. Attackers using this technique could be gathering data for later exploitation, lateral movement, or privilege escalation.

  The relevant MITRE ATT&CK tactics for this behavior include **Discovery** (TA0007) and the technique **Account Discovery** (T1033). Attackers might leverage this cmdlet to inventory AD resources or gather information on systems of interest, often as part of a broader intrusion campaign. The primary data sources that would provide evidence of this behavior include PowerShell script block logs, which require that script block logging is enabled, as well as system event logs that record the execution of scripts.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check for PowerShell script block logs that contain instances of `Get-ADComputer`, especially those with `-Filter *`, as this indicates a broad query potentially used for reconnaissance.

  - **Examine Output Files:** Investigate the filesystem for any output files located by the cmdlet, which may have been generated using `Out-File`, `Set-Content`, or `Add-Content`. Determine when these files were created and what information they may disclose.

  - **Monitor Active Directory Traffic:** Analyze LDAP query logs for unusual patterns or high frequency of requests from accounts executing the cmdlet, which may indicate automated scripts or malicious activity.

  - **Cross-Reference Accounts:** Identify the user accounts executing the cmdlet. If they are not legitimate administrative users or practices, further investigate to determine potential compromise or misuse.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential impact of an attacker gaining sensitive information about an organization’s computer environment, which can lead to more severe breaches if left unchecked. While not all usages are malicious, the frequency and context of the command execution could indicate nefarious activity.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage where legitimate administrative activity could be mistakenly flagged as malicious, especially if the detection logic does not differentiate based on context such as user roles or historical behavior. The detection assumes that script block logging is enabled, and that there is sufficient visibility into PowerShell execution throughout the environment. Organizations should ensure that logging is appropriately configured to capture this data accurately.

