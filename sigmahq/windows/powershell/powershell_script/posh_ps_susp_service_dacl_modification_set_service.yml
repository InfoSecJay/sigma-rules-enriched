logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_sddl_flag:
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - 'D;;'
    ScriptBlockText|contains:
    - ';;;IU'
    - ';;;SU'
    - ';;;BA'
    - ';;;SY'
    - ';;;WD'
  condition: all of selection_*
falsepositives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
level: high
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell `Set-Service` cmdlet that modifies the Security Descriptor of a Windows service, specifically allowing the service to be hidden from common service management utilities, such as `sc.exe` and `Get-Service`. This behavior is typically indicative of an attempt to create or modify a service in a way that conceals it from legitimate oversight, potentially enabling persistence mechanisms favored by attackers.

  The likely attacker objective is to achieve stealthy persistence on a compromised system, making it more difficult for security teams to detect malicious services. This activity relates to the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique **Windows Service Permissions** (T1574.011). The primary telemetry sources for this detection are PowerShell Script Block Logging events, which must be enabled for effective monitoring.

  If successful, this action can allow an adversary to maintain access undetected, posing significant security risks. It is important to note that the detection of this behavior does NOT definitively prove malicious intent; it may also occur during rare legitimate administrative tasks.

  ### Investigation Steps

  - **Review PowerShell Execution Logs**: Check PowerShell logs (Event ID 4104) for entries indicating suspicious `Set-Service` command usage with Security Descriptor modifications, especially looking for `-SecurityDescriptorSddl` or `-sd` flags.

  - **Investigate Service Security Descriptors**: Use the command `Get-Service | Get-WmiObject Win32_Service | Select-Object Name, StartType, SecurityDescriptor` to review current service configurations and verify if any have suspicious descriptors; particularly services with hidden settings (e.g., `D;;...`).

  - **Look for Anomalous Service Behavior**: Identify services associated with recent `Set-Service` commands. Check if their status changes frequently or if they are non-standard services (i.e., services that do not match expected naming conventions or are not commonly used in the environment).

  - **Analyze Script Block Log Non-linearity**: Since PowerShell Script Block logging can contain non-linear information, ensure the analysis accounts for this. For any detected scripts, cross-reference the legitimate administrative use cases, which often involve non-hidden service configurations.

  - **Correlate with Endpoint Anomaly Detection**: Validate the behavior against endpoint detection logs for unusual patterns in service creation or modification that align with the timestamps of the detected event.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on system integrity and detection evasion capabilities of an attacker. The likelihood of malicious abuse is significant, as the ability to hide services is commonly weaponized in various attacks for persistence.

  ### Blind Spots and Assumptions

  The detection may struggle against evasion techniques such as PowerShell obfuscation or using alternate tools to modify service configurations without detection. Reliable detection requires that Script Block Logging is enabled across all relevant systems. Legitimate activities, such as creating hidden services for specialized applications (though rare), may trigger this alert. A companion detection that strengthens coverage is monitoring of service creation and modification events via Windows Event Logs (Event ID 4697).

