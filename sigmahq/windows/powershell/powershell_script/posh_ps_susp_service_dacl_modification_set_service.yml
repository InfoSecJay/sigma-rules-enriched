logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_sddl_flag:
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - 'D;;'
    ScriptBlockText|contains:
    - ';;;IU'
    - ';;;SU'
    - ';;;BA'
    - ';;;SY'
    - ';;;WD'
  condition: all of selection_*
falsepositives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of the "Set-Service" PowerShell cmdlet to modify the Security Descriptor of a Windows service, specifically allowing it to become hidden from standard service management utilities like "sc.exe" and "Get-Service." The likely attacker objective is to conceal malicious services that could be leveraged for persistence or initial access, evading detection by both security tools and system administrators. This behavior aligns with the MITRE ATT&CK technique for persistence through "Service Registry Permissions Weakness" (T1574.011).

  The primary telemetry sources are Windows PowerShell logs, specifically the Script Block Logging feature that captures the textual content of PowerShell scripts executed. If malicious, such modifications can enable an attacker to maintain their presence on a system without easy detection. However, this detection does NOT confirm that malicious activity is occurring by itself; legitimate administrative actions could invoke similar behavior.

  ### Investigation Steps

  - **Review the PowerShell Script Block logs:** Check the Security log for Event ID 4104 related to Script Block Logging. Look for entries that include "Set-Service" and reference a Security Descriptor (e.g., "D;;"). Compare against known benign service modifications.

  - **Identify High-Confidence Malicious Indicators:** Look for the presence of "D;;" combined with ";;;IU", ";;;SU", ";;;BA", ";;;SY", or ";;;WD" in the ScriptBlockText. If these elements are present, it is indicative of an attempt to hide services.

  - **Confirm Legitimate Activities:** Compare service modifications against recent administrative changes. For example, verify if a known service was updated for intended purposes (e.g., service updates or configuration changes).

  - **Examine system state for hidden services:** Utilize PowerShell commands (Get-Service or sc query) to check if services are running obfuscated. Presence with standard tools but absent from normal queries could indicate evasion efforts.

  - **Review Asset Context:** Focus on critical system roles, such as domain controllers or endpoint protection servers, where service manipulation would pose a higher risk due to their importance in the security infrastructure.

  - **Investigate service creation or modification timing:** Cross-reference timestamps of the detected modification with other logs (such as Event ID 116) to determine orchestration with any suspicious login or process execution events.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems if an attacker conceals persistence mechanisms. The likelihood of abuse is significant as this technique is commonly weaponized in real-world attacks aimed at maintaining unauthorized access.

  ### Blind Spots and Assumptions

  Evasion techniques may include using alternative PowerShell versions or direct API calls to change service descriptors without generating Script Block logs. Ensuring that Script Block Logging is enabled is critical for reliable detection, as lacking this configuration may lead to missed alerts. Legitimate activities such as system updates might trigger the alert, particularly in environments that leverage automation for service management. Related detections include monitoring for abnormal process behavior related to service execution (e.g., Service Control Manager events) to enhance alert coverage.

