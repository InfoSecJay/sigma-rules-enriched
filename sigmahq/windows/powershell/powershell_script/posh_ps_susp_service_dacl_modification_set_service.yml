title: Suspicious Service DACL Modification Via Set-Service Cmdlet - PS
id: 22d80745-6f2c-46da-826b-77adaededd74
related:
- id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
  type: similar
status: test
description: Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities such
  as "sc.exe", "Get-Service"...etc. (Works only in powershell 7)
references:
- https://twitter.com/Alh4zr3d/status/1580925761996828672
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-24
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_sddl_flag:
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - 'D;;'
    ScriptBlockText|contains:
    - ';;;IU'
    - ';;;SU'
    - ';;;BA'
    - ';;;SY'
    - ';;;WD'
  condition: all of selection_*
falsepositives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious modifications to the Discretionary Access Control List (DACL) of Windows services via the PowerShell `Set-Service` cmdlet. Specifically, it looks for instances where the Security Descriptor is altered to conceal a service from standard service management tools like `sc.exe` and `Get-Service`. Attackers commonly employ such techniques to achieve persistence or evade detection, often by masking malicious services that could be recognized by system administrators or forensic tools.

  The likely threat scenario involves an attacker who has gained access to the system and seeks to establish a foothold by creating or modifying services that are not easily discernible. The objectives may include maintaining persistence, elevating privileges, or orchestrating further malicious actions without being detected. This behavior aligns with the MITRE ATT&CK techniques for persistence (T1574.011), defense evasion, and privilege escalation, showcasing the need for vigilance against this deceptive tactic.

  The primary data source for this detection is PowerShell script block logging, which must be enabled to capture the specific commands executed by PowerShell. This allows for the identification of potentially harmful modifications made to service security descriptors.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Analyze the script block logging for instances of the `Set-Service` cmdlet along with the presence of `-SecurityDescriptorSddl` or `-sd` parameters indicating alterations to service DACLs.

  - **Correlate with Service State:** Cross-reference modified services against known legitimate services to identify any unauthorized changes or hidden services, especially those that do not appear with standard service enumeration commands.

  - **Inspect Privilege Assignments:** Investigate who has been granted access through the DACL changes, focusing on users with administrative or SYSTEM privileges, as they may indicate the actions of an attacker attempting to conceal their presence.

  - **Evaluate Historical Changes:** Utilize logs to assess the historical state of services and any legitimate administrative changes, noting any discrepancies or sudden modifications in the service's DACL configuration.

  ### Prioritization
  This alert has a high severity rating in an enterprise environment due to the potential for attackers to leverage hidden services for maintaining persistence and circumventing detection. Given the implications of privilege escalation and the ability to evade standard security measures, timely investigation is crucial.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the possibility of legitimate administrative users making rare changes to service DACLs for valid purposes, which may generate false positives. Additionally, the effectiveness of this detection is contingent on having PowerShell script block logging enabled. The rule also assumes that attackers will use recognizable parameters during their manipulations, which may not always be the case. Investigators should be aware of these factors when analyzing alerts.

