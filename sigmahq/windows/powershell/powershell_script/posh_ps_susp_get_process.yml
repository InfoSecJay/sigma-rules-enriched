  ### Technical Context
  This detection rule identifies potential misuse of the PowerShell command `Get-Process`, which is commonly used for process discovery on Windows systems. The presence of this command within a script block can indicate a reconnaissance phase in an attacker's operational process, where they seek to gather information about running processes on a target machine. Attackers may leverage such information to identify services, applications, and processes that could be manipulated for further exploitation, lateral movement, or privilege escalation.

  The relevant MITRE ATT&CK tactic associated with this detection is **Discovery**, specifically technique **T1057 - Process Discovery**. This technique encompasses various methods used by adversaries to identify running processes, which could be utilized to enhance their understanding of the target environment. The primary data source for this rule is PowerShell script block logging, which requires proper configuration to capture these activities effectively.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Investigate the PowerShell script block logs for instances of the `Get-Process` command being executed. Note the context of execution and any preceding commands that might indicate malicious intent.
  - **Correlate with User Activity**: Analyze the user context in which `Get-Process` was executed. Look for patterns of usage that deviate from normal user behavior, such as running it outside of typical working hours or by unexpected users.
  - **Examine Related Events**: Check for any subsequent actions that may follow the discovery of processes, such as modifications to processes (e.g., process injection) or escalated privileges, which may indicate further malicious activity.
  - **Identify False Positives**: Consider legitimate use cases for `Get-Process`, especially by trusted administrative scripts or users. Validate against a whitelist of benign users and operational scripts to reduce noise in alerts.

  ### Prioritization
  The alert severity is assessed as low primarily due to the likelihood that legitimate administrative tasks may generate alerts. However, repeated and anomalous use of this command could indicate deeper reconnaissance efforts, warranting further investigation, especially in sensitive environments.

  ### Blind Spots and Assumptions
  This detection logic may not capture all possible methods of process discovery, particularly if attackers use alternative techniques outside of PowerShell, such as native Windows commands (e.g., Task Manager or WMI). The rule assumes that script block logging is enabled and properly configured across all monitored endpoints, which is often not the default in corporate environments. Additionally, there may be legitimate scenarios where `Get-Process` is executed frequently, which could lead to the risk of false positives if these workflows are not well understood.

