  ### Technical Context

  This rule detects the use of the `Get-Process` cmdlet in PowerShell scripts, which is often indicative of process discovery activities conducted by an adversary. The likely objective is to gather information about running processes on the local machine, aiding in further reconnaissance and potential exploitation. This behavior is associated with the MITRE ATT&CK technique “Process Discovery” (T1057).

  The primary telemetry source comes from PowerShell script logs, specifically requiring that Script Block Logging be enabled to capture command usage. If exploited maliciously, the impact could range from minor reconnaissance efforts to the enabling of more sophisticated attacks, such as lateral movement or privilege escalation. It is crucial to note that this detection does NOT confirm malicious activity on its own, as `Get-Process` can be legitimately used by system administrators and applications for normal operations.

  ### Investigation Steps

  - **Identify the script execution context:** Examine Security Event ID 4688 for the creation of PowerShell processes. Look for the command line containing `Get-Process`. Check if the script's execution context is from a user account with high privileges or a service account.

  - **Review PowerShell logs:** Confirm logs in `Windows PowerShell` or `Windows Event Logs (Event ID 4104)` for the relevant script block logging events. Evaluate the timing and frequency of invocations of `Get-Process` to differentiate between benign administrative use and potential malicious activity.

  - **Validate script origin:** Determine if the script was executed from a known location or a temporary directory. Legitimate administrative scripts are commonly found in stable directories like `C:\Scripts`. Temporary or unexpected locations may indicate suspicious actions.

  - **Check for additional suspicious commands:** Look for other commands in the same script or execution context surrounding `Get-Process`, such as commands that modify system states or other reconnaissance techniques (e.g., `Get-Service`, `Get-EventLog`).

  - **Monitor for lateral movement indicators:** If the process discovery is linked with execution policy bypassing (`-ExecutionPolicy Bypass` or `-NoProfile` arguments in command line), it raises the likelihood of a compromised system, necessitating a broader examination of lateral movement.

  ### Prioritization

  This alert should be treated as low-priority in a typical enterprise environment due to common administrative usage of PowerShell. However, if observed alongside other suspicious behaviors or in high-value assets, the severity may warrant increased attention, as process discovery could be an early indicator of lateral movement or preparation for an attack.

  ### Blind Spots and Assumptions

  This detection is limited by the necessity of having Script Block Logging enabled; without it, suspicious PowerShell activity may go unnoticed. Legitimate usage by administrators or automated systems, such as monitoring scripts, may trigger the alert. Related detections to consider include monitoring for `Process Creation` and `Command Line Logging` to provide deeper insights into system activity surrounding the use of PowerShell commands.

