title: Powershell Local Email Collection
id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
status: test
description: |
  Adversaries may target user email on local systems to collect sensitive information.
  Files containing email data can be acquired from a users local system, such as Outlook storage or cache files.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1114.001/T1114.001.md
author: frack113
date: 2021-07-21
modified: 2022-12-25
tags:
- attack.collection
- attack.t1114.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Get-Inbox.ps1'
    - 'Microsoft.Office.Interop.Outlook'
    - 'Microsoft.Office.Interop.Outlook.olDefaultFolders'
    - '-comobject outlook.application'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activities involving PowerShell scripts that may be used to collect sensitive email information from local systems. Adversaries often target user emails to harvest sensitive data by accessing data files or storage locations that contain email information, such as Outlook cache files. By leveraging PowerShell scripts, attackers can automate the extraction process, which is stealthy and can bypass traditional security measures.

  The likely attacker objectives include gathering sensitive personal or corporate information that can be exploited for identity theft, data breaches, or spear-phishing. By finding vulnerabilities in email accounts, they may attempt to gain further access to the organization or execute follow-up actions against users. This behavior aligns with the MITRE ATT&CK technique for collecting information from email clients (T1114.001) under the "Collection" tactic.

  For effective detection, primary data sources include PowerShell script block logging, which captures executed commands and argument details from PowerShell processes. Properly configured logs will provide insights into any unusual PowerShell script executions related to email data collection.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the Windows Event Logs for PowerShell script block logs that have executed suspicious commands related to `Get-Inbox.ps1` or Outlook interop objects.
  - **Analyze User Activity**: Investigate the user's recent activities on the system, focusing on any abnormal script execution during unexpected hours or from non-standard user accounts.
  - **Inspect Outlook Cache Files**: Confirm any modifications or access to Outlook storage locations, which could suggest unauthorized attempts to extract email content.
  - **Correlate with Network Activity**: Examine network logs for outbound connections or data transfers that coincide with the execution of the identified PowerShell scripts which may indicate exfiltration of collected data.

  ### Prioritization
  The alert's severity is considered medium due to the potential risk of sensitive information being collected from user email accounts, which could lead to broader compromise within the organization if not addressed. Despite being a targeted collection technique, the actual exploitation may vary in urgency depending on the context of the detected activity.

  ### Blind Spots and Assumptions
  This detection rule may not cover instances where the attacker uses legitimate tools or more sophisticated obfuscation techniques that evade script block logging. There is an assumption that Script Block Logging has been properly configured and is always enabled to provide the necessary data for accurate detection. Gaps in coverage exist for environments where PowerShell logging might not be enabled consistently or where alternative methods of email collection are employed.

