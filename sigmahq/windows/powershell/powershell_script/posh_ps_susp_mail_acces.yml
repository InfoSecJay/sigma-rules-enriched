logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Get-Inbox.ps1'
    - 'Microsoft.Office.Interop.Outlook'
    - 'Microsoft.Office.Interop.Outlook.olDefaultFolders'
    - '-comobject outlook.application'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts by adversaries to collect sensitive email data via PowerShell scripts targeting local Outlook storage or cache files. The likely objective is to exfiltrate personal or organizational data for malicious purposes, such as credential theft or espionage. This behavior aligns with the MITRE ATT&CK tactic of Collection (TA0046) and specifically technique T1114.001 (Email Collection). The primary telemetry sources include Windows PowerShell logs, specifically logs from Script Block Logging, which must be enabled for detection. If exploited maliciously, the impact can range from data leaks to significant privacy violations. However, this detection does NOT confirm that an actual data exfiltration event has occurred.

  ---

  ### Investigation Steps

  - **Check PowerShell logs for script execution:** Look for Security Event ID 4104 in the PowerShell logs to confirm the execution of scripts containing suspicious commands such as `Get-Inbox.ps1` or `-comobject outlook.application`.

  - **Examine script context:** Verify the context in which the script was executed, including user account and location. Review the `UserName` and `ScriptBlockText` fields in Event ID 4104 to differentiate between standard user activity and potential malicious intent.

  - **Correlate with files accessed:** Investigate any file access events that coincide with the script execution, particularly looking for modified or accessed Outlook data files, typically located at `C:\Users\<Username>\Documents\Outlook Files\`.

  - **Review legitimate PowerShell usage:** Identify typical user behavior by checking for non-malicious PowerShell scripts related to email operations. Cross-reference these actions with users who commonly use PowerShell for automated email management.

  - **Identify high-confidence indicators of compromise:** Look for anomalies, such as execution of the PowerShell commands from unusual user accounts or scheduled tasks configured for Windows that should not contain email interaction scripts.

  - **Assess file manipulation artifacts:** Validate the existence of Outlook data files post-script execution by checking for newly created files or recent modifications in relevant directories. Examine file properties for timestamps and user ownership.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive data stored in Outlook, especially if the affected user has access to critical information. The likelihood of adversaries exploiting such a methodology is significant, as data collection techniques are commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  This detection relies heavily on the enabling of Script Block Logging, which may not be configured in every environment. Adversaries could employ obfuscation or use legitimate administrative tools to execute similar commands, making the detection less reliable. Legitimate applications or scripts that use Outlook's COM object for automated processes may inadvertently trigger this alert. A related detection to consider strengthening coverage is monitoring for unusual command-line arguments in other PowerShell logs.

