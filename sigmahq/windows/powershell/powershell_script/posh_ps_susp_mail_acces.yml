note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell scripts that interact with Microsoft Outlook to collect email data, specifically through script block text containing commands like `Get-Inbox.ps1` or `-comobject outlook.application`. The primary attacker objective is to extract sensitive email information stored locally, which can be leveraged for data exfiltration or reconnaissance. This activity correlates with the MITRE ATT&CK technique T1114.001: Email Collection.

  The primary telemetry source for this detection is PowerShell script block logging from Windows systems, requiring that logging is enabled to capture relevant events. If malicious, this behavior can lead to unauthorized access to sensitive user information with possible implications such as identity theft or corporate espionage. However, this detection does NOT confirm that the extraction was successful, nor does it differentiate whether the activity was performed by a legitimate user or an attacker without additional context.

  ### Investigation Steps

  - **Review PowerShell logs, Event ID 4104:** Check for PowerShell script block logs that contain `Get-Inbox.ps1` or `-comobject outlook.application`. A legitimate execution will typically be triggered by a known user without suspicious parameters.

  - **Examine script execution context:** Identify the user account associated with the PowerShell execution. Legitimate uses usually involve expected administrative accounts or workflows, while unfamiliar accounts should be flagged for further scrutiny.

  - **Check associated processes, Event ID 4688:** Determine if the PowerShell execution spawns other processes or modules related to Outlook. This could indicate an attempt to parse or manipulate email data maliciously.

  - **Identify patterns of email data access:** Track if there are any references to file paths such as `C:\Users\<Username>\AppData\Local\Microsoft\Outlook\` being accessed post-script execution. Frequent access requests in a short time frame could indicate data exfiltration attempts.

  - **Inspect for additional indicators of compromise:** Look for other signs of exploitation, such as the existence of scripts in temporary folders or suspicious scheduled tasks that may interact with Outlook or PowerShell.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact of sensitive information exposure via local email access. The likelihood of malicious abuse is moderate, as the behavior can be employed in various harmful scenarios, but whether it’s weaponized depends on the specific context and environment of the alert.

  ### Blind Spots and Assumptions

  This detection may be limited by script block logging not being enabled on all systems, which can result in missed detections. Legitimate activities such as IT support or user-installed scripts for personal use could trigger this alert. A related detection that can strengthen coverage is monitoring for unexpected modifications or access to Outlook files, which indicates an increasing risk of information extraction or compromise.

