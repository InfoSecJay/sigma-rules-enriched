note: |
  ### Technical Context

  This detection identifies the use of PowerShell to copy or install a Dynamic Link Library (DLL) file into critical system directories, specifically "System32" or "SysWOW64". Such an action is typically employed by attackers aiming to achieve persistence, escalate privileges, or disguise malicious activities by placing their payloads in trusted system locations. The relevant MITRE ATT&CK tactic and technique for this behavior is "Persistence" (TA0003) and "Install Utility" (T1556.002). The primary telemetry sources for this detection include Windows PowerShell logs, focusing on events that capture script block logging details. If successfully executed, this behavior could lead to unauthorized access or control over the affected system. Importantly, this detection does NOT confirm that a DLL is malicious; legitimate software can also use this method to install necessary components.

  ### Investigation Steps

  - **Review PowerShell logs:**
    Inspect PowerShell logs for Event ID 4104 where the `ScriptBlockText` matches the specified regex pattern to confirm the execution of the copy command targeting the system directories.

  - **Validate DLL creation:**
    Check for new DLL files in `C:\Windows\System32` and `C:\Windows\SysWOW64` that coincide with the PowerShell execution time, noting any non-standard filenames or unexpected behavior.

  - **Cross-reference file hashes:**
    Use tools like VirusTotal to check the file hash of any newly detected DLLs against known malicious binaries, looking for high-confidence indicators of compromise.

  - **Identify legitimate behavior:**
    Determine if a routine system update or software installation has occurred during the same time frame, which may account for legitimate DLL copying to these directories.

  - **Check process parentage:**
    Investigate the parent process of the PowerShell execution using Sysmon Event ID 1 to determine if it initiated from a suspicious or unusual executable, signaling potential malicious intent.

  - **Assess system criticality:**
    Determine the role and importance of the affected system. Critical servers or domain controllers warrant immediate attention, while less critical endpoints may follow standard operational procedures.

  ### Prioritization

  This alert is classified as high severity due to the potential impact associated with tampering in system directories. The likelihood of malicious abuse is significant, as this technique is commonly leveraged by threat actors to establish persistence. Recognizing that the behavior is well-known among attackers further raises its priority for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by users disabling PowerShell logging, making alerts less reliable. Legitimate administrative activities, such as system updates or software installations, can trigger this alert if not properly documented. Related detections, such as monitoring for unusual scheduled tasks or newly created services, would strengthen coverage and context around such activities.

