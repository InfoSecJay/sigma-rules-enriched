note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell to install or copy DLL files into system directories, specifically "System32" or "SysWOW64". Attackers often utilize such techniques to persist malware, evade defenses, or carry out credential theft by replacing legitimate DLLs with malicious counterparts. By doing so, they can execute malicious code with high privileges, as these system directories are trusted locations for executable files.

  The potential threat scenario involves an attacker gaining access to a system and utilizing PowerShell to manipulate essential system files. This may lead to unauthorized privilege escalation, where the attacker can perform actions with the rights of legitimate system processes. Relevant MITRE ATT&CK tactics include **Persistence** (T1547), **Defense Evasion** (T1070), and **Credential Access** via malicious DLLs (T1556.002).

  The primary telemetry sources for this detection are **PowerShell script block logs**, which must be enabled to capture the necessary events. These logs detail the executed PowerShell commands and their arguments, providing insight into potentially malicious activities that attempt to move files into restricted directories.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Analyze logs for any instances of PowerShell commands that include `Copy-Item` or its alias `cpi` targeting the "System32" or "SysWOW64" directories. Look for any unusual or unauthorized scripts being executed.

  - **Correlate with Process Creation Logs**: Investigate associated process creation events around the time of the detected PowerShell command to identify the parent process. This may help uncover the origin of the attack and whether there are other suspicious activities involved.

  - **Inspect the Target Directory**: Check the contents of the "System32" and "SysWOW64" directories for recent additions or modifications to DLL files. Look for any that do not conform to known legitimate entries or were altered unexpectedly.

  - **Assess User Account Privileges**: Evaluate the user account that executed the PowerShell command to determine if it has unnecessary privileges or if it is an anomalously high-privileged account without a valid business justification.

  ### Prioritization
  This alert is classified as high severity as the actions detected could indicate a compromise involving privilege escalation or installation of malicious code. The potential impact on the enterprise is considerable, as such activities can lead to extensive data breaches or system integrity violations.

  ### Blind Spots and Assumptions
  This detection logic assumes that PowerShell script block logging is enabled and properly configured across the entire environment. There may be gaps in coverage if organizations do not monitor all systems or if certain endpoints do not log script executions. Additionally, benign scripts that follow similar patterns in their functionality could generate false positives, especially if legitimate administrative activities involve DLL modifications. Monitoring and adjustments may be necessary to lessen the risk of ignoring potentially harmful threats while still capturing necessary legitimate operations.

