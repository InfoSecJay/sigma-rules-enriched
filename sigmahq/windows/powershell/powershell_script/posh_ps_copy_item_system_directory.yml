note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands to copy files into sensitive system directories, specifically "System32" or "SysWOW64." Such behavior often indicates an attacker attempting to establish persistence or to deploy malicious payloads capable of evading detection. The objective may include installing credential stealers or backdoors for later access.

  Relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003) and Abuse Elevation Control Mechanism (T1556.002). The primary telemetry source is Windows PowerShell script logs (Event ID 4104) with Script Block Logging enabled, tracking any executed scripts. If malicious, this behavior can lead to compromised systems or unauthorized access. It is essential to note that the detection does NOT confirm the execution of malicious activity unless further context is provided.

  ### Investigation Steps

  - **Review PowerShell script logs for suspicious activity:** Check Event ID 4104 for logs where the ScriptBlockText matches the signature `(Copy-Item|cpi) .{2,128} -Destination .{1,32}\\Windows\\(System32|SysWOW64)`. Look for direct references to file paths in Windows system directories.

  - **Validate the legitimacy of the copied file:** Cross-reference copied file names or hashes against known benign files. Use tools like Windows File Integrity Check or OS query against known system files to confirm unexpected alterations.

  - **Identify the parent process:** Investigate Event ID 4688 for the process that initiated the PowerShell command to understand how it was triggered. Determine if it was invoked from a legitimate administrative action or potentially from malicious software.

  - **Analyze user context:** Confirm who executed the PowerShell commands by examining Event ID 4624 (Logon events). Check if it was executed under an uncommon user or during odd hours, which may indicate malicious intent.

  - **Assess system roles and criticality:** Determine if the affected system is a server or workstation and its criticality. If it is a vital system (e.g., domain controller), prioritize the investigation.

  - **Look for additional indicators of compromise (IoC):** Investigate for high-confidence malicious indicators such as the existence of unusual files or processes in the "System32" or "SysWOW64" directories that may have been created around the same time as the alert.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of modifying system directories and the high likelihood of malicious behavior associated with this activity. Such actions are frequently weaponized for persistence in a target environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of PowerShell logging, which must include Script Block Logging. Evasion techniques can involve using obfuscated commands or alternate methods to interact with the file system. Legitimate administrative activities, such as software deployments or updates, could trigger this alert. A related detection to consider is monitoring for unusual file access patterns in "System32" or "SysWOW64," as it could further substantiate potential malicious activities.

