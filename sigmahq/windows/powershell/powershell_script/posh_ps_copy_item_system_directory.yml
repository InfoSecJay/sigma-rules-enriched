note: |
  ### Technical Context

  This detection rule identifies instances where PowerShell is utilized to copy files into system directories such as "System32" or "SysWOW64." The behavior typically aims to install or register malicious DLLs to establish persistence or conduct further malicious actions on the host. Relevant MITRE ATT&CK techniques include persistence via malicious DLLs (T1556.002) and leveraging PowerShell for command execution. The primary telemetry source for this detection is PowerShell script block logging, specifically monitoring events where the `Copy-Item` command is used. If malicious, this behavior can lead to the installation of persistence mechanisms, enabling attackers to maintain control over the system. Importantly, this detection does NOT confirm whether the copied files are malicious or benign; further analysis is required.

  ### Investigation Steps

  - **Verify PowerShell Script Block Logging:**
    Ensure that Script Block Logging is enabled on the system. Review Windows Event Logs (Event ID 4104) for Script Block logging events to capture detailed command execution.

  - **Examine the PowerShell Command Details:**
    Check for the use of `Copy-Item` with destination paths including “System32” or “SysWOW64.” Specifically review Event ID 4104 for any command containing these paths, and determine the source of the command execution (e.g., legitimate user vs. anomalous process).

  - **Identify Malicious Indicators:**
    Investigate any file created in the target system directories (C:\Windows\System32 or C:\Windows\SysWOW64) immediately following the PowerShell command execution. Files with atypical naming conventions or hashes can indicate malicious activity.

  - **Assess Legitimate Use Cases:**
    Look for benign instances where applications or scripts are known to utilize PowerShell to manage system files or perform software updates. Document these events and correlate them against normal operational patterns.

  - **Correlate with Endpoint Behavior:**
    Review related event logs around the same timeframe (e.g., Event ID 4688 for process creation) to determine if there are any parent processes that could indicate script execution from trusted legitimate sources.

  ### Prioritization

  This alert should be considered high priority due to its significant potential impact on system integrity. The likelihood of malicious abuse is considerable, as attackers often leverage PowerShell to manipulate system files for persistence, which is a common tactic in sophisticated attacks.

  ### Blind Spots and Assumptions

  The detection is reliant on the presence of PowerShell script block logging, which may not be enabled in all environments, limiting coverage. Legitimate software installations or updates may also trigger this alert, leading to false positives. A related detection that can enhance coverage includes monitoring for file creation events in critical directories (e.g., Sysmon Event ID 11), which can reveal file modifications irrespective of how they were initiated.

