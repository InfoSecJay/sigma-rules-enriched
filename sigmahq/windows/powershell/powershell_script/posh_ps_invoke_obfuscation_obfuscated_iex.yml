title: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
status: test
description: Detects all variations of obfuscated powershell IEX invocation code
  generated by Invoke-Obfuscation framework from the following code block \u2014
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: 'Daniel Bohannon (@Mandiant/@FireEye), oscd.community'
date: 2019-11-08
modified: 2022-12-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_iex:
  - ScriptBlockText|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ScriptBlockText|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ScriptBlockText|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ScriptBlockText|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ScriptBlockText|re: '\*mdr\*\W\s*\)\.Name'
  - ScriptBlockText|re: '\$VerbosePreference\.ToString\('
  condition: selection_iex
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands through the Invoke-Obfuscation framework, specifically targeting invocation methods that conceal malicious intent. The likely attacker objective is to execute arbitrary code on targeted systems while evading detection. This behavior fits within the MITRE ATT&CK tactics of Defense Evasion (T1203) and Execution (T1059.001).

  The primary telemetry sources include Windows PowerShell logs with specific focus on Script Block Logging. If this behavior is malicious, it could facilitate the execution of payloads or commands that compromise system integrity and confidentiality. However, this detection does NOT confirm that the activity is malicious without additional context or corroborating evidence.

  ### Investigation Steps

  - **Review Script Block Logs**: Check for Script Block Logging events (Event ID 4104) that contain obfuscated command text matching the specified regex patterns. Look for commands with unusual segments that might suggest obfuscation.

  - **Identify Obfuscation Markers**: Extract parameters within the logs and identify obfuscation markers such as `$PSHome`, `$ShellId`, or other common indicators from the regex patterns. Any presence of this obfuscation is suspicious and should be further validated.

  - **Correlate Execution Timing**: Examine the timing of the obfuscated execution against known scheduled tasks or other automation activities. Legitimate administrative tasks should not use obfuscation; thus, an unusual time of execution may raise suspicion.

  - **Evaluate Environment Context**: Determine if the executable context pertains to a remote or compromised system. Legitimate scripts typically execute in well-defined environments with validated parameters, not using obfuscation.

  - **Check for Known Malicious Patterns**: Research the hash or command executed against threat intelligence sources to identify known malicious behavior associated with these obfuscated commands to establish high-confidence malicious indicators.

  - **Validate Against User Behavior**: Cross-reference the user and system behaviors leading up to and after the alert. Legitimate users will have a history of consistent behavior with no recycled or odd account access patterns.

  ### Prioritization

  Alerts generated by this detection are high severity as they indicate a potential for real-time exploitation. The systems likely contain sensitive information, making them a target for attackers seeking access. Furthermore, obfuscation techniques are common strategies within the modern adversary toolkit, warranting immediate attention.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques not covered by the defined regex patterns or advanced obfuscation methods that dynamically change strings. Also, without enabling Script Block Logging, detection is impossible. Furthermore, legitimate tasks such as automated scripts used for maintenance or configuration changes might trigger this alert. Companion detections, such as monitoring user behavior analytics (UBA), can help correlate suspicious activities and strengthen detection capabilities across the environment.

