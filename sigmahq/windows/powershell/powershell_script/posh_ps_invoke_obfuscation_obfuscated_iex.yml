title: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
status: test
description: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the following code block \u2014
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: 'Daniel Bohannon (@Mandiant/@FireEye), oscd.community'
date: 2019-11-08
modified: 2022-12-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_iex:
  - ScriptBlockText|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ScriptBlockText|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ScriptBlockText|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ScriptBlockText|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ScriptBlockText|re: '\*mdr\*\W\s*\)\.Name'
  - ScriptBlockText|re: '\$VerbosePreference\.ToString\('
  condition: selection_iex
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule captures the invocation of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework. The rule is designed to identify various execution patterns that attackers might employ to mask their actions while running malicious scripts, which is common in sophisticated attacks. The typical objective of these actions is to evade detection by security tools and to enable further exploitation of the target environment, potentially leading to credential theft, lateral movement, or deployment of additional payloads.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Execution** (TA0002): The act of running the obfuscated PowerShell commands falls under the execution tactics.
  - **Defense Evasion** (TA0005): Employing obfuscation is a classic method for attackers to avoid detection.
  - **T1027: Obfuscated Files or Information**: The specific behavior of invoking obfuscated scripts is encapsulated by this technique.

  Primary data sources that will contain the best evidence for this detection include:
  - **PowerShell script block logs**: These logs showcase the text of PowerShell commands being executed, necessary for detecting obfuscation patterns.
  - **Windows event logs (event IDs 4104)**: Special attention should be paid to logs stemming from PowerShell, as they capture critical information about script execution.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logging at the specified event IDs (e.g., 4104) for invocation of obfuscated commands matching patterns defined in the detection rules.
  - **Correlate with Process Creation Events**: Check for process creation logs that can link to the PowerShell execution, ensuring to investigate the parent processes which may provide insight into how the script was executed (e.g., via mshta.exe or other processes).
  - **Analyze Network Activity**: Investigate any network traffic generated by the obfuscated scripts for signs of outbound connections that could indicate command and control (C2) interactions or data exfiltration attempts.
  - **Check for Additional Artifacts**: Look for any dropped files or further execution logs (e.g., in temp directories) that may provide more context to the attack, particularly if the obfuscated script is part of a larger campaign.

  ### Prioritization
  The alert's severity is classified as high due to the potential impact of successful malicious PowerShell execution on enterprise environments. Obfuscation techniques are often used by advanced threat actors, indicating an elevated risk of compromise and significant operational disruption if the activities succeed.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage primarily influenced by the reliance on PowerShell script block logging, which must be enabled to capture necessary data. If logging is not properly configured, or if the attacker uses methods to bypass script block logging, the detection may fail. Additionally, the detection logic assumes that any obfuscated IEX invocation is malicious without integrating additional context or risk factors, which may result in false positives if legitimate use cases exist.

