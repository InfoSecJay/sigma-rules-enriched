title: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
status: test
description: Detects all variations of obfuscated powershell IEX invocation code
  generated by Invoke-Obfuscation framework from the following code block \u2014
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: 'Daniel Bohannon (@Mandiant/@FireEye), oscd.community'
date: 2019-11-08
modified: 2022-12-31
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_iex:
  - ScriptBlockText|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - ScriptBlockText|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - ScriptBlockText|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - ScriptBlockText|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - ScriptBlockText|re: '\*mdr\*\W\s*\)\.Name'
  - ScriptBlockText|re: '\$VerbosePreference\.ToString\('
  condition: selection_iex
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell code execution via the `Invoke-Obfuscation` framework, specifically targeting obfuscated commands using the `IEX` (Invoke-Expression) function. The likely objective of an attacker using this technique is to execute malicious scripts while evading detection by obscuring the actual commands being executed.

  This behavior is mapped to the MITRE ATT&CK framework under the tactic **Execution** (TA0002) and technique **Obfuscated Files or Information** (T1027) and **Command and Control** (T1071.001). The primary telemetry sources for this detection include Windows PowerShell logs, specifically focusing on events generated by Script Block Logging, which must be enabled. If successful, the impact could range from data exfiltration to the deployment of malware.

  It is crucial to note that this detection does NOT confirm malicious activity on its own, as benign scripts may use similar obfuscation techniques for legitimate purposes.

  ### Investigation Steps

  - **Review PowerShell logs for obfuscated commands**: Search for Script Block Logging events (Event ID 4103) containing the patterns specified in the Sigma rule. Compare against known benign scripts to identify potential threats.

  - **Identify user context and source of execution**: Check the user account triggering the obfuscated IEX command against your organization's known administration workflows. Use Event ID 4688 to determine the user and parent process details.

  - **Validate if legitimate scripts are being executed**: Look for legitimate execution patterns in your environment, such as scripts from trusted maintenance tools or administrative tasks. Approved scripts should have clear and non-obfuscated command structures.

  - **Correlate with network activity**: Examine network logs (e.g., firewall and proxy logs) for unusual outbound connections immediately following the obfuscated command’s execution. High-confidence malicious indicators can include connections to known malicious domains or IP addresses.

  - **Check for established persistence mechanisms**: Investigate the systems affected for potential persistence left by the execution of this command. Look for unusual scheduled tasks or services that may have been created following the obfuscation event (use Event ID 4698 for task creation logs).

  - **Review for additional related alerts**: Check for alerts related to other indicators of compromise or persistence techniques (e.g., event IDs related to Windows Management Instrumentation (WMI) or .NET debugging) that may indicate increased risk or exploitation.

  ### Prioritization

  This alert has a high severity level due to the potential risks of executing obfuscated code on enterprise systems, which may allow attackers to maintain access or deploy further payloads. The likelihood of malicious use is significant, given that obfuscation is a common tactic used to bypass detection.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that do not have Script Block Logging enabled, leading to gaps in visibility. Attackers may use legitimate PowerShell scripts, obfuscating their behavior, which could trigger false positives. A related detection to strengthen coverage would be monitoring for other PowerShell execution anomalies or suspicious WMI activity (e.g., TA0002 - T1047: Windows Management Instrumentation).

