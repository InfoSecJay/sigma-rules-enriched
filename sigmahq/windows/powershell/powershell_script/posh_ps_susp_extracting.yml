  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_extracting/info.yml
note: |
  ### Technical Context

  This rule detects the use of PowerShell commands that search for files containing insecurely stored credentials, an action commonly performed by attackers to collect sensitive information for lateral movement or credential theft. The likely adversary objective is to find configuration files, shared credential stores, or source code containing passwords to facilitate further exploitation within the network. This behavior fits within the MITRE ATT&CK framework under the tactic "Credential Access" (TA0006) and technique "Credentials from Password Stores" (T1552.001).

  The primary telemetry source is PowerShell script block logging, which must be enabled to capture relevant events. If performed maliciously, this activity poses a significant security risk as it may lead to unauthorized access or control over sensitive systems. Importantly, this detection does NOT confirm that credentials have been successfully accessed or exfiltrated on its own.

  ### Investigation Steps

  - **Check for PowerShell Script Block Logs**: Review PowerShell logs for Script Block Logging (Event ID 4104) and filter for ScriptBlockText containing terms such as "ls" and "select-string". Look for misuse of these commands which can indicate potential credential harvesting attempts.

  - **Assess File Access Patterns**: Verify access to sensitive files (e.g., *.config, *.xml) or paths typically containing credentials (e.g., C:\Users\*\AppData\Local\*, network shares). Legitimate users may access these files for actual development or configuration purposes, but unusual patterns or access times may be suspicious.

  - **Identify High-Risk Invocations**: Look for specific arguments passed to PowerShell (e.g., a command involving '-Pattern' that searches for known insecure strings like 'password'). Seeing this in conjunction with high privilege accounts could indicate malicious intent.

  - **Review User and Host Context**: Correlate the detected activity with the user’s role and context within the organization. For example, script execution by a non-IT user on a user endpoint may raise alerts, while similar behavior on a server may be expected under certain roles.

  - **Look for Unusual PowerShell Usage**: Assess if the detected PowerShell command execution was preceded or followed by other suspicious commands (e.g., obfuscation techniques or unusual parameters) that could suggest attempts to evade detection.

  ### Prioritization

  The severity of this alert is medium due to the potential security implications of discovering insecurely stored credentials. The affected systems' criticality and the common nature of this behavior being weaponized by adversaries for credential theft heighten the need for timely investigation.

  ### Blind Spots and Assumptions

  Limitations include the potential for benign PowerShell activity, as legitimate users may also search for files containing credentials for valid reasons. Additionally, without proper configuration (like enabling script block logging), detection may be incomplete. Other activities, such as legitimate administrative tasks involving access to configuration management or credential files, may also trigger this alert. A related detection might include monitoring for elevated PowerShell execution (Event ID 4688) as a companion context for suspicious activity.

