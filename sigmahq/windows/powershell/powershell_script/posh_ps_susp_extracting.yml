logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - ls
    - ' -R'
    - 'select-string '
    - '-Pattern '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that indicate attempts by adversaries to search file systems for insecurely stored credentials. The likely objective is the extraction of sensitive information that can be leveraged for further attacks, such as lateral movement or privilege escalation. This behavior maps to the MITRE ATT&CK technique T1552.001 (Application Layer Protocol: Credential Dumping).

  The primary telemetry source is Windows PowerShell script block logging, which will capture the execution of specific PowerShell commands. If this behavior is malicious, it could lead to unauthorized access to critical systems and data. However, it’s essential to note that this detection does NOT confirm that malicious activity occurred on its own, as legitimate administrative scripts may trigger similar patterns.

  ### Investigation Steps

  - ** Review PowerShell execution history:** Examine PowerShell Event ID 4104 for script block logs associated with the alert timestamp. Look for commands using 'ls', 'select-string', and recursive search ' -R'. Legitimate administrative tasks may frequently utilize PowerShell for system management.

  - ** Validate command context:** Investigate the full command line of any detected PowerShell instance using the command line logs (Event ID 4688) and correlate with creation timestamps. Determine if the commands were run by known administrative accounts versus atypical user accounts.

  - ** Check script block logging configuration:** Ensure that Script Block Logging is enabled across relevant systems, as this is necessary for the detection to work effectively. Lack of logging may indicate a gap in visibility.

  - ** Identify suspicious file access patterns:** Analyze logs for file access events (Event ID 4663) that correspond to the detected PowerShell execution, particularly focusing on sensitive directories like user profile directories or shared network paths known to contain credential files.

  - ** Look for signs of credential exposure:** Search for abnormal file creation or modification events, particularly in sensitive files (e.g., .txt files, JSON files) that may indicate credentials were successfully extracted or are being used maliciously.

  ### Prioritization

  This alert is of medium severity, primarily because it may indicate potential credential harvesting activity. The impact can be significant if the exploited credentials grant access to critical systems. This behavior is commonly weaponized by adversaries during initial access and lateral movement phases, indicating a heightened risk.

  ### Blind Spots and Assumptions

  This detection may be bypassed through obfuscation techniques in PowerShell scripts that avoid detection by the specified search terms. Additionally, it relies on having Script Block Logging enabled, which may not be consistently configured across all enterprise systems. Legitimate administrative activities, such as system maintenance scripts that involve credential searches, may raise false positives. For strengthened coverage, establishing detections for embedded credential patterns in files—using static code analysis or other detection rules—would enhance visibility into potential threats.

