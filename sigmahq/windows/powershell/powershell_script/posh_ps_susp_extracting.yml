title: Extracting Information with PowerShell
id: bd5971a7-626d-46ab-8176-ed643f694f68
status: test
description: |
  Adversaries may search local file systems and remote file shares for files containing insecurely stored credentials.
  These can be files created by users to store their own credentials, shared credential stores for a group of individuals,
  configuration files containing passwords for a system or service, or source code/binary files containing embedded passwords.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md
author: frack113
date: 2021-12-19
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1552.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - ls
    - ' -R'
    - 'select-string '
    - '-Pattern '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying PowerShell commands that indicate an adversary is attempting to extract information from local file systems or remote file shares. Specifically, the commands captured in this rule are commonly utilized to search for insecurely stored credentials, which can include credential files created by users, shared credential stores, and configuration files that inadvertently expose sensitive information. Attackers may employ these methods to gather information that could facilitate unauthorized access to systems or sensitive data.

  The primary objective of such detection is to thwart the exploitation of credential theft techniques within an enterprise environment. Adversaries engaged in this type of behavior are typically looking to escalate their privileges or gain unauthorized access to systems, thus seeking to establish a foothold or conduct lateral movement. This behavior corresponds to the MITRE ATT&CK technique T1552.001: "Application Layer Protocol" under the "Credential Access" tactic. The relevant data sources that yield vital evidence include PowerShell script block logs, which must be enabled to capture and analyze the commands executed in the environment.

  ### Investigation Steps
  - **Review PowerShell Logs:**
    Begin by examining PowerShell script block logs for any instances of the specific commands mentioned in the detection logic (e.g., `ls` with certain parameters). Look for patterns that suggest attempts to search for sensitive files containing credentials.

  - **Analyze User Activity:**
    Identify which users executed the PowerShell commands. Cross-reference this with user access roles and privileges to determine if the activity is expected or indicative of malicious intent.

  - **Inspect File Share Access:**
    Check logs for access to file shares or remote file systems during the times when the suspicious PowerShell commands were executed. Look for unusual file access patterns or searches conducted by accounts that typically do not access those resources.

  - **Correlate with Other Alerts:**
    Correlate findings with additional alerts related to credential access and suspicious account behavior. This could provide context for understanding if this activity is part of a larger attack vector, such as lateral movement or privilege escalation.

  ### Prioritization
  The medium severity level of this alert is justified due to the potential impact of credential exposure, which could lead to significant compromises in sensitive systems. The likelihood of an attacker attempting to exploit credential theft techniques makes this detection critical for timely response measures.

  ### Blind Spots and Assumptions
  This detection rule is predicated on the assumption that PowerShell script block logging is enabled within the environment. If this logging is not configured, potentially benign commands may go undetected, increasing the risk of an undetected attack. Additionally, false positives may arise from legitimate user actions when they are performing administrative tasks or troubleshooting issues involving credential files. Continuous monitoring and fine-tuning of detection thresholds may be necessary to strike a balance between alert fidelity and operational efficiency.

