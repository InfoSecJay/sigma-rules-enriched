logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'get-acl'
    - 'REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to exploit weaknesses in registry service permissions by using the `get-acl` PowerShell command targeting registry paths associated with Windows services. Attackers may seek to redirect service execution from a legitimate executable to one they control, thus executing their payloads at service startup. This behavior fits within the MITRE ATT&CK framework under the tactic of **Privilege Escalation** (T1074) and technique **Service Registry Permissions Weakness** (T1574.011).

  The primary telemetry source is PowerShell script block logging, specifically looking for the use of `get-acl` commands that focus on the registry service paths: **HKLM\SYSTEM\CurrentControlSet\Services**. If successful, this attack could lead to unauthorized privilege escalation or arbitrary code execution with the security context of the affected service. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also use similar commands.

  ### Investigation Steps

  - **Check script block logs:** Review PowerShell script block logs (Event ID 4104) for any instances of `get-acl` accessing **HKLM\SYSTEM\CurrentControlSet\Services**. Look for attempts by non-administrative users or during unusual times that could indicate malicious intent.

  - **Assess user context:** Verify the user context that executed the command by checking the Event ID 4688 (Process Creation). Look for processes initiated by accounts that usually do not perform administrative functions, such as service accounts or standard users.

  - **Identify modifications to service configurations:** Examine the Windows Event Logs (System logs) for any changes or modifications recorded (Event ID 7045 for service installation) in proximity to the detected command. Compare these changes to known legitimate administrative scripts and standard change management processes.

  - **Review registry permissions:** Validate the permissions of the targeted service registry keys using the command line or PowerShell commands such as `Get-Acl`. Confirm whether the permissions have been altered in ways that deviate from your organization’s baseline configurations.

  - **Document legitimate usage patterns:** Document legitimate administrative tasks involving `get-acl` on service registry paths by, for example, noting regular administrative scripts executed by IT staff. Understanding normal behavior will help tune false positives in this detection.

  ### Prioritization

  The alert has medium priority due to the potential impact on system integrity and security if exploited, particularly on critical services. The likelihood of this technique being weaponized is moderate given the known weaknesses in service permissions in Windows environments, which makes it a feasible approach for stealthy persistence or privilege escalation.

  ### Blind Spots and Assumptions

  This detection may have limitations, as sophisticated adversaries could use obfuscation techniques to manipulate PowerShell commands, such as encoding or other PowerShell command alternatives, which might bypass detection. The success of this detection requires PowerShell script block logging to be enabled across all relevant endpoints. Legitimate administrative activities, such as routine permission audits or adjustments performed by IT staff, may trigger this alert. A related detection could focus on monitoring for unexpected service installation or modification events (Event ID 7045), providing additional context and coverage.

