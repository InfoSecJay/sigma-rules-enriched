logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'get-acl'
    - 'REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell scripts that query the access control list (ACL) of Windows Service Registry keys, specifically under the path `HKLM\SYSTEM\CurrentControlSet\Services`. The likely attacker objective is to identify weaknesses in service configuration, allowing them to hijack service execution by modifying registry entries to point to malicious payloads. This behavior aligns with the MITRE ATT&CK tactics of Privilege Escalation (TA0004) and Persistence (TA0003), specifically under technique T1574.011, which focuses on Service Registry Permissions Weakness.

  Primary telemetry sources for this detection include Windows Security Event Logs (Event ID 4104 for PowerShell scripts), which capture executed PowerShell commands. If malicious, this behavior can lead to unauthorized code execution during service startups, potentially compromising system integrity and availability. It is important to clarify that this detection does NOT confirm an actual compromise or that a successful attack has occurred; it merely identifies an attempt to assess permissions that may lead to exploitation.

  ### Investigation Steps

  - **Review the triggering PowerShell command:** Examine Event ID 4104 in the Windows Security logs for the complete command text. Look for `get-acl 'REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\'`. If the command was issued by a known administrative user, it may be benign.

  - **Check the script execution context:** Verify the user and session context associated with the Event ID 4104 logs. Admins should have logged activity; however, unexpected users executing such commands may indicate malicious intent.

  - **Inspect the Registry permissions:** Use the PowerShell command `Get-Acl 'HKLM\SYSTEM\CurrentControlSet\Services\'` to assess ACL entries. Legitimate services typically have controlled permissions; excessive or non-standard write access could signify a potential security risk.

  - **Identify recent modifications to service entries:** Check for any changes in registry values using `reg query HKLM\SYSTEM\CurrentControlSet\Services\`. Look for unexpected executable paths or recent modifications that align with unauthorized commands.

  - **Evaluate asset criticality:** Consider the role of the affected system. If it hosts high-value services (e.g., domain controllers, application servers), prioritize the investigation, as these may be prime targets for privilege escalation.

  - **Audit other automation scripts:** Investigate other scripts or scheduled tasks that may reference service registry areas, particularly for the use of `get-acl` or similar commands. Automation by admins may be legitimate, but patterns of repetitive access could suggest malicious behavior.

  ### Prioritization

  This alert should be treated with medium priority due to the potential for privilege escalation and persistence. The ability to modify service execution can lead to significant compromise if exploited. Although the likelihood of malicious use exists, such behavior may also result from legitimate administrative tasks, necessitating thorough verification.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by malicious actors who may execute similar commands through other means (e.g., disguised scripts). The effectiveness of detection relies on having PowerShell script block logging enabled; without this, critical query activities might go unrecorded. Additionally, legitimate administrative activity, like periodic security assessments, can trigger this alert and should be considered in the context of user roles and behaviors. A related detection that strengthens coverage could include monitoring for unauthorized registry modifications, providing a comprehensive view of potential exploitation.

