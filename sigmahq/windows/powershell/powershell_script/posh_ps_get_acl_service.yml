logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'get-acl'
    - 'REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential exploitation of service registry permissions weaknesses in Windows operating systems. Adversaries may attempt to gain persistence or elevate privileges by altering service configurations in the registry, which are stored under `HKLM\SYSTEM\CurrentControlSet\Services`. By hijacking service entries, attackers can redirect the execution of legitimate service binaries to malicious payloads of their choosing, enabling them to run code during system boot or service start procedures. The primary threat objective here is to maintain a foothold within the environment and execute arbitrary code without detection.

  The relevant MITRE ATT&CK techniques include **T1574.011: Hijack Execution Flow: Service Registry Permissions Weakness**, which describes the manipulation of service registry entries to execute unauthorized executables. Analysts should be aware of the implications of this technique as it can lead to privilege escalation and persistent malicious programs running under the guise of legitimate services.

  The primary log sources for detecting this behavior are PowerShell Script Block logs, specifically those capturing commands utilizing `Get-Acl` to inspect access control lists (ACLs) for service registry keys. This information is crucial in identifying unauthorized attempts to modify service configurations.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logs for any occurrences of commands utilizing `Get-Acl` targeting the registry path `HKLM\SYSTEM\CurrentControlSet\Services`. Look for anomalies that do not align with regular administrative activities.
  - **Analyze Service Configuration**: Utilize native Windows tools or scripts to extract and analyze the ACLs of services defined in the Windows registry. Pay close attention to permissions that allow unauthorized accounts elevated access.
  - **Check for Unusual Services**: Investigate service configurations for any new, unauthorized, or modified services that could be related to the exploitation of service registry configurations. Monitor for unexpected modifications or newly created services.
  - **Correlate with User Activity**: Cross-reference the findings with user activity logs to identify the source of unauthorized changes. Determine whether there are legitimate accounts performing administrative actions or if there are signs of potential account compromise.

  ### Prioritization
  The alert is assigned a medium severity level due to the potential impact of compromised service configurations, which can lead to elevated privileges and persistence. Such vulnerabilities could significantly enhance an adversary's ability to maintain access to the environment, making it a crucial detection focus.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the need for Script Block Logging to be enabled, which might not be activated in all environments. The detection logic assumes that the presence of `Get-Acl` targeting specific registry paths indicates potentially malicious intent, but this could also result from legitimate administrative activities, leading to false positives. Analysts must ensure PowerShell logging is properly configured and that historical logs are retained for adequate investigation capabilities.

