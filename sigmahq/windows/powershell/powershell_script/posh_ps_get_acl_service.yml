note: |
  ### Technical Context

  This rule detects attempts by attackers to check the permissions of Windows Service Registry entries, specifically under `HKLM\SYSTEM\CurrentControlSet\Services`, using the PowerShell command `get-acl`. Attackers typically aim to exploit weak permissions on service registry keys to hijack service execution and execute malicious payloads with elevated privileges. This behavior aligns with the MITRE ATT&CK technique for **Privilege Escalation (T1574.011)**.

  Primary telemetry sources include PowerShell logs, specifically with Script Block Logging enabled, which captures the execution of scripts and commands. If successful, this attack could allow unauthorized code execution at system startup or during service execution, significantly compromising the system's integrity. This detection does NOT confirm that exploitation has occurred; it only indicates that a permissions check related to service registry entries has taken place.

  ### Investigation Steps

  - **Review PowerShell script logs**: Examine logs for Event ID 4104, specifically searching for `get-acl` commands that interact with `REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services`. This command may indicate an investigation into service permissions.

  - **Correlate with service configurations**: Check the service permission configurations in the Windows Registry (use the built-in `regedit` tool or PowerShell `Get-Acl` commands). Compare entries against expected configurations. Legitimate entries should have NT AUTHORITY or SYSTEM as owners with appropriate access rights.

  - **Identify high-confidence malicious behavior**: Look for a rapid sequence of permissions assessments followed by changes to the registry entries under `HKLM\SYSTEM\CurrentControlSet\Services`. This may indicate an attempt to set up a persistence mechanism.

  - **Assess affected host's role**: Determine the criticality of the affected host. If it's a server hosting essential applications, the alert should be escalated promptly due to potentially high impact.

  - **Evaluate legitimate administrative activity**: Note that certain administrative scripts may legitimately interact with service registry keys. Validate the context and frequency of permissible administrative operations before escalating.

  ### Prioritization

  The alert severity is medium due to the potential impact on service integrity, especially on critical systems. The likelihood of malicious exploitation exists given that privilege escalation techniques are commonly weaponized. Prompt investigation is essential to determine if the activity is benign or if it indicates precursors to a more significant compromise.

  ### Blind Spots and Assumptions

  Detection can be evaded if PowerShell logging is disabled or if the script is executed in a manner that bypasses logging (e.g., through direct command line execution). Reliable detection also depends on having PowerShell Script Block Logging properly configured. Legitimate administrative tasks, such as querying service configurations, may trigger this alert. A related detection that strengthens coverage is monitoring for changes in service configurations or unauthorized modifications, particularly in tandem with unauthorized registry access.

