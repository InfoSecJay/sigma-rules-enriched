title: Powershell Directory Enumeration
id: 162e69a7-7981-4344-84a9-0f1c9a217a52
status: test
description: Detects technique used by MAZE ransomware to enumerate directories using
  Powershell
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
- https://www.mandiant.com/resources/tactics-techniques-procedures-associated-with-maze-ransomware-incidents
author: frack113
date: 2022-03-17
tags:
- attack.discovery
- attack.t1083
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - foreach
    - Get-ChildItem
    - '-Path '
    - '-ErrorAction '
    - SilentlyContinue
    - 'Out-File '
    - '-append'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of PowerShell for directory enumeration, a common technique leveraged by the MAZE ransomware group. In this context, an attacker aims to gather information about directory structures within a compromised environment, which can aid in identifying targets for data exfiltration or further lateral movement. The rule specifically looks for the use of PowerShell commands such as `Get-ChildItem` that indicate enumeration actions.

  Relevant MITRE ATT&CK tactics associated with this behavior include **Discovery** (TA0007) and the technique of **File and Directory Discovery** (T1083). Detecting these patterns is crucial because effective enumeration allows adversaries to better understand their environment, ultimately facilitating their objectives of deploying ransomware or obtaining sensitive data.

  The primary data sources for this detection include **PowerShell script logs**, specifically focusing on Script Block Logging, which provides the necessary context for analyzing executed PowerShell commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine the PowerShell script logs for entries that match the identified patterns, particularly those involving `Get-ChildItem` and other related cmdlets indicative of directory enumeration.

  - **Identify Context of Commands:** Correlate the identified PowerShell commands with the user and system context to determine whether they were executed by legitimate users or processes. Verify whether the commands were part of regular administrative tasks or anomalous activity.

  - **Audit Recent Changes:** Check for any files or directories recently accessed or modified by accounts involved in the PowerShell enumeration. Investigating these changes can highlight potential data exfiltration or unauthorized access attempts.

  - **Cross-reference User Activity:** Analyze logs from related systems (e.g., EDR alerts, file server logs) to understand whether there were any unusual authentication attempts, lateral movements, or other suspicious activities that align with the timing and scope of the PowerShell enumeration.

  ### Prioritization
  The alert is marked as medium severity due to the potential for directory enumeration to precede further malicious activities, such as data exfiltration or ransomware deployment. While PowerShell usage is prevalent in legitimate administrative tasks, its misuse requires timely investigation to mitigate possible threats.

  ### Blind Spots and Assumptions
  One gap in this detection coverage is the reliance on Script Block Logging, which must be explicitly enabled on the target systems for detection to work effectively. Additionally, the rule may generate false positives from legitimate PowerShell scripts used by administrators. The detection logic assumes attackers consistently use recognizable patterns in their commands, which may not always hold true. Proper configurations and logging capabilities must be in place to capture the necessary data for this alert to function effectively.

