title: Powershell Directory Enumeration
id: 162e69a7-7981-4344-84a9-0f1c9a217a52
status: test
description: Detects technique used by MAZE ransomware to enumerate directories 
  using Powershell
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
- https://www.mandiant.com/resources/tactics-techniques-procedures-associated-with-maze-ransomware-incidents
author: frack113
date: 2022-03-17
tags:
- attack.discovery
- attack.t1083
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - foreach
    - Get-ChildItem
    - '-Path '
    - '-ErrorAction '
    - SilentlyContinue
    - 'Out-File '
    - '-append'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell to perform directory enumeration, specifically using commands like `Get-ChildItem` in a loop context, which is commonly leveraged by adversaries, such as MAZE ransomware operators, to map out file structures prior to executing further malicious activities. The likely attacker objective here is to gather information on the file system in order to identify sensitive files for exfiltration or to decide targets for encryption.

  The detection aligns with the MITRE ATT&CK tactics of Discovery (Tactic: Discovery - ID: T1083) and specifically the technique T1083 (File and Directory Discovery). The primary telemetry source for this detection is Windows PowerShell logs that require Script Block Logging to be enabled for effective monitoring. If the behavior is indeed malicious, it could lead to sensitive data exposure or significant operational disruption. However, this detection does NOT confirm that the behavior indicates malicious intent on its own, as legitimate scripts may exhibit similar activity.

  ### Investigation Steps

  - **Collect relevant PowerShell logs: ** Use the Windows Event Viewer to navigate to Windows PowerShell logs (Event ID 4104) to locate instances where the contained commands are executed. Check the `ScriptBlockText` field for the keywords identified.

  - **Identify known malicious patterns:** Look for the exact command syntax involving `foreach`, `Get-ChildItem`, and parameters like '-Path' and '-ErrorAction SilentlyContinue'. If these commands are used together without a legitimate context or in an unexpected time frame, consider it suspicious.

  - **Assess context of PowerShell use:** Review other related events (e.g., login events - Event ID 4624) within a reasonable timeframe to determine whether the PowerShell session was started by a legitimate user or an anomalous user that could indicate a compromised account.

  - **Review legitimate activity examples:** Investigate if similar commands are commonly executed in your environment for valid administrator tasks, such as IT maintenance scripts that enumerate files for backup or reporting purposes. Validate against known good PowerShell scripts maintained by your IT team.

  - **Check for follow-on activity:** Investigate subsequent PowerShell commands or processes spawned after the enumeration, particularly any commands involving file manipulation or encryption (e.g., `Move`, `Rename`, or potential use of other ransomware-related behaviors).

  ### Prioritization

  This alert has medium severity, based on the potential impact of the system involved. If exploited, the adversary could gain access to sensitive information or plan ransomware deployment. This behavior is a common precursor to ransomware attacks, and while not every enumeration signifies malicious intent, the context must be carefully evaluated.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not having Script Block Logging enabled, potentially allowing some adversary activities to go unnoticed. Evasion techniques like encoding or obfuscating PowerShell commands may also evade detection. Additionally, legitimate PowerShell usage by systems administrators can trigger this alert, particularly if they're running scripts for maintenance. It is beneficial to correlate this detection with alerts from file integrity monitoring solutions that may flag unusual access to sensitive files following enumeration behavior.

