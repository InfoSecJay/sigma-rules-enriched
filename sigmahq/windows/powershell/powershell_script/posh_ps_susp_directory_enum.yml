title: Powershell Directory Enumeration
id: 162e69a7-7981-4344-84a9-0f1c9a217a52
status: test
description: Detects technique used by MAZE ransomware to enumerate directories 
  using Powershell
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
- https://www.mandiant.com/resources/tactics-techniques-procedures-associated-with-maze-ransomware-incidents
author: frack113
date: 2022-03-17
tags:
- attack.discovery
- attack.t1083
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - foreach
    - Get-ChildItem
    - '-Path '
    - '-ErrorAction '
    - SilentlyContinue
    - 'Out-File '
    - '-append'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_directory_enum/info.yml
note: |
  ### Technical Context

  This rule detects the use of PowerShell for directory enumeration, specifically focusing on commands often associated with ransomware activities, such as those employed by the MAZE ransomware group. The likely attacker objective is to gather information about the file system structure to identify valuable data for subsequent exfiltration or encryption. This behavior aligns with the MITRE ATT&CK technique T1083 (File and Directory Discovery), which falls under the Discovery tactic.

  The primary telemetry source required for this detection is Windows PowerShell logs, particularly when Script Block Logging is enabled. The security impact of malicious directory enumeration can be severe, as it may indicate an active reconnaissance phase prior to a data breach or ransomware attack. However, this detection does NOT confirm that an attack is underway; legitimate administrative tasks may trigger similar patterns.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious commands:** Focus on Security Event ID 4104 (PowerShell Script Block Logging). Look for scripts utilizing `foreach`, `Get-ChildItem`, `-Path`, `-ErrorAction`, and `Out-File`. Identify if the commands are used in legitimate contexts.

  - **Analyze file collection behavior:** Validate if files were written to with `Out-File` and check the path for common directory structures. Legitimate scripts may output to user-specific subdirectories, while malicious scripts often target sensitive or system areas.

  - **Inspect for typical benign activity:** Identify expected PowerShell usage patterns within your environment, such as system inventory scripts run by IT personnel. Compare script parameters against known operational scripts.

  - **Look for high-confidence malicious indicators:** If the command includes parameters like `-append` coupled with `SilentlyContinue`, it strongly indicates obfuscation common in nefarious activities. Investigate further.

  - **Correlate with user behavior:** Check logs for abnormal user activity or failed logins leading up to the detection. Unusual logon patterns, especially from service accounts or administrator roles, can suggest malicious intent.

  - **Cross-reference with other detections:** Identify if there are concurrent alerts for credential dumping or lateral movement (e.g., related suspicious PowerShell sessions logged via Event ID 4688). An increase in suspicious behavior could indicate a broader compromise.

  ### Prioritization

  This alert is medium priority due to its potential impact, especially if it is observed on critical servers or endpoints. The behavior reflects tactics commonly used in ransomware operations, which are prevalent. Given that PowerShell is frequently used in legitimate contexts, context is crucial to distinguish between benign and malicious actions.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of scripted tasks or automated processes triggering alerts, which can lead to false positives. Reliable detection requires that Script Block Logging is enabled across all relevant endpoints. Additionally, legitimate system administration functions or PowerShell training sessions may inadvertently invoke this behavior. A companion detection could include endpoints monitoring for unusual outbound call patterns or suspicious network connections following a directory enumeration event.

