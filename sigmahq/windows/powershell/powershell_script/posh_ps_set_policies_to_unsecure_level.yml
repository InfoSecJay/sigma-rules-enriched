logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Set-ExecutionPolicy'
  selection_option:
    ScriptBlockText|contains:
    - 'Unrestricted'
    - 'bypass'
  filter_optional_chocolatey:
    ScriptBlockText|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')"
    - "(New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1')"
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Administrator script
level: medium
note: |
  ---

  ### Technical Context

  This rule detects changes to PowerShell execution policies, specifically when the `Set-ExecutionPolicy` cmdlet is used to modify the policy to levels like "Unrestricted" or "Bypass". Such behavior can indicate an attempt to facilitate the execution of potentially malicious scripts, which aligns with attacker objectives of executing unauthorized commands to gain control over a system. This detection aligns with the MITRE ATT&CK tactic "Execution" and technique "Command and Scripting Interpreter: Windows PowerShell" (T1059.001). The primary telemetry source for this detection is Windows PowerShell script block logging. If the execution policy is modified to an insecure level, it can enable further exploitation or lateral movement within the network. However, this detection does NOT confirm malicious intent on its own, as administrators may also alter execution policies for legitimate operational tasks.

  ---

  ### Investigation Steps

  - **Review PowerShell command history**: Check for the presence of `Set-ExecutionPolicy` in the PowerShell command history (Event ID 4103, `ScriptBlockText` field) to confirm the change was made by the user.

  - **Verify execution policy level**: Run `Get-ExecutionPolicy -List` in PowerShell to ascertain the current execution policy levels across different scopes (User, Process, Machine) to determine the security posture.

  - **Identify user context for change**: Examine the user ID (Event ID 4688, `NewProcessName` or `ProcessId` fields) that executed the `Set-ExecutionPolicy` to determine if it was a known administrator or a potentially unauthorized account.

  - **Check for associated malicious indicators**: Look for additional PowerShell activity around the same timestamp involving download commands (e.g., `DownloadString`) or execution of scripts typically used in attacks, which may suggest nefarious activity.

  - **Correlate with user behavior**: Investigate if the user has a history of legitimate tasks that would require adjusting PowerShell policies, such as software installation or script development, to distinguish benign activity from malicious intent.

  - **Review system logs for script executions**: Analyze the logs for recent PowerShell script executions (Event ID 4103) to identify if any script was executed immediately after changing the execution policy, which could indicate an attempt to exploit the new policy.

  ---

  ### Prioritization

  This alert carries medium severity as it indicates a potential escalation of privileges that can lead to exploitation. The likelihood of malicious abuse is significant, as changing PowerShell execution policy is a common technique used by attackers for executing malicious scripts. While changing execution policies is sometimes warranted, it must be closely monitored to prevent exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions when execution policies are adjusted as part of routine maintenance. Furthermore, if script block logging is not properly configured or enabled, this detection may not function effectively. Legitimate activities that might trigger the alert include system configuration adjustments or software deployments that require script execution. A companion detection for review would be the monitoring of script execution logs or other PowerShell command logs, which strengthen the ability to identify malicious usage patterns.

