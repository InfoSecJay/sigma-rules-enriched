logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Set-ExecutionPolicy'
  selection_option:
    ScriptBlockText|contains:
    - 'Unrestricted'
    - 'bypass'
  filter_optional_chocolatey:
    ScriptBlockText|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')"
    - "(New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1')"
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Administrator script
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify changes to the PowerShell script execution policy using the `Set-ExecutionPolicy` cmdlet. This cmdlet modifies the level of script execution access for PowerShell, which can significantly impact the security posture of a Windows environment. Attackers may exploit this capability to lower the script execution policy to "Unrestricted" or "Bypass," enabling the execution of potentially malicious PowerShell scripts without administrative prompts or restrictions.

  The likely threat scenario involves threat actors attempting to execute unauthorized or malicious scripts, which could lead to system compromise, data exfiltration, or lateral movement within the network. By monitoring changes to the execution policy, security operations teams can detect potential misuse of PowerShell, which is often leveraged in malicious activities.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution**: The act of running malicious scripts (T1059.001).
  - **Command and Scripting Interpreter**: Specifically focusing on PowerShell for execution (T1059.001).

  Primary data sources for this detection rule include PowerShell script block logging, which must be enabled to capture the necessary events related to script execution policies.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script block logs for entries reflecting changes to execution policies, particularly commands containing `Set-ExecutionPolicy` with values such as "Unrestricted" or "Bypass."
  - **Correlate with User Actions**: Identify the user accounts making these changes, analyzing if they are legitimate administrative users or if there are any indicators of compromise, such as unusual logins or activity patterns.
  - **Inspect Remote Execution Attempts**: Investigate any concurrent or subsequent connections from the same user account that might indicate remote execution of scripts or further exploitation attempts.
  - **Audit Configuration Settings**: Assess the overall PowerShell configuration settings within the environment to ensure they align with organizational policies and best practices, focusing on administrative controls over script execution.

  ### Prioritization
  This alert is of medium severity due to its potential impact on the security of the enterprise environment. Changes to script execution policies can significantly increase the likelihood of successful exploitation by threat actors, necessitating prompt investigation to determine the legitimacy of the change.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage for this rule. For instance, if script block logging is not enabled, the detection logic will fail, leaving the environment vulnerable. Additionally, the rule assumes that legitimate administrative changes will occur infrequently, which may not hold true in highly automated environments where administrators use scripts. Effective monitoring requires proper logging configurations and comprehensive administrative controls to ensure alerts are actionable and relevant.

