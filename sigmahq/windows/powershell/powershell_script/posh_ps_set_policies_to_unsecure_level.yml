note: |
  ### Technical Context

  This rule detects attempts to change PowerShell's script execution policy to potentially insecure levels through the `Set-ExecutionPolicy` cmdlet. Attackers may aim to enable unrestricted or bypass policies to facilitate the execution of malicious scripts, aiding in further exploitation or lateral movement within the network. The relevant MITRE ATT&CK technique is Execution (T1059.001).

  Primary telemetry sources include PowerShell logs that require script block logging to be enabled. If malicious, this action allows the execution of unauthorized scripts, potentially leading to significant security breaches. However, this detection does not confirm that malicious activity occurred, as legitimate administrative actions may also trigger it.

  ### Investigation Steps

  - **Review the execution policy change:** Examine PowerShell logs for `ScriptBlockText` containing `Set-ExecutionPolicy`, focusing on the specific options "Unrestricted" or "bypass." Cross-reference with administrator accounts or change logs for legitimacy.

  - **Identify authorized administrators:** Check for activity from known administrator accounts. Legitimate changes may be made during authorized maintenance or security practice, so validate the user's prior authorization and intent.

  - **Search for other indicators of compromise:** Investigate related commands within the same timeframe, particularly for signs of script downloading or execution without proper validation (e.g., `New-Object System.Net.WebClient.DownloadString`).

  - **Correlate with user activity logs:** Examine logs for other PowerShell executions around the time of the policy change (e.g., Event ID 4104) to see if there are any suspicious or unknown scripts that were run immediately after the policy was set.

  - **Check system configuration:** Ensure systems maintain a policy of restricted execution for scripts unless explicitly required. Review policy settings via `Get-ExecutionPolicy -List` to identify discrepancies.

  ### Prioritization

  This alert has medium severity due to its potential impact on system security. Changing execution policies can escalate risk by allowing unverified scripts to run, which is a common tactic used by adversaries. While this behavior can be legitimate, it is frequently weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where script block logging is not enabled, decreasing coverage. Legitimate administrative actions such as script policy adjustments for updates can also inadvertently trigger this alert. Related detections, such as those for suspicious PowerShell activity or script downloads, can strengthen overall monitoring and response capabilities against execution and lateral movement threats.

