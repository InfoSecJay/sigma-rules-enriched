logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Set-ExecutionPolicy'
  selection_option:
    ScriptBlockText|contains:
    - 'Unrestricted'
    - 'bypass'
  filter_optional_chocolatey:
    ScriptBlockText|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')"
    - "(New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1')"
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Administrator script
level: medium
note: |
  ### Technical Context

  This rule detects changes to the PowerShell script execution policy using the `Set-ExecutionPolicy` cmdlet, specifically when set to insecure levels such as "Unrestricted" or "Bypass." The likely objective of this action is to enable the execution of potentially harmful scripts without restriction, facilitating malicious activity or unauthorized operations on the system. This behavior aligns with the MITRE ATT&CK technique for execution: PowerShell (T1059.001).

  The primary telemetry source is Windows PowerShell script logs. Specifically, Script Block Logging must be enabled to collect the relevant telemetry. If malicious, changing the execution policy can significantly escalate the risk of code execution attacks or malware deployment. It's essential to note that this detection does not confirm malicious intent on its own; legitimate administrative activities, such as configuration changes by authorized personnel, may also trigger this alert.

  ### Investigation Steps

  - **Verify Execution Policy Change:** Review the logs where the execution policy was changed, focusing on Event ID 4104 (PowerShell Script Block Log) and checking for `Set-ExecutionPolicy` alongside "Unrestricted" or "Bypass" values in the `ScriptBlockText` field.

  - **Identify Contextual Usage:** Assess the surrounding commands in the logs leading to the execution policy change. Look for patterns or frequent execution of scripts that could indicate malicious intent, such as attempts to download and execute scripts from untrusted sources.

  - **Analyze Source of Command Invocation:** Investigate if the command originates from a legitimate administrative account or if it was executed by a potentially compromised user. Check for unusual logon patterns or account activity in Security Event ID 4624 (Logon).

  - **Document Expected Behavior:** Check for documented administrative activities that involve changing execution policies. Review Change Management records to confirm if this policy modification aligns with legitimate operational requirements.

  - **Cross-reference with Other Alerts:** Look for any simultaneous alerts created by related detection rules, such as those identified in companion detections, for ProcCreation commands or registry changes that may signal an ongoing malicious operation.

  - **Examine System Configuration:** Ensure that Script Block Logging is properly configured to capture all relevant activity. Validate that there are no gaps in logging or unexpected alterations to group policy settings that may mitigate detection capabilities.

  ### Prioritization

  This alert carries a medium severity level due to its potential impact, depending on whether the system changed is critical for operations. If exploited, the likelihood of abuse is high since adversaries often leverage PowerShell execution for their attacks. This behavior is not uncommon in the context of advanced threats, making prompt investigation vital.

  ### Blind Spots and Assumptions

  The detection may have limitations, particularly if logging is not consistently enabled across all endpoints, which could obscure events leading to a policy change. Legitimate administrative actions, such as authorized updates or configurations, may result in false positives. Additionally, attackers may employ process injection or evasion tactics to bypass logging. Companion detections, such as those for Process Creation or Registry modifications, could provide enhanced coverage against related malicious behaviors.

