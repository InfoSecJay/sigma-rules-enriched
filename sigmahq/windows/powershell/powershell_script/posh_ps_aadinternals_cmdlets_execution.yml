logsource:
  product: windows
  category: ps_script
  definition: Script Block Logging must be enable
detection:
  selection:
    ScriptBlockText|contains:
            # Since most of the cmdlets use a unique enough string which is "-AADInt" we only used that portion. For a complete list please check the references linked above
    - 'Add-AADInt'
    - 'ConvertTo-AADInt'
    - 'Disable-AADInt'
    - 'Enable-AADInt'
    - 'Export-AADInt'
    - 'Find-AADInt'
    - 'Get-AADInt'
    - 'Grant-AADInt'
    - 'Initialize-AADInt'
    - 'Install-AADInt'
    - 'Invoke-AADInt'
    - 'Join-AADInt'
    - 'New-AADInt'
    - 'Open-AADInt'
    - 'Read-AADInt'
    - 'Register-AADInt'
    - 'Remove-AADInt'
    - 'Reset-AADInt'
    - 'Resolve-AADInt'
    - 'Restore-AADInt'
    - 'Save-AADInt'
    - 'Search-AADInt'
    - 'Send-AADInt'
    - 'Set-AADInt'
    - 'Start-AADInt'
    - 'Unprotect-AADInt'
    - 'Update-AADInt'
  condition: selection
falsepositives:
- Legitimate use of the library for administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of specific AADInternals PowerShell cmdlets that are predominantly used for administering Azure Active Directory (Azure AD) and Office 365. Malicious actors may exploit these cmdlets to conduct reconnaissance or execute attacks on Azure resources or user data within Office 365, potentially leading to credential theft or unauthorized access. This detection aligns with the MITRE ATT&CK tactics of Execution (TA0011), Discovery (TA0007), and Credential Access (TA0006).

  The primary telemetry source is PowerShell script block logging. Affected log types should include detailed PowerShell execution logs to capture cmdlet usage, including logged fields such as ScriptBlockText. If these cmdlets are executed without proper context, it may indicate a potential threat, emphasizing the need for analysts to focus on the surrounding behavior. However, this detection alone does not confirm malicious intent, as legitimate administrative activities may also trigger alerts.

  ### Investigation Steps

  - **Verify PowerShell command context:** Review the PowerShell execution logs (Event ID 4104) for the context in which the cmdlets were executed. Identify the user executing the commands and the associated time stamps, as legitimate administrative users may execute these cmdlets for valid reasons.

  - **Identify suspicious cmdlet usage:** Focus on the presence of cmdlets like 'Export-AADInt' or 'Get-AADInt', which may indicate attempts to extract information or manipulate Azure AD configurations. Validate the execution time and user context against known administrative schedules.

  - **Check for prior alerts or unusual activity:** Cross-reference the user and system involved with other security alerts or anomalies in your environment around similar timestamps. Look for multiple executions of different AADInternals cmdlets, which may indicate proactive reconnaissance.

  - **Monitor for unusual access patterns:** Review Azure AD access logs for corresponding access attempts from the involved user, especially around the time of cmdlet execution. Flag any unexpected access to sensitive groups, users, or resources associated with the executed commands.

  - **Assess the criticality of the host:** Consider the host role where the cmdlets were executed. If the execution originated from a management server or domain controller, this may indicate higher risk than a non-critical or isolated system.

  ### Prioritization

  This alert is rated high severity due to the potential impact on sensitive Azure AD and Office 365 environments. The likelihood of malicious abuse can be significant, as these cmdlets are not typically used in benign scenarios. The utilization of AADInternals for exploitation is becoming more common among adversaries targeting cloud environments.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell script block logging is not enabled, reducing the efficacy of this rule. Additionally, legitimate administrative activities, such as scheduled maintenance or configuration changes, may inadvertently trigger the alert without malicious intent. Related detections that strengthen coverage include monitoring for unauthorized Azure API calls or unusual OAuth token requests, which may indicate further exploitation attempts.

