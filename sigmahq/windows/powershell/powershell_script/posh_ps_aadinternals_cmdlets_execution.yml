note: |
  ### Technical Context
  This detection rule identifies the execution of AADInternals PowerShell cmdlets, which are specific commands designed for managing Azure Active Directory (AAD) and Office 365 environments. AADInternals is a tool that, while intended for administrative purposes, poses a significant risk when leveraged by threat actors. Attackers may use these cmdlets to conduct reconnaissance, gather sensitive credentials, or manipulate cloud resources, aligning with their objectives to establish persistence, escalate privileges, or conduct data exfiltration.

  The relevant MITRE ATT&CK techniques related to this detection include **Execution (T1203)**, since the rule captures PowerShell command execution, and **Credential Access (T1552)**, which may occur when attackers attempt to extract user credentials or manipulate access settings using administrative cmdlets. Additionally, **Discovery (T1018)** techniques could apply if the commands are used to map out the Azure AD environment or collect information about users and groups.

  To effectively monitor for this activity, the primary data source is the **Windows PowerShell script block logging**, which must be enabled for the detection to function effectively.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine the PowerShell script block logs for the execution of AADInternals cmdlets. Look for unusual command executions that deviate from normal administrative behavior.
  - **Collect Azure AD Audit Logs**: Gather Azure AD audit logs to correlate the cmdlet executions with changes made within the Azure environment. Focus on user management actions and permission changes.
  - **Monitor User Accounts**: Identify if the cmdlets were executed by unusual or unauthorized accounts, particularly those with elevated permissions. Look for accounts with logins from suspicious (non-business) IPs or geographic locations.
  - **Investigate Recent Config Changes**: Analyze recent configuration changes in Azure AD or Office 365 that correlate with the cmdlet executions, noting any high-risk modifications such as User or Group creations/alterations and access level changes.

  ### Prioritization
  The alert is classified as high severity due to the potential impact of unauthorized access to Azure AD and Office 365 environments. Given that threat actors can exploit these cmdlets for privilege escalation and lateral movement, timely investigation is crucial to mitigating risks to sensitive data and resources.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell script block logging is not enabled across all endpoints, or if there are gaps in log retention policies. The detection logic assumes that legitimate administrative activities will not frequently include broad usage of AADInternals cmdlets. Additionally, the efficacy of this detection relies on the availability of comprehensive logging from Azure and PowerShell environments; without it, detection may be inconsistent or incomplete.

