level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of specific PowerShell commandlets commonly associated with exploitation tools from ShellIntel, such as ‘Invoke-SMBAutoBrute’, ‘Invoke-GPOLinks’, and ‘Invoke-Potato’. These commandlets are often utilized by threat actors to escalate privileges, conduct brute force attacks, and harvest domain credentials. The relevant MITRE ATT&CK technique for this rule is **Execution - Command-Line Interface (T1059.001)**.

  Primary telemetry sources include PowerShell logs, specifically sysmon logs and Security Event ID 4104 (for script block logging), which must be enabled for effective detection. If malicious, this activity can lead to unauthorized access, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm a successful exploitation or compromise on its own but instead indicates potentially suspicious PowerShell activity.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Examine Security Event ID 4104 for instances of the detected commandlets. Look specifically for `ScriptBlockText` containing ‘Invoke-SMBAutoBrute’, ‘Invoke-GPOLinks’, or ‘Invoke-Potato’. Multiple occurrences from the same process may indicate malicious intent.

  - **Correlate with Process Creation Events**: Check Security Event ID 4688 for the parent process that spawned the PowerShell instance. Look for process parents that are unusual (e.g., user-initiated vs. system processes) to identify potentially suspicious or unauthorized execution contexts.

  - **Identify Anomalous User Behavior**: Investigate the user associated with the PowerShell execution. Legitimate use typically includes IT admins executing scripts for maintenance. Look for abnormal execution times or use of accounts not traditionally associated with administrative duties.

  - **Check for Related Network Activity**: Assess network logs for connections to known malicious IP addresses or domain names that may correlate with the execution of the detected commandlets. Pay special attention to authentication traffic that follows these command execution logs.

  - **Validate Environment Context**: Determine the host role and asset criticality where the activity was detected. If it’s a sensitive server (e.g., domain controllers), the risk level is elevated, requiring more immediate response actions.

  - **Examine for Output Artifacts**: Check for associated logs that indicate the output of the command, such as event logs related to credential dumps or access to SMB shares, as these may signify further malicious intent beyond just command execution.

  ### Prioritization

  This alert is high severity due to the criticality of the impacted systems, particularly if the execution occurs on high-value assets such as domain controllers or servers that handle sensitive data. The likelihood of malicious exploitation leading to credential theft or lateral movement is significant, given that these commandlets are widely weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell script block logging is not enabled, which is necessary for capturing the script execution details. Evasion techniques may include the use of obfuscation or encrypted commands to bypass detection. Legitimate administrative tasks may trigger this alert, particularly during maintenance activities. Related detection to consider is monitoring for abnormal authentication attempts following the execution of these commandlets to enhance coverage of potentially malicious behavior.

