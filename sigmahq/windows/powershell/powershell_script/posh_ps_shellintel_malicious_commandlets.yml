logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Invoke-SMBAutoBrute'
    - 'Invoke-GPOLinks'
            # - 'Out-Minidump' # Covered in 89819aa4-bbd6-46bc-88ec-c7f7fe30efa6
    - 'Invoke-Potato'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of specific PowerShell commandlets commonly associated with ShellIntel exploitation scripts. The commandlet names, such as `Invoke-SMBAutoBrute`, `Invoke-GPOLinks`, and `Invoke-Potato`, are indicative of malicious activities aimed at credential dumping, enumeration, or lateral movement within an environment. Attackers leveraging these commandlets typically aim to exploit weaknesses in a network's security configuration, gain unauthorized access to systems, and escalate privileges.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002), specifically the technique **Command and Scripting Interpreter: Windows PowerShell** (T1059.001). The use of these commandlets signifies an adversary's intent to automate tasks typically performed during reconnaissance or exploitation phases, further increasing the likelihood of a successful attack.

  Primary data sources for this detection are Windows PowerShell script logs, specifically those generated by enabling Script Block Logging. These logs capture the commands executed by PowerShell scripts, providing critical insight into potentially malicious activities.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Examine the PowerShell script logs for the detected commandlets (`Invoke-SMBAutoBrute`, `Invoke-GPOLinks`, `Invoke-Potato`) to confirm legitimate execution contexts and parameters.
  - **Analyze User Context:** Investigate the account under which the commandlets were executed to determine if it is a legitimate admin account or if its credentials may have been compromised.
  - **Correlate with Other Logs:** Cross-reference the PowerShell activity with relevant sources such as Windows Event Logs (Event ID 4104 for Script Block logging), authentication logs, and system logs to look for anomalous or unauthorized access patterns.
  - **Investigate Network Activity:** Assess any network traffic associated with the executed commandlets, especially looking for connections to internal resources and any suspicious SMB or Active Directory queries.

  ### Prioritization
  Given the potential for significant impact to organizational security through unauthorized access and privilege escalation, this alert is considered high severity within an enterprise environment. The use of known malicious commandlets poses a critical risk that warrants immediate investigation.

  ### Blind Spots and Assumptions
  The detection may overlook instances where Script Block Logging is not enabled or fails to capture the relevant command execution. Furthermore, the detection assumes that commands containing these specific strings represent malicious intent, which may not always be the case if used within legitimate administrative contexts. Proper configuration of Windows logging mechanisms is essential for this alert to function effectively, as missing or misconfigured logs could lead to undetected malicious activity.

