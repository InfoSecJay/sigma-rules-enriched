note: |
  ### Technical Context
  This detection rule identifies potentially malicious creation of new domain accounts within an Active Directory (AD) environment. Specifically, it assesses PowerShell script executions that employ the `System.DirectoryServices.AccountManagement` namespace, which is commonly utilized for user management tasks. Adversaries may exploit legitimate administrative capabilities to create domain accounts, thereby establishing persistent access to victim systems, evading detection, and escalating privileges within the domain.

  The threat scenario revolves around an attacker gaining an initial foothold within the network, then leveraging their access to execute scripts for manipulating user security principals, which can lead to unauthorized access to sensitive data and further exploitation of network resources. This behavior aligns with the MITRE ATT&CK framework under the persistence tactic, specifically the technique T1136.002: "Create Account," where attackers create accounts to maintain a foothold in the environment.

  Primary data sources that will provide the best evidence for this detection include PowerShell script block logs, which need to be enabled to capture the executed scripts. Additionally, monitoring changes in Active Directory user/group accounts and related event logs will help validate the occurrence of suspected account creation activity.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate PowerShell script block logs for entries containing `System.DirectoryServices.AccountManagement`. Correlate timestamps with known suspicious activities to identify potential unauthorized account creations.

  - **Examine Active Directory Changes**: Check the AD change logs for any account modifications or new account creations during the identified time frames. Pay special attention to non-typical users or accounts created from unusual locations.

  - **Analyze User Permissions**: Conduct a review of user permissions associated with newly created accounts. Identify whether these accounts have been granted elevated privileges or unnecessary access to critical resources.

  - **Investigate Script Execution Context**: Understand the context in which the PowerShell scripts were executed. Review event logs to determine the identity of the user who executed the script and cross-reference with user behaviors to identify any anomalies.

  ### Prioritization
  This alert holds medium severity due to the potential impact on organizational security, as unauthorized domain account creations can lead to increased risks, including prolonged access to systems and data breaches. The likelihood of such activities occurring in a sophisticated attack scenario is relatively high, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if PowerShell script block logging is not enabled or if there are configurations that prevent capturing all PowerShell executions. The detection logic assumes that all legitimate administrative scripts will not generate alerts, hence the possibility of false negatives exists. Additionally, if attackers utilize non-PowerShell methods to create accounts, those activities would remain undetected under this rule. Organizations must ensure that appropriate logging and monitoring configurations are in place to support effective detection.

