note: |
  ### Technical Context

  This Sigma rule detects the creation of a domain account via PowerShell, utilizing the System.DirectoryServices.AccountManagement namespace. Adversaries may use this technique to maintain persistence within a compromised Active Directory (AD) environment by creating unauthorized accounts with specific privileges. This behavior aligns with the MITRE ATT&CK tactic for Persistence and specifically the technique of Account Manipulation (T1136.002).

  The primary telemetry source is PowerShell script logs, particularly with Script Block Logging enabled, which captures the arguments and commands executed. If this behavior is malicious, it poses significant risks, allowing attackers to leverage unauthorized access for various malicious objectives. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger similar events.

  ### Investigation Steps

  - **Verify the script context**: Examine the PowerShell script invoking System.DirectoryServices.AccountManagement. Look for Event ID 4104 (PowerShell Script Block Logging) to assess the intent behind the script. Legitimate scripts from known admin accounts will often include approved organizational change documentation.

  - **Identify account creation activity**: Cross-reference PowerShell logs with Active Directory event logs, specifically Event ID 4720 (A user account was created). Note the user and machine context to determine if the account was created under a suspicious user or from an unrecognized system.

  - **Check for unauthorized privileges**: If a new account is confirmed, review its privileges and group memberships using Event ID 4727 (A group was created) and Event ID 4732 (A member was added to a group) to identify any elevation of privileges that could indicate malicious intent.

  - **Review for known benign accounts**: Compare the created account against a list of authorized service accounts. Any account that does not match or align with organizational policy may indicate a potential compromise.

  - **Search for anomalies in user activity**: Evaluate user activity logs for the newly created accounts. Use Event ID 4624 (Logon), to identify any unusual logon patterns or geographic inconsistencies, which may highlight malicious use of the newly created account.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of unauthorized access on critical systems. The likelihood of malicious abuse is concerning, given that creating domain accounts is commonly weaponized by adversaries for persistence. Quick action is warranted to determine the intent and context surrounding this activity.

  ### Blind Spots and Assumptions

  A limitation of this detection is that it may also trigger during legitimate administrative tasks, which can yield false positives. Properly configured logging, including Script Block Logging, is essential for reliable detection. Activities such as regular administrative account maintenance may inadvertently trigger this alert. Consider implementing additional detections around failed logons associated with the created accounts to enhance monitoring and indicator coverage.

