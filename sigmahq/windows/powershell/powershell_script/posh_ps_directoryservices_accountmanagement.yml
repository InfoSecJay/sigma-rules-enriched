note: |
  ### Technical Context

  This detection rule identifies the creation of new domain accounts using PowerShell, specifically through the invocation of the `System.DirectoryServices.AccountManagement` namespace. The likely objective of an attacker triggering this behavior is to establish a persistent foothold within the compromised domain environment, allowing them to bypass traditional authentication and access permissions. Relevant MITRE ATT&CK tactics include **Persistence** and technique **T1136.002** (Create Account).

  The primary telemetry source is PowerShell script logs where Script Block Logging is enabled, specifically capturing instances of script execution that includes function calls to create accounts. If malicious, this behavior significantly impacts the security posture by enabling unauthorized access to systems and services configured within Active Directory. Importantly, this detection does not confirm malicious intent by itself, as legitimate administrative users may perform similar actions.

  ---

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Check for Security Event ID **4104** which captures the script blocks that include `System.DirectoryServices.AccountManagement`. Look for unusual account creation parameters that deviate from standard operational practices.

  - **Correlate with Active Directory Events**: Verify against Active Directory logs (Event ID **4720** - A user account was created) to find newly created accounts around the same timestamp. Determine the context (user, IP address) of the account creation to establish legitimacy.

  - **Examine User Privileges**: Assess the privileges associated with newly created accounts. Legitimate accounts created by administrators typically have documented roles, whereas anomalous accounts may exhibit excessive permissions not aligned with typical user roles.

  - **Identify Host Role and Asset Criticality**: Determine the function of the host from which the account creation was initiated. A sensitive server like a Domain Controller generating such events would indicate higher risk than non-critical systems.

  - **Spot Confirmed Malicious Indicators**: Look for simultaneous unusual network activity (e.g., unauthorized access attempts) from accounts created recently. If you find that new accounts are following abnormal patterns (such as accessing critical systems immediately post-creation), this is a strong indicator of compromise.

  ---

  ### Prioritization

  The alert carries medium severity due to the potential for significant impact on security if unauthorized accounts are created. The likelihood of malicious use is notable, especially if the activity originates from users or systems outside typical administrative roles. While administrative account creations do occur, they should follow established change management protocols.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where admins have legitimate reasons for creating accounts similar to the identified patterns. A comprehensive PowerShell logging strategy must be in place to ensure meaningful detection. Additionally, factors such as accounts created via other methods (e.g., GUI) would not be captured. A related detection to consider is monitoring for lateral movement behavior associated with newly created accounts leveraging Event ID **4624** (An account was successfully logged on).

