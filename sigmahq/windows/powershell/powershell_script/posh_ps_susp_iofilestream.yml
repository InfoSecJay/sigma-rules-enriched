note: |
  ### Technical Context
  This rule is designed to detect suspicious PowerShell activity that involves opening a handle to a drive volume using the `\\.\` DOS device path specifier and performing direct access reads from that volume. This behavior can indicate potential data exfiltration or malicious attempts to manipulate file system data, often associated with threat actors looking to evade detection or modify system files without leaving typical traces.

  The likely threat scenario involves an attacker attempting to access sensitive volume data directly, which is a method often used to bypass security mechanisms and gain access to unauthorized data. Such activities may represent a strategy utilized by advanced persistent threats (APTs) or sophisticated cybercriminals with the objective of data theft or integrity compromise.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005)
  - **File and Directory Permission Modification** (T1070.003)

  The primary telemetry sources for this detection include Windows PowerShell script block logs, as these logs provide the necessary context for analyzing PowerShell commands and identifying potentially malicious activities.

  ### Investigation Steps
  - **Review PowerShell Logs:** Review script block logging on the affected system for any instances where `New-Object IO.FileStream` is invoked, particularly those referencing `\\.\`.
  - **Analyze File System Access:** Investigate any corresponding file system access events to identify what files or data were accessed or modified directly after the command was executed.
  - **Correlate with Other Logs:** Cross-reference the findings with related logs (e.g., EDR logs, Windows Event logs) to identify abnormal patterns of behavior that may indicate an ongoing attack or previous compromises.
  - **Assess Lateral Movement Indicators:** Look for other indicators of lateral movement or privilege escalation that may accompany this behavior, as attackers often utilize multiple techniques in tandem.

  ### Prioritization
  The alert is rated medium in severity due to the potential implications of unauthorized access to sensitive data and the sophisticated nature of the techniques being employed. Organizations should be particularly vigilant, as this behavior could signify a targeted attack or impending data breach.

  ### Blind Spots and Assumptions
  This detection may miss legitimate PowerShell scripts that utilize similar commands for benign purposes, leading to false positives. Additionally, the rule assumes that script block logging is properly configured and enabled, which is crucial for capturing relevant PowerShell activity. If logging is not configured, the detection capabilities will be significantly impaired.

