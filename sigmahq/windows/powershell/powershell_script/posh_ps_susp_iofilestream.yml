note: |
  ### Technical Context

  This Sigma rule detects the creation of an `IO.FileStream` object using the `\\.\` path specifier, indicating direct access to a physical volume. This behavior often signifies an attacker attempting to read sensitive data from the disk, potentially as part of exfiltration or data manipulation efforts. The relevant MITRE ATT&CK technique is "Exfiltration Over Physical Medium" (T1006), categorized under the Defense Evasion tactic.

  Primary telemetry sources include PowerShell script block logs, specifically requiring Script Block Logging to be enabled. If exploited maliciously, this detection is critical as it may indicate an attempt to gain unauthorized access to sensitive data on the disk. However, it is important to note that this alert does NOT confirm malicious intent on its own; legitimate administrative scripts may also exhibit similar behavior.

  ### Investigation Steps

  - **Review PowerShell script block logs**: Check for Event ID 4104 in the PowerShell Operational log for script blocks that include `New-Object IO.FileStream` and `\\.\` paths. Look for suspicious user accounts or unusual timestamps.

  - **Identify indicators of compromise**: Verify process creation logs (Event ID 4688) to detect whether PowerShell was spawned by a known legitimate process. Investigate the process's parent-child relationships for anomalies.

  - **Analyze PowerShell command context**: Examine the context of script execution, focusing on strings within the script. Check PowerShell transcription logs if enabled for further insight into the commands executed.

  - **Validate expected behavior**: Determine if this file stream access aligns with legitimate business processes, such as disk diagnostics or recovery scripts. Compare the access patterns with known patterns from user training and behavior documentation.

  - **Assess affected host criticality**: Identify the role of the affected system (e.g., application server, file server) to understand the potential impact of data exposure or manipulation in relation to organizational operations.

  - **Correlate with other detections**: Look for related alerts in SIEM regarding direct disk access or unusual PowerShell activities to confirm whether this behavior is part of a larger pattern indicative of malicious activity.

  ### Prioritization

  This alert is medium severity due to the potential for sensitive data exposure on critical systems. Given the nature of disk access, the likelihood of malicious use, particularly in advanced persistent threats, warrants prompt investigation. Such behavior is not commonly seen in benign administrative tasks, raising the need for careful scrutiny.

  ### Blind Spots and Assumptions

  This detection may be evaded through use of native utilities or scripts that do not trigger logging, and it relies heavily on the configuration of PowerShell logging. Legitimate activities like system audits may trigger similar alerts if not differentiated. A companion detection to consider would be monitoring for unusual file access patterns or lateral movement attempts to strengthen incident response capabilities within the organization.

