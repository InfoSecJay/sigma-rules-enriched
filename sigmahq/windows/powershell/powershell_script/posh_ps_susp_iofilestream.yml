note: |
  ### Technical Context

  This rule detects the creation of a file handle on a drive volume using PowerShell, specifically through the \\.\ DOS device path specifier to perform direct access reads. This behavior is typically associated with adversaries attempting to bypass filesystem filters or perform low-level disk operations, which may indicate data exfiltration attempts or a precursor to more advanced attacks like malware deployment.

  Relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and the technique "Indicator Removal on Host" (T1070.003). The primary telemetry sources include PowerShell script block logs, which require Script Block Logging to be enabled. If the activity is malicious, it could allow an attacker to manipulate file systems undetected. This detection does not confirm that the activity was malicious; legitimate administrative tasks or scripted processes may produce similar log entries.

  ### Investigation Steps

  - **Review PowerShell Script Execution Logs:** Inspect PowerShell execution logs for Event ID 4104 showing instances of the detected script. Confirm that **Script Block Logging** is enabled on the endpoint.

  - **Identify Script Origins:** Check the parent processes of the PowerShell instances in the logs to determine if they are initiated by suspicious or unusual programs (e.g., cmd.exe, unusual paths). Legitimate scripts typically come from known administrative tasks or well-defined automation routines.

  - **Correlate with File Access Logs:** Analyze access attempts on the targeted volume by consulting Windows Security Event ID 4663, which tracks object access to files, to confirm if the malicious PowerShell command accessed sensitive or unusual files.

  - **Observe Network Traffic Patterns:** Review network logs for any associated data exfiltration activity following this event, such as outgoing connections to unusual external IP addresses or domain names, which might indicate data being sent out.

  - **Validate Against Known Legitimate Behavior:** Document any identified legitimate PowerShell scripts or scheduled tasks that routinely access the drive volume in question, ensuring they are not mistakenly flagged as suspicious.

  ### Prioritization

  This alert has medium severity, primarily due to the potential impact of the system handling sensitive data and the likelihood that adversaries could use this behavior to execute a stealthy attack. This method of file system interaction is not only uncommon but can be weaponized in various advanced persistent threat (APT) scenarios, justifying a closer investigation.

  ### Blind Spots and Assumptions

  This detection may miss certain obfuscation techniques such as command-line arguments being encoded or the use of alternate execution techniques that do not utilize PowerShell. There must be proper configurations in place for script block logging; otherwise, the detection will yield incomplete results. Legitimate use cases, such as disk management operations performed by system administrators, may inadvertently trigger this alert. Companion detections like monitoring for abnormal file create operations via Event ID 4663 can enhance overall coverage in identifying suspicious behaviors.

