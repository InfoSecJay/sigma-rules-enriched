note: |
  ### Technical Context

  This rule detects the use of PowerShell to open a handle on a drive volume through the `\\.\` DOS device path specifier, enabling direct access reads of the first bytes of the volume. The likely attacker objective is to gather information on the file system or initiate malicious activity, which can include data harvesting or manipulation. This behavior correlates with the MITRE ATT&CK technique for Data from Local System (T1006), under the tactic of Exfiltration.

  The primary telemetry source for this detection is PowerShell script block logging, specifically capturing events related to the creation of new objects and accessing device paths. The potential impact of such activity is significant, as malicious access to the file system can result in data breaches or system compromises. It is important to note that this detection does NOT confirm malicious activity by itself; legitimate administrative tasks and scripts may trigger this rule.

  ### Investigation Steps

  - **Assess Script Block Logging:**
    Review PowerShell events (Event ID 4104) to identify the script block execution context. Confirm that logging is enabled, which is crucial for this rule to trigger accurately.

  - **Identify the Execution Context:**
    Examine the `ScriptBlockText` field in Event ID 4104 for the presence of the keywords `New-Object`, `IO.FileStream`, and `\\.\`. Compare against known legitimate PowerShell scripts from trusted sources to distinguish benign from malicious activity.

  - **Evaluate User and Process Privileges:**
    Check the user account associated with the PowerShell command for unusual privileges or roles. Malicious activity is more likely from non-admin accounts performing actions that require elevated permissions.

  - **Correlate with File System Changes:**
    Validate any recent file system changes using File Creation Events (Windows Event ID 4663) in conjunction with this detection to identify high-confidence malicious indicators.

  - **Analyze Affected Assets for Signatures:**
    Review the infrastructure for unusual device access patterns or signs of enumeration (e.g., Event ID 4688 for process creation) related to the targeted volume.

  - **Confirm Legitimate Activity Examples:**
    Investigate use cases of legitimate PowerShell scripts that may access disk volumes, such as backup operations or disk imaging tasks. Document their expected behaviors for comparison.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact on sensitive data if the activity is malicious. Given that direct file system access can be a precursor to data exfiltration or system manipulation, it is crucial to investigate promptly. The likelihood of abuse is moderate, as skilled adversaries may escalate privilege to execute such commands.

  ### Blind Spots and Assumptions

  The detection may not capture all instances of malicious access, particularly if script block logging is not consistently enabled across all systems. Adversaries might mask their actions through obfuscation or use alternative methods for file access. Legitimate administrative scripts that handle disk operations may also trigger this alert, leading to potential false positives. A companion detection to consider is monitoring for unexpected Object Creation events in PowerShell that move beyond standard file access.

