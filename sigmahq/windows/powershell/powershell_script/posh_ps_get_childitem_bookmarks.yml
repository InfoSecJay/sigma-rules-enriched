title: Automated Collection Bookmarks Using Get-ChildItem PowerShell
id: e0565f5d-d420-4e02-8a68-ac00d864f9cf
status: test
description: |
  Adversaries may enumerate browser bookmarks to learn more about compromised hosts.
  Browser bookmarks may reveal personal information about users (ex: banking sites, interests, social media, etc.) as well as details about
  internal network resources such as servers, tools/dashboards, or other related infrastructure.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1217/T1217.md
author: frack113
date: 2021-12-13
modified: 2022-12-25
tags:
- attack.discovery
- attack.t1217
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ChildItem'
    - ' -Recurse '
    - ' -Path '
    - ' -Filter Bookmarks'
    - ' -ErrorAction SilentlyContinue'
    - ' -Force'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell command `Get-ChildItem` to recursively search for browser bookmarks on Windows systems. Adversaries may exploit this command to gather valuable information about users and their online behaviors, including accessing sensitive sites related to banking, social media, and company-specific tools. Through this enumeration, attackers aim to enhance their reconnaissance, which may lead to targeted phishing attacks or the exploitation of internal resources based on the discovered bookmarks.

  The pertinent MITRE ATT&CK tactics include **Discovery** (TA0007), specifically technique **T1217: Browser Bookmark Enumeration**. By leveraging this process, attackers can collect information on potentially sensitive users or systems to craft more informed and targeted attacks.

  Primary data sources for this detection include PowerShell script block logs, which may capture the execution of this enumeration command. Ensuring that script block logging is enabled is crucial to effectively monitor and analyze such activities.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for the execution of `Get-ChildItem` commands, specifically looking for parameters indicating an attempt to access bookmarks.
  - **Analyze User Activities:** Identify the user accounts associated with the PowerShell executions to check for any unusual behavioral patterns or connections to sensitive resources that align with the bookmarks accessed.
  - **Inspect Browser Activity:** Cross-reference the collected bookmark information with user web activity logs to identify inconsistencies or access to suspicious or unexpected sites.
  - **Check for Additional Reconnaissance:** Look for other indicators of enumeration or data collection attempts on the network, such as lateral movement or credential harvesting frequencies that might accompany the bookmark enumeration activity.

  ### Prioritization
  Given the potential for sensitive information exposure through the enumeration of browser bookmarks, this alert warrants a medium priority in an enterprise environment. The impact of such a discovery can lead to targeted social engineering and accelerated attacks against the organization.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that PowerShell script block logging is enabled and configured correctly on all pertinent endpoints. A potential gap in detection coverage exists if exploring non-PowerShell methods for gathering bookmark data, such as third-party applications or scans. Additionally, false positives may arise from legitimate administrative activities involving bookmark management, particularly in environments where such tasks are performed regularly. It's essential to validate the context of the alert alongside user behavior to filter out these benign cases effectively.

