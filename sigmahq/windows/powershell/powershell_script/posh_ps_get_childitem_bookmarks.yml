title: Automated Collection Bookmarks Using Get-ChildItem PowerShell
id: e0565f5d-d420-4e02-8a68-ac00d864f9cf
status: test
description: |
  Adversaries may enumerate browser bookmarks to learn more about compromised hosts.
  Browser bookmarks may reveal personal information about users (ex: banking sites, interests, social media, etc.) as well as details about
  internal network resources such as servers, tools/dashboards, or other related infrastructure.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1217/T1217.md
author: frack113
date: 2021-12-13
modified: 2022-12-25
tags:
- attack.discovery
- attack.t1217
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-ChildItem'
    - ' -Recurse '
    - ' -Path '
    - ' -Filter Bookmarks'
    - ' -ErrorAction SilentlyContinue'
    - ' -Force'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Get-ChildItem` command, specifically targeting the enumeration of browser bookmarks on Windows systems. This behavior could indicate an attacker's intent to learn about user habits or internal resources, such as servers or applications. The relevant MITRE ATT&CK tactic is "Discovery," with the technique identified as "File and Directory Discovery" (T1217).

  The primary telemetry is derived from Windows PowerShell script block logs, which require Script Block Logging to be enabled to capture the details of commands executed. If malicious, this behavior poses a security risk by potentially exposing sensitive user information or internal infrastructure details. However, it’s important to note that this detection does NOT confirm compromise on its own; legitimate administrative scripts may also invoke similar commands for benign purposes.

  ---

  ### Investigation Steps

  - **Check PowerShell Execution Logs:** Review PowerShell script block logs (Event ID 4103) for the presence of `Get-ChildItem` commands containing `-Filter Bookmarks`. Look for other parameters that indicate potentially malicious intent, such as `-Recurse` combined with `-Force`.

  - **Correlate User Behavior:** Validate user activity accompanying the execution of this command. Legitimate usage may occur during administrative tasks or user maintenance. Compare timestamps of the execution with user login sessions and recent user activities.

  - **Analyze Process Creation Events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for PowerShell process command lines that match the pattern described. High-confidence malicious indicators would include the unauthorized execution of scripts by non-administrative accounts.

  - **Identify Potential Data Exfiltration:** Look for signs of data being accessed or exported from browser directories just before or after the command was executed. Check for any unusual file modifications or creations in common browser bookmark locations.

  - **Evaluate System Context:** Assess the asset's role in the network (e.g., endpoint vs. server) and prioritize high-risk assets that typically hold sensitive information. High-risk assets showing this behavior warrant immediate attention.

  ---

  ### Prioritization

  This alert has a low severity rating within an enterprise context, as the ability to enumerate bookmarks may not pose an immediate threat on its own. However, the likelihood of misuse increases if combined with other suspicious behavior, especially on sensitive systems commonly associated with sensitive data.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by environments where Script Block Logging is not enabled, preventing visibility into PowerShell script execution. Legitimate administrative tasks might trigger this alert, and users may intentionally script bookmark enumeration for maintenance activities. To bolster detection, monitoring related behaviors like `Export-Bookmark` operations or abnormal powershell command usage can enhance coverage.

