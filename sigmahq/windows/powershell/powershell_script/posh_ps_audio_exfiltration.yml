title: Potential Data Exfiltration Via Audio File
id: e4f93c99-396f-47c8-bb0f-201b1fa69034
status: test
description: Detects potential exfiltration attempt via audio file using PowerShell
references:
- https://github.com/gtworek/PSBits/blob/e97cbbb173b31cbc4d37244d3412de0a114dacfb/NoDLP/bin2wav.ps1
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-16
tags:
- attack.exfiltration
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_main:
    ScriptBlockText|contains|all:
    - '[System.Math]::'
    - '[IO.FileMode]::'
    - 'BinaryWriter'
  selection_header_wav:
    ScriptBlockText|contains|all:
            # Byte chunks from the WAV header used in the example POC
            # You can extend this for different audio formats by adding different selections
    - '0x52'
    - '0x49'
    - '0x46'
    - '0x57'
    - '0x41'
    - '0x56'
    - '0x45'
    - '0xAC'
  condition: selection_main and 1 of selection_header_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential data exfiltration attempts through the use of audio file manipulation in PowerShell scripts. Specifically, it focuses on instances where a script is used to write data in a binary format to WAV files, a technique that could be exploited to covertly extract sensitive data from an environment. Attackers may deploy this method to avoid standard data loss prevention (DLP) controls, allowing them to stealthily gather and transfer confidential information.

  The likely attacker objectives include exfiltrating sensitive files or data while bypassing traditional security measures by embedding the data within audio files. The communication may often be staged for later retrieval or transferred through less monitored channels. This tactic can align with MITRE ATT&CK techniques such as **Data Exfiltration Over Command and Control Channel (T1041)** and **Exfiltration Over Alternative Protocol (T1048)**.

  Key telemetry sources for detecting this activity include **PowerShell script logs**, particularly focusing on Script Block Logging to capture the specific commands executed to write the audio files and any associated process creation events that could reveal the execution context.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script execution logs to identify any instances of the triggered rule, looking specifically for the patterns matching the script block text indicative of WAV file creation.
  - **Analyze Process Creation Logs**: Investigate relevant process creation events to see if PowerShell was executed in a suspicious manner, noting any parent processes that initiated this behavior or unusual execution paths.
  - **Inspect File System Activity**: Check the file system for newly created WAV files or other audio formats that may have been generated around the same time as the flagged PowerShell execution. Look for unusual file names or unusual locations.
  - **Correlate Network Activity**: If possible, analyze network traffic logs, looking for outgoing connections that may correspond with the timing of the audio file creation or any unusual data transfers that could indicate exfiltration activity.

  ### Prioritization
  The severity of this alert is medium since it indicates potentially malicious activity that could lead to significant data loss, but it also requires contextual verification due to the possibility of benign PowerShell usage for legitimate tasks.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on PowerShell script block logging; if this feature is not enabled or properly configured, alerts may not trigger, leading to missed detections. The detection logic assumes that audio manipulation is not part of normal operational behavior within the environment, which may not hold true if legitimate operations involve creating audio files. Proper logging for this alert to function effectively includes ensuring that `Script Block Logging` is enabled on Windows hosts.

