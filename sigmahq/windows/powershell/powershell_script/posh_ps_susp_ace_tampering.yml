title: Potential Persistence Via Security Descriptors - ScriptBlock
id: 2f77047c-e6e9-4c11-b088-a3de399524cd
status: test
description: Detects usage of certain functions and keywords that are used to manipulate
  security descriptors in order to potentially set a backdoor. As seen used in the
  DAMP project.
references:
- https://github.com/HarmJ0y/DAMP
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-05
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'win32_Trustee'
    - 'win32_Ace'
    - '.AccessMask'
    - '.AceType'
    - '.SetSecurityDescriptor'
    ScriptBlockText|contains:
    - '\Lsa\JD'
    - '\Lsa\Skew1'
    - '\Lsa\Data'
    - '\Lsa\GBG'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of specific PowerShell commands and functions related to manipulating security descriptors, which could indicate an attempt to establish persistence mechanisms on a Windows system. It is particularly focused on the manipulation of Active Directory objects using the `win32_Trustee` and `win32_Ace` classes, as well as the application of security descriptors. Attackers may leverage these techniques to enable unauthorized access or backdoor capabilities, allowing for further exploitation of the compromised environment.

  The threat scenario typically involves adversaries attempting to maintain access to a system by altering security settings that govern object permissions. By using functions like `.SetSecurityDescriptor`, attackers can modify the access control lists of sensitive objects, possibly enabling themselves or their tools to bypass existing security measures. This behavior aligns with several MITRE ATT&CK techniques, notably:
  - **T1543.003**: Create or Modify System Process: Windows Service
  - **T1075**: Pass the Hash
  - **T1203**: Exploitation for Client Execution

  The primary data sources for this detection include PowerShell script block logs, which must be enabled on the target systems to capture these events effectively. Monitoring these logs will help analysts identify abnormal script executions that might reflect malicious intent.

  ### Investigation Steps
  - **Collect PowerShell Logs**: Retrieve PowerShell script block logs from the affected systems to identify instances of suspicious command executions related to security descriptors. Ensure that logging is enabled for thorough analysis.
  - **Examine Event IDs**: Focus on Windows Event ID 4104, as it relates to script block logging. Analyze the context of scripts that contain the identified keywords and patterns indicating potential malicious activity.
  - **Review Access Control Changes**: Investigate any recent changes to security descriptors within Active Directory, looking for modifications made by unusual accounts or at odd hours that could correlate with the detected script activity.
  - **Monitor Related Processes**: Check for potentially malicious processes that may have spawned as a result of the executed PowerShell commands, ensuring that their behaviors and interactions conform to expected norms within the environment.

  ### Prioritization
  The alert is assigned a high severity level due to the potential impact on system integrity and security. Manipulating security descriptors can grant unauthorized access, making it critical to address any findings immediately.

  ### Blind Spots and Assumptions
  This detection rule assumes that Script Block Logging is enabled on all monitored systems; if it is not, the detection will be ineffective. There may be blind spots if the threat actor uses obfuscation or alternative methods of persistence that do not involve PowerShell or security descriptor manipulation. Additionally, without proper monitoring of changes to access control and permission modifications across Active Directory, there could be gaps in visibility regarding unauthorized activities.

