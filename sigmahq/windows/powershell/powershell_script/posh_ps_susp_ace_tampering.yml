title: Potential Persistence Via Security Descriptors - ScriptBlock
id: 2f77047c-e6e9-4c11-b088-a3de399524cd
status: test
description: Detects usage of certain functions and keywords that are used to 
  manipulate security descriptors in order to potentially set a backdoor. As 
  seen used in the DAMP project.
references:
- https://github.com/HarmJ0y/DAMP
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'win32_Trustee'
    - 'win32_Ace'
    - '.AccessMask'
    - '.AceType'
    - '.SetSecurityDescriptor'
    ScriptBlockText|contains:
    - '\Lsa\JD'
    - '\Lsa\Skew1'
    - '\Lsa\Data'
    - '\Lsa\GBG'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the manipulation of security descriptors through PowerShell scripts that utilize specific functions and keywords, particularly those associated with `win32_Trustee` and `win32_Ace`. The likely objective of an attacker is to create a backdoor or escalate privileges by changing access permissions on sensitive objects within the Windows environment. This behavior fits within the MITRE ATT&CK framework under the tactics of Persistence and Privilege Escalation, specifically techniques T1547.001 (Windows Services) and T1068 (Exploitation for Client Execution). Primary telemetry sources include PowerShell script block logs, with the required log types being Security event logs that capture detailed PowerShell execution events. If malicious, this activity poses a significant risk as it could allow unauthorized access to critical resources. However, this detection does not confirm that malicious activity occurred without further context; false positives can arise from legitimate administrative scripts.

  ### Investigation Steps

  - **Examine PowerShell script blocks:** Review PowerShell script block logging by checking Security Event ID 4104 for instances of the specific keywords ('win32_Trustee', 'win32_Ace', etc.) that triggered the alert. Look for unusual execution times or patterns indicative of scripted attacks.

  - **Identify high-confidence malicious indicators:** Look for script blocks that include direct manipulations of security descriptors and roles related to LSA (Local Security Authority) such as Lsa\JD or Lsa\Skew1. Validate these indicators against typical user or administrative activity.

  - **Investigate surrounding logs for context:** Correlate with Security Event ID 4688 (Process Creation) to check if the PowerShell execution is preceded, followed, or associated with any suspicious processes, particularly those running with elevated privileges.

  - **Recognize legitimate usage patterns:** Determine if the indicated PowerShell commands are part of standard operational procedures for system administration. If seen during scheduled maintenance windows with appropriate task execution context, they may be benign.

  - **Check for changes in security descriptors:** If there are log entries showing modifications to security descriptors, investigate using Event ID 4906 (DACL changed) to check if the changes correspond with the timing of the alert.

  ### Prioritization

  The severity of this alert is high, given that successful manipulation of security descriptors directly impacts the integrity of system access controls. The likelihood of this behavior being exploited by adversaries is significant, especially as these techniques are commonly used for establishing persistence after initial compromise.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as obfuscation of PowerShell scripts or use of binary alternatives that circumvent script block logging. Reliable detection relies on ensuring that PowerShell Script Block Logging is properly configured and monitored. Legitimate activities, such as authorized administrative tasks or configuration management, may inadvertently trigger this alert. A related detection that enhances coverage is monitoring for changes in user privileges or group memberships using Security Event ID 4728 (Member Added to a Security-Enabled Group).

