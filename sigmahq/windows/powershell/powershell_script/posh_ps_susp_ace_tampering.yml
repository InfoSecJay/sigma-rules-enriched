title: Potential Persistence Via Security Descriptors - ScriptBlock
id: 2f77047c-e6e9-4c11-b088-a3de399524cd
status: test
description: Detects usage of certain functions and keywords that are used to manipulate
  security descriptors in order to potentially set a backdoor. As seen used in the
  DAMP project.
references:
- https://github.com/HarmJ0y/DAMP
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-05
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'win32_Trustee'
    - 'win32_Ace'
    - '.AccessMask'
    - '.AceType'
    - '.SetSecurityDescriptor'
    ScriptBlockText|contains:
    - '\Lsa\JD'
    - '\Lsa\Skew1'
    - '\Lsa\Data'
    - '\Lsa\GBG'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the use of PowerShell commands that manipulate Windows security descriptors to potentially establish persistence mechanisms or backdoors. Attackers may exploit these functions, such as `SetSecurityDescriptor`, to gain unauthorized access or escalate privileges. Relevant MITRE ATT&CK tactics include Persistence (T1547) and Privilege Escalation (T1068), specifically through code that modifies security descriptors.

  The primary telemetry source required for this detection is PowerShell Script Block Logging, which captures details of the executed scripts (Event IDs associated with PowerShell activity). If malicious, the security impact may include unauthorized access to sensitive resources or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also utilize similar command patterns.

  ---

  ### Investigation Steps

  - **Check PowerShell script logs**: Review PowerShell logs for Event ID 4104 containing ScriptBlockText fields. Look specifically for entries with keywords like `win32_Trustee`, `win32_Ace`, and `SetSecurityDescriptor`.

  - **Correlate with user context**: Identify the user who executed the script. Compare against known administrative accounts and establish if their role justifies the usage of these commands in the specific context.

  - **Examine access control changes**: Look for any related changes to security descriptors in Security Event ID 4670 or security logs detailing modifications to permissions or owner settings to correlate with the alert.

  - **Identify benign usage patterns**: Investigate previous legitimate uses of similar commands by cross-referencing against established baselines of PowerShell activity and documented administrative workflows.

  - **Assess for high-risk indicators**: Any PowerShell script that contains `\Lsa\JD`, `\Lsa\Skew1`, or `\Lsa\GBG` should raise a higher concern. Validate the execution and the context around these indicators.

  - **Review related assets**: Evaluate if the target system is critical (e.g., domain controllers or sensitive file servers), as malicious use in these contexts would be more impactful.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for high-impact attacks that target critical systems, specifically through unauthorized alterations to security settings. Given the nature of the behavior detected, there's a strong likelihood of malicious use by adversaries aiming to establish persistence.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the need for PowerShell Script Block Logging to be enabled; if not, legitimate activity might be missed. Legitimate administrative activities could inadvertently trigger this alert, potentially leading to false positives. Companion detections involving analysis of changes to security groups or user account control would provide broader coverage and context for investigation.

