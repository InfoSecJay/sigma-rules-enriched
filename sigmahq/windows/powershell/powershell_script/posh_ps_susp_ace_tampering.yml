title: Potential Persistence Via Security Descriptors - ScriptBlock
id: 2f77047c-e6e9-4c11-b088-a3de399524cd
status: test
description: Detects usage of certain functions and keywords that are used to 
  manipulate security descriptors in order to potentially set a backdoor. As 
  seen used in the DAMP project.
references:
- https://github.com/HarmJ0y/DAMP
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-05
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'win32_Trustee'
    - 'win32_Ace'
    - '.AccessMask'
    - '.AceType'
    - '.SetSecurityDescriptor'
    ScriptBlockText|contains:
    - '\Lsa\JD'
    - '\Lsa\Skew1'
    - '\Lsa\Data'
    - '\Lsa\GBG'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the manipulation of security descriptors through PowerShell scripts, specifically targeting functions associated with the WIN32 security model. Attackers may use this technique to establish persistence by modifying access control lists (ACLs) on sensitive objects to grant unauthorized access or control. The relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003) and Privilege Escalation (TA0004), particularly focusing on the techniques for Manipulating Security Descriptors (T1068).

  Primary telemetry sources for this detection include Script Block Logging from PowerShell, which must be actively enabled to capture the relevant events. If exploited, the malicious manipulation of security descriptors can lead to unauthorized persistence mechanisms allowing attackers to maintain a foothold within the environment. It is crucial to recognize that this detection does NOT confirm malicious activity on its own; further investigation is necessary to ascertain intent.

  ### Investigation Steps

  - **Check Script Block Logging Configuration:**
    Verify if PowerShell Script Block Logging is enabled in the environment (Policy Path: `HKLM\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging`). If not enabled, this can lead to incomplete visibility.

  - **Review Script Blocks for Malicious Indicators:**
    Analyze PowerShell events (Event ID 4104) for script blocks containing keywords like `win32_Trustee`, `win32_Ace`, and `SetSecurityDescriptor`. Look for unusual execution patterns not typical for the asset.

  - **Identify Legitimate Administrative Activities:**
    Compare the script execution time with regular administrative tasks or scheduled maintenance windows. Legitimate changes typically involve only standard user or system accounts and specific security context protocols.

  - **Correlate with Parent Process:**
    Investigate the parent process (via Event ID 4688) responsible for invoking the PowerShell script, looking for unusual command lines or user accounts that are not part of normal operations.

  - **Examine Access Control Changes:**
    Look for specific changes to security descriptors in Event ID 4660 (Object Delete) or 4663 (Object Access) indicating manipulation of user permissions, which might correlate with the detected behavior.

  ### Prioritization

  Given the potential security impact of such persistence mechanisms, the alert is rated high severity. The likelihood of exploitation is significant, particularly as adversaries often utilize similar methods to maintain access and control over compromised systems. The behavior targeted by this rule is associated with advanced threat actors and is increasingly weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may miss attempts if Script Block Logging is not enabled or if attackers use obfuscation techniques. The effectiveness of this rule relies on capturing detailed PowerShell activity; insufficient logging may lead to gaps. Legitimate activities such as system administrators modifying ACLs can trigger this alert, emphasizing the need for context. Related detections could include monitoring for known persistence methods (e.g., registry modifications or scheduled tasks) to enhance overall coverage for suspicious behavior.

