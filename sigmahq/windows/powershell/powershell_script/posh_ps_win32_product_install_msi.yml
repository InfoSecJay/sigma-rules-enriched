note: |
  ### Technical Context

  This Sigma rule detects the execution of an MSI installer via PowerShell using the Windows Management Instrumentation (WMI) Win32_Product class. This behavior could indicate an adversary attempting to install malicious software while evading traditional security mechanisms. The likely attacker objective is to deploy malware on victim systems while obfuscating the origin of the installation. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0011) with the technique being “MSI Installer Abuse” (T1218.007).

  Primary telemetry sources include Windows PowerShell logs, specifically Script Block Logging, which must be enabled to capture the relevant execution context. The potential security impact of a successful attack includes system compromise, unauthorized software installation, and lateral movement within the environment. This detection does NOT confirm that the installation was malicious; it only indicates that a potentially suspicious installation process was initiated.

  ### Investigation Steps

  - **Review Script Block Logs:** Check PowerShell logs (Event ID 4104) to extract full details of the command executed, focusing on lines containing "Invoke-CimMethod" and "Win32_Product" to confirm the specifics of the MSI installation.

  - **Identify the MST or MSI file:** Validate against known malicious MSI files or installations. Look for the specific name and checksum of the MSI file referenced in the logs for correlation against threat intelligence databases.

  - **Analyze process creation events:** Search for the associated process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the same time as the PowerShell command. Confirm whether this execution follows legitimate administrator activity or appears suspicious.

  - **Check for legitimate installs:** Understand typical user or administrative workflows involving MSI installations. If this installation correlates with a scheduled update or an authorized IT task, it may be benign.

  - **Monitor for process integrity:** Use process monitoring tools or logs to observe parent-child relationships of the PowerShell instance. Legitimate installations often originate from established management applications, while unusual parent processes (e.g., cmd.exe or another PowerShell script) may indicate foul play.

  ### Prioritization

  This alert should be prioritized as medium severity. While it indicates a potential installation of software that could be malicious, it is essential to assess the context, as this method could also be exploited by legitimate administrative activities. Attackers commonly leverage this technique, so thorough investigation is warranted.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of obfuscated PowerShell scripts or disabling Script Block Logging to avoid detection altogether. Reliable detection hinges on the proper configuration of logging; if Script Block Logging is disabled, this behavior will go undetected. Legitimate activities such as software updates by trusted IT personnel may trigger this alert, complicating triage. A related detection to consider is monitoring modifications to installed software lists (e.g., through Windows Event ID 1033) to strengthen coverage against unauthorized software installations.

