note: |
  ### Technical Context

  This Sigma rule detects the execution of an MSI file using PowerShell's Win32_Product class via WMI. The behavior is indicative of an attempt to install software, which may serve an attacker’s objective of deploying unauthorized applications, or even malware, on a target system. This corresponds to the MITRE ATT&CK technique T1218.007 (Signed Binary Proxy Execution) under the tactic of Execution.

  The primary telemetry sources include Windows PowerShell logs, specifically focusing on Script Block Logging. The required log types are those associated with PowerShell events that can denote the execution of scripts including relevant fields capturing the ScriptBlockText. If malicious, this could lead to unauthorized software installation, potential persistence mechanisms, or exploitation of vulnerabilities. It is crucial to note that while this detection indicates the execution of WMI commands to install an MSI, it does NOT confirm whether the installed software is malicious without further context.

  ### Investigation Steps

  - **Review PowerShell command execution:** Examine PowerShell logs for Event ID 4104 to identify the full command context. Look for ScriptBlockText containing 'Invoke-CimMethod', '-ClassName', 'Win32_Product', and '.msi'. Benign activity may involve known system administrative actions or legitimate installation requests.

  - **Check installation logs:** Validate the existence of installation logs for MSI events via Event ID 1033 from the MSI Installer logs (located in the Event Viewer under Applications and Services Logs → Microsoft → Windows → Installer → Operational). Confirm whether the installation matches known software.

  - **Investigate process creation:** Use Sysmon logs (Event ID 1) to identify the parent process that triggered the PowerShell execution. Frequent instances from non-administrative contexts may indicate malicious activity, unlike expected administrative processes running such commands.

  - **Correlate with known threat indicators:** Look for indicators of compromise (IOCs) or user alerts in your threat intelligence feeds regarding the executed MSI. If a known malicious hash appears, escalate the investigation further.

  - **Assess asset criticality:** Consider the role of the affected host; if it is a domain controller or critical server, prioritize the investigation. Regularly monitor for unusual installations on vital infrastructure.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems from unauthorized software installations. The likelihood of abuse is moderate, as attackers commonly leverage PowerShell for stealthy execution of malicious payloads, making this behavior one that should be routinely monitored and analyzed.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement of having Script Block Logging enabled, which may not always be the case in all environments. Evasion techniques could involve obfuscation of the PowerShell command itself or the use of other installation methods that do not leverage WMI. Legitimate activities, such as standard software updates or installations performed by system administrators, could also trigger the alert. As a companion detection, monitoring for unusual activity in Windows Installer events can provide additional visibility and context around software installations that are flagged.

