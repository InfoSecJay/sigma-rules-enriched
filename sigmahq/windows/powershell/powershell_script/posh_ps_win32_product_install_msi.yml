note: |
  ### Technical Context

  This rule detects the execution of an MSI file through PowerShell using the WMI Win32_Product class. This behavior is often associated with software installation or modification, which may be leveraged by attackers to deploy malicious software or execute unwanted applications stealthily. The primary objective of an attacker executing this method could be to install persistent backdoors or other harmful software without direct user consent.

  This detection aligns with the MITRE ATT&CK tactic of "Execution" and specifically targets the technique T1218.007 - "PowerShell: WMI". The primary telemetry source for this rule is PowerShell script block logging, which must be enabled to capture the relevant events. If the behavior is confirmed malicious, it may lead to unauthorized software on sensitive systems. Importantly, this detection does not confirm that a legitimate MSI installation has occurred, as it could also be indicative of malicious activity.

  ### Investigation Steps

  - **Review PowerShell Execution Logs**: Check for events within PowerShell script block logs (Event ID 4104) for the presence of the following keywords: 'Invoke-CimMethod', '-ClassName', 'Win32_Product', and '-MethodName'. Logs containing this sequence suggest possible malicious activity.

  - **Identify MSI Execution Context**: Investigate the execution context for the PowerShell process by gathering associated Event ID 4688 entries. Look for user names and parent process IDs to determine if the context seems anomalous (e.g., unexpected system users executing MSI files).

  - **Determine Installation Source**: Cross-reference installation logs or changes observed in the system activity logs (Windows Installer logs such as Event ID 1033) to ascertain the source of the MSI file. Authorized systems should typically initiate such installations via managed software deployment systems.

  - **Look for High-Confidence Malicious Indicators**: Analyze for indicators like unusual command line arguments to PowerShell, or known bad hashes of MSI files traced back to malware repositories. Use tools like VirusTotal to compare against known malware signatures.

  - **Expected Legitimate Behavior**: Confirm expected behavior by observing legitimate MSI installations that usually involve user prompts or administrative service accounts rather than automated scripting or 'Invoke-CimMethod' calls.

  ### Prioritization

  This alert is of medium severity due to its potential impact, particularly on sensitive systems or high-value assets if malicious actors exploit it. The likelihood of abuse is concerning, as this method of installation is commonly used by attackers to deploy software without alerting the user.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited if script block logging is not enabled, as this logs useful details of PowerShell activity. Legitimate software installations initiated via standard administrative methods may trigger this alert, necessitating further context before concluding malicious intent. A companion detection that may strengthen coverage includes monitoring for unexpected processes initiated by the Windows Installer service (Event ID 1001) to correlate installations with user behavior.

