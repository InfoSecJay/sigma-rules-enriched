  ---

  ### Technical Context

  This Sigma rule detects the execution of an MSI file through PowerShell using the WMI Win32_Product class. Attackers may employ this technique to install software without the knowledge of system administrators, potentially leading to malicious software deployment or persistence mechanisms. The relevant MITRE ATT&CK tactic is "Defense Evasion," specifically technique T1218.007 (Signed Binary Proxy Execution).

  Primary telemetry sources for this detection include Windows PowerShell logs and WMI execution events. The security impact is significant if malicious software is installed, as it could lead to unauthorized access or data exfiltration. This detection does NOT confirm that the activity is inherently malicious; legitimate software installations may also use this method.

  ---

  ### Investigation Steps

  - **Check PowerShell Script Block logs**: Review logs from PowerShell (Event ID 4104) for the invocation of CIM methods against Win32_Product. Look for paths that are unusual or untrusted.

  - **Validate WMI activity**: Search for WMI logs (Event ID 5858) indicative of the Win32_Product class being accessed with MSI files. Compare the timestamps and context to scheduled software installations or updates.

  - **Identify the system role**: Determine if the affected system is a server or endpoint that typically does not perform direct installations. Unauthorized installations on critical systems may indicate malicious intent.

  - **Assess legitimate software behavior**: Document and compare known good behaviors for MSI installations triggered by authorized users or IT personnel. Verify if the source matches expected behavior.

  - **Correlate with other detections**: Look for other alerts on the same system or user concerning unusual download activity (e.g., Event ID 3305 for .msi downloads from web browsers), which may indicate an increased risk of compromise.

  - **Confirm high-confidence malicious indicators**: Identify any MSIs sourced from untrusted locations or executed by uncommon user accounts, especially if part of an uncommon PowerShell command structure.

  ---

  ### Prioritization

  The severity of this alert is medium because it may indicate an attempt to install unauthorized software that can lead to further compromises, particularly on high-value targets. The likelihood of malicious abuse is moderate, as this technique is known to be weaponized for silent software installations.

  ---

  ### Blind Spots and Assumptions

  The detection may miss cases where the PowerShell script logging is disabled or if attackers use obfuscation techniques to mask their commands. Reliable detection requires enabling Script Block Logging and possibly AMSI (Antimalware Scan Interface). Legitimate administrative tasks, such as system updates, may also trigger this alert. A companion detection to consider is monitoring for unusual network connections that occur after the execution of such commands.

