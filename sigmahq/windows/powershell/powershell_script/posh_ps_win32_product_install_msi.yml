title: PowerShell WMI Win32_Product Install MSI
id: 91109523-17f0-4248-a800-f81d9e7c081d
status: test
description: Detects the execution of an MSI file using PowerShell and the WMI Win32_Product
  class
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
author: frack113
date: 2022-04-24
tags:
- attack.defense-evasion
- attack.t1218.007
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Invoke-CimMethod '
    - '-ClassName '
    - 'Win32_Product '
    - '-MethodName '
    - '.msi'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of MSI files using PowerShell through the Windows Management Instrumentation (WMI) related to the `Win32_Product` class. This kind of behavior may signal potential misuse, as attackers often leverage PowerShell to bypass security controls or manage applications stealthily, particularly for the installation of unauthorized or malicious software. The use of `Win32_Product` for installing software can also trigger changes in the system, which can alter the state of applications on the target machine, potentially resulting in system compromise.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Execution** (T1218.007), particularly focused on misuse of legitimate tools like PowerShell to execute potentially harmful commands. This enables attackers to run programs or scripts in an environment while remaining under the radar of typical security measures. The primary data sources for detecting this activity are PowerShell script block logs, which capture detailed information about the commands executed, along with Windows event logs related to application installations.

  ### Investigation Steps
  - **Review PowerShell Logs**: Collect and analyze PowerShell script block logs to identify when commands corresponding to the `Win32_Product` class are executed. Look for any scripts that include `Invoke-CimMethod` and references to `.msi`.

  - **Cross-reference Event Logs**: Check Windows Security and Application logs for events related to the installation or execution of MSI files. Pay attention to timestamps and user accounts involved in the process.

  - **Analyze Installed Applications**: Investigate the list of installed applications using tools such as `Get-WmiObject Win32_Product` to determine if any unauthorized or unexpected software has been installed.

  - **Query Network Activity**: Examine network logs for outbound connections associated with the machine where the MSI installation was detected, to uncover any potential external communications with C2 servers or other suspicious activities.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential risk associated with unintended or malicious software installations. Given the possibility that an attacker may be attempting to establish footholds or manipulate the environment, prompt investigation is critical.

  ### Blind Spots and Assumptions
  This detection rule assumes that Script Block Logging is enabled, as it is vital for capturing detailed PowerShell execution history. A potential blind spot includes scenarios where malware uses other non-WMI methods for installation or where PowerShell logging capabilities may not cover all execution contexts. Additionally, without the appropriate event logs configured, this rule may miss critical activity that occurs outside the normal monitoring scope.

