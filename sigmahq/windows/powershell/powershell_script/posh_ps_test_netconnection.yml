title: Testing Usage of Uncommonly Used Port
id: adf876b3-f1f8-4aa9-a4e4-a64106feec06
status: test
description: |
  Adversaries may communicate using a protocol and port paring that are typically not associated.
  For example, HTTPS over port 8088(Citation: Symantec Elfin Mar 2019) or port 587(Citation: Fortinet Agent Tesla April 2018) as opposed to the traditional port 443.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1571/T1571.md#atomic-test-1---testing-usage-of-uncommonly-used-port-with-powershell
- https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection?view=windowsserver2022-ps
author: frack113
date: 2022-01-23
tags:
- attack.command-and-control
- attack.t1571
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Test-NetConnection
    - '-ComputerName '
    - '-port '
  filter:
    ScriptBlockText|contains:
    - ' 443 '
    - ' 80 '
  condition: selection and not filter
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of PowerShell commands that test connectivity to a specified host on a non-standard port, utilizing the `Test-NetConnection` cmdlet. The likely attacker objective is to establish command and control (C2) communications over ports that are not typically monitored, allowing for covert data exfiltration or malicious activities. This behavior is relevant to the MITRE ATT&CK technique "Application Layer Protocol" (T1571).

  The primary telemetry source is PowerShell script block logging, which must be enabled to capture the relevant commands and their parameters. If malicious, the impact includes potential unauthorized access, data exfiltration, and persistence mechanisms through anomalous network activities. It is important to note that this detection does NOT confirm malicious intent on its own, as the same PowerShell command can be used for legitimate administrative tasks.

  ### Investigation Steps

  - **Review the script block logs:** Check Windows Security Event ID 4104 for instances of `Test-NetConnection`, filtering on `ScriptBlockText` for the terms `'-ComputerName '` and `' -port '`. Correlate with typical network scripts used in your environment.

  - **Identify non-standard port usage:** Assess the `-port` parameter in the script block output to see if it corresponds to known benign ports for your organization. Ports such as 8088 or 587 may indicate potential malicious activity if these are not commonly used.

  - **Validate expected network communications:** Review recent `Test-NetConnection` instances for expected target hosts and ports. Legitimate administrative scripts likely test ports such as 443 or 80, which should not trigger the alert.

  - **Check for high-confidence malicious indicators:** Investigate any instances where `Test-NetConnection` targets an unknown or suspicious domain/IP address, especially on uncommon ports. Compare with known threat intelligence sources for malicious indicators.

  - **Evaluate system role and asset criticality:** Identify the asset's role (e.g., server, workstation) associated with the detected command execution. Malicious activity on critical assets warrants higher scrutiny.

  - **Investigate recent PowerShell execution:** Cross-reference Event ID 4688 from the Security logs for any recent PowerShell process creates. Look for unusual parent processes or arguments that may indicate a broader exploitation path.

  ### Prioritization

  This alert should be treated with medium priority. The severity is context-dependent, as the affected system's role can significantly impact potential damage. The likelihood of malicious abuse is moderate, given that specific ports are increasingly weaponized by adversaries to bypass standard security measures.

  ### Blind Spots and Assumptions

  Detection can be limited by the lack of PowerShell script block logging. Adversaries may employ alternate methodologies, such as compiled executables or other scripting languages, that do not generate similar telemetry. Legitimate activities, such as network monitoring or configuration scripts, may also trigger this alert. A companion detection would involve monitoring outbound connections from local scripts or applications to identify suspicious traffic patterns more effectively.

