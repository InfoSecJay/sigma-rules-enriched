title: Testing Usage of Uncommonly Used Port
id: adf876b3-f1f8-4aa9-a4e4-a64106feec06
status: test
description: |
  Adversaries may communicate using a protocol and port paring that are typically not associated.
  For example, HTTPS over port 8088(Citation: Symantec Elfin Mar 2019) or port 587(Citation: Fortinet Agent Tesla April 2018) as opposed to the traditional port 443.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1571/T1571.md#atomic-test-1---testing-usage-of-uncommonly-used-port-with-powershell
- https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection?view=windowsserver2022-ps
author: frack113
date: 2022-01-23
tags:
- attack.command-and-control
- attack.t1571
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Test-NetConnection
    - '-ComputerName '
    - '-port '
  filter:
    ScriptBlockText|contains:
    - ' 443 '
    - ' 80 '
  condition: selection and not filter
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of PowerShell's `Test-NetConnection` cmdlet to perform outbound network tests on port numbers that are atypical for their protocols, such as using HTTPS over a non-standard port (e.g., port 8088 or 587). Such behavior is often indicative of adversaries attempting to disguise command and control (C2) communications or evade detection by using uncommon parameters that may not be monitored as closely.

  Adversaries' goals in this scenario may include establishing covert channels for data exfiltration, maintaining persistence, or controlling compromised systems while avoiding detection. Relevant MITRE ATT&CK techniques that apply include **Command and Control over Non-standard Ports** (T1571), which highlights the use of atypical ports and protocols to evade conventional security measures.

  To effectively implement this detection, primary data sources include Windows PowerShell Script Block Logging, which must be enabled to capture the execution of these scripts, as well as any network monitoring tools capable of inspecting traffic on the specified ports.

  ### Investigation Steps
  - **Review Script Execution Logs**: Investigate PowerShell script block logs for instances of `Test-NetConnection` commands that target non-standard ports. Pay attention to the context of the executed scripts to determine their legitimacy.
  - **Analyze Outbound Traffic**: Examine firewall or network traffic logs for connections to unusual ports (like 8088 or 587). Look for outbound connections that align with the timestamps of the detected `Test-NetConnection` commands.
  - **Correlate with Historical Data**: Compare any noticed abnormal activity against historical baselines of network communications to identify deviations. Look specifically for traffic that correlates to similar port usage in past incidents.
  - **Check for Legitimate Use Cases**: Investigate whether the activities can be attributed to known administrative tasks or legitimate applications. Look for similar patterns in authorized administrative scripts to differentiate between benign and malicious activity.

  ### Prioritization
  The alert is considered medium severity because while the use of uncommonly used ports may be suspicious, it can also stem from legitimate administrative activities. Therefore, further investigation is essential to accurately assess the risk.

  ### Blind Spots and Assumptions
  This rule may miss activities that do not utilize PowerShell for testing connections or that use other legitimate tools to interact with non-standard ports. It assumes that Script Block Logging is enabled, which may not be the case in all environments, leading to potential gaps in detection. Additionally, the rule may produce false positives from legitimate administrative scripts utilizing similar cmdlets, necessitating contextual analysis for accurate interpretation.

