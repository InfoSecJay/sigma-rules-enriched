title: Testing Usage of Uncommonly Used Port
id: adf876b3-f1f8-4aa9-a4e4-a64106feec06
status: test
description: |
  Adversaries may communicate using a protocol and port paring that are typically not associated.
  For example, HTTPS over port 8088(Citation: Symantec Elfin Mar 2019) or port 587(Citation: Fortinet Agent Tesla April 2018) as opposed to the traditional port 443.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1571/T1571.md#atomic-test-1---testing-usage-of-uncommonly-used-port-with-powershell
- https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection?view=windowsserver2022-ps
author: frack113
date: 2022-01-23
tags:
- attack.command-and-control
- attack.t1571
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Test-NetConnection
    - '-ComputerName '
    - '-port '
  filter:
    ScriptBlockText|contains:
    - ' 443 '
    - ' 80 '
  condition: selection and not filter
falsepositives:
- Legitimate administrative script
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_test_netconnection/info.yml
note: |
  ### Technical Context

  This rule detects the usage of the PowerShell command `Test-NetConnection` targeting an uncommon port that is not typically associated with the protocol being tested. Attackers often exploit alternative ports to evade detection mechanisms looking for standard communication patterns. This behavior aligns with the MITRE ATT&CK framework, particularly under the tactic "Command and Control" (ID: T1571).

  The primary telemetry source involves PowerShell script block logging, specifically monitoring for script blocks that contain `Test-NetConnection` with arguments indicating non-standard ports. The security impact of this detection is significant; if malicious, it indicates potential command and control communications using unusual ports, which bypasses typical network defenses. Importantly, this detection does **not** confirm that the activity is malicious by itself, as legitimate administrative tasks may also use these commands.

  ### Investigation Steps

  - **Review the script block log**: Examine Windows Event ID 4104 for entries related to `Test-NetConnection` containing `-ComputerName` and `-port`. Check for the monitored scripts, ensuring these targets aren't internal, known resources.

  - **Analyze port usage**: Identify the port specified in the logs; prioritize investigation if it’s non-standard (e.g., not 80 or 443). Compare with organizational policies on port usage.

  - **Correlate with network logs**: Review firewall logs for outbound traffic on the identified port, focusing on unusual IP addresses that haven't been seen before or are outside of expected ranges.

  - **Identify legitimate uses**: Determine whether there were legitimate administrative actions or scripts scheduled around the time of alert generation. This may involve reviewing recent changes or maintenance tasks.

  - **Check for known malicious indicators**: Validate if the IP address queried during the `Test-NetConnection` command maps to known malicious hosts or C2 infrastructure using threat intelligence sources.

  - **Investigate high-impact hosts**: If the detection originated from critical infrastructure or sensitive servers, prioritize deeper analysis, including file system checks for unusual executables and changes.

  ### Prioritization

  The alert severity is medium as it involves potentially high-risk activity (communication over uncommon ports) which could indicate advanced adversary behavior. The impact is elevated on critical assets, increasing the likelihood of malicious abuse, though legitimate administrative tasks must also be considered.

  ### Blind Spots and Assumptions

  This detection may be evaded by adversaries using encrypted channels or employing legitimate administrative tools. Script block logging must be correctly configured and enabled for this detection to function effectively. Additionally, legitimate administrative activity might occasionally trigger this alert, such as network diagnostics. A related detection for DNS tunneling activity could further strengthen monitoring of command and control attempts.

