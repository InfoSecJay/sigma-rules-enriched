title: Security Software Discovery Via Powershell Script
id: 904e8e61-8edf-4350-b59c-b905fc8e810c
status: test
description: |
  Detects calls to "get-process" where the output is piped to a "where-object" filter to search for security solution processes.
  Adversaries may attempt to get a listing of security software, configurations, defensive tools, and sensors that are installed on a system or in a cloud environment. This may include things such as firewall rules and anti-virus
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md#atomic-test-2---security-software-discovery---powershell
author: frack113, Anish Bogati, Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-16
modified: 2023-10-24
tags:
- attack.discovery
- attack.t1518.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'get-process | \?'
    - 'get-process | where'
    - 'gps | \?'
    - 'gps | where'
  selection_field:
    ScriptBlockText|contains:
    - 'Company -like'
    - 'Description -like'
    - 'Name -like'
    - 'Path -like'
    - 'Product -like'
  selection_keywords:
    ScriptBlockText|contains:
            # Note: These strings are using wildcard assuming the search is using the "-like" operator.
            #       You can add specific variant with the actual process names to increase coverage
    - '\*avira\*'
    - '\*carbonblack\*'
    - '\*cylance\*'
    - '\*defender\*'
    - '\*kaspersky\*'
    - '\*malware\*'
    - '\*sentinel\*'
    - '\*symantec\*'
    - '\*virus\*'
  condition: all of selection_*
falsepositives:
- False positives might occur due to the nature of the ScriptBlock being 
  ingested as a big blob. Initial tuning is required.
- As the "selection_cmdlet" is common in scripts the matching engine might slow 
  down the search. Change into regex or a more accurate string to avoid heavy 
  resource consumption if experienced
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_get_process_security_software_discovery/info.yml
note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that leverage `get-process` with filters to identify security product processes on a host. Attackers may aim to gather insights on installed security solutions, including antivirus and endpoint detection tools, to inform later stages of their attack, such as evading detection or disabling defenses. This behavior aligns with the MITRE ATT&CK tactic of “Discovery” under the technique “System Information Discovery” (T1518.001).

  The primary telemetry sources for this detection are Windows PowerShell script logs, specifically leveraging Script Block Logging, which captures the content of scripts executed. If identified as malicious, this behavior could indicate reconnaissance before an attack or preparatory steps for exploitation. However, this detection alone does not confirm malicious intent; further investigation is necessary to establish context.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Security Event ID 4104 to identify the complete Script Block logs, focusing on any instances where `get-process` is called with filtering clauses such as `where-object`.

  - **Identify specific process outputs:** Look for filtered outputs that reference known security software (e.g., "Avira," "Kaspersky") in the Script Block Text fields; these indicators suggest malicious intent to probe defenses.

  - **Assess normal administrative patterns:** Legitimate administrative tasks may involve similar queries for performance monitoring; check for contextual indicators such as other PowerShell commands run by the same user around the same time.

  - **Correlate user context and timestamps:** Investigate the user who executed the command, ensuring it aligns with typical usage patterns—e.g., system admins performing maintenance rather than anomalous accounts behaving irregularly.

  - **Verify related logs for follow-up behavior:** Examine logs for subsequent events (Event IDs 4688 for process creation) triggered by the same user shortly after the PowerShell invocations to check for any suspicious activities or binaries being executed.

  - **Analyze the environment configuration:** Ensure Script Block Logging is enabled on all endpoints in your environment to maintain visibility into potentially suspicious PowerShell behavior. If not, this could result in partial detection coverage.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on security posture if a host's defenses are known to an attacker. While reconnaissance actions like these can indicate preparation for exploitation, they are not always conclusive evidence of a breach. Such behavior can be weaponized, particularly when leveraged in environments with weak security configurations.

  ### Blind Spots and Assumptions

  This detection may be evaded through obfuscation techniques, such as encoding commands or using other scripting methods. Additionally, if Script Block Logging is not enabled or configured properly, this rule would be rendered ineffective. Legitimate activities, like system admins executing checks on deployed security tools, can trigger this alert. Related detections, such as monitoring for suspicious process creation (Event ID 4688), can further enhance coverage and context for risky PowerShell activity.

