title: Security Software Discovery Via Powershell Script
id: 904e8e61-8edf-4350-b59c-b905fc8e810c
status: test
description: |
  Detects calls to "get-process" where the output is piped to a "where-object" filter to search for security solution processes.
  Adversaries may attempt to get a listing of security software, configurations, defensive tools, and sensors that are installed on a system or in a cloud environment. This may include things such as firewall rules and anti-virus
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md#atomic-test-2---security-software-discovery---powershell
author: frack113, Anish Bogati, Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-16
modified: 2023-10-24
tags:
- attack.discovery
- attack.t1518.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'get-process | \?'
    - 'get-process | where'
    - 'gps | \?'
    - 'gps | where'
  selection_field:
    ScriptBlockText|contains:
    - 'Company -like'
    - 'Description -like'
    - 'Name -like'
    - 'Path -like'
    - 'Product -like'
  selection_keywords:
    ScriptBlockText|contains:
            # Note: These strings are using wildcard assuming the search is using the "-like" operator.
            #       You can add specific variant with the actual process names to increase coverage
    - '\*avira\*'
    - '\*carbonblack\*'
    - '\*cylance\*'
    - '\*defender\*'
    - '\*kaspersky\*'
    - '\*malware\*'
    - '\*sentinel\*'
    - '\*symantec\*'
    - '\*virus\*'
  condition: all of selection_*
falsepositives:
- False positives might occur due to the nature of the ScriptBlock being ingested
  as a big blob. Initial tuning is required.
- As the "selection_cmdlet" is common in scripts the matching engine might slow down
  the search. Change into regex or a more accurate string to avoid heavy resource
  consumption if experienced
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential reconnaissance activity by monitoring for PowerShell scripts that utilize the `get-process` command, with the output being filtered to target security software processes. An attacker may employ such techniques to discover the security tools installed on a compromised system or cloud environment, allowing them to assess defensive postures before executing further malicious actions. This behavior is indicative of a typical reconnaissance phase, where attackers aim to gather intelligence on the environment to tailor their attacks effectively.

  The relevant MITRE ATT&CK tactics include **Discovery**, focusing on the technique of **Security Software Discovery (T1518.001)**. By gaining visibility into running security solutions, adversaries can make informed decisions on how to evade detection during their operations. The primary data sources for this detection are PowerShell script logs, which require the activation of Script Block Logging to capture and analyze the command executions properly.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine the PowerShell script block logs to find instances of `get-process` executed with filters targeting known security software (e.g., any process containing "antivirus", "malware", "sentinel", etc.).
  - **Correlate with Endpoint Activity**: Investigate the endpoint behavior during the time of detection. Look for associated activity around the time the suspicious PowerShell command executed, including process creation and network connections.
  - **Analyze PowerShell Script Use**: Focus on the context in which PowerShell was used. Determine whether scripts originate from untrusted sources or if they exhibit other malicious behavior indicative of attacker engagement.
  - **Examine Security Tools' Configurations**: Review the configurations and alerts of the security solutions potentially targeted to understand if their presence was flagged during the reconnaissance activity.

  ### Prioritization
  The alert's medium severity is warranted due to the potential for adversaries to disable or evade security controls following this reconnaissance phase. While not indicative of an active compromise, the discovery of security software can lead to escalating attacks if not addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to environments where Script Block Logging is not enabled; without these logs, the detection will be ineffective. Additionally, it assumes that PowerShell scripting usage is scrutinized in the environment, and typical operational usage does not collide with the command patterns observed. Proper logging configurations and alert settings need to be verified to ensure effective detection capabilities.

