title: Security Software Discovery Via Powershell Script
id: 904e8e61-8edf-4350-b59c-b905fc8e810c
status: test
description: |
  Detects calls to "get-process" where the output is piped to a "where-object" filter to search for security solution processes.
  Adversaries may attempt to get a listing of security software, configurations, defensive tools, and sensors that are installed on a system or in a cloud environment. This may include things such as firewall rules and anti-virus
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md#atomic-test-2---security-software-discovery---powershell
author: frack113, Anish Bogati, Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-16
modified: 2023-10-24
tags:
- attack.discovery
- attack.t1518.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'get-process | \?'
    - 'get-process | where'
    - 'gps | \?'
    - 'gps | where'
  selection_field:
    ScriptBlockText|contains:
    - 'Company -like'
    - 'Description -like'
    - 'Name -like'
    - 'Path -like'
    - 'Product -like'
  selection_keywords:
    ScriptBlockText|contains:
            # Note: These strings are using wildcard assuming the search is using the "-like" operator.
            #       You can add specific variant with the actual process names to increase coverage
    - '\*avira\*'
    - '\*carbonblack\*'
    - '\*cylance\*'
    - '\*defender\*'
    - '\*kaspersky\*'
    - '\*malware\*'
    - '\*sentinel\*'
    - '\*symantec\*'
    - '\*virus\*'
  condition: all of selection_*
falsepositives:
- False positives might occur due to the nature of the ScriptBlock being 
  ingested as a big blob. Initial tuning is required.
- As the "selection_cmdlet" is common in scripts the matching engine might slow 
  down the search. Change into regex or a more accurate string to avoid heavy 
  resource consumption if experienced
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to enumerate installed security software on a Windows system using PowerShell commands, specifically through the use of `get-process` piped into `where-object`. The likely objective of an attacker is to identify existing security measures such as antivirus solutions, configurations, and defensive tools in order to disable or avoid detection. This behavior aligns with the MITRE ATT&CK tactic of Discovery (ID: T1518.001 - Software Discovery).

  The primary telemetry sources involve Windows Script Block Logging, which captures detailed information about the PowerShell scripts being executed. Relevant log types include Script Block logs that record the contents of the executed commands, which can help analysts discern the intent behind the scripts. The security impact of this detection could be significant, as identifying security software can lead to effective evasion or disabling of critical security defenses. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative activities may also utilize similar commands.

  ### Investigation Steps

  - **Review the Script Block Logs:** Check for Security Event ID 4104 logs that capture the PowerShell script content. Look for the presence of phrases such as `get-process | where` followed by parameters that reference security software naming conventions.

  - **Identify Malicious Indicators:** Search for specific indicators in the logs, such as commands that include wildcards referring to known security solutions (e.g., `*symantec*`, `*malware*`). An appearance of these terms in a suspicious context is a strong indicator of reconnaissance activity.

  - **Assess Context of Execution:** Determine the context of the PowerShell execution by checking the parent process or user who executed it. Look for common administrative user accounts or automated tasks; suspicious executions may come from unusual contexts or non-privileged users.

  - **Analyze Legitimate Behavior:** Cross-reference the logs against known administrative monitoring scripts or standard processes used by IT staff. Legitimate usage often includes commands that list software for maintenance rather than discovery-focused queries.

  - **Check for Script Block Logging Configuration:** Ensure that Script Block Logging is properly configured across the enterprise environment (Audit log settings, enabling Group Policy for PowerShell). Misconfigurations could lead to insufficient detection.

  - **Cross-Reference with Other Logs:** Review related logs from security solutions that may highlight corresponding activity such as detection of script executions or alerts from endpoint protection systems (e.g., EDR logs) that could indicate a response to the script's action.

  ### Prioritization

  The alert is of medium severity as it may indicate an attacker exploring the environment to disable security measures. Given that reconnaissance is a precursor to further malicious activity, timely investigation is critical. Such behavior is weaponized frequently in targeted attacks aiming to manipulate defense mechanisms.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques, such as obfuscation of PowerShell commands or use of alternative methods for discovery that may not get captured. Reliable detection depends on having Script Block Logging enabled across all endpoints. Legally sanctioned administrative actions, such as standard checks for installed software, may inadvertently trigger this alert. Related detections include monitoring for script execution patterns (e.g., high-frequency script execution or use of commands related to service management, which can provide additional context to potential malicious behavior.

