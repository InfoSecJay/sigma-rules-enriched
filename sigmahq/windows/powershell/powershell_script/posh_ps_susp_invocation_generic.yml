logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_encoded:
    ScriptBlockText|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -ec '
  selection_hidden:
    ScriptBlockText|contains:
    - ' -w hidden '
    - ' -window hidden '
    - ' -windowstyle hidden '
    - ' -w 1 '
  selection_noninteractive:
    ScriptBlockText|contains:
    - ' -noni '
    - ' -noninteractive '
  condition: all of selection*
falsepositives:
- Very special / sneaky PowerShell scripts
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell invocations characterized by the use of specific command-line parameters commonly associated with obfuscation or attempts to evade detection. By targeting arguments such as `-enc`, `-EncodedCommand`, and various parameters aimed at hiding the PowerShell window, the rule aims to highlight potentially malicious use of PowerShell that could indicate an attacker attempting to execute scripts or commands stealthily.

  The threat scenario revolves around a malicious actor leveraging PowerShell for execution of arbitrary code, which may be part of a broader tactic for lateral movement, data exfiltration, or system compromise. Attackers often utilize PowerShell's powerful capabilities to execute payloads directly in memory without leaving significant traces, making detection critical.

  Relevant MITRE ATT&CK techniques that apply include:
  - **Execution**: Techniques pertaining to running code and executing scripts (T1059.001 - PowerShell).

  Primary data sources that could contain the best evidence include:
  - PowerShell script block logging
  - Process creation events related to PowerShell
  - Windows event logs, particularly those capturing script activity and execution context.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell script block logs for the specific command parameters indicated in the detection, e.g., `-enc` and `-w hidden`. Assess the source of the invocation to understand the context of execution.

  - **Analyze Process Creation Events**: Investigate relevant process creation logs to identify instances where PowerShell was executed with suspicious parameters. Look for parent-child relationships that may indicate how the command was initiated.

  - **Evaluate System Behavior**: Monitor for any subsequent behavior that aligns with lateral movement or data exfiltration, specifically examining network traffic for unusual external communications within the timeframe of the suspicious execution.

  - **Correlate with Threat Intelligence**: Compare findings against known threat intelligence to determine if the detected behavior aligns with known attack patterns or specific threat actor signatures.

  ### Prioritization
  The alert carries a high severity due to the potential impact of a successful execution of malicious PowerShell commands, which can lead to significant data breaches or system compromises. Given the likelihood of PowerShell's use in real-world attacks, timely attention to this alert is critical for effective incident response.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage due to the need for Script Block Logging being explicitly enabled for PowerShell, which may not be the case in all environments. Additionally, this detection logic assumes that malicious actors will use the specific parameters identified for obfuscation; therefore, it may not capture all nefarious PowerShell activity. Required logs must include comprehensive PowerShell execution tracking, alongside properly configured Windows event logging to ensure the alert functions as intended.

