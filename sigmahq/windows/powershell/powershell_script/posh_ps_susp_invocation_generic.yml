logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_encoded:
    ScriptBlockText|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -ec '
  selection_hidden:
    ScriptBlockText|contains:
    - ' -w hidden '
    - ' -window hidden '
    - ' -windowstyle hidden '
    - ' -w 1 '
  selection_noninteractive:
    ScriptBlockText|contains:
    - ' -noni '
    - ' -noninteractive '
  condition: all of selection*
falsepositives:
- Very special / sneaky PowerShell scripts
level: high
note: |
  ### Technical Context

  This rule detects potentially malicious PowerShell invocations based on the presence of encoded commands or flags suggesting non-interactive or hidden execution. The likely attacker objective is to execute malicious scripts or payloads without drawing attention, utilizing PowerShell’s capabilities to evade detection. The relevant MITRE ATT&CK tactic is "Execution" with technique T1059.001 (PowerShell). Primary telemetry sources included in the detection are Windows PowerShell logs with Script Block Logging enabled, focusing on Event ID 4104. If malicious, this behavior could lead to system compromise or data exfiltration. However, this detection does NOT confirm that the activity is malicious on its own; it should be evaluated in the context of other indicators.

  ### Investigation Steps

  - **Review PowerShell logs for encoded commands:** Check Event ID 4104 for entries containing '-enc', '-EncodedCommand', or '-ec'. Malicious indicators include unexpected base64-encoded scripts, particularly from non-standard user accounts.

  - **Identify execution context:** Look for the `UserID` and `Computer` fields in logs corresponding to the suspicious script. Signs of compromise include unusual user accounts executing scripts on critical servers.

  - **Examine command parameters for hidden execution:** Filter Event ID 4104 logs for flags like '-w hidden', '-window hidden', or '-noni'. Legitimate usage often involves clear, explicit window handling or interactive modes, unlike obscured flags.

  - **Correlate with antivirus/EDR alerts:** Cross-reference with any endpoint detection alerts around the same timestamp to establish if any known malicious indicators or suspicious behaviors were reported.

  - **Validate expected legitimate behavior:** Check for properly signed and justified PowerShell scripts run by trusted users as part of scheduled tasks or administrative activities. Legitimate scripts will typically include recognizable parameters and documentation.

  - **Investigate recent changes in PowerShell configuration:** Review system logs for any modifications to PowerShell security settings, such as changes to execution policies via Event ID 4103. Unauthorized changes can indicate an attempt to enable arbitrary script execution.

  ### Prioritization

  This alert carries a high severity due to the potential impact of a successful execution of a hidden or encoded PowerShell script. The likelihood of abuse is significant as encoded commands and hidden executions are commonly utilized techniques in advanced tactics by attackers to avoid detection. Additionally, PowerShell is a fundamental tool in many attacks, making this behavior particularly concerning.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate PowerShell scripts employing similar parameters, which may trigger false positives. Required configurations include enabling Script Block Logging to capture the relevant events thoroughly. Legitimate user activities like script automation or administrative maintenance can also trigger this alert, complicating triage efforts. A related detection to reinforce coverage could involve monitoring for anomalous PowerShell module loading, which could indicate obfuscation of legitimate script functions.

