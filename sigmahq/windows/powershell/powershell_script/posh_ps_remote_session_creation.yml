note: |
  ### Technical Context

  This Sigma rule detects the creation of PowerShell remote sessions via the `New-PSSession` command, which can indicate attempts at remote code execution or lateral movement within a network. The likely objective of attackers utilizing this command is to establish a foothold on additional systems or execute malicious scripts remotely. This behavior aligns with the MITRE ATT&CK technique "PowerShell" (T1059.001) under the Execution tactic.

  Primary telemetry sources include PowerShell Script Block Logging, specifically looking for the `New-PSSession` command, which is included in Windows Event logs when script block logging is enabled. If malicious, the use of PowerShell in this context could lead to increased privileges, data exfiltration, or further compromise of the network. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may trigger the same command.

  ### Investigation Steps

  - **Identify the source of the session: ** Check the user account and hostname executing the `New-PSSession` command in Windows Event Log (Event ID 4104) relevant to PowerShell scripts. Confirm if the account has legitimate administrative access or if it shows signs of compromise.

  - **Review script block logging details: ** Look for the full command text in the PowerShell log entries (ScriptBlockText field) to understand the context in which `New-PSSession` was executed. Malicious indicators include unusual targets or arguments that deviate from standard operating procedures.

  - **Correlate with network behavior: ** Analyze network logs for outbound connections initiated from the host where `New-PSSession` was executed. Check for anomalous external IP communication or unexpected service requests that may indicate malicious activity.

  - **Validate legitimate activity: ** Determine if the command execution aligns with known administrative tasks for the affected asset. Compare against documented maintenance schedules or authorized access logs to see if the behavior fits typical patterns.

  - **Check for follow-up commands: ** Monitor for subsequent commands executed in the same session. Actions like `Invoke-Expression` or `Invoke-Command` may indicate further exploitation attempts coming from the PSCustomObject.

  ### Prioritization

  This alert should be treated with moderate to high severity. The system's impact may be substantial if it involves critical assets or administrative accounts. The likelihood of malicious abuse is significant since PowerShell is a favored tool for adversaries due to its availability and versatility in malicious campaigns.

  ### Blind Spots and Assumptions

  Detection limitations exist as script block logging must be enabled; otherwise, the command usage will not be captured. Attackers may also utilize encoded commands or other evasion techniques to obfuscate their actions, making detection more challenging. Valid legitimate administrative actions can also trigger this alert, such as routine system configurations or remote management tasks, often done via established processes. Companion detections involving alerting on `Invoke-Expression` (T1059.001) usage alongside PowerShell session creation can enhance overall coverage and context.

