note: |
  ### Technical Context

  This Sigma rule detects the creation of a new PowerShell remote session on a Windows system, indicated by the presence of the `New-PSSession` command containing the `-ComputerName` parameter. Attackers may utilize this functionality to establish access to remote machines for executing unauthorized commands or transferring malicious payloads. This behavior aligns with the Execution tactic under MITRE ATT&CK (T1059.001 - PowerShell).

  The primary telemetry source is Windows PowerShell's script block logging, which must be enabled to capture these events. If this action is executed maliciously, it could result in unauthorized access to sensitive systems, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm intent; legitimate administrative tasks may trigger similar logs without malicious activity.

  ### Investigation Steps

  - **Verify Script Block Logging settings:** Check Windows Group Policy settings to confirm if Script Block Logging is enabled (Required for `Event ID 4104` capture). If not enabled, review PowerShell execution policy settings.

  - **Review PowerShell logs for remote session commands:** Correlate `Event ID 4104` entries from PowerShell logs focusing on instances of `New-PSSession` being executed, particularly with remote target systems specified by `-ComputerName`. Look for unusual target systems or common use outside of expected administrative tasks.

  - **Identify expected use cases:** Compare the observed command patterns against known administrative tasks. Legitimate PowerShell activities might include maintenance scripts targeting specific systems, including those with `-ComputerName` as an argument.

  - **Assess associated processes:** Identify any child processes that spawned from the PowerShell instance linked to `New-PSSession` (using Sysmon `Event ID 1`), noting any suspicious program executions or payloads.

  - **Look for high-confidence indicators:** Identify if the remote session command initiates unexpected processes, connects to unauthorized external IP addresses, or performs actions like file downloads or remote execution not typical of administrative activities.

  - **Investigate network connections:** Review network logs for outbound connections initiated after `New-PSSession`, especially to unusual IP addresses or any known malicious domains, which would indicate a potential threat.

  ### Prioritization

  The alert is rated medium severity due to the potential impact on critical assets, as the affected system may serve vital organizational functions. While remote PowerShell sessions can be part of legitimate administrative practices, they are frequently exploited by attackers for lateral movement, warranting further investigation.

  ### Blind Spots and Assumptions

  Limitations exist if Script Block Logging is not enabled or if logging retention policies drop older logs, causing loss of context. Legitimate administrative tasks, such as IT support inventory or troubleshooting, can falsely trigger alerts for this behavior. A related detection could include anomalous outbound connections from Windows systems, enhancing monitoring of potential attack patterns.

