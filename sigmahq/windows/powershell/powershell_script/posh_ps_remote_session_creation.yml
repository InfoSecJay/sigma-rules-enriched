note: |
  ### Technical Context
  This detection rule monitors for the creation of remote PowerShell sessions via the `New-PSSession` command, which is used to establish connections to remote systems. Attackers may exploit this capability to execute commands on remote machines, thereby bypassing local security measures and facilitating lateral movement within the network. The primary concern is that malicious actors can utilize PowerShell as a tool for executing unauthorized actions, deploying malware, or exfiltrating data from compromised systems.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Execution** (T1059.001 - PowerShell) and potentially **Lateral Movement** as attackers may target other hosts in the environment using remote PowerShell sessions to execute malicious scripts or commands. Key data sources for effectively detecting this behavior include PowerShell Script Block Logging and Event Logs that capture the execution of PowerShell commands.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs**: Start by examining PowerShell Script Block Logs to identify any instances of the `New-PSSession` command and its associated parameters. Look specifically for `-ComputerName` usage, which indicates a remote session is being initiated.

  - **Analyze Event Logs**: Check Windows Event Logs (Event ID 4104) for inline scripts that may have invoked remote PowerShell sessions. Investigate events surrounding unexpected timeframes or unusual user accounts to assess legitimacy.

  - **Correlate with User Activity**: Cross-reference the identified remote sessions with user activities in your identity and access management system. Ensure that the sessions were initiated by authorized users and within expected operational context.

  - **Identify Network Connections**: Monitor network traffic to verify if there are unexplained connections to remote machines correlating with the PowerShell session creations. Suspicious outbound traffic patterns can indicate unauthorized exfiltration or communication with command-and-control servers.

  ### Prioritization
  This alert should be treated with medium priority due to the potential for remote exploitation, which can lead to significant security breaches if attackers manage to move laterally across the infrastructure. The likelihood of encountering such malicious activities, given the prevalence of PowerShell in administrative tasks, underscores the need for timely investigation.

  ### Blind Spots and Assumptions
  A gap in detection coverage could stem from environments where Script Block Logging is not enabled or configured correctly, as it is a prerequisite for capturing the relevant PowerShell activity. The detection logic also assumes that legitimate administrative usage of `New-PSSession` is adequately separated from malicious use, which may not always hold true in dynamic environments with frequent script usage. Therefore, it's essential to ensure that appropriate logging policies are enforced and that potentially noisy legitimate activities are accounted for in the alerting mechanism to minimize false positives.

