note: |
  ---

  ### Technical Context

  This rule detects the execution of specific PowerShell commandlets associated with the Nishang exploitation framework, such as backdoor creation and credential dumping techniques. The attacker's objective is likely to maintain persistence on a compromised system and extract sensitive data from the network. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is Command-Line Interface (T1059.001).

  The primary telemetry sources required for detection include Windows PowerShell script block logs (requires Script Block Logging enabled) and potentially Sysmon logs. The security impact of malicious use of these commandlets is significant, as they enable an attacker to create backdoors and exfiltrate sensitive information. Importantly, this detection does not confirm successful exploitation or data breach on its own; further investigation is warranted.

  ---

  ### Investigation Steps

  - **Identify the command execution context:** Review PowerShell logs for Event ID 4104 to locate scripts that contain the detected commandlets. Check for the presence of the Nishang commandlets listed, correlating them with the process that executed them.

  - **Correlate with other logs:** Cross-reference the identified script execution with Security Event ID 4688 to verify the initiating process and its parent process. Analyze if legitimate administrative actions triggered the command.

  - **Assess commandlet effects:** Look for changes to system configurations or unexpected network traffic. For example, monitor for local network connections using Event ID 5156 (Windows Filtering Platform) that might relate to beaconing or data exfiltration.

  - **Review legitimate administrative actions:** Assess the activity around the execution times, keeping an eye on common administrative tasks that may show similar patterns but involve different commandlets or arguments, confirming legitimate use.

  - **Identify high-confidence malicious indicators:** Search for abnormal outbound connections related to commandlets like `Do-Exfiltration-Dns` or `Download-Execute`, by checking DNS query logs for unusual lookups or network flows matching these commandlet activities.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on sensitive data protection and operational integrity. The use of Nishang commandlets is commonly associated with malicious activities, heightening the likelihood of abuse and necessitating immediate investigation to prevent potential exfiltration and persistence.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled; if not, these commandlets can execute silently. Legitimate activities such as system maintenance scripts or administrative tasks may trigger this alert due to overlapping command names. A complementary detection to consider is monitoring for abnormal user account behavior (MITRE ATT&CK: Persistence techniques), which could indicate additional signs of compromise.

