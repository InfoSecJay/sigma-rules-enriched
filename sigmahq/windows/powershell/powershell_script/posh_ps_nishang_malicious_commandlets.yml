note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious PowerShell commandlets associated with the Nishang exploitation framework, such as commands that enable unauthorized access or exfiltration of data. The likely attacker objective is to establish persistence, extract sensitive information, or conduct reconnaissance on the target environment. This activity relates to the MITRE ATT&CK tactic of Execution (TA0011) and the technique for PowerShell (T1059.001).

  The primary telemetry source is PowerShell script block logging from Windows event logs, specifically requiring Script Block Logging to be enabled. If these commands are successfully executed by a malicious actor, they could lead to significant security breaches, including data loss and unauthorized system access. However, this detection alone does not confirm whether the commands were executed with malicious intent, as they could also be used by legitimate administrators or security professionals for valid purposes.

  ### Investigation Steps

  - **Review Event Logs for Execution:** Check Windows Security Event ID 4104 for the script block output containing detected Nishang commandlets. Look for `ScriptBlockText` with the identified malicious commands. Note any contextual details around the command execution time and user.

  - **Cross-reference User Context:** Verify the user account associated with the PowerShell execution; legitimate administrative scripts may be run by IT personnel during maintenance. Look for users with elevated privileges or unusual behavioral patterns.

  - **Identify Command Parameters:** Examine the parameters passed to the detected Nishang commands for signs of malicious intent. Pay particular attention to commands like `Do-Exfiltration-Dns` and `Invoke-CredentialsPhish`, which are clear indicators of potential malicious actions.

  - **Check for Recent Changes**: Investigate recent changes to organization policies and configurations that would allow legitimate use of similar commands. Confirm there are no recent service disruptions or maintenance windows.

  - **Analyze Related Process Creation:** Look for correlated process creation events (e.g., Security Event ID 4688) initiated by PowerShell that launched immediately before or after the detected commands. Look for unusual parent-child relationships indicative of scripted attacks.

  ### Prioritization

  This alert should be treated as high severity given the nature of the affected system, typically a domain controller or sensitive endpoint. Malicious use of Nishang framework commands is frequently associated with advanced adversaries, making them a realistic threat. The likelihood of this behavior being weaponized in the wild is significant, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated or altered commandlets, as attackers often modify command names or behaviors to bypass detection. Requirements for reliable detection include ensuring Script Block Logging is consistently enabled across the environment. Legitimate administrative tools might occasionally trigger similar alerts, indicating potential for false positives. A companion detection could include monitoring for unusual PowerShell session openings (e.g., via `New-PSSession` or `Enter-PSSession`), which may indicate a broader attack pattern.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
