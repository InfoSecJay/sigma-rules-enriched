note: |
  ### Technical Context

  This rule detects the use of the PowerShell `Reflection.Assembly` class to dynamically load assemblies in memory, which is a technique commonly used by adversaries to execute malicious code without touching disk. The likely attacker objective is to evade detection by executing payloads that remain resident only in memory. This behavior fits under the MITRE ATT&CK technique "Reflective DLL Injection" (T1620).

  The primary telemetry source for this detection is Windows PowerShell script block logs, specifically those that capture commands containing `Reflection.Assembly::load`. If malicious, such execution could lead to significant security impacts, including unauthorized access, data exfiltration, or lateral movement. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate applications also utilize `Reflection.Assembly` for validating or loading assemblies.

  ### Investigation Steps

  - **Check PowerShell Script Block Logging:** Examine PowerShell script block logs (Event ID 4104) for script block text containing `[Reflection.Assembly]::load`. Look for unusual execution context like unexpected users or processes.

  - **Analyze Parent Process Information:** Cross-reference the event with the parent process information in the logs (Event ID 4688 for process creation events) to identify if the PowerShell instance was initiated by a trusted executable (e.g., explorer.exe) or potentially malicious software.

  - **Confirm User Context:** Validate whether the user executing the command is a legitimate administrator or has the necessary permissions for such actions. Unexpected user accounts or scheduled tasks using `Reflection.Assembly` may indicate malicious intent.

  - **Identify Expected Activity:** Legitimate activity might involve system maintenance scripts or application updates that use `Reflection.Assembly`. Verify if the executed command aligns with known service or application behavior for your environment.

  - **Search for Additional Malicious Indicators:** Look for other indicators of compromise in conjunction with this action, such as anomalous outbound network connections (Event ID 5156 for Windows Filtering Platform) or unusual registry changes (Event ID 4657) that may indicate further exploitation.

  ### Prioritization

  This alert has medium severity based on the potential impact of the affected systems, particularly if the execution occurs within high-value assets such as domain controllers or file servers. The likelihood of this behavior being exploited maliciously is significant, as reflective injection techniques are increasingly weaponized in modern attack campaigns.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate PowerShell scripts to trigger this alert, especially during software installations or updates. Reliable detection relies on having PowerShell script block logging enabled. Additionally, user behavior that might trigger these alerts includes administrative tasks performed in automated deployments. Consider companion detections focusing on abnormal PowerShell usage patterns (e.g., techniques involving `Invoke-Expression` or `Invoke-WebRequest` for holistic coverage).

