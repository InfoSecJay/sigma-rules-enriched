note: |
  ### Technical Context
  This detection rule identifies the use of the .NET `Reflection.Assembly` method to load assemblies dynamically in memory, which can be an indication of malicious PowerShell activity. Attackers often utilize in-memory execution techniques to execute code without writing to disk, thereby evading traditional security measures. Such tactics can facilitate various malicious activities, including running payloads stealthily or bypassing Application Control and Antivirus products.

  The likely attacker objectives in this scenario could include executing backdoors, conducting reconnaissance, or deploying ransomware. Techniques such as these are commonly associated with advanced threat actors who employ custom malware frameworks and PowerShell to manipulate system environments quietly.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion**: (TA0005)
  - **In-Memory Execution**: (T1620)

  The primary data sources for this detection are PowerShell Script Block Logging and event logs associated with Windows processes, which capture script execution activities including any dynamic assembly loading.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs**: Examine the script block logs to identify instances where `[Reflection.Assembly]::Load` is called. Focus on the context in which these calls are made and check for unusual parameters or patterns.

  - **Analyze Process Creation Events**: Assess process creation events surrounding the time of detected activity. Look for suspicious parent processes that may indicate execution from a compromised process or exploit.

  - **Check for Anomalous PowerShell Commands**: Investigate any accompanying PowerShell commands executed around the same timeframe that could offer more context to the assembly loading. Pay particular attention to commands that manipulate security settings or network connections.

  - **Correlate with Endpoint Detection and Response (EDR)**: Utilize EDR tools to see if any endpoint alerts correlate with the detected usage of `Reflection.Assembly`. This may include analysis for indicators of compromise or abnormal process behavior.

  ### Prioritization
  The alert is considered medium severity due to its association with in-memory execution techniques that are often employed by skilled attackers. While certain legitimate applications may utilize this functionality, the context and frequency of use can help in determining the threat level.

  ### Blind Spots and Assumptions
  This detection logic may not cover all potential legitimate instances of the use of `Reflection.Assembly`, leading to possible false positives in environments where this functionality is employed legitimately. The effectiveness of this rule relies on having PowerShell Script Block Logging enabled, and it assumes that administrators monitor and review unusual PowerShell activity regularly. Without comprehensive logging and security measures, these potentially malicious activities might remain undetected.

