title: Potential In-Memory Execution Using Reflection.Assembly
id: ddcd88cb-7f62-4ce5-86f9-1704190feb0a
status: test
description: Detects usage of "Reflection.Assembly" load functions to 
  dynamically load assemblies in memory
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=50
author: frack113
date: 2022-12-25
modified: 2026-10-19
tags:
- attack.stealth
- attack.t1620
logsource:
  product: windows
  category: ps_script
  definition: Script Block Logging must be enable
detection:
  selection:
    ScriptBlockText|contains: '[Reflection.Assembly]::load'
  filter_optional_sqlserver:
    Path|startswith:
    - 'C:\Program Files (x86)\Microsoft SQL Server\'
    - 'C:\Program Files\Microsoft SQL Server\'
    Path|endswith: '\Tools\PowerShell\Modules\SQLPS\SqlPsPostScript.ps1'
    ScriptBlockText|contains: 'SQLSERVER: { Set-Location'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate use of the library
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_dotnet_assembly_from_file/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of the `.NET Reflection` class, specifically the `Reflection.Assembly` load functions in PowerShell, which are often utilized by attackers to execute malicious code directly in memory. The likely objective of the attacker is to obfuscate their actions and avoid detection by traditional security measures that monitor for persistent file changes. This behavior correlates with the **MITRE ATT&CK technique: In-Memory Execution (T1620)**.

  The primary telemetry sources for this detection include Windows PowerShell Script Block Logging, which must be enabled for this detection to function correctly. If malicious, such behavior poses a significant risk as it can facilitate execution of malware without leaving traces on the disk. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also use the same methods for valid purposes.

  ### Investigation Steps

  - **Examine Script Block Logs**: Review PowerShell Script Block logs for Event ID 4103 containing entries with `ScriptBlockText` that includes `[Reflection.Assembly]::load`. Look for unusual or unexpected PowerShell usage patterns.

  - **Identify Active PowerShell Sessions**: Check for active PowerShell sessions (Event ID 4688) on the affected host to correlate the timing of the alert with user or system actions. Ensure known and valid user accounts initiated these sessions.

  - **Review Load Execution Context**: Inspect the context of execution (e.g., parent process) where the command occurred. Use Sysmon Event ID 1 to confirm if the parent process originates from a standard management tool, or if it is a suspicious or unknown process.

  - **Validate System Impact**: Determine if the affected system plays a critical role within the network (e.g., database or domain controller). Validate whether the execution was legitimate for maintenance or configuration changes.

  - **Look for High Confidence Indicators**: Search for known malicious patterns or behaviors that accompany the reflection assembly loading such as command and control (C2) beaconing, indicated through unusual outbound traffic or connections made by the process.

  ### Prioritization

  This alert should be treated with medium severity as it potentially indicates stealthy behavior that may lead to significant impacts, especially if it occurs within critical systems such as servers. The likelihood of malicious exploitation is moderate due to the common use of reflection in both legitimate and malicious scripts.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate use cases for Reflection.Assembly, especially within organizational scripts or tools. Reliable detection requires PowerShell Script Block Logging to be enabled and configured correctly. Legitimate administrative actions, particularly those involved in software deployment or updates, may inadvertently trigger this alert. A companion detection could be monitoring for unusual outbound network connections initiated by PowerShell processes, enhancing the overall security posture against potential misuse.

