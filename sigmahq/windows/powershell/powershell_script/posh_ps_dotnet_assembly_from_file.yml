note: |
  ### Technical Context

  This rule detects the use of PowerShell's `Reflection.Assembly` to dynamically load assemblies in memory, indicating potentially malicious in-memory execution techniques. Attackers may utilize this behavior to execute code without writing to disk, evading traditional file-based detection mechanisms. This activity maps to the MITRE ATT&CK technique T1620 (Reflective Code Load).

  The primary telemetry for detection is Script Block Logging in Windows PowerShell, which captures the contents of PowerShell scripts executed on the host. If malicious, this behavior poses a significant risk as it can allow an adversary to run arbitrary code stealthily. However, this detection does NOT confirm malicious intent on its own; legitimate use cases for `Reflection.Assembly` exist, particularly in administrative scripts or legitimate application functions.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Check Windows Event ID 4104 for PowerShell events that include the `[Reflection.Assembly]::load` call. Document the context of the invocation—especially the user account and script origin.

  - **Examine User Context:** Determine if the script was executed by a high-privileged account (e.g., Domain Admin). Assess whether the account had a legitimate reason to run this command at that time.

  - **Identify Execution Timing and Frequency:** Analyze the execution timestamps for patterns. Multiple executions of similar commands in a short span may indicate automated malicious activity.

  - **Check for Legitimate Uses:** Evaluate if known administrative scripts or applications are using `Reflection.Assembly`. Document these instances as potential benign activity to differentiate from malicious behavior.

  - **Detect High-Confidence Malicious Indicators:** Look for additional suspicious commands preceding or following the assembly load, such as those related to credential dumping or lateral movement (such as `Get-CimInstance` or `New-Object`).

  - **Validate Memory Artifacts:** If the system is compromised, check for unusual in-memory artifacts related to the assembly, such as running processes that do not correspond to any files on disk.

  ### Prioritization

  The alert should be prioritized as medium due to its capability to indicate stealthy execution on potentially high-impact systems. The likelihood of abuse is moderate since in-memory execution is commonly weaponized by adversaries looking to avoid detection. However, legitimate administrative use cases exist that must be assessed on a case-by-case basis.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as code obfuscation or execution without PowerShell. Required log sources must have Script Block Logging enabled for reliable detection. Legitimate activities like automated administrative scripts may trigger this alert. Companion detections that could enhance coverage include monitoring for changes in PowerShell execution policy or the use of Module logging (Event ID 4103), providing context on overall PowerShell use.

