  ### Technical Context

  This Sigma rule detects the use of `Reflection.Assembly` loading functions within PowerShell scripts, indicating potential in-memory execution of assemblies. The likely attacker objective is to execute malicious code without creating a physical file on disk, thus evading traditional signature-based detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1564) and the technique of In-Memory Execution (T1620). The primary telemetry source is Windows PowerShell logs, specifically with Script Block Logging enabled, capturing the contents of executed PowerShell scripts.

  If malicious, this behavior poses significant security risks since it allows attackers to execute arbitrary code without leaving traditional artifacts, enabling stealthy operations. However, it is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also utilize `Reflection.Assembly`.

  ---

  ### Investigation Steps

  - **Review Script Block Logs**: Check PowerShell logs for Event ID 4104 containing the string `[Reflection.Assembly]::load`. Assess the execution context to determine if it's associated with non-administrative tasks.

  - **Analyze PowerShell Command Context**: Verify the full command context from which the script block was executed, looking for unusual parent processes or command-line arguments indicative of suspicious behavior, such as unexpected software or misused normal tools.

  - **Assess Related Network Activity**: Inspect network logs for suspicious outbound connections made shortly before or after the execution event. Look for unusual URLs or IP addresses in firewall logs (e.g., ASA/SonicWall logs) that may correspond to command and control servers.

  - **Identify Known Good Behavior**: Confirm whether the executing PowerShell script was initiated by legitimate applications or users, especially during typical operational hours. Compare the execution against a baseline of legitimate use cases.

  - **Look for High-Confidence Malicious Indicators**: Check if `Reflection.Assembly` loading is followed by further obfuscation techniques, such as invoking encoded commands or using other suspicious PowerShell constructs.

  - **Validate Asset Criticality**: Assess the role of the impacted system, focusing on mission-critical servers or endpoints servicing sensitive data. Investigate whether similar behavior has a provenance for legitimate platform integrations or routine administrative commands.

  ---

  ### Prioritization

  This alert should be considered a medium severity due to the potential impact of in-memory execution on sensitive systems. Given that the technique is known to be weaponized by various threat actors for stealthy operations, it warrants thorough investigation. However, the likelihood of it being a true positive may vary based on the specific context of the environment.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for skilled adversaries to employ obfuscation or alternate coding techniques to bypass detection entirely. The effectiveness of this rule hinges on having PowerShell Script Block Logging properly configured, as lack of this may result in missing relevant log data. Legitimate activities, such as software deployment scripts or automation tasks within enterprise environments, may inadvertently trigger this alert. A related detection to consider includes monitoring for execution of PowerShell scripts that utilize the `Invoke-Expression` cmdlet, which could complement the coverage against obfuscated malicious scripts.

