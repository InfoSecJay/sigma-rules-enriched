note: |
  ### Technical Context

  This rule detects the usage of the .NET `Reflection.Assembly` class to dynamically load assemblies into memory, typically indicating an attempt to execute code without creating a physical file on disk. The likely objective of an attacker using this technique is to evade traditional file-based security controls and execute malicious payloads directly in the system's memory.

  The relevant MITRE ATT&CK tactic is "Defense Evasion," and the technique is "Process Injection (T1055)" and "Run Script (T1064)." The primary telemetry source is Windows PowerShell script block logging, specifically looking for entries that contain the string `[Reflection.Assembly]::load`. If this behavior is indeed malicious, it could facilitate stealthy installation of malware or exploitation of the host system for further attacks.

  It’s essential to note that this detection does NOT confirm malicious intent by itself; legitimate applications may also utilize this functionality for valid purposes.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs: Identify the specific event:** Examine PowerShell script block logs (Event ID 4104) for the detection of `[Reflection.Assembly]::load`. Look for relevant timestamps and correlating user accounts that executed the command.

  - **Review user context and process lineage:** Investigate the user context in which the command was executed. Determine if the event was associated with known administrative tasks or unusual activity for that user.

  - **Examine parent processes:** Analyze the parent process associated with the PowerShell execution. If the invocation originated from a process commonly abused by attackers (e.g., `powershell.exe` initiated by a less common program), this is a significant indicator of potential malicious behavior.

  - **Validate legitimate use cases:** Cross-check the execution against normal administrative deployment processes or software deployment scripts within your environment. If the invocation aligns with known organizational scripts, it may be benign.

  - **Correlate with known threats:** Utilize threat intelligence feeds to identify if the specific user account or IP address was involved in prior incidents related to PowerShell abuse or other suspicious activities.

  - **Check for in-memory artifacts:** Use tools to examine memory for unexpected loaded assemblies. Treat any instances of assemblies loaded without a corresponding physical file on disk with suspicion.

  ### Prioritization

  This alert should be treated as a medium-severity indication, particularly in environments where PowerShell is frequently used for automation. While the likelihood of malicious abuse is significant, the impact will depend on the context of the system, user roles, and the presence of other corroborating indicators.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques like obfuscation or use of less common reflective loading methods that do not trigger this alert. Sufficient logging needs to be enabled for reliable detection; ensure that PowerShell script block logging is active. Legitimate activities, such as internal application deployments or configurations that legitimately use `.NET` reflection, may also trigger the alert. A companion detection could include monitoring for `Invoke-Expression` (T1064) and other PowerShell script analysis methods.

