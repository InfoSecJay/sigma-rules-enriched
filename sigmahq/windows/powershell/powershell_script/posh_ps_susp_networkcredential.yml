title: Suspicious Connection to Remote Account
id: 1883444f-084b-419b-ac62-e0d0c5b3693f
status: test
description: |
  Adversaries with no prior knowledge of legitimate credentials within the system or environment may guess passwords to attempt access to accounts.
  Without knowledge of the password for an account, an adversary may opt to systematically guess the password using a repetitive or iterative mechanism
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1110.001/T1110.001.md#atomic-test-2---brute-force-credentials-of-single-active-directory-domain-user-via-ldap-against-domain-controller-ntlm-or-kerberos
author: frack113
date: 2021-12-27
tags:
- attack.credential-access
- attack.t1110.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'System.DirectoryServices.Protocols.LdapDirectoryIdentifier'
    - 'System.Net.NetworkCredential'
    - 'System.DirectoryServices.Protocols.LdapConnection'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule aims to identify potential brute-force credential access attempts against Active Directory accounts via script execution. Adversaries may exploit a lack of knowledge regarding legitimate user credentials by attempting to guess passwords systematically, using common programming libraries and protocols like LDAP to establish connections and authenticate. The rule specifically observes PowerShell scripts that utilize classes associated with LDAP connections, which can indicate attempts to brute-force user credentials.

  In such scenarios, the attacker may seek unauthorized access to user accounts, targeting sensitive information or further access to privileged resources within the environment. The relevant MITRE ATT&CK tactic is **Credential Access**, specifically technique **T1110.001 - Brute Force**.

  The primary data source that provides the most pertinent information for this detection includes **PowerShell script block logs**. Enabling these logs allows analysts to see what scripts are being executed, including commands that suggest credential guessing behaviors.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logging for entries that include `System.DirectoryServices.Protocols.LdapDirectoryIdentifier`, `System.Net.NetworkCredential`, or `System.DirectoryServices.Protocols.LdapConnection`. Analyze the context of these scripts for any brute-force indicators.

  - **Correlate with Login Events**: Investigate authentication attempt logs (e.g., Windows Security logs) for failed login attempts originating from the same host as the PowerShell execution to identify potential patterns of brute-forcing behavior.

  - **Check for Anomalies in Network Traffic**: Monitor network traffic logs for unusual or repetitive connection attempts to LDAP services. Look for spikes in connections originating from the same IP address or account.

  - **Analyze User Behavior**: Assess user activity around the time of the detected script execution. Investigate recent changes in user permissions or failed attempts to access resources that require elevated privileges.

  ### Prioritization
  This alert is categorized with a low severity level due to the absence of confirmed exploitation; however, it indicates a fundamental reconnaissance or credential enumeration activity that could escalate into more serious incidents if not addressed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding alternative scripting languages or tools (e.g., Python, C#) that could accomplish similar brute-forcing actions without being detected by PowerShell-specific rules. The detection logic assumes that Script Block Logging is enabled on monitored systems; if not, the rule may miss relevant events. It is also possible that legitimate administrative activities could generate false positives under certain circumstances. Required configurations and logging methods must be ensured for effective monitoring.

