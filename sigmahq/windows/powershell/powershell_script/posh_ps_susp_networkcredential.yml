title: Suspicious Connection to Remote Account
id: 1883444f-084b-419b-ac62-e0d0c5b3693f
status: test
description: |
  Adversaries with no prior knowledge of legitimate credentials within the system or environment may guess passwords to attempt access to accounts.
  Without knowledge of the password for an account, an adversary may opt to systematically guess the password using a repetitive or iterative mechanism
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1110.001/T1110.001.md#atomic-test-2---brute-force-credentials-of-single-active-directory-domain-user-via-ldap-against-domain-controller-ntlm-or-kerberos
author: frack113
date: 2021-12-27
tags:
- attack.credential-access
- attack.t1110.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'System.DirectoryServices.Protocols.LdapDirectoryIdentifier'
    - 'System.Net.NetworkCredential'
    - 'System.DirectoryServices.Protocols.LdapConnection'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects suspicious PowerShell scripts containing methods for LDAP connections, potentially indicating brute-force credential guessing by attackers. The likely objective of the adversary is to gain unauthorized access to accounts in an Active Directory environment through systematic password attempts. This behavior falls under the MITRE ATT&CK framework tactic of "Credential Access" (TA0006) and technique "Brute Force" (T1110.001). The primary telemetry sources required for this detection include PowerShell Script Block Logging, specifically looking for identifiers related to LDAP connections and credential handling. If the activity is malicious, it could lead to unauthorized access to sensitive accounts and data. However, it is important to note that this detection alone does not confirm that a credential compromise has occurred without investigating the success or failure rates of the connection attempts.

  ### Investigation Steps

  - **Review PowerShell logs for Script Block events**: Check for event IDs associated with PowerShell Script Block Logging (Event ID 4104) that capture the suspicious script execution containing "System.DirectoryServices.Protocols.LdapDirectoryIdentifier" or "System.Net.NetworkCredential."

  - **Assess the frequency of connection attempts**: Analyze the Script Block logs for the frequency of LDAP connection attempts. A high volume of repetitive attempts from the same source, particularly in a short time frame, may indicate malicious behavior.

  - **Identify expected legitimate use cases**: Determine if legitimate administrative scripts or user actions are using the detected PowerShell commands. Valid scenarios may involve service account authentications by known scripts executed during normal operational hours.

  - **Verify the source IP and user account**: Check network logs and correlate the initiating user account with known asset owners or legitimate users. Use logs from Windows Security Event ID 4624 (Logon) to cross-reference the source account.

  - **Check for authentication failures**: Review related logs (such as Event ID 4625 for failed logins) to confirm multiple authentication failures corresponding to the script execution time. These failures may support the theory of a brute-force attempt.

  - **Examine network traffic logs for anomalous LDAP queries**: Look into network logs (like Windows Firewall logs or other network security appliances) to find any unusual outbound LDAP connection requests related to the script execution, suggesting potential exfiltration or reconnaissance activities.

  ### Prioritization

  This alert should be prioritized as low severity, as it may indicate scripted LDAP connections that are part of legitimate administrative functions. However, given the potential for malicious brute-force attempts, awareness is necessary, especially in environments where account access is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the disabling of Script Block Logging, which is required for proper visibility into PowerShell activity. Additionally, legitimate administrative tasks may trigger this alert without malicious intent, creating potential false positives. It would be beneficial to complement this detection with monitoring for invalid login rates (e.g., Event ID 4625) to strengthen overall detection of brute-force attempts.

