logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
  - ScriptBlockText|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - ScriptBlockText|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - ScriptBlockText|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  condition: selection
falsepositives:
- Rare need to clear logs before doing something. Sometimes used by installers or
  cleaner scripts. The script should be investigated to determine if it's legitimate
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell cmdlets such as `Clear-EventLog` and `Clear-WinEvent`, which are often employed by attackers to erase traces of their activities from the Windows event logs. The primary threat scenario involves an attacker who has gained access to a system and seeks to evade detection by removing critical logs that could provide insights into their actions. By eliminating evidence, the attacker aims to maintain a foothold within the environment, exfiltrate data, or execute further malicious activities without being detected by security monitoring.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1070)**, specifically **T1070.001: Indicator Removal on Host**, as the act of clearing event logs is a common tactic used to obfuscate unauthorized actions. The primary data sources for detecting such behavior include PowerShell script block logging, which captures the commands executed in PowerShell, along with any associated arguments and context.

  ### Investigation Steps
  - **Review PowerShell Logs**: Collect and examine PowerShell logs for entries involving `Clear-EventLog`, `Remove-EventLog`, or `Clear-WinEvent`. Pay close attention to the context in which these cmdlets were executed and any preceding high-risk activity.
  - **Analyze Event Log Activity**: Check Windows event logs for any unusual patterns, such as abrupt log clearances followed by suspicious process creations or logins. Compare timestamps to correlate actions and identify potential malicious behavior.
  - **Identify User Context**: Determine which user account executed the commands and assess their privileges. Investigate whether the account is legitimate or has been compromised.
  - **Evaluate Script Block Logs**: Ensure script block logging is enabled and analyze the script blocks that led to the cmdlets' execution for anomalies or indicators of compromise. Check for arguments that may indicate a broader attack strategy.

  ### Prioritization
  This alert is considered **medium severity** due to the potential impact of an attacker erasing event logs, which significantly hampers forensic analysis and incident response efforts. The likelihood of achieving this objective makes it a concerning behavior in any enterprise environment.

  ### Blind Spots and Assumptions
  The detection coverage might be limited in environments where PowerShell script block logging is not enabled, preventing critical telemetry from being captured. The detection logic assumes that execution of the identified cmdlets is malicious, although there could be legitimate reasons for clearing logs (e.g., system maintenance or installation processes). Additionally, if artifacts from prior activities are not retained due to retention policies, it may hinder a thorough investigation.

