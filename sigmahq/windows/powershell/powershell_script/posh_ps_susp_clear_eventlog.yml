logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
  - ScriptBlockText|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - ScriptBlockText|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - ScriptBlockText|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  condition: selection
falsepositives:
- Rare need to clear logs before doing something. Sometimes used by installers 
  or cleaner scripts. The script should be investigated to determine if it's 
  legitimate
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell cmdlets such as `Clear-EventLog`, `Remove-EventLog`, `Limit-EventLog`, and `Clear-WinEvent`, which are commonly used by attackers to erase security event logs, thereby hiding their tracks after malicious actions. The likely attacker objective is to obfuscate malicious activity, making it more difficult for security teams to conduct forensic investigations. This behavior aligns with the MITRE ATT&CK framework tactic "Defense Evasion" and technique "Indicator Removal on Host" (T1070.001). The primary telemetry source consists of PowerShell script logs, specifically requiring that Script Block Logging is enabled. If this detection is confirmed malicious, it poses a significant security impact as it may indicate ongoing exploitation or data breaches. However, this detection does NOT confirm malicious intent by itself; legitimate administrative workflows may occasionally require log clearing.

  ### Investigation Steps

  - **Review PowerShell activity:** Check PowerShell command logs (Event ID 4104) for the presence of `Clear-EventLog`, `Remove-EventLog`, `Limit-EventLog`, or `Clear-WinEvent`. Compare timestamps against other known activity for correlation.

  - **Inspect Script Block Logging output:** Analyze the details of the command execution in the Script Block Logging (Event ID 4104) for context. Look for additional commands run immediately before or after, which may indicate contractor scripts used in a legitimate capacity.

  - **Determine asset role:** Identify if the affected system is a server or user workstation. Clearing event logs on critical servers (e.g., Domain Controllers) significantly raises the severity of concern.

  - **Validate against baseline behaviors:** Cross-reference with known benign activities, such as maintenance scripts run by SysAdmins that may legitimately employ these cmdlets. Legitimate commands typically have clear documentation and are executed under expected user accounts.

  - **Identify high-confidence malicious indicators:** Look for unusual user account activity or unexpected access to the system around the time of the PowerShell execution, e.g., lateral movement indicators or service account anomalies.

  - **Correlate with other detections:** Use additional activity logs (e.g., Windows Event logs for Event ID 4688 Process Creation) to seek correlating behaviors, such as unusual file creations or deletions shortly before or after the log clearing command.

  ### Prioritization

  This alert should be considered high severity in a mature enterprise context, particularly if the affected system is critical for core operations. The likelihood of malicious abuse is significant, as clearing event logs is a common step in attempts to cover an attacker's tracks. This behavior is often weaponized by adversaries looking to avoid detection during intrusions.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers utilizing less common log-clearing methods or executing from non-standard PowerShell environments. Reliable detection requires that Script Block Logging be enabled; if not, the detection strategy does not function as intended. Legitimate maintenance activities, such as automated clean-up scripts or authorized software installers, can occasionally trigger the alert. A related detection to consider includes monitoring for high-frequency log-in or log-off events (Event IDs 4624 and 4625), which can signal unauthorized access patterns often associated with log-clearing activity.

