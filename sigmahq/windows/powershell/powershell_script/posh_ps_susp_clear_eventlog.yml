logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
  - ScriptBlockText|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - ScriptBlockText|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - ScriptBlockText|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  condition: selection
falsepositives:
- Rare need to clear logs before doing something. Sometimes used by installers or
  cleaner scripts. The script should be investigated to determine if it's legitimate
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the invocation of PowerShell cmdlets, specifically `Clear-EventLog`, `Remove-EventLog`, `Limit-EventLog`, and `Clear-WinEvent`, which are utilized to clear Windows event logs. Such behavior is typically indicative of an attacker attempting to obfuscate their tracks by removing evidence of malicious activities, thereby hindering incident response efforts. This relates to the MITRE ATT&CK tactic of Defense Evasion (ID: T1070.001).

  The primary telemetry source for this detection is PowerShell script block logging, which should be enabled for effective monitoring. If malicious, this behavior could indicate significant security incidents, such as data exfiltration or privileged access exploitation. However, it is important to note that this detection does NOT confirm malicious intent or activity on its own, as there may be legitimate scenarios where logs are cleared, such as system maintenance or software installations.

  ---

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check PowerShell transcript logs (Event ID 4103) for the specific invocation of `Clear-EventLog` or related cmdlets. Confirm the user context running the command and whether it aligns with expected administrative actions.

  - **Validate Script Content:** Examine the complete script associated with the event (if applicable). Look for unusual patterns or arguments that deviate from standard operation, particularly if other suspicious commands are present.

  - **Assess System Activity Preceding Event:** Analyze the Windows Security Event ID 4688 logs for process creation events preceding the `Clear-EventLog` call. Look for known malicious processes or tools (e.g., Cobalt Strike, Metasploit).

  - **Identify Legitimate Use Cases:** Determine if there is a documented necessity for clearing the logs in the context of the system role. Common legitimate activities include routine maintenance tasks conducted by IT admins during off-hours.

  - **Confirm Administrative Privileges:** Ensure that the account used to clear the logs has the necessary permissions, typically a member of the 'Administrators' group. Investigate any anomalous permissions not consistent with the user’s role.

  - **Cross-reference with Other Logs:** Check for anomalies in Windows Application and System logs (Event IDs 7045, 6005) that may indicate a broader pattern of suspicious activity, including unusual service installations or logins from unfamiliar devices/IPs.

  ---

  ### Prioritization

  This alert is of medium severity due to its potential impact on auditing and forensic activities. The likelihood of malicious use is high, as attackers often attempt to clear logs after conducting illicit actions to evade detection. While such behavior is sometimes associated with legitimate system administration, it is crucial to investigate in the context of broader security events.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential obfuscation via legitimate scripts that use these cmdlets without malicious intent. It relies on PowerShell script block logging being enabled; if not, this detection will not function effectively. Legitimate activities that may trigger this alert can include legitimate administrative scripts or system maintenance actions that include log clearance. A related detection that strengthens coverage could be monitoring for unusual logons or user account behaviors (e.g., Event ID 4624) that coincide with clearing the logs, thereby adding context to the actions taken.

