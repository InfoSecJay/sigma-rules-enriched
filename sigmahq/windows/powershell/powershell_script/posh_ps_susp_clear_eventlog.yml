logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
  - ScriptBlockText|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - ScriptBlockText|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - ScriptBlockText|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  condition: selection
falsepositives:
- Rare need to clear logs before doing something. Sometimes used by installers 
  or cleaner scripts. The script should be investigated to determine if it's 
  legitimate
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell cmdlets that are commonly used to clear Windows event logs, such as `Clear-EventLog`, `Remove-EventLog`, and `Clear-WinEvent`. The likely attacker objective is to eliminate traces of malicious activity by erasing event logs, thereby hindering forensic investigation and detection capabilities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, particularly under the technique T1070.001 (Indicator Removal on Host: Clear Windows Event Log).

  The primary telemetry sources include PowerShell logs with Event ID 4104 (where script blocks are logged), necessitating that script block logging is enabled to capture these events. If malicious, the impact includes diminished visibility into system activity, potentially allowing an attacker to operate undetected longer. Importantly, this detection does NOT confirm that malicious activity is occurring on its own—it may also reflect legitimate administrative actions in specific contexts.

  ### Investigation Steps

  - **Review PowerShell logs for Event ID 4104:** Examine logs for the specific commands (`Clear-EventLog`, `Remove-EventLog`, `Clear-WinEvent`) being executed. Focus on the `ScriptBlockText` field for exact cmdlet usage.

  - **Identify legitimate administrative usage:** Consider business processes such as log maintenance or security software updates that might trigger these commands. Evaluate the context of execution, including user and system roles, to determine benign activity.

  - **Analyze timestamp and user context:** Check for anomalies in user behavior by correlating the execution time of the log-clearing commands with other events (e.g., increased login attempts, remote access logs). This could highlight suspicious patterns indicative of malicious intent.

  - **Investigate process lineage:** Use Sysmon logs (Event ID 4688) to trace the parent process of PowerShell operations that executed log clearing. Identify if any parent processes are associated with known malicious activity.

  - **Look for typical indicators of compromise:** Evaluate for additional evidence of malicious activities following the log-clearing commands, such as file changes (Windows Event ID 4663) or modifications to system settings immediately afterward.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on security visibility across critical systems. The likelihood of malicious abuse is moderate, as clearing event logs is a common tactic among attackers to obfuscate their actions. Although not all instances are malicious, frequent use can indicate an attempt to evade detection.

  ### Blind Spots and Assumptions

  Detection is limited because advanced adversaries might use alternative methods to clear logs or manipulate logging configurations to disable records. Reliable detection requires that script block logging is consistently enabled across all systems. Legitimate activities, such as log cleaning by application installers, may trigger this alert, emphasizing the need for contextual analysis. A related detection, such as monitoring for unusual process creation events (e.g., PowerShell spawning from non-standard applications), can provide complementary insights to strengthen coverage.

