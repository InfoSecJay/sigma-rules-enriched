  ---

  ### Technical Context

  This rule detects the invocation of specific COM objects in PowerShell scripts using the method `[Type]::GetTypeFromCLSID(…)`, which can be exploited by attackers to download files from the internet under potentially malicious intent. The likely attacker objective is to leverage these COM objects for command-and-control (C2) purposes, potentially downloading payloads or additional malware. This activity aligns with the MITRE ATT&CK technique T1105 - Remote File Copy.

  The primary telemetry sources are Windows PowerShell logs, specifically those reflecting Script Block Logging (must be enabled). If malicious, this behavior could lead to unauthorized file downloads, compromising system integrity. However, this detection does NOT confirm that malicious activity is occurring; legitimate applications may also use these COM objects without any harmful intent.

  ---

  ### Investigation Steps

  - **Review PowerShell Script Logs**: Check for ScriptBlockText containing `[Type]::GetTypeFromCLSID(`. Look for Event ID 4103 within the PowerShell logs to confirm the context of the script execution.

  - **Identify Known CLSIDs**: Cross-reference the log entries to check for use of the following CLSIDs: `0002DF01-0000-0000-C000-000000000046` or `F5078F35-C551-11D3-89B9-0000F81FE221`. Confirm presence in malicious context if found together with any suspicious networking behavior.

  - **Establish Baseline Activity**: Document and verify any legitimate software or processes that use the detected COM objects routinely in your environment. This could include standard applications like Microsoft Office or Internet Explorer.

  - **Check Network Activity**: Look for corresponding network connections or downloads using logs from your firewall or IDS. Specifically review connection attempts to known external IPs immediately following the script execution captured by Event ID 4104.

  - **Inspect User Context**: Review the user context under which the PowerShell script was run. Investigate if the user was a non-privileged standard user during the execution as opposed to an admin or service account, indicating potential misuse.

  - **Monitor File System Changes**: Validate any file creations or modifications in temp folders typically targeted by scripts, such as `C:\Users\<username>\AppData\Local\Temp`. Look for abnormal file types or unexpected filenames created by the involved PowerShell session.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential risk of file downloads that could lead to malware infections. However, such behaviors are sometimes part of legitimate system processes or applications, making further investigation necessary to establish the context and intent behind the detection.

  ---

  ### Blind Spots and Assumptions

  This detection could miss encoded or obfuscated PowerShell commands that do not directly invoke the specified CLSIDs. Additionally, some legitimate administrative scripts may trigger this alert without malicious intent. Ensure proper PowerShell logging configurations are in place to capture all relevant activities. A related detection to consider is the monitoring of outbound HTTP/S traffic, which could further indicate file download attempts following the script execution.

