  ---

  ### Technical Context

  This Sigma rule detects the use of COM objects in PowerShell scripts that may be exploited for file downloads through specified CLSIDs. The attacker’s likely objective is to establish command and control (C2) channels by leveraging these COM objects to download malicious payloads. Relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1105). The primary telemetry sources are PowerShell script block logs, particularly looking for Event ID 4104, which capture potentially malicious script execution. If successful, this behavior can lead to unauthorized data exfiltration and further network compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may utilize these COM objects.

  ---

  ### Investigation Steps

  - **Review script block logs:**
    Analyze PowerShell script block logs (Event ID 4104) for relevant entries including 'GetTypeFromCLSID'. Focus on logs from times of reported suspicious activity.

  - **Identify high-confidence malicious indicators:**
    Look for the execution of CLSIDs known for their file download capabilities, such as '0002DF01-0000-0000-C000-000000000046' or 'F5078F35-C551-11D3-89B9-0000F81FE221'.

  - **Check for context and intent:**
    Evaluate the parameters used in the script blocks for any unusual behavior or anomalies in the command-line arguments. Compare to legitimate usage patterns, which would typically involve system updates, file manipulations, or admin tasks.

  - **Assess recent PowerShell execution:**
    Cross-reference with Event ID 4103 (PowerShell command logs) to verify what commands were run prior to using COM objects. Identify if other suspicious commands precede or follow the identified activity.

  - **Correlate with network logs:**
    Inspect firewall or network proxy logs for outbound HTTP/S requests initiated by the host around the same timeframe. Malicious activity could show unusual access patterns or communications with known bad IPs.

  - **Examine host system roles:**
    Determine if the host executing the COM objects has an elevated role (e.g., server, admin) which could indicate higher risk and potential for impact if compromised versus typical user workstations.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for exploitation of trusted COM objects that could facilitate malicious downloads. The likelihood of abuse is moderate, especially in environments where users may have elevated privileges or where security is lax. This behavior is known to be weaponized in various reconnaissance and exfiltration attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false negatives in environments without PowerShell script block logging enabled, which is crucial for capturing these events. Legitimate activities such as updates or system maintenance could generate similar logs, complicating the investigation. A related detection that enhances coverage includes monitoring for unusual outbound connections initiated from PowerShell scripts, which can indicate broader malicious activity.

