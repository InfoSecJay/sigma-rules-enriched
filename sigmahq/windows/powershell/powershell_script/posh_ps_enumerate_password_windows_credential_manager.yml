title: Enumerate Credentials from Windows Credential Manager With PowerShell
id: 603c6630-5225-49c1-8047-26c964553e0e
status: test
description: |
  Adversaries may search for common password storage locations to obtain user credentials.
  Passwords are stored in several places on a system, depending on the operating system or application holding the credentials.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1555
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - vaultcmd
    - '/listcreds:'
  selection_option:
    ScriptBlockText|contains:
    - 'Windows Credentials'
    - 'Web Credentials'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts by adversaries to enumerate credentials stored in Windows Credential Manager using PowerShell Commands. Specifically, it targets the execution of commands that invoke functions like `vaultcmd /listcreds:` to access sensitive credential information. This behavior aligns with common tactics employed by attackers seeking to compromise user accounts by harvesting credentials, which can be leveraged for lateral movement or privilege escalation within a compromised network.

  The primary MITRE ATT&CK tactics relevant to this detection include **Credential Access** (TA0006), specifically the technique **Credential Dumping** (T1555). Understanding these tactics can help incident responders recognize the methods attackers may utilize to capture user credentials. The critical data sources for this detection rule will be PowerShell script block logs, which must be enabled to capture the relevant execution of the commands used to manipulate credential storage.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs to identify any occurrences of the `vaultcmd` command utilized with the `/listcreds:` option.
  - **Correlate User Activity:** Investigate the user accounts associated with the detected command execution to assess potential unauthorized access or unusual activities around the time of the alert.
  - **Assess for Privilege Escalation:** Determine if the execution is part of a larger pattern of credential access, looking specifically at any sequential login attempts or privilege escalation events linked to the credentials identified.
  - **Verify Logging Configuration:** Ensure that PowerShell logging is correctly configured to capture all necessary data, particularly the details outlined in the detection rule.

  ### Prioritization
  This alert is assessed as **medium severity** in an enterprise environment due to the potential for significant impact if user credentials are compromised. The ability to obtain valid credentials increases an attacker's likelihood of accessing sensitive systems or data.

  ### Blind Spots and Assumptions
  The detection logic relies on effective PowerShell script block logging, which may not be uniformly enabled across all systems. Additionally, the rule assumes that the commands associated with credential enumeration will be executed in a manner that generates detectable logs, which may not always be the case. Furthermore, if an adversary employs obfuscation techniques, the detection mechanism could fail to identify malicious activities. It's crucial to maintain appropriate logging configurations to ensure coverage for this alert rule to function effectively.

