title: Enumerate Credentials from Windows Credential Manager With PowerShell
id: 603c6630-5225-49c1-8047-26c964553e0e
status: test
description: |
  Adversaries may search for common password storage locations to obtain user credentials.
  Passwords are stored in several places on a system, depending on the operating system or application holding the credentials.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1555
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - vaultcmd
    - '/listcreds:'
  selection_option:
    ScriptBlockText|contains:
    - 'Windows Credentials'
    - 'Web Credentials'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to enumerate credentials stored in Windows Credential Manager using PowerShell commands, specifically with the `vaultcmd` utility. The likely attacker objective is to extract user credentials to facilitate later stages of an attack, such as lateral movement or account compromise. This behavior maps to the MITRE ATT&CK framework under the tactic of Credential Access (TA500) and the technique T1555: Credentials from Password Managers.

  The primary telemetry source is Windows PowerShell script logs, specifically those that contain script block logging. Required log types include the PowerShell event logs, particularly Event ID 4104, which logs script block invocation and content. If malicious, this activity could lead to unauthorized access and control over additional accounts or systems. Importantly, this detection by itself does NOT confirm that a successful credential compromise has occurred; it merely indicates an attempt to enumerate credentials.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for the alerting script block:** Check Event ID 4104 for execution of any commands that involve `vaultcmd` and the argument `/listcreds:`, indicating credential enumeration. Look for the timestamp and user context to correlate with other activities.

  - **Verify the legitimacy of the user context:** Identify the user account under which the command executed. Cross-reference this with expected administrative or scripted activity. Legitimate activities include known administrative tasks or scheduled jobs that access credentials.

  - **Examine process creation logs:** Look for associated Event ID 4688 (Process Creation) to verify if `powershell.exe` was the parent process and check the command line arguments executed. Determine if any signs of obfuscation are present in command line arguments.

  - **Identify any credentials accessed or dumped:** If script output is captured, review for user accounts or credential types mentioned in the output. Look for unusual or sensitive account names that could indicate malicious intent.

  - **Cross-check against security knowledge base:** Search if `vaultcmd` has been invoked as part of documented maintenance tasks. Compare the script's invocation pattern against known good activity to ascertain if it is an operationally benign use.

  - **Validate file creation or exfiltration:** Check for any temporary files or logs generated during this command execution that may indicate the credentials were captured or exfiltrated, particularly in common directories for temporary files (e.g., C:\Users\<UserName>\AppData\Local\Temp).

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on credential access and system integrity. The likelihood of malicious abuse is moderate, as credential enumeration is a common tactic used by adversaries. Additionally, PowerShell is frequently weaponized, making this a relevant activity warranting close examination.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded via regex obfuscation or using alternative scripting languages such as VBScript. The requirement for PowerShell script block logging to be enabled is essential for reliable detection; if unconfigured, this rule may miss malicious activity. Legitimate administrative tasks may also invoke similar commands, necessitating careful contextual review. A companion detection is monitoring for unexpected administrative PowerShell scripts, which would provide better contextual awareness of potential misuse.

