note: |
  ### Technical Context

  This rule detects the disabling of the Windows Firewall via PowerShell commands, specifically through modifications to firewall profiles. Attackers often aim to disable firewall protections to facilitate lateral movement or deployment of malware without restrictions. This behavior is aligned with the MITRE ATT&CK technique "Disable or Modify Tools" (T1686.003). The primary telemetry source required for this detection is PowerShell script block logging which captures command execution details. The security impact of malicious activity in this context is significant, as it may allow unauthorized access or data exposure. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also disable the firewall.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Event ID 4104 in the PowerShell logs to identify the context in which the command was executed, including the user identity and system from which the command was run. Match this with expected operational practices for firewall management.

  - **Verify command specifics:** Look for ScriptBlockText containing "Set-NetFirewallProfile" and " -Enabled False" within logged script blocks (PowerShell logs) to confirm that the specific command was executed.

  - **Examine user behavior:** Investigate the user or process that executed the command. Determine if they have legitimate administrative privileges or if they are an uncommon user for such actions, which could indicate potential misuse.

  - **Check for multiple profiles affected:** Identify if multiple firewall profiles (Domain, Private, Public) are getting disabled by examining the command's context. The use of "-All" as part of the command execution may indicate a broader malicious intention.

  - **Correlate with other logged events:** Look for accompanying Event IDs (like 4688 for process creation) that indicate PowerShell was launched by other suspicious means, such as through an unusual process or by a non-administrative user.

  ### Prioritization

  This alert presents a medium severity level. The potential impact is high due to the critical role firewall settings play in preventing unauthorized network access. The likelihood of malicious abuse is moderate, considering that disabling the firewall is a common tactic used by attackers to exfiltrate data or install further malicious tools. It’s a tactic that may be less frequently weaponized in a mature enterprise context, but any such activity warrants immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging or configurations, as Script Block Logging must be enabled for accurate tracking. This rule may also generate false positives from legitimate administrative actions or automated scripts that manage firewall settings. Additionally, it's important to be aware of evasion techniques, such as disabling logging or executing commands through alternate shells. A related detection rule that enhances coverage could involve monitoring for PowerShell execution using common adversary command strings or patterns indicative of strategy modification achieved through command-line activities.

