note: |
  ### Technical Context
  This rule detects when a user disables the Windows Firewall through PowerShell commands. Disabling the firewall can be a tactic employed by attackers to evade detection and avoid network security controls, potentially facilitating unauthorized access to a system or network. The threat scenario typically involves malicious actors seeking to create an environment where they can move laterally, exfiltrate data, or execute malicious payloads without being detected.

  The relevant MITRE ATT&CK tactics and techniques associated with this activity include **Defense Evasion** (T1203) and particularly **Exploitation of System Vulnerabilities** (T1562.004), which highlights actions taken by adversaries to disable security controls. This behavior can be indicative of initial compromise techniques designed to undermine critical security protections in enterprise environments.

  Primary data sources that can provide insights into this activity include **PowerShell Script Block logs**, which capture executed commands, as well as general **Windows event logs** related to security settings.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell Script Block logs for entries containing "Set-NetFirewallProfile", especially those with the `-Enabled False` parameter which indicates the firewall was disabled.

  - **Analyze System Event Logs**: Inspect Windows event logs to identify any changes in firewall settings, paying close attention to events related to configuration changes and user actions.

  - **Correlate with User Behavior**: Assess the context of the user account executing the command. Investigate whether the account has a history of legitimate administrative actions or if it has been exhibiting suspicious behavior over time.

  - **Validate Firewall Configuration**: Examine the current firewall configuration to ascertain if protections are indeed disabled, and document any deviations from the baseline security posture established for the organization.

  ### Prioritization
  The alert is classified as medium severity due to its potential impact on organizational security. Disabling the Windows Firewall can create significant vulnerabilities, increasing the likelihood of successful attacks if exploited by malicious actors.

  ### Blind Spots and Assumptions
  While this detection rule effectively identifies direct commands for disabling the firewall, it may not catch more elaborate methods of evasion or other command variations. Additionally, the detection logic assumes that Script Block Logging is enabled; without this, the rule will not function properly. If logging configurations are not standardized across the environment, critical events may be missed.

