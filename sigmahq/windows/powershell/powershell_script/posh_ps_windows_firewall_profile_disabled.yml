note: |
  ### Technical Context

  This rule detects the disabling of Windows Firewall profiles through PowerShell commands, particularly using the `Set-NetFirewallProfile` cmdlet with the `-Enabled False` argument. The likely attacker objective is to bypass network security controls to facilitate lateral movement, data exfiltration, or other malicious activities. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.004, which involves disabling security features.

  The primary telemetry sources for this detection include PowerShell script logs, specifically requiring Script Block Logging to be enabled to capture the necessary command executions. If malicious in nature, this behavior can significantly impact the organization's security posture, potentially leading to unauthorized access or data breaches. Importantly, this detection alone does not confirm malicious intent but signals a potentially risky configuration change that warrants further investigation.

  ### Investigation Steps

  - **Review script block logs:** Check for Security Event ID 4104 which captures PowerShell command executions. Look for instances of `Set-NetFirewallProfile` executed with the `-Enabled False` parameter to identify potential malicious activity.

  - **Verify the user context:** Determine the user account executing the PowerShell command. This can be cross-referenced with the Security Event ID 4624 (Logon) to assess if this user behavior aligns with normal operations or administrative tasks.

  - **Assess the firewall state:** Use PowerShell command `Get-NetFirewallProfile` to review the current firewall profile states (Domain, Private, Public). Confirm that expected firewall profiles remain enabled for the asset type, especially sensitive or critical systems.

  - **Identify scheduling mechanisms:** Investigate for any scheduled tasks (Event ID 4698) that may run scripts disabling the firewall. Check if legitimate applications are responsible for managing firewall rules, especially enterprise applications requiring broader network access.

  - **Document legitimate behavior:** Legitimate administrative activities may include enabling firewall profiles for maintenance or specific application requirements. Tasks performed under expected maintenance timelines (e.g., during scheduled patching windows) are less likely to be malicious.

  - **Flag high-confidence indicators:** Look for multiple instances of similar commands or scripts executed in a short period, especially in user or systems not commonly involved in network administration. Anomalous command execution patterns could indicate malicious intent.

  ### Prioritization

  This alert has medium severity given that it can indicate a significant security risk if exploited. The likelihood of malicious abuse is considerable, as disabling the firewall is a common technique used by adversaries for lateral movement or data exfiltration. Although there may be legitimate use cases, the potential impact on security demands prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as running PowerShell under alternate execution contexts or using obfuscated commands to bypass monitoring. Reliable detection relies on keeping Script Block Logging enabled and properly configured; without this, the activity may go undetected. Legitimate administrative users performing firewall modifications can trigger the alert, so context is key. A related detection worth monitoring is unauthorized changes to firewall rules (e.g., Event ID 2004 for Windows Firewall changes) to complement the security view.

