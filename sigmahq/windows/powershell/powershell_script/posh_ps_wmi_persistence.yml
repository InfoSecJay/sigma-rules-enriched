logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
  - ScriptBlockText|contains|all:
    - 'New-CimInstance '
    - '-Namespace root/subscription '
    - '-ClassName __EventFilter '
    - '-Property '           # is a variable name
  - ScriptBlockText|contains|all:
    - 'New-CimInstance '
    - '-Namespace root/subscription '
    - '-ClassName CommandLineEventConsumer '
    - '-Property '           # is a variable name
  condition: selection_ioc
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies malicious use of PowerShell to establish persistence via Windows Management Instrumentation (WMI) event subscriptions. Attackers leverage WMI to configure and trigger script execution based on system events, allowing for both persistence on the host and potential privilege escalation. The ability to execute scripts in response to WMI events can help attackers maintain access to compromised systems even after reboots or other mitigating actions.

  The likely objectives of attackers using this technique include ensuring that their malicious payloads are re-executed automatically in response to system events or user actions, thus creating an ongoing foothold within the network. The relevant MITRE ATT&CK tactics for this activity include Persistence (T1546.003) and Privilege Escalation. Investigating these events can highlight unauthorized behavior, enabling defenders to act against potential compromises.

  The primary data sources for detecting this activity include PowerShell script block logging, which records the execution of PowerShell scripts and their contents, capturing the detailed commands executed by adversaries.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script block logging to identify any instances of the `New-CimInstance` command used in conjunction with `-Namespace root/subscription` and relevant class names. Ensure that you check for surrounding context and parameters used in these commands.

  - **Monitor Event Subscription Changes**: Investigate any recent changes to WMI event subscriptions through Windows Event logs (Event ID 1500 and 1501) or by querying the WMI repository for new event consumers or filters. Look for unexpected configurations or unknown entities subscribed to WMI events.

  - **Check for Malicious Command Execution**: Evaluate the command line arguments submitted to WMI classes like `__EventFilter` and `CommandLineEventConsumer`. Verify if these are associated with legitimate use cases or if they exhibit suspicious patterns indicative of malicious intent.

  - **Investigate Related System Activities**: Correlate findings with additional logs (e.g., process creation events) to see if the identified PowerShell activities were followed by unusual processes or network connections that align with potential attacker behavior.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential for persistence mechanisms to enable extensive malicious activities on the network. If successful, these actions can lead to data exfiltration, lateral movement, and prolonged access to compromised systems.

  ### Blind Spots and Assumptions
  Potential gaps in detection include environments where PowerShell script block logging is not enabled, limiting visibility into potentially malicious activities. The detection logic may assume that any invocation of the specified WMI commands is suspicious; however, legitimate administrative tasks may generate similar events, leading to false positives. For this alert to function effectively, it is essential to ensure that logging is appropriately configured and that all relevant telemetry sources are in place.

