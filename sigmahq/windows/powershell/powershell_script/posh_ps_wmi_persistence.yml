logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ioc:
  - ScriptBlockText|contains|all:
    - 'New-CimInstance '
    - '-Namespace root/subscription '
    - '-ClassName __EventFilter '
    - '-Property '           # is a variable name
  - ScriptBlockText|contains|all:
    - 'New-CimInstance '
    - '-Namespace root/subscription '
    - '-ClassName CommandLineEventConsumer '
    - '-Property '           # is a variable name
  condition: selection_ioc
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies the creation of WMI event subscriptions using PowerShell, specifically targeting the formation of `__EventFilter` and `CommandLineEventConsumer` instances. Attackers typically aim to establish persistence on a compromised system, allowing them to execute malicious scripts whenever a specified event occurs, such as user logon. This behavior corresponds to the MITRE ATT&CK technique T1546.003 (WMI Event Subscription).

  The primary telemetry sources for this detection are PowerShell logs, specifically those created when Script Block Logging is enabled. If malicious, this could provide adversaries with uninterrupted access to the system, posing a significant threat to system integrity and data confidentiality. Importantly, this detection does not confirm that the activity is malicious on its own, as legitimate administrative tasks may also result in similar event logs.

  ### Investigation Steps

  - **Identify related PowerShell activities:**
    Check for PowerShell logs (Event ID 4104) that contain the malicious script block invocations. Look for `New-CimInstance` commands targeting namespaces such as `root/subscription`. Compare script contents against known benign administration tasks.

  - **Review script block logs**:
    Filter Script Block Logging logs for the specific commands generated by the rule, focusing on `ScriptBlockText` containing `New-CimInstance -Namespace root/subscription`. Malicious instances typically include unusual or unexpected property definitions.

  - **Assess the executing user context**:
    Determine the user account running the PowerShell script. Events with high privileges (e.g., SYSTEM or an administrator account) are more suspect, especially if the context is unrelated to legitimate administrative work.

  - **Investigate recent event subscriptions**:
    Use WMI to query existing event filters and consumers. Specifically, run the WMI query `Get-WmiObject -Namespace root/subscription -Class __EventFilter` and `Get-WmiObject -Namespace root/subscription -Class CommandLineEventConsumer`. Ensure that no unauthorized filters or consumers were created.

  - **Cross-reference host behavior**:
    Verify other telemetry such as system logs (Event ID 1102 - Audit Log Cleared) or network connection logs (Event ID 5156) to determine if the host displayed anomalous behavior (e.g., unexpected outbound connections) following the event subscription creation.

  ### Prioritization

  This alert holds medium severity due to its potential impact on compromised systems and the likelihood of adversary abuse for persistence. The creation of WMI event subscriptions can often lead to undetected or prolonged exploitation, making it a tactic that is weaponized by various threat actors.

  ### Blind Spots and Assumptions

  Detection may be evaded if script block logging is disabled or manipulated with obfuscation techniques. Required log sources include PowerShell and WMI telemetry; without these, the detection capabilities are significantly weakened. Legitimate administrative actions, such as scheduled tasks or legitimate monitoring configurations, could trigger similar alerts. A related detection to consider is monitoring for unexpected WMI queries (Event ID 5861) that may indicate reconnaissance after event subscription creation.

