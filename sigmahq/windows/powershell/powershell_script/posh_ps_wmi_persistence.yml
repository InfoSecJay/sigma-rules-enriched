  regression_data/rules/windows/powershell/powershell_script/posh_ps_wmi_persistence/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of WMI event subscriptions using PowerShell, specifically focusing on the `New-CimInstance` cmdlet to create instances of `__EventFilter` and `CommandLineEventConsumer`. The behavior indicates that an attacker may be attempting to establish persistence on a compromised system, allowing them to execute malicious payloads triggered by specific WMI events. This aligns with the MITRE ATT&CK technique T1546.003 (WMI Event Subscription for Persistence).

  The primary telemetry sources are PowerShell logs (requiring Script Block Logging to be enabled), specifically looking for significant event IDs related to these cmdlets. If malicious, the security impact can be severe, as it allows an attacker to maintain control over the system even after reboots or administrative interventions. This detection does NOT confirm that an adversary has successfully executed malicious code or retained access, as it may include benign administrative actions that align with WMI management practices.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Security Event ID 4104 associated with the detected script block text, noting any commands involving `New-CimInstance`. Look for irregular or unexpected usage patterns indicating potential malicious behavior.

  - **Validate your environment's legitimate use:** Identify if any internal IT or administrative teams utilize WMI for legitimate purposes, looking specifically for documented use cases or scripts involving `__EventFilter` and `CommandLineEventConsumer`.

  - **Cross-reference with asset criticality:** Assess the affected host’s role; a critical server exposing WMI subscriptions is of higher concern compared to a non-critical system. Review authorization levels and intended use of administrative scripts.

  - **Identify high-confidence malicious indicators:** Look for unexpected event consumers linked to known malicious command lines or scripts referencing `CommandLineEventConsumer`, especially those that do not correlate with any recognized business needs.

  - **Check for persistence across reboots:** Validate if the created event subscriptions persist after a system restart. Use WMI tools to list all existing WMI event consumers and verify their activity.

  - **Log additional event data:** Enable and review WMI operational logs (Event IDs 5858 and 5859) to obtain context on when and why these subscriptions were created or triggered, providing deeper insight into potential unauthorized persistence attempts.

  ### Prioritization

  This alert has medium severity due to the significant impact that a successful persistence mechanism can have on high-value systems. The likelihood of malicious use is considerable, especially in environments where such techniques are common among attackers. This behavior is frequently weaponized in targeted attacks and can lead to unauthorized escalation of privileges.

  ### Blind Spots and Assumptions

  Detection relies heavily on Script Block Logging being enabled; if this is not configured, many malicious activities may be missed. Additionally, legitimate administrative tasks may trigger this alert, particularly in environments heavily using WMI for system management. A related detection would be monitoring for classic persistence techniques, such as scheduled tasks (T1053), which could complement surveillance for attempts to establish WMI persistence.

