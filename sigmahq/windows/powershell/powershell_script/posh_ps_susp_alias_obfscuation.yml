note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Set-Alias` and `New-Alias` commands using the `-join` operator, which can indicate attempts to obfuscate the creation of aliases in a script. Such obfuscation techniques are often employed by attackers to disguise malicious actions like executing payloads or commands. The likely attacker objective is to execute PowerShell commands while evading detection by obscuring the true intent of the commands.

  This behavior is associated with the MITRE ATT&CK tactics and techniques: Execution (T1059.001) and Stealth (T1027). The primary telemetry source is Windows PowerShell logs, specifically requiring Script Block Logging to be enabled, along with potential event logs related to PowerShell execution. If malicious, this activity could lead to unauthorized command execution or facilitate further exploitation within the environment. Importantly, this detection does NOT confirm that the command is malicious on its own; it simply indicates that obfuscation techniques are being employed, which warrant further investigation.

  ### Investigation Steps

  - **Verify Script Block Logging configuration:** Check that PowerShell Script Block Logging is enabled on the affected host. This can be validated in Group Policy or via the registry at `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging`.

  - **Review the PowerShell logs for suspicious activity:** Examine Security Event ID 4104 (PowerShell Script Block Logging) for the specific command that triggered the alert. Look for nearby commands focusing on script obfuscation techniques or unusual parameters.

  - **Correlate with other log sources:** Investigate the time frame of the alert in the Event Viewer under Applications and Services Logs > Microsoft > Windows > PowerShell > Operational (Event ID 4103) for any preceding user activity indicating misuse of PowerShell by an unauthorized account.

  - **Identify high-confidence malicious indicators:** Look for any instance of `Set-Alias` with obfuscated `-join` commands that do not align with typical organizational tasks or common automation scripts. An example would be underlying commands that reference known malicious utilities or endpoints.

  - **Determine legitimacy of the user and purpose:** Check the user who executed the PowerShell command against your organization's user behavior profile. Legitimate PowerShell usage often includes system maintenance, automation scripts, or monitoring tasks.

  - **Assess potential exfiltration activities:** Validate whether any files or artifacts have been created or modified around the time of the alert, especially those associated with malware or unauthorized scripts. Check file artifacts using File Creation time and associated user actions in file server logs.

  ### Prioritization

  The severity of this alert is low due to the obfuscation technique used, but potential malicious intent to hide activity raises concern, particularly if linked to a critical asset. Given the common use of PowerShell for both legitimate administration and exploitation, the likelihood of malicious abuse exists but requires further validation.

  ### Blind Spots and Assumptions

  Detection of this behavior may result in false positives from legitimate PowerShell usage, especially in environments using complex automation scripts. Ensure that PowerShell script logging and required event log configurations are consistently monitored. This rule may miss PowerShell obfuscation techniques that utilize alternative methods not captured by the current detection. For enhanced coverage, consider correlating with other detections focused on PowerShell usage patterns (e.g., monitoring for execution of `Invoke-Expression` or `Invoke-Command`).

