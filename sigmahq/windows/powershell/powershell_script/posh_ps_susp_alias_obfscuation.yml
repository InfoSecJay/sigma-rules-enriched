  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell commands designed to obfuscate alias creation by leveraging the `-join` operator. Attackers often employ obfuscation techniques to evade detection mechanisms while executing potentially harmful scripts. This behavior typically aligns with the MITRE ATT&CK techniques for Defense Evasion (T1027) and Execution via PowerShell (T1059.001). The primary telemetry source for this detection is PowerShell script logging, specifically Script Block Logging, which needs to be enabled in the environment.

  If an attacker successfully utilizes this technique, it may indicate an active attempt to manipulate or run malicious commands while avoiding detection. However, this detection alone does not confirm malicious intent, as legitimate scripts may also use similar obfuscation methods for other purposes.

  ---

  ### Investigation Steps

  - **Check PowerShell Logs for Obfuscation Patterns:** Examine PowerShell script logs (Event ID 4104) for any occurrences of the `-Alias` switch combined with the `-join` operator. This can indicate an attempt to obscure command execution.

  - **Identify Host Role and Context:** Determine the role of the affected host (e.g., domain controller, server, or workstation) to assess the importance of the action. This helps contextualize the severity of the alert.

  - **Review Recent PowerShell Executions:** Filter through PowerShell logs (Event ID 4104) for recent script executions that utilize `Set-Alias` or `New-Alias`. Look for any governance policies that would typically restrict such actions.

  - **Validate Engineered Behavior:** Compare the event against known lists of authorized PowerShell scripts and aliases. Legitimate scripts should document their commands clearly without use of obfuscation techniques.

  - **Investigate Related Alerts:** Review any companion alerts or behaviors for signs of coordinated malicious activity, such as unusual process initiation patterns linked to PowerShell usage.

  - **Correlate with External Threat Intelligence:** Research external threat indicators or reported campaigns that utilize similar obfuscation to determine if the behavior aligns with known adversary tactics.

  ---

  ### Prioritization

  The alert severity is low based on the use of obfuscation techniques, which are common in both benign and malicious contexts. However, its presence on critical systems may warrant further investigation considering the likelihood of exploitation in environments with a higher attack surface.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of Script Block Logging, which is a prerequisite for this rule. Legitimate PowerShell scripts used in normal operations may also trigger this alert due to benign obfuscation practices. Additionally, related detections for other PowerShell obfuscation techniques could enhance overall detection capabilities, such as those targeting script execution methods or specific command patterns.

