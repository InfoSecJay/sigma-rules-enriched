note: |
  ### Technical Context

  This Sigma rule detects obfuscation techniques commonly used in PowerShell scripts to create aliases, specifically leveraging the `-join` operator to obscure script intentions. The likely attacker objective is to evade detection while executing malicious commands via PowerShell, often targeting infrastructure or data exfiltration. Relevant MITRE ATT&CK tactics include *Defense Evasion* (T1562) and *Command and Scripting Interpreter* (T1059.001). The primary telemetry source involves PowerShell Script Block Logging, which captures script execution details, including the text of the script blocks used. If executed maliciously, it could enable attackers to run arbitrary commands undetected. Note that this detection does NOT confirm whether the execution is indeed malicious—it only indicates potentially suspicious use of alias creation.

  ### Investigation Steps

  - **Review Script Block Logs:** Check PowerShell logs (Event ID 4104) for occurrences of `Set-Alias` or `New-Alias` commands involving `-Value (-join(`, with the corresponding script block text. Look for context on what the alias is pointing to.

  - **Correlate with User Account Activity:** Verify the user account executing the command; check its history and roles to assess legitimate use (e.g., administrative scripts could be normal vs. unexpected), focusing on timestamps and corresponding Event IDs (e.g., login events, ID 4624).

  - **Assess PowerShell Execution Policy:** Confirm whether the environment has a restrictive execution policy in place (Policies vary from Undefined to AllSigned); unexpected lower security measures may indicate potential exploitation.

  - **Identify Malicious Indicators:** Look for associations with known malicious payloads in the command (i.e., the alias name should not relate to normal business functions). Specific keywords or known patterns in the aliases point towards known threats.

  - **Monitor for other Obfuscation Techniques:** Investigate if similar patterns arise with additional PowerShell obfuscation tactics, such as encoded commands or alternative join methods.

  ### Prioritization

  The alert is considered low severity due to the non-specific nature of alias creation and obfuscation techniques. While it may indicate probing or early stages of malicious behavior, such techniques can be used in benign scenarios. Due to the importance of PowerShell as a tool for both legitimate administration and exploitation, alerts should be raised when seen alongside other indicators of compromise.

  ### Blind Spots and Assumptions

  Detection may be circumvented by using alternative obfuscation methods not captured by the rule. The accuracy of this alert depends on having PowerShell Script Block Logging enabled and properly configured. Legitimate activities that could trigger this alert include system maintenance scripts or applications using PowerShell for management tasks, particularly those invoking aliases. Companion detections, such as monitoring for encoded command usage (MITRE T1059.001) or access to PowerShell's `Invoke-Expression`, would strengthen coverage against broader abuse patterns.

