title: PowerShell Deleted Mounted Share
id: 66a4d409-451b-4151-94f4-a55d559c49b0
status: test
description: Detects when when a mounted share is removed. Adversaries may 
  remove share connections that are no longer useful in order to clean up traces
  of their operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: 'oscd.community, @redcanary, Zach Stanford @svch0st'
date: 2020-10-08
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1070.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Remove-SmbShare'
    - 'Remove-FileShare'
  filter_main_module_load:
    ScriptBlockText|contains|all:
    - 'FileShare.cdxml'
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'ROOT/Microsoft/Windows/Storage/MSFT_FileShare'
    - 'ObjectModelWrapper'
    - 'Cmdletization.MethodParameter'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: medium
note: |
  ### Technical Context

  This Sigma rule detects when a PowerShell script exits or commands are executed that indicate the deletion of SMB shares using the `Remove-SmbShare` or `Remove-FileShare` cmdlets. The likely objective of an attacker is to eliminate traces of their activity post-exploitation by removing access to shares that may expose their presence or actions. The relevant MITRE ATT&CK tactic is **Defense Evasion** with technique **T1070.005** (Indicator Removal on Host).

  The primary telemetry source for this detection is PowerShell script logs, specifically requiring that Script Block Logging is enabled. If the deletion of mounted shares is malicious, it could indicate that an adversary is attempting to clean up evidence of data exfiltration or system compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate users (e.g., administrators) may also remove SMB shares as a part of regular maintenance or system management.

  ### Investigation Steps

  - **Review PowerShell Activity:** Check for Security Event ID 4104 for any PowerShell script block logging that includes the detected cmdlets (`Remove-SmbShare` or `Remove-FileShare`). Look for unusual patterns in the script execution times, especially if they occur outside of standard operational hours.

  - **Examine User Context:** Investigate the user associated with the script execution, checking for any accounts that may have been compromised or lack a legitimate reason for executing the command. Benign behavior typically includes system administrators managing shares during maintenance hours.

  - **Cross-reference with System Logs:** Look at Security Event ID 5140 to see if access to the shares was legitimately made prior to the deletion. Assess any accompanying events indicating user activities that seem inconsistent with the typical roles of the user.

  - **Validate Share Removal Impact:** Confirm that the shares in question were actively used (check for Event IDs 5145 and 5140) before deletion. Analyze which files or data were accessible via these shares prior to their removal to establish the potential impact of the deletion.

  - **Identify Malicious Indicators:** Look for unusual command line arguments or scripts executed just before the share removal commands, especially those indicating lateral movement or external access attempts, such as malformed URLs or IP addresses.

  - **Check for Other Anomalous Activities:** Review for other indicators of compromise, such as unusual account logins (Event ID 4624), failed logon attempts (Event ID 4625), or changes to system configurations that might suggest broader exploitation efforts.

  ### Prioritization

  This alert should be treated with medium priority as it reflects potentially malicious activity that can undermine the integrity of the environment. The likelihood of abuse is moderate, as attackers often seek to clear their tracks after unauthorized access. While deletion of shares by administrators is common, vigilant monitoring is crucial to distinguish between legitimate maintenance and malicious actions.

  ### Blind Spots and Assumptions

  Detection may be limited by the Script Block Logging configuration, which can be disabled or improperly set up, leading to incomplete visibility. Legitimate business activities like routine network share management can trigger this alert if they coincide with usage patterns typically associated with adversarial actions. Companions like detecting the creation of covert accounts or rogue software installations can bolster detection and response efforts.

