title: PowerShell Deleted Mounted Share
id: 66a4d409-451b-4151-94f4-a55d559c49b0
status: test
description: Detects when when a mounted share is removed. Adversaries may 
  remove share connections that are no longer useful in order to clean up traces
  of their operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: 'oscd.community, @redcanary, Zach Stanford @svch0st'
date: 2020-10-08
modified: 2025-10-07
tags:
- attack.stealth
- attack.t1070.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Remove-SmbShare'
    - 'Remove-FileShare'
  filter_main_module_load:
    ScriptBlockText|contains|all:
    - 'FileShare.cdxml'
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'ROOT/Microsoft/Windows/Storage/MSFT_FileShare'
    - 'ObjectModelWrapper'
    - 'Cmdletization.MethodParameter'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands (`Remove-SmbShare` and `Remove-FileShare`) to delete mounted shares on Windows systems. Such actions may indicate an attacker’s attempt to eliminate traces of their activities after accessing sensitive data or executing malicious operations, aligning with the MITRE ATT&CK technique T1070.005 (Indicator Removal on Host: File and Directory Permissions Modification). The primary telemetry sources for this detection are Windows PowerShell logs, specifically those capturing script block execution events where Script Block Logging is enabled.

  If malicious, this behavior can compromise the confidentiality and integrity of the system and its data by permanently removing access points, effectively hindering forensic investigations. This detection alone does not confirm malicious intent; legitimate administrative actions could generate the same events, particularly from authorized users removing unnecessary shares.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs**: Review Windows Security Event ID 4104 for script block logging. Focus on script entries containing `'Remove-SmbShare'` or `'Remove-FileShare'` to confirm the detection context.

  - **Validate User Context**: Investigate the user or process executing the script command. Confirm if they are an administrator or a legitimate user performing expected operational tasks, such as cleaning up shares no longer in use.

  - **Examine Share Removal Timing**: Analyze the timestamp of the share removal against other related activities on the system (e.g., unauthorized access events, lateral movement actions) to determine if the share deletion correlates with suspicious behaviors.

  - **Identify Malicious Patterns**: Look for a sequence of commands from the same user or process preceding the share deletion. High-confidence indicators would include unusual commands run in conjunction, revealing an attempt to cover tracks.

  - **Assess System Configuration**: Check for the configuration of Script Block Logging on the affected systems (found in Group Policy settings). Ensure logs are correctly set up to capture potential PowerShell abuses.

  - **Document Benign Activity**: Note routine administrative tasks, such as the removal of old or unused shares in response to normal business processes, which should appear in the logs alongside user actions confirming the legitimacy of the activity.

  ### Prioritization

  This alert is considered medium severity due to the nature of the activity occurring on potentially sensitive systems. The likelihood of malicious exploitation is elevated if the command is executed by non-administrative or unfamiliar users within critical servers or sensitive environments. This behavior is not commonly weaponized but can indicate attempts to obfuscate malicious activities.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated adversaries employing evasion techniques, such as PowerShell obfuscation to conceal their command executions. It requires proper logging configurations for Script Block Logging to ensure reliability. Legitimate administrators can trigger this alert while managing shares, making careful context analysis essential. A companion detection rule for "PowerShell command execution" that tracks other relevant commands can enhance overall detection capabilities.

