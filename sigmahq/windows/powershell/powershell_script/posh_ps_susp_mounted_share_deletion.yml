title: PowerShell Deleted Mounted Share
id: 66a4d409-451b-4151-94f4-a55d559c49b0
status: test
description: Detects when when a mounted share is removed. Adversaries may remove
  share connections that are no longer useful in order to clean up traces of their
  operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: 'oscd.community, @redcanary, Zach Stanford @svch0st'
date: 2020-10-08
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1070.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Remove-SmbShare'
    - 'Remove-FileShare'
  filter_main_module_load:
    ScriptBlockText|contains|all:
    - 'FileShare.cdxml'
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'ROOT/Microsoft/Windows/Storage/MSFT_FileShare'
    - 'ObjectModelWrapper'
    - 'Cmdletization.MethodParameter'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where adversaries might be using PowerShell commands to remove mounted shares from a Windows system. The action of deleting a mounted share, such as through the commands `Remove-SmbShare` or `Remove-FileShare`, is often executed by threat actors as part of their efforts to conceal their activities and maintain stealth. By cleaning up their tracks and removing connections to shares that hold sensitive data or are no longer useful, these attackers aim to avoid detection and impede incident response efforts.

  In terms of MITRE ATT&CK framework, this detection pertains to the tactic of **Defense Evasion**, specifically related to the technique **Indicator Removal on Host (T1070.005)**. Attackers utilize this technique to eliminate evidence of their presence on a system, thereby complicating forensic investigations.

  The primary data source for this detection is **PowerShell script block logging**, which must be enabled for effective detection. Script block logging captures details about the PowerShell commands executed, including any malicious use of `Remove-SmbShare` and related commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell logs for the execution of `Remove-SmbShare` or `Remove-FileShare`. Focus on the context of these commands and the user executing them to identify potential indicators of malicious activity.

  - **Analyze Share Activity:** Investigate recent share creation or modification events preceding the removal. Look for any irregular patterns or unauthorized access to determine if the shares were being exploited.

  - **Check User Context:** Validate the user accounts involved in the execution of these commands. Ensure that the actions align with organizational policies and that there are no accounts that should not have been performing such actions.

  - **Cross-reference with Audit Logs:** Correlate findings with other system logs, such as Windows Security Event logs, to confirm whether the user actions were legitimate administrative tasks or potential indicators of compromise.

  ### Prioritization
  This alert is considered medium priority in an enterprise environment due to the potential impact of share removal by an unauthorized user, which may indicate an ongoing attack or data exfiltration effort. The likelihood of this activity suggesting malicious intent increases in environments where sensitive information is accessible via mounted shares.

  ### Blind Spots and Assumptions
  The detection logic may not capture actions performed by legitimate administrative users who are expected to manage shares, creating potential false positives. It assumes that script block logging is enabled and configured correctly; without this logging, the detection will not function. Additionally, there may be gaps in detection coverage if attackers utilize different methods to delete shares that do not involve PowerShell or if the actions take place outside of the monitored environment.

