title: Automated Collection Command PowerShell
id: c1dda054-d638-4c16-afc8-53e007f3fbc5
status: test
description: Once established within a system or network, an adversary may use automated
  techniques for collecting internal data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
author: frack113
date: 2021-07-28
modified: 2022-12-25
tags:
- attack.collection
- attack.t1119
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ext:
    ScriptBlockText|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Get-ChildItem'
    - ' -Recurse '
    - ' -Include '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands that automate the collection of documents and other file types from a Windows system or network. Attackers who have gained access to an environment may execute such commands to gather sensitive internal data, storage files containing proprietary or sensitive information, or other documents that could aid in their objectives, such as lateral movement or preparing for data exfiltration.

  The likely attacker objective here is to quickly and efficiently enumerate and collect a wide range of files that could contain valuable data. This aligns with the MITRE ATT&CK framework, specifically the **Collection** tactic, and technique **T1119: Automated Collection**. Attackers often leverage these techniques when they are inside a network and aim to harvest credentials, intellectual property, or sensitive personal information.

  The primary data source needed for this detection is **Windows PowerShell Script Block Logging**, which captures the execution details of PowerShell commands, allowing analysts to observe potentially malicious automated data collection activities.

  ### Investigation Steps
  - **Review Script Block Logs:** Collect and examine PowerShell script block logs for any instances of the identified commands that may indicate automated file collection.
  - **Analyze File Access Patterns:** Investigate access logs for sensitive files to identify unusual patterns in file retrieval that may correlate with the detected PowerShell activity.
  - **Validate User Context:** Assess the user accounts executing the commands—determine if they align with normal behavior or if they suggest a compromised account.
  - **Correlate with Other Data Sources:** Cross-reference findings with endpoint detection data (such as EDR alerts) and network logs (such as those from NGFW) to identify any external communications or lateral movement attempts associated with the collection behavior.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of unauthorized data collection in an enterprise environment, which could lead to data loss or reputation damage. Given the likelihood of targeted attacks using automated tools, timely investigation is critical to mitigating potential breaches.

  ### Blind Spots and Assumptions
  This detection rule assumes that **Script Block Logging** is enabled on all relevant systems; without it, the ability to capture and analyze PowerShell execution details is significantly diminished. There may also be gaps in coverage relating to unconventional data collection methods that do not utilize standard PowerShell commands. Additionally, the rule does not distinguish legitimate administrative activity from malicious behavior, which may lead to false positives that need further examination.

