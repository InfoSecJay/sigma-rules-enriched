title: Automated Collection Command PowerShell
id: c1dda054-d638-4c16-afc8-53e007f3fbc5
status: test
description: Once established within a system or network, an adversary may use 
  automated techniques for collecting internal data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
author: frack113
date: 2021-07-28
modified: 2022-12-25
tags:
- attack.collection
- attack.t1119
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ext:
    ScriptBlockText|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Get-ChildItem'
    - ' -Recurse '
    - ' -Include '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_automated_collection/info.yml
note: |
  ### Technical Context

  This Sigma rule detects PowerShell commands utilizing `Get-ChildItem` for recursive data collection of specific document types (e.g., .docx, .xlsx, .pdf). Such behavior is often employed by adversaries to automate the extraction of valuable data from compromised systems. The likely objective is to identify and collect confidential documents that could be used for further exploitation or financial gain.

  The relevant MITRE ATT&CK tactic is **Collection** (ID: T1119) and focuses on **Automated Collection** techniques. The primary telemetry sources include PowerShell logs, specifically requiring Script Block Logging to be enabled, to capture these command executions. If this alert corresponds to malicious activity, it can lead to unauthorized data exfiltration. However, this detection does NOT confirm whether the collected data has been exfiltrated or misused without additional context.

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check Windows logs for Security Event ID 4104 and Sysmon Event ID 4104 for Script Block logs. Look for commands that include `Get-ChildItem -Recurse` and target specified file types. Identify instances with unusually high file counts or unexpected directories.

  - **Correlate User Context:** Analyze the user account associated with the command execution. Legitimate administrative tasks may explain the behavior if the command comes from an expected script or user known for data management activities.

  - **Check Recent File Activity:** Use file system audit logs (Windows Security Event ID 4663) to determine if any of the collected file types were accessed or modified. Rapid access to high numbers of sensitive files could indicate malicious intent.

  - **Identify Anomalous Timing or Frequency:** Evaluate the time of execution. Frequent runs of similar automated collection commands outside of normal operating hours or during off-peak times can signify suspicious behavior.

  - **Validate Asset Criticality:** Ensure the alert is generated from critical assets, such as servers storing sensitive documents or user endpoints of high-value targets. Prioritize investigation based on asset impact.

  - **Monitor Network Activity for Exfiltration Indicators:** Check network logs (e.g., firewall logs for unusual outbound connections) that might indicate subsequent data exfiltration attempts via HTTP/S or other protocols after the collection command was executed.

  ### Prioritization

  The alert is of medium severity, as it indicates potential malicious behavior involving automated data collection. The likelihood of abuse is significant, given that data exfiltration often follows such automated methods, and the usage of PowerShell for data collection is commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may have limitations if Script Block Logging is not enabled, potentially missing critical commands. Adversaries may use similar PowerShell commands to facilitate legitimate operations, such as system maintenance. Additionally, companion detections such as monitoring for data exfiltration attempts (e.g., alerts for unusual HTTP/S traffic) would enhance security coverage and confirm malicious intent.

