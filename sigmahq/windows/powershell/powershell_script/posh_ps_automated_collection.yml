title: Automated Collection Command PowerShell
id: c1dda054-d638-4c16-afc8-53e007f3fbc5
status: test
description: Once established within a system or network, an adversary may use 
  automated techniques for collecting internal data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
author: frack113
date: 2021-07-28
modified: 2022-12-25
tags:
- attack.collection
- attack.t1119
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_ext:
    ScriptBlockText|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Get-ChildItem'
    - ' -Recurse '
    - ' -Include '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies PowerShell scripts that utilize the `Get-ChildItem` cmdlet in conjunction with recursive file listing and specific file extensions associated with documents and other potential sensitive data. The behavior suggests an attempt to collect data from a compromised system, thereby facilitating data exfiltration or reconnaissance. The likely attacker objective is to gather sensitive documents (e.g., financial, personal) for inappropriate use.

  Relevant MITRE ATT&CK tactics and techniques include: **Collection (TA0009), Data from Local System (T1119)**. The primary telemetry source is PowerShell script block logging, specifically capturing the script block text that matches the specified criteria. If malicious, the security impact could be significant, potentially leading to data breaches or corporate espionage. This detection alone does NOT confirm malicious activity; benign scripts may invoke similar commands for administrative purposes.

  ---

  ### Investigation Steps

  - **Investigate PowerShell Script Blocks:** Review PowerShell script block logs (Event ID 4104) for matching entries. Look for entries containing `Get-ChildItem -Recurse -Include` with extensions like `.docx` or `.xlsx`.

  - **Analyze Context of Execution:** Validate the context in which the script was executed (e.g., user account, system role). Compare against normal administrative operations on the asset. Expected behavior might include fewer document extensions or limitations on recursion depth.

  - **Identify User Account Patterns:** Check user account activity within the last hour prior to the alert using Security Event ID 4624. Look for unusual logins or actions from accounts that don't typically execute these kinds of PowerShell scripts.

  - **Assess File Access Patterns:** Investigate file access logs to determine if any sensitive files (e.g., business documents) were accessed around the same time as the script execution, ensuring to look in directories where such files are typically stored (e.g., shared drives, user documents).

  - **Correlate with Network Traffic:** Examine network logs (e.g., web proxy logs, DNS queries) for outgoing traffic to unusual external destinations following the scripted commands. Look for evidence of file uploads or unusual data transfers.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive data if a compromised system is involved. The likelihood of malicious abuse is notable, as attackers commonly exploit automated collection techniques to gather valuable information. This behavior is often weaponized in data exfiltration scenarios.

  ---

  ### Blind Spots and Assumptions

  This detection may miss obfuscated PowerShell commands or if the logging is not correctly configured. Legitimate automated scripts for backups or data management could also trigger this alert. For reliable detection, ensure PowerShell script block logging is enabled across all endpoints. A related detection would be monitoring unusual command-line parameters utilized within scripts (e.g., unusual wscript or cmd.exe executions), which may further indicate automation for data collection.

