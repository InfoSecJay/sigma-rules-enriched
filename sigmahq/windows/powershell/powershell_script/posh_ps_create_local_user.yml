note: |
  ### Technical Context

  This detection identifies the creation of a local user account via PowerShell, specifically through the `New-LocalUser` command. Attackers may attempt this as part of lateral movement to establish persistence on compromised systems, allowing unauthorized access and control. This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1136.001) and Execution (T1059.001).

  The primary telemetry source is Windows PowerShell logs, specifically required logs from Script Block Logging. If malicious, the security impact includes unauthorized account creation, resulting in potential unauthorized access to sensitive resources. Importantly, this detection does not confirm malicious intent on its own; it could also arise from legitimate administrative actions.

  ### Investigation Steps

  - **Review PowerShell logs for event details**: Check for Script Block Logging entries related to `New-LocalUser`. Look for Windows Event ID 4104 to confirm the command execution and capture context around the command where relevant.

  - **Identify user creation context**: Determine the user or process executing the PowerShell command. Check the user account name associated with the script execution (look for `User` field in Event ID 4104) to see if it aligns with known administrative accounts.

  - **Verify execution frequency**: Analyze the frequency and timing of the `New-LocalUser` command execution to identify potential automation. Legitimate behavior will typically involve infrequent user creations or those scheduled during business hours.

  - **Correlate with recent administrative changes**: Review for any recent authorized user management tasks within the environment, documented through change logs or IT service management tools to identify support staff activities that may align with user creation.

  - **Assess user permissions of created accounts**: If instances of user creation are detected, check the permissions granted to these new accounts. Malicious actors may establish accounts with elevated privileges or administrative rights, which is a strong indicator of malicious activity.

  ### Prioritization

  The alert is of medium severity due to the potential impact on system integrity if a local user account is created without appropriate authorization. The likelihood of such behavior being weaponized is moderate, as this technique is commonly used for persistence in compromised systems.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, which is a prerequisite for capturing this activity. Legitimate administrative tasks, such as onboarding processes for new employees, could trigger this alert. Additionally, a companion detection involving monitoring for changes in user privileges or group memberships would strengthen coverage against misuse of newly created accounts.

