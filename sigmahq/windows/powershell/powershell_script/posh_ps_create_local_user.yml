note: |
  ### Technical Context
  This rule detects the creation of a local user account via PowerShell, specifically using the `New-LocalUser` cmdlet. This behavior is commonly associated with malicious actors attempting to establish persistence on a compromised system by creating new accounts with varying privileges. The ability to create a local user grants the attacker continued access even after initial backdoors or malware have been removed, fulfilling a key objective in post-exploitation scenarios.

  The relevant MITRE ATT&CK techniques for this detection include:
  - **T1136.001: Create Local Account** - This technique describes the creation of a new user account on a local computer or domain, often used for establishing persistence.
  - **T1059.001: PowerShell** - The use of PowerShell as a scripting language for command execution, which is popular among attackers due to its native presence in Windows environments.

  Primary data sources that will provide evidence of this activity include:
  - PowerShell script block logs, which must be enabled to capture command execution details.
  - Windows Event Logs, specifically for security logs that track account management changes.

  ### Investigation Steps
  - **Review PowerShell Logs:** Check the PowerShell script block logging for any instances of the `New-LocalUser` command execution to identify the user who initiated the action and the context of the execution.
  - **Examine User Account Logs:** Investigate Windows Security Event Logs (Event IDs 4741 and 4720) to capture the creation of new users and correlate with PowerShell activity, confirming the legitimacy of the account creation.
  - **Analyze Process Execution Timeline:** Look at the process creation events to determine if the PowerShell execution was preceded by other suspicious activities or exfiltration behaviors, indicating a potential attack chain.
  - **Conduct User Behavior Analysis:** Assess the user and machine behavior for any anomalous logins or actions attributed to the newly created user account, as attackers often leverage these accounts for further malicious activity.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of local user creation, which may indicate unauthorized access and an escalation of privileges within the environment. Although legitimate activity may occur (such as administrative tasks), the risk of exploitation necessitates prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities that involve the use of `New-LocalUser`, leading to false positives. The detection logic assumes that script block logging is enabled; if it's not, this detection will be ineffective. Additionally, any obfuscation techniques used by an attacker to hide the command may evade detection, necessitating further monitoring of user and process behaviors beyond simple command logging.

