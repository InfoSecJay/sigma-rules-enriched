title: Usage Of Web Request Commands And Cmdlets - ScriptBlock
id: 1139d2e2-84b1-4226-b445-354492eba8ba
related:
- id: 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d
  type: derived
status: test
description: Detects the use of various web request commands with commandline tools
  and Windows PowerShell cmdlets (including aliases) via PowerShell scriptblock logs
references:
- https://4sysops.com/archives/use-powershell-to-download-a-file-with-http-https-and-ftp/
- https://blog.jourdant.me/post/3-ways-to-download-files-with-powershell
author: James Pemberton / @4A616D6573
date: 2019-10-24
modified: 2025-10-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  filter:
    Path|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  condition: selection and not filter
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and Start-BitsTransfer.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the use of specific web request commands and cmdlets in PowerShell scripts, particularly those involving downloading files or making HTTP requests. The likely attacker objective is to exfiltrate data or to download malicious payloads to a compromised system. The relevant MITRE ATT&CK tactic is Execution, encompassing techniques T1059.001 (Command and Scripting Interpreter: Windows PowerShell).

  The primary telemetry sources include PowerShell script block logs, which require the Script Block Logging feature to be enabled. If exploited maliciously, this behavior could lead to initial access, data exfiltration, or the execution of additional payloads. Importantly, detecting this activity does not confirm that malicious action has occurred; legitimate administrative use of these commands can also trigger the alert.

  ---

  ### Investigation Steps

  - **Examine PowerShell logs**: Review PowerShell script block logs (Event ID 4104), focusing on entries containing 'Invoke-WebRequest', 'curl', and other defined commands. Compare timestamps with known system activity to determine if the requests appear suspicious.

  - **Identify expected legitimate activities**: Verify if the queried commands stem from approved scripts or system management tasks. Look for documented use cases where 'Invoke-WebRequest' or 'Start-BitsTransfer' is utilized for regular maintenance or updates.

  - **Connect it to the affected user**: Check the user account associated with the execution context. High-privilege accounts executing web request commands outside their standard operational windows may signal possible compromise.

  - **Seek malicious indicators**: Investigate any corresponding process creation logs (Event ID 4688) around the same time this script block was executed. Look for unexpected processes spawned alongside, especially those that download or run unintended software payloads.

  - **Track file download artifacts**: Look for any abnormal file creations or downloads (e.g., files saved in temporary folders) that result from executed commands. Validate any files downloaded by cross-checking their hashes against known threat repositories.

  - **Review endpoint security alerts**: Check if there are additional security alerts or logs from endpoint detection and response (EDR) solutions that correlate with the execution of these commands. Prioritize alerts indicating abnormal outbound network connections related to web requests.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of malicious file downloads or commands run on sensitive systems. The likelihood of this behavior being abused for malicious purposes is significant, especially given that common attack vectors often utilize similar PowerShell commands for initial access and data exfiltration.

  ---

  ### Blind Spots and Assumptions

  The detection is limited as it may generate false positives from legitimate administrative tasks using PowerShell. Reliable detection requires that Script Block Logging is consistently enabled across the environment. Legitimate DevOps activities using 'Invoke-WebRequest' for application updates may also trigger the alert. A related detection rule for anomalous file creations could provide additional context and bolster overall threat visibility.

