description: Detects the use of various web request commands with commandline 
  tools and Windows PowerShell cmdlets (including aliases) via PowerShell 
  scriptblock logs
references:
- https://4sysops.com/archives/use-powershell-to-download-a-file-with-http-https-and-ftp/
- https://blog.jourdant.me/post/3-ways-to-download-files-with-powershell
author: James Pemberton / @4A616D6573
date: 2019-10-24
modified: 2025-10-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  filter:
    Path|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  condition: selection and not filter
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and 
  Start-BitsTransfer.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of various web request commands and PowerShell cmdlets that can be used to download files over HTTP/HTTPS and FTP. Attackers may use these commands to retrieve malicious payloads or exfiltrate data. This behavior aligns with the MITRE ATT&CK technique for "Command and Scripting Interpreter: Windows PowerShell" (T1059.001).

  The primary telemetry source is Windows PowerShell script block logging, which captures command executions via ScriptBlockText logs. If exploited maliciously, this may lead to the deployment of malware or unauthorized data transfers, compromising system integrity and confidentiality. However, detection of this behavior does NOT confirm that a malicious action has occurred without additional context about the source and intent of the commands.

  ### Investigation Steps

  - **Review PowerShell ScriptBlock Logs**: Check PowerShell logs for Event ID 4104 that capture ScriptBlock logging for commands like `Invoke-WebRequest`, `curl`, or `wget`. Analyze the execution context such as user identity and command output.

  - **Identify Anomalous File Downloads**: Look for unusual file downloads from commands detected in the ScriptBlock logs, focusing on specific URLs or IP addresses. Validate using logs from web proxies or firewalls.

  - **Assess Command Context**: Review the preceding logs to determine if legitimate administrative or automated scripts were executing around the time of the alert. This may include common maintenance tasks.

  - **Check for Malicious Indicators**: Look for indicators like the use of suspicious URLs or non-typical command patterns in the PowerShell commands being executed. Document any file types or paths that are unexpected, particularly to locations such as C:\Temp or user profile directories.

  - **Evaluate Account Permissions**: Analyze the permissions of the account that executed the commands to determine potential misuse. High-privileged accounts running these commands should warrant immediate scrutiny.

  - **Determine Legitimate Use Cases**: Investigate if any team members or automation tasks commonly use similar commands for legitimate deployments or updates. Cross-reference with authorized change management tickets or IT operations logs.

  ### Prioritization

  This alert should be categorized with medium severity due to the potential risk of data exfiltration or malware delivery within critical systems. The likelihood of malicious abuse is moderate, particularly in environments where attackers frequently leverage PowerShell for execution. Such behavior is commonly weaponized, particularly in attacks leveraging PowerShell for post-exploitation activities.

  ### Blind Spots and Assumptions

  Detection is limited if PowerShell script block logging is not enabled, potentially allowing malicious actions to go unnoticed. Legitimate activities such as IT operations or maintenance scripts may trigger this alert, leading to false positives. A related detection that may strengthen coverage includes scans for unauthorized network activities or known malicious domain lookups accompanying the alerts.

