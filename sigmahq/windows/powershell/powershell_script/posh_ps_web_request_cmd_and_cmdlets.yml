title: Usage Of Web Request Commands And Cmdlets - ScriptBlock
id: 1139d2e2-84b1-4226-b445-354492eba8ba
related:
- id: 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d
  type: derived
status: test
description: Detects the use of various web request commands with commandline 
  tools and Windows PowerShell cmdlets (including aliases) via PowerShell 
  scriptblock logs
references:
- https://4sysops.com/archives/use-powershell-to-download-a-file-with-http-https-and-ftp/
- https://blog.jourdant.me/post/3-ways-to-download-files-with-powershell
author: James Pemberton / @4A616D6573
date: 2019-10-24
modified: 2025-10-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  filter:
    Path|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  condition: selection and not filter
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and 
  Start-BitsTransfer.
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_web_request_cmd_and_cmdlets/info.yml
note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands and cmdlets that perform web requests, such as `Invoke-WebRequest`, `Invoke-RestMethod`, and their aliases. The likely attacker objective is to download files or exfiltrate data using PowerShell, which is a common tactic used for executing payloads or establishing persistence. This behavior aligns with the MITRE ATT&CK technique T1059.001 (Command and Scripting Interpreter: PowerShell). The primary telemetry source required for detection includes Windows PowerShell script block logs.

  If the behavior is confirmed as malicious, it can lead to data theft, malware installation, or lateral movement within the network. This detection does NOT confirm that an attack is occurring; it merely indicates that potentially suspicious web request commands were executed, which can include both malicious and benign administrative activity.

  ### Investigation Steps

  - **Review script block logs for execution details:** Check PowerShell script block logs (Event ID 4104) for the text that triggered the alert. Look for execution context and anomalies, such as unusual paths or user accounts.

  - **Correlate with process creation events:** Identify any related process creation events (Security Event ID 4688) that reference PowerShell processes initiated. Confirm whether these processes have legitimate parent processes or if they appear to be spawned independently.

  - **Evaluate the source and destination of requests:** Analyze network traffic logs to determine the IP addresses used in the web requests. Match these against known benign domains or internal IPs for context. Suspicious or unknown domains may indicate malicious intent.

  - **Identify legitimate administrative tasks:** Determine whether the detected commands align with expected administrative activities, such as downloading updates or configuration files from trusted sources. Compare timestamps with scheduled maintenance or other known activities.

  - **Look for high-confidence malicious indicators:** Identify if the command includes any parameters indicating an attempt to obfuscate the interaction, such as encoded commands or redirects to potentially malicious URLs.

  - **Assess the security impact of affected systems:** Document affected host roles (e.g., database server, file server) and criticality in the environment. Understand the potential consequences of any malicious exploitation in the context of your organization's assets.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of compromised systems and the high likelihood that such behaviors can be weaponized. Given that attackers frequently use PowerShell for lateral movement and payload delivery, any detected commands warrant immediate investigation.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative uses of PowerShell if not tuned correctly or if Script Block Logging is not enabled. False positives can occur with routine administrative tasks or during automation scripts that utilize the same cmdlets. It's essential to have a baseline of typical PowerShell usage patterns to differentiate between benign and malicious activities. Related detections include monitoring for unusual outbound connections or command execution anomalies that could indicate a broader malicious campaign.

