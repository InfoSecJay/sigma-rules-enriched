title: Usage Of Web Request Commands And Cmdlets - ScriptBlock
id: 1139d2e2-84b1-4226-b445-354492eba8ba
related:
- id: 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d
  type: derived
status: test
description: Detects the use of various web request commands with commandline tools
  and Windows PowerShell cmdlets (including aliases) via PowerShell scriptblock logs
references:
- https://4sysops.com/archives/use-powershell-to-download-a-file-with-http-https-and-ftp/
- https://blog.jourdant.me/post/3-ways-to-download-files-with-powershell
author: James Pemberton / @4A616D6573
date: 2019-10-24
modified: 2025-10-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  filter:
    Path|startswith: 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  condition: selection and not filter
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and Start-BitsTransfer.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of web request commands and cmdlets within PowerShell script block logs. Specifically, it focuses on various methods employed for retrieving resources from the web, such as `Invoke-WebRequest`, `Invoke-RestMethod`, and aliases like `iwr`. The presence of these commands in PowerShell script blocks can indicate nefarious activities, including the download of payloads or exfiltration of data, typically employed during execution phases of an attack.

  Attackers often leverage PowerShell's powerful scripting capabilities to download malicious files hosted on external servers, aiming to expand their foothold or execute additional stages of their attack. In many cases, these actions are part of broader campaigns that utilize web interactions for malware delivery or data exfiltration, aligning with techniques in the MITRE ATT&CK framework. Relevant tactics and techniques include **Execution** (T1059.001) for running scripts and commands, indicating further exploitation potential if detection measures are not in place.

  The primary data sources for spotting these activities would be PowerShell script block logs, which provide detailed insights into executed commands. Enabling Script Block Logging is crucial for this detection to function effectively, as it captures the behavior necessary for identifying malicious activity.

  ### Investigation Steps
  - **Review Script Block Logs:** Examine the PowerShell script block logs where the detected commands were executed. Look for patterns of unauthorized data access or movement toward suspicious external domains.

  - **Check for Whitelisted Commands:** Analyze detected commands against your organization's known legitimate usage. Verify if the commands stem from authorized scripts or training modules for users.

  - **Correlate with Network Traffic:** Cross-reference PowerShell activity with network security logs to unveil any outgoing connections to known malicious IPs or domains linked to the detected web requests.

  - **Investigate Process Creation Events:** Capture process creation events around the same time as the PowerShell executions to identify if associated binary executions (e.g., suspicious executables or scripts) followed the PowerShell commands.

  ### Prioritization
  This alert should be considered medium priority as it indicates potentially harmful PowerShell activity that may lead to data breaches or the execution of malicious payloads. The likelihood of exploitation due to credential theft or unauthorized downloads makes prompt investigation essential.

  ### Blind Spots and Assumptions
  There may be gaps in detecting all possible web request commands since attackers can craft custom methods or leverage alternative scripts that aren't captured by this rule. The logic assumes that Script Block Logging is enabled and operational; without it, this detection would not function properly. Additionally, this rule could generate false positives in cases where legitimate administrative tasks are performed, such as legitimate updates or retrieval commands executed via authorized scripts.

