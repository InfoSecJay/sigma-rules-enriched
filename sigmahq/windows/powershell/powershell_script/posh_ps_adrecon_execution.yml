logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Function Get-ADRExcelComOb'
    - 'Get-ADRGPO'
    - 'Get-ADRDomainController'
    - 'ADRecon-Report.xlsx'         # Default
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of ADRecon.ps1, a PowerShell script known for performing Active Directory reconnaissance tasks. Its primary purpose is to gather and analyze information about an organization's Active Directory environment, including group policies and domain controllers. This is indicative of an adversary's objective to map the network and understand its structure, which is a preparatory step for later exploitation or lateral movement. The relevant MITRE ATT&CK tactic is **Discovery** with technique **T1059.001: Command and Scripting Interpreter: Windows PowerShell**.

  The primary telemetry source is PowerShell script execution logs, specifically requiring Script Block Logging to be enabled. If detected, this activity poses a significant security risk as it signals an adversary is actively probing the environment, potentially laying the groundwork for further malicious actions. Importantly, this detection does not confirm that the activity is malicious on its own; legitimate administrative tasks may involve similar PowerShell commands.

  ### Investigation Steps

  - **Identify script execution details**: Review PowerShell logs for Event ID 4104 related to Script Block Logging. Look for occurrences of `Function Get-ADRExcelComOb`, `Get-ADRGPO`, or `Get-ADRDomainController` in `Message` fields. Confirm multiple executions in a short time frame are suspicious.

  - **Review execution context**: Assess who executed the PowerShell script. Check the `Account Name` and compare it with known personnel or services. Legitimate business roles, such as an admin performing AD queries during regular maintenance, should appear in the context of the activity.

  - **Cross-reference with process creation logs**: Investigate Event ID 4688 from Security logs to see if a PowerShell process spawned the script. Look for parent processes, especially interactive user sessions or known administrative tools that could indicate benign behavior versus exploitation scenarios.

  - **Examine file creation artifacts**: Check for the presence of `ADRecon-Report.xlsx` in common directories (like `C:\Users\Public\Documents\` or user profile directories) following the script execution timeline. The creation of this report in an unexpected user context raises flags for potential data exfiltration.

  - **Assess for lateral movement signs**: Conduct a review of network activity logs to identify unusual connections initiated from the system running the script. Look for anomalous or unscheduled outbound connections on ports commonly used for LDAP (TCP 389) or SMB (TCP 445).

  ### Prioritization

  The severity of this alert is high as it indicates potential reconnaissance by an adversary, particularly one with links to threats like FIN7, focused on gathering sensitive organizational information. Active Directory environments are critical, and exploitation could lead to heightened privileges and lateral movement within the network.

  ### Blind Spots and Assumptions

  One detection limitation is that PowerShell logging can be disabled or bypassed, so the absence of logs could mask malicious activities. Proper configurations of Script Block Logging are required for effective detection. Legitimate administrative scripts or penetration testing activities could trigger this alert as well. To bolster coverage, consider companion detections focusing on unusual outbound traffic or failed login attempts following the script execution, which can indicate attempted exploitation.

