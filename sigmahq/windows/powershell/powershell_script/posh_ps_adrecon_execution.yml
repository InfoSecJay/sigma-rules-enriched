logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Function Get-ADRExcelComOb'
    - 'Get-ADRGPO'
    - 'Get-ADRDomainController'
    - 'ADRecon-Report.xlsx'         # Default
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of the `ADRecon.ps1` PowerShell script, which is commonly used for Active Directory reconnaissance. The suspected threat actor behind this behavior is the FIN7 group, known for their sophisticated cyber-attacks often targeting financial and retail sectors. The script is designed to enumerate various Active Directory objects, including Group Policy Objects (GPOs), domain controllers, and organizational units. This activity can indicate a preparation phase for a more extensive attack, where adversaries gather information to identify weaknesses and plan lateral movement.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Discovery (TA0007)**
    - **Active Directory Discovery (T1087)**
    - **Permission Groups Discovery (T1069)**
  - **Execution (TA0002)**
    - **Command-Line Interface (T1059.001)**

  Primary data sources that will contain the best evidence for this detection include:
  - Windows PowerShell script block logging, which must be enabled to capture script execution details.
  - Event logs related to PowerShell activity, which can provide context about the invocation of the script.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs to identify instances of `ADRecon.ps1` execution and any output generated during its run.
  - **Analyze Process Creation Events:** Look into process creation logs to identify the parent process that initiated the PowerShell script, as well as any subsequent processes spawned by it.
  - **Inspect Network Activity:** Check for any unusual network connections or data exfiltration attempts correlating with the execution timeline of the `ADRecon.ps1` script.
  - **Evaluate User Activity:** Validate the context of the user account that executed the script. Look for anomalies such as privilege levels or unusual login patterns.

  ### Prioritization
  This alert is classified as high severity because the execution of reconnaissance tools like `ADRecon.ps1` often signifies preparatory steps for a potential data breach or network compromise. The likelihood of abuse by threat actors like FIN7 makes this detection critical for timely response actions.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where PowerShell script block logging is not enabled, leading to missed detections of script executions. The detection logic assumes that the `ADRecon.ps1` script will be executed in a recognizable form and that there are no obfuscation techniques applied. Proper configuration of logging settings and enabling of detailed PowerShell logging is necessary for this alert to function effectively.

