note: |
  ### Technical Context
  This detection rule identifies potential keylogger activity by monitoring PowerShell scripts that utilize functions associated with keystroke capturing. The main objective of such scripts is typically to intercept user inputs without consent, thereby allowing an attacker to harvest sensitive information such as passwords, personal data, and other confidential information. This behavior is particularly dangerous as it can lead to further compromises, including unauthorized access to accounts and systems.

  The relevant MITRE ATT&CK tactics for this detection include **Collection (TA0009)**, as it targets the gathering of sensitive data from user inputs, and **Credential Access (TA0006)**, as keyloggers are often used to facilitate the theft of credentials through capturing input data. The specific technique involved is **Input Capture (T1056.001)**, which details methods for capturing user input programmatically.

  To effectively capture this activity, the primary data sources include PowerShell script logs, specifically those generated when **Script Block Logging** is enabled. This logging can provide insights into PowerShell commands executed on the system, facilitating the identification of malicious scripts that exhibit keystroke capturing functionality.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine recorded PowerShell script execution logs for entries that include the `ScriptBlockText` containing references to `[Windows.Input.Keyboard]::IsKeyDown([System.Windows.Input.Key]::`. Pay special attention to the context of script execution and user activity around the time of detection.

  - **Analyze Running Processes**: Check the system for any running PowerShell processes that could correlate with the identified script. Investigate the parent processes to identify if the script was started from a suspicious source or by an irregular user account.

  - **Inspect User Input Activity**: Gather and analyze logs or telemetry that might show unusual user input patterns, especially around the time of script execution. This might help to assess whether sensitive information was potentially captured.

  - **Validate Environment Configuration**: Ensure that Script Block Logging is enabled across the enterprise environment to maintain consistent detection coverage moving forward. Review group policy settings or individual security configurations to confirm compliance.

  ### Prioritization
  The medium severity of this alert stems from the potential impact of a keylogger on user credentials and overall system security, coupled with the prevalent use of PowerShell as an attack vector in modern cyberattacks. While the likelihood of keylogger deployment may vary based on targeted attack vectors, any detection of such behavior warrants prompt investigation.

  ### Blind Spots and Assumptions
  A notable blind spot in this detection is the reliance on the presence of Script Block Logging; if it is not enabled, the detection will not function as intended. Additionally, the rule assumes that any PowerShell script containing the specified keystroke function is malicious, potentially leading to false positives if legitimate applications use similar scripting techniques. To ensure efficacy, organizations should have policies in place that enforce Script Block Logging and regularly audit PowerShell usage across all endpoints.

