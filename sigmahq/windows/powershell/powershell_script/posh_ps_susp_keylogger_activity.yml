note: |
  ### Technical Context

  This rule detects PowerShell scripts that reference keystroke capturing functions, specifically focusing on instances where the `IsKeyDown` method from the `System.Windows.Input.Keyboard` class is invoked. The likely objective of an attacker using this technique is to capture sensitive user input, such as credentials, for unauthorized access to systems. This behavior is aligned with the MITRE ATT&CK framework, specifically under the tactic of Collection (ID: TA0009) and the technique of Input Capture (ID: T1056.001).

  The primary telemetry source for this detection is through Windows PowerShell Script Block Logging, which captures script execution details, allowing for the identification of potentially malicious behavior. If successful, this could lead to credential theft or further unauthorized actions within the environment. However, it’s important to note that this detection does NOT confirm that keystroke logging is successfully occurring or that malicious intent is present solely based on the referenced functions.

  ---

  ### Investigation Steps

  - **Review the detected PowerShell script content:** Cross-reference the script block content against known malicious patterns and documents related to keystroke capturing. Focus on Event ID 4104 for PowerShell logs to see the details of the block that triggered the alert.

  - **Verify the execution context of the script:** Check for the user and process context that executed the PowerShell script. Use Event ID 4688 (Process Creation) to see if it was triggered from a known administrative process or an unusual source.

  - **Identify related network activity:** Analyze outbound connections made following the script execution using Windows Firewall logs or Process Monitor. Look for unusual connections to suspicious IP addresses or domains post-execution which could indicate data exfiltration.

  - **Correlate with legitimate behavior:** Identify patterns of legitimate PowerShell usage within your environment by reviewing historical logs around common user actions related to legitimate applications using the same methods (e.g., application automation scripts). Ensure users aren't executing benign scripts that include these functions unintentionally.

  - **Evaluate Anti-virus/EDR alerts:** Investigate if any endpoint protection solutions flagged the execution of the PowerShell script. Review relevant EDR alerts focusing on keylogger activity or any behavioral detection around the executed file.

  ---

  ### Prioritization

  This alert is of medium severity, as the potential impact involves credential compromise from a system that could lead to unauthorized access across sensitive assets. The likelihood of malicious abuse is moderate, given that keystroke logging is a common tactic used in credential theft attacks. While not uncommon, this behavior is generally context-specific and should be further investigated to confirm malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement that Script Block Logging is enabled; without this, keylogging attempts may go undetected. Legitimate applications that utilize PowerShell for automation might inadvertently trigger this alert, and false positives may occur if the script accesses keyboard functions without malicious intent. A companion detection to consider is monitoring for anomalous user behavior or abnormal PowerShell command usage that deviates from established baselines.

