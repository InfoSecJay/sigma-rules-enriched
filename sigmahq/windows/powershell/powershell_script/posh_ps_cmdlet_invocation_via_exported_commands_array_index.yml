title: PowerShell Dynamic Module Invocation Via ExportedCommands Array Index - 
  PS Script
id: 4ff4ad3e-9fb5-4a70-9962-d6ea58090318
related:
- id: 0c3ebe9f-df09-4e00-be0f-73d4ca8d62f6
  type: similar
status: experimental
description: |
  Detects obfuscated PowerShell scripts that enumerate Microsoft.PowerShell.Utility exported commands
  and invoke cmdlets indirectly by array index. This can be used to evade detections
  that look for explicit strings such as Invoke-RestMethod or Invoke-Expression.
references:
- https://www.linkedin.com/posts/mark-o-halloran1_clickfix-defense-evasion-tactic-today-i-ugcPost-7453463467736408064-snrp/
author: Norbert Jaśniewicz (AlphaSOC)
date: 2026-10-06
tags:
- attack.execution
- attack.stealth
- attack.t1027
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_module_export_enum:
    ScriptBlockText|contains:
    - 'Get-Module '
    - 'gmo '
    ScriptBlockText|contains|all:
    - 'ListAvailable'
    - 'Microsoft.PowerShell.Utility'
    - 'ExportedCommands'
    - 'Values'
  selection_index_used:
    ScriptBlockText|contains: '[*]'
  condition: all of selection_*
falsepositives:
- Legitimate use of exported commands array indexing in PowerShell scripts 
  (should be rare)
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_cmdlet_invocation_via_exported_commands_array_index/info.yml
note: |
  ### Technical Context

  This rule detects the indirect invocation of PowerShell cmdlets using the `ExportedCommands` array index from the `Microsoft.PowerShell.Utility` module. This technique is often employed by attackers to evade detection mechanisms that look for explicit command strings like `Invoke-RestMethod` or `Invoke-Expression`. The likely attacker objective is to execute malicious code while minimizing the chance of being flagged by standard detection systems. This activity aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry sources are PowerShell script logs, specifically those generated by Script Block Logging, crucial for capturing the dynamic invocation. If malicious, this behavior can lead to unauthorized data exfiltration or execution of further malicious payloads. However, this detection alone does not confirm the intent behind the PowerShell script, as it may originate from benign scripts employing similar methodologies.

  ### Investigation Steps

  - **Review Script Block Logs:** Examine PowerShell logs for Event ID 4104. Look for entries containing `Get-Module` and `ExportedCommands`, indicative of this technique being employed. Compare with known good behavior for PowerShell scripts in your environment.

  - **Identify Array Index Usage:** Search for patterns where `[*]` is used within `ScriptBlockText`. This is a clear indicator of cmdlet invocation via array indexing. If found alongside malicious or suspicious context, it strengthens the likelihood of nefarious intent.

  - **Evaluate Script Context:** Determine the source and execution context of the PowerShell script, such as its origin (user, automated task, scheduled job). Valid usage might include administrative scripts in controlled contexts, while malicious indicators could include execution from unexpected users or machines.

  - **Monitor for Remote Connections:** If additional logs are available, like network activity (Event ID 5156), investigate any outbound connections initiated by PowerShell. A connection to unusual IP addresses after using this detection could suggest data exfiltration attempts.

  - **Correlate with Additional Detections:** Cross-reference with alerts from companion detection rules, such as those detecting network anomalies following PowerShell executions. This can provide additional context and evidence of malicious activity.

  ### Prioritization

  This alert holds medium severity given that typical Windows environments may see legitimate PowerShell usage, but the likelihood of malicious exploitation is notable, especially in systems with sensitive data. The technique is frequently weaponized in phishing and post-exploitation scenarios, necessitating timely investigation.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques or renaming of cmdlets, allowing an adversary to evade this rule. It requires Script Block Logging to be enabled for effective detection, which may not be uniformly configured across all assets. Legitimate activities may include rare or complex administrative commands that utilize array indexing in PowerShell. A related detection to enhance coverage could address direct calls to `Invoke-RestMethod`, as it may indicate a follow-on action after using obfuscated methods.

