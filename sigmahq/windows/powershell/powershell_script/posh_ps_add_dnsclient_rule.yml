title: Powershell Add Name Resolution Policy Table Rule
id: 4368354e-1797-463c-bc39-a309effbe8d7
status: test
description: |
  Detects powershell scripts that adds a Name Resolution Policy Table (NRPT) rule for the specified namespace.
  This will bypass the default DNS server and uses a specified server for answering the query.
references:
- https://twitter.com/NathanMcNulty/status/1569497348841287681
- https://learn.microsoft.com/en-us/powershell/module/dnsclient/add-dnsclientnrptrule?view=windowsserver2022-ps
author: Borna Talebi
date: 2021-09-14
modified: 2022-10-09
tags:
- attack.impact
- attack.t1565
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Add-DnsClientNrptRule'
    - '-Namesp'
    - '-NameSe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that add a Name Resolution Policy Table (NRPT) rule. This behavior allows an adversary to bypass the default DNS settings, potentially redirecting DNS queries to a specified malicious server. The objective may be to manipulate network traffic, exfiltrate data, or evade detection by controlling how DNS queries are resolved. The relevant MITRE ATT&CK technique is **T1565.001 - Data Manipulation: DNS Spoofing**. Primary telemetry sources include PowerShell script logs (Event ID 4103) and Windows Security logs with enabled script block logging. The security impact of a successful exploitation could lead to data exposure, credential theft, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative activities may trigger this alert.

  ### Investigation Steps

  - **Review PowerShell execution logs:** Check for Event ID 4103 which details the PowerShell script's execution. Look specifically for instances containing `Add-DnsClientNrptRule` to confirm potential malicious activity.

  - **Inspect Script Block Logging:** Validate the script block logs for the presence of command arguments such as `-Namesp` and `-NameSe`. If the namespace is not known or trusted, it may indicate a malicious intent.

  - **Assess network configurations:** Evaluate the configuration of the affected host, noting any recent changes to the NRPT settings. Legitimate scenarios may include entries with known trusted namespaces for internal applications.

  - **Monitor for subsequent DNS traffic:** Utilize DNS query logs to identify if the system is directing traffic to an unexpected DNS server. Malicious indicators include DNS queries to IP addresses outside of known internal or trusted external DNS servers.

  - **Identify asset criticality:** Determine if the affected system is a critical asset such as a server handling sensitive data. Increased scrutiny will be required if the alert originates from such a system.

  ### Prioritization

  The severity of this alert is high due to the potential impact on network integrity and the likelihood of malicious abuse. The ability to manipulate DNS settings can lead to significant compromises in an enterprise environment. This behavior is often weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  This detection may have limitations as legitimate administrative changes to DNS settings could also trigger the alert. Expediting detection requires ensuring script block logging is universally enabled across all endpoint systems. Additionally, applications performing their own DNS configuration may also generate similar alerts. Related detections include monitoring DNS queries for unusual patterns or entries pointing to potentially malicious servers, reinforcing the effectiveness of the overall monitoring strategy.

