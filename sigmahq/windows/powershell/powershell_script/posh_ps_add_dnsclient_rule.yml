title: Powershell Add Name Resolution Policy Table Rule
id: 4368354e-1797-463c-bc39-a309effbe8d7
status: test
description: |
  Detects powershell scripts that adds a Name Resolution Policy Table (NRPT) rule for the specified namespace.
  This will bypass the default DNS server and uses a specified server for answering the query.
references:
- https://twitter.com/NathanMcNulty/status/1569497348841287681
- https://learn.microsoft.com/en-us/powershell/module/dnsclient/add-dnsclientnrptrule?view=windowsserver2022-ps
author: Borna Talebi
date: 2021-09-14
modified: 2022-10-09
tags:
- attack.impact
- attack.t1565
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Add-DnsClientNrptRule'
    - '-Namesp'
    - '-NameSe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell scripts that add a Name Resolution Policy Table (NRPT) rule. This behavior is significant because it enables an attacker to redirect DNS queries from the default DNS server to a specified server, potentially facilitating domain fronting or stealthy command-and-control (C2) communication. By manipulating DNS resolution, an attacker’s objective may include evading detection, exfiltrating data, or escalating privileges through misconfigured or unsecured DNS queries.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Impact** (TA0040), specifically the technique **DNS Spoofing** (T1565). Attackers may use this technique to disguise their activities by controlling the DNS resolution process, which is a critical element in many attacks involving lateral movement or accessing sensitive information without detection.

  Primary data sources for this detection include **PowerShell script logs**, specifically Script Block Logging, which must be enabled to capture the execution of these commands. Additionally, examining DNS query logs can provide insights into any suspicious activity related to newly added NRPT rules.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell script logs for instances of `Add-DnsClientNrptRule` being executed. Look for unusual patterns or scripts that appear to be executed by non-administrative users.
  - **Analyze DNS Query Logs**: Examine DNS logs to identify if there are any anomalous queries being routed to unexpected DNS servers as a consequence of the new NRPT rule. This can indicate potential malicious activities.
  - **Inspect Network Traffic**: Look for outgoing traffic to the specified DNS servers. Unusual or unexpected DNS traffic may suggest malicious intent or command-and-control communications.
  - **Validate Script Execution Context**: Determine who executed the PowerShell script and under what context. Assess whether it aligns with legitimate operational needs or indicates unauthorized activity.

  ### Prioritization
  This alert is categorized as high severity due to the potential for covert surveillance, data exfiltration, or manipulation of internal network actions. The ability to redirect DNS queries poses a significant risk in an enterprise environment, making it critical to respond promptly.

  ### Blind Spots and Assumptions
  This detection rule assumes that Script Block Logging is enabled; without it, there may be gaps in visibility relating to PowerShell executions. Additionally, false positives may arise from legitimate administrative actions that involve modifying DNS settings. Organizations should ensure comprehensive logging and monitoring of PowerShell usage and DNS activities to enhance detection capabilities.

