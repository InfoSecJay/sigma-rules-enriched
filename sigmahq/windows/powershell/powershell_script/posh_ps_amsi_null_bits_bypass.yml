note: |
  ### Technical Context

  This Sigma rule detects the usage of special strings or null bits in PowerShell scripts, which may indicate attempts to bypass the Anti-Malware Scan Interface (AMSI) functionality. The likely attacker objective is to execute malicious scripts without detection by security mechanisms. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the specific technique **Obfuscated Files or Information** (T1027).

  The primary telemetry source for this detection is PowerShell Script Block Logging, which must be enabled on the system to capture relevant log events. If successfully exploited, the impact could involve undetected execution of malware or unauthorized actions within the environment. Importantly, detection of this behavior does NOT confirm malicious intent on its own; further context is necessary to evaluate the legitimacy of the observed scripts.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Check for Event ID 4104 in the Windows event logs. Look for script blocks containing null-bit strings such as `"if(0){{{0}}}' -f $(0 -as [char]) +"` or `"#<NULL>"`. Malicious scripts may attempt to obfuscate their content to avoid detection.

  - **Identify Execution Context**: Determine the user context and environment variables associated with the PowerShell execution. Analyze fields such as `UserID`, `ScriptBlockText`, and `Path` from Event ID 4104 logs. Scripts run by high-privilege accounts or from unexpected locations are higher risk.

  - **Check for AMSI Bypass Indicators**: Analyze additional PowerShell logs (Event ID 4103) for context on Module and Command execution. Look for signs of known obfuscation techniques or patterns associated with AMSI bypass. Legitimate administrative scripts typically do not use these patterns.

  - **Correlate with Process Creation Events**: Examine Event ID 4688 for any new process creation events around the same time the PowerShell scripts were executed. Look for processes that would suggest unusual activity, such as the execution of cmd.exe or powershell.exe with suspicious command-line parameters.

  - **Validate Against Known Baselines**: Compare discovered PowerShell executions to established baselines within the environment. Look for unusual frequency, deviations from normal behaviors, or user profiles that typically do not execute such scripts.

  - **Identify Companion Detections**: Review any alerts from related detection rules for suspicious behavior that may correlate with this detection (e.g., related events triggered by other obfuscation techniques or bypass attempts). This includes looking for any Security Event ID 4688 associated with known bad executables or scripts.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on systems that may interpret bypassed AMSI protections as compromised. The likelihood of malicious abuse is significant, as this technique is increasingly weaponized by adversaries to conduct silent malicious operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of PowerShell logging; if script block logging is not enabled, events will not be captured. Legitimate activities, such as administrative scripts for system management, may trigger this alert, particularly if they utilize obfuscation. A related detection rule to consider includes monitoring for the usage of `Invoke-Expression` (T1059.001), which may indicate additional potential for command injection or obfuscation tactics.

