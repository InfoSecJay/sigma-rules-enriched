note: |
  ### Technical Context
  This detection rule identifies potential attempts to bypass Windows AntiMalware Scan Interface (AMSI) using specific obfuscation techniques that include null characters or other special strings injected into scripts. Attackers often leverage such techniques to evade detection mechanisms present in security solutions, thereby executing malicious scripts undetected. The objective behind using AMSI bypass techniques typically involves executing malicious PowerShell scripts, potentially leading to further exploitation within the environment.

  Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (TA0005)**, specifically the technique **Obfuscated Files or Information (T1027)** and the sub-technique **Bypass Microsoft Defender Antivirus (T1562.001)**. The primary data source for this detection is PowerShell script block logs, which can provide visibility into the execution of PowerShell scripts, especially when Script Block Logging is enabled.

  ### Investigation Steps
  - **Review Script Block Logs:** Examine PowerShell script block logs for any execution of scripts containing the identified obfuscation patterns. Look for any anomalies or scripts executed at unusual times.

  - **Analyze Process Creation Events:** Investigate related process creation events to determine the context in which the suspicious PowerShell scripts executed, including any parent-child relationships with legitimate processes.

  - **Correlate with Endpoint Behavior:** Check endpoint detection and response (EDR) data (if available) for any unusual behavior associated with the user or machine running the script, focusing on file modifications or network requests that coincide with script execution.

  - **Assess for Previous Alerts:** Look back through previous alerts or logs to determine if there has been any similar activity or patterns within the environment that might indicate a broader attempt at evading detection through script obfuscation.

  ### Prioritization
  Alerts generated by this rule should be treated with a medium priority due to the potential risk posed by evaded AMSI checks, which could facilitate further malicious actions if left unchecked. The likelihood of exploitation through these techniques necessitates timely investigation.

  ### Blind Spots and Assumptions
  This detection rule presumes that Script Block Logging is enabled on all relevant endpoints; without it, no logs will capture the obfuscated PowerShell scripts necessary for this detection. Additionally, there could be instances where benign scripts utilize similar obfuscation methods, leading to false positives. The coverage may also miss other evasion techniques not represented within the specified patterns.

