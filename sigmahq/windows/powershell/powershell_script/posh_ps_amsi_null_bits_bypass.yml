  ---

  ### Technical Context

  This rule detects the use of null bits and special strings in PowerShell scripts, which may indicate attempts to bypass Anti-Malware Scanning Interface (AMSI) protections. The likely objective for an attacker employing this technique is to execute malicious scripts without detection by traditional security tools. This behavior aligns with the MITRE ATT&CK tactic for Defense Evasion (T1562.001: Impair Defenses - Disable or Modify Tools).

  The primary telemetry sources required include Windows PowerShell logs, specifically those with Script Block Logging enabled (Event ID 4104). If malicious, the security impact can involve the execution of payloads that evade detection, facilitating further compromise. Importantly, this detection does NOT confirm that a malicious action was successfully executed; it merely identifies potential attempts to evade defenses.

  ---

  ### Investigation Steps

  - **Review the PowerShell log entries:**
    Inspect Security Event ID 4104 for instances of the ScriptBlockText containing `if(0){{{0}}}' -f $(0 -as [char]) +` or `#<NULL>`. Malicious scripts often attempt to obfuscate code using these patterns.

  - **Correlate process execution:**
    Verify if the identified script execution corresponds with recent process creation logs (Event ID 4688) to ascertain if it was run in a suspicious context, such as from user profiles with unnecessary access or during unusual hours.

  - **Identify the originating scripts:**
    Check the script path and parameters passed to PowerShell; legitimate administrative scripts typically reside in controlled locations (e.g., `C:\Windows\System32\WindowsPowerShell\v1.0\`), whereas opportunistic or attacker-owned scripts may appear from user directories.

  - **Look for payload execution:**
    Identify subsequent log artifacts or payload indicators, such as file creation events (e.g., Event ID 4656) where malicious files may have been created as a result of the bypass. High-confidence indicators could include newly created executables in suspicious directories (e.g., Temp).

  - **Compare with baseline expectations:**
    Establish a baseline of normal PowerShell usage within your environment. Legitimate administrative tasks often show clear scripting patterns and categorized use cases that differ from the obfuscated nature indicated by this alert.

  - **Explore user context and role:**
    Analyze the user context in which the scripts run. If they are executing under non-administrative or unexpected accounts and roles, this raises the risk factor significantly.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact of system compromise via undetected threats. The likelihood of malicious abuse is elevated as attackers frequently target AMSI for evasion. However, exploitation attempts can stem from various legitimate administrative scripts, necessitating cautious analysis before concluding malicious intent.

  ---

  ### Blind Spots and Assumptions

  This detection may miss attempts where logs are not available or if Script Block Logging is disabled; thus, enabling event logging is critical for reliable detection. Legitimate scenarios such as obfuscation used in benign scripts or compatibility layers in legacy systems may falsely trigger this alert. A related detection for comprehensive coverage would involve looking for unusual command line arguments in conjunction with suspicious script executions.

