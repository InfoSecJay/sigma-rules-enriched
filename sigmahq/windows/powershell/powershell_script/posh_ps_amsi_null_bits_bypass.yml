note: |
  ### Technical Context

  This Sigma rule detects the usage of special strings and null bits in PowerShell scripts, which can be indicative of attempts to bypass the Antimalware Scan Interface (AMSI). Attackers may employ these techniques to obfuscate their payloads, aiming to circumvent security measures while executing malicious scripts. This behavior fits within the MITRE ATT&CK framework under the tactic "Defense Evasion" (ID: TA0005) and specifically technique "Obfuscated Files or Information" (ID: T1562.001).

  Primary telemetry sources required for this detection include PowerShell script logs that are generated when script block logging is enabled (often seen in Event ID 4104). If this activity is malicious, it can indicate ongoing attempts at evasion, potentially leading to further compromise within the environment. However, this detection does not confirm the execution of malicious code on its own, as legitimate scripts may also create similar patterns.

  ### Investigation Steps

  - **Examine PowerShell Script Block Logs:** Review Event ID 4104 for the presence of script block logs that contain targeted obfuscation patterns (e.g., "if(0){{{0}}}' -f $(0 -as [char]) +"). Identify occurrences of these strings and the associated command executed.

  - **Identify Process Creation Links:** Check for related Process Creation events (Event ID 4688) that associate with the PowerShell process, filtering for command line arguments that indicate script execution. Compare with known benign processes to assess legitimacy.

  - **Analyze Execution Context:** Investigate the account used to run the script (check User fields in Event ID 4104 or powershell.exe process logs) to determine if it is a service or administrator account commonly used for automation versus a standard user account.

  - **Assess the Environment:** Verify whether Script Block Logging is indeed enabled across your environment, as its absence could render this detection ineffective. Ensure that security policies enforcing this logging are in place.

  - **Review Historical Behavior:** Compare the current script execution with historical profiles of behavior on the host or user account to identify any anomalous spikes or changes in script execution patterns that may suggest compromised activity.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact is potentially significant if an adversary successfully bypasses AMSI and executes malicious scripts, leading to data compromise or further infiltration. The likelihood of malicious abuse is moderate as such evasion techniques are increasingly weaponized in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate use of obfuscation in administrative scripts or complex automation tasks, which may also trigger this rule. Required logging configurations like enabling PowerShell Script Block Logging and transcription are critical for robust detection. Legitimate activities may consist of automated maintenance scripts or complex PowerShell commands that utilize similar syntax. A companion detection to consider includes monitoring for unusual PowerShell module imports (related to the same AMSI evasion tactics), which complements the coverage of potentially malicious activities.

