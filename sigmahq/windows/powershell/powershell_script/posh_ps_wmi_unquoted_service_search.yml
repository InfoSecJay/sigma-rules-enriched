detection:
  selection:
    ScriptBlockText|contains:
    - 'Get-WmiObject '
    - 'gwmi '
    ScriptBlockText|contains|all:
    - ' Win32_Service '
    - 'Name'
    - 'DisplayName'
    - 'PathName'
    - 'StartMode'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of Windows Management Instrumentation (WMI) through PowerShell scripts aimed at enumerating services with unquoted service paths. Typically, attackers utilize this method to discover potential paths that could be manipulated for privilege escalation, targeting services with spaces in their executable paths. This behavior aligns with the MITRE ATT&CK technique for execution (T1047).

  The primary telemetry source is Windows PowerShell with required log types including PowerShell Script Block Logging. If malicious, the execution of such commands could lead to unauthorized privilege escalation or lateral movement within the network. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities can also generate similar WMI queries.

  ### Investigation Steps

  - **Check Script Block Logging events:** Review Windows Event ID 4104 for PowerShell incidences containing 'Get-WmiObject' or its aliases. Look for unusual execution patterns or timing that diverges from typical administrative behavior.

  - **Identify legitimate usage:** Verify the context of similar WMI queries made by authorized users. Typical administrative tasks might include service management or system health checks focusing on a known set of services.

  - **Look for high-confidence indicators:** Examine logs for suspicious command strings containing 'Win32_Service', 'Name', 'DisplayName', 'PathName', or 'StartMode'. Any unauthorized execution context (e.g., non-administrative accounts performing these lookups) is a strong malicious indicator.

  - **Correlate with user accounts:** Analyze the event context with user account privilege levels. Determine if the user account executing the query has administrative rights or if it appears abnormal for the user’s role based on historical data from Event ID 4624 (Logon).

  - **Investigate process lineage:** Use Sysmon Event ID 1 to trace the process tree, identifying any related PowerShell or WMI processes that could indicate lateral movement or privilege escalation following this query.

  - **Cross-reference with threat intelligence:** Use the references in the Sigma rule to ascertain if the identified scripts are known for malicious use. This could provide context for recent attacks or trends in your environment.

  ### Prioritization

  This alert is considered medium severity due to the potential for privilege escalation through the enumeration of service paths. The likelihood of abuse is moderately high, particularly in environments with sensitive data or critical infrastructure. This behavior is weaponized by adversaries, especially during phishing or targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled or configured correctly, allowing malicious activities to go unnoticed. Legitimate administration tasks, such as troubleshooting or auditing service configurations, may trigger this alert. A related detection to strengthen coverage is monitoring for processes executed by non-administrative accounts that appear to leverage unauthorized scripts or commands, as this could indicate an escalating threat.

