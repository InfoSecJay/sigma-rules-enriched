  ---

  ### Technical Context

  This rule detects the use of PowerShell scripts that utilize Windows Management Instrumentation (WMI) commands to enumerate unquoted service paths. Attackers often exploit unquoted service paths during reconnaissance to identify services that can be targeted for privilege escalation. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Command-Line Interface (T1059)**, specifically **Windows Command Shell (T1059.003)**.

  Primary telemetry sources include Windows PowerShell Script Block Logging and WMI event logs. The potential security impact of such scripts lies in their capability to facilitate privilege escalation if an unquoted service path vulnerability is identified. It is important to note that this detection does not confirm malicious intentions on its own, as legitimate administrative scripts may perform similar actions.

  ---

  ### Investigation Steps

  - **Assess Script Content:** Review the last 30 minutes of PowerShell logs for Script Block Logging events (Event ID 4104). Look for any scripts containing 'Get-WmiObject', 'gwmi', 'Win32_Service', 'Name', 'DisplayName', 'PathName', or 'StartMode'. Benign use may include administrative tasks or maintenance scripts.

  - **Identify Execution Context:** Determine the user context in which the PowerShell command was executed. Investigate the username and group memberships to assess if the action was performed by a privileged user, increasing the likelihood of malicious activity.

  - **Cross-reference Service Paths:** Using the listed service paths gathered from the detected scripts, cross-reference against active services using the Services console or via `Get-Service` commands. Identify any unquoted paths that could be exploited by an attacker.

  - **Monitor Host Activity:** Inspect the Sysmon logs (Event ID 1) for any abnormal process creations that may have followed the PowerShell script execution, especially looking for suspicious parent-child relationships that could indicate exploitation attempts.

  - **Validate Legitimate Activity:** Identify any known administrative maintenance schedules or tools that might invoke similar WMI queries for legitimate reasons. Documenting such instances could help contextualize the alert and reduce incident response workload.

  ---

  ### Prioritization

  The alert should be treated with medium severity due to the implications of service path misconfiguration on privileged access. Although the specific behaviors detected can be part of common administrative tasks, their association with reconnaissance activities elevates the need for careful assessment. Such behavior is known to be weaponized by adversaries for exploitation.

  ---

  ### Blind Spots and Assumptions

  There may be limitations in detecting all instances of reconnaissance using this method, as it depends heavily on the proper configuration of PowerShell logging. Additionally, legitimate administrative scripts could trigger the rule. Monitoring for similar WMI-related activities through additional detections, such as script-based queries or service enumeration activities, could enhance overall detection efficacy.

