note: |
  ### Technical Context
  This detection rule identifies the use of Windows Management Instrumentation (WMI) through PowerShell scripts to enumerate unquoted service paths on Windows systems. Attackers often leverage methods like these to gather information about services that may be exploited for privilege escalation or lateral movement within a network. By detecting calls to the `Get-WmiObject` or its alias `gwmi` focusing on service properties, the rule targets a common reconnaissance technique used by both malicious actors and penetration testers.

  The relevant MITRE ATT&CK tactics and techniques for this rule include:
  - **Tactic:** Reconnaissance (TA0043)
  - **Technique:** Windows Management Instrumentation (T1047)

  Primary data sources for this detection include PowerShell script execution logs, specifically Script Block Logging, which captures the actual PowerShell commands executed and provides visibility into the use of WMI for service enumeration.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs to identify the execution of commands related to `Get-WmiObject`, `gwmi`, and queries for the `Win32_Service` class within the timeframe of the alert.
  - **Analyze Unusual Service Configuration:** Investigate any identified unquoted service paths for potential exploitation. Look for services with paths that contain spaces without quotation marks, which could be susceptible to arbitrary code execution.
  - **Check for Privilege Escalation Attempts:** Assess any associated logs for signs of privilege escalation, such as modifications to service configurations or creation of scheduled tasks following the WMI queries.
  - **Correlate with other Logs:** Cross-reference PowerShell execution logs with Windows Security Event logs and Sysmon logs to identify any preceding or subsequent suspicious activity, such as failed logins or unexpected process creations.

  ### Prioritization
  This alert is considered of medium severity due to the potential implications of WMI-based enumeration leading to privilege escalation. While reconnaissance alone may not indicate immediate harm, it serves as a precursor to more malicious activity, necessitating a quick investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection if Script Block Logging is not enabled across all endpoints, as this is a requirement for the detection logic to function effectively. Additionally, the alert assumes that all legitimate administration tasks are correlated and that users with elevated access are not executing reconnaissance commands for benign purposes. Organizations should ensure comprehensive logging is in place for all PowerShell activities to enhance detection capabilities.

