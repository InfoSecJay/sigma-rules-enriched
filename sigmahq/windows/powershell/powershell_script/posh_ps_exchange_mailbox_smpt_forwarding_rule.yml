title: Suspicious PowerShell Mailbox SMTP Forward Rule
id: 15b7abbb-8b40-4d01-9ee2-b51994b1d474
status: test
description: Detects usage of the powerShell Set-Mailbox Cmdlet to set-up an SMTP
  forwarding rule.
references:
- https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-26
tags:
- attack.exfiltration
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Set-Mailbox '
    - ' -DeliverToMailboxAndForward '
    - ' -ForwardingSmtpAddress '
  condition: selection
falsepositives:
- Legitimate usage of the cmdlet to forward emails
level: medium
note: |
  ### Technical Context
  This rule detects suspicious usage of the PowerShell `Set-Mailbox` Cmdlet that sets up SMTP forwarding rules for mailboxes in Microsoft Exchange. The likely scenario involves attackers attempting to exfiltrate sensitive email data by redirecting mailbox messages to external SMTP addresses. By leveraging this cmdlet, an attacker can discreetly manipulate email delivery settings, creating a pathway to siphon confidential information without arousing immediate suspicion.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Exfiltration (T1041)**, which covers the unauthorized transfer of data out of the environment. The specific technique involved here is the manipulation of mailbox settings, allowing attackers to intercept and forward emails to external addresses. The primary data sources that would provide the best evidence for this activity are PowerShell script logs, specifically those related to script block logging, which must be enabled to capture these events accurately.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs for occurrences of the `Set-Mailbox` cmdlet combined with the parameters `-DeliverToMailboxAndForward` and `-ForwardingSmtpAddress`. Investigate any results to see if they reflect known and legitimate usages or if they are associated with suspicious SMTP addresses.

  - **Correlate with User Accounts:** Cross-reference the identified PowerShell commands with user account activity logs to determine if associated accounts have an unusual login pattern, such as logins from unexpected locations or devices.

  - **Examine SMTP Logs:** Inspect SMTP logs for any unusual forwarding settings or a high volume of email messages being sent to external addresses, particularly involving accounts that were modified by the detected cmdlet.

  - **Assess Role-Based Access:** Review the permissions and roles assigned to users who executed the `Set-Mailbox` cmdlet to ensure they have the appropriate level of access for conducting such actions. Look for any potential privilege escalation paths utilized by attackers to gain access to these capabilities.

  ### Prioritization
  This alert should be considered of medium severity due to the potential for significant data exfiltration. The threat impact is elevated by the increasing sophistication of attackers who may use such techniques to escape detection while accessing sensitive information.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly if script block logging is not enabled in your PowerShell configurations, which could prevent capturing crucial information related to the execution of the `Set-Mailbox` cmdlet. The detection logic assumes that any invocation of this cmdlet is suspicious, although there may be legitimate administrative reasons for its use. Additionally, if users have legitimate business needs for configuring forwarding rules, those actions may introduce false positives unless well understood within the organization's typical behavior framework.

