title: Suspicious PowerShell Mailbox SMTP Forward Rule
id: 15b7abbb-8b40-4d01-9ee2-b51994b1d474
status: test
description: Detects usage of the powerShell Set-Mailbox Cmdlet to set-up an 
  SMTP forwarding rule.
references:
- https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-26
tags:
- attack.exfiltration
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Set-Mailbox '
    - ' -DeliverToMailboxAndForward '
    - ' -ForwardingSmtpAddress '
  condition: selection
falsepositives:
- Legitimate usage of the cmdlet to forward emails
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the usage of the PowerShell Cmdlet `Set-Mailbox` to establish an SMTP forwarding rule, which is often used to exfiltrate sensitive information from an organization's mail system. The likely attacker objective is to redirect emails to an unauthorized external address, thereby maintaining a stealthy exfiltration route for confidential data. This behavior aligns with the MITRE ATT&CK tactic "Exfiltration" (T1041) and technique "Exfiltration Over Command and Control Channel" (T1041).

  The primary telemetry sources are Windows PowerShell logs, specifically requiring Script Block Logging to be enabled to capture the command execution details. If used maliciously, this behavior can lead to significant data breaches, as emails may contain sensitive information that could be misused. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may trigger the same rule.

  ### Investigation Steps

  - **Check PowerShell script logs:** Review Windows events from PowerShell logs (Event ID 4104) for the specific ScriptBlockText containing `Set-Mailbox -DeliverToMailboxAndForward -ForwardingSmtpAddress`. Look for the target email address to identify potential malicious forwarding.

  - **Identify affected user mailbox:** Using Exchange Management Shell or the Microsoft 365 admin center, confirm if the mailbox being modified belongs to a high-privilege user, such as an executive or administrator, which increases the risk of critical data exfiltration.

  - **Validate legitimate usage:** Determine if there are documented policies permitting the use of `Set-Mailbox` for legitimate email forwarding. Consult with the admin or the user to confirm if this action was authorized.

  - **Correlate with user activity:** Cross-reference the timestamp of the command execution with user activity logs to see if the command was executed in line with expected workflows or during unusual hours, which could suggest malicious intent.

  - **Examine SMTP logs for forwarding activity:** Analyze mail flow logs on Exchange (e.g., Message Trace) to detect outgoing emails that were forwarded to external addresses shortly after the rule was set. This could indicate potential data exfiltration.

  ### Prioritization

  The alert has medium severity due to the potential impact on enterprise data integrity if sensitive emails are being redirected without authorization. The likelihood of malicious use is moderate, particularly if occurring within high-privilege accounts or in conjunction with other suspicious activity patterns. The behavior is known to be weaponized in targeted attacks, such as business email compromise (BEC).

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on Script Block Logging, which may not be universally enabled or could be circumvented by disabling logging. Legitimate activities, such as authorized administrative tasks, may trigger the alert, increasing the risk of false positives. An effective companion detection would be monitoring for unusual email forwarding patterns or external SMTP connections from high-risk accounts to complement the findings of this rule.

