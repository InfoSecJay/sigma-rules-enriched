note: |
  ### Technical Context

  This Sigma rule detects the enabling of Windows Remote Management (WinRM) through the PowerShell cmdlet `Enable-PSRemoting`, which allows remote administration of Windows systems. Attackers may leverage this capability to execute commands on remote systems using valid credentials, positioning themselves to move laterally within an enterprise environment by interacting with systems as the logged-on user.

  This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0008), specifically the technique T1021.006 (Remote Services: WinRM). The primary telemetry sources include PowerShell script block logging, specifically looking for `ScriptBlockText` containing the string ‘Enable-PSRemoting’. If enabled maliciously, this can lead to unauthorized access and execution of further malicious activities on the affected systems. However, this detection does NOT confirm that any malicious action has taken place; it only indicates that a potentially risky feature was enabled.

  ### Investigation Steps

  - **Verify script legitimacy:** Check the context of the script execution by reviewing the calling user account and the time of execution. Ensure the user has a legitimate business need for enabling WinRM, based on user account logs (Event ID 4624).

  - **Examine event logs for suspicious activity:** Look for Windows Security Event ID 4688 (process creation) for PowerShell execution. Specifically, lookup events with `New-PSSession` or related cmdlets following the enabling command, indicating remote session interactions.

  - **Check for abnormal user behavior:** Review user activity during the timeframe surrounding the detection. Look for instances of the account running other WinRM related commands (e.g., `Invoke-Command`). Compare against baseline behavior for that user.

  - **Identify a high-confidence malicious indicator:** Look for concurrent logins from different geographic locations within a short timeframe using the same account, indicating potential credential theft. Consult Windows Security Event ID 4624 for such logins.

  - **Review network connections:** Analyze firewall or network logs for unusual outbound connections from the host where WinRM was enabled. Check for remote connections to suspicious IP addresses that are not part of known, legitimate administrative processes.

  - **Understand normal WinRM usage:** Confirm if the organization has established instances of WinRM usage for management. If WinRM is frequently utilized by administrative users, map out normal usage patterns to differentiate legitimate operations from suspicious activity.

  ### Prioritization

  This alert warrants medium severity, as enabling WinRM on a system can significantly elevate security risks if exploited by an adversary. The likelihood of malicious use is moderate, particularly given the capability to execute arbitrary commands remotely. Moreover, lateral movement techniques via WinRM are commonly observed in sophisticated attacks.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers disabling logging or using obfuscation in PowerShell to hide their activity. The detection relies on enabled PowerShell script block logging, which must be properly configured. Legitimate administrative tasks, such as system configuration or management by IT staff, may trigger this alert. A related detection would be logging of unusual WinRM session calls (e.g., `New-PSSession`), which would help to confirm suspicious usage patterns following the enablement of the service.

