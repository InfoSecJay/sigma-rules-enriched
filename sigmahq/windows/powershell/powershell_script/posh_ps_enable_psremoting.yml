note: |
  ### Technical Context
  This detection rule identifies the use of the `Enable-PSRemoting` PowerShell command, which is often invoked by adversaries to enable Windows Remote Management (WinRM) on a target system. WinRM can be leveraged by attackers to execute commands remotely, thereby achieving lateral movement within a network. The primary objective for threat actors using this technique is to gain persistent remote access to compromised systems, often to exfiltrate data or further exploit network resources.

  Relevant MITRE ATT&CK techniques associated with this detection include **Remote Services: Windows Remote Management (T1021.006)**. This technique falls under the **Lateral Movement** tactic, illustrating how attackers leverage valid accounts to interact with remote systems and expand their access across an environment.

  The primary data sources for detecting this activity include **PowerShell script block logs**, which capture the execution of commands within PowerShell sessions. For accurate detection, it is crucial that Script Block Logging is enabled on target systems.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell script block logs for instances of `Enable-PSRemoting`. Note the time, user account that executed the command, and the context of its execution.
  - **Correlate with User Activity**: Analyze user activity logs around the same timeframe to assess whether the command execution aligns with expected user behavior or if it raises any flags regarding unauthorized access.
  - **Examine Remote Access Configurations**: Scrutinize configurations related to WinRM, including active listeners and any associated firewall rules, to determine if changes were made recently or unexpectedly.
  - **Investigate Account Validity**: Verify that the accounts used to execute the command are legitimate and have not been compromised. This may include checking for unusual login patterns or failed authentication attempts.

  ### Prioritization
  The alert is rated as medium severity due to the potential for unauthorized remote access and lateral movement within the enterprise network, which could lead to further exploitation, data breaches, or compromise of critical systems.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Script Block Logging is not consistently enabled across all endpoints, or if PowerShell commands are frequently used by legitimate administrators without sufficient context for analysis. The detection logic assumes that any invocation of `Enable-PSRemoting` in the logs is suspect unless adequately justified—potentially leading to false positives from legitimate administrative uses. Proper logging configurations and monitoring practices are necessary for this alert to function effectively, including ensuring that PowerShell logging is enabled across all relevant systems.

