note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Enable-PSRemoting`, which is used to configure Windows Remote Management (WinRM) services on a target system. Attackers might employ valid accounts to enable WinRM to facilitate remote control and execute malicious actions under the guise of a legitimate user. The relevant MITRE ATT&CK tactic is **Lateral Movement** and the technique is **T1021.006: Remote Services - Windows Remote Management**. The primary telemetry source is PowerShell script block logging, which captures command executions and associated arguments.

  If this behavior is malicious, it may lead to unauthorized access and control of systems, allowing adversaries to move laterally through the network. However, this detection does NOT confirm that any harmful actions were taken; further analysis is required to understand the context and intent behind the command’s execution.

  ### Investigation Steps

  - **Verify the command execution context**: Check Security Event ID 4688 for the creation of the PowerShell process and review the `ScriptBlockText` field for the execution of `Enable-PSRemoting` to establish how and why this command was run.

  - **Identify the user and source**: Validate the user account associated with the execution. Determine if it is a known, legitimate account or an unknown or compromised account. Look for the `Account Name` and `New Process Name` fields in the relevant logs.

  - **Examine recent changes**: Review the Windows Event ID 400 for PowerShell use and any associated events within the recent timeframe that indicate similar remote management activities by that user.

  - **Determine the role of the host**: Assess whether the system involved is a critical server or system (e.g., a domain controller or system administrator workstation). Legitimate environments may enable PSRemoting for administration purposes, particularly in a server management context.

  - **Check for subsequent actions**: After identifying this command, look for further activity indicating remote connections such as Event ID 5156 (Windows Filtering Platform) or signs of unusual PowerShell cmdlets executed (e.g., `Invoke-Command`) that could suggest an active lateral movement attempt.

  ### Prioritization

  The alert should be treated with medium severity due to its potential impact on critical systems that could be exposed to unauthorized remote access. The likelihood of malicious abuse is concerning, particularly if a compromised account is observed, as this behavior can be a precursor to significant adversarial actions in the network.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate administrative activities, particularly in environments where PSRemoting has been regularly used. Additionally, if script block logging is not enabled, this detection will not yield results. Legitimate administrative scripts or automated tasks may also trigger this alert without malicious intent. A companion detection to consider is monitoring for unusual outbound connections (e.g., Event ID 51506) that may occur after this command is executed, providing a more comprehensive view of potential lateral movement.

