note: |
  ### Technical Context

  The Sigma rule detects the use of the PowerShell command `Mount-DiskImage`, which may indicate an adversary attempting to mount container files, such as .iso or .vhd, to deliver malicious payloads without the files being marked with the Mark of the Web (MOTW). This behavior often aligns with the attacker objective of executing malware or gaining unauthorized access through mounted disk images. The relevant MITRE ATT&CK tactic is *Defense Evasion* (TA0005), and the specific technique is *Exploitation of Vulnerable/Compromised Software* (T1553.005).

  Primary telemetry sources include PowerShell script block logs, specifically looking for Event ID 4104, which captures the execution of PowerShell commands and scripts. If this activity is malicious, it may lead to the execution of payloads that compromise system integrity and escalate privileges. Notably, the detection does NOT prove that the mount action resulted in any malicious activity; further investigation is required to validate the intent and outcome of the action.

  ### Investigation Steps

  - **Review PowerShell script execution logs**: Check Event ID 4104 for instances of `Mount-DiskImage` command execution, observing the `ScriptBlockText` field for specific parameters like `-ImagePath` which may point to suspicious file locations.

  - **Identify the mounted image file**: Investigate the file path provided to `-ImagePath` for any recently created or unusual disk image files that may not follow standard naming conventions, which can indicate malicious activity.

  - **Assess expected behavior**: Determine if the execution was part of a legitimate administrative task. For instance, verify if the user performing the action has a role that typically requires the use of disk images (e.g., backups, imaging new systems).

  - **Examine associated processes**: Correlate this action with subsequent processes or changes on the system (e.g., via Event ID 4688) to see if any known malicious processes were initiated after the `Mount-DiskImage` use.

  - **Look for common Indicators of Compromise (IoCs)**: Identify HV (Hyper-V) virtual disks or images stored on the host system that could serve as containers for malware if present in the `-ImagePath`.

  - **Confirm user account legitimacy**: Check the user account associated with the action to ascertain if it is a legitimate administrator or a compromised account by reviewing authentication logs.

  ### Prioritization

  This alert is considered low severity due to the specific use-case of `Mount-DiskImage` and the potential for both benign and malicious activities surrounding it. However, the impact can escalate if a system-critical server or sensitive endpoint is involved, especially if disk images contain exploited vulnerabilities. While this behavior can be weaponized, it is also commonly utilized in legitimate administrative processes.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where PowerShell logging is not fully enabled, potentially omitting relevant executions. Legitimate activities, such as mounting disk images for backups or VM creation, can trigger this alert, complicating investigations. A related detection that strengthens coverage is monitoring for suspicious file changes associated with the paths used in the `-ImagePath`, such as file creation events in the Windows Security logs (Event ID 4863).

