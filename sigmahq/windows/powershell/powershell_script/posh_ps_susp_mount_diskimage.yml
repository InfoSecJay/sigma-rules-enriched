note: |
  ### Technical Context

  This Sigma rule detects the usage of the `Mount-DiskImage` PowerShell command, indicating that an adversary may be attempting to mount disk images such as .iso or .vhd files for potential malicious purposes. The likely objective of such actions is to execute payloads that could either deliver malware or perform unauthorized actions on a system. This behavior is associated with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005), specifically technique **T1553.005: External Remote Services**. The primary telemetry sources required for this detection include PowerShell Script Block Logging, specifically focusing on logs that capture the `ScriptBlockText` field containing the Mount-DiskImage command parameters.

  If malicious, this detection poses a risk by enabling adversaries to execute malicious code stored within these disk images, potentially compromising system integrity and confidentiality. However, it is important to note that this detection does NOT confirm that a malicious payload has been executed—it only identifies the action of mounting a disk image.

  ---

  ### Investigation Steps

  - **Review PowerShell Execution Logs for Mount-DiskImage:** Check PowerShell logs (Event ID 4104) for any execution of `Mount-DiskImage` command, noting the `ImagePath` parameter details to identify if a potentially malicious image is being accessed.

  - **Correlate with Security Alerting Tools:** Validate findings through EDR or SIEM tools by searching for related events that indicate further actions taken post-mounting, such as process creation events (Event ID 4688) linked to the mounted image.

  - **Identify Legitimate Use Cases:** Document typical legitimate instances of `Mount-DiskImage` usage in your environment, such as specific applications for mounting images and business operational necessity, which can act as behavioral baselines.

  - **Examine the Disk Image Contents:** If a disk image was mounted, leverage forensic tools to inspect its contents for known malware signatures or suspicious binaries that could indicate malicious intent.

  - **Check for Script Block Logging:** Ensure that PowerShell Script Block Logging is enabled (via Group Policy) to capture all execution details in order to facilitate threat hunting related to this command.

  - **Monitor for Evasion Techniques:** Look for signs of obfuscation techniques that may accompany PowerShell command usage, such as encoded commands or legitimate processes spawning the `Mount-DiskImage` command, which may mask malicious activity.

  ---

  ### Prioritization

  The alert severity is considered low due to the potential for benign usage; however, it remains crucial to assess the context in which the command is executed. Since leveraging disk images for malicious payloads is a known tactic, any unexpected usage warrants further investigation, especially on critical systems.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers utilizing alternative methods to mount disk images or employing obfuscation techniques to bypass detection. Reliable detection requires that PowerShell Script Block Logging is correctly configured and enabled across all endpoints. Legitimate activities such as system admins mounting images for software installation or batch operations may also trigger this alert. Companion detections using methods that monitor for unusual process creation or changes in security configuration can strengthen overall coverage.

