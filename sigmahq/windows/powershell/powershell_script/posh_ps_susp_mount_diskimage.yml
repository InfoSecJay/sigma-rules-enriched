note: |
  ### Technical Context
  This rule detects the use of the PowerShell cmdlet `Mount-DiskImage`, which may be employed by adversaries to mount disk images as part of delivering malicious payloads. Disk image files, such as .iso or .vhd files, can be used to bypass traditional security mechanisms by avoiding execution flags and may contain harmful content without proper tagging indicating that they might be malicious. An attacker might leverage this tactic to establish persistence, exfiltrate data, or deploy further stages of a malware attack.

  In this context, the relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as attackers are attempting to avoid detection through means that exploit normal administrative tools and processes, and the specific technique **T1553.005 - External Remote Services: Network Share/Remote Access Tools**. The detection logic is specifically targeting scripts where `Mount-DiskImage` is invoked, which could signify an attempt to access unauthorized content or payloads.

  Primary data sources for this rule include:
  - PowerShell Script Block Logging, which captures detailed logging of PowerShell commands executed in the environment.
  - Windows Security Logs, which may record related events if execution results in additional changes to the system or process creation.

  ### Investigation Steps
  - **Review PowerShell Logs**: Look for entries in the PowerShell Script Block Logs that indicate the execution of `Mount-DiskImage`, including the corresponding `-ImagePath` arguments. Analyze the context of these commands to discern legitimate versus suspicious use cases.

  - **Analyze Disk Image Files**: If a suspicious `Mount-DiskImage` command is detected, collect and review the mounted disk image contents for unknown or malicious files, particularly executable files or scripts.

  - **Correlate with User Activity**: Examine user activity around the time of the PowerShell execution. Check for any unusual account behavior, such as access to critical systems or files that the user typically wouldn't interact with.

  - **Monitor Related Processes**: Investigate processes spawned immediately after the disk image mount event. Look for any unusual or unexpected processes that might indicate further malicious activities, such as downloading additional payloads or executing scripts.

  ### Prioritization
  This alert is of low severity in an enterprise environment given the legitimate use of disk image mounts in administrative tasks. However, the presence of such commands should still be monitored closely, as they could indicate malicious intent, especially if accompanied by other anomalous behaviors.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on Script Block Logging, which may not be enabled in all environments. Additionally, legitimate administrative activities utilizing `Mount-DiskImage` may lead to false positives. There is an assumption that if this cmdlet is used, it points to potential malicious activity, without full context from additional user behavior or outcomes. For effective alerting, organizations need to ensure that PowerShell script logging is enabled and adequately configured to capture relevant activities.

