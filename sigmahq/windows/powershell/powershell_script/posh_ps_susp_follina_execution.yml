title: Troubleshooting Pack Cmdlet Execution
id: 03409c93-a7c7-49ba-9a4c-a00badf2a153
status: test
description: Detects execution of "TroubleshootingPack" cmdlets to leverage CVE-2022-30190
  or action similar to "msdt" lolbin (as described in LOLBAS)
references:
- https://twitter.com/nas_bench/status/1537919885031772161
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-21
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Invoke-TroubleshootingPack'
    - 'C:\Windows\Diagnostics\System\PCW'
    - '-AnswerFile'
    - '-Unattended'
  condition: selection
falsepositives:
- Legitimate usage of "TroubleshootingPack" cmdlet for troubleshooting purposes
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of "TroubleshootingPack" cmdlets, which can be leveraged to exploit CVE-2022-30190, also known as the "msdt" vulnerability. Malicious actors may utilize this cmdlet, commonly seen in attacks utilizing lolbins (Living Off The Land Binaries), to perform nefarious actions under the guise of legitimate troubleshooting procedures. The primary objective behind this behavior could be to evade detection by security mechanisms while executing arbitrary commands or gaining foothold in the system.

  Relevant MITRE ATT&CK techniques include **Defense Evasion (T1202)**, as adversaries may seek to use these cmdlets to bypass defenses by masquerading their activities as benign troubleshooting efforts. The data sources that provide the best evidence for this detection include PowerShell script block logs, which reveal the execution of the cmdlet along with its arguments.

  ### Investigation Steps
  - **Review PowerShell Logs**: Inspect PowerShell script block logging to identify instances of the "Invoke-TroubleshootingPack" cmdlet being executed, including any suspicious parameters such as `-AnswerFile` and `-Unattended`.
  - **Correlate with CVE Usage**: Cross-reference the detected cmdlet executions with known exploits regarding CVE-2022-30190 to identify any targeted attacks or exploitation attempts.
  - **Analyze File Activity**: Check for file activity related to the specified path `C:\Windows\Diagnostics\System\PCW` to determine if there are unauthorized or suspicious access attempts.
  - **Investigate Source System**: Conduct a thorough investigation on the source system for abnormal user behavior, including the access patterns and privileges of the user executing the cmdlets.

  ### Prioritization
  This alert is of medium severity due to the potential for critical exploitation through known vulnerabilities. The likelihood of a successful attack is moderate, especially if combined with other tactics from sophisticated threat actors.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is legitimate administrative use of the "TroubleshootingPack" cmdlets, which may lead to false positives. Additionally, this detection logic assumes that script block logging is enabled; without this setting, successful detection of malicious use may not occur. Lastly, reliance on standard Windows logging means that any deviations in system logging configurations could result in missed detections.

