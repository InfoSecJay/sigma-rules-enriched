title: Troubleshooting Pack Cmdlet Execution
id: 03409c93-a7c7-49ba-9a4c-a00badf2a153
status: test
description: Detects execution of "TroubleshootingPack" cmdlets to leverage 
  CVE-2022-30190 or action similar to "msdt" lolbin (as described in LOLBAS)
references:
- https://twitter.com/nas_bench/status/1537919885031772161
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-21
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Invoke-TroubleshootingPack'
    - 'C:\Windows\Diagnostics\System\PCW'
    - '-AnswerFile'
    - '-Unattended'
  condition: selection
falsepositives:
- Legitimate usage of "TroubleshootingPack" cmdlet for troubleshooting purposes
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "TroubleshootingPack" cmdlets, specifically targeting the use of `Invoke-TroubleshootingPack` in conjunction with parameters that suggest exploitation of CVE-2022-30190. The likely attacker objective is to execute arbitrary code or commands through the Microsoft Support Diagnostic Tool (MSDT), commonly utilized in a "living off the land" (LOLBAS) tactic, enabling attackers to blend in with legitimate system activity. This behavior aligns with the MITRE ATT&CK technique for exfiltration and abuse of built-in Windows tools (Defense Evasion: T1202).

  The primary telemetry sources required for effective detection include PowerShell script block logging, specifically capturing logs related to `ScriptBlockText`. Malicious exploitation of this behavior can lead to unauthorized system modifications or data exfiltration, posing significant security risks. It is important to note that this detection, on its own, does not confirm that malicious activity has occurred; it may also indicate legitimate administrative or troubleshooting tasks.

  ### Investigation Steps

  - **Check PowerShell execution details:** Review Security Event ID 4104 for script block logs that include invocation of `Invoke-TroubleshootingPack`. Look for details in `ScriptBlockText` for specific parameters used, particularly `-AnswerFile` and `-Unattended`.

  - **Validate legitimate usage patterns:** Compare the execution context against known administrative actions; troubleshooting cmdlets may be used by system admins during scheduled maintenance. Check associated process initiators in Event ID 4688 to verify if it's tied to legitimate administrative users.

  - **Identify malicious execution signatures:** Look for unusual combinations in script block logs. Malicious indicators may include a deviation from typical usage patterns, like unusual execution executed by non-admin accounts or in non-standard contexts.

  - **Examine system access and changes:** Investigate Windows Event ID 4663 to identify file access patterns related to `C:\Windows\Diagnostics\System\PCW` during the detected event. Verify if any unauthorized changes were made to files or system settings.

  - **Correlate with other detection frameworks:** Explore companion detections, like abnormal behavior linked to `msdt.exe` usage or other LOLBAS techniques, which might provide additional context or indicators of compromise in concurrent logging events.

  ### Prioritization

  The alert is medium severity due to the potential impact on the affected system, specifically concerning administrative tools exploited for malicious intent. The likelihood of abuse exists, as CVE-2022-30190 has been publicly reported and weaponized in targeted attacks. The overlap with known exploitation techniques enhances the urgency for further investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the necessity for PowerShell Script Block Logging to be enabled; without it, malicious executions may evade detection. Legitimate administrative troubleshooting may trigger the same alert, potentially resulting in false positives. Additionally, monitoring for unusual processes that utilize the MSDT or associated tools can act as a supplementary measure to strengthen security coverage.

