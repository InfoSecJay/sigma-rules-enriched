title: Troubleshooting Pack Cmdlet Execution
id: 03409c93-a7c7-49ba-9a4c-a00badf2a153
status: test
description: Detects execution of "TroubleshootingPack" cmdlets to leverage 
  CVE-2022-30190 or action similar to "msdt" lolbin (as described in LOLBAS)
references:
- https://twitter.com/nas_bench/status/1537919885031772161
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-21
tags:
- attack.stealth
- attack.t1202
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Invoke-TroubleshootingPack'
    - 'C:\Windows\Diagnostics\System\PCW'
    - '-AnswerFile'
    - '-Unattended'
  condition: selection
falsepositives:
- Legitimate usage of "TroubleshootingPack" cmdlet for troubleshooting purposes
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Windows PowerShell cmdlets related to the "TroubleshootingPack," which may be used to exploit vulnerabilities like CVE-2022-30190 or to execute malicious workflows similar to the "msdt" living-off-the-land binary (LOLBIN). Attackers may use this method to trigger payloads or to gain unauthorized access to systems through a relatively inconspicuous vector. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Exploitation for Client Execution** (T1202), indicating that this is both an execution and exploitation activity.

  Primary telemetry sources are PowerShell script block logs which require that Script Block Logging is enabled on targeted endpoints. If malicious, the impacts can include remote code execution and system compromise. However, this detection does NOT confirm that the detected cmdlet usage is inherently malicious; it may also stem from legitimate troubleshooting activities.

  ### Investigation Steps

  - **Verify logs of script execution:** Check Script Block logs for Event ID 4104 to identify if “Invoke-TroubleshootingPack” was executed, along with the command context and parameters provided.

  - **Review command arguments:** Confirm the command parameters used, especially for `'-AnswerFile'` and `'-Unattended'`. Malicious executions are more likely to have suspicious or obfuscated file paths or arguments.

  - **Assess context of execution:** Determine if the cmdlet was run by a legitimate administrator (audit logs such as Event ID 4624 for successful logons) or an unauthorized user. High-risk accounts should be prioritized in this analysis.

  - **Identify recent system changes:** Check for any recent alterations to system settings or applications around the time of the cmdlet execution, using Windows Event ID 6100 and 6101 from Diagnostic Logs; malicious activity is often followed by configuration changes.

  - **Look for related scheduled tasks or jobs:** Review Scheduled Task logs (Event ID 106) to determine if there are any tasks associated with running PowerShell commands that could relate to the TroubleshootingPack, which may hint at persistence mechanisms.

  - **Distinguish legitimate use of cmdlet:** Investigate recent support activities from IT staff or documented troubleshooting cases using the TroubleshootingPack in your environment. Look for consistency in user profiles and expected system interactions.

  ### Prioritization

  The severity of this alert is medium because while the cmdlet may appear benign, it exploits a known vulnerability, potentially allowing for significant system impact if used maliciously. Given the relative obscurity of the cmdlet in common enterprise contexts, the likelihood of malicious abuse is moderate, but the behavior is recognized in various threat models as a viable technique for attackers.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as altering PowerShell logging configurations or disabling Script Block Logging. Reliable detection depends on having these logs enabled across all endpoints. Legitimate administrative troubleshooting may trigger this alert, particularly during periods of system maintenance. A related detection to consider is monitoring direct invocation of "msdt.exe" (Event ID 4688), which further enhances coverage against exploitation scenarios.

