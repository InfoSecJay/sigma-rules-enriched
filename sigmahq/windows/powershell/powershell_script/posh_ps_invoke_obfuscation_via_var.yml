  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|re: '(?i)&&set.*(\{\d\}){2,}\\"\s+?-f.*&&.*cmd.*/c'     # FPs with |\/r
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell commands executed via the VAR++ launcher, which is associated with various malicious activities, including the execution of unauthorized scripts or commands. Attackers often employ obfuscation techniques to evade detection by security solutions and potentially carry out further exploits within an environment. The likely attacker objectives include establishing persistence, executing payloads, or manipulating the system for data exfiltration.

  Relevant MITRE ATT&CK tactics for this detection include **Execution (T1059.001)**, which involves running PowerShell scripts, and **Defense Evasion (T1027)** where attackers obfuscate code to avoid detection. By focusing on these techniques, defenders can better understand the attack patterns and take preventative measures against similar threats.

  Primary data sources for this rule include **Windows PowerShell script block logs**, which must be enabled to capture the execution of PowerShell commands. Monitoring these logs helps security teams identify potentially malicious or suspicious PowerShell activity on endpoints.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Analyze the PowerShell script block logs to identify instances of obfuscated command execution; focus on the context of the commands and any associated process creation events.
  - **Correlate with EDR Data**: Check any endpoint detection and response (EDR) logs to understand the processes that were initiated during the time of obfuscation and whether other suspicious behaviors were present.
  - **Inspect Network Traffic**: Investigate outbound network connections that may correlate with the timing of the obfuscated PowerShell commands, checking for unusual destinations or protocols used.
  - **Validate System Integrity**: Assess the integrity of the impacted systems by checking for the presence of potentially malicious scripts or unauthorized modifications to system files and configurations.

  ### Prioritization
  The alert is rated high due to the potential for significant impact on the enterprise environment. Obfuscated PowerShell commands can lead to severe security incidents, including data breaches, unauthorized access, or system compromises, making timely response critical.

  ### Blind Spots and Assumptions
  This detection method assumes that **Script Block Logging** is enabled on all Windows systems where PowerShell could be executed. If logging is disabled, the rule will not trigger, resulting in gaps in detection coverage for obfuscated command activities. Additionally, false positives may occur if legitimate scripts utilize similar obfuscation techniques, necessitating careful analysis and contextual understanding of PowerShell usage within the organization.

