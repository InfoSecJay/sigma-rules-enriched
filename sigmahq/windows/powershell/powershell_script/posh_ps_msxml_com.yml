note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell scripts that instantiate the MsXml COM object, particularly when utilizing the `New-Object` cmdlet. Attackers often leverage PowerShell for malicious purposes, including unauthorized data access, executing payloads, and performing reconnaissance within the target environment. The use of MsXml is notably prevalent in web data access attacks, which can be used to download additional malware or exfiltrate sensitive information.

  Adversaries may aim to exploit this functionality to facilitate lateral movement, command and control (C2) communications, or to gather system configuration details. This behavior aligns with several techniques in the MITRE ATT&CK framework, particularly T1059.001 (Command and Scripting Interpreter: Windows PowerShell), which emphasizes the leveraging of PowerShell capabilities for execution and command delivery.

  The primary data sources for this detection include PowerShell script block logs, which must be enabled to capture detailed command execution. Additionally, process creation logs and Windows event logs that track script execution provide valuable insight into potentially nefarious activities involving the MsXml COM object.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs**: Examine script block logging for scripts that include `New-Object -ComObject MsXml2` or related references to `XmlHttp` to confirm malicious usage.
  - **Analyze Process Creation Events**: Check process creation logs for instances where PowerShell processes were invoked, specifically for executing commands that reference the MsXml object, assessing their parent processes for legitimacy.
  - **Assess Network Activity**: Investigate any outbound network connections initiated by PowerShell processes for unusual activity, particularly those targeting suspicious domains or IPs, suggesting potential C2 traffic or data exfiltration efforts.
  - **Correlate with Audit Logs**: Look into system and security audit logs to correlate user activity and legitimate administrative actions that may be involved, ensuring that any detected behavior is not a false positive linked to regular task automation.

  ### Prioritization
  This alert is considered medium severity due to the potential for significant impact on the organization's security posture if malicious use is confirmed. The likelihood of exploitation is moderate, given the prevalence of PowerShell usage in environments and its capabilities when combined with COM object instantiation.

  ### Blind Spots and Assumptions
  One potential gap in this detection logic is the reliance on the configuration of script block logging, which may not be enabled in all environments, limiting visibility into PowerShell activities. The detection logic assumes that the detected PowerShell commands are executed in a potentially malicious context, without accounting for legitimate administrative scripts that may also utilize the MsXml object. It is essential to ensure that logging is adequately configured and maintained across all endpoints to facilitate effective monitoring and response.

