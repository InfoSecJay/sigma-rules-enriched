note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that instantiate the MSXML COM object to perform XML HTTP requests. This behavior is often leveraged by adversaries to exfiltrate data, download malicious payloads, or interact with external malicious infrastructure. The likely attacker objective is to establish communication with a command-and-control (C2) server or retrieve data for further exploitation.

  The relevant MITRE ATT&CK tactics and techniques are Execution (T1059.001). The primary telemetry source is Windows PowerShell session logs, specifically PowerShell script block logging, which captures the execution of PowerShell commands. If malicious, this activity could lead to data exfiltration or initial access to the network. However, this detection does NOT confirm that the action is inherently malicious, as it could also be executed in legitimate administrative tasks.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Check PowerShell script logs (Event ID 4104) for occurrences of 'New-Object' with '-ComObject' and 'MsXml2.XmllHttp'. Note the user context and execution time for correlation with other activities.

  - **Identify Legitimate Usage Patterns:** Verify if the command was part of an approved administrative script or task by cross-referencing the script's context and the user initiating it against documented IT operations.

  - **Cross-Analyze User Activity:** Look for unusual user behavior such as logins from atypical locations or outside regular hours using Security Event ID 4624 (successful logon) logs. Highlight instances that deviate from established baseline behavior.

  - **Correlate with Network Activity:** Examine network logs (Firewall event logs or proxy logs) for outgoing connections established from the host running the command, especially looking for connections to known malicious domains or IP addresses.

  - **Document Malicious Indicators:** Identify if the process spawned any additional processes (Event ID 4688) or if any suspicious files were downloaded during the session, particularly examining file paths and hashes for known malware.

  - **Validate Script Contextual Risk:** Assess the risk associated with the affected system. Critical assets or systems that have high control privileges are of greater concern if they trigger this alert, warranting immediate attention.

  ### Prioritization

  This alert should be treated with medium severity. Systems that executed this behavior are likely to have been targeted for data breaches or initial access. The tendency for adversaries to abuse PowerShell for execution means this behavior can often indicate a compromise, but it requires further investigation to discern true intent.

  ### Blind Spots and Assumptions

  Detection may be limited by improper logging configurations; PowerShell script block logging must be enabled for accurate capture of the commands being executed. Adversaries could use various evasion techniques, such as obfuscation or running commands in a way that doesn't trigger logging. Legitimate administrative activities, especially around task automation using PowerShell, may inadvertently trigger this alert. Companion detections related to suspicious outbound network communications or other PowerShell execution logs can bolster detection effectiveness.

