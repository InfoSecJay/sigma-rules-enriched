note: |
  ### Technical Context

  This rule detects the use of PowerShell commands to instantiate the MsXml COM object, a common technique for making HTTP requests or manipulating XML data. The likely attacker objective is to perform reconnaissance, exfiltrate data, or execute additional payloads without traditional files on disk. This behavior aligns with the MITRE ATT&CK technique T1059.001 (PowerShell). The primary telemetry sources for detection are PowerShell Script Block Logs, which must be enabled, capturing potentially harmful command executions. If malicious, exploitation of this behavior could lead to data theft or lateral movement within the network. Importantly, this detection does not confirm that an attack has occurred on its own; it merely indicates that a specific PowerShell script was executed.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs:** Review logs for Event ID 4104 where the ScriptBlockText contains 'New-Object', '-ComObject', and 'MsXml2.'. Look for any base64 strings or suspicious parameters used in the command.

  - **Identify Legitimate Usage:** Cross-reference events with known administrative scripts or documented IT operations to differentiate benign usage from potential abuse. Legitimate administrative scripts may invoke the MsXml object but for recognized purposes, such as automated reporting or data retrieval from internal APIs.

  - **Correlate with Process Creation Events:** Investigate Security Event ID 4688 or Sysmon Event ID 1 matching the PowerShell process. Analyze the parent process ID to determine if it stems from a trusted source or is spawned by an unusual or unexpected parent process.

  - **Examine Network Activity:** Check for outbound connections using network logs such as Windows Firewall logs or network monitoring tools. Look for HTTP requests made to external IPs or domains that may show data exfiltration behavior after the script execution.

  - **Look for Additional Malicious Indicators:** Assess for other obfuscated or unusual command parameters within the same time frame, especially those involving remote connections or interaction with external URLs, which may strongly indicate an attack.

  - **Review User Activity Context:** Cross-check the user context executing the command. If the user typically does not use PowerShell or the command is executed at an unusual time, it can suggest malicious intentions.

  ### Prioritization

  This alert should be considered medium severity as it indicates a potentially risky behavior that is commonly weaponized in attacks. The impacted systems, particularly servers or sensitive endpoints, may be pivotal in an organization's infrastructure, increasing the risk should they be compromised.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block Logging, which is not always enabled in all environments. Evasion techniques may involve obfuscation of PowerShell commands or use of alternative languages and tools to achieve similar objectives. Additionally, legitimate administrative scripts may trigger the alert without malicious intent, thus requiring careful context analysis. A companion detection for assessment would be monitoring unusual outbound network traffic or configurations that show manipulation of the Windows Firewall settings.

