note: |
  ### Technical Context

  This detection identifies the use of the `Get-SmbShare` PowerShell command, which is often employed by adversaries to enumerate shared folders and drives on a Windows system. The likely attacker objective is to gather information about network resources that could be targeted for data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Discovery: "Network Share Discovery" (T1069.001).

  The primary telemetry sources are PowerShell script block logs, requiring that Script Block Logging is enabled on Windows systems. If malicious, this activity can lead to unauthorized data access or further compromises in the network. Importantly, this detection alone does not confirm malicious intent; it simply indicates that the `Get-SmbShare` command was executed and further context is needed to establish intent.

  ### Investigation Steps

  - **Review PowerShell logs:** Check for PowerShell script block logs (Event ID 4104) containing the string `Get-SmbShare`. Look for unusual usage patterns, such as execution from non-standard processes or user accounts that typically do not interact with SMB shares.

  - **Identify user context:** Investigate the user account that executed the command. If the account is typically a low-privileged user or if the command was run by a service account outside of its normal operational context, this may indicate malicious behavior.

  - **Correlate with network activity:** Examine network logs for related SMB traffic, specifically looking for `SMB Share` access logs that show connections to the system from IP addresses that are not typical for user activity. Refer to Windows Security Event ID 5140 for share access attempts.

  - **Expected behavior validation:** Determine if the user account is expected to use `Get-SmbShare` by mapping out regular tasks or job roles. If the command aligns with expected administrative tasks (e.g., a sysadmin checking shares), this could be benign.

  - **Look for file access events:** Check for logs related to file access on the shares enumerated. Review Windows Security Event IDs 4663 and 5145 for evidence of high-volume read operations that may indicate data collection after the share discovery.

  - **Cross-reference with lateral movement:** Look for subsequent events that indicate lateral movement, such as Remote Desktop logins or other file share access activities initiated from the same user or machine within a short time frame after the command execution.

  ### Prioritization

  This alert is of low severity in most enterprise contexts, as it may involve legitimate administrative activities. However, it has the potential for malicious abuse, especially if used to enumerate sensitive shares before more exploitative actions, which makes it noteworthy for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of PowerShell logging; if Script Block Logging is disabled, this activity will go unrecorded. Legitimate administrative users may invoke `Get-SmbShare`, thus potentially triggering false positives. A related detection could be monitoring for `Set-SmbShare`, which may indicate an attempt to modify configurations and elevate the risk if combined with `Get-SmbShare` activity.

