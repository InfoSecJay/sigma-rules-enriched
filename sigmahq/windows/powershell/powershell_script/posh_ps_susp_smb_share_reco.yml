note: |
  ### Technical Context
  This detection rule identifies attempts to retrieve information about SMB shares on Windows systems, specifically targeting commands that utilize PowerShell's `Get-SmbShare` cmdlet. The presence of such commands in the environment may indicate adversarial reconnaissance behaviors as attackers seek to enumerate available shared resources for potential data collection or lateral movement. Understanding the shared drives and folders within a network can give attackers insights into where sensitive data resides or which systems could be leveraged for further exploitation.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and the technique **Network Share Discovery** (T1069.001). By executing commands to list SMB shares, adversaries can map the network infrastructure and identify valuable resources to target, potentially culminating in a collection of sensitive information or facilitating lateral movement across the network.

  Primary telemetry for detecting this behavior includes PowerShell script block logging, as the rule is specifically triggered by detected PowerShell command activity related to SMB share enumeration.

  ### Investigation Steps
  - **Review PowerShell Logs:** Investigate PowerShell script block logs for instances of `Get-SmbShare` commands. Pay attention to the context of execution, including the user and time of access.
  - **Assess User Activity:** Check the account activity logs for the user executing the command. Look for unusual patterns or behaviors, such as access outside of normal working hours or from unusual locations.
  - **Monitor SMB Traffic:** Analyze Network traffic logs for SMB-related activities and assess any anomalous connections to shared drives that may indicate unauthorized scanning or enumeration attempts.
  - **Correlate with Other Logs:** Cross-reference the PowerShell activity with other security logs (such as EDR or SIEM logs) to determine if other related suspicious activities have been noted, which may suggest coordinated discovery efforts.

  ### Prioritization
  This alert is considered of low severity in an enterprise environment as it indicates reconnaissance activity, which is often a precursor to more significant attacks. However, consistent monitoring and correlation are vital, as it could escalate based on the context of the environment or any subsequent malicious actions taken by the attacker.

  ### Blind Spots and Assumptions
  One primary blind spot in this detection coverage is the possibility of obfuscation or alterations to standard PowerShell commands, which might evade detection. The detection logic assumes that script block logging is enabled and operational; if disabled or misconfigured, the rule will not trigger. Moreover, reliance on specific PowerShell commands as indicators may miss other enumeration methods or tools used by sophisticated adversaries to discover SMB shares. Ensuring that all relevant audit logging and monitoring configurations are in place is essential for maintaining the effectiveness of this alert.

