  ### Technical Context

  This Sigma rule detects the use of the X509Enrollment class in PowerShell scripts, which could indicate an attempt to manipulate digital certificates or other sensitive system configurations. The likely attacker objective is to create, modify, or revoke authentication credentials to gain unauthorized access or impair defense mechanisms. This behavior aligns with the MITRE ATT&CK technique T1553.004 (Compromise Hardware).

  Primary telemetry sources include PowerShell script block logging, which is essential for capturing the command execution events. If detected, the security impact could be significant, potentially leading to unauthorized access or system compromise. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to understand the context of the activity.

  ### Investigation Steps

  - **Check PowerShell execution logs:** Review PowerShell event logs (Event ID 4104) for script block logging entries containing the detected strings: 'X509Enrollment.CBinaryConverter' or '884e2002-217d-11da-b2a4-000e7bbb2b09'.

  - **Assess script origin and context:** Identify the user and system executing the script. Check for administrative accounts and ensure relevant users have legitimate reasons for running the detected command.

  - **Review recent certificate changes:** Examine Certificate Services logs for any recent changes in certificate issuance or revocation actions (Event ID 4901–4904) that correlate with the alert.

  - **Look for automation patterns:** Identify if this behavior is part of an automated script used for legitimate tasks, such as workflow automation for certificate management.

  - **Verify legitimacy of associated processes:** Check for parent process trees to see if the script was spawned by known management tools or user-initiated processes (Event ID 4688).

  - **Correlate with other detections:** Cross-reference other alert logs, particularly related to abnormal PowerShell usage, to identify patterns indicative of a larger attack scenario.

  ### Prioritization

  This alert should be prioritized as medium severity due to the impact on system security relating to credential management. The likelihood of malicious abuse is moderate, as attackers often leverage similar tactics to manipulate certificate services. While this behavior could be legitimate, it is deemed suspicious enough to warrant investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled; without it, legitimate uses of PowerShell may trigger false positives. Legitimate administrative scripts might also contain similar keywords and could potentially trigger the alert. A companion detection, such as monitoring for unusual certificate issuance events, could enhance overall situational awareness regarding potential misuse of certificates in the environment.

