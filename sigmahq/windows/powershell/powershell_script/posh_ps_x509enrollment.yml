  ### Technical Context
  This rule detects the use of the X509Enrollment PowerShell class, which can be utilized by attackers to manipulate or enroll certificates. The detection is pertinent in scenarios where adversaries aim to bypass security controls or establish persistence by creating unauthorized certificates. The objective is often to enable a covert communication channel or to perform man-in-the-middle attacks, among other malicious intents.

  The relevant MITRE ATT&CK tactics included in this detection are **Defense Evasion** (ID: TA0005) and the technique **Process Injection** (ID: T1553.004). Attackers might exploit certificate enrollment for legitimate operational purposes, thus disguising their malicious activities as benign administrative scripts.

  Primary data sources for this detection are PowerShell script block logs, which must be enabled for accurate monitoring. These logs will provide insights into any instances where the X509Enrollment class is being called, aiding in the identification of potentially malicious actions.

  ### Investigation Steps
  - **Check Script Block Logs**: Review PowerShell script block logs for entries containing 'X509Enrollment.CBinaryConverter' or the GUID '884e2002-217d-11da-b2a4-000e7bbb2b09'. Focus on the context of the execution, such as user identity and related commands.

  - **Analyze Recent Certificate Activities**: Go through the certificate management logs in Windows to identify any unusual certificate issuance or changes that correlate with the detected PowerShell command execution.

  - **Verify User Privileges**: Investigate the privileges of the user account that executed the script. Check if the user has authorized administrative rights and whether the action aligns with their normal behavior.

  - **Correlate with Other Events**: Look for suspicious process creation events that occurred around the same time frame as the PowerShell execution to identify potential lateral movement or further compromise attempts.

  ### Prioritization
  This alert is of medium severity within an enterprise environment because it may indicate an attempt to perform malicious actions such as certificate manipulation, which has the potential to lead to significant security breaches or evasions of surveillance by security tools.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on PowerShell script block logging being enabled; if this is not configured, the detection will be ineffective. Additionally, the logic assumes that any legitimate administrative scripts will not contain the specific keywords identified, which could lead to false positives. It’s essential that environments are set up to accommodate proper logging for the alert to function effectively and provide accurate detections.

