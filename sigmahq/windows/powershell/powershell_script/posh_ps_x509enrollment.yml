  ### Technical Context

  This Sigma rule detects potentially malicious use of the X509Enrollment object within PowerShell scripts. Specifically, it identifies the misuse of X509Enrollment as a means to manipulate or create certificates, which attackers may utilize to establish trusted connections or encrypt communications during their operations. The relevant MITRE ATT&CK tactic is Defense Evasion (T1553.004), given that adversaries might aim to evade detections by leveraging legitimate-looking functions.

  The primary telemetry source is PowerShell script block logs, requiring that this logging source be enabled to capture the related events accurately. A detection indicates that a script may be attempting to circumvent security measures or facilitate further unauthorized actions. Importantly, this detection does not confirm malicious intent on its own; it may also capture legitimate administrative actions performed by authorized users.

  ### Investigation Steps

  - **Identify PowerShell script block logs:** Review Security Event ID 4104 for script block logging entries containing 'X509Enrollment.CBinaryConverter' or '884e2002-217d-11da-b2a4-000e7bbb2b09'. This can indicate potential misuse.

  - **Assess context of PowerShell execution:** Check the host’s role and operational context for PowerShell execution. Record any administrative activities or tasks that might justify this behavior to distinguish benign use.

  - **Check historical execution patterns:** Analyze past PowerShell activities for the user or system within Event IDs 4688 (Process Creation) and 4689 (Process Termination) to determine if this behavior is anomalous compared to user baselines.

  - **Look for additional indicators of compromise:** Investigate other related logs, such as Windows Event ID 4624 (Successful Logon), to confirm if the user has unexpected access patterns or permissions that could indicate a compromised account facilitating the execution.

  - **Document malicious indicators:** Identify any associations with known malicious IP addresses or domains if the PowerShell script connects to external resources, looking in URL logs or firewall logs.

  ### Prioritization

  This alert is medium severity due to its potential to expose sensitive information via certificate manipulation, especially on critical servers. Given that the behavior detected here can be leveraged in actual attacks, the likelihood of abuse is moderate, especially in organizations where PowerShell is widely used and overt security measures are absent.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where script block logging is not enabled. Moreover, sophisticated attackers might utilize obfuscation techniques to disguise their activities, evading detection. Legitimate administrative scripts may also trigger this alert, especially for certificate management tasks. Companion detections, such as alerting on abnormal user behavior or anomalous PowerShell execution patterns, can enhance coverage and reduce false positives associated with this alert.

