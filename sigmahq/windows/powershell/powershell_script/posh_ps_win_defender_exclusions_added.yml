- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications made to Windows Defender configuration settings via PowerShell, particularly focusing on the addition of exclusions. Attackers often seek to disable or bypass security controls to facilitate further malicious activities within a compromised environment. By leveraging commands like `Add-MpPreference` and `Set-MpPreference`, an adversary is able to create exceptions for certain files, processes, or IP addresses, which may enable malicious software to operate undetected.

  The relevant MITRE ATT&CK tactics relevant to this detection include **Defense Evasion** (T1562), as the goal is to evade detection efforts by security tools, and **Execution** (T1059), which outlines methods of executing malicious payloads through legitimate scripting environments like PowerShell. Primary data sources vital for corroborating these activities include PowerShell script block logs, which must be enabled in the environment to capture the necessary telemetry for detection.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script block logs that capture commands including 'Add-MpPreference' and 'Set-MpPreference'. Look for any anomalies or deviations from standard operational behavior by users or systems that typically do not modify Defender settings.

  - **Investigate Exclusion Entries**: Verify the entries listed in Windows Defender exclusion settings. Look for unexpected paths, file types, or processes that have been added, especially those related to known malicious software or not usually encountered in the environment.

  - **Perform User Activity Correlation**: Correlate the time of the modification with user activities. Check if the user account performing the exclusions has a history of security-related changes and review their previous command executions for any signs of malicious behavior.

  - **Analyze Log Configuration**: Ensure that Windows Defender's script block logging is enabled and properly configured across all relevant systems. Consider conducting a review of past logs to identify any similar patterns or historical modifications.

  ### Prioritization
  This alert is considered medium severity as it indicates possible tampering with security software, which can lead to significant risks if attackers utilize these exclusions to operate freely within the environment. The likelihood of such behavior indicates a need for prompt investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if script block logging is not enabled or configured correctly, which may prevent the detection of modifications. Additionally, the logic assumes that only PowerShell is used for creating exclusions; however, similar modifications could be made using other tools or methods that fall outside this detection. Required configurations must ensure that logging is enabled to capture all relevant actions for effective monitoring and analysis.

