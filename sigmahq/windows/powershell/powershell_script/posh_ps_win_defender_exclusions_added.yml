note: |
  ### Technical Context

  This rule detects the use of PowerShell commands that modify Windows Defender configurations by adding exclusions for files, processes, or IP addresses. The behavior suggests that an attacker may be attempting to evade detection mechanisms to allow malicious activities to occur without triggering security alerts. This activity aligns with the MITRE ATT&CK techniques T1562 (Impair Defenses) and T1059 (Command and Scripting Interpreter). The primary telemetry sources involve PowerShell script block logs, which capture the command and parameters used during execution. If the behavior is malicious, it could lead to an increased risk of malware execution and data exfiltration. Importantly, this detection does NOT confirm that an actual compromise has occurred; it merely indicates that potentially malicious configuration changes were attempted.

  ### Investigation Steps

  - **Verify PowerShell command execution:** Check for Security Event ID 4688 of process creation to identify the PowerShell process along with the command line arguments used. Malicious execution typically contains `Add-MpPreference` or `Set-MpPreference` commands.

  - **Assess Script Block Logging:** Ensure that PowerShell Script Block Logging is enabled and review logs (Event ID 4103) to find any occurrences of `-ExclusionPath`, `-ExclusionExtension`, `-ExclusionProcess`, or `-ExclusionIpAddress`. Legitimate use often does not involve these parameters.

  - **Cross-check timestamps:** Match identified PowerShell execution events with other logs (e.g., Windows Event Logs or Sysmon Event ID 1) around the same timeframe to look for suspicious creations or modifications of executable files.

  - **Review Defender logs:** Investigate Windows Defender's operational logs to see if there are additional exclusion entries added (specific events related to modifications can be found here). Benign activities would show standard exclusion paths like those for known software.

  - **Examine host role:** Determine the role of the affected system; if it is a workstation or server in a sensitive environment, the risk of malicious activity warrants urgent investigation compared to less critical systems.

  ### Prioritization

  This alert is of medium severity due to its potential impact on systems that rely on Windows Defender for threat detection. The likelihood of malicious use is significant, as altering Defender configurations is a common tactic for attackers aiming to bypass security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations not enabling PowerShell Script Block Logging, which could prevent visibility of such alterations. Legitimate administrative tasks may trigger the alert if they involve excluding files or processes from AV scanning. Companion detections such as monitoring for suspicious process creations (e.g., processes spawned with unusual command flags) could provide additional context and coverage.

