note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that modify Windows Defender configuration by adding exclusions, which can be indicative of an attacker attempting to circumvent security measures. The likely objective of such activity is to allow malicious files or processes to operate without being detected by antivirus software. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1685 (Defensive Tool Manipulation) and T1059 (Command-Line Interface).

  The primary telemetry sources are PowerShell script logs, along with Script Block Logging, which needs to be enabled for detection. If this activity is performed maliciously, it could lead to undetected malware execution and compromise critical systems. It is important to note that this detection does not confirm malicious intent on its own; legitimate administrators may also perform this action as part of system management.

  ### Investigation Steps

  - **Review recent PowerShell activity:**
    Analyze PowerShell execution logs (Event ID 4104) for the presence of commands containing '-ExclusionPath', '-ExclusionExtension', '-ExclusionProcess', or '-ExclusionIpAddress'. Look for unexpected use during off-hours or from uncommon user accounts.

  - **Identify script source:**
    Check the ScriptBlock logging (Event ID 4104) for script source details. Legitimate scripts typically originate from known administrative accounts or scheduled tasks. Unknown or anomalous sources should be flagged for further review.

  - **Compare changes to policy:**
    Examine Windows Defender configuration via the Windows Management Instrumentation (WMI) or using Get-MpPreference command logs. Look for recent changes that align with the PowerShell commands detected. A sudden increase in exclusions without proper justification raises suspicion.

  - **Correlate with system anomalies:**
    Investigate for any abnormal system behavior post-exclusion addition, like increased CPU usage or network connection to uncommon external IPs. Use resource monitoring tools or Windows Event logs (Event ID 4688 for new process creation) to correlate with the time of the change.

  - **Assess user permissions:**
    Review the user accounts that executed the script (Event ID 4688). Ensure that only legitimate administrative users have the rights to make such protective changes to the Windows Defender settings. Note if the users had elevated permissions recently assigned.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on system integrity and security. The likelihood of malicious abuse is significant, as attackers commonly use such exclusions to facilitate malware operations. Given the frequency of legitimate scenarios that may also trigger this detection, careful context analysis is essential.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled, which is required for reliable monitoring of PowerShell activity. Additionally, legitimate maintenance activities could trigger this alert, especially in a managed environment. A companion detection to consider is monitoring for unusual outbound connections or file creations indicative of post-exploitation behavior, such as suspicious file executing shortly after exclusions are added.

