detection:
  selection_args_exc:
    ScriptBlockText|contains:
    - ' -ExclusionPath '
    - ' -ExclusionExtension '
    - ' -ExclusionProcess '
    - ' -ExclusionIpAddress '
  selection_args_pref:
    ScriptBlockText|contains:
    - 'Add-MpPreference '
    - 'Set-MpPreference '
  condition: all of selection*
