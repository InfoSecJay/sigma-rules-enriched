logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: 'Get-Process lsass'
  condition: selection
falsepositives:
- Legitimate certificate exports invoked by administrators or users (depends on processes
  in the environment - filter if unusable)
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to execute a PowerShell command that retrieves information from the Local Security Authority Subsystem Service (LSASS) process using `Get-Process lsass`. Such activity is often associated with credential dumping techniques employed by attackers to extract sensitive information, like password hashes, from the LSASS memory. The primary objective of an attacker executing this command is to gain access to user credentials, facilitating lateral movement within a network or enabling further exploitation of target systems.

  This behavior aligns with the MITRE ATT&CK framework, specifically under the **Credential Access** tactic and the technique **T1003.001: Credential Dumping: LSASS Memory**. Attackers often use tools like Mimikatz for this purpose, particularly when they aim to escalate privileges and maintain access to systems within an enterprise environment.

  To effectively detect this activity, relevant telemetry sources include **PowerShell script block logs** that capture the details of executed scripts, particularly those involving process manipulation commands.

  ### Investigation Steps
  - **Review Script Block Logs:** Examine PowerShell script block logs for instances of the command `Get-Process lsass`. Focus on logs captured shortly before the alert to identify the context of execution.
  - **Check for Unusual User Activity:** Investigate the user account that executed the command. Look for anomalies in behavior, such as execution from non-standard systems or during off-hours.
  - **Analyze Process Creation Events:** Review Windows Event logs related to process creation (Event ID 4688) for any processes spawned around the same time that exhibit suspicious behavior or parent-child relationships.
  - **Inspect LSASS Memory Access Attempts:** If available, monitor for any attempts to access LSASS memory directly, including use of tools like Mimikatz, which may provide additional context regarding potential credential dumping activity.

  ### Prioritization
  Given that credential dumping can lead to full account compromise and further network infiltration, this alert is considered high severity. Attackers utilizing PowerShell to target LSASS represent a significant threat to the integrity of enterprise security.

  ### Blind Spots and Assumptions
  This rule relies on PowerShell script block logging being enabled, which may not be configured in all environments. Additionally, it assumes that legitimate administrative actions do not typically invoke `Get-Process lsass`, though this could vary by operational requirements. Gaps may exist in detection if similar commands are executed without using PowerShell or if script block logging is disabled, leading to potential missed detections of credential access attempts from other tools or methods.

