note: |
  ### Technical Context

  This rule detects the execution of a PowerShell command that retrieves information about the Local Security Authority Subsystem Service (LSASS) process. The primary intent behind such behavior is usually to access sensitive credentials stored in memory, which aligns with credential dumping techniques. This activity falls under the MITRE ATT&CK framework's Credential Access tactic, specifically the technique T1003.001: Credential Dumping – LSASS Memory. The primary telemetry source for this rule is PowerShell script block logging, specifically monitoring the execution of script blocks that contain the `Get-Process lsass` command. If malicious, this behavior can lead to unauthorized access to user credentials and elevate the attacker’s privileges. However, this detection does not confirm that credential dumping has occurred; it only indicates a potentially malicious command execution.

  ### Investigation Steps

  - **Validate PowerShell Execution Policy:** Check PowerShell event logs (Event ID 4104) for script block logs that contain `Get-Process lsass`. This will confirm whether the command was executed and capture additional context.

  - **Identify Malicious Indicators:** Look for unusual parent processes (e.g., a command shell or Windows Scheduler) that initiated the PowerShell execution. Malicious PowerShell commands may often be spawned from uncommon parent processes compared to typical scripting use cases.

  - **Assess Legitimate Use Cases:** Review the logged script blocks in the context of known administrative actions in your environment. Identify if the command was issued as part of a legitimate activity, such as a scheduled task run by a systems administrator.

  - **Correlate with LSASS Memory Dump Techniques:** Check for additional suspicious activity during the same timeframe, such as the use of tools like Mimikatz or system-related activity involving `lsass.exe` through Process Creation Event ID 4688, indicating a broader attack pattern.

  - **Review User and Asset Criticality:** Identify the user account that triggered the alert and the role of the affected system (e.g., domain controller vs. user workstation). High-importance assets may warrant immediate attention and investigation.

  ### Prioritization

  This alert should be considered high severity due to the criticality of the LSASS process in credential management. The likelihood of abuse is high since this command is commonly leveraged by attackers during credential dumping operations. As this behavior is often weaponized in various malware campaigns, prompt investigation is essential.

  ### Blind Spots and Assumptions

  While this rule can detect the command execution, it may be evaded by obfuscation techniques or other indirect methods of credential dumping. Ensure that PowerShell script block logging is correctly enabled for reliable detection. Legitimate administrative tasks, like certificate management or troubleshooting, may also trigger this alert. A related detection to consider is monitoring for memory access to LSASS via process injection techniques (e.g., hooking or dumping), which would complement coverage of credential access activities.

