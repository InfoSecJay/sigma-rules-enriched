logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: 'Get-Process lsass'
  condition: selection
falsepositives:
- Legitimate certificate exports invoked by administrators or users (depends on 
  processes in the environment - filter if unusable)
level: high
note: |
  ### Technical Context

  This rule detects the use of the `Get-Process` command targeting the LSASS process, an indicator commonly associated with credential dumping attempts by attackers. The likely objective of this behavior is to extract sensitive information such as user credentials or access tokens from the LSASS memory space. This detection corresponds to the MITRE ATT&CK tactic of Credential Access (Tactic: Credential Access, Technique: T1003.001).

  The primary telemetry sources for this detection are Windows PowerShell logs, specifically those generated by Script Block Logging, which must be enabled to capture these events. If malicious, the security impact is significant as it may indicate an ongoing breach where an adversary is trying to steal credentials. Importantly, this detection does NOT confirm malicious behavior on its own, as legitimate administrative actions may also invoke similar PowerShell scripts.

  ### Investigation Steps

  - **Check PowerShell command logs:** Review PowerShell script block logs (Event ID 4104) for the presence of `Get-Process lsass`, noting the execution context and user account making the call. Look for any anomalies in user roles or system usage patterns.

  - **Identify process creation events:** Investigate Security Event ID 4688 logs around the same time frame to identify process creation events that could indicate a suspicious parent process spawning the PowerShell instance targeting LSASS.

  - **Review user behavior:** Analyze user activity logs for the user account executing the command. Compare against typical behaviors to identify any deviations that may suggest compromise (e.g., unusual hours of operation or different systems accessed).

  - **Validate known benign scenarios:** Confirm if legitimate administrative tasks were performed around the time of the alert, such as auditing or certificate management operations, to rule out false positives.

  - **Look for high-confidence indicators:** Check for other indicators such as the use of `Invoke-Expression` or encoded commands (e.g., `-EncodedCommand`), which may suggest deeper malicious activity aimed at obfuscating intent.

  ### Prioritization

  This alert is classified as high severity due to the critical role of the LSASS process in managing sensitive credentials on Windows systems. The likelihood of malicious abuse is elevated, especially since credential dumping is commonly employed in attacks. This behavior is known to be weaponized frequently by various threat actors.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by the requirement for Script Block Logging to be enabled; if this is not configured, the rule may fail to trigger. Legitimate administrative tasks, such as certificate exports or user debugging activities, could inadvertently trigger this alert. A related detection method that strengthens coverage includes monitoring for LSASS memory access attempts or other related telemetry that signify unauthorized access actions (e.g., using Sysmon Event ID 10 for process access).

