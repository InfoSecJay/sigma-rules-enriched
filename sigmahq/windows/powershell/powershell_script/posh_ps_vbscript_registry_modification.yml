note: |
  ### Technical Context
  This detection rule identifies attempts to modify the Windows registry using the `CreateObject("Wscript.shell")` and `RegWrite` methods within PowerShell scripts or commands. Attackers often utilize this technique to evade traditional monitoring solutions that primarily focus on direct registry manipulation via tools like `regedit.exe` or native PowerShell cmdlets. The objective behind such actions usually involves establishing persistence, evading defenses, or escalating privileges on the target system while remaining under the radar of security controls.

  The primary MITRE ATT&CK tactics relevant to this rule include **Persistence** (T1547), **Defense Evasion** (T1218), and **Execution** (T1059.005). By leveraging VBScript embedded in PowerShell, adversaries can secretly modify registry entries crucial for the execution of malicious payloads or persistent threats. Key telemetry sources likely to provide insight into such activities include process creation logs and PowerShell execution logs, particularly those capturing script block text.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell execution logs for any instances of `CreateObject`, `Wscript.shell`, and `.RegWrite`, which will indicate the use of VBScript methods to alter registry entries.

  - **Examine Process Details:** Look into the process creation events where PowerShell was invoked. Focus on parent-child process relationships to identify any suspicious command chains leading to registry modification attempts.

  - **Check Registry Access Logs:** Gather logs relating to registry access that might highlight any unauthorized changes made. Pay special attention to keys related to startup processes, which might indicate persistence mechanisms.

  - **Correlate with User Activity:** Investigate the context of the user account executing the scripts. Look for anomalies in patterns of behavior that might indicate compromised user credentials or privilege escalation efforts.

  ### Prioritization
  The severity of this alert is rated as medium due to its potential use for establishing persistence or evading security measures. While not all alerts indicate malicious behavior, the ability to alter the registry without standard tools signifies an elevated risk in an enterprise environment.

  ### Blind Spots and Assumptions
  There are inherent blind spots within this detection, particularly regarding legitimate administrative activities that might legitimately use VBScript for registry modifications. The detection assumes that the logging necessary to capture against these attempts is correctly configured and available; if administrative scripts utilize the same patterns, there may be a higher rate of false positives. It’s also important to ensure that PowerShell logging is configured to capture detailed execution information, as this will be crucial for the effectiveness of the detection logic.

