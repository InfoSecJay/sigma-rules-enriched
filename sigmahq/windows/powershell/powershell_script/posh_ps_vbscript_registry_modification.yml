note: |
  ### Technical Context

  This rule detects attempts to modify the Windows registry using VBScript's `CreateObject("Wscript.shell")` method alongside the `RegWrite` function, executed within PowerShell scripts. Attackers often utilize this technique to bypass traditional detection mechanisms that monitor direct registry access via tools such as `regedit.exe` or PowerShell's native registry cmdlets. The likely objective includes establishing persistence, evading defenses, or escalating privileges.

  The relevant MITRE ATT&CK techniques are Persistence (T1112) and Command and Scripting Interpreter: Windows PowerShell (T1059.005). The primary telemetry sources include PowerShell logs, specifically the Script Block Logging containing Event ID 4104, which captures executed scripts. If malicious, such behavior could lead to unauthorized system modifications and potential lateral movement within the network. However, this detection on its own does not confirm malicious intent, as it may also trigger from benign administrative scripts.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs for execution details:** Review PowerShell logs (Event ID 4104) for any related ScriptBlockText containing both `CreateObject` and `Wscript.shell`. Legitimate admin scripts may include registry modifications, but review context and the author of the scripts.

  - **Identify the script execution context:** Analyze the `UserID` field from Event ID 4104 logs. Compare against known admin accounts. Scripts executed by unprivileged users could indicate potential misuse.

  - **Examine process creation logs:** Investigate Windows Event ID 4688 for processes that correlate with the timing of the registry modification attempt, specifically looking for PowerShell processes (powershell.exe) that spawn VBS scripts.

  - **Look for registry changes:** Use Event ID 4657 (Registry value modified) to confirm changes in registry keys. Verify if the modified keys are linked to persistence mechanisms (e.g., startup entries), noting legitimate applications that might use similar registry paths.

  - **Review for common malicious indicators:** Check for connections to known malicious infrastructure or command-and-control (C2) domains in network traffic logs during the time of the script execution. Indicators could include unusual external connections from hosts executing this script.

  - **Correlate with related detections:** See if similar behavior appears in associated, companion detections, especially those tied to fileless malware techniques. This can enhance the confidence in determining whether the alert stems from legitimate or malicious activity.

  ### Prioritization

  The alert holds medium severity as it involves potential registry modifications that can affect critical system functions. The likelihood of malicious abuse is moderate, as attackers commonly leverage this technique for persistence or privilege escalation. The behavior is frequently observed in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of Script Block Logging or if PowerShell logging is not adequately configured. Legitimate administrative scripts may trigger these alerts, potentially leading to false positives. Companion detections such as direct registry access using `reg.exe` or activity around known persistence techniques should be considered to enhance overall monitoring and detection capability.

