note: |
  ### Technical Context

  This Sigma rule detects attempts to modify the Windows registry using VBScript via the PowerShell environment, specifically through the usage of `CreateObject("Wscript.shell")` and the `.RegWrite` method. Attackers often employ this technique to evade traditional detection methods that monitor direct registry interactions, which could involve common tools like regedit.exe or PowerShell’s built-in cmdlets. The likely objective of an adversary is to establish persistence, evade defenses, or escalate privileges by altering crucial registry keys.

  This activity correlates with the MITRE ATT&CK techniques of Persistence (T1547) and Defense Evasion (T1112). The primary telemetry sources involved are PowerShell logs, specifically targeting the 'ScriptBlockText' field to analyze the executed scripts. If malicious, unauthorized modifications to registry keys may allow for backdoor access or system manipulation. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may also utilize similar methods for configuration purposes.

  ### Investigation Steps

  - **Review PowerShell command logs**: Inspect PowerShell logs for Event ID 4104 detailing specific script block text containing `CreateObject`, `Wscript.shell`, and `.RegWrite`. Compare against known good administrative scripts.

  - **Check affected registry keys**: Identify any registry keys modified during the alert time frame. Focus on keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`, which are often targeted for persistence.

  - **Analyze script execution context**: Determine the user context in which the PowerShell script was executed. Look for unusual accounts or elevated privileges that suggest malicious intent. Examine `UserID` and `SessionID` fields in Event ID 400 for context.

  - **Identify high-confidence malicious indicators**: Look for prior detections of the same script or behavior across your environment. If the same script path is repeated with registry writes, it may indicate malicious modification.

  - **Document legitimate activity**: Compare the script behavior to legitimate administrative tasks. Note expected patterns like installation scripts from verified sources that modify registry keys—these typically have accompanying logs indicating context or origin.

  ### Prioritization

  This alert poses medium severity in an enterprise context, given that it detects behavioral patterns commonly exploited for persistence and evasion. The likelihood of malicious abuse is significant, as utilizing VBScript embedded in PowerShell is a documented technique among threat actors, particularly in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection limitations arise as legitimate administrative activities may also invoke similar VBScript methods for registry modifications, introducing false positives. It’s crucial to ensure that PowerShell logging is fully enabled, as incomplete telemetry can lead to undetected malicious actions. Additionally, monitoring for related techniques such as process injection or script execution from unusual paths can bolster overall detection capabilities.

