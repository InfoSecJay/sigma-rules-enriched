note: |
  ### Technical Context
  This detection rule identifies the use of a PowerShell script known as DNSExfiltrator, which facilitates the covert transfer of files over DNS requests. The main threat scenario revolves around attackers attempting to exfiltrate sensitive data from an organization's network using DNS as a stealthy channel, which can bypass traditional data loss prevention (DLP) measures. Attackers leverage this technique to potentially extract information while evading detection, especially in environments where HTTP/HTTPS traffic is heavily monitored.

  Relevant MITRE ATT&CK techniques include Exfiltration Over Alternative Protocol (T1048), which describes how adversaries may use protocols not typically monitored to transmit data out of an organization. The initial goal of such a technique is to discreetly extract sensitive information or files while minimizing chances of detection.

  Primary data sources that would best capture evidence of this behavior include PowerShell Script Block Logging logs, which capture detailed information on executed scripts. Additionally, DNS logs can provide insights into unusual queries that may indicate exfiltration attempts.

  ### Investigation Steps
  - **Collect PowerShell Logs:** Gather Windows PowerShell Script Block Logging logs to identify instances of the `Invoke-DNSExfiltrator` command or any related parameters like `-i` and `-d`. Review the scripts that triggered scripting events for contextual analysis.

  - **Analyze DNS Query Logs:** Examine DNS query logs for anomalous requests associated with known malicious domains or unusual patterns that could suggest data exfiltration activities, such as queries with unusually large payloads or high-frequency requests.

  - **Review Network Traffic:** Use network traffic analysis tools to inspect outbound DNS traffic. Look for unusual spikes in DNS requests that correlate with PowerShell execution times, focusing on specific timestamps related to the alerts generated.

  - **Investigate User Behavior:** Conduct a thorough investigation into the user who executed the script. Review their access patterns and privileges to establish a baseline and identify any deviations from normal behavior that could indicate potential insider threats or compromised accounts.

  ### Prioritization
  This alert is classified as high severity due to the potential impact associated with data exfiltration, which could lead to significant information breaches, regulatory penalties, and reputational damage. The likelihood is heightened if indicators show frequent usage of PowerShell scripts in the environment or if existing security controls do not effectively monitor DNS traffic.

  ### Blind Spots and Assumptions
  One major gap in detection coverage is the reliance on PowerShell Script Block Logging being enabled, which may not be configured in all environments. The detection logic assumes that any scripts utilizing `Invoke-DNSExfiltrator` are malicious; however, legitimate usage of PowerShell for valid purposes might lead to false positives. Additionally, the detection will only function effectively if comprehensive DNS logging is in place to capture all relevant inquiries associated with potential exfiltration activities.

