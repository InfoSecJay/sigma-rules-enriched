note: |
  ### Technical Context

  This rule detects the usage of the `Invoke-DNSExfiltrator` command, which is used to covertly exfiltrate data over DNS requests by encoding the file content within DNS queries. The likely attacker objective is data theft, specifically targeting sensitive information from the network without drawing attention. This behavior aligns with the MITRE ATT&CK technique T1048 - Exfiltration Over Alternative Protocol.

  The primary telemetry sources include PowerShell script logs, specifically focusing on Script Block Logging. It is crucial for capturing commands executed in PowerShell sessions. The potential security impact is significant since successful DNS-based exfiltration can lead to unauthorized access and data breaches. However, it's important to note that this detection does NOT confirm the success of data exfiltration on its own; further investigation is required to assess if sensitive information was indeed captured and sent.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious command execution:** Check for `PowerShell` events (Event ID 4104) that document the execution of `Invoke-DNSExfiltrator`. Look for the presence of `-i`, `-d`, `-p`, `-doh`, or `-t` within the `ScriptBlockText` field to confirm potential malicious activity.

  - **Analyze DNS query patterns:** Investigate DNS logs for unusual query types or a high volume of DNS queries originating from the host executing the command. Compare against baseline behavior to identify patterns that may indicate exfiltration attempts.

  - **Identify potential data leakage:** Check if any files or sensitive information have been targeted for exfiltration by reviewing file access logs corresponding to the user context involved in the PowerShell execution. Look for matched timestamps between file access and DNS queries to establish a connection.

  - **Establish baseline behaviors:** Determine normal PowerShell usage patterns within the environment for the user or system in question. Identify legitimate use cases for data transmission commandlets, ensuring they do not correspond with malicious indicators found.

  - **Investigate HTML or unknown file extensions in DNS:** Review DNS query responses for unusual records or payloads that do not conform to expected data formats. Malicious exfiltration might manifest through odd file extensions or anomalies in the transferred data.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on sensitive data residing in the affected system and the likelihood of malicious abuse through known techniques for data exfiltration. The covert nature of DNS tunneling is commonly weaponized, making rapid response essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate applications may also trigger the alert under certain conditions, such as standard DNS services or backup systems using similar PowerShell commands. Reliable detection relies on enabled Script Block Logging and DNS query logging. Additionally, routine administrative activities might use `Invoke-DNSExfiltrator` inadvertently. A companion detection to consider is monitoring for anomalous DNS traffic patterns that may indicate broader data exfiltration trends or host-based integrity monitoring solutions to track unexpected file access or modifications.

