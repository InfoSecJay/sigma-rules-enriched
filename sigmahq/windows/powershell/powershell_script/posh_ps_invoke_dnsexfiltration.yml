note: |
  ### Technical Context

  This Sigma rule detects the use of a PowerShell script that facilitates data exfiltration via DNS requests, specifically identifying the execution of `Invoke-DNSExfiltrator`. The likely attacker objective is to covertly transfer sensitive information outside the organization by utilizing DNS queries as a channel for data exfiltration, avoiding traditional network defenses. This behavior aligns with the MITRE ATT&CK technique T1048 (Exfiltration Over Alternative Protocol), specifically under the tactic of Exfiltration.

  The primary telemetry sources for this detection include Windows PowerShell script block logging, specifically looking for ScriptBlockText containing specific command patterns indicative of the DNS exfiltration tool. If malicious, the security impact could be significant, leading to unauthorized data disclosure and potential regulatory breaches. Importantly, this detection does NOT confirm that exfiltration occurred on its own; it indicates that a command intended for DNS-based exfiltration was executed, requiring further investigation.

  ### Investigation Steps

  - **Check script block logging:** Review Security Event ID 4104 for script block text that contains `Invoke-DNSExfiltrator`. Look for parameters like `-i`, `-d`, `-p`, `-doh`, and `-t`, which indicate the operation of the script.

  - **Identify high-confidence malicious indicators:** Evaluate if there are multiple DNS requests generated within a short timeframe that correspond to the execution of this script. Legitimate requests typically do not generate such high volumes and may lack recognizable patterns in query names.

  - **Correlate with other telemetry sources:** Investigate DNS logs for unusual activity, particularly queries that do not match routine DNS traffic or look for domain names associated with exfiltration tools. Typical legitimate domain requests will reflect known, stable entities without unusual sub-domain patterns.

  - **Assess the host's role and context:** Determine if the host running the script is a sensitive asset (e.g., a server with PII) or a common user machine. The potential for impact varies significantly based on asset criticality.

  - **Monitor for file creation or network calls:** Check for any unusual files created in the execution context of PowerShell, along with outbound network calls to domains related to potential exfiltration (e.g., unknown or suspicious DNS queries).

  ### Prioritization

  This alert has a high severity due to the potential exposure of sensitive data through unauthorized channels. Given the nature of DNS exfiltration, this behavior is frequently weaponized by adversaries, particularly in targeted attacks. The affected systems' criticality can further amplify the potential for harmful impacts.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of script block logging; if not enabled, this rule will fail to trigger. Adversaries could utilize legitimate scripts or modify them minimally to evade detection. Additionally, aggressive legitimate administrative activities may trigger this alert. Companion detections might include monitoring for IP addresses and domains with known associations to DNS tunneling activities to strengthen overall coverage.

