  ---

  ### Technical Context

  This Sigma rule detects the use of the PowerShell `Start-Process` cmdlet with the `-PassThru` option, which may indicate attempts to execute background processes in a stealthy manner. The likely attacker objective is to run unauthorized or malicious code while remaining undetected, particularly as this command can be used to manipulate processes without drawing attention. This behavior aligns with the MITRE ATT&CK technique for T1036.003: "Masquerading," as it can be employed to disguise malicious actions or create confusion about running processes.

  Primary telemetry sources include Windows PowerShell script logs, specifically related to script block logging. The relevant log type for this detection requires that Script Block Logging is enabled. If executed maliciously, this behavior can lead to process creation that may facilitate further exploitation or lateral movement within the environment. Importantly, this detection alone does not confirm that malicious activity has occurred; it simply indicates the use of a potentially suspicious command which requires further analysis.

  ---

  ### Investigation Steps

  - **Check Script Block Logging for relevant events:** Review Windows Event ID 4104 for log entries containing `Start-Process` with `-PassThru` to identify the context of the command usage, including parameters and script contents.

  - **Validate process creation:** Correlate with Security Event ID 4688 to examine the process creation events related to the PowerShell execution, looking for indicators such as unexpected parent processes or argument usage typical of malicious activities.

  - **Identify legitimate PowerShell uses:** Cross-reference the context of the identified command with known-good scripts within the environment, especially those signed or executed by trusted administrators. Look for expected script names or routine administrative tasks that match.

  - **Assess potential malicious indicators:** Seek out abnormal behavior in the process tree—any PowerShell process parented by `explorer.exe` or unusual runtime durations which stray from standard operational norms may indicate malicious activity.

  - **Inspect for file creation or modification:** Look for artifacts related to files created or modified during the PowerShell execution, specifically in sensitive directories (e.g., system32 or user temp folders), as this could indicate exfiltration or payload deployment.

  - **Review for lateral movement:** Check for indicators of lateral movement, such as attempts to invoke remote PowerShell sessions from the detected process, by reviewing Event ID 4624 for logon events coming from unusual sources.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on the system from unauthorized process execution and the medium likelihood that this behavior could be exploited by an adversary. While using PowerShell is common among administrators, the specific use of `-PassThru` raises concerns about stealthy execution tactics, making it a point of consideration for escalation.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques such as using obfuscated scripts or legitimate PowerShell-based tools may bypass this detection. Reliable detection relies on having Script Block Logging enabled; without this, the visibility into PowerShell activities may be limited. Legitimate administrative tasks or automation scripts may also trigger this alert if not properly reviewed. Companion detections include monitoring for anomalous scheduled tasks (ATT&CK T1053) which could help identify additional suspicious behavior stemming from these PowerShell commands.

