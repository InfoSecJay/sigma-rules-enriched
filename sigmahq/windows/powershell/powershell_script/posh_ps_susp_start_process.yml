logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Start-Process '
    - 'saps '
  selection_param:
    ScriptBlockText|contains|all:
    - '-PassThru '
    - '-FilePath '
  condition: all of selection_*
falsepositives:
- Legitimate PowerShell scripts
level: medium
