note: |
  ### Technical Context
  This detection rule identifies suspicious use of the PowerShell `Start-Process` command with the `-PassThru` option, typically indicating attempts to execute commands in the background while maintaining the process's reference. Attackers may utilize this method to obscure malicious activity, initiate secondary payloads, or execute remote commands while minimizing detection. This behavior can be correlated with lateral movement tactics and efforts to maintain persistence within the environment.

  The primary MITRE ATT&CK techniques relevant to this rule include:
  - **T1036.003: Masquerading: Match Legitimate Name or Location**—as attackers may disguise their activities using common PowerShell commands.
  - **T1059.001: Command and Scripting Interpreter: Windows Command Shell**—as PowerShell is commonly leveraged for executing various scripts or commands that could lead to exploitation.

  The principal data sources to monitor include PowerShell script block logs, which provide insights into executed scripts, and process creation events that document the initiation of processes and their arguments.

  ### Investigation Steps
  - **Review PowerShell Logs:** Collect and analyze PowerShell script block logs to identify the specific commands executed. Look for any unusual arguments or parameter patterns indicative of deliberate obfuscation.

  - **Analyze Process Creation Events:** Examine process creation events for instances where `Start-Process` is invoked with `-PassThru` and ensure there are no suspicious parent-child process relationships.

  - **Investigate Signature and Hashes:** Validate the hashes of PowerShell scripts involved to determine if they correspond with known legitimate scripts or if they appear to be custom or malicious scripts.

  - **Check for Anomalous Behavior:** Look for other signs of anomalous behavior, such as unusual outbound connections initiated by the created processes that might indicate data exfiltration or callback functionality.

  ### Prioritization
  This alert should be classified as medium severity. While the use of `Start-Process -PassThru` can be legitimate in certain contexts, its misuse could indicate malicious activities, warranting timely investigation to prevent potential exploitation.

  ### Blind Spots and Assumptions
  One potential gap in this detection coverage is the need for Script Block Logging to be enabled in PowerShell, without which the detection would be ineffective. Additionally, the detection logic assumes that the `-PassThru` option is solely used for malicious purposes without considering legitimate use cases, which may lead to false positives. It is crucial that environments have appropriate logging configurations in place for effective monitoring and detection of such behavior.

