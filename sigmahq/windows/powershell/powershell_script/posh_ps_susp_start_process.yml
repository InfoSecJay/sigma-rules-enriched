note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Start-Process` command with the `-PassThru` option, which may indicate an effort to manipulate processes in a stealthy manner. Attackers could leverage this command for evasion tactics, potentially aiming to execute malicious scripts or payloads while minimizing visibility. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Command-Line Interface (T1059.001).

  Primary telemetry sources are Windows PowerShell logs, particularly the event logs generated when Script Block Logging is enabled. The security impact of this behavior is significant; if malicious, it could lead to process manipulation or code execution in hidden contexts. Importantly, this detection does NOT confirm that the activity is malicious on its own, as legitimate PowerShell scripts can also employ this command.

  ### Investigation Steps

  - **Check PowerShell logs for Script Block Logging:** Review Event ID 4103 for details on the executed PowerShell commands and filter by those containing `Start-Process -PassThru`. This can identify both legitimate and suspicious activity.

  - **Identify high-confidence malicious indicators:** Look for unusual or unexpected file paths being executed with `-PassThru` that may suggest an unauthorized script execution (e.g., paths leading to temporary folders or user-specific directories).

  - **Contextualize with process parents:** Verify the parent process of the `Start-Process` command by analyzing Event ID 4688 for process creation in conjunction with Script Block logs. Common benign scenarios may involve processes initiated by known Windows applications, while suspicious or unexpected parents (e.g., cmd.exe, wscript.exe) imply potential malicious intent.

  - **Review historical usage of PowerShell:** Analyze the frequency and context of PowerShell executions on the host system. Determine if there are legitimate administrative use cases (e.g., IT operations) or if the behavior emerged suddenly, which may indicate a compromise.

  - **Assess the affected host's criticality:** Identify the role of the host where the alert originated (e.g., Domain Controller, file server, endpoint) and prioritize investigation accordingly, since a compromise on critical infrastructure poses a higher risk.

  ### Prioritization

  The alert severity is medium due to the potential impact of compromised systems, especially if they run critical applications or house sensitive data. While use of `Start-Process -PassThru` can be part of legitimate administrative tasks, its invocation in unexpected contexts raises the likelihood of malicious abuse, making this a noteworthy behavior to investigate.

  ### Blind Spots and Assumptions

  Detection relies on having Script Block Logging enabled; if not configured, the rule may miss relevant events. Attackers might employ aliases or encoded commands to obfuscate their use of PowerShell and evade detection. Legitimate administrative scripts, such as system maintenance routines or automation tools, may trigger the alert without malicious intent. A related detection to consider strengthening coverage would be monitoring for unusual script invocations or execution from non-standard directories.

