logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'Start-Process '
    - 'saps '
  selection_param:
    ScriptBlockText|contains|all:
    - '-PassThru '
    - '-FilePath '
  condition: all of selection_*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  The detection identifies the use of the PowerShell `Start-Process` cmdlet with the `-PassThru` option, which may indicate suspicious activity as it allows a script to start a process without direct feedback, often used in stealthy execution. Attackers may leverage this behavior to spawn background processes that evade detection. The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1036.003: Masquerading**.

  Primary telemetry sources include Windows PowerShell logs, specifically when script block logging is enabled. Malicious use could allow an attacker to execute and control processes without alerting security monitoring. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate scripts may also employ this command structure.

  ### Investigation Steps

  - **Review PowerShell Logs:** Ensure Script Block Logging is enabled and check for Event ID 4104 for instances of `Start-Process` with `-PassThru`. Look for scripts that incorporate these parameters.

  - **Analyze Process Interactions:** Use Sysmon Event ID 1 to analyze the created processes and their parent-child relationships. Malicious actions will often show unusual parent processes or unexpected command-line arguments.

  - **Identify Legitimate Usage Patterns:** Check for cron jobs or trusted scheduled tasks that might utilize `Start-Process -PassThru`. Legitimate instances should originate from known paths and trusted scripts.

  - **Correlate with Other Alerts:** Review alerts from related detections, such as unusual access patterns or failed login attempts that could suggest an attacker is leveraging this command for lateral movement.

  - **Examine Network Communication:** Assess network logs for established connections or unusual outbound traffic that might correlate with the execution of this command. Check for unexpected connections, possibly related to exfiltration attempts.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if an attacker exploits the system with stealthy process execution. Although not excessively common, the behavior can align with targeted attacks seeking to evade detection, underscoring the importance of immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for legitimate PowerShell scripts to trigger similar alerts, and reliance on enabled Script Block Logging is critical for reliable detection. Evasion techniques may include obscuring the command structure or leveraging obfuscated scripts. A companion detection based on PowerShell script execution context would strengthen coverage against malicious activity.

