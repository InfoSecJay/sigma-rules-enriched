note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Start-Process` command with the `-PassThru` parameter, which allows initiating processes in the background while maintaining access to the process objects. This behavior may indicate an attacker attempting to execute commands stealthily or to manipulate processes in a way that removes visibility from standard process monitoring tools. The likely attacker objective could be to stage malware or execute further malicious payloads without alerting defenders.

  This detection relates to the following MITRE ATT&CK tactic and technique: **Execution (T1203)** and **T1036.003: Masquerading**. The primary telemetry sources include PowerShell script block logs (if logging is enabled) and Windows event logs specifically for PowerShell execution (Security Event ID 4104 for script block logging and Event ID 4688 for process creation). If malicious, this behavior may lead to unauthorized access or data exfiltration. However, it is important to note that this detection does not confirm malicious intent on its own; additional context and analysis are required.

  ### Investigation Steps

  - **Examine PowerShell script block logs**: Review Security Event ID 4104 for any use of `Start-Process` with `-PassThru`. Look for scripts that include this command in conjunction with unusual parameters or targets not typical for your environment.

  - **Check for underlying process details**: Analyze Security Event ID 4688 logs for any newly created processes initiated by PowerShell that have parent processes indicative of scripting tools or user-initiated actions, noting anything suspicious in command-line arguments.

  - **Validate against known legitimate scripts**: Compare detected PowerShell usage against your organization's approved PowerShell scripts or common administrative tasks that legitimately require the use of `Start-Process -PassThru`.

  - **Identify high-confidence malicious indicators**: Look for execution of unknown or unapproved executables initiated by the detected commands, particularly any that exhibit behavior typical of known malware (e.g., communication with known C2 servers).

  - **Assess affected host assets**: Consider the role of the host generating the alert. If it is critical infrastructure, the activity warrants higher scrutiny and potentially immediate containment actions.

  - **Confirm file creation or modifications**: Investigate any files created or modified around the time of detection, especially in temporary directories or paths commonly used for malicious software, to verify if there is associated malware execution.

  ### Prioritization

  The alert should be treated with medium severity. While the specific execution of a PowerShell command with the `-PassThru` option may not always indicate immediate danger, it poses a considerable risk when executed on sensitive systems. Given the potential for abuse by attackers, especially in environments where PowerShell is frequently used, it should be investigated promptly but not independently escalated.

  ### Blind Spots and Assumptions

  Detection efficacy hinges on the configuration of PowerShell script block logging; if it is disabled, this alert will not trigger. Additionally, legitimate administrative tasks might unintentionally invoke this alert. There is also a risk of evasion through obfuscation techniques or legitimate usage patterns in automation scripts. For better coverage, companion detections involving process behavior analysis or correlation with network traffic anomalies can enhance the ability to assess potential threats in conjunction with this alert.

