logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - Start-Process
    - '-PassThru '
    - '-FilePath '
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts using the `Start-Process` cmdlet with the `-PassThru` parameter, which allows the script to run processes in the background while returning process objects. Attackers may leverage this to execute malicious scripts covertly, potentially as part of a larger payload delivery or persistence mechanism. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (Tactic: Defense Evasion, Technique: T1036.003 - Masquerading: Rename or Modify Tool) as adversaries often disguise their activities to avoid detection.

  The primary telemetry sources are PowerShell script block logs. Specifically, the captured logs must include entries reflecting the `Start-Process` command and relevant parameters. If malicious, this activity could indicate an attempt to compromise system integrity or establish persistence. Importantly, this detection alone does not confirm malicious intent without additional context regarding the environment, the execution context, and related activities.

  ### Investigation Steps

  - **Review PowerShell script block logs**: Look for Security Event ID 4104 to find detailed script block logging around the execution of `Start-Process` with `-PassThru`. Check if the command is running from a non-standard user or processes as benign users might use PowerShell for legitimate tasks.

  - **Analyze the full process tree**: Use Process Explorer or similar tools to confirm if `Start-Process` initiated child processes were created without visible user interaction. Malicious processes may lack normal user engagement or run from unexpected paths.

  - **Correlate with user behavior**: Identify user account patterns through logs like Event ID 4624 (Logon events) or Windows Event ID 4688 (process creation) to determine if the user is known for scripting or if this behavior is anomalous.

  - **Verify file path and parameters**: Check the parameters passed to `Start-Process` for unusual file paths or arguments. Malicious usage often involves execution of non-standard tools or binaries in unusual directories.

  - **Inspect for lateral movement indicators**: Assess for additional signs of lateral movement or payload delivery behavior related to this alert, such as access to remote network shares (SMB), which may reveal broader attack tactics.

  ### Prioritization

  This alert has medium severity due to its potential impact on system integrity and the likelihood of being weaponized by adversaries to execute scripts covertly. While PowerShell is often used legitimately, its misuse in this context warrants closer examination to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may miss obfuscated or encoded PowerShell commands that evade typical logging. Enabling comprehensive script block logging is crucial for broader visibility. Legitimate automation processes in environments could trigger this alert, causing false positives. A related detection, such as monitoring for unusual PowerShell commands or abnormal execution patterns, would strengthen overall coverage against these behaviors.

