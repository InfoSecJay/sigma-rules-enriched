title: Clearing Windows Console History
id: bde47d4b-9987-405c-94c7-b080410e8ea7
status: test
description: Identifies when a user attempts to clear console history. An adversary
  may clear the command history of a compromised account to conceal the actions undertaken
  during an intrusion.
references:
- https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
- https://www.shellhacks.com/clear-history-powershell/
- https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect attempts to clear command history in Windows console environments, specifically within PowerShell. Attackers may utilize this technique during a compromise to erase traces of their activities, making it more challenging for SOC teams to perform post-incident investigations. By leveraging commands like `Clear-History`, `Remove-Item`, or manipulating the file where command history is stored (e.g., `ConsoleHost_history.txt`), an intruder aims to obscure evidence of their presence and any malicious actions taken.

  The detection aligns with the MITRE ATT&CK framework under the tactics of **Defense Evasion (TA0005)** and **Indicator Removal on Host (T1070)**, particularly the technique **Clear Command History (T1070.003)**. These techniques illustrate how adversaries may attempt to hide their footprints in a compromised system, presenting significant challenges to ongoing security monitoring efforts. The primary data sources for effective detection in this scenario include PowerShell script block logs, which provide insights into commands executed in the environment.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs for instances of the `Clear-History` command or associated commands such as `Remove-Item` or `rm`. These logs can reveal indicators of attempts to clear command history.
  - **Check History File Modifications:** Investigate the `ConsoleHost_history.txt` file at its specified path (retrieved via `(Get-PSReadlineOption).HistorySavePath`) for any recent modifications or deletions that may indicate malicious intent.
  - **Correlate with User Activity:** Look for unusual user activity or privileged operations during the same time frame surrounding the clearing of command history, as this may point to compromised credentials or unauthorized access.
  - **Validate Script Block Logging Settings:** Ensure that Script Block Logging is correctly configured and enabled, as these logs are critical for detecting this type of activity.

  ### Prioritization
  This alert receives a high severity rating in an enterprise environment due to the potential for attackers to hide their malicious activities, thereby increasing the risk of undetected breaches. The likelihood of encountering such behavior is significant, particularly against organizations experiencing targeted attacks.

  ### Blind Spots and Assumptions
  Detection logic may not capture all methods of history clearing, particularly if other less common commands or manual techniques are employed by an attacker. Additionally, it assumes that Script Block Logging is enabled and configured properly in all environments; if not, related activities may go undetected. Organizations should ensure that comprehensive logging policies are in place to facilitate effective detection of evasion tactics.

