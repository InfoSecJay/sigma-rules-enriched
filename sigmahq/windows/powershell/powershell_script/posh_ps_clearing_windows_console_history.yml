title: Clearing Windows Console History
id: bde47d4b-9987-405c-94c7-b080410e8ea7
status: test
description: Identifies when a user attempts to clear console history. An 
  adversary may clear the command history of a compromised account to conceal 
  the actions undertaken during an intrusion.
references:
- https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
- https://www.shellhacks.com/clear-history-powershell/
- https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to clear PowerShell's command history using specific commands like `Clear-History` or `Remove-Item` targeting the `ConsoleHost_history.txt` file. The likely attacker objective is to obfuscate their actions during an intrusion by removing evidence of executed commands. This activity fits within the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005) and the technique for Clearing Command History (T1070.003). The primary telemetry source is PowerShell Script Block Logging, which must be enabled, capturing logs related to script execution. If malicious, this behavior can significantly hinder forensic investigations and the overall detection of further nefarious activities. Importantly, this detection does NOT confirm that malicious action has occurred without corroborating evidence.

  ### Investigation Steps

  - **Review Script Block Logs**: Check for PowerShell Script Block logs (Event ID 4103) containing `Clear-History`, `Remove-Item`, or references to `ConsoleHost_history.txt` to identify the execution of suspicious commands.

  - **Analyze User Context**: Identify the user account associated with the script execution; verify if the account should have legitimate reasons to clear command history. Look for excessive or abnormal use of PowerShell, especially from non-admin users or during off-hours.

  - **Examine Command Log Files**: Validate the existence and timestamps of the `ConsoleHost_history.txt` or other PowerShell history files at `HistorySavePath`. Legitimate users will have standard retention and access patterns; deviations may indicate intent to conceal actions.

  - **Confirm Script Block Logging is Enabled**: Ensure that Script Block Logging is configured correctly across the environment. If it isn’t, this detection may lead to blind spots in monitoring.

  - **Identify Known Malicious Patterns**: Look for reoccurring indicators, such as along with command history clearing, if there are corresponding events that show execution of known malicious commands or files, such as persistence methods or data exfiltration.

  ### Prioritization

  The alert has high severity due to its implications on incident response as affected systems might be compromised. The likelihood of abuse is high since clearing command history is a common tactic among attackers seeking to hide their malicious activity. This behavior is not only concerning but also indicative of potentially deeper security breaches.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of PowerShell Script Block Logging in certain environments, leading to missed alerts. Additionally, legitimate administrative tasks or script maintenance operations might trigger the alert if authorized personnel clear history for valid reasons. Related detections, such as monitoring for suspicious PowerShell command invocations (e.g., using `Invoke-Expression` or `IEX`), can strengthen coverage against adversarial techniques.

