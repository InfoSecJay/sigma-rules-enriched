title: Clearing Windows Console History
id: bde47d4b-9987-405c-94c7-b080410e8ea7
status: test
description: Identifies when a user attempts to clear console history. An 
  adversary may clear the command history of a compromised account to conceal 
  the actions undertaken during an intrusion.
references:
- https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
- https://www.shellhacks.com/clear-history-powershell/
- https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-25
tags:
- attack.stealth
- attack.t1070
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies when a user attempts to clear PowerShell command history using commands like `Clear-History`, `Remove-Item`, or `rm` targeting the `ConsoleHost_history.txt` file. The likely objective of an attacker is to erase traces of their activities within a compromised account, thereby facilitating undetected lateral movement or exfiltration. This behavior is associated with the MITRE ATT&CK tactic: **Defense Evasion (T1070)**, specifically technique **Indicator Removal on Host (T1070.003)**.

  Primary telemetry sources include Windows PowerShell script block logs, specifically those that capture events when the history is cleared or manipulated. If successful, this activity can pose a significant security risk, as it obscures evidence of potentially malicious actions taken in the system. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative scripts or common troubleshooting activities might also lead to similar actions.

  ### Investigation Steps

  - **Review PowerShell script block logs:** Analyze logs for ScriptBlockText containing `Clear-History` or `Remove-Item` targeting `ConsoleHost_history.txt` (Event ID 4104 for PowerShell logs). Compare the timestamps and user context against normal usage patterns.

  - **Correlate user actions:** Check the user account active during the time of the command history clearance. Review logs from the same account for unusual commands or access patterns, particularly in sensitive areas of the network or critical systems.

  - **Identify recent command usage:** Look at the command history of the PowerShell session (if available) by reviewing relevant logs for unexpected or potential malicious commands immediately prior to the history-clearing actions.

  - **Determine asset criticality:** Assess the role and sensitivity of the affected system (e.g., management or domain controller). High-value or critical systems seeing this behavior warrant immediate attention and possibly elevated incident response.

  - **Flag recurrent behaviors:** If this action occurs frequently or in multiple accounts in a short time frame, such trends may indicate potential ongoing malicious activity or internal misuse needing further investigation.

  ### Prioritization

  This alert should be considered high priority, especially when triggered on critical infrastructure or administrative accounts. The potential for adversaries to exploit this behavior to obscure their actions significantly raises the likelihood of malicious abuse. Furthermore, clearing command history is a common technique employed by attackers to evade detection during lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of enabled Script Block Logging, which is crucial for capturing this activity. Furthermore, legitimate script usage by administrators can trigger similar alerts, creating potential false positives. The removal of PowerShell history could correlate with other evasion techniques such as file deletion or logs tampering, which suggests a comprehensive review of companion detections like **Command-Line Interface (T1059)** usage may strengthen coverage.

