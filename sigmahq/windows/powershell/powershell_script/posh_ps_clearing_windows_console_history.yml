logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects attempts to clear Windows PowerShell command history, specifically through commands like `Clear-History` or `Remove-Item` targeting the history file (typically `ConsoleHost_history.txt`). Adversaries may take this action to erase evidence of their activities after gaining initial access or executing commands on a compromised system, aiding in evasion from incident response investigations. This behavior corresponds with the MITRE ATT&CK tactic of Defense Evasion (T1070) and the technique of Indicator Removal on Host (T1070.003).

  The primary telemetry source for this detection comes from Windows PowerShell script block logging, which must be enabled to capture script execution details for analysis. If malicious, the impact could be significant as it implies active efforts to cover up adversarial activities potentially associated with data exfiltration or further compromise. It is important to note that this detection alone does NOT confirm malicious intent without additional context regarding the user or process making the request.

  ---

  ### Investigation Steps

  - **Review script block logs for command usage:** Investigate the relevant PowerShell logging (Windows Event ID 4103) around the time of the alert. Look for usages of `Clear-History` and identify the user context executing it to differentiate potential benign versus harmful actions.

  - **Establish baseline behaviors for legitimate users:** Verify if the user normally uses PowerShell to manage command history. Observe the typical frequencies and commands they execute, influencing the false positive rate of this detection.

  - **Look for context of `Remove-Item` commands:** Identify instances where `Remove-Item` or `rm` is used along with `ConsoleHost_history.txt`. Assess if this occurs without prior legitimate PowerShell session history—a strong indication of suspicious activity.

  - **Correlate alerts with other logs:** Cross-reference relevant user activities in Windows Security logs (Event ID 4624) and process creation logs (Event ID 4688) to analyze if the user was engaged in other potentially malicious actions around the same timeframe.

  - **Determine unusual account behavior:** Inspect for lateral movement characteristics or any abnormal login attempts related to the user account executing the history-clearing command. Unusual logon locations or times may intensify the suspicion of compromise.

  - **Document any file manipulations:** If file manipulations are detected, highlight any recent creations of files or unusual network connections (consider using Windows Firewall logs or Sysmon Network Connect events) that could indicate data exfiltration attempts following the command history clearance.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on forensic investigations if a critical system is involved. The likelihood of malicious exploitation is considerable when correlated with suspicious user actions or patterns typical of advanced adversaries. Attempting to clear command history is a common tactic employed by attackers to obfuscate their activities.

  ---

  ### Blind Spots and Assumptions

  False positives may arise from legitimate power users who clear their history for personal or organizational reasons. Detection relies on correctly configured PowerShell script block logging; without it, the alerts will not capture necessary actions. Additionally, benign administrative scripts may invoke similar commands without malicious intent. Companion detections that strengthen coverage could include monitoring for unusual PowerShell execution patterns or frequent remote administrative access attempts aligned with this activity.

