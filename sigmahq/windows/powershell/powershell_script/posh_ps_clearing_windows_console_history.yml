title: Clearing Windows Console History
id: bde47d4b-9987-405c-94c7-b080410e8ea7
status: test
description: Identifies when a user attempts to clear console history. An 
  adversary may clear the command history of a compromised account to conceal 
  the actions undertaken during an intrusion.
references:
- https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
- https://www.shellhacks.com/clear-history-powershell/
- https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-25
tags:
- attack.stealth
- attack.t1070
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_clearing_windows_console_history/info.yml
note: |
  ### Technical Context

  This rule detects attempts to clear PowerShell command history, specifically through the use of commands such as `Clear-History` or `Remove-Item` targeting the console history file. The likely attacker objective is to obfuscate their actions on a compromised account to avoid detection during and after an unauthorized intrusion. The relevant MITRE ATT&CK tactics and techniques are *Obfuscation* (TA0070) and *Indicator Removal on Host* (T1070.003).

  The primary telemetry sources include PowerShell script execution logs from Windows Event ID 4104, which captures the command history actions when Script Block Logging is enabled. Should this behavior be malicious, it poses a significant threat to incident response by hindering forensic analysis. Note that while this detection reveals attempts to clear command history, it does not confirm actual compromise or malicious intent without additional context.

  ### Investigation Steps

  - **Verify script block logs:** Review PowerShell event logs (Event ID 4104) for the execution of the detected command to confirm the alert. Look for entries having `ScriptBlockText` that includes “Clear-History” or the history file target patterns.

  - **Assess user risk:** Cross-reference the user account associated with the alert against baseline behavior. Legitimate users typically do not clear command history frequently. Look for typical user patterns in `Username` fields.

  - **Examine additional command execution:** Look for consecutive execution of commands in the same session display pattern. Check Event ID 4104 for other suspicious commands executed, especially following the `Clear-History` command to identify possible malicious workflows.

  - **Review file access logs:** Check filesystem access logs for any entries related to `ConsoleHost_history.txt` during the time frame of the alert as malicious actors may try to access or delete this history file.

  - **Evaluate script block logging:** Ensure that Script Block Logging is enabled and properly configured on targeted endpoints to maintain comprehensive detection coverage. If logging is disabled, notify appropriate teams to enable logging.

  - **Identify high-confidence malicious indicators:** Look for known patterns of behavior in surrounding logs, such as high-frequency script execution or concurrent access from multiple sessions, which could indicate automation or misuse, indicating higher risk.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on forensic investigations and incident response efforts. Since this behavior is commonly utilized for evasion techniques, it presents a notable risk for concealing other malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of PowerShell logging. If Script Block Logging is not enabled, this alert will not trigger. Legitimate use cases may occur for users clearing their command history regularly, particularly in developer or administrative contexts. A companion detection that strengthens overall coverage includes monitoring for authentication anomalies, such as failed login attempts or unusual access patterns, which could suggest a compromised account prior to history clearing.

