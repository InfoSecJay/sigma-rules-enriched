logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'New-ScheduledTaskAction'
    - 'New-ScheduledTaskTrigger'
    - 'New-ScheduledTaskPrincipal'
    - 'New-ScheduledTaskSettingsSet'
    - 'New-ScheduledTask'
    - 'Register-ScheduledTask'
  selection_cimmethod:
    ScriptBlockText|contains|all:
    - 'Invoke-CimMethod'
    - '-ClassName'
    - 'PS_ScheduledTask'
    - '-NameSpace'
    - 'Root\Microsoft\Windows\TaskScheduler'
  filter_main_legitimate_scripts:
    ScriptBlockText|contains|all:
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'Microsoft.Management.Infrastructure.CimInstance'
    - '__cmdletization_methodParameter'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_cmdlet_scheduled_task/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks on Windows systems via PowerShell. Adversaries may use this technique to establish persistence or to run malicious scripts at specific intervals or in response to certain triggers. The primary MITRE ATT&CK tactic is Execution (T1053.005 - Scheduled Task/Job). The telemetry source required for effective detection includes Windows PowerShell logs with Script Block Logging enabled.

  If malicious, the creation of these tasks could lead to recurring execution of harmful scripts, allowing an attacker to maintain a foothold within the network. This detection does NOT confirm malicious intent solely based on task creation, as legitimate administrative actions can also result in similar entries.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious task creation:** Check Security Event ID 4104 for Script Block Logging entries that contain 'New-ScheduledTaskAction', 'New-ScheduledTaskTrigger', or 'Register-ScheduledTask'. Legitimate administrative tasks may involve similar command executions, but frequency and context should be verified.

  - **Identify the user context of the PowerShell command:** Validate the user account that executed the PowerShell command by checking the Account Name field in Event ID 4104. Look for non-administrative users or unusual accounts executing these commands.

  - **Check scheduled tasks for expected configurations:** Use the Task Scheduler interface or 'Get-ScheduledTask' command to review the created task's names and parameters. Legitimate scheduled tasks will often follow an organization’s naming convention, whereas malicious tasks may have obfuscated or nonsensical names.

  - **Correlate the timing of task creation with other events:** Analyze Event ID 4688 for process creation corresponding with the time of the task creation to identify upstream activity that may indicate malicious behavior. Malicious indicators include execution from non-standard directories or unexpected parent processes.

  - **Investigate for potential persistence mechanisms:** Examine the task configuration for triggers and actions that could indicate misuse, such as tasks set to run with elevated privileges or those that execute commands from suspicious paths.

  ### Prioritization

  The severity of this alert is medium, as scheduled task creation can indicate both legitimate administrative maintenance and harmful persistence attempts by adversaries. While this behavior can be weaponized, further contextual analysis is needed to assess its intent effectively.

  ### Blind Spots and Assumptions

  This detection may miss scheduled tasks created through other means or if Script Block Logging is disabled. Legitimate activities, such as routine maintenance or updates performed by system administrators, may also trigger this alert. A related detection involves monitoring Windows Event ID 4698, which logs new scheduled tasks, enhancing visibility into changes in task configurations.

