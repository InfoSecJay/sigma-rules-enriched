title: Powershell Create Scheduled Task
id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
status: test
description: Adversaries may abuse the Windows Task Scheduler to perform task 
  scheduling for initial or recurring execution of malicious code
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-4---powershell-cmdlet-scheduled-task
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-6---wmi-invoke-cimmethod-scheduled-task
author: frack113
date: 2021-12-28
modified: 2025-10-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'New-ScheduledTaskAction'
    - 'New-ScheduledTaskTrigger'
    - 'New-ScheduledTaskPrincipal'
    - 'New-ScheduledTaskSettingsSet'
    - 'New-ScheduledTask'
    - 'Register-ScheduledTask'
  selection_cimmethod:
    ScriptBlockText|contains|all:
    - 'Invoke-CimMethod'
    - '-ClassName'
    - 'PS_ScheduledTask'
    - '-NameSpace'
    - 'Root\Microsoft\Windows\TaskScheduler'
  filter_main_legitimate_scripts:
    ScriptBlockText|contains|all:
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'Microsoft.Management.Infrastructure.CimInstance'
    - '__cmdletization_methodParameter'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using PowerShell related cmdlets, potentially indicating abuse of the Windows Task Scheduler for executing malicious payloads persistently. Attackers typically aim to establish a mechanism for recurring execution of their code to maintain access or perform further actions without detection. Relevant MITRE ATT&CK tactics include **Persistence (T1053.005)** and **Execution (T1053)**.

  The primary telemetry source for this detection is PowerShell script block logging, which records the executed script commands. If this behavior is malicious, it could allow an adversary to schedule tasks that run arbitrary code, potentially leading to data exfiltration or lateral movement. However, it should be noted that this detection does not confirm malicious intent outright—it only indicates that scheduled tasks are being created using PowerShell.

  ### Investigation Steps

  - **Evaluate the PowerShell command executed:** Review PowerShell ScriptBlock logs for Event ID 4104 where the `ScriptBlockText` contains `New-ScheduledTask`, `Register-ScheduledTask`, or `Invoke-CimMethod`. Check if the command line arguments reflect legitimate use cases versus suspicious parameters that may indicate malicious activity.

  - **Cross-reference scheduled tasks:** Use Task Scheduler (Event ID 106) to list scheduled tasks. Look for any tasks created or modified recently that do not have a legitimate administrative purpose, such as unexpected names or paths for the executable being called.

  - **Identify regular patterns of PowerShell usage:** Analyze baseline PowerShell command usage within the environment to differentiate between legitimate use (e.g., maintenance scripts) and potentially malicious usage. Legitimate tasks may utilize common system paths, while suspicious tasks may connect to unusual external URLs or run uncommon executables.

  - **Check for concurrent suspicious activity:** Look for recent Event ID 4624 (logon events) showing unusual account logins that coincide with the scheduled task creations, especially from accounts that typically do not execute these types of tasks.

  - **Review filtering effectiveness:** Ensure that potentially benign actions, such as automation scripts by system administrators or maintenance tools, do not falsely trigger alerts. Verify that any indication of legitimate operation aligns with the `filter_main_legitimate_scripts` conditions in the rule.

  ### Prioritization

  This alert should be classified as medium priority due to the potential for system compromise through unauthorized persistent task creation. While it signifies risky behavior, the context of the actions observed must be evaluated to assess the likelihood of malicious intent, as scheduled tasks could also be used legitimately.

  ### Blind Spots and Assumptions

  One significant limitation is that this detection relies on PowerShell script block logging being enabled; if it is not, this behavior may go unnoticed. Legitimate scheduled task modifications or creations by system administrators could trigger false positives. Additionally, an ideal companion detection would be monitoring for anomalous task trigger events that include suspicious command execution patterns or unusually high frequency of updated tasks to strengthen detection coverage.

