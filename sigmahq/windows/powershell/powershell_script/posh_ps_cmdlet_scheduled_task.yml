title: Powershell Create Scheduled Task
id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
status: test
description: Adversaries may abuse the Windows Task Scheduler to perform task scheduling
  for initial or recurring execution of malicious code
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-4---powershell-cmdlet-scheduled-task
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-6---wmi-invoke-cimmethod-scheduled-task
author: frack113
date: 2021-12-28
modified: 2025-10-07
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains:
    - 'New-ScheduledTaskAction'
    - 'New-ScheduledTaskTrigger'
    - 'New-ScheduledTaskPrincipal'
    - 'New-ScheduledTaskSettingsSet'
    - 'New-ScheduledTask'
    - 'Register-ScheduledTask'
  selection_cimmethod:
    ScriptBlockText|contains|all:
    - 'Invoke-CimMethod'
    - '-ClassName'
    - 'PS_ScheduledTask'
    - '-NameSpace'
    - 'Root\Microsoft\Windows\TaskScheduler'
  filter_main_legitimate_scripts:
    ScriptBlockText|contains|all:
    - 'Microsoft.PowerShell.Core\Export-ModuleMember'
    - 'Microsoft.Management.Infrastructure.CimInstance'
    - '__cmdletization_methodParameter'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks in Windows systems using PowerShell commands that could indicate potential malicious activity. Attackers often utilize the Windows Task Scheduler to set up persistent execution of malicious scripts or binaries, thereby maintaining their presence on compromised systems. The ability to execute code at scheduled intervals (or conditions) could be used for various nefarious purposes, such as data exfiltration, lateral movement, or privilege escalation.

  The relevant MITRE ATT&CK tactics involved include **Execution** (T1203), as the malicious code is executed using PowerShell, **Persistence** (T1053.005), since scheduled tasks provide a way to ensure malware remains on the system, and **Privilege Escalation** (T1068) where attackers may attempt to leverage these tasks to gain higher privileges. The main data sources for this detection rely on Windows PowerShell Script Block Logging, which needs to be properly configured to ensure comprehensive event collection related to PowerShell commands.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Check the PowerShell script block logs for any instances of commands such as `Register-ScheduledTask`, `New-ScheduledTask`, and their associated parameters. Focus on unusual patterns or commands that do not align with standard administrative practices.

  - **Analyze Scheduled Task Configuration:** Use the Task Scheduler to identify newly created tasks or modifications to existing tasks. Pay close attention to tasks scheduled for execution that are unusual in naming or associated user accounts.

  - **Correlate with User Activity:** Investigate the user accounts that created or modified these scheduled tasks. Look for anomalies, such as user accounts that typically do not engage with task scheduling or those that have recently been compromised.

  - **Check for Related Indicators:** Explore additional logs such as process creation events and WMI execution logs that may indicate the execution of the PowerShell commands or subsequent tasks initiated through created scheduled tasks.

  ### Prioritization
  Alerts related to the creation of scheduled tasks carry medium severity due to the potential for adversaries to maintain persistence and execute payloads indirectly. The risk becomes significantly higher if these tasks are associated with high-privilege accounts or are designed to execute off-hours, indicating malicious intent.

  ### Blind Spots and Assumptions
  This detection logic assumes that PowerShell Script Block Logging is enabled and properly configured on all systems, which might not be the case in all environments. Gaps in detection may arise if PowerShell logging is disabled or if attackers use alternative scripts or formats to create scheduled tasks that do not trigger the detection. Additionally, if benign tasks are being used creatively by administrators, they could generate false positives that may require further tuning of the detection logic to minimize noise.

