title: Winlogon Helper DLL
id: 851c506b-6b7c-4ce2-8802-c703009d03c0
status: test
description: |
  Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
  Registry entries in HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\ and HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ are
  used to manage additional helper programs and functionalities that support Winlogon. Malicious modifications to these Registry keys may cause Winlogon to
  load and execute malicious DLLs and/or executables.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.004/T1547.004.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2022-07-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: 'CurrentVersion\Winlogon'
  selection2:
    ScriptBlockText|contains:
    - 'Set-ItemProperty'
    - 'New-Item'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows Registry keys associated with Winlogon, which can occur when malicious actors attempt to persistently execute their payloads on system startup. The likely attacker objective is to establish persistent access by manipulating Winlogon's behavior to load unauthorized DLLs or executables. This activity corresponds primarily to the MITRE ATT&CK technique T1547.004 (Registry Run Keys / Startup Folder).

  The primary telemetry source is PowerShell script logging, specifically focusing on ScriptBlockText that captures commands modifying the registry. If malicious, such modifications can lead to unauthorized execution of arbitrary code at user logon. However, this detection alone does NOT confirm intent or whether the modifications are malicious without further context.

  ### Investigation Steps

  - **Examine the PowerShell logs:** Retrieve relevant logs from the PowerShell script block logs (Event ID 4104) for any instances where `CurrentVersion\Winlogon` is modified. Look for suspicious commands involving `Set-ItemProperty` or `New-Item`.

  - **Correlate with user context:** Identify the user who executed the commands by checking the `User` field in the Event ID 4104 logs to determine if it aligns with legitimate administrative actions or if it's an anomalous account.

  - **Review recent registry changes:** Use the Registry Events (Event ID 4657) to verify direct modifications to the keys under `HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\`. Determine the prior state of these keys and if the changes were expected.

  - **Analyze the execution context of Winlogon:** Investigate any newly created or modified files in the `C:\Windows\System32` or `C:\Windows\SysWOW64` directories that correspond to DLLs associated with Winlogon, specifically focusing on their timestamp and digital signature validity.

  - **Cross-reference with known persistence techniques:** Match the findings against standard operational scripts or software in use within the enterprise. Assess if the modifications could be part of legitimate software configuration changes, especially during service patching or upgrades.

  - **Identify high-confidence malicious indicators:** Look for the creation of new non-Microsoft DLLs or unknown executables launched by `Winlogon.exe` during the investigation. Focus on the `Image` field in associated process creation logs (Event ID 4688 or Sysmon Event ID 1) for any unauthorized paths.

  ### Prioritization

  This alert has medium severity due to the potential for escalated privileges and persistence on critical Windows systems. If a malicious actor has modified Winlogon behavior, it could lead to unauthorized code execution during user sessions, making it a significant threat. Such registry manipulations are often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  One limitation of this detection is its dependence on the enabling of PowerShell script block logging, which may not be universally applied across all endpoints. Legitimate administrative activities, such as software installations or configuration changes, might trigger the alert and should be evaluated. Companion detection via process creation logs may strengthen coverage by revealing unauthorized processes spawned by `Winlogon.exe`.

