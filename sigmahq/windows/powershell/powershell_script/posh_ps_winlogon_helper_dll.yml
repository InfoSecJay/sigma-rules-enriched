title: Winlogon Helper DLL
id: 851c506b-6b7c-4ce2-8802-c703009d03c0
status: test
description: |
  Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
  Registry entries in HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\ and HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ are
  used to manage additional helper programs and functionalities that support Winlogon. Malicious modifications to these Registry keys may cause Winlogon to
  load and execute malicious DLLs and/or executables.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.004/T1547.004.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2022-07-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: 'CurrentVersion\Winlogon'
  selection2:
    ScriptBlockText|contains:
    - 'Set-ItemProperty'
    - 'New-Item'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects modifications to the Windows registry keys associated with Winlogon, specifically entries under `HKLM\Software[Wow6432Node]\Microsoft\Windows NT\CurrentVersion\Winlogon\` and `HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\`. Such alterations could allow an attacker to load malicious DLLs or executables when a user logs on, facilitating persistence and privilege escalation on the compromised system. The corresponding MITRE ATT&CK tactic is **Persistence**, under technique **T1547.004**.

  The primary telemetry source for this detection is derived from PowerShell script block logging, capturing the scripts that interact with these registry keys. If the alert is triggered, it may indicate a serious security concern, as these changes could lead to unauthorized execution of malicious code during the user authentication process. However, simply triggering this detection does not confirm malicious intent on its own, as legitimate administrative changes may result in similar registry modifications.

  ### Investigation Steps

  - **Review the script block logs:** Check for Event ID 4104 entries in PowerShell logs where `ScriptBlockText` contains `Set-ItemProperty` or `New-Item` associated with `HKLM\Software[Wow6432Node]\Microsoft\Windows NT\CurrentVersion\Winlogon\` or `HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\`. Look for context around these actions.

  - **Identify legitimate modifications:** Cross-reference the timestamp of the detected action with system change logs or authorized change requests from IT personnel. Legitimate administrative changes might be documented prior to these alerts.

  - **Assess the command context:** Look at the parent process of the PowerShell command to establish whether this was initiated by a known good process (e.g., a trusted script execution) or potentially a suspicious parent process such as `cmd.exe` or `powershell.exe` invoked by an external entity.

  - **Investigate for high-confidence malicious indicators:** Check for any unusual or non-standard DLLs being loaded that correlate with the modification detected. Validate any new items against known malicious binaries using a threat intelligence platform.

  - **Evaluate system impact and asset criticality:** Determine if the affected system operates in a sensitive environment (e.g., domain controllers, financial databases) and assess how the detected behavior could enable further compromise or lateral movement.

  - **Monitor for repeated trigger patterns:** Set up alerts for subsequent creations or modifications of `Winlogon` registry keys in case the first alert was a legitimate administrative script that may have enabled repeat malicious activity.

  ### Prioritization

  This alert should be treated as medium severity, as modifications to Winlogon registry keys can have significant implications for system security. The likelihood of malicious abuse is high due to the potential for privilege escalation and persistence mechanisms that are commonly exploited by adversaries. While not every alteration indicates a compromise, frequent modifications to these keys should warrant thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell script block logging is disabled or misconfigured, as this would prevent visibility of suspicious registry modifications. Additionally, legitimate administrative tasks may trigger this alert, particularly during system maintenance or configuration updates. A related detection that strengthens coverage could include monitoring modifications to other critical registry keys related to user logon processes, creating a more comprehensive view of potential persistence mechanisms.

