title: Winlogon Helper DLL
id: 851c506b-6b7c-4ce2-8802-c703009d03c0
status: test
description: |
  Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
  Registry entries in HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\ and HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ are
  used to manage additional helper programs and functionalities that support Winlogon. Malicious modifications to these Registry keys may cause Winlogon to
  load and execute malicious DLLs and/or executables.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.004/T1547.004.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2022-07-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.004
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: 'CurrentVersion\Winlogon'
  selection2:
    ScriptBlockText|contains:
    - 'Set-ItemProperty'
    - 'New-Item'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious modifications to the Winlogon registry keys in Windows systems, specifically focusing on the keys located at `HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\` and `HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\`. These keys are used by the Winlogon component, which is essential for handling logon/logoff processes and secure attention sequences triggered by Ctrl-Alt-Delete. Attackers may exploit these keys to execute harmful DLLs or executables, which could lead to persistence and privilege escalation on the compromised system.

  The threat scenario involves an attacker aiming to maintain access on a targeted system by leveraging the Winlogon process to load malicious components. This technique is categorized under various MITRE ATT&CK tactics, including **Persistence (T1547)** and **Privilege Escalation (T1068)**. The specific technique relevant here is **T1547.004: Winlogon Helper DLL**. The primary data sources for detecting this behavior are PowerShell script block logs, which must be enabled to capture script-based modifications to the registry.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Check for any entries that contain `CurrentVersion\Winlogon` or commands like `Set-ItemProperty` and `New-Item`, as these entries could indicate unauthorized changes to the Winlogon registry keys.
  - **Examine Registry Keys:** Conduct a thorough analysis of the Winlogon-related registry keys mentioned, looking for any unusual or unauthorized entries that might have been added or modified by an attacker.
  - **Monitor Process Creation Events:** Look for suspicious process creation events that follow modifications to the Winlogon keys, as these could signal the execution of malicious payloads intended to establish persistence.
  - **Correlate with User Activity Logs:** Cross-reference the timing of the detected changes with user activity logs to identify any anomalous behavior that may indicate abuse of valid credentials or insider threats.

  ### Prioritization
  The alert's medium severity is justified due to the potential impact of an attacker establishing persistence through malicious DLLs and executing arbitrary code in a critical Windows process. The likelihood of exploitation is high if existing defenses are bypassed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell script block logging is not enabled, as this is essential for monitoring the relevant activity. The detection logic assumes that legitimate processes will not interact with the mentioned registry paths, which could lead to false positives. Furthermore, it relies on appropriate logging configurations being in place to capture necessary telemetry for accurate detection.

