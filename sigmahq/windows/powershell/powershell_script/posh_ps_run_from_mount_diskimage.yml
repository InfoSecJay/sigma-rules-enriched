title: Suspicious Invoke-Item From Mount-DiskImage
id: 902cedee-0398-4e3a-8183-6f3a89773a96
status: test
description: Adversaries may abuse container files such as disk image (.iso, 
  .vhd) file formats to deliver malicious payloads that may not be tagged with 
  MOTW.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.005/T1553.005.md#atomic-test-2---mount-an-iso-image-and-run-executable-from-the-iso
- https://learn.microsoft.com/en-us/powershell/module/storage/mount-diskimage?view=windowsserver2022-ps
author: frack113
date: 2022-02-01
tags:
- attack.defense-impairment
- attack.t1553.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Mount-DiskImage '
    - '-ImagePath '
    - Get-Volume
    - '.DriveLetter'
    - 'invoke-item '
    - '):\'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell commands `Mount-DiskImage` and `Invoke-Item`, often employed by adversaries to mount disk image files (such as `.iso` or `.vhd`) and execute content within these images. The likely attacker objective is to utilize these container files to deliver and execute malicious payloads, potentially bypassing standard defenses like Mark of the Web (MOTW) tagging that might identify directly downloaded content as unsafe. This activity correlates with the MITRE ATT&CK technique T1553.005 (Exploitation of a Trusted Relationship).

  The primary telemetry source involves Windows PowerShell script logs with a focus on captured script block data. The required log types are generated from Script Block Logging in PowerShell, which must be enabled to capture relevant events. If successful, this behavior can lead to unauthorized execution of malicious code, compromising the host and potentially spreading laterally through the environment. Importantly, this detection does NOT confirm malicious intent on its own; it may include benign activities performed by legitimate users.

  ### Investigation Steps

  - **Review PowerShell command usage:** Check for Event ID 4104 in Windows PowerShell logs to identify the exact command issued, focusing on any execution of `Mount-DiskImage` followed closely by `Invoke-Item`.

  - **Inspect the disk image file:** Determine the origin of the mounted disk image by analyzing properties such as timestamps and the file path. Legitimate images are typically stored in well-known directories and may lack digital signatures.

  - **Analyze invoked content:** After identifying the script block that invoked the image, trace any executables run directly from the image using Windows Event ID 4688 (Process Creation). Look for unexpected files executing from temporary paths.

  - **Correlate to user behavior:** Review user activity associated with the time of the alert. Validate whether the user context initiated the PowerShell commands matches expected workflows (e.g., an IT practitioner mounting software installation images).

  - **Identify multiple indicators:** Determine if there are additional indicators, such as network traffic (using Event ID 5156 for Windows Filtering Platform logs) originating from the host running the commands, indicative of data exfiltration or command and control communication.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive systems if compromised. Given that the exploitation of mounted disk images for executing arbitrary code is a known tactic among threat actors, it carries a moderate likelihood of malicious intent. The use of this technique is recognized and weaponized in various attack scenarios, such as delivering payloads in phishing campaigns.

  ### Blind Spots and Assumptions

  Detection limitations arise if Script Block Logging is not enabled, which prevents capturing the PowerShell activities associated with this rule. Additionally, some legitimate actions—like administrators conducting routine software installations—might trigger the alert, leading to false positives. Further coverage can be reinforced by monitoring for related activities using the `New-Item` PowerShell command, which might indicate an attempt to create malicious files in conjunction with mounting images.

