title: Suspicious Invoke-Item From Mount-DiskImage
id: 902cedee-0398-4e3a-8183-6f3a89773a96
status: test
description: Adversaries may abuse container files such as disk image (.iso, 
  .vhd) file formats to deliver malicious payloads that may not be tagged with 
  MOTW.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.005/T1553.005.md#atomic-test-2---mount-an-iso-image-and-run-executable-from-the-iso
- https://learn.microsoft.com/en-us/powershell/module/storage/mount-diskimage?view=windowsserver2022-ps
author: frack113
date: 2022-02-01
tags:
- attack.defense-evasion
- attack.t1553.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Mount-DiskImage '
    - '-ImagePath '
    - Get-Volume
    - '.DriveLetter'
    - 'invoke-item '
    - '):\'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell command `Invoke-Item` following the mounting of a disk image using `Mount-DiskImage`. This behavior is indicative of potential abuse where adversaries may use container files like .iso or .vhd formats to execute malicious payloads that evade detection, often associated with malware delivery mechanisms. The likely attacker objective includes executing payloads to deliver further payloads, establish persistence, or conduct lateral movement.

  This detection falls under the MITRE ATT&CK tactic **Defense Evasion** and technique **T1553.005: External Remote Services: Drive-by (Disk Image)**. The primary telemetry source is PowerShell logs, specifically focusing on Script Block Logging (required for detailed invocation tracking). If malicious, the potential impact could range from data exfiltration to system compromise. It is crucial to note that this detection does NOT confirm malicious execution on its own; further context is needed.

  ### Investigation Steps

  - **Review PowerShell Logs for Script Block Logging**: Check for PowerShell event logs (Event ID 4104) to identify if the `Invoke-Item` command was executed in conjunction with `Mount-DiskImage`. Look for specific file paths to see if they lead to known locations for benign image files.

  - **Correlate Mount-DiskImage Activity with Other Actions**: Investigate if there are related commands issued after mounting the disk image, such as file manipulations or network connections that could indicate suspicious behavior.

  - **Identify Malicious Indicators**: Specifically check if the mounted image file is from an untrusted source or if it has been marked with a Mark of the Web (MOTW). Malicious indicators can include images from uncommon repositories or unusual execution contexts.

  - **Validate Legitimate Use Cases**: Assess the context of the mounted images. Legitimate use cases often involve mounting files from internal or known repositories as part of software installation processes, without invoking `Invoke-Item` for potentially sensitive operations.

  - **Determine Host Role and Asset Criticality**: Consider the host’s role within the infrastructure; systems with sensitive access or elevated privileges exacerbating risk. Systems on critical roles should be prioritized for immediate review.

  ### Prioritization

  This alert is of medium severity due to the potential for exploitation of disk image files as vector channels for malware. The likelihood of malicious abuse is heightened given the techniques employed in exploitation, which target defense evasion tactics.

  ### Blind Spots and Assumptions

  Detection may be limited by the necessity for Script Block Logging, which may not be enabled on all systems. An adversary may evade detection through encrypted scripts or using alternatives to `Invoke-Item`. Legitimate activities include authorized software installations or IT operations involving known disk images. A related detection could involve monitoring for use of external media devices along with mounting disk images to capture broader attack vectors.

