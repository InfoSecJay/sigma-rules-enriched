title: Suspicious Invoke-Item From Mount-DiskImage
id: 902cedee-0398-4e3a-8183-6f3a89773a96
status: test
description: Adversaries may abuse container files such as disk image (.iso, .vhd)
  file formats to deliver malicious payloads that may not be tagged with MOTW.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.005/T1553.005.md#atomic-test-2---mount-an-iso-image-and-run-executable-from-the-iso
- https://learn.microsoft.com/en-us/powershell/module/storage/mount-diskimage?view=windowsserver2022-ps
author: frack113
date: 2022-02-01
tags:
- attack.defense-evasion
- attack.t1553.005
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Mount-DiskImage '
    - '-ImagePath '
    - Get-Volume
    - '.DriveLetter'
    - 'invoke-item '
    - '):\'
  condition: selection
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This rule detects potentially malicious use of PowerShell for executing commands related to disk images, such as .iso or .vhd files. Adversaries might leverage container files to deliver and execute payloads, specifically taking advantage of the capability to mount disk images without the necessary security labels that protect against execution, like Mark of the Web (MOTW). The attacker's objective may include installing malware, creating persistence, or executing additional exploits within the environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005)
  - **T1553.005: Exploiting the Disk Image**

  Primary data sources for detection include:
  - PowerShell script execution logs, specifically those with script block logging enabled, which capture the execution of commands and arguments used in PowerShell. These logs provide evidence of potentially abnormal behavior related to mounting disk images and executing files.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for any instances where `Mount-DiskImage` is used in conjunction with `Invoke-Item` commands. Pay particular attention to the `-ImagePath` and its contents to verify the legitimacy of the disk image.
  - **Analyze Unusual Activity:** Check for unusual or unauthorized disk image files being mounted on systems, especially those that execute commands or scripts directly upon mounting.
  - **Validate Source of Disk Images:** Investigate the origin of the disk images being used. Look for any abnormal access patterns or file transfers that could indicate malicious intent.
  - **Correlate with Other Events:** Cross-reference the activity with endpoint detection and response (EDR) tools, looking for subsequent malicious behavior, such as connections to known malicious IPs or execution of unfamiliar processes.

  ### Prioritization
  This alert has medium severity due to the potential impact of a successful payload execution. If malicious disk images are utilized, they could lead to substantial compromise, data exfiltration, or additional lateral movement within the enterprise environment. The likelihood of such attacks occurring in environments with high-value targets, such as sensitive data or critical infrastructure, makes this detection particularly important.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate activities that involve mounting and executing files from disk images as part of standard operations or workflows. This detection logic assumes that the PowerShell script block logging is enabled and that analysts are able to distinguish between normal and suspicious use cases effectively. Additionally, if the disk images or the actions leading to their execution happen outside of transparent logging environments, this may lead to missed detections and require proper configuration for continued effectiveness.

