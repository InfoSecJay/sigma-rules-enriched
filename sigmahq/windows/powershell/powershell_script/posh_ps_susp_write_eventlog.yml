title: PowerShell Write-EventLog Usage
id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
status: test
description: Detects usage of the "Write-EventLog" cmdlet with 'RawData' flag. The
  cmdlet can be levreage to write malicious payloads to the EventLog and then retrieve
  them later for later use
references:
- https://www.blackhillsinfosec.com/windows-event-logs-for-red-teams/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-16
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Write-EventLog'
    - '-RawData '
  condition: selection
falsepositives:
- Legitimate applications writing events via this cmdlet. Investigate alerts to determine
  if the action is benign
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the usage of the PowerShell cmdlet "Write-EventLog" with the '-RawData' flag. Attackers may employ this command to write arbitrary or malicious data into the Windows Event Log, allowing them to either obfuscate malicious activity or store payloads for later retrieval. The most relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically the technique "Indicator Removal on Host" (T1560).

  Primary telemetry sources include PowerShell script logs, which require that Script Block Logging is enabled in the environment. If used maliciously, this behavior can significantly undermine the integrity of system logs, potentially hiding other malicious activities. It is crucial to note that this detection does NOT confirm malicious intent or successful exploitation on its own; further contextual investigation is necessary.

  ---

  ### Investigation Steps

  - **Review PowerShell logs:** Check PowerShell ScriptBlock logs with Event ID 4104 for instances of "Write-EventLog" containing the '-RawData' flag. Look for an unusual amount of data being written, especially if not common for the asset.

  - **Correlate with Event Logs:** Analyze the corresponding Windows Event Logs (Event ID 4624 for logon events) around the same timeframe to identify any patterns of legitimate user activity that may explain the command's execution.

  - **Identify user context:** Determine the user who executed the command. If the command was run by a service account or unexpected user with minimal privileges, this could indicate suspicious behavior.

  - **Analyze frequency and context:** Examine whether this command was run repeatedly or in unusual contexts. Normal operations typically involve fewer calls to manipulate event logs, while attackers may execute this frequently.

  - **Investigate system modifications:** Look for other indicators of compromise, such as unusual scheduled tasks or modifications in the registry, particularly in areas related to event log behavior (e.g., Event Log service settings).

  - **Contextualize with similar detections:** If this alert co-occurs with other Sigma rules for potentially malicious PowerShell activity, prioritize this investigation alongside them to assess broader attack patterns.

  ---

  ### Prioritization

  This alert should be treated with medium severity. While not all instances indicate an imminent threat, the potential for abuse in altering system logs can impede detection efforts for real incidents. Given that attackers commonly weaponize such techniques for stealth, it's critical to investigate.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the requirement of enabled Script Block Logging, which may not be configured in all environments. Legitimate applications, such as monitoring tools, may use the Write-EventLog cmdlet, leading to false positives. Related detections, such as those monitoring unusual PowerShell cmdlet usage (e.g., "New-EventLog"), can provide enhanced visibility into potentially malicious activity.

