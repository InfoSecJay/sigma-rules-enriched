title: PowerShell Write-EventLog Usage
id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
status: test
description: Detects usage of the "Write-EventLog" cmdlet with 'RawData' flag. The
  cmdlet can be levreage to write malicious payloads to the EventLog and then retrieve
  them later for later use
references:
- https://www.blackhillsinfosec.com/windows-event-logs-for-red-teams/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-16
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Write-EventLog'
    - '-RawData '
  condition: selection
falsepositives:
- Legitimate applications writing events via this cmdlet. Investigate alerts to determine
  if the action is benign
level: medium
note: |
  ### Technical Context
  This rule detects the usage of the PowerShell cmdlet `Write-EventLog` with the `-RawData` flag, which can be exploited by malicious actors to write custom or harmful payloads into the Windows Event Log. Attackers leverage this technique to hide their nefarious activities or to create a persistence mechanism, as logs can later be retrieved remotely or used to mask other illicit actions. The attack scenario typically includes a situation where the actor seeks to obfuscate their actions by injecting logs that may appear legitimate while concealing actual malicious behaviors.

  The relevant MITRE ATT&CK tactics for this detection are **Defense Evasion (T1569.001)**, as attackers attempt to manipulate log content to evade detection mechanisms, and **Credential Access (T1075)**, where the attack may involve application log manipulation to retain access or manage credentials stealthily. The primary data sources that would yield relevant evidence include Windows PowerShell script logs and event logs generated by Windows when executing such cmdlets, particularly focusing on logging levels that capture detailed PowerShell activity.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check the PowerShell script block logs to identify instances of the `Write-EventLog` cmdlet being executed, specifically looking for the usage of the `-RawData` flag in the command.
  - **Analyze Event Logs**: Examine the Windows Event Logs for entries written around the same timestamp as the PowerShell command execution; look for anomalies or entries containing unexpected data.
  - **Correlate User Actions**: Investigate the user and process context under which the cmdlet was executed; identify if the command originated from a legitimate application or user account and analyze their recent activities.
  - **Check for Log Manipulation**: Search for patterns indicative of log tampering or suspicious event write activities that could signify an adversary attempting to obscure their actions.

  ### Prioritization
  The severity of this alert is medium due to its potential implications in obscuring malicious activity in the environment. While the use of `Write-EventLog` can occur legitimately, the specific use of the `-RawData` flag is uncommon and warrants further investigation, as it might indicate an active attempt to evade detection mechanisms by writing malicious logs.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that the cmdlet execution may not be logged if PowerShell script block logging is not enabled, which is a prerequisite for detection. This rule assumes that there are no legitimate administrative processes that could cause false positives when using `Write-EventLog -RawData`. Additionally, environments that have not configured the necessary logging parameters may miss this detection, limiting overall visibility into potential malicious activity.

