title: PowerShell Write-EventLog Usage
id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
status: test
description: Detects usage of the "Write-EventLog" cmdlet with 'RawData' flag. 
  The cmdlet can be levreage to write malicious payloads to the EventLog and 
  then retrieve them later for later use
references:
- https://www.blackhillsinfosec.com/windows-event-logs-for-red-teams/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-16
tags:
- attack.defense-impairment
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Write-EventLog'
    - '-RawData '
  condition: selection
falsepositives:
- Legitimate applications writing events via this cmdlet. Investigate alerts to 
  determine if the action is benign
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Write-EventLog` with the `-RawData` flag. This behavior may indicate an attacker attempting to write arbitrary data to the Windows Event Log, which can be exploited to store malicious payloads for later retrieval. The likely objective is to manipulate event logs to evade detection or to leverage logs as a foothold for future exploitation. This activity aligns with the MITRE ATT&CK technique for Defense Evasion (T1562).

  The primary telemetry source is Windows PowerShell execution logs, specifically through Script Block Logging, which must be enabled for effective detection. Malicious use of this cmdlet can lead to significant security impacts, including obfuscation of attacker activities. However, this detection does NOT confirm that malicious activity has occurred; legitimate applications may also use this cmdlet for valid purposes.

  ### Investigation Steps

  - **Check PowerShell logs for context:** Review Windows Event ID 4104 for Script Block Logging details indicating the execution context, including user, time, and full command. Identify whether it was executed by a known administrative user or an unexpected account.

  - **Review event log entries created:** Check Windows Event ID 1102 (Event Log Clearance) and subsequent log entries for anomalies. Legitimate applications typically write recognizable and structured event data; suspicious entries may contain non-standard formatting or known attack patterns.

  - **Correlate with active adversary tactics:** Determine if there have been associated detections of known malicious behavior, such as suspicious process creation (Event ID 4688) or network connections (Event ID 5156). This can indicate a more extensive attack vector.

  - **Identify the host role and criticality:** Confirm if the host conducting this activity is a high-value asset (e.g., domain controller or critical server). This context heightens the severity and potential impact of the behavior.

  - **Validate legitimate cmdlet usage:** Investigate known systems or applications that may legitimately use `Write-EventLog` with the `-RawData` flag, such as monitoring tools or backup solutions. Cross-reference application logs and configuration management data.

  ### Prioritization

  Alert severity is medium based on the nature of the affected system; if the host is critical (e.g., a web server), the potential impact increases. Although the `Write-EventLog` cmdlet is sometimes used for legitimate purposes, its employment with the `-RawData` flag implies a higher likelihood of misuse and could be an indicator of a more sophisticated attack.

  ### Blind Spots and Assumptions

  This detection may not capture all instances of legitimate or benign use of the cmdlet. For reliable detection, ensure that Script Block Logging is enabled across all systems in the environment. Legitimate applications, such as maintenance scripts or log monitoring software, may trigger this alert, necessitating thorough investigation. An associated detection to consider is the monitoring of for event log size increase or anomalous event IDs, which would provide additional context for any changes made to logs.

