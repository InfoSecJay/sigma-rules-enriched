title: PowerShell Write-EventLog Usage
id: 35f41cd7-c98e-469f-8a02-ec4ba0cc7a7e
status: test
description: Detects usage of the "Write-EventLog" cmdlet with 'RawData' flag. 
  The cmdlet can be levreage to write malicious payloads to the EventLog and 
  then retrieve them later for later use
references:
- https://www.blackhillsinfosec.com/windows-event-logs-for-red-teams/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-16
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Write-EventLog'
    - '-RawData '
  condition: selection
falsepositives:
- Legitimate applications writing events via this cmdlet. Investigate alerts to 
  determine if the action is benign
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet "Write-EventLog" specifically with the '-RawData' flag, which allows a user to write arbitrary binary data to the Windows Event Log. Attackers may exploit this capability to write malicious payloads, enabling stealthy storage of data for later retrieval or to manipulate log information. This behavior primarily aligns with the MITRE ATT&CK framework's Tactic: Defense Evasion (TA0005), Technique: T1070.001 - Indicator Removal on Host (Event Log Clearance).

  The primary telemetry sources for this detection are Windows PowerShell logs, specifically requiring script block logging to be enabled (Event ID 4104). If malicious, this technique could allow an attacker to manipulate event logs, hiding their activities and avoiding detection. Importantly, the use of "Write-EventLog" with the '-RawData' flag does not, on its own, confirm malicious intent; legitimate applications may also utilize this cmdlet to write events.

  ### Investigation Steps

  - **Review PowerShell logs for execution details:** Check Windows PowerShell event logs (Event ID 4104) for the specific command that triggered the alert. Look for unusual script block execution contexts or unexpected user accounts executing this command.

  - **Analyze the content written to the Event Log:** Inspect the Event Log entries created around the same timestamp as the alert. Pay attention to the "RawData" field and analyze its content for any indicators of malicious payloads or obfuscation techniques (e.g., Base64 encoding).

  - **Compare against known benign applications:** Identify legitimate applications within your environment that might use "Write-EventLog" with '-RawData'. Confirm if these applications frequently log events, and assess the context of the execution.

  - **Identify high-confidence malicious indicators:** Look for evidence of data writing that includes known malicious signatures or unusual binaries in the raw data. Cross-reference these findings with threat intelligence sources.

  - **Check for script block logging settings:** Ensure Script Block Logging is enabled for PowerShell to maintain complete visibility over the execution context and commands. Events related to disabled logging can hinder the investigation.

  ### Prioritization

  This alert carries a medium severity level. The impact of affected systems can be high if an attacker is able to manipulate or implant hidden payloads within event logs. Given that methods like "Write-EventLog" are commonly abused to circumvent detection, timely investigation is crucial to prevent further exploitation or data exfiltration.

  ### Blind Spots and Assumptions

  The detection is limited by the requirement for Script Block Logging to be enabled; if it is not, the cmdlet execution may go unnoticed. Legitimate activities that may trigger this alert include automated system monitoring tools writing to the Event Log. A complementary detection would be monitoring for unusual PowerShell cmdlets or additional event log manipulations, enhancing coverage against potential evasion tactics.

