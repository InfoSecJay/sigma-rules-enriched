logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell "Compress-Archive" cmdlet to compress files targeting output locations commonly associated with data staging and exfiltration, such as the Temp folder. This behavior may be indicative of an attacker attempting to package sensitive information, like credentials or proprietary documents, for later extraction from the compromised environment.

  The relevant MITRE ATT&CK tactic is **Collection** (TA0009), specifically the technique **Data Staged** (T1074.001). The primary telemetry source for this detection involves PowerShell script logs, requiring that Script Block Logging be enabled to capture the specifics of executed scripts. If left unmitigated, this behavior poses a significant risk as it may facilitate the unauthorized removal of sensitive data from the organization. Importantly, this detection does NOT confirm that the packaged files have been exfiltrated or that malicious intent exists without further investigation into the context of the action.

  ### Investigation Steps

  - **Review PowerShell Script Logs:** Check for Event ID 4104 in Windows PowerShell logs that match the detected cmdlets involving Compress-Archive. Look for unusual script execution patterns, such as non-standard user accounts or external IP addresses interacting with the system.

  - **Analyze Temp Folder Contents:** Inspect the contents of the %TEMP% directory for recently created compressed files (e.g., *.zip) within the last 24 hours. Consider legitimate applications that may also use Compress-Archive and verify if timestamps and file names are consistent with expected use.

  - **Assess Recent File Access Metrics:** Review Windows Security Event ID 4663 logs for file access patterns related to compressed files. Identify if there's excessive read access (indicating potential data collection) specifically related to sensitive file types (e.g., *.docx, *.xlsx).

  - **Correlate with User Activity Logs:** Review user activity in conjunction with the script execution time to identify suspicious activity around the time of compression. Consider legitimate uses of Compress-Archive for backup or administrative purposes, and verify if the user role aligns with the actions taken.

  - **Examine Network Traffic:** If applicable, assess recent outbound network connections for the affected host. Look for unusual volume or destination patterns indicating data exfiltration, particularly during or after the execution of the Compress-Archive script.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for data exfiltration, specifically if the affected host is critical within the organization, such as a server housing sensitive data. Attackers frequently use this method to prepare data for illicit transfer, making it a common technique in many intrusion scenarios.

  ### Blind Spots and Assumptions

  Limitations in detection may arise from disabled Script Block Logging, which would prevent capturing the necessary log data for a definitive alert. Additionally, legitimate administrative use of Compress-Archive for routine maintenance tasks may inadvertently trigger this alert, necessitating contextual analysis. A related detection to consider is unauthorized access to the Temp folder to ensure any staging of files does not go unnoticed.

