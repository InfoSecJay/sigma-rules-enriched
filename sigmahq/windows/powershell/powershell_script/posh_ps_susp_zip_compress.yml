note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands using the `Compress-Archive` cmdlet that store compressed files in commonly exploited directories such as TEMP or AppData\Local\Temp. The likely attacker objective is to compress sensitive data (e.g., documents or credentials) for streamlined exfiltration, thereby minimizing the volume of data sent over the network while utilizing familiar environments that can easily be overlooked. This behavior falls under the MITRE ATT&CK framework as collection (T1074.001).

  Primary telemetry sources for this detection are Windows PowerShell script logs, specifically script block logging, which must be enabled for accurate capture. If this activity is malicious, it may indicate preparatory actions for data exfiltration. Importantly, this detection does NOT confirm that exfiltration has occurred; it merely indicates that potentially suspicious compression activity has taken place.

  ### Investigation Steps

  - **Check script block logs:** Review Windows Security Event ID 4104 for the presence of the `Compress-Archive` command targeting `$env:TEMP` or similar paths, indicating potential malicious intention. Look for indications of non-standard usage patterns.

  - **Identify output file locations:** Examine the TEMP and AppData\Local\Temp directories for newly created archive files, focusing on timestamps and file sizes to verify if bulk data is being processed. Expected benign behavior might show regular temporary files, but suspicious activity may show unusually large or numerous zip files.

  - **Cross-reference user activities:** Look at Windows Event ID 4672 (Special privileges assigned to new logon) and 4688 (Process Creation) to identify the user context that executed the PowerShell command. Legitimate user activity typically involves predictable, scheduled tasks or administrative activities, whereas anomalous logons or execution timestamps may indicate malicious intent.

  - **Analyze prior file accesses:** Check for any previous access or modification to files being compressed. Use Windows Event ID 4663 (Access Attempt) for insight into recent file interactions, especially focusing on files with sensitive content that would warrant compression/staging behavior.

  - **Review for high-confidence indicators:** Look for multiple executions of the `Compress-Archive` command in a very short period, which may indicate an automated process or script running in an adversarial context. This is particularly concerning if initiated by a non-administrative user.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive data within critical systems, combined with the likelihood of malicious exploitation of compression techniques for exfiltration. While the behavior is weaponized by various threat actors, including those employing data staging methods, the context of execution and file contents should inform response urgency.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might obfuscate PowerShell commands or use alternative compression utilities that do not trigger this rule. Required log sources include ensuring that PowerShell script block logging is enabled, as this is crucial for capturing the related event data. Furthermore, legitimate activities—such as system maintenance or legitimate user archival processes—may inadvertently trigger this alert. A related detection to consider is monitoring for unexpected network traffic following the execution of such PowerShell commands to capture potential exfiltration attempts.

