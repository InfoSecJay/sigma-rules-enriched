logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of the PowerShell `Compress-Archive` cmdlet to compress folders and files, specifically when the output is directed to common temporary locations frequently associated with malicious activities. Attackers may leverage this technique to package sensitive data (such as documents) for exfiltration, making the data more portable and reducing the network overhead of sending large files. This behavior is indicative of potential data staging prior to exfiltration efforts.

  This activity relates to the MITRE ATT&CK framework, particularly the tactics and techniques of **Collection** (TA0009) and **Data Staged** (T1074.001). The execution of scripts that package data in temporary directories signals a risk of data compromise and requires immediate investigation.

  The primary data sources for this detection are PowerShell script block logs. For the rule to function effectively, script block logging must be enabled on the monitored systems to capture the relevant PowerShell commands in use.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for occurrences of `Compress-Archive` commands targeting `$env:TEMP`, `\AppData\Local\Temp\`, or `\Windows\Temp\`; these indicate potential staging areas for exfiltration.
  - **Analyze Process Creation Events:** Scrutinize related process creation events around the time of the detected execution, looking for suspicious parent-child relationships indicative of exploitation methodology.
  - **Inspect Network Activity:** Check for unusual outbound connections or data transfer patterns occurring shortly after the compression activity, especially to external IPs or unauthorized domains.
  - **Correlate with Other Alerts:** Look for additional alerts related to data collection or lateral movement that may suggest broader malicious behavior; context is essential for comprehensive threat assessment.

  ### Prioritization
  The alert severity is classified as medium due to the potential of this behavior to indicate serious threats, including data exfiltration. The likelihood of encountering such behavior in a corporate network serves as a critical signal for immediate investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if script block logging is not enabled, which would prevent visibility into PowerShell command execution. The detection logic assumes that activity in common temporary directories signifies malicious intent, which may not always hold true. Additionally, if file compression is a legitimate workflow or scripting practice within the organization, analysts should consider possible false positives depending on the context of the PowerShell execution.

