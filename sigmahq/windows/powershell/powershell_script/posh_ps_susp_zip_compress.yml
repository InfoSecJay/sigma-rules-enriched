logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  The Sigma rule detects the execution of PowerShell scripts that utilize the "Compress-Archive" cmdlet, specifically when the output is directed to common temporary directories often exploited by malicious actors for staging files prior to exfiltration. The likely objective of an attacker is to compress sensitive information for stealthy transfer out of the environment, optimizing the size and potentially evading detection. This behavior aligns with the MITRE ATT&CK framework, specifically T1074.001 (Data Staged: Local Data Staging).

  Primary telemetry sources include Windows PowerShell logs with Script Block Logging enabled, which capture the details of script executions. If malicious, this behavior indicates potential data exfiltration preparation, posing a significant security risk to sensitive information. Importantly, this detection alone does not confirm malicious intent; legitimate administrative activities may also use the Compress-Archive cmdlet for benign purposes.

  ---

  ### Investigation Steps

  - **Examine PowerShell script execution:** Analyze Security Event ID 4104 for instances of Script Block Logging that match the detected activities. Look for patterns involving `Compress-Archive -Path` and check the specified DestinationPath fields to identify unusual locations.

  - **Verify the legitimacy of the script:** Identify the user account executing the PowerShell command. If this is a non-privileged or unusual account, it may indicate potential malicious intent.

  - **Check file output locations:** Review the TEMP directories specified for compressed files (e.g., `C:\Windows\Temp\` or `%TEMP%\`). Analyze the file types and sizes to discern if sensitive data is being archived, considering if closely tied to sensitive or proprietary business information.

  - **Compare against known benign activities:** Validate if there are expected business processes that utilize the `Compress-Archive` cmdlet. For instance, legitimate archiving procedures or scheduled scripts could provide context that mitigates concern.

  - **Identify potentially malicious indicators:** Look for compressed files created in suspicious locations (such as `%TEMP%`) that were subsequently moved, renamed, or accessed shortly after creation. High-confidence indicators include large sizes or unusual file types suggesting sensitive data is being aggregated.

  ---

  ### Prioritization

  This alert has medium severity due to its potential for data exfiltration. The detection indicates a significant risk if the affected system contains sensitive information. Given that compressing files is not uncommon in routine operations, further context is crucial to ascertain the maliciousness of the behavior. However, adversaries widely use compression techniques during preparatory steps for more stealthy data exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate PowerShell usage to generate similar alerts, especially in automated environments where archiving is common. Additionally, accurate detection hinges on the configuration of Script Block Logging, which may not be universally enabled. Legitimate activities such as routine backups or IT maintenance tasks may trigger this alert. A related detection, such as monitoring for unusual outbound network connections post-compression activity, would provide enhanced visibility into malicious exfiltration efforts.

