note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that reference keywords associated with the WinPwn tool, which is utilized for Windows and Active Directory reconnaissance and exploitation. Adversaries may use WinPwn to extract sensitive information or escalate privileges within a network, which aligns with MITRE ATT&CK tactics, specifically "Credential Access" (T1066) and "Execution" (T1203). The primary telemetry source for this detection is PowerShell script block logging, requiring the logging setting to be enabled for accurate capture of PowerShell execution data.

  If the behavior is confirmed as malicious, it poses a significant risk to the integrity of Windows systems and the security of Active Directory environments, potentially allowing attackers to exfiltrate sensitive data or establish footholds within the network. However, this detection does NOT confirm unauthorized access or malicious intent on its own; legitimate administrative scripts may also invoke these keywords.

  ### Investigation Steps

  - **Check PowerShell logs for Script Block events**: Review Windows Event ID 4104 for PowerShell script block logging, specifically looking for entries that contain 'Offline_Winpwn', 'WinPwn ', or 'WinPwn.exe'.

  - **Correlate with user activity**: Investigate the user account executing the script for any other suspicious activity or prior alerts. Validate whether the user has a legitimate reason to run WinPwn, based on their role within the organization.

  - **Evaluate the context of the script execution**: Identify the context in which the script was run (Event ID 4688 for new process creation) to determine if it was run interactively or as part of a scheduled task, which may indicate automation or routine maintenance.

  - **Identify high-confidence malicious indicators**: Look for concurrent suspicious activities such as lateral movement attempts (Event ID 4624 - logon events) or external connections established shortly after WinPwn execution.

  - **Review for benign scripts**: Assess whether legitimate administrative scripts may reference WinPwn for documentation or training. Analyze the script's purpose and context; benign usage typically lacks external network communications or sensitive data handling.

  - **Check for file creation or data exfiltration**: Validate event logs (Windows Event ID 4663) for any file access or creation attempts that follow the execution of the WinPwn script, indicating potential data theft or persistence mechanisms.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical Windows systems and Active Directory security. The likelihood of malicious abuse is elevated, as the WinPwn tool is explicitly designed for exploitation. This type of behavior is commonly weaponized in intrusions, making rapid response essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for script block logging to be enabled; if logging is not active, this alert will not trigger. Evasion techniques may include renaming scripts or masking commands that call WinPwn functions. Additionally, legitimate administrative tasks or pen-testing activities might inadvertently trigger this alert. A related detection to strengthen coverage would include monitoring for lateral movement attempts following WinPwn execution (e.g., querying for Event ID 4624 to catch suspicious logons).

