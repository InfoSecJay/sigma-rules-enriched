note: |
  ### Technical Context

  This Sigma rule detects the execution of the HackTool known as WinPwn, which is used for reconnaissance and exploitation of Windows and Active Directory environments. An attacker using WinPwn aims to gather sensitive information, exploit vulnerabilities, and potentially escalate privileges within the targeted network. The relevant MITRE ATT&CK techniques include Credential Access (T1552.001), Discovery (T1082), Execution (T1106), and Privilege Escalation (T1548.002).

  The primary telemetry source for this detection is PowerShell script block logging on Windows systems. Specifically, the rule looks for script blocks containing keywords associated with WinPwn, such as 'WinPwn.exe' and 'WinPwn.ps1'. If this behavior is malicious, it could lead to unauthorized access to sensitive data and compromise system integrity. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate scripts may reference these keywords without nefarious purposes.

  ### Investigation Steps

  - **Review script block logs:** Check Windows Event ID 4104 for occurrences of script blocks that include keywords like 'WinPwn.exe' or 'Offline_Winpwn.' Focus on the 'ScriptBlockText' field to identify potential malicious activity.

  - **Analyze process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 to track the execution of associated PowerShell processes. Look for the command line arguments that include 'WinPwn' and investigate the parent process ID for context.

  - **Identify authorized script usage:** Validate whether the triggering script block is part of known and authorized administrative tasks. If the script originates from a trusted source or was scheduled as a job, it may be benign.

  - **Investigate user context:** Determine the user account that executed the script. Check for any signs of account compromise if an unusual user executed the WinPwn-related scripts.

  - **Correlate additional logs:** Look into Windows Event IDs 4624 (successful logon) and 4688 (process creation) around the time of alert activation. Identify if there were any unusual logon patterns or failed attempts leading up to the execution.

  - **Assess asset risk level:** Consider the asset's role within the network. If it is a critical system, the severity of the detected behavior increases, warranting immediate attention.

  ### Prioritization

  This alert should be classified as high severity due to the potential impact on sensitive information and system functionality. WinPwn is a known exploitation tool, and its use indicates a likelihood of malicious behavior, making it a priority for further investigation in any enterprise environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the quality of script block logging, which must be enabled for effective monitoring. Adversaries may employ evasion techniques, such as obfuscation or running only pieces of the tool, to avoid detection. Legitimate administrative scripts may accidentally trigger this alert if they contain the keywords. Related detections could include monitoring for other common exploitation tools or PowerShell execution patterns (e.g., execution of scripts with suspicious content or elevated permissions).

