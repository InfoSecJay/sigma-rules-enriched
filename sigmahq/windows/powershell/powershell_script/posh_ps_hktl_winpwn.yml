note: |
  ### Technical Context

  This Sigma rule detects the execution of the WinPwn tool through its script block text keywords. This behavior is typically indicative of an attacker attempting to conduct reconnaissance or exploitation operations within a Windows or Active Directory environment. The attacker’s objective may include gathering sensitive information, escalating privileges, or performing lateral movement. The relevant MITRE ATT&CK tactics and techniques associated with this detection are **Credential Access (T1056)**, **Defense Evasion (T1562)**, and **Execution (T1203)**.

  Primary telemetry sources include PowerShell Script Block Logging, which must be enabled for this detection to work effectively. If WinPwn is indeed being executed, the security impact can be significant, as it can lead to unauthorized access and potential compromise of sensitive systems. Importantly, this detection alone does NOT confirm malicious intent; it may also trigger from legitimate testing or administrative scripts referencing WinPwn.

  ### Investigation Steps

  - **Examine PowerShell logs for script execution activities:** Review Windows Security Event ID 4104, focusing on Script Block Logging entries for keywords related to 'WinPwn', 'WinPwn.exe', or 'WinPwn.ps1'. Legitimate administrative tasks will typically not reference these specific terms.

  - **Identify the user context executing the script:** Check the `UserID` and `AccountName` fields in Event ID 4104 to determine if the execution originates from a known administrative account or an unusual user, indicating possible malicious activity.

  - **Review related event logs for unusual behavior:** Investigate Event ID 4688 (Process Creation) for `cmd.exe` or `powershell.exe` spawning instances that include WinPwn. Focus on timestamps aligning with the alert.

  - **Check for other indicators of compromise:** Look for related logs of system changes or user access patterns by reviewing Event ID 4663 on files modified or accessed in conjunction with the WinPwn execution timeframe.

  - **Validate against known good baselines:** Compare the activity against established baselines for PowerShell script execution in your environment. Any unusual variance may indicate malicious use.

  - **Document any prior detections or security incidents:** Review any historical alerts or incidents related to WinPwn or similar behaviors. Check out sources like SIEM or endpoint detection platforms for any correlations or patterns.

  ### Prioritization

  This alert is of **high severity** in an enterprise context due to the potential for significant damage associated with WinPwn exploitation. Given that this tool is commonly weaponized for recon and privilege escalation, the likelihood of malicious intent is elevated, particularly if triggered by non-administrative accounts or unusual access patterns.

  ### Blind Spots and Assumptions

  Detection may be limited if Script Block Logging is not enabled on all relevant systems. It also assumes that legitimate administrative scripts will not reference WinPwn. Potential evasion techniques include modifying script names or leveraging obfuscation techniques to bypass detection filters. A related detection for suspicious PowerShell command patterns (e.g., unauthorized encoded commands) can enhance coverage and support correlation of events.

