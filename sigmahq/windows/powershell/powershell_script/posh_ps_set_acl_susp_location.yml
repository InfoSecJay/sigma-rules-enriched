note: |
  ### Technical Context

  This rule detects the use of the PowerShell `Set-Acl` cmdlet targeting folders within the Windows directory, which is indicative of a potential attempt to modify access controls on sensitive system files. An attacker may execute this command to escalate privileges, obfuscate activity, or bypass security controls. The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Permission Escalation** (T1068).

  The primary telemetry source is PowerShell script logs that capture script block commands and their parameters. If malicious, the security impact could be significant as manipulating ACLs can lead to unauthorized access and potential system compromise. This detection does NOT confirm that any changes were successfully made to file permissions, nor does it indicate that the activity was conducted by an unauthorized user.

  ### Investigation Steps

  - **Examine PowerShell logs:** Review logs for Security Event ID 4104 (PowerShell ScriptBlockLogging) to identify the full context of the commands executed, focusing on fields like `ScriptBlockText`, which should contain detected parameters like `Set-Acl` and `-Path "C:\Windows"`.

  - **Verify associated processes:** Check for parent processes using Security Event ID 4688 (Process Creation), ensuring that the PowerShell instance was not spawned from legitimate administrative tools (e.g., Remote Desktop Services or Group Policy management).

  - **Identify ACL modifications:** If possible, review Windows Security Event ID 4670 (Permissions on an object were changed) for further insights into what specific modifications were made to file permissions following the detected PowerShell execution.

  - **Cross-reference authorized actions:** Compare the detected behavior against standard operational procedures. Legitimate uses of `Set-Acl` should typically involve user folders or other non-critical paths, while this detection specifically targets system-critical directories.

  - **Look for high-confidence indicators:** Identify any instances of `Set-Acl` with parameters indicating excessive privileges (e.g., `FullControl` or `Allow` for users/groups not normally granted such access). This can signify malicious intent and warrants immediate attention.

  ### Prioritization

  This alert is high severity as it directly impacts system integrity and may facilitate further malicious actions. The likelihood of abuse is elevated given the sensitivity of the Windows directory. Attackers commonly exploit such footholds for privilege escalation or persistence.

  ### Blind Spots and Assumptions

  This detection may miss evasion attempts where attackers obfuscate their commands or utilize alternative methods for modifying ACLs. Reliable detection requires enabling PowerShell script block logging and possibly Windows Security Auditing configurations for object access. Common legitimate activities that could trigger the rule include administrative scripts for system maintenance; hence context is critical. Companion detections such as monitoring for unusual user behavior or lateral movement tools could enhance overall coverage and response readiness.

