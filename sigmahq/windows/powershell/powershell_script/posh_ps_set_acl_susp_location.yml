detection:
  selection_cmdlet:
    ScriptBlockText|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
        # Note: Add more suspicious paths
    ScriptBlockText|contains:
    - '-Path "C:\Windows'
    - '-Path "C:/Windows'
    - "-Path 'C:\\Windows"
    - "-Path 'C:/Windows"
    - '-Path C:\\Windows'
    - '-Path C:/Windows'
    - '-Path $env:windir'
    - '-Path "$env:windir'
    - "-Path '$env:windir"
  selection_permissions:
        # Note: Add more suspicious permissions
    ScriptBlockText|contains:
    - 'FullControl'
    - 'Allow'
  condition: all of selection_*
