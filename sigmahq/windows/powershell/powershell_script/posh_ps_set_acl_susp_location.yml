note: |
  ### Technical Context

  This Sigma rule detects attempts to alter Access Control Lists (ACLs) on files within the Windows directory using the PowerShell cmdlet `Set-Acl`. The likely attacker objective is to modify permissions to gain unauthorized access or manipulate system files, potentially facilitating further malicious actions. This behavior aligns with the MITRE ATT&CK technique T1222 (File and Directory Permissions Modification) under the Defense Evasion tactic. The primary telemetry sources include PowerShell script execution logs, specifically pertaining to ScriptBlockText with cmdlet usage. If the activity is malicious, it could significantly compromise system integrity and security, allowing unauthorized users increased privileges on sensitive files. This detection does NOT confirm if the adjustment was effective or leveraged for further malicious actions.

  ### Investigation Steps

  - **Identify the triggering PowerShell command:** Review PowerShell logs for Event ID 4104, focusing on Script Block logs containing `Set-Acl` and `-Path "C:\Windows"`. Check if the cmdlet's execution originated from a suspicious parent process like `powershell.exe` (Event ID 4688) or `wmic.exe`.

  - **Review changed file permissions:** Cross-reference the modified ACL entries using Security Event ID 4670 to determine if file permissions have indeed changed, particularly looking for unusual permissions like 'FullControl' granted to non-administrative users or groups.

  - **Evaluate the user context:** Analyze the account executing the command. Determine if it is a legitimate administrative account or if it has anomalous login behavior (e.g., new locations, unusual times) that may suggest compromise or misuse.

  - **Assess typical legitimate behavior:** Document legitimate scenarios where `Set-Acl` may be used, such as during maintenance schedules or application installations. Expect changes to known paths by authorized administrators with appropriate permission levels.

  - **Confirm environment-specific threats:** Validate the host's criticality and assess its exposure; for instance, roles like Domain Controllers or servers hosting sensitive applications are higher risk if permissions are modified.

  - **Identify suspicious parent-child process relationships:** Check for unusual child processes spawned from PowerShell or command line utilities that follow the detected command, indicating possible chained attacks or lateral movement attempts.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and data integrity from unauthorized permissions changes. The likelihood of abuse is significant, as altering Windows folder ACLs is a known tactic used by adversaries to maintain persistence or escalate privileges. The behavior observed is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection is susceptible to legitimate administrative activities where authorized users perform routine ACL updates. Evasion techniques may include obfuscating PowerShell commands or executing from signed scripts to bypass logging. Reliable detection requires configuration of both PowerShell script block logging and Windows security auditing for file permission changes. A related detection for enhanced coverage would be monitoring for unusual process creations associated with PowerShell executions, as seen in process creation logs (Event ID 4688).

