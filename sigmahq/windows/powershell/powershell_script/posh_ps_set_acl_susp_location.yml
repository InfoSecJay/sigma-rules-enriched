note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell scripts that modify Access Control Lists (ACLs) on files within the Windows folder. By leveraging the `Set-Acl` cmdlet, an attacker could potentially escalate privileges or gain unauthorized access to sensitive files and directories. This behavior is often associated with attempts to conceal malicious activity or facilitate lateral movement within a network.

  The primary objective of an attacker executing such scripts is typically to manipulate file permissions, allowing them to control access to critical system files or services, which can be a precursor to more malicious activities such as data exfiltration or the installation of persistence mechanisms. The relevant MITRE ATT&CK tactic for this detection is **Defense Evasion** (ID: T1222), particularly the technique of manipulating ACLs to obscure their actions or to maintain access.

  The primary data source for this detection is PowerShell script block logs, which capture the commands executed within PowerShell and may contain clues about suspicious commands and parameters related to changing file permissions.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script block logs for instances where the `Set-Acl` cmdlet is invoked, paying close attention to commands that modify paths within `C:\Windows` or utilize environment variables that may indicate an attempt to modify standard files and folders.

  - **Analyze ACL Changes:** Investigate recent changes to file permissions on Windows system files, particularly looking for ACL modifications that grant elevated permissions such as 'FullControl' to untrusted users or processes.

  - **Correlation with Other Activities:** Assess whether the detected PowerShell activity correlates with any unusual process creations, service modifications, or concurrent security events that could indicate adversarial intent or indicate a larger attack vector.

  - **Verify Source and Context:** Check the context in which the PowerShell script was executed. Determine the user account utilized for running the script and whether it exhibits any previous suspicious activity, such as logging in from unknown locations or at unusual times.

  ### Prioritization
  This alert is of high severity in an enterprise environment due to its potential to indicate active privilege escalation attempts or unauthorized access to critical system files. Such adversarial actions can lead to significant data breaches or system compromises if not promptly addressed.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding the use of other scripting languages or tools that could modify ACLs without being logged as PowerShell actions. The detection logic assumes that sufficient logging is enabled within PowerShell to capture script block logs, which might not be configured in all environments. Additionally, false positives can occur from legitimate administrative activities that involve ACL modifications under normal operational scenarios. Proper log retention and monitoring practices must be in place for effective detection and investigation.

