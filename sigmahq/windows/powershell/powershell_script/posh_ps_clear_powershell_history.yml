title: Clear PowerShell History - PowerShell
id: 26b692dc-1722-49b2-b496-a8258aa6371d
related:
- id: dfba4ce1-e0ea-495f-986e-97140f31af2d
  type: derived
status: test
description: Detects keywords that could indicate clearing PowerShell history
references:
- https://gist.github.com/hook-s3c/7363a856c3cdbadeb71085147f042c1a
author: Ilyas Ochkov, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
date: 2022-01-25
modified: 2022-12-02
tags:
- attack.defense-evasion
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1a:
    ScriptBlockText|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection1b:
    ScriptBlockText|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_2:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_3:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_* or all of selection1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands and configurations that indicate an attempt to clear the command history. Attackers may employ this tactic to erase traces of their activities, making it harder for defenders to conduct forensic investigations after a compromise. The presence of commands like `Remove-Item`, `Set-PSReadlineOption`, and variations thereof can signal that an adversary is attempting to engage in defensive evasion, a common objective during post-exploitation phases.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), with the specific techniques of **Indicator Removal on Host** (T1070.003). By manipulating PowerShell settings to prevent the saving of command history, adversaries hinder the ability of security teams to track their malicious actions. The primary data source required for this detection is PowerShell script block logging, which must be enabled on the target Windows systems to capture these script executions.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check script block logs for the identified commands and configurations related to command history clearance. Focus on the timestamps and correlate them with other suspicious activities in the environment.
  - **Correlate with Other Activities**: Look for additional evidence of potential compromise by linking the PowerShell execution to user logins, lateral movement indicators, or any other abnormal behavior captured by endpoint detection solutions.
  - **Examine User Behaviour**: Investigate the context of the user executing the suspicious PowerShell commands. Determine if there are legitimate reasons for these activities or if they align with known user behaviors and job responsibilities.
  - **Identify Anomalous Patterns**: Establish baseline PowerShell usage patterns for users and systems. Recognize deviations that may indicate malicious intent, such as unusually frequent use of commands that delete or modify history.

  ### Prioritization
  Alerts generated from this detection should be treated with medium severity due to the potential impact of an attacker covering their tracks. Although not all incidents of clearing history indicate malicious behavior—such as legitimate scripts—persistence of these patterns alongside other indicators of compromise warrants prompt investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage is if PowerShell logging has not been appropriately configured or is disabled, which would lead to missed detections of malicious activities. The detection logic assumes that the presence of commands indicating history clearing is indicative of malicious activity; however, legitimate administrative scripts may also perform similar operations. Therefore, it is crucial to ensure that script block logging is enabled on targeted systems to capture relevant artifacts for this detection rule to function effectively.

