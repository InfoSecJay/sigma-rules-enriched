logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1a:
    ScriptBlockText|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection1b:
    ScriptBlockText|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_2:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_3:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_* or all of selection1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects potential malicious activity related to clearing PowerShell command history, an action often taken by attackers to erase traces of their actions on a compromised system. The primary objective of an attacker performing this behavior is to obfuscate activities and avoid detection by security monitoring tools. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.003 - Clear Command History.

  The telemetry source for this detection is Windows PowerShell logging, specifically the Script Block Logging feature. If malicious, this activity can hinder forensic investigations, allowing adversaries to maintain persistence and evade security controls. Importantly, this detection does not confirm that malicious activity is occurring on its own; legitimate PowerShell scripts may include similar commands for valid purposes.

  ### Investigation Steps

  - **Review Recent PowerShell Activity:** Check Security Event ID 4104 for Script Block Logging entries that match the anomaly. Focus on any script blocks containing keywords such as "Remove-Item", "Get-PSReadlineOption", or "Set-PSReadlineOption -HistorySaveStyle SaveNothing" to identify potential malicious behavior.

  - **Examine System for Additional Signs of Compromise:** Investigate any correlating Security Event IDs 4688 and 4697 for process creations from PowerShell with suspicious command-line arguments. Look for unusual parent processes, particularly those initiated by non-admin users.

  - **Validate Legitimate Use Cases:** Confirm expected behavior by identifying known administrative scripts or scheduled tasks that utilize PowerShell. Ensure these scripts have documented use cases that align with organizational policies, thereby reducing false positives.

  - **Audit User Permissions:** Check the permissions for the user accounts executing the PowerShell commands. Security Event ID 4720 can help identify any unauthorized account creations or privilege escalations that may coincide with the detected activity.

  - **Investigate PowerShell Profile Scripts:** Assess the user's PowerShell profile scripts (e.g., $PROFILE). Look for modifications that could indicate an attacker embedding scripts to clear history, leveraging Event ID 4104 for detailed script execution context.

  - **Confirm Persistence Mechanisms:** Review task scheduler (Event ID 4698) or startup folder entries for scheduled tasks or startup scripts attempting to hide malicious activity, particularly if related to the users involved in the PowerShell history manipulation.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems where PowerShell is heavily used, such as servers or workstations handling sensitive data. The likelihood of malicious abuse is significant as similar techniques are commonly deployed in real-world attacks to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement that Script Block Logging is enabled; lack of it can result in incomplete coverage. Legitimate scripts and administrative tasks may trigger this alert as users update their PowerShell settings. A related detection to consider is T1070.001 - Clear Windows Event Logs, which could complement visibility into an adversary’s intent to cover their tracks across multiple vectors.

