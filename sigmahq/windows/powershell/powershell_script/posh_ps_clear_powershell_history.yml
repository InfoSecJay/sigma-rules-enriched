logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1a:
    ScriptBlockText|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection1b:
    ScriptBlockText|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_2:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_3:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_* or all of selection1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ### Technical Context

  This rule detects the clearing of PowerShell command history through specific PowerShell commands and options. At an attacker’s objective level, clearing command history may indicate an attempt to obscure tracks after executing malicious commands or scripts. This behavior fits into the MITRE ATT&CK framework under the tactic "Obfuscation" (ID: T1070.003). The primary telemetry source for this detection is Windows PowerShell Script Block Logging, which must be enabled to capture detailed command execution histories.

  If malicious, the clearing of command history can prevent analysts from identifying prior PowerShell activity and understanding the nature of the compromise. It’s important to note that this detection alone does not confirm that a system has been compromised or that malicious activity has occurred; it merely indicates that a user or process attempted to clear their command history.

  ### Investigation Steps

  - **Verify script block logging status:** Check if PowerShell Script Block Logging is enabled on the affected system (can be found in Group Policy under `Computer Configuration > Administrative Templates > Windows Components > Windows PowerShell`).

  - **Review PowerShell logs for clearing commands:** Look in the PowerShell event logs (Event ID 4104) for any script blocks containing keywords such as "Remove-Item," "del," or "Set-PSReadlineOption -HistorySaveStyle SaveNothing."

  - **Identify legitimate usage patterns:** Review the user activity within the timeframe of the alert to look for users conducting legitimate administrative tasks, such as regular clean-up scripts or configuration changes that might trigger similar behavior.

  - **Correlate with other alerts:** Check for any other security alerts (such as failed logins or known malicious activity) that occurred before or after the history clearing to assess suspicious behavior patterns.

  - **Recognize high-confidence indicators of compromise:** Look for the usage of "Set-PSReadlineOption -HistorySaveStyle SaveNothing," as this is a strong indicator of intent to omit command execution tracks, signaling potential malicious activity.

  - **Evaluate the asset's criticality:** Determine the importance of the affected system in your environment; potential impacts escalate if the system is part of a sensitive function such as domain control or application hosting.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on investigative efforts in compromised systems. However, while clearing command history is a common tactic used by attackers to impede detection, it is not inherently malicious without additional contextual indicators of compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block Logging, which is not enabled by default on all systems. Legitimate administrative tools and scripting operations can trigger this alert when performative clean-up activities are conducted. A related detection to consider would be monitoring for unusual or unauthorized PowerShell command execution patterns, as detection in tandem can enhance overall security coverage.

