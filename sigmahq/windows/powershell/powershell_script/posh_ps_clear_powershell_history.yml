logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1a:
    ScriptBlockText|contains:
    - 'del'
    - 'Remove-Item'
    - 'rm'
  selection1b:
    ScriptBlockText|contains: '(Get-PSReadlineOption).HistorySavePath'
  selection_2:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '–HistorySaveStyle'          # not sure if the homoglyph –/- is intended, just checking for both
    - 'SaveNothing'
  selection_3:
    ScriptBlockText|contains|all:
    - 'Set-PSReadlineOption'
    - '-HistorySaveStyle'
    - 'SaveNothing'
  condition: 1 of selection_* or all of selection1*
falsepositives:
- Legitimate PowerShell scripts
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects PowerShell commands that may be used to clear the command history, including specific functions like `Remove-Item` and configurations that prevent history from being saved. The likely objective of an attacker executing these commands is to evade detection by removing traces of executed commands, potentially following malicious activities that require stealth. This behavior aligns with the MITRE ATT&CK technique for defense evasion, specifically T1070.003 (Indicator Removal on Host: Clear Command History).

  Primary telemetry source includes PowerShell Script Block logging, which must be enabled for proper detection. The operational impact of malicious history clearing includes reduced visibility of an attacker’s actions, making it challenging to conduct forensic analysis. However, this detection does NOT confirm malicious intent or compromise on its own, as similar commands might be run by legitimate users or administrators for benign reasons.

  ---

  ### Investigation Steps

  - **Review PowerShell script logs for cleared history commands**: Check Windows Event ID 4104 for Script Block logging. Look for commands with keywords such as 'del', 'Remove-Item', 'Set-PSReadlineOption'. Compare them against known legitimate scripts to discern intent.

  - **Identify the user and context of the activity**: Validate the user account running the PowerShell scripts. Evaluate if the account typically requires such commands due to their role, focusing on highly privileged accounts or those outside normal operational behavior.

  - **Examine for other indicators of compromise**: Correlate with Event ID 4688 (Process Creation) for other suspicious PowerShell activity around the same time window, especially if scripts are executed non-interactively (e.g., via scheduled tasks).

  - **Document expected behavior based on usage patterns**: Identify legitimate usage scenarios where history clearing is customary (e.g., system maintenance scripts). Compare these with the alert to check for discrepancies in execution context and frequency.

  - **Look for known malicious patterns**: Investigate if command histories at the designated paths (identified by `(Get-PSReadlineOption).HistorySavePath`) show abrupt clear-out or unusual patterns, particularly following known attack vectors like PowerShell Empire or other similar frameworks.

  ---

  ### Prioritization

  This alert is of medium severity due to its potential impact on security visibility, especially in critical systems. The likelihood of malicious misuse is moderate, as attackers commonly utilize techniques to evade detection mechanisms. However, the behavior may also occur legitimately, warranting further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection of these commands is limited by the requirement of enabling PowerShell Script Block Logging, which might not be universally configured. Moreover, legitimate administrators might trigger this alert during maintenance sessions or script testing. A related detection to reinforce coverage includes monitoring Event ID 4104 for unusual Script Block logging patterns that precede or coincide with this behavior, enhancing context for investigation.

