note: |
  ### Technical Context
  This detection rule identifies potentially suspicious PowerShell scripts that execute COM objects using `GetTypeFromCLSID` and `ShellExecute`. This method is commonly leveraged by attackers to execute malicious payloads or scripts in a stealthy way, that can lead to privilege escalation or the persistence of malware on a compromised system. The use of COM objects can facilitate the execution of arbitrary code by indirectly invoking malicious software through legitimate-looking commands, which makes this behavior a concern for defenders.

  The primary objective of attackers utilizing this technique is often to maintain access to a compromised system or to escalate their privileges by executing code under the context of higher-privileged processes. This tactic falls under the MITRE ATT&CK framework in the following categories:
  - **Tactic:** Privilege Escalation
  - **Technique:** T1546.015 - Event Triggered Execution: Shortcuts, which covers mechanisms that can be used to maintain access or trigger execution based on system events.

  The most relevant data source for this detection is Windows PowerShell logging, specifically where Script Block Logging is enabled. This will provide visibility into the command executions taking place, capturing the use of `GetTypeFromCLSID` and `ShellExecute`.

  ### Investigation Steps
  - **Review Script Block Logs:** Examine PowerShell Script Block logs for instances of `::GetTypeFromCLSID(` and `.ShellExecute(`. Look for any patterns or anomalies in script execution that deviate from the norm for your environment.
  - **Analyze Process Creation Events:** Investigate process creation logs to identify if there are any unexpected processes spawned as a result of the detected PowerShell commands. Pay specific attention to processes that may indicate malware execution or lateral movement.
  - **Check for Suspicious COM Objects:** Look into which COM objects are being invoked and verify their legitimacy. Known malicious COM objects can be linked to specific malware families and their execution context should be scrutinized.
  - **Validate PowerShell Security Settings:** Ensure that PowerShell security features like Constrained Language Mode or execution policies are appropriately configured to mitigate potentially harmful scripts from running.

  ### Prioritization
  This alert warrants medium severity due to the possible implications of privilege escalation and persistence, which could lead to more serious attacks. The likelihood of abuse for this technique is high, as attackers frequently employ COM object execution for stealthy engagements within compromised environments.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if Script Block Logging is not enabled or if logs are not retained long enough for historical analysis. The detection logic assumes that suspicious activity will not be masked by legitimate applications or scripts designed to use COM objects via PowerShell. Additionally, for the alert to function effectively, it is imperative that the environment is appropriately configured to collect and store PowerShell logging data.

