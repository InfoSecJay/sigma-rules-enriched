note: |
  ### Technical Context

  This rule detects the execution of PowerShell code that invokes COM object methods through `GetTypeFromCLSID` followed by `ShellExecute`. This behavior often signifies an attempt to execute potentially malicious code or load a malicious payload via a registered COM object, which attackers may use for privilege escalation or persistence. The relevant MITRE ATT&CK tactic is "Execution," and the technique is T1546.015 (Event Triggered Execution: COM Scripts).

  The primary telemetry source is Windows PowerShell script logs, specifically indicating the execution of script blocks. Legitimate use may occur in standard administrative tasks, but a malicious use case could compromise system security, lead to unauthorized access, or conduct further attacks. This detection alone does not confirm malicious intent, as legitimate scripts may trigger this rule.

  ### Investigation Steps

  - **Review PowerShell logs for this activity:** Collect PowerShell event logs (Event ID 4104) and examine the `ScriptBlockText` for the use of `GetTypeFromCLSID` and `ShellExecute`.

  - **Check for related process creation events:** Monitor for associated process creation (Event ID 4688 or Sysmon Event ID 1) that show PowerShell executing with unusual parent processes (e.g., cmd.exe or rundll32.exe), indicating possible malicious execution hierarchy.

  - **Determine if the context is legitimate:** Identify instances where COM objects are invoked by standard administrative tools or internal applications. Review operational context and execution times to validate benign use.

  - **Identify the COM object being called:** Extract the CLSID information from the detected command to determine the exact COM object being executed. Lookup unusual or known malicious CLSIDs in your environment.

  - **Correlate with other security alerts:** Cross-reference alerts from endpoint protection systems or threat intelligence platforms for signs of known bad actors or tools associated with the invoked COM object.

  - **Document any signs of persistence:** Look for persistence mechanisms that could be established if malicious activity was detected, such as registry modifications or scheduled tasks associated with the PowerShell execution.

  ### Prioritization

  This alert is of medium severity due to the potential for both privilege escalation and persistence utilized by attackers. The concern is higher in critical systems where this behavior is less common and where there could be significant impacts if exploited.

  ### Blind Spots and Assumptions

  Detection may be limited by script block logging being disabled. Adversaries might evade detection by obscuring their commands or using benign-looking CLSIDs. Furthermore, legitimate administrative PowerShell activities, including software installations or updates, may inadvertently trigger this alert. A related detection to consider is monitoring for unusual registry write actions (e.g., Event ID 4663) in conjunction with these PowerShell executions to provide broader context for potential abuse.

