logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - Copy-Item
    - '-Destination'
  selection_path:
    ScriptBlockText|contains:
    - '\Opera Software\Opera Stable\Login Data'
    - '\Mozilla\Firefox\Profiles'
    - '\Microsoft\Edge\User Data\Default'
    - '\Google\Chrome\User Data\Default\Login Data'
    - '\Google\Chrome\User Data\Default\Login Data For Account'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for potential credential harvesting from web browsers on Windows systems. Attackers may leverage tools or scripts to copy credential files from browsers like Google Chrome, Mozilla Firefox, Opera, and Microsoft Edge, wherein sensitive data such as usernames and passwords are stored in encrypted formats. The intent behind such activities often aligns with credential theft, allowing adversaries to gain unauthorized access to user accounts or services.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006), specifically targeting the technique of **Credential Dumping: Browser Credential Dumping** (T1555.003). This technique reflects how attackers may employ PowerShell scripts or other automated tools to access and extract stored login information from web browsers, thereby facilitating lateral movement or further exploitation within the target environment.

  The primary data sources implicated in this detection include PowerShell script block logs, which capture the commands and parameters utilized by scripts executing on the machine. Establishing script block logging is crucial for this detection to function effectively, as it will record the details of any suspicious PowerShell activities.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs for any instances of the `Copy-Item` command, particularly those referencing paths related to known browser credential storage locations.

  - **Examine File Access Patterns:** Investigate any unusual access to credential files within directory paths like `\Google\Chrome\User Data\Default\Login Data` or equivalent directories for other browsers. Pay attention to any transfer or modification actions on these files.

  - **Correlate with User Behavior:** Assess the context of the user activity leading to the alert. Look for anomalies in the user's logins or lateral movement, especially if these actions coincide with suspicious PowerShell operations.

  - **Monitor Script Execution:** If applicable, track whether any scripts or binaries associated with known credential harvesting tools were executed around the same time as the detection to build a comprehensive view of the incident.

  ### Prioritization
  The alert is assigned a medium severity due to the potential impact of credential theft. With increasingly sophisticated attacks aimed at gaining unauthorized access to sensitive systems, early detection and response are critical to prevent lateral movement and further exploitation.

  ### Blind Spots and Assumptions
  This detection rule relies on the assumption that Script Block Logging has been enabled across all critical systems. A significant gap is that if users are executing credential extraction methods outside of PowerShell or if the log settings are misconfigured, these actions could evade detection. Hence, ensuring comprehensive logging for PowerShell and user file access activities is essential for holistic security monitoring.

