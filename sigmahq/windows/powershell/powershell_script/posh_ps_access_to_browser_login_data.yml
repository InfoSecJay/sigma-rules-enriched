detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - Copy-Item
    - '-Destination'
  selection_path:
    ScriptBlockText|contains:
    - '\Opera Software\Opera Stable\Login Data'
    - '\Mozilla\Firefox\Profiles'
    - '\Microsoft\Edge\User Data\Default'
    - '\Google\Chrome\User Data\Default\Login Data'
    - '\Google\Chrome\User Data\Default\Login Data For Account'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to access browser login data files typically used by web browsers to store user credentials. The behavior being observed includes copying or reading the credential files containing usernames and passwords, indicating a possible data exfiltration attempt. The likely attacker objective is to acquire sensitive credentials for unauthorized access to user accounts. This activity aligns with the MITRE ATT&CK technique: Credential Access, T1555.003 (Credentials from Password Managers).

  Primary telemetry sources include Windows PowerShell logs, specifically PowerShell Script Block Logging (Event ID 4104), capturing the script commands executed during the access attempt. If malicious, this behavior poses a significant security risk as it may result in the acquisition of user login information, leading to account takeovers or further lateral movements within the network. Importantly, this detection does NOT confirm that the credentials have been successfully stolen or misused; it merely indicates the attempt to access these files.

  ### Investigation Steps

  - **Review PowerShell logs for suspicious script execution:** Check Event ID 4104 for any script blocks containing `Copy-Item` commands that reference browser credential locations such as `\Google\Chrome\User Data\Default\Login Data`, `\Mozilla\Firefox\Profiles`, etc.

  - **Analyze impacted host behavior:** Determine the user context and processes that initiated the script. Look for unusual user activity around the time of the alert, especially if the account has a low profile.

  - **Identify any known benign access patterns:** Document typical processes for legitimate applications or security tools that access browser data. Verify if any authorized software was in use that could have triggered the alert.

  - **Correlate with other credential access indicators:** Check for other activities or alerts related to credential access techniques (e.g., T1555.001, T1555.002). Confirm if multiple indicators of compromise are present on the same host.

  - **Examine file modification timestamps:** Validate if there were recent modifications or access attempts to files like `Login Data`. Look for evidence of copying or reading these files that coincide with the script execution.

  - **Cross-reference against asset criticality:** Assess the affected system's role within the organization. Systems holding sensitive user information or accounts should be prioritized for further analysis and protection measures.

  ### Prioritization

  This alert has a medium severity due to the potential for significant impact on user account integrity if malicious access occurs. The likelihood of abuse is moderate, as attackers commonly utilize these techniques to harvest credentials. While this behavior is not among the most frequently weaponized, it remains a significant concern in credential-based attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell script logging is not properly configured or disabled, hindering the visibility of malicious activities. Legitimate background processes or administrative scripts that access browser data for maintenance may inadvertently trigger this alert. A related detection to reinforce coverage is monitoring for unauthorized access to the Windows Credential Locker, providing additional context around credential access events.

