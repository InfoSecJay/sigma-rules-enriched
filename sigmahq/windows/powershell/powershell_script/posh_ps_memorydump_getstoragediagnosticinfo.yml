title: Live Memory Dump Using Powershell
id: cd185561-4760-45d6-a63e-a51325112cae
status: test
description: Detects usage of a PowerShell command to dump the live memory of a Windows
  machine
references:
- https://learn.microsoft.com/en-us/powershell/module/storage/get-storagediagnosticinfo?view=windowsserver2022-ps
author: Max Altgelt (Nextron Systems)
date: 2021-09-21
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-StorageDiagnosticInfo'
    - '-IncludeLiveDump'
  condition: selection
falsepositives:
- Diagnostics
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of a PowerShell command (`Get-StorageDiagnosticInfo`) that can be utilized to perform a live memory dump of a Windows machine. This action is suspicious as it could be employed by attackers to gather sensitive information, such as credentials or other valuable data from the system's memory. The ability to extract live memory indicates that an attacker might have elevated privileges, allowing them to perform such operations on a targeted host.

  The likely attacker objectives behind using this command include credential access and reconnaissance, which fall under the MITRE ATT&CK tactics of **Credential Access** (ID: TA0006) and the specific technique of **Memory Dumping** (T1003). Organizations should be vigilant about monitoring for unauthorized use of this command, as it often signifies a potential compromise or an insider threat involving malicious activity. Primary data sources for this detection include PowerShell script block logs, which record the execution of PowerShell commands and are essential for identifying suspicious administrative activity.

  ### Investigation Steps
  - **Review Script Block Logs**: Examine PowerShell script block logging for instances of `Get-StorageDiagnosticInfo` with the `-IncludeLiveDump` parameter. This will provide insight into when and by whom the command was executed.
  - **Correlate with User Privileges**: Investigate the user accounts executing the command to determine if they had the necessary privileges and whether their actions are in line with legitimate administrative tasks.
  - **Analyze Process Creation Events**: Look for processes spawned by PowerShell during the time of the command execution. Cross-reference these processes with known legitimate administrative processes to identify any discrepancies.
  - **Check for Related Network Activity**: Monitor for any suspicious outbound connections or unusual data transmissions that may indicate an attacker exfiltrating memory contents or attempting to establish persistence.

  ### Prioritization
  Given that the execution of a live memory dump can facilitate credential theft and other forms of sensitive data extraction, this alert carries a high severity level. The potential impact on the organization can be significant, as it may lead to the compromise of sensitive systems and data if left unchecked.

  ### Blind Spots and Assumptions
  This detection rule assumes that PowerShell script block logging is enabled and generating logs, which may not be the case in all environments. If logging is disabled, this detection capability will be ineffective. Additionally, the rule may not capture legitimate diagnostic usage if the command is invoked by trusted administrative users under appropriate contexts, potentially resulting in false positives. Organizations should ensure their logging configurations are comprehensive to cover all necessary telemetry for effective detection of this activity.

