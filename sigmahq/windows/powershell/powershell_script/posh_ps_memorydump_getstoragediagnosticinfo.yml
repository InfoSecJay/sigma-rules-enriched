note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell to execute the `Get-StorageDiagnosticInfo` command with the `-IncludeLiveDump` parameter, which is indicative of an attempt to obtain a live memory dump of a Windows machine. The likely attacker objective behind this behavior is credential access, as capturing memory dumps can expose sensitive data, including passwords and session tokens. This activity is associated with the MITRE ATT&CK technique "Memory Dumping" (T1003).

  The primary telemetry source for this detection is PowerShell logs, specifically those that capture script block execution details. This behavior poses a significant security impact as it can lead directly to the exfiltration of sensitive information and may facilitate further compromise of the environment. Importantly, this detection does NOT confirm that malicious activity has occurred; it only indicates that a potential security incident is worthy of further investigation.

  ---

  ### Investigation Steps

  - **Verify PowerShell Logging Status**: Check if Script Block Logging is enabled on the affected system (Event ID 4104). If logging is disabled, this detection may not work effectively.

  - **Review PowerShell Events**: Examine PowerShell logs (Event ID 4103 and 4104) for instances of `Get-StorageDiagnosticInfo` with the `-IncludeLiveDump` parameter. Malicious activity is indicated if this command is run without valid context or in a non-administrative role.

  - **Assess User Account Context**: Investigate the account that executed the command; ensure it is a known, authorized user. Look for anomalies, such as administrative accounts executing this command in unusual hours.

  - **Identify Legitimate Use Cases**: Confirm if there are any scheduled tasks or monitored system maintenance activities leveraging this command. Legitimate use typically suggests prior knowledge or documentation regarding the activity.

  - **Correlate with Memory Dump Data**: Check for any subsequent file artifacts (e.g., `.dmp` files) on the system. Review locations such as `C:\Windows\Temp` or user profile directories that may imply unauthorized data extraction.

  - **Check for Related Attacks**: Investigate for any additional suspicious activities surrounding the time of the alert (e.g., unusual login activity, process injection, or application crashes) that might suggest a broader attack or escalation attempt.

  ---

  ### Prioritization

  This alert is of high severity given that the affected systems often contain sensitive information. The likelihood of malicious abuse is significant, considering that memory dumps are frequently weaponized in credential harvesting and post-exploitation scenarios. Immediate investigation is essential to prevent potential data breaches.

  ---

  ### Blind Spots and Assumptions

  Possible detection limitations include users with elevated privileges who might use similar commands for legitimate purposes. Reliable detection requires that Script Block Logging is appropriately configured on all relevant endpoints. Legitimate activities such as system diagnostics or troubleshooting tasks may trigger this alert. As a companion detection, monitoring other PowerShell commands related to system diagnostics or unauthorized changes can strengthen incident coverage.

