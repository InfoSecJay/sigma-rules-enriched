logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-StorageDiagnosticInfo'
    - '-IncludeLiveDump'
  condition: selection
falsepositives:
- Diagnostics
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's `Get-StorageDiagnosticInfo` command with the `-IncludeLiveDump` parameter, which is indicative of attempts to extract live memory data from a Windows machine. The likely attacker objective is to capture sensitive information, such as credentials or encryption keys, from the system memory, which could facilitate further unauthorized access or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic for Credential Access (T1003).

  The primary telemetry sources include PowerShell script block logging, which must be enabled for the detection to function, and Windows event logs, specifically Security Event ID 4104 for PowerShell scripts executed. If malicious, the impact may be severe, as it could lead to exposure of sensitive data. It is crucial to note that this detection does not confirm malicious intent on its own; legitimate administrative operations may also trigger this rule.

  ### Investigation Steps

  - **Review PowerShell event logs**: Check Windows Security Event ID 4104 for script blocks containing `Get-StorageDiagnosticInfo -IncludeLiveDump`. Look for unusual execution contexts or user accounts not typically associated with system diagnostics.

  - **Examine process creation logs**: Investigate Security Event ID 4688 for any suspicious parent processes that initiated the PowerShell command. Legitimate operations typically originate from admin accounts as part of system maintenance, not from non-admin users.

  - **Identify system context**: Determine if the execution occurred on sensitive systems (e.g., domain controllers, file servers). High-privileged systems should have stricter policies and monitoring around such commands.

  - **Cross-reference with memory dumps**: If any live memory dumps were created, verify their timestamps and contents, ensuring they align with authorized maintenance actions. Legitimate diagnostic activity would usually generate lesser frequency in related events.

  - **Validate user account activity**: Check for anomalous logins or privilege escalations from the user account that executed the command. Look for evidence of previous security incidents or access patterns that may corroborate malicious intent.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive data and its alignment with credential harvesting techniques. The likelihood of malicious use is significant, especially in a mature enterprise environment where attackers often seek to exploit memory for sensitive information. Such behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for Script Block Logging to be enabled; if not properly configured, legitimate administrative functions may bypass this detection. Potential evasion techniques include using alternative PowerShell commands or scheduled tasks to execute similar operations without directly invoking `Get-StorageDiagnosticInfo`. Moreover, legitimate diagnostic applications may also trigger this alert, emphasizing the need for careful investigation. Companion detections could involve monitoring for file creation events or exfiltration attempts on the affected systems.

