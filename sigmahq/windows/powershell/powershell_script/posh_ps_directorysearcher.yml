note: |
  ---

  ### Technical Context

  This detection rule identifies the use of PowerShell's `System.DirectoryServices.DirectorySearcher` class, which is utilized for enumerating domain computers within an Active Directory environment. The likely objective of an attacker leveraging this functionality is to gather information on the network structure and identify potential targets for further exploitation or lateral movement. This behavior relates to the MITRE ATT&CK framework under the tactic "Discovery" (ID: TA0007) and the technique "Enumeration of Domain Computers" (ID: T1018).

  The primary telemetry source is PowerShell scripting logs, specifically those captured via Script Block Logging. The detection indicates a potentially malicious activity if initiated without appropriate context or authorization to query the Active Directory. However, it is crucial to note that this detection does NOT confirm malicious intent by itself. Legitimate administrative or maintenance tasks may also invoke similar behavior.

  ---

  ### Investigation Steps

  - **Check PowerShell Script Block Logs:**
    Review Security Event ID 4104 to find detailed logs of executed PowerShell scripts. Focus on the presence of the keywords related to `System.DirectoryServices.DirectorySearcher`.

  - **Evaluate User Context:**
    Identify the user or service account that executed the command. Assess if the user typically has a legitimate need to run queries against Active Directory. Compare against known user baselines.

  - **Identify Legitimate Administrative Activities:**
    Determine whether similar queries have been executed recently by trusted administrators or service accounts. Established routines for domain health checks may explain expected behaviors.

  - **Review for Malicious Patterns:**
    Look for common threat actor indicators like unusual PowerShell command patterns, particularly those used in enumeration or scanning, e.g., untrusted accounts attempting to gather information about machines in the domain.

  - **Analyze Affected Systems’ Roles:**
    Check the impact of the systems involved. Systems that are critical for operations (e.g., domain controllers) should be prioritized for deeper inspection.

  - **Cross-Reference Other Activity Logs:**
    Inspect correlated logs (e.g., Event ID 4624 for logon events) to ascertain if any suspicious or abnormal access patterns coincide with the script execution.

  ---

  ### Prioritization

  This alert has medium severity as the detection involves a potential reconnaissance activity within a domain. While the impact of malicious exploitation could lead to further attacks, querying Active Directory is a common practice that may not indicate immediate risk. However, if this query is associated with unusual accounts or timings, it heightens the need for further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of PowerShell logging. If Script Block Logging is not enabled, attempts to run similar commands may go undetected. Legitimate administrative tools or scripted tasks may trigger this alert, warranting further context evaluation. A companion detection such as monitoring for LDAP queries or unusual authentication events can enhance coverage and context to differentiate between benign and malicious attempts.

