note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands that create a DirectorySearcher object, which is typically employed to enumerate Active Directory (AD) information, specifically identifying computers joined to the domain. The likely attacker objective here is to gather reconnaissance data, potentially paving the way for privilege escalation or lateral movement within the network. The relevant MITRE ATT&CK framework tactics and techniques include Discovery (T1087) and Active Directory Enumeration (T1018).

  The primary telemetry sources required for this detection include PowerShell script block logs, specifically those that capture script execution details (Event ID 4104 for PowerShell). If utilized maliciously, successful enumeration may allow an adversary to identify potential targets for further exploitation. It is important to note that while this detection identifies the execution of methods typically associated with enumeration, it does not confirm whether the activity was part of authorized administrative tasks or an actual attack.

  ### Investigation Steps

  - **Review Script Block Logs**: Check PowerShell script block logs (Event ID 4104) for instances of 'New-Object System.DirectoryServices.DirectorySearcher' and related keywords. Focus on patterns of use; frequent or automated calls may indicate malicious intent.

  - **Examine User Context**: Investigate the user account associated with the PowerShell execution. Look for accounts that normally do not utilize these commands or have recent changes in privileges.

  - **Monitor Target Systems**: Verify if there are any legitimate administrative tasks scheduled that may produce similar logs, especially for IT personnel who utilize AD enumeration tools regularly.

  - **Identify High-Confidence Indicators**: Look for concurrent access to multiple AD objects shortly after the execution occurrence. This could indicate an automated enumeration attack rather than standard administrative practice.

  - **Analyze Network Activity**: Review network logs for any unusual outbound connections or traffic patterns following the PowerShell execution, particularly if it aligns with a known attack vector.

  ### Prioritization

  This alert should be considered medium severity since it involves querying Active Directory, which can lead to exposure of sensitive network information. While not inherently malicious, such activity warrants scrutiny due to its potential use in targeted attacks, particularly within environments that may already be compromised or under reconnaissance.

  ### Blind Spots and Assumptions

  This detection is limited by its reliance on enabled script block logging, which may not be consistently configured across all systems. Legitimate administrative actions may also trigger this alert, particularly during routine network maintenance or audits. A companion detection to enhance coverage involves monitoring for excessive query volumes related to Active Directory which could signal potential automated attacks, emphasizing that numerous queries in a short timeframe are more indicative of malicious activity.

