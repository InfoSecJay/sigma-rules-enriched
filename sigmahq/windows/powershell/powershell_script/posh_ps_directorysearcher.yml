note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's `DirectorySearcher` class to enumerate Active Directory (AD) computers. This behavior suggests an attacker is attempting to gather intelligence about the network by identifying all machines that are part of the domain, potentially to facilitate later lateral movement or exploitation. The relevant MITRE ATT&CK tactics are Discovery (TA0007) and Active Directory Enumeration (T1018).

  The primary telemetry source required for this detection is PowerShell script block logs, which capture the execution of scripts. The malicious use of this technique can lead to a significant security impact, such as unauthorized access or control over domain resources. However, it is important to note that the detection of this behavior does not confirm that an attacker has successfully exploited or compromised a system, nor does it reveal the intent behind the enumeration.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Search for PowerShell script block logs matching Event ID 4104. Focus specifically on entries containing `New-Object System.DirectoryServices.DirectorySearcher` to isolate potential malicious activity.

  - **Identify High-Confidence Malicious Indicators**: Check for script execution contexts. If the execution context is SYSTEM or a non-interactive account, consider this a strong indicator of suspicious activity.

  - **Correlate AD Enumeration with Other Events**: Investigate any simultaneous logins or failed logins from the same source IP or account that executed the PowerShell script. This can help identify whether the enumeration was part of a larger attack.

  - **Determine Legitimate Usage**: Identify if any known administrators or authorized users within the environment have conducted AD queries recently. Look for expected queries that are typical for maintenance or diagnosis, which involve `Get-ADComputer` cmdlet instead of `DirectorySearcher`.

  - **Analyze Impacted Hosts**: For the machines enumerated by the detected script, check for unusual account activity or system changes. High-value assets would require immediate attention.

  - **File Creation Validation**: If any results were exported by the script, verify the creation of files in the typical export paths (such as temp folders) with extensions like `.csv` or `.txt`, which may indicate data exfiltration attempts.

  ### Prioritization

  This alert should be considered medium severity. The potential impact on critical systems is high if enumeration leads to further exploitation. The likelihood of malicious use is notable due to the accessibility of AD enumeration techniques in common attack frameworks, making it a probable step in intrusion workflows.

  ### Blind Spots and Assumptions

  The detection is limited if script block logging is not enabled, which is a prerequisite for capturing the relevant events. Legitimate administrative activities, such as IT support routines, may trigger this alert. A related detection to strengthen coverage would be monitoring for abnormal user account activity in conjunction with this enumeration, enhancing the context around the alert.

