note: |
  ### Technical Context
  This rule detects the use of PowerShell scripts that leverage the `DirectorySearcher` class to enumerate domain computers within Active Directory. Attackers often attempt to gather information about the network environment, potentially to identify targets for further attacks, establish lateral movement pathways, or gather sensitive data. The use of `DirectorySearcher` can indicate reconnaissance behavior, and if leveraged by an unauthorized individual, it can pose significant risks to the integrity of the network.

  The key MITRE ATT&CK tactic related to this behavior is **Discovery**, specifically technique **T1018: Remote System Discovery**. This technique encompasses methods attackers use to gain information about systems that are accessible on the network, in this case focusing on assessing the organization’s Active Directory structure. The primary data source for this detection is PowerShell script block logs, which must be enabled to capture and analyze the script execution process for any suspicious commands.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Collect and examine PowerShell script block logs to identify any executions of scripts that include the `DirectorySearcher` class as described in the detection logic.
  - **Analyze User Context**: Verify whether the user account executing the script has legitimate access to perform such enumeration, and check for anomalies in user behavior or permissions.
  - **Check Active Directory Changes**: Investigate recent modifications or queries made to Active Directory that correspond with the timing of the alert, particularly for unusual account creations or attribute changes.
  - **Inspect Network Connectivity**: Look into any established network connections originating from the affected system, particularly those that may indicate unauthorized access to domain resources or external systems.

  ### Prioritization
  This alert is prioritized as medium severity due to its potential role in reconnaissance activities. While the technical use of the `DirectorySearcher` class may not indicate immediate harm, it provides attackers with critical information that could facilitate more sophisticated attacks against the enterprise environment.

  ### Blind Spots and Assumptions
  One gap in detection coverage might be the reliance on enabled script block logging, which is not commonly configured in all environments. The detection logic assumes that any legitimate use of `DirectorySearcher` is authorized and has sufficient justification. If logging is not configured or if PowerShell usage is overlooked, detection of this activity could be missed. Organizations may need to ensure that logging settings are aligned with security policies and that monitoring for unauthorized use of PowerShell is enforced adequately.

