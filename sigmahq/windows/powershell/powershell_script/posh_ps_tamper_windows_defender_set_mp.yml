logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_options_disabling_preference:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_options_disabling_function:
    ScriptBlockText|contains:
    - '-dbaf $true'
    - '-dbaf 1'
    - '-dbm $true'
    - '-dbm 1'
    - '-dips $true'
    - '-dips 1'
    - '-DisableArchiveScanning $true'
    - '-DisableArchiveScanning 1'
    - '-DisableBehaviorMonitoring $true'
    - '-DisableBehaviorMonitoring 1'
    - '-DisableBlockAtFirstSeen $true'
    - '-DisableBlockAtFirstSeen 1'
    - '-DisableCatchupFullScan $true'
    - '-DisableCatchupFullScan 1'
    - '-DisableCatchupQuickScan $true'
    - '-DisableCatchupQuickScan 1'
    - '-DisableIntrusionPreventionSystem $true'
    - '-DisableIntrusionPreventionSystem 1'
    - '-DisableIOAVProtection $true'
    - '-DisableIOAVProtection 1'
    - '-DisableRealtimeMonitoring $true'
    - '-DisableRealtimeMonitoring 1'
    - '-DisableRemovableDriveScanning $true'
    - '-DisableRemovableDriveScanning 1'
    - '-DisableScanningMappedNetworkDrivesForFullScan $true'
    - '-DisableScanningMappedNetworkDrivesForFullScan 1'
    - '-DisableScanningNetworkFiles $true'
    - '-DisableScanningNetworkFiles 1'
    - '-DisableScriptScanning $true'
    - '-DisableScriptScanning 1'
    - '-MAPSReporting $false'
    - '-MAPSReporting 0'
    - '-drdsc $true'
    - '-drdsc 1'
    - '-drtm $true'
    - '-drtm 1'
    - '-dscrptsc $true'
    - '-dscrptsc 1'
    - '-dsmndf $true'
    - '-dsmndf 1'
    - '-dsnf $true'
    - '-dsnf 1'
    - '-dss $true'
    - '-dss 1'
  selection_other_default_actions_allow:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_other_default_actions_func:
    ScriptBlockText|contains:
    - 'HighThreatDefaultAction Allow'
    - 'htdefac Allow'
    - 'LowThreatDefaultAction Allow'
    - 'ltdefac Allow'
    - 'ModerateThreatDefaultAction Allow'
    - 'mtdefac Allow'
    - 'SevereThreatDefaultAction Allow'
    - 'stdefac Allow'
  condition: all of selection_options_disabling_* or all of 
    selection_other_default_actions_*
falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for 
  troubleshooting purposes. Must be investigated.
level: high
note: |
  ### Technical Context

  This detection identifies attempts to disable or alter the operational settings of Windows Defender using PowerShell commands, specifically through the command Set-MpPreference. The likely objective is to weaken system defenses, thereby facilitating further malicious activities such as installing malware or maintaining persistence. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  Primary telemetry sources include PowerShell script logs (specifically, Script Block Logging), which must be enabled for effective detection. If malicious, the impact could lead to unmonitored system activity, allowing threats to execute undetected. This detection alone does not confirm a successful compromise but indicates potential malicious activities requiring further investigation.

  ### Investigation Steps

  - **Review PowerShell logs for alterations:** Check logs for Event ID 4103 or relevant entries indicating PowerShell script execution, particularly for entries containing 'Set-MpPreference' and the various flags mentioned in the detection. Compare against historical logs to identify anomalies.

  - **Examine command parameters for intent:** Investigate which parameters were used with Set-MpPreference; particularly look for parameters that disable critical functions (e.g., `-DisableRealtimeMonitoring $true`). These indicate an intent to weaken security measures.

  - **Identify context of PowerShell script execution:** Determine the user context and the machine from which the script was executed. Check for Event ID 4688 for process creation details, ensuring the script was not run by a trusted administrator for legitimate purposes.

  - **Validate against known benign PowerShell uses:** Compare the script against legitimate administration tasks to verify if it was part of regular maintenance activities (e.g., updating security configurations). Legitimate activity may involve clear documentation or structured change requests.

  - **Check for additional artifacts of compromise:** Look for signs of further compromise, such as unusual process behavior (Sysmon Event ID 1), unexpected file creations, or modifications in Windows Defender logs found in Event ID 5000, which could indicate successful evasion.

  ### Prioritization

  This alert is high severity due to the potential to disable critical system defenses on high-value assets, which may be targets for attackers. The techniques used to disable Windows Defender are commonly weaponized by adversaries to facilitate malware installation or persistence.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not properly configured or enabled. Adversaries might use obfuscation techniques to evade detection. Legitimate troubleshooting scripts might also trigger this alert. A related detection to consider is monitoring for new Windows services or scheduled tasks created shortly after a script execution, which could indicate further malicious activity.

