description: Detects PowerShell scripts attempting to disable scheduled scanning
  and other parts of Windows Defender ATP or set default actions to allow.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference?view=windowsserver2022-ps
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/
author: frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan
  Poudel, Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-16
modified: 2024-01-02
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_options_disabling_preference:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_options_disabling_function:
    ScriptBlockText|contains:
    - '-dbaf $true'
    - '-dbaf 1'
    - '-dbm $true'
    - '-dbm 1'
    - '-dips $true'
    - '-dips 1'
    - '-DisableArchiveScanning $true'
    - '-DisableArchiveScanning 1'
    - '-DisableBehaviorMonitoring $true'
    - '-DisableBehaviorMonitoring 1'
    - '-DisableBlockAtFirstSeen $true'
    - '-DisableBlockAtFirstSeen 1'
    - '-DisableCatchupFullScan $true'
    - '-DisableCatchupFullScan 1'
    - '-DisableCatchupQuickScan $true'
    - '-DisableCatchupQuickScan 1'
    - '-DisableIntrusionPreventionSystem $true'
    - '-DisableIntrusionPreventionSystem 1'
    - '-DisableIOAVProtection $true'
    - '-DisableIOAVProtection 1'
    - '-DisableRealtimeMonitoring $true'
    - '-DisableRealtimeMonitoring 1'
    - '-DisableRemovableDriveScanning $true'
    - '-DisableRemovableDriveScanning 1'
    - '-DisableScanningMappedNetworkDrivesForFullScan $true'
    - '-DisableScanningMappedNetworkDrivesForFullScan 1'
    - '-DisableScanningNetworkFiles $true'
    - '-DisableScanningNetworkFiles 1'
    - '-DisableScriptScanning $true'
    - '-DisableScriptScanning 1'
    - '-MAPSReporting $false'
    - '-MAPSReporting 0'
    - '-drdsc $true'
    - '-drdsc 1'
    - '-drtm $true'
    - '-drtm 1'
    - '-dscrptsc $true'
    - '-dscrptsc 1'
    - '-dsmndf $true'
    - '-dsmndf 1'
    - '-dsnf $true'
    - '-dsnf 1'
    - '-dss $true'
    - '-dss 1'
  selection_other_default_actions_allow:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_other_default_actions_func:
    ScriptBlockText|contains:
    - 'HighThreatDefaultAction Allow'
    - 'htdefac Allow'
    - 'LowThreatDefaultAction Allow'
    - 'ltdefac Allow'
    - 'ModerateThreatDefaultAction Allow'
    - 'mtdefac Allow'
    - 'SevereThreatDefaultAction Allow'
    - 'stdefac Allow'
  condition: all of selection_options_disabling_* or all of 
    selection_other_default_actions_*
falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for 
  troubleshooting purposes. Must be investigated.
level: high
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_tamper_windows_defender_set_mp/info.yml
note: |
  ### Technical Context

  This rule detects attempts to disable Windows Defender or alter its default actions using PowerShell commands, particularly the `Set-MpPreference` cmdlet. The likely attacker objective is to impair the effectiveness of endpoint protection, facilitating further malicious activity such as malware execution or lateral movement. This action aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Disabling Security Tools (T1562.001).

  The primary telemetry sources for this detection include PowerShell Script Block Logging, which captures detailed information about executed commands and their parameters. If malicious, this behavior could lead to a compromised environment, as it would allow malware to run unimpeded. However, it is crucial to note that this detection does NOT confirm that malicious activity has occurred, as legitimate uses exist for disabling Windows Defender.

  ### Investigation Steps

  - **Check PowerShell Execution Logs**: Review PowerShell logs (Event ID 4104 - PowerShell Script Block Logging) for instances of `Set-MpPreference` along with flags such as `-DisableRealtimeMonitoring` or `-dbaf $true`. Look for unusual user accounts executing these commands.

  - **Evaluate User Context**: Identify the user or service account associated with the detected command. Verify if the account belongs to an admin role or if it is unusual for this account to be executing such commands.

  - **Review Process Creation Events**: Validate the command's origin by checking Windows Security Event ID 4688 (Process Creation) to trace back to the parent process. Unusual parent processes (like `winlogon.exe` or `explorer.exe`) may indicate malicious activity.

  - **Investigate Context of Use**: Determine if the PowerShell invocation was part of regular maintenance or troubleshooting tasks. Legitimate scripts often include comments, logging, or other context explaining the command’s use, whereas malicious scripts may lack such details.

  - **Cross-check with Scheduled Tasks**: Check for any suspicious scheduled tasks (Task Scheduler logs) that may subsequently manipulate or disable Windows Defender settings without valid operational needs.

  - **Assess Environment for High Value Assets**: If the alert is triggered on a system designated as critical (e.g., domain controllers, sensitive data repositories), escalate for immediate advanced investigation and remediation.

  ### Prioritization

  The severity of this alert is high due to the potential impact on the security posture of enterprise systems. The likelihood of malicious abuse is significant, given that disabling protective measures is a common tactic used by adversaries during attacks. This behavior is frequently weaponized in exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques like using obfuscated PowerShell commands or executing scripts from external sources. Ensuring that Script Block Logging is enabled across all endpoints is critical for reliable detection. Legitimate activities such as troubleshooting within secure environments might also trigger these alerts. A related detection for investigating potential malicious behavior could include monitoring for process creation events associated with PowerShell or cross-examining in-memory activity (e.g., Windows Event ID 800 stages for unusual execution patterns).

