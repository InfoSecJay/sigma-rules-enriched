title: Tamper Windows Defender - ScriptBlockLogging
id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
related:
- id: ec19ebab-72dc-40e1-9728-4c0b805d722c
  type: derived
status: test
description: Detects PowerShell scripts attempting to disable scheduled scanning and
  other parts of Windows Defender ATP or set default actions to allow.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference?view=windowsserver2022-ps
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/
author: frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan Poudel,
  Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-16
modified: 2024-01-02
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_options_disabling_preference:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_options_disabling_function:
    ScriptBlockText|contains:
    - '-dbaf $true'
    - '-dbaf 1'
    - '-dbm $true'
    - '-dbm 1'
    - '-dips $true'
    - '-dips 1'
    - '-DisableArchiveScanning $true'
    - '-DisableArchiveScanning 1'
    - '-DisableBehaviorMonitoring $true'
    - '-DisableBehaviorMonitoring 1'
    - '-DisableBlockAtFirstSeen $true'
    - '-DisableBlockAtFirstSeen 1'
    - '-DisableCatchupFullScan $true'
    - '-DisableCatchupFullScan 1'
    - '-DisableCatchupQuickScan $true'
    - '-DisableCatchupQuickScan 1'
    - '-DisableIntrusionPreventionSystem $true'
    - '-DisableIntrusionPreventionSystem 1'
    - '-DisableIOAVProtection $true'
    - '-DisableIOAVProtection 1'
    - '-DisableRealtimeMonitoring $true'
    - '-DisableRealtimeMonitoring 1'
    - '-DisableRemovableDriveScanning $true'
    - '-DisableRemovableDriveScanning 1'
    - '-DisableScanningMappedNetworkDrivesForFullScan $true'
    - '-DisableScanningMappedNetworkDrivesForFullScan 1'
    - '-DisableScanningNetworkFiles $true'
    - '-DisableScanningNetworkFiles 1'
    - '-DisableScriptScanning $true'
    - '-DisableScriptScanning 1'
    - '-MAPSReporting $false'
    - '-MAPSReporting 0'
    - '-drdsc $true'
    - '-drdsc 1'
    - '-drtm $true'
    - '-drtm 1'
    - '-dscrptsc $true'
    - '-dscrptsc 1'
    - '-dsmndf $true'
    - '-dsmndf 1'
    - '-dsnf $true'
    - '-dsnf 1'
    - '-dss $true'
    - '-dss 1'
  selection_other_default_actions_allow:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_other_default_actions_func:
    ScriptBlockText|contains:
    - 'HighThreatDefaultAction Allow'
    - 'htdefac Allow'
    - 'LowThreatDefaultAction Allow'
    - 'ltdefac Allow'
    - 'ModerateThreatDefaultAction Allow'
    - 'mtdefac Allow'
    - 'SevereThreatDefaultAction Allow'
    - 'stdefac Allow'
  condition: all of selection_options_disabling_* or all of selection_other_default_actions_*
falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for troubleshooting
  purposes. Must be investigated.
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to tamper with Windows Defender's settings through PowerShell scripts. Specifically, it looks for scripted commands that disable or modify crucial features of Windows Defender, including real-time monitoring, scanning options, and default action settings. These modifications could lead to an increased risk of malware infections or exploitation by a malicious actor. The primary threat scenario involves attackers trying to disable security mechanisms to evade detection while deploying ransomware, trojans, or other malicious payloads.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562.001)**: Modifying Windows Defender configurations to avoid detection.

  To effectively detect this behavior, the primary data source is the Script Block Logging from Windows PowerShell, which captures any executed PowerShell script blocks and their contents.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check Script Block Logging logs for any instances of `Set-MpPreference` commands executed by non-administrative users or during unusual hours.
  - **Examine Related Processes**: Investigate the processes that executed these PowerShell commands to identify any potential malicious parent processes and their operational context.
  - **Correlate with Endpoint Alerts**: Look at EDR telemetry for alerts related to suspicious behaviors that might coincide with the times when tampering commands were issued.
  - **Collect Additional Context**: Gather system event logs around the identified PowerShell executions to understand if there were concurrent alerts for other activities, such as malware detections or privilege escalation attempts.

  ### Prioritization
  This alert is ranked high due to the significant security implications associated with tampering with Windows Defender. Disabling or modifying security settings can create a pathway for undetected malicious activities and potentially lead to major incidents like data breaches or system compromises.

  ### Blind Spots and Assumptions
  A major gap in detection coverage exists if Script Block Logging is not enabled on target machines, as this would prevent capturing the necessary PowerShell execution details. The detection logic assumes that the act of altering Windows Defender settings is malicious, without accounting for legitimate administrative or troubleshooting actions that may require similar commands. It also assumes that sufficient logging configurations are in place and that users have realistic behavior patterns, which may not hold true in all environments.

