title: Tamper Windows Defender - ScriptBlockLogging
id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
related:
- id: ec19ebab-72dc-40e1-9728-4c0b805d722c
  type: derived
status: test
description: Detects PowerShell scripts attempting to disable scheduled scanning
  and other parts of Windows Defender ATP or set default actions to allow.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference?view=windowsserver2022-ps
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/
author: frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan
  Poudel, Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-16
modified: 2024-01-02
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_options_disabling_preference:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_options_disabling_function:
    ScriptBlockText|contains:
    - '-dbaf $true'
    - '-dbaf 1'
    - '-dbm $true'
    - '-dbm 1'
    - '-dips $true'
    - '-dips 1'
    - '-DisableArchiveScanning $true'
    - '-DisableArchiveScanning 1'
    - '-DisableBehaviorMonitoring $true'
    - '-DisableBehaviorMonitoring 1'
    - '-DisableBlockAtFirstSeen $true'
    - '-DisableBlockAtFirstSeen 1'
    - '-DisableCatchupFullScan $true'
    - '-DisableCatchupFullScan 1'
    - '-DisableCatchupQuickScan $true'
    - '-DisableCatchupQuickScan 1'
    - '-DisableIntrusionPreventionSystem $true'
    - '-DisableIntrusionPreventionSystem 1'
    - '-DisableIOAVProtection $true'
    - '-DisableIOAVProtection 1'
    - '-DisableRealtimeMonitoring $true'
    - '-DisableRealtimeMonitoring 1'
    - '-DisableRemovableDriveScanning $true'
    - '-DisableRemovableDriveScanning 1'
    - '-DisableScanningMappedNetworkDrivesForFullScan $true'
    - '-DisableScanningMappedNetworkDrivesForFullScan 1'
    - '-DisableScanningNetworkFiles $true'
    - '-DisableScanningNetworkFiles 1'
    - '-DisableScriptScanning $true'
    - '-DisableScriptScanning 1'
    - '-MAPSReporting $false'
    - '-MAPSReporting 0'
    - '-drdsc $true'
    - '-drdsc 1'
    - '-drtm $true'
    - '-drtm 1'
    - '-dscrptsc $true'
    - '-dscrptsc 1'
    - '-dsmndf $true'
    - '-dsmndf 1'
    - '-dsnf $true'
    - '-dsnf 1'
    - '-dss $true'
    - '-dss 1'
  selection_other_default_actions_allow:
    ScriptBlockText|contains: 'Set-MpPreference'
  selection_other_default_actions_func:
    ScriptBlockText|contains:
    - 'HighThreatDefaultAction Allow'
    - 'htdefac Allow'
    - 'LowThreatDefaultAction Allow'
    - 'ltdefac Allow'
    - 'ModerateThreatDefaultAction Allow'
    - 'mtdefac Allow'
    - 'SevereThreatDefaultAction Allow'
    - 'stdefac Allow'
  condition: all of selection_options_disabling_* or all of 
    selection_other_default_actions_*
falsepositives:
- Legitimate PowerShell scripts that disable Windows Defender for 
  troubleshooting purposes. Must be investigated.
level: high
note: |
  ### Technical Context

  This rule detects PowerShell commands aimed at modifying Windows Defender's settings, specifically those that disable key components such as scheduled scanning, real-time monitoring, and various protective features. The likely attacker objective is to disable or bypass security controls to facilitate further malicious activities, such as executing malware without interference from antivirus software. This behavior aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion (T1562.001).

  Primary telemetry sources include PowerShell script block logging, which captures the `ScriptBlockText` events when actions like `Set-MpPreference` are executed. If these commands are indeed malicious, it could lead to significant security risks, such as unprotected systems vulnerable to attacks or malware infections. This detection does not confirm that the action is malicious on its own, as it may also be triggered by legitimate troubleshooting activities.

  ### Investigation Steps

  - **Review PowerShell Execution:** Check for relevant PowerShell script block logs (Event ID 4104) in Windows Event Viewer. Look for commands containing `Set-MpPreference` followed by parameters that disable Windows Defender features. Legitimate activities may include parameters specifically for troubleshooting purposes, such as `-DisableRealtimeMonitoring $true`.

  - **Analyze Source of Command:** Identify the user context and process initiating the PowerShell script using `Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational'; Id=4104}`. Confirm if the account executing this command has a history of legitimate administrative tasks or if it's unusual.

  - **Identify Malicious Indicators:** Focus on specific flagged options in the script block that indicate malicious intent, such as `-DisableRealtimeMonitoring $true` or `HighThreatDefaultAction Allow`. Cross-reference these parameters against known threat actor behaviors reported in threat intelligence feeds.

  - **Contextualize in Historical Data:** Verify if similar commands were executed previously. Look for patterns of PowerShell usage that might indicate persistent behavior. Utilize logs from `Sysmon` (Event ID 1) to correlate process creation with unusual PowerShell activity.

  - **Assess Asset Criticality:** Determine the role of the affected system within the organizational environment (e.g., domain controller, application server). Critical systems are likely targets for disabling security protections, heightening the urgency of the investigation.

  - **File Creation and Exfiltration Checks:** Monitor for any suspicious file creations or data exfiltration following the execution of the PowerShell commands. Utilize logs from file servers or endpoint security logs to detect any unusual file activities during or after the script execution.

  ### Prioritization

  This alert is high priority due to its impact on system security and the potential for exploitation. The likelihood of abuse is significant, as disabling security controls is commonly leveraged by adversaries during attacks. Activities to tamper with Windows Defender are frequently weaponized in various malware campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled on monitored endpoints. Attackers could bypass detection using methods like obfuscation or by executing the command from an already trusted process. Additionally, legitimate administrative tasks, such as executable installation or troubleshooting, may trigger alerts, necessitating context for proper assessment. Related detections may include monitoring for unusual script execution patterns or anomalies in Windows Management Instrumentation (WMI) queries, reinforcing coverage for defense evasion tactics.

