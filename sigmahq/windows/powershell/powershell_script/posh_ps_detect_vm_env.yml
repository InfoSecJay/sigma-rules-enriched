logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - Get-WmiObject
    - gwmi
  selection_module:
    ScriptBlockText|contains:
    - MSAcpi_ThermalZoneTemperature
    - Win32_ComputerSystem
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies PowerShell commands that may be employed by adversaries to query system properties indicative of a virtualized environment. The likely attacker objective is to evade detection mechanisms employed in security analysis environments, such as sandboxes. Relevant MITRE ATT&CK tactics include Discovery (TA0007) and the technique for detecting virtualization environments (T1497.001), where attackers seek to identify if their execution context is within a virtual machine to modify or terminate their activity accordingly.

  The primary telemetry sources required for this detection are PowerShell script logs, specifically those with Script Block Logging enabled capturing Command Text. If malicious, this behavior could allow an attacker to evade security mechanisms and maintain persistence without detection. Importantly, this detection does NOT confirm malicious intent on its own; it merely highlights a query that may be used for evasion.

  ### Investigation Steps

  - **Check PowerShell Script Block Logs**: Review PowerShell script block logs (Event ID 4104) for entries containing `PayLoad = "Get-WmiObject"` or `gwmi`. This command indicates an attempt to gather system information that may be used to evade detection.

  - **Examine Command Context**: Look for parent processes of PowerShell (Event ID 4688 for process creation) and check if there's a preceding process with low reputability, such as `cmd.exe` or `powershell.exe`, spawning in a suspicious manner.

  - **Validate WMI Calls**: Cross-reference the PowerShell execution logs with the associated outputs from WMI queries (e.g., `Win32_ComputerSystem`). Ensure the expected outputs (like virtualization state) align with organizational infrastructure and standards.

  - **Identify Similar Legitimate Activity**: Determine if legitimate administrative users are executing similar PowerShell commands. Routine environmental checks for VM status may produce similar log entries but are often accompanied by other admin activities around configuration management.

  - **Monitor for Evasion Artifacts**: Look for evidence of atypical file manipulations or scripts that could indicate a broader evasion effort (e.g., creation of temporary files containing the script). Check file creation times around suspicious events in the PowerShell logs to spot potential exfiltration attempts.

  ### Prioritization

  This alert should be considered medium severity due to the possible implications of a successful evasion tactic employed by an adversary. The likelihood of abuse is moderate, as detecting virtualization is a well-known method among threat actors seeking to bypass security mechanisms. This behavior is not commonly weaponized but may precede other tactics, amplifying its importance.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Script Block Logging or if users disable logging features to evade detection. Legitimate administrative tasks, like system health checks or performance monitoring scripts, may inadvertently trigger this alert. A related detection might be the monitoring of external WMI queries (Event ID 5858), which strengthens coverage against unauthorized data gathering attempts.

