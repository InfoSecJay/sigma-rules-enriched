logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - Get-WmiObject
    - gwmi
  selection_module:
    ScriptBlockText|contains:
    - MSAcpi_ThermalZoneTemperature
    - Win32_ComputerSystem
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell commands that query system information to identify the presence of a virtualization environment. Specifically, it looks for commands that retrieve WMI objects, such as `Get-WmiObject` queries against `Win32_ComputerSystem` and `MSAcpi_ThermalZoneTemperature`. The likely adversary objective is to determine whether they are operating within a virtualized environment, which is often used to thwart analysis by security tools. This behavior is mapped to the MITRE ATT&CK technique T1497.001 (Virtualization/Sandbox Evasion).

  The primary telemetry sources include Windows PowerShell script logs, which require Script Block Logging to be enabled. If successful, this detection could indicate an attempt to evade detection mechanisms, potentially allowing adversaries to proceed with malicious activities undetected. However, this rule does NOT confirm malicious activity by itself, as legitimate system tools or admins may use similar commands for valid reasons.

  ### Investigation Steps

  - **Review script execution context**: Check PowerShell Event ID 4104 (Script Block Logging) for `Get-WmiObject` and the specific WMI classes mentioned. Determine if the execution was triggered by an authorized user or a script with known benign purposes.

  - **Monitor for unusual execution patterns**: Investigate the command invocations for frequency and source, focusing on specific accounts or systems that invoke these alerts frequently compared to established baselines.

  - **Prioritize systems involved**: Identify the impacted systems and their roles within the network. If they are critical assets (e.g., domain controllers, databases), prioritize further investigation.

  - **Establish baseline of legitimate activities**: Document regular administrative activities using `Get-WmiObject` or similar commands for system inventory checks. Compare the alerting instance against documented workflow to assess legitimacy.

  - **Search for additional indicators**: Look for correlated alerts such as unexpected outbound connections (e.g., unknown devices querying public IPs) or other suspicious activity on the same host that could indicate broader malicious intent.

  - **Evaluate response actions**: If malicious indicators are confirmed, check for signs of lateral movement or further exploit attempts using relevant logs, such as Security Event ID 4624 (logon events) or Sysmon Event ID 10 (process access).

  ### Prioritization

  This alert has a medium severity due to the potential for adversaries to utilize this technique to evade detection, particularly in environments with current exploitation activity. The presence of this behavior in a sensitive system raises concerns about a more significant security threat, given that many attackers commonly exploit virtualization awareness to enhance their operational security.

  ### Blind Spots and Assumptions

  Evasion techniques could include the use of alternative commands or scripts that do not trigger this detection due to the absence of Script Block Logging. Additionally, the rule relies on a prerequisite configuration—if Script Block Logging is disabled, detection will not occur. Legitimate activities may include system admins conducting routine checks of system properties or inventory. Companion detection rules focusing on anomalous user behavior in conjunction with this rule can strengthen overall threat coverage, particularly those tooled for lateral movement assessments.

