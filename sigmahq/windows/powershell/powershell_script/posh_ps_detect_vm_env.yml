note: |
  ### Technical Context

  This Sigma rule detects PowerShell scripts that utilize WMI (Windows Management Instrumentation) queries to identify characteristics of the host system that may indicate whether it is running in a virtualized environment. The likely attacker objective is to evade detection and analysis by determining if their malicious activity is being executed in a sandbox or virtualization environment, which may trigger different execution paths or prevention mechanisms. This behavior relates to the MITRE ATT&CK tactic of Discovery (TA0007) and the technique T1497.001 (Virtualization/Sandbox Evasion).

  Primary telemetry sources include PowerShell script logs with a focus on Script Block Logging, specifically capturing relevant script execution commands and output. If this behavior is confirmed as malicious, it may indicate that an adversary is attempting to thwart detection efforts or manipulation of their malware based on the system environment. Importantly, this detection does NOT confirm that malicious activity has occurred; it only indicates an attempt to identify whether the environment is suitable for executing potentially harmful actions.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Check Windows Event ID 4104 for PowerShell script execution logs, focusing on entries containing 'Get-WmiObject', 'gwmi', 'MSAcpi_ThermalZoneTemperature', or 'Win32_ComputerSystem'.

  - **Identify Malicious Indicators:** Look for scripts that manipulate or branch logic specifically based on the results of WMI queries. Higher confidence in malicious intent is indicated if the script includes logic to alter behavior when virtualization artifacts are detected.

  - **Compare Against Known Legitimate Usage:** Ensure that the identified PowerShell commands (e.g., 'Get-WmiObject') are not part of expected administrative scripts typically executed by system admins or IT personnel. Common benign usage includes system health checks performed by authorized monitoring services.

  - **Check for Evasive Patterns:** Investigate for the presence of anti-detection techniques often associated with evasion, such as abnormal command sequences, obfuscation, or legitimate command chains interrupted by 'if' conditions checking for VM indicators.

  - **Assess Impact on Critical Assets:** Particularly prioritize warnings from high-value servers, such as Domain Controllers or sensitive web application servers; consider the potential impact of successful adversary actions on these hosts.

  - **Correlate with Other Alerts:** Cross-reference findings with other potential detections of suspicious PowerShell activity or known malware indicators in the environment to build a broader context around the event.

  ### Prioritization

  This alert has medium severity due to its indication of potential reconnaissance by adversaries targeting a virtualized environment. While the likelihood of malicious abuse could be moderate, evasion techniques are frequently employed in real-world attacks, making this behavior noteworthy. Prompt investigation is necessary to understand the broader implications on security posture and potential system compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations against obfuscation techniques or scripts explicitly designed to avoid triggering alerts. It relies on the assumption that Script Block Logging is enabled and configured accurately to capture relevant events. Legitimate administrative tools or scripts performing system diagnostics may also trigger this rule. A related detection to enhance coverage could involve monitoring for anomalous execution patterns of PowerShell scripts, especially those interacting with WMI or external URLs.

