title: Powershell Detect Virtualization Environment
id: d93129cd-1ee0-479f-bc03-ca6f129882e3
status: test
description: |
  Adversaries may employ various system checks to detect and avoid virtualization and analysis environments.
  This may include changing behaviors based on the results of checks for the presence of artifacts indicative of a virtual machine environment (VME) or sandbox
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1497.001/T1497.001.md
- https://techgenix.com/malicious-powershell-scripts-evade-detection/
author: frack113, Duc.Le-GTSC
date: 2021-08-03
modified: 2022-03-03
tags:
- attack.discovery
- attack.defense-evasion
- attack.t1497.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_action:
    ScriptBlockText|contains:
    - Get-WmiObject
    - gwmi
  selection_module:
    ScriptBlockText|contains:
    - MSAcpi_ThermalZoneTemperature
    - Win32_ComputerSystem
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential attempts by adversaries to evade detection within virtualized or sandbox environments by using PowerShell. These actions may involve checking for specific indicators that reveal the presence of a virtual machine or an analytical sandbox. Such checks enable attackers to alter their behavior to bypass security measures and ensure that their malicious actions remain undetected.

  The primary objective of these tactics is often to maintain persistence in a target environment while avoiding automated security technologies. Attacks may involve lateral movement, reconnaissance, or privilege escalation that can lead to a significant breach. The associated MITRE ATT&CK tactics are **Discovery** (T1087) - for queries that enumerate system details, and **Defense Evasion** (T1497.001) - for techniques to detect and evade virtualized analysis environments.

  Relevant data sources include PowerShell script block logs, which need to be properly configured and enabled to record detailed script execution information. This will assist in identifying unusual or suspicious script activities indicative of attempts to circumvent the protections provided in enterprise environments.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Analyze PowerShell script block logging for any instances of "Get-WmiObject," "gwmi," or references to "MSAcpi_ThermalZoneTemperature" or "Win32_ComputerSystem." These commands may indicate attempts to query the environment characteristics typical of virtual machines.

  - **Examine Process Creation Events**: Investigate related process creation logs for PowerShell executions that match the detected scripts. Look for unusual parent-child process relationships indicating execution patterns consistent with evasion techniques.

  - **Assess Environment Configurations**: Check the existence of specific virtual machine artifacts (e.g., VM tools, certain registry keys) that attackers may query. This could help determine if attackers are probing for analysis environments.

  - **Analyze Related Network Communications**: Review outbound network traffic logs for any connections made during or immediately following the PowerShell script execution. Unusual communication patterns may signify an attempted data exfiltration or command & control activity.

  ### Prioritization
  This alert is considered medium severity due to the implication that adversaries are proactively attempting to evade detection mechanisms. Given that successful evasion strategies could lead to significant breaches, it warrants timely investigation and appropriate response measures.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include environments where PowerShell script block logging is not enabled or where adversaries utilize alternative shell methods (e.g., cmd.exe) that are not covered by this rule. The detection logic assumes that PowerShell logging is properly configured and that the parameters included in the script block checks are comprehensive enough to identify relevant checks for virtualization environments. If any prerequisite log configurations are missing, detections may be ineffective.

