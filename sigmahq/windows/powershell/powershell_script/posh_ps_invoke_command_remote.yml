logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains|all:
    - 'invoke-command '
    - ' -ComputerName '
  condition: selection_cmdlet
falsepositives:
