note: |
  ### Technical Context

  This Sigma rule detects the use of the `Invoke-Command` cmdlet in PowerShell to execute commands remotely via Windows Remote Management (WinRM). Attackers may seek to gain control over remote systems using legitimate credentials, facilitating lateral movement within the network. This behavior maps to the MITRE ATT&CK tactic of Lateral Movement, specifically technique T1021.006 (Remote Services: WinRM).

  Primary telemetry sources include PowerShell logs with Script Block Logging enabled, capturing relevant information such as the `ScriptBlockText` field. If this behavior is confirmed to be malicious, it can lead to system compromise, unauthorized access to sensitive data, or lateral movement to other critical systems. It is essential to note that this detection does NOT confirm intent or confirms that malicious actions have occurred—just that the cmdlet was executed.

  ### Investigation Steps

  - **Review PowerShell Script Logs:** Examine logs for Security Event ID 4104 or relevant Sysmon Event ID 4104, focusing on `ScriptBlockText` containing the `Invoke-Command` cmdlet.

  - **Identify Remote Systems Targeted:** Look for instances where `-ComputerName` is specified, noting the remote host targeted. Legitimate use might show internal servers or known assets; suspicious entries may include unknown or high-value targets.

  - **Cross-reference User Accounts:** Check the account running the command against known user accounts. Investigate legitimate administrative users versus users with no remote access credentials, as this could indicate misuse.

  - **Assess Frequency and Patterns of Use:** Analyze the frequency of `Invoke-Command` executions from the source machine. Legitimate administrative scripts may run on a regular schedule; however, signs of anomalous usage patterns (e.g., after hours) could indicate malicious intent.

  - **Check for Subsequent Commands:** Follow up on any commands executed following the `Invoke-Command` to identify further actions taken by the adversary, such as file transfers or network recon activities. This can be done by reviewing logs for suspicious Windows Process Creation events (Event ID 4688).

  ### Prioritization

  The alert severity is medium. The affected systems are often critical to maintaining operations, and the likelihood of this behavior being malicious is significant due to its common use in lateral movement tactics. The use of valid credentials in `Invoke-Command` scenarios suggests a potential compromise and should be investigated promptly.

  ### Blind Spots and Assumptions

  This detection may be evaded if logging is improperly configured or if attackers utilize obfuscation techniques to hide their commands. Reliable detection requires Script Block Logging and potential modification of PowerShell execution policies. Legitimate administrative activities, such as authorized remote management tasks, may trigger this alert, necessitating context around user behavior. A related detection to consider is monitoring WinRM service activity or failed authentication attempts, which could further indicate suspicious lateral movement behaviors.

