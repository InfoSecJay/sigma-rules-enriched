level: medium
note: |
  ### Technical Context
  This rule detects the execution of PowerShell commands that utilize `Invoke-Command` to interact with remote systems via Windows Remote Management (WinRM). Adversaries may exploit valid accounts to execute commands on remote hosts, allowing them to perform actions as the authenticated user, potentially indicating lateral movement within the network. Attackers may aim to leverage the capabilities of `Invoke-Command` to deploy malware, establish persistence, or gather sensitive information from compromised systems.

  This activity is categorized under the MITRE ATT&CK framework as part of the Lateral Movement tactic, specifically under technique T1021.006 (Remote Services: WinRM). Detection of such commands is essential, as they often represent unauthorized access or misuse of administrative capabilities within the enterprise environment.

  The primary data sources for this detection rule include PowerShell script block logging, which records scripts executed in PowerShell, and may provide a comprehensive view of commands being run remotely, including any unauthorized activity that utilizes the `Invoke-Command` cmdlet.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Examine PowerShell logs to identify instances of `Invoke-Command` followed by `-ComputerName`. Pay attention to the context and the user accounts executing these commands.
  - **Analyze User Activity:** Correlate the user accounts associated with the detected commands to assess whether they are authorized. Investigate the last logon, session history, and any abnormal access patterns from these users.
  - **Check Remote Host Status:** Investigate the target remote hosts invoked by the `Invoke-Command`. Look for any signs of compromise or unusual behavior, such as unauthorized user accounts or modified configurations.
  - **Monitor for Anomalous Lateral Movement:** Establish a baseline of legitimate administrative activities using WinRM within your environment and identify any deviations from this baseline that could signal malicious activity.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized remote command execution on an enterprise's security posture, where adversaries can exploit valid credentials to gain additional access to sensitive resources.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to environments that do not have Script Block Logging enabled, which is currently a requirement for this rule. The detection logic assumes that any invocation of `Invoke-Command` indicates potentially malicious activity, but legitimate administrative scripts may also trigger alerts. Continuous monitoring and thorough analysis may be necessary to differentiate between permissible command executions and those indicative of an attack.

