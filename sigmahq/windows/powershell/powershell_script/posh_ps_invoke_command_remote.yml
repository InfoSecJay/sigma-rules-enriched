level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `Invoke-Command` cmdlet with the `-ComputerName` parameter in PowerShell, indicating remote command execution via Windows Remote Management (WinRM). The likely objective of an attacker utilizing this command is to remotely execute scripts or commands on a target machine while leveraging valid user credentials. This behavior falls under the MITRE ATT&CK tactic of Lateral Movement, specifically Technique T1021.006.

  The primary telemetry source for this detection is PowerShell logging, specifically Script Block Logging, requiring the monitoring of events where `Invoke-Command` is used. If malicious in nature, this action could compromise additional systems in the network, potentially leading to further exploitation or data loss. It’s important to note that this detection does not confirm malicious intent on its own, as legitimate administrative tasks can similarly invoke this cmdlet.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Check for Security Event ID 4104 that logs the use of `Invoke-Command`. Look for entries where `-ComputerName` is specified, indicating a remote execution attempt.

  - **Verify User Context:** Identify the user account associated with the PowerShell activity using fields such as `UserID` or `AccountName` in the logs. Confirm whether the user has legitimate administrative access or if the account exhibits suspicious behavior.

  - **Correlate with Active Directory Events:** Look for concurrent events in Active Directory (Event ID 4624) that may indicate the user logged in remotely around the same time. Anomalous login patterns can support or refute the likelihood of malicious activity.

  - **Assess Recent Change History:** Investigate any related changes made by the user across the network, looking for Event ID 4663 (access to an object) on critical assets, which might indicate unauthorized modifications.

  - **Monitor for Other Execution Patterns:** Review additional logs for other related PowerShell usage patterns that might indicate further lateral movement (e.g., usage of `Enter-PSSession` or other remote cmdlets) during the same timeframe.

  - **Identify Legitimate Use Cases:** Determine if similar PowerShell commands were issued by known trusted processes or scheduled tasks (e.g., backups, system updates) on the same host to distinguish between benign administrative tasks and potential misuse.

  ### Prioritization

  This alert is of medium severity. The impact can be significant if it involves a critical asset or sensitive data but has a moderated likelihood of malicious use if it originates from a trusted user account. The use of `Invoke-Command` is commonly weaponized by adversaries for lateral movement, warranting diligent investigation.

  ### Blind Spots and Assumptions

  Detection may miss instances where Script Block Logging is not enabled, allowing attacks to bypass monitoring. Legitimate administrative scripts can inadvertently trigger this alert, particularly in multi-user environments. A companion detection for Event ID 4624 can enhance visibility into user authentication patterns, providing better context for these alerts.

