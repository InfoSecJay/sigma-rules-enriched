logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    ScriptBlockText|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    ScriptBlockText|endswith: 'readtoend'
  condition: selection_4104
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell obfuscation techniques, specifically through the invocation of the `.NET` compression libraries. The behavior typically indicates an attacker attempting to encode or streamline malicious payloads to evade detection. The likely objective is to execute hidden commands or retrieve data covertly from a target system. Relevant MITRE ATT&CK techniques include Execution (T1059.001) via PowerShell and Defense Evasion (T1027) through obfuscation. The primary telemetry source is Windows PowerShell Script Block Logging (`ScriptBlockText`), which provides detailed output about executed commands. If identified as malicious, this activity could lead to system compromise, data exfiltration, or lateral movement within the network. However, this detection alone cannot confirm malicious intent without corroborating indicators of compromise or context about the execution environment.

  ### Investigation Steps

  - **Verify Script Block Logging is enabled**: Check if Script Block Logging is turned on by reviewing Group Policy settings or local auditing settings (`Event ID 4104` in PowerShell Operational Logs).

  - **Analyze Script Block Text**: Look for Script Block Text containing `new-object` and compress libraries (`System.IO.Compression.DeflateStream`, `System.IO.StreamReader`). This may indicate suspicious PowerShell usage.

  - **Identify benign PowerShell usage**: Review legitimate scripts that use the allowed commands (e.g., legitimate automation or data handling scripts) to identify expected behavior versus the alert-triggering obfuscation.

  - **Look for high-confidence malicious indicators**: Identify any executed commands or scripts that invoke external resources or contain base64-encoded content. These patterns often indicate an evasion attempt.

  - **Assess context and user behavior**: Evaluate the user context (e.g., service accounts vs. standard users) and system criticality. Executions by non-admin users in sensitive environments should raise higher concerns.

  - **Correlate with additional telemetry**: Check for anomalies in network traffic or event logs (like `Windows Event Log 4624` for logon events) corresponding to the execution times of the detected script for further threat hunting.

  ### Prioritization

  This alert is considered medium severity due to its potential impact, particularly if it occurs on critical systems or servers exposed to sensitive data. The likelihood of malicious actors leveraging such obfuscation techniques is significant, as they often seek to evade detection and maintain a foothold in the environment.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative obfuscation methods or encoding techniques not captured in the rule. It's crucial to ensure that PowerShell logging features are properly configured in advance for consistent coverage. Legitimate activities, such as software installation scripts or documentation processing, may also generate this alert. Companion detection, such as monitoring for unusual outbound connections or looking for suspicious DLL loading, can enhance overall visibility into potential threats.

