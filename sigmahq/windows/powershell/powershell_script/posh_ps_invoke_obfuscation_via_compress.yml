logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    ScriptBlockText|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    ScriptBlockText|endswith: 'readtoend'
  condition: selection_4104
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell scripts employing compression techniques to obscure their true intent. The likely objective of the attacker is to execute malicious payloads or commands while evading detection by security systems. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562) and Execution (T1059.001).

  Primary telemetry sources include PowerShell Script Block Logs, specifically Security Event ID 4104. If malicious, this behavior could lead to system compromise, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate scripts may also exhibit similar characteristics.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs**: Check Security Event ID 4104 for any script blocks containing 'new-object' and 'system.io.compression.deflatestream'. Benign scripts may not exhibit multiple obfuscation techniques and should ideally perform standard operations.

  - **Analyze system processes**: Investigate processes spawned by PowerShell at the time of the alert, particularly focusing on any parent processes like `powershell.exe`. Look for unusual process trees or commands that deviate from normal usage patterns.

  - **Correlate with network logs**: Examine any associated network connection logs (e.g., Windows Firewall or proxy logs) for outbound connections initiated by PowerShell processes. Malicious commands may attempt to communicate with known C2 servers.

  - **Verify execution context**: Identify the user account that executed the PowerShell script. Examine the user's previous login activity via Security Event ID 4624 and check for any signs of account compromise or unusual behavior patterns.

  - **Inspect for file activity**: Review file creation or modification logs in relevant directories, focusing on files created or altered as a result of the obfuscated PowerShell script. Look for signs of scripting or batch files that may have been created as payloads.

  ### Prioritization

  This alert is of medium severity due to the potential impact of the affected PowerShell execution on the enterprise environment. The use of obfuscation techniques is commonly employed by attackers to evade detection, making this a plausible indicator of malicious activity. Such behavior can be part of larger, weaponized campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement that PowerShell Script Block Logging is enabled; without it, relevant actions may go undetected. Legitimate administrative scripts or automation processes may trigger this alert. A related detection to consider is the monitoring of command execution output, which can provide additional context for the activities initiated by the PowerShell script.

