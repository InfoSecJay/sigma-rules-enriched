logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    ScriptBlockText|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    ScriptBlockText|endswith: 'readtoend'
  condition: selection_4104
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of obfuscated PowerShell scripts that leverage the `COMPRESS OBFUSCATION` technique, which attackers may utilize to evade detection mechanisms. The detection logic focuses on script blocks containing certain keywords and patterns commonly associated with compressed data handling, such as `System.IO.Compression.DeflateStream` and `System.IO.StreamReader`. By employing obfuscation, attackers aim to hide the true intent of their scripts, typically in the context of executing malicious payloads or conducting further reconnaissance within the environment.

  The suspected threat behavior aligns with the MITRE ATT&CK tactics of **Defense Evasion** (T1203) through the use of obfuscation techniques (T1027) and **Execution** (T1059.001) related to PowerShell scripts. By analyzing the raw content of the script blocks, defenders can gain insights into potentially malicious activities that utilize native Windows scripting capabilities, which may facilitate unauthorized access or command-and-control operations.

  Primary data sources for effective detection include process creation events that log PowerShell execution details, as well as Windows event logs specifically focusing on PowerShell script block logging. Ensuring that script block logging is enabled is crucial for capturing the necessary telemetry to identify these obfuscation attempts accurately.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Examine Windows Event Log ID 4104 for script blocks that match the detection criteria. Focus on any scripts that contain `new-object`, `text.encoding]::ascii`, `system.io.compression.deflatestream`, or `system.io.streamreader`.

  - **Analyze Process Creation Events:** Correlate findings from PowerShell script logs with process creation events (log source: Windows Security). Look for unusual PowerShell executions initiated from non-standard locations or by unexpected users.

  - **Monitor Network Activity:** Inspect outbound network connections related to the detected PowerShell activity. Focus on unusual or unauthorized traffic patterns, especially connections to external IPs that could indicate C2 communication.

  - **Investigate User Actions:** Validate the context of the user executing the PowerShell script. Review user behavior to identify whether the execution aligns with standard operational tasks or if it appears anomalous.

  ### Prioritization
  Alerts generated by this rule should be classified with medium severity due to the potential for significant risk introduced by obfuscated PowerShell scripts. Such scripts may serve as precursors to larger attacks, making it essential to investigate promptly.

  ### Blind Spots and Assumptions
  This detection rule may not capture all obfuscated scripts, particularly if attackers utilize different obfuscation methods or entirely different PowerShell techniques. The detection logic assumes that the required logging configurations, specifically enabling PowerShell script block logging, are in place. Without this configuration, vital script content may remain unlogged, leading to gaps in detection coverage. Additionally, false positives may arise from legitimate administrative or development activities that employ similar PowerShell commands.

