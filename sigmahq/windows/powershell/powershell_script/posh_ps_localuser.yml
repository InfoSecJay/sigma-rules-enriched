title: Powershell LocalAccount Manipulation
id: 4fdc44df-bfe9-4fcc-b041-68f5a2d3031c
status: test
description: |
  Adversaries may manipulate accounts to maintain access to victim systems.
  Account manipulation may consist of any action that preserves adversary access to a compromised account, such as modifying credentials or permission groups
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1098/T1098.md#atomic-test-1---admin-account-manipulate
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.localaccounts/?view=powershell-5.1
author: frack113
date: 2021-12-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1098
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Disable-LocalUser'
    - 'Enable-LocalUser'
    - 'Get-LocalUser'
    - 'Set-LocalUser'
    - 'New-LocalUser'
    - 'Rename-LocalUser'
    - 'Remove-LocalUser'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_localuser/info.yml
note: |
  ### Technical Context

  This Sigma rule detects PowerShell commands related to local account manipulation, including enabling, disabling, creating, or removing local user accounts. These actions are often part of lateral movement or persistence strategies employed by attackers seeking to maintain access to compromised systems. Specific MITRE ATT&CK tactics and techniques relevant to this detection include Privilege Escalation (T1068) and Persistence (T1098). The primary telemetry sources are Windows PowerShell logs, specifically script block logs that capture executed PowerShell commands and actions. If these actions are malicious, they could allow an adversary to solidify their control over the system. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may trigger the same alerts.

  ### Investigation Steps

  - **Check PowerShell Script Block logging: Use Windows Event Log:** Review Event ID 4104 (PowerShell script block logging) for the execution of commands such as `Enable-LocalUser`, `Disable-LocalUser`, or `New-LocalUser`. The presence of unfamiliar scripts could indicate malicious behavior.

  - **Identify account changes in Local Users and Groups:** Utilize Event ID 4720 (User Account Created), Event ID 4722 (User Account Enabled), and Event ID 4725 (User Account Disabled) from Security logs to track changes to user accounts. Any changes to administrative accounts should be treated with suspicion.

  - **Review legitimate administration practices:** Confirm expected behavior by reviewing local account changes made by known administrators during recent maintenance windows. Compare timestamps to ensure activities align with authorized admin schedules.

  - **Flag suspicious account names or properties:** Look for unusual naming conventions in changed accounts or attributes in `Get-LocalUser` commands, such as accounts with randomized names or multiple failed login attempts, indicating potential adversarial activity.

  - **Analyze scheduled tasks for persistence:** Check for scheduled tasks that utilize modified local accounts. Review Task Scheduler logs for unexpected or unauthorized tasks that reference recently manipulated accounts.

  ### Prioritization

  This alert has medium severity primarily due to the potential impact on user access and the likelihood of misuse for persistence by adversaries. Local account manipulation is a common tactic among attackers to maintain access, particularly in environments where privilege escalation is easily achievable.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative tasks if PowerShell script block logging is improperly configured or disabled. Additionally, legitimate user account management events can trigger the rule, complicating the detection landscape. Organizations should ensure script block logging is enabled and consider companion detections like AD user modifications or unauthorized access attempts to strengthen coverage against abuse.

