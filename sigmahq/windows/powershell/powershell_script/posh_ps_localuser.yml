logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Disable-LocalUser'
    - 'Enable-LocalUser'
    - 'Get-LocalUser'
    - 'Set-LocalUser'
    - 'New-LocalUser'
    - 'Rename-LocalUser'
    - 'Remove-LocalUser'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the manipulation of local Windows user accounts via PowerShell, specifically through commands such as `Enable-LocalUser`, `Disable-LocalUser`, and `New-LocalUser`. The likely attacker objective is to maintain persistence on compromised systems by creating, modifying, or disabling user accounts, thereby facilitating future access. This activity aligns with the MITRE ATT&CK technique for "Local Account Manipulation" (T1098), which falls under the tactics of "Privilege Escalation" and "Persistence."

  The primary telemetry source is PowerShell Script Block Logging, which captures the execution of the specified commands. If malicious, this behavior could allow an adversary prolonged access, potentially leading to further compromise or lateral movement. It is crucial to note that this detection alone does not confirm malicious intent, as legitimate administrative actions can also trigger it.

  ### Investigation Steps

  - **Check PowerShell logs for flagged commands:** Review PowerShell Event ID 4104 logs for Script Block Text containing `Set-LocalUser` or other listed commands. Compare timestamps against administrative activities to identify abnormal commands.

  - **Identify atypical user account changes:** Cross-reference local user accounts using `Get-LocalUser` with the Windows Event ID 4720 (User Account Created) and 4726 (User Account Deleted) logs to find any suspicious or unexpected account modifications, especially on critical servers.

  - **Assess the execution context:** Validate whether the commands were executed by a legitimate administrative user account or a suspicious entity. System-level tasks or accounts, particularly on Domain Controllers or file servers, should have strict monitoring.

  - **Review for previous related activities:** Check for other PowerShell activity in Session Event IDs (such as ID 800) preceding account manipulation, to determine if this manipulation is part of a broader malicious play, such as initial access techniques.

  - **Monitor for expected legitimate behavior:** Legitimate administrative scripts may involve these commands but are often accompanied by clear documentation or tickets. Ensure the executed scripts are authorized and well-documented; lack of documentation can indicate malicious intent.

  - **Validate file creation or exfiltration artifacts:** Check for artifacts indicating user account data exfiltration or script files (Event ID 4656) that may confirm scripting activity if they correspond to the detected manipulation commands.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems and the likelihood of abuse by attackers looking to maintain access. Account manipulation is a common tactic employed in post-compromise scenarios, making it essential to investigate promptly.

  ### Blind Spots and Assumptions

  Detection relies on the assumption that Script Block Logging is enabled; without it, malicious behavior may go undetected. Legitimate administrative scripts could trigger this alert due to similar command usage. Companion detections for lateral movement or privilege escalation (such as monitoring for Failed Account Logon Events or unusual logon patterns) can improve detection coverage and context understanding.

