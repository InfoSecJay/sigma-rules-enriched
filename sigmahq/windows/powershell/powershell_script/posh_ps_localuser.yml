logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains:
    - 'Disable-LocalUser'
    - 'Enable-LocalUser'
    - 'Get-LocalUser'
    - 'Set-LocalUser'
    - 'New-LocalUser'
    - 'Rename-LocalUser'
    - 'Remove-LocalUser'
  condition: selection
falsepositives:
- Legitimate administrative script
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying malicious PowerShell activities related to local account manipulation on Windows systems. Attackers may manipulate local accounts to maintain persistence on compromised systems, which includes actions such as disabling user accounts, modifying account details, or creating new accounts altogether. The primary objective of such maneuvers is to establish sustained access and possibly escalate privileges within the target environment.

  The relevant MITRE ATT&CK tactics include **Persistence (T1547)** and **Privilege Escalation (T1055)**, particularly focusing on the technique of **Local Account Manipulation (T1098)**. This technique allows adversaries to manipulate local user accounts in order to persist on systems without detected logins, often leveraging PowerShell, which is a common target for exploitation due to its capabilities and administrative access.

  The primary data source for detecting this activity is PowerShell script block logging, which captures the commands that are executed in PowerShell sessions. This data will provide insights into any suspicious commands related to local account management such as `Disable-LocalUser`, `Enable-LocalUser`, and other account-related cmdlets.

  ### Investigation Steps
  - **Review PowerShell Script Logs**: Examine the PowerShell script block logs to identify any instances of account manipulation commands like `Set-LocalUser`, `Get-LocalUser`, and `New-LocalUser` executed in suspicious contexts.

  - **Analyze User Account Activity**: Cross-reference the identified PowerShell commands with local and domain user account changes in the security event logs (e.g., Event IDs 4720, 4722, 4723, 4724, 4725) to determine if the changes align with legitimate administrative actions.

  - **Check Administrative Access Patterns**: Investigate the context in which these commands were executed, including the user accounts that initiated them, to ascertain whether there may have been unauthorized use of elevated privileges.

  - **Examine Related Network Activity**: Look for related network activity that may suggest lateral movement or persistence, such as unusual logins, especially from accounts that were modified, and connections to remote management interfaces.

  ### Prioritization
  This alert is of medium severity due to the potential for significant impact on organizational security if attacker access is maintained. The likelihood of this detection correlating with malicious activities is moderate, given that legitimate administrative tasks can also trigger similar alerts.

  ### Blind Spots and Assumptions
  There may be blind spots in environments where PowerShell script block logging is not enabled, making it challenging to detect malicious behavior effectively. The detection logic assumes that any local account manipulation is inherently suspicious, which may lead to false positives from legitimate administrative activities. To ensure accurate alerts, PowerShell logging should be properly configured, and a thorough understanding of the organization's normal PowerShell usage patterns is essential.

