note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell to store files in an Alternate Data Stream (ADS), which is a method commonly exploited by the Astaroth malware among other potential threats. Attackers may utilize this technique to hide malicious payloads, utilizing the characteristics of ADS to evade detection by traditional security measures. By storing files in these streams, attackers can bypass standard file scans, making it harder for security controls to identify and react to malicious activity.

  The relevant MITRE ATT&CK techniques that apply to this detection include:
  - **Defense Evasion (T1564.004)**: Utilizing Alternate Data Streams allows attackers to obfuscate their actions and maintain persistence without attracting attention.

  The primary data sources for detecting this activity include PowerShell script block logging and file system monitoring logs. Effective detection relies on these sources because they can reveal unusual PowerShell command executions and file access patterns associated with the creation or manipulation of Alternate Data Streams.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell script block logs to identify any instances of the `Start-Process` command along with specific arguments that point to file operations and redirections involving ADS.
  - **Examine File System Access**: Investigate file system logs to highlight any unusual access patterns to files, paying particular attention to files known to leverage ADS. Look for any anomalies that might indicate hidden files.
  - **Check Process Executions**: Correlate the PowerShell commands with process creation logs to identify any parent-child relationships that may indicate lateral movement or privilege escalation attempts.
  - **Analyze Network Activity**: Monitor for outbound network connections around the time of the PowerShell execution that may indicate data exfiltration attempts or communications with command and control servers.

  ### Prioritization
  This alert is classified as medium severity due to the nature of the activity indicating potential evasion tactics commonly used by advanced persistent threats (APTs) like Astaroth. The likelihood of this behavior leading to unauthorized access or data breaches makes timely investigation critical.

  ### Blind Spots and Assumptions
  Detection may be limited by the requirement that PowerShell script block logging must be enabled, which, if not set up correctly, could lead to missed detections. Additionally, this detection relies on the assumption that any legitimate usage of ADS will be well-understood and documented; otherwise, benign activities could be mistakenly flagged. The coverage of this detection may also be hindered in environments that do not comprehensively log file system activity or PowerShell command executions.

