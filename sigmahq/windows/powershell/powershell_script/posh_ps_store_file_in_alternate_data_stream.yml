note: |
  ### Technical Context

  This Sigma rule detects the behavior of storing files in Alternate Data Streams (ADS) using PowerShell, a technique often employed by attackers like Astaroth malware to hide malicious files and evade detection. The likely objective behind this behavior is to obfuscate malicious activity and maintain persistence within a compromised system. Relevant MITRE ATT&CK tactics include Execution (TA0002) and a specific technique, T1564.004 (Hide Artifacts).

  The primary telemetry sources include Windows PowerShell script block logs, particularly those that capture Execution Events (with Script Block Logging enabled). If malicious, this behavior could facilitate data exfiltration or payload storage unnoticed in ADS. However, this detection does NOT confirm malicious intent by itself; legitimate applications may also use ADS for benign purposes.

  ### Investigation Steps

  - **Review script block logs:** Check PowerShell logs (Event ID 4104) for execution of Start-Process that writes to an Alternate Data Stream. Validate if the parameters include '-FilePath "$env:comspec"' and the '>' redirection operator.

  - **Identify benign activity:** Cross-reference the logged PowerShell command against known applications commonly using ADS, such as backup or archiving software, to determine if the behavior is expected or unusual.

  - **Correlate with system changes:** Examine other logs, like Security Event ID 4663, for file creation/access that correlates with the timestamps of the detected PowerShell command.

  - **Check for known malicious indicators:** Review for any recent creation of ADS that contains suspicious file hashes or associated network behavior across your firewall or proxy logs.

  - **Consider system criticality:** Evaluate the asset’s role within the environment (e.g., a domain controller versus a low-criticality endpoint) to assess potential impact and risk.

  ### Prioritization

  This alert should be considered medium severity due to the ability of storing malicious payloads in ADS to evade security measures. While the behavior can be malicious, it’s also common for various legitimate applications to utilize ADS, necessitating careful contextual investigation. Understanding the affected asset's importance enhances the prioritization of response actions.

  ### Blind Spots and Assumptions

  Detection may miss ADS usage if script block logging is not enabled, which is essential for this detection. Attackers could employ other legitimate PowerShell commands or tools that do not use ADS to hide malicious files. Legitimate activities, particularly from IT automation tools, may generate similar alerts. Correlating with companion detections, such as monitoring for unusual process creations (Event ID 4688), can further strengthen overall alert accuracy.

