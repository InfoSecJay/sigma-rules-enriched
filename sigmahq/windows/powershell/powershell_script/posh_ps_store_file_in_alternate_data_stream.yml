note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell to store files within Alternate Data Streams (ADS), a behavior reminiscent of tactics employed by certain malware, specifically Astaroth. The primary objective of an attacker using this technique may be to obfuscate malicious files, making them less visible to traditional detection mechanisms. This behavior corresponds to the MITRE ATT&CK technique for evading defenses (T1564.004: Hide Artifacts) within the broader tactic of Defense Evasion.

  The primary telemetry sources for this detection are Windows PowerShell logs, specifically those that capture script block logging, commonly referenced by the establishment of Event ID 4104 in the Windows Event Log. If malicious, this technique represents a significant security impact, as it can conceal malware from standard scanning tools and endpoint protections. However, this detection does NOT confirm that an attack has occurred by itself; it merely indicates that a PowerShell command was executed that matches certain criteria.

  ### Investigation Steps

  - **Review PowerShell script logs:** Investigate Windows Event ID 4104 for instances where the ScriptBlockText contains 'Start-Process', '-FilePath "$env:comspec"', and '-ArgumentList'. Identify if these scripts are initiated from a legitimate source.

  - **Analyze context of command execution:** Check the parent process of the PowerShell command in Event ID 4688 to determine if it was spawned by an expected application (such as a user-initiated command) versus something unusual (e.g., a scheduled task or service).

  - **Identify suspicious file creation:** Use file system monitoring tools to identify any new or modified files in Alternate Data Streams, specifically use PowerShell commands or Sysinternals tools like `streams.exe` to confirm the presence of hidden ADS data.

  - **Establish baseline for legitimate usage:** Confirm normal usage patterns of PowerShell scripts in your environment, particularly for processes involving legitimate applications that may use ADS for configuration or data storage without malicious intent.

  - **Correlate with other logs:** Check for additional suspicious activities related to this PowerShell execution, such as unusual network connections (via Windows Firewall logs, Event ID 5156) or unexpected user behavior captured in security logs (e.g., multiple failed logins).

  ### Prioritization

  This alert warrants medium priority in an enterprise context due to the potential for obfuscating malicious payloads. While the likelihood of malicious use is present, the impact is largely dependent on the context of affected systems and their criticality. Given that techniques to hide files are commonly weaponized in various attack scenarios, swift follow-up is recommended but should be weighed against the legitimacy of the detected PowerShell usage.

  ### Blind Spots and Assumptions

  Detection is limited if PowerShell script block logging is not enabled, which may lead to the inability to capture all relevant events. Additionally, legitimate system or application operations (such as software updates or network configurations) may also trigger this alert, complicating triage efforts. Related detections such as unexpected process creation via Event ID 4688 should be monitored concurrently to strengthen overall detection capabilities.

