note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell to store files in an Alternate Data Stream (ADS), a technique often associated with stealthy malware activities, such as those employed by Astaroth. The likely objective of an attacker is to conceal malicious payloads or sensitive data, making detection more difficult. This behavior correlates with the MITRE ATT&CK tactic "Defense Evasion" and the technique "Stored Data in Alternate Data Streams" (T1564.004).

  The primary telemetry sources for this detection include Windows PowerShell logs, specifically when Script Block Logging is enabled. Key log types to monitor are those that capture script commands and execution events. If this behavior is associated with malicious activity, there can be significant security impacts, including unauthorized data persistence and potential exfiltration. This detection does NOT confirm the malicious intent of the action on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check PowerShell logs for Event ID 4104 related to the execution of the Script Block that stores data in ADS. Look for any use of `Start-Process` with paths indicating file storage.

  - **Identify Expected Behavior:** Verify that legitimate applications or scripts are not utilizing similar PowerShell commands for benign purposes, such as local backups or software installations that may utilize ADS.

  - **Investigate Process Creation Events:** Cross-reference with Security Event ID 4688 to review any process creation corresponding to the PowerShell execution. Analyze the parent-child process relationships to assess the validity of the source process.

  - **Check for Unusual File Paths:** Look for suspicious file paths associated with the ADS creation, particularly those leading to system directories or user profiles that do not align with authorized applications.

  - **Search for Known Malicious Artifacts:** Utilize threat intelligence to check for any specific artifacts associated with Astaroth malware or similar strains that typically leverage ADS for data storage.

  - **Evaluate Asset Criticality:** Determine if the affected host holds critical data or has privileged access relating to sensitive environments, increasing the severity if malicious activity is confirmed.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of the affected system, particularly if it holds sensitive information or critical infrastructure. There is a reasonable likelihood that this behavior may be weaponized by adversaries to conduct stealthy operations, especially considering its association with known malware tactics.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate use of PowerShell for ADS, which may generate false positives if not contextualized. Without enabling Script Block Logging, significant telemetry for this detection could be missed. Common benign activities triggering this alert might include certain software installation processes. A companion detection such as monitoring for suspicious command line parameters in startup processes can strengthen coverage regarding initial access and execution behaviors.

