logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Get-AdComputer '
  selection_option:
    ScriptBlockText|contains:
    - '-Filter '
    - '-LDAPFilter '
    - '-Properties '
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the use of the `Get-AdComputer` PowerShell cmdlet, which is commonly employed to enumerate computer accounts and their properties within Active Directory (AD). An attacker might utilize this command to gather reconnaissance on the network environment, potentially identifying valuable targets for lateral movement or credential theft. The relevant MITRE ATT&CK tactics include Discovery (TA0007) and specific techniques like Active Directory Discovery (T1087.002) and Network Service Discovery (T1018).

  The primary telemetry sources for detecting this behavior are PowerShell script block logs, which must have script block logging enabled. If this behavior is indicative of malicious intent, it raises security concerns related to unauthorized access and potential compromise of sensitive information within the organization's Active Directory environment. Importantly, this detection alone does not prove malicious intent; benign administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Review PowerShell activity for suspicious context:** Check PowerShell logs for `ScriptBlockText` containing `Get-AdComputer` (Event ID 4104), and look for surrounding commands executed by the same user. Verify if the source user is an administrator or if the action aligns with expected administrative behavior.

  - **Correlate timestamps with user activity:** Cross-reference the time of the alert with user access logs (e.g., Security Event ID 4624 - Logon events) to identify if the user was legitimately accessing AD resources or if their activity seems out of the ordinary.

  - **Identify properties queried for anomalies:** Inspect any `-Filter`, `-LDAPFilter`, or `-Properties` parameters used with the `Get-AdComputer` command for overly broad queries or access to sensitive attributes. Monitor if there are any unexpected machines or attributes being accessed.

  - **Check for high-confidence malicious indicators:** Investigate if the `Get-AdComputer` cmdlet was used in conjunction with other commands known to be part of attackers' workflows (such as enumeration of user accounts or attempts to elevate privileges), using Event ID 4104 for related cmdlet execution.

  - **Establish a baseline of expected behavior:** Document the typical usage patterns of the `Get-AdComputer` cmdlet within your organization and identify legitimate users or automated scripts that frequently use this command to establish a baseline.

  - **Validate against lateral movement techniques:** If the alert correlates with unusual user accounts performing actions outside their normal scope, further investigate if these users are accessing other systems or performing lateral movement, using Event IDs 4648 (a logon attempt with explicit credentials) or any simultaneous access attempts.

  ### Prioritization

  The severity of this alert is low but requires attention. The affected systems' impact can be significant if administrative privileges are misused to gather intelligence for an attack. Although the likelihood of malicious abuse exists, this cmdlet is often used legitimately, reducing the overall urgency of the alert.

  ### Blind Spots and Assumptions

  This detection could miss scenarios where script block logging is not properly configured or if PowerShell logging is disabled. Attackers may use evasion techniques such as obfuscation or PowerShell alternatives to execute similar commands without triggering alerts. Moreover, legitimate administrative tasks may cause false positives. A related detection, such as monitoring `Get-ADUser` commands, could provide additional coverage and context for potential enumeration activities.

