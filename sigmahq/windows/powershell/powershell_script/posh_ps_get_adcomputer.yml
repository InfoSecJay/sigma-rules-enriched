title: Active Directory Computers Enumeration With Get-AdComputer
id: 36bed6b2-e9a0-4fff-beeb-413a92b86138
status: test
description: Detects usage of the "Get-AdComputer" to enumerate Computers or properties
  within Active Directory.
references:
- https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1018/T1018.md
- https://github.com/redcanaryco/atomic-red-team/blob/02cb591f75064ffe1e0df9ac3ed5972a2e491c97/atomics/T1087.002/T1087.002.md
author: frack113
date: 2022-03-17
modified: 2023-07-08
tags:
- attack.discovery
- attack.t1018
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Get-AdComputer '
  selection_option:
    ScriptBlockText|contains:
    - '-Filter '
    - '-LDAPFilter '
    - '-Properties '
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell cmdlet `Get-AdComputer`, which is commonly employed to enumerate computer accounts and their properties within Active Directory (AD). Attackers may leverage this cmdlet as part of their reconnaissance efforts, seeking to gather information about the enterprise environment, including available hosts, domain configurations, and user privileges. The primary objective of such activities is often to identify potential targets for further exploitation, lateral movement, or privilege escalation.

  Associated with the MITRE ATT&CK framework, this activity maps to the techniques of Discovery, specifically T1018 (Remote System Discovery) and T1087.002 (Account Discovery: AD Computer Discovery). By executing `Get-AdComputer`, attackers can gain insight into system configurations and security postures, which enhances their attack vectors.

  The most relevant telemetry for detecting this activity includes PowerShell script block logs, which capture executed commands and their parameters. Enabling script block logging is essential for this detection to be effective, as it is required to monitor and analyze the use of PowerShell within the environment accurately.

  ### Investigation Steps
  - **Review Script Block Logs:** Analyze PowerShell script block logs for instances where `Get-AdComputer` is invoked, particularly focusing on the presence of additional parameters like `-Filter`, `-LDAPFilter`, or `-Properties`.
  - **Correlate with User Context:** Cross-reference the executed commands with the initiating user accounts to determine if the usage is consistent with known administrative or automated behaviors.
  - **Check for Unusual Timing:** Investigate the time and frequency of the commands; anomalies such as execution during off-hours or in rapid succession could indicate malicious activity.
  - **Monitor for Lateral Movement:** Assess network logs for subsequent activity or connections that may arise from this discovery phase, looking for signs of lateral movement or exploitation attempts on other systems.

  ### Prioritization
  The alert is assigned a low severity due to the nature of the PowerShell cmdlet usage, which can also be a part of legitimate administrative workflows. However, given that it may indicate preliminary steps of broader malicious activities, it should be investigated in the context of overall user behavior and associated events.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of AD enumeration, particularly if attackers utilize alternative methods or obfuscate their PowerShell commands. Additionally, this rule assumes that script block logging is enabled and that the logs are being appropriately collected and analyzed. Environments that do not implement robust logging strategies may have gaps in visibility, potentially leading to undetected reconnaissance activities.

