note: |
  ### Technical Context

  This Sigma rule detects the obfuscated execution of PowerShell commands using `clip.exe`, which likely indicates an adversary's attempt to execute malicious payloads or scripts through creative means to bypass detection. The likely attacker objective is to leverage clipboard manipulation for data exfiltration or command execution while remaining under the radar. This attack behavior aligns with the MITRE ATT&CK framework, specifically under the tactics of Execution (T1203) and Defense Evasion (T1027).

  The primary telemetry sources for this detection include PowerShell Script Block Logging (Event ID 4104). Malicious execution of PowerShell commands via obfuscation could lead to significant security impacts, such as data breaches or unauthorized system control. However, it is important to note that this detection alone does not confirm malicious activity; a legitimate use of obfuscated commands may exist, particularly by system administrators or automated scripts.

  ### Investigation Steps

  - **Review PowerShell script block logs**: Look for Event ID 4104 in the Security logs that correlate with the timestamp of the alert. Pay particular attention to `ScriptBlockText` containing patterns such as `cmd.{0,5}(?:/c|/r).+clip(?:\.exe)?`.

  - **Correlate with user context**: Verify the user account associated with the PowerShell execution. Legitimate administrative tasks should align with known scheduled scripts or maintenance activities—ensure they correspond to expected workflows.

  - **Identify potential data exfiltration**: Investigate any additional indicators of data being sent out post-execution. Check for TCP connections to external IP addresses or unusual DNS queries in network logs that may signify data results being sent.

  - **Assess system role and criticality**: Identify the host's role (e.g., domain controller, endpoint) to gauge the security impact of the detection. Higher-criticality systems should be prioritized for deep dives given the elevated risk.

  - **Look for signs of obfuscation**: Investigate the PowerShell command structure for signs of deliberate obfuscation (e.g., encoding or use of aliases). Confirm whether the execution context is consistent with typical use cases for legitimate PowerShell operations.

  ### Prioritization

  This alert is of high severity due to its potential impact on sensitive systems, as malicious execution through obfuscation suggests a tactic commonly used by attackers. The likelihood of abuse is substantial given that PowerShell and clip.exe are frequent targets for evasion techniques. Such behavior is increasingly weaponized in contemporary threat landscapes.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate obfuscated PowerShell commands that could trigger this alert. Script Block Logging must be enabled for adequate detection, and incomplete log coverage may lead to false negatives. Additionally, automated or legitimate third-party applications may use similar methods without malicious intent, introducing noise into alerts. A companion detection to consider could be monitoring lateral movement indicators or external command-and-control callbacks, enhancing overall detection efficacy.

