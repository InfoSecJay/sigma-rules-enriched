note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that make requests for Kerberos tickets, specifically utilizing the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class. The detection is associated with adversary activity that targets the authentication mechanism to gain unauthorized access to resources, often seen in Kerberos ticket attacks such as Silver Ticket attacks. The relevant MITRE ATT&CK reference for this behavior is Credential Access (T1558.003).

  Primary telemetry sources include Windows PowerShell ScriptBlock logs, which must be enabled for effective detection. If this behavior is malicious, an attacker may obtain unauthorized access to services by impersonating legitimate users. Importantly, this detection does not confirm that a successful ticket grant has occurred, nor does it confirm malicious intent without additional context.

  ### Investigation Steps

  - **Review PowerShell ScriptBlock logs**: Check for Event ID 4104 indicating script execution involving 'System.IdentityModel.Tokens.KerberosRequestorSecurityToken'. High-confidence malicious indicators may show unusual or unexpected script execution times or origins.

  - **Correlate user identification**: Confirm the user account associated with the script execution. If the user is a known administrator and this behavior is expected in their role, it may indicate benign activity.

  - **Examine surrounding context**: Look for additional logs (e.g., Event ID 4624) that show authentication attempts or other PowerShell activities near the timestamp of the script execution, which could indicate whether this script execution correlates with known malicious patterns or user behaviors.

  - **Check for unusual Service Principal Names (SPNs)**: If the script outputs SPNs, analyze these against known services within your organization. Unexpected SPNs could indicate a ticket-granting attempt for unauthorized services.

  - **Validate ScriptBlock logging configuration**: Ensure that ScriptBlock logging is enabled in your environment. If it's not, you may lack visibility into similar future incidents.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on authentication and access controls. The likelihood of malicious activity is significant, given that Kerberos ticket exploitation techniques are commonly weaponized by attackers seeking unauthorized access to enterprise resources.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where PowerShell logging is not comprehensively configured or where attackers have disabled logging mechanisms. Legitimate administrative activities, such as authorized Kerberos ticket requests by legitimate users, may trigger this alert. A related detection to consider includes monitoring for failed Kerberos authentication attempts (MITRE ATT&CK ID TGT, TGS), which helps establish context for potential misuse of Kerberos tickets.

