note: |
  ### Technical Context

  This rule detects PowerShell scripts that request Kerberos tickets using the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class, which is often indicative of attempts to manipulate Kerberos authentication. The likely attacker objective is to obtain unauthorized access to services by creating forged tickets (silver tickets) or conducting lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique T1558.003 (Credential Access: Use of Kerberos Tickets).

  The primary telemetry source is Windows PowerShell script block logging, specifically looking for logs containing the string patterns associated with Kerberos ticket requests. If successful, the attacker could escalate privileges or gain unauthorized service access, leading to potential data breaches. Importantly, this detection does NOT confirm that an attack has occurred, as legitimate administration activities may also involve requesting service tickets.

  ### Investigation Steps

  - **Review PowerShell Script Block Logs:** Check for Event ID 4104 in the Windows Event Logs for PowerShell script block logging. Focus on logs that include the string `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` and `.GetRequest()`. Verify if the executing user and timestamp align with known good activities.

  - **Correlate User Actions:** Analyze the user associated with the alert against typical administrative activity. Identify if the user has a valid business rationale for executing Kerberos ticket requests. A legitimate action typically correlates with service account access or application authentication requests.

  - **Check Kerberos Ticket Granting Tickets (TGTs):** Use `klist` or Security Event ID 4769 to review recent Kerberos ticket requests. Note any unusual service principal names (SPNs) typically not associated with the user or session, which may indicate suspicious activity.

  - **Examine Process Creation Logs:** Review Sysmon Event ID 1 to identify the parent-child process relationships. Look for unusual PowerShell executions spawned from a non-administrative context, as this may indicate an external compromise.

  - **Investigate Network Traffic:** Capture and analyze network traffic that includes Kerberos authentication requests. Look for flows initiated from sources not normally expected to request service tickets, which could confirm compromised accounts attempting lateral movement.

  ### Prioritization

  This alert is high priority due to the potential for significant security impacts if Kerberos tickets are misused. The likelihood of malicious behavior is heightened by the specificity of the detected PowerShell commands, often employed in well-documented attacks against Active Directory environments.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled or if users are utilizing obfuscation techniques to hide their commands. Legitimate administrative activities, such as troubleshooting service access, may inadvertently trigger this alert. A companion detection rule for suspicious account logon behaviors (e.g., T1078.001 - Valid Accounts) can enhance coverage of potential credential abuses.

