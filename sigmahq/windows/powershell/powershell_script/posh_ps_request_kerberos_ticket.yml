note: |
  ### Technical Context

  This rule detects PowerShell scripts that make use of the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` to request Kerberos tickets. This behavior is indicative of potential Kerberoasting or silver ticket attacks, where an attacker aims to harvest sensitive credentials by targeting Service Principal Names (SPNs) within an Active Directory environment. The relevant MITRE ATT&CK tactic is Credential Access (Tactic: Credential Access, Technique: T1558.003).

  Primary telemetry sources include PowerShell Script Block Logging, which must be enabled to capture the relevant script execution data. The issuance of Kerberos tickets can lead to unauthorized access to sensitive resources, significantly impacting security if malicious. It is important to note that this detection alone does NOT confirm malicious activity; legitimate administrative script usage may generate similar events.

  ### Investigation Steps

  - **Review PowerShell Execution History:** Examine PowerShell's execution history (Event ID 4104) within the specified timeframe. Check for any instances of `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` and validate if the user is a known administrator or a flagged user within the organization.

  - **Inspect User Context:** Check the context and privileges of the user that executed the PowerShell script. Users with permissions to request Kerberos tickets should be strictly limited. Unrecognized or unusual user accounts executing such scripts may indicate a breach.

  - **Analyze Script Details:** Validate the full contents of the script using PowerShell logs (Event ID 4104). Look for parameters, comments, and other context to differentiate between legitimate security operations and potential exploitation attempts.

  - **Identify Artifact Creation:** Look for any file artifacts or cache entries where Kerberos tickets might be stored (e.g., in LSA) that correspond to the time of execution. Validate if known administrative accounts are generating ticket requests versus anomalous accounts not typically associated with such activity.

  - **Determine Legitimate Activity:** Cross-reference with known benign scripts that are used for Kerberos troubleshooting or administrative tasks. Consider typical administrative workflows that may involve ticket requests and validate their context with the user’s roles.

  - **Correlate with Other Alerts:** Investigate related alerts from similar detections (e.g., T1558.003 - Kerberoasting) to strengthen the case for investigation or escalate based on the volume or patterns of alert generations coinciding with the detected behavior.

  ### Prioritization

  The severity of this alert is high due to the critical nature of Kerberos authentication in securing Active Directory environments. The likelihood of malicious abuse is significant as this technique is frequently weaponized by adversaries conducting credential theft attacks. Affected systems, especially those hosting services exposed to internal accounts, should be prioritized for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for PowerShell Script Block Logging to be enabled; if not configured, relevant activities could go unnoticed. Legitimate activities, especially in troubleshooting scenarios, might trigger similar alerts, potentially leading to false positives. It is also essential to be aware that attackers may use obfuscation techniques to modify script contents to evade detection. A related detection to monitor is anomalous Kerberos Ticket Granting Service (TGS) requests, which could further corroborate malicious activity.

