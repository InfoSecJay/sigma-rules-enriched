logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'System.IdentityModel.Tokens.KerberosRequestorSecurityToken'
    - '.GetRequest()'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious activity related to Kerberos ticket requests made via PowerShell scripts, specifically targeting the use of the .NET Identity model for Kerberos. Attackers leveraging this technique may aim to perform Kerberos attacks, such as the creation of "silver tickets," which can then be used to gain unauthorized access to services within a network. The ultimate objective is often to escalate privileges or to move laterally within the environment by impersonating various services or users.

  This rule is relevant to the MITRE ATT&CK technique for Kerberos Ticket Granting Ticket (TGT) and Service Ticket exploitation (T1558.003). These tactics are commonly employed in credential theft scenarios where adversaries aim to manipulate Kerberos authentication processes to obtain access tokens necessary for unauthorized actions.

  Primary data sources for effective detection include PowerShell script block logs, which capture detailed information about executed scripts, particularly those that interact with credential management and Kerberos authentication.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Analyze the output of PowerShell script block logging for instances of commands invoking `System.IdentityModel.Tokens.KerberosRequestorSecurityToken`. Look for unusual patterns or inputs that suggest manipulation or unauthorized access attempts.

  - **Analyze Kerberos Ticket Requests:** Examine Kerberos event logs (especially Security logs with event ID 4768 and 4769) to correlate ticket requests with the identified PowerShell script activity. Identify the account making the request and any unusual Service Principal Names (SPNs) involved.

  - **Check for Privilege Escalation:** Investigate any changes in user or service account privileges that correlate with the timing of the alerts. This may involve reviewing group membership changes and access logs across critical systems.

  - **Correlate with Other Security Data:** Cross-reference findings with logs from your SIEM, EDR, or other logging solutions to identify additional indicators of compromise or lateral movement, such as unusual logins or file access patterns.

  ### Prioritization
  This alert is considered high priority due to the potential impact of successful Kerberos attacks, which can lead to significant compromise of sensitive data and systems. The likelihood of such attacks occurring in enterprise environments warrants immediate attention and investigation to mitigate risks.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if script block logging is not enabled on all relevant hosts, leading to potential missed detections. Additionally, the detection logic assumes that attackers will use the specified API functions within PowerShell, so tactics that deviate from this may go undetected. Organizations must ensure comprehensive logging configurations across endpoints to improve the coverage and efficacy of this rule.

