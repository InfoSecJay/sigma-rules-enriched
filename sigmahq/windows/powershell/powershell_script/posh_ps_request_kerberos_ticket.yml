  ---

  ### Technical Context

  This rule detects the use of PowerShell scripts requesting Kerberos tickets via the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class, which suggests possible Kerberos or silver ticket attacks. The likely attacker objective is to access unauthorized resources by forging service tickets. This behavior is related to the MITRE ATT&CK technique **T1558.003 - Use Alternate Authentication Material**.

  The primary telemetry sources include PowerShell script execution logs, specifically from PowerShell script block logging, which must be enabled. If this behavior is malicious, it can lead to unauthorized access to sensitive resources or compromise of domain accounts. Importantly, this detection does NOT confirm a successful ticket acquisition or that credentials have been stolen; it merely indicates the attempt to issue such requests.

  ---

  ### Investigation Steps

  - **Identify the script execution context**: Check for the PowerShell process (Event ID 4104) containing the `ScriptBlockText` for mentions of `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` followed by `.GetRequest()`. Look for execution within unexpected user contexts or from non-administrative accounts.

  - **Review ancillary logs for abnormal access patterns**: Examine Windows Security Event Log entries (Event ID 4769) for Kerberos Service Ticket (TGS) requests from the same user or machine related to the time of the script execution. Look for requests to unusual Service Principal Names (SPNs).

  - **Assess script block content for indicators of compromise**: Analyze the complete PowerShell script block for other suspicious commands or obfuscation techniques which may indicate malicious intent. Look for encoded commands or unusual parameters.

  - **Determine expected legitimate behavior**: Validate if the user or system running the script is typically involved with Kerberos ticket management. For instance, administrative functions such as service account maintenance or legitimate penetration testing may be valid.

  - **Verify for high-confidence malicious indicators**: Look for lateral movement and post-exploitation indicators such as NTLM hash requests in the network logs or unusual external connections post script execution. Events matching typical backdoor behavior should be reviewed.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for widespread access to sensitive information if Kerberos ticket requests are exploited. The likelihood of malicious abuse is significant, as tools facilitating such attacks are common amongst adversaries targeting enterprise environments.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include script obfuscation and the use of scheduled tasks to execute PowerShell commands in ways that may not trigger alerts. Reliable detection requires that PowerShell Script Block Logging be enabled across all systems. Legitimate activities like system administration tasks or security audits may inadvertently trigger this alert. As a companion detection, consider implementing monitoring of unusual Kerberos ticket-granting service (TGS) requests using Event ID 4769 to enhance contextual understanding of potential ticket abuse.

