title: Disable-WindowsOptionalFeature Command PowerShell
id: 99c4658d-2c5e-4d87-828d-7c066ca537c3
status: test
description: |
  Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5b67c9b141fa3918017f8fa44f2f88f0b1ecb9e1/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature?view=windowsserver2022-ps
author: frack113
date: 2022-09-10
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Disable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any important windows features
    ScriptBlockText|contains:
    - 'Windows-Defender-Gui'
    - 'Windows-Defender-Features'
    - 'Windows-Defender'
    - 'Windows-Defender-ApplicationGuard'
            # - 'Containers-DisposableClientVM' # Windows Sandbox
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Disable-WindowsOptionalFeature`, which can be employed by attackers to disable critical Windows features, including security components like Windows Defender. The likely attacker objective is to reduce the security posture of the system to facilitate further attacks, such as malware installation or lateral movement. This behavior aligns with the MITRE ATT&CK technique T1562.001 (Impair Defenses: Disable or Modify Tools).

  The primary telemetry source for this detection is Windows PowerShell script block logging, which captures PowerShell command executions in real-time. If malicious, the impact can be significant, leading to decreased protection against threats and allowing unauthorized access. This detection on its own does NOT confirm that an exploitation attempt is happening; it only indicates that a potentially malicious command was executed.

  ### Investigation Steps

  - **Review related PowerShell logs:**
    Check for Event ID 4104 (PowerShell Script Block Logging) in the Security event log to find specific occurrences of `Disable-WindowsOptionalFeature`. Determine if the command was run in an unusual context or by a non-administrative user.

  - **Identify the user context:**
    Use the corresponding Event ID to capture the UserID or session context of the executing process. Confirm whether the user has legitimate reasons for executing administrative commands, especially users who may not usually perform system modifications.

  - **Examine feature modifications:**
    Investigate any modifications to critical Windows features, specifically looking for the `Windows-Defender` entries in system logs. Confirm whether these changes are authorized and align with normal maintenance activities.

  - **Correlate with other security logs:**
    Look for concurrent alerts in Windows Event logs involving privilege escalations or other suspicious activities (e.g. Event ID 4672). Correlate timing and context to identify patterns indicative of malicious behavior.

  - **Legitimate use case confirmation:**
    Assess scheduled tasks or maintenance scripts that may use such commands legitimately. Confirm typical administrative activities, including remote management scenarios, that may account for the execution of `Disable-WindowsOptionalFeature`.

  - **High-confidence malicious indicators:**
    Watch for patterns such as repeated execution of the cmdlet in succession, especially with parameters that manipulate critical security features. Additionally, verify against known malicious IPs or hashes if output from the execution suggests malware installation attempts.

  ### Prioritization

  This alert is of high severity, as it indicates potential attempts to modify or disable critical security features. Given that the execution of this command is often weaponized to lower defenses, especially in environments where Windows Defender is a key safeguarding mechanism, the likelihood of malicious abuse is considerable.

  ### Blind Spots and Assumptions

  There are limitations to the detection; legitimate administrative tasks may cause false positives, particularly in environments regularly performing system audits or feature updates. Additionally, if PowerShell script block logging is not enabled, this detection will not trigger. Misconfigurations or benign commands relating to normal feature management may also invoke this alert. Companion detections worth monitoring include abnormal user behavior patterns and access attempts that utilize elevated privileges to reinforce context surrounding this alert.

