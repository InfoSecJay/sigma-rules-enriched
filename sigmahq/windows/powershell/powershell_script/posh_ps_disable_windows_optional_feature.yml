note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the PowerShell command `Disable-WindowsOptionalFeature`, which is employed to modify optional features in Windows. Attackers may utilize this command to disable security features such as Windows Defender, thereby facilitating further malicious activities in the environment. Relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and its sub-technique that deals specifically with disabling security features (T1562.001). The primary telemetry sources are PowerShell logs, specifically with Script Block Logging enabled, capturing any execution of the command and related parameters. If malicious, this behavior can lead to a significant security impact, primarily by weakening endpoint protections. However, this detection does NOT confirm the intent behind executing the command; legitimate administrative actions may trigger it.

  ---

  ### Investigation Steps

  - **Review PowerShell command execution:**
    Check PowerShell logs (Event ID 4104) for instances of the `Disable-WindowsOptionalFeature` command. Look for parameters such as `-Online` and `-FeatureName` to identify the specific actions attempted.

  - **Identify legitimate administrative actions:**
    Confirm whether the observed command stems from an authorized system administrator performing regular maintenance or feature updates. Typical benign features include `Windows-Defender` or `Windows-Defender-ApplicationGuard`, but ensure there's context for each execution.

  - **Search for associated security feature name:**
    Investigate further on any disabled features related to security (e.g., `Windows-Defender`, `Windows-Defender-Gui`) as these could indicate a malicious intent. The parameters used in the command can be extracted from the Script Block Text.

  - **Examine process lineage:**
    Validate the origin of the PowerShell process using Sysmon Event ID 4688 to trace back to the parent process. Legitimate executions typically originate from known administrative tools, whereas suspicious ones may come from arbitrary scripts or command lines without legitimate process histories.

  - **Collect potential exfiltration artifacts:**
    If the command execution coincides with other suspicious activities, such as unexpected file creations, check for related artifacts (e.g., Event ID 4663 for file access) that could indicate evidence of data exfiltration or further compromise.

  ---

  ### Prioritization

  This alert has a high severity due to its potential impact on critical systems, particularly defenses that could be disabled. The likelihood of malicious exploitation is moderate to high, given that disabling security features is a common tactic among adversaries. This behavior is not only weaponized but typically indicative of a broader compromise strategy.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block Logging, which is not enabled by default in all environments. Legitimate administrative activities, such as routine updates or maintenance operations, could also trigger this alert. A related detection to strengthen coverage would be monitoring for suspicious PowerShell obfuscation techniques, as these could be used to bypass detection and accompany feature-disablement commands.

