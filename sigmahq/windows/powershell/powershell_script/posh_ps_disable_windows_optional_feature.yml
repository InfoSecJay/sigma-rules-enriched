title: Disable-WindowsOptionalFeature Command PowerShell
id: 99c4658d-2c5e-4d87-828d-7c066ca537c3
status: test
description: |
  Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5b67c9b141fa3918017f8fa44f2f88f0b1ecb9e1/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature?view=windowsserver2022-ps
author: frack113
date: 2022-09-10
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Disable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any important windows features
    ScriptBlockText|contains:
    - 'Windows-Defender-Gui'
    - 'Windows-Defender-Features'
    - 'Windows-Defender'
    - 'Windows-Defender-ApplicationGuard'
            # - 'Containers-DisposableClientVM' # Windows Sandbox
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Disable-WindowsOptionalFeature`, which can be employed by attackers to disable critical Windows features, such as malware protection (e.g., Windows Defender). The likely objective of an adversary executing this command is to impair or disable security mechanisms on a target system, increasing the risk of persistence or data exfiltration. This behavior correlates with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and specifically the technique of "Impair Defenses" (T1562.001).

  Key telemetry sources include PowerShell script block logs (Event ID 4104) which provide detailed insight into executed commands. If malicious, this action could allow threats to operate undetected by disabling security features. However, it’s important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may involve disabling optional features.

  ### Investigation Steps

  - **Check PowerShell logs for the specific command execution**: Review security logs for Event ID 4104 to identify script block logs containing 'Disable-WindowsOptionalFeature' with parameters '-Online' and '-FeatureName'.

  - **Identify the context of the command**: Determine if the command was executed under a policy-compliant user account. Look for Event ID 4624 (Successful Logon) indicating the user context and ensure this aligns with authorized administrative actions.

  - **Analyze the features being disabled**: Particularly scrutinize attempts to disable security-related features, such as 'Windows-Defender-Gui' or 'Windows-Defender'. The presence of these features in the logs indicates potential malicious intent.

  - **Correlate with user agent and process creation events**: Look for correlating process creation events (Event ID 4688) around the same timestamp to see if unusual parent processes or command line arguments were used, indicating a suspicious context.

  - **Review Legitimate Administration Activities**: Determine if the alert was triggered by authorized maintenance or configuration changes, such as updates or feature testing, to affirm legitimate activity.

  - **Validate against known threat actor techniques**: Research any recent incidents or threat intelligence reports that mention the use of the `Disable-WindowsOptionalFeature` cmdlet as part of a broader exploitation campaign to assess real or suspected adversary workflows.

  ### Prioritization

  This alert is high-severity given that it directly relates to the disabling of security features that could significantly impair the defenses of critical systems. The likelihood of abuse is high since attackers typically target security measures for successful operation and persistence. The behavior is also commonly weaponized in sophisticated attacks aiming to evade detection.

  ### Blind Spots and Assumptions

  Detection is limited by the need for script block logging to be enabled; if not set, this alert will not trigger. Adversaries may utilize obfuscation techniques or invoke PowerShell in a way that does not leverage this cmdlet directly, potentially bypassing detection. Legitimate activities such as system maintenance or IT operations could inadvertently generate alerts. Complementary detections, such as monitoring for suspicious process creation patterns (Event ID 4688), can provide additional coverage and context surrounding this potential threat.

