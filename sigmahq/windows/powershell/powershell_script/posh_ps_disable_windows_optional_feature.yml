title: Disable-WindowsOptionalFeature Command PowerShell
id: 99c4658d-2c5e-4d87-828d-7c066ca537c3
status: test
description: |
  Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5b67c9b141fa3918017f8fa44f2f88f0b1ecb9e1/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature?view=windowsserver2022-ps
author: frack113
date: 2022-09-10
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Disable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any important windows features
    ScriptBlockText|contains:
    - 'Windows-Defender-Gui'
    - 'Windows-Defender-Features'
    - 'Windows-Defender'
    - 'Windows-Defender-ApplicationGuard'
            # - 'Containers-DisposableClientVM' # Windows Sandbox
  condition: all of selection*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_disable_windows_optional_feature/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell command `Disable-WindowsOptionalFeature`, which is commonly utilized by attackers to disable critical Windows features, particularly security features like Windows Defender. The primary objective of this behavior is often to impair security controls to facilitate further malicious actions, such as malware installation or lateral movement. This activity aligns with the MITRE ATT&CK framework's tactic of Defense Evasion (TA0005) and the technique T1562.001 (Disable or Misuse Tools).

  The primary telemetry sources for this detection come from Windows PowerShell logs, specifically requiring Script Block Logging to be enabled. If malicious in nature, the impact includes the potential to disable key security defenses, increasing system vulnerability. This detection does NOT confirm that malicious activity has occurred without additional context or corroborative evidence.

  ### Investigation Steps

  - **Check PowerShell Logs:** Review PowerShell logs for Event ID 4104 containing ScriptBlockText with `Disable-WindowsOptionalFeature`, capturing the command context and any associated parameters.

  - **Evaluate the Target Feature:** Assess whether the disabled feature relates to critical security functionality, such as Windows Defender. Legitimate administrators may disable optional features, but disablement of security features without justification raises suspicion.

  - **Correlate with User Activity:** Investigate the account used to execute the command. Look for associated Event ID 4624 (Logon) and verify if the user has a history of administrative activities or if this reflects unusual behavior.

  - **Identify Recent Changes:** Check Change Management logs or documentations around system feature modifications. Unexpected disablement of features like `Windows-Defender` without prior notice could indicate malicious intent.

  - **Examine Lateral Movement Indicators:** Review for abnormal lateral movement behaviors post-disablement using Event ID 4688 (Process Creation) to identify potential follow-on techniques exploited by the adversary, such as running untrusted scripts.

  ### Prioritization

  The severity of this alert is high due to the potential impact on critical security systems being disabled, increasing the likelihood of malicious abuse. This command is commonly weaponized in attacks targeting endpoint defenses, making it a high-priority activity for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for Script Block Logging to be enabled; if disabled, this command would go unnoticed. Legitimate administrative actions may include disabling optional features, which could trigger false positives. A companion detection to strengthen coverage would be monitoring for execution of administrative PowerShell commands (e.g., `Get-WindowsFeature`) that may indicate preparation for further exploitation.

