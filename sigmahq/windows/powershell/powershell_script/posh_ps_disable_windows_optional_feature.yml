title: Disable-WindowsOptionalFeature Command PowerShell
id: 99c4658d-2c5e-4d87-828d-7c066ca537c3
status: test
description: |
  Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5b67c9b141fa3918017f8fa44f2f88f0b1ecb9e1/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature?view=windowsserver2022-ps
author: frack113
date: 2022-09-10
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmd:
    ScriptBlockText|contains|all:
    - 'Disable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any important windows features
    ScriptBlockText|contains:
    - 'Windows-Defender-Gui'
    - 'Windows-Defender-Features'
    - 'Windows-Defender'
    - 'Windows-Defender-ApplicationGuard'
            # - 'Containers-DisposableClientVM' # Windows Sandbox
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell cmdlet `Disable-WindowsOptionalFeature`, which allows users to modify Windows features and packages. Attackers may leverage this cmdlet to disable essential security features, such as Windows Defender, as part of a broader compromise to evade detection or facilitate lateral movement. By disabling native security components, an attacker can establish a foothold within a network without triggering standard defenses.

  In the context of MITRE ATT&CK, this behavior falls under the tactic of Defense Evasion, specifically technique T1562.001: "Disable or Modify Tools." The primary goal of an attacker utilizing this cmdlet is often to weaken the operating environment or remove protections that could alert security teams to the presence of malicious activity.

  Key data sources related to this detection include PowerShell script block logs, which capture the parameters used with the `Disable-WindowsOptionalFeature` cmdlet. It's crucial to ensure that Script Block Logging is enabled to collect the necessary telemetry for effective detection.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine the script block logs for any instances of the `Disable-WindowsOptionalFeature` cmdlet. Focus on the parameters used, especially those related to disabling security features.
  - **Correlate with Security Events**: Look for related security events in the Windows Event Log that coincide with the timing of the PowerShell execution. Investigate any alerts related to Windows Defender or other security tools being disabled.
  - **Analyze User Context**: Identify the user or service account that executed the cmdlet. Determine if the account had legitimate reasons to perform such actions or if it is associated with unauthorized access.
  - **Assess Environment Impact**: Evaluate the disabled features’ impact on the system and overall security posture. Investigate any potential vulnerabilities introduced by these changes and respond appropriately.

  ### Prioritization
  This alert should be considered high priority in an enterprise environment due to the potential for significant operational impacts. Disabling security features such as Windows Defender can lead to increased risk of malware infections and a higher likelihood of successful persistence strategies by attackers.

  ### Blind Spots and Assumptions
  One key gap in detection coverage may arise from environments where PowerShell logging is not enabled, leading to a lack of visibility into potentially malicious activity. The detection assumes that the use of `Disable-WindowsOptionalFeature` is indicative of malicious intent, which may not always be the case if used by legitimate administrative processes. Ensuring that Script Block Logging is properly configured and logs are retained is essential for this alert to function as intended.

