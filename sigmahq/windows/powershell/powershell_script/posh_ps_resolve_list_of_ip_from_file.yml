title: PowerShell Script With File Hostname Resolving Capabilities
id: fbc5e92f-3044-4e73-a5c6-1c4359b539de
status: test
description: Detects PowerShell scripts that have capabilities to read files, 
  loop through them and resolve DNS host entries.
references:
- https://www.fortypoundhead.com/showcontent.asp?artid=24022
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.exfiltration
- attack.t1020
logsource:
  product: windows
  category: ps_script
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-content '
    - 'foreach'
    - '[System.Net.Dns]::GetHostEntry'
    - 'Out-File'
  condition: selection
falsepositives:
- The same functionality can be implemented by admin scripts, correlate with 
  name and creator
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell scripts containing specific commands related to reading file contents and resolving DNS hostnames. It is indicative of behaviors often used by attackers to exfiltrate data or communicate with Command and Control (C2) servers, aligning with the attack stage of exfiltration. This activity relates to MITRE ATT&CK tactic "Exfiltration" (TA0010) and technique "Exfiltration Over Command and Control Channel" (T1020).

  The primary telemetry for detection comes from PowerShell logs, specifically PowerShell Script Block logging that captures the execution of commands. The malicious activity suggests the potential for unauthorized access to sensitive data. It is important to note that the presence of these commands alone does not confirm malicious intent, as legitimate administrative scripts may use similar functionalities.

  ### Investigation Steps

  - **Review PowerShell Command Execution Logs:** Pull PowerShell logs (Event ID 4104) to identify script execution details, focusing on the presence of the commands `Get-content`, `foreach`, `[System.Net.Dns]::GetHostEntry`, and `Out-File` together in the same script block.

  - **Correlate Script Creator and Context:** Investigate the creator and name of the PowerShell script. Document the context and purpose behind the script. Legitimate administrative scripts will typically have recognizable names and be created by IT staff or automated systems.

  - **Check for Unusual File Reads:** Identify any unusual files specified in the `Get-content` command. Look for sensitive or unexpected locations, such as user directories or documents that contain confidential data.

  - **Verify DNS Resolution Logs:** Inspect DNS logs for entries corresponding to the resolved hostnames within the PowerShell scripts. Look for suspicious or known malicious domains in the DNS request logs (e.g., Windows DNS Client events).

  - **Assess Environment and Asset Criticality:** Evaluate whether the PowerShell execution occurred on critical assets such as domain controllers, servers handling sensitive data, or endpoints associated with higher privilege users.

  - **Document any Exfiltration Indicators:** If the script shows signs of data being piped or redirected out (e.g., `Out-File` pointing to an external location), verify file transfer logs or check for unusual outbound network behavior.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risk of data exfiltration and the role of PowerShell in enterprise environments. The likelihood of extensible misuse is high, as such scripts can be weaponized by adversaries seeking to compromise sensitive data.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative scripts that perform similar functions, leading to potential false positives. Required logging includes PowerShell Script Block logging that must be enabled for effective detection. Legitimate administrative tasks may inadvertently trigger this alert, especially in environments where PowerShell is commonly used for script-based operations. Companion rules, such as those alerting on unusual outbound DNS requests, could enhance coverage.

