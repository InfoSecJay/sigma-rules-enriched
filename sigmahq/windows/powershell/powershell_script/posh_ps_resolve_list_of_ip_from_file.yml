title: PowerShell Script With File Hostname Resolving Capabilities
id: fbc5e92f-3044-4e73-a5c6-1c4359b539de
status: test
description: Detects PowerShell scripts that have capabilities to read files, loop
  through them and resolve DNS host entries.
references:
- https://www.fortypoundhead.com/showcontent.asp?artid=24022
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.exfiltration
- attack.t1020
logsource:
  product: windows
  category: ps_script
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Get-content '
    - 'foreach'
    - '[System.Net.Dns]::GetHostEntry'
    - 'Out-File'
  condition: selection
falsepositives:
- The same functionality can be implemented by admin scripts, correlate with name
  and creator
level: medium
note: |
  ### Technical Context
  This detection rule identifies PowerShell scripts that exhibit capabilities to read files, iterate through their content, and resolve DNS hostnames. Such behaviors could indicate potential malicious activity, especially in scenarios where attackers attempt to exfiltrate sensitive information. By leveraging PowerShell, adversaries may seek to manipulate or gather data that facilitates further exploitation or lateral movement within the network.

  The threat scenario might involve an attacker utilizing this PowerShell functionality to collect sensitive data from various sources and subsequently resolve hostnames associated with that data, which could indicate preparation for exfiltration or communication with command and control (C2) servers. The likely objective of the attacker may include gathering reconnaissance data, establishing persistence, or launching additional attacks against networked resources.

  Relevant MITRE ATT&CK tactics include:
  - **Exfiltration** (TA0010), specifically **Data from Information Repositories** (T1020).

  The primary data sources that will provide insights into this behavior are PowerShell script logs, specifically focusing on the execution of script blocks that contain keywords associated with file reading, looping, and DNS resolution.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate script execution logs to locate any instances of PowerShell commands that contain patterns such as 'Get-content', 'foreach', and '[System.Net.Dns]::GetHostEntry'.
  - **Analyze File Activity**: Look for unusual file access patterns or newly created files related to the identified script, especially those with names indicating potential data gathering.
  - **Inspect Network Connections**: Evaluate outbound DNS queries and connections made by the host following the script execution to identify any suspicious communications with external sites.
  - **Correlate with User Activity**: Compare the execution of the identified PowerShell script with user activities to assess whether it's part of legitimate administrative tasks or a potential indicator of compromise.

  ### Prioritization
  This alert is considered medium severity because the detected behavior can be part of legitimate administrative activities, but it also has the potential for misuse in data exfiltration and reconnaissance attacks. Prompt analysis is critical to distinguishing between benign and malicious actions.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if PowerShell logging is not enabled or if the scripts are executed in a context that doesn't produce logs captured by this detection. The logic assumes that the PowerShell script follows the defined structure and does not account for obfuscation techniques that attackers might apply. Additionally, the effectiveness of this detection heavily relies on comprehensive logging configurations, particularly for PowerShell script execution events, ensuring that all pertinent activities are logged for review.

