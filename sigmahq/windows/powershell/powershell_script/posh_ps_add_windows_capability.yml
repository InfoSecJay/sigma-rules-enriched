logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Add-WindowsCapability '
  selection_capa:
    ScriptBlockText|contains: '-Name OpenSSH.'     # For both "OpenSSH.Server" and "OpenSSH.Client"
  condition: all of selection_*
falsepositives:
- Legitimate usage of the capabilities by administrators or users. Add additional
  filters accordingly.
level: medium
note: |
  ### Technical Context
  This detection rule monitors the usage of the "Add-WindowsCapability" PowerShell cmdlet, which is used to add specific capabilities to Windows, such as the OpenSSH feature. By detecting this activity, we can identify potential attempts by attackers to enable additional tools or functionalities that could facilitate unauthorized access or lateral movement within the environment. Attackers may use the installation of capabilities like OpenSSH to create backdoors or secure channels for further exploitation.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically focusing on the technique **Command-Line Interface** (T1059) and **Windows Management Instrumentation** (T1047). Understanding these tactics can help responders recognize the broader implications of such commands being executed within their environments.

  Primary data sources for this detection include PowerShell script logs and Windows event logs (specifically, those related to PowerShell activity). Ensuring that Script Block Logging is enabled is crucial, as it captures the details of the commands being executed, including potentially malicious usages of the PowerShell cmdlets.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell script logs for instances of the "Add-WindowsCapability" cmdlet being invoked. Pay close attention to any parameters or context in which this command is executed.

  - **Identify Contextual Usage**: Investigate the user identity executing the command and correlate this with their role. Look for any anomalies, such as administrator accounts performing activities typically reserved for non-administrative users.

  - **Examine Associated Processes**: Analyze parent and child process relationships in process creation logs to track which processes spawned the PowerShell command. This can provide insight into whether standard administrative processes were involved or indicate possible malicious intent.

  - **Monitor Network Traffic**: If OpenSSH is installed, evaluate any SSH-related network traffic to identify unauthorized access attempts or connections to suspicious destinations, which may indicate a potential breach or exfiltration activity.

  ### Prioritization
  This alert warrants medium severity due to its potential implications for system integrity and security. The risk is elevated if the command is executed by unauthorized users, indicating a possible compromise of credentials or misuse of administrative privileges.

  ### Blind Spots and Assumptions
  There may be gaps in detection if Script Block Logging is not enabled or properly configured, as this would prevent capturing execution details of PowerShell scripts. The detection logic assumes that the presence of the "Add-WindowsCapability" cmdlet indicates malicious activity, which may not always be the case given legitimate administrative usages. Organizations must ensure sufficient logging configurations and context-aware filters to reduce false positives associated with this rule.

