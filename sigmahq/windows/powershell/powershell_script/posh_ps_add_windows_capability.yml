logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_cmdlet:
    ScriptBlockText|contains: 'Add-WindowsCapability '
  selection_capa:
    ScriptBlockText|contains: '-Name OpenSSH.'     # For both "OpenSSH.Server" and "OpenSSH.Client"
  condition: all of selection_*
falsepositives:
- Legitimate usage of the capabilities by administrators or users. Add 
  additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet "Add-WindowsCapability," specifically when it is used to add capabilities like "OpenSSH" on Windows systems. The likely attacker objective is to enable remote command execution capabilities, which could facilitate lateral movement or unauthorized access into the network. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique PowerShell (T1059.001).

  The primary telemetry source is Windows PowerShell script logs, particularly focusing on Script Block Logging, which should be enabled to capture the necessary details. If executed maliciously, adding capabilities like OpenSSH could provide an adversary with substantial access to systems, promoting further exploitation or data exfiltration. Importantly, this detection does not confirm malicious intent by itself; legitimate administrative activities may trigger the same rule.

  ### Investigation Steps

  - **Analyze Script Block Logs:** Review PowerShell Script Block logs (Event ID 4103) for the specific cmdlet execution. Look for instances of "Add-WindowsCapability" and any associated parameters to understand the context of the command.

  - **Identify User Context:** Determine the user account that executed the cmdlet. Check for accounts with administrative privileges in the logs (Event ID 4624) and any unusual associations (e.g., scripts running under system accounts).

  - **Inspect for Malicious Capabilities:** Cross-reference the capabilities being added (e.g., "OpenSSH.Server" or "OpenSSH.Client"). If these are present without known context or documentation, it may indicate malicious intent.

  - **Review Recent Administrative Changes:** Investigate if there are legitimate maintenance or upgrades associated with the "Add-WindowsCapability" command by checking change management logs or processes.

  - **Identify Infrastructure Impact:** Assess the affected systems' roles. If the cmdlet was executed on sensitive hosts (e.g., domain controllers, production servers), prioritize the investigation due to the potential impact.

  - **Validate Network Traffic:** Monitor for outbound connections using the newly added capabilities that point to unusual or unauthorized IP addresses or domains, indicating potential command and control communication.

  ### Prioritization

  This alert is of medium severity due to the potential security impact of enabling remote management capabilities like OpenSSH, especially on critical infrastructure. While such behavior can sometimes be associated with legitimate administrative tasks, the likelihood of malicious abuse, particularly by advanced adversaries, warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete PowerShell logging configurations; ensure Script Block Logging is enabled for reliable detection. Legitimate administrative actions may generate false positives, necessitating context-driven investigation. A related detection for monitoring SSH logins (e.g., Event ID 7000) could provide complementary insights into unauthorized access attempts following the capability addition.

