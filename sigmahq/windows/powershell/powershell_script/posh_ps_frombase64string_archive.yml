note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell scripts that use the `FromBase64String` method to decode Gzip archives. Attackers often employ this technique to obfuscate their malicious payloads, allowing them to execute harmful content directly in memory without writing it to disk, which can evade traditional signature-based detection mechanisms. The primary objective behind such behavior is to facilitate command and control (C2) communications or to execute additional payloads stealthily.

  Relevant MITRE ATT&CK tactics for this behavior include **Execution (TA0002)** and **Command and Control (TA0011)**. Specifically, it relates to the technique **PowerShell (T1086)** and its sub-technique **Encoded Command (T1059.001)**. Both reflect the use of PowerShell to execute encoded or obfuscated commands for malicious purposes.

  The primary data sources for this detection are PowerShell script block logs, which capture the command text of executed scripts, including any obfuscated or encoded commands that may indicate malicious activity.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Collect and examine logs with the `FromBase64String` call to identify any decoded content and context around its execution.
  - **Analyze Network Traffic:** Investigate outbound network connections initiated by the script to determine if there are any suspicious communications to known C2 servers or unusual destinations.
  - **Check Process Creation Logs:** Look for unusual parent-child relationships in process creation events that may indicate the execution of encoded scripts or payloads triggered by the PowerShell script.
  - **Validate Environment Configurations:** Ensure that security measures such as script block logging and execution policies are configured properly to minimize risk from PowerShell abuse.

  ### Prioritization
  The alert is prioritized as medium severity due to the potential for significant impact from the execution of malicious scripts, which may compromise systems or lead to data exfiltration. However, there is a possibility of legitimate administrative tasks generating false positives, which necessitates careful analysis.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on script block logging, which must be enabled for the rule to function; without this, malicious actions may go undetected. The detection logic assumes that any usage of `FromBase64String` within PowerShell scripts that decodes Gzip content is malicious, which may not always be the case if legitimate administrative scripts perform similar actions. Additional configurations may be necessary to ensure comprehensive monitoring, such as enhancing logging settings across the environment.

