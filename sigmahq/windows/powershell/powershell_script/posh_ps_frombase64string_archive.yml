note: |
  ### Technical Context

  This rule detects the usage of `FromBase64String` on a Gzip archive within PowerShell scripts, which indicates an attempt to decode a potentially malicious payload that is compressed. Attackers may use this technique to obfuscate malicious content before executing it directly in memory, thus evading traditional security measures. The relevant MITRE ATT&CK tactic is Command and Control, specifically the technique T1132.001 - "Application Layer Protocol."

  The primary telemetry sources for this detection include PowerShell script block logs, requiring that script block logging is enabled on Windows systems. If malicious, such activity could lead to unauthorized command execution or the deployment of payloads that compromise system integrity. Importantly, this detection does NOT confirm that the script was executed or that a successful compromise occurred; it merely indicates the use of a suspicious encoding method.

  ### Investigation Steps

  - **Verify PowerShell script execution: Verify the execution context of the detected script:** Check for Event ID 4104 in PowerShell logs for the complete script execution and context, including the user and execution policy applied.

  - **Analyze script content: Review the full content of the script including the parameters:** Determine if there are additional commands following the `FromBase64String` that suggest further malicious actions, such as executing a process with `Invoke-Expression` or `Start-Process`.

  - **Check for legitimate administrative use:** Identify if the script is associated with standard administrative tasks or applications commonly found within the environment, comparing the user and script path against known benign scripts.

  - **Identify high-confidence malicious indicators:** Look for common subsequent actions following the base64 decoding, such as `Invoke-WebRequest` calls for remote payloads, indicating potential persistence or data exfiltration attempts using Event ID 4104.

  - **Assess system impact:** Determine the criticality of the affected system. If the script was run on a high-value asset, such as domain controllers or sensitive data servers, prioritize the investigation.

  ### Prioritization

  This alert should be considered medium priority, as the behavior signals an intermediate stage of potential exploitation where encoded, malicious payloads may be leveraged for further actions. The scripts may be weaponized to establish a foothold or maintain persistence, depending on the target environment.

  ### Blind Spots and Assumptions

  Detection may be limited if script block logging is not enabled, allowing potential evasion of detection mechanisms. Legitimate administrative scripts that use base64 encoding for valid tasks may trigger the alert. A related detection could include monitoring for the execution of scripts that utilize `System.IO.Compression.GZipStream`, which further strengthens coverage of potential obfuscation tactics.

