note: |
  ### Technical Context

  This rule detects the use of `FromBase64String` to decode a Gzip archive within PowerShell scripts. This behavior is commonly associated with attackers who aim to load malicious content into memory without writing it to disk, evading traditional detection methods. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011) and the technique is "Pass-Thru/Execution of Malicious Scripts" (T1132.001). The primary telemetry source is PowerShell script block logging, which captures the contents of executed PowerShell scripts. If malicious, this activity could allow an attacker to deliver and execute payloads stealthily. This detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may also use similar functions.

  ### Investigation Steps

  - **Review PowerShell script block logs**: Check for Event ID 4104 in the Windows event logs under `Microsoft-Windows-PowerShell/Operational`. Look for scripts containing `FromBase64String`, `MemoryStream`, and starting with `H4sI`. Legitimate scripts may not include all these components.

  - **Analyze the decoded output**: If possible, extract and analyze the Gzip content from memory to verify its intentions. Malicious payloads often exhibit unusual behavior or contain known malware signatures.

  - **Cross-reference with known hashes**: Validate any decoded executable or file against threat intelligence for known malware hashes. A high-confidence malicious indicator would be a match against a current malware database.

  - **Identify the execution context**: Investigate the user context executing the PowerShell script. Administrative users running such scripts outside standard maintenance activities may indicate suspicious behavior.

  ### Prioritization

  This alert should be treated with medium severity. The affected systems are likely critical, as PowerShell is a common administrative tool. The likelihood of malicious abuse is significant due to the stealthy use of memory-based execution techniques that are frequently weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for script block logging to be enabled; if not configured, the detection may be blind to legitimate executions. Legitimate use cases include administrative tasks involving scripted Gzip file manipulations. A related detection could include monitoring for unusual PowerShell command sequences, which may reveal additional context or intentions behind the executed scripts.

