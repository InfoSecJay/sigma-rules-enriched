note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts that utilize WMI commands to delete Windows Volume Shadow Copies, specifically targeting `Win32_ShadowCopy`. The likely objective of an attacker using this technique is to hinder recovery efforts by removing backup copies, a common tactic employed by ransomware, including notable strains like Sodinokibi (REvil). This behavior is categorized under the MITRE ATT&CK tactic "Impact" (TA0040) and the technique "Data Destruction" (T1490).

  The primary telemetry source for this detection is PowerShell logging, specifically script block logging that captures the commands executed during PowerShell sessions. In the event of a successful malicious activity, the security impact could be severe, leading to data loss and disruption of business operations. It is crucial to note that this detection does NOT confirm that the activity is malicious on its own; legitimate administrative tasks may also perform similar actions.

  ### Investigation Steps

  - **Verify PowerShell script execution logs:** Check Windows Security Event ID 4104 for PowerShell script block logging, looking for execution of scripts containing commands like `Get-WmiObject` and `.Delete()`.
  - **Look for deletion actions:** Examine the same logs for script block text including 'Remove-WmiObject' or 'Remove-CimInstance', which are high-confidence indicators of suspicious activity.
  - **Assess activity context:** Identify the executing user account and associated host role. Normal administrative behavior may involve legitimate calls to create or manage shadow copies without deletion.
  - **Examine system state post-event:** Check for the absence of shadow copies via commands like `vssadmin list shadows`, ensuring no legitimate backups exist that could have been removed.
  - **Cross-reference with alert thresholds:** Validate the frequency and timing of the scripts execution in the context of the environment. Unusual activity, especially during off-hours or from uncommon user accounts, is suspect.
  - **Review threat intelligence:** Correlate any findings with threat intelligence sources or incident response data on recent ransomware activity targeting volume shadow copy deletion.

  ### Prioritization

  This alert should be treated with high severity due to the critical impact of shadow copy deletion on recovery capabilities. The likelihood of malicious abuse is elevated given the common use of this technique in ransomware incidents. This behavior is frequently weaponized, requiring immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness of PowerShell logging configurations; ensure script block logging is enabled for full coverage. Evasion techniques may include modifying PowerShell command syntax or utilizing encoded command execution methods. Legitimate administrative tasks, particularly system maintenance or backup verification processes, may unintentionally trigger this alert. A companion detection to strengthen coverage includes monitoring for unusual file deletion patterns in conjunction with shadow copy deletions.

