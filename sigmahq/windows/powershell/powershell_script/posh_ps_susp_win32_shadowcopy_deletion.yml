note: |
  ### Technical Context
  This detection rule identifies the deletion of Windows Volume Shadow Copies through PowerShell commands utilizing WMI (Windows Management Instrumentation). Attackers, especially ransomware operators like Sodinokibi (REvil), often employ this tactic to remove restore points, making it difficult for victims to recover their data after an encryption attack. By executing commands that delete these shadow copies, attackers can significantly hinder recovery efforts, increasing the pressure on victims to pay ransoms.

  The relevant MITRE ATT&CK tactics for this behavior include **Impact (TA0040)**, specifically the technique for **T1490: Inhibit System Recovery**. This technique encompasses actions taken to prevent recovery options that could restore systems to a pre-attack state. The primary data sources for detecting this behavior include PowerShell script block logs, which capture the execution details of powershell commands in real-time, providing a clear view of potentially malicious actions taken against volume shadow copies.

  ### Investigation Steps
  - **Review PowerShell Logs:** Analyze PowerShell script block logs for entries containing the command patterns indicative of shadow copy deletion, such as `Get-WmiObject` in conjunction with calls to `Win32_ShadowCopy`.

  - **Examine Event Logs:** Check Windows Event Logs, specifically for events related to WMI activity or PowerShell execution, focusing on Event ID 4104 for script block logging.

  - **Investigate System Recovery Configurations:** Verify the status of Volume Shadow Copy Services on affected systems to assess the integrity of recoverable data and determine if deletions have taken place.

  - **Correlate with Other Security Events:** Look for any adjacent security events (e.g., SMB traffic spikes, other abnormal PowerShell executions) that might suggest a broader attack scenario or confirm a compromised environment.

  ### Prioritization
  This alert is rated high severity due to the critical impact associated with the deletion of volume shadow copies. The likelihood of this behavior indicating malicious activity is enhanced by the common use of this technique by ransomware families, making it a significant threat in today's enterprise environment.

  ### Blind Spots and Assumptions
  One primary gap in detection coverage involves potential obfuscation techniques that attackers might employ to disguise their PowerShell commands or avoid triggering logging mechanisms. The detection logic assumes that PowerShell script block logging is enabled; if it is not configured, the ability to capture and analyze relevant commands may be severely limited. Additionally, if an attacker uses alternative methods or scripts outside the specified patterns, this detection may fail to trigger, leading to missed indicators of compromise.

