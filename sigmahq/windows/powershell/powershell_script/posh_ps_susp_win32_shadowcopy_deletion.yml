note: |
  ### Technical Context

  This Sigma rule detects the deletion of Windows Volume Shadow Copies using PowerShell scripts that make WMI calls. This behavior is typically employed by threat actors, particularly ransomware families such as Sodinokibi/REvil, to eliminate backup copies in order to hinder recovery efforts and facilitate data encryption. The relevant MITRE ATT&CK tactic is "Impact" (TA0040) and the technique is "Indicator Removal on Host" (T1490).

  The primary telemetry sources include PowerShell script logs and security logs that capture execution details of scripts like Event ID 4104 (PowerShell - Script Block Logging). If malicious, this activity can lead to significant disruption of recovery procedures and victim data loss. Importantly, this detection does NOT confirm that data has been exfiltrated or a successful ransomware attack has occurred, as legitimate administrative activities can also trigger similar actions.

  ### Investigation Steps

  - **Check PowerShell Script Execution:** Review PowerShell logs (Event ID 4104) for Script Block Logging to confirm the execution of commands containing 'Get-WmiObject' or 'Remove-WmiObject.' Look for benign scripting activities that typically involve scheduled tasks or administrative backups.

  - **Identify Malicious Indicators:** Search for details within logs specifically for instances of 'Remove-WmiObject' or '.Delete()' in the ScriptBlockText fields. A script containing these elements executed in a short, suspicious timeframe is a strong indicator of malicious intent.

  - **Analyze Volume Shadow Copy Status:** Use the `vssadmin list shadows` command to ensure that legitimate shadow copies exist prior to the event. A sudden absence of shadow copies around the time of the alert may indicate malicious deletion.

  - **Cross-reference Execution Sources:** Determine the running context of the PowerShell scripts, focusing on user accounts initiating the script. Any execution originating from non-admin accounts during unusual hours could indicate suspicious activity.

  - **Check for Other Indicators of Ransomware Activity:** Correlate findings with behavioral anomalies such as rapid file renaming or encryption tasks which are common behaviors of ransomware. This may also include other logs or alerts pertinent to file integrity monitors.

  ### Prioritization

  This alert is considered high-severity because it indicates a potential attempt to disrupt backup systems critical for recovery following a ransomware attack. The likelihood of malicious abuse is elevated as the deletion of shadow copies is a tactic frequently weaponized by threat actors to make data recovery significantly more challenging.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include using authorized administrative accounts to execute deletion commands, thereby masking malicious intent. Detection reliability hinges on enabling detailed PowerShell logging and configuring appropriate audit policies. Legitimate system maintenance activities, such as scheduled backup processes, may generate similar script executions. A related detection focuses on monitoring for unusual file system activity tied to shadow copy deletions for enhanced contextual awareness.

