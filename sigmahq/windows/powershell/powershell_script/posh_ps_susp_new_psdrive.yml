title: Suspicious New-PSDrive to Admin Share
id: 1c563233-030e-4a07-af8c-ee0490a66d3a
status: test
description: Adversaries may use to interact with a remote network share using 
  Server Message Block (SMB). The adversary may then perform actions as the 
  logged-on user.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.002/T1021.002.md#atomic-test-2---map-admin-share-powershell
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/new-psdrive?view=powershell-7.2
author: frack113
date: 2022-08-13
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'New-PSDrive'
    - '-psprovider '
    - 'filesystem'
    - '-root '
    - '\\\\'
    - '$'
  condition: selection
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_new_psdrive/info.yml
note: |
  ### Technical Context

  This rule detects the use of the PowerShell command `New-PSDrive` to create a new drive mapping to an administrative share (denoted by `$`) over the Server Message Block (SMB) protocol. This technique is often used by attackers to leverage existing credentials to access sensitive data and resources within the target environment. The relevant MITRE ATT&CK tactic for this activity is Lateral Movement, specifically technique T1021.002 (SMB/Windows Remote Shares).

  The primary telemetry sources include PowerShell script block logging, which requires Local Group Policy settings adjusted to enable detailed logging. If the detected behavior is malicious, it could lead to unauthorized access and exfiltration of sensitive information. This detection does NOT confirm that malicious intent is present, as legitimate administrative actions may also invoke this command.

  ### Investigation Steps

  - **Check recent PowerShell activity:** Review PowerShell logs (Event ID 4104) for the presence of `New-PSDrive` using the command structure shown in the rule. Look for unusual context indicating unauthorized administrative share access.

  - **Validate user context:** Identify the logged-on user associated with the PowerShell command. Check user access rights and roles, ensuring the user should legitimately access admin shares.

  - **Analyze network share access:** Look at SMB connection logs to track access to the administrative share (Event ID 5145) corresponding to the time the `New-PSDrive` command was executed. Check for multiple accesses from a single user that do not match expected patterns.

  - **Review related scheduled tasks or scripts:** Investigate if the command was part of a larger scheduled task or script that might indicate automated malicious behavior. This may indicate persistence mechanisms.

  - **Identify high-confidence malicious indicators:** Look for abnormal user access patterns or attempts to map multiple shares concurrently from non-standard machines. Check for sudden access by non-admin users to critical shares.

  - **Contextualize with threat intelligence:** Correlate findings against known threat actor tactics to determine if the observed behavior aligns with any past intrusion attempts or malware behavior.

  ### Prioritization

  This alert is of medium severity. Impact is elevated if the affected system hosts sensitive data or functions as a domain controller. The likelihood of malicious abuse is significant, given that the process is often weaponized in lateral movement scenarios.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative uses of `New-PSDrive`. Reliability depends on having PowerShell script block logging and SMB logging properly configured. False positives could arise from routine administrative tasks or maintenance scripts that map drive letters. Companion detections could include monitoring for unusual GPO changes or baseline deviations in PowerShell command usage trends.

