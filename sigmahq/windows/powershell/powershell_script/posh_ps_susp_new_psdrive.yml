logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'New-PSDrive'
    - '-psprovider '
    - 'filesystem'
    - '-root '
    - '\\\\'
    - '$'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell command `New-PSDrive`, which is often exploited by adversaries to map network shares, especially administrative shares (e.g., C$), enabling them to access remote filesystem resources. The likely attacker objective includes lateral movement within the network environment, access to sensitive files, or execution of additional malicious activities from a compromised host or account. This behavior aligns with the MITRE ATT&CK technique for lateral movement, specifically T1021.002 (Lateral Movement: SMB/Windows Admin Shares).

  Primary telemetry sources include Windows PowerShell logs, specifically leveraging Script Block Logging, which must be enabled for effective detection. If malicious, this activity may facilitate unauthorized access to critical enterprise resources, posing significant risk. It is important to clarify that this detection alone does not confirm malicious intent or successful access without supporting context and further investigation.

  ### Investigation Steps

  - **Review PowerShell command execution:** Check for Event ID 4104 in PowerShell logs. Look for instances of `New-PSDrive` unusual parameters or paths that indicate accessing admin shares (e.g., `\\<hostname>\C$`). Document legitimate uses for comparison.

  - **Investigate script block logging:** Confirm that Script Block Logging is enabled and operational. If logging is missing, this could hinder detection and future investigations.

  - **Check network share access:** Validate the presence of access events on network shares (Event ID 5145) corresponding to the timestamps of flagged PowerShell activity. Compare access to known legitimate paths for user activity.

  - **Identify high-confidence malicious indicators:** Cross-reference the IP addresses or usernames to known admin accounts. Flag any unusual external locations or account access times that deviate from normal operating patterns.

  - **Correlate with user behavior:** Assess historical access patterns for users involved. Look for evidence of similar SMB share access or unexpected activity from service accounts which indicate potential abuse.

  - **Monitor for post-exploitation behavior:** If this command was logged, follow up on any additional network activity (e.g., file creation or changes in Event ID 4663) on affected systems that may indicate further malicious actions post-share access.

  ### Prioritization

  This alert carries medium severity in an enterprise context as it potentially indicates lateral movement into sensitive areas of the network. The likelihood of abuse is notable, particularly if the target system is an administrative server or a file server containing sensitive data. The behavior is commonly exploited in attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Limitations include the potential for adversaries to bypass detection by using legitimate PowerShell scripts or benign user actions accessing shares. Reliable detection hinges on ensuring Script Block Logging is enabled across all endpoints. Contextual awareness of legitimate use cases, such as routine administrative tasks, can produce false positives. A companion detection worth considering is monitoring for SMB-related events (Event ID 5140) that could indicate unauthorized access correlating with the usage of `New-PSDrive`.

