title: Suspicious New-PSDrive to Admin Share
id: 1c563233-030e-4a07-af8c-ee0490a66d3a
status: test
description: Adversaries may use to interact with a remote network share using Server
  Message Block (SMB). The adversary may then perform actions as the logged-on user.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.002/T1021.002.md#atomic-test-2---map-admin-share-powershell
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/new-psdrive?view=powershell-7.2
author: frack113
date: 2022-08-13
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'New-PSDrive'
    - '-psprovider '
    - 'filesystem'
    - '-root '
    - '\\\\'
    - '$'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell command `New-PSDrive`, specifically when it is employed to create a new mapped drive to an administrative share on a remote system. Attackers may leverage this technique to interact with remote network shares using the Server Message Block (SMB) protocol, potentially executing actions as the user who is currently logged in. The primary goal of this technique is to facilitate lateral movement within a network; attackers gain access to sensitive resources or data by exploiting existing legitimate user authentication and privileges.

  Relevant MITRE ATT&CK tactics/techniques include **Lateral Movement** (TA0008) and **SMB/Windows File Shares** (T1021.002). The ability to map administrative shares can serve as a precursor to data exfiltration or further exploitation within the target environment, thus representing a serious threat if detected.

  Primary data sources for this detection include:
  - PowerShell script block logs (which must be enabled for the detection to function)
  - Windows event logs related to process creation, particularly those documenting PowerShell activity.
  - Network logs that may show unusual SMB communication patterns, especially to unexpected remote shares.

  ### Investigation Steps
  - **Review Script Block Logs**: Check PowerShell script block logging for instances of `New-PSDrive` commands executed by users. Focus on those that involve the filesystem provider and map administrative shares.
  - **Analyze Process Creation Events**: Examine Windows event logs for process creation events that indicate a PowerShell session was initiated and correlate this with the timing of the `New-PSDrive` activity.
  - **Investigate SMB Traffic**: Look at network logs for any SMB traffic that corresponds with the mapped drive activity, especially any connections to administrative shares (e.g., `$` shares) from unexpected hosts.
  - **Identify User Context**: Determine the user context under which the command was executed. Investigate the user's permission levels and any recent privilege escalations that may indicate misuse.

  ### Prioritization
  The alert's severity is medium due to the potential for lateral movement and the leveraging of existing user credentials to access sensitive resources. While not all usages of `New-PSDrive` indicate malicious intent, those targeting administrative shares warrant immediate investigation due to their likelihood of leading to more significant breaches.

  ### Blind Spots and Assumptions
  One gap in detection coverage is that without enabling PowerShell script block logging, this detection will be unable to capture relevant actions. The detection logic assumes that any usage of `New-PSDrive` in conjunction with administrative shares is suspicious, which may not always be the case, as legitimate administrative tasks can also trigger this alert. The necessary configurations include enabling script block logging within PowerShell to capture the script execution context required for this detection to function effectively.

