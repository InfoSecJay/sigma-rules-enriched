  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that create a new PowerShell drive (New-PSDrive) mapped to a network share, specifically targeting administrative shares via Server Message Block (SMB). The likely attacker objective is lateral movement, enabling them to access resources or execute commands on remote systems as the logged-on user. This behavior aligns with the MITRE ATT&CK technique T1021.002 (Lateral Movement: SMB/Windows Admin Shares).

  Primary telemetry sources include PowerShell logs obtained through Script Block Logging. The security impact is significant, as it may indicate an adversary attempting to gain unauthorized access to sensitive resources across the network. Importantly, this alert does NOT confirm malicious activity on its own, as legitimate administrative tasks may also perform similar operations.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for New-PSDrive:** Examine Security Event ID 4104 for Script Block Logging events containing 'New-PSDrive'. Look for any unusual user accounts or processes running the command.

  - **Validate the context of PowerShell execution:** Check if the PowerShell command was executed interactively or through a scheduled task. Legitimate use normally comes from known admin accounts or predefined scripts.

  - **Inspect SMB logs for network share access:** Correlate the timestamp of the PowerShell execution with access logs to administrative shares (Event ID 5140). Legitimate access should show regular patterns, while any anomalous access should be flagged.

  - **Cross-reference user activity:** Identify the user who executed the command and their role. Compare with historical behavior to gauge if this action is consistent with their job function.

  - **Check endpoint reputation and associated artifacts:** Look for any high-confidence malicious indicators such as known hash values or behaviors associated with lateral movement tools like PsExec or Mimikatz.

  ---

  ### Prioritization

  This alert should be treated with medium priority as it involves potential lateral movement which can lead to unauthorized access across critical systems. Given the nature of SMB and administrative shares, there's a moderate likelihood of malicious abuse, especially in environments where these actions are commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  Key detection limitations include potential bypassing of alerts through legitimate administrative actions and existing permissions for well-known accounts. Reliable detection requires enabling Script Block Logging and ensuring SMB access logging is properly configured. Additionally, legitimate administrative tasks (e.g., IT maintenance or troubleshooting) may trigger this alert. A related detection involving monitoring of SMB access patterns can strengthen coverage against this behavior.

