title: AD Groups Or Users Enumeration Using PowerShell - ScriptBlock
id: 88f0884b-331d-403d-a3a1-b668cf035603
status: test
description: |
  Adversaries may attempt to find domain-level groups and permission settings.
  The knowledge of domain-level permission groups can help adversaries determine which groups exist and which users belong to a particular group.
  Adversaries may use this information to determine which users have elevated permissions, such as domain administrators.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md
author: frack113
date: 2021-12-15
modified: 2022-12-25
tags:
- attack.discovery
- attack.t1069.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  test_2:
    ScriptBlockText|contains: get-ADPrincipalGroupMembership
  test_7:
    ScriptBlockText|contains|all:
    - get-aduser
    - '-f '
    - '-pr '
    - DoesNotRequirePreAuth
  condition: 1 of test_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the enumeration of Active Directory (AD) groups and users via PowerShell commands such as `Get-ADUser` and `Get-ADPrincipalGroupMembership`. The likely objective of the attacker is to gather information about AD entities, specifically to identify users with elevated privileges like domain administrators, which could facilitate further attacks, such as lateral movement. This behavior aligns with the MITRE ATT&CK technique "Account Discovery" (T1069.001).

  The primary telemetry sources required for this detection include Windows PowerShell script block logs, which must have script block logging enabled. If malicious, the identification of privileged AD accounts can significantly increase the security risk, as it may lead to unauthorized access to critical resources. Importantly, this detection does not confirm that an attack is in progress; it only indicates that suspicious commands were executed.

  ### Investigation Steps

  - **Review PowerShell Execution Logs**: Check Event ID 4104 in Windows Event Logs for script block logs that may include `Get-ADUser` or `Get-ADPrincipalGroupMembership` in the ScriptBlockText. Note the presence of these commands as potential indications of malicious intent.

  - **Verify User Context**: Identify the user account executing the commands by examining Event ID 4688 (Process Creation) to determine if the user is known to have legitimate access to AD enumeration tools. Familiar users in high-privilege roles may be benign.

  - **Assess Command Parameters**: Look for specific parameters in script block logs that provide filter criteria (e.g., "-f ", "-pr ", "DoesNotRequirePreAuth"). Commands using common filter flags may be indicators of nefarious scripts designed to query large groups of users.

  - **Monitor for Repeat Execution**: Analyze the frequency of occurrences for these commands over a defined period. Multiple requests from a non-admin account to enumerate AD entities may suggest an ongoing reconnaissance phase in an attack.

  - **Check for Companion Activities**: Review for complementary behaviors such as lateral movement (e.g., using PSExec or RDP) following the enumeration commands, as these may indicate that the enumeration was a precursor to an attack.

  ### Prioritization

  This alert is classified as low severity in an enterprise context. The potential impact is moderate, as it may expose elevated accounts, but the likelihood of malicious abuse in the environment needs further confirmation. This behavior is common in legitimate administrative tasks, making contextual verification critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the scope of logging configuration; if PowerShell script block logging is not enabled, malicious activities will go undetected. Legitimate administrative tasks, such as routine account audits, may trigger this alert. As a companion detection, monitoring for unusual logon patterns following AD enumeration can provide additional context and enhance security posture.

