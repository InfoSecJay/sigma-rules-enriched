title: AD Groups Or Users Enumeration Using PowerShell - ScriptBlock
id: 88f0884b-331d-403d-a3a1-b668cf035603
status: test
description: |
  Adversaries may attempt to find domain-level groups and permission settings.
  The knowledge of domain-level permission groups can help adversaries determine which groups exist and which users belong to a particular group.
  Adversaries may use this information to determine which users have elevated permissions, such as domain administrators.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md
author: frack113
date: 2021-12-15
modified: 2022-12-25
tags:
- attack.discovery
- attack.t1069.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  test_2:
    ScriptBlockText|contains: get-ADPrincipalGroupMembership
  test_7:
    ScriptBlockText|contains|all:
    - get-aduser
    - '-f '
    - '-pr '
    - DoesNotRequirePreAuth
  condition: 1 of test_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies potential enumeration of Active Directory (AD) groups and users utilizing PowerShell script blocks. Adversaries, particularly during the reconnaissance phase of an attack, may leverage these commands to gather information about domain-level groups and their membership. By understanding group structures and permissions, attackers can pinpoint users with elevated privileges, thus mapping out potential targets for lateral movement and privilege escalation. The ultimate objective of this behavior is to gain a deeper understanding of the security posture of the environment, aiding in planning sophisticated attacks.

  Relevant MITRE ATT&CK tactics include:
  - **Discovery** (TA0007)
  - **Account Discovery** (T1087)
    - **Domain Account Discovery** (T1087.001)
    - **Group Membership Discovery** (T1069.002)

  Primary data sources for detecting this behavior encompass PowerShell script block logs, where each executed command and its parameters are recorded, allowing analysts to identify potentially malicious queries against AD.

  ### Investigation Steps
  - **Review PowerShell Script Block Logs:** Examine the PowerShell script block logs for entries that include `get-ADPrincipalGroupMembership`, `get-aduser`, or atypical flags. Look for patterns indicative of enumeration activities, particularly in unusual time frames or from unfamiliar hosts.

  - **Correlate User Accounts:** Analyze the accounts making the queries against AD. Cross-reference these accounts with known user permissions and assess their role within the organization to identify potential misuse or compromise.

  - **Investigate Access Patterns:** Look for spikes in AD-related queries or scripts being executed, especially from non-administrative or endpoint systems. Identify any lateral movement or unusual access requests that may point to a broader reconnaissance effort.

  - **Analyze Affected Groups:** Identify the groups being enumerated and assess their membership for any unusual associations. Pay special attention to groups like Domain Admins or other high-privilege roles that could pose a significant risk if compromised.

  ### Prioritization
  The severity of this alert is considered low, as it may reflect benign administrative activity; however, frequent enumeration attempts can signal potential reconnaissance by an adversary, which requires timely investigation to mitigate possible threats.

  ### Blind Spots and Assumptions
  This detection logic assumes that PowerShell script block logging is enabled within the environment, which may not be the case across all systems. Gaps in detection include environments with restrictive PowerShell logging settings or that do not capture all executed commands. Additionally, the rule does not account for non-PowerShell-based enumeration techniques that attackers might utilize, such as LDAP queries executed by alternative scripting languages or tools. Without comprehensive logging and monitoring practices, detection of such activities could be significantly hampered.

