note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell commands executed via `rundll32`, a common technique used by threat actors to execute malicious scripts while evading detection mechanisms. The specific behavior analyzed includes the invocation of `shell32.dll` with the `shellexec_rundll` method, which may indicate attempts to run PowerShell scripts that leverage command obfuscation tactics to bypass security controls.

  The threat scenario suggests an attacker seeking to execute malicious commands on a compromised system, potentially capturing credentials, exfiltrating data, or deploying further malware. The use of obfuscated scripts is prevalent among sophisticated threat actors looking to maintain persistence and evade detection by security solutions, which might not recognize the actions as malicious.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1560)** - The execution of obfuscated commands allows adversaries to bypass defenses.
  - **Execution (T1059.001)** - The manipulation of PowerShell as a scripting environment to execute code on target systems.

  Primary data sources for detecting this behavior include PowerShell Script Block Logging logs, which must be enabled to capture the relevant PowerShell activities, and Windows Event Logs, specifically event IDs that report on script execution.

  ### Investigation Steps
  - **Review Script Block Logs**: Check PowerShell Script Block Logging for entries that contain `rundll32`, `shell32.dll`, and `shellexec_rundll`. Look for obfuscation patterns.
  - **Analyze Process Creation Events**: Investigate process creation logs around the time of the alert. Identify any `rundll32.exe` processes launched and their command lines to trace potential malicious activity.
  - **Correlate with Network Traffic**: Examine network logs for any outbound traffic that corresponds to the time of the suspicious PowerShell execution. Look for unusual connections or data exfiltration attempts.
  - **Check Windows Defender or Antivirus Alerts**: Review any alerts from security solutions that may indicate prior blocks or detections of similar obfuscated PowerShell usage to assess the threat's context.

  ### Prioritization
  Given the high severity classification of this alert, it is critical for enterprise environments, as the use of obfuscated PowerShell can signal a compromise and lead to significant incidents like data breaches or ransomware attacks if left unchecked.

  ### Blind Spots and Assumptions
  The detection logic relies on the presence and proper configuration of PowerShell Script Block Logging, which may not be enabled in all environments. The rule may also miss instances where similar obfuscated commands are executed without the `rundll32` context or through other methods of evasion. It assumes that the threat actors are leveraging recognizable patterns within their obfuscation, which may not always be the case. Without comprehensive logging, particularly for obfuscated PowerShell execution, detection may be limited.

