logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ScriptBlockText|contains:
    - 'value'
    - 'invoke'
    - 'comspec'
    - 'iex'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects obfuscated PowerShell commands utilizing `rundll32` for execution, particularly commands that involve invoking scripts and using shell execution methods. The likely objective of the attacker is to execute malicious payloads in a stealthy manner, leveraging legitimate system tools to bypass security measures. This behavior aligns with the MITRE ATT&CK techniques of **T1027: Obfuscated Files or Information** and **T1059.001: PowerShell**.

  The primary telemetry sources required for this detection include PowerShell Script Block Logging, which captures the full text of scripts executed in PowerShell. If malicious, this behavior can lead to unauthorized access, data exfiltration, or the deployment of additional malware. However, this detection does NOT confirm that the activity is malicious by itself; further investigation is necessary to determine intent and impact.

  ### Investigation Steps

  - **Review PowerShell Script Block Logging:** Check for Security Event ID 4104 for entries containing `rundll32`, `value`, and `invoke`. Compare script contents against known malicious patterns and context.

  - **Inspect process creation related to PowerShell:** Use Sysmon Event ID 1 to identify the creation of PowerShell processes that correspond to the 4104 events. Look for command line arguments that include `rundll32` and `shell32.dll`, as these are high-confidence indicators of malicious activity.

  - **Identify routine administrative scripts:** Confirm if any legitimate administrative scripts use `rundll32`. Expected behavior may include command line executions involving `-ExecutionPolicy Bypass` or specific administrative contexts in which rundll32 is used for valid purposes.

  - **Analyze user context and execution time:** Review the User and Process information from Event ID 4104 to assess the legitimacy of the invoking user. Unexpected users executing PowerShell scripts with obfuscation techniques may indicate malicious intent.

  - **Validate file creation or exfiltration:** If applicable, check for file creation events related to `rundll32` executions in the Windows Event logs (e.g., Event ID 4663). Look for suspicious outbound connections or data transfer during the execution period.

  ### Prioritization

  This alert has a high severity due to its potential impact on critical systems, as it may indicate an ongoing attack leveraging PowerShell to execute code. The likelihood of malicious abuse is significant, as obfuscation techniques are frequently weaponized by adversaries to evade detection and manipulate legitimate processes.

  ### Blind Spots and Assumptions

  Detection may be limited by the quality of Script Block Logging; if not enabled, legitimate activity may go undetected. Evasion techniques include modifying the obfuscation method or using alternate tools for code execution. Legitimate administrative tasks may occasionally trigger this alert, especially when using PowerShell for system maintenance. Complementary detections could involve monitoring for known malicious PowerShell hashes or monitoring outbound network connections from PowerShell processes.

