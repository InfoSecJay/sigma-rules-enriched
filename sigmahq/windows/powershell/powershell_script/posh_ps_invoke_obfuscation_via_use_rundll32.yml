title: Invoke-Obfuscation Via Use Rundll32 - PowerShell
id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
status: test
description: Detects Obfuscated Powershell via use Rundll32 in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009
author: Nikita Nazarov, oscd.community
date: 2019-10-08
modified: 2022-11-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_4104:
    ScriptBlockText|contains|all:
    - '&&'
    - 'rundll32'
    - 'shell32.dll'
    - 'shellexec_rundll'
    ScriptBlockText|contains:
    - 'value'
    - 'invoke'
    - 'comspec'
    - 'iex'
  condition: selection_4104
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of obfuscated PowerShell scripts invoked through `rundll32.exe` with potential commands related to executing other PowerShell commands. The behavior indicates an attempt by attackers to leverage PowerShell's capabilities while obscuring their intentions, thereby bypassing standard security measures. The likely attacker objective includes executing malware payloads or commands that facilitate lateral movement or data exfiltration.

  This activity correlates with MITRE ATT&CK techniques such as "Command and Scripting Interpreter: PowerShell" (T1059.001) and "Obfuscated Files or Information" (T1027). The primary telemetry source for detection is PowerShell script block logging, specifically focusing on captured ScriptBlockText fields. A successful attack can lead to unauthorized control of the system, data theft, or compromise of sensitive information. It is essential to note that this detection does NOT confirm successful execution of malicious code; it only indicates the potentially suspicious invocation of obfuscated commands.

  ### Investigation Steps

  - **Check PowerShell Script Block Logging configuration:** Verify that Script Block Logging is enabled on the affected host (Group Policy setting or PowerShell configuration) for enhanced visibility.

  - **Analyze the captured ScriptBlockText:** Review specific instances in the logs for PowerShell event IDs 4104 that contain `rundll32`, `shell32.dll`, and other specified keywords to pinpoint exact command execution attempts.

  - **Identify potentially malicious indicators:** Confirm the presence of `iex`, `invoke`, and combinations of command strings indicative of obfuscation; high-confidence indicators include unusually constructed commands with multiple concatenation operators (e.g., `&&`).

  - **Review legitimate PowerShell activity:** Investigate if any registered automation tasks or legitimate applications on the server utilize similar command patterns for routine operations; look for processes running in expected directories with normal usage patterns.

  - **Compile run history from `rundll32.exe`:** Use Sysinternals' Process Monitor or equivalent tools to check recent command line arguments passed to `rundll32.exe` for suspicious endpoint activity or unauthorized execution contexts.

  ### Prioritization

  The alert's severity is high due to the potential impact on critical systems that may be leveraged for further attack propagation or data exfiltration. Given that the use of obfuscation techniques is common among threat actors, the likelihood of malicious abuse remains significant.

  ### Blind Spots and Assumptions

  The detection may be bypassed if threat actors employ custom obfuscation techniques not captured by the rule or if Script Block Logging is not properly configured. Some legitimate applications may legitimately call `rundll32` in ways that could trigger this alert, such as legitimate management scripts or automation tools. Companion detections, such as monitoring for anomalies in PowerShell usage patterns or executions not matching known cmdlets, can strengthen coverage against these threats.

