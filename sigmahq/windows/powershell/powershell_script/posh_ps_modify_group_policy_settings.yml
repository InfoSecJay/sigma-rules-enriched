note: |
  ### Technical Context

  This Sigma rule detects modifications to Group Policy settings through PowerShell script block logging, particularly changes to relevant keys that could impact security controls and system behavior. The likely attacker objective behind such modifications is to disable security features or implement persistent malware that evades detection. This behavior is associated with the MITRE ATT&CK technique for “Modify Group Policy” (T1484.001), which falls under the tactics of privilege escalation and defense impairment.

  The primary telemetry sources are Windows PowerShell logs from Script Block Logging, specifically looking for modifications in Group Policy settings. Malicious changes to these settings can undermine the overall security posture of the enterprise. It is important to note that this detection does NOT confirm malicious intent, as legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Confirm event source and logging:** Verify that Script Block Logging is enabled on the affected system by checking the Event Log (Event ID 4104) for PowerShell script block logs. Ensure notifications reflect legitimate administrative practice like Group Policy updates.

  - **Review script block content:** Analyze the content of the logs for ScriptBlockText fields. Look for key modifications including “GroupPolicyRefreshTime,” “EnableSmartScreen,” or any references to changing security policies in Software Registry paths.

  - **Identify high-confidence malicious indicators:** Check for rapid or automated changes (e.g., multiple modifications within a short timeframe). Look for patterns indicating scripting tools possibly used by adversaries to execute the changes.

  - **Assess potential impact of changes:** Investigate the implications of the detected modifications on security policies. For instance, disabling “SmartScreen” could enable further exploit activity or unauthorized software installation.

  - **Distinguish legitimate vs. malicious activity:** Compare changes against recent administrative logs and scheduled tasks. Legitimate tasks often have clear justifications tied to expected system administration needs or security policy updates.

  - **Investigate user context:** Examine the user account associated with the modifications for inappropriate privileges or previous suspicious behavior. Cross-reference with any prior alerts from similar sources (such as Event ID 4688 for process creation) that indicate potential misuse of administrative powers.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of modifications on critical security settings. The likelihood of malicious abuse is moderate, especially in environments where attackers aim to escalate privileges or disable protections. This type of behavior is commonly weaponized to maintain persistence or evade detection.

  ### Blind Spots and Assumptions

  Detection might be limited if Script Block Logging is not enabled across all systems, potentially missing malicious activity by rogue users. Legitimate activities, such as scheduled Group Policy updates performed by administrators, may also trigger alerts. A related detection rule focused on abnormal PowerShell usage patterns (e.g., frequent execution of scripts that modify system settings) would improve coverage against potential threats.

