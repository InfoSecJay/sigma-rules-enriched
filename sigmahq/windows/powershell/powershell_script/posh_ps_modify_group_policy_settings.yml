note: |
  ### Technical Context

  This Sigma rule detects modifications to Group Policy settings that may be leveraged for malicious purposes, such as altering security policies or enabling features that assist in persistence within an environment. The likely attacker objective is to manipulate system behavior and undermine security controls, enabling further actions such as privilege escalation or defense evasion. This behavior aligns with the MITRE ATT&CK technique T1484.001 (Domain Policy Modification) under the tactics of Defense Evasion and Privilege Escalation.

  The primary telemetry sources for this detection include Windows PowerShell logs with Script Block logging enabled, specifically analyzing the ScriptBlockText for identified keywords. If malicious, these actions can significantly compromise system integrity by allowing unauthorized changes. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can trigger similar telemetry.

  ### Investigation Steps

  - **Check Script Block Logging Events**: Review PowerShell logs for Event ID 4104 (PowerShell Script Block Logging) and focus on the `ScriptBlockText` field for keywords like "GroupPolicyRefreshTimeDC" or "EnableSmartScreen". Compare against baseline admin operations.

  - **Identify Legitimate Use**: Validate if the detected changes were made during a known maintenance window by authorized personnel, with prior notifications for policy adjustments. Legitimate changes will often be scheduled and communicated.

  - **Assess Group Policy Impact**: Query Group Policy configuration using `gpresult /h report.html` and analyze the report for unauthorized modifications specific to security settings related to SmartScreen or other policies relevant to your organization’s security posture.

  - **Examine Host Activity**: Check for additional suspicious behaviors associated with the modifying host. Look for Event ID 4624 (Logon) and correlate timestamps and user accounts involved with the modification to identify anomalous actions.

  - **Highlight Malicious Indicators**: Review changes that directly affect security settings, especially around SmartScreen. Look for events where changes are made by non-administrative accounts or systems classified as high risk.

  - **Correlate with Other Alerts**: Determine if this event aligns with failed logins or privilege escalations reported by other alerts, such as those indicating suspicious enhanced permissions requests (e.g., Event ID 4672).

  ### Prioritization

  This alert should be considered medium severity. The system affected may contain critical policy controls. The likelihood of malicious abuse is moderate, as manipulating Group Policy settings is a known tactic for adversaries to maintain access or escalate privileges. This behavior is commonly weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the requirement for Script Block Logging to be enabled, which is not always the case in all environments. Legitimate administrative tasks, such as routine policy modifications during scheduled updates, can trigger this alert. A related detection to strengthen coverage includes monitoring for unexpected PowerShell execution patterns or unusual account behaviors that might suggest privilege escalation attempts.

