logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_path:
    ScriptBlockText|contains: \SOFTWARE\Policies\Microsoft\Windows\System
  selection_key:
    ScriptBlockText|contains:
    - GroupPolicyRefreshTimeDC
    - GroupPolicyRefreshTimeOffsetDC
    - GroupPolicyRefreshTime
    - GroupPolicyRefreshTimeOffset
    - EnableSmartScreen
    - ShellSmartScreenLevel
  condition: all of selection_*
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to Group Policy settings via PowerShell ScriptBlock logging. Such modifications can indicate malicious activities, as attackers often alter Group Policies to change security settings and implement other harmful behaviors across an organization's network. The rule looks for specific alterations in ScriptBlockText related to Group Policy refresh timings and SmartScreen functionality, which may signal an intent to bypass security controls or escalate privileges.

  The pertinent MITRE ATT&CK tactics related to this detection include **Defense Evasion (T1490)** and **Privilege Escalation (T1484.001)**. Attackers may leverage these methods to hinder detection capabilities and gain unauthorized access to sensitive systems by exploiting weaknesses in Group Policy management.

  The primary data sources for effective detection include PowerShell script execution logs with ScriptBlock logging enabled, which record the commands executed in PowerShell, providing insight into potentially harmful modifications to Group Policy settings.

  ### Investigation Steps
  - **Review PowerShell Logs**: Investigate the PowerShell script execution logs for entries that include the suspicious ScriptBlockText identified in the detection logic.
  - **Analyze Group Policy Changes**: Cross-reference the detected modifications with the Group Policy Management Console (GPMC) to identify which specific policies were altered and the potential implications of those changes.
  - **Correlate with User Activity**: Assess whether the modifications coincide with unusual user activity, especially for accounts with elevated privileges, to determine if the changes align with legitimate administrative tasks or indicate potential compromise.
  - **Monitor for Subsequent Activity**: Look for any follow-up actions that may indicate exploitation of the modified Group Policies, such as unusual login patterns or unauthorized access attempts within the environment.

  ### Prioritization
  This alert is of medium severity due to the potential for significant impact, enabling attackers to subvert security measures and escalate privileges through unauthorized Group Policy modifications. The likelihood of occurrence is high, given that sophisticated adversaries often employ this technique in targeting enterprise environments.

  ### Blind Spots and Assumptions
  The detection may miss legitimate administrative actions if they do not show up in the logs or are performed outside of the PowerShell environment. The detection logic assumes that ScriptBlock logging is enabled and functioning correctly, a requirement that must be confirmed in the environment for effective monitoring. Additionally, there may be a lack of visibility if appropriate logging for Group Policy refresh events is not configured across all relevant systems, potentially hindering the investigation of related suspicious activities.

