note: |
  ### Technical Context

  This rule detects modifications to Group Policy settings via PowerShell script block logging, specifically looking for changes related to Windows System policies. The likely objective is to establish persistence or perform privilege escalation by altering Group Policy Objects (GPOs) to either weaken security controls or enforce unwanted configurations. This behavior aligns with the MITRE ATT&CK technique T1484.001: "Domain Policy Modification."

  The primary telemetry sources are Windows Script Block Logs and potentially Event IDs associated with PowerShell execution (e.g., Event ID 4104 from Windows PowerShell logs). If malicious, these modifications can severely impact system integrity and security posture, enabling further exploitation. However, detecting this activity does NOT confirm malicious intent; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Identify the PowerShell Script Block Log:**
    Review the Windows Event Log for PowerShell Script Block Logs, specifically Event ID 4104, looking for entries containing:
    - "\SOFTWARE\Policies\Microsoft\Windows\System"
    - Any of the GPO modifications specified above.

  - **Review User Privileges:**
    Check the account that executed the PowerShell command. If the principal account lacks administrative privileges, this may indicate potentially malicious behavior. Legitimate administrative changes should originate from known admin accounts.

  - **Assess Group Policy Object Changes:**
    Use the Group Policy Management Console (GPMC) to review recent GPO changes. Look for any configurations that diverge from standard operating procedures, such as unusual modifications to “SmartScreen" settings or refresh intervals.

  - **Monitor for Related Malicious Indicators:**
    Correlate this activity with detections of other notable behaviors, such as abnormal network activity or unauthorized remote access tools. Malicious modifications often coincide with other attack patterns.

  - **Establish Baseline Configurations:**
    Document and analyze baseline GPO settings for critical servers and workstations. Compare any detected changes against these baselines to identify unauthorized modifications effectively.

  ### Prioritization

  This alert carries a medium severity level. While the impact may vary depending on the system affected, group policy modifications can significantly compromise security. The likelihood of exploitation is high, as attackers often target GPOs to facilitate lateral movement or create persistence in an environment.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell logging is not enabled or where administrators frequently modify GPOs for legitimate reasons. Evasive techniques could include obfuscation of script text or using alternate administrative tools. Additionally, legitimate administrative tasks—such as routine policy updates—may trigger this alert. A related detection to consider is monitoring changes to Active Directory permissions, enhancing visibility into potential identity vulnerabilities or credential manipulation.

