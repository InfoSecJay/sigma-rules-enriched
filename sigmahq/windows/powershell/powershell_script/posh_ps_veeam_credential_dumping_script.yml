title: Veeam Backup Servers Credential Dumping Script Execution
id: 976d6e6f-a04b-4900-9713-0134a353e38b
status: test
description: Detects execution of a PowerShell script that contains calls to the "Veeam.Backup"
  class, in order to dump stored credentials.
references:
- https://www.pwndefend.com/2021/02/15/retrieving-passwords-from-veeam-backup-servers/
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-04
tags:
- attack.credential-access
logsource:
  product: windows
  category: ps_script
  definition: bade5735-5ab0-4aa7-a642-a11be0e40872
detection:
  selection:
    ScriptBlockText|contains|all:
    - '[Credentials]'
    - '[Veeam.Backup.Common.ProtectedStorage]::GetLocalString'
    - 'Invoke-Sqlcmd'
    - 'Veeam Backup and Replication'
  condition: selection
falsepositives:
- Administrators backup scripts (must be investigated)
level: high
note: |
  ### Technical Context
  This rule detects suspicious PowerShell script executions that invoke methods from the Veeam Backup class, specifically targeting credential dumping activities. Attackers may exploit this script to extract sensitive credentials stored within Veeam Backup configurations, potentially allowing unauthorized access to backed-up data or other systems. The objective is often to pivot further into the environment once they obtain these credentials, which are typically high-privilege in nature.

  The relevant MITRE ATT&CK tactics for this scenario include **Credential Access** (TA-0006) and techniques such as **Credential Dumping** (T1003). By leveraging the Veeam Backup application, attackers can stealthily obtain credentials critical to maintaining access and conducting further malicious actions within the network.

  Primary data sources that will provide valuable insights for this detection include events from PowerShell script execution logs, which will detail any script activity that matches certain patterns indicative of credential dumping behavior. Monitoring these logs can reveal anomalous script invocations reflective of potential exploitation.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell script execution logs for instances of the flagged script. Pay particular attention to the timing and context of these executions to identify abnormal patterns.
  - **Check for Admin Activity:** Investigate whether the execution of the script corresponds to legitimate administrative actions or if it appears unauthorized. Look out for unusual user behavior or accounts not typically associated with backup operations.
  - **Correlate with Veeam Activity:** Cross-reference the logs with Veeam Backup configurations and activity logs. Determine if there were recent changes or logins correlating with the script execution, which may indicate unauthorized access attempts.
  - **Analyze Environment Changes:** Assess whether any configurations or credentials within the Veeam Backup system were altered or accessed during or after the script execution. Ensure that this potential credential dump didn't lead to further compromises.

  ### Prioritization
  This alert should be treated as high priority due to the high-risk nature of credential dumping, particularly from backup systems which often house sensitive data and access controls. The potential impact on the organization can be severe, leading to unauthorized data access and compromise.

  ### Blind Spots and Assumptions
  There may be blind spots if PowerShell logging is not adequately configured, potentially missing malicious activity. Additionally, the detection logic assumes that the presence of the specified script without legitimate context indicates a threat. Organizations must enable detailed logging for PowerShell and monitor for any benign administrative scripts that could generate false positives. Regular reviews of legitimate administrative activities are essential to ensure the detection remains effective and doesn't lead to operational disruption.

