note: |
  ### Technical Context

  This Sigma rule detects PowerShell script execution involving the retrieval of credentials from Veeam Backup servers using specific PowerShell commands targeting the Veeam API. The likely objective of an attacker would be to extract backup credentials for further exploitation, enabling unauthorized access to sensitive backups or other systems. This detection aligns with the MITRE ATT&CK technique T1003: Credential Dumping. The primary telemetry sources include PowerShell logs with relevant events indicating the execution of scripts (e.g., Windows Event ID 4688). If the behavior is malicious, it poses a significant security risk, potentially allowing an attacker to access and manipulate critical backup data. However, this detection does NOT confirm that an attack has occurred on its own; further context and investigation are essential.

  ### Investigation Steps

  - **Check Event ID 4688: PowerShell process creation logs**: Review logs for Event ID 4688 indicating PowerShell execution, specifically focusing on the CommandLine field for the keywords '[Credentials]', '[Veeam.Backup.Common.ProtectedStorage]::GetLocalString', and 'Invoke-Sqlcmd'.

  - **Identify script source and legitimacy: Examine the script's origin**: Verify whether the executing PowerShell script is part of scheduled backup tasks or administrative operations. Look for entries in the Windows Task Scheduler or identify if the script's path leads to known legitimate scripts.

  - **Inspect for abnormal network connections**: Cross-reference with network logs to identify any unusual outbound connections (e.g., Windows Event ID 5156) that may indicate data exfiltration following credential access.

  - **Assess user behavior context**: Review the user account tied to the script execution. Investigate patterns of behavior—look for anomalies against their typical activities, focusing on whether they are authorized personnel managing backup processes.

  - **Search for accompanying administrative actions in backup logs**: Review Veeam Backup Server logs for legitimate administrative actions preceding or following the detected PowerShell execution to understand the operational context.

  - **Capture and analyze memory for PowerShell artifacts**: If feasible, perform a memory capture of the affected host to look for malicious PowerShell artifacts or any persistence mechanisms linked to the execution.

  ### Prioritization

  This alert is of high severity due to its potential impact on the integrity of backup data. The likelihood of malicious abuse is significant, as credential dumping from backup servers is a known tactic used in attacks. This behavior is often weaponized by adversaries looking to gain access to sensitive assets stored within backup environments.

  ### Blind Spots and Assumptions

  Evasion techniques may include obfuscation of PowerShell commands or using encoded commands to bypass detection. Reliable detection requires that PowerShell logging be enabled, as well as monitoring around Veeam activity. Legitimate administrative activities—such as authorized script execution during maintenance—may trigger this alert, necessitating thorough investigation. A related detection such as anomalous access to Veeam Backup configuration files or unusual changes to scheduled tasks could provide complementary insights and enhance coverage.

