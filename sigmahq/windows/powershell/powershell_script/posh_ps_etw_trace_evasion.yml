logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_pwsh_remove:     # Autologger provider removal
    ScriptBlockText|contains: 'Remove-EtwTraceProvider '
  selection_pwsh_set:     # Provider “Enable” property modification
    ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - '0x11'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of PowerShell cmdlets that disable or remove Event Tracing for Windows (ETW) trace sessions, indicating a potential attempt by an adversary to evade detection mechanisms. These actions may signify an attacker’s objective to conceal their activities, maintain persistence, or hinder incident response efforts by disrupting logging capabilities. Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)**, specifically through the technique **Impair Defenses (T1070)**.

  Primary telemetry sources for this detection are Windows PowerShell logs, specifically focusing on script block logging which must be enabled to capture relevant actions. If malicious, the security impact could be significant, compromising the organization's ability to track and investigate malicious activities. It is important to note that simply detecting these cmdlets does not confirm malicious intent without further contextual analysis.

  ### Investigation Steps

  - **Examine PowerShell Script Execution Logs:** Review the PowerShell logs for Event ID 4104 to identify any instances of the cmdlets `Remove-EtwTraceProvider` or the properties being modified in the context of `Set-EtwTraceProvider`. Check for ScriptBlockText violations.

  - **Identify User Context:** Determine the user account executing the PowerShell scripts. Check for unusual or unauthorized user accounts (e.g., service accounts executing these cmdlets) to identify potential insider threats.

  - **Assess Script Block Logging Status:** Verify that script block logging is enabled on the systems in question (set via Group Policy). If not enabled, this rule may not function correctly, leading to blind spots in detection.

  - **Determine Impact of ETW Modification:** Investigate historical logging states and ETW sessions to see if log collection was recently reduced or disabled, signaling possible malicious intent. Look for Event IDs 1102 (Event Log Clearance) in conjunction.

  - **Correlate with Other Suspicious Activities:** Look for other related detections such as unauthorized network connections or binary modifications that may occur around the same time as the PowerShell cmdlets were executed.

  - **Review Legitimate Administrative Actions:** Consider any recent legitimate administrative activities. Activities such as routine server maintenance, software updates, or configuration changes could explain benign usage of these cmdlets.

  ### Prioritization

  This alert should be considered high severity due to the critical impact on logging capabilities, which could lead to diminished visibility during an ongoing attack. The likelihood of malicious abuse is significant, as attackers commonly seek to manipulate logging mechanisms to evade detection during unauthorized activities.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where script block logging is not consistently enabled, resulting in a lack of visibility into PowerShell operations. Legitimate activities, such as administrative tasks or updates to system configurations, might trigger these alerts. A related detection that strengthens coverage includes monitoring for Event ID 4688 (process creation) specifically focused on PowerShell to correlate with suspicious execution context.

