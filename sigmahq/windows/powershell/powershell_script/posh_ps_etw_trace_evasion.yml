logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_pwsh_remove:     # Autologger provider removal
    ScriptBlockText|contains: 'Remove-EtwTraceProvider '
  selection_pwsh_set:     # Provider “Enable” property modification
    ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - '0x11'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of PowerShell cmdlets to disable or remove Event Tracing for Windows (ETW) trace sessions. ETW is a critical component for monitoring system and application events in Windows environments, and attackers may seek to manipulate or disable these logs to evade detection during and after a compromise. By removing or modifying ETW trace sessions, adversaries aim to hinder forensic investigations, making it difficult for security teams to understand the full scope of an incident.

  The likely attacker objectives for this behavior include covering their tracks after executing malicious actions, such as privilege escalation or lateral movement, or to prepare the environment for further exploitation. This behavior correlates with the MITRE ATT&CK tactics of **Defense Evasion** and techniques such as **T1070: Indicators Removal on Host** and **T1562.006: Disable or Modify Tools**. Primary data sources that can provide evidence for this activity include PowerShell script execution logs, specifically those with script block logging enabled.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine PowerShell script execution logs for entries that contain `Remove-EtwTraceProvider` or `Set-EtwTraceProvider` with the property set to `0x11`. This will help identify any unauthorized attempts to disable ETW.
  - **Correlate with Other Log Sources**: Cross-reference findings with Windows Event Logs (such as Security and Application logs) to identify any correlated activity, like suspicious account logins or process creations that may provide context to the ETW manipulation.
  - **Check for Script Block Logging Configuration**: Ensure that PowerShell script block logging is enabled across all systems, as this is necessary for capturing the relevant commands and detecting such activities.
  - **Analyze Recent Changes**: Investigate any recent changes in security configurations or log retention policies that may have impacted the visibility of ETW trace sessions or other logging mechanisms within your environment.

  ### Prioritization
  This alert has a high severity due to the potential impact on an organization’s ability to detect and respond to intrusions. The likelihood of detection evasion tactics being employed and the critical nature of ETW for incident response make this alert a priority for immediate investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may exist if PowerShell script block logging is not enabled, as this rule relies on those logs to function effectively. Additionally, attackers may utilize alternate methods of disabling ETW that are not captured by this specific detection logic. The detection assumes that adequate logging policies are in place and that attackers will use typical PowerShell cmdlets for their nefarious activities.

