logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_pwsh_remove:     # Autologger provider removal
    ScriptBlockText|contains: 'Remove-EtwTraceProvider '
  selection_pwsh_set_hex:     # Provider “Enable” property modification (hex form)
    ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - '0x11'
  selection_pwsh_set_dec:     # Provider “Enable” property modification (decimal form, equivalent to 0x11)
  - ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - ' 17'
  - ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - “'17'”
  - ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - '”17”'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of PowerShell cmdlets aimed at disabling or modifying Event Tracing for Windows (ETW) trace sessions. The behaviors targeted by this detection indicate that an attacker may be attempting to impair the effectiveness of security monitoring tools, thus allowing malicious activities to remain hidden. Such actions align with the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and **Impair Defenses** (T1650).

  The primary telemetry source for this detection is PowerShell script logs, specifically Script Block Logging, which must be enabled to capture relevant cmdlet activities. If malicious, these actions could significantly impact the security posture of the organization by preventing the logging of crucial security events. However, it is important to clarify that this detection alone does not confirm malicious intent; legitimate administrative or troubleshooting activities may also trigger it.

  ### Investigation Steps

  - **Check PowerShell logs for script execution:** Review PowerShell Script Block logs for Security Event ID 4104 to identify the specific cmdlets executed, focusing on those containing `Remove-EtwTraceProvider` and `Set-EtwTraceProvider` commands.

  - **Validate the context of cmdlet usage:** Cross-reference the timestamps of the detected cmdlets with recent administrative or monitoring activities to determine if the actions align with expected behavior. Legitimate system administrators may run ETW commands as part of troubleshooting but should have known business justifications.

  - **Determine who executed the command:** Use Windows Security Event ID 4688 to identify the account that executed the PowerShell script. Look for unusual or unauthorized user accounts, particularly those with non-interactive logins.

  - **Review the output of ETW traces:** Validate the status of existing ETW trace sessions (using `Get-EtwTraceProvider`) to investigate if any critical providers have been disabled or modified, indicating potential evasion efforts.

  - **Identify the affected systems:** Assess if the affected system is a critical asset (e.g., domain controllers, file servers) or less critical devices (e.g., user workstations). The impact of such actions may vary based on the role and severity of the asset in the environment.

  - **Examine concurrent activities or anomalies:** Monitor for other security alerts that relate to lateral movement or privilege escalation activities occurring around the same timeframe, which may indicate a broader attack attempt.

  ### Prioritization

  This alert is of high severity as it involves potential manipulation of logging mechanisms that are indispensable for incident detection and response. The likelihood of abuse is considerable, especially since disabling ETW is a common tactic employed by advanced adversaries during offensive operations.

  ### Blind Spots and Assumptions

  This detection may be limited by the active configuration of PowerShell logging. If Script Block Logging is not enabled, these commands can go undetected. Legitimate administrative actions, such as routine maintenance or troubleshooting, might inadvertently trigger this alert. A related detection to consider is any unusual activity linked to the `Get-EtwTraceProvider` cmdlet as it may indicate attempts to assess the current logging configuration prior to tampering.

