logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_pwsh_remove:     # Autologger provider removal
    ScriptBlockText|contains: 'Remove-EtwTraceProvider '
  selection_pwsh_set:     # Provider “Enable” property modification
    ScriptBlockText|contains|all:
    - 'Set-EtwTraceProvider '
    - '0x11'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable or modify Event Tracing for Windows (ETW) trace sessions using PowerShell cmdlets. ETW is a critical logging mechanism that provides insight into system and application events, and an attacker may seek to interfere with it to evade detection or hinder forensic efforts during or post-attack. The relevant MITRE ATT&CK tactics and techniques impacted include Defense Evasion (T1562.006) and Indicator Removal on Host (T1070).

  Primary telemetry sources are PowerShell script logs, specifically entries generated when conditions for Script Block Logging are satisfied. If the alert corresponds to a malicious action, it could severely impede incident response efforts by obscuring evidence of compromise. This detection alone does not confirm that an attack has occurred; further context and investigation are required to assess malicious intent.

  ---

  ### Investigation Steps

  - **Review PowerShell logs for activity:** Analyze Security Event ID 4104 to identify any instances of script block logging that show usage of 'Remove-EtwTraceProvider' or 'Set-EtwTraceProvider 0x11'. Malicious indicators include the presence of these cmdlets without legitimate operational context.

  - **Correlate with network activity:** Investigate related network traffic in your firewall logs (e.g., destination IPs in connection logs) for outgoing communications immediately before or after the detection. Legitimate administrative actions might not show irregular outbound communication patterns.

  - **Assess ETW session status:** Examine ETW sessions using the command `wevtutil enum-sessions` or `Get-WinEvent -ListLog *` to verify if any legitimate sessions were recently disabled or altered. If no legitimate administrative changes were expected, this could indicate malicious intent.

  - **Cross-verify with known scheduled tasks:** Check if any automated tasks (Task Scheduler logs, Event ID 106) with high privileges were scheduled or altered recently that could lead to manipulation of ETW settings. Legitimate administrative tasks typically adhere to established change windows.

  - **Investigate provenance of PowerShell execution:** Review the parent processes of the PowerShell instances from the logs. If PowerShell was executed from an unusual parent process (e.g., a non-administrative application), this could suggest suspicious behavior or an exploitation vector aligned with malicious intents.

  - **Identify any ongoing active incidents:** If the system is critical (e.g., domain controllers, SIEM servers), correlate this detection with alerts from other systems (e.g., antivirus, IDS/IPS) to understand if there's a broader attack in progress targeting multiple systems.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on critical logging mechanisms that are essential for security monitoring and incident response. The likelihood of malicious exploitation is significant, given the commonly weaponized nature of disabling logging to cover tracks in prior incidents. The immediate environment must prioritize this investigation to mitigate any potential breach.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited if Script Block Logging is not enabled, or if the logs are not being forwarded to a centralized logging system. Legitimate administrative users might invoke similar PowerShell commands for maintenance or troubleshooting, which can erroneously trigger this alert. A related detection that strengthens overall coverage is monitoring for alterations to Windows Event logs (T1070) to identify parallel attempts to obscure evidence.

