title: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
status: experimental
description: Detects the use of the "Get-ADComputer" cmdlet in order to identify systems
  which are configured for unconstrained delegation.
references:
- https://pentestlab.blog/2022/03/21/unconstrained-delegation/
- https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2022-ps
author: frack113
date: 2025-03-05
tags:
- attack.reconnaissance
- attack.discovery
- attack.credential-access
- attack.t1018
- attack.t1558
- attack.t1589.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enable'
detection:
  selection:
    ScriptBlockText|contains:
    - '-Properties*TrustedForDelegation'
    - '-Properties*TrustedToAuthForDelegation'
    - '-Properties*msDS-AllowedToDelegateTo'
    - '-Properties*PrincipalsAllowedToDelegateToAccount'
    - '-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)'
  condition: selection
falsepositives:
- Legitimate use of the library for administrative activity
level: medium
note: |
  ---

  ### Technical Context

  The rule detects the use of the PowerShell cmdlet `Get-ADComputer` configured to query Active Directory for computer accounts with unconstrained delegation properties. This behavior is typically associated with reconnaissance by attackers seeking to exploit design flaws in delegation settings, enabling them to impersonate other users or services within the network. Relevant MITRE ATT&CK techniques include **Discovery (T1018)** and **Credential Access (T1558.002)**, specifically in the context of Active Directory environments.

  The primary telemetry source for this detection is PowerShell script block logging, specifically capturing `ScriptBlockText` that contains certain properties related to delegation. If malicious, the impact could be severe, enabling attackers to leverage authentications on behalf of users whose accounts are misconfigured. However, this detection does NOT definitively prove malicious intent on its own since legitimate administrative activities may also trigger it.

  ---

  ### Investigation Steps

  - **Review PowerShell history:** Identify recent executions of PowerShell commands related to `Get-ADComputer` using Security Event ID 4104 for script block logging, focusing on `-Properties` parameters that indicate querying delegation settings.

  - **Examine the targeted systems:** Determine if the affected computers are critical servers or domain controllers by cross-referencing the detected computer names with organizational asset inventories.

  - **Identify typical legitimate usage:** Note that legitimate administrative tasks may involve querying delegation settings to audit configurations; corroborate this with expected operational schedules and administrative roles.

  - **Search for malicious indicators:** Look for repeated queries or patterns in `ScriptBlockText` that indicate active enumeration attempts; high-confidence indicators include multiple executions within a short time frame targeting various computer accounts.

  - **Assess user context:** Investigate the user or service account executing the command; cross-reference with account activity logs (Event IDs 4624 and 4625) to verify if the user has appropriate privileges or a historical pattern of similar queries.

  - **Correlate with related detections:** Review other alerts for credential access or lateral movement techniques (e.g., logging failures or suspicious logins), as they may indicate a broader compromise attempt.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive credential configurations in Active Directory and the likelihood of genuine misuse by adversaries. Unconstrained delegation is a common target for attackers aiming to pivot within environments, making this behavior particularly concerning.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments not enabling PowerShell script block logging, reducing visibility into such commands. Legitimate administrative actions, like security audits, might inadvertently trigger this alert. Companion detections, such as monitoring for failed authentication attempts (Event ID 4771), can help better assess potential malicious activity linked to this behavior.

