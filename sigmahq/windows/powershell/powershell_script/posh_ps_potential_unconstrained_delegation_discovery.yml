title: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
status: experimental
description: Detects the use of the "Get-ADComputer" cmdlet in order to identify systems
  which are configured for unconstrained delegation.
references:
- https://pentestlab.blog/2022/03/21/unconstrained-delegation/
- https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2022-ps
author: frack113
date: 2025-03-05
tags:
- attack.reconnaissance
- attack.discovery
- attack.credential-access
- attack.t1018
- attack.t1558
- attack.t1589.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enable'
detection:
  selection:
    ScriptBlockText|contains:
    - '-Properties*TrustedForDelegation'
    - '-Properties*TrustedToAuthForDelegation'
    - '-Properties*msDS-AllowedToDelegateTo'
    - '-Properties*PrincipalsAllowedToDelegateToAccount'
    - '-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)'
  condition: selection
falsepositives:
- Legitimate use of the library for administrative activity
level: medium
note: |
  ### Technical Context
  This rule detects the use of the PowerShell cmdlet `Get-ADComputer`, specifically targeting parameters related to the delegation settings of Active Directory (AD) computers. Attackers may leverage this cmdlet to discover computers configured for unconstrained delegation, which can potentially lead to credential theft and lateral movement within the network. By identifying systems that allow impersonation of users, attackers can manipulate authentication processes, gaining unauthorized access to sensitive resources.

  The scenario involves a threat actor performing reconnaissance to identify targets within an enterprise network that are susceptible to credential theft using unconstrained delegation. Relevant MITRE ATT&CK tactics include **Reconnaissance (TA0043)** and **Discovery (TA0007)**. More specifically, the techniques applicable here are **Credential Access (T1003)**, **Active Directory Enumeration (T1018)**, and **Permission Groups Discovery (T1589.002)**.

  The primary data sources for this detection are Windows PowerShell logs, particularly script block logging. This logging will capture any executed scripts, including command-line arguments and the properties queried, offering valuable insights into both legitimate administrative operations and possible malicious activities.

  ### Investigation Steps
  - **Review PowerShell Script Logs:** Analyze PowerShell script block logs for the execution of the `Get-ADComputer` cmdlet, focusing on potentially malicious parameters that indicate attempts to discover delegation configurations.

  - **Examine Active Directory Logs:** Check Active Directory logs for any unusual querying of computer objects, especially for delegation properties. Pay attention to the frequency and source of these requests, as they may indicate unauthorized reconnaissance activity.

  - **Identify User Context and Source:** Determine the user account that executed the PowerShell command. Investigate whether this account has a legitimate need for accessing delegation settings, and analyze the session context (e.g., where the command was run from).

  - **Assess Delegation Configurations**: Review the Active Directory delegation settings for identified computers. Analyze whether any computers are configured for unconstrained delegation and consider the associated risk and potential exposure.

  ### Prioritization
  This alert carries a medium severity due to its ability to indicate potential pre-attack activity that could lead to high-impact compromise of user and system credentials. Given the likelihood of exploitation of unconstrained delegation settings, timely investigation and response are critical to maintaining organizational security.

  ### Blind Spots and Assumptions
  The detection logic relies on PowerShell script block logging being enabled, which may not be universally configured in all enterprise environments. There is an assumption that attacks utilizing such reconnaissance techniques will trigger PowerShell logging; however, if attackers employ other scripting methods or obfuscate their commands, these actions may go undetected. Additionally, benign administrative uses of the `Get-ADComputer` cmdlet may generate false positives if not contextualized by user intent and activity history.

