title: Potential Unconstrained Delegation Discovery Via Get-ADComputer - 
  ScriptBlock
id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
status: experimental
description: Detects the use of the "Get-ADComputer" cmdlet in order to identify
  systems which are configured for unconstrained delegation.
references:
- https://pentestlab.blog/2022/03/21/unconstrained-delegation/
- https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2022-ps
author: frack113
date: 2025-03-05
tags:
- attack.reconnaissance
- attack.discovery
- attack.credential-access
- attack.t1018
- attack.t1558
- attack.t1589.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enable'
detection:
  selection:
    ScriptBlockText|contains:
    - '-Properties*TrustedForDelegation'
    - '-Properties*TrustedToAuthForDelegation'
    - '-Properties*msDS-AllowedToDelegateTo'
    - '-Properties*PrincipalsAllowedToDelegateToAccount'
    - '-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)'
  condition: selection
falsepositives:
- Legitimate use of the library for administrative activity
level: medium
regression_tests_path: 
  regression_data/rules/windows/powershell/powershell_script/posh_ps_potential_unconstrained_delegation_discovery/info.yml
note: |
  ### Technical Context

  This rule detects the invocation of the PowerShell cmdlet "Get-ADComputer," specifically searching for computer objects configured for unconstrained delegation by checking for specific properties associated with delegation settings. The likely attacker objective is to enumerate systems that can exhibit insecure delegation behaviors, potentially facilitating credential theft or lateral movement. This aligns with the MITRE ATT&CK tactics of Reconnaissance (T1592) and Credential Access (T1558).

  Primary telemetry sources include Windows PowerShell logs with Script Block Logging enabled. A successful detection would indicate potential reconnaissance operations by an adversary, enabling them to exploit insecure delegation configurations. Notably, this detection does NOT confirm that an attack has occurred; it simply indicates a potential reconnaissance activity that requires further investigation.

  ### Investigation Steps

  - **Review PowerShell logs:** Check for Event ID 4104 in the Windows PowerShell log to see if the "Get-ADComputer" cmdlet was executed with parameters indicating delegation properties.

  - **Validate script execution context:** Identify the user account running the cmdlet, looking for administrative accounts or unusual user behavior that raises suspicion (e.g., Event ID 4624 for logon events).

  - **Identify benign usage:** Confirm whether the cmdlet usage aligns with normal administrative or support activities within the environment, particularly during scheduled maintenance.

  - **Check delegation settings:** For the identified computer objects, review attributes for 'TrustedForDelegation' or 'msDS-AllowedToDelegateTo' to assess their configurations—use LDAP queries for detailed assessments.

  - **Investigate lateral movement potential:** Look for Logon Events (Event ID 4624) using service accounts, as they may take advantage of misconfigured delegation to perform lateral movements.

  - **Document any high-confidence indicators:** If the cmdlet is used in a non-administrative context or unexpectedly on systems that do not typically require delegation, flag this as a high-confidence malicious indicator.

  ### Prioritization

  The severity of this alert is medium, as it highlights a potentially serious reconnaissance activity targeting systems with weak security configurations. The likelihood of malicious abuse is moderate since the behavior can lead to credential theft or privilege escalation, albeit often used in legitimate administrative contexts.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities that also involve delegation inquiries. Evasion techniques might include altering PowerShell execution contexts or bypassing logging altogether if Script Block Logging is not correctly configured. It is crucial to verify that Script Block Logging is enabled for accurate detection, and companion detections involving abnormal access patterns to sensitive Active Directory objects would enhance visibility and security posture.

