title: Potential Unconstrained Delegation Discovery Via Get-ADComputer - 
  ScriptBlock
id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
status: experimental
description: Detects the use of the "Get-ADComputer" cmdlet in order to identify
  systems which are configured for unconstrained delegation.
references:
- https://pentestlab.blog/2022/03/21/unconstrained-delegation/
- https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer?view=windowsserver2022-ps
author: frack113
date: 2025-03-05
tags:
- attack.reconnaissance
- attack.discovery
- attack.credential-access
- attack.t1018
- attack.t1558
- attack.t1589.002
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enable'
detection:
  selection:
    ScriptBlockText|contains:
    - '-Properties*TrustedForDelegation'
    - '-Properties*TrustedToAuthForDelegation'
    - '-Properties*msDS-AllowedToDelegateTo'
    - '-Properties*PrincipalsAllowedToDelegateToAccount'
    - '-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)'
  condition: selection
falsepositives:
- Legitimate use of the library for administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects the invocation of the `Get-ADComputer` PowerShell cmdlet with specific parameters that query Active Directory for computers configured for unconstrained delegation. This behavior typically indicates an attacker attempting to enumerate potential targets that allow delegation, which can be leveraged for credential theft in an environment. The relevant MITRE ATT&CK tactics and techniques include **Reconnaissance (TA0043)** and **Credential Access (TA0006)**, particularly techniques **T1018: Remote System Discovery** and **T1558: Credential Dumping**. The primary telemetry sources include PowerShell script block logs, which must be enabled for accurate detection, as well as Security Event IDs related to PowerShell execution. If malicious, this could significantly compromise security by exposing credential delegation vulnerabilities. Importantly, this detection does NOT confirm that an attack has successfully occurred; it merely indicates reconnaissance activity may be happening.

  ### Investigation Steps

  - **Check PowerShell log entries:** Review PowerShell Script Block logging for Activity ID associated with `Get-ADComputer`. Look for Script Block Text containing terms like `-Properties*TrustedForDelegation` and `-LDAPFilter*(userAccountControl:1.2.840.113556.1.4.803:=524288)` (Event IDs: 4104).

  - **Correlate with user context:** Identify the user or service account that executed the command. Ensure the user has legitimate administrative rights and validate their recent actions in Security Event logs (Event ID: 4688) against expected administrative tasks.

  - **Identify malicious intent:** Low-frequency or unexpected queries to `Get-ADComputer` with delegation properties from non-IT or non-admin users can indicate reconnaissance. Identify and flag these queries as high-confidence malicious indicators.

  - **Review recent changes in account configurations:** Examine the Active Directory settings of the queried computer accounts for any recent adjustments to delegation settings. Confirm expected configurations match legitimate administrative changes.

  - **Assess legitimate uses:** Evaluate historical script execution patterns involving `Get-ADComputer` within the environment. Document regular administrative tasks that require the use of this cmdlet to differentiate between benign and suspicious activities.

  ### Prioritization

  This alert is classified as medium severity due to the potential exposure of sensitive credential delegation configurations. If confirmed as malicious, it could enable attackers to exploit delegation weaknesses for further lateral movement within the environment. While reconnaissance behaviors like this are common, they are often precursors to more serious credential theft or access attempts.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where PowerShell transcription is disabled or if the attacker utilizes non-standard methods for enumeration. Script Block logging is essential for accurate detection, and without it, this alert may not trigger. Legitimate administrative activities, especially during audits or configuration reviews, can inadvertently trigger this alert. Companion detections such as monitoring for `Set-ADComputer` usage could enhance coverage against credential delegation misuse.

