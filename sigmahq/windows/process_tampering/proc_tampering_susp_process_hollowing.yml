title: Potential Process Hollowing Activity
id: c4b890e5-8d8c-4496-8c66-c805753817cd
status: test
description: Detects when a memory process image does not match the disk image, indicative
  of process hollowing.
references:
- https://twitter.com/SecurePeacock/status/1486054048390332423?s=20
- https://www.bleepingcomputer.com/news/microsoft/microsoft-sysmon-now-detects-malware-process-tampering-attempts/
author: Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Sittikorn S
date: 2022-01-25
modified: 2023-11-28
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055.012
logsource:
  product: windows
  category: process_tampering
detection:
  selection:
    Type: 'Image is replaced'
  filter_main_generic:
    Image|contains:
    - ':\Program Files (x86)'
    - ':\Program Files\'
    - ':\Windows\System32\wbem\WMIADAP.exe'
    - ':\Windows\SysWOW64\wbem\WMIADAP.exe'
  filter_optional_opera:
    Image|contains: '\AppData\Local\Programs\Opera\'
    Image|endswith: '\opera.exe'
  filter_optional_edge:
    Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potential process hollowing activities, a technique commonly used in malware and advanced persistent threat (APT) attacks to inject malicious code into legitimate processes. When an attacker exploits a process memory to replace its original image with a malicious one, it may evade detection by security solutions, allowing for unauthorized code execution without raising suspicion. This tactic is employed to maintain persistence and escalate privileges, which can lead to data exfiltration or further network compromise.

  The relevant MITRE ATT&CK tactics and techniques for this behavior include **Defense Evasion** (T1562) and **Privilege Escalation** (T1068), specifically related to **Process Injection** (T1055.012). Understanding these techniques can help analysts recognize the implications of the alert and prioritize their response accordingly.

  Primary data sources for this detection include **process creation events**, which log details on running processes, **Windows event logs**, particularly those from Sysmon that track process image loading, and potentially **antivirus and endpoint detection results** if they are configured to highlight anomalies in memory integrity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events for instances where a legitimate process image has been altered with an unusual image path, particularly targeting known locations such as `C:\Program Files` or `C:\Windows\System32`.

  - **Analyze Sysmon Logs**: Utilize Sysmon to filter logs for any events of process image replacement. Focus on comparing the in-memory image hash against the executable on disk to confirm discrepancies.

  - **Investigate Related Network Activity**: Check for suspicious outbound connections initiated by the affected processes, especially those running from non-standard paths or those performing unusual tasks that align with potential malicious activity.

  - **Correlate with User Activity**: Cross-reference Windows Security Event logs to identify any anomalous user sessions or elevated privileges at the time the process anomaly occurred, as this may indicate a deliberate attempt to exploit a legitimate session.

  ### Prioritization
  The severity of this alert is medium due to the high likelihood that process hollowing indicates malicious activity attempting to evade detection mechanisms. In an enterprise environment, such behavior poses a significant risk as it can lead to unauthorized access and data breaches.

  ### Blind Spots and Assumptions
  This detection method assumes that the Sysmon logging level is adequately configured to capture process image integrity events. One significant blind spot may be the potential for benign applications to exhibit similar behavior during legitimate operations, leading to false positives. Additionally, if Sysmon or other monitoring tools are not in place or misconfigured, the detection will not function properly, leaving the organization vulnerable to such stealthy threats.

