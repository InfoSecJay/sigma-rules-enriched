title: Potential Process Hollowing Activity
id: c4b890e5-8d8c-4496-8c66-c805753817cd
status: test
description: Detects when a memory process image does not match the disk image, 
  indicative of process hollowing.
references:
- https://twitter.com/SecurePeacock/status/1486054048390332423?s=20
- https://www.bleepingcomputer.com/news/microsoft/microsoft-sysmon-now-detects-malware-process-tampering-attempts/
author: Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Sittikorn S
date: 2022-01-25
modified: 2023-11-28
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055.012
logsource:
  product: windows
  category: process_tampering
detection:
  selection:
    Type: 'Image is replaced'
  filter_main_generic:
    Image|contains:
    - ':\Program Files (x86)'
    - ':\Program Files\'
    - ':\Windows\System32\wbem\WMIADAP.exe'
    - ':\Windows\SysWOW64\wbem\WMIADAP.exe'
  filter_optional_opera:
    Image|contains: '\AppData\Local\Programs\Opera\'
    Image|endswith: '\opera.exe'
  filter_optional_edge:
    Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential process hollowing activity by identifying discrepancies between the process memory image and the disk image of specific executables. The likely objective of an attacker using process hollowing is to inject malicious code into a legitimate process, allowing them to evade detection by security products or maintain persistence. This aligns with the MITRE ATT&CK technique for process injection (T1055.012).

  The primary telemetry sources for this detection are Windows Sysmon logs, specifically targeting Event ID 10, which captures process creation events, including image replacement scenarios. If malicious, this behavior can lead to unauthorized code execution and system compromise. Importantly, this detection does NOT confirm malicious activity on its own; legitimate applications may also modify their memory images for valid reasons.

  ### Investigation Steps

  - **Review Sysmon Event ID 10 logs**: Look for entries where the "Image" field indicates that the process image has been replaced, particularly for common application paths like 'C:\Program Files (x86)' or 'C:\Windows\System32\wbem\WMIADAP.exe'.

  - **Check for unexpected process injections**: Investigate the parent process associated with the hollowed process. If the parent is a known legitimate application (like "svchost.exe" running from a standard location), it might be benign; however, if the parent is suspicious or unknown, it warrants deeper investigation.

  - **Correlate with other telemetry**: Review Windows Security Event ID 4688 (Process Creation) to analyze command line arguments associated with the hollowed process. Malicious processes might include unusual arguments or commands indicating exploitation attempts.

  - **Assess the process's file structure**: Examine the file system for the actual executable mentioned in the Sysmon alert. Compare the hash of the disk image against known threat intelligence to confirm if the file is recognized as malicious.

  - **Cross-reference with threat intelligence feeds**: Use file hashes, paths, and process names from the alert to check against threat intelligence databases. A high-confidence indicator would be known malicious hashes associated with the process being executed.

  - **Determine legitimate behavior**: Identify instances of legitimate software running from AppData or other user directories that might trigger this rule. Compare with previously established baselines of expected operation within the environment.

  ### Prioritization

  This alert holds medium severity due to potential impacts on sensitive systems if successful exploitation occurs. The likelihood of malicious abuse is high, as process hollowing is a well-known technique employed in various malware campaigns, particularly for lateral movement and persistence.

  ### Blind Spots and Assumptions

  Detection might be limited by the absence of configured Sysmon monitoring on all endpoints, specifically the Event ID 10, which is crucial for this detection. Evasion techniques, such as legitimate process modifications or software using memory patching for updates, could trigger false positives. Additionally, legitimate application behaviors, such as updates or performance tuning, might be mistaken for malicious process hollowing. A related detection to consider is Sysmon Event ID 11 (ProcessAccess), which could provide further context on memory manipulation activity.

