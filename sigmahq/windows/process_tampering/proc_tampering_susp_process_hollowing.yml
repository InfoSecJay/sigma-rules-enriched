title: Potential Process Hollowing Activity
id: c4b890e5-8d8c-4496-8c66-c805753817cd
status: test
description: Detects when a memory process image does not match the disk image, 
  indicative of process hollowing.
references:
- https://twitter.com/SecurePeacock/status/1486054048390332423?s=20
- https://www.bleepingcomputer.com/news/microsoft/microsoft-sysmon-now-detects-malware-process-tampering-attempts/
author: Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Sittikorn S
date: 2022-01-25
modified: 2023-11-28
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055.012
logsource:
  product: windows
  category: process_tampering
detection:
  selection:
    Type: 'Image is replaced'
  filter_main_generic:
    Image|contains:
    - ':\Program Files (x86)'
    - ':\Program Files\'
    - ':\Windows\System32\wbem\WMIADAP.exe'
    - ':\Windows\SysWOW64\wbem\WMIADAP.exe'
  filter_optional_opera:
    Image|contains: '\AppData\Local\Programs\Opera\'
    Image|endswith: '\opera.exe'
  filter_optional_edge:
    Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts at process hollowing, where the memory image of a running process differs from its original disk image. This behavior is indicative of an attacker compromising a legitimate process to execute malicious code stealthily, allowing them to evade detection. The likely attacker objective is to establish persistence or execute payloads while leveraging trusted processes.

  Relevant MITRE ATT&CK tactics and techniques include Privilege Escalation (TA0004) and Process Injection (T1055.012). The primary telemetry sources required include Windows Security Event logs (Event ID 4688) and Sysmon logs (Event ID 10, related to process tampering). The security impact of a successful hollowing attack could result in unauthorized access, data exfiltration, or additional exploitation of the compromised system. Importantly, this detection alone does not confirm malicious activity; it merely signals a potential compromise requiring further investigation.

  ### Investigation Steps

  - **Identify potential malicious processes: **Review Sysmon Event ID 10 logs for processes with memory images that do not match their disk images, especially focusing on processes located in 'C:\Program Files' or 'C:\Windows\System32'.

  - **Correlate with process creation events:** Cross-reference Event ID 4688 logs to confirm the creation of associated processes. Look for patterns such as sudden spikes in process creation or unusual parent-child relationships indicative of process injection.

  - **Assess standard application behavior:** Examine historical baselines for legitimate processes such as `WMIADAP.exe` and `opera.exe`. Investigate any variance in file hashes or execution paths compared to known good configurations.

  - **Review for credible indicators of compromise (IoC):** Focus on any execution of processes replacing legitimate images that do not align with expected behavior, such as unexpected command line arguments or unusual execution times.

  - **Check for additional telemetry:** Utilize Windows Event logs to assess any anomalous account activity or user logins around the time of the potential hollowing event. Look for unauthorized user accounts interacting with high-value assets or resources.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential security impact associated with process hollowing, such as gaining unauthorized access or persistence. The likelihood of malicious abuse is significant, as attackers frequently employ this technique to conceal their activities within an environment. While not universally weaponized, process hollowing remains a commonly exploited method in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion using advanced techniques that can modify processes without triggering alerts. It is essential to ensure Sysmon is properly configured to capture all relevant events for effective monitoring. Legitimate activities, such as software updates or administrative tasks, may inadvertently trigger this alert. Companion detections, such as monitoring for unusual API calls or network traffic linked to legitimate processes, can strengthen overall coverage against this behavior.

