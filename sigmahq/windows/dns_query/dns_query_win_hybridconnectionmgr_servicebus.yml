note: |
  ### Technical Context

  This rule detects queries made by the Azure Hybrid Connection Manager to the Azure Service Bus, specifically looking for DNS queries containing "servicebus.windows.net." The likely objective of an attacker using this method would be to establish persistence in the network by creating a hidden channel for command and control (C2) communications or data exfiltration. The relevant MITRE ATT&CK tactic is Persistence, and the technique is T1554: Compromise of Account or Service.

  The primary telemetry sources for this detection are DNS query logs collected from Windows environments. The security impact would be significant if malicious, as it can indicate an attempt to maintain unauthorized access to the network, circumventing standard security measures. It's critical to note that this detection does NOT confirm malicious activity on its own, as legitimate use of the Azure Hybrid Connection Manager may trigger this alert.

  ### Investigation Steps

  - **Review DNS query logs for related activity:** Analyze DNS query logs specifically for Event ID 21 from the DNS server (standard DNS events) or Windows logs to locate instances of "servicebus.windows.net" queried by the HybridConnectionManager process. Benign instances may align with known Azure application behavior.

  - **Validate the presence of the HybridConnectionManager process:** Use Process Explorer or Sysinternals tools to confirm if the HybridConnectionManager is running on the system. Legitimate use will typically coincide with administrative Azure tasks or known applications.

  - **Cross-reference user activities:** Check the Azure activity logs or any relevant application logs to see if credentials or accounts used to invoke this process have legitimate access patterns consistent with Azure usage. Malicious indicators may include unexpected access times or unfamiliar user accounts.

  - **Identify anomalies in surrounding DNS queries:** Inspect the context of DNS queries made by the HybridConnectionManager for unusual patterns or repetitive queries, which could indicate automation used by a potential threat actor. Nomal behavior often includes sporadic queries aligned with user actions.

  - **Check for outbound connection attempts:** Review firewall logs (Event ID 5156 on Windows) for outbound connections to servicebus.windows.net. High-volume or unusual connection attempts may indicate an active threat attempting to exfiltrate data or maintain remote access.

  ### Prioritization

  This alert is high severity due to the potential impact of compromised Azure services on business operations. The likelihood of malicious abuse is heightened as attackers often leverage such mechanisms for C2 communications, especially in cloud environments where traditional defenses are less effective. This behavior aligns with known strategies used by advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  The detection has potential blind spots, as attackers may use similarly named legitimate services to evade monitoring. Reliable detection requires DNS query logging and the appropriate configuration for Azure-related activities to ensure all events are captured. Legitimate activities that may trigger this alert include authorized administrative interactions with Azure services by trusted users or applications. A companion detection rule focusing on unauthorized outbound connections to Azure services may enhance coverage and further aid in investigation efforts.

