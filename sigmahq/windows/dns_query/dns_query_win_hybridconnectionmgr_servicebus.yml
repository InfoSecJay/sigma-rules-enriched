note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious DNS queries made by the Azure Hybrid Connection Manager, specifically those targeting the Azure service bus (`servicebus.windows.net`). The Hybrid Connection Manager facilitates secure connectivity to Azure services, enabling applications in on-premises environments to communicate with Azure. However, malicious actors may also exploit this service to establish persistence in an environment, potentially leading to data exfiltration or command and control (C2) communication.

  The primary threat scenario involves threat actors leveraging the Azure Hybrid Connection Manager to maintain access to compromised systems, conduct data exfiltration, or facilitate downstream attacks. As this service can connect on-premises applications to Azure seamlessly, a misconfiguration or unauthorized use can pose severe risks. Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and the technique **Valid Accounts** (T1554), which highlights the potential abuse of legitimate service tools for malicious purposes.

  The best evidence for this detection comes from DNS query logs that capture attempts made by the Hybrid Connection Manager to resolve Azure service endpoints. Monitoring process creation events that reference `HybridConnectionManager` may also yield insights into exploitation attempts.

  ### Investigation Steps
  - **Review DNS Query Logs:** Inspect logs for queries containing `servicebus.windows.net` to identify any unauthorized attempts to connect to Azure Service Bus from the Hybrid Connection Manager.
  - **Analyze Process Creation Events:** Look for instances of `HybridConnectionManager.exe` being executed, specifically under unusual user accounts or at non-standard times which may indicate malicious activity.
  - **Correlate with Azure Activity Logs:** Cross-reference findings with Azure activity logs to determine if suspicious service bus activities are being performed by accounts that should not have access.
  - **Check Network Traffic:** Monitor for outgoing connections from your network that align with Azure service bus traffic, as unexpected outbound connections may indicate data exfiltration efforts.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of unauthorized access and the risk of data exfiltration or C2 activities tied to the Azure Hybrid Connection Manager, which can compromise the integrity of your entire Azure-environment.

  ### Blind Spots and Assumptions
  The detection logic relies on the presence of logs for DNS queries and process creation events. There may be blind spots if DNS logs are not adequately captured or if legitimate usage patterns create noise, possibly leading to false positives. Additionally, the logic assumes that the `HybridConnectionManager` process will only be used legitimately, potentially overlooking compromised systems where attackers have gained persistent access. For accurate detection, ensure logging for DNS queries is enabled and configured properly at the network perimeter and on endpoints.

