note: |
  ### Technical Context

  This Sigma rule detects DNS query requests targeting domains associated with Visual Studio Code (VS Code) tunnels, specifically those ending in `.tunnels.api.visualstudio.com`. Attackers may exploit this feature to establish command and control (C2) channels or maintain persistence on a compromised system. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001).

  The primary telemetry source is Windows DNS query logs, where the query name corresponds to the aforementioned domain. If the activity is malicious, it could indicate that an adversary is attempting to create a stealthy C2 connection through a legitimate service. Importantly, this detection does not confirm a successful compromise on its own, as legitimate users could also be utilizing the VS Code tunneling feature.

  ### Investigation Steps

  - **Examine DNS Query Logs:** Review Windows DNS logs (Event ID DnsQuery) for queries to *.tunnels.api.visualstudio.com. Look for abnormal frequencies or sourcing from unrecognized endpoints, which could indicate a malicious connection.

  - **Assess User Activity Context:** Check user accounts associated with DNS queries to determine if the activity aligns with normal usage of VS Code and legitimate development activity. Legitimate use typically involves authenticated sessions over prolonged periods.

  - **Identify Anomalous Network Patterns:** Cross-reference with network flow logs for outbound connections to the tunnel domains. Log types may include Windows Firewall logs or network traffic captures. Speculate whether the IPs are in known good lists or if they correlate with suspicious behavior.

  - **Validate Host Configuration and Software Use:** Confirm that the involved host is indeed utilized for development, performing tasks consistent with VS Code deployment. If the device is in a sensitive environment or serves critical functions, raise the priority for incident response.

  - **Check for Associated Artifacts:** Look for evidence of application crashed logs or other behaviors linked to possible exploitation of VS Code tools. Review logs for signs of unauthorized modifications or unusual process activities (e.g., unusual process trees).

  - **Follow Up with Endpoint Detection Reports:** Review any alerts from endpoint protection solutions that monitor for unauthorized tunneling solutions or abnormal process behaviors, as these can indicate a broader malicious campaign.

  ### Prioritization

  The alert has medium severity due to the potential impact on systems involved in software development, which could lead to unauthorized data exfiltration or remote access by an attacker. While usage of the VS Code tunnel can be legitimate, its exploitation for C2 is known and can be weaponized, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate usage of VS Code tunneling will naturally trigger alerts and may lead to false positives. A critical requirement is to ensure that DNS query logging is properly configured and enabled across all relevant systems. Furthermore, activity such as developers accessing cloud-based resources may inadvertently generate similar alerts, requiring contextual understanding for accurate triage. Companion detections include alerts monitoring for anomalous outbound traffic to unexpected external domains, enhancing overall visibility for malicious behavior.

