note: |
  ### Technical Context
  This detection rule identifies DNS query requests directed towards domains associated with Visual Studio Code tunnels (specifically `.tunnels.api.visualstudio.com`). Attackers may exploit this functionality to establish reverse shells or gain unauthorized access to a machine, effectively allowing them to bypass traditional security measures. A compromised environment could lead to data exfiltration or persistence mechanisms where the attacker can maintain access over time.

  This behavior aligns with the following MITRE ATT&CK tactics and techniques:
  - **Command and Control** (TA0011)
    - **Application Layer Protocol** (T1071.001)

  The primary data sources relevant for this detection include DNS query logs that record outbound DNS requests from enterprise networks. Analysts should be aware that legitimate use of Visual Studio Code tunnels, particularly in development environments, may trigger this detection, underscoring the need for contextual analysis.

  ### Investigation Steps
  - **Collect DNS Logs**: Retrieve the DNS query logs from the relevant security tools or DNS servers to identify instances where queries to `.tunnels.api.visualstudio.com` were made during anomalous or unexpected behaviors.

  - **Analyze Outbound Connections**: Review outbound connection logs (e.g., from a Next-Gen Firewall or proxy) to see if any other suspicious connections occur in conjunction with the DNS queries related to Visual Studio Code tunnel domains.

  - **Inspect Process Creation Events**: Look for unusual process creation events that coincide with the DNS queries to identify any malicious or unauthorized applications attempting to establish reverse shells.

  - **Review User Activity**: Investigate user activity and access logs around the time of the DNS queries to determine if there were any suspicious login attempts or lateral movements within the network correlating with these queries.

  ### Prioritization
  Given the potential for attackers to use Visual Studio Code tunnels for command and control operations and data exfiltration, alerts generated by this rule should be prioritized as medium severity. The impact can be significant, particularly if the queries can be linked to unauthorized access or exfiltration efforts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate development activity, as legitimate users may also trigger this alert when using Visual Studio Code tunnels for their intended purposes. The detection logic assumes that DNS queries to these tunnel domains are not a standard part of normal operations, which may not hold true in highly collaborative development environments. Adequate logging of DNS queries is essential for this detection to function effectively, along with correctly configured logging to capture all relevant traffic.

