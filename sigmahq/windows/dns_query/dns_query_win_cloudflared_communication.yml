note: |
  ### Technical Context
  This detection rule identifies DNS requests to specific Cloudflared tunnel domains, such as `.v2.argotunnel.com` and `trycloudflare.com`. These domains may indicate potential abuse by attackers attempting to establish reverse shells or maintain persistence on a compromised machine. In this scenario, an attacker leveraging Cloudflare tunnels can bypass traditional network defenses by creating covert communication channels back to their command-and-control (C2) infrastructure.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Command and Control** (TA0011): Attackers often rely on covert methods to communicate with compromised systems, and Cloudflared tunnels provide such a mechanism.
  - **Application Layer Protocol** (T1071.001): This technique describes using application layer protocols for C2 communications, potentially hiding malicious activity within normal application traffic.
  - **Non-Standard Port** (T1572): Attackers can use these tunnels to operate over non-standard ports, further obfuscating their activities.

  Primary data sources for this detection include DNS query logs from systems monitoring external domain resolution activities, which can reveal suspicious DNS requests made by endpoints.

  ### Investigation Steps
  - **Review DNS Logs**: Analyze the DNS query logs for requests to domains associated with Cloudflared tunnels that match the detection criteria. Look for anomalies in the source IP or the frequency of requests.
  - **Inspect Process Activity**: Check for any processes initiated just before the associated DNS requests that may indicate the creation or use of Cloudflared tunnels. Focus on unusual executables or processes with elevated privileges.
  - **Evaluate Network Traffic**: Capture and review outbound traffic that corresponds to the identified DNS requests. Check for connections on non-standard ports or unusual domains that align with known Cloudflared usage.
  - **Check for Persistence Mechanisms**: Investigate any potential persistence mechanisms within the environment that relate to Cloudflared or tunneling software. This includes examining startup items and scheduled tasks for entries related to these services.

  ### Prioritization
  The alert carries a medium severity due to the potential impact of a successful compromise resulting in unauthorized access and control of enterprise resources. Given the rising abuse of tunneling services, the likelihood of detection being related to nefarious activities necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The rule does not account for legitimate uses of Cloudflare tunnels, which may also trigger detections, resulting in potential false positives. It assumes a comprehensive logging capability that includes DNS query details and timely access to those logs. Additionally, the detection may miss malicious use of other tunneling methods or hidden DNS queries that utilize different obfuscation strategies, which necessitates broader monitoring and contextual analysis to validate alerts.

