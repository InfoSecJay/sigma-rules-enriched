note: |
  ### Technical Context

  This Sigma rule detects DNS requests made to known domains associated with Cloudflared tunnels, which can be exploited by attackers to create a reverse shell or maintain persistence within an environment. The objective of the attacker utilizing this functionality is often to bypass traditional security measures and establish a covert communication channel with compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) under technique T1071.001 (Application Layer Protocol: Web Protocols) and T1572 (Protocol Tunneling).

  The primary telemetry source for this detection is DNS query logs, specifically looking for requests that resolve to domains like `.v2.argotunnel.com`, `protocol-v2.argotunnel.com`, and others specified in the rule. If the behavior is determined to be malicious, it poses significant risks such as unauthorized data exfiltration or remote access to internal systems. It is important to note that this detection alone does not confirm malicious activity, as legitimate uses of Cloudflare tunnels may also generate similar DNS traffic.

  ### Investigation Steps

  - **Review DNS queries: **Analyze DNS query logs for Event ID DnsQuery to gather all instances of requests to detected Tunneling domains, focusing on timestamps and originating IP addresses.
  - **Correlate with other logs: **Cross-reference the identified DNS queries with Security Event ID 4688 or Sysmon Event ID 1 to determine if any unusual process creation correlates with the times of those DNS requests. Legitimate queries may often be associated with known business processes, such as dev/test environments using the tunnels.
  - **Check for remote connections: **Investigate Network Security logs for any outbound traffic that corresponds with the DNS request timestamps, particularly for TCP/UDP connections on ports commonly used for reverse shells (e.g., ports 443, 80). Look for connections to the IP addresses resolved from the detected domains.
  - **Look for persistence mechanisms: **Examine scheduled tasks (Event ID 4698) or scripts (PowerShell Event ID 4104) that may correspond with the tunnels, indicating potential attempts to establish persistence via automated commands.
  - **Identify high-confidence indicators: **Establish whether the DNS requests are associated with previously identified malicious IP addresses using threat intelligence feeds. Malicious activity may correlate with requests to identified Cloudflare tunneling domains.
  - **Document and report legitimate usage: **If found, document instances of legitimate business needs for Cloudflare tunnels so that these can be distinguished from potential abuse. This includes application name or user responsibilities.

  ### Prioritization

  Given the potential impact of Cloudflared tunnels on the security posture of an enterprise and the likelihood of such tunnels being weaponized for Command and Control purposes, this alert is prioritized as medium severity. Systems that show such behavior, especially if they handle sensitive data or critical functions, need immediate attention.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the availability of comprehensive DNS logging across all critical assets in the environment. Attackers may also utilize DNS-over-HTTPS (DoH) to conceal their activity, bypassing traditional DNS logging mechanisms. Certain legitimate applications or corporate development environments may trigger this alert due to the legitimate use of Cloudflare tunnels. Companion detections could include monitoring for anomalous outbound traffic patterns, or alerts for script execution related to process creation that utilizes tunneling protocols.

