  ### Technical Context

  This Sigma rule detects DNS queries that are initiated by `Regsvr32.exe`, a Windows utility typically used for registering and unregistering DLLs. The behavior of invoking DNS lookups through `Regsvr32.exe` may indicate an attempt to download malicious payloads, as attackers often use this legitimate tool to bypass security mechanisms such as application whitelisting. The relevant MITRE ATT&CK technique is Execution: Command and Scripting Interpreter (T1559.001) and the associated technique for stealthy execution is Application Layer Protocol: DNS (T1218.010).

  The primary telemetry source is Windows DNS query logs, specifically looking for process creation events linked to `Regsvr32.exe`. If this behavior is confirmed as malicious, it may allow an attacker to maintain persistence or execute payloads without raising immediate suspicion. However, this detection does NOT confirm malicious intent by itself; further investigation is necessary to ascertain the context of the DNS query.

  ### Investigation Steps

  - **Check DNS Query Details:** Review DNS query logs that correlate with `Regsvr32.exe` activity, focusing on Event ID  DNS Query log fields. Look for suspicious domains known to host malware or phishing attempts, such as domains with unusual characters or spelling variations.

  - **Review Process Execution Context:** Inspect Windows Security Event ID 4688 for instance, focusing on the command line arguments of `Regsvr32.exe` to determine if it was used with suspicious DLLs. Legitimate uses may involve `regsvr32.exe` being called with standard system DLLs (e.g., `msxml.dll`).

  - **Correlate with Additional Evidence:** Look for other network activity from the same host (e.g., firewall logs or web proxy logs) to confirm if there’s outbound traffic related to domains queried by `Regsvr32.exe`. High-confidence indicators of compromise may include connections to known malicious IP addresses.

  - **Inspect Related Processes:** Use Sysmon Event ID 1 to analyze other processes that have interacted with `Regsvr32.exe`. A chain of suspicious processes initiating connections may indicate a more extensive attack chain.

  - **Validate Asset Role:** Identify the role of the host generating the alert. Critical assets, such as domain controllers or finance servers, warrant immediate escalation due to the potential impact of a successful compromise.

  ### Prioritization

  The alert severity is medium. The potential impact is significant if a high-value or critical system is involved, as DNS queries from `Regsvr32.exe` could indicate attempts to download malicious payloads. The likelihood of abuse is notable, given that attackers frequently exploit legitimate tools for nefarious purposes, making this behavior a common tactic in modern attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of DNS logging; ensure that all relevant DNS logs are collected. Evasion techniques may include using alternative legitimate executables to initiate DNS queries. Legitimate activities such as network management scripts may also generate similar queries. Companion detections could include other applications frequently associated with stealthy network communications, such as `powershell.exe`, which could be linked through application behavior telemetry.

