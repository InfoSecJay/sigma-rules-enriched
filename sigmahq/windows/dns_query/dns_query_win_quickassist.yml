note: |
  ### Technical Context

  This Sigma rule detects DNS queries made by the Quick Assist application (`QuickAssist.exe`) specifically targeting Microsoft's Quick Assist endpoint (`remoteassistance.support.services.microsoft.com`). The behavior is indicative of the application being misused for remote support, potentially as part of social engineering attacks aiming to facilitate unauthorized access to systems, often leading to lateral movement or initial access for subsequent malicious actions.

  The relevant MITRE ATT&CK techniques include Command and Control (T1071.001) via application layer protocols and Initial Access through user interaction tactics (T1210). The primary telemetry sources are DNS query logs generated on Windows systems, which may contain the specific query names being resolved. If malicious, this behavior could allow threat actors to gain control over targeted machines or networks via unauthorized remote assistance. Importantly, this detection does NOT confirm malicious intent on its own, as Quick Assist can be legitimately used for technical support.

  ### Investigation Steps

  - **Review DNS query logs for Quick Assist:** Examine DNS query logs (Event ID  dns_query on Windows) to confirm requests to `remoteassistance.support.services.microsoft.com`. Look for the timestamp of the DNS query to correlate it with user activity.

  - **Identify the user executing Quick Assist:** Check if the DNS queries originate from a known user account or system role. Investigate the user’s account activity through Windows Security Event ID 4624 for logon details, noting unusual logon times or accounts.

  - **Assess for legitimate use of Quick Assist:** Determine if Quick Assist was initiated intentionally by a user in need of support. Review the Windows Event Logs for Event ID 4688 to find the creation of the `QuickAssist.exe` process and verify if there are any authorized support sessions documented.

  - **Verify endpoint IP resolution:** Perform an IP resolution check for the DNS queries and determine if the resolved IP addresses correspond to known legitimate Quick Assist services. Use the query and response logs for suspicious or unknown IPs that may indicate misuse.

  - **Look for additional suspicious commands:** Check for related PowerShell commands or scripts that might have been executed (Sysmon Event ID 4104) around the same timeframe as the DNS query. Indicators of misuse could include unusual commands executed towards network resources related to unauthorized access.

  ### Prioritization

  This alert has low severity but demonstrates potential risks, as it may indicate that Quick Assist is being misused for unauthorized remote access. Given the context of known social engineering tactics, it warrants careful scrutiny, especially in high-value assets or sensitive environments, to prevent the exploitation of the application.

  ### Blind Spots and Assumptions

  This detection may not pick up on variations of `QuickAssist.exe` or similar applications used for legitimate purposes, potentially leading to false negatives. Reliable detection relies on comprehensive DNS logging and proper configuration of alerting mechanisms. Legitimate activities like business-related remote support could trigger this alert. Complementary detections, such as monitoring for unusual outbound connections (T1071) after Quick Assist runs, provide better situational awareness.

