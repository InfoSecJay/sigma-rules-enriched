note: |
  ### Technical Context

  This rule detects DNS queries targeting ".onion" addresses and other related Tor network domains. Such behavior often indicates an attempt to establish communication with anonymous services, potentially for malicious purposes like data exfiltration, command and control operations, or accessing hidden services. The relevant MITRE ATT&CK technique is "Application Layer Protocol: Tor" (T1090.003).

  The primary telemetry source for this detection includes DNS query logs capturing the queried domains. If the DNS queries are malicious, the attacker's objective could align with obfuscating their actions to evade detection and maintain anonymity. It's essential to note that this detection does NOT confirm malicious intent on its own, as legitimate users may also query these domains for lawful reasons.

  ### Investigation Steps

  - **Validate DNS Query Logs:** Review DNS query logs for Event ID 22 in Windows DNS logs or Sysmon Event ID 23 to confirm the presence of requested ".onion" addresses. Look for unusual user accounts making these requests.

  - **Identify Malicious Indicators:** Examine the queried domains against known malicious ".onion" addresses from threat intelligence feeds. A match with known malicious indicators should escalate the alert for further investigation.

  - **Assess Frequency and Volume:** Check if there is an abnormal frequency of DNS queries related to ".onion" addresses using the Performance Monitor to correlate the volume (e.g., over 10 queries within a minute), which may indicate automated behavior (e.g., malware).

  - **Review Legitimate Use Cases:** Investigate if any known applications on the endpoint use Tor for legitimate purposes, such as privacy-focused web browsers or specific research tools, by analyzing installed software and network usage patterns.

  - **Correlate with Other Network Activities:** Cross-reference any identified ".onion" queries with other network activity logs, such as outbound connections or unusual processes (Sysmon Event ID 1), to identify possible data exfiltration or additional command and control activity.

  - **Assess Asset Criticality:** Consider the role of the affected system (e.g., a server vs. user workstation) and its relevance within the network. High-risk assets, such as servers managing sensitive data, require immediate incident response if they are associated with these queries.

  ### Prioritization

  The severity of this alert is high due to the potential for significant impacts on the organization from unauthorized access to hidden services. The likelihood of malicious abuse is notable, as querying ".onion" addresses is often weaponized for illicit purposes. Organizations should treat such alerts as high-priority for further investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate users to access Tor services for non-malicious reasons, which can lead to false positives. Organizations must ensure DNS logging is enabled and configured to capture all relevant queries for comprehensive coverage. Common legitimate activities that may inadvertently trigger this alert include research or use of privacy-focused applications. Related detection opportunities include monitoring for connections to Tor gateways as complementary coverage (potentially through firewall logs or additional network flow analysis).

