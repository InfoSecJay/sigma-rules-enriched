note: |
  ### Technical Context
  This detection rule identifies DNS queries made to addresses with the ".onion" suffix, which are associated with the Tor network, known for enabling anonymous communication. By targeting these URLs, the rule aims to uncover potential malicious activities, including the circumvention of organizational security measures or communications with malicious actors. Attackers may utilize Tor to access illicit services or anonymize their operations, making it imperative to monitor for such traffic in enterprise environments.

  The relevant MITRE ATT&CK tactics for this rule include "Command and Control" (TA0011) and the specific technique "Application Layer Protocol: Tor" (T1090.003). These techniques illustrate how threat actors may leverage the Tor network to establish covert communications with compromised systems or exfiltrate data undetected.

  Primary data sources include DNS query logs from network devices or endpoint security solutions, such as Sysmon logs, which capture detailed information about DNS resolutions, including timestamps, query types, and names.

  ### Investigation Steps
  - **Review DNS Query Logs:** Analyze logs for any entries resolving to ".onion" addresses or Tor-related domains. Pay special attention to repeated or unusual queries that may indicate automated tools or scripts in action.

  - **Correlate with Process Creation Events:** Check for any processes initiated around the time of the DNS queries that could suggest malicious tool usage, such as web browsers or custom scripts connecting to these Tor endpoints.

  - **Inspect Network Traffic Flows:** Use network detection tools to examine outbound connections made to Tor exit nodes. Look for patterns that may indicate data exfiltration or command-and-control communications.

  - **Gather Contextual Information:** Collect details about the user or system that made the DNS requests. Investigate user behavior to determine if there are any legitimate reasons for the queries, or if they suggest a potential security incident.

  ### Prioritization
  Due to the potential for Tor to facilitate exfiltration of sensitive data or orchestrate other malevolent actions, alerts from this rule should be treated with high priority. The use of Tor in an enterprise environment typically indicates unusual or unauthorized activity that requires immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of Tor usage, especially if an adversary uses custom methods to obfuscate their DNS requests, such as DNS tunneling. The logic assumes that all Tor-related queries will be directed to known ".onion" addresses or Tor gateway domains, which might not always be the case. Proper logging configurations must be in place on network devices or endpoints to capture DNS queries effectively; otherwise, detection of this potential threat may be impaired.

