note: |
  ### Technical Context

  This rule detects DNS queries made by the `finger` utility on Windows systems. Given that `finger` is seldom utilized in modern environments, its presence may indicate potentially malicious activity, such as an attacker retrieving remote commands. The likely goal of the attacker is to establish command and control (C2) over compromised systems or gather sensitive information from the network. This behavior is relevant to the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1071.004).

  The primary telemetry source is DNS query logs, specifically looking for queries initiated by `finger.exe`. If malicious, this activity could lead to unauthorized command execution or data exfiltration. It is crucial to note that this detection alone does not confirm malicious intent; legitimate use of the `finger` utility in a historical context may exist, albeit rare.

  ### Investigation Steps

  - **Check running processes: ** Review the process list to verify if `finger.exe` is currently running (Process ID, Parent Process) and check for anomalies such as unusual execution paths or timestamps not aligning with standard user behavior.

  - **Examine DNS query logs: ** Look for DNS queries related to `finger.exe` in your DNS logs (Event ID for Windows DNS: 4668) and correlate with known malicious domains associated with C2 infrastructure.

  - **Identify querying patterns: ** Analyze the frequency and patterns of the DNS queries. Multiple queries from `finger.exe` to unknown or rare domains within a short period could indicate malicious behavior.

  - **Review legitimate use cases: ** Validate with stakeholders if `finger` usage has legitimate business needs. If present in the environment, note typical domain names it queries and the associated behavior.

  - **Correlate with other alerts: ** Investigate if other alerts or logs indicate a compromise (e.g., suspicious PowerShell executions linked to the same host) or if this DNS activity aligns with previously detected abnormal behaviors.

  - **Monitor related activities: ** Keep an eye on outbound connections created by `finger.exe` to other known command and control servers or suspicious ports immediately after these queries.

  ### Prioritization

  The alert has a high severity due to the implications on system integrity and potential data loss. The `finger` utility is rarely used in enterprise environments, making any associated activity suspect and indicative of potential command and control operations. Given that this method has been weaponized in specific malware campaigns, the likelihood of malicious intent is significant.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications or services that may inadvertently invoke the `finger` command. Ensuring comprehensive DNS logging configurations will be critical for effective detection. Additionally, if network proxies log DNS queries, they may not directly capture all `finger` utility calls, leading to gaps in telemetry. Companion detections such as monitoring for unusual PowerShell scripts or cmd.exe command lines may provide better coverage against layered attack strategies.

