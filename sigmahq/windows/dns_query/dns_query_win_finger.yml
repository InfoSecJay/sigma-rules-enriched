note: |
  ### Technical Context
  This detection rule identifies DNS queries initiated by the **finger utility** (finger.exe) on Windows systems. The finger utility, although largely obsolete in modern environments, can be weaponized by threat actors to fetch commands from remote servers. Such behavior suggests a potential command-and-control (C2) communication exploit, allowing attackers to execute commands on compromised systems. The ClickFix malware campaign serves as a notable example where this tactic was employed, illustrating the utility's risk when leveraged inappropriately.

  The relevant MITRE ATT&CK tactics and techniques connected to this detection include:
  - **Command and Control (T1071.004)**: Application Layer Protocol: Remote Access Software
  - **Execution (T1059.003)**: Command and Scripting Interpreter: Windows Command Shell

  The most informative telemetry for this detection is **DNS query logs**, which capture the requests made by the finger utility, revealing any suspicious remote server activity associated with threat actors.

  ### Investigation Steps
  - **Review DNS Logs**: Examine DNS query logs for instances where requests originate from finger.exe. Identify and assess the domains that have been queried for any known malicious associations.

  - **Analyze Process Activity**: Investigate the process creation logs to track how and when finger.exe was initiated on the system. Look for unusual patterns or commands executed in conjunction with this utility.

  - **Check Network Connections**: Review network traffic logs to identify any HTTP/S or other connections being made by the host related to the domains queried. Look for any unexpected outbound traffic patterns that correspond with the use of finger.exe.

  - **Investigate System Behavior**: Monitor the affected endpoint for any unusual behaviors or processes that may correlate with the timing of the DNS queries. Evaluate system logs for any recorded command executions that may indicate a compromise.

  ### Prioritization
  Given the elevated risk of command and control activities associated with suspicious tool usage, this alert is categorized as **high severity**. The potential impact of a threat actor gaining remote control over a system justifies prompt investigation to prevent unauthorized access and potential data breaches.

  ### Blind Spots and Assumptions
  Detection coverage for this alert may be lacking if the finger utility is not normally present in the environment or if systems are not consistently logging DNS queries. The detection logic assumes that any invocation of finger.exe is malicious, which may not account for legitimate administrative purposes in rare cases. For the alert to function properly, it requires enabled logging for DNS queries and a method to correlate this with process execution events.

