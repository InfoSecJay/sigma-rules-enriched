  ### Technical Context

  This rule detects DNS queries initiated by the finger utility, commonly associated with command-and-control mechanisms. Adversaries can exploit this utility to retrieve remote commands for execution on compromised Windows systems, particularly within the context of malware campaigns like ClickFix. The relevant MITRE ATT&CK tactics are Command and Control (T1071.004) and Execution (T1059.003).

  The primary telemetry source for this detection is Windows DNS query logs, specifically capturing instances where the Finger utility (finger.exe) initiates outbound DNS requests. If malicious, this behavior poses a significant risk as it may facilitate remote command execution. However, this detection alone does not confirm malicious intent; the context around the query must be established through further investigation.

  ---

  ### Investigation Steps

  - **Review the process creating the DNS query:** Check for the execution of finger.exe via Windows Security Event ID 4688, noting the parent process to understand context. Look for unusual parent processes, such as cmd.exe or powershell.exe, that may indicate malicious execution.

  - **Examine DNS query details:** Investigate the DNS logs for queries made by finger.exe, focusing on uncommon or suspicious domain names. Malicious queries typically target domains linked to known command and control infrastructure, whereas legitimate queries (if any) usually resolve common internal network resources.

  - **Validate network activity:** Utilize network logs (NetFlow, Windows Event ID 5156 for process network connections) to assess outbound connections associated with the detected DNS queries. Legitimate use of finger would generally result in connections to well-known, safe domains or internal systems.

  - **Identify anomalies in DNS traffic:** Review general DNS query patterns during the time of detection. Increased frequency or volume of DNS queries from a particular host could signify a potential reconnaissance or C2 activity indicative of compromise.

  - **Correlate with threat intelligence:** Compare the retrieved domain names from the DNS queries against threat intelligence databases to identify any known malicious infrastructures or campaigns. High-confidence indicators often align with reported command-and-control domains.

  - **Proactive monitoring of endpoints:** Assess the presence of finger.exe on critical assets. If found, ensure a justification is available for its usage, mitigating the risk of it being leveraged for unauthorized command execution.

  ---

  ### Prioritization

  This alert should be treated as high priority due to the unusual behavior of the finger utility, which is seldom found in modern enterprise environments and could indicate malicious activity, particularly if associated with known C2 techniques. The likelihood of abuse is significant, given its previous use in documented malware campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by obfuscating malicious software under legitimate processes or altering DNS traffic patterns. The required log sources include complete DNS query logs and process creation events, which must be properly configured for reliable visibility. Legitimate activities may occur if an organization employs the finger utility for specific legacy applications. A related detection for improved coverage could be monitoring outbound DNS queries for unusual or newly registered domains.

