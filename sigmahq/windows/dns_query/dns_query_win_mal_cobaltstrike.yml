  ### Technical Context

  This rule detects suspicious DNS queries indicating potential Cobalt Strike beacon behavior, specifically looking for known query patterns related to command-and-control communications. The likely attacker objective involves establishing a consistent and covert channel for remote access and the exfiltration of data once within the target environment. This detection aligns with the MITRE ATT&CK Tactic: Command and Control (TA0011), specifically the technique: Application Layer Protocol (T1071.004).

  The primary telemetry sources include Windows DNS query logs. The involvement of Cobalt Strike can have significant security impacts, such as unauthorized data access and lateral movement within the network. Importantly, this detection does NOT confirm active compromise by itself; further investigation is required to establish whether the queries are part of benign activity or malicious command-and-control communication.

  ---

  ### Investigation Steps

  - **Identify DNS Query Patterns:** Review DNS query logs for Event ID 22 (DNS Query) or Sysmon Event ID 22 within the `/var/log/syslog` or `Application` logs, filtering for queries starting with "aaa.stage." or containing ".stage.123456.". Legitimate DNS queries will typically have familiar domain names related to internal services or known external partners.

  - **Examine Process Creation Events:** Check for related process creation events (Security Event ID 4688 or Sysmon Event ID 1) tied to the detected DNS queries, focusing on command-line arguments that may indicate unusual or suspicious activity. Look for unfamiliar application names or arguments that differ from normal operational contexts.

  - **Correlate with Existing Threat Intelligence:** Validate against threat intelligence sources to ascertain whether the detected domain has established links to known malicious actors or campaigns. Ensure to cross-reference domain name resolutions where applicable.

  - **Monitor Related Network Activity:** Analyze associated network logs (e.g., firewall logs) for unusual outbound connections that align with the timing of the suspicious DNS queries. Legitimate activity typically includes external connections to well-known services and expected throughput rates.

  - **Document Host Role and Context:** Determine the role of the host making the suspicious DNS queries; for example, if it is an endpoint expected to access internal resources only, this could signal a higher likelihood of compromise.

  - **Investigate Potential Data Exfiltration:** If any file creation or modification activities are logged (event ID 4663 on Windows), particularly involving sensitive files during the same timeframe as DNS queries, report these as high-confidence indicators of adversary behavior.

  ---

  ### Prioritization

  This alert is of critical severity, particularly if the affected host is a high-value target such as a server handling sensitive data or a key operational system. The likelihood of malicious abuse is elevated, given that Cobalt Strike is commonly weaponized for early-stage network infiltration and persistence.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations or lack of comprehensive DNS logging, which can result in incomplete coverage. Legitimate activities, such as authorized third-party applications communicating with external hosts, may inadvertently trigger this alert. A related detection, such as monitoring for unusual outbound traffic patterns or traffic to known malicious IP ranges, can enhance overall security posture against these tactics.

