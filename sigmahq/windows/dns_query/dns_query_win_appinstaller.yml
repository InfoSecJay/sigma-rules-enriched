  ---

  ### Technical Context

  This Sigma rule detects attempts to use "AppInstaller.EXE" to install AppX packages through DNS queries. The behavior suggests an installer is being invoked to fetch a software package from a remote source, potentially indicating an attacker’s objective to deliver malware or unwanted software via this mechanism. The relevant MITRE ATT&CK tactic is "Command and Control" and technique T1105 (Ingress Tool Transfer).

  Primary telemetry sources include DNS query logs that capture the activity of "AppInstaller.EXE". The security impact of successful installation could be severe, allowing the adversary to execute unauthorized applications, leading to potential data exfiltration or system compromise. Importantly, this detection does NOT confirm that the package being installed is malicious without further investigation.

  ---

  ### Investigation Steps

  - **Identify DNS query details:** Review DNS logs for queries logged under "ms-appinstaller" URI, focusing on relevant fields: `QueryName`, `QueryType`, and `ClientIP`. Benign queries will typically originate from signed Windows applications, whereas suspicious queries may come from unknown or unexpected client IPs.

  - **Confirm AppInstaller execution:** Check process creation logs (e.g., Security Event ID 4688) for "AppInstaller.exe". Inspect fields like `NewProcessName` and `CommandLine`, noting that legitimate uses will often involve installation from trusted Microsoft sources.

  - **Monitor network activity:** Analyze network traffic for connections to external hosts associated with the queried DNS names. Use firewall logs or NetFlow if available to trace unusual or unauthorized outbound traffic.

  - **Examine installed packages:** Review installed AppX packages via PowerShell (`Get-AppxPackage`) to determine if any recently installed packages match the time frame of the detected query and are from untrusted sources.

  - **Validate host role and configuration:** Ensure that the host is an appropriate target for AppX installations (e.g., end-user devices, not critical servers). Investigate if any recent security configurations or policies have been altered that may allow unauthorized installations.

  - **Identify malicious indicators:** Search for known bad domains associated with DNS queries originating from "AppInstaller.exe". Leverage threat intelligence feeds for any correlated indicators that match recent installation behavior.

  ---

  ### Prioritization

  This alert is medium severity because it involves the execution of a potentially untrusted installation process from client systems. While the likelihood of a malicious intent is moderate, especially in environments with stringent software controls, similar behavior is weaponized by adversaries to install payloads unnoticed.

  ---

  ### Blind Spots and Assumptions

  The detection may fail to capture evasive techniques such as renaming the installer executable or utilizing alternate installation methods. Reliable detection requires comprehensive logging of DNS queries, which may be missing if not properly configured. Legitimate activities, such as organizationally approved software updates, might trigger the alert. A companion detection that enhances coverage could involve monitoring for unusual process combinations related to AppInstaller executions, which may further indicate malicious activity.

