note: |
  ### Technical Context
  This detection rule identifies DNS queries initiated by `AppInstaller.EXE`, which is the Microsoft application used to handle app installation requests from URLs with the "ms-appinstaller" URI scheme. The rule alerts on any attempts to install applications through this mechanism, which could indicate a potential misuse of the installer framework, either for legitimate software distribution or for malicious purposes, such as sideloading unauthorized applications or malware.

  The attacker objectives in this threat scenario may include distributing malware, exfiltrating data, or gaining unauthorized access to the system via malicious app installations. By utilizing AppInstaller, an attacker can leverage a trusted Windows component to execute malicious payloads, evade detection, or bypass application controls.

  This behavior maps to the MITRE ATT&CK tactic of **Command and Control** (ID: TA0011) and technique **Application Layer Protocol** (ID: T1105), since the attacker communicates with a remote server to potentially download and execute malicious software. The primary data source for this detection is DNS query logs, which will contain the necessary information to track any unresolved URLs accessed through the AppInstaller process.

  ### Investigation Steps
  - **Review DNS Query Logs:** Check the DNS logs for any queries associated with `AppInstaller.EXE` for suspicious or unauthorized URIs. Identify any uncommon domains or frequent failed resolutions.

  - **Analyze Process Creation Events:** Investigate recent process creation logs to determine if `AppInstaller.EXE` was executed under suspicious circumstances, such as by an unknown user or alongside other potentially malicious processes.

  - **Correlate with Application Whitelists:** Compare the installed applications against an organizational whitelist to identify any unauthorized applications that may have been installed via AppInstaller.

  - **Inspect Network Traffic:** Look at network traffic patterns associated with the DNS queries to unveil any outbound connections to potentially malicious servers post-installation.

  ### Prioritization
  The severity of this alert is medium due to the potential risk posed by unauthorized application installations, which can lead to data breaches or system compromise. Given the ease of misuse of app installation mechanisms, this alert should be prioritized for further investigation, particularly in environments with high sensitivity to software integrity.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of application installation, especially if installations occur through different methods or legitimate usage patterns that don't involve `AppInstaller.EXE`. It assumes that logging for DNS queries is enabled and adequately configured on the network. Additionally, there may be false positives from benign application installations that utilize the AppInstaller component legitimately, which could require further tuning of the detection rule to reduce noise based on historical evidence.

