description: |
  Detects a DNS query by a non browser process on the system to "azurewebsites.net". The latter was often used by threat actors as a malware hosting and exfiltration site.
references:
- https://www.sentinelone.com/labs/wip26-espionage-threat-actors-abuse-cloud-infrastructure-in-targeted-telco-attacks/
- https://symantec-enterprise-blogs.security.com/threat-intelligence/harvester-new-apt-attacks-asia
- https://www.ptsecurity.com/ww-en/analytics/pt-esc-threat-intelligence/higaisa-or-winnti-apt-41-backdoors-old-and-new/
- https://intezer.com/blog/research/how-we-escaped-docker-in-azure-functions/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName|endswith: 'azurewebsites.net'
  filter_optional_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_defender:
    Image|endswith:
    - '\MsMpEng.exe'         # Microsoft Defender executable
    - '\MsSense.exe'         # Windows Defender Advanced Threat Protection Service Executable
  filter_optional_brave:
    Image|endswith: '\brave.exe'
    Image|startswith: 'C:\Program Files\BraveSoftware\'
  filter_optional_maxthon:
    Image|contains: '\AppData\Local\Maxthon\'
    Image|endswith: '\maxthon.exe'
  filter_optional_opera:
    Image|contains: '\AppData\Local\Programs\Opera\'
    Image|endswith: '\opera.exe'
  filter_optional_seamonkey:
    Image|startswith:
    - 'C:\Program Files\SeaMonkey\'
    - 'C:\Program Files (x86)\SeaMonkey\'
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|contains: '\AppData\Local\Vivaldi\'
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|startswith:
    - 'C:\Program Files\Naver\Naver Whale\'
    - 'C:\Program Files (x86)\Naver\Naver Whale\'
    Image|endswith: '\whale.exe'
  filter_optional_tor:
    Image|contains: '\Tor Browser\'
  filter_optional_whaterfox:
    Image|startswith:
    - 'C:\Program Files\Waterfox\'
    - 'C:\Program Files (x86)\Waterfox\'
    Image|endswith: '\Waterfox.exe'
  filter_optional_midori:
    Image|contains: '\AppData\Local\Programs\midori-ng\'
    Image|endswith: '\Midori Next Generation.exe'
  filter_optional_slimbrowser:
    Image|startswith:
    - 'C:\Program Files\SlimBrowser\'
    - 'C:\Program Files (x86)\SlimBrowser\'
    Image|endswith: '\slimbrowser.exe'
  filter_optional_flock:
    Image|contains: '\AppData\Local\Flock\'
    Image|endswith: '\Flock.exe'
  filter_optional_phoebe:
    Image|contains: '\AppData\Local\Phoebe\'
    Image|endswith: '\Phoebe.exe'
  filter_optional_falkon:
    Image|startswith:
    - 'C:\Program Files\Falkon\'
    - 'C:\Program Files (x86)\Falkon\'
    Image|endswith: '\falkon.exe'
  filter_optional_avant:
    Image|startswith:
    - 'C:\Program Files (x86)\Avant Browser\'
    - 'C:\Program Files\Avant Browser\'
    Image|endswith: '\avant.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Likely with other browser software. Apply additional filters for any other browsers
  you might use.
level: medium
note: |
  ### Technical Context
  This detection rule targets DNS queries made to "azurewebsites.net" by processes that are not recognized as web browsers. This is significant because threat actors frequently utilize cloud platforms as infrastructure for command and control (C2) or malware hosting. By monitoring for anomalous DNS activity from non-browser processes, the rule aims to identify potential malicious activities, such as data exfiltration or communication with compromised cloud services.

  The threat scenario encompasses attackers leveraging legitimate, cloud-based platforms to obfuscate their operations, which can provide an avenue for persistent access to compromised systems. The likely objective of these activities is to establish a foothold within the network and facilitate unauthorized data movements or commands. The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011), particularly focusing on techniques such as **Application Layer Protocol** (T1071) and **Unsecured Credentials** (T1555).

  Primary data sources for this detection include Windows DNS query logs and process creation events, which will provide visibility into what processes are making DNS requests and their respective network activity.

  ### Investigation Steps
  - **Review DNS Logs**: Check the DNS query logs for entries corresponding to "azurewebsites.net". Identify the source IP addresses and timestamps associated with these requests to correlate with other activity on the host.

  - **Analyze Process Activity**: Examine the process creation logs to identify the non-browser processes that initiated the DNS queries. Look for any signs of unusual execution patterns, such as processes spawning from unexpected parent processes.

  - **Conduct Threat Hunt**: Execute a threat hunting exercise using indicators of compromise (IOCs) relevant to known actors who have utilized "azurewebsites.net" for malicious purposes. Cross-reference any identified processes or IPs with threat intelligence sources.

  - **Investigate Related Network Activity**: Trace any outbound connections from the identified processes to determine if there was subsequent communication with external IPs, particularly any that have been flagged in threat intelligence databases.

  ### Prioritization
  This alert is assigned a medium severity level as the detection of DNS queries to potentially malicious domains by non-browser processes signifies a possible compromise or exfiltration event. Given the increasing use of cloud services for malware hosting, timely investigation is critical to mitigate risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection if there are browser alternatives or lesser-used applications that may generate similar DNS queries but are not accounted for in the filters. Additionally, the detection logic assumes that non-browser processes making these DNS requests are indicative of malicious behavior; legitimate software or services that also query the domain could trigger false positives. To ensure accurate detection, proper configurations for logging DNS queries and process activities on Windows systems must be enabled.

