title: DNS Query To AzureWebsites.NET By Non-Browser Process
id: e043f529-8514-4205-8ab0-7f7d2927b400
related:
- id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
  type: derived
status: test
description: |
  Detects a DNS query by a non browser process on the system to "azurewebsites.net". The latter was often used by threat actors as a malware hosting and exfiltration site.
references:
- https://www.sentinelone.com/labs/wip26-espionage-threat-actors-abuse-cloud-infrastructure-in-targeted-telco-attacks/
- https://symantec-enterprise-blogs.security.com/threat-intelligence/harvester-new-apt-attacks-asia
- https://www.ptsecurity.com/ww-en/analytics/pt-esc-threat-intelligence/higaisa-or-winnti-apt-41-backdoors-old-and-new/
- https://intezer.com/blog/research/how-we-escaped-docker-in-azure-functions/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName|endswith: 'azurewebsites.net'
  filter_optional_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_defender:
    Image|endswith:
    - '\MsMpEng.exe'         # Microsoft Defender executable
    - '\MsSense.exe'         # Windows Defender Advanced Threat Protection Service Executable
  filter_optional_brave:
    Image|endswith: '\brave.exe'
    Image|startswith: 'C:\Program Files\BraveSoftware\'
  filter_optional_maxthon:
    Image|contains: '\AppData\Local\Maxthon\'
    Image|endswith: '\maxthon.exe'
  filter_optional_opera:
    Image|contains: '\AppData\Local\Programs\Opera\'
    Image|endswith: '\opera.exe'
  filter_optional_seamonkey:
    Image|startswith:
    - 'C:\Program Files\SeaMonkey\'
    - 'C:\Program Files (x86)\SeaMonkey\'
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|contains: '\AppData\Local\Vivaldi\'
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|startswith:
    - 'C:\Program Files\Naver\Naver Whale\'
    - 'C:\Program Files (x86)\Naver\Naver Whale\'
    Image|endswith: '\whale.exe'
  filter_optional_tor:
    Image|contains: '\Tor Browser\'
  filter_optional_whaterfox:
    Image|startswith:
    - 'C:\Program Files\Waterfox\'
    - 'C:\Program Files (x86)\Waterfox\'
    Image|endswith: '\Waterfox.exe'
  filter_optional_midori:
    Image|contains: '\AppData\Local\Programs\midori-ng\'
    Image|endswith: '\Midori Next Generation.exe'
  filter_optional_slimbrowser:
    Image|startswith:
    - 'C:\Program Files\SlimBrowser\'
    - 'C:\Program Files (x86)\SlimBrowser\'
    Image|endswith: '\slimbrowser.exe'
  filter_optional_flock:
    Image|contains: '\AppData\Local\Flock\'
    Image|endswith: '\Flock.exe'
  filter_optional_phoebe:
    Image|contains: '\AppData\Local\Phoebe\'
    Image|endswith: '\Phoebe.exe'
  filter_optional_falkon:
    Image|startswith:
    - 'C:\Program Files\Falkon\'
    - 'C:\Program Files (x86)\Falkon\'
    Image|endswith: '\falkon.exe'
  filter_optional_avant:
    Image|startswith:
    - 'C:\Program Files (x86)\Avant Browser\'
    - 'C:\Program Files\Avant Browser\'
    Image|endswith: '\avant.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Likely with other browser software. Apply additional filters for any other 
  browsers you might use.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries to "azurewebsites.net" originating from non-browser processes on Windows systems. Threat actors often leverage this domain for various malicious activities, such as hosting malware or exfiltrating data. The primary attacker objective is to establish command-and-control (C2) communication or retrieve unauthorized payloads from this known malicious infrastructure.

  The relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1071). The primary telemetry source involves DNS query logs from Windows systems, specifically looking for process identifiers that do not belong to common web browsers. If confirmed malicious, this behavior suggests compromised systems communicating with known malicious domains. It is important to note that this detection does NOT confirm that the process is indeed malicious without further context, such as process behavior or additional indicators.

  ---

  ### Investigation Steps

  - **Identify the querying process:** Review Security Event ID 4688 for process creation events correlating with the time of the DNS query. Filter for processes that are not legitimate web browsers (e.g., Chrome, Firefox, Edge), and note unusual parent-child process relationships.

  - **Check DNS logs for additional context:** Investigate DNS query logs for other suspicious queries that may relate to the same process. This can reveal whether the process was attempting to communicate with multiple known malicious domains.

  - **Evaluate process legitimacy:** Validate the reputation of the querying process by cross-referencing it against threat intelligence databases. Certain known legitimate applications may trigger false positives, so it's critical to ascertain the context of the application.

  - **Look for follow-up behavior:** Search for any associated outbound connections (e.g., TCP SYN packets) to the same domain using Network Firewalls or IDS logs like Security Event ID 5156 (Windows Filtering Platform) or network monitoring tools.

  - **Cross-reference with recent changes:** Review log types such as Windows Event ID 5145 (File Share Access) or 4656 (Handle Access) for any file read/write operations that could indicate data exfiltration around the time of the DNS query.

  - **Document benign behavior:** Legitimate applications may issue DNS queries to "azurewebsites.net" under specific contexts (e.g., remote management tools using Azure). Ascertain if known systems or applications require access to this domain as part of their operational profile.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact of compromised systems communicating with malicious domains. The frequency of exploitation using Azure-based infrastructure means that while it may not always indicate an immediate compromise, it warrants prompt investigation. This behavior is weaponized in targeted attacks, emphasizing the need for thorough review.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of DNS logging or the configuration of processes that may mask external communications. The indication of a query to "azurewebsites.net" is not definitive proof of compromise as legitimate applications may communicate with this domain for benign purposes. A companion detection rule for outbound network connections to known malicious IPs or domains enhances overall detection capabilities and mitigates the potential for false negatives in this area.

