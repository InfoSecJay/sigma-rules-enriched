title: Notepad++ Updater DNS Query to Uncommon Domains
id: 2074e137-1b73-4e2d-88ba-5a3407dbdce0
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that are not part of the known legitimate update infrastructure.
  This could indicate potential exploitation of the updater mechanism or suspicious network activity that warrants further investigation.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-02
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_notepad_legit_domain:
    QueryName: 'notepad-plus-plus.org'
  filter_optional_sourceforge_legit_domain:
    QueryName|endswith: '.sourceforge.net'
  filter_optional_github_legit_domain:
  - QueryName|endswith: '.githubusercontent.com'
  - QueryName: 'github.com'
  filter_optional_google_storage_legit_domain:
    QueryName|endswith: '.googleapis.com'
    # Add other known legitimate domains if any
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate network misconfigurations or proxy issues causing unexpected 
  DNS queries.
- Other legitimate query to official domains not listed in the filter, needing 
  tuning.
level: medium # can be upgraded to high after tuning with known legitimate DNS queries
note: |
  ### Technical Context

  This Sigma rule detects DNS queries made by the Notepad++ updater (gup.exe) to domains that are not part of the established update infrastructure. Such behavior may indicate that an attacker is attempting to exploit Notepad++'s updater mechanism to download malicious payloads. The relevant MITRE ATT&CK techniques include Initial Access (T1195.002), as this could serve as a vector for initial exploitation, and Collection (T1557), indicating data might be collected through the exploit.

  The primary telemetry sources are DNS query logs, specifically monitoring queries related to gup.exe's network activity. A security incident due to malicious exploitation could lead to unauthorized data access or malware deployment within an organization. Notably, this detection does NOT confirm that the observed DNS queries are malicious on their own; further investigation is necessary to ascertain context and intent.

  ### Investigation Steps

  - **Review DNS query logs for gup.exe activity:** Filter DNS logs for queries where the process name ends with 'gup.exe' (e.g., Event ID: DNS query for query_name=*. Uncommon domains should be investigated further.

  - **Correlate with the established whitelist:** Identify any queries to domains other than "notepad-plus-plus.org" or legitimate SourceForge, GitHub, and Google Storage domains. Legitimate activity typically involves queries to these whitelisted domains.

  - **Examine associated DNS response details:** Look for anomalies in response times, response types (e.g., A, TXT), or unusual IP addresses (e.g., Event ID: 1234 DNS response fields such as ResponseAddress). Abnormal latencies may suggest the use of a malicious or untrusted DNS server.

  - **Check for other active threats on the host:** Review process creation logs (e.g., Sysmon Event ID 1) for any unusual process behavior or parent-child process relationships initiated by gup.exe, indicating lateral movement or malicious exploitation.

  - **Assess asset criticality:** Determine the role and sensitivity of the host running Notepad++. Analyze if an infection could lead to significant data loss or interruptions in services, prioritizing investigations accordingly.

  - **Identify other suspicious behaviors:** Look for known indicators of compromise (IoCs) linked to Notepad++-related malware (e.g., unusual outbound traffic to known malicious IPs), enhancing the context of the alert.

  ### Prioritization

  The severity of this alert is assessed as medium, primarily due to the potential for exploitation of a trusted application, which may result in unauthorized data access. However, the likelihood of this specific behavior being malicious may vary, as misconfigured systems might also trigger the alert. Continuous monitoring and tuning are recommended to accurately assess risks associated with this detection.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for legitimate network misconfigurations causing unexpected DNS queries and the possibility of benign applications accessing unusual domains. Reliable detection requires comprehensive DNS logging configurations to ensure complete visibility into relevant queries. Additionally, legitimate updates or plugins that make unexpected DNS requests might trigger the alert. A companion detection, such as process creation logs for additional unusual executables, can help strengthen the context of this alert.

