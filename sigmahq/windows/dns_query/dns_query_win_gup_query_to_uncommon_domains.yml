title: Notepad++ Updater DNS Query to Uncommon Domains
id: 2074e137-1b73-4e2d-88ba-5a3407dbdce0
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that are not part of the known legitimate update infrastructure.
  This could indicate potential exploitation of the updater mechanism or suspicious network activity that warrants further investigation.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-02
modified: 2026-03-16
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_notepad_legit_domain:
    QueryName: 'notepad-plus-plus.org'
  filter_optional_sourceforge_legit_domain:
    QueryName|endswith: '.sourceforge.net'
  filter_optional_github_legit_domain:
  - QueryName|endswith: '.githubusercontent.com'
  - QueryName: 'github.com'
  filter_optional_google_storage_legit_domain:
    QueryName|endswith: '.googleapis.com'
  filter_optional_uncommon_domains:
    QueryName|endswith:
    - '.azurewebsites.net'
    - 'block.opendns.com'
    - 'gateway.zscalerthree.net'
    # Add other known legitimate domains if any
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate network misconfigurations or proxy issues causing unexpected 
  DNS queries.
- Other legitimate query to official domains not listed in the filter, needing 
  tuning.
level: medium # can be upgraded to high after tuning with known legitimate DNS queries
note: |
  ### Technical Context

  This Sigma rule detects DNS queries made by the Notepad++ updater (`gup.exe`) to domains that are not part of its established legitimate update infrastructure. Attackers may exploit the updater mechanism to deliver malicious payloads by modifying the DNS queries to direct users to nefarious servers. The relevant MITRE ATT&CK tactics include **Collection (T1560)** and **Initial Access (T1195.002)**. Primary telemetry sources include Windows DNS query logs, specifically focusing on log types related to DNS requests. If malicious, this activity could allow unauthorized software updates or malware installation, compromising system integrity. However, this detection does NOT confirm malicious intent without further correlation to additional indicators of compromise (IOCs).

  ### Investigation Steps

  - **Confirm the process executing the DNS query:** Use Windows Security Event ID 4688 to verify if `gup.exe` is indeed the source of the DNS query. Look for signs of abnormal process behavior such as unusual parent processes.

  - **Analyze DNS query details:** Review DNS logs for Event IDs related to DNS queries (e.g., Event ID 22 in Windows) and examine the `QueryName` field for any domains that fall outside the known legitimate update domains. Legitimate queries should predominantly include `notepad-plus-plus.org`, `sourceforge.net`, and related GitHub domains.

  - **Investigate system role and asset criticality:** Determine if the asset generating the alerts is critical. For instance, if the system is a production server, the potential impact is higher. Review logs for other outbound connections from the same asset.

  - **Identify high-confidence malicious indicators:** Check for any DNS queries to domains such as `.azurewebsites.net`, `block.opendns.com`, or `gateway.zscalerthree.net`. If the query matches these suspicious domains, raise the alert level for further action.

  - **Review legitimate activities:** Understand typical update behaviors and query patterns of Notepad++. Documented legitimate queries should primarily revolve around official update domains, indicating expected behavior.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on system integrity, particularly if the affected system is critical or sensitive. The likelihood of malicious abuse is plausible, given that supply chain attacks targeting software update mechanisms are increasingly common and effective.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion by legitimate applications misconfigured to contact unforeseen domains or due to using VPNs or proxies that alter DNS requests. The telemetry must be properly configured to capture all DNS queries accurately. Additionally, legitimate software tools that may perform similar network activities could inadvertently trigger the alert, including network monitoring solutions. A complementary detection involves monitoring for anomalous outbound traffic patterns indicative of data exfiltration stemming from such updates.

