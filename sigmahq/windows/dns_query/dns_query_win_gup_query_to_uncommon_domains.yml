title: Notepad++ Updater DNS Query to Uncommon Domains
id: 2074e137-1b73-4e2d-88ba-5a3407dbdce0
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that are not part of the known legitimate update infrastructure.
  This could indicate potential exploitation of the updater mechanism or suspicious network activity that warrants further investigation.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-02
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_notepad_legit_domain:
    QueryName: 'notepad-plus-plus.org'
  filter_optional_sourceforge_legit_domain:
    QueryName|endswith: '.sourceforge.net'
  filter_optional_github_legit_domain:
  - QueryName|endswith: '.githubusercontent.com'
  - QueryName: 'github.com'
  filter_optional_google_storage_legit_domain:
    QueryName|endswith: '.googleapis.com'
    # Add other known legitimate domains if any
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate network misconfigurations or proxy issues causing unexpected DNS
  queries.
- Other legitimate query to official domains not listed in the filter, needing tuning.
level: medium # can be upgraded to high after tuning with known legitimate DNS queries
note: |
  ### Technical Context
  This detection rule identifies suspicious DNS queries made by the Notepad++ updater process (`gup.exe`) to domains that are not part of its known legitimate update infrastructure. Attackers may exploit the Notepad++ updater as a vector for delivering malware, leveraging trust in widely used applications to bypass security measures. The objective is usually to gain initial access (MITRE ATT&CK Tactic: **Initial Access**) or to collect credentials (Tactic: **Credential Access**) through malicious updates or backdoor installations.

  Relevant MITRE ATT&CK techniques for this detection include **T1195.002 - Supply Chain Compromise: Software Dependencies** and **T1557 - Adversary-in-the-Middle**. This can indicate a more extensive supply chain attack where valid software mechanisms are misused to execute malicious actions. Primary data sources for effective detection include DNS query logs, which record all external domain requests made by processes on Windows systems.

  ### Investigation Steps
  - **Review DNS Query Logs:** Examine DNS logs for queries initiated by `gup.exe` that are not associated with known legitimate Notepad++ or other update-related domains.
  - **Cross-Reference Domains:** Verify the queried domains against threat intelligence feeds or known malicious domain lists to identify any potentially suspicious or dangerous domains.
  - **Analyze Process Behavior:** Investigate related Windows process creation logs to look for unusual command line arguments, parent/child process relationships, or execution patterns tied to `gup.exe`.
  - **Assess Network Traffic:** Monitor outbound network traffic for additional communications from an identified suspicious domain, paying attention to any further connections made by the updater or associated processes.

  ### Prioritization
  The alert's severity is categorized as medium due to the potential impact of exploitation through trusted software, which could lead to broader compromise if left unaddressed. Given the common use of Notepad++, the likelihood of encountering this behavior in an enterprise environment is reasonably high.

  ### Blind Spots and Assumptions
  This rule may not detect all instances of malicious behavior if an attacker deploys domains that do not deviate significantly from legitimate ones or if legitimate updates occur from altered configurations. Assumptions made include the existence of an updated list of legitimate domains and a reliable DNS logging configuration. Any gaps in logging or improperly configured DNS resolution could hinder the effectiveness of this detection. It's crucial that DNS query logging is enabled and properly configured across all endpoints to ensure comprehensive coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
