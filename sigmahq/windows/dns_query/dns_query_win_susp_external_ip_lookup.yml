level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious DNS queries made to various IP lookup service APIs (e.g., api.ipify.org) when initiated by non-browser processes. Attackers may use such queries for reconnaissance to obtain external IP addresses or to verify outbound connectivity, which could be indicative of malware behavior or tools like Hancitor or Ducktail attempting to exfiltrate data or establish communication channels. The primary objectives of an attacker in this scenario are typically to hide their presence or obfuscate their activities, collecting IP information necessary for further network interactions.

  Relevant MITRE ATT&CK tactics/techniques linked to this behavior include:

  - **Tactic: Reconnaissance**
    - **Technique T1590**: Collecting information about IP address configurations can help attackers plan subsequent steps in their attack chain.

  The primary data sources for detecting this behavior are DNS query logs, which record all domain lookups, and process creation logs that can help link the queries to specific executable processes.

  ### Investigation Steps
  - **Review DNS Query Logs**: Check logs for the detected suspicious queries related to IP lookup services originating from non-browser processes. Pay special attention to any anomalous timing or frequency.

  - **Correlate Process Creation Events**: Investigate the processes making these DNS queries, looking specifically for non-standard or suspicious executables that are not typically associated with web browsing.

  - **Analyze Network Traffic**: Look for outbound connections following the DNS queries. Focus on unexpected destinations that may correlate with known malicious IP addresses.

  - **Check for Persistence Mechanisms**: Assess the systems for signs of implant persistence mechanisms, especially if the querying processes appear unusual or don’t correlate with regular user activity.

  ### Prioritization
  This alert is considered medium severity due to its potential association with reconnaissance activities by attackers, which could lead to further malicious actions. The likelihood of this behavior indicating an actual attack increases if it originates from critical infrastructure or sensitive endpoints.

  ### Blind Spots and Assumptions
  Gaps in detection might arise from legitimate use of IP lookup services by authorized applications, which could lead to false positives. The detection logic assumes that queries originating from non-browser processes are suspect, disregarding potential legitimate use cases. Required logs for this alert to function effectively include comprehensive DNS query logs and process creation event logs, ensuring that all processes and queries are recorded accurately to avoid missing pertinent activity.

