- Legitimate usage of IP lookup services such as ipify API
level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries directed at IP lookup services (e.g., api.ipify.org) initiated by non-browser processes. Such behavior suggests an attempt to exfiltrate or gather external information to identify system IP addresses, which adversaries may leverage for command and control (C2) communication. The primary attack tactic involved is **Reconnaissance** (T1590), where the attacker aims to gather information about the target network environment.

  The primary telemetry source for this rule is DNS query logs, specifically focusing on the fields that document the queried domain names and the processes generating them. If malicious, the impact could range from revealing sensitive environment information to facilitating further attacks, such as data exfiltration or lateral movement. Note that this detection does NOT confirm malicious activity on its own; it only indicates potentially suspicious behavior warranting further investigation.

  ### Investigation Steps

  - **Check the process generating the DNS query:** Review logs for Security Event ID 4688 (Process Creation) to identify the process that initiated the DNS query. Confirm it is not a known browser process (e.g., chrome.exe, firefox.exe) that typically performs such requests.

  - **Examine the queried domains:** Correlate the queried domain names with known malicious indicators. Specifically, DNS queries for domains like 'api.ipify.org' originating from unexpected executables may indicate potential malicious activity.

  - **Review the timing and frequency of requests:** Analyze the volume and timing of DNS queries. Unusual spikes or repetitive querying within a short time frame can be indicative of automated tools being used for reconnaissance or malware communication.

  - **Investigate the source IP address of the DNS queries:** Validate if the host initiating the queries is authorized to access external IP lookup services. IP addresses for known servers or services should not be making these requests unless specifically justified in their activity logs.

  - **Identify legitimate usage patterns:** Note that legitimate use of IP lookup services often occurs from established applications, such as network configuration scripts or administration tools, which typically perform such queries as regular operations.

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive network configurations if exploited. The likelihood of malicious abuse is moderate, given that this behavior can indicate reconnaissance or preparation for a more significant attack. While IP lookup behaviors can be benign, the non-browser context raises concerns about intent and potential misuse.

  ### Blind Spots and Assumptions

  Detection is limited by the capability to monitor non-browser applications effectively; if such logs are not captured, legitimate usage may be mistaken for malicious activity. Certain administrative tools may also trigger this alert under normal operations. Additionally, adjacent detections such as monitoring network traffic for unusual outbound connections (e.g., C2 traffic) can further strengthen overall security posturing against potential breaches.

