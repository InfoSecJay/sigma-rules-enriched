note: |
  ### Technical Context

  This rule detects DNS queries made to domains ending with `.devtunnels.ms`. These domains are associated with Microsoft Azure's Dev Tunnel service, which can be misused by attackers to set up unauthorized reverse shells, enabling remote access and persistence on compromised systems. This behavior is typically indicative of a Command and Control (C2) mechanism being established by the attacker.

  The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with the technique being Application Layer Protocol (T1071.001) and implementation with non-standard protocols (T1572). Primary telemetry sources include DNS query logs from Windows servers (DNS server logs), specifically filtering for queries to `.devtunnels.ms`. If an alert is generated, it indicates a potential security threat, but it does NOT confirm that a malicious action has taken place without additional context, such as a known compromise or corroborating evidence.

  ### Investigation Steps

  - **Analyze DNS Query Logs:** Review DNS query logs (Event ID  DNS Query or similar) for entries containing `.devtunnels.ms`. Look for patterns associated with user's behavioral baselines.

  - **Correlate with Process Activity:** Check for recent process creation events (Windows Event ID 4688/Sysmon Event ID 1) on the affected system and correlate with the DNS query timestamp. Malicious activity will often have unusual process names or unexpected parent-child relationships.

  - **Examine Recent Network Connections:** Investigate network connections to ensure no suspicious outbound traffic is present. Focus on detecting connections on unusual ports that might correspond with a reverse shell.

  - **Identify Legitimate Uses:** Assess the legitimate use of Azure Dev Tunnels within your organization. Review user access logs and confirm if the user has a valid reason for using Dev Tunnels for development work.

  - **Query Recent Security Events:** Review any recent security or threat events (such as alerts triggered by EDR solutions) from the device in question. Notable precedents may include processes attempting to obfuscate network traffic or make unexpected outbound connections.

  ### Prioritization

  This alert is of medium severity as it indicates potential C2 activity through a known cloud service. The likelihood of malicious intent in enterprise environments is bolstered by the increasing sophistication of attackers, although legitimate use cases do exist. Continuous monitoring is necessary due to the prevalence of tools that could exploit Dev Tunnels.

  ### Blind Spots and Assumptions

  Detection relies heavily on DNS logging configurations, which can be limited in visibility if not properly enabled or retained. Attackers may evade detection through the use of alternative DNS services or employing encrypted DNS. Additionally, legitimate development activities (e.g., software development teams) that require use of Dev Tunnels may trigger these alerts. Consider companion detections for identified behaviors around unusual process executions or communication outbound to uncommon domains to enhance security posture.

