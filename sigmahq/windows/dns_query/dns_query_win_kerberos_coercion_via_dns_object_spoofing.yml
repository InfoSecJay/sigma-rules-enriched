note: |
  ### Technical Context
  This rule detects potentially harmful DNS queries indicating Kerberos coercion attempts through DNS object spoofing. Specifically, it focuses on a particular pattern, "1UWhRCAAAAA..BAAAA," which represents a base64-encoded structure tied to Kerberos authentication. Attackers leverage this technique to manipulate DNS records, allowing them to redirect authentication requests from genuine systems to malicious entities. By spoofing Service Principal Names (SPNs), adversaries can coerce user credentials, gaining unauthorized access to resources.

  The primary concern here is to prevent attackers from exploiting the Kerberos authentication protocol, which can lead to significant privilege escalation and unauthorized access to sensitive data or systems. This detection ties back to the MITRE ATT&CK techniques T1557.001 (Kerberos Coercion via DNS) and T1187 (Credential Dumping: Kerberos Ticket Granting Ticket (TGT) Ticket). The most relevant data sources for evidence in this case are DNS query logs, which can capture the compromised query patterns indicative of such attacks.

  ### Investigation Steps
  - **Review DNS Query Logs**: Examine logs for DNS queries that include the specific pattern "UWhRCA" and "BAAAA." Look for anomalous queries originating from internal systems that attempt to resolve suspicious SPNs.
  - **Correlate with Authentication Events**: Check authentication events around the same timestamp as the detected DNS queries. Investigate any failed or succeeded logins that correspond to anomalous DNS activity.
  - **Monitor Network Traffic**: Analyze outbound traffic to identify any communications with unknown or unauthorized external IP addresses, especially those tied to the DNS query patterns in question.
  - **Assess Active Directory Configurations**: Look for any recent changes to SPNs and review the permission levels associated with accounts that may have been compromised or manipulated during this attack scenario.

  ### Prioritization
  This alert carries a high severity level due to its association with potential credential theft and subsequent unauthorized access, which could result in severe impacts such as data breaches or system compromise. The likelihood of such attack scenarios occurring within an enterprise environment necessitates prompt investigation and response.

  ### Blind Spots and Assumptions
  One potential gap in this detection is the reliance solely on specific patterns in DNS query logs, which could lead to false negatives in cases of obfuscated encodings or variants of the pattern not currently accounted for. Additionally, this detection assumes that DNS logging is correctly implemented and that logs retain sufficient history for timely analysis. Organizations must ensure comprehensive logging configurations are in place, especially for DNS queries, to maximize the effectiveness of this detection rule.

