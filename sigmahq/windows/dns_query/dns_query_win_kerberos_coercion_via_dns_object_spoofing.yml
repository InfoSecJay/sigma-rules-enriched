note: |
  ### Technical Context

  This rule detects suspicious DNS queries indicative of Kerberos coercion attacks via DNS object spoofing. Specifically, it identifies DNS query patterns that include base64-encoded sequences linked to the CREDENTIAL_TARGET_INFORMATION structure. The likely attacker objective is to manipulate authentication processes, redirecting legitimate authentication requests to a malicious server by spoofing Service Principal Names (SPNs).

  Relevant MITRE ATT&CK tactic and technique: Credential Access (T1557) and Credential Dumping (T1003). Primary telemetry sources include Windows DNS query logs that capture DNS request details. If malicious, the impact can be severe as it may allow for the extraction of valid Kerberos tickets, leading to further lateral movement and privilege escalation. However, this detection does NOT confirm an active compromise by itself; it may merely indicate suspicious DNS activity that warrants further investigation.

  ### Investigation Steps

  - **Verify suspicious DNS query patterns:** Review logs for DNS queries containing "UWhRCA" and "BAAAA" in DNS query events (Event ID 10000). Any occurrence of these patterns should be marked for further analysis as potential indications of coercion attempts.

  - **Cross-reference DNS records:** Identify the source IP and hostname of the DNS query. Use DNS logs (Event ID DNS query logs) to determine if these records are legitimate and whether the SPNs being queried have been spoofed or altered.

  - **Assess recent authentication attempts:** Check the Security Event logs (Event ID 4624) for successful logon attempts to the affected services from suspect IP addresses. Compare these attempts to the expected user and host activity, noting any inconsistencies.

  - **Identify legitimate service interactions:** Review the historical DNS query patterns for the affected assets to assess expected behavior. This includes examining typical SPNs for services like SQL, HTTP, or LDAP that should appear consistently within your environment.

  - **Look for unusual outbound connections:** Review network egress logs for any outbound connections initiated from the suspected host to unauthorized or unknown IP addresses following the suspicious DNS queries. This can indicate potential data exfiltration or command-and-control activity.

  - **Validate Kerberos ticket stores:** Inspect the Ticket Granting Ticket (TGT) and service ticket stores via the Kerberos Ticket Manager. Look for tickets corresponding to SPNs influenced by the suspicious DNS queries, which may indicate unauthorized Kerberos ticket-granting activity.

  ### Prioritization

  This alert is high severity due to the potential for significant security impact if a Kerberos coercion attack is successful. The likelihood of malicious abuse is high, as the behavior is straightforward for attackers to weaponize against kerberized environments, especially where services can be redirected by DNS spoofing.

  ### Blind Spots and Assumptions

  Detection limitations include potential spoofing of legitimate DNS records, which may trigger false positives. It is crucial that organizations maintain comprehensive DNS logging to capture these events accurately. Legitimate administration and service interactions could generate similar DNS queries, thus requiring context awareness. Additionally, a related detection could be monitoring for abnormal Kerberos ticket usage (TGS requests) which complements this detection by confirming successful attack execution through ticket manipulation.

