level: medium
note: |
  ### Technical Context
  This rule detects DNS queries made to known domains associated with remote access tools (RATs), such as TeamViewer, LogMeIn, and Ammyy Admin from non-browser applications. Attackers often utilize these software solutions to establish command and control (C2) channels, allowing them to manipulate compromised systems. In this scenario, an adversary might aim to remotely manage or exfiltrate data from organizational endpoints using these services, often circumventing traditional application control implemented in many enterprise environments.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic: Command and Control (TA0011)**
    - **Technique: Remote Access Tools (T1219)**
    - **Sub-techniques:** Application Layer Protocol (T1219.002), which relates to malicious use of legitimate remote management software.

  Primary data sources required for detection are DNS query logs from Windows systems, as they will reveal attempts to resolve the domains of remote access tools. Additional telemetry data could include logs from the products themselves, if available, to correlate specific software executions with DNS query activity.

  ### Investigation Steps
  - **Review DNS Query Logs:** Analyze DNS query logs for requests made to any detected domains linked to remote access tools. Focus on any unusual or unexpected queries from endpoints that should not be using these applications.
  - **Correlate with Process Execution:** Examine process creation events to identify which applications triggered the DNS queries and validate whether they came from legitimate sources or unexpected applications.
  - **Analyze Network Traffic:** Utilize Network Detection and Response (NDR) tools to inspect outbound traffic to see if there are any suspicious patterns or to confirm the established connections to those domains.
  - **Evaluate Application Control Policies:** Check the application control policies in place to determine if those remote access tools are allowed or if they should be blocked, and consider potential policy adjustments based on findings.

  ### Prioritization
  This alert should be treated with medium priority due to the potential impact of unmonitored remote access tools, which can enable unauthorized access to sensitive systems or data. The likelihood of occurrence is significant since these tools are commonly used in legitimate IT operations, making detection challenging but critical.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the variety of remote access tools not included in the DNS query patterns, creating potential blind spots for less common software. The detection logic assumes that legitimate browser applications are excluded from this monitoring. The effective functioning of this alert requires comprehensive DNS logging configurations, as well as ensuring that endpoints have system-level access restricted to prevent unauthorized processes from initiating queries.

