note: |
  ### Technical Context

  This rule detects DNS queries to known remote access software domains generated by non-browser applications. Attackers often leverage legitimate remote access tools like TeamViewer, AnyDesk, and LogMeIn to facilitate unauthorized access to compromised systems, achieving their goals of data exfiltration or lateral movement within networks.

  This behavior aligns with the MITRE ATT&CK framework, specifically under Tactic: Command and Control (ID: TA0011) and Technique: Remote Access Software (ID: T1219.002). The primary telemetry source includes Windows DNS query logs, which can be collected via DNS logs or network traffic analysis tools. If malicious, it can lead to severe security impacts such as unauthorized access to sensitive information or systems. Note that this detection does NOT confirm malicious intent on its own; further investigation is needed to establish context.

  ### Investigation Steps

  - **Identify the querying application:** Review the logs for Event ID  DNS queries. Look for any applications outside of standard browsers (e.g., Chrome, Firefox) triggering queries to domains listed in the rule. Legitimate browser activity should not be observed for these queries.

  - **Verify application integrity:** Cross-reference the process names related to the detected queries against a whitelist of allowed software. Examine the parent process from Event ID 4688 to see if it is coming from non-standard applications or scripts that may indicate misuse.

  - **Analyze recent installations or updates:** Check for any new or updated software installations within the last 30 days that might correspond to the observed DNS queries. Leaning toward remote access tools can help ascertain if the activity is benign or malicious.

  - **Assess DNS logs for additional indicators:** Look at DNS logs for any unusual patterns, such as repeated queries to the same harmful domain or elevated amounts of traffic directed to such domains around the time the alert was triggered.

  - **Check for unauthorized network traffic:** Investigate outbound traffic on the system where the alert was triggered. Examine any established connections to remote access service domains. Use tools such as Windows Firewall logs to identify suspicious traffic patterns (Event ID 5156).

  - **Conduct a threat intelligence check:** Refer to threat intelligence databases for any indications of malicious activity involving the relevant domains. Look for known associations with adversaries or malware campaigns using those specific remote access tools.

  ### Prioritization

  This alert should be treated with medium severity. The potential impact is significant if an affected system is critical to business operations. The likelihood of malicious abuse is moderate, as such software can be weaponized for nefarious purposes. This behavior is commonly exploited by adversaries attempting to establish reliable command and control channels.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate use of remote access tools by IT departments or contractors. Ensure comprehensive logging from DNS and application execution to minimize blind spots. The alert may trigger during routine legitimate activities such as remote support sessions. Companion detections include monitoring for unusual outbound connections on the affected system, which can strengthen the coverage against potential exploitation.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
