level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries to known remote access software domains initiated by non-browser applications. Attackers often employ tools like TeamViewer, LogMeIn, and others to establish command and control channels with compromised systems. This behavior falls under the MITRE ATT&CK framework's Command and Control tactic (T1071.001), specifically focusing on the use of remote access software as a technique. The primary telemetry source is Windows DNS query logs, capturing the queried domains and associated process information. If execution is malicious, it could lead to unauthorized access and control over the targeted systems. This detection alone does not confirm malicious activity, as legitimate applications may also generate similar traffic.

  ### Investigation Steps

  - **Identify the process generating the DNS query:** Review Windows Event ID  DNS query logs (Event ID 22 in Windows DNS logs) configured to capture DNS traffic. Check the `Process Name` or `Image` field to see if it corresponds to non-browser applications known for remote access (e.g., TeamViewer, LogMeIn).

  - **Verify process legitimacy:** Cross-reference the process with an inventory of installed applications. Look for entries related to remote access tools not explicitly permitted for use in your environment, especially those associated with the queried domains.

  - **Check for high-confidence indicators:** Look for queries to domains like `client.teamviewer.com` or `logmein.com` from non-browser processes. Notably, queries where the `User Account` belongs to an unusual or unknown account can indicate potential compromise.

  - **Mainstream software usage:** Document legitimate software behavior by confirming authorized desktop support applications that may be generating DNS queries to these domains. Investigate if recent internal changes (new software installs or updates) could have affected normal activity.

  - **Correlate with endpoint activity:** Review Sysmon Event ID 1 (Process Creation) and Event ID 22 (DNS Query) to correlate timestamps and process IDs that appear in your DNS logs. Malicious activity may include atypical execution paths or command-line arguments.

  - **Assess asset criticality:** If the alert pertains to a sensitive or critical asset (e.g., a server or admin workstation), escalate and conduct a deeper analysis, as remote access can pose significant risks to these systems.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems with remote access control, which, if exploited, can lead to significant data breaches. The likelihood of malicious activity is moderate, as it depends on the context, but the presence of known remote access software in unexpected contexts raises concerns. This behavior is not uncommon among attackers, making it a valid area of investigation.

  ### Blind Spots and Assumptions

  Possible evasion techniques include adversaries disguising malicious remote access tools with legitimate names or leveraging whitelisted applications that are commonly used for support tasks. Ensure comprehensive logging for DNS requests in the environment; missing or improperly configured logs can weaken this detection. Legitimate activity may occur during scheduled remote support sessions, where internal support tools are used to access user devices. For enhanced detection capabilities, consider correlating with additional alerts for unusual process executions related to remote access tools.

