title: TeamViewer Domain Query By Non-TeamViewer Application
id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
status: test
description: Detects DNS queries to a TeamViewer domain only resolved by a TeamViewer
  client by an image that isn't named TeamViewer (sometimes used by threat actors
  for obfuscation)
references:
- https://www.teamviewer.com/en-us/
author: Florian Roth (Nextron Systems)
date: 2022-01-30
modified: 2023-09-18
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName:
    - 'taf.teamviewer.com'
    - 'udp.ping.teamviewer.com'
  filter_main_teamviewer:
        # Note: To avoid evasion based on similar names. Best add full install location of TeamViewer
    Image|contains: 'TeamViewer'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown binary names of TeamViewer
- Depending on the environment the rule might require some initial tuning before usage
  to avoid FP with third party applications
level: medium
note: |
  ### Technical Context
  This detection rule identifies DNS queries made to TeamViewer domains, specifically `taf.teamviewer.com` and `udp.ping.teamviewer.com`, that are initiated by processes not running under the TeamViewer application. TeamViewer is a remote access tool that, if misused, can enable unauthorized access to corporate systems. Attackers could leverage TeamViewer or a similar technology without the legitimate application, utilizing custom or obfuscated tools to evade security controls and establish command and control channels.

  The relevant MITRE ATT&CK tactics for this detection include **Command and Control (TA0011)**, where attackers attempt to establish remote access to systems, as well as **Application Layer Protocol (T1071)**, which covers how adversaries use application layer protocols for communication. Valid data sources that can provide high-fidelity evidence of such behavior include Windows DNS query logs, process creation events, and potentially any logging from security proxies or firewalls that might also capture these DNS requests.

  ### Investigation Steps
  - **Review DNS Logs**: Examine DNS query logs for any requests to TeamViewer domains made by non-TeamViewer applications. Pay particular attention to the timestamps and the originating IP addresses of these queries.
  - **Analyze Process Execution**: Investigate processes running at the time of the DNS queries. Collect detailed information on process IDs, parent processes, and any command-line arguments used to identify potential indicators of compromise.
  - **Identify Network Traffic**: Check for outbound network connections that correspond with the time of suspicious DNS queries. Focus on connections to known TeamViewer IP addresses to corroborate whether unauthorized access is taking place.
  - **Cross-reference User Access**: Verify the user account associated with any processes performing these DNS queries. Look for anomalies such as inactive accounts or accounts known for excessive access rights.

  ### Prioritization
  This alert should be treated with medium priority due to the potential impact of unauthorized remote access via TeamViewer, which can facilitate further compromise or data exfiltration if exploited effectively. The likelihood of this activity occurring within enterprise environments, especially if remote tools are in use, remains substantial.

  ### Blind Spots and Assumptions
  There may be detection gaps if legitimate third-party applications are misidentified as obfuscated TeamViewer instances, which could result in false positives. The detection logic assumes that TeamViewer is the only application resolving these specific domain queries, which might not hold true for environments using custom or whitelisted applications. Required logs must include comprehensive and accurate DNS query logs, as well as process monitoring to ensure all execution contexts are captured for effective detection.

