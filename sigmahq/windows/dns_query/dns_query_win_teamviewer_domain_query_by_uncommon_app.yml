title: TeamViewer Domain Query By Non-TeamViewer Application
id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
status: test
description: Detects DNS queries to a TeamViewer domain only resolved by a 
  TeamViewer client by an image that isn't named TeamViewer (sometimes used by 
  threat actors for obfuscation)
references:
- https://www.teamviewer.com/en-us/
author: Florian Roth (Nextron Systems)
date: 2022-01-30
modified: 2023-09-18
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName:
    - 'taf.teamviewer.com'
    - 'udp.ping.teamviewer.com'
  filter_main_teamviewer:
        # Note: To avoid evasion based on similar names. Best add full install location of TeamViewer
    Image|contains: 'TeamViewer'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown binary names of TeamViewer
- Depending on the environment the rule might require some initial tuning before
  usage to avoid FP with third party applications
level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries to TeamViewer domains made by applications not explicitly named "TeamViewer," potentially indicating malicious actors attempting to use TeamViewer-related communications for command and control (C2) purposes. The likely attacker objective is to bypass traditional defenses and employ TeamViewer as an obfuscated channel for unauthorized remote access or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071), specifically technique T1219.002 (Multi-Protocol Tunnel), where attackers utilize legitimate software to obscure their actions.

  The primary telemetry sources are DNS query logs from Windows, specifically looking for queries directed at domains such as `taf.teamviewer.com` and `udp.ping.teamviewer.com`. If these queries originate from applications that aren't legitimate TeamViewer executables, it raises significant security concerns regarding unauthorized access or data theft. This detection does not confirm whether malicious activity is occurring; further investigation is required to determine the intent behind the DNS queries and the nature of the querying application.

  ### Investigation Steps

  - **Identify the querying application**: Review Security Event ID 4688 (Process Creation) logs for entries related to the detected DNS queries. Look for image names and hash values of the querying application. Compare these against known TeamViewer executable hashes.

  - **Check DNS query context**: Analyze DNS logs for the specific queries made to `taf.teamviewer.com` or `udp.ping.teamviewer.com`. Ensure that these queries are not generated by legitimate TeamViewer installations, focusing on the `QueryName` field.

  - **Validate legitimate usage**: Cross-reference the detected application name against a list of approved software. Check if TeamViewer is installed and its normal operating behavior, including expected uses of DNS queries for legitimate remote sessions.

  - **Investigate for indicators of compromise**: Examine for suspicious process behavior by retrieving Sysmon Event ID 1 logs for the application involved. Look for high-confidence indicators of compromise such as outbound traffic to known malicious IPs or unusual command-line arguments.

  - **Evaluate host criticality**: Identify the role of the affected endpoint. If it handles sensitive information or critical infrastructure, escalate the investigation priority, regardless of the initial context of the querying application.

  ### Prioritization

  This alert has medium severity as it targets potentially unauthorized use of TeamViewer, which could lead to data breaches or system compromises. Given TeamViewer's common usage for legitimate remote access, distinguishing between benign and malicious use is crucial, especially as it can easily be weaponized by adversaries leveraging established tools.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if DNS query logs are not thoroughly collected or if the querying applications manipulate their names to evade detection. Legitimate activities may include authorized third-party applications that covertly use TeamViewer, necessitating an evaluation of their legitimacy. Related detection could involve monitoring for unusual outbound traffic patterns that align with TeamViewer connections, strengthening visibility into potential misuse.

