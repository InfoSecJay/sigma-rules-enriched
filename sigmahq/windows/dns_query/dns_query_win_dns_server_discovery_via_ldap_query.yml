title: DNS Server Discovery Via LDAP Query
id: a21bcd7e-38ec-49ad-b69a-9ea17e69509e
status: test
description: Detects DNS server discovery via LDAP query requests from uncommon applications
references:
- https://github.com/redcanaryco/atomic-red-team/blob/980f3f83fd81f37c1ca9c02dccfd1c3d9f9d0841/atomics/T1016/T1016.md#atomic-test-9---dns-server-discovery-using-nslookup
- https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/7fcdce70-5205-44d6-9c3a-260e616a2f04
author: frack113
date: 2022-08-20
modified: 2023-09-18
tags:
- attack.discovery
- attack.t1482
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName|startswith: '_ldap.'
  filter_main_generic:
    Image|contains:
    - ':\Program Files\'
    - ':\Program Files (x86)\'
    - ':\Windows\'
  filter_main_defender:
    Image|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith: '\MsMpEng.exe'
  filter_main_unknown:
    Image: '<unknown process>'
  filter_optional_azure:
    Image|startswith: 'C:\WindowsAzure\GuestAgent'
  filter_main_null:
    Image:
  filter_optional_browsers:
        # Note: This list is for browsers installed in the user context. To avoid basic evasions based on image name. Best to baseline this list with the browsers you use internally and add their full paths.
    Image|endswith:
    - '\chrome.exe'
    - '\firefox.exe'
    - '\opera.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
# Note: Incrase the level once a baseline is established
level: low
note: |
  ### Technical Context
  This detection rule identifies potential DNS server discovery via LDAP queries initiated by uncommon applications. Attackers may leverage this technique to gather information about a network's domain resources, such as DNS servers, which can be crucial for further reconnaissance or lateral movement. The likely objective of the attacker is to obtain detailed network information that could assist in planning a more extensive infiltration or privilege escalation attack.

  This rule is associated with the MITRE ATT&CK framework under the tactics of **Discovery** and the technique **T1482: Domain Information Discovery**. By monitoring LDAP queries, the detection focuses on abnormal behavior and identifies potentially malicious actions stemming from unauthorized applications or processes attempting to enumerate sensitive domain information.

  Primary telemetry sources for evidence gathering include DNS query logs and Windows process creation events, allowing for insights into the applications making these requests.

  ### Investigation Steps
  - **Review DNS Query Logs:** Check logs for any unusual queries, particularly those starting with `_ldap.`, to identify what information is being requested and from which applications.
  - **Examine Process Creation Events:** Investigate the processes associated with the LDAP queries to identify whether they are legitimate or indicative of malicious activities. Pay attention to those originating from uncommon applications.
  - **Assess Active Directory Integration:** Determine if the applications making the queries have legitimate roles within the AD environment, and analyze their permissions and access to ensure they should be querying this information.
  - **Check for Anomalous Activity:** Look for patterns of suspicious behavior surrounding the identified queries, including unusual times of access, frequency of queries, or abnormal IP source addresses.

  ### Prioritization
  This alert is rated low severity as it indicates potential reconnaissance activity that may not immediately lead to a successful attack. However, frequent behavior of this nature could indicate the preparation stage of a larger threat operation, necessitating further investigation to prevent potential breaches.

  ### Blind Spots and Assumptions
  The detection logic may not cover legitimate administrative tasks that require DNS server discovery via LDAP queries, potentially leading to false positives. Additionally, this rule assumes that all legitimate applications have been accounted for in the allowed image list, which may not always be comprehensive. It's crucial that logging configurations for both DNS queries and process execution are actively maintained to enable accurate detection of these activities.

