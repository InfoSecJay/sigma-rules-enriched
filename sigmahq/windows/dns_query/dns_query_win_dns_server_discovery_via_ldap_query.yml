title: DNS Server Discovery Via LDAP Query
id: a21bcd7e-38ec-49ad-b69a-9ea17e69509e
status: test
description: Detects DNS server discovery via LDAP query requests from uncommon 
  applications
references:
- https://github.com/redcanaryco/atomic-red-team/blob/980f3f83fd81f37c1ca9c02dccfd1c3d9f9d0841/atomics/T1016/T1016.md#atomic-test-9---dns-server-discovery-using-nslookup
- https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/7fcdce70-5205-44d6-9c3a-260e616a2f04
author: frack113
date: 2022-08-20
modified: 2023-09-18
tags:
- attack.discovery
- attack.t1482
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    QueryName|startswith: '_ldap.'
  filter_main_generic:
    Image|contains:
    - ':\Program Files\'
    - ':\Program Files (x86)\'
    - ':\Windows\'
  filter_main_defender:
    Image|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith: '\MsMpEng.exe'
  filter_main_unknown:
    Image: '<unknown process>'
  filter_optional_azure:
    Image|startswith: 'C:\WindowsAzure\GuestAgent'
  filter_main_null:
    Image:
  filter_optional_browsers:
        # Note: This list is for browsers installed in the user context. To avoid basic evasions based on image name. Best to baseline this list with the browsers you use internally and add their full paths.
    Image|endswith:
    - '\chrome.exe'
    - '\firefox.exe'
    - '\opera.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
# Note: Incrase the level once a baseline is established
level: low
note: |
  ### Technical Context

  This Sigma rule detects DNS server discovery attempts through LDAP query requests initiated by uncommon applications, which may indicate reconnaissance behavior by an attacker. The likely attacker objective is to identify active DNS servers within the environment, potentially aiding further attacks such as lateral movement, privilege escalation, or data exfiltration. This correlates with the MITRE ATT&CK tactic of Discovery (TA Discovery) and the technique of DNS Server Discovery via LDAP (T1016).

  Primary telemetry sources include Windows DNS query logs, specifically focusing on requests where the `QueryName` starts with `_ldap.`. If malicious, this activity could lead to unauthorized network mapping or targeting of vulnerable systems. This detection does NOT conclusively identify a compromise but flags unusual query behavior that warrants further investigation.

  ### Investigation Steps

  - **Review the source of the LDAP query:** Examine DNS query logs for Event ID 4000 or equivalent, paying close attention to the `QueryName` field. A legitimate query typically comes from known administrative tools or applications, while common applications do not normally initiate LDAP queries.

  - **Identify the querying application:** Analyze the `Image` field in the query logs to determine the application generating the request. Normal activity typically involves well-known applications, such as `nslookup.exe`, while uncommon applications initiating queries may indicate a red flag.

  - **Correlate with host behavior:** Check for other log entries (e.g., Sysmon Event ID 1 for process creation) around the same timestamp to gather context on the suspected querying application. Look for unusual process activity, especially those launching from non-standard directories.

  - **Assess network communication:** Utilize network logs to trace connections made by the querying application. Uncommon communication patterns or outgoing requests to DNS servers from unexpected sources indicate possible malicious behavior.

  - **Validate against known benign activity:** Cross-reference findings with your organization's normal operational behavior. If the application aligns with expected usage patterns (e.g., known admins using LDAP queries for legitimate purposes), this may reduce the threat confidence of the alert.

  ### Prioritization

  This alert has a low severity rating in a mature enterprise context due to the wide range of potential legitimate LDAP queries. However, if the query originates from an uncommon application or an unexpected host, it should be treated with increased scrutiny due to its potential exploitation in reconnaissance phases by attackers.

  ### Blind Spots and Assumptions

  The detection may be limited by the inability to correlate queries originating from services marked as "unknown process," as they are less identifiable. A requirement for reliable detection includes proper logging of DNS queries and process executions. Additionally, legitimate software for monitoring or backup may trigger this alert during normal operations, such as directory synchronization tools. A related detection to strengthen coverage would involve monitoring for unauthorized DNS configurations or changes made to the DNS infrastructure.

