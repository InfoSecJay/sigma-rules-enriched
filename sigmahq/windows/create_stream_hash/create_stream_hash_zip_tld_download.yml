note: |
  ### Technical Context

  This Sigma rule detects the downloading of files with potentially suspicious extensions from a .zip top-level domain (TLD). Such behavior often indicates that an adversary aims to deliver malicious payloads disguised as ordinary files, taking advantage of the ZIP format's commonality to bypass security measures. The relevant MITRE ATT&CK tactics are **Initial Access (T1071)** and **Execution (T1203)**, with techniques including **Application Layer Protocol: Web Service (T1071.001)** and **Malicious File (T1203)**.

  Primary telemetry sources include Windows security logs, specifically Sysmon logs that capture file creation events and alternate data streams. If malicious, the downloaded files could lead to malware execution or further compromise of the system. Importantly, this detection does NOT confirm that malicious activity occurred on its own; it merely identifies potentially suspicious download activity.

  ### Investigation Steps

  - **Identify relevant Sysmon logs:** Review Sysmon Event ID 11 for file creation or modification, particularly focusing on entries where `Contents` contains `.zip/` and `TargetFilename` matches any of the specified extensions to confirm potential threats.

  - **Verify the file origin:** Check the referring URL for the download in web browser history or relevant W3C access logs to determine if the download originated from a trusted source or a known malicious site.

  - **Examine the file attributes:** Investigate the file metadata or properties of any downloaded files (e.g., hash values, creation dates) to confirm if they exhibit characteristics consistent with known malware, such as unusual file sizes or incorrect signatures.

  - **Assess legitimate use cases:** Consider expected behavior on the host, such as authorized applications downloading files from reputable sources that use `.zip` TLDs, ensuring that such activities are documented and regularly reviewed.

  - **Check for execution attempts:** Review Security Event ID 4688 for process creation logs related to the downloaded files, particularly if executables are run immediately after download, indicating a higher likelihood of malicious intent.

  ### Prioritization

  This alert carries high severity due to the potential impact of executed malware, particularly if it compromises sensitive systems or data. The likelihood of malicious abuse is significant as adversaries frequently utilize zipped files to bypass defenses. This tactic is commonly weaponized, making rigorous investigation essential.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not properly logging file downloads or those with inconsistent Sysmon configurations, which could allow malicious activity to go unnoticed. Legitimate activities, such as software updates or file sharing from trusted services, might occasionally trigger this alert. Companion detections, such as monitoring for outbound connections to unknown or suspicious external IPs after these downloads, can further enhance coverage.

