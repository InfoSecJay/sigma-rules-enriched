note: |
  ### Technical Context
  This rule detects the download of files with potentially harmful extensions from URLs associated with the .zip top-level domain (TLD). The presence of certain file types—such as executables, scripts, and macros—after a .zip domain could indicate malicious intentions, particularly if these files are intended for evasion tactics or lateral movement within a compromised network. Attackers often leverage misleading URLs to host malicious payloads, taking advantage of legitimate-looking TLDs to bypass security checks.

  The likely attacker objectives include distributing malware, gaining initial access to a target environment, or exfiltrating data through obfuscated means. By using anomalously crafted URLs, they aim to deceive users or security mechanisms into executing such files. The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1564)**: Covering their tracks by misleading domains.
  - **Credential Access (T1110)**: Using malicious tools to harvest credentials from compromised endpoints.

  The primary data source for this detection is **Windows event logs**, particularly focusing on the creation of alternate data streams which can indicate potentially suspicious file manipulations.

  ### Investigation Steps
  - **Review Logs for Downloads**: Examine Windows event logs related to file downloads, especially focusing on entries that reference alternate data streams from URLs ending in .zip.
  - **Analyze Download Patterns**: Look for unusual or high-volume downloads from the .zip top-level domain, particularly concerning file types with potential malicious intent (e.g., .exe, .vbs).
  - **Cross-reference with Threat Intelligence**: Utilize existing threat intelligence feeds to check if the downloaded file types or domains have been reported as associated with known threats or malicious activities.
  - **Conduct Endpoint Examination**: Investigate the endpoints where the downloads originated, looking for recent changes to file system activity that may indicate compromised systems and further malicious actions.

  ### Prioritization
  Given the potential impact of executing malicious files downloaded from trusted-looking domains, this alert is of high priority in an enterprise environment. The likelihood of such threats necessitates immediate response to minimize risk exposure.

  ### Blind Spots and Assumptions
  There might be gaps in detection coverage regarding false negatives from legitimate file downloads, especially if they are from confirmed and known good sources using the .zip TLD. The detection logic assumes that specific file types being downloaded will maliciously leverage the .zip domain, which may not always be the case. Additionally, successful alert generation relies on the proper configuration and logging of Windows event sources capturing file hash creation events, which if misconfigured, could lead to missed detections.

