  ---

  ### Technical Context

  This Sigma rule detects the downloading of files with potentially malicious extensions from websites using a .zip top-level domain (TLD). The likely attacker objective is to deliver malware or malicious scripts disguised in files that users may mistakenly trust due to their delivery method. This activity relates to the MITRE ATT&CK technique: **T1405 - Content Delivery Network (CDN) (ID: T1405)**, as it often leverages common web domains to bypass security controls.

  The primary telemetry sources include Windows event logs related to file download activities, particularly focusing on the *create_stream_hash* category, which captures details about file downloads and attributes associated with them. If malicious, this detection indicates a potential file delivery mechanism that may lead to further compromise or execution of harmful activities. Importantly, this detection does NOT confirm that the downloaded file is inherently malicious; further analysis is required to determine its intent and functionality.

  ---

  ### Investigation Steps

  - **Review event details: Examine Event IDs:** Check for relevant Windows Event ID 4663 (Access Attempt) and Sysmon Event ID 21 (File Created). Specifically look for the *TargetFilename* field that indicates the name and path of the downloaded files.

  - **Verify extension and zone:** Confirm if the *TargetFilename* ends with one of the specified potentially malicious extensions (e.g., .exe, .vbs, etc.) and check if “Zone” field indicates a suspicious origin, such as *Zone.Identifier::$DATA*, indicating potential tampering for execution.

  - **Analyze file contents:** If safe, download the flagged file in a controlled environment and perform a static or dynamic analysis to determine if it contains malicious code or behavior.

  - **Identify legitimate usage:** Review the downloading user or system activity trends for typical benign downloads from .zip domains. In cases of high user engagement with .zip content, prioritize such context during investigation.

  - **Check for anomalous network behavior:** Investigate network logs to determine if other suspicious connections or excessive file download attempts were made from the same .zip domain or related domains, indicating potential large-scale malicious behavior.

  - **Investigate related alerts:** Search for additional alerts related to file execution or PowerShell command execution (Events IDs 4688 and 4104) that occurred shortly after the download event for correlated suspicious activity.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential delivery of malware from a .zip domain, which may lead to significant security incidents if executed. The likelihood of malicious abuse is elevated, as adversaries often use seemingly benign domains to deliver various types of malware. This behavior is commonly weaponized, especially in phishing campaigns.

  ---

  ### Blind Spots and Assumptions

  This detection has limitations as it may generate false positives from legitimate file downloads used in regular business operations. Evasion techniques could involve the use of alternative TLDs or obfuscation methods that are not caught by this detection. It's critical to ensure comprehensive logging configurations are in place, particularly for *create_stream_hash* events. Companion detections such as those monitoring the execution of files after download (e.g., process creation) will bolster overall detection capabilities.

