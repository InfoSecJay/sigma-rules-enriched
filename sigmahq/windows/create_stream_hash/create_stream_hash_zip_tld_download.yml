title: Potentially Suspicious File Download From ZIP TLD
id: 0bb4bbeb-fe52-4044-b40c-430a04577ebe
status: test
description: Detects the download of a file with a potentially suspicious 
  extension from a .zip top level domain.
references:
- https://twitter.com/cyb3rops/status/1659175181695287297
- https://fabian-voith.de/2020/06/25/sysmon-v11-1-reads-alternate-data-streams/
author: Florian Roth (Nextron Systems)
date: 2023-05-18
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|contains: '.zip/'
    TargetFilename|contains:
    - '.bat:Zone'
    - '.dat:Zone'
    - '.dll:Zone'
    - '.doc:Zone'
    - '.docm:Zone'
    - '.exe:Zone'
    - '.hta:Zone'
    - '.pptm:Zone'
    - '.ps1:Zone'
    - '.rar:Zone'
    - '.rtf:Zone'
    - '.sct:Zone'
    - '.vbe:Zone'
    - '.vbs:Zone'
    - '.ws:Zone'
    - '.wsf:Zone'
    - '.xll:Zone'
    - '.xls:Zone'
    - '.xlsm:Zone'
    - '.zip:Zone'
  condition: selection
falsepositives:
- Legitimate file downloads from a websites and web services that uses the 
  ".zip" top level domain.
level: high
note: |
  ### Technical Context

  This rule detects file downloads with potentially suspicious extensions from a .zip top-level domain, often indicative of harmful files being served in a compressed format. Attackers may use this technique to bypass security controls and deliver malware, as compressed files can be less scrutinized. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion (T1203)** and the technique of **Exploitation for Client Execution (T1203)**, where attackers aim to execute malicious payloads by evading detection mechanisms.

  The primary telemetry source for this detection is the Windows Event logs, specifically those related to file creation and hashing (e.g., Sysmon Event ID 11 for process creation). If malicious, the security impact could range from data loss to complete system compromise, especially if the file is executed. This detection does NOT confirm that a file is malicious on its own; further investigation is needed to establish intent and context.

  ---

  ### Investigation Steps

  - **Check the source of the download:** Review the **HTTP Request logs** (fields: Source IP, URL) to identify the referring website. Legitimate sources or well-known services are less likely to be a concern.

  - **Review the downloaded file's metadata:** Inspect **Sysmon Event ID 11 logs** focusing on the **TargetFilename**. Verify the file extension is among those listed in the rule (e.g., '.exe:Zone'). A legitimate document extension like '.pdf' would not trigger further concern.

  - **Identify execution attempts:** Look for any subsequent **Windows Event ID 4688** entries that indicate the downloaded file was executed. Confirm whether it corresponds to any of the suspicious extensions.

  - **Correlate with known threat intelligence:** Cross-reference the file hashes (from Sysmon logs) against threat intelligence databases (e.g., VirusTotal) to identify known malicious files. Any negative results warrant further investigation.

  - **Observe network traffic:** Analyze **Firewall logs (ports used)** or **DNS logs** for unusual outbound connections related to the download. Malicious files often communicate with command and control servers shortly after execution.

  - **Document user activity and context:** Confirm the user account that initiated the download. Check for previous patterns of suspicious behavior or if the action falls outside normal job functions. Look for a logged usage context that fits legitimate organizational practices.

  ---

  ### Prioritization

  This alert has high severity due to the potential of impacting critical systems with malicious downloads. The likelihood of abuse is significant, especially as attackers frequently exploit compressed file formats. Suspicious file extensions are commonly weaponized, so immediate attention and investigation are warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be bypassed with encrypted or obfuscated downloads, and benign traffic from legitimate sites may trigger this alert. Reliable detection hinges on correct configurations for Sysmon and Windows Event logging. Legitimate file downloads from trusted vendors may lead to false positives. A related detection, such as monitoring for execution of unusual file types (e.g., via Sysmon or Windows Event ID 4688), can enhance coverage and reduce uncertainty surrounding the compliance of the alert.

