  ---

  ### Technical Context

  This rule detects the use of the `regedit.exe` utility to export a registry key and hide it within an alternate data stream (ADS). This behavior is typically used by adversaries to conceal malicious activities or artifacts, such as the presence of a backdoor or unauthorized modifications to the system's configuration. The likely attacker objective is to maintain persistence or exfiltrate sensitive information while avoiding detection. This activity falls under the MITRE ATT&CK tactic of Defense Evasion (ID: T1564.004).

  Primary telemetry sources include Windows Security Event ID 4663, which records attempts to access or modify registry keys, and File System logs that identify the creation of alternate data streams. If this activity is malicious, it can lead to unauthorized access, data theft, and compromised system integrity. However, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may trigger this alert.

  ---

  ### Investigation Steps

  - **Review Event ID 4663:** Check for access to registry keys by `regedit.exe`. Specifically, confirm the `Object Type` field shows 'Key', and the `Access Mask` includes `0x1F0001` for full access rights, indicating a potential export attempt.

  - **Inspect Alternate Data Streams:** Use PowerShell to list alternate data streams on the affected files (`Get-Item -Path <file_path>:*`). Look for suspicious streams annotated with filenames that do not correspond with legitimate activity.

  - **Identify Legitimate Export Patterns:** Verify if the registry key being accessed relates to critical system settings or applications. Common benign actions may include exports of software settings by IT administrators for backup.

  - **Cross-reference Process Initiation:** Confirm the parent process of `regedit.exe` via Sysmon Event ID 1. Look for unusual parent processes such as non-administrative tools or scripts, which could indicate unauthorized execution.

  - **Examine User Context:** Assess the account that executed the `regedit.exe` command. Log entries should show if the user is part of an administrative group or if a system account executed the command, with a focus on high-privilege contexts.

  - **Correlate with Known Threat Indicators:** Cross-check the detected behavior against threat intelligence for any IOCs related to known malware that utilizes ADS. Look for signatures or patterns that align with the specific attacker’s tools.

  ---

  ### Prioritization

  Given that this detection targets the use of a common Windows tool for potential malicious purposes, it should be treated as high severity. The potential impact can be significant, especially if critical registry keys are being manipulated to bypass security controls. The likelihood of this behavior being weaponized by adversaries is notable, particularly in sophisticated attacks targeting persistence.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations such as evasion techniques involving alternate data streams not well captured by logging configurations. Ensuring detailed auditing settings are enabled for registry access and file system monitoring is essential for reliable detection. Legitimate administrative activities, such as configuration backups, may generate false positives. Related detections, such as suspicious registry modifications or unauthorized command line executions, can enhance detection coverage and provide further context on malicious activity.

