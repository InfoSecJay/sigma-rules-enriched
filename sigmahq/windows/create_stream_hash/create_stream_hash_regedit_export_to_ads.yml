note: |
  ### Technical Context
  This detection rule identifies the exportation of Windows Registry keys into an Alternate Data Stream (ADS) using the `regedit.exe` tool. The use of ADS makes the exported data less visible, thus enabling attackers to conceal their activities. By exploiting this technique, threat actors may aim to retain persistence or stealthily manipulate the system or user configurations without drawing attention. This type of behavior aligns with the objectives of evasion tactics, where attackers obfuscate their actions to avoid detection.

  The relevant MITRE ATT&CK tactics and techniques for this rule include **Defense Evasion (T1564.004)**, as it highlights the use of alternate data streams to hide malicious payloads or artifacts from security monitoring. This method aids in maintaining persistence or hiding sensitive information leveraged during an attack.

  The primary data sources for detecting this behavior are logs generated from Windows process creations related to `regedit.exe`, as well as logs capturing the creation of alternate data streams, specifically through systems monitoring file and process activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `regedit.exe` execution. Focus on timestamps and parent processes that may indicate suspicious behavior or unusual execution contexts.

  - **Analyze Alternate Data Stream Activity**: Investigate file system events that include entries related to Alternate Data Streams. Look for non-standard or unexpected streams attached to key files or registry settings.

  - **Correlate with User Actions**: Look into user account activities around the times of `regedit.exe` execution. Identify any unusual privilege escalations or accounts that should typically not interact with the registry.

  - **Check for Persistence Mechanisms**: Explore other potential persistence mechanisms that may have been established alongside the Registry key exports. This includes crontabs, scheduled tasks, or additional services leveraging the exported data.

  ### Prioritization
  Given the high likelihood of an attacker using this technique to evade detection while modifying critical system settings or maintaining persistence, the severity of this alert is elevated. In an enterprise environment, such activity could indicate a serious threat or compromise requiring urgent investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage involves environments where logging for process creation or ADS activities is not properly configured or enabled. Additionally, the detection logic assumes that `regedit.exe` is the exclusive tool used for this operation, which may not hold true if attackers employ other methods or tools for similar results. Comprehensive logging of file system activities and process executions is required to ensure the effectiveness of the alert and capture all relevant artifacts.

