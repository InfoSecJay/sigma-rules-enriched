  ### Technical Context

  This Sigma rule detects the use of the `regedit.exe` utility to export a target Registry key into an Alternate Data Stream (ADS). This behavior is often employed by attackers to stealthily exfiltrate or store sensitive configuration data, allowing them to persist in an environment undiscovered. The likely objective is to hide malicious configurations or tools that can facilitate future access or control of a compromised system.

  The relevant MITRE ATT&CK tactics and techniques are "Persistence" (TA0003) and "Alternate Data Streams" (T1564.004). Primary telemetry sources include Windows Security and Sysmon logs, specifically looking for Event ID 4656 (handle access) related to file creation with specific parameters indicating the use of ADS. If the behavior is malicious, it could allow an attacker covert access to sensitive key information and facilitate further exploitation.

  This detection does NOT confirm active malicious conduct on its own; legitimate administrative actions may also trigger similar behavior.

  ### Investigation Steps

  - **Examine Registry Activity:** Investigate Security Event ID 4656 to verify if `regedit.exe` is accessing Registry keys that commonly indicate sensitive configurations (e.g., SAM, SYSTEM).
  - **Review Process Creation Events:** Check Sysmon Event ID 1 for any instances of `regedit.exe` being executed, noting the command line arguments used. Look for unusual parameters indicating potential misuse.
  - **Validate Alternate Data Streams:** Use PowerShell commands (e.g., `Get-Item -Path "C:\Path\To\Your\File" -Stream *`) to look for ADS on files created in conjunction with `regedit.exe`. Legitimate usage typically lacks ADS.
  - **Identify High-confidence Malicious Indicators:** Determine if the exported Registry information is linked to known malicious functionality or persistence methods, such as keys that monitor user activity or enable backdoor processes.
  - **Understand Normal Operations:** Compare behavior against typical IT administrative activities where `regedit.exe` might be legitimately used, focusing on timeframes and assets involved (e.g., systems undergoing maintenance or configuration changes).
  - **Check File Creation Metadata:** Investigate the creation time and content of any files related to the Alternate Data Stream; irregular timestamps or unusual content could indicate malicious intent.

  ### Prioritization

  This alert should be treated with high severity due to the potential security impact of compromised systems being leveraged for data exfiltration or persistence mechanisms. The techniques being monitored are commonly used in stealthy, evasive attacks, increasing the likelihood of exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging or missing security event logs that capture complete actions related to ADS. Normal administrative practices such as backups or configurations changes may inadvertently trigger this alert. Companion detections include monitoring for unusual parent-child process relationships where `regedit.exe` spawns from other common administrative tools.

