  ### Technical Context

  This rule detects the use of the `regedit.exe` application to export a Windows Registry key and subsequently store it in an alternate data stream (ADS). The primary attacker objective is to exfiltrate sensitive registry information while evading detection by hiding the data in less scrutinized areas of the filesystem. This behavior pertains to the MITRE ATT&CK technique T1564.004 (Hide Data in Alternate Data Streams). The primary telemetry source is the Windows event log that captures stream creation activities, specifically focusing on operations involving `regedit.exe`. If executed by an attacker, this activity could signify an attempt to access sensitive configuration data, which can aid them in further compromising the system. This detection does NOT confirm malicious intent on its own, as legitimate administration processes may also utilize registry exports.

  ### Investigation Steps

  - **Verify the execution of regedit.exe:**
    Check for Security Event ID 4688 or Sysmon Event ID 1 to trace the execution of `regedit.exe`. Confirm that it was initiated by an unexpected user or at an unusual time, indicating potential malicious behavior.

  - **Identify alternate data streams created:**
    Utilize tools like `Get-Item` in PowerShell or the ADS command-line tool to inspect for new streams in the target directories. Look for streams associated with exported registry keys, which might have names indicative of data exports, such as `:registry` or similar.

  - **Review the contents of the alternate data stream:**
    If a suspicious ADS is found, extract and analyze its contents for sensitive information (e.g., stored credentials, configuration details). Compare the contents against known legitimate data to assess if any sensitive information has been exfiltrated.

  - **Assess legitimate usage scenarios:**
    Document any legitimate uses of `regedit.exe` such as regular maintenance tasks by authorized personnel or system updates that could explain the activity without malicious intent.

  - **Check system criticality and user behavior:**
    Consider the host role (e.g., Domain Controller, File Server) and the user account involved. If the user typically does not perform registry operations or if the system plays a vital role in operations, prioritize further investigation.

  - **Correlate with defense evasion techniques:**
    Look for patterns of behavior that can indicate an attack such as repeated use of `regedit.exe` or tracing any related suspicious commands that lead to data manipulation or exfiltration.

  ### Prioritization

  The alert is of high severity due to the potential impact on the confidentiality and integrity of sensitive configurations in critical systems. The likelihood of malicious abuse is high, especially in the context of evasion and stealth tactics commonly used by adversaries. The technique leveraged is known to be weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if alternate data streams are not adequately monitored, and certain defensive configurations may be necessary for reliable detection. Legitimate tasks by system administrators could trigger this alert, leading to potential false positives. A related detection to enhance coverage could include monitoring for unusual registry access patterns or changes to sensitive registry hives.

