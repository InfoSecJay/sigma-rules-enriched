note: |
  ### Technical Context

  This rule detects unusual file downloads from known file-sharing websites. Such behavior may indicate data exfiltration, malware delivery, or compromise by adversaries targeting sensitive data. The likely attacker goal is to retrieve or distribute malicious or unauthorized files while obscuring this activity through legitimate file-sharing services. This aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1071.001).

  The primary telemetry source for this detection originates from Windows Event ID 90015, indicating the creation of a stream hash. If malicious, the impact could lead to unauthorized access, data leaks, or the execution of harmful scripts. This detection does NOT confirm malicious intent on its own, as legitimate users may also download files from these domains for valid purposes.

  ### Investigation Steps

  - **Verify download context:** Check the user's recent download activity in Event ID 90015 and correlate it with user roles to determine if the download aligns with typical job functions (e.g., software developers downloading scripts).

  - **Examine file types:** Review the downloaded file extensions from the relevant logs, specifically looking for suspicious types, such as those flagged by the rule like `.bat:Zone`, `.cmd:Zone`, or `.ps1:Zone`. Legitimate scripts or temporary files should not typically have these extensions.

  - **Identify user behavior:** Analyze user account interaction history in the logs for unusual patterns, such as downloading files from multiple suspicious domains in a short time. This could indicate a compromise rather than typical user activity.

  - **Cross-reference download sources:** Validate the domains from which files were downloaded against known safe domains for your organization. High-risk domains include `anonfiles.com`, `mediafire.com`, and `sendspace.com` which are frequently associated with malware.

  - **Investigate network artifacts:** Look into firewall and proxy logs for unusual outbound traffic to the detected domains. Confirm the presence of any high-volume data transfers or suspicious connections initiated by the endpoint.

  - **Conduct endpoint analysis:** Perform a thorough examination of the affected endpoint for signs of malicious artifacts or processes. This includes checking for the creation of unusual or unexpected files related to the detected downloads.

  ### Prioritization

  The alert should be treated as medium severity because it may indicate potential data exfiltration or malware delivery that could compromise sensitive systems, particularly if it involves critical infrastructure or sensitive user data. The likelihood of abuse is heightened given the nature of the detected domains and the common weaponization of such techniques in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by users accessing content from legitimate file-sharing services for perfectly valid reasons, such as sharing documents or code snippets. It is essential to ensure that logging for Event ID 90015 is adequately configured and monitored across endpoints. Additionally, there may be benign activity triggering the alert from developers or researchers frequently downloading scripts. A related detection on outbound traffic to suspicious IPs or URLs could provide broader context and assist in correlating malicious patterns.

