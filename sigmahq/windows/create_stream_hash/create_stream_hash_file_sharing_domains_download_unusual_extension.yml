note: |
  ### Technical Context

  This Sigma rule detects the downloading of potentially malicious files, specifically scripts and batch files, from a list of known file-sharing domains. This behavior is often indicative of an attacker attempting to obtain persistent access, deploy payloads, or escalate privileges within a network. The relevant MITRE ATT&CK tactics are "Initial Access" (TA0001) and "Execution" (TA0002), with techniques including "Spearfishing via Service" (T1566) and "User Execution" (T1203).

  The primary telemetry source is Windows Event ID 90015, which captures file stream hash creation activity. If the detected file is malicious, it may lead to unauthorized access or damage to system integrity. Importantly, while this detection highlights unusual download activity, it does not confirm that the downloaded files were executed or that they succeeded in compromising the system.

  ### Investigation Steps

  - **Review Event ID 90015 logs**: Look for recent entries related to file downloads, specifically those from the domains listed in the rule's criteria. Pay attention to the `TargetFilename` field to identify downloaded file types.

  - **Check file extension and content**: Validate whether the downloaded files match the flagged extensions (e.g., `.bat:Zone`, `.cmd:Zone`, `.ps1:Zone`). Only files with these extensions warrant escalated scrutiny.

  - **Identify legitimate activity**: Compare the download timestamps against known legitimate business operations. Downloads from trusted internal systems or approved usage of these domains may not be malicious.

  - **Investigate related alerts**: Correlate findings with related Sigma rules or alerts, such as those detecting unusual network traffic leading to similar file-sharing domains. This helps in assessing the broader context of the activity.

  - **Determine the user context**: Identify the account that initiated the download by reviewing the `User` field. Assess whether the user has a legitimate reason to access the content from these file-sharing sites.

  - **Check for executed files**: Investigate if the downloaded files were executed using Security Event ID 4688 or Sysmon Event ID 1. Track any process creation that references these files to confirm malicious activity.

  ### Prioritization

  This alert indicates medium severity since the affected system's integrity may be compromised if disseminated files are malicious. The likelihood of exploitation is elevated due to the nature of file-sharing domains being common vectors for attackers. Such behavior is often exhibited in initial stages of cyber intrusions.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as attackers using encrypted or obfuscated file transfers to bypass monitoring. Reliable detections depend on comprehensive logging configurations, including proper monitoring of file stream hashes. Benign activities could include legitimate software updates or development processes that use similar domain resources. For enhanced coverage, companion detections related to lateral movement or command execution should be in place.

