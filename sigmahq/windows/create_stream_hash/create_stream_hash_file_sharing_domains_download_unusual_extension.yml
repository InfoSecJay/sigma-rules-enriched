note: |
  ### Technical Context

  This Sigma rule detects unusual file downloads from file sharing websites, specifically targeting file types associated with potential scripting attacks, such as `.bat`, `.cmd`, and `.ps1`. Attackers may use these well-known sites to distribute malicious payloads, manipulate user systems, or facilitate lateral movement within the network. The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and **Credential Access** (TA0011), with techniques such as **Indicator Removal on Host** (T1564.004) and **External Remote Services** (T1133).

  The primary telemetry source is Windows Security Event ID 90015, which logs file creation and hash calculations that indicate downloads. If executed successfully, these downloads could introduce malicious code, leading to compromise or further exploitation of the system. However, this detection does NOT confirm that the downloaded file was executed or that any compromise has actually occurred.

  ### Investigation Steps

  - **Review event logs for unusual file downloads:** Check Windows Security Event ID 90015 for file downloads from domains listed in the Sigma rule. Look for patterns indicating repeated downloads or personal accounts associated with this activity.

  - **Identify file types of interest:** Focus on downloaded files with extensions containing `.bat:Zone`, `.cmd:Zone`, or `.ps1:Zone`. Cross-reference these against known malicious signatures or hash databases.

  - **Investigate the timing of downloads:** Assess if the downloads occurred during unusual hours or were triggered by processes that are atypical for standard users, such as automated scripts or background tasks.

  - **Determine legitimate user behavior:** Find expected file download activity for users, e.g., registered employees downloading from internal resources or well-known sources in specific projects. Compare against this baseline.

  - **Check for suspicious network activity:** Review firewall logs for outbound traffic to the detected domains, looking for unusual spikes in usage or connections from internal hosts not typically associated with file downloading activities.

  - **Collect additional context on the assets:** For high-value targets or critical systems, utilize endpoint detection and response (EDR) solutions to analyze processes running post-download, as malicious scripts may be executed afterwards.

  ### Prioritization

  This alert should be considered medium priority as it targets potentially malicious file types from reputable sources. The risk is heightened if the affected system is critical within the network or used by high-profile targets in the organization, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection has limitations, as legitimate behaviors such as automated tasks or administrative scripts may trigger this alert. Required log sources are dependent on appropriate configurations for Event ID 90015, which may not be enabled by default in all environments. Related detections, such as alerts for process creation from suspicious downloads, can strengthen overall monitoring and response capabilities.

