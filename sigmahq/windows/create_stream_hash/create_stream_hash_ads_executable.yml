title: Hidden Executable In NTFS Alternate Data Stream
id: b69888d4-380c-45ce-9cf9-d9ce46e67821
status: test
description: Detects the creation of an ADS (Alternate Data Stream) that 
  contains an executable by looking at a non-empty Imphash
references:
- https://twitter.com/0xrawsec/status/1002478725605273600?s=21
author: Florian Roth (Nextron Systems), @0xrawsec
date: 2018-06-03
modified: 2023-02-10
tags:
- attack.stealth
- attack.s0139
- attack.t1564.004
logsource:
  product: windows
  category: create_stream_hash
  definition: 'Requirements: Sysmon or equivalent configured with Imphash logging'
detection:
  selection:
    Hash|contains: 'IMPHASH='
  filter_main_null:
    Hash|contains: 'IMPHASH=00000000000000000000000000000000'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule isn't looking for any particular binary characteristics. As 
  legitimate installers and programs were seen embedding hidden binaries in 
  their ADS. Some false positives are expected from browser processes and 
  similar.
level: medium
regression_tests_path: 
  regression_data/rules/windows/create_stream_hash/create_stream_hash_ads_executable/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of an Alternate Data Stream (ADS) on NTFS file systems that contains an executable, indicated by a non-empty Imphash. The likely attacker objective is to hide malicious payloads from view, leveraging Windows file system features to evade detection while executing code. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" and the technique "T1564.004: Alternate Data Streams." Primary telemetry sources include Sysmon-generated logs that capture events related to file creation, specifically focusing on Event ID 21 (FileCreate) with fields for the Imphash. If malicious, the security impact includes unauthorized execution of code and potential system compromise. This detection does NOT confirm malicious intent on its own, as legitimate applications may also use ADS for benign purposes.

  ### Investigation Steps

  - **Review Sysmon Event ID 21 logs**: Check for recent file creations that show non-empty Imphash values. Focus on streams with the format `<filename>:<streamName>`, particularly under directories with sensitive or executable files.

  - **Verify Imphash values**: Identify any entries with non-empty Imphash fields. Compare those hashes against known malware repositories to confirm potential malicious activity.

  - **Assess file context**: Determine the parent process of the executable in the ADS recorded by the `ParentImage` field in Sysmon Event ID 21. Legitimate installers may be seen using ADS for temporary files during installation processes.

  - **Examine recent file access behavior**: Look for unusual access patterns, indicated by Event ID 4663 (Access Attempt). A high frequency of access to ADS from unexpected applications could signify malicious activity.

  - **Identify potential legitimate ADS usage**: Note patterns from legitimate software, such as installers for common applications that may embed executables in ADS. This helps distinguish benign ADS usage from malicious attempts.

  - **Validate system role**: Assess the affected host’s role (e.g., domain controller, file server) and criticality. A new executable in ADS on servers handling sensitive data warrants a high-priority investigation.

  ### Prioritization

  This alert is of medium severity in an enterprise context. The presence of hidden executables in ADS can indicate potentially serious threats, especially if found on critical systems. However, given that legitimate processes may also use ADS, the likelihood of abuse will vary based on context and user behavior.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers using encrypted ADS or masking techniques. The reliability of detection depends on proper configuration of Sysmon to ensure comprehensive logging of Imphash data. Legitimate activities, such as software installations or certain web browser operations, may inadvertently trigger this alert. A companion detection rule monitoring unusual process creation (e.g., detect unusual executable parents) could enhance coverage of this threat landscape.

