- attack.t1564.004
logsource:
  product: windows
  category: create_stream_hash
  definition: 'Requirements: Sysmon or equivalent configured with Imphash logging'
detection:
  selection:
    Hash|contains: 'IMPHASH='
  filter_main_null:
    Hash|contains: 'IMPHASH=00000000000000000000000000000000'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule isn't looking for any particular binary characteristics. As 
  legitimate installers and programs were seen embedding hidden binaries in 
  their ADS. Some false positives are expected from browser processes and 
  similar.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of an Alternate Data Stream (ADS) in NTFS that contains an executable file, indicated by a non-empty Imphash value. The likely attacker objective is to conceal malicious payloads or tools within the filesystem, leveraging ADS to evade detection by standard file scanning tools. This activity fits within the MITRE ATT&CK framework under the tactic 'Defense Evasion' (ID: TA0005) and the technique 'Hidden Files or Directories' (ID: T1564.004). The primary telemetry source is Windows systems logging through Sysmon or a similar solution configured to capture ADS and Imphash information. If malicious, the presence of a hidden executable could indicate a compromise aimed at persistence or lateral movement. Notably, this detection does not confirm whether the executable is actively malicious; it merely highlights that a hidden executable has been introduced.

  ### Investigation Steps

  - **Review Sysmon logs for ADS creation events:** Check for Sysmon Event ID 21, which captures creation of streams, focusing on fields such as "ObjectType" and "FileName" to determine if a hidden executable was created.

  - **Validate the Imphash value:** Identify any entries with "Imphash" that are non-empty and not equal to '00000000000000000000000000000000'. Match against known hash databases to evaluate the nature of the executable.

  - **Analyze parent process data:** For the detected ADS creation (Event ID 21), review the "ProcessId" and "ParentProcessId" fields to assess if the event originated from high-risk or unexpected applications, such as PowerShell or cmd.exe.

  - **Identify benign cases:** Investigate typical scenarios where legitimate software installations or browser processes might create ADS. Note the installer paths and create streams with known benign Imphash values, to distinguish them from potential malicious activity.

  - **Correlate with file execution attempts:** If applicable, verify for execution logs (e.g., Event ID 4688) indicating that an executable has been run from an ADS. This can signal immediate malicious intent as opposed to merely file presence.

  - **Check for persistence mechanisms:** Review for additional suspicious behavior consistent with a broader attack pattern, such as scheduled tasks that reference the hidden executable or exploration practices through the Windows Registry focusing on stealthy persistence.

  ### Prioritization

  The alert severity is medium. Although the presence of an ADS with an executable can indicate potential malicious use, its lower immediate impact is offset by the likelihood of exploitation. The attack methods leveraging this technique are increasingly common among adversaries seeking to evade defenses.

  ### Blind Spots and Assumptions

  Detection relies on Sysmon or equivalent to be properly configured to log Imphash and ADS events; otherwise, the detection may miss critical activity. Evasion techniques may include the legitimate use of ADS by installers or applications to hide data. Common benign activities such as software installations may trigger false positives. Related detections to strengthen coverage include monitoring for unusual process creation patterns (Sysmon Event ID 1) that may indicate exploitation behavior following ADS usage.

