title: Hidden Executable In NTFS Alternate Data Stream
id: b69888d4-380c-45ce-9cf9-d9ce46e67821
status: test
description: Detects the creation of an ADS (Alternate Data Stream) that 
  contains an executable by looking at a non-empty Imphash
references:
- https://twitter.com/0xrawsec/status/1002478725605273600?s=21
author: Florian Roth (Nextron Systems), @0xrawsec
date: 2018-06-03
modified: 2023-02-10
tags:
- attack.stealth
- attack.s0139
- attack.t1564.004
logsource:
  product: windows
  category: create_stream_hash
  definition: 'Requirements: Sysmon or equivalent configured with Imphash logging'
detection:
  selection:
    Hash|contains: 'IMPHASH='
  filter_main_null:
    Hash|contains: 'IMPHASH=00000000000000000000000000000000'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule isn't looking for any particular binary characteristics. As 
  legitimate installers and programs were seen embedding hidden binaries in 
  their ADS. Some false positives are expected from browser processes and 
  similar.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of an Alternate Data Stream (ADS) containing an executable identified by a non-empty Imphash. Attackers can leverage ADS to hide malicious payloads and evade detection by placing executables within streams that are not commonly monitored. The likely objective is stealthy deployment of malware or persistence mechanisms without alerting security teams. This behavior corresponds to the MITRE ATT&CK techniques: Stealthy Execution (T1564.004) and Hidden Executable (S0139).

  The primary telemetry source is Sysmon logs configured to collect stream hash data. Specifically, the required log type is the creation event of streams which includes the Imphash field. The potential security impact is high, as the presence of hidden executables can indicate a compromised system or ongoing cyber threat. However, this detection does NOT confirm malicious activity on its own, as legitimate applications may use ADS for benign purposes.

  ### Investigation Steps

  - **Check the Sysmon Event for Stream Creation:** Review Sysmon Event ID 21 for the affected host, focusing on the "Image" and "Hash" fields to analyze the Imphash value; a non-zero Imphash may indicate malicious behavior if it lacks legitimate software context.

  - **Correlate with Parent Process Information:** Investigate the parent process of the stream creation (available in Sysmon Event ID 21) to determine if it originated from a known legitimate source or a potentially malicious process. Malicious applications often originate from non-standard paths.

  - **Analyze File System for ADS Presence:** Use PowerShell or a tool like `Sysinternals Streams` to check for other ADS in conjunction with the detected event; legitimate software may use ADS, but multiple hidden streams on key system binaries may indicate suspicious behavior.

  - **Identify Relevant Processes and Their Behavior:** Validate if the executing process is a known or trusted application (e.g., popular software installers or system processes) to differentiate benign behaviors from possible attacker actions; if the creating process is a limited-use or less-known application, it warrants further scrutiny.

  - **Look for Concurrent Alerts or Anomalies:** Review the Security Information and Event Management (SIEM) system for related alerts that may indicate broader malicious activity, such as lateral movement or data exfiltration attempts, as a hidden executable often signifies deeper compromise.

  ### Prioritization

  This alert has medium severity due to the potential impact of malware execution on enterprise systems, particularly those critical for operations. While ADS usage is not uncommon, the combination of a non-empty Imphash and creation activity suggests likely malicious intentions, especially if associated with known exploits or anomalous behaviors.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives arising from legitimate software utilizing ADS for benign purposes, such as installers. The necessity of having Sysmon configured correctly with Imphash logging is crucial for accurate detection. Additionally, benign internal activities, such as certain administrative scripts or software installations with embedded scripts, may trigger this alert. Complementary detections include monitoring for unusual parent process behaviors that coincide with this ADS activity, which can strengthen overall detection capabilities.

