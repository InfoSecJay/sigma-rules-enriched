title: Hidden Executable In NTFS Alternate Data Stream
id: b69888d4-380c-45ce-9cf9-d9ce46e67821
status: test
description: Detects the creation of an ADS (Alternate Data Stream) that contains
  an executable by looking at a non-empty Imphash
references:
- https://twitter.com/0xrawsec/status/1002478725605273600?s=21
author: Florian Roth (Nextron Systems), @0xrawsec
date: 2018-06-03
modified: 2023-02-10
tags:
- attack.defense-evasion
- attack.s0139
- attack.t1564.004
logsource:
  product: windows
  category: create_stream_hash
  definition: 'Requirements: Sysmon or equivalent configured with Imphash logging'
detection:
  selection:
    Hash|contains: 'IMPHASH='
  filter_main_null:
    Hash|contains: 'IMPHASH=00000000000000000000000000000000'
  condition: selection and not 1 of filter_main_*
falsepositives:
- This rule isn't looking for any particular binary characteristics. As legitimate
  installers and programs were seen embedding hidden binaries in their ADS. Some false
  positives are expected from browser processes and similar.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of an Alternate Data Stream (ADS) in NTFS that contains an executable file, specifically by monitoring for non-empty Imphash values. Attackers may leverage ADS as a means of obfuscating malicious payloads, allowing them to evade standard detection mechanisms. The hidden executables reside within these streams, which are often overlooked by traditional file system browsing, thereby aiding in persistence or lateral movement within a compromised environment.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (TA0005), specifically **Alternate Data Streams** (T1564.004) and the use of **Executable Content in ADS** as a method to hide malicious activities (S0139). Threat actors may target Windows environments where they utilize ADS to store payloads or trojans covertly, complicating cleanup efforts and remediation strategies. The principal telemetry required to detect these events includes logs from Windows Sysmon, configured to capture Imphash values in created stream events.

  ### Investigation Steps
  - **Review Sysmon Logs**: Investigate Sysmon logs for entries related to `create_stream_hash` where the Imphash is present and not equal to zero. Look for newly created streams that may have been generated by known processes or during unusual times.
  - **Check for Related Artifact Activity**: Analyze the context of the processes that created the ADS. Look for patterns of execution or creation, as legitimate sources may have specific behavior, while suspicious activity often shows anomalous usage patterns.
  - **Correlate with File System Changes**: Examine file system activity logs to correlate the creation and modification of files, particularly focusing on files that too have been modified without visible execution, signifying possible attempts to conceal a payload via ADS.
  - **Assess Behavioral Patterns**: Identify any unusual execution patterns from processes that commonly utilize ADS functionalities, particularly applications known for significant file handling, such as browsers and installers.

  ### Prioritization
  The alert's medium severity is due to the potential threat posed by hidden executables within NTFS, which can signify compromised environments and allow for persistent malware. However, the likelihood of a legitimate reason for ADS creation in regular operations can lead to expected false positives, necessitating careful investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage lies within environments that do not utilize Sysmon or similar logging tools capable of Imphash logging, which are critical for this rule to function effectively. Additionally, the detection logic assumes that any created stream will not have an Imphash value of all zeros, which may not always be applicable for different executable attributes. As the rule isn’t focused on specific binary characteristics, entities should expect some degree of false positives, especially from benign applications that utilize ADS for legitimate purposes. Proper configuration of logging mechanisms is essential to ensure the effectiveness of this detection.

