note: |
  ### Technical Context

  This Sigma rule detects file downloads from various file sharing and pastebin websites, specifically targeting executable and potentially harmful file types. The likely attacker objective is to deliver malicious payloads or scripts, often used in conjunction with social engineering tactics. This behavior fits within the MITRE ATT&CK framework as "Execution" (TA0002), particularly under the techniques for "User Execution" (T1203) and "Malicious File" (T1203).

  Primary telemetry sources include Windows Security Event IDs related to stream creation, especially Event ID 90015 from the Sysmon logs for file creation and stream hashes. If malicious, this behavior could lead to system compromise or unauthorized data access. It is important to note that this detection does NOT confirm malicious intent on its own, as benign users may legitimately download files from these domains.

  ### Investigation Steps

  - **Check Event ID 90015 in Sysmon logs:** Review Sysmon logs for Event ID 90015, correlating downloads from domains like `pastebin.com` or `mediafire.com` to specific user activities that align with known safe behaviors.

  - **Identify the target file extension:** Look for downloaded files with suspicious extensions (e.g., `.exe`, `.vbs`, `.dll`). These files are usually red flags compared to typical document file types like `.pdf` or `.docx`.

  - **Trace user actions and context:** Examine the user account that executed the download. Verify if the user has a legitimate business reason for accessing these file sharing sites. This may involve reviewing user activity logs or interviewing the user.

  - **Monitor for URLs used in the download:** Review network logs (e.g., proxy logs) for the specific URLs accessed. For alerts based on high-risk URLs, ensure they show no clear indication of legitimate use cases.

  - **Validate the presence of related artifacts:** Search for creation timestamps and content hashes (MD5/SHA-256) of the downloaded files. Cross-check these against known malware databases to confirm if the file has been flagged as malicious.

  - **Assess impact on critical assets:** If the alert pertains to high-value systems or sensitive data repositories, elevate its urgency based on potential impacts to business operations and data integrity.

  ### Prioritization

  This alert is of high severity due to the possibility of executing malware on organizational assets, especially if it involves critical systems. The likelihood of malicious use is elevated, given that the behavior typically signals the prelude to system compromise. The use of these specific domains is also common in recent attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by users maintaining legitimate activities that could generate false positives, such as developers downloading tools or updates from GitHub. The rule requires robust Sysmon configuration and continuous logging of file stream events to ensure reliable detection. A related rule to monitor is suspicious PowerShell executions (noted in T1086), as attackers often combine these tactics for more effective exploits.

