note: |
  ### Technical Context

  This Sigma rule detects suspicious file downloads from various known file and paste sharing domains targeting file types commonly associated with malicious activity, such as executables, scripts, and device drivers. The likely attacker objective is to deliver malware or other malicious payloads through seemingly innocuous means, circumventing traditional defenses by using file sharing services that are often overlooked. This behavior aligns with the MITRE ATT&CK technique for “Malicious File Execution” (T1564.004) and “External Remote Services” (S0139).

  The primary telemetry source for this detection is Windows System event logs, specifically the log type created by Event ID 90015, which correlates with the creation of stream hashes from downloaded files. The security impact is significant; if malicious, it may lead to system compromise through malware execution. Importantly, this detection does NOT confirm malicious activity on its own; further context around user behavior and network activity is needed to fully assess risk.

  ### Investigation Steps

  - **Check for event presence:** Review Windows Security Event ID 90015 for unusual file download activity from the specified domains. Look specifically for TargetFileName fields containing suspicious extensions (e.g., '.exe:Zone', '.vbs:Zone') to identify potentially harmful downloads.

  - **Assess user context:** Analyze the user involved in the download. Legitimate internal users may download certain scripts or tools from benign sources like GitHub, but the download of executable files from the listed domains under suspicious contexts raises concern.

  - **Inspect the file details:** Validate the file metadata for hashes and signatures using VirusTotal or similar tools. A high-confidence malicious indicator is if the file's hash matches known malware signatures, particularly with file types like '.exe' or '.vbe'.

  - **Correlate additional telemetry:** Investigate related logs, such as Proxy logs indicating outbound traffic to the suspected file-sharing domains. Check for patterns like repeated downloads or access from unusual IP addresses, highlighting potentially malicious behavior.

  - **Monitor for lateral movement:** Following detection, examine logs for subsequent execution events (Event ID 4688 or Sysmon Event ID 1) for the downloaded file. Lateral movement within the network following the download can indicate that a malicious payload has been executed.

  ### Prioritization

  This alert is considered high severity given that it targets critical systems that could be compromised via file downloads. The potential impact of executing malicious files is significant, and the use of file-sharing domains indicates tactics commonly employed by adversaries to distribute malware. Such behaviors have been historically weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics, such as adversaries using encrypted channels or less common file-sharing services to bypass monitoring. Reliable detection relies on having the necessary logging configurations for Event ID 90015 and associated file activities. Legitimate activities such as automated build processes or development workflows might trigger the alert when accessing GitHub for updates. A related detection for enhanced coverage is tracking outbound file downloads to identify potential command and control (C2) communications that follow suspicious downloads.

