title: Creation Of a Suspicious ADS File Outside a Browser Download
id: 573df571-a223-43bc-846e-3f98da481eca
status: test
description: Detects the creation of a suspicious ADS (Alternate Data Stream) file
  by software other than browsers
references:
- https://www.bleepingcomputer.com/news/security/exploited-windows-zero-day-lets-javascript-files-bypass-security-warnings/
author: frack113
date: 2022-10-22
modified: 2023-06-12
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains:
    - '.exe'
    - '.scr'
    - '.bat'
    - '.cmd'
    - '.docx'
    - '.hta'
    - '.jse'
    - '.lnk'
    - '.pptx'
    - '.ps'
    - '.reg'
    - '.sct'
    - '.vb'
    - '.wsc'
    - '.wsf'
    - '.xlsx'
  filter_optional_brave:
    Image|endswith: '\brave.exe'
  filter_optional_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_opera:
    Image|endswith: '\opera.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|endswith: '\whale.exe'
  filter_optional_snipping_tool:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.ScreenSketch_'
    Image|endswith: '\SnippingTool\SnippingTool.exe'
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Packages\Microsoft.ScreenSketch_'
    - '\TempState\Screenshot '
    TargetFilename|endswith: '.png:Zone.Identifier'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Other legitimate browsers not currently included in the filter (please add them)
- Legitimate downloads via scripting or command-line tools (Investigate to determine
  if it's legitimate)
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of a suspicious Alternate Data Stream (ADS) file outside of traditional browser download behavior. Specifically, it flags instances where executable or potentially malicious file types (like `.exe`, `.bat`, `.docx`, etc.) are linked to an ADS labeled with `[ZoneTransfer] ZoneId=3`, indicating that the file is coming from a potentially unsafe source, as determined by Windows security features. Attackers may exploit this technique to bypass security controls and execute malicious code on the system without raising immediate alarms.

  A common threat scenario involves adversaries using non-browser applications to download or handle files that can contain malware, thereby evading detection commonly associated with standard browser activity. The likely objectives include establishing persistence, executing payloads, or exfiltrating data. This activity is typically tied to MITRE ATT&CK techniques such as **T1203: Exploitation for Client Execution** and **T1083: File and Directory Discovery**, as attackers attempt to create an environment conducive to reconnaissance or lateral movement.

  The primary data sources for this detection are process creation events (which can show the creation of ADS files), file system logs (to track the creation and modification of important file types), and Windows event logs specifically related to Alternate Data Streams.

  ### Investigation Steps
  - **Review File System Activity**: Examine the file system logs for details regarding the creation of the flagged ADS files, including their location and associated process.
  - **Analyze Process Tree**: Investigate the process tree originating from the detected event to identify any suspicious parent processes or related executions that could be indicative of malicious activity.
  - **Cross-reference Downloads**: Check historical download logs or any relevant network activity to corroborate whether the flagged file originated from a legitimate source or if it is anomalous.
  - **Employ Threat Intelligence**: Utilize threat intelligence databases to assess the flagged file types and their associated risk levels or known associations with malware, enhancing context for deeper investigation.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of malicious code execution through undocumented downloads. While ADS files are legitimate in some contexts, their use for evasive techniques poses a considerable risk, making timely investigation essential.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include legitimate browsers or applications not currently included in the filter, which may create ADS files without triggering this alert. The detection logic assumes that non-browser applications are attempting to create ADS files for malicious reasons. To ensure the alert functions correctly, logs related to process creations, file system changes, and specific Windows event logs for ADS tracking must be enabled and collecting data.

