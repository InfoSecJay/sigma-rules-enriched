title: Creation Of a Suspicious ADS File Outside a Browser Download
id: 573df571-a223-43bc-846e-3f98da481eca
status: test
description: Detects the creation of a suspicious ADS (Alternate Data Stream) 
  file by software other than browsers
references:
- https://www.bleepingcomputer.com/news/security/exploited-windows-zero-day-lets-javascript-files-bypass-security-warnings/
author: frack113
date: 2022-10-22
modified: 2023-06-12
tags:
- attack.stealth
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains:
    - '.exe'
    - '.scr'
    - '.bat'
    - '.cmd'
    - '.docx'
    - '.hta'
    - '.jse'
    - '.lnk'
    - '.pptx'
    - '.ps'
    - '.reg'
    - '.sct'
    - '.vb'
    - '.wsc'
    - '.wsf'
    - '.xlsx'
  filter_optional_brave:
    Image|endswith: '\brave.exe'
  filter_optional_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_opera:
    Image|endswith: '\opera.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|endswith: '\whale.exe'
  filter_optional_snipping_tool:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.ScreenSketch_'
    Image|endswith: '\SnippingTool\SnippingTool.exe'
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Packages\Microsoft.ScreenSketch_'
    - '\TempState\Screenshot '
    TargetFilename|endswith: '.png:Zone.Identifier'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Other legitimate browsers not currently included in the filter (please add 
  them)
- Legitimate downloads via scripting or command-line tools (Investigate to 
  determine if it's legitimate)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a Suspicious Alternate Data Stream (ADS) file by applications other than standard web browsers, specifically targeting executables and script files that may be leveraged for malicious activity. The likely objective is to conceal malware or payloads without raising immediate suspicion, taking advantage of Windows' file system capabilities. This behavior aligns with the MITRE ATT&CK technique, T1564.002: Alternate Data Streams, under the tactic of Defense Evasion.

  The primary telemetry source is Windows file creation log events, specifically Monitor Data Streams from Sysmon or Windows Security Events. If successful, this activity could allow an attacker to hide malicious files from standard detection methods. It is important to note that the detection of this behavior does NOT confirm that an attack has occurred; it only highlights the potential use of ADS in a risky manner, necessitating further investigation to understand intent.

  ### Investigation Steps

  - **Identify the process creating the ADS file**: Review Sysmon Event ID 11 (CreateFile) logs and correlate them with the identified TargetFilename. Look specifically for files with the 'Zone.Identifier' suffix created by non-standard processes (e.g., not from browsers like Chrome, Firefox, etc.).

  - **Validate file attributes and contents**: Inspect the file properties and stream contents using PowerShell or Sysinternals tools (e.g., `stream.exe`) to identify if the ADS includes suspicious entries or payloads. Legitimate files typically will not have suspicious entries.

  - **Examine recent file downloads**: Check for recent downloads or file creations in user-specific directories, such as `C:\Users\<username>\Downloads\`. Look for patterns indicating script files or executables that could lead to ADS creation, corroborating with Event ID 4663 (Access to an object).

  - **Check process lineage**: Use process tree analysis tools to trace the origin of the initiating process that created the ADS. Confirm if it traces back to known benign installations or if it seems out of place, indicating potential compromise.

  - **Review for localization of similar artifacts**: Look for other ADS created in the same timeframe or section of the file system, primarily focusing on sensitive or critical areas such as application data or system folders. Multiple instances may indicate a broader attack.

  - **Determine user activity legitimacy**: Interview the user or analyze user behavior logging (e.g., internal ticketing or communications) to establish whether the activity aligns with business processes. Since some users may legitimately download software, this step is critical to avoid misclassification of benign actions as malicious.

  ### Prioritization

  The alert severity is medium due to the potential for malicious exploitation through hidden payloads, especially when the affected system is critical or part of a broader network structure. The likelihood of adversaries using ADS for stealthy malware deployment is significant, as this technique is well-documented in advanced persistent threat scenarios.

  ### Blind Spots and Assumptions

  Detection may face limitations due to the absence of specific logging configurations for detecting ADS, as some browsers and tools might not trigger ADS creation events. Legitimate activities such as scripting downloads may also trigger this alert, potentially leading to false positives. A companion detection rule focused on monitoring initial process execution or download activities (T1203: Exploitation for Client Execution) can enhance coverage by correlating external threat vectors leading to suspicious ADS creation.

