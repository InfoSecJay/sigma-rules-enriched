title: Creation Of a Suspicious ADS File Outside a Browser Download
id: 573df571-a223-43bc-846e-3f98da481eca
status: test
description: Detects the creation of a suspicious ADS (Alternate Data Stream) 
  file by software other than browsers
references:
- https://www.bleepingcomputer.com/news/security/exploited-windows-zero-day-lets-javascript-files-bypass-security-warnings/
author: frack113
date: 2022-10-22
modified: 2023-06-12
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains:
    - '.exe'
    - '.scr'
    - '.bat'
    - '.cmd'
    - '.docx'
    - '.hta'
    - '.jse'
    - '.lnk'
    - '.pptx'
    - '.ps'
    - '.reg'
    - '.sct'
    - '.vb'
    - '.wsc'
    - '.wsf'
    - '.xlsx'
  filter_optional_brave:
    Image|endswith: '\brave.exe'
  filter_optional_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_optional_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_optional_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_opera:
    Image|endswith: '\opera.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|endswith: '\whale.exe'
  filter_optional_snipping_tool:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.ScreenSketch_'
    Image|endswith: '\SnippingTool\SnippingTool.exe'
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Packages\Microsoft.ScreenSketch_'
    - '\TempState\Screenshot '
    TargetFilename|endswith: '.png:Zone.Identifier'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Other legitimate browsers not currently included in the filter (please add 
  them)
- Legitimate downloads via scripting or command-line tools (Investigate to 
  determine if it's legitimate)
level: medium
note: |
  ### Technical Context

  This rule detects the creation of suspicious Alternate Data Stream (ADS) files by applications other than web browsers. ADS files are often used to evade detection and conceal malicious payloads. The likely objective of an attacker leveraging this technique is to stealthily store malicious content that may be executed later without raising security warnings. This detection is aligned with the MITRE ATT&CK framework under the tactic of Defense Evasion (T1564) and the technique of Alternate Data Streams (T1564.001).

  Primary telemetry sources include Windows Security Event ID 4663 ("An attempt was made to access an object") and specific log data from the NTFS file system that captures ADS writes. If malicious, the security impact can be significant, allowing an attacker to run hidden scripts or executables. Importantly, this detection does NOT independently confirm malicious activity unless investigated further.

  ### Investigation Steps

  - **Check Event IDs for suspicious behavior**: Review Windows Security Event ID 4663 logs for write attempts to suspicious filenames containing `:Zone.Identifier`. Assess the `ObjectType` field for legitimate processes versus unauthorized software.

  - **Identify file creation details**: Investigate the creation of ADS using File System or EDR logs, specifically targeting logs that show access to `.exe`, `.scr`, and other potentially dangerous file types with `:Zone.Identifier` appended.

  - **Evaluate source application context**: Verify the process (`InvokePID`) that created the ADS. If it is not a known web browser application (e.g., Chrome, Firefox, Edge), further investigation is warranted to evaluate the legitimacy of the creating process.

  - **Look for legitimate activities**: Identify known processes and behavior patterns for legitimate ADS usage, such as security scanning tools that may create these streams temporarily during their operation.

  - **Correlate with known malicious indicators**: Cross-reference the creation of specific ADS with threat intelligence feeds for any known malicious software linked to the filenames and file types mentioned.

  - **Assess asset criticality**: Determine the impact of the affected system, especially if the file is created on critical assets like servers or endpoints with sensitive data. Malicious ADS found on these systems demands immediate escalation.

  ### Prioritization

  This alert should be considered of medium severity due to its potential to indicate persistence mechanisms used by attackers on critical assets. The likelihood of malicious abuse is significant, especially as this technique is often weaponized in targeted attacks aimed at circumventing security measures.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of legitimate processes to create ADS files, which can complicate the detection of malicious activities. Reliable detection requires configuration of log sources such as Windows Security logs, particularly for events logging ADS interactions. Legitimate activity that could trigger this alert includes scripting tools used for automation or administration tasks. A related detection may involve monitoring for the execution of scripts or commands that lead to ADS creation, enhancing coverage against misuse of this technique.

