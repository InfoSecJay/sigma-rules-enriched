title: Potential Suspicious Winget Package Installation
id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
status: test
description: Detects potential suspicious winget package installation from a 
  suspicious source.
references:
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.persistence
- attack.stealth
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    Contents|contains:
            # Note: Add any untrusted sources that are custom to your env
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains: '\AppData\Local\Temp\WinGet\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the installation of packages using Windows Package Manager (winget) from potentially malicious sources identified through the presence of specific URLs and zone transfer indicators in the Zone Identifier file. The likely attacker objective is to establish persistence or execute malicious payloads on a target system using a commonly trusted tool, thereby bypassing traditional security measures. Relevant MITRE ATT&CK tactic includes "Persistence" (TA0002) and the specific technique is "Windows Package Manager" (T1610).

  Telemetry sources include Windows Event Logs (particularly those tied to file creation and modification) and Zone.Identifier files, specifically looking for `ZoneId=3` entries that indicate downloaded files from the internet. If malicious, this behavior could lead to unauthorized software installation or execution with potentially harmful consequences. This detection alone does NOT confirm whether the installed package is malicious without further context and investigation.

  ### Investigation Steps

  - **Review event logs for suspicious installations:** Check Windows Security Event ID 4688 for process creation events associated with winget and verify user accounts invoking these commands. Focus on command line arguments for any unusual behavior.

  - **Examine Zone.Identifier files:** Look for files located in `C:\Users\<username>\AppData\Local\Temp\WinGet\` with a `Zone.Identifier` indicating `ZoneId=3`. This signifies files downloaded from an untrusted source and warrants close scrutiny.

  - **Identify package sources:** Analyze the URLs included in the package installation commands or relevant telemetry fields. Legitimate sources typically do not include suspicious domains or IP addresses (e.g., anything with `://1`, `://2`, etc.).

  - **Correlate with system roles:** Determine if the affected system plays a critical role within your environment (e.g., domain controllers, file servers) and if winget usage is expected for that role, or if this behavior is anomalous.

  - **Document user context:** Identify the user account involved in the installation. Authentic user behavior often includes the installation of packages from Microsoft or trusted repositories, while unknown users or service accounts performing these actions could indicate compromise.

  ### Prioritization

  This alert carries high severity due to the potential impact of installing unverified software, especially on critical systems. The likelihood of malicious abuse is significant given the common use of winget in enterprise environments to facilitate software management. This behavior can be weaponized for persistence and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of proper logging for all winget actions or potential evasion techniques such as adversaries disguising harmful packages with trusted names. Ensure that Zone.Identifier files are not excluded in log configurations for reliable detection. Legitimate activities may trigger this alert when benign packages from unknown but non-malicious external sources are installed. To strengthen coverage, consider companion detections for PowerShell scripts invoking winget or use of other package managers.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
