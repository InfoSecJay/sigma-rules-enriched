title: Potential Suspicious Winget Package Installation
id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
status: test
description: Detects potential suspicious winget package installation from a suspicious
  source.
references:
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.defense-evasion
- attack.persistence
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    Contents|contains:
            # Note: Add any untrusted sources that are custom to your env
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains: '\AppData\Local\Temp\WinGet\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious installations of software packages using the Windows Package Manager (winget) from untrusted sources. Winget is a command-line tool intended to simplify the installation and management of Windows software. However, threat actors may leverage this utility to install malicious software or toolkits that can lead to further compromise of the system or network. By monitoring for specific indicators, such as installations from known untrusted sources, this rule can help guard against unwanted software and potential breaches.

  The likely attacker objective here may include gaining persistence on a target system or enabling various types of hostile activity (e.g., deploying malware, backdoors, or reconnaissance tools). The techniques applied from the MITRE ATT&CK framework include **Defense Evasion (T1203)**, as the misuse of trusted tools provides a mechanism for attackers to evade detection, and **Persistence (T1543)**, since malicious software installed through winget can maintain a foothold in the environment.

  Primary data sources relevant to this detection include Windows event logs related to process creation (especially tracking installations and component modifications) and details surrounding file modifications within the `AppData\Local\Temp` directory.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Review process creation events to identify any suspicious winget commands executed, particularly focusing on the associated parent processes and the execution context.

  - **Examine Zone.Identifier Files:** Check for the presence of `Zone.Identifier` files in the `\AppData\Local\Temp\WinGet\` directory to confirm if downloads originated from untrusted sources, potentially indicating external malicious origins.

  - **Query Network Activity:** Investigate outbound network traffic for connections to the domains or IP addresses specified in the suspected sources (i.e., those indicated as ‘://1’ through ‘://9’) to determine if the system is communicating with known malicious actors.

  - **Review Security Software Logs:** Analyze logs from Anti-Virus or Endpoint Detection and Response (EDR) solutions for any alerts related to the installed packages to ascertain if any security products flagged the actions as concerning.

  ### Prioritization
  This alert is classified as high-severity due to the potential impact of unauthorized software installations, which can lead to further exploitation of network resources or sensitive data. The likelihood of such an event occurring in an enterprise environment, coupled with the risks involved if a successful attack takes place, necessitates prompt investigation and response.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage based on the assumption that all suspicious winget source URLs have been predefined; new untrusted domains or sources might not be captured in the rule. Additionally, this detection logic assumes that logging for process creation events and changes to the `AppData` directory is properly configured and enabled. If these logs are absent or configured incorrectly, detection will be compromised. Ensuring comprehensive logging and maintaining an updated list of untrusted sources is critical for effective monitoring.

