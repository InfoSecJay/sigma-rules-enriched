title: Potential Suspicious Winget Package Installation
id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
status: test
description: Detects potential suspicious winget package installation from a 
  suspicious source.
references:
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.defense-evasion
- attack.persistence
logsource:
  product: windows
  category: create_stream_hash
detection:
  selection:
    Contents|startswith: '[ZoneTransfer]  ZoneId=3'
    Contents|contains:
            # Note: Add any untrusted sources that are custom to your env
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
    TargetFilename|endswith: ':Zone.Identifier'
    TargetFilename|contains: '\AppData\Local\Temp\WinGet\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potentially suspicious installations of software via WinGet, where the installation source is flagged as untrusted. The attacker likely aims to gain persistence or evade detection by using trusted package managers to install malicious software, a tactic that can blend in with legitimate software management activities. This behavior is associated with MITRE ATT&CK technique T1073 (Application Layer Protocol) and T1203 (Exploitation for Client Execution). The primary telemetry source requires Windows event logs related to file operations, specifically monitoring for logs indicating changes to `Zone.Identifier` files in the Windows filesystem. If confirmed malicious, this activity poses a significant risk, leading to unauthorized software installations and potential system compromise. This detection does NOT confirm whether the installed package is definitively malicious; further investigation is necessary to substantiate intent.

  ### Investigation Steps

  - **Check event logs for unauthorized installations:** Review Windows Security Event ID 4688 logs for process creation related to WinGet and the target path `\AppData\Local\Temp\WinGet\`, noting any additional command line arguments that may look suspicious or unusual.

  - **Identify source of package installation:** Examine `Zone.Identifier` files for the presence of flagged sources (e.g., those containing `://1`, `://2`, etc.). Legitimate sources should not typically route through these zones; confirm any benign updates from well-known repositories.

  - **Review process parents and ancestry:** Analyze associated log entries for process parentage using Sysmon Event ID 1. Legitimate WinGet installations typically originate from trusted system processes. Determine if a suspicious parent process indicates a malicious workflow.

  - **Look for recent changes in persistency artifacts:** Investigate the registry changes or scheduled tasks that may correlate with software installation referenced by WinGet, focusing on alterations to persistence locations such as `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`.

  - **Correlate with historical data:** Cross-reference affected endpoints with threat intelligence or previous incidences of compromise. Systems that have logged installations from flagged sources should be treated with heightened scrutiny.

  ### Prioritization

  This alert is high severity as it targets potential malicious activity involving software installations via a commonly used package manager, which is often weaponized by adversaries to persist malware. This behavior can lead to significant security breaches on sensitive systems, especially if these installations are unauthorized.

  ### Blind Spots and Assumptions

  Detection is limited to the explicit logging configurations for `Zone.Identifier` modifications, which might be disabled or inadequately collected in some environments. Legitimate administrative actions, such as software updates from trusted vendors, may inadvertently trigger the alert. Additionally, companion detections for monitoring unusual file access patterns or exploit attempts through the application layer should be enabled to enhance overall visibility against such evasion techniques.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
