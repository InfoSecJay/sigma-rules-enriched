note: |
  ### Technical Context

  This Sigma rule detects unusual file downloads originating from direct IP addresses, specifically targeting suspicious file types such as scripts and executables. The behavior is indicative of a potential data exfiltration attempt or delivery of malicious payloads, where an attacker aims to bypass content filters and security controls that typically scrutinize domain-based traffic.

  This behavior aligns with the MITRE ATT&CK tactic "Command and Control" and technique T1564.004 (Download from Direct IP). The primary telemetry source for this detection comes from Windows event logs related to file stream creation, specifically the logs that capture changes related to downloaded files. If the detected activity is indeed malicious, it could result in compromised systems, data breaches, or unauthorized code execution.

  It is crucial to understand that while this detection indicates the download of suspicious files from IP addresses, it does not confirm that these files were executed or that any successful intrusion occurred.

  ### Investigation Steps

  - **Identify the download event:** Review Security Event ID 4663 for file creation activities specifically targeting files with extensions like .ps1, .exe, or .vbs. Check if the `Object Type` is 'File' and contains these obtuse types.

  - **Verify the IP address:** Cross-reference the direct IP address against threat intelligence databases or blocklists to assess its reputation. Captured logs for the download event should include fields for SourceAddress.

  - **Check for execution attempts:** Investigate if the downloaded file, especially if it’s an executable or script, has generated Security Event ID 4688 (Process Creation) indicating it was subsequently run. Look specifically for ParentProcessName and CommandLine parameters indicating a direct execution.

  - **Monitor related activity:** Validate if other unusual activities are occurring from the same host through Sysmon logs (Event ID 1) for network connections, specifically any connections that correspond to the IP address used for the suspicious download.

  - **Assess legitimate context:** Determine if the system performing the download is a server or a client machine, and check for legitimate business processes that may require downloads from direct IPs, particularly if they relate to trusted partners or approved services.

  ### Prioritization

  This alert is considered high-severity due to the potential impact on critical systems if malicious activity is confirmed. Direct downloads of potentially harmful file types from IP addresses are often associated with attack frameworks, making them likely candidates for exploitation. Such patterns are commonly observed in malware distribution campaigns.

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers using DNS tunneling or encrypting communications to disguise traffic. Reliable detection requires exhaustive logging configurations that capture file downloads, particularly from IP addresses, in more detail. Legitimate activities may include software updates or downloads from trusted internal resources that could trigger this alert. Companion detections could involve monitoring for outbound connections to known rogue IP addresses to enhance overall security posture.

