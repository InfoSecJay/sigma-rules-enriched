  ---

  ### Technical Context

  This Sigma rule detects potentially malicious file downloads originating from direct IP addresses, specifically targeting file types commonly associated with scripting or executable content. The likely attacker objective is to deliver malware via these downloads while bypassing usual domain-based detection mechanisms. The relevant MITRE ATT&CK tactic is [Defense Evasion](https://attack.mitre.org/tactics/TA0062) with techniques such as [Malicious File Download from Direct IP](https://attack.mitre.org/techniques/T1564/004). Primary telemetry sources include Windows Sysmon log data (Event ID 21) and file creation metadata.

  If detected, this behavior indicates a high risk of malicious activity, as files like PowerShell scripts (.ps1) or executable files (.exe) can be used to compromise systems. Importantly, this detection does NOT confirm that the file was executed or that it contains malware; it only indicates a suspicious download event.

  ---

  ### Investigation Steps

  - **Check Event Logs:** Review Sysmon Event ID 21 logs for entries where `TargetFilename` contains 'http[s]?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' and assess the downloaded file types (e.g., .ps1, .exe). Compare timestamps to identify unusual activity outside of normal operational hours.

  - **Validate File Integrity:** Cross-reference the `TargetFilename` with known malicious hashes using threat intelligence sources. Analyze any file attributes, such as creation or modification date, using tools like `Get-FileHash` to assess legitimacy.

  - **Monitor Network Activity:** Inspect network logs for outbound connections to IP addresses associated with the download. Specifically, check DNS queries for `A` records or direct HTTP requests that correspond with the detected download. Legitimate traffic should ideally resolve to known safe domains.

  - **Determine Host Role:** Identify if the affected system falls within a sensitive or critical role (e.g., domain controller, database server). Downloads to these roles pose a higher risk and require immediate follow-up investigation.

  - **Review User Activity:** Analyze user account activity associated with the download. Confirm if the user has a valid need for the files in question; legitimate user behavior should demonstrate a known relationship or purpose for downloading these types of files.

  - **Identify Common Evasion Techniques:** Be aware that attackers might employ URL obfuscation or use domain generation algorithms (DGAs) to mask IP addresses. Review whether the access was made using proxy servers or VPNs, which could signify an attempt to evade detection.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on critical systems and its association with tactics commonly leveraged by adversaries to deliver malware. The likelihood of malicious exploitation is significant given the prevalence of similar techniques observed in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by instances of IP address change, the use of encrypted traffic (e.g., HTTPS), or if only sporadic logs are collected. Ensure that Windows event logging, particularly Sysmon with proper configuration, is enabled to capture all relevant activities. Legitimate activities, such as system updates or authorized downloads, could inadvertently trigger this alert. For comprehensive coverage, consider complementary detections for abnormal command-line executions (e.g., PowerShell commands from Event ID 4104) following suspicious downloads.

