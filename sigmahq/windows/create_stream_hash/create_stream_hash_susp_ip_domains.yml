note: |
  ### Technical Context
  This detection rule identifies the download of potentially malicious file types from direct IP addresses, which is often indicative of suspicious activities such as downloading malware or tools commonly used in cyberattacks. Attackers may use direct IP downloads to evade traditional domain-based detection mechanisms and to deliver exploits or payloads in a covert manner. The presence of file types such as PowerShell scripts, batch files, and executables being downloaded directly from IPs can suggest malware distribution or reconnaissance activities.

  The relevant MITRE ATT&CK tactics associated with this rule include **Defense Evasion** (TA0005), as attackers often exploit alternative methods like direct IP connections to avoid detection by security tools focused on more traditional URL patterns. The technique specifically related to this rule is **Application Layer Protocol: IP** (T1564.004), indicating a method where attackers utilize IP to hinder defensive measures.

  The primary data sources effective for this detection include **Windows event logs** that track file creation and stream hashes, as well as **proxy logs** or **network traffic logs** that can detail incoming traffic to endpoints, specifically identifying downloads from IPs rather than domains.

  ### Investigation Steps
  - **Review Download Logs**: Analyze Windows event logs related to file creation to pinpoint instances where files with suspicious extensions were downloaded directly from IP addresses. Cross-reference these events with the actual timestamps when the specified files were accessed.
  - **Inspect Network Traffic**: Examine network monitoring logs for anomalous connections that occurred shortly before the file downloads. Pay attention to any unusual patterns or high-risk protocols used during the connections.
  - **Evaluate Endpoint Behavior**: Investigate the endpoints where the downloads occurred for unusual activity, including unexpected process executions or any modifications to system files that could indicate malware presence.
  - **Cross-Check with Threat Intelligence**: Reference threat intelligence feeds to correlate the IP addresses involved in the downloads with known malicious actors or previous incidents to assess the threat level and gather further context.

  ### Prioritization
  This alert is classified as high severity due to the potential for malicious file downloads that could lead to significant data breaches or system compromises. The likelihood of these threats is heightened as attackers increasingly leverage direct IP addresses to deliver exploits and maintain operational stealth.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if the environment's logging level does not capture all necessary file creation events or if network traffic is insufficiently monitored for direct IP connections. The detection logic assumes that relevant logs for file downloads and creation events are enabled and accurately configured on all relevant endpoints. Additionally, this rule may generate false positives, especially in environments where legitimate software distributions or updates utilize direct IP addresses.

