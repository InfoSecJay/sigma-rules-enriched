note: |
  ### Technical Context

  This Sigma rule detects file downloads from suspicious direct IP addresses, specifically targeting certain executable and script file types that may pose security risks. The likely attacker objective is to execute malicious scripts or payloads on compromised systems, which can lead to unauthorized access or lateral movement within the network. Relevant MITRE ATT&CK tactics include **Command and Control (TA0011)** and **Defense Evasion (T1564.004)**.

  Primary telemetry sources include Windows event logs capturing file stream creation, specifically using Event ID 4663 (Access to an object) and Sysmon Event ID 11 (FileCreateStreamHash). If confirmed malicious, this behavior could lead to data breaches or system compromise. However, this detection does NOT confirm that the downloaded file has been executed or is malicious without further investigation.

  ### Investigation Steps

  - **Examine file download logs:** Look for Sysmon Event ID 11 for the specific process IDs associated with the downloads and confirm the `TargetFilename` field indicates one of the targeted file types (`.ps1:Zone`, `.exe:Zone`, etc.).

  - **Identify the originating process:** Investigate the parent process of the download using Event ID 4688 (Process creation) to determine if the download was initiated by a common benign application (e.g., a web browser) or a potentially malicious process.

  - **Validate IP address reputation:** Cross-reference the detected IP address against threat intelligence databases or services to determine its reputation. Known malicious IPs should raise suspicion while known good IPs should be noted.

  - **Review network traffic patterns:** Utilize network telemetry to identify any unusual outbound connections made from the host after the download, particularly to external IP addresses. Look for unusual flows using tools like network packet capture or firewall logs.

  - **Check for legitimate usage:** Determine if the downloaded file is part of known legitimate software maintenance or updates within the organization's operational procedures (for example, a vendor-released script).

  - **Document emerging indicators:** If malicious activity is confirmed, identify and document any unique indicators such as file hashes and associated network artifacts for future detection efforts.

  ### Prioritization

  This alert is high severity due to the potential for execution of malicious scripts or payloads, which can compromise sensitive data or systems. The likelihood of malicious abuse is significant, especially given the attention on direct IP downloads, which are often bypassing standard protections. This behavior is commonly weaponized in phishing or targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete log coverage, particularly if certain logging configurations are not enabled on endpoint agents. Adversaries might employ IP obscuring techniques using proxies or VPNs that this rule cannot detect. Legitimate activities, such as software updates or IT maintenance tasks, may trigger this alert. Related detections that could strengthen overall defense include monitoring for unusual process creations after downloads or unauthorized outbound connections shortly thereafter.

