  ---

  ### Technical Context

  This rule detects the use of the `<` character in command line executions using `cmd.exe`, which can indicate attempts to read contents from file using redirection. The likely objective behind this behavior is to execute scripts or commands with content redirected from files, often part of an attack to execute malicious payloads or to exfiltrate data. This activity relates to the MITRE ATT&CK technique for Command-Line Interface (T1059.003) within the execution tactic.

  The primary telemetry source for this detection is Windows process creation logs, specifically leveraging Security Event ID 4688 or Sysmon Event ID 1. If malicious, using this technique could lead to unauthorized access or execution of malicious code. Importantly, this detection does NOT confirm malicious intent on its own; it only highlights suspicious command line usage which requires further contextual investigation.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for any instances of `cmd.exe` executing with a command line that contains the `<` character. Look for the specific CommandLine field in the logs.

  - **Identify user context**: Determine the user account associated with the suspicious command. Validate if the account is a known admin or a service account, as unusual usage by non-privileged accounts may indicate malicious intent.

  - **Check the command output source**: Look for the file that the `<` is referencing in the command line. Validate if the file is a known script or input used for legitimate operations, such as system scripts located typically in `C:\Windows\System32\`.

  - **Correlate with known attacks**: Investigate if there are any known malicious hashes or command patterns associated with the behavior detected. Cross-reference against threat intelligence feeds for indicators of compromise (IOCs).

  - **Look for evasion techniques**: Evaluate whether legitimate scheduled tasks or administrative scripts may trigger this alert. Recent changes to scripts or unexpected uses of redirection in maintained scripts could explain benign activity.

  - **Validate network activity**: If applicable, examine if this command execution is related to any outbound network activity or file creation (e.g., Event ID 4663). Assess log files for indications of file transfers that could indicate data exfiltration.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for abuse in an enterprise setting, particularly if the affected system is critical (e.g., domain controller or sensitive databases). Command-line redirection is a common tactic used by adversaries during exploitation and post-exploitation phases.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if auditing of process creation is not enabled consistently across all endpoints. Legitimate usage of scripts or automated processes may trigger this alert, necessitating the need for contextual awareness of standard operational behaviors. A related detection that strengthens coverage is monitoring for unusual execution of scripts (e.g., PowerShell execution), which often pairs with command line manipulation techniques.

