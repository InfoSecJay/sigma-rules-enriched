note: |
  ### Technical Context

  This rule detects the use of the command-line redirection operator `<` in `cmd.exe`, which can allow an attacker to read and potentially execute malicious scripts or files. The likely objective of an attacker using this technique is to exploit system capabilities for unauthorized operations, such as executing remote payloads or leveraging legitimate administrative tools in a harmful way. This detection aligns with the MITRE ATT&CK framework under the tactic "Execution" and the technique "Command-Line Interface" (T1059.003).

  The primary telemetry sources include Windows event logs, specifically process creation logs (Event ID 4688) and Sysmon logs (Event ID 1), which capture command-line arguments used by processes. If malicious, this behavior could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm that an attack is occurring, as the use of `<` may also be employed in legitimate scripts or routines.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for instances where `cmd.exe` has been invoked with `<` in the CommandLine field to identify potential misuse.

  - **Correlate with user account activity**: Investigate the username and session ID associated with the alert to determine if the command was run by a legitimate user or an unauthorized account. Look for anomalies, such as a standard user executing sensitive commands.

  - **Identify legitimate use cases**: Analyze recent commands executed with `<` by investigating normal operational patterns in process logs. Legitimate use might include automated scripts for data manipulation by authorized IT staff.

  - **Assess flow of data and file artifacts**: Validate if any files were created or accessed during these command executions. Check file system activity for unusual file creation events (Security Event ID 4663 or Sysmon Event ID 11) linked to the timestamps of the alert.

  - **Monitor for known malicious behavior**: Investigate for known malware signatures or behaviors associated with PowerShell scripts or batch files that utilize redirection operators, particularly those targeting sensitive data or system configurations.

  - **Look for lateral movement indicators**: Cross-reference this event with other suspicious network activities or logins to ascertain if this action is part of a broader intrusion attempt, particularly focusing on access to critical infrastructure.

  ### Prioritization

  This alert is considered medium severity due to its potential to facilitate significant impacts on system integrity, especially if executed on a sensitive system or by a privileged account. The likelihood of abuse is moderate; adversaries often use these command-line techniques for exploitation. However, the prevalence of legitimate admin tasks could reduce the immediate threat level.

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of benign usages of the redirection operator, which may trigger false positives in some administrative contexts. The rule requires extensive logging capabilities, particularly for process creation and command-line arguments, to ensure accurate detection. Activities such as testing scripts or troubleshooting may also generate similar alerts. A related detection of interest includes monitoring for unusual PowerShell command executions (T1059.001), as both could indicate an attempt to exploit command-line capabilities.

