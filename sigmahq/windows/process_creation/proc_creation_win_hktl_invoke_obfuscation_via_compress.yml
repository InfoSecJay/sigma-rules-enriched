title: Invoke-Obfuscation COMPRESS OBFUSCATION
id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
status: test
description: Detects Obfuscated Powershell via COMPRESS OBFUSCATION
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task 19)
author: Timur Zinniatullin, oscd.community
date: 2020-10-18
modified: 2022-12-29
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    CommandLine|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    - 'readtoend('
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects PowerShell commands utilizing the `COMPRESS OBFUSCATION` technique, which is often associated with attackers attempting to conceal their malicious activities from security detection mechanisms. The command patterns identified suggest that the attacker may be leveraging obfuscation methods to compress and obscure their script, potentially resulting in the deployment of malware or execution of unauthorized tasks. The primary goal of such obfuscation is to evade detection while successfully executing commands on the target system.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: the execution of malicious software on a system.
  - **Defense Evasion (T1027)**: the use of obfuscation techniques to disguise malicious artifacts from detection tools.

  The best evidence for this detection is expected to be gathered from **process creation logs** that capture command-line arguments, where analysts can identify suspicious PowerShell executions involving compressed obfuscation strings.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for PowerShell process creation events that match the obfuscation patterns specified in the rule. Focus on logs capturing the command-line arguments for context.

  - **Analyze PowerShell Command Output**: If possible, capture the output of the executed PowerShell commands to gain further insights into the intent and effect of the obfuscated commands.

  - **Correlate with Historical Activity**: Investigate any related security events or alerts that could provide context on the user or system activity leading up to the detection. Look for signs of lateral movement or other suspicious behavior.

  - **Identify Affected Systems**: Determine whether multiple systems exhibit similar command execution patterns. This could indicate a widespread compromise or coordinated attack activity across several endpoints.

  ### Prioritization
  This alert has a medium severity due to the potential for significant impact, as attackers utilizing obfuscation techniques often aim to undermine defenses and execute malicious payloads. The likelihood of encountering such tactics in a large enterprise environment is high, especially in environments where PowerShell usage is prevalent.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if other obfuscation methods or non-PowerShell execution vectors are employed, as this rule specifically targets PowerShell with particular obfuscation strings. The detection logic assumes that malicious commands will consistently contain the identified keywords, which may not account for all variations used by sophisticated attackers. Required configurations include proper logging of PowerShell command-line executions, ensuring that detailed process creation events are captured for analysis.

