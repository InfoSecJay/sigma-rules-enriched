logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    CommandLine|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    - 'readtoend('
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands typically involving the creation of objects for reading and decompressing content. Attackers often use this technique to evade detection while executing potentially malicious scripts or payloads. The primary objective is likely to execute obfuscated commands to download and run malicious tools or code without being easily detected by security solutions.

  This detection relates to the MITRE ATT&CK technique "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter" (T1059.001). The primary telemetry source is Windows process creation logs, specifically focusing on PowerShell command lines. If malicious, this behavior can lead to unauthorized access, data exfiltration, or further exploitation within the network. Importantly, this detection does NOT establish intent or confirm that malicious actions were successfully executed solely based on the presence of these command patterns.

  ### Investigation Steps

  - **Review the command line for obfuscation patterns:** Check for the presence of 'new-object', 'text.encoding]::ascii', and decompression methods such as 'system.io.compression.deflatestream' in the CommandLine field of Security Event ID 4688 logs. Obfuscated or complex command line inputs can indicate potential misuse.

  - **Cross-reference with execution context:** Validate the User and ProcessId fields in the Security Event ID 4688 logs. Look for unusual user accounts or non-standard processes (e.g., PowerShell invoked by unexpected parent processes), indicating possible malicious intent.

  - **Investigate related PowerShell output:** Review the PowerShell logs for any commands that may output sensitive information, as these may not appear in standard event logs if obfuscated outputs are utilized. Verify the activity with the corresponding PowerShell session IDs to identify legitimate versus suspicious behavior.

  - **Identify common legitimate activities:** Normal PowerShell use may involve calls to 'System.IO.Compression' for file management in automated scripts used by system administrators. Cross-reference with internal documentation or automated scripts to confirm benign usage.

  - **Look for signs of malware delivery:** Check for any simultaneous network connections made by the PowerShell process (NetworkEvent ID 5156) to known malicious IP addresses or domains, indicating possible payload delivery.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of the affected systems, particularly if they contain sensitive data. The likelihood of malicious abuse is moderate, as the technique is known to be weaponized to bypass traditional defenses. However, it is crucial to investigate the context to avoid false positives from legitimate obfuscation for administrative tasks.

  ### Blind Spots and Assumptions

  Detection can be limited if logging isn't adequately configured to capture all command line arguments in process creation events. Attackers might employ additional obfuscation techniques or encryption to further mask their activities, which could evade this detection. Legitimate administrative tools may invoke similar command-line patterns, necessitating contextually aware analysis. A companion detection rule focusing on "PowerShell Script Block Logging" could enhance situational awareness by capturing deeper command execution details.

