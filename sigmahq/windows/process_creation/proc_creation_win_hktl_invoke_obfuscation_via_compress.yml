title: Invoke-Obfuscation COMPRESS OBFUSCATION
id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
status: test
description: Detects Obfuscated Powershell via COMPRESS OBFUSCATION
references:
- https://github.com/SigmaHQ/sigma/issues/1009     # (Task 19)
author: Timur Zinniatullin, oscd.community
date: 2020-10-18
modified: 2022-12-29
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'new-object'
    - 'text.encoding]::ascii'
    CommandLine|contains:
    - 'system.io.compression.deflatestream'
    - 'system.io.streamreader'
    - 'readtoend('
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands leveraging .NET classes to achieve compression and manipulation of textual data. The underlying attacker objective is often to conceal malicious activity while executing commands that could be detrimental to the environment, such as data theft, command and control (C2) execution, or lateral movement. This behavior aligns with the MITRE ATT&CK framework under the tactics of Execution (T1059.001) and Stealth (T1027).

  The primary telemetry source for this detection is the Windows process creation logs, specifically focusing on command-line arguments associated with PowerShell execution. If malicious, the security impact could involve successful execution of hidden commands leading to further network exploitation or data exfiltration. It’s crucial to note that this detection does NOT confirm the intention behind the command usage nor the success of any executed commands.

  ### Investigation Steps

  - **Inspect PowerShell Process Commands:** Review Security Event ID 4688 to identify the complete command lines of PowerShell processes. Verify if they include obfuscated patterns like 'new-object' or 'system.io.compression.deflatestream'.

  - **Validate Command Characteristics:** Analyze the scripting contained in detected PowerShell commands. Look for common benign patterns from administrative PowerShell scripts, such as legitimate system maintenance or configuration changes, which often include structured commands without excessive obfuscation.

  - **Identify High-Risk File Activity:** Check for file creation events related to the PowerShell execution using Sysmon Event ID 11 (FileCreate) and identify any suspicious file types or paths typically associated with malicious payloads, such as executables or scripts in temporary directories.

  - **Correlate with Other Security Events:** Cross-reference detected obfuscation with firewall logs (such as Windows Filtering Platform logs) and look for unusual outbound connections or API calls made post-execution to known malicious IP addresses or domains.

  - **Contextualize the Environment:** Determine whether the affected host is critical (e.g., domain controller, sensitive data stores) or less impactful. This context can inform urgency and escalation.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for system compromise, given the capabilities of obfuscated PowerShell commands. While not every instance indicates malicious intent, the use of such techniques is often weaponized by adversaries, increasing the need for further investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by utilizing alternative obfuscation methods or running legitimate administrative scripts that inadvertently include similar command patterns. Reliable detection also requires proper configuration to capture all relevant PowerShell command-line arguments. Additionally, benign administrative tasks, such as automated backups or logging, could trigger this alert. A related detection to consider is Sysmon Event ID 1 (Process Created), which can provide insight into the context of process execution and potential follow-on behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
