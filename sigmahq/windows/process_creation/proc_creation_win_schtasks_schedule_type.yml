note: |
  ### Technical Context

  This detection rule identifies the use of `schtasks.exe` to create or modify scheduled tasks using unusual schedule types such as ONLOGON, ONSTART, ONCE, or ONIDLE. Attackers may utilize this technique to establish persistence or execute malicious tasks under specific conditions, aligning with their objective of gaining prolonged access or executing payloads at system startup. Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Execution (TA0002), particularly technique T1053.005 (Scheduled Task/Job Execution).

  Primary telemetry sources include Windows Process Creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1 with specific fields like `CommandLine` and `Image`. If malicious, this behavior could indicate a sophisticated persistence mechanism that compromises the integrity of the host. However, this detection does NOT confirm malicious intent on its own; further context and investigation are necessary to ascertain the legitimacy of the tasks being scheduled.

  ### Investigation Steps

  - **Review the Command Line Arguments**: Check the `CommandLine` field for values like 'ONLOGON', 'ONSTART', 'ONCE', or 'ONIDLE' in Event ID 4688. These types are rarely used in legitimate enterprise environments and may indicate suspicious activity.

  - **Validate the Scheduled Task Owner**: Inspect the `Username` associated with the task creation (Event ID 4688). Tasks created under NT AUTHORITY\SYSTEM or with elevated privileges (e.g., 'HIGHEST') could signify unauthorized privileged access.

  - **Cross-reference with Legitimate Schedule Patterns**: Compare the detected tasks to regular scheduled tasks within your organization. Typical scheduled jobs include routine maintenance tasks or updates, which often have explicit timing and not aggressive trigger conditions like 'ONLOGON'.

  - **Check Task Visibility**: Utilize `schtasks /query` or inspect task logs in the Task Scheduler GUI for any unexpected tasks linked to user accounts or service accounts that should not be creating tasks in this manner.

  - **Correlate with File System Changes**: Assess for related file creation or access events during the same timeframe as the suspicious task creation. Look for unusual file executions or modifications (e.g., PowerShell scripts or executables) tied to the scheduled tasks.

  ### Prioritization

  This alert is classified as high-priority due to the potential impact on both the affected system and the wider network. Given the ease of misuse of scheduled tasks to maintain persistence or execute malicious code, the likelihood of malicious abuse is significant, especially as these behaviors can be indicative of advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  The detection may not reliably trigger if the logs are disabled or if appropriate logging levels are not configured, particularly for process creation events. Legitimate tasks associated with user logon or system startup might also trigger this alert, potentially leading to false positives. Complementary detection rules that monitor for unusual PowerShell command executions or application installations would enhance coverage against malicious activity in the environment.

