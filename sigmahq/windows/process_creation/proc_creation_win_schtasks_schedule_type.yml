detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_time:
    CommandLine|contains:
    - ' ONLOGON '
    - ' ONSTART '
    - ' ONCE '
    - ' ONIDLE '
  filter_privs:
    CommandLine|contains:
    - 'NT AUT'         # This covers the usual NT AUTHORITY\SYSTEM
    - ' SYSTEM'         # SYSTEM is a valid value for schtasks hence it gets it's own value with space
    - 'HIGHEST'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Legitimate processes that run at logon. Filter according to your environment
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of scheduled tasks using suspicious scheduling types like ONLOGON, ONSTART, ONCE, and ONIDLE, typically associated with persistence mechanisms employed by adversaries. The likely attacker objective is to establish persistence within a compromised environment by scheduling malicious tasks that execute under specific conditions. This detection relates to the MITRE ATT&CK technique for Scheduled Tasks, specifically T1053.005.

  The primary telemetry sources for this detection come from Windows event logs that track process creation, specifically looking for instances of `schtasks.exe` executing with certain command-line arguments. If an alert is validated as malicious, it could lead to unauthorized persistence or lateral movement within the organization. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of scheduled tasks in administrative functions can also trigger the alert.

  ### Investigation Steps

  - **Review task scheduler operations:** Validate entries in Task Scheduler (Event ID 4698) and inspect properties like the "Task Type" for use of ONLOGON, ONSTART, ONCE, or ONIDLE. Legitimate entries typically reflect user-initiated tasks or system maintenance tasks.

  - **Examine process creation logs:** Look for Event ID 4688 and Sysmon Event ID 1 to identify instances where `schtasks.exe` is invoked. Pay attention to the CommandLine field for suspicious parameters.

  - **Check user privileges:** Assess the integrity of the user account associated with the scheduled task. Scheduled tasks created with NT AUTHORITY\SYSTEM or the HIGHEST privilege settings should be scrutinized for potential abuse.

  - **Analyze recent user activity:** Query User Login Event (Event ID 4624) logs to correlate creation/modification of tasks with recent logon events from suspicious or unrecognized accounts that may indicate compromise.

  - **Identify high-confidence malicious indicators:** Focus on any tasks that have command-line parameters indicating they execute scripts, binaries, or connect to external resources (e.g., URLs, scripts).

  ### Prioritization

  This alert is of high severity due to the potential impact on the system's integrity and the likelihood of being exploited by adversaries for persistence. Malicious use of scheduled tasks is common in advanced attacks, making this behavior a key indicator of compromise.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate administrative activity that may also create tasks with similar scheduling types. Ensuring adequate logging of task scheduler operations is necessary for reliable detection. This rule may be triggered by benign organizational behaviors, such as user-configured scheduled tasks for maintenance. Companion detections, such as monitoring for abnormal process executions linked to known malware behaviors, can enhance detection capabilities.

