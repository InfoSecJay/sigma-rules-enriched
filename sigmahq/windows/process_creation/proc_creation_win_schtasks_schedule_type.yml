note: |
  ### Technical Context
  The rule "Suspicious Schtasks Schedule Types" is designed to identify the creation or modification of scheduled tasks on a Windows system using potentially malicious or atypical scheduling options. Attackers may leverage scheduled tasks to maintain persistence, execute payloads, or trigger actions based on certain system events, thus enabling them to execute malicious code without direct user intervention. The typical attacker objectives include establishing long-term access, automating malicious actions, and obfuscating their activities within legitimate system operations.

  This detection is particularly relevant for recognizing tactics and techniques from the MITRE ATT&CK framework, specifically:
  - **Persistence (T1053.005)** - through the use of scheduled tasks to ensure continued access to a compromised system.
  - **Privilege Escalation (T1068)** - if the tasks are created with elevated privileges.
  - **Execution (T1203)** - as the scheduled execution of a task can lead to malicious code being run.

  The primary data sources for gathering relevant telemetry include process creation logs, which will capture activity relevant to `schtasks.exe`, along with detailed command-line arguments utilized in the task creation or modification. This ensures that any abnormal scheduling configurations can be identified and investigated.

  ### Investigation Steps
  - **Review Scheduled Task Logs**: Check the system event logs specifically for `Microsoft-Windows-ScheduledTasks/Operational` to correlate task creations or modifications with their execution times and contexts.
  - **Analyze Process Creation Events**: Examine process creation logs to filter for instances of `schtasks.exe`, along with their command-line arguments to identify the unusual scheduling parameters used.
  - **Inspect Task Scheduler Configuration**: Assess the configurations of any newly created or modified scheduled tasks for suspicious settings like "ONLOGON," "ONSTART," or "ONCE," which may indicate automated execution by a malicious actor.
  - **Correlate with User Activity**: Investigate user login patterns and system activity around the timestamps of task creation or modification to determine if these actions align with legitimate administrative activities or if they appear anomalous.

  ### Prioritization
  This alert is considered high severity because scheduled tasks that employ suspicious types can indicate an attempt to maintain persistence or automate malicious activities, potentially leading to significant breaches of confidentiality, integrity, or availability within the enterprise environment.

  ### Blind Spots and Assumptions
  Detecting this behavior may have gaps if the logging level for process creation is not sufficiently detailed, potentially leading to missed activities. The detection logic assumes that the presence of specific keywords in command-line arguments is indicative of malicious intent, which may not hold true in every environment. Additionally, for the alert to function effectively, the necessary Windows event logs must be enabled and properly configured to capture scheduled task operations and related command lines.

