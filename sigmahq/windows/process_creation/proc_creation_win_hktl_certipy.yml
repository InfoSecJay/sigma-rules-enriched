title: HackTool - Certipy Execution
id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
status: test
description: |
  Detects Certipy execution, a tool for Active Directory Certificate Services enumeration and abuse based on PE metadata characteristics and common command line arguments.
references:
- https://github.com/ly4k/Certipy
- https://research.ifcr.dk/certipy-4-0-esc9-esc10-bloodhound-gui-new-authentication-and-request-methods-and-more-7237d88061f7
author: pH-T (Nextron Systems), Sittikorn Sangrattanapitak
date: 2023-04-17
modified: 2024-10-08
tags:
- attack.discovery
- attack.credential-access
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\Certipy.exe'
  - OriginalFileName: 'Certipy.exe'
  - Description|contains: 'Certipy'
  selection_cli_commands:
    CommandLine|contains:
    - ' account '
    - ' auth '
            # - ' ca ' # Too short to be used with just one CLI
    - ' cert '
    - ' find '
    - ' forge '
    - ' ptt '
    - ' relay '
    - ' req '
    - ' shadow '
    - ' template '
  selection_cli_flags:
    CommandLine|contains:
    - ' -bloodhound'
    - ' -ca-pfx '
    - ' -dc-ip '
    - ' -kirbi'
    - ' -old-bloodhound'
    - ' -pfx '
    - ' -target'
    - ' -template'
    - ' -username '
    - ' -vulnerable'
    - 'auth -pfx'
    - 'shadow auto'
    - 'shadow list'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of Certipy, a tool used for Active Directory (AD) Certificate Services enumeration and manipulation, primarily leveraged in post-exploitation scenarios. Attackers often utilize Certipy to discover certificate templates, forge authentication tokens, and escalate privileges within an AD environment. The tool can be a part of a broader attack strategy aimed at credential access and lateral movement within networks, making its detection critical.

  Relevant MITRE ATT&CK tactics include **Discovery** (TA0007), where the attacker seeks to gather information about the environment, and **Credential Access** (TA0006), where they attempt to steal or manipulate credentials. Key techniques tied to Certipy's functionality are **Credential Dumping** (T1003) and **Access Token Manipulation** (T1134).

  Primary data sources useful for investigating this alert include process creation events that detail when Certipy is executed, and command line arguments indicative of its use. These logs will help uncover unusual patterns indicating malicious activities around certificate services.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for the execution of `Certipy.exe`. Analyze the timestamp and user account initiating the process for any unauthorized access patterns.

  - **Analyze Command Line Arguments**: Look into the command line arguments associated with the Certipy execution. Specific flags like `-bloodhound`, `-pfx`, or `-template` may indicate attempts to manipulate AD Certificate Services.

  - **Check Active Directory Logs**: Inspect AD logs for any unusual queries or commands that correspond with the information retrieved by Certipy. Look for unexpected queries that could suggest enumeration or privilege escalation attempts.

  - **Investigate User Behavior**: Assess the behavior of the user account executing Certipy for any prior anomalies or deviations from normal activity patterns, such as accessing sensitive resources or executing commands typically reserved for administration.

  ### Prioritization
  This alert should be prioritized as **high severity** due to the potential for severe impact on the organization's security posture if an attacker successfully manipulates AD certificate services for lateral movement or credential access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited to environments where Certipy is being executed explicitly; thus, if attackers use alternative tools or methods, such activities may go undetected. The detection logic presumes that proper logging is enabled on endpoints for process creation and command line arguments, which is not always the case in every environment. Additionally, the effectiveness of this rule may depend on the configuration settings of the endpoint and how operational logging is implemented.

