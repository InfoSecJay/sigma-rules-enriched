detection:
  selection_img:
  - Image|endswith: '\Certipy.exe'
  - OriginalFileName: 'Certipy.exe'
  - Description|contains: 'Certipy'
  selection_cli_commands:
    CommandLine|contains:
    - ' account '
    - ' auth '
            # - ' ca ' # Too short to be used with just one CLI
    - ' cert '
    - ' find '
    - ' forge '
    - ' ptt '
    - ' relay '
    - ' req '
    - ' shadow '
    - ' template '
  selection_cli_flags:
    CommandLine|contains:
    - ' -bloodhound'
    - ' -ca-pfx '
    - ' -dc-ip '
    - ' -kirbi'
    - ' -old-bloodhound'
    - ' -pfx '
    - ' -target'
    - ' -template'
    - ' -username '
    - ' -vulnerable'
    - 'auth -pfx'
    - 'shadow auto'
    - 'shadow list'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Certipy, a tool utilized for enumerating and abusing Active Directory Certificate Services. The behavior exhibited by Certipy can indicate attempts to exploit or gather sensitive information regarding certificate authorities, often in preparation for further attacks targeting authentication mechanisms. The relevant MITRE ATT&CK tactic is **Discovery** (T1087) and **Credential Access** (T1649). The primary telemetry source for this detection is Windows process creation logs, specifically looking for Event ID 4688, which captures process creation events, as well as Sysmon Event ID 1 for detailed analysis. If Certipy is executed maliciously, it could lead to unauthorized access or manipulation of Active Directory environments. However, it's important to clarify that this detection does NOT confirm that Certipy has successfully exfiltrated sensitive data or that further malicious activity will follow.

  ### Investigation Steps

  - **Examine process creation details**: Review Security Event ID 4688 and Sysmon Event ID 1 for the process 'Certipy.exe'. Check the *UserName* field to verify if the account running this executable has administrative privileges or unusual access rights.

  - **Analyze command-line arguments**: Look for command-line arguments in Event ID 4688 that include terms like 'auth', 'template', or 'shadow'. These flags often signify attempts to authenticate or interact with Active Directory services and may indicate malicious behavior.

  - **Identify commonly benign scenarios**: Confirm that legitimate uses of Certipy are not occurring. For example, if Certipy is executed by a known administrative user during a scheduled security assessment, it may not indicate malicious intentions, especially if supported by prior security protocols.

  - **Correlate with user behavior**: Investigate the account executing Certipy for prior suspicious activities. Look at related logs (e.g., logs of login attempts, Event IDs 4624 and 4625) to check for multiple failed logins or access from uncommon locations, which increases the likelihood of malicious intent.

  - **Check for companion processes**: Observe any other executed processes that have relations to Certipy using parent-child relationships in Sysmon Event ID 1 logs. For instance, if Certipy.exe is spawned by a command shell (cmd.exe) with unusual command-line parameters, it may suggest a more malicious use case.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems like Active Directory, where successful exploitation could lead to widespread credential theft or unauthorized access. The likelihood of adversaries using tools like Certipy is significant, as they are frequently weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of log management solutions that do not capture all process creation events, especially if Sysmon is not deployed. Legitimate IT administrators may trigger this alert during security assessments or audits when using Certipy for testing purposes. A companion detection that strengthens coverage is logging for anomalous access to Active Directory Certificate Services endpoints, which could indicate reconnaissance activities related to advanced adversaries.

