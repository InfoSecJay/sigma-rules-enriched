title: Security Privileges Enumeration Via Whoami.EXE
id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
status: test
description: Detects a whoami.exe executed with the /priv command line flag 
  instructing the tool to show all current user privileges. This is often used 
  after a privilege escalation attempt.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Florian Roth (Nextron Systems)
date: 2021-05-05
modified: 2023-02-28
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_cli:
    CommandLine|contains:
    - ' /priv'
    - ' -priv'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `whoami.exe` command with the `/priv` flag, which reveals the privileges of the current user. Attackers typically use this command following a privilege escalation attempt to assess their access level and identify further actions they can take. This behavior can be mapped to the MITRE ATT&CK framework under the tactics of Discovery (T1033) and Privilege Escalation.

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 for process creation events. The detection of this command with the specified arguments could indicate malicious activity, as it suggests an awareness of potential system weaknesses and targets. However, this rule alone does not confirm successful privilege escalation or malicious intent, as legitimate users may use this command for troubleshooting or administrative purposes.

  ### Investigation Steps

  - **Review command execution context**: Examine Windows Security Event ID 4688 logs for the process creation of `whoami.exe` showing the `/priv` parameter. Check if the command was executed by an unusual user or in a context that does not align with standard operational usage.

  - **Verify the user account behavior**: Analyze user account activity before and after the execution of `whoami.exe`. Look for unusual patterns in Event ID 4624 (logon events), particularly for accounts that have not typically executed such commands.

  - **Check for related privilege escalation attempts**: Look for other indicators of privilege escalation, such as instances of tools like `net user` or `net localgroup` in command-line execution logs. If found, cross-reference against any associated Event IDs 4688-4690, documenting the sequence of actions.

  - **Identify legitimate use cases**: Understand expected workflows for system administrators in the role where the command was issued. Compare the command execution against typical admin tasks using Event IDs related to routine service management or system checks.

  - **Look for anomalous process creation**: Correlate the `whoami.exe` execution with other suspicious processes running concurrently, especially if they are common malware signatures. Use Sysmon Event ID 1 to track process creation and assess the execution lineage.

  - **Inspect the execution environment**: Evaluate whether the execution happened on sensitive systems or high-value assets. Compare against asset criticality to gauge the potential impact of the detected behavior.

  ### Prioritization

  This alert carries a high severity level due to the nature of the detected behavior, which suggests a potential attempt to map out user privileges post-privilege escalation. There is a significant likelihood of malicious exploitation given that this behavior is commonly seen in post-compromise scenarios.

  ### Blind Spots and Assumptions

  The detection may be limited by users invoking `whoami.exe` in legitimate administrative actions, which could lead to false positives. Ensure that relevant system auditing configurations are in place to capture process creation logs effectively. Legitimate administrative tasks may trigger this alert if not closely monitored. A related detection to consider is any use of PowerShell commands that also facilitate privilege discovery or escalation, enhancing overall threat coverage.

