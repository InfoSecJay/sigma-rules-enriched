title: Security Privileges Enumeration Via Whoami.EXE
id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
status: test
description: Detects a whoami.exe executed with the /priv command line flag instructing
  the tool to show all current user privileges. This is often used after a privilege
  escalation attempt.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Florian Roth (Nextron Systems)
date: 2021-05-05
modified: 2023-02-28
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_cli:
    CommandLine|contains:
    - ' /priv'
    - ' -priv'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `whoami.exe` with the `/priv` command-line flag, which requests a detailed list of user privileges currently held by the executing user. This behavior can indicate potential reconnaissance by an attacker who has attempted to escalate privileges and is now verifying their access rights within the system. The primary objective in such scenarios is to assess the level of access gained and to identify additional actions that could be taken to further compromise the target environment.

  This activity aligns with the MITRE ATT&CK framework, particularly under the tactics of **Privilege Escalation** and **Discovery**. The relevant techniques include **T1033: System Owner/User Discovery**, where adversaries gather information about user privileges following initial access or while performing lateral movement. In terms of telemetry, the primary data sources needed to identify this behavior are **Process Creation Events**, which provide insights into executed processes along with their command-line parameters on Windows systems.

  ### Investigation Steps
  - **Collect Process Logs**: Review the process creation logs to identify instances of `whoami.exe` executed with the `/priv` flag. Look for any unusual parent processes that might suggest malicious activity leading up to this execution.

  - **Analyze User Activity**: Investigate the user account associated with the execution of `whoami.exe`. Check for previous and subsequent activities to identify any unauthorized privilege escalation attempts or lateral movements within the network.

  - **Review Security Logs**: Examine additional security logs, such as Windows Event Logs, for related events before and after the `whoami.exe` execution, particularly focusing on events that indicate privilege changes, logon events, or abnormal account behavior.

  - **Assess for Prior Exploits**: Determine if there have been any previous alerts or incidents concerning privilege escalation attempts using other tools or methods. This context can provide insights into whether this instance is part of a broader attack pattern.

  ### Prioritization
  This alert is rated as high severity due to the critical nature of privilege escalation and discovery activities in an enterprise environment. Successful exploitation of vulnerabilities to gain elevated privileges can lead to substantial impacts, including unauthorized access to sensitive data and full administrative control over critical systems.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection coverage is environments where `whoami.exe` is frequently used for legitimate administrative purposes, leading to possible false positives. Additionally, the detection logic assumes that all process creation events are being logged and that command-line arguments are available, which may not always be the case depending on individual security configurations. It is essential that process creation logging is enabled and properly configured across all Windows systems to ensure effective detection.

