title: Security Privileges Enumeration Via Whoami.EXE
id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
status: test
description: Detects a whoami.exe executed with the /priv command line flag 
  instructing the tool to show all current user privileges. This is often used 
  after a privilege escalation attempt.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Florian Roth (Nextron Systems)
date: 2021-05-05
modified: 2023-02-28
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_cli:
    CommandLine|contains:
    - ' /priv'
    - ' -priv'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_whoami_priv_discovery/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `whoami.exe` with the `/priv` command-line argument on Windows systems. The behavior indicates an attempt to enumerate privileges, which is often executed after a privilege escalation attempt by an adversary. The relevant MITRE ATT&CK tactic is "Discovery" (TA0007), with the specific technique identified as "System Information Discovery" (T1033). The primary telemetry source is process creation logs, specifically Windows Event ID 4688 for process creation events.

  If malicious, this behavior could signify that an attacker has gained access to a user account and is assessing the privileges associated with that account, potentially setting the stage for further exploitation. This detection does NOT prove that an attack occurred; it only indicates that the `whoami.exe` tool was invoked with a specific argument, which can also occur in legitimate administrative contexts.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Event ID 4688 for instances of `whoami.exe` executed with the `/priv` argument. Look for associated User ID and Process ID for context.

  - **Analyze command line activity:** Correlate command line details with potentially malicious activity, such as other command executions that preceded `whoami.exe`. Identify any scripts or automated tasks that might be running.

  - **Identify user context:** Determine the user context in which the command was executed. If executed by a non-privileged user during business hours, it may be suspicious; if run by an administrator for legitimate purposes, it may be benign.

  - **Look for privilege escalation patterns:** Investigate logs around this event for other indicators of privilege escalation (e.g., Event ID 4672 – Special Privileges Assigned). Multiple privilege escalation attempts in proximity can indicate malicious intent.

  - **Confirm legitimate use cases:** Assess if the execution of `whoami.exe /priv` aligns with regular IT administrative tasks or troubleshooting activities. Consult with IT staff if needed to validate the context.

  ### Prioritization

  This alert indicates high severity as it may point to potential privilege escalation activity on critical systems. The likelihood of malicious use is significant, as the command is commonly exploited by attackers to gauge their access levels after an infiltration. Conversely, legitimate administrative activities can also trigger this alert, necessitating further investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of evasion techniques, where attackers could mask privilege enumeration attempts using obfuscation methods or different tools. It requires comprehensive logging on the endpoint to maintain visibility into process creation events. Legitimate administrative users, such as IT personnel, might also execute this command in their routine operations. Complementary detections should include monitoring for unusual access patterns or repetitive command executions near the time this alert triggers, providing a broader context to the alert.

