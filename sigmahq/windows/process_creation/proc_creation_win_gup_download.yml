logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\GUP.exe'
  - OriginalFileName: 'gup.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -unzipTo '
    - 'http'
  filter:
    ParentImage|endswith: '\notepad++.exe'
  condition: all of selection* and not filter
falsepositives:
- Other parent processes other than notepad++ using GUP that are not currently 
  identified
level: high
note: |
  ### Technical Context

  This rule detects the execution of the Notepad++ updater (gup.exe) initiated from a process other than Notepad++. The behavior indicates a potential misuse of the updater utility to download files, which could suggest an attacker is trying to abuse the functionality for command and control (C2) purposes. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Application Layer Protocol (T1105).

  The primary telemetry source is process creation logs from Windows, specifically looking for event types related to the execution of gup.exe outside of its standard operation. If this behavior is malicious, it could facilitate unauthorized file downloads or payload delivery. Importantly, this detection does NOT confirm that the download is malicious; it only indicates that it occurred under suspicious circumstances.

  ### Investigation Steps

  - **Check process parentage:**
    Validate that the gup.exe execution was not initiated by Notepad++ (ParentImage ends with `\notepad++.exe`). If not, further investigate the triggering process's legitimacy.

  - **Review command-line arguments:**
    Examine the CommandLine field for the presence of `-unzipTo` and `http`, indicating attempts to download and extract files. Legitimate Notepad++ updater uses valid URLs, so check for known safe domains.

  - **Correlate with network activity:**
    Analyze network connection logs (e.g., Windows Firewall logs or network flow logs) around the same timeframe to identify any suspicious outbound connections initiated by the process or other related processes.

  - **Validate the file download location:**
    Inspect any file creations in common temporary directories used by GUP, such as `C:\Users\<username>\AppData\Local\Temp\`. Look for files that should not normally be there or exhibit unusual file extensions.

  - **Identify known malicious URLs:**
    Cross-reference the downloaded file URLs against threat intelligence feeds to detect known malicious sources. A connection to an IP or domain from a known threat actor would indicate a high-confidence malicious context.

  ### Prioritization

  This alert should be treated as high severity due to potential command and control indicators on critical systems. The likelihood of malicious exploitation is elevated based on the misuse of a common application, and this behavior is known to be weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques where an attacker masks the execution context of gup.exe or uses alternate methods to download payloads. Ensure that process creation logging is enabled and configured to capture all relevant details. Additionally, other legitimate applications may employ GUP for updating, which could yield false positives. A companion detection, such as monitoring for unusual outbound networks connections, can strengthen coverage and context regarding potential malicious use.

