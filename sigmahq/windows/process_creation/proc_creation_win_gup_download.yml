title: File Download Using Notepad++ GUP Utility
id: 44143844-0631-49ab-97a0-96387d6b2d7c
status: test
description: Detects execution of the Notepad++ updater (gup) from a process other
  than Notepad++ to download files.
references:
- https://twitter.com/nas_bench/status/1535322182863179776
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2023-03-02
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\GUP.exe'
  - OriginalFileName: 'gup.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -unzipTo '
    - 'http'
  filter:
    ParentImage|endswith: '\notepad++.exe'
  condition: all of selection* and not filter
falsepositives:
- Other parent processes other than notepad++ using GUP that are not currently identified
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the Notepad++ updater utility, known as GUP, initiated from processes other than the Notepad++ application itself. Attackers may exploit the GUP for malicious purposes, such as downloading and executing harmful payloads while disguising their activities. In scenarios where legitimate applications are used for nefarious actions, this could indicate a potential security breach or unauthorized activity within the network.

  The rule aligns with the MITRE ATT&CK framework's tactics and techniques, particularly focusing on **Command and Control (T1071)** and **Application Layer Protocol (T1105)**. In this context, attackers might leverage the GUP to establish a command and control channel and retrieve malicious payloads, compromising host integrity. The primary source of pertinent evidence includes process creation events that capture command-line arguments, as well as logs related to application usage.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for entries related to `GUP.exe` being executed. Pay close attention to the parent process of the executable to determine whether it was invoked by a legitimate application or potentially malicious behavior.

  - **Analyze Command-Line Arguments**: Focus on command-line invocations containing the parameters '-unzipTo' and 'http'. These will indicate that the execution was intended to download files. Investigate the URLs accessed if available.

  - **Check for Other Instances of GUP**: Investigate occurrences of GUP being executed from other non-Notepad++ processes. This may help determine if the GUP utility is being used maliciously in conjunction with other applications.

  - **Correlate with Network Traffic**: If possible, analyze outbound network traffic during the timeframe of suspicious GUP executions to identify any unusual data transfers or connections to known malicious servers.

  ### Prioritization
  This alert holds high severity due to the potential for malicious file downloads, which can lead to system compromise and data exfiltration. The likelihood of unauthorized usage of legitimate applications like Notepad++ exacerbates the risk, making this a critical detection for immediate investigation.

  ### Blind Spots and Assumptions
  One gap in this detection could be the execution of GUP from other legitimate processes that are not currently identified, leading to false negatives. The detection logic assumes that any execution of GUP not initiated by Notepad++ is suspicious, which may not always be accurate. For the alert to function effectively, it is crucial to have comprehensive process creation logs that capture command line arguments and parent process information across the enterprise environment.

