logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # You can add more permutation as you see fit
    - 'Get-Process lsas'
    - 'ps lsas'
    - 'gps lsas'
  condition: selection
falsepositives:
- Unknown
level: high
