title: PowerShell Get-Process LSASS
id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
status: test
description: Detects a "Get-Process" cmdlet and it's aliases on lsass process, which
  is in almost all cases a sign of malicious activity
references:
- https://web.archive.org/web/20220205033028/https://twitter.com/PythonResponder/status/1385064506049630211
author: Florian Roth (Nextron Systems)
date: 2021-04-23
modified: 2023-01-05
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # You can add more permutation as you see fit
    - 'Get-Process lsas'
    - 'ps lsas'
    - 'gps lsas'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets the execution of the PowerShell `Get-Process` cmdlet and its aliases (like `ps` and `gps`) specifically on the Local Security Authority Subsystem Service (LSASS) process. The rule aims to uncover potential credential harvesting attempts, as malicious actors often access LSASS to steal credentials from memory using PowerShell, a common technique employed by various exploit tools and malware families. The LSASS process is critical for system security and contains sensitive user authentication data.

  The likely attack scenario involves an adversary using PowerShell to query the LSASS process. The goal is typically to extract sensitive information that can be leveraged for lateral movement within the organization, privilege escalation, or full domain compromise. The associated risk is significant due to the potential for credential theft leading to unauthorized access and data breaches.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access** (TA0006)
  - **Credentials from Password Stores** (T1552.004)

  The primary data sources to monitor for this detection include:
  - Process creation events from host-based logging solutions, primarily on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect Windows process creation logs to identify instances where the `Get-Process lsass`, `ps lsass`, or `gps lsass` command is executed. Look for any parent processes that could indicate potentially malicious behavior.

  - **Analyze Cmdlet Context**: Investigate the context in which the cmdlet was executed, including user accounts involved and the time of execution. Correlate this with other unusual activity in the environment.

  - **Investigate LSASS Access Patterns**: Cross-reference the identified command executions with standard behavioral patterns for privileged users. Look for anomalous patterns, such as sudden access or command executions by non-administrative accounts.

  - **Inspect for Malicious Tools**: Check for the presence of tools commonly used in credential dumping, such as Mimikatz, that may accompany the execution of PowerShell commands against LSASS.

  ### Prioritization
  This alert is classified as high severity due to the critical nature of LSASS in maintaining the security of authentication credentials. The detection of process interactions with LSASS could indicate a higher likelihood of credential theft, a precursor to significant breaches or lateral movement within the network.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if process creation logging is not fully enabled or if PowerShell command logging is disabled. The detection logic assumes that the execution of PowerShell commands targeting LSASS is unusual within the operational context of the environment. Additionally, it presumes sufficient logging configurations are in place to capture process creation events accurately, which is crucial for this alert to function properly.

