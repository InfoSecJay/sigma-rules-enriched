logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # You can add more permutation as you see fit
    - 'Get-Process lsas'
    - 'ps lsas'
    - 'gps lsas'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet "Get-Process" specifically targeting the Local Security Authority Subsystem Service (LSASS) process. Detecting such activity is indicative of an attacker trying to access sensitive information from LSASS, which could include accessing credentials in memory. This behavior falls under the MITRE ATT&CK framework's tactic of Credential Access (TA0006) and the technique named Credential Dumping (T1552.004).

  The primary telemetry source for this detection is the process creation logs on Windows systems, particularly Security Event ID 4688. The potential security impact is significant, as successful exploitation could lead to credential theft, enabling further access or lateral movement within the network. However, it is important to note that the detection does NOT confirm that a malicious act has occurred on its own, as legitimate administration scripts or troubleshooting actions could invoke similar commands.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for the command line that includes "Get-Process lsas", "ps lsas", or "gps lsas". Focus on the parent process; PowerShell or a scripting environment indicates potential scripting by legitimate admins versus an attacker.

  - **Analyze user context:** Identify the user account associated with the process creation. Suspicious accounts (non-admin or previously inactive accounts) executing such commands should be closely scrutinized for malicious intent.

  - **Check for related logins or anomalies:** Look for unusual logon events (Security Event ID 4624) leading up to the detected command execution from the same user or host. This helps establish whether there was prior reconnaissance or a breach.

  - **Validate typical administrative usage:** Compare against expected behaviors for system administrators. Such users may run "Get-Process" on LSASS for legitimate troubleshooting; however, the context (time, frequency) should align with administrative activity.

  - **Assess system role and criticality:** Investigate if the command was run on sensitive servers (like Domain Controllers or databases). The impact of credential theft could be more severe in these environments.

  - **Identify malicious indicators:** Note any abnormal command patterns or timing, like scripts executed in off-hours or repeated attempts to fetch LSASS data. Correlate with prior threat intelligence regarding attackers' techniques targeting LSASS.

  ### Prioritization

  Given the context of the alert, it is classified as high severity. The LSASS process is critical for Windows security, and its compromise likely means the attacker is attempting to collect sensitive credential information. Moreover, the specific targeting of LSASS has been frequently weaponized in numerous credential theft and ransomware attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation tactics, with attackers potentially using different cmdlets or renamed utilities to evade detection. Reliable detection also requires complete logging configurations for process creation and adequate access to necessary log sources. Legitimate administrative users may occasionally need to run similar commands during troubleshooting, which could lead to false positives. Companion detections such as monitoring for unusual file access to LSASS memory or lateral movement attempts (T1075, Pass the Hash) could be beneficial to strengthen overall coverage.

