  regression_data/rules/windows/process_creation/proc_creation_win_powershell_getprocess_lsass/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands, specifically "Get-Process" and its aliases, targeting the Local Security Authority Subsystem Service (LSASS). The behavior typically indicates an attacker's attempt to extract credentials stored in memory, as LSASS is responsible for enforcing the security policy on Windows systems and handling user logins. This activity falls under the MITRE ATT&CK framework's Credential Access technique (TA-1552.004).

  The primary telemetry source for this detection will be Windows process creation logs, particularly focusing on event IDs 4688 (Process Creation) and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized access to sensitive credentials and facilitate further lateral movement within the network. It is important to note that detecting this command alone does NOT confirm an active attack; legitimate administrative tasks may also invoke similar commands.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where "Get-Process lsas", "ps lsas", or "gps lsas" command lines appear. Look for a parent process that indicates a potentially malicious context (e.g., unusual PowerShell instances).

  - **Identify system roles:** Confirm whether the host executing this command has a legitimate role that warrants monitoring LSASS, such as a Domain Controller or a system performing administrative tasks.

  - **Review PowerShell execution policy:** Analyze the execution policy using `Get-ExecutionPolicy` for any inconsistencies that may suggest a bypass attempt or malicious scripting activity. Legitimate environments typically maintain restrictive execution policies.

  - **Correlate with user behavior:** Look for significant deviations in user behavior that may accompany this command execution, such as access from non-standard accounts, unusual login times, or accounts not matching administrative roles.

  - **Seek high-confidence indicators:** Evaluate the command output or additional invocations following the detected commands for memory scraping tools or any egress activity that could indicate credential extraction.

  ### Prioritization

  Given that LSASS contains sensitive credentials critical for maintaining security, alerts involving its access through PowerShell are classified as high severity. The likelihood of malicious use is high since attackers frequently leverage this method to harvest credentials for lateral movement. Awareness of these tactics is essential as they are common in many credential theft campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is misconfigured or if the executed command is obfuscated through scripting. Additionally, legitimate administrative tasks could trigger these alerts, especially in environments that regularly utilize PowerShell for system management. A related detection to consider is the monitoring of memory access to LSASS processes, which can validate potential credential dumping techniques that may accompany the observed behavior.

