detection:
  selection:
    CommandLine|re: '(?i)(?:set).*&&\s?set.*(?:environment|invoke|\$\{?input).*&&.*"'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands through standard input (stdin), specifically looking for command structures that build environment variables or invoke processes using chained commands. The likely attacker objective is to execute malicious scripts stealthily while avoiding static detection methods that look for known patterns. This behavior fits into the MITRE ATT&CK framework under the tactics of Execution (T1203) and Obfuscated Files or Information (T1027).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to a successful exploit, malware installation, or lateral movement within the network. However, this detection does NOT prove a compromise on its own; further investigation is required to confirm malicious intent.

  ### Investigation Steps

  - **Review recent process creation events**: Check Security Event ID 4688 for any PowerShell (powershell.exe) command lines that match the regex in the detection. Pay attention to any unusual command arguments, especially those that involve `set` and chaining commands like `&&`.

  - **Correlate with Sysmon logs**: Look for Sysmon Event ID 1 entries corresponding to the detected PowerShell processes. Analyze the CommandLine field for obfuscation patterns or unusual parent processes.

  - **Identify legitimate usage scenarios**: Assess whether the PowerShell execution is part of scheduled tasks or automation scripts known to the organization, particularly from trusted systems or users.

  - **Check for high-confidence malicious indicators**: Look for subsequent process creations spawned by the detected PowerShell instance, especially if those processes are benign executables or exhibit malicious characteristics (e.g., CMD.exe, .NET binaries invoking other processes).

  - **Examine for potential lateral movement**: Investigate any network connections or communication patterns initiated by the detected PowerShell, referencing logs (such as Windows Firewall logs) for unusual outgoing traffic to untrusted external IPs or domains.

  - **Validate environment changes and artifacts**: Review logs for any sudden changes in environment variables or temporary files created/session artifacts post-execution. Check if any logging (Sysmon Event ID 10) points to script block logging or deobfuscated outputs.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems, as obfuscated PowerShell commands can be indicative of advanced persistent threat (APT) activities. The likelihood of malicious use is high given the stealthy nature of obfuscation techniques in exploitation and malware delivery.

  ### Blind Spots and Assumptions

  The detection may be limited by various evasion techniques such as directly executing commands with low verbosity or using encoded command invocations. Reliable detection requires the use of both Security Event ID and Sysmon logging configurations; without Sysmon, visibility into command behavior is significantly reduced. Legitimate administrative activities, such as automation scripting, may trigger the alert. A companion detection to consider is the monitoring of Windows Event IDs for suspicious process creations following the PowerShell execution pattern.

