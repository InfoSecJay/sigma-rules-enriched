  ---

  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands executed through standard input (stdin). The behavior typically aims to evade detection by security solutions and manipulate the operating environment or execute payloads without leaving a clear trail. The likely attacker objective is to execute malicious scripts or commands while remaining hidden in the process creation logs. It aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry sources for detection are the Windows process creation logs, specifically focusing on the CommandLine parameter within logs such as Security Event ID 4688 or Sysmon Event ID 1. If executed by an attacker, this behavior could lead to unauthorized access, data exfiltration, or persistence within the environment. Importantly, this detection does NOT confirm malicious intent solely based on the presence of obfuscated PowerShell commands; context and further investigation are essential.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Cross-reference the CommandLine parameter from Security Event ID 4688 or Sysmon Event ID 1 for unusual or obfuscated strings involving "set" and "invoke." Look for the presence of escaped characters or concatenation which are suspicious.

  - **Identify processes with anomalous parent-child relationships:** Use Sysmon Event ID 1 to identify processes created by unusual or unexpected parent processes. Legitimate PowerShell usage typically originates from trusted applications and scripts, while this alert may show unexpected parent processes or unusual command combinations.

  - **Check user context:** Verify the user account associated with the alert. Attackers often execute these commands under non-administrative or compromised accounts, while legitimate users generally run PowerShell in typical administrative contexts.

  - **Analyze related network activity:** Investigate outbound network connections established by the process. Look for Sysmon Event ID 3 (Network Connection) to confirm whether the obfuscated command correlates with suspicious external communication patterns, such as invoking commands from known malicious IPs.

  - **Assess host role and criticality:** Evaluate the asset on which the alert was triggered. High-risk systems (e.g., domain controllers, critical infrastructure) should be prioritized for immediate investigation over standard workstations.

  - **Document any indicators of compromise:** If the investigation reveals files or scripts that were created or modified (Sysmon Event ID 11), capture the file paths and hashes for further analysis and possible remediation.

  ---

  ### Prioritization

  This alert is of high severity given that it involves obfuscated PowerShell commands potentially indicating malicious behavior aimed at circumventing security controls. The system's criticality and the likelihood of exploitation increase the necessity to investigate quickly, as this method is frequently weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the effectiveness of process creation logging; if logging is not properly configured or if commands are sufficiently obfuscated, detection may fail. Legitimate administrative scripts may trigger this alert, especially if they use obfuscation techniques for internal purposes. To enhance detection, companion rules focusing on PowerShell script block logging (T1059.001) should be leveraged for a more comprehensive view of PowerShell activity.

