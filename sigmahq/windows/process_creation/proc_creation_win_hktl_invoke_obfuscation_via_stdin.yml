note: |
  ### Technical Context

  The Sigma rule detects obfuscated PowerShell commands being executed through standard input (stdin), which may indicate attempts to evade detection measures by using deceptive scripting techniques. The likely objective of an attacker using this method is to execute malicious commands covertly, potentially leading to further compromise, data exfiltration, or lateral movement within the network. This behavior aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1, which contain detailed command line information for running processes. If malicious, such behavior may lead to unauthorized system access or data breach events. However, this detection does NOT confirm that the execution is malicious on its own; further context is needed.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1, focusing on the CommandLine field for any entries matching the regex pattern and containing terms like 'invoke' or 'set'. Compare against known benign scripts.

  - **Analyze parent process relationships:** Determine if the executing PowerShell process has a suspicious parent process (e.g., a random executable or a known exploit tool). Use Sysmon Event ID 1 to find ParentProcessId fields.

  - **Correlate user activity:** Look for user account behavior in the context of the event (Event ID 4624). Legitimate administrative users may run obfuscated scripts for troubleshooting, but unusual usage patterns (e.g., at odd hours) could signify malicious intent.

  - **Check environment variables:** If applicable, assess any environment variables set prior to the command execution via command logging tools. Unexpected environmental changes might indicate malicious activity.

  - **Validate script origins:** Use file monitoring logs to verify if the PowerShell scripts were downloaded from suspicious URLs or external sources. Look for URL shortening services indicating potential obfuscation or evasion attempts.

  - **Identify high-confidence indicators:** Capture instances where the CommandLine specifically includes a substantial amount of tampering or obfuscation (e.g., encoded commands) as this suggests malicious intent, particularly if sourced from non-standard locations.

  ### Prioritization

  This alert has high severity due to the potential impact on critical enterprise systems, particularly if PowerShell is abused for lateral movement or data exfiltration. The likelihood of malicious abuse is significant given historical trends showing weaponization of obfuscation techniques in recent attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by tools that do not log command lines adequately or where users legitimately use obfuscated scripts for administrative purposes. A dependence on configuration settings in logging policies is crucial for reliable detection. Legitimate activities like troubleshooting or automation using obfuscated scripts could trigger this alert. Companion detections such as monitoring for unusual outbound network connections initiated by PowerShell may strengthen overall threat coverage.

