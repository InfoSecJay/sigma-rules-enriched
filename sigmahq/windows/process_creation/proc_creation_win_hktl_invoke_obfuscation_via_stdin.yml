logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|re: '(?i)(set).*&&\s?set.*(environment|invoke|\$\{?input).*&&.*"'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious use of obfuscated PowerShell scripts that leverage standard input (stdin) for execution. Attackers often employ such techniques to bypass defenses, execute payloads stealthily, and evade detection systems. The objective behind using obfuscated scripts could range from exfiltrating sensitive information to deploying additional exploits within a compromised environment.

  The primary MITRE ATT&CK tactics relevant to this rule include **Defense Evasion** (T1089) due to the obfuscation aspect and **Execution** (T1059.001) specifically for PowerShell execution. Attackers frequently utilize obfuscated commands to launch scripts that could manipulate system functions, gather data, or download additional payloads, all while aiming to remain under the radar of security monitoring tools.

  The most pertinent telemetry sources for detecting this behavior include **process creation logs from Windows systems**, which capture command-line arguments used during script execution. These logs provide critical indicators of suspicious command patterns commonly associated with obfuscated PowerShell scripts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for suspicious PowerShell command-line arguments closely resembling the defined regex pattern. Focus on commands using "set" and piped commands that involve "environment" or "invoke".

  - **Analyze PowerShell Transcripts**: If available, investigate PowerShell transcription logs to correlate suspicious activity with recorded console output. Check for any commands leading up to or resulting from the obfuscated script execution.

  - **Correlate with Network Traffic**: Inspect any associated network traffic that occurred at the same time as the process creation. Look for unusual connections, especially those connecting to known malicious domains or utilizing uncommon ports.

  - **Conduct System Integrity Checks**: Look for signs of further exploitation, such as modified files or unauthorized access points created by the executed PowerShell script. Utilize file integrity monitoring tools to identify any unauthorized changes.

  ### Prioritization
  This alert is of high severity given that successful execution of obfuscated PowerShell scripts often indicates a significant risk of compromise, leading to potential data breaches or system exploitation. The blend of evasion techniques and execution capabilities poses a considerable threat to enterprise security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if PowerShell logging settings are not adequately configured, as certain obfuscation techniques can evade detection through minimized logging. The detection logic presumes that sufficient command-line visibility exists in process creation logs, which may not always be the case depending on the endpoint security configurations. Ensuring comprehensive logging of PowerShell activities and appropriate configurations is vital for the effective functioning of this alert.

