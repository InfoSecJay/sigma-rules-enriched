note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell commands that utilize obfuscated character syntax, particularly with the use of `[char]0x` or `(WCHAR)0x`. Attackers often use such techniques to evade detection from security solutions as it obscures the true intent of the code. This obfuscation might be a tactic employed by threat actors looking to execute scripts for data exfiltration, lateral movement, or other malicious activities in a compromised environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include "Execution" (TA0002), specifically under "Command and Scripting Interpreter" (T1059.001) which pertains to PowerShell usage, and "Defense Evasion" (TA0005), particularly the technique "Obfuscated Files or Information" (T1027). The primary data source useful for this detection is the process creation logs, which track command line executions in a Windows environment.

  ### Investigation Steps
  - **Review Command Line Arguments**: Analyze the process creation logs for any instances of PowerShell processes that contain obfuscated command line syntax like `[char]0x` or `(WCHAR)0x`. Look for unusual or unexpected commands that may indicate malicious intent.

  - **Correlate with User Context**: Check the context under which these commands were executed. Identify the user and the process parent-child relationships to determine if the execution appears anomalous based on typical user behavior.

  - **Examine Surrounding Events**: Investigate additional telemetry around the detected PowerShell command for other potentially suspicious activities, such as network connections made by the same process or subsequent processes spawned after execution.

  - **Analyze Historical Patterns**: Utilize threat intelligence or historical data to assess if the observed patterns of obfuscated PowerShell are part of a larger trend or specific threat actor's behavior. Reference known bad IPs and hashes if available.

  ### Prioritization
  This alert is considered high severity due to the potential for evasion techniques to lead to significant security breaches. The use of obfuscation in PowerShell scripts is a known method by sophisticated attackers to circumvent defenses, increasing the likelihood of successful exploitation.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be cases where obfuscation techniques do not utilize the specific patterns identified in this rule, thus allowing some malicious activity to bypass detection. The detection logic assumes that PowerShell is enabled and regularly used in the environment, which may not hold true in all use cases. Additionally, proper process creation logging must be enabled on Windows devices for this alert to generate reliably; without this, the detection will not function as intended.

