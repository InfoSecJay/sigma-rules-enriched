note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell command invocations that utilize obfuscated character syntax, specifically through the usage of `[char]0x` and `(WCHAR)0x` conversion methods. The likely attacker objective behind this behavior is to execute malicious scripts while evading detection mechanisms by obscuring the true intent of the command. This ties into the MITRE ATT&CK framework, specifically under the Execution tactic (T1059.001) and the Stealth tactic (T1027).

  The primary telemetry source for this detection is process creation logs, specifically from Windows systems, with a focus on capturing the CommandLine parameter of the execution context. If the behavior is malicious, it could lead to unauthorized access, data exfiltration, or system compromise. It is crucial to note that this detection does NOT confirm outright malicious intent, as benign applications can also employ obfuscation techniques for legitimate purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 logs for any instances where commands contain `[char]0x` or `(WCHAR)0x`. Identify the user context and timestamp of execution.

  - **Analyze command context:** Investigate surrounding CommandLine arguments in Event ID 4688. Look for familiar PowerShell script patterns or parameters, as benign PowerShell usage typically does not involve obfuscation techniques.

  - **Correlate with user behavior:** Verify if the user associated with the PowerShell execution has a legitimate need for running these commands. Confirm whether the user is part of a role that typically executes PowerShell scripts as part of operational tasks.

  - **Look for high-confidence indicators:** Identify any additional potentially suspicious activity from the same user, such as unusual outbound connections or file modifications. Check for Process ID consistency in Event ID 4688 and see linkage to known malware.

  - **Assess environment settings:** Ensure Windows auditing is configured correctly to capture detailed command line arguments in Security logs. Confirm that proper logging for PowerShell script execution (`ModuleName`, `ScriptBlock`) is enabled.

  ### Prioritization

  This alert is high severity due to the potential impact on the affected Windows system, which may serve crucial functions within the enterprise. The likelihood of malicious use is elevated as attackers often employ obfuscation tactics to bypass security tools. Given that PowerShell is a common vector for many attacks, this behavior is frequently weaponized.

  ### Blind Spots and Assumptions

  The detection may be evaded if the attacker modifies the encoding styles or uses alternative obfuscation techniques not covered by the rule. Reliable detection requires proper logging configurations and may necessitate monitoring additional artifacts beyond just simple command line execution. Legitimate administrative scripts could trigger this alert if they utilize obfuscation techniques for protection against reverse engineering, highlighting the need for context. A complementary detection to consider is monitoring PowerShell transcription logs for unusual script execution.

