  ---

  ### Technical Context

  This Sigma rule detects the use of obfuscated PowerShell commands that invoke encoded character syntax, commonly utilized by adversaries to evade detection while executing malicious scripts. The likely objective of this tactic is to execute payloads or commands without raising alarms in traditional security monitoring systems. The relevant MITRE ATT&CK tactics include "Execution" (TA0002) and "Defense Evasion" (TA0005), specifically techniques T1059.001 (PowerShell) and T1027 (Obfuscated Files or Information).

  Primary telemetry sources include Windows process creation logs, specifically focusing on CommandLine parameters. If malicious, the execution of such obfuscated commands can lead to significant security impacts, including system compromise, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm that the activity is inherently malicious without further investigation; legitimate administrative tasks may also employ similar command structures.

  ---

  ### Investigation Steps

  - **Examine CommandLine parameters for obfuscation patterns:** Review Security Event ID 4688 logs for suspicious PowerShell executions containing '[char]0x' or '(WCHAR)0x'. Evaluate if these patterns align with typical usage for script execution or administrative tasks.

  - **Identify the parent process of the execution:** Check for the parent process ID in the same Security Event ID 4688 log entries or Sysmon Event ID 1 to understand the context. Malicious activity may come from unusual or unapproved processes rather than expected tools like PowerShell ISE or scripts from known paths.

  - **Correlate with other telemetry sources:** Look at Windows Defender or AV logs for alerts associated with the time of the suspicious execution. A lack of prior incidents or alerts correlating with the process execution may suggest a high-confidence malicious indicator.

  - **Assess asset criticality and role of the executing host:** Determine if the host is a critical server or workstation. Malicious PowerShell execution on a domain controller would have a higher impact than on an unmanaged personal device.

  - **Review historical activity for legitimate usage:** Utilize log management tools to analyze previous PowerShell command executions on the same asset. Document expected or legitimate usages, such as system updates or automated tasks, to help delineate between benign and malicious behavior.

  ---

  ### Prioritization

  Alerts generated by this detection rule should be treated as high-priority due to the potential impact on the enterprise, particularly when affecting critical systems. The specific obfuscation technique is commonly used by attackers to bypass security measures, indicating a significant likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by PowerShell logging configurations; if logging is improperly configured, legitimate commands could inadvertently trigger the alert. Attackers may also use other obfuscation techniques or benign PowerShell commands that do not match the detection criteria, leading to false positives. Companion detections, such as monitoring for unusual laterally movement or script execution patterns in PowerShell, can provide better context for assessing threat presence.

