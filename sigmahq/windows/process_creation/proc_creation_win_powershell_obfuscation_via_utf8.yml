note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize obfuscated characters, commonly formatted with '[char]0x' or '(WCHAR)0x'. This behavior is indicative of an attacker attempting to bypass security measures by encoding commands, thus concealing their true intent. The likely attacker objective is to execute malicious payloads or scripts while evading detection by security monitoring tools. This detection aligns with the following MITRE ATT&CK techniques: Execution (T1059.001) and Obfuscated Files or Information (T1027).

  The primary telemetry source for this detection is process creation logs, specifically focusing on PowerShell execution events. Key log types include Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can facilitate the delivery of malware or the execution of commands that compromise systems. However, this detection does NOT confirm that the activity is inherently malicious, as benign PowerShell usage may also trigger similar command structures.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for PowerShell command execution involving '[char]0x' or '(WCHAR)0x'. Look for parent processes and unusual command line arguments that suggest automation or scripting.

  - **Identify high-confidence malicious indicators**: Look for any obfuscated commands that link to known malicious payloads or behavior. Cross-reference command hashes or process signatures against threat intelligence databases.

  - **Assess the context of PowerShell usage**: Determine whether PowerShell is used by expected roles, such as IT administrators. Legitimate commands might include service management or system updates, often being more transparent (e.g., using clear text commands).

  - **Examine related subprocesses**: Investigate any child processes spawned by the PowerShell command. High-risk subprocesses might include notable tools like msiexec.exe or suspicious binaries executed subsequently, indicating a multi-step attack.

  - **Evaluate execution frequency**: Check for a high frequency of execution originating from a single machine or user account in a short time frame. This could indicate automated malicious activity instead of manual legitimate usage.

  ### Prioritization

  This alert is of high severity due to the potential impact on the environment and the likelihood of exploit by adversaries. The use of PowerShell for obfuscation is a common tactic among attackers, often leading to further compromise if undetected. Due to its capability for executing a wide array of commands, it is a prime avenue for exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through various encoding schemes that might not be captured by this rule. Additionally, some legitimate applications may utilize similar obfuscation strategies, such as administrative scripts or third-party tools. Reliable detection necessitates comprehensive log configuration, specifically ensuring that detailed logging for PowerShell execution is enabled. A complementary detection to consider is monitoring the execution of PowerShell scripts with extended logging enabled, as it could provide additional context and strengthen coverage against evasion techniques.

