note: |
  ### Technical Context

  This rule detects the use of PowerShell commands featuring obfuscated character encoding syntaxes, specifically instances that contain '[char]0x' or '(WCHAR)0x'. These behaviors are typically employed by attackers to hide their intentions and evade detection during a PowerShell execution phase. The likely objective of the adversary includes executing malicious scripts or commands while making them harder to identify through normal security monitoring processes.

  This behavior aligns with the MITRE ATT&CK technique for Execution (T1059.001 - PowerShell) and Defense Evasion (T1027 - Obfuscated Files or Information). The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture detailed command execution details. If successfully exploited, these actions could lead to system compromise, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate uses of similar encoding may occur for non-malicious purposes.

  ### Investigation Steps

  - **Review Security Event ID 4688:** Check for process creation events that show PowerShell execution. Analyze the CommandLine field for indicators such as '[char]0x' or '(WCHAR)0x'. Legitimate PowerShell commands typically do not use these encodings unless specifically needed.

  - **Examine Sysmon Event ID 1:** Investigate the command line execution parameters of PowerShell. Look for the same obfuscation patterns mentioned in the detection criteria. Malicious indicators would be the use of encoded characters immediately followed by known malicious commands.

  - **Cross-reference parent processes:** Identify the parent process of the PowerShell execution to determine its origin. Expected benign activity may originate from system management tools or IT automation scripts, while unexpected or unknown parent processes should raise concern.

  - **Check recent script or command history:** Analyze for any prior PowerShell scripts run within the last 24-48 hours using Event ID 4104 from PowerShell log. This helps identify if this activity is part of a series of suspicious commands being executed.

  - **Correlate with threat intelligence:** Determine if similar obfuscation techniques have been reported in recent threat intelligence. This can include reviewing known IOCs for malware families employing these techniques.

  ### Prioritization

  Given its high severity level, alerts triggered by this rule warrant urgent investigation. The use of obfuscation in PowerShell commands is a common tactic among advanced persistent threat actors and can indicate malicious activity if correlated with other suspicious behaviors. The impact of potential compromise could be severe, especially on critical infrastructure systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to capture user-driven PowerShell activities that are legitimately obfuscated for reasons like script portability. This may lead to false positives from authorized administrative activities. Required log sources include both Windows Security and Sysmon logs configured to capture detailed process creation events. Related detections that strengthen coverage could involve raw PowerShell command logging (Event ID 4104), providing a more comprehensive view of PowerShell activity across the environment.

