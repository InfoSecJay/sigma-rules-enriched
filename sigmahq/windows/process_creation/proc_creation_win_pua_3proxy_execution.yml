note: |
  ### Technical Context

  This rule detects the execution of 3proxy, a lightweight proxy server often used for evading network restrictions or facilitating command-and-control (C2) activities. The primary attacker objective may include establishing a covert communication channel or redirecting traffic to perform unauthorized actions. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1572).

  The primary telemetry source for this detection is process creation logs, particularly on Windows systems, such as Security Event ID 4688 and Sysmon Event ID 1, capturing the command line and executable details. If executed with malicious intent, this behavior can compromise the integrity and confidentiality of network traffic, potentially allowing an attacker to exfiltrate sensitive data or maintain persistence. However, this detection does NOT confirm intent or the success of the attack on its own, as legitimate proxy use may also trigger the alert.

  ### Investigation Steps

  - **Review process creation logs:** For Windows systems, check Security Event ID 4688 and Sysmon Event ID 1 for instances of `3proxy.exe` execution. Note the CommandLine field for abnormal or suspicious parameters resembling `-i127.0.0.1 -p`, commonly associated with C2 setups.

  - **Validate system purpose and role:** Determine if the host is expected to run proxy services. Authorized administrative machines may utilize proxies for legitimate purposes, while endpoints like user workstations should generally not.

  - **Analyze network traffic:** Inspect outbound traffic for unusual patterns, especially if associated with the execution of `3proxy.exe`. Look for connections on non-standard ports or to unrecognized external IP addresses, which could indicate C2 communication.

  - **Correlate user behavior:** Investigate the user account that executed the proxy. Look at recent activities via Windows Event Logs (Event ID 4624) to confirm whether the user typically performs administrative tasks justifying proxy use or if the execution deviates from expected behavior.

  - **Check for presence of hooks or persistence mechanisms:** Investigate the registry (e.g., `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run`) for any abnormal entries related to `3proxy`.

  - **Identify known benign applications:** If the telemetry shows another application is using a proxy for legitimate reasons (e.g., a web crawler), document this finding to distinguish between malicious and benign usage.

  ### Prioritization

  Severity is high as the presence of 3proxy can indicate potential malicious activity, especially if discovered on sensitive or critical assets like servers. The likelihood of malicious abuse is significant, given the tool’s association with network obfuscation and C2. This behavior is not typical in enterprise environments, making its detection critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logs or the use of evasion tactics such as renaming the executable or disguising it within legitimate software. Accurate detection relies on proper logging configurations for process monitoring to avoid missed alerts. Legitimate administrative activity may occasionally trigger this alert, such as network troubleshooting or proxy testing. A related detection to consider is monitoring for unusual command-line parameters in process creations, as they may provide additional context to potential malicious activity.

