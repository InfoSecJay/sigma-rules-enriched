note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of 3proxy, a lightweight proxy server commonly used for establishing network connections. The detection targets the use of 3proxy as it can be leveraged by threat actors to create a covert channel for command and control (C2) communications, exfiltrate data, or facilitate lateral movement within a network. Attackers may utilize such proxy tools to obfuscate their activities and hide their command and control infrastructure from security monitoring tools.

  The primary MITRE ATT&CK tactics relevant to this rule include **Command and Control (TA0011)** and specifically the technique **Application Layer Protocol (T1572)**, where adversaries use application layer protocols to communicate with compromised systems. The rule primarily collects data from Windows process creation events, which can reveal information about executed binaries and their command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by examining process creation logs for instances of `3proxy.exe` or related executables. Pay attention to the command-line arguments that were used during execution.

  - **Analyze Network Traffic**: Inspect outbound network traffic from the host running 3proxy for unusual connection patterns or connections to suspicious external IP addresses, indicating potential C2 communication.

  - **Check for Anomalous User Behavior**: Investigate the user account associated with the execution of 3proxy for any signs of compromise or unusual behavior, such as accessing sensitive resources or executing unusual commands.

  - **Correlate with Other Security Alerts**: Look for other alerts that may indicate a broader compromise, including suspicious file accesses or lateral movement patterns that could indicate the presence of additional tools or malware.

  ### Prioritization
  This alert is prioritized as high severity due to the potential for 3proxy to facilitate command and control communications, allowing attackers to maintain persistence and further exploit breaches within the environment. The presence of such a proxy could significantly increase the risk of data exfiltration and lateral movement.

  ### Blind Spots and Assumptions
  The detection rule may miss instances of 3proxy run with altered file names or as part of a non-standard process, leading to gaps in visibility. Additionally, it assumes that proper process creation logging is enabled and that no security controls are interfering with process visibility. To function effectively, all relevant logging configurations should be verified, ensuring that data is captured from the correct sources and that there are no filters or exclusions in place that would omit crucial logs.

