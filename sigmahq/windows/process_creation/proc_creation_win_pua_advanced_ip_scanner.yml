note: |
  ### Technical Context

  This Sigma rule detects the execution of Advanced IP Scanner, a tool often utilized by adversaries for network discovery. The attacker’s objective likely involves mapping out the network to identify vulnerable systems before executing further attacks, such as ransomware deployments. This behavior corresponds with the MITRE ATT&CK tactics of Discovery (ID: T1046) and Network Service Discovery (ID: T1135).

  The primary telemetry source required for detection is Windows process creation logs, particularly focusing on Event ID 4688. If exploited by an unauthorized user, the impact could include reconnaissance activities leading to potential data breaches or ransomware attacks. It is important to note that this detection does NOT confirm malicious intent on its own, as the tool can also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check process creation logs for Advanced IP Scanner use:** Review Security Event ID 4688 entries for processes with Image containing 'advanced_ip_scanner' or OriginalFileName containing 'advanced_ip_scanner'. Look for unusual timing or execution by non-administrative accounts as indicators of potential misuse.

  - **Analyze command-line arguments for anomalies:** Identify command-line parameters used during execution. Look for flags like '/portable' or '/lng' which may indicate non-standard usage consistent with malicious workflows. Unexpected parameters may raise suspicion.

  - **Validate the host environment for legitimate use:** Determine if the system is designated for administrative tasks where this tool may be authorized (e.g., network management servers). In such cases, cross-reference with an asset inventory.

  - **Correlate with network traffic analysis:** Inspect network traffic logs for unusual scanning activities originating from the host running Advanced IP Scanner, such as high volumes of ICMP requests or TCP SYN packets. A surge in this activity can indicate adversarial tactics.

  - **Examine related telemetry for indicators of compromise:** Review Sysmon Event ID 1 for process creations that may occur in conjunction with Advanced IP Scanner. Investigate associated processes for suspicious behavior, including payload delivery methods.

  ### Prioritization

  This alert is of medium severity, as the detection involves a tool common among attackers for reconnaissance. The likelihood of malicious use is significant given the known association of Advanced IP Scanner with ransomware groups. Although many organizations may leverage this tool legitimately, understanding the context is crucial.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the presence of legitimate administrative activities that trigger similar logs. Essential log sources include detailed process creation logs and potential integration with network monitoring solutions to capture scanning behavior. Scenarios, such as a legitimate network audit, may also generate similar alerts. To strengthen detection coverage, monitoring for additional tools commonly used by adversaries for network enumeration, such as Nmap or Angry IP Scanner, should be implemented.

