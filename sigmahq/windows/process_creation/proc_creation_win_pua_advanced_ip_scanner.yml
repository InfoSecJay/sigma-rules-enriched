note: |
  ### Technical Context
  This rule detects the execution of the Advanced IP Scanner tool on Windows systems. Advanced IP Scanner is often used for network reconnaissance, allowing attackers to identify active devices on a network, and is particularly noted for its association with ransomware groups. The execution of this tool could indicate malicious activity aimed at mapping network resources or exploiting vulnerable systems within an organization, suggesting a potential precursor to broader ransomware attacks.

  Relevant MITRE ATT&CK tactics and techniques include **Reconnaissance (TA0043)** and **Network Service Scanning (T1046)**, along with **Network Sniffing (T1135)** which highlights the exploitation of network services and scanning behaviors for the purposes of targeting vulnerable systems. The best evidence for this rule comes from Windows process creation events, which can provide insights into potential unauthorized usage of such tools within the environment.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for instances of "advanced_ip_scanner" or related executables, and note the timestamps, originating user accounts, and associated parent processes.
  - **Analyze Network Traffic:** Inspect network traffic for any unusual connections initiated by the Advanced IP Scanner, focusing on any unexpected external communications or lateral movement within the enterprise.
  - **Evaluate User Behavior:** Assess user account activity to identify if the tool was executed under a legitimate administrative context or if there are signs of compromised accounts.
  - **Check for Related Tools:** Search for other indicators of reconnaissance or lateral movement activities, such as the use of other scanning tools or unexpected usage of administrative commands.

  ### Prioritization
  The alert is of medium severity due to the potential for misuse of Advanced IP Scanner by threat actors as part of their reconnaissance to facilitate ransomware attacks. While its benign use by administrators exists, the tool's association with malicious activity mandates prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where the tool is masquerading with a different name or if it's executed from a less monitored environment, such as within a virtualized container. Additionally, it assumes that logs for process creation are fully enabled and unfiltered, which may not always be the case in all environments. Proper log collection and configuration settings must be validated to ensure effective detection of this and similar tools.

