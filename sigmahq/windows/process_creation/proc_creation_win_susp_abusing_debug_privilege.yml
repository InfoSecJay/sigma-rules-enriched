title: Abused Debug Privilege by Arbitrary Parent Processes
id: d522eca2-2973-4391-a3e0-ef0374321dae
status: test
description: Detection of unusual child processes by different system processes
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-74-638.jpg
author: 'Semanur Guneysu @semanurtg, oscd.community'
date: 2020-10-28
modified: 2022-11-11
tags:
- attack.privilege-escalation
- attack.t1548
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - '\winlogon.exe'
    - '\services.exe'
    - '\lsass.exe'
    - '\csrss.exe'
    - '\smss.exe'
    - '\wininit.exe'
    - '\spoolsv.exe'
    - '\searchindexer.exe'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'Cmd.Exe'
  filter:
    CommandLine|contains|all:
    - ' route '
    - ' ADD '
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_abusing_debug_privilege/info.yml
note: |
  ### Technical Context

  This Sigma rule detects instances where common system processes (e.g., `winlogon.exe`, `services.exe`, etc.) are spawning unusual child processes (e.g., `powershell.exe`, `cmd.exe`) with commands containing "route ADD". This behavior may indicate an attacker executing network manipulation or establishing persistence through privilege escalation methods.

  The relevant MITRE ATT&CK techniques are T1548 (Abuse Elevation Control Mechanism) and T1068 (Exploitation of Elevation Control Mechanism). Primary telemetry sources include Windows Process Creation logs (Event ID 4688) and Sysmon logs (Event ID 1) to capture the parent-child process relationships. If malicious, this activity can lead to unauthorized network configuration changes or exploitation of elevated privileges for nefarious tasks. It is important to note that this detection alone does not confirm whether the activity is malicious—it must be correlated with further context and indicators.

  ### Investigation Steps

  - **Review Process Creation Events:** Investigate Windows Event ID 4688 logs for parent process IDs associated with `winlogon.exe`, `services.exe`, or `lsass.exe` spawning child processes like `powershell.exe` or `cmd.exe`. Check for unusual parent-child relationships.

  - **Analyze Command Line Arguments:** Identify command lines containing "route ADD" in Event ID 4688 or Sysmon Event ID 1. Legitimate activity typically does not involve these commands being run by system processes, especially with unusual parent contexts.

  - **Identify User Account Activity:** Check the user account associated with the suspicious process to determine if it is a standard user or a service account. A standard user executing these commands could indicate potential malicious intent.

  - **Cross-Reference with Network Logs:** Review network-related logs (e.g., firewall logs) to trace any related network activity (e.g., unauthorized routing changes) following the identified process creation. Look for anomalies in traffic patterns or destinations that correlate with the time of the alert.

  - **Examine File System Changes:** Look for file creation or modification events that occurred at the same timestamp as the suspicious process (Sysmon Event ID 11 can be useful here). Verify any changes made to the system that could be linked to privilege escalation activities.

  ### Prioritization

  This alert should be considered high priority due to its association with privilege escalation tactics commonly used in attacks. If confirmed malicious, the impact on the affected system could lead to significant security breaches. Moreover, setting up processes like `cmd.exe` and `powershell.exe` via trusted system processes is a known tactic employed by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary process logging or if process creations are evaded through rapid execution or obfuscation techniques. False positives could arise from legitimate administrative activities that involve network configuration changes. A companion detection highlighting anomalous child process creation could further strengthen coverage, such as monitoring for the use of reflective DLL injection (MITRE T1484).

