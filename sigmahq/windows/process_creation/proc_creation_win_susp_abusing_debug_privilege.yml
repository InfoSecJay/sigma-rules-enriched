title: Abused Debug Privilege by Arbitrary Parent Processes
id: d522eca2-2973-4391-a3e0-ef0374321dae
status: test
description: Detection of unusual child processes by different system processes
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-74-638.jpg
author: 'Semanur Guneysu @semanurtg, oscd.community'
date: 2020-10-28
modified: 2022-11-11
tags:
- attack.privilege-escalation
- attack.t1548
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - '\winlogon.exe'
    - '\services.exe'
    - '\lsass.exe'
    - '\csrss.exe'
    - '\smss.exe'
    - '\wininit.exe'
    - '\spoolsv.exe'
    - '\searchindexer.exe'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'Cmd.Exe'
  filter:
    CommandLine|contains|all:
    - ' route '
    - ' ADD '
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious process creation behavior where privileged system processes (e.g., `winlogon.exe`, `lsass.exe`) spawn child processes that include command-line arguments associated with network routing operations (specifically, “route ADD”). This behavior may indicate an attacker attempting to leverage elevated privileges for malicious networking activities, such as creating persistent access through routing modifications.

  The relevant MITRE ATT&CK techniques are **Privilege Escalation** (T1548) and **Remote Services** (T1021). The primary telemetry source is process creation logs from Windows, particularly **Security Event ID 4688** and **Sysmon Event ID 1**. If this behavior is confirmed as malicious, it could allow the adversary to establish additional network routes to exfiltrate data or maintain access post-compromise.

  It's important to note that this detection does **not confirm** malicious activity on its own; additional context regarding the legitimacy of the parent process and overall environment must be evaluated.

  ### Investigation Steps

  - **Verify parent processes: ** Check the parent process for the alerting child process. Look for Security Event ID 4688 or Sysmon Event ID 1 to identify if it was initiated by legitimate system processes like `winlogon.exe` or `lsass.exe`. Legitimate activity is likely to come from known processes without malware associations.

  - **Analyze command-line arguments: ** Review the command-line arguments of the detected child process. Analyzing `CommandLine` fields should show arguments like “route ADD,” which are suspicious in this context for processes like `powershell.exe` or `cmd.exe`. Legitimate usage often does not include these parameters in secure configurations.

  - **Check process execution timeline: ** Review the execution timeline of both the parent and child processes using Sysinternals tools (e.g., Process Explorer) to identify any unusual execution patterns that may suggest malicious intent. Ensure the timestamps align with user activity.

  - **Consult endpoint protection logs: ** Review EDR/Malware Protection solutions for any recorded threats or anomalies from the parent or child processes during the time of detection. Look for known signatures or patterns matching the detected processes.

  - **Identify additional network configurations: ** If a suspicious network route creation is confirmed, audit the system's network configuration via `route print` command to assess if there are unauthorized routes that could indicate persistence mechanisms or exfiltration paths.

  ### Prioritization

  This alert is categorized as **high severity** due to the potential for system compromise through privilege escalation, which can facilitate further malicious activity within an enterprise environment. The behavior detected is uncommon and often associated with targeted attacks, making it a significant concern.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use legitimate tools or processes to create child processes or employ alternate means to evade detection, such as process hollowing. It requires comprehensive telemetry, including Sysmon and Security event logs, configured to capture process creation activities effectively. Legitimate administrative tasks using the command line may trigger alerts, especially during network configurations or troubleshooting. A related detection is enhanced visibility on command-line auditing to catch potentially malicious commands across privileges.

