title: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
id: b6e04788-29e1-4557-bb14-77f761848ab8
status: test
description: Detects potentially suspicious file downloads from file sharing domains
  using PowerShell.exe
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
- https://github.com/WithSecureLabs/iocs/blob/344203de742bb7e68bd56618f66d34be95a9f9fc/FIN7VEEAM/iocs.csv
- https://www.microsoft.com/en-us/security/blog/2024/01/17/new-ttps-observed-in-mint-sandstorm-campaign-targeting-high-profile-individuals-at-universities-and-research-orgs/
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-23
modified: 2024-12-10
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_websites:
    CommandLine|contains:
            # Note: You might want to baseline the github domain before including it
            # - '.githubusercontent.com'       # Includes both gists and github repositories / Michael Haag (idea).
    - 'anonfiles.com'
    - 'cdn.discordapp.com'
    - 'ddns.net'
    - 'dl.dropboxusercontent.com'
    - 'ghostbin.co'
            # - 'github.com'  See note above
    - 'glitch.me'
    - 'gofile.io'
    - 'hastebin.com'
    - 'mediafire.com'
    - 'mega.nz'
    - 'onrender.com'
    - 'pages.dev'
    - 'paste.ee'
    - 'pastebin.com'
    - 'pastebin.pl'
    - 'pastetext.net'
    - 'pixeldrain.com'
    - 'privatlab.com'
    - 'privatlab.net'
    - 'send.exploit.in'
    - 'sendspace.com'
    - 'storage.googleapis.com'
    - 'storjshare.io'
    - 'supabase.co'
    - 'temp.sh'
    - 'transfer.sh'
    - 'trycloudflare.com'
    - 'ufile.io'
    - 'w3spaces.com'
    - 'workers.dev'
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'wget '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious file downloads initiated through PowerShell.exe, specifically targeting various file-sharing domains. Attackers often leverage PowerShell as a powerful tool for executing commands, scripting, and downloading files from external sources. By downloading files from recognized file-sharing websites, adversaries can obtain malicious payloads or tools that can facilitate further exploitation within the target environment. Such behavior is typical in attack scenarios where threat actors seek to maintain persistence, extract data, or launch additional attacks after initial compromise.

  This activity is associated with tactics such as **Execution** (TA0002), wherein attackers execute commands through PowerShell to perform actions like file downloads. Additionally, techniques like **Command-Line Interface** (T1059.001) and **Data from Network Shared Drive** (T1039) could be relevant as it often involves either direct command execution or file retrieval from compromised or accessed shares. Primary data sources for monitoring this activity include **process creation events** that track the usage of PowerShell and command line parameters, as well as **network logs** that can reveal connections to known suspicious domains.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for instances of PowerShell.exe or pwsh.exe alongside their command-line arguments. Look for unusual patterns or parameters that indicate file download attempts.

  - **Examine Network Traffic**: Inspect network logs for connections to identified file-sharing domains. Cross-reference these findings with the process creation events to establish a correlation between the PowerShell activity and network requests.

  - **Assess Downloaded Files**: If file downloads are confirmed, gather the files from the endpoint in question and perform a malware analysis. This could reveal whether the downloaded content contains malicious payloads that facilitate further compromise or exfiltration.

  - **Correlate with Threat Intelligence**: Use threat intelligence resources and provided IOAs to verify if the detected activity aligns with known malicious patterns associated with specific threat groups or campaigns, such as those by FIN7.

  ### Prioritization
  The high severity of this alert is warranted due to the potential implications of executing command-line downloads from suspicious domains. Such behavior could indicate a significant breach involving malicious activities that may jeopardize the confidentiality, integrity, and availability of enterprise systems.

  ### Blind Spots and Assumptions
  A potential gap in coverage exists if PowerShell is executed without the standard logging mechanisms in place or if command-line arguments are obfuscated. Additionally, the detection logic assumes that downloads are made exclusively through PowerShell, which may not capture activities using other tools or methods. Required logs include those from process creation and network connections to ensure complete visibility and contextual analysis of the PowerShell downloads.

