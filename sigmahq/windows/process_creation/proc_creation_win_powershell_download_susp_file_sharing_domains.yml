detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_websites:
    CommandLine|contains:
            # Note: You might want to baseline the github domain before including it
            # - '.githubusercontent.com'       # Includes both gists and github repositories / Michael Haag (idea).
    - 'anonfiles.com'
    - 'cdn.discordapp.com'
    - 'ddns.net'
    - 'dl.dropboxusercontent.com'
    - 'ghostbin.co'
            # - 'github.com'  See note above
    - 'glitch.me'
    - 'gofile.io'
    - 'hastebin.com'
    - 'mediafire.com'
    - 'mega.nz'
    - 'onrender.com'
    - 'pages.dev'
    - 'paste.ee'
    - 'pastebin.com'
    - 'pastebin.pl'
    - 'pastetext.net'
    - 'pixeldrain.com'
    - 'privatlab.com'
    - 'privatlab.net'
    - 'send.exploit.in'
    - 'sendspace.com'
    - 'storage.googleapis.com'
    - 'storjshare.io'
    - 'supabase.co'
    - 'temp.sh'
    - 'transfer.sh'
    - 'trycloudflare.com'
    - 'ufile.io'
    - 'w3spaces.com'
    - 'workers.dev'
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'wget '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that download files from potentially suspicious file-sharing domains. Such behavior often indicates an adversary's attempt to exfiltrate sensitive information or download malicious payloads. The attacker likely aims to deploy malware or establish a foothold within the network using these downloaded files.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and techniques such as **Command and Scripting Interpreter** (T1059) and **PowerShell** (T1059.001). Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon log (Event ID 1) capturing command-line details of PowerShell executions. If malicious, this behavior can lead to further compromise of the target system and facilitate unauthorized access to sensitive data.

  It's important to note that the detection of this command does NOT confirm that the downloaded file is malicious by itself. Further investigation into the context and consequences of the file retrieved is necessary.

  ### Investigation Steps

  - **Examine Process Creation Logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1. Look for processes invoking `powershell.exe` or `pwsh.exe` along with command lines containing `.DownloadString(` or `.DownloadFile(`. If the command line includes known benign domains (e.g., organizational repositories), it may be legitimate.

  - **Identify Command Line Patterns:** Check for commands that utilize `Invoke-WebRequest`, `wget`, or direct calls to known suspicious domains (e.g., `pastebin.com`, `mediafire.com`). Ensure that the context and user running the command are legitimate; execute commands may include unusual user accounts or run under SYSTEM with no clear justification.

  - **Correlate Download Locations:** Investigate the destination path of the downloaded files. Look for anomalous or temporary directories (e.g., `C:\Users\<username>\AppData\Local\Temp`). Legitimate downloads typically populate standard directories or known project locations.

  - **Assess File Characteristics:** If a suspicious download is identified, analyze the file's hash (MD5/SHA256) against threat intelligence sources. Ensure to validate if the file has been reported as malicious before taking action, checking community-reported sources.

  - **Monitor for Subsequent Activity:** Look for additional suspicious activity post-download, such as unexpected process creations or communications outbound from the affected system, which might elucidate whether the download led to malicious execution.

  - **Review Asset Criticality:** Depending on the host role, determine the severity of the alert. If the affected host is a critical server (e.g., domain controller, database server), prioritize further investigation aggressively compared to a less critical workstation.

  ### Prioritization

  This alert is of **high severity** due to the potential impact on compromised systems and the likelihood of malicious use of PowerShell for downloading files. Given that PowerShell is commonly weaponized in attacks, it warrants immediate investigation, especially if executed from high-privilege accounts.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of base64-encoded PowerShell commands or encoding techniques to obfuscate malicious activity. The detection relies on accurate logging from Event ID 4688 and Sysmon; without Sysmon, PowerShell activity may go unnoticed. Legitimate activities, such as automated internal scripts or IT operations, might trigger this alert, necessitating fallback on baselined command usage. A companion detection could involve monitoring for unusual outbound connection attempts to the captured URLs, enhancing the analysis of exfiltration attempts.

