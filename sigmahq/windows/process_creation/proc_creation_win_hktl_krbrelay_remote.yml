title: HackTool - RemoteKrbRelay Execution
id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
status: test
description: |
  Detects the use of RemoteKrbRelay, a Kerberos relaying tool via CommandLine flags and PE metadata.
references:
- https://github.com/CICADA8-Research/RemoteKrbRelay
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-27
tags:
- attack.credential-access
- attack.t1558.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\RemoteKrbRelay.exe'
  - OriginalFileName: 'RemoteKrbRelay.exe'
  selection_cli_required:
    CommandLine|contains|all:
    - ' -clsid '
    - ' -target '
    - ' -victim '
    # selection_cli_attacks:
    #     # Note: In the current implementation these flags do not require any other flags. Which means they can't be used on their own. They're already covered by "selection_cli_required"
    #     CommandLine|contains:
    #         - '-adcs ' # relay to HTTP Web Enrollment and get certificate
    #         - '-laps ' # relay to LDAP and extract LAPS passwords
    #         - '-ldapwhoami ' # relay to LDAP and get info about relayed user
    #         - '-shadowcred ' # relay to LDAP and setup Shadow Credentials
  selection_cli_attack_smb:
    CommandLine|contains|all:
    - '-smb '         # relay to SMB
    - '--smbkeyword '
    CommandLine|contains:
    - 'interactive'
    - 'secrets'
    - 'service-add'
  selection_cli_attack_rbcd_main:
    CommandLine|contains: '-rbcd '     # relay to LDAP and setup RBCD
  selection_cli_attack_rbcd_options:
    CommandLine|contains:
    - '-cn '         # Computer name that will be written to msDs-AllowedToActOnBehalfOfOtherIdentity
    - '--computername '         # Computer name that will be written to msDs-AllowedToActOnBehalfOfOtherIdentity
  selection_cli_attack_changepass:
    CommandLine|contains: '-chp '     # relay to LDAP and change user password
    CommandLine|contains|all:
    - '-chpPass '         # new password
    - '-chpUser '         # the name of the user whose password you want to change
  selection_cli_attack_addgrpname:
    CommandLine|contains|all:
    - '-addgroupmember '         # relay to LDAP and add user to group
    - '-group '
    - '-groupuser '
  condition: selection_img or selection_cli_required or all of selection_cli_attack_rbcd_*
    or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of RemoteKrbRelay, a tool used for conducting Kerberos relaying attacks in Windows environments. It identifies specific command-line parameters associated with the tool, which may indicate an attacker attempting to leverage Kerberos services for credential theft or unauthorized access. The suspected threat involves adversaries who seek to escalate their privileges and move laterally across the network by exploiting the Kerberos authentication protocol.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Credential Access (T1558)**: This encompasses techniques used by threat actors to steal credentials.
  - **T1558.003**: Specifically focuses on Kerberos ticket manipulation techniques, such as relaying, which this detection rule aims to identify.

  Primary data sources that will yield the best evidence for this detection include Windows process creation events, particularly logs that track the execution of the RemoteKrbRelay.exe image and associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the Windows process creation logs for instances where `RemoteKrbRelay.exe` was executed, paying close attention to the command line used. Look for expected parameters indicating malicious intent.

  - **Examine Command-Line Parameters**: Investigate the specific command-line flags used with RemoteKrbRelay. Focus on those that reference relaying SMB or LDAP, as these are key indicators of the tool's exploitative capabilities.

  - **Correlate with User Activity**: Contextualize the execution of this tool by assessing recent user activity and permission changes. Unusual patterns, such as unexpected user logins or privilege escalations, could suggest an ongoing attack.

  - **Check Endpoint Security Alerts**: Cross-reference any alerts generated by EDR or AV solutions that may have flagged the execution of RemoteKrbRelay or related suspicious behavior within your environment.

  ### Prioritization
  The alert is classified as high severity because the execution of RemoteKrbRelay poses significant risks to enterprise security. Its capability to harvest credentials and facilitate lateral movement can lead to extensive network compromise if not addressed promptly.

  ### Blind Spots and Assumptions
  The detection logic may face gaps in scenarios where RemoteKrbRelay is executed in a perfectly legitimate context, such as testing environments or when used by admins for legitimate purposes, potentially leading to false positives. It assumes that command-line arguments are not obfuscated or altered in a way that circumvents detection. Reliable process creation logs must be enabled, and the tooling must be adequately configured to capture all relevant details for the alert to function effectively.

