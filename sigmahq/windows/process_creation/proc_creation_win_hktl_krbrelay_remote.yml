title: HackTool - RemoteKrbRelay Execution
id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
status: test
description: |
  Detects the use of RemoteKrbRelay, a Kerberos relaying tool via CommandLine flags and PE metadata.
references:
- https://github.com/CICADA8-Research/RemoteKrbRelay
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-27
tags:
- attack.credential-access
- attack.t1558.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\RemoteKrbRelay.exe'
  - OriginalFileName: 'RemoteKrbRelay.exe'
  selection_cli_required:
    CommandLine|contains|all:
    - ' -clsid '
    - ' -target '
    - ' -victim '
    # selection_cli_attacks:
    #     # Note: In the current implementation these flags do not require any other flags. Which means they can't be used on their own. They're already covered by "selection_cli_required"
    #     CommandLine|contains:
    #         - '-adcs ' # relay to HTTP Web Enrollment and get certificate
    #         - '-laps ' # relay to LDAP and extract LAPS passwords
    #         - '-ldapwhoami ' # relay to LDAP and get info about relayed user
    #         - '-shadowcred ' # relay to LDAP and setup Shadow Credentials
  selection_cli_attack_smb:
    CommandLine|contains|all:
    - '-smb '         # relay to SMB
    - '--smbkeyword '
    CommandLine|contains:
    - 'interactive'
    - 'secrets'
    - 'service-add'
  selection_cli_attack_rbcd_main:
    CommandLine|contains: '-rbcd '     # relay to LDAP and setup RBCD
  selection_cli_attack_rbcd_options:
    CommandLine|contains:
    - '-cn '         # Computer name that will be written to msDs-AllowedToActOnBehalfOfOtherIdentity
    - '--computername '         # Computer name that will be written to msDs-AllowedToActOnBehalfOfOtherIdentity
  selection_cli_attack_changepass:
    CommandLine|contains: '-chp '     # relay to LDAP and change user password
    CommandLine|contains|all:
    - '-chpPass '         # new password
    - '-chpUser '         # the name of the user whose password you want to change
  selection_cli_attack_addgrpname:
    CommandLine|contains|all:
    - '-addgroupmember '         # relay to LDAP and add user to group
    - '-group '
    - '-groupuser '
  condition: selection_img or selection_cli_required or all of 
    selection_cli_attack_rbcd_* or selection_cli_attack_changepass or 
    selection_cli_attack_addgrpname or selection_cli_attack_smb
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of RemoteKrbRelay, a tool leveraged in Kerberos credential relaying attacks. The primary objective of an attacker using RemoteKrbRelay is to manipulate Kerberos authentication to obtain or relay credentials, often leading to unauthorized access to resources. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and technique T1558.003 (Credential Dumping: Kerberos Ticket relaying).

  The primary telemetry source for detection is Windows process creation logs, specifically focusing on Event ID 4688, which records detailed command line arguments and executable metadata (such as the original file name and image path). If confirmed malicious, this activity may result in privilege escalation, lateral movement, or access to sensitive data. It's crucial to clarify that while this detection raises an alert, it does not confirm successful credential theft or lateral movement on its own; further investigation is required.

  ### Investigation Steps

  - **Validate process execution:**
     Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs to confirm the execution of `RemoteKrbRelay.exe`. Look for the process creation with command line arguments containing `-clsid`, `-target`, and `-victim`.

  - **Identify command line arguments:**
     Analyze the command line parameters for suspicious flags. Specifically, flags like `-smb`, `-chp`, and `-addgroupmember` indicate potentially malicious behavior, especially if targeting sensitive accounts or groups.

  - **Examine parent processes:**
     Identify the parent process of the `RemoteKrbRelay.exe` execution. A legitimate process might be a system tool or known administration tool; if initiated from unusual or non-administrative processes, this raises suspicion.

  - **Check for unusual service behavior:**
     Verify if the alert coincides with changes in service accounts or group memberships that could be linked to malicious activities. Cross-reference against administrative logs for expected changes.

  - **Review related events:**
     Look into other logs for early signs of adversarial activity, such as failed login attempts (Event ID 4625) that could indicate prior reconnaissance or exploitation attempts.

  ### Prioritization

  This alert should be treated with high severity due to the immediate risk of credential exploitation and the potential for significant lateral movement within the environment. The affected systems could be critical servers or services, making this behavior particularly alarming, as tools like RemoteKrbRelay are commonly weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if systems lack sufficient logging configuration or if `RemoteKrbRelay.exe` is renamed or executed from abnormal paths, facilitating evasion tactics. Legitimate administrative tasks might trigger the alert if they involve the same command line parameters, such as legitimate service management or troubleshooting sessions. Companion detections, such as alerts for suspicious LDAP queries or other credential dumping techniques (e.g., T1558.002), could enhance visibility and context around potential attacks.

