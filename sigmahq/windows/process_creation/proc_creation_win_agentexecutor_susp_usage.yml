title: Suspicious AgentExecutor PowerShell Execution
id: c0b40568-b1e9-4b03-8d6c-b096da6da9ab
related:
- id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
  type: similar
status: test
description: Detects execution of the AgentExecutor.exe binary. Which can be 
  abused as a LOLBIN to execute powershell scripts with the ExecutionPolicy 
  "Bypass" or any binary named "powershell.exe" located in the path provided by 
  6th positional argument
author: Nasreddine Bencherchali (Nextron Systems), memory-shards
references:
- https://twitter.com/lefterispan/status/1286259016436514816
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
- https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
- https://twitter.com/jseerden/status/1247985304667066373/photo/1
date: 2022-12-24
modified: 2024-08-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_pwsh:
    CommandLine|contains:
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `AgentExecutor.exe` binary, which is commonly abused for executing PowerShell scripts with the "Bypass" execution policy. The primary objective of an attacker using this technique is to execute malicious scripts while evading detection mechanisms that monitor standard PowerShell invocations. This behavior aligns with the MITRE ATT&CK technique T1218 (System Binary Proxy Execution).

  The primary telemetry source is process creation logs on Windows systems, specifically focusing on `Event ID 4688` (process creation) which captures command-line arguments and parent process information. If malicious, the execution of this binary could indicate an attempt to run unapproved scripts, potentially leading to system compromise. Importantly, this detection does not confirm malicious intent without additional context; legitimate use of `AgentExecutor.exe` in managed environments exists, particularly in automated deployment scenarios.

  ### Investigation Steps

  - **Review security event logs**: Inspect Windows Security Event ID 4688 for instances of `AgentExecutor.exe` execution, noting any anomalous command line arguments such as `-powershell` or `-remediationScript`.

  - **Identify suspicious parent processes**: Check the `ParentImage` field in the Event logs to see if `AgentExecutor.exe` was spawned by any non-standard processes. Legitimate executions are typically initiated by trusted applications like `IntuneWindowsAgent.exe`.

  - **Analyze command line arguments**: Specifically look for command line entries that contain `-executionPolicy bypass`. Command lines that leverage this flag might indicate an attempt to evade execution policy restrictions, a common trait of malicious activity.

  - **Evaluate the context of execution**: Confirm the execution time against standard operational activity. Legitimate usage patterns usually align with IT administration tasks, while out-of-hours usage may suggest malicious activity.

  - **Correlate with endpoint telemetry**: Use EDR telemetry to check the processes running at the same time as `AgentExecutor.exe`, noting any associated files created or modified in directories commonly used by malware.

  - **Monitor for lateral movement indicators**: If the execution was not initiated from a management console, search for subsequent network connections or file shares accessed using this binary, which could indicate an attempt to establish a foothold or pivot within the network.

  ### Prioritization

  This alert carries high severity because `AgentExecutor.exe` is often manipulated by adversaries to bypass security controls and execute malicious payloads. The potential impact on enterprise systems is significant, especially if it leads to further compromise or lateral movement within the network. While not all executions are malicious, the high confidence in risks associated with this behavior necessitates immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations do not capture all pertinent process creation events or if `AgentExecutor.exe` is used by legitimate applications without proper monitoring. Evasion techniques may include renaming the binary or using alternate execution methods that do not involve `AgentExecutor.exe`. Additionally, legitimate usage exists in environments managed by configuration tools like Intune, which may generate false positives. A related detection rule for monitoring PowerShell script execution directly (e.g., `CmdLet` execution) can enhance coverage and context for investigations.

