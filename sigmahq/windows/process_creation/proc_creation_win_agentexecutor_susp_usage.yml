title: Suspicious AgentExecutor PowerShell Execution
id: c0b40568-b1e9-4b03-8d6c-b096da6da9ab
related:
- id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
  type: similar
status: test
description: Detects execution of the AgentExecutor.exe binary. Which can be 
  abused as a LOLBIN to execute powershell scripts with the ExecutionPolicy 
  "Bypass" or any binary named "powershell.exe" located in the path provided by 
  6th positional argument
author: Nasreddine Bencherchali (Nextron Systems), memory-shards
references:
- https://twitter.com/lefterispan/status/1286259016436514816
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
- https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
- https://twitter.com/jseerden/status/1247985304667066373/photo/1
date: 2022-12-24
modified: 2024-08-07
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_pwsh:
    CommandLine|contains:
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `AgentExecutor.exe` binary, which can be leveraged by attackers as a living-off-the-land binary (LOLBIN) to execute malicious PowerShell scripts with the execution policy set to "bypass." The likely attacker objective is to execute unauthorized scripts for various purposes, such as data exfiltration or deployment of additional malware. This behavior falls under the MITRE ATT&CK Tactic: Execution (TA0002) and Technique: PowerShell (T1059.001).

  The primary telemetry sources are Windows process creation logs, specifically focusing on log types such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to data breach or system compromise. However, it is important to note that this detection does NOT confirm malicious intent by itself, as the legitimate use of `AgentExecutor.exe` can occur within valid administrative contexts.

  ### Investigation Steps

  - **Review process creation logs:** Filter for Security Event ID 4688 and Sysmon Event ID 1 to identify instances of `AgentExecutor.exe` being run. Look specifically for command line invocations containing `-powershell` or `-remediationScript`.

  - **Examine command line arguments:** Analyze the full command line for relevant flags and paths. Legitimate PowerShell execution typically does not use the "bypass" execution policy, so if observed, it may indicate malicious intent.

  - **Check parent process details:** Investigate the ParentImage field in the logs to see if `AgentExecutor.exe` was spawned by a legitimate process (e.g., `C:\Windows\System32\Microsoft.Management.Services.IntuneWindowsAgent.exe`) or by potentially suspicious processes. Activity initiated by non-standard parent processes could indicate compromise.

  - **Look for anomalous PowerShell paths:** Confirm that the command line does not reference unauthorized PowerShell binaries. Legitimate executions typically do not specify PowerShell paths outside of default locations (e.g., should not contain uncommon directories).

  - **Validate network activity associated with execution:** Correlate the timestamp of `AgentExecutor.exe` executions with network artifact logs to identify any unusual outbound connections or data transfers that could indicate data exfiltration efforts.

  - **Document high-confidence malicious indicators:** Identify and escalate instances where command line parameters suggest the execution of potentially harmful scripts, especially when combined with bypass arguments, as they signify a deviation from expected behavior.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on sensitive systems and data. The execution of low-trust executables like `AgentExecutor.exe` is frequently abused in modern attack vectors, making this behavior relevant for threat actors looking to exploit enterprise environments.

  ### Blind Spots and Assumptions

  Detection using this rule may be limited if logging is not configured correctly, and certain processes may mask `AgentExecutor.exe` activity. Alternatives to DLL hijacking or credential dumping can also exist, which may bypass this detection. Legitimate administrative tools/operations may unintentionally trigger this alert, such as system management or automated scripts utilizing `AgentExecutor.exe`. As a companion detection, consider monitoring for unusual scripts executed in PowerShell combined with TTPs related to process injection or suspicious parent-child relationships for more nuanced coverage.

