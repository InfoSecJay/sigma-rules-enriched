title: Suspicious AgentExecutor PowerShell Execution
id: c0b40568-b1e9-4b03-8d6c-b096da6da9ab
related:
- id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
  type: similar
status: test
description: Detects execution of the AgentExecutor.exe binary. Which can be abused
  as a LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any
  binary named "powershell.exe" located in the path provided by 6th positional argument
author: Nasreddine Bencherchali (Nextron Systems), memory-shards
references:
- https://twitter.com/lefterispan/status/1286259016436514816
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
- https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
- https://twitter.com/jseerden/status/1247985304667066373/photo/1
date: 2022-12-24
modified: 2024-08-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_pwsh:
    CommandLine|contains:
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of `AgentExecutor.exe`, a binary that can be exploited as a Living Off The Land Binary (LOLBIN) to execute PowerShell scripts leveraging the "Bypass" execution policy. The likely objective of an attacker using this binary is to evade detection while executing potentially malicious scripts on a compromised system. This behavior aligns with the MITRE ATT&CK technique "Disguise Tools" (T1218), which demonstrates an adversary's capability to leverage legitimate tools for malicious purposes. Primary telemetry sources involved include Windows process creation logs (Event ID 4688) and Sysmon logs (Event ID 1) capturing process execution details. The potential security impact includes unauthorized script execution, which could lead to system compromise or data exfiltration. Importantly, the detection alone does not confirm malicious intent as legitimate administrative tasks may also invoke this binary.

  ---

  ### Investigation Steps

  - **Review the process creation details**: Check for Event ID 4688 or Sysmon Event ID 1 to confirm whether `AgentExecutor.exe` was invoked. Look for potential arguments like `-powershell` indicating PowerShell script execution.

  - **Analyze the command line arguments**: Identify if the command line includes `-powershell` followed by a script path. A high-confidence indicator of malicious behavior is the presence of a PowerShell script executed with the "Bypass" execution policy.

  - **Correlate with parent process information**: Determine the parent process of `AgentExecutor.exe`. An invocation from a suspicious process (e.g., `cmd.exe` or `powershell.exe`) rather than legitimate administrative tools could indicate malicious activity.

  - **Identify expected behavior**: Confirm if `AgentExecutor.exe` calls originate from legitimate sources such as `Microsoft.Management.Services.IntuneWindowsAgent.exe`. If these calls come from expected management tools, it may indicate benign activity.

  - **Validate network activity**: Check for outbound connections related to the execution, particularly looking for connections initiated after executing `AgentExecutor.exe` that may indicate data exfiltration or command and control (C2) communications.

  - **Cross-reference with other detections**: Investigate related alerts or logs from companion detections, such as those flagging unusual PowerShell usage (MITRE ATT&CK T1059.001) to provide additional context on potential malicious behavior.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems where `AgentExecutor.exe` is executed. Given the likelihood of malicious use in modern attacks leveraging LOLBINs, prompt investigation is essential. The behavior observed is often weaponized by attackers to conduct lateral movement or data exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all process executions, particularly on systems where enhanced logging is not enabled. Legitimate administrative tasks, especially involving Intune management, may trigger this alert without malicious intent. A related detection that strengthens coverage is monitoring for unusual PowerShell script executions, as this behavior often correlates with the execution of `AgentExecutor.exe`.

