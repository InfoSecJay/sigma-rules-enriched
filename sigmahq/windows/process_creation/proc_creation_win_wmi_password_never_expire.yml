title: Password Set to Never Expire via WMI
id: 7864a175-3654-4824-9f0d-f0da18ab27c0
status: experimental
description: |
  Detects the use of wmic.exe to modify user account settings and explicitly disable password expiration.
references:
- https://www.huntress.com/blog/the-unwanted-guest
author: "Daniel Koifman (KoifSec)"
date: 2025-07-30
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1047
- attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  wmic  useraccount where name='guest' set passwordexpires=false
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'useraccount'
    - ' set '
    - 'passwordexpires'
    - 'false'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context
  This rule detects the use of Windows Management Instrumentation Command-line (WMIC) to alter user account settings, specifically targeting the modification that disables password expiration for user accounts. By monitoring for `wmic.exe` commands indicating that an attacker has changed the password expiration policy, SOC analysts can identify potential privilege escalation or persistence mechanisms being employed by malicious actors.

  The threat scenario typically involves an attacker looking to maintain access to a compromised account without needing to reset passwords frequently. This behavior may suggest ongoing or planned malicious activity aimed at user accounts within an organization. Attackers may use this technique to establish more extended footholds in the environment, making it harder to detect their presence.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Persistence (TA0003)**: The attacker aims to establish a lasting presence.
  - **Privilege Escalation (TA0004)**: The modification of account settings can lead to elevated access privileges.
  - **Execution (TA0002)**: The command execution through WMIC indicates an attempt to execute commands on the system.

  Primary data sources for this detection include process creation events, specifically those related to WMIC command execution. These logs can reveal when changes are made to user account settings.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation events to identify instances of `wmic.exe`. Look for unusual user account modifications that could signify unauthorized changes.

  - **Analyze Command-Line Arguments**: Focus on command-line arguments in the WMIC execution logs, particularly looking for any use of `useraccount`, `set`, `passwordexpires`, and `false`. This will help pinpoint specific instances of password expiration settings being modified.

  - **Check Account Audit Logs**: Investigate user account activity logs to identify any changes made to account settings, especially for accounts that are typically inactive or unauthorized. Assess the context and validity of these changes.

  - **Correlate with User Behavior**: Analyze the context surrounding the detected execution of WMIC commands. Consider whether other suspicious activities were occurring concurrently in the environment that might indicate wider malicious behavior.

  ### Prioritization
  The alert is assigned a medium severity level due to the potential for significant impact if attackers compromise user accounts and maintain unauthorized access. While disabling password expiry is a legitimate administrative function, its misuse can indicate serious security risks that warrant prompt analysis.

  ### Blind Spots and Assumptions
  This detection rule may not cover legitimate administrative activities that also utilize WMIC for account management; therefore, there is a risk of false positives. The detection logic assumes that the command will always include the specified keywords and is executed with `wmic.exe`, potentially missing obfuscated command executions or use of alternative tools. Adequate logging configurations for process creation events must be in place for this detection mechanism to function effectively, along with monitoring capabilities for command-line activity.

