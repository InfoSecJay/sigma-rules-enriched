title: Password Set to Never Expire via WMI
id: 7864a175-3654-4824-9f0d-f0da18ab27c0
status: experimental
description: |
  Detects the use of wmic.exe to modify user account settings and explicitly disable password expiration.
references:
- https://www.huntress.com/blog/the-unwanted-guest
author: "Daniel Koifman (KoifSec)"
date: 2025-07-30
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1047
- attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  wmic  useraccount where name='guest' set passwordexpires=false
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'useraccount'
    - ' set '
    - 'passwordexpires'
    - 'false'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects the usage of `wmic.exe` to modify user account settings by disabling password expiration. Malicious actors may aim to set accounts to have passwords that never expire, thereby attempting to establish persistence and maintain unauthorized access. This behavior is associated with MITRE ATT&CK tactic "Persistence" (TA0003) and technique "Modify User Account" (T1098). The primary telemetry source is Windows process creation logs, specifically observing `Image` and `CommandLine` attributes. If exploited, this could allow adversaries to bypass credential rotation policies, increasing the risk of account compromise. However, this detection does not confirm malicious intent on its own, as it could also result from legitimate administrative actions.

  ### Investigation Steps

  - **Identify the command execution:** Review Security Event ID 4688 to confirm the command executed and ensure it matches the pattern targeting the user accounts where the command includes `useraccount` and `passwordexpires=false`.

  - **Check account modification history:** Query Active Directory logs for modifications on user accounts, focusing on attributes like `pwdLastSet` and `userAccountControl` to validate whether the intended account is set for non-expiration legitimately.

  - **Evaluate host activity:** Inspect Sysmon Event ID 1 for any recent execution of `wmic.exe` on critical assets, especially domain controllers or administrative workstations, which should primarily be limited to administrative personnel.

  - **Legitimate behavior analysis:** Document expected user account administration practices within your organization, comparing them against the alert. Note that actual IT maintenance will typically involve regular password expiration settings.

  - **Correlate with multi-factor authentication usage:** Identify if the affected accounts have multi-factor authentication (MFA) enabled. Accounts with MFA may be less likely to be exploited even if their passwords are set to never expire.

  ### Prioritization

  This alert has medium severity due to the potential impact on account security and the likelihood of misuse by adversaries looking to establish persistence. While disabling password expiration is a common administrative task, it also poses a risk when poorly managed or unauthorized.

  ### Blind Spots and Assumptions

  Detection may fail if logging levels are insufficient, particularly if `wmic.exe` usage is not logged adequately. This rule may be triggered by legitimate administrative activities, such as IT personnel adjusting user settings. Additionally, a related detection to consider is monitoring for the creation of user accounts with strong privileges, which can indicate lateral movement or account abuse.

