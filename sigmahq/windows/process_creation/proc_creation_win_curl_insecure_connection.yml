title: Insecure Transfer Via Curl.EXE
id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
status: test
description: Detects execution of "curl.exe" with the "--insecure" flag.
references:
- https://curl.se/docs/manpage.html
author: X__Junior (Nextron Systems)
date: 2023-06-30
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
  - CommandLine|re: '\s-k\s'
  - CommandLine|contains: '--insecure'
  condition: all of selection_*
falsepositives:
- Access to badly maintained internal or development systems
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_insecure_connection/info.yml
note: |
  ### Technical Context
  This detection rule identifies when `curl.exe` is executed with the `--insecure` flag, which allows connections to SSL sites without enforcing certificate validation. This practice is typically used by attackers to bypass secure connection checks and potentially exfiltrate data or download malicious payloads without raising alarms. The ability to connect to insecure endpoints can facilitate data breaches or external communications with Command and Control (C2) servers.

  The typical threat scenario involves an attacker leveraging `curl` to interact with services or resources that should be secured via SSL/TLS but are instead accessed without verification of the server's identity. This behavior might indicate reconnaissance or data exfiltration attempts. The relevant MITRE ATT&CK tactics include **Execution** (TA0002), as this highlights the execution of commands that could lead to further exploitation and lateral movement.

  Primary data sources relevant for this detection include **process creation logs**, which capture the execution of commands and their associated parameters, and can reveal any misuse of `curl.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look at the logs for instances of `curl.exe` execution, focusing on those that include the `--insecure` flag. Analyze associated command parameters for further context.
  - **Analyze Network Traffic**: Inspect outgoing network connections from the host where `curl.exe` was executed. Pay special attention to any connections to suspicious external servers that may indicate data exfiltration or C2 communications.
  - **Check for Contextual Indicators**: Investigate the environment for other tools or scripts that might be associated with insecure data transfer. This can include identifying any other known tools or unusual script executions immediate to the event.
  - **Validate User and System Context**: Determine which user executed the command and assess their permissions and legitimate use cases. Verify whether the execution originated from a known secure or expected context, like development environments or known system maintenance activities.

  ### Prioritization
  The alert has a medium severity level due to the potential risks associated with insecure data transfers and the likelihood that this behavior is indicative of malicious activity, especially if coupled with other suspicious actions or anomalies within the network.

  ### Blind Spots and Assumptions
  This detection may miss instances where `curl.exe` is used legitimately within secure environments or misconfigured systems, making false positives possible. The detection logic assumes that all instances of `curl.exe` with the `--insecure` flag are suspect and does not account for valid internal development or testing scenarios. Additionally, it requires access to comprehensive process creation logs to function effectively, which must be consistently captured and retained across the environment.

