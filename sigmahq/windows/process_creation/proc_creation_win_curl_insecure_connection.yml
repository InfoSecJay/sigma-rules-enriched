title: Insecure Transfer Via Curl.EXE
id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
status: test
description: Detects execution of "curl.exe" with the "--insecure" flag.
references:
- https://curl.se/docs/manpage.html
author: X__Junior (Nextron Systems)
date: 2023-06-30
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
  - CommandLine|re: '\s-k\s'
  - CommandLine|contains: '--insecure'
  condition: all of selection_*
falsepositives:
- Access to badly maintained internal or development systems
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_insecure_connection/info.yml
note: |
  ### Technical Context

  This rule detects the execution of "curl.exe" with the "--insecure" flag, which instructs curl to perform insecure requests by ignoring SSL certificate validation. Attackers may utilize this to exfiltrate data, download malicious payloads, or communicate with command and control (C2) servers without the constraints of valid HTTPS certificates. This behavior aligns with MITRE ATT&CK technique: Command and Scripting Interpreter - PowerShell (T1059.001) and Tool Usage (T1218).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process spawn events and associated command-line arguments. If this behavior is malicious, it may facilitate unauthorized data transfer or further compromises through insecure channels. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate users may run curl with the insecure flag for development or testing purposes.

  ### Investigation Steps

  - **Review process creation logs:** Identify the relevant telemetry in Security Event ID 4688 or Sysmon Event ID 1 for the execution of curl.exe. Look for the command line arguments containing "--insecure".

  - **Verify the execution context:** Check the user account that executed curl.exe for any corresponding suspicious behavior or previous alerts within the past 30 days. Consider if the user typically accesses secure resources.

  - **Cross-reference with endpoints accessing external URLs:** Validate if the flagged instance of curl.exe used known, malicious URLs or IP addresses in `curl` command output. Look for patterns that indicate potential data exfiltration.

  - **Identify other command-line flags:** Examine the full command-line input for other flags used with curl to determine the purpose, like `-o`, which specifies output files. Valid downloads typically include standard application packages or internal updates.

  - **Document legitimate behavior for context:** Understand that developers or system administrators may interact with internal APIs over insecure connections for legacy systems. Capture what this activity looks like to differentiate between benign and malicious execution.

  - **Investigate network logs for external calls:** Review firewall or proxy logs for connections established by the IP running curl.exe. Check if any flagged connections match external domains indicating malicious C2 communication.

  ### Prioritization

  This alert has medium severity due to potential security implications from insecure transmission methods that can compromise sensitive data. While not every instance is malicious, the behavior is a common tactic employed by adversaries for data exfiltration and other unauthorized actions.

  ### Blind Spots and Assumptions

  Detection may be limited by non-standard log configurations, which must include command-line arguments for complete visibility. Legitimate use of curl with the insecure flag can occur on poorly maintained internal systems or during testing of internal services. A companion detection rule for raised alerts involving direct outbound connections may strengthen coverage by correlating unusual network activities triggered post curl execution.

