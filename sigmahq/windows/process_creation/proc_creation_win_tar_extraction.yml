note: |
  ### Technical Context
  This detection rule identifies instances where `tar.exe`, specifically its variant with the original file name `bsdtar`, is executed with extraction parameters. Adversaries may utilize utilities like `tar` to decompress data that could include stolen or exfiltrated files, thereby possibly evading detection by traditional security measures. The use of tools for file extraction can signify efforts to retrieve sensitive data from compromised systems, and understanding this behavior is crucial for incident response.

  The relevant MITRE ATT&CK tactics include **Collection (T1560)**, which involves gathering data of interest from a system, and **Exfiltration (T1560.001)**, which refers to the extraction of data from a compromised environment. The detection is particularly relevant for detecting specific suspicious behaviors associated with adversaries using file compression utilities for nefarious purposes.

  Primary telemetry for this detection includes **process creation logs** from Windows systems, which record the execution of applications along with command-line arguments. Monitoring these logs can offer insights into unusual activity, such as the use of `tar` for decompression in unexpected contexts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `tar.exe` being invoked, particularly those with the command-line argument `-x`, indicating extraction behavior.
  - **Examine File Locations**: Investigate the directories from which `tar.exe` was initiated to determine if any sensitive files were being manipulated or placed in unusual locations.
  - **Correlate with Other Logs**: Check for complementary evidence in logs from other sources, such as file access logs, to identify if any sensitive files were accessed or modified around the same time.
  - **Identify User Context**: Determine the user account under which `tar.exe` was executed and assess that account's normal behavior to spot any anomalies that might suggest compromise.

  ### Prioritization
  This alert is considered of **low severity** in an enterprise environment as it often represents benign use of utilities for file operations. However, repeated or unusual executions, especially by non-administrative users or in sensitive folders, should warrant further investigation due to its potential link to data exfiltration.

  ### Blind Spots and Assumptions
  This detection rule relies on the assumption that `tar.exe` is being monitored consistently across affected systems. A potential blind spot exists if `tar.exe` is not regularly used within the environment; the context of its invocation could lead to false positives if users have legitimate testing or operational purposes for running it. Additionally, this detection requires sufficient logging of process creation events, and environments that do not capture these logs may miss important insights into possible malicious activities.

