logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains: 'query'
  selection_cmd:
        # Note: add more interesting services
    CommandLine|contains: 'termservice'
  condition: all of selection_*
falsepositives:
- Unknown
# Note: can be upgraded to medium after an initial baseline
level: low
note: |
  ---

  ### Technical Context

  The Sigma rule detects the invocation of `sc.exe` with commands aimed at querying service status, particularly focusing on sensitive services like the Terminal Services. This behavior is often observed in reconnaissance phases of an attack lifecycle, where the adversary seeks to gather information about installed services, either for privilege escalation or to identify potential attack vectors. Relevant MITRE ATT&CK tactics include Credential Access (T1003) and Discovery (T1087).

  The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1, capturing process execution details. If malicious, this activity could lead to system compromise or unauthorized access to sensitive data. However, this detection alone does not confirm an attack is occurring, as legitimate administrative tasks may exhibit similar patterns.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:**
    Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `sc.exe` being executed with ‘query’ in the CommandLine parameter. Filter for `CommandLine` fields containing ‘query’ or `termservice`. Look for unusual source accounts.

  - **Assess Granularity of Command-Line Arguments:**
    Confirm the exact query being executed against the service. For example, querying ‘termservice’ may indicate reconnaissance targeting RDP services, which is a critical insight for identifying malicious behavior.

  - **Investigate User Context:**
    Identify the user or service account executing `sc.exe`. Legitimate usage often comes from administrative accounts performing system maintenance. Verify against the known roles of the user or system account.

  - **Review Recent Service Changes:**
    Look into Windows Event Logs for any recent changes to services that may coincide with `sc.exe` queries. Example Event ID 7045 indicates a service installation, which may offer context on potential malicious modification.

  - **Cross-reference with Known Attack Patterns:**
    Identify if the querying behavior frequently correlates with other attack patterns or indicators of compromise within your environment. Look for unusual sequences of command executions or behavioral patterns by the originating account.

  - **Document Legitimate Use Cases:**
    Compile a list of standard operating procedures that might require querying services, particularly for administrators during server maintenance or troubleshooting sessions, to differentiate between benign and suspicious activity.

  ---

  ### Prioritization

  This alert is classified as low severity because while service enumeration is a common precursor to more significant exploits, it does not inherently indicate an active attack. The likelihood of malicious abuse increases in sensitive environments where service configurations could be leveraged for lateral movements or credential dumps.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, particularly for less common administrative actions. Attackers could use obfuscation techniques in command-line execution to avoid detection. Furthermore, legitimate administrative tasks, such as troubleshooting services by system admins or IT personnel, may inadvertently trigger this alert. Companion detections for related behaviors, such as enumerating users or querying installed software, can enhance overall monitoring efforts and contextualize findings from `sc.exe` queries.

