title: Interesting Service Enumeration Via Sc.EXE
id: e83e8899-c9b2-483b-b355-5decc942b959
status: test
description: |
  Detects the enumeration and query of interesting and in some cases sensitive services on the system via "sc.exe".
  Attackers often try to enumerate the services currently running on a system in order to find different attack vectors.
references:
- https://www.n00py.io/2021/05/dumping-plaintext-rdp-credentials-from-svchost-exe/
- https://pentestlab.blog/tag/svchost/
author: Swachchhanda Shrawan Poudel
date: 2024-02-12
tags:
- attack.t1003
- attack.credential-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains: 'query'
  selection_cmd:
        # Note: add more interesting services
    CommandLine|contains: 'termservice'
  condition: all of selection_*
falsepositives:
- Unknown
# Note: can be upgraded to medium after an initial baseline
level: low
note: |
  ### Technical Context
  This detection rule captures potentially malicious activity by monitoring the use of `sc.exe`, a Windows command-line tool used for service control. The rule identifies when an attacker enumerates or queries services, particularly targeting sensitive services that may reveal attack vectors. Common objectives for attackers include gaining unauthorized access, escalating privileges, or identifying potential exploitable services within the environment. The presence of this log could indicate reconnaissance activity likely aimed at discovering avenues for further exploitation within a compromised system.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Credential Access** (TA0006) and **Credential Dumping** (T1003). These techniques are characterized by attackers gathering credentials or tokens that may allow them to move laterally within a network or access additional sensitive data. The primary data sources for this detection are process creation event logs, which track command-line arguments and the invocation of Windows processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs for occurrences of `sc.exe`, verifying the command-line usage to ensure that only expected administrative scripts and activities are being executed.

  - **Correlate User Activity:** Cross-reference user accounts that executed the `sc.exe` commands with their roles and privileges. Investigate any instances where non-administrative users attempt to query services.

  - **Examine Service Behavior:** Investigate the services being queried, particularly if sensitive services like `TermService` or others related to remote access and administrative functionalities are involved.

  - **Monitor Related Network Activity:** Look for any outbound connections or lateral movement originating from the endpoint where `sc.exe` was executed, focusing on unusual protocols and endpoints that may indicate further malicious activity.

  ### Prioritization
  This alert's severity is considered low due to the potential for false positives in administrative scripts or benign service inspections. However, the likelihood of attackers enumerating services as part of their reconnaissance makes it an activity warranting closer scrutiny, particularly when linked with unusual user accounts or behavioral patterns.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where attackers use alternative methods for service enumeration or interact with services through approved applications that do not log the same way as direct command-line usage. This rule assumes that process creation logs are configured correctly and that `sc.exe` is not being masked by other tools or scripts. Proper logging settings must be in place, and regular maintenance should ensure that process creation audibility is comprehensive for effective detection.

