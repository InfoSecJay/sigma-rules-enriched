title: Interesting Service Enumeration Via Sc.EXE
id: e83e8899-c9b2-483b-b355-5decc942b959
status: test
description: |
  Detects the enumeration and query of interesting and in some cases sensitive services on the system via "sc.exe".
  Attackers often try to enumerate the services currently running on a system in order to find different attack vectors.
references:
- https://www.n00py.io/2021/05/dumping-plaintext-rdp-credentials-from-svchost-exe/
- https://pentestlab.blog/tag/svchost/
author: Swachchhanda Shrawan Poudel
date: 2024-02-12
tags:
- attack.t1003
- attack.credential-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains: 'query'
  selection_cmd:
        # Note: add more interesting services
    CommandLine|contains: 'termservice'
  condition: all of selection_*
falsepositives:
- Unknown
# Note: can be upgraded to medium after an initial baseline
level: low
note: |
  ### Technical Context

  This rule detects the use of the `sc.exe` command-line utility to enumerate services on a Windows system, particularly focusing on potentially sensitive services such as "termservice." Attackers may use this enumeration to identify services that could be exploited for lateral movement or credential theft. This activity fits primarily into the MITRE ATT&CK framework under the Tactic: Credential Access (TA0006) and Technique: OS Credential Dumping (T1003).

  Primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. The security impact is significant if this enumeration is part of a broader attack, as attackers could potentially exploit found vulnerabilities to gain unauthorized access or escalate privileges. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activity may also involve service enumeration.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 to identify the execution of `sc.exe`. Look for entries with `CommandLine` containing 'query' and 'termservice' to confirm potential malicious activity.

  - **Check user context:** Verify the username and credential context of the user executing `sc.exe`. Legitimate administrative activities may include IT personnel or system administrators querying services, while uncommon or unexpected accounts executing this could indicate malicious intent.

  - **Analyze command lineage:** Trace back the origin of the command execution. Look for parent processes related to known administrative tools (Event ID 4688 ParentProcessName) or scripts that might indicate automated queries or reconnaissance behaviors.

  - **Investigate service enumeration interpretation:** Cross-reference queried services against a baseline of expected services for the system role. Note any services that differ from the baseline, which could indicate reconnaissance for exploitation.

  - **Identify previous suspicious activities:** Review logs for related suspicious activities such as unusual account logins (Event ID 4624) or failed access attempts (Event ID 4625) in a short time frame, which might indicate an attacker’s malicious workflow.

  - **Assess asset criticality:** If the affected system has critical roles (e.g., domain controller or file server), prioritize this alert for immediate analysis. Events involving high-value assets carry increased risk.

  ### Prioritization

  This alert is categorized as low severity due to the prevalence of legitimate service enumeration activities by IT personnel. However, the likelihood of malicious actors using this activity to identify attack vectors raises its importance in contexts where sensitive services are involved. Given that this behavior can often precede further exploitation attempts, it warrants close monitoring and investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion techniques such as using alternative scripts or tools that replicate similar enumeration features without triggering this rule. Reliable detection requires proper logging configurations for process creation. Legitimate administrative activities such as service management could trigger this alert, necessitating careful contextual analysis. Companion detections linked to account-based activities, like unauthorized remote access attempts or account privilege escalations, could enhance overall coverage.

