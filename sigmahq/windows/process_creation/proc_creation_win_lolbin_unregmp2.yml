  ### Technical Context

  This rule detects the usage of the Windows binary "unregmp2.exe" being run with parameters indicative of an evasion technique, specifically as a method to proxy the execution of another binary, "wmpnscfg.exe." The likely objective of the attacker is to obfuscate malicious activity, taking advantage of legitimate binaries to execute unauthorized commands. This behavior aligns with the MITRE ATT&CK tactic of "Execution" (TA0002) and the technique "User Execution" (T1203).

  The primary telemetry source for this detection is the Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details on process creation events and can reveal command line arguments. If malicious, the impact could involve unauthorized access or control over system resources, leading to various downstream effects such as data exfiltration or lateral movement. Importantly, this detection does NOT confirm that the activity is solely malicious, as legitimate instances of "unregmp2.exe" may be called by benign applications.

  ### Investigation Steps

  - **Identify the observed process execution:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of "unregmp2.exe" running. Look for command line parameters that include "/HideWMP."

  - **Evaluate the command line arguments:** Determine if the command line contains patterns or arguments that are unusual in your environment, such as the presence of "wmpnscfg.exe" alongside "/HideWMP."

  - **Cross-check with known benign usage:** Verify if "unregmp2.exe" is being executed by legitimate applications in your organization. Common benign usages may include media player configurations or updates, particularly during known maintenance windows.

  - **Examine additional parent processes:** Investigate the parent process of "unregmp2.exe" by checking Event ID 4688 for unusual or suspicious parent processes that may indicate an evasive tactic. Look for process trees that indicate unauthorized usage.

  - **Check for established connections:** Inspect network logs (e.g., firewall logs or network flow data) for any outgoing connections or unusual traffic patterns that coincide with the execution of "unregmp2.exe," particularly to unexpected external IP addresses.

  ### Prioritization

  This alert is moderate severity. Although “unregmp2.exe” is a legitimate system file, its use as a proxy for executing "wmpnscfg.exe" can indicate malicious behavior. Given the potential for exploitation, timely investigation is warranted, especially if it involves sensitive systems.

  ### Blind Spots and Assumptions

  Detection depends on proper logging configurations for process creation; missing Sysmon or Security event logs could lead to blind spots. Additionally, legitimate administrative scripts or maintenance tasks could trigger similar alerts. A companion detection rule could focus on unusual network behavior linked to local process execution, enhancing threat visibility and context.

