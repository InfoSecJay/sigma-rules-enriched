  ### Technical Context

  This Sigma rule detects the execution of the `unregmp2.exe` binary, specifically when it is used as a proxy to launch a custom version of `wmpnscfg.exe` with the `/HideWMP` command line argument. The behavior suggests an attempt to evade detection mechanisms by leveraging a legitimate Windows component to execute potentially harmful activities. The likely attacker objective is to exploit trust in the Windows Media Player components to execute malicious code or establish further command-and-control capabilities.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), and the associated technique is **DLL Search Order Hijacking** (T1218). Primary telemetry sources include Windows Security Event ID 4688 for process creation events, and details from Sysmon Event ID 1 where the command line and image paths can be analyzed. If the activity is malicious, it could lead to unauthorized access or system compromise. This detection does NOT confirm that the behavior is unequivocally malicious; it only indicates a suspicious use of a legitimate binary.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Windows Security Event ID 4688 for instances where `unregmp2.exe` is invoked. Look specifically for suspicious command line arguments, especially ` /HideWMP`. Compare these occurrences against baseline operations to identify anomalies.

  - **Validate Command Line Arguments**: Investigate Sysmon Event ID 1 logs for command line details that include `unregmp2.exe` and `wmpnscfg.exe` with `/HideWMP`. Legitimate usage would typically not include such arguments, marking them as suspicious if present.

  - **Review Parent Process Relationships**: Analyze Sysmon Event ID 1 to determine the parent process of `unregmp2.exe`. Confirm whether a legitimate application spawned it or if it was initiated by an unexpected process, indicating possible malicious intent.

  - **Identify Network Activity**: If applicable, check firewall or proxy logs for outbound network connections initiated by `wmpnscfg.exe` shortly after `unregmp2.exe` execution. Look for unusual destinations or unexpected protocols that deviate from regular business operations.

  - **Correlate with Known Binaries**: Check if this execution is part of a known attack pattern from threat intelligence sources. Investigate any reported cases of `unregmp2.exe` being exploited and correlate findings with current endpoint data.

  ### Prioritization

  This alert carries medium severity due to the potential impact of using a system binary for malicious purposes. The likelihood of malicious behavior is moderate; while the use of `unregmp2.exe` is specific and could indicate an active attack, it is less commonly weaponized compared to other techniques. However, due diligence is required given its stealth nature.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques where an attacker might rename binaries or use other legitimate tools similarly. Reliable detection relies on accurate logging configurations, particularly for process creation events and command line details, which may not always be monitored comprehensively. Legitimate activities, such as media player updates or configurations, might inadvertently trigger this alert. Related detections, such as monitoring for usage of other suspicious binaries (e.g., `mshta.exe`), can enhance overall security posture against similar evasion techniques.

