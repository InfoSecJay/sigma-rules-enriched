  ---

  ### Technical Context

  This rule detects the use of the `unregmp2.exe` binary as a proxy to launch a modified version of `wmpnscfg.exe`. This behavior is often employed by attackers to evade detection mechanisms, leveraging a legitimate Windows binary to execute potentially malicious commands. The likely attacker objective is to gain persistence or to perform unauthorized actions while masking their activities.

  This detection relates to the MITRE ATT&CK technique **Use of Valid Accounts (T1078)** as well as **Defense Evasion (T1218)**. The primary telemetry source includes process creation logs from Windows, specifically focusing on the command line arguments and binary names. If utilized maliciously, this behavior can lead to data exfiltration or system compromise. Notably, this detection does not confirm malicious intent by itself; further investigation is required to understand the context of the alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Investigate Windows Security Event ID **4688** for instances of `unregmp2.exe`. Look for an exact match for the original file name and verify the command line arguments, specifically checking for `/HideWMP`.

  - **Analyze command line arguments:** Check for the presence of unusual command line parameters after `unregmp2.exe`. A legitimate use typically does not include `/HideWMP`. Compare against known benign uses if they exist.

  - **Correlate with other security alerts:** Look for other Security Event IDs, such as **4672** (Special Logon) that may indicate an elevated privilege level when `unregmp2.exe` was executed—this could signify attempted privilege escalation.

  - **Investigate the `wmpnscfg.exe` execution:** Cross-reference with the command line usage of `wmpnscfg.exe`. Any invocation through `unregmp2.exe` should be treated with caution, especially if it has unusual parameters or discrepancies in its binary properties.

  - **Check system inventory for `unregmp2.exe`:** Confirm if `unregmp2.exe` exists on the system. Note that it should be a legitimate Microsoft binary, typically residing under `C:\Program Files (x86)\Windows Media Player\`. Any presence in non-standard directories may indicate malicious alterations.

  - **Validate against established baselines:** Establish baselines for your environment. Frequent executions of `unregmp2.exe` combined with other suspicious activities can indicate malicious presence. Normal usage should be rare and tightly controlled.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact of abuse on enterprise systems, especially if `unregmp2.exe` is used to execute unapproved applications. Given its relationship to commonly weaponized techniques for evasion, swift investigation is warranted to determine intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging is not fully enabled, or where the `unregmp2.exe` usage is common due to legitimate software operation. Ensure process monitoring is configured to capture all relevant command line arguments. Legitimate Microsoft updates or software installations may trigger similar alerts. Companion detections, including monitoring `wmpnscfg.exe` without `unregmp2.exe`, can enhance overall threat coverage.

