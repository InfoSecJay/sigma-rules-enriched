detection:
  selection_img:
  - Image|endswith: '\KrbRelay.exe'
  - OriginalFileName: 'KrbRelay.exe'       # In case the file has been renamed after compilation
  selection_cli_1:
    CommandLine|contains|all:
    - ' -spn '
    - ' -clsid '
    - ' -rbcd '
  selection_cli_2:
    CommandLine|contains|all:
    - 'shadowcred'
    - 'clsid'
    - 'spn'
  selection_cli_3:
    CommandLine|contains|all:
    - 'spn '
    - 'session '
    - 'clsid '
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of KrbRelay, a known Kerberos relaying tool frequently used by attackers to exploit weaknesses in the authentication process within Windows environments. KrbRelay allows malicious actors to relay Kerberos tickets from one service to another, potentially gaining unauthorized access to various network resources. Common use cases for an attacker employing this tool include escalation of privileges, lateral movement within a network, and accessing sensitive information.

  The relevant MITRE ATT&CK tactics include **Credential Access (TA0006)** and specifically the technique **T1558.003: Credential Dumping: Kerberos Ticket Granting Ticket (TGT) Abuse**. Through the execution of KrbRelay, attackers aim to manipulate Kerberos tickets to impersonate legitimate users. The primary data sources that will provide the best insights into this behavior include process creation events from endpoint detection and response (EDR) systems, which can highlight suspicious executables being run, along with command line arguments that may provide contextual clues regarding the execution of the tool.

  ### Investigation Steps
  - **Review Process Creation Events:** Check the EDR logs for instances where `KrbRelay.exe` is executed. Pay close attention to the `Image` and `OriginalFileName` fields to confirm the tool's usage.
  - **Analyze Command Line Arguments:** Inspect the command line arguments associated with the `KrbRelay.exe` process. Look for unusual combinations of flags, such as `-spn`, `-clsid`, or others that suggest malicious activity.
  - **Correlate with Network Activity:** Investigate network logs for any anomalous Kerberos requests or unusual communication patterns following the execution of KrbRelay, as this could indicate ticket relaying attempts.
  - **Check for User Context:** Identify the user context under which the KrbRelay tool was executed. Review this user’s access rights and recent actions to determine if there has been any suspicious privilege escalation or lateral movement.

  ### Prioritization
  The severity of this alert is high due to the potential impact of successful Kerberos ticket relaying, which can lead to significant breaches in security by allowing attackers to gain unauthorized access to sensitive systems and data, thus posing a serious risk to the enterprise.

  ### Blind Spots and Assumptions
  This detection may not capture instances where KrbRelay is executed from a non-standard location or if the executable is renamed in a manner that prevents identification. The detection logic assumes the presence of logs that detail process creation events and appropriate command line arguments. Additionally, if security configurations do not log or monitor executions of potentially malicious tools effectively, relevant activity could be missed entirely. Ensuring comprehensive logging and monitoring configurations are in place is essential for the alert to function as intended.

