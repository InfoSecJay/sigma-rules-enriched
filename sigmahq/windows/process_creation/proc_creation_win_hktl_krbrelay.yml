note: |
  ### Technical Context

  This detection rule identifies the use of KrbRelay, a tool designed for Kerberos credential relaying, which allows an attacker to impersonate legitimate users by forwarding authentication requests. The likely objective of the attacker is to gain unauthorized access to sensitive resources or systems by exploiting Kerberos tickets. This behavior falls under the MITRE ATT&CK tactic: Credential Access, technique: T1558.003 (Credentials from Kerberos).

  The primary telemetry source is Windows process creation events, specifically looking for instances of `KrbRelay.exe`, along with command-line arguments associated with its execution. Should the detection be confirmed as malicious, the potential security impact includes unauthorized access and lateral movement within the network. Importantly, this detection does NOT confirm that an actual breach has occurred; it simply indicates that the tool was executed, which may require further context to assess the severity.

  ### Investigation Steps

  - **Check process creation events:** Look for Windows Security Event ID 4688 or Sysmon Event ID 1 that log the execution of `KrbRelay.exe`, indicating the process was launched.

  - **Analyze command-line arguments:** Review command-line arguments from the creation events for keywords such as `-spn`, `-clsid`, `-rbcd`, and `shadowcred`. Legitimate entries will typically not contain these command-line flags.

  - **Identify parent-child process relationships:** Investigate the parent process of `KrbRelay.exe` for any suspicious behavior or common attack patterns, particularly relating to tools often used in conjunction with credential theft.

  - **Assess host role:** Confirm if the host executing `KrbRelay.exe` is a critical server or workstation that handles sensitive data or is part of the domain controller infrastructure, increasing the severity of the potential attack.

  - **Look for network activity related to the tool:** Validate if any network logs show connections or authentications against domain controllers or other sensitive resources indicative of an attempted Kerberos relay attack.

  ### Prioritization

  The alert should be treated with high severity due to the potential risk of credentials being relayed, which could lead to unauthorized access in critical environments. Given the nature of Kerberos and its common abuse in lateral movement attacks, the likelihood of malicious intent is significant.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logging is not configured properly, particularly for process creation events or command-line logging. The execution of `KrbRelay.exe` may also trigger in scenarios of penetration testing or legitimate administrative tasks related to security assessments. A relevant companion detection to consider is monitoring for unusual authentication patterns or failed logins that may indicate credential misuse.

