note: |
  ### Technical Context

  This rule detects the execution of `tar.exe` with specific command-line arguments indicative of creating compressed files. Adversaries may leverage `tar.exe` for data compression or to prepare files for exfiltration as part of their operational objectives. This behavior aligns with the MITRE ATT&CK tactics of Collection (TA0009) and Exfiltration (TA0010), particularly techniques T1560 (Archive Collected Data) and T1560.001 (Archive via File Compression).

  The primary telemetry source for this detection is Windows process creation events, specifically focusing on Event ID 4688 (Process Created) and fields such as CommandLine and Image Name. If malicious, this behavior can lead to unauthorized data exfiltration, especially when combined with network activity to transfer the archived files. Importantly, this detection does NOT confirm malicious intent on its own—`tar.exe` may be employed for legitimate tasks such as backup processes or data management.

  ### Investigation Steps

  - **Examine the command-line usage of `tar.exe`:** Check Event ID 4688 and filter for `tar.exe` in the CommandLine field. Look for flags `-c`, `-r`, or `-u` indicating compression or updating. For benign activity, these commands should correlate with expected processes (e.g., regular backups) without unusual source paths.

  - **Identify the source of the `tar.exe` execution:** Investigate the Image field to determine the file path of `tar.exe`. Any execution from an unusual path (e.g., user directories) may indicate malicious intent, while legitimate instances typically originate from system directories.

  - **Analyze process parent-child relationships:** Use Sysmon Event ID 1 to review process creation chains. A suspicious `tar.exe` execution launched by an uncommon parent process (e.g., a scripting language or an untrusted application) could be a potential indicator of compromise.

  - **Check for data upload activities post-execution:** Review endpoint network logs (such as Event ID 5156 for Windows Firewall) to detect egress traffic to unusual destinations after `tar.exe` runs. High-volume traffic patterns or unfamiliar protocols can signal data exfiltration.

  - **Validate file creation and modification:** Search filesystem logs to confirm the presence and size of the compressed files created by `tar.exe`. Large, unexpected archive files in user directories or non-standard locations may indicate potential malicious behavior.

  - **Document regular use cases for `tar.exe`:** Consult with stakeholders to ensure there is an understanding of legitimate applications of `tar.exe` in the environment, including any scheduled tasks or authorized backup processes that might trigger alerts.

  ### Prioritization

  Alerts generated from this detection should be treated as low severity due to the nature of `tar.exe`, which is typically used for benign purposes. However, the context of affected systems and potential misuse remains important, especially if the behavior is coincidental with other anomalous activities. While this tactic can certainly be weaponized, it is often found in legitimate data management activities.

  ### Blind Spots and Assumptions

  Detection may be limited by user privileges; non-administrator accounts can potentially mask malicious activity associated with compressed files. The reliability of the detection requires appropriate logging configurations to capture command-line and process creation events accurately. Legitimate activities that could trigger this alert include regular system backups or packaging of application data. Companion detections such as monitoring for unusual outbound network connections (i.e., data exfiltration attempts) will enhance the overall visibility and context surrounding `tar.exe` usage.

