logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\tar.exe'
  - OriginalFileName: 'bsdtar'
  selection_create:
    CommandLine|contains:
    - '-c'
    - '-r'
    - '-u'
  condition: all of selection_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of `tar.exe`, a utility often leveraged for creating compressed files. While `tar` is a legitimate tool commonly used for backup, archiving, and file transfer, adversaries may misuse this functionality to prepare data for exfiltration. In particular, attackers may employ compression to obfuscate the true nature of the files before transferring them out of the network, thereby evading detection mechanisms.

  In the context of this detection, the suspected threat category includes data exfiltration tactics, in which adversaries seek to illicitly remove sensitive information from an organization. The relevant MITRE ATT&CK tactics and techniques involved include **Collection (T1560)** and **Data Obfuscation (T1560.001)**. The detection leverages process creation events from the Windows operating system, specifically targeting the execution of `tar.exe` with specific command-line arguments indicative of file creation or modification.

  Key telemetry sources for this detection include Windows process creation logs, which capture details about executed processes along with their command-line parameters. Anomalies in how compression tools are used could indicate potential compromise or data misuse.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events related to `tar.exe` execution, focusing on timestamps, user context, and command-line arguments to identify any suspicious usage patterns.
  - **Collect Command-Line Arguments**: Pay close attention to the arguments passed to `tar.exe`, especially those indicative of file creation (`-c`), appending (`-r`), or updating (`-u`), as these operations could signify an attempt to archive sensitive files.
  - **Verify User Activity**: Investigate the account used to execute the command for any historical context, such as prior unauthorized behavior or atypical access patterns that may suggest insider threats or compromised accounts.
  - **Audit Data Transfers**: Check for outgoing network traffic that may correlate with the timing of `tar.exe` executions, including any unusual connections to external IP addresses which could indicate active data exfiltration.

  ### Prioritization
  While the severity of this alert is classified as low, it merits attention due to the potential for data exfiltration using common utilities. In an enterprise environment, the likelihood of attackers abusing legitimate tools makes this a notable point for further investigation, especially if combined with other indicators of compromise.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of malicious use of `tar.exe`, particularly if attackers modify command-line arguments to bypass detection or if they utilize alternative archiving solutions. The detection logic assumes `tar.exe` is a known and monitored executable within the environment. Adequate logging must be enabled for process creation events and command-line parameters to ensure effective monitoring and alerting functionality.

