note: |
  ### Technical Context

  This rule detects the execution of LiveKD, a tool used for creating a kernel memory dump, specifically when invoked with the "-m" flag. This behavior is often associated with an adversary's objective to extract sensitive data from system memory, potentially for gathering credentials, secrets, or other sensitive artifacts residing in kernel space. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1070)**, and the technique is specifically **Execution through software (T1035)**.

  The primary telemetry source for this alert is Windows process creation logs, specifically those that record event IDs 4688 and Sysmon event ID 1, which detail command line arguments and image paths. If malicious, the use of this command could lead to the theft of critical data and signify a breach of system integrity. However, this detection alone does NOT confirm that malicious activity is occurring, as legitimate operations or maintenance activities may also lead to similar command executions.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for process creation related to `livekd.exe` or `livekd64.exe`. Focus on the timestamps and users associated with these events. Benign instances may originate from known maintenance accounts with no prior abnormal behavior.

  - **Examine command line arguments:** Validate Sysmon Event ID 1 for any execution containing " -m" within command line parameters indicating memory dump requests. Legitimate commands typically do not include this flag in normal system operations.

  - **Correlate execution context:** Investigate related events around the identified process creation, specifically Event ID 4104 (PowerShell), or any associated command shell activity. Look for unusual execution patterns or unexpected parent processes that might signal malicious intent.

  - **Check for external network communications:** Look for outbound connections initiated by the host post-execution in firewall logs. Document any suspicious endpoints or protocols used, as this may indicate data exfiltration attempts.

  - **Validate asset criticality:** Assess the host’s role within the infrastructure. If it's a server hosting sensitive applications, the risk factor increases. Prioritize further investigation based on the criticality of the affected asset.

  ### Prioritization

  This alert is considered high severity due to its potential impact on sensitive data residing in memory and the likelihood that it could be maliciously exploited. The use of tools like LiveKD is a common tactic among advanced adversaries aiming to bypass security controls and extract valuable information from the system.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging configurations are not adequately set to capture all necessary telemetry, particularly for command line arguments. Evasion techniques could include manipulating the legitimate path for execution or using a different memory dumping tool that is less detectable. There may be legitimate cases, such as forensic analyses by IT admins, where this behavior could be triggered. Companion detections focusing on abnormal PowerShell executions or other memory access tools, like Mimikatz, can strengthen overall coverage against similar threats.

