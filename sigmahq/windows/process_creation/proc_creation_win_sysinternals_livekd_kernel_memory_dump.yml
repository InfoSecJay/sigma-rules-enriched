note: |
  ### Technical Context

  This rule detects the execution of LiveKD with the "-m" flag, which is used to create a memory dump of the kernel in Windows systems. The likely attacker objective is to extract sensitive information from the system's memory, potentially for credential harvesting, persistence, or further exploitation. This behavior aligns with the MITRE ATT&CK technique "Credential Dumping" (T1003) under the tactic "Credential Access."

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1, which provide details on process execution. If confirmed as malicious, the security impact could be severe, as it may lead to unauthorized access and extraction of sensitive data. However, this detection does NOT confirm malicious intent on its own, as legitimate system administrators may use LiveKD for debugging or analysis.

  ### Investigation Steps

  - **Review process creation details:** Check Security Event ID 4688 and Sysmon Event ID 1 for processes named `livekd.exe` or `livekd64.exe`. Confirm the command line arguments and ensure the "-m" flag is present.

  - **Validate command line usage:** Inspect the CommandLine field for typical parameters. Confirm that the presence of `-m` without other benign parameters (like `-h`, for help) is abnormal in your environment.

  - **Identify execution context:** Evaluate the user context under which LiveKD was executed. If run by an administrator or a known user for legitimate troubleshooting, this could indicate benign activity.

  - **Check surrounding process activity:** Analyze the timeline for any processes that preceded or followed the execution of LiveKD, especially processes that are known for malicious behavior, such as those involving credential harvesting tools.

  - **Assess related artifacts:** Look for artifacts indicating memory dump creation in the system, such as the presence of `.dmp` files in `/Windows/` or other relevant directories. File creation time should align closely with the execution of LiveKD with the "-m" flag.

  ### Prioritization

  This alert is high severity due to the criticality of the systems involved, as kernel memory dumps can expose extensive sensitive information. The likelihood of malicious abuse is significant, especially given the stealthy nature of tools like LiveKD in the hands of an attacker. Such behaviors are commonly weaponized in advanced persistent threat scenarios.

  ### Blind Spots and Assumptions

  Evasion techniques for this detection might include renaming the LiveKD executable or using other methods to access kernel memory that do not invoke this specific command line flag. Reliable detection requires continuous monitoring of command line arguments and ensuring proper logging configurations are in place. Legitimate activities that may trigger this alert include authorized troubleshooting by security or IT personnel. A related detection to strengthen coverage would be monitoring for other credential dumping techniques, such as the execution of Mimikatz (T1003.001).

