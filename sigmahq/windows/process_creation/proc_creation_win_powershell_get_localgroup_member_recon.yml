    # Covers group and localgroup flags
  selection_cmdlet:
    CommandLine|contains: 'Get-LocalGroupMember '
  selection_group:
    CommandLine|contains:
            # Add more groups for other languages
    - 'domain admins'
    - ' administrator'         # Typo without an 'S' so we catch both
    - ' administrateur'         # Typo without an 'S' so we catch both
    - 'enterprise admins'
    - 'Exchange Trusted Subsystem'
    - 'Remote Desktop Users'
    - 'Utilisateurs du Bureau à distance'         # French for "Remote Desktop Users"
    - 'Usuarios de escritorio remoto'         # Spanish for "Remote Desktop Users"
  condition: all of selection_*
falsepositives:
- Administrative activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell `Get-LocalGroupMember` cmdlet, which is typically used to enumerate users in local groups on Windows systems. The likely attacker objective is reconnaissance to gather information about user permissions, particularly on high-privilege groups, potentially facilitating further exploitation. This behavior maps to the MITRE ATT&CK technique "Account Discovery" (T1087.001).

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, capturing command-line activities. If malicious, the reconnaissance may enable elevation of privileges or lateral movement within the network. Importantly, this detection does NOT confirm that any compromise has occurred; it only indicates potentially suspicious enumeration activity.

  ### Investigation Steps

  - **Identify the command execution context**: Review the logs for Security Event ID 4688, focusing on the `NewProcessName` and `CommandLine` fields to confirm the execution of `Get-LocalGroupMember` with specific group names.

  - **Determine the user account involved**: Check the `Security ID` in Event ID 4688 logs to identify which user executed the command. Look for accounts with excessive privileges that may indicate nefarious intent, such as domain admin accounts.

  - **Assess the host environment**: Validate if the host is a server or workstation. Hosts with critical roles (e.g., Domain Controllers, application servers) where group membership is crucial may warrant higher scrutiny and urgency.

  - **Review historical command usage**: Cross-examine recent command execution logs for expected legitimate use of `Get-LocalGroupMember` by administrative accounts. Expect regular usage from system administrators for routine management tasks.

  - **Identify high-confidence malicious indicators**: Look for unusual patterns, such as repeated executions of `Get-LocalGroupMember`, especially from non-admin accounts or during odd hours, indicating potential malicious reconnaissance.

  ### Prioritization

  The severity of this alert can be considered medium due to its potential impact on sensitive or critical systems if exploited. While reconnaissance itself may seem lower risk, the likelihood of malicious users abusing this technique for further attacks is notable, especially as this cmdlet is often used in exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logs or if the logging level does not capture cmdlets invoked in PowerShell. Legitimate administrative activities, such as routine rights audits by system administrators, could trigger these alerts. A related detection, such as monitoring for other account discovery methods (e.g., `Get-LocalUser`), would strengthen coverage against comprehensive reconnaissance attempts.

