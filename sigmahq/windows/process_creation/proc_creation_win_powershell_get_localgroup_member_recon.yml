detection:
    # Covers group and localgroup flags
  selection_cmdlet:
    CommandLine|contains: 'Get-LocalGroupMember '
  selection_group:
    CommandLine|contains:
            # Add more groups for other languages
    - 'domain admins'
    - ' administrator'         # Typo without an 'S' so we catch both
    - ' administrateur'         # Typo without an 'S' so we catch both
    - 'enterprise admins'
    - 'Exchange Trusted Subsystem'
    - 'Remote Desktop Users'
    - 'Utilisateurs du Bureau à distance'         # French for "Remote Desktop Users"
    - 'Usuarios de escritorio remoto'         # Spanish for "Remote Desktop Users"
  condition: all of selection_*
falsepositives:
- Administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious reconnaissance activities on Windows systems that involve the use of the PowerShell command `Get-LocalGroupMember`. Attackers may utilize this command to enumerate group memberships, which can assist in identifying users with elevated privileges or lateral movement opportunities within an environment. The primary intent behind such reconnaissance is to gather information about user accounts and their associated privileges, which can be leveraged for privilege escalation or lateral movement tactics.

  The relevant MITRE ATT&CK tactics include "Discovery" and the specific technique of "Group Membership Discovery" (T1087.001). By effectively understanding the group memberships on a system, attackers can identify potential targets or misconfigured accounts that may facilitate unauthorized access. Primary data sources for this detection include process creation logs, where command line arguments for executed processes are recorded, enabling security teams to spot the use of `Get-LocalGroupMember`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the logs for instances of the `Get-LocalGroupMember` cmdlet to determine the context of its usage, including the user executing the command and the timing of the activity.
  - **Check Group Memberships**: Verify the groups that were queried using this command. Look for unusual group memberships that may indicate an attacker’s attempt to gather intelligence on users with elevated privileges.
  - **Investigate User Activity**: Scrutinize the activities of the users who executed the cmdlet. Cross-reference with previous behavior to identify any anomalies or suspicious patterns indicating potential compromise.
  - **Assess for Lateral Movement**: Examine any subsequent commands or behaviors following the usage of `Get-LocalGroupMember`, specifically looking for signs of lateral movement or attempts to exploit discovered users.

  ### Prioritization
  This alert holds medium severity due to the potential impact of reconnaissance activities within an enterprise environment. If successful, attackers can leverage the information gained to facilitate privilege escalation, lateral movement, and broader exploitation of the network, increasing the likelihood of a successful attack.

  ### Blind Spots and Assumptions
  The detection logic may have blind spots concerning legitimate administrative activities, as certain uses of `Get-LocalGroupMember` may be common among system administrators. The rule assumes that the command will not be used inappropriately in a typical operational environment. Required logs include comprehensive process creation logs with command line parameters enabled, which must be properly configured and retained for effective detection.

