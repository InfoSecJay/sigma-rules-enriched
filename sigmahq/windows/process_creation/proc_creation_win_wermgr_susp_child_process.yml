logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\wermgr.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\ipconfig.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\systeminfo.exe'
    - '\whoami.exe'
    - '\wscript.exe'
  filter_main_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'C:\Windows\system32\WerConCpl.dll'
    - 'LaunchErcApp '
    CommandLine|contains:
    - '-queuereporting'
    - '-responsepester'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes by `wermgr.exe`, which is primarily associated with the Windows Error Reporting framework. Attackers may leverage this legitimate process to spawn malicious executables (e.g., PowerShell, cmd.exe) in an effort to maintain persistence, escalate privileges, or exfiltrate data under the guise of normal error reporting behavior. This behavior falls under the MITRE ATT&CK tactics of Privilege Escalation (T1068) and Defense Evasion (T1027).

  The primary telemetry source is Windows Process Creation logs, specifically Security Event ID 4688. If malicious, this behavior could lead to unauthorized system changes, data leakage, or further compromise of the system. It is crucial to note that this detection does not confirm that malicious activity has occurred; benign processes could also replicate similar behaviors.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for entries where the parent process is `wermgr.exe`. Look for child processes like `cmd.exe`, `powershell.exe`, or `rundll32.exe` as indicators of potential malicious activity.

  - **Analyze command lines:** For any identified instances of `rundll32.exe`, validate command lines containing `C:\Windows\system32\WerConCpl.dll` and flags like `-queuereporting`. Such command lines may indicate attempts to manipulate the Error Reporting service.

  - **Investigate parent-child relationships:** Use Sysinternals Process Explorer or similar tools to visualize the hierarchy of the processes. If you see suspicious child processes spawned from `wermgr.exe`, it increases the likelihood of an attack scenario.

  - **Identify legitimate behavior:** Note that `wermgr.exe` may legitimately invoke tools like `mshta.exe` for updates. Analyze the context and timestamp of the invocation, as legitimate processes often occur during system updates or user-initiated operations.

  - **Check for known indicators of compromise (IOCs):** Look for patterns or hashes associated with known malware that may utilize `wermgr.exe` as a parent process. Reference external intelligence sources for any recent reported campaigns linked to this behavior.

  - **Assess asset criticality:** Determine the role of the affected host. If it’s a critical infrastructure component, prioritize further investigation and remediation actions to prevent more significant risks.

  ### Prioritization

  This alert warrants high priority due to its association with privilege escalation and potential to conceal malicious activity. The impact of a compromised system can be severe, especially if sensitive data is involved. Given the typical usage of `wermgr.exe` in exploitation techniques, timely investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be evaded through the use of legitimate system processes or if an attacker uses custom-named executables or changes process properties. Ensure logging for process creation is enabled and configured accurately, as this is essential for reliable detection. Legitimate automated error reporting or diagnostic processes may also trigger this rule, and companion detections such as user account changes during the time of process creation can enhance context and coverage for investigations.

