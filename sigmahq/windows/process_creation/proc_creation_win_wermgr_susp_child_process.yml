detection:
  selection:
    ParentImage|endswith: '\wermgr.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\ipconfig.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\systeminfo.exe'
    - '\whoami.exe'
    - '\wscript.exe'
  filter_main_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'C:\Windows\system32\WerConCpl.dll'
    - 'LaunchErcApp '
    CommandLine|contains:
    - '-queuereporting'
    - '-responsepester'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes spawned by the Windows Error Reporting manager (wermgr.exe), particularly when wermgr.exe is leveraged to launch potential malicious executables such as cmd.exe, powershell.exe, and rundll32.exe. Attackers may exploit wermgr.exe to conceal their actions, invoking these processes to manipulate system behaviors, escalate privileges, or exfiltrate data with obfuscation.

  The relevant MITRE ATT&CK techniques include Defense Evasion (T1083), Privilege Escalation (T1055), and Process Injection (T1036). The primary telemetry comes from process creation events, specifically Windows Event ID 4688. If the alert is confirmed as malicious, there is a significant risk of further exploitation of the affected system, potential data breaches, or lateral movement within the network.

  This detection does NOT confirm malicious activity on its own; it must be correlated with additional context to ascertain intent and impact.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Windows Security Event ID 4688 for the parent process (wermgr.exe) and its child processes. Filter for suspicious command lines indicating potential exploitation (e.g., flags with rundll32 or script execution).

  - **Analyze Command Line Arguments**: Validate command line arguments associated with child processes (e.g., `-queuereporting`, `-responsepester`). Legitimate usage of wermgr.exe typically does not include such parameters.

  - **Correlate with Known Indicators**: Cross-reference other telemetry sources, such as Sysmon logs (Event ID 1), to identify any known malicious command executions linked to this behavior, especially in the context of recent threat actor TTPs.

  - **Identify Expected Behaviors**: Determine if the process was spawned in response to a known system event (e.g., a legitimate Windows error report) to distinguish between benign and malicious activity.

  - **Check Process Hierarchy**: Review the parent-child process relationship via Sysmon or Windows Event logs to establish context. Legitimate child processes should maintain common usage patterns instead of launching obfuscated scripts or networks commands unexpectedly.

  - **Look for Additional Artifacts**: Search for file creations related to these processes, such as unusual outputs generated from cmd.exe or PowerShell. Unexpected script executions or downloads may indicate an ongoing attack.

  ### Prioritization

  This alert holds a high severity due to the sensitive nature of the Windows Error Reporting system being misused to execute potentially harmful processes. The likelihood of this behavior being weaponized is notable, given recent trends in adversary tactics to employ system tools for malicious purposes. Effective containment and investigation are necessary to mitigate possible impacts on critical assets.

  ### Blind Spots and Assumptions

  The detection may be bypassed if an adversary is able to execute approved scripts or tools, rendering benign processes indistinguishable from malicious ones. Reliable detection necessitates comprehensive logging, particularly for PowerShell activity and script executions, to identify context adequately. Legitimate activities, such as troubleshooting or automated system recovery functions, might trigger this alert. A related detection could include monitoring for unusual parent-child relationships among other system-level processes, strengthening coverage against potential abuse.

