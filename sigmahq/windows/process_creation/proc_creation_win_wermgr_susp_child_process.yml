logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\wermgr.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\ipconfig.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\systeminfo.exe'
    - '\whoami.exe'
    - '\wscript.exe'
  filter_main_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'C:\Windows\system32\WerConCpl.dll'
    - 'LaunchErcApp '
    CommandLine|contains:
    - '-queuereporting'
    - '-responsepester'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes initiated by the Windows Error Reporting manager (wermgr.exe). When attackers execute malicious code, they may use legitimate processes like wermgr.exe as a cover to spawn potentially harmful child processes such as cmd.exe or PowerShell. The goal is typically to initiate further actions, such as privilege escalation, data extraction, or lateral movement, while evading detection by using trusted system processes.

  The techniques being addressed by this rule fall primarily under the MITRE ATT&CK frameworks such as "Defense Evasion" (T1203) and "Privilege Escalation" (T1068). Specifically, attackers may use this method (T1055 for the use of process injection) to hide their actions within the legitimate context of system processes. The primary data sources necessary for this detection are process creation events and Windows event logs, which capture the parent-child relationships of processes executed on the system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the logs of the process creation events to identify instances of wermgr.exe initiating suspicious child processes. Focus on any uncommon command lines associated with these child processes.
  - **Analyze Parent-Child Relationships**: Check the parent-child dynamics involving wermgr.exe. Look for instances where known benign processes are spawning children that are typically associated with malicious activities, such as cmd.exe or PowerShell.
  - **Collect Command Line Arguments**: Examine the command line arguments of the detected child processes. Pay particular attention to those that include keywords like ‘-queuereporting’ or ‘-responsepester’, as they may indicate exploitation attempts.
  - **Correlate with Other Logs**: Cross-reference findings with other logs, such as network traffic data or user activity within Windows Event logs, to identify any related malicious activities or patterns of behavior.

  ### Prioritization
  The alert is classified as high severity due to the potential for significant impacts on the enterprise network. Malicious child processes initiated by trusted system processes can indicate advanced threat actor activities, including lateral movements and data exfiltration, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the environments do not have comprehensive logging enabled for process creation events or if certain benign processes are misidentified as harmful. This detection logic assumes that wermgr.exe is not being misused in legitimate ways by other applications. Moreover, proper log configurations are required in Windows to ensure full visibility into process creation events, including detailed command line arguments.

