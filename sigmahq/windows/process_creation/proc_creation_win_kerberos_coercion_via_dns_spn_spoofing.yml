note: |
  ### Technical Context

  This Sigma rule detects attempts to perform Kerberos coercion attacks by identifying specific patterns in command line arguments. The behavior observed typically involves adversaries spoofing Service Principal Names (SPNs) using manipulated DNS entries to redirect Kerberos authentication requests to an attacker-controlled host. The likely objective is to gain unauthorized access or escalate privileges by coercing legitimate users’ authentication towards malicious endpoints.

  The detection aligns with the MITRE ATT&CK tactic for Credential Access (T1557) and the technique for Kerberos Coercion (T1187). Primary telemetry sources include Windows process creation logs that capture command line arguments, specifically monitoring for command lines containing "UWhRCA" and "BAAAA." A successful exploitation could lead to unauthorized access to sensitive systems and resources. This detection does NOT confirm that a compromise has occurred; it only signals the presence of potentially malicious activities.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs for command line arguments containing "UWhRCA" and "BAAAA" to identify the origin of the activity. Note timestamps and user context for further investigation.

  - **Validate the legitimacy of the process:** Look for the parent process and user executing the command. If the parent process is `nslookup` or a similarly relevant tool and the user has legitimate administrative access, it may be a benign legitimate behavior.

  - **Analyze DNS queries made around the timing:** Use relevant DNS logs to check for requests to the spoofed SPNs. Cross-reference queried SPNs against expected domain service accounts to identify anomalies.

  - **Correlate with authentication logs:** Examine Security Event ID 4768 and 4769 for unusual Kerberos Ticket Granting Ticket (TGT) requests and service ticket requests correlating with the timeframe of the process creation event.

  - **Identify high-confidence malicious indicators:** If the detected command execution was followed by a series of TGT requests from non-standard or unexpected service accounts or hosts, consider this as high confidence of malicious intent.

  - **Review for related AT&T activity:** Check for related alerts or logs that match with credential acquisition mechanisms such as NTLM relay. Monitoring Event ID 4624 for logon events following the suspicious process creation can further validate compromised credentials.

  ### Prioritization

  This alert should be triaged with high priority due to the inherent risk associated with Kerberos coercion attacks. The criticality of the affected systems, potential for unauthorized access, and the increasing trend of attackers leveraging such techniques warrant immediate attention. This behavior is often weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  One detectable limitation is the reliance on the presence of command line arguments; if a technique is executed without these specific patterns, it may bypass detection. Proper DNS logging must be enabled, and thorough monitoring of command line arguments should be implemented for accurate detection. Legitimate administrative tasks performed for DNS configuration or maintenance could unintentionally trigger this alert. Companion detections include monitoring external DNS resolution patterns (e.g., malicious domain access) to enhance detection coverage related to Kerberos attacks.

