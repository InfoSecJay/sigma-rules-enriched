  ### Technical Context
  This rule is designed to detect potential Remote Desktop Protocol (RDP) session hijacking via MSTSC (Microsoft Terminal Services Client) shadowing. RDP session hijacking can covertly allow an unauthorized user to observe or interact with a current active RDP session, which may result in sensitive information exposure or unauthorized actions performed on behalf of the user. Attackers employing this technique might aim to gain access to sensitive systems, escalate privileges, or engage in data exfiltration without the user's knowledge, making this a serious threat.

  The relevant MITRE ATT&CK tactics that apply to this detection include **Lateral Movement** (TA-0008) and the specific technique of **RDP Hijacking** (T1563.002). Successful lateral movement can give attackers greater foothold in an environment, allowing them to access additional systems and sensitive information.

  The primary data source for this detection is **process creation events**, particularly monitoring for specific command line arguments used in MSTSC shadowing, which include flags like `noconsentprompt` and the use of the `shadow:` keyword. This will help identify when a shadowing session is initiated, which may indicate potential unauthorized RDP activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation logs for instances of MSTSC being executed with suspicious command line arguments containing `noconsentprompt` and `shadow:`. This can reveal attempts to hijack RDP sessions.

  - **Check User Session Activity**: Validate user RDP session activities in your logging mechanism to determine whether the session currently in use corresponds to legitimate user actions or appears to be manipulated.

  - **Analyze Network Connections**: Examine the network traffic related to RDP, focusing on any unauthorized IP addresses or unusual patterns in established connections that may indicate an active attack vector.

  - **Cross-Reference with User Behavior**: Compare the detected shadowing attempts against user behavior analytics. Investigate any anomalies associated with user login times or locations, as these can help flag compromised accounts.

  ### Prioritization
  Given the potential for unauthorized access and the serious implications of session hijacking, this alert should be classified as high severity. The likelihood of exploitation is moderate, particularly in environments that heavily rely on RDP for remote access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where logging is not sufficiently configured to capture detailed process creation events, specifically those associated with MSTSC operations. The detection logic assumes that RDP shadowing is unauthorized and that legitimate users do not initiate shadowing sessions with the specified command line options. Additionally, this rule will require appropriate configurations across Windows logging mechanisms to ensure relevant telemetry is being captured for effective detection.

