  ### Technical Context

  This rule detects the execution of Microsoft Remote Desktop Protocol (RDP) session shadowing with the use of the 'noconsentprompt' command-line argument. This behavior suggests an unauthorized attempt to hijack an active RDP session on a Windows system. The likely attacker objective behind this action is to gain covert access to a user's session without their consent, facilitating data theft or further lateral movement within the network. Relevant MITRE ATT&CK tactic and technique include "Lateral Movement" (TA-0008) and "Remote Desktop Protocol" (T1563.002).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If this behavior is malicious, it could lead to unauthorized access to sensitive data or critical systems. Importantly, this detection does NOT confirm whether the action was successful or whether the session owner's consent was bypassed without additional context.

  ### Investigation Steps

  - **Check command line arguments for shadowing:** Review Security Event ID 4688 or Sysmon Event ID 1 for processes that include 'noconsentprompt' and 'shadow:' in their command line. A benign indicator would be the absence of these arguments in legitimate RDP activities.

  - **Identify user context and session activity:** Correlate user accounts with RDP session logs (Event ID 4624 for logon events) within a relevant timeframe to determine if the user initiated an RDP session. Legitimate RDP session shadowing typically involves clear consent prompt behavior.

  - **Examine associated network activity:** Inspect network traffic logs (such as Windows Firewall or VPN logs) for unusual RDP connections from the host to external IP addresses that may indicate unauthorized attempts to access the system.

  - **Review recent changes in user permissions:** Check Directory Service logs for modifications to user group memberships or permissions that might indicate escalation of privileges leading up to shadowing attempts.

  - **Look for process parentage:** Investigate if the detected RDP shadowing process is spawned from a legitimate user session or from a potentially malicious process, using Sysmon Event ID 1’s ParentProcessID field for context.

  ### Prioritization

  The severity of this alert is high due to its potential impact on sensitive information and the risk of lateral movement across the enterprise network. The ability to hijack a user's session is commonly weaponized by adversaries to facilitate espionage or exfiltrate data. Given the context, such behavior should be considered with urgency, especially on critical assets.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of log sources if Sysmon or logging level isn't configured to capture detailed process creation events. Evasion techniques may include using tools that obscure command line arguments or legitimate administrative actions that utilize RDP shadowing for monitoring. Furthermore, tasks such as remote support or authorized maintenance may trigger the alert. A related detection to reinforce coverage is monitoring for sudden changes in user account activities (e.g., Event ID 4726 for user account deletion) that could indicate misuse of accounts prior to session hijacking attempts.

