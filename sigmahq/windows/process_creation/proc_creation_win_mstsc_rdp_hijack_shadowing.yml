  ### Technical Context

  This rule detects the execution of Microsoft Terminal Services Client (MSTSC) with specific command-line parameters that indicate possible Remote Desktop Protocol (RDP) session hijacking through shadowing. The likely attacker objective is to gain unauthorized access to an active RDP session, potentially allowing them to observe or control a user's session without their consent. This behavior aligns with the MITRE ATT&CK framework under the tactic of Lateral Movement and the technique ID T1563.002 (Remote Services: Remote Desktop Protocol).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which provides details on command-line arguments used when processes are created. If malicious, the security impact could result in data breaches or unauthorized control of sensitive operations on the affected system. This detection does NOT confirm that the session hijacking was successful or that the user was compromised without further corroborative evidence.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 to identify the exact command line of MSTSC. Look for entries containing `'noconsentprompt'` and `'shadow:'`. Indicators of malicious behavior include anomalous usage from non-administrative accounts or unusual hours.

  - **Cross-check user sessions:** Use Remote Desktop Session Host logs to confirm if the session being shadowed is active and belonged to a legitimate user. Verify if the user authorized the shadowing session; unexpected initiations may indicate malicious intent.

  - **Identify legitimate use cases:** Note that IT support teams often use MSTSC shadowing for assisting users. Assess if this activity aligns with established IT policies and authorized personnel. Expected usage should include appropriate advance notification to the user.

  - **Check for repeated occurrences:** Search for related events (e.g., multiple shadowing attempts) across relevant time frames using cumulative logs. Frequent unauthorized attempts can indicate a more severe and ongoing threat.

  - **Analyze for privilege escalation:** Investigate the permissions of the initiating account and check if it has justifiable access rights for shadowing. Unauthorized privilege escalation attempts may be indicated by unusual group memberships before the shadowing event.

  - **Audit system integrity:** Ensure that no additional indicators of compromise (IoCs) such as malware, backdoors, or unusual outbound connections exist on the affected host. This can include a search for newly created files or unexpected network traffic to external IP addresses.

  ---

  ### Prioritization

  This alert is of **high severity** due to the sensitive nature of RDP access and the potential impact of session hijacking on critical infrastructure. The likelihood of malicious abuse is considerable, as RDP shadowing is a known technique for attackers looking to exploit sessions. Such behavior is also commonly weaponized in targeted attacks, making timely investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like legitimate IT personnel conducting shadowing for authorized help sessions, which may trigger false positives. Reliable detection requires proper logging configurations, specifically enabling detailed process creation logging across the environment. Legitimate activities that may trigger this alert include technical support tasks. A related detection to strengthen coverage could involve monitoring for anomalous RDP connection attempts (T1021.001), ensuring better visibility into lateral movement risks.

