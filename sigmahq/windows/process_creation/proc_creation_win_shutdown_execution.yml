  ---

  ### Technical Context

  This rule detects the execution of the `shutdown.exe` process with command-line arguments that indicate a system shutdown or reboot (`/r` for restart and `/s` for shutdown). The behavior typically aligns with adversary objectives such as disrupting operational continuity or covering tracks by shutting down systems post-exploitation. The relevant MITRE ATT&CK tactic here is "Impact" and technique "System Shutdown/Reboot" (T1529).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the detected activity is malicious, it may compromise system availability and lead to data loss or operational disruptions. Significantly, this detection does NOT confirm malicious intent solely based on the execution of `shutdown.exe` — legitimate administrative actions could trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for the execution of `shutdown.exe` with parameters `/r` or `/s` from suspicious or unauthenticated user accounts.

  - **Analyze command-line arguments:** Verify if the command-line arguments include `/m` to target remote systems. Legitimate IT staff generally do not target remote systems without clear justification.

  - **Check user accounts:** Identify the user account initiating the shutdown. Accounts with administrative privileges executing shutdown commands should be scrutinized for justification or associated legitimate activity.

  - **Identify successful shutdown events:** Look at Event ID 4647 (User initiated logoff) or Event ID 6006 (Event log service shut down) to correlate user actions with the shutdown. A significant delay or unusual timing could indicate malicious intent.

  - **Validate recent system changes:** In remote administration scenarios, ensure that standard maintenance cycles align with detected reboots. Unscheduled actions in high-traffic systems can indicate potential threat actor activity.

  - **Correlate with additional artifacts:** Investigate other event logs related to the affected system, such as Event ID 6005 (Event log service start) to see what processes or user sessions were active before the shutdown occurred.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on business operations and a moderate likelihood of malicious abuse. Shutdown/reboot behavior is often employed by attackers to disrupt services or as part of a broader tactic to evade detection after an intrusion.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if logging is not consistently configured, as `shutdown.exe` behavior can also be employed by legitimate system administrators during routine maintenance. Therefore, ensuring complete monitoring of Windows security logs is crucial. Additionally, malicious incidents may involve the use of other legitimate system tools or administrative scripts that could mask these behaviors. A related detection to consider is monitoring for the unauthorized use of remote administrative tools that may indicate prior compromise before a shutdown occurs.

