detection:
  selection_img:
  - OriginalFileName: 'wmic.exe'
  - Image|endswith: '\WMIC.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' service '
    - ' call '
    CommandLine|contains:
    - 'stopservice'
    - 'startservice'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of `wmic.exe` (Windows Management Instrumentation Command-line Tool) to start or stop a service on a Windows system. The detection logic focuses on command line inputs that invoke service start or stop operations through this utility. This could indicate an attacker attempting to manipulate system services—either to stop security services, create persistence mechanisms, or facilitate lateral movement within an environment.

  The threat scenario typically involves an adversary seeking to gain control over a system's services, possibly after having established a foothold through other means (e.g., phishing, exploitation). The objectives may include disabling security measures, creating new services for malicious software deployment, or leveraging services for lateral movement. Key MITRE ATT&CK tactics applicable to this rule include Execution (T1203) for manipulations using `wmic`, and Persistence (T1047) through malicious service management.

  The primary data sources for detecting this behavior include process creation logs that indicate the invocation of `wmic.exe`, as these logs capture command line arguments that specify whether services are being started or stopped.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `wmic.exe` execution, focusing on command line arguments that contain "service", "call", "stopservice", or "startservice".
  - **Correlate Event Context:** Investigate the context of the process creation events, such as the user who executed the command, the time of execution, and preceding events that might show suspicious activity.
  - **Check Service Status:** Use PowerShell or Windows Service Management tools to check the current status of services that were started or stopped, verifying if any unexpected changes occurred.
  - **Assess System Integrity:** Evaluate the system for other signs of compromise by looking for unexpected service installations, alterations in service configurations, or matching this activity with other alerts from security solutions.

  ### Prioritization
  This alert should be considered medium priority due to the potential for significant impact on system security if an adversary successfully manipulates services. The likelihood of this technique being employed in real-world attacks, particularly in environments lacking adequate defenses, reinforces the need for prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if auditing for process creation events is not enabled on the endpoints in question. The assumption is made that an attacker will use `wmic.exe` for their activities; other methods of service control may not be adequately covered. Required configurations include enabling detailed logging of process creation and possibly monitoring for other methods of service manipulation beyond `wmic.exe` to ensure comprehensive detection.

