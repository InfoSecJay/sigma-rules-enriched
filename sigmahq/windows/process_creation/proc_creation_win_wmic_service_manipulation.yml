detection:
  selection_img:
  - OriginalFileName: 'wmic.exe'
  - Image|endswith: '\WMIC.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' service '
    - ' call '
    CommandLine|contains:
    - 'stopservice'
    - 'startservice'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the usage of `wmic.exe` to start or stop a Windows service, which may indicate privilege escalation or service manipulation by an unauthorized user. The likely attacker objective is to manipulate system services for persistence, disruption, or to evade detection mechanisms. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0040) and the technique "Command and Control via Service" (T1047).

  The primary telemetry sources for this detection are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log details about processes being created, including command line arguments. If the behavior is malicious, it could lead to unauthorized changes to critical system services, posing a security risk. Importantly, this detection does not confirm that malicious activity is occurring on its own, as there may be legitimate administrative use cases for service management.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `wmic.exe` being executed with command line arguments that include 'service' and either 'stopservice' or 'startservice'. Look for anomalies, such as execution by non-administrative accounts.

  - **Review associated events for context:** Cross-reference Event ID 7045 (Service Created) logs to determine if any services have been newly created or altered in proximity to the `wmic.exe` execution. This could indicate that an attacker is attempting to establish persistence.

  - **Identify legitimate service manipulations:** Look for common service management activities from known admin users, focusing on context such as time of day, user account activities, and previously established maintenance windows to differentiate benign behavior.

  - **Evaluate command line arguments:** If other command-line arguments are present within the `wmic.exe` execution logs that do not fit typical service management tasks, mark them as suspicious. Unusual commands may indicate subversion of normal operations.

  - **Check for known malicious indicators:** Specifically search for instances of service names that are commonly abused for persistence, such as "RemoteAccess" or "MyService," within the logs referenced. Review any service manipulation activities related to these names.

  ### Prioritization

  This alert holds medium severity as the impacted systems may harbor critical service dependencies. The likelihood of this behavior being malicious is considerable, especially if it appears outside of normal administrative activity. This technique is documented in multiple attack patterns, making it a potentially actionable threat vector.

  ### Blind Spots and Assumptions

  Evasion techniques such as utilizing PowerShell or other tools for starting/stopping services may bypass this detection. Reliable detection requires that Sysmon and sufficient logging levels (including process creation logs) are properly configured and enabled on all endpoints. Legitimate administrative activities, such as scheduled maintenance tasks run by system administrators, could trigger this alert. Companion detections for service creation (Event ID 7045) can enhance overall coverage and provide broader context for evaluation.

