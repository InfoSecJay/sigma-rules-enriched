note: |
  ### Technical Context

  This rule detects the execution of the Windows Problem Steps Recorder (psr.exe), a tool that records user actions and screens, often used for troubleshooting but can be exploited for malicious purposes such as reconnaissance and information gathering. An attacker may use psr.exe to capture sensitive screen data or user interactions to facilitate further exploitation. The relevant MITRE ATT&CK tactic is "Collection" and the technique is "Screen Capture" (T1113).

  Primary telemetry sources include process creation events (Security Event ID 4688 and Sysmon Event ID 1) which capture when psr.exe is invoked, along with the command-line arguments used. If malicious, this could enable attackers to gather sensitive information unobtrusively. However, this detection alone does not confirm malicious intent, as legitimate administrative activities or user troubleshooting might invoke the same behavior.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Security Event ID 4688 or Sysmon Event ID 1 for the execution of psr.exe. Look for command line parameters including '/start' or '-start' to identify intended usage.

  - **Analyze Command Line Arguments**: Examine the command line for any suspicious flags or file output options, which may indicate an attempt to exfiltrate screen data rather than legitimate troubleshooting.

  - **Identify User Context**: Determine the user and system context under which psr.exe was executed. Legitimate usage typically comes from a known administrative user during a support session on a non-critical system.

  - **Correlate with Additional Logs**: Review logins or administrative activity in application logs to identify if the execution of psr.exe was part of a broader activity, such as known troubleshooting or a support call, or if it occurred outside normal work hours.

  - **Check for Output Files**: Inspect for any generated output files (e.g., .zip or .mht files) in common directories like 'Documents' or 'Desktop'. Presence of unintended files could suggest malicious behavior.

  ### Prioritization

  This alert should be considered medium severity due to the nature of psr.exe; while it can be used legitimately for troubleshooting, its ability to capture sensitive information poses a risk. The likelihood of abuse exists given the increasing sophistication of adversaries who leverage such tools during reconnaissance.

  ### Blind Spots and Assumptions

  Detection may be limited by security configurations that don't log all process creations or fail to capture command-line details accurately. Legitimate activities, such as support sessions or user error reporting, may trigger this alert. A companion detection to consider would be monitoring remote access tools or administrative tool usage, which could strengthen coverage against potential misuse involving psr.exe.

