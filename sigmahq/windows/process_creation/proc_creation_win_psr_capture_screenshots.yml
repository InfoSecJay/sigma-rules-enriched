note: |
  ### Technical Context
  This detection rule identifies the execution of the Windows Problem Steps Recorder (psr.exe), a tool typically used for capturing user interactions on the screen. While legitimate users may utilize this utility for troubleshooting or demonstrating software issues, it can also be exploited by attackers to record sensitive information displayed on a user’s screen, such as credentials or confidential data. Understanding this threat is crucial, as it indicates potential malicious activity occurring within an enterprise environment.

  The primary attacker objectives associated with using psr.exe may include data exfiltration or reconnaissance, allowing them to gather valuable information about a system or user behavior. This technique falls under the MITRE ATT&CK framework, specifically in the collection tactic (T1113: Screen Capture). Proper detection and response to this activity can help mitigate the risk of data breaches stemming from inadvertent or unauthorized data access.

  To effectively monitor for this threat, logs from process creation events will be critical, as these logs provide detailed information regarding the executed commands and parameters, helping to identify unauthorized or suspicious usage of psr.exe.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation events for instances of psr.exe execution, paying particular attention to the command line arguments used. Look for variations that might indicate suspicious activity and note the context in which they were executed.

  - **Analyze User Behavior:** Investigate the user account that initiated the psr.exe execution. Determine whether this user typically uses this tool and if the activity aligns with their normal behavior.

  - **Correlate with Other Security Events:** Look for additional events that may indicate malicious intent, such as preceding or subsequent suspicious account activity, or other tools employed for screen capture or data exfiltration.

  - **Examine Network Activity:** If possible, check for signs of data being exfiltrated after the execution of psr.exe. This could include unusual outbound connections or data transfers that align with the timeframe of the screen recording.

  ### Prioritization
  Alerts triggered by the execution of psr.exe should be treated with medium priority due to the potential for misuse in capturing sensitive information and the likelihood that unauthorized users could leverage the tool for malicious purposes within the organization.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of psr.exe activity, particularly if the perpetrator has disabled logging or altered the command parameters to evade detection. The assumption is that process creation logs are available and configured correctly—in environments where such logging is disabled or incomplete, the detection may fail. Additionally, users with legitimate purposes for utilizing psr.exe may produce false positives, necessitating careful investigation to assess the context of each alert generated.

