title: Potential Powershell ReverseShell Connection
id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
status: stable
description: Detects usage of the "TcpClient" class. Which can be abused to 
  establish remote connections and reverse-shells. As seen used by the Nishang 
  "Invoke-PowerShellTcpOneLine" reverse shell and other.
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Shells/Invoke-PowerShellTcpOneLine.ps1
author: FPT.EagleEye, wagga, Nasreddine Bencherchali (Nextron Systems)
date: 2021-03-03
modified: 2023-04-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' Net.Sockets.TCPClient'
    - '.GetStream('
    - '.Write('
  condition: all of selection_*
falsepositives:
- In rare administrative cases, this function might be used to check network 
  connectivity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the .NET `TcpClient` class within PowerShell, which can be exploited by adversaries to establish reverse shell connections. The likely attacker objective is to gain unauthorized remote access to systems, allowing for command and control (C2) capabilities. This behavior aligns with the MITRE ATT&CK technique for PowerShell execution (T1059.001). The primary telemetry source to monitor is Windows process creation events, specifically Security Event ID 4688 for process creation details.

  If malicious, a successful invocation of this reverse shell allows the attacker to execute commands on the target system, leading to potential data theft, system compromise, and lateral movement. Notably, this detection alone does not confirm that a successful breach has occurred; further evidence is required to ascertain malicious intent.

  ### Investigation Steps

  - **Inspect recent PowerShell process creation events:** Analyze Security Event ID 4688 for any PowerShell processes. Focus on events with a command line containing `Net.Sockets.TCPClient`, ensuring to note any unusual parameters or contexts.

  - **Check for non-standard application behavior:** Review the command line arguments of any involved PowerShell processes. Look for unexpected usages of `.GetStream(` and `.Write(`. Legitimate usage might include standard administrative tasks without malicious intent.

  - **Analyze device communication logs:** Examine outbound connections or network logs to see if connections were made to unusual external IP addresses following the trigger event. This can indicate potential callbacks to an attacker-controlled server.

  - **Review system and user context:** Verify the context under which the PowerShell command was run. If executed by a non-admin user or during atypical hours, it may indicate malicious intent. Review Event ID 4648 for any credential use events.

  - **Validate against internal pen test findings:** Cross-reference the detection against any recent penetration tests or authorized activities. If similar PowerShell scripts were utilized under controlled conditions, it may suggest benign activity rather than a breach.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems and the likelihood that the behavior can be weaponized for unauthorized access. Given the simplicity of establishing reverse shells, this technique is frequently employed by attackers and should be investigated promptly.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation or alternate methods used to establish reverse shells, such as using different classes or programming languages. Reliable detection requires comprehensive logging of PowerShell activity; ensure PowerShell transcription logging is enabled. Legitimate administrative scripts might trigger similar alerts, especially during system maintenance or connectivity checks. Additional companion detections, such as monitoring for unusual outbound network connections, strengthen overall coverage.

