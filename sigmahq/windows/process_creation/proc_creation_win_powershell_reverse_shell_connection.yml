detection:
  selection_img:
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' Net.Sockets.TCPClient'
    - '.GetStream('
    - '.Write('
  condition: all of selection_*
falsepositives:
- In rare administrative cases, this function might be used to check network connectivity
level: high
note: |
  ### Technical Context
  This rule detects the potential use of the "TcpClient" class in PowerShell, which can be exploited by attackers to establish reverse shell connections. This type of activity may indicate an ongoing compromise, as adversaries often use reverse shells to maintain remote access to a compromised machine. The detection logic specifically targets PowerShell executions that include functions typically associated with reverse shells, such as `GetStream` and `Write`, which facilitate data transmission between the compromised host and the attacker's infrastructure.

  The relevant MITRE ATT&CK tactics involved in this scenario include **Execution (TA0002)** and **Command and Control (TA0011)**. The specific technique applicable here is **PowerShell (T1059.001)**, which describes a method of executing malicious code through PowerShell commands. Primary data sources that can provide evidence of this potentially malicious behavior include Windows process creation events, which log new process instances, along with details of their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for any instances of PowerShell or pwsh.exe executing with the detected command-line patterns associated with `TcpClient`. This is the primary evidence of potential reverse shell activity.

  - **Analyze Network Connections:** Investigate any outbound network connections initiated from the identified PowerShell processes. Check for unexpected communication to external IP addresses, which may indicate data exfiltration or contact with malicious command-and-control servers.

  - **Check for Anomalous Activity:** Look for unusual PowerShell invocations or patterns that deviate from typical administrative usage, particularly those occurring after hours or from uncommon hosts within your network.

  - **Correlate with Other Logs:** Integrate findings from other security logs, such as endpoint detection and response (EDR) alerts or firewall logs, to establish a broader context of the incident and identify any lateral movement or other signs of compromise.

  ### Prioritization
  This alert is categorized as high severity due to the potential for substantial impact on enterprise security if an attacker successfully establishes a reverse shell. The likelihood of such threats is heightened by the increasing prevalence of public exploits targeting PowerShell usage in attacks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where PowerShell is used legitimately for administrative tasks that could also utilize TcpClient, thereby generating false positives. The detection logic assumes that the monitored systems are logging adequate process creation events, and it requires comprehensive logging configurations to capture command-line arguments effectively. Additionally, organizations should be aware of any use of PowerShell for legitimate network connectivity checks, as these may lead to false flags in the detection.

