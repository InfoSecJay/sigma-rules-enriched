logsource:
  category: process_creation
  product: windows
detection:
  system_utility:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  parent_is_settingsynchost:
    ParentCommandLine|contains|all:
    - 'cmd.exe /c'
    - 'RoamDiag.cmd'
    - '-outputpath'
  condition: not system_utility and parent_is_settingsynchost
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of a potentially malicious binary initiated by SettingSyncHost.exe, often used as a living-off-the-land binary (LOLBin) to mask nefarious activities. The likely attacker objective is to bypass security controls and execute code with the privileges of a trusted system process, aiding in persistence and execution of payloads. The relevant MITRE ATT&CK tactics are **Execution** (TA0002) and **Privilege Escalation** (TA0004) with the technique of **Using System Utilities** (T1574.008).

  The primary telemetry sources required for this detection include process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity can lead to further system compromise, data exfiltration, or elevation of privileges. Notably, this detection alone does not confirm malicious intent; it may also capture legitimate use of SettingSyncHost.exe for valid administrative tasks.

  ### Investigation Steps

  - **Identify the process creation event**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the detected binary, focusing on the `NewProcessName` field to find instances of suspected binaries initiated by SettingSyncHost.exe.

  - **Analyze the parent process origin**: Review the `ParentProcessId` and `ParentCommandLine` fields in process creation events to verify if the parent process is SettingSyncHost.exe and whether it includes command line arguments like `cmd.exe /c` and `RoamDiag.cmd`.

  - **Look for suspicious command line arguments**: Specifically scrutinize any command line that executed non-standard binaries or scripts using SettingSyncHost.exe, as legitimate uses generally do not leverage such arguments in this manner.

  - **Correlate with other telemetry**: Cross-reference network logs (e.g., firewall or proxy logs) for any outbound connections that correspond with the execution timestamp, focusing on suspicious IPs or domains added during the same time frame.

  - **Review legitimate use cases**: Identify instances of SettingSyncHost.exe executed without suspicious command line arguments or in conjunction with known administrative tasks such as group policy updates or application installations.

  - **Document any anomalous behavior**: If found, note any high-confidence malicious indicators, such as unusual file paths for executed binaries or processes designed to interact with sensitive system areas, which deviate from expected behavior based on host roles or asset criticality.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems if exploited, as this behavior could enable attackers to gain control over the system or escalate privileges. The likelihood of malicious abuse is significant, as using LOLBins like SettingSyncHost.exe for exploitation is a common technique among adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for skilled adversaries to obfuscate their techniques by using legitimate binaries in unexpected ways. Reliable detection depends on maintaining comprehensive process creation logs and Sysmon configurations. Additionally, legitimate automation scripts or administrative actions may trigger this alert if they invoke SettingSyncHost.exe with similar command line constructions. A related detection method may involve monitoring for suspicious child processes of other known system utilities for enhanced coverage.

