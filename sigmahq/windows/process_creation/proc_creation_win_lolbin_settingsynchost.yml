logsource:
  category: process_creation
  product: windows
detection:
  system_utility:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  parent_is_settingsynchost:
    ParentCommandLine|contains|all:
    - 'cmd.exe /c'
    - 'RoamDiag.cmd'
    - '-outputpath'
  condition: not system_utility and parent_is_settingsynchost
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the misuse of `SettingSyncHost.exe`, a legitimate Windows process, as a launch point for executing malicious payloads. Attackers often leverage legitimate system utilities (also known as Living-off-the-Land Binaries or LOLBins) to evade detection while carrying out nefarious activities, such as privilege escalation, persistence, or executing unauthorized commands. By executing malicious commands through a trusted process, adversaries can effectively blend into normal system activity, significantly complicating forensic investigations and response efforts.

  This technique aligns with several MITRE ATT&CK tactics, primarily focusing on **Execution (T1203)** and **Defense Evasion (T1574.008)**. The use of `SettingSyncHost.exe` could suggest a broader attempt to maintain persistence (T1547.001) or perform privilege escalation (T1068) by allowing an attacker to execute arbitrary commands using a trusted Windows component. The main data sources for monitoring this activity include process creation events that can reveal command lines used to launch binaries, facilitating the identification of any anomalous behavior invoking `SettingSyncHost.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate recent process creation logs to identify instances where `SettingSyncHost.exe` was used as a parent process. Look for unusual child processes that may indicate malicious activity.

  - **Analyze Command Line Arguments:** Examine any command line arguments associated with `SettingSyncHost.exe` to identify potentially suspicious commands, especially those invoking scripts or batch files not typical for legitimate usage.

  - **Cross-Reference with Known Good:** Compare the detected commands against known good usage patterns for `SettingSyncHost.exe` within your organizational environment to discern legitimate use from possible abuse.

  - **Assess User Privileges:** Check the user context under which the invocations of `SettingSyncHost.exe` occurred. Look for any patterns suggesting privilege escalation or manipulation by accounts that typically do not perform such actions.

  ### Prioritization
  Given the potential for significant impact associated with privilege escalation and undetected persistence, this alert is categorized as high severity. The likelihood of an attacker successfully executing malicious commands while evading detection using a legitimate system utility further underscores the need for prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logging levels do not capture all relevant process creation events or if monitoring is not comprehensive across all endpoints. Additionally, the detection logic assumes a concentration on `SettingSyncHost.exe`, overlooking broader LOLBin techniques that may employ other benign executables for malicious purposes. Adequate configuration of process logging, including command line arguments in Windows Event Logs, is required for effective detection of this activity.

