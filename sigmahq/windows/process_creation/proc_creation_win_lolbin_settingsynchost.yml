detection:
  system_utility:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  parent_is_settingsynchost:
    ParentCommandLine|contains|all:
    - 'cmd.exe /c'
    - 'RoamDiag.cmd'
    - '-outputpath'
  condition: not system_utility and parent_is_settingsynchost
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects processes being executed without appropriate permissions via the `SettingSyncHost.exe` executable as a living-off-the-land binary (LOLBin). Attackers might use this technique to execute unauthorized programs while remaining unnoticed by leveraging the trusted system utility. The likely attacker objective is privilege escalation or persistence within the environment, allowing them to carry out malicious actions while camouflaged.

  Relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003), Execution (TA0002), and specifically the technique of Abuse Elevation Control Mechanism (T1574.008). Primary telemetry sources for this detection are Windows process creation logs, specifically Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation). A successful misuse of this command can lead to significant data exposure or system compromise. Importantly, this detection does NOT confirm malicious intent on its own; it merely identifies suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check related process creation events**: Review Windows Security Event ID 4688 for the execution timestamp of the detected process. Compare the command line and parent process information to identify expected vs. unexpected usage of `SettingSyncHost.exe`.

  - **Validate parent process indicators**: Investigate the parent process using `SettingSyncHost.exe`, confirming if it was initiated with legitimate command-line arguments involving `cmd.exe /c`, `RoamDiag.cmd`, and `-outputpath`. Legitimate usage typically does not lead to new executable creations directly.

  - **Correlate with additional telemetry**: Gather Sysmon Event ID 1 and NTP log data for any anomalies. Look for unusual paths or creation of new executables that could indicate malicious activity post-utilization of `SettingSyncHost.exe`.

  - **Assess implications of affected assets**: Determine the role of the affected system, prioritizing critical servers and endpoints. Assess whether this behavior is linked with administrator privileges or sensitive data access, heightening the risk.

  - **Identify high-confidence malicious indicators**: Look for the execution of known malicious binaries spawned from `SettingSyncHost.exe` with suspicious attributes (e.g., execution from `C:\Temp` or similar non-standard directories).

  - **Document expected legitimate behavior**: Typical legitimate behavior for `SettingSyncHost.exe` revolves around syncing user settings and should not invoke other executables under anomalous conditions. Logging activity related to user profile settings will help establish a baseline.

  ### Prioritization

  This alert is high_priority due to its potential impact on sensitive systems and data. The likelihood of malicious abuse is considerable, as the use of LOLBin techniques is increasingly common among attackers to maintain covert access and persistence in environments.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers modify paths or utilize altered versions of `SettingSyncHost.exe`. Reliable detection requires comprehensive Windows process logging and Sysmon configurations to capture the complete context of process creation. Legitimate administrative activities or software updates may inadvertently trigger this detection. A related detection worth monitoring is the use of `Powershell` within `SettingSyncHost.exe` command lines, as it may increase rights without authentication.

