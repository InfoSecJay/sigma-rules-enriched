title: Potential Cookies Session Hijacking
id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
status: test
description: Detects execution of "curl.exe" with the "-c" flag in order to save cookie
  data.
references:
- https://curl.se/docs/manpage.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
  - CommandLine|re: '\s-c\s'
  - CommandLine|contains: '--cookie-jar'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_cookie_hijacking/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of the `curl.exe` command with the `-c` or `--cookie-jar` flags, which indicates the potential for session hijacking through cookie manipulation. Attackers may leverage this behavior to extract and save session cookies from web browsers or other applications in order to impersonate legitimate users and gain unauthorized access to sensitive systems or accounts. This technique can serve to facilitate a range of malicious activities, including phishing, credential theft, or lateral movement within a network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic: Execution (TA0002)**
  - **Technique: Command-Line Interface (T1059.003)**

  The primary data sources for this detection include:
  - Process creation events from Windows systems, which log command execution and can reveal context around how and when `curl.exe` is being executed, along with its command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check Windows process creation logs for instances of `curl.exe` being executed with the `-c` or `--cookie-jar` flags. Analyze the parent process to identify the origin of the command.
  - **Assess Time and Context:** Evaluate the timestamp and user context under which the execution occurred. Investigate if it aligns with legitimate user activities or if it appears anomalous.
  - **Examine Network Activity:** Correlate the process execution with network activity. Look for outbound connections made by the system at the time of `curl.exe` execution that could indicate data exfiltration attempts.
  - **Identify User Behavior Patterns:** Analyze user behavior patterns around the time of execution. Determine if similar commands were executed by the same user or system within a short timeframe, suggesting possible experimentation or automated scripts.

  ### Prioritization
  This alert warrants medium severity as the execution of `curl.exe` with the cookie manipulation flags indicates potential unauthorized access attempts. The likelihood of exploitation and the sensitive nature of cookie data make this a relevant concern within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may miss instances where `curl.exe` is used legitimately, especially in automated tasks or by trusted applications performing API interactions. The detection logic assumes that all `curl.exe` executions with the specified flags are malicious, which may not account for benign use cases. Logs regarding command-line execution must be enabled and adequately configured on monitored endpoints for this alert to function effectively.

