title: Potential Cookies Session Hijacking
id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
status: test
description: Detects execution of "curl.exe" with the "-c" flag in order to save
  cookie data.
references:
- https://curl.se/docs/manpage.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
  - CommandLine|re: '\s-c\s'
  - CommandLine|contains: '--cookie-jar'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_cookie_hijacking/info.yml
note: |
  ### Technical Context

  This rule detects the execution of **curl.exe** with the **-c** flag or the **--cookie-jar** option, which indicates an intent to save HTTP cookie data to disk. The likely attacker objective is to capture and persist session cookies for web applications, potentially leading to session hijacking of authenticated users. This behavior aligns with the **Execution** tactic (TA0002) under the **Command and Control** (T1071) technique of the MITRE ATT&CK framework, which emphasizes how attackers manipulate existing sessions to gain unauthorized access.

  The primary telemetry sources for this detection are Windows process creation events, specifically **Security Event ID 4688** for process creation and **Sysmon Event ID 1** for detailed process information. If executed maliciously, the impact could lead to compromised user sessions, data theft, or unauthorized actions. However, it is crucial to understand that this detection does NOT confirm malicious intent on its own; legitimate uses of curl may also include similar command-line options.

  ### Investigation Steps

  - **Check process details**: Review **Event ID 4688** for `curl.exe` invocations. Verify the process owner; any instance running under a non-administrative, anomalous account (e.g., local service accounts) could indicate potential abuse.

  - **Analyze command line arguments**: Examine the command line arguments in **Event ID 4688**. Legitimate usage may include benign arguments (<e.g.> `-L` for following redirects), while the presence of `-c` or `--cookie-jar` indicates potential session hijacking.

  - **Inspect output files**: Determine if any cookie file was generated. Check for newly created files in the working directory or temp directories matching the cookie jar pattern (e.g., *.txt). Suspicious cookie jar files should be flagged for further review.

  - **Correlate with web traffic logs**: Cross-reference the process creation with web server logs (if available). Look for HTTP requests using cookie values from previous sessions around the same time as the curl execution.

  - **Monitor system for anomalies**: Review Sysmon logs for unusual outbound connections or subsequent process creations triggered by the `curl` execution. High confidence malicious indicators include connections to known malicious IPs or unusual destinations.

  ### Prioritization

  The alert severity is categorized as medium due to the potential impact involving sensitive user sessions. While session hijacking is a known tactic, the necessity to gather additional context before escalating is essential as legitimate uses of `curl.exe` are common in administration and automation scripts.

  ### Blind Spots and Assumptions

  This detection may be limited by the lack of visibility into legitimate curl usage, especially in environments where curl is regularly employed. Evasion techniques could include using alternative command-line tools for similar purposes, which would not be captured by this rule. Legitimate activities such as automated scripts for web testing or applications that rely on curl for API interactions may trigger false positives. A related detection to consider includes monitoring for other processes associated with session management or suspicious HTTP requests correlated with user authentication events.

