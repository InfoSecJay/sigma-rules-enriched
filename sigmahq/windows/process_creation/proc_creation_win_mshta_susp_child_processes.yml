note: |
  ### Technical Context

  This Sigma rule is designed to detect when a child process spawns from `mshta.exe`, indicating potential execution of a malicious HTML Application (HTA) script. Attackers often leverage HTA files to execute arbitrary commands or scripts covertly on a victim's system. The relevant MITRE ATT&CK technique associated with this behavior is "Malicious HTA Execution" (T1218.005).

  The primary telemetry source for this detection is Windows process creation logs, specifically utilizing Event ID 4688 (Process Creation) which provides details on newly created processes and their parent processes. If malicious, this behavior can lead to unauthorized access, data exfiltration, or further system compromise. It is critical to note that while this detection flags suspicious behavior, it does not confirm malicious intent on its own; further analysis is required.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 for processes spawned by `mshta.exe`. Look for evidence of commonly abused child processes such as `cmd.exe`, `powershell.exe`, and others listed in the detection rule.

  - **Identify Parent/Child Process Relationships:** Validate the relationship where `mshta.exe` is the parent process. Collect information on the full command line used for the child process. Malicious indicators may include unusual command lines such as encoded PowerShell commands.

  - **Assess File Paths:** Examine the file paths of the child processes. Malicious instances will often leverage tools from unusual locations, different from the standard installation paths (e.g., C:\Windows\System32).

  - **Document Legitimate Actions:** Note that legitimate software installations, such as printer drivers or HP-related applications, may initiate similar process chains involving `mshta.exe`. Compare behavior with historical context from known benign activities.

  - **Correlate with Other Alerts:** Cross-reference with existing alerts and logs for any signs of previous related suspicious activity, such as network connections from flagged processes (potentially checking DNS logs for external connections initiated by child processes).

  ### Prioritization

  This alert is of high severity as it indicates potential malicious execution using `mshta.exe`, which is a common tactic employed by adversaries. The likelihood of malicious abuse is elevated due to the association with command execution and potential lateral movement or data exfiltration. The behavior is not uncommon in weaponized attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging configuration does not capture all relevant process creation events or if the log retention period is insufficient for historical analysis. Adversaries may also employ obfuscation techniques to disguise the command lines or utilize legitimate applications to execute their scripts, leading to false positives. Companion detections to reinforce coverage could include monitoring suspicious command line arguments used in PowerShell execution (T1086) or process injection techniques.

