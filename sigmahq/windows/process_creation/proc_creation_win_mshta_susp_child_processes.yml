- car.2014-04-003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\mshta.exe'
  selection_child:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\sh.exe'
    - '\bash.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
    - '\bitsadmin.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wscript.exe'
    - 'cscript.exe'
    - 'Bash.exe'
    - 'reg.exe'
    - 'REGSVR32.EXE'
    - 'bitsadmin.exe'
  condition: all of selection*
falsepositives:
- Printer software / driver installations
- HP software
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of suspicious child processes spawned from `mshta.exe`, a legitimate Windows process used to execute HTML Application (HTA) files. Attackers may exploit `mshta.exe` to run malicious scripts, leading to potential system compromise. The primary goal of such activities is often to execute arbitrary code, download additional malware, or escalate privileges within the compromised environment.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection are **Defense Evasion** (T1218) and specifically **Signed Binary Proxy Execution** (T1218.005). Attackers may use `mshta.exe` as a means to bypass security controls by executing scripts that can ignore traditional security measures.

  Key telemetry sources for detection include process creation logs that capture the relationship between parent and child processes, specifically focusing on instances of `mshta.exe` spawning potentially malicious executables like `cmd.exe`, `powershell.exe`, or scripting tools like `wscript.exe` and `cscript.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `mshta.exe` as a parent process with child processes that may indicate script execution. Look for unusual execution patterns or anomalies linked to this activity.

  - **Analyze Command-Line Arguments**: Check the command-line arguments of the detected child processes for suspicious commands or scripts that may give insight into the nature of the activity being performed.

  - **Correlate with EDR Alerts**: Verify whether the detected processes have generated any alerts from Endpoint Detection and Response (EDR) tools, which may provide additional context or real-time blocking capabilities.

  - **Check for File Artifact Changes**: Investigate any files that may have been created or modified in conjunction with this behavior. Focus particularly on HTA files or any scripts involved in the execution.

  ### Prioritization
  This alert has a high severity level due to the significant risk of execution of potentially harmful malware or scripts that could lead to unauthorized access, data exfiltration, or lateral movement within the network. The likelihood of exploitation via this technique is increasing as attackers continually refine their methods.

  ### Blind Spots and Assumptions
  There may be blind spots in detection when legitimate applications or processes also spawn from `mshta.exe`. For instance, software installations and some device drivers could generate similar alerts, leading to false positives. The rule assumes that logs related to process creation are being collected and adequately configured in the SIEM, and any incomplete logging settings could result in missed detections. Additionally, if the execution occurs without appropriate logging mechanisms in place (e.g., on a user’s endpoint without proper monitoring), then the rule will not trigger.

