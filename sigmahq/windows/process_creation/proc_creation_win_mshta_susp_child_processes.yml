logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\mshta.exe'
  selection_child:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\sh.exe'
    - '\bash.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
    - '\bitsadmin.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wscript.exe'
    - 'cscript.exe'
    - 'Bash.exe'
    - 'reg.exe'
    - 'REGSVR32.EXE'
    - 'bitsadmin.exe'
  condition: all of selection*
falsepositives:
- Printer software / driver installations
- HP software
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where a child process is spawned from an "mshta.exe" parent process, which may indicate execution of a malicious HTML Application (HTA) script. Attackers often use HTA files for initial access or to execute secondary payloads due to their ability to run arbitrary code. The relevant MITRE ATT&CK tactic is Execution, with technique T1218.005 (Signed Binary Proxy Execution). The primary telemetry sources required for this detection are process creation logs from Windows (Event ID 4688 for Security logs and Sysmon Event ID 1). If this behavior is confirmed malicious, it can lead to system compromises, data exfiltration, or lateral movement within the network. Importantly, this detection does not confirm that an attack is occurring; it only highlights a potentially suspicious process relationship.

  ### Investigation Steps

  - **Check parent-child process relationships:** Verify the process lineage using Security Event ID 4688 or Sysmon Event ID 1. Confirm if processes such as cmd.exe or powershell.exe are directly spawned by mshta.exe, indicating potential malice.

  - **Review the command-line arguments:** For elevated confidence in malicious intent, check the command-line arguments of the spawned processes (look for signs of obfuscation or unusual parameters) in Event ID 4688 (New Process Creation) logs.

  - **Identify legitimate use cases:** Note that printer software or driver installations sometimes trigger this behavior. Analyze the surrounding context to ascertain if this is a scheduled task or user-initiated process that fits known legitimate workflows.

  - **Examine file execution timestamps:** Correlate file creation or modification times of suspicious child processes with known HTA execution times to determine if they align with user activity or correlate with known attack patterns.

  - **Inspect network connections:** Review network logs (Firewall or EDR logs) for outbound connections initiated by cmd.exe or powershell.exe post-htas execution. Identify any unusual or unauthorized external communication.

  ### Prioritization

  This alert is considered high severity because it indicates potentially unauthorized command execution originating from a known executable used in various malicious campaigns. The likelihood of abuse is significant, given the common exploitation of mshta.exe to execute HTA files in targeted environments.

  ### Blind Spots and Assumptions

  Detection can be evaded if attackers use different means to execute scripts or if the logging for process creation is not adequately configured. Legitimate activities, such as software updates or configurations by trusted administrative processes, may also trigger this alert. Related detections, such as monitoring for suspicious script activity or unusual child processes spawned from other known executables, can provide additional context and strengthen coverage against similar threats.

