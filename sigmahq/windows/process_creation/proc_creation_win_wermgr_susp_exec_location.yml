note: |
  ### Technical Context
  This detection rule identifies suspicious executions of the Windows Error Reporting manager (wermgr.exe) that occur outside of its legitimate directories. Attackers often leverage wermgr.exe as a mechanism to evade detection, executing it from unconventional paths to facilitate malicious activities. The likely objective here is to establish persistence, exfiltrate data, or trigger other malicious payloads, often as part of broader campaigns such as ransomware deployments or remote access trojan (RAT) installations.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection are:

  - Execution (TA0002): The act of executing malicious files or programs to carry out an attack.
  - Process Injection (T1055): This technique encompasses the injection and execution of malicious code into legitimate processes, which may include leveraging wermgr.exe.

  Primary data sources for this rule include Windows process creation events, which capture details of all executed processes, including the executable path and command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Gather process creation logs focusing on instances of wermgr.exe execution. Pay close attention to the executable paths to identify any anomalies or deviations from standard locations.

  - **Analyze Parent Process**: Investigate the parent process of the wermgr.exe execution to determine the context in which it was launched. Look for any suspicious parent processes, such as command shells or PowerShell.

  - **Check for Known Indicators**: Cross-reference the identified execution with known indicators of compromise (IOCs) related to malicious actors. This can include checking against threat intelligence feeds that list abnormal paths or usage patterns for wermgr.exe.

  - **Collect Artifact Details**: Document the command-line arguments used during the execution of wermgr.exe and any associated network connections. This can provide additional insight into the attacker's objectives, such as data exfiltration or lateral movement.

  ### Prioritization
  This alert is considered high severity due to the potential for wermgr.exe to be used in malicious contexts, which could lead to significant data breaches or system compromises. The likelihood of encountering such threats in an enterprise environment is elevated, making immediate investigation essential.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the ability to capture process creation events consistently on all endpoints. The detection logic assumes that wermgr.exe will not be executed legitimately outside the defined directories, although certain applications or administrative functions might generate false positives. Ensuring comprehensive logging configurations are in place, particularly for process creation events, is crucial for this alert to function effectively.

