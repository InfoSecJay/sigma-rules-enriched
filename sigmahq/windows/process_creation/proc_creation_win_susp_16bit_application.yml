  ### Technical Context

  This Sigma rule detects the launch of `ntvdm.exe` or `csrstub.exe`, which are processes associated with the NT Virtual DOS Machine. Attackers can leverage these processes to execute legacy 16-bit applications, including malware designed to run in a DOS environment. The behavior may suggest an attempt to bypass modern security controls that primarily focus on 32-bit and 64-bit applications. Relevant tactics and techniques include "Execution" (TA0002) and "Masquerading" (T1036).

  Primary telemetry sources include Windows Security Event ID 4688, which logs process creations, and Sysmon Event ID 1. If malicious in nature, the execution of these processes could indicate unauthorized access or exploitation attempts leveraging older software vulnerabilities. This detection does NOT confirm malicious intent on its own, as legitimate applications may also initiate these processes.

  ### Investigation Steps

  - **Check process creation logs: ** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for `ntvdm.exe` and `csrstub.exe`. Look for unusual parent processes or command line arguments that could indicate malicious use.

  - **Verify host activities: ** Analyze recent usage of software that requires `ntvdm.exe`, especially on systems known for legacy applications. Review user access patterns to confirm if the execution is legitimate or potentially anomalous.

  - **Identify suspicious parent processes: ** Cross-reference process creation details. Malicious invocations may be spawned by unexpected or suspicious parent processes (Event ID 4688, "New Process Name" field).

  - **Assess for known malware signatures: ** Use endpoint detection products to search for known related indicators of compromise (IoCs) associated with NT Virtual DOS Machine exploitation (e.g., hash values for potential malware).

  - **Review execution frequency and user accounts: ** Check for frequent invocations of `ntvdm.exe` from non-admin user accounts in unusual time frames. This may indicate an adversary’s toolset being executed stealthily.

  ### Prioritization

  This alert carries medium severity as it can indicate potentially malicious activity, especially on systems that should not be running 16-bit applications. The risk increases if the system is critical or instrumental in processing sensitive information, while the likelihood of this behavior being weaponized remains moderate given the niche nature of the applications involved.

  ### Blind Spots and Assumptions

  Detection may be limited as advanced adversaries could use legitimate applications to obfuscate their actions. Reliable detection requires proper logging of process creation events. Legitimate activities, such as the execution of older business-critical applications, could trigger this alert. A related detection for capturing high-frequency or unusual process creation events (like `cmd.exe` or `powershell.exe`) may enhance overall monitoring capabilities.

