note: |
  ### Technical Context

  This Sigma rule detects the execution of the `schtasks.exe` command via PowerShell, specifically when it is used to create scheduled tasks that are indicative of persistence mechanisms commonly utilized by adversaries. The likely objective of an attacker in this scenario is to establish a method of re-establishing access to a compromised system, ensuring their code runs under the specified conditions without user intervention. This behavior aligns with the MITRE ATT&CK technique T1053.005 (Scheduled Task/Job: Windows Task Scheduler) and T1059.001 (Command and Scripting Interpreter: Windows Command Shell).

  The primary telemetry source for this detection is Windows process creation logs, specifically capturing Event ID 4688 (Process Creation) and Sysmon Event ID 1. If this behavior is malicious, the security impact includes unauthorized persistence on the host, potentially allowing for further exploitation and lateral movement within the environment. However, the detection of this behavior does NOT confirm that malicious activity is occurring without additional context; it can also be indicative of legitimate administrative actions.

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Event ID 4688 and Sysmon Event ID 1 for any instances where `schtasks.exe` is invoked by `powershell.exe` with the specified flags. Note the user account initiating the action; administrative accounts performing legitimate task scheduling may indicate benign activity.

  - **Analyze command-line arguments**: Focus on the `CommandLine` field for patterns indicating persistence. Malicious activity typically includes `/SC ONLOGON`, `/SC DAILY /ST`, `/SC ONIDLE`, or `/SC HOURLY`, which could signify automated execution that is unlikely in benign cases.

  - **Identify task registration**: Use PowerShell’s `Get-ScheduledTask` cmdlet to list scheduled tasks on the affected system. Check for tasks created under user profiles or system tasks that exhibit atypical behavior or naming conventions.

  - **Correlate with known threats**: Cross-reference the task name or executable specified in the creation command (e.g., `/TN Updater`) with threat intelligence databases or internal logs for known malicious indicators. If the task name is associated with any documented malicious tools, escalate for further investigation.

  - **Look for concurrent suspicious activities**: Investigate any additional PowerShell activities around the same timestamp that may indicate a coordinated attack, such as unrecognized scripts or other process creations following this event.

  - **Assess user behavior context**: Consider the asset's criticality and the role of the user account involved. If the account has low privilege but attempts to create scheduled tasks, this could strongly indicate malicious intent.

  ### Prioritization

  This alert is high severity due to the potential impact on the system if malicious; successful persistence can lead to long-term compromise. The likelihood of abuse is high, as this technique is commonly weaponized in adversarial tactics for maintaining access post-compromise. Scheduled task manipulation through PowerShell is a frequent indicator of advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Evasion techniques could include the use of legitimate administrative tools to create tasks or obfuscating the command line arguments. Reliable detection also requires proper logging configurations, including enabling auditing for scheduled tasks. Legitimate administrative actions, such as system maintenance or updates by IT staff, might trigger this alert. A related detection that could strengthen coverage is monitoring for unusual PowerShell command usage (MITRE ATT&CK T1059.001), capturing broader malicious behaviors associated with PowerShell execution.

