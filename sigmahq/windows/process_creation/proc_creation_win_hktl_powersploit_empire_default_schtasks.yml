logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/Create'
    - 'powershell.exe -NonI'
    - '/TN Updater /TR'
    CommandLine|contains:
    - '/SC ONLOGON'
    - '/SC DAILY /ST'
    - '/SC ONIDLE'
    - '/SC HOURLY'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of a scheduled task via PowerSploit or Empire, two tools frequently used by attackers to maintain persistence on target systems. The presence of these scheduled tasks can indicate that an attacker has successfully exploited a system and is leveraging it for future access or malicious activities. The creation of scheduled tasks using such tools often serves the attacker’s objective of ensuring continued access to compromised environments, facilitating further exploitation or data exfiltration.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002) - using the scheduled task to execute malicious payloads.
  - **Persistence** (TA0003) - maintaining access to the system via scheduled tasks.
  - **Privilege Escalation** (TA0004) - possibly escalating privileges by executing further malicious actions as a scheduled task.
  - Techniques such as **Scheduled Task/Job** (T1053.005) and **Command and Scripting Interpreter** (T1059.001) are applicable here.

  The primary data sources for this detection include process creation events from Windows, which capture the execution of commands and scripts, as well as logs related to task scheduler activities that may document task creations or modifications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs to identify instances of `schtasks.exe` being executed along with its parent process (`powershell.exe` or `pwsh.exe`), and analyze the associated command line arguments for indications of malicious intent.

  - **Examine Scheduled Tasks**: Look for newly created scheduled tasks on the system, particularly those created with names like “Updater” or using arguments indicative of malicious behavior (e.g., `/SC ONLOGON`, `/SC DAILY /ST`).

  - **Correlate with Other Logs**: Cross-reference findings with additional telemetry sources such as Windows Event Logs to correlate with user logon events, which may reveal patterns in legitimate versus suspicious behavior.

  - **Analyze User Context**: Determine the user context under which the tasks were created. Check if the task creation occurred under an administrative context or by non-administrative users unexpectedly.

  ### Prioritization
  The severity of this alert is high, as the creation of scheduled tasks using malicious tools like PowerSploit and Empire indicates an active attempt at maintaining persistence on the network, which poses significant risks for elevated access and further exploitation by attackers.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the logs for scheduled task creation are not adequately configured or monitored in certain environments. This detection logic assumes that the execution of `schtasks.exe` solely under the specified conditions is malicious; however, legitimate administrative operations could also trigger this alert. To ensure effective detection, it is required that proper logging of process creation and scheduled tasks is enabled and retained for forensic analysis.

