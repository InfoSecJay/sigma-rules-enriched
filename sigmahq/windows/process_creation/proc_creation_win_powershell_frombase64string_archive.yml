  ### Technical Context
  This detection rule identifies instances where PowerShell is used to decode a Base64 Gzip archive. The typical behavior being monitored is the use of the `FromBase64String` method in conjunction with a `MemoryStream`, signifying an attempt to decode potentially malicious content for in-memory execution. This technique is common in advanced attacks, particularly those leveraging PowerShell scripts for command and control (C2) purposes, where attackers may disguise payloads to avoid detection by traditional security measures.

  Attackers often utilize this method to execute malicious code without leaving obvious traces on the filesystem, thus maintaining stealth and reducing the chances of detection. Given the potential for execution of arbitrary code, the objectives may include data exfiltration, credential dumping, or lateral movement within an organization's infrastructure.

  Related techniques from the MITRE ATT&CK framework include:
  - **Command and Control** (TA0011)
  - **Data Obfuscation** (T1132.001)

  The primary logs that will be crucial for investigation and detection in this scenario are Windows Process Creation events, which capture command-line arguments and executable paths.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances where PowerShell is invoked with parameters containing `FromBase64String`, `MemoryStream`, and the Gzip header `H4sI`. Pay close attention to the parent processes and execution paths to assess legitimate versus malicious intent.

  - **Examine PowerShell Transcripts**: Search for PowerShell transcripts that provide context around the PowerShell commands executed. Look for unusual or unauthorized script execution that might align with decoding activities.

  - **Check for Alternative Execution Techniques**: Investigate other potential indicators of in-memory execution or Base64 encoded payloads, such as encoded command line strings or the use of `Invoke-Expression`. Ensure no legitimate administrative functions are misused.

  - **Correlate with Network Traffic**: If available, review network traffic logs around the time of the suspicious process execution. Look for outbound connections that may indicate attempted communication with a C2 server or abnormal data transfers.

  ### Prioritization
  Given the high likelihood of malicious intent behind the use of Gzip archives in combination with Base64 decoding in PowerShell, alerts from this rule should be considered medium to high severity. This activity can indicate potential compromise and needs timely investigation to mitigate risks of data breaches or further intrusion.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if other scripting languages or methods (e.g., Python or .NET applications) are employed for similar decoding purposes and are not monitored. The detection logic assumes that all PowerShell command executions are properly logged. If PowerShell logging is disabled or misconfigured, the alert may fail to capture relevant incidents. Additionally, legitimate administrative scripts that perform similar decoding may lead to false positives, requiring a fine-tuning of the alerting mechanism.

