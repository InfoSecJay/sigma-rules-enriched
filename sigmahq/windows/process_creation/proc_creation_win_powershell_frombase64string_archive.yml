  ### Technical Context

  This Sigma rule detects the usage of the `FromBase64String` method, specifically in the context of executing Gzip compressed data via PowerShell. This behavior indicates a potential attacker's objective to decode malicious payloads and execute them directly in memory without writing them to disk, thus evading traditional antivirus protections. The relevant MITRE ATT&CK tactic is **Execution** (T1203) and the technique is **Scripting via PowerShell** (T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, primarily through Security Event ID 4688 and Sysmon Event ID 1, which detail command line activities. If the detected behavior is malicious, it could lead to the execution of arbitrary code, which may compromise the system's confidentiality, integrity, and availability. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may utilize similar functionality.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Examine the `CommandLine` field from Security Event ID 4688 for evidence of `FromBase64String`, `MemoryStream`, and `H4sI`. Malicious activity is indicated if these elements are present without context, while legitimate use may include more identifiable administrative context.

  - **Analyze parent process:** Check the `ParentProcessId` in the process creation log to identify the parent process. If the parent process is a known legitimate tool or system utility (e.g., PowerShell Integrated Scripting Environment), the activity may be benign.

  - **Correlate with Sysmon events:** Verify Sysmon Event ID 1 for the detected process. Look for additional parameters in the command line which could offer more discriminating details (e.g., suspicious encoded strings or further obfuscation techniques).

  - **Identify high-confidence malicious indicators:** Investigate the timestamp and frequency of the occurrences. Frequent executions in quick succession may indicate automated scripts used for malicious purposes, categorizing it as higher-risk activity.

  - **Confirm legitimate script activity:** Cross-check with documentation or known scripts used by the organization. If base64 Gzip usage is documented for specific purposes, that will support benign classification.

  - **Check for associated file artifacts:** For further analysis, look for any file drops associated with the detected process. Validate if temporary files were created or if any outbound network connections occur, indicating possible exfiltration attempts that align with C2 communications.

  ---

  ### Prioritization

  This alert should be considered medium to high severity due to the potential for code execution in memory without detection. While the affected system's criticality will influence the response, the likelihood of malicious abuse exists, as techniques for executing base64 encoded content are increasingly common.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging configurations, as users must ensure Sysmon is adequately deployed. An evasion technique involves encoding further or using uncommon base64 strings, making detection challenging. Additionally, legitimate administrative tasks, like automated reporting tools or data manipulation scripts, may also trigger this alert. A related rule that strengthens coverage would be "Suspicious PowerShell Execution Request" that covers broader PowerShell activities.

