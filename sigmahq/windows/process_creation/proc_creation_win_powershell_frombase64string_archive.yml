  ### Technical Context

  This rule detects instances of PowerShell using the `FromBase64String` method in conjunction with `MemoryStream` to decode base64 encoded Gzip archives. This technique is commonly employed by attackers to load malicious payloads directly into memory, bypassing traditional file-based scanning. The likely objective of such activity is to execute hidden commands or deliver malicious software without triggering typical file-based defenses. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (T1071) and Execution (T1203), specifically focusing on technique T1132.001 (Case: Command and Control over HTTP). The primary telemetry sources for this detection are Windows process creation logs, specifically capturing the CommandLine used. A successful malicious execution could lead to significant security incidents, including data breaches or full system compromises. Importantly, this detection does NOT confirm malicious intent or successful execution on its own; further investigation is necessary.

  ### Investigation Steps

  - **Examine the PowerShell CommandLine:**
    - Review Event ID 4688 for the process creation of PowerShell scripts that include 'FromBase64String' and 'MemoryStream' in the CommandLine.
    - Look for additional parameters that may indicate malicious behavior, such as unusual URL calls or file paths.

  - **Inspect Child Processes for Unusual Activity:**
    - Check for spawned child processes (e.g., Event ID 4688) from the PowerShell instance.
    - Legitimate scripts typically do not spawn further processes silently; look for unusual executables or scripts being run.

  - **Verify Loaded Assemblies:**
    - Use Sysinternals tools to review process memory (e.g., ProcMon or Process Explorer) to identify any assemblies loaded into memory following execution.
    - If Gzip or encoded DLLs are loaded, assess their legitimacy.

  - **Cross-reference with Task Scheduler Logs:**
    - Look at Task Scheduler logs (Event ID 106) for any scheduled tasks that triggered the PowerShell creation, which may indicate an orchestrated attack or legitimate admin task.

  - **Consult Windows Event Logs:**
    - Analyze Security Event Logs (Event ID 5145) for unusual file access or creation events in relevant directories following the execution time of the command, focusing on tmp or user profile folders that may suggest data exfiltration attempts.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on critical systems running PowerShell and its use as an attack vector in malicious exploits. The likelihood of abuse is moderate, given that the behavior observed is not commonly executed in regular operations and can indicate an attempt to bypass detection mechanisms.

  ### Blind Spots and Assumptions

  The detection may be limited by the use of obfuscation techniques, where attackers could modify the command patterns slightly to avoid detection. Reliable detection requires that PowerShell logging is accurately configured at the group policy level, including module logging. Legitimate administrative tasks or scripts that use base64 encoding for legitimate purposes may trigger this alert. To enhance coverage, consider monitoring for PowerShell script block logging (Event ID 4104), which can provide additional context around executed commands.

