title: Suspicious AddinUtil.EXE CommandLine Execution
id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with suspicious Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Nasreddine Bencherchali (Nextron Systems), Michael McKinley (@McKinleyMike),
  Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_susp_1_flags:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  selection_susp_1_paths:
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  selection_susp_2:
    CommandLine|contains:
    - '-AddInRoot:.'
    - '-AddInRoot:"."'
    - '-PipelineRoot:.'
    - '-PipelineRoot:"."'
    CurrentDirectory|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  condition: selection_img and (all of selection_susp_1_* or selection_susp_2)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the Add-In deployment cache updating utility, `AddInUtil.exe`, when used with potentially malicious command-line arguments leading to suspicious paths such as those in temporary directories. Attackers may leverage `AddInUtil.exe` in a technique known as "living off the land" (LOLbins), where they utilize legitimate system tools to perform malicious actions, thereby evading traditional security measures. In this context, the objective is likely to execute a payload disguised under the guise of a benign process, ultimately compromising system integrity or exfiltrating sensitive data.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Defense Evasion** (TA0005)
  - **Command-Line Interface** (T1059.003)
  - **Masquerading** (T1036)

  The primary data sources for effective detection revolve around **process creation events**, which provide insight into executed commands, as well as the **command line arguments** supplied during process instantiation. These logs enable analysts to connect malicious activities to legitimate-looking software executions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation logs around the time of the alert to identify the execution of `AddInUtil.exe` and gather context on the command line parameters used.
  - **Examine Command-Line Arguments**: Investigate the command line for any suspicious patterns, particularly those including `-AddInRoot:` or `-PipelineRoot:`, and look for common file paths that may indicate misuse, such as `\AppData\Local\Temp\` or `\Users\Public\`.
  - **Check File Locations**: Cross-reference the execution paths with standard operating directories. Look into files in locations like `C:\Users\<USERNAME>\AppData\Local\Temp\` to determine if they contain suspicious payloads or were modified unexpectedly.
  - **Assess Previous Activity**: Trace back user and system activities leading up to the execution of `AddInUtil.exe` to capture any preceding anomalous behavior that may indicate an initial compromise or lateral movement.

  ### Prioritization
  This alert is marked as high severity due to the potential high impact of attackers disguising their activity within legitimate administrative tools. The likelihood of misuse is significant, especially in environments where interactivity with system tools is common.

  ### Blind Spots and Assumptions
  The detection rule may miss instances where `AddInUtil.exe` is utilized legitimately or where attackers employ alternative methods of execution not captured by the command-line patterns specified in the logic. It operates under the assumption that `AddInUtil.exe` will only be invoked with specific flags and paths, which might not encapsulate every potential misuse scenario. Furthermore, effective detection relies on the continuous logging of process creation events with detailed command-line arguments; environments lacking comprehensive logging configurations might face gaps in detection coverage.

