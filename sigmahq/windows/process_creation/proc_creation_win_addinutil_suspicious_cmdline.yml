title: Suspicious AddinUtil.EXE CommandLine Execution
id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with suspicious Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Nasreddine Bencherchali (Nextron Systems), Michael McKinley 
  (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_susp_1_flags:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  selection_susp_1_paths:
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  selection_susp_2:
    CommandLine|contains:
    - '-AddInRoot:.'
    - '-AddInRoot:"."'
    - '-PipelineRoot:.'
    - '-PipelineRoot:"."'
    CurrentDirectory|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  condition: selection_img and (all of selection_susp_1_* or selection_susp_2)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of AddInUtil.exe with command-line options that utilize suspicious paths often associated with temporary or public directories. The likely objective of an attacker utilizing this method is to invoke a malicious payload through the Add-In deployment utility, camouflaged within legitimate software usage. The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and the technique **Execution via LOLBins** (T1218).

  Primary telemetry sources include process creation logs from Windows, particularly **Security Event ID 4688** for monitoring command-line usage. If this behavior is malicious, it can lead to the execution of arbitrary code or payloads, potentially allowing for sensitive data theft or system compromise. However, the detection does NOT confirm malicious intent on its own, as AddInUtil.exe can be used in legitimate application deployments.

  ### Investigation Steps

  - **Identify Process Execution Details:** Review Security Event ID 4688 for AddInUtil.exe execution. Check the CommandLine parameter for paths like `\AppData\Local\Temp\`, `\Desktop\`, or containing `-AddInRoot:` or `-PipelineRoot:` flags. Benign usage would typically involve standard add-in paths without suspicious directory locations.

  - **Check Current Directory Context:** Evaluate the CurrentDirectory field for the execution context during the AddInUtil.exe invocation. Legitimate use cases usually indicate common application directories (e.g., `C:\Program Files\`). Deviation towards temporary folders suggests malicious behavior.

  - **Analyze Network Traffic:** Correlate with network logs to check for connections to known malicious IPs or domains immediately following the execution of AddInUtil.exe. Look for DNS queries related to common attack infrastructure, as this would indicate command and control activity.

  - **Review for High-Confidence Malicious Indicators:** If the command-line execution contains elements like `-\AddInRoot:.` or `-\PipelineRoot:.`, classify them as high-confidence indicators of malicious intent, especially if combined with execution from uncommon directories.

  - **Document User and Asset Context:** Capture user activity logs to discern whether the execution aligns with normal user behavior patterns. Investigate the asset's criticality if the execution occurs on sensitive servers or user endpoints with elevated privileges.

  - **Inspect for File Creation Artifacts:** Validate the creation of any temporary or unusual files in the specified directories post-execution. Use file system logs to confirm whether any new executables or scripts were generated, indicating potential exfiltration or lateral movement attempts.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive systems and the likelihood of exploitation through commonly weaponized methods. The use of LOLBins to bypass security controls makes this behavior particularly concerning, warranting immediate attention.

  ### Blind Spots and Assumptions

  Detection may be evaded by renaming the utility or using alternative, less scrutinized means of execution. A logging configuration that includes process creation data is essential for reliable detection. Legitimate activities might involve scheduled tasks or script executions linked to software updates or installations. A related companion detection would include monitoring for the execution of other LOLBins (e.g., arguments around `rundll32.exe` or `mshta.exe`) which could enhance visibility on similar infections.

