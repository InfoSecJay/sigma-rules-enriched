title: Suspicious AddinUtil.EXE CommandLine Execution
id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with suspicious Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Nasreddine Bencherchali (Nextron Systems), Michael McKinley 
  (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_susp_1_flags:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  selection_susp_1_paths:
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  selection_susp_2:
    CommandLine|contains:
    - '-AddInRoot:.'
    - '-AddInRoot:"."'
    - '-PipelineRoot:.'
    - '-PipelineRoot:"."'
    CurrentDirectory|contains:
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  condition: selection_img and (all of selection_susp_1_* or selection_susp_2)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `AddInUtil.exe` with command-line parameters that include suspicious file paths or flags associated with the Add-In deployment utility often abused for malicious purposes. An attacker may use `AddInUtil.exe` with paths pointing to adversary-controlled locations to deploy malicious Addins.Store payloads, often leading to payload installation or lateral movement within a network. Relevant MITRE ATT&CK tactics and techniques include "Defense Evasion" (TA0005) and "Execution using Valid Accounts" (T1218).

  The primary telemetry source for this detection is Windows Process Creation logs, specifically targeting Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it may allow attackers to introduce unwanted applications or malware into the environment, thereby compromising system integrity. Importantly, this detection does NOT confirm that an attack is occurring; it simply indicates suspicious use of a legitimate utility.

  ---

  ### Investigation Steps

  - **Review command-line details:** Check for `CommandLine` values containing `-AddInRoot:` or `-PipelineRoot:` followed by uncommon paths like `\AppData\Local\Temp\` or `\Downloads\`. Legitimate use typically does not involve these locations.

  - **Validate process origin:** Examine the `Image` and `OriginalFileName` for exact matches to `AddInUtil.exe` with `Security Event ID 4688`. Be cautious of files with the same name located outside of typical directories (e.g., not in `C:\Program Files\`).

  - **Correlate with current directory:** Ensure that `CurrentDirectory` values are reviewed, paying attention to any instances that include temporary paths or similar user profile directories, which can indicate potential abuse of the executable.

  - **Identify high-confident malicious traits:** Look for any logs indicating the creation or modification of files in `C:\Users\Public\` or `C:\Windows\Temp\` shortly after the execution of `AddInUtil.exe`. Such artifacts are strong indicators of possible malicious activity.

  - **Check for related legitimate usage:** Investigate if the user or process logged the execution during a scheduled maintenance or patch deployment around common update timelines, providing context for the use of `AddInUtil.exe`.

  - **Profile host criticality and asset value:** Consider the role of the host executing `AddInUtil.exe`. High-value systems, like servers, warrant immediate escalation if suspicious activity is confirmed.

  ---

  ### Prioritization

  Given that this detection involves a potentially malicious execution of a tool that can easily be weaponized, alerts should be considered high-severity, especially if triggered from critical assets. The likelihood of adversaries exploiting legitimate tools for compromise is increasingly common in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where attackers may obfuscate command-line parameters or execute `AddInUtil.exe` from non-suspicious paths. Reliable detection requires full visibility into Windows Process Creation logs and consistent monitoring of environment configurations. Legitimate activities, such as user-generated updates or installations via corporate software standards, may unintentionally trigger this alert, potentially leading to false positives. Related detections include those for unusual file creations or modifications in user directories, enhancing coverage for malicious behavior.

