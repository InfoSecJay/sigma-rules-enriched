note: |
  ### Technical Context

  This Sigma rule detects the invocation of `reg.exe` with commands specifically querying the system's language settings via the Windows registry. This behavior indicates that an attacker may be attempting to gather information about the environment to tailor their attacks, such as determining the geographic location of the victim or adjusting their payloads for specific regional settings. This aligns with the MITRE ATT&CK framework under the tactic of "Discovery" and technique "System Language Discovery" (T1614.001).

  The primary telemetry source is Windows process creation logs, specifically looking for command line executions involving `reg.exe`. If this activity is confirmed as malicious, it could suggest pre-exploitation reconnaissance. However, this detection does NOT independently confirm malicious intent; legitimate administrative or script-based activities may use similar queries.

  ### Investigation Steps

  - **Examine process creation logs**: Search for Security Event ID 4688 or Sysmon Event ID 1 that includes command lines containing `reg.exe` and `query Control\Nls\Language`. Note benign activities such as system administration tasks using similar queries.

  - **Review command line parameters**: Confirm whether `query Control\Nls\Language` was used. If found, investigate further context about the initiating process and parent processes to distinguish between potential benign administrative actions or malicious discovery attempts.

  - **Check user context**: Identify the user account associated with the `reg.exe` invocation. High-risk accounts (like service accounts or privileged users) executing such commands warrant more immediate attention compared to low-privilege accounts.

  - **Identify network behavior**: Look for any correlating outbound network connections in Windows Firewall logs around the time of the detection which may indicate a connection to a command and control server or data exfiltration attempts.

  - **Review intellectual property**: If this detection correlates with any other suspicious activities (e.g., unusual PowerShell scripts), investigate for signs of deeper compromises or lateral movement within the network.

  ### Prioritization

  This alert is of medium severity. While the immediate impact may seem limited to an information-gathering endeavor, the likelihood of malicious abuse is notable as attackers commonly perform reconnaissance before launching targeted operations. The behavior could precede significant threats, making it essential to verify.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers executing similar commands through different means (e.g., using PowerShell or other scripting languages). Reliable detection requires comprehensive logging of process creation events. Legitimate use cases, such as system administrators checking language settings for compliance or configuration purposes, could trigger this alert. A related detection, such as monitoring for PowerShell commands that manipulate the registry (T1059.001), would enhance coverage against similar reconnaissance activities.

