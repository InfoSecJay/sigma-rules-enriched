title: Suspicious Userinit Child Process
id: b655a06a-31c0-477a-95c2-3726b83d649d
status: test
description: Detects a suspicious child process of userinit
references:
- https://twitter.com/SBousseaden/status/1139811587760562176
author: Florian Roth (Nextron Systems), Samir Bousseaden (idea)
date: 2019-06-17
modified: 2025-10-17
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\userinit.exe'
  filter_main_netlogon:
    CommandLine|contains: '\netlogon\'
  filter_main_explorer:
  - Image|endswith: '\explorer.exe'
  - OriginalFileName: 'explorer.exe'
  - CommandLine: 'C:\Windows\Explorer.EXE'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a child process where the parent process is `userinit.exe`. This behavior is often indicative of privilege escalation or malicious command execution, as attackers may leverage `userinit` to execute unauthorized commands in a user context. The relevant MITRE ATT&CK technique is **Process Injection (T1055)**, as applications may utilize these processes to inject code.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID **4688** or Sysmon Event ID **1**, which provide detailed information about process creation events. If malicious, this could lead to unauthorized access or control over user sessions. However, it's important to recognize that this detection alone does NOT confirm a successful breach or that the detected process is indeed malicious without additional context.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID **4688** or Sysmon Event ID **1** for the process creation event and its command line. Look for unusual or obfuscated command line inputs indicative of malicious activity.

  - **Validate legitimate activity**: For normal operations, look for child processes of `userinit.exe` that are associated with known administrative scripts or user logins, often containing standard arguments or expected file paths.

  - **Identify high-confidence malicious indicators**: Search for `ParentImage` as `userinit.exe` and child processes that include unexpected command line arguments or point to unusual file locations, especially those referencing `\netlogon\`.

  - **Check for concurrent suspicious activity**: Look for other alerts or logs during the same timeframe, such as those from **Windows Event ID 4624** (logon) and **4688** (process creation), to indicate lateral movement or access attempts.

  - **Examine user account context**: Investigate the user accounts associated with the processes being created, especially focusing on accounts with elevated privileges or those showing anomalous behavior.

  ### Prioritization

  This alert holds a medium severity level due to its potential impact on user session integrity. While the likelihood of malicious abuse is notable, especially in targeted attacks, the detection may also capture benign administrative actions. Therefore, context is critical in assessing the urgency and severity of the alert.

  ### Blind Spots and Assumptions

  Detection may miss obfuscated command patterns or legitimate administrative scripts that mimic similar process creations. It requires Sysmon or equivalent logging configurations to ensure comprehensive coverage. Additionally, scenarios involving legitimate administrative activities, such as normal user logons, may trigger this alert. To strengthen detection capabilities, consider monitoring for **Event ID 4698**, which corresponds to scheduled tasks, as this could correlate to persistent execution methods.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
