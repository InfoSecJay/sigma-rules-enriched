title: Suspicious Userinit Child Process
id: b655a06a-31c0-477a-95c2-3726b83d649d
status: test
description: Detects a suspicious child process of userinit
references:
- https://twitter.com/SBousseaden/status/1139811587760562176
author: Florian Roth (Nextron Systems), Samir Bousseaden (idea)
date: 2019-06-17
modified: 2025-10-17
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\userinit.exe'
  filter_main_netlogon:
    CommandLine|contains: '\netlogon\'
  filter_main_explorer:
  - Image|endswith: '\explorer.exe'
  - OriginalFileName: 'explorer.exe'
  - CommandLine: 'C:\Windows\Explorer.EXE'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context
  This rule detects suspicious child processes initiated by `userinit.exe`, which is a legitimate Windows process responsible for user logon initialization. Attackers often exploit this process to run malicious payloads in a stealthy manner. By creating child processes under `userinit.exe`, adversaries can attempt to establish persistence or leverage privilege escalation tactics to gain unauthorized access or control over the system. Common objectives behind this behavior include deploying malware, stealing credentials, or conducting lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Privilege Escalation (TA0004)**
    - **T1055: Process Injection** - this technique is employed when attackers attempt to inject malicious code into a legitimate process.

  Primary data sources for identifying this behavior predominantly include process creation logs, which capture details such as command-line arguments, parent-child relationships of processes, and user contexts under which these processes are initiated. Monitoring these logs can provide crucial insights into unauthorized or abnormal execution patterns that could indicate malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Evaluate the process creation logs for any child processes spawned from `userinit.exe`. Take note of the command lines, user contexts, and timestamps to identify relevant anomalies.

  - **Analyze Command-Line Arguments:** Examine the command-line arguments associated with the detected child processes. Look specifically for indicators such as paths to suspicious executables or signs of attempts to interact with the system's Netlogon service.

  - **Check Parent-Child Relationship:** Utilize tools to visualize the process tree to understand the relationships between processes. Determine if the parent-child relationships involving `userinit.exe` follow expected patterns or suggest malicious activity.

  - **Investigate Other Event Logs:** Explore other relevant logs such as Security, System, and Application event logs for related activities occurring around the same time. Look for unusual user logons, service starts, or failed access attempts that can provide additional context.

  ### Prioritization
  The severity of this alert is medium, as suspicious child processes under `userinit.exe` could signify early-stage threats. Given the potentially impactful nature of such activities—where adversaries may seek to escalate privileges or maintain access—the incident should be treated with urgency.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage related to legitimate administrative scripts or scheduled tasks that could also use `userinit.exe`. The detection logic assumes that the parent is exclusively `userinit.exe` without context about legitimate use cases. For the alert to function effectively, it requires comprehensive logging of process creation events, especially in environments where more aggressive script automation is in place. Ensure that all relevant Windows event logs are configured to capture process creation details thoroughly.

