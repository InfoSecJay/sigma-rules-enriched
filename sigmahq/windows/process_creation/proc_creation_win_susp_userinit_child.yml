title: Suspicious Userinit Child Process
id: b655a06a-31c0-477a-95c2-3726b83d649d
status: test
description: Detects a suspicious child process of userinit
references:
- https://twitter.com/SBousseaden/status/1139811587760562176
author: Florian Roth (Nextron Systems), Samir Bousseaden (idea)
date: 2019-06-17
modified: 2025-10-17
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\userinit.exe'
  filter_main_netlogon:
    CommandLine|contains: '\netlogon\'
  filter_main_explorer:
  - Image|endswith: '\explorer.exe'
  - OriginalFileName: 'explorer.exe'
  - CommandLine: 'C:\Windows\Explorer.EXE'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context

  This detection identifies potentially malicious child processes launched from `userinit.exe`, which can be indicative of privilege escalation or other unauthorized behavior. An attacker may exploit `userinit.exe` to execute their payload, aiming to maintain persistence on the system or escalate privileges undetected.

  This behavior aligns with the MITRE ATT&CK techniques T1055 (Process Injection) and T1059 (Command and Scripting Interpreter). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events along with command-line arguments and parent-child relationships. If malicious, this activity can lead to unauthorized access, data theft, or lateral movement. However, this detection does NOT inherently confirm malicious intent, as administrative scripts may also trigger it.

  ### Investigation Steps

  - **Review Parent Process Indicator**: Check if the parent process is `userinit.exe`. Analyze Process Creation logs (Security Event ID 4688) to ensure compliance and check user accounts involved. Malicious indicators include unexpected or unauthorized command-line arguments.

  - **Validate Command-Line Arguments**: Examine command-line arguments for the child process. Look for suspicious strings like `C:\netlogon\`, which should be flagged. Legitimate usage typically involves standard user commands without unusual file paths or suspicious arguments.

  - **Correlate with User Activity**: Identify the user account executing the process. Check for recent logins or script executions that may explain the activity. Benign activity typically correlates with known administrative scripts or typical application launches.

  - **Monitor for Known Malicious Processes**: Cross-reference the child process against known malware signatures or hashes. Identify any recent OS changes that may correlate with the alert. High-confidence indicators are new or uncommon hashes originating from the child process.

  - **Examine Event Filtering Configurations**: Ensure logs capture relevant process creation events and are configured properly to avoid gaps in detection. Confirm the inclusion of Security Event 4688 and Sysmon events in the monitoring policy.

  ### Prioritization

  The alert is considered medium severity due to its connection with suspected privilege escalation on potentially critical systems. While not all occurrences are malicious, the behavior is often weaponized by adversaries performing lateral movement or persistence tactics, requiring thorough investigation.

  ### Blind Spots and Assumptions

  Detection may miss cases where the indicator uses variations of `userinit.exe` names, achieved through renaming or exploitation techniques. Continuous monitoring and reinforcement of required log sources, such as Windows Event logs and Sysmon, are essential for comprehensive coverage. Additionally, benign administrative operations can trigger this detection, such as legitimate system scripts running in user context. Related detections include unauthorized command execution alerts from the same user context, enhancing overall coverage and response capability.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
