logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cdb.exe'
  - OriginalFileName: 'CDB.Exe'
  selection_cli:
    CommandLine|contains:
    - ' -c '         # Using a debugger script
    - ' -cf '
  condition: all of selection*
falsepositives:
- Legitimate use of debugging tools
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `cdb.exe` debugger with specific command-line arguments indicating the use of debugger scripts to execute arbitrary processes or commands. The likely attacker objective is to exploit the capabilities of debugging tools to execute malicious payloads while evading traditional defenses and monitoring. This behavior aligns with the MITRE ATT&CK technique "Scripting (T1064)" and "Command-Line Interface (T1059)" as well as "Debugging (T1218)" and "Process Injection (T1127)". The primary telemetry source is process creation logs, specifically Windows event logging for process execution (Event ID 4688) and Sysmon event logs (Event ID 1). If malicious, this can lead to unauthorized code execution, potential data exfiltration, or lateral movement within the network. Note that this detection does NOT confirm malicious activity on its own, as the use of debugging tools can also be legitimate.

  ### Investigation Steps

  - **Review the process creation event:** Examine Security Event ID 4688 and Sysmon Event ID 1 for the execution of `cdb.exe` to understand when and how it was initiated, focusing on the `CommandLine` field for suspicious arguments.

  - **Analyze command-line arguments:** Check for the presence of ` -c ` or ` -cf ` in the command-line inputs, indicating that a debugger script is used. If present, this is highly indicative of potential malicious activity, especially if associated with known malicious payload patterns.

  - **Identify the parent process:** Investigate the parent process to determine the context of `cdb.exe` execution. Legitimate debugging sessions often originate from known applications (e.g., `windbg.exe` or other development tools), whereas unexpected parent processes may signal adversarial behavior.

  - **Examine the environment for prior usage:** Look for historical activity of `cdb.exe` in the telemetry logs over a set timeframe to establish if there’s been recent unscheduled or unexpected use of this tool in a production environment, which points to abnormal behavior.

  - **Validate file creation or modification:** Assess for any related artifacts by checking for new or altered files in the system for unusual patterns, especially within script directories or temporary folders post-execution of `cdb.exe`.

  - **Check for common evasion techniques:** Investigate if the system has prior interactions with known legitimate debugging tools or scripts that could trigger false positives, such as authorized software development or debugging efforts.

  ### Prioritization

  This alert has medium severity due to the potential for high-impact exploits via a common Windows debugging tool. While legitimate uses exist, the specific command-line patterns detected are often leveraged by adversaries for executing malicious code, which raises the likelihood of abuse in environments with such tools.

  ### Blind Spots and Assumptions

  Detection efficacy is potentially limited by the use of obfuscation techniques within legitimate command-line arguments. Reliable detection requires monitoring for both Sysmon and Windows security logs configured accurately. Furthermore, installed debugging tools can lead to false positives, making context and additional telemetry essential. Related detections, such as those alerting on script executions or use of other debugger names (`windbg.exe`), can strengthen the overall monitoring capability against similar threats.

