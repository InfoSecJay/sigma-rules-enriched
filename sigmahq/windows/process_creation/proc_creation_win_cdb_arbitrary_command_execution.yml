logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cdb.exe'
  - OriginalFileName: 'CDB.Exe'
  selection_cli:
    CommandLine|contains:
    - ' -c '         # Using a debugger script
    - ' -cf '
  condition: all of selection*
falsepositives:
- Legitimate use of debugging tools
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `cdb.exe`, a Windows debugging tool, when it is used to launch arbitrary processes or commands through the use of debugger script files. This behavior is typically indicative of an attacker trying to execute shellcode or other harmful commands while evading detection mechanisms. It aligns with the MITRE ATT&CK techniques: T1106: Native API, T1218: Signed Binary Proxy Execution, and T1127: Execution through API.

  The primary telemetry sources include process creation logs generated by Windows Security Event ID 4688 and Sysmon Event ID 1, which contain critical details such as command line arguments and the process image name. If malicious, this could lead to significant security incidents including unauthorized access or system compromise. Notably, this detection does NOT confirm that malicious activity has occurred on its own; further investigation is necessary to establish intent and context.

  ### Investigation Steps

  - **Check process creation logs for `cdb.exe`:** Review Security Event ID 4688 or Sysmon Event ID 1 logs to verify instances of `cdb.exe` launched on relevant systems, particularly for any unusual timing or system context.

  - **Analyze command line arguments:** Inspect the associated command line for occurrences of `-c` or `-cf`. Benign use typically involves simple debugging commands, whereas complex or obfuscated commands may indicate hostile intent.

  - **Correlate with known debugger usage:** Cross-reference any logged activities with established debugging workflows within the organization. Document instances where legitimate use of debugging tools is common, such as during development or application testing phases.

  - **Investigate parent processes:** Examine the parent process of `cdb.exe` instances. A common benign parent might be another debugger or development tool, while a malicious indicator would be unexpected parent processes, such as those linked to known vulnerabilities or exploitation frameworks.

  - **Review system integrity and file changes:** Validate changes to system files and configurations around the time `cdb.exe` was executed. Look for unexpected modifications or potential file creation through temp directories (e.g., `$TEMP$` or `$TMP$`) that may indicate an exfiltration or payload delivery attempt.

  ### Prioritization

  The severity of this alert is medium, as the affected systems are often critical development or production servers. While the likelihood of malicious use is moderate, particularly in environments where debugging tools are prevalent, this method is known to be adopted by adversaries for evasion tactics, highlighting the importance of swift investigation.

  ### Blind Spots and Assumptions

  This detection may miss instances where `cdb.exe` is used without these specific command line arguments or in legitimate debugging scenarios. Proper logging configurations, particularly on process creation events, are crucial for reliable detection. Legitimate activities, such as debugging by developers, may trigger the alert and should be considered. A complementary detection could be monitoring for other known exploit tools or environments where unusual DLLs are being loaded, enhancing visibility into potential attacks.

