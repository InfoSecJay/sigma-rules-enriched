title: Suspicious Process By Web Server Process
id: 8202070f-edeb-4d31-a010-a26c72ac5600
status: test
description: |
  Detects potentially suspicious processes being spawned by a web server process which could be the result of a successfully placed web shell or exploitation
references:
- https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
author: Thomas Patzke, Florian Roth (Nextron Systems), Zach Stanford @svch0st, 
  Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
date: 2019-01-16
modified: 2024-11-26
tags:
- attack.persistence
- attack.initial-access
- attack.t1505.003
- attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\php.exe'
    - '\tomcat.exe'
    - '\UMWorkerProcess.exe'          # https://www.fireeye.com/blog/threat-research/2021/03/detection-response-to-exploitation-of-microsoft-exchange-zero-day-vulnerabilities.html
    - '\w3wp.exe'
    - '\ws_TomcatService.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentCommandLine|contains:
    - 'CATALINA_HOME'
    - 'catalina.home'
    - 'catalina.jar'
  selection_anomaly_children:
    Image|endswith:
    - '\arp.exe'
    - '\at.exe'
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\dsget.exe'
    - '\hostname.exe'
    - '\nbtstat.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netdom.exe'
    - '\netsh.exe'
    - '\nltest.exe'
    - '\ntdsutil.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\qprocess.exe'
    - '\query.exe'
    - '\qwinsta.exe'
    - '\reg.exe'
    - '\rundll32.exe'
    - '\sc.exe'
    - '\sh.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    - '\wusa.exe'
  filter_main_fp_1:
    ParentImage|endswith: '\java.exe'
    CommandLine|endswith: 'Windows\system32\cmd.exe /c C:\ManageEngine\ADManager "Plus\ES\bin\elasticsearch.bat
      -Enode.name=RMP-NODE1 -pelasticsearch-pid.txt'
  filter_main_fp_2:
    ParentImage|endswith: '\java.exe'
    CommandLine|contains|all:
    - 'sc query'
    - 'ADManager Plus'
  condition: 1 of selection_webserver_* and selection_anomaly_children and not 1
    of filter_main_*
falsepositives:
- Particular web applications may spawn a shell process legitimately
level: high
note: |
  ### Technical Context

  This rule detects suspicious child processes spawned by known web server processes, such as `caddy.exe` and `httpd.exe`. The behavior indicates potential exploitation, possibly through web shells, with the attacker aiming to execute arbitrary commands on the web server, often for data exfiltration or lateral movement. This relates to the MITRE ATT&CK technique for "Web Shell" (T1505.003) and "Exploitation of Public-Facing Applications" (T1190).

  Primary telemetry sources for this detection include process creation logs from Windows, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, it could compromise the integrity and availability of web applications, potentially leading to system-wide exploitation. Importantly, this rule does not confirm malicious activity on its own; further context, such as network activity or additional logs, is required.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for processes spawned by `caddy.exe`, `httpd.exe`, or other listed web server binaries. Focus on child processes that are unexpected for a web server context.

  - **Analyze command lines of child processes:** Look for CommandLine values of child processes (e.g., containing `powershell.exe`, `cmd.exe`, or listed anomalous executables). Malicious command lines may involve downloading additional payloads or executing system commands.

  - **Validate legitimate web application behavior:** Identify if the parent processes are part of legitimate web applications. For example, a process spawned from `w3wp.exe` (IIS Worker Process) should generally not execute `cmd.exe` or `powershell.exe`.

  - **Correlate with additional security telemetry:** Use Sysmon logs to identify parent and child process relationships. Assess if unusual parent-child process combinations correlate with alerts from IDS/IPS or web application firewalls indicating potential exploitation.

  - **Identify known false positives:** Evaluate recent changes or legitimate applications that may utilize the processes listed in the filter (like `ADManager`). Determine if their command lines suggest expected behavior versus malicious intent.

  - **Investigate asset criticality:** Ascertain if affected servers are hosting critical applications or sensitive data, prioritizing response based on asset impact and importance within the enterprise environment.

  ### Prioritization

  This alert is of **high severity** due to the potential exploitation of web servers, which are often primary targets for adversaries aiming to establish footholds within enterprise environments. Such behaviors are increasingly weaponized, especially with prevalence in recent cyberattack patterns, where web shells facilitate further compromise.

  ### Blind Spots and Assumptions

  Detection may miss cases where an adversary utilizes obfuscation or renamed legitimate processes to evade this rule. Additionally, the lack of sufficient logging from less monitored servers could hinder detection. Legitimate activities triggering this alert might include maintenance tasks performed by web application frameworks. A related detection would be identifying unusual outbound network activity from web server processes, which would complement this rule by revealing potential command and control communications.

