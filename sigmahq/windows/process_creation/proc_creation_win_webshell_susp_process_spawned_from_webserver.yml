title: Suspicious Process By Web Server Process
id: 8202070f-edeb-4d31-a010-a26c72ac5600
status: test
description: |
  Detects potentially suspicious processes being spawned by a web server process which could be the result of a successfully placed web shell or exploitation
references:
- https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
author: Thomas Patzke, Florian Roth (Nextron Systems), Zach Stanford @svch0st, Tim
  Shelton, Nasreddine Bencherchali (Nextron Systems)
date: 2019-01-16
modified: 2024-11-26
tags:
- attack.persistence
- attack.initial-access
- attack.t1505.003
- attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\php.exe'
    - '\tomcat.exe'
    - '\UMWorkerProcess.exe'          # https://www.fireeye.com/blog/threat-research/2021/03/detection-response-to-exploitation-of-microsoft-exchange-zero-day-vulnerabilities.html
    - '\w3wp.exe'
    - '\ws_TomcatService.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentCommandLine|contains:
    - 'CATALINA_HOME'
    - 'catalina.home'
    - 'catalina.jar'
  selection_anomaly_children:
    Image|endswith:
    - '\arp.exe'
    - '\at.exe'
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\dsget.exe'
    - '\hostname.exe'
    - '\nbtstat.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netdom.exe'
    - '\netsh.exe'
    - '\nltest.exe'
    - '\ntdsutil.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\qprocess.exe'
    - '\query.exe'
    - '\qwinsta.exe'
    - '\reg.exe'
    - '\rundll32.exe'
    - '\sc.exe'
    - '\sh.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    - '\wusa.exe'
  filter_main_fp_1:
    ParentImage|endswith: '\java.exe'
    CommandLine|endswith: 'Windows\system32\cmd.exe /c C:\ManageEngine\ADManager "Plus\ES\bin\elasticsearch.bat
      -Enode.name=RMP-NODE1 -pelasticsearch-pid.txt'
  filter_main_fp_2:
    ParentImage|endswith: '\java.exe'
    CommandLine|contains|all:
    - 'sc query'
    - 'ADManager Plus'
  condition: 1 of selection_webserver_* and selection_anomaly_children and not 1 of
    filter_main_*
falsepositives:
- Particular web applications may spawn a shell process legitimately
level: high
note: |
  ### Technical Context
  This rule is designed to detect potentially malicious processes being spawned by legitimate web server processes. Such activity may suggest the presence of a web shell or exploitation of vulnerabilities within the web application ecosystem. Attackers often leverage web-serving platforms to execute arbitrary commands or scripts, leading to unauthorized access and control over the affected system. The objective typically includes lateral movement within the network and exfiltration of sensitive data.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: This phase encompasses the methods attackers use to gain an initial foothold in a network, such as exploiting web applications.
  - **Persistence (TA0003)**: Techniques like **T1505.003 (Web Shell)** illustrate how attackers maintain access through malicious web shells.
  - **Execution (TA0002)**: Detecting processes initiated by web server software can point toward the execution of unauthorized commands.

  Primary data sources for this detection include:
  - **Process creation events**: These logs provide insight into the execution of programs, capturing the parent-child relationship and the command line arguments used.
  - **Web server logs**: Access and error logs may offer context about incoming requests that correlate with suspicious process activity.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for processes initiated by recognized web server binaries (e.g., `httpd.exe`, `nginx.exe`). Investigate any child processes that are unexpected or have anomalous names.
  - **Correlate with Web Server Logs**: Look at the web server access logs to identify any incoming requests that precede suspicious process creation. Pay attention to unusual URL patterns or request methods that could indicate exploitation attempts.
  - **Analyze Command Line Arguments**: Focus on command lines associated with newly spawned processes that signal potential malicious activity (e.g., execution of networking tools or Windows utilities like `powershell.exe`, `cmd.exe`).
  - **Check for False Positives**: Review the context around any flagged alerts for known legitimate processes specific to your environment, as certain web applications may spawn expected subprocesses.

  ### Prioritization
  Alerts generated by this rule should be prioritized as high due to the potential risk of compromised server environments, which can lead to broader network intrusions and data breaches. The techniques involved in exploiting web applications are commonly employed by attackers, making detection critical for maintaining enterprise security.

  ### Blind Spots and Assumptions
  There are possible blind spots in environments with custom web applications or configurations that may not align with typical server processes captured in the rule. The detection logic assumes that logs for process creation are being collected and are complete, which may not always be the case due to logging configuration settings. Additionally, legitimate web applications could spawn unusual processes that could lead to false positives, making it essential to investigate in context and validate normal operational behavior in your environment.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
