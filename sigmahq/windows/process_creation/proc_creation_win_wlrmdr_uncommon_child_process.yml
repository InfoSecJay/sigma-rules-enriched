title: Wlrmdr.EXE Uncommon Argument Or Child Process
id: 9cfc00b6-bfb7-49ce-9781-ef78503154bb
status: experimental
description: |
  Detects the execution of "Wlrmdr.exe" with the "-u" command line flag which allows anything passed to it to be an argument of the ShellExecute API, which would allow an attacker to execute arbitrary binaries.
  This detection also focuses on any uncommon child processes spawned from "Wlrmdr.exe" as a supplement for those that posses "ParentImage" telemetry.
references:
- https://twitter.com/0gtweet/status/1493963591745220608?s=20&t=xUg9DsZhJy1q9bPTUWgeIQ
- https://lolbas-project.github.io/lolbas/Binaries/Wlrmdr/
author: frack113, manasmbellani
date: 2022-02-16
modified: 2025-10-31
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:   # This selection is looking for processes spawned from wlrmdr using the "-u" flag
    ParentImage|endswith: '\wlrmdr.exe'
  selection_child_img:
  - Image|endswith: '\wlrmdr.exe'
  - OriginalFileName: 'WLRMNDR.EXE'
  selection_child_cli_flags_s:
    CommandLine|contains|windash: '-s '
  selection_child_cli_flags_f:
    CommandLine|contains|windash: '-f '
  selection_child_cli_flags_t:
    CommandLine|contains|windash: '-t '
  selection_child_cli_flags_m:
    CommandLine|contains|windash: '-m '
  selection_child_cli_flags_a:
    CommandLine|contains|windash: '-a '
  selection_child_cli_flags_u:
    CommandLine|contains|windash: '-u '
  filter_main_winlogon:
    ParentImage: 'C:\Windows\System32\winlogon.exe'
  filter_main_empty:
    ParentImage:
    - ''
    - '-'
  filter_main_null:
    ParentImage:
  condition: selection_parent or (all of selection_child_* and not 1 of filter_main_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious activity surrounding the execution of "Wlrmdr.exe" with the "-u" command line argument. The "-u" flag is particularly concerning as it allows the execution of arbitrary binaries via the ShellExecute API, making it a potential vector for attackers to execute malicious payloads. The detection also incorporates monitoring for unusual child processes spawned from "Wlrmdr.exe," which can be indicative of a compromise or abuse of legitimate processes for malicious purposes.

  Threat actors may exploit this executable to orchestrate various types of attacks, such as lateral movement or persistence strategies by leveraging its functionality within Windows environments. The likely objectives of such attackers may include data exfiltration, system manipulation, or evading detection by mimicking legitimate application behavior. According to the MITRE ATT&CK framework, this activity is relevant to the Defense Evasion tactic (TA0005) and the technique T1218, which focuses on leveraging legitimate binaries to execute commands.

  The primary data sources for this detection include process creation event logs, which provide information on command line arguments and parent-child process relationships. Analyzing these logs can aid in identifying potentially malicious command line usage and confirm the legitimacy of the processes involved.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze Windows process creation logs that include entries for "Wlrmdr.exe." Look for uncommon usage of the "-u" argument and any associated command line flags that may indicate suspicious patterns.

  - **Examine Parent-Child Relationships**: Investigate the parent-child process tree involving "Wlrmdr.exe." Determine whether any unusual child processes are spawned from this executable, which could signal exploitation attempts.

  - **Query for Unusual Command Line Arguments**: Search for occurrences of uncommon command line arguments used alongside "Wlrmdr.exe" execution, especially flags like "-s," "-f," "-t," "-m," "-a," and the critical "-u." Identify instances that deviate from normal operational behavior.

  - **Correlate with Event Logs**: Cross-reference findings with other security logs, such as EDR alerts and logging from endpoint protection solutions, to gather additional context on system behavior around the detected process execution.

  ### Prioritization
  The medium severity of this alert is justified given that the exploitation of "Wlrmdr.exe" can lead to arbitrary code execution, posing a significant risk to an enterprise's security posture. The likelihood of detection is elevated given the unusual usage patterns that can be readily identified through strict monitoring.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the environments lack comprehensive process creation logging or if "Wlrmdr.exe" is often utilized for legitimate applications within the network. The detection logic assumes that there are no benign instances of "Wlrmdr.exe" executing with the flagged arguments and child processes. Continuous logging of process creation events, including details on command line arguments and parent processes, is essential for the detection rule to function effectively.

