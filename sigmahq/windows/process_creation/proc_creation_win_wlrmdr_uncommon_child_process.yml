title: Wlrmdr.EXE Uncommon Argument Or Child Process
id: 9cfc00b6-bfb7-49ce-9781-ef78503154bb
status: experimental
description: |
  Detects the execution of "Wlrmdr.exe" with the "-u" command line flag which allows anything passed to it to be an argument of the ShellExecute API, which would allow an attacker to execute arbitrary binaries.
  This detection also focuses on any uncommon child processes spawned from "Wlrmdr.exe" as a supplement for those that posses "ParentImage" telemetry.
references:
- https://twitter.com/0gtweet/status/1493963591745220608?s=20&t=xUg9DsZhJy1q9bPTUWgeIQ
- https://lolbas-project.github.io/lolbas/Binaries/Wlrmdr/
author: frack113, manasmbellani
date: 2022-02-16
modified: 2025-10-31
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:   # This selection is looking for processes spawned from wlrmdr using the "-u" flag
    ParentImage|endswith: '\wlrmdr.exe'
  selection_child_img:
  - Image|endswith: '\wlrmdr.exe'
  - OriginalFileName: 'WLRMNDR.EXE'
  selection_child_cli_flags_s:
    CommandLine|contains|windash: '-s '
  selection_child_cli_flags_f:
    CommandLine|contains|windash: '-f '
  selection_child_cli_flags_t:
    CommandLine|contains|windash: '-t '
  selection_child_cli_flags_m:
    CommandLine|contains|windash: '-m '
  selection_child_cli_flags_a:
    CommandLine|contains|windash: '-a '
  selection_child_cli_flags_u:
    CommandLine|contains|windash: '-u '
  filter_main_winlogon:
    ParentImage: 'C:\Windows\System32\winlogon.exe'
  filter_main_empty:
    ParentImage:
    - ''
    - '-'
  filter_main_null:
    ParentImage:
  condition: selection_parent or (all of selection_child_* and not 1 of 
    filter_main_*)
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of "wlrmdr.exe" with the "-u" command line argument, which enables the possibility for executing arbitrary binaries via the ShellExecute API. The likely attacker objective is to execute malicious code or to use the shell to launch additional payloads. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique for Command-Line Interface (T1218).

  Primary telemetry sources include Windows process creation logs, specifically those capturing Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation). If an attacker is successfully leveraging this technique, it could lead to unauthorized code execution on the system, potentially compromising sensitive data or facilitating further attacks. Importantly, this detection does not confirm that the activity is malicious on its own, as legitimate uses of "wlrmdr.exe" might exist.

  ---

  ### Investigation Steps

  - **Examine the Command Line Arguments:** Check the command line for recent executions of "wlrmdr.exe" for the "-u" flag. Review Event ID 4688 and Sysmon Event ID 1 for the ParentImage field showing `C:\Windows\System32\wlrmdr.exe`. Confirm any additional arguments provided.

  - **Identify Child Processes:** Look for any uncommon child processes spawned by "wlrmdr.exe." Specifically, check for events with the ParentImage set to "wlrmdr.exe" that contain parameters like "-a," "-m," or "-t." Validate the Image field for processes that were created as a result.

  - **Correlate with Known Good Behavior:** Gather context by comparing with expected behavior of "wlrmdr.exe," which should typically not invoke ShellExecute with the "-u" argument. Review environment documentation to identify common usage scenarios.

  - **Assess Event Creation Timestamps:** Review the timestamps of related process creation logs to determine if they correlate with other suspicious activities or known indicators of compromise (IoCs) within the environment.

  - **Search for Malicious Indicators:** Look for high-confidence malicious indicators in related logs from the same time frame. Identify if the command line includes references to known malicious binaries or paths external to the system, which might suggest an exfiltration attempt.

  - **Cross-Reference with Threat Intelligence:** Validate against threat intelligence feeds for reported exploitation techniques associated with "wlrmdr.exe." Identify any recent advisories or alerts correlating with the execution time of the detected process.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on systems executing "wlrmdr.exe," especially if they are part of critical infrastructure. The likelihood of malicious abuse is moderate, as such command modifications can be indicative of weaponization tactics often used by adversaries to bypass detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in cases where "wlrmdr.exe" is used for legitimate administration or automation tasks. Ensure that logging is properly configured for process creation events to capture all necessary telemetry effectively. The alert may also be triggered by benign activities, such as software updates or system configurations. A related detection could include monitoring for unusual parent-child process relationships or invoking of other known benign executables being misused in a similar fashion.

