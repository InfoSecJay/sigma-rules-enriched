title: Wlrmdr.EXE Uncommon Argument Or Child Process
id: 9cfc00b6-bfb7-49ce-9781-ef78503154bb
status: experimental
description: |
  Detects the execution of "Wlrmdr.exe" with the "-u" command line flag which allows anything passed to it to be an argument of the ShellExecute API, which would allow an attacker to execute arbitrary binaries.
  This detection also focuses on any uncommon child processes spawned from "Wlrmdr.exe" as a supplement for those that posses "ParentImage" telemetry.
references:
- https://twitter.com/0gtweet/status/1493963591745220608?s=20&t=xUg9DsZhJy1q9bPTUWgeIQ
- https://lolbas-project.github.io/lolbas/Binaries/Wlrmdr/
author: frack113, manasmbellani
date: 2022-02-16
modified: 2025-10-31
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:   # This selection is looking for processes spawned from wlrmdr using the "-u" flag
    ParentImage|endswith: '\wlrmdr.exe'
  selection_child_img:
  - Image|endswith: '\wlrmdr.exe'
  - OriginalFileName: 'WLRMNDR.EXE'
  selection_child_cli_flags_s:
    CommandLine|contains|windash: '-s '
  selection_child_cli_flags_f:
    CommandLine|contains|windash: '-f '
  selection_child_cli_flags_t:
    CommandLine|contains|windash: '-t '
  selection_child_cli_flags_m:
    CommandLine|contains|windash: '-m '
  selection_child_cli_flags_a:
    CommandLine|contains|windash: '-a '
  selection_child_cli_flags_u:
    CommandLine|contains|windash: '-u '
  filter_main_winlogon:
    ParentImage: 'C:\Windows\System32\winlogon.exe'
  filter_main_empty:
    ParentImage:
    - ''
    - '-'
  filter_main_null:
    ParentImage:
  condition: selection_parent or (all of selection_child_* and not 1 of filter_main_*)
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of `Wlrmdr.exe` with the `-u` command-line argument, which interacts with the ShellExecute API, potentially allowing attackers to execute arbitrary commands or binaries. The objective is likely to bypass security controls by chaining malicious code execution to a legitimate system process. This behavior aligns with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution).

  Primary telemetry sources include process creation logs such as Windows Security Event ID 4688 or Sysmon Event ID 1, which capture command-line arguments and parent-child process relationships. If malicious, the impact can be significant, as it may facilitate the execution of undetected malware. Importantly, this detection does NOT confirm malicious intent or successful exploitation on its own; benign processes could utilize similar command-line arguments.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Investigate Windows Security Event ID 4688 or Sysmon Event ID 1 for `Wlrmdr.exe` execution with the `-u` flag. Look for instances around the triggered alert time.

  - **Examine child processes:** Identify any child processes spawned by `Wlrmdr.exe` using Sysmon Event ID 10. Verify the command lines for unexpected patterns or known malicious indicators, including arguments like `-s`, `-f`, `-t`, `-m`, and `-a`.

  - **Validate benign usage:** Confirm if `Wlrmdr.exe` is executed by legitimate system processes like `winlogon.exe`. Document usual arguments and child processes for comparison against the alert.

  - **Check for additional indicators:** Look for other unusual command-line arguments that are flagged (e.g., `-s`, `-f`). Malicious activities typically exhibit obfuscation or unusual parent-child relationships when spawning processes.

  - **Identify potential indicators of compromise (IoCs):** Utilize threat intelligence to reference known bad command-line usage patterns associated with `Wlrmdr.exe`. Investigate if any output correlates with specific malware signatures that leverage this utility.

  - **Confirm asset roles:** Correlate the event to asset criticality, determining if `Wlrmdr.exe` usage falls within normal operations for the affected host. High-value systems may warrant increased scrutiny.

  ---

  ### Prioritization

  The alert is of medium severity, as `Wlrmdr.exe` is a legitimate system process that, when manipulated, can facilitate malicious behaviors. While execution with the `-u` flag is uncommon, the likelihood of malicious abuse is moderate given the potential ramifications of arbitrary code execution. This technique is not widely weaponized but still presents a valid avenue for exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate applications to invoke `Wlrmdr.exe` inadvertently, leading to false positives. A necessary log source includes both Security Event IDs for process creation and Sysmon logs for detailed process tracking. Additionally, some administrative tasks or third-party applications may trigger similar behavior without malicious intent. Companion detections from tools monitoring process hierarchies or known malware patterns can enhance overall coverage and context.

