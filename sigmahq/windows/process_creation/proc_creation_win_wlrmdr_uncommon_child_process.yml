title: Wlrmdr.EXE Uncommon Argument Or Child Process
id: 9cfc00b6-bfb7-49ce-9781-ef78503154bb
status: experimental
description: |
  Detects the execution of "Wlrmdr.exe" with the "-u" command line flag which allows anything passed to it to be an argument of the ShellExecute API, which would allow an attacker to execute arbitrary binaries.
  This detection also focuses on any uncommon child processes spawned from "Wlrmdr.exe" as a supplement for those that posses "ParentImage" telemetry.
references:
- https://twitter.com/0gtweet/status/1493963591745220608?s=20&t=xUg9DsZhJy1q9bPTUWgeIQ
- https://lolbas-project.github.io/lolbas/Binaries/Wlrmdr/
author: frack113, manasmbellani
date: 2022-02-16
modified: 2025-10-31
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:   # This selection is looking for processes spawned from wlrmdr using the "-u" flag
    ParentImage|endswith: '\wlrmdr.exe'
  selection_child_img:
  - Image|endswith: '\wlrmdr.exe'
  - OriginalFileName: 'WLRMNDR.EXE'
  selection_child_cli_flags_s:
    CommandLine|contains|windash: '-s '
  selection_child_cli_flags_f:
    CommandLine|contains|windash: '-f '
  selection_child_cli_flags_t:
    CommandLine|contains|windash: '-t '
  selection_child_cli_flags_m:
    CommandLine|contains|windash: '-m '
  selection_child_cli_flags_a:
    CommandLine|contains|windash: '-a '
  selection_child_cli_flags_u:
    CommandLine|contains|windash: '-u '
  filter_main_winlogon:
    ParentImage: 'C:\Windows\System32\winlogon.exe'
  filter_main_empty:
    ParentImage:
    - ''
    - '-'
  filter_main_null:
    ParentImage:
  condition: selection_parent or (all of selection_child_* and not 1 of 
    filter_main_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "Wlrmdr.exe" (Windows Remote Management Daemon) with the "-u" command-line flag, which allows attackers to pass arbitrary arguments to the ShellExecute API, potentially executing malicious binaries. The likely objective is to gain unauthorized access or control over targeted systems via exploitation of the compromised Windows environment. This behavior aligns with the MITRE ATT&CK techniques for Executing commands and tools, specifically T1218 (Windows Remote Management).

  The primary telemetry sources required for this detection include process creation logs (Windows Event ID 4688 or Sysmon Event ID 1). If executed maliciously, this action could lead to system compromise and data exfiltration. However, this detection does NOT confirm an attack on its own; it may also be triggered by legitimate administrative actions or misconfigurations.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Event ID 4688 for instances of "Wlrmdr.exe" being executed with the "-u" flag. Pay particular attention to the CommandLine parameter for suspicious patterns or additional arguments.

  - **Identify child processes**: Investigate any child processes spawned by "Wlrmdr.exe" with a CommandLine that includes flags like "-s", "-f", "-t", "-m", or "-a". Focus on any unusual or unexpected binaries launched.

  - **Review parent process**: Confirm the parent image associated with the detection. Processes initiated by "winlogon.exe" or without a clear parent may indicate malicious activity.

  - **Establish baseline for legitimate activity**: Consider normal administrative uses of "Wlrmdr.exe" within your environment (e.g., authorized IT staff executing remote management tasks) and compare the detected instances against these baselines.

  - **Look for known malicious indicators**: Cross-reference the command-line arguments and spawned processes with threat intelligence sources to identify any that are associated with documented adversarial tactics or known malware families.

  - **Analyze impacted assets**: Determine the asset criticality and role. Anomalous behavior on critical servers or user devices that access sensitive information warrants immediate attention.

  ### Prioritization

  This alert should be considered medium-to-high severity in an enterprise environment, especially if it occurs on critical systems or in sensitive areas of the network. The likelihood of abuse is relatively high as the detected behavior can be used to execute unauthorized commands, making it a common tactic among advanced threats.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as arguments or processes disguising their intent or usage of legitimate administrative tools. It is essential to ensure that process creation logging is properly configured and that Sysmon is in place for comprehensive visibility. Legitimate activities may include authorized remote management sessions. Additional detections, such as monitoring for known malicious command-line arguments across other processes, can enhance coverage and reduce false negatives.

