title: HackTool - SharpDPAPI Execution
id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
status: test
description: |
  Detects the execution of the SharpDPAPI tool based on CommandLine flags and PE metadata.
  SharpDPAPI is a C# port of some DPAPI functionality from the Mimikatz project.
references:
- https://github.com/GhostPack/SharpDPAPI
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-26
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1134.001
- attack.t1134.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\SharpDPAPI.exe'
  - OriginalFileName: 'SharpDPAPI.exe'
  selection_other_cli:
    CommandLine|contains:
    - ' backupkey '
    - ' blob '
    - ' certificates '
    - ' credentials '
    - ' keepass '
    - ' masterkeys '
    - ' rdg '
    - ' vaults '
  selection_other_options_guid:
    CommandLine|contains|all:
    - ' {'
    - '}:'
  selection_other_options_flags:
    CommandLine|contains:
    - ' /file:'
    - ' /machine'
    - ' /mkfile:'
    - ' /password:'
    - ' /pvk:'
    - ' /server:'
    - ' /target:'
    - ' /unprotect'
  condition: selection_img or (selection_other_cli and 1 of selection_other_options_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the SharpDPAPI tool, a utility derived from the Mimikatz project, designed to access and manipulate Windows Data Protection API (DPAPI) encrypted data. Attackers may use SharpDPAPI to recover sensitive information such as passwords and encryption keys stored within the Windows environment. The presence of this tool can indicate privilege escalation attempts or credential theft, making it critical for security teams to monitor for its usage.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation** (Tactic ID: TA0004) due to its capacity to elevate an attacker's privileges by accessing stored credentials, and **Defense Evasion** (Tactic ID: TA0005) as attackers might leverage SharpDPAPI to mask their activity while exfiltrating sensitive data. Techniques associated with this detection include **T1134.001 - Access Token Manipulation: Token Impersonation/Theft** and **T1134.003 - Access Token Manipulation: Token Copying**.

  Primary data sources for effective detection of SharpDPAPI usage include process creation logs, which can provide insights into command-line executions, and endpoint detection logs. These sources allow for visibility into unusual executions and flags commonly associated with this tool.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs for any instances involving `SharpDPAPI.exe`, focusing on timestamps and associated user accounts executing the process.
  - **Examine Command-Line Arguments:** Inspect the command-line parameters of detected SharpDPAPI executions for keywords such as `backupkey`, `certificates`, and `unprotect` to ascertain the potential intent and targeted data.
  - **Correlate with Authenticated User Activity:** Cross-reference the user context of the SharpDPAPI executions with recent authentication and privilege elevation events to identify any anomalous activity or elevated privileges that may coincide with tool usage.
  - **Assess Network Traffic:** Monitor outbound network traffic following SharpDPAPI execution for any irregular data exfiltration attempts, especially if sensitive credentials or protected information are accessed.

  ### Prioritization
  This alert is deemed high priority due to the potential for severe impact on enterprise security if sensitive data is accessed or credentials are compromised. The likelihood of attackers utilizing such tools for malicious purposes raises the urgency of remediation actions.

  ### Blind Spots and Assumptions
  The detection logic may not capture instances where SharpDPAPI is executed with obfuscated file names or through different code paths not identified in this rule. Additionally, it assumes that the necessary logging configurations (e.g., process creation auditing) are enabled on endpoint devices. If relevant logs are not collected or if command-line arguments are heavily obfuscated, potential detections may be missed.

