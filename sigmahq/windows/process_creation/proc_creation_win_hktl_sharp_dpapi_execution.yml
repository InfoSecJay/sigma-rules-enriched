title: HackTool - SharpDPAPI Execution
id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
status: test
description: |
  Detects the execution of the SharpDPAPI tool based on CommandLine flags and PE metadata.
  SharpDPAPI is a C# port of some DPAPI functionality from the Mimikatz project.
references:
- https://github.com/GhostPack/SharpDPAPI
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-26
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1134.001
- attack.t1134.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\SharpDPAPI.exe'
  - OriginalFileName: 'SharpDPAPI.exe'
  selection_other_cli:
    CommandLine|contains:
    - ' backupkey '
    - ' blob '
    - ' certificates '
    - ' credentials '
    - ' keepass '
    - ' masterkeys '
    - ' rdg '
    - ' vaults '
  selection_other_options_guid:
    CommandLine|contains|all:
    - ' {'
    - '}:'
  selection_other_options_flags:
    CommandLine|contains:
    - ' /file:'
    - ' /machine'
    - ' /mkfile:'
    - ' /password:'
    - ' /pvk:'
    - ' /server:'
    - ' /target:'
    - ' /unprotect'
  condition: selection_img or (selection_other_cli and 1 of selection_other_options_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the SharpDPAPI tool, which is a C# implementation associated with manipulating the Windows Data Protection API (DPAPI). Its primary function is to extract sensitive data such as passwords or cryptographic keys from a compromised machine. The likely attacker objective involves privilege escalation and credential theft within a Windows environment.

  The relevant MITRE ATT&CK techniques are:
  - Credential Dumping (T1003)
      - DPAPI (T1003.001)
      - Credentials from Web Browsers (T1003.003)

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and potentially Sysmon logs (Event ID 1), focusing on fields like CommandLine and OriginalFileName. If malicious, this behavior could lead to significant security breaches through unauthorized access to sensitive information. It is essential to note that this detection does NOT confirm malicious intent on its own; it indicates only the execution of a tool known for nefarious uses.

  ### Investigation Steps

  - **Review executed process:** Check for `SharpDPAPI.exe` in the process creation logs (Windows Security Event ID 4688 or Sysmon Event ID 1). Validate the Image field to assess if it ends with `\SharpDPAPI.exe`, indicating potential malicious usage.

  - **Analyze command line arguments:** Evaluate the CommandLine field in logs for specific flags such as `backupkey`, `blob`, `credentials`, or `/unprotect`. The presence of any of these flags alongside `SharpDPAPI` supports malicious intent.

  - **Identify user context:** Determine the user account executing the SharpDPAPI tool. A high-risk context would be a non-administrative user executing this tool on a critical asset.

  - **Correlate with normal behavior:** Compare the findings against expected user behavior. If the user has a legitimate reason to run SharpDPAPI (for example, a system administrator performing backup tasks), this could indicate benign activity.

  - **Extract file/output confirmation:** Check for file creation artifacts or outputs that the tool generates, such as backup files or log files in the user's directory. The presence of files named similar to the executed command (e.g., `backup.key`) might indicate malicious activity.

  ### Prioritization

  This alert is of high severity due to the sensitive nature of the tool involved and the potential impact on credential theft and privilege escalation in the enterprise environment. Given that it is commonly weaponized by attackers to exploit vulnerabilities in Windows authentication mechanisms, it warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon or Security auditing logs for process creation. Evasion techniques may include renaming the executable or modifying the command line to obscure its purpose. Legitimate tools and applications, particularly those related to security tasks, may trigger this alert. A companion detection to consider is monitoring for process trees showing parent-child relationships where `SharpDPAPI` is spawned by known administrative tools, enhancing context for investigation.

