title: HackTool - SharpDPAPI Execution
id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
status: test
description: |
  Detects the execution of the SharpDPAPI tool based on CommandLine flags and PE metadata.
  SharpDPAPI is a C# port of some DPAPI functionality from the Mimikatz project.
references:
- https://github.com/GhostPack/SharpDPAPI
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-26
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\SharpDPAPI.exe'
  - OriginalFileName: 'SharpDPAPI.exe'
  selection_other_cli:
    CommandLine|contains:
    - ' backupkey '
    - ' blob '
    - ' certificates '
    - ' credentials '
    - ' keepass '
    - ' masterkeys '
    - ' rdg '
    - ' vaults '
  selection_other_options_guid:
    CommandLine|contains|all:
    - ' {'
    - '}:'
  selection_other_options_flags:
    CommandLine|contains:
    - ' /file:'
    - ' /machine'
    - ' /mkfile:'
    - ' /password:'
    - ' /pvk:'
    - ' /server:'
    - ' /target:'
    - ' /unprotect'
  condition: selection_img or (selection_other_cli and 1 of 
    selection_other_options_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of SharpDPAPI, a tool capable of accessing and manipulating user credentials stored in the Windows Data Protection API (DPAPI). Attackers may use SharpDPAPI to extract sensitive information, such as passwords or encryption keys, thereby achieving unauthorized access to resources or elevating their privileges within the environment. This activity maps to the MITRE ATT&CK tactic of Privilege Escalation, specifically techniques T1134.001 (Access Token Manipulation) and T1134.003 (Credential Dumping).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, focusing on the `CommandLine` field for indicators of SharpDPAPI usage. If malicious, this behavior may lead to further lateral movement or data compromise. However, the detection of this tool's execution does NOT confirm that any credential theft or other malicious activity has occurred; it merely indicates that the execution of a suspicious tool was observed.

  ### Investigation Steps

  - **Check Process Creation Events:**
    Review Windows Event ID 4688 for instances where `Image` ends with `\SharpDPAPI.exe`. Verify the `CommandLine` for flags that indicate intended usage of the tool.

  - **Identify Malicious CommandLine Arguments:**
    Focus on `CommandLine` fields containing phrases such as 'backupkey', 'credentials', or '/unprotect'. These can indicate malicious intent, as legitimate usage scenarios are unlikely to use such terms.

  - **Monitor for Benign Usage:**
    If `SharpDPAPI.exe` is observed, cross-reference with known software deployments or support tools in your environment. Legitimate administrative processes should not involve accessing user credentials without clear documentation.

  - **Correlate with User Account Activities:**
    Assess logs for recent account activities associated with the user executing SharpDPAPI. Look for abnormal authentication attempts or access to sensitive systems, indicative of potential misuse.

  - **Validate File Creation or Changes:**
    Investigate for creation or modification events related to sensitive files following the execution of SharpDPAPI (e.g., Event ID 4656 for handle requests on credential files). Unexpected access patterns to sensitive files could further indicate malicious intent.

  - **Consider Asset Criticality:**
    Evaluate the host running SharpDPAPI; if it's a domain controller or server handling critical applications, prioritize investigative efforts due to increased risk of broader system compromise.

  ### Prioritization

  The alert severity is high due to the potential impact of compromised credentials on sensitive systems and the likelihood of SharpDPAPI being used for credential dumping, which is a common post-exploitation technique. This activity is frequently weaponized in attacks aimed at privilege escalation and lateral movement.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers renaming the executable or altering parameters to evade detection. Effective monitoring requires proper logging configurations for process creation across all endpoints. Additionally, legitimate administrative activities invoking DPAPI functionalities may inadvertently trigger the alert, particularly from trusted applications. A related detection to consider is monitoring for credential dumping tools in general, providing a broader context for potential exploitation scenarios.

