title: HackTool - SharpDPAPI Execution
id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
status: test
description: |
  Detects the execution of the SharpDPAPI tool based on CommandLine flags and PE metadata.
  SharpDPAPI is a C# port of some DPAPI functionality from the Mimikatz project.
references:
- https://github.com/GhostPack/SharpDPAPI
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-26
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1134.001
- attack.t1134.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\SharpDPAPI.exe'
  - OriginalFileName: 'SharpDPAPI.exe'
  selection_other_cli:
    CommandLine|contains:
    - ' backupkey '
    - ' blob '
    - ' certificates '
    - ' credentials '
    - ' keepass '
    - ' masterkeys '
    - ' rdg '
    - ' vaults '
  selection_other_options_guid:
    CommandLine|contains|all:
    - ' {'
    - '}:'
  selection_other_options_flags:
    CommandLine|contains:
    - ' /file:'
    - ' /machine'
    - ' /mkfile:'
    - ' /password:'
    - ' /pvk:'
    - ' /server:'
    - ' /target:'
    - ' /unprotect'
  condition: selection_img or (selection_other_cli and 1 of 
    selection_other_options_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the SharpDPAPI tool, which is a C# implementation of part of the DPAPI functionality associated with Windows credential management and manipulation. The detection focuses on specific command line arguments and executable file metadata indicative of potential unauthorized credential access or key extraction attempts. The likely objective for an attacker utilizing this tool is to extract sensitive information such as stored passwords, user credentials, or cryptographic keys to further escalate privileges or conduct lateral movement within the network.

  This behavior is mapped to the MITRE ATT&CK framework under the tactic of Privilege Escalation (ID: TA-002 Elevation of Privilege) and the technique of Credential Dumping (ID: T1003.001). The primary telemetry source required for this detection is Windows process creation logs, specifically examining Event ID 4688 or Sysmon Event ID 1, focusing on the Image and CommandLine fields. The security impact of using SharpDPAPI maliciously can lead to significant credential theft, undermining key security measures within an organization. However, this detection does NOT confirm malicious intent on its own; further investigation is required to contextualize the execution of SharpDPAPI.

  ### Investigation Steps

  - **Verify process creation details:** Confirm that Event ID 4688 (or Sysmon Event ID 1) logs show the execution of `SharpDPAPI.exe`, with the corresponding CommandLine parameters indicative of sensitive data interaction.

  - **Review command line arguments:** Look for specific CommandLine arguments such as `/target:` or `backupkey`, as these indicate potential credential extraction attempts. Compare with the organization’s baseline for expected command behavior in legitimate use cases.

  - **Analyze user context:** Check the User field in the process creation logs to determine if the command was executed by a privileged user or a service account, as this can increase the risk associated with the activity.

  - **Identify related events:** Correlate with other logs such as Security Event ID 4624 (logon events) to identify the user activity leading up to the execution of SharpDPAPI, determining if it aligns with typical organizational behavior.

  - **Monitor for common benign uses:** Look for established legitimate usage patterns for the tool in user documentation or previous incidents to distinguish between authorized operational usage and potential adversarial behavior.

  - **Cross-check with endpoint telemetry:** Investigate file creation artifacts or changes related to credential stores or vaults referenced in the CommandLine. Look for any suspicious file modifications or network connections initiated by the process.

  ### Prioritization

  This alert has a high severity level as it indicates potential credential dumping, which can allow attackers to gain unauthorized access to additional accounts and escalate privileges significantly. The likelihood of malicious abuse is considerable, as tools like SharpDPAPI are often weaponized in attacks against compromised environments for further infiltration.

  ### Blind Spots and Assumptions

  The detection may be limited if the execution is obfuscated or if the logs are not accurately collected due to misconfiguration. Legitimate administrative activities may trigger the alert if SharpDPAPI has been used for benign purposes, such as routine credential management. It is beneficial to enhance coverage with related detections for other credential dumping tools or methods (e.g., Mimikatz usage) to augment detection capabilities.

