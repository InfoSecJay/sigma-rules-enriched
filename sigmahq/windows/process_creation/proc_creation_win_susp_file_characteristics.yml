note: |
  ### Technical Context
  This detection rule identifies executables located in the Windows Downloads folder that lack essential metadata fields such as FileVersion, Description, Product, and Company. These missing fields are indicative of files potentially generated through tools like py2exe, often used by malicious actors to package Python scripts into executable files while omitting detailed metadata to avoid detection. The key objective of an attacker employing this method is to execute arbitrary code that could lead to further compromise within enterprise environments by evading common security measures.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Execution (TA0002)**: This tactic involves running malicious code in the environment.
  - **User Execution (T1203)**: This technique focuses on an attacker’s exploitation of user execution of malicious files.

  The primary data sources for this detection are process creation events logged by Windows. These events can provide valuable insights into the execution of suspicious files, specifically noting those with absent or incomplete metadata fields.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze Windows process creation logs to identify executables launched from the Downloads folder. Pay close attention to logs that indicate the absence of the FileVersion, Description, Product, and Company fields.

  - **Correlate with Antivirus/EDR Data**: Check antivirus and endpoint detection and response (EDR) logs to see if the identified files generated alerts or have known signatures associated with malicious behavior.

  - **Inspect File Properties**: For suspicious executables identified, examine the properties using system tools or scripting to confirm missing metadata fields and any other anomalies that may indicate unauthorized creation methods.

  - **Collect Network Activity Logs**: Gather logs related to outbound network connections made by these executables to identify potential command and control (C2) communications or data exfiltration attempts.

  ### Prioritization
  The alert's severity is medium due to the potential for these executables to be part of a more extensive phishing or malware campaign. While not all files missing metadata are malicious, the context provided by their location in the Downloads folder raises significant concerns, warranting careful review.

  ### Blind Spots and Assumptions
  This detection rule may miss files that were executed from locations other than the Downloads folder or have been altered post-download (e.g., modified metadata). The detection logic assumes that unauthorized executables will lack these metadata fields, which may not hold true for all benign applications. For this alert to function correctly, accurate process creation logs must be enabled, and any endpoint protective solutions should appropriately log execution attributes.

