note: |
  ### Technical Context

  This Sigma rule detects the execution of `reg.exe` commands specifically using the "delete" flag on registry keys within the Safe Boot setting. This behavior may indicate an attacker attempting to disable or bypass security measures by preventing the system from booting in Safe Mode, which is often leveraged for maintenance and recovery of systems. The likely objective of the attacker is to impair system defenses to facilitate further malicious activity.

  This detection aligns with the MITRE ATT&CK technique **Defense Evasion: Deactivate Security Tools (T1685)**. The primary telemetry source is Windows process creation logs, specifically focusing on command execution details via Security Event ID 4688 or Sysmon Event ID 1 that capture process creation events. The security impact of this behavior is significant, as it can lead to unmonitored and uncontrolled system access by malicious actors. Importantly, this detection does NOT confirm that malicious activity is occurring solely based on the execution of `reg.exe`; further investigation is necessary to ascertain intent.

  ### Investigation Steps

  - **Validate the command execution:** Check Security Event ID 4688 or Sysmon Event ID 1 for the creation of `reg.exe` processes containing `delete` and `\SYSTEM\CurrentControlSet\Control\SafeBoot` in the CommandLine. Look for fields: `CommandLine`, `NewProcessName`, and `User`. A legitimate execution would likely not involve deletion of this sensitive registry key.

  - **Identify user context:** Confirm the user account associated with the execution of `reg.exe`. Malicious activity is more likely if the command is executed from an administrative account or a system account that should not typically delete Safe Boot settings.

  - **Cross-reference with scheduled tasks:** Review Windows Task Scheduler (Event IDs 4698, 4699) to see if any scheduled tasks have been created or modified that could be responsible for the `reg.exe` execution. Legitimate tasks should not self-delete Safe Boot configurations.

  - **Analyze recent changes in system configuration:** Review Windows Registry modifications (via logs, e.g., Event ID 4657 or Sysmon Registry events) around the time of the detected command. Look for previous modifications to the Safe Boot key and identify if there were related security product installations or updates prior to deletion.

  - **Check for persistence mechanisms:** Inspect for other indicators of compromise, like persistence mechanisms (Event ID 4697 for new service installations or Event ID 7045 logs) post-reg.exe deletion to confirm ongoing malicious activity. Newly installed services should not correlate with known benign software.

  - **Review recent alerts and incidents:** Correlate this event with any outgoing network activity or other alerts (like ransomware activity) reported from endpoints in the same timeframe to establish a pattern of malicious behavior. Use relevant incident reports related to suspicious user behavior around registry modifications.

  ### Prioritization

  This alert should be considered high priority due to the critical nature of the affected system and the significant likelihood of malicious intent; adversaries commonly weaponize registry modifications to evade detection tools. Given that Safe Boot is a critical security feature, any tampering indicates potential exploitation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include batch scripts or usage of other utilities (e.g., PowerShell) to alter the registry without detection. Reliable detection requires that appropriate Windows logging (especially process creation and registry manipulation logs) be enabled. Legitimate administrative actions—such as system maintenance or configurations implemented by IT teams—may also trigger this alert. A companion detection to consider is monitoring for suspicious network activity (e.g., outbound connections) by processes running under user accounts identified in the execution logs, which strengthens the overall security posture.

