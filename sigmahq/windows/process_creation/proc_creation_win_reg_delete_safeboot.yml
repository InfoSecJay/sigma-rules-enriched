note: |
  ### Technical Context

  This Sigma rule detects the execution of the `reg.exe` command with the "delete" flag targeting Safe Boot registry keys. This behavior is often executed by an attacker attempting to disable the Safe Boot option to hinder security products during a malicious operation, such as ransomware deployment. This ties to the MITRE ATT&CK tactic of “Defense Evasion” and specifically the technique T1562.001, which covers the use of various methods to disable or bypass security features.

  The primary telemetry source for this detection is the Windows process creation logs, specifically from Security Event ID 4688 that captures command line arguments, alongside Sysmon Event ID 1 which can also provide insights into process creation events. If executed maliciously, this can lead to significant security impacts as it renders anti-virus and other security measures ineffective. However, it should be noted that this detection alone does not confirm that a malicious action has occurred, as benign administrative activities on a system might also trigger similar behaviors.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances where `reg.exe` runs with command line arguments containing "delete" and the path `\SYSTEM\CurrentControlSet\Control\SafeBoot`.

  - **Identify behavioral patterns**: Look for the context of the execution. Was `reg.exe` invoked in an unusual time or from an unexpected user account? Legitimate uses might involve system maintenance by an admin directly on the server.

  - **Review other related processes**: Investigate if other suspicious commands were executed in conjunction or prior to the detection, such as processes that are commonly associated with known malware (e.g., PowerShell, rundll32). Their presence could strengthen the case for malicious activity.

  - **Correlate account activity**: Analyze login events (Security Event ID 4624) around the same timeframe to see if there are anomalous user logins or activities. High-risk actions should align with access from privileged accounts.

  - **Investigate recent system changes**: Check the Windows Event logs for does user activity or other changes that may validate the authority under which the `reg.exe` command was run. Look for related logs in Application and System to corroborate claimed administrative actions.

  - **Assess system criticality**: Ensure the asset being investigated is critical to your organization. Identify if it hosts sensitive data or is part of a critical service, elevating the importance of timely response to this alert.

  ### Prioritization

  The alert is of high severity due to the potential high impact of disabling Safe Boot on critical systems, making them vulnerable to further malicious activities. The likelihood of malicious abuse is significant, as this method is commonly weaponized by various threat actors to evade detection from protective systems.

  ### Blind Spots and Assumptions

  While the detection is focused on the specific use of `reg.exe`, attackers might employ other methods or tools to alter Safe Boot configurations or achieve similar outcomes, potentially evading detection. The system must be configured to capture detailed process creation logs consistently for reliable detection. Legitimate administrative tasks, particularly in development environments or during system maintenance windows, could potentially trigger this alert without malicious intent. A companion detection for related suspicious PowerShell commands or scripts may provide stronger threat context and improve overall detection accuracy.

