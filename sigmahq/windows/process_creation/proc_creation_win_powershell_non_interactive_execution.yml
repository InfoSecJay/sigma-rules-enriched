title: Non Interactive PowerShell Process Spawned
id: f4bbd493-b796-416e-bbf2-121235348529
status: test
description: Detects non-interactive PowerShell activity by looking at the 
  "powershell" process with a non-user GUI process such as "explorer.exe" as a 
  parent.
references:
- https://web.archive.org/web/20200925032237/https://threathunterplaybook.com/notebooks/windows/02_execution/WIN-190410151110.html
author: Roberto Rodriguez @Cyb3rWard0g (rule), oscd.community (improvements)
date: 2019-09-12
modified: 2023-09-07
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  filter_main_generic:
    ParentImage|endswith:
    - ':\Windows\explorer.exe'
    - ':\Windows\System32\CompatTelRunner.exe'
    - ':\Windows\SysWOW64\explorer.exe'
  filter_main_windows_update:
    ParentImage: ':\$WINDOWS.~BT\Sources\SetupHost.exe'     # During Windows updates/upgrades
        # CommandLine: powershell.exe -ExecutionPolicy Restricted -Command Write-Host 'Final result: 1';
  filter_optional_vscode:
        # Triggered by VsCode when you open a Shell inside the workspace
    ParentImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
    ParentCommandLine|contains: ' --ms-enable-electron-run-as-node '
  filter_optional_terminal:
    ParentImage|contains: ':\Program Files\WindowsApps\Microsoft.WindowsTerminal_'
    ParentImage|endswith: '\WindowsTerminal.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely. Many admin scripts and tools leverage PowerShell in their BAT or VB 
  scripts which may trigger this rule often. It is best to add additional 
  filters or use this to hunt for anomalies
level: low
note: |
  ---

  ### Technical Context

  This rule detects occurrences of non-interactive PowerShell processes initiated by GUI-based parent processes like `explorer.exe`. This behavior often indicates an attempt by an attacker to execute PowerShell commands without user interaction, which is a common tactic for malicious scripts trying to stealthily perform actions on a compromised system. The relevant MITRE ATT&CK tactic is Execution, with the technique being PowerShell (T1059.001).

  Primary telemetry sources include Windows Process Creation logs (Event ID 4688 for security, Sysmon Event ID 1 for detailed process creation), which capture the necessary details such as process images and their parent processes. If malicious, this activity may allow for remote code execution, data exfiltration, or lateral movement. This detection does NOT confirm that the PowerShell execution is malicious; further investigation is required to assess intent.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for details on the PowerShell process (`powershell.exe` or `pwsh.exe`) and the corresponding parent process. Look for unusual timestamps or rare parent-child process relationships that deviate from normal behavior.

  - **Verify the parent process:** Assess the parent image for the PowerShell process. Legitimate parent processes include `explorer.exe`, but frequent automation or use of administrative scripts may also trigger this detection. If the parent image is an unusual system service or tool, consider escalating the investigation.

  - **Check command line usage:** Inspect the command line arguments for the PowerShell process. Malicious activity may include arguments that invoke unusual scripts or encoded commands. Look for any command line activity that appears obfuscated or uncommonly scripted.

  - **Correlate with user activity:** Identify whether the user account associated with the PowerShell execution has administrative privileges or if there are any recent account policy changes. Legitimate uses often involve known scripts run by administrative users during scheduled maintenance or updates.

  - **Identify high-confidence malicious indicators:** Look for known malicious hash values linked to PowerShell scripts or modules, especially those commonly used in known attack frameworks (e.g., Empire, Cobalt Strike). Cross-reference with threat intelligence databases.

  ---

  ### Prioritization

  This alert has a low severity rating in a mature enterprise context due to the prevalence of benign administrative scripts using PowerShell and the likelihood of false positives. However, the potential for misuse, particularly in environments where privilege escalation or lateral movement is possible, necessitates diligent triage.

  ---

  ### Blind Spots and Assumptions

  The detection may not identify sophisticated evasion techniques, such as PowerShell running from a trusted parent process via obfuscation or encoding, rendering it stealthier. Reliable detection requires proper logging configurations and possibly real-time process monitoring to capture all execution scenarios. Legitimate activities, like automated scripts from tasks scheduled during maintenance, may trigger this alert. A companion detection to consider is monitoring for unusual PowerShell cmdlet invocations consistent with post-exploitation behavior (e.g., `Invoke-WebRequest` or `Invoke-Command`).

  ---

