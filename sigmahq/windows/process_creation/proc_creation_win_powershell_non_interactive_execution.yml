title: Non Interactive PowerShell Process Spawned
id: f4bbd493-b796-416e-bbf2-121235348529
status: test
description: Detects non-interactive PowerShell activity by looking at the 
  "powershell" process with a non-user GUI process such as "explorer.exe" as a 
  parent.
references:
- https://web.archive.org/web/20200925032237/https://threathunterplaybook.com/notebooks/windows/02_execution/WIN-190410151110.html
author: Roberto Rodriguez @Cyb3rWard0g (rule), oscd.community (improvements)
date: 2019-09-12
modified: 2025-02-28
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  filter_main_generic:
    ParentImage|endswith:
    - ':\Windows\explorer.exe'
    - ':\Windows\System32\CompatTelRunner.exe'
    - ':\Windows\SysWOW64\explorer.exe'
  filter_main_windows_update:
    ParentImage: ':\$WINDOWS.~BT\Sources\SetupHost.exe'     # During Windows updates/upgrades
        # CommandLine: powershell.exe -ExecutionPolicy Restricted -Command Write-Host 'Final result: 1';
  filter_optional_vscode:
        # Triggered by VsCode when you open a Shell inside the workspace
    ParentImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
    ParentCommandLine|contains: ' --ms-enable-electron-run-as-node '
  filter_optional_terminal:
    ParentImage|contains: ':\Program Files\WindowsApps\Microsoft.WindowsTerminal_'
    ParentImage|endswith: '\WindowsTerminal.exe'
  filter_optional_defender:
    ParentImage|endswith: ':\Program Files\Windows Defender Advanced Threat Protection\SenseIR.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely. Many admin scripts and tools leverage PowerShell in their BAT or VB 
  scripts which may trigger this rule often. It is best to add additional 
  filters or use this to hunt for anomalies
level: low
note: |
  ### Technical Context

  This Sigma rule detects non-interactive execution of PowerShell processes that are spawned by specific GUI processes, most notably "explorer.exe" and the Windows System Update process. The likely attacker objective is to execute malicious scripts without user interaction, facilitating stealthy execution during exploitation phases. This behavior relates to the MITRE ATT&CK technique "Command-Line Interface: PowerShell" (T1059.001), indicative of potential lateral movement or execution of unauthorized commands.

  The primary telemetry source for this alert is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing detailed command line arguments. If malicious, this behavior could allow an adversary to execute scripts for data exfiltration, credential theft, or lateral movement without detection. Importantly, this detection does not definitively confirm malicious intent, as legitimate administrative scripts or tool usage can trigger the same alert.

  ### Investigation Steps

  - **Review the process tree for context:** Identify the parent process of PowerShell execution using Security Event ID 4688. Look for processes originating from "explorer.exe" or related system processes, indicating potential malicious invocation versus expected administrative activity.

  - **Analyze the command line arguments:** Check the CommandLine field in Security Event ID 4688 for unusual parameters or scripts, which can indicate unauthorized use. Legitimate activity often involves straightforward scripts reflecting routine administrative tasks.

  - **Validate the execution origin:** Confirm if the PowerShell process is initiated from a known administrative script or tool (e.g., sysadmin-generated batch files) versus unknown or suspicious command sequences indicative of an attack.

  - **Correlate with other security alerts:** Review recent alerts or logs for related suspicious behavior, such as unusual logins or network connections from the same user or system. These can strengthen the case for or against malicious activity.

  - **Check for scheduled tasks or scripts:** Look for any authorized or unauthorized scheduled tasks (Event ID 4698) that might invoke PowerShell in a non-interactive context, particularly if they're linked to administrative systems or tools.

  ### Prioritization

  This alert carries a low severity due to the high likelihood of benign administrative actions triggering the detection. However, given the prevalence of PowerShell abuse in attacks, it's important to assess whether the affected system is critical or belongs to an administrative role, since misuse here could pose a significant risk.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative uses, such as common task automation scripts. It relies on properly configured process creation logging; any gaps in logging or lack of Sysmon implementation can impair detection efficacy. Additionally, legitimate PowerShell scripts used as part of system maintenance could trigger false positives. Companion detections include network traffic analysis for outbound calls from suspected malicious PowerShell usage, enhancing overall detection effectiveness.

