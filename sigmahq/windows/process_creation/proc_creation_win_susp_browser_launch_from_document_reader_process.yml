title: Potential Suspicious Browser Launch From Document Reader Process
id: 1193d960-2369-499f-a158-7b50a31df682
status: test
description: |
  Detects when a browser process or browser tab is launched from an application that handles document files such as Adobe, Microsoft Office, etc. And connects to a web application over http(s), this could indicate a possible phishing attempt.
references:
- https://app.any.run/tasks/69c5abaa-92ad-45ba-8c53-c11e23e05d04/     # PDF Document
- https://app.any.run/tasks/64043a79-165f-4052-bcba-e6e49f847ec1/     # Office Document
author: Joseph Kamau
date: 2024-05-27
modified: 2025-10-07
tags:
- attack.execution
- attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|contains:
    - 'Acrobat Reader'
    - 'Microsoft Office'
    - 'PDF Reader'
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\maxthon.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    CommandLine|contains: 'http'
  filter_main_microsoft_help:
    CommandLine|contains: 'https://go.microsoft.com/fwlink/'
  filter_optional_foxit:
    CommandLine|contains:
    - 'http://ad.foxitsoftware.com/adlog.php?'
    - 'https://globe-map.foxitservice.com/go.php?do=redirect'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely in most cases, further investigation should be done in the commandline
  of the browser process to determine the context of the URL accessed.
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious browser launches initiated from applications typically used to handle document files, such as Adobe Acrobat or Microsoft Office. This behavior may signal an attempt to trick users into accessing malicious web pages, possibly related to phishing schemes. Attackers often leverage social engineering tactics to compromise users by embedding links into legitimate documents, leading them to exploitative sites disguised as acceptable resources.

  The relevant MITRE ATT&CK tactics that this detection addresses fall primarily under **Execution** (TA0002) with a focussed technique on **User Execution** (T1204.002). This captures attacks that rely on user interaction to run malicious content. The primary data sources for this rule include **process creation events** on Windows systems, which will capture the emergence of browser processes initiated from trusted applications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the file paths and process hierarchy associated with the detected browser launch. Validate that the originating process (e.g., Acrobat Reader or Microsoft Office) matches expected paths and is not an unauthorized or suspicious version.

  - **Analyze Command Line Arguments**: Inspect the command line used for launching the browser. Look for unexpected or uncommon parameters that could indicate malicious intent, especially focusing on URLs included in the command line.

  - **Correlate User Activity**: Consult other telemetry sources like user access logs to determine if the user interacted with the document file legitimately. Check for any unusual login times or access patterns that may correlate with the behavior.

  - **Examine Web Traffic**: If possible, analyze related web traffic for any communications made by the browser to detect and identify potentially harmful URLs. Use web proxy or firewall logs to classify the nature of these connections.

  ### Prioritization
  This alert should be treated with medium priority in an enterprise environment due to the potential for phishing or user compromise, which can lead to data breaches or unauthorized access if successful. The likelihood of an end user being targeted through documents makes this an important detection.

  ### Blind Spots and Assumptions
  The detection logic may not capture all potential phishing attempts, especially in cases where users directly copy and paste URLs into browsers or when malicious software utilizes alternative means to invoke browsers. It assumes that aggressive security configurations, such as extensive logging and monitoring of process creations, are in place. Additionally, the alert relies on the availability of process creation logs from endpoints where these document applications are used. If such logging is not enabled or if users have sufficient rights to override security measures, the detection may fail.

