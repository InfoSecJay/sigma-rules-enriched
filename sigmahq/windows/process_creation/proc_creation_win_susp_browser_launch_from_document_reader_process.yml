title: Potential Suspicious Browser Launch From Document Reader Process
id: 1193d960-2369-499f-a158-7b50a31df682
status: test
description: |
  Detects when a browser process or browser tab is launched from an application that handles document files such as Adobe, Microsoft Office, etc. And connects to a web application over http(s), this could indicate a possible phishing attempt.
references:
- https://app.any.run/tasks/69c5abaa-92ad-45ba-8c53-c11e23e05d04/     # PDF Document
- https://app.any.run/tasks/64043a79-165f-4052-bcba-e6e49f847ec1/     # Office Document
author: Joseph Kamau
date: 2024-05-27
modified: 2025-10-07
tags:
- attack.execution
- attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|contains:
    - 'Acrobat Reader'
    - 'Microsoft Office'
    - 'PDF Reader'
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\maxthon.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    CommandLine|contains: 'http'
  filter_main_microsoft_help:
    CommandLine|contains: 'https://go.microsoft.com/fwlink/'
  filter_optional_foxit:
    CommandLine|contains:
    - 'http://ad.foxitsoftware.com/adlog.php?'
    - 'https://globe-map.foxitservice.com/go.php?do=redirect'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely in most cases, further investigation should be done in the commandline
  of the browser process to determine the context of the URL accessed.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects instances where a web browser is launched from a document reader process, such as Adobe Acrobat or Microsoft Office, and connects to a web application using HTTP or HTTPS. This behavior could indicate a potential phishing attempt, where an attacker leverages document readers to lure users into opening malicious URLs. Relevant MITRE ATT&CK techniques include Execution (T1204.002) and, more specifically, social engineering tactics associated with exploiting document-based applications.

  The primary telemetry sources for this detection are Windows process creation logs, particularly focusing on process relationships where document readers spawn browser processes. The security impact of this behavior is significant, as a successful phishing attempt could lead to credential theft or malware installation. However, this detection alone does NOT confirm malicious intent; it requires additional investigation to understand the context of the browser launch.

  ---

  ### Investigation Steps

  - **Review the process chain:**
    Inspect the parent process of the browser creation by examining Security Event ID 4688 processes. Verify if the parent process matches known legitimate document readers (e.g., Acrobat Reader, Microsoft Office).

  - **Analyze the command line arguments:**
    Check the CommandLine field in Sysmon Event ID 1 for the browser process. Look for suspicious URLs or query strings indicative of phishing, such as URLs resembling known malicious domains.

  - **Investigate expected behavior:**
    Identify normal operations by cross-referencing with legitimate use cases. For instance, a user typically opens a browser independently without document-related applications prompting its launch.

  - **Check network connections:**
    Review network logs for outbound HTTP/HTTPS connections corresponding to the browser's execution time. Use Windows Firewall logs (Event ID 5156) to correlate IP addresses and domains accessed from the suspicious browser session.

  - **Identify high-confidence malicious indicators:**
    Look for URLs in the browser’s command line that contain redirection strings, unusual subdomains, or patterns consistent with known phishing domains, particularly if they redirect to a credential harvesting page.

  - **Validate the context of URL access:**
    Cross-reference any accessed URLs against threat intelligence sources to identify whether they are flagged as malicious. Analyze timing and user behavior leading up to the alert to assess the legitimacy of the access.

  ---

  ### Prioritization

  This alert should be treated with medium priority, as it involves potential exploitation of widely used applications impacting user security. While the likelihood of malicious usage is notable, many benign activities (like legitimate user operations) can also trigger this alert. Continuous user education and monitoring are recommended, as this behavior is often weaponized in phishing campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from users legitimately launching browsers from document applications for benign purposes, which can easily trigger this alert. Comprehensive logging, especially around process creation and networking, is crucial for reliable detection; ensure Sysmon is configured correctly and logging is enabled for command-line arguments. Additionally, an associated detection rule for network-based indicators of compromise (IOC) would strengthen coverage against potential threats stemming from this behavior.

