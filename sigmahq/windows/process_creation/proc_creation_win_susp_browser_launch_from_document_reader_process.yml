title: Potential Suspicious Browser Launch From Document Reader Process
id: 1193d960-2369-499f-a158-7b50a31df682
status: test
description: |
  Detects when a browser process or browser tab is launched from an application that handles document files such as Adobe, Microsoft Office, etc. And connects to a web application over http(s), this could indicate a possible phishing attempt.
references:
- https://app.any.run/tasks/69c5abaa-92ad-45ba-8c53-c11e23e05d04/     # PDF Document
- https://app.any.run/tasks/64043a79-165f-4052-bcba-e6e49f847ec1/     # Office Document
author: Joseph Kamau
date: 2024-05-27
modified: 2025-10-07
tags:
- attack.execution
- attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|contains:
    - 'Acrobat Reader'
    - 'Microsoft Office'
    - 'PDF Reader'
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\maxthon.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    CommandLine|contains: 'http'
  filter_main_microsoft_help:
    CommandLine|contains: 'https://go.microsoft.com/fwlink/'
  filter_optional_foxit:
    CommandLine|contains:
    - 'http://ad.foxitsoftware.com/adlog.php?'
    - 'https://globe-map.foxitservice.com/go.php?do=redirect'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely in most cases, further investigation should be done in the 
  commandline of the browser process to determine the context of the URL 
  accessed.
level: medium
note: |
  ### Technical Context

  This rule detects the spawning of a browser process from document-handling applications, such as Acrobat Reader or Microsoft Office, when a command line includes HTTP(s) URLs. This behavior can indicate a potential phishing attempt, as adversaries may exploit document files to launch malicious web pages. This fits within the MITRE ATT&CK framework under the execution tactic with the technique of **Malicious File Execution (T1204.002)**.

  The primary telemetry sources include Windows process creation logs, specifically **Security Event ID 4688** for process creation events. If malicious, this could lead to credential theft or malware delivery through a deceptive web application. However, this detection does NOT confirm that the user maliciously intended to access a harmful site, and further investigation is required to ascertain intent.

  ### Investigation Steps

  - **Check the process creation details**: Review Security Event ID 4688 for the process creation details. Focus on "ParentImage" field values such as “Acrobat Reader” or “Microsoft Office”. Legitimate processes might include standard document-opening behavior without suspicious URLs.

  - **Examine the command line arguments**: Analyze the **CommandLine** field of the detected browser process for unusual URLs. Look for signs of known phishing link patterns, especially those that include “http” or “https” indicating web access from a document reader.

  - **Validate the legitimacy of the launched URL**: Cross-reference the accessed URLs against threat intelligence databases to detect known malicious domains. Be cautious of known ad domains (e.g., “ad.foxitsoftware.com”) unless the user was intentionally conducting a web search.

  - **Identify the timing and history of document access**: Check for any recent document access events related to this alert using **User Access logs**. If the document was opened just prior to browser launch, it may indicate user-initiated activity rather than an automated attack.

  - **Monitor for repeat occurrences**: If this alert appears multiple times from the same user or system within a short timeframe, escalate for further investigation. Continuous patterns may indicate broader compromise or user training needs.

  ### Prioritization

  The alert is of medium severity in an enterprise context. While the impact of the affected system may vary, the likelihood of malicious abuse is notable due to the potential for credential theft or malware distribution via malicious web pages. Such behavior is often weaponized in phishing attacks, justifying prompt review.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that may trigger this alert, such as automated updates or document-sharing functionalities. Make sure that logging is configured to capture all relevant process creations effectively. Additionally, user behaviors such as opening links from trusted documents (like those from recognized organizations) may falsely trigger the alert. Monitoring for related detections, like HTTP traffic analysis for suspicious user activity, can enhance overall threat coverage.

