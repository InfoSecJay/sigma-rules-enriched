title: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
id: 22154f0e-5132-4a54-aa78-cc62f6def531
related:
- id: d526c60a-e236-4011-b165-831ffa52ab70
  type: similar
status: experimental
description: |
  Detects tampering of the Vulnerable Driver Blocklist registry via command line tools such as PowerShell or REG.EXE.
  The Vulnerable Driver Blocklist is a security feature that helps prevent the loading of known vulnerable drivers.
  Disabling this feature may indicate an attempt to bypass security controls, often targeted by threat actors
  to facilitate the installation of malicious or vulnerable drivers, particularly in scenarios involving Endpoint Detection and Response
references:
- https://www.sophos.com/en-us/blog/sharpening-the-knife-gold-blades-strategic-evolution
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-26
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli_1:
    CommandLine|contains:
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
  selection_cli_2:
    CommandLine|contains|all:
    - '\Control\CI\Config'
    - 'VulnerableDriverBlocklistEnable'
  condition: all of selection_*
falsepositives:
- It is very unlikely for legitimate activities to disable the Vulnerable Driver
  Blocklist via command line tools; thus it is recommended to investigate 
  promptly.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_vulnerable_driver_blocklist_registry_tampering/info.yml
note: |
  ### Technical Context

  This rule detects modifications to the Vulnerable Driver Blocklist registry via command line tools like PowerShell or REG.EXE. The likely attacker objective is to disable a security feature that prevents the use of known vulnerable drivers, facilitating the installation of malicious drivers to compromise the system. This activity aligns with the MITRE ATT&CK technique "Defense Evasion: T1685." Primary telemetry source includes Windows process creation logs, specifically focusing on command line arguments associated with the modification of registry settings. If malicious, the impact could be severe, potentially allowing invasive malware or exploitation of system vulnerabilities. This detection does NOT confirm a successful compromise or guarantee that malicious activity is occurring; it simply indicates an attempt to modify security settings.

  ### Investigation Steps

  - **Check command line usage**: Review Security Event ID 4688 logs for instances where PowerShell (`powershell.exe`, `pwsh.exe`) or REG.EXE was executed with arguments containing 'add', 'New-ItemProperty', or 'Set-ItemProperty' targeting `\Control\CI\Config\VulnerableDriverBlocklistEnable`.

  - **Identify legitimate behavior**: Determine if the command line contains any benign actions such as administrative scripts that may legitimately alter the blocklist; however, note that it is rare for such actions to be conducted through direct command line inputs.

  - **Verify process execution**: Cross-reference Sysmon Event ID 1 logs to confirm the originating user account and parent processes. Look for unusual or unauthorized users executing these commands.

  - **Correlate with EDR telemetry**: Check Endpoint Detection and Response (EDR) logs for alerts correlating to modifications of driver settings post-command execution. This may reveal any subsequent actions taken by potential malware.

  - **Analyze registry changes**: Examine registry hive activity (using command lines like `reg query` or `reg edit`) that corresponds to the change in the blocklist; expected benign registry alterations should not affect the `VulnerableDriverBlocklistEnable` key.

  - **Confirm system roles and security posture**: Evaluate if the affected system is a critical asset (e.g., endpoint with sensitive data). Summarize any existing mitigations or restrictions that could have prevented legitimate administrator actions from bypassing the blocklist.

  ### Prioritization

  This alert is high priority due to the critical nature of the Vulnerable Driver Blocklist, which plays a significant role in system security. The likelihood of malicious abuse is substantial, particularly in environments where adversaries may attempt to evade security protocols to deploy malware. Such behaviors are often weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations in some environments; without EDR or Sysmon, indicators of compromise could be missed. Legitimate administrative actions, such as those performed during routine patch management or system updates, could trigger this alert. A related detection rule for monitoring changes to the registry outside of just the Vulnerable Driver Blocklist would strengthen overall assessment capabilities.

