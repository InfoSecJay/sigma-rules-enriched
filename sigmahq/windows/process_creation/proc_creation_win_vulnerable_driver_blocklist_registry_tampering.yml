note: |
  ### Technical Context

  This rule detects instances where command line tools such as PowerShell or REG.EXE are used to tamper with the Vulnerable Driver Blocklist registry key. The primary attacker objective is to disable or manipulate this security feature to allow the loading of known vulnerable or malicious drivers, evading security controls. This behavior aligns with the MITRE ATT&CK tactic “Defense Evasion” (ID: T1562.001). The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, this action can lead to a heightened risk of exploitation through vulnerable drivers, compromising system integrity. Importantly, this detection does not confirm that an exploit has occurred, only that an attempt to modify the registry has been made.

  ### Investigation Steps

  - **Review command line execution details**: Check Security Event ID 4688 and Sysmon Event ID 1 for any command lines containing 'add ', 'New-ItemProperty ', or 'Set-ItemProperty' targeting the VulnerableDriverBlocklist registry key.

  - **Identify suspicious parent processes**: Track the process creation events to determine the parent process. Legitimate instances may originate from administrative tools, while malicious instances typically originate from unusual or unexpected sources.

  - **Correlate with typical administrative behavior**: Confirm whether administrative users commonly perform registry changes. Legitimate behavior typically involves tools such as the Group Policy Editor or System Policy management.

  - **Check for direct registry modification artifacts**: Use Event Viewer to look for corresponding registry update logs under the Application or System logs to ensure the actions were executed as reported and verify timestamps.

  - **Validate the integrity of affected systems**: Check for known vulnerable drivers loaded in the kernel using tools such as Driver Verifier or by examining loaded drivers with Sysinternals’ Process Explorer to identify any potential exploitation via vulnerable drivers.

  - **Assess asset criticality**: Take into account the criticality of affected assets. Systems handling sensitive data or business-critical operations should be prioritized in the investigation, as the impact of a bypass could lead to severe consequences.

  ### Prioritization

  This alert is of high priority due to the potential risk of being exploited through vulnerable drivers if the blocklist is tampered with. The likelihood of malicious abuse is realistic, particularly as this behavior is commonly seen in advanced threat tactics attempting to circumvent security measures.

  ### Blind Spots and Assumptions

  Detection may be limited if not all command line executions are logged, or if users have legitimate administrative access to modify the registry. The threat of potential false positives exists, particularly in cases of legitimate scripting or management efforts. A related detection to consider is tracking direct interactions with the registry through Event ID 4657 (Registry value modified), which could verify if the blocklist was indeed altered in addition to command line usage.

