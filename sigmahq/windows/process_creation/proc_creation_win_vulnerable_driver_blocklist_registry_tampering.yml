note: |
  ### Technical Context
  This rule detects attempts to tamper with the Vulnerable Driver Blocklist registry settings via command-line tools such as PowerShell and REG.EXE. The Vulnerable Driver Blocklist is a security feature designed to prevent the loading of known vulnerable drivers, thereby safeguarding systems against potential exploitation. When an attacker alters this registry setting, it may indicate an objective to bypass security controls, enabling the installation of malicious or compromised drivers that could further facilitate persistent threats.

  The potential threat actors behind such activities may include skilled cybercriminals or adversaries seeking to undermine endpoint protection mechanisms. By disabling the Vulnerable Driver Blocklist, they can install drivers that may allow them to execute further stages of an attack, such as maintaining persistence, exfiltrating data, or escalating privileges within a target environment.

  This detection aligns primarily with the MITRE ATT&CK tactics of **Defense Evasion (T1562)**, particularly the technique **T1562.001: Indicator Removal on Host**. The primary data source for this detection is **process creation events** on Windows systems, enabling the identification of suspicious command-line activity associated with registry modifications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent process creation logs, particularly focusing on any instances of PowerShell, PWsh, or REG.EXE being executed. Pay special attention to command-line arguments that modify registry settings related to the Vulnerable Driver Blocklist.

  - **Analyze Registry Changes**: Confirm any modifications to the registry key located at `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Kernel-Process\VulnerableDriverBlocklistEnable`. This will provide insights into unauthorized changes made during the event.

  - **Cross-reference User Activity**: Check user accounts that executed commands leading to registry tampering for any unusual login patterns, such as logins from non-standard locations or times, which might indicate compromised credentials.

  - **Monitor Endpoint EDR Alerts**: Utilize Endpoint Detection and Response (EDR) capabilities to identify associated alerts or behaviors that could indicate exploitation attempts following the registry changes in question.

  ### Prioritization
  This alert is classified as high severity due to the critical security implications of altering driver blocklist settings. Such actions directly threaten the integrity of endpoint security, increasing the likelihood of successful exploitation by threat actors.

  ### Blind Spots and Assumptions
  Detection may miss instances where the registry is altered via non-process creation methods or where different command-line tools are employed, such as batch scripts or third-party applications. The detection logic assumes that tampering occurs through legitimate command-line interfaces; however, attackers may also utilize other methods to affect registry settings silently. Proper logging configurations for process creation and active monitoring of registry changes are essential for this alert to function effectively, as are sufficient permissions on event data for analysis.

