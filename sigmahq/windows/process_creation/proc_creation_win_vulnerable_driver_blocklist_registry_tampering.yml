logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli_1:
    CommandLine|contains:
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
  selection_cli_2:
    CommandLine|contains|all:
    - '\Control\CI\Config'
    - 'VulnerableDriverBlocklistEnable'
  condition: all of selection_*
falsepositives:
- It is very unlikely for legitimate activities to disable the Vulnerable Driver Blocklist
  via command line tools; thus it is recommended to investigate promptly.
level: high
regression_tests_path: 
