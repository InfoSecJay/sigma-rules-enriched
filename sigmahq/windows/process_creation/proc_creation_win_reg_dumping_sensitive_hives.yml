note: |
  ### Technical Context
  This detection rule is designed to identify the usage of the `reg.exe` command-line utility for dumping sensitive registry hives, specifically the Security Account Manager (SAM), SYSTEM, and SECURITY hives on Windows systems. Such actions are indicative of a credential theft attempt, as these registry hives store crucial authentication credentials used in a Windows environment. Attackers may use tools like `reg.exe` to collect these sensitive pieces of information to facilitate lateral movement or gain higher privileges within a network.

  The likely attacker objective is to access and exfiltrate stored credentials from the Registry, which can lead to unauthorized access to systems and sensitive data. This activity aligns with multiple MITRE ATT&CK techniques, particularly T1003.002 (Credential Dumping: Security Account Manager (SAM)), T1003.004 (Credential Dumping: Windows Vault), and T1003.005 (Credential Dumping: LSA Secrets). These techniques highlight the methods attackers employ to extract sensitive credentials from compromised environments.

  The primary data sources for detecting this activity will be process creation events, which include logs from the Windows Event Log (Event ID 4688). Monitoring command-line arguments associated with `reg.exe` is crucial for identifying potential attacks, as they can reveal specific attempts to access and dump the sensitive hives mentioned.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows Event logs (Event ID 4688) for instances of `reg.exe` being executed, paying close attention to the command-line arguments utilized. Filter for entries containing keywords like "save" or "export" related to registry hives.

  - **Analyze Command-Line Arguments**: Focus on the command-line arguments associated with `reg.exe` to identify any suspicious patterns or attempts to access sensitive hives (e.g., `\system`, `\sam`, `\security`). Investigate any obfuscation or atypical flags used to execute `reg.exe`.

  - **Cross-Reference Scheduled Tasks and Scripts**: Investigate any scheduled tasks or scripts that may invoke `reg.exe`. This can help ascertain if the execution is part of legitimate administrative tasks or indicative of malicious behavior.

  - **Monitor for Anomalous User Behavior**: Assess the user accounts executing the command. Flag any unusual accounts or events, particularly those that do not typically require access to sensitive registry hives, for further investigation.

  ### Prioritization
  This alert is categorized with a high severity due to the significant impact of credential dumping on organizational security. The likelihood of impact is elevated in environments where sensitive data and administrative privileges are improperly accessed through compromised credentials.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if process creation logs are not being collected or if they are improperly configured. The detection logic assumes that the execution of `reg.exe` with specific command-line arguments is indicative of malicious behavior, not accounting for legitimate uses such as backups or forensic investigations. To ensure the effectiveness of this alert, it is crucial to have comprehensive logging enabled for process creation events and to establish baseline user behavior for proper anomaly detection.

