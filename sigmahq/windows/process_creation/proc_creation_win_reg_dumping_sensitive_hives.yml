note: |
  ### Technical Context

  This Sigma rule detects the execution of `reg.exe` with command-line arguments suggesting the dumping of sensitive registry hives such as the Security Account Manager (SAM), SYSTEM, and SECURITY hives. The likely objective of an attacker using this technique is to extract sensitive information, including potential credentials, which can be leveraged for further access or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Credential Access, specifically Techniques T1003.002 (Credential Dumping: NTDS.dit) and T1003.004 (Credential Dumping: LSA Secrets).

  The primary telemetry source is Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which log details about processes being executed. Malicious activity, if confirmed, can lead to significant security impacts like credential theft, allowing attackers to escalate privileges or move laterally within the enterprise. However, this detection alone does not confirm malicious intent; legitimate activities such as system backup or forensic investigations may generate similar command-line usage.

  ### Investigation Steps

  - **Review process creation logs:** Verify entries with **Security Event ID 4688** or **Sysmon Event ID 1.** Look for instances where `reg.exe` is used with command-line arguments indicative of hive dumping, e.g., containing `save`, `export`, or targeting `HKLM\SAM`, `HKLM\SYSTEM`, or `HKLM\SECURITY`. Legitimate activity might include non-sensitive registry queries or different tool usage.

  - **Check the command line arguments:** Analyze the associated **CommandLine** field for variations of `save` or `export` alongside targeted hives. Confirm if there are suspicious patterns such as obfuscated characters that may indicate an attempted evasion technique.

  - **Identify recent user activity:** Query **Windows Event Log Security** (Event ID 4624) to review the user account associated with the process creation event. Trustworthy accounts performing this action could indicate legitimate maintenance activity, whereas unknown or suspicious accounts suggest a potential compromise.

  - **Correlate with lateral movement activities:** Look for additional logs detailing any subsequent actions by the user or system account post-registry dump detection. Use tools that collate this information, focusing on any unusual authentication attempts or process creations (Event ID 4688) in adjacent systems.

  - **Evaluate log collection methods:** Ensure **Windows Event Forwarding** or appropriate logging is configured to capture registry access events comprehensively. Monitor for evidence of file creation or transfer activities that may indicate exfiltration of the dumped information.

  - **Assess asset criticality:** Consider the role of the affected system. If it's a domain controller or manages sensitive data, the impact of credential theft is significantly higher, warranting expedited review and escalation.

  ### Prioritization

  This alert's severity is high due to the critical nature of the systems involved (e.g., domain controllers) and the probability that attackers will utilize credential dumping techniques to escalate privileges. The behavior detected is commonly exploited by adversaries for credential access, leading to potentially severe security breaches.

  ### Blind Spots and Assumptions

  This detection may not capture all malicious attempts due to potential evasion techniques like command-line obfuscation. It relies on proper logging configurations; if event logging is not enabled for process creation or registry access, detection could be incomplete. Legitimate activities such as routine backups by trusted users may inadvertently trigger this alert. A companion detection to enhance coverage could include monitoring unusual access patterns or modifications to sensitive registry keys via other means, such as PowerShell or WMI.

