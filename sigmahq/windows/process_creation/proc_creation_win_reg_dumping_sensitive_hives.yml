note: |
  ### Technical Context

  This Sigma rule detects the invocation of `reg.exe` with commands indicating the dumping of sensitive Windows registry hives, specifically the SAM, SYSTEM, and SECURITY hives. The behavior is typically associated with attacker objectives such as credential harvesting or lateral movement within a network, as these registry hives contain critical authentication information. The relevant MITRE ATT&CK tactics include Credential Access (T1003) and specifically T1003.002 for credential dumping from the SAM hive.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation events, and Sysmon Event ID 1 when integrated. If malicious, the compromise of these credentials can lead to unauthorized access to systems and data. However, this detection alone does not confirm malicious intent, as legitimate tasks—such as system maintenance or forensic activities—can also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs for reg.exe:**
    Look for Security Event ID 4688 or Sysmon Event ID 1 detailing the execution of `reg.exe`. Ensure the command line contains keywords indicative of hive dumping (e.g., 'save', 'export').

  - **Identify the command line specifics:**
    Review the CommandLine field for sensitive hive locations such as `\sam`, `\system`, or `\security` within the context of reg.exe execution. Malicious indicators include these paths combined with dump flags.

  - **Validate user context and asset criticality:**
    Determine the user who executed the command and the asset’s role. Executions on domain controllers or critical servers warrant higher scrutiny, especially if performed by non-administrative accounts.

  - **Assess for legitimate operational activity:**
    Cross-reference alerts with maintenance windows or scheduled tasks where registry hives are legitimately exported for backup purposes. This expected behavior should be documented and approved.

  - **Monitor for known obfuscation patterns:**
    Investigate any oddities in the CommandLine field that might employ character substitution (e.g., replacing 'a' with 'ˢ'). This could indicate an attempt to evade detection mechanisms.

  - **Correlate with other credential access detections:**
    Look for concurrent alerts signaling other credential dumping activities or suspicious behavior (e.g., process tree from `mimikatz` or `powershell` executions tied to known attack patterns).

  ### Prioritization

  This alert is considered high severity due to the critical nature of the affected systems and the potential for significant harm through exposed credentials. The likelihood of malicious abuse is high, especially considering the commonality of these techniques in modern cyber-attacks targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where logs are not properly collected or retained, especially in environments lacking Sysmon or where logging levels are insufficient. Legitimate administrative tasks or backup operations can trigger this alert, complicating initial triage. Related detections involving direct access to SAM or SYSTEM files (via file system activity) can bolster coverage and provide additional context.

