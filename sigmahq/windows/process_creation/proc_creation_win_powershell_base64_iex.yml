note: |
  ---

  ### Technical Context

  This rule detects the use of the PowerShell "IEX" (Invoke-Expression) cmdlet with Base64-encoded input in process command lines, which is often utilized by malicious actors to obfuscate and execute code. The likely objective of the adversary is to run scripts or commands without revealing pure command text, facilitating activities like payload delivery or exploitation. This behavior is aligned with the MITRE ATT&CK tactics for Execution (T1203) and Command and Scripting Interpreter (T1059.001).

  The primary telemetry sources are Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the command new processes are launched with, including command line arguments. If malicious, this can allow an attacker to execute arbitrary code with elevated privileges, escalate access, or deploy malware. However, this detection does NOT confirm that the executed commands are malicious on their own; further investigation is required to establish intent.

  ---

  ### Investigation Steps

  - **Examine Command Line Arguments:** Review the command line of the process associated with Event ID 4688 or Sysmon Event ID 1 to identify the exact Base64 strings decoded by the IEX cmdlet. Look for any indicators of malicious activity such as unusual script names or domains.

  - **Verify Base64 Decoding:** Decode any detected Base64-encoded strings to reveal the underlying commands or scripts that were executed. Use tools like PowerShell's `Convert.FromBase64String()` for validation.

  - **Identify Process Parentage:** Check the parent process of the detected process through Sysmon logs (Event ID 1). Malicious processes often have unusual or known malicious parent processes (e.g., cmd.exe or powershell.exe invoked from untrusted applications).

  - **Capture Network Activity:** If the decoded command attempts to reach external addresses, cross-reference with network logs (e.g., firewall or proxy logs) for unusual connections during the timestamp of detection. Look for patterns such as connection attempts to known malicious domains.

  - **Look at Execution Context:** Determine the user account and group policy that executed the command. Legitimate administrative or system processes should be monitored, as misuse of these accounts can be an indicator of compromise.

  - **Review Similar Activity:** Investigate for prior occurrences of similar behavior within the last few days, looking for recurring patterns or clusters of alerts that suggest a larger compromise or malware deployment.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on compromised systems and possible escalation of privileges. The likelihood of malicious abuse is significant, as IEX combined with Base64 encoding is commonly weaponized in cyber attacks for code execution. Systems that execute PowerShell scripts frequently, particularly those with administrative privileges, should be prioritized for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection of encoded IEX commands may be bypassed using alternative encoding techniques or PowerShell obfuscation strategies, limiting the rule's effectiveness. Required log sources must include Process Creation events, and relevant group policies should not restrict logging for these events to ensure coverage. Legitimate activity triggering the alert could include system maintenance scripts or administrative tasks involving PowerShell. Companion detections that might strengthen coverage include monitoring for unusual PowerShell usage (e.g., execution policy changes or common attack commands).

