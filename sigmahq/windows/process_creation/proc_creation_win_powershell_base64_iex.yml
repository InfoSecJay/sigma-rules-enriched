note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize base64 encoding as part of the "IEX" (Invoke-Expression) cmdlet. This behavior is typically leveraged by attackers to obfuscate malicious payloads and execute them directly within the PowerShell environment. The primary objective of such tactics is to execute arbitrary code stealthily, potentially facilitating lateral movement, command and control, or data exfiltration.

  This detection corresponds to the MITRE ATT&CK technique T1059.001 - "Command and Scripting Interpreter: Windows PowerShell." The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688, which tracks command line arguments for executed processes. If detected, the potential security impact is significant, as it indicates possible execution of malicious code. Importantly, this detection does NOT confirm that the code executed is inherently malicious but signals potentially harmful obfuscation efforts.

  ### Investigation Steps

  - **Review process execution details:**
    Check Security Event ID 4688 logs for the parent process of the PowerShell execution. Look for suspicious parent processes such as `cmd.exe` or `powershell.exe` itself that might indicate automation tools like scripts or malicious executables.

  - **Analyze command line arguments:**
    Examine the CommandLine field in Event ID 4688 for variations of "IEX" or its base64 encoded formats. Look for obfuscation, especially with indications of payloads or suspicious URLs. Malicious indicators include unknown encoded strings or unusual patterns.

  - **Correlate with established baselines:**
    Compare the command line usage against established baselines of legitimate PowerShell usage within your environment. Common legitimate patterns include system administration tasks, automated scripts, or application installations, which will usually have clear and straightforward command lines.

  - **Investigate surrounding activity:**
    Look for other correlated logs, such as Events ID 4104 (Transcription logs) or Event ID 7030 (Service Control Manager logs) from the same time frame. Assess for additional commands executed that may indicate script behavior or batch routines.

  - **Check file system activity:**
    Review file creation and modification timestamps for new or modified files at paths related to the PowerShell execution. Pay attention to output or executable file drops, especially in directories commonly targeted by malware.

  ### Prioritization

  This alert has high severity due to the potential execution of obfuscated and malicious code, which could compromise the affected system. The likelihood of malicious abuse is significant as these tactics are widely weaponized in various attack scenarios, revealing a direct threat to organizational assets.

  ### Blind Spots and Assumptions

  Detection limitations include adversarial use of legitimate PowerShell commands, which can make it difficult to distinguish benign from malicious usage. Accurate detection requires complete logging configuration for process creation, and any gaps in logging could lead to missed detections. Legitimate activities that may trigger this alert include administrative tasks performed by system administrators using script automation tools. A companion detection that strengthens coverage is monitoring for unusual PowerShell modules or script execution contexts, which can indicate suspicious usage patterns.

