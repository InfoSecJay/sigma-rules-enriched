title: PowerShell Base64 Encoded IEX Cmdlet
id: 88f680b8-070e-402c-ae11-d2914f2257f1
status: test
description: Detects usage of a base64 encoded "IEX" cmdlet in a process command line
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2019-08-23
modified: 2023-04-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|base64offset|contains:
    - 'IEX (['
    - 'iex (['
    - 'iex (New'
    - 'IEX (New'
    - 'IEX(['
    - 'iex(['
    - 'iex(New'
    - 'IEX(New'
    - "IEX(('"
    - "iex(('"
        # UTF16 LE
  - CommandLine|contains:
    - 'SQBFAFgAIAAoAFsA'
    - 'kARQBYACAAKABbA'
    - 'JAEUAWAAgACgAWw'
    - 'aQBlAHgAIAAoAFsA'
    - 'kAZQB4ACAAKABbA'
    - 'pAGUAeAAgACgAWw'
    - 'aQBlAHgAIAAoAE4AZQB3A'
    - 'kAZQB4ACAAKABOAGUAdw'
    - 'pAGUAeAAgACgATgBlAHcA'
    - 'SQBFAFgAIAAoAE4AZQB3A'
    - 'kARQBYACAAKABOAGUAdw'
    - 'JAEUAWAAgACgATgBlAHcA'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of PowerShell commands that utilize "IEX" (Invoke-Expression) with base64 encoding in their command line arguments. The use of base64 encoding for PowerShell commands is commonly associated with obfuscation tactics employed by attackers to circumvent detection mechanisms. Malicious actors may leverage this technique to execute scripts or payloads without revealing their true content directly, potentially leading to further exploitation of the target environment.

  The scenario behind this detection is that an attacker may use encoded scripts to execute malicious actions such as downloading additional payloads, establishing persistent access, or executing commands that compromise system integrity. The objective is typically to gain unauthorized access to sensitive data, maintain control over the compromised systems, or escalate privileges. The relevant MITRE ATT&CK tactics and techniques that apply include Execution (TA0002) and specifically the use of PowerShell (T1059.001).

  Primary data sources that will provide the best evidence for this detection include Windows process creation logs, specifically focusing on command line arguments that capture the execution details of PowerShell processes.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the Windows event logs for any recent process creation events that use PowerShell with "IEX" and base64 encoded commands. Pay close attention to the command line parameters for malicious patterns.

  - **Analyze Base64 Commands:** Decode the base64 encoded portions of the command line from the detected events to assess the original commands being executed. This could reveal malicious behavior that is obfuscated.

  - **Correlate with User Activity:** Investigate the context of the user that executed the command, including their role, previous activity, and if they have a history of such executions. Identify if the execution fits normal operational behavior.

  - **Check for Related Network Activity:** Look for any subsequent network connections, particularly to known malicious IPs or domains, that may have resulted from the executed commands. Correlate these with the timing to establish a connection between the activity and possible exfiltration or command-and-control communication.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant impact on enterprise security. The use of obfuscated PowerShell commands can indicate an advanced threat actor attempting to escalate privileges or perform malicious actions, warranting immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the inability to see PowerShell execution that does not utilize base64 encoding or does not include the "IEX" cmdlet. Additionally, the detection may not account for legitimate administrative activities that involve obfuscation. The assumptions made by the detection logic include that PowerShell scripts are typically not authorized to run in a standard user context, and thus any execution outside of expected behavior is suspicious. Required logs include detailed process creation logs that capture full command line data to ensure effective detection functionality.

