note: |
  ### Technical Context
  This rule detects attempts by attackers to bypass User Account Control (UAC) on Windows systems by hijacking the Microsoft Management Console (MMC) through the Windows Firewall snap-in (`WF.msc`). UAC is a critical security feature designed to prevent unauthorized changes, and bypassing it can allow attackers to achieve higher system privileges unnoticed. This method typically involves executing `WerFault.exe` as a child process of `mmc.exe`, potentially allowing the attacker to perform privileged actions without the user's consent.

  The likely attacker objectives include gaining unauthorized access to sensitive system functionalities or resources, facilitating further attacks, or deploying additional malicious payloads. The detection logic leverages the association between the parent process (`mmc.exe`) and the command line containing the Firewall snap-in, indicating a possible exploitation of the MMC to evade detection while performing malicious actions.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Defense Evasion**: T1563 - Exploitation of UAC Bypass methods, such as application hijacking or DLL injection.
  - **Privilege Escalation**: T1548 - Abuse Elevation Control Mechanism.

  Primary data sources for effective detection include process creation events that capture details such as the command line and parent process information.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review logs associated with process creation events, focusing on the `mmc.exe` parent process and its command line arguments for any instances of `WF.msc`.
  - **Analyze Command Line Arguments**: Check for suspicious modifications or unexpected arguments in the command line that could indicate an attempt to hijack the Windows Firewall functionality.
  - **Inspect Related Child Processes**: Look for any invocation of `WerFault.exe` as a child process of `mmc.exe`, especially if it appears under unusual circumstances or out of expected operational patterns.
  - **Evaluate Privilege Escalation Attempts**: Conduct a review of user privileges and any recent changes to UAC settings to identify unauthorized elevation attempts that align with the detected behavior.

  ### Prioritization
  This alert has a medium severity level due to its potential to indicate significant attempts at privilege escalation and evasion of security controls. The impact of successful exploitation could lead to unauthorized access and control over targeted systems, making it essential to investigate further.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the relevant logs for `mmc.exe` or `WerFault.exe` process creation are not being collected or if they are being altered by the attacker. The detection logic assumes that the logging for process creation is enabled, and that no legitimate administrative activities will invoke similar patterns that could lead to false positives. A proper configuration of Windows logging is necessary to ensure this detection functions effectively.

