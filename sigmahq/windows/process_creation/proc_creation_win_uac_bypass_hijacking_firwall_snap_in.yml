  ---

  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) through the exploitation of the Microsoft Management Console (MMC) Windows Firewall snap-in (WF.msc). An attacker may aim to escalate privileges without proper authorization, potentially gaining SYSTEM-level access. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1548) and Privilege Escalation.

  The primary telemetry source for this detection is process creation logs on Windows systems, specifically looking for execution contexts involving `mmc.exe` and `WerFault.exe`. If malicious, this indicates a significant security risk, as it may allow unauthorized actions to be performed at a higher privilege level. This detection alone does not confirm malicious activity, as benign administrative tasks could trigger similar conditions.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs**: Review process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for instances where `ParentImage` is `mmc.exe` and `ParentCommandLine` contains `WF.msc`. Note legitimate administrative tasks may also exhibit this behavior.

  - **Identify Suspicious Executables**: Investigate logs where `Image` ends with `WerFault.exe`. Compare execution context to determine if the invocation appears atypical (e.g., unexpected execution by non-administrative users).

  - **Validate User Privileges**: Confirm the user account initiating the process has the necessary permissions. Unauthorized users triggering this execution may indicate illegitimate access attempts.

  - **Monitor for Evasion Techniques**: Be aware that attackers may bypass detection by using obfuscation or renaming techniques. Look for variants of `mmc.exe` or related executables that may not yet be detected.

  - **Assess System Impact**: Analyze the host's role and criticality within the environment. Any occurrence in sensitive systems (e.g., domain controllers or critical infrastructure) should be prioritized.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for privilege escalation on affected systems, primarily if initiated from sensitive areas. The method employed here is a known technique for bypassing UAC and can be exploited by attackers, warranting closer inspection.

  ---

  ### Blind Spots and Assumptions

  Detection may miss sophisticated evasion techniques such as renaming or using alternative executables not captured by the current detection parameters. Ensuring that process creation logs are configured properly on all endpoints is crucial for reliable detection. Concurrent administrative tasks may trigger this alert, necessitating careful validation of context, and complementing this detection with behavioral monitoring of privilege escalation actions would enhance coverage.

