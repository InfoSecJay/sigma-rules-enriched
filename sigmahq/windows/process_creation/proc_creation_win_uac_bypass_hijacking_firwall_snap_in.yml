logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\mmc.exe'
    ParentCommandLine|contains: 'WF.msc'
  filter:
    Image|endswith: '\WerFault.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects an attempt to bypass User Account Control (UAC) by taking advantage of the Microsoft Management Console (MMC) Windows Firewall snap-in (`WF.msc`). The objective of the attacker is likely to escalate privileges or gain unauthorized control of the system while avoiding detection by exploiting a trusted application (MMC). This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (T1562) and the technique of Impair Defenses (T1548).

  Primary telemetry sources include process creation events, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could lead to privilege escalation, allowing unauthorized access and control over sensitive resources. However, this detection does not confirm that the activity was malicious; it may also be triggered by benign administrative actions.

  ### Investigation Steps

  - **Check recent process creation events:** Review Windows Security Event ID 4688 logs to identify the process creation chain leading to the `WerFault.exe` instance, focusing on indicators such as user account permissions and if the command line contains `WF.msc`.

  - **Analyze parent process relationships:** Use Sysmon Event ID 1 to visualize the parent-child process relationships. Verify if `mmc.exe` is indeed the parent process and analyze the command line arguments for any suspicious parameters.

  - **Identify legitimate administrative usage:** Confirm that expected administrative actions using the Windows Firewall MMC snap-in are correlating with any flagged activity. For example, scheduled maintenance tasks or software updates may invoke legitimate usage of `WF.msc`.

  - **Correlate with additional security alerts:** Cross-reference other security alerts or logs from endpoint detection solutions that may provide context about elevated privileges or unexpected process executions around the same time.

  - **Review user account context:** Identify the user account responsible for the action. Assess the normal usage patterns for this account, noting any deviations at the time of the alert that may indicate malicious intent.

  - **Investigate abnormal network activity:** Look for outgoing connections or internal network changes following the `WerFault.exe` creation. Pay attention to unusual protocol usage or destination IPs that could indicate further exploitation.

  ### Prioritization

  This alert should be treated with medium priority given the potential for privilege escalation and the likelihood that this technique is a vector for malicious actors. Although UAC bypass methods can be automated and used frequently in attacks, the impact on the affected system will depend on its criticality and the presence of other security controls.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging for processes that spawn from `mmc.exe`, as some configurations may not log lower-level events adequately. Legitimate administrative tasks may inadvertently trigger this detection, particularly during maintenance or configuration changes. A related detection that strengthens coverage could involve monitoring for unusual command line arguments passed to `mmc.exe` or any elevated command shell instances launched during the same timeframe.

