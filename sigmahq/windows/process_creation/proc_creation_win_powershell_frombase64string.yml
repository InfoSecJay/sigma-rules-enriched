note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that utilize the `FromBase64String` function, commonly employed by attackers to decode and execute obfuscated scripts or binary payloads. The likely objective is to execute malicious code while evading detection by encoding it into Base64. This behavior can be associated with MITRE ATT&CK tactics such as **Execution** (T1203) and **Defense Evasion** (T1027).

  The primary telemetry sources include Windows process creation logs, specifically looking for Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments. If malicious, this behavior could lead to further exploitation, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that an attacker is present or that the decoded content is inherently malicious without further context.

  ### Investigation Steps

  - **Capture command line activity**: Review Windows Security Event ID 4688 and Sysmon Event ID 1 for processes running PowerShell commands, specifically filtering for parameters containing `::FromBase64String(`.

  - **Identify decoded content**: If available, decode the Base64 string used in the command. Evaluate its intent by searching for known malicious payload patterns or commands.

  - **Evaluate process context**: Check the parent process of the detected PowerShell instance to understand the origination context. Legitimate administrative tools may invoke PowerShell, whereas unexpected parent processes (e.g., `cmd.exe`, `explorer.exe`) indicate potential malicious intent.

  - **Validate against known benign usage**: Review recent administrative or automation scripts that might use Base64 encoding legitimately. Document known task automation or script repositories utilized within the organization.

  - **Assess for lateral movement indicators**: Search for concurrent suspicious activities or lateral movement attempts (e.g., abnormal network traffic from the affected host) during the timeframe of the alert that relate to this PowerShell execution.

  - **Check for command history**: Investigate PowerShell command history logs to determine if similar patterns or additional obfuscated scripts have been executed recently that correlate with the alert instance.

  ### Prioritization

  This alert is of high severity due to its potential impact on the affected system, particularly if it leads to malicious code execution. The likelihood of abuse is significant, as Base64 encoding is a common evasion technique among threat actors. Additionally, the use of PowerShell in this manner is frequently weaponized in various attacks.

  ### Blind Spots and Assumptions

  The detection is limited by the absence of context around the use of Base64; legitimate administrative scripts may trigger this alert, creating false positives. It requires proper logging configuration (such as Sysmon) to capture the relevant process creation events. Additionally, monitoring user activities may help establish baselines, highlighting suspicious deviations. Companion detections could include monitoring for network connections initiated by PowerShell, forming a multi-layered detection approach.

