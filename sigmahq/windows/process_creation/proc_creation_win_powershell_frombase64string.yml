logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '::FromBase64String('
  condition: selection
falsepositives:
- Administrative script libraries
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the `FromBase64String` function in PowerShell command lines, which is often employed by malicious actors to decode Base64-encoded strings. Attackers frequently utilize this technique to obfuscate their command and control (C2) communications or payload delivery methods, making their activities less detectable. By compromising systems, these actors may aim to deploy malware, exfiltrate data, or pursue lateral movement within the network.

  Relevant MITRE ATT&CK techniques associated with this detection include **T1027: Obfuscated Files or Information**, **T1059.001: Command and Scripting Interpreter: Windows PowerShell**, and **T1140: Deobfuscate/Decode Files or Information**. The primary data source to derive evidence for this activity is the **process creation events** on Windows systems, which log command line arguments associated with initiated processes.

  ### Investigation Steps
  - **Analyze Command Line Arguments**: Review the command lines of all instances where `::FromBase64String(` is used. Look for any unusual arguments or subsequent commands that may indicate malicious intent.

  - **Correlate with Execution Context**: Check the parent process of the PowerShell command execution. Investigate if any known benign processes initiated the command or if it resulted from a potentially malicious program.

  - **Review Related Process Creation Events**: Examine other process creation logs around the same time for suspicious executions or patterns that could suggest an attack sequence, such as the spawning of unexpected child processes.

  - **Check for Known IOCs**: Cross-reference the detected command with threat intelligence feeds to determine if it corresponds to any known malicious campaigns or indicators of compromise.

  ### Prioritization
  The alert is classified as high severity due to the potential for this obfuscation technique to indicate ongoing malicious activities, such as payload delivery or remote command execution. The likelihood of successful exploitation using such tactics in a corporate environment is significant, especially in contexts where PowerShell is heavily utilized.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may arise from benign administrative scripts that also utilize the `FromBase64String` function, which could lead to false positives. The detection logic assumes that any instance of this command in PowerShell is suspicious, which may not always be the case. It is also dependent on having adequate logging settings enabled to capture detailed command line execution, particularly for PowerShell on Windows systems. Without proper log collection from the process creation events, the alert may not function effectively.

