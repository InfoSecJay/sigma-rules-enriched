  ---

  ### Technical Context

  This rule detects the execution of PowerShell commands that use the `FromBase64String` function, which decodes Base64-encoded strings often employed in malware to obfuscate payloads. The likely attacker objective is to execute malicious code while evading detection by disguising the command as benign through encoding. This detection falls under the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1027). The primary telemetry source is Windows process creation logs, particularly focusing on command line strings captured in Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to the execution of destructive payloads on target systems. Importantly, this detection alone does NOT confirm malicious intent; it could also capture legitimate administrative activities.

  ---

  ### Investigation Steps

  - **Examine the command line:** Look for `CommandLine` entries in Security Event ID 4688 or Sysmon Event ID 1 that contain `::FromBase64String(`. Analyze the entire command for context and potential malicious payloads.

  - **Identify the parent process:** Check the `ParentProcessId` in the event logs to trace back to the originating process. Look for common administrative processes like `powershell.exe` or `CMD.exe` to ascertain if it aligns with legitimate administrative tasks.

  - **Evaluate the decoded output:** If possible, manually decode the Base64 string to analyze the resulting command. Determine if the decoded content shows known malicious patterns or commands that could indicate compromise.

  - **Correlate with network activity:** Review recent outbound network connections from the affected host (e.g., connections logged by the firewall or proxy). Look for suspicious activity correlating with the time of the alert, particularly connections to known malicious IPs or domains.

  - **Review firewall logs:** Access logs for any recent changes or additions in firewall rules that could correlate with the execution of PowerShell commands. Analyze Firewall Event ID 2004 for unusual outbound rules that match the timeframe of the alert.

  - **Document expected powershell usage:** Note expected benign usage patterns for Powershell within the organization, including typical command structures and Base64 usage for legitimate administrative scripts to help distinguish false positives.

  ---

  ### Prioritization

  This alert is high priority due to the potential impact on critical systems from executable payloads hidden within Base64 encoded commands. The likelihood of such techniques being weaponized is high as threat actors frequently use obfuscation to bypass detection mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of evasion techniques, including encrypted command lines or legitimate scripts using similar obfuscation. Ensuring comprehensive logging of process creation events is critical; misconfigurations might lead to missed detections. Additionally, legitimate administrative operations, such as IT automation scripts, may trigger similar alerts. A related detection to consider is monitoring for unusually high instances of PowerShell command usage within a short timeframe (T1059.001), as it can strengthen coverage against potential abuses in script execution.

