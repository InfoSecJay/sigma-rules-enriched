note: |
  ### Technical Context

  This Sigma rule detects the use of the `FromBase64String` method in PowerShell, which is often employed by attackers to obfuscate their commands by using Base64 encoding. The likely objective of the attacker is to execute scripts or commands that may install malware, steal credentials, or perform other malicious actions while evading detection through obscured command line usage. This behavior aligns with the MITRE ATT&CK techniques of "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter: PowerShell" (T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring CommandLine arguments. If malicious, this behavior could lead to compromised systems and data exfiltration, increasing the attack surface significantly. However, this detection alone does not confirm malicious activity; it merely indicates that Base64 encoded commands were executed, which may also occur in legitimate administrative scripts.

  ### Investigation Steps

  - **Review command line arguments for obfuscation:**
    Inspect the CommandLine field in Security Event ID 4688 or Sysmon Event ID 1 for unusual, complicated Base64 strings that precede `::FromBase64String(`, which are likely malicious.

  - **Validate hash values of decoded commands:**
    Decode the Base64 content using a safe environment. Check if the resulting command matches known malicious indicators or payloads by referencing threat intelligence databases.

  - **Identify legitimate administrative usage:**
    Check for known administrative tasks or scheduled jobs using legitimate Base64 encoded PowerShell scripts that may invoke the `FromBase64String` method (e.g., internal administrative scripts). Legitimate usage typically includes known paths like `C:\Scripts\AdminScript.ps1`.

  - **Examine process parent-child relationships:**
    Correlate the process tree around the identified PowerShell execution. Identify if it was spawned by suspicious parent processes, such as cmd.exe or another PowerShell instance, which could indicate malicious activity.

  - **Check process integrity and user context:**
    Verify the integrity of the PowerShell process and the user context from which it was executed. Use Security Event ID 4672 to identify processes running with elevated privileges that should not typically invoke Base64 commands.

  - **Look for concurrent anomalies:**
    Investigate recent changes to security settings or group policies via Event ID 4902, which may suggest that the environment is being altered as a precursor to exploitation.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of executing malicious scripts within the environment and the likelihood of such behavior being weaponized by adversaries. Given the attacker’s capability to obfuscate their actions, prompt investigation is essential to mitigate risks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques such as legitimate administrative scripts being misclassified as malicious, as these can also employ Base64 encoding. Reliance on Security Event IDs 4688 and Sysmon logs must be ensured, alongside proper log configurations to guarantee full insight into process creation events. It is possible for legitimate administrative users to invoke Base64 strings, indicating the need for context-aware alerts. Related detection rules for monitoring suspicious PowerShell executions (e.g., those that use other encoding methods) can provide complementary coverage and enhance overall detection capabilities.

