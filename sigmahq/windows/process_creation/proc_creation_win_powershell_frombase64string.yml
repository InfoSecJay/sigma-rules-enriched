note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize the `FromBase64String` function, which is typically employed to decode Base64 encoded strings. Attackers often use this technique to obfuscate their commands or payloads, concealing malicious intent and bypassing security measures. The detected behavior aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed command-line arguments for executed processes. If the activity is indeed malicious, it could enable the execution of arbitrary code or a harmful payload. However, this detection alone does not confirm malicious intent as benign administrative scripts may also trigger the alert.

  ### Investigation Steps

  - **Review command-line arguments**: Check Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Create) for details containing `::FromBase64String(`. Assess if the decoded string corresponds to known malicious commands or payloads.

  - **Decode the Base64 string**: Manually decode the Base64 encoded string observed in the alert to determine the actual command being executed. If the command appears to invoke suspicious behavior (e.g., downloading executables), treat as high confidence malicious.

  - **Identify the process owner**: Cross-reference the user account that executed the command with logs of authorized administrative activities or scheduled tasks. Legitimate PowerShell scripts could originate from specific administrative users or scheduled tasks relevant to system maintenance.

  - **Check for known malicious indicators**: Match the decoded command or any resulting network activity against threat intelligence sources for indicators of compromise. High confidence malicious indicators include URLs or command execution patterns associated with malware.

  - **Inspect host activity context**: Verify the role of the impacted host to confirm if PowerShell execution is typical behavior. Production servers may indicate more risk if PowerShell commands involve internet access or downloading files.

  ### Prioritization

  This alert holds a high severity level due to the potential for serious impacts on affected systems, especially if administrative or critical infrastructure is involved. The likelihood of malicious exploitation is elevated, as the use of encoded commands is a common tactic among adversaries attempting to evade detection.

  ### Blind Spots and Assumptions

  This detection may be evaded through obfuscation techniques, where attackers could utilize alternative encoding methods or invoke PowerShell without triggering alerts. Reliable detection depends on proper logging configurations and availability of relevant events. Administrators executing legitimate scripts that include the `FromBase64String` function may inadvertently trigger this alert, necessitating manual review. Complementary detections focusing on unusually high PowerShell usage or code execution anomalies can enhance coverage and context for analysis.

