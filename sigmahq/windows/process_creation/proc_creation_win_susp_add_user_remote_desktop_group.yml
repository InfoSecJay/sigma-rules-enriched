note: |
  ### Technical Context

  This detection rule identifies the addition of users to the Remote Desktop Users group on Windows systems through the use of either the `Net localgroup` command or the `Add-LocalGroupMember` PowerShell cmdlet. The likely objective of this behavior is to grant unauthorized access to systems for remote desktop sessions, potentially leading to further exploitation or persistence in the environment. This activity corresponds to the MITRE ATT&CK techniques: **Initial Access (T1133)**, **Persistence (T1136.001)**, and **Lateral Movement (T1021.001)**. The primary telemetry source is process creation logs from Windows, specifically looking at command-line arguments.

  If executed with malicious intent, adding unauthorized users to this group can lead to password harvesting, data exfiltration, or lateral movement to gain deeper access within the network. However, it is important to note that this detection alone does not confirm malicious activity; legitimate administrative tasks may trigger it as well.

  ### Investigation Steps

  - **Check process creation details:** Investigate Windows Event ID 4688 or Sysmon Event ID 1 for the specific command line execution involving `Net localgroup` or `Add-LocalGroupMember`, including timestamp and user context.

  - **Validate group membership changes:** Use PowerShell or Windows Event Log (Security Event ID 4728) to confirm if the user was actually added to the Remote Desktop Users group and identify the user who initiated this action.

  - **Assess user legitimacy:** Determine if the added user is a legitimate account or foreign/unrecognized account by cross-referencing with your organization's user directory or Active Directory records.

  - **Review recent administrative activity:** Check for any other related administrative actions in close temporal proximity, such as group memberships changes (Event ID 4728) or local policy changes, to identify patterns inconsistent with typical operations.

  - **Evaluate system roles:** Identify if the affected system is a core server, workstation, or critical infrastructure. Assess its importance in the environment for context on the severity of this activity.

  - **Document expected behavior:** Compare this action against expected administrative tasks, such as expected RDP management roles assigned by IT, to distinguish between benign and potentially malicious configurations.

  ### Prioritization

  This alert should be classified as high severity due to the potential impact of compromising remote access on sensitive systems. The likelihood of abuse is significant, as adding users to the Remote Desktop Users group is a common tactic employed by adversaries to facilitate unauthorized access. This behavior aligns with known weaponization patterns.

  ### Blind Spots and Assumptions

  This detection may be evaded using techniques such as executing commands through PowerShell scripts or employing administrative privileges without explicit logging. It relies on accurate logging configurations for process creation and group management events, which must be enabled on all relevant systems. Legitimate administrative activities, such as IT staff performing routine updates, may also trigger this alert. A related detection to enhance coverage would be monitoring for anomalous logins post-group modification (e.g., failed login attempts) or reviewing remote desktop access patterns to spot unexpected connections.

