note: |
  ### Technical Context
  This detection rule identifies when a user is added to the Local Remote Desktop Users group via commands such as `Net localgroup /add` or PowerShell's `Add-LocalGroupMember`. This behavior is particularly concerning because it allows unauthorized users to gain remote access to systems, potentially escalating privileges, and facilitating broader network access.

  The threat scenario revolves around attackers who may aim to establish persistence or perform lateral movement within a target environment. Gaining access to a remote desktop session can provide attackers with an advantageous foothold, enabling them to execute further attacks or data exfiltration.

  Relevant MITRE ATT&CK techniques include:
  - **Initial Access (T1078)**: Valid Accounts
  - **Persistence (T1136.001)**: Create Account
  - **Lateral Movement (T1021.001)**: Remote Services

  Primary data sources for monitoring these actions include Windows process creation logs that capture command-line activity and context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for instances of `Net localgroup /add` or `Add-LocalGroupMember` commands to identify the user adding targets to the Remote Desktop Users group.
  - **Analyze User Access Patterns**: Investigate the accounts to which users were added and assess if those accounts have legitimate reasons to access remote services.
  - **Check for Anomalous User Behavior**: Monitor the behavioral patterns of accounts that were recently added to the Remote Desktop Users group, looking for any suspicious or unusual login attempts or activities.
  - **Assess Group Membership Changes**: Validate recent membership in the Remote Desktop Users group and correlate these changes with any unauthorized access events or alerts.

  ### Prioritization
  This alert is classified as high priority due to the significant risk of privilege escalation and potential unauthorized access to critical systems within an enterprise. The likelihood of malicious intent increases when users are added to key access groups without proper justification.

  ### Blind Spots and Assumptions
  Detection logic may have gaps when legitimate administrative actions occur, potentially leading to false negatives in active administrative environments. It's assumed that the command-line logging is properly configured, and any command is adequately recorded. Additionally, if command piping or obfuscation techniques are utilized by attackers, such techniques may evade detection, making it critical to ensure comprehensive logging policies are in place.

