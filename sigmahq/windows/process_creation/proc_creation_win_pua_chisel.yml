detection:
  selection_img:
    Image|endswith: '\chisel.exe'
  selection_param1:
    CommandLine|contains:
    - 'exe client '
    - 'exe server '
  selection_param2:
    CommandLine|contains:
    - '-socks5'
    - '-reverse'
    - ' r:'
    - ':127.0.0.1:'
    - '-tls-skip-verify '
    - ':socks'
  condition: selection_img or all of selection_param*
falsepositives:
- Some false positives may occur with other tools with similar commandlines
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Chisel tunneling tool, which facilitates the creation of reverse or SOCKS5 proxies for network communication. Attackers often use Chisel to bypass network defenses, establishing covert channels for Command and Control (C2) communications or data exfiltration. This behavior aligns with the MITRE ATT&CK framework, specifically the tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1090.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically monitoring for the `Image` field related to `chisel.exe` and relevant parameters in the `CommandLine` field. If malicious, the execution of Chisel may indicate an active compromise, enabling the attacker to leverage it for further exploitation within the network. However, this detection does NOT confirm a breach on its own, as legitimate use of similar tools may exist in the environment.

  ### Investigation Steps

  - **Verify the process origin:** Check for Security Event ID 4688 or Sysmon Event ID 1 to confirm the source of the `chisel.exe` process. If the image path originates from non-standard directories (e.g., not from `C:\Program Files`), this may indicate malicious use.

  - **Analyze command line arguments:** Review the `CommandLine` field for occurrences of parameters like `-socks5`, `-reverse`, or any instances of `':127.0.0.1:'`. Malicious indicators include the use of `-tls-skip-verify`, which may suggest an effort to evade detection.

  - **Correlate with network activity:** Check firewall or proxy logs (e.g., Windows Firewall logs, Netsh command outputs) for unusual outbound connections to non-standard ports or unexpected IP addresses following the process creation.

  - **Document expected use cases:** Identify legitimate uses of tunneling tools by reviewing internal policies and user roles. Compare with the current environment. Legitimate use cases may have documented business needs that don’t involve `chisel.exe`.

  - **Look for persistence mechanisms:** Search for related modifications in startup folder or scheduled tasks that may indicate attempts to maintain persistence for the Chisel tool or its configuration. Look for Registry modifications or creation of new tasks associated with the execution of `chisel.exe`.

  ### Prioritization

  This alert should be considered high severity given the potential impact of a compromised system. Chisel is a known tunneling tool often weaponized in attacks for C2 purposes, making its detection critical. The likelihood of malicious use is high, especially if it is unexpected in the environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the existence of similar legitimate tools that can use analogous command line arguments, resulting in false positives. Adequate log sources must be configured, including both process creation logs and network traffic monitoring, to ensure comprehensive visibility. Legitimate administrative access or user training to conduct tunneling for specific applications may inadvertently trigger this alert. A complementary detection mechanism could be an alert for other known tunneling tools such as Ngrok or Localtunnel to enhance coverage.

