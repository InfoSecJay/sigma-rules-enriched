description: |
  Detects inline Windows shell commands redirecting output via the ">" symbol to a suspicious location.
  This technique is sometimes used by malicious actors in order to redirect the output of reconnaissance commands such as "hostname" and "dir" to files for future exfiltration.
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2024-03-19
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli_1:
    CommandLine|contains:
            # Note: Add more suspicious locations as you find them
            # Note: The space from the start is missing to cover append operations ">>"
            # Note: We use the "?" to account for both a single and a double quote
            # Note: If you want to account for more spaces which is still a valid bypass option. Use a regex with "\s"
    - '>?%APPDATA%\'
    - '>?%TEMP%\'
    - '>?%TMP%\'
    - '>?%USERPROFILE%\'
    - '>?C:\ProgramData\'
    - '>?C:\Temp\'
    - '>?C:\Users\Public\'
    - '>?C:\Windows\Temp\'
  selection_cli_2:
    CommandLine|contains:
    - ' >'
    - '">'
    - "'>"
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate admin or third party scripts used for diagnostic collection might 
  generate some false positives
level: medium
note: |
  ### Technical Context

  This rule detects potential misuse of command-line redirection in Windows environments, specifically when output from commands is redirected to suspicious locations via the ">" symbol. Attackers may utilize this technique to collect and store reconnaissance data silently, which can later be exfiltrated. The relevant MITRE ATT&CK tactic is **Execution** and technique **T1218: Signed Binary Proxy Execution**.

  The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, and Sysmon Event ID 1. If malicious, the security impact includes the silent capture of sensitive data, which may facilitate further exploitation or data exfiltration. Importantly, this detection does not confirm that malicious activity is occurring; legitimate system management or diagnostic activities can trigger similar command-line outputs.

  ### Investigation Steps

  - **Verify process creation details:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for logs indicating command execution by `cmd.exe`. Look for unusual parent process relationships indicating potential misuse.

  - **Analyze command-line arguments:** Investigate CommandLine field within telemetry to confirm if it contains suspicious redirection patterns (e.g., output redirected to `%APPDATA%`, the `>` symbol, or locations such as `C:\ProgramData\`). If legitimate, this may be typical for admin scripts or diagnostics.

  - **Check file creation timestamps:** If files are being generated in the suspected directories (e.g., `%APPDATA%`, `%TEMP%`), examine their creation dates and contents to determine if they hold expected data or indicators of exfiltrated information.

  - **Identify legitimate usage scenarios:** Review prior occurrences of similar command executions in your environment. Legitimate activity often includes redirection for legitimate scripts and logs, generally directed to well-known administrative locations without malicious intent.

  - **Look for known malicious indicators:** Verify against threat intelligence sources for any malicious command patterns that match the execution context. For example, if the output files contain malware signatures or are indicative of known exfiltration tools.

  ### Prioritization

  This alert is considered medium severity. Affected systems may store sensitive data, which if exploited, could lead to serious consequences for data confidentiality and integrity. While redirection can occur legitimately, the context and locations suggest potential malicious intent, especially if combined with further suspicious behavior.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion if attackers use legitimate administrative tools to redirect command output. Reliable detection requires monitoring of process creation and command-line activity, which must be fully integrated into the logging strategy. Legitimate activities, such as admin scripts using redirection for logging, may lead to false positives. A related detection includes monitoring for unusual or unauthorized access to the directories where output files are being redirected, providing broader context for potential malicious behavior.

