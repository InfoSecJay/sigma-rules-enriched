logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli_1:
    CommandLine|contains:
            # Note: Add more suspicious locations as you find them
            # Note: The space from the start is missing to cover append operations ">>"
            # Note: We use the "?" to account for both a single and a double quote
            # Note: If you want to account for more spaces which is still a valid bypass option. Use a regex with "\s"
    - '>?%APPDATA%\'
    - '>?%TEMP%\'
    - '>?%TMP%\'
    - '>?%USERPROFILE%\'
    - '>?C:\ProgramData\'
    - '>?C:\Temp\'
    - '>?C:\Users\Public\'
    - '>?C:\Windows\Temp\'
  selection_cli_2:
    CommandLine|contains:
    - ' >'
    - '">'
    - "'>"
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate admin or third party scripts used for diagnostic collection might generate
  some false positives
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of Windows command shell (cmd.exe) commands that redirect their output to suspicious locations using the ">" symbol. Malicious actors often utilize this technique to capture the output of reconnaissance commands, such as `hostname` and `dir`, which can lead to information theft or further exploitation. The relevant MITRE ATT&CK tactic and technique associated with this behavior is "Defense Evasion" (TA0040) and "Command and Scripting Interpreter" (T1218).

  The primary telemetry sources for this detection include process creation logs, specifically Event ID 4688 from Windows Security logs. If malicious, the impact can lead to unauthorized data collection or remote information exfiltration. It’s important to note that this detection does NOT confirm that a malicious act is occurring without further context—it only indicates potentially suspicious activity that warrants deeper investigation.

  ---

  ### Investigation Steps

  - **Review command execution details**: Examine the CommandLine field from Event ID 4688 or Sysmon Event ID 1 logs to confirm instances where cmd.exe redirected output to locations such as `%APPDATA%`, `%TEMP%`, `%USERPROFILE%`, and other specified paths.

  - **Identify high-confidence malicious indicators**: Determine if the command includes suspicious redirections like " >" or ">" followed by any of the known paths. Focus on output redirection that captures an executable script output or file listing, which is unusual for standard operations.

  - **Assess legitimate behavior**: Understand the normal use of cmd.exe by system administrators and applications, which often involves output redirection to standard locations such as logs or admin directories. Legitimate commands should not frequently redirect output to user-specific application data or temporary folders that lack context.

  - **Check for related malicious activity**: Validate whether there are additional indicators of compromise (IoCs) on the system, such as the presence of unusual files in `%APPDATA%` or `%TEMP%`, or anomalous execution of scripts that might correlate with this alert.

  - **Monitor for subsequent actions**: Ensure no follow-up activities indicate an exfiltration attempt, such as unusual network traffic patterns to external hosts. Validate if the execution of commands aligns with recognized malware behavior, such as implant activations or lateral movement.

  ---

  ### Prioritization

  This alert has medium severity due to the potential risk of data exfiltration and reconnaissance. The likelihood of malicious abuse is significant, as this tactic is commonly weaponized by adversaries. Affected systems, especially those with sensitive information or user privileges, warrant immediate attention.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist due to possible evasion techniques, such as encrypted command execution or legitimate administrative scripts that utilize similar redirection. Ensure logging configuration captures all required process creation events, especially those for cmd.exe. Additionally, recognize that legitimate scripts and automated processes may legitimately trigger this alert when outputting data for diagnostic purposes. A related detection could involve monitoring for abnormal network connections post-alert, which would enhance coverage of potential information exfiltration attempts.

