  type: similar
status: test
description: |
  Detects inline Windows shell commands redirecting output via the ">" symbol to a suspicious location.
  This technique is sometimes used by malicious actors in order to redirect the output of reconnaissance commands such as "hostname" and "dir" to files for future exfiltration.
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2024-03-19
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli_1:
    CommandLine|contains:
            # Note: Add more suspicious locations as you find them
            # Note: The space from the start is missing to cover append operations ">>"
            # Note: We use the "?" to account for both a single and a double quote
            # Note: If you want to account for more spaces which is still a valid bypass option. Use a regex with "\s"
    - '>?%APPDATA%\'
    - '>?%TEMP%\'
    - '>?%TMP%\'
    - '>?%USERPROFILE%\'
    - '>?C:\ProgramData\'
    - '>?C:\Temp\'
    - '>?C:\Users\Public\'
    - '>?C:\Windows\Temp\'
  selection_cli_2:
    CommandLine|contains:
    - ' >'
    - '">'
    - "'>"
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate admin or third party scripts used for diagnostic collection might generate
  some false positives
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious command shell activity related to Windows CMD executions that redirect output to certain file locations using the ">" symbol. Such behavior is often indicative of reconnaissance efforts by attackers, who may be directing the output of commands (such as "hostname" and "dir") to files for later exfiltration or analysis. This type of activity suggests an attempt to gather system information or user data covertly.

  The likely attacker objectives include data gathering for further exploitation or establishing footholds by collecting information on system configuration. Detecting these patterns can help in early identification of potential attacks targeting information theft and lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques includes Defense Evasion (T1203) and Command-Line Interface (T1218), as attackers use command-line interfaces to execute malicious commands discreetly.

  Primary data sources for this detection include process creation logs, which provide insights into command execution, as well as Windows Event logs that capture instances of CMD operations and their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any instances of `cmd.exe` being executed, particularly those with command-line arguments that include output redirection operators (">", ">>") targeting suspicious folders.
  - **Examine Command Line Parameters**: Check the command-line parameters used with `cmd.exe` to identify specific commands that may indicate reconnaissance activities, especially those redirecting output to user profile directories or temporary folders.
  - **Correlate with User Activity**: Investigate the user account associated with the command execution to determine if this behavior aligns with legitimate administrative activities or if it raises red flags indicating potential misuse.
  - **Assess File Creation and Modification**: Identify and review any files created or modified in the suspicious target directories mentioned in the rule, looking for unexpected file types or content that may indicate exfiltrated data or malicious scripts.

  ### Prioritization
  The severity of this alert is medium, as it may indicate reconnaissance activities that precede more serious attacks. While legitimate admin scripts could cause false positives, frequent appearances of this behavior warrant timely investigation due to the likelihood of potential data exfiltration.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage depending on the environment's logging configuration; if process creation logging is not enabled or command-line logging is limited, this rule may miss significant activities. The detection logic assumes that the command executed is explicitly using output redirection. Therefore, variations or obfuscations that bypass detection may not be captured. Required logs include detailed process creation events and appropriate configurations to ensure command-line parameters are logged in full.

