description: |
  Detects inline Windows shell commands redirecting output via the ">" symbol to a suspicious location.
  This technique is sometimes used by malicious actors in order to redirect the output of reconnaissance commands such as "hostname" and "dir" to files for future exfiltration.
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2024-03-19
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli_1:
    CommandLine|contains:
            # Note: Add more suspicious locations as you find them
            # Note: The space from the start is missing to cover append operations ">>"
            # Note: We use the "?" to account for both a single and a double quote
            # Note: If you want to account for more spaces which is still a valid bypass option. Use a regex with "\s"
    - '>?%APPDATA%\'
    - '>?%TEMP%\'
    - '>?%TMP%\'
    - '>?%USERPROFILE%\'
    - '>?C:\ProgramData\'
    - '>?C:\Temp\'
    - '>?C:\Users\Public\'
    - '>?C:\Windows\Temp\'
  selection_cli_2:
    CommandLine|contains:
    - ' >'
    - '">'
    - "'>"
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate admin or third party scripts used for diagnostic collection might 
  generate some false positives
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Windows command shell commands that redirect output to suspicious locations using the ">" symbol. Such behavior is commonly associated with attackers utilizing reconnaissance commands (e.g., "hostname," "dir") to capture and store information for future exfiltration efforts. The relevant MITRE ATT&CK technique is **T1218.011: Signed Binary Proxy Execution (cmd.exe)**.

  The primary telemetry source is Windows process creation logs, specifically targeting Event ID 4688, which captures new processes, alongside command line parameters. If malicious, this behavior could imply staging or exfiltration of potentially sensitive information. However, this detection does NOT confirm that a compromise has occurred, as it may also include legitimate administrative activities.

  ### Investigation Steps

  - **Review the Command Line Arguments:** Check Event ID 4688 for the specific process where the command line contains output redirection (e.g., `CommandLine` field containing `>?%APPDATA%\`). Legitimate behavior may include benign scripts that generate reports with similar commands.

  - **Evaluate Process Parentage:** Identify the parent process of the cmd.exe execution. Use `Event ID 4688` to check if the spawn event came from a legitimate administrative tool (e.g., PowerShell, administrative batch files) or from unknown processes, which could indicate malicious intent.

  - **Check Output File Locations:** Inspect the file system for newly created files in suspicious locations, such as `%APPDATA%`, `%TEMP%`, or `%USERPROFILE%`. Use file monitoring tools or `File Creation Events` to identify any recent outputs redirected there, noting that legitimate files should have clearly documented purposes.

  - **Correlate with Other Detection Rules:** Cross-reference findings with related detections, such as established data exfiltration attempts or unusual file access patterns via DLP logs. Linking the event to other suspicious activities enhances context.

  - **Identify Patterns of Activity:** Investigate logs for previous executions of similar commands by the same user or IP address that produced file outputs. A pattern of command executions resulting in redirected output may suggest ongoing malicious activity.

  ### Prioritization

  The alert severity is medium due to the potential for significant data exposure if an attacker is leveraging output redirection for reconnaissance or staging. While such behavior could be benign administrative activity, the diversion to uncommon locations raises the risk of malicious intent. Given that these tactics are weaponized during active exploitation scenarios, continued scrutiny is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific telemetry or logging configurations, particularly if process creation logging is not enabled or configured to capture command lines. Legitimate activities such as IT support using command line redirection for diagnostic purposes can trigger alerts. A related detection to strengthen coverage could involve tracking unusual file access patterns or frequency of command execution from cmd.exe.

