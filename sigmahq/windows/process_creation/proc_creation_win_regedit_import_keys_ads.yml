note: |
  ### Technical Context

  This Sigma rule detects the behavior of importing a registry key from an alternate data stream (ADS) using the `regedit.exe` command-line utility. This technique may be leveraged by attackers to persistently introduce malicious configurations into the Windows registry without raising immediate suspicion, as the use of ADS is less commonly scrutinized. The relevant MITRE ATT&CK tactic for this behavior is "Persistence" (TA0003), specifically technique "Registry Run Keys / Startup Folder" (T1112).

  The primary telemetry sources for this detection are process creation logs, particularly from Windows Security Event ID 4688 and Sysmon Event ID 1, which capture command-line execution details. If malicious, this behavior could lead to the modification of critical registry settings, potentially enabling further compromise or persistent backdoors on the system. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrative actions could exhibit similar behavior.

  ### Investigation Steps

  - **Review process creation logs for regedit.exe:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 logs. Look for `CommandLine` entries containing `regedit.exe /i` and `.reg`, as these indicate the potential import of registry settings from an ADS.

  - **Identify indicators of malicious behavior:** Confirm the presence of `-e` (extraction) or `-a` (append) flags in the `CommandLine` field, as these flags are often associated with ADS usage—especially if the context of the execution raises suspicion based on user or account activity.

  - **Search for registry changes:** Utilize tools to query the affected registry keys after the execution of `regedit.exe`. Look for newly created or modified keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations, as attackers often use these for persistence.

  - **Validate legitimate use cases:** Cross-reference typical administrative use scenarios such as scheduled or patching tasks, where authorized personnel may legitimately use regedit with ADS to import settings, ensuring that they're executed in appropriate contexts.

  - **Check for companion detection:** Investigate related detections for suspicious file activity or unusual process parent-child relationships. Related detections may flag unusual behavior or context surrounding the regedit.exe invocation (e.g., Powershell launching regedit).

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for critical systems to be compromised if malicious activity is confirmed. The sound understanding that this method of registry manipulation is frequently utilized in advanced attacks raises concerns, particularly in environments heavily reliant on automation and configurations managed via the registry.

  ### Blind Spots and Assumptions

  This detection may be evaded by utilizing alternate methods for registry modification that do not involve regedit.exe, such as using PowerShell or third-party tools. Reliable detection requires comprehensive logging configurations for process creation and potentially extended logging for registry activity. Legitimate administrative tasks, such as system configuration changes, may trigger this alert. A related detection, such as monitoring for unexpected file creations through ADS, can enhance coverage and context during investigations.

