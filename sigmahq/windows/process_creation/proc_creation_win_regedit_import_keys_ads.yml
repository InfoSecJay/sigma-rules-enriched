note: |
  ### Technical Context

  This Sigma rule detects the usage of `regedit.exe` to import an alternate data stream (ADS) into the Windows registry. This behavior can indicate an attacker objective of maintaining persistence through stealthy modifications to system settings or application configurations, often aiming to evade detection by traditional security measures. The relevant MITRE ATT&CK techniques are Persistence (T1112) and Defense Evasion.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide information about process activities that include command-line parameters and naming conventions. If malicious, this activity could manipulate critical system configurations, facilitating unauthorized access or control. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also leverage the same mechanism.

  ### Investigation Steps

  - **Verify process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for entries related to `regedit.exe`, focusing on command-line attributes that contain argument ` /i ` or `.reg`. Look for unexpected timing or non-standard user accounts.

  - **Check for known indicators of compromise:** Evaluate the command-line arguments for pattern matches. Specifically, examine for the presence of `-e`, `-a`, or `-c` which could indicate use of malicious techniques. Validate against threat intelligence feeds for known suspicious command-line usage.

  - **Correlate with registry changes:** Cross-reference the timestamps of identified `regedit` executions with Windows Registry logs (if available) for modifications to keys that are typically altered by malware, such as those under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`.

  - **Identify legitimate administrative activities:** Document any recent legitimate activity that involves the importation of registry files via `regedit.exe` for sound justification, such as scheduled system updates or configuration changes made through authorized IT changes.

  - **Review user behavior analysis:** Analyze user behavior patterns for significant anomalies. If a non-privileged user account executed `regedit.exe` with this command-line, treat it with higher suspicion compared to actions taken by a system administrator.

  ### Prioritization

  The alert is considered high priority due to its potential impact on system integrity and the likelihood of malicious abuse in enterprise environments. Because the registry is a critical component of the operating system, activities manipulating it are often weaponized in attacks for persistence or evasion.

  ### Blind Spots and Assumptions

  Limitations include potential obfuscation of the command-line arguments or use of alternative tools/scripts to achieve similar outcomes, thus undermining detection capabilities. Reliable detection requires that both process creation logs and registry access logs are enabled and properly configured. Legitimate administrative tools or scripts modifying the registry, such as during software installations, may trigger this alert. A related detection could be the monitoring of unusual script executions (e.g., PowerShell scripts interacting with the registry), providing additional coverage for similar activities.

