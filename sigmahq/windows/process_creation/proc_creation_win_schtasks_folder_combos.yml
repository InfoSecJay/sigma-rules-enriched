title: Schtasks From Suspicious Folders
id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
status: test
description: Detects scheduled task creations that have suspicious action command
  and folder combinations
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/lazarus-dream-job-chemical
author: Florian Roth (Nextron Systems)
date: 2022-04-15
modified: 2022-11-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_create:
    CommandLine|contains: ' /create '
  selection_command:
    CommandLine|contains:
    - 'powershell'
    - 'pwsh'
    - 'cmd /c '
    - 'cmd /k '
    - 'cmd /r '
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_all_folders:
    CommandLine|contains:
    - 'C:\ProgramData\'
    - '%ProgramData%'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks using the `schtasks.exe` utility from suspicious folder paths, such as `C:\ProgramData\`. Attackers may leverage this technique to establish persistence on a compromised system, execute commands covertly, or elevate privileges. By using scheduled tasks, adversaries can ensure their malicious payloads run at specific intervals, potentially avoiding detection by security tools. The associated threat family could include advanced persistent threats (APTs) such as the Lazarus Group, which is known for employing similar tactics.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1053.005)**, which involves creating scheduled tasks to maintain access, and **Privilege Escalation (T1068)**, which could involve tasks running under elevated privileges if configured improperly. The primary data sources that provide valuable evidence for this detection rule are **process creation logs** from Windows systems, specifically the events logged by `schtasks.exe` when tasks are created.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for the execution of `schtasks.exe` to identify any irregular patterns or unusual folder paths being targeted.
  - **Analyze Command Line Arguments**: Investigate the command line used in the `schtasks` creation to determine if it invokes potentially malicious commands, especially with references to PowerShell or cmd.exe.
  - **Inspect Scheduled Task Configurations**: Look at the created tasks themselves within the Task Scheduler for unusual configurations, such as tasks that run exceptionally frequently or execute scripts from sensitive directories.
  - **Correlate with User Activity**: Cross-reference process creation events with user account activity to ascertain whether the account creating the tasks has legitimate access and behavior.

  ### Prioritization
  The high severity of this alert stems from the ability of scheduled tasks to facilitate persistent access and execution of malicious payloads on the system. Given that such behavior can lead to significant security breaches, including data exfiltration or lateral movement, it necessitates immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover scheduled tasks created through alternate methods, such as direct API calls or other legitimate task scheduling tools that do not invoke `schtasks.exe`. It assumes that the environment has logging enabled sufficiently to capture process creation events, particularly those related to `schtasks.exe`. Additionally, the rule may generate false positives if legitimate administrative tasks are performed from the monitored paths without adequate context around typical user behavior.

