title: Schtasks From Suspicious Folders
id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
status: test
description: Detects scheduled task creations that have suspicious action 
  command and folder combinations
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/lazarus-dream-job-chemical
author: Florian Roth (Nextron Systems)
date: 2022-04-15
modified: 2022-11-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_create:
    CommandLine|contains: ' /create '
  selection_command:
    CommandLine|contains:
    - 'powershell'
    - 'pwsh'
    - 'cmd /c '
    - 'cmd /k '
    - 'cmd /r '
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_all_folders:
    CommandLine|contains:
    - 'C:\ProgramData\'
    - '%ProgramData%'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of scheduled tasks using `schtasks.exe` from potentially suspicious directories, specifically focusing on command-line patterns indicative of post-exploitation activity. The likely attacker objective is to establish persistence or execute commands at a specific time or during system startup, which aligns with tactics associated with privilege escalation and execution. The relevant MITRE ATT&CK techniques include "Scheduled Task/Job" (T1053.005).

  Primary telemetry sources include Windows event logs related to process creation, specifically Event ID 4688 (for new processes) and the corresponding command line details. The security impact is significant, as an adversary leveraging this technique can maintain access and control over compromised systems. However, detection of this activity does NOT confirm malicious intent on its own, as legitimate administrative tasks may also use `schtasks.exe`.

  ### Investigation Steps

  - **Examine the command line for arguments**: Review Event ID 4688 for any `schtasks.exe` instances that include `CommandLine` arguments such as `/create`, especially those invoking `powershell`, `cmd`, or any other command interpreter. Malicious examples will typically have obfuscated commands or suspicious actions.

  - **Identify the creation location**: Check the `CommandLine` field for paths containing `C:\ProgramData\` or `%ProgramData%`. Legitimate usage typically involves creation at user or system-defined locations, whereas suspicious activity appears from non-standard folders.

  - **Cross-reference process parentage**: Analyze the `ParentProcessId` alongside Event ID 4688 to determine if `schtasks.exe` was spawned by a known malicious process or user action. High-confidence malicious indicators would show `Task Scheduler` or other adversarial tools as parents rather than benign processes.

  - **Review User Accounts involved**: Validate the user account that executed the command by checking the `SubjectUserName` field. Anomalous accounts, particularly those with low activity or which appeared unexpectedly, are high-confidence indicators of potential compromise.

  - **Assess for existing scheduled tasks**: Use `schtasks` output to list currently scheduled tasks. Compare against the command line log for any discrepancies or unauthorized changes made to existing tasks, which could indicate an attempt at evasion or reconfiguration by the attacker.

  ### Prioritization

  This alert is high severity due to the potential for system compromise via persistence mechanisms. The affected system's role—whether a workstation, server, or critical infrastructure—amplifies the urgency. Additionally, these tactics are frequently weaponized in attacks, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by certain evasion techniques, such as using different executables or scripting languages to set tasks without triggering this rule. Required log sources include complete Windows Security Event logs and possibly Sysmon logs for enhanced process tracking. Legitimate activities such as scheduled maintenance or backup tasks may trigger the alert. Effective coverage can be bolstered by integrating detections for abnormal PowerShell activity or anomalies in user logon patterns.

