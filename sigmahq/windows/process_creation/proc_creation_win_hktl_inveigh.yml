note: |
  ### Technical Context

  This Sigma rule detects the execution of Inveigh, a cross-platform tool designed for man-in-the-middle (MitM) attacks, particularly targeting network traffic in environments utilizing IPv4 and IPv6. The likely attacker objective is to capture sensitive information, such as credentials, by intercepting and manipulating network traffic. Relevant MITRE ATT&CK tactic and technique for this behavior include Credential Access (T1003.001).

  Primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688, which logs new process creation events. If malicious, the use of Inveigh represents a significant security threat, as the tool could facilitate unauthorized data exfiltration and network compromise. It is important to note that this detection does not confirm that malicious activity has occurred without further context; it merely indicates that the Inveigh tool was executed.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for new processes that match 'Inveigh.exe' or contain 'Inveigh' in the description. Confirm the command line parameters used, specifically looking for indicators such as '-SpooferIP' and '-SnifferIP'.

  - **Correlate with network telemetry:** Review related network logs (e.g., firewall, proxy logs) for any unusual activity, such as ARP spoofing or DNS poisoning attempts originating from the host executing Inveigh.

  - **Verify legitimate usage:** Investigate the context of Inveigh execution—check if the application runs during authorized penetration tests, security assessments, or if it is part of a legitimate framework used by trusted users.

  - **Identify malicious indicators:** Look for abnormal or unexpected parent processes tagged with high-risk characteristics. A process like Inveigh spawned by suspicious executables (e.g., PowerShell, Windows command prompt) is a high-confidence malicious indicator.

  - **Assess impacted asset criticality:** Understand the role of the affected host within the enterprise—an Inveigh execution on a Domain Controller poses a higher risk than one on a less critical asset.

  - **Monitor for file artifacts:** Validate any file creation or modification related to Inveigh (e.g., check for log files generated by Inveigh in common log directories).

  ### Prioritization

  This alert is critical, as the execution of Inveigh on any system can indicate an immediate threat to network integrity and credential security. The likelihood of malicious abuse is high, given that tools like Inveigh are frequently used in active attacks. Additionally, the behavior is commonly weaponized in various attack scenarios, particularly in testing environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging if log settings are inadequate. Tools like Inveigh can be legitimately used by security professionals during authorized assessments, which may generate false alerts. Essential logging sources must be configured to capture all process creation events robustly to ensure reliable detection. Companion detections that may enhance visibility include alerts on unusual ARP activities or unexpected DNS queries originating from endpoints.

