note: |
  ### Technical Context

  This Sigma rule detects the execution of Inveigh, a tool designed for Man-in-the-Middle (MitM) attacks targeting IPv4 and IPv6 traffic. The attacker objective is to intercept and manipulate network traffic through methods such as credential stealing, ultimately aiming to gain unauthorized access to sensitive information. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique Credential Dumping (T1003.001).

  The primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688. If malicious, the security impact can be severe, as it may lead to credential theft and unauthorized access to systems and data. However, this detection does NOT confirm that a credential breach has occurred; it merely indicates that the Inveigh tool has been executed.

  ### Investigation Steps

  - **Check process creation logs:** Investigate Windows Security Event ID 4688 for processes created that include `Inveigh.exe` or `Inveigh.dll`. Look for command-line arguments such as `-SpooferIP`, `-ReplyToIPs`, or `-SnifferIP`, which indicate targeted MitM configurations.

  - **Verify the source of execution:** Confirm the parent process using Event ID 4688 logs to determine if Inveigh was initiated from a legitimate application (e.g., a management console) or from a suspicious context (e.g., Command Prompt or PowerShell).

  - **Identify network traffic anomalies:** Review network logs for suspicious traffic patterns or anomalies on the affected host, such as unusual ARP requests or traffic to unexpected internal or external IP addresses while Inveigh was active.

  - **Look for known malicious indicators:** Check for high-confidence malicious indicators related to Inveigh execution in the network (e.g., unauthorized access to sensitive services via intercepted credentials) by searching for unusual login attempts or access to critical systems.

  - **Determine expected user behavior:** Identify whether the user of the affected system has a legitimate reason to run Inveigh, such as conducting a security assessment. Check against documented internal practices to avoid false positives.

  - **Assess endpoint configurations:** Investigate the host OS and user privileges; systems configured with a high level of user interactivity (administrative privileges) are more likely to be targeted by adversaries using tools like Inveigh.

  ### Prioritization

  The alert severity is critical, especially if the affected system is part of the internal network as it can lead to credential compromise and potential lateral movement. Due to the capabilities of Inveigh, the likelihood of malicious abuse is high, given that MitM attacks are frequently employed by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as obfuscating command-line arguments or running Inveigh from an unsigned binary. Reliable detection relies heavily on having Windows process creation logging enabled and correctly configured. Legitimate administrative activities may trigger this alert, particularly during network monitoring tasks. A related detection to strengthen coverage would be monitoring for ARP spoofing events on the network, which could indicate similar malicious intent.

