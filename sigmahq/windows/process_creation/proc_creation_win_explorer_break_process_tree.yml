title: Explorer Process Tree Break
id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
status: test
description: |
  Detects a command line process that uses explorer.exe to launch arbitrary commands or binaries,
  which is similar to cmd.exe /c, only it breaks the process tree and makes its parent a new instance of explorer spawning from "svchost"
references:
- https://twitter.com/CyberRaiju/status/1273597319322058752
- https://twitter.com/bohops/status/1276357235954909188?s=12
- https://twitter.com/nas_bench/status/1535322450858233858
- https://securityboulevard.com/2019/09/deobfuscating-ostap-trickbots-34000-line-javascript-downloader/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems),
  @gott_cyber
date: 2019-06-29
modified: 2025-10-31
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
    # Note: See CLSID_SeparateMultipleProcessExplorerHost in the registry for reference
  selection_factory:
    CommandLine|contains: '/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}'     # This will catch, the new explorer spawning which indicates a process/tree break. But you won't be able to catch the executing process. For that you need historical data
  selection_root:
    CommandLine|contains: 'explorer.exe'
    CommandLine|contains|windash: ' /root,'
        # There exists almost infinite possibilities to spawn from explorer. The "/root" flag is just an example
        # It's better to have the ability to look at the process tree and look for explorer processes with "weird" flags to be able to catch this technique.
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious use of the `explorer.exe` process to launch arbitrary commands or binaries by breaking the traditional parent-child process tree. This technique obscures the actual command or file being executed, making detection more challenging for security teams. The attacker's objective may include running unauthorized programs or scripts to maintain persistence, deliver payloads, or execute other malicious activities while evading detection of the original execution source.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Command and Control** (T1071), with the specific technique of **Masquerading** (T1036). By leveraging `explorer.exe` in an atypical manner, attackers aim to disguise their activities to blend in with legitimate operating system functions.

  Primary data sources for this detection include process creation logs from your endpoint security tools, which can provide insight into command-line arguments and parent-child relationships of running processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where `explorer.exe` is launched with unusual command-line arguments, especially those containing `/factory` or `/root`.

  - **Analyze Parent-Child Process Relationships**: Investigate the process tree to reveal anomalies, particularly focusing on processes with `explorer.exe` as the parent that have non-standard children executing unexpected commands.

  - **Correlate with Historical Data**: If possible, compare the current `explorer.exe` instances with historical data to identify any sudden changes or unusual patterns in the process behavior.

  - **Monitor for Persistence Mechanisms**: Check for other signs of persistence or evasion techniques, such as suspicious scheduled tasks, unknown services, or modifications to startup items that might correlate with the detected activity.

  ### Prioritization
  The medium severity of this alert is based on the potential impact of an attacker successfully disguising their actions using standard system processes to execute arbitrary commands, which could lead to data breaches or system compromise.

  ### Blind Spots and Assumptions
  The detection logic has potential gaps in identifying every instance of malicious use of `explorer.exe`, especially if the attacker uses non-standard flags or other methods to obscure execution. It assumes that appropriate process creation logs are being collected and retained for sufficient time to analyze the process tree effectively. Additionally, if logs do not capture comprehensive details about command-line arguments or process relationships, the effectiveness of this detection will be diminished.

