title: Explorer Process Tree Break
id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
status: test
description: |
  Detects a command line process that uses explorer.exe to launch arbitrary commands or binaries,
  which is similar to cmd.exe /c, only it breaks the process tree and makes its parent a new instance of explorer spawning from "svchost"
references:
- https://twitter.com/CyberRaiju/status/1273597319322058752
- https://twitter.com/bohops/status/1276357235954909188?s=12
- https://twitter.com/nas_bench/status/1535322450858233858
- https://securityboulevard.com/2019/09/deobfuscating-ostap-trickbots-34000-line-javascript-downloader/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems), @gott_cyber
date: 2019-06-29
modified: 2025-10-31
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
    # Note: See CLSID_SeparateMultipleProcessExplorerHost in the registry for reference
  selection_factory:
    CommandLine|contains: '/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}'     # This will catch, the new explorer spawning which indicates a process/tree break. But you won't be able to catch the executing process. For that you need historical data
  selection_root:
    CommandLine|contains: 'explorer.exe'
    CommandLine|contains|windash: ' /root,'
        # There exists almost infinite possibilities to spawn from explorer. The "/root" flag is just an example
        # It's better to have the ability to look at the process tree and look for explorer processes with "weird" flags to be able to catch this technique.
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `explorer.exe` to launch arbitrary commands or binaries, effectively breaking the process tree. This is indicative of an attacker trying to execute malicious payloads while masking their execution through legitimate system processes. The likely attacker objective is to evade detection mechanisms by using `explorer.exe`, as opposed to more conventional command execution methods like `cmd.exe`. Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and the specific technique **Impair Defenses (T1036)**. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If successful, this could lead to unauthorized code execution, data exfiltration, or compromise of sensitive information. This detection does NOT confirm that a malicious action has occurred without further contextual analysis.

  ### Investigation Steps

  - **Correlate process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for `explorer.exe` instances with unusual command-line parameters (e.g., `CommandLine` containing `/factory` or `/root`). Verify if the command used aligns with common user behavior; benign processes will typically lack these flags.

  - **Identify parent-child process relationships:** Check the process tree structure to determine if `explorer.exe` spawned from `svchost.exe` or other legitimate parents. Malicious instances will have atypical parent processes that do not align with standard behavior on the affected host.

  - **Monitor command execution patterns:** Analyze the command-line arguments for significant patterns or known malicious flags used by threat actors. Look for known indicators of compromise, such as suspicious executables or actions that do not match typical use.

  - **Review historical process data:** If available, investigate historical process logs to determine the execution path and identify if there were any prior instances of `explorer.exe` initiating processes in a suspicious context. Previous legitimate execution could aid in establishing a baseline.

  - **Assess user activity:** Validate the user account related to the detected activity. Authorized admin actions, legitimate scripting, or remote access tools often utilize `explorer.exe` and can trigger the alert, whereas anomalous behavior for standard users is a potential threat indicator.

  ### Prioritization

  This alert is assessed as medium severity due to the potential impact on system integrity and data security from unauthorized code execution. The likelihood of malicious abuse is moderate, as evading traditional detection methods using `explorer.exe` is a known tactic among adversaries. However, this behavior can occasionally result from benign administrative tasks, requiring further context before escalation.

  ### Blind Spots and Assumptions

  The detection may miss advanced obfuscation techniques or variations in process creation that legitimate applications may use, potentially leading to false negatives. Dependencies on Windows process creation logs and Sysmon configurations must be ensured; if these logs are not collected, the detection would fail. Common benign activities that could trigger this alert include legitimate administrative scripts running through `explorer.exe`. A related detection that strengthens coverage includes monitoring for unusual process trees or child-parent relationships involving `svchost.exe` and known binaries typically involved in exploitation scenarios.

