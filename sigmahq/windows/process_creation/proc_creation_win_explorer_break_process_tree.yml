title: Explorer Process Tree Break
id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
status: test
description: |
  Detects a command line process that uses explorer.exe to launch arbitrary commands or binaries,
  which is similar to cmd.exe /c, only it breaks the process tree and makes its parent a new instance of explorer spawning from "svchost"
references:
- https://twitter.com/CyberRaiju/status/1273597319322058752
- https://twitter.com/bohops/status/1276357235954909188?s=12
- https://twitter.com/nas_bench/status/1535322450858233858
- https://securityboulevard.com/2019/09/deobfuscating-ostap-trickbots-34000-line-javascript-downloader/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems), @gott_cyber
date: 2019-06-29
modified: 2025-10-31
tags:
- attack.stealth
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
    # Note: See CLSID_SeparateMultipleProcessExplorerHost in the registry for reference
  selection_factory:
    CommandLine|contains: '/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}'     # This will catch, the new explorer spawning which indicates a process/tree break. But you won't be able to catch the executing process. For that you need historical data
  selection_root:
    CommandLine|contains: 'explorer.exe'
    CommandLine|contains|windash: ' /root,'
        # There exists almost infinite possibilities to spawn from explorer. The "/root" flag is just an example
        # It's better to have the ability to look at the process tree and look for explorer processes with "weird" flags to be able to catch this technique.
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where `explorer.exe` is used to launch arbitrary commands or binaries, effectively creating a detached process tree. This behavior typically aims to bypass normal shell execution contexts, promoting stealthy operations. The relevant MITRE ATT&CK tactic is *Execution*, specifically technique T1036 (Masquerading). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details of the command line execution and parent-child process relationships. If malicious, this tactic could enable unauthorized access or data exfiltration. It's important to note that this detection does not confirm malicious intent on its own, as legitimate applications may invoke `explorer.exe` in similar ways.

  ### Investigation Steps

  - **Examine the command line used for execution**: Look for process creation logs (Security Event ID 4688) involving `explorer.exe` where the `CommandLine` field contains flags such as `/factory` and `/root`. Evaluate whether the flags are typical for legitimate operations (e.g., launching the file explorer) or indicative of evasion (e.g., unusual arguments).

  - **Review parent-child process relationships**: Utilize Sysmon Event ID 1 to investigate the process tree. Identify instances where `explorer.exe` appears as a parent to processes with unusual or malicious-looking command lines, indicating a potential bypass of standard execution tracing.

  - **Check for related service interactions**: Review logs (Windows Event Log > System) for any interactions with `svchost.exe` around the time of the detected activity, as this can provide context to whether this process creation is linked to system service manipulations, which is uncommon for regular user activities.

  - **Assess user behavior preceding the creation event**: Investigate user logs to verify legitimate actions preceding the alert. Look for common user interactions with Windows Explorer that may correspond to the command line flags seen to ensure that activity does not align with known user behavior (e.g., navigating files vs. executing arbitrary commands).

  - **Identify high-confidence malicious indicators**: Note any instances where `explorer.exe` is spawning processes with command lines that include system commands or suspicious binaries. For example, if `explorer.exe` is found with arguments that execute PowerShell scripts or downloads, this warrants further investigation.

  ### Prioritization

  This alert carries medium severity as it indicates a potential deviation from normal shell execution patterns, with the likelihood for malicious abuse existing given the stealthy nature of the behavior. While not commonly weaponized on its own, usage of `explorer.exe` in this manner can be indicative of more sophisticated attack vectors such as lateral movement or privilege escalation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion strategies where an adversary can mask usage of `explorer.exe` with benign command line arguments or use legitimate toolsets that trigger similar behaviors. Reliable detection requires comprehensive auditing of process creation logs (Event ID 4688) and Sysmon configurations to ensure complete process tree visibility. Legitimate activities that may trigger this alert include custom applications or scripts launching file navigation commands in specific enterprise environments. A companion detection to strengthen coverage is tracking abnormal file access patterns following the process creation to identify potential data exfiltration attempts.

