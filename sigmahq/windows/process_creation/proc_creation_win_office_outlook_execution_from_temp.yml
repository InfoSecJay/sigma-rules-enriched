  ---

  ### Technical Context

  This detection rule identifies suspicious process execution originating from the Outlook temporary folder, specifically from paths containing "Temporary Internet Files\Content.Outlook\". This behavior is often exploited by attackers aiming to deliver malware via phishing emails or malicious attachments that leverage Outlook's temporary files for execution. The likely attacker objective is to maintain persistence or execute payloads that evade traditional detection mechanisms.

  The relevant MITRE ATT&CK tactic is **Initial Access**, specifically technique **Phishing: Spear Phishing Attachment** (T1566.001). The primary telemetry sources involved are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which detail process execution on Windows systems. If confirmed malicious, this activity can lead to unauthorized access, data breaches, or lateral movement within the network. However, this detection does NOT confirm that the execution is malicious on its own, as legitimate software updates or Office plugins could access that directory.

  ---

  ### Investigation Steps

  - **Review process execution details**: Examine Security Event ID 4688 or Sysmon Event ID 1 for the captured process. Verify the **Image** field to ensure it shows a suspicious executable path from the Outlook temp folder, like “C:\Users\<username>\AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\<foldername>”.

  - **Check parent process information**: Inspect the **ParentImage** field in Security Event ID 4688 to identify the originating process. If the parent process is `OUTLOOK.EXE`, this could indicate malicious activity; if it is a legitimate tool (e.g., Microsoft Office), validate further.

  - **Investigate file presence and behavior**: Search for the executable in the context of its creation time and user activity. Utilize Windows Event 4663 (Access to an object) to determine if files are being accessed or modified in the same directory shortly after execution.

  - **Assess system role and context**: Confirm the asset's criticality; if the alert triggers on a server or sensitive workstation rather than a standard user machine, escalate the investigation. Consider the user role and recent activity to determine legitimacy.

  - **Verify user activity and email context**: Look for recent phishing email indicators in the user's mailbox, especially emails containing attachments or scripts that were accessed around the execution time.

  ---

  ### Prioritization

  This alert should be treated with high severity, especially on critical systems, given that execution from the Outlook temporary folder is generally uncommon and could indicate a real threat. The likelihood of malicious exploitation is increased in environments where phishing is prevalent.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers renaming executables or leveraging macros hidden in legitimate emails. Reliable detection requires ensuring Sysmon is installed and configured correctly across endpoints to capture all relevant logs. Legitimate behavior might occur if users are interacting with macro-enabled documents or legitimate software updates, which could also trigger this alert. Monitoring companion detections related to renaming of suspicious files or existing phishing attempts may strengthen coverage.

