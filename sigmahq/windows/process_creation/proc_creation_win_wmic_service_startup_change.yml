note: |
  ### Technical Context

  This Sigma rule detects the use of WMIC.exe to change the startup type of a Windows service to either 'Disabled' or 'Manual'. The likely attacker objective is to hinder system functionality or to obfuscate malicious operations by altering service behaviors. This activity fits within the MITRE ATT&CK framework under the tactic of "Execution" (ID: TA0002) and the technique "Command and Scripting Interpreter" (ID: T1047). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could lead to significant security impacts, such as the disruption of critical services or the hiding of malicious operations. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger the rule.

  ### Investigation Steps

  - **Examine the process creation event:** Review Security Event ID 4688 or Sysmon Event ID 1 for WMIC.exe execution. Check the `CommandLine` field to see if it contains "ChangeStartMode" with 'Manual' or 'Disabled'. Legitimate operations typically use 'Automatic' or similar active statuses.

  - **Cross-reference user context:** Look at the `SubjectUserName` with the process creation event. If the user is a non-administrative account or an unusual account for the machine, it is a strong indicator of potential malicious activity.

  - **Identify recent service changes:** Investigate the Windows Service logs (Event ID 7045) to find service configuration changes around the same timestamp as the WMIC execution. Look for any abnormalities, such as unrecognized service names or unusual changes from 'Automatic' to 'Disabled'.

  - **Analyze associated processes:** Use Sysmon Event ID 1 to check for processes that were initiated by the WMIC.exe command. Malicious initiators might include unusual or unexpected tools like PowerShell or other scripting environments.

  - **Check for signs of evasion:** Review logs for WMIC executions that are not preceded by legitimate administrative activities. Repeated changes to service types without clear justification or documentation may indicate an attempt to evade defenses.

  ### Prioritization

  This alert should be considered medium severity as changing service startup types can significantly affect the functionality of critical systems. The likelihood of malicious abuse is moderate, especially since disabling or altering system services can directly contribute to successful exploitation or persistence mechanisms. However, legitimate administrative activity does occur, which justifies a thorough review of the context.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations where WMIC activity is often logged only for specific command types or by events being overridden in high log-activity environments. Legitimate administrative changes, such as service management by system administrators via WMIC or Group Policy, may lead to false positives, necessitating careful analysis. Companion detections, such as tracking PowerShell command usage (T1059.001), would enhance overall visibility and coverage against similar defense-evasion techniques.

