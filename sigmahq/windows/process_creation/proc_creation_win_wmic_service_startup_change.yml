title: Service Startup Type Change Via Wmic.EXE
id: c0514f28-fdae-42df-b886-06e2b2bc5b37
status: experimental
description: |
  Detects changes to service startup type to 'disabled' or 'manual' using the WMIC command-line utility.
references:
- https://blog.talosintelligence.com/uncovering-qilin-attack-methods-exposed-through-multiple-cases/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-04-27
tags:
- attack.execution
- attack.defense-impairment
- attack.t1047
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' service '
    - 'ChangeStartMode'
    CommandLine|contains:
    - 'Manual'
    - 'Disabled'
  condition: all of selection_*
falsepositives:
- Legitimate administrative changes to service startup types using WMIC, 
  investigate accordingly.
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_wmic_service_startup_change/info.yml
note: |
  ### Technical Context

  This rule detects changes to the startup type of Windows services to 'disabled' or 'manual' using the WMIC command-line utility. Attackers may alter service configurations to evade detection or disrupt normal operations, often as a precursor to executing malicious payloads or maintaining persistence. This behavior aligns with the MITRE ATT&CK techniques for Execution (T1047 - Windows Management Instrumentation) and Defense Evasion (T1685 - Service Stop).

  The primary telemetry sources required for this detection are Windows Process Creation logs, specifically Event ID 4688 for process creation events and Sysmon Event ID 1 for tracking command-line arguments. If malicious, this may allow adversaries to prevent critical services from running, significantly impacting system functionality. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may also produce similar logs.

  ### Investigation Steps

  - **Review process logs for WMIC usage:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for any instances where WMIC.exe was executed. Focus on command lines containing 'ChangeStartMode' with 'Manual' or 'Disabled'.

  - **Identify the user initiating the command:** Validate if the command was run by a legitimate administrative user or account. Look for specific user context in Event ID 4688 (e.g., `NewProcessName`, `SubjectUserName`) to determine if it aligns with normal operational behavior.

  - **Check for affected services:** List any services that were altered during the WMIC executions. Use Event ID 7045 in the System log to confirm if the services’ startup types were indeed changed as indicated.

  - **Contextualize against known baselines:** Identify if the service startup type changes correspond to a maintenance window or administrative action. Compare logs against typical service management actions for distinguishing legitimate activities.

  - **Look for patterns of service manipulation:** Examine if multiple services were altered in sequence or if this WMIC command was part of a chain of events, suggesting malicious intent. This includes correlating with other events around the same timeline.

  - **Assess for signs of persistence mechanisms:** Determine if this service change serves a broader malicious purpose, such as persistence. Look for indicators like scheduled tasks or other modifications made around the same time (Event ID 4697 for service installation).

  ### Prioritization

  This alert holds medium severity as it signifies potential tampering with critical system services that could have operational impacts. The likelihood of malicious abuse is moderate, particularly if paired with other suspicious activities associated with known exploitation techniques. Such alterations can often be a precursor to more severe attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as attackers using alternative tools or methods to change service configurations outside WMIC. An assumption is that all relevant logs (Sysmon, Event IDs) must be correctly collected and configured for reliable detection. Legitimate administrative changes to service configurations may trigger this alert, requiring thorough investigation to rule out false positives. A companion detection that can enhance coverage includes monitoring for unusual Service Control Manager events (Event ID 7045) that indicate unfamiliar services being created or modified.

