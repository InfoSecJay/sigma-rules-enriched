logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' service '
    - 'ChangeStartMode'
    CommandLine|contains:
    - 'Manual'
    - 'Disabled'
  condition: all of selection_*
falsepositives:
- Legitimate administrative changes to service startup types using WMIC, 
  investigate accordingly.
level: medium
