level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of an obfuscated PowerShell one-liner designed to download and execute remote PowerShell scripts or modules in memory. The likely attacker objective is to execute malicious scripts without writing files to disk, evading detection mechanisms. This behavior aligns with the MITRE ATT&CK technique for PowerShell (T1059.001) and defense evasion via obfuscated commands (T1562.001). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to compromise and exploitation of the host via remote payload execution. This detection does NOT confirm malicious intent on its own, as legitimate PowerShell scripting could also trigger it.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for `powershell.exe` execution timestamps, command line arguments, and parent process IDs. Watch for commands similar to the detection string containing obfuscation or remote URLs—these are high-confidence indicators of malicious activity.

  - **Analyze command line arguments:** Investigate specific parts of the command line for signs of obfuscation or suspicious patterns. Legitimate usage often involves clear and straightforward commands, while malicious executions frequently include encoded strings or typical PowerShell obfuscation techniques (e.g., substrings, escaping characters).

  - **Review network connections:** Correlate extracted URLs from event logs with network logs (like firewall or proxy logs) to determine if the PowerShell command attempted to download external content. Check for connections to unexpected URLs or IP addresses.

  - **Identify parent processes:** Evaluate the parent process of the PowerShell execution. Legitimate executables such as task schedulers or scripts from trusted applications generally precede benign PowerShell executions. Suspicious parents may indicate a potential compromise.

  - **Validate loaded modules:** If the command indicates the import of specific PowerShell modules (like `Invoke-WMIExec`), check the file path against enterprise standards. Legitimate modules should originate from authorized repositories or be well-known within your environment.

  ### Prioritization

  This alert is considered high severity due to its potential impact on critical systems and data if an attacker successfully executes a remote payload. The likeliness of this behavior being weaponized is significant, especially in targeted attacks leveraging PowerShell for command and control.

  ### Blind Spots and Assumptions

  Detection may be impeded if logging is not adequately configured or if the PowerShell execution runs in a different context (e.g., via a different process or with altered permissions). Legitimate administrative actions or scripts may inadvertently trigger this alert. Companion detections for PowerShell script block logging (T1059.001) would enhance coverage and provide additional context for potential malicious activity.

