note: |
  ### Technical Context
  This rule detects the execution of a specific obfuscated PowerShell one-liner that is commonly used by attackers to download and execute malicious PowerShell modules directly in memory. These types of scripts can facilitate a variety of malicious activities, including the deployment of malicious payloads or further exploitation of the compromised system. The primary goal of the attacker is to stealthily execute commands while evading detection by traditional security measures.

  The relevant MITRE ATT&CK tactics for this behavior include **Execution (T1059.001)**, which encompasses scripting and command execution via PowerShell, and **Defense Evasion (T1562.001)**, focusing on disabling security features and obfuscating commands to avoid detection. Attackers leveraging this method typically aim to maintain a low profile while executing their commands, making this detection critical for identifying nefarious activity within the environment.

  The best sources of telemetry for evidence related to this detection include **process creation logs** from Windows systems that can provide insights into executed commands and their parameters, which are essential in identifying suspicious script execution patterns.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the Windows process creation logs for instances of `powershell.exe` execution. Focus on the command line arguments, particularly looking for indicators of obfuscation or unusual URLs.

  - **Analyze Network Traffic:** Check the outbound network traffic to detect any calls made to suspicious URLs or IP addresses. Use this to correlate with the execution of obfuscated commands to see if any malicious payloads were downloaded.

  - **Investigate File System Changes:** Look for any newly created or modified files related to the PowerShell one-liner, especially in user profile locations where scripts might be downloaded or executed.

  - **Correlate with User Activity:** Assess the user account associated with the PowerShell execution to verify if the activity aligns with normal behavior patterns. Check for privilege escalations or lateral movements that could indicate further compromise.

  ### Prioritization
  The alert should be treated with high severity due to the significant risk associated with running obfuscated PowerShell scripts. The likelihood of exploitation through such methods is elevated, particularly if the originating commands are tied to known malicious activity.

  ### Blind Spots and Assumptions
  There are notable gaps in detection coverage when dealing with obfuscation techniques, as legitimate PowerShell usage may also exhibit similar command structures. The detection logic assumes that the malicious one-liner will execute exactly as specified, which may not be the case if attackers modify their scripts to evade detection. For this alert to function properly, comprehensive logging must be enabled for process creation events, including complete command line arguments, and configurations should ensure that PowerShell script execution policies are in compliance with security best practices.

