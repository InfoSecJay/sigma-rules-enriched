title: Renamed NetSupport RAT Execution
id: 0afbd410-de03-4078-8491-f132303cb67d
status: test
description: Detects the execution of a renamed "client32.exe" (NetSupport RAT) via
  Imphash, Product and OriginalFileName strings
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2024-11-23
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Product|contains: 'NetSupport Remote Control'
  - OriginalFileName|contains: 'client32.exe'
  - Hashes|contains: IMPHASH=A9D50692E95B79723F3E76FCF70D023E
  filter:
    Image|endswith: '\client32.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of a renamed executable associated with the NetSupport Remote Access Trojan (RAT), specifically through the identification of its original product name "NetSupport Remote Control" and filename "client32.exe." Attackers frequently employ such tactics to obfuscate malware operations, renaming known malicious executables to blend into legitimate activity on the system. The threat scenario typically involves unauthorized remote access, data exfiltration, or lateral movement within corporate networks.

  The rule aligns with the MITRE ATT&CK framework under the following tactics and techniques:
  - **Defense Evasion** (T1070): The malware seeks to evade detection mechanisms by presenting itself as a benign application.
  - **Remote Access Tools** (T1219): Involves the use of managed or remote software to control systems from a distance, often without detection.

  The primary data sources that will provide evidence of this activity include:
  - **Process creation events** from endpoint logging solutions (e.g., EDR).
  - **File execution logs** or PowerShell command logs that capture invocation of executables.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check process creation logs for entries corresponding to the execution of `client32.exe` or the product name, particularly those logged at unusual times or under suspicious user accounts.
  - **Examine File Properties**: Analyze any instances of `client32.exe` to confirm if the product name or original file name matches the known attributes of NetSupport RAT, including the imphash for further validation of the file's authenticity.
  - **Monitor Network Activity**: Look for unusual outbound network connections originating from the host executing the suspected rat, particularly to known malicious IPs or domains typically used by remote access tools.
  - **Investigate User Accounts**: Check for any anomalous or unauthorized account activities associated with the process creation, including any lateral movement attempts or increased privilege escalations.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of unauthorized remote access on sensitive corporate data and the likelihood of exploitation by threat actors using RATs for malicious purposes.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if logging for process creation events is not enabled on endpoints or if there are monitoring lapses in network traffic. The detection logic assumes that the imphash and file properties will remain consistent and recognizable, which may not hold true if the malware is modified or resides in a heavily obfuscated state. Proper configurations must be ensured within endpoint detection mechanisms to effectively capture and log the necessary information for this alert to trigger accurately.

