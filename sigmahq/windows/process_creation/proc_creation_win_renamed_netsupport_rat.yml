note: |
  ### Technical Context

  This Sigma rule detects the execution of the NetSupport Remote Access Tool (RAT) disguised as "client32.exe," a common tactic used by attackers for remote access to compromised machines. The likely attacker objective is to gain unauthorized control over a target system to exfiltrate data, deploy additional malware, or perform lateral movement within the network. This behavior maps to the MITRE ATT&CK tactic of **Initial Access (TA0001)** through the technique **Remote Access Software (T1096)**.

  Primary telemetry sources include process creation logs from the Windows Security Event ID **4688**, which capture the execution of processes. The security impact is significant, as the malicious use of a RAT can lead to severe data breaches or network compromise. It is essential to note that this detection does NOT confirm that the identified process is malicious without further investigation, as legitimate software could also exhibit similar characteristics.

  ### Investigation Steps

  - **Review Process Creation Logs:** Investigate Windows Security Event ID **4688** for the process creation event linked to "client32.exe" and check the associated **Image** and **CommandLine** fields for abnormal parameters or paths.

  - **Check for Parent-Child Relationship:** Identify the parent process for "client32.exe" by reviewing Event ID **4688**. A legitimate parent process (e.g., a known management application) may indicate benign activity, while execution from an unexpected parent (e.g., a non-administrative tool) raises suspicion.

  - **Analyze Imphash and File Properties:** Confirm the **Imphash** and file properties in process logs contain values like **Product: 'NetSupport Remote Control'** and **OriginalFileName: 'client32.exe'**. Any deviations from recognized values can signify malicious alteration or renaming.

  - **Check Network Connections:** Use network monitoring tools or logs (e.g., Windows Firewall logs) to review outbound connections made by the process. Look for suspicious IP addresses or domains that do not align with expected organizational traffic patterns.

  - **Validate File Paths and Creation:** Investigate the file system for the presence of **client32.exe** in unexpected directories. It should typically reside in the application installation folder. Create file monitoring alerts for its creation or modification events, indicating potential malicious activity.

  ### Prioritization

  This alert should be prioritized as high severity due to the critical impact of a RAT on the affected system, given it can provide attackers with persistent access to sensitive data. The likelihood of exploitation is significant, as remote access tools are commonly weaponized in various attacks, including ransomware and data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by attackers using legitimate software disguises or custom RAT implementations. Reliable detection relies on the configuration of security event logging (specifically, process creation events). Legitimate administrative activities, such as IT support using NetSupport for remote assistance, may trigger the alert. Additionally, a related detection for other known remote access tools can strengthen coverage, improving the chances of identifying diverse adversary tactics.

