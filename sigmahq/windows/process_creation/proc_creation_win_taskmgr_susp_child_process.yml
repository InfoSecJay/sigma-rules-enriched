detection:
  selection:
    ParentImage|endswith: '\taskmgr.exe'
  filter_main_generic:
    Image|endswith:
    - ':\Windows\System32\mmc.exe'
    - ':\Windows\System32\resmon.exe'
    - ':\Windows\System32\Taskmgr.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrative activity
level: low
note: |
  ### Technical Context

  This rule detects the creation of a new process initiated through `taskmgr.exe`, which is commonly used in Windows environments to manage running applications. The detection indicates a potential attempt by an adversary to circumvent User Account Control (UAC) by spawning a process through a legitimate Windows utility. This behavior aligns with the MITRE ATT&CK technique T1036 (Masquerading), where malicious actors may exploit trusted processes to evade detection.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the creation of a process through `taskmgr.exe` is malicious, it could result in unauthorized application execution, potentially leading to data exfiltration or system compromise. However, this detection alone does not confirm malicious intent, as there may be legitimate administrative activities that also trigger the alert.

  ### Investigation Steps

  - **Review process creation log entries**: Check Security Event ID 4688 and Sysmon Event ID 1. Look for `taskmgr.exe` as the ParentImage and verify the initiated process image. Ensure the child process is a non-standard executable to indicate potential malicious activity.

  - **Identify the user context**: Determine the user account under which the `taskmgr.exe` was executed. Look for any anomalous user behavior or if the user belongs to administrative roles, which can help discern between benign administrative activity and a potential attack.

  - **Assess the child process**: Inspect the child process created by `taskmgr.exe` for known malicious indicators, such as unusual paths or behaviors typical of malware (e.g., connecting to external IPs). Look for any file paths that deviate from typical locations, such as temporary folders.

  - **Investigate timing and system activity**: Analyze logs around the time the process was created (e.g., Event ID 4624 for logon events) to identify any unusual patterns or correlating events, such as account privilege escalations or other acts that may indicate a successful compromise.

  - **Check for legitimate task manager use**: Validate any expected usage of `taskmgr.exe` by assessing recent administrative actions that align with business functions. Compare against known scheduled tasks or system maintenance to separate behavior reflecting normal operations.

  ### Prioritization

  This alert has low severity in an enterprise context due to its potential for false positives from legitimate administrative activities. However, the likelihood of malicious abuse exists, particularly if it is triggered in environments where users don’t typically run process managers. It is essential to consider additional context before concluding the activity is malicious.

  ### Blind Spots and Assumptions

  This detection may miss attempts to mask malicious behavior by using different methods of process creation not involving `taskmgr.exe`. Reliable detection requires proper logging configurations including Sysmon for detailed process creation telemetry. Legitimate administrative uses, such as troubleshooting or system maintenance, may trigger the alert regularly. A companion detection to reinforce coverage would be monitoring for unauthorized administrative privileges being granted or misused (MITRE ATT&CK ID T1078: Valid Accounts).

