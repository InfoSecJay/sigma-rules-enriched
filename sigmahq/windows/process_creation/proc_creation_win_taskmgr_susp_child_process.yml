note: |
  ### Technical Context

  This Sigma rule detects the creation of a process via the Windows Task Manager (taskmgr.exe), specifically identifying instances where a new process is spawned with taskmgr.exe as its parent. This behavior is often associated with attempts to manipulate system processes or execute commands while circumventing User Account Control (UAC). The relevant MITRE ATT&CK tactic is “Defense Evasion” (TA0005), specifically technique “Process Injection” (T1036). Primary telemetry sources include Windows Security Event ID 4688 (process creation events) and Sysmon Event ID 1, capturing process creation details.

  If the detected behavior is malicious, it could indicate an adversary working to elevate privileges or execute harmful tasks in a stealthy manner. However, it's crucial to note that this detection does NOT confirm malicious intent by itself, as similar behavior may arise during legitimate administrative activities.

  ### Investigation Steps

  - **Review the process creation event:** Check Windows Security Event ID 4688 for the event where taskmgr.exe is the parent process. Confirm the spawned process name and path for any indicators of suspicious behavior.

  - **Correlate with Sysmon data:** Examine Sysmon Event ID 1 for the creation of any child processes. Investigate command line arguments for anomalies that deviate from standard administrative tasks.

  - **Identify legitimate administrative usage:** Determine if the use of taskmgr.exe is consistent with expected behavior on the affected system. Validate recent authorized administrative activities that may involve this tool.

  - **Check for unusual parent-child relationships:** Look for instances where processes are created via taskmgr.exe leading to known malware or unexpected executables—highlighting a potential malicious workflow.

  - **Assess system criticality:** Evaluate the role and criticality of the affected host. Sensitive systems or those handling critical data should warrant higher scrutiny due to potential impact.

  - **Verify file creation or modification:** Look at file system changes around the process creation timestamps (e.g., created or modified timestamps on executables), particularly any unusual files located in temp directories or application data paths.

  ### Prioritization

  The alert should be considered low severity in an enterprise context, primarily due to the potential for benign administrative activities triggering it. However, the possibility of weaponized behavior to bypass UAC necessitates review, especially on more sensitive systems.

  ### Blind Spots and Assumptions

  This detection may miss cases where an attacker uses legitimate tools without taskmgr.exe or utilizes techniques to obfuscate their activity (e.g., using PowerShell). Reliable detection requires proper auditing configurations for Windows Event logs, including process creation logging. Legitimate administrative actions often generate similar alerts, so context is essential. Complement this detection with monitoring for abnormal command line activities or process spawning from unusual parent processes to strengthen coverage against sophisticated evasion tactics.

