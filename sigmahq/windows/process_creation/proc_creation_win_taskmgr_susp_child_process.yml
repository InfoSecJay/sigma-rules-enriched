title: New Process Created Via Taskmgr.EXE
id: 3d7679bd-0c00-440c-97b0-3f204273e6c7
status: test
description: Detects the creation of a process via the Windows task manager. This
  might be an attempt to bypass UAC
references:
- https://twitter.com/ReneFreingruber/status/1172244989335810049
author: Florian Roth (Nextron Systems)
date: 2018-03-13
modified: 2024-01-18
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\taskmgr.exe'
  filter_main_generic:
    Image|endswith:
    - ':\Windows\System32\mmc.exe'
    - ':\Windows\System32\resmon.exe'
    - ':\Windows\System32\Taskmgr.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrative activity
level: low
note: |
  ### Technical Context
  This rule detects the creation of a new process initiated by the Windows Task Manager (`taskmgr.exe`), which could indicate an attempt to circumvent User Account Control (UAC) mechanisms on a Windows system. Attackers may use this method to gain elevated privileges or execute malicious payloads without triggering typical security alerts. The threat scenario often involves adversaries looking to create persistence in a compromised environment or escalate privileges by launching trusted applications that facilitate their objectives.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1203)**: The usage of legitimate applications to bypass security controls.
  - **Process Injection (T1055)**: While it directly relates to manipulating processes, it plays into the overall theme of process creation as a method of disguise.

  Primary data sources for this detection include:
  - Process creation logs from Windows Event Log (Event ID 4688) that track the execution of programs, particularly those initiated by `taskmgr.exe` and any resultant child processes that may be created.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for processes created by `taskmgr.exe` to identify the exact command line used, noting any unusual flags or arguments that could indicate malicious intent.
  - **Analyze Parent-Child Process Relationships**: Check the hierarchy of processes to identify if any unusual or unexpected child processes were spawned, and investigate their behavior and legitimacy.
  - **Inspect for UAC Bypass Techniques**: Look for indicators of UAC bypass, focusing on the context in which `taskmgr.exe` was launched and whether it aligns with typical admin tasks or presents anomalies.
  - **Correlate with Other Security Logs**: Cross-reference findings with other security logs, such as antivirus detections or endpoint threat reports, to see if there are correlated activities indicating a broader attack.

  ### Prioritization
  This alert is assigned a low severity due to the potential for false positives arising from legitimate administrative activities. However, it is crucial to assess the context of each case, as unauthorized use of `taskmgr.exe` could facilitate critical attacks if left unchecked.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the reliance on `taskmgr.exe` as an indicator; attackers may use other tools or scripts to achieve similar outcomes. The detection logic assumes that `taskmgr.exe` is not typically used in the environment for legitimate tasks; thus, false positives are expected when it is utilized for standard administrative duties. Additionally, logs from process creation and the configurations to capture these logs must be enabled; without these, the rule will not function effectively.

