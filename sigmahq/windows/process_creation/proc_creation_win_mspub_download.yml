detection:
  selection_img:
  - Image|endswith: '\MSPUB.exe'
  - OriginalFileName: 'MSPUB.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of Microsoft Publisher (MSPUB.EXE) to execute commands that download arbitrary files from the internet via protocols such as FTP, HTTP, or HTTPS. The utilization of legitimate applications for malicious purposes is a common tactic used by attackers to bypass security measures, potentially leading to the download of payloads like malware or exfiltrated data. Attackers may leverage MSPUB.EXE due to its trusted status, aiming to exploit users' trust in Microsoft Office applications.

  The rule aligns with the MITRE ATT&CK framework, specifically targeting the tactics of **Execution** (T1203) and **Defense Evasion** (T1218), as it employs a benign application to conduct potentially malicious activities. The primary source of telemetry for this detection is process creation events that provide visibility into which applications are being executed, along with their command-line arguments, allowing analysts to trace unauthorized use of MSPUB.EXE.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs where MSPUB.EXE is invoked, focusing on command-line arguments to identify the presence of URL patterns indicative of file downloads.
  - **Analyze Network Traffic**: Inspect outbound traffic logs for connections initiated by the host running MSPUB.EXE, particularly for suspicious downloads from known malicious domains or IP addresses.
  - **Correlate with User Behavior**: Check user activity logs to determine whether the timing and method of MSPUB.EXE execution align with users' normal behavior patterns, observing for anomalous activity that might indicate a compromised account.
  - **Validate File Integrity**: If a file download is identified, validate the file's authenticity by checking its reputation against threat intelligence sources to assess whether it poses a risk.

  ### Prioritization
  This alert is assigned a medium severity due to the potential impact on the organization if malicious software is downloaded, coupled with the likelihood of encountering similar tactics as attackers frequently use trusted applications to evade detection in enterprise environments.

  ### Blind Spots and Assumptions
  One potential gap in this detection rule is that it may not capture scenarios where MSPUB.EXE is legitimately used for file downloads, leading to false positives. The detection logic assumes that any use of proper URLs in conjunction with MSPUB.EXE is suspect without considering possible legitimate cases. Successful detection is contingent on the availability of comprehensive process creation logs and their retention, as inconsistencies in logging configuration may prevent accurate detection of this tactic.

