note: |
  ### Technical Context

  This Sigma rule detects the execution of Microsoft Publisher (MSPUB.EXE) with command lines indicative of arbitrary file downloads (using protocols such as FTP or HTTP/S). The behavior suggests an attacker attempting to leverage a commonly trusted application to download potentially malicious or unauthorized files, possibly for data exfiltration or malware introduction.

  This relates to the MITRE ATT&CK framework under the Execution tactic, specifically T1218 (Signed Binary Proxy Execution). The primary telemetry source for detection is Windows process creation logs, specifically monitoring Event ID 4688 for process creation and the associated command line arguments. If the detected behavior is indeed malicious, the impact could range from data breaches to the establishment of persistence through later stages of an attack.

  This detection does NOT confirm malicious intent on its own; legitimate use of MSPUB.EXE may also involve downloading files for benign purposes.

  ### Investigation Steps

  - **Check process execution details:** Inspect Windows Security Event ID 4688 for the creation of `MSPUB.EXE`. Look for fields like `NewProcessName` and `CommandLine` to confirm execution context.

  - **Review command line usage:** Assess any command line text referencing `ftp://`, `http://`, or `https://`. Malicious downloads typically contain suspicious URL patterns, while benign actions may involve standard document retrieval for legitimate business purposes.

  - **Correlate with user behavior:** Verify the user associated with the process execution against recent email or document access patterns. Legitimate use may reflect standard business processes, while deviations may indicate potential compromise.

  - **Examine network activity:** Investigate the network logs for outbound connections tied to the corresponding UserID or machine. Check for suspicious destination IP addresses or unusual data transfer sizes, which could indicate file exfiltration attempts.

  - **Assess file downloads:** If files were downloaded, validate their presence by checking for recently modified files in temporary directories or the default download location. Use file properties to determine file types and origins.

  - **Utilize asset criticality data:** Prioritize investigation for downloads occurring on critical servers or workstations (e.g., domain controllers, finance workstations) that could amplify an attacker's success.

  ### Prioritization

  The alert's severity is rated medium given that while the potential impact on critical systems can be significant, this technique is also commonly used by both attackers and skilled professionals during legitimate tasks. Thus, the likelihood of malicious abuse is heightened but should be contextualized in relation to the user and system involved.

  ### Blind Spots and Assumptions

  This detection can be evaded by attackers using alternate tools or commands that do not involve `MSPUB.EXE`. Additionally, systems must properly log Windows Event IDs associated with process creation to ensure detection reliability. Legitimate software updates or operational downloads may trigger similar alerts inadvertently. A related detection to consider strengthening coverage includes monitoring unusual outbound HTTP/S connections for other applications (e.g., web browsers) that may also be utilized to download files.

