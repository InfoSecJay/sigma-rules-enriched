title: Suspicious Child Process of Notepad++ Updater - GUP.Exe
id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
status: experimental
description: |
  Detects suspicious child process creation by the Notepad++ updater process (gup.exe).
  This could indicate potential exploitation of the updater component to deliver unwanted malware.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-03
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\gup.exe'
  selection_child_img:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\mshta.exe'
  selection_child_cli:
    CommandLine|contains:
    - 'bitsadmin'
    - 'certutil'
    - 'curl'
    - 'finger'
    - 'forfiles'
    - 'regsvr32'
    - 'rundll32'
    - 'wget'
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious child processes initiated by the Notepad++ updater (gup.exe), which is commonly used for updating the Notepad++ application. Attackers may exploit this updater process to deliver unwanted malware or execute arbitrary commands on the system, making it a critical vector for initial access or credential harvesting. The suspicious nature of child processes like `cmd.exe`, `powershell.exe`, or tools like `bitsadmin` indicates potential misuse for lateral movement, command and control, or other malicious activities.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include Initial Access (T1195.002) through exploitation of third-party software, and Credential Access (T1557) if the malware aims to harvest credentials or facilitate further compromise through elevated privileges. The primary data sources for this detection include process creation logs that capture information about parent and child processes, which are pivotal in identifying unusual execution patterns.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs to identify instances of `gup.exe` spawning suspicious child processes, specifically looking for `cmd.exe`, `powershell.exe`, or similar executables with non-standard command-line arguments.

  - **Inspect Command-Line Arguments**: For all instances where `gup.exe` is the parent process, scrutinize the command-line arguments of the child processes. Look for the presence of known malicious patterns, such as `bitsadmin`, `curl`, or `wget`, which could indicate attempts to download additional payloads.

  - **Correlate with Threat Intelligence**: Cross-reference any observed behaviors or indicators with the threat intelligence reports and articles referencing Notepad++ updater abuse to enhance context and validate the legitimacy of the observed process behavior.

  - **Evaluate System Integrity**: Conduct a thorough examination of the affected system for any signs of compromise, such as persistence mechanisms or other indicators of malware presence, given that exploitation of the updater might lead to further malicious activities.

  ### Prioritization
  This alert is categorized as high severity due to the potential consequences of successful exploitation via the Notepad++ updater. The misuse of trusted applications for malicious purposes significantly heightens the risk of unauthorized data access and system compromise within an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic primarily relies on the assumption that the Notepad++ updater will always follow the standard behavior of spawning well-known child processes. There may be gaps in detection if custom or obfuscated versions of child executables are utilized by the attacker to evade detection. Additionally, this rule depends on the availability of process creation logs, and if such logs are not retained or insufficiently configured, this detection may fail to trigger appropriately.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
