title: Suspicious Child Process of Notepad++ Updater - GUP.Exe
id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
status: experimental
description: |
  Detects suspicious child process creation by the Notepad++ updater process (gup.exe).
  This could indicate potential exploitation of the updater component to deliver unwanted malware.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-03
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\gup.exe'
  selection_child_img:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\mshta.exe'
  selection_child_cli:
    CommandLine|contains:
    - 'bitsadmin'
    - 'certutil'
    - 'curl'
    - 'finger'
    - 'forfiles'
    - 'regsvr32'
    - 'rundll32'
    - 'wget'
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes by `gup.exe`, the Notepad++ updater. Attackers may exploit the updater to execute malicious commands or download additional malware, which can compromise system integrity. This behavior fits within the initial access and credential access MITRE ATT&CK tactics, specifically highlighting techniques such as T1195.002 (Supply Chain Compromise) and T1557 (Adversary-in-the-Middle).

  The primary telemetry sourced for this detection is process creation logs, particularly Windows Security Event ID 4688 and Sysmon Event ID 1, capturing the creation of processes and their parent-child relationships. The security impact is significant as it may indicate unauthorized software installations or code execution on a target machine. However, this detection does NOT confirm that the updater itself is malicious, rather it indicates potentially nefarious activity associated with its execution.

  ### Investigation Steps

  - **Identify parent process details:** Check for Event ID 4688 or Sysmon Event ID 1 for `gup.exe`. Document its properties, including timestamps and user accounts involved. Ensure the path is legitimate (`C:\Program Files\Notepad++\gup.exe`).

  - **Analyze child process execution:** Look for child processes created by `gup.exe`. Specifically, review if any child processes like `powershell.exe` or `cmd.exe` were invoked. Noted command lines should include suspicious commands such as `certutil`, `bitsadmin`, or `wget`, indicating potential malicious activity.

  - **Compare against normal behavior:** Review processes started by `gup.exe` on non-flagged systems for comparative analysis. There should be minimal child process activity and focus on updater-related functions, such as checking for software updates.

  - **Check for indicators of compromise (IoCs):** Analyze for command-line arguments in child processes that suggest data exfiltration or system manipulation. For example, `bitsadmin` used with external URLs could indicate file download attempts by threat actors.

  - **Assess impacted systems' roles:** Determine the role and criticality of the system where the alert was generated. If it is a domain controller or a critical infrastructure host, escalate investigation rapidly.

  - **Collect additional context if necessary:** If malicious activity is suspected, gather process memory snapshots or perform a forensic analysis to track other indicators, such as unusual file creation or network connections, especially those involving `curl` or `wget`.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact if the Notepad++ updater is compromised. The likelihood of malicious exploitation is concerning given documented cases of supply chain attacks targeting similar software. Such behaviors can be indicative of advanced persistent threats or targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the `gup.exe` process is replaced or modified by a legitimate update, rendering the detection ineffective. Additionally, processes that spawn from `gup.exe` may employ hiding techniques, such as running in stealth modes or using unsigned binaries to evade detection. Legitimate updates executed in the context of users can trigger these alerts, thus requiring context for accurate assessment. Related detections, such as monitoring the use of command-line utilities like `curl` and `wget`, can enhance visibility into suspicious behavior linked to potential data exfiltration or download attempts.

