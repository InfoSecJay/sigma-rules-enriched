title: Uncommon Link.EXE Parent Process
id: 6e968eb1-5f05-4dac-94e9-fd0c5cb49fd6
status: test
description: |
  Detects an uncommon parent process of "LINK.EXE".
  Link.EXE in Microsoft incremental linker. Its a utility usually bundled with Visual Studio installation.
  Multiple utilities often found in the same folder (editbin.exe, dumpbin.exe, lib.exe, etc) have a hardcode call to the "LINK.EXE" binary without checking its validity.
  This would allow an attacker to sideload any binary with the name "link.exe" if one of the aforementioned tools get executed from a different location.
  By filtering the known locations of such utilities we can spot uncommon parent process of LINK.EXE that might be suspicious or malicious.
references:
- https://twitter.com/0gtweet/status/1560732860935729152
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-22
modified: 2024-06-27
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\link.exe'
    CommandLine|contains: 'LINK /'     # Hardcoded command line when we call tools like dumpbin.exe, editbin.exe, lib.exe...etc
    # Add other filters for other legitimate locations
  filter_main_visual_studio:
    ParentImage|startswith:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    ParentImage|contains:
    - '\VC\bin\'
    - '\VC\Tools\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances of LINK.EXE being spawned from uncommon or unexpected parent processes, which may indicate malicious activity. Typically, LINK.EXE is a legitimate utility associated with Microsoft Visual Studio used for linking program components during compilation. An attacker might leverage this process to execute malicious payloads disguised as legitimate tools.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **T1218 (Signed Binary Proxy Execution)**. The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized code execution and potential compromise of the system. Importantly, this detection does NOT confirm whether the behavior is indeed malicious without further context and investigation.

  ### Investigation Steps

  - **Verify the parent process details:** Check Security Event ID 4688 or Sysmon Event ID 1 for the full command line and parent process name associated with LINK.EXE to establish context for the execution. Legitimate instances should originate from Visual Studio-related directories.

  - **Identify uncommon parent processes:** Look for LINK.EXE being executed with uncommon parent processes that do not match known Visual Studio paths. This raises a red flag for potential abuse.

  - **Review command line arguments:** Analyze the CommandLine field for suspicious usage patterns. Legitimate commands will typically follow established formats, unlike potentially malicious variations that may use obscure flags or additional arguments.

  - **Assess the execution context:** Determine if LINK.EXE is running under an admin or privileged context, as this increases the risk associated with an attack.

  - **Correlate timestamps with other alerts:** Cross-reference the execution time of LINK.EXE with other security alerts or abnormal activities in system logs that may indicate an ongoing attack or compromise, particularly in critical assets.

  - **Monitor network activity:** If possible, analyze any outbound connections post-execution of LINK.EXE. Suspicious network behavior, such as connections to known malicious domains, could indicate an active compromise.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for malicious actors to exploit LINK.EXE for executing unauthorized code. The unusual parent processes suggest an increased likelihood of abuse. While the infrastructure is commonly used for development, similar behaviors have been weaponized in past attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate development tools are executed from unexpected locations not included in the filter. Successful detection relies on the presence of appropriate Windows auditing settings for process creations. Additionally, benign situations may trigger this alert if developers run Visual Studio tools from non-standard directories. A related detection could involve monitoring for unusual command line arguments in other compilation tools (e.g., EDITBIN, DUMPBIN), strengthening coverage against similar abuse techniques.

