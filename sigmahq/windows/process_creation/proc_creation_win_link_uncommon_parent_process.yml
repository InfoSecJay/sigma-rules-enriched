title: Uncommon Link.EXE Parent Process
id: 6e968eb1-5f05-4dac-94e9-fd0c5cb49fd6
status: test
description: |
  Detects an uncommon parent process of "LINK.EXE".
  Link.EXE in Microsoft incremental linker. Its a utility usually bundled with Visual Studio installation.
  Multiple utilities often found in the same folder (editbin.exe, dumpbin.exe, lib.exe, etc) have a hardcode call to the "LINK.EXE" binary without checking its validity.
  This would allow an attacker to sideload any binary with the name "link.exe" if one of the aforementioned tools get executed from a different location.
  By filtering the known locations of such utilities we can spot uncommon parent process of LINK.EXE that might be suspicious or malicious.
references:
- https://twitter.com/0gtweet/status/1560732860935729152
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-22
modified: 2024-06-27
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\link.exe'
    CommandLine|contains: 'LINK /'     # Hardcoded command line when we call tools like dumpbin.exe, editbin.exe, lib.exe...etc
    # Add other filters for other legitimate locations
  filter_main_visual_studio:
    ParentImage|startswith:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    ParentImage|contains:
    - '\VC\bin\'
    - '\VC\Tools\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of **LINK.EXE** being executed with an uncommon parent process. LINK.EXE is a component of Microsoft Visual Studio, primarily used as an incremental linker, and is typically called by other legitimate development tools like **editbin.exe** and **lib.exe**. However, due to its nature, if executed from a non-standard parent process, it may indicate suspicious activity, such as potential sideloading of malicious binaries disguised as LINK.EXE.

  Attackers might exploit this behavior as part of a broader attack strategy. By executing LINK.EXE from inappropriate locations, they can sidestep security measures and execute malicious payloads under the guise of a legitimate process. This tactic could facilitate the deployment of various types of malware while maintaining a lower profile to evade detection by security teams.

  The applicable MITRE ATT&CK tactics and techniques for this detection rule include **Defense Evasion (T1203)** and **Application Layer Protocol (T1218)**, where the attacker attempts to evade defenses by leveraging legitimate software processes for malicious activities. The primary data sources for this detection will be **process creation events** on Windows, providing visibility into the creation of new processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the logs for any instances of LINK.EXE executed from uncommon parent processes that do not align with known legitimate Visual Studio tools or locations.
  - **Analyze Command Line Arguments:** Investigate the command line used when LINK.EXE was invoked to identify any suspicious flags or parameters that could indicate malicious intent.
  - **Cross-Reference Known Tools:** Compare the parent process paths against a list of known legitimate development tool paths to confirm whether the execution context is suspicious.
  - **Investigate File Locations:** Examine the file path of LINK.EXE and ensure it matches expected installation directories for Visual Studio, as deviations may suggest tampering or a different threat.

  ### Prioritization
  The alert's severity is considered **medium** in an enterprise environment due to the potential for defense evasion and malware execution. While not every uncommon parent process indicates malicious activity, the risk posed by attackers leveraging legitimate tools to execute harmful payloads warrants further investigation.

  ### Blind Spots and Assumptions
  This detection may miss instances where operations appear legitimate due to the use of authorized parent processes that haven't been captured in the filtering logic. It assumes that the user environment relies on the standard installation paths for development tools and that deviations from this practice are inherently suspicious. Necessary configurations include ensuring that process creation logging is enabled and comprehensive, particularly in environments that utilize Visual Studio and its tools, to facilitate effective detection and investigation.

