title: Uncommon Link.EXE Parent Process
id: 6e968eb1-5f05-4dac-94e9-fd0c5cb49fd6
status: test
description: |
  Detects an uncommon parent process of "LINK.EXE".
  Link.EXE in Microsoft incremental linker. Its a utility usually bundled with Visual Studio installation.
  Multiple utilities often found in the same folder (editbin.exe, dumpbin.exe, lib.exe, etc) have a hardcode call to the "LINK.EXE" binary without checking its validity.
  This would allow an attacker to sideload any binary with the name "link.exe" if one of the aforementioned tools get executed from a different location.
  By filtering the known locations of such utilities we can spot uncommon parent process of LINK.EXE that might be suspicious or malicious.
references:
- https://twitter.com/0gtweet/status/1560732860935729152
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-22
modified: 2024-06-27
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\link.exe'
    CommandLine|contains: 'LINK /'     # Hardcoded command line when we call tools like dumpbin.exe, editbin.exe, lib.exe...etc
    # Add other filters for other legitimate locations
  filter_main_visual_studio:
    ParentImage|startswith:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - 'C:\Program Files (x86)\Microsoft Visual Studio\'
    ParentImage|contains:
    - '\VC\bin\'
    - '\VC\Tools\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unusual parent processes that spawn "LINK.EXE", a legitimate Microsoft utility primarily associated with Visual Studio's incremental linker. Attackers may leverage similar-named binaries or exploit tools like "editbin.exe" to execute malicious payloads masquerading as the legitimate LINK.EXE, thereby achieving malicious objectives like code execution or persistence. The relevant MITRE ATT&CK technique is "Sideloading" (T1218), which involves executing a malicious DLL or binary using a trusted executable.

  Primary telemetry sources include process creation logs, particularly Windows Security Event ID 4688, which captures process creation events along with command line arguments. If this behavior is malicious, it can allow an attacker to execute arbitrary code within the context of trusted processes, leading to potential unauthorized access or disruption. Importantly, this detection does NOT confirm malicious intent or execution; further investigation is necessary to determine the context of the process creation.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 for instances where "LINK.EXE" is executed. Pay attention to the "ParentImage" field to assess the legitimacy of the spawning process.

  - **Correlate parent process details:** Examine the "ParentImage" field for common Visual Studio paths (e.g., `C:\Program Files\Microsoft Visual Studio\` or `C:\Program Files (x86)\Microsoft Visual Studio\`). Legitimate instances will originate from these directories.

  - **Analyze command line arguments:** Inspect the "CommandLine" field for the presence of `LINK /` commands. Malicious activities often use unusual or unexpected call patterns that deviate from the typical usage of LINK.EXE.

  - **Identify high-confidence indicators:** Look for instances where "LINK.EXE" is spawned from non-standard parent processes or unusual file paths that do not correspond with documented Visual Studio utilities.

  - **Consider asset criticality:** Evaluate the role of the host where the event is logged. If it is a server or critical infrastructure, prioritize further analysis due to potential higher impact.

  ### Prioritization

  The alert is classified as medium severity due to the potential for malicious process execution, especially in high-risk environments like application servers or development environments. While this behavior could be abused by attackers for code execution, it may also stem from legitimate development activities within Visual Studio, necessitating proper contextual evaluation.

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for attackers to disguise malicious processes as legitimate ones using similar naming conventions. For reliable detection, ensure that process creation logs are enabled and properly filtered. Legitimate administrative activities, such as tool usage during development, may falsely trigger the alert. A related detection to bolster coverage would be monitoring attempts to load unauthorized DLLs via legitimate executables, which also addresses the side-loading technique (e.g., `Windows Event ID 5145` for file system access logs).

