title: Remote Access Tool - AnyDesk Execution With Known Revoked Signing Certificate
id: 41f407b5-3096-44ea-a74f-96d04fbc41be
status: test
description: |
  Detects the execution of an AnyDesk binary with a version prior to 8.0.8.
  Prior to version 8.0.8, the Anydesk application used a signing certificate that got compromised by threat actors.
  Use this rule to detect instances of older versions of Anydesk using the compromised certificate
  This is recommended in order to avoid attackers leveraging the certificate and signing their binaries to bypass detections.
references:
- https://www.bleepingcomputer.com/news/security/anydesk-says-hackers-breached-its-production-servers-reset-passwords/
- https://anydesk.com/en/changelog/windows
author: Sai Prashanth Pulisetti, Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-08
tags:
- attack.execution
- attack.initial-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\AnyDesk.exe'
  - Description: 'AnyDesk'
  - Product: 'AnyDesk'
  - Company: 'AnyDesk Software GmbH'
  selection_version:
    FileVersion|startswith:
    - '7.0.'
    - '7.1.'
    - '8.0.1'
    - '8.0.2'
    - '8.0.3'
    - '8.0.4'
    - '8.0.5'
    - '8.0.6'
    - '8.0.7'
  filter_main_uninstall:
    CommandLine|contains:
    - ' --remove'
    - ' --uninstall'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of AnyDesk binaries that are known to be vulnerable due to the use of a revoked signing certificate. Specifically, it targets AnyDesk versions prior to 8.0.8, which have been compromised, allowing threat actors to use these old versions to bypass security measures. Attackers may leverage this vulnerability to establish remote access in an enterprise environment, with the aim of conducting unauthorized activities such as data exfiltration or reconnaissance.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: Attackers often seek to gain entry by exploiting compromised software.
  - **Execution (TA0002)**: Utilizing malicious software like AnyDesk for executing malicious activities on compromised systems.

  Primary data sources for this detection are Windows process creation logs, which capture events surrounding the execution of applications, alongside file version information that can reveal the implementations being used.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate process creation events to identify executions of AnyDesk.exe. Pay specific attention to entries that indicate the use of compromised older version binaries.
  - **Analyze File Version Information:** Cross-check the file version of AnyDesk against known vulnerable versions (7.0.* to 8.0.7) to confirm if any detected instances fall within the flagged range.
  - **Inspect Command Line Arguments:** Look for suspicious command line parameters, particularly those that include '--remove' or '--uninstall,' which could indicate attempts to manipulate or obscure the execution of the application.
  - **Monitor Network Traffic:** Observe outbound connections initiated by AnyDesk to detect any unusual or unauthorized remote access activities that may be indicative of a compromised system.

  ### Prioritization
  The severity of this alert is considered medium due to the potential threat of unauthorized remote access associated with the execution of compromised software. The likelihood of exploitation is heightened in environments where outdated software persists, making swift remediation necessary.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if the compromised version of AnyDesk does not exhibit the exact signatures defined in the detection logic, or if attackers deploy modified executables that evade standard process creation logs. Additionally, the accuracy of detection assumes that logging for process creation is enabled and correctly configured. If logging is disabled or misconfigured, the rule may not function as intended, potentially allowing malicious activity to go unnoticed.

