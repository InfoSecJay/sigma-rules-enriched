title: Remote Access Tool - AnyDesk Execution With Known Revoked Signing 
  Certificate
id: 41f407b5-3096-44ea-a74f-96d04fbc41be
status: test
description: |
  Detects the execution of an AnyDesk binary with a version prior to 8.0.8.
  Prior to version 8.0.8, the Anydesk application used a signing certificate that got compromised by threat actors.
  Use this rule to detect instances of older versions of Anydesk using the compromised certificate
  This is recommended in order to avoid attackers leveraging the certificate and signing their binaries to bypass detections.
references:
- https://www.bleepingcomputer.com/news/security/anydesk-says-hackers-breached-its-production-servers-reset-passwords/
- https://anydesk.com/en/changelog/windows
author: Sai Prashanth Pulisetti, Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-08
tags:
- attack.execution
- attack.initial-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\AnyDesk.exe'
  - Description: 'AnyDesk'
  - Product: 'AnyDesk'
  - Company: 'AnyDesk Software GmbH'
  selection_version:
    FileVersion|startswith:
    - '7.0.'
    - '7.1.'
    - '8.0.1'
    - '8.0.2'
    - '8.0.3'
    - '8.0.4'
    - '8.0.5'
    - '8.0.6'
    - '8.0.7'
  filter_main_uninstall:
    CommandLine|contains:
    - ' --remove'
    - ' --uninstall'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of AnyDesk binaries with versions prior to 8.0.8, which utilized a compromised signing certificate. Attackers may leverage these older versions to establish unauthorized remote access to systems, facilitating data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactic is **Initial Access** (TA0001) and the technique is **Execution** (T1203). The primary telemetry source is Windows process creation logs (e.g., Event ID 4688) with a focus on the properties of AnyDesk executables. If executed maliciously, it poses a significant security risk due to the potential for unauthorized remote control of systems. This detection alone does not confirm malicious intent; legitimate usage in corporate environments may exist, and further investigation is required.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 to find the creation of `AnyDesk.exe`. Note the timestamp and originating user account. Compare against known user behavior for further context.

  - **Analyze file version:** Confirm the file version of any detected `AnyDesk.exe`. Versions below 8.0.8 are suspect; review the `FileVersion` field to identify if it starts with '7.0.', '7.1.', or '8.0.1' through '8.0.7'.

  - **Evaluate command line arguments:** Inspect the `CommandLine` field in the process creation logs for AnyDesk instances. Legitimate usage may include arguments like `--remove` or `--uninstall`, while the absence of such arguments could indicate potential malicious activity.

  - **Identify user account activity:** Check user account integrity; investigate whether the account triggering the alert has a legitimate need for AnyDesk usage. Verify against the asset role and user activity history.

  - **Correlate with network traffic:** If relevant, analyze network logs for outbound connections initiated by the AnyDesk process. Look for unusual destination IPs or domains that indicate potential data exfiltration.

  - **Validate previous installations:** Review any software inventory logs to ensure legitimate installation of AnyDesk. Confirm if any recent updates to the application have been made that might align with the detection.

  ### Prioritization

  This alert has medium severity due to the balance of potential impact against the role of the affected system within the enterprise. Malicious use of outdated remote access tools is a common tactic among threat actors aiming to exploit known vulnerabilities. Given the history of the AnyDesk compromise, it is essential to investigate the alert promptly.

  ### Blind Spots and Assumptions

  Detection capabilities might be limited if the relevant logs are not collected, like process creation logs or if log retention times are insufficient. Legitimate internal support teams may trigger this alert during routine maintenance. Related detections for other remote access tools (e.g., TeamViewer, LogMeIn) could enhance visibility against potential abuse by attackers leveraging multiple remote access solutions.

