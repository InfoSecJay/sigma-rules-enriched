title: Suspicious Usage of For Loop with Recursive Directory Search in CMD
id: 2782fbd8-b662-4eb5-9962-5bfbfb671e7b
status: experimental
description: |
  Detects suspicious usage of the cmd.exe 'for /f' loop combined with the 'tokens=' parameter and a recursive directory listing.
  This pattern may indicate an attempt to discover and execute system binaries dynamically, for example powershell, a technique sometimes used by attackers to evade detection.
  This behavior has been observed in various malicious lnk files.
references:
- https://www.virustotal.com/gui/file/29837d0d3202758063185828c8f8d9e0b7b42b365c8941cc926d2d7c7bae2fb3
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2025-11-12
tags:
- attack.execution
- attack.t1059.003
- attack.defense-evasion
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_tokens:
    CommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  selection_tokens_parent:
    ParentCommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `for /f` command in `cmd.exe` combined with the `tokens=` parameter and a recursive directory listing utilizing `dir`, which may indicate attempts by an adversary to identify and execute binaries dynamically on a Windows system. Attackers may use this technique to locate sensitive executables, such as PowerShell, as a means of executing further commands or payloads while attempting to evade typical security measures.

  The relevant MITRE ATT&CK tactics include Execution (T1059.003) and Defense Evasion (T1027.010). Primary telemetry sources include process creation logs from Windows Security Event ID 4688 or Sysmon Event ID 1 that detail command line activity. If malicious, the security impact could be severe, facilitating unauthorized access, lateral movement, or payload execution. Importantly, this detection does NOT confirm malicious intent solely based on the observation; legitimate administrative scripts may exhibit similar patterns.

  ### Investigation Steps

  - **Review command line activity for matches:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for processes that include `for /f`, `tokens=`, and `dir`. Look for unusually high usage of this pattern, particularly from non-administrative or non-expected users.

  - **Assess parent process for context:** Identify the parent command line that initiated this process creation. Any instance where the parent command line is also utilizing `for /f` and `tokens=` can indicate a scripted attack attempt rather than a typical operational task.

  - **Correlate with file access patterns:** Examine file access logs to confirm whether there has been an unusual number of accesses to executables or sensitive directories. This can indicate potential reconnaissance efforts aligned with the regex patterns captured by the rule.

  - **Document legitimate usage examples:** Identify common administrative scripts within your environment that utilize similar command line patterns. This context helps differentiate between benign and potentially malicious usage of these commands.

  - **Flag high-confidence malicious indicators:** Check for combinations of command line patterns that may include actions such as spawning PowerShell. For instance, identifying execution of `powershell.exe` right after a command line containing `for /f` may indicate suspicious behavior.

  ### Prioritization

  The severity of this alert is medium, as it highlights potentially malicious activity aimed at discovering critical system binaries. While not every instance will result in an exploit, the likelihood of abuse is moderate, especially if sourced from non-trusted users or systems. This command pattern has been weaponized in certain attacks, especially concerning the evasion of detection measures.

  ### Blind Spots and Assumptions

  The detection may be limited by the potential for evasion techniques such as obfuscation of command strings or redirection of output, which could go unnoticed. Additionally, continuous monitoring and proper configuration of Sysmon and Windows Event logging are required for consistent detection. Legitimate administrative tasks may trigger similar alerts, hence requiring careful review. A related detection rule for monitoring suspicious PowerShell execution could enhance coverage and further validate the context surrounding this activity.

