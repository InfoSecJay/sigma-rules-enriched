logsource:
  category: process_creation
  product: windows
detection:
  selection_tokens:
    CommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  selection_tokens_parent:
    ParentCommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects suspicious usage of `cmd.exe` invoking the 'for /f' loop alongside the 'tokens=' parameter combined with a recursive directory listing using 'dir'. Such behavior may indicate an attacker attempting to dynamically discover and execute system binaries, including PowerShell, as a method of evasion. The likely objective is to execute additional malicious commands or scripts without raising alarms, as this method can navigate through directories to find potentially useful executables.

  The relevant MITRE ATT&CK tactics and techniques include **Execution (TA0002)** under **Command and Scripting Interpreter (T1059.003)** and **Obfuscated Files or Information (T1027.010)**. Primary telemetry sources include Windows process creation logs, specifically focusing on CommandLine and ParentCommandLine entries. If malicious, this behavior can lead to unauthorized command execution or remote payload delivery. Importantly, the detection does NOT confirm that a compromise has occurred; further investigation is necessary to ascertain intent and context.

  ### Investigation Steps

  - **Review command line arguments:** Look for process creation events (Security Event ID 4688 or Sysmon Event ID 1) where CommandLine contains 'for /f', 'tokens=', and 'in (' with 'dir'. Collect the full command and inspect for unusual or unauthorized paths.

  - **Analyze parent process context:** Check ParentCommandLine for 'for /f' and 'tokens='. Obtain Event ID 4688/Sysmon Event ID 1 for parent processes to identify if a legitimate application (e.g., system scripts or user-initiated processes) initiated the command.

  - **Validate legitimate usage patterns:** Identify benign instances where this command execution is expected, such as system maintenance scripts running on administrative tasks. Compare execution paths against known paths for system utilities.

  - **Cross-reference with scheduled tasks:** Examine Windows Task Scheduler logs (Event ID 106) to identify if any legitimate scheduled tasks invoke similar commands. Determine if these tasks correlate with the detected command instances.

  - **Identify known malicious indicators:** If the detected command is executed within a user context that lacks administrative privileges or if associated processes exhibit unusual network behaviors (e.g., connecting to suspicious IPs), classify it as potentially malicious.

  - **Check for additional indicators of compromise:** Review other security tools for signs of lateral movement, such as unusual PowerShell usage (Event ID 4104) or abnormal file creation patterns, especially in sensitive directories.

  ### Prioritization

  This alert is assigned medium severity as it suggests potentially malicious command behavior that could lead to further exploitation. The affected systems, particularly if they affect servers or endpoints with sensitive data, increase the likelihood of abuse. However, initial alerts may also arise from legitimate administrative tasks, requiring contextual analysis to assess risk adequately.

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate administrative tooling or benign scripts mimicking this pattern. Reliable detection requires thorough logging configurations for all process creations and CommandLine executions. Additionally, some legitimate applications may trigger this alert during normal operations, especially in script-heavy environments. Related detections like anomalous PowerShell execution or unusual command launch frequentization can provide more comprehensive coverage of potential abuse methods.

