title: Suspicious Usage of For Loop with Recursive Directory Search in CMD
id: 2782fbd8-b662-4eb5-9962-5bfbfb671e7b
status: experimental
description: |
  Detects suspicious usage of the cmd.exe 'for /f' loop combined with the 'tokens=' parameter and a recursive directory listing.
  This pattern may indicate an attempt to discover and execute system binaries dynamically, for example powershell, a technique sometimes used by attackers to evade detection.
  This behavior has been observed in various malicious lnk files.
references:
- https://www.virustotal.com/gui/file/29837d0d3202758063185828c8f8d9e0b7b42b365c8941cc926d2d7c7bae2fb3
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2025-11-12
tags:
- attack.execution
- attack.t1059.003
- attack.defense-evasion
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_tokens:
    CommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  selection_tokens_parent:
    ParentCommandLine|contains|all:
    - 'for /f'
    - 'tokens='
    - 'in ('
    - 'dir'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the suspicious use of the `for /f` command in conjunction with the `tokens=` parameter within the Windows command line (cmd.exe). Such usage, particularly when paired with recursive directory searches, can indicate malicious activity where an attacker is attempting to dynamically discover system binaries and execute them, potentially to obfuscate their actions and evade traditional security measures. Attackers might utilize this technique as part of their toolkit to extract sensitive information or execute unauthorized commands on the system.

  The relevant MITRE ATT&CK tactics this rule pertains to include **Execution** (Tactic ID: TA0002), specifically the technique **Command and Scripting Interpreter: Windows Command Shell** (T1059.003), and **Defense Evasion** (Tactic ID: TA0005), particularly the technique **Obfuscated Files or Information** (T1027.010). These techniques are commonly observed in scenarios where malware or an attacker leverages command-line utilities stealthily.

  Primary data sources for this detection include process creation events that capture the command line parameters being executed. These logs enable analysts to observe potentially malicious commands being executed in the environment.

  ### Investigation Steps
  - **Review Process Creation Logs:** Begin by examining the process creation logs for instances of `cmd.exe` and filter for occurrences of `for /f` and `tokens=` in the command line. Pay close attention to unusual parameters or patterns that might indicate reconnaissance or binary execution attempts.

  - **Analyze Parent Process Relationships:** Investigate any parent-child relationships related to the captured commands. Determine whether the process that initiated the suspicious command belongs to a known and trusted application and identify any anomalies in the execution context.

  - **Correlate with Endpoint Behavior:** Look for related processes or network connections established by the Windows command shell. Monitor for any execution of other tools or scripts that may typically follow or precede this command usage.

  - **Check for Recent Changes in Environment:** Assess recent changes in Group Policy Objects (GPOs), scripts, or applications that might allow or facilitate the suspicious command execution. Understanding the context in which this command was executed can clarify whether the behavior was legitimate or malicious.

  ### Prioritization
  This alert is classified as medium severity due to its potential to indicate underlying malicious activity that could lead to system compromise. The likelihood of threat actors employing such techniques increases in environments where user activity is not closely monitored, magnifying the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection may miss instances where the command is executed in a legitimate context by authorized users or tools, leading to false negatives. The rule assumes the availability of detailed process creation logs and the correct configuration of logging settings to capture command line arguments. Environments lacking comprehensive logging may encounter gaps in visibility for such suspicious activities, impairing incident response capabilities.

