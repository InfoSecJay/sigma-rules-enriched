logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' use '
    - ':*\\'
    - '/USER:* *'
  filter_main_empty:
    CommandLine|endswith: ' '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where the `net.exe` command is executed with a password parameter. Such behavior is indicative of attacks leveraging Windows networking commands to gain unauthorized access to resources by supplying credentials directly in command-line arguments. The likely attacker objective is lateral movement, privilege escalation, or initial access through exploiting administrative shares. This detection aligns with the MITRE ATT&CK technique for Windows Admin Shares (T1021.002) and Valid Accounts (T1078).

  The primary telemetry source for this alert is Windows process creation logs, specifically focusing on event ID 4688 or Sysmon event ID 1. If malicious, the impact may be significant, as it can facilitate unauthorized access to systems or sensitive data. However, this detection does NOT confirm unauthorized access on its own; it simply indicates that `net.exe` was executed with credentials in the command line.

  ### Investigation Steps

  - **Review process creation events:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1. Look for `net.exe` or `net1.exe` in the "Image" field. Confirm that the command line includes sensitive arguments like `/USER:username` and potentially a password in plain text.

  - **Identify legitimate use cases:** Determine whether `net.exe` is being used under expected circumstances, such as by legitimate system administrators for network management. Expected command lines typically do not expose passwords, e.g., administrative scripts that run without command-line arguments revealing credentials.

  - **Check parent process information:** Investigate the "NewProcessId" and "ProcessName" fields in the process creation events to identify the parent process. A parent process from a known administrative tool may indicate legitimate usage, while ones from unknown scripts can be suspicious.

  - **Correlate with account authentication events:** Review Windows Security Event ID 4624 (Successful Logon) to check if the user associated with the command was logging into the system or accessing shares around the same time, indicating possible misuse of credentials.

  - **Evaluate for other indicators of compromise:** Look for related actions that may occur post-execution, such as abnormal file access patterns or additional user-session creations in Event ID 4672 (Special Privileges Assigned), which may suggest privilege escalation following the initial execution of `net.exe`.

  ### Prioritization

  This alert is classified as medium severity due to the potential for significant impact on security when an attacker extracts credentials via `net.exe`. The likelihood of malicious abuse is high since using explicit passwords in command line arguments is often seen in lateral movement scenarios. This behavior is weaponized in various attack patterns targeting user privileges.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through obfuscation of command line arguments or using different methodologies for accessing `net.exe` without triggering alerts. Required log sources must be consistently configured to ensure that process creation logs are collected comprehensively. Legitimate activities may include system administrators running updates or script automation for legitimate resource management. Companion detections include monitoring for indirect authentication attempts via WinRM or SMB logs to enhance visibility into lateral movement.

