logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' use '
    - ':*\\'
    - '/USER:* *'
  filter_main_empty:
    CommandLine|endswith: ' '
  condition: all of selection_* and not 1 of filter_main_*
