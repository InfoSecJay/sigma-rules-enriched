title: Password Provided In Command Line Of Net.EXE
id: d4498716-1d52-438f-8084-4a603157d131
status: test
description: Detects a when net.exe is called with a password in the command line
references:
- Internal Research
author: Tim Shelton (HAWK.IO)
date: 2021-12-09
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
- attack.lateral-movement
- attack.t1021.002
- attack.t1078
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' use '
    - ':*\\'
    - '/USER:* *'
  filter_main_empty:
    CommandLine|endswith: ' '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects instances where the `net.exe` or `net1.exe` command is executed with a password in the command line arguments. This behavior is often not typical and can indicate potentially malicious activities such as unauthorized access attempts or lateral movements within a network. Attackers may leverage `net.exe`, a legitimate Windows utility for network management, to manipulate network resources or compromise other user accounts if they can provide valid credentials.

  The suspected threat scenario includes actions by malicious actors who aim to establish unauthorized access to systems, escalate privileges, or laterally move across the network. By executing commands with sensitive information in plain text, such as usernames and passwords, attackers may be attempting to exploit misconfigured permissions or execute administrative tasks without proper authorization.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion (T1078):** Valid Accounts, where attackers leverage valid credentials to access systems.
  - **Lateral Movement (T1021.002):** Windows Admin Shares, when accessing network shares using administrative shares or credentials.

  Primary data sources to investigate this activity include process creation events that capture command lines executed on systems, specifically focusing on those involving `net.exe` or `net1.exe`.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for instances of `net.exe` and `net1.exe` that include command line arguments revealing user credentials.
  - **Analyze Command Line Arguments:** Investigate the command line for any usage of plaintext passwords, especially in scenarios involving `/USER:` and share usage.
  - **Check User Context:** Confirm the user context under which the command was executed to identify if it aligns with known administrative users or unexpected accounts.
  - **Correlate with Network Activity:** Look for corresponding network traffic or SMB connections that match the timing of the detected command execution to identify potential lateral movement.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of credential misuse in an enterprise environment. The likelihood of this behavior indicating malicious activity necessitates timely investigation, as compromised credentials can lead to significant security breaches.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of obfuscated command lines that do not adhere to the expected patterns captured by this rule. Additionally, the detection logic assumes that attackers will not employ more sophisticated methods to obscure credential usage within command execution. This alert will require logs of process creation that capture command line details, which should be enabled across relevant systems for effective monitoring.

