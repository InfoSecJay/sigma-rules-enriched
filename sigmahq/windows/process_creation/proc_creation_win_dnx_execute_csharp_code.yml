note: |
  ### Technical Context

  This Sigma rule detects the execution of Dnx.EXE, a tool used for running C# applications, which can be exploited by attackers to bypass application whitelisting mechanisms. The likely attacker objective is to execute arbitrary code in environments where application whitelisting is enforced, allowing them to run potentially malicious scripts undetected. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" and specifically the technique "Native API" (T1218) and "Application Layer Protocol" (T1027.004).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process execution details. If successful, the execution of Dnx.EXE may allow an attacker to achieve persistence or execute further attacks, compromising system integrity. However, this detection does not confirm malicious intent on its own; legitimate usage by authorized users is common.

  ### Investigation Steps

  - **Confirm process execution: ** Check for Dnx.EXE execution logs by examining Security Event ID 4688 or Sysmon Event ID 1. Look for fields related to Image: `C:\Path\To\dnx.exe`. If found with a parent process associated with legitimate applications (e.g., Visual Studio), it may be benign.

  - **Analyze command-line arguments: ** Review the command line associated with Dnx.EXE in Sysmon logs. Malicious indicators may include unusual scripts or arguments, particularly those that obfuscate the executed code or connect to external URLs.

  - **Investigate user context: ** Identify the user account running Dnx.EXE by checking the SubjectUserName, where high-risk users (e.g., Administrator accounts) executing this process should be scrutinized closely for potential misuse.

  - **Check process parentage: ** Examine the parent process ID (PID) for the Dnx.EXE execution. Malicious executions often originate from unexpected parent processes (e.g., cmd.exe or powershell.exe). Track back through the process tree for indicators of lateral movement.

  - **Review recent changes: ** Conduct a review of system changes around the time Dnx.EXE was executed. Look for unusual file modifications or newly created scheduled tasks that could indicate further malicious activity.

  - **Assess application environment: ** Verify the system’s application whitelisting policy and document whether Dnx.EXE is an expected application in the environment. If most users have no reason to run Dnx.EXE, escalate for deeper analysis.

  ### Prioritization

  This alert is medium severity due to the potential risk of an attacker leveraging Dnx.EXE to perform malicious actions on a system that has application whitelisting implemented. The likelihood of malicious abuse is variable, but because Dnx.EXE is not typically part of standard application use, this behavior warrants immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate Dnx.EXE usage by developers or administrators, leading to false positives. Reliable detection requires Sysmon logging capabilities to be fully configured to capture process creation events consistently. Additionally, benign applications that leverage Dnx.EXE for valid purposes may trigger this alert, such as software development tools. A related detection related to suspicious PowerShell invocation (T1059.001) could strengthen coverage by identifying other potential bypass techniques in conjunction with Dnx.EXE execution.

