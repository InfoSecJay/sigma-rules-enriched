note: |
  ### Technical Context

  This Sigma rule detects the execution of the `Dnx.EXE` utility, which is used to execute C# code in .NET applications. Attackers may exploit this utility to bypass application whitelisting measures, potentially executing arbitrary code or malicious scripts within a compromised environment. This behavior falls under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of User Execution (T1203), along with Application Layer Protocol Abuse (T1027.004). The primary telemetry source for this detection is Windows process creation logs, specifically looking for Event ID 4688, which logs details of process creation events.

  If `Dnx.EXE` is maliciously used, it can lead to unauthorized access and execution of harmful code, posing a significant risk to system integrity and data security. Importantly, this detection does NOT confirm that the execution of `Dnx.EXE` is inherently malicious; it must be assessed within the broader context of user behavior and system activity.

  ### Investigation Steps

  - **Validate process execution: **Review Windows Security Event ID 4688 logs for `Dnx.EXE` execution, focusing on the User and Parent Process fields. Expect to see an attempt from an unexpected user or through a non-standard parent process if indicating malicious activity.

  - **Identify the execution context: **Assess the command line arguments used during the execution of `Dnx.EXE` in the event logs (e.g., process_command_line field). Malicious usage may include suspicious parameters that originate from scripts or unknown processes.

  - **Check for concurrent suspicious activities: **Cross-reference with recent process creation logs (Event ID 4688) to identify any related unusual behaviors, such as multiple instances of code execution or processes spawned with elevated privileges.

  - **Review legitimate usage patterns: **Determine if there are authorized use cases within your organization for `Dnx.EXE`, including specific applications that require its execution. Confirm acceptable user accounts or scheduled tasks using it, as these would present benign indicators.

  - **Investigate related file artifacts: **Look for recently created or modified files in associated directories (e.g., those containing C# scripts) that may suggest authorized or unauthorized use of `Dnx.EXE`. Cross-check file indicators against known malware signatures if anomalies are detected.

  ### Prioritization

  This alert has a medium severity due to the potential for `Dnx.EXE` to be exploited for code execution, particularly on systems that lack robust application control measures. The likelihood of abuse is moderate, as attackers may leverage it as part of broader exploitation tactics. Although it is not the most widely weaponized technique, it is present in advanced persistent threat (APT) actor toolkits.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate software that utilizes `Dnx.EXE`, potentially leading to false positives during normal operations. Adequate logging must be configured for process creation activity (Event ID 4688) to ensure complete visibility. Frequent uses of `Dnx.EXE` by authorized personnel may trigger alerts and warrant further contextual review. Companion detections, such as monitoring for suspicious command line arguments (another Sigma rule targeting process creation anomalies), can help strengthen overall detection capabilities.

