  ### Technical Context

  This Sigma rule detects the execution of `dnx.exe`, a runtime that allows for the execution of C# applications. Attackers may leverage this tool to bypass application whitelisting controls, executing arbitrary scripts or payloads under the guise of a trusted process. Relevant MITRE ATT&CK tactics include Defense Evasion (ID: T1218) and Execution (ID: T1027.004). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1.

  If successfully exploited, the use of `dnx.exe` could indicate an advanced persistent threat attempting to execute unauthorized code on the system. It is crucial to clarify that this detection does NOT confirm malicious intent on its own, as legitimate use of `dnx.exe` occurs in development environments or by authorized users.

  ---

  ### Investigation Steps

  - **Identify the calling process:** Review Security Event ID 4688 or Sysmon Event ID 1 to determine which process initiated `dnx.exe`. Malicious activity might originate from unusual or unexpected parent processes, e.g., cmd.exe or PowerShell.

  - **Check command-line arguments:** Analyze the command line used with `dnx.exe` in the logs (Event ID fields). Malicious patterns may include obfuscated commands or unusual script references. Legitimate commands typically involve common development tasks like executing a .NET application.

  - **Validate user account usage:** Look at the user account associated with the `dnx.exe` execution. Compare it with known user behaviors to establish legitimacy. Legitimate usage is typically from known development accounts with reinforced access levels.

  - **Assess system role:** Determine the role of the affected system (e.g., development server vs. production server). Malicious usage of `dnx.exe` on a production system is more critical and warrants immediate response.

  - **Monitor network activity:** Examine network logs for unusual connections made shortly after `dnx.exe` execution. Indicators could include outbound traffic to suspicious or non-business-related domains.

  - **Review for related processes:** Check for further processes spawned by `dnx.exe`, such as additional scripts or executables, using Sysmon Event ID 1 for parent-child relationships. Malicious behavior may result in multiple chained executions that are atypical for expected user actions.

  ---

  ### Prioritization

  The severity of this alert is medium due to the risk of code execution bypassing application controls, particularly if it occurs on a critical production system. While the likelihood of an attacker leveraging `dnx.exe` for malicious purposes exists, typical usage is also observed in legitimate software development workflows.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers alter their execution methods or disguise the process name, relying on alternate obfuscation techniques. Ensuring that process creation logging is uniformly enforced across all endpoints is critical for reliable detection. Legitimate software development activities may also trigger this alert, so analysts should carefully evaluate the context of `dnx.exe` execution. Companion detections, such as monitoring for unusual parent processes (e.g., uncommon PowerShell scripts), can strengthen overall analysis accuracy.

