note: |
  ### Technical Context
  This rule detects the execution of Dnx.EXE, a utility associated with the .NET Core platform that allows for the execution of C# code. Attackers may exploit this tool to bypass application whitelisting controls that are typically established to prevent unauthorized applications from running on enterprise systems. By executing custom scripts or malware with Dnx.EXE, an adversary can evade security measures designed to block certain applications, facilitating further compromise within the network.

  The threat scenario aligns with common attacker objectives focused on reconnaissance, weaponization, and ultimately executing malicious code while remaining undetected. Specifically, the use of Dnx.EXE is associated with techniques in the MITRE ATT&CK framework, particularly **Defense Evasion (T1203)** and **Bypass Application Control (T1218)**, as it allows attackers to run unauthorized code without triggering application control or whitelisting mechanisms.

  Key data sources for detecting this threat include **process creation events** that log the execution details of applications on Windows systems. Monitoring these logs will provide visibility into potentially malicious activities involving Dnx.EXE.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of Dnx.EXE execution, focusing on the context of the processes that invoked it and any associated command-line arguments that may indicate unusual behavior.

  - **Analyze Parent Process Relationships**: Investigate the parent processes of Dnx.EXE launches to determine if the execution stems from known legitimate applications or potentially suspicious processes.

  - **Monitor Network Activity**: Check for any outbound connections initiated by processes that executed Dnx.EXE, as this could indicate communication with a command and control server or other malicious infrastructure.

  - **Validate User Activity**: Assess recent user activity to establish whether the execution of Dnx.EXE aligns with typical use cases within your environment, considering any deviations from normal operating patterns.

  ### Prioritization
  The severity of this alert is medium as the malicious use of Dnx.EXE could signify attempts to bypass application security measures, potentially leading to unauthorized code execution and further system compromise. The nature of this behavior warrants prompt investigation due to its implications for data integrity and system security.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on specific process creation events; if logs are not adequately collected or if application whitelisting is configured poorly, legitimate use could obscure detection of malicious activity. The detection logic assumes that the invocation of Dnx.EXE is typically unauthorized, ignoring valid operational contexts. For the alert to function effectively, comprehensive logs of process creation should be enabled, and application whitelisting configurations should be continuously reviewed and updated to include necessary exceptions for legitimate business use without compromising security.

