note: |
  ### Technical Context

  This rule detects the execution of the Deployment Image Servicing and Management (DISM) tool when used to disable features on a Windows system, specifically targeting security-related features such as Windows Defender. The likely attacker objective is to reduce the system's security posture to facilitate additional malicious actions. This behavior aligns with the MITRE ATT&CK technique "Disable or Tamper with Security Tools" (T1562.001).

  The primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688 and Sysmon Event ID 1, that capture executable activities and their command lines. If executed maliciously, the impact could allow adversaries to bypass security protections and further compromise the system. It is important to note that this detection does NOT confirm an active compromise on its own, as legitimate administrative actions may also trigger the rule.

  ### Investigation Steps

  - **Examine process creation logs**: Review Event ID 4688 or Sysmon Event ID 1 for instances of `DismHost.exe` or `Dism.exe`. Focus on command lines that include `/Online` and `/Disable-Feature`. Look for specific flags that may correspond to disabling security features.

  - **Analyze parent process**: Identify the parent process of the DISM execution. Administrative tools or scripts (e.g., PowerShell, Task Scheduler) are expected. If the parent process is something unusual like `cmd.exe` or an unaffiliated executables, this may indicate malicious activity.

  - **Verify command parameters**: Check the command line parameters for known feature names that relate to security (e.g., Windows Defender). Command lines including `/FeatureName:Windows-Defender-Features` or similar are high-confidence indicators of malicious intent.

  - **Assess legitimate usage**: Identify any authorized administrative accounts that may have executed DISM commands, referring to timestamps and user account activity. Legitimate activities may include updating features or resolving issues with Windows updates.

  - **Cross-check against recent alerts**: Correlate this event with other security logs that may indicate suspicious activity, like failed logins or configuration changes, to build a contextual picture of potential malicious workflow.

  - **Inspect for follow-on actions**: If DISM disabled security features, check for additional telemetry indicating compromise such as unusual outbound connections, file modifications, or the presence of known malware signatures in later logs.

  ### Prioritization

  This alert is medium priority due to the potential impact on system defenses, especially if it involves a critical asset like a domain controller or an endpoint with sensitive data. There is a realistic likelihood of malicious abuse, especially by sophisticated adversaries seeking persistence, as tactics to disable security tools are commonly observed in attacks.

  ### Blind Spots and Assumptions

  The detection has limitations, as evasion may occur if attackers use alternate methods to disable security tools, such as directly tampering with services. Successful detection requires proper logging configurations for Windows security and Sysmon event logs. Legitimate administrative actions, such as software deployment or troubleshooting, may inadvertently trigger this alert. A companion detection to strengthen coverage would be monitoring for changes in service statuses or modifications to security-related registry entries.

