note: |
  ### Technical Context
  This detection rule identifies suspicious use of the Deployment Image Servicing and Management (DISM) tool, particularly focusing on commands that involve disabling features in Windows, which may include critical security components like Windows Defender. Attackers may leverage DISM to manipulate system configurations as part of their tactics to evade detection or disable security tools on compromised machines. Such actions could be indicative of a broader compromise aimed at maintaining persistence or facilitating further malicious activities.

  In terms of MITRE ATT&CK framework relevance, this behavior directly correlates with the Defense Evasion tactic, specifically Technique T1562.001: Disable or Tamper with Security Tools. The objective for the attacker likely involves neutralizing host-based security measures to enable additional actions without triggering alerts. The primary data sources relevant to this detection include process creation events and command-line arguments logged by the operating system, which can reveal when DISM is used in potentially harmful ways.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for instances of `DismHost.exe` or `Dism.exe` being executed with the `'/Online'` and `'/Disable-Feature'` parameters, which indicate potential tampering with system features.
  - **Inspect Command-Line Arguments**: Pay special attention to the full command-line used when DISM is invoked, looking for unusual switches like `/Remove`, `/NoRestart`, or `/quiet` that may suggest malicious intent.
  - **Correlate with Recent Changes**: Investigate the timeline of the detected event against other security events within the environment, such as failed login attempts, power shell usage, or other known indicators of compromise.
  - **Assess Endpoint Security Logs**: Examine other logs from endpoint protection software to determine if there were concurrent alerts or logs related to security tools being disabled or tampered with.

  ### Prioritization
  This alert is of medium severity due to the potential impact of disabling critical security features in an enterprise environment, which can facilitate further malicious activities. The likelihood of its occurrence increases in targeted attacks, particularly against organizations that may have high-value data or assets.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if DISM is used in a legitimate context, such as by system administrators for valid purposes. The detection logic assumes that all instances of DISM execution with the specified parameters are indicative of malicious behavior, which may lead to false positives. For the alert to function correctly, it requires detailed process creation logs and command-line argument logging to be enabled in the Windows environment. Without this data, detection capabilities would be significantly limited.

