title: Suspicious File Download From IP Via Wget.EXE
id: 17f0c0a8-8bd5-4ee0-8c5f-a342c0199f35
status: test
description: Detects potentially suspicious file downloads directly from IP addresses
  using Wget.exe
references:
- https://www.gnu.org/software/wget/manual/wget.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wget.exe'
  - OriginalFileName: 'wget.exe'
  selection_ip:
    CommandLine|re: '://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
  selection_http:
    CommandLine|contains: 'http'
  selection_flag:
  - CommandLine|re: '\s-O\s'
  - CommandLine|contains: '--output-document'
  selection_ext:
    CommandLine|endswith:
            # Note you can transform this into a "contains" to increase coverage but you would need to take care of some FP.
    - '.ps1'
    - ".ps1'"
    - '.ps1"'
    - '.dat'
    - ".dat'"
    - '.dat"'
    - '.msi'
    - ".msi'"
    - '.msi"'
    - '.bat'
    - ".bat'"
    - '.bat"'
    - '.exe'
    - ".exe'"
    - '.exe"'
    - '.vbs'
    - ".vbs'"
    - '.vbs"'
    - '.vbe'
    - ".vbe'"
    - '.vbe"'
    - '.hta'
    - ".hta'"
    - '.hta"'
    - '.dll'
    - ".dll'"
    - '.dll"'
    - '.psm1'
    - ".psm1'"
    - '.psm1"'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious file downloads performed via `wget.exe`, a command-line utility commonly used to retrieve files from the web. Attackers may utilize `wget` to download malicious payloads directly from external IP addresses, facilitating persistence, lateral movement, or data exfiltration. In enterprise environments, the use of `wget.exe` for this purpose can signal unauthorized activity, particularly if files with potentially harmful extensions are retrieved from suspicious sources.

  The threat scenario typically involves an adversary leveraging `wget` to download scripts or binaries (e.g., PowerShell scripts, executable files) that can be executed to compromise the host or network further. This behavior aligns with the MITRE ATT&CK techniques such as Execution (T1203 - Exploitation for Client Execution) and Command and Control (T1071 - Application Layer Protocol) due to the potential for using exfiltrated files as part of an attack chain. The primary data sources for this detection will include Windows process creation events that log command line arguments associated with executed processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows event logs related to process creation to identify instances of `wget.exe` execution, paying close attention to command line arguments used.
  - **Analyze Command Line Arguments:** Focus on the command line parameters associated with `wget.exe` to determine if explicit IP addresses were used, noting any suspicious file extensions present in the download requests.
  - **Correlate with Network Traffic:** Utilize Network Detection and Response (NDR) tools to analyze outbound traffic and confirm requests to the identified IP addresses, especially those that involve file downloads.
  - **Examine File Integrity:** Investigate the integrity and reputation of any downloaded files, particularly those with extensions like `.ps1`, `.exe`, and `.dll`, to assess potential risks associated with their execution.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of downloading malicious files which could lead to full system compromise or data loss. The likelihood of such activity occurring on a corporate network, particularly when leveraging a legitimate tool like `wget`, warrants immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the use of alternative download methods or tools, including PowerShell's `Invoke-WebRequest`, which might not trigger this rule. The detection logic assumes that `wget.exe` will always log its command line with recognizable patterns, which may not hold true if logs are not properly configured. Additionally, the rule requires the availability of process creation logs for effective monitoring and analysis, emphasizing the need for appropriate logging configurations across endpoints.

