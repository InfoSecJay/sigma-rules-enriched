title: Suspicious File Download From IP Via Wget.EXE
id: 17f0c0a8-8bd5-4ee0-8c5f-a342c0199f35
status: test
description: Detects potentially suspicious file downloads directly from IP 
  addresses using Wget.exe
references:
- https://www.gnu.org/software/wget/manual/wget.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wget.exe'
  - OriginalFileName: 'wget.exe'
  selection_ip:
    CommandLine|re: '://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
  selection_http:
    CommandLine|contains: 'http'
  selection_flag:
  - CommandLine|re: '\s-O\s'
  - CommandLine|contains: '--output-document'
  selection_ext:
    CommandLine|endswith:
            # Note you can transform this into a "contains" to increase coverage but you would need to take care of some FP.
    - '.ps1'
    - ".ps1'"
    - '.ps1"'
    - '.dat'
    - ".dat'"
    - '.dat"'
    - '.msi'
    - ".msi'"
    - '.msi"'
    - '.bat'
    - ".bat'"
    - '.bat"'
    - '.exe'
    - ".exe'"
    - '.exe"'
    - '.vbs'
    - ".vbs'"
    - '.vbs"'
    - '.vbe'
    - ".vbe'"
    - '.vbe"'
    - '.hta'
    - ".hta'"
    - '.hta"'
    - '.dll'
    - ".dll'"
    - '.dll"'
    - '.psm1'
    - ".psm1'"
    - '.psm1"'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Wget.exe, specifically when it is used to download files directly from an IP address, particularly focusing on file types often associated with malicious activity (e.g., .ps1, .exe, .bat). The likely objective is to transfer potentially malicious scripts or binaries that could be executed to compromise the host or pivot to other systems. This behavior aligns with the MITRE ATT&CK techniques T1059.001 (Command and Scripting Interpreter: Windows Command Shell) and T1203 (Exploitation for Client Execution).

  The primary telemetry source is Windows process creation events, specifically Security Event ID 4688, which captures details regarding command-line execution. If malicious, downloading and executing unverified files can facilitate malware installation or command execution leading to increased risk exposure. Importantly, this detection does NOT confirm that the file is indeed malicious; it merely indicates a suspicious download activity from an IP.

  ### Investigation Steps

  - **Review process creation details**: Investigate Event ID 4688 for Wget.exe execution. Check the CommandLine field; look for patterns involving direct IP addresses and suspicious file extensions (.exe, .ps1, .bat).

  - **Correlate with network traffic**: Cross-reference with network logs to identify traffic patterns to the IP address used during the download. Identify if this IP is known for malicious activity or if it corresponds to legitimate services (e.g., organizational repositories).

  - **Identify the host environment**: Determine the asset role (server, workstation, etc.) and criticality. Review the surrounding context to see if Wget.exe was executed as part of expected administrative activities.

  - **Look for signs of further exploitation**: After identifying the downloaded file, confirm its existence on the file system. Validate creation timestamps and review if the file was executed (System Event ID 4688) soon after download.

  - **Check user behavior**: Investigate the user account executing the command for prior anomalous behavior or a lack of privilege aligned when accessing sensitive data or systems.

  - **Consider legitimate use cases**: Identify any organizational policies allowing the use of Wget.exe. If found, ensure it corresponds with documented procedures. Confirm any executed commands are legitimate and not a cover for malicious downloads.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on critical systems. The likelihood of malicious abuse is high as downloading executable files directly from IP addresses is a common tactic for delivering malware. This behavior can frequently lead to successful exploitation attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Wget.exe in the environment, necessitating careful context analysis. Assumptions should be tempered with awareness that users with administrative privileges may use wget for valid purposes. It's recommended to correlate findings with related detections, such as Event ID 4688 for suspicious command execution or file access monitoring to enhance visibility on potentially harmful actions.

