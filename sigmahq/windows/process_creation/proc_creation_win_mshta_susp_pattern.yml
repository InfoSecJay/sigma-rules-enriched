title: Suspicious Mshta.EXE Execution Patterns
id: e32f92d1-523e-49c3-9374-bdb13b46a3ba
status: test
description: Detects suspicious mshta process execution patterns
references:
- https://en.wikipedia.org/wiki/HTML_Application
- https://www.echotrail.io/insights/search/mshta.exe
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2021-07-17
modified: 2023-02-21
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mshta.exe'
  - OriginalFileName: 'MSHTA.EXE'
  selection_susp:
        # Suspicious parents
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
        # Suspicious folders
    CommandLine|contains:
    - '\AppData\Local\'
    - 'C:\ProgramData\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
  filter_img:
        # Filter legit Locations
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
        # Suspicious extensions
  - CommandLine|contains:
    - '.htm'
    - '.hta'
        # Filter simple execution
  - CommandLine|endswith:
    - 'mshta.exe'
    - 'mshta'
  condition: all of selection_* or (selection_img and not filter_img)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious execution patterns of the `mshta.exe` process, particularly when it is invoked with command lines suggesting unusual behavior, such as running from atypical directories or with potentially dangerous file extensions (.htm, .hta). The likely attacker objective is to execute malicious scripts or payloads via HTML applications, which can bypass common defenses since `mshta.exe` is a legitimate Windows utility designed to execute HTML applications. This behavior aligns with the MITRE ATT&CK technique **Execution: User Execution (T1203)** and **Command and Control: Application Layer Protocol (T1071)**.

  Primary telemetry sources include Windows Process Creation events (Security Event ID 4688 or Sysmon Event ID 1) that detail process execution, including the command line used and parent processes. If malicious, the potential impact includes unauthorized command execution, data exfiltration, or lateral movement within the network. This detection does NOT confirm malicious intent on its own, as legitimate applications can use `mshta.exe` for benign tasks.

  ### Investigation Steps

  - **Verify process details:** Examine the process creation logs (Event ID 4688) for `mshta.exe`. Note the **ParentImage** field to assess if it was spawned by a suspicious parent process like `cmd.exe` or `powershell.exe`, which could indicate malicious behavior.

  - **Investigate command lines:** Analyze the **CommandLine** field in the process creation logs. Look for the presence of file paths such as `C:\Users\Public\` or commands that include `.htm` or `.hta`. Legitimate use would typically involve system directories like `C:\Windows\System32\`.

  - **Assess execution location:** Check the **Image** field. If `mshta.exe` is executed from directories like `C:\Windows\Temp\`, it may signify a staged attack. Legitimate processes generally run from their standard installation directories.

  - **Review parent-child relationship:** Confirm the legitimacy of the spawning process by assessing its functionality and other details like the creation time and user context. Malicious behavior might include multiple instances of `mshta.exe` initiated quickly by a single `powershell.exe` instance.

  - **Look for high-confidence indicators:** If `mshta.exe` is seen executing scripts similar to obfuscated JavaScript or known malware patterns, treat this as high-confidence malicious activity and consider further investigation into the user and system involved.

  - **Validate against threat intelligence:** Cross-check the execution patterns or associated IPs with threat intelligence feeds to identify known malicious actors or infrastructure that might correlate with the behavior observed in the logs.

  ### Prioritization

  The alert severity is high due to the potential impact of `mshta.exe` being used for malicious purposes, such as executing arbitrary code or conducting further exploitation. This technique is notably used in phishing and other targeted attacks, making it likely to be exploited by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of `mshta.exe`, where administrative scripts could execute HTML applications without malign intent. It is essential to ensure that logging for process creation is enabled (through Sysmon or native Windows logging) to capture these events effectively. Possible benign activities might include legitimate administrative scripts utilizing `mshta`. A related detection that strengthens coverage would involve monitoring `powershell.exe` execution anomalies, as it often acts as a precursor to such suspicious behavior.

