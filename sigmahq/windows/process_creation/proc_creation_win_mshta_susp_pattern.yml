title: Suspicious Mshta.EXE Execution Patterns
id: e32f92d1-523e-49c3-9374-bdb13b46a3ba
status: test
description: Detects suspicious mshta process execution patterns
references:
- https://en.wikipedia.org/wiki/HTML_Application
- https://www.echotrail.io/insights/search/mshta.exe
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-07-17
modified: 2023-02-21
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mshta.exe'
  - OriginalFileName: 'MSHTA.EXE'
  selection_susp:
        # Suspicious parents
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
        # Suspicious folders
    CommandLine|contains:
    - '\AppData\Local\'
    - 'C:\ProgramData\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
  filter_img:
        # Filter legit Locations
  - Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
        # Suspicious extensions
  - CommandLine|contains:
    - '.htm'
    - '.hta'
        # Filter simple execution
  - CommandLine|endswith:
    - 'mshta.exe'
    - 'mshta'
  condition: all of selection_* or (selection_img and not filter_img)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious execution patterns associated with mshta.exe, a Microsoft HTML Application host that can execute HTML applications (HTAs), which are often exploited by malicious actors. The detection is triggered when mshta.exe is executed with unusual parent processes, command-line arguments, or from suspicious directories that could indicate a malicious use case. Attackers may leverage mshta.exe in living-off-the-land attacks, embedding malicious code within HTAs to execute payloads while obfuscating their activities.

  The primary MITRE ATT&CK techniques relevant to this detection include **Execution** (T1203: Exploitation for Client Execution), and **Command and Scripting Interpreter** (T1059). These techniques highlight the danger of executing malicious code through scripting languages and applications, contributing to the attacker's ability to perform commands silently on compromised systems.

  Key data sources for inspection include process creation events captured by Windows Event Logs, which provide insights into the execution of processes such as mshta.exe, alongside command-line arguments that add context to the execution environment and intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs to identify instances where mshta.exe was executed along with details about the parent processes and command-line arguments used.
  - **Analyze Command-Line Arguments:** Focus on analyzing the command-line parameters of mshta.exe for any suspicious file paths, particularly those linked to app data or temporary directories, as these may indicate an attempt to execute malicious content.
  - **Check Parent Process Behavior:** Investigate the parent processes from which mshta.exe was spawned. Investigate unusual or unexpected parent processes like cmd.exe, PowerShell, or wscript.exe, which could suggest script-based attacks.
  - **Monitor Suspicious File Extensions:** Look for HTA files or HTML files in system locations that pose an increased risk, particularly those executed in conjunction with mshta.exe, as they may contain embedded commands or scripts meant for exploitation.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact of malware execution through benign-looking applications like mshta.exe. Given the prevalence of using scripting engines in attacks and the capabilities they provide to attackers, immediate investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the logs for process creation are not captured or if mshta.exe is executed in a non-traditional manner that evades detection criteria. The detection logic assumes that if mshta.exe is executed from suspicious paths with unusual parameters, it is potentially malicious. Environments not logging appropriate process creation events or lacking visibility into PowerShell and command-line activity may miss critical indicators needed for accurate detection.

