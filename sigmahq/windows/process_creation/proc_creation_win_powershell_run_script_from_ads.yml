note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts sourced from an Alternate Data Stream (ADS), which can be used by adversaries to execute malicious code while evading detection. The attacker may aim to leverage this technique to execute scripts without raising suspicion, using a seemingly benign file. This behavior aligns with the MITRE ATT&CK technique "Alternate Data Streams" (T1564.004), which allows manipulation of file attributes to conceal malicious activities.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, with a focus on the CommandLine field that contains specific parameters like 'Get-Content' and '-Stream'. If successful, this behavior could lead to unauthorized execution of scripts that compromise system integrity and confidentiality. It is crucial to note that this detection does NOT confirm that the executed script is malicious; it merely indicates that a PowerShell script was executed from an ADS.

  ### Investigation Steps

  - **Verify the Command Line arguments**: Check for Security Event ID 4688 or Sysmon Event ID 1 to examine the CommandLine field. Legitimate entries typically do not contain 'Get-Content' with '-Stream' referencing an ADS.

  - **Review parent process context**: Inspect the ParentImage field for entries ending with '\powershell.exe' or '\pwsh.exe'. Legitimate PowerShell usage may involve known scripts or administrative tasks, while suspicious activity could involve unexpected scripts or filenames.

  - **Correlate with file modifications**: Look at the file attributes of the executable that triggered this event. Use Windows File System logs to confirm the existence and creation of any ADS. Refer to the master file table (MFT) for changes in file streams.

  - **Identify common paths and filename patterns**: Malicious PowerShell scripts executed via ADS often follow non-standard naming conventions or unusual file locations (e.g., AppData or Temp folders). Cross-reference with endpoint logs to filter legitimate applications that might perform similar activities.

  - **Monitor for lateral movement indicators**: Check for any subsequent network connections or actions following script execution (e.g., connecting to external IPs). Correlate with network logs (Firewall or IDS) for connections that match known indicators of compromise (IOCs).

  ### Prioritization

  This alert should be considered high priority due to the potential impact on sensitive systems from executing unauthorized scripts. The likelihood of abuse via PowerShell and ADS techniques is significant, as it is a common method used by advanced adversaries to run malicious code stealthily. This behavior has a high likelihood of being weaponized in exploitation.

  ### Blind Spots and Assumptions

  This detection may miss scripts executed through non-standard methods or other scripting languages that do not use ADS. Reliable alerting requires that process creation logging is enabled consistently across all endpoints. Legitimate activities such as administrative tasks or maintenance scripts may trigger this alert; therefore, context is critical. Related detections, such as monitoring for unusual network activity post-script execution, can enhance coverage against this tactic.

