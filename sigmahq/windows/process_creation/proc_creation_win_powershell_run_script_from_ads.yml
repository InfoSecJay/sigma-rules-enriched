note: |
  ---

  ### Technical Context

  The rule detects the execution of PowerShell scripts sourced from Alternate Data Streams (ADS), a technique commonly used to obfuscate malicious activity. The likely attacker objective is to execute hidden scripts that may bypass traditional security monitoring by hiding their true nature within the filesystem. This behavior fits within the MITRE ATT&CK framework under the technique "Hidden Files and Directories" (T1564.004).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 (Process Creation) and potentially Sysmon Event ID 1 (Process creation events), which provide insight into command line activities. If malicious, this behavior can lead to unauthorized execution of code, data exfiltration, or lateral movement within the network. Importantly, this detection alone does not confirm malicious intent; legitimate use of PowerShell may also invoke ADS.

  ---

  ### Investigation Steps

  - **Examine the process creation logs**: Look for Event ID 4688 or Sysmon Event ID 1. Validate that `ParentImage` and `Image` include references to `powershell.exe` or `pwsh.exe`, and verify that the `CommandLine` contains both `Get-Content` and `-Stream`.

  - **Analyze command line arguments**: Identify the specific script being executed through the command line arguments. Ensure it is not a known and approved PowerShell script being run for administrative purposes, as legitimate use of ADS might be present.

  - **Check file creation timestamps**: Review the creation and modification timestamps of files in the suspected ADS. Legitimate usage often involves scripts with recent timestamps, whereas malicious usage may reveal discrepancies indicating attempts to obscure activity.

  - **Correlate with incident response**: If a potential malicious indicator is identified, check for additional evidence of compromise across the impacted system. Look for abnormal outbound connections or attempts to access sensitive data in Windows Event Logs (e.g., Security Event ID 4740 for account lockouts).

  - **Compare against whitelist**: Investigate whether the detected PowerShell script corresponds to any whitelisted processes or scripts approved for use in the environment to determine if this is standard administrative activity.

  - **Identify file access and exports**: If applicable, utilize file monitoring tools to check whether any data exfiltration occurred post-execution of the detected PowerShell command, validating any unexpected file access events following the ADS execution.

  ---

  ### Prioritization

  This alert is of high severity due to the potential risk associated with executing scripts from hidden data streams, which is a method often utilized by attackers to evade detection. Given the critical role of PowerShell in both legitimate and malicious scenarios, this behavior could likely indicate a significant security incident if confirmed malicious.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like renaming scripts or using non-standard PowerShell execution approaches that may not trigger traditional alerts. This detection requires proper logging configurations for `Event ID 4688` and possibly Sysmon setup to ensure comprehensive visibility. Legitimate administrative tasks may trigger this alert, especially when using PowerShell for script execution in a standard operational context. An effective companion detection is monitoring for unusual outbound network traffic from the host following PowerShell executions, which can complement the findings from this alert.

