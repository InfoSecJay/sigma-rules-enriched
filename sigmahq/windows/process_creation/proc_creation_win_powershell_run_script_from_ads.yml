detection:
  selection:
    ParentImage|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Get-Content'
    - '-Stream'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts from Alternate Data Streams (ADS), a technique often used by adversaries to hide malicious payloads. The likely attacker objective is to execute code without detection, bypassing traditional security measures. This behavior is classified under MITRE ATT&CK tactics as "Defense Evasion" (TA0005) and specifically the technique "Alternate Data Streams" (T1564.004). The primary telemetry sources involved are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, both indicating process execution details and command lines. If malicious, this behavior can lead to unauthorized access or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use cases for ADS may exist.

  ### Investigation Steps

  - **Review process creation details**: Check Security Event ID 4688 and Sysmon Event ID 1 for processes containing 'powershell.exe' or 'pwsh.exe' as the Image name, particularly focusing on the CommandLine for 'Get-Content' and '-Stream' arguments.
  - **Analyze command-line arguments**: Look for any unusual or unexpected PowerShell command arguments in the CommandLine field, which may suggest scripted attacks. Common benign usage often follows a standard script format, unlike complex or obfuscated commands.
  - **Monitor for ADS existence**: Utilize tools or scripts, such as the one referenced in the rule, to list any ADS associated with impacted files. The presence of suspicious Stream names or large file sizes could indicate malicious activity.
  - **Confirm legitimate usage patterns**: Investigate whether any authorized internal processes or users regularly employ PowerShell with ADS in a known and expected way, as this can help differentiate between benign and malicious activity.
  - **Identify high-confidence indicators of compromise**: Look for patterns such as abnormal parent-child relationships in process creation, specifically if processes are spawned from unexpected parent processes, indicating possible malware chaining.
  - **Evaluate impacted asset criticality**: If detected on high-value assets, such as domain controllers or sensitive data repositories, escalate investigations promptly, as malicious use could lead to significant security breaches.

  ### Prioritization

  This alert is of high severity within an enterprise context, as it indicates a sophisticated evasive technique that could signal the presence of a threat actor operating with stealth. The potential for data exfiltration or lateral movement makes this behavior particularly concerning, highlighting its common use in real-world attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications and users to use ADS for valid purposes, leading to false positives. Reliable detection requires proper log source configurations for Sysmon and Windows security events. Activities such as legitimate software installations or updates might unintentionally trigger the alert. A companion detection worth monitoring includes suspicious PowerShell execution patterns without ADS, providing a broader context for threat assessment.

