logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Get-Content'
    - '-Stream'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects instances of PowerShell scripts executed from Alternate Data Streams (ADS), a method often utilized to conceal malicious activities. Attackers may leverage this technique to execute scripts without bringing attention to their actions, effectively bypassing standard detection approaches. The ability to run scripts from an ADS provides adversaries the means to execute code while appearing legitimate, potentially evading traditional defenses.

  The primary objectives behind this tactic likely involve maintaining persistence on a compromised system or executing commands that retrieve sensitive information. Leveraging ADS for script execution aligns with the MITRE ATT&CK technique **"Scripting / PowerShell" (T1064)** and particularly the sub-technique **“Alternate Data Streams” (T1564.004)**. These techniques emphasize the adversary’s intent to employ deception and evade detection in their operations.

  Relevant telemetry for detecting this activity will primarily stem from process creation events on Windows systems, specifically those that log command line arguments for PowerShell executions. Other helpful sources may include security event logs that provide insights into the running processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine detailed process creation events for PowerShell instances that directly follow or originate from suspicious parent processes, specifically looking for the presence of command-line arguments indicative of ADS usage, such as 'Get-Content' and '-Stream'.

  - **Analyze Active Security Logs:** Collect and analyze security logs to identify any anomalous parent-child relationships or patterns that deviate from normal operational baselines, focusing on unexpected PowerShell executions.

  - **Correlate with File System Events:** If available, review file system events to identify any modifications to files associated with ADS. This may help in tracing back the hidden scripts or malicious payloads.

  - **Investigate User Activity Logs:** Scrutinize user activity logs around the time of the detected event to establish whether the execution of the script was authorized or if it implies potential insider threat behavior.

  ### Prioritization
  The severity of this alert is rated high due to the potential for significant impact; executing scripts from ADS can be indicative of advanced evasion techniques employed by attackers, posing a direct risk to the confidentiality and integrity of the organization.

  ### Blind Spots and Assumptions
  This detection rule may be limited by the environments where PowerShell command logging is not enabled or where log retention policies might lead to the loss of critical logs. The logic assumes all PowerShell invocations are logged adequately, and that users do not have legitimate reasons for executing scripts from ADS. Without comprehensive process creation log coverage and security event monitoring, some activities may go undetected, allowing malicious use of ADS to persist unchecked.

