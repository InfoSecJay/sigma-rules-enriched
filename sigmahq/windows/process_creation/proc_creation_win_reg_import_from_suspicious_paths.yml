detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli:
    CommandLine|contains: ' import '
  selection_paths:
    CommandLine|contains:
    - 'C:\Users\'
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
    - '\AppData\Local\Temp\'
    - 'C:\Windows\Temp\'
    - 'C:\ProgramData\'
  condition: all of selection_*
falsepositives:
- Legitimate import of keys
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `reg.exe` utility to import `.reg` files from suspicious paths, which could potentially indicate malicious activity. Attackers may use this technique to alter registry settings in order to maintain persistence, evade defenses, or execute malicious payloads on Windows systems. Specifically, the rule looks for command-line activities that include the word 'import' and originate from user-related or temporary directories that are not typical for legitimate `reg.exe` operations.

  This behavior aligns with the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (T1131) and **Defense Evasion** (T1112). By observing registry modifications from these folder paths, security teams can gain insights into potential post-exploitation attempts by adversaries seeking to establish footholds or evade detection mechanisms. Primary log sources for this detection include process creation logs, which capture details about the execution of commands and their originating paths.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `reg.exe` being executed. Pay close attention to command-line arguments that include 'import' and check for any suspicious paths such as `%temp%`, `%appdata%`, or unusual user profiles.
  - **Examine Registry Changes**: Utilize tools like `regedit` or PowerShell to review the registry hive modifications following the execution of the suspicious import command. Look for unexpected changes or additions to keys that correspond to known persistence mechanisms.
  - **Correlate User Activity**: Investigate the user context in which `reg.exe` was executed. Determine if the user account had legitimate reasons to run this command, or if it's anomalous behavior that warrants further inquiry. Check for any associated logins or activity patterns during that time frame.
  - **Search for Related Artifacts**: Investigate any `.reg` files that were imported. Identify their origin and intended changes. Assess if these files are related to known malware signatures or other malicious behavior.

  ### Prioritization
  This alert has a medium severity because the use of registry manipulation for persistence or evasion can indicate a compromised environment. Given that successful exploitation can lead to significant impacts, including data exfiltration or lateral movement, it is essential to treat these alerts with priority.

  ### Blind Spots and Assumptions
  The detection rule may not capture all instances of malicious registry modifications, particularly if attacks are conducted using custom scripts or other utilities outside of `reg.exe`. The rule assumes that normal organizational behavior does not involve importing `.reg` files from suspicious paths. Additionally, it requires comprehensive logging of process creation events to function effectively; without this, critical evidence may be missing, leading to undetected threats.

