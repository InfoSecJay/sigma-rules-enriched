note: |
  ### Technical Context

  This Sigma rule detects the import of `.reg` files using the `reg.exe` utility from suspicious paths, indicating potential registry manipulation often associated with persistence or evasion tactics. The likely attacker objective is to modify registry settings to enable persistence or disable security measures, which can support further malicious activity. This behavior is categorized under MITRE ATT&CK tactic **Persistence** (T1071) and technique **Registry Run Keys / Startup Folder** (T1112).

  The primary telemetry sources needed for this detection are Process Creation logs (Windows Event ID 4688) and Sysmon Event ID 1, which capture process execution and command-line arguments. If executed with malicious intent, this could lead to unauthorized changes in system configuration impacting security posture. It’s crucial to note that this detection does NOT confirm malicious activity in isolation, as legitimate administrative tasks may also generate similar alerts.

  ### Investigation Steps

  - **Review Process Creation Logs:** Query Windows Event ID 4688 for `reg.exe` execution. Look for CommandLine indicative of importing `.reg` files, especially from paths like `C:\Users\`, `%temp%`, or `C:\ProgramData\`. Note any anomolous user accounts involved.

  - **Examine Command-Line Arguments:** Identify specific `.reg` file being imported by reviewing `CommandLine` field, ensuring it points to a potentially malicious or unusual source. Flags indicating non-standard practices would raise suspicion.

  - **Identify Environment Context:** Check the affected host’s role (server, workstation). Look for role-specific legitimate uses of `reg.exe`, helping to contextualize activity. For example, system administrators might use it for legitimate purposes in a management context.

  - **Correlate with User Actions:** Cross-reference user activity logs for initiated processes leading to the flagged events and determine if there’s a pattern of unauthorized behavior or if it aligns with expected administrative tasks.

  - **Assess Registry Key Changes:** Validate any recent changes to relevant registry paths (such as Run keys) according to the `.reg` file import. Ensure these modifications do not enable unwanted software or settings.

  - **Look for Correlated Activity:** Review for other detections involving registry modification or lateral movement activities that could indicate a more extensive attack. Investigate related alerts from companion detection ID: 73bba97f-a82d-42ce-b315-9182e76c57b1 for enhanced context.

  ### Prioritization

  This alert should be regarded as medium severity due to the potential impact on system security. While the presence of `reg.exe` can indicate routine administrative tasks, the specific context of registry changes from suspicious paths raises concerns about the likelihood of malicious intent. This behavior is often weaponized in targeted attack scenarios.

  ### Blind Spots and Assumptions

  Detection capabilities can be limited by system permissions or legitimate administrative activities that may mirror the alert’s criteria. Ensure logging for processes like `reg.exe` is enabled and properly configured to capture command-line details reliably. Legitimate use may include routine maintenance or software installations that alter the registry. An effective companion detection would involve monitoring for subsequent system behavior changes following registry imports to strengthen overall visibility into potential misuse.

