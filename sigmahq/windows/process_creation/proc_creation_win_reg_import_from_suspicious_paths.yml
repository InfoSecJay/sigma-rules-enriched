detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli:
    CommandLine|contains: ' import '
  selection_paths:
    CommandLine|contains:
    - 'C:\Users\'
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
    - '\AppData\Local\Temp\'
    - 'C:\Windows\Temp\'
    - 'C:\ProgramData\'
  condition: all of selection_*
falsepositives:
- Legitimate import of keys
level: medium
note: |
  ### Technical Context

  This rule detects the importation of registry files using the `reg.exe` utility from suspicious paths, such as user profile directories or temporary folders. Attackers may utilize this behavior as part of post-exploitation tactics to persist or maintain access by modifying system settings or adding malicious entries. The relevant MITRE ATT&CK tactic is persistence, specifically technique T1112 (Modify Registry).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1 logs capturing process execution details. If malicious, the security impact could include unauthorized configuration changes, installation of malware, or the creation of persistence mechanisms. This detection does NOT confirm that the observed registry import is malicious on its own; legitimate imports may also occur without any harmful intent.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for `reg.exe` execution details. Look for CommandLine containing `'import '` and originating from suspicious paths (e.g., `%temp%`, `C:\Users\`). Legitimate imports may also appear here, such as from known applications or system maintenance tasks.

  - **Validate command line arguments:** Analyze the CommandLine field associated with `reg.exe`. Malicious indicators include unauthorized registry paths or unusual content within the `.reg` file indicating potential changes to security settings or user privileges.

  - **Examine Registry modifications:** Use Sysmon logs to query for recent changes in the Windows Registry that correlate with the detected activity. Focus especially on keys related to startup entries or system configurations, which could indicate persistence.

  - **Cross-reference with user activity:** Review user activity related to the affected account in the logs (Event ID 4624). Identify if the user has a history of legitimate imports or if this is an anomaly.

  - **Identify known benign applications:** Look for documented instances or lists of legitimate software that historically utilizes `reg.exe` for registry modifications to differentiate between an expected behavior and potential malicious activity.

  ### Prioritization

  The medium severity of this alert is due to its potential impact on critical system configurations and the likelihood of being exploited for adversarial persistence. Additionally, modifying the registry is a common technique leveraged by attackers to maintain access.

  ### Blind Spots and Assumptions

  This detection may miss instances where `reg.exe` is run from non-suspicious paths or with benign intentions. Log sources must include full command line arguments to ensure comprehensive coverage. Legitimate actions that may trigger the alert include system maintenance tasks or application installations that require registry modifications. A companion detection to consider is monitoring for unusual activity in Windows Event ID 4657 (Registry value modified) to strengthen overall coverage of unauthorized registry changes.

