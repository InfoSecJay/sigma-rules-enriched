note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows registry for internal tools settings, particularly those used to disable security features or utilities like Task Manager and Command Prompt. The likely attacker objective is to evade detection and maintain persistence on the system. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and technique **Modify Registry** (T1112). The primary telemetry sources for this detection are Windows process creation logs, particularly **Event ID 4688** (Process Creation) and command line arguments. If malicious, these modifications can lead to increased risk of undetected persistent threats. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate usage of registry modifications for system management can trigger the same alert.

  ### Investigation Steps

  - **Examine Process Creation Events:** Review Windows Security Event ID **4688** for instances where `reg.exe` was invoked. Check for unusual parent processes or execution paths that could indicate malicious activity.

  - **Analyze Command Line Arguments:** Inspect the CommandLine field associated with the Event ID 4688. Look for commands containing `add` along with paths related to **`SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer`** or **`Policies\System`** which are indicative of tampering with security settings.

  - **Confirm Legitimate Behavior:** Ensure the usage of `reg.exe` is consistent with approved system administration practices. Document any known, benign registry modifications performed by IT personnel.

  - **Identify Malicious Indicators:** Check for specific registry keys commonly targeted for modifications, such as `ConsentPromptBehaviorAdmin` or `DisableTaskmgr`. An entry in the command line with any of these values is a strong indicator of malicious tampering.

  - **Correlate with Existing Security Alerts:** Review other detections or alerts from tools such as EDR and SIEM for correlated signs of malicious behavior, especially around the same time these registry modifications occurred.

  - **Review System Impact:** Evaluate the criticality of the affected host systems to prioritize remediation. Focus on endpoints with sensitive data or administrative privileges.

  ### Prioritization

  The severity of this alert is medium due to the criticality of affected internal tools and their potential use in circumventing security controls. This behavior is often leveraged by attackers aiming for persistence and evasion, making it a noteworthy indicator in an enterprise environment.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions which could expose the environment to false positives. Specific logging configurations for process creation must be enabled to reliably capture the necessary data. Additionally, benign modifications for software updates or system configurations can trigger this alert. A companion detection could include tracking software installations or changes in software configurations to enhance overall visibility of potential threats.

