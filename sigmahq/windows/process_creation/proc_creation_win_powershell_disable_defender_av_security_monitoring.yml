title: Disable Windows Defender AV Security Monitoring
id: a7ee1722-c3c5-aeff-3212-c777e4733217
status: test
description: Detects attackers attempting to disable Windows Defender using 
  Powershell
references:
- https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
- https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: 'ok @securonix invrep-de, oscd.community, frack113'
date: 2020-10-12
modified: 2022-11-18
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_binary:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains:
    - '-DisableBehaviorMonitoring $true'
    - '-DisableRuntimeMonitoring $true'
  selection_sc_binary:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sc_tamper_cmd_stop:
    CommandLine|contains|all:
    - 'stop'
    - 'WinDefend'
  selection_sc_tamper_cmd_delete:
    CommandLine|contains|all:
    - 'delete'
    - 'WinDefend'
  selection_sc_tamper_cmd_disabled:
    CommandLine|contains|all:
    - 'config'
    - 'WinDefend'
    - 'start=disabled'
  condition: all of selection_pwsh_* or (selection_sc_binary and 1 of 
    selection_sc_tamper_*)
falsepositives:
- 'Minimal, for some older versions of dev tools, such as pycharm, developers were
  known to sometimes disable Windows Defender to improve performance, but this generally
  is not considered a good security practice.'
level: high
note: |
  ### Technical Context

  This detection rule identifies attempts to disable Windows Defender Antivirus (AV) through PowerShell or Service Control (sc) commands—behaviors often associated with malicious actors attempting to evade detection mechanisms. The likely objective of an attacker is to neutralize antivirus protections to deploy further malicious tools or payloads undetected. This activity falls under the MITRE ATT&CK tactic of Defense Evasion (T1562) using the technique of Disable or Modify Tools (T1562.001).

  The primary telemetry sources are Windows process creation events, specifically monitoring for processes like PowerShell (Event ID 4688) and sc.exe. If malicious, successfully disabling Windows Defender could allow an attacker to execute malware without detection. Importantly, this detection does NOT confirm that a successful breach or compromise has occurred; it only highlights attempts to manipulate the security environment.

  ### Investigation Steps

  - **Review PowerShell command execution:** Check for Event ID 4688 entries involving PowerShell where CommandLine contains `-DisableBehaviorMonitoring` or `-DisableRuntimeMonitoring`. Look for unusual execution contexts like running from a non-standard directory, which could indicate malicious intent.

  - **Inspect Service Control (sc.exe) activity:** Look for Event ID 4688 where sc.exe is executed, and confirm if the CommandLine contains `stop WinDefend`, `config WinDefend start=disabled`, or `delete WinDefend`. Legitimate system maintenance should not involve these commands.

  - **Identify high-risk processes:** Verify if any suspicious processes were initiated around the same time as the alert, focusing on unusual parent-child relationships (e.g., PowerShell spawned by uncommon executables).

  - **Establish baseline behavior:** Review recent legitimate activities from known administrative users or support personnel. Legitimate disablement of Windows Defender is rare and usually accompanied by other administrative actions; ensure the user has valid reasoning.

  - **Correlate with external threat intelligence:** Cross-reference alert timestamps with known threat actor activity from resources like the NCC Group and external feeds that may report on similar tactics used by active ransomware like WastedLocker.

  ### Prioritization

  This alert carries a high severity level due to the potential impact of disabling Windows Defender on a critical asset, directly increasing the risk of malware installation. The likelihood of this behavior being malicious is significant, as attackers routinely attempt to disable security tools. Given its association with various documented attack methodologies, it is a behavior that can lead to serious compromises if left unchecked.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if logging settings are not appropriately configured to capture all relevant process creations. Additionally, advanced adversaries may employ obfuscation techniques or run commands in ways that evade detection, such as through scheduled tasks or scripting environments. Furthermore, legitimate administrative tasks occasionally involve disabling real-time defenses for software testing purposes, which may trigger these alerts. A companion detection rule aimed at monitoring for other command-line-based modifications to security tools could enhance coverage.

