title: Disable Windows Defender AV Security Monitoring
id: a7ee1722-c3c5-aeff-3212-c777e4733217
status: test
description: Detects attackers attempting to disable Windows Defender using Powershell
references:
- https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
- https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: 'ok @securonix invrep-de, oscd.community, frack113'
date: 2020-10-12
modified: 2022-11-18
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_binary:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains:
    - '-DisableBehaviorMonitoring $true'
    - '-DisableRuntimeMonitoring $true'
  selection_sc_binary:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sc_tamper_cmd_stop:
    CommandLine|contains|all:
    - 'stop'
    - 'WinDefend'
  selection_sc_tamper_cmd_delete:
    CommandLine|contains|all:
    - 'delete'
    - 'WinDefend'
  selection_sc_tamper_cmd_disabled:
    CommandLine|contains|all:
    - 'config'
    - 'WinDefend'
    - 'start=disabled'
  condition: all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)
falsepositives:
- 'Minimal, for some older versions of dev tools, such as pycharm, developers were
  known to sometimes disable Windows Defender to improve performance, but this generally
  is not considered a good security practice.'
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to disable Windows Defender's security monitoring capabilities via PowerShell or the Service Control (sc.exe) command. Attackers may seek to disable these security features to deploy malware undetected, allowing them to execute their tactics, such as data exfiltration, ransomware deployment, or lateral movement within the network. By disabling Windows Defender, adversaries aim to reduce the security barriers protecting the endpoint, making it easier to execute malicious payloads.

  The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and Disable or Modify Tools (T1562.001). These tactics enable adversaries to bypass defensive tools and enhance their chances of success during an attack. Primary data sources for detecting such behavior include process creation events that record command-line arguments and the execution of security control commands, allowing security teams to detect suspicious changes to the Windows Defender configuration.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances of `powershell.exe` or `sc.exe` with command-line arguments that include disabling monitoring features for Windows Defender, such as `-DisableBehaviorMonitoring $true` or relevant `sc.exe` commands.
  - **Correlate with Endpoint Activities:** Investigate whether the disabling actions were preceded by suspicious activities on the endpoint, such as unauthorized access attempts or previous malware detections.
  - **Check for Unusual User Accounts:** Identify if the command was executed by unexpected or unauthorized user accounts, especially those lacking administrative privileges or those not usually associated with security configurations.
  - **Validate System Integrity:** Conduct a review of endpoint security settings and configurations to confirm whether Windows Defender was genuinely disabled and assess the potential impact on overall endpoint security.

  ### Prioritization
  This alert should be prioritized as high severity due to the significant implications of disabling critical security features like Windows Defender, which can expose the enterprise environment to various cyber threats, including ransomware and advanced persistent threats.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where Windows Defender is entirely absent or replaced with other antivirus solutions. The detection logic assumes that command-line executions relevant to disabling monitoring will be logged, requiring that certain logging configurations be enabled in the Windows environment. Additionally, false positives may occur in situations where legitimate development tools, such as integrated development environments (IDEs), momentarily alter security configurations, though such practices are discouraged.

