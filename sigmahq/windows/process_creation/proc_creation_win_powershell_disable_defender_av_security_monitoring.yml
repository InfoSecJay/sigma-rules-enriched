title: Disable Windows Defender AV Security Monitoring
id: a7ee1722-c3c5-aeff-3212-c777e4733217
status: test
description: Detects attackers attempting to disable Windows Defender using 
  Powershell
references:
- https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
- https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: 'ok @securonix invrep-de, oscd.community, frack113'
date: 2020-10-12
modified: 2022-11-18
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_binary:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains:
    - '-DisableBehaviorMonitoring $true'
    - '-DisableRuntimeMonitoring $true'
  selection_sc_binary:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sc_tamper_cmd_stop:
    CommandLine|contains|all:
    - 'stop'
    - 'WinDefend'
  selection_sc_tamper_cmd_delete:
    CommandLine|contains|all:
    - 'delete'
    - 'WinDefend'
  selection_sc_tamper_cmd_disabled:
    CommandLine|contains|all:
    - 'config'
    - 'WinDefend'
    - 'start=disabled'
  condition: all of selection_pwsh_* or (selection_sc_binary and 1 of 
    selection_sc_tamper_*)
falsepositives:
- 'Minimal, for some older versions of dev tools, such as pycharm, developers were
  known to sometimes disable Windows Defender to improve performance, but this generally
  is not considered a good security practice.'
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable Windows Defender through PowerShell and Service Control (sc.exe) commands. The likely attacker objective is to impair endpoint security measures, facilitating further malicious activity such as malware deployment or persistence. This behavior fits into the MITRE ATT&CK framework under the Defense Evasion tactic (ID: TA0025) and specifically targets the Disable or Modify Tools technique (ID: T1562.001).

  Primary telemetry sources include Windows process creation events (Event ID 4688) and PowerShell logs (Event ID 4104). If malicious, this behavior can lead to a compromised system that is vulnerable to malware infections and unauthorized data access. It is important to note that this detection does NOT confirm that a successful compromise has occurred; it merely indicates an action that may lower defenses.

  ### Investigation Steps

  - **Review PowerShell command usage:** Check Event ID 4688 for instances of power execution (e.g., `powershell.exe` or `pwsh.exe`). Look for command lines containing `-DisableBehaviorMonitoring $true` or `-DisableRuntimeMonitoring $true`. Legitimate activity may include script execution but typically will not attempt behavior monitoring alterations.

  - **Analyze service control commands:** Examine Event ID 4688 for `sc.exe` commands. Look for command line arguments such as `stop WinDefend`, `delete WinDefend`, or `config WinDefend start=disabled`. Malicious activity will show evidence of disabling the Windows Defender service, which should not be present in normal operations.

  - **Confirm user context:** Investigate the user account associated with the detected commands by reviewing the `SubjectUserName` field in the process creation logs. Activity from unexpected accounts, particularly those lacking administrative privileges, increases the likelihood of malicious intent.

  - **Check for additional lateral movement:** Review authentication logs (Event ID 4624) for any unusual login activity around the same timeframe. Lateral movement techniques often accompany attempts to disable security controls, potentially indicating a broader attack.

  - **Identify potential legitimate exceptions:** Document any occurrences of legitimate tools or operations that may have disabled Windows Defender (as noted in false positives). Compare against known development environments (e.g., specific IDEs) where such actions could occur, but emphasize these should be rare and monitored.

  ### Prioritization

  This alert is of high severity due to the potential impact on endpoint security and the likelihood of abuse by adversaries, particularly in targeted attacks. This behavior is commonly weaponized by various threat actors to facilitate malware infections or ransomware attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use alternative methods or silent execution to disable defenses without leaving clear artifacts. The requirement for reliable auditing includes ensuring that both PowerShell and Process Creation logging are enabled. Legitimate activities may include old development tools disabling Windows Defender, but they should be uncommon in a secure environment. A companion detection that strengthens coverage includes monitoring for potentially malicious script execution patterns (e.g., lateral movement or privilege escalation).

