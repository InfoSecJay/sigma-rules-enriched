note: |
  ### Technical Context

  This Sigma rule detects potentially malicious activities involving the WMI class `Win32_NTEventlogFile`, particularly when methods such as backing up, deleting, or changing permissions are invoked via PowerShell scripts. The behavior detected may indicate an attempt to manipulate or obscure event logs, which is a common tactic used by attackers during lateral movement or to cover tracks after carrying out malicious actions.

  The relevant MITRE ATT&CK technique is **Defense Evasion (T1561)**, specifically targeting techniques such as *Impair Defenses* (T1561.001). The primary telemetry sources are Windows process creation logs, specifically **Event ID 4688** for process creation and **Sysmon Event ID 1** for detailed command-line auditing. If malicious, this behavior can result in the successful deletion or alteration of security logs, hindering incident detection and response. This detection does NOT confirm nefarious intent on its own, as legitimate administrative tasks may involve similar actions.

  ### Investigation Steps

  - **Review command line arguments**: Investigate any process creation events (Event ID 4688) with command lines containing `Win32_NTEventlogFile` along with suspicious methods like `.ClearEventLog(` or `.Delete(`. Look for quotes or flags indicating unusual scripting activity.

  - **Check for legitimate administrative actions**: Assess whether PowerShell scripts using WMI are tied to known IT operations. Look for documentation, ticketing system entries, or process workflows that validate normal use of log management.

  - **Verify account context and elevation**: Identify the account context used for executing the suspicious PowerShell commands. Ensure that the user account has legitimate authorization and was not running with elevated privileges (e.g., through **Event ID 4672** for special privileges).

  - **Look for related event ID indicators**: Cross-reference any suspicious actions with **Windows Event ID 1102**, indicating that the event log was cleared. This should correlate with any log manipulation attempts.

  - **Check for external remote access or automation**: Examine logs for remote management or external tool usage, such as **Event IDs 7045 or 800** for service creation. Look for signs of remote desktop (RDP) connections or unauthorized script executions.

  ### Prioritization

  This alert is high priority due to the potential impact of altered or deleted event logs on incident detection and response capabilities. The likelihood of malicious abuse is significant, as attackers often employ these methods to obscure their activities. The behavior is commonly weaponized in attack scenarios aiming to impair security defenses.

  ### Blind Spots and Assumptions

  Detection may be limited if WMI logging is disabled or if relevant Event IDs are not captured. Attackers might also employ legitimate administrative scripts or tools, raising the risk of false positives. It is critical to verify that WMI logging is enabled and monitored for effective detection. A related detection that enhances coverage is identifying event log manipulation through scheduled tasks or unusual processes (e.g., via **Event ID 4697**, indicating a service installation).

