note: |
  ### Technical Context
  This rule detects potentially suspicious interactions with the Windows Management Instrumentation (WMI) class `Win32_NTEventlogFile`, specifically through PowerShell scripts. The specific interactions targeted—such as backing up, deleting, or changing permissions on event logs—are often indicative of an attacker attempting to manipulate or erase evidence of their activity. Attackers may leverage these operations to cover their tracks or disable logging on a compromised system, lending to stealthy lateral movement or persistence tactics.

  The likely objectives of an attacker exploiting this rule include altering log accessibility or content to avoid detection by security monitoring systems. The associated MITRE ATT&CK tactics include **Defense Evasion (T1560)**, which pertains to the manipulation of logs to avoid detection, and **Credential Access (T1003)**, especially if attackers change permissions to gain unauthorized access. Relevant techniques utilized in this context may involve **T1070.001** (Indicator Removal on Host: Clear Logs).

  Primary data sources for this alert include **process creation logs** that capture execution details and command arguments linked to WMI queries. Monitoring for such logs can significantly aid in the detection of abnormal and unauthorized activities related to the event logs.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look into the process creation events to identify instances where PowerShell scripts were executed and inspect their command line arguments for the use of `Win32_NTEventlogFile`.
  - **Analyze WMI Event Logs**: Investigate the WMI logs for entries related to the `Win32_NTEventlogFile`, focusing on actions like `.BackupEventlog`, `.Delete`, or `.ClearEventLog` that indicate potential tampering.
  - **Check for Event Log Anomalies**: Examine the Windows Event Logs for irregularities or sudden drops in logged events that might correlate with the suspicious WMI commands detected.
  - **Verify PowerShell Script Origins**: Correlate the identified PowerShell usage with known script repositories; check for any unauthorized modifications or usage outside typical operational patterns.

  ### Prioritization
  Given the high potential impact of an attacker manipulating event logs to conceal their activities, this alert is prioritized as high severity. The likelihood of exploitation is significant, especially in environments where logging is essential for monitoring and compliance.

  ### Blind Spots and Assumptions
  There may be gaps in detecting more sophisticated obfuscation techniques if attackers employ other means to alter logs or evade detection beyond simple manipulation of the `Win32_NTEventlogFile` class. One assumption made by the detection logic is that all PowerShell scripts are logged sufficiently, which may not be the case if logging policies are not enforced or configured correctly. Furthermore, effective logging from PowerShell and WMI may need to be explicitly enabled to capture the requisite telemetry for this alert to perform properly.

