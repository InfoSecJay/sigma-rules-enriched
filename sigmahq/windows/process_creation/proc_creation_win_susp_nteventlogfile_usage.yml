  ### Technical Context

  This Sigma rule detects suspicious PowerShell commands interacting with the Win32_NTEventlogFile WMI class, specifically actions such as backing up, modifying, clearing, or deleting event logs. Attackers often target Windows Event logs to evade detection, and these actions may indicate an objective to hide malicious activities, maintain persistence, or manipulate system logging for nefarious purposes.

  The relevant MITRE ATT&CK technique is **"T1070.001 – Indicator Removal on Host: Clear Logs"**. The primary telemetry sources include process creation logs from Windows, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, which detail command line executions and process activity. If malicious, the actions taken can lead to significant security risks, such as compromised visibility into system activities, allowing attackers to operate without detection. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review the process creation logs for suspicious PowerShell commands**: Check for Event ID 4688 or Sysmon Event ID 1 entries. Look for command line parameters containing `Win32_NTEventlogFile`, particularly those including `.ClearEventLog(` or `.Delete(`.

  - **Check the execution context of the PowerShell process**: Note the user account and privilege levels used to execute the command. Legitimate system administration tasks may come from known administrative accounts. Any execution from a low-privilege user could be more concerning.

  - **Cross-reference execution with Windows Event logs**: Examine logs for entries around the time of the suspicious command to identify if any logs were indeed cleared or deleted, indicating possible malicious intent. Review Event IDs 1102 (Event log cleared) for confirmation.

  - **Identify any abnormal scheduling activity**: Look for Task Scheduler entries that may relate to the PowerShell scripts being executed, using `Task Scheduler` under Application Event IDs 106 (Task created) and 101 (Task started). Unusual or unauthorized tasks indicate potentially malicious behavior.

  - **Validate network activity associated with the executing process**: Examine network logs for any outbound connections made by processes executing PowerShell commands. This could reveal communication with C2 servers if the perceived activity is malicious.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on system integrity and the likelihood that attackers may use such methods to evade detection. The manipulation of Event logs is a common technique in various attack methods, indicating a significant risk to the environment if verified as malicious.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded by skilled attackers using different methods or tools to alter Event logs without triggering this alert. Ensuring that the proper logging configurations are in place is essential for reliability, particularly enabling WMI and process creation logs. Be aware that legitimate scripts run by security software or administrative tasks may trigger this alert. A complementary detection to reference includes monitoring for **T1070.002 – Indicator Removal on Host: File and Directory Permissions Modification**, which can provide additional context on access control changes related to Event logs.

