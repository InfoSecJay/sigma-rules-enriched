note: |
  ### Technical Context

  This rule detects suspicious interactions with the WMI class `Win32_NTEventlogFile`, which includes actions like deleting, backing up, or changing permissions on event logs via PowerShell scripts. The likely attacker objective is to manipulate or delete logs to cover malicious activity, evade detection, or disrupt monitoring capabilities. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (TA060) and the technique of Event Log Clearing (T1070.001).

  The primary telemetry sources involved are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the action could lead to the removal of crucial audit trails, effectively hindering incident response and forensic investigations. It is important to note that this detection alone does NOT confirm malicious intent; it could also result from benign administrative activities.

  ### Investigation Steps

  - **Review associated process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for commands that contain `Win32_NTEventlogFile` and the listed suspicious functions (e.g., `.Delete(`, `.ClearEventLog(`).

  - **Identify usage patterns:** Determine whether the command was executed by an expected administrative user or service account or by an unauthorized entity. Consult the `Account Name` and `User ID` fields for analysis.

  - **Inspect for legitimate administrative actions:** Verify if the user has a legitimate reason for performing this action, such as event log maintenance from known administrative scripts or tools, especially on critical systems.

  - **Correlate with additional log sources:** Check for related logs, such as Security Event ID 4697 (and other log manipulation indicators) or Windows Management Instrumentation (WMI) operational logs to identify potential misuse.

  - **Look for known malicious indicators or behaviors:** Investigate if any process making the call has previously been reported in threat intelligence feeds or exhibits known malicious behavior like running from unusual locations (e.g., temp directories).

  ### Prioritization

  The alert severity is high due to the potential impact of losing critical event logs, which can prevent detection of further malicious activities. The likelihood of exploitation through this technique is significant, as attackers frequently seek to erase their tracks following an intrusion. This tactic is commonly weaponized in attacks to deflect scrutiny and maintain persistence.

  ### Blind Spots and Assumptions

  This detection can be evaded if attackers use alternative methods to interact with event logs or if legitimate administrative tools are misused. Reliable detection requires that WMI logging is enabled, along with ensuring proper event log settings in Windows. Legitimate scheduled tasks or well-known maintenance scripts may also trigger this alert. Companion detections, such as monitoring for unusual PowerShell execution patterns or alerting on changes to user roles (increased permissions), can strengthen overall coverage.

