title: RDP Port Forwarding Rule Added Via Netsh.EXE
id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
status: test
description: Detects the execution of netsh to configure a port forwarding of 
  port 3389 (RDP) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
author: Florian Roth (Nextron Systems), oscd.community
date: 2019-01-29
modified: 2023-02-13
tags:
- attack.lateral-movement
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' i'
    - ' p'
    - '=3389'
    - ' c'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context

  This rule detects the execution of netsh.exe to create a port forwarding rule directing traffic to port 3389, which is used for Remote Desktop Protocol (RDP) connections. The likely attacker objective is to bypass network restrictions allowing remote access to compromised systems for lateral movement or command and control purposes. This detection corresponds to the MITRE ATT&CK tactic of Lateral Movement (TA0008) and the technique T1090 (Proxy). The primary telemetry sources are Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1 logs. If malicious, this behavior can enable unauthorized RDP access to internal systems, opening pathways for further exploitation. This detection does NOT confirm that the rule was executed for malicious intent, as it may also be used in legitimate administrative tasks.

  ### Investigation Steps

  - **Check the Command Line Execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for any instances of netsh.exe with command line arguments containing ' i', ' p=3389', and ' c'. Look for anomalies or unusual source accounts that could indicate malicious behavior.

  - **Validate Legitimate Use Cases:** Identify recent legitimate administrative activities, such as RDP setups or maintenance tasks performed by IT staff, especially on server-class machines or assets critical to operations. Confirm that these users had a valid business need for RDP access.

  - **Scrutinize Related Port Forwarding Rules:** Examine for existing port forwarding configurations on the device using PowerShell or netsh commands. This may include commands like `netsh interface portforward show` to confirm if this is the only rule being created or if it’s part of a series of changes.

  - **Monitor for Follow-Up Activities:** Investigate any subsequent process executions to see if RDP connections (Event ID 4624 or TCP connection logs) are being made after the port forwarding was set up. Look for unusual characteristics in the connections, such as IP addresses or user agents that don’t match typical use patterns.

  - **Cross-Reference with Firewall Logs:** Check firewall logs to determine if any connections were made to port 3389 from outside the network after the netsh command was executed. Look for external IP addresses and periods of connection attempts.

  ### Prioritization

  This alert has high severity due to the critical nature of RDP in enterprise environments. If exploited, it poses a substantial risk by allowing unauthorized access to sensitive internal systems, a common target for attackers seeking to move laterally within networks. Furthermore, the usage of netsh for this purpose is indicative of potential malicious activity as it suggests circumvention of security controls.

  ### Blind Spots and Assumptions

  Detection may be evaded if an attacker uses legitimate administrative accounts or tools masquerading as benign usage. Reliable detection requires proper logging configurations for both process creation and network activity. Legitimate administrative tasks, such as setting up RDP access for remote workers, may trigger this alert. Companion detections include monitoring successful RDP connections to assess whether the port forwarding leads to unauthorized access attempts.

