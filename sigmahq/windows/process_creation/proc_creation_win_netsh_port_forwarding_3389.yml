title: RDP Port Forwarding Rule Added Via Netsh.EXE
id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
status: test
description: Detects the execution of netsh to configure a port forwarding of port
  3389 (RDP) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
author: Florian Roth (Nextron Systems), oscd.community
date: 2019-01-29
modified: 2023-02-13
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' i'
    - ' p'
    - '=3389'
    - ' c'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context
  This rule detects the use of the `netsh.exe` utility to configure port forwarding for Remote Desktop Protocol (RDP) on port 3389. By creating a port forwarding rule through `netsh`, an attacker may aim to bypass network security controls or exfiltrate data through an unauthorized RDP connection. This technique may be leveraged in lateral movement scenarios within a compromised network, allowing attackers to gain additional access points to internal systems, facilitating further exploitation or data theft.

  The related MITRE ATT&CK tactics and techniques include:
  - Lateral Movement (TA-0036) - where attackers attempt to move through the network after initial access.
  - Defense Evasion (TA-0005) - when attackers try to evade detection by manipulating existing network rules.
  - Command and Control (TA-0011) - where attackers establish a method to communicate back from compromised systems.

  Primary data sources include process creation events that document the execution of `netsh.exe`, particularly monitoring command-line arguments that indicate port manipulation involving RDP.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate recent process creation logs for instances of `netsh.exe`. Pay close attention to the command-line arguments used, particularly those containing `p=3389`.
  - **Examine Network Traffic:** Analyze network traffic for any unusual RDP connections. Look for patterns of behavior that may indicate unauthorized remote access or tunneling activities.
  - **Query Firewall Logs:** Examine firewall logs to identify any new inbound RDP connections, particularly from unexpected IP addresses or network segments.
  - **Audit User Activity:** Review the activities of users who executed `netsh.exe`, focusing on their role and permissions, and whether legitimate administration responsibilities justify the use of RDP port forwarding.

  ### Prioritization
  The high severity of this alert is warranted in an enterprise environment due to the potential for significant threats posed by unauthorized RDP access. The likelihood of exploitation is elevated, given the prevalence of RDP as a target for attackers seeking lateral movement capabilities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly for legitimate administrative activities that also utilize `netsh.exe`. The detection logic assumes that all instances of port forwarding on port 3389 using `netsh.exe` are malicious, which may not account for legitimate use cases in some environments. Required logging includes process creation details with comprehensive command-line arguments, ensuring the visibility necessary for accurate detection and response.

