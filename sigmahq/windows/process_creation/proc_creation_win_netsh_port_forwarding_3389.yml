title: RDP Port Forwarding Rule Added Via Netsh.EXE
id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
status: test
description: Detects the execution of netsh to configure a port forwarding of 
  port 3389 (RDP) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
author: Florian Roth (Nextron Systems), oscd.community
date: 2019-01-29
modified: 2023-02-13
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' i'
    - ' p'
    - '=3389'
    - ' c'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `netsh.exe` to configure port forwarding for RDP (Remote Desktop Protocol) on port 3389, indicating a potential evasion technique employed by an attacker to bypass network restrictions. The likely objective of an attacker leveraging this behavior is to create a covert and accessible RDP endpoint for lateral movement or remote access to compromised systems.

  The relevant MITRE ATT&CK tactics and techniques include "Lateral Movement" (T1076) and "Defense Evasion" (T1211). The primary telemetry source is the Windows process creation logs, specifically focusing on Event ID 4688, which provides information about the process creation, including command-line arguments which can help identify the use of port forwarding commands.

  If malicious, this behavior could facilitate unauthorized access to sensitive systems, allowing attackers broader control over the environment. However, this detection does NOT confirm that an attack is occurring on its own; legitimate administrative tasks can also create similar logs.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `netsh.exe` execution. Look specifically for command lines that include `-p=3389` to confirm port forwarding activity.

  - **Analyze command-line arguments:** If `netsh.exe` is running with arguments indicating port forwarding (e.g., `i p=3389 c`), correlate this with historical administrative procedures to determine if the command was executed during a maintenance window or during regular hours.

  - **Verify expected administrative behavior:** Identify if there is a legitimate operational need for port 3389 port forwarding. Consult with sysadmins or related documentation to verify that the activity aligns with normal RDP usage patterns and security policies.

  - **Correlate user context:** Identify the user account that executed the `netsh.exe` command. Review their role and assess whether they typically engage in network configuration changes. This will help in determining if the activity is suspicious.

  - **Cross-reference network logs:** Review firewall logs or network access logs to detect any unusual inbound connections targeting port 3389 after the rule addition. Look for anomalous IP addresses or external access attempts that coincide with the port forwarding rule being set.

  - **Identify anomalies in RDP sessions:** Check logs for any unauthorized RDP sessions that may correlate with the timing of the port forwarding rule creation. Questions to consider: Were there logins from non-typical locations or outside normal operational hours?

  ### Prioritization

  The alert has high severity due to the direct correlation with potential unauthorized access to critical systems. Given that attackers commonly exploit RDP for lateral movement, any configuration that allows external access is of significant concern. The detection should be escalated, especially if the affected system holds sensitive data or critical infrastructure services.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative activities that require temporary port forwarding configurations. It is essential that sufficient logging capabilities are enabled, particularly for Windows Security logs, to ensure comprehensive monitoring. Additionally, users with valid administrative privileges may trigger this alert during standard operations, making context essential in analysis. A related detection for anomalous RDP login attempts could enhance the coverage and validate potential threats linked to this activity.

