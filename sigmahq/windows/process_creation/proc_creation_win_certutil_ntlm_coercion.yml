detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -syncwithWU '
    - ' \\\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_ntlm_coercion/info.yml
note: |
  ### Technical Context
  This detection rule is designed to identify potential NTLM coercion attacks that may be exploited using `certutil.exe` with the `-syncwithWU` flag. NTLM coercion is a tactic where an attacker can manipulate NTLM authentication in such a way to capture the NTLM hash of a user, potentially leading to unauthorized access or lateral movement within a network. The likely objective of an attacker employing this technique is to exploit the trust relationship established through NTLM authentication protocols, thereby gaining access to sensitive information and compromising user accounts.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1203), which is employed to bypass defenses and stealthily execute commands, as well as **Command and Control** (T1218), where attackers may leverage built-in system tools to maintain their presence. These tactics are crucial as they highlight the methods by which attackers try to evade detection while accomplishing their objectives.

  Key telemetry sources for evidence include **process creation events** from Windows systems, which can provide insights into the usage of `certutil.exe`, and **command-line arguments** associated with its execution. This data is instrumental in identifying instances where the tool is used in an abnormal context that suggests malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events for instances of `certutil.exe` running, particularly focusing on the command line arguments to identify occurrences of `-syncwithWU`.

  - **Correlate with Network Traffic:** Analyze network traffic logs for unusual outgoing connections from the host initiating the `certutil.exe` command. Look for connections to SMB shares or unusual IP addresses that could indicate NTLM coercion attempts.

  - **Check User Context and Permissions:** Investigate the user account context in which `certutil.exe` was executed. Look for signs of unusual privilege escalation or accounts being used that typically should not run such commands.

  - **Audit Related Security Logs:** Inspect Windows Event Logs for any authentication failures related to NTLM, especially around the time when `certutil.exe` was executed, to identify potential exploitation or unauthorized access attempts.

  ### Prioritization
  The alert severity is rated as high because NTLM coercion can lead to significant security breaches, including credential theft and unauthorized access to sensitive areas of the network. The likelihood of such an attack being successful increases when built-in tools like `certutil.exe` are exploited, making prompt investigation critical.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility that attackers may obfuscate command line arguments or use alternative methods to leverage `certutil.exe` without the specific `-syncwithWU` flag. The detection logic assumes that all command usages of `certutil.exe` during the defined conditions should raise suspicion, but it may misclassify benign uses. Additionally, for the alert to function effectively, it is vital that process creation events and command line arguments are being logged appropriately within the security framework of the environment.

