level: high
note: |
  ### Technical Context
  This detection rule identifies potential execution of the SquiblyTwo technique, which utilizes Windows Management Instrumentation (WMI) to run malicious code remotely. Attackers exploiting this technique can leverage `wmic.exe` to bypass application whitelisting, executing harmful scripts without triggering traditional defenses. In such cases, the attacker may fetch malicious XSL (eXtensible Stylesheet Language) content from remote locations, executing it directly in memory while sidestepping disk-based detection mechanisms. This behavior is indicative of an advanced persistent threat (APT) tactic employed for evasive actions and code execution.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Defense Evasion** (T1027 - Obfuscated Files or Information)
  - **Execution** (T1059.005 - JScript; T1059.007 - VBS)
  - **Windows Management Instrumentation (WMI)** (T1047)

  The primary data sources for this detection are process creation events that log executions of systems commands, specifically focusing on WMI, and any associated HTTP/HTTPS traffic when the XSL content is fetched remotely.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Review logs for instances of `wmic.exe` execution, specifically looking for the matched hashes and command line arguments that indicate the fetching of remote scripts.

  - **Analyze Command Line Arguments:** Search for `wmic.exe` command lines that contain strings such as `'/format:'`, '://', or '\\\\' to identify potentially malicious WMI calls attempting to retrieve or execute embedded scripts.

  - **Verify Network Activity:** Investigate network logs for any unusual outbound connections made by the host after `wmic.exe` executions, especially to unexpected or untrusted domains serving XSL content.

  - **Review Associated Script Execution:** If applicable, examine system or application logs that may provide insight into any executed scripts or payloads that would result from the processed XSL content, confirming the execution and intent.

  ### Prioritization
  This alert carries a high severity due to the potential impact of remote code execution on enterprise systems. The likelihood of exploitation using SquiblyTwo is significant, especially given its stealthy nature and the capability to leverage existing binaries like `wmic.exe` for malicious objectives, making it crucial for immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if WMI logging is not comprehensively enabled or if filters are applied that exclude benign use cases of `wmic.exe`. The detection logic assumes that indicators like command-line usage, process names, and specific hashes accurately reflect malicious activity. Moreover, the effectiveness of this alert relies on the availability of detailed process creation logs and the integrity of the data sources being monitored.

