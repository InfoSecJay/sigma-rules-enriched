logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  - Hashes|contains:        # Sysmon field hashes contains all types
    - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
    - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
    - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
    - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
    - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cli:
    CommandLine|contains|windash: '/format:'
    CommandLine|contains:
    - '://'
    - '\\\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potential exploitation of the SquiblyTwo technique, where adversaries utilize Windows Management Instrumentation (WMI) commands to execute malicious code remotely. The likely attacker objective is to run code in memory without leaving traces on disk, thus evading traditional security measures like application whitelisting. This behavior aligns with the MITRE ATT&CK Tactics: **Execution** (T1203), **Defense Evasion** (T1220), and utilizes **Windows Management Instrumentation** (T1047). Primary telemetry sources include process creation logs (Event ID 4688 and Sysmon Event ID 1), which capture execution details of `wmic.exe` and associated command line arguments. Malicious activity can lead to compromised systems and unauthorized operations. Detection of this behavior does NOT confirm that the activity was malicious by itself; further investigation is required to assess intent and context.

  ### Investigation Steps

  - **Check the command line arguments for anomalies**: Look for command line executions involving `wmic.exe` (Security Event ID 4688 or Sysmon Event ID 1). Specifically, monitor for any usage of `'/format:'` or URLs (e.g., '://') indicating potential malicious remote content fetching.

  - **Investigate process parentage**: Evaluate the parent process of `wmic.exe` to determine if it was spawned by a legitimate application or service. Use Sysmon logs to identify process tree construction, focusing on unusual parent-child relationships.

  - **Validate the hashes of wmic.exe**: Cross-reference the process hashes against known malicious patterns in your threat intelligence database. Specifically look for `IMPHASH` values like `1B1A3F43BF37B5BFE60751F2EE2F326E`, which could indicate compromised or altered binaries.

  - **Correlate with network activity**: Examine outbound network connections made during the wmic execution (e.g., using firewall logs or network monitoring tools) to detect any HTTP/HTTPS requests to suspicious hosts that could correlate with the retrieval of XSL content.

  - **Determine typical usage patterns**: Compare with known legitimate use cases of WMI in your environment. Document the most common command line parameters and typical hosts or user accounts that invoke `wmic.exe`, so deviations can be quickly identified.

  - **Analyze recent changes in system configuration**: Review for any recent changes made to system settings or group policies that could impact the execution context of WMI commands, particularly those granting elevated privileges to users.

  ### Prioritization

  This alert should be prioritized as **high** due to the potential impact on sensitive systems and the likelihood of malicious behavior. The use of WMI for remote code execution is a known technique that attackers commonly leverage to prevent detection. Given its stealthy nature, prompt analysis is critical to mitigate potential threats.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging mechanisms; ensure Sysmon and Windows Auditing are properly set to capture all relevant events. Legitimate administrative tasks may trigger this alert, requiring context for accurate assessment. Additionally, adversaries may employ stealth techniques, such as using multiple WMI-related binaries or misconfiguring legitimate scripts to evade detection. A companion detection to consider is monitoring for unusual Azure or AWS API calls correlating to administrative tasks within cloud environments where similar WMI-based behaviors are used.

