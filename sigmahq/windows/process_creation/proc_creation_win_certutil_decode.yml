title: File Decoded From Base64/Hex Via Certutil.EXE
id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
status: test
description: Detects the execution of certutil with either the "decode" or 
  "decodehex" flags to decode base64 or hex encoded files. This can be abused by
  attackers to decode an encoded payload before execution
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://news.sophos.com/en-us/2021/04/13/compromised-exchange-server-hosting-cryptojacker-targeting-other-exchange-servers/
- https://twitter.com/JohnLaTwC/status/835149808817991680
- https://learn.microsoft.com/en-us/archive/blogs/pki/basic-crl-checking-with-certutil
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2023-02-15
modified: 2025-06-04
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash:
    - '-decode '         # Decode Base64
    - '-decodehex '         # Decode Hex
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_decode/info.yml
note: |
  ### Technical Context

  This rule detects the execution of `certutil.exe` with the "decode" or "decodehex" flags, indicating a potential attempt to decode malicious payloads encoded in Base64 or hexadecimal formats. Attackers may use this technique to obscure payloads from detection and subsequently execute them on the target system. This behavior maps to the MITRE ATT&CK technique "Obfuscated Files or Information" (T1027).

  The primary telemetry sources for this detection are process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing details about command-line arguments used during execution. If this behavior is malicious, it can lead to the installation of malware or the execution of a harmful script. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities also utilize `certutil.exe` for valid certificate management tasks.

  ### Investigation Steps

  - **Review process creation logs:** Look for Security Event ID 4688 or Sysmon Event ID 1 associated with `certutil.exe`. Check `CommandLine` for the presence of flags `-decode ` or `-decodehex ` for both benign and malicious indicators. Legitimate uses will typically not involve these flags used in conjunction with suspicious paths or files.

  - **Verify command-line arguments:** Examine the `CommandLine` field for known malicious patterns or base64/hex encoded strings. High-confidence malicious indicators include extensive command line parameters that attempt to decode large payloads or obfuscated strings, which are atypical for legitimate certificate management.

  - **Correlate with file creation events:** Investigate if the decoding process created or manipulated files. Check for any recent file creation events (Event ID 11 for file system) in conjunction with the decoded payload. Inspect for files in `%TEMP%` or other user directories that are recently altered or created.

  - **Cross-reference with network activity:** Look at DNS or proxy logs for attempts to communicate with external domains shortly after the `certutil.exe` execution (e.g. HTTP requests or outbound connections). Malicious activity often correlates with network communication to command-and-control infrastructure.

  - **Assess asset criticality:** Identify the host executing `certutil.exe` and its role within the organization. If it belongs to high-value assets (e.g., a domain controller), escalate the incident accordingly.

  - **Investigate surrounding activity:** Review logs before and after the `certutil.exe` execution to identify any suspicious activity, such as unexpected process creation or changes in user privileges, which could suggest an escalated attack.

  ### Prioritization

  This alert should be classified as high severity due to the potential for significant impact on affected systems, especially if critical infrastructure is involved. The likelihood of malicious usage is elevated, as decoding techniques are often associated with malware delivery and execution workflows.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of evasion techniques, like modifying the command line or invoking `certutil.exe` from a different context, reducing visibility in logs. Required telemetry includes adequate logging configurations for process creation and changes, specifically with command line details. Legitimate activities, such as administrative operations involving certificate deployment or management, may trigger this alert. A companion detection could include monitoring for unusual PowerShell commands (T1086), as attackers often use a combination of techniques to execute payloads.

