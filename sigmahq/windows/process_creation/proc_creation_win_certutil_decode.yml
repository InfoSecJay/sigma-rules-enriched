title: File Decoded From Base64/Hex Via Certutil.EXE
id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
status: test
description: Detects the execution of certutil with either the "decode" or 
  "decodehex" flags to decode base64 or hex encoded files. This can be abused by
  attackers to decode an encoded payload before execution
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://news.sophos.com/en-us/2021/04/13/compromised-exchange-server-hosting-cryptojacker-targeting-other-exchange-servers/
- https://twitter.com/JohnLaTwC/status/835149808817991680
- https://learn.microsoft.com/en-us/archive/blogs/pki/basic-crl-checking-with-certutil
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2023-02-15
modified: 2025-06-04
tags:
- attack.stealth
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash:
    - '-decode '         # Decode Base64
    - '-decodehex '         # Decode Hex
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_decode/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `certutil.exe` with the decode or decodehex parameters, which are used to decode base64 or hex encoded files. The likely attacker objective is to decode a payload that is being staged for execution or further manipulation, reflecting a common tactic in malware deployment processes. This behavior aligns with MITRE ATT&CK technique T1027 (Obfuscated Files or Information), specifically within the execution phase.

  The primary telemetry sources for this detection include Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which track process execution details. Should this behavior be found to be malicious, the potential security impact includes unauthorized data access, system compromise, or lateral movement. It is critical to note that this detection alone does not confirm malicious intent; `certutil.exe` can also be used for legitimate administrative tasks, such as managing certificates.

  ### Investigation Steps

  - **Check event logs for certutil executions**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `certutil.exe`, focusing on CommandLine arguments that include `-decode` or `-decodehex`.

  - **Analyze CommandLine arguments**: Confirm if the decoding flags are used on potentially suspicious files. Legitimate usage might involve known file types handled by system administrators.

  - **Correlate with file creation activities**: Search for any associated file creations in Windows Event ID  creation logs (ID 4663) that correspond to the decoded output, as it may indicate unauthorized file access or staging for execution.

  - **Identify known malicious indicators**: Assess the decoded file paths to identify if they correspond to previous incidents or known malware signatures. Use threat intelligence feeds to validate.

  - **Inspect source and destination of encoded files**: Cross-reference the originating processes or user accounts against typical admin behavior. Malicious activities may be tied to anomalous accounts or unexpected execution contexts.

  - **Review legitimate certutil usages**: Document any acceptable administrative actions involving `certutil.exe` in the past week for context, noting how flagged incidents vary from typical workflows.

  ### Prioritization

  This alert is classified as high severity due to the critical role of the affected systems; unauthorized payload decoding can indicate an elevated risk of malware execution or data exfiltration. The likelihood of malicious exploitation is significant, as the use of `certutil.exe` in such a manner has been weaponized in various attacks, making it essential to address quickly.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques or misconfigured logging sources, as not all artifacts of certutil's execution might be captured. Evasion techniques may include using aliases or alternate paths for `certutil.exe`, or encoding payloads differently. Additionally, legitimate administrative tasks like certificate management can trigger this alert, potentially leading to false positives. It is advisable to monitor for related detections such as PowerShell execution of encoded scripts (T1059.001) to enhance coverage and correlation of suspicious activities.

