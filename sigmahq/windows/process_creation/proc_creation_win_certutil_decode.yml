title: File Decoded From Base64/Hex Via Certutil.EXE
id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
status: test
description: Detects the execution of certutil with either the "decode" or "decodehex"
  flags to decode base64 or hex encoded files. This can be abused by attackers to
  decode an encoded payload before execution
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://news.sophos.com/en-us/2021/04/13/compromised-exchange-server-hosting-cryptojacker-targeting-other-exchange-servers/
- https://twitter.com/JohnLaTwC/status/835149808817991680
- https://learn.microsoft.com/en-us/archive/blogs/pki/basic-crl-checking-with-certutil
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2023-02-15
modified: 2025-06-04
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash:
    - '-decode '         # Decode Base64
    - '-decodehex '         # Decode Hex
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_decode/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of `certutil.exe` with specific flags used for decoding data from Base64 or hex formats. Attackers may utilize this functionality to decode malicious payloads before executing them on a compromised system. The ability to decode encoded files can facilitate various malicious activities, such as delivering malware, executing shellcode, or bypassing security controls by obfuscating the true nature of the command or file being executed.

  The likely attacker objective in such scenarios is to execute payloads stealthily without raising alarms, exploiting the built-in Windows utility `certutil`, which is legitimate and often trusted. This behavior aligns with tactics under the MITRE ATT&CK framework, specifically focusing on **Defense Evasion** (TA0005) and the technique **Obfuscated Files or Information** (T1027).

  The primary telemetry required to capture this activity includes **process creation events** from the Windows operating system, specifically focusing on command line arguments that pertain to `certutil.exe`. This data will provide insights into whether the tool is being misused for nefarious activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs to identify instances of `certutil.exe` executed with the `-decode` or `-decodehex` flags. Pay attention to the command line arguments for any suspicious patterns or unusual behavior.

  - **Correlate with Network Activity**: Analyze network traffic logs to detect any outbound connections shortly following the execution of the decoding command. Look for connections to uncommon or untrusted IP addresses, which could indicate further malicious activity.

  - **Check System and File Integrity**: Verify the integrity of files modified or created immediately after the execution of `certutil.exe`. Check for any new executables or scripts that may be related to the decoded content.

  - **Utilize Endpoint Detection Tools**: Leverage EDR capabilities to gather deeper insights into the behavior of the host that executed the decoding command, including any subsequent file modifications or network connections established as a result.

  ### Prioritization
  This alert is considered high severity due to the potential impact of a successful attack leveraging decoded payloads. The ability to execute encoded payloads can lead to significant security incidents, including data breaches or system compromises, making it essential to prioritize investigations into this activity.

  ### Blind Spots and Assumptions
  The detection logic assumes that the command line parameters for the invocation of `certutil.exe` are not obfuscated or altered in a way that would prevent detection. Additionally, if `certutil.exe` is blocked or not present in the environment, this rule will not function as intended. There may be gaps in detection coverage if other decoding tools are used, or if logging levels do not capture detailed command line arguments. It’s critical to ensure that process creation event logs are enabled and properly configured to facilitate effective monitoring.

