logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\secedit.exe'
  - OriginalFileName: 'SeCEdit'
  selection_flags_discovery:
    CommandLine|contains|all:
    - '/export'
    - '/cfg'
  selection_flags_configure:
    CommandLine|contains|all:
    - '/configure'
    - '/db'
    # filter:
    #     SubjectUserName|endswith: '$'  SubjectUserName is from event ID 4719 in the Windows Security log
  condition: selection_img and (1 of selection_flags_*)
falsepositives:
- Legitimate administrative use
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious behaviors involving the use of `secedit.exe`, a tool primarily used for managing security policy settings in Windows environments. Attackers may leverage this tool to export or modify security configurations to gain unauthorized access or maintain persistence within a system. The threat scenario often revolves around insider threats or external attackers who have gained sufficient privileges to tamper with system security settings, thereby facilitating further malicious activities.

  Relevant MITRE ATT&CK tactics associated with this detection include:
  - **Collection (TA0009)**: Exporting security policy configurations.
  - **Discovery (TA0007)**: Gathering information about system security settings that can be exploited.
  - **Persistence (TA0003)**: Modifying security policies to ensure continued access, evading detection.
  - **Defense Evasion (TA0005)**: Altering security configurations to hinder detection efforts by security monitoring systems.

  Primary data sources for this detection include process creation events, particularly those related to the execution of `secedit.exe`, along with detailed command line arguments, which indicate the nature of the invoked operations.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for instances of `secedit.exe` execution, focusing on the command line details to determine if any flags indicating export or configuration changes were used.
  - **Investigate Log Sources**: Collect related logs that document changes to security policies, such as Windows Security logs (Event ID 4719) that may showcase alterations made through the use of `secedit.exe`.
  - **Assess User Accounts**: Identify the user accounts initiating `secedit.exe`. Investigate suspicious or unexpected accounts, especially those with elevated permissions.
  - **Correlate with Security Policies**: Examine the security policies currently in effect on the system to identify any unauthorized changes that may have been enacted through this tool.

  ### Prioritization
  The severity of this alert is considered medium because while legitimate administrative activities may involve using `secedit.exe`, unauthorized commands can indicate a significant risk. Misuse of this tool can lead to critical security policy modifications, opening paths for further exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for process creations is not adequately enabled or if command line arguments are truncated in logs, potentially obscuring evidence of malicious activity. Additionally, the detection logic assumes that the behavior of executing `secedit.exe` is anomalous, which might overlook legitimate administrative use cases. Adequate logging configurations must be in place to capture detailed command line inputs for this rule to function effectively.

