logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\secedit.exe'
  - OriginalFileName: 'SeCEdit'
  selection_flags_discovery:
    CommandLine|contains|all:
    - '/export'
    - '/cfg'
  selection_flags_configure:
    CommandLine|contains|all:
    - '/configure'
    - '/db'
    # filter:
    #     SubjectUserName|endswith: '$'  SubjectUserName is from event ID 4719 in the Windows Security log
  condition: selection_img and (1 of selection_flags_*)
falsepositives:
- Legitimate administrative use
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious behaviors associated with `secedit.exe`, including exporting or modifying the security policies of a Windows system. Such actions could indicate an attacker’s intent to manipulate security configurations for unauthorized access or persistence. The relevant MITRE ATT&CK tactics and techniques are:
  - Discovery (T1087)
  - Persistence (T1547.001)
  - Credential Access (T1556.002)

  Primary telemetry sources for this detection include Windows Process Creation logs, specifically Security Event ID 4688 capturing process execution details and Sysmon Event ID 1 for additional context. If malicious, the impact includes unauthorized changes to system configurations, potentially enabling further exploits or privilege escalation. It should be noted that this detection does NOT itself confirm malicious intent as `secedit.exe` may be used legitimately by system administrators.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 for `secedit.exe`. Ensure to look at `CommandLine`, `UserName`, and `OriginalFileName` fields to identify the context under which it was executed.

  - **Evaluate command line arguments:** Understand the parameters used with `secedit.exe`. Flags containing `/export` or `/configure` could indicate attempts at security policy manipulation. Note the user context to assess if it was executed by a legitimate admin or a standard user profile.

  - **Verify source IP addresses:** For remote systems, assess the logs for unusual or unauthorized source IPs initiating `secedit.exe`. If the originating user is unusual or the activity occurs outside expected administrative hours, escalate for further scrutiny.

  - **Identify legitimate usage patterns:** Typical administrative tasks may involve `secedit.exe` for security compliance checks, where commands include `/export` to backup policies. Ensure that these occur in maintenance windows and are documented through IT change management.

  - **Flag deviations:** Look for anomalous behavior such as repeated executions by non-administrators or in short time frames, which could signal malicious intent attempting to modify security settings.

  ### Prioritization

  This alert should be regarded with medium severity due to the potential high impact on system security if exploited maliciously. The likelihood of abuse is reasonable, as modifying security policies can be an entry point for further attacks. While not all instances of `secedit.exe` indicate malicious activity, this behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of system-level permissions, enabling adversaries to mask activity. Configurations such as Windows Event Forwarding must be in place to ensure complete telemetry capture. Legitimate administrative activities, particularly routine security audits or policy changes, may trigger this alert, potentially leading to false positives. Companion detection methods may include monitoring changes in Group Policy Objects or other privilege escalation indicators to enhance coverage.

