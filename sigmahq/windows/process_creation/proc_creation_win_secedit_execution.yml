logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\secedit.exe'
  - OriginalFileName: 'SeCEdit'
  selection_flags_discovery:
    CommandLine|contains|all:
    - '/export'
    - '/cfg'
  selection_flags_configure:
    CommandLine|contains|all:
    - '/configure'
    - '/db'
    # filter:
    #     SubjectUserName|endswith: '$'  SubjectUserName is from event ID 4719 in the Windows Security log
  condition: selection_img and (1 of selection_flags_*)
falsepositives:
- Legitimate administrative use
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `secedit.exe`, specifically when it is used to export or configure system security policies. Attackers may utilize this to gather sensitive information about security settings, modify configurations stealthily, or establish persistence by changing security policies to their advantage. The relevant MITRE ATT&CK techniques include **T1546.001 - Event Triggered Execution: Windows Management Instrumentation** and **T1564.002 - Hide Artifacts: Hidden Files and Directories**.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**. If malicious, this behavior can lead to unauthorized access or privilege escalation, potentially compromising sensitive systems. Importantly, this detection does NOT confirm malicious intent on its own; it may correspond with legitimate administrative tasks.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID **4688** and Sysmon Event ID **1** for `secedit.exe` executions. Look for unexpected invocations during non-administrator hours or from non-privileged accounts, which may indicate malicious activity.

  - **Analyze command line arguments:** Confirm the presence of `/export` or `/configure` in the CommandLine field. Any instance of the command without proper contextual justification (like a system administrator task) could suggest malicious use.

  - **Identify executing user account:** Investigate the `SubjectUserName` field in Security Event ID **4688**. Executions by system accounts (like `SYSTEM` or `LOCAL SERVICE`) or unfamiliar user accounts are more suspicious than those by recognized administrators.

  - **Correlate with additional logs:** Check for related activity within Windows Security logs (Event ID **4719**) which records changes to the audit policy. Look for rare or unexpected changes that could indicate privilege escalation efforts tied to `secedit.exe` usage.

  - **Document legitimate activity:** Understand that legitimate administrative tasks will typically involve `secedit.exe` being executed by recognized administrators, logging the action in a usual context, such as during system configuration updates. Identify timestamps when administrative changes were expected.

  - **Investigate persistence mechanisms:** If `/configure` is detected, review relevant logs for any subsequent changes to local security policy settings (such as password policies). Such changes can indicate attempts to maintain unauthorized access to affected systems.

  ### Prioritization

  This alert has a *medium* severity level due to the potential impact on the affected systems. Executions of `secedit.exe` for configuration changes can lead to severe security risks if taken by an unauthorized party. While this behavior can happen legitimately, its exploitation is known in the attack lifecycle, which heightens a suspicious context.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of process hollowing or obfuscation techniques that disguise malicious commands. Reliability depends on the comprehensive logging configuration to capture the necessary events across the environment. Legitimate administrative activities, such as routine security audits or policy adjustments, can also trigger this alert. A companion detection, such as monitoring for changes in local Group Policy using Event ID **4704**, may enhance overall visibility into changes made to security configurations.

