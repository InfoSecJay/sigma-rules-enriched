note: |
  ### Technical Context

  This Sigma rule detects the execution of uncommon child processes spawned by `BgInfo.exe`. This behavior suggests potential abuse of the tool, which is typically used to display system information on Windows desktops, to execute unauthorized scripts or malicious payloads via VBScript. The likely attacker objective in this scenario is to obfuscate malicious activities by using a legitimate process as a proxy for executing their code.

  The relevant MITRE ATT&CK techniques involved include "Command and Scripting Interpreter (Windows) - VBScript" (T1059.005) and "Exploitation for Client Execution" (T1218). Primary telemetry sources include process creation logs from the Windows Security Event Log (Event ID 4688) and Sysmon (Event ID 1). If malicious, this behavior can allow attackers to run arbitrary code within the context of a trusted process, making it significant for security concerns. However, this detection alone does not confirm that a breach has occurred or that the detected behavior is malicious without additional context.

  ### Investigation Steps

  - **Check process creation details:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for the `BgInfo.exe` parent process and its child processes. Extract the command line arguments and compare them against expected legitimate behavior, such as displaying system data.

  - **Identify unusual child processes:** Look for child processes launched by `BgInfo.exe` that are not typically associated with its functionality, like PowerShell or CMD scripts. Legitimate usage would only display system info without invoking other executables.

  - **Correlate with user activity:** Analyze user actions around the time of the alert using User Logon events (Event ID 4624). Confirm if the action originated from expected user behavior or an anomalous pattern.

  - **Review the file creation activities:** Validate any related file creations or modifications tied to the suspicious child processes' execution in the Windows file system, focusing on created or modified files in `C:\Users\Public\` or `C:\Temp\`.

  ### Prioritization

  The alert is rated medium severity due to the potential impact on systems running `BgInfo.exe`, a legitimate tool often found in enterprise environments. The likelihood of malicious abuse is moderate, as attackers may exploit it to execute their scripts while remaining under the radar. However, this technique is not widely weaponized, making proactive monitoring essential.

  ### Blind Spots and Assumptions

  Detection may bypass instances where `BgInfo.exe` is genuinely used with legitimate child processes, which can lead to false positives. The rule relies on proper logging configurations, such as Sysmon and Windows Event logs, for accurate detection. Legitimate administrative scripts executing from `BgInfo.exe` may also trigger this alert. Compounding detection techniques, such as monitoring for unexpected parental process trees, can address these blind spots effectively.

