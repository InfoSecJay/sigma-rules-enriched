  ---

  ### Technical Context

  This detection identifies unusual child processes spawned from "BgInfo.exe," a legitimate Windows utility designed to display system information on the desktop. Attackers may exploit this utility to execute unauthorized scripts or binaries, facilitating malicious actions under the guise of a valid process. The primary MITRE ATT&CK techniques relevant here include Execution (T1202) and Robotic Automation (T1059.005), which refers to the use of scripting languages for command execution.

  The main telemetry source involves process creation logs on Windows, particularly focusing on Event ID 4688 which records new process creations. If such behavior is malicious, the potentially compromised systems could lead to unauthorized data access or lateral movement within the network. However, this detection alone does not confirm malicious intent; it only indicates anomalous usage of "BgInfo.exe."

  ---

  ### Investigation Steps

  - **Identify the child processes spawned from BgInfo.exe:** Check for Event ID 4688 logs indicating child process creation. Review process names and paths associated with the parent image "\bginfo.exe" or "\bginfo64.exe" to detect uncommon execution patterns.

  - **Analyze process command line arguments:** For each identified child process, examine the command line arguments in Event ID 4688 logs (e.g., the “New Process Name” and “Command Line” fields) to identify any scripts or executables that are potentially malicious, such as VBScript or PowerShell commands.

  - **Review system roles and expected BgInfo behavior:** Determine if BgInfo is a used tool in your environment (e.g., desktop systems) and verify typical command line usage. Legitimate processes commonly reflect benign parameters, such as displaying system information, without executing additional scripts.

  - **Cross-reference with known malicious indicators:** Compare the detected child processes with threat intelligence sources to assign a risk score. For instance, track common malicious script names often associated with exploits or notorious tools (e.g., "malicious.vbs").

  - **Monitor for concurrent suspicious activities:** Collect data for relevant logs such as Security Event ID 5140 (File Share Access) or process network activity via Sysmon Event ID 3 to ascertain if these child processes attempt to communicate with known malicious IP addresses.

  ---

  ### Prioritization

  This alert warrants medium priority, particularly affecting user endpoints where "BgInfo.exe" is regularly employed. The likelihood of malicious exploitation exists due to its potential use in scripting or automation attacks, though this behavior is not always indicative of clear compromise.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential misuse of legitimate applications that may not be characterized as malicious in all contexts, creating false positives. Adequate logging must be configured to capture all process creations effectively and must include command line parameters for comprehensive analysis. Legitimate administrative scripts may inadvertently trigger this alert if they utilize "BgInfo.exe." Enhancing detection coverage with Sigma rules for other known files or execution patterns (e.g., PowerShell activities) may also provide additional context and assurance.

