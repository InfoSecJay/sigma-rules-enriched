note: |
  ### Technical Context
  This rule detects uncommon child processes spawned by **BgInfo.exe**, a legitimate Microsoft utility typically used to display system information on the desktop. Attackers may misuse this utility to execute malicious scripts or commands without raising alarms, exploiting the tool's common administrative use case to evade detection mechanisms. The detection logic focuses on identifying unusual patterns in process creation that may indicate potential abuse for malicious purposes, such as executing scripts or facilitating lateral movement in an environment.

  The likely attacker objectives in this scenario include stealthy execution of arbitrary commands or scripts, potentially leading to further exploitation or data exfiltration. Notably, this behavior aligns with multiple techniques in the MITRE ATT&CK framework, including:

  - **Execution**: Running malwares or scripts under the guise of legitimate processes (T1059.005: Visual Basic).
  - **Defense Evasion**: Utilizing commonly trusted binaries to mask nefarious activities (T1218: Signing and Code Signing).
  - **Command and Control**: Channeling control or data exfiltration through proxy mechanisms that exploit trusted utilities (T1202: Indirect Command Execution).

  Primary data sources for this detection rule include **process creation events** from Windows event logs, which provide insights into parent and child process relationships, as well as any PowerShell logs that might capture involved commands for further analysis.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances where `BgInfo.exe` is the parent of any unusual child processes. Investigate the command line arguments passed during execution for anomalies.
  - **Correlate with VBScript Activity**: Look for recent execution of VBScript files or other scripts that could be called by the detected child processes, and analyze their origin and intent.
  - **Check System and Security Logs**: Investigate other logs for concurrent suspicious activities, such as unusual logins or access attempts to sensitive resources, that may correlate with the detected execution.
  - **Examine Process Anomalies**: Assess the file hash and reputation of the detected child processes to determine if they are benign or potentially malicious. Also, analyze parent-child relationships to ascertain if the execution follows a legitimate user workflow.

  ### Prioritization
  The alert is assigned a medium severity due to the potential for significant impact if an attacker exploits a legitimate tool like BgInfo to execute malicious code stealthily. The likelihood of occurrence is moderate, given that this behavior may arise from both legitimate administration actions and potential insider threats or external compromises.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of abuse, particularly if the attacker uses different parents or obfuscates their technique through other benign-looking processes. It assumes that BgInfo.exe is consistently used as a parent process, neglecting scenarios where other legitimate tools may be misused similarly. For effective detection, logging must include comprehensive process creation events with adequate retention and analysis capabilities, ensuring that all relevant parent-child relationships are captured.

