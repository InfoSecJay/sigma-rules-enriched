title: Suspicious Uninstall of Windows Defender Feature via PowerShell
id: c443012c-7928-43bf-ac20-7eda5efe61ad
status: experimental
description: |
  Detects the use of PowerShell with Uninstall-WindowsFeature or Remove-WindowsFeature cmdlets to disable or remove the Windows Defender GUI feature, a common technique used by adversaries to evade defenses.
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.windows.servermanager.migration/uninstall-windowsfeature
- https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware
author: yxinmiracle
date: 2025-08-22
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_uninstall:
    CommandLine|contains:
    - 'Uninstall-WindowsFeature'
    - 'Remove-WindowsFeature'         # Only supported in Windows Server 2008 R2 and Windows 2012 R2
  selection_cli_defender_feature:
    CommandLine|contains: 'Windows-Defender'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of PowerShell commands to uninstall or remove the Windows Defender feature, specifically targeting the `Uninstall-WindowsFeature` or `Remove-WindowsFeature` cmdlets. This behavior is typically seen in an attacker's attempt to disable vital security controls within a compromised environment, facilitating further actions like malware deployment or lateral movement without detection.

  This detection aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005) and specifically technique T1685 (Deobfuscate/Decode Files or Information). The primary telemetry sources for this detection are the Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes and their command-line arguments. If malicious, this behavior can significantly lower the security posture of the affected system by removing critical defense mechanisms. It is important to note that this detection does NOT, on its own, confirm malicious intent; benign administrative actions may trigger this alert.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for process creation related to PowerShell. Look for command lines that include `Uninstall-WindowsFeature` or `Remove-WindowsFeature` alongside 'Windows-Defender'. Malicious indicators include executing these commands without legitimate administrative context.

  - **Check command execution context:** Investigate the user associated with the PowerShell commands by analyzing the `SubjectUserName` field in Event ID 4688. Confirm that it matches expected administrative accounts; unauthorized accounts executing this command may indicate malicious activity.

  - **Analyze logs for timestamps and correlation:** Cross-reference the timing of alerting events with other significant activities or anomalies in the environment. Identify any preceding suspicious behavior which could suggest this is part of an attack chain.

  - **Identify expected legitimate behavior:** Document typical administrative tasks involving Windows Defender for your environment. For legitimate actions, you would typically see these commands executed by known IT staff during scheduled maintenance events.

  - **Evaluate system criticality:** Determine the affected host's role within the network. If it's a critical server engaging in this behavior, escalate accordingly due to the high potential impact on security.

  - **Validate file modifications:** Check for changes in the Windows Defender service status and any associated files (e.g., `C:\Program Files\Windows Defender\*`). Malicious removal would correlate with abnormal service state changes or unintended file deletions.

  ### Prioritization

  This alert is high severity due to the potential impact on endpoint security and overall network integrity. The likelihood of malicious abuse is significant, as disabling Windows Defender is a common tactic among adversaries to evade detection. This behavior is often weaponized in advanced persistent threat (APT) scenarios and targeted ransomware attacks.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques, such as the use of custom scripts or compiled binaries to disable Windows Defender outside of the recorded command language. Reliable detection requires correct configurations of process creation logging and Sysmon. Additionally, legitimate administrative procedures, such as system upgrades or troubleshooting, may trigger this alert. A companion detection that strengthens coverage would be monitoring for suspicious PowerShell script execution or unusual service state changes associated with Windows Defender.

