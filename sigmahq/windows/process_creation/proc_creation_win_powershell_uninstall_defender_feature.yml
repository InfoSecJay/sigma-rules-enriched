title: Suspicious Uninstall of Windows Defender Feature via PowerShell
id: c443012c-7928-43bf-ac20-7eda5efe61ad
status: experimental
description: |
  Detects the use of PowerShell with Uninstall-WindowsFeature or Remove-WindowsFeature cmdlets to disable or remove the Windows Defender GUI feature, a common technique used by adversaries to evade defenses.
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.windows.servermanager.migration/uninstall-windowsfeature
- https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware
author: yxinmiracle
date: 2025-08-22
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_uninstall:
    CommandLine|contains:
    - 'Uninstall-WindowsFeature'
    - 'Remove-WindowsFeature'         # Only supported in Windows Server 2008 R2 and Windows 2012 R2
  selection_cli_defender_feature:
    CommandLine|contains: 'Windows-Defender'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of PowerShell cmdlets (`Uninstall-WindowsFeature` or `Remove-WindowsFeature`) to disable or remove the Windows Defender feature, which is often an initial step taken by adversaries to evade detection and protect their malicious activities. The likely attacker objective is to disable a key security feature to facilitate further actions such as lateral movement or deploying additional malware with reduced risk of detection.

  This activity is related to the MITRE ATT&CK tactic **Defense Evasion** (ID: T1562.001). The primary telemetry sources for this detection include Windows process creation logs, specifically focusing on PowerShell execution (Event ID 4688) or Sysmon Event ID 1. If malicious, this behavior can lead to exploitation of the affected system, increasing its vulnerability to further attacks. It is important to note that this detection does NOT confirm that an actual compromise has occurred; legitimate administrative actions may also trigger this rule.

  ---

  ### Investigation Steps

  - **Review PowerShell command line arguments:** Check for command line arguments using `CommandLine` field in Event ID 4688 or Sysmon Event ID 1. Look for instances of `Uninstall-WindowsFeature` or `Remove-WindowsFeature` related to `Windows-Defender`. Legitimate admin use may include maintenance scripts, but should not occur frequently.

  - **Check for recent administrative activity:** Query `Security Event ID 4624` for logon events and correlate with the suspected time frame of the PowerShell execution. Examine if the account used has legitimate admin roles or has been subject to unusual behavior.

  - **Correlate activity with security tools:** Validate whether endpoint protection and monitoring solutions have flagged or logged this behavior as abnormal using their logs. Such systems may provide alerts when critical features like Windows Defender are altered.

  - **Identify host role and endpoint criticality:** Determine the role of the affected host based on asset inventory. If it's a domain controller or critical server, prioritize further investigation, as disabling security features here presents a high risk.

  - **Search for indicators of compromise:** In addition to the PowerShell command, look for additional indicators such as unusual outbound connections, file changes, or presence of suspicious binaries which could indicate further compromise.

  ---

  ### Prioritization

  This alert is of high severity due to the potential risk associated with disabling Windows Defender on critical systems. The likelihood of malicious abuse is significant, as disabling security features is a well-known tactic employed by adversaries. This behavior is commonly weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques such as the use of alternative methods to disable Defender or executing code from legitimate administrative tools. Required log sources for reliable detection include both PowerShell logging and process creation events, configured to capture command line arguments accurately. Legitimate system maintenance or updates could trigger similar alerts, underscoring the need for context in investigations. A related detection for improved coverage would be monitoring for unexpected modifications in security settings via the Group Policy logs or Windows Event IDs related to security configuration changes.

