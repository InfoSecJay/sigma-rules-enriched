title: Suspicious Uninstall of Windows Defender Feature via PowerShell
id: c443012c-7928-43bf-ac20-7eda5efe61ad
status: experimental
description: |
  Detects the use of PowerShell with Uninstall-WindowsFeature or Remove-WindowsFeature cmdlets to disable or remove the Windows Defender GUI feature, a common technique used by adversaries to evade defenses.
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.windows.servermanager.migration/uninstall-windowsfeature
- https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware
author: yxinmiracle
date: 2025-08-22
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_uninstall:
    CommandLine|contains:
    - 'Uninstall-WindowsFeature'
    - 'Remove-WindowsFeature'         # Only supported in Windows Server 2008 R2 and Windows 2012 R2
  selection_cli_defender_feature:
    CommandLine|contains: 'Windows-Defender'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that use `Uninstall-WindowsFeature` or `Remove-WindowsFeature` to disable or remove the Windows Defender GUI feature. This behavior is indicative of an attacker attempting to evade security defenses by eliminating critical protective measures. The malicious activity aligns with the MITRE ATT&CK tactic of defense evasion and specifically targets technique ID T1562.001 (Disable or Modify Security Tools).

  The primary telemetry sources are Windows process creation logs, specifically focusing on PowerShell executions. Relevant log types include Security Event ID 4688 (for process creation) and Sysmon Event ID 1. If executed by an adversary, this action could lead to an increased risk of malware dissemination and system compromise. However, it is essential to note that this detection does NOT confirm malicious intent on its own; admins or automated scripts may execute these commands in legitimate contexts.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1, filtering for `powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`. Look for suspicious command lines that include `Uninstall-WindowsFeature` or `Remove-WindowsFeature`.

  - **Analyze command line arguments**: Focus on command lines that contain `Windows-Defender`. If found, verify if the context around the execution indicates an attack or if it aligns with administrative scripts or roles.

  - **Identify user context**: Check the user associated with the power-related command execution to determine if it aligns with known administrative usage patterns. Investigate if the command was executed by a privileged account outside of normal hours.

  - **Determine execution frequency**: Cross-check for multiple executions of the disabling commands in a short time frame. Frequent or repetitive execution of these commands may indicate malicious activity, particularly if originating from non-administrative accounts.

  - **Look for related activities**: Investigate for other indications of compromise (IOC), such as unusual network connections or file modifications around the time of the PowerShell command execution. Check for any elevated privilege access or other suspicious scripts running concurrently.

  ### Prioritization

  This alert should be considered high severity due to the sensitivity of the affected system function—Windows Defender is a critical component of security infrastructure. The likelihood of malicious abuse is significant, as adversaries often target security tools to facilitate deeper access and exploit systems without detection. The technique is commonly weaponized in various attacks, warranting immediate attention.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative tasks that involve disabling Windows Defender for maintenance purposes. Additionally, without the appropriate logs from all endpoints, visibility into the use of PowerShell may be incomplete. It's essential to ensure that Sysmon is properly configured and that process creation logs are collected consistently across all systems. A related detection to strengthen coverage would be monitoring for the creation or execution of scripts aiming to disable security features across endpoints.

