title: Suspicious Uninstall of Windows Defender Feature via PowerShell
id: c443012c-7928-43bf-ac20-7eda5efe61ad
status: experimental
description: |
  Detects the use of PowerShell with Uninstall-WindowsFeature or Remove-WindowsFeature cmdlets to disable or remove the Windows Defender GUI feature, a common technique used by adversaries to evade defenses.
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.windows.servermanager.migration/uninstall-windowsfeature
- https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware
author: yxinmiracle
date: 2025-08-22
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_uninstall:
    CommandLine|contains:
    - 'Uninstall-WindowsFeature'
    - 'Remove-WindowsFeature'         # Only supported in Windows Server 2008 R2 and Windows 2012 R2
  selection_cli_defender_feature:
    CommandLine|contains: 'Windows-Defender'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with uninstalling the Windows Defender feature using PowerShell commands. Attackers often disable or remove security features to evade detection and mitigate defenses, making this a critical behavior to monitor. The rule specifically looks for the usage of the `Uninstall-WindowsFeature` or `Remove-WindowsFeature` cmdlets that are employed to disable the Windows Defender GUI feature, allowing malicious software to operate freely on the system.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (TA0005)** and **Remove or Disable Security Tools (T1562.001)**. By disabling security features like Windows Defender, an attacker can create a more favorable environment for further exploitation, data exfiltration, or lateral movement within the network. The primary data sources for detecting these activities are process creation logs from Windows systems, especially noting any calls to PowerShell executables with specific command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs of process creation events to identify any instances of PowerShell, PowerShell ISE, or pwsh being invoked, especially focusing on those with the specified command-line arguments.

  - **Analyze Command-Line Arguments:** Investigate occurrences where the command includes either `Uninstall-WindowsFeature` or `Remove-WindowsFeature`. Cross-check with the installed features on the system to confirm if Windows Defender was indeed targeted.

  - **Inspect PowerShell Script Logs:** Examine any logs related to PowerShell script execution to capture the context of the commands executed leading up to the uninstall action, which may reveal other malicious activities.

  - **Check Security Event Logs:** Review Windows Security Event logs for any user accounts that executed these commands, especially looking for unusual user behavior or accounts with elevated privileges.

  ### Prioritization
  This alert should be considered high severity due to the significant threat impact of disabling security features, which can lead to increased likelihood of successful exploits and malware persistence within an organization’s environment.

  ### Blind Spots and Assumptions
  This detection rule may miss certain evasion techniques if an attacker utilizes alternative means to disable security features beyond PowerShell, such as other remote management tools. Additionally, the logic assumes that the command-line arguments will be present in the logs, which requires adequate logging configurations to be enabled on target systems. Ensuring that detailed process creation logging is enabled is critical for the effectiveness of this detection mechanism.

