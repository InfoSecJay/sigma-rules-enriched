logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sdset:
    CommandLine|contains|all:
    - 'sdset'
    - 'A;'         # Allow Access
  selection_trustee:
    CommandLine|contains:
    - ';IU'         # Interactively logged-on user
    - ';SU'         # Service logon user
    - ';BA'         # Built-in administrators
    - ';SY'         # Local system
    - ';WD'         # Everyone
  filter_optional_hexnode:
    ParentImage: 'C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_sc_sdset_allow_service_changes/info.yml
note: |
  ### Technical Context

  This Sigma rule detects modifications to service permissions on Windows systems, specifically alterations in the Discretionary Access Control List (DACL) using the `sc.exe` command. It indicates that an attacker may be attempting to escalate privileges or maintain persistence by granting unauthorized access to services. The relevant MITRE ATT&CK tactic is **Privilege Escalation** (T1068) and the technique is **Create or Modify System Process** (T1543.003). Primary telemetry sources include Windows process creation events (Event ID 4688) and command line logging. If successful, this tactic could enable attackers to execute malicious actions under the context of a service, gaining elevated privileges. However, this detection alone does not confirm that malicious behavior has occurred, as legitimate administrators may perform similar actions.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `sc.exe` execution. Look for command lines containing `sdset` with `A;`, which indicates attempt to change permissions.

  - **Examine for suspicious trustees:** Focus on trusted or unusual users in the command line parameters such as `;IU` (Interactive User) or `;SU` (Service User). Malicious actors may use these to elevate service access.

  - **Identify benign usage patterns:** Determine if there are legitimate processes or scheduled tasks that utilize `sc.exe` for DACL modifications. Consistency with known management practices helps to distinguish between benign and suspicious activity.

  - **Investigate parent process relationships:** Analyze the parent process of any detected `sc.exe` executions to check for known legitimate software like the Hexnode Agent. If suspicious, further investigation may be warranted.

  - **Evaluate potential service access changes:** Check the Windows Event ID 1102 (Audit Log Cleared) alongside changes to service permissions to identify attempts to hide activity.

  - **Verify service states post-modification:** Use PowerShell commands (e.g., `Get-Service`) to review service configurations for any unexpected changes to service permissions or interactive users.

  ### Prioritization

  This alert has a high severity due to its implications for potential privilege escalation and persistence by malicious actors. The risk increases when the affected system hosts critical services or exposed endpoints, making it a likely target for attackers.

  ### Blind Spots and Assumptions

  This rule may not detect legitimate administrative actions performed through automated tools or scripts with proper credentials. If command line logging or process monitoring is either disabled or not sufficiently configured, the detection will fail. Legitimate system management tasks may trigger this alert. A related detection strategy could involve monitoring for changes to service configurations outside of standard operational processes for enhanced coverage.

