logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sdset:
    CommandLine|contains|all:
    - 'sdset'
    - 'A;'         # Allow Access
  selection_trustee:
    CommandLine|contains:
    - ';IU'         # Interactively logged-on user
    - ';SU'         # Service logon user
    - ';BA'         # Built-in administrators
    - ';SY'         # Local system
    - ';WD'         # Everyone
  filter_optional_hexnode:
    ParentImage: 'C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Discretionary Access Control List (DACL) of Windows services using the `sc.exe` command tool, which can grant unauthorized access by altering security descriptors. The likely attacker objective is to escalate privileges or maintain persistence by allowing a malicious user or compromised account to access or control services normally restricted by the DACL. This behavior fits within the MITRE ATT&CK framework under the tactics of "Privilege Escalation" and "Persistence," specifically technique T1543.003 – "Create or Modify System Process: Windows Service."

  Key telemetry sources for this detection include Windows event logs associated with process creation, particularly Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation). If malicious, this modification can lead to unauthorized service access, which poses a severe security risk. Importantly, this detection does NOT confirm that the executed command was successful or that any malicious activity occurred; it merely flags the attempt to change critical security parameters.

  ### Investigation Steps

  - **Review Process Creation Events:** Confirm any `sc.exe` related activity by checking Windows Security Event ID 4688 and Sysmon Event ID 1. Look for the Event ID, Command Line, and Parent Image fields to establish context and validate the execution parameters.

  - **Analyze Command Line Arguments:** Focus on the Command Line for `sc.exe` entries containing 'sdset' and 'A;'. Note the presence of specific trustee identifiers (e.g., ';IU', ';SU', ';BA', ';SY', ';WD') indicating attempted privilege escalations. Malicious indicators may include uncommon trustees being granted higher access.

  - **Identify Parent Process Relationships:** If detection is triggered with a parent process as `C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe`, consider the legitimacy of this process. If the Hexnode Agent is known and benign, further context may be needed to assess the action's impact.

  - **Establish Normal Operations Context:** Review the typical behavior of `sc.exe` within your environment. Legitimate use may include service configuration changes by authorized administrators, which would commonly invoke 'sdset' but not with suspicious trustees.

  - **Check Event Logs for Related Actions:** Look through Windows Application and System logs, especially for Event IDs indicating service status changes (e.g., Event ID 7036 for service start or stop) correlated with the `sc.exe` activities.

  ### Prioritization

  This alert is high-severity due to the potential impact on system integrity and access control. The likelihood of malicious exploitation is significant, given that modifying service access via DACL changes is a known tactic for privilege escalation. Such behaviors are frequently weaponized by adversaries for persistence and access.

  ### Blind Spots and Assumptions

  Detection limitations may arise from misconfigured logging, as missing Security Event logs could prevent observation of critical actions. Adversaries might also employ similar techniques using legitimate processes, generating false positives. Legitimate administrative actions, particularly during maintenance or system updates, could trigger this alert. A related detection that could enhance coverage is monitoring for unauthorized creation or modification of scheduled tasks (MITRE technique T1053), which can coincide with privilege escalation efforts.

