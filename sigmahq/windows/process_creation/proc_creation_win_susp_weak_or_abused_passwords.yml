title: Weak or Abused Passwords In CLI
id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
status: test
description: |
  Detects weak passwords or often abused passwords (seen used by threat actors) via the CLI.
  An example would be a threat actor creating a new user via the net command and providing the password inline
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/espionage-asia-governments
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
- https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-14
modified: 2024-02-23
tags:
- attack.defense-evasion
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # Add more passwords
    - '123456789'
    - '123123qwE'
    - 'Asd123.aaaa'
    - 'Decryptme'
    - 'P@ssw0rd!'
    - 'Pass8080'
    - 'password123'         # Also covers PASSWORD123123! as seen in https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
    - 'test@202'         # Covers multiple years
  condition: selection
falsepositives:
- Legitimate usage of the passwords by users via commandline (should be discouraged)
- Other currently unknown false positives
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where weak or commonly abused passwords are being used in command-line interfaces (CLI), particularly on Windows systems. The presence of these passwords may indicate malicious activity, such as an attacker attempting to create new users or initiate access to sensitive systems. Attackers often exploit weak passwords to gain unauthorized access to a network or escalate privileges, posing a significant risk to enterprise security.

  This rule aligns with the following MITRE ATT&CK tactics and techniques:
  - **Credential Access (TA0006)**: By using weak passwords, attackers can access accounts and systems within the organization.
  - **Initial Access (TA0001)**: Creating new user accounts with weak passwords may serve as a foothold for further exploitation.

  Relevant telemetry sources for this detection include process creation events from endpoint monitoring tools, which log command-line arguments and can help establish whether weak passwords are being used in potentially malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect logs for events indicating the execution of command-line interface commands that contain weak passwords. Focus on commands related to user account creation, modification, or any administrative tasks.

  - **Analyze User Account Activity**: Investigate any newly created or modified user accounts to determine their legitimacy. Check for accounts created with weak passwords and cross-reference them against typical usage patterns.

  - **Correlate with User Behavior**: Examine authentication logs to verify if the accounts using weak passwords are exhibiting any suspicious behavior, such as access to sensitive resources or unusual login attempts.

  - **Look for Brute Force Indicators**: Determine if there are other accounts on the system that might have been subjected to brute force attacks leading to the use of such passwords, identifying potential attackers.

  ### Prioritization
  The severity of this alert is medium, as the use of weak passwords can lead to significant security breaches and unauthorized access within an enterprise environment. Given the increasing sophistication of threat actors, it is crucial to be vigilant about such indicators.

  ### Blind Spots and Assumptions
  This detection may not capture instances where weak passwords are used in legitimate contexts, thus leading to potential false positives. The logic assumes that the identified passwords are consistently abused by threat actors, which may not hold true for all environments. Effective detection relies on comprehensive process creation logging being enabled, as well as correlating with user behavioral analysis to differentiate between benign and malicious use.

