title: Weak or Abused Passwords In CLI
id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
status: test
description: |
  Detects weak passwords or often abused passwords (seen used by threat actors) via the CLI.
  An example would be a threat actor creating a new user via the net command and providing the password inline
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/espionage-asia-governments
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
- https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-14
modified: 2024-02-23
tags:
- attack.defense-evasion
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # Add more passwords
    - '123456789'
    - '123123qwE'
    - 'Asd123.aaaa'
    - 'Decryptme'
    - 'P@ssw0rd!'
    - 'Pass8080'
    - 'password123'         # Also covers PASSWORD123123! as seen in https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
    - 'test@202'         # Covers multiple years
  condition: selection
falsepositives:
- Legitimate usage of the passwords by users via commandline (should be 
  discouraged)
- Other currently unknown false positives
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of weak or commonly abused passwords in Command-Line Interface (CLI) commands on Windows systems. Common attacker objectives include creating new user accounts or executing commands with elevated privileges, leveraging familiar or easily guessable passwords. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1203)** and **Execution (T1059)**.

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688. If exploited, this behavior can lead to unauthorized access and privilege escalation, significantly increasing the attack surface within an enterprise network. This detection does NOT confirm malicious intent solely based on weak password usage; legitimate users may inadvertently use these passwords in their operations.

  ### Investigation Steps

  - **Check Command Line Usage**: Review Security Event ID 4688 for instances of command-line activity containing weak passwords. Check the `CommandLine` field for matches against the specified weak passwords in the detection.

  - **Identify User Context**: Cross-reference the user account executing the command with existing user roles. Verify if the user has legitimate access needs and if they typically use the command line in their role.

  - **Examine User Activity Patterns**: Look for atypical user behavior before and after the detection, such as accessing sensitive resources or performing privileged actions. Confirm expected normal command usage patterns.

  - **Assess Creation of New Accounts**: Determine if any new user accounts were created around the time of the detection. Security Event ID 4720 can identify new user account creations, which may warrant further scrutiny.

  - **Review Account Permissions**: Analyze group memberships and account permissions for any newly created users. Check for unexpected elevation of privileges or administrator rights that could indicate an attempted security breach.

  - **Confirm Legitimate Password Usage**: Document instances where users or administrators might be legitimately using any of the identified passwords in a controlled and documented manner. Note the context to help differentiate between benign and malicious use.

  ### Prioritization

  This alert should be treated with medium severity due to the potential security implications of utilizing weak passwords in command-line operations. Systems impacted by this behavior might have critical roles in user management or application deployment, and the likelihood of malicious abuse is high, particularly during active threat campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior; legitimate administrative tasks might trigger the alert. Additionally, internal policies should discourage the use of weak passwords but may not prevent all legitimate occurrences. Required log sources include process creation and security event logs, and companion detections could involve monitoring for unauthorized user creation or account privilege escalations for improved incident response.

