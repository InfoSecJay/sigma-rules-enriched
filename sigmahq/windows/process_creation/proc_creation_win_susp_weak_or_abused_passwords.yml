title: Weak or Abused Passwords In CLI
id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
status: test
description: |
  Detects weak passwords or often abused passwords (seen used by threat actors) via the CLI.
  An example would be a threat actor creating a new user via the net command and providing the password inline
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/espionage-asia-governments
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
- https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-14
modified: 2024-02-23
tags:
- attack.execution
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # Add more passwords
    - '123456789'
    - '123123qwE'
    - 'Asd123.aaaa'
    - 'Decryptme'
    - 'P@ssw0rd!'
    - 'Pass8080'
    - 'password123'         # Also covers PASSWORD123123! as seen in https://www.microsoft.com/en-us/security/blog/2022/10/25/dev-0832-vice-society-opportunistic-ransomware-campaigns-impacting-us-education-sector/
    - 'test@202'         # Covers multiple years
  condition: selection
falsepositives:
- Legitimate usage of the passwords by users via commandline (should be 
  discouraged)
- Other currently unknown false positives
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of weak or commonly abused passwords via command-line interface (CLI) commands on Windows systems. Attackers often utilize such passwords when creating new users or altering permissions to gain unauthorized access. The associated MITRE ATT&CK techniques include **T1548 - Abuse Elevation Control Mechanism** and **T1078 - Valid Accounts**. The primary telemetry sources include Windows process creation logs, specifically focusing on Security Event ID 4688 for process creations with command-line arguments.

  If a malicious actor successfully exploits weak or reused passwords, they could escalate privileges, steal data, or establish persistence on the network. Importantly, this detection does NOT confirm that an intrusion has occurred; legitimate user actions may also trigger the rule if such weak passwords are used.

  ### Investigation Steps

  - **Analyze command-line arguments: **Review Security Event ID 4688 for any instances where the command line contains the specified weak passwords. Look for processes such as `net user` or `net localgroup` to identify user creation or modification actions.

  - **Identify context of command execution: **Check the Event ID 4624 (Logon) for the user account associated with the creation/modification. Determine if the account should be using weak passwords, considering asset criticality and role.

  - **Determine typical usage patterns: **Investigate command history or logins for users previously utilizing the detected password patterns. Determine if there's valid business activity that aligns with these actions.

  - **Correlate with authentication logs: **Cross-reference Event ID 4648 to see if the account structures and permissions during the detected commands match expected behaviors. Investigate if these accounts had unusual login attempts or failed login events leading up to the command execution.

  - **Identify high-confidence malicious behavior: **Look for multiple instances of weak password usage across different user accounts in a short time frame, indicating potential automated exploitation or widespread compromise.

  ### Prioritization

  This alert is medium severity due to the nature of weak passwords, which significantly increase the risk of insider threats and credential compromise. The likelihood of malicious abuse is relatively high since these passwords are commonly associated with opportunistic attacks. While the command may have legitimate usage, the known context and accompanying account activity can indicate potential exploitation.

  ### Blind Spots and Assumptions

  Detection may be evaded through obfuscation of the command-line arguments or by utilizing strong authentication methods, thus avoiding detection by this rule. Required log sources include comprehensive process creation logs and account activity monitoring to ensure reliable detection. Legitimate administrative activities, such as support tasks conducted using weak passwords, may also trigger the alert. Companion detections, such as monitoring for unusual account creation events (e.g., multiple accounts created in a short time), can strengthen overall coverage against potential abuse.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
