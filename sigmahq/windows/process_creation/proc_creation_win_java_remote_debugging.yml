title: Java Running with Remote Debugging
id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
status: test
description: Detects a JAVA process running with remote debugging allowing more than
  just localhost to connect
references:
- https://dzone.com/articles/remote-debugging-java-applications-with-jdwp
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2023-02-01
tags:
- attack.t1203
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_jdwp_transport:
    CommandLine|contains: 'transport=dt_socket,address='
  selection_old_jvm_version:
    CommandLine|contains:
    - 'jre1.'
    - 'jdk1.'
  exclusion:
    CommandLine|contains:
    - 'address=127.0.0.1'
    - 'address=localhost'
  condition: all of selection_* and not exclusion
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the execution of Java processes that are running with remote debugging capabilities enabled on non-localhost addresses. Remote debugging allows developers to connect to a Java application remotely for troubleshooting and monitoring; however, if improperly configured, it can expose sensitive information and provide an entry point for attackers. In this scenario, the attacker may aim to remotely manipulate the Java application, potentially leading to data exfiltration, execution of arbitrary code, or other malicious actions.

  This behavior primarily falls under the MITRE ATT&CK tactics of **Execution** (ATT&CK ID: TA0002) and **Exploitation for Client Execution** (ATT&CK ID: T1203), where a malicious actor may attempt to exploit vulnerabilities in Java applications for command execution or to interact with system processes. The primary data sources for this detection include **process creation logs** from the Windows operating system, which contain command-line details indicating whether remote debugging is enabled and on which addresses the Java processes are listening.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for Java applications, focusing on command-line arguments that include `transport=dt_socket,address=` to identify remote debugging configurations.
  - **Verify Listening Addresses**: Check the listening addresses specified in the command line; any address that is not `127.0.0.1` or `localhost` could indicate a misconfiguration or potential compromise.
  - **Analyze Java Application's Role**: Determine the role and importance of the Java application in your environment, assessing its normal operational behavior to establish a baseline for expected connections and access.
  - **Investigate Network Connections**: Utilize network telemetry to identify any suspicious inbound connections to the Java application, especially from external IPs, which may signal attempted exploitation or reconnaissance behavior.

  ### Prioritization
  The alert’s medium severity reflects the potential impact of unauthorized remote access to Java applications, which could be exploited for data breaches or system control. Given the prevalence of misconfigured services in enterprise environments, prompt investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions
  This detection logic assumes that the Java application is not intended to accept remote debug connections from non-local addresses. A gap in detection coverage may exist if there are legitimate use cases for remote debugging in a secure environment. Additionally, the rule may not capture scenarios where the Java application is executed with non-standard flags or command line syntax. Proper logging configuration for process creation events is necessary for this detection to function effectively.

