title: Java Running with Remote Debugging
id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
status: test
description: Detects a JAVA process running with remote debugging allowing more 
  than just localhost to connect
references:
- https://dzone.com/articles/remote-debugging-java-applications-with-jdwp
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2023-02-01
tags:
- attack.t1203
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_jdwp_transport:
    CommandLine|contains: 'transport=dt_socket,address='
  selection_old_jvm_version:
    CommandLine|contains:
    - 'jre1.'
    - 'jdk1.'
  exclusion:
    CommandLine|contains:
    - 'address=127.0.0.1'
    - 'address=localhost'
  condition: all of selection_* and not exclusion
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects a Java process that is running with remote debugging enabled, configured to allow connections from any IP address, rather than being restricted to localhost (127.0.0.1). The likely attacker objective could involve exploitation of remote debugging capabilities to gain unauthorized access to the application’s memory space, allowing for code injection or sensitive information retrieval. This situation is relevant to the MITRE ATT&CK technique `T1203 - Exploitation for Client Execution`.

  The primary telemetry sources for this detection include Windows Process Creation logs, specifically focused on CommandLine arguments used during process execution. If malicious, this behavior poses a significant security risk as it could lead to remote code execution or data exposure. Importantly, this detection does not confirm malicious activity on its own as legitimate development or administrative tasks may also employ remote debugging.

  ### Investigation Steps

  - **Check process details:** Review Windows Security Event ID 4688 for the Java process creation. Validate the `CommandLine` field for instances containing 'transport=dt_socket,address=' with any IP address other than 127.0.0.1 or localhost. This is a strong indicator of potential misuse.

  - **Verify Java versions:** Assess the `CommandLine` for versions using 'jre1.' or 'jdk1.'. Older versions (e.g., Java 7 or below) are more prone to vulnerabilities and may be indicative of insecure configurations.

  - **Identify legitimate uses:** Determine if this Java process is part of a known development or testing environment. Verify expected management processes or scheduled jobs in your environment that may involve remote debugging.

  - **Analyze related logs:** Look for Sysmon Event ID 1 logs associated with the detected Java process. Pay attention to parent processes and check for any suspicious activity or unusual execution paths leading to the Java remote debugging invocation.

  - **Look for network artifacts:** Investigate network traffic logs to identify any outbound connections initiated by the Java process to non-local addresses. This could indicate potential data exfiltration or command and control communication.

  ### Prioritization

  This alert has medium severity due to potential exploitation risks associated with remote debugging features. Given that many Java applications exercise remote debugging only in development phases, there exists a moderate likelihood of malicious abuse if discovered in production environments, especially if the application is internet-facing.

  ### Blind Spots and Assumptions

  The main detection limitation is the ability of adversaries to evade detection by using alternative debugging setups or changing CommandLine arguments. Reliable detection requires comprehensive telemetry from process creation logs and network connections; therefore, ensuring logging configurations are correctly set up is critical. Legitimate Java development environments may also utilize such configurations, potentially producing false positives. A related detection could involve monitoring for unusual outbound network activity originating from Java processes, enhancing overall coverage against exploitation attempts.

