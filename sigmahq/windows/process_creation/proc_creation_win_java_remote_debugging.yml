title: Java Running with Remote Debugging
id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
status: test
description: Detects a JAVA process running with remote debugging allowing more than
  just localhost to connect
references:
- https://dzone.com/articles/remote-debugging-java-applications-with-jdwp
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2023-02-01
tags:
- attack.t1203
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_jdwp_transport:
    CommandLine|contains: 'transport=dt_socket,address='
  selection_old_jvm_version:
    CommandLine|contains:
    - 'jre1.'
    - 'jdk1.'
  exclusion:
    CommandLine|contains:
    - 'address=127.0.0.1'
    - 'address=localhost'
  condition: all of selection_* and not exclusion
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances when a Java process is executing with remote debugging enabled and is configured to accept connections from IP addresses other than localhost (127.0.0.1). The primary objective of the attacker could be to gain unauthorized access to the Java application, potentially allowing them to manipulate application behavior or extract sensitive information. This behavior aligns with the MITRE ATT&CK tactic for "Execution" (TA0002) and specifically the technique for "Command and Scripting Interpreter" (T1059).

  The primary telemetry source for this detection is Windows process creation logs, notably Security Event ID 4688, which provides details of command line arguments used during process initiation. If this behavior is malicious, it could lead to application compromise or unauthorized data access. However, the detection does not confirm that the activity is indeed malicious—it merely indicates that remote debugging is available and not restricted to localhost, which can be part of legitimate development practices.

  ---

  ### Investigation Steps

  - **Examine the command line arguments:** Check Security Event ID 4688 logs for processes with `CommandLine` that include `transport=dt_socket,address=` and confirm that it does not only contain `address=127.0.0.1` or `address=localhost`. Legitimate entries typically restrict connections to localhost.

  - **Identify affected Java versions:** Verify if the detected process corresponds to older Java Runtime Environment versions (`jre1.` or `jdk1.`). Older versions might have vulnerabilities, increasing risk if used in an environment without appropriate controls.

  - **Check for open ports:** Use tools like `netstat` to validate if the designated port used by Java debugging (commonly 5005) is open for external access. This can indicate unintentional exposure of the Java application.

  - **Look for unusual Java application behavior:** Review logs from the relevant Java application to assess for any unexpected errors or logs indicating manipulation attempts, which could signal successful exploitation.

  - **Assess the asset role and context:** Identify the role of the affected system (development server vs. production environment). Remote debugging on production systems could indicate higher risk.

  - **Analyze process parent-child relationships:** Review Sysmon Event ID 1 logs to trace parent processes for detected Java processes. A debugger or testing tool as a parent can signify legitimate use, while unexpected parent processes might flag malicious intent.

  ---

  ### Prioritization

  The alert severity is medium in an enterprise context due to the risk of exposing sensitive application debug interfaces that can be weaponized by an attacker. The likelihood of malicious abuse is moderate, especially if these processes are running in production environments, which increases the urgency for investigation.

  ---

  ### Blind Spots and Assumptions

  This detection could miss cases where remote debugging is initiated with different transport protocols or within secure configurations that do not expose addresses outside localhost. Required log sources include comprehensive auditing on process creations and potential network monitoring to catch connections on non-local addresses. Legitimate development activity may inadvertently trigger this alert in environments where developers require remote access for troubleshooting. A companion detection could focus on unusual outbound connection attempts from Java processes that may correlate with exploitation attempts.

