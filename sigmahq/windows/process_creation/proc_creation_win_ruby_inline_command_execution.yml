title: Ruby Inline Command Execution
id: 20a5ffa1-3848-4584-b6f8-c7c7fd9f69c8
status: test
description: Detects execution of ruby using the "-e" flag. This is could be 
  used as a way to launch a reverse shell or execute live ruby code.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ruby.exe'
  - OriginalFileName: 'ruby.exe'
  selection_cli:
    CommandLine|contains: ' -e'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of Ruby with the "-e" flag, which allows inline command execution that can be exploited by adversaries to run arbitrary code or establish reverse shells. Attackers may use this behavior during post-exploitation phases to execute commands without creating permanent files, thereby evading detection. This behavior maps to the MITRE ATT&CK technique for Command and Scripting Interpreter: Ruby (T1059.005).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact involves unauthorized system access and control. This detection does NOT confirm that the ruby execution is malicious; it simply indicates the execution of Ruby with specific flags that require further investigation.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for the execution of 'ruby.exe'. Look for the CommandLine field to confirm the usage of the "-e" flag.

  - **Correlate with user context:** Identify the user context under which ruby.exe was executed. Legitimate usage typically correlates with known development tasks or scheduled scripts in development environments.

  - **Check for reverse shell patterns:** Examine the command line arguments for suspicious patterns, such as network connections or encoded payloads. Notable indicators include outbound connections to untrusted IPs or DNS queries.

  - **Validate parent process:** Investigate the parent process of ruby.exe (e.g., cmd.exe or PowerShell). If it was spawned from a known benign process (e.g., IDEs), it may indicate legitimate behavior.

  - **Perform network traffic analysis:** Capture and analyze outbound traffic from the system for network connections that coincide with ruby execution. Suspicious traffic directed towards external IPs may indicate exfiltration or reverse shell activity.

  ### Prioritization

  This alert is assessed as medium severity due to the potential for system compromise via an inline command execution attack. The likelihood of malicious abuse is moderate, with a history of such patterns being weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate development or scripting tasks that may invoke Ruby with the "-e" flag. Reliable detection requires proper auditing configurations for process creation logs. Benign activities may include legitimate script execution by developers or scheduled tasks. A companion detection to strengthen coverage includes monitoring for PowerShell command execution to correlate with potential cross-language exploits.

