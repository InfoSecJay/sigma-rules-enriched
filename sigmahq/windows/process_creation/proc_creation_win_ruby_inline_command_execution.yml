title: Ruby Inline Command Execution
id: 20a5ffa1-3848-4584-b6f8-c7c7fd9f69c8
status: test
description: Detects execution of ruby using the "-e" flag. This is could be used
  as a way to launch a reverse shell or execute live ruby code.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ruby.exe'
  - OriginalFileName: 'ruby.exe'
  selection_cli:
    CommandLine|contains: ' -e'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of Ruby with the `-e` flag, which allows attackers to execute arbitrary code directly from the command line. This behavior is frequently leveraged by threat actors to launch reverse shells or run malicious scripts without the need for creating separate files. By utilizing Ruby in this manner, attackers can maintain stealth and evade detection mechanisms.

  The primary attacker objectives here may include establishing a foothold within the environment, exfiltrating sensitive data, or executing further payloads for lateral movement. Given the flexibility that inline Ruby code execution offers, it becomes a significant tactic in the execution phase of an attack.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002)
    - **Command-Line Interface** (T1059.004): Using the command line to execute code.

  For evidence collection, the most pertinent data sources include:
  - Process creation logs, which will detail the execution of `ruby.exe` and the command line arguments used.
  - Security event logs may capture suspicious command patterns associated with the execution of Ruby scripts.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs for instances of `ruby.exe` being invoked, particularly focusing on command lines containing the `-e` flag.
  - **Investigate Command Lines:** Identify and review the specific commands executed within the Ruby environment to ascertain if they indicate malicious intent, such as network connections or script execution.
  - **Correlate Network Activity:** Look for related outbound network connections made shortly after the Ruby execution to identify potential reverse shells or data exfiltration attempts.
  - **Check for Continuity:** Verify if there are other associated processes or scripts that may indicate ongoing malicious activity or persistence mechanisms following the execution of Ruby.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for significant security risk, including unauthorized remote access and potential data compromise. The likelihood of exploitation is elevated because Ruby is commonly available in many environments, increasing the chances that an attacker might misuse it.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where Ruby is not regularly used, potentially leading to false negatives if usage is legitimate. The detection logic assumes that Ruby will be available in typical installations, and thus doesn't account for other languages or methods attackers might use to achieve code execution. For this alert to function properly, comprehensive process creation logging must be configured and maintained, particularly focusing on command-line arguments to capture activities accurately.

