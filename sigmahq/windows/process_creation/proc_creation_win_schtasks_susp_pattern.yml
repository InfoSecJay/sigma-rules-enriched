title: Suspicious Command Patterns In Scheduled Task Creation
id: f2c64357-b1d2-41b7-849f-34d2682c0fad
status: test
description: Detects scheduled task creation using "schtasks" that contain 
  potentially suspicious or uncommon commands
references:
- https://app.any.run/tasks/512c1352-6380-4436-b27d-bb62f0c020d6/
- https://twitter.com/RedDrip7/status/1506480588827467785
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2024-03-19
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create '
  selection_pattern_1:
    CommandLine|contains:
    - '/sc minute '
    - '/ru system '
  selection_pattern_2:
    CommandLine|contains:
    - 'cmd /c'
    - 'cmd /k'
    - 'cmd /r'
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_uncommon:
    CommandLine|contains:
    - ' -decode '
    - ' -enc '
    - ' -w hidden '
    - ' bypass '
    - ' IEX'
    - '.DownloadData'
    - '.DownloadFile'
    - '.DownloadString'
    - '/c start /min '         # https://twitter.com/RedDrip7/status/1506480588827467785
    - 'FromBase64String'
    - 'mshta http'
    - 'mshta.exe http'
  selection_anomaly_1:
    CommandLine|contains:
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Tmp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\'
    - '%AppData%'
    - '%Temp%'
    - '%tmp%'
  selection_anomaly_2:
    CommandLine|contains:
    - 'cscript'
    - 'curl'
    - 'wscript'
  condition: selection_schtasks and ( all of selection_pattern_* or 
    selection_uncommon or all of selection_anomaly_* )
falsepositives:
- Software installers that run from temporary folders and also install scheduled
  tasks are expected to generate some false positives
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_schtasks_susp_pattern/info.yml
note: |
  ### Technical Context

  This rule detects the execution of potentially malicious command patterns in the creation of scheduled tasks using `schtasks.exe`. Attackers often employ this method to establish persistence or execute payloads at regular intervals, typically with the goal of maintaining access and executing malicious scripts without direct user interaction. This behavior fits within the MITRE ATT&CK tactic of Persistence (TA0003) and Execution (TA0002), specifically using the technique T1053.005 (Scheduled Task/Job).

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring events such as Security Event ID 4688 or Sysmon Event ID 1. If confirmed malicious, these activities could indicate an unauthorized presence on the system, possibly leading to data exfiltration or lateral movement within the network. However, this detection alone does not confirm malicious intent without further context; legitimate software operations may trigger similar alerts.

  ### Investigation Steps

  - **Review command patterns:** Check for `schtasks.exe` command line executions (Event ID 4688) that include `/Create`. Identify any instances incorporating suspicious parameters like `/sc minute` or running as `system`.

  - **Analyze command line arguments:** Investigate command lines containing red flags such as `cmd /c`, `-enc`, or ‘mshta http’. These patterns often indicate scripting or execution attempts that are uncommon for legitimate scheduled tasks.

  - **Identify high-confidence malicious indicators:** Look for `schtasks.exe` commands referencing unusual file paths (e.g., `:\ProgramData\`, `:\Temp\`) or commands downloading data (e.g., `.DownloadData`, `.DownloadFile`). Such activity is highly indicative of malicious behavior.

  - **Examine legitimate behavior examples:** Verify scheduled task creation for recognized software installations that may utilize temporary folders (e.g., installers creating tasks in `%Temp%`). They should not contain suspicious command patterns.

  - **Validate files associated with task creation:** Check for file creation timestamps or unusual files in directories like `C:\Users\Public\Downloads`. Malicious command executions may result in unexpected file drop activity during the same timeframe.

  ### Prioritization

  The severity of this alert is high due to the potential for significant impact on compromised systems, such as unauthorized access and data breaches. The likelihood of malicious abuse is substantial, as attackers often exploit scheduled tasks for persistence. This behavior is commonly weaponized in contemporary threats, warranting immediate investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to potential evasion techniques, such as obfuscating command lines or leveraging legitimate processes to execute malicious commands. Effective detection relies on comprehensive logging configurations that capture all process creations from `schtasks.exe`. Furthermore, legitimate applications that create tasks or use command-line scripting could trigger similar alerts, complicating the investigation. Companion detections, such as monitoring for unusual network activity related to `mshta.exe` or PowerShell executions, can help strengthen coverage and context.

