title: Suspicious Command Patterns In Scheduled Task Creation
id: f2c64357-b1d2-41b7-849f-34d2682c0fad
status: test
description: Detects scheduled task creation using "schtasks" that contain potentially
  suspicious or uncommon commands
references:
- https://app.any.run/tasks/512c1352-6380-4436-b27d-bb62f0c020d6/
- https://twitter.com/RedDrip7/status/1506480588827467785
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2024-03-19
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create '
  selection_pattern_1:
    CommandLine|contains:
    - '/sc minute '
    - '/ru system '
  selection_pattern_2:
    CommandLine|contains:
    - 'cmd /c'
    - 'cmd /k'
    - 'cmd /r'
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_uncommon:
    CommandLine|contains:
    - ' -decode '
    - ' -enc '
    - ' -w hidden '
    - ' bypass '
    - ' IEX'
    - '.DownloadData'
    - '.DownloadFile'
    - '.DownloadString'
    - '/c start /min '         # https://twitter.com/RedDrip7/status/1506480588827467785
    - 'FromBase64String'
    - 'mshta http'
    - 'mshta.exe http'
  selection_anomaly_1:
    CommandLine|contains:
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Tmp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\'
    - '%AppData%'
    - '%Temp%'
    - '%tmp%'
  selection_anomaly_2:
    CommandLine|contains:
    - 'cscript'
    - 'curl'
    - 'wscript'
  condition: selection_schtasks and ( all of selection_pattern_* or selection_uncommon
    or all of selection_anomaly_* )
falsepositives:
- Software installers that run from temporary folders and also install scheduled tasks
  are expected to generate some false positives
level: high
note: |
  ### Technical Context
  This rule detects suspicious command patterns associated with the creation of scheduled tasks using the Windows `schtasks.exe` utility. Specifically, it identifies the execution of potentially malicious or uncommon commands, which may indicate an attacker trying to maintain persistence or execute unauthorized actions on a system. Attackers can leverage scheduled tasks to run scripts or malware at specified intervals or under specific conditions, often to maintain access or execute further attacks.

  The primary threat actors that might use these tactics include various malware families that aim to establish persistence and automate their execution, such as those referenced in the NCSC report on "Devil Bait." Within the MITRE ATT&CK framework, this detection aligns with tactics and techniques such as:
  - **Execution** (T1053.005) - Scheduled Task/Job: Execution via scheduled tasks.
  - **Persistence** (T1543.001) - Create or Modify System Process: Establishing persistence by creating scheduled tasks.
  - **Privilege Escalation** (T1068) - Exploitation for elevated privileges through misconfigurations or malicious scripts.

  Relevant telemetry for detecting these behaviors includes process creation events, specifically those capturing command line arguments for processes initiated by `schtasks.exe`.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows process creation logs to identify instances where `schtasks.exe` has been executed, focusing on the command line arguments used.
  - **Analyze Command Line Patterns:** Look for command line patterns that match the suspicious command indicators specified in the detection rule, including uncommon flags and script executions.
  - **Inspect Scheduled Task Configurations:** Check the system’s scheduled tasks for any new tasks or modifications, particularly those running commands from unconventional directories, to assess their legitimacy and origin.
  - **Correlate with Other Logs:** Cross-reference findings with security logs from EDR and SIEM sources to identify any additional behaviors associated with the identified tasks that may indicate further compromise or malicious activity.

  ### Prioritization
  The severity of this alert is high due to the potential implications of unauthorized scheduled task creations, which can lead to persistent access and automated execution of malicious payloads within the enterprise environment. The likelihood of exploitation in systems lacking adequate defenses is significant.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential command injection methods used during scheduled task creation, particularly if attackers utilize obfuscation techniques or less common processes. It assumes that logs from process creation events are enabled and accessible; thus, any gaps in logging configurations may impede detection effectiveness. Additionally, legitimate software installers that create scheduled tasks and run from temporary folders may trigger false positives, necessitating a careful review of context around such events.

