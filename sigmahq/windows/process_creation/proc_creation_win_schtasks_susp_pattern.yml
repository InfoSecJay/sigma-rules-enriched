title: Suspicious Command Patterns In Scheduled Task Creation
id: f2c64357-b1d2-41b7-849f-34d2682c0fad
status: test
description: Detects scheduled task creation using "schtasks" that contain 
  potentially suspicious or uncommon commands
references:
- https://app.any.run/tasks/512c1352-6380-4436-b27d-bb62f0c020d6/
- https://twitter.com/RedDrip7/status/1506480588827467785
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2024-03-19
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create '
  selection_pattern_1:
    CommandLine|contains:
    - '/sc minute '
    - '/ru system '
  selection_pattern_2:
    CommandLine|contains:
    - 'cmd /c'
    - 'cmd /k'
    - 'cmd /r'
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_uncommon:
    CommandLine|contains:
    - ' -decode '
    - ' -enc '
    - ' -w hidden '
    - ' bypass '
    - ' IEX'
    - '.DownloadData'
    - '.DownloadFile'
    - '.DownloadString'
    - '/c start /min '         # https://twitter.com/RedDrip7/status/1506480588827467785
    - 'FromBase64String'
    - 'mshta http'
    - 'mshta.exe http'
  selection_anomaly_1:
    CommandLine|contains:
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Tmp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\'
    - '%AppData%'
    - '%Temp%'
    - '%tmp%'
  selection_anomaly_2:
    CommandLine|contains:
    - 'cscript'
    - 'curl'
    - 'wscript'
  condition: selection_schtasks and ( all of selection_pattern_* or 
    selection_uncommon or all of selection_anomaly_* )
falsepositives:
- Software installers that run from temporary folders and also install scheduled
  tasks are expected to generate some false positives
level: high
note: |
  ### Technical Context

  This rule detects suspicious command patterns associated with the creation of scheduled tasks via `schtasks.exe`. The behavior being detected includes the use of certain flags or commands that may indicate an attempt by an adversary to establish persistence, automate malicious scripts, or execute hidden tasks. The likely attacker objective is to maintain control over the compromised system without raising suspicion.

  The relevant MITRE ATT&CK tactics and techniques include Persistence (T1053.005) and Privilege Escalation. The primary telemetry source is Windows process creation logs, specifically from Security Event ID 4688, which captures command-line arguments. If malicious, this activity may lead to unauthorized access or control over the system. However, it is important to note that this detection does NOT confirm the execution of malicious code—further investigation is required to establish the intent and outcome of the scheduled task.

  ### Investigation Steps

  - **Identify event details:** Review Windows Security Event ID 4688 logs for `schtasks.exe` process creation. Look for any suspicious command-line parameters passed that align with known malicious patterns.

  - **Filter for command anomalies:** Specifically examine command lines containing `cmd.exe` variations (e.g., `/c`, `/k`) or encoded strings (e.g., `-encoded`, `-w hidden`). These may indicate a misuse of command execution for potentially malicious purposes.

  - **Assess file paths for legitimacy:** Check if the scheduled task references commonly abused directories, such as `C:\ProgramData\`, `C:\Temp\`, or `C:\Users\Public\`. Legitimate tasks often do not utilize these paths, and their presence may indicate malicious intent.

  - **Cross-reference existing tasks:** Use `Get-ScheduledTask` in PowerShell to enumerate current scheduled tasks. Assess the frequency and user context (e.g., running as SYSTEM) to separate benign from suspicious activities—especially uncommon time intervals like minute scheduling.

  - **Investigate for malicious indicators:** Look for common indicators of compromise such as `mshta.exe http`, or methods of remote code execution (e.g., `IEX`, `DownloadData`). A high-confidence indicator would be the use of `mshta` to initiate unauthorized downloads.

  - **Verify legitimate software installations:** Confirm if the alert correlates with known software installs that may create temporary tasks. This context can help delineate expected behavior from potential compromise.

  ### Prioritization

  The alert severity is high due to the critical systems often affected by scheduled task manipulations. The likelihood of malicious abuse is elevated, as tools frequently exploit scheduled tasks for persistence. Additionally, the techniques employed are known to be commonly weaponized, increasing the urgency for analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of obfuscation techniques or encoded commands that the rule does not account for. Required log sources include full process creation logs with command-line details to ensure comprehensive visibility. Legitimate activities, such as authorized software installations or updates, may trigger this alert. A companion detection to bolster coverage would be monitoring for abnormal network behavior from the scheduled tasks, which could indicate potential command-and-control activity.

