title: WinRAR Execution in Non-Standard Folder
id: 4ede543c-e098-43d9-a28f-dd784a13132f
status: test
description: Detects a suspicious WinRAR execution in a folder which is not the default
  installation folder
references:
- https://twitter.com/cyb3rops/status/1460978167628406785
author: Florian Roth (Nextron Systems), Tigzy
date: 2021-11-17
modified: 2025-07-16
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rar.exe'
    - '\winrar.exe'
  - Description:
    - 'Command line RAR'
    - 'WinRAR'
  filter_main_unrar:
        # Note: we filter unrar as it has the same description as the other utilities, and we're only interested in compression
    Image|endswith: '\UnRAR.exe'
  filter_main_path:
    Image|contains:
    - ':\Program Files (x86)\WinRAR\'
    - ':\Program Files\WinRAR\'
  filter_optional_temp:
        # Note: in some occasion installers were seen dropping "rar" in TEMP
    Image|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate use of WinRAR in a folder of a software that bundles WinRAR
level: medium
note: |
  ### Technical Context
  This rule detects suspicious execution of WinRAR (either `rar.exe` or `winrar.exe`) outside its standard installation directories, which are typically `C:\Program Files\WinRAR\` or `C:\Program Files (x86)\WinRAR\`. Attackers may leverage WinRAR for data exfiltration or file compression of malicious payloads after a compromise, particularly in scenarios where the tool is used for obfuscation purposes. The aim is often to extract sensitive data or to compress malware for delivery through various channels discreetly.

  Relevant MITRE ATT&CK tactics include:
  - **Collection** (TA0009)
    - **Data from Local System** (T1005)
    - **Data from Information Repositories** (T1560.001)

  The primary data source for this detection logic is Windows process creation events, specifically monitoring where the WinRAR executable is being invoked from, along with its command lines which may indicate suspicious behaviors.

  ### Investigation Steps
  - **Review Process Creation Events:** Check for `rar.exe` or `winrar.exe` executions captured in Windows process creation logs. Focus on command line arguments that may suggest malicious file handling behaviors.
  - **Analyze Execution Paths:** Investigate the execution path of the detected WinRAR process. Legitimate installations should be from the standard WinRAR directories; flag any instances from unusual directories.
  - **Check for Anomalous File Activities:** Look for any accompanying file operations, such as compression of sensitive files or data being moved out of secure directories, that occurred simultaneously with the execution of WinRAR.
  - **Correlate with User Activity:** Assess the user context under which WinRAR was execution. Identify any unusual user accounts or activity patterns, especially in the context of previous alerts related to data exfiltration.

  ### Prioritization
  This alert should be considered medium severity in an enterprise environment because it indicates potentially malicious behavior—specifically, the misuse of a trusted tool like WinRAR—and can serve as a precursor to more extensive data breaches or ransomware deployments.

  ### Blind Spots and Assumptions
  This detection rule assumes that standard execution paths for WinRAR are strictly followed in an organization, which may not be the case in environments with software packages that bundle WinRAR. Additionally, the rule currently lacks the granularity to detect legitimate use cases where WinRAR is installed or utilized in various software contexts. For the alert to function correctly, comprehensive process creation logging must be enabled, capturing all relevant execution details for Windows systems.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
