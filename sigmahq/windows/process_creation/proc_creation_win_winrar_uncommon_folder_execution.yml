title: WinRAR Execution in Non-Standard Folder
id: 4ede543c-e098-43d9-a28f-dd784a13132f
status: test
description: Detects a suspicious WinRAR execution in a folder which is not the 
  default installation folder
references:
- https://twitter.com/cyb3rops/status/1460978167628406785
author: Florian Roth (Nextron Systems), Tigzy
date: 2021-11-17
modified: 2025-07-16
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rar.exe'
    - '\winrar.exe'
  - Description:
    - 'Command line RAR'
    - 'WinRAR'
  filter_main_unrar:
        # Note: we filter unrar as it has the same description as the other utilities, and we're only interested in compression
    Image|endswith: '\UnRAR.exe'
  filter_main_path:
    Image|contains:
    - ':\Program Files (x86)\WinRAR\'
    - ':\Program Files\WinRAR\'
  filter_optional_temp:
        # Note: in some occasion installers were seen dropping "rar" in TEMP
    Image|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate use of WinRAR in a folder of a software that bundles WinRAR
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances of WinRAR being executed from locations that deviate from typical installation directories, such as `C:\Program Files\WinRAR\` or `C:\Program Files (x86)\WinRAR\`. The behavior may suggest potential misuse of the application for unauthorized archiving or extraction of data, aligning with attacker objectives such as data exfiltration or the spread of malicious payloads. This behavior is relevant to the MITRE ATT&CK framework under the tactic of Collection (TA0046) and the technique of Data Staged (T1560.001).

  The primary telemetry sources for this detection are process creation logs, specifically Security Event ID 4688 on Windows systems or Sysmon Event ID 1. If this behavior is malicious, it could indicate an attempt to steal or manipulate sensitive information. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; further investigation is required to determine intent.

  ### Investigation Steps

  - **Check process command line arguments**: Inspect the command line for the process created (Event ID 4688 or Sysmon ID 1). Look for suspicious flags or parameters that might indicate an extraction of sensitive files.

  - **Verify file execution path**: Ensure the executable for WinRAR is being run from one of the standard installation directories. If it is located in `C:\Users\<username>\AppData\Local\Temp\`, it may warrant further scrutiny.

  - **Review parent process**: Identify the parent process of the WinRAR execution (Event ID 4688's ParentProcessId or Sysmon Event ID 1’s ParentID). If invoked by a commonly exploited application such as a web browser or email client, this could indicate potential malicious activity.

  - **Investigate legitimate usage**: Determine if this WinRAR execution is part of expected user behavior, such as compressing files for backup. Analyze the associated user account and their typical activities to establish legitimacy.

  - **Look for associated file creation**: If the WinRAR process appears to unpack files, examine for artifacts like newly-created files or directories within the same process execution context. This includes checking the `C:\Users\<username>\Downloads\` or `C:\Users\<username>\Desktop\` directories for unusual file types or suspicious filenames.

  - **Correlate with network activity**: Check for outbound network connections or data transfers initiated by the process (e.g., using Windows Firewall logs or network monitoring tools) that might indicate data exfiltration.

  ### Prioritization

  This alert carries a medium severity level due to the potential impact if sensitive information is compromised and the likelihood of misuse of the WinRAR tool for malicious purposes. Variations in the execution location from standard directories often signal suspicious activities that can be weaponized by adversaries for data collection.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications packaging WinRAR in non-standard locations, which may trigger false positives. Required log sources include detailed process creation events from security or Sysmon logs for reliable detection. It is worth noting that common legitimate applications may utilize WinRAR in a bundled manner. Companion detections, such as monitoring file creation events (e.g., Security Event ID 4663) following WinRAR execution, could enhance detection capabilities.

