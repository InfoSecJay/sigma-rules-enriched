title: WinRAR Execution in Non-Standard Folder
id: 4ede543c-e098-43d9-a28f-dd784a13132f
status: test
description: Detects a suspicious WinRAR execution in a folder which is not the 
  default installation folder
references:
- https://twitter.com/cyb3rops/status/1460978167628406785
author: Florian Roth (Nextron Systems), Tigzy
date: 2021-11-17
modified: 2025-07-16
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rar.exe'
    - '\winrar.exe'
  - Description:
    - 'Command line RAR'
    - 'WinRAR'
  filter_main_unrar:
        # Note: we filter unrar as it has the same description as the other utilities, and we're only interested in compression
    Image|endswith: '\UnRAR.exe'
  filter_main_path:
    Image|contains:
    - ':\Program Files (x86)\WinRAR\'
    - ':\Program Files\WinRAR\'
  filter_optional_temp:
        # Note: in some occasion installers were seen dropping "rar" in TEMP
    Image|contains: ':\Windows\Temp\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate use of WinRAR in a folder of a software that bundles WinRAR
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_winrar_uncommon_folder_execution/info.yml
note: |
  ### Technical Context

  This rule detects the execution of WinRAR (either `rar.exe` or `winrar.exe`) in non-standard directories, specifically outside of the default installation folders, which are typically found under `C:\Program Files\WinRAR` or `C:\Program Files (x86)\WinRAR`. The primary motive behind such behavior could be the misuse of this file compression utility for data exfiltration or obfuscation of malicious payloads, particularly during a post-compromise phase. This activity aligns with the MITRE ATT&CK technique for "Archive Data" (T1560.001), which involves creating compressed archives to facilitate data theft or transfer.

  The primary telemetry sources for this detection involve Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could include data exfiltration or the execution of embedded malicious scripts obscured within legitimate compression utilities. It's important to note that while this detection raises an alert, it does NOT confirm malicious activity on its own, as legitimate uses of WinRAR may also occur in non-standard folders.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for any instances of `rar.exe` or `winrar.exe` being executed from directories outside of the standard installation path.

  - **Identify the Command Line Arguments**: Examine the command line arguments in the process creation logs. Malicious use might show unusual flags (e.g., `/m5` for maximum compression) or target unusual file types or directories.

  - **Validate Legitimate WinRAR Usage**: Look for recent installations or software deployments that may legitimately bundle WinRAR and result in its execution from non-standard folders.

  - **Confirm Suspicious Execution Paths**: Specifically check paths such as `C:\Users\<username>\AppData\Local\Temp\` or user-specific directories for WinRAR executions, as these might indicate either misuse or a potential evasion technique.

  - **Monitor for Related Cleanup Activity**: Investigate any deletion or cleanup actions following the WinRAR execution, such as temporary files being removed in a short time frame, which may indicate an attempt to conceal malicious activity.

  - **Check for Data Exfiltration Artifacts**: Review logs for network activity or exported files related to the execution of WinRAR, especially any outbound connections or file transfer logs that coincide with the execution events.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive data and the likelihood of abuse in environments where WinRAR is installed. While WinRAR itself is a legitimate tool, its usage in unexpected paths often indicates, at the very least, suspicious activity that warrants further investigation, particularly in environments where alternate compression methods are less common.

  ### Blind Spots and Assumptions

  There are limitations in detecting all malicious instances of WinRAR execution, especially when attackers use legitimate software bundled with compressed file utilities strategically placed to avoid detection. Accurate detection requires the proper configuration for capturing all relevant process execution logs, which may not be consistently enabled across all systems. Common administrative tasks, such as application updates or legitimate software installations, could trigger this alert without malicious intent, emphasizing the need for context in each case. Supporting detections include monitoring for abnormal file creations associated with the compressed outputs, such as `.rar` files created in unusual directories.

