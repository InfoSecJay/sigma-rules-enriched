logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: ' /INJECTRUNNING '
  filter:
    ParentImage: 'C:\Windows\System32\AppVClient.exe'     # This parent is the expected process to launch "mavinject"
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of "Mavinject," a legitimate Windows utility designed for DLL injection into running processes, specifically when using the "INJECTRUNNING" flag. DLL injection is a technique often employed by attackers to manipulate the behavior of running processes, and in this instance, it may suggest malicious intent, especially if the parent process is the expected "AppVClient.exe." Attackers typically aim to inject malicious code into trusted processes to evade detection and escalate privileges, thereby facilitating deeper penetration into the network.

  The relevant MITRE ATT&CK techniques associated with this activity include T1055.001 (Process Injection: Dynamic-link Library Injection) and T1218.013 (Signed Binary Proxy Execution: Mavinject). Both techniques underline the use of process injection as a means of executing unauthorized code within the context of a trusted application. The primary data source for detection is the process creation logs from Windows, which contain command-line arguments and parent-child relationship details crucial for identifying suspicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the Windows process creation logs for instances where "mavinject" is invoked with the "INJECTRUNNING" flag. Pay attention to the command line and the parent process to identify potentially malicious activity.
  - **Analyze Parent Process Behavior:** Verify the behavior of the "AppVClient.exe" process to ensure it's operating as expected and not being exploited. Look out for any deviations or anomalies in resource usage or associated network activities.
  - **Inspect Related Process Hierarchies:** Examine the hierarchy of processes involved when "mavinject" is used. Consider investigating the child processes created during the injection to determine whether they are legitimate or show signs of compromise.
  - **Correlate with Other Security Alerts:** Cross-reference findings with alerts from other security solutions (like EDR or AV) that may have flagged suspicious behavior related to process injection or known malware signatures during the same timeframe.

  ### Prioritization
  Given the potential for process injection to facilitate unauthorized access and privilege escalation, this alert should be treated with high severity. The likelihood of exploitation through such techniques is significant, especially in an enterprise environment where trusted processes may be targeted.

  ### Blind Spots and Assumptions
  This detection logic may not cover all methods of process injection since it specifically looks for Mavinject with a defined parent process. It assumes that all instances of Mavinject will be flagged by this rule, which may not account for unauthorized renaming or usage by attackers mimicking legitimate behavior. It also requires that process creation logging is enabled and properly configured on the Windows systems, as the rule relies on access to those logs for effective detection.

