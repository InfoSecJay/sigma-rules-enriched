level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Mavinject tool with the `/INJECTRUNNING` flag, indicating an attempt to inject a DLL into an already running process. The likely objective of an attacker using this technique is to execute arbitrary code within the context of a legitimate process, allowing for stealthy operations such as data exfiltration or persistence. This behavior maps to MITRE ATT&CK techniques T1218.013 (Tool: Mavinject) and T1055.001 (Process Injection: DLL Injection).

  The primary telemetry source for this detection comes from Windows process creation logs, specifically System event logs capturing process execution details (Event ID 4688 or Sysmon Event ID 1). If this technique is malicious, it poses a significant risk as it facilitates privilege escalation and stealthy execution within trusted processes. Importantly, this detection does NOT confirm that a compromise has occurred on its own; additional context and evidence should be gathered for a complete assessment.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for Mavinject execution. Look for CommandLine containing ' /INJECTRUNNING '. Consider time of alert and related user activity.

  - **Identify parent process:** Validate that Mavinject was spawned by `C:\Windows\System32\AppVClient.exe`. If not, it could indicate suspicious behavior indicating the use of Mavinject by malware or unauthorized users.

  - **Review loaded modules:** Use Sysinternals tools like Process Explorer to examine the target process for any unauthorized or unexpected DLLs injected by Mavinject. This includes checking for any newly loaded modules right after Mavinject execution.

  - **Document legitimate dependencies:** Note that Mavinject might be legitimately used by system administrators or software deployment tools in specific environments. Identify if AppV (Application Virtualization) is in use and if Mavinject is part of expected operations.

  - **Assess account activity:** Investigate the account context under which Mavinject was run. A system account (like SYSTEM) can indicate legitimate use, whereas user-initiated executions may need further scrutiny.

  - **Capture network activity:** Monitor for any unusual network connections initiated by the target process post-injection. Use netstat or similar tools to identify suspicious outbound connections that could indicate data exfiltration.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on sensitive systems if a malicious actor successfully injects code into critical processes. Given the stealthy nature of process injection techniques, there is a high likelihood of malicious abuse in real-world attacks, especially considering how commonly these techniques are weaponized by advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics, such as attackers using alternate process injection methods that do not utilize Mavinject. False positives may arise from legitimate software deployment scenarios. Proper logging configurations must be enabled for effective detection; ensure Windows process creation logs and Sysmon are adequately set up. A related detection to consider includes any alerts captured by monitoring for unusual process parent-child relationships, offering comprehensive coverage against injection attempts.

