  product: windows
detection:
  selection:
    CommandLine|contains: ' /INJECTRUNNING '
  filter:
    ParentImage: 'C:\Windows\System32\AppVClient.exe'     # This parent is the expected process to launch "mavinject"
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of the signed Windows tool "Mavinject" for process injection into a running process, specifically targeting the `/INJECTRUNNING` flag. Attackers may employ this technique to inject malicious code into legitimate processes to evade detection, maintain persistence, or escalate privileges. This behavior is associated with the MITRE ATT&CK techniques T1218 (System Binary Proxy Execution) and T1055.001 (Process Injection: DLL Injection).

  The primary telemetry source is Windows process creation events, specifically via Event ID 4688 and Sysmon Event ID 1. If the detection is confirmed malicious, it may indicate a significant security threat, as the injection can allow adversaries to manipulate the behavior of trusted processes. Importantly, this detection does NOT confirm malicious activity solely on its own—it merely indicates that the Mavinject tool was utilized under suspicious circumstances.

  ### Investigation Steps

  - **Verify process parentage:** Check if the parent process for the detected instance of Mavinject is `AppVClient.exe` (Event ID 4688, `ParentImage` field). If it is not, it increases the suspicion of malicious activity.

  - **Examine command line arguments:** Review the command line for the Mavinject process (sysmon event detail `CommandLine`). Look for indications of unusual behavior beyond the typical `/INJECTRUNNING` flag, such as unexpected DLLs or paths.

  - **Identify legitimate usage:** Determine if Mavinject is being used in known legitimate applications (e.g., application virtualization scenarios). Document expected processes using this tool as a baseline for anomalies.

  - **Collect related process memory:** If possible, utilize memory analysis tools to capture snapshots of processes at the time of detection. Look for newly injected DLLs or unexpected modifications to running processes.

  - **Assess surrounding network activity:** Correlate any outbound network connections or unusual traffic patterns with the timeframe when Mavinject was executed (use logs from network monitoring tools). High volumes of requests or communication with known malicious domains should raise further concern.

  ### Prioritization

  This alert warrants high severity due to the potential impact of compromised processes on enterprise-level operations. The likelihood of exploitation via DLL injection methods is significant, as this technique is commonly weaponized in advanced persistent threat (APT) operations. The presence of Mavinject should trigger immediate investigation due to its association with stealthy adversarial tactics.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential evasion techniques used, such as altering command line syntax or utilizing undetected custom tools mimicking Mavinject's behavior. Reliable detection requires comprehensive logging—ensure Sysmon is configured to capture process creation events, and relevant command lines are logged. Legitimate activity, such as application virtualization updates, may trigger this alert, necessitating careful analysis. Companion detections include monitoring for DLL creation events or alterations in critical processes (comparison with parameters from T1055.001).

