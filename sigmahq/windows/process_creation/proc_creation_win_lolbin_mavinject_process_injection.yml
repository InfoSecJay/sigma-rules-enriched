note: |
  ### Technical Context

  This rule detects process injection activity using the Mavinject tool, specifically when initiated with the "INJECTRUNNING" flag. Adversaries may use Mavinject for stealthy injection of malicious payloads into legitimate processes, facilitating further compromise and evasion from detection. The relevant MITRE ATT&CK tactics and techniques are "Defense Evasion" (TA0042) and "Process Injection" (T1055.001).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1. If malicious, this activity significantly risks the integrity and confidentiality of the target system, potentially allowing unauthorized access to sensitive data and further lateral movement. It is critical to note that this detection does NOT confirm malicious intent on its own, as Mavinject may be used in legitimate administrative scenarios.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for the instance of Mavinject execution, filtering for entries containing " /INJECTRUNNING ". Note the timestamp and user context to establish whether it correlates with known administrative actions.

  - **Identify parent process:** Validate the parent image against legitimate contexts by ensuring that Mavinject was launched from "C:\Windows\System32\AppVClient.exe". Unusual parents or lack of context may indicate a potential misuse.

  - **Analyze command line arguments:** Look at the full command line for Mavinject to identify any parameters or unusual arguments. Legitimate use cases would typically not have obfuscated or excessive parameters, whereas malicious cases might show modifications aimed at bypassing standard security controls.

  - **Cross-reference temporal activity:** Cross-check timestamps with other logs (e.g., Windows Event Logs) to identify concurrent activities that could suggest broader compromise, such as unexpected remote logins or unauthorized applications being executed.

  - **Evaluate for post-injection behavior:** Investigate whether any subsequent unusual activity follows the injection, such as creation of malicious processes, suspicious network connections, or file writes indicating potential malware persistence.

  - **Document known legitimate uses:** Maintain an established list or baseline of legitimate administrative uses of Mavinject and similar tools for quick reference. This may include authorized personnel, documented scheduled maintenance windows, or approved testing scenarios.

  ### Prioritization

  This alert has a high severity rating due to the potential impact on critical systems and sensitive data. The likelihood of malicious abuse is substantial, given that process injection techniques are a common tactic used by adversaries to evade detection and escalate privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of Mavinject in administrative tasks, which can lead to false positives. Required log sources include properly configured Windows process creation logs and Sysmon for thorough visibility. Additionally, other legitimate applications may trigger similar behaviors, such as virtualization or application packaging tools that utilize injection mechanisms. Complementary detections involving process access or memory manipulation activities could enhance coverage and efficacy against related threats.

