detection:
  selection_img:
  - Image|endswith:
    - '\rar.exe'
    - '\winrar.exe'
  - Description: 'Command line RAR'
  selection_extension:
    CommandLine|contains:
    - '.dmp'
    - '.dump'
    - '.hdmp'
  condition: all of selection_*
falsepositives:
- Legitimate use of WinRAR with a command line in which ".dmp" or ".dump" appears
  accidentally
- Legitimate use of WinRAR to compress WER ".dmp" files for troubleshooting
level: medium
note: |
  ### Technical Context
  This rule detects the execution of WinRAR (rar.exe or winrar.exe) with the intent to compress files that have a ".dmp" or ".dump" extension. The presence of such file types can indicate they are memory dumps that attackers may seek to exfiltrate after gathering sensitive information from a compromised system. As such, this behavior could signify an attacker attempting to prepare collected evidence for data extraction, particularly in the context of post-exploitation activities.

  The likely threat scenario involves an adversary who has gained unauthorized access to a system and aims to capture or transfer sensitive information stored within memory dumps. Memory dump files can contain a wealth of data, including credentials and personal information, making them lucrative for attackers. Relevant MITRE ATT&CK tactics and techniques include **Collection (TA0009)** and specifically **Data from Local System (T1560.001)**.

  Primary data sources for detecting this activity include **process creation events** that monitor the execution of applications and the associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs to identify instances where WinRAR is invoked, focusing on the command line to determine if any .dmp or .dump files were included in the compression command.
  - **Analyze Command-Line Arguments:** Investigate the full command-line arguments associated with any WinRAR executions to discern any patterns that imply malicious intent, specifically looking for signs of exfiltration.
  - **Correlate with User Behavior:** Assess the user context under which WinRAR was executed. Investigate if the user has a history of legitimate use of WinRAR or if this is an anomalous occurrence.
  - **Cross-reference with Exfiltration Activity:** Check for any associated network traffic that may indicate data exfiltration, such as unexpected uploads to external IPs or services.

  ### Prioritization
  The alert is deemed medium severity as it highlights potential data exfiltration behavior that may stem from an active threat. This behavior poses a significant risk to sensitive organizational data, necessitating timely investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if WinRAR is executed with user-defined commands not typically monitored, or if similar tools are used without equivalent detection measures in place. The rule assumes that any usage of WinRAR with .dmp or .dump files is suspicious, disregarding legitimate troubleshooting scenarios where users may compress memory dump files for technical support. For the alert to function accurately, comprehensive process creation logs must be enabled and retained.

