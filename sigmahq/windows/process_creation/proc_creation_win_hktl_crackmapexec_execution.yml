logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
    Image|endswith: '\crackmapexec.exe'
  selection_special:
    CommandLine|contains: ' -M pe_inject '
  selection_execute:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -x '
  selection_hash:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
    - " -H 'NTHASH'"
  selection_module_mssql:
    CommandLine|contains|all:
    - ' mssql '
    - ' -u '
    - ' -p '
    - ' -M '
    - ' -d '
  selection_module_smb1:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -H '
    - ' -M '
    - ' -o '
  selection_module_smb2:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -p '
    - ' --local-auth'
  part_localauth_1:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
  part_localauth_2:
    CommandLine|contains|all:
    - ' 10.'
    - ' 192.168.'
    - '/24 '
  condition: 1 of selection_* or all of part_localauth*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of CrackMapExec, a widely used post-exploitation tool that manages Windows environments for lateral movement, credential harvesting, and privilege escalation. The rule identifies specific command-line flags and the file path associated with CrackMapExec, which may be indicative of an attacker exploring and exploiting network resources, especially when used for local authentication or with credential dumps.

  The relevant MITRE ATT&CK tactics are:
  - Execution (T1203)
  - Credential Access (T1003)
  - Persistence (T1053)
  - Discovery (T1087)

  The primary telemetry sources are process creation logs (Event ID 4688) on Windows systems, specifically looking for command-line arguments that fit the detection criteria. If a legitimate use of the tool is occurring without malicious intent, it can lead to unauthorized actions or data breaches. The detection does NOT confirm that an unauthorized breach has occurred, as CrackMapExec can be used for legitimate purposes by system administrators.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `crackmapexec.exe`. Analyze the command line for presence of key flags such as `--local-auth`, `-u`, and `-p` to determine the nature of the executed command.

  - **Identify expected legitimate usage:** Determine if CrackMapExec is utilized in your environment. If present, include documented instances in the investigation. Compare logged usage against baseline operational behavior for any command line arguments or IP addresses that diverge from the norm.

  - **Validate network traffic:** Review network logs for connections from systems executing CrackMapExec. Look for unusual connections to machines with the command line flags suggesting exploiting SMB or MSSQL databases (e.g., flags like `-M` or `-p`).

  - **Look for credential harvesting artifacts:** Investigate systems for memory dumps or files that could indicate the extraction of credentials from processes. Check for files that may have been created around the same time as the alert, particularly those with irregular names or formats.

  - **Review system criticality:** Assess the affected host's role in your environment (e.g., domain controller vs. end-user machine). Prioritize investigation on critical systems that could lead to significant compromise if CrackMapExec is confirmed malicious.

  - **Identify high-confidence malicious indicators:** Look for associated log entries (e.g., Event ID 5156 for Windows Filtering Platform) that capture unsuccessful or high-frequency authentication attempts, which could signify an ongoing attack or lateral movement.

  ### Prioritization

  Given the tool's capabilities for lateral movement and privilege escalation, alerts from this detection should be treated as high severity. The likelihood of malicious abuse is significant, especially in environments where Windows systems are prevalent. Furthermore, CrackMapExec is frequently weaponized by adversaries during targeted attacks.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the executable or executing from a legitimate process to avoid detection. Required logs include process creation telemetry (Event ID 4688), and those may not be enabled on all systems. Legitimate administrative actions might trigger this alert, such as standard automation scripts that utilize CrackMapExec for routine tasks. A related detection such as monitoring for anomalous SMB traffic could improve overall visibility into potential exploitation activities in the network.

