title: HackTool - CrackMapExec Execution
id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
status: test
description: This rule detect common flag combinations used by CrackMapExec in order
  to detect its use even if the binary has been replaced.
references:
- https://mpgn.gitbook.io/crackmapexec/smb-protocol/authentication/checking-credentials-local
- https://www.mandiant.com/resources/telegram-malware-iranian-espionage
- https://www.infosecmatter.com/crackmapexec-module-library/?cmem=mssql-mimikatz
- https://www.infosecmatter.com/crackmapexec-module-library/?cmem=smb-pe_inject
author: Florian Roth (Nextron Systems)
date: 2022-02-25
modified: 2023-03-08
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.credential-access
- attack.discovery
- attack.t1047
- attack.t1053
- attack.t1059.003
- attack.t1059.001
- attack.t1110
- attack.t1201
logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
    Image|endswith: '\crackmapexec.exe'
  selection_special:
    CommandLine|contains: ' -M pe_inject '
  selection_execute:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -x '
  selection_hash:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
    - " -H 'NTHASH'"
  selection_module_mssql:
    CommandLine|contains|all:
    - ' mssql '
    - ' -u '
    - ' -p '
    - ' -M '
    - ' -d '
  selection_module_smb1:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -H '
    - ' -M '
    - ' -o '
  selection_module_smb2:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -p '
    - ' --local-auth'
  part_localauth_1:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
  part_localauth_2:
    CommandLine|contains|all:
    - ' 10.'
    - ' 192.168.'
    - '/24 '
  condition: 1 of selection_* or all of part_localauth*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets activities associated with CrackMapExec, a popular post-exploitation tool used by attackers to facilitate lateral movement and command execution in Windows environments. By identifying common command-line flags associated with this tool, the rule effectively captures its execution, even if the underlying binary has been replaced. The likely objectives of attackers utilizing CrackMapExec include credential harvesting, privilege escalation, and establishing persistence within a network.

  In alignment with the MITRE ATT&CK framework, this rule encompasses several tactics and techniques:
  - **Execution (T1203)**: Exploiting local and remote systems using various modules of CrackMapExec.
  - **Persistence (T1053)**: Leveraging scheduled tasks or scripts that utilize CrackMapExec to maintain access.
  - **Privilege Escalation (T1068)**: Gaining heightened privileges through local authentication options.
  - **Credential Access (T1110)**: Harvesting credentials through capabilities like Local Authentication and credential dumping.
  - **Discovery (T1083)**: Enumerating network shares and other resources within the environment.

  The primary data sources to investigate include **process creation events**, which provide insights into the command lines used during execution, and **Windows event logs** to track associated user activities and system modifications.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs for instances of `crackmapexec.exe` execution, paying close attention to the command-line arguments used, particularly concerning local authentication and user credentials.
  - **Examine Command-Line Arguments**: Identify any instances where command-line flags indicate the use of modules such as `pe_inject`, `mssql`, and `smb`, which can signal abnormal behavior and potential exploitation attempts.
  - **Correlate with User Behavior**: Cross-reference the identified execution with user accounts to determine if the behavior aligns with expected activity for those accounts, particularly looking for unusual authentication patterns or geographic anomalies.
  - **Collect Relevant Logs**: Gather additional logs, including network traffic and Windows event logs, to explore any lateral movement or external connections initiated by the detected CrackMapExec activities.

  ### Prioritization
  This alert is categorized as high severity due to the significant risk posed by CrackMapExec in enabling attackers to perform lateral movement, impose further persistence, and escalate privileges within the environment. Given the prevalence of such tools in advanced persistent threat scenarios, prompt investigation is critical.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from situations where the CrackMapExec binary is not used directly, or where command-line arguments are obfuscated or altered. The detection logic assumes that processes executed by known users or in an expected context do not indicate malicious activity, potentially leading to false negatives. It also relies on comprehensive logging of process creation events, so any configurations that do not capture these logs may hinder detection efficacy.

