note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands that decode Gzip archives, specifically focusing on instances where the `GZipStream` class is employed alongside its `::Decompress` method. The presence of such command patterns may indicate that attackers are utilizing these capabilities for malicious purposes, such as extracting payloads from compressed files as part of a larger attack scenario. The likely objectives of an attacker employing this technique could include obscuring malicious content, evading detection, and facilitating the execution of malware on compromised systems.

  The relevant MITRE ATT&CK tactics for this behavior include "Command and Control" (TA0011) and the technique "Deobfuscate/Decode Files or Information" (T1132.001), which encompass the practice of encoding or decoding data to avoid detection. The primary sources of telemetry that will provide insight into these activities include process creation logs from Windows systems, which capture command lines used to initiate processes and can highlight potentially malicious use of PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for PowerShell process creations that contain the `GZipStream` and `::Decompress` strings. Pay attention to the full command line for unusual parameters or unexpected script names.
  - **Correlate with Parent Process**: Identify the parent processes that invoked the PowerShell commands. Look for suspicious or unrelated parent processes that could indicate an unauthorized execution context.
  - **Analyze User Context**: Determine if the execution occurred under the context of an administrator or a known legitimate user. Behavioral analysis should focus on whether the user is typically associated with such activities.
  - **Inspect Network Activity**: Check for outbound network connections established after the GZip decompression event. Unusual or unknown connections could signal further malicious activity, such as command-and-control communications.

  ### Prioritization
  The severity of this alert is medium due to the potential risk associated with the misuse of PowerShell for malicious purposes. While legitimate administrative actions may cause false positives, the likelihood of this technique being used in targeted attacks warrants immediate investigation.

  ### Blind Spots and Assumptions
  There are potential blind spots related to the detection of benign use cases, as legitimate administrative scripts could utilize Gzip decoding without malicious intent. The detection logic assumes that any execution of the specific PowerShell patterns is suspicious unless filtered out by strict conditions like the parent image or context of execution. Required logs for optimal functioning include process creation events with detailed command line arguments, along with configurations that ensure PowerShell command logging is enabled.

