  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands utilizing `GZipStream` for decompressing Gzip archives. Such behavior may indicate an attempt to decode malicious payloads, commonly utilized in malware distribution or data exfiltration processes. The likely attacker objective is to facilitate the retrieval or execution of hidden or obfuscated malware. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, with technique **Application Layer Protocol (T1071.001)**.

  Primary telemetry sources include Windows process creation logs, specifically capturing details from Security Event ID **4688** (process creation) and **Sysmon Event ID 1** (process creation events). If malicious, this behavior could signal active exploitation or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may employ similar functionalities.

  ### Investigation Steps

  - **Verify process creation details**: Inspect Windows Security Event ID **4688** logs for the process creation event associated with PowerShell, focusing on the `CommandLine` arguments to confirm the presence of `GZipStream` and `::Decompress`.

  - **Correlate with parent process**: Cross-reference the PowerShell command with the ParentImage attribute to determine if it was initiated by a known legitimate application (e.g., `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`). Look for suspicious parent processes that commonly accompany malicious executions.

  - **Check for encoded content**: Examine the file or payload being decompressed for malicious indicators, such as known malware hashes or unexpected file types (e.g., executable files) that do not align with expected administrative actions.

  - **Assess user context**: Validate the executing user account against authorized administrative accounts to identify any unauthorized or unusual activity. Determine if the account has a history of legitimate script execution.

  - **Identify and characterize expected behavior**: Confirm legitimate administrative PowerShell scripts that may use Gzip decompression for compressing log files or backup data. Collect and document typical command parameters and expected output from known scripts.

  ### Prioritization

  This alert is of **medium** severity; while decompression of Gzip archives via PowerShell could indicate malicious intent, the impact ultimately depends on the context—particularly the asset's role within the enterprise (e.g., server vs. workstation). The likelihood of malicious abuse is moderate given that this technique can be weaponized by threat actors for various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative functions that could trigger similar PowerShell commands. Continuous monitoring and tuning of alert settings are essential, as well as ensuring logs from the process creation are accurately captured. False positives may arise from routine maintenance tasks, adding a layer of complexity for SOC analysts. Related detections such as monitor unusual PowerShell activity (e.g., script block logging) can provide complementary insight and bolster coverage against evasions.

