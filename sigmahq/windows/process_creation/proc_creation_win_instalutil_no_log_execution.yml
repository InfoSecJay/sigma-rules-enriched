detection:
  selection:
    Image|endswith: '\InstallUtil.exe'
    Image|contains: 'Microsoft.NET\Framework'
    CommandLine|contains|all:
    - '/logfile= '
    - '/LogToConsole=false'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `InstallUtil.exe`, a .NET utility typically used to install and uninstall Windows services and components, executed without the creation of log files, which is unusual behavior for legitimate use. The likely attacker objective is to install malicious software or services stealthily, evading detection or analysis by omitting log creation. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically targets the technique of Indicator Removal on Host (T1089).

  The primary telemetry source for this detection is the Windows Process Creation logs, identified by Event ID 4688, and potentially Sysmon Event ID 1 if Sysmon is deployed. If malicious, the security impact could involve the introduction of unauthorized software or persistence mechanisms within the environment, allowing further malicious activity. It is crucial to note that this detection does NOT confirm that any malicious activity occurred on its own; it highlights suspicious usage that warrants further investigation.

  ### Investigation Steps

  - **Check for related process behavior:** Investigate for any preceding or subsequent process events linked to `InstallUtil.exe` using Event ID 4688 and correlate with Event ID 4672 (Special Privileges Assigned to New Logon) to identify if elevated permissions were used, which may indicate malicious intent.

  - **Examine command line arguments:** Analyze the command line arguments in Event ID 4688 for any unusual or unique strings beyond the specified arguments (e.g., `/logfile= ` and `/LogToConsole=false`), as legitimate calls typically include specific log file paths or exhibit standard usage patterns.

  - **Review corresponding Sysmon events:** If Sysmon is deployed, look for an Event ID 1 corresponding to `InstallUtil.exe` that would provide additional context on the parent process that invoked it, helping establish whether it was spawned from a legitimate application or another suspicious process.

  - **Identify installation artifacts:** Verify whether any known malicious payload or service has been created or modified by checking for newly created services (Event ID 7045) or corresponding file artifacts in locations such as `C:\Program Files\` or any unusual directories. Significant changes in these areas might indicate a successful compromise.

  - **Evaluate user context:** Determine the user context under which `InstallUtil.exe` was executed. Use Event ID 4624 (Successful Logon) to assess whether the user has a legitimate reason to install software or if the execution appears out of the ordinary for their role.

  - **Look for timing patterns:** Correlate this activity with any network activity or other system events (e.g., failed login attempts, unusual outbound connections) that may indicate lateral movement or exfiltration attempts taking place around the same timeframe.

  ### Prioritization

  This alert is of medium severity due to the potential risk introduced to the environment by executing `InstallUtil.exe` in a suspicious manner. Given that this utility is often exploited for defense evasion, the likelihood of malicious intent is elevated, particularly in environments where monitoring is not stringent.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers utilizing legitimate executables with benign command-line arguments or by properly logging InstallUtil usages. The detection relies on having Windows Process Creation logging enabled (Event ID 4688) as well as any Sysmon configurations capturing detailed process creation events. Legitimate activities such as system administrators performing updates or installations could falsely trigger this alert. A related detection to strengthen coverage could focus on monitoring unusual service installations or modifications through Event ID 7045, further illuminating service-level anomalies.

