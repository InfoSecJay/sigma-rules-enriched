detection:
  selection:
    Image|endswith: '\InstallUtil.exe'
    Image|contains: 'Microsoft.NET\Framework'
    CommandLine|contains|all:
    - '/logfile= '
    - '/LogToConsole=false'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the suspicious execution of `InstallUtil.exe`, a .NET tool that is often used for installing and configuring .NET applications. This detection is particularly relevant in scenarios where `InstallUtil.exe` is executed without generating logs, which can indicate malicious use aimed at bypassing detection mechanisms. Attackers may exploit this method to establish persistence, deploy malware, or manipulate system configurations stealthily, often as part of a larger compromise or lateral movement phase.

  The rule aligns with the MITRE ATT&CK framework, specifically targeting the tactics of **Defense Evasion** (Tactic ID: TA0005) and the technique of **Application Layer Protocol** (Technique ID: T1071). By observing the execution of `InstallUtil.exe`, this detection can aid in identifying when adversarial behaviors are attempted through legitimate application functionalities—thereby obscuring malicious actions.

  Primary data sources for this detection include **process creation events**, which provide visibility into executed commands on Windows systems, including the paths and arguments of running processes. This information is critical in establishing whether the execution of `InstallUtil.exe` was legitimate or malicious.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for the execution of `InstallUtil.exe`, focusing on the command line arguments used. Pay close attention to instances where the options `/logfile=` and `/LogToConsole=false` are present, as these are indicative of suspicious behavior.

  - **Correlate with Other Logs**: Gather supplementary logs, such as Windows Event Logs or Sysmon logs, to establish the context around the execution. Look for any unusual file accesses or network connections that occurred around the same time.

  - **Examine Associated Files**: Investigate any files being executed alongside `InstallUtil.exe` or created during its execution. This includes reviewing installation directories or temporary files that might have been generated without proper permissions.

  - **Identify User Context**: Determine under which user account `InstallUtil.exe` was executed. Investigate the user’s normal activity pattern and any previous alerts that may correlate with this execution to assess the legitimacy of the action.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant threat impact; the use of legitimate tools for malicious purposes is a common technique employed by attackers to avoid detection. The likelihood of encountering this behavior in an enterprise environment increases with overly permissive configurations, making it imperative to address any identified execution.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where logging for process creation is not sufficiently enabled or configured. The detection logic assumes that `InstallUtil.exe` is being invoked in unusual contexts—specifically lacking log output, which should generally be present in standard operations. Therefore, proper configurations for process logging within the operating system are essential for the detection to function effectively. Additionally, the detection logic does not account for custom logging behaviors implemented by organizations that may not conform to the standard usage of `InstallUtil.exe`.

