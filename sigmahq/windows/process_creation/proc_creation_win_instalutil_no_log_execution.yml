detection:
  selection:
    Image|endswith: '\InstallUtil.exe'
    Image|contains: 'Microsoft.NET\Framework'
    CommandLine|contains|all:
    - '/logfile= '
    - '/LogToConsole=false'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the .NET InstallUtil.exe application, specifically targeting instances where it is invoked without logging enabled. Typically, attackers exploit InstallUtil.exe to execute potentially malicious code while avoiding typical logging mechanisms, making the behavior suspicious. The likely objective is to install an executable or deploy a payload covertly while minimizing detection.

  This behavior is aligned with the MITRE ATT&CK tactic of Defense Evasion (T1203) and the technique of Opaque External Command Execution (T1059.001). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details, including command-line arguments. If the activity were malicious, it could facilitate unauthorized changes to the system or deployment of malware without detection.

  It is crucial to note that this detection does NOT confirm compromise on its own; further context and investigation are required to determine the intent and legitimacy of the execution.

  ### Investigation Steps

  - **Review process creation events**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1 that show InstallUtil.exe execution. Look for `CommandLine` fields indicating the use of `/logfile=` and `/LogToConsole=false` to assess if logging mechanisms were deliberately bypassed.

  - **Analyze the parent process**: Identify the parent process of InstallUtil.exe within the telemetry (Event ID 4688). A legitimate parent process is typically the installer for .NET applications. Investigate any suspicious progenitors like Powershell or cmd.exe.

  - **Correlate to recent software changes**: Review if the alert coincides with ongoing software installations or updates in your environment. Check Installer logs (e.g., MSI logs) for matching timestamps to rule out expected deployments.

  - **Identify malicious command line usage**: Specifically validate command lines which include paths to suspicious executables or scripts (e.g., unusual directories or `.exe` files) used with InstallUtil.exe. This may indicate an attempt to execute malicious payloads.

  - **Look for unusual network activity**: If possible, correlate the execution with subsequent network activity (e.g., outbound connections or file transfers) to identify any data exfiltration attempts or callbacks to command and control servers.

  - **Validate legitimate usage**: Typical, benign usage of InstallUtil.exe includes proper application installations with valid log files. Ensure that any installations stem from trusted sources or SHA signatures that reflect corporate software inventory.

  ### Prioritization

  The severity of this alert is medium due to the potential for malicious abuse of InstallUtil.exe to execute stealthy payloads. The impact can be significant if the system is critical or hosts sensitive data. Such behaviors are not only possible but have been weaponized in various attacks, making it a noteworthy alert for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to rename processes or use other utilities to evade detection. Ensure that process creation logging via Sysmon is configured correctly to capture all relevant data. Legitimate administrative activities, such as deployments via legitimate installers, may also trigger this alert. A related detection to consider is monitoring for other executables loaded through legitimate services or during scheduled tasks, which may complement coverage against stealthy execution patterns.

