title: Use of FSharp Interpreters
id: b96b2031-7c17-4473-afe7-a30ce714db29
status: test
description: |
  Detects the execution of FSharp Interpreters "FsiAnyCpu.exe" and "FSi.exe"
  Both can be used for AWL bypass and to execute F# code via scripts or inline.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/design/applications-that-can-bypass-wdac
- https://bohops.com/2020/11/02/exploring-the-wdac-microsoft-recommended-block-rules-part-ii-wfc-fsi/
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/FsiAnyCpu/
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Fsi/
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
date: 2022-06-02
modified: 2024-04-23
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\fsi.exe'
    - '\fsianycpu.exe'
  - OriginalFileName:
    - 'fsi.exe'
    - 'fsianycpu.exe'
  condition: selection
falsepositives:
- Legitimate use by a software developer.
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify the execution of specific FSharp interpreters, namely "FsiAnyCpu.exe" and "FSi.exe". These interpreters can be misused by attackers to bypass application whitelisting and execute F# code either through scripts or directly via command lines. The detection is particularly relevant in scenarios where malicious actors leverage these interpreters for execution of unauthorized scripts, potentially leading to code injection or other forms of execution-based attacks.

  The threat scenario typically involves attackers attempting to run potentially harmful scripts or payloads without detection, thereby achieving their objectives such as data exfiltration, system compromise, or lateral movement. The relevant MITRE ATT&CK tactics for this behavior are:
  - **Execution (TA0002)**, particularly the technique **Command-Line Interface (T1059)**, which includes running commands and scripts through various shells and interpreters.

  Primary data sources for gathering evidence regarding this alert include:
  - Process creation logs, which provide information on executed processes including their command-line arguments and parent-child relationships.
  - Windows Event Logs related to process creation, which include details on user context and security identifiers (SIDs) under which the interpreters are executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for instances of "FsiAnyCpu.exe" or "FSi.exe". Pay attention to the parent processes to identify any unusual or suspicious invocation patterns.

  - **Analyze Command-Line Arguments**: Inspect the command-line parameters used during the execution of these interpreters. Look for suspicious patterns, such as execution of encoded scripts or scripts from unusual locations.

  - **Correlate with Whitelisting Policies**: Verify whether the execution of these interpreters aligns with your organization's application control and whitelisting policies. Identify if this usage is legitimate based on the user's role and intent.

  - **Investigate Network Activity**: Check for any related network activity originating from systems where these interpreters were executed. Look for unusual outbound connections that may indicate data exfiltration or communication with command and control servers.

  ### Prioritization
  Given the potential for misuse and the ability of these interpreters to execute arbitrary code, this alert warrants a medium severity level. The likelihood of exploitation, particularly in organizations where application whitelisting is not rigorously enforced, increases the relevance and urgency of these alerts.

  ### Blind Spots and Assumptions
  This detection logic relies on the presence of logs that capture process creation events effectively. A potential gap exists if processes are executed in environments where logging is disabled or if the interpreters execute scripts from locations that are typically trusted and hence whitelisted. Additionally, the rule assumes that legitimate usage is infrequent enough to warrant alerts; therefore, extensive legitimate use by developers may create false positives without proper contextualization of the events. Organizations should ensure that all necessary logging configurations are enabled to support effective detection.

