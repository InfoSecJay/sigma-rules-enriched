note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of FSharp interpreters: "FsiAnyCpu.exe" and "FSi.exe." These executables are commonly leveraged for scripting and can be abused to execute arbitrary code as part of an attacker's toolkit, often bypassing application control mechanisms (e.g., WDAC). The likely attacker objective is to execute payloads that evade detection by executing scripts in an interpreted manner.

  Relevant MITRE ATT&CK technique: **Execution (T1059)**, specifically **Command and Scripting Interpreter (T1059.1)**. The primary telemetry source is Windows Process Creation logs, specifically Event ID 4688. If malicious, the execution of these binaries could lead to unauthorized code execution and potential system compromise. It is important to note that this detection does NOT confirm that the execution is inherently malicious; it could also represent legitimate developer activity.

  ---

  ### Investigation Steps

  - **Review the process creation log:** Check Event ID 4688 for instances of "fsi.exe" or "fsianycpu.exe." Investigate the **CommandLine** field for parameters indicating suspicious activity, such as network connections or external scripts.

  - **Verify parent process relationships:** Analyze the **ParentImage** field in Event ID 4688 to see which process spawned the interpreter. Legitimate development environments often show the parent as IDEs (e.g., Visual Studio), while suspicious ones may involve cmd.exe or powershell.exe.

  - **Assess execution context:** Identify user account in the **NewProcessName** and **AccountName** fields of the Event ID 4688. If executed by a non-administrative account in a restricted context or by a service account that doesn't typically run these interpreters, further scrutiny is warranted.

  - **Cross-reference with recently modified scripts:** Search for file modifications or executions in the last 24 hours that correlate with the execution timestamps of "fsi.exe" or "fsianycpu.exe." Look in the Windows Event Log for **FileCreate** events related to potentially malicious script files.

  - **Identify known good usages:** Document legitimate use cases of FSharp interpreters in your environment. If granted by a software developer, known good execution patterns can ease the investigation and clarify context.

  - **Monitor for additional suspicious behavior:** After confirming execution, watch for subsequent execution of scripts or payloads, especially if they involve downloading additional tools or attempting lateral movement. Utilize telemetry from Network Security Monitoring (NSM) for unexpected outbound connections.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of code execution within a critical enterprise environment. The likelihood of malicious use is increased given the execution of known bypass tools. However, it should be treated with caution as these interpreters can also be legitimately used by developers.

  ---

  ### Blind Spots and Assumptions

  The detection can miss instances where FSharp interpreters are executed in a context that is highly obfuscated or through custom scripts that utilize alternate means of execution. Reliable detection requires monitoring Event ID 4688 consistently across systems with active development. Legitimate scenarios could include development processes initiated by software engineers. An additional companion detection that could enhance coverage includes tracking script executions via PowerShell (T1059.4) to capture a broader range of potential misuse.

