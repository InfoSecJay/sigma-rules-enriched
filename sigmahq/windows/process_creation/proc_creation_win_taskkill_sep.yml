title: Taskkill Symantec Endpoint Protection
id: 4a6713f6-3331-11ed-a261-0242ac120002
status: test
description: |
  Detects one of the possible scenarios for disabling Symantec Endpoint Protection.
  Symantec Endpoint Protection antivirus software services incorrectly implement the protected service mechanism.
  As a result, the NT AUTHORITY/SYSTEM user can execute the taskkill /im command several times ccSvcHst.exe /f, thereby killing the process belonging to the service, and thus shutting down the service.
references:
- https://www.exploit-db.com/exploits/37525
- https://community.spiceworks.com/topic/2195015-batch-script-to-uninstall-symantec-endpoint-protection
- https://community.broadcom.com/symantecenterprise/communities/community-home/digestviewer/viewthread?MessageKey=6ce94b67-74e1-4333-b16f-000b7fd874f0&CommunityKey=1ecf5f55-9545-44d6-b0f4-4e4a7f5f5e68&tab=digestviewer
author: Ilya Krestinichev, Florian Roth (Nextron Systems)
date: 2022-09-13
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'taskkill'
    - ' /F '
    - ' /IM '
    - 'ccSvcHst.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to disable Symantec Endpoint Protection (SEP) by executing the `taskkill` command with specific parameters targeting the `ccSvcHst.exe` process. An attacker, or a compromised user, may leverage this technique to disable antivirus protections, opening the system to further exploitation or malware installation undetected. The likely objective is to circumvent security measures to execute malicious actions such as deploying payloads or stealing sensitive data.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic: Defense Evasion**
    - **Technique: Process Injection (T1562.001)** – The ability to terminate processes protected by the security software indicates attempts to evade detection and maintain further access to the environment.

  Primary data sources for this detection rule include process creation events, which capture command-line executions within the Windows environment. Additionally, telemetry from endpoint security devices and logs can provide context around process terminations that align with the timing of this command.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances of the `taskkill` command, focusing on any occurrences targeting `ccSvcHst.exe`.
  - **Analyze Command-Line Arguments:** Look closely at the command-line arguments used with `taskkill`, specifically checking for the presence of `/F`, `/IM`, and the mentioned executable to confirm the nature of the command issued.
  - **Check Security Event Logs:** Inspect security event logs for any other actions taken immediately before or after the `taskkill` command to identify potentially malicious behavior associated with disabling antivirus services.
  - **Correlate with User Activity:** Identify the user context in which the command was executed to determine if it aligns with legitimate administrative actions or if it points to potential user compromise.

  ### Prioritization
  This alert is marked as high severity due to the critical role that antivirus solutions like Symantec Endpoint Protection play in defending the enterprise environment. The ability to disable such protection significantly increases the risk of undetected threats and malware, making it imperative for security teams to respond swiftly.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage; for instance, this rule solely focuses on the termination of the Symantec process without considering other potential circumvention methods that may not involve this executable. The detection logic assumes that the attacker will utilize the `taskkill` command, which may not always be the case. This rule also requires logging for process creation events to operate effectively, and any misconfigurations or lack of logging on endpoints could result in missed detection opportunities.

