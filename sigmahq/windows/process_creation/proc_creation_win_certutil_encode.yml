title: File Encoded To Base64 Via Certutil.EXE
id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
status: test
description: Detects the execution of certutil with the "encode" flag to encode 
  a file to base64. This can be abused by threat actors and attackers for data 
  exfiltration
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, 
  Nasreddine Bencherchali (Nextron Systems)
date: 2019-02-24
modified: 2024-03-05
tags:
- attack.stealth
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-encode'
  condition: all of selection_*
falsepositives:
- As this is a general purpose rule, legitimate usage of the encode 
  functionality will trigger some false positives. Apply additional filters 
  accordingly
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_encode/info.yml
note: |
  ### Technical Context

  This rule detects the use of `certutil.exe` with the `-encode` flag, which encodes files to Base64 format. Attackers typically use this method to exfiltrate data covertly, as Base64 encoding can help bypass security mechanisms by disguising malicious payloads. The relevant MITRE ATT&CK techniques include **T1027: Obfuscated Files or Information**.

  The primary telemetry source for this alert is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If exploited maliciously, this behavior can lead to data exfiltration of sensitive information. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate administrative tasks may also utilize Base64 encoding.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for `certutil.exe`. Look for the specific command line containing `-encode` to confirm execution context.

  - **Identify the user context:** Validate the user account associated with the execution of `certutil.exe`. Legitimate administrative users may perform such actions, but unusual accounts executing this command should raise suspicion.

  - **Check the encoded file size:** Inspect the encoded output size; unusually large files encoded to Base64 can indicate exfiltration attempts and should be compared to typical usage patterns.

  - **Correlate with other log sources:** Cross-reference logs with other data sources such as network logs or Data Loss Prevention (DLP) alerts to identify any data transmission patterns following the execution of `certutil.exe`.

  - **Inspect command execution timestamp:** Review the timeline of `certutil.exe` usage against other relevant events (e.g., pre-existing suspicious behavior or known indicators of compromise) to establish context around the activity.

  - **Analyze legitimate use cases:** Determine if there is an active project or task justifying the legitimate use of the Base64 encoding capability by consulting with relevant operational teams.

  ### Prioritization

  This alert is of medium severity, as the impacted system could potentially be involved in sensitive operations. Although the likelihood of malicious use is moderate, the method is a known technique exploited in data exfiltration incidents.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers use obfuscation or alternative methods to encode data, meaning reviewing multiple telemetry sources is necessary. This rule relies on the availability of process creation logs; therefore, proper logging configuration is critical. Legitimate administrative activities with `certutil.exe` may trigger this alert, including its use in certificate management. A related detection is the monitoring of suspicious HTTP(s) requests after such encodings to strengthen coverage on potential data exfiltration.

