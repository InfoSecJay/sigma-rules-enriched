title: File Encoded To Base64 Via Certutil.EXE
id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
status: test
description: Detects the execution of certutil with the "encode" flag to encode 
  a file to base64. This can be abused by threat actors and attackers for data 
  exfiltration
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, 
  Nasreddine Bencherchali (Nextron Systems)
date: 2019-02-24
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-encode'
  condition: all of selection_*
falsepositives:
- As this is a general purpose rule, legitimate usage of the encode 
  functionality will trigger some false positives. Apply additional filters 
  accordingly
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_encode/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `certutil.exe` with the `-encode` flag, indicating that a file is being encoded to Base64. This behavior is often exploited by attackers for data exfiltration, allowing them to obfuscate sensitive information before transmitting it. The relevant MITRE ATT&CK tactics and techniques include Data Exfiltration (T1041) and Defense Evasion (T1027). The primary telemetry sources are process creation events, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which capture detailed process activity. The security impact of this behavior is significant; it may indicate an active exfiltration attempt or the preparation of data for later exfiltration. However, this detection does not confirm malicious intent on its own, as legitimate uses of `certutil` exist.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for the `certutil.exe` process. Validate that the command line includes `-encode`. If found without any additional context, this raises a potential alert.

  - **Correlate with additional telemetry:** Look at the same process creation events for parent process IDs to identify what initiated the `certutil.exe` execution. A PowerShell process might raise suspicion if it spawned `certutil.exe`.

  - **Assess expected behavior for legitimate use:** Identify usual file encoding tasks, such as those related to backups or data archiving done by authorized applications. Legitimate processes may include known backup software that utilizes `certutil.exe` for Base64 encoding.

  - **Identify high-confidence malicious indicators:** Check if the Base64 encoded data is being written to locations commonly targeted for exfiltration (e.g., temporary directories, user profile directories) by validating file system changes, such as Directory Service logs (Event ID 4663) showing file creation in sensitive or anomalous locations.

  - **Review endpoint security logs:** Examine EDR alerts for any subsequent network connections originating from `certutil.exe` that may indicate data exfiltration to potentially malicious external addresses.

  ### Prioritization

  This alert should be given medium priority. The potential impact of the affected system is heightened if it contains sensitive data, as the likelihood of malicious abuse exists due to the known use of `certutil.exe` in post-exploitation scenarios. This behavior is weaponized in various malware campaigns targeting organizations for data theft.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for skilled adversaries to obfuscate their use of `certutil.exe` or utilize alternative encoding methods. Reliable detection requires proper logging configurations for process creation events and ensures that Sysmon is deployed if needed for detailed visibility. Legitimate activities, such as system backups or administrative scripts involving data processing, may trigger this alert. A companion detection to consider would be monitoring for unusual web or outbound connections following `certutil.exe` execution, which strengthens the context around potential exfiltration.

