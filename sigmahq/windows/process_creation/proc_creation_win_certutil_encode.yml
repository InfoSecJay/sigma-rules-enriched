title: File Encoded To Base64 Via Certutil.EXE
id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
status: test
description: Detects the execution of certutil with the "encode" flag to encode a
  file to base64. This can be abused by threat actors and attackers for data exfiltration
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://unit42.paloaltonetworks.com/new-babyshark-malware-targets-u-s-national-security-think-tanks/
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine
  Bencherchali (Nextron Systems)
date: 2019-02-24
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-encode'
  condition: all of selection_*
falsepositives:
- As this is a general purpose rule, legitimate usage of the encode functionality
  will trigger some false positives. Apply additional filters accordingly
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_encode/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of the `certutil.exe` utility with the "-encode" flag, which is often misused by threat actors to encode files into Base64 format. Attackers may utilize this technique as part of their data exfiltration strategies, allowing them to covertly send sensitive files outside of a secured environment, potentially bypassing security controls. Such actions typically align with phases of a cyber attack, including data exfiltration and command and control establishment.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005)
  - **Obfuscated Files or Information** (T1027)

  The primary data sources for this rule are process creation logs that capture when executable files are run on Windows systems, particularly focusing on command-line arguments that are indicative of unusual or malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events around the time of the alert to identify the full command line used with `certutil.exe`, including any suspicious paths or parameters that indicate non-standard usage.
  - **Examine File Transfer Activity**: Check for any outbound network connections or data transfer logs that could correlate with the timing of the Base64 encoding event, especially to unfamiliar external IP addresses or domains.
  - **Check for Associated Files**: Investigate the file that was encoded using `certutil.exe`. Determine its origin and what data it contains, and whether it was previously flagged for unusual activity.
  - **Monitor for Subsequent Malicious Behavior**: Look for follow-up processes or behaviors by the user account or system that executed the command, as this may indicate a more extensive compromise or data exfiltration effort.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of data exfiltration and the likelihood of misuse in targeted attacks. While not all uses of `certutil.exe` for encoding are malicious, the nature of the behavior warrants prompt investigation to rule out any nefarious activity.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage as legitimate uses of the `certutil.exe` encode functionality can lead to false positives, particularly in enterprise environments where backups or legitimate data handling procedures may utilize this command. The detection logic assumes that the `certutil` executions are monitored adequately, and that process creation logs with the appropriate verbosity are collected. To ensure the alert functions as intended, comprehensive logging configurations must be in place across Windows systems.

