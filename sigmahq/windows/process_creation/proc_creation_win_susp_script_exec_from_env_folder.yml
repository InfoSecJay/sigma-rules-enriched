title: Script Interpreter Execution From Suspicious Folder
id: 1228c958-e64e-4e71-92ad-7d429f4138ba
status: test
description: Detects a suspicious script execution in temporary folders or 
  folders accessible by environment variables
references:
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-02-08
modified: 2023-06-16
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc_image:
    Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\wscript.exe'
  selection_proc_flags:
    CommandLine|contains:
    - ' -ep bypass '
    - ' -ExecutionPolicy bypass '
    - ' -w hidden '
    - '/e:javascript '
    - '/e:Jscript '
    - '/e:vbscript '
  selection_proc_original:
    OriginalFileName:
    - 'cscript.exe'
    - 'mshta.exe'
    - 'wscript.exe'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '\Temporary Internet'
    - '\Windows\Temp'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  condition: 1 of selection_proc_* and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Windows script interpreters (cscript.exe, wscript.exe, and mshta.exe) from potentially malicious locations, such as temporary directories or user-specific folders that may be manipulated by adversaries. The likely objective is to execute scripts that could perform unauthorized actions, including lateral movement, data exfiltration, or dropping additional malware. This behavior aligns with the MITRE ATT&CK technique for "Command and Scripting Interpreter" (T1059).

  The primary telemetry sources for this detection include Windows process creation logs (Security Event ID 4688) and Sysmon logs (Event ID 1). If these executions are malicious, they can lead to severe security breaches, including system compromise and data loss. It is important to note that this detection alone does not confirm malicious intent, as legitimate applications may also utilize script interpreters for benign purposes.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 logs for suspicious process executions involving cscript.exe, wscript.exe, or mshta.exe. Look for CommandLine arguments containing " -ep bypass ", " -ExecutionPolicy bypass ", or " -w hidden " which can indicate obfuscation techniques.

  - **Verify execution location:** Check the execution path of the identified scripts. Legitimate script executions usually occur from standard directories such as C:\Program Files\, while executions from folders like AppData\Local\Temp or public directories indicate potentially malicious activity.

  - **Analyze associated user accounts:** Monitor the user account that triggered the alert by reviewing User Logon IDs in the process creation logs. Ensure the account is authorized to execute scripts in the flagged locations. Anomalous accounts or usage patterns can signify a compromise.

  - **Check for other indicators of compromise:** Review Sysmon logs for related network activity (Event ID 3) connected to the process execution. Look for connections to known malicious IPs or domains that align with the timing of the script execution.

  - **Correlate with known benign activity:** Compare the alert against the typical behavior of authorized applications or scripts within your environment, particularly those executed from standard directories. Identify any ongoing legitimate scripts that might be invoking the same interpreters, noting their paths and purpose.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for significant impact on critical systems from unauthorized script execution. The likelihood of malicious abuse is substantial, as the behavior detected is commonly weaponized during various phases of attacks, particularly in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is misconfigured or if necessary script execution telemetry is not enabled, such as turning on detailed process creation auditing. Legitimate applications like system management scripts can trigger this alert, creating noise in the monitoring process. Consider correlating with companion detections, such as anomaly detection for PowerShell (T1059.001), which can help strengthen coverage against script-based attacks.

