title: Script Interpreter Execution From Suspicious Folder
id: 1228c958-e64e-4e71-92ad-7d429f4138ba
status: test
description: |
  Detects suspicious script execution from suspicious directories or folders accessible by environment variables that may indicate malware activity.
  Script interpreters (cscript, wscript, mshta, powershell) executing from folders like Temp, Public, or user profile directories may suggest attempts to evade detection or execute malicious scripts.
references:
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-02-08
modified: 2026-02-17
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc_image:
    Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\wscript.exe'
  selection_proc_flags:
    CommandLine|contains:
    - ' -ep bypass '
    - ' -ExecutionPolicy bypass '
    - ' -w hidden '
    - '/e:javascript '
    - '/e:Jscript '
    - '/e:vbscript '
  selection_proc_original:
    OriginalFileName:
    - 'cscript.exe'
    - 'mshta.exe'
    - 'wscript.exe'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\%Public%'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '\Temporary Internet'
    - '\Windows\Temp'
    - '\Start Menu\Programs\Startup\'
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Documents\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Music\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Videos\'
  filter_optional_chocolatey_installer:
    ParentImage:
    - 'C:\Windows\System32\Msiexec.exe'
    - 'C:\Windows\SysWOW64\Msiexec.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains|all:
    - '-NoProfile -ExecutionPolicy Bypass -Command'
    - 'AppData\Local\Temp\'
    - 'Install-Chocolatey.ps1'
  condition: 1 of selection_proc_* and 1 of selection_folders_* and not 1 of 
    filter_optional_*
falsepositives:
- Various legitimate software have been observed to use similar techniques for 
  installation or update purposes;thus, it is recommended to review and tune 
  filters for your environment to reduce false positives before deploying to 
  production.
level: high
note: |
  ### Technical Context

  This rule detects the execution of script interpreters (like `cscript.exe`, `mshta.exe`, and `wscript.exe`) from suspicious directories—such as Temp or Public—potentially indicating malicious activity. Attackers may aim to execute scripts to carry out actions like data exfiltration, exploitation of vulnerabilities, or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique T1059 (Command and Scripting Interpreter).

  The primary telemetry source for this detection includes Windows process creation logs (Event ID 4688 and Sysmon Event ID 1), which provide insights into executed commands and associated paths. If the behavior is malicious, it may lead to significant security impacts, such as data compromise or system corruption. However, it is crucial to note that this detection alone does not confirm that the activity is indeed malicious, as legitimate applications may also use similar execution methods.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1. Focus on instances where script interpreters are executed from paths like `C:\Users\Public\`, `C:\AppData\Local\Temp\`, or `C:\Windows\Temp\`. Compare the timestamps with any ongoing incident reports or known maintenance schedules.

  - **Review command line arguments:** Scrutinize the command lines of the detected processes for indicators like `-ExecutionPolicy Bypass`, `-ep bypass`, or any use of `-w hidden`. Legitimate scripts typically do not employ these flags and would not operate from temporary directories.

  - **Validate the parent process:** Check the parent process of the detected script interpreter. If the parent process is `Msiexec.exe` with a command line containing `Install-Chocolatey.ps1`, consider this a benign installation. Otherwise, further investigation is warranted.

  - **Identify user context:** Determine the user account under which the scripts were executed. If the execution is associated with a non-administrative user and targets sensitive directories, it may indicate suspicious activity.

  - **Correlate with other alerts:** Check for other alerts or behaviors that might indicate malicious intent, such as network connections initiated by the executing process or unusual file modifications on the same system.

  - **Assess for legitimate software usage:** Review any recent installations or updates to confirm whether trusted applications have run scripts. Cross-reference logs with known installation times to lessen false positives.

  ### Prioritization

  Given the high severity level of this alert, systems affected are often critical, as they may host sensitive data or operate vital infrastructure. The likelihood of malicious exploitation is elevated due to the common abuse of script execution techniques by attackers. This behavior is frequently weaponized in various threat scenarios, thus warranting immediate attention.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques where legitimate software behaves similarly but without triggering this rule. Accurate detection relies on comprehensive logging configurations, including Sysmon for detailed process tracking. Additionally, benign activities like software updates or scripts run by system management tools (e.g., chocolatey) may cause false positives. Companion detections for process injection or unusual outbound connections can enhance coverage against related threats.

