title: Script Interpreter Execution From Suspicious Folder
id: 1228c958-e64e-4e71-92ad-7d429f4138ba
status: test
description: Detects a suspicious script execution in temporary folders or folders
  accessible by environment variables
references:
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-08
modified: 2023-06-16
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc_image:
    Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\wscript.exe'
  selection_proc_flags:
    CommandLine|contains:
    - ' -ep bypass '
    - ' -ExecutionPolicy bypass '
    - ' -w hidden '
    - '/e:javascript '
    - '/e:Jscript '
    - '/e:vbscript '
  selection_proc_original:
    OriginalFileName:
    - 'cscript.exe'
    - 'mshta.exe'
    - 'wscript.exe'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '\Temporary Internet'
    - '\Windows\Temp'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  condition: 1 of selection_proc_* and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of script interpreters (such as `cscript.exe`, `wscript.exe`, and `mshta.exe`) from suspicious directories, particularly temporary folders or directories associated with environment variables. Attackers often leverage these interpreters to execute malicious scripts, which may serve various purposes such as executing payloads, downloading additional malware, or establishing persistence mechanisms. The rule focuses on detecting potentially obfuscated or hidden script execution techniques commonly used in various types of cyberattacks.

  The threat scenario often revolves around attackers using these scripts to bypass security controls and execute payloads without raising immediate suspicion. For example, the use of execution flags like `-ep bypass` or `-ExecutionPolicy bypass` indicates attempts to execute scripts in a way that circumvents restrictions placed by administrators. Attackers utilizing this method may be aiming for lateral movement, privilege escalation, or data exfiltration.

  Relevant MITRE ATT&CK tactics include:
  - **Execution** (TA0002) via techniques such as:
    - **Command and Scripting Interpreter** (T1059)

  Primary data sources for this detection include **process creation events** that track when scripts are executed along with their command-line arguments and associated folder paths.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events for any detection of script interpreters (like `cscript.exe`, `wscript.exe`, or `mshta.exe`) being executed. Pay particular attention to their command-line arguments for flags indicating potential malicious activity.

  - **Analyze Command-Line Arguments**: Focus on command-line inputs containing phrases like `-ep bypass`, `-ExecutionPolicy bypass`, or any references to scripting languages (e.g., JavaScript or VBScript). These can indicate attempts to execute scripts in a non-standard or hidden manner.

  - **Inspect Folders for Suspicious Scripts**: Look into the execution context; specifically check folders associated with temporary files (e.g., `C:\Users\*\AppData\Local\Temp` or `C:\Windows\Temp`). Identify any script files that may have been executed from these locations.

  - **Cross-Reference with User Activity**: Correlate detected script executions with user activity logs to determine if the actions align with user behavior or if they suggest lateral movement or privilege escalation attempts.

  ### Prioritization
  The alert's severity is deemed high due to the potential for script execution in sensitive paths to compromise system integrity or lead to further attacks. Malicious scripts executed from temporary folders indicate an active threat that could lead to significant breaches if not addressed promptly.

  ### Blind Spots and Assumptions
  The detection may not cover all instances of malicious script execution, especially if attackers use less common script interpreters or employ process-scrambling techniques. There is an assumption that process creation logs capture these events in detail. Additionally, the rule relies on the availability of appropriate Windows logging settings to capture command-line arguments and folder paths; if these logs are not enabled or retained, critical evidence may be lost.

