title: Script Interpreter Execution From Suspicious Folder
id: 1228c958-e64e-4e71-92ad-7d429f4138ba
status: test
description: |
  Detects suspicious script execution from suspicious directories or folders accessible by environment variables that may indicate malware activity.
  Script interpreters (cscript, wscript, mshta, powershell) executing from folders like Temp, Public, or user profile directories may suggest attempts to evade detection or execute malicious scripts.
references:
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-02-08
modified: 2026-02-17
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc_image:
    Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\wscript.exe'
  selection_proc_flags:
    CommandLine|contains:
    - ' -ep bypass '
    - ' -ExecutionPolicy bypass '
    - ' -w hidden '
    - '/e:javascript '
    - '/e:Jscript '
    - '/e:vbscript '
  selection_proc_original:
    OriginalFileName:
    - 'cscript.exe'
    - 'mshta.exe'
    - 'wscript.exe'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\%Public%'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '\Temporary Internet'
    - '\Windows\Temp'
    - '\Start Menu\Programs\Startup\'
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Documents\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Music\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Videos\'
  filter_optional_chocolatey_installer:
    ParentImage:
    - 'C:\Windows\System32\Msiexec.exe'
    - 'C:\Windows\SysWOW64\Msiexec.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains|all:
    - '-NoProfile -ExecutionPolicy Bypass -Command'
    - 'AppData\Local\Temp\'
    - 'Install-Chocolatey.ps1'
  condition: 1 of selection_proc_* and 1 of selection_folders_* and not 1 of 
    filter_optional_*
falsepositives:
- Various legitimate software have been observed to use similar techniques for 
  installation or update purposes;thus, it is recommended to review and tune 
  filters for your environment to reduce false positives before deploying to 
  production.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_script_exec_from_env_folder/info.yml
note: |
  ### Technical Context

  This rule detects the execution of scripting interpreters (cscript, wscript, mshta, PowerShell) from suspicious directories such as Temp, Public, or user profile directories. This behavior is indicative of a potential malware execution attempt, aimed at evading detection mechanisms by using user-accessible directories to run scripts. The relevant MITRE ATT&CK technique is T1059: Scripting, which denotes adversaries leveraging scripting languages to execute commands and payloads.

  The primary telemetry sources for this detection include Windows process creation logs capturing details about command line arguments and the execution path. Specifically, this involves analyzing Security Event ID 4688, Sysmon Event ID 1, or relevant process creation logs to scrutinize script execution patterns. Without contextual factors and further analysis, this detection does not automatically confirm malicious activity, as benign operations may also occur from these directories.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for any instances of cscript.exe, wscript.exe, mshta.exe, or powershell.exe running from suspicious folders (e.g., %TEMP%, C:\Users\Public\). Assess command line parameters for signs of evasion (e.g., ‘-ExecutionPolicy Bypass’).

  - **Correlate with user activity:** Investigate user activity around the timestamp of the alert by examining user logs or syslogs to identify any recent user actions that may explain legitimate execution of scripts from these folders.

  - **Identify high-confidence malicious indicators:** Look for scripts containing encoded command parameters (e.g., '/e:javascript') in their command line. Additionally, check for commands referencing the download or execution of known malicious scripts from Temp or Public directories.

  - **Analyze legitimate use cases:** Note that various legitimate applications may run scripts from these directories for updates or installations. Confirm whether any identified process correlates with known, benign software (e.g., Chocolatey installer).

  - **Monitor for lateral movement:** Review logs for any subsequent processes spawned by the detected script interpreters that may suggest lateral movement or data exfiltration, especially if originating from administrative accounts or critical assets.

  - **Evaluate the environment's execution context:** Understand if the environment has recently undergone updates or installations from trusted management tools that might explain these alerts. This is crucial for reducing false positives involving legitimate software.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on compromised systems that allow attackers to execute scripts, which can lead to the installation of malware, data exfiltration, or further lateral movement within the network. Given that the behavior detected is often weaponized in real attack scenarios, immediate investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate processes that also use script interpreters in similar contexts (e.g., installer scripts or system updates). It is crucial that all required log sources, such as Sysmon and Windows Security Event logs, are configured and actively monitored for effective detection. Legitimate activities, such as software updates or configurations from managed IT tools, could trigger this alert without malicious intent. A related detection that strengthens overall coverage would be monitoring for unusual outbound connections (MITRE T1071: Application Layer Protocol), which can indicate command and control communications following script execution.

