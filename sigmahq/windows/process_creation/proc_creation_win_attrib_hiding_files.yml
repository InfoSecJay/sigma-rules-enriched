title: Hiding Files with Attrib.exe
id: 4281cb20-2994-4580-aa63-c8b86d019934
status: test
description: Detects usage of attrib.exe to hide files from users.
references:
- https://unit42.paloaltonetworks.com/unit42-sure-ill-take-new-combojack-malware-alters-clipboards-steal-cryptocurrency/
- https://www.uptycs.com/blog/lolbins-are-no-laughing-matter
author: Sami Ruohonen
date: 2019-01-16
modified: 2023-03-14
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +h '
  filter_main_msiexec:
    CommandLine|contains: '\desktop.ini '
  filter_optional_intel:
    ParentImage|endswith: '\cmd.exe'
    CommandLine: '+R +H +S +A \\\*.cui'
    ParentCommandLine: 'C:\\WINDOWS\\system32\\\*.bat'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- IgfxCUIService.exe hiding *.cui files via .bat script (attrib.exe a child of cmd.exe
  and igfxCUIService.exe is the parent of the cmd.exe)
- Msiexec.exe hiding desktop.ini
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of `attrib.exe`, a built-in Windows utility, to hide files from user access. Attackers may employ this technique to obscure malicious files or resources and avoid detection during nefarious activities, such as maintaining persistence, exfiltrating data, or conducting further attacks while evading the watchful eye of security tools. The rule is particularly relevant in scenarios where malware or unauthorized users seek to manipulate file attributes to ensure their actions remain undetected.

  The primary MITRE ATT&CK tactics involved are **Defense Evasion** (TA0005) and the specific technique **Hide Artifacts** (T1564.001), which emphasizes the strategies attackers utilize to conceal their presence and operations from security monitoring. Effective detection relies on monitoring for modifications to file attributes that could signal malicious intent. The best sources of telemetry to support this rule include Windows process creation events, specifically tracking instances of `attrib.exe` and associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for the execution of `attrib.exe`, particularly focusing on process creation events to determine the context in which it was invoked, including any parent processes like `cmd.exe`.

  - **Inspect Command-Line Arguments:** Pay close attention to command-line arguments that employ '+h', which are typically related to hiding files. Validate if the stated criteria indicating a malicious intent, such as the absence of desktop.ini modifications, are met.

  - **Correlate With User Activity:** Check if the execution of `attrib.exe` correlates with legitimate user activity or if it appears anomalous, which could indicate a compromise. Look for unusual access patterns or attempted modifications to critical files.

  - **Evaluate Related Artifacts:** In cases of suspicion, check for additional artifacts like recent file system changes, logs of hidden files, and any obfuscated command scripts, such as .bat files, which may indicate a broader malicious activity.

  ### Prioritization
  This alert should be considered medium priority due to the potential for significant impact if an attacker successfully conceals malicious files. The likelihood of detection can vary based on users' and security tools' visibility into file states and their modification activities.

  ### Blind Spots and Assumptions
  The rule may miss instances where attackers utilize alternative methods to hide files or disguises that do not involve the `attrib.exe` utility. It assumes that the presence of `attrib.exe` in command-line activity is indicative of malicious intent when the command-line flags are used. Additionally, it requires robust logging configurations on Windows systems to capture sufficient process creation events, including all command-line arguments for accurate detection functionality.

