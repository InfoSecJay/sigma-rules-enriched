title: Hiding Files with Attrib.exe
id: 4281cb20-2994-4580-aa63-c8b86d019934
status: test
description: Detects usage of attrib.exe to hide files from users.
references:
- https://unit42.paloaltonetworks.com/unit42-sure-ill-take-new-combojack-malware-alters-clipboards-steal-cryptocurrency/
- https://www.uptycs.com/blog/lolbins-are-no-laughing-matter
author: Sami Ruohonen
date: 2019-01-16
modified: 2023-03-14
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +h '
  filter_main_msiexec:
    CommandLine|contains: '\desktop.ini '
  filter_optional_intel:
    ParentImage|endswith: '\cmd.exe'
    CommandLine: '+R +H +S +A \\\*.cui'
    ParentCommandLine: 'C:\\WINDOWS\\system32\\\*.bat'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- IgfxCUIService.exe hiding *.cui files via .bat script (attrib.exe a child of 
  cmd.exe and igfxCUIService.exe is the parent of the cmd.exe)
- Msiexec.exe hiding desktop.ini
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `attrib.exe` to hide files on Windows systems, specifically when files are marked with the hidden attribute using the command line options `+h`, alongside possible combinations to set them as read-only, system files, and archived. The likely attacker objective is to evade detection of malicious files or artifacts by making them invisible to users and standard file listings. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion, under technique T1564.001 (Hide Artifacts).

  The primary telemetry source involves process creation events on Windows, particularly monitoring Event ID 4688, where commands executed with `attrib.exe` can be parsed for suspicious flags. If malicious, the activity can lead to the concealment of malware, persistent footholds, or sensitive data exfiltration. Importantly, this detection does not confirm that the hidden files contain malicious content; it merely indicates an attempt to hide files.

  ### Investigation Steps

  - **Examine process creation logs for `attrib.exe`:** Review Windows Security Event ID 4688 for any instances of `attrib.exe` execution, specifically looking for command line arguments containing `+h`. Compare against expected benign context to determine relevance.

  - **Identify parent processes:** Check for the parent process associated with `attrib.exe`, noting if it is launched by legitimate processes (e.g., `cmd.exe`) or potentially suspicious ones. Malicious uses typically feature unusual parent processes or chains.

  - **Verify arguments for anomalies:** Focus on command line arguments used with `attrib.exe`, particularly `+h` and additional attributes set. Examples of benign usage might include user-generated scripts for legitimate file management; malicious use often lacks context.

  - **Search for hidden files:** Utilize file system auditing to identify files marked hidden within affected directories, especially targeting directories where sensitive or unusual files might reside. Cross-reference file timestamps and hashes for known malware signatures.

  - **Review logs for common false positives:** Be mindful of known benign usages, such as `IgfxCUIService.exe` or `msiexec.exe` managing file visibility for legitimate desktop configurations or UI elements. Match findings against these processes to avoid misclassification.

  ### Prioritization

  This alert has a medium severity due to the potential for an adversary to effectively hide malicious activity, particularly on critical systems such as servers or workstations handling sensitive data. The use of `attrib.exe` for hiding files is a known technique in various attacks, making it necessary to assess the context thoroughly.

  ### Blind Spots and Assumptions

  Detection limitations may arise when legitimate applications or scripts use `attrib.exe` for valid purposes, which can lead to false positives. Required log sources include comprehensive monitoring of process creation events and command line arguments captured via Sysmon or native Windows logging. Additionally, this detection might miss instances if the attributes are manipulated through non-standard methods or tools. A related detection to consider is monitoring for processes that create or modify files, enhancing coverage of suspicious file manipulation activities.

