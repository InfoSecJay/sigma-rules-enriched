title: Hiding Files with Attrib.exe
id: 4281cb20-2994-4580-aa63-c8b86d019934
status: test
description: Detects usage of attrib.exe to hide files from users.
references:
- https://unit42.paloaltonetworks.com/unit42-sure-ill-take-new-combojack-malware-alters-clipboards-steal-cryptocurrency/
- https://www.uptycs.com/blog/lolbins-are-no-laughing-matter
author: Sami Ruohonen
date: 2019-01-16
modified: 2023-03-14
tags:
- attack.stealth
- attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +h '
  filter_main_msiexec:
    CommandLine|contains: '\desktop.ini '
  filter_optional_intel:
    ParentImage|endswith: '\cmd.exe'
    CommandLine: '+R +H +S +A \\\*.cui'
    ParentCommandLine: 'C:\\WINDOWS\\system32\\\*.bat'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- IgfxCUIService.exe hiding *.cui files via .bat script (attrib.exe a child of 
  cmd.exe and igfxCUIService.exe is the parent of the cmd.exe)
- Msiexec.exe hiding desktop.ini
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `attrib.exe` with command-line parameters indicative of hiding files, specifically those that include the `+h` flag. Such behavior is commonly associated with an attacker attempting to obscure malicious files from user visibility, evading detection during a breach or post-compromise operation. The likely attacker objective is to hide malware, sensitive data, or staging files to prevent discovery by security teams. It relates to the MITRE ATT&CK technique "Hidden Files and Directories" (T1564.001), which falls under the tactic of "Defense Evasion."

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details on processes being executed, including their command-line arguments. If this behavior is found to be malicious, it may indicate a significant compromise or ongoing data exfiltration efforts. However, this detection alone does NOT confirm that malicious activity is occurring; further context is needed to ascertain the intent behind the command execution.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 (Process Creation) or Sysmon Event ID 1 for `attrib.exe` execution events. Check the command line used for `+h` and identify any unusual file paths.

  - **Identify parent process**: Validate the ParentImage field in the relevant logs. If the parent process is `cmd.exe`, assess whether the invoking command comes from a known legitimate source or is part of suspicious activity.

  - **Check for high-confidence indicators**: Look for specific commands such as `attrib +h C:\path\to\suspicious_file.exe` from untrusted or unexpected users. The presence of this must raise flags for potential malicious behavior.

  - **Correlate with other events**: Investigate any network connections from the same user account or system in the timeframe surrounding the `attrib.exe` execution. Use relevant telemetry, such as Windows Firewall Event ID 5156, for outbound connections.

  - **Analyze legitimate usage patterns**: Understand that some applications may use `attrib.exe` legitimately (e.g., certain Windows services). Compare historical execution patterns of `attrib.exe` against changes in user behavior or system configuration.

  - **Verify file creation or modification**: Use file auditing logs (Event ID 4663) to verify whether files were recently created or modified following the use of `attrib.exe`. Look for anomalies in file behavior.

  ### Prioritization

  The alert has medium severity in the enterprise context. While the action of hiding files might indicate an underlying compromise, such behavior is not uncommon in system maintenance or legitimate software operations. Therefore, the urgency is modulated by the surrounding context and nature of the impacted system.

  ### Blind Spots and Assumptions

  Detection may be limited if systems do not have adequate logging enabled for process creation or if legitimate admin operations frequently use `attrib.exe`. The rule may also capture benign activities when software employs `attrib.exe` for legitimate file management. A related detection that strengthens coverage could be monitoring for abnormal process trees where non-administrative users invoke processes typically reserved for system functions.

