detection:
  selection:
    CommandLine|contains:
    - 'Invoke-RestMethod '
    - 'Invoke-WebRequest '
    - 'IRM '
    - 'IWR '
    CommandLine|contains|all:
    - 'http'
    - 'OutFile'
    - '.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where potential malicious DLL files are downloaded using PowerShell's `Invoke-WebRequest` or `Invoke-RestMethod` cmdlets. Attackers often employ these methods to retrieve and execute malware, aiming to establish persistence or further exploit the compromised system. Relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is "Command-Line Interface" (T1059.001) and "Remote File Copy" (T1105). The primary telemetry sources for this detection are Windows process creation logs, specifically looking for command lines containing indicators of web requests and DLL file extensions.

  If such behavior is confirmed to be malicious, it can lead to serious security incidents, including unauthorized remote code execution and data breaches. However, this detection alone does NOT confirm that a malicious action took place, as legitimate scripts from trusted sources may generate similar command lines.

  ---

  ### Investigation Steps

  - **Inspect the command line arguments:** Review Security Event ID 4688 logs for process creation, focusing on command lines that include `Invoke-RestMethod` or `Invoke-WebRequest` with parameters containing 'http', 'OutFile', and '.dll'.

  - **Correlate with source IP:** Check the originating IP address of the HTTP request in logs (such as Proxy logs or firewall logs) to determine if it's a known malicious host or unusual for your environment.

  - **Analyze the destination files:** Validate the presence of any DLL files downloaded to the system by checking file creation events in the target directory (e.g., C:\Users\<User>\Downloads). Focus on timestamps and file hashes that may correlate with known malware signatures.

  - **Review for benign use cases:** Compare command line executions against historical normal PowerShell activities in the environment, especially for system updates or software installations that may legitimately download DLL files.

  - **Examine user behavior and permissions:** Analyze user roles and their behavior surrounding the event to ascertain if this was within expected administrative tasks or indicative of a user account being misused.

  - **Check for follow-up processes:** Investigate subsequent process creation (Event ID 4688) that originates from the downloaded DLL to see if it triggers any suspicious activity, such as launching a known malware process or creating network connections.

  ---

  ### Prioritization

  This alert is medium severity due to the potential risk of DLL-based attacks, particularly on critical systems that may provide elevated permissions. The behavior detected is a common tactic used by adversaries to execute malicious code, indicating a moderate likelihood of abuse in environments that allow PowerShell scripting without restrictions.

  ---

  ### Blind Spots and Assumptions

  One limitation of this detection is that it may be evaded by using obfuscation techniques or alternative methods for downloading files, such as using native tools that avoid PowerShell logging. Ensuring that PowerShell logging is properly configured and enabled is crucial for reliable detection. Additionally, legitimate enterprise applications may sometimes use similar command lines for valid operations, potentially triggering false positives. A related detection could involve monitoring for unusual outbound network connections, which would strengthen coverage of potential file-for-remote-execution scenarios.

