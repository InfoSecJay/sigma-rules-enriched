title: Potential DLL File Download Via PowerShell Invoke-WebRequest
id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
status: test
description: Detects potential DLL files being downloaded using the PowerShell 
  Invoke-WebRequest or Invoke-RestMethod cmdlets.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: Florian Roth (Nextron Systems), Hieu Tran
date: 2023-03-13
modified: 2025-07-18
tags:
- attack.command-and-control
- attack.execution
- attack.t1059.001
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - 'Invoke-RestMethod '
    - 'Invoke-WebRequest '
    - 'IRM '
    - 'IWR '
    CommandLine|contains|all:
    - 'http'
    - 'OutFile'
    - '.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commandlets `Invoke-WebRequest` and `Invoke-RestMethod` to download DLL files, which may indicate malicious activities such as the delivery of payloads or exploitation frameworks. The objectives of an attacker in this scenario include downloading and executing malicious code to establish persistence or gain unauthorized access. This activity aligns with the MITRE ATT&CK techniques: `T1059.001 - Command and Scripting Interpreter: PowerShell` and `T1105 - Ingress Tool Transfer`.

  The primary telemetry sources are Windows event logs related to process creation, mainly captured by Security Event ID 4688 or Sysmon Event ID 1. If this behavior is determined to be malicious, it could potentially lead to a compromise of sensitive data or system integrity. Importantly, this detection does NOT confirm that a DLL is malicious solely based on its download; context regarding subsequent execution and network behavior is necessary for a conclusive determination.

  ### Investigation Steps

  - **Review command line details**: Check PowerShell command line arguments for Event ID 4688 or Sysmon Event ID 1. Look for strings like `Invoke-WebRequest` or `Invoke-RestMethod` combined with `.dll` in the URL. Malicious indicators may include unusual sites or IP addresses known for hosting malware.

  - **Check process parentage**: Analyze process creation chains to identify the parent processes of PowerShell (Event ID 4688). Legitimate PowerShell commands may originate from administrative scripts or systems management tools, while unexpected origins, like run-of-the-mill applications, can indicate compromise.

  - **Examine network connections**: Look for associated outbound connections to external servers around the same time as the downloads through Windows Firewall logs or network monitoring tools. Malicious downloads often correlate with suspicious destination IPs not aligned with company operations.

  - **Validate file existence and integrity**: If a DLL file is downloaded, check file creation on relevant directories. Validate file integrity using file hash comparisons against known malicious hashes to differentiate between benign and malicious files.

  - **Consider asset criticality**: Identify the role of the affected host. A workstation may warrant different scrutiny than a server that handles sensitive data. Prioritize investigations on critical assets due to potential impact severity.

  ### Prioritization

  The alert severity is medium due to the potential for downloading malicious code, especially on critical systems. Although this behavior can indicate an initial compromise, the likelihood of malicious intent should be assessed alongside the context of the environment. This technique has been widely weaponized in various attacks to deliver malicious payloads.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of obfuscation in command strings or the execution of PowerShell in a non-standard way (e.g., encoded commands). Reliable detection requires the full logging of all PowerShell commands, which may not always be active. Legitimate activities such as software updates or internal tool downloads may trigger alerts. Companion detections could include monitoring for unusual outbound HTTP/S requests to further validate the legitimacy of network operations post-download.

