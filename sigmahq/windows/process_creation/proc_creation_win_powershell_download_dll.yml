title: Potential DLL File Download Via PowerShell Invoke-WebRequest
id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
status: test
description: Detects potential DLL files being downloaded using the PowerShell 
  Invoke-WebRequest or Invoke-RestMethod cmdlets.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: Florian Roth (Nextron Systems), Hieu Tran
date: 2023-03-13
modified: 2025-07-18
tags:
- attack.command-and-control
- attack.execution
- attack.t1059.001
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - 'Invoke-RestMethod '
    - 'Invoke-WebRequest '
    - 'IRM '
    - 'IWR '
    CommandLine|contains|all:
    - 'http'
    - 'OutFile'
    - '.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_download_dll/info.yml
note: |
  ### Technical Context

  This rule detects the potential download of DLL files executed through PowerShell using the `Invoke-WebRequest` or `Invoke-RestMethod` cmdlets. The attacker likely aims to deliver malware or malicious payloads by leveraging PowerShell scripts for command-and-control (C2) purposes. This behavior is aligned with MITRE ATT&CK Technique T1059.001 (Command and Scripting Interpreter: Windows PowerShell) and T1105 (Ingress Tool Transfer).

  Primary telemetry sources include Windows event logs related to process creation, specifically Security Event ID 4688 and Sysmon Event ID 1, which log executed command lines. If successful, this technique can introduce malicious DLL files that compromise system integrity, leading to various malicious outcomes, such as persistence, information theft, or lateral movement. It is important to note that this detection does NOT confirm that the downloaded file was executed or that it is malicious; further analysis is required.

  ### Investigation Steps

  - **Review command line arguments:** Check for PowerShell commands logged under Security Event ID 4688 or Sysmon Event ID 1. Look specifically for any of the following patterns in the command line: `Invoke-WebRequest`, `Invoke-RestMethod`, and `.dll` file extensions.

  - **Identify the download location:** Investigate the `OutFile` parameter in the detected commands to confirm the file path where the DLL was saved. Common benign paths include user directories or application folders. Suspicious paths may include temporary folders or unexpected system directories.

  - **Cross-reference file properties:** After identifying the DLL file's path, verify its properties, such as creation date and digital signature. Legitimate system files typically have signatures from Microsoft, while malicious files may lack a signature or have signatures from untrusted sources.

  - **Monitor related processes:** Analyze any parent-child process relationships around the detected event. A legitimate PowerShell script may be launched by known administrative tools or scheduled tasks, while suspicious executions may follow unusual process hierarchies with unfamiliar parent processes.

  - **Validate against threat intelligence:** Use threat intelligence databases to check if the detected DLL file hash correlates with known malware samples. High-confidence malicious indicators include hashes publicly listed as malicious.

  ### Prioritization

  This alert carries medium severity due to the potential impact of the affected systems if malicious DLLs are executed. The likelihood of exploitation is moderate, as attackers frequently use PowerShell for malicious payload delivery. Downloading DLL files is a common tactic leveraged in modern malware delivery campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logs are disabled or if logs are not retained for sufficient durations. The rule may also misfire on legitimate administrative activities, such as system updates or software installations. Companion detections that can enhance coverage include monitoring for unauthorized PowerShell usage (e.g., execution policy changes or script block logging) and network traffic to known malicious domains.

