title: Potential DLL File Download Via PowerShell Invoke-WebRequest
id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
status: test
description: Detects potential DLL files being downloaded using the PowerShell Invoke-WebRequest
  or Invoke-RestMethod cmdlets.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: Florian Roth (Nextron Systems), Hieu Tran
date: 2023-03-13
modified: 2025-07-18
tags:
- attack.command-and-control
- attack.execution
- attack.t1059.001
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - 'Invoke-RestMethod '
    - 'Invoke-WebRequest '
    - 'IRM '
    - 'IWR '
    CommandLine|contains|all:
    - 'http'
    - 'OutFile'
    - '.dll'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of PowerShell commands, specifically `Invoke-WebRequest` and `Invoke-RestMethod`, to download potential Dynamic Link Library (DLL) files. Attackers often utilize these commands to obtain malicious payloads, possibly for further exploitation or installation of backdoor functionalities in a target environment. The detection focuses on the command-line patterns that suggest the retrieval of DLLs over HTTP, which may indicate a command-and-control (C2) activity or an attempt to deploy malicious code.

  The key attacker objectives behind this behavior typically involve maintaining persistence, gaining unauthorized access, or executing malicious payloads aimed at compromising the target system. By downloading DLL files, attackers can introduce malware into the system or leverage malicious libraries for later usage, which can lead to data exfiltration or lateral movement within a network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Execution: T1059.001 - PowerShell
  - Command and Control: T1105 - Ingress Tool Transfer

  Primary data sources for this detection rule include process creation logs that capture command-line arguments executed on Windows systems, providing clear insight into potentially harmful activities.

  ### Investigation Steps
  - **Review Process Creation Events:** Gather logs that detail process creation to identify instances where `Invoke-WebRequest`, `Invoke-RestMethod`, or related commands were executed. Pay attention to any command-line arguments that include HTTP references and file downloads.

  - **Analyze Command-Line Arguments:** Focus specifically on the command lines containing `http`, `OutFile`, and `.dll` to assess the context of the download. Verify if these commands originate from trusted or expected processes.

  - **Correlate with Network Logs:** Check network traffic logs for connections made to external IPs associated with the download actions. This can help determine if the download is linked to known malicious domains or IP addresses.

  - **Inspect System Changes:** Investigate any subsequent changes on the system, such as new DLL files in system directories or unexpected behaviors in applications, which could indicate successful execution of the downloaded payload.

  ### Prioritization
  The alert is considered a medium severity in an enterprise environment due to its potential to indicate malicious activity. Given that downloading DLLs with PowerShell can lead to significant breaches if they contain malware, prompt attention is warranted to confirm the intent behind these commands.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding environments that utilize legitimate PowerShell scripts for tasks such as automated updates or internal software distribution. The detection logic assumes that indicators like HTTP links and specific command-line arguments reliably signify malicious activity, which may not always be the case. Proper logging configurations must be in place to capture the necessary process creation events; without these logs, the detection will fail to function effectively, allowing potential threats to go unnoticed.

