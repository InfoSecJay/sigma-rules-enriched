note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell commands that exhibit abnormal casing, particularly in the `Net.WebClient` string. Such techniques, often utilized to obfuscate malicious intentions, can signal covert operations by attackers to exfiltrate data or establish remote connections. The obfuscation leverages the flexibility of PowerShell, allowing adversaries to bypass traditional detections by presenting their commands in a visually confusing manner without altering the underlying functionality.

  The relevant MITRE ATT&CK tactics tied to this detection include **Execution** (TA0002) and **Command and Scripting Interpreter: Windows Command Shell** (T1059.001). These concepts emphasize the execution of scripts or commands through shell environments, particularly with the intention of executing malicious payloads undetected. The primary data sources for capturing this telemetry are process creation logs, specifically focusing on PowerShell execution and associated command-line arguments.

  ### Investigation Steps
  - **Review Command Line Arguments:** Examine the command line arguments of running PowerShell processes for anomalies, particularly those containing variations in casing for `Net.WebClient`. Identify any instances that deviate from standard usage patterns.

  - **Collect PowerShell Logs:** Gather detailed PowerShell logs (e.g., using Module Logging and Transcription) to assess the context surrounding the suspicious commands. Evaluate the frequency and source of execution to identify potential repeat offenders or automated scripts.

  - **Inspect Process Creation Events:** Analyze process creation events in your security tools (such as EDR solutions) for any instances that match the signature of the detected irregular casing. Look for clustering of these events from unusual user accounts or at odd hours.

  - **Correlate with Network Traffic:** If possible, cross-reference detected PowerShell commands with related network traffic to identify any unusual outbound connections made by the user/system that would correspond with the execution of suspicious scripts.

  ### Prioritization
  The alert's severity is classified as high due to the potential for serious operational impact. Anomalous PowerShell usage can indicate active exploitation or unauthorized access, which may lead to data breaches or further compromise of network resources.

  ### Blind Spots and Assumptions
  This detection may have gaps in identifying obfuscated PowerShell commands using alternative techniques or varying casing conventions beyond those defined in the rule. The detection logic assumes that PowerShell execution logs are properly collected and that no other applications are generating similar casing anomalies. It is essential to ensure that the logging of process creation events and PowerShell scripts is enabled and configured correctly across the environment for effective detection.

