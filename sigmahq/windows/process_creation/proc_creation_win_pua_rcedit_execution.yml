title: PUA - Potential PE Metadata Tamper Using Rcedit
id: 0c92f2e6-f08f-4b73-9216-ecb0ca634689
status: test
description: Detects the use of rcedit to potentially alter executable PE 
  metadata properties, which could conceal efforts to rename system utilities 
  for defense evasion.
references:
- https://security.stackexchange.com/questions/210843/is-it-possible-to-change-original-filename-of-an-exe
- https://www.virustotal.com/gui/file/02e8e8c5d430d8b768980f517b62d7792d690982b9ba0f7e04163cbc1a6e7915
- https://github.com/electron/rcedit
author: Micah Babinski
date: 2022-12-11
modified: 2023-03-05
tags:
- attack.defense-evasion
- attack.t1036.003
- attack.t1036
- attack.t1027.005
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\rcedit-x64.exe'
    - '\rcedit-x86.exe'
  - Description: 'Edit resources of exe'
  - Product: 'rcedit'
  selection_flags:
    CommandLine|contains: '--set-'     # Covers multiple edit commands such as "--set-resource-string" or "--set-version-string"
  selection_attributes:
    CommandLine|contains:
    - 'OriginalFileName'
    - 'CompanyName'
    - 'FileDescription'
    - 'ProductName'
    - 'ProductVersion'
    - 'LegalCopyright'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool by administrators or users to update metadata of a 
  binary
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the Rcedit tool, primarily targeting scenarios where executable file metadata is altered. The likely attacker objective is to modify executable properties to obfuscate the source or purpose of a binary, thereby facilitating evasion of security measures (defense evasion). This behavior aligns with the MITRE ATT&CK techniques of "Modify Existing Software" (T1036.003) and "Masquerading" (T1036). The primary telemetry sources involved are process creation event logs from Windows, specifically looking for creation events associated with Rcedit and the modification of executable properties. If this behavior is malicious, it could serve as a precursor to more extensive malicious activities or malware deployment. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may trigger the same events.

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 to confirm instances of Rcedit execution. Analyze the command line used for execution to see if it includes parameters like `--set-OriginalFileName`, which indicates an attempt to alter key metadata.

  - **Analyze command line arguments:** Investigate the specific command line arguments passed during the execution of Rcedit. Look for the presence of `--set-` followed by any of the metadata fields such as `OriginalFileName`, `CompanyName`, or `FileDescription`. If these arguments are present, it is indicative of potential tampering.

  - **Identify suspicious image paths:** Validate the process image path by checking if it ends with `\rcedit-x64.exe` or `\rcedit-x86.exe`. Note that legitimate uses may involve these tools but should be limited in context.

  - **Check for recent executable changes:** Examine the timestamps and hash values of associated executables that may have been modified as a result of using Rcedit. Compare these changes against baseline configurations to identify anomalies.

  - **Determine host role relevance:** Consider the host role and criticality of the affected system. For example, Rcedit being used on a workstation with high administrative privileges versus a non-critical server may suggest a different level of concern.

  - **Review legitimate administrative actions:** Verify if there are legitimate reasons for metadata updates. Typically, trusted administrative tasks may involve consistent and documented usage of Rcedit for resource updates without significant deviation from established norms or patterns.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact if a critical system is compromised and utilized to masquerade malicious activity. The likelihood of malicious abuse exists, especially since Rcedit can be weaponized to obscure the true nature of malware. However, this behavior can also be used legitimately by administrators, necessitating careful review.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate administrative actions that may also trigger this alert, such as routine metadata updates. Reliance on specific log configurations is essential to ensure full coverage of Rcedit executions. Additionally, common evasion techniques may include using alternative metadata editing tools that are less detectable. Companion detections, such as monitoring for suspicious network activity or file integrity changes post-execution of Rcedit, can provide added context and improve detection accuracy.

