logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\rcedit-x64.exe'
    - '\rcedit-x86.exe'
  - Description: 'Edit resources of exe'
  - Product: 'rcedit'
  selection_flags:
    CommandLine|contains: '--set-'     # Covers multiple edit commands such as "--set-resource-string" or "--set-version-string"
  selection_attributes:
    CommandLine|contains:
    - 'OriginalFileName'
    - 'CompanyName'
    - 'FileDescription'
    - 'ProductName'
    - 'ProductVersion'
    - 'LegalCopyright'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool by administrators or users to update metadata of a binary
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of `rcedit`, a tool used to modify Portable Executable (PE) metadata properties. Such modifications may be employed by attackers to obfuscate malicious executable files by renaming system utilities or disguising malware, which serves the purpose of defense evasion. By altering attributes such as `OriginalFileName`, `CompanyName`, and `ProductVersion`, attackers can mislead security controls and defenders into misidentifying the nature of the executable.

  The relevant MITRE ATT&CK tactics that apply to this rule include:
  - **Defense Evasion (T1562)**: The primary objective is to prevent detection by changing the metadata of executables.
  - **Indicator Removal on Host (T1070)**: Modifying file attributes can be seen as an attempt to hide the presence of malicious files or activities.
  - **Masquerading (T1036)**: Renaming system utilities or altering their metadata allows attackers to create the illusion of legitimacy.

  The primary data sources for this detection are:
  - Process creation logs, which record the execution of processes and include command-line parameters.
  - Application logs, particularly those related to specific utilities that manipulate executable files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `rcedit-x64.exe` and `rcedit-x86.exe`. Check the command lines executed for modifications indicating potential attempts at altering PE metadata.
  - **Analyze Command-Line Arguments**: Focus on any command lines containing `--set-`, especially those tied to attributes like `OriginalFileName`, `CompanyName`, and `ProductName`, which could signal malicious modifications.
  - **Inspect File Metadata**: Verify the current metadata properties of any executables modified via `rcedit`, comparing their original values against legitimate software attributes to detect anomalies.
  - **Conduct Threat Hunting**: Search for historical usage of `rcedit` across the environment. Document any legitimate usage cases, such as administrator activities, to distinguish normal operations from potential threats.

  ### Prioritization
  This alert bears medium severity due to its implications for defense evasion in an enterprise environment. The use of `rcedit` may indicate proactive attempts by malicious actors to conceal their presence, potentially leading to undetected lateral movement or compromise.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, including environments where process creation logs are not consistently captured or legacy systems where `rcedit` is commonly employed for legitimate purposes. The detection logic assumes that malicious actors will utilize the tool in a specific manner reflected by the command-line arguments, and legitimate administrative use may lead to false positives. For the alert to function correctly, comprehensive logging of process creation events and command-line arguments must be enabled across all endpoints within the monitored environment.

