logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\rcedit-x64.exe'
    - '\rcedit-x86.exe'
  - Description: 'Edit resources of exe'
  - Product: 'rcedit'
  selection_flags:
    CommandLine|contains: '--set-'     # Covers multiple edit commands such as "--set-resource-string" or "--set-version-string"
  selection_attributes:
    CommandLine|contains:
    - 'OriginalFileName'
    - 'CompanyName'
    - 'FileDescription'
    - 'ProductName'
    - 'ProductVersion'
    - 'LegalCopyright'
  condition: all of selection_*
falsepositives:
- Legitimate use of the tool by administrators or users to update metadata of a 
  binary
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `rcedit` tool to alter Portable Executable (PE) metadata, which can include changing attributes like `OriginalFileName` and `CompanyName`. An attacker may leverage this technique to obscure the true identity of malicious payloads or disguise system utilities to evade detection. This behavior aligns with the MITRE ATT&CK technique T1036.003 (Masquerading: Match Legitimate Name or Location) and T1027.005 (Obfuscated Files or Information).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on the execution of `rcedit.exe` with command line parameters that modify PE metadata. If successful, this could allow an attacker to bypass security mechanisms or obfuscate their presence on the system. It is important to note that this detection does NOT confirm that the behavior is malicious, as legitimate use cases may also involve administrative updates to binary metadata.

  ### Investigation Steps

  - **Validate the command line used:** Examine the Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) for instances where `rcedit-x64.exe` or `rcedit-x86.exe` is invoked with parameters containing `--set-`. Look for indications of what metadata was altered. Legitimate uses typically involve well-known administrator accounts or known deployment automation scripts, while unauthorized usage may originate from unknown or compromised accounts.

  - **Cross-reference the modified file:** Analyze Event ID 4663 (Access Attempts) to check which files were modified using `rcedit`. Focus on whether the modified executable is known, such as a non-malicious system utility, versus suspicious executables that might have been renamed to blend in, indicating a potential compromise.

  - **Review account activities:** Audit the user accounts (Event ID 4624) active during the execution of `rcedit`. Look for anomalous accounts, especially those lacking administrative privileges, which may indicate an unauthorized alteration attempt.

  - **Identify potential follow-on actions:** After the metadata change, check for subsequent activities tied to the modified executable. Search for unusual process creations (Event ID 4688), particularly those that run commands indicative of lateral movements or elevated access, which may suggest malicious intent.

  - **Assess host role and criticality:** Consider the role of the host where the modification took place. A server running critical infrastructure services modified with `rcedit` poses a greater risk than a non-critical workstation.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system integrity and security. The likelihood of malicious abuse is higher because of the stealthy nature of PE metadata tampering, which is frequently used by adversaries to obscure malicious activity. Such behavior is increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases, such as routine administrative tasks performed by IT staff using `rcedit`. Ensure proper logging of process creation and modifications are configured across systems for reliable detection. False positives could arise from legitimate software updates or installations that also utilize `rcedit`. A companion detection mechanism to strengthen coverage could involve monitoring for suspicious process trees linked to the modified executable, especially if common post-exploitation tools or behaviors are observed subsequently.

