title: Potentially Suspicious Ping/Copy Command Combination
id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
status: test
description: |
  Detects uncommon and potentially suspicious one-liner command containing both "ping" and "copy" at the same time, which is usually used by malware.
references:
- Internal Research
author: X__Junior (Nextron Systems)
date: 2023-07-18
modified: 2024-03-06
tags:
- attack.stealth
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
  selection_cmd:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_action:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'copy '
  selection_cli_1:
    CommandLine|contains|windash: ' -n '     # Count
  selection_cli_2:
    CommandLine|contains|windash: ' -y '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of a command line containing both "ping" and "copy", which suggests potentially malicious behavior. Attackers may use combinations of these commands to determine the availability of targets (ping) while attempting to exfiltrate data or execute unwanted file operations (copy). This behavior could indicate lateral movement or reconnaissance efforts aimed at establishing a foothold within the network.

  Relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) and **Data Obfuscation** (T1070.004), which pertains to techniques involved in avoiding detection while maneuvering within a network. The primary telemetry sources are Windows process creation logs, specifically looking for Event ID 4688 from the Security log which captures process creation events, and Sysmon Event ID 1 that also provides detailed logging for command line activity.

  The potential security impact of malicious activity detected by this rule includes unauthorized data access or transfer, leading to data breaches. However, this detection alone does not confirm malicious intent; it must be investigated within the context of user behavior and environmental norms.

  ### Investigation Steps

  - **Review process creation logs:** Investigate Security Event ID 4688 and Sysmon Event ID 1 for the affected hosts. Focus on the CommandLine field to identify specific invocations of both "ping" and "copy". Record legitimate use cases that might also include these commands for context.

  - **Assess user behavior:** Identify if the user or application executing the command is on a watchlist or exhibits anomalous behavior. Check for historical activity and prior use of command line scripts to contextualize the current alert.

  - **Examine surrounding network activity:** Review related firewall and network logs for unusual outbound connections or high-frequency pings; monitor for any subsequent file movements or transfers (Event ID 4663) that follow the execution of the suspicious command.

  - **Validate command parameters:** Confirm the parameters used for ping (e.g., '-n' for count, '-y' for reporting), which can indicate specific intent. Legitimate tools may use similar parameters for diagnostic tasks, but anything deviating from normalized patterns may warrant further scrutiny.

  - **Correlate with endpoint protection alerts:** Check if any Endpoint Detection and Response (EDR) alerts or antivirus logs were triggered during or after the execution of the commands. Investigations here could provide insights into whether the behavior is part of an initiated attack.

  ### Prioritization

  This alert should be prioritized as medium severity given that it could indicate an attempt at lateral movement or data exfiltration on potentially critical systems. The presence of both commands in tandem suggests a specific suspicious action, even though these commands might occasionally be used for benign purposes in legitimate administrative tasks.

  ### Blind Spots and Assumptions

  Evasion techniques include using command obfuscation or replacing "ping" and "copy" with similarly behaving commands, which could bypass this detection. Reliable detection requires proper logging configurations to ensure that all command-line activities are captured; not all systems may have capable logging enabled. Legitimate activities such as network diagnostics or system scripts could trigger this alert if they use similar command patterns. A related detection rule could include monitoring for misuse of native Windows scripting tools like PowerShell, which may also facilitate similar malicious behaviors.

