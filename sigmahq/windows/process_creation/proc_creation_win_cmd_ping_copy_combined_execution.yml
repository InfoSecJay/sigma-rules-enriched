title: Potentially Suspicious Ping/Copy Command Combination
id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
status: test
description: |
  Detects uncommon and potentially suspicious one-liner command containing both "ping" and "copy" at the same time, which is usually used by malware.
references:
- Internal Research
author: X__Junior (Nextron Systems)
date: 2023-07-18
modified: 2024-03-06
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
  selection_cmd:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_action:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'copy '
  selection_cli_1:
    CommandLine|contains|windash: ' -n '     # Count
  selection_cli_2:
    CommandLine|contains|windash: ' -y '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of a suspicious combination of commands that include both "ping" and "copy" within a single command line. Such command combinations are often utilized by attackers to probe network connectivity while also attempting to exfiltrate data or manipulate files on a system. This behavior can indicate possible recon activities paired with data theft or manipulation tactics. Understanding this pattern is crucial for identifying potential malware activity or exploitation efforts by an adversary.

  The likely attacker objectives when combining these commands may include testing connectivity to another host while simultaneously preparing to copy sensitive files to unauthorized locations, suggesting a staged data exfiltration effort or lateral movement within a network. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (TA0005)** and **Indicator Removal on Host (T1070.004)**, highlighting the capability of adversaries to obscure their actions while executing potentially harmful commands.

  Primary data sources for detecting this behavior include **process creation events**, particularly those logged by Windows systems. These events contain detailed information about command line arguments, allowing for adequate analysis of any potentially malicious command sequences executed on the host.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs for the execution of `cmd.exe` or situations where commands containing both "ping" and "copy" were invoked, including their command line arguments.
  - **Analyze File Access Patterns:** Determine if any sensitive files were accessed or copied during these command executions, correlating timestamps to identify potential data theft activities.
  - **Examine Network Activity:** Check for any unusual outbound network connections or traffic patterns associated with machines where these commands were executed, particularly to external IPs or suspicious ports.
  - **Identify User Context:** Assess the user accounts associated with the execution of these commands, including elevated privilege levels or accounts that are uncommon for typical operational tasks.

  ### Prioritization
  The alert is classified as medium severity due to its potential association with reconnaissance and data manipulation activities, which may precede larger, more damaging attacks. The likelihood of such behavior indicating true adversarial intent warrants timely investigation to prevent potential breaches or data loss.

  ### Blind Spots and Assumptions
  Detections may miss variations of commands or obfuscated implementations that achieve similar outcomes without explicitly using "ping" and "copy" in succession. The detection logic assumes that command execution can be effectively captured via standard process creation logs supported by a logging mechanism such as Sysmon or Windows Event Logs. Required configurations include proper logging settings that ensure full command line visibility, as well as monitoring tools that effectively capture process execution events on Windows environments.

