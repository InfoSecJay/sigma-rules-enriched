title: Potentially Suspicious Ping/Copy Command Combination
id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
status: test
description: |
  Detects uncommon and potentially suspicious one-liner command containing both "ping" and "copy" at the same time, which is usually used by malware.
references:
- Internal Research
author: X__Junior (Nextron Systems)
date: 2023-07-18
modified: 2024-03-06
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
  selection_cmd:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_action:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'copy '
  selection_cli_1:
    CommandLine|contains|windash: ' -n '     # Count
  selection_cli_2:
    CommandLine|contains|windash: ' -y '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of a Windows command line containing both "ping" and "copy", which is an unusual command combination often associated with malware trying to exfiltrate or manipulate data covertly. The likely objective of an attacker using this command is to create a method for transferring data from one host to another while obscuring the activity. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion, specifically T1070.004 (Indicator Removal on Host).

  The primary telemetry sources for this detection are Windows process creation logs collected by Sysmon or the Windows event log (Event ID 4688). If executed maliciously, the command could indicate data exfiltration or lateral movement within the network. However, this detection does NOT confirm that the activity is inherently malicious; legitimate administrative actions may also include similar command executions.

  ### Investigation Steps

  - **Verify command execution context:** Check for Event ID 4688 in Windows Security logs. Look for the user account that executed the command and evaluate if it is a common administrative account, highlighting unusual accounts for further scrutiny.

  - **Review command properties:** Inspect the CommandLine field in the process creation logs for occurrences of "ping" with "copy". Confirm that the command follows the specific patterns outlined (e.g., includes parameters such as '-n' or '-y'). Differentiating between useful commands (e.g., pinging a workstation) versus suspicious behavior can clarify intent.

  - **Correlate with network traffic:** Monitor network activity using appropriate tools (e.g., Zeek or Suricata). Look for associated outbound connections that align with the timing of the detected command’s execution. Origins from internal to external IPs are critical in identifying potential data exfiltration.

  - **Investigate file manipulation evidence:** If the command included file transfer functionality, check for any newly created or modified files that correspond with this command's execution. Use Windows event logs (Event IDs 4608, 4663) to track file access or modifications that may indicate malicious data handling.

  - **Assess common legitimate usages:** Document expected use cases of the “ping” or “copy” commands within your organization. For example, network troubleshooting scripts may generate variations of these commands that are benign.

  ### Prioritization

  This alert is of medium severity as the suspicious command may indicate an attempt to evade detection during data manipulation. The impact is heightened if it occurs on critical systems or accounts that typically should not be executing such commands. Although this behavior is not widely weaponized in known attacks, its presence in combination may signify serious intent.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate scripts triggering this command combination during routine troubleshooting. Moreover, comprehensive logging configurations, such as enabling Sysmon, are necessary for effective detection. Users could inadvertently trigger alerts with benign commands, so context is essential. Related detections would include identifying anomalies in file creation events, which reinforce the possibility of data exfiltration when analyzed together with this alert.

