logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
  selection_cmd:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_action:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'copy '
  selection_cli_1:
    CommandLine|contains|windash: ' -n '     # Count
  selection_cli_2:
    CommandLine|contains|windash: ' -y '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of a command-line instruction that combines the "ping" and "copy" commands, which is atypical and often associated with malware operations attempting to obfuscate their actions. The likely objective of the attacker is to exfiltrate data or establish unauthorized communication with an external server using the ping command while leveraging file transfer capabilities of the copy command. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Indicator Removal on Host (T1070.004).

  The primary telemetry source is process creation logs, specifically from Windows event logging, indicated by Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it may enable data exfiltration or command and control (C2) communication, posing a significant risk to the security of affected systems. Importantly, this detection alone does not confirm that a compromise has occurred, as the commands may also be executed for legitimate purposes in some contexts.

  ---

  ### Investigation Steps

  - **Review Command Context:** Examine the process creation logs for Event ID 4688 or Sysmon Event ID 1 to identify the full command line. Focus on encountering both "ping" and "copy" alongside any related arguments, such as destination paths, indicating potential targets for data transfer.

  - **Check Parent Process:** Investigate the parent process of the ping/copy command to identify the initiating process. Malicious commands are often spawned from atypical parent processes such as a non-standard application or script.

  - **Identify Host Role:** Determine the role of the host where the command was executed. Analysis is especially critical if the command was run on a sensitive system (e.g., domain controller or database server), where unauthorized data movement is highly suspicious.

  - **Evaluate Legitimate Use Cases:** Identify if there are any benign use cases for the command structure by checking system administrator scripts or documentation that could justify legitimate usage of ping/copy combos, such as network diagnostics or file copying during maintenance.

  - **Collect Additional Context:** If applicable, check network traffic logs for unusual outbound traffic patterns following the command execution (e.g., external IP destinations matched with command timing) that point towards potential C2 communications.

  - **Search for Anomalous Timing:** Look for execution times that fall outside standard business hours or correlate with known high-risk periods (e.g., during system updates or maintenance windows).

  ---

  ### Prioritization

  Given that this behavior involves critical command-line utilities commonly used in malware exploitation, the alert should be considered medium severity. The likelihood of malicious usage is elevated, especially on sensitive systems, as this command combination is not typically seen in standard administrative practices.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate scripts or utilities that utilize the same command pattern. It requires that logging is properly configured to capture all process creation events, as incomplete telemetry could lead to missed detections. Additionally, benign automation scripts may inadvertently trigger this alert, particularly in networking contexts. Consider deploying related detections for anomalous outbound connections or unexpected file transfers for more comprehensive coverage.

