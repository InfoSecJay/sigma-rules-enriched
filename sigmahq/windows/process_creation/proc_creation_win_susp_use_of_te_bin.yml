note: |
  ### Technical Context

  The Sigma rule detects the execution of the Windows Test Authoring and Execution Framework (TAEF) utility `te.exe`, which can be misused to run potentially malicious scripts or components, such as Windows Script Components (WSC) files, VBScript, or DLLs. Attackers may aim to execute these files to deploy malware or conduct unauthorized testing within an environment. This behavior is associated with the MITRE ATT&CK tactic for Execution (T1203) and the technique for Malicious Use of Scripting (T1218).

  Primary telemetry sources include process creation events from Windows security logs (Event ID 4688) and Sysmon logs for detailed process metadata (Event ID 1). If exploited maliciously, this could lead to unauthorized system access, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that all execution of `te.exe` is malicious, as it may also be used legitimately for testing by developers.

  ### Investigation Steps

  - **Check process creation events**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `te.exe` executions. Note the user context and the image paths associated with the execution.

  - **Identify parent process**: Examine the parent process context of `te.exe` executions to determine whether it was initiated by a trusted application or an unexpected script. A legitimate execution may often appear as initiated by an automated test suite process.

  - **Correlate against known malicious indicators**: Review the command line arguments associated with `te.exe` to identify patterns indicative of malicious activity (e.g., execution of scripts with unexpected file types, such as `.wsc`). Use Sysmon Event ID 1 for command line details.

  - **Assess execution frequency and sources**: Analyze the frequency of `te.exe` executions across critical systems (e.g., file servers, domain controllers). Increased execution from non-development endpoints may indicate potential misuse.

  - **Review logs for user permissions**: Check User Account Control (UAC) settings and user permissions in Active Directory to assess whether the executing user should have access to run `te.exe`. Unusual permissions could indicate an account compromise.

  ### Prioritization

  This alert is of low severity due to the possibility of legitimate use in testing environments. However, frequent or unexpected executions from user accounts without proper development contexts should raise concerns regarding potential misuse. Attackers often exploit such scripting capabilities during lateral movement or initial access phases.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate TAEF usage, which can mask malicious activities. Log sources must include process creation events (Event ID 4688, Sysmon Event ID 1) to ensure comprehensive visibility. Legitimate testing activities could trigger this rule, particularly if development teams utilize `te.exe` regularly. A related detection rule for monitoring the execution of scripting languages (e.g., PowerShell scripts) can strengthen overall coverage against potential abuse patterns.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
