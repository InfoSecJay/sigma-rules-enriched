level: low
note: |
  ### Technical Context
  This rule detects the execution of Windows Script Components (WSC) via the Test Authoring and Execution Framework (TAEF), specifically looking for instances of `te.exe`. Adversaries might exploit the TAEF framework to execute malicious scripts or components, such as VBScript files or DLLs, to execute arbitrary code, maintain persistence, or evade detection by leveraging legitimate tools. The attacker’s objective could be to perform actions such as privilege escalation or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1562)**: Utilizing TAEF to blend malicious tools with legitimate testing procedures.
  - **Execution (T1218)**: Taking advantage of trusted processes to run malicious scripts via `te.exe`.

  Primary data sources providing evidence for this detection include process creation events, which log the execution of binaries, along with details about parent processes to identify potentially unusual chains of execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances where `te.exe` has been executed. Focus on timestamp, user context, and process parent to identify potentially unauthorized executions.
  - **Analyze Command History**: Look for any command-line arguments used when `te.exe` was executed. Malicious activity often uses unusual parameters that deviate from standard testing practices.
  - **Identify Anomalous Parent Processes**: Investigate the parent process of any executed `te.exe` instances; legitimate TAEF execution typically originates from development or testing environments.
  - **Correlate with Other Logs**: Cross-reference with other security logs (such as EDR alerts or event logs) to see if other related suspicious behavior was reported during the same timeframe.

  ### Prioritization
  The alert has a low severity rating, as while it may indicate attempts to leverage a legitimate tool for malicious purposes, the extensive use of `te.exe` in legitimate testing environments means that many alerts may not indicate malicious activity.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage concerning legitimate use of `te.exe`, which may lead to a high rate of false positives. The detection logic assumes that an anomalous execution context may indicate malicious intent, but it may miss cases where an attacker is not using expected parameters. Additionally, monitoring must be configured adequately to capture process creation events for this rule to function correctly. If telemetry is insufficient, the effectiveness of this detection will be compromised.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
