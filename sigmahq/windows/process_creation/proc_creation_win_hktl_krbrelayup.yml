logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\KrbRelayUp.exe'
  - OriginalFileName: 'KrbRelayUp.exe'       # In case the file has been renamed after compilation
  selection_cli_1:
    CommandLine|contains|all:
    - ' relay '
    - ' -Domain '
    - ' -ComputerName '
  selection_cli_2:
    CommandLine|contains|all:
    - ' krbscm '
    - ' -sc '
  selection_cli_3:
    CommandLine|contains|all:
    - ' spawn '
    - ' -d '
    - ' -cn '
    - ' -cp '
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the KrbRelayUp tool, which is utilized to exploit vulnerabilities in Windows domain environments lacking LDAP signing. The primary objective of an attacker using KrbRelayUp is to escalate privileges on a compromised machine, gaining unauthorized access to resources that should be restricted. This method represents a universal, no-fix local privilege escalation, taking advantage of weak configurations in the domain environment.

  Relevant MITRE ATT&CK techniques for this detection include "Lateral Movement: Pass-the-Hash" (T1550.003) and "Credential Access: Credentials from Password Stores" (T1558.003). The execution of KrbRelayUp is a clear indicator of active lateral movement and could also facilitate unauthorized credential access, enabling attackers to leverage stolen credentials further within the network.

  The primary data sources for this detection are process creation events from Windows systems. These logs provide critical information about the execution of the KrbRelayUp tool, including its command line arguments and file origins, which are instrumental for effective detection and investigation.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze process creation logs to identify instances of `KrbRelayUp.exe` being executed, noting the command line arguments used and the context in which the tool was started.

  - **Examine Command Line Arguments:** Look for specific command line patterns that include terms such as 'relay', 'krbscm', 'spawn', and other parameters related to domain and computer names to confirm the execution of KrbRelayUp.

  - **Identify Unusual Activity:** Investigate the user account and the session context under which KrbRelayUp was run. Assess any unusual behavior or activity leading up to the execution, such as prior unauthorized access attempts or privilege escalations.

  - **Check for LDAP Signing Configuration:** Determine whether LDAP signing is enabled in your environment. The absence of this configuration increases the risk of such exploits, making it essential to remediate and monitor for further attempts.

  ### Prioritization
  This alert's severity is high due to the significant impact of local privilege escalation in a managed environment. Successful execution of KrbRelayUp can lead to broader attacks within the network, making early detection critical to prevent potential data exfiltration and further unauthorized access.

  ### Blind Spots and Assumptions
  The detection logic may not capture instances where the file has been renamed or executed in a non-standard way. Assumptions include that the logging is sufficiently detailed and that the attacker has not taken steps to obfuscate their actions. Additionally, this alert relies on comprehensive process creation logs being enabled and retained; insufficient log retention policies may hinder detection capability.

