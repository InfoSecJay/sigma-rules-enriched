  ### Technical Context

  This rule detects the execution of KrbRelayUp, a tool utilized for local privilege escalation in Windows domain environments, exploiting scenarios where LDAP signing is not enforced. The likely attacker objective is to gain elevated privileges on target systems, enabling further lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for Credential Access (T1558.003) and Lateral Movement (T1550.003).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 for process creation and associated CommandLine details. If malicious, the impact could be severe, allowing an adversary to escalate privileges and move laterally across the environment. However, this detection alone does NOT confirm that compromise has occurred; it merely indicates the presence of the potential privilege escalation tool being executed.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances of `KrbRelayUp.exe` being executed. Look for fields that confirm the process path and the presence of the command line arguments indicating privilege escalation attempts.

  - **Assess command line arguments:** Identify if the command line includes keywords like `relay`, `-Domain`, `-ComputerName`, `krbscm`, `-sc`, `spawn`, `-d`, `-cn`, or `-cp`. These are high-confidence indicators of malicious intent associated with KrbRelayUp.

  - **Identify legitimate behavior:** Compare the process creation logs against known legitimate processes in the environment. Typically, legitimate use cases for process executions do not involve calling `KrbRelayUp.exe` with flags suggesting LDAP manipulation or privilege escalation.

  - **Check for lateral movement activities:** Look for events indicating lateral movement around the same timestamp as the detected execution, such as NTLM authentication events (Event ID 4624 or 4648) to determine if there is further network activity that supports unauthorized access.

  - **Validate recent system configurations:** Ensure LDAP signing is enforced in the environment. This can significantly mitigate exploitation opportunities if it is correctly implemented.

  - **Inspect for secondary indicators:** Search for any related artifacts like modified user permissions or changes in group memberships following execution of KrbRelayUp, which could suggest successful privilege escalation.

  ---

  ### Prioritization

  This alert is high priority due to the potential for significant security impact when local privilege escalation occurs on critical systems. The behavior exhibited by KrbRelayUp is reflective of commonly weaponized techniques used in post-exploitation scenarios, raising the likelihood of malicious abuse following detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if command line logging is disabled, as critical details may go unrecorded. Additionally, legitimate administrative activities using similar commands might trigger this alert, particularly during system maintenance or access adjustments. A related detection to monitor is the use of Mimikatz (T1558.004) to complement coverage regarding credential theft and abuse, establishing a broader picture of credential attacks in the environment.

