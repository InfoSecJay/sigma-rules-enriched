note: |
  ### Technical Context

  This Sigma rule detects the execution of KrbRelayUp, a tool used for local privilege escalation in Windows domains, particularly in environments lacking LDAP signing enforcement. The primary objective of an attacker utilizing this tool is to gain elevated permissions, enabling access to sensitive data and systems. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1560) and Credential Access (T1558.003).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688, which captures process creation events. If this behavior is confirmed as malicious, it poses a significant security threat, as it allows unauthorized elevation of privileges, potentially leading to the compromise of sensitive data and systems. Importantly, this detection alone does not confirm malicious intent; legitimate administrative tasks may involve similar process executions.

  ### Investigation Steps

  - **Verify process creation events:** Analyze Windows Security Event ID 4688 to confirm the creation of the process `KrbRelayUp.exe`. Check the `New Process Name` field for exact matches.

  - **Investigate command-line arguments:** Look for specific command-line arguments in the process creation logs. For example, `CommandLine` should reflect entries such as ' -Domain ', ' -ComputerName ', or variations indicated in Clause selection_cli_1, which are suggestive of malicious behavior.

  - **Identify legitimate admin use cases:** Check if similar command-line usage occurred during known, scheduled administrative tasks or legitimate maintenance windows. Document typical parameters used by administrators to differentiate from suspicious executions.

  - **Assess system impact and role:** Identify the affected system’s role (e.g., Domain Controller) and its criticality to the organization. Higher risk comes from critical systems, and the presence of `KrbRelayUp.exe` should trigger immediate analysis.

  - **Correlation with other security events:** Look for earlier suspicious activities or logins related to this execution, such as failed login attempts or other anomalous process activity prior to the execution of `KrbRelayUp.exe`. Consider using additional telemetry such as Windows Event ID 4625 for failed logon attempts.

  - **Evaluate potential file creation artifacts:** Check for associated artifacts or dropped files in locations typically used by tools (e.g., `%TEMP%` or `%PROGRAMDATA%`) that may indicate further exploitation attempts.

  ### Prioritization

  This alert is critical due to the potential for significant impact if an attacker successfully exploits the privilege escalation capabilities of KrbRelayUp on a Domain Controller or similar critical asset. The likelihood of this tool being weaponized in an enterprise environment is high, and any detection should be treated with urgency given the implications for security posture.

  ### Blind Spots and Assumptions

  This rule may miss variants of the tool that have been renamed or modified. It is vital to ensure that process creation logging is configured to capture all relevant events, including command-line arguments. Legitimate use cases may include legitimate administrative tools or processes that could inadvertently trigger this rule. A related detection that strengthens coverage could involve monitoring for usage patterns of tools known for privilege escalation, such as Mimikatz.

