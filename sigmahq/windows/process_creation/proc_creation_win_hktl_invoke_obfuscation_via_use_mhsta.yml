note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands via the Microsoft HTML Application Host (MSHTA) utility. Attackers often use this technique to execute malicious scripts while bypassing traditional security measures. The likely attacker objective is to deliver and execute payloads stealthily, exfiltrate data, or maintain access within the environment. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1027) and Execution (T1059.001).

  Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments used to invoke the MSHTA utility. If successful, this behavior can lead to unauthorized system access or data compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate uses of MSHTA exist.

  ### Investigation Steps

  - **Review command-line arguments:** Check process creation logs for Windows Event ID 4688 (Event Type: 10) and focus on properties like `NewProcessName` and `CommandLine`. Look for command lines containing 'set', '&&', 'mshta', and 'vbscript:createobject'. Legitimate uses may have different command-line syntax or lack obfuscation.

  - **Analyze parent process relationship:** Review Sysmon Event ID 1 logs to identify parent-child process relationships. Suspicious parent processes such as `powershell.exe` or `cmd.exe` leading to `mshta.exe` warrant further investigation as they may indicate a malicious campaign.

  - **Identify timestamps and user context:** Verify the user context and timestamps for the execution of the mshta command. Anomalies, such as execution during off-hours or by non-administrative users, may indicate potential malicious activity.

  - **Cross-reference with known indicators:** Utilize threat intelligence feeds to check if the executed command sequence has been linked to known malicious campaigns or threat actors. Malicious indicators may include known obfuscated scripts commonly leveraged in attacks.

  - **Look for evidence of payload delivery:** Check for file creation or modification artifacts in temporary directories, such as `%TEMP%`, or PowerShell logs (Event ID 4104) that might indicate the delivery of a payload. If you find evidence of `.ps1` or other script file activities following mshta execution, this points towards likely malicious intent.

  ### Prioritization

  Given that the alert pertains to the use of MSHTA, a critical system component, the severity is high. The likelihood of malicious abuse is significant due to the common exploitation of MSHTA for delivering obfuscated scripts. This technique is regularly weaponized in modern attacks, especially in phishing and initial access scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate MSHTA use in application deployments or administrative tasks, which may trigger this alert and lead to potential false positives. Reliable detection requires comprehensive logging of process creation events (Event IDs 4688 and 1). Additionally, legitimate software installations or updates may also execute similar patterns. A related detection to consider is monitoring for uncommon PowerShell execution patterns (T1059.001), as these often indicate coordinated malicious behavior.

