logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'set'
    - '&&'
    - 'mshta'
    - 'vbscript:createobject'
    - '.run'
    - '(window.close)'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated PowerShell scripts executed through MSHTA, a legitimate Windows application often exploited to execute malicious code. Attackers utilize this technique to bypass security controls and execute scripts that can compromise systems or exfiltrate data without raising alarms. The presence of specific command-line patterns—such as the use of `mshta` alongside obfuscated scripting commands—indicates potential malicious intentions, often linked to initial access and execution phases of an attack.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002), particularly **PowerShell** (T1059.001)
  - **Defense Evasion** (TA0005), specifically **Obfuscated Files or Information** (T1027)

  The primary data sources for detecting this behavior are **process creation events** on Windows endpoints. Monitoring process creation allows analysts to catch the execution of suspicious commands and understand the context in which they were invoked.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze recent `process creation` logs for instances where `mshta` is invoked with unusual command-line arguments, particularly those containing patterns like `set`, `&&`, or `vbscript:createobject`.
  - **Correlate with User Activity:** Check for the user context in which the process was initiated. Investigate if the user account is associated with legitimate administrative functions or has a history of benign activity.
  - **Examine Related Network Activity:** Look for any outbound network connections that were initiated by the mshta process, as this may indicate data exfiltration or communication with a command and control server.
  - **Look for Persistence Mechanisms:** Investigate if there are any services, scheduled tasks, or startup items created or modified as a result of this activity, potentially signifying attempts to establish persistence.

  ### Prioritization
  The alert is classified as high severity due to the potential for malicious actors to execute obfuscated code that may lead to severe consequences such as data breaches, system compromise, or deployment of additional malware.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for scenarios where obfuscated scripts are run using non-standard methods or applications other than MSHTA. The detection logic assumes that the presence of specific command-line patterns is indicative of malicious behavior; however, this might lead to false positives if legitimate administrative tasks use similar constructs. Effective detection requires comprehensive logging of process creation events across all Windows systems in the environment.

