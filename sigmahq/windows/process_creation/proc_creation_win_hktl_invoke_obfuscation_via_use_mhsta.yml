logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'set'
    - '&&'
    - 'mshta'
    - 'vbscript:createobject'
    - '.run'
    - '(window.close)'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell scripts leveraging MSHTA, a legitimate Windows application often abused by attackers for executing arbitrary code. The likely objective of an attacker using this technique is to evade traditional detection methods and maintain persistence or control over a compromised system. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) and Obfuscated Files or Information (T1027). Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, capturing the command-line activity. If confirmed malicious, this behavior could allow the attacker to manipulate system data or install additional malware without detection. However, this detection does NOT confirm malicious intent on its own, as legitimate scripts may also exhibit similar behaviors.

  ### Investigation Steps

  - **Review the command line arguments used:** Check for Event ID 4688 or Sysmon Event ID 1 logs to examine the full command line for signs of obfuscation. Malicious indicators include the presence of 'mshta', 'vbscript:createobject', 'set', and other obfuscation patterns.

  - **Identify the parent process:** Investigate the parent process that initiated the command execution. A legitimate process like "explorer.exe" or a scheduled task will likely be benign, while unexpected parent processes may indicate malicious activity.

  - **Check system and user context:** Review which user executed the command. If the user is unfamiliar or has a low privilege level (e.g., a non-admin account running system scripts), this is a higher risk indicator.

  - **Analyze recent changes or installations:** Look for unusual software installations or changes on the host surrounding the time of the alert. On Windows systems, check “Applications and Services Logs” for relevant installers or scripts executed.

  - **Validate the script execution context:** Confirm if the invocation was from a legitimate session (e.g., an administrative tool or automation). Legitimate PowerShell scripts run under controlled environments, whereas unexpected launches may signal misuse.

  - **Cross-check with other detections:** Correlate findings with related detections for file creation or network connections initiated by the process to confirm or deny further malicious intent. Logs such as firewall events or network traffic (e.g., DNS queries) can provide additional context.

  ### Prioritization

  This alert holds a high severity level due to the potential for significant impact on the affected system if exploited and the high likelihood that the obfuscated command is being weaponized for executing malicious payloads. Given the stealthy nature of using MSHTA, it is critical to address such alerts promptly.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture command-line activity adequately, as obfuscation can render benign scripts difficult to differentiate from malicious ones. Legitimate automated scripts using similar command structures may trigger the alert. A companion detection that strengthens coverage includes monitoring for unusual PowerShell commands or execution (T1059.001), which can be correlated with this alert for a comprehensive view of potential threats.

