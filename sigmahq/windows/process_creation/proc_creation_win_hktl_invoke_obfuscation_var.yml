note: |
  ### Technical Context

  This rule detects the obfuscation of PowerShell command executions via the use of environment variables in potentially malicious `cmd.exe` commands. It targets attackers aiming to bypass security measures by using encoding techniques to obscure their activity, commonly seen in initial access or exploitation phases. This behavior aligns with the MITRE ATT&CK techniques: **Defense Evasion (T1027)** and **Command and Scripting Interpreter: PowerShell (T1059.001)**. The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688, which captures command line arguments of newly created processes, particularly those related to `cmd.exe` and PowerShell. If the detected behavior is malicious, it could lead to malicious code execution on the system. However, this detection alone does not confirm that a breach has occurred; the obfuscation could also arise from legitimate PowerShell usage or system management tasks.

  ### Investigation Steps

  - **Review the command line arguments:** Examine the process creation events (Event ID 4688) with command lines containing 'cmd.exe' and PowerShell references. Look for signs of obfuscation like "SET" commands or usage of environment variables.

  - **Identify persistence methods:** Check for any suspicious creation of scheduled tasks or registry entries (Event ID 4697) associated with the detected PowerShell command. Malicious scripts might utilize these for persistence and re-execution.

  - **Verify legitimate usage patterns:** Compare observed command line executions with typical administrative or automated tasks in your environment. Legitimate use of PowerShell for managing services or scripts should not contain significant obfuscation.

  - **Correlate with network activity:** Use network monitoring tools to identify any outbound connection attempts made by the associated command. Look for connections to known malicious hosts or unusual external ports that may indicate data exfiltration.

  - **Assess script execution environments:** Determine if scripts are being run within designated PowerShell execution contexts (e.g., constrained language mode) to identify deviations from expected behavior.

  ### Prioritization

  This alert is categorized as high severity due to its potential to enable significant compromise through obfuscated script execution. Systems targeted by this behavior, especially domain controllers or servers with sensitive data, face considerable risk if exploited. Such command execution techniques are frequently weaponized by adversaries for lateral movement and persistence in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by script personalization techniques such as dynamic variable names that evade detection patterns. Required logging sources include comprehensive process creation event logs and, if possible, command line logging enabled through Group Policy Objects (GPO). Legitimate activities like software deployment scripts or administrative tasks may trigger false positives. A related detection of interest includes monitoring for the use of `IEX` (Invoke-Expression) in PowerShell logs to provide broader context around potentially malicious activity.

