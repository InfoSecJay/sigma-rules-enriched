status: test
description: Detects creation of a new service via "sc" command or the 
  powershell "new-service" cmdlet with suspicious binary paths
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-14
modified: 2022-11-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath='
  selection_posh:
    CommandLine|contains|all:
    - 'New-Service'
    - '-BinaryPathName'
  susp_binpath:
    CommandLine|contains:
            # Add more suspicious commands or binaries
    - 'powershell'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'svchost'
    - 'dllhost'
    - 'cmd '
    - 'cmd.exe /c'
    - 'cmd.exe /k'
    - 'cmd.exe /r'
    - 'rundll32'
            # Add more suspicious paths
    - 'C:\Users\Public'
    - '\Downloads\'
    - '\Desktop\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    - 'C:\Windows\TEMP\'
    - '\AppData\Local\Temp'
  condition: 1 of selection* and susp_binpath
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_service_creation/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new Windows service that may be indicative of malicious activity, using either the `sc` command or the PowerShell `New-Service` cmdlet with suspicious binary paths. Attackers often seek to establish persistence on a compromised system by creating services that execute malware or facilitate further exploits. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Create or Modify System Process (T1543.003).

  The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity can allow attackers to maintain long-term access, evading detection and possibly executing additional malicious payloads. However, this detection alone does not confirm malicious intent, as there may be legitimate reasons to create a service under certain conditions.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 and Sysmon Event ID 1 to analyze the newly created service, focusing on the `CommandLine` and `Image` fields. Malicious indicators may include suspicious binary paths or command-line arguments, such as paths to `C:\Users\Public` or commands invoking system hosts.

  - **Verify Service Configuration**: Query the Windows Service Control Manager using `Get-Service` or PowerShell. Check for recently created services and compare their `DisplayName` and `BinaryPath` against known good configurations. Legitimate entries usually have standard naming conventions and binary paths corresponding to legitimate applications.

  - **Examine Process Parentage**: Investigate the parent process ID (PID) of the suspicious service creation by cross-referencing with Event ID 4688 logs. Look for instances where `cmd.exe`, `PowerShell`, or another obscure process initiated the service creation. Malicious activity may exhibit unusual parent-child relationships.

  - **Correlate with Additional Security Logs**: Review Windows Security logs for any prior suspicious access events leading up to the service creation, focusing on Event ID 4624 for logons and Event ID 4625 for failed attempts. Patterns leading to the service creation offer context for the alert.

  - **Look for Scheduled Tasks or Scripts**: Investigate if any scheduled tasks or scripts are associated with the newly created service using `Get-ScheduledTask` cmdlet. Malicious actors often schedule tasks that invoke services at startup or during idle times.

  - **Conduct Threat Intelligence Lookup**: Reference threat intelligence sources for any known Indicators of Compromise (IOCs) related to the binary paths or names seen in the service creation. High-confidence malicious indicators would often map to documented malware behaviors.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical enterprise systems. If a new service is created with malicious intent, it poses a significant risk for data exfiltration and lateral movement within the environment. The behavior is frequently exploited in sophisticated attacks, making prompt investigation essential.

  ### Blind Spots and Assumptions

  This detection may miss legitimate service creations initiated by administrative users or automated deployment scripts that follow standard practices. The effectiveness relies on accurate logging configurations, including Sysmon and Windows Event logging. Additionally, it may trigger on benign actions like software installations or system updates. A related detection would involve monitoring for unusual service alterations or deletions, providing broader context on service integrity.

