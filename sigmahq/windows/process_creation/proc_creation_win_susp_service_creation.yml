logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath='
  selection_posh:
    CommandLine|contains|all:
    - 'New-Service'
    - '-BinaryPathName'
  susp_binpath:
    CommandLine|contains:
            # Add more suspicious commands or binaries
    - 'powershell'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'svchost'
    - 'dllhost'
    - 'cmd '
    - 'cmd.exe /c'
    - 'cmd.exe /k'
    - 'cmd.exe /r'
    - 'rundll32'
            # Add more suspicious paths
    - 'C:\Users\Public'
    - '\Downloads\'
    - '\Desktop\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    - 'C:\Windows\TEMP\'
    - '\AppData\Local\Temp'
  condition: 1 of selection* and susp_binpath
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the creation of new Windows services using the "sc" command or PowerShell's `New-Service` cmdlet, particularly when suspicious binary paths are involved. The behavior typically indicates an attacker attempting to establish persistence on a compromised system, leveraging services to maintain a foothold or execute malicious code. This detection aligns with the MITRE ATT&CK Tactic "Persistence" (ID: T1543) and the technique "Create or Modify System Service" (ID: T1543.003).

  Primary telemetry sources include Security Event ID 7045 (Service Installation) and process creation logs (e.g., Sysmon Event ID 1) capturing the command-line arguments used during service creation. If malicious, the impact could be significant, enabling the adversary to run malware persistently. However, this detection alone does NOT confirm malicious intent, as legitimate applications may also create new services under similar conditions.

  ### Investigation Steps

  - **Check Service Installation Logs**: Review Security Event ID 7045 for the timestamp of the new service creation. Verify the service's binary path against known benign services. Focus on creation events with suspicious binary paths such as those leading to `C:\Users\Public` or `C:\Windows\TEMP`.

  - **Analyze Process Creation Events**: Investigate Sysmon Event ID 1 (Process Creation) related to the `sc.exe` or `powershell.exe` execution. Look for command lines that contain both `create` and `binPath=`. Legitimate operations will typically feature stable applications or standard utilities.

  - **Validate Binary Path**: Examine the paths specified in the `New-Service` command for common legitimacy. Paths leading to temporary directories or common scripting hosts (e.g., `mshta`, `wscript`) should raise suspicion and warrant further scrutiny.

  - **Assess Service Properties**: Inspect the new service properties through the Services console or via PowerShell (`Get-Service`). Identify if the service's start type is set to 'Automatic' which may indicate persistence. Benign services typically use `Manual` start types unless explicitly configured.

  - **Network Behavior Review**: If applicable, correlate with network traffic to identify unusual outbound connections initiated by the new service's executable. Malicious indicators include unexpected communication to known bad IPs or domains.

  - **Contextualize with Related Detections**: Note any alerts from companion detections, such as the creation of scheduled tasks or abnormal user behavior, which could signify a coordinated attack and strengthen your investigation.

  ### Prioritization

  This alert is categorized as high severity due to the potential for persistent threats being established on critical systems. The likelihood of malicious exploitation is significant, given that attackers commonly utilize service creation mechanisms for persistence. The technique is well-documented in threat actor tactics, making timely responses essential.

  ### Blind Spots and Assumptions

  This detection may be evaded through techniques such as using legitimate-looking paths or services, or by exploiting native binaries. Ensure that necessary log sources are appropriately configured; for example, Sysmon must be deployed to capture detailed process creation logs. Legitimate software installations, particularly enterprise applications, may trigger this alert if they inadvertently create services under similar conditions. A related detection to consider is monitoring for unusual process hierarchies indicating service creation from unexpected parent processes (Sysmon Event ID 1 ParentProcessId).

