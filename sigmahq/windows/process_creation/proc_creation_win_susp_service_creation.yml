logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath='
  selection_posh:
    CommandLine|contains|all:
    - 'New-Service'
    - '-BinaryPathName'
  susp_binpath:
    CommandLine|contains:
            # Add more suspicious commands or binaries
    - 'powershell'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'svchost'
    - 'dllhost'
    - 'cmd '
    - 'cmd.exe /c'
    - 'cmd.exe /k'
    - 'cmd.exe /r'
    - 'rundll32'
            # Add more suspicious paths
    - 'C:\Users\Public'
    - '\Downloads\'
    - '\Desktop\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    - 'C:\Windows\TEMP\'
    - '\AppData\Local\Temp'
  condition: 1 of selection* and susp_binpath
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the creation of new Windows services using the `sc` command or PowerShell's `New-Service` cmdlet, particularly when associated with suspicious binary paths. New service creation is a common tactic employed by attackers to maintain persistence and execute malicious code each time the system starts. Attackers may leverage this technique to establish footholds on compromised machines, ensuring their payloads run in the background unnoticed by legitimate users or security systems.

  The tactics most relevant to this detection fall under the MITRE ATT&CK framework’s Persistence and Privilege Escalation categories, specifically T1543.003, which focuses on service creation as a means to maintain access. Attackers may target various services by positioning themselves carefully within the environment, using legitimate tools and commands to create deceptive services that could facilitate further actions, such as lateral movement or data exfiltration.

  The primary data sources for effective detection include process creation events, which can reveal the command line used during service execution, and the associated image paths. Monitoring these logs will help identify any unusual service creation attempts that do not align with standard operational behavior.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances of `sc.exe` and `powershell.exe` that indicate service creation attempts, particularly looking for unusual command-line parameters and binary paths.

  - **Analyze Command-Line Arguments**: Inspect the command-line arguments for executed instances of `New-Service` and other script hosting binaries. Pay special attention to any execution paths that include directories known for temporary or user-generated content, such as `C:\Users\Public` or `C:\Windows\TEMP`.

  - **Correlate with Service Registry Changes**: Check the Windows Service Control Manager (SCM) for new entries that correspond with the identified suspicious service creation events. Review the services running on the system to identify any non-standard or unexpected services.

  - **Investigate Related Network Connections**: If the newly created service is associated with outbound network traffic, examine network logs for any connections initiated by the service to external IP addresses, which may indicate a link to more malicious activity.

  ### Prioritization
  The severity of this alert is high due to the potential impact of an attacker establishing persistence within an enterprise environment. The likelihood of service creation being part of an attack chain is significant, as this technique is widely documented in malicious tactics.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly in environments where legitimate activities may also involve the creation of services—for instance, during software updates or system configurations. The detection logic assumes that any command invoking `sc` or `New-Service` will contain suspicious paths; however, valid administrative operations might trigger the alert. To ensure effective functioning, it is essential that process creation logging is enabled and captures complete command-line invocations, as well as monitoring the system’s event logs for changes to services.

