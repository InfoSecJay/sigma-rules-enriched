note: |
  ### Technical Context

  This rule detects attempts to execute PowerShell with a command line argument specifying a version downgrade to 2.0. Likely attacker objectives include evading detection mechanisms and executing malicious scripts that are incompatible with higher versions of PowerShell, which often come with enhanced security features. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) through scripting and Defense Evasion.

  The primary telemetry sources are process creation events from Windows, specifically focusing on Event ID 4688 (new process creation). If this behavior is confirmed as malicious, it could indicate a serious security impact, as attackers may leverage outdated PowerShell functionality to execute payloads or bypass security mechanisms. It's important to note that this detection does NOT confirm that malicious activity is occurring; it merely indicates a potential security concern that warrants further investigation.

  ### Investigation Steps

  - **Check the process creation logs:** Review Windows Security Event ID 4688 logs for instances where PowerShell was launched with the `-version 2` command line argument, looking specifically for any anomalous users or systems invoking this behavior.

  - **Identify the invoking user account:** Examine the account associated with the PowerShell execution. Legitimate administrative tasks typically invoke scripts with standard versions and should not require version downgrades.

  - **Review other command line arguments:** Look for suspicious or atypical command line arguments used in conjunction with the `-version 2` flag by cross-referencing with Event ID 4688. Malicious indicators can include references to known malicious scripts or obfuscation patterns.

  - **Evaluate host roles and criticality:** Determine whether the affected host is a critical server or a standard user machine. Downgrading PowerShell on critical systems could indicate a higher risk of exploit.

  - **Cross-check against known threats:** Utilize threat intelligence feeds to correlate the detected behavior with previously identified threat actors or malware families that are known to exploit PowerShell downgrade tactics.

  ### Prioritization

  This alert should be classified with medium priority. Although the immediate impact may seem limited, the potential for misuse on critical systems increases the risk. Downgrade attacks are relatively uncommon but can lead to significant security breaches if successfully executed.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; ensure Process Creation logging is enabled at a detailed level to capture all command line arguments. Legitimate activities, such as system maintenance or compatibility of legacy applications, might trigger this alert. Related detection rules that could enhance coverage include monitoring for unusual PowerShell script execution or the use of obfuscated PowerShell commands.

