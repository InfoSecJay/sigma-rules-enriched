note: |
  ### Technical Context

  This Sigma rule detects attempts to execute PowerShell with a downgraded engine version, specifically version 2.0, which may be used to bypass security features such as AMSI (Antimalware Scan Interface). The likely attacker objective is to circumvent detection mechanisms within enterprise environments while executing malicious scripts or commands that require the more permissive behavior of an older version. Relevant MITRE ATT&CK tactics include "Execution" (T1203) and specifically the technique "Command and Scripting Interpreter: Windows Powershell" (T1059.001).

  The primary telemetry sources include Windows process creation logs, notably Security Event ID 4688 or Sysmon Event ID 1, capturing command-line parameters used in the execution of PowerShell. The security impact if malicious could lead to the execution of harmful scripts while evading detection. However, this detection alone does not confirm malicious activity; it indicates only that a downgrade attempt was made, which could also be due to legitimate use cases in testing environments.

  ### Investigation Steps

  - **Verify PowerShell version use:** Check process creation logs (Event ID 4688 or Sysmon Event ID 1) for instances of PowerShell (Image should end with `\powershell.exe`) that are initiated with a command line containing "-version 2." This is a high-confidence indicator of potential malicious activity.

  - **Review historical context:** Assess whether the affected host normally runs applications that require version 2 PowerShell, comparing against asset inventory and usage patterns. Expected behavior would show no legitimate instances of this command line apart from predefined, rare scenarios.

  - **Cross-reference with security solutions:** Check for any alerts from EDR solutions regarding PowerShell behaviors (e.g., logging entry points or scripts run) related to the same timeframe. Instances of PowerShell Script Block Logging may provide additional context regarding executed commands.

  - **Monitor for scripts being executed:** Review security logs for any scripts executed just prior to the detected downgrade attempt, focusing on PowerShell logs (e.g., Windows Event ID 4104). Legitimate system maintenance or administrative scripting processes should ideally account for this activity.

  - **Identify asset criticality:** Determine the risk level of the host involved. Hosts with elevated privileges or critical application functions provide higher severity in the context of this alert due to possible escalation of privileges or broader network impact.

  ### Prioritization

  The severity of this alert is medium due to the potential for significant abuse of PowerShell capabilities on systems that may have elevated privileges. As the behavior is indicative of a known evasion technique and because PowerShell is commonly weaponized in attacks, it should be prioritized accordingly.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers use other methods to conceal their behavior or use different PowerShell versions without downgrading. If PowerShell logging isn't enabled, critical telemetry may be absent. Legitimate administrative tasks may trigger similar alerts, particularly in legacy environments. Companion detections, such as those targeting unusual PowerShell command execution patterns or scripts, can strengthen overall visibility into potential abuse.

