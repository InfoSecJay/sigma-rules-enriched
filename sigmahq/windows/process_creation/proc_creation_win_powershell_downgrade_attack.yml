note: |
  ### Technical Context
  This rule detects potential PowerShell downgrade attacks, which occur when an attacker intentionally invokes an older version of PowerShell, specifically version 2.0. The objective behind this technique is to bypass security features introduced in later versions, including protections against common threats and enhanced logging capabilities. By executing scripts with an outdated engine, attackers may evade detection and execute malicious payloads more effectively.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Execution** (TA0002)
    - **Command and Scripting Interpreter: PowerShell** (T1059.001)
  - **Defense Evasion** (TA0005)
    - **Tactical Techniques** associated with facilitating execution while bypassing security measures.

  The primary data sources that will provide evidence for this detection include process creation events that log the execution of PowerShell commands, specifically looking for attributes like the command line used to invoke PowerShell.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the timestamps and associated account details of any PowerShell executions detected. Focus particularly on instances where the command line arguments include any version-related indicators that reference ' -version 2 ' or similar variants.
  - **Analyze Execution History**: Cross-reference executed PowerShell commands with known secure script policies and deviations from normal usage patterns. Look for scripts that may exploit the older engine's vulnerabilities.
  - **Check Security Product Logs**: Investigate logs from security solutions that monitor for unauthorized PowerShell execution. Evaluate if those solutions flagged the downgraded version as suspicious.
  - **Inspect User Activity Logs**: Identify the user accounts executing these downgraded commands and check for any suspicious account activity, especially privileged access operations, which may indicate compromised credentials.

  ### Prioritization
  The medium severity of this alert is justified due to the potential impact of an attacker successfully executing arbitrary code with reduced security measures. The likelihood of exploitation increases in environments where PowerShell is extensively used for automation and operational tasks.

  ### Blind Spots and Assumptions
  One notable blind spot is the detection of PowerShell commands that do not strictly follow the specified command line arguments but still invoke a downgrade behavior in alternate ways. The detection logic assumes that downgrade attacks will be explicitly marked in the command line; however, attackers may use additional obfuscation techniques. Additionally, the alert relies on having process creation logs enabled and accessible in real-time; without this telemetry, detecting such behavior becomes significantly harder.

