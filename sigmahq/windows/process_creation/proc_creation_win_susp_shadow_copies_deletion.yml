logsource:
  category: process_creation
  product: windows
detection:
  selection1_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    - '\vssadmin.exe'
    - '\diskshadow.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wmic.exe'
    - 'VSSADMIN.EXE'
    - 'diskshadow.exe'
  selection1_cli:
    CommandLine|contains|all:
    - 'shadow'          # will match "delete shadows" and "shadowcopy delete" and "shadowstorage"
    - 'delete'
  selection2_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection2_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'catalog'
    - 'quiet'         # will match -quiet or /quiet
  selection3_img:
  - Image|endswith: '\vssadmin.exe'
  - OriginalFileName: 'VSSADMIN.EXE'
  selection3_cli:
    CommandLine|contains|all:
    - 'resize'
    - 'shadowstorage'
    CommandLine|contains:
    - 'unbounded'
    - '/MaxSize='
  condition: (all of selection1*) or (all of selection2*) or (all of selection3*)
falsepositives:
- Legitimate Administrator deletes Shadow Copies using operating systems utilities
  for legitimate reason
- LANDesk LDClient Ivanti-PSModule (PS EncodedCommand)
level: high
note: |
  ---

  ### Technical Context

  This rule detects the deletion of Windows Shadow Copies using command-line utilities such as PowerShell, WMIC, or VSSAdmin, which may indicate an attempt to cover up malicious activities, such as ransomware deployment or other forms of data destruction. The likely adversary objective is to eliminate backup copies of files to hinder recovery efforts, facilitating data extortion efforts or increasing the impact of a data breach.

  Relevant MITRE ATT&CK techniques for this behavior include **Defense Evasion (T1070)** and **Impact (T1490)**. The primary telemetry sources include process creation logs from Windows (Event ID 4688) and possibly Sysmon logs if implemented. The security impact of malicious deletion can be severe, as it may prevent organizations from recovering critical data after an attack.

  It is important to note that this detection does NOT confirm that an actual compromise has occurred—legitimate administrative actions can also trigger the rule.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for processes with the names `vssadmin.exe`, `wbadmin.exe`, or `powershell.exe`. Check the `CommandLine` field for indications of delete operations, focusing on patterns such as `delete shadows`.

  - **Identify CommandLine parameters:** Look for command-line arguments containing `delete` combined with `shadow` or `catalog` in Event ID 4688 or Sysmon Event ID 1. Specifically, assess if the parameters `-quiet` or `/quiet` are used, which indicate automated execution and potentially malicious intent.

  - **Correlate with legitimate behavior:** Compare the identified command-line executions with expected administrative actions. For instance, routine maintenance tasks involving shadow copies usually do not use aggressive delete flags or unusual command syntax.

  - **Check for the presence of backup artifacts:** Validate if legitimate backup files or Shadow Copies exist on the system before the detection occurs. This can be checked via command-line queries for existing shadows (e.g., `vssadmin list shadows`) to establish whether the deletions are unusual.

  - **Review user context of the actions:** Analyze the user account associated with the process creation. Administrative accounts performing frequent shadow copy deletions without documented approvals or tickets may indicate a potential security incident.

  - **Examine lateral movement activities:** Investigate recent logins and elevated privileges on sensitive assets. Check for Event IDs 4624 (successful logon) and 4672 (special privileges assigned) in the time window leading to the alert, looking for unusual patterns or unauthorized access.

  ---

  ### Prioritization

  This alert is of **high severity** due to the potential for substantial data loss stemming from Shadow Copy deletions, significantly impacting business continuity. The likelihood of malicious abuse is high, given that this technique is frequently weaponized in ransomware attacks to prevent recovery of compromised systems.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for adversaries to perform deletions without triggering logging due to disabled audit policies or noise from legitimate administrative activities. Required logs should include comprehensive auditing of process creation and command-line arguments. Legitimate activities such as routine system maintenance can also trigger this alert. Companion detections, such as monitoring for unexpected PowerShell scripts or remote management tool usage, can strengthen overall coverage against attacks leveraging these techniques.

