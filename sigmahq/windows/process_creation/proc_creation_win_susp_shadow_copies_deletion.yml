logsource:
  category: process_creation
  product: windows
detection:
  selection1_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    - '\vssadmin.exe'
    - '\diskshadow.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wmic.exe'
    - 'VSSADMIN.EXE'
    - 'diskshadow.exe'
  selection1_cli:
    CommandLine|contains|all:
    - 'shadow'          # will match "delete shadows" and "shadowcopy delete" and "shadowstorage"
    - 'delete'
  selection2_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection2_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'catalog'
    - 'quiet'         # will match -quiet or /quiet
  selection3_img:
  - Image|endswith: '\vssadmin.exe'
  - OriginalFileName: 'VSSADMIN.EXE'
  selection3_cli:
    CommandLine|contains|all:
    - 'resize'
    - 'shadowstorage'
    CommandLine|contains:
    - 'unbounded'
    - '/MaxSize='
  condition: (all of selection1*) or (all of selection2*) or (all of 
    selection3*)
falsepositives:
- Legitimate Administrator deletes Shadow Copies using operating systems 
  utilities for legitimate reason
- LANDesk LDClient Ivanti-PSModule (PS EncodedCommand)
level: high
note: |
  ### Technical Context

  This detection rule identifies instances where shadow copies are deleted using operating system utilities, specifically commands associated with PowerShell, WMIC, WBAdmin, and VSSAdmin. The likely objective of an attacker employing this technique is to eliminate backup snapshots and recovery points to hinder data restoration efforts during a ransomware attack or other malicious operations. This behavior aligns with the MITRE ATT&CK tactic of *Defense Evasion* (T1070) and *Impact* (T1490).

  The primary telemetry source consists of process creation events on Windows systems, specifically Event ID 4688 for process creation and certain command line arguments. If malicious, the deletion of shadow copies could significantly impede the organization's ability to recover data after an attack. It is essential to note that this alert does not confirm malicious action on its own, as legitimate system administrators may also perform similar actions for valid reasons.

  ### Investigation Steps

  - **Review the process creation logs**: Check for Event ID 4688 on affected systems. Look for new process entries related to `powershell.exe`, `wmic.exe`, `vssadmin.exe`, `wbadmin.exe`, or `diskshadow.exe` executed in the timeframe corresponding to the alert.

  - **Examine command line arguments**: Inspect the CommandLine field for processes identified in the previous step. Malicious indicators include commands containing both "shadow" and "delete" or "catalog" with "delete." Legitimate uses may not have this combination in context.

  - **Identify legitimate administrative actions**: Compare against scheduled maintenance windows or known administrator activities. Legitimate deletions often follow organizational policy and may be documented; check for tickets or change logs that justify these actions.

  - **Check for related Event ID 7045 logs**: Review Windows Security Event ID 7045 to identify any new service installation or changes during the same time frame. This can reveal additional activity tied to the deletion that appears suspicious.

  - **Monitor for performance degradation**: If shadow copies were deleted, inspect for abrupt system performance issues or service outages. Investigate hardware monitoring tools for access around this time that may suggest ransomware activity or data encryption efforts.

  - **Correlate with external threat intelligence**: Search for recent incidents involving ransomware that exploit shadow copy deletion and correlate current findings with known threat actors or tools. Look for indicators of compromise or signatures related to recent attacks.

  ### Prioritization

  This alert carries a high severity rating as the deletion of shadow copies can critically jeopardize data recovery strategies, especially for systems housing sensitive information. The likelihood of malicious abuse is significant given the potential for such behavior to be weaponized in modern ransomware attacks, making it essential to triage promptly.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative actions may also trigger this alert, such as scheduled deletions of shadow copies for maintenance. Reliable detection depends on comprehensive logging configurations, including process creation and command-line activity. Additionally, tools like backup managers may interface with shadow copy utilities, leading to potential false positives. Related detections for file system changes (such as unexpected file modifications or deletions) can provide further insight into the overall context of an incident, strengthening coverage and analysis.

