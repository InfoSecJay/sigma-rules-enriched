logsource:
  category: process_creation
  product: windows
detection:
  selection1_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    - '\vssadmin.exe'
    - '\diskshadow.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wmic.exe'
    - 'VSSADMIN.EXE'
    - 'diskshadow.exe'
  selection1_cli:
    CommandLine|contains|all:
    - 'shadow'          # will match "delete shadows" and "shadowcopy delete" and "shadowstorage"
    - 'delete'
  selection2_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection2_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'catalog'
    - 'quiet'         # will match -quiet or /quiet
  selection3_img:
  - Image|endswith: '\vssadmin.exe'
  - OriginalFileName: 'VSSADMIN.EXE'
  selection3_cli:
    CommandLine|contains|all:
    - 'resize'
    - 'shadowstorage'
    CommandLine|contains:
    - 'unbounded'
    - '/MaxSize='
  condition: (all of selection1*) or (all of selection2*) or (all of 
    selection3*)
falsepositives:
- Legitimate Administrator deletes Shadow Copies using operating systems 
  utilities for legitimate reason
- LANDesk LDClient Ivanti-PSModule (PS EncodedCommand)
level: high
note: |
  ### Technical Context

  This rule detects the deletion of Shadow Copies through various Windows utilities such as PowerShell, WMI, and VSS Admin tools. The likely attacker objective is to remove backups that could be utilized for recovery during a ransomware attack or data exfiltration incident. This behavior is relevant to the MITRE ATT&CK techniques T1070 (Indicator Removal on Host) and T1490 (Inhibit System Recovery).

  Primary telemetry sources include process creation logs and command-line activity, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, an attacker could permanently erase recovery points, increasing the potential impact of data loss or system availability issues. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Review process creation events:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for any instances of `vssadmin.exe`, `wbadmin.exe`, or `powershell.exe` involving the command line arguments indicating deletion (e.g., "delete" and "shadow"). Malicious indicators include unusual deletion commands initiated by non-administrative users.

  - **Correlate with user activity logs:** Check for user accounts that executed the detected commands, assessing the legitimacy of their administrative privileges. Typical legitimate activity shows deletion commands executed only by designated admin accounts during scheduled maintenance.

  - **Analyze command line arguments:** Examine the command lines used, particularly for `vssadmin.exe`, `wbadmin.exe`, and `powershell.exe`. Legitimate uses may include "shadow copy delete" commands executed as part of a known backup procedure, whereas suspicious usage could involve arguments like "unbounded" without a specified purpose.

  - **Identify unusual execution patterns:** Investigate any spikes or patterns in the execution of deletion commands, especially within timeframes where user activity is typically low. Legitimate scheduled tasks or backup processes should be documented and compared against unusual execution times.

  - **Check for related file artifacts:** Validate the presence or absence of VSS-related artifacts like `.vss` or `.backup` files in the system file structure. If no Shadow Copies exist after a deletion event, it could indicate intentional malicious behavior.

  - **Review alerts for related detections:** Investigate if there are any companion alerts for atypical system changes or behaviors (e.g., access to sensitive files) within the same time frame. Cross-referencing these can enhance the understanding of potential coordinated malicious actions.

  ### Prioritization

  This alert is high-severity due to the significant impact on the affected system's data recovery capabilities. The deletion of Shadow Copies is commonly weaponized in ransomware attacks, which increases the likelihood of malicious intent. As such, prompt investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as legitimate administrators performing similar actions for valid reasons, which can lead to false positives. Additionally, if log configurations are not properly set to capture relevant process creation data (Event IDs 4688 or 1), detection may fail. The rule may also be triggered by benign administrative activities like manual management of system backups, emphasizing the need for contextual investigation. A companion detection could include monitoring for suspicious file modifications to check for potential ransomware-related file changes.

