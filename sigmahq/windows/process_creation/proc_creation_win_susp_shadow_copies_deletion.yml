logsource:
  category: process_creation
  product: windows
detection:
  selection1_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    - '\vssadmin.exe'
    - '\diskshadow.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'wmic.exe'
    - 'VSSADMIN.EXE'
    - 'diskshadow.exe'
  selection1_cli:
    CommandLine|contains|all:
    - 'shadow'          # will match "delete shadows" and "shadowcopy delete" and "shadowstorage"
    - 'delete'
  selection2_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection2_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'catalog'
    - 'quiet'         # will match -quiet or /quiet
  selection3_img:
  - Image|endswith: '\vssadmin.exe'
  - OriginalFileName: 'VSSADMIN.EXE'
  selection3_cli:
    CommandLine|contains|all:
    - 'resize'
    - 'shadowstorage'
    CommandLine|contains:
    - 'unbounded'
    - '/MaxSize='
  condition: (all of selection1*) or (all of selection2*) or (all of selection3*)
falsepositives:
- Legitimate Administrator deletes Shadow Copies using operating systems utilities
  for legitimate reason
- LANDesk LDClient Ivanti-PSModule (PS EncodedCommand)
level: high
note: |
  ### Technical Context
  This rule detects the deletion of Shadow Copies on Windows systems using operating system utilities. Shadow Copies are a feature in Microsoft Windows that allows for the creation of backup copies or snapshots of files or volumes, and their deletion can be indicative of malicious behavior, particularly during ransomware attacks. Attackers may use command-line tools such as `vssadmin.exe`, `wbadmin.exe`, `diskshadow.exe`, or `powershell.exe` to erase these backups in order to prevent restoration of data after encryption, thereby increasing the impact of their attacks.

  The rule is aligned with the MITRE ATT&CK framework, particularly under the tactics of **Defense Evasion** and **Impact**. Relevant techniques include **T1070: Indicator Removal on Host**, which refers to the deletion or modification of logs to hinder detection, and **T1490: Inhibit System Recovery**, which encompasses actions taken by adversaries to disable or remove backup capabilities to facilitate successful data ransom.

  Key data sources for this detection include **process creation logs** that capture command-line arguments and the executable image names used during the execution of these utilities. Anomalous executions of these commands can signify a potential threat, warranting further investigation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `vssadmin.exe`, `wbadmin.exe`, `diskshadow.exe`, and `powershell.exe` along with their command-line arguments for any that indicate deletion commands, particularly those involving "delete" or "shadow."

  - **Analyze Command-Line Arguments**: Check for the presence of potentially malicious command sequences such as "delete shadows," "shadowcopy delete," or any commands that include "resize" or "shadowstorage" to assess intent and context.

  - **Correlate with Backup Systems**: Determine if there are recent backup operations or scheduled tasks that might coincide with the deletion attempts, which could differentiate between a legitimate administrative task and potential malicious activity.

  - **Monitor for Subsequent Ransomware Behavior**: Following any detection, maintain vigilance for other indicators of compromise, such as unusual file modifications or network connections that might suggest a ransomware attack is underway.

  ### Prioritization
  Given the severity of potential data loss from the deletion of Shadow Copies, this alert is prioritized as high. Successful deletion of these backups can significantly hinder an organization's recovery capabilities following a ransomware incident, making it a crucial area of concern for security teams.

  ### Blind Spots and Assumptions
  This detection may miss legitimate administrative actions, as the rule could trigger on benign uses of the specified commands by system administrators performing maintenance tasks. Additionally, if logs from processes are not collected or if users execute these commands in a manner that does not produce the expected invocation patterns, detections could fail. A reliance on consistent log configuration and the presence of these telemetry sources is crucial for the effective functioning of the rule.

