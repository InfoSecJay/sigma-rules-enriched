title: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
status: test
description: Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl via
  winrm.vbs and copied cscript.exe (can be renamed)
references:
- https://posts.specterops.io/application-whitelisting-bypass-and-arbitrary-unsigned-code-execution-technique-in-winrm-vbs-c8c24fb40404
author: Julia Fomina, oscd.community
date: 2020-10-06
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  contains_format_pretty_arg:
    CommandLine|contains:
    - 'format:pretty'
    - 'format:"pretty"'
    - 'format:"text"'
    - 'format:text'
  image_from_system_folder:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  contains_winrm:
    CommandLine|contains: 'winrm'
  condition: contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of potentially malicious scripts using the Windows Remote Management (WinRM) service through the manipulation of `winrm.vbs`. The primary focus is on the execution of attacker-controlled XML stylesheets (`WsmPty.xsl` and `WsmTxt.xsl`), which are loaded via a copied instance of `cscript.exe`. Attackers may leverage this technique to bypass application whitelisting and execute arbitrary code, thereby gaining unauthorized access or executing malicious actions within a target environment.

  The threat scenario typically involves an adversary looking to exploit the WinRM service for lateral movement or remote code execution. By using obfuscated scripts or renamed binaries, they attempt to carry out their objectives while evading security controls. This behavior falls under the MITRE ATT&CK tactics of “Defense Evasion” (T1216), where attackers try to bypass whitelisting solutions.

  The primary data sources for this detection rule include process creation events, providing insights into command-line arguments and the executables being run. This telemetry is critical due to its capacity to capture detailed information on how scripts are executed, particularly in contexts where common binaries are renamed or manipulated.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for commands related to `winrm.vbs` and the presence of `cscript.exe`. Pay particular attention to unusual arguments such as `format:pretty` or `format:"text"`.
  - **Analyze Suspicious Scripts:** Locate and analyze the contents of any `WsmPty.xsl` and `WsmTxt.xsl` scripts that were executed. This can help identify if they contain malicious payloads or obfuscated code.
  - **Correlate with WinRM Activity:** Investigate recent WinRM activity on affected machines, checking for unusual remote commands or connections that may correlate with the timestamps of the suspicious script executions.
  - **Examine Environment Configurations:** Validate the application whitelisting configurations on affected endpoints to ensure that they are working as intended and that no unauthorized changes have been made that would permit this behavior.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of successful exploitation leading to unauthorized remote access or execution of malicious code. Such activities can facilitate further attacks in the environment and may pose a real threat if left undetected.

  ### Blind Spots and Assumptions
  This detection rule assumes that logs from process creation events are enabled and configured correctly. A potential gap in detection coverage exists if the attacker utilizes legitimate applications to achieve their goals, thus evading scrutiny. Additionally, if the attacker creates alternate means of executing these scripts outside the standard application paths or configurations monitored, detection may be ineffective. Proper configuration of logging for WinRM and script executions is essential for this alert to function adequately.

