title: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
status: test
description: Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl 
  via winrm.vbs and copied cscript.exe (can be renamed)
references:
- https://posts.specterops.io/application-whitelisting-bypass-and-arbitrary-unsigned-code-execution-technique-in-winrm-vbs-c8c24fb40404
author: Julia Fomina, oscd.community
date: 2020-10-06
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  contains_format_pretty_arg:
    CommandLine|contains:
    - 'format:pretty'
    - 'format:"pretty"'
    - 'format:"text"'
    - 'format:text'
  image_from_system_folder:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  contains_winrm:
    CommandLine|contains: 'winrm'
  condition: contains_winrm and (contains_format_pretty_arg and not 
    image_from_system_folder)
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This rule detects the execution of WsmPty.xsl or WsmTxt.xsl files through winrm.vbs using a copied version of cscript.exe, which attackers may leverage to execute arbitrary unsigned code and bypass application whitelisting mechanisms. The likely objective of the attacker is to remotely execute malicious scripts on compromised hosts without triggering security defenses. This behavior fits into the MITRE ATT&CK framework under the tactic "Defense Evasion" (TA0005) and technique "Indicator Removal on Host" (T1216).

  Primary telemetry sources for this detection include process creation logs from Windows, particularly focusing on Event ID 4688, which records process creation events containing the command line arguments associated with winrm.vbs and the malicious XSL files. If successful, this behavior can lead to significant security breaches, including remote code execution and unauthorized access to sensitive data. However, this detection alone does NOT confirm that a compromise has occurred; further investigation is necessary to determine the context and intent behind the command execution.

  ### Investigation Steps

  - **Review event logs for suspicious script execution:** Look for Security Event ID 4688 logs where the command line contains "winrm" and observed parameters such as 'format:pretty' or any similar variations. Pay attention to the ParentProcessId to trace back to its spawning process.

  - **Check for presence of malicious files:** Identify if WsmPty.xsl or WsmTxt.xsl exists on the system by reviewing file paths or creation events in Windows Event Log (e.g., File System Access logs). The presence of these files, especially if located in directories like C:\Windows\Temp, is a high-confidence indicator of malicious intent.

  - **Correlate with network activity:** Investigate any outbound traffic related to Windows Remote Management (WinRM). Check for unusual external connections or command and control communications using firewall or proxy logs, specifically reviewing IP addresses that flow through non-standard ports (like 5985/5986).

  - **Evaluate legitimate usage patterns:** Establish a baseline of expected WinRM usage within the organization. Review environment-specific documentation and user account logs for those authorized to invoke WinRM commands—check for consistent user activity patterns.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems and the likelihood of abuse by malicious actors focusing on stealthy code execution methods. Although not commonly weaponized for mass exploits, variations of this technique can be tailored for targeted attacks, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate WinRM usage in certain environments, which can lead to false positives. It is crucial to ensure that complete Windows Security logs are collected, including detailed command lines from process creation logs. Moreover, benign scripts triggered by legitimate automation tools could also inadvertently trigger this alert. Companion detections, like monitoring for unusual PowerShell commands that interact with WinRM, can enhance coverage and provide context for the observed behavior.

