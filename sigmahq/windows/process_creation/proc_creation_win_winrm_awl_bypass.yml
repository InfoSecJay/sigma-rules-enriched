title: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
status: test
description: Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl 
  via winrm.vbs and copied cscript.exe (can be renamed)
references:
- https://posts.specterops.io/application-whitelisting-bypass-and-arbitrary-unsigned-code-execution-technique-in-winrm-vbs-c8c24fb40404
author: Julia Fomina, oscd.community
date: 2020-10-06
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  contains_format_pretty_arg:
    CommandLine|contains:
    - 'format:pretty'
    - 'format:"pretty"'
    - 'format:"text"'
    - 'format:text'
  image_from_system_folder:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  contains_winrm:
    CommandLine|contains: 'winrm'
  condition: contains_winrm and (contains_format_pretty_arg and not 
    image_from_system_folder)
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious execution of scripts (specifically WsmPty.xsl or WsmTxt.xsl) via the winrm.vbs process. Typically, an attacker may use this technique to bypass application whitelisting mechanisms to execute arbitrary code, often as a part of post-exploitation activities aiming to maintain persistence or escalate privileges in the target environment. Relevant MITRE ATT&CK techniques include "Application Layer Protocol" (T1216) and "Stealthy Command and Control" (T1160).

  The primary telemetry sources for this detection are process creation logs, which are found in Windows Security Event ID 4688 and Sysmon Event ID 1. If the detection is confirmed as malicious, it may indicate a critical security impact as it could lead to unauthorized remote control of the system. However, the detection does NOT confirm malicious intent on its own; benign usage of winrm.vbs and associated scripts can happen in legitimate administrative operations.

  ### Investigation Steps

  - **Analyze Command Line Arguments:**
    Investigate the command line associated with the process by reviewing Security Event ID 4688 or Sysmon Event ID 1. Look for usage of 'winrm' combined with 'format:pretty' or similar variants. Legitimate administrative usage will typically include fully qualified paths and lack non-standard XSL files.

  - **Validate Process Source:**
    Check if 'cscript.exe' is running from a standard Windows directory (C:\Windows\System32\ or C:\Windows\SysWOW64\). Instances of 'cscript.exe' not originating from these directories may indicate potentially malicious behavior.

  - **Correlate with Security Logs:**
    Cross-reference alerts with other security logs, particularly Windows Event IDs 4688 and 4104 (PowerShell). This can reveal additional suspicious activities or related script executions that might signify a broader attack campaign.

  - **Identify Malicious Indicators:**
    Validate if WsmPty.xsl or WsmTxt.xsl is present on the system by investigating files in the working directory or execution paths. Confirm any instances of these files being executed alongside winrm.vbs as high-confidence malicious indicators.

  - **Document Expected Legitimate Behavior:**
    Document and identify legitimate administrative usage patterns of winrm.vbs in your environment, including IT service management practices that may involve remote management commands typically executed with system tools.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on system security, as the use of application-layer protocols like WinRM can be easily abused by attackers, especially in environments lacking stringent monitoring. While common in administrative operations, this behavior is weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers obfuscate their commands or utilize unusual paths for execution. Accurate detection relies on consistent logging from Windows, including process creation events. Benign triggers can arise from legitimate system monitoring or administrative scripts utilizing WinRM. Companion detection for lateral movement using event logs relating to WinRM sessions or remote powershell execution should provide additional context for ongoing investigations.

