detection:
  selection_img:
  - Image|endswith: '\ldifde.exe'
  - OriginalFileName: 'ldifde.exe'
  selection_cli:
    CommandLine|contains|all:
    - '-i'
    - '-f'
  condition: all of selection_*
falsepositives:
- Since the content of the files are unknown, false positives are expected
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `ldifde.exe` command-line tool with the import flag `-i`, which is used to import LDAP Data Interchange Format (LDIF) files into Active Directory. This functionality can be exploited by attackers to include remote HTTP-based arguments, enabling the arbitrary download of potentially malicious files from external servers. The likely objective of these activities is either data exfiltration or the introduction of malicious components into the environment, which can facilitate further exploitation or persistence.

  The relevant MITRE ATT&CK tactics for this rule include **Command and Control** (TA0011) as attackers might use this method to download additional payloads or tools. Additionally, it applies to **Defense Evasion** (TA0057) due to the use of a legitimate tool for malicious purposes. Specific techniques related to this rule include **T1218 - Signed Binary Proxy Execution** and **T1105 - Ingress Tool Transfer**.

  Primary data sources that provide crucial evidence for this detection are process creation events, which capture command execution details, including the command line parameters used.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate Windows process creation logs for instances of `ldifde.exe` being executed with the `-i` flag, paying close attention to the complete command line for any suspicious HTTP arguments.

  - **Examine Network Activity**: Analyze network traffic logs for connections to uncommon external hosts or high volumes of data transfers around the time `ldifde.exe` was executed, which may indicate file downloads or communication with command and control servers.

  - **Investigate Related Files**: If applicable, verify the content and purpose of the imported LDIF files and any remote files that were fetched. Look for anomalies or indicators that suggest they are part of a malicious activity.

  - **Check Security Alerts**: Cross-reference against other alerts in security tools to see if there are additional suspicious activities that correlate with the execution of `ldifde.exe`, such as unauthorized privilege escalations or other command-and-control behaviors.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant impact on the environment if an attacker successfully exploits the `ldifde.exe` functionality to download and execute malicious content. Given that misuse of legitimate tools can lead to difficult-to-detect intrusions, proactive investigation is crucial.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage since the use of `ldifde.exe` may not always indicate malicious behavior and could be executed for legitimate administrative purposes. Assumptions made by the detection logic include the presence of standard logging configurations that capture detailed command-line arguments and process creation events. It is important that process logging is enabled and configured to maintain the visibility necessary for the alert to function effectively.

