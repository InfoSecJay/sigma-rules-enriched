logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ldifde.exe'
  - OriginalFileName: 'ldifde.exe'
  selection_cli:
    CommandLine|contains|all:
    - '-i'
    - '-f'
  condition: all of selection_*
falsepositives:
- Since the content of the files are unknown, false positives are expected
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `Ldifde.exe` with the import flag `-i`, which can be misused by adversaries to import data from LDAP sources and potentially download arbitrary files from remote servers. The likely attacker objective is to exfiltrate sensitive information or establish persistence via imported configurations. The relevant MITRE ATT&CK tactic is Command and Control (T1105), with a technique identified as Defense Evasion (T1218). Primary telemetry sources include Windows process creation events via Security Event ID 4688 and Sysmon Event ID 1. If the activity is malicious, it could lead to data loss or unauthorized access to sensitive information. Importantly, this detection does not confirm that `Ldifde.exe` was used maliciously—it may also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Review process creation details:**
    Check Security Event ID 4688 and Sysmon Event ID 1 for `Ldifde.exe`. Identify the `CommandLine` parameters and user account executing the process. Legitimate execution usually includes standard import operations with no suspicious flags.

  - **Analyze command-line arguments:**
    Look for `CommandLine` containing `-i` and `-f`. Malicious indicators include external URLs in combination with these flags. Verify actions against known good configurations used in routine LDAP operations.

  - **Correlate user account behavior:**
    Investigate the user account performing the action for anomalous behavior, such as previously conducting normal administrative tasks. Use logs to identify a change in behavior that may indicate compromise.

  - **Review network traffic:**
    Monitor network traffic for downloads initiated from the execution of `Ldifde.exe`. Look for outbound connections to suspicious domains or IP addresses, focusing on logs from firewall or proxy appliances.

  - **Check for file downloads:**
    Confirm the presence of downloaded files. Investigate for any unexpected file creations on the host, checking relevant directories for unusual file types or patterns created during the timeframe of the alert.

  ### Prioritization

  This alert holds medium severity as it may indicate a user or process attempting to leverage legitimate tools for malicious purposes. The affected system's role (such as a domain controller) is critical, increasing the importance of rapid investigation. While this behavior can be part of administrative functions, its potential for abuse makes it significant in the context of a well-known attack vector.

  ### Blind Spots and Assumptions

  Detection may be bypassed if logs for process creation are not being collected or are misconfigured, potentially allowing malicious actions to go unnoticed. Legitimate administrative activities may trigger the alert, especially during bulk user account management. Companion detection rules targeting unauthorized file downloads or suspicious web requests (e.g., external HTTP connections) will strengthen overall monitoring capabilities.

