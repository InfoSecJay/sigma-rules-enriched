title: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
status: test
description: Checks whether the image specified in a process creation event is 
  not a full, absolute path (caused by process ghosting or other unorthodox 
  methods to start a process)
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2022-12-14
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  image_absolute_path:
    Image|contains: '\'
  filter_null:
    Image:
  filter_empty:
    Image:
    - '-'
    - ''
  filter_4688:
  - Image:
    - 'System'
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  - CommandLine:
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  condition: not image_absolute_path and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes where the specified image path is not a complete or valid absolute path, often indicative of process ghosting or similar evasion techniques. Attackers may use this method to bypass security tools by launching processes in a way that makes it more difficult to trace their source. This behavior aligns with the MITRE ATT&CK Tactic: Defense Evasion (TA0005) and Technique: Process Hollowing (T1071.001).

  The primary telemetry source for this detection is Windows Process Creation logs, specifically focusing on Security Event ID 4688. If malicious, this behavior can facilitate stealthy execution of unauthorized commands or malware, increasing the risk of data breaches or system compromise. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to contextualize the findings.

  ### Investigation Steps

  - **Review Event ID 4688 logs:** Retrieve recent Process Creation events (ID 4688) from Windows Security logs. Look for instances where the Image field contains a relative or invalid path, such as "System" or "MemCompression," specifically noting the CommandLine used to initiate the process.

  - **Check for common benign processes:** Validate known legitimate processes that could trigger this alert, such as Windows services or system maintenance tasks, which typically have valid absolute paths and consistent command line arguments.

  - **Analyze process parent-child relationships:** Use Sysinternals’ Process Explorer or similar tools to investigate the parent processes for suspicious chains that lead to the execution of non-existent files.

  - **Identify malicious indicators:** Look for processes starting without a valid absolute path that spawn from unusual parent processes (e.g., processes running from non-standard directories or from user profiles). Cross-reference these findings against threat intelligence to identify known malicious behavior.

  - **Validate asset criticality:** Assess the affected system's role within the environment (e.g., server, endpoint), prioritizing investigation efforts for critical assets that may be targeted for attacks.

  - **Examine for unusual API calls:** Assess logs for anomalous calls to Windows API functions related to process management (e.g., CreateProcess, SetWindowsHookEx) that do not align with normal operational patterns.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems if an attacker successfully executes a process via an untraceable method. The likelihood of malicious abuse is considerable given the established techniques known to utilize process ghosting, which have been commonly weaponized in cyberattacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the relevant log sources (Windows Security Event Log for Event ID 4688) are not enabled or properly configured. Legitimate activities, such as certain administrative tasks or software updates, may trigger this alert due to benign processes. A related detection that could enhance coverage is monitoring for unusual PowerShell commands or command-line arguments that execute processes with similar evasion characteristics.

