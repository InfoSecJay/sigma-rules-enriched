title: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
status: test
description: Checks whether the image specified in a process creation event is not
  a full, absolute path (caused by process ghosting or other unorthodox methods to
  start a process)
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2022-12-14
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  image_absolute_path:
    Image|contains: '\'
  filter_null:
    Image:
  filter_empty:
    Image:
    - '-'
    - ''
  filter_4688:
  - Image:
    - 'System'
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  - CommandLine:
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  condition: not image_absolute_path and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where processes are executed without a full, absolute path, commonly indicative of unorthodox methods like process ghosting. The primary goal of such techniques is often to evade detection mechanisms, enabling attackers to execute malicious code while appearing to use legitimate processes. By launching a process without an absolute path, attackers can obscure their activities within the operating system, making it more challenging for security tools to identify the true nature of the execution.

  The relevant MITRE ATT&CK tactics and techniques for this rule include Defense Evasion (TA0011), focusing particularly on the Tactic: Process Injection (T1055), where adversaries may exploit the method of process creation to obfuscate malicious activity. Additionally, it reflects the technique of 'Masquerading' (T1036), where attackers attempt to disguise their executions in a way that mimics legitimate processes.

  Primary data sources for this detection rule include process creation events which can be sourced from Windows Event ID 4688. These logs provide insights into process creation activities, including command line arguments and images that may deviate from standard execution patterns.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows Event ID 4688 logs for newly created processes that lack an absolute path, and evaluate if the associated command line arguments suggest suspicious behavior or unexpected execution context.

  - **Correlate Contextual Data**: Look for correlations between the identified processes and network activity, such as outbound connections or interactions with known malicious IPs or domains.

  - **Analyze User Behavior**: Investigate the user account associated with the process creation for unusual patterns or anomalies, such as timing, frequency of executions, or administrative privileges that were not previously granted.

  - **Check for Persistence Mechanisms**: Examine whether there are any persistence mechanisms in place for the identified processes, such as scheduled tasks or registry modifications that could indicate an attempt to maintain access.

  ### Prioritization
  The alert's high severity is justified due to the potential for significant impact, as undetected process ghosting can lead to successful execution of malicious payloads, often resulting in data exfiltration or further compromise of sensitive systems.

  ### Blind Spots and Assumptions
  This detection rule may experience gaps in coverage, especially if processes are executed with absolute paths that appear legitimate, or if the attacker uses known benign processes that are commonly whitelisted. Furthermore, the rule assumes that process creation events are being logged adequately and without gaps; if not, the absence of data could lead to missed detections. Additional configurations for logging advanced process creations should be verified to ensure comprehensive coverage for this alert.

