title: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
status: test
description: |
  Detects process creation events where the Image field lacks an absolute path,
  which occurs when the backing file no longer exists on disk at the time of
  logging - commonly caused by Process Ghosting or other unorthodox process creation techniques.
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
- https://www.elastic.co/blog/process-ghosting-a-new-executable-image-tampering-attack
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2026-07-05
tags:
- attack.stealth
- attack.privilege-escalation
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  filter_main_image_absolute_path:
    Image|contains: '\'
  filter_optional_null:
    Image:
  filter_optional_empty:
    Image:
    - '-'
    - ''
  filter_optional_4688:
  - Image:
    - 'MemCompression'
    - 'Registry'
    - 'System'
    - 'vmmem'
    - 'vmmemWSL'
  - CommandLine:
    - 'MemCompression'
    - 'Registry'
    - 'vmmem'
    - 'vmmemWSL'
  condition: not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes where the image field does not contain an absolute path, indicating that the backing executable no longer exists at the time of logging. This behavior is often associated with advanced evasion techniques such as "process ghosting," where an attacker attempts to run a process without leaving traditional traces on disk. The likely objective of the attacker is to execute malicious code while evading detection.

  This rule relates to the MITRE ATT&CK technique T1055 (Process Injection), which highlights methods used to run code in the context of another process. The primary telemetry sources for this detection are the Windows security event logs, specifically Security Event ID 4688, which logs process creation events tracking process images and command lines. If malicious, this detection poses a significant risk as it may indicate a successful pivot into sensitive systems or processes, potentially leading to further privilege escalation or lateral movement. However, this alert does not confirm unauthorized access by itself; further contextual analysis is necessary to assess the overall security situation.

  ### Investigation Steps

  - **Review event logs for process creation**: Examine Windows Security Event ID 4688 for related entries that triggered this alert. Pay attention to the “New Process Name” and “Command Line” fields for any processes with empty image paths.

  - **Check parent process relationships**: Investigate the parent process ID (PID) of the detected entries. Malicious processes often have unexpected parent processes or come from unusual user contexts. Use Event ID 4688 to trace the parent process.

  - **Verify legitimate software patterns**: Compare the process in question with known benign processes. For example, if the alert is triggered during the execution of applications like Windows Update or system maintenance tasks, it may represent legitimate activity.

  - **Identify known malicious patterns**: Look for high-confidence indicators such as the execution of "cmd.exe" or "powershell.exe" without an absolute path associated with obfuscated command lines. Events with fragmented command lines or suspicious parameters can indicate an exploit or evasion tactic.

  - **Collect additional telemetry for further analysis**: Gather Sysmon logs (Event ID 1) for detailed process creation data, including hashes and user details. Cross-reference these with threat intelligence for any known malicious signatures.

  - **Assess host criticality**: Note the impact of the affected host. If this alert comes from endpoints labeled as critical servers (e.g., domain controllers or database servers), prioritize it accordingly for deeper investigation.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the likelihood of abuse by sophisticated attackers. The behavior observed is often weaponized in modern attacks, making it crucial for prompt investigation and appropriate response.

  ### Blind Spots and Assumptions

  Detection may be limited if the event logging level is not correctly configured, specifically if Windows Security logs do not capture all relevant process creation events. Legitimate activities, such as software updates or scheduled tasks using tools like Task Scheduler, can trigger this alert. Additionally, a related detection could be the monitoring of anomalous command line arguments in conjunction with Event ID 4688, providing enhanced coverage against evasion techniques.

