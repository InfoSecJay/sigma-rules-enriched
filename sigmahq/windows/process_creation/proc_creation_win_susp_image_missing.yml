title: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
status: test
description: Checks whether the image specified in a process creation event is 
  not a full, absolute path (caused by process ghosting or other unorthodox 
  methods to start a process)
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2022-12-14
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  image_absolute_path:
    Image|contains: '\'
  filter_null:
    Image:
  filter_empty:
    Image:
    - '-'
    - ''
  filter_4688:
  - Image:
    - 'System'
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  - CommandLine:
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  condition: not image_absolute_path and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects process creation events where the specified image is not a full, absolute path. This behavior can indicate potential process ghosting or attempts to execute processes using unconventional methods, which may be employed by adversaries for evasion or lateral movement. The likely attacker objective is to execute malicious code while avoiding detection by using non-standard execution paths.

  This activity is relevant to the MITRE ATT&CK framework, specifically under the tactic "Defense Evasion" and technique "Process Injection" (T1055). The primary telemetry source is Windows process creation logs, specifically targeting Security Event ID 4688. If malicious, this behavior can lead to unauthorized access or execution of malware. Importantly, this detection does NOT confirm malicious activity on its own; further analysis is required to determine intent.

  ### Investigation Steps

  - **Review process creation logs for Event ID 4688:** Check the logs for entries matching the rule condition, focusing on the `Image` field. Look for processes with incomplete paths, which is uncommon and may indicate malicious activity.

  - **Analyze the command line used for process execution:** Validate the `CommandLine` field in Event ID 4688 logs. Legitimate processes often contain recognizable commands or executable paths. Unusual or obfuscated commands can indicate a potential threat.

  - **Cross-reference with known benign processes:** Identify any legitimate applications or service accounts that may generate similar log entries. For example, Windows system processes like 'System' or 'Registry' may trigger the rule but are acceptable if confirmed as benign.

  - **Investigate parent-child process relationships:** Examine the parent process associated with the detected child process. Use Process Explorer or equivalent tools to verify legitimate execution chains. Malicious processes often lack legitimate parentage.

  - **Check for other instances of process ghosting:** Look for patterns in the log where similar non-absolute paths appear. Consistent behavior across multiple executions can strengthen the suspicion of malicious intent.

  ### Prioritization

  The alert severity is categorized as high, given that it may indicate clear attempts at defense evasion. The likelihood of malicious abuse is significant, especially as this technique is commonly leveraged by adversaries to bypass security controls. Compromise of critical systems or assets could result in a severe impact on enterprise security.

  ### Blind Spots and Assumptions

  Detection limitations include reliance on accurate logging configuration. If logging is not enabled for process creation (Event ID 4688), this rule may fail to trigger. Legitimate activities, such as automated scripts or software that manipulate process execution, could also trigger the alert. A related detection to strengthen coverage includes monitoring for abnormal parent-child process relationships that may indicate process injection attempts.

