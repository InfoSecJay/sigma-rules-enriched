title: Arbitrary Shell Command Execution Via Settingcontent-Ms
id: 24de4f3b-804c-4165-b442-5a06a2302c7e
status: test
description: The .SettingContent-ms file type was introduced in Windows 10 and allows
  a user to create "shortcuts" to various Windows 10 setting pages. These files are
  simply XML and contain paths to various Windows 10 settings binaries.
references:
- https://posts.specterops.io/the-tale-of-settingcontent-ms-files-f1ea253e4d39
author: Sreeman
date: 2020-03-13
modified: 2022-04-14
tags:
- attack.t1204
- attack.t1566.001
- attack.execution
- attack.initial-access
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '.SettingContent-ms'
  filter:
    CommandLine|contains: 'immersivecontrolpanel'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a malicious actor may exploit the `.SettingContent-ms` file type in Windows 10 to execute arbitrary shell commands. The threat scenario involves an attacker leveraging the capabilities of such files to create a backdoor or execute unauthorized commands by disguising the activity under normal operations typically associated with system settings.

  The attacker’s objective may include gaining persistence on a target system, executing payloads, or performing lateral movement within an organization’s infrastructure. The associated MITRE ATT&CK techniques include **T1204 - User Execution**, where the attacker relies on user actions to trigger malicious activity, and **T1566.001 - Phishing: Spear Phishing Link**, which could be how the initial access is achieved.

  Primary data sources for effective detection include **process creation events**, particularly focusing on command-line arguments that contain `.SettingContent-ms` and associated invocation patterns involving **immersive control panels**, as this can indicate command execution stemming from these files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation events that include `.SettingContent-ms` in their command-line arguments. Look for any suspicious execution patterns that deviate from normal user behavior.

  - **Analyze User Context**: Determine the user associated with the suspicious process. Validate whether the action aligns with their usual responsibilities and activities, as unexpected usage may indicate malicious intent.

  - **Check for Event Correlations**: Look for correlating events such as network activity or other process engagements that occur concurrently with `.SettingContent-ms` executions. This might expose further malicious infrastructure or lateral movement.

  - **Inspect File Integrity**: Examine the integrity and source of the `.SettingContent-ms` files in question. Verify that they have not been modified or created in an unexpected location on the filesystem.

  ### Prioritization
  This alert is classified as medium severity due to the potential for exploitation of system settings to execute arbitrary commands, which can lead to unauthorized control over systems and data. As the likelihood of such tactics being used in targeted attacks is increasing, timely detection and response are crucial.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be the reliance on user activity to execute `.SettingContent-ms` files, which may limit the ability to detect automated or scripted attacks that do not require direct user interaction. The detection logic assumes that command-line arguments consistently include the file type and may miss obfuscated or differently invoked methods. Proper logging of all process creation events is vital for effective implementation of this alert, which may require enhanced logging configurations to capture relevant details.

