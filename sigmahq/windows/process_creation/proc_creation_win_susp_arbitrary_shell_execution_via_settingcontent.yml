- attack.initial-access
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '.SettingContent-ms'
  filter:
    CommandLine|contains: 'immersivecontrolpanel'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of arbitrary shell commands by monitoring for the creation of process command lines that contain the '.SettingContent-ms' file type. This file type is associated with Windows 10 settings and is often misused by adversaries to execute malicious commands, typically as part of initial access or execution phases within an attack lifecycle.

  The likely attacker objective is to leverage the SettingContent-ms files to run shell commands without raising immediate suspicions. This detection aligns with the MITRE ATT&CK technique "User Execution" (T1204) and "User Execution: Malicious File" (T1566.001). The primary telemetry source is process creation logs captured via Security Event ID 4688 or Sysmon Event ID 1, which detail command-line parameters.

  If confirmed malicious, this behavior could lead to unauthorized access to system resources or data exfiltration. It is important to note that this detection does NOT confirm that malicious activity has occurred on its own; further investigation is required to ascertain intent and context.

  ### Investigation Steps

  - **Review command line arguments:** Examine CommandLine field in Security Event ID 4688 logs for processes containing '.SettingContent-ms'. Look for additional indicators that suggest command execution, such as the presence of system binaries like `immersivecontrolpanel`.

  - **Identify related processes:** Check for unusual parent-child process relationships by cross-referencing Process ID (PID) in Sysmon Event ID 1 logs. Look for suspicious parent processes like Powershell or cmd.exe that may indicate a script execution.

  - **Validate legitimate behavior:** Confirm legitimate use cases of .SettingContent-ms files, which typically involve accessing Windows settings. Look for instances where these files are opened via user action or settings updates from known processes and applications.

  - **Assess operational impact:** Investigate the asset's role; higher impact systems (e.g., servers, critical infrastructure) should be prioritized. Note any unusual access or use patterns in these environments.

  - **Check for artifacts:** Search the filesystem for recent modifications to .SettingContent-ms files or Command Line executions within the last hour using PowerShell scripts or tools like Sysinternals' Process Monitor as an indicator of potential malicious activities.

  ### Prioritization

  This alert should be considered medium severity. The potential impact may vary based on the criticality of the affected systems, particularly if exploited on high-value endpoint systems. The likelihood of malicious abuse is moderate, as the behavior can be a vector for various high-profile attacks targeting user execution.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate applications that use SettingContent-ms files for valid purposes. Proper log source configurations, such as enabling Sysmon for comprehensive process monitoring, are essential for reliable detection. Legitimate administrative activities, like setting changes via scripts, may also trigger the alert. A related detection to consider is monitoring for suspicious PowerShell execution activities (T1059.001) that could be attempting to use SettingContent-ms files for malicious purposes.

