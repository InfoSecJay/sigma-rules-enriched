title: Explorer NOUACCHECK Flag
id: 534f2ef7-e8a2-4433-816d-c91bccde289b
status: test
description: Detects suspicious starts of explorer.exe that use the /NOUACCHECK 
  flag that allows to run all sub processes of that newly started explorer.exe 
  without any UAC checks
references:
- https://twitter.com/ORCA6665/status/1496478087244095491
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2022-04-21
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '/NOUACCHECK'
  filter_dc_logon:
  - ParentCommandLine: 'C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule'
  - ParentImage: 'C:\Windows\System32\svchost.exe'       # coarse filter needed for ID 4688 Events
  condition: selection and not 1 of filter_*
falsepositives:
- Domain Controller User Logon
- Unknown how many legitimate software products use that method
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `explorer.exe` with the `/NOUACCHECK` flag, which allows processes spawned by it to bypass User Account Control (UAC) checks. An attacker may exploit this behavior to escalate privileges without triggering alerts commonly generated by normal software operations, thereby increasing their ability to execute malicious payloads or gain unauthorized access to sensitive data.

  The relevant MITRE ATT&CK tactics and techniques for this detection include Privilege Escalation (T1068) and Specific Privilege Escalation (T1548.002). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it can lead to unauthorized system access and potential compromise of critical systems or sensitive information. This alert does not confirm that the action is malicious without further context, as legitimate applications may also use this methodology.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for the command line arguments associated with `explorer.exe`. Check for any additional parameters indicating unusual behavior or patterns.

  - **Identify parent process:** Determine the parent process of `explorer.exe` by reviewing the `ParentProcessId` field in relevant logs. Legitimate instances of `explorer.exe` typically have a known user context, while suspicious executions will frequently originate from unrecognized or unusual parent processes.

  - **Review recent administrative activity:** Analyze logs for any recent administrative tasks or changes made to UAC settings. Look into Windows Event ID 4107 for policies that may have altered UAC behaviors, as this could indicate a potential evasion technique employed by an attacker.

  - **Correlate with known benign applications:** Identify applications within the environment that commonly use the `/NOUACCHECK` flag and cross-reference their digital signature. If the executing process does not match any known benign application signatures, it may warrant further investigation.

  - **Check for post-exploitation artifacts:** Investigate for any spawned processes initiated by `explorer.exe` after the use of the `/NOUACCHECK` flag. Search for unusual or unauthorized application launches in process logs that could indicate a successful privilege escalation.

  ### Prioritization

  This alert has high severity due to the potential impact on the affected system as it allows for privilege escalation methods that may lead to system compromise. The likelihood of malicious abuse is high, as the `/NOUACCHECK` flag is typically associated with advanced persistence threats, and such behavior is not commonly seen during regular administrative operations.

  ### Blind Spots and Assumptions

  Detecting this behavior has limitations, as legitimate applications may utilize the `/NOUACCHECK` flag for functionality in certain contexts. Reliable detection requires comprehensive logging configurations across system processes, specifically on endpoints. Administrative tasks and legitimate application behaviors may trigger this alert unintentionally. Related detections that enhance coverage include monitoring for subsequent process creations following `explorer.exe` executions and other privilege escalation attempts, such as monitoring for Windows Event ID 4672 (Special Privileges Assigned to New Logon).

