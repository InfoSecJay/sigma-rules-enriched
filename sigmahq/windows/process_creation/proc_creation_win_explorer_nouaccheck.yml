title: Explorer NOUACCHECK Flag
id: 534f2ef7-e8a2-4433-816d-c91bccde289b
status: test
description: Detects suspicious starts of explorer.exe that use the /NOUACCHECK 
  flag that allows to run all sub processes of that newly started explorer.exe 
  without any UAC checks
references:
- https://twitter.com/ORCA6665/status/1496478087244095491
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2022-04-21
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '/NOUACCHECK'
  filter_dc_logon:
  - ParentCommandLine: 'C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule'
  - ParentImage: 'C:\Windows\System32\svchost.exe'       # coarse filter needed for ID 4688 Events
  condition: selection and not 1 of filter_*
falsepositives:
- Domain Controller User Logon
- Unknown how many legitimate software products use that method
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the `/NOUACCHECK` flag when starting `explorer.exe`, which allows any sub-processes spawned by this instance of Explorer to bypass User Account Control (UAC) checks. This behavior may indicate an attempt to evade security controls and perform unauthorized privilege escalation. The likely attacker objective is to execute malicious code with elevated privileges without triggering UAC prompts, facilitating actions that the user would not normally consent to.

  This detection aligns with MITRE ATT&CK tactics of Privilege Escalation (TA.0004) and Defense Evasion (TA.0005), particularly technique T1548.002. The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, along with Sysmon Event ID 1. If malicious, this behavior could lead to significant security incidents, enabling unauthorized access or control over the system. Importantly, this detection alone does not confirm malicious intent as legitimate applications may utilize this flag for functionality.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1. Look for instances where `explorer.exe` is started with `/NOUACCHECK` in the CommandLine field. Verify the user account responsible for the execution. Legitimate user activity typically does not involve this command.

  - **Analyze the parent process:** Assess the ParentCommandLine and ParentImage fields in the log. If the parent process is `C:\Windows\system32\svchost.exe` running the Schedule service, it may indicate a legitimate process. Any other parent process or unfamiliar context may warrant further investigation.

  - **Identify related command activity:** Cross-reference additional commands executed by the new `explorer.exe` instance. Look for unusual or suspicious processes spawning immediately afterward that may indicate malicious activity, using Sysmon Event ID 1 for subprocess tracking.

  - **Investigate user activity history:** Determine if the user has legitimate administrative or elevated rights. Check for recent actions or credentials that could explain the use of UAC bypassing methods, such as admin rights being used in sensitive applications or changes in user privileges.

  - **Check for known software reliance:** Review the organization's application inventory to identify whether any known legitimate programs require the `/NOUACCHECK` flag for functionality. If so, document those exceptions in the incident report.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on privileged system access and control. The use of UAC bypass techniques is a common tactic used in various sophisticated attacks, making it a key indicator of potential malicious behavior. It is less frequently used in benign scenarios, heightening the likelihood of abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by the reliance on certain logging configurations; if security logs are not capturing required events, this behavior may go untracked. Additionally, some legitimate applications might incorporate the `/NOUACCHECK` flag, leading to false positives. Legitimate activity may include specific software installations or updates that require elevated rights without user prompts. Complementary detections include monitoring for increased process creation activity spikes alongside this alert, which can enhance the context around suspicious behaviors.

