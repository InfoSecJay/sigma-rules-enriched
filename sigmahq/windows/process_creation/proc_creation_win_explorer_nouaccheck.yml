title: Explorer NOUACCHECK Flag
id: 534f2ef7-e8a2-4433-816d-c91bccde289b
status: test
description: Detects suspicious starts of explorer.exe that use the /NOUACCHECK flag
  that allows to run all sub processes of that newly started explorer.exe without
  any UAC checks
references:
- https://twitter.com/ORCA6665/status/1496478087244095491
author: Florian Roth (Nextron Systems)
date: 2022-02-23
modified: 2022-04-21
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '/NOUACCHECK'
  filter_dc_logon:
  - ParentCommandLine: 'C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule'
  - ParentImage: 'C:\Windows\System32\svchost.exe'       # coarse filter needed for ID 4688 Events
  condition: selection and not 1 of filter_*
falsepositives:
- Domain Controller User Logon
- Unknown how many legitimate software products use that method
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious instances of the Windows `explorer.exe` process that are initiated with the `/NOUACCHECK` command-line argument. The use of this flag allows all sub-processes spawned by the newly started `explorer.exe` instance to bypass User Account Control (UAC) checks, potentially enabling unauthorized privilege escalation and evasion of security mechanisms.

  Threat actors may exploit this behavior to escalate privileges, allowing them to execute malicious activities without being hindered by UAC prompts. The likely objective behind such exploitation could include lateral movement within the network, installation of further malicious payloads, or establishing persistence through elevated privileges.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Privilege Escalation (TA0004)**
    - **T1548.002: Abuse Elevation Control Mechanism: Bypass User Account Control**

  The primary data source for this detection is process creation events on Windows systems that capture command-line arguments used during process initiation.

  ### Investigation Steps
  - **Verify Process Creation Logs:** Review recent process creation events (`Event ID 4688`) to identify instances of `explorer.exe` with the `/NOUACCHECK` argument. Focus on the command-line context and parent processes.
  - **Examine Parent Process Context:** Check the parent process of the suspicious `explorer.exe` for any unexpected behavior. The presence of `svchost.exe` as a parent process can indicate potential anomalous activity, especially when coupled with the `/NOUACCHECK` flag.
  - **Correlate with Other Events:** Look for related events in the environment that might indicate privilege escalation attempts or lateral movement, such as file modifications or execution of other processes without UAC checks.
  - **Assess User Activity:** Analyze user activity leading up to the detection to confirm if the execution is legitimate or if there's a sign of compromise. Review login history and administrative actions from affected accounts.

  ### Prioritization
  The severity of this alert is deemed high as the use of the `/NOUACCHECK` flag indicates an attempt to circumvent UAC checks, which is critical for maintaining security in a Windows environment. The likelihood of exploitation can lead to significant impact if successfully abused.

  ### Blind Spots and Assumptions
  There may be detection gaps for legitimate applications that also use the `/NOUACCHECK` flag, leading to potential false positives. This rule assumes that the presence of `explorer.exe` initiated in a suspicious manner is indeed malicious without further context. Proper logging of command-line arguments and parent process details is essential for effective detection; missing or incomplete logs could result in missed attacks or unrecognized legitimate uses.

