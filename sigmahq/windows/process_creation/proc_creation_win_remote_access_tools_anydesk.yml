note: |
  ### Technical Context

  This rule detects the execution of AnyDesk, a remote access tool often used by attackers to establish a command and control (C2) channel within a compromised network. Attackers might deploy such tools to facilitate unauthorized remote control of a system, bypassing traditional security measures. This behavior aligns with the MITRE ATT&CK framework tactic for command and control (T1071) and the specific technique for using remote access tools (T1219.002).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688. If malicious, the threat could significantly compromise the integrity and confidentiality of affected systems, allowing adversaries to exfiltrate data or deploy further malicious actions. It is crucial to note that this detection does not prove malicious intent on its own, as AnyDesk can also be used legitimately for remote support.

  ### Investigation Steps

  - **Review process creation logs:**
    Examine Windows Security Event ID 4688 for events where the image path ends with 'AnyDesk.exe' or 'AnyDeskMSI.exe'. Confirm that the event corresponds to unauthorized execution, especially outside of known legitimate usage patterns.

  - **Check application and security logs:**
    Validate entries in Windows Event Log under Application and Security categories that indicate network connections (Event ID 5156) initiated by AnyDesk. Look for suspicious external IP addresses or unusual connection times.

  - **Identify user context:**
    Investigate the user account that executed AnyDesk. Cross-reference with identity access management systems to determine if the user should be allowed to run remote access software.

  - **Monitor for preceding events:**
    Analyze surrounding process creation logs for suspicious commands or prior execution events within a short time frame. Look for known malicious indicators, such as other remote tools or unusual PowerShell activity leading to AnyDesk execution.

  - **Scrutinize network traffic:**
    If available, check network logs for outbound traffic typical of AnyDesk sessions, particularly unusual data volume or connections to unrecognized external IPs following the execution event.

  - **Establish baseline activity:**
    Document expected legitimate usage of AnyDesk within the environment, including typical user roles and authorized connections. Compare any detections against this baseline to assess potential anomalies.

  ### Prioritization

  This alert is medium severity due to the potential for significant operational impact if exploited. The likelihood of malicious use of AnyDesk is increased by its popularity among adversaries for remote access activities, indicating a higher risk requiring prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of application whitelisting or explicit policy exceptions allowing AnyDesk for legitimate business needs. If organizational logging relies solely on Event ID 4688 without network telemetry, this could mask adversarial behavior. Legitimate support scenarios could trigger this alert, especially during remote troubleshooting sessions. Related detections, such as monitoring for other remote access tools (e.g., TeamViewer, VNC), could enhance coverage and provide additional context for investigation.

