note: |
  ### Technical Context

  This rule detects the execution of AnyDesk, a remote access tool that can facilitate an interactive command and control (C2) channel. The likely objective of an attacker using AnyDesk is to establish remote control over a target system for information theft or further exploitation. This behavior aligns with the MITRE ATT&CK tactic of Remote Access (T1219.002).

  The primary telemetry sources are process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could be significant, as it allows an attacker to circumvent traditional defenses and interact with systems directly. Importantly, this detection does NOT confirm malicious intent on its own, as AnyDesk is widely used for legitimate remote support purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Event ID 4688 and Sysmon Event ID 1. Look for `Image` values ending with `\AnyDesk.exe` or `\AnyDeskMSI.exe`, as well as matching `Description`, `Product`, and `Company` fields indicating legitimate use or potential abuse.

  - **Cross-check user context:** Identify the user account running AnyDesk. If it's a privileged account or not typically associated with remote support activities, this may indicate malicious behavior.

  - **Analyze network connections:** Look for outbound connections to known AnyDesk servers. Use tools like Netstat or your network monitoring platform to identify suspicious IP addresses or connection types associated with this remote access tool.

  - **Identify legitimate usage patterns:** Determine if AnyDesk execution aligns with known IT support operations within your organization. Typical patterns involve authorized personnel executing the tool during specific hours assigned for remote assistance.

  - **Investigate additional evidence of compromise:** Check for other concurrent suspicious behaviors or indicators, such as new or unexpected services, created accounts, or file modifications that imply a broader attack vector.

  - **Assess asset criticality:** For critical systems (e.g., servers containing sensitive data), heightened scrutiny is warranted. If AnyDesk is detected, escalate the investigation due to the risk it poses.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if exploited. The likelihood of malicious abuse is significant, as remote access tools like AnyDesk are commonly weaponized in attacks. The context of the asset's role in the organization defines the urgency of response.

  ### Blind Spots and Assumptions

  Detection limitations include evasion through application whitelisting or using legitimate credentials to execute remote tools. Ensure that logging for process creation is enabled at necessary logging levels for reliable detection. Legitimate remote support tasks may trigger this alert, so accurate user role identification is crucial. A related detection for broader coverage could involve monitoring for execution of other common remote access tools like TeamViewer or LogMeIn.

