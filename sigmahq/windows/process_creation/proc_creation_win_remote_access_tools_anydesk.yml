note: |
  ### Technical Context
  This detection rule identifies the execution of AnyDesk, a remote access tool that can be used by adversaries to establish command and control (C2) functionalities within an organization's systems. Adversaries may leverage such tools to gain unauthorized access, bypass security controls, and carry out further malicious activities, particularly in environments where such software is permitted for legitimate purposes. The rule addresses the potential misuse of AnyDesk as part of a broader tactic involving living off the land, where attackers utilize existing tools to evade detection and maintain persistence.

  Relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Tactic:** Command and Control (TA0011)
      - **Technique:** Application Layer Protocol (T1071)
  - **Tactic:** Remote Access Tools (T1219)
      - **Technique:** Remote Access Tool (T1219.002)

  Primary data sources that will provide pertinent evidence include process creation events in Windows environments, which can reveal the execution of AnyDesk, as well as potentially accompanying network traffic logs to monitor unusual outbound connections tied to remote control software.

  ### Investigation Steps
  - **Review Process Creation Logs:**: Analyze logs for the execution of AnyDesk.exe or any associated installers (e.g., AnyDeskMSI.exe) to confirm the legitimacy and context of the execution.
  - **Check Application Whitelisting Settings:**: Ensure that application control mechanisms in place allow or restrict AnyDesk based on the expected usage within the organization.
  - **Examine Network Traffic:**: Monitor outbound connections from the endpoint running AnyDesk, looking for unusual patterns or connections to known malicious IP addresses or domains.
  - **Investigate User Activity:**: Validate whether the user initiated the remote access session for legitimate purposes or if it aligns with non-standard activity that suggests compromise.

  ### Prioritization
  The severity of this alert is medium due to the likelihood that legitimate remote access tools can be exploited for unauthorized access and system manipulation, posing a significant risk if not addressed promptly. The normalcy of such applications in enterprise environments necessitates careful scrutiny to distinguish between benign and malicious usage.

  ### Blind Spots and Assumptions
  This detection may suffer from overlaps with legitimate remote support activities, leading to potential false positives when trusted personnel use AnyDesk for valid business purposes. The detection logic assumes that AnyDesk is not an authorized tool for regular operations; hence, proper logging and threat intelligence feeds are critical for accurate identification. The success of this alert relies on comprehensive process creation logs and ensuring that application control policies are effectively enforced within the IT infrastructure.

