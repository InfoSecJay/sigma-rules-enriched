title: New Capture Session Launched Via DXCap.EXE
id: 60f16a96-db70-42eb-8f76-16763e333590
status: test
description: |
  Detects the execution of "DXCap.EXE" with the "-c" flag, which allows a user to launch any arbitrary binary or windows package through DXCap itself. This can be abused to potentially bypass application whitelisting.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dxcap/
- https://twitter.com/harr0ey/status/992008180904419328
author: Beyu Denis, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-26
modified: 2022-06-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\DXCap.exe'
  - OriginalFileName: 'DXCap.exe'
  selection_cli:
    CommandLine|contains: ' -c '     # The ".exe" is not required to run the binary
  condition: all of selection*
falsepositives:
- Legitimate execution of dxcap.exe by legitimate user
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the "DXCap.EXE" binary with the command-line flag "-c." This combination allows an attacker to utilize DXCap to execute arbitrary binaries or Windows packages, potentially circumventing application whitelisting controls. The threat scenario involves attackers misusing legitimate tools to execute malicious payloads on compromised systems, which can lead to further exploitation, persistence, or lateral movement within the environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (TA0005)**, where adversaries attempt to evade defenses, and **Masquerading (T1036)**, as the use of DXCap may mask malicious behaviors under the guise of legitimate activity. These techniques underscore the need for vigilance in monitoring how legitimate tools are being leveraged.

  The primary data sources for gathering evidence on such activity include **process creation events**, which provide insights into executed commands and the context of their execution. These logs will allow responders to investigate the timeline and intent behind the usage of DXCap.EXE.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review process creation logs to identify the execution of DXCap.EXE, focusing specifically on processes initiated with the "-c" flag. Pay close attention to the user account that executed the command and its privileges.

  - **Check Command-Line Arguments:** Investigate the command-line arguments used with DXCap.EXE. Look for suspicious patterns, such as the invocation of uncommon executables or commands that indicate potential malicious activity.

  - **Validate User Context:** Assess whether the execution of DXCap.EXE occurred under a known legitimate user context. Identify any unusual or unexpected behaviors from accounts that are not typically associated with invoking this application.

  - **Correlate with Other Security Logs:** Cross-reference findings with additional security logs, such as EDR alerts, VPN logs, or firewall logs, to identify any related suspicious activity or lateral movement that may accompany the execution of this command.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of the bypass on existing security controls and the likelihood of abuse by malicious actors aiming to evade detection mechanisms in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if DXCap.EXE is executed in a non-standard way or if the process is run from an atypical user context. The detection logic assumes that all instances of DXCap.EXE will log the command line accurately; environments may vary in their logging configurations. To ensure effective detection, it is essential to enable detailed process creation logging and monitor for all command-line arguments used with executables executing on Windows systems.

