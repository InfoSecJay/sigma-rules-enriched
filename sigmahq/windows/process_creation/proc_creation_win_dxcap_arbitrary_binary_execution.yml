title: New Capture Session Launched Via DXCap.EXE
id: 60f16a96-db70-42eb-8f76-16763e333590
status: test
description: |
  Detects the execution of "DXCap.EXE" with the "-c" flag, which allows a user to launch any arbitrary binary or windows package through DXCap itself. This can be abused to potentially bypass application whitelisting.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dxcap/
- https://twitter.com/harr0ey/status/992008180904419328
author: Beyu Denis, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-26
modified: 2022-06-09
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\DXCap.exe'
  - OriginalFileName: 'DXCap.exe'
  selection_cli:
    CommandLine|contains: ' -c '     # The ".exe" is not required to run the binary
  condition: all of selection*
falsepositives:
- Legitimate execution of dxcap.exe by legitimate user
level: medium
note: |
  ### Technical Context

  This rule detects the execution of **DXCap.EXE** with the command line argument **"-c,"** which can be used to launch arbitrary binaries or scripts. This behavior is typically indicative of an adversary attempting to bypass application whitelisting or execute unauthorized code covertly, suggesting an attempt to escalate privileges or execute malware. Relevant MITRE ATT&CK tactic and technique for this behavior includes: **Execution (TA0002), User Execution (T1203)**.

  The primary telemetry source is **Windows process creation logs**, specifically focusing on Event ID **4688**, which logs the creation of a new process along with its command line arguments. If this behavior is malicious, it might indicate that an attacker has compromised a user's account to run unauthorized commands or scripts. Importantly, detection of this execution pattern does NOT confirm that the executed command is malicious; it only indicates that a suspicious behavior pattern has been observed.

  ### Investigation Steps

  - **Check Event ID 4688 for DXCap execution**: Review the Windows Security Event Log for Event ID 4688 where the **New Process Name** is **"\DXCap.exe"** and **CommandLine** contains **"-c"**. Look for the username associated with the event to identify if the execution is legitimate or suspicious.

  - **Examine the parent process**: Identify the **Parent Process ID** from Event ID 4688 to determine if the execution was initiated from a legitimate application. A launch from Windows Explorer or known tools may indicate benign behavior, while unexpected origins (e.g., from a PowerShell process) should raise flags.

  - **Analyze Command Line Arguments**: Validate the overall command line parameters used alongside **-c** in **DXCap.EXE**. If any additional arguments indicate attempts to execute unusual or malicious binaries, flag it as a high-confidence malicious indicator.

  - **Cross-reference with user roles**: Investigate if the user executing DXCap.EXE has the appropriate permissions. Legitimate use is typically from known, trusted users or roles in specific scenarios (e.g., technical support troubleshooting) versus anomalous use from non-administrative accounts.

  - **Look for artifacts of file creation or exfiltration**: If subsequent logs show file creation or modification related to the executed command, such as temporary files, this could further indicate malicious activity. Check location logs for files created in `C:\Temp\` or similar directories.

  ### Prioritization

  This alert is prioritized as medium severity due to the potential impact of arbitrary code execution on critical systems. The likelihood of malicious abuse exists, especially in environments where application whitelisting is enforced. This behavior is not uncommon in targeted attacks that leverage sophisticated execution techniques.

  ### Blind Spots and Assumptions

  Detection may be limited if users have legitimate reasons to execute DXCap.EXE with the **"-c"** flag, leading to false positives. Ensure that process creation logging is enabled on all endpoints to maintain reliable detection. Furthermore, activities like software troubleshooting or remote support may trigger the detection. A related detection could involve monitoring for unexpected execution of **PowerShell** scripts or other compromised tools to enhance coverage against such tactics.

