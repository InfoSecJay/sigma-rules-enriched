title: New Capture Session Launched Via DXCap.EXE
id: 60f16a96-db70-42eb-8f76-16763e333590
status: test
description: |
  Detects the execution of "DXCap.EXE" with the "-c" flag, which allows a user to launch any arbitrary binary or windows package through DXCap itself. This can be abused to potentially bypass application whitelisting.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dxcap/
- https://twitter.com/harr0ey/status/992008180904419328
author: Beyu Denis, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-26
modified: 2022-06-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\DXCap.exe'
  - OriginalFileName: 'DXCap.exe'
  selection_cli:
    CommandLine|contains: ' -c '     # The ".exe" is not required to run the binary
  condition: all of selection*
falsepositives:
- Legitimate execution of dxcap.exe by legitimate user
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `DXCap.EXE` with the `-c` flag, which can be exploited to launch arbitrary binaries. This behavior is critical as it may allow an attacker to bypass application whitelisting controls, facilitating further exploitation. The relevant MITRE ATT&CK techniques are "Defense Evasion" (T1218) where adversaries execute signed binaries to bypass detection mechanisms. The primary telemetry source for this detection is process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details of executed processes. If this execution is malicious, an attacker could potentially gain unauthorized access, install malware, or exfiltrate sensitive data. This detection does not confirm malicious intent on its own; legitimate usage by a trusted application or authorized user may trigger it.

  ### Investigation Steps

  - **Examine the Command Line Arguments:** Review the process creation logs for Event ID 4688 or Sysmon Event ID 1. Look for instances of `DXCap.EXE` with the `-c` flag in the CommandLine field to confirm detection.
  - **Identify Process Parent:** Check the ParentProcessId in the logs for suspicious parent processes such as `powershell.exe` or unauthorized applications that might indicate a malicious context.
  - **Assess User Context:** Investigate the user account that executed `DXCap.EXE`. If it's a high-privileged account performing this action on a workstation, it should raise suspicion compared to a standard user or service account.
  - **Validate Expected Usage:** Determine if `DXCap.EXE` has a legitimate purpose within your environment by reviewing documentation or prior alerts. Typical benign usage may include legitimate applications utilizing this tool, which can be confirmed by asking users or checking change logs.
  - **Correlate with Lateral Movement Indicators:** Monitor for other activities indicating potential lateral movement, such as abnormal remote desktop sessions or SMB traffic associated with the executed command, to establish wider context.
  - **Review File System Changes:** Check for any recent files created or modified around the time of execution, particularly within temporary directories or unusual user-space locations which may indicate exploitation or placement of malicious payloads.

  ### Prioritization

  This alert has medium severity due to the potential for abusive behavior that could compromise critical systems. The risk is amplified by the likelihood of exploitation techniques targeting gaps in endpoint security, as this behavior directly facilitates bypassing application control measures. Although the use of `DXCap.EXE` is less common in typical enterprise environments, its weaponization is documented, necessitating caution.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion if adversaries have been able to modify legitimate processes or if application whitelisting configurations are ineffective. A necessary log source is process creation monitoring; without it, detection efforts may fail. Legitimate applications like monitoring tools may trigger this alert, necessitating context-specific investigation. Related detections, such as monitoring for other process executions related to remote administration tools (RATs), can enhance coverage and reduce false positives.

