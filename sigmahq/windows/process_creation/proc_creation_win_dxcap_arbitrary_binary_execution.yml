title: New Capture Session Launched Via DXCap.EXE
id: 60f16a96-db70-42eb-8f76-16763e333590
status: test
description: |
  Detects the execution of "DXCap.EXE" with the "-c" flag, which allows a user to launch any arbitrary binary or windows package through DXCap itself. This can be abused to potentially bypass application whitelisting.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dxcap/
- https://twitter.com/harr0ey/status/992008180904419328
author: Beyu Denis, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-26
modified: 2022-06-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\DXCap.exe'
  - OriginalFileName: 'DXCap.exe'
  selection_cli:
    CommandLine|contains: ' -c '     # The ".exe" is not required to run the binary
  condition: all of selection*
falsepositives:
- Legitimate execution of dxcap.exe by legitimate user
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of "DXCap.EXE" with the command-line flag "-c", allowing an attacker to launch arbitrary binaries or packages, which could enable evasion of application whitelisting controls. The likely attacker objective is to execute malicious code without detection, as this tool can facilitate unauthorized actions on the system under the guise of legitimate functionalities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1218).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process details, command-line arguments, and the originating user context. The potential security impact includes unauthorized access and execution of malware. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate users may also execute DXCap.EXE for valid purposes.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for the execution of DXCap.EXE. Look for command lines containing " -c " to isolate potentially malicious executions.

  - **Investigate user context:** Identify the user account that initiated the DXCap.EXE process. Cross-reference this with known legitimate user roles to discern benign versus suspicious behavior.

  - **Check for unexpected binaries:** If the command line includes paths to unexpected binaries or scripts, verify the legitimacy of those files and their origin. Any execution of suspicious binaries via DXCap.EXE is a strong indicator of malicious activity.

  - **Analyze frequency of execution:** Review historical logs to determine the regularity with which DXCap.EXE is executed by the user or system. Frequent or unexplained execution may indicate compromise or misuse.

  - **Track application whitelisting bypass attempts:** Validate any application whitelisting logs to assess if the execution of DXCap.EXE is an attempt to bypass established controls. This could confirm malicious intent.

  ---

  ### Prioritization

  The alert is of medium severity due to potential impacts on critical systems where DXCap.EXE is executed. The likelihood of malicious abuse is moderate, as attackers can utilize this technique for defense evasion. While less common than other attack methods, the ability to launch arbitrary binaries makes this behavior noteworthy, especially in environments with strict application whitelisting.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive process monitoring, as some environments may not log all invocations of DXCap.EXE. Legitimate administrative tasks may trigger the alert, particularly in development environments where DXCap.EXE is regularly used. A related detection to consider is the monitoring of process command lines for other known utilities that could be misused for similar evasion techniques.

