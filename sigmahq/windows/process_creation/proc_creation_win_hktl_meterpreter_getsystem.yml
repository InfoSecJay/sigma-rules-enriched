title: Potential Meterpreter/CobaltStrike Activity
id: 15619216-e993-4721-b590-4c520615a67d
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service starting
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth
date: 2019-10-26
modified: 2023-02-05
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    ParentImage|endswith: '\services.exe'
  selection_technique_1:
        # Examples:
        #   Meterpreter  getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1b (expanded env var): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    CommandLine|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    CommandLine|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_technique_2:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    CommandLine|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  filter_defender:
    CommandLine|contains: 'MpCmdRun'
  condition: selection_img and 1 of selection_technique_* and not 1 of filter_*
falsepositives:
- Commandlines containing components like cmd accidentally
- Jobs and services started with cmd
level: high
note: |
  ### Technical Context

  This rule detects the execution of the "getsystem" command in Meterpreter/Cobalt Strike, commonly used in post-exploitation scenarios to escalate privileges on a compromised Windows system. The attacker’s objective is to gain SYSTEM-level access, enabling them to manipulate the environment or access sensitive resources. It aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (T1068), specifically techniques T1134.001 (Subverting Trusted Processes) and T1134.002 (Exploitation of Trusted Processes).

  The primary telemetry source includes Windows process creation logs, specifically looking for Event ID 4688 detailing command-line activity. If malicious, this activity poses a significant security risk, providing attackers with administrative control over the system. However, this detection does not confirm successful privilege escalation, as further investigation is warranted.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Event ID 4688 for instances where the `ParentImage` ends with `\services.exe` and the `CommandLine` contains "/c", "echo", and "\pipe\". Look for known indicators such as `cmd` usage with unusual echo commands directed to named pipes.

  - **Identify suspicious command patterns**: Search for Event ID 4688 where `CommandLine` includes 'rundll32' and '.dll,a' and check if it is associated with an unusual path, such as `C:\Users\[username]\AppData\Local\Temp`, suggesting potential misuse.

  - **Correlate with recent events**: Analyze related security events leading up to this alert. Queries for other log types like Windows Security Event ID 4663 (Access to an object) or 4672 (Special privileges assigned) can provide context on recent privilege changes or unusual access attempts.

  - **Validate legitimate usage scenarios**: Review typical administrative commands executed via `cmd.exe` to distinguish between normal operations and malicious intentions. Analyze whether similar commands were executed by known system services or administrators.

  - **Check for MsMpEng.exe activity**: Since `MpCmdRun` indicates Windows Defender activity, confirm whether any recent detections from this process correspond with the event in question. If found, it might indicate legitimate scanning or remediation processes.

  ### Prioritization

  This alert has high severity due to the critical nature of the affected system that could allow attackers to gain full control. The likelihood of malicious abuse is significant, as privilege escalation commands are frequently weaponized in attacks. Given its detection of a sophisticated post-exploitation technique, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are improperly configured or if the attack employs evasion techniques like obfuscating command-line arguments. Legitimate administrative actions, such as tool configurations executed under elevated privileges or automated scripts, can inadvertently trigger the alert. A companion detection rule focusing on unauthorized service creation or modifications would enhance coverage, alerting for behavior that typically precedes privilege escalation attempts.

