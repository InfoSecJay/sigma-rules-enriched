title: Potential Meterpreter/CobaltStrike Activity
id: 15619216-e993-4721-b590-4c520615a67d
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting
  a specific service starting
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth
date: 2019-10-26
modified: 2023-02-05
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    ParentImage|endswith: '\services.exe'
  selection_technique_1:
        # Examples:
        #   Meterpreter  getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1b (expanded env var): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    CommandLine|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    CommandLine|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_technique_2:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    CommandLine|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  filter_defender:
    CommandLine|contains: 'MpCmdRun'
  condition: selection_img and 1 of selection_technique_* and not 1 of filter_*
falsepositives:
- Commandlines containing components like cmd accidentally
- Jobs and services started with cmd
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially malicious activity associated with the Meterpreter or Cobalt Strike tools, specifically focusing on the use of the `getsystem` command. This command is often employed by attackers to escalate privileges on a compromised system, typically aiming to gain higher-level access to execute further commands or deploy additional payloads. The relevant MITRE ATT&CK techniques include "T1134.001: Initial Access from External Remote Services" and "T1134.002: Local Privilege Escalation."

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, capturing the command-line activity associated with process creation. If the activity is indeed malicious, it can lead to significant security impacts, including unauthorized access to sensitive data and capabilities to implant persistent malware. However, it is important to clarify that this detection does NOT confirm that a compromise has occurred on its own; it merely flags suspicious behavior that should be investigated further.

  ---

  ### Investigation Steps

  - **Review process creation details:** Examine Security Event ID 4688 or Sysmon Event ID 1 for the offending process. Look for unexpected parent-child process relationships, such as services.exe spawning cmd.exe with suspicious command-line arguments.

  - **Analyze the command line used:** Check if the command line contains `cmd.exe /c echo` or `rundll32.exe` with DLL references. Successful detections will typically have a command with specific patterns involving named pipes, indicating misuse.

  - **Validate legitimate behaviors:** Determine if the affected system is running standard service operations. Services that regularly restart or invoke legitimate command prompts should align with expected service behaviors, such as administrative script tasks.

  - **Cross-reference with known malicious indicators:** Search for associated indicators of compromise (IoC) such as IP addresses or domain names linked to Cobalt Strike infrastructure. Track any existing detections across the environment to assess the threat's broader scope.

  - **Identify high-risk systems or users:** Ensure that the alert originates from critical assets such as domain controllers or systems with access to sensitive data. High-agency users executing such commands are more likely to indicate a security risk.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the elevated permissions involved and the potential impact on organizational assets. The techniques associated with Meterpreter and Cobalt Strike are commonly weaponized, making them a focal point for advanced persistent threats (APTs) and other malicious actors aiming to compromise enterprise environments.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the presence of log sources configured incorrectly; comprehensive logging of PowerShell and command-line activities is essential for reliable detection. Additionally, legitimate automated tasks or scripts that utilize `cmd` or `rundll32` could inadvertently trigger this alert. Related detections, such as monitoring for unusual PowerShell commands (T1059.001), can help to enhance overall coverage against similar behaviors.

