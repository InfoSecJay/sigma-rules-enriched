title: Potential Meterpreter/CobaltStrike Activity
id: 15619216-e993-4721-b590-4c520615a67d
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by 
  detecting a specific service starting
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth
date: 2019-10-26
modified: 2023-02-05
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    ParentImage|endswith: '\services.exe'
  selection_technique_1:
        # Examples:
        #   Meterpreter  getsystem technique 1: cmd.exe /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1b (expanded env var): %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
        #   CobaltStrike getsystem technique 1: %COMSPEC% /c echo 559891bb017 > \\.\pipe\5e120a
    CommandLine|contains|all:
    - '/c'
    - 'echo'
    - '\pipe\'
    CommandLine|contains:
    - 'cmd'
    - '%COMSPEC%'
  selection_technique_2:
        # meterpreter getsystem technique 2: rundll32.exe C:\Users\test\AppData\Local\Temp\tmexsn.dll,a /p:tmexsn
    CommandLine|contains|all:
    - 'rundll32'
    - '.dll,a'
    - '/p:'
  filter_defender:
    CommandLine|contains: 'MpCmdRun'
  condition: selection_img and 1 of selection_technique_* and not 1 of filter_*
falsepositives:
- Commandlines containing components like cmd accidentally
- Jobs and services started with cmd
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `getsystem` command, an indicator often associated with Meterpreter or Cobalt Strike sessions, which is commonly used by threat actors for privilege escalation. The primary attacker objective is to gain elevated permissions on a compromised system, enabling further malicious actions such as lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK techniques T1134.001 (Access Token Manipulation: Token Impersonation/Theft) and T1134.002 (Access Token Manipulation: Process Injection).

  The primary telemetry sources required are Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1. If this activity is malicious, it could lead to unauthorized access and control over critical systems, significantly impacting the organization's security posture. It is important to note that this detection alone does not confirm successful exploitation or persistence—it merely indicates suspicious command execution that requires further investigation.

  ### Investigation Steps

  - **Check process creation logs for Event ID 4688:** Look for command lines containing `/c`, `echo`, or `\pipe\`, initiated by `services.exe`. If found, verify the parent process to assess whether it follows known legitimate behavior. Legitimate services should not exhibit this command pattern.

  - **Examine Sysmon logs (Event ID 1):** Review for any instances of `cmd.exe` or `rundll32.exe` that match the command patterns indicative of Meterpreter/Cobalt Strike usage. Note the timestamps and user context under which the processes were initiated for any anomalies.

  - **Query installed services:** Check if any new services were created within a short time frame before the alert was generated. Services created or modified unexpectedly may indicate malicious activity, especially if linked to the detected command execution.

  - **Identify active network connections:** Look for outbound connections related to the executing process using tools like netstat or Sysmon (Event ID 18) to reveal potential communication with known malicious domains or IP addresses. Malicious indicators often include connections to unfamiliar external IPs.

  - **Validate file paths and artifacts:** Investigate the presence of suspicious files within `C:\Users\{username}\AppData\Local\Temp\`, specifically those referenced in detected command lines. Artifacts related to Meterpreter, including dynamic link libraries (DLLs) or scripts, may suggest a deeper compromise.

  - **Analyze user account activity:** Check the security logs (Event ID 4624) to identify any unusual logon patterns, particularly logons from service accounts or at non-standard times, which could correlate with the detected activity.

  ### Prioritization

  This alert is considered high severity due to the potential compromise of administrative controls on critical systems, which may allow attackers to execute arbitrary commands and escalate access. The likelihood of malicious abuse is high, as the detected behavior directly correlates with tactics employed in active intrusions, making it a common vector for exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using obfuscation within command lines or employing legitimate tools that should not trigger alerts. It's essential that the relevant log sources (Windows security event logs and Sysmon) are properly configured to capture this behavior consistently. Legitimate activities that may trigger the alert include the usage of scripting tools for system maintenance or management tasks. A related detection that strengthens coverage could involve monitoring for other common Meterpreter commands or privilege escalation attempts, such as any instances of `wmic` being executed with similar patterns.

