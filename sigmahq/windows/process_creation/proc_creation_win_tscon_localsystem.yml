note: |
  ### Technical Context

  This rule detects the invocation of the `tscon.exe` process, particularly when initiated by the SYSTEM user. This behavior is often indicative of a privilege escalation tactic, where an attacker hijacks an active Remote Desktop Protocol (RDP) session, which can lead to lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Remote Desktop Protocol Hijacking" (T1219.002).

  The primary telemetry source for this detection is Windows Process Creation events, which can be sourced from Windows Security Event ID 4688 or Sysmon Event ID 1. If the detected behavior is malicious, it can result in unauthorized access to sensitive systems and data. Importantly, this detection does NOT confirm that a compromise has occurred; legitimate administrative actions could also trigger the same alert.

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 or Sysmon Event ID 1 for a process creation entry related to `tscon.exe` initiated by SYSTEM. Look for the command line arguments, which may indicate intent to hijack an RDP session.

  - **Identify user session information**: Cross-reference RDP logins (Event ID 4624 for logon events) to identify whether an active session matches the time frame of the `tscon.exe` execution. Look for sessions from unexpected users or outside normal operational patterns.

  - **Examine session activity lead-up**: Analyze prior events in the same timeframe leading up to the execution of `tscon.exe`. Check for Event ID 4625 (failed logins) or unusual logon patterns (Event ID 4624) that could suggest suspicious access attempts.

  - **Compare with established maintenance activities**: Verify if the execution aligns with scheduled administrative activities or known maintenance windows. Legitimate use of `tscon.exe` generally coincides with legitimate administrative operations during off-hours.

  - **Investigate for lateral movement indicators**: Look for other suspicious activities, such as shell commands or other process invocations (like `powershell.exe` or `cmd.exe`) that occurred shortly before or after `tscon.exe` execution that could further confirm malicious intent.

  ### Prioritization

  This alert should be considered high priority in a mature enterprise context due to the potential for significant impact on sensitive systems. The likelihood of malicious abuse is high, especially in environments where RDP is commonly used. Additionally, the technique being utilized (RDP hijacking) is frequently weaponized in advanced persistence threats and other cyber attacks.

  ### Blind Spots and Assumptions

  Detection may be circumvented by attackers who modify process naming conventions or use non-standard methods to execute RDP hijacking. It's essential to ensure that Sysmon is configured to capture all relevant process creation events for effective monitoring. Legitimate administrative tools or legitimate activities involving `tscon.exe` may trigger this alert; thus, context is crucial. To strengthen detection coverage, consider establishing companion alerts based on failed login attempts (Event ID 4625) or abnormal RDP session logs to better identify potential threats.

