note: |
  ### Technical Context
  This rule detects instances of the `tscon.exe` process being started with SYSTEM privileges, which is an unusual behavior typically used by attackers to hijack Remote Desktop Protocol (RDP) sessions or move laterally within a network. The primary objective of such behavior from an attacker’s perspective is to gain unauthorized access to other users' sessions, potentially elevating their privileges without detection. Additionally, exploiting `tscon.exe` in this manner can be a precursor to further malicious actions such as installing backdoors or exfiltrating sensitive data.

  The relevant MITRE ATT&CK tactics and techniques applicable here include:
  - **Privilege Escalation (TA0004)**, specifically through RDP session hijacking (T1219.002).
  - **Lateral Movement (TA0008)** via remote services and RDP manipulation.

  The primary data source for this detection includes Windows process creation logs, which provide records of the execution of processes, detailing the user context in which they were run and the associated command line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the Windows process creation logs to identify instances of `tscon.exe` being executed. Pay particular attention to the user context (SYSTEM) and the command line arguments used.
  - **Inspect User Sessions:** Validate the legitimacy of active user sessions that may have been targeted or compromised. This can involve comparing active sessions against known users and review logs for abnormal session times or behaviors.
  - **Check for RDP Hijacking Indicators:** Look for signs of potential RDP hijacking activities, such as multiple logins from different IP addresses for the same user or unusual login patterns that deviate from normal user behavior.
  - **Assess Further Lateral Movement:** Investigate any subsequent activities initiated by the SYSTEM user post-`tscon.exe` execution that may indicate lateral movement or privilege escalation attempts, including new service installations or unusual network connections.

  ### Prioritization
  This alert is highly severe because it indicates a potential privilege escalation and lateral movement technique that undermines the security perimeter of the enterprise, allowing attackers to access sensitive systems and data.

  ### Blind Spots and Assumptions
  One gap in detection coverage may be the limited visibility into actions that occur post-`tscon.exe` execution unless additional telemetry is integrated. The detection logic operates under the assumption that legitimate processes will not typically run `tscon.exe` as SYSTEM without valid reasoning. Required logs include complete and unfiltered Windows process creation logs, along with other associated logs for user sessions and RDP activities to enhance detection accuracy.

