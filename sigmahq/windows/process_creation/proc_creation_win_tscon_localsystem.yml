  ---

  ### Technical Context

  This Sigma rule detects the execution of `tscon.exe` triggered by the LOCAL SYSTEM user context, which is often unusual and may indicate privilege escalation or lateral movement tactics by an adversary. The likely attacker objective here is to hijack existing RDP (Remote Desktop Protocol) sessions, facilitating unauthorized access to sensitive systems or data. The relevant MITRE ATT&CK tactic is "Command and Control," with the technique specifically identified as "T1219.002: Remote Desktop Protocol Hijacking.”

  Primary telemetry sources include Windows Security Event Logs, specifically Event ID 4688 (Process Creation), which provides insights on newly created processes, along with Sysmon Event ID 1 for more detailed event attributes. If the behavior is malicious, it poses a significant security threat, potentially resulting in unauthorized access and data breaches. However, it's critical to note that the detection of `tscon.exe` alone does not confirm malicious intent; legitimate administrative tasks may also invoke this process under specific conditions.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 for instances where `tscon.exe` was executed, especially under the LOCAL SYSTEM context. Compare with known good executions to establish context.

  - **Examine parent process relationships:** Look for the parent process of `tscon.exe` in Sysmon Event ID 1 logs. Malicious executions may have suspicious parent processes, unlike legitimate administrative actions which often originate from standard management tools.

  - **Identify the session being hijacked:** Investigate any active RDP sessions on the host involved to determine if `tscon.exe` corresponds to a session ID that aligns with a known user or is anomalous. Use RDP logs to correlate session data.

  - **Assess legitimate activity:** Determine whether there are scheduled tasks or management tools in use that legitimately invoke `tscon.exe`. Historical usage patterns may help indicate benign use cases.

  - **Evaluate network connections:** Use network logs to identify unexpected outbound connections initiated following the execution of `tscon.exe`. Look for unusual traffic patterns that could suggest adversarial intent.

  - **Check for artifacts of lateral movement:** Validate any associated file creation or alteration, particularly in system directories. E.g., checking for unexpected DLLs or executables in directories like C:\Windows\Temp that may indicate compromise.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on enterprise systems, particularly if executed on critical infrastructure. The likelihood of malicious use is elevated, especially in environments where RDP is enabled, making this behavior a common tactic among attackers.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate administrative actions or misconfigured server settings, leading to false positives. Accurate logging from Windows Security and Sysmon is required for reliable detection. Legitimate activities such as scheduled maintenance or remote administrative tasks might trigger this alert, particularly in a managed RDP environment. Related detections, such as monitoring for unusual RDP session activity or unauthorized access attempts, can provide additional context and improve overall security posture.

