note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of a renamed instance of the MeshAgent software, a remote monitoring and management (RMM) tool commonly used by IT administrators for legitimate remote support. However, threat actors may exploit these tools by renaming them, allowing unauthorized access to systems for malicious purposes, such as data exfiltration or the establishment of backdoors. The goal of such attackers is often to maintain persistence within a compromised network while evading security measures.

  The primary techniques highlighted in this detection align with the MITRE ATT&CK framework, specifically focusing on the tactics of Command and Control (T1071) and Defense Evasion (T1036.003). Detection is explicitly aimed at recognizing process creation events that feature the execution of MeshAgent under unusual circumstances, which could indicate an attempt to obscure malicious activity. The primary data sources for this detection include Windows process creation logs, which capture details about executed commands and their parameters.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine Windows process creation logs for instances where MeshAgent is executed with command-line arguments that include `--meshServiceName`, indicating a potential unauthorized use of the tool.
  - **Inspect Renaming Patterns**: Confirm if the file path ends with `\meshagent.exe`, and check for common renaming patterns associated with malicious usage of legitimate tools.
  - **Correlate with User Activity**: Investigate user account activity and behavior for the time frame surrounding the detection, looking for unusual or abnormal access patterns related to the accounts running the MeshAgent process.
  - **Identify Persistency Mechanisms**: Assess the system for persistence mechanisms that could have been leveraged, such as startup folder entries or scheduled tasks, which may indicate ongoing malicious unauthorized access attempts.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to gain unauthorized control over systems using legitimate tools modified for malicious purposes, enabling significant network threats like data breaches or further compromise.

  ### Blind Spots and Assumptions
  This detection may not cover all scenarios of malicious use of RMM tools, especially if attackers employ other methods to obscure their activities. The logic assumes that the renamed MeshAgent retains recognizable command-line arguments typical of its operations. Required logs include detailed Windows process creation events, which must be enabled for this detection to function effectively. Environments lacking comprehensive process monitoring may miss critical instances of abuse.

