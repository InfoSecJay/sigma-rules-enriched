note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed instance of MeshAgent, which is a Remote Monitoring and Management (RMM) tool. Attackers may exploit legitimate RMM tools by renaming them to avoid detection, enabling unauthorized remote access to systems. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), specifically technique **Application Layer Protocol** (T1219.002) and **Masquerading** (T1036.003).

  The primary telemetry source is Windows process creation logs, specifically capturing processes where the command line contains `--meshServiceName` and the original filename includes `meshagent`. If malicious, the execution of this renamed instance can signify an unauthorized access vector, making it a critical security concern. However, this detection does NOT confirm that malicious activity is occurring; it merely indicates the presence of potentially suspicious tool execution.

  ### Investigation Steps

  - **Assess process details: ** Review the associated process creation logs for Event ID 4688, focusing on the `NewProcessName`, `CommandLine`, and `OriginalFileName` fields to identify if this is the MeshAgent executable being executed unexpectedly.

  - **Check parent process hierarchy: ** Investigate the parent process ID (PPID) to determine if the MeshAgent was launched by a legitimate administrative application or a suspicious process. Legitimate usage often comes from known administrative tools or user-initiated processes.

  - **Validate command-line arguments: ** Confirm if the command line contains the string `--meshServiceName`, which is characteristic of the renamed MeshAgent execution. Legitimate usage may not employ this exact syntax consistently.

  - **Monitor for unusual destination processes: ** Identify if there are attempts to connect to external IP addresses or domains associated with known malicious infrastructure in tandem with this execution, which would indicate a potential malicious activity pattern.

  - **Cross-reference execution timeframe: ** Correlate the execution of MeshAgent with other logs (e.g., security, application) to check for any preceding suspicious activities or alerts that might indicate a compromise, such as account lockouts, unauthorized logins, or other process creation anomalies.

  ### Prioritization

  This alert is prioritized as high due to the potential for significant impact if an unauthorized actor is utilizing a RMM tool to maintain persistence or control over compromised systems. The likelihood of malicious abuse is elevated, given the previous usage of such tools in targeted attacks. Furthermore, the evasion technique of renaming legitimate tools is commonly weaponized among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if process creation logs are not thoroughly enabled or if the MeshAgent routinely executes under a legitimate administrative context. Legitimate administrative activity may trigger this alert during authorized remote support sessions. A related detection to strengthen coverage is the monitoring of scheduled tasks or services being created with references to MeshAgent, which may provide additional context on persistent threat vectors.

