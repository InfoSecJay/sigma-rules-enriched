note: |
  ### Technical Context

  This rule detects the execution of a renamed instance of the Remote Monitoring and Management (RMM) tool, MeshAgent. Attackers may exploit legitimate tools like MeshAgent for unauthorized remote access by renaming them, thus evading detection mechanisms. This behavior indicates a potential compromise, where the attacker aims to maintain persistent access to the system.

  The relevant MITRE ATT&CK tactic is *Command and Control* (TA0011) with a technique of *Application Layer Protocol* (T1219.002). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which track command line activity and new process execution. If malicious, this can lead to unauthorized data access and control over critical systems. Importantly, this detection does NOT confirm whether the activity originated from a legitimate or compromised environment on its own.

  ### Investigation Steps

  - **Check process creation events:** Investigate Security Event ID 4688 and Sysmon Event ID 1 for new processes related to "meshagent.exe". Note the command line arguments to determine if they contain `--meshServiceName`, which is a key indicator of the exploitation.

  - **Identify file path integrity:** Validate the executable path in the logs to confirm that it ends with `\meshagent.exe`. If the path is altered or the file is in a suspicious location, it could indicate malicious use.

  - **Analyze recent changes:** Check for any administrative changes to system policies or configurations around the time the alert was triggered, which can lend context to whether the activity is legitimate or not, focusing on Event ID 4697 (service creation).

  - **Correlate with network logs:** If network logs are available, inspect for outbound connections to known C2 servers or unusual traffic patterns consistent with remote access tools, especially if there are any connections initiated by the MeshAgent.

  - **Review user and asset roles:** Determine the legitimacy of the user or system executing MeshAgent by verifying their expected roles. Legitimate administrator users executing this tool on expected asset types (like a desktop in IT) may reduce the alert's severity.

  - **Look for concurrent suspicious behavior:** Check for other indicators of compromise or lateral movement, such as suspicious PowerShell command execution (Event ID 4104) or anomalous login patterns (e.g., Event ID 4624 from unusual IPs or hosts).

  ### Prioritization

  This alert is of high severity due to the potential for significant impact if an attacker gains unauthorized remote access to critical systems. The likelihood of exploitation using tools like MeshAgent is elevated, as they are commonly weaponized in attack campaigns, especially in instances of persistent threats.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that renamed legitimate tools may not be inherently malicious and could trigger false positives in benign admin scenarios. Reliable detection requires comprehensive visibility into process execution and potentially network traffic related to remote access. Activities such as legitimate IT support or remote administration may lead to similar alerts. A related detection to consider is monitoring for unauthorized modifications to system services (MITRE ATT&CK technique T1543.003) which could provide additional context to malicious actions.

