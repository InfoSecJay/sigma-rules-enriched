title: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
id: 02b18447-ea83-4b1b-8805-714a8a34546a
status: test
description: |
  Detects execution of Windows Defender "OfflineScannerShell.exe" from its non standard directory.
  The "OfflineScannerShell.exe" binary is vulnerable to DLL side loading and will load any DLL named "mpclient.dll" from the current working directory.
references:
- https://lolbas-project.github.io/lolbas/Binaries/OfflineScannerShell/
author: frack113
date: 2022-03-06
modified: 2023-08-03
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\OfflineScannerShell.exe'
  - OriginalFileName: 'OfflineScannerShell.exe'
  filter_main_legit_dir:
    CurrentDirectory: 'C:\Program Files\Windows Defender\Offline\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the "OfflineScannerShell.exe" process from non-standard directories, which can indicate potential malicious activity involving DLL sideloading. Specifically, when this executable is run from an atypical location, it may load a malicious or altered version of the "mpclient.dll" DLL file, which typically resides in the standard Windows Defender directories. This capability can be exploited by attackers to introduce malicious payloads into the environment, aiming for persistence, evasion of detection, or executing payloads with higher privileges.

  The likely threat scenario involves an attacker trying to evade defenses by utilizing legitimate tools for malicious purposes, falling under the umbrella of the Defense Evasion tactic in the MITRE ATT&CK framework. This activity aligns with techniques specifically targeting DLL hijacking (T1218), where attackers replace or manipulate legitimate DLLs to execute their code without triggering alarm mechanisms.

  The primary data sources for this detection include process creation events that log when and from where processes are executed, particularly focusing on the "Image" and "CurrentDirectory" fields to confirm the legitimacy and context of the execution. Monitoring the original filepath in conjunction with typical behavior can help identify deviations that warrant further investigation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for any execution entries of "OfflineScannerShell.exe." Pay close attention to the "CurrentDirectory" field to determine if it points to an unusual path.

  - **Correlate with File Location**: Verify the file path of "mpclient.dll" being loaded alongside "OfflineScannerShell.exe." Investigate the directory structure for anomalies or indicators of compromise, such as altered timestamps.

  - **Examine Running Processes**: Utilize task management tools to identify any running instances of "OfflineScannerShell.exe" and inspect associated child processes. Confirm if any suspicious behavior aligns with known malicious activities.

  - **Analyze Windows Defender Logs**: Review Windows Defender or antivirus logs for any indications of abnormalities or failures in detecting malicious behaviors. This can provide insight into threats that may have bypassed standard defenses.

  ### Prioritization
  The severity of this alert is medium due to the potential for significant impact if malicious DLLs are being loaded and executed. In enterprise environments, such behavior can compromise sensitive systems and expose critical data, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions
  A possible blind spot in this detection is the reliance on process execution logs alone; the absence of those logs or misconfigured logging settings could allow this method of exploitation to go undetected. The detection logic assumes "OfflineScannerShell.exe" is the primary vector for covert DLL loading and does not account for other executable files that could be leveraged similarly. Sufficient logging configurations and security monitoring must be in place to ensure complete coverage of the relevant process execution metrics.

