title: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
id: 02b18447-ea83-4b1b-8805-714a8a34546a
status: test
description: |
  Detects execution of Windows Defender "OfflineScannerShell.exe" from its non standard directory.
  The "OfflineScannerShell.exe" binary is vulnerable to DLL side loading and will load any DLL named "mpclient.dll" from the current working directory.
references:
- https://lolbas-project.github.io/lolbas/Binaries/OfflineScannerShell/
author: frack113
date: 2022-03-06
modified: 2023-08-03
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\OfflineScannerShell.exe'
  - OriginalFileName: 'OfflineScannerShell.exe'
  filter_main_legit_dir:
    CurrentDirectory: 'C:\Program Files\Windows Defender\Offline\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the execution of the "OfflineScannerShell.exe" process, specifically when it originates from non-standard directories. This behavior is associated with potential DLL side-loading attacks, where the process may load a malicious "mpclient.dll" from the current working directory instead of the intended legitimate DLL from the default path. The likely attacker objective is to execute arbitrary code by tricking the system into loading a malicious DLL. Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and "DLL Search Order Hijacking" (T1218).

  The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688, which captures process creation events. If the process is malicious, it could lead to unauthorized code execution, system compromise, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent or execution on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Verify event details: **Review Security Event ID 4688 for the "OfflineScannerShell.exe" process creation. Confirm that the command line arguments do not include suspicious parameters or paths. Look for abnormalities in the creation time relative to known legitimate behavior.

  - **Assess Current Directory: **Check the `CurrentDirectory` field in the process logs. If it shows paths other than "C:\Program Files\Windows Defender\Offline\", this could indicate potential side-loading and should be considered suspicious.

  - **Correlate with Existing Behavior: **Compare with baseline behavior for "OfflineScannerShell.exe". In legitimate cases, this file should run from its standard directory without loading any custom DLLs. Look for known usage patterns during system scans.

  - **Search for Malicious DLL: **Investigate the current working directory for the presence of "mpclient.dll" or any other DLLs. The absence in the expected location could indicate an attempted side-load. Use File Explorer or command-line tools to check file existence, creation dates, and signatures.

  - **Analyze System Impact: **Determine the role of the affected host, focusing on criticality. For servers or endpoints in sensitive environments, heightened scrutiny is necessary. Assess logs for any prior suspicious activities that could correlate to this execution.

  ### Prioritization

  This alert warrants medium severity due to its potential impact on systems running Windows Defender and the likelihood of exploitation through DLL sideloading. While this behavior is not widely recognized as a common attack vector, it poses a risk if leveraged in a targeted attack against high-value assets.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging that fails to capture process creation events effectively. Adversaries may employ techniques such as renaming legitimate tools or using legitimate scheduled tasks to bypass detection. Legitimate activities, such as automated antivirus scans, may trigger the alert. Companion detections that enhance coverage include monitoring for abnormal process parent-child relationships (e.g., suspicious parent processes launching "OfflineScannerShell.exe").

