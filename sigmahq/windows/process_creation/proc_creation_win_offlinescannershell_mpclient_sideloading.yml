title: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
id: 02b18447-ea83-4b1b-8805-714a8a34546a
status: test
description: |
  Detects execution of Windows Defender "OfflineScannerShell.exe" from its non standard directory.
  The "OfflineScannerShell.exe" binary is vulnerable to DLL side loading and will load any DLL named "mpclient.dll" from the current working directory.
references:
- https://lolbas-project.github.io/lolbas/Binaries/OfflineScannerShell/
author: frack113
date: 2022-03-06
modified: 2023-08-03
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\OfflineScannerShell.exe'
  - OriginalFileName: 'OfflineScannerShell.exe'
  filter_main_legit_dir:
    CurrentDirectory: 'C:\Program Files\Windows Defender\Offline\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the OfflineScannerShell.exe binary from non-standard directories, which can indicate attempts to exploit DLL side-loading vulnerabilities, particularly loading a malicious mpclient.dll. The likely attacker objective involves executing arbitrary code by leveraging a trusted process, intending to bypass security mechanisms. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion and specifically technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry source is process creation events, notably Windows Security Event ID 4688 and/or Sysmon Event ID 1. If the behavior is malicious, it may compromise the integrity of the system. This detection does not confirm that a compromise has occurred but rather highlights potentially suspicious behavior that necessitates further investigation.

  ### Investigation Steps

  - **Verify process execution context**: Review Security Event ID 4688 or Sysmon Event ID 1 logs for OfflineScannerShell.exe execution. Note the current working directory; legitimate executions should originate from C:\Program Files\Windows Defender\Offline\.

  - **Check for mpclient.dll presence**: Inspect the current working directory from the execution context for any occurrence of mpclient.dll. Any instance of this DLL loaded from a non-standard directory raises suspicion of malicious activity.

  - **Identify command-line arguments**: Analyze the command-line parameters in the process creation logs. Benign executions will usually not contain arbitrary or unusual parameters. Look for any signs of obfuscation or unexpected arguments that could indicate malicious intent.

  - **Correlate with recent administrative actions**: Check system logs for any recent administrative actions, such as software installations or system changes involving Windows Defender components that could justify legitimate use of OfflineScannerShell.exe.

  - **Review past alert history**: Search for previous alerts regarding OfflineScannerShell.exe or similar process executions in the environment. Patterns of recurring non-compliant usage may indicate a more extensive evasion attempt.

  ### Prioritization

  This alert should be treated with medium priority. While the potential impact of executing code via a trusted process is substantial, the specific behavior is not frequently weaponized but remains a risk, particularly in environments where defenses are robust. The presence of this alert timely indicates a need for immediate review to determine if a security incident is unfolding.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming the binary or executing OfflineScannerShell.exe from compliant directories with a benign file. The alert relies on the presence of accurate process creation logs, which must be enabled for effective detection. Legitimate activities that may trigger this alert include system maintenance or updates from trusted sources. Enhancing coverage might involve companion detections for other signed binaries or monitoring changes to critical directories that could preemptively identify side-loading attempts.

