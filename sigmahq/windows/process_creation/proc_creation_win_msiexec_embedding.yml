title: Suspicious MsiExec Embedding Parent
id: 4a2a2c3e-209f-4d01-b513-4155a540b469
status: test
description: Adversaries may abuse msiexec.exe to proxy the execution of malicious
  payloads
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
author: frack113
date: 2022-04-16
modified: 2022-07-14
tags:
- attack.t1218.007
- attack.defense-evasion
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    ParentCommandLine|contains|all:
    - 'MsiExec.exe'
    - '-Embedding '
  filter_splunk_ufw:
    Image|endswith: ':\Windows\System32\cmd.exe'
    CommandLine|contains: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_vs:
  - CommandLine|contains: '\DismFoDInstall.cmd'
  - ParentCommandLine|contains|all:
    - '\MsiExec.exe -Embedding '
    - 'Global\MSI0000'
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious behavior related to the use of `msiexec.exe`, particularly when it is utilized as a parent process for launching other executables such as `powershell.exe`, `pwsh.exe`, or `cmd.exe`. Adversaries may leverage `msiexec.exe` to execute malicious payloads, leading to potential unauthorized access, privilege escalation, or execution of harmful scripts. The primary objective for an attacker using this technique is to obfuscate their actions by harnessing a legitimate Windows process for executing their malicious commands.

  This activity correlates with the MITRE ATT&CK technique T1218.007, which specifically addresses the abuse of the Windows Installer process via `msiexec.exe` for embedding and launching malicious payloads. The relevant tactic is Defense Evasion, as attackers aim to evade detection by masking their activities through trusted system components. To effectively identify and analyze this behavior, telemetry from process creation events will be crucial, particularly focusing on parent-child process relationships and command-line arguments associated with these executable files.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs for instances where `msiexec.exe` is the parent process of `powershell.exe`, `pwsh.exe`, or `cmd.exe` to identify suspicious command-line arguments.
  - **Examine Command-Line Arguments:** Look for command-line invocations of `msiexec.exe` that include the `-Embedding` argument, as this can indicate an attempt to run malicious code in a stealthy manner.
  - **Identify Related Parent Processes:** Trace back from any identified suspicious child processes to their parent processes, ensuring that they are indeed linked to `msiexec.exe` and not legitimate installation activities.
  - **Cross-Check with Known Indicators:** Compare the identified behavior against known indicators of compromise or use threat intelligence to ascertain if the behavior correlates with documented adversary tactics or techniques.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential for substantial impact if an adversary successfully exploits this technique to execute malicious payloads. Given that this method employs a legitimate Windows process, it may bypass conventional security controls, making prompt investigation critical.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where `msiexec.exe` is legitimately used for software installation or updates, leading to potential false positives. Additionally, the rule assumes that all relevant logs, such as process creation events, will be available and configured to record necessary details. Without complete logging of all process creation activities, especially in environments with strict logging policies, the rule may not perform optimally.

