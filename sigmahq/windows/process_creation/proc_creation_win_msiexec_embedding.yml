title: Suspicious MsiExec Embedding Parent
id: 4a2a2c3e-209f-4d01-b513-4155a540b469
status: test
description: Adversaries may abuse msiexec.exe to proxy the execution of 
  malicious payloads
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
author: frack113
date: 2022-04-16
modified: 2022-07-14
tags:
- attack.stealth
- attack.t1218.007
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    ParentCommandLine|contains|all:
    - 'MsiExec.exe'
    - '-Embedding '
  filter_splunk_ufw:
    Image|endswith: ':\Windows\System32\cmd.exe'
    CommandLine|contains: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_vs:
  - CommandLine|contains: '\DismFoDInstall.cmd'
  - ParentCommandLine|contains|all:
    - '\MsiExec.exe -Embedding '
    - 'Global\MSI0000'
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_msiexec_embedding/info.yml
note: |
  ### Technical Context

  This rule detects the execution of PowerShell or command-line scripts that are initiated by `MsiExec.exe`, indicating potential abuse of the Windows Installer tool to run malicious payloads through embedding. The likely attacker objective is to proxy the execution of these payloads to evade detection mechanisms while relying on trusted system processes. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **T1218.007 (Signed Binary Proxy Execution: MSIExec)**.

  The primary telemetry sources for this detection are the process creation logs, specifically Windows Security Event ID 4688, as well as Sysmon Event ID 1 for more granular process creation details. If malicious, this behavior could enable unauthorized software installation, leading to further exploitation or system compromise. However, this detection does NOT confirm that the execution is always malicious—the behavior could occur due to legitimate software installation processes.

  ### Investigation Steps

  - **Check process creation logs:** Examine Windows Security Event ID 4688 and/or Sysmon Event ID 1 for events where `MsiExec.exe` is the parent process. Look for child processes launching `powershell.exe`, `pwsh.exe`, or `cmd.exe` with a `ParentCommandLine` containing `-Embedding`.

  - **Analyze command-line arguments:** Review the command lines of the processes involved for specific arguments. A genuine installation will typically contain legitimate MSI file paths or installation parameters, while malicious instances may have obfuscated file paths or unusual parameters.

  - **Compare with known benign entries:** Cross-reference suspicious process behavior with a whitelist of authorized software installations to validate if the execution is part of a legitimate deployment policy.

  - **Identify high-confidence malicious indicators:** Look for unusual file paths or commands following the use of `MsiExec.exe`. For example, execution of scripts from temporary directories or user profile locations could indicate malicious behavior.

  - **Document host role impact:** Consider the role and criticality of the host involved. Non-administrative systems executing this behavior should raise higher suspicion compared to administrative workstations where legitimate software updates occur.

  - **Validate artifact creation:** If applicable, check for the creation of files typically associated with malicious activity, such as .exe or .dll files in unusual directories or transient paths, to confirm potential exfiltration or persistence mechanisms.

  ### Prioritization

  This alert is of medium severity due to the potential impact on affected systems, especially if they are high-value targets or critical infrastructure. The likelihood of malicious abuse is significant, as similar behaviors are frequently observed in attacks leveraging trusted processes to circumvent security controls.

  ### Blind Spots and Assumptions

  Detection may have limitations due to possible obfuscation techniques used by adversaries, such as altered command-line arguments that mask intent. Reliable detection requires comprehensive logging from both process creation events and an appropriately configured Sysmon to capture additional context. Legitimate activities, such as software updates or installations by system administrators, may trigger the alert. A related detection rule for monitoring anomalous activity from `powershell.exe` can enhance coverage and provide complementary insights.

