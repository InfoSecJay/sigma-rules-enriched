logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    ParentCommandLine|contains|all:
    - 'MsiExec.exe'
    - '-Embedding '
  filter_splunk_ufw:
    Image|endswith: ':\Windows\System32\cmd.exe'
    CommandLine|contains: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_vs:
  - CommandLine|contains: '\DismFoDInstall.cmd'
  - ParentCommandLine|contains|all:
    - '\MsiExec.exe -Embedding '
    - 'Global\MSI0000'
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell or command shell processes that are initiated by `MsiExec.exe` with the `-Embedding` argument, an indicator that may signify an attempt to proxy the execution of malicious payloads. Attackers leveraging this behavior typically aim to execute unauthorized scripts or commands while evading detection mechanisms by using legitimate process names. The relevant MITRE ATT&CK tactic is Execution, with the technique ID T1218.007, indicating the misuse of process execution for potential malicious intents.

  Primary telemetry sources include Windows Process Creation logs, notably Security Event ID 4688 and Sysmon Event ID 1. The security impact of this behavior can be significant, facilitating the execution of compromised or malicious code without triggering typical defense mechanisms. However, this detection does NOT confirm malicious intent on its own, as legitimate system operations may also generate similar activity.

  ### Investigation Steps

  - **Review process creation logs**: Look for Security Event ID 4688 and Sysmon Event ID 1 to identify the creation of `powershell.exe`, `pwsh.exe`, or `cmd.exe` with `MsiExec.exe -Embedding` as the parent process. Note timestamps and user accounts involved.

  - **Validate command lines for suspicious parameters**: Check CommandLine fields for known malicious arguments or unusual script paths, such as those not associated with normal administrative tasks.

  - **Assess the legitimacy of the parent process**: Determine if `MsiExec.exe` was invoked legitimately. Review its parent process context and verify that this aligns with known application installation or update workflows.

  - **Identify high-confidence malicious indicators**: Focus on instances where the combination of `MsiExec.exe`, the specific child processes, and unusual command lines appear. For example, command lines containing obfuscated PowerShell commands indicate potential malicious behavior.

  - **Check for system impact**: Identify if the processes are running on critical systems (e.g., domain controllers, file servers) to understand the potential impact of the detected behavior.

  - **Revisit baseline activities**: Compile baseline activity logs for typical use cases involving `MsiExec.exe`, ensuring comparison against standard operational patterns to effectively discern between benign and malicious activities.

  ### Prioritization

  The alert should be categorized as medium severity. While the immediate impact on the system is not classified as high-risk, the likelihood of malicious use is notable, given that this technique is commonly weaponized to execute unwanted scripts stealthily within enterprise environments.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate administrative automation or installation processes that can trigger similar behavior. Ensuring comprehensive logging configurations, particularly for process creation, is essential to maintain reliable detection. Legitimate activity may also include regular software installations that involve `MsiExec.exe`. A related detection to consider is monitoring network connections established by `powershell.exe` or `cmd.exe` processes to strengthen coverage against the execution of malicious scripts derived from such process trees.

