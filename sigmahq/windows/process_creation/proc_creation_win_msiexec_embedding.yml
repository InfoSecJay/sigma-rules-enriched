logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    ParentCommandLine|contains|all:
    - 'MsiExec.exe'
    - '-Embedding '
  filter_splunk_ufw:
    Image|endswith: ':\Windows\System32\cmd.exe'
    CommandLine|contains: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_vs:
  - CommandLine|contains: '\DismFoDInstall.cmd'
  - ParentCommandLine|contains|all:
    - '\MsiExec.exe -Embedding '
    - 'Global\MSI0000'
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where `msiexec.exe` is used as a parent process to launch potentially malicious commands through `powershell.exe`, `pwsh.exe`, or `cmd.exe` with the `-Embedding` argument. The likely attacker objective is to execute malicious payloads under the guise of legitimate command executions, allowing for evasion of security controls. This behavior aligns with the MITRE ATT&CK technique **T1218.007** (Signed Binary Proxy Execution: MSI Executable).

  The primary telemetry sources include Windows process creation events, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, capturing process and command-line activities. The security impact can be significant if exploited, as it may indicate a compromised system executing unauthorized actions. It’s important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to understand the context and legitimacy of the actions being taken.

  ### Investigation Steps

  - **Review process creation events:** Look for **Security Event ID 4688** or **Sysmon Event ID 1** to identify the execution of `msiexec.exe` as a parent process. Validate the command-line arguments present at the time of process creation.

  - **Analyze command-line arguments:** Focus on any command lines that include `-Embedding` and follow them to see what subsequent processes were initiated. For instance, look for `cmd.exe` or `powershell.exe` with similar parameters that could indicate suspicious activity.

  - **Identify legitimate use cases:** Check for documentation or internal knowledge regarding the use of `msiexec.exe` in software deployments or updates to ascertain baseline behavior. For example, `msiexec.exe` might be legitimately used to install software packages.

  - **Assess for high-confidence malicious indicators:** Search for instances where `powershell.exe` or `cmd.exe` directly follows `msiexec.exe` in process creation logs with additional parameters indicating unusual behavior, such as those involving obfuscation or network connections.

  - **Check for file creation or extraction artifacts:** Investigate if any files were created or transferred to the system around the time of the alert, especially executable files pulled from unusual locations. Use file system auditing or logs from **Windows Defender** to examine potential malware indicators.

  - **Correlate with user activity:** Review user behavior associated with the alerting event, assessing whether an authorized user executed the command or if there are discrepancies with user permissions and roles that could indicate compromised accounts.

  ### Prioritization

  This alert should be classified with medium severity due to the potential for a compromised system and the use of a common utility by attackers. The likelihood of abuse is moderate; while `msiexec.exe` can be abused, its legitimate use is also commonplace. Nevertheless, this behavior is often weaponized in targeted attacks, so timely investigation is essential.

  ### Blind Spots and Assumptions

  Detection may face limitations if the logging level is insufficient, as evasion techniques could involve obfuscation or alternate execution methods outside of the monitored processes. Legitimate software installations or updates using `msiexec.exe` may also trigger the alert, potentially leading to false positives. Additionally, monitoring for related techniques such as **T1059** (Command-Line Interface) could reinforce detection efforts and provide broader coverage against similar tactics.

