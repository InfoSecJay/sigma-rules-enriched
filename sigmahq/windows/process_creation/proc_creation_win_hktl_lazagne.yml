level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of LaZagne, a tool commonly used for extracting various stored passwords from local systems. Attackers may leverage LaZagne during post-exploitation phases to harvest sensitive credentials and further infiltrate a network. Given its functionality, LaZagne is often utilized as part of more extensive attacks, allowing threat actors to escalate privileges or move laterally across environments.

  The relevant MITRE ATT&CK tactics for this detection include **Credential Access** (TA0006), particularly focusing on techniques such as **Credential Dumping** (T1003). By executing tools like LaZagne, attackers aim to gain unauthorized access to sensitive information, potentially compromising entire organizational accounts and systems.

  The primary data sources for effective detection of this activity are **Windows process creation events**, as they provide valuable context on executed command lines and image paths. These logs can help identify unauthorized tools being run on endpoints and their associated arguments.

  ### Investigation Steps
  - **Review Process Creation Events**: Check Windows security logs for any process creation events involving 'lazagne.exe'. Pay particular attention to unusual locations or command-line parameters indicating potential misuse.

  - **Analyze System Logs**: Look into system logs to gather context on the circumstances surrounding the execution of LaZagne. Determine if there were prior credentials theft indicators or lateral movement attempts.

  - **Identify Related Artifacts**: Search for additional artifacts, such as leftover files, logs, or temporary files that LaZagne may have created during execution. These could indicate the tool's usage and the extent of credential harvesting.

  - **Monitor User Behavior**: Investigate the account under which LaZagne was executed for unusual or suspicious actions leading up to the event. Cross-reference against user behavior analytics to identify anomalies.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of LaZagne's usage on credential theft and subsequent account compromise. The likelihood of its occurrence in enterprise environments, especially where sensitive credentials are stored, necessitates timely investigation and response to prevent further exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may vary based on endpoint configurations and the presence of logging. The detection logic assumes all relevant logs are enabled and properly configured to capture process creation events. There may be gaps in visibility if LaZagne is run from unconventional locations or under conditions not captured in the defined selections. Additionally, tools with similar command line flags may generate false positives, which should be accounted for during alert evaluation.

