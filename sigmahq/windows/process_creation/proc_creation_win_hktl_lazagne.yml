level: medium
note: |
  ### Technical Context

  This rule detects the execution of LaZagne, a widely used credential dumping tool that retrieves various passwords stored on a local computer. The likely attacker objective is to extract sensitive credentials to facilitate further attacks, such as unauthorized access to systems or lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique **Credential Dumping (T1003)**.

  The primary telemetry source is Windows process creation logs, specifically from Event ID 4688, which tracks new process instances. If malicious, the security impact is significant, as it could indicate a serious breach of credentials, leading to account compromise and loss of integrity across the enterprise. It is critical to note that this detection does NOT confirm that credentials have been successfully extracted or used; it merely indicates that LaZagne has run.

  ### Investigation Steps

  - **Verify process execution details:** Review Windows Event ID 4688 logs to confirm the process details of `lazagne.exe`. Look specifically for parent processes, command line arguments, and initiated by user accounts that should not typically run such tools.

  - **Check command line arguments for malicious intent:** Validate the command line used with `lazagne.exe`. Malicious executions often contain flags like `-1Password`, `-keepass`, or `-outlook`. Identify any unusual usage patterns by legitimate users.

  - **Identify user permissions and roles:** Confirm whether the executing user account has permission to run LaZagne. Legitimate users, especially in non-technical roles, should not have this utility in their execution history.

  - **Cross-reference with scheduled tasks:** Investigate if there are any scheduled tasks (Event ID 4698) that are creating a path for the execution of `lazagne.exe`. Legitimate tasks typically do not involve credential dumping utilities, which can be strong indicators of potential compromise.

  - **Look for associated file creations or modifications:** Check for any newly created files or any modifications in directories like `C:\Temp\` or `C:\Users\<username>\Downloads\` that could indicate LaZagne output. This may include file types associated with credential dumps (e.g., `.txt`, `.log`).

  - **Monitor for common legitimate activity:** Review whether the user’s account is involved in legitimate password retrieval scenarios, such as system maintenance or application debugging, which could involve other credential management tools.

  ### Prioritization

  The alert is medium priority due to the significant potential security impact if malicious, particularly if it is executed on a critical system or user account with elevated privileges. However, LaZagne is often found in benign contexts, so a thorough investigation is essential before escalating the alert.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from other applications utilizing similar command line structures, which may lead to misinterpretation of legitimate activities. Reliable detection requires appropriate logging configurations to capture Event ID 4688 effectively. Legitimate administrative tasks, or development environments where credential retrieval is part of the workflow, may also trigger this alert. A related detection to strengthen coverage includes monitoring for PowerShell activity indicative of credential clearance or extraction attempts using script-based techniques.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
