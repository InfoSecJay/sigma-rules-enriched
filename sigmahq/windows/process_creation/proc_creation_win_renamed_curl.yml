note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed version of the common command-line tool `CURL.exe` by analyzing specific PE metadata fields. Attackers often rename this legitimate tool to bypass security controls and use it for data exfiltration or command-and-control (C2) communications. The behavior falls under the MITRE ATT&CK tactics of Execution (T1202) and Defense Evasion (T1059). The primary telemetry source is Windows Process Creation events, specifically focusing on fields such as `OriginalFileName` and `Description`. If malicious, this activity may indicate exploitation of systems for unauthorized data access or manipulation. However, this detection does NOT confirm that the execution is indeed malicious; legitimate uses of `CURL` for valid network requests are also common.

  ### Investigation Steps

  - **Check Process Creation Logs:**
    Review Windows Security Event ID 4688 for new process creation involving `curl.exe`. Focus on the `New_Process_Name` field to verify the invocation path and ensure the binary has not been legitimately renamed by a trusted application.

  - **Analyze Process Metadata:**
    Examine PE metadata for the running process using Sysinternals tools (like Process Explorer). Check that `OriginalFileName` indeed shows 'curl.exe' and `Description` contains 'The curl executable', confirming alignment with typical `CURL` binaries.

  - **Identify Contextual Usage:**
    Assess the command-line arguments used when `CURL` was executed by reviewing the `CommandLine` field within Event ID 4688. Legitimate usage often includes specific flags of known services (e.g., requesting APIs), while arguments for unusual network endpoints or encoded payloads are suspicious.

  - **Correlate Network Activity:**
    Investigate associated network connections via Windows Firewall logs (Event ID 5156). Look for suspicious outbound IP addresses or domains, as misused `CURL` executes network requests to external entities, indicative of potential exfiltration.

  - **Review User Context:**
    Analyze the `SubjectUserName` and `SubjectDomainName` in Event ID 4688. If `CURL` was executed by a user account with administrative privileges, consider this a higher risk; benign users typically do not invoke `CURL` unless explicitly performing development tasks.

  - **Validate File Artifacts:**
    Check for any potential files created or modified during the same time frame, particularly in directories where `CURL` is expected to operate. Look for anomalous file creations that could indicate downloaded payloads or exfiltrated data due to misuse.

  ### Prioritization

  This alert should be treated with medium severity, particularly in enterprise environments where sensitive data resides. The presence of a renamed `CURL.exe` could indicate intentions to exfiltrate data or perform network reconnaissance. Such behaviors are known to be weaponized by various threat actor groups.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as further renaming or obfuscating `CURL`. Ensure that logging for both process creation and network activity is enabled across all hosts for reliable detection. Legitimate instances might trigger this alert, such as software deployments that include `CURL`, requiring context-based analysis. A related detection that strengthens coverage would involve monitoring for abnormal command-and-control patterns and other potentially malicious CLI execution patterns.

