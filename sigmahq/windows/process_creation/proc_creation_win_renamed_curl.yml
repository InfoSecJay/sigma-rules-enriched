note: |
  ---

  ### Technical Context

  This rule detects the execution of a renamed instance of the "curl.exe" binary, which is often utilized by adversaries for data exfiltration, command-and-control (C2) communications, and payload delivery. The likely attacker objective is to evade detection by using a legitimate utility in a non-standard form or path. This behavior corresponds to the MITRE ATT&CK technique for Command-Line Interface (T1059) and may also relate to Defense Evasion (T1202). The primary telemetry sources include Windows process creation logs, specifically tracking Security Event ID 4688 and Sysmon Event ID 1, which capture details about newly created processes.

  If malicious, this activity could indicate unauthorized data transfer or system compromise. However, this detection does NOT confirm that the activity is malicious on its own; further investigation is necessary to determine the context and intent of the execution.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for the execution of renamed `curl.exe`. Look for process command lines that show unusual parameters or network connections.

  - **Identify unusual parent processes:** Investigate the ParentProcessId field in Event ID 4688 logs. Legitimate instances typically have known parent processes like cmd.exe or powershell.exe; any unexpected or malicious parent processes should be escalated.

  - **Check network activity:** Analyze outbound traffic logs to identify connections made after the execution of the renamed `curl.exe`. Look for unusual IP addresses or domains contacted and any HTTP methods (such as POST) that indicate potential data exfiltration.

  - **Correlate with other security alerts:** Look for other alerts or logs around the same time frame, such as unauthorized account login attempts or file access. This can provide insight into whether this activity is part of a broader attack scenario.

  - **Evaluate executable's file origin:** Use file properties to ensure the renamed `curl.exe` is not from a non-trusted source. Check for suspicious timestamps and compare file hashes against known good hashes for `curl.exe`.

  - **Check for persistence mechanisms:** Investigate if there are scripts or scheduled tasks created that involve the renamed `curl.exe` binary. Legitimate use typically does not involve persistence setup.

  ---

  ### Prioritization

  Alerts generated by the execution of renamed `curl.exe` binaries should be treated as medium severity. While executing `curl.exe` may not itself be malicious, the context often indicates potential malicious usage, particularly on critical systems. This behavior is commonly weaponized in exfiltration and C2 activities, necessitating prompt investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where `curl.exe` is executed without being renamed, necessitating robust monitoring of common variant names as well. Adversaries may also use alternative file names or execute from legitimate locations to evade detection. Security logs must be properly configured to capture process creation events in detail. A companion detection rule for incoming or outgoing traffic could strengthen the coverage against data exfiltration behavior, such as monitoring for unusual DNS requests or high-volume data transfers.

