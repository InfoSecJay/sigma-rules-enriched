title: NTLM Hash Leak Via Curl NTLM Authentication
id: 916eb839-895e-47f8-99ee-3008bf377a3e
status: test
description: |
  Detects the use of curl with NTLM authentication and empty credentials (-u :), which can be abused to leak the currently logged-in user's NTLMv2 challenge-response to an
  attacker-controlled server, enabling offline cracking or relay attacks.
  When no credentials are provided, the Microsoft-shipped curl passes a NULL identity to Windows SSPI, which automatically falls back to the current user's logon session credentials
  stored in LSASS — without requiring a plaintext password.
  This behavior is exclusive to the curl binary shipped by Microsoft (available since Windows 10 / Windows Server 2019), which is built with SSPI support.
references:
- https://github.com/curl/curl/blob/master/lib/vauth/ntlm_sspi.c#L128-L140
- https://learn.microsoft.com/en-us/windows/win32/secauthn/acquirecredentialshandle--ntlm
- https://curl.se/docs/manpage.html#--ntlm
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-06-04
tags:
- attack.credential-access
- attack.t1187
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_ntlm_flag:
    CommandLine|contains: '--ntlm'
  selection_empty_creds:
    CommandLine|re: '(?i)\s(-u|--user)\s*:'
  condition: all of selection_*
falsepositives:
- Should be very rare as it's not widely known or used, but could occur in 
  legitimate use cases where curl is used with NTLM authentication and empty 
  credentials, such as in certain scripts or automation tasks.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_ntlm_hash_leak_attempt/info.yml
note: |
  ### Technical Context

  This rule detects the use of the curl command with NTLM authentication initiated without providing any credentials (i.e., using `-u :`). This behavior allows a potential attacker to exploit the current user's NTLMv2 challenge-response stored in LSASS to attempt offline cracking or perform relay attacks. The likely attacker objective is to capture sensitive credentials without needing direct access to plaintext passwords.

  The relevant MITRE ATT&CK technique is Credential Access via NTLM (T1187). Primary telemetry sources include Windows process creation events, specifically Process Creation logs with Event ID 4688. If an attacker successfully exploits this behavior, it could lead to unauthorized access and privilege escalation within the environment. However, this detection does NOT confirm that a compromise has occurred; it only indicates a potentially risky command execution that warrants further investigation.

  ### Investigation Steps

  - **Identify the process execution context**: Check for Event ID 4688 for the `curl.exe` process. Note the User and CommandLine fields. Look for timestamps and verify the executing user’s context to understand the origin of the command.

  - **Examine command-line arguments**: Focus on the CommandLine field in Event ID 4688. Legitimate curl usage typically accompanies a valid set of credentials or other authentication methods. Any invocation with `-u :` indicates immediate investigation as it leverages NTLM without a password.

  - **Assess user activity**: Query User logon events (Event ID 4624) around the same timestamp to determine if this command was run by a legitimate user, and correlate the user’s activities to identify unusual behavior patterns.

  - **Look for network connections**: Using network logs, particularly from a proxy or firewall that logs outgoing connections, identify any connections to external servers created by curl in conjunction with the credential leak. Look for DNS queries or IP addresses contacted for potential known malicious servers.

  - **Check for legitimate use cases**: Review any documented automation or scripting that uses curl with NTLM authentication for valid operations within your organization's environment, to differentiate benign uses.

  - **Document high-confidence malicious indicators**: Look for the presence of command-line strings that include `-u :` and correlate them with abnormal outbound network activity; an outlier in both could suggest exploitation.

  ### Prioritization

  This alert is classified as high severity due to the potential security impact of NTLM hash leakage which can lead to compromised credentials and further exploits within the enterprise. The risk is elevated as the usage of curl in this manner is not common and indicates potential malicious behavior targeting sensitive information.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of comprehensive logging configurations, especially if process creation logs are not enabled or insufficient network logging is present. Legitimate administrative scripts or automated tasks may mistakenly trigger this alert under rare conditions. A companion detection could involve monitoring for unusual outgoing network traffic patterns to quickly correlate and strengthen the context of the potential compromise while evaluating other credential access techniques like SMB relay attacks.

