logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\fsutil.exe'
  - OriginalFileName: 'fsutil.exe'
  selection_cli:
    CommandLine|contains:
    - 'deletejournal'                # usn deletejournal ==> generally ransomware or attacker
    - 'createjournal'                # usn createjournal ==> can modify config to set it to a tiny size
    - 'setZeroData'                  # file setZeroData  ==> empties a file with zeroes
  condition: all of selection_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_fsutil_usage/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious invocations of the `fsutil.exe` utility, specifically looking for command-line parameters that may indicate malicious intent, such as deleting or creating the USN journal with parameters that could facilitate data obfuscation or ransomware activities. An attacker might aim to manipulate file system behaviors to evade detection or prepare a system for ransomware deployment.

  Relevant MITRE ATT&CK tactics include **Impact (TA0040)**, specifically **Data Destruction (T1485)** and **Indicator Removal on Host (T1070)**. The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command-line arguments associated with `fsutil.exe`. If the behavior is confirmed as malicious, it can lead to significant data loss or system compromise. Importantly, this detection alone does not confirm compromise; legitimate administrative activities may also invoke these commands.

  ### Investigation Steps

  - **Review command execution details:** Check process creation events such as Security Event ID 4688 or Sysmon Event ID 1 for instances of `fsutil.exe` with parameters like `deletejournal`, `createjournal`, or `setZeroData`. Legitimate commands from trusted administrators may include options such as `getVolumeInformation`.

  - **Analyze the context of execution:** Validate the user account that executed the command. Administrators performing routine maintenance may trigger these commands; however, execution by non-administrative users or in unusual time frames (off-hours) could indicate malicious activity.

  - **Correlate with other logs:** Check for associated logs within a defined timeframe (e.g., last 1 hour) from the Windows Event Logs for any abnormal activity, focusing on potential ransomware indicators such as file creation or modification patterns during the execution of the `fsutil.exe`.

  - **Identify high-confidence malicious indicators:** Look for specific process parent-child relationships, for instance, if a child process of `fsutil.exe` is spawned by a suspicious parent process like `cmd.exe` (Security Event ID 4688), especially if there are indications this parent process is linked to known malware.

  - **Assess environmental impact:** Evaluate the affected system's role. If it’s a critical server, escalated measures may be necessary. Highlight any ongoing legitimate operations in the environment that could potentially trigger this detection.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on system integrity and data confidentiality. Systems involved in such activities could be critical infrastructure, making them highly attractive for adversaries seeking to deploy ransomware or erase digital footprints. The existence of known ransomware tactics utilizing `fsutil.exe` heightens the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker employs known whitelisting or renaming techniques for `fsutil.exe`. It relies on the proper configuration of telemetry sources, such as enabling Sysmon for process creation logging. Legitimate administrative tasks, like system maintenance or performance tuning, may also inadvertently trigger this alert. A related detection includes monitoring for known ransomware signatures or behaviors that involve data encryption post `fsutil.exe` usage to strengthen overall coverage.

