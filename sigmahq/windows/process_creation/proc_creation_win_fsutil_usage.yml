detection:
  selection_img:
  - Image|endswith: '\fsutil.exe'
  - OriginalFileName: 'fsutil.exe'
  selection_cli:
    CommandLine|contains:
    - 'deletejournal'                # usn deletejournal ==> generally ransomware or attacker
    - 'createjournal'                # usn createjournal ==> can modify config to set it to a tiny size
    - 'setZeroData'                  # file setZeroData  ==> empties a file with zeroes
  condition: all of selection_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `fsutil.exe` with parameters that suggest malicious intent, specifically focusing on commands associated with the deletion or manipulation of the USN Journal. This behavior aligns with attacker objectives such as data destruction or obfuscation during ransomware attacks, as evidenced by tactics employed by malware like NotPetya. The relevant MITRE ATT&CK tactic is “Defense Evasion” (T1070), and techniques include “Indicator Removal on Host” (T1070) and “Data Encrypted for Impact” (T1485).

  The primary telemetry source for this detection is process creation logs, particularly from Windows, capturing execution details of `fsutil.exe`. If successfully malicious, these actions could facilitate extensive data loss or compromise machine integrity. It is important to note that this detection does NOT confirm that an attack is occurring; the presence of `fsutil` commands could also result from legitimate administrative tasks.

  ### Investigation Steps

  - **Examine process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `fsutil.exe` being invoked. Note specific command line arguments to discern potential malicious patterns.

  - **Identify suspicious parameters:** Look for command-line arguments like `deletejournal`, `createjournal`, or `setZeroData`. Malicious indicators include the use of `deletejournal`, which is often linked with ransomware operations.

  - **Validate legitimate activity:** Compare current activity against known administrative tasks. For example, legitimate use might include a system administrator using `createjournal` for routine maintenance, not accompanied by suspicious processes.

  - **Analyze the timing and frequency:** Investigate patterns of execution around the time of the alert. Look for unusual frequency or sudden spikes in `fsutil` commands, potentially indicating malicious automation.

  - **Review system logs for other anomalies:** Correlate with other logs (e.g., Windows Event Logs, Sysmon logs) for any abnormal system behavior in conjunction with `fsutil` command execution, such as unexpected file modifications.

  - **Check for related processes:** Cross-reference other processes that appear in conjunction with `fsutil.exe`. Malicious activity may correlate with processes known for ransomware behavior, such as `notepad.exe` or other file manipulation processes.

  ### Prioritization

  The severity of this alert is high due to the sensitive nature of the affected systems and the potential for widespread impact through data destruction or loss. The likelihood of malicious exploitation is significant, especially given established patterns of behavior in ransomware attacks. This behavior has a historical precedent in targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by benign administrative activities that utilize `fsutil.exe` for legitimate system management. It is critical to ensure that process creation logging is comprehensive and includes appropriate command-line details for reliable detection. Common evasion techniques may include using alternative tools with similar functionality or obscuring command arguments. Related detections, such as monitoring for script execution or file integrity changes, can strengthen overall coverage against these malicious behaviors.

