logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\fsutil.exe'
  - OriginalFileName: 'fsutil.exe'
  selection_cli:
    CommandLine|contains:
    - 'deletejournal'                # usn deletejournal ==> generally ransomware or attacker
    - 'createjournal'                # usn createjournal ==> can modify config to set it to a tiny size
    - 'setZeroData'                  # file setZeroData  ==> empties a file with zeroes
  condition: all of selection_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
level: high
note: |
  ### Technical Context

  This detection identifies the usage of `fsutil.exe` with suspicious command-line parameters that are commonly associated with malicious activity, particularly by ransomware. Behaviors such as deleting the USN journal, creating a USN journal with a minimal size, or using the `setZeroData` command can indicate an attempt to hinder recovery efforts or destroy data for an extortion goal. The primary tactics involved in this behavior are **Impact (TA0040)** and **Stealth (TA0005)**, associated with techniques such as **T1070.001 - Indicator Removal on Host** and **T1485 - Data Destruction**.

  The primary telemetry source includes Windows process creation logs, specifically looking for Event ID **4688** (Process Creation) where the event contains data on the invocation of `fsutil.exe`. If these commands are malicious, they can severely impact data recovery processes and compromise system integrity. However, this detection does NOT confirm that an infection has occurred; it merely indicates potentially dangerous command usage.

  ### Investigation Steps

  - **Review the command line arguments**: Check Event ID **4688** for process creation logs that show `fsutil.exe` along with parameters like `deletejournal`, `createjournal`, and `setZeroData`. If these parameters are present without corresponding administrative justification, they should be treated as suspicious.

  - **Analyze the user context**: Determine the user account executing `fsutil.exe`. If it is a high-privilege account performing unexpected actions (like deleting the USN journal), this could indicate malicious intent. Verify the legitimacy of administrative actions and cross-reference with change management records.

  - **Identify system role impact**: Assess the asset in question. A file server or domain controller is more critical than a desktop; thus, detection in sensitive environments should be prioritized. Look for logs indicating other critical changes within the same timeframe (such as file deletions).

  - **Correlate with known baselines**: Compare recent `fsutil.exe` executions with historical benign use cases in your environment (i.e., routine administrative tasks). Legitimate uses often include known scripts or scheduled tasks that document their behavior.

  - **Look for accompanying malicious artifacts**: Check for related file creation or alteration events around the time of invocation. Use Event ID **4656** for file access attempts, particularly around critical files and directories during the same session as the `fsutil.exe` invocation.

  ### Prioritization

  This alert represents a **high severity**, as it can indicate an immediate risk to data integrity and potential ransomware deployment. The misuse of `fsutil.exe` is often seen in active attacks and may lead to irreversible data loss. Therefore, analysts should treat this alert with urgency, especially in environments handling sensitive information.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that use `fsutil.exe`, including IT maintenance operations. Ensure logging is configured to capture the necessary process creation events (Event ID 4688) for comprehensive visibility. Valid administrative use of `fsutil.exe` may trigger this alert when executed by trusted personnel. A related detection to consider is monitoring for **Backup Software Operations (T1481)**, which can help consolidate threat visibility regarding any potential evasion tactics through legitimate administrative tasks.

