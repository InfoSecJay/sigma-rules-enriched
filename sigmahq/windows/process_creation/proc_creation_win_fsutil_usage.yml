logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\fsutil.exe'
  - OriginalFileName: 'fsutil.exe'
  selection_cli:
    CommandLine|contains:
    - 'deletejournal'                # usn deletejournal ==> generally ransomware or attacker
    - 'createjournal'                # usn createjournal ==> can modify config to set it to a tiny size
    - 'setZeroData'                  # file setZeroData  ==> empties a file with zeroes
  condition: all of selection_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
level: high
note: |
  ### Technical Context
  This detection rule identifies anomalous invocations of the `fsutil.exe` utility, specifically targeting actions that involve deleting or modifying the USN journal. Such operations are often associated with malicious activities, particularly by ransomware variants like NotPetya, which manipulate file system records to obfuscate their actions and hinder recovery efforts. Attackers may seek to erase traces of their malicious activities from the file system, aiding in their objectives of data destruction or extortion.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1070)**, which encompasses methods to conceal activity, and **Impact (T1485)**, representing actions targeting data destruction or corruption. The primary data sources for this detection are **process creation logs**, which capture command-line arguments and the execution context of processes on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `fsutil.exe` being executed, focusing on command line arguments that suggest malicious activity, such as `deletejournal`, `createjournal`, and `setZeroData`.

  - **Verify User Context:** Confirm whether the user account executing the command has administrative privileges. Suspicious elevated commands from atypical accounts may indicate a compromised system.

  - **Correlate with Other Artifacts:** Look for correlating events, including file modifications or deletions shortly after the `fsutil` command's execution, to detect potential ransomware activity.

  - **Investigate Anomalous Behavior:** Check for patterns associated with known ransomware behaviors, such as rapid file encryption or unexpected system restarts following the execution of `fsutil` commands.

  ### Prioritization
  This alert should be prioritized as high severity due to the potential for significant impact on data integrity and availability within the enterprise. Ransomware attacks can lead to substantial downtime and data loss, making immediate investigation critical.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from legitimate administrative activities that utilize `fsutil.exe` for maintenance or configuration changes, leading to potential false positives. The detection logic assumes that all occurrences of the specified command-line parameters are malicious; however, there could be valid use cases in the environment. Additionally, uninterrupted logging of process creation events is essential for this alert to function effectively, as any gap in these logs could obscure malicious activity.

