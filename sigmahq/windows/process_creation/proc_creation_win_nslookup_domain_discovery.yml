note: |
  ### Technical Context
  This rule is designed to detect reconnaissance activities within a network that utilize specific command-line arguments indicative of network enumeration. It primarily focuses on the use of the `nslookup` command, particularly with the `_ldap._tcp.dc._msdcs.` query, which indicates an attempt to discover Domain Controllers (DCs) in a Windows Active Directory environment. Attackers frequently employ these reconnaissance techniques to gather information about network resources, aiming to identify possible targets for subsequent attacks.

  The threat scenario typically involves an adversary performing reconnaissance to map the network infrastructure and understand the Active Directory layout. Their objectives may include identifying users, groups, and devices, as well as locating key services that could be leveraged for credential harvesting or privilege escalation. Relevant MITRE ATT&CK tactics include **Discovery** (TA0007), specifically techniques such as **Domain Information Discovery** (T1087) and **Network Service Discovery** (T1082). These tactics illustrate how actors seek to enhance their understanding of the environment before executing more disruptive or destructive actions.

  The primary data sources for detecting this activity include process creation events that log the command line arguments used when processes are executed. This allows SOC teams to scrutinize potentially malicious or unauthorized commands executed on endpoints within the network.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any instances of the `nslookup` command with the specified search string `_ldap._tcp.dc._msdcs.`. Take note of the user context and the source machine to identify unusual patterns.

  - **Correlate with Network Connectivity Logs:** Check network connectivity logs to identify subsequent connections to the discovered Domain Controllers from the source machine. Look for unusual patterns of access or traffic that follow the reconnaissance activity.

  - **Analyze Active Directory Audit Logs:** Investigate Active Directory logs for unusual account activities or authentication attempts originating from the user or machine performing the reconnaissance. This can help determine if there is a follow-on attack or credential abuse attempt.

  - **Assess Employment of Automation Tools:** Identify whether the detected commands were executed as part of scripted interactions or legitimate administrative tasks. Consider the context in which the commands were run to filter false positives linked to internal administrative processes.

  ### Prioritization
  Given the nature of reconnaissance activities, this alert is classified as high severity because successful enumeration of domain resources can lead to more serious threats, such as credential harvesting or lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection rule might miss malicious actors utilizing alternative enumeration tools or methods that do not leverage the `nslookup` command with the specified query. Additionally, it assumes that proper logging for process creation events is enabled and retained for adequate analysis. Environments with custom scripts or legitimate administrative tools employing similar commands may lead to false positives, further complicating detection. Maintaining comprehensive logging and having contextual awareness of authorized network activity are crucial for improving detection accuracy.

