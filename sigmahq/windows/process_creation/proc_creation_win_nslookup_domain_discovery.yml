note: |
  ### Technical Context

  This Sigma rule detects the use of the `nslookup` command with a specific lookup for `_ldap._tcp.dc._msdcs.`, which is often indicative of reconnaissance activity targeting Active Directory environments. The likely attacker objective is to enumerate domain controller information, which could facilitate further attacks on the network. This behavior relates to the MITRE ATT&CK tactic of Discovery (ID: TA0007) and the technique of System Information Discovery (ID: T1082) as well as Domain Services Discovery (ID: T1087). The primary telemetry source involves process creation logs specifically from Windows (Event ID 4688 or Sysmon Event ID 1). If malicious, it can lead to unauthorized information gathering and eventual compromise of network integrity. However, this detection does NOT on its own confirm an actual compromise; it could be legitimate administrative activity.

  ### Investigation Steps

  - **Review command history and user context:** Check the user account that executed the `nslookup` command for potential unauthorized access or suspicious activity. Look for unusual user behavior or accounts not typically associated with administrative tasks.

  - **Correlate with other log sources:** Look for historical usage patterns of legitimate administrative commands (e.g., consider powershell scripts or system maintenance tasks) through Security Event ID 4688, ensuring this command aligns with routine operations.

  - **Examine for additional reconnaissance commands:** Search for other discovery-related commands issued around the same time, such as `ping`, `tracert`, and `whoami` in corresponding process creation logs, which may indicate a coordinated reconnaissance effort.

  - **Identify system role and criticality:** Determine if the host executing the `nslookup` is a domain controller or high-privilege server; escalated access could mean an increased risk if the command is malicious.

  - **Look for alerts from companion detections:** Check for previously triggered alerts related to Domain Services Discovery (T1087) or System Information Discovery (T1082) within the last 72 hours to identify patterns or campaigns.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems, particularly if confirmed malicious activity is identified. The likelihood of exploitation exists, as reconnaissance stages often precede more damaging actions. This type of network enumeration is a common tactic used in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by benign administrative activities such as troubleshooting or network configuration, which can produce false positives. Effective detection relies on comprehensive logging from process creation; ensure endpoint devices are properly configured to capture these events. Legitimate tools such as network mapping utilities may trigger similar alerts. Companion detections like those for unauthorized remote access may enhance overall network security visibility.

