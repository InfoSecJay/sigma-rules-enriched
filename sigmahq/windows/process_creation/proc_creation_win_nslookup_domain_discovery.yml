note: |
  ### Technical Context

  This Sigma rule detects the execution of a command line containing `nslookup` and targeting the domain service locator `_ldap._tcp.dc._msdcs.`, which is often utilized for network reconnaissance activities. The likely attacker objective is to gather information about Active Directory structures and services to find potential targets for further exploitation. This behavior aligns with the MITRE ATT&CK technique "Domain Service Discovery" (T1087) and "Network Service Discovery" (T1082).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture details about process execution and command line arguments. If the behavior is malicious, it can lead to unauthorized access to sensitive data or systems within the network. It is important to note that this detection alone does not confirm malicious intent without additional context, such as the user's role and the typical operational environment.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `nslookup` with the command line containing '_ldap._tcp.dc._msdcs.'. Determine the user context and originating host.

  - **Identify known user behavior:** Confirm if users typically run `nslookup` commands as part of legitimate administrative activities. Benign usage may include system maintenance or troubleshooting.

  - **Correlate with Active Directory access:** Review logs from Active Directory (Event IDs 4662, 4672) to identify if there were related inquiries or changes made around the same time the detection was triggered, indicating possible unauthorized access attempts.

  - **Examine for suspicious user accounts:** Investigate the user running the command; if it is a service account or an account with recent changes in behavior relevant to reconnaissance, this may indicate a malicious vector.

  - **Assess lateral movement potential:** Identify any additional commands executed by the same process or user following the `nslookup` execution, looking for patterns of behavior indicative of network scanning or exploitation strategies.

  ### Prioritization

  This alert is of high severity due to its focus on network reconnaissance, which is a key step in many attack lifecycles. Given the common usage of such commands in data exfiltration and lateral movement, the likelihood of malicious abuse is significant, especially if it involves sensitive assets within the enterprise.

  ### Blind Spots and Assumptions

  Detecting `nslookup` alone may be limited as attackers can obfuscate their commands or utilize legitimate tools that produce similar outputs. Reliable detection requires proper configuration of logging for both process creation and Active Directory access events. Additionally, legitimate activities such as network troubleshooting by administrators or scripted tasks may trigger this alert. Related detections, such as monitoring for unusual LDAP queries or domain enumeration techniques, could enhance coverage and context around the alert.

