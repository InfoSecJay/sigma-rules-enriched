  ### Technical Context
  This detection rule identifies potential instances of a User Account Control (UAC) bypass method known as Trusted Path. The technique involves manipulating legitimate directory structures to execute malicious binaries with elevated privileges without proper authorization. Attackers leveraging this method aim to escalate privileges on Windows systems, allowing them to execute code that requires higher privileges, access sensitive data, or maintain persistence in a compromised environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Privilege Escalation** (TA0004)
  - **Bypass User Account Control** (T1548.002)

  The primary data sources for this detection rule are process creation events on Windows systems. By monitoring these logs, security analysts can identify anomalous process creation patterns that may indicate UAC bypass attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs to identify instances where processes are being launched from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`, especially under unusual user context.
  - **Analyze Command Line Arguments**: Look for unusual or suspicious command line arguments associated with processes that are known to leverage UAC bypass techniques.
  - **Cross-Reference High-Privilege Access Logs**: Check logs for privilege elevation events (e.g., local admin, SYSTEM) around the time of the detected process creation to correlate activity and establish intent.
  - **Examine Related Event IDs**: Focus on relevant Windows Event IDs (e.g., 4688 for process creation) to gather more context and verify the legitimacy of the processes identified.

  ### Prioritization
  This alert holds critical severity due to the potential impact of privilege escalation. An attacker successfully leveraging a UAC bypass could gain extensive control over the system, compromising sensitive information and security measures.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the presence of legitimate applications that could inadvertently trigger the alert, leading to false positives. The detection logic assumes that the processes utilizing the specified paths are inherently suspicious, without differentiating benign behavior. To ensure the alert functions correctly, it is essential to have comprehensive logging of process creation events enabled throughout the Windows environment and monitor the associated event logs for abnormal activities appropriately.

