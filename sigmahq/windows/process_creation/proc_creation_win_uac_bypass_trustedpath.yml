  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) by accessing system-sensitive directories through potential manipulation of those paths. An attacker may target this technique to escalate privileges on a Windows system, allowing them to execute malware or gain unauthorized access to critical system functions. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation, specifically technique T1548.002 (Bypass User Account Control).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on events related to executable images accessing the critical system directories: `C:\Windows\System32\` and `C:\Windows\SysWOW64\`. If executed with malicious intent, the impact can lead to complete control over the system and possibly the network. It is important to note that this detection alone does not conclusively indicate malicious activity; legitimate software may also access these directories during normal operations.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for new processes, focusing on the command line and associated images for paths containing `C:\Windows\System32\` or `C:\Windows\SysWOW64\`.

  - **Analyze user activity context:** Verify if the user account executing the process has administrative privileges and legitimate reasons for accessing system directories. For example, confirm if a signed system application triggered the access.

  - **Correlate with endpoint system role:** Determine if the asset (laptop, server, etc.) is critical. Sensitive systems like domain controllers or financial servers warrant a higher priority response to this alert.

  - **Identify high-confidence malicious indicators:** Look for processes spawned by known exploit tools or payloads often associated with privilege escalation (e.g., tools or hashes from the Threat Intelligence database).

  - **Investigate for other related behaviors:** Check for other exploitation patterns, like DLL hijacking attempts. Collect additional logs from Security Event ID 4697 (service creation) for unusual services being added.

  - **Cross-reference with similar alerts:** Use related detections (e.g., similar UAC bypass attempts) to build a pattern of behavior around the alert instance, confirming potential ongoing campaigns.

  ### Prioritization

  This alert carries a critical severity due to the potential for privilege escalation on systems where UAC is bypassed, increasing the risk of a successful attack. The likelihood of exploitation is moderate to high, as this method is commonly weaponized in various attack scenarios, making immediate analysis essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions that may trigger this alert when trusted applications access these directories. A comprehensive logging setup, including Sysmon with process creation events, is necessary for effective monitoring. Additionally, behavior from tools like PowerShell or Windows Management Instrumentation (WMI) could be a common benign activity that appears similar to the malicious pattern, reinforcing the need for careful context evaluation. A related detection rule for DLL hijacking would strengthen the coverage against these types of attacks.

