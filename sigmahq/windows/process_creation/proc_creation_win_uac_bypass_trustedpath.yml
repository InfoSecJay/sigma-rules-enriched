  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) mechanisms by leveraging the Windows Trusted Directory pattern. It identifies when a process is spawned from typically secure paths (e.g., `C:\Windows\System32\` or `C:\Windows\SysWOW64\`) that may indicate malicious intent to execute elevated processes under the guise of legitimate system directories. The likely attacker objective is to escalate privileges to gain unauthorized access to sensitive resources or maintain persistence.

  The relevant MITRE ATT&CK tactic is “Privilege Escalation” and the technique is “Trusted Path Evasion” (T1548.002). The primary telemetry sources required for detection are Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, this behavior could compromise system integrity and allow adversaries to perform actions with higher privilege levels. However, this detection alone does not confirm that the behavior is indeed malicious; it only indicates a potential UAC bypass attempt which necessitates further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for details of processes spawned from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Identify the process name and any parent process to understand its context.

  - **Verify expected activity:** Determine whether the process in question is a legitimate system application. Cross-reference the metadata (e.g., file path and file signature) against known safe applications or check against threat intelligence resources.

  - **Analyze command line arguments:** Examine the command-line parameters in the process creation logs for suspicious arguments or indications of attempts to evade security controls (e.g., using PowerShell scripts or other encoded commands).

  - **Identify high-confidence malicious indicators:** Look for recent or unusual activity involving these directories from non-standard applications. Notably, check for process chains (parent-child relationships) that lead to unexpected high-privilege executables or shell processes.

  - **Assess asset criticality:** Consider the role and importance of the system where the alert occurred. Elevated privileges on sensitive infrastructure (e.g., domain controllers, databases) pose a higher risk and necessitate immediate action.

  - **Review prior events:** Investigate if there were any related alerts or suspicious activities logged prior in the telemetry backlogs that may indicate preparation for the UAC bypass attempt, enhancing situational awareness.

  ### Prioritization

  This alert should be treated as critical due to its potential to grant an adversary elevated privileges on a system, which can lead to significant impacts including unauthorized data access and control over critical infrastructure. Given that UAC bypass techniques are commonly weaponized by attackers, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  This detection may not capture all UAC bypass attempts; sophisticated adversaries may use alternate or indirect methods that fall outside the targeted directory checks. Reliable detection requires proper logging configurations for both Event IDs and Sysmon levels, ensuring comprehensive process creation audibility. Moreover, legitimate administrative operations, especially during system maintenance or updates, could trigger this alert. A related detection to consider is monitoring abnormal use of administrative tools that target privileged tier processes or configurations (e.g., Event ID 7036 for service changes or Event ID 4697 for new services).

