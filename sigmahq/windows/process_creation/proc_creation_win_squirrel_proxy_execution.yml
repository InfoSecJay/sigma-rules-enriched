title: Process Proxy Execution Via Squirrel.EXE
id: 45239e6a-b035-4aaf-b339-8ad379fcb67e
related:
- id: 1e75c1cc-c5d4-42aa-ac3d-91b0b68b3b4c
  type: similar
- id: fa4b21c9-0057-4493-b289-2556416ae4d7
  type: obsolete
status: test
description: |
  Detects the usage of the "Squirrel.exe" binary to execute arbitrary processes. This binary is part of multiple Electron based software installations (Slack, Teams, Discord, etc.)
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Squirrel/
- http://www.hexacorn.com/blog/2019/03/30/sqirrel-packages-manager-as-a-lolbin-a-k-a-many-electron-apps-are-lolbins-by-default/
- http://www.hexacorn.com/blog/2018/08/16/squirrel-as-a-lolbin/
author: Nasreddine Bencherchali (Nextron Systems), Karneades / Markus Neis, Jonhnathan
  Ribeiro, oscd.community
date: 2022-06-09
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\squirrel.exe'
    - '\update.exe'
  selection_exec:
    CommandLine|contains:
    - '--processStart'
    - '--processStartAndWait'
    - '--createShortcut'
  filter_optional_discord:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Discord\Update.exe'
    - 'Discord.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStart'
  filter_optional_github_desktop:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\GitHubDesktop\Update.exe'
    - 'GitHubDesktop.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStartAndWait'
  filter_optional_teams:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\Teams\Update.exe'
    - 'Teams.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  filter_optional_yammer:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\yammerdesktop\Update.exe'
    - 'Yammer.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Expected FP with some Electron based applications such as (1Clipboard, Beaker Browser,
  Caret, Discord, GitHub Desktop, etc.)
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of arbitrary processes using `Squirrel.exe`, a binary commonly associated with Electron-based applications such as Slack, Teams, Discord, and others. Attackers may exploit this binary to execute rogue code or manipulate legitimate applications, potentially leading to unauthorized access or data exfiltration. The rule specifically looks for command-line arguments that signal irregular usage patterns of `Squirrel.exe`, indicative of potential malicious behavior.

  The threat scenario might involve an attacker leveraging the capabilities of `Squirrel.exe` to launch malware or execute scripts under the guise of legitimate application updates. This behavior can lead to the execution of payloads or further compromise of the system. Relevant MITRE ATT&CK tactics/techniques include **Execution (T1203)**, where untrusted code execution occurs, and **Defense Evasion (T1218)**, as the usage of a legitimate binary to execute commands can evade standard detection.

  To effectively gather evidence for this investigation, the primary data source will be process creation events from Windows systems, which will provide insights into which binaries are being executed and with what parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Begin by checking the process creation logs for entries containing `squirrel.exe` to identify its execution context, including the parent process and user account associated with the execution.
  - **Analyze Command-Line Arguments**: Focus on the command line of the detected `squirrel.exe` executions. Look for unusual parameters like `--processStart`, `--processStartAndWait`, or `--createShortcut` that indicate suspicious behavior, particularly those resulting in the execution of unexpected applications.
  - **Correlate with Application Installations**: Determine whether the detected instances align with known legitimate installations of Electron applications. Check the paths and users involved to validate the context—if they originate from non-standard directories, further investigation may be warranted.
  - **Conduct File System Analysis**: Investigate the file system for anomalies associated with the identified processes, specifically look for unexpected binaries in the application data directories (e.g., `%AppData%` paths) related to identified Electron applications.

  ### Prioritization
  The alert should be considered medium severity as it indicates a potentially abnormal use of a common binary that can lead to serious compromises. The likelihood of misuse is notable given the increasing adoption of Electron applications in corporate environments.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage for legitimate uses of `Squirrel.exe`, which could lead to false positives, especially for enterprise environments using multiple Electron applications. The detection rule assumes that only malicious or problematic executions will trigger alerts, neglecting benign use cases. Access to detailed Windows process creation logs is essential for this detection rule to function effectively, and proper configurations should ensure that these logs are being collected and monitored. Additionally, variations in legitimate software usage might result in false positives, necessitating continuous refinement of the detection logic.

