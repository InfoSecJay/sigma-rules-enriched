logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\squirrel.exe'
    - '\update.exe'
  selection_exec:
    CommandLine|contains:
    - '--processStart'
    - '--processStartAndWait'
    - '--createShortcut'
  filter_optional_discord:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Discord\Update.exe'
    - 'Discord.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStart'
  filter_optional_github_desktop:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\GitHubDesktop\Update.exe'
    - 'GitHubDesktop.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStartAndWait'
  filter_optional_teams:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\Teams\Update.exe'
    - 'Teams.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  filter_optional_yammer:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\yammerdesktop\Update.exe'
    - 'Yammer.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Expected FP with some Electron based applications such as (1Clipboard, Beaker Browser,
  Caret, Discord, GitHub Desktop, etc.)
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of potentially malicious commands through the "Squirrel.exe" binary, often leveraged by various Electron-based applications. Attackers may use this binary to execute arbitrary processes, which could indicate attempts at lateral movement or establishing persistence within the environment. The relevant MITRE ATT&CK tactic is Execution (TA0002), and the technique is Application Layer Protocol (T1218).

  Primary telemetry sources include process creation logs from Windows Event ID 4688 and Sysmon Event ID 1, capturing details on process execution. If the behavior originates from a non-trusted source or targets sensitive assets, the security impact could be severe, leading to data exfiltration or exploitation of critical systems. This detection does not confirm malicious intent on its own, as legitimate applications frequently utilize Squirrel.exe for updating components.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for occurrences of "Squirrel.exe" or "Update.exe" in the Image field, filtering by the relevant User SID to identify potential actor accounts.

  - **Analyze command-line parameters:** Focus on logs where CommandLine contains '--processStart', '--processStartAndWait', or '--createShortcut'. Malicious indicators typically involve parameters suggesting execution of unrecognized or suspicious .exe files.

  - **Compare with benign behavior:** Identify if "Squirrel.exe" is being called during software update processes from known good applications (e.g., Discord, GitHub Desktop, Microsoft Teams). Legitimate calls should originate from C:\Users\<username>\AppData\Local\<appname>\.

  - **Evaluate parent process relationships:** Investigate the ParentImage in the process creation logs. Look for trusted parent processes associated with Squirrel.exe to distinguish potential malicious execution attempts from legitimate updates.

  - **Correlate with other alerts:** Cross-reference the execution of Squirrel.exe with any existing alerts regarding known malicious patterns or behavior. This can surface further indicators of compromise.

  - **Confirm asset sensitivity:** If this detection occurs on high-value assets (e.g., domain controllers, databases), prioritize further investigation to determine the nature of the command and its potential impact on the environment.

  ---

  ### Prioritization

  Given that Squirrel.exe is often exploited for payload execution, any alerts stemming from its usage should be treated with medium severity in an enterprise context. The likelihood of malicious abuse is reasonable, particularly in environments utilizing multiple Electron applications, where such behavior could be weaponized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of scriptable benign use of Squirrel.exe due to its legitimate role in software updates, which could lead to false positives—especially with common applications like Discord and GitHub Desktop. Required log sources include detailed process creation telemetry with command-line parameters. Related detections may include monitoring of AppData directories for changes, enhancing the overall coverage against potential misuse of this binary.

