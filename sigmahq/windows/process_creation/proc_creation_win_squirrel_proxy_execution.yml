logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\squirrel.exe'
    - '\update.exe'
  selection_exec:
    CommandLine|contains:
    - '--processStart'
    - '--processStartAndWait'
    - '--createShortcut'
  filter_optional_discord:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Discord\Update.exe'
    - 'Discord.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStart'
  filter_optional_github_desktop:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\GitHubDesktop\Update.exe'
    - 'GitHubDesktop.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStartAndWait'
  filter_optional_teams:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\Teams\Update.exe'
    - 'Teams.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  filter_optional_yammer:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\yammerdesktop\Update.exe'
    - 'Yammer.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Expected FP with some Electron based applications such as (1Clipboard, Beaker 
  Browser, Caret, Discord, GitHub Desktop, etc.)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of arbitrary processes via the `squirrel.exe` binary, commonly used in Electron-based applications like Slack, Discord, Teams, and others. The likely attacker objective is to execute malicious payloads under the guise of these legitimate applications, leveraging the trusted nature of `squirrel.exe`. This behavior aligns with MITRE ATT&CK Tactic: Execution (TA0002), Technique: User Execution (T1203).

  The primary telemetry source is process creation logs from Windows (Event ID 4688 or Sysmon Event ID 1), which track command line arguments and process details. If malicious, the impact could be significant as it allows adversaries to run their own code remotely. Importantly, this detection does NOT confirm malicious intent on its own; it merely indicates that the `squirrel.exe` binary executed with specified arguments, warranting further investigation.

  ### Investigation Steps

  - **Check process details:** Gather information on the process using Event ID 4688. Look for command line arguments containing `--processStart` or `--createShortcut`, as these are indicative of potentially malicious behavior.

  - **Correlate user activity:** Investigate the user associated with the process execution. Review recent user activity logs (e.g., logon events - Event ID 4624) to see if the user typically interacts with the applications involved (e.g., Discord, Teams).

  - **Identify high-confidence malicious indicators:** Focus on command lines that include unwanted or unexpected arguments with `squirrel.exe`. If the command contains both `--processStart` and paths that do not match common application directories (like the ones mentioned), it may suggest malicious activity.

  - **Review application installation sources:** Validate that the detected application is from a legitimate source. Check application installation logs (e.g., MSI logs) for the applications like Discord or Teams to confirm that they were properly installed through expected channels.

  - **Determine expected behavior:** Identify legitimate running instances of Electron apps. Process executions of `squirrel.exe` associated with user sessions and genuine application updates typically show only narrow command lines without unexpected arguments.

  - **Search for file creation artifacts:** Use Sysmon logs to check for file creation events (Event ID 11) that coincide with the executions. Look for any unusual file paths or names created in the AppData directory, which could indicate that code was executed maliciously.

  ### Prioritization

  This alert is medium severity due to its potential impact, especially if an attacker exploits a trusted application to execute malicious processes. The likelihood of abuse is moderate, as attackers often leverage such methods, but it is also common for legitimate applications to exhibit this traffic due to their architecture.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through command line obfuscation or the use of benign processes also utilizing `squirrel.exe`. Successful detection relies on proper configuration of logging for both process creation and application access. Legitimate activities may trigger this alert, particularly updates or user actions in popular Electron-based applications. A related detection to strengthen coverage is monitoring for unusual process trees that feature `squirrel.exe` invoking child processes without apparent user interaction.

