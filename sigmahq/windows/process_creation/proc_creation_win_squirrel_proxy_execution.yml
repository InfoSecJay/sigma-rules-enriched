logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\squirrel.exe'
    - '\update.exe'
  selection_exec:
    CommandLine|contains:
    - '--processStart'
    - '--processStartAndWait'
    - '--createShortcut'
  filter_optional_discord:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Discord\Update.exe'
    - 'Discord.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStart'
  filter_optional_github_desktop:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\GitHubDesktop\Update.exe'
    - 'GitHubDesktop.exe'
    CommandLine|contains:
    - '--createShortcut'
    - '--processStartAndWait'
  filter_optional_teams:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\Teams\Update.exe'
    - 'Teams.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  filter_optional_yammer:
    CommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\yammerdesktop\Update.exe'
    - 'Yammer.exe'
    CommandLine|contains:
    - '--processStart'
    - '--createShortcut'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Expected FP with some Electron based applications such as (1Clipboard, Beaker 
  Browser, Caret, Discord, GitHub Desktop, etc.)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of arbitrary processes via the Squirrel.exe binary, commonly utilized in various Electron-based applications like Slack, Teams, and Discord. The objective for an attacker leveraging this tactic may be to execute malicious payloads or escalate privileges stealthily, facilitating further exploitation within the victim's environment. This behavior is relevant to the MITRE ATT&CK framework's Execution tactic, particularly the technique T1218 (System Binary Proxy Execution).

  Key telemetry sources include Windows process creation logs (Event ID 4688) where process command lines are recorded. If this behavior is malicious, it indicates the potential execution of unauthorized applications or scripts, which can compromise system integrity or data confidentiality. This detection does not confirm the actual intent behind the execution; legitimate software updates or user actions can trigger the same behavior.

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 for Squirrel.exe execution. Look for command lines containing '--processStart' or '--processStartAndWait' to identify potential malicious execution patterns.

  - **Identify context of execution**: Determine the user context and asset involved in the execution. Analyze the command line in Event ID 4688 for paths indicating legitimate application usage (e.g., from ‘C:\Users\{username}\AppData\Local\{Application}\Update.exe’).

  - **Cross-validate against known benign applications**: Check if the execution is related to a known Electron application (e.g., Discord, Teams). Legitimate activities typically show command lines that match expected usage patterns without abnormal parameters or additional obfuscation.

  - **Analyze high-confidence malicious indicators**: Look for command lines that deviate from typical usage scenarios, particularly those invoking unknown or unusual executables after Squirrel.exe. For example, execution of cmd.exe or PowerShell commands indicating potential script issuance will be red flags.

  - **Check for file creation or modification artifacts**: Validate if any suspicious or unauthorized files were created in the user’s AppData directory in conjunction with the Squirrel.exe execution. This can indicate a payload or malicious installation.

  - **Assess impacted asset criticality**: If the system executing Squirrel.exe is critical (e.g., a server or domain controller), prioritize the investigation to understand the potential impact of a successful compromise.

  ### Prioritization

  The severity of this alert is medium due to the use of Squirrel.exe—a legitimate binary that an adversary could abuse for process execution. Given its role in application updates, the likelihood of malicious exploitation exists, especially in environments where users have elevated permissions and can execute arbitrary code through commonly used applications.

  ### Blind Spots and Assumptions

  Detection of Squirrel.exe usage is limited by the varied legitimate applications that use it, creating a risk of false positives. Reliable detection requires comprehensive logging and monitoring of command line arguments in process creation events. Legitimate activities may include normal application updates via Squirrel.exe. A companion detection rule for monitoring unusual PowerShell invocation patterns (e.g., T1059.001) can enhance overall detection capabilities related to this tactic.

