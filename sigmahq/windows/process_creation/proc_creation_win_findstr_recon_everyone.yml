title: Permission Misconfiguration Reconnaissance Via Findstr.EXE
id: 47e4bab7-c626-47dc-967b-255608c9a920
status: test
description: |
  Detects usage of findstr with the "EVERYONE" or "BUILTIN" keywords.
  This was seen being used in combination with "icacls" and other utilities to spot misconfigured files or folders permissions.
references:
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2023-11-11
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_findstr_cli:
    CommandLine|contains:
    - '"Everyone"'
    - "'Everyone'"
    - '"BUILTIN\\"'
    - "'BUILTIN\\'"
  selection_special:
    CommandLine|contains|all:
            # Example CLI would be: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "Everyone"
            # You could extend it for other groups and users
            #   Example: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "BUILTIN\Users"
            # Note: This selection only detects the command when executed from a handler such as a "cmd /c" or "powershell -c"
    - 'icacls '
    - 'findstr '
    - 'Everyone'
  condition: all of selection_findstr_* or selection_special
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_recon_everyone/info.yml
note: |
  ---

  ### Technical Context

  This rule detects the invocation of `findstr.exe` or `find.exe` when paired with the keywords "EVERYONE" or "BUILTIN". This behavior suggests reconnaissance activities aimed at identifying misconfigured file and folder permissions within a Windows environment, which adversaries might exploit to escalate privileges. The relevant MITRE ATT&CK tactic is Credential Access, specifically technique T1552.006 (Compromise Accounts via Credential Injection).

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If detected behavior is malicious, the security impact could include unauthorized access to sensitive data and further system compromise. Importantly, this detection does NOT confirm any actual exploitation or privilege escalation on its own.

  ---

  ### Investigation Steps

  - **Review Event Details for Process Creation**: Check Windows Security Event ID 4688 and Sysmon Event ID 1 for the creation of `findstr.exe` or `find.exe`. Focus on the `CommandLine` field for keywords like "Everyone" or "BUILTIN".

  - **Analyze Parent Process Context**: Identify the parent process of the detected command-line execution. Using the `ParentProcessId` field, check if it originated from a known administrative tool or a suspicious process, indicating potential malicious intent.

  - **Check for Misconfiguration Indicators**: Validate the target files or folders mentioned in the `icacls` command against standard permission settings. Legitimate tools would typically not query extensive system directories or return unexpected permission mappings.

  - **Identify High-Confidence Malicious Indicators**: If the `CommandLine` field contains unusual combinations, such as running `icacls` for sensitive directories (e.g., `C:\Program Files\`), this indicates a likely reconnaissance attempt and could warrant immediate escalation.

  - **Confirm Legitimate Usage Context**: Cross-reference the timing and frequency of similar commands from authorized users or automated processes. Frequent execution of such commands from non-administrative accounts can indicate potential misuse.

  - **Document Observed Patterns**: If multiple executions are detected from the same host or user context, document these as they may indicate ongoing reconnaissance efforts or a leading indicator of a more significant escalation attempt.

  ---

  ### Prioritization

  Given the potential impact on privileged access and the ability to expose sensitive data, alerts generated by this detection should be treated with medium priority. The likelihood of abuse is high as the technique is known for being weaponized by attackers seeking to exploit permissions misconfigurations.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate administrative users may sometimes search for file permissions using these commands during maintenance tasks. Required log sources must be rigorously configured, such as enabling detailed process logging, to capture operations accurately. Related detections could include logs capturing usage of `icacls` on its own, enhancing coverage against possible privilege escalation attempts.

