title: Permission Misconfiguration Reconnaissance Via Findstr.EXE
id: 47e4bab7-c626-47dc-967b-255608c9a920
status: test
description: |
  Detects usage of findstr with the "EVERYONE" or "BUILTIN" keywords.
  This was seen being used in combination with "icacls" and other utilities to spot misconfigured files or folders permissions.
references:
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2023-11-11
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_findstr_cli:
    CommandLine|contains:
    - '"Everyone"'
    - "'Everyone'"
    - '"BUILTIN\\"'
    - "'BUILTIN\\'"
  selection_special:
    CommandLine|contains|all:
            # Example CLI would be: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "Everyone"
            # You could extend it for other groups and users
            #   Example: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "BUILTIN\Users"
            # Note: This selection only detects the command when executed from a handler such as a "cmd /c" or "powershell -c"
    - 'icacls '
    - 'findstr '
    - 'Everyone'
  condition: all of selection_findstr_* or selection_special
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_recon_everyone/info.yml
note: |
  ### Technical Context
  This rule is designed to detect reconnaissance activity that seeks to identify permission misconfigurations in Windows environments. Specifically, it focuses on the use of `findstr.exe` with "EVERYONE" or "BUILTIN" keywords in combination with commands like `icacls`. Attackers may leverage these utilities to discover misconfigured file and folder permissions that could allow unauthorized access to sensitive data or escalation of privileges. The underlying objective of such activities typically aligns with credential access and privilege escalation.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Credential Access** (TA0006)
  - **Permission Groups Discovery** (T1069.001)

  Primary data sources for detecting this activity are:
  - Process creation logs, which capture details about command-line executions and associated applications.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for the execution of `find.exe` or `findstr.exe`, especially when combined with suspicious command lines containing "EVERYONE" or "BUILTIN".

  - **Analyze Command-Line Arguments:** Identify instances of `icacls` being executed with `findstr`, paying close attention to command lines that attempt to fetch permissions for directories or files potentially exposing sensitive information.

  - **Investigate File and Folder Permissions:** Conduct audits of files and folders that were query targets of the detected `icacls` commands. Assess permissions to identify any that allow excessive access to unauthorized users or groups.

  - **Cross-Reference User Behavior:** Determine if the user executing the commands typically engages in system administration tasks, where such actions might be legitimate, or if their behavior is anomalous.

  ### Prioritization
  The severity of this alert is medium due to the potential for privileged escalation stemming from misconfigured file permissions. While the likelihood of exploitation may vary, the presence of such reconnaissance can indicate a probing stage ahead of an intended attack.

  ### Blind Spots and Assumptions
  This detection relies heavily on comprehensive logging of process creation events. A gap exists if logging is not enabled for all relevant processes or if logs are not retained long enough for adequate investigation. Assumptions include that the use of `findstr` with the specified keywords typically signifies reconnaissance intent. If the command appears in a legitimate maintenance or configuration script, it may lead to false positives. Required configurations include ensuring that command-line arguments are captured for process creation events to facilitate effective tracking of suspicious activities.

