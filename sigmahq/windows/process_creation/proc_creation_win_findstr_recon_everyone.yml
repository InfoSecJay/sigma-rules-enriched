title: Permission Misconfiguration Reconnaissance Via Findstr.EXE
id: 47e4bab7-c626-47dc-967b-255608c9a920
status: test
description: |
  Detects usage of findstr with the "EVERYONE" or "BUILTIN" keywords.
  This was seen being used in combination with "icacls" and other utilities to spot misconfigured files or folders permissions.
references:
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2023-11-11
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_findstr_cli:
    CommandLine|contains:
    - '"Everyone"'
    - "'Everyone'"
    - '"BUILTIN\\"'
    - "'BUILTIN\\'"
  selection_special:
    CommandLine|contains|all:
            # Example CLI would be: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "Everyone"
            # You could extend it for other groups and users
            #   Example: icacls "C:\Program Files\*" 2>nul | findstr "(M)" | findstr "BUILTIN\Users"
            # Note: This selection only detects the command when executed from a handler such as a "cmd /c" or "powershell -c"
    - 'icacls '
    - 'findstr '
    - 'Everyone'
  condition: all of selection_findstr_* or selection_special
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_recon_everyone/info.yml
note: |
  ### Technical Context

  This detection rule identifies the use of `findstr.exe` alongside the keywords "EVERYONE" or "BUILTIN", demonstrating activities associated with reconnaissance on file and folder permission settings. Attackers may utilize this combination to identify misconfigured permissions that could be exploited for privilege escalation. The associated MITRE ATT&CK tactic is Credential Access (T1552) with the sub-technique T1552.006, which targets user access and permission misconfigurations.

  The primary telemetry source for this detection is Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, showing details about command line executions. The security impact of such behavior is significant, as it could allow adversaries to enumerate permissions on sensitive files, enabling further exploitation. It is important to note that this detection does NOT, on its own, confirm malicious behavior as legitimate administrative tasks might trigger similar commands.

  ### Investigation Steps

  - **Review command line arguments:** Check for executions of `findstr.exe` or `find.exe` with keywords "Everyone" or "BUILTIN" in Security Event ID 4688 or Sysmon Event ID 1. Legitimate uses generally do not involve these keywords unless specifically auditing permissions.

  - **Analyze parent process details:** Assess the parent process of the detected command line using Event ID 4688. If the parent process is a legitimate administrative tool (e.g., Powershell or cmd) with standard operations, it may indicate benign activity.

  - **Identify historical usage patterns:** Query Windows event logs for repeated uses of `icacls` with `findstr` across systems, focusing on the frequency and context of occurrences. A high volume of these commands executed over a short timeframe might indicate suspicious behavior.

  - **Check file and folder permission settings:** Utilize tools like `icacls` directly on identified directories to verify actual permissions versus those being enumerated. Identify if any files or folders are incorrectly configured for broader access.

  - **Look for lateral movement indicators:** Inspect network logs and account activity for any actions that correspond with the timing of the detected command execution, using logs such as Windows Security Event IDs 4624 and 4625 for account logon attempts.

  ### Prioritization

  This alert holds medium severity due to its potential to reveal unauthorized access methods that could compromise sensitive systems. Misconfigured permissions are frequently targeted by attackers, making this an actionable detection that merits further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, such as not enabling Sysmon logging or failing to audit PowerShell and command line activities adequately. Additionally, legitimate administrative tasks may trigger this alert, particularly during routine permission audits. A complementary detection to consider is monitoring usage of `icacls` on its own, which could help identify potential abuse without the context of `findstr`.

