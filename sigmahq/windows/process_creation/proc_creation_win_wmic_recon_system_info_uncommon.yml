detection:
  selection_wmic:
  - Description: 'WMI Commandline Utility'
  - OriginalFileName: 'wmic.exe'
  - Image|endswith: '\WMIC.exe'
  selection_commands:
    CommandLine|contains:
    - 'LOGICALDISK get Name,Size,FreeSpace'
    - 'os get Caption,OSArchitecture,Version'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of the Windows Management Instrumentation Command-line (WMIC) utility, specifically targeting commands that query system information such as disk space, OS details, and hardware specifications. The likely attacker objective is to gather reconnaissance data about the target system, which could inform further malicious actions like data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK framework under the tactic of Discovery, specifically Technique T1082 (System Information Discovery).

  The primary telemetry sources for this detection are Windows process creation logs, such as Security Event ID 4688, and Sysmon Event ID 1, which detail command-line activity. If this behavior is malicious, it could indicate system reconnaissance that leads to more severe actions such as privilege escalation or data manipulation. It is important to note that the detection does NOT confirm that malicious activity has occurred on its own; further investigation is required to assess intent.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of WMIC.EXE being invoked. Look for the exact command-line parameters indicating the retrieval of system information.

  - **Identify execution context:** Verify the user context under which WMIC was executed. Commands run under SYSTEM or administrative accounts are more suspicious.

  - **Assess legitimacy of command usage:** Compare the command-line parameters against normal organizational usage. Typical benign usage may include administrative scripts that query system health or configuration without being part of a suspicious pattern of activity.

  - **Correlate with additional telemetry:** Cross-reference with other logs, such as application logs or Windows Event Logs (Event ID 7036), that may indicate recent administrative activities that justify WMIC usage.

  - **Verify associated artifacts:** Look for other indicative artifacts of reconnaissance or malware activity in the vicinity of the WMIC execution, such as abnormal file creation, registry changes, or network connections (filtered through EDR solutions).

  - **Search for known indicators of compromise:** Validate the presence of any related IOCs from threat intelligence platforms that match patterns associated with WMIC usage by known malware (e.g., Aurora Stealer), focusing on timestamps of WMIC execution.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on the integrity and confidentiality of the affected system, especially if the information could assist an attacker in further compromising the environment. The likelihood of abuse is realistic, as this technique is often employed in the reconnaissance phase of targeted attacks. However, it is not universally weaponized, necessitating further contextual analysis.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative functions generating similar WMIC calls, which may lead to false positives. The required log sources for reliable detection are the Process Creation logs (Security Event ID 4688 and Sysmon Event ID 1), which must be properly configured and monitored. Additionally, routine maintenance or system diagnostics performed by IT staff may trigger this alert, so context is vital. Complementary detections, such as monitoring for unusual network connections following WMIC usage, can strengthen coverage against potential attacks.

