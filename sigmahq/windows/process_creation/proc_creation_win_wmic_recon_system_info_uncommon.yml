note: |
  ### Technical Context

  This rule detects the invocation of the Windows Management Instrumentation Command-line (WMIC) utility to query system information, which can include details about the operating system, hardware, and disk space. The attacker may use this information to gather intelligence about the environment, which assists in subsequent phases of an attack, such as lateral movement or privilege escalation. This behavior corresponds to the MITRE ATT&CK technique T1082 (System Information Discovery).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688, which captures command-line invocation details for processes. If the activity is confirmed as malicious, it could indicate a reconnaissance phase of an attack. However, this detection alone does not confirm an active compromise; it captures only the execution of specific commands without evidence of further malicious activity.

  ### Investigation Steps

  - **Review WMIC Command Usage:** Examine Security Event ID 4688 for any instance of `WMIC.exe` in the CommandLine field and match against detection criteria (e.g., contain commands like ‘LOGICALDISK get Name,Size,FreeSpace’ or ‘os get Caption,OSArchitecture,Version’) for malicious usage.
  - **Identify Indicators of Compromise:** Look for unusual command patterns or the presence of multiple WMIC executions in a short timeframe, which may indicate automated enumeration as opposed to legitimate administrative tasks.
  - **Assess User Context:** Check the user context of the WMIC execution by evaluating the Event ID 4688 owner fields. Legitimate administrative users may invoke WMIC for system configuration. Elevated permissions (e.g., SYSTEM, Administrators) executing these commands may warrant further investigation.
  - **Validate Against Baseline Activity:** Compare the observed behaviors against typical organizational usage. Usually, legitimate usage includes tasks such as system maintenance or initial configuration and will not occur frequently or from non-administrative users.
  - **Correlate with Other Activities:** Analyze related activities around the same timeframe for suspicious behaviors, such as unusual outbound network connections or file system changes that might indicate data exfiltration or lateral movement attempts.

  ### Prioritization

  This alert should be treated with medium severity. The system impacted by this alert can be central to overall enterprise operations, and the behavior can be indicative of pre-attack reconnaissance by adversaries. It may not be frequently weaponized in isolation but could lead into more aggressive exploitation phases if left unchecked.

  ### Blind Spots and Assumptions

  There may be limitations to detection if WMIC logging is not enabled or if alternative command-line tools are used for similar purposes. Legitimate administrative tasks may inadvertently trigger this alert, particularly by helpdesk or IT personnel performing routine checks. Related detections, such as monitoring for other reconnaissance activities (e.g., T1012 - Query Registry), can help provide a fuller picture of potential malicious intent.

