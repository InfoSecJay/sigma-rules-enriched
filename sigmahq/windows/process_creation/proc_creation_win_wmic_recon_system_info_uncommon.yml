logsource:
  category: process_creation
  product: windows
detection:
  selection_wmic:
  - Description: 'WMI Commandline Utility'
  - OriginalFileName: 'wmic.exe'
  - Image|endswith: '\WMIC.exe'
  selection_commands:
    CommandLine|contains:
    - 'LOGICALDISK get Name,Size,FreeSpace'
    - 'os get Caption,OSArchitecture,Version'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This Sigma rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) utility to gather system information such as operating system details, CPU, GPU specifications, and disk properties. Attackers may employ WMIC in their reconnaissance phase to collect information about the target system, ultimately aiming to exploit vulnerabilities or gather data that aids in furthering their access or control over the environment. The Aurora Stealer, known for using similar command patterns in late 2022 and early 2023, exemplifies the threat associated with this behavior.

  The rule aligns with the MITRE ATT&CK framework, specifically targeting the **Discovery** tactic. Techniques relevant to this rule include **System Information Discovery (T1082)**, which encompasses the ability of attackers to enumerate system details that can facilitate lateral movement or aid in launching other attacks.

  Primary data sources for this rule are **process creation logs** from Windows systems, as they contain information about the execution of processes like WMIC, along with the command-line arguments used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation events for WMIC execution, focusing on timestamps, user accounts, and commands that include output options for system information.

  - **Analyze Command-Line Arguments**: Pay close attention to any command-line arguments associated with WMIC that involve disk drives, OS architecture, and other system metrics. Look for unusual or unauthorized usages.

  - **Check for Unusual User Activity**: Cross-reference the user account associated with the WMIC execution against typical user behavior and access rights. Determine if this user normally engages in system diagnostics.

  - **Correlate with Threat Intelligence**: Consult threat intelligence feeds and internal logs to identify if the WMIC command has been observed in other incidents or related threat actor tactics within your environment.

  ### Prioritization
  This alert is categorized as medium severity since executing WMIC for system discovery could be an initial step in a broader attack strategy. While not a definitive indicator of compromise, it signals potential preparatory actions by threat actors that warrant investigation to prevent system exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if WMIC execution is masked or if log retention policies are insufficient. The detection logic assumes that process creation logs are enabled and properly configured for real-time monitoring. If a user typically utilizes WMIC for legitimate administrative tasks, there may be a higher likelihood of false positives if no additional context is analyzed during investigations. Ensuring that appropriate logging is in place across all endpoints is critical for the rule to function effectively.

