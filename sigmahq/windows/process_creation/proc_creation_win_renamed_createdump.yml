detection:
  selection_pe:
    OriginalFileName: 'FX_VER_INTERNALNAME_STR'
  selection_cli:
  - CommandLine|contains|all:
    - ' -u '           # Short version of '--full'
    - ' -f '           # Short version of '--name'
    - '.dmp'
  - CommandLine|contains|all:
    - ' --full '           # Short version of '--full'
    - ' --name '           # Short version of '--name'
    - '.dmp'
  filter:
    Image|endswith: '\createdump.exe'
  condition: 1 of selection_* and not filter
falsepositives:
- Command lines that use the same flags
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed version of the legitimate `createdump.exe` utility, commonly used for process memory dumping. The likely attacker objective is to exfiltrate sensitive information, gain insights into application behavior, or pivot further into the system post-exploitation. Relevant MITRE ATT&CK tactics include Credential Access (T1003.001) and Defense Evasion (T1036). The primary telemetry sources are Windows process creation logs, particularly focusing on the Event ID 4688 and the command line used to execute the process. If malicious, this activity could lead to unauthorized data disclosure and lateral movement within the network. This detection does NOT confirm that the executed command was indeed malicious, as legitimate usage of memory dump utilities can also trigger the alert.

  ### Investigation Steps

  - **Review process execution details:** Check for Windows Security Event ID 4688 to identify the process `createdump.exe`. Note the user account and whether it aligns with legitimate administrative activities.

  - **Analyze command-line arguments:** Evaluate the command line associated with the execution. Look for flags such as `--full` and `--name` followed by `.dmp`. If present in untoward contexts, this increases the confidence of potential malicious intent.

  - **Validate user role and asset criticality:** Determine if the executing user has appropriate privileges for executing memory dump utilities. Elevated user accounts or unusual execution on critical servers heighten risk assessments.

  - **Identify other active processes:** Conduct a review of surrounding processes initiated by the same user during the same time frame. Look for unusual parent/child relationships, especially with known tools for credential access or information theft.

  - **Check for known indicators of compromise:** Consult threat intelligence sources linked to similar behaviors indicated by this detection. Identify if there are other filenames, command patterns, or signatures associated with the execution of the renamed `createdump.exe`.

  - **Benchmark against legitimate usage:** Refer to standard documentation or known operational procedures for your environment that would require legitimate use of memory dumping tools. Cross-check command line usage against typical workflows for troubleshooting or testing scenarios.

  ### Prioritization

  This alert has a high severity due to the potential impact of exfiltrated sensitive data and the likelihood of credential access or lateral movement following successful exploitation. The behavior is often weaponized in advanced persistent threat (APT) scenarios, making it critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may miss legitimate use cases for memory dumps conducted by authorized personnel. Adversaries may attempt to evade detection by using obfuscation techniques or unrelated process names. Ensure process creation logs are correctly configured to capture all relevant telemetry. A companion detection to consider would be monitoring for suspicious parent processes that spawn `createdump.exe`, further enhancing detection capabilities.

