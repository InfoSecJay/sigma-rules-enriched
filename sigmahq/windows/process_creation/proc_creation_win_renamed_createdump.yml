detection:
  selection_pe:
    OriginalFileName: 'FX_VER_INTERNALNAME_STR'
  selection_cli:
  - CommandLine|contains|all:
    - ' -u '           # Short version of '--full'
    - ' -f '           # Short version of '--name'
    - '.dmp'
  - CommandLine|contains|all:
    - ' --full '           # Short version of '--full'
    - ' --name '           # Short version of '--name'
    - '.dmp'
  filter:
    Image|endswith: '\createdump.exe'
  condition: 1 of selection_* and not filter
falsepositives:
- Command lines that use the same flags
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed legitimate utility, `createdump.exe`, which is commonly used by attackers to dump process memory for credential harvesting or sensitive data extraction. The likely objective of an attacker utilizing this technique is to capture sensitive information from running processes or to analyze memory contents for security weaknesses. This behavior aligns with the MITRE ATT&CK techniques for Credential Access (T1003) and Operating System Discovery (T1036).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on command lines associated with the `createdump.exe`. If executed maliciously, the impact could be significant, leading to credential compromise or sensitive data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is needed to establish intent.

  ### Investigation Steps

  - **Review process creation logs:** Investigate Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `createdump.exe` execution. Check for the presence of suspicious command-line arguments such as `--full` and `--name` followed by `.dmp`.

  - **Identify high-confidence malicious indicators:** Focus on command lines that contain multiple flags indicating a memory dump action with `.dmp` file extension. An example of a malicious command is `createdump.exe -u -f process_name.dmp`.

  - **Validate benign activity:** Legitimate uses of `createdump.exe` may include authorized administrators performing memory diagnostics. Confirm compliance by reviewing the roles of users executing this tool and the context of the command line arguments used.

  - **Check for associated logs:** Examine the Application and Service logs for any entries related to the execution of createdump.exe. Look for unusual parent processes that may suggest exploitation or lateral movement.

  - **Assess the system's criticality:** Determine if the affected host is critical, such as a domain controller or web server, where memory dump activities could lead to unauthorized access to sensitive resources.

  ### Prioritization

  The alert severity is high due to the potential implications of credential theft or data exfiltration when sensitive processes are dumped. The likelihood of malicious activity is elevated, as this technique is commonly exploited by adversaries during post-exploitation phases to gain credentials.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion methods such as renaming the `createdump.exe` utility or using other tools for memory dumping. Reliable detection requires consistent configurations of process creation logging in Windows Security and Sysmon settings. Legitimate administrative activities for memory analysis might trigger this alert, leading to false positives. A related detection strategy is monitoring for unauthorized process memory access (T1003.001), which can provide additional context to complement this rule.

