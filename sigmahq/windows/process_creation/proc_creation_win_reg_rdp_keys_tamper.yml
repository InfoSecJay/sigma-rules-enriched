logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - '\CurrentControlSet\Control\Terminal Server'
    - 'REG_DWORD'
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - 'Licensing Core'
    - 'EnableConcurrentSessions'
  selection_values_2:
    CommandLine|contains:
    - 'AllowTSConnections'
    - 'fDenyTSConnections'
    - 'fEnableWinStation'
    - 'fSingleSessionPerUser'
    - 'IdleWinStationPoolCount'
    - 'MaxInstanceCount'
    - 'SecurityLayer'
    - 'TSAdvertise'
    - 'TSAppCompat'
    - 'TSEnabled'
    - 'TSUserEnabled'
    - 'WinStations\RDP-Tcp'
  filter_main_values_tls:
    CommandLine|contains|all:
    - 'SecurityLayer'
    - '02'          # TLS Enabled
  condition: all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of `reg.exe` specifically targeting the Windows registry settings related to Remote Desktop Protocol (RDP) services. The likely attacker objective is to enable or modify settings in the `Terminal Server` configuration to establish remote control over a system, facilitating lateral movement or persistence. This behavior fits into the MITRE ATT&CK tactic of **Persistence** (T1559) and **Defense Evasion** (T1112). The primary telemetry sources include process creation events from Windows (Event ID 4688) and potentially Sysmon (Event ID 1), focusing on the execution command line arguments. If malicious, this behavior could lead to unauthorized remote access or manipulation of critical services. However, this detection alone does not confirm that an attacker is present or has successfully compromised the system; legitimate administrative actions could trigger similar events.

  ---

  ### Investigation Steps

  - **Review the command line execution:** Check process creation logs (Security Event ID 4688) for `reg.exe` with command line arguments containing `add` and `\CurrentControlSet\Control\Terminal Server`. Look specifically for the presence of RDP-related modifiers like `fDenyTSConnections` or `EnableConcurrentSessions`.

  - **Assess command line for recognized behaviors:** Identify additional command line artifacts that are typically associated with malicious RDP configuration changes, such as enabling connections (`AllowTSConnections`) or modifying security settings (e.g., `SecurityLayer` set to `02`).

  - **Correlate with user activity:** Examine user actions preceding the alert using authentication logs (Event ID 4624). Legitimate administrative users may show a history of RDP-related changes, while anomalous timings or unauthorized user actions might indicate malicious intent.

  - **Identify high-confidence indicators of compromise:** Look for unusual values in settings like `fDenyTSConnections` being set to `0` or `AllowTSConnections` set to `1` in the registry that do not align with documented policies or practices of the organization, indicating potential unauthorized RDP access.

  - **Verify host role and criticality:** Confirm if the affected host is a server that should have RDP enabled. Assess the criticality level of the asset to prioritize follow-up actions and potential containment strategies.

  - **Check for additional persistence methods:** Review logs and configurations for other lateral movement techniques that may be employed in conjunction with RDP exploitation, such as credential dumping events (Event ID 4672) or use of tools like Mimikatz, which might be found in Sysmon logs (Event ID 22).

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact of unauthorized access on critical infrastructure, especially if the affected host is a domain controller or a server hosting sensitive data. The likelihood of malicious abuse is significant, as tampering with RDP settings is a common technique used by attackers for lateral movement and persistence. Given its association with credential theft and exploitation methods, this behavior is regularly weaponized.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate administrative users executing similar registry changes or attackers using alternative methods to manipulate registry settings without direct command invocation. Accurate detection relies on event log sources such as security logs for process creation (Event ID 4688) and possibly Sysmon for detailed monitoring of command line arguments. Legitimate remote management via RDP changes could also yield this alert. Complementary detections such as monitoring for abnormal user logins to RDP sessions (Event ID 4624) can strengthen coverage and provide context to the alert.

