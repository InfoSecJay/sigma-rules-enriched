logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - '\CurrentControlSet\Control\Terminal Server'
    - 'REG_DWORD'
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - 'Licensing Core'
    - 'EnableConcurrentSessions'
  selection_values_2:
    CommandLine|contains:
    - 'AllowTSConnections'
    - 'fDenyTSConnections'
    - 'fEnableWinStation'
    - 'fSingleSessionPerUser'
    - 'IdleWinStationPoolCount'
    - 'MaxInstanceCount'
    - 'SecurityLayer'
    - 'TSAdvertise'
    - 'TSAppCompat'
    - 'TSEnabled'
    - 'TSUserEnabled'
    - 'WinStations\RDP-Tcp'
  filter_main_values_tls:
    CommandLine|contains|all:
    - 'SecurityLayer'
    - '02'          # TLS Enabled
  condition: all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential tampering with Remote Desktop Protocol (RDP) settings on Windows systems through the use of "reg.exe". It detects commands that modify critical registry values associated with RDP functionality, specifically within the path `CurrentControlSet\Control\Terminal Server`. Attackers may manipulate these settings to enable unauthorized remote access or to evade detection while maintaining remote control over compromised systems.

  The primary threat scenario involves an attacker using registry modifications to disable security features of RDP, thereby enabling easier lateral movement within a network or establishing persistent access to specific systems. This behavior can be indicative of various threat actors attempting to exploit vulnerabilities related to RDP, which is commonly targeted in ransomware attacks and unauthorized access scenarios.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **T1076: Remote Desktop Protocol (RDP)**
  - **T1021.001: Remote Services: Remote Desktop Protocol**
  - **T1112: Modify Registry**

  The best telemetry sources for this detection event include process creation logs, specifically focusing on the execution of reg.exe and associated command line details, which can reveal illicit changes to the terminal services configuration.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for instances of `reg.exe` execution, focusing on the command line arguments to identify any modifications to RDP-related registry keys.
  - **Analyze Registry Changes**: Investigate the specific registry keys within `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentControlSet\Control\Terminal Server` for unauthorized changes to RDP settings and confirm any suspicious values that might indicate tampering.
  - **Correlate User Activity**: Examine user accounts that executed the reg.exe command to determine if the activity aligns with normal user behavior or if it coincides with potential compromised accounts.
  - **Identify Associated Network Activity**: Look for unusual network connections or remote access activities around the time reg.exe was executed, particularly any RDP sessions that may have originated from unexpected sources.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact on the enterprise's security posture. Tampering with RDP settings can allow attackers unauthorized access and control over systems, representing a serious risk for data exfiltration or network compromise.

  ### Blind Spots and Assumptions
  This detection relies on the presence of adequate process creation logging to capture the execution of `reg.exe` with specific command line parameters. If logging is not enabled or if certain command line configurations are obfuscated or altered, critical evidence may be missed. Additionally, the detection logic assumes that all instances of reg.exe execution for these keys are malicious; legitimate administrative activities may inadvertently trigger this rule.

