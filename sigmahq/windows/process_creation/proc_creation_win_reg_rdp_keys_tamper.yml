author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport
date: 2022-02-12
modified: 2025-11-22
tags:
- attack.persistence
- attack.lateral-movement
- attack.defense-impairment
- attack.t1021.001
- attack.t1112
logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - '\CurrentControlSet\Control\Terminal Server'
    - 'REG_DWORD'
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - 'Licensing Core'
    - 'EnableConcurrentSessions'
  selection_values_2:
    CommandLine|contains:
    - 'AllowTSConnections'
    - 'fDenyTSConnections'
    - 'fEnableWinStation'
    - 'fSingleSessionPerUser'
    - 'IdleWinStationPoolCount'
    - 'MaxInstanceCount'
    - 'SecurityLayer'
    - 'TSAdvertise'
    - 'TSAppCompat'
    - 'TSEnabled'
    - 'TSUserEnabled'
    - 'WinStations\RDP-Tcp'
  filter_main_values_tls:
    CommandLine|contains|all:
    - 'SecurityLayer'
    - '02'          # TLS Enabled
  condition: all of selection_main_* and 1 of selection_values_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_reg_rdp_keys_tamper/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `reg.exe` command with parameters that indicate an attempt to modify registry keys related to Remote Desktop Protocol (RDP) settings, particularly under the path `CurrentControlSet\Control\Terminal Server`. These behaviors may be indicative of an attacker aiming to enable or disable RDP access on compromised systems, potentially for lateral movement or persistence. This activity aligns with the MITRE ATT&CK tactics of **Persistence** (TA0003) and **Lateral Movement** (TA0008) through the technique **Remote Services: RDP** (T1021.001) and **Modify Registry** (T1112). The primary telemetry source is Windows process creation logs (Security Event ID 4688, Sysmon Event ID 1) capturing the usage of the `reg.exe` tool. If this behavior is malicious, it could allow unauthorized remote access to sensitive systems. However, this detection does NOT confirm malicious intent on its own, as the `reg.exe` modification could be part of legitimate administrative tasks or configurations.

  ### Investigation Steps

  - **Review the process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 for `reg.exe` executions. Focus on command lines containing `add` and `\CurrentControlSet\Control\Terminal Server` to identify suspicious activity.

  - **Identify modification specifics:** Examine the command line arguments for specific values related to RDP. Look for any occurrences of key values like `AllowTSConnections` or `fDenyTSConnections`. If found, this is a strong indicator of an attempt to change RDP settings.

  - **Validate expected administrator behavior:** Confirm if the identified `reg.exe` execution aligns with known maintenance or policy change schedules by legitimate admins. Review logs for other administrative actions around the same timeframe.

  - **Correlate with network activity:** Analyze network traffic logs for any associated connections to RDP services (port 3389) that coincide with the `reg.exe` executions. Unusual connections or failed login attempts during this time could imply malicious activity.

  - **Check for presence of malicious indicators:** Investigate if the modification was followed by an increase in RDP session attempts or any records of successful logins from unexpected accounts. Look for abnormal user behavior patterns.

  - **Assess asset criticality:** Evaluate the system involved in the alert. Systems that are critical for business operations or store sensitive data should be prioritized for a deeper investigation. Also, consider isolating those systems during the investigation phase.

  ### Prioritization

  This alert is of high severity due to the potential impact on systems enabling unauthorized remote access, heightening the risk of data exfiltration or further network compromise. The likelihood of malicious abuse is significant, as manipulation of RDP settings is frequently used in lateral movement tactics by attackers.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques by attackers, such as using legitimate administrative accounts to perform the modifications, making it challenging to differentiate between malicious and benign actions. Reliable detection depends on comprehensive logging configurations, ensuring Windows process creation logs are enabled. Legitimate activities that might trigger this alert include system updates or maintenance tasks performed by IT personnel. A companion detection worth considering is monitoring for abnormal RDP connection attempts or successful logins from non-administrative accounts within the same timeframe.

