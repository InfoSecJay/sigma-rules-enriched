logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - '\CurrentControlSet\Control\Terminal Server'
    - 'REG_DWORD'
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - 'Licensing Core'
    - 'EnableConcurrentSessions'
  selection_values_2:
    CommandLine|contains:
    - 'AllowTSConnections'
    - 'fDenyTSConnections'
    - 'fEnableWinStation'
    - 'fSingleSessionPerUser'
    - 'IdleWinStationPoolCount'
    - 'MaxInstanceCount'
    - 'SecurityLayer'
    - 'TSAdvertise'
    - 'TSAppCompat'
    - 'TSEnabled'
    - 'TSUserEnabled'
    - 'WinStations\RDP-Tcp'
  filter_main_values_tls:
    CommandLine|contains|all:
    - 'SecurityLayer'
    - '02'          # TLS Enabled
  condition: all of selection_main_* and 1 of selection_values_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of **reg.exe** which is invoked to modify settings related to Remote Desktop Protocol (RDP) by altering registry entries under **CurrentControlSet\Control\Terminal Server**. The likely attacker objective is to enable or configure RDP settings to maintain access or facilitate lateral movement across the network, potentially bypassing security controls. This behavior is relevant to the MITRE ATT&CK techniques **T1021.001 (Remote Services: RDP)** and **T1112 (Modify Registry)**.

  The primary telemetry source for this detection includes Windows process creation events, specifically those with Event ID **4688** or Sysmon Event ID **1**. If malicious, the security impact is significant, as unauthorized RDP modifications can lead to a foothold in the network, enabling further compromise or exfiltration. However, this detection does **not** confirm that the alerting behavior is malicious without context from other logs or user activity.

  ---

  ### Investigation Steps

  - **Review command line arguments for reg.exe execution:** Verify the **CommandLine** field from Event ID **4688** or Sysmon Event ID **1**. Look for suspicious arguments like 'add' and the presence of keys such as `AllowTSConnections`, `fDenyTSConnections`, or `SecurityLayer`. Legitimate processes may not modify these keys unexpectedly.

  - **Check for associated logs:** Correlate the event with **Windows Security event logs** to identify related logons (Event ID **4624**) or failed logon attempts (Event ID **4625**) that may indicate unauthorized access attempts.

  - **Confirm the process parent's legitimacy:** Inspect the **ParentImage** field for the reg.exe process. Known legitimate usage typically stems from administrative tools or trusted scripts. Suspicious parents could point to malicious activity.

  - **Analyze registry key modifications:** Use tools or scripts to programmatically check changes in the **HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Terminal Server** registry path post-event. Ensure changes align with administrative actions.

  - **Identify recent remote access events:** Look for RDP connection attempts (Event IDs **4624**, **1149** for successful connections) around the time of the reg.exe invocation. Assess whether these are consistent with expected user behavior.

  - **Monitor for lateral movement indicators:** Examine subsequent logins to adjacent systems using RDP from the affected machine, looking for behavior consistent with lateral movement tools, such as rapid logon attempts to multiple hosts.

  ---

  ### Prioritization

  This alert carries a high severity due to the potential impact on critical systems provided they have active RDP services. The likelihood of malicious abuse is elevated, as modifications to RDP settings are a common tactic used by adversaries to establish unauthorized access pathways. The behavior is frequently observed in actual exploitation scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through the use of alternate legitimate tools or scripts that modify the registry without using reg.exe. Reliable detection requires consistent logging configurations across endpoint security solutions. Legitimate administrative activities, such as configuring RDP settings during maintenance, may trigger this alert. Companion detections, such as monitoring for suspicious RDP connections or unauthorized process creations, can enhance overall threat visibility.

