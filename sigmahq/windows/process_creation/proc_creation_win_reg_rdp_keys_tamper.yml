author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport
date: 2022-02-12
modified: 2025-11-22
tags:
- attack.persistence
- attack.lateral-movement
- attack.defense-impairment
- attack.t1021.001
- attack.t1112
logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - '\CurrentControlSet\Control\Terminal Server'
    - 'REG_DWORD'
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - 'Licensing Core'
    - 'EnableConcurrentSessions'
  selection_values_2:
    CommandLine|contains:
    - 'AllowTSConnections'
    - 'fDenyTSConnections'
    - 'fEnableWinStation'
    - 'fSingleSessionPerUser'
    - 'IdleWinStationPoolCount'
    - 'MaxInstanceCount'
    - 'SecurityLayer'
    - 'TSAdvertise'
    - 'TSAppCompat'
    - 'TSEnabled'
    - 'TSUserEnabled'
    - 'WinStations\RDP-Tcp'
  filter_main_values_tls:
    CommandLine|contains|all:
    - 'SecurityLayer'
    - '02'          # TLS Enabled
  condition: all of selection_main_* and 1 of selection_values_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies the execution of `reg.exe` to modify Windows registry keys related to Remote Desktop Protocol (RDP) services, specifically within the `CurrentControlSet\Control\Terminal Server` path. The likely attacker objective is to enable, disable, or manipulate RDP access settings, potentially allowing remote access for unauthorized users or facilitating lateral movement within the network. This behavior relates to the MITRE ATT&CK tactics: **Persistence (T1021.001)** and **Defense Evasion (T1112)**.

  Primary telemetry sources include Windows process creation logs (Event ID 4688) and potentially Sysmon Event ID 1 for process creation details. If executed maliciously, these alterations can significantly impact network security by opening pathways for attacker-controlled sessions. However, this detection does NOT confirm that an indicator of compromise (IoC) was confirmed without further context or corroborating evidence of malicious intent.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `reg.exe` execution timestamps, including `CommandLine` values that feature strings like `add` and `Control\Terminal Server`. Look for unusual execution contexts, particularly on critical infrastructure assets.

  - **Identify specific registry changes:** Analyze the `CommandLine` for references to values like `AllowTSConnections`, `fDenyTSConnections`, or `SecurityLayer`. Changes to these indicate potential attempts to modify RDP service behavior. Compare with baseline registry configurations to identify unauthorized changes.

  - **Confirm legitimate administrative actions:** Verify if the modification corresponds with documented maintenance or administrative activities, particularly for users known to manage remote access services. Legitimate changes should involve documented change requests with appropriate approvals.

  - **Correlate with network activity:** Review network logs, focusing on inbound and outbound RDP traffic (TCP port 3389). The presence of remote access connections following registry modifications can indicate malicious activity.

  - **Cross-reference user activity:** Examine account logs for unusual login patterns or sessions, particularly from accounts not typically associated with RDP configuration changes. This could indicate compromised administrative accounts.

  - **Utilize threat intelligence sources:** Refer to the provided external links for known tactics and techniques associated with RDP abuse. Identify if similar patterns have been reported recently related to `reg.exe` usage for changes in RDP settings.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of RDP services in enterprise environments, especially for access to sensitive systems. The likelihood of malicious abuse is significant, as RDP configurations are commonly targeted to facilitate unauthorized access. Such behavior is often weaponized in attacks, making prompt investigation essential.

  ### Blind Spots and Assumptions

  The detection may have limitations, such as potential evasion through alternate methods of registry modification (e.g., PowerShell). Reliable detection requires proper logging configurations, including sufficient logging retention and Sysmon installation for better visibility. Legitimate administrative management routines and maintenance scripts might trigger the alert, necessitating careful review of operational context. An additional detection that enhances coverage would be monitoring PowerShell commands that manipulate RDP settings (e.g., `Set-ItemProperty` cmdlet targeting RDP registry paths).

