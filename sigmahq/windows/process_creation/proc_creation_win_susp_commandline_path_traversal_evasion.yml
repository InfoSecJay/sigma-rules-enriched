title: Potential Command Line Path Traversal Evasion Attempt
id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
status: test
description: Detects potential evasion or obfuscation attempts using bogus path traversal
  via the commandline
references:
- https://twitter.com/hexacorn/status/1448037865435320323
- https://twitter.com/Gal_B1t/status/1062971006078345217
author: Christian Burkard (Nextron Systems)
date: 2021-10-26
modified: 2023-03-29
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    Image|contains: '\Windows\'
    CommandLine|contains:
    - '\..\Windows\'
    - '\..\System32\'
    - '\..\..\'
  selection_2:
    CommandLine|contains: '.exe\..\'
  filter_optional_google_drive:
    CommandLine|contains: '\Google\Drive\googledrivesync.exe\..\'
  filter_optional_citrix:
    CommandLine|contains: '\Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Google Drive
- Citrix
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential evasion or obfuscation attempts that leverage path traversal techniques via command-line inputs on Windows systems. Attackers may employ these methods to navigate file systems in ways that circumvent security controls, aiming to obscure malicious activities or access restricted directories and files. In particular, malicious actors might exploit vulnerabilities within applications by manipulating file paths to access sensitive data or execute arbitrary code.

  The primary objective of such behavior is typically to evade defenses—an activity categorized under MITRE ATT&CK's **Defense Evasion** tactic (TA0005) and specifically targeting the **T1036: Masquerading** technique. Notably, the attacker's goal often encompasses privilege escalation, data theft, or setting the stage for future attacks.

  The best sources of telemetry for identifying this behavior include process creation events which log command-line arguments, as well as system security logs that capture execution details of processes on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs for any entries that include command-line arguments with path traversal patterns such as `..\Windows\`, `..\System32\`, or `..\..`. Look for anomalies in command-line usage that deviate from normal user behavior.
  - **Correlate with User Activity:** Investigate the user account that executed the command. Assess whether this user typically operates in a context that would warrant such command-line usage, and check for unauthorized activity or privilege escalations.
  - **Examine Associated Executables:** Identify any executables that are called in conjunction with the suspicious command lines. Cross-reference these executables against known good baselines or security advisories to determine their legitimacy.
  - **Investigate Related Network Activity:** If applicable, check for any outbound network connections triggered by the process that may indicate data exfiltration attempts or communications with known malicious endpoints.

  ### Prioritization
  The alert is categorized with medium severity due to the moderate likelihood of path traversal exploitation being indicative of reconnaissance or further malicious intent. While such behavior might not always lead to a successful compromise, it presents a significant risk if exploited.

  ### Blind Spots and Assumptions
  This detection logic may not cover scenarios where attackers use different obfuscation techniques or when legitimate processes employ complex command-line arguments inadvertently resembling these patterns. There is an assumption that command-line logging is enabled on the endpoints involved, and that all relevant telemetry is being correctly captured. If logs for process creation are missing or incomplete, this alert may fail to trigger, allowing potential threats to go unnoticed.

