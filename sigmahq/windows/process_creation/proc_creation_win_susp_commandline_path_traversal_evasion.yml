title: Potential Command Line Path Traversal Evasion Attempt
id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
status: test
description: Detects potential evasion or obfuscation attempts using bogus path 
  traversal via the commandline
references:
- https://twitter.com/hexacorn/status/1448037865435320323
- https://twitter.com/Gal_B1t/status/1062971006078345217
author: Christian Burkard (Nextron Systems)
date: 2021-10-26
modified: 2023-03-29
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    Image|contains: '\Windows\'
    CommandLine|contains:
    - '\..\Windows\'
    - '\..\System32\'
    - '\..\..\'
  selection_2:
    CommandLine|contains: '.exe\..\'
  filter_optional_google_drive:
    CommandLine|contains: '\Google\Drive\googledrivesync.exe\..\'
  filter_optional_citrix:
    CommandLine|contains: '\Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Google Drive
- Citrix
level: medium
note: |
  ### Technical Context

  This detection rule identifies potential path traversal evasion attempts in Windows environments where an attacker may manipulate command-line strings to obfuscate malicious execution paths. The likely attacker objective is to execute payloads without detection by traversing directory structures in a misleading manner, thereby bypassing security controls. The relevant MITRE ATT&CK tactic is Defense Evasion (T1036) associated with Obfuscated Files or Information.

  The primary telemetry source for this detection is Windows process creation logs, specifically capturing the `CommandLine` arguments associated with the executed processes, as well as the image paths via Process Creation logs (Event ID 4688). If malicious, this behavior can lead to unauthorized command execution, potentially compromising the system. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate applications may use similar command-line patterns.

  ### Investigation Steps

  - **Examine the command line arguments:** Look for process creation events with Event ID 4688. Pay specific attention to the `CommandLine` field for suspicious entries such as `\..\Windows\` or `\..\System32\`.
  - **Analyze the parent process:** Check the `ParentImage` field for the process that spawned the suspicious command. If it originated from a known trusted application or service, it may be benign.
  - **Validate with legitimate applications:** For benign verification, review expected CommandLine patterns for `Google Drive` (e.g., containing `googledrivesync.exe`) and `Citrix` related processes (e.g., `Citrix.Authentication.VirtualSmartcard.Launcher.exe`). If the context matches, it may indicate legitimate behavior.
  - **Identify high-confidence malicious indicators:** Look for command-line arguments containing obfuscation patterns like `..\..\` that do not correspond to legitimate parent processes or known application use cases.
  - **Check system event logs:** Any unusual or repetitive attempts at command line execution with path manipulation should be corroborated by examining Security Event Logs for events related to user logins (Event ID 4624) that may provide context on user behavior.
  - **Assess for file creation attempts:** Use Sysmon (Event ID 10) to validate if any unusual file creation events were logged, indicating potentially malicious activity leveraging obfuscation techniques.

  ### Prioritization

  The alert severity is medium due to the potential for significant system impact if exploited, particularly in enterprise environments where sensitive data resides. The likelihood of malicious abuse is moderate, as path traversal techniques are common in evasion tactics. However, this behavior can also be indicative of legitimate application functions, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited due to evasion techniques that legitimate software could use, which may generate similar command-line patterns. Reliable detection requires ensuring complete logging of process creation with adequate configurations to capture all relevant command line arguments. Additionally, legitimate activities from applications such as Google Drive or Citrix may trigger false positives. A related detection rule focusing on specific process signatures or known threat actor TTPs could enhance coverage and refinement of alerts.

