logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentCommandLine|contains|all:
    - ':\Windows\TEMP\ScreenConnect\'
    - 'run.cmd'
    Image|endswith:
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\curl.exe'
    - '\dllhost.exe'
    - '\net.exe'
    - '\nltest.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\rundll32.exe'
    - '\wevtutil.exe'
  condition: selection
falsepositives:
- If the script being executed make use of any of the utilities mentioned in the detection
  then they should filtered out or allowed.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious child processes that are executed via the ScreenConnect client service on Windows systems. ScreenConnect (now called ConnectWise Control) is a remote access tool often used for legitimate remote support, but its capabilities can be exploited by threat actors to execute arbitrary commands and manipulate remote systems. The alert focuses on command execution behavior that employs commonly used Windows utilities, potentially indicating malicious activities such as post-exploitation and command-and-control (C2) communication.

  The threat scenario is likely to involve adversaries gaining unauthorized access to a system using ScreenConnect to subsequently execute malicious commands. This could be part of a targeted attack aiming to establish persistence, exfiltrate data, or further compromise the network. Attackers may employ techniques such as credential dumping or lateral movement as a follow-up to gaining initial access. Relevant MITRE ATT&CK tactics include **Execution (T1203)**, where malicious scripts are run, and **Command and Control (T1219)**, which encompasses the use of legitimate remote access tools to maintain communication with compromised hosts.

  The primary data sources for detection include **process creation events** that log the execution history of applications, highlighting both the parent and child processes. Monitoring the command line arguments of these processes can reveal potentially malicious use of utilities like PowerShell, cmd.exe, and others.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect process creation logs to identify instances where ScreenConnect is used as a parent process. Focus on child processes initiated under this context to locate suspicious activity patterns.
  - **Analyze Command Line Arguments**: Examine command line arguments for all child processes spawned from ScreenConnect. Look for unusual flags or commands that deviate from expected operational use.
  - **Correlate with User Activity**: Cross-reference the timestamps and execution context with user activity logs. Investigate any discrepancies that indicate potential misuse of ScreenConnect for unauthorized access.
  - **Monitor Network Traffic**: Check outgoing network connections from systems with ScreenConnect installed. Look for communications with unknown or untrusted IP addresses, which may indicate command-and-control traffic.

  ### Prioritization
  The alert is rated as medium severity due to the potential for serious compromises to network integrity and data breaches. The likelihood of exploitation increases within environments that utilize remote access tools extensively, making this a notable focus for timely investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to benign use cases of ScreenConnect, as legitimate processes could produce similar command execution patterns. This detection relies on the assumption that malicious use of Windows utilities will be distinguishable from normal administrative operations based on behavior. The required logs include detailed process creation events capturing command line arguments, and proper configuration of logging settings on Windows endpoints is essential for accurate alert generation.

