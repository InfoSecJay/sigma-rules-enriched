detection:
  selection:
    ParentCommandLine|contains|all:
    - ':\Windows\TEMP\ScreenConnect\'
    - 'run.cmd'
    Image|endswith:
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\curl.exe'
    - '\dllhost.exe'
    - '\net.exe'
    - '\nltest.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\rundll32.exe'
    - '\wevtutil.exe'
  condition: selection
falsepositives:
- If the script being executed make use of any of the utilities mentioned in the
  detection then they should filtered out or allowed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious child processes initiated by the ScreenConnect client service, specifically when it utilizes specific executables (such as `cmd.exe` or `powershell.exe`) from a particular path in the Windows TEMP directory. The likely attacker objective could involve executing commands remotely to gain further control over the compromised system or to facilitate lateral movement within the network. This behavior is primarily associated with the MITRE ATT&CK tactic of 'Command and Control' (TA0011) and the technique 'Remote Access Tools' (T1219.002).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) that capture detailed command line information. The potential security impact could be significant if an adversary is leveraging legitimate tools for malicious activity, thus undermining trust in remote management software. However, it is important to note that this detection does NOT alone confirm malicious activity, as legitimate interactions could also trigger the same processes.

  ### Investigation Steps

  - **Examine process creation logs for suspicious entries:** Review Windows Event ID 4688 or Sysmon Event ID 1. Look for parent command lines containing `:\Windows\TEMP\ScreenConnect\` and child executables ending with `\cmd.exe`, `\powershell.exe`, or similar. Record the user context under which these commands were executed.

  - **Verify the legitimacy of ScreenConnect usage:** Determine if ScreenConnect is authorized for remote access on the affected system. Review the application’s version and history of usage patterns to assess any deviations that could indicate potential exploitation.

  - **Identify high-confidence malicious indicators:** Look for command-line arguments used in the detected processes that indicate anomalous or unauthorized activities, especially those not typically associated with legitimate ScreenConnect usage. For example, `-execute` or other unexpected flags could signify exploitation.

  - **Review related user activity logs:** Check user access and authentication logs around the time of the alert (Windows Security Event ID 4624). Identify any unusual logins or successful remote connections that coincide with the suspicious process launch.

  - **Investigate affected asset criticality:** Assess the role and criticality of the host where the alert originated. Assets managing sensitive information or essential services should be prioritized for deeper forensic investigation.

  - **Observe for uncommon cleanup behavior:** Evaluate if any file system cleanup operations (like deletion of scripts or files) occurred shortly after the suspicious commands were detected. Look at Windows Event ID 4663 for file deletions or modifications in the `TEMP` directory that could indicate an attempt to cover tracks.

  ### Prioritization

  The alert's severity is medium given that the presence of remote command execution tools can indicate both legitimate administrative actions and potential nefarious activity. If the suspected behavior aligns with known threat actor tactics and the affected asset is critical to business operations, the likelihood of malicious abuse increases.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to potential adversary evasion techniques, such as obfuscating command lines or using alternative directories. Adequate logging configurations, particularly for process command line parameters and process creation events, are necessary for reliable detection. Legitimate use cases, such as IT support or administrative tasks using ScreenConnect, might trigger this alert, so context around usage history is essential. Related detections, such as monitoring for unusual PowerShell script executions (MITRE T1059.001), strengthen coverage against similar exploitation methods.

