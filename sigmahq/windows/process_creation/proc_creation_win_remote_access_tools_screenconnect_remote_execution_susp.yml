detection:
  selection:
    ParentCommandLine|contains|all:
    - ':\Windows\TEMP\ScreenConnect\'
    - 'run.cmd'
    Image|endswith:
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\curl.exe'
    - '\dllhost.exe'
    - '\net.exe'
    - '\nltest.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\rundll32.exe'
    - '\wevtutil.exe'
  condition: selection
falsepositives:
- If the script being executed make use of any of the utilities mentioned in the detection
  then they should filtered out or allowed.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects potentially malicious child processes initiated by the ScreenConnect client service, specifically those that spawn common Windows command-line utilities or scripting environments. The likely attacker objective is to perform unauthorized actions, such as executing payloads or establishing persistent access to the infected system. This activity aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001) and the technique of Application Layer Protocol (T1219.002).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) where command-line arguments and parent process references are recorded. If successful, this behavior can lead to a compromise of the host and further lateral movement within the network. It is critical to understand that this detection does NOT confirm malicious intent by itself; legitimate use of ScreenConnect or related utilities may trigger this alert.

  ---

  ### Investigation Steps

  - **Verify the parent process command line:** Inspect the Security Event ID 4688 logs for the "ParentCommandLine" field. Confirm if it contains ':\Windows\TEMP\ScreenConnect\' and 'run.cmd'. Legitimate use may show non-malicious commands originating from the ScreenConnect service.

  - **Identify the child process:** Check the “Image” field in Event ID 4688 or Sysmon Event ID 1 for known utilities (e.g., `powershell.exe`, `cmd.exe`). Malicious indicators include any unexpected executions or unusual argument patterns often associated with exploitation, such as invoking scripts or downloading from external sources.

  - **Review historical behavior:** Analyze recent process creation events on the affected host to determine if there has been a spike in activity related to ScreenConnect or the identified utilities. Consistent use of these command-line tools without a specific operational need may indicate malicious behavior.

  - **Examine network connections:** Review firewall or network logs to determine if unusual outbound connections are made following the execution of the child processes. Look for established connections to IPs not typically associated with organizational services, as this may indicate command and control traffic.

  - **Check for persistence mechanisms:** Investigate the system for any Task Scheduler entries or startup items created around the same time as the alert. Malicious users often attempt to establish persistence using legitimate tools like `schtasks.exe` or by modifying registry keys.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems running ScreenConnect, which may be used for legitimate remote access but could also be harnessed by adversaries for deployments of malicious payloads. The likelihood of malicious abuse is heightened given the ongoing exploitation of remote access tools by threat actors, making this behavior relevant for immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the legitimate use of ScreenConnect and common command-line utilities, which can trigger false positives. Comprehensive monitoring relies on having sufficient logging enabled on systems running these services. Moreover, benign activities, such as legitimate administrative tasks utilizing affected utilities, could inadvertently trigger alerts. A related detection that enhances coverage might include monitoring for unusual outbound connections from systems known to employ ScreenConnect.

