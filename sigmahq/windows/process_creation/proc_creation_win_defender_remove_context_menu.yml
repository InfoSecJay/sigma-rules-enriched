note: |
  ### Technical Context

  This Sigma rule detects the deletion of registry keys associated with the Windows Defender context menu using `reg.exe` or PowerShell commands. The likely attacker objective is to hinder security measures by removing the "Scan with Microsoft Defender" option, thus decreasing the ability of users or administrators to manually trigger scans. This behavior corresponds to the MITRE ATT&CK technique "Defense Evasion: Disable or Modify Tools" (T1685).

  The primary telemetry sources are Windows process creation logs, specifically looking for Event ID 4688, along with command line parameters indicating the use of `del`, `Remove-Item`, or modifications to the registry path `\shellex\ContextMenuHandlers\EPP`. If successful, this action may decrease the organization's defense posture, allowing malware to go undetected. This detection does NOT confirm that malicious activity has occurred, as legitimate administrative actions may also trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 for calls to `reg.exe` or PowerShell. Focus on command lines using `del` or `Remove-Item`, specifically looking for relevant actions against `\shellex\ContextMenuHandlers\EPP`.

  - **Analyze command line details**: Check command lines for suspicious patterns, especially those involving `Remove-Item` targeting registry paths. Malicious indicators may include unusual combinations of command line arguments alongside known malicious behaviors.

  - **Identify legitimate usage**: Determine if the alert correlates with legitimate administrative actions. Instances where known IT staff execute registry modifications as part of authorized debloating or customization practices should be documented and compared against the alert.

  - **Cross-reference file modifications**: Check for accompanying file changes or deletions in the system. Validate against performance logs or configuration change records to ensure no critical security files or settings were altered maliciously.

  - **Investigate user account activity**: Review the user account involved in the operation, including logons within the past 24 hours. Legitimate enterprise users executing commands should have a clean access history, while unidentified users or accounts may indicate malicious activity.

  ### Prioritization

  This alert is high severity due to its direct impact on the organization's security capabilities. The likelihood of malicious abuse is significant, particularly when combined with other suspicious activities, as it directly tampers with security tool functionality. The behavior is commonly weaponized by attackers aiming to evade detection and facilitate further malicious actions.

  ### Blind Spots and Assumptions

  Detection may be limited by users customizing systems for non-malicious reasons, such as IT departments modifying configurations during legitimate administrative tasks. The logs must be comprehensively configured, particularly for registry modifications, to ensure reliable detection. Legitimate activities that may trigger alerts include the use of corporate scripts to modify registry keys for application requirements. A related detection could involve tracking unauthorized registry changes more broadly, enhancing overall monitoring for sensitive areas.

