detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_action:
    CommandLine|contains:
    - 'del'
    - 'Remove-Item'
    - 'ri '
  selection_reg_path:
    CommandLine|contains: '\shellex\ContextMenuHandlers\EPP'
  condition: all of selection_*
falsepositives:
- May be part of a system customization or "debloating" script, but this is 
  highly unusual in a managed corporate environment.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the deletion of Windows Defender context menu handler registry keys using `reg.exe` or PowerShell commands, specifically targeting the removal of the "Scan with Microsoft Defender" functionality. The likely attacker objective is to inhibit on-demand malware scans, thus reducing the detection capabilities of the security solution. This relates to the MITRE ATT&CK technique of Defense Evasion (T1562.001).

  The primary telemetry sources include Windows process creation logs, specifically Event ID 4688 for process creation and PowerShell logs. If malicious, this action can lead to increased risk from malware infections due to reduced visibility of security processes. This detection does NOT confirm that a system has been compromised, as this action can also arise from benign customization scripts—though such behavior is uncommon in corporate environments.

  ### Investigation Steps

  - **Check for process creation events:** Review Windows Security Event ID 4688 for process creation logs. Look for entries where `Image` contains `powershell.exe`, `powershell_ise.exe`, `pwsh.exe`, or `reg.exe`. Malicious indicators include these processes executing commands to remove context menu handlers.

  - **Evaluate command line arguments:** Identify any commands within the CommandLine field related to `del`, `Remove-Item`, or `ri `, especially those targeting `\shellex\ContextMenuHandlers\EPP`. High-confidence malicious indicators involve attempting to delete these keys explicitly.

  - **Review user and system context:** Correlate the process creation with user activity during the time frame of the alert. Legitimate customization usually stems from system administration activities; review user roles to determine if the actions seem unusual.

  - **Inspect system for additional defense evasion tactics:** Check for other concurrent Registry modifications that do not align with typical user behavior. Malicious actors may attempt further changes, including enabling persistence mechanisms.

  - **Look for related alerts or evidence of compromise:** Cross-reference current logs with previous alerts that have involved users executing `reg.exe` or PowerShell commands. This could indicate a pattern of evasion that warrants deeper investigation.

  ### Prioritization

  The alert severity is high, given the critical role of Windows Defender in protecting systems from malware. The likelihood of malicious abuse is significant as attackers commonly employ such tactics to hinder security measures, indicating a direct threat to the integrity of the affected system.

  ### Blind Spots and Assumptions

  This detection may miss instances where legitimate administrative tasks lead to context menu alterations, particularly if unauthorized modifications to logging levels have occurred. Furthermore, detection relies on the logging of both process execution and PowerShell activities; ensure that detailed audit logging is configured to capture necessary events. A related detection, such as monitoring for modifications in key security product configurations, can enhance overall detection coverage.

