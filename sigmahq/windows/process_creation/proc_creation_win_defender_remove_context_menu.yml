logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_action:
    CommandLine|contains:
    - 'del'
    - 'Remove-Item'
    - 'ri '
  selection_reg_path:
    CommandLine|contains: '\shellex\ContextMenuHandlers\EPP'
  condition: all of selection_*
falsepositives:
- May be part of a system customization or "debloating" script, but this is highly
  unusual in a managed corporate environment.
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of either `reg.exe` or PowerShell commands to delete the Windows Defender context menu handler within the Windows registry. Specifically, the rule targets scenarios where the "Scan with Microsoft Defender" option is removed from the context menu that appears when users right-click files, directories, or drives. By eliminating this option, attackers aim to obfuscate the presence of malware by preventing on-demand scans, thereby reducing the visibility of the security solution to the user and making it less likely for security incidents to be detected.

  The primary motivation for an attacker utilizing this technique lies in defense evasion, as it directly undermines the host's ability to perform security assessments autonomously. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1562) and its corresponding sub-technique **Indicator Removal on Host** (T1562.001). This method can be employed by various threat actors looking to operate covertly within a compromised environment.

  Key telemetry sources for this detection include process creation logs for Windows, which provide visibility into command-line executions, and the registry logs that capture modifications to system settings.

  ### Investigation Steps
  - **Review Process Creation Logs**: Conduct a thorough analysis of process creation logs to identify instances of `reg.exe`, `PowerShell`, or related executables that contain the specified command-line arguments indicative of context menu removal.
  - **Analyze Command Line Arguments**: Pay close attention to command lines that include `del`, `Remove-Item`, or similar terms, especially in conjunction with paths pointing to the registry key `\shellex\ContextMenuHandlers\EPP`.
  - **Check Registry Modifications**: Investigate registry logs or system state snapshots to confirm whether modifications to the context menu handler were executed, and to identify the timing and source of these changes.
  - **Correlate with User Activity**: Evaluate user behavior around the time of detection to establish if legitimate user actions were misrepresented or if there is a potential indication of malicious behavior.

  ### Prioritization
  Given the high severity of this alert in an enterprise environment, it highlights a critical security evasion tactic that could enable cyber actors to bypass essential protective measures. The likelihood of exploitation, combined with the potential impact of suppressed malware detection, necessitates immediate investigation and response.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly in environments that use extensive customization scripts or "debloating" practices, which can present false positives. The detection logic assumes that the relevant registry keys can be modified through standard processes and that command execution patterns are consistent with this threat. Additionally, success in detecting such activity relies heavily on proper logging configurations for both process creation and registry access, which must be carefully managed to ensure no crucial events are missed.

