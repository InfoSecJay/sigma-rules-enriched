title: Uncommon Userinit Child Process
id: 0a98a10c-685d-4ab0-bddc-b6bdd1d48458
related:
- id: 21d856f9-9281-4ded-9377-51a1a6e2a432
  type: similar
status: test
description: Detects uncommon "userinit.exe" child processes, which could be a 
  sign of uncommon shells or login scripts used for persistence.
references:
- https://cocomelonc.github.io/persistence/2022/12/09/malware-pers-20.html
- https://learn.microsoft.com/en-us/windows-server/administration/server-core/server-core-sconfig#powershell-is-the-default-shell-on-server-core
author: Tom Ueltschi (@c_APT_ure), Tim Shelton
date: 2019-01-12
modified: 2023-11-14
tags:
- attack.privilege-escalation
- attack.t1037.001
- attack.persistence
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\userinit.exe'
  filter_main_explorer:
    Image|endswith: ':\WINDOWS\explorer.exe'
  filter_optional_logonscripts:
    CommandLine|contains:
    - 'netlogon.bat'
    - 'UsrLogon.cmd'
  filter_optional_windows_core:
        # Note: This filter is mandatory on Windows Core machines as the default shell spawned by "userinit" is "powershell.exe".
        # https://learn.microsoft.com/en-us/windows-server/administration/server-core/server-core-sconfig#powershell-is-the-default-shell-on-server-core
    CommandLine: 'PowerShell.exe'
  filter_optional_proquota:
    Image|endswith:
    - ':\Windows\System32\proquota.exe'
    - ':\Windows\SysWOW64\proquota.exe'
  filter_optional_citrix:
    Image|endswith:
            # As reported by https://github.com/SigmaHQ/sigma/issues/4569
    - ':\Program Files (x86)\Citrix\HDX\bin\cmstart.exe'         # https://support.citrix.com/article/CTX983798/purpose-of-cmstart-command
    - ':\Program Files (x86)\Citrix\HDX\bin\icast.exe'         # https://support.citrix.com/article/CTX983798/purpose-of-cmstart-command
    - ':\Program Files (x86)\Citrix\System32\icast.exe'
    - ':\Program Files\Citrix\HDX\bin\cmstart.exe'         # https://support.citrix.com/article/CTX983798/purpose-of-cmstart-command
    - ':\Program Files\Citrix\HDX\bin\icast.exe'         # https://support.citrix.com/article/CTX983798/purpose-of-cmstart-command
    - ':\Program Files\Citrix\System32\icast.exe'
  filter_optional_image_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate logon scripts or custom shells may trigger false positives. Apply 
  additional filters accordingly.
level: high
note: |
  ### Technical Context

  This rule detects instances where an uncommon child process is spawned by `userinit.exe`, which is a legitimate process responsible for user login initialization in Windows environments. This behavior may indicate that an attacker is using persistence techniques, potentially running malicious shells or scripts at user login. The likely attacker objective is to establish a foothold within the system through the execution of unauthorized commands or tools that persist across user sessions.

  Relevant MITRE ATT&CK techniques include Privilege Escalation (T1068) and Persistence (T1037.001). The primary telemetry sources for this detection are Windows process creation logs, specifically related to `userinit.exe` and its child processes. If malicious, the impact can range from unauthorized access to sensitive data to full system compromise. Importantly, this detection alone does NOT confirm malicious activity; it only highlights potential misuse of a legitimate process.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 for instances where `userinit.exe` spawns child processes. Pay attention to the `NewProcessName` and `CommandLine` fields to identify unusual execution patterns.

  - **Identify common benign behaviors:** Look for typical or authorized child processes like `explorer.exe` (common user interface) or legitimate logon scripts (e.g., `netlogon.bat`, `UsrLogon.cmd`). Familiarize yourself with applications and scripts that are known to run post-login.

  - **Flag uncommon command lines:** Investigate any instances of `CommandLine` in process creation logs that contain phrases suggesting persistence (e.g., “PowerShell” or naming conventions for unauthorized scripts). High-confidence indicators of malicious behavior often reference scripting utilities or have unusual arguments.

  - **Analyze systems for atypical roles:** For Windows Server Core installations, where `PowerShell.exe` is spawned by `userinit.exe`, ensure that legitimate administrative tasks or maintenance scripts are validated with known good baselines.

  - **Check for evasion signatures:** Review any corresponding telemetry for filtering out malware obfuscation techniques targeting `userinit.exe`, such as malformed or cryptic paths in `NewProcessName`.

  - **Validate file creation or exfiltration activity:** Look for signs of file creation or transfer that could indicate exfiltration attempts, particularly in conjunction with suspicious process creation events. Use file system monitoring to confirm the presence of unexpected scripts or executable files spawned from the suspicious processes.

  ### Prioritization

  This alert should be considered high priority in an enterprise context due to its potential for significant impact on system security. The behavior is unusual for legitimate operations, which raises the likelihood of malicious activity, especially given that this method of process spawning can be weaponized by threat actors for persistence.

  ### Blind Spots and Assumptions

  Detection can be limited by the use of common administrative tools that may utilize `userinit.exe` for legitimate purposes, potentially resulting in false positives. Assure logging is configured to capture detailed process creation events from all necessary systems, including Server Core versions. Additionally, legitimate startup scripts and administrative tasks that trigger this alert must be closely monitored. A related detection, such as monitoring for unusual `task scheduler` activity, can provide complementary insights into potential malicious behavior.

