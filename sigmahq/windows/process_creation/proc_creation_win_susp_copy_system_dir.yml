title: Suspicious Copy From or To System Directory
id: fff9d2b7-e11c-4a69-93d3-40ef66189767
related:
- id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
  type: derived
status: test
description: |
  Detects a suspicious copy operation that tries to copy a program from system (System32, SysWOW64, WinSxS) directories to another on disk.
  Often used to move LOLBINs such as 'certutil' or 'desktopimgdownldr' to a different location with a different name in order to bypass detections based on locations.
references:
- https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
author: Florian Roth (Nextron Systems), Markus Neis, Tim Shelton (HAWK.IO), 
  Nasreddine Bencherchali (Nextron Systems)
date: 2020-07-03
modified: 2025-11-27
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'copy '
  selection_img_pwsh:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'copy-item'
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_img_other:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_target:
    CommandLine|re|i: \s['"]?C:\\Windows\\(System32|SysWOW64|WinSxS)
  filter_optional_avira:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/c copy'
    - '\Temp\'
    - '\avira_system_speedup.exe'
    CommandLine|contains:
    - 'C:\Program Files\Avira\'
    - 'C:\Program Files (x86)\Avira\'
  condition: 1 of selection_img_* and selection_target and not 1 of 
    filter_optional_*
falsepositives:
- Depend on scripts and administrative tools used in the monitored environment 
  (For example an admin scripts like 
  https://www.itexperience.net/sccm-batch-files-and-32-bits-processes-on-64-bits-os/)
- When cmd.exe and xcopy.exe are called directly     #  C:\Windows\System32\cmd.exe /c copy file1 file2
- When the command contains the keywords but not in the correct order
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious copy operations involving Windows system directories (System32, SysWOW64, WinSxS) using commands or scripts like `copy`, `copy-item`, `robocopy`, or `xcopy`. The likely attacker objective is to relocate known malicious binaries—often referred to as LOLBINs (Living Off the Land Binaries)—to evade security detections associated with their original paths. Relevant MITRE ATT&CK techniques include Defense Evasion (T1036.003).

  Primary telemetry sources include Windows Process Creation logs (Event ID 4688) that detail command line activities, specifically any instances of these commands targeting system directories. If malicious, such actions could lead to unauthorized access or execution of malware. However, this detection does NOT confirm that the identified copy operation is inherently malicious—it may also reflect benign administrative tasks.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 for occurrences of `cmd.exe`, `powershell.exe`, `robocopy.exe`, or `xcopy.exe` commands that include `copy`, `cpi`, and `cp` targeting directories such as `C:\Windows\System32`. This identification is crucial to understand the source and intent of the command.

  - **Identify command line context:** Look for high-confidence malicious indicators by checking the full command line for unusual targets like system directories paired with execution paths of known LOLBINs. Any attempts to copy executables like `certutil.exe` would raise suspicion.

  - **Validate legitimate administrative tasks:** Cross-reference identified command entries with internal administration scripts or tools documented in the environment (e.g., SCCM batch files). Ensure any legitimate copy commands are authorized and produce expected outcomes without targeting system directories.

  - **Check logs for user context:** Verify the user or process context from which the command originated (Event ID 4688, fields like `New_Process_Name`, `Creator_Process_Id`, and `Subject.User_Name`). Administrators performing maintenance should show clear patterns of expected usage that don’t include suspicious copy actions.

  - **Monitor for post-copy activity:** Assess if any file creation or modification events occur post-copy in unusual locations that might indicate further malicious actions. Use file auditing measures or check for file creation events (typically from Event ID 4663) within directories known for storing malicious payloads.

  - **Analyze associated alerts:** Investigate companion detections related to common LOLBIN usage or configurations that move files in unusual ways. Awareness of other detection rules can help corroborate findings and identify if this behavior is part of a larger attack pattern.

  ### Prioritization

  The severity of this alert is medium due to its potential impact if executed on critical systems. The likelihood of malicious exploitation is non-negligible, as attackers frequently employ similar techniques for evading detection during lateral movement or payload delivery. This behavior is weaponized and should be treated with caution.

  ### Blind Spots and Assumptions

  This detection may be evaded through obfuscation techniques such as renaming executables or using alternative command streams that do not specifically invoke `cmd.exe`. Reliability relies on proper monitoring configurations for all Windows process creation logs. Legitimate administrative tasks may trigger this alert, particularly those involving popular administrative scripts or utilities. Related detections, such as those monitoring for unusual execution of LOLBINs (e.g., the use of `certutil.exe`), can enhance overall detection coverage and reduce false positives.

