title: Suspicious Copy From or To System Directory
id: fff9d2b7-e11c-4a69-93d3-40ef66189767
related:
- id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
  type: derived
status: test
description: |
  Detects a suspicious copy operation that tries to copy a program from system (System32, SysWOW64, WinSxS) directories to another on disk.
  Often used to move LOLBINs such as 'certutil' or 'desktopimgdownldr' to a different location with a different name in order to bypass detections based on locations.
references:
- https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
author: Florian Roth (Nextron Systems), Markus Neis, Tim Shelton (HAWK.IO), Nasreddine
  Bencherchali (Nextron Systems)
date: 2020-07-03
modified: 2025-11-27
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'copy '
  selection_img_pwsh:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'copy-item'
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_img_other:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_target:
    CommandLine|re|i: \s['"]?C:\\Windows\\(System32|SysWOW64|WinSxS)
  filter_optional_avira:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/c copy'
    - '\Temp\'
    - '\avira_system_speedup.exe'
    CommandLine|contains:
    - 'C:\Program Files\Avira\'
    - 'C:\Program Files (x86)\Avira\'
  condition: 1 of selection_img_* and selection_target and not 1 of filter_optional_*
falsepositives:
- Depend on scripts and administrative tools used in the monitored environment (For
  example an admin scripts like 
  https://www.itexperience.net/sccm-batch-files-and-32-bits-processes-on-64-bits-os/)
- When cmd.exe and xcopy.exe are called directly     #  C:\Windows\System32\cmd.exe /c copy file1 file2
- When the command contains the keywords but not in the correct order
level: medium
note: |
  ### Technical Context
  This rule detects suspicious copy operations occurring from or to key system directories on Windows, specifically System32, SysWOW64, and WinSxS. Attackers may leverage this behavior to hide malicious files, such as living-off-the-land binaries (LOLBINs) like `certutil` or `desktopimgdownldr`, by copying them to locations with different names to avoid detection by security solutions. The primary goal of such actions typically revolves around evading security mechanisms, maintaining persistence, and potentially executing malicious payloads.

  The detection aligns with several MITRE ATT&CK tactics, notably **Defense Evasion** (TA0005) and the technique **Binary and Archive Colocation** (T1036.003) as it involves moving files to evade detection mechanisms that focus on specific file locations or heuristics. Analysts should monitor process creation events as the source of valuable telemetry, specifically looking at command line arguments associated with `cmd.exe`, `powershell.exe`, and other legitimate file manipulation tools like `xcopy` or `robocopy` in conjunction with the system directory paths.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events related to `cmd.exe`, `powershell.exe`, `xcopy.exe`, and `robocopy.exe`. Pay particular attention to command lines that include copy operations from or to the designated system directories.

  - **Analyze Command Line Arguments**: Look for copy commands executed with suspicious parameters or unusual directory targets. Focus on any use of LOLBINs or common administrative scripts that could be misused by attackers.

  - **Inspect File System Changes**: Investigate file system logs for recent creations, modifications, or moves within the System32, SysWOW64, and WinSxS directories. Make note of timestamps that correlate with the observed process creation events.

  - **Conduct a Threat Intelligence Check**: Cross-reference the findings with existing threat intelligence sources to understand if detected behaviors align with known attack vectors or tactics utilized by threat actors.

  ### Prioritization
  This alert warrants medium severity due to the potential for significant impact on the integrity and security of enterprise systems. The likelihood of malicious activity is increased during active threats and campaigns, making it essential that such operations are investigated promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if legitimate administrative scripts or authorized tools operate in a manner similar to the suspicious behavior defined in this rule. The detection logic assumes that the monitored environment is configured to log all relevant process creation and command-line activity. In cases of incomplete log retention or absence of command-line logging, this alert may not function effectively as intended. Furthermore, benign operations that directly call `cmd.exe` or `xcopy.exe` may trigger false positives, necessitating careful contextual analysis.

