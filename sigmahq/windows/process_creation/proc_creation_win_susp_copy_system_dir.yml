title: Suspicious Copy From or To System Directory
id: fff9d2b7-e11c-4a69-93d3-40ef66189767
related:
- id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
  type: derived
status: test
description: |
  Detects a suspicious copy operation that tries to copy a program from system (System32, SysWOW64, WinSxS) directories to another on disk.
  Often used to move LOLBINs such as 'certutil' or 'desktopimgdownldr' to a different location with a different name in order to bypass detections based on locations.
references:
- https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
author: Florian Roth (Nextron Systems), Markus Neis, Tim Shelton (HAWK.IO), 
  Nasreddine Bencherchali (Nextron Systems)
date: 2020-07-03
modified: 2026-03-16
tags:
- attack.stealth
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'copy '
  selection_img_pwsh:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'copy-item'
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_img_other:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_target:
    CommandLine|re|i: \s['"]?C:\\Windows\\(?:System32|SysWOW64|WinSxS)
  filter_optional_avira:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/c copy'
    - '\Temp\'
    - '\avira_system_speedup.exe'
    CommandLine|contains:
    - 'C:\Program Files\Avira\'
    - 'C:\Program Files (x86)\Avira\'
  condition: 1 of selection_img_* and selection_target and not 1 of 
    filter_optional_*
falsepositives:
- Depend on scripts and administrative tools used in the monitored environment 
  (For example an admin scripts like 
  https://www.itexperience.net/sccm-batch-files-and-32-bits-processes-on-64-bits-os/)
- When cmd.exe and xcopy.exe are called directly     #  C:\Windows\System32\cmd.exe /c copy file1 file2
- When the command contains the keywords but not in the correct order
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious copy operations where an executable or related file is copied from system directories (e.g., System32, SysWOW64, WinSxS) to another location on disk. Attackers may aim to move legitimate low-risk binaries, often referred to as LOLBINs (Living off the Land Binaries), to obscure their presence and evade detection. This behavior typically aligns with the MITRE ATT&CK technique for "Steal or Copy Data" (TA0030) and more specifically, with "Command-Line Interface" (T1059). The primary telemetry source is Windows process creation logs, specifically monitoring actions captured by Event ID 4688. If malicious, this behavior may facilitate further exploitation or lateral movement within the network. It is important to note that this detection does NOT on its own confirm malicious intent; additional corroborating evidence is necessary.

  ### Investigation Steps

  - **Verify process creation events:** Review Windows Security Event ID 4688 to observe the process creation details. Look for `cmd.exe`, `powershell.exe`, or other related executables in the event log, along with command lines containing 'copy' or similar parameters.

  - **Analyze command line specifics:** Investigate the command line fields for the process creation events. Specifically, check for commands that include paths to `C:\Windows\System32`, `C:\Windows\SysWOW64`, or `C:\Windows\WinSxS`. Look for base filenames commonly abused, such as `certutil.exe` or `desktopimgdownldr.exe`.

  - **Determine legitimate administrative usage:** Establish baseline behavior by reviewing documented administrative scripts/processes known to copy files from these system directories (e.g., maintenance scripts). Compare the timestamps and parameters against the suspicious events.

  - **Identify high-confidence malicious indicators:** Look for unusual command sequences or destination paths in Event ID 4688 logs. If any command tries to copy executables to non-standard directories (e.g., user folders or Temp directories), this may indicate malicious activity.

  - **Assess file creation in temporary directories:** Cross-reference with file creation events from Sysmon (Event ID 11) to determine if the copies resulted in new executables appearing in Temp folders or user locations, which could indicate a persistence mechanism.

  - **Evaluate process origins and digital signatures:** Check for the valid digital signatures of the executables involved and their paths. Any unsigned binaries or those from atypical locations could reinforce the suspicion of a malicious action.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of system files being manipulated and the increased likelihood of malicious abuse. The extraction or relocation of executable files from system directories is a known tactic among adversaries, making this behavior a reasonable cause for concern. Prompt investigation is warranted to assess the legitimacy of the activity.

  ### Blind Spots and Assumptions

  Detection may be limited by scripts and administrative tools commonly in use, which can lead to benign triggers of this alert. Required configurations for reliable detection include ensuring comprehensive logging for process creation and maintaining visibility into administrative activities in production. Legitimate activities that may trigger this alert include maintenance scripts copying system files during patching or system updates. A related detection of process command line arguments associated with application whitelisting changes could enhance overall coverage against malicious behavior.

