note: |
  ### Technical Context
  This detection rule identifies potential tampering with Event Trace for Windows (ETW) logging settings in .NET processes by monitoring changes to specific environment variables in the command line. Adversaries may employ this tactic to obscure their activities by disabling or altering logging functions, effectively evading detection by security monitoring tools. The scenario suggests that attackers aim to manipulate the behavior of .NET applications to evade defenses, ensuring their malicious actions remain hidden.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562)**: This technique involves manipulating logging and monitoring mechanisms to evade detection, indicating that an attacker is actively trying to hide their activities.

  The primary data sources for this detection include process creation events which log command line arguments and environment variables utilized by running processes within the Windows environment. Monitoring these aspects is vital to uncover potential tampering.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any process creation events that include the indicators 'COMPlus_ETWEnabled' and 'COMPlus_ETWFlags' in the command line. This can highlight attempts to alter the ETW settings for .NET applications.

  - **Analyze Environment Variable Changes**: Investigate the environment variable modifications in conjunction with command line arguments during identified events. This will aid in confirming whether tampering is intentional and if it correlates with suspicious process activity.

  - **Correlate with Other Security Tools**: Use additional security tools such as EDR and SIEM to cross-reference process activities and check for related events that might indicate a broader attack campaign.

  - **Investigate for Related Indicators**: Look for other associated indicators of compromise, such as unusual process trees or connections in the Windows event logs that may signal malicious activity linked to the tampering detected.

  ### Prioritization
  The alert is deemed high severity due to the potential for significant impact; tampering with ETW logging can allow attackers to operate undetected for extended periods, potentially leading to data theft or system compromise. The likelihood of such actions, especially in environments utilizing .NET applications, increases the urgency for investigation.

  ### Blind Spots and Assumptions
  A gap in detection coverage exists if processes are launched in a way that avoids traditional logging mechanisms, such as through system services or scripts that do not generate standard command line logs. The rule assumes that environment variables can be reliably manipulated within the context of the impacted application. Additionally, the detection relies on consistent and enabled logging of process creation events, which may not be present in all environments, particularly if logging settings have been inadvertently misconfigured or disabled.

