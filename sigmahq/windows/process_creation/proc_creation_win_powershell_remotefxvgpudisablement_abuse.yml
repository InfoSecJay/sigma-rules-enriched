note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `Invoke-ATHRemoteFXvGPUDisablementCommand`, which indicates potential abuse of the `RemoteFXvGPUDisablement.exe` binary. Attackers may aim to execute arbitrary PowerShell code under the guise of a legitimate process, potentially allowing for further malicious actions within the environment. This behavior aligns with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution), where legitimate binaries are misused to execute attacker-controlled commands.

  The primary telemetry source for this rule is Windows process creation logs, specifically focusing on PowerShell command execution. The required log types include Security Event ID 4688 for process creation and Windows Sysmon Event ID 1. If successful exploitation occurs, an adversary may gain unauthorized access to data or systems, which can lead to data exfiltration or lateral movement. Importantly, this detection does NOT confirm that the activity is definitely malicious; the command may also be used in benign scenarios depending on the context.

  ### Investigation Steps

  - **Check process creation logs:** Investigate Security Event ID 4688 logs for the `RemoteFXvGPUDisablement.exe` process. Look for any unusual parent process or command line parameters that deviate from standard usage.

  - **Review PowerShell command details:** Examine the specific command line arguments associated with the event, especially for occurrences of `Invoke-ATHRemoteFXvGPUDisablementCommand` in PowerShell logs (Event ID 4104). Benign usage may include administrative scripts running scheduled tasks.

  - **Analyze execution context:** Look for the user context in which the command was executed. If the command was run by a low-privilege user and involves a sensitive operation, this could indicate malicious intent. Normal administrative tasks typically come from elevated accounts.

  - **Identify recent changes in group policies:** Check Group Policy logs to confirm whether there have been changes relating to RemoteFX settings or specific allowed executables. Legitimate administrative activities might show standard group policy modifications.

  - **Correlate with alert history:** Review previous alerts related to the use of PowerShell or execution of scripts that may exhibit similar behaviors, such as alerts originating from the similar detection IDs (e.g., related `PS Classic`, `PS Module`, `PS ScriptBlock`).

  - **Verify file integrity and creation:** Inspect file systems on the involved host for the presence of unusual binaries or scripts that may have been created around the same time as the alert. Valid indicators will match known safe binaries; presence of suspicious hashes could indicate file tampering.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems if exploited by an attacker. The misuse of signed binaries like `RemoteFXvGPUDisablement.exe` is a common attacker technique for avoiding detection. Given the sophistication of this method, it is likely to be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using legitimate signed binaries, which can complicate differentiating between benign and malicious activities. The rule relies on properly configured process creation logs; any lack of visibility here will hinder detection effectiveness. Legitimate administrative tasks may also trigger this alert, especially in environments actively managing RemoteFX settings. A companion detection could include monitoring for unusual PowerShell script executions that may precede or follow the alert, enhancing overall coverage and context.

