note: |
  ### Technical Context

  This Sigma rule detects the execution of the "Invoke-ATHRemoteFXvGPUDisablementCommand" within the context of PowerShell, which is indicative of attempts to exploit the RemoteFX vGPU technology. By leveraging module load-order hijacking, an attacker may run arbitrary PowerShell code, with the intention of bypassing security measures and potentially executing malicious actions on a compromised system.

  The behavior falls under the MITRE ATT&CK framework, specifically under the tactic "Execution" (TA0002) and technique "Signed Binary Proxy Execution" (T1218). The primary telemetry sources for this detection are Windows process creation logs, particularly monitoring command line arguments within Event ID 4688 for malicious executions. If accomplished successfully, the adversary could gain control, exfiltrate data, or execute further malicious payloads. Importantly, this detection does NOT confirm whether the code executed was malicious or benign on its own—contextual analysis is required.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 for instances where the command line contains either 'Invoke-ATHRemoteFXvGPUDisablementCommand' or its partial variant. Make note of the process ID and the user context in which it ran.

  - **Analyze parent processes:** Identify the parent process of the suspicious execution within the logs (Event ID 4688) to determine if it was spawned from a legitimate application (e.g., a system maintenance task or administration script). Legitimate PowerShell tasks may contain references to built-in modules or administrative actions.

  - **Inspect the command line parameters:** Confirm the command's usage context and additional parameters. Malicious indicators may include execution from unusual directories or without standard system utilities preceding it, which may suggest an abnormal execution path.

  - **Identify any network behavior:** Check for any triggered network activities, such as outbound connections or unusual traffic patterns, that coincide with the execution time of the command. Use network logs and identify Host Connections or Firewall logs for unusual access attempts to external systems.

  - **Review for persistence mechanisms:** Investigate for indicators of compromise (IoCs) linking to persistence post-execution, such as any files created or modified around the same time in the directory containing "RemoteFXvGPUDisablement.exe" or the user's local AppData.

  ### Prioritization

  The alert should be treated with high severity due to the potential impact on critical systems where RemoteFX is employed, typically in virtualized or cloud environments. The likelihood of abuse is significant as tools like AtomicTestHarnesses used for such exploits are readily available, and exploitation of these binaries is a known attacker tactic.

  ### Blind Spots and Assumptions

  This detection may be evaded if the malicious payload is executed in a different context that doesn't invoke the specific command patterns mentioned. Additionally, if logging is misconfigured or lacking (e.g., event tracing disabled), the detection's effectiveness diminishes. Legitimate uses may arise during device configuration or testing environments, which could trigger this alert. For comprehensive coverage, related detections involving PowerShell script execution or process creation anomalies (such as the scripts linked to T1218) should be monitored.

