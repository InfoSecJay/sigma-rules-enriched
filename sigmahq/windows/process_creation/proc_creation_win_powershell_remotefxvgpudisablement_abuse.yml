note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `Invoke-ATHRemoteFXvGPUDisablementCommand`, which is related to the exploitation of the RemoteFX vGPU feature in Windows. Attackers may use this command to execute arbitrary PowerShell code through module load-order hijacking, with the potential objective of bypassing security controls and executing malicious payloads. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (ID: T1218), as it seeks to evade detection mechanisms that protect against unauthorized command execution.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on command lines originating from PowerShell (Event ID 4688). If successful, this activity can have severe implications, potentially leading to unauthorized access, persistence mechanisms, or lateral movement within the network. Importantly, this detection merely indicates a suspicious invocation of the command and does NOT confirm malicious intent on its own.

  ### Investigation Steps

  - **Review the command line arguments:** Check for instances of `Invoke-ATHRemoteFXvGPUDisablementCommand` in process creation logs (Event ID 4688). Note the user context and parent process; atypical user accounts or unusual parent processes (e.g., `powershell.exe` initiated by `explorer.exe`) may indicate a threat.

  - **Correlate with other execution logs:** Look for related PowerShell logs, specifically using `Get-WinEvent` to review Windows PowerShell logs for logs that correspond to the execution timestamp. Inspect for errors or anomalies in `Event ID 4104` that may indicate additional suspicious activity.

  - **Identify legitimate use cases:** Determine if the execution is part of a known administrative task, such as updates or configuration management tasks. Logged executions by known IT accounts with clear purpose typically indicate benign activity.

  - **Assess parent-child process relationships:** Verify the chain of process execution. A benign PowerShell script initializing this command should often follow expected patterns, such as being initiated by a security tool or IT management systems. Suspicious hierarchies (e.g., scripts spawning from unexpected processes) may indicate malicious activity.

  - **Extract user and network activity context:** Inspect user account activity around the time of execution via Event ID 4624 (logon events). Look for unusual user access patterns or failed login attempts that might imply credential theft or misuse.

  - **Validate file creation and persistence artifacts:** Check for unexpected modifications or access to `RemoteFXvGPUDisablement.exe` or other related binaries in the filesystem. Look for new items in System32 or Environment variables that may suggest changes to execution paths that could facilitate malicious activity.

  ### Prioritization

  This alert is high severity due to the critical security implications associated with RemoteFX vGPU exploitation on enterprise systems. Given that unauthorized command execution facilitates malicious actions, and that PowerShell is frequently weaponized for broader attacks, swift investigation is necessary.

  ### Blind Spots and Assumptions

  Limitations of this detection may include conflicts with legitimate administrative use cases of PowerShell for virtualization management, which could trigger false positives. Additionally, this rule relies on detailed process creation logs, thus requiring adequate logging configurations in place. Analysts should be aware that actors may utilize obfuscation techniques or modify command signatures to evade detection. Related detections, such as commonly weaponized PowerShell cmdlets or evidence of other T1218 techniques, can enhance the confidence level of identifying malicious behavior.

