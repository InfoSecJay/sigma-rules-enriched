note: |
  ### Technical Context
  This detection rule identifies the execution of the "driverquery.exe" utility, which serves as a reconnaissance tool that attackers may leverage to gather information about installed drivers on a system. The use of this utility can indicate suspicious behavior, especially when invoked by uncommon parent processes or in unusual contexts, signaling potential reconnaissance by an adversary such as those implementing malware like Ursnif. Attackers often seek information about system drivers to explore potential vulnerabilities or escalate privileges, facilitating deeper access to the network.

  Relevant MITRE ATT&CK tactics include:
  - **Discovery** (T1083): Abusing the driver query tool to gather information about the system.

  The primary data source for this detection is process creation logs from Windows. These logs capture the execution of processes along with their parent processes, which can help analysts identify potentially malicious behavior around the usage of tools like driverquery.

  ### Investigation Steps
  - **Confirm Execution Context**: Review process creation logs for instances of driverquery.exe being executed, paying close attention to the parent process. Look for anomalies such as invocation by cscript.exe or rundll32.exe, which could indicate malicious activity.

  - **Analyze Parent Process Relationships**: Investigate any unusual parent-child process hierarchies involving driverquery.exe. Determine whether the parent processes are legitimate or associated with known malicious activities.

  - **Collect System and Network Context**: Gather additional telemetry around the execution, including logs from EDR or other monitoring tools. Check for any related network activity that may correspond to the execution time of driverquery.exe.

  - **Identify User Accounts**: Check which user accounts executed the command and their associated permissions. Investigate any accounts with privileged access performing this action unexpectedly.

  ### Prioritization
  The alert is rated as medium severity due to the potential for attackers to utilize driverquery.exe for reconnaissance, which can be the precursor to more significant malicious actions or compromise. While the tool itself may have legitimate uses, the context of its invocation is critical in determining the level of threat it poses.

  ### Blind Spots and Assumptions
  One potential blind spot is that legitimate system administrators or automated scripts occasionally use driverquery.exe, leading to possible false positives. The detection logic assumes that all executions of driverquery.exe in contexts associated with known scripting tools or non-standard user directories indicate suspicious behavior. For this rule to function effectively, Windows process creation logging must be enabled and configured properly, capturing all relevant events. Additionally, there may be variations in how processes are spawned in different environments, making it essential to contextualize findings with the specific operational procedures of the organization.

