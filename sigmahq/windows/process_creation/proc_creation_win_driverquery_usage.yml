note: |
  ### Technical Context

  This Sigma rule detects the execution of the `driverquery.exe` utility, which can be leveraged by attackers to gather information on installed drivers on a target system. The likely objective is reconnaissance to identify vulnerabilities in driver configurations for privilege escalation or persistence. This activity falls under the MITRE ATT&CK tactic of **Discovery** (T1082) and the technique **System Information Discovery** (T1082).

  The primary telemetry source is Windows process creation logs, specifically **Security Event ID 4688** and potentially **Sysmon Event ID 1**, which capture process execution data. If executed maliciously, this behavior could indicate an intent to exploit driver vulnerabilities, leading to unauthorized system access. This detection does NOT confirm that an adversary is present; legitimate processes or tools may also invoke this utility.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `driverquery.exe` execution. Focus on the `ProcessCommandLine` field to identify any unusual arguments or parent processes.

  - **Analyze parent process:** Investigate the parent process of `driverquery.exe`. If the parent is a known malicious process (e.g., `cscript.exe`, `mshta.exe`), flag it as suspicious, as these are commonly associated with malicious scripts.

  - **Evaluate user context:** Verify the user executing `driverquery.exe`. Legitimate administrative users may invoke it for troubleshooting, whereas non-admin accounts, especially those without explicit need, warrant further scrutiny.

  - **Identify known benign usage:** Document instances where `driverquery.exe` is used for system maintenance or by trusted third-party tools. These benign uses may include system diagnostics run by system administrators.

  - **Search for high-confidence indicators:** Look for signs of prior reconnaissance activity associated with known threats, such as a suspicious increase in driver querying activity that aligns with adversary behaviors documented in threat intelligence.

  - **Check for follow-on actions:** Examine logs for any subsequent actions taken after `driverquery.exe` execution, such as unexpected modifications to driver settings or system configurations that may indicate exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems when an adversary performs reconnaissance using `driverquery.exe`. The likelihood of malicious intent is increased if it follows the behavior pattern of known threats exploiting similar techniques. Given the reconnaissance nature of this tool, it can lead to weaponized attacks like privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logs due to insufficient logging configurations in enterprise environments. Legitimate activities, such as system administrators routinely using `driverquery.exe`, may trigger this alert, potentially leading to false positives. Related detections include monitoring execution patterns of other system utilities like `sc.exe`, which also fall under the Discovery category and can complement visibility into reconnaissance activities.

