note: |
  ### Technical Context

  This rule detects the use of `fodhelper.exe` to bypass User Account Control (UAC), which is commonly used by adversaries to elevate privileges when executing malicious processes. The likely objective of the attacker is to gain unauthorized access to system resources or execute privileged commands without triggering a UAC prompt. This behavior aligns with the MITRE ATT&CK technique T1548.002 (Bypass User Account Control).

  The primary telemetry sources for this detection are Windows process creation event logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details about the process and its parent process. If this detection indicates malicious behavior, the potential security impact could range from unauthorized data exposure to full system compromise. It is crucial to note that this detection does NOT confirm malicious intent solely based on the use of `fodhelper.exe`, as legitimate applications may also invoke this process.

  ### Investigation Steps

  - **Verify process execution context**: Review Security Event ID 4688 for the creation of processes with `fodhelper.exe` as the ParentImage. Note the User and CommandLine fields to establish if the execution context is that of a legitimate user or an unauthorized account.

  - **Check process command line arguments**: Examine Sysmon Event ID 1 to inspect the command line parameters used with `fodhelper.exe`. Malicious invocations may include unexpected flags or commands that indicate exploitation (e.g., direct execution of a known malicious payload).

  - **Review recent system modifications**: Look into System Event logs for any recent changes to system settings, particularly around Windows UAC settings (Event ID 4657), which may indicate attempts to weaken security controls.

  - **Assess legitimate usage patterns**: Identify typical use of `fodhelper.exe` by investigating the normal application behavior. For example, confirm if `fodhelper.exe` is invoked from trusted system processes by authorized users in expected workflows.

  - **Identify high-risk accounts**: Focus on process executions initiated by accounts with high privileges. Event logs should show instances where `fodhelper.exe` was executed by SYSTEM, Admin users, or accounts that are not regularly associated with UAC bypass attempts.

  - **Check for file creation or modification**: Investigate Event ID 4663 for any creation or modification of sensitive files by processes initiated by `fodhelper.exe`. Legitimate activity should not typically lead to unusual file changes, especially in system or user directories.

  ### Prioritization

  This alert is of high priority due to the potential impact on systems with elevated privileges. The likelihood of malicious abuse is significant, as the use of `fodhelper.exe` for UAC bypass is a recognized technique in modern attacks. Such behaviors are commonly weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate use of `fodhelper.exe` by administrative tasks or software updates. Reliable detection requires appropriate logging settings for Sysmon and Security Event sources. Legitimate applications may trigger this alert when they invoke `fodhelper.exe` for approved system management. A related detection that strengthens this coverage is monitoring for failed access attempts or privilege changes (e.g., Event ID 4673) that often precede or follow UAC bypass attempts.

