note: |
  ### Technical Context

  This rule detects instances where the `Fodhelper.exe` executable is used as a parent process to spawn other processes, which is often indicative of a User Account Control (UAC) bypass. Adversaries aim to execute higher-privileged processes undetected to perform actions that require elevated permissions, such as deploying malware or manipulating system settings. This behavior corresponds to MITRE ATT&CK Technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The primary telemetry source is Windows process creation events, specifically utilizing Security Event ID 4688 and Sysmon Event ID 1. If this behavior is being initiated by an unauthorized user or application, it can lead to unauthorized access to critical resources or extraction of sensitive data. However, this detection alone does not confirm malicious intent, as legitimate applications or users may also invoke `Fodhelper.exe` for valid purposes.

  ### Investigation Steps

  - **Verify the parent process creation:** Check for Security Event ID 4688 with `NewProcessName` containing the target spawned process and `ParentImage` ending with `\fodhelper.exe`. Compare against known legitimate usages.

  - **Correlate user activity:** Review user access logs for the time of process creation to identify if the invoking user has appropriate permissions for the action. Analyze account activity in Security Event Logs (Event ID 4624) to determine whether the user is an authorized administrator.

  - **Identify malicious artifacts:** Look for any spawned process from `Fodhelper.exe` that initiates other known malicious binaries. A Sysmon Event ID 1 log entry should detail the complete command line of any suspicious executables.

  - **Examine command line arguments:** Scrutinize the command line details (e.g., `CommandLine` field in Sysmon Event ID 1) for suspicious flags or arguments that suggest exploitation attempts, such as elevated permission requests without user interaction.

  - **Assess system roles:** Analyze affected systems for their role (e.g., servers, workstations) and criticality. Elevated processes on sensitive servers warrant immediate escalation and investigation.

  - **Review legitimate `Fodhelper.exe` usage:** Validate whether any recent authorized changes have occurred via `Fodhelper.exe`, such as tool updates or legitimate administrative tasks performed around the same timestamp as the alert.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems that might be compromised via UAC bypass techniques. The likelihood of malicious abuse is significant, as this behavior is commonly leveraged in attacks seeking to escalate privileges. Such tactics are well-documented and frequently weaponized by threat actors against enterprises.

  ### Blind Spots and Assumptions

  Detection may miss variants of UAC bypass techniques or alternative parent processes that could achieve the same ends. It's crucial to ensure logging for all relevant process creation events is enabled and configured correctly for reliable detection. Legitimate system management activities may inadvertently trigger this alert, including administrative tasks that utilize `Fodhelper.exe`. Related detections include monitoring for changes in user privilege levels or unusual activity in Windows Event Logs that may indicate further exploitation attempts.

