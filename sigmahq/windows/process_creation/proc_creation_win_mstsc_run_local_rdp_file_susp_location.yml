title: Suspicious Mstsc.EXE Execution With Local RDP File
id: 6e22722b-dfb1-4508-a911-49ac840b40f8
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" 
  file located in suspicious locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_extension:
    CommandLine|endswith:
    - '.rdp'
    - '.rdp"'
  selection_paths:
        # Note: This list of paths is better transformed into a whitelist where you only exclude legitimate locations you use in your env
    CommandLine|contains:
    - ':\Users\Public\'
    - ':\Windows\System32\spool\drivers\color'
    - ':\Windows\System32\Tasks_Migrated '
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - ':\Windows\Tracing\'
    - '\AppData\Local\Temp\'
            # - '\Desktop\' # Could be source of FP depending on the environment
    - '\Downloads\'         # Could be source of FP depending on the environment
  condition: all of selection_*
falsepositives:
- Likelihood is related to how often the paths are used in the environment
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Remote Desktop Connection application (`mstsc.exe`) with a local `.rdp` file located in potentially malicious or suspicious paths, signaling an attempt by an attacker to establish a remote desktop session. The likely objective of this behavior is to remotely control or gain unauthorized access to the victim system through RDP, which can lead to data exfiltration or lateral movement within the environment. This activity correlates with the MITRE ATT&CK tactic of Command and Control (T1219.002), where attackers use RDP to connect to compromised machines.

  The primary telemetry source for this detection includes Windows process creation logs, specifically looking for Event ID 4688 for process creation, and details from the CommandLine field to identify the execution context and files used. If the detected behavior is indeed malicious, the security impact can be significant as it may lead to unauthorized access, system compromise, or data breaches. However, this detection alone does NOT confirm malicious intent; legitimate administrative activities may also generate similar alerts.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 for instances of `mstsc.exe` execution. Look for the creation time, user context, and parent process to determine potential malicious intent versus benign administrative actions.

  - **Investigate the command line used:** Analyze the `CommandLine` field in Event ID 4688 for any `.rdp` files being invoked. Legitimate usage might reference common paths (e.g., user home directories) rather than suspicious locations like `C:\Windows\Temp\` or `C:\Users\Public\`.

  - **Identify the RDP file path:** Check the locations specified in the detection criteria. Files originating from `C:\Downloads\` or `C:\Windows\Temp\` are typical indicators of potential misuse. Validate whether the RDP file is signed or associated with a legitimate use case.

  - **Review user and asset criticality:** Identify the user executing the action and the asset's role. If the system is critical or sensitive, the alert should be treated with higher urgency. Also, determine if the user typically engages in RDP activity.

  - **Cross-reference with other logs:** Search for related logs that might indicate further activity around the same time, such as Windows Event ID 4624 (successful logon) to check for remotely initiated sessions.

  - **Look for indicators of file creation or exfiltration:** Validate if any RDP connections were established by checking logs in Terminal Services or RDP logging to identify the duration and data movement during the session.

  ### Prioritization

  Given the potential for unauthorized access and lateral movement, this alert should be treated as high severity, especially if it involves critical systems or sensitive data. While RDP is a common tool for legitimate administrative work, its misuse is frequently weaponized by adversaries for establishing remote control.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of RDP from common directories or if attacker behavior includes the use of similarly named executables. Log sources must be thoroughly configured to ensure that Windows process creation telemetry is enabled for this detection to be effective. Legitimate activities such as IT support tasks or remote assistance may trigger the alert, creating potential false positives. A companion detection rule focusing on anomalous authentication attempts, such as failed logins prior or during the execution of `mstsc.exe`, would enhance coverage against misuse.

