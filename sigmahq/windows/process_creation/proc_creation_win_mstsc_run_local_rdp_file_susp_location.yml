title: Suspicious Mstsc.EXE Execution With Local RDP File
id: 6e22722b-dfb1-4508-a911-49ac840b40f8
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" file
  located in suspicious locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_extension:
    CommandLine|endswith:
    - '.rdp'
    - '.rdp"'
  selection_paths:
        # Note: This list of paths is better transformed into a whitelist where you only exclude legitimate locations you use in your env
    CommandLine|contains:
    - ':\Users\Public\'
    - ':\Windows\System32\spool\drivers\color'
    - ':\Windows\System32\Tasks_Migrated '
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - ':\Windows\Tracing\'
    - '\AppData\Local\Temp\'
            # - '\Desktop\' # Could be source of FP depending on the environment
    - '\Downloads\'         # Could be source of FP depending on the environment
  condition: all of selection_*
falsepositives:
- Likelihood is related to how often the paths are used in the environment
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the Remote Desktop Connection (Mstsc.exe) with a command-line argument specifying a local ".rdp" file located in potentially suspicious directories. Attackers may use this method to establish unauthorized remote connections, often as part of an initial access or command-and-control maneuver. The relevant MITRE ATT&CK technique is **Remote Desktop Protocol (RDP) - T1219.002**.

  Primary telemetry sources include Windows Process Creation logs (Event ID 4688) and any related Sysmon logs (Event ID 1). If malicious, the security impact can be significant, resulting in unauthorized access and potential data exfiltration or lateral movement within the network. Notably, this detection does NOT confirm that a malicious connection is established, only that an attempt to invoke Mstsc.exe with an RDP file from a suspicious path occurred.

  ---

  ### Investigation Steps

  - **Verify the command line arguments**: Review Windows Security Event ID 4688 logs for Mstsc.exe execution details. Focus on the `CommandLine` field to determine the exact path of the ".rdp" file used. If the command is executed from a path like `C:\Users\Public\`, it may indicate malicious activity if not typical for the environment.

  - **Check for known benign paths**: Identify whether the ".rdp" file was executed from commonly used directories (e.g., Desktop, Personal folders) versus suspicious folders (e.g., `C:\Windows\Temp\` or `C:\Downloads\`). Legitimate usage typically involves user-created RDP files stored in personal directories.

  - **Inspect the related process execution context**: Confirm if any associated process creation logs (Event ID 4688) indicate abnormal parent processes (e.g., scripts, third-party tools) leading to Mstsc.exe. Parent processes showing anomalous behavior could indicate a higher likelihood of malicious activity.

  - **Monitor for network connection logs**: Cross-reference with network security logs (e.g., firewall or monitoring logs) for any outgoing or incoming RDP traffic around the time of the execution. This includes looking for connections made to external or unknown IP addresses that may correlate with the Mstsc.exe invocation.

  - **Review previous RDP connections**: Investigate the Windows Event Log, particularly the Terminal Services logs, for RDP connections occurring after the execution of Mstsc.exe to determine if a successful session was established.

  ---

  ### Prioritization

  The alert is of **high** severity as it indicates potential unauthorized access, which could lead to further exploitation if an attacker gains foothold within compromised systems. The likelihood of malicious abuse is significant as RDP is commonly targeted by adversaries for remote access. Such behavior is weaponized in various attack scenarios, including post-exploitation strategies.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate use of RDP from suspicious paths by authorized users, thus raising potential false positives. The logs must be collected from endpoint devices routinely to ensure reliable detection. Legitimate activities may arise from IT maintenance tasks or user testing scenarios. A related detection that strengthens coverage could include monitoring for unusual parent processes leading to Mstsc.exe executions, as this can provide insight into the command execution context.

