title: Suspicious Mstsc.EXE Execution With Local RDP File
id: 6e22722b-dfb1-4508-a911-49ac840b40f8
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" file
  located in suspicious locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_extension:
    CommandLine|endswith:
    - '.rdp'
    - '.rdp"'
  selection_paths:
        # Note: This list of paths is better transformed into a whitelist where you only exclude legitimate locations you use in your env
    CommandLine|contains:
    - ':\Users\Public\'
    - ':\Windows\System32\spool\drivers\color'
    - ':\Windows\System32\Tasks_Migrated '
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - ':\Windows\Tracing\'
    - '\AppData\Local\Temp\'
            # - '\Desktop\' # Could be source of FP depending on the environment
    - '\Downloads\'         # Could be source of FP depending on the environment
  condition: all of selection_*
falsepositives:
- Likelihood is related to how often the paths are used in the environment
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious usage of the Remote Desktop Protocol (RDP) through the execution of `mstsc.exe` with a local `.rdp` file, particularly when sourced from suspicious or non-standard locations. Attackers may leverage RDP connections to gain unauthorized access to systems, especially when they use local RDP files that might contain configurations for connecting to internal resources. The use of `mstsc.exe` in non-traditional directories, such as temporary folders or public user folders, raises flags for possible lateral movement or command-and-control activities.

  Relevant MITRE ATT&CK tactics and techniques include **Command and Control (TA0011)**, as the connection potentially enables remote control of compromised systems, and **Remote Services: Remote Desktop Protocol (T1219.002)**, which specifically pertains to the use of RDP for unauthorized access to systems. The primary data sources for this detection are process creation events, which log the execution of applications such as `mstsc.exe`, and command-line activity that records how applications are being invoked.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances of `mstsc.exe` execution, paying close attention to the command-line arguments provided during these executions.

  - **Inspect Command-Line Arguments**: Examine the full command-line used with `mstsc.exe`, focusing on any references to `.rdp` files. Look for unusual paths that do not conform to enterprise standards.

  - **Analyze File Locations**: Investigate the locations from which the `.rdp` files are being accessed. Compare these against known safe directories and check for files originating from uncommon or user-specific locations.

  - **Check for User Context**: Verify the user context under which `mstsc.exe` was executed. Determine if the account used is legitimate and whether it has the necessary privileges to utilize RDP connections.

  ### Prioritization
  The severity of this alert is high due to the potential for lateral movement and unauthorized access to sensitive systems via RDP. The likelihood of exploitation through this method is increased by the common usage of RDP in enterprise environments, making it a key vector for attackers.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious RDP access attempts, especially if the attacker uses alternative methods to initiate connections or if they employ benign paths that are deemed safe within the environment. The effectiveness of this rule relies on the presence of comprehensive process creation logging and monitoring of all command-line arguments used. Additionally, the detection logic assumes that the presence of `.rdp` files in specified locations is indicative of potentially malicious activity, which may not hold true in all environments. It is essential to adjust whitelists according to legitimate usage patterns to minimize false positives.

