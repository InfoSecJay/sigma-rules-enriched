title: Renamed Visual Studio Code Tunnel Execution
id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
status: test
description: Detects renamed Visual Studio Code tunnel execution. Attackers can 
  abuse this functionality to establish a C2 channel
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
- https://code.visualstudio.com/docs/remote/tunnels
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-28
modified: 2025-10-29
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_image_only_tunnel:
    OriginalFileName:
    CommandLine|endswith: '.exe tunnel'
  selection_image_tunnel_args:
    CommandLine|contains|all:
    - '.exe tunnel'
    - '--accept-server-license-terms'
  selection_image_tunnel_service:
    CommandLine|contains|all:
    - 'tunnel '
    - 'service'
    - 'internal-run'
    - 'tunnel-service.log'
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/d /c '
    - '\servers\Stable-'
    - 'code-server.cmd'
  filter_main_parent_code:
    ParentImage|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  filter_main_image_code:
    Image|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  condition: (1 of selection_image_* and not 1 of filter_main_image_*) or 
    (selection_parent_tunnel and not 1 of filter_main_parent_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of Visual Studio Code (VS Code) tunnel, specifically instances where the executable has been renamed or manipulated to obfuscate the behavior. Attackers may leverage VS Code tunneling functionality to establish command and control (C2) channels, enabling remote access to compromised systems. This behavior typically aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol: Command and Control over Web Services (T1071.001).

  The primary telemetry sources for this alert are Windows process creation logs, specifically Security Event IDs such as 4688, which provide insights into executed commands and processes. If malicious, the security impact could involve unauthorized access to internal networks or exfiltration of sensitive data. It is important to note that this detection does NOT confirm that the activity is inherently malicious without additional context from surrounding behavior or telemetry.

  ### Investigation Steps

  - **Verify Process Creation Events:** Review Windows Security Event ID 4688 logs for entries related to `code-tunnel.exe` or `code.exe`. Look for command line arguments that may indicate a renaming or abnormal usage, with a focus on those containing `.exe tunnel`.

  - **Examine Parent Process Context:** Assess the parent process of any detected VS Code tunnel executions. Specifically, check for instances with parent command lines ending in `tunnel`, particularly those initiated by `cmd.exe`, which may suggest malicious intent.

  - **Analyze Recent Command Line Usage:** Cross-reference recent command lines that include tunnel-specific arguments such as `--accept-server-license-terms` and `service`. Benign use might include legitimate development activities, while excessive or anomalous executions could indicate potential abuse.

  - **Perform Network Activity Correlation:** Investigate network traffic logs to identify any outbound connections established by the detected processes. Look for unusual connections to external IP addresses, especially if they correspond to known C2 servers or exhibit hidden paths indicative of tunneling.

  - **Identify Legitimate Usage Patterns:** Validate that there are established legitimate workflows involving VS Code tunnels, particularly in development or testing environments. Analyze process creation patterns and command line parameters that typically accompany authorized usage.

  - **Check for Known Malicious Indicators:** Use threat intelligence to check if the executed commands or associated libraries belong to known malicious C2 infrastructure. High-confidence indicators may align with documented malicious payloads utilizing VS Code tunneling.

  ### Prioritization

  The alert should be considered high severity due to the potential for significant impact on sensitive systems if exploited. The likelihood of malicious abuse is heightened, as utilizing tunnels for C2 purposes is a common tactic among adversaries. Furthermore, the presence of renamed executables increases the risk of evasion and successful compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations against adversaries employing obfuscation techniques, such as further renaming or altering command line options to evade detection. Reliable detection requires appropriate logging configurations for process creation and command-line arguments. Legitimate development practices using VS Code tunnels can sometimes trigger this alert, necessitating context-aware analysis. An additional related detection mechanism would be monitoring for unusual outbound network connections which further corroborate potential malicious tunneling activities.

