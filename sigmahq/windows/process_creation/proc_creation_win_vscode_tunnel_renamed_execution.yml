title: Renamed Visual Studio Code Tunnel Execution
id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
status: test
description: Detects renamed Visual Studio Code tunnel execution. Attackers can abuse
  this functionality to establish a C2 channel
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
- https://code.visualstudio.com/docs/remote/tunnels
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-28
modified: 2025-10-29
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_image_only_tunnel:
    OriginalFileName:
    CommandLine|endswith: '.exe tunnel'
  selection_image_tunnel_args:
    CommandLine|contains|all:
    - '.exe tunnel'
    - '--accept-server-license-terms'
  selection_image_tunnel_service:
    CommandLine|contains|all:
    - 'tunnel '
    - 'service'
    - 'internal-run'
    - 'tunnel-service.log'
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/d /c '
    - '\servers\Stable-'
    - 'code-server.cmd'
  filter_main_parent_code:
    ParentImage|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  filter_main_image_code:
    Image|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  condition: (1 of selection_image_* and not 1 of filter_main_image_*) or (selection_parent_tunnel
    and not 1 of filter_main_parent_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious execution of Visual Studio Code (VSCode) tunnels, which can be abused by attackers to establish command and control (C2) channels. Attackers may leverage VSCode's tunneling functionality to access internal systems without detection. By renaming executables or manipulating command-line arguments, they can attempt to bypass security controls, making it crucial for defenders to recognize these anomalies.

  The relevant MITRE ATT&CK tactics include **Command and Control** (T1071.001), which refers to application layer protocols for C2 communications, and **Application Layer Protocol** (T1219), where attackers use legitimate software to transfer data illicitly. The primary telemetry for detection primarily includes process creation events from Windows, which document attempted execution of potentially malicious commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for any executions of `code-tunnel.exe` or `code.exe`, particularly those with command lines containing the string 'tunnel'. Check the parent processes for any suspicious behavior.
  - **Examine Command-Line Arguments**: Investigate instances where the command line includes combinations of keywords like 'tunnel', '--accept-server-license-terms', and other unusual parameters. Look for executions that deviate from typical usage of the VSCode tunneling feature.
  - **Assess Network Traffic**: Check for unusual network connections initiated by the identified processes. Monitor for unexpected outbound traffic patterns pointing to external servers, which may indicate a covert C2 communication attempt.
  - **Validate Application Integrity**: Ensure the integrity of VSCode installations and verify that they have not been modified or tampered with. Be alert for any use of renamed executable files that could indicate malicious tampering.

  ### Prioritization
  The alert's severity is high because the execution of a renamed VSCode tunnel can indicate a sophisticated attack where an attacker aims to maintain persistent access to sensitive internal resources. Given the potential impact of such incidents, timely identification and response are critical.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that legitimate use of VSCode tunneling by employees may generate false positives, especially if users are permitted to rename executables as per their workflows. The detection logic assumes that unusual command line patterns or renamed executables are indicators of malicious behavior. For the alert to function effectively, it relies on comprehensive process creation logging and visibility into network connections that may be obscured by encryption or advanced evasion techniques of an attacker.

