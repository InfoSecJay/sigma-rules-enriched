note: |
  ### Technical Context

  This rule detects the creation of local users on Windows systems using the `net.exe` command, which is often utilized by attackers to establish persistence post-compromise. The likely objective of the attacker is to create a new user account for continued access or to escalate privileges on the system. This corresponds with the MITRE ATT&CK technique for persistence, specifically T1136.001 (Create Account). The primary telemetry sources include Windows process creation logs, such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized access and control over the affected systems. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the rule.

  ### Investigation Steps

  - **Verify process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for processes ending with `\net.exe` or `\net1.exe`. Look for suspicious command line arguments indicating user creation.

  - **Inspect command line parameters:** Focus on command lines containing both `user` and `add` options to confirm the user's intent. For benign activity, expect to see administrative users or system accounts; malicious indicators would involve unusual usernames or unexpected invocation contexts.

  - **Review user account lists:** Validate the newly created user against existing accounts via `net user` command output or query Active Directory. Legitimate administrative actions usually involve well-documented user account creation for named projects or specific purposes.

  - **Assess system role and criticality:** If the affected system is a Domain Controller or sensitive server, prioritize the alert for additional investigation and immediate containment considerations.

  - **Document file creation processes:** Confirm if the `net.exe` command resulted in any persistent artifacts (e.g., created user profile directories) or unusual modifications in Account Management Event ID 4720 (User Account Created).

  ### Prioritization

  This alert should be considered of medium severity due to its potential impact on system security, particularly if it occurs on critical systems. The likelihood of malicious abuse is significant, as the behavior directly aligns with known tactics for establishing persistence. While not all instances are malicious, the nature of `net.exe` usage in account creation warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by misconfigurations or the lack of logging for `net.exe` executions. Attackers could also employ evasion techniques, such as creating accounts through alternative methods (e.g., PowerShell). Legitimate administrative tasks from helpdesk personnel or automated scripts can also trigger the alert. Companion detections, such as monitoring for suspicious changes in Group Policy or local user privileges, would enhance overall coverage and context around the alert.

