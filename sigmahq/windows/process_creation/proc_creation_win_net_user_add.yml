note: |
  ### Technical Context
  This detection rule identifies the creation of local users through the `net.exe` command, which can be indicative of malicious activity. Attackers may use the `net.exe` utility to create local accounts for various malicious objectives, such as establishing persistence on a compromised system or escalating privileges. By monitoring these activities, organizations can identify potential insider threats or external intrusions attempting to manipulate user accounts for unauthorized access.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (Tactic): Attacker aims to maintain a foothold in the environment.
    - **T1136.001 - Create Account**

  Primary data sources that will provide useful evidence for detecting this activity include:
  - **Process Creation Events**: Logs that capture command executions on Windows systems, including user creation commands.
  - **Security Event Logs**: Monitoring for specific Event IDs associated with account creation can complement this detection.

  ### Investigation Steps
  - **Review Process Creation Events**: Check the logs for instances of `net.exe` or `net1.exe` with arguments indicating user account creation (e.g., containing `user` and `add`).
  - **Correlate with Security Event Logs**: Look for associated Windows Event IDs such as 4720 (User Account Created) that might correlate with the process creation activity.
  - **Validate User Activity**: Assess whether the created user accounts align with legitimate business operations, particularly focusing on the timestamps and users involved.
  - **Examine Related System Activity**: Analyze additional system logs that may indicate suspicious behavior following user creation, such as unusual login patterns or privilege escalation attempts.

  ### Prioritization
  This alert should be considered of medium severity, as the ability to create local user accounts can facilitate further illicit actions by an attacker, impacting both data integrity and confidentiality. The likelihood of exploitation in environments with inadequate user access controls may increase the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of user creation, particularly those executed via other legitimate management tools or interfaces. It also assumes that `net.exe` is the primary or only method being employed for such tasks in the environment. Insufficient log configurations or lack of process creation logging could hinder this alert's effectiveness, emphasizing the need for proper logging policies to be in place across Windows systems.

