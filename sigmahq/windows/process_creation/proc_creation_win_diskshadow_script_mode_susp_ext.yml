logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_flag:
    CommandLine|contains|windash: '-s '
  filter_main_ext:
        # Note: can be changed to an "endswith" to avoid rare FPs. But you need to account for quoted paths
        # Note: Using the ".txt" is based on the MS documentation example. Best add the extension you use internally before using this rule
    CommandLine|contains: '.txt'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- False postitve might occur with legitimate or uncommon extensions used internally.
  Initial baseline is required.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `Diskshadow.exe` in script mode when a script with an uncommon file extension is invoked. `Diskshadow.exe` is a tool for creating and managing volume shadow copies, often leveraged by attackers for data exfiltration, persistence, or evading detection. In scenarios where an attacker aims to harvest sensitive credential information from shadow copies, they might use this utility with malicious intent. Detecting its use with uncommon extensions can help uncover advanced threats such as ransomware or credential dumping, as attackers frequently utilize legitimate tools in unorthodox ways to avoid detection.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and techniques such as **Execution - Command and Scripting Interpreter** (T1218), where attackers manipulate scripting environments to execute payloads discreetly. The primary data sources for this detection come from process creation logs, which capture detailed information about executed processes, command line arguments, and associated image names.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for `diskshadow.exe` executions, focusing on command line arguments to identify any unusual script extensions being invoked.
  - **Examine Script Content:** If available, retrieve and inspect the content of any uncommon scripts executed. This can reveal malicious intentions, such as data manipulation or exfiltration attempts.
  - **Correlate with Other Activities:** Look for other suspicious activities occurring around the same time, such as unusual file accesses, lateral movement indicators, or known threat actor behavior patterns.
  - **Conduct Initial Baselining:** Establish a baseline of legitimate use of `diskshadow.exe` within the environment to differentiate between normal and potentially malicious executions. This includes documenting acceptable script file extensions and execution contexts.

  ### Prioritization
  Given the tool’s legitimate uses for backup and recovery processes, but potential for misuse in credential dumping or data exfiltration, alerts from this detection should be prioritized as medium severity. Any misuse indication can lead to significant impact if attackers exploit volume shadow copies.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if organizations do not log all process creation events or lack comprehensive command line logging. Additionally, the rule assumes that uncommon script extensions can be accurately identified and are not part of legitimate operations. Organizations must ensure that their logging configurations capture necessary execution details to empower this detection effectively.

