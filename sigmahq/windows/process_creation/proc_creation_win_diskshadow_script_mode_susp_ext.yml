detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_flag:
    CommandLine|contains|windash: '-s '
  filter_main_ext:
        # Note: can be changed to an "endswith" to avoid rare FPs. But you need to account for quoted paths
        # Note: Using the ".txt" is based on the MS documentation example. Best add the extension you use internally before using this rule
    CommandLine|contains: '.txt'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- False postitve might occur with legitimate or uncommon extensions used 
  internally. Initial baseline is required.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Diskshadow.exe in script mode using potentially uncommon script file extensions (e.g., .txt) to execute commands. Adversaries may use this technique to perform unauthorized actions, such as creating or managing shadow copies to facilitate data exfiltration or persistence. The relevant MITRE ATT&CK Tactic is **Defense Evasion (T1218)**. Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) that detail command line arguments and the originating executable path. If this behavior is malicious, it could enable unauthorized backups or data capture, circumventing standard security measures. This detection does NOT confirm malicious intent on its own and requires further contextual investigation.

  ### Investigation Steps

  - **Examine the command line execution detail**: Review Security Event ID 4688 logs for the command line used with Diskshadow.exe. Look for the presence of '-s ' indicating script mode and verify if the script extension is uncommon (e.g., .txt rather than .vss). Legitimate use cases typically involve common script extensions, so note deviations.

  - **Correlate process lineage**: Check Sysmon Event ID 10 (Process Access) to identify parent processes related to the Diskshadow.exe execution. Ensure that the parent processes are legitimate (e.g., PowerShell, CMD) and not indicative of an adversary trying to masquerade their activity through misleading parent-child relationships.

  - **Review corresponding user activity**: Investigate user account activity at the time of the alert (Event ID 4624). Verify if the account executing Diskshadow.exe has an appropriate role, such as a backup administrator. Legitimate usage should align with typical backup or system maintenance schedules.

  - **Look for unusual file paths**: Investigate the file path of the Diskshadow.exe process. Confirm that it originates from a standard system directory (e.g., "C:\Windows\System32\"). Executables run from unusual directories may indicate potential compromise.

  - **Assess system configuration**: Collect and analyze system configuration changes (e.g., Event ID 5145 logs for file access) related to potential shadow copy creation to recognize unauthorized changes that align with the alert's context.

  - **Identify high-confidence indicators**: Analyze for high-confidence malicious indicators such as known bad hashes or paths related to the execution of Diskshadow with uncommon extensions. Use threat intelligence feeds to confirm the presence of these indicators.

  ### Prioritization

  This alert should be considered medium priority due to the potential for data exfiltration or system manipulation if exploited. While the use of Diskshadow for legitimate administrative tasks is common, the triggering of this specific Sigma rule suggests a higher likelihood of malicious abuse, particularly with uncommon script extensions.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques, such as the use of whitelisted file extensions that are commonly accepted for legitimate operations. The accuracy of detection depends on the consistent logging configurations for process creation and access events. Legitimate activities may include routines for backup maintenance or other administrative tasks using standard file extensions. A related detection to strengthen coverage would include monitoring for unusual command line arguments on other Windows administrative tools (e.g., VSSADMIN).

