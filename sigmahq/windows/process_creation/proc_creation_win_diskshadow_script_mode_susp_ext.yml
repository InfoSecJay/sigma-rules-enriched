detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_flag:
    CommandLine|contains|windash: '-s '
  filter_main_ext:
        # Note: can be changed to an "endswith" to avoid rare FPs. But you need to account for quoted paths
        # Note: Using the ".txt" is based on the MS documentation example. Best add the extension you use internally before using this rule
    CommandLine|contains: '.txt'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- False postitve might occur with legitimate or uncommon extensions used 
  internally. Initial baseline is required.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of "Diskshadow.exe" in script mode with an uncommon script extension, specifically when a command line argument containing '.txt' is detected. The likely goal of an attacker using this technique is to leverage Diskshadow’s capabilities for unauthorized data access or modification, targeting backup files or system states, especially within Windows environments. This behavior falls under the MITRE ATT&CK technique T1218 (Execution via Tool), related to attacks that utilize built-in Windows tools for malicious purposes.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1 which provide detailed insights into command-line arguments and executable paths. If malicious, the execution of Diskshadow with unconventional extensions could lead to data exposure or system compromise. It is important to note that this detection does NOT confirm malicious activity on its own but indicates further investigation is warranted.

  ### Investigation Steps

  - **Check executing command line details:** Look at Security Event ID 4688 or Sysmon Event ID 1 for the specific command line used to launch Diskshadow.exe. Focus on `CommandLine` field for the presence of `-s` and an uncommon extension such as '.txt'. Legitimate use usually involves common extensions like '.vss' without uncommon modifications.

  - **Correlate process origin:** Investigate the execution path of Diskshadow.exe to determine if it originated from a standard location like `C:\Windows\System32`. Unusual paths (e.g., temporary directories or user-specific application folders) may indicate malicious intent.

  - **Review parent process:** Identify and analyze the parent process of Diskshadow.exe to determine how it was invoked. A legitimate parent process such as `cmd.exe` initiated by a known administrator is less suspicious compared to a non-standard process that typically doesn’t invoke Diskshadow.

  - **Monitor for file modifications:** Alert on any subsequent file changes or backups created by Diskshadow.exe, focusing on critical system files or backups (`NTDS.dit`, etc.). Review logged activity correlating to the source and size of files to differentiate between expected and potentially malicious actions.

  - **Examine unusual extensions:** Conduct a preliminary analysis to determine if any uncommon script extensions (e.g., `.txt` or others) are widely used within the environment, which might generate false positives. Create a baseline of allowed script file types utilized within your organization to improve detection accuracy.

  - **Investigate previous instances:** Look back for any prior executions of Diskshadow.exe with similar parameters. Analyze patterns in execution and the files impacted subsequent to the executions to identify repeat offenders or potential breaches that align with the noted activities.

  ### Prioritization

  The alert should be treated as medium severity due to its potential to compromise critical systems and data. Diskshadow.exe is a legitimate Windows tool that, if misused, can lead to severe outcomes such as unauthorized data manipulation. While script mode execution is not common, its use in attacks like credential dumping and persistence makes it essential to assess the likelihood of malicious abuse in the environment.

  ### Blind Spots and Assumptions

  This detection could be evaded through the use of obfuscation techniques or renaming of scripts. The accurate detection and logging of Diskshadow command executions require proper Sysmon configuration and consistent monitoring of relevant process activity. Legitimate administrative activities may trigger alerts, particularly in complex environments where backup or recovery operations are frequent. Related detections, such as monitoring for unusual child processes of Diskshadow.exe, can help strengthen coverage against sophisticated evasion tactics.

