title: Suspicious RunAs-Like Flag Combination
id: 50d66fb0-03f8-4da0-8add-84e77d12a020
status: test
description: Detects suspicious command line flags that let the user set a target
  user and command as e.g. seen in PsExec-like tools
references:
- https://www.trendmicro.com/en_us/research/22/k/hack-the-real-box-apt41-new-subgroup-earth-longzhi.html
author: Florian Roth (Nextron Systems)
date: 2022-11-11
tags:
- attack.privilege-escalation
logsource:
  category: process_creation
  product: windows
detection:
  selection_user:
    CommandLine|contains:
    - ' -u system '
    - ' --user system '
    - ' -u NT'
    - ' -u "NT'
    - " -u 'NT"
    - ' --system '
    - ' -u administrator '
  selection_command:
    CommandLine|contains:
    - ' -c cmd'
    - ' -c "cmd'
    - ' -c powershell'
    - ' -c "powershell'
    - ' --command cmd'
    - ' --command powershell'
    - ' -c whoami'
    - ' -c wscript'
    - ' -c cscript'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of suspicious command line flags associated with tools that may allow an attacker to run processes with elevated privileges or impersonate legitimate users. Specifically, it identifies command line arguments commonly seen in PsExec-like utilities that enable users to specify a target username and command for execution, often abused in privilege escalation scenarios. These activities might suggest unauthorized attempts to run commands on behalf of higher-privilege accounts, typical of post-exploitation behavior.

  The likely threat scenario involves a malicious actor attempting to gain elevated access within a compromised environment, possibly targeting administrative accounts such as 'system' or 'administrator'. The objective could be to execute payloads, gain further access, or exfiltrate sensitive data. Relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)** and specific techniques like **Tactical Use of Command-Line Interfaces (T1059)** and **Process Injection (T1055)**, as they relate to running commands in the context of high-privilege user accounts.

  The primary data sources that will provide valuable evidence for this detection include process creation events from Windows, particularly focusing on the command line arguments that are logged during the execution of processes.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Gather the Windows process creation logs from the endpoint agent or SIEM to review instances where suspicious command line arguments were provided.
  - **Analyze User Context:** Look for unusual usage of privilege escalation tools based on the user context under which the processes executed, especially for administrative accounts.
  - **Review Command Execution Attempts:** Check for any commands that use the 'cmd' or 'powershell' flags in conjunction with targeted usernames as defined in the detection rule.
  - **Investigate Related Events:** Examine other logs (such as authentication logs, firewall logs) for additional suspicious activity or patterns that might correlate with the detected process creation events.

  ### Prioritization
  The alert's severity is medium due to the potential impact of allowing unauthorized process execution under high-privilege user contexts, which could lead to greater compromise within the enterprise environment. Given the likelihood of exploitation tactics, these indicators warrant timely investigation efforts.

  ### Blind Spots and Assumptions
  This detection may lack coverage for less common command-line tools that employ similar flag structures but are not recognized as PsExec-like tools. It assumes that process creation logs are correctly configured and accessible for the analysis. Additionally, the rule may trigger false positives from legitimate administrative actions that use similar command line arguments for valid purposes, thus requiring careful contextual analysis to differentiate between genuine activity and malicious conduct.

