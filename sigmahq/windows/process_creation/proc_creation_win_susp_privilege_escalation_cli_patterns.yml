title: Suspicious RunAs-Like Flag Combination
id: 50d66fb0-03f8-4da0-8add-84e77d12a020
status: test
description: Detects suspicious command line flags that let the user set a 
  target user and command as e.g. seen in PsExec-like tools
references:
- https://www.trendmicro.com/en_us/research/22/k/hack-the-real-box-apt41-new-subgroup-earth-longzhi.html
author: Florian Roth (Nextron Systems)
date: 2022-11-11
tags:
- attack.privilege-escalation
logsource:
  category: process_creation
  product: windows
detection:
  selection_user:
    CommandLine|contains:
    - ' -u system '
    - ' --user system '
    - ' -u NT'
    - ' -u "NT'
    - " -u 'NT"
    - ' --system '
    - ' -u administrator '
  selection_command:
    CommandLine|contains:
    - ' -c cmd'
    - ' -c "cmd'
    - ' -c powershell'
    - ' -c "powershell'
    - ' --command cmd'
    - ' --command powershell'
    - ' -c whoami'
    - ' -c wscript'
    - ' -c cscript'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of suspicious command-line flag combinations indicative of privilege escalation techniques, particularly those similar to PsExec. These combinations often suggest that an adversary is attempting to execute commands under a different user context, which could facilitate unauthorized access or control over a system. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (Tactics: TA0004) and specifically targets the technique of Assumed User Identity (T1068).

  The primary telemetry source for this detection is Windows process creation activities, particularly tracked through Security Event ID 4688 and Sysmon Event ID 1. The malicious potential of such behavior can lead to significant security impacts, including unauthorized system compromise and lateral movement. However, it should be noted that this detection does NOT conclusively prove malicious intent on its own; legitimate administrative tasks could trigger this alert.

  ### Investigation Steps

  - **Identify event details:**
    Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs for process creation details. Look for command lines containing flags like “-u system” or “-c cmd” to confirm matches with detected patterns.

  - **Assess user context:**
    Determine the user context in which the suspicious command was executed. Verify whether the user initiating this command has the appropriate permissions; unexpected usage by non-administrative users may indicate malicious intent.

  - **Evaluate legitimate activity:**
    Compare the detected command line execution with known administrative scripts or maintenance tasks. Identify if similar command flags have been historically used in your environment by legitimate accounts.

  - **Check for high-confidence malicious indicators:**
    Investigate if the detected commands are attempting to invoke command execution frameworks like PowerShell or WMI in a suspicious manner. Look specifically for parameters like “-c powershell” that could indicate an attempt to execute scripts with elevated privileges.

  - **Correlate with other telemetry:**
    Search for correlation with other logs such as authentication logs, network connections, or file alterations to identify if this command execution is part of a broader attack vector.

  - **Examine recent changes:**
    Review any recent changes in user roles, permissions, or group memberships on impacted systems that may provide context to the privilege escalation attempt.

  ### Prioritization

  The alert should be considered medium severity given potential impacts on critical systems or sensitive data access if exploited. The likelihood of malicious abuse is notable, as the command-line patterns detected are commonly associated with known privilege escalation tactics. This behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection could be limited by the absence of required log collection from Windows devices, which may result in missed events. Legitimate administrative actions, such as scheduled tasks or updates, could trigger false positives. Additionally, evasion techniques may include altering command line arguments slightly to avoid detection. A related detection to enhance visibility is monitoring for unusual process hierarchy that may indicate lateral movement or malicious command initiation.

