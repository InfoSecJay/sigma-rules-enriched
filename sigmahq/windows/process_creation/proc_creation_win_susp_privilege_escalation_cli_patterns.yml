title: Suspicious RunAs-Like Flag Combination
id: 50d66fb0-03f8-4da0-8add-84e77d12a020
status: test
description: Detects suspicious command line flags that let the user set a target
  user and command as e.g. seen in PsExec-like tools
references:
- https://www.trendmicro.com/en_us/research/22/k/hack-the-real-box-apt41-new-subgroup-earth-longzhi.html
author: Florian Roth (Nextron Systems)
date: 2022-11-11
tags:
- attack.privilege-escalation
logsource:
  category: process_creation
  product: windows
detection:
  selection_user:
    CommandLine|contains:
    - ' -u system '
    - ' --user system '
    - ' -u NT'
    - ' -u "NT'
    - " -u 'NT"
    - ' --system '
    - ' -u administrator '
  selection_command:
    CommandLine|contains:
    - ' -c cmd'
    - ' -c "cmd'
    - ' -c powershell'
    - ' -c "powershell'
    - ' --command cmd'
    - ' --command powershell'
    - ' -c whoami'
    - ' -c wscript'
    - ' -c cscript'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This detection identifies potentially malicious use of PsExec-like command line flags that allow users to execute commands as a different user (e.g., 'system' or 'administrator'). Attackers may employ these techniques to escalate privileges, deploy malware, or execute further reconnaissance commands within a compromised environment. This behavior aligns with the MITRE ATT&CK framework, specifically T1068 (Exploitation for Client Execution) and T1203 (Exploitation of Vulnerability in Software).

  The primary telemetry source is the process creation logs, specifically Security Event ID 4688, which captures the command line arguments used during process execution on Windows systems. If leveraged by an adversary, this behavior can lead to significant unauthorized access and control of critical systems. Importantly, this detection alone does not confirm malicious intent; it only highlights potential misuse of command line capabilities.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs:** Inspect Security Event ID 4688 for the affected process. Look for the CommandLine field containing suspicious flags such as ' -u system ' or ' --user administrator '. Ensure to validate the process's parent ID to identify the initiating process.

  - **Cross-Reference with User Roles:** Confirm if the user executing the command typically requires elevated permissions for the given action. Verify if this user context matches legitimate operational behaviors for that user role.

  - **Check for Recent Elevated Activity:** Investigate if the command execution correlates with other security events, such as Event ID 4672 (Special Privileges Assigned to New Logon) which may indicate elevated permissions were recently granted to the user.

  - **Identify Malicious Indicators:** Look for command line arguments such as ' -c cmd', ' -c "powershell', or ' --command powershell'. These are common indicators of unauthorized command execution aiming to establish persistence or execute malware.

  - **Validate Known Legitimate Use Cases:** Determine whether any documented operational procedures or maintenance scripts utilize similar command line flags. Cross-check with the team managing user permissions.

  - **Assess for File Creation Artifacts:** Investigate related file system activity for created or modified files often associated with this elevated command execution (e.g., temporary files created within 'C:\Windows\Temp\' or script files executed).

  ---

  ### Prioritization

  The severity of this alert is medium. While it may indicate misuse of privilege escalation techniques, the specific context of use and the affected system's role will determine the actual risk level. This behavior is weaponized in some attacks, yet it may also originate from benign administrative tasks, necessitating careful evaluation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by various user activities that utilize similar command structures, potentially leading to false positives. Ensure process creation logging is thoroughly configured to capture all necessary command line details. Activities like legitimate software installations or scheduled tasks could trigger this alert. Companion detections such as suspicious PowerShell activity (e.g., via Event ID 4104) can enhance overall coverage and detection effectiveness.

