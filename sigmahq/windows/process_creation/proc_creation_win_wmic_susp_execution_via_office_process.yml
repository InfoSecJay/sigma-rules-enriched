detection:
  selection_parent:
    ParentImage|endswith:
    - '\WINWORD.EXE'
    - '\EXCEL.EXE'
    - '\POWERPNT.exe'
    - '\MSPUB.exe'
    - '\VISIO.exe'
    - '\MSACCESS.EXE'
    - '\EQNEDT32.EXE'
    - '\ONENOTE.EXE'
    - '\wordpad.exe'
    - '\wordview.exe'
  selection_wmic_img:
  - Image|endswith: '\wbem\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains|all:
    - 'process'
    - 'create'
    - 'call'
    CommandLine|contains:
            # Add more suspicious LOLBINs as you see fit
    - 'regsvr32'
    - 'rundll32'
    - 'msiexec'
    - 'mshta'
    - 'verclsid'
    - 'wscript'
    - 'cscript'
  condition: all of selection_*
falsepositives:
- Unknown
