note: |
  ### Technical Context

  This rule detects the execution of Windows Management Instrumentation Command-line (WMIC) initiated from a known Office application process (e.g., WINWORD.EXE, EXCEL.EXE). The underlying behavior suggests that an attacker may be leveraging WMIC to execute commands indirectly through a trusted Office application, a common tactic known as living-off-the-land (LOLBIN). The likely objective is to evade detection while performing reconnaissance or executing payloads that facilitate lateral movement or escalation of privileges.

  This detection aligns with the MITRE ATT&CK framework, specifically mapping to tactics such as Execution (ID T1204.002) and Defense Evasion (ID T1218.010). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to significant security issues, such as unauthorized access or data exfiltration. However, it is crucial to note that this rule does NOT confirm malicious activity on its own, as legitimate processes could also invoke similar WMIC commands.

  ### Investigation Steps

  - **Verify Process Parentage:** Check the parent process of the WMIC execution using Security Event ID 4688. Look for Office applications (e.g., WINWORD.EXE) as the direct parent. Be cautious if the WMIC execution does not follow standard user behavior during Office application usage.

  - **Review Command-Line Arguments:** Analyze the command-line details from Event ID 4688/Sysmon Event ID 1 for WMIC execution. Look for indicators such as 'process create' combined with calls to known LOLBINs (e.g., regsvr32, rundll32). Legitimate use cases typically do not include attempts to manipulate processes from Office apps.

  - **Cross-Reference with User Activity:** Investigate user activity surrounding the time of the alert using Windows Security Event ID 4624 (Logon) to correlate the WMIC execution with the user's authorized workflows. Legitimate operations should align with typical productivity activities.

  - **Inspect System Event Logs for Suspicious Activity:** Analyze Windows Event Logs (Event ID 4697 for service creation or Event ID 7045 for new service installation) to check for unexpected services or unusual application behaviors tied to the Office applications in use.

  - **Monitor for Elevated Privilege Escalation:** Check for subsequent actions, such as task creation or service manipulation (Event ID 4697) that could indicate further exploitation attempts stemming from the identified WMIC command. High confidence indicators would involve evidence of known exploit tools being invoked through these commands.

  - **Identify Legitimate Use Cases:** Review internal documentation or communicate with users and system owner(s) to verify if the WMIC command execution aligns with any authorized maintenance tasks or scripts typically run in the environment.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant impact if an Office application is used to execute malicious commands. The likelihood of malicious abuse is elevated, as adversaries often utilize LOLBIN abuse to bypass security controls. This behavior is commonly weaponized in attacks targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging (e.g., Sysmon not deployed or misconfigured) or by aggressive threat actor techniques aimed at obfuscation, such as additional command-line obfuscation methods. Legitimate administrative tasks may also trigger this alert due to standard WMIC usage in IT management workflows. Related detection, including monitoring for anomalous PowerShell or batch file executions (T1059.001), can enhance overall coverage and reduce false positives.

