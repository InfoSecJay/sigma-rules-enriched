note: |
  ### Technical Context

  This detection identifies the execution of the GMER tool, a popular rootkit detection and removal utility. Adversaries may use GMER to identify and remove traces of their malicious activities, such as rootkits or other persistent threats, thus facilitating further exploitation or maintaining stealth. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion (T1562)**, specifically the technique of **Subvert Trust Controls (T1555)**.

  The primary telemetry source is process creation events from Windows, tracked through Sysmon or Windows Security logs. Detection of the GMER tool execution on an endpoint indicates a potentially malicious security posture if the tool is not typically authorized for use within that environment. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; it merely highlights that a potentially dangerous tool was executed.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for `Image` paths matching `\gmer.exe`. Investigate the user context under which it was executed, looking for unexpected or non-administrative user accounts as indicators of potential misuse.

  - **Validate execution hash:** Confirm the presence of the hashes provided (MD5: `E9DC058440D321AA17D0600B3CA0AB04`, SHA1: `539C228B6B332F5AA523E5CE358C16647D8BBE57`, SHA256: `E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173`) in the logs to ensure the execution corresponds to the detected rule.

  - **Check previous user activity:** Investigate whether the user had legitimate reasons to execute GMER by reviewing any recent related activity such as system scans or security assessments performed in the same session.

  - **Identify system role:** Understand the role of the host executing GMER. If it's a critical asset or server, the alert severity increases, warranting immediate investigation into asset health and context regarding the use of such tools.

  - **Assess related artifacts:** Look for additional artifacts linked to GMER execution, including log entries around file system changes or network activity indicative of exfiltration attempts post-execution. Review Windows Event ID 4663 for potential modifications to sensitive files or registry keys.

  ### Prioritization

  This alert carries a high severity due to the potential impact on critical systems if GMER is deployed maliciously to remove traces of compromise. The likelihood of malicious abuse is significant, as tools like GMER are often weaponized to obfuscate attacker activity. The use of this tool by unauthorized users particularly heightens risk.

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker renames the executable or uses a different method to load the tool, such as through scripting. Reliable detection depends on proper Sysmon configuration and logging of process creation events. Legitimate debug or security work may trigger this alert if GMER is used appropriately, therefore context must be considered. An additional detection such as monitoring for suspicious behavior following GMER execution can enhance coverage and provide broader insights into potential threats.

