note: |
  ### Technical Context
  This rule detects the execution of the GMER tool, a legitimate rootkit detector that can be abused by attackers for malicious purposes. GMER is commonly used in post-exploitation scenarios to hide signs of compromise and maintain persistence by modifying system processes and registry entries. Its presence on a system may indicate that an attacker is attempting to conceal malicious activity or manipulate the system for further exploitative actions.

  The relevant MITRE ATT&CK tactics involved include **Defense Evasion (T1218)**, as the use of rootkit detection tools can help attackers avoid detection by security solutions. It primarily employs the technique **Process Injection (T1055)** if the tool is utilized to manipulate or compromise processes on a host. Analysts should be aware that detecting GMER executions is crucial, as they can indicate an ongoing compromise or an attempt to reduce the risk of detection by other security measures.

  The primary data sources for this detection include **process creation events from Windows**, particularly focusing on the execution of the GMER executable and specific hashes associated with the tool. Additionally, integrating Sysmon logs can provide deeper visibility into the process attributes to confirm its legitimate or malicious nature.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for any instances of `gmer.exe` being executed. Note the parent process and any command-line arguments that were used during execution to understand the context of the execution.
  - **Analyze Sysmon Logs:** Use Sysmon logs to check for specific hash values associated with the GMER executable (MD5, SHA1, SHA256). Validate that the hashes match the known signatures for GMER to determine if the execution is part of an unauthorized activity.
  - **Identify Anomalous Behavioral Patterns:** Look for patterns in user activity that coincide with the execution of GMER, such as unexpected logins, privilege escalations, or unusual network traffic that could indicate lateral movement or further exploitation.
  - **Check for System Modifications:** Assess whether there are any changes to system configurations, processes, or services that coincide with the use of GMER, which could indicate an attempt to hide malware or maintain persistence on the device.

  ### Prioritization
  The alert regarding the execution of GMER is assigned a high severity level due to its association with defense evasion tactics and potential compromise scenarios. The likelihood of an attacker utilizing such a tool to manipulate system integrity makes this alert critical in an enterprise environment.

  ### Blind Spots and Assumptions
  There are potential blind spots if the detection logic relies solely on process creation events, as attackers may leverage techniques to execute GMER without direct visibility if they employ process hollowing or similar methods. The alert assumes that the presence of the GMER tool is not expected in the environment. Proper logging configurations, including Sysmon and Windows process tracking, are essential for this detection to function effectively. If these logs are not collected or are misconfigured, the detection may not trigger as intended.

