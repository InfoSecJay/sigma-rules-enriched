note: |
  ### Technical Context

  This Sigma rule detects the execution of the GMER tool, known for detecting and removing rootkits. The primary attacker objective is likely the stealthy identification or removal of persistent malware that aims to remain undetected within compromised systems. The relevant MITRE ATT&CK tactics are **Defense Evasion** (T1211) and **Tools** (T1200). The primary telemetry sources are Windows process creation logs via Security Event ID 4688 and Sysmon Event ID 1, focusing on specific executable paths and cryptographic hashes associated with GMER.

  If the detection is confirmed maliciously executed, it poses a significant threat as it indicates the presence of a potential rootkit or the user’s attempt to obscure the activities of malicious software. It is important to note that detection of GMER’s execution does NOT confirm initial compromise or the presence of rootkits on its own.

  ### Investigation Steps

  - **Check process execution logs:** Review Security Event ID 4688 or Sysmon Event ID 1 indicating process creation. Look for `Image: \gmer.exe` to confirm the GMER tool was executed.

  - **Validate hash matches:** Cross-reference the hash values of the executed image against known legitimate checksums. The MD5, SHA1, and SHA256 hashes associated with GMER are crucial identifiers for malicious behavior.

  - **Analyze user context:** Investigate the user who executed GMER. If it was run by an unexpected non-admin account or from a directory outside normal usage (e.g., “C:\Users\Public” or transient directories), this may indicate malicious intent.

  - **Assess prior activity:** Review logs for any context leading to the execution of GMER, such as evidence of other tools or suspicious process executions in close time proximity. Look for additional related processes that might suggest malicious behavior.

  - **Identify legitimate usages of GMER:** Legitimate cybersecurity operations might involve IT security teams using GMER for legitimate rootkit scanning. Validate the requesting user’s history, job role, and presence in known IT asset inventories.

  - **Search for file system changes:** Check for any files created or modified in conjunction with GMER execution. Investigate known temporary or log files generated by GMER for signs of output or further malicious actions.

  ### Prioritization

  This alert is of high severity due to the potential impact if rootkits are present on the system. The use of GMER in an unauthorized context indicates a likely attempt to engage in stealthy operations, making it a significant risk for further exploitation or data compromise.

  ### Blind Spots and Assumptions

  This detection could be evaded by attackers using other stealth tools that do not trigger standard logging or by deploying GMER with altered hashes. It requires having Sysmon and Windows Security logging properly configured to capture all relevant process creation events. Legitimate system administrators performing rootkit checks with GMER might trigger this alert, necessitating further context understanding. Related detection rules for unauthorized or suspicious executable executions should be in place to provide comprehensive coverage of potential threats.

