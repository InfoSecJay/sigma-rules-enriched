note: |
  ### Technical Context

  This Sigma rule detects the use of the Windows Management Instrumentation Command-line (WMIC) utility to uninstall or terminate security products on a Windows system. The primary attacker objective here is likely to disable or remove security controls to facilitate further malicious activities, such as lateral movement, data exfiltration, or malware deployment. Relevant MITRE ATT&CK tactics and techniques include "Defense Evasion" (TA0005) and "Software Uninstallation" (T1685).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 for process creation events. Malicious actions detected by this rule can significantly impact the overall security posture of the organization, potentially leading to the compromise of sensitive data or systems. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administration activities may also trigger these alerts.

  ### Investigation Steps

  - **Review the process creation logs:** Check Security Event ID 4688 for processes initiated with WMIC. Focus on command lines containing 'wmic' and instances where security products are referenced, such as 'Carbon Black' or 'Windows Defender'.

  - **Identify legitimate administration actions:** Determine if the WMIC commands were executed by known administrative users or scripts that are part of normal IT operations, especially in the context of system updates or maintenance.

  - **Check for high-confidence malicious indicators:** Look for process trees involving WMIC commands followed by the termination of security products. Correlate with unusual user accounts or processes to raise the suspicion of credential misuse or unauthorized access.

  - **Examine event times and user activity:** Cross-reference timestamps of WMIC command executions (Event ID 4688) with other log sources (Event ID 4624 for user logins) to identify anomalous logon patterns or times when security software was uninstalled.

  - **Confirm telemetry from security solutions:** Validate that security products are listed within the telemetry and find corresponding service logs or reports that demonstrate the correct operation of denied uninstallation paths.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical security systems and the likelihood of malicious usage, as the uninstallation of security products is a common step in many attack workflows. This behavior is almost universally weaponized by adversaries seeking to disable defenses before perpetrating further attacks.

  ### Blind Spots and Assumptions

  Detection limitations include legitimate administrative actions that may also use WMIC to manage software uninstallation, potentially leading to false positives. Ensuring that logging for process creation (Event ID 4688) is enabled and configured correctly is essential for reliable detection. Additionally, normal system maintenance or software updates could trigger similar alerts, which analysts should confirm through baseline comparisons. Related detection rules that monitor unauthorized process termination or service modifications could enhance coverage and reduce blind spots.

