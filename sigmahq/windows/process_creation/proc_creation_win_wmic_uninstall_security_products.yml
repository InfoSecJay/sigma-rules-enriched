note: |
  ### Technical Context

  This rule detects the use of the Windows Management Instrumentation Command-line (WMIC) utility to uninstall or terminate security products. Such actions often align with malicious intent to disable or evade detection mechanisms during a compromise. The most relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), with the technique being "Indicator Removal on Host" (T1561). The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on command line arguments that include WMIC and specific security product names. If malicious, this behavior can significantly impact the security posture of the organization, enabling subsequent attacks or lateral movement. However, this detection does NOT on its own confirm malicious activity, as legitimate administrative actions can trigger similar WMIC commands.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check for Security Event ID 4688 and Sysmon Event ID 1. Look for command lines containing 'wmic', 'product where', and 'call uninstall' with product names like '%Sophos%' or '%McAfee%'. If the action corresponds to an known legitimate administration request, consider this benign.

  - **Identify High-Risk Command Execution**: Note any instance of 'call terminate' or 'call delete' following WMIC usage. If these commands are executed with security products listed in the rule (e.g., ‘Crowdstrike Sensor’), flag these as highly suspicious.

  - **Validate Against Approved Administration Changes**: Cross-reference any identified WMIC usage against a list of expected administrative changes or documented maintenance schedules. Lack of prior approval or documentation can indicate malicious behavior.

  - **Correlate With Other Security Events**: Investigate surrounding logs, such as network activity or user logins, within the timeframe of the WMIC command execution. Look for unusual login locations or failed authentication attempts which could indicate lateral movement or exploitation attempts.

  - **Check for Residual Artifacts**: Inspect the host for remnants of uninstalled security products and verify if any system checks or endpoint protections were halted or disrupted. Files associated with product removal may be logged in the System or Application event logs.

  ### Prioritization

  This alert is rated high due to the critical nature of security products in a mature enterprise environment and the likelihood that malicious actors would attempt to disable them. The behavior captured is common among sophisticated threat actors seeking to evade detection, making it essential for rapid investigation.

  ### Blind Spots and Assumptions

  The detection may miss WMIC invocations that utilize obfuscation techniques or employ alternative command execution methods. Continuous monitoring and logging configurations must be enabled for accurate detection, particularly around process creation and system changes. Legitimate administrative activities, such as authorized software updates or maintenance tasks, may also trigger this alert. A related detection for "Malicious Removal of EDR" should be used to enhance overall coverage against evasion tactics.

