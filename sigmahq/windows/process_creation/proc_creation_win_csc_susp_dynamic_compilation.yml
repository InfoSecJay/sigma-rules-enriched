title: Dynamic .NET Compilation Via Csc.EXE
id: dcaa3f04-70c3-427a-80b4-b870d73c94c4
status: test
description: Detects execution of "csc.exe" to compile .NET code. Attackers often
  leverage this to compile code on the fly and use it in other stages.
references:
- https://securityboulevard.com/2019/08/agent-tesla-evading-edr-by-removing-api-hooks/
- https://www.clearskysec.com/wp-content/uploads/2018/11/MuddyWater-Operations-in-Lebanon-and-Oman.pdf
- https://app.any.run/tasks/c6993447-d1d8-414e-b856-675325e5aa09/
- https://twitter.com/gN3mes1s/status/1206874118282448897
- https://github.com/redcanaryco/atomic-red-team/blob/b27a3cb25025161d49ac861cb216db68c46a3537/atomics/T1027.004/T1027.004.md#atomic-test-1---compile-after-delivery-using-cscexe
author: Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
date: 2019-08-24
modified: 2024-05-27
tags:
- attack.defense-evasion
- attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\csc.exe'
  selection_susp_location_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\AppData\Local\Temp\'         # User execution
    - '\Temporary Internet'
    - '\Windows\Temp\'         # Admin execution
  selection_susp_location_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  selection_susp_location_3:
    CommandLine|re: '([Pp]rogram[Dd]ata|%([Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\([Ll]ocal([Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$'
  filter_main_programfiles:
        # Note: this is a generic filter. You could baseline execution in your env for a more robust rule
    ParentImage|startswith:
    - 'C:\Program Files (x86)\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
    - 'C:\Program Files\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_sdiagnhost:
    ParentImage: 'C:\Windows\System32\sdiagnhost.exe'     # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_w3p:
    ParentImage: 'C:\Windows\System32\inetsrv\w3wp.exe'     # https://twitter.com/gabriele_pippi/status/1206907900268072962
  filter_optional_chocolatey:
    ParentImage:     # Chocolatey https://chocolatey.org/
    - 'C:\ProgramData\chocolatey\choco.exe'
    - 'C:\ProgramData\chocolatey\tools\shimgen.exe'
  filter_optional_defender:
    ParentCommandLine|contains: '\ProgramData\Microsoft\Windows Defender Advanced
      Threat Protection'
  filter_optional_ansible:
        # Note: As ansible is widely used we exclude it with this generic filter.
        # A better option would be to filter based on script content basis or other marker while hunting
    ParentCommandLine|contains:
            # '{"failed":true,"msg":"Ansible requires PowerShell v3.0 or newer"}'
    - 'JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw'
    - 'cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA'
    - 'nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA'
  condition: selection_img and 1 of selection_susp_location_* and not 1 of filter_main_*
    and not 1 of filter_optional_*
falsepositives:
- Legitimate software from program files - https://twitter.com/gN3mes1s/status/1206874118282448897
- Legitimate Microsoft software - https://twitter.com/gabriele_pippi/status/1206907900268072962
- Ansible
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `csc.exe`, the C# compiler, which can be a signal of malicious activity, particularly in the context of .NET framework abuse. Attackers might leverage this tool to dynamically compile C# code on the fly, allowing them to execute malware or scripts without creating visible files on disk. The upload of compiled code to a compromised system can facilitate various techniques, including establishing persistence, evading detection, and executing payloads as part of broader attack campaigns.

  The actions involving `csc.exe` typically align with MITRE ATT&CK tactics such as **Defense Evasion** (TA0005) and techniques like **Compile After Delivery** (T1027.004). This method can enable threat actors to bypass security measures by avoiding the traditional early detection of executable files since the code is compiled only at the time of execution.

  Key telemetry sources for identifying this behavior include **process creation logs**, which capture instances of executable launches, and **command-line arguments**, detailing the context in which those executables are executed. Collectively, these sources provide insights into potentially unauthorized use of the compiler in sensitive file locations or system directories.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for instances of `csc.exe` execution, focusing on the command line for indicative patterns (e.g. unusual directories or parameters that suggest suspicious activity).
  - **Analyze Command Line Arguments**: Investigate any command lines that specify paths typically associated with temporary storage or user directories, as these may indicate an attempt to compile and execute malicious payloads.
  - **Check Parent Process Information**: Look at the parent processes of `csc.exe` to identify any potentially malicious or unusual behaviors. If the parent process is common or trusted software, further validation may be required.
  - **Correlate with Other Artifacts**: Gather contextual information from additional security telemetry sources such as Windows Defender ATP, EDR events, and any related proxy logs, especially in cases where web traffic may indicate prior downloading or execution of the compiled code.

  ### Prioritization
  Detection of dynamic compilation via `csc.exe` is of medium severity due to its direct implications for the potential execution of malicious code. While not all instances indicate a threat, the behavior is commonly associated with sophisticated attack techniques that pose significant risks to enterprise security.

  ### Blind Spots and Assumptions
  Detection logic may miss legitimate use cases of `csc.exe` associated with authorized software development or administrative tasks. This could lead to false positives, particularly if compiled code is part of internal applications. Gaps may exist in environments that do not log process creation events, or where certain paths (like developer folders) are routinely accessed for benign reasons. The effectiveness of this rule also assumes that command-line arguments are consistently logged and preserved; any misconfigurations could result in diminished detection capabilities.

