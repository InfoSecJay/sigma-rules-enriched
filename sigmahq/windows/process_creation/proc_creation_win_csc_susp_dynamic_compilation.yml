title: Dynamic .NET Compilation Via Csc.EXE
id: dcaa3f04-70c3-427a-80b4-b870d73c94c4
status: test
description: Detects execution of "csc.exe" to compile .NET code. Attackers often
  leverage this to compile code on the fly and use it in other stages.
references:
- https://securityboulevard.com/2019/08/agent-tesla-evading-edr-by-removing-api-hooks/
- https://www.clearskysec.com/wp-content/uploads/2018/11/MuddyWater-Operations-in-Lebanon-and-Oman.pdf
- https://app.any.run/tasks/c6993447-d1d8-414e-b856-675325e5aa09/
- https://twitter.com/gN3mes1s/status/1206874118282448897
- https://github.com/redcanaryco/atomic-red-team/blob/b27a3cb25025161d49ac861cb216db68c46a3537/atomics/T1027.004/T1027.004.md#atomic-test-1---compile-after-delivery-using-cscexe
author: Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
date: 2019-08-24
modified: 2024-05-27
tags:
- attack.defense-evasion
- attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\csc.exe'
  selection_susp_location_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - '\AppData\Local\Temp\'         # User execution
    - '\Temporary Internet'
    - '\Windows\Temp\'         # Admin execution
  selection_susp_location_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  selection_susp_location_3:
    CommandLine|re: '([Pp]rogram[Dd]ata|%([Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\([Ll]ocal([Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$'
  filter_main_programfiles:
        # Note: this is a generic filter. You could baseline execution in your env for a more robust rule
    ParentImage|startswith:
    - 'C:\Program Files (x86)\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
    - 'C:\Program Files\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_sdiagnhost:
    ParentImage: 'C:\Windows\System32\sdiagnhost.exe'     # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_w3p:
    ParentImage: 'C:\Windows\System32\inetsrv\w3wp.exe'     # https://twitter.com/gabriele_pippi/status/1206907900268072962
  filter_optional_chocolatey:
    ParentImage:     # Chocolatey https://chocolatey.org/
    - 'C:\ProgramData\chocolatey\choco.exe'
    - 'C:\ProgramData\chocolatey\tools\shimgen.exe'
  filter_optional_defender:
    ParentCommandLine|contains: '\ProgramData\Microsoft\Windows Defender Advanced
      Threat Protection'
  filter_optional_ansible:
        # Note: As ansible is widely used we exclude it with this generic filter.
        # A better option would be to filter based on script content basis or other marker while hunting
    ParentCommandLine|contains:
            # '{"failed":true,"msg":"Ansible requires PowerShell v3.0 or newer"}'
    - 'JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw'
    - 'cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA'
    - 'nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA'
  condition: selection_img and 1 of selection_susp_location_* and not 1 of filter_main_*
    and not 1 of filter_optional_*
falsepositives:
- Legitimate software from program files - https://twitter.com/gN3mes1s/status/1206874118282448897
- Legitimate Microsoft software - https://twitter.com/gabriele_pippi/status/1206907900268072962
- Ansible
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of "csc.exe," a .NET compiler, often used by attackers to compile arbitrary code on-the-fly. The primary objective may include deploying malware, obfuscating malicious scripts, or executing payloads within compromised environments. This behavior aligns with the MITRE ATT&CK technique T1027.004, which focuses on compiling code as a method of defense evasion and execution. The primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1 for detailed command-lines and parent processes. If malicious, this behavior can lead to further exploitation of the system and compromise of sensitive data or integrity of applications. Importantly, this detection alone does not confirm malicious intent; it may also capture benign activities from legitimate software installations or scheduled tasks.

  ---

  ### Investigation Steps

  - **Check process details:** Review the process creation log for "csc.exe" (Event ID 4688 or Sysmon ID 1), noting the command line arguments passed. Benign command lines typically reference known applications or installations, while suspicious entries might include unusual file paths or payload execution.

  - **Correlate with parent process:** Identify the parent process of "csc.exe." Check for known benign parent processes by examining the ParentImage field. Malicious executions often exhibit suspicious parent processes or unusual invocation patterns.

  - **Review command-line parameters:** Pay particular attention to command line locations such as `C:\Users\[User]\AppData\Local\Temp\` or system temporary directories. Legitimate .NET compilation usually occurs under controlled environments like `C:\Program Files\`, while suspicious use may feature unusual or user-controlled paths.

  - **Look for high-confidence indicators:** Investigate the frequency of such executions within a short time. A high volume of "csc.exe" executions from various users, especially from suspected compromised accounts, could indicate malicious intent.

  - **Identify legitimate software:** Validate if the "csc.exe" instance is linked to a legitimately deployed application or installation. For instance, verify against known Microsoft applications or routine software deployment practices in the environment.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on the affected system's security. The likelihood of malicious abuse is heightened as the use of "csc.exe" can lead to executing custom payloads, a common tactic among threat actors. However, the presence of this behavior may also include legitimate software development or deployment activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate compilations from approved software, which can generate similar alerts. Some evasion techniques include altering command-line arguments or executing "csc.exe" from trusted directories. Consistent logging (Event ID 4688 from all endpoints) is crucial for reliable detection. Related detections to consider may include monitoring for unusual script execution or PowerShell commands associated with code compilation, thereby enhancing coverage against possible evasions.

