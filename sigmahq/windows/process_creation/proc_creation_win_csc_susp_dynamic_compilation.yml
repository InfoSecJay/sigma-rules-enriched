note: |
  ### Technical Context

  This Sigma rule detects the execution of `csc.exe`, the C# compiler, often used by threat actors to compile .NET code dynamically, which can facilitate various malicious activities such as payload delivery and execution of malicious scripts. The likely objective of the attacker is to generate executable code on-the-fly without relying on pre-existing executables, thus evading detection. This behavior aligns with the MITRE ATT&CK technique for "Compile After Delivery" (T1027.004).

  The primary telemetry sources for this detection are Windows process creation events, specifically Event ID 4688 from the Windows Security log. The security impact of successful exploitation could range from unauthorized code execution to full control over affected systems. It is important to note that this detection does not independently confirm malicious intent, as legitimate applications may also utilize `csc.exe` for valid purposes.

  ### Investigation Steps

  - **Collect process creation events:** Review Windows Security Event ID 4688 logs for instances of `csc.exe` execution, ensuring you check relevant fields like CommandLine, ProcessId, and ParentImage.

  - **Examine the command line:** Analyze the CommandLine field for execution paths that include temporary directories (e.g., `C:\Users\Public\AppData\Local\Temp\`). Legitimate activity typically shows system-level uses or well-known application paths.

  - **Identify suspicious parent processes:** Look for parent processes associated with the execution of `csc.exe`. Focus on logs showing parent images not typically running application code, such as those not starting within `C:\Program Files` or legitimate Microsoft software.

  - **Correlate against known legitimate software:** Reference baselines for expected uses of `csc.exe` in your environment to determine if the execution is normal. This could include development environments or scheduled tasks initiated by known applications.

  - **Assess file creation artifacts:** Check for any newly created files in directories like `C:\Users\<User>\AppData\Local\Temp\` immediately following `csc.exe` execution. Look for suspicious script or executable file types.

  - **Evaluate executed code content:** If investigation leads to file creation that is not benign, consider using tools like `sigcheck` to inspect the file signatures of generated binaries to verify their origin.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if exploited on critical systems. The likelihood of abuse is considerable since techniques involving dynamic compilation are weaponized by various adversary groups. Prompt investigation is essential to mitigate possible harm.

  ### Blind Spots and Assumptions

  The detection relies heavily on process creation logs, which may be limited if logging levels are not adequately configured. Legitimate administrative actions or application development practices might trigger this rule, leading to false positives. Additionally, evolved adversaries may disguise malicious compilations under benign contexts. A related detection could involve monitoring for unusual .NET assembly loading patterns (e.g., Event ID 4104 in PowerShell logs) to enhance overall visibility on .NET-related activities.

