note: |
  ### Technical Context

  This rule detects the execution of `csc.exe`, a tool used to compile .NET code dynamically. Attackers may leverage this functionality to generate malicious code on-the-fly, potentially facilitating further exploitation steps or establishing persistence through custom assemblies. The relevant MITRE ATT&CK tactic is "Execution" (TA0040) and the technique is "Compile After Delivery" (T1027.004).

  Telemetry sources required include Windows Process Creation logs (Event ID 4688) that capture the execution of processes, along with CommandLine arguments indicating the locations from which `csc.exe` is invoked. If malicious, this behavior could enable attackers to deploy malware or create backdoors, significantly impacting enterprise security. Importantly, this detection does not confirm the intent behind executing `csc.exe`, as it could also be used legitimately in software development or automation tasks.

  ### Investigation Steps

  - **Check process creation logs for `csc.exe`:** Review Windows Security Event ID 4688 logs for `Image` paths ending in `csc.exe` and extract related `CommandLine` parameters to identify execution context. Look for suspicious locations used in the command line.

  - **Identify suspicious command line arguments:** Focus on events where `CommandLine` contains paths like `:\Perflogs\`, `C:\Users\Public\`, or `\Temp\`, which indicate potential malicious usage. Verify if the access to these locations aligns with known legitimate application behavior.

  - **Examine parent process for context:** Check the `ParentImage` field in the logs. Legitimate executions will typically have established processes as parents like `C:\Windows\System32\powershell.exe` or common apps. Look for uncommon parent processes like those from user folders indicating potential misuse.

  - **Validate asset criticality:** Determine the role of the host executing `csc.exe`. If on a domain controller or critical server, escalate investigation priority. Legitimate actions for Development or Automation agents may involve `csc.exe`, but in unusual contexts warrant deeper scrutiny.

  - **Identify high-confidence malicious indicators:** Look for `CommandLine` parameters containing unusual flags or references to known malicious payloads or scripts that might be compiled. Validate any execution against community or vendor threat intelligence sources.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems if exploited. The likelihood of malicious use is moderate, given the demonstrated use of dynamic compilation in advanced persistent threats (APTs) and malware variants. While not ubiquitous, this behavior can be weaponized, underscoring the need for timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by users executing legitimate software that employs `csc.exe` in standard environments, potentially leading to false positives. It assumes that appropriate logging is enabled for process creation. Regular legitimate activities, such as DevOps tasks or automated scripting using `csc.exe`, may trigger this alert. A companion detection of suspicious PowerShell activity (T1059.001) could provide additional context and coverage for related activities.

