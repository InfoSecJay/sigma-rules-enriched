level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `csc.exe`, the C# compiler, commonly used by attackers to dynamically compile .NET code on compromised machines. The objective of such behavior typically includes executing custom payloads, generating persistence mechanisms, or facilitating lateral movement by compiling malicious scripts at runtime. This aligns with the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1027.004).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688 in the Security log and Sysmon Event ID 1. The security impact of using `csc.exe` maliciously can be significant, leading to the execution of arbitrary code or payloads that could further compromise the system and the network. Importantly, this detection alone does NOT confirm malicious intent; legitimate administrative or development activities can also trigger it.

  ### Investigation Steps

  - **Check process creation details**: Review Security Event ID 4688 and Sysmon Event ID 1. Verify details such as the `CommandLine` and `ParentImage`. Look for unexpected command-line arguments and ensure the parent process is not one of the known legitimate applications (e.g., typical `C:\Program Files` executables).

  - **Identify source paths**: Analyze the directory from which `csc.exe` was executed. Check for instances where the process was started from suspicious locations, such as `C:\Users\Public\` or `C:\Windows\Temp\`. Legitimate uses often originate from program files or managed application directories.

  - **Review parent process context**: Correlate the parent process found in the logs. Legitimate instances will usually be triggered by common applications (like Visual Studio or legitimate scripts), whereas unusual parents (like `cmd.exe` or `powershell.exe` executed by non-administrative users) may indicate malicious activity.

  - **Evaluate the command line for malicious patterns**: Search for specific arguments in the `CommandLine` field that are common in malicious usages, such as the compilation of scripts using temporary paths like `\AppData\Local\Temp\`. This indicates possible abuse for local execution.

  - **Examine for known threats**: Validate the alert against threat intel feeds or logs that may specify if `csc.exe` is being involved in previous malicious campaigns, such as Agent Tesla or similar malware that incorporates dynamic code compilation.

  - **Confirm file creation or exfiltration**: Validate if the created assemblies were immediately executed or if there are indications of further actions, such as the creation of files in temp directories that align with malicious behavior.

  ### Prioritization

  This alert is of **medium severity** as it’s indicative of potential defense evasion tactics commonly used by adversaries. The risk is heightened when executing on critical systems or user accounts with elevated privileges, as these may facilitate significant breaches. This behavior is often weaponized in various malware attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers who alter their execution patterns, such as obfuscating `csc.exe` calls or using alternate compilation methods. Reliable detection requires comprehensive logging from endpoints, including Sysmon and security event logs. Legitimate administrative activities, such as automated scripts run for system maintenance or updates, may unintentionally trigger this alert. A related detection to consider is monitoring for unusual script execution behaviors that couple with code compilation activities, extending visibility into potential threats.

