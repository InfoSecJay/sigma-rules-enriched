title: PsExec/PAExec Escalation to LOCAL SYSTEM
id: 8834e2f7-6b4b-4f09-8906-d2276470ee23
related:
- id: 207b0396-3689-42d9-8399-4222658efc99     # Generic rule based on similar cli flags
  type: similar
status: test
description: Detects suspicious commandline flags used by PsExec and PAExec to escalate
  a command line to LOCAL_SYSTEM rights
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-11-23
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_sys:   # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  selection_other:
    CommandLine|contains:
    - 'psexec'
    - 'paexec'
    - 'accepteula'
  condition: all of selection_*
falsepositives:
- Admins that use PsExec or PAExec to escalate to the SYSTEM account for maintenance
  purposes (rare)
- Users that debug Microsoft Intune issues using the commands mentioned in the official
  documentation; see https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
level: high
note: |
  ### Technical Context
  This detection rule identifies potential misuse of PsExec and PAExec utilities by monitoring suspicious command-line flags used to elevate privileges to the LOCAL_SYSTEM account. Both PsExec and PAExec are legitimate tools commonly employed for remote process execution; however, attackers often leverage these tools to execute malicious commands or malware with elevated privileges, granting them significant control over the compromised system. The ability to run commands as the LOCAL_SYSTEM account can allow attackers to bypass security restrictions, access sensitive data, and persist in a compromised environment.

  The rule is related to various MITRE ATT&CK tactics, specifically **Privilege Escalation (TA0004)**, leveraging techniques such as **Exploitation for Client Execution (T1203)** and **Valid Accounts (T1078)**. Attackers may aim to escalate privileges in order to gain hidden access to resources, avoid detection, or manipulate system configurations. The appropriate logs for this detection include process creation events that capture command-line arguments, allowing for the identification of potentially malicious activity associated with the execution of these tools.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect and analyze process creation logs that include command-line arguments for processes initiated by PsExec or PAExec. Look for unexpected use of the `-s` flag indicating attempts to escalate privileges.
  - **Investigate User Context:** Verify the user account that executed the commands. Suspicious activity from standard users or accounts with limited privileges warrants deeper investigation.
  - **Examine Event Logs for Abuse:** Check Windows Security Event Logs for event IDs indicating privilege escalation or suspicious account activity in conjunction with process creation events involving PsExec or PAExec.
  - **Correlate with Other Contextual Logs:** Look for related logs and alerts from EDR or other monitoring tools to understand the broader context of the behavior. This might include network connections, file access logs, or alerting from behavioral analytics systems.

  ### Prioritization
  Given the capability of PsExec and PAExec to grant administrative access, this alert should be considered high severity. The likelihood of real malicious activity is significant, especially if observed from non-administrative accounts or in unusual circumstances.

  ### Blind Spots and Assumptions
  This detection relies on the presence of detailed process creation logs and may not capture all instances of PsExec or PAExec misuse, particularly if the attacker employs custom command techniques or obfuscation to evade detection. Furthermore, it assumes that the typical execution patterns for these tools will include the specified flags, which may not account for all legitimate administrative use cases. To maximize detection coverage, ensure that logging is configured to capture detailed command-line arguments across Windows systems.

