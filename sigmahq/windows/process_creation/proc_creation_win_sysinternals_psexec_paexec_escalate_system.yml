title: PsExec/PAExec Escalation to LOCAL SYSTEM
id: 8834e2f7-6b4b-4f09-8906-d2276470ee23
related:
- id: 207b0396-3689-42d9-8399-4222658efc99     # Generic rule based on similar cli flags
  type: similar
status: test
description: Detects suspicious commandline flags used by PsExec and PAExec to 
  escalate a command line to LOCAL_SYSTEM rights
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2021-11-23
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_sys:   # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  selection_other:
    CommandLine|contains:
    - 'psexec'
    - 'paexec'
    - 'accepteula'
  condition: all of selection_*
falsepositives:
- Admins that use PsExec or PAExec to escalate to the SYSTEM account for 
  maintenance purposes (rare)
- Users that debug Microsoft Intune issues using the commands mentioned in the 
  official documentation; see 
  https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of PsExec or PAExec with command-line flags indicative of attempting to escalate privileges to the LOCAL_SYSTEM account. This behavior typically suggests an attacker is aiming to gain elevated access for persistence, lateral movement, or initiating other malicious activities on a target system. It aligns with the MITRE ATT&CK framework under the tactic "Privilege Escalation" (TA0004) and specifically the technique "Exploitation for Credential Access" (T1587.001). The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688, which captures command-line execution details. If this behavior is confirmed as malicious, it poses significant security risks, as gaining SYSTEM-level access can lead to full compromise of the host. However, this detection alone does not confirm the intent behind the escalation nor does it indicate abuse if legitimate administrative activities are performed.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for command-line usage of 'psexec' or 'paexec' with flags indicating escalated execution (e.g., ' -s cmd'). Look for any unusual timing or system context that does not align with standard operations.

  - **Identify host role and criticality**: Determine if the affected system is a server or workstation and evaluate its role in the environment (e.g., domain controller, file server). Critical systems execute commands differently than end-user workstations.

  - **Investigate user account legitimacy**: Assess the user account that executed the command. Look for any signs of credential compromise, such as a low-reputation user initiating SYSTEM-level commands (e.g., by cross-referencing the Account Name field in event logs).

  - **Analyze recent administrative activity**: Check for documented maintenance or troubleshooting activities that justify the use of PsExec or PAExec. This includes legitimate tasks related to Microsoft Intune or other management activities to differentiate from potential abuse.

  - **Cross-check file creation and output**: Validate any spawned processes or scripts created through PsExec/PAExec for anomalies. File paths, executed scripts, or dropped payloads should be examined for high-confidence malicious artifacts.

  ### Prioritization

  This alert is considered high-severity, as it involves a method frequently leveraged by adversaries to escalate privileges and potentially compromise sensitive systems. The likelihood of malicious abuse is elevated, particularly if occurring on critical infrastructure. This behavior is often weaponized in various cyber incidents, justifying immediate investigation.

  ### Blind Spots and Assumptions

  Limitations include that not all legitimate administrative actions are captured unless exhaustive logs are enabled. Users with administrative privileges may trigger this alert benignly during troubleshooting or maintenance processes. It's essential to ensure that log settings for capturing command-line arguments are properly configured in Group Policy. A companion detection to consider is monitoring for unusual service creations or modifications (e.g., Service Control Manager logs), which can further indicate privilege escalation attempts.

