title: PsExec/PAExec Escalation to LOCAL SYSTEM
id: 8834e2f7-6b4b-4f09-8906-d2276470ee23
related:
- id: 207b0396-3689-42d9-8399-4222658efc99     # Generic rule based on similar cli flags
  type: similar
status: test
description: Detects suspicious commandline flags used by PsExec and PAExec to escalate
  a command line to LOCAL_SYSTEM rights
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-11-23
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_sys:   # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  selection_other:
    CommandLine|contains:
    - 'psexec'
    - 'paexec'
    - 'accepteula'
  condition: all of selection_*
falsepositives:
- Admins that use PsExec or PAExec to escalate to the SYSTEM account for maintenance
  purposes (rare)
- Users that debug Microsoft Intune issues using the commands mentioned in the official
  documentation; see https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of PsExec or PAExec with command-line flags that escalate privileges to the LOCAL SYSTEM account. This behavior is typically leveraged by attackers to gain higher access rights, which can be used to move laterally within the network or execute malicious payloads. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) with techniques T1587.001 (Develop Capabilities: Tools). Primary telemetry sources include Windows process creation logs (Event ID 4688 and Sysmon Event ID 1), which capture command-line executions. If malicious, this behavior can lead to significant security impacts, including unauthorized access to sensitive data or systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative uses may occur.

  ---

  ### Investigation Steps

  - **Review event details:** Check Event ID 4688 entries for any `CommandLine` fields containing the strings `psexec`, `paexec`, `-s`, and variants. Look for unexpected execution contexts, especially if they originate from non-admin accounts or non-secured network segments.

  - **Validate account privileges:** Examine the user account that executed the command. Legitimate administrative activities by known system admins typically occur during scheduled maintenance with expected timeframes; look for known maintenance windows.

  - **Cross-reference process tree:** Use Sysmon Event ID 10 (Process Access) and Event ID 1 (Process Creation) to analyze parent-child relationships. Legitimate executions often originate from known administrative tools or are initiated by user-level processes, while malicious activity may show anomalous parent processes.

  - **Investigate related artifacts:** Check for any associated new or modified files in sensitive or critical areas (e.g., `C:\Windows\System32\`). Look for results from the creation or access of files that coincide with the time of PsExec execution, particularly any scripts or binaries that could be used for persistence or lateral movement.

  - **Identify legitimate PsExec usage:** Confirm any documented use of PsExec or PAExec by your IT team through change management records. Investigate any flagged incidents that were logged for debugging or administrative purposes, particularly any that occurred outside of normal windows.

  - **Examine logs for evasion attempts:** Search for common evasion patterns that may accompany PsExec usage, such as obfuscation of command arguments or modifications in execution paths. Investigate any unusual command-line parameters that do not conform to standard administrative practices.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for critical systems to be compromised through privilege escalation. The likelihood of such techniques being weaponized in the enterprise is high, especially if combined with other malicious activities. The presence of PsExec/PAExec in environments lacking stringent access controls presents a clear risk.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the ability of attackers to use command-line obfuscation, which may evade detection. Required log sources include Sysmon with proper configuration to capture all relevant process creation events and command-line arguments. Legitimate administrative activities, especially from IT staff performing routine maintenance or troubleshooting, may trigger this alert. Strengthening coverage can be achieved by correlating with other intrusion detection rules for lateral movement detection and privilege escalation events.

