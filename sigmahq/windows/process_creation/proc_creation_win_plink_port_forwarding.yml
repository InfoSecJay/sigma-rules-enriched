note: |
  ### Technical Context
  This rule detects the use of Plink (PuTTY Link), a command-line SSH client, to create SSH tunnels for port forwarding to a local system. This type of activity is often leveraged by attackers to bypass network restrictions, maintain persistence, or conduct lateral movement across networks without detection by traditional security controls. The threat scenario involves an adversary, potentially a skilled insider or an external attacker, using Plink to establish unauthorized connections that could exfiltrate data or access sensitive internal resources.

  The rule is relevant to several MITRE ATT&CK tactics and techniques, notably:
  - **Command and Control (T1071)**: This technique includes various communication methods that adversaries use to communicate with compromised systems.
  - **Lateral Movement (T1021.001)**: Specifically regarding the use of Remote Services (such as SSH, RDP) to move from one system to another within a network.
  - **Application Layer Protocol (T1572)**: Involves utilizing common protocols to interface with applications and control system access.

  The primary data source for this detection is **process creation events** from Windows systems, as they provide insights into command-line arguments and help identify potentially malicious use of legitimate tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation events from affected hosts to identify instances of Plink being executed with the `-R` flag, which indicates remote port forwarding.
  - **Correlate Network Traffic**: Examine network flow data or packet captures surrounding the time of the event for unusual SSH connections or traffic directed towards unknown external IP addresses that may indicate data exfiltration or command-and-control activity.
  - **Check User Activity**: Investigate the user context under which Plink was executed. Assess if the user has a legitimate reason to use SSH port forwarding and correlate this with their typical behavior patterns in the environment.
  - **Look for Anomalous Access**: Review logs for access to critical internal resources that should not have been reachable from the host, as this may indicate successful lateral movement or access to sensitive data.

  ### Prioritization
  The severity of this alert is classified as high due to the potential for significant impact; unauthorized port forwarding can facilitate data breaches and allow attackers to bypass defenses, making it crucial to address promptly in the enterprise environment.

  ### Blind Spots and Assumptions
  This detection relies on the availability of comprehensive process creation logs, which may not be enabled on all endpoints, leading to gaps in visibility. Additionally, the logic assumes that use of Plink for legitimate administrative activities has been considered, creating potential false positives. It is essential to ensure that logging configurations are adequately set up to capture all relevant process creation events for effective alerting on this activity.

