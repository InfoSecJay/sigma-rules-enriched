note: |
  ### Technical Context

  This Sigma rule detects attempts to execute `cmd.exe` or `powershell.exe` with commands that involve writing to named pipes, specifically targeting the `.\\pipe\\` namespace. This behavior is often associated with lateral movement techniques that adversaries may use to escalate privileges or execute commands on remote systems without being detected. The likely attacker objective is to create a foothold on another machine or stage data for exfiltration using named pipe impersonation.

  This rule aligns with the MITRE ATT&CK technique "Lateral Movement" (T1021). The primary telemetry sources required are Windows Process Creation logs, specifically Security Event ID 4688 and possibly Sysmon Event ID 1. If malicious, this behavior can indicate serious security threats such as unauthorized access to resources or execution of remote payloads. Importantly, this detection does NOT confirm unauthorized access or malicious intent on its own; benign processes may generate similar command lines.

  ### Investigation Steps

  - **Examine process creation events**: Review Security Event ID 4688 for instances where `cmd.exe` or `powershell.exe` was spawned. Focus on the `CommandLine` field to confirm the presence of `echo` and `> \\.\pipe\`.
  - **Identify command invocation patterns**: Search for similar commands involving named pipes across affected hosts to determine if this pattern is consistent with known benign applications or users, which can help discern legitimate activity.
  - **Evaluate user context for process execution**: Inspect the `Account Name` and `User SID` fields in the Security Event to establish the legitimacy of the user executing these commands. A non-administrative user executing such commands could indicate potential malicious activity.
  - **Correlate with network traffic**: Cross-reference detected activity with relevant network logs (e.g., Windows Filtering Platform logs) for unexpected outbound connections or unusual SMB traffic to identify lateral movement, especially to hidden shares.
  - **Inspect for file creation or modification**: Check for recent file activity on the target machine using Security Event IDs 4663 or Sysmon Event IDs 11/20 to see if files were created or modified after the named pipe attempt, indicative of data staging or exfiltration attempts.
  - **Monitor for related alerts**: Look for additional alerts or anomalies flagged around the same time frame, particularly any that reference lateral movement or privilege escalation techniques, to assess the broader context of the alert and possible campaign linkage.

  ### Prioritization

  The alert is considered high severity in an enterprise context as it indicates potential lateral movement within the network, which could lead to further compromise. The likelihood of malicious exploitation is moderate to high, given that named pipe impersonation is a commonly weaponized technique for privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as the use of obfuscation in the command line or the execution of benign processes that could create similar command patterns. Reliable detection requires properly configured logging sources, particularly for process creation and network activity. Legitimate command scripts or applications may trigger alerts, particularly in systems designed for system administration. A related detection to consider is the monitoring of unauthorized access attempts to shared resources, which can strengthen the coverage of lateral movement detection strategies.

