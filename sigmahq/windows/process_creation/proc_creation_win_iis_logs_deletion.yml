logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'cmd.exe'
    - 'powershell.exe'
    - 'powershell_ise.exe'
    - 'pwsh.dll'
  selection_cli_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
    - 'rm '
    - 'remove-item '
    - 'rmdir '
  selection_cli_iis_dir:
    CommandLine|contains: '\inetpub\logs\'
  condition: all of selection_*
falsepositives:
- Deletion of IIS logs that are older than a certain retention period as part of
