note: |
  ### Technical Context

  This Sigma rule detects attempts to delete IIS log files via command-line utilities, which is a common method attackers use to erase traces of their activities. By removing these log files, malicious actors seek to evade detection after compromising web applications hosted on IIS servers, typically aiming to conduct further malicious activity without raising alerts.

  The key relevant MITRE ATT&CK tactic is **Defense Evasion (TA0005)**, specifically the technique **Indicator Removal on Host (T1070)**. Primary telemetry sources include Windows process creation logs (Event ID 4688 and Sysmon Event ID 1) that capture command-line activities. If successful, the deletion of IIS logs significantly impacts forensic analysis and incident response, as it can obscure evidence of unauthorized access or data theft. However, this detection does NOT confirm that the deletion was malicious on its own; legitimate maintenance tasks may also trigger this alert.

  ### Investigation Steps

  - **Verify the process origin**: Check the parent process ID (PPID) for any suspicious parent processes in Event ID 4688. Legitimate deletion tasks usually originate from scheduled tasks or administrative tools like IIS Manager.

  - **Review command-line arguments**: Inspect the CommandLine field in Event ID 4688 for keywords such as 'del', 'erase', or commands specific to IIS logs. Look for commands involving `\inetpub\logs\`; repeated or unusual entries may indicate malicious intent.

  - **Analyze the frequency of deletions**: Compare the timestamp of the deletion events against normal log retention policies. Consistent deletion of recent log files (within retention policy limits) may indicate an attacker trying to cover their tracks.

  - **Identify legitimate log retention processes**: Determine if regular maintenance tasks or scripts are scheduled that may include log cleanup. If such tasks are identified, they may explain benign command-line deletions.

  - **Correlate with other alerts**: Check for correlated alerts or unusual user behavior in the days leading up to the deletion event. Cross-reference with security incidents or unapproved access logs that may suggest a wider compromise.

  - **Detect file system changes**: Validate whether `iis logs` subdirectory files are consistently missing using file system auditing or Sysmon FileCreate events (Event ID 11). Missing recent log entries after suspicious deletions can confirm malicious activity.

  ### Prioritization

  This alert should be considered of medium severance due to the potential impact of the affected IIS web servers, which can host critical enterprise applications. The likelihood of malicious abuse is moderate, as attackers frequently aim to conceal activities post-initial compromise. Deletion of IIS logs is a known method employed in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may miss cases where attackers use alternative means for log deletion or employ specialized tools that do not rely on standard command-line interfaces. Reliable detection requires monitoring command-line activity across all IIS-hosting servers and ensuring that audit logging is configured appropriately. Legitimate periodic log cleaning tasks may also trigger this alert, such as scheduled maintenance scripts. A related detection rule could encompass unauthorized access attempts to log directories to strengthen coverage on typically exploited systems.

