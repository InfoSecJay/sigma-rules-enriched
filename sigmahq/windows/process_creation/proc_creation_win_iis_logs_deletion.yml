level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to delete Internet Information Services (IIS) log files using command line utilities, which is a known method for threat actors to evade detection after compromising a system. Attackers frequently exploit vulnerabilities in web applications hosted on IIS to gain initial access and later remove or modify log files to obscure their activities. The deletion of these log files can hinder forensic investigations and incident responses by making it difficult to trace the actions of the attacker.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion (T1070)**, which encompasses techniques used by adversaries to suppress or conceal evidence of their actions in order to evade detection. The specific techniques may also include the use of command-line interface manipulation for log deletion. Primary data sources that provide visibility into these activities include process creation events — specifically focusing on command line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for the execution of command-line utilities such as `cmd.exe`, `powershell.exe`, and `pwsh.exe`, particularly where the command line contains keywords that denote file deletion methods.
  - **Analyze Command Line Arguments**: Check for command line arguments that include commands such as `del`, `erase`, `rm`, `remove-item`, or `rmdir` targeting the IIS log directory, specifically `\inetpub\logs\`.
  - **Inspect Historical Logs**: Gather information from IIS logs before the alleged deletion to identify any suspicious access patterns that might indicate unauthorized activity leading to the deletion.
  - **Check for Scheduled Tasks or Scripts**: Investigate any legitimate scheduled tasks or scripts that may run log cleanup commands occasionally to determine if their behavior aligns with normal maintenance patterns.

  ### Prioritization
  This alert has medium severity due to the potential impact of log deletion on incident response and forensic analysis efforts. If attackers successfully erase logs, they can complicate or prevent detection of malicious actions, increasing the likelihood of data breaches and extended dwell times in the environment.

  ### Blind Spots and Assumptions
  This detection may miss legitimate log deletions that occur as part of routine maintenance or scheduled tasks configured for regular log file management. The rule assumes that the log deletion commands are executed in a straightforward manner with recognizable patterns. For the detection to function as intended, comprehensive logging of command line arguments must be enabled on all Windows systems where IIS is running, and systems should be audited for scheduled tasks that may interfere with the integrity of IIS logs.

