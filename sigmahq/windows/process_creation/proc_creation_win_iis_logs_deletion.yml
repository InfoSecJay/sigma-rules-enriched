level: medium
note: |
  ### Technical Context

  This Sigma rule detects command-line attempts to delete IIS log files, a common behavior exhibited by attackers attempting to obfuscate their actions after compromising a system. The primary objective of the attacker is to erase their footsteps, making it difficult for defenders to trace malicious activity and correlate events leading to data breaches or unauthorized access. This behavior aligns with the MITRE ATT&CK framework under the tactic "Defense Evasion" (TA0005) and the technique "Indicator Removal on Host" (T1070).

  The primary telemetry sources for this detection include Windows process creation logs, specifically monitoring processes like `cmd.exe` and `powershell.exe`, with an emphasis on command line arguments that reference the IIS log directory located at `\inetpub\logs\`. If successfully executed, this behavior could significantly impair the organization’s ability to understand the scope of an incident or previous attack activities. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate log deletion can occur during routine maintenance.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for command-line invocations of `cmd.exe`, `powershell.exe`, or `powershell_ise.exe` that contain delete commands targeting `\inetpub\logs\`. Look for combinations like `del`, `erase`, or `remove-item` along with the full path to the log directory.

  - **Identify high-confidence malicious commands:** Specifically search for command lines that include patterns like `del \inetpub\logs\*` or similar delete commands. This could indicate an explicit attempt to clear logs without legitimate reason, such as during an attack.

  - **Inspect scheduled tasks and scripts:** Determine if the deletion of logs coincides with any legitimate scheduled tasks or maintenance scripts. Cross-reference with Task Scheduler logs (Event ID 106) to verify if there are any pre-existing cleanup tasks that would explain the activity.

  - **Evaluate log retention policies:** Review organizational policies regarding IIS log retention and deletion to discern if there is a legitimate case for the deletion. Check standard maintenance windows and procedures that may align with the timestamps of the alert.

  - **Examine related user behavior:** Look into the user account associated with the execution context of the command. Determine if this behavior is unusual for that user and review user activity for any previous anomalies or unrelated access.

  ### Prioritization

  This alert should be considered medium severity. An affected IIS server is critical to an organization's operations, and there is a reasonable likelihood that malicious actors will exploit the ability to manipulate log files to cover their tracks. This behavior is commonly weaponized during the later stages of an attack lifecycle.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of thorough logging configurations. If command-line logging is not enabled, actions may go unreported. Additionally, legitimate activities such as routine log file maintenance or automated clean-ups may unintentionally trigger this alert. Monitoring for similar techniques, such as modification of log settings or file access events within the log directory (`Event ID 4663`), can provide enhanced context for the alert and strengthen detection capabilities.

