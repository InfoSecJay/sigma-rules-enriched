title: Suspicious Service Path Modification
id: 138d3531-8793-4f50-a2cd-f291b2863d78
status: test
description: Detects service path modification via the "sc" binary to a 
  suspicious command or path
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
author: Victor Sergeev, oscd.community, Nasreddine Bencherchali (Nextron 
  Systems)
date: 2019-10-21
modified: 2022-11-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'config'
    - 'binPath'
    CommandLine|contains:
            # Add more suspicious commands or binaries
    - 'powershell'
    - 'cmd '
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'rundll32'
    - 'svchost'
    - 'dllhost'
    - 'cmd.exe /c'
    - 'cmd.exe /k'
    - 'cmd.exe /r'
    - 'cmd /c'
    - 'cmd /k'
    - 'cmd /r'
            # Add more suspicious paths
    - 'C:\Users\Public'
    - '\Downloads\'
    - '\Desktop\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    - 'C:\Windows\TEMP\'
    - '\AppData\Local\Temp'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This detection rule identifies modifications to service paths using the Windows Service Control (sc.exe) command-line utility, specifically when the command line includes suspicious binaries or paths. Attackers often manipulate service configurations to escalate privileges or maintain persistence by redirecting service execution to malicious payloads or scripts. This behavior is aligned with the MITRE ATT&CK technique for Service Creation (T1543.003).

  Primary telemetry sources include Windows Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation). If malicious, this can enable unauthorized access or prolonged exploitation of the system. It is important to note that this detection does not confirm a successful compromise but rather flags potentially malicious activity that warrants further investigation.

  ### Investigation Steps

  - **Review Event ID 4688: Process Creation Log:** Check for Event ID 4688 from Security logs. Look for processes created with sc.exe in the Command Line, specifically with parameters mentioning 'config' and 'binPath'.

  - **Analyze Sysmon Event ID 1:** Collect and investigate Sysmon logs (Event ID 1) for sc.exe invocations. Validate the full command line for any suspicious arguments, focusing on paths commonly used by attackers (e.g., paths under \Downloads\, \Temp\, or \Startup\).

  - **Identify Malicious Indicators:** Look for command lines containing suspicious executables such as 'powershell', 'mshta', or 'rundll32'. The presence of these in conjunction with sc.exe indicates a high-confidence malicious act.

  - **Establish Baseline of Legitimate Activity:** Document typical usage of the sc.exe command within your environment, including any known admin functions. Legitimate modifications will generally include commands that reference system files or common service parameters, not those leading to user profile folders or temporary directories.

  - **Check Active Services:** Review the list of currently running services using Get-Service or equivalent administrative tools. Investigate any services pointing to unexpected paths or newly created configuration entries after the alert.

  ### Prioritization

  This alert is high severity due to the potential for an adversary to establish persistence through service manipulation, particularly on critical systems. The behavior is known to be weaponized in various attack scenarios, increasing the likelihood of malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by systems or configurations that do not log sufficient process creation events, particularly if Sysmon is not deployed. Legitimate activities such as administrative script modifications or system updates could trigger this alert. Companion detections, such as monitoring for known malicious binaries being executed, can enhance coverage and mitigate false positives.

