title: Suspicious Service Path Modification
id: 138d3531-8793-4f50-a2cd-f291b2863d78
status: test
description: Detects service path modification via the "sc" binary to a suspicious
  command or path
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
author: Victor Sergeev, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-21
modified: 2022-11-18
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'config'
    - 'binPath'
    CommandLine|contains:
            # Add more suspicious commands or binaries
    - 'powershell'
    - 'cmd '
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'rundll32'
    - 'svchost'
    - 'dllhost'
    - 'cmd.exe /c'
    - 'cmd.exe /k'
    - 'cmd.exe /r'
    - 'cmd /c'
    - 'cmd /k'
    - 'cmd /r'
            # Add more suspicious paths
    - 'C:\Users\Public'
    - '\Downloads\'
    - '\Desktop\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    - 'C:\Windows\TEMP\'
    - '\AppData\Local\Temp'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects suspicious modifications to service paths in Windows environments using the "sc" command. These modifications may indicate that an attacker is trying to install or adjust a service to execute malicious code, often with the intent to maintain persistence in the compromised system. Attackers commonly target Windows services due to their elevated privileges, enabling them to run malicious payloads with system-level access.

  The likely purpose behind such activities includes establishing a foothold for further intrusions, executing payloads upon system startup, or altering existing services to redirect their functionality for nefarious purposes. The relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, with the associated technique being **Create or Modify System Process: Windows Service (T1543.003)**.

  The primary data sources for this detection rule include process creation logs from the Windows operating system, specifically focusing on events that register commands executed through the "sc.exe" binary. Analysts should review logs that capture detailed information about service modifications to identify any suspicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check Windows process creation logs for entries that include the "sc.exe" command, specifically focusing on any modifications related to 'binPath' parameters.
  - **Analyze Command Line Arguments**: Investigate the full command line used with "sc.exe" to identify any suspicious inclusions of known potentially malicious binaries or paths that are commonly associated with malware activity.
  - **Cross-reference with Service List**: Compare the modified services against a known baseline of legitimate services to identify any newly created or modified entries that appear anomalous.
  - **Check for Anomalous Behavior**: Monitor the execution patterns of any altered services for abnormal behavior, including unexpected restarts, network communication, and file changes within their execution directories.

  ### Prioritization
  The severity of this alert is high, as unauthorized modifications to service paths can lead to persistent malware infections. Since these services can run with elevated privileges, they significantly increase the risk of further compromise within the network.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on solely tracking "sc.exe" modifications; attackers may use alternative methods or tools to modify services that this rule does not capture. The detection logic assumes that services will only be modified by legitimate users and does not account for the possibility of system misconfigurations or legitimate administrative actions that may trigger false positives. It is essential that logging for process creation events is enabled and captures full command line details for this alert to function effectively.

