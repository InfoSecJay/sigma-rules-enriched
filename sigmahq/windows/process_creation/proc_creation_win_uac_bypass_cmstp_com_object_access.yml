logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\DllHost.exe'
    ParentCommandLine|contains:
    - ' /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}'         # cmstplua.dll
    - ' /Processid:{3E000D72-A845-4CD9-BD83-80C07C3B881F}'         # CMLUAUTIL
    - ' /Processid:{BD54C901-076B-434E-B6C7-17C531F4AB41}'         # EditionUpgradeManagerObj.dll
    - ' /Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}'         # colorui.dll
    - ' /Processid:{E9495B87-D950-4AB5-87A5-FF6D70BF3E90}'         # wscui.cpl
    IntegrityLevel:
    - 'High'
    - 'System'
    - 'S-1-16-16384'         # System
    - 'S-1-16-12288'         # High
  condition: selection
falsepositives:
- Legitimate CMSTP use (unlikely in modern enterprise environments)
level: high
note: |
  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) through the use of Microsoft Connection Manager Profile Installer (CMSTP) autoelevate-capable COM objects. Attackers may utilize CMSTP to execute code with elevated privileges without prompting the user or administrator, allowing them to gain unauthorized access to sensitive areas of the system. The relevant MITRE ATT&CK techniques for this behavior include **T1548.002 (Bypass User Account Control)** and **T1218.003 (Signed Binary Proxy Execution)**.

  The primary telemetry sources for this detection are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which provide a record of new process creation and the associated command line arguments. If successfully exploited, this technique could allow attackers to perform privilege escalation, leading to severe security incidents. It is important to note that detection of this behavior does NOT confirm malicious intent on its own, as legitimate use cases may exist, although they are rare in typical enterprise environments.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 and Sysmon Event ID 1 to identify the parent process as `DllHost.exe` and review the associated command line arguments for indicators of CMSTP execution.

  - **Analyze command line parameters**: Look specifically for the presence of `/Processid:{...}` with known CMSTP COM objects (`cmstplua.dll`, `CMLUAUTIL`, etc.) used in the command line. Legitimate CMSTP usage is uncommon; if found, further scrutiny is warranted.

  - **Inspect process integrity levels**: Validate the integrity level of the spawned process. The detection rule specifies processes with `High` or `System` integrity levels, which indicates potential misuse. Typical legitimate processes do not operate at these levels for CMSTP.

  - **Cross-reference system changes**: Investigate logs for any changes made to critical system settings or configurations that correlate with the timestamp of the alert. Look for elevated commands or privilege escalations occurring around the same time to establish a pattern of behavior.

  - **Look for external indicators of compromise**: Check for network connections or communication attempts made by the initiated process (if applicable). Correlate with telemetry for any signs of known malicious IP addresses or domains that have been previously identified.

  ### Prioritization

  This alert is considered high severity due to the potential for privilege escalation if exploited: an attacker gaining unauthorized access can lead to significant data breaches, system compromise, or lateral movement within the network. Given that UAC bypass techniques are commonly weaponized in the wild, the likelihood of malicious abuse is high.

  ### Blind Spots and Assumptions

  A limitation of this detection is the possibility of legitimate CMSTP usage being rare but plausible in niche scenarios, leading to false positives. Reliable detection requires enabling detailed process creation logging (Sysmon) to ensure comprehensive coverage. Additionally, admin activities or configuration changes using COM objects for legitimate purposes may inadvertently trigger this alert. A related detection rule for monitoring **T1068 (Exploitation of Elevation of Privilege Vulnerabilities)** could strengthen overall coverage during investigations.

