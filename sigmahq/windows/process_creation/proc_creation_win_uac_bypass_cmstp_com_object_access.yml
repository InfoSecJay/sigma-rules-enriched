note: |
  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) using the Microsoft Connection Manager Profile Installer (CMSTP) with auto-elevate-capable COM objects. Specifically, it watches for execution patterns where the parent process is `DllHost.exe`, indicating a possible abuse of legitimate functionality to escalate privileges or execute malicious code without proper user consent. Attackers may leverage this technique to gain elevated permissions on a target system, which can lead to further exploitation or persistence within the environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Execution** (T1203), **Defense Evasion** (T1218.003), and **Privilege Escalation** (T1548.002). By executing a malicious payload disguised as an innocuous command through a COM object, attackers can bypass standard security measures designed to protect user environments. The primary data sources for this detection involve process creation events, specifically filtering for command lines and process hierarchies that match known indicators of CMSTP abuse.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of `DllHost.exe` where the parent command line contains specific `/Processid:` entries related to COM objects known for UAC bypass techniques, especially those listed in the detection logic.

  - **Analyze Command Line Parameters:** Identify and analyze command lines used during these process executions. Look for unusual or undesired arguments that could signify malicious activity, especially focusing on common COM objects used for auto-elevation.

  - **Correlate with User Activity:** Check for any recent user activity that may justify the legitimate use of CMSTP. This context will help discern between benign and malicious actions, given that legitimate use in enterprise environments is rare.

  - **Evaluate Integrity Levels:** Investigate the integrity levels associated with the process executions. Confirm any instances of the detected processes running at High or System integrity levels which are often indicative of privilege escalation attempts.

  ### Prioritization
  This rule is assigned a high severity due to the significant risk associated with UAC bypass techniques, which could enable an attacker to gain elevated privileges and execute malicious actions within an enterprise environment. The impact is particularly high given the likelihood of exploitation if such a bypass is successful.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage concerning the legitimate usage of the CMSTP tool, which may occur infrequently but could still generate false positives. The detection logic assumes that any usage of the specified COM objects for auto-elevating operations under `DllHost.exe` is suspicious in context. For the alert to function effectively, appropriate logging must be enabled for process creation events, and the environments must have consistent configurations that align with the detection capabilities to capture the necessary telemetry efficiently.

