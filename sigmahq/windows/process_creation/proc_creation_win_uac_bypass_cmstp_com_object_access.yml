    - ' /Processid:{3E000D72-A845-4CD9-BD83-80C07C3B881F}'         # CMLUAUTIL
    - ' /Processid:{BD54C901-076B-434E-B6C7-17C531F4AB41}'         # EditionUpgradeManagerObj.dll
    - ' /Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}'         # colorui.dll
