detection:
  selection:
    ParentImage|endswith: '\DllHost.exe'
    ParentCommandLine|contains:
    - ' /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}'         # cmstplua.dll
    - ' /Processid:{3E000D72-A845-4CD9-BD83-80C07C3B881F}'         # CMLUAUTIL
    - ' /Processid:{BD54C901-076B-434E-B6C7-17C531F4AB41}'         # EditionUpgradeManagerObj.dll
    - ' /Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}'         # colorui.dll
    - ' /Processid:{E9495B87-D950-4AB5-87A5-FF6D70BF3E90}'         # wscui.cpl
    IntegrityLevel:
    - 'High'
    - 'System'
    - 'S-1-16-16384'         # System
    - 'S-1-16-12288'         # High
  condition: selection
falsepositives:
- Legitimate CMSTP use (unlikely in modern enterprise environments)
level: high
note: |
  ### Technical Context

  This Sigma rule detects UAC bypass attempts involving the Microsoft Connection Manager Profile Installer (CMSTP) via specific COM objects. Attackers may leverage CMSTP to escalate privileges by executing code with elevated rights without the user's consent, typically aiming to gain full control over the system or to perform malicious actions undetected. This activity corresponds to MITRE ATT&CK Technique T1548.002 (Bypass User Account Control), particularly during the execution phase of an attack lifecycle.

  The primary telemetry source for this detection is Windows process creation logs. The rule specifically looks for processes spawned from `DllHost.exe`, alongside command line arguments indicating the use of known COM objects known for facilitating UAC bypass. If malicious, this activity poses a significant risk, allowing unauthorized actions with administrative privileges. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may also trigger it, particularly in atypical environments.

  ### Investigation Steps

  - **Review process creation events**: Check for Security Event ID 4688 or Sysmon Event ID 1 for instances involving `DllHost.exe`. Pay attention to the command line for references to the specified Process IDs.

  - **Identify elevated integrity levels**: Look for logs indicating that the process was executed at High or System integrity levels. Secure logs may include the `IntegrityLevel` field showing 'High' or 'System' (SIDs: S-1-16-16384 and S-1-16-12288).

  - **Correlate with user activity**: Confirm that the user associated with the detected behavior has legitimate reasons to invoke CMSTP. It is uncommon for legitimate users to engage CMSTP in modern enterprise contexts.

  - **Check against known attack techniques**: Verify if any related security events were logged within proximity, such as abnormal login times, unexpected process parent-child relationships, or other suspicious behavior.

  - **Analyze legitimate CMSTP instances**: Understand benign usage patterns, including standard command line arguments in processes related to CMSTP during normal system operation, thus assisting in differentiating between legitimate and malicious activity.

  - **Validate unauthorized file creation**: Inspect the file system for new files or modifications in sensitive directories (e.g., `C:\Windows\Temp`) around the alert time; look specifically for files created by processes initiated by DllHost.exe.

  ### Prioritization

  The severity of this alert is high due to the potential impact on sensitive systems, particularly those with elevated privileges. The likelihood of abuse is significant since UAC bypass techniques are commonly weaponized in attacks. Detecting this activity may indicate an ongoing compromise or an attempt to escalate privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental factors, such as misconfigurations or the absence of relevant log sources (e.g., if Sysmon is not deployed). Additionally, legitimate activities might trigger this alert if CMSTP is used appropriately, although this is rare in modern enterprise settings. A related detection to strengthen coverage would be alerting on anomalous network activity following the privilege escalation attempt, which may signal lateral movement or data exfiltration.

