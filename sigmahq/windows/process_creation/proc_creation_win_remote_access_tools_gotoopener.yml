note: |
  ### Technical Context
  This detection rule identifies the execution of the GoToAssist application's 'GoTo Opener', a remote access tool (RAT) created by LogMeIn, Inc. Adversaries may exploit legitimate remote support software like GoToAssist to gain unauthorized access to targeted systems, allowing them to control environments covertly. The common use of such applications can enable attackers to establish a command and control (C2) channel without triggering immediate alerts from security controls, as they may fall within allowed application whitelists.

  The relevant MITRE ATT&CK tactics and techniques for this activity include Command and Control (TA0011) and the use of Remote Services (T1219). By embedding themselves in legitimate software stacks, attackers can carry out their objectives, such as data exfiltration or lateral movement, under the guise of normal operations.

  Primary data sources for detecting this behavior include process creation logs, where the command-line parameters and executable names are recorded. Monitoring these logs effectively enables identification of potential misuse of remote access tools.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for instances of 'GoTo Opener' execution. Pay attention to command-line arguments that might indicate unusual activity or non-standard user interactions.
  - **Analyze User Context:** Determine if the user executing the application is authorized to do so. Investigate the user's role and whether the execution aligns with their typical behavior.
  - **Correlate with Network Traffic:** Check for outbound connections initiated by the GoToAssist application. Ensure that the IP addresses are legitimate and expected within your environment.
  - **Cross-reference with Incident Data:** Investigate previous incidents involving the use of remote access tools and correlate any anomalies with past incidents to identify potential patterns of abuse.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized remote access on sensitive data and system integrity. Given the increasing use of remote support tools in both legitimate and malicious contexts, the likelihood of adversarial exploitation is notable, necessitating timely investigation.

  ### Blind Spots and Assumptions
  The detection may be limited by the organization's logging practices, as poorly configured or insufficiently detailed process creation logs can result in missed detections. Additionally, the rule assumes that the use of 'GoTo Opener' itself is not legitimate; therefore, security teams must discern between authorized and unauthorized use cases. The rule's efficacy relies on a comprehensive logging strategy that captures detailed process creation events.

