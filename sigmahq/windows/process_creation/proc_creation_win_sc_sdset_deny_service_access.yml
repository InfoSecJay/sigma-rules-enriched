logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sdset:
    CommandLine|contains|all:
    - 'sdset'
    - 'D;'         # Deny Access
  selection_trustee:
    CommandLine|contains:
    - ';IU'         # Interactively logged-on user
    - ';SU'         # Service logon user
    - ';BA'         # Built-in administrators
    - ';SY'         # Local system
    - ';WD'         # Everyone
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to manipulate service access controls using the `sc.exe` command on Windows systems. Specifically, it looks for modifications to the Discretionary Access Control Lists (DACLs) that deny access to critical user services. Such actions could be taken by an attacker seeking to maintain persistence, escalate privileges, or hide malicious services from administrators. The objective of this behavior typically aligns with obfuscating their presence within the environment or preventing legitimate users from stopping a malicious service.

  The rule pertains to the MITRE ATT&CK techniques related to **Privilege Escalation** and **Persistence**. The most relevant technique is `T1543.003 - Create or Modify System Process: Windows Service`, which details how attackers can manipulate service settings to execute malicious actions while evading detection. Analysts should focus on key data sources, such as process creation events that capture command-line arguments for `sc.exe`, which provide insight into any suspicious modifications made to services.

  ### Investigation Steps
  - **Analyze Process Creation Events:** Review logs for instances of `sc.exe` being executed, paying close attention to the command-line arguments that include `sdset` and denial flags (e.g., 'D;'). Look for suspicious patterns and correlate them with timestamps of security incidents.

  - **Review DACL Modifications:** Collect and inspect the Security Descriptor in the Windows Event Logs to confirm changes made to services, specifically focusing on service accounts like `IU` (Interactively logged-on user) and `SU` (Service logon user) being targeted.

  - **Examine Change Histories:** Check for other related logs or alerts around the time of modification that may provide context on who initiated the change and any prior suspicious activities, such as enumeration commands or lateral movement attempts.

  - **Correlate with Network Traffic:** Evaluate network logs for any anomalies that coincide with the time of service modification, particularly those indicating external connections that could suggest the involvement of remote threats or C2 communications.

  ### Prioritization
  Given that manipulating service access controls can lead to evasive actions by attackers, the severity of this alert is high. The impact on an enterprise environment is significant as it opens avenues for persistent threats and potential data breaches.

  ### Blind Spots and Assumptions
  This detection rule relies on the proper logging of command-line arguments associated with process creation. A significant gap exists in environments that may not have detailed process logging enabled or where `sc.exe` is used legitimately for routine service management. Additionally, assumptions are made regarding the absence of obfuscation techniques that attackers might employ to manipulate their actions, potentially bypassing this detection. Required configurations include ensuring that command-line arguments are logged in the system for comprehensive analysis.

