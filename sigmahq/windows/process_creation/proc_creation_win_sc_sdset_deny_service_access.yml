note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of `sc.exe` to manipulate Security Descriptor Access Control Lists (DACL) in order to deny access to critical system services. The likely attacker objective is to establish persistence by tampering with service permissions, preventing legitimate access for specific user accounts or groups, which can be instrumental in maintaining unauthorized control over the system. This behavior is associated with the MITRE ATT&CK technique **T1543.003: Create or Modify System Process: Windows Service.**

  The primary telemetry sources include Windows process creation logs with a focus on Event ID 4688 and Sysmon Event ID 1 that capture command line activity for `sc.exe`. If malicious, this could lead to service obfuscation or the inability of security tools to access and monitor services. Importantly, this detection does NOT confirm a successful compromise on its own, as legitimate administrators may also modify service permissions for valid reasons.

  ---

  ### Investigation Steps

  - **Examine command line execution for `sc.exe`:** Look for Event ID 4688 or Sysmon Event ID 1 entries with the `Image` path ending in `\sc.exe` and `CommandLine` containing `sdset D;`. Legitimate uses may include service permission adjustments for valid operational purposes.

  - **Identify affected service authorization changes:** Analyze the command line arguments in the logs specifically for `;IU`, `;SU`, `;BA`, `;SY`, and `;WD`. If these include attempts to deny access, such as `D;`, this may indicate malicious intent.

  - **Review access modifications to critical services:** Track any changes to service permissions on high-impact services (e.g., Antivirus, Remote Desktop). Utilize Windows Event ID 5140 from Security logs to monitor for access attempts on sensitive service paths.

  - **Correlate with user behavior:** Assess the user or process that initiated the command. Cross-reference with user logs (e.g., logon events, account status) to determine if there is a legitimate role associated with the action.

  - **Check for other security alerts:** Review for companion detections related to service modification attempts or privilege escalation, such as alerts for process creation patterns indicative of known attack frameworks or behaviors.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical system services. Given that DACL tampering is a tactic commonly used by adversaries to establish persistence and hide malicious activities, the likelihood of malicious abuse is significant, particularly in environments hosting sensitive data or critical business functions.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate administrative practices that commonly alter service permissions. Notably, unmonitored administrative accounts may conduct routine maintenance that could trigger this alert. Ensure logging configurations include necessary audit trails for DACL changes and `sc.exe` executions. A related detection to consider is any generic security descriptor tampering (Refer to Sigma rule ID 98c5aeef-32d5-492f-b174-64a691896d25) to bolster coverage against similar threats.

