detection:
  selection_sc:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_sdset:
    CommandLine|contains|all:
    - 'sdset'
    - 'D;'         # Deny Access
  selection_trustee:
    CommandLine|contains:
    - ';IU'         # Interactively logged-on user
    - ';SU'         # Service logon user
    - ';BA'         # Built-in administrators
    - ';SY'         # Local system
    - ';WD'         # Everyone
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the modification of Discretionary Access Control Lists (DACLs) on Windows services using the Security Control (sc.exe) command. Such modifications typically aim to deny access to critical service accounts or users, potentially allowing an attacker to hide malicious services or prevent service management by legitimate administrators. Relevant tactics include **Privilege Escalation (T1068)** and techniques such as **T1543.003** (Create or Modify System Process: Windows Service).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) that capture command-line activities. If malicious, this behavior could allow persistent control over services, creating avenues for unauthorized actions within the environment. However, the presence of this alert alone does not confirm an attack; legitimate administrative actions could also trigger it.

  ### Investigation Steps

  - **Check Process Command Line: **Review the Windows Security Event ID 4688 for the process creation of sc.exe. Look specifically for the **CommandLine** field containing ‘sdset’ and ‘D;’. Confirm if the user executing this command is a high-privilege account (e.g., SYSTEM, Administrator).

  - **Identify Affected Trust Indicators: **Examine the **CommandLine** for the presence of specific trust indicators such as `;IU`, `;SU`, `;BA`, or `;WD`. The use of `;WD` (Everyone) would be particularly concerning and is a high-confidence indicator of malicious activity.

  - **Evaluate Historical Context: **Correlate the timestamp of the alert with previous system events. Look for any unusual patterns in service creation or access attempts in the **Service Control Manager logs** (Event ID 7045) on the same or nearby timestamps.

  - **Validate Normal Usage: **Determine if legitimate administrative users have executed similar commands previously for service management by checking command history or logs. Expected behaviors would involve known system administrators performing service configuration.

  - **Assess Asset Criticality: **Determine the service's criticality affected by the DACL modification. If the service is integral to infrastructure operations or security monitoring, escalate the investigation.

  - **Investigate for Compensating Activity: **Check for potential malware or persistence mechanisms that may have been established as a result of service tampering. Look for unusual scheduled tasks or file changes, especially in directories related to service executables.

  ### Prioritization

  This alert carries a high severity due to the potential for significant impact on critical infrastructure services. The likelihood of malicious exploitation is high, given that DACL modifications typically indicate an attacker's effort to manipulate system resources covertly. Such behaviors have been observed in various exploit chains and persistence mechanisms.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for legitimate administrative actions to trigger false positives, especially in environments with extensive service management. The absence of complete logging for sc.exe command execution and variations in administrative practices may also hinder visibility. Tools or configurations must ensure logging for command-line parameters is enabled to reliably detect these actions. A related detection to consider is the monitoring of abnormal service creation or deletion events (Event ID 7045), aiding in correlating service modifications with other suspicious activities.

