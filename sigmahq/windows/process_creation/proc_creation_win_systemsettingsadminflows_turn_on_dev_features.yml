note: |
  ### Technical Context

  This Sigma rule detects the enabling of developer features in Windows, specifically through the `SystemSettingsAdminFlows.exe` process. This behavior is commonly leveraged by attackers to install untrusted applications, which can serve as a conduit for malware or unwanted software. The primary MITRE ATT&CK tactic here is **Defense Evasion (T1203)**, particularly the technique of **Application Layer Protocol Abuse (T1203.003)**.

  The primary telemetry source for this detection includes Windows process creation logs, specifically Event ID 4688 for process creation and Sysmon Event ID 1. If malicious, enabling developer features can lead to the installation of undetected malware or non-compliant applications, compromising the security posture of the environment. This detection does NOT confirm that malware has been executed; it only indicates a potential method to bypass application signing requirements.

  ### Investigation Steps

  - **Check Process Creation Logs:**
    Review Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `SystemSettingsAdminFlows.exe` creating a process with `TurnOnDeveloperFeatures` or similar command-line parameters. Indicator of concern.

  - **Evaluate Command Line Inputs:**
    Analyze command-line arguments for signs of `DeveloperUnlock` or `EnableSideloading`. Malicious activity is suggested if these terms are present without legitimate user consent.

  - **Identify User Context:**
    Confirm the user account associated with the activity. If the account is a standard user with no administrative privileges attempting this action, it could indicate malicious intent.

  - **Assess for Legitimate Use Cases:**
    Determine if the developer features were enabled as part of authorized IT processes such as app testing or deployment. Valid use cases might include specific IT department users performing controlled application installations.

  - **Cross-Check Registry Changes:**
    Investigate Windows Registry keys related to developer mode settings (`HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModel\State\DeveloperMode`). Significant changes to these keys can corroborate potentially malicious developer feature activation.

  - **Review Prior Alerts or Incidents:**
    Align findings with any past alerts linked to suspicious application installations or execution of non-signed applications. A connection to prior incidents can deepen the context of the alert.

  ### Prioritization

  This alert is classified as high priority due to the potential for significant impact if developer features are enabled maliciously. The high likelihood of abuse exists, as attackers often use such features to manipulate the system or deploy malware. This behavior is observed in numerous exploitation workflows.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate users enabling developer features without triggering alerts, especially in environments where such practices are common. Consistently updated logging configuration for Windows processes is necessary for reliable detection. Legitimate software development activities can also trigger this alert, such as internal testing environments. Companion detection to consider includes monitoring for non-compliant software installations following the enabling of developer features for comprehensive coverage.

