note: |
  ### Technical Context

  This Sigma rule detects the enabling of Windows Developer Features, which includes actions such as "Developer Mode" and "Application Sideloading." These features allow users to install untrusted applications outside the Microsoft Store, which attackers might exploit to bypass signing requirements and run malicious software. The relevant MITRE ATT&CK tactic is "Defense Evasion," specifically technique T1203 (Exploitation for Client Execution).

  The primary telemetry sources are Windows process creation logs, focusing on Event ID 4688 for process creation and specifically monitoring for the presence of "SystemSettingsAdminFlows.exe" as well as command line arguments indicating developer feature activation. If malicious, the enabling of these features could lead to the installation of malware disguised as legitimate software. However, this detection alone does not confirm that malicious activity is occurring, as these settings can also be employed for legitimate testing or development purposes.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of "SystemSettingsAdminFlows.exe" being executed. This process is specifically tied to enabling developer features and its execution context should be assessed for legitimacy.

  - **Analyze command lines used:** Validate the command line parameters related to the enabling of developer features, such as 'TurnOnDeveloperFeatures', 'DeveloperUnlock', or 'EnableSideloading' in the process creation logs. Legitimate administrative tasks may show these commands, while irregular usage patterns could indicate potential abuse.

  - **Review user account activity:** Investigate the user account that triggered this alert. Accounts associated with legitimate application development should align with enabling developer features, whereas unexpected user accounts or patterns may indicate potential compromise.

  - **Assess file creation and installation artifacts:** Identify any newly installed applications or changes in application integrity around the time developer features were enabled. Check for suspicious executables or installations logged by the Windows Event Viewer, particularly in application logs (Event ID 1033).

  - **Correlate with known bad indicators:** Cross-reference the detected enabling of developer features against threat intelligence feeds for known malicious application signatures that may leverage these settings.

  ### Prioritization

  This alert is categorized as high severity due to the elevated risk associated with enabling developer features on critical systems. The ability to install untrusted applications greatly increases the potential for malware deployment, a tactic commonly weaponized by adversaries during an attack.

  ### Blind Spots and Assumptions

  This detection may not capture all potential evasion techniques, as attackers may use legitimate administrative accounts to enable these settings without raising alarms. Reliable detection requires correct configuration to ensure logs from the Windows process creation source are being collected. Legitimate activities, such as development work by authorized personnel, may trigger the alert frequently. A related detection to consider is monitoring the presence of untrusted applications post-activation of developer features, which can provide stronger context for malicious intent.

