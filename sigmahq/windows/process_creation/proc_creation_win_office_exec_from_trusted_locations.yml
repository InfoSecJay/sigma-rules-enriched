title: Potentially Suspicious Office Document Executed From Trusted Location
id: f99abdf0-6283-4e71-bd2b-b5c048a94743
status: test
description: Detects the execution of an Office application that points to a 
  document that is located in a trusted location. Attackers often used this to 
  avoid macro security and execute their malicious code.
references:
- Internal Research
- https://twitter.com/Max_Mal_/status/1633863678909874176
- https://techcommunity.microsoft.com/t5/microsoft-365-blog/new-security-hardening-policies-for-trusted-documents/ba-p/3023465
- https://twitter.com/_JohnHammond/status/1588155401752788994
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
modified: 2023-10-18
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
        # Note: we add a parent shell to reduce FP. Add additional 3rd party shells that you might use
    ParentImage|endswith:
    - '\explorer.exe'
    - '\dopus.exe'
  selection_img:
  - Image|endswith:
    - '\EXCEL.EXE'
    - '\POWERPNT.EXE'
    - '\WINWORD.exe'
  - OriginalFileName:
    - 'Excel.exe'
    - 'POWERPNT.EXE'
    - 'WinWord.exe'
  selection_trusted_location:
    CommandLine|contains:
            # Note: these are the default locations. Admins/Users could add additional ones that you need to cover
    - '\AppData\Roaming\Microsoft\Templates'
    - '\AppData\Roaming\Microsoft\Word\Startup\'
    - '\Microsoft Office\root\Templates\'
    - '\Microsoft Office\Templates\'
  filter_main_dotx:
        # Note: We add this filter to avoid curious people clicking on template files
    CommandLine|endswith:
    - '.dotx'
    - '.xltx'
    - '.potx'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Microsoft Office applications (Excel, PowerPoint, Word) that open documents located in trusted locations, such as the Templates or Startup folders. Attackers often exploit these folders to bypass macro security settings and execute malicious code without raising alarms.

  This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1202), where threat actors attempt to execute payloads from trusted locations in order to avoid detection. The primary telemetry sources for this detection are Windows process creation logs, specifically monitoring Event ID 4688. If confirmed malicious, the security impact may include data breaches, lateral movement, or further exploitation of the environment.

  However, this detection does NOT confirm that the document is malicious on its own; further investigation is required to ascertain the legitimacy of the file and the context of the execution.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 for processes where the parent image ends with `explorer.exe` or `dopus.exe` and the new process is `EXCEL.EXE`, `POWERPNT.EXE`, or `WINWORD.exe`. Log paths can be found in Windows Event Viewer under Security.

  - **Assess command line arguments:** Identify command lines associated with the Office processes. Look for arguments that contain paths leading to trusted locations like `\AppData\Roaming\Microsoft\Templates\`. Malicious indicators will likely show execution from these trusted paths without user-generated files.

  - **Identify potential benign execution:** Check for recent legitimate uses of Office applications accessing known templates, especially from users who routinely work with these files. Relevant command lines might include familiar document names or user actions.

  - **Review document file properties:** Analyze the actual files executed from trusted locations to check the original file name and other properties via Windows File Explorer or `Get-Item` PowerShell cmdlet. Malicious files may have suspicious creation dates or be named generically, such as "Invoice.docx."

  - **Correlate with other security products:** If an EDR is deployed, cross-reference any endpoint behavior alerts triggered by known malicious hashes or behaviors, particularly around the Office applications in question.

  - **Check for existing security configuration:** Investigate security settings in Microsoft Office that pertain to trusted document locations or restrict macro execution. This may indicate whether the organization properly mitigated risks associated with trusted locations.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems if exploited. The likelihood of malicious abuse is moderate, as attackers commonly weaponize macro-less execution tactics using trusted locations in Office applications. Since this method is well-documented in threat intelligence, swift evaluation is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by users adding non-standard trusted locations or executing legitimate Office procedures, which can trigger false positives. Required log sources include not only process execution logs but also Office activity logs that may denote file activity. Legitimate behavior, such as workflow automation involving templates, can cause alerts. Companion detections include monitoring for abnormal file modifications within trusted locations or execution anomalies that coincide with this detection.

