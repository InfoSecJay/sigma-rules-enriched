title: Potentially Suspicious Office Document Executed From Trusted Location
id: f99abdf0-6283-4e71-bd2b-b5c048a94743
status: test
description: Detects the execution of an Office application that points to a document
  that is located in a trusted location. Attackers often used this to avoid macro
  security and execute their malicious code.
references:
- Internal Research
- https://twitter.com/Max_Mal_/status/1633863678909874176
- https://techcommunity.microsoft.com/t5/microsoft-365-blog/new-security-hardening-policies-for-trusted-documents/ba-p/3023465
- https://twitter.com/_JohnHammond/status/1588155401752788994
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
modified: 2023-10-18
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
        # Note: we add a parent shell to reduce FP. Add additional 3rd party shells that you might use
    ParentImage|endswith:
    - '\explorer.exe'
    - '\dopus.exe'
  selection_img:
  - Image|endswith:
    - '\EXCEL.EXE'
    - '\POWERPNT.EXE'
    - '\WINWORD.exe'
  - OriginalFileName:
    - 'Excel.exe'
    - 'POWERPNT.EXE'
    - 'WinWord.exe'
  selection_trusted_location:
    CommandLine|contains:
            # Note: these are the default locations. Admins/Users could add additional ones that you need to cover
    - '\AppData\Roaming\Microsoft\Templates'
    - '\AppData\Roaming\Microsoft\Word\Startup\'
    - '\Microsoft Office\root\Templates\'
    - '\Microsoft Office\Templates\'
  filter_main_dotx:
        # Note: We add this filter to avoid curious people clicking on template files
    CommandLine|endswith:
    - '.dotx'
    - '.xltx'
    - '.potx'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets the execution of Microsoft Office applications (Excel, PowerPoint, and Word) from trusted locations, which can indicate potentially malicious activity aiming to bypass macro security features. Attackers leverage this method to run their payloads without triggering common security defenses like macro blocking, as documents in trusted locations are presumed safe by default. The overarching objective may involve data exfiltration, lateral movement, or deployment of further malicious tools within a compromised environment.

  Relevant MITRE ATT&CK tactics involved include:
  - **Defense Evasion (T1202)**: This technique refers to how adversaries may exploit trusted locations to execute payloads under the radar of detection mechanisms, as these documents are often overlooked by security filters.

  Primary data sources that yield significant evidence for this detection include:
  - Process creation logs from Windows operating systems, which capture the execution of processes and their command lines.
  - Detailed logs that show the origin of documents and their potential trusted status, which helps differentiate between benign and suspicious activity in common Office directories.

  ### Investigation Steps
  - **Review Process Creation Events**: Check for the recorded instances of Excel, PowerPoint, or Word where the parent process is a known explorer instance. This may highlight unusual interactions leading to document execution.
  - **Analyze Command Line Arguments**: Inspect the command line used during the process creation for any instance of document execution from trusted directories, indicating potentially malicious use of trusted locations.
  - **Correlate with System Activity Logs**: Investigate related artifacts such as file access logs and network events to determine if there are any follow-up actions or external connections initiated by the executed Office application.
  - **Check for Macro Behavior**: Even in cases where the execution appears legitimate, verify if there are unexpected scripts or macros executing to further assess the benignity of the Office application's behavior.

  ### Prioritization
  This alert is categorized as high severity owing to the increased likelihood of sophisticated attacks leveraging trusted document execution to deploy malware or facilitate lateral movement within the enterprise environment. Prompt investigation is critical to mitigate potential data breaches or further compromise.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage for unmonitored locations or newly defined trusted document paths that may not be included in this rule. The detection logic assumes that any execution from trusted locations is suspicious, which may not always hold true for legitimate operational activity. Furthermore, the capturing of process creation logs and an accurate definition of trusted directories is essential for the alert to function effectively.

