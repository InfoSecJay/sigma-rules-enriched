title: Potentially Suspicious Office Document Executed From Trusted Location
id: f99abdf0-6283-4e71-bd2b-b5c048a94743
status: test
description: Detects the execution of an Office application that points to a 
  document that is located in a trusted location. Attackers often used this to 
  avoid macro security and execute their malicious code.
references:
- Internal Research
- https://twitter.com/Max_Mal_/status/1633863678909874176
- https://techcommunity.microsoft.com/t5/microsoft-365-blog/new-security-hardening-policies-for-trusted-documents/ba-p/3023465
- https://twitter.com/_JohnHammond/status/1588155401752788994
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
modified: 2023-10-18
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
        # Note: we add a parent shell to reduce FP. Add additional 3rd party shells that you might use
    ParentImage|endswith:
    - '\explorer.exe'
    - '\dopus.exe'
  selection_img:
  - Image|endswith:
    - '\EXCEL.EXE'
    - '\POWERPNT.EXE'
    - '\WINWORD.exe'
  - OriginalFileName:
    - 'Excel.exe'
    - 'POWERPNT.EXE'
    - 'WinWord.exe'
  selection_trusted_location:
    CommandLine|contains:
            # Note: these are the default locations. Admins/Users could add additional ones that you need to cover
    - '\AppData\Roaming\Microsoft\Templates'
    - '\AppData\Roaming\Microsoft\Word\Startup\'
    - '\Microsoft Office\root\Templates\'
    - '\Microsoft Office\Templates\'
  filter_main_dotx:
        # Note: We add this filter to avoid curious people clicking on template files
    CommandLine|endswith:
    - '.dotx'
    - '.xltx'
    - '.potx'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of Microsoft Office applications (Excel, PowerPoint, Word) that originate from trusted locations, particularly with command lines indicating file paths that may host malicious documents. Attackers often utilize this technique to circumvent default macro security features, leveraging the trust associated with these document locations to execute malicious payloads without raising security alerts.

  The relevant MITRE ATT&CK technique is Execution via trusted location (T1202). The primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) that capture where and how processes are launched. If exploited, this detection can lead to data breaches or unauthorized access to sensitive information. However, this detection does NOT confirm malicious activity on its own; additional investigation is required to determine intent.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 for processes initiated from trusted locations. Look for command lines that include paths like `\AppData\Roaming\Microsoft\Templates` or `\Microsoft Office\Templates`.

  - **Validate parent process:** Confirm that the execution is initiated from a legitimate parent process such as `explorer.exe`. Unexpected parent processes coupled with Office executions may indicate suspicious behavior.

  - **Identify document type:** Determine if the executed document type is potentially malicious. Legitimate documents typically do not end with `.dotx`, `.xltx`, or `.potx`, which could instead indicate deceptive document templates used for exploitation.

  - **Cross-check with user behavior:** Assess if the user context aligns with expected activity. For example, legitimate access should correlate with known workflows, such as recent document edits by users within their typical applications.

  - **Explore system impact assessment:** Analyze the affected system’s role within the environment. A critical server executing a suspicious Office application from a trusted location warrants immediate escalation.

  - **Look for indicators of exfiltration:** If applicable, check for unusual file creation or uploads close in time to the execution, possibly indicating data transfer to an external entity. Review network logs or file access events for signs of exfiltration.

  ### Prioritization

  Given the use of trusted locations to execute potentially malicious documents, the severity of this alert is high. The impact escalates if the affected system is critical or handles sensitive data. This technique is commonly weaponized in phishing campaigns, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of trusted locations, as administrators might set custom directories that aren't monitored. Evasion techniques could include the use of benign documents or executing scripts through other trusted applications. Legitimate activities such as automated processes in software development may trigger the alert. Companion detections, such as those monitoring unusual file creation or modification events, can enhance coverage against this tactic.

