note: |
  ### Technical Context
  This detection rule identifies instances where a threat actor may be using PowerShell cmdlets to export certificates from the local certificate store. The cmdlets `Export-PfxCertificate` and `Export-Certificate` are typically employed in administration tasks, but they can also be misused by attackers to access sensitive information, such as private keys, from compromised systems. This behavior is particularly concerning in environments where proper access controls and logging are not enforced, enabling attackers to maintain persistence or perform lateral movements.

  The likely attacker objectives include stealing cryptographic keys for further exploitation, which could lead to unauthorized access to secure communications or sensitive data. Furthermore, since certificates are integral to establishing trust in various systems and applications, their unauthorized export represents a significant threat to an organization's security posture.

  Relevant MITRE ATT&CK tactics include:
  - Credential Access (TA0006)
    - **T1552.004**: Use alternate authentication material
  - Execution (TA0002)
    - **T1059.001**: PowerShell

  Primary data sources for detection will be process creation events specifically related to PowerShell activities, which can indicate when these potentially malicious cmdlets are executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for PowerShell activities around the time of the alert to identify any command executions related to `Export-PfxCertificate` or `Export-Certificate`.

  - **Analyze Command Line Arguments**: Look closely at the command line parameters used with PowerShell. Automated scripts or unusual parameters may indicate suspicious behavior.

  - **Correlate with User Accounts**: Investigate the user account initiating the command. Anomalous access or actions from accounts that shouldn't be performing certificate exports should be flagged for further review.

  - **Check Recent Certificate Changes**: Review changes in the certificate store to understand what certificates may have been exported and assess their potential impact on security.

  ### Prioritization
  This alert is assigned a medium severity due to its potential to expose sensitive cryptographic materials, which could facilitate further attacks within the organization. The likelihood of misuse is heightened in environments where users may have elevated privileges or where security policies regarding certificate handling are lax.

  ### Blind Spots and Assumptions
  Gaps in detection coverage could arise from legitimate administrative activities that involve certificate exports, which may lead to false positives. The detection logic assumes that any invocation of the specified cmdlets is malicious unless clearly justified, hence additional context may be necessary to avoid misclassification. Moreover, proper logging of PowerShell commands must be configured and enabled to ensure this detection rule functions effectively, as missing or disabled logging could result in undetected exploitation attempts.

