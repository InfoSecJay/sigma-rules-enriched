note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that export certificates from the local certificate store, specifically focusing on the use of `Export-PfxCertificate` and `Export-Certificate`. An attacker may aim to extract sensitive information, like private keys, from compromised systems, facilitating further access or lateral movement within an environment. The relevant MITRE ATT&CK tactic is Credential Access (TA1200) and technique T1552.004, which covers unauthorized access to system credentials.

  The primary telemetry sources include Windows Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation events with detailed command line arguments). If exploited maliciously, this behavior could lead to the compromise of sensitive data and further unauthorized access to applications and services. It is crucial to note that the detection of these command executions does NOT confirm that a breach has occurred on its own, as legitimate administrative activities can also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Event ID 4688 for instances of PowerShell launching with command line arguments containing `Export-PfxCertificate` or `Export-Certificate`. Compare the user context; legitimate exports will frequently be conducted by known administrative accounts during normal hours.

  - **Review Sysmon logs for detailed execution context:** Validate Sysmon Event ID 1 to capture the command line parameters and execution path. Look for signs of obfuscation or unusual arguments, indicative of malicious intent.

  - **Correlate with user activity:** Investigate actions performed by the user executing the PowerShell command. Confirm if the user has a legitimate reason to export certificates or if they are exhibiting unusual behavior that warrants further scrutiny.

  - **Monitor for additional credential access attempts:** Look for other credential collection-related events (e.g., Event IDs signaling access to LSASS memory) that may complement the detection of this alert, indicating a broader pattern of credential compromise.

  - **Examine related network activity:** Check for outbound connections or file creations linked to the execution of these commands, particularly files related to exported certificates that may indicate exfiltration attempts (e.g., checking for `.pfx` or `.cer` files in user directories or temporary folders).

  ### Prioritization

  This alert is considered medium severity due to the potential risk of sensitive credential theft from affected systems, particularly those that are critical for organizational functions. While not common, the abuse of certificate exports is known among adversaries, making it a relevant alert in the context of a robust security posture.

  ### Blind Spots and Assumptions

  Detection may miss legitimate exports by authorized administrators if not sufficiently filtered, potentially leading to false positives. This rule relies on the presence of comprehensive logging for both PowerShell activity and application behavior. Legitimate administrative routines, especially for certificate management and maintenance, can inadvertently trigger this alert. A companion detection that enhances coverage includes monitoring for certificate store access logs such as Windows Event ID 4769 (Service Ticket Request), which can help correlate certificate use and access patterns.

