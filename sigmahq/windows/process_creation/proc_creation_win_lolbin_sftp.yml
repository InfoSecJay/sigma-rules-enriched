title: Use Of The SFTP.EXE Binary As A LOLBIN
id: a85ffc3a-e8fd-4040-93bf-78aff284d801
status: test
description: Detects the usage of the "sftp.exe" binary as a LOLBIN by abusing 
  the "-D" flag
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/264
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-10
tags:
- attack.execution
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sftp.exe'     # The "sftp.exe" located in the OpenSSH directory has no OriginalFileName :(
    CommandLine|contains:
            # Since "-D" is a valid flag for other usage we assume the user is going to enter a path
            # Either a full one like "C:\Windows\System32\calc.exe" or a relative one "..\..\..\Windows\System32\calc.exe"
            # In my testing you can't execute direct binaries by their name via this method (if you found a way please update the rule)
    - ' -D ..'
    - ' -D C:\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `sftp.exe` binary with the `-D` flag, which is commonly abused by adversaries to disguise malicious activities, such as launching additional payloads or conducting lateral movements within a network. The attacker’s objective is typically to use a trusted application (the SFTP client) to execute malicious commands while evading detection. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Windows Command Shell (T1059.003).

  The primary telemetry source for this detection is Process Creation logs from Windows, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide insight into command-line activity and parent-child process relationships. If successful, this malicious activity could facilitate unauthorized access to sensitive data or systems. However, it is important to note that this detection alone does not confirm malicious intent; it merely indicates potentially suspicious use of the `sftp.exe` binary with specific parameters.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `sftp.exe` execution with the `-D` parameter. Look for anomalies in command-line arguments that deviate from expected behavior.

  - **Identify legitimate use cases**: Assess if recent instances of `sftp.exe` usage align with authorized business processes (e.g., transfers to known servers). Confirm the presence of typical arguments and paths, ensuring the command structure follows organizational standards.

  - **Correlate with user activity**: Examine the user's activity to confirm if they typically utilize `sftp.exe`. Event IDs like 4624 (logon) could help establish context for the user session associated with the execution of the process.

  - **Analyze parent-child process relationships**: Investigate the parent process of the `sftp.exe` execution. Malicious activity often involves execution from scripts or other binaries, identified by cross-referencing with Sysmon logs for Event ID 1.

  - **Collect additional evidence**: Check for file creation events or network connections indicating data exfiltration related to the execution. Look for unusual outbound traffic on ports commonly used by SFTP (port 22) suggesting file transfer activity correlating with this rule.

  ### Prioritization

  This alert should be classified as medium severity due to the potential for significant impact on sensitive data if exploited. The likelihood of malicious abuse is high since `sftp.exe` is a known, trusted application that can be misused for unauthorized access. The behavior detected has been weaponized in various attacks, raising the urgency for thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possible usage of legitimate `sftp.exe` commands by authorized users, which can generate false positives. The effective detection also requires proper logging configurations, particularly enabling process creation auditing. Legitimate users might invoke `sftp.exe` with the `-D` flag for valid reasons, necessitating careful analysis of user behavior. A related detection is the use of other LOLBins (Living Off The Land Binaries) like `cmd.exe` or `powershell.exe` in conjunction with `sftp.exe`, which can help identify patterns of misuse across tools.

