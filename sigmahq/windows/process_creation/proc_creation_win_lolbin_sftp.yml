title: Use Of The SFTP.EXE Binary As A LOLBIN
id: a85ffc3a-e8fd-4040-93bf-78aff284d801
status: test
description: Detects the usage of the "sftp.exe" binary as a LOLBIN by abusing 
  the "-D" flag
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/264
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-10
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sftp.exe'     # The "sftp.exe" located in the OpenSSH directory has no OriginalFileName :(
    CommandLine|contains:
            # Since "-D" is a valid flag for other usage we assume the user is going to enter a path
            # Either a full one like "C:\Windows\System32\calc.exe" or a relative one "..\..\..\Windows\System32\calc.exe"
            # In my testing you can't execute direct binaries by their name via this method (if you found a way please update the rule)
    - ' -D ..'
    - ' -D C:\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `sftp.exe` binary using the `-D` flag, which is often associated with abuse for establishing reverse shells or tunneling during lateral movement in a target environment. The likely attacker objective involves utilizing this legitimate binary to bypass security controls while exploiting its trusted and commonly installed nature. Related MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and **Execution** (TA0002), specifically technique **Planet T1218**.

  The primary telemetry sources are Windows process creation events, specifically targeting **Security Event ID 4688** (which details new process creations) along with relevant command-line arguments associated with those processes. If malicious, this behavior could facilitate unauthorized access or data exfiltration. Importantly, this detection does not on its own confirm malicious intent; it only indicates the use of `sftp.exe` with suspicious command-line arguments.

  ### Investigation Steps

  - **Review process creation events**: Examine Security Event ID 4688 for process creation details relating to `sftp.exe`. Check fields for `NewProcessName` and `CommandLine` to see if they include `-D` flags.

  - **Identify contextual usage of the binary**: Determine if `sftp.exe` was executed on systems where SSH file transfer is expected, such as servers or workstations with legitimate operational needs. Legit usage may include entries like `sftp.exe user@host` without the `-D` flag.

  - **Correlate with authentication logs**: Inspect corresponding authentication logs (Event ID 4624) to check if the user executing `sftp.exe` had unusual access patterns that deviate from baseline behavior.

  - **Investigate network connections**: Check network logs for any outgoing connections initiated from the host executing `sftp.exe`. Focus on traffic to external IP addresses or unusual port usage that aligns with tunneling behaviors.

  - **Verify for known malicious indicators**: Seek for signs of established reverse shells or tunneling, such as connection attempts from non-standard IPs or ports in network logs that coincide with `sftp.exe` usage.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the affected system's integrity and the common weaponization of legitimate binaries for nefarious purposes. Given the increasing trend of adversaries leveraging LOLBins like `sftp.exe`, analysts should prioritize investigations that reveal the context and intent behind the alert.

  ### Blind Spots and Assumptions

  The detection capabilities may be limited if not all process creation events are being logged. Attackers may utilize other command-line arguments or legitimate user activity that inadvertently triggers this alert. Configurations ensuring complete event logging of process creations (such as capturing command lines) are essential for reliable detection. A related detection may include the use of other LOLBINs, particularly those under the **Execution** tactic, to enhance coverage across similar behaviors.

