title: Use Of The SFTP.EXE Binary As A LOLBIN
id: a85ffc3a-e8fd-4040-93bf-78aff284d801
status: test
description: Detects the usage of the "sftp.exe" binary as a LOLBIN by abusing the
  "-D" flag
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/264
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-10
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sftp.exe'     # The "sftp.exe" located in the OpenSSH directory has no OriginalFileName :(
    CommandLine|contains:
            # Since "-D" is a valid flag for other usage we assume the user is going to enter a path
            # Either a full one like "C:\Windows\System32\calc.exe" or a relative one "..\..\..\Windows\System32\calc.exe"
            # In my testing you can't execute direct binaries by their name via this method (if you found a way please update the rule)
    - ' -D ..'
    - ' -D C:\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the suspicious usage of the `sftp.exe` binary, particularly when invoked with the `-D` flag, which facilitates file transfers over SSH. By leveraging this binary as a "Living Off The Land" Binary (LOLBIN), attackers may attempt to exfiltrate data without raising immediate alarms, blending in with legitimate traffic. The primary objective of the threat actor may involve data theft or command execution on remote systems using a seemingly benign process, ultimately maintaining a foothold within the network while minimizing detection risks.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and **Execution** (TA0002), specifically leveraging the technique **Using System Binary** (T1218). The data sources that provide the most pertinent evidence to support the detection include **process creation events** on Windows systems, which log command line arguments and executable paths every time a process is initiated.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation events to identify instances of `sftp.exe` being executed with the `-D` flag. Pay attention to the complete command line used to ascertain if any suspicious file paths are referenced.

  - **Evaluate User Accounts and Permissions:** Investigate the user accounts executing `sftp.exe`, particularly looking for unusual accounts or permissions that may indicate misuse. Look for any accounts that should not normally execute this utility.

  - **Check Network Traffic:** Analyze network flows for any SSH traffic initiated from the machine in question. This may reveal attempted connections to unusual external IP addresses, which could indicate data exfiltration efforts.

  - **Correlate with Historical Events:** If applicable, correlate current alerts with historical logs for recurring instances of this execution pattern to identify potential indicators of compromise or behavior changes over time.

  ### Prioritization
  This alert is assigned a medium severity due to its potential to indicate malicious activity, particularly in environments where data exfiltration is a concern. The likelihood of `sftp.exe` being misused increases when there is an absence of legitimate SSH use in the network, warranting timely investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging is not properly configured or if the `sftp.exe` binary exists in locations outside of the expected OpenSSH directory. The detection logic assumes that the use of the `-D` flag is unusual for legitimate business operations, which may not hold true in all environments. Therefore, ensuring comprehensive logging of process creation events, especially capturing command-line arguments, is crucial for this alert to function effectively.

