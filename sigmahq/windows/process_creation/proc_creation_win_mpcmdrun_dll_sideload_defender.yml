note: |
  ### Technical Context
  This detection rule identifies potentially malicious sideloading of the `mpclient.dll` library using Microsoft Defender processes, specifically `MpCmdRun.exe` and `NisSrv.exe`, from non-standard directories. Sideloading is a method attackers may use to execute malware by leveraging trusted applications to load unauthorized code, thereby evading security measures. In this case, adversaries may aim to employ the legitimate Defender processes as a cover for running their malicious payloads, which could align with a broader strategy of privilege escalation or lateral movement.

  The relevant MITRE ATT&CK tactics for this detection include **Privilege Escalation (TA0004)**, **Persistence (TA0003)**, and **Defense Evasion (TA0005)**. More specifically, it correlates with technique **T1574.001 - DLL Sideloading** which emphasizes the use of trusted system processes to load malicious DLLs. Ideal telemetry for detecting this behavior includes process creation events from Windows systems, particularly logs capturing command-line arguments and the file paths of the executables involved.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs that detail process creation events related to `MpCmdRun.exe` and `NisSrv.exe`. Focus on the command-line parameters and initiate paths to ascertain whether any non-standard directories are being used.

  - **Analyze File Locations**: Verify the directories from which these processes are executing. Legitimate runs should originate from defined Windows Defender directories. Track any deviations that indicate non-standard execution paths.

  - **Conduct Threat Intelligence Review**: Check against threat intelligence feeds and internal indicators to see whether similar tactics have been observed in the environment or reported in external incidents, particularly related to ransomware such as LockBit.

  - **Validate Impact on Systems**: Assess impacted systems for signs of compromise by checking for unusual processes, newly created files, or outbound connections that correlate with known malicious activity linked to the suspected use of `mpclient.dll`.

  ### Prioritization
  Given the high-risk nature of the alert—due to the use of trusted system processes for potentially malicious activities—this detection should be prioritized for immediate investigation. The likelihood of attackers attempting to leverage Windows Defender for evasion makes timely response critical to prevent potential breaches.

  ### Blind Spots and Assumptions
  This detection may not cover all methods of side-loading, especially if alternative delivery mechanisms that do not involve the specified Defender processes are utilized. The rule assumes proper logging configurations are in place to capture process creation events and command-line arguments for investigations to be effective. If logging is not enabled or incorrectly configured, legitimate malicious activities could be missed by this rule, resulting in false negatives in detection.

