  ### Technical Context

  This Sigma rule detects the execution of the DIT Snapshot Viewer (ditsnap.exe), which is an inspection tool used to analyze the NTDS.dit file, the Active Directory database. Its presence generally indicates potential credential access activities, as adversaries may utilize the tool to extract sensitive information from Active Directory for lateral movement or privilege escalation. This behavior corresponds with the MITRE ATT&CK techniques under the credential access tactic, specifically T1003.003 - Credential Dumping: NTDS.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture new process creation events. If this tool is used maliciously, it could lead to unauthorized access to sensitive account information and credentials stored in Active Directory. However, this detection does NOT confirm any successful credential theft; it only indicates the potential examination of the AD database.

  ### Investigation Steps

  - **Check process details**: Look for instances of `ditsnap.exe` in process creation logs (Event ID 4688). Confirm the Image path for legitimacy. Malicious execution often occurs from unexpected or suspicious directories.

  - **Review command line arguments**: Inspect command line arguments related to any detected instances of `ditsnap.exe`. Analyze for suspicious flags or paths. Legitimate use might include admin-specific parameters, whereas malicious usage could involve abnormal paths or obfuscation techniques.

  - **Identify source of execution**: Analyze the user account that executed `ditsnap.exe`. Determine if the account is legitimate or shows signs of compromise. Administrators may run this tool, but unexpected user accounts raise flags.

  - **Correlate with other logs**: Investigate Security Event ID 4624 (logon events) to see if suspicious logon events correlate with the execution time of `ditsnap.exe`. Highlight signs of lateral movement or unauthorized access attempts.

  - **Search for exfiltration traces**: Look into file system changes or unauthorized file creation, particularly around sensitive directories such as `C:\Windows\NTDS\`. Verify if there were any attempts to copy the NTDS.dit file or create snapshots.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on Active Directory integrity and confidentiality. The likelihood of malicious exploitation is moderate to high, given that investigative tools targeting NTDS are commonly utilized by threat actors. The behavior observed is especially alarming due to its relevance in known credential theft methodologies.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative use of DIT snapshots, which could generate false positives. Reliable detection requires monitoring both process creation and command line inputs, which may necessitate enhanced logging configurations. Additionally, authorized tools used for AD management might inadvertently trigger the alert, making contextual awareness necessary. A companion detection rule that could enhance coverage is monitoring for known PowerShell commands or scripts that target NTDS for credential harvesting activities.

