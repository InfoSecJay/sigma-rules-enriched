  ### Technical Context
  This detection rule is designed to identify the execution of the Ditsnap tool, which is employed primarily to extract and analyze the Active Directory database file, `ntds.dit`. The presence of this tool in an enterprise environment can indicate potential malicious intent, often related to the extraction of sensitive information, user credentials, and security configurations from the Active Directory, which can be leveraged in later stages of an attack, such as lateral movement or privilege escalation.

  In threat scenarios, attackers may use Ditsnap to gather intelligence about the Active Directory structure, exploit weak permissions, and create plant points for further attacks. The associated objectives often include obtaining credentials, mapping a network, or planning additional compromise tactics to escalate privileges or perform lateral movement. This behavior aligns with the MITRE ATT&CK framework, particularly the tactics of **Credential Access** (TA0006) and the technique **Credential Dumping: NTDS.dit** (T1003.003).

  Key data sources for evidence include process creation events, which record instances of executables being run on Windows systems, and can reveal the command line arguments passed to them. Monitoring these logs can help identify unauthorized or unexpected use of potentially harmful tools like Ditsnap.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for any instances of `ditsnap.exe` in process creation events, noting the user accounts and workstations from which it was executed. This information can help determine if the activity was legitimate or suspicious.

  - **Analyze Command-Line Arguments**: Inspect the command-line parameters associated with `ditsnap.exe`. Malicious commands may include options that suggest the extraction of information from Active Directory, which could indicate unauthorized data access.

  - **Check User Context and Permissions**: Identify the user account that executed the tool. Compare their permissions against expected roles; unusually high privileges may signify an account compromise.

  - **Correlate with Active Directory Logs**: Look into any relevant LDAP logs or Active Directory event logs during the time of execution for additional contextual data. This can include unusual queries or modifications that would align with the times the Ditsnap tool was executed.

  ### Prioritization
  The alert is considered high severity because the execution of Ditsnap indicates a potential compromise of Active Directory, which could lead to significant security breaches and data exfiltration within the organization. Given the likelihood of misuse in an environment where privileged credentials are easily accessible, prompt investigation is crucial.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if process creation logging is not enabled or is incomplete, which could allow the use of Ditsnap to go undetected. The detection logic assumes that all instances of `ditsnap.exe` should be flagged, though there may be legitimate administrative use cases that do not indicate malicious intent. To ensure reliable detection, it is essential to have comprehensive process creation logs enabled and to maintain a proper understanding of normal administrative activities in the environment.

