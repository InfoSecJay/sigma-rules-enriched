title: Process Creation Using Sysnative Folder
id: 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab
status: test
description: Detects process creation events that use the Sysnative folder (common
  for CobaltStrike spawns)
references:
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Max Altgelt (Nextron Systems)
date: 2022-08-23
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains: ':\Windows\Sysnative\'
  - Image|contains: ':\Windows\Sysnative\'
  filter_main_ngen:
    Image|contains:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\ngen.exe'
    CommandLine|contains: 'install'
  filter_optional_xampp:
    CommandLine|contains|all:
    - '"C:\Windows\sysnative\cmd.exe"'
    - '\xampp\'
    - '\catalina_start.bat'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies process creation events specifically utilizing the Sysnative folder in Windows. The Sysnative folder is a mechanism that allows 32-bit applications to interact with 64-bit components, making it a notable target for advanced threat actors using tools like Cobalt Strike. By monitoring the command lines associated with process creation that reference Sysnative, organizations can capture potential malicious activities where attackers may spawn processes to evade detection and maintain persistence.

  The threat scenario typically involves an attacker leveraging Cobalt Strike — a popular post-exploitation framework — to execute commands that may spoof legitimate applications or execute payloads while avoiding scrutiny. The primary objectives of such operations might include data exfiltration, lateral movement, or establishing an ongoing foothold within the target environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1562): By using Sysnative, attackers aim to bypass security controls.
  - **Privilege Escalation** (T1055): Certain commands invoked through the Sysnative path may lead to elevated privileges.

  The primary data sources for this detection are Windows process creation logs, which can be obtained from Sysmon or the Windows Event Log (Event ID 4688) where process execution is recorded.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows event logs capturing process creation events (Event ID 4688) to identify any instances of command lines or images that utilize the Sysnative folder. Look for irregularities in execution patterns.
  - **Correlate with EDR Events**: Use EDR tools to correlate any identified events with additional telemetry, such as user behavior, file modifications, and network connections, to identify any lateral movement or additional suspicious activities linked to the detected process.
  - **Analyze Command Line Parameters**: Inspect the command line parameters associated with any flagged processes for known malicious patterns or signs of automation, particularly looking for references to Cobalt Strike-specific commands or scripts.
  - **Cross-reference with MITRE Framework**: Use the MITRE ATT&CK framework to assess potential overlaps with known threat actor tactics and behaviors. Document any anomalies or similarities that could indicate an active exploitation attempt.

  ### Prioritization
  This alert holds a medium severity level due to the potential risk of an attacker using Cobalt Strike to establish a foothold or execute further malicious operations within the environment. Given the tool's sophistication and commonality in advanced persistent threat scenarios, timely investigation is critical to preventing further compromise.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of malicious use of the Sysnative folder, particularly if attackers utilize other benign processes or legitimate command-line tools to obfuscate their activities. The alert also assumes that comprehensive logging for process creation events is enabled and that no filtering mechanisms improperly exclude legitimate administrative activities. Organizations must ensure that necessary logs, such as Windows Event Log and EDR telemetry, are configured to support this detection effectively.

