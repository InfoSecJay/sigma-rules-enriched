title: Process Creation Using Sysnative Folder
id: 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab
status: test
description: Detects process creation events that use the Sysnative folder (common
  for CobaltStrike spawns)
references:
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Max Altgelt (Nextron Systems)
date: 2022-08-23
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains: ':\Windows\Sysnative\'
  - Image|contains: ':\Windows\Sysnative\'
  filter_main_ngen:
    Image|contains:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\ngen.exe'
    CommandLine|contains: 'install'
  filter_optional_xampp:
    CommandLine|contains|all:
    - '"C:\Windows\sysnative\cmd.exe"'
    - '\xampp\'
    - '\catalina_start.bat'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of processes that utilize the Sysnative folder, a technique commonly employed by adversaries using Cobalt Strike to bypass restrictions imposed by User Account Control (UAC) in 64-bit environments. The likely attacker objective is to execute malicious payloads in a way that evades security measures while maintaining persistence and stealth. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion (T1562)** and **Privilege Escalation (T1068)**.

  The primary telemetry source for this detection are Windows Process Creation logs, specifically the Event IDs related to new process creation, such as **Event ID 4688** and Sysmon **Event ID 1**. If the process is malicious, it indicates an attempt to execute hidden or elevated commands that may compromise the system or exfiltrate data. Importantly, this detection alone does NOT confirm malicious activity; it identifies potentially suspicious behavior requiring further investigation.

  ---

  ### Investigation Steps

  - **Review Process Creation Details:** Examine Event ID **4688** and Sysmon Event ID **1** logs for any processes referencing `C:\Windows\Sysnative\`. Focus on the **CommandLine** field for suspicious arguments indicating elevated command execution.

  - **Check for Known Malicious Indicators:** Look for known malicious executables such as `ngen.exe` being invoked from the Sysnative directory with commands that include `install`. Cross-reference with threat intelligence regarding Cobalt Strike activity.

  - **Identify Legitimate Usage Patterns:** Assess any legitimate scripting or automation processes that might access `C:\Windows\Sysnative\` (e.g., system maintenance tasks) and ensure they do not contain malicious arguments that would signify an attack.

  - **Investigate Parent-Child Process Relationships:** Use Sysmon Event ID **1** to analyze parent processes for any suspicious characteristics. Parent processes like `cmd.exe` or PowerShell invoking other executables from Sysnative are indicators of potential misuse.

  - **Monitor File System Changes:** Validate if the creation of processes from Sysnative correlates with file creation or modification in sensitive directories (e.g. user folders). Check for suspicious file extensions or unusually large files created around process execution times.

  - **Assess Environment Context:** Consider the role of the affected host. On critical servers or endpoints, such behavior might be more indicative of a significant threat. Review asset criticality to prioritize response actions effectively.

  ---

  ### Prioritization

  The alert is classified as medium severity due to the potential impact on systems, particularly in critical environments where sensitive data is handled. The likelihood of malicious abuse is high, given that this behavior is associated with known evasion techniques used in various attack scenarios, notably those involving Cobalt Strike, which is frequently weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the UAC configuration on the system and the absence of adequate logging to capture all process creations. Systems with disabled Sysmon logging may fail to capture the necessary telemetry. Legitimate administrative tools or scripts occasionally utilize the Sysnative folder, leading to potential false positives. A related detection to strengthen coverage would be monitoring for suspicious scheduled tasks or scripts invoking processes from Sysnative, as this often accompanies the misuse of process creation techniques.

