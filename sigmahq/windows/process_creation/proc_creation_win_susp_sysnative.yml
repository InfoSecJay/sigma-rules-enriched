title: Process Creation Using Sysnative Folder
id: 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab
status: test
description: Detects process creation events that use the Sysnative folder 
  (common for CobaltStrike spawns)
references:
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Max Altgelt (Nextron Systems)
date: 2022-08-23
modified: 2025-10-08
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains: ':\Windows\Sysnative\'
  - Image|contains: ':\Windows\Sysnative\'
  filter_main_ngen:
    Image|contains:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\ngen.exe'
    CommandLine|contains: 'install'
  filter_optional_xampp:
    CommandLine|contains|all:
    - '"C:\Windows\sysnative\cmd.exe"'
    - '\xampp\'
    - '\catalina_start.bat'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized process creation using the Sysnative folder, commonly exploited by adversaries utilizing Cobalt Strike for process injection or privilege escalation. The primary attacker objective is to execute malicious processes on a compromised host without raising alarms, leveraging the Sysnative path to circumvent standard user-space restrictions. This detection aligns with the MITRE ATT&CK technique T1055 (Process Injection).

  The primary telemetry sources for this detection come from Windows process creation logs (Security Event ID 4688) and Sysmon (Event ID 1). If malicious, the security impact includes unauthorized command execution and potential system compromise. However, detection of this behavior alone does not confirm malicious intent, as legitimate applications could invoke this path under certain conditions.

  ### Investigation Steps

  - **Review process creation details:** Check Windows Security Event ID 4688 or Sysmon Event ID 1. Look for processes with command lines containing `:\Windows\Sysnative\`, and examine the user context under which they were invoked (e.g., SYSTEM vs. user-level accounts).

  - **Identify known benign processes:** Validate whether the process creation includes typical benign applications that leverage Sysnative, particularly in the context of .NET framework usage or XAMPP installations.

  - **Check command line parameters:** Analyze the command line for unusual flags or parameters. Malicious indicators could include arguments like 'install' seen with processes ending in 'ngen.exe'.

  - **Correlate with installed software:** Cross-reference the behavior with installed software inventory to identify any unknown or unauthorized applications that may invoke components from the Sysnative path.

  - **Monitor for persistence mechanisms:** Investigate if the detected process creation could be part of establishing persistence, especially if seen in conjunction with known Cobalt Strike beacons or scripts.

  ### Prioritization

  This alert is of medium severity due to the risk of privilege escalation and lateral movement within the enterprise environment. The Sysnative directory is not typically used by legitimate applications for process creation, thus raising the likelihood of malicious intent if detected. The behavior is a common tactic employed by sophisticated attackers.

  ### Blind Spots and Assumptions

  Detection may face limitations from evasion techniques such as legitimate use of Sysnative by software vendors or misconfigured applications. Reliable detection requires appropriate logging configurations, specifically for process creation events via security logs and Sysmon. Legitimate actions such as certain automated scripts or administrative tasks could trigger this alert, leading to false positives. Companion detections such as monitoring for specific Cobalt Strike indicators (e.g., beacons or related artifacts) could enhance coverage and context for this alert.

