title: Process Creation Using Sysnative Folder
id: 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab
status: test
description: Detects process creation events that use the Sysnative folder 
  (common for CobaltStrike spawns)
references:
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
author: Max Altgelt (Nextron Systems)
date: 2022-08-23
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains: ':\Windows\Sysnative\'
  - Image|contains: ':\Windows\Sysnative\'
  filter_main_ngen:
    Image|contains:
    - 'C:\Windows\Microsoft.NET\Framework64\v'
    - 'C:\Windows\Microsoft.NET\Framework\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm\v'
    - 'C:\Windows\Microsoft.NET\FrameworkArm64\v'
    Image|endswith: '\ngen.exe'
    CommandLine|contains: 'install'
  filter_optional_xampp:
    CommandLine|contains|all:
    - '"C:\Windows\sysnative\cmd.exe"'
    - '\xampp\'
    - '\catalina_start.bat'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects process creation events that utilize the Sysnative folder, a technique often employed by attackers to bypass 32-bit/64-bit subsystem restrictions on Windows. Specifically, this behavior is associated with the use of Cobalt Strike, a popular tool among threat actors for executing malicious payloads. The relevant MITRE ATT&CK tactics involved are Defense Evasion (TA0005) and Privilege Escalation (TA0004) utilizing the technique T1055 (Process Injection).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details of processes initiated on the system. If this behavior is confirmed malicious, it poses a significant risk, as it may indicate active exploitation or lateral movement in the network. However, it’s important to note that this detection does NOT confirm that the detected process execution is inherently malicious or part of an intrusion; further context is required for validation.

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 for the process creation event. Focus on the CommandLine and Image fields for entries containing `:\Windows\Sysnative\`. Record the parent process ID to assess the origin of the execution.

  - **Analyze the command line arguments:** Inspect the full command line captured in the logs. Look specifically for the presence of `ngen.exe` along with `install` in the CommandLine, as these are indicative of potentially malicious behavior linked to .NET application misuse.

  - **Identify legitimate Sysnative usage:** Consider expected legitimate activities for tools like XAMPP or .NET frameworks. Verify if the process instance corresponds to known administrative or development tasks and if the entire execution context justifies its activity.

  - **Correlate cross-event analysis:** Cross-reference recent network traffic or other endpoint alerts to identify any related malicious artifacts, such as unusual outbound connections or previously logged Cobalt Strike activity, that may indicate a broader attack.

  - **Evaluate host behavior:** Determine the role of the affected host (e.g., web server, database server) and its criticality within the enterprise. Hosts performing legitimate administrative tasks should not typically showcase Sysnative activity; any occurrence should warrant further scrutiny.

  ### Prioritization

  This alert is of medium severity because it indicates a potential method commonly employed by adversaries to execute code with elevated privileges. The likelihood of malicious behavior is moderate, as legitimate applications may invoke the Sysnative path, but instances of Cobalt Strike and related tools using this method are well-documented in the threat landscape.

  ### Blind Spots and Assumptions

  Detection may miss instances of legitimate applications that legitimately execute via Sysnative, such as IT management tasks or development environments that involve .NET applications. Additionally, configurations must ensure monitoring of all relevant process event logs to capture this behavior accurately. Another detection that could strengthen coverage includes monitoring for lateral movement patterns associated with Cobalt Strike, such as beaconing back to an external command and control server.

