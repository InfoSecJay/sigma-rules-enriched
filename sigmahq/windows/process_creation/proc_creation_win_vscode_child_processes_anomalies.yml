title: Potentially Suspicious Child Process Of VsCode
id: 5a3164f2-b373-4152-93cf-090b13c12d27
status: test
description: Detects uncommon or suspicious child processes spawning from a 
  VsCode "code.exe" process. This could indicate an attempt of persistence via 
  VsCode tasks or terminal profiles.
references:
- https://twitter.com/nas_bench/status/1618021838407495681
- https://twitter.com/nas_bench/status/1618021415852335105
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-26
modified: 2023-10-25
tags:
- attack.execution
- attack.stealth
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\code.exe'
  selection_children_images:
    Image|endswith:
    - '\calc.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
  selection_children_cli:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'Invoke-Expressions'
    - 'IEX'
    - 'Invoke-Command'
    - 'ICM'
    - 'DownloadString'
    - 'rundll32'
    - 'regsvr32'
    - 'wscript'
    - 'cscript'
  selection_children_paths:
    Image|contains:
            # Add more suspicious locations
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - ':\Temp\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- In development environment where VsCode is used heavily. False positives may 
  occur when developers use task to compile or execute different types of code. 
  Remove or add processes accordingly
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious child processes spawned from the Visual Studio Code executable (`code.exe`). The behavior suggests possible persistence mechanisms employed by an adversary, leveraging VSCode tasks or terminal profiles to execute malicious commands. The likely attacker objective is to establish long-term access and control over the target system by embedding malware or scripts within a trusted development environment.

  This detection aligns with MITRE ATT&CK technique Execution (T1202) and Window Command Shell (T1059.003) as it involves executing command line scripts. The primary telemetry source is process creation events, particularly those logged by Windows Event ID 4688, as well as command line activity. If confirmed malicious, this behavior could compromise development environments, leading to wider system exploitation or data exfiltration. Importantly, this detection does not confirm malicious intent on its own; it simply highlights unusual behavior that warrants further investigation.

  ### Investigation Steps

  - **Review parent process context:** Check for Event ID 4688 logs for the `code.exe` parent process, including the user context under which it was executed. Look for patterns of legitimate use versus unexpected execution by non-development users.

  - **Analyze child process creation:** Identify child processes spawned from `code.exe` in Event ID 4688 logs. Pay close attention to suspicious images like `\calc.exe`, `\regsvr32.exe`, or `\powershell.exe`. Cross-reference the command line arguments for potentially malicious payloads.

  - **Inspect command line arguments:** For any identified child processes, focus on the CommandLine field. Look for indicators like 'Invoke-Expressions', 'IEX', or 'DownloadString', which suggest script or payload execution. These are high-confidence malicious indicators.

  - **Validate legitimate usage:** Investigate the development context. In environments where VSCode is used heavily, confirm that the detected child processes are part of typical development workflows (e.g., debugging or compiling code) and assess relevant user roles.

  - **Check for suspicious file creation:** Review temporary file creation within directories such as `C:\Users\Public\` or `C:\Windows\Temp\`. Look for unusual file types or timestamps that may indicate unauthorized activity or persistence.

  ### Prioritization

  Alerts from this detection should be treated with medium priority. While the impact of a compromised development machine can be significant, standard user interactions with VSCode may produce similar patterns, leading to benign alerts. Therefore, the likelihood of malicious abuse remains moderately high but is not universally applicable across all environments.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as utilizing legitimate scripts or processes that achieve similar outcomes without triggering alerts. Reliable detection requires configured logging for process creation events, primarily event ID 4688. This alert may also trigger during legitimate development activities, especially in heavy usage environments. A related detection to strengthen coverage could involve identifying unusual network connections initiated by child processes of `code.exe`, indicating data exfiltration attempts.

