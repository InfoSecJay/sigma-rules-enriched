title: Potentially Suspicious Child Process Of VsCode
id: 5a3164f2-b373-4152-93cf-090b13c12d27
status: test
description: Detects uncommon or suspicious child processes spawning from a VsCode
  "code.exe" process. This could indicate an attempt of persistence via VsCode tasks
  or terminal profiles.
references:
- https://twitter.com/nas_bench/status/1618021838407495681
- https://twitter.com/nas_bench/status/1618021415852335105
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-26
modified: 2023-10-25
tags:
- attack.execution
- attack.defense-evasion
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\code.exe'
  selection_children_images:
    Image|endswith:
    - '\calc.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
  selection_children_cli:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'Invoke-Expressions'
    - 'IEX'
    - 'Invoke-Command'
    - 'ICM'
    - 'DownloadString'
    - 'rundll32'
    - 'regsvr32'
    - 'wscript'
    - 'cscript'
  selection_children_paths:
    Image|contains:
            # Add more suspicious locations
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - ':\Temp\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- In development environment where VsCode is used heavily. False positives may occur
  when developers use task to compile or execute different types of code. Remove or
  add processes accordingly
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially suspicious child processes originating from the Visual Studio Code (VsCode) process (code.exe), often indicating attempts at establishing persistence through VsCode tasks or terminal profiles. An attacker may exploit the trusted context of VsCode to execute malicious commands or scripts without immediate detection. The relevant MITRE ATT&CK tactics include Execution (T1202) and Defense Evasion (T1218). The primary telemetry sources are Windows process creation logs, specifically targeting Event ID 4688 or Sysmon Event ID 1 to capture the parent-child process relationships. If the detected behavior is malicious, it may lead to unauthorized access, data exfiltration, or system compromise. This detection does NOT confirm malicious intent solely based on the occurrence of child processes; further investigation is necessary.

  ---

  ### Investigation Steps

  - **Identify the parent process:** Check for the parent process with Image ending in `\code.exe`. Document the PID of code.exe to establish the process tree.

  - **Review child processes:** List child processes spawned from code.exe; focus on any that have images ending in `\calc.exe`, `\regsvr32.exe`, or `\powershell.exe`. Identify any uncommon execution patterns that deviate from standard development activities.

  - **Analyze command lines for suspicious activity:** Examine command line arguments for child processes, looking for terms like `Invoke-Expressions`, `IEX`, or `DownloadString`. These may indicate attempts to execute scripts or download additional payloads.

  - **Validate legitimate activities:** In environments where VsCode is used heavily, verify if the detected activity correlates with expected developer tasks or routine compilations, particularly in development environments to mitigate false positives.

  - **Correlate with file creation or system impact:** For any suspicious child process executions from VsCode, correlate with log entries indicating file creation or manipulation in directories like `C:\Users\Public\` or `C:\Windows\Temp\`, which could suggest persistence mechanisms.

  - **Document indicators of compromise:** Record any high-confidence malicious indicators such as execution of `regsvr32.exe` or scripts via `wscript` and `cscript`, especially when these occur outside of normal operational parameters.

  ---

  ### Prioritization

  Alerts generated by this rule should be classified as medium severity. The presence of suspicious child processes can indicate a potential attempt to achieve persistence or execute malicious commands, especially if the affected system is a critical developer machine. The likelihood of abuse is elevated due to the trusted nature of VsCode, which attackers often exploit.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the possibility of legitimate processes mimicking suspicious behaviors, particularly in active development environments. The effectiveness relies on the comprehensive logging of process creation events in all relevant environments, ensuring that logs are forwarded without gaps. Additionally, extensive use of VsCode may trigger false alerts; adjustments and further contextual understanding of the environments are essential. A companion detection to consider includes monitoring for unusual network traffic originating from processes like `powershell.exe` to detect data exfiltration attempts.

