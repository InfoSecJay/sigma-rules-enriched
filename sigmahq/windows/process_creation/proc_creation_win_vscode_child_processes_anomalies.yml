title: Potentially Suspicious Child Process Of VsCode
id: 5a3164f2-b373-4152-93cf-090b13c12d27
status: test
description: Detects uncommon or suspicious child processes spawning from a 
  VsCode "code.exe" process. This could indicate an attempt of persistence via 
  VsCode tasks or terminal profiles.
references:
- https://twitter.com/nas_bench/status/1618021838407495681
- https://twitter.com/nas_bench/status/1618021415852335105
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-26
modified: 2023-10-25
tags:
- attack.execution
- attack.defense-evasion
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\code.exe'
  selection_children_images:
    Image|endswith:
    - '\calc.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
  selection_children_cli:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'Invoke-Expressions'
    - 'IEX'
    - 'Invoke-Command'
    - 'ICM'
    - 'DownloadString'
    - 'rundll32'
    - 'regsvr32'
    - 'wscript'
    - 'cscript'
  selection_children_paths:
    Image|contains:
            # Add more suspicious locations
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - ':\Temp\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- In development environment where VsCode is used heavily. False positives may 
  occur when developers use task to compile or execute different types of code. 
  Remove or add processes accordingly
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the spawning of uncommon or suspicious child processes from Visual Studio Code's executable (`code.exe`), often indicating potential malicious activities such as establishing persistence or executing unwanted scripts. The primary attacker objective is generally to execute payloads or scripts that could compromise system security or exfiltrate data. Relevant MITRE ATT&CK tactics include Execution (T1202) and Defense Evasion (T1218). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If identified as malicious, the impact could lead to unauthorized access or system compromise. This detection alone does not confirm malicious activity; it indicates a need for further investigation.

  ### Investigation Steps

  - **Analyze child process details:** Inspect the parent process (`code.exe`) to confirm its presence in the expected location (e.g., `C:\Program Files\Microsoft VS Code\`) using Security Event ID 4688 or Sysmon Event ID 1. Legitimate development work may include typical child processes like `powershell.exe` for debugging scripts or `cmd.exe` for running terminal commands.

  - **Evaluate command-line arguments:** For any identified child processes, review the command-line arguments for suspicious patterns using Sysmon Event ID 1 or process creation logs. Indicators such as `Invoke-Expressions`, `DownloadString`, or execution from unusual paths (e.g., `C:\Windows\Temp\`) may suggest malicious intent.

  - **Check for known malicious children:** Look specifically for child processes like `calc.exe`, `regsvr32.exe`, or `rundll32.exe`, as their presence can indicate exploitation attempts. Correlate with logs from process creation to determine the context of these executions (Security Event ID 4688).

  - **Correlate with user activity:** Review user activity around the timestamps of the alert, including logged-in users and their roles, using event logs (e.g., Security Event ID 4624). Legitimate developers may be using `code.exe` and executing expected scripts; distinguish this from potential unauthorized access.

  - **Examine execution paths:** Investigate child processes spawning from unusual directories, especially `C:\Users\Public\` or `C:\Temp\`. Use Sysmon Event ID 1 for insights into this activity, as these paths are often abused in malware execution.

  - **Assess related artifacts:** Validate the presence of associated file artifacts created or modified around the time of execution. Check for files in temporary directories or any persistence mechanisms related to Visual Studio Code, ensuring no unwanted scripts are left behind.

  ### Prioritization

  The alert carries medium severity due to the potential impact of unauthorized access or system compromise, particularly on development environments. While the likelihood of malicious abuse exists, it is essential to recognize that legitimate development activity can often mimic the conditions triggering this rule.

  ### Blind Spots and Assumptions

  This detection may be limited by developers' legitimate use of Visual Studio Code, creating potential false positives in heavily utilized environments. It is crucial to ensure that detailed process creation logs (Event ID 4688) and Sysmon logs are enabled for reliable detection. Additionally, attackers may attempt to evade detection by using legitimate scripts or common tools in development workflows. A companion detection for PowerShell script executions (e.g., monitoring script block logging) would enhance coverage against such attacks.

