title: Potentially Suspicious Child Process Of VsCode
id: 5a3164f2-b373-4152-93cf-090b13c12d27
status: test
description: Detects uncommon or suspicious child processes spawning from a VsCode
  "code.exe" process. This could indicate an attempt of persistence via VsCode tasks
  or terminal profiles.
references:
- https://twitter.com/nas_bench/status/1618021838407495681
- https://twitter.com/nas_bench/status/1618021415852335105
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-26
modified: 2023-10-25
tags:
- attack.execution
- attack.defense-evasion
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\code.exe'
  selection_children_images:
    Image|endswith:
    - '\calc.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
  selection_children_cli:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'Invoke-Expressions'
    - 'IEX'
    - 'Invoke-Command'
    - 'ICM'
    - 'DownloadString'
    - 'rundll32'
    - 'regsvr32'
    - 'wscript'
    - 'cscript'
  selection_children_paths:
    Image|contains:
            # Add more suspicious locations
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - ':\Temp\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- In development environment where VsCode is used heavily. False positives may occur
  when developers use task to compile or execute different types of code. Remove or
  add processes accordingly
level: medium
note: |
  ### Technical Context
  This rule detects instances where suspicious child processes are spawned from the Visual Studio Code (VSCode) executable (`code.exe`). Targeted child processes, such as `calc.exe`, `cmd.exe`, `regsvr32.exe`, and others, could suggest malicious activity, particularly in scenarios where attackers leverage VSCode's task management and terminal profiles for persistence or executing payloads stealthily within a developer environment. Attackers may seek to exploit legitimate tools to evade detection while gaining control or executing arbitrary commands.

  The relevant MITRE ATT&CK techniques for this detection are:
  - **Execution: Command and Scripting Interpreter** (T1059)
  - **Defense Evasion: Masquerading** (T1036)
  - **Execution: Scripting** (T1218)

  The primary data source for detecting this behavior is **process creation events** from Windows, which provide visibility into parent and child processes as well as the command-line arguments used at the time of execution.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs to identify instances where child processes are spawned from `code.exe`. Pay close attention to the time of occurrence and the specific child processes involved.
  - **Inspect Command-Line Arguments:** Look for suspicious command-line arguments associated with the child processes. Check for those containing keywords like `Invoke-Expressions`, `DownloadString`, or similar indicative of malicious intent.
  - **Analyze File System Activity:** Investigate any corresponding file activity in directories like `C:\Users\Public\`, `C:\Windows\Temp\`, or `C:\Temp\` that may relate to the child processes. Look for unexpected files or executables that were created or modified around the same time.
  - **Correlate with User Activity:** Determine whether the context of these processes correlates with any user activities, especially in development environments. This may help identify false positives versus genuine threats.

  ### Prioritization
  The alert's severity is deemed medium due to the potential for significant impact if an attacker uses legitimate tools for malicious activities, but it is counterbalanced by the likelihood of false positives in development environments where VSCode is regularly used.

  ### Blind Spots and Assumptions
  This detection rule may not cover scenarios where attackers utilize different or less common parent processes for malicious activity, thus it may miss signs of compromised systems. There is an assumption that `code.exe` is not being exploited in a non-malicious context at the time of detection. Moreover, process creation event logs must be enabled and properly configured in the environment to ensure this alert functions effectively. Without these logs, detection is not possible.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
