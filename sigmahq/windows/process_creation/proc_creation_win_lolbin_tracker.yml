title: Potential DLL Injection Or Execution Using Tracker.exe
id: 148431ce-4b70-403d-8525-fcc2993f29ea
status: test
description: Detects potential DLL injection and execution using "Tracker.exe"
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Tracker/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-10-18
modified: 2023-01-09
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\tracker.exe'
  - Description: 'Tracker'
  selection_cli:
    CommandLine|contains:
    - ' /d '
    - ' /c '
  filter_msbuild1:
    CommandLine|contains: ' /ERRORREPORT:PROMPT '
  filter_msbuild2:
        # Example:
        #   GrandparentImage: C:\Program Files\Microsoft Visual Studio\2022\Community\Msbuild\Current\Bin\MSBuild.exe
        #   ParentCommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" /nologo /nodemode:1 /nodeReuse:true /low:false
        #   CommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Tracker.exe" @"C:\Users\user\AppData\Local\Temp\tmp05c7789bc5534838bf96d7a0fed1ffff.tmp" /c "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.29.30133\bin\HostX86\x64\Lib.exe"
    ParentImage|endswith:
    - '\Msbuild\Current\Bin\MSBuild.exe'
    - '\Msbuild\Current\Bin\amd64\MSBuild.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potential DLL injection or execution using "Tracker.exe," a tool often associated with packaging and executing malicious DLLs due to its capabilities to manipulate runtime processes. The likely attacker objective is to escalate privileges or maintain persistence on a victim system through the misuse of legitimate tools, complicating detection efforts. This behavior aligns with the MITRE ATT&CK tactic for Privilege Escalation (TA0004) and the specific technique for Process Injection (T1055.001).

  The primary telemetry source includes Windows Process Creation events captured through Security Event ID 4688 or Sysmon Event ID 1, focusing on command-line arguments and parent-child process relationships. If the detected behavior is malicious, it may allow unauthorized code execution with escalated privileges. Importantly, this detection does not confirm the process's malicious intent without additional context and corroboration of surrounding activities.

  ### Investigation Steps

  - **Review process creation details:** Check for Security Event ID 4688 or Sysmon Event ID 1 logs for `tracker.exe`. Confirm it's initiated by a known MSBuild parent process; unexpected parent processes may indicate malicious behavior.

  - **Analyze command-line arguments used:** Focus on detecting `/d` and `/c` within the CommandLine field. Legitimate usage often includes parameters indicative of typical MSBuild operations, while unusual variations may signal bad intent.

  - **Validate legitimate process usage:** Cross-reference the invocation of `tracker.exe` with known builds or tasks within your environment. Legitimate processes will usually have controlled parameters and should originate from authorized users.

  - **Identify high-confidence malicious indicators:** Look for unusual parent-child hierarchies where `tracker.exe` is executed without MSBuild (e.g., directly from a suspicious binary). This could indicate compromised software lifecycle practices.

  - **Check for unexpected file output or temp usage:** Monitor folder paths such as `C:\Users\<user>\AppData\Local\Temp\` for any unexpected or recently created temp files that result from `tracker.exe`. Malicious activity may correlate with unusual timestamps or unexpected filenames.

  - **Correlate alerts with user behavior logs:** Review user activity logs to identify any recent privilege escalations, account anomalies, or historical behavior patterns preempting the execution of `tracker.exe`, reinforcing the investigation's context.

  ### Prioritization

  This alert carries medium severity due to the potential impact on privileged systems, where a successful DLL injection can offer an attacker extensive control over the machine. Given that tools like `tracker.exe` are commonly utilized in malicious workflows, there’s a heightened likelihood of abuse in the enterprise context.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of telemetry sources; for reliable detection, ensure that both Security and Sysmon logs are enabled and adequately capturing detailed process creation events. Legitimate activity such as development workflows may generate similar alerting behavior, necessitating careful analysis to differentiate benign usage. Related detections, like monitoring for unusual MSBuild command activities or other tools in the Microsoft build suite, can enhance overall coverage and threat recognition.

