title: Potential DLL Injection Or Execution Using Tracker.exe
id: 148431ce-4b70-403d-8525-fcc2993f29ea
status: test
description: Detects potential DLL injection and execution using "Tracker.exe"
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Tracker/
author: 'Avneet Singh @v3t0_, oscd.community'
date: 2020-10-18
modified: 2023-01-09
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\tracker.exe'
  - Description: 'Tracker'
  selection_cli:
    CommandLine|contains:
    - ' /d '
    - ' /c '
  filter_msbuild1:
    CommandLine|contains: ' /ERRORREPORT:PROMPT '
  filter_msbuild2:
        # Example:
        #   GrandparentImage: C:\Program Files\Microsoft Visual Studio\2022\Community\Msbuild\Current\Bin\MSBuild.exe
        #   ParentCommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" /nologo /nodemode:1 /nodeReuse:true /low:false
        #   CommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Tracker.exe" @"C:\Users\user\AppData\Local\Temp\tmp05c7789bc5534838bf96d7a0fed1ffff.tmp" /c "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.29.30133\bin\HostX86\x64\Lib.exe"
    ParentImage|endswith:
    - '\Msbuild\Current\Bin\MSBuild.exe'
    - '\Msbuild\Current\Bin\amd64\MSBuild.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential DLL injection or execution exploits via "Tracker.exe", a known binary that may be misused to perform malicious actions in a compromised Windows environment. Attackers may leverage Tracker.exe to execute arbitrary code in the context of trusted processes such as MSBuild. The primary objectives of these attacks often include privilege escalation or evading defenses to gain persistent access to target systems.

  In terms of the MITRE ATT&CK framework, this rule correlates with the **Privilege Escalation** tactic and specifically the technique **T1055.001 - Process Injection: DLL Injection**. By injecting DLLs into legitimate processes, malicious actors can run their code within the context of trusted applications, thereby bypassing security controls and reducing the likelihood of detection.

  To effectively flag this behavior, the primary data sources that will contain relevant evidence include process creation logs from Windows event logging, specifically those capturing execution paths and command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine Windows process creation logs for instances of `tracker.exe`, focusing on its parent process to determine if it was executed by a legitimate application like MSBuild.
  - **Analyze Command-Line Arguments**: Scrutinize command-line arguments associated with `tracker.exe` executions for unusual flags, particularly `/d` and `/c`, which may indicate potential exploitation attempts.
  - **Correlate with File System Changes**: Investigate the filesystem for any associated activity that may suggest persistence mechanisms (e.g., creation of unusual DLLs in the same directory as Tracker.exe).
  - **Identify Related Parent Processes**: Check for any suspicious parent processes, ensuring that legitimate applications like MSBuild have not been exploited to launch Tracker.exe inappropriately.

  ### Prioritization
  This alert warrants medium severity due to the potential for privilege escalation and evasion of security measures. Given the common use of MSBuild in development environments, detection of this pattern indicates possible malicious activity that could lead to further compromise if left unaddressed.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on specific command-line patterns that may be altered by attackers to evade detection, potentially masking malicious behavior. Additionally, the detection logic assumes that DLL injection via Tracker.exe is detectable solely through execution characteristics tied to MSBuild, which may not cover all scenarios. It is essential that logs from Windows process creation are correctly configured and available for this rule to function effectively.

