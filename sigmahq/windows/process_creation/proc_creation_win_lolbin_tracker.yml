logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\tracker.exe'
  - Description: 'Tracker'
  selection_cli:
    CommandLine|contains:
    - ' /d '
    - ' /c '
  filter_msbuild1:
    CommandLine|contains: ' /ERRORREPORT:PROMPT '
  filter_msbuild2:
        # Example:
        #   GrandparentImage: C:\Program Files\Microsoft Visual Studio\2022\Community\Msbuild\Current\Bin\MSBuild.exe
        #   ParentCommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" /nologo /nodemode:1 /nodeReuse:true /low:false
        #   CommandLine: "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Tracker.exe" @"C:\Users\user\AppData\Local\Temp\tmp05c7789bc5534838bf96d7a0fed1ffff.tmp" /c "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.29.30133\bin\HostX86\x64\Lib.exe"
    ParentImage|endswith:
    - '\Msbuild\Current\Bin\MSBuild.exe'
    - '\Msbuild\Current\Bin\amd64\MSBuild.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects potential DLL injection and execution using the executable "Tracker.exe," which is often associated with malicious activities. Attackers may leverage this behavior to execute arbitrary code or escalate privileges in a compromised system. The relevant MITRE ATT&CK techniques are Privilege Escalation (T1068) and Process Injection (T1055.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically utilizing Event ID 4688 for process creation events, which captures command-line arguments and the parent processes involved. If malicious, this behavior can enable attackers to introduce and execute malicious payloads undetected. However, this detection alone does not confirm that an actual attack has occurred, as violations may arise from legitimate use of "Tracker.exe" during debugging or development tasks.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Gather Security Event ID 4688 logs and filter for processes with "tracker.exe" in the Image field and examine the CommandLine field for arguments containing " /d " or " /c ". Legitimate uses will often lack these flags or have distinct command structures.

  - **Analyze parent processes:** Identify the ParentImage from the same Event ID logs. A legitimate execution should show "MSBuild.exe" as the parent image. Any other parent processes may indicate suspicious behavior.

  - **Validate command-line arguments:** Check for the presence of " /ERRORREPORT:PROMPT" in the CommandLine field, which should be absent from legitimate instances of "tracker.exe." Malicious instances may frequently include unusual or improperly formatted flags.

  - **Identify high-confidence malicious indicators:** Search for any occurrences where "tracker.exe" is executed from untrusted paths (e.g., UserTemp directories or other uncommon locations). Malicious activity will often spawn from non-standard directories.

  - **Correlate with existing alerts:** Look for any recent alerts related to process injection or privilege escalation activities that may align with this detection, enhancing the context of your investigation.

  - **Assess asset criticality:** Consider the role of the host where the alert originated. If it is a high-privileged asset such as a Domain Controller or administrative workstation, treat the alert with heightened urgency.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential exploitation of "Tracker.exe" for privilege escalation and code execution. It is plausible that this behavior can be weaponized by adversaries, especially in environments where developers are frequently using development tools that include this executable. However, the likelihood of legitimate usage in development contexts also exists, necessitating thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging settings, which can lead to missed events. The use of legitimate “Tracker.exe” in development contexts could also trigger misleading alerts. Specific monitoring for other related behaviors, such as unexpected DLL files being loaded or modified processes, can strengthen detection capabilities. Companion detections involving process injection techniques (T1055) or unusual command-line argument usage can help paint a clearer picture of potential threats.

