title: Installation of WSL Kali-Linux
id: eca8ae39-5c3c-4321-b538-9e64fe25822e
status: experimental
description: |
  Detects installation of Kali Linux distribution through Windows Subsystem for Linux (WSL).
  Attackers may use Kali Linux WSL to leverage its penetration testing tools and capabilities for malicious purposes.
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_wsl_img:
  - Image|endswith: '\wsl.exe'
  - OriginalFileName: 'wsl'
  selection_wsl_install:
    CommandLine|contains:
    - ' --install '
    - ' -i '
  selection_wsl_kali:
    CommandLine|contains: 'kali'
  condition: all of selection_wsl_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or security
  teams
level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of the Kali Linux distribution using the Windows Subsystem for Linux (WSL). Attackers may exploit Kali Linux for its extensive set of penetration testing tools, potentially leading to unauthorized access, privilege escalation, or system exploitation. By monitoring for process creation events related to `wsl.exe` that include specific command-line arguments, the rule seeks to catch any instances where an attacker is setting up a malicious environment within a Windows host.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** capabilities, particularly through command execution (T1059) associated with scripting and command-line interfaces, which can facilitate the execution of the attacker's tools and scripts.

  Primary data sources for detecting such activities include:
  - Process creation event logs that capture when `wsl.exe` is executed, including command-line arguments and the original file name.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the logs for `wsl.exe` executions, focusing on instances where the command line contains the `--install` or `-i` flags, combined with any mention of `kali`.
  - **Analyze Command-Line Arguments**: Look closely at the command-line parameters used during installation. Determine if the arguments suggest any unauthorized installations or configurations atypical for standard operational environments.
  - **Check User Context**: Identify which user account triggered the installation. Assess whether the user has the necessary privileges for such an action and if their behavior aligns with expected roles.
  - **Cross-reference with Security Tools**: Utilize EDR or endpoint security solutions to examine if any subsequent activities initiated by Kali tools or scripts manifest in suspicious behavior patterns or alerts.

  ### Prioritization
  The alert should be considered high priority due to the potential risk it represents. The presence of Kali Linux, especially if installed by unauthorized personnel, indicates an increased likelihood of exploitation and malicious activities within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may not account for legitimate use cases where security administrators or pen testers are expected to install Kali Linux for official purposes. Additionally, some log sources necessary for comprehensive detection may not be enabled by default across all systems. Assumptions here include that WSL logging is consistently captured across Windows installations and that analysts can differentiate between legitimate and malicious usage based on context.

