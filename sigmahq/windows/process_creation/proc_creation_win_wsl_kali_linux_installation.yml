title: Installation of WSL Kali-Linux
id: eca8ae39-5c3c-4321-b538-9e64fe25822e
status: experimental
description: |
  Detects installation of Kali Linux distribution through Windows Subsystem for Linux (WSL).
  Attackers may use Kali Linux WSL to leverage its penetration testing tools and capabilities for malicious purposes.
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_wsl_img:
  - Image|endswith: '\wsl.exe'
  - OriginalFileName: 'wsl'
  selection_wsl_install:
    CommandLine|contains:
    - ' --install '
    - ' -i '
  selection_wsl_kali:
    CommandLine|contains: 'kali'
  condition: all of selection_wsl_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or 
  security teams
level: high
note: |
  ### Technical Context

  This detection rule identifies the installation of the Kali Linux distribution via Windows Subsystem for Linux (WSL). The likely objective of an attacker using this method would be to leverage the extensive penetration testing tools available in Kali Linux for malicious activities, such as network exploitation or pivoting within the environment. Relevant MITRE ATT&CK tactics include **Execution** and techniques such as **Command-Line Interface** (T1059).

  Primary telemetry sources include Windows process creation logs, particularly monitoring for executions related to `wsl.exe`. If malicious, the security impact could be significant, possibly enabling unauthorized access to systems or data through the use of specialized hacking tools. However, it is crucial to note that this detection does NOT confirm malicious activity on its own; legitimate administrative usage of Kali Linux for security purposes is a common practice.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs or Sysmon Event ID 1 for instances of `wsl.exe` execution, specifically looking for CommandLine arguments containing `--install` or `-i` and `kali`.

  - **Analyze command line arguments:** Identify the full CommandLine field in logs to confirm if it explicitly contains both `--install` (or `-i`) and the term `kali`. A command without these specifics may indicate either benign use or a different installation process.

  - **Evaluate system context:** Verify the role of the system where this installation is occurring. If it is a critical system or a server with restricted access, this raised alert should be investigated more thoroughly due to potential malicious intentions.

  - **Identify legitimate usage patterns:** Look for instances where `wsl.exe` was invoked for non-Kali distributions or installed as part of standard administrative functions. Valid use could include commands for Fedora or Ubuntu to check for typical administrative behavior.

  - **Spot high-confidence malicious indicators:** Look for subsequent processes spawned by `wsl.exe`. If command executions include known attack vectors or tools commonly associated with penetration testing, categorize these as high-confidence malicious indicators.

  - **Review recent asset changes:** Check for any unusual system configuration changes or content created in the WSL environment (e.g., files added or modified that look like payloads or scripts) to capture signs of further exploitative activities.

  ### Prioritization

  Given the potential impact of having a penetration testing environment like Kali Linux on a critical or sensitive system, this rule must be treated as high priority. The likelihood of misuse and significant security risks involved in unauthorized installations makes this behavior noteworthy, especially if found in environments not typically supporting such capabilities.

  ### Blind Spots and Assumptions

  Detection may have limitations due to possible evasion techniques, such as attackers using alternate methods to run Kali Linux or obfuscating their command-line arguments. Reliable detection necessitates comprehensive logging for process executions and WSL interactions. Legitimate installs by security personnel may trigger this alert, making context crucial. A related detection that could provide stronger coverage is one monitoring attempts to execute known penetration testing tools from WSL environments, which may confirm unauthorized usage.

