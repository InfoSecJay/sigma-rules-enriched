title: Installation of WSL Kali-Linux
id: eca8ae39-5c3c-4321-b538-9e64fe25822e
status: experimental
description: |
  Detects installation of Kali Linux distribution through Windows Subsystem for Linux (WSL).
  Attackers may use Kali Linux WSL to leverage its penetration testing tools and capabilities for malicious purposes.
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_wsl_img:
  - Image|endswith: '\wsl.exe'
  - OriginalFileName: 'wsl'
  selection_wsl_install:
    CommandLine|contains:
    - ' --install '
    - ' -i '
  selection_wsl_kali:
    CommandLine|contains: 'kali'
  condition: all of selection_wsl_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or security
  teams
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of the Kali Linux distribution via the Windows Subsystem for Linux (WSL). Attackers may leverage Kali Linux’s extensive toolset for malicious activities such as network scanning, privilege escalation, and exploitation of vulnerabilities. This behavior fits within the MITRE ATT&CK framework under the tactic "Execution" and the technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry source for this detection is process creation logs from Windows, specifically monitoring for the execution of `wsl.exe` with commands indicative of installing a Linux distribution. If malicious, the security impact could involve unauthorized access to internal resources, data exfiltration, or lateral movement within the network. However, this detection does not confirm malicious intent on its own, as legitimate installation for administrative or security testing purposes is possible.

  ---

  ### Investigation Steps

  - **Identify the triggering event details:** Review Windows Security Event ID 4688 for the process creation of `wsl.exe`. Focus on the CommandLine field for parameters that include `--install` or `-i` alongside `kali`.

  - **Verify the installation source:** Cross-check the installation execution path with the expected legitimate locations. Confirm whether it matches the typical locations for authorized users versus paths that suggest anomalous installation requests.

  - **Analyze user context and privileges:** Determine the user account executing the command. Legitimate administrative accounts or security personnel performing a known installation will differ from user accounts that are not typical for such operations.

  - **Check for associated malicious indicators:** Investigate for additional activity immediately following the installation by monitoring Sysmon Event ID 1 for unexpected child processes. Look for known malicious tools that are customarily associated with Kali Linux being executed.

  - **Review recent activity and alerts:** Correlate this installation with previously generated alerts or unusual user activity in the Security Information and Event Management (SIEM) system. Look for signs of privilege escalation or lateral movement (e.g., unusual logins or access patterns).

  - **Monitor for legitimate use cases:** It is essential to document any confirmed legitimate use of Kali Linux by security teams. Understanding what typical administrative tasks look like, such as vulnerability scanning schedules, may help in differentiating between benign and suspicious activity.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems if Kali Linux is installed maliciously. The likelihood of abuse is moderate, as attackers often exploit legitimate tools for nefarious ends. This behavior can create significant risk if not investigated promptly, particularly in environments where security tools are misused.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from users installing Kali Linux for legitimate security testing or training purposes, which could generate false positives. Required log sources include detailed process creation logs and potentially API logging configurations that could capture further contextual actions. Additionally, legitimate usage in a development or testing environment may trigger this alert. Companion detections for tools commonly used in conjunction with Kali Linux, such as Metasploit Framework install attempts, could enhance coverage and risk assessment.

