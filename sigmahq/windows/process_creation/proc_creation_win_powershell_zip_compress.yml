note: |
  ### Technical Context

  This rule detects the execution of PowerShell's `Compress-Archive` cmdlet that targets potentially suspicious output locations commonly associated with data exfiltration, such as the Temp folder. The likely attacker objective is to compress sensitive files for ease of transport, potentially in preparation for exfiltration. This behavior correlates with the MITRE ATT&CK technique T1074.001 (Data Staged: Local Data Staging).

  Primary telemetry sources include process creation logs, specifically focusing on PowerShell command executions within Windows. The security impact is significant if malicious, as it indicates a potential data exfiltration attempt. However, this detection does NOT confirm that any data was actually exfiltrated or that the compression is inherently malicious; legitimate use of file compression tools may trigger this alert.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 logs for entries related to PowerShell execution. Look for command lines containing `Compress-Archive -Path` and verify if they target `$env:TEMP`, `AppData\Local\Temp\`, or `C:\Windows\Temp\`.

  - **Analyze Context of Compression:** Determine if the script or command was run from a known user context or a compromised account. Use Event ID 4624 (logon events) to correlate user activities leading up to the use of `Compress-Archive`. Benign examples include administrative scripts run by system admins, while suspicious activities might come from different users or unexpected accounts.

  - **Validate File Creation:** Check for newly created zip files in the output locations using File System Event IDs (e.g., 4663 for access attempts and modifications). Confirm if the created archive contains sensitive data or operationally relevant files to understand potential data theft.

  - **Identify Similar Alerts:** Look for companion detections in the logs by correlating entries related to any `Invoke-WebRequest` (Event ID 4688) in nearby timeframes that may indicate file transmission post-compression.

  - **Examine Running PowerShell Scripts:** Review other PowerShell logs for suspicious payloads or non-standard scripting paths. Investigate if the same session executed multiple scripts; high activity might indicate a scripted attack versus a one-off administrative task.

  - **Investigate User Behavior:** Look for unusual user behavior, such as execution of numerous compress commands without a business justification. This investigation could include a review of user training, recent changes to user roles, and expected file management practices.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive data residing on the affected systems, specifically if they are critical assets. While the likelihood of malicious abuse is concerning, usage of file compression can also be common in routine administrative tasks, necessitating careful analysis.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers employ other compression tools or script obfuscation techniques to hide their activities. Additionally, if appropriate log sources (e.g., PowerShell logs) are not enabled or configured correctly, this may lead to gaps in visibility. Legitimate activities, such as system administrators performing backup tasks, could trigger the alert. A related detection to enhance coverage would be monitoring for anomalous network activity associated with unusual outbound connections after compression events, indicating potential data exfiltration attempts.

