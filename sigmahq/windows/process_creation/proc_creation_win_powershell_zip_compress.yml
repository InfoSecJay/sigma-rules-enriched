logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of the PowerShell cmdlet `Compress-Archive` to compress files or folders, specifically when the output location is potentially suspicious, such as temporary directories often exploited for malicious data exfiltration. Adversaries typically use this technique as part of the data exfiltration process, where they package sensitive information prior to transferring it outside the compromised network. The primary objective here is to minimize data volume during exfiltration, which aids in stealthy operations, as smaller file sizes may evade detection by security technologies.

  The rule aligns with the MITRE ATT&CK framework, particularly under the tactics of Collection (T1074.001) where adversaries may gather sensitive data and compress it for exfiltration. Notably, the use of `Compress-Archive` in such contexts can often indicate a preparatory step before data is sent over the network, highlighting an elevated risk of information leakage.

  The primary data sources for this detection are Windows process creation logs, which capture command-line arguments and can indicate the execution of PowerShell scripts that utilize the `Compress-Archive` cmdlet. Monitoring these logs is critical to identifying suspicious activity associated with data compression and potential exfiltration efforts.

  ### Investigation Steps
  - **Analyze Process Creation Events**: Review the process creation logs for instances of PowerShell invoking `Compress-Archive`, particularly examining command-line arguments and timestamps to establish context around the execution of these commands.

  - **Correlate Output Locations**: Identify and correlate the specific output paths used for compressed files (e.g., `$env:TEMP`, `\AppData\Local\Temp\`, `\Windows\Temp\`). Investigate unusual access or modifications in these directories, as they may indicate malicious activity.

  - **Inspect Network Activity**: If data compression is detected, examine subsequent network logs for any unusual data transfer activities, especially to external IPs, which may corroborate an exfiltration attempt following the compression.

  - **Check User Context**: Evaluate the user account under which the `Compress-Archive` command was executed. Abnormal accounts or privileged usage could signify compromised credentials or escalated privileges, warranting further investigation.

  ### Prioritization
  The alert is assigned a medium severity in an enterprise environment due to the implications of data exfiltration. The likelihood of attacks using this method is significant, especially in environments that store sensitive information, making it a crucial alert for security monitoring.

  ### Blind Spots and Assumptions
  This rule assumes that process creation logs are adequately monitored and retained for analysis; however, if logging for PowerShell commands is disabled or extensive data retention policies are not in place, detection efficacy may be impaired. Additionally, the rule relies on specific command-line patterns; thus, variations or obfuscation methods used by sophisticated adversaries may lead to missed detections. It's essential to ensure that adequate logging configurations are in place to capture detailed PowerShell activities to enhance detection capabilities.

