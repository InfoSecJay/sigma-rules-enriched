detection:
  selection:
    CommandLine|contains:
    - 'Compress-Archive -Path*-DestinationPath $env:TEMP'
    - 'Compress-Archive -Path*-DestinationPath*\AppData\Local\Temp\'
    - 'Compress-Archive -Path*-DestinationPath*:\Windows\Temp\'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `Compress-Archive` cmdlet in PowerShell to compress files or folders, specifically when the output file is directed to commonly abused directories such as Temp folders. This activity may indicate that an attacker is preparing data for exfiltration, including sensitive documents or credentials, making it easier to transfer over the network.

  The relevant MITRE ATT&CK techniques are T1074.001 (Data Staged: Local Data Staging) under the Collection tactic. Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1. If the behavior is malicious, it poses a risk of data leakage or loss, especially if sensitive information is involved. However, this detection alone does not confirm a successful exfiltration; it merely indicates potential preparatory actions.

  ### Investigation Steps

  - **Check Event ID 4688 for Process Creation**: Review Security Event ID 4688 logs to identify the PowerShell process creation that includes `Compress-Archive`. Look for parent processes indicating legitimate administrative actions versus potential abuse.

  - **Validate CommandLine Arguments**: Analyze the `CommandLine` field for the process, confirming it includes `Compress-Archive -Path`, particularly targeting `$env:TEMP` or `C:\Windows\Temp\`. If this is present, be wary of the context surrounding the command execution.

  - **Inspect Output File Locations**: Look for newly created or modified files in `$env:TEMP`, `C:\Users\<Username>\AppData\Local\Temp\`, or `C:\Windows\Temp\`. Files created here after the `Compress-Archive` cmdlet execution may suggest malicious intent, especially if they stem from an unknown or suspicious user account.

  - **Correlate with User Activity**: Investigate the user account associated with the PowerShell execution. If the user is non-administrative or does not typically engage in file compression activities, this may indicate malicious use. Conversely, a legitimate admin may compress files for maintenance or backup.

  - **Review for Supporting Tactics**: Check for additional signs of data staging or exfiltration, such as network connections to suspicious external IPs following the compression event or further use of file transfer tools (e.g., PowerShell upload scripts).

  - **Assess Historical Log Correlation**: Compare against historical data to see if previous legitimate instances of compression occurred under similar conditions. Frequent or unusual instances could indicate abnormal behavior warranting deeper investigation.

  ### Prioritization

  This alert should be considered medium severity in an enterprise environment. If the affected system stores sensitive data or has elevated privileges, the potential impact of exploitation increases. The likelihood of this specific behavior being malicious is notable due to its association with data staging techniques commonly used by adversaries.

  ### Blind Spots and Assumptions

  This detection may miss legitimate uses of `Compress-Archive` by trusted administrative users, especially if policies allow for legitimate data handling within Temp folders. Effective monitoring requires robust logging configurations, including capturing PowerShell activity. Shared or automated tasks that manipulate files in Temp locations could also trigger similar alerts. Companion detections could include alerts for outbound connections following this activity, reinforcing the suspicion of exfiltration attempts.

