  ---

  ### Technical Context

  This Sigma rule detects the execution of `OpenWith.exe` with a command-line argument that includes `/c`, indicating a potential use of the tool to execute arbitrary binaries. Attackers may use this technique as part of a defense-evasion strategy to obscure malicious activities, as `OpenWith.exe` is a legitimate Windows utility. The relevant MITRE ATT&CK tactic is "Defense Evasion," and the technique is "Use of System Binary" (T1218).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation details and Sysmon Event ID 1 for more granular details. If malicious, this behavior could indicate that an adversary is attempting to execute payloads that leverage the legitimate `OpenWith.exe` process while bypassing security mechanisms. Importantly, this detection does NOT confirm that the activity is malicious by itself; legitimate administrative tasks could provoke similar behavior.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances of `OpenWith.exe`. Note the process ID and parent process. Legitimate executions typically originate from user-initiated applications rather than from scripts or remote execution.

  - **Analyze command-line arguments:** Examine the command-line details in the process creation event. Look specifically for patterns that include `/c` followed by execution of suspicious binaries, such as unusual executables or scripts. Legitimate uses often do not include obfuscated or uncommon filenames.

  - **Check parent processes:** Investigate the parent process of `OpenWith.exe`. If the parent process is a known benign application (like `explorer.exe`), it may indicate legitimate usage. Any unknown or suspicious parent process may indicate malicious use.

  - **Validate file execution:** If the command-line indicates execution of a binary, confirm the binary's path and reputation using threat intelligence sources. High-confidence malicious indicators include binaries located in unexpected directories, e.g., user profile temp folders.

  - **Monitor for persistence indicators:** Investigate if this instance of `OpenWith.exe` is part of a larger campaign that may include registry modifications or scheduled tasks for persistence. Monitor for changes related to execution paths or startup items that could sustain malicious behavior.

  - **Cross-reference with EDR telemetry:** If available, collect data from endpoints regarding file creation, modification activities, and network connections made by `OpenWith.exe` or the executed binary. Any attempt to connect to external IPs could point to further malicious intentions.

  ---

  ### Prioritization

  Given that this alert pertains to a utility that can be exploited for executing code, it has a high severity level, particularly if the system affected is critical or contains sensitive data. The likelihood of malicious abuse is significant, as this technique is commonly weaponized in phishing and remote access scenarios.

  ---

  ### Blind Spots and Assumptions

  Successful detection relies on accurate logging configurations and comprehensive coverage of process creation events. Evasion techniques might include the use of legitimate applications that mimic `OpenWith.exe` functionality or alterations in command-line arguments to avoid detection. Legitimate activities, such as software installations or system updates, may also trigger this alert. A related detection that complements this rule could be monitoring for unauthorized use of other system binaries (e.g., `cmd.exe`, `powershell.exe`), enhancing situational awareness.

