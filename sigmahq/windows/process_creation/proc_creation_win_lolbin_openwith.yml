note: |
  ### Technical Context

  This rule detects instances where the `OpenWith.exe` process executes another binary using a command-line argument that includes `/c`. This behavior is often leveraged by attackers to execute malicious payloads under the guise of a legitimate system process, thereby evading detection. The likely attacker objective is to execute arbitrary commands or files with potentially malicious intent, facilitating lateral movement or persistence within a target environment.

  This detection is associated with the MITRE ATT&CK technique: **Command-Line Interface (T1059)**, specifically technique ID **T1218 - Signed Binary Proxy Execution**. The primary telemetry sources for this rule are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 that capture command-line activity. If malicious, this behavior can lead to unauthorized access, data exfiltration, or installation of additional payloads. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative or automated processes may utilize `OpenWith.exe` for benign purposes.

  ### Investigation Steps

  - **Check process details in logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for parent-child process relationships. Look for `OpenWith.exe` launching processes with command-line parameters that include `/c`. Legitimate use cases typically do not invoke arbitrary binaries in this manner.

  - **Analyze command-line arguments:** Investigate the full command-line used to execute `OpenWith.exe`. Malicious indicators may include command-line strings that reference known malicious executables or suspicious patterns, such as `%TEMP%`, or unusual directory paths.

  - **Examine parent process:** Determine the parent process of `OpenWith.exe`. If spawned from non-administrative tools or scripts, this could indicate possible malicious use. Common legitimate parents include Windows Explorer (`explorer.exe`) or other system processes.

  - **Correlate with user activity:** Check user logon events (Security Event ID 4624) around the time of execution. If executed under a user account not typically associated with such activity or during off-hours, this could signal a high-confidence malicious indicator.

  - **Verify asset criticality:** Assess the role of the affected hosts. If `OpenWith.exe` is triggered on critical servers (like Domain Controllers), the severity warrants immediate escalation.

  - **Look for transient file creation:** Investigate for transient files created in temporary directories (`%TEMP%`, `%APPDATA%`, etc.) or unusual file types being executed. Evidence of file creation with execution shortly after can indicate malicious download or behavior.

  ### Prioritization

  This alert is considered high severity due to the potential impact of arbitrary code execution on enterprise systems. The likelihood of malicious abuse is significant, as attackers commonly exploit benign system binaries to evade detection. Notably, this technique is weaponized in various malware frameworks, making this detection vital for incident response.

  ### Blind Spots and Assumptions

  Detection may be limited by event logging configurations; if Sysmon or logging for Process Creation is insufficiently configured, instances of `OpenWith.exe` may go undetected. Legitimate automated processes or system maintenance routines can trigger this alert and may lead to false positives. To strengthen coverage, consider employing additional detection rules for unusual command-line executions or leveraging file integrity monitoring on critical executables.

