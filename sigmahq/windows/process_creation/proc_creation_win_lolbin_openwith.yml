note: |
  ### Technical Context

  This rule detects the execution of `OpenWith.exe` with arguments that suggest it is calling another binary, typically used to open files with specified applications. This behavior may indicate an attempt by an attacker to leverage legitimate Windows utilities for executing malicious payloads, thus disguising their actions within a common operating system function. The likely attacker objective is to bypass security controls by utilizing a trusted executable to run malicious code.

  This activity maps to the MITRE ATT&CK techniques **T1218: Signed Binary Proxy Execution**, utilizing the `OpenWith.exe` binary as a proxy for executing potentially harmful commands. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process creation details. If malicious, this could lead to unauthorized actions on the system, data exfiltration, or lateral movement. However, this detection alone does NOT confirm malicious intent, as legitimate applications may also invoke `OpenWith.exe` in this manner.

  ### Investigation Steps

  - **Review process creation logs**: Search for Security Event ID 4688 and Sysmon Event ID 1 to gather details on `OpenWith.exe` creation events, including the full CommandLine and ParentImage fields to identify suspicious parent processes.

  - **Examine CommandLine arguments**: Inspect logs for CommandLine parameters associated with calls to `OpenWith.exe`, particularly looking for '/c' which indicates command execution. Legitimate usage typically does not include executing arbitrary commands.

  - **Check for known malicious binaries**: Identify the binary being executed by `OpenWith.exe`. High-confidence malicious indicators include uncommon or previously identified malware file names or hashes.

  - **Validate the parent process**: Investigate the ParentImage field to determine if `OpenWith.exe` was launched by a legitimate application (e.g., a text editor file association) or if it appears linked to a suspicious parent process, which may indicate an evasion technique.

  - **Monitor for unexpected user behavior**: Review user activity around the time of the alert. Legitimate use is typically associated with standard user actions, such as file opening from applications, rather than isolated command line invocations.

  - **Assess asset criticality**: Confirm the affected system and its role within the environment. Critical assets warrant a higher investigation priority for potential exploitation vectors.

  ### Prioritization

  This alert should be considered high severity due to the potential for misuse of a legitimate Windows process to execute malicious commands. The risk of abuse in enterprise environments is significant, particularly since attackers often weaponize signed binaries to evade detection and accomplish their objectives discreetly.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive Windows process auditing; ensure that Sysmon or appropriate logging is configured correctly for complete coverage. Legitimate activities, such as the use of installation scripts that may call `OpenWith.exe`, can lead to false alerts. A related detection could involve monitoring for additional exploitation techniques related to the execution of benign applications as part of process injection or DLL hijacking methodologies, enhancing overall detection capabilities.

