note: |
  ### Technical Context
  This detection rule identifies instances where the `OpenWith.exe` executable is used to launch specified binaries through a command containing `/c`. `OpenWith.exe` is a legitimate Windows process that can be abused by attackers to execute arbitrary commands or binaries, often as a method to evade defenses. By leveraging `OpenWith.exe`, attackers might aim to blend malicious activities within normal operations, making detection challenging.

  The likely scenario involves an attacker aiming to execute payloads or execute malicious scripts after gaining initial access to a system. Attackers might utilize this technique to bypass security controls and gain persistence or elevate privileges. This behavior aligns with the MITRE ATT&CK framework, specifically covering the following tactics and techniques:
  - **Defense Evasion** (TA0005), which highlights the use of legitimate tools for malicious purposes.
  - **Execute Process** (T1218), emphasizing the execution of binary commands that could lead to further exploitation or data exfiltration.

  The primary data sources for this rule include:
  - Process creation events from operating systems (Windows Event ID 4688), enabling visibility into executed binaries and command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events for instances of `OpenWith.exe` being invoked with `/c` in the command line. Pay attention to the arguments provided and the user context in which it runs.
  - **Correlate with Other Activity:** Look for related actions in user activity or additional suspicious executables that may indicate a broader attack campaign, such as unusual PowerShell commands or other process executions that occur around the same time.
  - **Analyze Binary Executions:** Investigate the binaries being executed via `OpenWith.exe` to determine their legitimacy. Focus on examining hashes and sources of these binaries to identify potential malicious files.
  - **Assess User Behavior:** Evaluate the user account associated with the execution for any signs of compromise, such as login anomalies, access to sensitive resources, or changes in usage patterns.

  ### Prioritization
  This alert is categorized as high severity due to its potential to indicate malicious activity that may evade traditional security measures. The ability to execute arbitrary code through a legitimate process suggests a critical threat, especially if linked to an advanced persistent threat (APT) or insider compromise.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from environments that do not have comprehensive logging of process creation events or from improperly configured audit policies. The detection logic assumes that the use of `OpenWith.exe` with the `/c` parameter is indicative of nefarious intent, which may not always be the case and could lead to false positives from legitimate administrative tasks. It is essential to ensure that proper process monitoring and log retention policies are in place for accurate detection.

