detection:
  selection_openasrundll:
    CommandLine|contains: 'ShellExec_RunDLL'
  selection_suspcli:
    CommandLine|contains:
            # Note: The ordinal number may differ depending on the DLL version
    - '\Desktop\'
    - '\Temp\'
    - '\Users\Public\'
    - 'comspec'
    - 'iex'
    - 'Invoke-'
    - 'msiexec'
    - 'odbcconf'
    - 'regsvr32'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets potentially malicious usage of the `ShellExec_RunDLL` function, which is observable through process creation events in Windows environments. Specifically, it seeks to identify suspicious command line executions that may indicate attempts to execute unwanted scripts or binaries. The context arises from the "Raspberry Robin" attack, a pre-ransomware tactic that leverages this function to execute payloads or facilitate lateral movement within a network. Attackers employing this method often aim to establish a foothold in a compromised environment, prepare for further exploitation, and eventually deploy ransomware.

  The relevant MITRE ATT&CK techniques for this rule include **T1203: Exploitation for Client Execution**, which encompasses running malicious code via application features, and **T1083: File and Directory Discovery**, especially when invoking commands that access sensitive files or directories within the system. These tactics highlight the importance of robust detection measures during the execution phase of an attack.

  Primary telemetry sources that will provide critical evidence for this detection include **process creation logs** that capture command line arguments, along with potential additional sources such as **Windows event logs**, which may include event IDs indicative of process execution anomalies.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs for instances where `ShellExec_RunDLL` is used, paying particular attention to the full command line used for execution.
  - **Correlate with Known Indicators**: Compare the observed command line parameters against known suspicious patterns or commands (such as those listed in the detection logic) to validate the legitimacy of the execution.
  - **Check Contextual Usage**: Analyze the context of the process, including parent process IDs and user account activity, to understand if the command execution aligns with normal user behavior or administrative tasks.
  - **Identify Lateral Movement Patterns**: Look for signs of lateral movement by examining subsequent network connections or file activity that may follow the suspicious command usage, checking for interactions with sensitive areas like temp folders or public directories.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact within an enterprise environment. If utilized successfully, this technique could facilitate further compromise, data exfiltration, or the deployment of ransomware, posing substantial risks to business operations and data integrity.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if process creation logging is not enabled or improperly configured on certain endpoints. This rule assumes that monitoring for command line usage is consistent and comprehensive across the enterprise. Additionally, false positives could arise from legitimate administrative applications that invoke `ShellExec_RunDLL` for benign purposes. The effectiveness of this detection relies on the availability of detailed process creation logs capturing command line details, which must be adequately configured in the Windows Event Log settings.

