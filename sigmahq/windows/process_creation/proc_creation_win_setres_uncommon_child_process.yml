logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\setres.exe'
    Image|contains: '\choice'
  filter_main_legit_location:
    Image|endswith:
    - 'C:\Windows\System32\choice.exe'
    - 'C:\Windows\SysWOW64\choice.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of child processes by `Setres.EXE` that include "choice" in their file names, which is an uncommon behavior indicative of a potential attack. The likely attacker objective is to abuse a less-monitored Windows tool (`Setres.EXE`) to execute malicious payloads masquerading as benign processes, ultimately facilitating unauthorized actions on the system. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (TA006) and the technique of Masquerading (T1036).

  The primary telemetry sources involve Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it could indicate an attacker bypassing security controls to execute arbitrary code. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate software processes can potentially trigger similar behavior.

  ### Investigation Steps

  - **Identify suspicious child process creation:**
    Review Windows Security Event ID 4688 logs for any child processes spawned by `Setres.EXE` with names containing "choice". Focus on unusual file paths or execution contexts.

  - **Correlate with Sysmon logs:**
    Check Sysmon Event ID 1 for the same process creation events. This log provides rich context, including parent process IDs and command-line arguments, aiding in determining if the behavior deviates from normal activity.

  - **Establish a baseline of legitimate activity:**
    Verify normal usage of `Setres.EXE` on servers. If operations related to screen resolution changes normally do not invoke "choice" executables, consider the detected behavior as suspicious.

  - **Cross-check the file location of detected processes:**
    Inspect the file paths of the detected "choice" executables. Legitimate ones should be located in `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. If found elsewhere, flag as high-confidence malicious indicators.

  - **Contextualize the execution path:**
    Analyze the current execution path leading to the detection. If processes are spawned from unknown directories or temporary folders, this supports malicious exploitation.

  - **Evaluate system role and asset criticality:**
    Identify the system where the detection occurred. If it is a critical server or part of sensitive environments, prioritize the investigation, as successful exploitation can lead to significant security breaches.

  ### Prioritization

  The severity of this alert is high due to the potential of a common Windows utility being exploited to execute unauthorized commands. The likelihood of malicious abuse is notable because this behavior is not typical for `Setres.EXE`, making it imperative to swiftly investigate any such alerts in the environment.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers rename their payloads or use alternative methods for process creation that do not involve `Setres.EXE`. Reliable detection relies on correct logging configurations for process creations; if logging is disabled or incomplete, the alert may fail to trigger. Legitimate applications or scripts that reference screen resolution changes could erroneously activate this detection, so analysts should be mindful of established operational behavior. A related detection to strengthen coverage includes monitoring for other uncommon parent-child process relationships, especially involving other system utilities.

