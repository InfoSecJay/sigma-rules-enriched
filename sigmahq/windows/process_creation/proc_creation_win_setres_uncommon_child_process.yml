title: Uncommon Child Process Of Setres.EXE
id: 835e75bf-4bfd-47a4-b8a6-b766cac8bcb7
status: test
description: |
  Detects uncommon child process of Setres.EXE.
  Setres.EXE is a Windows server only process and tool that can be used to set the screen resolution.
  It can potentially be abused in order to launch any arbitrary file with a name containing the word "choice" from the current execution path.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Setres/
- https://twitter.com/0gtweet/status/1583356502340870144
- https://strontic.github.io/xcyclopedia/library/setres.exe-0E30E4C09637D7A128A37B59A3BC4D09.html
- https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731033(v=ws.11)
author: '@gott_cyber, Nasreddine Bencherchali (Nextron Systems)'
date: 2022-12-11
modified: 2024-06-26
tags:
- attack.defense-evasion
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\setres.exe'
    Image|contains: '\choice'
  filter_main_legit_location:
    Image|endswith:
    - 'C:\Windows\System32\choice.exe'
    - 'C:\Windows\SysWOW64\choice.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of uncommon child processes originating from `Setres.EXE`. The tool `Setres.EXE`, which is a legitimate Windows process used to set screen resolutions on Windows servers, can be misused by attackers to execute arbitrary binaries named with "choice" from the current execution path. This behavior is particularly concerning because it may indicate an attempt by an attacker to evade detection while executing malicious payloads under the guise of legitimate processes.

  The key objective of an attacker leveraging this technique might be to circumvent security mechanisms by using a trusted process to execute potentially harmful commands or scripts. This tactic falls under the MITRE ATT&CK framework, specifically related to `Defense Evasion (TA0005)` and techniques such as `Masquerading (T1036)` and `Executable File Execution (T1202)`. The primary data source for this detection is process creation logs on Windows systems, which will encompass the context needed to identify the parent-child relationship critical for detection.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances of `Setres.EXE` initiating processes that contain "choice" in their file path.
  - **Correlate Parent-Child Relationships**: Investigate the parent-child process relationships associated with `Setres.EXE` to determine if any unusual patterns or execution paths are identified.
  - **Check File Integrity**: Verify the legitimacy of the invoked child process by checking the file signatures and paths to ensure that they originate from the well-known Windows directories (e.g., `C:\Windows\System32\`, `C:\Windows\SysWOW64\`).
  - **Monitor Network Activity**: If suspicious execution is identified, consider reviewing network logs for any unusual outbound connections that may indicate exfiltration or communication with a command and control server.

  ### Prioritization
  The severity of this alert is high due to the potential for an attacker to exploit a trusted system process to execute malicious payloads, increasing the risk of compromise in enterprise environments where such processes may be trusted and overlooked by security controls.

  ### Blind Spots and Assumptions
  This detection logic assumes that `Setres.EXE` can be linked to malicious activities when child processes named with "choice" are invoked. However, there may be legitimate applications that utilize this functionality, leading to potential false positives. The detection may also miss variations of the attack if, for instance, attackers modify the process name or utilize other legitimate processes for similar tactics. Additionally, proper logging configurations must be in place for process creation events to ensure accurate detection, particularly within all server environments where `Setres.EXE` is present.

