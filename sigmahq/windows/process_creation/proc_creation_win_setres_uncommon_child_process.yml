logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\setres.exe'
    Image|contains: '\choice'
  filter_main_legit_location:
    Image|endswith:
    - 'C:\Windows\System32\choice.exe'
    - 'C:\Windows\SysWOW64\choice.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects uncommon child processes spawned by **Setres.EXE**, a Windows Server-only executable primarily used to set screen resolutions. The malicious objective suspected here is the exploitation of **Setres.EXE** to execute arbitrary files with names containing the term "choice," which could lead to executing payloads in a stealthy manner. This behavior aligns with the **Defense Evasion** tactic (T1202) and reflects an attack technique related to **Process Injection** (T1218).

  The primary telemetry source for detection is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1 which detail process parent-child relationships. If malicious, the security impact could involve unauthorized software execution, potentially leading to further exploitation or a compromise of sensitive data. It is important to note that this detection alone does NOT confirm malicious intent—legitimate administrative use of **Setres.EXE** could trigger similar alerts.

  ### Investigation Steps

  - **Examine the parent process:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation events detailing **Setres.EXE** as the parent. Look for child processes containing "choice" in the command line. Benign use will likely show standard resolution-setting operations without unusual parameters.

  - **Identify command-line arguments:** Review the command-line arguments associated with the identified child processes. Malicious indicators will often include non-standard flags or unusual file paths, particularly any attempts to load scripts or binaries from directories other than the typical `C:\Windows\System32\`.

  - **Cross-check executed paths:** Compare the full paths of the detected child processes to legitimate paths. Legitimate executions of `choice.exe` should only originate from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Any deviations should raise suspicion.

  - **Assess system context:** Determine the role of the host where the alert occurred. If the alert comes from a critical server or a machine that does not manage screen resolutions, its severity increases and warrants immediate investigation.

  - **Analyze process lineage:** Utilize Sysinternals tools, such as Process Explorer, to evaluate the process tree. Legitimate instances will show normal operating relationships, while suspicious instances may reveal incongruous parent-child relationships or unexpected network activity.

  ### Prioritization

  This alert should be treated with high priority due to its potential impact on critical servers related to screen resolution tasks, which are atypical targets for exploitation. The likelihood of malicious abuse is significant, as attackers may leverage this process for evasion techniques, as it may be less monitored compared to conventional executables.

  ### Blind Spots and Assumptions

  The detection may be limited by the visibility of processes not logged by traditional event logging configurations, leading to potentially missing instances of similar abuse. Additionally, legitimate administrative tasks involving **Setres.EXE** may trigger false positives. A companion detection to consider is logging for any anomalous network connections from the identified child process which could indicate data exfiltration attempts.

