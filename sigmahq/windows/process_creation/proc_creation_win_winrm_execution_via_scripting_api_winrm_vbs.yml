logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: winrm.vbs can only be run by a process named cscript (see "IsCScriptEnv" function)
  - Image|endswith: '\cscript.exe'
  - OriginalFileName: 'cscript.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'winrm'
    - 'invoke Create wmicimv2/Win32_'
    - '-r:http'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to execute remote code through the Windows Remote Management (WinRM) service using the `winrm.vbs` script executed by `cscript.exe`. The likely attacker objective is to leverage this functionality for lateral movement within a network to execute arbitrary commands or deploy malware on remote machines. This behavior is associated with the MITRE ATT&CK technique for Remote Services (T1216).

  Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation), capturing instances where `cscript.exe` runs with command lines indicating remote execution via WinRM. If successful, the impact can be severe, potentially compromising sensitive systems and escalating privileges. Importantly, this detection does NOT confirm that malicious activity has occurred, as legitimate administrators may also utilize WinRM for remote management.

  ### Investigation Steps

  - **Review process execution details:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 where `Image` ends with `\cscript.exe` and `OriginalFileName` is `cscript.exe`. Verify the `CommandLine` for patterns that include 'winrm' and 'invoke Create wmicimv2/Win32_'. Malicious instances will typically execute structured WinRM commands unlike benign uses.

  - **Correlate with user context:** Investigate the user account initiating the `cscript.exe` process. Look at the `NewProcessName` and `UserName` fields from the logs. Unauthorized accounts or service accounts executing this command can indicate malicious activity.

  - **Validate network connections:** Confirm whether the remote command execution initiated any WinRM connections by analyzing Windows Firewall logs for fails or successes on port 5985/5986. Legitimate use may show consistent expected connection patterns in the organization.

  - **Analyze command-line patterns:** Obscure commands like `-r:http` should be highlighted. Compare against a known inventory of scripts or automation used by IT operations to distinguish between legitimate use and malicious intent.

  - **Check for subsequent activities:** After detecting the `cscript.exe` process, review for related actions such as creation of new services or scheduled tasks, specifically looking for unusual entries that may suggest persistence mechanisms using `New-Service` cmdlets.

  - **Monitor system audit policies:** Ensure proper audit policies are set to capture all process creations in the environment. Missing logs can leave gaps in detection, potentially allowing attackers to leverage this script undetected.

  ### Prioritization

  This alert carries a medium severity based on the potential impact of compromised systems used for lateral movement combined with the likelihood of abuse by adversaries leveraging known Windows management tools. The behavior is occasionally weaponized during intrusions, necessitating a prompt response.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for obfuscation techniques used by malicious actors, such as renaming scripts or using alternate execution methods for `cscript.exe`. Ensure that logging is enabled on systems to capture all relevant WinRM actions, as incomplete configurations could bypass detection. Additionally, legitimate administrative actions such as software deployment may inadvertently trigger this alert, underscoring the need for contextual analysis. A related detection to consider strengthening coverage could include monitoring for `wmic` command executions, another potential vector for lateral movement.

