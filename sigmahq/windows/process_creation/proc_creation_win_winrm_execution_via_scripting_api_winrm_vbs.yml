title: Remote Code Execute via Winrm.vbs
id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
status: test
description: Detects an attempt to execute code or create service on remote host
  via winrm.vbs.
references:
- https://twitter.com/bohops/status/994405551751815170
- https://redcanary.com/blog/lateral-movement-winrm-wmi/
- https://lolbas-project.github.io/lolbas/Scripts/Winrm/
author: Julia Fomina, oscd.community
date: 2020-10-07
modified: 2023-03-03
tags:
- attack.stealth
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: winrm.vbs can only be run by a process named cscript (see "IsCScriptEnv" function)
  - Image|endswith: '\cscript.exe'
  - OriginalFileName: 'cscript.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'winrm'
    - 'invoke Create wmicimv2/Win32_'
    - '-r:http'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `winrm.vbs` script using the Windows Script Host (`cscript.exe`) to invoke remote commands on a target system via Windows Remote Management (WinRM). The likely objective of an attacker utilizing this technique is lateral movement within the network, potentially leading to unauthorized access or control over additional systems.

  The relevant MITRE ATT&CK tactic is **Lateral Movement** (T1075) with the technique being **Windows Remote Management** (T1021.001). Primary telemetry sources include Windows Security Event logs (Event ID 4688 for process creation) and Sysmon logs (Event ID 1 for process creation details). If executed maliciously, this behavior poses a significant risk as it allows an attacker to manipulate and execute arbitrary code on remote machines. However, this detection does NOT confirm that the execution was malicious, as it can occur during legitimate administrative actions.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `cscript.exe` with the command line containing `winrm`. Look specifically for the invocation of commands using WinRM and compare against known good administrative actions.

  - **Validate remote command execution context:** Analyze the context of the execution regarding user account permissions. Legitimate use will typically involve accounts with administrative privileges executing authorized tasks, such as system updates or configuration changes.

  - **Identify unusual command line arguments:** Look for anomalous entries in the command line such as ‘-r:http’ and variations thereof. Malicious use may include non-standard or unexpected command line parameters that are out of scope for regular administrative tasks.

  - **Correlate with user activity logs:** Investigate user activity logs to confirm if the user account executing the script has a history of executing legitimate management scripts. Examine the source addresses of the requests to ensure they align with internal policy or typical administrative networks.

  - **Inspect network traffic for anomalies:** Utilize network logs or a network monitoring tool to check for unexpected WinRM traffic patterns or remote connections initiated from unusual locations or IP addresses.

  ### Prioritization

  This alert is medium severity as it involves lateral movement behavior that can be exploited by attackers to gain control of other systems. The likelihood of malicious abuse is elevated, given that WinRM is frequently used in automated attack frameworks. This technique has been weaponized by various adversaries, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative tasks to trigger this rule, leading to false positives. The effective monitoring of WinRM activity requires appropriate logging configurations at both the host and network levels. Common legitimate triggers may include administrative scripts scheduled through Group Policy or run by trusted IT personnel. Companion detections could include alerts for unusual PowerShell activity (T1059.001), which is often used alongside remote management tactics.

