title: Remote Code Execute via Winrm.vbs
id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
status: test
description: Detects an attempt to execute code or create service on remote host via
  winrm.vbs.
references:
- https://twitter.com/bohops/status/994405551751815170
- https://redcanary.com/blog/lateral-movement-winrm-wmi/
- https://lolbas-project.github.io/lolbas/Scripts/Winrm/
author: Julia Fomina, oscd.community
date: 2020-10-07
modified: 2023-03-03
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: winrm.vbs can only be run by a process named cscript (see "IsCScriptEnv" function)
  - Image|endswith: '\cscript.exe'
  - OriginalFileName: 'cscript.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'winrm'
    - 'invoke Create wmicimv2/Win32_'
    - '-r:http'
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects attempts to execute remote code or create a service on a remote host using the WinRM (Windows Remote Management) scripting tool, specifically through the use of `winrm.vbs`. Attackers may leverage this technique to perform lateral movement within a network, allowing them to execute malicious commands on other systems without physical access. The ability to execute code remotely can facilitate further exploitation, such as data exfiltration, privilege escalation, or the deployment of additional malware.

  The rule aligns with the MITRE ATT&CK tactics of **Defense Evasion** and **Lateral Movement**. The relevant techniques include **T1216: Signed Binary Proxy Execution**, as this method is commonly used to obscure the true nature of the executed commands while evading detection. The primary data sources that will provide crucial evidence for this behavior are process creation events, particularly those related to command-line activity and execution of the `cscript.exe` interpreter.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation events that identify instances of `cscript.exe`. Focus on the command line arguments and investigate any executions that include 'winrm' or 'invoke Create wmicimv2/Win32_' to establish a timeline of activities.

  - **Correlate with Network Activity**: Examine any associated network traffic that may indicate communication with remote hosts. Analyze logs from firewalls or network monitoring solutions for connections initiated by the host running `cscript.exe` using WinRM.

  - **Inspect Host-Based Artifacts**: Utilize endpoint detection and response (EDR) tools to check for related artifacts on the endpoint where the command was executed. Look for unusual scripts or modules that may have been loaded or executed around the same time.

  - **Assess User Activity**: Investigate the user account that initiated the command to determine if it aligns with legitimate workflows or if it exhibits signs of compromise. Review user access levels and any recent changes to account privileges.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of lateral movement within an enterprise environment. The likelihood of exploitation through this method underscores the need for timely investigation, as successful execution can lead to considerable operational risk.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if process creation logs are not adequately monitored or if the execution happens through legitimate channels or scheduled tasks that bypass detection. The detection logic assumes that all executions of `cscript.exe` are logged effectively and that no obfuscation techniques are being employed that could mask the malicious command attempts. Adequate logging settings and monitoring configurations are required to ensure that this detection rule functions correctly.

