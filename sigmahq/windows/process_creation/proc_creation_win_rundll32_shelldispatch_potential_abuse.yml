note: |
  ### Technical Context

  This rule detects the misuse of "ShellDispatch.dll" through the execution of arbitrary binaries via the "ShellExecute" method, typically triggered by the `rundll32.exe` process. This activity suggests an attacker may be attempting to execute a malicious payload or control task without raising suspicion, utilizing a common Windows utility for execution.

  The relevant MITRE ATT&CK tactic and technique are Execution (TA0002) and Command and Scripting Interpreter: Command-Line Interface (T1059.003). The primary telemetry sources required for detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, highlighting the invocation of processes and command-line arguments. If malicious, this behavior can lead to unauthorized actions on the system, including lateral movement or data exfiltration. Importantly, this detection alone does not confirm malicious intent; further investigation is required to determine the legitimacy of the command execution.

  ### Investigation Steps

  - **Check the process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for the `rundll32.exe` process. Ensure the process originated from expected paths (e.g., `C:\Windows\System32\rundll32.exe`). Legitimate executions typically relate to well-known Windows functions rather than arbitrary commands.

  - **Review command-line arguments**: Analyze the CommandLine field for recent `rundll32.exe` invocations. Look for `RunDll_ShellExecuteW`; this parameter is unusual and indicates potential misuse. Compare against known benign usage patterns to distinguish legitimate from malicious behavior.

  - **Verify the parent process**: Identify the ParentProcessId from the process creation logs. Legitimate instances typically have system or trusted process parents, while suspicious activity might arise from less common or unexpected parent processes, potentially indicating evasion or stealth.

  - **Examine additional telemetry**: Correlate findings with Windows Event logs for application usage around the same timestamps. Look for other logged activities that coincide with the execution of `rundll32.exe`, which could provide context regarding potential malicious intent or benign operation.

  - **Assess asset criticality**: Determine if the affected host is a critical server or endpoint. Higher-value assets demand prompt action and deeper investigation, especially if logs indicate lateral movement or command execution beyond expected behavior.

  ### Prioritization

  This alert holds medium severity due to the potential for abuse associated with `rundll32.exe`, a commonly abused Windows process. While not frequently seen in benign contexts, it could signify significant risk if exploited by an attacker, especially on mission-critical assets.

  ### Blind Spots and Assumptions

  Detection may be circumvented if an attacker modifies the command line or uses alternate methods for execution that do not involve `rundll32.exe`. Reliable detection requires appropriate logging configurations for process creation events. Legitimate administrative tasks or legitimate application behavior could inadvertently trigger this alert, especially automation scripts. A companion detection, such as monitoring for anomalous executions via PowerShell (T1086), can reinforce the security posture against exploitation.

