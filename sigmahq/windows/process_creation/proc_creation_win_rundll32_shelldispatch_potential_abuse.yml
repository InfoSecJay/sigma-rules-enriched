detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains: 'RunDll_ShellExecuteW'
  condition: all of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential abuse of the "ShellDispatch.dll" Windows functionality to execute arbitrary binaries using the `ShellExecute` method. Attackers may leverage this technique to execute malicious commands while mimicking legitimate processes, facilitating various malicious objectives, such as executing payloads or establishing persistence on compromised systems. The use of `rundll32.exe` in this context typically indicates an evasion tactic, as it can obscure the true nature of the executed commands.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), which involves running malicious code, and **Defense Evasion** (TA0005), wherein attackers attempt to evade detection mechanisms by using living-off-the-land binaries (LOLBins) like `rundll32.exe`. The specific techniques that apply include **Command and Control using Removable Media** (T1203) and **Scripting** (T1064), underscoring the risk of executing unauthorized scripts or commands.

  Primary data sources for this detection include process creation events, which provide insights into command executions and associated parameters, and potentially system logs related to DLL loading and execution.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate the process creation logs for `rundll32.exe` instances, specifically focusing on their command line arguments to identify suspicious entries that include `RunDll_ShellExecuteW`.

  - **Analyze Command Line Arguments**: Identify and analyze command lines associated with `rundll32.exe`, looking for patterns indicative of an attacker attempting to leverage `ShellDispatch.dll` for execution.

  - **Correlate with User Activity**: Check for unusual user activity or behavior in proximity to the detected event, especially if the command was executed outside of normal user hours or from atypical locations.

  - **Assess Environmental Context**: Review related events in the environment, such as recent software installations or changes in administrative policies that may indicate a benign context for the detection—ensuring that alerts aren't misattributed to legitimate use cases.

  ### Prioritization
  This alert carries a medium severity level within an enterprise environment due to the potential for significant impact if attackers utilize this technique for arbitrary code execution while maintaining stealth. The likelihood of occurrence is reasonable, given the prevalence of LOLBins being exploited in attacks.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection logic is the reliance upon specific command line patterns; if an attacker uses different parameters or tools to execute similar actions, these may not be detected. The detection assumes that `rundll32.exe` will be the binary invoked, which may not be the case if alternative execution methods are employed. Additionally, accurate and complete process creation logs are necessary to support the detection, highlighting the importance of proper logging configuration on Windows endpoints for effective monitoring.

