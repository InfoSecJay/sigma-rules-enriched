note: |
  ### Technical Context

  This Sigma rule detects the misuse of `ShellDispatch.dll` through its interaction with `rundll32.exe`, particularly targeting the execution of arbitrary binaries via the `ShellExecute` function. Malicious actors may leverage this to execute payloads stealthily, aiming to establish persistence or execute further steps within an environment undetected. This aligns with the MITRE ATT&CK technique for Execution (T1203) and the tactic of Execution.

  The primary telemetry source is the Windows process creation logs, specifically focusing on Event ID 4688 which records new process instances. If malicious, this behavior could lead to unauthorized command execution, replacing legitimate application behaviors. Importantly, this detection alone does not confirm malicious intent but requires further investigation into process legitimacy and origin.

  ### Investigation Steps

  - **Review process creation details**: Check for Event ID 4688 associated with `rundll32.exe`. Look at the fields for `CommandLine` to confirm if it contains `RunDll_ShellExecuteW`, and verify the parent process ID (PPID) to identify its origin.

  - **Correlate with user activity**: Identify if users were executing legitimate commands or using related software tools that might utilize `ShellDispatch.dll`. Check for common legitimate command-line arguments used in safe operations.

  - **Analyze loaded modules**: Use Sysinternals tools (like Process Explorer) to verify the loaded modules for any instance of `rundll32.exe`. Check if `ShellDispatch.dll` is indeed loaded and assess the associated command line for anomalies.

  - **Investigate file creation paths**: Look for new executable files created around the same time as the flagged process. Use Event ID 4663 (Access Attempt) to identify file actions that coincide with the suspicious `rundll32.exe` execution.

  - **Identify high-risk network activity**: Cross-reference with network logs and look for any outbound connections initiated by the process. Pay close attention to any unknown IP addresses or domains in logs.

  ### Prioritization

  This alert indicates a medium severity due to the potential impact on system integrity and the likelihood of being used maliciously, especially by skilled attackers leveraging uncommon techniques. The use of `rundll32.exe` is frequently associated with stealthy execution methods, increasing the urgency for detailed investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like utilizing alternate process names or employing legitimate software that might fire similar alerts. Reliable detection requires comprehensive logging of process creation events and appropriate monitoring of user activities. Legitimate applications relying on `ShellExecute` may trigger this alert, necessitating careful context evaluation. Complementary rules such as those monitoring unusual parent-child process relationships can reinforce detection effectiveness.

