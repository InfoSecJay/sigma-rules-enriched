logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'keymgr'
    - 'KRShowKeyMgr'
  condition: all of selection_*
falsepositives:
- Administrative activity
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to invoke the Stored User Names and Passwords dialogue, also known as Key Manager, on Windows systems. By doing so, it highlights potential credential theft activities where attackers might be attempting to retrieve stored credentials from affected systems. The Key Manager can be misused by malicious actors looking to access sensitive information stored on a system, aiding in credential access and potentially leading to further compromise across the network.

  The primary objective of such an attack is often to harvest credentials for lateral movement within a network or to escalate privileges. This behavior aligns with the MITRE ATT&CK framework, particularly with the tactics and techniques of **Credential Access** (TA0006) and **Credential Dumping** (T1555.004). The detection leverages process creation telemetry, specifically monitoring invocations related to `rundll32.exe`, which is commonly associated with running dynamic link libraries and can be exploited for malicious purposes.

  The best sources of telemetry for this alert are process creation logs from Windows event logs, which provide detailed information about the command line arguments used during the invocation of processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for any activity related to `rundll32.exe`, focusing specifically on the command line parameters that include 'keymgr' or 'KRShowKeyMgr' to identify potential misuse.
  - **Analyze User Context:** Determine the user account under which the process was invoked. Verify whether this user has the appropriate privileges for accessing the Key Manager and consider any unusual logon patterns.
  - **Correlate with Credential Store Artifacts:** Check for additional artifacts in the Windows Credential Manager and other repositories to identify any suspicious accesses or modifications involving stored credentials.
  - **Monitor for Lateral Movement:** Investigate subsequent network or process events that might indicate lateral movement or further exploitation attempts following the Key Manager access.

  ### Prioritization
  This alert is assigned a high severity due to the potential for significant impact resulting from unauthorized access to stored credentials, which could lead to complete system compromise and network-wide breaches.

  ### Blind Spots and Assumptions
  One potential gap in this detection is the reliance on process creation logs, which may not capture all contexts in which Key Manager is accessed. The detection logic assumes that attackers will invoke the Key Manager using `rundll32.exe`, which might not always be the case if a different method or tool is employed. Additionally, ensuring accurate logging configuration for process creation events is essential; without this, the alert may not trigger as intended or may miss relevant events entirely.

