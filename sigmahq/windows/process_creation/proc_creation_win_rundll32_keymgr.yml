  ---

  ### Technical Context

  This Sigma rule detects the invocation of the Stored User Names and Passwords Management (Key Manager) interface through the `rundll32.exe` process, which could indicate unauthorized credential access or manipulation by an attacker. The objective here is typically to obtain or alter stored credentials, aiding further infiltration or lateral movement within the environment. This behavior corresponds to the MITRE ATT&CK technique **Credential Dumping (T1555.004)**, which falls under the **Credential Access** tactic.

  The primary telemetry sources for this detection are process creation logs from Windows environments, specifically focusing on **Event ID 4688** (for process creation) and **Sysmon Event ID 1**. If exploited maliciously, this technique could lead to severe security impacts, potentially leading to compromised accounts and unauthorized access. However, this detection does NOT confirm that an adversary has successfully extracted credentials; it merely indicates that the Key Manager interface has been invoked.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID **4688** for the creation of `rundll32.exe`. Check for the **CommandLine** field containing `keymgr` and `KRShowKeyMgr` to confirm the alert.

  - **Validate user context:** Identify the user account associated with the alert. If it is a known administrative account, legitimate administrative activity should be confirmed by examining the user’s role and actions taken during that session.

  - **Analyze previous processes:** Investigate if there were other potentially suspicious processes or network connections leading up to this event using **Sysmon Event ID 22** (network connections). A legitimate background process shouldn’t precede the activity.

  - **Correlate with policy exceptions:** Check if there are any documented exceptions or policies that would legitimately require the use of `Key Manager`. This might reduce false positives based on company-specific administrative activities.

  - **Look for high-confidence indicators of compromise:** Investigate for unusual patterns immediately before the invocation, such as the presence of malware or unauthorized scripts that could trigger this command line invocation.

  ---

  ### Prioritization

  This alert is considered high severity due to its potential impact on credential theft and system compromise. The likelihood of malicious abuse is significant, as tools leveraging credential dumping techniques are commonly weaponized in attacks. Systems that are critical or have access to sensitive data should be prioritized for further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may leverage legitimate user accounts or administrative privileges to initiate the Key Manager interface without raising suspicion. Reliable detection also requires monitoring Event IDs associated with process creation and potentially Sysmon configurations for accurate telemetry capture. Moreover, legitimate administrative tasks—such as password resets or audits—could occasionally trigger this alert. Companion detections focusing on other credential dumping techniques, such as **T1003** (Credential Dumping), could enhance coverage and context.

