note: |
  ### Technical Context

  This rule detects the invocation of the Stored User Names and Passwords dialogue (Key Manager) through the execution of the `rundll32.exe` process with specific command line parameters. The likely attacker objective is credential harvesting, especially targeting stored authentication details that could facilitate unauthorized access to systems or applications. This behavior aligns with the MITRE ATT&CK technique **Credential Access** (T1555.004). The primary telemetry source for this detection is process creation events on Windows, specifically focusing on Security Event ID **4688** and Sysmon Event ID **1**. If the detected behavior is malicious, it poses a significant security risk, as it may allow attackers to access sensitive credentials stored on the compromised host. However, this detection does NOT confirm malicious intent by itself, as legitimate administrative activities may trigger the same process.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID **4688** and Sysmon Event ID **1** to identify occurrences of `rundll32.exe` with command line arguments containing `keymgr` or `KRShowKeyMgr`. Look for timestamps and user accounts that initiated these processes to establish context.

  - **Evaluate user account activity:** Check if the invocation occurred under an administrator account or a non-privileged user. Legitimate administrative activities may include authorized access to Key Manager for managing saved credentials.

  - **Correlate with other security events:** Investigate related events such as **Event IDs 4648 (logon attempts) or 4624 (successful logons)** around the same time frame as the key manager access to see if there is a pattern of suspicious login activity.

  - **Identify command line anomalies:** Look for unusual or potentially malicious command line parameters in the invocation of `rundll32.exe`. Flags like `/n` or additional arguments unrelated to key management can indicate an attacker’s attempt to obfuscate their actions.

  - **Search for file artifacts:** Validate if any files related to credential storage have been created or accessed during the invocation timeframe. Specifically, check for changes in `C:\Users\<Username>\AppData\Local\Microsoft\Credentials`.

  - **Assess network behavior:** Examine any outgoing network connections during the alert timeframe for potentially exfiltrating credentials. Look particularly for connections from the host running the malicious command to unknown or suspicious IP addresses.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive credential leakage, particularly if it occurs on critical assets such as domain controllers or user workstations with access to privileged applications. The likelihood of malicious abuse is significant, as credential theft is a common tactic employed by adversaries to escalate privileges or move laterally within a network.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who can spoof process names or use alternative methods to access credentials without triggering process creation alerts. Ensuring the logging of all process creation events with detailed command lines is crucial for this detection to be effective. Additionally, legitimate administrative tools or scripted processes that use `rundll32.exe` could trigger this alert, necessitating an assessment of user roles and recent activities. A related detection to strengthen coverage would be monitoring for unusual logon patterns or administrative command execution, enhancing the overall context and understanding of user behavior.

