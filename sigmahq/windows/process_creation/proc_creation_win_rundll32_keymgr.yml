note: |
  ### Technical Context

  This Sigma rule detects the invocation of the Windows Stored User Names and Passwords dialog, commonly known as Key Manager, through the `rundll32.exe` process when specific command-line parameters are present. An attacker may leverage this functionality to extract stored credentials, which could facilitate lateral movement or unauthorized access to sensitive resources. The relevant MITRE ATT&CK techniques include Credential Access (T1555.004) as it specifically involves obtaining user credentials stored in the Key Manager.

  The primary telemetry source is Windows process creation events, particularly leveraging Sysmon Event ID 1 or Security Event ID 4688, which logs the details of processes when they are created. If this behavior is malicious, it may indicate an attempt to access sensitive user credentials covertly. It is essential to note that this detection alone does not confirm malicious activity as legitimate administrative operations might trigger it, requiring further investigation to ascertain intent.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for any instances where `rundll32.exe` is invoked with a command line containing 'keymgr' and 'KRShowKeyMgr.' Note the User and Process ID to trace potential malicious activity.

  - **Check user context:** Determine the user account that executed the `rundll32.exe` process. If it’s a non-administrative user and time of access is unusual, this may suggest malicious intent.

  - **Validate against known administrative activities:** Cross-reference with organizational Change Management logs or approved scripts. Identify if the exposed activity aligns with documented legitimate use cases within the environment.

  - **Monitor for credential extraction behavior:** Investigate any subsequent actions from the process, including network connections or file access, that may indicate further credential extraction attempts. Look for unexpected outbound connections or access to user profile directories.

  - **Identify additional logged artifacts:** Check for creation or modification of files related to `keymgr`, especially in sensitive directories (e.g., `C:\Users\<username>\AppData\Roaming`). Review access patterns to identify abnormal behaviors.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive credential exposure, especially if originating from critical systems or admin accounts. Credential extraction via this method is a common tactic used by adversaries during post-exploitation phases, increasing the likelihood of malicious abuse in this context.

  ### Blind Spots and Assumptions

  Detection may be limited by elevated user privileges that could obscure legitimate administrative tasks, such as IT support actions. Logs from sources like Windows Event Logs or Sysmon must be correctly configured to capture necessary telemetry. Legitimate administrative activities, such as scheduled maintenance or password recovery operations, could falsely trigger this alert. To enhance detection efficacy, consider implementing additional rules targeting related suspicious behaviors, such as direct access attempts to the Windows Credential Store (T1555.001).

