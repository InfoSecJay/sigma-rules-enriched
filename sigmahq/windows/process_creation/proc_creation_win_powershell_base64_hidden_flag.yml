note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity by monitoring for the presence of Base64 encoded strings commonly used in PowerShell command lines. The clever encoding of commands allows attackers to obfuscate their intentions, making detection more challenging for traditional security tools. The use of PowerShell for executing malicious commands is a well-known tactic among threat actors, often aimed at executing payloads, downloading additional malicious software, or performing lateral movement across a network.

  Attackers leveraging this technique may aim to execute commands without raising alarms, cloak their actual intentions, or manipulate system configurations to gain deeper access into the target environment. The relevant MITRE ATT&CK tactics for this type of activity include Execution (T1203) and Command and Scripting Interpreter (T1059.001). By stringently parsing command lines for Base64 encoded inputs in PowerShell executions, this rule helps to identify possible instances of code injection or exploitation attempts.

  Primary data sources necessary for validating this detection logic include process creation events from Windows systems, specifically focusing on logs that capture command lines executed via PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for PowerShell executions that match the detection criteria. Pay attention to the command line parameters used and look for encoded strings.

  - **Examine PowerShell Transcripts**: If PowerShell logging is enabled, review script execution policies and transcripts for any unexpected commands or scripts that utilize Base64 encoding.

  - **Check Anti-Virus and EDR Alerts**: Look for any triggered alerts from security solutions related to PowerShell activities, especially those that involve script execution or the use of encoded commands.

  - **Investigate Associated Network Activity**: Identify any outbound connections or attempts initiated by PowerShell processes that could indicate data exfiltration or command-and-control communication.

  ### Prioritization
  This alert is considered high severity due to the potential impact of successful exploitation via malicious PowerShell usage, which may lead to unauthorized access, data breaches, or the deployment of further malware. The likelihood of such events is significant, particularly in environments where PowerShell scripts are frequently used for administrative purposes.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell visibility is limited or if encoding techniques change beyond the specific strings defined in this rule. The logic assumes that encoded PowerShell commands are directly executed, thereby potentially missing variations or alternate command execution methods. The detection relies heavily on the collection of process creation logs with command line details, which must be enabled and properly configured across all relevant endpoints for the alert to function effectively.

