note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands containing base64 encoded strings, which are often indicative of obfuscated and potentially malicious activities. Attackers typically employ such obfuscation techniques to execute malicious payloads, bypass security controls, or conceal their operations from detection. The relevant MITRE ATT&CK technique here is "Command and Scripting Interpreter: PowerShell" (T1059.001).

  Primary telemetry sources include Windows process creation events, particularly focusing on Event ID 4688, which logs the command lines executed by processes like `powershell.exe` or `pwsh.exe`. If malicious, this activity can lead to unauthorized access or system compromise. However, this detection does not confirm that the command is inherently malicious; further investigation is needed to assess intent and context.

  ### Investigation Steps

  - **Examine command line arguments:** Check Event ID 4688 for the command line of the detected PowerShell process. Look for familiar base64 encodings that match known malicious patterns or strings.

  - **Validate legitimate PowerShell usage:** Investigate other occurrences of `powershell.exe` or `pwsh.exe` being invoked with explicit commands that do not contain obfuscation. Focus on corporate scripts or authorized administrative activities to establish a baseline for normal operations.

  - **Review parent process relationships:** Utilize Process Explorer or review Event ID 4688 to identify the parent process that initiated the PowerShell execution. Malicious processes often spawn from unusual parent executables, such as `explorer.exe` or uncommon system processes.

  - **Correlate with network activity:** Cross-reference the time and target system of the alert with network logs (e.g., firewall or proxy logs). Look for outgoing connections or DNS requests often associated with data exfiltration or command and control activity.

  - **Assess recent system changes or user behavior:** Check Windows Security or System event logs for recent administrative changes on the system. Look for unauthorized user account activities or changes leading up to the alert, such as suspicious logins (Event ID 4624).

  ### Prioritization

  This alert is high severity due to its potential impact on sensitive assets, as it can indicate an active exploitation attempt. The use of base64 encoded commands is a technique frequently adopted to simplify obfuscation for the purposes of running malicious payloads, suggesting high likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Limitations include the potential for false positives from legitimate administrative actions that may use obfuscation, such as in development or testing environments. Reliable detection requires the logging of PowerShell command lines across systems and consistent monitoring of privileged account activities. A related detection method could include monitoring for PowerShell scripts being downloaded from external sources, enhancing visibility on potentially malicious behaviors.

