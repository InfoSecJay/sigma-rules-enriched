title: OneNote.EXE Execution of Malicious Embedded Scripts
id: 84b1706c-932a-44c4-ae28-892b28a25b94
status: test
description: |
  Detects the execution of malicious OneNote documents that contain embedded scripts.
  When a user clicks on a OneNote attachment and then on the malicious link inside the ".one" file, it exports and executes the malicious embedded script from specific directories.
references:
- https://bazaar.abuse.ch/browse/tag/one/
author: '@kostastsale'
date: 2023-02-02
tags:
- attack.defense-evasion
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\onenote.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    CommandLine|contains:
    - '\exported\'
    - '\onenoteofflinecache_files\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of malicious scripts embedded within OneNote documents. Attackers exploit OneNote files by embedding harmful scripts that execute when a user interacts with those files, often leading to the download and execution of additional malware or unauthorized access to systems. Such tactics are commonly employed in phishing campaigns where users are manipulated into executing malicious content disguised as legitimate documents.

  The suspected threat aligns with various attack techniques under the MITRE ATT&CK framework, specifically focusing on **Execution** (T1203: Exploitation for Client Execution) and **Defense Evasion** (T1218.001: Signed Script Proxy). The attacker’s objective is typically to gain a foothold in the environment or escalate privileges through the execution of these scripts, instantiating a chain of malicious activities.

  The primary data sources that will provide the most conclusive evidence regarding this behavior include **process creation events**, which capture the execution of OneNote and scripting tools, and **Windows event logs** that track application usage and user interactions with OneNote files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances where `onenote.exe` is the parent image and is spawning scripting executables like `cmd.exe`, `powershell.exe`, or `cscript.exe`. Identify the command lines used in these instances to ascertain if they reference malicious paths or commands.

  - **Examine User Interaction Logs**: Check logs for user interactions with OneNote files, especially those that include execution commands. Pay close attention to actions taken on `.one` files that may have led to launching embedded scripts.

  - **Analyze Command Line Arguments**: Investigate any suspicious command line arguments related to `exported` directories or `onenoteofflinecache_files`. Scripts executed from these locations should be scrutinized for their origin and purpose.

  - **Correlate with Phishing Indicators**: Reference known malicious OneNote documents or embedded scripts reported in threat intelligence feeds. This can help in identifying if the initial attack vector aligns with documented phishing tactics targeting OneNote.

  ### Prioritization
  This alert's severity is classified as high due to the potential for significant impact if attackers successfully execute embedded scripts. The likelihood of encountering such exploits is elevated given the frequent use of OneNote in business environments for sharing documents.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if process logging is not adequately implemented or if users are not sufficiently educated to recognize suspicious OneNote files. The detection logic assumes that any OneNote execution leading to specific script activity is malicious, which may not account for legitimate use cases in administrative or technical contexts. Effective monitoring of process creation events and command line parameters is essential for this alert to function correctly. Without comprehensive logging of these parameters, the detection may yield false negatives.

