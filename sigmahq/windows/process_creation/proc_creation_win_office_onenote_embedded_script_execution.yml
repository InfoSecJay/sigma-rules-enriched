title: OneNote.EXE Execution of Malicious Embedded Scripts
id: 84b1706c-932a-44c4-ae28-892b28a25b94
status: test
description: |
  Detects the execution of malicious OneNote documents that contain embedded scripts.
  When a user clicks on a OneNote attachment and then on the malicious link inside the ".one" file, it exports and executes the malicious embedded script from specific directories.
references:
- https://bazaar.abuse.ch/browse/tag/one/
author: '@kostastsale'
date: 2023-02-02
tags:
- attack.stealth
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\onenote.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    CommandLine|contains:
    - '\exported\'
    - '\onenoteofflinecache_files\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of malicious scripts embedded within OneNote documents after user interaction. When a user clicks on an embedded link within a OneNote attachment, it can trigger the execution of various command-line interpreters such as PowerShell or WScript, indicating potential exploitation. The likely attacker objective is to execute malicious commands on the host system, possibly to establish persistence or exfiltrate data.

  The relevant MITRE ATT&CK tactic is Execution (TA0002), with the technique being User Execution (T1203) as the user's action initiates the malicious script. Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1 that capture process creation events and arguments. If malicious, this behavior can lead to significant compromise, including data loss or system takeover. This detection does NOT confirm that the script was successfully executed without analyzing the context of execution.

  ### Investigation Steps

  - **Review spawned processes:**
    Check for process creation logs corresponding to OneNote execution (Event ID 4688) looking for child processes like `cmd.exe`, `powershell.exe`, or `wscript.exe` that contain paths like `\exported\` or `\onenoteofflinecache_files\`.

  - **Analyze command-line arguments:**
    Investigate the command-line arguments associated with the detected processes. Look for strings like `\exported\` or evidence of script execution commands that indicate attempts to run embedded scripts.

  - **Identify user actions:**
    Review user activity logs just before the alert. Determine if a user opened a OneNote document and executed a link, which is necessary for the behavior to occur. Look for legitimate usage patterns, such as accessing non-suspicious documents or purposely opening tutorials.

  - **Validate system integrity:**
    Examine the file system for the presence of unusual files in the `\exported\` or `\onenoteofflinecache_files\` directories. Compare timestamps with the suspicious process creation event to identify potential signs of payload execution.

  - **Check for associated network activity:**
    Review network logs for any connections made by the spawned process to external IPs or domains. Anomalies such as connections made to known malicious domains or anomalous data exfiltration attempts should be flagged for further investigation.

  ### Prioritization

  This alert is of high severity due to the potential for executing malicious code on systems that may contain sensitive data. The nature of OneNote attachments allows attackers to bypass traditional security measures, making the likelihood of malicious abuse significant. Given the increasing reports of malicious OneNote usage in attacks, this behavior merits immediate attention.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of legitimate OneNote tools and processes if implemented without proper monitoring. Required log sources include all process creation logs (via Security event IDs and Sysmon) for reliable detection. Legitimate activities that may trigger this alert might include users generating scripts for valid administrative tasks or legitimate training materials. A related detection metric could include monitoring for unusual PowerShell activity (T1059.001), strengthening overall visibility on script execution methods.

