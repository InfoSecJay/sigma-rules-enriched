title: OneNote.EXE Execution of Malicious Embedded Scripts
id: 84b1706c-932a-44c4-ae28-892b28a25b94
status: test
description: |
  Detects the execution of malicious OneNote documents that contain embedded scripts.
  When a user clicks on a OneNote attachment and then on the malicious link inside the ".one" file, it exports and executes the malicious embedded script from specific directories.
references:
- https://bazaar.abuse.ch/browse/tag/one/
author: '@kostastsale'
date: 2023-02-02
tags:
- attack.defense-evasion
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\onenote.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    CommandLine|contains:
    - '\exported\'
    - '\onenoteofflinecache_files\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of potentially malicious scripts launched from OneNote documents, particularly when a user interacts with embedded links in ".one" files. Attackers may embed scripts to execute commands stealthily, often aiming to deliver malware, exfiltrate data, or establish persistence. This behavior corresponds to the MITRE ATT&CK technique "Trusted Relationship" (T1218.001) under the tactic of "Defense Evasion."

  The primary telemetry source is process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the execution of these scripts could lead to significant security risks, including unauthorized data access or system compromise. It is important to note that this detection does not confirm malicious intent on its own; further investigation is necessary to determine the context of the executed script.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for OneNote process initiations. Look for parent process usage (ParentImage) associated with OneNote.exe, and identify any child processes that are command-line executables like cmd.exe or powershell.exe.

  - **Analyze command-line parameters:** Focus on the CommandLine field in the process creation logs. Ensure to check for indicators such as "exported\" or "onenoteofflinecache_files\". If these are found in conjunction with suspicious executables, it indicates potential malicious activity.

  - **Validate legitimate usage:** Identify expected behavior by reviewing logs for OneNote use cases within your organization. If users frequently utilize embedded scripts in OneNote files for legitimate purposes, document typical command-line patterns that do not feature suspicious paths or executables.

  - **Assess user context:** Investigate the user account executing these scripts. Determine whether the account has appropriate privileges for the actions taken and whether it has a history of using OneNote legitimately. Suspicious activity from service or administrative accounts should raise concerns.

  - **Cross-reference threat intelligence:** Compare any identified scripts or command-line arguments against known malicious indicators from threat intelligence sources such as the listed Abuse.ch entries. High-confidence matches with identified threat actors should escalate the investigation.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on compromised systems, especially if it involves administrative accounts or mission-critical assets. The likelihood of malicious abuse is significant, as OneNote is increasingly exploited for delivering malicious payloads.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where OneNote is regularly used for legitimate purposes, potentially generating false positives. Ensure that logging for process creation is correctly configured across all relevant systems, as gaps in visibility could lead to undetected incidents. Additionally, legitimate scenarios such as organizational training or user-initiated activities may unknowingly trigger this alert. Companion detections may include monitoring for suspicious activities related to Windows Script Host (WSH), as it often aids in similar exploitation patterns.

