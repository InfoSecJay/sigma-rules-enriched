title: OneNote.EXE Execution of Malicious Embedded Scripts
id: 84b1706c-932a-44c4-ae28-892b28a25b94
status: test
description: |
  Detects the execution of malicious OneNote documents that contain embedded scripts.
  When a user clicks on a OneNote attachment and then on the malicious link inside the ".one" file, it exports and executes the malicious embedded script from specific directories.
references:
- https://bazaar.abuse.ch/browse/tag/one/
author: '@kostastsale'
date: 2023-02-02
tags:
- attack.defense-evasion
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\onenote.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    CommandLine|contains:
    - '\exported\'
    - '\onenoteofflinecache_files\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of malicious scripts that are embedded within OneNote documents. Typically, an attacker may send a phishing email containing a OneNote file, and when a user opens the attachment and interacts with a malicious link within it, the embedded script executes, potentially leading to compromise. The rule aligns with the MITRE ATT&CK techniques for defense evasion (T1218.001) primarily aimed at executing commands and scripts on the victim machine while maintaining a low profile.

  The primary telemetry sources for this detection include Windows process creation logs, specifically looking at Event ID 4688 or Sysmon Event ID 1, focusing on parent-child relationships of executed processes. If malicious, this activity could lead to significant security risks, including unauthorized access or data exfiltration. It is important to note that this detection does NOT confirm that an organization has been breached; it merely indicates the execution of potentially harmful scripts.

  ---

  ### Investigation Steps

  - **Identify the parent process**: Check for Event ID 4688 or Sysmon Event ID 1 where the `ParentImage` ends with `\onenote.exe`. This indicates that the script was initiated from OneNote.

  - **Review command line arguments**: Look for `CommandLine` fields containing `\exported\` or `\onenoteofflinecache_files\`. Malicious executions often involve these paths and should be validated against known benign scenarios, such as regular OneNote operations.

  - **Cross-verify child process execution**: Track the execution of child processes like `cmd.exe`, `powershell.exe`, or `cscript.exe` from the original OneNote process. Malicious activity often triggers uncommon child process executions linked with OneNote.

  - **Examine the full command line**: Investigate the full command line used for `powershell.exe` or `mshta.exe`. Indicators of malicious activity may include suspicious PowerShell commands that reference network connections or file downloads.

  - **Identify expected OneNote behavior**: Assess the presence of benign OneNote activity typically involving document revisions or standard command executions without unusual command line arguments or unrelated child process creations.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on sensitive data integrity and confidentiality since OneNote documents can contain critical enterprise information. The likelihood of malicious exploitation is significant, as phishing campaigns utilizing OneNote files with embedded scripts have become a common attack vector.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of endpoint telemetry or the inability of processes to log script outputs. Adversaries might use benign OneNote attachments or rapid enumeration of file paths to evade detection. Investigators should be aware that legitimate activities, such as users working with shared OneNote notebooks, could trigger the alert. Companion detections, such as monitoring network connections initiated by PowerShell or cmd processes spawned from OneNote, can enhance overall coverage against this attack vector.

