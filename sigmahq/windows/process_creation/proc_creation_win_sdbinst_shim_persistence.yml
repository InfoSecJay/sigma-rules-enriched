note: |
  ### Technical Context

  This rule detects the execution of `sdbinst.exe`, which is used to install application shims, a technique that adversaries may exploit for persistence or privilege escalation by loading malicious content. The likely objective of the attacker is to manipulate a legitimate process to achieve stealthy execution of malicious payloads. It aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1546.011) under the tactics of Persistence and Privilege Escalation. The primary telemetry sources include process creation logs from Windows, specifically focusing on Event ID 4688. If successful, such manipulations can lead to unauthorized access or control over systems. However, this detection does not confirm that the action is malicious by itself; legitimate software installations or updates could trigger similar behavior.

  ### Investigation Steps

  - **Verify execution context:** Review process creation logs for `sdbinst.exe` (Event ID 4688). Check fields such as `CreatorProcessId`, `ParentImage`, and `CommandLine` for unexpected parental relationships or suspicious arguments.

  - **Identify malicious indicators:** Look for any anomalous command-line arguments associated with `sdbinst.exe`, specifically those containing `.sdb` files. If the command line indicates shims loaded from non-standard locations, such as `C:\temp\`, it is highly suspicious.

  - **Compare with legitimate behavior:** Identify typical valid `sdbinst.exe` usage within your environment; logs showing `ParentImage` of `msiexec.exe` with paths including `IIS Express` (e.g., `C:\Program Files (x86)\IIS Express\iisexpressshim.sdb`) are generally acceptable and should not raise alerts.

  - **Correlate with user behavior:** Review user login and activity logs in tandem with `sdbinst.exe` execution timestamp. A new shim installation without the user's prior activity or during odd hours could indicate malicious intent.

  - **Check for persistence artifacts:** Investigate persistence mechanisms in place, such as registry keys under `HKLM\Software\Microsoft\Windows\CurrentVersion\Run` that may reference newly created shims. Look for recent entries that correspond to the execution time of `sdbinst.exe`.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on system integrity and the common use of shimming techniques by malicious actors for persistence. Malicious usage is plausible, especially in environments where the attacker aims to maintain stealth, although benign software deployments may also trigger this alert.

  ### Blind Spots and Assumptions

  Detection may be hindered if logging configurations do not capture all relevant process creation events or if shimming use is common in the environment without proper contextual understanding. Legitimate activities, such as routine software updates or installations, may trigger this alert, so thorough context is critical. Companion detections to consider include monitoring for abnormal changes in application access or other persistence mechanisms documented under similar MITRE techniques.

