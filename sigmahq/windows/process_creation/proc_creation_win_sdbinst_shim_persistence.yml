note: |
  ### Technical Context

  This Sigma rule detects the execution of `sdbinst.exe`, which is used to install application shims in Windows environments. Adversaries use shims for persistence and privilege escalation, ultimately allowing malicious payloads to execute under the guise of legitimate applications. This behavior aligns with the MITRE ATT&CK technique for "Application Layer Protocol" (T1546.011), specifically under the tactics of persistence and privilege escalation.

  The primary telemetry sources include process creation logs (specifically Windows Event ID 4688 and Sysmon Event ID 1). The security impact could be significant, as it could indicate a successful attempt to maintain persistent access or escalate privileges within the environment. However, this detection alone does not confirm malicious intent, as legitimate installations or administrative software may also use `sdbinst.exe`.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where `sdbinst.exe` is executed. Look for command lines containing `.sdb` file paths, which indicate potential malicious behavior.

  - **Validate the origin of `sdbinst.exe`:** Confirm the file path of `sdbinst.exe` (usually located in `C:\Windows\System32\`). If it is running from an atypical directory, mark it as suspicious.

  - **Investigate the parent process:** Examine the parent process of `sdbinst.exe` (Event 4688, ParentProcessName field). A legitimate parent such as `msiexec.exe` can indicate expected behavior, while other parents (like `cmd.exe`) may suggest malicious activity.

  - **Identify high-confidence indicators:** Look for command lines that reference known malicious `.sdb` files, especially if they are not associated with legitimate applications. Any command line including paths like `iisexpressshim.sdb` should be scrutinized for context.

  - **Examine system changes:** Track any associated system changes or behaviors within the system registry that might correlate with the shim installation. Check for keys related to `AppCompat` and `Shim` to confirm the extent of potential persistence.

  ### Prioritization

  This alert carries medium severity due to the potential for privilege escalation and persistence on critical systems. The likelihood of malicious abuse is moderate, as shims can be weaponized by attackers. However, benign use by administrative scripts and legitimate applications is also common, warranting careful contextual review.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that utilize `sdbinst.exe` for permissible application shimming. Log source configuration is vital; ensure all process creation telemetry is collected comprehensively. Common evasion techniques may include renaming `sdbinst.exe` or executing it from an unintended directory. A companion detection to consider is monitoring modifications to `AppCompat` registry keys, which can indicate broader application layer manipulation.

