note: |
  ### Technical Context
  This detection rule identifies the use of `sdbinst.exe`, a Windows utility that installs application shims within the Shim Database. Adversaries may exploit application shims to maintain persistence or escalate privileges by executing malicious content when applications are launched. Such techniques allow attackers to avoid detection and gain unauthorized access to systems and applications.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003), and **Privilege Escalation** (TA0004). The specific technique being monitored is **Application Layer Protocol - Shim Database** (T1546.011). This behavior is particularly concerning as it can lead to long-term access and control over systems by concealing malicious activities within legitimate processes.

  Primary data sources for detecting this activity involve **process creation events** on Windows systems. These logs contain critical information about command-line arguments and parent processes, which can reveal the usage of `sdbinst.exe` and suspicious activities related to shims.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances of `sdbinst.exe` being executed. Focus on command lines that contain `.sdb` and check for unusual parent processes that may indicate malicious intent.
  - **Correlate with User Behavior**: Inspect user accounts that executed `sdbinst.exe`. Determine whether the users have the necessary privileges and whether their actions align with expected behavior for their role.
  - **Examine Shim Database Entries**: If applicable, investigate the contents and modifications of the Shim Database. Look for any entries that seem out of place or are associated with known malicious activities.
  - **Assess System Integrity**: Conduct a broader review of system integrity and configurations for other persistence mechanisms. Ensure that no other unauthorized modifications or installations could indicate a compromised environment.

  ### Prioritization
  Alerts generated by this detection rule should be treated with medium severity due to the potential for maintaining persistence and escalating privileges by adversaries. The likelihood of exploitation through application shims in enterprise environments underscores the importance of timely investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if there are gaps in process creation logging or if systems do not generate these logs consistently. The detection logic assumes that `sdbinst.exe` is not being executed legitimately in your environment, which may lead to false positives. For the alert to function effectively, it is essential that process creation logs are enabled and properly configured across all relevant Windows systems.

