note: |
  ### Technical Context
  This detection rule identifies instances where the Windows command `rundll32.exe` is executed without any parameters. This behavior is notable because launching `rundll32` in this manner is often associated with exploitation tools, particularly the Metasploit framework's `windows/smb/psexec` exploit module. Attackers leveraging this technique typically aim to perform lateral movement within a network, execute malicious payloads, or execute arbitrary scripts while avoiding detection.

  The relevant MITRE ATT&CK techniques that apply include:
  - **Remote Services: SMB/Windows Admin Shares (T1021.002)**: This technique is commonly used for lateral movement to execute code on remote systems.
  - **Execution: Rundll32 (T1569.002)**: The use of `rundll32.exe` itself falls under execution tactics, as it is intended for running dynamic link library (DLL) files.
  - **Command and Scripting Interpreter: Windows Command Shell (T1059.003)**: While not directly a command shell execution, it leverages command execution capabilities in Windows environments.

  The primary data sources to consider include process creation logs from Windows Event Logs, which will provide detailed information on executed commands, user context, and timestamps.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine Windows process creation logs for instances of `rundll32.exe` being executed without parameters to identify potential unauthorized uses.

  - **Analyze Command Line Arguments**: Investigate the command line of processes to confirm the absence of parameters and correlate with user activity logs to detect any unusual timings or user accounts.

  - **Cross-Reference with Lateral Movement Indicators**: Look for other indicators of lateral movement within your environment, such as SMB connections or use of known administrative tools along with the timestamps from when `rundll32.exe` was invoked.

  - **Examine User Account Activity**: Evaluate the activity of the user account that executed the command to determine if it has previously exhibited anomalous behaviors or if it typically engages in administrative tasks.

  ### Prioritization
  The severity of this alert is high given that unauthorized execution of `rundll32.exe` can signify active exploitation attempts or lateral movement, both of which pose significant security risks to the enterprise infrastructure.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of abuse if the attacker employs legitimate user credentials or if `rundll32.exe` is called with valid parameters that obscure malicious intent. The detection logic assumes that all executions of `rundll32.exe` without parameters are suspicious; however, legitimate uses may occur. Required logs for this alert to function effectively include detailed process creation logs from Windows Event Systems, correctly configured to capture command-line arguments.

