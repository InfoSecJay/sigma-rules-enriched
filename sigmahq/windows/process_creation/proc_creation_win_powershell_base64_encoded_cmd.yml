title: Suspicious Encoded PowerShell Command Line
id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
status: test
description: Detects suspicious powershell process starts with base64 encoded commands
  (e.g. Emotet)
references:
- https://app.any.run/tasks/6217d77d-3189-4db2-a957-8ab239f3e01e
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy,
  Anton Kutepov, oscd.community
date: 2018-09-03
modified: 2023-04-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'     # covers -en and -enc
  selection_cli_content:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aQBlAHgA'
    - ' aWV4I'
    - ' IAA'
    - ' IAB'
    - ' UwB'
    - ' cwB'
  selection_standalone:
    CommandLine|contains:
    - '.exe -ENCOD '
    - ' BA^J e-'         # Reversed
  filter_optional_remote_signed:
    CommandLine|contains: ' -ExecutionPolicy remotesigned '
  condition: selection_img and (all of selection_cli_* or selection_standalone) and
    not 1 of filter_optional_*
level: high
note: |
  ### Technical Context
  This rule detects the execution of suspicious PowerShell commands that are encoded in Base64, which can often indicate malicious activity such as the use of the Emotet malware. Attackers frequently leverage obfuscation techniques, including encoded PowerShell, to evade detection, execute additional payloads, or perform reconnaissance and lateral movement within a network. By monitoring PowerShell command lines during process creation, defenders can identify threats before they escalate into more significant incidents.

  The suspected threat actors behind this behavior typically aim to deliver payloads, exfiltrate data, or facilitate further compromise of the environment. This activity aligns with the following MITRE ATT&CK tactics and techniques:
  - Execution (TA0002) through:
    - Command and Scripting Interpreter: PowerShell (T1059.001).

  To effectively detect this behavior, primary data sources include process creation events from Windows systems, focusing on command line executions related to PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs to identify instances of PowerShell or pwsh.exe being invoked, paying close attention to any that feature unusual command line arguments.

  - **Analyze Command Line Arguments:** Focus on the command lines for indicators of Base64 encoding, especially those containing flags such as `-e`, `-en`, or `-enc`, and any commands starting with `JAB`, `SUVYI`, or similar encoded patterns.

  - **Cross-Reference Source IPs and User Accounts:** Verify the source of the PowerShell execution and cross-reference with logs to identify any suspicious or unauthorized user accounts that may have executed the command.

  - **Investigate Related Network Activity:** Check for any outbound connections or data exfiltration attempts linked to the execution. Look for unusual patterns or destinations that may correlate with the timing of the detected PowerShell command.

  ### Prioritization
  This alert is classified as high severity due to the high likelihood that encoded PowerShell commands indicate malicious intent, potentially leading to significant impacts such as system compromise or data exfiltration.

  ### Blind Spots and Assumptions
  Detection may be limited due to environments where PowerShell is heavily utilized for legitimate administrative tasks, leading to potential false positives. The detection logic assumes that logging configurations capture comprehensive command line arguments and process creation events. Inadequate logging settings may cause missed detections, particularly if PowerShell execution policies are not enforced or if command line logging is disabled.

