title: Suspicious Encoded PowerShell Command Line
id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
status: test
description: Detects suspicious powershell process starts with base64 encoded 
  commands (e.g. Emotet)
references:
- https://app.any.run/tasks/6217d77d-3189-4db2-a957-8ab239f3e01e
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil 
  Yugoslavskiy, Anton Kutepov, oscd.community
date: 2018-09-03
modified: 2023-04-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'     # covers -en and -enc
  selection_cli_content:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aQBlAHgA'
    - ' aWV4I'
    - ' IAA'
    - ' IAB'
    - ' UwB'
    - ' cwB'
  selection_standalone:
    CommandLine|contains:
    - '.exe -ENCOD '
    - ' BA^J e-'         # Reversed
  filter_optional_remote_signed:
    CommandLine|contains: ' -ExecutionPolicy remotesigned '
  condition: selection_img and (all of selection_cli_* or selection_standalone) 
    and not 1 of filter_optional_*
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious PowerShell commands beginning with encoded strings. Attackers often utilize Base64 encoding to obfuscate their scripts, making them difficult to analyze or detect. The likely objective is to execute payloads that can lead to remote code execution, data exfiltration, or the installation of further malware, such as Emotet.

  Relevant MITRE ATT&CK tactic: Execution (T1203) and technique: PowerShell (T1059.001). Primary telemetry sources include Windows process creation events (Event ID 4688) where PowerShell (powershell.exe or pwsh.exe) is invoked with encoded commands. If malicious, this activity can lead to system compromise or lateral movement within the environment. Importantly, this detection does NOT confirm successful intrusion on its own as it may also be triggered by legitimate encoded PowerShell scripts.

  ### Investigation Steps

  - **Review PowerShell commands executed:** Check Event ID 4688 for PowerShell executions with Base64 encoded parameters in the CommandLine field. Look for flags such as `-e` or `-enc`, which indicate obfuscation.

  - **Analyze command output and file creation:** Inspect any outputs or artifacts created as a result of these commands, particularly temporary files or network connections initiated (use Process Monitor for file handling events and Network Events logs).

  - **Compare with expected PowerShell usage:** For typical organizational use, note how PowerShell is usually executed by legitimate users with clear command paths and without obfuscation; legitimate scripts do not usually contain Base64 encoding unless they are established automation tasks.

  - **Identify malicious indicators:** Look for known malicious payload indicators such as suspicious connections to C2 servers or payload hashes that match known malware signatures (use Threat Intelligence tools or SIEM enrichment).

  - **Conduct a behavioral analysis:** Screen for any subsequent commands or processes initiated by PowerShell actions (check for Event ID 4688 immediately following the alert), as attackers often chain multiple commands for persistence and further exploitation.

  - **Examine user context for execution:** Investigate the user account associated with the PowerShell command for suspicious login patterns or unusual access rights that deviate from standard operational behavior.

  ### Prioritization

  This alert carries a high severity because it targets potentially malicious command executions in PowerShell, a common execution technique for threat actors. The likelihood of abuse is significant, as encoded commands are frequently utilized in exploits, making this behavior a primary indicator of an active intrusion attempt.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate encoded scripts by system administrators or automation tools, which could trigger false positives. A robust logging configuration must be in place to capture all necessary process creation events and script executions. Related detections include monitoring for unusual outbound network traffic patterns following such PowerShell executions, which can help correlate indicators of compromise.

