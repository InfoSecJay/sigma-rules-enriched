title: Suspicious Encoded PowerShell Command Line
id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
status: test
description: Detects suspicious powershell process starts with base64 encoded 
  commands (e.g. Emotet)
references:
- https://app.any.run/tasks/6217d77d-3189-4db2-a957-8ab239f3e01e
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil 
  Yugoslavskiy, Anton Kutepov, oscd.community
date: 2018-09-03
modified: 2023-04-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'     # covers -en and -enc
  selection_cli_content:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aQBlAHgA'
    - ' aWV4I'
    - ' IAA'
    - ' IAB'
    - ' UwB'
    - ' cwB'
  selection_standalone:
    CommandLine|contains:
    - '.exe -ENCOD '
    - ' BA^J e-'         # Reversed
  filter_optional_remote_signed:
    CommandLine|contains: ' -ExecutionPolicy remotesigned '
  condition: selection_img and (all of selection_cli_* or selection_standalone) 
    and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell processes that include suspicious Base64 encoded command lines, typically associated with various forms of malware and exploit techniques, such as Emotet. The primary objective of the attacker is often to execute payloads or commands obfuscated in a way that bypasses defensive mechanisms. The relevant MITRE ATT&CK tactic is "Execution" with the technique "PowerShell" (T1059.001).

  The primary telemetry sources for this detection include Windows Process Creation events, specifically Security Event ID 4688, and Sysmon Event ID 1 for detailed process information. If the detected behavior is malicious, it may lead to further compromises such as data exfiltration or lateral movement. However, this detection alone does not confirm that the activity is harmful; legitimate scripts may also use encoded commands without malicious intent.

  ### Investigation Steps

  - **Verify Process and Command Line Execution**: Check Security Event ID 4688 and Sysmon Event ID 1 for power shell execution. Look for the image path (e.g., `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`) and specific encoded command patterns mentioned in the rule. Legitimate usage might include `-ExecutionPolicy Bypass` without dangerous encoded strings.

  - **Inspect Parent Process Information**: Review the `ParentImage` field from Event ID 4688. Malicious activity often originates from unusual parent processes that are not typical for administrative tasks, such as cmd.exe or unusual scripts.

  - **Analyze the Command Line Arguments**: Assess the CommandLine field in Event ID 4688 for suspicious substrings like `-e`, `.exe -ENCOD `, or other entries stipulated in the detection. Malicious indicators include obfuscated commands or encoded payloads, especially in combination with PowerShell execution.

  - **Check for Network Activity**: Correlate with network logs, such as firewall logs or proxy logs, to verify if the process attempted to access known malicious domains or upload sensitive data. Look for outbound connections immediately following the Base64 encoded execution.

  - **Review User Behavior**: Identify the user account executing the command. Review user permission levels and activity patterns to establish if the action aligns with typical user behavior. Non-standard accounts, especially those with low privilege, executing Powershell commands are high-risk indicators.

  - **Confirm Indicator Creation or Exfiltration Attempts**: If applicable, ensure that relevant logs are in place and monitor file creation artifacts for any unusual file extensions or names queued for creation or transfer, indicating potential data exfiltration linked to the observed PowerShell execution.

  ### Prioritization

  This alert is high severity due to the risk of malware deployment via PowerShell, which is frequently exploited in cyberattacks. Systems that trigger this alert may be critical assets, and the likelihood of malicious behavior is significant since encoded PowerShell commands are commonly weaponized by attackers.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as obfuscated scripts or legitimate uses of Base64 encoding in corporate environments. Reliable detection depends on complete logging of PowerShell executions across all systems involved. Also, legitimate automation scripts, such as system management tasks, may inadvertently trigger this alert. Companion detections, such as monitoring for unusual network outbound traffic or suspicious file accesses, can enhance overall threat detection capabilities.

