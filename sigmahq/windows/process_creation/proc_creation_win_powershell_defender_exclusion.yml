detection:
  selection1:
    CommandLine|contains:
    - 'Add-MpPreference '
    - 'Set-MpPreference '
  selection2:
    CommandLine|contains:
    - ' -ExclusionPath '
    - ' -ExclusionExtension '
    - ' -ExclusionProcess '
    - ' -ExclusionIpAddress '
  condition: all of selection*
falsepositives:
- Possible Admin Activity
- Other Cmdlets that may use the same parameters
level: medium
note: |
  ### Technical Context
  This rule detects the use of PowerShell cmdlets intended to exclude specific files, folders, or processes from Microsoft Defender Antivirus scanning. By analyzing command-line invocations that include `Add-MpPreference` and `Set-MpPreference`, the detection aims to identify potential attempts to bypass security controls. Attackers may use this technique to facilitate the execution of malware or other unauthorized activities while reducing the likelihood of detection by security solutions.

  In enterprise environments, the likelihood of an attacker using this technique often aligns with their objective of maintaining persistence and evading security measures. It raises concerns as malicious actors may manipulate exclusion settings to protect their malicious files from scrutiny, thereby extending their foothold within the network. This behavior correlates with the MITRE ATT&CK techniques T1562.001 (Disable or Modify Security Tools), which encompasses various methods attackers may employ to undermine security measures.

  The primary data sources for this detection rule are process creation events, particularly those capturing command-line arguments executed via PowerShell. Effective telemetry from endpoint security solutions will be critical in identifying these potentially harmful commands.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine PowerShell command logs for instances of `Add-MpPreference` or `Set-MpPreference`, focusing on user context and timestamps to identify abnormalities or potential misuse.
  - **Correlate with Process Creation Events:** Use process creation logs to trace back any suspicious command-line executions involving exclusion parameters. Look for processes that were initiated around the same time as the exclusion command.
  - **Analyze User Behavior:** Investigate the user account that executed the PowerShell command. Determine whether this account has a legitimate reason for modifying antivirus preferences, and check for prior activity that may suggest an escalation of privileges or compromise.
  - **Investigate Endpoint Security Logs:** Review logs from antivirus solutions to confirm the existence of any modifications to exclusion lists, and assess the impact these changes might have on threat detection capabilities.

  ### Prioritization
  This alert should be categorized as medium severity due to its potential implications on overall security posture. The ability of an attacker to modify antivirus exclusions can significantly increase the risk of malware execution, thus it merits prompt investigation.

  ### Blind Spots and Assumptions
  One notable gap in detection may arise from legitimate administrative activities that also leverage the same PowerShell cmdlets, possibly generating false positives in environments with routine maintenance tasks. The detection logic assumes that command execution for antivirus exclusions is primarily malicious, which may not always hold true. For the alert to function correctly, comprehensive logging of PowerShell execution and process creation must be enabled on endpoints, ensuring visibility into command-line arguments used in such actions.

