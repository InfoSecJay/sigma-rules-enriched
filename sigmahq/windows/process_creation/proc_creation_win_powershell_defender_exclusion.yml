note: |
  ### Technical Context

  This rule detects PowerShell commands that modify Microsoft Defender settings to exclude specific files, folders, or processes from antivirus scanning. Malicious actors may aim to evade detection by ensuring that certain files related to their activities are not scanned, thereby facilitating lateral movement or the execution of unauthorized software.

  The relevant MITRE ATT&CK tactic is Defense Evasion, specifically Technique T1562.001: Disable or Modify Security Tools. Primary telemetry sources include Windows process creation logs (Event ID 4688) where the `CommandLine` field is monitored for specific cmdlets like `Add-MpPreference` or `Set-MpPreference`. If the detected behavior is malicious, it could result in unmonitored presence of malware or compromised assets within the environment. Importantly, this detection does NOT confirm that every exclusion is malicious, as legitimate administrative actions may also trigger it.

  ### Investigation Steps

  - **Review command-line arguments:** Verify if the `CommandLine` field contains `Add-MpPreference` or `Set-MpPreference` with parameters like `-ExclusionPath`, `-ExclusionProcess`, etc. Legitimate admin actions may include setting exclusions for needed application files or third-party tools.

  - **Inspect user context for execution:** Check the `NewProcessId` and `User` fields in Event ID 4688 logs to identify which user executed the command. Activities by authorized system accounts during maintenance windows may be benign.

  - **Identify high-risk paths:** Look for exclusion entries pointing to sensitive or common malware install locations (e.g., `C:\Users\Public`, `C:\Windows\System32`). Exclusions here could indicate evasion tactics typically used by attackers.

  - **Correlate with other security alerts:** Cross-reference this activity with any related alerts from endpoint detection solutions or previous suspicious PowerShell commands. Use companion detections to strengthen threat assessment.

  - **Assess frequency and pattern of exclusions:** Determine if there is a surge in exclusion commands over a short period, which may indicate a coordinated effort to evade detection.

  ### Prioritization

  The alert is of medium severity. While the immediate impact may be limited to modifications of antivirus settings, the likelihood of malicious use is high, as this technique is frequently weaponized to facilitate malware operations. Continuous monitoring for such behaviors is essential to mitigate risks related to undetected malicious activities.

  ### Blind Spots and Assumptions

  Detection may be evaded if the actor uses alternate methods or tools not monitored by PowerShell logging. Reliable detection depends on properly configured logging for process creation events on all endpoints. Legitimate administrative tasks may unintentionally trigger this alert, particularly during system updates or configuration changes. Strengthening coverage can be achieved through monitoring for related techniques like T1203: Exploitation for Client Execution, as they may occur in conjunction with exclusion modifications.

