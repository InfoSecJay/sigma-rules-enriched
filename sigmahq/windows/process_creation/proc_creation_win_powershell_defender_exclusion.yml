note: |
  ### Technical Context

  This rule detects the use of PowerShell cmdlets (`Add-MpPreference` and `Set-MpPreference`) that modify Microsoft Defender antivirus settings to exclude certain files, folders, or processes from scanning. The likely objective of an attacker is to reduce the effectiveness of antivirus protection, thereby facilitating the execution or persistence of malicious payloads. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion (ID T1562.001).

  The primary telemetry source for detection is the Windows Process Creation logs, specifically Security Event ID 4688. Malicious changes to defender configurations could significantly increase the risk of undetected malware on the system. However, this detection does NOT confirm that malicious activity is occurring, as legitimate administrators may also perform such configurations for valid purposes.

  ### Investigation Steps

  - **Review command line details:** Check Process Creation logs (Event ID 4688) for command line arguments containing `Add-MpPreference` or `Set-MpPreference`, specifically looking for parameters like `-ExclusionPath`, `-ExclusionExtension`, `-ExclusionProcess`, or `-ExclusionIpAddress`. Malicious commands will often be executed from unusual parent processes (e.g., scripts executed by cmd.exe).

  - **Evaluate the context of execution:** Identify the user identity associated with the PowerShell execution. Administrative users performing this operation on a standard workstation may warrant further investigation due to potential misuse.

  - **Correlate with previous exclusions:** Investigate whether similar exclusion commands have been run recently on the same host by checking for historical logs of exclusions. Frequent adjustments may indicate active evasion tactics.

  - **Cross-reference with known benign activities:** Confirm if there is prior documentation or systems management procedures related to exclusion commands performed by IT for specific applications or processes, providing insight into whether the activity could be legitimate.

  - **Identify process origins:** Check for execution paths of the PowerShell process to determine if it originated from a standard location (e.g., C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe) or a suspicious path, as malware may use PowerShell to obfuscate actions.

  ### Prioritization

  This alert has medium severity as it concerns processes with potential for significant security impact, especially on critical systems. There is a reasonable likelihood of abuse by attackers aiming to evade detection mechanisms. Such exclusion techniques are commonly weaponized, particularly in advanced persistent threat scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture all PowerShell executions or if telemetry sources are incomplete. Legitimate administrative tasks, such as system optimization or specific application configuration, may also trigger the alert. Companion detections, such as monitoring for unusual PowerShell script execution (e.g., unusual script hosts or built-in tools), can help mitigate detection gaps and provide holistic coverage against potential threats.

