detection:
  selection_img:
  - Image|endswith: '\dotnet-trace.exe'
  - OriginalFileName: 'dotnet-trace.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-- '
    - 'collect'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the utility in order to debug and trace a program.
level: medium
note: |
  ### Technical Context

  This detection identifies the execution of child processes via `dotnet-trace.exe`, specifically when command-line arguments indicate data collection activities. Adversaries may use this tool to stealthily collect telemetry from .NET applications, enhancing their understanding of system behaviors or security controls as part of their reconnaissance phase. The relevant MITRE ATT&CK tactic is Execution, with the technique being T1218: Signed Binary Proxy Execution.

  Primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details, including command-line arguments and parent-child process relationships. If used for malicious purposes, this activity could lead to data being collected for further exploitation or lateral movement. Importantly, this detection does NOT confirm malicious intent by itself; legitimate use cases, such as debugging applications, may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `dotnet-trace.exe` running. Look for command-line arguments that include `-- collect`, indicating a potential malicious intent.

  - **Validate parent process relationships**: Investigate the parent process ID of `dotnet-trace.exe`. Legitimate processes like `dotnet.exe` are expected, whereas execution from an unusual parent (e.g., `cmd.exe` or `powershell.exe`) may indicate malicious activity.

  - **Correlate with application activity**: Examine the targeted application being traced. If it’s a critical application or a known vulnerable service, this raises concern. Cross-reference with application logs, if available, for any unauthorized access attempts.

  - **Identify the execution context**: Look for the user account that initiated the process. Legitimate use is often executed by developers or support personnel, while unexpected accounts may warrant further scrutiny.

  - **Review for increased telemetry collection**: Investigate any compiled traces or telemetry data being exported or sent externally. Check for file creation events (Security Event ID 4663) and look for unusual network behavior indicating exfiltration.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on sensitive systems, particularly if `dotnet-trace.exe` is misused for information gathering. The likelihood of malicious abuse is moderate, as the tool can be weaponized but is also commonly used for legitimate debugging purposes.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of missed execution attempts if local security logging is misconfigured or if logs are deleted post-execution. Legitimate activities like debugging by development teams may also trigger this alert. Enhanced coverage could be provided by companion detections that focus on abnormal network behavior or process spawning (e.g., unusual parent-child relationships or uncommon PowerShell script executions).

