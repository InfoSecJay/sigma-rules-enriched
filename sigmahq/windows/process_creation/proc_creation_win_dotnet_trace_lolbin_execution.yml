detection:
  selection_img:
  - Image|endswith: '\dotnet-trace.exe'
  - OriginalFileName: 'dotnet-trace.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-- '
    - 'collect'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the utility in order to debug and trace a program.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the `dotnet-trace.exe` command-line tool, specifically identifying instances where it is invoked with arguments that may indicate a binary proxy execution attempt. Attackers might misuse this legitimate utility to collect data from an application, potentially executing malicious payloads under the guise of normal operations. The goal is likely to evade detection while exfiltrating data, executing commands, or performing other nefarious activities within a compromised environment.

  The relevant MITRE ATT&CK tactics and techniques include **Execution (TA0002)**, specifically **User Execution (T1203)**, and **Defense Evasion (TA0005)**, particularly through the use of **System Scripts (T1218)** for hiding malicious actions. By leveraging `dotnet-trace.exe`, attackers can slide under the radar of traditional detection tools that may not flag this commonly used development utility.

  Primary data sources that will provide critical evidence include process creation events, specifically the command line used to initiate `dotnet-trace.exe`, alongside associated file metadata from Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `dotnet-trace.exe` execution, focusing on the command-line arguments for unusual or malicious patterns, especially combinations with `-- collect`.
  - **Examine Parent Process Relationships**: Identify the parent processes that initiated `dotnet-trace.exe`, as this can provide clues about whether it was launched from a legitimate source or as part of a malicious sequence.
  - **Correlate with Known Good Usage**: Use knowledge of legitimate use cases for `dotnet-trace.exe` within your environment and compare suspicious executions against these, to distinguish potential misuse from benign activity.
  - **Explore Related File Activity**: Investigate any associated file modifications or network connections that occur concurrently with `dotnet-trace.exe` executions to uncover further indications of malicious behavior.

  ### Prioritization
  This alert should be treated with medium to high priority as it indicates potential misuse of a legitimate tool to execute code, which could lead to significant security incidents if unchecked. The likelihood of exploitation is heightened in environments where development tools are frequently used.

  ### Blind Spots and Assumptions
  One blind spot in this detection logic is the potential for legitimate administrative use cases to generate alerts, as developers and system administrators may frequently use `dotnet-trace.exe` for debugging purposes. The detection logic assumes that any execution of this tool with the flags captured is malicious, which may not always be the case. For effective alerting, it is necessary to ensure that process creation logs are enabled and that command-line arguments are captured in detail, as these logs are critical for accurate detection.

