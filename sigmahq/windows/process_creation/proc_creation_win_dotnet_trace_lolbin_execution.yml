title: Binary Proxy Execution Via Dotnet-Trace.EXE
id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
status: test
description: Detects commandline arguments for executing a child process via 
  dotnet-trace.exe
references:
- https://twitter.com/bohops/status/1740022869198037480
author: Jimmy Bayne (@bohops)
date: 2024-01-02
tags:
- attack.execution
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet-trace.exe'
  - OriginalFileName: 'dotnet-trace.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-- '
    - 'collect'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the utility in order to debug and trace a program.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `dotnet-trace.exe` with specific command-line arguments indicative of synthetic data collection or tracing of application processes. The likely attacker objective is to execute a child process for the purpose of collecting sensitive application data or manipulating the functionality of a target application surreptitiously. This behavior correlates with the MITRE ATT&CK tactic of Execution (TA0002) and technique of Command-Line Interface (T1202).

  The primary telemetry source includes process creation logs, particularly Security Event ID 4688 on Windows environments. If malicious, this behavior may lead to unauthorized access or data exfiltration from applications. Importantly, this detection does NOT confirm that a malicious activity is occurring in isolation; the command's context and outcome must be considered.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances of `dotnet-trace.exe`. Analyze the account used to run it; unfamiliar or unauthorized accounts may indicate malicious intent.

  - **Examine command-line arguments:** Look for `-- collect` in the CommandLine field to assess if tracing was initiated. Legitimate tracing requires proper context; if seen in unusual circumstances, it may be suspicious.

  - **Identify parent process:** Correlate the detected execution with its parent process using process tree logs. Investigate if a known or legitimate process initiated it; unexpected parent processes could indicate malicious usage.

  - **Assess timing of execution:** Compare the execution time with recent changes or incidents in the environment. If `dotnet-trace.exe` was run during an incident, it could signify an attacker’s attempt to gather information.

  - **Monitor for known malicious indicators:** Look for high-confidence patterns in command-line arguments, including suspicious flags that would not typically be associated with normal application tracing.

  - **Determine legitimate use cases:** Document any recent application debugging or tracing operations by IT or development teams. Cross-reference these with timestamps of detected events to validate benign activity.

  ### Prioritization

  This alert is of medium severity due to the potential risk of data exposure or unauthorized alterations to applications, particularly when executed on critical systems. The behavior could be leveraged by adversaries to collect sensitive information, making it a concern for security monitoring.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if logging is disabled for certain accounts. Legitimate use of `dotnet-trace.exe` by developers or support teams for debugging can trigger this alert. A companion detection to consider is monitoring processes that invoke `dotnet-trace.exe`, as this adds a layer of context to flag potentially harmful usage.

