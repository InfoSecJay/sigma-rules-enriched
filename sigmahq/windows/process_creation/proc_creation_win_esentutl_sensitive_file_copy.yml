logsource:
  category: process_creation
  product: windows
detection:
  selection_esent_img:
  - Image|endswith: '\esentutl.exe'
  - OriginalFileName: '\esentutl.exe'
  selection_esent_cli:
    CommandLine|contains|windash:
    - 'vss'
    - ' /m '
    - ' /y '
  selection_susp_paths:
    CommandLine|contains:
    - '\config\RegBack\sam'
    - '\config\RegBack\security'
    - '\config\RegBack\system'
    - '\config\sam'
    - '\config\security'
    - '\config\system '                # space needed to avoid false positives with \config\systemprofile\
    - '\repair\sam'
    - '\repair\security'
    - '\repair\system'
    - '\windows\ntds\ntds.dit'
  condition: all of selection_esent_* or selection_susp_paths
falsepositives:
- Copying sensitive files for legitimate use (eg. backup) or forensic 
  investigation by legitimate incident responder or forensic investigator.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `esentutl.exe` command-line interface, particularly when it is used to access and copy sensitive system files, such as the Security Accounts Manager (SAM) or NTDS.dit. The objective of an attacker triggering this behavior is to extract credential data that can be used for lateral movement or privilege escalation within a targeted environment. This detection relates to MITRE ATT&CK tactics and techniques, specifically Credential Access (T1003) and the sub-techniques T1003.002 (Credential Dumping: Security Account Manager (SAM)) and T1003.003 (Credential Dumping: NTDS).

  The primary telemetry source is Windows process creation logs, specifically focused on Event ID 4688 or Sysmon Event ID 1, capturing detailed information about process execution. If left unmitigated, malicious activity associated with this detection can lead to significant security breaches, including unauthorized access to critical resources. However, this detection does NOT confirm malicious intent on its own, as it may also be triggered by legitimate backup procedures or forensic activities.

  ### Investigation Steps

  - **Check process execution details**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 logs for instances of `esentutl.exe` being initiated. Pay attention to access times, user context, and command-line arguments used during execution.

  - **Analyze command-line arguments**: Confirm if the command-line parameters include typical indicators of malicious use, such as `vss`, ` /m `, or paths related to critical credential storage (`\config\sam`, `\windows\ntds\ntds.dit`). These parameters often correlate with credential dumping attempts.

  - **Evaluate user intent**: Identify the user account executing the command. Check if it belongs to a known administrative account or a service account that should not be running this type of command under normal operations.

  - **Confirm logging configurations**: Ensure Windows process creation logging is configured correctly to capture all pertinent details, including parent process IDs, to identify any unusual parent-child process relationships.

  - **Identify baseline normal behavior**: Review legitimate cases of `esentutl.exe` execution within your environment, such as during routine backups or maintenance, and compare against the alerting instances to distinguish between benign and malicious behavior.

  - **Correlate with other detections**: Utilize companion detections related to credential access or lateral movement (e.g., T1075 for Pass-the-Hash) to verify if the activity is part of a larger attack pattern, complementing your investigation.

  ### Prioritization

  This alert is considered high severity due to the critical nature of the systems involved. The likelihood of malicious abuse is elevated, especially given that the behavior aligns with known techniques for credential dumping. This activity is often weaponized by attackers during post-exploitation phases.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that do not fully log command-line arguments or if users have legitimate reasons to access sensitive files, such as system audits. The presence of administrative users executing similar commands for legitimate purposes may complicate the investigation. Implementing additional logging, such as PowerShell command logs, could strengthen coverage and provide context. Additionally, companion detections for unusual PowerShell usage or failed authentication events can provide a more complete picture of the activity surrounding the alert.

