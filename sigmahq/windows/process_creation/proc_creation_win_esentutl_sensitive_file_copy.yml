logsource:
  category: process_creation
  product: windows
detection:
  selection_esent_img:
  - Image|endswith: '\esentutl.exe'
  - OriginalFileName: '\esentutl.exe'
  selection_esent_cli:
    CommandLine|contains|windash:
    - 'vss'
    - ' /m '
    - ' /y '
  selection_susp_paths:
    CommandLine|contains:
    - '\config\RegBack\sam'
    - '\config\RegBack\security'
    - '\config\RegBack\system'
    - '\config\sam'
    - '\config\security'
    - '\config\system '                # space needed to avoid false positives with \config\systemprofile\
    - '\repair\sam'
    - '\repair\security'
    - '\repair\system'
    - '\windows\ntds\ntds.dit'
  condition: all of selection_esent_* or selection_susp_paths
falsepositives:
- Copying sensitive files for legitimate use (eg. backup) or forensic 
  investigation by legitimate incident responder or forensic investigator.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_esentutl_sensitive_file_copy/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of `esentutl.exe`, a Windows utility, to copy sensitive files, specifically credential data such as the SAM and NTDS.dit files. The likely attacker objective is to extract credentials and analyze them for unauthorized access, fitting into the MITRE ATT&CK framework under the tactic of Credential Access (TA0006) and the technique of Credential Dumping, specifically OS Credential Dumping via Windows tools (T1003.002) and Active Directory Credential Dumping (T1003.003). The primary telemetry source for detection is Windows Process Creation logs, specifically Event ID 4688, which captures the command-line execution of the esentutl.exe tool.

  If executed with malicious intent, this behavior could lead to unauthorized access to sensitive user accounts or domain administrative privileges, resulting in significant security risks. However, this detection does NOT confirm that malicious activity has occurred on its own, as legitimate use could include backup operations or authorized forensic investigations.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Security Event ID 4688 for instances of `esentutl.exe`. Look for command lines containing parameters for volume shadow services or paths indicating sensitive file access, consistent with suspicious activity.

  - **Identify Malicious Command-Line Arguments:** Confirm command lines containing specific paths like `\config\RegBack\sam` or `\windows\ntds\ntds.dit`, and flags like `vss` or `/m`. If these are present without an authorized context, it indicates a high- confidence malicious indicator.

  - **Investigate User Account Activity:** Check the user account associated with the execution of esentutl.exe. If the account is non-administrative and does not have a known business justification for access, it may warrant further scrutiny.

  - **Validate Legitimate Activity:** Compare against known legitimate activity patterns, such as scheduled backups or forensic tasks performed by IT personnel. Ensure such tasks have appropriate documentation and approval.

  - **Audit for Previous Events:** Review Windows Event Log for prior actions leading up to the execution of `esentutl.exe`. Indicators such as a series of failed authentication attempts before the execution may provide insight into potential reconnaissance or exploitation activity.

  ### Prioritization

  This alert is designated high severity due to the potential impact on sensitive systems containing credential data. The likelihood of malicious abuse is high, especially in targeted attacks, as this behavior aligns with common techniques used by threat actors to extract authentication data. Given the nature of credential dumping, this behavior is commonly weaponized in attacks attempting to gain persistent access to environments.

  ### Blind Spots and Assumptions

  There are limitations to detecting credential extraction, as legitimate administrator actions could also trigger this alert. Effective monitoring depends on consistent logging configurations, including the capture of command line parameters. Additionally, activities such as routine backups could result in false positives. A related detection that strengthens coverage is monitoring for unusual access patterns to the SAM and NTDS.dit files outside of approved maintenance windows.

