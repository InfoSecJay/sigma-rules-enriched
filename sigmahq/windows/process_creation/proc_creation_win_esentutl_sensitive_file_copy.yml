logsource:
  category: process_creation
  product: windows
detection:
  selection_esent_img:
  - Image|endswith: '\esentutl.exe'
  - OriginalFileName: '\esentutl.exe'
  selection_esent_cli:
    CommandLine|contains|windash:
    - 'vss'
    - ' /m '
    - ' /y '
  selection_susp_paths:
    CommandLine|contains:
    - '\config\RegBack\sam'
    - '\config\RegBack\security'
    - '\config\RegBack\system'
    - '\config\sam'
    - '\config\security'
    - '\config\system '                # space needed to avoid false positives with \config\systemprofile\
    - '\repair\sam'
    - '\repair\security'
    - '\repair\system'
    - '\windows\ntds\ntds.dit'
  condition: all of selection_esent_* or selection_susp_paths
falsepositives:
- Copying sensitive files for legitimate use (eg. backup) or forensic investigation
  by legitimate incident responder or forensic investigator.
level: high
note: |
  ### Technical Context
  This rule detects potential malicious activities involving the copying of sensitive files that may contain credential data, specifically through the invocation of `esentutl.exe`. This tool is often leveraged by attackers to manipulate data from the Windows Volume Shadow Copy Service (VSS), allowing them to access and copy sensitive files like NTDS.dit, SAM, and security database files. These files can expose usernames and hashed passwords, representing a critical security risk if exfiltrated by an adversary.

  The threat scenario typically involves an attacker with intention to harvest credentials, enabling lateral movement or escalation of privileges within the network. Likely objectives may include accessing additional user accounts or establishing persistent access points. This activity maps to several MITRE ATT&CK techniques, including **Credential Dumping (T1003)**, which encompasses the harvesting of authentication credentials, and specifically **T1003.002 (LSASS Memory)** and **T1003.003 (NTDS.dit)**. The primary data sources indicating this behavior are process creation logs that detail command line arguments, alerting on any suspicious invocations of `esentutl.exe` alongside notable file paths.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for instances of `esentutl.exe`. Filter by command line arguments that may indicate misuse, particularly those containing references to VSS or sensitive file paths.

  - **Analyze Command Line Arguments:** Investigate the command line inputs associated with `esentutl.exe` calls, specifically looking for terms like “/m” or references to directories like `\windows\ntds\` or `\config\`, which are indicative of attempts to access credential data.

  - **Inspect Backup and Shadow Copy Usage:** Check for legitimate use cases of `esentutl.exe`, including backups. Validate if the copying was performed by authorized personnel and review organizational policies regarding sensitive file access and copying.

  - **Correlate with User Actions:** Cross-reference the time of detection with user and system activities to identify any potential rogue actions. Consider usage patterns to understand if the operations align with typical administrative tasks.

  ### Prioritization
  This alert is classified as high severity due to the critical nature of the potentially accessed files, which can lead to significant security breaches if compromised. The likelihood of exploitation increases if an attacker has already gained a foothold within the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging is not configured to capture all process creation events comprehensively. There exists an assumption that the command line invocations of `esentutl.exe` are embedded within legitimate administrative actions, which can result in false positives for legitimate use. Additionally, the detection relies on proper logging and monitoring of the Windows process creation events; without these logs enabled, the alert will not trigger appropriately.

