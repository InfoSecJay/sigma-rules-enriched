title: Suspicious File Download From IP Via Wget.EXE - Paths
id: 40aa399c-7b02-4715-8e5f-73572b493f33
status: test
description: Detects potentially suspicious file downloads directly from IP 
  addresses and stored in suspicious locations using Wget.exe
references:
- https://www.gnu.org/software/wget/manual/wget.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-23
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wget.exe'
  - OriginalFileName: 'wget.exe'
  selection_ip:
    CommandLine|re: '://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
  selection_http:
    CommandLine|contains: 'http'
  selection_flag:
  - CommandLine|re: '\s-O\s'
  - CommandLine|contains: '--output-document'
  selection_paths:
  - CommandLine|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\Help\'
    - ':\Windows\Temp\'
    - '\Temporary Internet'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious file downloads executed via `wget.exe` from IP addresses directly in the command line, specifically targeting files stored in potentially malicious locations on Windows systems. The likely objective of an attacker using this method is to download malicious payloads or data from a controlled server, facilitating further compromise or data exfiltration. The relevant MITRE ATT&CK tactic for this behavior is **Execution**, and the technique is **User Execution** (T1203).

  The primary telemetry sources for this detection are Windows process creation events, particularly focusing on Security Event ID 4688 and potentially Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access, data breaches, or exploitation of systems. Importantly, this detection does NOT confirm that a file is malicious or that it was executed; it only indicates a suspicious download attempt.

  ### Investigation Steps

  - **Verify process execution: ** Check for `wget.exe` execution logs using Security Event ID 4688 or Sysmon Event ID 1. Capture fields such as `CommandLine` to confirm the presence of file download commands from IP addresses.

  - **Analyze CommandLine parameters: ** Review the `CommandLine` field for patterns matching `://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}` which indicates the use of an IP address as part of the URL. Malicious indicators would include a lack of a host name or use of known malicious actor IPs.

  - **Examine storage locations: ** Validate the output path in `CommandLine` using event logs. Check for downloads to suspicious directories like `Temp` or `Users\Public`. If files are downloaded to these locations, it heavily indicates malicious intent.

  - **Assess legitimate usage: ** Record normal `wget.exe` usage within the environment, such as downloading from known internal repositories. This helps contextualize alerts; legitimate commands should typically have HTTP references to trusted domains, not raw IPs.

  - **Identify additional context: ** Inspect related logs (e.g., file creation events or modifications in the identified directories) for unusual activity following the download. For example, look for files created in `C:\Users\<username>\Downloads` that correlate with the timing of the suspicious download command.

  - **Correlate recent network activity: ** Query firewall or proxy logs for any outbound connections to the detected IP address around the time of the `wget.exe` execution. A high-confidence malicious indicator would be unexpected outbound connections to an IP linked to known threats.

  ### Prioritization

  The alert is assessed as **high severity** due to its potential impact on critical systems, particularly if the downloaded files are malicious. Attackers frequently use this technique to download payloads or tools, making it a commonly weaponized behavior in cyber operations. The likelihood of exploitation is significant, especially if the affected machine has access to sensitive or critical data.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate usage of `wget` in non-malicious contexts or by the use of similar tools that do not raise alerts. Reliable detection requires proper logging from process creation sources and may exclude scenarios where users legitimately download files from trusted sources. False positives may arise from scripts or automation that use `wget` to fetch updates or data. A related detection to consider is monitoring for unusual command-line arguments used with other download tools such as `curl` or PowerShell download commands, enhancing the coverage of potential exfiltration or execution tactics.

