title: Suspicious File Download From IP Via Wget.EXE - Paths
id: 40aa399c-7b02-4715-8e5f-73572b493f33
status: test
description: Detects potentially suspicious file downloads directly from IP addresses
  and stored in suspicious locations using Wget.exe
references:
- https://www.gnu.org/software/wget/manual/wget.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-23
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wget.exe'
  - OriginalFileName: 'wget.exe'
  selection_ip:
    CommandLine|re: '://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
  selection_http:
    CommandLine|contains: 'http'
  selection_flag:
  - CommandLine|re: '\s-O\s'
  - CommandLine|contains: '--output-document'
  selection_paths:
  - CommandLine|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\Help\'
    - ':\Windows\Temp\'
    - '\Temporary Internet'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the downloading of files using `wget.exe` from IP addresses, particularly when the downloaded files are saved in directories that are considered suspicious or common for temporary storage and user-generated content. Attackers may utilize `wget.exe` to retrieve malicious files from external IPs as part of an initial access phase, data exfiltration, or other malicious activities. The likely objective behind such downloads can include installing malware, stealing proprietary data, or furthering reconnaissance efforts.

  This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic of **Execution** (TA0002) and the technique **User Execution** (T1203). The execution of `wget.exe` in such suspicious contexts suggests that an attacker may be leveraging a legitimate tool for malicious purposes.

  The primary data sources relevant for detecting this behavior include process creation logs that capture command line arguments. Additional supporting evidence may be gathered from host-based logs, such as file system changes in directories typically associated with temporary or downloaded files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events where `wget.exe` is being executed. Pay special attention to the command line arguments for any indications of suspicious external IP addresses or URLs.

  - **Analyze Download Locations**: Investigate the directories specified in the command line arguments. Look for unusual file types in suspicious folders like `\Temp\`, `\PerfLogs\`, and user profile directories which may indicate unwanted behavior.

  - **Cross-reference IPs**: Check the IP address used in the download for known malicious activity or reputation. Utilize threat intelligence feeds to determine if the IP is associated with common bad actors or suspicious domains.

  - **Monitor Subsequent Activity**: Follow up on the files that were downloaded to see if they were executed, moved, or interacted with in a way that suggests malicious intent. Correlate this with any other suspicious behaviors like attempts to connect to external networks or unauthorized data access.

  ### Prioritization
  The alert's high severity in an enterprise environment is due to the potential for unauthorized data retrieval and the increasing use of such tools for malicious purposes. The likelihood that a legitimate tool is abused for harmful activities calls for immediate investigation and response.

  ### Blind Spots and Assumptions
  The detection logic may not cover all variations of `wget` usage, such as different parameters or alternative file download mechanisms. It assumes that all downloads from IP addresses are suspicious, overlooking potentially legitimate downloads. Required logs include comprehensive process creation events, and any exclusions or incomplete logging configurations may hinder the detection capability of this rule.

