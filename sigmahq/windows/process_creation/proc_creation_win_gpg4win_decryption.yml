detection:
  selection_metadata:
  - Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  - Description: 'GnuPG’s OpenPGP tool'
  selection_cli:
    CommandLine|contains|all:
    - ' -d '
    - 'passphrase'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of Gpg4win, specifically the `gpg.exe` or `gpg2.exe` processes, to decrypt files in a Windows environment. Gpg4win is an encryption tool that can be leveraged for legitimate purposes; however, it is also found in various threat actor tactics, particularly for post-compromise data exfiltration or to bypass security mechanisms to access secured files and systems. Attackers may utilize this tool as a means to decrypt sensitive files, often as part of broader data theft or malicious payload delivery operations.

  The relevant MITRE ATT&CK tactics include **Initial Access (TA0001)** and **Execution (TA0002)**, particularly focusing on techniques such as **User Execution (T1203)** and **Command-Line Interface (T1059)**. By monitoring the execution of Gpg4win for decryption activities, defenders can identify potentially malicious use cases, especially if they are associated with other recognized threats like Zloader or BatLoader, both of which have incorporated Gpg4win in their operational tactics.

  Primary data sources for this detection include process creation events, which can provide insights into the command-line arguments used and whether sensitive decryption activities are taking place.

  ### Investigation Steps
  - **Review Process Creation Events**: Check recent process creation logs for `gpg.exe` and `gpg2.exe`. Pay attention to their command-line arguments and execution context to understand the usage patterns.
  - **Analyze Command-Line Arguments**: Focus on finding instances where the command line contains `-d` and `passphrase`. Determine if the decrypted file path is sensitive or unexpected in relation to standard operations.
  - **Cross-reference User Behavior**: Investigate the user account associated with the Gpg4win execution. Look for unusual activity patterns or prior warnings regarding potential compromise.
  - **Gather Additional Logs**: Collect associated logs such as file access logs or application logs that pertain to the file being decrypted. This context can provide further clues about potential data exfiltration efforts or unauthorized access.

  ### Prioritization
  The alert is considered of medium severity due to the potential for data compromise through legitimate tools being used for nefarious purposes. In enterprise environments, the presence of Gpg4win activity should not be ignored, as it may indicate an ongoing threat actor operation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if Gpg4win is executed with obfuscated command line arguments or via other indirect methods, such as through scripts. The detection logic assumes that the command line will explicitly contain both the `-d` and `passphrase` parameters; however, attackers may utilize less obvious techniques to achieve similar results. Additionally, this rule relies on the presence of thorough process creation logs, which must be enabled on the endpoint to function effectively.

