detection:
  selection_metadata:
  - Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  - Description: 'GnuPG’s OpenPGP tool'
  selection_cli:
    CommandLine|contains|all:
    - ' -d '
    - 'passphrase'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of Gpg4win's gpg.exe or gpg2.exe with command-line arguments indicating a file decryption operation using a passphrase. The likely objective of an attacker using this technique is to decrypt confidential or sensitive files that may have been previously encrypted to evade detection by security solutions. This activity is related to the MITRE ATT&CK tactic of Execution and specifically the technique of Command-Line Interface (T1059.005). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, capturing critical details about process activities. If this behavior is malicious, it can lead to unauthorized access or exfiltration of sensitive information. Notably, this detection does not confirm that the decryption attempt is malicious on its own, as legitimate users may also perform file decryption for valid purposes.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for entries showing the execution of gpg.exe or gpg2.exe. Confirm that the command line includes ' -d ' and 'passphrase'.

  - **Identify the file paths:** Inspect the command line arguments for specific paths or filenames being decrypted. Malicious activities may involve sensitive file types (e.g., .docx, .xlsx) typically associated with personal or financial data.

  - **Analyze the user context:** Determine the user and their domain context under which Gpg4win is executed. If executed under elevated privileges or by a user with no known usage patterns of GnuPG, this could be indicative of malicious intent.

  - **Look for external influences:** Check for additional logs or indicators from other security products (e.g., EDR solutions) that might show prior stager activity leading to this decryption (e.g., suspicious downloads or scripts).

  - **Validate legitimate usage scenarios:** Review historical usage of Gpg4win by the same user or script context. Document how often and for what purposes the tool is used legitimately to understand normal behavior patterns.

  - **Examine for follow-on malicious activity:** Investigate any subsequent processes spawned after the decryption to identify if they relate to file exfiltration or unauthorized access to sensitive data.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive data if decrypted maliciously, particularly in administrative or critical systems. The likelihood of abuse is significant, as attackers often encrypt and decrypt files to manipulate data exfiltration and persistence mechanisms. This behavior is weaponized in prevalent malware campaigns.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate decryption activities may trigger this alert, complicating accurate classification. The rule relies fundamentally on logs generated by Sysmon or Windows Event Logging, which must be correctly configured for effective detection. Legitimate activities like IT personnel decrypting files for authorized purposes can also generate false positives. Related detections to strengthen coverage include monitoring for unusual file access patterns post-decryption or additional suspicious command-line patterns from the same user/context.

