title: Suspicious Use of PsLogList
id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
status: test
description: Detects usage of the PsLogList utility to dump event log in order to
  extract admin accounts and perform account discovery or delete events logs
references:
- https://research.nccgroup.com/2021/01/12/abusing-cloud-services-to-fly-under-the-radar/
- https://www.cybereason.com/blog/deadringer-exposing-chinese-threat-actors-targeting-major-telcos
- https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Sysinternals/PsLogList
- https://twitter.com/EricaZelic/status/1614075109827874817
author: Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-18
modified: 2024-03-05
tags:
- attack.discovery
- attack.t1087
- attack.t1087.001
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'psloglist.exe'
  - Image|endswith:
    - '\psloglist.exe'
    - '\psloglist64.exe'
  selection_cli_eventlog:
    CommandLine|contains:
    - ' security'
    - ' application'
    - ' system'
  selection_cli_flags:
    CommandLine|contains|windash:
    - ' -d'
    - ' -x'
    - ' -s'
    - ' -c'         # Clear event log after displaying
    - ' -g'         # Export an event log as an evt file.
  condition: all of selection_*
falsepositives:
- Another tool that uses the command line switches of PsLogList
- Legitimate use of PsLogList by an administrator
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the PsLogList utility, which is part of the Sysinternals suite, commonly used for dumping Windows event logs. Attackers may utilize PsLogList to discover administrative accounts by extracting logs, which aids in reconnaissance or enables them to delete important logs to cover their tracks. This behavior is often seen in various threat scenarios, especially those involving privilege escalation or lateral movement within an organization's network.

  The primary MITRE ATT&CK tactics relevant to this rule are **Discovery** (TA0007) and specific techniques such as **Account Discovery** (T1087) and its sub-techniques, including **Domain Account Discovery** (T1087.001) and **Local Account Discovery** (T1087.002). Detecting PsLogList usage not only helps in identifying potential attackers who are gathering information about administrative accounts but also raises awareness of actions taken to eliminate evidence of previous activities.

  Key telemetry sources that will provide relevant evidence for this detection include process creation logs that document the execution of PsLogList, alongside command-line arguments used during invocation. Analyzing these sources will be crucial in understanding the context and intent behind the command's execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `psloglist.exe` or `psloglist64.exe` and note the user and process context. Look for abnormal execution patterns, unusual parent processes, or execution from unexpected directories.

  - **Analyze Command-Line Arguments**: Focus on command-line arguments that contain terms like "security," "application," or "system." Pay attention to flags such as `-c`, which indicates log clearing, or `-d`, which could suggest potential log downloads. Document any finds that may indicate malicious intent.

  - **Correlate with User Behavior**: Identify the user accounts executing PsLogList. Determine if these users have legitimate reasons to query logs or if their activity falls outside normal operational behavior, suggesting possible indicator of compromise.

  - **Inspect Related Events**: During your investigation, correlate findings with other suspicious events—such as sudden spikes in privilege escalations, unusual logon patterns, or the presence of other reconnaissance-related activities (like LDAP queries)—to establish a broader context of potential threats.

  ### Prioritization
  Given the potential for this activity to indicate an attacker gathering information for further exploitation or trying to hide their tracks, it carries a medium severity level. Organizations should prioritize investigating alerts generated by this rule, especially in sensitive environments where administrative accounts are targeted.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, primarily due to legitimate administrative uses of PsLogList that may generate false positives. The detection logic assumes that executions of PsLogList with specific command-line switches are linked to malicious behavior, which may not always be accurate if the tool is used for standard maintenance operations. Additionally, for this alert to function effectively, comprehensive process creation logs must be enabled and correctly configured, as any configurations or limitations in logging could result in crucial evidence being overlooked.

