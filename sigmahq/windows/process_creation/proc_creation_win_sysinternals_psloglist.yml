logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'psloglist.exe'
  - Image|endswith:
    - '\psloglist.exe'
    - '\psloglist64.exe'
  selection_cli_eventlog:
    CommandLine|contains:
    - ' security'
    - ' application'
    - ' system'
  selection_cli_flags:
    CommandLine|contains|windash:
    - ' -d'
    - ' -x'
    - ' -s'
    - ' -c'         # Clear event log after displaying
    - ' -g'         # Export an event log as an evt file.
  condition: all of selection_*
falsepositives:
- Another tool that uses the command line switches of PsLogList
- Legitimate use of PsLogList by an administrator
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the PsLogList tool, particularly when used to dump event logs or manipulate log data by leveraging specific command-line arguments. The likely attacker objective is to perform reconnaissance by listing log entries, extracting administrator accounts, and potentially covering their tracks by clearing event logs. This behavior aligns with the MITRE ATT&CK techniques T1087 (Account Discovery) and T1087.001 (Local Account Discovery).

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688. If malicious, this behavior can lead to a significant security impact, as it may indicate an intruder is attempting to gain insights into user activity and privilege levels within the environment. However, this detection does NOT confirm an active compromise or malicious intent by itself, as legitimate administrative use of PsLogList can also trigger this alert.

  ---

  ### Investigation Steps

  - **Check for legitimate use cases:**
    Review the context of the alert against normal administrative activities. PsLogList may be used legitimately by IT staff for troubleshooting or diagnostics. Analyze logs for Event IDs 4688 or Sysmon Event ID 1 where PsLogList was run by known admin accounts during maintenance windows.

  - **Identify unusual command line parameters:**
    Inspect the command line for the use of flags like ‘-c’ (clear event log) and ‘-g’ (export logs) in Event ID 4688 fields. Document instances where these flags are used by non-administrative accounts or outside of normal operational patterns.

  - **Correlate with other log sources:**
    Check for related events such as log clearing (Event ID 1102) or changes in user privileges post PsLogList usage. These indicators may suggest a malicious actor is attempting to obfuscate their activity.

  - **Assess user behavior:**
    Analyze the account(s) that executed PsLogList. Determine if the user has unusual access patterns or if their behavior aligns with potential insider threat activities. Verify the timing of execution against other suspicious activities on the system.

  - **Review network traffic for exfiltration:**
    If logs indicate logs were exported (flag -g), check for network activity that reveals transfers of exported files outside the organization. Monitor for unusual connections or data loss prevention (DLP) alerts.

  - **Validate system integrity:**
    Assess if there is any compromised credential usage or unauthorized admin account creation through Windows Event Logs (Event ID 4720, 4722). Cross-reference any notifications from the identity and access management systems regarding user access anomalies.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential risk it poses by giving an attacker insights into administrative accounts and allowing for stealthy log manipulation. While administrative tools can be used legitimately, the likelihood of malicious intent increases significantly if combined with suspicious command-line arguments or abnormal timing.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations as threat actors could use alternate tools that replica similar functionalities as PsLogList without triggering this rule, or they may obfuscate their command lines. Ensure that log collection mechanisms for Event ID 4688 and other relevant security events are correctly configured to maximize detection reliability. Legitimate maintenance from IT staff could generate similar alerts, so context is vital. A companion detection to consider would be monitoring for unauthorized changes to administrator accounts (T1098), which would enhance detection coverage around malicious account discovery activities.

