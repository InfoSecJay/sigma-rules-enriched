logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'psloglist.exe'
  - Image|endswith:
    - '\psloglist.exe'
    - '\psloglist64.exe'
  selection_cli_eventlog:
    CommandLine|contains:
    - ' security'
    - ' application'
    - ' system'
  selection_cli_flags:
    CommandLine|contains|windash:
    - ' -d'
    - ' -x'
    - ' -s'
    - ' -c'         # Clear event log after displaying
    - ' -g'         # Export an event log as an evt file.
  condition: all of selection_*
falsepositives:
- Another tool that uses the command line switches of PsLogList
- Legitimate use of PsLogList by an administrator
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the PsLogList utility to extract Windows event logs, which could indicate an adversary's attempt to discover administrative accounts or manipulate logs to cover their tracks. The likely attacker objective is to perform reconnaissance on account settings or delete evidence of malicious activity, fitting into the MITRE ATT&CK tactic of **Discovery** (TA0007) and technique **Account Discovery** (T1087.001) as well as **Credential Dumping** (T1003).

  The primary telemetry for this detection comes from process creation events, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, focusing on the command line parameters used with the PsLogList executable. The security impact of this behavior is significant, as it can lead to unauthorized access or manipulation of critical system components. However, this detection alone does not confirm malicious intent, as legitimate administrators may also use PsLogList for valid purposes.

  ### Investigation Steps

  - **Examine process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `psloglist.exe` or `psloglist64.exe`. Check if the command line includes parameters specific to log querying (such as `-d`, `-x`) or log deletion (`-c`). A legitimate command might include `-d` without the use of deletion flags.

  - **Identify anomalous accounts:** Validate the user account associated with the PsLogList execution. Look for accounts that are not typical administrative accounts (e.g., service accounts or user accounts with elevated privileges). Malicious activity may originate from unusual user accounts.

  - **Correlate with Windows Event Logs:** Examine the corresponding Windows Event Logs (Event IDs 4624 for logon events or 4648 for explicit credentials being used). This can help indicate if the account used with PsLogList has unauthorized access rights that align with privileged actions.

  - **Review command line inputs:** Identify any additional arguments supplied to the PsLogList command that may indicate suspicion, such as multiple targeted logs (security, application, system) being accessed in a single execution. Be cautious of any commands issuing `-c` or `-g`, as these indicate potential deletion or export activities.

  - **Assess surrounding activity:** Check for other recent process creations or command executions that could indicate the use of tools often associated with log clearing or credential harvesting methods, such as Mimikatz or similar utilities.

  - **Monitor known legitimate use:** Document any known legitimate use cases for PsLogList within your organization, such as structured operational monitoring tasks performed by specific administrators. Contrast these operations against the current alert to validate legitimacy.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if an attacker successfully exploits elevated privileges and manipulates logs. The likelihood of malicious abuse is moderate, as PsLogList is often weaponized for log evasion techniques among sophisticated threat actors. Given the sensitivity around account and log monitoring, timely investigation is essential.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of alternative log management tools that can issue similar commands without being flagged. It is essential that logging for command execution is comprehensive and that all relevant powershell and command shell activities are captured to ensure accurate detection. Additionally, legitimate administrative tasks, particularly with account maintenance, may trigger this alert; thus, context surrounding alerts is crucial for validation. A related detection to reinforce coverage would be monitoring for log deletion activities through Security Event ID 1102 (Audit log clear) to capture suspicious clearing of logs indiscriminately.

