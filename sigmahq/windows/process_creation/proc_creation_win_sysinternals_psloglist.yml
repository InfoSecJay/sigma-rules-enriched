title: Suspicious Use of PsLogList
id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
status: test
description: Detects usage of the PsLogList utility to dump event log in order 
  to extract admin accounts and perform account discovery or delete events logs
references:
- https://research.nccgroup.com/2021/01/12/abusing-cloud-services-to-fly-under-the-radar/
- https://www.cybereason.com/blog/deadringer-exposing-chinese-threat-actors-targeting-major-telcos
- https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Sysinternals/PsLogList
- https://twitter.com/EricaZelic/status/1614075109827874817
author: Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-18
modified: 2026-06-29
tags:
- attack.discovery
- attack.t1087
- attack.t1087.001
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'psloglist.exe'
  - Image|endswith:
    - '\psloglist.exe'
    - '\psloglist64.exe'
    - '\psloglist64a.exe'
  selection_cli_eventlog:
    CommandLine|contains:
    - ' security'
    - ' application'
    - ' system'
  selection_cli_flags:
    CommandLine|contains|windash:
    - ' -d'
    - ' -x'
    - ' -s'
    - ' -c'         # Clear event log after displaying
    - ' -g'         # Export an event log as an evt file.
  condition: all of selection_*
falsepositives:
- Another tool that uses the command line switches of PsLogList
- Legitimate use of PsLogList by an administrator
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the PsLogList utility with specific command line arguments that indicate potential misuse. The behavior observed includes attempts to dump Windows event logs, typically to gather information on administrative accounts or to clean up traces of malicious activity. The likely attacker objective could involve account enumeration, log deletion, or preparing for further exploit activities. This detection relates to the MITRE ATT&CK technique "Account Discovery" (T1087) and its sub-techniques for Windows systems.

  Primary telemetry sources include process creation logs from Windows Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity can severely impact detection capabilities by removing critical evidence of other malicious actions. Importantly, this detection does NOT confirm that activity is malicious on its own, as PsLogList can also be legitimately used by administrators for troubleshooting.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances where PsLogList (`psloglist.exe`, `psloglist64.exe`, or `psloglist64a.exe`) has been executed. Focus on the UserID and the account under which the command was run to identify potentially unauthorized access.

  - **Analyze command-line arguments:** Evaluate the command line used with PsLogList. Look for suspicious flags such as `-c` (to clear logs) or `-g` (to export logs) in the CommandLine field. This can indicate intent to manipulate event data.

  - **Identify legitimate usage patterns:** Cross-reference the user performing the activity against known administrative tasks and ensure there is a documented need for the activity. Legitimate use should be documented or aligned with Windows administrative practices.

  - **Correlate with event log activity:** Examine Windows Event Logs (Security and Application logs) around the timestamps of PsLogList executions for any unauthorized access, especially focusing on Event IDs related to logon events (4624 for successful logons).

  - **Assess impacted systems:** Determine the criticality of the affected asset by reviewing its role in the environment (e.g., Domain Controller, application server). This context can help prioritize the investigation.

  - **Look for exfiltration indicators:** If PsLogList is exporting event logs, validate whether the output file is taken outside the organization, such as checking the presence of unexpected file creation events (Security Event ID 4663 with object type “File”).

  ### Prioritization

  The alert severity is medium due to the potentially harmful nature of logging enumeration and log deletion, which can mask further attacks. The affected system's role significantly influences its impact, especially if an administrator account is compromised. While this behavior may not be consistently weaponized, it is associated with reconnaissance and cleaning after malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary uses alternate or custom tools that achieve similar objectives without triggering this alert. Furthermore, without appropriate logging configurations and retention, critical log entries may be missed. Legitimate administrative actions, especially during routine maintenance tasks, could also trigger this alert. A related detection to enhance coverage could involve monitoring for unusual processes or command line usages across similar administrative tools used in Windows environments.

