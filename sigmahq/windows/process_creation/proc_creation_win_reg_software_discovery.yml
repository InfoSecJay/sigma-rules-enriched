detection:
  selection:
    Image|endswith: '\reg.exe'        # Example: reg query "HKEY_LOCAL_MACHINE\Software\Microsoft\Internet Explorer" /v svcVersion
    CommandLine|contains|all:
    - 'query'
    - '\software\'
    - '/v'
    - 'svcversion'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential enumeration of installed software on Windows systems by monitoring the process creation of the `reg.exe` command. Attackers may attempt to discover software for several reasons, such as identifying vulnerable applications, assessing security measures, or gathering information to facilitate further exploitation. This technique, which falls under the category of software discovery, can indicate reconnaissance activities by malicious actors seeking to assess the environment.

  In the MITRE ATT&CK framework, this detection is associated with the "Software Discovery" technique (T1518). Attackers leverage registry queries to list installed software, often targeting specific software versions that may be outdated or contain vulnerabilities. This activity typically occurs before the attacker moves forward with exploitation stages.

  Primary data sources for this detection include process creation logs, which capture details about command execution, including the command line arguments used. Monitoring these events can provide valuable insight into potentially malicious activities aimed at gathering sensitive operational information.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for instances where `reg.exe` has been executed with parameters indicative of software querying, particularly those matching the specified command line criteria.

  - **Analyze Command Line Arguments**: Focus on the command line used during the execution of `reg.exe` to confirm that it includes `query`, is targeting `\software\`, and references `/v svcversion`, which strongly suggests enumeration of installed software.

  - **Correlate with Asset Inventory**: Compare any identified queries against the known inventory of installed software to identify discrepancies that may indicate unauthorized reconnaissance or enumeration.

  - **Check User Context and Timing**: Investigate the user context under which the `reg.exe` command was executed and the timing of the activity. Look for any unusual patterns or execution outside regular administrative hours.

  ### Prioritization
  This alert has medium severity in an enterprise environment due to the potential impact of software enumeration on security posture. Understanding installed software versions can lead to targeted exploitation of vulnerabilities, elevating the stakes if not addressed promptly.

  ### Blind Spots and Assumptions
  The detection logic assumes that the use of `reg.exe` with specific command line arguments correlates directly to malicious software discovery activities. However, legitimate administrative tasks may result in similar process creations, potentially leading to false positives. Required logs include detailed process creation events from the Windows operating system, and adequate logging configurations must be established to capture such activities effectively. There may also be gaps in detecting similar enumeration attempts made through different methods or tools outside the scope of monitored processes.

