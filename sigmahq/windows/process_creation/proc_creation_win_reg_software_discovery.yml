note: |
  ### Technical Context

  This Sigma rule detects the use of the Windows Registry tool `reg.exe` to query for specific software information, particularly targeting service versions by searching `HKEY_LOCAL_MACHINE\Software\`. The likely attacker objective is to enumerate installed software and their versions to identify potential vulnerabilities or security measures that could be exploited. This activity aligns with the MITRE ATT&CK technique T1518 - Software Discovery.

  Primary telemetry sources include process creation events, specifically focusing on Windows Security Event ID 4688 or Sysmon Event ID 1 for capturing processExecution data. If successful, this detection indicates malicious software reconnaissance that could lead to further exploitation. However, this alert does not confirm a malicious compromise on its own, as similar queries may be executed legitimately by administrative personnel.

  ### Investigation Steps

  - **Review process creation events**: Check for Security Event ID 4688 or Sysmon Event ID 1 for `reg.exe` usage with CommandLine parameters indicating software enumeration (`query`, `\software\`, `/v`, `svcversion`).

  - **Assess command history**: Investigate the command history of accounts that executed `reg.exe` to determine if the query corresponds to legitimate administrative actions, particularly looking for expected software versions.

  - **Correlate with user activity**: Verify the user account that executed the command – legitimate admins might have contextual reasons to query for software versions, while suspicious user accounts may indicate malicious intent.

  - **Identify high-confidence malicious indicators**: Look for unusual CommandLine arguments within the context of `reg.exe`, particularly those querying multiple sensitive software keys, indicating potential reconnaissance or exploitation readiness.

  - **Monitor for lateral movement**: Cross-reference logs for additional enumeration tools or behaviors, such as other process creations involving `wmic` or other query commands, which could suggest an expanded reconnaissance phase.

  - **Examine system role**: Consider the criticality of the affected system; endpoints with sensitive roles or those with elevated privileges should be scrutinized more closely for indicators of compromise.

  ### Prioritization

  The alert is medium severity, as it may indicate early reconnaissance efforts by adversaries looking to exploit weak software versions. The likelihood of malicious intent is based on the context of execution; while software queries can be benign, the specific command usage suggests a focused attack methodology.

  ### Blind Spots and Assumptions

  Detection may miss variations in values or alternative tools that serve similar purposes, such as PowerShell cmdlets or custom scripts that perform software discovery. Reliable coverage requires monitoring of all relevant logs like Sysmon alongside standard Windows auditing. Legitimate administrative activities can trigger this alert, so analysis must consider context. A related detection for monitoring `wmic` execution could strengthen overall visibility into this tactic.

