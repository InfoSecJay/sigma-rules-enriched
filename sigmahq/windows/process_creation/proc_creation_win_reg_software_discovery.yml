note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the Windows Registry tool `reg.exe`, specifically when it performs software enumeration by querying for version information using specific command-line arguments. The likely objective of this behavior is to identify installed software, including any security measures or vulnerabilities, potentially paving the way for further exploitation. This activity falls under the MITRE ATT&CK tactics of **Discovery** (TA0007), and the technique is known as **Software Discovery** (T1518). The primary telemetry source for this detection is Windows Process Creation logs, specifically Security Event ID 4688. If malicious, this could signify an initial reconnaissance step by an adversary within an environment. Importantly, this detection does NOT confirm that software enumeration is being conducted for malicious purposes on its own.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs for instances where `Image` ends with `\reg.exe`. Check the `CommandLine` field for any entries containing `query`, `\software\`, `/v`, and `svcversion`.

  - **Identify benign usage:** Look for operational processes, such as legitimate software audits or administrative maintenance tasks, typically scheduled or performed by IT personnel. Compare timestamps of detected events against known change windows in IT tickets.

  - **Review user context:** Analyze the associated `SubjectUserName` field for the process creation event. Trace user behavior—specifically check if the user account typically performs administrative tasks or if it’s an anomaly.

  - **Look for high-confidence malicious indicators:** Investigate if the command includes references to sensitive software or security products (e.g., antivirus versions). Document any patterns that match previous intrusion attempts or known vulnerabilities being targeted.

  - **Examine system output:** Investigate if the `reg.exe` command produces any logs or returns data that could indicate knowledge of the environment, such as installed software version numbers that leverage known vulnerabilities.

  - **Validate asset criticality:** Assess if the affected host is categorized as critical infrastructure or part of a sensitive environment. Higher severity may warrant immediate escalation.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential for reconnaissance behavior that could lead to more significant attacks. While software discovery is a common initial step for adversaries, its occurrence can also stem from routine administrative activities, necessitating careful evaluation.

  ---

  ### Blind Spots and Assumptions

  This detection may not capture all legitimate administrative activities that could trigger similar registry queries, leading to potential false positives. It assumes that process creation logging is properly configured and that `reg.exe` usage aligns with patterns of typical administrative behavior. A related detection may include registry key access logs, which could provide additional insights into the context and motivations behind software enumeration.

