title: Cscript/Wscript Uncommon Script Extension Execution
id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
status: test
description: Detects Wscript/Cscript executing a file with an uncommon (i.e. 
  non-script) extension
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-15
modified: 2023-06-19
tags:
- attack.execution
- attack.t1059.005
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName:
    - 'wscript.exe'
    - 'cscript.exe'
  - Image|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_extension:
    CommandLine|contains:
            # Note: add additional potential suspicious extension
            # We could specify the "//E:" flag to avoid typos by admin. But since that's prone to blind spots via the creation of assoc it's better not to include it
    - '.csv'
    - '.dat'
    - '.doc'
    - '.gif'
    - '.jpeg'
    - '.jpg'
    - '.png'
    - '.ppt'
    - '.txt'
    - '.xls'
    - '.xml'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of scripts using Wscript or Cscript with uncommon file extensions (e.g., .csv, .doc, .jpeg) that are typically not associated with script execution. Attackers may utilize this method to obfuscate their scripts as benign file types to evade detection. The relevant MITRE ATT&CK tactics include Execution (TA0002), under techniques T1059.005 (JavaScript) and T1059.007 (Visual Basic). The primary telemetry sources required are Windows process creation logs, specifically Event ID 4688, which records process creation events, detailing command lines used. If this behavior is malicious, the potential impact includes unauthorized access, data exfiltration, or system compromise. It is important to note that this detection does not confirm malicious intent on its own; further investigation is required to establish the context of execution.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for processes where the parent process is Wscript.exe or Cscript.exe. Look for command lines that include unusual file extensions mentioned in the Sigma rule.

  - **Identify common benign uses:** Determine if the interpreted files (e.g., those with .txt or .xls extensions) are known business-related documents. Review their creation logs (e.g., via File System Event ID 4663) to confirm they originate from legitimate sources and user accounts.

  - **Analyze command line parameters:** Evaluate the complete command line fields (CommandLine) for possible Indicators of Compromise, such as obfuscated script paths or suspicious execution flags. Malicious indicators may include argument manipulations or use of multiple uncommon file types.

  - **Check process parentage:** Validate the process hierarchy by looking for child processes spawned by Wscript or Cscript. Use Sysmon Event ID 1 to confirm if any subsequent actions stem from the execution of these uncommon files, indicating possible malicious intent.

  - **Correlate with other security alerts:** Look for overlapping threats or alerts, such as those related to file integrity monitoring (e.g., modified document types) or detection of malware signatures in related execution files, as this may point towards an active attack vector.

  ### Prioritization

  The severity of this alert is high, given that it may indicate an attempt to execute malicious scripts disguised under common file extensions. The likelihood of malicious abuse is significant, as attackers often leverage scripting engines to deliver payloads. This behavior is commonly observed in various cyberattack scenarios, making it imperative to address promptly.

  ### Blind Spots and Assumptions

  This detection may not identify all adversarial techniques, especially if the attacker leverages legitimate tools to execute their scripts. Specific logging configurations are necessary to ensure reliable detection, including ensuring that WMI and script processing events are captured. Legitimate activities, such as automated reporting scripts leveraging Wscript or Cscript, may trigger this alert. A related detection to consider is monitoring for unusual script execution by user accounts with administrative privileges, which can further enhance visibility into potential threats.

