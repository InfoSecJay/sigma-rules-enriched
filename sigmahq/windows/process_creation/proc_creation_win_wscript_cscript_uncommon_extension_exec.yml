title: Cscript/Wscript Uncommon Script Extension Execution
id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
status: test
description: Detects Wscript/Cscript executing a file with an uncommon (i.e. non-script)
  extension
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-15
modified: 2023-06-19
tags:
- attack.execution
- attack.t1059.005
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName:
    - 'wscript.exe'
    - 'cscript.exe'
  - Image|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_extension:
    CommandLine|contains:
            # Note: add additional potential suspicious extension
            # We could specify the "//E:" flag to avoid typos by admin. But since that's prone to blind spots via the creation of assoc it's better not to include it
    - '.csv'
    - '.dat'
    - '.doc'
    - '.gif'
    - '.jpeg'
    - '.jpg'
    - '.png'
    - '.ppt'
    - '.txt'
    - '.xls'
    - '.xml'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of scripts using Wscript or Cscript with uncommon file extensions. Typically, these Windows Script Host (WSH) executables are employed to launch files with extensions associated with scripting languages (e.g., .vbs or .js). However, attackers may exploit these tools to execute malicious payloads disguised as benign files, leveraging file types that do not typically invoke suspicion, such as .txt or .doc files.

  The potential threat scenario involves an attacker attempting to execute a malicious script that could facilitate data exfiltration, lateral movement, or other malicious activities while remaining under the radar of traditional security measures. The relevant MITRE ATT&CK techniques include:
  - **Execution: Command and Scripting Interpreter - Windows Command Shell (T1059.005)**
  - **Execution: Command and Scripting Interpreter - Windows Powershell (T1059.007)**

  The primary data source for this detection is the Windows process creation logs, which record the execution of processes and the corresponding command-line arguments. These logs will provide the best insights into potentially malicious use of scripting engines for executing uncommon file types.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for entries related to Wscript or Cscript execution, paying particular attention to the command-line arguments and any unusual file extensions used.
  - **Analyze Suspicious Extensions:** Focus on files executed with uncommon extensions (e.g., .csv, .doc), noting any unusual patterns or behaviors associated with their execution.
  - **Check Parent Processes:** Investigate the parent processes that initiated the Wscript or Cscript execution to discern whether the activity is part of a larger automated attack or malicious process chain.
  - **Correlate with Other Alerts:** Look for other security alerts (e.g., from EDR, SIEM) that may indicate suspicious activity in conjunction with the identified script execution, such as unusual network traffic or system changes.

  ### Prioritization
  Due to the potential for significant damage caused by undetected malicious scripts using atypical file extensions, this alert is classified as high severity. The risk arises from both the likelihood of exploitation and the potential impact on enterprise data integrity and availability.

  ### Blind Spots and Assumptions
  This detection may miss scripts launched manually by users or legitimate administrative scripts with uncommon extensions that could be mistakenly flagged as malicious. The logic assumes comprehensive logging is enabled and configured to capture all Wscript and Cscript execution details. Additionally, specific logs related to process creation must be retained with an adequate retention period to provide context for investigators.

