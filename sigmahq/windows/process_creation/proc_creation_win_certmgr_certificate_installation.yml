note: |
  ### Technical Context
  This detection rule identifies the execution of `CertMgr.exe` with the `/add` flag, which is used to install a new root certificate on Windows systems. Attackers may leverage this capability to add rogue root certificates, allowing them to intercept encrypted communications or perform man-in-the-middle attacks by effectively establishing trust with malicious web servers. By installing their own root certificate, adversaries can bypass security warnings that browsers or operating systems typically issue when visiting suspicious domains.

  The primary MITRE ATT&CK tactics involved in this scenario are **Defense Evasion** (TA0005) and the technique **Install Root Certificate** (T1553.004). This technique is commonly employed to facilitate other malicious activities, enabling threat actors to maintain persistence and operational capabilities in compromised environments. Understanding such activities is crucial for enhancing the security posture of an enterprise environment.

  The best evidence sources for detecting this behavior include **process creation logs**, which capture command-line activities and executable invocations. Monitoring these logs helps security analysts identify potentially malicious configurations that could compromise system integrity.

  ### Investigation Steps
  - **Review Process Creation Events**: Check for instances of `CertMgr.exe` executing with the `/add` flag in the command line. Pay attention to the context by examining the user account under which this occurred to determine if it's a legitimate request or potentially malicious behavior.

  - **Analyze Certificate Store Changes**: Inspect the Windows certificate stores to identify any newly added root certificates. Compare these against known trusted certificates within your organization to highlight any unauthorized or unrecognized entries.

  - **Monitor Network Connections**: Investigate outbound network connections that may be initiated by the system after a new certificate installation. Look for connections to unusual or untrusted domains that might suggest a compromised environment.

  - **Assess User Behavior**: Examine the account that triggered the root certificate installation. Validate the user's role to determine if this action aligns with typical behavior. Engagement with Help Desk or IT staff may be necessary if the installation appears legitimate.

  ### Prioritization
  The alert is classified as medium severity due to the significant implications of unauthorized root certificate installations, which can lead to extensive network exploitation. Given the right conditions, the likelihood of this action being used by attackers to establish trust with malicious sites warrants prompt investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if attackers utilize alternative methods to install root certificates that do not involve `CertMgr.exe`, such as using PowerShell commands. The detection logic assumes that the command-line parameters will be formatted predictably, and it does not account for variations that may arise in obfuscated or scripted environments. Additionally, the alert relies on having complete and unaltered process creation logs; any log retention issues or misconfigurations may impact detection efficacy. Lastly, the presence of false positives from IT help desk activities must be monitored and differentiated through contextual analysis.

