note: |
  ### Technical Context

  This Sigma rule detects the execution of `certmgr.exe` with the `/add` flag, indicating the installation of a new certificate on a Windows system. Attackers may leverage this behavior to install a root certificate that enables them to intercept or manipulate secure communications without raising warnings from users. This activity aligns with the MITRE ATT&CK technique for Defense Evasion: **T1553.004 - Manage Certificates**.

  The primary telemetry source for this detection is process creation logs, specifically looking for the invocation of `certmgr.exe` with distinct command line arguments. If this behavior is malicious, it could allow an adversary to perform man-in-the-middle attacks. Importantly, this detection does NOT confirm that the certificate is malicious on its own; further analysis is required to assess the certificate's trustworthiness and its source.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID **4688** or Sysmon Event ID **1** corresponding to `certmgr.exe` being executed. Look specifically for the command line containing `/add` and `root`.

  - **Analyze the certificate being added:** Retrieve logs detailing the added certificate, possibly found in related event logs or through certificate stores. Focus on the issuer details and ensure it isn't from a known malicious source.

  - **Evaluate expected behavior:** Confirm if the `/add` flag was executed as part of a scheduled task or Group Policy Object (GPO) push, which may indicate benign IT operations rather than malicious activity.

  - **Look for simultaneous network activity:** Use network logs (e.g., Firewalls or IDS logs) to identify any outbound connections to unusual or untrusted domains shortly after the certificate installation. High confidence indicators include connections to known command-and-control servers.

  - **Check for unusual permissions:** Identify if the execution of `certmgr.exe` occurred by processes running under unusual accounts, such as SYSTEM or Administrator, which could suggest evasion techniques.

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised systems, which can lead to undetected man-in-the-middle attacks. The likelihood of malicious use is moderate; while not common, installing root certificates is a known tactic used by advanced adversaries during ongoing operations.

  ### Blind Spots and Assumptions

  Evasion techniques include legitimate usage of `certmgr.exe` by IT staff, which may lead to false positives; thus, careful consideration of context is essential. Reliable detection requires proper configuration of process creation logging. There is a risk of benign activities, such as corporate CA installations, triggering this alert. A related detection that enhances coverage is monitoring for unusual network connections post certificate installation, as it adds context to the potential exploitation of the newly installed certificate.

