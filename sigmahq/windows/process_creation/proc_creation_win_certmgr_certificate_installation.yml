note: |
  ### Technical Context

  This rule detects the execution of CertMgr.exe with the "/add" flag, specifically targeting the installation of a new root certificate. Adversaries aim to install malicious root certificates to facilitate man-in-the-middle attacks and enable stealthy communication with compromised servers by avoiding security warnings. This behavior is relevant to the MITRE ATT&CK technique **T1553.004 - Code Signing Certificates**.

  The primary telemetry source for analysis is process creation logs, specifically Windows Event ID 4688, which captures process instantiation details including the command line arguments used. If malicious, the installation of a rogue root certificate could allow an attacker to intercept and decrypt secure communications. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative tasks may also invoke CertMgr.exe to install trusted corporate certificates.

  ### Investigation Steps

  - **Verify process details: ** Check the process creation events for CertMgr.exe: Review Windows Event ID 4688 for executions where CommandLine contains "/add" and "root". Note the time, user, and execution context.

  - **Analyze command line arguments: ** Confirm the full command line executed with CertMgr.exe for presence of unusual parameters. The command should typically be in the format "CertMgr.exe /add [filename] /s /r localMachine root". Anything atypical may warrant further scrutiny.

  - **Check for recently added certificates: ** Review Event Viewer under Applications and Services > Microsoft > Windows > CertificateServicesClient > Operational for Event ID 1001 or 1004, which log new certificate installations. Ensure that these certificates correspond to expected corporate CAs.

  - **Assess system role: ** Determine if the affected host is critical (e.g., domain controllers, web servers). Unusual certificate installations on these machines are more concerning and warrant heightened investigation.

  - **Look for related processes: ** Identify if other suspicious processes were launched around the same time as CertMgr.exe. Cross-reference with Event ID 4688 to spot any patterns or potential lateral movements.

  ### Prioritization

  This alert is medium priority due to the potential high impact of a root certificate being installed on critical systems, particularly in roles that handle sensitive information or perform secure communications. The likelihood of malicious abuse is significant, as attackers commonly use this technique to enhance their operational security.

  ### Blind Spots and Assumptions

  This rule may not detect evasion techniques where attackers use alternate methods to install certificates or where a legitimate administrator performs necessary updates. Accurate detection relies on correctly configured logging for process creation and certificate operations; absence of relevant logs may lead to missed events. Legitimate corporate activities, such as routine certificate updates by IT staff, can trigger this alert. Companion detections that strengthen monitoring include alerts for changes to system certificate stores or additional use of PowerShell commands for certificate management operations.

