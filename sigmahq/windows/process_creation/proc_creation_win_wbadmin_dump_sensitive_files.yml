title: Sensitive File Dump Via Wbadmin.EXE
id: 8b93a509-1cb8-42e1-97aa-ee24224cdc15
status: test
description: |
  Detects the dump of highly sensitive files such as "NTDS.DIT" and "SECURITY" hive.
  Attackers can leverage the "wbadmin" utility in order to dump sensitive files that might contain credential or sensitive information.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/2cc01b01132b5c304027a658c698ae09dd6a92bf/yml/OSBinaries/Wbadmin.yml
- https://lolbas-project.github.io/lolbas/Binaries/Wbadmin/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-start-recovery
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-start-backup
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2024-05-10
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection_backup:
    CommandLine|contains:
    - 'start'
    - 'backup'
  selection_path:
    CommandLine|contains:
    - '\config\SAM'
    - '\config\SECURITY'
    - '\config\SYSTEM'
    - '\Windows\NTDS\NTDS.dit'
  condition: all of selection_*
falsepositives:
- Legitimate backup operation by authorized administrators. Matches must be investigated
  and allowed on a case by case basis.
level: high
note: |
  ### Technical Context
  This detection rule identifies the unauthorized use of the `wbadmin.exe` utility, which can be exploited by attackers to dump sensitive files such as `NTDS.DIT` and the `SECURITY` hive. These files may contain critical credentials and sensitive information integral to the security posture of an organization. The threat scenario involves an attacker who has gained access to an environment and aims to extract sensitive data for further exploitation or lateral movement within a network.

  The relevant MITRE ATT&CK techniques for this detection include Credential Access (T1003.003) specifically through credential dumping, as attackers leveraging `wbadmin` may attempt to collect hashed passwords and other sensitive kerberos tickets. The primary data sources for this detection will be process creation logs from Windows systems, which will record instances when `wbadmin.exe` is executed along with its command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs to identify instances of `wbadmin.exe` being executed. Focus on the command line for suspicious parameters related to backups or sensitive file paths.

  - **Analyze Command Line Arguments:** Check for instances where `wbadmin.exe` is run with commands such as `start` or `backup`, particularly looking for paths that reference `\config\SAM`, `\config\SECURITY`, or `\Windows\NTDS\NTDS.dit`.

  - **Cross-Reference with User Activity Logs:** Investigate the account that executed `wbadmin.exe`. Ensure that the execution aligns with legitimate administrative activities and cross-reference with user access records to confirm authorization.

  - **Correlate with Network Activity:** Analyze any subsequent network behavior that may indicate data exfiltration or further exploitation attempts after the dump operation. Look for unusual outgoing connections or data transfer patterns.

  ### Prioritization
  This alert necessitates a high priority within an enterprise context due to the potential exposure of sensitive information, which could lead to significant security incidents such as credential theft and lateral movement by a malicious actor.

  ### Blind Spots and Assumptions
  There may be gaps in detection if `wbadmin.exe` is executed in legitimate contexts, such as routine backups by authorized administrators, which can lead to false positives. The detection logic assumes that any `wbadmin` invocation with specific parameters indicates potential malicious activity, which may not always hold true in well-monitored environments. Additionally, for effective alerting, it is crucial that process creation logs are configured correctly and collected continuously across all relevant endpoints.

