logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection_backup:
    CommandLine|contains:
    - 'start'
    - 'backup'
  selection_path:
    CommandLine|contains:
    - '\config\SAM'
    - '\config\SECURITY'
    - '\config\SYSTEM'
    - '\Windows\NTDS\NTDS.dit'
  condition: all of selection_*
falsepositives:
- Legitimate backup operation by authorized administrators. Matches must be 
