level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `wbadmin.exe` utility to dump sensitive files such as the NTDS.DIT database and the SECURITY hive, which may contain sensitive information including credentials. The likely attacker objective is to extract critical credential information for post-exploitation or lateral movement within an organization. This activity corresponds to the MITRE ATT&CK tactic of Credential Access (TA0006) and technique T1003.003 (Credential Dumping: Windows Credentials).

  The primary telemetry sources involve process creation logs on Windows system endpoints, specifically Security Event ID 4688 and Sysmon Event ID 1. If the behavior is malicious, the impact can be severe, as it may lead to credential theft and further compromise of user accounts or services. However, this detection does NOT confirm that the files have been successfully accessed or exfiltrated; it merely indicates an attempt to dump sensitive information.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `wbadmin.exe` execution. Look for unusual execution times or processes initiated by non-administrative users.

  - **Examine command line arguments**: Investigate the command line associated with `wbadmin.exe`. Legitimate usage typically does not include arguments for the NTDS.DIT or SYSTEM hive. Focus on logs containing keywords like `\config\SECURITY`, `\Windows\NTDS\NTDS.dit`, or similar.

  - **Identify suspicious user accounts**: Analyze the user account running the command against established organizational roles. If a non-admin account ran the command, this raises suspicion. Legitimate backups are typically performed by authorized admin accounts from known management workstations.

  - **Inspect for concurrent backup operations**: Verify if legitimate backup jobs are scheduled within the organization around the alert time frame. Use backup execution logs to confirm whether the process aligns with normal administrative operations.

  - **Track potential file creation or access**: Review file system access logs for changes or modifications to sensitive directories such as `C:\Windows\NTDS` or `C:\Windows\System32\config`. Look for file creation or access events immediately following the detection.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive credential leakage, which could lead to unauthorized access across the organization. The likelihood of malicious abuse is significant, particularly given that `wbadmin.exe` is often weaponized by attackers during credential dumping operations. Instances of this behavior are uncommon in routine operations, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where `wbadmin.exe` is frequently used for legitimate backups, potentially leading to false positives. Reliable detection requires proper logging configurations, including enabling Security and Sysmon logs. Additionally, user-initiated backups or system integrity checks could generate similar alerts. A related detection to strengthen coverage might be the monitoring of suspicious PowerShell commands, which can also be involved in credential dumping activities.

