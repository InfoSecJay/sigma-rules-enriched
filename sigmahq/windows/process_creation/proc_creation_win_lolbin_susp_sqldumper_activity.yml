logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sqldumper.exe'
    CommandLine|contains:
    - '0x0110'
    - '0x01100:40'
  condition: selection
falsepositives:
- Legitimate MSSQL Server actions
level: medium
note: |
  ### Technical Context
  This rule detects the unauthorized usage of the legitimate `sqldumper.exe` binary, which is often employed by attackers to create memory dumps of processes running on Windows systems. The presence of the command line argument patterns such as `0x0110` or `0x01100:40` suggests that the binary may be used for malicious purposes, potentially indicating attempts to extract credentials or sensitive information from running processes. Attackers may leverage this technique to gain access to user credentials or other sensitive data that is present in the memory of targeted applications.

  The relevant MITRE ATT&CK tactics and techniques involved here include:
  - **Credential Access (TA0006)**
    - **T1003.001: Credential Dumping: LSASS Memory**: This technique involves accessing and extracting credentials held in memory, particularly from the Local Security Authority Subsystem Service (LSASS).

  Primary data sources that will provide vital evidence for this detection include process creation events that log the execution details of `sqldumper.exe`, including the command line arguments and any parent processes that invoked it.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for any instances of `sqldumper.exe` being executed. Pay particular attention to the command line arguments being used in conjunction with the executable for any anomalies.

  - **Analyze Parent Process Information**: Investigate the parent process of any detected `sqldumper.exe` execution to identify the context in which it was launched. Look for any suspicious or uncommon parent processes that may indicate malware activity.

  - **Correlate with Credential Access Indicators**: Cross-reference the detected usage of `sqldumper.exe` with other telemetry sources, such as Event Viewer logs, to check for known indicators of credential dumping or other behaviors that align with the techniques listed in MITRE ATT&CK.

  - **Assess User Account Behavior**: Look at the accounts executing `sqldumper.exe` for signs of compromise or unusual behavior within the context of their permissions and activity patterns to determine if they are anomalous in nature.

  ### Prioritization
  The alert should be prioritized as medium severity due to the potential impact of unauthorized process memory dumping, which could lead to significant data breaches involving sensitive credentials. Given the legitimate nature of the executable, the likelihood of false positives necessitates careful review before escalating.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage related to variations of the `sqldumper.exe` usage that do not include the specified command line arguments. Additionally, it assumes that the logs from process creation events are fully captured and accessible; improper logging configurations may inhibit detection efficacy. As the technique relies on process creation logs, missing logs from specific endpoints or lack of monitoring on critical systems may hinder the ability to detect this behavior effectively.

