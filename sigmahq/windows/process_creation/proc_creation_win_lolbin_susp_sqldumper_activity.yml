  ---

  ### Technical Context

  This Sigma rule detects the execution of process dumping via the Windows executable `sqldumper.exe`, typically used by legitimate applications but also favored by attackers for credential access. The likely objective of the attacker is to capture sensitive information from a process memory, which can include clear-text credentials, by exploiting the process dumping capability. This activity maps to the MITRE ATT&CK framework under the tactic **Credential Access** and technique **Process Dumping (T1003.001)**.

  The primary telemetry source for this detection is process creation events in Windows, specifically focusing on the image name and command line parameters involving `sqldumper.exe`. If malicious, the security impact is significant, as dumped credentials can give an attacker unauthorized access to sensitive systems and data. However, this detection does not confirm that the extracted data was used maliciously—it only indicates that a dump operation was potentially initiated.

  ---

  ### Investigation Steps

  - **Assess process creation details:** Review Security Event ID 4688 and/or Sysmon Event ID 1 logs for `sqldumper.exe`. Check the **CommandLine** field for indicators like `0x0110` or `0x01100:40`, which should raise suspicion.

  - **Examine parent process:** Identify the parent process of `sqldumper.exe` in the process creation logs. A legitimate process like `sqlservr.exe` is expected, whereas unusual parent processes (e.g., `powershell.exe` or `cmd.exe`) may indicate malicious activity.

  - **Validate intended usage:** Cross-reference the timestamp of the alert against MSSQL Server logs. If `sqldumper.exe` is called during legitimate operational maintenance or troubleshooting, it may be benign.

  - **Search for associated artifacts:** Look for additional artifacts, such as file creation events involving `.dmp` files, which can be indicated by Event ID 4663 or associated filesystem logs. Legitimate dumps often involve specific system directories.

  - **Monitor for subsequent activities:** Investigate for any follow-on actions post-dumping, such as unusual outbound connections or attempts to access sensitive resources, which can indicate the exfiltration of dumped credentials.

  ---

  ### Prioritization

  This alert is rated medium severity due to the critical nature of the systems potentially being affected (e.g., database servers containing sensitive data) and the likelihood of the abuse of `sqldumper.exe` in attacks. While the behavior itself can be legitimate, it can also serve as a prelude to credential theft, making it a candidate for further scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection can be bypassed if the `sqldumper.exe` process is renamed or if attackers leverage other process dumping techniques or binaries. Reliable detection requires proper monitoring of process creation logs and ensuring that logging is enabled for both the security and Sysmon events. Legitimate maintenance processes can trigger this alert, including SQL Server maintenance tasks. A related detection rule that enhances coverage is targeted monitoring for abnormal command line arguments across various executable names.

