title: Suspicious Download from Office Domain
id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
status: test
description: Detects suspicious ways to download files from Microsoft domains that
  are used to store attachments in Emails or OneNote documents
references:
- https://twitter.com/an0n_r0/status/1474698356635193346?s=12
- https://twitter.com/mrd0x/status/1475085452784844803?s=12
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-27
modified: 2022-08-02
tags:
- attack.command-and-control
- attack.resource-development
- attack.t1105
- attack.t1608
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
  - Image|endswith:
    - '\curl.exe'
    - '\wget.exe'
  - CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'curl '
    - 'wget '
    - 'Start-BitsTransfer'
    - '.DownloadFile('
    - '.DownloadString('
  selection_domains:
    CommandLine|contains:
    - 'https://attachment.outlook.live.net/owa/'
    - 'https://onenoteonlinesync.onenote.com/onenoteonlinesync/'
  condition: all of selection_*
falsepositives:
- Scripts or tools that download attachments from these domains (OneNote, Outlook
  365)
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify potentially malicious download activities from Microsoft domains associated with email attachments and OneNote documents. The primary goal of this rule is to detect unauthorized or unusual file downloads that may indicate malicious intent, such as data exfiltration or command-and-control (C2) activities using legitimate Microsoft services. For example, attackers may leverage these platforms to blend their activities with typical user behavior, making it challenging for security teams to spot malicious actions in real-time.

  The relevant MITRE ATT&CK tactics for this detection include **Command and Control (T1071)**, where an attacker may use external services to maintain control over a compromised host, and **Resource Development (T1608)**, which involves the preparation or acquisition of resources necessary for executing attacks. The associated techniques particularly relevant here are **T1105 – Ingress Tool Transfer** and **T1608 – Data from Cloud Storage**, both of which align with an attacker's strategy of using cloud services for nefarious downloading activities.

  Primary data sources that will contain vital evidence include **process creation logs** from Windows systems, which track the initiation of download commands, and the **command line activity**, which reveals the specific commands executed for downloading files from the identified Microsoft domains.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the Windows process creation logs for entries related to the execution of `curl.exe`, `wget.exe`, or PowerShell commands like `Invoke-WebRequest`. Pay particular attention to the source of these commands and their execution context.

  - **Analyze Command Line Parameters**: For any suspicious process creation events, analyze the command line used. Look for specific patterns or parameters indicating downloads from the domains such as `https://attachment.outlook.live.net/owa/` or `https://onenoteonlinesync.onenote.com/`.

  - **Correlate with User Activity**: Cross-reference the identified download actions with legitimate user activity. Assess whether the users initiating these downloads are operating within expected roles and permissions or if the actions are indicative of compromised accounts.

  - **Inspect Network Traffic**: Capture and analyze network traffic for outbound connections to the identified Microsoft domains. Look for unusual data transfers, especially at odd hours, to determine if there is significant data exfiltration or C2 behavior.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of unauthorized data exfiltration and the growing trend of attackers utilizing trusted cloud services to mask their activities. The likelihood of malign intent associated with these downloads further justifies the priority level in an enterprise environment where sensitive information may be at risk.

  ### Blind Spots and Assumptions
  The detection logic may have blind spots regarding legitimate use cases, such as scripts or tools that legitimately download attachments for business purposes, which can lead to false positives. Additionally, the rule assumes that the commands and processes used for downloading these files will conform to the specified patterns. It relies on the presence of adequate logging for process creation; if those logs are not enabled or if cmdlets are executed in a manner that bypasses logging, the detection may fail. Required configurations include ensuring that process command-line parameters are logged adequately and monitoring for legitimate exceptions.

