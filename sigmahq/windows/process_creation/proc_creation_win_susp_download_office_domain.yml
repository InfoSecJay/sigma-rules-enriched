title: Suspicious Download from Office Domain
id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
status: test
description: Detects suspicious ways to download files from Microsoft domains that
  are used to store attachments in Emails or OneNote documents
references:
- https://twitter.com/an0n_r0/status/1474698356635193346?s=12
- https://twitter.com/mrd0x/status/1475085452784844803?s=12
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-27
modified: 2022-08-02
tags:
- attack.command-and-control
- attack.resource-development
- attack.t1105
- attack.t1608
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
  - Image|endswith:
    - '\curl.exe'
    - '\wget.exe'
  - CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'curl '
    - 'wget '
    - 'Start-BitsTransfer'
    - '.DownloadFile('
    - '.DownloadString('
  selection_domains:
    CommandLine|contains:
    - 'https://attachment.outlook.live.net/owa/'
    - 'https://onenoteonlinesync.onenote.com/onenoteonlinesync/'
  condition: all of selection_*
falsepositives:
- Scripts or tools that download attachments from these domains (OneNote, Outlook
  365)
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious file download activities from Microsoft domains associated with email attachments and OneNote documents, specifically when using command-line tools like `curl`, `wget`, or PowerShell's `Invoke-WebRequest`. The likely attacker objective is to retrieve malicious payloads or sensitive data using trusted Microsoft services, avoiding direct interactions that may alert security measures. This behavior is related to the MITRE ATT&CK technique T1105 (Ingress Tool Transfer) and T1608 (Stolen Artifacts).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which captures details about executed processes and their command lines. If malicious, such behavior could indicate an attempt to exfiltrate data or deliver malware through a trusted channel. However, this detection does NOT confirm that malicious intent or action has occurred on its own, as legitimate scripts or tools may perform similar downloads.

  ---

  ### Investigation Steps

  - **Check process invocation logs:** Review Security Event ID 4688 to identify processes such as `curl.exe`, `wget.exe`, or PowerShell commands that executed around the time of the alert. Look for unusual parent-child process relationships.

  - **Validate command line parameters:** Examine the command-line arguments in the logs for typical patterns (i.e., `.DownloadFile`, `.DownloadString`, `Start-BitsTransfer`) and compare them against known benign uses in your environment.

  - **Assess domain reputation:** Verify if the download originated from `https://attachment.outlook.live.net/owa/` or `https://onenoteonlinesync.onenote.com/onenoteonlinesync/`. Use threat intelligence sources to confirm the legitimacy of these domains.

  - **Identify benign activity context:** Review historical logs for legitimate uses of downloading files from these domains. Determine if there are recurring patterns or known users/scripts that conduct these activities regularly.

  - **Determine high-confidence malicious indicators:** Investigate if the command line includes arguments indicative of obfuscation or unexpected file paths (e.g., files not typical for a user role) to ascertain potential intent for malicious action.

  - **Monitor for potential exfiltration artifacts:** Validate by checking if any files were created, moved, or uploaded post-download using File Creation Event ID 4663 or File Modification timestamps for unusual activity on sensitive directories.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on sensitive data exfiltration, particularly if it involves critical systems or data repositories. The likelihood of malicious abuse is elevated since attackers often leverage trusted services to conduct operations covertly. This type of behavior is increasingly weaponized in sophisticated campaigns.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting context or intent solely based on command-line activity, allowing for potential evasion through benign commands that may trigger the alert. Reliable detection requires comprehensive logging configurations, particularly for command execution outputs and process monitoring. Legitimate use cases include automated scripts for downloading shared files in business operations, warranting careful scrutiny. Companion detections focusing on unusual PowerShell activity (e.g., Execution Policy changes) would enhance coverage against possible abuse.

