title: Suspicious Download from Office Domain
id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
status: test
description: Detects suspicious ways to download files from Microsoft domains 
  that are used to store attachments in Emails or OneNote documents
references:
- https://twitter.com/an0n_r0/status/1474698356635193346?s=12
- https://twitter.com/mrd0x/status/1475085452784844803?s=12
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2021-12-27
modified: 2022-08-02
tags:
- attack.command-and-control
- attack.resource-development
- attack.t1105
- attack.t1608
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
  - Image|endswith:
    - '\curl.exe'
    - '\wget.exe'
  - CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'curl '
    - 'wget '
    - 'Start-BitsTransfer'
    - '.DownloadFile('
    - '.DownloadString('
  selection_domains:
    CommandLine|contains:
    - 'https://attachment.outlook.live.net/owa/'
    - 'https://onenoteonlinesync.onenote.com/onenoteonlinesync/'
  condition: all of selection_*
falsepositives:
- Scripts or tools that download attachments from these domains (OneNote, 
  Outlook 365)
level: high
note: |
  ### Technical Context

  This rule detects suspicious file download attempts from Microsoft domains typically associated with email attachments and OneNote documents. The likely attacker objective is to exfiltrate sensitive data or obtain malware payloads under the guise of legitimate downloads. Relevant MITRE ATT&CK techniques include "Command and Control" (T1071) and "Resource Development" (T1105). The primary telemetry sources for this detection are Windows process creation logs, specifically those containing Event ID 4688. If malicious, the security impact can be significant, potentially leading to data breaches or unauthorized access to sensitive information. This detection does NOT confirm malicious intent on its own; further contextual investigation is necessary.

  ### Investigation Steps

  - **Review process creation logs:**
    Examine Windows Security Event ID 4688 for process creation events linked to `curl.exe` or `wget.exe` with command lines containing `Invoke-WebRequest`, `curl`, or similar patterns.

  - **Check command line arguments:**
    Identify any usage of specific strings like `https://attachment.outlook.live.net/owa/` or `https://onenoteonlinesync.onenote.com/onenoteonlinesync/` in the command line, indicating potential malicious downloads.

  - **Evaluate the user context:**
    Confirm whether the user executing the download has legitimate access to perform such actions. Legitimate downloads often originate from business workflows involving document access.

  - **Identify abnormal execution patterns:**
    Look for repeated or unusual download actions within a short time frame, particularly from non-standard environments or users that are not typically involved in such activities.

  - **Cross-reference with other security logs:**
    Investigate related logs, like Windows Defender ATP alerts or network logs observing unusual outbound traffic to detect any data exfiltration attempts tied to these downloads.

  - **Assess file artifacts:**
    Validate if any files were created or downloaded to the system as a result of the suspicious commands, specifically checking for file modifications in temporary or download directories.

  ### Prioritization

  This alert represents a high severity concern as it indicates potential data exfiltration from critical systems like email and document management. The likelihood of abuse is significant given the common weaponization of such download techniques in phishing and malware delivery schemes.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of circumventing tools that mask or obfuscate command line arguments. Required log sources include properly configured auditing for process creation on all endpoints. Legitimate activities such as internal scripts or processes that download documents may trigger this alert. A related detection that supports coverage includes monitoring for anomalous network connections to known malicious domains or unusual patterns of access to cloud storage services.

