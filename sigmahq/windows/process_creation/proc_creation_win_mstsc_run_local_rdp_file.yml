detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_cli:
    CommandLine|endswith:
    - '.rdp'
    - '.rdp"'
  filter_optional_wsl:
    ParentImage: 'C:\Windows\System32\lxss\wslhost.exe'
    CommandLine|contains: 'C:\ProgramData\Microsoft\WSL\wslg.rdp'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Likely with legitimate usage of ".rdp" files
level: low
note: |
  ### Technical Context
  This detection rule identifies potential Remote Desktop Protocol (RDP) connections initiated by the Microsoft Terminal Services Client (Mstsc.EXE) using a local ".rdp" file. Attackers often leverage RDP for remote access and control of targeted systems, which could facilitate unauthorized access or movement within a network. The usage of local RDP files could indicate an effort to bypass security measures, especially if the files are sourced from untrusted or malicious origins.

  The primary techniques relevant to this detection include:
  - **Command and Control (T1071)**: This encompasses the use of various protocols (like RDP) to communicate with compromised systems.
  - **Remote Services - RDP (T1219.002)**: Specifically, this technique highlights the usage of Remote Desktop Protocol as a means to establish remote connections.

  The primary data source for this detection will be **process creation events**, which log the execution of applications like Mstsc.EXE, along with the parameters used during their invocation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Gather logs detailing the execution of Mstsc.EXE, including the command line arguments that were provided. Pay special attention to invocations that include ".rdp" file extensions.

  - **Examine RDP File Sources**: Conduct an investigation to trace the origins of the local ".rdp" files being used. Look for file creation timestamps or modifications that indicate unexpected sources or timing.

  - **Check Network Connections**: Analyze any network connections initiated by the system after the RDP session was established. Particularly, confirm whether there are connections to known malicious IP addresses or domains.

  - **Investigate Parent Processes**: Identify and scrutinize any parent processes of Mstsc.EXE to determine if it was invoked from legitimate contexts. Special attention should be given to processes like `wslhost.exe`, which may indicate an unusual method of launching the RDP session.

  ### Prioritization
  This alert is prioritized as **low** due to the relatively low confidence of malicious intent inherent in the use of Mstsc.EXE with local RDP files. While this activity can indicate potential security risks, it could also stem from legitimate administrative actions.

  ### Blind Spots and Assumptions
  There may be detection gaps due to diverse legitimate use cases for RDP and varying organizational policies regarding its use. The detection logic assumes that usage of ".rdp" files is abnormal or suspicious, which might not hold true in all environments, particularly in organizations that regularly use RDP for legitimate purposes. Additionally, the rule requires complete and accurate process creation logs, which may not be enabled in all settings or could be subject to log retention policies that complicate historical analysis.

