detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_cli:
    CommandLine|endswith:
    - '.rdp'
    - '.rdp"'
  filter_optional_wsl:
    ParentImage: 'C:\Windows\System32\lxss\wslhost.exe'
    CommandLine|contains: 'C:\ProgramData\Microsoft\WSL\wslg.rdp'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Likely with legitimate usage of ".rdp" files
level: low
note: |
  ### Technical Context

  This detection rule identifies instances of the Windows Remote Desktop Connection Client (Mstsc.exe) being executed with a local .rdp file, which may signal an attempt at establishing a remote session that could be used for unauthorized access. The likely attacker objective is to gain remote control over a target system using pre-configured connection parameters within the .rdp file, potentially facilitating lateral movement or reconnaissance activities within the network.

  This behavior aligns with the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and technique "Externally Accessible Device" (T1219.002). The primary telemetry sources required for this detection include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing event details related to process executions. If the Mstsc.exe process is executed maliciously, it could provide attackers with unauthorized access to sensitive systems, leading to potential data breaches or compromise of critical infrastructure.

  This detection does NOT confirm malicious intent on its own; legitimate administrative activities may also trigger similar events, particularly in environments where remote administration is standard practice.

  ---

  ### Investigation Steps

  - **Verify the event source:** Check for Security Event ID 4688 or Sysmon Event ID 1 related to Mstsc.exe process creation. Look for fields indicating the command line ending with '.rdp' or '.rdp"'.

  - **Analyze command line arguments:** Review the CommandLine field for unusual parameters or suspicious content associated with the .rdp file. Legitimate entries typically reference known hosts or internal resources.

  - **Cross-check user account:** Identify the user account that initiated the Mstsc.exe execution. Cross-reference against known administrative or remote access accounts to discern legitimacy.

  - **Check parent process:** Investigate the ParentImage field to determine how Mstsc.exe was launched. If the parent process is a non-standard application or service, it may indicate potential abuse.

  - **Monitor for output redirection:** Consider any output files or logs created by the .rdp connection process. The presence of .rdp files in suspicious directories (e.g., user profile temp folders) can indicate an adversary's footprint.

  - **Review legitimate RDP activities:** Document typical RDP usage patterns within your organization. Compare against the alert to establish a baseline of normal usage and identify anomalies.

  ---

  ### Prioritization

  This alert is of low severity due to the potential for legitimate administrative activities to trigger it, but it requires swift attention as it could signal unauthorized access attempts. The likelihood of malicious abuse is moderate, particularly in environments prone to misconfigured remote access settings, making awareness of this behavior critical to prevent exploitation.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers using custom RDP clients or obfuscating command line arguments to disguise their intentions. Reliable detection hinges on the configuration of process creation logs (Event ID 4688 and Sysmon) across all systems, particularly on critical assets. Legitimate activities include routine remote support sessions, which may trigger this alert. A companion detection to consider is monitoring for unusual outbound traffic to external IPs after Mstsc.exe execution, providing further context for potential malicious activity.

