note: |
  ### Technical Context

  This rule detects the execution of tools that employ parent process ID (PPID) spoofing, specifically the use of Didier Stevens' SelectMyParent tool. The primary objective of an attacker using PPID spoofing is to evade detection by disguising the origin of process execution, often to facilitate privilege escalation or stealthy lateral movement. This behavior aligns with the MITRE ATT&CK tactic of “Defense Evasion” and the technique T1134.004 (Access Token Manipulation).

  The primary telemetry sources for this detection are Windows process creation logs, such as Security Event ID 4688 and Sysmon Event ID 1, which provide detailed insights into process execution details including command line arguments and parent-child relationships. If malicious, the impact could range from unauthorized access to sensitive systems to exfiltration of data without detection. Importantly, this detection does NOT confirm successful privilege escalation or malicious intent on its own without further investigation.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for processes containing known PPID spoofing identifiers (e.g., `SelectMyParent.exe` in the Image field). Legitimate processes typically do not have a mismatched PPID, whereas malicious execution often shows processes started with ghost parents.

  - **Analyze command line arguments:** Inspect the CommandLine field from the process creation logs for phrases indicative of PPID spoofing, such as `PPID-spoof`, `spoof-ppid`, or ` -spawnto `. Benign command lines will not use these specifications.

  - **Review parent-child process relationships:** Query Sysmon Event ID 1 to confirm the parent-child hierarchy. A legitimate process should have a recognizable and expected parent process, while a spoofed execution may have an unexpected or unrelated parent.

  - **Validate file hashes:** Cross-reference the process execution with known hashes of the SelectMyParent tool (e.g., `IMPHASH=04D974875BD225F00902B4CAD9AF3FBC`). Identifying these hashes is a strong indicator of malicious intent.

  - **Examine recent activity on critical assets:** Focus on processes executed on high-risk systems or during off-hours, which are common windows of opportunity for attackers leveraging such tools. Normal operations usually involve scheduled scripts or expected administrative tools.

  ### Prioritization

  The severity of this alert is high due to the significant impact potential: a successful PPID spoofing execution may indicate an attempt to manipulate system processes, evade security mechanisms, or escalate privileges. The likelihood of malicious abuse is considerable, as this technique is commonly weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging settings on endpoints; ensuring Sysmon and adequate security audit policies are configured is critical for reliable detection. Legitimate applications may also trigger these alerts if they use similar naming conventions or modify PIDs for legitimate purposes, such as troubleshooting utilities. A related detection to consider is the monitoring of access token modifications (T1134), which further correlates to potential elevation of privileges following PPID spoofing.

