title: Suspicious Scheduled Task Name As GUID
id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
status: test
description: Detects creation of a scheduled task with a GUID like name
references:
- https://thedfirreport.com/2022/10/31/follina-exploit-leads-to-domain-compromise/
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create '
  selection_tn:
    CommandLine|contains:
            # Can start with single or double quote
    - '/TN "{'
    - "/TN '{"
    - "/TN {"
  selection_end:
    CommandLine|contains:
            # Ending of the name to avoid possible FP in the rest of the commandline
    - '}"'
    - "}'"
    - '} '
  condition: all of selection_*
falsepositives:
- Legitimate software naming their tasks as GUIDs
level: medium
note: |
  ### Technical Context
  This rule detects the creation of scheduled tasks in a Windows environment with names formatted as GUIDs (Globally Unique Identifiers). The presence of such task names may indicate suspicious activities, potentially linked to malware or malicious actors attempting to maintain persistence in a compromised system. Attackers might use GUID-named scheduled tasks to disguise their malicious activities, making them harder to identify among legitimate system tasks.

  The likely attack objectives include establishing persistence mechanisms within the victim's environment, enabling the attacker to execute other malicious workflows or maintain control over compromised systems. This behavior can correlate with tactics such as Persistence (ATT&CK ID: T1053), specifically the "Scheduled Tasks" technique (T1053.005), as well as Execution (T1203) through scheduled task execution patterns that might be used for malware delivery or control.

  Primary telemetry sources of interest for this detection include process creation logs, particularly those related to the `schtasks.exe` utility, which handles scheduled tasks. Analyzing the command-line parameters, especially those that hint at improperly formatted task names, can provide insight into potentially malicious activities.

  ### Investigation Steps
  - **Review Scheduled Task Logs**: Check the scheduled task creation events for GUID-formatted names. Cross-reference the creation times with any incidents or alerts that may indicate prior compromise.
  - **Analyze Command-Line Parameters**: Investigate the command-line execution details captured in process creation logs for any indicative patterns or additional flags that may reveal malicious intent beyond just task creation.
  - **Reference Threat Intelligence Sources**: Consult relevant threat intelligence reports and frameworks, such as the DFIR reports from the provided references, to contextualize the findings and understand associated attack patterns.
  - **Monitor User Activity and Permissions**: Examine the users who created these tasks and their permissions in the Active Directory environment. Anomalous user behavior can provide additional layers of context to the activities being investigated.

  ### Prioritization
  This alert is of medium severity due to the potential for significant impact if an attacker gains persistent access through malicious scheduled tasks, alongside the moderate likelihood of such techniques being employed based on observed threat landscape trends.

  ### Blind Spots and Assumptions
  There might be limitations in detection coverage for legitimate software that names their scheduled tasks with GUIDs, leading to possible false positives. The detection logic assumes that all task names containing GUID patterns are malicious, which might not always hold true. For effective functionality, the environment must ensure logging is enabled for process creations, especially for applications interacting with `schtasks.exe`. Additionally, the absence of an effective monitoring and alerting system for legitimate administrative activities may result in obscuring the background noise that could dilute detection efficacy.

