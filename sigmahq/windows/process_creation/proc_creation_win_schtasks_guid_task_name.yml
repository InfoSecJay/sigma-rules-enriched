title: Suspicious Scheduled Task Name As GUID
id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
status: test
description: Detects creation of a scheduled task with a GUID like name
references:
- https://thedfirreport.com/2022/10/31/follina-exploit-leads-to-domain-compromise/
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/Create '
  selection_tn:
    CommandLine|contains:
            # Can start with single or double quote
    - '/TN "{'
    - "/TN '{"
    - "/TN {"
  selection_end:
    CommandLine|contains:
            # Ending of the name to avoid possible FP in the rest of the commandline
    - '}"'
    - "}'"
    - '} '
  condition: all of selection_*
falsepositives:
- Legitimate software naming their tasks as GUIDs
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks in Windows that are named as GUIDs (Globally Unique Identifiers), which is an uncommon naming convention often utilized by malicious actors to obfuscate their activities. The likely attacker objective is to establish persistence through a hidden scheduled task that could execute malicious payloads at specified intervals. This behavior aligns with the MITRE ATT&CK technique for Scheduled Task/Job (T1053.005).

  The primary telemetry source for this detection is process creation logs from Windows, specifically monitoring the use of `schtasks.exe` and its command line arguments. If confirmed malicious, such activity could lead to unauthorized persistence on the affected system or network compromise. Importantly, this detection does not confirm that the scheduled task is malicious on its own; further validation is needed against known benign tasks.

  ### Investigation Steps

  - **Review process creation events**: Investigate Security Event ID 4688 focusing on `schtasks.exe` instances. Look specifically for command lines containing `'/Create '` along with a GUID format for the `/TN` parameter.

  - **Analyze command line parameters**: Check the full command line output in event logs for patterns matching GUID-style names in the `/TN` section; legitimate tasks generally use descriptive names indicating their function.

  - **Cross-reference existing tasks**: Validate against the Windows Task Scheduler (using Task Scheduler console or PowerShell command `Get-ScheduledTask`). Identify if a scheduled task with a GUID name already exists or if this is a new creation.

  - **Identify indicators of compromise**: Look for connections to known malicious IPs or domains in the activity leading up to the scheduled task creation. Focus on buffers or communications from the host in Firewall logs or inbound/outbound connection logs.

  - **Check for legitimate software**: Verify if any known legitimate software in your environment routinely generates tasks with GUIDs. Review system documentation if necessary to confirm expected behavior.

  ### Prioritization

  This alert should be treated with medium priority. While the affected system’s role can vary widely in an enterprise, the use of GUIDs for task naming is atypical and often indicative of malicious intent. The likelihood of attack due to this behavior is moderate, as it is sometimes weaponized in advanced threats.

  ### Blind Spots and Assumptions

  Some limitations in detection include potential evasion by using common naming conventions or obfuscated command line arguments that don't directly show GUIDs. Reliable detection requires proper logging configurations to capture process creation events and command line arguments. Furthermore, legitimate applications may legitimately create tasks with GUIDs; awareness of such cases is essential for accurate threat assessment. Companion detections could include monitoring for known malicious software patterns associated with scheduled tasks to enhance overall visibility.

