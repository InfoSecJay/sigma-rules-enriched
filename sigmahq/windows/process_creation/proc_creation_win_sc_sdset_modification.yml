note: |
  ### Technical Context
  This rule detects the use of the `sc.exe` utility to add a new Windows service with special permissions to hide the service from the standard service list. This behavior is typically executed by attackers to maintain persistence and evade detection. By utilizing the Service Control Manager (`sc.exe`), an attacker might create a service that runs malicious code, enabling them to retain access to a compromised system even after a basic cleanup.

  In a threat scenario, an attacker may use this technique post-compromise to ensure that their malicious software or backdoor remains hidden and operational. While legitimate administrators also use `sc.exe` for legitimate service management tasks, the presence of unusual command-line arguments, particularly involving the `sdset` option, raises red flags. Relevant MITRE ATT&CK tactics include **Persistence** (T1547.001), **Defense Evasion** (T1574.011), and **Privilege Escalation** (T1068), as these techniques enable attackers to manipulate Windows services to their advantage.

  Primary data sources that provide the best evidence for this detection include process creation logs, which capture command-line arguments for executed binaries, and potentially Windows Event Logs that detail service creation and modification events.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for `sc.exe` instances, particularly those that include the `sdset` command. Analyze the command-line parameters for any anomalies or unexpected service names.
  - **Inspect Service Configurations:** Use tools like PowerShell or `Get-Service` to list all existing services and their configurations, looking specifically for services that have unusual permissions or security descriptors.
  - **Conduct a Timeline Analysis:** Investigate the timeline of process creation events leading up to the service addition to identify other suspicious activities or anomalous behavior around the same time.
  - **Check for Persistence Mechanisms:** Verify if the newly created service persists across reboots and see if there are associated scheduled tasks or registry entries that may indicate additional persistence mechanisms.

  ### Prioritization
  This alert is considered medium severity because, although service creation via `sc.exe` can be legitimate, the use of special permissions and hiding techniques indicates a potential compromise that could allow an attacker to maintain a foothold within the environment. The impact could be significant if the service allows for ongoing unauthorized access.

  ### Blind Spots and Assumptions
  Gaps in detection coverage include scenarios where attackers may utilize alternate legitimate tools for service manipulation, such as PowerShell commands, making this rule potentially insufficient by itself. The detection logic assumes that logging options for process creation are enabled and properly configured within the environment. Additional assumptions include the presence of `sc.exe` usage for benign purposes, which could trigger false positives if not investigated in context. Proper logging settings are essential to ensure that all necessary data is captured for effective detection.

