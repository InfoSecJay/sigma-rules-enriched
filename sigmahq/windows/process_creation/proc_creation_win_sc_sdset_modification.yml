note: |
  ### Technical Context

  This rule detects the usage of the `sc.exe` utility to modify the security descriptor of a service, particularly when it adds a new service with permissions set to hide it from typical enumeration techniques. This behavior aligns with an adversary's objective of establishing persistence or evading detection by obscuring the service they are operating. The primary MITRE ATT&CK tactic involved is "Persistence" (TA0003), specifically the technique "Modify Existing Service" (T1574.011).

  The primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon logs (Event ID 1) that detail the execution of `sc.exe`. If malicious, this behavior can lead to successful persistence mechanisms within the environment. It is important to note that this detection does NOT confirm that malicious activity occurred; legitimate administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Validate process creation details:** Examine Windows Security Event ID 4688 and Sysmon Event ID 1 for execution of `sc.exe`. Check `CommandLine` parameters for the presence of `sdset` to correlate with the detection criteria.

  - **Inspect service configurations:** Query the service configuration using PowerShell or Windows Management Instrumentation (WMI). Compare the permissions set against baseline configurations and check if the service is registered with permissions that obscure its visibility.

  - **Monitor for authorized behaviors:** Review authorized administrative access logs. Legitimate service configurations typically do not include overly restrictive permission settings that prevent standard users from viewing the service.

  - **Identify high-confidence malicious indicators:** Look for services created around the time of the `sc.exe` execution that have suspicious names or descriptions, or that show unusual service dependencies.

  - **Review logs for administrative activities:** Reference logs for other administrative actions within a specified timeframe to contextualize any changes made by `sc.exe`. Look for Event IDs associated with modifications made by known administrators, and cross-check with the users executing `sc.exe`.

  - **Cross-check against related detections:** Investigate if there are concurrent alerts indicating unauthorized access or service manipulation, such as "Deny Service Access" (related detection ID: 99cf1e02-00fb-4c0d-8375-563f978dfd37). Correlate findings to strengthen the assessment of malicious behavior.

  ### Prioritization

  This alert carries a medium severity level due to its potential impact on persistence and service integrity within enterprise systems. The likelihood of malicious abuse is moderate, considering attackers often leverage service modifications to maintain footholds. While not all instances are weaponized, this behavior is a recognized tactic in many advanced attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging on endpoints or modified audit settings, which could obscure genuine malicious activity. Legitimate administrative actions, particularly those related to service configuration by trusted personnel, can trigger this alert without malicious intent. A companion detection useful for coverage includes monitoring service enumeration attempts, which may indicate attempts to access or leverage modified services.

