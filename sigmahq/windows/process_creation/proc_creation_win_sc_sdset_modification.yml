  ---

  ### Technical Context

  This rule detects the use of `sc.exe` to modify the security descriptor of a Windows service, potentially adding new services with altered permissions that can facilitate stealthy persistence and control by an attacker. The likely objective is to hide malicious services or capabilities from system administrators, effectively enabling a foothold into the environment. This behavior aligns with MITRE ATT&CK techniques such as “Modify Existing Service” (T1574.011) and falls under the tactics of Persistence and Defense Evasion.

  The primary telemetry sources for detecting this behavior are the process creation logs, particularly Windows Event ID 4688, which captures the command line parameters used to execute `sc.exe`. If successful, malicious actions may allow an attacker to create a service that avoids detection by security controls. Importantly, this detection does not confirm that an attack has occurred; legitimate use of `sc.exe` for service management can trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review event details from process creation logs**: Check Windows Security Event ID 4688 for instances of `sc.exe` execution, focusing on the `CommandLine` field for `sdset`, which indicates an attempt to modify service descriptors.

  - **Identify the specific command executed**: Look for command line arguments in `Event ID 4688` that include "sdset" along with the service name to determine what security descriptor is being modified; correlate these against a list of known services.

  - **Analyze the resulting service permissions**: After identifying the command, use Windows Security Event ID 7045 to list current services and their permissions. Compare these to expected service configurations to identify any unauthorized changes.

  - **Establish baselines for legitimate service management**: Validate regular usage patterns for service management within your environment; legitimate use may include administrative scripting or updates performed during scheduled maintenance.

  - **Identify high-confidence malicious indicators**: If `sc.exe` is invoked with unusual parameters or on services not typically modified during routine operations, flag these instances for further review, emphasizing services with modified permissions that enable "Deny Access".

  ---

  ### Prioritization

  This alert should be treated with medium priority, particularly if it originates from critical servers or hosts. The likelihood of malicious abuse is moderate, especially if seen in conjunction with other suspicious behaviors. While not commonly weaponized for direct execution, modifications to service permissions can lay the groundwork for subsequent attacks.

  ---

  ### Blind Spots and Assumptions

  Detection of `sc.exe` may be limited if there is a lack of detailed command line logging or if relevant logs are not retained long enough for investigation. Legitimate configuration changes by administrators or automated systems may also trigger the alert. Companion detections to consider include monitoring for service creation or deletion via Windows Event ID 7045 or Service Control Manager logs to strengthen chaff coverage and decision-making processes.

