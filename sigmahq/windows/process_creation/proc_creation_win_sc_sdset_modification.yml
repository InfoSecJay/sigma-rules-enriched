note: |
  ### Technical Context

  This Sigma rule detects the use of the `sc.exe` utility to create a new Windows service with modified security permissions that can effectively hide the service from standard system queries. The likely objective of an attacker utilizing this behavior is to establish persistence and evade detection by manipulating access control settings to restrict visibility of malicious services. This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence and the technique ID T1574.011 (Service Registry Permissions Weakness).

  The primary telemetry source for this detection includes Windows process creation logs generated by Event ID 4688 and Sysmon Event ID 1, which capture details about the command-line invocation of `sc.exe`. If successfully executed with malicious intent, this could allow a threat actor to maintain long-term access to a compromised system while remaining undetected. Importantly, this detection does NOT confirm that a service is malicious on its own; further investigation is necessary to assess the legitimacy and purpose of the created service.

  ### Investigation Steps

  - **Verify the execution of `sc.exe`:** Review Security Event ID 4688 or Sysmon Event ID 1 for the execution of `sc.exe` with command line parameters that include `sdset`. Look for the process creation event with a CommandLine field showing 'sdset' peculiar to the new service's descriptor.

  - **Check for newly created or modified services:** Use the `Get-Service` PowerShell command or review the Service Control Manager operational log (Event ID 7045) for any new services created around the same timestamp, particularly those with unusual names or configured to run under the Local System account.

  - **Examine service permissions:** For any suspicious service identified, analyze the security descriptor using `sc sdshow [ServiceName]` to understand its access permissions. Look for permissions that restrict access (e.g., S-1-5-32-544) which might indicate an attempt to hide the service from normal users.

  - **Establish baseline behavior of legitimate services:** Review typical service configurations in the environment, focusing on their required permissions and ownership. Compare the configurations of the newly created service against the company’s standard practices to identify anomalies.

  - **Investigate related processes or actions:** Check for any parent processes related to the activity, especially those linked to privilege escalation or suspicious task scheduling. Look for Event ID 4688 to identify any processes that invoked `sc.exe` inappropriately.

  - **Identify any exfiltration artifacts:** Validate if the process created resulting files or network connections, reviewing log files from Windows Event Logs related to file creation and network activity for potential data leakage or remote command and control communications.

  ### Prioritization

  The alert should be treated as medium severity due to its potential impact on the persistence of malicious actors with the ability to create hidden services. The likelihood of misuse is moderate, as this technique is recognized among adversaries for establishing stealthy backdoors, thus warranting rapid investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations based on the configuration of permissions in the environment, as some legitimate applications also modify service descriptors. It requires effective logging of process creation and auditing of service control actions to be fully reliable. Business-critical applications or maintenance tasks may unintentionally trigger this alert, thus requiring contextual awareness. A companion detection might include tracking service changes with Event ID 7045 to enhance visibility into service alterations within the enterprise environment.

