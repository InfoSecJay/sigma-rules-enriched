logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\odbcconf.exe'
  - OriginalFileName: 'odbcconf.exe'
  selection_cli:
        # Note: The "/A" flag is not required to call a specific action
    CommandLine|contains|all:
    - 'REGSVR '
    - '.dll'
  condition: all of selection_*
falsepositives:
- Legitimate DLLs being registered via "odbcconf" will generate false positives. Investigate
  the path of the DLL and its content to determine if the action is authorized.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when the `odbcconf.exe` process is used to register a new Dynamic Link Library (DLL) by executing the "REGSVR" command. This activity is often utilized by attackers who leverage legitimate tools for malicious purposes, such as deploying backdoors or malicious payloads by registering rogue DLLs in the system. By exploiting these trusted functionalities, adversaries aim to bypass security measures and maintain persistence within the environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Defense Evasion** (TA0005) and **Signed Binary Proxy Execution** (T1218.008). Attackers often employ `odbcconf.exe`, a legitimate Microsoft utility for managing ODBC data sources, to conceal malicious activity and blend in with normal system operations. Key telemetry sources that can provide insights into such activities include process creation logs, which capture executable command lines as well as associated metadata that can help distinguish legitimate usage from potential threats.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for `odbcconf.exe` execution, focusing on the command line arguments to identify instances where `REGSVR` is invoked along with a `.dll` file. Verify the context in which this command was executed.

  - **Analyze DLL File Location**: Investigate the source and integrity of the DLL being registered by checking its file path and hashing its contents to compare against known malicious signatures. Determine whether the DLL is from a trusted source or exhibits suspicious characteristics.

  - **Monitor System Changes**: Audit the system for any changes made post-execution of `odbcconf.exe`, including new services, scheduled tasks, or other persistent mechanisms introduced by the registered DLL.

  - **Correlate with Other Alerts**: Cross-reference the findings with other security alerts and logs (like EDR or NDR events) from the same timeframe which may reveal additional suspicious behaviors or related indicators of compromise.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for serious breaches that can result from the registration of malicious DLLs. While it may signify an ongoing attack scenario, the likelihood of false positives from legitimate uses of `odbcconf.exe` must also be taken into account.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include scenarios where the malicious DLL is registered through other legitimate processes, which this rule would not capture. The detection logic assumes that the command line will specifically include "REGSVR" with a `.dll` file and may miss variations or obfuscation attempts. This rule relies on the availability and proper configuration of process creation logging, which must be enabled to ensure completeness of the detection mechanism.

