note: |
  ### Technical Context

  This Sigma rule detects the execution of the Tor Browser or its associated executable, typically used for accessing the Tor network. Attackers may utilize Tor for anonymous communication or to connect to command-and-control (C2) servers, obscuring their activities from traditional monitoring. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control, specifically the technique T1090.003 (Internal Proxy).

  The primary telemetry source for this alert is Windows process creation logs, especially focusing on Event ID 4688, which captures application execution details. Malicious use of Tor can facilitate various attacks, including data exfiltration and lateral movement. It is important to note that this detection does not confirm malicious intent by itself; legitimate users may also run Tor for benign purposes.

  ### Investigation Steps

  - **Identify the process details**: Review Windows Security Event ID 4688 for process creation. Check for "New Process Name" entries that include `tor.exe` or `Tor Browser\Browser\firefox.exe`. Malicious indicators include frequent or suspicious use by non-administrative accounts.

  - **Examine user context**: Investigate the user account associated with the Tor execution. Determine if the account has a history of suspicious activity or if it is part of a legitimate role that may require Tor (e.g., research).

  - **Check network activity**: Analyze logs for network connections initiated from the Tor process. Focus on DNS lookups to .onion domains. Malicious indicators would include connections to known malicious .onion sites, which can be validated by threat intelligence sources.

  - **Monitor for related processes**: Look for associated related processes spawned from the Tor Browser that might indicate further malicious intent. Use Sysmon Event ID 1 to track process creation chains, especially if powershell.exe, cmd.exe, or other scripting tools are involved.

  - **Review legitimate usage patterns**: Understand the normal operational context for your environment. For example, in a controlled research environment, the use of Tor may be documented and authorized. Compare detected usage against these records.

  ### Prioritization

  This alert carries high severity due to the potential for significant security risks if an adversary is utilizing Tor for C2 communications or data exfiltration. The likelihood of malicious activity is heightened, as the use of Tor is often a hallmark of attempts to conceal unauthorized actions within a network.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations, as not all environments will capture the necessary process creation events consistently. Legitimate activities that could trigger this alert include authorized research or safety practices by privacy-focused users. A related detection to consider is monitoring for unusual outbound traffic patterns, such as high volumes of encrypted connections that could indicate unauthorized data transfer via the Tor network.

