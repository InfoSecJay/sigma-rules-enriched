note: |
  ### Technical Context
  This detection rule identifies the execution of the Tor browser or Tor client on Windows systems, which may indicate an attempt to access privacy-focused or anonymized networks, including the use of onion routing. The use of Tor is often associated with malicious activities such as evading detection, accessing hidden services, or conducting illegal operations. In enterprise environments, the presence of Tor can be a significant threat, as attackers may use it to exfiltrate data or maintain command-and-control communication while attempting to obfuscate their activities.

  The rule aligns with the MITRE ATT&CK framework under the "Command and Control" tactic, specifically the technique T1090.003, which pertains to the use of proxy services (in this case, Tor) for internal network requests. Understanding that attackers may leverage Tor for various objectives, including data exfiltration and lateral movement, is crucial for incident responders.

  Primary data sources for detection include process creation events from Windows, which log the execution of applications including the Tor client. Engaging with logs that detail the execution and parameters of processes will provide actionable insights into any suspicious activity involving the Tor browser.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances of Tor or Tor Browser execution. Look for events related to `tor.exe` or `firefox.exe` within the Tor directory.

  - **Check Network Traffic**: Examine outbound network traffic for any connections to known Tor exit node IPs or port 9050, which is typically used for Tor traffic. Identify unusual patterns or connections that deviate from normal network behavior.

  - **Investigate User Behavior**: Assess the accounts that initiated the Tor browser sessions. Look for anomalous user behavior, such as accessing Tor from non-standard locations or times, which may indicate a potential compromise.

  - **Correlate with Other Logs**: Cross-reference findings with firewall and proxy logs to evaluate if there were unauthorized attempts to bypass existing security controls, especially in relation to outbound traffic.

  ### Prioritization
  The severity of this alert is high due to the potential for malicious activity associated with the use of Tor in an enterprise environment. The likelihood of threat actors leveraging Tor to evade detection and execute harmful operations makes it critical to respond promptly upon detection.

  ### Blind Spots and Assumptions
  This detection logic may not cover all potential methods of Tor installation or execution, particularly if attackers employ custom techniques to obfuscate their tracks, such as using non-standard file paths. It assumes that process creation events are reliably logged, which may require specific configurations in the Windows environment. Additionally, detection may be hindered if security monitoring solutions do not capture or correlate traffic effectively across the network. It is essential to have robust logging enabled to ensure visibility into any Tor-related activities.

