title: Suspicious VBoxDrvInst.exe Parameters
id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
status: test
description: |
  Detect VBoxDrvInst.exe run with parameters allowing processing INF file.
  This allows to create values in the registry and install drivers.
  For example one could use this technique to obtain persistence via modifying one of Run or RunOnce registry keys
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OtherBinaries/VBoxDrvInst.yml
- https://twitter.com/pabraeken/status/993497996179492864
author: Konstantin Grishchenko, oscd.community
date: 2020-10-06
modified: 2021-11-27
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\VBoxDrvInst.exe'
    CommandLine|contains|all:
    - 'driver'
    - 'executeinf'
  condition: selection
falsepositives:
- Legitimate use of VBoxDrvInst.exe utility by VirtualBox Guest Additions installation
  process
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `VBoxDrvInst.exe` with specific command-line parameters that permit the processing of INF files, which can manipulate system drivers and registry keys. Attackers may exploit this functionality to establish persistence on a compromised host by modifying registry values, such as those found in the Run or RunOnce keys. This manipulation allows malware to automatically execute on system startup, enabling ongoing access to the infected environment.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Defense Evasion** (TA0005), with the specific technique being **Registry Run Keys / Startup Folder** (T1112). The rule focuses on potentially harmful alterations that can be made through `VBoxDrvInst.exe`, highlighting how legitimate tools can be misused for malicious intent.

  Primary data sources for gathering evidence include Windows process creation events that can be collected from EDR solutions or Sysmon logs, as they capture command-line arguments and executable paths.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate recent execution events for `VBoxDrvInst.exe`, focusing on the command-line parameters. Look for unusual flags or arguments that indicate manipulation typical of attacker behavior.

  - **Analyze Registry Modifications:** Check for modifications to key registry paths, particularly the `Run` and `RunOnce` keys. Use tools like `reg query` to identify any recent changes made by the identified process.

  - **Correlate with Known IOCs:** Compare the identified behaviors against known Indicators of Compromise (IOCs) associated with malicious use of `VBoxDrvInst.exe` or similar exploitation techniques to determine if the activity aligns with malicious patterns.

  - **Assess Contextual Usage:** Determine the context of the tool's execution. Investigate whether `VBoxDrvInst.exe` was executed as part of legitimate software installations, such as VirtualBox Guest Additions, and differentiate between benign and suspicious uses based on deployment scenarios.

  ### Prioritization
  This alert should be considered medium severity due to the potential impact that unauthorized persistence mechanisms can have on an enterprise environment. While the likelihood of encountering this specific misuse might be lower than more widespread threats, any detected use of this method could indicate an attempt to compromise systems and subvert security controls.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if users regularly employ `VBoxDrvInst.exe` for legitimate purposes without comprehensive logging. The rule assumes that processes are logged and command-line arguments are captured; without proper configurations for EDR/monitoring tools, successful detection can be hindered. It is important to ensure that process creation logging is enabled to effectively utilize this detection methodology.

