title: Suspicious VBoxDrvInst.exe Parameters
id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
status: test
description: |
  Detect VBoxDrvInst.exe run with parameters allowing processing INF file.
  This allows to create values in the registry and install drivers.
  For example one could use this technique to obtain persistence via modifying one of Run or RunOnce registry keys
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OtherBinaries/VBoxDrvInst.yml
- https://twitter.com/pabraeken/status/993497996179492864
author: Konstantin Grishchenko, oscd.community
date: 2020-10-06
modified: 2021-11-27
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\VBoxDrvInst.exe'
    CommandLine|contains|all:
    - 'driver'
    - 'executeinf'
  condition: selection
falsepositives:
- Legitimate use of VBoxDrvInst.exe utility by VirtualBox Guest Additions installation
  process
level: medium
note: |
  ---

  ### Technical Context

  This detection rule identifies the execution of `VBoxDrvInst.exe` with parameters indicating the installation of a driver using an INF file, which can modify registry values to establish persistence. Attackers often aim to persist malicious changes to system configurations, enabling their malware to survive system reboots. This behavior maps to the MITRE ATT&CK technique for Persistence (T1112) and Defense Evasion (T1112). The primary telemetry source is process creation logs—specifically, Windows Security Event ID 4688 or Sysmon Event ID 1 capturing command-line parameters of running processes. If malicious, this could grant attackers ongoing access and control of vulnerable systems. On its own, this detection does not confirm that a malicious event has occurred, as legitimate uses of this command exist.

  ---

  ### Investigation Steps

  - **Identify the process execution:** Check for `VBoxDrvInst.exe` executions in Security Event ID 4688 logs. Validate the command line for parameters that include `driver` and `executeinf`, which indicate potential malicious activity.

  - **Review the command line for anomalies:** Look for unusual or non-standard argument combinations in the command line (e.g., presence of `executeinf`). Legitimate installations usually do not require these parameters.

  - **Verify associated registry changes:** Investigate logs related to registry modification (e.g., Event ID 4657) for changes to Run or RunOnce keys after the execution of `VBoxDrvInst.exe`. Changes to these keys can indicate persistence mechanisms being established by an adversary.

  - **Assess the affected system's role:** Consider the security posture of the host running `VBoxDrvInst.exe`. If it is a critical server or endpoint that should not use VirtualBox, escalate the investigation due to the higher risk of compromise.

  - **Cross-reference with known tools:** Use tools like the LOLBAS project to confirm whether `VBoxDrvInst.exe` is being leveraged in a recognized manner. This may help distinguish between legitimate and malicious usage.

  - **Examine user context of execution:** Determine the user account that triggered the process. Check whether it is a standard user or a higher privilege account, as an elevated privilege may indicate potential malicious intent.

  ---

  ### Prioritization

  This alert carries medium severity, as its detection may indicate an attempt to install persistent malware on systems that could be sensitive or critical. The likelihood of this behavior being malicious is high since it is commonly weaponized to maintain access after a compromise.

  ---

  ### Blind Spots and Assumptions

  There are potential limitations regarding false positives, especially in environments where VirtualBox is legitimately used for development or testing. Reliable detection requires proper logging configurations for process creation and registry activities. Legitimate use cases, such as VirtualBox Guest Additions installations, may trigger this alert. Cross-reference with additional detection rules monitoring unusual registry changes can provide a fuller security picture and help confirm the intent behind the execution.

