title: Suspicious VBoxDrvInst.exe Parameters
id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
status: test
description: |
  Detect VBoxDrvInst.exe run with parameters allowing processing INF file.
  This allows to create values in the registry and install drivers.
  For example one could use this technique to obtain persistence via modifying one of Run or RunOnce registry keys
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OtherBinaries/VBoxDrvInst.yml
- https://twitter.com/pabraeken/status/993497996179492864
author: Konstantin Grishchenko, oscd.community
date: 2020-10-06
modified: 2021-11-27
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\VBoxDrvInst.exe'
    CommandLine|contains|all:
    - 'driver'
    - 'executeinf'
  condition: selection
falsepositives:
- Legitimate use of VBoxDrvInst.exe utility by VirtualBox Guest Additions 
  installation process
level: medium
note: |
  ### Technical Context

  This detection rule identifies suspicious executions of `VBoxDrvInst.exe`, specifically when it runs with parameters that allow the processing of INF files. This behavior is typically used by attackers to install malicious drivers, modify registry keys, or establish persistence mechanisms by adding entries to the Run or RunOnce registry keys. The likely attacker objective is to enable further malicious activities, such as maintaining access to the system after a compromise.

  The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1112** (Modification of Registry). The primary telemetry source consists of Windows process creation logs, specifically Event ID **4688** from the security log and potentially Event ID **4104** from Sysmon for capturing command-line arguments. If malicious, this action may lead to unauthorized driver installations and persistent footholds on the target machine. However, the detection alone does not confirm malicious intent; benign uses during legitimate installations of VirtualBox Guest Additions could trigger the same alert.

  ### Investigation Steps

  - **Examine the process execution details:**
    Review Event ID 4688 for `VBoxDrvInst.exe` execution. Check the command line for indicators such as the presence of `executeinf` and `driver`. This includes fields such as `NewProcessName` and `CommandLine`. Benign entries typically lack these flags.

  - **Identify the parent process:**
    Check the parent process of `VBoxDrvInst.exe` using Event ID 4688 or Sysmon Event ID 1. Legitimate installations are often spawned by installer processes or system updates. Any unusual parent processes should raise suspicion.

  - **Review registry modifications:**
    Investigate modifications in key registry paths related to startup entries, specifically **HKLM\Software\Microsoft\Windows\CurrentVersion\Run** and **HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce**. Look for newly added or altered entries corresponding to the execution time of `VBoxDrvInst.exe`.

  - **Check for file presence in expected paths:**
    Validate the existence of unwanted or unexpected drivers in the `C:\Windows\System32\DriverStore\FileRepository` directory. Malicious drivers may not align with typical VirtualBox driver file structures.

  - **Correlate with network activity:**
    If the execution coincides with network connections, review outbound connections from the host device. Use firewall logs to identify unusual traffic, especially to known bad IPs or domains. Relevant log fields include `DestinationIP` and `Protocol`.

  ### Prioritization

  This alert should be considered medium severity due to its potential to create persistent access on critical systems if the execution is indeed malicious. The `VBoxDrvInst.exe` tool’s normal use in legitimate VirtualBox installations makes it vital to differentiate between benign and malicious intent. However, the parameters flagged in this rule indicate a higher likelihood of abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of `VBoxDrvInst.exe`, particularly during installation processes that run similar commands. It is crucial to have Windows security and Sysmon logs properly configured to capture all process creation events for reliable coverage. Notably, other virtualization tools may also utilize similar executables, which can cause false positives. A related detection to consider is monitoring for modifications to **HKEY_LOCAL_MACHINE** and **HKEY_CURRENT_USER** for unusual persistence mechanism patterns.

