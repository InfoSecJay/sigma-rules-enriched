title: Suspicious VBoxDrvInst.exe Parameters
id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
status: test
description: |
  Detect VBoxDrvInst.exe run with parameters allowing processing INF file.
  This allows to create values in the registry and install drivers.
  For example one could use this technique to obtain persistence via modifying one of Run or RunOnce registry keys
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OtherBinaries/VBoxDrvInst.yml
- https://twitter.com/pabraeken/status/993497996179492864
author: Konstantin Grishchenko, oscd.community
date: 2020-10-06
modified: 2021-11-27
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\VBoxDrvInst.exe'
    CommandLine|contains|all:
    - 'driver'
    - 'executeinf'
  condition: selection
falsepositives:
- Legitimate use of VBoxDrvInst.exe utility by VirtualBox Guest Additions 
  installation process
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `VBoxDrvInst.exe` with parameters associated with processing INF files, which indicates attempts to modify registry values and install drivers. The likely attacker objective is to achieve persistence on a system by exploiting driver installation mechanisms, potentially modifying the Run or RunOnce registry keys. This behavior aligns with the MITRE ATT&CK tactic of Persistence and the technique T1112: Modify Registry.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. The security impact of this behavior, if malicious, includes unauthorized persistence mechanisms and potential escalated privileges via driver execution. Importantly, this detection alone does not confirm malicious activity; benign usage by legitimate software installation (e.g., VirtualBox Guest Additions) can trigger the alert.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `VBoxDrvInst.exe` and note the complete command line used. Look for variations in the parameters that do not indicate benign use.

  - **Analyze registry modifications**: Examine Windows registry for changes associated with `Run` or `RunOnce` keys (e.g., `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run`). Indications of recent modifications, especially from a process like `VBoxDrvInst.exe`, could suggest malicious intent.

  - **Assess historical usage**: Investigate historical runs of `VBoxDrvInst.exe` in the environment. Frequent execution or execution by non-administrative users could imply abuse versus legitimate periodic updates.

  - **Correlation with known malicious indicators**: If identified, correlate with threat intelligence feeds for known malicious hashes or command-line patterns associated with `VBoxDrvInst.exe`. Look for high-confidence malicious indicators, such as unfamiliar or suspicious domains being contacted post-execution.

  - **Confirm legitimate activity**: Consider expected usage scenarios, such as installations or updates related to VirtualBox. Validate any recent software updates or installations within the organization that could justify this behavior.

  ### Prioritization

  The alert severity is medium due to the moderate impact of the affected system, as it relates to potential unauthorized persistence mechanisms. The likelihood of malicious abuse is credible given the common use of driver installations in later stages of compromise. However, because of its legitimate usage in software installations, a full investigation is essential to contextualize the alert.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques where adversaries rename or modify the executable to avoid detection. It requires consistent collection of process creation logs; insufficient logging configurations could lead to gaps in visibility. Additionally, legitimate VirtualBox operations may trigger false positives, necessitating thorough investigation. A related detection, such as monitoring modifications to the registry keys themselves, could enhance coverage and provide a more comprehensive view of persistence attempts.

