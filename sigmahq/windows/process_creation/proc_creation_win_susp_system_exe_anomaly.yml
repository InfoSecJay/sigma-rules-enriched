note: |
  ### Technical Context

  This Sigma rule detects the execution of specific Windows system binaries (e.g., `powershell.exe`, `lsass.exe`) from uncommon locations that deviate from their normal execution paths, indicating potential malicious behavior. Such deviation is often associated with attempts to evade detection by running legitimate processes from unexpected directories, a common tactic used by attackers to execute payloads while blending in with normal system operations.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1562), with technique T1036 (Masquerading). The primary telemetry sources include Windows Process Creation logs, specifically looking at Event ID 4688, which capture commands and execution paths. If the execution is indeed malicious, it could lead to unauthorized access, data exfiltration, or system compromise. This rule does NOT confirm unauthorized activity on its own; further context and analysis are necessary to determine whether the activity is truly malicious.

  ### Investigation Steps

  - **Identify the process location:** Review Event ID 4688 in the Security logs. Check if the execution path of the specified binaries deviates from standard locations (e.g., `C:\Windows\System32\`). Processes executing from paths like `C:\Users\<Username>\AppData\Local\Temp` may indicate malicious activity.

  - **Cross-reference command line arguments:** Analyze the command line parameters associated with the process creation. Look for suspicious arguments (e.g., obfuscation, encoded payloads). This can often indicate malicious intent.

  - **Examine historical behavior:** Check for previous instances of the detected binary executing from legitimate locations using the Sysmon Event ID 1 logs. Established normal behavior can provide context for the current alert. For example, validation that `powershell.exe` typically executes from `C:\Windows\System32\` during administrator tasks can indicate benign activity.

  - **Review associated user activity:** Look up the user account that executed the process in the Active Directory logs. Identify recent activities or anomalies related to this account that could indicate a compromise, such as failed login attempts from unusual IP addresses.

  - **Confirm execution frequency:** Investigate operational logs to determine if this execution pattern is recurrent or a one-off event. Frequent execution of these binaries from uncommon paths may signify a persistent threat.

  - **Correlate with threat intelligence:** Check against Threat Intelligence platforms for any indicators of compromise (IoCs) related to the specific binaries being executed (e.g., `werfault.exe` was recently noted in campaigns associated with known threat actors).

  ### Prioritization

  This alert should be classified with high severity due to the criticality of the affected system components and the high likelihood of malicious exploitation in atypical execution scenarios. The behavior described is often a key component of intrusion tactics used by attackers to bypass defenses.

  ### Blind Spots and Assumptions

  Evasion techniques may include executing processes from legitimate directories or utilizing customized paths that have not been previously established as suspicious. Reliable detection requires comprehensive logging (especially ensuring Security Event and Sysmon logging is properly configured). Legitimate administrative tasks and software installations (e.g., Windows Updates) may trigger this alert as well, necessitating careful contextual review. A related detection is monitoring for unusual network connections initiated by these processes to further assess credibility.

