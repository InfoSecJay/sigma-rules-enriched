note: |
  ### Technical Context

  This detection rule identifies the execution of critical Windows system binaries from unusual locations outside of their standard directories. Such behavior is indicative of potential malicious actions, including attempts to bypass system security mechanisms by executing system files from uncontrolled paths. The likely attacker objective is to gain persistence or execute payloads stealthily while evading standard security controls.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically the technique **Masquerading** (T1036). The primary telemetry sources for this detection include Windows process creation logs, specifically Sysmon Event ID 1 or Windows Security Event ID 4688. If successfully exploited, this could allow adversaries to execute harmful commands with system privileges without raising immediate suspicion. Importantly, detection of the execution of these binaries from uncommon locations does NOT confirm malicious intent on its own — context must be applied to the circumstances of the execution.

  ### Investigation Steps

  - **Verify process execution logs**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 logs for specific instances of the detected binaries (e.g., `powershell.exe`, `lsass.exe`). Pay attention to the `NewProcessName` field to identify the location of execution. Legitimate executions will typically originate from `C:\Windows\System32\` or similar trusted directories.

  - **Examine process command line arguments**: For the identified suspicious process executions, check the command line arguments logged in Event ID 4688 under the `ProcessCommandLine` field. Malicious executions may include obfuscation techniques or unusual flags indicative of exploitative behavior.

  - **Cross-reference user accounts**: Investigate the user accounts executing these processes to identify anomalies. The presence of administrative accounts executing system binaries from unexpected locations could be a strong indicator of malicious intent. Use Event ID 4624 to correlate logins to process executions.

  - **Check the parent process hierarchy**: Analyze the parent-child relationships of the detected processes to identify any unusual patterns in the execution chain. Leadership by a benign process, such as `explorer.exe` or `svchost.exe`, could indicate legitimate use; however, execution from semantically unrelated processes warrants further scrutiny.

  - **Monitor related service changes**: Investigate any recent changes or creations of services in the Windows Service Control Manager for entries related to the detected binaries (e.g., through Event ID 7045). Malicious actors may create or manipulate services to execute system binaries for persistence.

  - **Capture system behavior**: If possible, collect additional telemetry, including network connections (using Windows Firewall logs or Sysmon Network Connect events). Unexpected outbound connections made by the process can indicate exfiltration or callback behavior, especially when associated with unusual execution contexts.

  ### Prioritization

  Given that system binaries executed from atypical locations can indicate serious compromises, this alert is high priority. The impact may include unauthorized access, data breaches, or malware deployment. Such execution patterns are commonly exploited by adversaries seeking to evade detection, thereby heightening the need for prompt investigation.

  ### Blind Spots and Assumptions

  Evasion techniques, such as modifying process execution paths or using legitimate administrative tools to execute malicious code, may limit the effectiveness of this rule. Required log sources include comprehensive Sysmon configurations and Windows Security Auditing. Legitimate activities, such as software updates or administrative tasks performed by trusted users, may also trigger this alert. A related detection for lateral movement activities or abnormal scheduled task creations may strengthen overall coverage of potential threats.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
