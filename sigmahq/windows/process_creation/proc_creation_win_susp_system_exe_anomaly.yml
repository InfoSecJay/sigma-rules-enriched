note: |
  ### Technical Context

  This Sigma rule detects the execution of specific Windows system binaries from locations outside their expected directories, which may indicate malicious activity. The likely attacker objective is to execute system binaries that are a part of the Windows operating system from non-standard locations, potentially as a method to evade detection or manipulate system behavior. This behavior is associated with the MITRE ATT&CK technique T1036: Masquerading.

  Primary telemetry sources include Windows Process Creation logs, specifically looking at Event ID 4688, which records the creation of a process along with the execution path. If malicious, this could allow an adversary to execute harmful actions under the guise of legitimate system processes. Notably, this detection does NOT confirm that the detected process is malicious; it only indicates that a system binary was executed from an uncommon location.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation details:** Look for the execution path of the detected binaries in the Windows Security Log (Event ID 4688) to see if they originate from standard locations such as `C:\Windows\System32\`.

  - **Identify anomalous file locations:** Review the process creation logs for indicators of execution from paths like `C:\$WINDOWS.~BT\` or `C:\Users\<User>\AppData\Local\` which are uncommon for these executables and suggest potential evasion tactics.

  - **Examine the user context:** Determine which user initiated the process by checking the Event ID 4688 logs. Legitimate system processes are often triggered by system accounts or service accounts, while user accounts executing these may require further investigation.

  - **Monitor for associated network activity:** Check network logs for outbound connections made by the processes. For example, look for HTTP or DNS requests in a proxy log or Firewall log that are indicative of data exfiltration attempts or command and control communication.

  - **Review historical execution patterns:** Assess whether the detected binaries are regularly running from the reported location. Identify if this behavior is part of a trend or anomaly by comparing historical process execution data.

  ### Prioritization

  This alert has a high severity due to the potential impact of executing system binaries from unusual locations, which may indicate an active compromise. The likelihood of malicious abuse is significant, as attackers often leverage legitimate binaries to avoid detection and achieve their objectives. This behavior has been observed in real-world attacks, reinforcing its relevance in threat detection.

  ### Blind Spots and Assumptions

  The detection may miss instances where legitimate applications are misconfigured or exploited by malicious actors. Not all uncommon execution paths indicate malicious intent, as legitimate applications or user behaviors could also lead to such events. Coverage can be strengthened by implementing additional detections related to suspicious parent-child relationships in process creation (e.g., monitoring parent process IDs) for better visibility into process activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
