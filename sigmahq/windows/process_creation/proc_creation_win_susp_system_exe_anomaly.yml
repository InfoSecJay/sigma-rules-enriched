note: |
  ### Technical Context

  This Sigma rule detects the execution of critical Windows system binaries from unusual locations, potentially indicating an attempt to evade detection or execute malicious payloads. The likely attacker objective is to leverage trusted system processes to blend in with normal operations, facilitating malicious activities such as lateral movement, credential harvesting, or persistent access. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005) and the technique is **Masquerading** (T1036).

  The primary telemetry sources for this detection come from **Windows process creation logs**, specifically Event ID 4688 or Sysmon Event ID 1. If this behavior is indeed malicious, it could lead to severe security impacts, including unauthorized access to sensitive data or system control. However, it is important to note that this detection does NOT conclusively prove that an attack is underway, as benign applications may trigger the same alert.

  ### Investigation Steps

  - **Verify process origin location:** Review Event ID 4688 for the image path of the executed binary. Check if the path deviates from typical locations such as `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Trusted binaries should usually reside in these directories.

  - **Identify the user context:** Examine the user account associated with the process creation in Event ID 4688. If the binary was executed under a system account when not expected (e.g., a user account executing elevated system processes), it could be indicative of malicious activity.

  - **Investigate command line arguments:** Analyze the command line arguments of the executed processes, which can be found in Event ID 4688 or Sysmon Event ID 1 (Process Command Line field). Look for obfuscation or unusual flags that might suggest a malicious intent.

  - **Check the process tree:** Use process tree data from Sysmon to determine if any parent processes (e.g., `powershell.exe`, `cmd.exe`) are known to be used for malicious activities. The execution of system binaries from uncommon parent processes can indicate malicious exploitation.

  - **Examine historical data:** Cross-reference any historical logs involving the same binaries executed from legitimate locations versus their appearance from the anomalous locations. This can help establish if this is an uncommon execution pattern for that system or user.

  ### Prioritization

  This alert is of **high severity** due to the potential security impact on critical systems. Unauthorized execution of system binaries from uncommon locations is a tactic frequently exploited by advanced adversaries, making the likelihood of malicious abuse high, especially if linked to known attack patterns.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if processes leverage legitimate binaries in non-standard ways. Common legitimate activities, such as remote desktop services or in-house scripts, may inadvertently trigger this alert. Additionally, related detections may include rules targeting process injection or abnormal process spawning, which can further bolster the analysis of suspected threats.

