logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\atbroker.exe'
    - '\audiodg.exe'
    - '\bcdedit.exe'
    - '\bitsadmin.exe'
    - '\certreq.exe'
    - '\certutil.exe'
    - '\cmstp.exe'
    - '\conhost.exe'
    - '\consent.exe'
    - '\cscript.exe'
    - '\csrss.exe'
    - '\dashost.exe'
    - '\defrag.exe'
    - '\dfrgui.exe'         # Was seen used by Lazarus Group - https://asec.ahnlab.com/en/39828/
    - '\dism.exe'
    - '\dllhost.exe'
    - '\dllhst3g.exe'
    - '\dwm.exe'
    - '\eventvwr.exe'
    - '\finger.exe'
    - '\logonui.exe'
    - '\LsaIso.exe'
    - '\lsass.exe'
    - '\lsm.exe'
    - '\msiexec.exe'
    - '\ntoskrnl.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\runonce.exe'
    - '\RuntimeBroker.exe'
    - '\schtasks.exe'
    - '\services.exe'
    - '\sihost.exe'
    - '\smartscreen.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\taskhost.exe'
    - '\taskhostw.exe'
    - '\Taskmgr.exe'
    - '\userinit.exe'
    - '\werfault.exe'
    - '\werfaultsecure.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    - '\winver.exe'
    - '\wlanext.exe'
    - '\wscript.exe'
    - '\wsl.exe'
    - '\wsmprovhost.exe'         # Was seen used by Lazarus Group - https://asec.ahnlab.com/en/39828/
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemTemp\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\uus\'
    - 'C:\Windows\WinSxS\'
  filter_optional_system32:
    Image|contains: '\SystemRoot\System32\'
  filter_main_powershell:
    Image|contains:
    - 'C:\Program Files\PowerShell\7\'
    - 'C:\Program Files\PowerShell\7-preview\'
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'         # pwsh installed from Microsoft Store
    Image|endswith: '\pwsh.exe'
  filter_main_wsl_programfiles:
    Image|startswith:
    - 'C:\Program Files\WindowsApps\MicrosoftCorporationII.WindowsSubsystemForLinux'
    - 'C:\Program Files\WSL\'
    Image|endswith: '\wsl.exe'
  filter_main_wsl_appdata:
    Image|startswith: C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\WindowsApps\'
    Image|endswith: '\wsl.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of specific Windows system binaries from locations outside their expected directories, which indicates potential abuse for malicious purposes. Attackers may attempt to execute these binaries from uncommon locations to conduct unauthorized actions while avoiding detection. This behavior is aligned with the MITRE ATT&CK framework's Defense Evasion tactic (T1036), which encompasses techniques for disguising malicious activities.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity could lead to significant security impacts, such as unauthorized access, lateral movement, or execution of payloads. Importantly, this detection does not confirm malicious intent on its own; legitimate applications may mimic this behavior under specific circumstances.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for anomalies regarding the execution paths of critical system binaries like `powershell.exe` or `dfrgui.exe`. Look for processes originating from unusual directories not aligned with their typical locations (e.g., executed from `C:\Users\<username>\Downloads\`).

  - **Validate known good locations:** Identify expected execution paths for these binaries (e.g., `C:\Windows\System32\`). Cross-reference any observed execution paths with a list of legitimate software and application deployment practices within the environment.

  - **Identify execution parameters:** Examine the command-line parameters for additional context. Legitimate commands often have recognizable parameters—malicious execution may contain obfuscation or unexpected flags.

  - **Check for process parent relationships:** Investigate parent and child process relationships in the process creation logs. For example, if a malicious `conhost.exe` is detected, its parent process (such as `cmd.exe` or `powershell.exe`) should also be assessed for suspicious activity.

  - **Assess for file artifacts:** Look for any newly created files or logs in the `%TEMP%` directory or other common safe zones that may indicate file drops or download activity. Validate file hashes against known malware signatures.

  - **Capture system criticality:** Determine if the executed binaries run on high-value assets (e.g., domain controllers or sensitive server roles). The compromise of these systems elevates the alert's priority and response urgency.

  ### Prioritization

  This alert is classified as high severity due to the potential critical impact of compromised system binaries and the likelihood of malicious execution methods. The nature of this behavior is commonly weaponized by adversaries to gain footholds in target environments, increasing the urgency of investigation and response.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of audit logging configurations or if logs are improperly filtered, potentially overlooking the execution of system binaries. Legitimate administrative actions, like software installation or maintenance tasks using `powershell.exe`, could trigger this alert. A related detection to consider is monitoring for unusual PowerShell execution patterns or script block logging, which can provide broader context for evaluating the alert.

