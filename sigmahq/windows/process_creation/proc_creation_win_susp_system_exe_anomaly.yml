title: System File Execution Location Anomaly
id: e4a6b256-3e47-40fc-89d2-7a477edd6915
related:
- id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd     # Dedicated SvcHost rule
  type: derived
status: test
description: |
  Detects the execution of a Windows system binary that is usually located in the system folder from an uncommon location.
references:
- https://twitter.com/GelosSnake/status/934900723426439170
- https://asec.ahnlab.com/en/39828/
- https://www.splunk.com/en_us/blog/security/inno-setup-malware-redline-stealer-campaign.html
author: Florian Roth (Nextron Systems), Patrick Bareiss, Anton Kutepov, oscd.community,
  Nasreddine Bencherchali (Nextron Systems)
date: 2017-11-27
modified: 2025-11-23
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\atbroker.exe'
    - '\audiodg.exe'
    - '\bcdedit.exe'
    - '\bitsadmin.exe'
    - '\certreq.exe'
    - '\certutil.exe'
    - '\cmstp.exe'
    - '\conhost.exe'
    - '\consent.exe'
    - '\cscript.exe'
    - '\csrss.exe'
    - '\dashost.exe'
    - '\defrag.exe'
    - '\dfrgui.exe'         # Was seen used by Lazarus Group - https://asec.ahnlab.com/en/39828/
    - '\dism.exe'
    - '\dllhost.exe'
    - '\dllhst3g.exe'
    - '\dwm.exe'
    - '\eventvwr.exe'
    - '\logonui.exe'
    - '\LsaIso.exe'
    - '\lsass.exe'
    - '\lsm.exe'
    - '\msiexec.exe'
    - '\ntoskrnl.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\runonce.exe'
    - '\RuntimeBroker.exe'
    - '\schtasks.exe'
    - '\services.exe'
    - '\sihost.exe'
    - '\smartscreen.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\taskhost.exe'
    - '\taskhostw.exe'
    - '\Taskmgr.exe'
    - '\userinit.exe'
    - '\werfault.exe'
    - '\werfaultsecure.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    - '\winver.exe'
    - '\wlanext.exe'
    - '\wscript.exe'
    - '\wsl.exe'
    - '\wsmprovhost.exe'         # Was seen used by Lazarus Group - https://asec.ahnlab.com/en/39828/
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemTemp\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\uus\'
    - 'C:\Windows\WinSxS\'
  filter_optional_system32:
    Image|contains: '\SystemRoot\System32\'
  filter_main_powershell:
    Image|contains:
    - 'C:\Program Files\PowerShell\7\'
    - 'C:\Program Files\PowerShell\7-preview\'
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'         # pwsh installed from Microsoft Store
    Image|endswith: '\pwsh.exe'
  filter_main_wsl_programfiles:
    Image|startswith:
    - 'C:\Program Files\WindowsApps\MicrosoftCorporationII.WindowsSubsystemForLinux'
    - 'C:\Program Files\WSL\'
    Image|endswith: '\wsl.exe'
  filter_main_wsl_appdata:
    Image|startswith: C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\WindowsApps\'
    Image|endswith: '\wsl.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the anomalous execution of Windows system binaries from unusual locations. In legitimate scenarios, system binaries typically execute from well-known paths such as `C:\Windows\System32`. However, attackers may exploit these legitimate binaries to execute malicious payloads from uncommon locations, effectively evading detection. The objectives of such behavior could include privilege escalation, lateral movement, or the execution of payloads by manipulating native system processes, utilizing trusted binaries as a vector for malicious actions.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include "Defense Evasion" (TA0005) and "Execution" (TA0002), particularly focusing on techniques like "Masquerading" (T1036). Attackers often use well-known binaries to blend into normal operations, further complicating the detection process.

  Primary data sources for collecting evidence to investigate this type of behavior include process creation logs from the endpoint (EDR data), where detailed information about executed files and their originating paths can be observed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze logs from process creation events to understand the execution context of the binaries detected. Pay attention to the paths from which the binaries are executed to validate whether they deviate from expected locations.

  - **Correlate with User Activity**: Check user activity logs around the time of the anomaly. Look for any recent logon events, file access, or administrative command execution that may correlate with the suspicious process creation.

  - **Assess File Integrity and Origin**: Investigate the integrity and origins of the binaries executed from uncommon paths. Cross-reference hashes of the binaries against known good signatures and check if the files have unusual modifications or are present in atypical locations.

  - **Utilize Threat Intelligence Feeds**: Leverage threat intelligence to assess whether the binaries in question are associated with known threat actors or malware campaigns. Utilize resources that highlight similar behaviors, such as those noted in related blog articles or reports.

  ### Prioritization
  This alert is categorized as high severity due to the potential for exploitation that comes with the execution of system binaries from uncommon locations. The likelihood of an attacker using these techniques to bypass security measures and the potential impact on the organization justify prioritizing the investigation of these alerts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the rule's logic fails to account for legitimate use cases of system binaries executed from atypical paths, such as during system updates or application installations. The detection logic assumes that any execution from uncommon locations is potentially malicious, which may not always be valid. Additionally, this alert requires comprehensive process creation logs to function properly; if logs are not enabled or retained for sufficient duration, detection may be ineffective.

