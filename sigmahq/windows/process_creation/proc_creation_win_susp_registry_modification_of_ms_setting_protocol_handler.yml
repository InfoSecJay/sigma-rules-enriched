logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_reg_cli:
    CommandLine|contains: 'add'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'New-ItemProperty'
    - 'Set-ItemProperty'
    - 'ni '
    - 'sp '
  selection_cli_key:
    CommandLine|contains: '\ms-settings\shell\open\command'
  condition: (all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized modifications to the Windows registry, specifically targeting the 'ms-settings' protocol handler. Attackers often alter this key to achieve UAC (User Account Control) bypass or to establish persistence, enabling them to execute malicious code with elevated privileges when users interact with certain system settings. By hijacking the command execution path of the 'ms-settings' protocol, adversaries can run their own applications or scripts, circumventing standard security measures.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1548.002)**, where attackers manipulate security features to gain access, **Persistence (T1546.001)**, which encompasses techniques for maintaining their presence in the system, and **Privileged Escalation (T1112)**, which allows them to elevate privileges. These techniques highlight the attacker’s objective of maintaining control over compromised systems.

  The primary data sources for this detection include process creation events, which log the execution of commands that may alter registry settings, and Windows registry logs that capture changes to the 'ms-settings' command paths.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for any executions of `reg.exe` and `powershell.exe` that include commands to modify the registry. Focus on the command lines and parent processes for context.

  - **Analyze Registry Changes:** Investigate the Windows registry for alterations in the 'ms-settings' protocol handler. Use tools like `regedit` or PowerShell to export the relevant keys for comparison against baseline evidence.

  - **Correlate User Activity:** Examine user actions before and after the modification to the ms-settings handler. Identify if the changes align with legitimate administrative tasks or if they were conducted in the absence of normal user behavior.

  - **Check for Persistence Mechanisms:** Look for other registry keys or scheduled tasks that may be linked to the observed modifications. This may indicate broader persistence strategies employed by the attacker.

  ### Prioritization
  This alert has medium severity due to the potential for elevated privileges and persistent access it provides to attackers. The likelihood of exploitation is increased as this is a known method for attackers seeking to bypass user access controls.

  ### Blind Spots and Assumptions
  There may be gaps in detection for legitimate administrative tasks that also modify the 'ms-settings' registry path, which could lead to false positives. The detection logic assumes that all relevant registry changes are logged and that users performing legitimate modifications will be captured by process creation logs. For the alert to function optimally, proper monitoring configurations must be in place, including robust logging for process execution and registry modifications.

