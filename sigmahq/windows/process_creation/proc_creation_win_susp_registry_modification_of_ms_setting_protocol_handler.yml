logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_reg_cli:
    CommandLine|contains: 'add'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'New-ItemProperty'
    - 'Set-ItemProperty'
    - 'ni '
    - 'sp '
  selection_cli_key:
    CommandLine|contains: '\ms-settings\shell\open\command'
  condition: (all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects unauthorized modifications to the 'ms-settings' protocol handler in the Windows registry, which can facilitate privilege escalation or persistence for attackers. The likely attacker objective is to hijack the command execution path to run malicious code with elevated privileges, potentially leading to further system compromise. This behavior is aligned with the MITRE ATT&CK techniques of **Privilege Escalation (T1548.002)** and **Persistence (T1546.001)**.

  The primary telemetry source for this detection includes process creation logs from the Windows operating system, particularly looking for activity related to `reg.exe` or PowerShell commands that attempt to modify registry entries. Should this activity be malicious, it could allow an attacker to gain elevated execution capabilities within the environment. Notably, this rule does **not confirm** that a malicious activity occurred solely on its own; further investigation is necessary to ascertain the intent and context behind the modification.

  ---

  ### Investigation Steps

  - **Identify the process responsible for the modification:** Review Security Event ID **4688** for process creation logs. Look for entries associated with `reg.exe` or `powershell.exe`, and confirm the parent process. Legitimate usage might include system updates or administrator tasks.

  - **Verify command-line arguments used in modification:** Check for entries where CommandLine contains `add` (for `reg.exe`) or PowerShell commands such as `New-ItemProperty` and `Set-ItemProperty`. The use of `\ms-settings\shell\open\command` is critical; if it appears in context with the user’s behavior, it may indicate legitimate activity.

  - **Assess user context:** Examine the user account associated with the log entries. A modification by an administrative account during business hours may be benign, while similar activity executed by a standard user at odd hours warrants deeper scrutiny.

  - **Investigate event logs for surrounding context:** Gather relevant Security Event IDs **4624** (logon) and **4672** (special privileges assigned to new logon) that occurred around the same period. This will help determine if the behavior correlates with unauthorized access attempts.

  - **Correlate with extant malware activity:** Utilize threat intelligence platforms or internal threat insights to check for known malware signatures that include registry modifications as part of their infection vectors; look for indicators of compromise.

  - **Monitor for evidence of persistence:** Check for further modifications to the registry path post-event and search for indicators within Application logs (Event ID **1500**) to see if subsequent changes have taken place, indicating continued exploitation efforts.

  ---

  ### Prioritization

  The severity of this alert should be considered medium. Modifying the registry for the 'ms-settings' handler can enable significant control over the system, making it a common tactic among advanced threats. The likelihood of malicious abuse is considerable given the frequency of associated techniques in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion techniques such as registry modifications using legitimate administrative tools that do not generate alerts. Reliable detection also requires having process creation logs enabled for all endpoints. Legitimate activities, such as automated system configuration changes or software installations that do modify the registry, may inadvertently trigger this alert. A related detection to enhance coverage could involve monitoring registry access patterns using Sysmon events, particularly Event ID **10** for registry changes.

