logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_reg_cli:
    CommandLine|contains: 'add'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'New-ItemProperty'
    - 'Set-ItemProperty'
    - 'ni '
    - 'sp '
  selection_cli_key:
    CommandLine|contains: '\ms-settings\shell\open\command'
  condition: (all of selection_reg_* or all of selection_pwsh_*) and 
    selection_cli_key
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies unauthorized modifications to the registry associated with the 'ms-settings' protocol handler. Attackers may alter this registry entry to enable code execution with elevated privileges, which is commonly utilized for tactics like UAC bypass or persistence. These actions fit into the MITRE ATT&CK framework under the tactics of **Defense Evasion (T1548.002)** and **Persistence (T1546.001)**.

  The primary telemetry source for this detection is Windows process creation logs, specifically capturing events related to registry commands executed via `reg.exe` or PowerShell. If exploited, these alterations may allow an attacker to gain high-level administrative control over a system. However, the alert does not in isolation confirm malicious intent; benign registry changes can also trigger this detection.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 for instances of `reg.exe` or `powershell.exe` with CommandLine fields containing 'add', 'New-ItemProperty', or 'Set-ItemProperty'. Note the parent processes; legitimate instances usually correspond to system management tasks.

  - **Identify registry modification patterns**: Look for alterations in **HKEY_CLASSES_ROOT\ms-settings** and confirm if the command path points incorrectly to a malicious executable. Expected behavior typically involves system components making controlled changes.

  - **Capture details on abnormal command usage**: If the CommandLine includes `\ms-settings\shell\open\command`, cross-reference with existing documentation for legitimate PowerShell scripts or processes. Analyze for anomalies or suspicious commands, particularly those invoking uncommon executables.

  - **Validate file creation or spawning**: Check for any newly created files or modifications in system paths, especially around the registry changes. Utilize Sysmon Event ID 11 to trace these activities and flag any non-standard or suspicious file activity.

  - **Assess asset criticality**: Consider the role of the affected system. If it hosts sensitive data or critical operations, prioritize a deeper investigation into the alert, as exploitation may yield significant compromise.

  ### Prioritization

  The severity of this alert is medium. Modifications to the 'ms-settings' registry can facilitate significant privilege escalation and persistence, making it a likely target for attackers seeking to maintain footholds in enterprise environments. The prevalence of these techniques among known adversaries raises concern, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection efficacy is limited if logging configurations exclude detailed process command lines or registry access. Additionally, legitimate administrative actions, like system updates or configuration tweaks, can also trigger this alert. Related detections, such as those focused on unauthorized Windows service modifications, can enhance visibility into potential malicious activities exploiting similar techniques.

