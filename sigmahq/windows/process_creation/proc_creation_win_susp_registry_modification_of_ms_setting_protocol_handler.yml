logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_reg_cli:
    CommandLine|contains: 'add'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'New-ItemProperty'
    - 'Set-ItemProperty'
    - 'ni '
    - 'sp '
  selection_cli_key:
    CommandLine|contains: '\ms-settings\shell\open\command'
  condition: (all of selection_reg_* or all of selection_pwsh_*) and 
    selection_cli_key
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized modifications to the Windows registry related to the 'ms-settings' protocol handler. Attackers may exploit these modifications as part of privilege escalation techniques or to establish persistence mechanisms, allowing them to execute malicious code with elevated privileges. The relevant MITRE ATT&CK tactics include **Persistence (T1548.002)** and **Privilege Escalation (T1546.001)**. The primary telemetry source for this detection includes Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, with focus on command line arguments. If an alert is confirmed as malicious, it poses significant risk, as it can allow an attacker to bypass User Account Control (UAC) and execute harmful actions on the system. However, this detection does NOT confirm that the behavior is malicious without additional context.

  ### Investigation Steps

  - **Review command line parameters:** Check Security Event ID 4688 or Sysmon Event ID 1 for `reg.exe` or PowerShell process creation events including the command line containing `add`, `New-ItemProperty`, or `Set-ItemProperty` to identify potential registry modifications.

  - **Assess registry changes:** Using `reg query` and `reg edit` logs, confirm if the registry key `HKEY_CLASSES_ROOT\ms-settings\shell\open\command` has been added or modified, indicating possible malicious intent.

  - **Identify baseline behavior:** Examine typical usage of `ms-settings` protocol within the environment, such as administrative tasks performed via GUI and legitimate registry vendor applications, to differentiate from abnormal modifications.

  - **Look for known malicious signatures:** Identify if the modified command points to known malicious executables or paths (e.g., those associated with past incidents observed in similar threats like Diavol ransomware), tagged in historical incident reports.

  - **Cross-reference user accounts:** Determine if the process creating the registry modification is executed under administrative privileges or a standard user account—this may indicate whether actions are legitimate or potentially harmful.

  ### Prioritization

  This alert is considered medium severity due to the potential for extensive impact if the incident allows unauthorized execution with elevated privileges on critical systems. The likelihood of malicious exploitation is moderate, especially as behaviors similar to those detected are commonly used in privilege escalation and persistence techniques.

  ### Blind Spots and Assumptions

  Alert limitations include the potential for legitimate admin activities or misconfigurations that could trigger false positives for registry modifications. Ensure that logs for process command line executions and registry activities are thoroughly configured and collected for accurate detection. Similar detections related to unauthorized changes in other protocol handlers may also provide supporting evidence for comprehensive monitoring.

