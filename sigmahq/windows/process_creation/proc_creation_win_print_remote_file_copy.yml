title: Abusing Print Executable
id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
status: test
description: Attackers can use print.exe for remote file copy
references:
- https://lolbas-project.github.io/lolbas/Binaries/Print/
- https://twitter.com/Oddvarmoe/status/985518877076541440
author: 'Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative'
date: 2020-10-05
modified: 2022-07-07
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\print.exe'
    CommandLine|startswith: 'print'
    CommandLine|contains|all:
    - '/D'
    - '.exe'
  filter_print:
    CommandLine|contains: 'print.exe'
  condition: selection and not filter_print
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `print.exe` with command-line arguments that suggest an attempt to use its functionality for remote file copying, potentially indicating malicious behavior. The likely objective of an attacker employing this technique is to exfiltrate sensitive files or to establish persistence by copying executables to the target system. This behavior aligns with the MITRE ATT&CK framework, specifically the tactic of Lateral Movement (TA0008) and technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide the necessary details regarding process initiation. If exploited maliciously, this could lead to unauthorized data access or system compromise. It is important to note that this detection does NOT confirm malicious intent on its own; benign administrative tasks might trigger the same rule.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 to confirm the execution of `print.exe` and identify the user context and parent process. Look for unusual parent processes that may suggest a malicious chain (e.g., a PowerShell process).

  - **Analyze command-line arguments:** Focus on command-line parameters—specifically, those containing `/D` and `.exe`. Compare against known benign usages, such as standard printing workflows, to differentiate between legitimate and suspicious activity.

  - **Correlate with network traffic:** Examine firewall or proxy logs for outbound connections initiated shortly after `print.exe` execution, especially targeting uncommon external IP addresses or domain names. Malicious activity may show connections to known command-and-control servers.

  - **Identify legitimate usage patterns:** Refer to documentation for expected uses of `print.exe` in an administrative context, noting that normal operations typically involve printing tasks (e.g., printing documents) rather than file transfers.

  - **Check for file creation or modification:** Investigate Windows Event ID 4663 to see if `print.exe` initiated any file creations or other modifications that correlate with remote file copying activity.

  - **Evaluate asset criticality:** If the execution of `print.exe` is detected on critical assets such as domain controllers or servers with sensitive data, prioritize the investigation over less critical systems.

  ### Prioritization

  The alert carries medium severity due to its potential impact on sensitive environments where exfiltration or lateral movement could occur. The likelihood of abuse is moderate, as attackers may employ this technique to circumvent typical security measures. This specific behavior is not extremely common but can be critical if leveraged for malicious purposes.

  ### Blind Spots and Assumptions

  Limitations may arise due to the use of genuine administrative tasks that can trigger this alert, creating false positives. Reliable detection depends on proper logging configurations, specifically ensuring that process creation and network activity are thoroughly monitored. Additionally, legitimate software installations or printing services may generate similar command line activations. Consider deploying companion detections for file transfers involving `robocopy` or `xcopy` for enhanced coverage on data exfiltration tactics.

