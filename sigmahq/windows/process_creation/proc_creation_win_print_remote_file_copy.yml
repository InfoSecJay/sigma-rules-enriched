title: Abusing Print Executable
id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
status: test
description: Attackers can use print.exe for remote file copy
references:
- https://lolbas-project.github.io/lolbas/Binaries/Print/
- https://twitter.com/Oddvarmoe/status/985518877076541440
author: 'Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative'
date: 2020-10-05
modified: 2022-07-07
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\print.exe'
    CommandLine|startswith: 'print'
    CommandLine|contains|all:
    - '/D'
    - '.exe'
  filter_print:
    CommandLine|contains: 'print.exe'
  condition: selection and not filter_print
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_print_remote_file_copy/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `print.exe` with command line arguments that indicate potential abuse for remote file transfer. The likely objective of an attacker using this technique is to facilitate unauthorized file copying or exfiltration from a compromised machine. This activity aligns with the MITRE ATT&CK technique "Abuse Elevation Control Mechanism" (T1218), highlighting the exploitation of trusted binaries for malicious purposes.

  The primary telemetry source involved is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this behavior may lead to data loss or unauthorized access to sensitive information. However, this detection does NOT confirm whether any data was successfully exfiltrated or whether the activity was conducted by a legitimate user.

  ### Investigation Steps

  - **Validate process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for `print.exe`. Check the `CommandLine` field for parameters that include `/D` and `.exe`. Legitimate use typically lacks these parameters in combination, while suspicious cases will showcase them.

  - **Examine recent user actions**: Investigate user activity leading up to this process start time by checking the Event ID 4624 (Logon events) for unusual timeframes or failed login attempts.

  - **Correlate with other logs**: Look for any corresponding events in file access logs (Event ID 4663) that show interaction with critical files or directories around the same timestamp as the execution of `print.exe`. Confirm benign activity based on normal operational workflows.

  - **Identify malicious hashes**: Compare the hash of the `print.exe` process against known malicious signatures using a threat intelligence database. If the hash is flagged, escalate the incident.

  - **Review device health**: Assess the affected host's criticality and security posture, such as whether it is a server or workstation, to determine the potential impact and urgency of the investigation.

  - **Check for unusual outbound connections**: Analyze network traffic logs for connections made shortly after `print.exe` execution, especially if any exhibit abnormal behavior (e.g., data transfer to unknown IP addresses).

  ### Prioritization

  This alert is of medium severity, as the behavior could indicate file exfiltration or unauthorized actions on critical systems. The likelihood of malicious usage is moderate, given that the technique takes advantage of a native Windows utility which might commonly be utilized in both benign and malicious contexts.

  ### Blind Spots and Assumptions

  The detection may be limited by the potential for attackers to evade detection by using different command-line arguments or alternative methods to download files. It is essential to ensure that Endpoint Detection and Response (EDR) solutions are configured to capture all relevant logs from the affected systems effectively. Legitimate print operations by users might also trigger this alert, complicating the review process. Companion detections around abnormal file access or data transfer activities can provide broader context and enhance detection efficacy for potential threats.

