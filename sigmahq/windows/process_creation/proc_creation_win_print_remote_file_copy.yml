title: Abusing Print Executable
id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
status: test
description: Attackers can use print.exe for remote file copy
references:
- https://lolbas-project.github.io/lolbas/Binaries/Print/
- https://twitter.com/Oddvarmoe/status/985518877076541440
author: 'Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative'
date: 2020-10-05
modified: 2022-07-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\print.exe'
    CommandLine|startswith: 'print'
    CommandLine|contains|all:
    - '/D'
    - '.exe'
  filter_print:
    CommandLine|contains: 'print.exe'
  condition: selection and not filter_print
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `print.exe` with command-line arguments indicating an attempt to use the Windows Print Spooler service for file copying, which is an uncommon usage pattern often abused by attackers for lateral movement or to facilitate file exfiltration. The likely attacker objective is to leverage legitimate system processes to evade detection while performing malicious actions.

  This behavior aligns with the MITRE ATT&CK technique "Exploitation of Vulnerability" (T1218) within the tactic of Defense Evasion. The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which record process spawning events and command-line arguments. If executed maliciously, this could lead to unauthorized file transfers or remote code execution. Importantly, this rule does NOT confirm malicious intent without additional context—such as the source of the command and the legitimacy of the executed file.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 for instances where `Image` ends with `\print.exe` and includes command-line arguments starting with `print` and containing `/D` and `.exe`.

  - **Analyze command-line arguments**: Look for unusual or unexpected command-line parameters in `CommandLine` that do not align with standard print jobs. Legitimate usage typically involves printing documents without executable file references.

  - **Validate source of execution**: Identify the initiating user and machine context. If the command is executed by a non-privileged user on a non-printing workstation, this could indicate malicious intent.

  - **Check for file transfers**: Monitor for associated file changes or transfers in relevant logs (such as File System Change Logs or Security Event ID 4663, which details file access) that may confirm any unauthorized movement of files typically associated with `print.exe`.

  - **Identify recurring patterns**: Look for the same user or machine executing `print.exe` in patterns that may suggest a scripted or automated approach to malicious file copying.

  ### Prioritization

  This alert should be classified as medium severity. The security impact could be significant if a critical system is compromised, potentially allowing an attacker to transfer sensitive files or deploy further malware. Although not as commonly weaponized as other attack vectors, the misuse of `print.exe` represents a growing trend in evasion tactics.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging for all instances of `print.exe`, potentially allowing attackers to delete or diminish logs after executing their code. This alert might also trigger due to legitimate administrative procedures or automated tasks involving print services. A related detection that bolsters coverage is monitoring for anomalies in the use of Print Spooler services or unexpected network connections from instances of `print.exe`.

