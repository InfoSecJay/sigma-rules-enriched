title: Abusing Print Executable
id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
status: test
description: Attackers can use print.exe for remote file copy
references:
- https://lolbas-project.github.io/lolbas/Binaries/Print/
- https://twitter.com/Oddvarmoe/status/985518877076541440
author: 'Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative'
date: 2020-10-05
modified: 2022-07-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\print.exe'
    CommandLine|startswith: 'print'
    CommandLine|contains|all:
    - '/D'
    - '.exe'
  filter_print:
    CommandLine|contains: 'print.exe'
  condition: selection and not filter_print
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the unauthorized use of the `print.exe` executable. Attackers may leverage this legitimate Windows utility to perform remote file copying, a behavior typically associated with data exfiltration or lateral movement within a network. By abusing `print.exe`, adversaries aim to transfer files covertly, making it a preferred method for avoiding traditional detection mechanisms. The primary objective is often to steal sensitive data or facilitate further attacks on internal resources.

  The relevant MITRE ATT&CK techniques include **T1218: Signed Binary Proxy Execution**, as this technique involves the execution of trusted binaries to accomplish malicious goals without raising alarms. Attackers using `print.exe` may aim at bypassing security controls by exploiting the executable's legitimate purpose.

  Primary data sources for this detection rule include **process creation events** that log the invocation of executables on Windows systems. Capturing detailed command-line arguments will provide further insights into the intent and activity being conducted by `print.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows Event logs for process creation events to identify instances of `print.exe` being executed. Pay close attention to the command-line arguments used.
  - **Analyze Command-Line Arguments**: Investigate the command-line details to determine if `print.exe` is being used to direct printing tasks to suspicious third-party executables. Look for `/D` flags pointing to unusual or unrecognized network printers.
  - **Identify File Transfer Activity**: Search network logs for unusual outbound connections or file transfers to detect potential exfiltration activity associated with the use of `print.exe`.
  - **Look for Anomalous User Behavior**: Correlate the execution of `print.exe` with user activities, particularly for accounts that do not typically engage in printing or administrative tasks, to identify potential account compromise.

  ### Prioritization
  Given the medium severity of this alert, any detected execution of `print.exe` under suspicious conditions warrants immediate investigation, particularly in environments handling sensitive data. The likelihood of misuse is significant due to its dual-use nature as a legitimate utility.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if process creation logs are not being retained or if command-line argument logging is disabled. The logic assumes that all instances of `print.exe` with the specified command-line characteristics are malicious, which may not always hold true. Additionally, proper logging configurations on endpoints are necessary for this alert to be effective, including capturing both process creation events and detailed command-line parameters.

