title: Suspicious Vsls-Agent Command With AgentExtensionPath Load
id: 43103702-5886-11ed-9b6a-0242ac120002
status: test
description: Detects Microsoft Visual Studio vsls-agent.exe lolbin execution 
  with a suspicious library load using the --agentExtensionPath parameter
references:
- https://twitter.com/bohops/status/1583916360404729857
author: bohops
date: 2022-10-30
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vsls-agent.exe'
    CommandLine|contains: '--agentExtensionPath'
  filter:
    CommandLine|contains: 'Microsoft.VisualStudio.LiveShare.Agent.'
  condition: selection and not filter
falsepositives:
- False positives depend on custom use of vsls-agent.exe
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of the `vsls-agent.exe` process with the `--agentExtensionPath` command-line argument, which is indicative of potential adversarial behavior. Attackers may leverage this behavior to execute malicious code or load unauthorized extensions, with the objective of maintaining access, exfiltrating data, or executing further attacks. This activity aligns with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry for this detection comes from Windows Process Creation events, specifically identifying `Security Event ID 4688` or `Sysmon Event ID 1` for detailed process creation data. If malicious, the security impact could include unauthorized code execution, potential system compromise, or exploitation of vulnerabilities in Visual Studio Live Share components. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate development activities could trigger similar command executions.

  ### Investigation Steps

  - **Review process creation logs:** Check for `Security Event ID 4688` or `Sysmon Event ID 1` linked to `vsls-agent.exe`. Note the command line for `--agentExtensionPath`. Compare against known usage patterns for your organization.

  - **Verify command line arguments:** If the log entry contains `Microsoft.VisualStudio.LiveShare.Agent.`, this should raise suspicion. Legitimate usage typically involves loading recognized and non-malicious extensions.

  - **Correlate with user context:** Check the user account associated with the process. If it's a development or admin account, validate whether they were engaged in activities related to Visual Studio collaboration at the time of execution.

  - **Analyze the network activity:** Look for outbound connections made during the execution of `vsls-agent.exe`. Use `Firewall/IDS logs` to identify any unusual or suspicious traffic patterns correlating to this process execution.

  - **Check for file creation artifacts:** Validate if there are any files created or modified in the `C:\Users\<username>\AppData\Local\Microsoft\VisualStudio\<version>\Live Share` path when the alert is triggered, indicating potential exfiltration or malicious file presence.

  ### Prioritization

  This alert is of medium severity. If correlated with high-value assets or sensitive data environments, the risk escalates due to the risk of compromise. The likelihood of abuse, while not pervasive, exists as attackers may misuse this legitimate tool for harmful actions.

  ### Blind Spots and Assumptions

  Detection may be limited if `vsls-agent.exe` runs in benign contexts frequently due to development activities, leading to potential false positives. Reliable detection requires monitoring Windows process creation events; failure to log such events may reduce incident response effectiveness. Similarly, legitimate extensions could trigger this alert (e.g., collaborative tools). Companion detection, such as monitoring for unusual command line arguments with `vsls-agent.exe`, can strengthen overall detection capabilities.

