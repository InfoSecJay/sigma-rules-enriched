title: Suspicious Vsls-Agent Command With AgentExtensionPath Load
id: 43103702-5886-11ed-9b6a-0242ac120002
status: test
description: Detects Microsoft Visual Studio vsls-agent.exe lolbin execution with
  a suspicious library load using the --agentExtensionPath parameter
references:
- https://twitter.com/bohops/status/1583916360404729857
author: bohops
date: 2022-10-30
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vsls-agent.exe'
    CommandLine|contains: '--agentExtensionPath'
  filter:
    CommandLine|contains: 'Microsoft.VisualStudio.LiveShare.Agent.'
  condition: selection and not filter
falsepositives:
- False positives depend on custom use of vsls-agent.exe
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with the execution of **vsls-agent.exe**, a Microsoft Visual Studio tool, involving the suspicious use of the **--agentExtensionPath** parameter. This command line indicates that an attacker may be attempting to execute a payload disguised as a legitimate Visual Studio process, thus evading traditional security measures. The usage of this command can signal an attempt to exploit vulnerabilities in software development environments, targeting developers or software repositories to gain unauthorized access or deploy malwares.

  The likely attacker objectives in this scenario include gaining persistence on a machine, executing arbitrary code, or exfiltrating sensitive information from development tools or code repositories. The rule is specifically designed to detect behavior classified under the **Defense Evasion** tactic (TA0005) and the related technique **Looked-Up Built-in Program (T1218)**, which describes how attackers use built-in system binaries to hide malicious actions.

  Primary data sources for this detection include **process creation events** that log the execution of applications, particularly focusing on the command line arguments. These logs provide the necessary context to evaluate the legitimacy of the commands being executed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate process creation logs for instances of **vsls-agent.exe** execution, paying close attention to the associated command line arguments for the **--agentExtensionPath** parameter.
  - **Analyze Network Connections:** Assess any network connections initiated by vsls-agent.exe to identify suspicious or unauthorized external destinations that might indicate data exfiltration or command and control communications.
  - **Check for Anomalous Activity:** Look for unusual patterns of behavior post-execution, such as privilege escalation changes, file modifications, and attempts to access sensitive files or repositories.
  - **Correlate with Endpoint Data:** Utilize endpoint detection and response (EDR) tools to correlate the identified command execution with any other anomalous behaviors or alerts that may indicate a broader attack campaign.

  ### Prioritization
  This alert holds medium severity due to the potential impact of allowing a compromised development environment, which could lead to sensitive data exposure, unauthorized access, or code sabotage. However, the likelihood of occurrence may depend on specific use cases of vsls-agent.exe within the enterprise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to legitimate uses of the vsls-agent.exe process by developers. This means that false positives could occur based on the organization's tailored use, particularly in a development environment heavily reliant on Microsoft Visual Studio. The detection logic assumes adequate process creation logging is in place, along with a specific focus on command line parameters, which may not be standardized across all systems.

