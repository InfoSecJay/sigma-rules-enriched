title: Suspicious Vsls-Agent Command With AgentExtensionPath Load
id: 43103702-5886-11ed-9b6a-0242ac120002
status: test
description: Detects Microsoft Visual Studio vsls-agent.exe lolbin execution 
  with a suspicious library load using the --agentExtensionPath parameter
references:
- https://twitter.com/bohops/status/1583916360404729857
author: bohops
date: 2022-10-30
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vsls-agent.exe'
    CommandLine|contains: '--agentExtensionPath'
  filter:
    CommandLine|contains: 'Microsoft.VisualStudio.LiveShare.Agent.'
  condition: selection and not filter
falsepositives:
- False positives depend on custom use of vsls-agent.exe
level: medium
note: |
  ### Technical Context

  This detection identifies the execution of Microsoft Visual Studio's vsls-agent.exe with command line parameters that indicate a potentially malicious load using the `--agentExtensionPath` option. Attackers may leverage this technique to evade detection while executing malicious payloads or remote code via Visual Studio’s live share features. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005), specifically the technique of "Container Escape" (T1218).

  The primary telemetry source for this detection is process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments associated with newly created processes. If malicious, the execution may compromise the integrity of the development environment, potentially allowing further unauthorized access or manipulation of data. Importantly, this detection does not confirm that an attack is occurring; it merely flags suspicious usage of a legitimate tool.

  ### Investigation Steps

  - **Review command line arguments:** Inspect the command line in the process creation log (Event ID 4688) for instances of `--agentExtensionPath`. Malicious activity might include unusual script or URL references, while legitimate use typically involves standard paths and parameters associated with Visual Studio extensibility.

  - **Check parent process:** Analyze the parent process ID in the Event ID 4688 logs to determine the context in which vsls-agent.exe was spawned. Legitimate instances often result from Visual Studio or similar developer tools, whereas unexpected sources may indicate potential abuse.

  - **Correlate process behavior:** Use Sysmon Event ID 1 logs to compare vsls-agent.exe against known benign versions and validate hashes. Legitimate files should match the standard hash from trusted sources.

  - **Identify outbound network connections:** Investigate any outbound connections made by vsls-agent.exe. Review Firewall logs or IDS/IPS logs for unusual destinations or patterns that deviate from expected Visual Studio Live Share operations.

  - **Assess host role and criticality:** Determine the role of the host (e.g., developer workstation vs. server) to gauge the severity of potential exploitation. Sensitive systems may warrant immediate isolation pending investigation.

  ### Prioritization

  This alert should be treated with medium severity, as the potential impact involves compromise of development environments where sensitive code may reside. While this specific behavior may not always be malicious, the risk of legitimate software being misused for nefarious purposes increases, especially in environments using Visual Studio extensively.

  ### Blind Spots and Assumptions

  Detection may face limitations depending on local policy configurations or the absence of Sysmon logs, potentially masking malicious behavior. Legitimate actions could trigger this alert when developers are using Visual Studio Live Share features in unconventional ways. A companion detection could include monitoring for unusual network traffic to external IPs when vsls-agent.exe is executed, enhancing the context of potential misuse.

