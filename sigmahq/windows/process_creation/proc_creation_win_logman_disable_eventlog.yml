title: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
id: cd1f961e-0b96-436b-b7c6-38da4583ec00
status: test
description: Detects the execution of "logman" utility in order to disable or delete
  Windows trace sessions
references:
- https://twitter.com/0gtweet/status/1359039665232306183?s=21
- https://ss64.com/nt/logman.html
author: Florian Roth (Nextron Systems)
date: 2021-02-11
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1562.001
- attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\logman.exe'
  - OriginalFileName: 'Logman.exe'
  selection_action:
    CommandLine|contains:
    - 'stop '
    - 'delete '
  selection_service:
    CommandLine|contains:
    - 'Circular Kernel Context Logger'
    - 'EventLog-'         # Cover multiple traces starting with EventLog-*
    - 'SYSMON TRACE'
    - 'SysmonDnsEtwSession'
  condition: all of selection*
falsepositives:
- Legitimate deactivation by administrative staff
- Installer tools that disable services, e.g. before log collection agent installation
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify the suspicious use of the "logman" utility in Windows systems, particularly when it is used to disable or delete ETW (Event Tracing for Windows) sessions. ETW sessions are crucial for gathering operational data, and tampering with them may indicate malicious activity, such as an attacker attempting to cover their tracks or manipulate system logging to evade detection. The primary objective of such actions is likely to hinder forensic investigations by removing evidence of potentially malicious activities.

  The rule focuses on techniques associated with defense evasion, specifically T1562.001 - "Disable or Modify System Firewall." The actions of stopping or deleting ETW sessions via logman.exe can indicate an attacker's attempts to erase traces of their presence or prevent logging of subsequent activities. The relevant data sources for detecting this behavior include process creation logs that capture the execution of logman.exe, alongside details of the command line arguments used, which can provide context to the actions taken.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect and analyze process creation logs for instances of logman.exe execution, focusing particularly on command line arguments that indicate a stop or delete action on ETW sessions.

  - **Analyze Event Logs for Session Changes:** Check Windows Event Logs (specifically under the "Applications and Services Logs" structure) for records indicating changes or deletions of ETW sessions that coincide with the detection of logman.exe activities.

  - **Correlate with User Activity:** Look for any unusual user activity or prior events leading up to the execution of logman.exe, especially from service accounts or users who generally do not interact with system logging configurations.

  - **Assess Impact on Forensics Tools:** Identify if any existing forensics or monitoring tools were disrupted as a result of the logman execution, which may help establish the intent behind the action.

  ### Prioritization
  The severity of this alert is high due to the criticality of maintaining integrity in logging systems. If an attacker is tampering with log sessions, they are likely trying to evade detection, which significantly increases the risk of undetected breaches and ongoing malicious activities within the environment.

  ### Blind Spots and Assumptions
  This rule may not capture all variants of tampering with ETW sessions, particularly if attackers use alternative methods or tools to manipulate logs covertly. The detection logic assumes that logman.exe will be used in conjunction with specific command line parameters indicative of malicious intent. Moreover, the rule requires process creation logs to be enabled and properly configured on monitored systems to generate the necessary alerts. Without comprehensive logging practices, the effectiveness of this detection could be significantly diminished.

