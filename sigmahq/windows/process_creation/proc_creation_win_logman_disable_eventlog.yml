title: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
id: cd1f961e-0b96-436b-b7c6-38da4583ec00
status: test
description: Detects the execution of "logman" utility in order to disable or 
  delete Windows trace sessions
references:
- https://twitter.com/0gtweet/status/1359039665232306183?s=21
- https://ss64.com/nt/logman.html
author: Florian Roth (Nextron Systems)
date: 2021-02-11
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1562.001
- attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\logman.exe'
  - OriginalFileName: 'Logman.exe'
  selection_action:
    CommandLine|contains:
    - 'stop '
    - 'delete '
  selection_service:
    CommandLine|contains:
    - 'Circular Kernel Context Logger'
    - 'EventLog-'         # Cover multiple traces starting with EventLog-*
    - 'SYSMON TRACE'
    - 'SysmonDnsEtwSession'
  condition: all of selection*
falsepositives:
- Legitimate deactivation by administrative staff
- Installer tools that disable services, e.g. before log collection agent 
  installation
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `logman.exe` utility specifically when it is used to stop or delete Windows event tracing sessions, such as the Circular Kernel Context Logger or Sysmon trace sessions. The likely attacker objective is to evade detection or hinder forensic analysis by manipulating trace logs that could contain evidence of malicious activities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0020), especially under technique T1562.001 (Disable or Tamper with Logs). The primary telemetry sources for this detection are Windows process creation logs (Security Event ID 4688) and Sysmon logs (Event ID 1). If this activity is indeed malicious, it may allow adversaries to erase traces of their actions, compromising the organization's security posture. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for any instance where `logman.exe` is executed. Look specifically for events initiated outside of normal administrative use or from non-administrative accounts.

  - **Analyze command line arguments:** Investigate the CommandLine field of the process creation logs for `logman.exe`. Legitimate commands should not include "stop" or "delete" targeting common trace sessions like "Circular Kernel Context Logger" or "SysmonDnsEtwSession".

  - **Correlate with Sysmon logs:** If Sysmon is deployed, review Event ID 1 logs for `logman.exe` activities correlated with the identified endpoints. Cross-reference timestamps to identify unusual activity.

  - **Identify legitimate use cases:** Confirm whether the alert correlates with scheduled maintenance tasks or known administrative actions. Administrative changes might involve disabling certain trace sessions prior to installation of logging agents or routine system updates.

  - **Look for forensic artifacts:** Inspect any anomalies in log retention settings or sudden drops in log sizes. Check for additional indicators such as the absence of normal Sysmon logs from captured events, which could suggest tampering.

  - **Review user account privileges:** Identify the user account that executed `logman.exe`. Look out for standard users attempting to perform administrative actions, which can indicate potential privilege escalation or unauthorized activity.

  ### Prioritization

  The alert is considered high priority due to the potential impact on systems involving trace logs critical for incident investigation. The malicious likelihood is raised by the nature of the `logman.exe` execution patterns in the context of threat actors attempting to cover their tracks. This behavior is commonly weaponized, especially in targeted attacks against organizations with mature logging practices.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging or if logs get purged before analysis. Potential evasion techniques include legitimate administrative actions that disable tracing for maintenance purposes, which can also trigger this alert. There may be other applications or legitimate system processes that also stop or manipulate tracing that aren't adequately covered. Companion detections such as abnormal log retention patterns or access to log modification utilities can strengthen the detection coverage.

