level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "logman" utility to disable or delete Windows Event Tracing for Windows (ETW) sessions. The likely attacker objective is to impair detection capabilities by halting or removing logging mechanisms that are essential for monitoring and incident response. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Indicator Removal on Host (T1485) and specifically to the sub-technique of Deleting Event Logs (T1485.005). The primary telemetry sources include process creation logs (Security Event ID 4688 and Sysmon Event ID 1), focusing on the `logman.exe` execution and its command-line parameters.

  If the activity is malicious, there is a potential compromise of system integrity and monitoring capabilities, drastically improving an adversary's foothold within the environment. This detection, however, does NOT confirm malicious activity on its own; it could also indicate legitimate administrative tasks or benign software operations that interact with ETW sessions.

  ### Investigation Steps

  - **Identify the alert event:** Review Security Event ID 4688 and Sysmon Event ID 1 for `logman.exe` execution details. Check the process creation timestamp and the user account associated with the execution to establish context.

  - **Analyze command-line arguments:** Inspect the command line used for `logman.exe`. Look for `stop` or `delete` commands, especially those that contain keywords like `Circular Kernel Context Logger`, `EventLog-`, `SYSMON TRACE`, or `SysmonDnsEtwSession`, to discern potentially malicious intent.

  - **Conduct user behavior analysis:** Determine if the user account that executed `logman.exe` has a history of administrative actions or if they belong to a legitimate role such as an IT admin. Flag deviations from normal account behavior.

  - **Check for legitimate administrative activity:** Compare against any relevant change management tickets or scheduled maintenance that could justify the use of `logman.exe`. Verify with administrative teams if known maintenance or tool deployment took place around the time of the alert.

  - **Identify malicious indicators:** Look for the absence of expected logs from the modified ETW sessions. If significant logs are missing, it may indicate successful tampering with log preservation.

  - **Validate file artifact integrity:** Verify if logman execution resulted in file artifacts related to session information, such as .etl files. Inspect directory `C:\Windows\System32\winevt\Logs\` and confirm if logs were deleted alongside tool execution to support malicious behavior.

  ### Prioritization

  This alert holds a high severity level due to the potential for significant impact on system visibility and incident response capabilities. The likelihood of malicious abuse is considerable, as deleting or modifying logging sessions is a common tactic employed by attackers to obfuscate their activities. Given the critical nature of retained logs, such activity is frequently weaponized.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as legitimate tools or scripts that employ `logman.exe` for benign purposes, which may generate false positives. Required log sources, including Sysmon and Windows Security logs, must be properly configured for reliable detection. Legitimate administrative activities that may trigger alerts include scheduled maintenance and troubleshooting sessions where administrative staff disable logs. A related detection that strengthens coverage is monitoring for other command-line utilities or scripts that modify ETW session states, like `wevtutil`.

