logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\logman.exe'
  - OriginalFileName: 'Logman.exe'
  selection_action:
    CommandLine|contains:
    - 'stop '
    - 'delete '
  selection_service:
    CommandLine|contains:
    - 'Circular Kernel Context Logger'
    - 'EventLog-'         # Cover multiple traces starting with EventLog-*
    - 'SYSMON TRACE'
    - 'SysmonDnsEtwSession'
  condition: all of selection*
falsepositives:
- Legitimate deactivation by administrative staff
- Installer tools that disable services, e.g. before log collection agent 
