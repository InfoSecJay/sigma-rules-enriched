title: Certificate Exported Via Certutil.EXE
id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
status: test
description: Detects the execution of the certutil with the "exportPFX" flag which
  allows the utility to export certificates.
references:
- https://www.splunk.com/en_us/blog/security/a-golden-saml-journey-solarwinds-continued.html
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine
  Bencherchali (Nextron Systems)
date: 2023-02-15
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-exportPFX '
  condition: all of selection_*
falsepositives:
- There legitimate reasons to export certificates. Investigate the activity to determine
  if it's benign
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_export_pfx/info.yml
note: |
  ### Technical Context
  This rule detects the execution of `certutil.exe` with the "exportPFX" flag, which is associated with exporting certificates from the system. Attackers may leverage this command to extract sensitive cryptographic certificates for malicious purposes, such as creating forged tokens or enhancing their access to enterprise resources. The use of certificate exportation is common in various attack scenarios, especially those targeting Single Sign-On (SSO) mechanisms, where attackers can abuse exported certificates to impersonate legitimate users or gain unauthorized access.

  Relevant MITRE ATT&CK tactics associated with this rule include **Defense Evasion** (T1562) and **Exploitation of External Remote Services** (T1210), particularly in scenarios where stolen certificates are utilized for lateral movement or privilege escalation. Primary data sources that will provide evidence for this detection include process creation event logs from Windows, which capture the execution of applications along with their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate logs related to the execution of `certutil.exe`, focusing on the command line to confirm the use of the `-exportPFX` parameter.
  - **Analyze Certificate Store Access:** Check for any abnormal access patterns or modifications within certificate stores that may indicate unauthorized exports.
  - **Inspect User Context:** Determine the user account that executed the command. Verify if the account has legitimate reasons for exporting certificates and examine recent changes to its permissions or roles.
  - **Correlate with Network Traffic:** Look for related network activity that may indicate attempts to exfiltrate the exported certificates, such as unusual outbound connections post-export.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of stolen certificates, which can lead to unauthorized access to critical systems and sensitive data. The likelihood of such an event occurring in an enterprise, particularly with increasing sophistication in cyber threats, necessitates prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by legitimate uses of certutil for certificate management within the enterprise, which can lead to false positives. The detection logic assumes that this command should not be executed by standard user accounts without proper justification. Required logs for effective detection include complete process creation logs with command-line details, which must be enabled on Windows systems for the alert to function correctly. Additionally, variations of the command or usage outside of typical administrative contexts may not be captured by this rule.

