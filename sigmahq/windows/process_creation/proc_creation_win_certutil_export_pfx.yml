title: Certificate Exported Via Certutil.EXE
id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
status: test
description: Detects the execution of the certutil with the "exportPFX" flag 
  which allows the utility to export certificates.
references:
- https://www.splunk.com/en_us/blog/security/a-golden-saml-journey-solarwinds-continued.html
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, 
  Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-15
modified: 2024-03-05
tags:
- attack.stealth
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-exportPFX '
  condition: all of selection_*
falsepositives:
- There legitimate reasons to export certificates. Investigate the activity to 
  determine if it's benign
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_export_pfx/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `certutil.exe` with the `-exportPFX` flag, which is typically used to export certificates from the Windows Certificate Store. Attackers may use this functionality to obtain and exfiltrate sensitive cryptographic credentials, often aiming to facilitate unauthorized access or lateral movement within a network. This behavior fits under the MITRE ATT&CK framework's tactic of Credential Access (TA0006) and technique of Credential Dumping (T1003).

  The primary telemetry sources for this alert are Windows process creation logs, specifically the Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact can be significant, as exported certificates may include private keys that allow attackers to impersonate legitimate entities. It is important to note that this detection does NOT confirm that the export was malicious on its own; it necessitates further investigation into the context and specifics of the execution.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for `certutil.exe` executions. Look for CommandLine parameters that include `-exportPFX`. Legitimate exports usually lack additional suspicious parameters.

  - **Analyze related user activity:** Cross-reference the user account associated with the execution to determine its context. If the account is a system or service account performing scheduled tasks, it may be benign.

  - **Check for exfiltration indicators:** Look in Windows Event Logs for file creation events (e.g., Event ID 4663) related to the output files generated by `certutil.exe`. Malicious indicators can include unexpected file paths or filenames suggesting covert operations.

  - **Determine file access rights:** Confirm that the exported certificate does not contain sensitive information (e.g., private keys) by analyzing the permissions and ownership of the exported files.

  - **Correlate with other events:** Investigate if any other security alerts were triggered around the same timeframe (e.g., suspicious network activity, lateral movement). An increase in simultaneous alerts may indicate an ongoing attack.

  ### Prioritization

  The severity of this alert is medium, as the execution of `certutil.exe` to export certificates may indicate a potential indicator of compromise. However, the impact varies based on the system's role and its exposure to sensitive data. While this behavior can be weaponized, it is also common in administrative tasks, warranting careful evaluation.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments where `certutil.exe` is frequently used for legitimate purposes, such as certificate management. Evasion techniques may include renaming harmful executables or using alternative methods for certificate export. Additionally, if logging levels are not configured correctly (e.g., not capturing all process creation events), detection may fail. A companion detection would be monitoring for unusual network connections following the certificate export, which could further confirm malicious activity.

