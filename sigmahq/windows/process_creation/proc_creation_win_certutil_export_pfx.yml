title: Certificate Exported Via Certutil.EXE
id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
status: test
description: Detects the execution of the certutil with the "exportPFX" flag 
  which allows the utility to export certificates.
references:
- https://www.splunk.com/en_us/blog/security/a-golden-saml-journey-solarwinds-continued.html
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, 
  Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-15
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certutil.exe'
  - OriginalFileName: 'CertUtil.exe'
  selection_cli:
    CommandLine|contains|windash: '-exportPFX '
  condition: all of selection_*
falsepositives:
- There legitimate reasons to export certificates. Investigate the activity to 
  determine if it's benign
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_certutil_export_pfx/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `certutil.exe` with the `-exportPFX` flag, which allows for the exporting of certificates. The likely attacker objective includes the theft of sensitive certificates, such as those used for authentication or digital signatures, which can facilitate unauthorized access to systems or services. This aligns with the MITRE ATT&CK tactic "Defense Evasion" and technique "Credentials from Password Stores" (T1027).

  The primary telemetry source is the Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1, which capture process executions including command line arguments. If malicious, this behavior could lead to the compromise of secure communications and internal access controls. Importantly, this detection alone does not confirm malicious intent; legitimate administrative activities may involve exporting certificates.

  ### Investigation Steps

  - **Check the process command line:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for command lines containing `certutil.exe -exportPFX`. Look for unusual parameters or file paths that do not conform to expected admin workflows.

  - **Identify export location:** Determine the output file path specified in the command line to assess the destination of the exported certificate. Outputs to non-standard folders or user directories (e.g., `%TEMP%`) could indicate malicious intent.

  - **Review process parentage:** Examine the process tree for `certutil.exe` to identify the parent process. Legitimate exports typically originate from system administrative tools or scripts, while suspicious activities may be spawned by unusual or non-standard applications.

  - **Correlate with user behavior:** Investigate user accounts associated with the execution. If a non-admin user executed `certutil.exe`, initiate a deeper investigation, as administrative privileges are typically required for such actions.

  - **Assess historical logs:** Review past execution logs for certutil. Frequent or non-reporting instances of `certutil.exe` in the environment compared to established baselines could signal ongoing malicious activity.

  - **Check for sensitive certificates:** If a certificate was exported, validate whether it is associated with critical services (e.g., VPN, internal applications). Exporting certificates tied to sensitive resources is a strong indicator of a potential compromise.

  ### Prioritization

  This alert holds medium severity due to the potential impact on sensitive certificate management and the likelihood of malicious activity leveraging credentials exported via `certutil.exe`. While exporting certificates can be a legitimate action, the specific command parameters and context may indicate an imminent threat, as adversaries often weaponize this process to facilitate access and evade detection.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logging for process creation is not configured correctly, impacting the visibility of executions. `certutil.exe` can also be run by legitimate administrative tasks, leading to false positives. Additionally, adversaries may employ similar legitimate tools or subprocesses to bypass detection mechanisms. A related detection could include anomalous access patterns to sensitive certificate stores to strengthen coverage against unauthorized access attempts.

