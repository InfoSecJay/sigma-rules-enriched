detection:
  selection1:
    ParentImage|endswith: '\mmc.exe'
  selection2:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\sh.exe'
    - '\bash.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
  - Image|contains: '\BITSADMIN'
  condition: all of selection*
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where a Windows command line executable is launched from the Microsoft Management Console (MMC), which may indicate potential lateral movement within a network. Attackers can use MMC to exploit its capabilities, potentially executing commands remotely or delivering payloads to other systems. The likely attacker objectives include obtaining unauthorized access to administrative functionalities, altering system configurations, or executing malicious scripts that may leverage the trusted nature of MMC.

  This behavior is associated with the MITRE ATT&CK framework, particularly the tactic of lateral movement. The relevant techniques include **T1021.003 (Lateral Movement: SMB/Windows Admin Shares)**, where attackers may use administrative shares to execute commands on remote systems. Understanding this context deepens our insight into how attackers may maneuver within corporate networks.

  The primary data source for this detection is **process creation logs**. These logs provide valuable insights about what processes were spawned, along with their parent processes. This can help analysts trace unauthorized command executions back to potentially malicious activities initiated from trusted management interfaces.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events focusing on entries tied to `mmc.exe`, noting any subsequent command line executions. Check the parent-child relationship to identify if legitimate administration activities were manipulated.
  - **Analyze Command-Line Arguments**: Investigate the arguments passed to the command line executables (e.g., `cmd.exe`, `powershell.exe`, etc.) spawned from MMC. Look for unusual flags or commands that indicate nefarious intent or misuse.
  - **Cross-Reference with Network Connections**: Correlate process creation events with network activity logs to identify any unauthorized outbound connections made by the processes spawned from MMC. This can highlight potential data exfiltration or communication with command and control servers.
  - **Assess User Privileges**: Determine the user context under which these processes were executed. Focus on accounts with elevated privileges or previously flagged for suspicious behavior, as misuse of administrative privileges is often an indicator of lateral movement.

  ### Prioritization
  This alert should be considered high-severity due to the significant threat impact of lateral movement. The likelihood of exploitation is increased in environments where administrative tools are common, making it essential to monitor such activities closely to prevent unauthorized access to sensitive systems.

  ### Blind Spots and Assumptions
  Potential gaps in detection may arise from environments where process creation logging is not fully enabled, leading to missed instances of the described behavior. The detection logic assumes that the logs are comprehensive and properly configured; any absence of command-line logging for spawned processes could hinder the detection capabilities. Additionally, it presumes that attackers will not employ techniques to mask their activities by altering legitimate command lines or utilizing non-standard executables.

