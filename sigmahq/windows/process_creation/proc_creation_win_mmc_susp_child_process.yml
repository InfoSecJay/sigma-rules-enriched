logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    ParentImage|endswith: '\mmc.exe'
  selection2:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\sh.exe'
    - '\bash.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
  - Image|contains: '\BITSADMIN'
  condition: all of selection*
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where the Microsoft Management Console (MMC) spawns command-line executables such as cmd.exe or PowerShell, potentially indicating lateral movement or exploitation attempts. The likely attacker objective is to manipulate system processes to execute commands remotely, thereby gaining additional access or control over the system. The relevant MITRE ATT&CK technique is "Lateral Movement: Remote Services - Windows Admin Shares" (T1021.003).

  The primary telemetry source for this detection comes from Windows process creation logs, specifically Process Creation Event ID 4688 and Sysmon Event ID 1, which record details about process start events. The security impact of detected malicious activity could include unauthorized remote access, command execution, or system compromise. It is important to note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to understand the context of the behavior.

  ### Investigation Steps

  - **Verify process parentage:** Check Event ID 4688 for processes with ParentImage ending in `\mmc.exe`. Confirm the command-line parameters used to understand the context of invocation.

  - **Identify spawned executables:** Look for processes that start from `mmc.exe` with Image ending in any of the following: `\cmd.exe`, `\powershell.exe`, or similar. This can indicate potential misuse of administrative tools.

  - **Assess file creation activities:** If BITSADMIN (part of the detection condition) is involved, validate if there are file downloads or uploads initiated through this tool captured in event logs, which could indicate data exfiltration.

  - **Examine scheduled tasks:** Investigate if scheduled tasks (`schtasks.exe`) or other legit user-created scripts are triggered around the same timestamps. This may confirm benign administrative activities as opposed to unauthorized actions.

  - **Determine the user context:** Analyze users associated with the parent process (mmc.exe) to ascertain if they have a valid administrative role or if they operate under suspicious contexts (e.g., accounts previously flagged for unusual activities).

  - **Review recent administrative actions:** Assess changes in Windows Event logs related to administrative privileges before and after the suspicion arises, looking for signs of unauthorized privilege escalation or recent logins that do not align with normal operational patterns.

  ### Prioritization

  This alert holds a high severity due to its potential impact if the actions are malicious, particularly on critical systems exhibiting administrative functions. The likelihood of exploitation is concerning, given commonplace tactics by attackers to leverage administrative tools for lateral movement in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by logged activities if certain processes are excluded from logging configurations. Evasion techniques could involve use of custom scripts instead of built-in tools to bypass detection. Legitimate administrative tasks may also trigger the alert, especially in dynamic environments where management tasks are frequently automated. A companion detection to consider is monitoring for unexpected behavior from Powershell or WMIC to enhance signal-to-noise in investigations.

