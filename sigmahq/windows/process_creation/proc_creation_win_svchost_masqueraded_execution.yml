note: |
  ### Technical Context

  This rule detects processes masquerading as the legitimate "svchost.exe" by using the same name but executing from non-standard locations, indicating potentially malicious activity. The likely attacker objective is to evade detection mechanisms by using common system processes as a cover for malicious operations, such as installing backdoors or executing harmful payloads. This behavior aligns with the MITRE ATT&CK technique T1036.005 (Masquerading: Match Legitimate Name or Location).

  The primary telemetry sources for detection include process creation logs from Windows, specifically monitoring for events related to executables running under names associated with system processes. The security impact, if malicious, could involve unauthorized access to sensitive systems or data, as adversaries often use these tactics to blend in with legitimate processes. It is critical to note that this detection does NOT confirm malicious intent on its own; further investigation is required to establish context and confirm the legitimacy of the process.

  ### Investigation Steps

  - **Verify process location:** Check the path of the detected "svchost.exe": Investigate the process creation logs (Windows Security Event ID 4688) to confirm if the executable is running from a non-standard directory (e.g., anything outside of `C:\Windows\System32\` or `C:\Windows\SysWOW64\`).

  - **Examine parent process:** Review the parent process ID in the logs: Use Sysmon Event ID 1 or Security Event ID 4688 to identify the parent process that spawned the suspicious "svchost.exe," which may reveal other malicious activity or tools (e.g., command line obfuscation or installation scripts).

  - **Analyze process attributes:** Investigate the process executable's metadata: Look for the OriginalFileName field in Security Event ID 4688 logs to determine if it matches "svchost.exe" consistently; any discrepancies with file attributes may indicate a masquerading attempt.

  - **Identify legitimate activities:** Validate typical instances of "svchost.exe": Confirm that legitimate system processes are functioning as expected. Use historical logs to identify expected parent-child relationships for known good instances of `svchost.exe` to distinguish between benign and suspicious behavior.

  - **Look for additional indicators:** Check for network connections: Use Sysmon or Windows Security logs to track network activity associated with the process. Suspicious outbound connections, especially to non-administrative or unusual destinations, may indicate malicious intent.

  - **Review process termination methods:** Investigate any recent command-line activity: Look for logs that show attempts to stop or modify the suspicious "svchost.exe" process (e.g., through taskkill or script actions) that could suggest further obfuscation activities by an attacker.

  ### Prioritization

  The alert severity is high due to the potential impact of malicious processes masquerading as critical Windows services. The likelihood of malicious abuse is significant, as techniques like process masquerading are commonly utilized by sophisticated adversaries. Such behavior is frequently weaponized in real-world attacks, making it essential for immediate investigation.

  ### Blind Spots and Assumptions

  Limitations of this detection involve the potential for legitimate applications or services to utilize similar naming conventions, which could lead to false positives. Required log sources must include detailed process creation logs configured to collect complete command lines and bifurcate outputs based on service role effectiveness. Activities such as legitimate application updates or service management may trigger similar alerts. A related detection to consider is any alerts related to unusual command execution patterns (e.g., reflective DLL injection), which would provide contextual clarity to the investigation.

