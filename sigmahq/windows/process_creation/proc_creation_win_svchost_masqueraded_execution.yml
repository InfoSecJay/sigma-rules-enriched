note: |
  ### Technical Context

  This rule detects processes that are masquerading as the legitimate "svchost.exe" executable but are running from atypical locations. The likely attacker objective is to carry out malicious actions while evading detection by appearing as a legitimate system process. This behavior aligns with the MITRE ATT&CK technique for "Masquerading" (T1036.005). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which provides details about the process creation event, including the image path and original filename. If malicious, this behavior could lead to system compromise, data exfiltration, or lateral movement within the network. Notably, this detection does NOT confirm malicious intent on its own; it merely highlights potential suspicious activity that requires further investigation.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for processes named "svchost.exe" that do not originate from "C:\Windows\System32" or "C:\Windows\SysWOW64". Legitimate svchost.exe processes should consistently have these paths.

  - **Analyze command line arguments:** Inspect the command line parameters of the detected process using Event ID 4688's `NewProcessId` field. Unusual or suspicious commands can indicate malicious activity, whereas legitimate svchost.exe executions typically do not include atypical flags.

  - **Validate parent process:** Identify the parent process associated with the suspicious svchost.exe instance by referencing the `ProcessId` field in Event ID 4688. Legitimate svchost.exe instances often have common parent processes, such as services or system processes. Any unusual or unexpected parent may indicate malicious intent.

  - **Cross-reference with other security logs:** Consult Sysmon Event ID 1 to gather additional context on the process creation, focusing on `Image` and `Hash` fields. Look for discrepancies in the hash values that differ from the legitimate binaries. A significant deviation may point to malware.

  - **Investigate system integrity:** Check if the suspected binary exists outside of expected directories using file system audit logs or endpoint detection tools. Legitimate svchost.exe should only reside in system directories; anything found elsewhere may be a red flag.

  - **Identify similar known threats:** Compare the detected process with known malware samples using hash comparisons to external threat intelligence feeds. High confidence hits can confirm malicious behavior aligned with known adversary tactics.

  ---

  ### Prioritization

  The alert should be considered high priority due to its association with process injection and evasion tactics that potentially lead to serious security breaches. The likelihood of malicious abuse is significant, especially given that process masquerading is a common technique used by adversaries to maintain persistence and evade detection mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of adversaries to employ similar filenames from legitimate locations (e.g., context-aware evasion). Consistent log collection from the appropriate Windows Security Event IDs is necessary for reliable detection. Legitimate applications or services may occasionally duplicate process names, which can lead to false positives. A related detection that strengthens coverage could be monitoring for local or scheduled tasks that spawn instances of svchost.exe unexpectedly, as this often correlates with adversarial behavior.

