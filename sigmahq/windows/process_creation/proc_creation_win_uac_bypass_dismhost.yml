note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) by exploiting DismHost.exe, specifically through DLL hijacking techniques often used by attackers. The likely objective is to escalate privileges to execute malicious code with higher integrity within the Windows environment. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (T1203) and "Privilege Escalation" (T1548.002).

  The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1, which provide detailed insights into process hierarchies and their integrity levels. If malicious, the impact could include complete system compromise or unauthorized access to sensitive systems. Importantly, this detection alone does not confirm that an attack is successful; it only indicates a potential attempt at exploiting UAC.

  ### Investigation Steps

  - **Examine process creation logs for suspicious parent-child relationships**: Query Security Event ID 4688 or Sysmon Event ID 1 for processes with a parent image containing `C:\Users\`, `\AppData\Local\Temp\`, or `\DismHost.exe`. Note the integrity levels indicating potential UAC bypass.

  - **Identify high-integrity processes**: Look for processes spawned by `DismHost.exe` with Integrity Level `High` or `System`. Malicious activity is indicated if a process with a suspicious origin attempts to establish a high-integrity process.

  - **Correlate with other system logs**: Check Windows Event Logs (e.g., Application and System) for errors related to DLL loading failures or process terminations close to the same timestamp. This may indicate attempts to dynamically load a malicious DLL.

  - **Review expected legitimate behavior**: Confirm legitimate instances of `DismHost.exe`. They typically originate from system operations, are spawned by Windows Update, and do not exhibit high integrity from unusual locations like `Temp`.

  - **Cross-reference with known threat intel**: Validate any associated command lines or arguments from the detected process against existing threat intelligence sources, particularly those related to UAC bypass techniques, to uncover known tactics or previously reported Indicators of Compromise (IoCs).

  - **Investigate criticality based on asset role**: If the alert arises from a server designated as a Domain Controller or handling critical applications, prioritize investigation. Examine logs for unexpected user interactions or software installations.

  ### Prioritization

  This alert is of high severity due to its potential to escalate privileges and perform unauthorized actions on critical systems. UAC bypass attempts are commonly weaponized by attackers, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be evaded if attackers employ alternative techniques or tools that don’t rely on standard DLL hijacking methods. Reliable detection requires comprehensive logging of process creations and interactions. Legitimate administrative activities, like software installations or updates, may also trigger alerts. Companion detections, such as anomalies in DLL loads (Event ID 4104 from Sysmon), can enhance coverage and accuracy during investigations.

