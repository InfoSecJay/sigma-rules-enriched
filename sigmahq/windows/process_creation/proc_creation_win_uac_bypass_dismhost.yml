note: |
  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) through the use of **DismHost.exe** with a technique known as DLL hijacking. The primary objective of this technique is to execute code with elevated privileges, allowing an attacker to gain higher-level access to a compromised system. The Tactics involved here include **Defense Evasion** and **Privilege Escalation**, specifically associated with **T1548.002**: "Abuse Elevation Control Mechanism: Bypass User Account Control." Attackers may leverage this technique to execute malicious payloads without user consent, thereby avoiding detection mechanisms aimed at UAC prompts.

  The telemetry most relevant for detecting this behavior includes process creation events that record the execution details and context of running processes. Specifically, this detection focuses on instances where a potentially malicious process (like one hijacking **DismHost.exe**) is spawned from user directories or temporary application folders, and is executed with high or system integrity levels. By monitoring these attributes, security analysts can identify instances of possible UAC bypass attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for instances where **DismHost.exe** appears as a parent image. Pay particular attention to creation events that coincide with high or system integrity level assignments.
  - **Analyze Parent Relationships**: Identify and inspect parent-child relationships for processes spawned from directories such as `C:\Users\`, `\AppData\Local\Temp\`. Look for anomalies or unexpected applications calling **DismHost.exe**.
  - **Check Integrity Levels**: Validate the integrity levels of suspicious processes. Legitimacy can be questioned if a process from a user context is running at a high or system integrity level, particularly if linked to UAC bypass attempts.
  - **Correlate with Known Indicators**: Make use of threat intelligence and other security tools to cross-reference behavior against known bad indicators associated with UAC bypass methodologies, including any indicators related to **UACMe**.

  ### Prioritization
  Given that the successful execution of a UAC bypass can lead to severe consequences, such as unauthorized administrative access and system compromise, the severity of this alert is rated as high. The likelihood of exploitation in vulnerable environments where users are often prompted to provide elevated permissions further elevates the risk.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage given that not all UAC bypass methods may leverage **DismHost.exe**; therefore, other techniques may go undetected. The detection logic assumes that all relevant logging mechanisms are properly configured, specifically ensuring that process creation logs capture sufficient detail around integrity levels. Additionally, the effectiveness of this rule is contingent on the correct logging of user-level and system-level process executions, which may not be standard in all environments.

