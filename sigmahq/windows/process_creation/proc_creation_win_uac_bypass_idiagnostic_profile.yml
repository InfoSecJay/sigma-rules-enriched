note: |
  ### Technical Context

  This Sigma rule detects the use of the "IDiagnosticProfileUAC" technique, which is a method for bypassing User Account Control (UAC) in Windows environments. The likely objective of the attacker is to escalate privileges without triggering security alerts, thereby gaining unauthorized access to sensitive resources or executing malicious commands. This behavior aligns with the MITRE ATT&CK tactics of Execution, Defense Evasion, and Privilege Escalation, specifically technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Access Control).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on events that indicate the execution of a malicious process with certain characteristics. If this behavior is confirmed as malicious, it poses a significant security risk as it could allow an attacker to gain elevated privileges and maintain persistence on the system. It is important to note that this detection alone does not confirm a successful compromise or malicious activity; further context and investigation are required.

  ### Investigation Steps

  - **Check the process parentage:** Investigate any alerts originating from `DllHost.exe`. Cross-reference with Security Event ID 4688 to verify the command line arguments for the presence of `/Processid:{12C21EA7-2EB8-4B55-9249-AC243DA8C666}`. Malicious indicators include anomalous command line usage or unusual parent-child process relationships.

  - **Examine integrity levels:** Review the integrity level of the processes involved. Verify if the processes flagged have a High or System integrity level (S-1-16-16384, S-1-16-12288) using Sysmon Event ID 10. Legitimate processes typically run under Medium integrity unless elevated for known applications.

  - **Analyze command line for anomalies:** Conduct a thorough review of the command lines associated with the flagged process. Search for unexpected arguments or unusual execution patterns related to `IDiagnosticProfile` in Process Creation logs. Malicious entries might include additional commands not typically used in standard operations.

  - **Correlate with user activity logs:** Inspect user behavior logs or RDP session logs (if applicable) to determine if the user was performing legitimate actions around the time of the alert. Sudden changes in user behavior patterns, such as elevated access attempts by a non-privileged user, could indicate a compromise.

  - **Identify known benign applications:** Validate against a list of applications that are known to utilize `DllHost.exe` legitimately within your environment. If found in legitimate use cases, understand the context of their execution—such as version control processes or system updates.

  ### Prioritization

  This alert is high severity due to the potential impact of privilege escalation on critical systems. The likelihood of malicious abuse is significant as UAC bypass techniques are frequently weaponized in attacks to gain elevated permissions without detection. Systems using UAC protection are prime targets for adversaries using this method.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for sophisticated attackers to use legitimate tools or scripts that mimic this behavior, thereby evading detection. Furthermore, reliance on specific log sources like process creation may miss actions conducted via alternative methods. Legitimate administrative processes or software installs might inadvertently trigger this alert. Companion detections, such as monitoring for unusual PowerShell Activity or other legitimate escalation methods (e.g., local privilege escalation indicators), can help strengthen coverage and provide better context during investigations.

