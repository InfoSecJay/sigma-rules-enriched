note: |
  ### Technical Context

  This rule detects a command-line or batch script execution that switches the character code page to a rare language code using `chcp.com`, particularly if it switches to Chinese (936), Vietnamese (1258), or other specified code pages. The likely objective of an attacker may be to obfuscate malicious commands or manipulate text output in a way that evades detection by security monitoring tools. This behavior aligns with the MITRE ATT&CK technique for "Input Data Manipulation" (T1036).

  The primary telemetry source for this detection is Windows process creation logs. Specifically, it relies on CommandLine parameters and the process execution of `chcp.com`, which may indicate system utility misuse. If malicious, this could pave the way for further obfuscation of malicious scripts, or list-sensitive information in a non-standard character set, facilitating exfiltration or lateral movement. This detection does NOT confirm an active compromise on its own but rather highlights a potential tactic used by adversaries.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Event ID 4688 or Sysmon Event ID 1 to identify instances of `chcp.com` being executed. Focus on command lines that end with '936', '1258', or similar rare code page identifiers. Any legitimate use would likely involve common code pages such as '437' or '65001'.

  - **Analyze the user context:** Verify the user account that executed the command. If it is an administrative or expected service account, consider the context of the action. Unexpected accounts or privileges indicate potential misuse.

  - **Examine surrounding command usage:** Inspect preceding commands within the same session to identify if there are other suspicious command line executions that follow the code page change. Multiple rare language code page switches in succession could indicate malicious intent.

  - **Validate file and script artifacts:** Check for creation or modification of batch files or scripts in common execution paths (e.g., C:\Windows\Temp\ or C:\Scripts\). Look for any unusual script names that correspond with the execution time of the suspicious command.

  - **Document legitimate activity:** Confirm whether any known administrative changes were made that related to character set adjustments for specific applications or regional configurations, as this may justify legitimate use of the command.

  ### Prioritization

  This alert has medium severity due to potential misuse of a standard Windows utility for secretive manipulation of code pages, which could indicate preparation for more malicious actions. The likelihood of exploitation is moderate; although not frequently weaponized, the behavior is indicative of attempts to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited if the organization does not log process creation effectively or if log retention policies are too short, leading to missed detections. Legitimate administrative tasks could inadvertently trigger this alert, especially in multi-lingual environments. To enhance detection, consider pairing this rule with alerts for unusual PowerShell commands or script execution to provide a broader context for analysis.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
