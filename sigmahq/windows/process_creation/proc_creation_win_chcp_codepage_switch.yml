detection:
  selection:
    Image|endswith: '\chcp.com'
    CommandLine|endswith:
    - ' 936'            # Chinese
            # - ' 1256' # Arabic
    - ' 1258'           # Vietnamese
            # - ' 855'  # Russian
            # - ' 866'  # Russian
            # - ' 864'  # Arabic
  condition: selection
