note: |
  ### Technical Context
  This rule detects suspicious command line or batch script activity that involves switching the code page to less common languages, such as Vietnamese (1258) or simplified Chinese (936). Attackers may use this technique to obfuscate their activity or ensure that their commands are processed correctly in a compromised environment where they are trying to execute malicious scripts or evade detection by utilizing rare code pages.

  The likely attacker objectives include maintaining stealth during the execution of payloads, obfuscating malicious scripts, or attempting to execute commands in a way that may avoid detection mechanisms based on language-specific observables or command patterns. The identified MITRE ATT&CK tactics are **Defense Evasion (T1036)**, which relates to the manipulation of command line tools to obscure malicious intent, and may also indirectly intersect with **Command-Line Interface (T1059)** as command lines are critical in executing this technique.

  The primary telemetry sources that will provide evidence for this detection include **process creation logs** from Windows systems, which capture details of command line executions and the processes spawned.

  ### Investigation Steps
  - **Identify the Event:** Review recent process creation logs for instances of `chcp.com` being executed with uncommon code page identifiers such as 936 or 1258 to determine if there are any recent suspicious activities.
  - **Analyze Command Lines:** Pay close attention to the command line arguments associated with the detected processes. Investigate the context of these commands to understand if they align with typical operational usage or if they appear anomalous.
  - **Check Digital Forensics:** Look for any associated artifacts on the file system, such as batch scripts or command files that might contain malicious commands or were executed shortly before the code page switch occurred.
  - **Correlate with User Behavior:** Cross-reference the accounts and systems executing these commands with user behavior analytics to ascertain if the actions are consistent with user roles or if they indicate compromised accounts.

  ### Prioritization
  This alert is of medium priority due to the potential for use in obscuring malicious activities, but its severity is heightened in enterprise environments where obfuscation tactics may facilitate broader compromises or lateral movements.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the command line invocation is executed in a manner that bypasses typical logging mechanisms, or if administrative users are frequently switching code pages for legitimate regional activities. The detection logic assumes that uncommon code pages will not be used regularly in the environment. It also requires proper logging configurations on Windows systems to capture detailed process creation events; without this, the detection would not function as intended.

