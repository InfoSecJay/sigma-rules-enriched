note: |
  ---

  ### Technical Context

  This rule detects the execution of the `chcp.com` command with specific code page identifiers associated with less commonly used languages (e.g., Chinese, Vietnamese). The likely attacker objective is to obfuscate the execution of potentially malicious scripts by switching to a less mainstream code page, which may be part of a broader evasion tactic within the attack lifecycle. This behavior aligns with the MITRE ATT&CK technique “Obfuscated Files or Information” (T1036) and “Defense Evasion” (T1203).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which captures process creation events, and Sysmon Event ID 1 for detailed process-related behaviors. If malicious, this behavior could facilitate further malicious actions, such as executing harmful commands or scripts undetected. Importantly, this detection does not confirm whether the command was executed with malicious intent, as legitimate administrative tasks may also trigger the alert.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for process creation involving `chcp.com`. Look for CommandLine fields including `936` (Chinese) or `1258` (Vietnamese) to validate potential malicious motivations.

  - **Validate legitimate use cases:** Look for known administrative behaviors where code pages are switched for valid reasons. These typically involve regional or language-specific scripting tasks and should include processes run by trusted accounts, typically from administrative command shells.

  - **Correlate timing with external access:** Investigate connections made from the executing host around the time of the alert. Focus on unusual outbound connections that coincide with the execution of `chcp.com`, as this could indicate a command-and-control (C2) interaction.

  - **Identify high-confident indicators:** Examine the parent process of the `chcp.com` execution. If initiated by a suspicious or untrusted executable, especially one from an unusual path, it heightens the likelihood of malicious intent.

  - **Check for follow-up commands:** Review subsequent commands executed within a short time frame after this alert. Any subsequent suspicious command-line activities related to file manipulation or remote access could indicate malicious follow-up actions.

  ---

  ### Prioritization

  This alert is of medium severity given its potential impact on systems and operations. While code page switching may be used by legitimate users, it's also a technique commonly leveraged by adversaries to obfuscate intentions, especially in cases where scripting is involved. It requires prompt investigation to rule out malicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering this alert, particularly in multi-national organizations. Ensure that process creation logging is enabled on all critical assets to maximize detection efficacy. Additionally, benign scripts from trusted sources may also execute `chcp.com` with valid parameters. A related detection to consider is monitoring for unusual command execution patterns in conjunction with code page switches to enhance coverage of potential evasion tactics.

