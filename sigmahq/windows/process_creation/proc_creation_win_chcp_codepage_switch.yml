note: |
  ### Technical Context

  This rule detects instances where the `chcp.com` command is used to switch the code page to potentially rare languages (e.g., Vietnamese or Chinese) on a Windows system. This behavior may indicate an attacker attempting to obfuscate their activities or execute scripts that rely on non-standard character encoding. The likely attacker objective is to execute commands or scripts in a way that avoids detection by having the system interpret inputs or outputs in a language that may not be routinely monitored.

  This behavior fits into the MITRE ATT&CK framework under "Defense Evasion" (TA0005) and specifically references "Input Data Manipulation" (T1036). The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior could lead to the execution of unauthorized scripts or commands, potentially allowing for further compromise of the system or data exfiltration. However, this detection does NOT confirm that malicious activity is occurring on its own, as legitimate administrative activities may also use these code pages for regional settings adjustments.

  ### Investigation Steps

  - **Review process creation logs for `chcp.com`:** Check Security Event ID 4688 or Sysmon Event ID 1 for any instances of `chcp.com` being executed. Extract relevant details such as CommandLine and Image fields.

  - **Identify unusual code page switches:** Look specifically for command lines ending with `936` (Chinese) or `1258` (Vietnamese). Compare with historical usage to determine if this is typical behavior for the user or system in question.

  - **Assess user context and permissions:** Verify the user account that executed the command. Administrative accounts executing this command may warrant closer scrutiny for potential misuse while standard user accounts would typically not trigger this kind of action.

  - **Validate legitimate use cases:** Confirm if the command execution corresponds with any known administrative activities. Query logs for other administrative actions relating to language or regional settings around the same timestamp to evaluate whether this was part of normal operations.

  - **Check for high-confidence malicious indicators:** Investigate any subsequent process creation events that follow the `chcp.com` invocation, particularly looking for unusual cmd.exe or PowerShell executions that may utilize the changed code page for further actions against the organization.

  ### Prioritization

  This alert should be prioritized as medium severity due to the use of a potentially malicious command that might be employed to bypass language filters or monitoring. The likelihood of malicious abuse increases if this behavior is atypical for the user or system involved, especially if it correlates with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative activities that could trigger this alert, such as user-driven changes to regional settings. Reliable detection requires comprehensive logging of all process creation events; without adequate coverage, important events may be missed. Additionally, consider companion detections such as monitoring PowerShell or command shell actions following this code page change for enhanced visibility into potentially malicious workflows.

