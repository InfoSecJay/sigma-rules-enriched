title: Github Self-Hosted Runner Execution
id: 5bac7a56-da88-4c27-922e-c81e113b20cb
status: test
description: |
  Detects GitHub self-hosted runners executing workflows on local infrastructure that could be abused for persistence and code execution.
  Shai-Hulud is an npm supply chain worm targeting CI/CD environments.
  It installs runners on compromised systems to maintain access after credential theft, leveraging their access to secrets and internal networks.
references:
- https://about.gitlab.com/blog/gitlab-discovers-widespread-npm-supply-chain-attack/
- https://securitylabs.datadoghq.com/articles/shai-hulud-2.0-npm-worm/
author: Daniel Koifman (KoifSec)
date: 2025-11-29
tags:
- attack.command-and-control
- attack.t1102.002
- attack.t1071
logsource:
  category: process_creation
  product: windows
detection:
  selection_worker_img:    # Example command C:\Users\Lab\actions-runner\bin\Runner.Worker.exe spawnclient 1288 1252
  - Image|endswith: '\Runner.Worker.exe'
  - OriginalFileName: 'Runner.Worker.dll'
  selection_worker_cli:
    CommandLine|contains: 'spawnclient'
  selection_listener_img:   # Example command C:\Users\Lab\actions-runner\bin\Runner.Listener.exe  configure --url https://github.com/ABC/ABC --token 123123
  - Image|endswith: '\Runner.Listener.exe'
  - OriginalFileName: 'Runner.Listener.dll'
  selection_listener_cli:
    CommandLine|contains:
    - 'run'
    - 'configure'
  condition: all of selection_worker_* or all of selection_listener_*
falsepositives:
- Legitimate GitHub self-hosted runner installations on designated CI/CD 
  infrastructure
- Authorized runner deployments by DevOps/Platform teams following change 
  management
- Scheduled runner updates or reconfigurations on existing build agents
- Self-hosted runners that follow expected/known naming patterns
- Installation via expected/known configuration management tools (reflected 
  mostly as parent process name)
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_github_self_hosted_runner/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of GitHub self-hosted runners on local systems, specifically targeting instances where `Runner.Worker.exe` or `Runner.Listener.exe` is executed with certain command-line arguments indicative of suspicious or unauthorized activity. The detection aims to highlight potential abuses in CI/CD environments, which attackers may exploit to maintain persistence, especially when using npm supply chain vulnerabilities like the "Shai-Hulud" worm. Relevant MITRE ATT&CK tactics and techniques include Command and Control (T1102.002) and Application Layer Protocol (T1071).

  The primary telemetry sources are Windows process creation logs. This includes Event IDs 4688 (Process Creation) and Sysmon Event ID 1. A successful detection indicates that a GitHub self-hosted runner is being executed, potentially allowing an adversary to establish a foothold within the environment. However, this detection does NOT confirm that the activity is malicious on its own; it requires further context and analysis.

  ### Investigation Steps

  - **Verify process creation logs for suspicious executions:** Review Event ID 4688 and Sysmon Event ID 1 to identify any instances of `Runner.Worker.exe` or `Runner.Listener.exe` being executed. Ensure command lines contain `spawnclient`, `run`, or `configure`.

  - **Check parent process relationships:** Investigate parent process IDs linked to the suspicious executions. Legitimate runner installations typically originate from known processes like a CI/CD system or automated deployment tools (e.g., Ansible, Chef).

  - **Analyze command-line arguments for malicious patterns:** Validate the command arguments against known legitimate patterns. Malicious executions might include unexpected tokens or URLs that deviate from standard deployment practices.

  - **Assess asset classification and role:** Review if the executing machine is classified as a CI/CD server. Alert severity increases if the process is running on critical infrastructure where sensitive code or secrets are present.

  - **Identify any known runner naming conventions:** Disambiguate any installations matching expected naming patterns as these may indicate legitimate behavior, such as `runner-username-agent`.

  - **Look for additional indicators of compromise (IoCs):** Search for network connections or data transmission events that correlate with the execution, especially outbound communications to unauthorized domains as per logs like Windows Firewall or proxy logs.

  ### Prioritization

  The medium-severity alert suggests a moderate risk; while it indicates possible unauthorized CI/CD runner activity, the likelihood of malicious intent can be lower in environments with frequent changes. If the affected system hosts sensitive workloads, this behavior is concerning, especially given the potential for exploitation through supply chain attacks.

  ### Blind Spots and Assumptions

  The detection may miss legitimate instances of runner execution from authorized deployments by DevOps teams or configuration management tools. Ensuring comprehensive logging from all CI/CD infrastructure components is essential for reliability. Authentic installations may trigger the alert if patterns deviate slightly; therefore, understanding baseline behavior is crucial. Related detections, such as unusual command-line arguments in process creation events (e.g., via a second Sigma rule for generic CI/CD toolchains), can enhance overall coverage and confidence in identifying adversarial activity.

