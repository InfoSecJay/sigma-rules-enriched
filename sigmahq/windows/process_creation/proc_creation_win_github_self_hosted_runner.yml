title: Github Self-Hosted Runner Execution
id: 5bac7a56-da88-4c27-922e-c81e113b20cb
status: test
description: |
  Detects GitHub self-hosted runners executing workflows on local infrastructure that could be abused for persistence and code execution.
  Shai-Hulud is an npm supply chain worm targeting CI/CD environments.
  It installs runners on compromised systems to maintain access after credential theft, leveraging their access to secrets and internal networks.
references:
- https://about.gitlab.com/blog/gitlab-discovers-widespread-npm-supply-chain-attack/
- https://securitylabs.datadoghq.com/articles/shai-hulud-2.0-npm-worm/
author: Daniel Koifman (KoifSec)
date: 2025-11-29
tags:
- attack.command-and-control
- attack.t1102.002
- attack.t1071
logsource:
  category: process_creation
  product: windows
detection:
  selection_worker_img:    # Example command C:\Users\Lab\actions-runner\bin\Runner.Worker.exe spawnclient 1288 1252
  - Image|endswith: '\Runner.Worker.exe'
  - OriginalFileName: 'Runner.Worker.dll'
  selection_worker_cli:
    CommandLine|contains: 'spawnclient'
  selection_listener_img:   # Example command C:\Users\Lab\actions-runner\bin\Runner.Listener.exe  configure --url https://github.com/ABC/ABC --token 123123
  - Image|endswith: '\Runner.Listener.exe'
  - OriginalFileName: 'Runner.Listener.dll'
  selection_listener_cli:
    CommandLine|contains:
    - 'run'
    - 'configure'
  condition: all of selection_worker_* or all of selection_listener_*
falsepositives:
- Legitimate GitHub self-hosted runner installations on designated CI/CD infrastructure
- Authorized runner deployments by DevOps/Platform teams following change management
- Scheduled runner updates or reconfigurations on existing build agents
- Self-hosted runners that follow expected/known naming patterns
- Installation via expected/known configuration management tools (reflected mostly
  as parent process name)
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_github_self_hosted_runner/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of GitHub self-hosted runners on Windows systems, which can be exploited by attackers for maintaining persistence and executing malicious workflows. A threat actor could leverage a self-hosted runner to gain unauthorized access to internal networks or to execute code that interacts with sensitive information, especially if they have previously stolen credentials. The rule specifically looks for the execution of GitHub Actions runner components that could indicate that these workflows are being misused in a compromised environment.

  In terms of MITRE ATT&CK framework relevance, this detection ties into multiple tactics and techniques. The notable tactics include **Execution** (TA0002), as the detection captures unauthorized code execution via runners, and **Command and Control** (TA0011), as these components can be used to maintain communication with an external server. The techniques primarily associated with this detection are **Command-Line Interface** (T1059) and **Application Layer Protocol** (T1071), as the communication between the GitHub runners and the attacker's server often involves API calls over HTTPS.

  The primary data sources for this detection come from `process creation events` on Windows. These events can provide visibility into the execution of specific executables associated with GitHub's self-hosted runners.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the specific process creation logs for the executables `Runner.Worker.exe` and `Runner.Listener.exe` along with their associated command line parameters to verify if they were invoked inappropriately.

  - **Analyze Command-Line Arguments:** Look for unusual or suspicious command-line arguments associated with the runners, especially those that contain keywords like 'spawnclient', 'run', or 'configure' that do not conform to expected usage patterns.

  - **Examine Parent Processes:** Check the parent processes that initiated these runners. Identify if they were spawned by legitimate tools or if there are signs of exploitation, such as unexpected parent processes that do not fit the known deployment method.

  - **Correlate with User Accounts:** Correlate the activity with user accounts that executed the runners. Look for non-admin or unusual accounts that lack proper authorization to deploy such CI/CD infrastructure or access internal resources.

  ### Prioritization
  This alert carries a medium severity due to the potential impact of unauthorized code execution within CI/CD pipelines, which could lead to system compromise or data leaks. The likelihood of this being a true positive is heightened given the growing trend of supply chain attacks targeting CI/CD environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where GitHub runners are used legitimately, as the rule could lead to false positives if extensive whitelisting controls are not implemented. The detection logic assumes that attacks will utilize recognized executables and command-line patterns, which could be bypassed by skilled attackers using obfuscation techniques. Additionally, proper logging settings must be enabled on Windows systems to capture relevant process creation events, and any absence of such logs may hinder the effectiveness of this detection.

