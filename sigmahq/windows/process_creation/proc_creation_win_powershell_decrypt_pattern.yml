title: PowerShell Execution With Potential Decryption Capabilities
id: 434c08ba-8406-4d15-8b24-782cb071a691
status: test
description: Detects PowerShell commands that decrypt an ".LNK" "file to drop the
  next stage of the malware.
references:
- https://research.checkpoint.com/2023/chinese-threat-actors-targeting-europe-in-smugx-campaign/
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-30
modified: 2023-12-05
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_dir:
    CommandLine|contains:
    - "Get-ChildItem "
    - "dir "
    - "gci "
    - "ls "
  selection_cli_gc:
    CommandLine|contains:
    - "Get-Content "
    - "gc "
    - 'cat '
    - 'type '
    - 'ReadAllBytes'
  selection_cli_specific:
  - CommandLine|contains|all:
    - ' ^| '
    - '\*.lnk'
    - '-Recurse'
    - '-Skip '
  - CommandLine|contains|all:
    - ' -ExpandProperty '
    - '\*.lnk'
    - 'WriteAllBytes'
    - ' .length '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects PowerShell commands that attempt to decrypt ".LNK" (shortcut) files, which can serve as a vector to deliver subsequent malware stages. The likely attacker's objective is to manipulate these shortcut files to either execute malicious payloads or retrieve additional components of a malware framework. This behavior is relevant to the MITRE ATT&CK technique for "Command and Scripting Interpreter" (TA0002) and "Malicious File Execution" (T1203).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. A successful decryption of these shortcut files might allow an adversary to run malicious software or scripts, posing a significant risk to system integrity and data confidentiality. This detection does NOT confirm that a compromise has occurred; it only highlights suspicious activity that may warrant further investigation.

  ---

  ### Investigation Steps

  - **Examine the command line arguments used:** Review process creation events (Event ID 4688, Sysmon Event ID 1) for any PowerShell executions containing the strings `Get-ChildItem`, `Get-Content`, or variations thereof. Look for heavily nested recursive directory enumerations or use of `-ExpandProperty`, which can signal attempts to manipulate `.LNK` files.

  - **Validate file creation or exfiltration:** Search for any .LNK files created or modified within the time window of the suspicious PowerShell execution. Monitor for Event ID 4663 (File System Access) to check the creation of new files and their parent directory structures, which should typically be benign user directories.

  - **Identify high-confidence malicious indicators:** Focus on the use of `WriteAllBytes` in the command line combined with indications of reading `.LNK` files. If this occurs within a context not associated with known administrative or system functions, mark this as a critical indicator of a potential threat.

  - **Review the host role for context:** Determine the role of the host executing the PowerShell command. For instance, a server performing routine tasks should not typically be executing PowerShell scripts that manipulate `.LNK` files. Legitimate behavior would involve administrative commands executed in controlled environments, unlike the suspicious activity described.

  - **Document benign activities:** Compare the detected behavior against known utility tasks performed by legitimate users, such as updating icons or shortcut paths for applications. Typical benign command-line usage should derive from direct user intent without complex recursive or intensive operations.

  - **Correlate with other detections:** Check for companion detections related to unusual PowerShell scripts or other process anomalies on the same host or user accounts. Use a tool like SIEM to identify if other triggered alerts correlate with the suspicious execution to strengthen the investigation outcome.

  ---

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on compromised systems, possible lateral movement, and the likelihood of being utilized by adversaries. PowerShell is a commonly weaponized tool, making this detection critical for early intervention in an attack lifecycle.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques such as obfuscating command line arguments or using alternate execution contexts (like scheduled tasks or service accounts). Reliable detection requires comprehensive logging configurations, specifically ensuring PowerShell script block logging and module logging are enabled. Legitimate user behavior, such as administrative scripting or updates for application shortcut paths, may trigger false positives. A related detection to consider is monitoring for unusual behaviors associated with powershell.exe and executing encoded commands, which can complement the coverage provided by this detection.

