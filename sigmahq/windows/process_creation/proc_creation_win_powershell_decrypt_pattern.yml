title: PowerShell Execution With Potential Decryption Capabilities
id: 434c08ba-8406-4d15-8b24-782cb071a691
status: test
description: Detects PowerShell commands that decrypt an ".LNK" "file to drop 
  the next stage of the malware.
references:
- https://research.checkpoint.com/2023/chinese-threat-actors-targeting-europe-in-smugx-campaign/
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-30
modified: 2023-12-05
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_dir:
    CommandLine|contains:
    - "Get-ChildItem "
    - "dir "
    - "gci "
    - "ls "
  selection_cli_gc:
    CommandLine|contains:
    - "Get-Content "
    - "gc "
    - 'cat '
    - 'type '
    - 'ReadAllBytes'
  selection_cli_specific:
  - CommandLine|contains|all:
    - ' ^| '
    - '\*.lnk'
    - '-Recurse'
    - '-Skip '
  - CommandLine|contains|all:
    - ' -ExpandProperty '
    - '\*.lnk'
    - 'WriteAllBytes'
    - ' .length '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects PowerShell commands that involve decrypting .LNK files, typically used by adversaries to stage malware delivery. The likely attacker objective is to leverage this decryption process as a means to execute malicious payloads, facilitating further infiltration or lateral movement within an enterprise network. This behavior aligns with the MITRE ATT&CK tactic "Execution" (TA-0002) and technique "PowerShell" (T1059.001).

  The primary telemetry sources for this alert include Windows process creation logs and PowerShell command line logs. Malicious activity could lead to significant security incidents, including data exfiltration or system compromise. Notably, this detection does not confirm successful execution of malware on its own; further investigation is required to ascertain the impact and intent.

  ### Investigation Steps

  - **Review PowerShell logs**: Query Windows Security Event ID 4688 for instances where `powershell.exe` or `pwsh.exe` was executed. Focus significantly on command lines containing “*.lnk” along with `-ExpandProperty` and `WriteAllBytes`, indicating potentially malicious actions.

  - **Confirm file creation**: Check file system audit logs for newly created files, particularly those with the `.lnk` extension, within folders known to be maliciously used (e.g., user temporary directories). This could indicate successful deployment of a malware stage.

  - **Analyze legitimate usage**: Look for expected usage patterns of PowerShell commands like `Get-ChildItem` or `Get-Content` executed by authorized applications or scripts managed by systems administrators. It’s plausible that legitimate admin tasks may invoke these commands without invoking suspicious flags.

  - **Identify high-confidence malicious indicators**: Focus on any user or process that repeatedly executes commands with the identified suspicious patterns. Pay attention to unusual parent processes that could suggest exploitation or living-off-the-land execution methods.

  - **Correlate with other security tools**: Check EDR logs for suspicious parent-child process relationships or indicators of lateral movement that coincide with the time of the detected PowerShell command execution. Look for logs that correspond to known threat actors' TTPs such as those referenced in the Checkpoint research.

  ### Prioritization

  This alert should be treated as high severity given the potential impact on critical systems and data. The likelihood of abuse is significant since attackers commonly use PowerShell for execution of attacks, especially in environments where rubber-stamped administrative access exists.

  ### Blind Spots and Assumptions

  Evasion techniques may include using obfuscation in PowerShell commands or launching scripts from trusted locations. Reliable detection requires a complete set of process creation and PowerShell logging enabled across endpoints. Additionally, legitimate administrative automation tasks may trigger this alert, potentially leading to false positives. A related detection that complements this alert is the monitoring of fileless malware activities, as they may also employ PowerShell without touching the disk.

