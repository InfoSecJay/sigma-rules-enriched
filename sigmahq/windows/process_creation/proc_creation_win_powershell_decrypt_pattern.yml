title: PowerShell Execution With Potential Decryption Capabilities
id: 434c08ba-8406-4d15-8b24-782cb071a691
status: test
description: Detects PowerShell commands that decrypt an ".LNK" "file to drop the
  next stage of the malware.
references:
- https://research.checkpoint.com/2023/chinese-threat-actors-targeting-europe-in-smugx-campaign/
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-30
modified: 2023-12-05
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_dir:
    CommandLine|contains:
    - "Get-ChildItem "
    - "dir "
    - "gci "
    - "ls "
  selection_cli_gc:
    CommandLine|contains:
    - "Get-Content "
    - "gc "
    - 'cat '
    - 'type '
    - 'ReadAllBytes'
  selection_cli_specific:
  - CommandLine|contains|all:
    - ' ^| '
    - '\*.lnk'
    - '-Recurse'
    - '-Skip '
  - CommandLine|contains|all:
    - ' -ExpandProperty '
    - '\*.lnk'
    - 'WriteAllBytes'
    - ' .length '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious PowerShell commands that indicate the execution of scripts capable of decrypting `.LNK` (Windows shortcut) files, which may be linked to subsequent stages of malware delivery. Attackers often leverage PowerShell for its versatility in executing commands that can manipulate files, interact with system resources, or download additional payloads. The likely objective of this behavior is to maintain persistence within the environment or to facilitate broader attacks by executing subsequent malware components.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution (TA0002)**: PowerShell is often used to execute malicious scripts directly on the target system.
  - **Command and Control (TA0011)**: Through encrypted communications, attackers may later retrieve additional instructions or payloads after the initial exploitation.
  - **Defense Evasion (TA0005)**: The use of PowerShell for such activities can help attackers evade detection mechanisms that focus on traditional executable files.

  The primary data sources that will yield crucial evidence for this detection are Windows process creation logs. These logs provide visibility into executed commands, the context of their execution (such as whether they use `powershell.exe` or `pwsh.exe`), and the command line arguments supplied, which can shed light on potentially malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation events for `powershell.exe` or `pwsh.exe` execution. Pay special attention to the command line used, looking for patterns consistent with the detected behavior.
  - **Analyze Command Line Arguments**: Look for the presence of commands like `Get-ChildItem`, `Get-Content`, and `WriteAllBytes`. Check for any combinations with `.lnk` files that might indicate an attempt to decrypt or manipulate shortcuts.
  - **Check for Known Malicious Behavior**: Research specific variants of malware known to utilize PowerShell for decryption and follow-up actions, particularly any associated with campaigns targeting your environment.
  - **Correlate with Other Security Tools**: Use EDR, SIEM, and NDR tools to identify any lateral movement or command and control communications that may coincide with the timing of the suspicious PowerShell execution.

  ### Prioritization
  This alert is classified as high severity due to the significant risk associated with malware that uses PowerShell for decryption purposes. The ability to decouple stages of malware delivery can lead to severe impacts on the organization, including data exfiltration and network breaches.

  ### Blind Spots and Assumptions
  One potential gap in detection might arise from environments with strict PowerShell usage policies or where PowerShell usage is heavily restricted, thus possibly leading to false negatives. The detection logic assumes that suspicious command line patterns will be logged and accessible in the relevant process creation logs. If PowerShell logging policies are not appropriately configured, this could hinder the efficacy of this detection rule. Additionally, certain legitimate use cases might cause overlaps, although they are considered unlikely to trigger false positives based on the command patterns outlined.

