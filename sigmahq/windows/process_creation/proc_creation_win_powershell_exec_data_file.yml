  ---

  ### Technical Context

  This Sigma rule detects the inline execution of PowerShell code that is sourced from a file. Such activities often indicate an attempt to execute potentially malicious scripts that could facilitate unauthorized system access or data exfiltration. The likely attacker objective is to run arbitrary code in a targeted environment without detection, leveraging PowerShell’s powerful capabilities. This behavior aligns with the MITRE ATT&CK Execution tactic and the technique ID T1059.001 (PowerShell).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments. If the detected behavior is indeed malicious, it could result in a significant security impact, such as unauthorized data manipulation or system control. However, this detection alone does not confirm that the activity is indeed malicious; it may represent legitimate administrative actions or scripts running in a controlled context.

  ---

  ### Investigation Steps

  - **Review command line arguments for PowerShell execution:** Check Security Event ID 4688 or Sysmon Event ID 1 for CommandLine fields containing 'iex ', 'Invoke-Expression ', 'cat ', or 'get-content '. Legitimate scripts typically include clear administrative tasks or predefined parameters without unexpected obfuscation.

  - **Identify known script execution sources:** Look for execution from unusual paths (e.g., user profile directories) as opposed to expected locations like C:\Windows\System32. Malicious indicators include scripts that execute from temporary folders or user downloads.

  - **Correlate with user activity logs:** Cross-reference with user accounts logged in during the execution time by checking Windows Event ID 4624 for logins. Anomalous user activity patterns, such as unusual login times or locations, increase risk assessment.

  - **Validate PowerShell execution results:** Capture logs from potential output locations of executed scripts (e.g., C:\Users\<Username>\Documents) for unexpected file creations via API calls such as New-Item or Set-Content. Created files that match unusual naming patterns or contain sensitive data could indicate malicious activity.

  - **Check for lateral movement tools:** Investigate if any additional tools like Mimikatz or other credential dumping utilities are executed post PowerShell activity using Security Event ID 4688. The presence of such tools raises suspicion of a broader scope of malicious activity.

  - **Document legitimate PowerShell administrative actions:** Identify common administrative automation scripts and usage scenarios from known IT personnel. Establish a baseline to differentiate between legitimate administrative PowerShell use and potential misuse.

  ---

  ### Prioritization

  This alert should be treated with medium severity in an enterprise context. The impact depends on the role and criticality of the affected asset; execution on a Domain Controller would be more severe than on a non-critical asset. The likelihood of malicious abuse is notable because PowerShell is frequently exploited in attacks, but not every execution indicates a compromise.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all PowerShell executions or by potential command line obfuscation techniques. Additionally, normal administrative tasks may trigger the alert, complicating triage efforts. Proper logging configurations (both Sysmon and Windows Event Logs) are essential for reliable detection. Related detections for wider coverage include monitoring for abnormal PowerShell module imports or network connections initiated by PowerShell processes, which may indicate further malicious intent.

