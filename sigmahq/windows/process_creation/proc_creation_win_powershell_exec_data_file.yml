detection:
  selection_exec:
    CommandLine|contains:
    - 'iex '
    - 'Invoke-Expression '
    - 'Invoke-Command '
    - 'icm '
  selection_read:
    CommandLine|contains:
    - 'cat '
    - 'get-content '
    - 'type '
  selection_raw:
    CommandLine|contains: ' -raw'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
