note: |
  ### Technical Context

  This Sigma rule detects the inline execution of PowerShell commands sourced from a file, indicative of potential script-based attacks or misuse of PowerShell for command execution. Attackers often aim to execute commands to manipulate the system, deploy additional malware, or perform reconnaissance. The relevant MITRE ATT&CK techniques include Execution (T1059.001) and potentially Command and Control (T1071) if the commands facilitate further malicious activity.

  The primary telemetry sources for this detection include Windows process creation logs such as Security Event ID 4688 or Sysmon Event ID 1, which capture detailed command-line activity. If this behavior is malicious, it could lead to unauthorized access, data manipulation, or lateral movement within the network. However, it's important to note that detecting this inline execution does NOT inherently confirm malicious intent, as legitimate scripts may also perform similar operations.

  ### Investigation Steps

  - **Identify suspicious PowerShell command usage:** Review Security Event ID 4688 logs for command lines containing 'iex ', 'Invoke-Expression ', 'Invoke-Command ', or other related terms. Look for execution from unusual accounts or during odd hours.

  - **Validate PowerShell execution context:** Confirm the parent process of PowerShell executions. Expected legitimate executions often originate from trusted scripts or system processes. Malicious executions may have parent processes like cmd.exe or unusual applications.

  - **Check operations from file read commands:** Look for instances of command lines containing 'cat ', 'get-content ', or 'type ', particularly for non-standard files or locations. Cross-reference these with known good baselines.

  - **Analyze process creation patterns:** Use Sysmon Event ID 1 data to identify any unusual patterns or rapid execution of multiple PowerShell commands in a short time frame, which may indicate abuse.

  - **Log observation for self-calling behavior:** Investigate if the PowerShell instances are calling themselves recursively without proper exits. This is uncommon and could indicate malicious intentions.

  - **Correlate with other telemetry:** Cross-reference with firewall and network logs to see if there are any outbound connections that coincide with the observed PowerShell activity, which could indicate command and control communication.

  ### Prioritization

  The alert should be considered medium severity within the SOC. It represents a moderate risk, as it indicates potentially malicious PowerShell usage, which is commonly weaponized by attackers. The impact can escalate quickly if the activity leads to further exploitation or lateral movement in critical systems.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as obfuscation or encoded command execution that may not be captured in standard logs. Reliable detection requires consistent monitoring of the specific process creation logs mentioned, and users running PowerShell may trigger this rule legitimately when executing administrative scripts. Companion detections, such as monitoring for unusual outbound network connections or other command execution logs, would enhance overall coverage and context for investigations.

