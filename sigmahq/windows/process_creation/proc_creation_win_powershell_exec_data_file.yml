title: Powershell Inline Execution From A File
id: ee218c12-627a-4d27-9e30-d6fb2fe22ed2
status: test
description: Detects inline execution of PowerShell code from a file
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=50
author: frack113
date: 2022-12-25
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_exec:
    CommandLine|contains:
    - 'iex '
    - 'Invoke-Expression '
    - 'Invoke-Command '
    - 'icm '
  selection_read:
    CommandLine|contains:
    - 'cat '
    - 'get-content '
    - 'type '
  selection_raw:
    CommandLine|contains: ' -raw'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of PowerShell code being executed inline from a file. Specifically, it looks for patterns in the command-line arguments of process creation events that indicate the use of constructs like `Invoke-Expression`, `Invoke-Command`, or `-raw` parameters, coupled with commands to read from files such as `cat`, `get-content`, or `type`. The use of inline execution is commonly seen in both legitimate administrative tasks and in malicious activities, where attackers may attempt to evade detection by executing code dynamically.

  The threat scenario often involves an attacker leveraging PowerShell to execute scripts or commands directly from a file, targeting enterprise environments to achieve objectives such as lateral movement, credential harvesting, or establishing persistence. Attackers might exploit PowerShell's flexible syntax to bypass traditional detection mechanisms. Relevant MITRE ATT&CK techniques include **Execution: Command and Scripting Interpreter (T1059.001)**, which focuses on using scripting interpreters like PowerShell, and potentially **Execution: Scheduled Task/Job (T1053)** if the execution is orchestrated in a scheduled manner.

  Primary data sources for detecting this behavior should include process creation logs from Windows Event Logging, where command-line parameters are captured. This telemetry is essential for identifying both expected and unexpected PowerShell activity within the environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify the execution of PowerShell with the specified command line patterns. Pay attention to any unusual parent processes that might indicate suspicious behavior.

  - **Correlate with File Access Logs**: Look into file access logs for any file read events related to the command lines detected. Identify source and target files involved in the execution of inline PowerShell commands.

  - **Verify User Context**: Check the user accounts associated with the detected execution. Investigate if the users have necessary permissions or if accounts were misused to run potentially malicious commands.

  - **Investigate Lateral Movement Indicators**: Consider other signs of lateral movement, such as unusual network connections or authentication attempts. Validate if the invoked commands target sensitive resources or systems beyond the initial host.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential for misuse in executing arbitrary code or scripts, which can lead to significant compromises if exploited by adversaries. While this behavior can also be legitimate, the context of execution should be closely scrutinized to determine its intent.

  ### Blind Spots and Assumptions
  This detection logic may not adequately cover obfuscated PowerShell commands that could be executed without the aforementioned patterns, thereby allowing advanced threats to bypass detection. It assumes that process creation logs are configured correctly to capture necessary command-line details. Additionally, if users are employing legitimate PowerShell scripts or utilizing built-in administrative tasks, these might inadvertently generate false positives, necessitating a thorough context-based review of the incidents detected for accurate threat assessment.

