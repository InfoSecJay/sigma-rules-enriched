title: Powershell Inline Execution From A File
id: ee218c12-627a-4d27-9e30-d6fb2fe22ed2
status: test
description: Detects inline execution of PowerShell code from a file
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=50
author: frack113
date: 2022-12-25
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_exec:
    CommandLine|contains:
    - 'iex '
    - 'Invoke-Expression '
    - 'Invoke-Command '
    - 'icm '
  selection_read:
    CommandLine|contains:
    - 'cat '
    - 'get-content '
    - 'type '
  selection_raw:
    CommandLine|contains: ' -raw'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects inline execution of PowerShell commands from files, specifically monitoring for the use of commands like `iex`, `Invoke-Expression`, and `Invoke-Command`, which can execute arbitrary code within the context of PowerShell. The likely attacker objective is to execute malicious scripts or commands that have been stored in files, enabling them to leverage PowerShell for post-exploitation actions. This behavior maps to the MITRE ATT&CK tactic of **Execution** and the technique **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**.

  Primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1, which provide details about command-line arguments used during PowerShell executions. If triggered by a malicious actor, the security impact could be significant, as it may indicate intentions to execute unauthorized or harmful commands. However, it is important to note that this detection does NOT confirm that the execution is inherently malicious; legitimate administrative actions or scripts may also utilize these commands.

  ### Investigation Steps

  - **Examine PowerShell execution logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for PowerShell process creation events. Look for unusual command-line arguments that contain `iex`, `Invoke-Expression`, or others listed in the rule to assess the nature of the execution.

  - **Identify the parent process:** Determine the parent process of each relevant PowerShell execution. A process initiated from unexpected sources (e.g., non-administrative tools or scripts) may indicate malicious intent.

  - **Assess command context:** Review the command-line arguments for any strings that suggest data exfiltration, such as `Invoke-WebRequest` or any use of URLs, which may suggest that the PowerShell script is trying to send or retrieve data.

  - **Validate expected behavior:** Compare the observed PowerShell usage to known good patterns. For example, administrative scripts in your environment may regularly call `Invoke-Expression` for legitimate automation; document acceptable use cases and compare accordingly.

  - **Correlate with endpoint telemetry:** Cross-reference with endpoint detection logs or EDR tools that may provide context on the PowerShell session, such as time of execution, prior logged user behavior, or network activity following the execution.

  - **Cross-check for PowerShell script files:** Look for any PowerShell script files the command may reference, particularly if any commands utilize `cat`, `get-content`, or similar commands to read content from files, as leveraging these could indicate script loading before execution.

  ### Prioritization

  The alert severity is medium due to its capability to indicate potential malicious activity in a critical environment where PowerShell is frequently used for administration. The likelihood of malicious abuse is moderately high, as adversaries regularly leverage inline PowerShell execution techniques during attacks. This behavior has been weaponized in various attacks, particularly against institutional targets.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by users who employ obfuscation techniques or create aliases for PowerShell commands to evade detection. Reliable detection hinges on complete visibility of Windows process creation logs; ensure that Sysmon is properly configured to capture detailed logging. Legitimate activities may include administrative PowerShell scripts employed for automation or maintenance tasks. A companion detection rule targeting unauthorized PowerShell downloads or script execution may further enhance detection capabilities.

