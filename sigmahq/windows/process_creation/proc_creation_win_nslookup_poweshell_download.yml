note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that utilize `nslookup` for downloading payloads from DNS TXT records. The likely attacker objective is to exfiltrate data or deliver malicious content without utilizing traditional, more detectable methods of command and control. This behavior maps to the MITRE ATT&CK framework under the tactic of Command and Control (T1071.004) which involves the use of DNS for data exfiltration or communication with an external entity.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process command-line arguments and parent-child relationships. If malicious, this behavior can indicate an attempt to bypass security measures and establish communication with an external command and control server. Importantly, this detection alone does not confirm malicious intent; legitimate usage of `nslookup` may lead to similar command patterns.

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1 related to `nslookup.exe` being executed. Confirm the parent process is `powershell.exe` or `pwsh.exe` to better contextualize the alert.

  - **Examine command-line arguments**: Look for specific command-line options like `-q=txt`, `-querytype=txt`, or `-type=txt`. Legitimate uses typically do not include these in combination with PowerShell scripts aimed at DNS queries.

  - **Verify DNS request logs**: Inspect logs for DNS queries associated with the reported `nslookup` command. Analyze outbound DNS requests for queries returning suspicious TXT records, which might be indicative of data exfiltration.

  - **Identify file creations or downloads**: Validate any subsequent creation of files or downloads initiated by `nslookup` that may be executed by PowerShell. Check for unusual file extensions or unexpected content in context to the command being executed.

  - **Assess regular usage patterns**: Understand baseline behavior for `nslookup` in your environment. Legitimate internal administrative scripts may use similar command patterns; identify whether those occurred around the same time as the alert.

  - **Look for high-confidence malicious indicators**: If DNS queries return TXT records containing executable URLs, these can be considered high-confidence indicators of malicious intent. Cross-reference with known indicators of compromise (IoCs) where applicable.

  ### Prioritization

  This alert has a medium severity due to the potential impact of the affected systems, especially if they are part of critical infrastructure. While not all nslookup usage is nefarious, the likelihood of attackers using such techniques is well-established, making this a crucial alert for immediate investigation.

  ### Blind Spots and Assumptions

  Detection can be limited by legitimate uses of `nslookup` for system administration. Effective detection relies on having proper logging configurations enabled, especially for process creation events and DNS resolutions. Legitimate internal scripts or administrative users running `nslookup` commands may trigger these alerts. Companion detections related to unusual DNS activity or alerts on incoming/outgoing DNS traffic (e.g., DNS exfiltration patterns) should be considered for enhanced coverage.

