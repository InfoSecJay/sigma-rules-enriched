note: |
  ### Technical Context

  This detection rule identifies the use of PowerShell to execute `nslookup` for the purpose of downloading malicious payloads from DNS records, commonly referred to as a DNS download cradle. The likely objective of an attacker is to exfiltrate data or fetch additional malicious components in a covert manner, leveraging DNS which is typically allowed through network security controls. The relevant MITRE ATT&CK tactic for this behavior is "Defense Evasion" (TA0005), specifically the technique "Data Obfuscation" (T1560).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on the execution of `nslookup.exe` initiated by PowerShell (powershell.exe or pwsh.exe). If this behavior is malicious, it may allow data exfiltration without triggering traditional defenses, posing significant risk to the security posture of the organization. It is important to note that this detection does not, on its own, confirm that malicious activity is occurring without further investigation into the context of the command and the nature of the DNS requests made.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for instances of `nslookup.exe` initiated by `powershell.exe` or `pwsh.exe` within the last 24 hours. Compare the command line for unusual flags like `-q=txt` or `-querytype=txt`, indicative of potential malicious payload fetching.

  - **Investigate DNS query logs:** Analyze DNS query logs for high volume or unusual TXT record queries associated with the detected `nslookup` command. Look for patterns in the queried domains; known malicious domains or domains exhibiting rapid churn may indicate a threat.

  - **Correlate with known threats:** Cross-reference the detected `nslookup` command with threat intelligence feeds or sandbox analysis results to identify if the command and associated domains are linked to known malware or attack scenarios.

  - **Evaluate legitimate usage:** Confirm any internal usage of `nslookup` as part of normal operational procedures, such as legitimate domain queries. Document any approved scripts or documented usage that might justify the command line parameters observed.

  - **Identify potential malware indicators:** Look for signs of downloaded payloads on the endpoint, including new files created in temporary or unusual directories post-`nslookup` execution. Validate file hashes against known malware repositories.

  ### Prioritization

  This alert has a medium severity rating as it indicates a potential avenue for data exfiltration or payload delivery, which can compromise sensitive data. While this technique may not always be weaponized, its use in the wild signifies a moderate risk level, especially given the nature of the affected systems and their exposure to DNS traffic.

  ### Blind Spots and Assumptions

  This detection may miss planned or skilled evasion tactics, such as the use of alternative DNS tools or obfuscation methods within expected PowerShell workflows. Reliable detection depends on the proper logging of both process creation events and DNS query logs. Common legitimate scenarios such as network troubleshooting or maintenance tasks may trigger this alert, necessitating context to differentiate them. A related detection rule monitoring for unusual DNS query patterns can enhance overall visibility into potential abuse.

