note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands that leverage `nslookup` as a download cradle, a technique employed by attackers to exfiltrate malware or other payloads from DNS records. By using `nslookup`, which typically resolves domain names to IP addresses, an attacker can retrieve malicious payloads hidden within the DNS response, facilitating code execution within the target environment without raising significant alarms. The primary threat objective is to establish a foothold within an enterprise network, deploy additional malicious tools, or create a backdoor for further exploitation.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (T1203)**, as the adversary seeks to bypass security controls using benign-looking commands, and **Command and Control (T1071.001)**, which describes communication conducted over DNS, often to obfuscate malicious activity or avoid detection. This technique might be used in conjunction with other tactics, substantiating an increasing sophistication in attacks utilizing standard protocols and native OS tools.

  Key data sources for this alert include **process creation events**, which capture the execution of the `nslookup` process and allow an analyst to observe the command line arguments provided, as well as any related logs for PowerShell executions that could indicate potentially malicious usage patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:**: Analyze process creation logs to identify instances of `nslookup.exe` being called, particularly focusing on command lines that include `-q=txt` or `-querytype=txt`, combined with a parent process of PowerShell.
  - **Examine PowerShell Logs:**: Check PowerShell execution logs for any unusual commands or patterns that involve `nslookup` or obscure DNS queries, especially those that may indicate a payload retrieval process.
  - **Investigate DNS Query Logs:**: Investigate logs from internal and external DNS servers for queries made by the system in question to identify any suspicious domain names that may correlate with known malicious indicators.
  - **Correlate with Network Traffic:**: Utilize network traffic analysis tools (NDR) to correlate the commands found in logs with network communications initiated by the affected host, focusing on DNS traffic patterns that coincide with the `nslookup` execution.

  ### Prioritization
  The medium alert severity is warranted due to the potential impact of successful exploitation using a download cradle, which can allow for arbitrary code execution and further compromise of the network. However, the likelihood of false positives from benign administrative tasks using `nslookup` requires careful consideration and investigation.

  ### Blind Spots and Assumptions
  One blind spot in the detection coverage may involve environments that do not log process creation events or have insufficient logging policies in place, leading to missed detections. The detection logic assumes that `nslookup` will be invoked through PowerShell, which may not cover cases where other scripting or command execution methods are utilized. To ensure the effectiveness of this alert, it is essential that systems are configured to log detailed process creation events, PowerShell commands, and DNS query logs accurately and comprehensively.

