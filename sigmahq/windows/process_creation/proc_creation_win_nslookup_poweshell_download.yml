note: |
  ### Technical Context

  This detection identifies the use of PowerShell to execute `nslookup` commands that are commonly associated with download cradles, which are techniques used by attackers to retrieve malicious files from DNS records. The likely objective is to bypass traditional security controls by using DNS as a covert channel for delivering payloads. This behavior aligns with the MITRE ATT&CK tactics of "Command and Control" (T1071) and techniques of "Application Layer Protocol" (T1071.001).

  The primary telemetry sources involved include process creation logs from Windows, specifically Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes and their command-line arguments. If this behavior is malicious, it could lead to the execution of arbitrary code, data breaches, or lateral movement within the environment. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; further context is needed for accurate attribution.

  ### Investigation Steps

  - **Check executing process details:** Review Security Event ID 4688 for the `nslookup.exe` instance. Verify that the parent process is `powershell.exe` or `pwsh.exe`. Look for command-line arguments containing `-q=txt` or `-querytype=txt`. Malicious indicators include unexpected or obfuscated command-line arguments.

  - **Review DNS query logs:** Check the DNS logs corresponding to the timestamps of the alert for unusual TXT record queries initiated by the host in question. A legitimate request typically arises from known, trusted applications. Malicious behavior may include repeated queries to unknown or suspicious domains.

  - **Analyze file downloads:** Investigate for file creation or modifications on the host using Sysmon Event ID 11 or Windows Event ID 5145, checking for any new files created that may correlate with the nslookup activity. Pay attention to file names and extensions that indicate potential malicious downloads (e.g., executable files).

  - **Correlate with relevant alerts:** Assess any other alerts within the environment triggered by the same host or user account, particularly those related to suspicious PowerShell activities or outbound DNS queries. Close proximity timing with other indicators is suggestive of coordinated attack activity.

  - **Identify legitimate usage patterns:** Establish baseline behaviors for DNS lookups on the affected host. Legitimate users may perform DNS queries for domain resolution or troubleshooting, generally with well-known domains. Compare this to activity that triggers the alert.

  ### Prioritization

  This alert holds medium severity due to the potential impact on sensitive systems and the nature of DNS being a common channel for data exfiltration or command control. The use of nslookup in this context is increasingly weaponized by threat actors hoping to evade detection, thereby warranting immediate investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by instances where logging is not enabled for process creation or DNS queries, thus preventing visibility into related activities. Additionally, legitimate administrative tasks or scripts performing DNS queries may inadvertently trigger the alert. A related detection to consider is monitoring for direct downloads via PowerShell (T1059.001) to enhance contextual coverage and response.

