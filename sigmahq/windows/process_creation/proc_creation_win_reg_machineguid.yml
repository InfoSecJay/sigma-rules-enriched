note: |
  ### Technical Context

  This Sigma rule detects instances where the `reg.exe` command-line tool is used to query the Windows Registry for the `MachineGuid` under the `SOFTWARE\Microsoft\Cryptography` key. This behavior is commonly utilized by attackers to gather unique identifiers of the system, which can be used for persistence or evasion tactics. The relevant MITRE ATT&CK tactic is **Discovery** (TA0007) with the technique being **System Information Discovery** (T1082). The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could lead to further exploitation or compromise of the system. This detection does NOT confirm that an attack is occurring, as querying for `MachineGuid` could be part of benign software behavior or administrative tasks.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for instances of `reg.exe` execution. Look for command lines containing `/v MachineGuid` to confirm potential malicious intent.

  - **Identify scripted or automated behavior**: Examine the timestamps and frequency of `reg.exe` usage. Repeated, automated querying can indicate suspicious activity, while infrequent usage by known admin accounts may suggest normal behavior.

  - **Validate system context**: Determine if the host is a high-value asset (e.g., domain controllers, endpoints with sensitive data) or a standard user machine. High-value targets warrant more suspicion.

  - **Check for legitimate administrative tasks**: Compare the alert with known administrative activities such as software installations or system configurations. If the command follows a known user-initiated change, it may be benign.

  - **Search for related processes or behaviors**: Investigate if the `reg.exe` activity correlates with other suspicious activities such as multiple logins from different locations or unauthorized software installation processes.

  ### Prioritization

  This alert has a low severity level in an enterprise context due to its low likelihood of immediate malicious activity being confirmed from a single instance alone. However, its relevance increases if associated with other suspicious behaviors on high-value assets, as it is a preliminary step often taken in a reconnaissance phase.

  ### Blind Spots and Assumptions

  This detection may miss attempts to obfuscate commands through encoding or other means of evasion that do not utilize `reg.exe`. The effectiveness of this rule relies on proper logging configuration for process creation. Legitimate activities could trigger this alert, including authorized scripts or software performing system checks. A companion detection to consider is monitoring for further enumeration commands following this query, such as other registry accesses through `reg.exe` or PowerShell, which can offer stronger indications of a reconnaissance effort.

