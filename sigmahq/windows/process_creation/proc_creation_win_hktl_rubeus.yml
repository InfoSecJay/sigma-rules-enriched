note: |
  ### Technical Context

  This rule detects the execution of the Rubeus hack tool on Windows systems, which is often leveraged for credential access and lateral movement. Rubeus allows attackers to manipulate Kerberos tickets, enabling them to conduct actions such as ticket-granting ticket (TGT) requests, Kerberoasting, and ticket renewal. The primary MITRE ATT&CK tactics triggered by this activity are **Credential Access (T1003)** and **Lateral Movement (T1558.003)**.

  The primary telemetry source is Windows process creation logs, specifically capturing details such as command line arguments and executable image names associated with Rubeus. If executed maliciously, this behavior could lead to unauthorized access to sensitive data and facilitate further compromise within the network. However, the detection does not confirm that actual unauthorized access has occurred; rather, it indicates an attempt that warrants further investigation.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 to confirm instances of `Rubeus.exe`. Focus on entries with the executable image path ending in `\Rubeus.exe` and verify if they match known command line arguments indicative of malicious intent.

  - **Analyze command line parameters:** For flagged Rubeus executions, scrutinize command line arguments for high-risk indicators such as `kerberoast`, `dump /service:krbtgt`, or `asktgt /user:`. Confirm that these commands are not used in standard operations to differentiate between benign and malicious activities.

  - **Identify user account context:** Assess the user account associated with the Rubeus execution. A service account or a user that typically accesses Kerberos functionalities in a non-administrative role may indicate legitimate use, while unusual or high-permission accounts performing such actions should be treated as suspicious.

  - **Investigate related account activity:** Check for any unusual Kerberos ticket requests or authentications using Event ID 4768 (TGT requests) and Event ID 4769 (service ticket requests) around the time of the Rubeus activity. Look for patterns that suggest unauthorized access or lateral movement.

  - **Review asset criticality:** Determine the affected host's role within the organization. An alert from critical servers (e.g., domain controllers) should be prioritized higher than alerts from non-critical systems.

  - **Evaluate legitimate Rubeus usage:** Document any known legitimate usage of Rubeus for testing or administrative purposes, such as within a security assessment context. This can help to filter false positives and understand the business case.

  ### Prioritization

  This alert is critical due to its potential impact on credential theft and lateral movement within an environment. Rubeus is frequently weaponized in advanced persistent threat (APT) scenarios, making any detection of its execution highly suspicious and warranting immediate investigative follow-up.

  ### Blind Spots and Assumptions

  The rule is limited by potential evasion techniques, such as attackers renaming Rubeus or modifying its command structure to evade detection. Reliable detection requires proper logging configurations, including Sysmon installation to capture comprehensive process activity. Additionally, benign activities such as automated IT processes or legitimate red team exercises may trigger the alert, necessitating thorough context review. Related detections, such as flagging unusual Kerberos ticket requests, can provide additional context to enhance coverage and improve investigative accuracy.

