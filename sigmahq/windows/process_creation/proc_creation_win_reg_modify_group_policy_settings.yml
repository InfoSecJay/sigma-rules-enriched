note: |
  ### Technical Context

  This Sigma rule detects modifications to Group Policy Objects (GPOs) that may indicate malicious activity. GPO modifications can enable various adversarial objectives, such as disabling security features or facilitating persistence mechanisms. This behavior falls under the MITRE ATT&CK tactic for Privilege Escalation (TA0004) and the technique of Modify Group Policy Settings (T1484.001). The primary telemetry sources include Windows process creation events, particularly Security Event ID 4688 and Sysmon Event ID 1, capturing both the execution of `reg.exe` and the associated command line arguments.

  If malicious, the potential impact includes disabling crucial security controls or enabling unauthorized access to sensitive areas of the environment. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Investigate Security Event ID 4688 and Sysmon Event ID 1 for `reg.exe` execution. Focus on the Process Command Line for indicators of GPO modification, specifically parameters like `GroupPolicyRefreshTime` or `EnableSmartScreen`.

  - **Correlate user actions:** Analyze the user context in which the modification occurred. Legitimate administrative actions usually originate from well-known accounts or through established management workflows and should match expected maintenance windows.

  - **Review Audit Policy settings:** Verify if Group Policy audit logging is enabled and review the following Event ID 4704 (Set Group Policy) events. This can reveal if an administrative account legitimately modified GPO settings.

  - **Look for a malicious command pattern:** Identify common malicious command patterns or arguments in command line data, such as those related to security setting changes that counter established policies (e.g., disabling SmartScreen).

  - **Assess GPO modification frequency:** Frequent or unexpected modifications of GPO settings could indicate potential abuse. Compare historical modification logs from Active Directory against the current changes.

  - **Identify concurrent suspicious activity:** Cross-reference with other alerts indicating potentially malicious behavior, such as unauthorized remote access or privilege escalation attempts, to establish a comprehensive view of possible compromise.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if GPO modifications are malicious. The likelihood of abuse is notable, as adversaries frequently target GPO settings to enhance their foothold in environments. This behavior is commonly weaponized in targeted attacks to escalate privileges or disable security measures.

  ### Blind Spots and Assumptions

  This detection may not capture all GPO-related activities due to legitimate administrative modifications that could trigger the alert. Evasion techniques include using alternative methods to alter GPOs or using non-standard executables that perform similar actions. Effective detection requires proper logging configurations for active directory events, including GPO modifications. Companion detections, such as monitoring for unusual login behaviors or unauthorized account access, can enhance visibility and context around these modifications.

