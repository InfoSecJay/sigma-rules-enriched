detection:
  selection_reg:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_path:
    CommandLine|contains: '\SOFTWARE\Policies\Microsoft\Windows\System'
  selection_key:
    CommandLine|contains:
    - GroupPolicyRefreshTimeDC
    - GroupPolicyRefreshTimeOffsetDC
    - GroupPolicyRefreshTime
    - GroupPolicyRefreshTimeOffset
    - EnableSmartScreen
    - ShellSmartScreenLevel
  condition: all of selection_*
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify malicious modifications to Group Policy Objects (GPO) within a Windows environment. Attackers may alter GPO settings to enforce malicious policies that can lead to various malicious behaviors, such as privilege escalation, unauthorized access control changes, or implementation of additional malware functionalities. By focusing on specific registry changes associated with Group Policy, the rule aims to catch unauthorized adjustments that could be indicative of a compromise or malicious intent.

  The likely threat scenario involves an attacker gaining unauthorized access to a Windows environment and attempting to manipulate GPO settings to facilitate further attacks, such as lateral movement or credential harvesting. The potential attackers behind these actions are often advanced persistent threats (APTs) or malicious insiders exploiting elevated privileges or weaknesses in the environment.

  Relevant MITRE ATT&CK tactics include:
  - Defense Evasion (T1484)
  - Privilege Escalation (T1484.001), specifically due to the nature of modifying security and group policies.

  Primary data sources for this detection rule include:
  - Process creation events that capture when the `reg.exe` executable is called, along with relevant command-line parameters used during these executions.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect logs related to all instances of `reg.exe` execution, focusing on those with command-line arguments that suggest GPO modifications. Analyze timestamps to correlate with any other suspicious activity.

  - **Examine Registry Changes:** Utilize tools to query and analyze registry changes, specifically targeting the paths related to GPO configurations. Pay close attention to modifications on keys associated with `GroupPolicyRefreshTimeDC`, `EnableSmartScreen`, and other related settings.

  - **Audit GPO Changes:** Investigate GPO modification logs within Active Directory (if available). Look for unusual changes or entries that were performed by users who typically do not modify GPOs.

  - **Check User Privilege Levels:** Verify the privileges of accounts that executed commands related to GPO changes. Determine if the actions were done by legitimate administrators or if potentially compromised accounts were involved.

  ### Prioritization
  This alert should be treated with medium priority due to the substantial impact that malicious modifications to GPO settings can have on the integrity and security of the entire environment. Given that attackers may leverage such changes to persist and escalate privileges, rapid investigation is necessary.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may arise from legitimate administrative activities that could trigger the rule, as the alert is designed to gauge behaviors that could also correspond with normal operations. Additionally, there may be assumptions that all GPO modifications are logged appropriately; environments with limited auditing configured might not capture all relevant actions. To ensure optimal detection, it is essential that process creation and registry auditing logs are enabled and sufficiently retained for review.

