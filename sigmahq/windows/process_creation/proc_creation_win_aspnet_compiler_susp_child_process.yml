note: |
  ### Technical Context

  This rule detects suspicious child processes spawned by `aspnet_compiler.exe`, which is a legitimate utility for pre-compiling ASP.NET applications. Attackers may exploit this executable to create or invoke malicious child processes to obfuscate their activity, likely aiming to execute additional payloads or conduct lateral movement. The relevant MITRE ATT&CK tactic is Execution (TA0002), specifically technique T1127, which focuses on application layer execution.

  The primary telemetry source for this detection is process creation logs from Windows, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could include unauthorized execution of applications that facilitate further attacks or data exfiltration. It is important to note that this detection does NOT confirm whether the activity is malicious without further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances where `aspnet_compiler.exe` is the ParentImage. Confirm the ChildImage is a known malicious indicator (e.g., `calc.exe` in a suspicious path).

  - **Analyze the execution flow:** Inspect the Command Line arguments in the process creation logs for `aspnet_compiler.exe`. Legitimate command lines typically include `-p` for project compilation. Any deviations could indicate suspicious activity.

  - **Verify the child process location:** Validate that the ChildImage is running from a trusted directory (e.g., `C:\Windows`). Child processes executing from temporary or user directories (e.g., `C:\Users\Public\`) may indicate malicious intent.

  - **Correlate with recent changes:** Look for recent configurations or deployments that utilized `aspnet_compiler.exe`. This context can help differentiate benign updates from potential exploitation attempts.

  - **Identify known benign processes:** Record known legitimate child processes associated with `aspnet_compiler.exe`, like `iisreset.exe`. Use this to establish a baseline for differentiating benign from suspicious behavior.

  ### Prioritization

  The severity of this alert is high due to the potential exploitation of a trusted system process for malicious purposes. The likelihood of abuse is significant, as attackers commonly use legitimate tools for nefarious activities. Given that similar techniques have been frequently weaponized, immediate attention is warranted.

  ### Blind Spots and Assumptions

  There are limitations in detecting sophisticated evasion techniques, such as attackers altering the execution context or using alternative paths to avoid detection. Reliable detection requires complete logging of process creation events and possibly event tracing for Windows (ETW) configurations. Legitimate administrative scripts or automated processes may also trigger this alert if they invoke `aspnet_compiler.exe`. Additional companion detections, such as monitoring for unusual PowerShell usage (e.g., T1059.001), can enhance coverage related to exploitation techniques.

