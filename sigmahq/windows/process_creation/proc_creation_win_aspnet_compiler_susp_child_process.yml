note: |
  ### Technical Context
  This rule detects potentially suspicious child processes spawned by the `aspnet_compiler.exe` executable. The main concern is that attackers may exploit this legitimate ASP.NET utility to execute malicious payloads as child processes, disguising their activities within normal operations. Instances include dropping malicious files in commonly used directories (e.g., temporary folders) or utilizing standard Windows applications (e.g., `notepad.exe`, `calc.exe`) to achieve their objectives, which often involve evading detection and maintaining persistence on a compromised system.

  The attacker objectives typically involve leveraging web servers to deploy and run scripts that establish backdoor access, exfiltrate sensitive information, or escalate privileges. The relevant tactics and techniques in the MITRE ATT&CK framework include **Execution (T1203)** for exploiting the executable, and **Defense Evasion (T1127)** aimed at executing processes that may not typically raise alarms.

  Primary data sources for this detection include process creation events logged by the Windows operating system, capable of indicating what parent process initiated child processes and where these processes are running from.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events to identify instances of `aspnet_compiler.exe` spawning unusual child processes. Pay attention to the command-line arguments and any associated process IDs for context on execution.

  - **Analyze Parent-Child Relationships**: Investigate the relationships between parent processes and their children. Determine if any child processes may lead to suspicious actions or behaviors indicative of exploitation.

  - **Inspect File Locations**: Check the locations of the spawned children. Focus on executable files in temporary directories (`C:\Users\Public\`, `C:\AppData\Local\Temp\`, etc.), as these are often used for malicious activity.

  - **Conduct Behavioral Analysis**: If a suspicious child process is detected, conduct a deeper behavioral analysis including file modifications, network activity, and other system changes that could indicate an ongoing attack or compromise.

  ### Prioritization
  The severity of this alert is high in an enterprise environment due to the potential for significant damage stemming from unauthorized executions disguised as legitimate processes. Given that attackers often rely on evasion techniques, identifying such executions is critical to reducing the risk of successful intrusions.

  ### Blind Spots and Assumptions
  One gap in detection coverage may be the inability to capture all variations of legitimate usage where `aspnet_compiler.exe` may call child processes in benign scenarios. The detection logic assumes that any child process spawned is suspicious, which may not always hold true. The rule relies on the availability of comprehensive process creation logs and may require specific configurations to ensure all relevant activities are logged for effective detection.

