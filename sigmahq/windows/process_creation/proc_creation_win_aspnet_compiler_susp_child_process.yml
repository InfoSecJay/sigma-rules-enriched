note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes spawned by "aspnet_compiler.exe," which is commonly used in ASP.NET applications for compiling ASP.NET web applications. An attacker may leverage the legitimate use of this executable to create unauthorized processes, potentially aiming to execute malicious code or perform reconnaissance activities. This behavior is associated with the MITRE ATT&CK technique T1127: "Trusted Developer Utilities."

  The primary telemetry source for this detection is process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If exploited, malicious utilization of aspnet_compiler.exe could lead to unauthorized access or execution of arbitrary code within a trusted context. It is crucial to note that this detection alone does not confirm malicious intent; further investigation is necessary to assess the context of the child processes.

  ### Investigation Steps

  - **Check the parent process:** Review process creation logs for Security Event ID 4688 or Sysmon Event ID 1, specifically noting entries where the ParentImage ends with "aspnet_compiler.exe." This identifies the potential behavior in question.

  - **Verify child process legitimacy:** Assess child processes in the detected events; typical benign processes may include service applications or legitimate scripts. Identify instances of common benign processes like "notepad.exe" or "calc.exe" being spawned in unusual directories (e.g., "\Users\Public\").

  - **Look for suspicious path indicators:** Investigate the "Image" field for paths containing "\AppData\Local\Temp\" or "\Windows\Tasks\" in conjunction with the detected parent process. Such paths may indicate an evasion attempt or a malicious payload execution.

  - **Correlate with known alerts:** Check for other related alerts or detections linked to the same host or user account, as this may indicate ongoing malicious activity. Review alerts for suspicious activities in the same timeframe.

  - **Identify high-confidence malicious indicators:** Focus on children of "aspnet_compiler.exe" that lead to execution from unexpected paths. For example, if a child process is created from "\Windows\Temp\malicious.exe", treat this as a high-confidence malicious indicator.

  ### Prioritization

  This alert has a high severity level due to its potential impact on critical systems running ASP.NET applications. The ability for an attacker to manipulate a trusted process like aspnet_compiler.exe for other malicious actions makes this a serious concern. Additionally, the behavior observed is not uncommon in advanced persistent threat (APT) scenarios, heightening the need for prompt investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using custom or altered executables named similarly to aspnet_compiler.exe. Additionally, the accuracy of detection relies on the proper configuration and logging of process creation events within the environment. Legitimate usage of aspnet_compiler.exe by development teams may trigger alerts, requiring context assessment. A related detection that complements this one is monitoring processes for command-line arguments indicative of malicious intent, such as unusual flags or parameters that suggest exploitation attempts.

