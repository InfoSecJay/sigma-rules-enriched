title: Always Install Elevated Windows Installer
id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
status: test
description: Detects Windows Installer service (msiexec.exe) trying to install 
  MSI packages with SYSTEM privilege
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-48-638.jpg
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
date: 2020-10-13
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_image_1:
    Image|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    Image|endswith: 'tmp'
  selection_image_2:
    Image|endswith: '\msiexec.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_installer:
    ParentImage: 'C:\Windows\System32\services.exe'
  filter_repair:
  - CommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  - ParentCommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  filter_sophos:
    ParentImage|startswith: 'C:\ProgramData\Sophos\'
  filter_avira:
    ParentImage|startswith: 'C:\ProgramData\Avira\'
  filter_avast:
    ParentImage|startswith:
    - 'C:\Program Files\Avast Software\'
    - 'C:\Program Files (x86)\Avast Software\'
  filter_google_update:
    ParentImage|startswith:
    - 'C:\Program Files\Google\Update\'
    - 'C:\Program Files (x86)\Google\Update\'
  condition: 1 of selection_image_* and selection_user and not 1 of filter_*
falsepositives:
- System administrator usage
- Anti virus products
- WindowsApps located in "C:\Program Files\WindowsApps\"
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where the Windows Installer service (`msiexec.exe`) attempts to install MSI packages with elevated SYSTEM privileges. Such behavior may indicate a privilege escalation attack, as attackers can exploit this to execute malicious code with higher permissions on the system. This aligns with the MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Elevation via Application Layer) under the ongoing privilege escalation tactics.

  The primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which record new process creation and relevant command-line arguments. If malicious, this behavior could lead to unauthorized software installations, data exfiltration, or control over critical systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could trigger the alert.

  ### Investigation Steps

  - **Identify the Process Creation Event:** Review Windows Event ID 4688 or Sysmon Event ID 1 for the `msiexec.exe` process. Check the `CommandLine` and `Image` fields for evidence of elevated installs from `C:\Windows\Installer\`, especially with `tmp` files.

  - **Examine User Context:** Validate the user context of the alert. Legitimate administrative installations typically execute as known admin users without unusual names. Investigate if the user field contains entries like 'AUTHORI' or 'AUTORI' indicating atypical user accounts.

  - **Check Parent Process:** Confirm the parent process for the `msiexec.exe` invocation is `C:\Windows\System32\services.exe` using the `ParentImage` field. If the parent process differs, it may suggest malicious activity.

  - **Cross-reference Command-Line Arguments:** Analyze if the `CommandLine` ends with the `'/V'` argument, which indicates the repair installation option. If detected, it typically indicates benign behavior and should not raise concern.

  - **Assess for Common Evasion Tactics:** Investigate if the process is initiated by known security applications such as Sophos, Avira, or Avast, with parent images starting with their respective paths. If so, this activity may be a benign security action rather than malicious intent.

  - **Review File Creation and Modification:** For any suspicious activity, check for the presence of newly created or modified files in system directories (such as temporary installation files) that could suggest malware installation or persistence attempts.

  ### Prioritization

  This alert should be treated with medium severity, especially in contexts where SYSTEM accounts are exploited. The likelihood of malicious abuse is somewhat moderate due to the potential for attackers to misuse ‘msiexec.exe’ especially in environments where usual monitoring might be less strict. While not a frequent weaponization method, it poses real risks in the incorrect hands, particularly for systems managing critical operations.

  ### Blind Spots and Assumptions

  Potential blind spots include the use of legitimate system administration accounts that may trigger this detection during routine software installations or updates. Without thorough monitoring, benign actions may mask malicious intents. Detection effectiveness also hinges on correct logging configurations for process creation events and may not capture all elevated install attempts. Related companion detections may include monitoring for unexpected command-line arguments with other installers or changes in security context permissions for continuous privilege escalation detection.

