title: Always Install Elevated Windows Installer
id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
status: test
description: Detects Windows Installer service (msiexec.exe) trying to install MSI
  packages with SYSTEM privilege
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-48-638.jpg
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
date: 2020-10-13
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_image_1:
    Image|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    Image|endswith: 'tmp'
  selection_image_2:
    Image|endswith: '\msiexec.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_installer:
    ParentImage: 'C:\Windows\System32\services.exe'
  filter_repair:
  - CommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  - ParentCommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  filter_sophos:
    ParentImage|startswith: 'C:\ProgramData\Sophos\'
  filter_avira:
    ParentImage|startswith: 'C:\ProgramData\Avira\'
  filter_avast:
    ParentImage|startswith:
    - 'C:\Program Files\Avast Software\'
    - 'C:\Program Files (x86)\Avast Software\'
  filter_google_update:
    ParentImage|startswith:
    - 'C:\Program Files\Google\Update\'
    - 'C:\Program Files (x86)\Google\Update\'
  condition: 1 of selection_image_* and selection_user and not 1 of filter_*
falsepositives:
- System administrator usage
- Anti virus products
- WindowsApps located in "C:\Program Files\WindowsApps\"
level: medium
note: |
  ### Technical Context
  This detection rule identifies when the Windows Installer service (`msiexec.exe`) attempts to install MSI packages with SYSTEM privileges. Such behavior could indicate a potential privilege escalation attempt by malicious actors looking to gain elevated access within a Windows environment, which can lead to unauthorized actions and control over the system. Attackers may initiate these actions to install rootkits, ransomware, or other forms of malware while bypassing security controls.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (TA0005)** - attempting to evade security mechanisms.
  - **Privilege Escalation (TA0004)** - gaining higher-level permissions on a system.
  - **Access Token Manipulation (T1548.002)** - abusing access tokens to escalate privileges.

  The primary data source for this detection is **process creation events**, which capture details about the execution of processes, including information about the user context and the command-line arguments used during the installation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for instances where `msiexec.exe` is executed with SYSTEM privileges and check the associated command-line arguments to identify potential malicious intent.
  - **Analyze User Context**: Validate the user context under which the installation was attempted. Check for unusual or unauthorized users attempting to install software, especially those with elevated privileges.
  - **Verify Parent Process**: Investigate the parent process of `msiexec.exe`, particularly looking for `services.exe`, to ensure that the installation isn't part of normal system updates or configurations.
  - **Cross-reference Filters**: Ensure the invocation of `msiexec.exe` is not related to legitimate filtering criteria such as trusted applications (e.g., antivirus updates), and document any legitimate usage scenarios.

  ### Prioritization
  This alert is elevated to medium severity due to its potential to indicate privilege escalation, which can seriously impact the security posture of the organization. While the likelihood of a false positive exists, the consequences of a successful exploit warrant prompt investigation.

  ### Blind Spots and Assumptions
  One key blind spot of this detection rule is the potential for false positives, particularly from legitimate system administrators performing necessary software installations or updates. The detection logic assumes that the environment will log process creation events consistently and effectively, which may not always be the case if logging policies aren't properly configured. The rule's efficacy relies on the availability of accurate parent process tracking and system integrity levels, which must be validated in the logging configurations prior to deployment.

