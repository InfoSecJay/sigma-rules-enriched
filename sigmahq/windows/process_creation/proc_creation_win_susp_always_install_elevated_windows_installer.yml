title: Always Install Elevated Windows Installer
id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
status: test
description: Detects Windows Installer service (msiexec.exe) trying to install 
  MSI packages with SYSTEM privilege
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-48-638.jpg
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
date: 2020-10-13
modified: 2024-12-01
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_image_1:
    Image|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    Image|endswith: 'tmp'
  selection_image_2:
    Image|endswith: '\msiexec.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_installer:
    ParentImage: 'C:\Windows\System32\services.exe'
  filter_repair:
  - CommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  - ParentCommandLine|endswith: '\system32\msiexec.exe /V'       # ignore "repair option"
  filter_sophos:
    ParentImage|startswith: 'C:\ProgramData\Sophos\'
  filter_avira:
    ParentImage|startswith: 'C:\ProgramData\Avira\'
  filter_avast:
    ParentImage|startswith:
    - 'C:\Program Files\Avast Software\'
    - 'C:\Program Files (x86)\Avast Software\'
  filter_google_update:
    ParentImage|startswith:
    - 'C:\Program Files\Google\Update\'
    - 'C:\Program Files (x86)\Google\Update\'
  condition: 1 of selection_image_* and selection_user and not 1 of filter_*
falsepositives:
- System administrator usage
- Anti virus products
- WindowsApps located in "C:\Program Files\WindowsApps\"
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows Installer service (`msiexec.exe`) attempting to install MSI packages with SYSTEM privileges, which is indicative of unauthorized privilege escalation attempts. Attackers often target privilege escalation to gain elevated access to modify critical system files or install malware. This behavior relates to the MITRE ATT&CK tactic of Privilege Escalation, specifically technique T1548.002 (Abuse Elevation Control Mechanism: Installer Abuse).

  The primary telemetry sources include Windows Security Event logs for process creation (Event ID 4688), and Sysmon logs (Event ID 1) for monitoring executable file creation. If malicious, this behavior can lead to the installation of unauthorized software or malware that can compromise sensitive system resources. It’s important to note that this detection alone does not prove malicious intent; legitimate SYSTEM-level installs may also trigger this rule.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for `msiexec.exe` instances. Malicious indicators include installations initiated by unrecognized user accounts, especially if the command line contains suspicious parameters.

  - **Evaluate the command line arguments:** Analyze the command line using the `CommandLine` field. Malicious indicators may include unexpected or obfuscated file paths, while legitimate usage might typically involve clear paths under known Windows Installer locations.

  - **Identify user context:** Determine the user initiating the installation by examining the `User` field in the logs. Legitimate activities often come from system administrators or known application accounts.

  - **Check parent process relationships:** Validate the `ParentImage` field, looking specifically for instances originating from `C:\Windows\System32\services.exe`. Attachments to known legitimate parent processes might indicate normal behavior.

  - **Cross-reference with known filters:** Ensure event logs are free from relationships to processes in filtering categories (e.g., Avira, Sophos). Matches to these known applications indicate benign activity.

  - **Inspect SYSTEM privilege operations:** Monitor for SYSTEM-level privilege escalations that lack legitimate administrative context. Legitimate SYSTEM-level installers should typically occur only during recognized software updates or installations.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on critical systems if exploited. The likelihood of malicious exploitation exists, as attackers often exploit the Windows Installer to escalate privileges, which is a common methodology in their toolkits.

  ### Blind Spots and Assumptions

  Evasion techniques may include using obfuscated command line arguments or legitimate software to disguise malicious MSI installations. Reliable detection also necessitates logging and monitoring configurations that capture both process creation and user activity comprehensively. Legitimate activities such as scheduled software updates by IT teams may trigger this alert, potentially causing false positives. Related detections, such as monitoring for abnormal User Account Control (UAC) bypass attempts, would enhance overall coverage against privilege escalation activities.

