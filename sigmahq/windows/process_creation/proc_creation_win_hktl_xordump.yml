title: HackTool - XORDump Execution
id: 66e563f9-1cbd-4a22-a957-d8b7c0f44372
status: test
description: Detects suspicious use of XORDump process memory dumping utility
references:
- https://github.com/audibleblink/xordump
author: Florian Roth (Nextron Systems)
date: 2022-01-28
modified: 2023-02-08
tags:
- attack.stealth
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xordump.exe'
  - CommandLine|contains:
    - ' -process lsass.exe '
    - ' -m comsvcs '
    - ' -m dbghelp '
    - ' -m dbgcore '
  condition: selection
falsepositives:
- Another tool that uses the command line switches of XORdump
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the XORDump utility, a memory dumping tool often used by attackers to extract sensitive information from processes like `lsass.exe`, which manages user credentials in Windows. The likely objective of an attacker deploying XORDump is to extract credentials or other sensitive data from memory in order to escalate privileges or establish persistence within a network. This behavior maps to the MITRE ATT&CK techniques for credential access (T1003.001) and stealth (T1036).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688. If malicious, the execution of this tool could lead to credential compromise, allowing further access and control over the affected systems. This detection does NOT confirm successful credential theft; it only indicates that the suspicious process was invoked with known malicious parameters.

  ### Investigation Steps

  - **Validate process execution:** Check Security Event ID 4688 for the command line associated with `xordump.exe`. Look specifically for parameters like `-process lsass.exe` or `-m comsvcs`. A legitimate use might involve different parameters, such as routine memory analysis tools not targeting LSASS or COM services.

  - **Examine parent processes:** Use Sysmon Event ID 1 to identify the parent process of `xordump.exe`. Malicious executions might have suspicious parent processes like `cmd.exe` or `powershell.exe`. Verify legitimate tools would have identifiable parent processes like `explorer.exe`.

  - **Assess execution context:** Review the User field in Event Log entries. Malicious execution often occurs under accounts with elevated privileges (e.g., SYSTEM or an admin). Check if the user account is associated with regular administrative tasks or appears anomalous.

  - **Analyze network activity:** Look for outbound connections that were initiated simultaneously with the XORDump execution via Windows Firewall logs or network monitoring tools. Malicious use may correlate with unusual exfiltration patterns or connections to unknown IPs.

  - **Check system logs for related activities:** Examine Windows Event Logs for abnormal logon events (Event ID 4624) or logoff events (Event ID 4634) around the same timeframe. A series of rapid logon/logoff activities may indicate credential harvesting attempts accompanying `xordump.exe` execution.

  - **Review for known YARA signatures:** Search for YARA signatures or hashes related to known malicious versions of XORDump in security software logs. A match would indicate prior awareness of the tool's malicious use.

  ### Prioritization

  This alert is high severity due to its potential to indicate a direct attack on credential storage, affecting privileged access across systems. The likelihood of abuse is significant, considering the increasing weaponization of memory manipulation tools by adversaries in various environments.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers disguise their use of XORDump with different command-line switches or alternative tools that mimic similar behavior. Required log sources include detailed process creation logs and configuration settings for Sysmon to enhance detection accuracy. Legitimate activities that could trigger this alert include debugging or troubleshooting performance issues in applications that are not associated with credential harvesting. Companion detections focusing on suspicious process behavior during credential access attempts can improve coverage and mitigate blind spots (e.g., detecting other credential dumping tools).

