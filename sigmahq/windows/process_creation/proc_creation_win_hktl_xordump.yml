title: HackTool - XORDump Execution
id: 66e563f9-1cbd-4a22-a957-d8b7c0f44372
status: test
description: Detects suspicious use of XORDump process memory dumping utility
references:
- https://github.com/audibleblink/xordump
author: Florian Roth (Nextron Systems)
date: 2022-01-28
modified: 2023-02-08
tags:
- attack.stealth
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xordump.exe'
  - CommandLine|contains:
    - ' -process lsass.exe '
    - ' -m comsvcs '
    - ' -m dbghelp '
    - ' -m dbgcore '
  condition: selection
falsepositives:
- Another tool that uses the command line switches of XORdump
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_hktl_xordump/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of the XORDump utility, which is used for memory dumping, specifically targeting processes such as `lsass.exe`. An attacker may use this tool to extract sensitive information, including credentials, from memory. This behavior aligns with the MITRE ATT&CK tactics of Credential Access (T1003.001) and Stealth (T1036). The primary telemetry sources involved are Windows process creation logs, specifically looking for Event ID 4688. If executed with malicious intent, XORDump poses a significant risk as it could lead to credential theft and further compromise within the network. However, this detection does not confirm malicious intent on its own, as benign use cases may exist.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 logs for instances where the image path ends with `\xordump.exe`. Look for unusual execution patterns related to administrative or sensitive accounts.

  - **Analyze command-line arguments**: Identify the specific command-line parameters used with XORDump. Legitimate usage may not involve flags such as `-process lsass.exe` or `-m dbghelp`. Malicious indicators include these flags, which directly target privileged processes.

  - **Inspect for parent process**: Investigate the parent process ID (PID) of the XORDump execution. A legitimate process might show common administrative tools, while unusual parent processes (e.g., unknown scripts or non-administrative tools) could indicate malicious behavior.

  - **Validate memory dump artifacts**: Check for the presence of temporary files or artifacts typically created during memory dumps. Look for file creation timestamps and paths that correspond to XORDump activity, indicating potential credential extraction efforts.

  - **Evaluate host activity**: Assess system behavior and user activity prior to and after the alert. Frequent execution of similar memory-dumping tools or high activity around sensitive processes may suggest a targeted attack.

  ### Prioritization

  This alert should be considered high severity due to the potential impact of credential theft and unauthorized access to sensitive systems. The likelihood of malicious abuse is significant, especially as XORDump is known for targeting critical processes. Memory dumping activities are often weaponized in sophisticated attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations do not capture all necessary process creation events, particularly in environments with custom security policies. Legitimate debugging and troubleshooting activities by admins may trigger this alert. Companion detections could include monitoring for other memory dumping utilities or unusual command-line behavior, enhancing the coverage for potential credential harvesting attempts.

