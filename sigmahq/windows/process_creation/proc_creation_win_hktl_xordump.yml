logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xordump.exe'
  - CommandLine|contains:
    - ' -process lsass.exe '
    - ' -m comsvcs '
    - ' -m dbghelp '
    - ' -m dbgcore '
  condition: selection
falsepositives:
- Another tool that uses the command line switches of XORdump
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the XORDump memory dumping utility, specifically when used against the LSASS process or with other debugging parameters. The likely objective of an attacker employing XORDump is to extract sensitive information such as credentials from memory, which can be exploited to escalate privileges or gain unauthorized access to systems. This behavior is associated with the MITRE ATT&CK tactics of Credential Access (TA0006) and Defense Evasion (TA0005), particularly techniques T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing execution details and command-line arguments. If malicious, this behavior can lead to severe security impacts, including stolen credentials and potential lateral movement within the network. Importantly, the detection of XORDump usage does NOT confirm successful credential theft without further corroborating evidence.

  ### Investigation Steps

  - **Review recent process creation logs:** Filter Security Event ID 4688 or Sysmon Event ID 1; look for instances where the image ends with `\xordump.exe` and check the CommandLine for arguments suggesting it targeted `lsass.exe`.

  - **Analyze command-line arguments:** Look for parameters `-m comsvcs`, `-m dbghelp`, or `-m dbgcore`; if present alongside the use of XORDump, it indicates potential malicious intent.

  - **Check for legitimate usage patterns:** Identify if any secure processes or applications in the environment utilize XORDump legitimately. This can include typical administrative tools or development activities, which may explain benign command-line arguments.

  - **Identify high-confidence malicious indicators:** Cross-reference any associated user accounts executing XORDump against historical activity. Look for suspicious logins or entity behaviors, especially on critical assets (e.g., domain controllers).

  - **Validate associated artifacts:** Search for new file creation or modifications, specifically targeting sensitive files or logs in the filesystem that might indicate a successful dump. This includes looking for common credential storage locations such as the Windows Credential Manager.

  - **Assess the impact on critical systems:** Identify if the host running XORDump is part of a sensitive role, such as Active Directory or financial applications, which would heighten risk associated with credential access attempts.

  ### Prioritization

  This alert is high severity due to its potential to expose sensitive credentials and facilitate lateral movement within the environment. The likelihood of malicious use is significant, as XORDump is a known tool associated with credential dumping, an activity frequently leveraged by attackers.

  ### Blind Spots and Assumptions

  There are limitations in detection effectiveness if logging configurations for process creation events are not robust or if Sysmon is not deployed. Legitimate system administrators may use similar command-line switches during troubleshooting, potentially generating false positives. A companion detection to enhance coverage would be monitoring for any LSASS access events to corroborate potential credential dumping activities.

