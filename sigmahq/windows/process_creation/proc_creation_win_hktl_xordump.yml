logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xordump.exe'
  - CommandLine|contains:
    - ' -process lsass.exe '
    - ' -m comsvcs '
    - ' -m dbghelp '
    - ' -m dbgcore '
  condition: selection
falsepositives:
- Another tool that uses the command line switches of XORdump
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `xordump.exe`, a process memory dumping utility commonly used in malicious contexts to extract sensitive information, such as credentials from the Windows Local Security Authority Subsystem Service (LSASS). Attackers may utilize XORDump to harvest passwords and other secure data, particularly following initial access to a system where they require administrative privileges to facilitate further exploitation.

  The detection aligns with several MITRE ATT&CK tactics and techniques, notably:
  - **Defense Evasion** (T1089): Utilizing code to evade detection mechanisms.
  - **Credential Access** (T1003.001): Extracting credentials from LSASS memory, thereby compromising account security.

  Primary data sources for this detection rule focus on process creation logs from the Windows operating system, which provide critical evidence of the invocation of suspicious process memory dumping utilities like XORDump.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events to detect instances of `xordump.exe` executing with unusual command-line arguments, particularly those focusing on LSASS or other sensitive processes.
  - **Examine Associated Handles**: Investigate the handles associated with the execution of XORDump to determine whether any credentials or sensitive information were accessed during the memory dumping process.
  - **Check for Subsequent Alerts**: Look for alerts related to unauthorized access to sensitive resources post-execution of XORDump, indicating potential credential misuse or lateral movement within the network.
  - **Analyze User Behavior**: Assess the user accounts executing XORDump to determine if the behavior aligns with typical usage patterns or if it indicates potential malicious activity.

  ### Prioritization
  This alert has a high severity due to the potential impact of credential theft and unauthorized access to sensitive data, making it critical for enterprise security. The likelihood of an attacker using such tools to compromise systems further elevates the need for immediate attention.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from environments where XORDump is used legitimately by third-party applications or different tools invoke similar command-line switches, leading to possible false positives. The detection logic assumes proper logging of process creation events is enabled on all endpoints. The effectiveness of this detection rule hinges on comprehensive Windows process creation logs and appropriate SIEM configurations to correlate this behavior with potential indicators of compromise.

