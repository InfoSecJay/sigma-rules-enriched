note: |
  ### Technical Context

  This rule detects potentially malicious child processes spawned by Microsoft Office applications, such as Word or Excel, which could indicate attempts by attackers to deliver or execute payloads (e.g., malicious scripts or executables) through exploitable software vulnerabilities. The likely objective of the attacker is to execute arbitrary code on a victim's machine after the initial compromise, often using social engineering techniques to deliver a malicious Office document. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1204.002) and Stealth (T1047).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can signify a severe compromise, potentially allowing an attacker to execute further malicious commands, exfiltrate data, or establish persistence. This detection does NOT confirm that the activity is malicious—it may also signify benign processes that rely on Office applications.

  ### Investigation Steps

  - **Identify process ancestry:**
    Review the Process Creation logs (Event ID 4688) to verify the parent-child relationships. Check if the child process is spawned from known Microsoft Office applications (e.g., `WINWORD.EXE`, `EXCEL.EXE`).

  - **Analyze child process indicators:**
    Filter for child processes with names like `powershell.exe`, `mshta.exe`, or `bitsadmin.exe`. Look for uncommon command line arguments or unusual contexts in which they are executed, which are strong indicators of potential exploitation.

  - **Check for suspicious paths:**
    Look for processes initiated from unusual directories such as `%AppData%`, `%ProgramData%`, or other temporary locations (e.g., `C:\Windows\Temp\`), as this may indicate an attempt to bypass security mechanisms.

  - **Evaluate legitimate behaviors:**
    Note any legitimate usage of Office applications in the context of your organization, such as automated report generation or scheduled tasks typically running from `C:\Program Files`. Confirm that the child processes originate from business-approved workflows.

  - **Review user behavior:**
    Investigate the user activity prior to the alert, particularly if the user has recently opened Office documents from untrusted sources or engaged with suspicious emails. Review associated email logs for potential phishing attempts.

  - **Investigate known IOCs:**
    Cross-reference the detected process hashes or command lines against threat intelligence sources to identify if they are part of known malware campaigns, specifically if linked to recent vulnerabilities like Follina.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on compromised systems, which could lead to significant data breaches or ransomware deployment. Given that Office applications are common targets for exploitation, there is a real risk of malicious abuse, particularly in environments where users are not effectively trained in identifying phishing attempts.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as using legitimate processes in non-standard ways or invoking Office applications through non-standard user interfaces. Reliably detecting this activity requires comprehensive logging from both Windows Event Logs and Sysmon, ensuring that logs for process creation are enabled. Additionally, this alert might trigger for legitimate system maintenance activity like automated scripts, which may spawn child processes from Office applications for valid purposes. Complementary detections, such as monitoring for lateral movement or privilege escalation attempts, will strengthen overall security posture.

