level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes being spawned directly from various Microsoft Office applications such as Word, Excel, and PowerPoint. The rule focuses on capturing potentially malicious activities wherein an Office application inadvertently or maliciously triggers another process, a technique commonly observed in exploitative scenarios manipulating trusted applications to facilitate execution without raising immediate alarms. These behaviors could imply attempts to execute malicious payloads, particularly in the context of file-based attacks and social engineering.

  Attackers leveraging this technique may aim to bypass security controls by utilizing familiar software as a conduit for their activities. The suspected threat actors typically utilize this method for various objectives, including delivering malware, executing scripts for post-exploitation tasks, or even conducting lateral movement within a compromised network. This behavior is associated with MITRE ATT&CK tactics such as Execution (T1204: User Execution) and Defense Evasion (T1047: Windows Management Instrumentation), highlighting a persistent attempt to abuse legitimate system functionality for malicious ends.

  Primary data sources for monitoring these activities include process creation logs from endpoint systems, which will provide details of parent and child processes, along with any potential paths exploited by the malicious actors.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events around the time of the alert to identify the parent Microsoft Office application and the spawned child processes. Focus on the paths and command-line arguments used.

  - **Analyze Suspicious Child Processes:** Investigate the characteristics of the child processes captured in the alert. Specifically, look for uncommon behaviors or known malicious signatures associated with the identified processes.

  - **Correlate with User Activity:** Cross-reference the detected behavior with user activity logs to determine if the execution context aligns with phishing attempts or other social engineering strategies.

  - **Assess File System Changes:** Investigate any recent modifications in locations such as `AppData`, `ProgramData`, and any other typical execution directories to check for the presence of potentially malicious files spawned by the detected processes.

  ### Prioritization
  This alert is considered high severity due to its potential for significant impact if exploited. The likelihood of successful exploitation via Microsoft Office applications is elevated, particularly in environments lacking effective endpoint protections.

  ### Blind Spots and Assumptions
  This detection strategy may not capture all instances of malicious activity, especially if an attacker is using non-standard paths or processes to execute their payloads. The detection assumes that the Office applications are being utilized in a typical manner, and any atypical parent-child relationships could indicate exploitation. Additionally, the detection relies heavily on effective logging configurations for process creation; if these logs are not enabled or properly maintained, the alert may miss critical indicators of compromise.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
