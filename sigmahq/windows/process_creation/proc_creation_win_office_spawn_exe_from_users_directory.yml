title: Suspicious Binary In User Directory Spawned From Office Application
id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
status: test
description: Detects an executable in the users directory started from one of 
  the Microsoft Office suite applications (Word, Excel, PowerPoint, Publisher, 
  Visio)
references:
- https://blog.morphisec.com/fin7-not-finished-morphisec-spots-new-campaign
- https://www.virustotal.com/gui/file/23160972c6ae07f740800fa28e421a81d7c0ca5d5cab95bc082b4a986fbac57
author: Jason Lynch
date: 2019-04-02
modified: 2023-02-04
tags:
- attack.execution
- attack.t1204.002
- attack.g0046
- car.2013-05-002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\WINWORD.EXE'
    - '\EXCEL.EXE'
    - '\POWERPNT.exe'
    - '\MSPUB.exe'
    - '\VISIO.exe'
    - '\MSACCESS.exe'
    - '\EQNEDT32.exe'
            # - '\OUTLOOK.EXE' too many FPs
    Image|startswith: 'C:\users\'
    Image|endswith: '.exe'
  filter:
    Image|endswith: '\Teams.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of executable files in user directories that are spawned from Microsoft Office applications (such as Word, Excel, PowerPoint, etc.). This behavior is typically associated with attackers leveraging Office applications as a vector to execute malicious binaries, which may facilitate further actions such as data exfiltration or lateral movement within an environment. The primary MITRE ATT&CK techniques relevant here are "User Execution" (T1204.002) and "Execution via API" (G0046).

  The main telemetry source is the Windows process creation logs, capturing events from the Security log (Event ID 4688) and Sysmon (Event ID 1). If malicious, this activity poses a high security risk, as it can signal an ongoing compromise that potentially leads to data loss or system integrity breaches. It must be noted that this detection alone does not confirm malicious intent; legitimate applications can spawn executables in user directories for valid reasons.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for newly created processes, specifically focusing on `ParentImage` field values indicating the Office suite (e.g., `WINWORD.EXE`, `EXCEL.EXE`).

  - **Identify the new executable's details:** Examine the `Image` field in the logs for executables created under `C:\users\`. This should include the full path to the newly created binary; suspicious names or locations may indicate malicious activity.

  - **Analyze the executable's reputation:** Utilize threat intelligence tools (e.g., VirusTotal) to check the hashes of the detected executable against known malware signatures to identify high-confidence malicious indicators.

  - **Assess user behavior:** Review recent user activity and legitimate use cases for Office applications. Look for patterns of usage such as file creation or document manipulation that typically precedes legitimate binary execution from Office (e.g., creating macros).

  - **Examine file persistence:** Verify if the detected executable attempts to modify Registry keys (e.g., HKCU\Software\Microsoft\Windows\CurrentVersion\Run) for persistence, which would generally indicate malicious intent.

  ### Prioritization

  This alert should be considered high-priority due to the potential impact on sensitive user data and the risk of lateral movement within the enterprise. The behavior is weaponized in various phishing campaigns and hence warrants immediate investigation, especially if found on critical systems or accounts.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed process creation logs if logging is not adequately configured on affected hosts. Legitimate processes, such as user-driven automation scripts or temporary executables created during Office document handling, might also trigger the alert. A related detection to consider is attempting to capture Office Macros or PowerShell activity that often accompanies this behavior, strengthening overall coverage against such threat vectors.

