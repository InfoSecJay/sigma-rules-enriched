title: Suspicious Binary In User Directory Spawned From Office Application
id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
status: test
description: Detects an executable in the users directory started from one of the
  Microsoft Office suite applications (Word, Excel, PowerPoint, Publisher, Visio)
references:
- https://blog.morphisec.com/fin7-not-finished-morphisec-spots-new-campaign
- https://www.virustotal.com/gui/file/23160972c6ae07f740800fa28e421a81d7c0ca5d5cab95bc082b4a986fbac57
author: Jason Lynch
date: 2019-04-02
modified: 2023-02-04
tags:
- attack.execution
- attack.t1204.002
- attack.g0046
- car.2013-05-002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\WINWORD.EXE'
    - '\EXCEL.EXE'
    - '\POWERPNT.exe'
    - '\MSPUB.exe'
    - '\VISIO.exe'
    - '\MSACCESS.exe'
    - '\EQNEDT32.exe'
            # - '\OUTLOOK.EXE' too many FPs
    Image|startswith: 'C:\users\'
    Image|endswith: '.exe'
  filter:
    Image|endswith: '\Teams.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies executable files located in user directories that have been initiated by Microsoft Office suite applications, such as Word, Excel, and PowerPoint. The presence of such binaries can indicate malicious activity, particularly if the executables are not part of the intended use case for these applications. Attackers may exploit trusted applications to run malicious payloads, which can lead to system compromise, data exfiltration, or lateral movement within the network.

  In common threat scenarios, attackers may use Office applications to deliver malware via macros or other execution methods. By launching executables from within these applications, they can often bypass security controls and blend in with legitimate user behavior. The relevant MITRE ATT&CK tactics and techniques associated with this type of behavior include **Execution (T1204.002)** and **User Execution (G0046)**.

  Primary data sources for monitoring this kind of activity include **process creation events**, which track the initiation of new processes and their parent-child relationships. Logs from security solutions that capture process creation, alongside system or event logs indicating application usage, will provide the necessary evidence to corroborate the detection.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs to identify the specific parent processes that launched the suspicious executable. Look for timestamps and user accounts associated with the activity.
  - **Analyze User Behavior:** Investigate the user account's behavior leading up to the detection. Assess if there were any unusual file downloads or interactions with Office applications that could indicate initial compromise.
  - **Examine Executable Metadata:** Gather information about the suspicious executable files, including their hashes, creation times, and digital signatures. Cross-reference these with known indicators of compromise.
  - **Inspect Endpoint Security Alerts:** Look through endpoint security logs for any associated alerts that may indicate attempts to disable or manipulate security controls alongside the execution of the suspicious binary.

  ### Prioritization
  The alert is deemed high severity due to the potential for significant impact on enterprise security; unauthorized executables can lead to account compromise, data breaches, and loss of sensitive information. The likelihood of malicious use of trusted applications underscores the need for prompt investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be related to PowerShell scripts or command-line execution that may spawn executables without the direct involvement of Office applications. The detection logic assumes that malicious actors will consistently use these specific office parent processes; however, this may not always be true. Additionally, if logging for process creation events is not enabled or insufficiently configured, the detection may fail to trigger. Therefore, ensuring robust logging practices is crucial for the effectiveness of this alert.

