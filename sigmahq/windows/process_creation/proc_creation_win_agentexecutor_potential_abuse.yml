logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate use via Intune management. You exclude script paths and names to 
  reduce FP rate
level: medium
note: |
  ### Technical Context

  This detection identifies the execution of the AgentExecutor.exe binary, which can be weaponized to execute PowerShell scripts with the "Bypass" ExecutionPolicy. Attackers may utilize this technique to circumvent security measures and execute malicious code while appearing legitimate. This behavior fits within the MITRE ATT&CK framework under tactic: Execution (TA0002) and technique: User Execution (T1203).

  The primary telemetry source is Windows process creation logs (Event ID 4688). If this binary is used maliciously, it could lead to unauthorized command execution, potential data exfiltration, lateral movement, or delivery of further payloads. Importantly, this detection does NOT confirm malicious activity on its own; it merely indicates that AgentExecutor.exe was executed and requires further investigation to determine intent.

  ### Investigation Steps

  - **Verify the process creation event**: Review Windows Security Event ID 4688 for the execution of `AgentExecutor.exe`. Check fields for `NewProcessName`, `CommandLine`, and `ParentImage` to understand the context of the execution.

  - **Analyze command line arguments**: Focus on the `CommandLine` field for indicators such as `-powershell` or `-remediationScript`. Legitimate usage often involves `-remediationScript` executed by the Intune management agent, with a ParentImage of `Microsoft.Management.Services.IntuneWindowsAgent.exe`.

  - **Check for legitimate usage patterns**: Confirm if the execution is associated with expected workflows, such as automated script execution via Microsoft Intune, especially checking the paths and script names to rule out benign usage.

  - **Identify high-confidence malicious indicators**: Look for unusually high privilege levels (e.g., SYSTEM) in the creation event or command line arguments that specify execution of non-standard or unauthorized scripts.

  - **Correlate with additional telemetry**: If available, cross-reference with Sysmon Event ID 1 for process creation, Event ID 4104 for PowerShell script block logging (if enabled), and Endpoint Detection and Response (EDR) logs for anomalous behavior patterns.

  - **Validate file creation or exfiltration**: Investigate any related file creations specified in the command-line arguments. Look for signs of exfiltration, such as large outbound network connections or file transfers correlated with process execution timing.

  ### Prioritization

  This alert is of medium severity due to the potential impact of code execution bypassing security controls, especially if on critical assets. The likelihood of abuse is moderate, as AgentExecutor can execute both benign management scripts and malicious payloads. The behavior is not yet widely weaponized, but the possibility exists given the misuse of LOLBins (Living Off the Land Binaries).

  ### Blind Spots and Assumptions

  The detection may miss cases where AgentExecutor.exe is used legitimately by IT management tools or benign scripts. Additionally, it relies on accurate logging from Windows; therefore, environments without comprehensive logging may be blind to such executions. An effective companion detection could involve monitoring other LOLBin executions (e.g., `powershell.exe`, `cmd.exe`) in conjunction with user activity logs to provide a more holistic view of suspicious behavior.

