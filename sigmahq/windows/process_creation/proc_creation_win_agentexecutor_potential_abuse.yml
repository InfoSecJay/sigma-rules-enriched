logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate use via Intune management. You exclude script paths and names to reduce
  FP rate
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the `AgentExecutor.exe` binary, a tool that can be exploited as a Living Off The Land Binary (LOLBIN) to run PowerShell scripts with the execution policy set to "Bypass." Attackers may use this method to execute malicious scripts while evading security controls, utilizing the built-in capabilities of Windows for persistence and stealth. The relevant MITRE ATT&CK techniques include "Execution through PowerShell" (T1059.001) and "Defense Evasion through LOLBins" (T1218). Primary telemetry sources include process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details about process execution and command-line arguments. If detected, this activity could indicate an attempt to compromise the system's security posture. It is important to note that this detection does not confirm malicious activity on its own, as it can also be used legitimately via Intune management.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for any instances of `AgentExecutor.exe` with command-line arguments containing `-powershell`. Analyze the arguments provided, particularly the script paths, for unusual or non-standard entries.

  - **Evaluate parent processes:** Identify the parent process for the `AgentExecutor.exe` execution. If the parent process is `Microsoft.Management.Services.IntuneWindowsAgent.exe`, it may indicate legitimate usage; otherwise, further investigation is warranted.

  - **Search for typical Powershell behaviors:** Legitimate uses may involve typical PowerShell scripts or paths originating from trusted locations. Compare the script execution paths against known good sources or established baselines.

  - **Look for command-line argument anomalies:** Pay special attention to command-line arguments involving `-executionPolicy` with "bypass." This configuration is a significant red flag and could indicate an attempt at evasion by an adversary.

  - **Assess context and target systems:** Understand the asset criticality by identifying whether the host is a user workstation, server, or sensitive infrastructure device. Evaluate potential impacts on data confidentiality.

  - **Identify indicators of compromise:** Cross-reference the PowerShell script or any additional HTTP/HTTPS calls made as a result of the `AgentExecutor.exe` execution with threat intelligence feeds to find any known malicious signatures or behaviors.

  ---

  ### Prioritization

  The alert severity is medium due to the potential for an attacker to exploit `AgentExecutor.exe` for executing unauthorized PowerShell scripts. The likelihood of abuse is moderate as this is a well-known tactic. This behavior may be weaponized in advanced persistent threats (APTs), thus warrants immediate attention, especially on critical systems.

  ---

  ### Blind Spots and Assumptions

  This detection may miss variants of legitimate `AgentExecutor.exe` usage, especially when executed as part of automated management via Intune, blur the line between benign and malicious activities. Ensuring robust logging from Security and Sysmon is essential for consistency in detection capabilities. Legitimate software deployments may trigger this alert, and monitoring related detections involving other PowerShell execution or binary abuses can strengthen the overall coverage against such threats.

