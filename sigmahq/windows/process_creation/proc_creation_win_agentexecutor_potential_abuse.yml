title: AgentExecutor PowerShell Execution
id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
related:
- id: c0b40568-b1e9-4b03-8d6c-b096da6da9ab
  type: similar
status: test
description: Detects execution of the AgentExecutor.exe binary. Which can be abused
  as a LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any
  binary named "powershell.exe" located in the path provided by 6th positional argument
author: Nasreddine Bencherchali (Nextron Systems), memory-shards
references:
- https://twitter.com/lefterispan/status/1286259016436514816
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
- https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
- https://twitter.com/jseerden/status/1247985304667066373/photo/1
date: 2022-12-24
modified: 2024-08-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate use via Intune management. You exclude script paths and names to reduce
  FP rate
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `AgentExecutor.exe`, which is a legitimate Windows binary commonly used in enterprise environments, particularly for managing PowerShell script execution through Intune. The detected behavior aligns with an attack scenario where an adversary maliciously leverages this binary as a Living Off the Land Binary (LOLBIN). By executing PowerShell scripts with the ExecutionPolicy set to "Bypass," attackers can circumvent security controls and run arbitrary scripts, potentially leading to data exfiltration or further compromise.

  The most relevant MITRE ATT&CK tactics for this rule include:
  - **Defense Evasion (T1562)**: Using a trusted tool to perform unauthorized actions can help adversaries evade detection.
  - **Scripting (T1064)**: The execution of scripts, especially those potentially harmful, falls under this technique, particularly when PowerShell is used in a malicious context.

  Primary data sources for detecting this behavior include:
  - **Process creation events**: These logs will provide insight into when `AgentExecutor.exe` is being launched along with its command-line arguments, critical for identifying malicious usage.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of `AgentExecutor.exe` in process creation logs to identify the execution context, including time, user, and parent process information.
  - **Analyze Command-Line Arguments**: Assess the command-line parameters for any entries containing `-powershell` or `-remediationScript`. Look for unusual script paths or unexpected arguments that may indicate malicious intent.
  - **Correlate with User Activity**: Investigate the associated user account to determine if the execution aligns with legitimate administrative tasks or appears anomalous based on user behavior and role.
  - **Examine Related PowerShell Logs**: If available, examine PowerShell logs (if logging is enabled) for any scripts executed or pending operations that could reveal the intent behind the executed commands.

  ### Prioritization
  This alert should be treated with medium severity. While the use of `AgentExecutor.exe` can be legitimate, its abuse for executing PowerShell scripts directly may indicate potential malicious activity, necessitating quick review and response to mitigate risks to the organization.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding instances of `AgentExecutor.exe` invoked by other legitimate applications within the environment. It is assumed that command-line logging for this binary is enabled and that all relevant process creation logs are retained. Without comprehensive logging and oversight, there is a risk that legitimate use cases may generate false positives, but careful filtering can help minimize these occurrences. Any escalation of unmatched and unfiltered logs may lead to missed detections of true positive threats.

