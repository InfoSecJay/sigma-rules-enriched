logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image: '\AgentExecutor.exe'
  - OriginalFileName: 'AgentExecutor.exe'
  selection_cli:
        # Example:
        #   AgentExecutor.exe -powershell [scriptPath] [outputFilePath] [errorFilePath] [timeoutFilePath] [timeoutSeconds] [powershellPath] [enforceSignatureCheck] [runAs32BitOn64]
        # Note:
        #   - If [timeoutSeconds] is NULL then it defaults to 60000
        #   - If [enforceSignatureCheck] is:
        #       - "NULL" or "1" then a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy allsigned -file "
        #       - Else a PowerShell instance is spawned with the args: "-NoProfile -executionPolicy bypass -file "
        #   - [powershellPath] is always concatendated to "powershell.exe"
    CommandLine|contains:
    - ' -powershell'         # Also covers the "-powershellDetection" flag
    - ' -remediationScript'
  filter_main_intune:
    ParentImage|endswith: '\Microsoft.Management.Services.IntuneWindowsAgent.exe'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate use via Intune management. You exclude script paths and names to 
  reduce FP rate
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `AgentExecutor.exe` binary, which can be misused to run PowerShell scripts bypassing the standard execution policy. Attackers may leverage this tool to covertly execute malicious PowerShell commands, facilitating lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution), highlighting an adversary's objective of evading security controls through legitimate binaries.

  The primary telemetry sources required for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If this behavior is indeed malicious, it could lead to system compromise or unauthorized access to sensitive information. However, it's important to note that this detection alone does not confirm malicious intent, as `AgentExecutor.exe` can be legitimately used within managed environments like Microsoft Intune.

  ### Investigation Steps

  - **Check process execution details**: Review Security Event ID 4688 or Sysmon Event ID 1 for `AgentExecutor.exe` instances. Look for command-line parameters indicating PowerShell invocation, particularly those using `-executionPolicy bypass`.

  - **Identify parent process**: Examine the ParentImage field in logs to confirm if it's launched from known legitimate processes, such as `Microsoft.Management.Services.IntuneWindowsAgent.exe`. If not, this increases suspicion.

  - **Analyze command-line parameters**: Look for command-line arguments that contain `-powershell` or `-remediationScript`. Malicious activity may indicate unique or suspicious script paths that do not align with typical management scripts.

  - **Review execution paths**: Validate if `AgentExecutor.exe` is located in proper installation directories (e.g., C:\Program Files\). Instances from atypical locations can suggest malicious modification.

  - **Document legitimate usage**: Recognize legitimate activity as instances of `AgentExecutor.exe` being executed with standard management scripts relating to Intune deployment processes, specifically in known workflows.

  - **Check for additional artifacts**: If applicable, validate any resulting scripts or files created during the execution (e.g., temp files or logs) to identify potential evidence of data exfiltration or additional exploitation attempts.

  ### Prioritization

  This alert carries medium severity due to the potential impact on enterprise systems if misused and the likelihood that the identified behavior could indicate an active attack or exploitation attempt. The usage of trusted applications to execute commands makes this behavior particularly concerning, as it reflects a common method of evading detection.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of `AgentExecutor.exe`, especially when it is run by managed device agents like Intune. Required logging must accurately capture process creation with complete command-line parameters to ensure reliable alerting. Notably, benign usage may trigger this alert, particularly in managed environments. A related detection, such as monitoring PowerShell script activity (T1059.001), should also be in place to bolster overall coverage against potential exploitation practices.

