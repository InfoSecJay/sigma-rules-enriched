title: Potential Arbitrary Command Execution Using Msdt.EXE
id: 258fc8ce-8352-443a-9120-8a11e4857fa5
status: test
description: Detects processes leveraging the "ms-msdt" handler or the "msdt.exe"
  binary to execute arbitrary commands as seen in the follina (CVE-2022-30190) vulnerability
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://twitter.com/_JohnHammond/status/1531672601067675648
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-29
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msdt.exe'
  - OriginalFileName: 'msdt.exe'
  selection_cmd_inline:
    CommandLine|contains: 'IT_BrowseForFile='
  selection_cmd_answerfile_flag:
    CommandLine|contains: ' PCWDiagnostic'
  selection_cmd_answerfile_param:
    CommandLine|contains|windash: ' -af '
  condition: selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies processes that utilize the "msdt.exe" binary, specifically looking for indicators that exploit the CVE-2022-30190 vulnerability associated with the "ms-msdt" handler. This vulnerability is notably leveraged in the context of the "Follina" attack, which allows malicious actors to execute arbitrary commands on a compromised system by crafting specially formatted documents. The likely objective of an attacker exploiting this vulnerability is to gain unauthorized access to systems, exfiltrate data, or propagate additional malware within a network environment.

  The relevant MITRE ATT&CK tactics include:
  - **Execution (T1202)**: Leveraging the "msdt.exe" binary to execute commands.
  - **Defense Evasion (T1203)**: Using this vulnerability to evade detection mechanisms commonly set up to monitor normal execution paths or validate binary behavior.

  The primary data source for this detection rule is **process creation events**, which capture the execution of the "msdt.exe" process and associated command-line arguments. Analyzing these events will provide insights into whether the binary is misused in a manner consistent with known exploitation patterns.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for instances of "msdt.exe" running with unusual or suspicious command-line parameters, particularly those that include "IT_BrowseForFile=" or the mentioned flags.

  - **Analyze Command-Line Arguments**: Scrutinize any command-line arguments associated with identified "msdt.exe" processes, looking for specific patterns related to the exploitation, such as "PCWDiagnostic" or custom answer file flags.

  - **Correlate with User Activity**: Investigate user activity and context around the timestamps of identified process executions to determine if they align with known document openings or system modification attempts.

  - **Examine Related Network Traffic**: Monitor network communications from systems where msdt.exe was executed, searching for unusual outbound connections that might indicate data exfiltration or communication with a command-and-control server.

  ### Prioritization
  The severity of this alert is high due to the potential for unauthorized command execution and system compromise associated with the exploitation of the Follina vulnerability. The impact could lead to significant data breaches or system integrity issues if successful.

  ### Blind Spots and Assumptions
  There may be detection gaps regarding benign usages of msdt.exe, as some legitimate IT processes might also leverage this binary. The rule makes the assumption that command-line arguments will always reflect an exploit attempt; however, there might be legitimate cases with similar patterns. Additionally, process creation event logging must be enabled and adequately configured for accurate detection; without it, this rule will not function effectively.

