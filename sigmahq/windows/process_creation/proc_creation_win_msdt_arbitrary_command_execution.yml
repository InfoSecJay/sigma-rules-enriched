title: Potential Arbitrary Command Execution Using Msdt.EXE
id: 258fc8ce-8352-443a-9120-8a11e4857fa5
status: test
description: Detects processes leveraging the "ms-msdt" handler or the 
  "msdt.exe" binary to execute arbitrary commands as seen in the follina 
  (CVE-2022-30190) vulnerability
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://twitter.com/_JohnHammond/status/1531672601067675648
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-29
modified: 2024-03-13
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msdt.exe'
  - OriginalFileName: 'msdt.exe'
  selection_cmd_inline:
    CommandLine|contains: 'IT_BrowseForFile='
  selection_cmd_answerfile_flag:
    CommandLine|contains: ' PCWDiagnostic'
  selection_cmd_answerfile_param:
    CommandLine|contains|windash: ' -af '
  condition: selection_img and (selection_cmd_inline or all of 
    selection_cmd_answerfile_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects processes that use the "msdt.exe" executable in conjunction with potentially malicious command-line arguments, specifically targeting the arbitrary command execution vulnerability associated with the Microsoft Support Diagnostic Tool (CVE-2022-30190). The attacker’s objective is to leverage this tool to execute arbitrary commands in the context of the user or system, which may lead to further exploitation or lateral movement within an environment.

  Relevant MITRE ATT&CK tactic is "Execution" (TA0002) and the technique is “Command and Scripting Interpreter” (T1059). The primary telemetry sources include Windows process creation logs, specifically monitoring for Event ID 4688 and Sysmon Event ID 1 to capture command-line activity. If the behavior is confirmed malicious, it can result in unauthorized access or data compromise. Importantly, this detection does not confirm the success of the attack; it merely indicates that a relevant command pattern has been observed.

  ### Investigation Steps

  - **Review process creation logs:** Examine Event ID 4688 and Sysmon Event ID 1 for processes using "msdt.exe." Particularly, look for command-line parameters that include "IT_BrowseForFile=" or "-af."
  - **Identify high-confidence malicious indicators:** Confirm if the "msdt.exe" command includes "PCWDiagnostic" or paths linked to unexpected or unauthorized file execution, indicating a potential exploitation attempt.
  - **Trace command-line arguments:** Investigate the complete command-line used to execute "msdt.exe." Legitimate usage typically does not include suspicious parameters like "IT_BrowseForFile=" or custom paths pointing to unusual or unrecognized locations.
  - **Verify host role and criticality:** For alerts coming from servers or high-privilege workstations, prioritize response actions as these assets may be more critical to overall security posture.
  - **Check for file creation or modification artifacts:** Assess the presence of unexpected files or logs in the directory where "msdt.exe" is executed, which can reveal attempts to establish persistence or execute additional payloads.

  ### Prioritization

  This alert warrants high priority due to the potential for arbitrary command execution on critical infrastructure. The likelihood of exploitation through known vulnerabilities like CVE-2022-30190 makes it a significant risk, especially in environments that automate or frequently utilize PowerShell and diagnostic tools. This behavior is actively weaponized, indicating the necessity for prompt investigation and response.

  ### Blind Spots and Assumptions

  Detection may miss obfuscated commands or legitimate use cases where "msdt.exe" is invoked with valid diagnostic parameters. Comprehensive telemetry setup is crucial; ensure process creation logging is enabled across all endpoints. Additionally, similar legitimate administrative actions might trigger these alerts. A related detection rule would be monitoring PowerShell execution (T1059.001), which may help identify when "msdt.exe" is used in conjunction with malicious scripts or commands.

