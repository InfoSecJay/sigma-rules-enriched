note: |
  ### Technical Context

  This Sigma rule detects the execution of `msdt.exe` leveraging the Microsoft Support Diagnostic Tool (MSDT) to execute arbitrary commands, potentially exploiting the CVE-2022-30190 vulnerability known as "Follina." The likely attacker objective is to run malicious scripts or binaries with elevated privileges by manipulating legitimate diagnostic tools. This behavior corresponds to the MITRE ATT&CK tactic of Execution, specifically technique T1202 (Command and Scripting Interpreter: Active Scripting).

  The primary telemetry sources for this detection include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which record command-line arguments and image paths of initiated processes. If malicious, this behavior poses a significant security impact as it can lead to unauthorized command execution and system compromise. However, this detection does NOT confirm that the executed command is inherently malicious; it merely indicates the execution of `msdt.exe` under suspicious conditions.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `msdt.exe` execution. Look for entries where the `CommandLine` field contains `IT_BrowseForFile=` or `-af` flags, indicating potential exploitation.

  - **Identify high-confidence malicious indicators**: Search for evidence of scripts or commands in the `CommandLine` that include `PCWDiagnostic` or `IT_BrowseForFile=` parameters. Legitimate usage generally does not include these arguments in normal operation.

  - **Correlate with existing incident data**: Check any concurrent alerts tied to lateral movement or command execution anomalies. If other alerts indicate previous malicious activity, this may elevate the confidence level of the current finding.

  - **Validate legitimate behavior**: Assess whether `msdt.exe` was initiated as part of a known system support operation, such as a user-initiated diagnostic session, and check for corresponding Event ID logs for user actions related to troubleshooting.

  - **Examine network activity**: Investigate if there were any outbound connections made by the process around the same time as the alert. Review network logs for suspicious traffic patterns indicating command and control or data exfiltration attempts.

  - **Look for file artifacts**: Check for the creation or modification of files in common temp directories following the execution of `msdt.exe`. The presence of unexpected files could suggest that the command execution was malicious.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for arbitrary command execution, which can severely compromise sensitive systems. The exploitation of `msdt.exe` is often weaponized in attacks, thereby making the likelihood of malicious abuse significant, especially in enterprise environments where sensitive data is at stake.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate use of `msdt.exe` for non-malicious purposes, such as system diagnostics. Required log sources must be correctly configured to capture all process creation events to ensure comprehensive detection. Legitimate activities that may trigger this alert could involve helpdesk support or IT personnel conducting authorized system diagnostics. A related detection that enhances coverage is monitoring for unusual process execution patterns involving commonly exploited tools, such as PowerShell or cmd.exe, alongside `msdt.exe`.

