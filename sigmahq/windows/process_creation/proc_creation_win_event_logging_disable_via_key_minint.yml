logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
        # Example: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt"
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cmd:
    CommandLine|contains|all:
    - ' add '
    - '\SYSTEM\CurrentControlSet\Control\MiniNt'
  selection_powershell_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\powershell_ise.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_powershell_cmd1:
    CommandLine|contains:
    - 'New-Item '
    - 'ni '
  selection_powershell_cmd2:
    CommandLine|contains: '\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: all of selection_reg_* or all of selection_powershell_*
falsepositives:
- Highly Unlikely
level: high
note: |
  ### Technical Context

  This rule detects attempts to disable security event logging on Windows systems by modifying the `MiniNt` registry key. Attackers aim to disable logging to evade detection of their actions, thereby facilitating lateral movement, data exfiltration, or maintaining persistence on compromised systems. The behavior relates to the MITRE ATT&CK technique T1562.002 (Disable Security Events Logging) and T1112 (Modification of Registry). The primary telemetry sources involved are process creation events from Windows, specifically capturing events pertaining to `reg.exe` or PowerShell scripts that manipulate the registry. If malicious, disabling security logging significantly impacts the organization's ability to detect and respond to threats. However, this detection does NOT confirm that an attack has occurred, only that an attempt to alter logging behavior has been made.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 to find instances where `reg.exe` or PowerShell was executed with the command line containing `add` and the registry path `\SYSTEM\CurrentControlSet\Control\MiniNt`.

  - **Identify command-line patterns:** Look for Powershell Event ID 4104 logs that contain command lines invoking `New-Item` or `ni` along with `\SYSTEM\CurrentControlSet\Control\MiniNt`. This may indicate a scripted attempt to modify the registry.

  - **Assess recent registry changes:** Use forensic tools or registry monitoring to verify changes in the registry for the key `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt`. Recent alterations to this key can signify unauthorized modifications.

  - **Determine legitimate activity:** Consider typical administrative tasks that might modify registry keys. Legitimate updates should include a proper justification and evidence of approved maintenance procedures. There should be no unexplained modifications to `MiniNt`.

  - **Correlate with system health:** Check for other anomalies in logs (e.g., Event IDs 51400-51405 for suspicious account activity) around the time the registry change was made. An increase in failed logins or unusual account activity may indicate malicious intent.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant risk. Disabling logging is a common tactic used by adversaries to conceal their activities, suggesting a high likelihood of malicious exploitation, especially on critical assets.

  ### Blind Spots and Assumptions

  This detection may miss attempts to manipulate logs using alternative methods or tools not invoking standard Windows logging mechanisms. It requires proper logging configurations for the registry and successful retrieval of process creation events. Additionally, legitimate administrative processes, such as bug fixes or updates, could mistakenly trigger the alert. A related detection to consider is monitoring for unauthorized access to sensitive registry keys, bolstering overall situational awareness regarding registry manipulation activities.

