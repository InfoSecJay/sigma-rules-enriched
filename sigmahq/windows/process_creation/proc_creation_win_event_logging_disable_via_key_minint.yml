logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
        # Example: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt"
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cmd:
    CommandLine|contains|all:
    - ' add '
    - '\SYSTEM\CurrentControlSet\Control\MiniNt'
  selection_powershell_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\powershell_ise.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_powershell_cmd1:
    CommandLine|contains:
    - 'New-Item '
    - 'ni '
  selection_powershell_cmd2:
    CommandLine|contains: '\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: all of selection_reg_* or all of selection_powershell_*
falsepositives:
- Highly Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the addition of the `MiniNt` registry key, which disables the Windows Event Log service. Attackers may use this technique to prevent the logging of critical security events, thereby reducing the chance of detection during malicious activities. The behavior fits within the MITRE ATT&CK framework under the tactics of Defense Evasion (T1562.001) and Persistence (T1112). Primary telemetry sources include Windows process creation logs and registry change logs. If malicious, the impact could be severe, as it may facilitate undetected intrusions or lateral movements. However, this detection does NOT confirm that the system is compromised on its own; it simply indicates an action that could be part of a malicious activity.

  ### Investigation Steps

  - **Check for registry changes**: Review Windows Security Event ID 4608 for evidence of registry modifications related to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt` to confirm the action was taken.

  - **Identify executing processes**: Analyze Sysmon Event ID 1 for process creation events, focusing on processes like `reg.exe`, `powershell.exe`, or `pwsh.exe` that may have executed commands to modify the registry.

  - **Look for PowerShell activity**: Validate PowerShell execution (Event ID 4104) for commands like `New-Item` or `ni` targeting `\SYSTEM\CurrentControlSet\Control\MiniNt` to identify potential malicious intent.

  - **Determine typical logging behavior**: If the system typically logs events successfully prior to this incident, compare with Windows Event ID 1102 (Event log cleared) for legitimacy, ensuring the logging functionality was intact.

  - **Correlate with prior activity**: Review recent alerts and logs for unusual API calls or unauthorized user activities in conjunction with the registry modification, as this could indicate a more extensive compromise.

  ### Prioritization

  This alert is high severity due to its potential to indicate a serious security threat. Disabling event logging can significantly increase the risk of undetected intrusions. Given that attackers often employ this technique to evade detection, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper logging configurations; if logging is already disabled, no alerts will be generated. Potential legitimate reasons for changing registry keys should be considered, such as specific enterprise application requirements. Complementary detections include monitoring for suspicious PowerShell activity, as it might identify other related evasive maneuvers that an adversary may employ.

