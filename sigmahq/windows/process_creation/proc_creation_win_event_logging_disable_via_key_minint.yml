- car.2022-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
        # Example: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt"
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cmd:
    CommandLine|contains|all:
    - ' add '
    - '\SYSTEM\CurrentControlSet\Control\MiniNt'
  selection_powershell_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\powershell_ise.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_powershell_cmd1:
    CommandLine|contains:
    - 'New-Item '
    - 'ni '
  selection_powershell_cmd2:
    CommandLine|contains: '\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: all of selection_reg_* or all of selection_powershell_*
falsepositives:
- Highly Unlikely
level: high
note: |
  ---

  ### Technical Context

  This detection rule identifies attempts to disable security event logging in Windows by adding the `MiniNt` registry key. Attackers typically aim to silence logging to avoid detection of their activities, such as lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562.002) and Persistence (T1112). The primary telemetry sources include process creation logs (Windows Event ID 4688), PowerShell command logs (Event ID 4104), and registry change telemetry. If successful, disabling security event logging can severely impact an organization’s ability to detect and respond to malicious activity. This detection does NOT confirm that an attacker is currently present; it only indicates a potential attempt to evade detection.

  ---

  ### Investigation Steps

  - **Check for registry changes:** Review Windows Event ID 4657 to confirm registry access at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt`. A legitimate application typically does not modify this key, while suspicious activity includes any alterations around this registry path.

  - **Analyze PowerShell command execution:** Inspect Event ID 4104 for any PowerShell command lines that include `New-Item` or `ni` along with `\SYSTEM\CurrentControlSet\Control\MiniNt`. Legitimate administrative scripts will typically not target this registry path.

  - **Correlate with recent process creation:** Review Event ID 4688 and focus on any instances of `reg.exe` or PowerShell executables associated with manipulation of the MiniNt key. Look for unusual parent-child process relationships indicating potential malicious execution chains.

  - **Evaluate command history:** If available, examine command history files from PowerShell to find any previous commands related to the MiniNt registry key. Confirm user accounts executing these commands, looking for anomalies in user behavior.

  - **Identify system criticality:** Determine if the affected system is a domain controller or contains sensitive data, increasing the severity of the investigation.

  - **Assess for evasion attempts:** Consider other detection rules related to registry modifications (such as the companion rule ID 8839e550) to identify if other mechanisms are being used alongside the `MiniNt` key change.

  ---

  ### Prioritization

  This alert carries high severity due to the critical nature of the logging functionality in preventing undetected malicious activity. The impact of disabling logging on a compromised system is significant, increasing the risk of successful lateral movement or data exfiltration. Such behavior is frequently weaponized by adversaries aiming to maintain persistence and avoid detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant logging configurations or if the logs are cleared after the malicious activity. Legitimate administrative actions may occasionally alter registry keys for valid maintenance or configuration purposes. Companion detections involving registry access patterns should be strengthened, such as monitoring for unauthorized registry key manipulations.

