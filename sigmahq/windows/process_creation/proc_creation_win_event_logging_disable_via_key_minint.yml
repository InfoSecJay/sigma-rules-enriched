logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
        # Example: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\MiniNt"
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cmd:
    CommandLine|contains|all:
    - ' add '
    - '\SYSTEM\CurrentControlSet\Control\MiniNt'
  selection_powershell_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\powershell_ise.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_powershell_cmd1:
    CommandLine|contains:
    - 'New-Item '
    - 'ni '
  selection_powershell_cmd2:
    CommandLine|contains: '\SYSTEM\CurrentControlSet\Control\MiniNt'
  condition: all of selection_reg_* or all of selection_powershell_*
falsepositives:
- Highly Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to disable Windows security event logging through the creation of the `MiniNt` registry key. Adversaries often utilize this method to circumvent security monitoring, allowing them to engage in malicious activities undetected. The objective behind disabling the Windows Event Log service is to inhibit the collection and storage of security-related information which could reveal their presence or actions within the system. Attackers aiming for persistence and evasion strategies may employ this tactic to facilitate their goals.

  This behavior is aligned with the MITRE ATT&CK framework, specifically the tactics of **Persistence** and **Defense Evasion**. Techniques applicable include **T1562.002 - Disable User Account Control** and **T1112 - Modify Registry**. The primary source for the evidence supporting this detection will come from process creation events related to registry modification attempts, specifically involving `reg.exe` or PowerShell commands used for registry manipulation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where `reg.exe`, `PowerShell.exe`, `pwsh.exe`, or `powershell_ise.exe` executed commands targeting the registry key path `\SYSTEM\CurrentControlSet\Control\MiniNt`.

  - **Analyze Command Line Arguments**: Focus on command-line arguments for the registry modification commands. Look for patterns indicating the addition of the `MiniNt` registry key, including any flags that suggest logging or auditing changes.

  - **Inspect Event Log Service Status**: Check the status of the Windows Event Log service to confirm if it has been disabled or modified. This can indicate whether the registry change was effective.

  - **Correlate with Other Security Alerts**: Investigate any simultaneous alerts or anomalies captured by other security tools within the environment for potential correlated activity that could suggest broader attack vectors.

  ### Prioritization
  This alert is rated as high severity because disabling event logging can significantly impede an organization’s ability to detect ongoing and future adversarial activities, which poses a critical risk to system integrity and security posture.

  ### Blind Spots and Assumptions
  Potential blind spots in this detection include scenarios where the attacker implements techniques to bypass detection, such as using legitimate administrative accounts to make changes without triggering alerts. The detection logic assumes that process creations involving specific executable names and registry paths will reliably indicate an attempt to disable security logging. This rule requires proper logging levels and configurations to capture all relevant process creation events, particularly those related to registry modifications.

