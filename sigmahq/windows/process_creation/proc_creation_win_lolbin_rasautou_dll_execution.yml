title: DLL Execution via Rasautou.exe
id: cd3d1298-eb3b-476c-ac67-12847de55813
status: test
description: Detects using Rasautou.exe for loading arbitrary .DLL specified in -d
  option and executes the export specified in -p.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rasautou/
- https://github.com/fireeye/DueDLLigence
- https://www.fireeye.com/blog/threat-research/2019/10/staying-hidden-on-the-endpoint-evading-detection-with-shellcode.html
author: Julia Fomina, oscd.community
date: 2020-10-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: process_creation
  definition: Since options '-d' and '-p' were removed in Windows 10 this rule is
    relevant only for Windows before 10. And as Windows 7 doesn't log command line
    in 4688 by default, to detect this attack you need Sysmon 1 configured or KB3004375
    installed for command-line auditing 
    (https://support.microsoft.com/en-au/help/3004375/microsoft-security-advisory-update-to-improve-windows-command-line-aud)
detection:
  selection_img:
  - Image|endswith: '\rasautou.exe'
  - OriginalFileName: 'rasdlui.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -d '
    - ' -p '
  condition: all of selection*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of arbitrary DLLs via the legitimate system process `Rasautou.exe`, a known technique that attackers might exploit to load malicious code while evading detection. By using the `-d` option to specify a DLL and the `-p` option for the entry point, the attacker can execute custom functionality within the loaded library. This behavior often indicates an intent to perform actions such as privilege escalation, data exfiltration, or lateral movement within a compromised environment.

  The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1562)**: Attackers attempt to obfuscate their actions by using trusted system binaries.
  - **Execution (T1218)**: Utilizing legitimate processes for executing malicious code.

  The best sources of telemetry to validate this detection are Windows process creation logs (Event ID 4688) enhanced with Sysmon or the specified registry key set for command-line auditing, which logs comprehensive command-line arguments. Collecting these logs will reveal the use of `Rasautou.exe` along with the parameters passed to it.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs from Sysmon or Windows Event ID 4688 to identify instances of `Rasautou.exe` being executed with unexpected command line parameters.
  - **Analyze Command Line Arguments**: Focus on instances where `Rasautou.exe` is invoked with the `-d` and `-p` options to determine the DLL being loaded and the entry point executed.
  - **Correlate Execution Context**: Check for related process activity, such as parent processes or user account contexts, to gather insights about potential malicious intent.
  - **Inspect DLLs Used**: Query the DLL being executed to understand its legitimacy and usage patterns, looking for indicators of compromise or known malicious signatures.

  ### Prioritization
  The medium severity of this alert is justified by the potential impact of arbitrary DLL execution, which could lead to significant compromise of system integrity and data confidentiality within the enterprise environment. Although the likelihood of encountering this technique is moderated by its requirements, its detection is crucial for proactive incident response.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the environment does not have Sysmon configured or if auditing for command-line arguments is not enabled, as this would prevent capturing pertinent execution details. The detection logic assumes that `Rasautou.exe` is being misused rather than used legitimately; therefore, the context of execution (such as known user behavior or scheduled tasks) should be considered. Adequate logging configurations must be established to ensure comprehensive visibility into process behaviors.

