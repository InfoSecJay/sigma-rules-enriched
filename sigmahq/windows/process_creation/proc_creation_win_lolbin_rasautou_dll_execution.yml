title: DLL Execution via Rasautou.exe
id: cd3d1298-eb3b-476c-ac67-12847de55813
status: test
description: Detects using Rasautou.exe for loading arbitrary .DLL specified in 
  -d option and executes the export specified in -p.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rasautou/
- https://github.com/fireeye/DueDLLigence
- https://www.fireeye.com/blog/threat-research/2019/10/staying-hidden-on-the-endpoint-evading-detection-with-shellcode.html
author: Julia Fomina, oscd.community
date: 2020-10-09
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: process_creation
  definition: Since options '-d' and '-p' were removed in Windows 10 this rule 
    is relevant only for Windows before 10. And as Windows 7 doesn't log command
    line in 4688 by default, to detect this attack you need Sysmon 1 configured 
    or KB3004375 installed for command-line auditing 
    (https://support.microsoft.com/en-au/help/3004375/microsoft-security-advisory-update-to-improve-windows-command-line-aud)
detection:
  selection_img:
  - Image|endswith: '\rasautou.exe'
  - OriginalFileName: 'rasdlui.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -d '
    - ' -p '
  condition: all of selection*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `rasautou.exe`, specifically when it is used to load a specified DLL with the `-d` option and execute an export with the `-p` option. The behavior indicates potential misuse of a legitimate Windows component to execute arbitrary code, likely aiming for stealthy execution of malicious payloads while evading standard defenses. The relevant MITRE ATT&CK tactic is Execution (TA0002), and the associated technique is DLL Injection (T1218). Primary telemetry sources for detection include Windows Security Event ID 4688 and Sysmon Event ID 1, particularly critical in environments running versions prior to Windows 10. If successful, this behavior could enable an attacker to maintain persistence or escalate privileges. This detection does NOT confirm whether the executed code is inherently malicious or benign without further context.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for occurrences where `rasautou.exe` has been executed. Look for suspicious command-line parameters, particularly those including `-d` and `-p`.

  - **Analyze the command line:** Assess the full command line used with `rasautou.exe` to identify any unusual or unauthorized DLLs referenced. Malicious indicators would be DLLs that are not part of standard system operations or are known malicious files.

  - **Validate the source of the executable:** Confirm the original file name of the `rasautou.exe` process is `rasdlui.exe`. If the original file name is altered or does not match, it could indicate process tampering.

  - **Identify normal usage patterns:** Compare against established baselines of normal usage for systems in the environment. Many legitimate administrative tasks may invoke similar behavior but do not typically utilize unsigned or unrecognized DLLs.

  - **Review associated network activity:** Investigate outbound network connections made by the process using `rasautou.exe` to see if there are calls to known command-and-control (C2) servers or anomalous domains, indicating potential data exfiltration or further compromise.

  - **Examine endpoint security controls:** Ensure host-based security solutions, such as antivirus or endpoint detection and response (EDR), have not flagged or quarantined the process as a potential threat, as this may provide insights into whether the execution was flagged as suspicious previously.

  ### Prioritization

  This alert should be treated with medium severity, as it involves the use of a legitimate binary for potentially malicious purposes, which can lead to significant compromise if exploited. The likelihood of malicious abuse is moderate, particularly in high-value environments subject to targeted attacks, and this technique aligns with ongoing adversarial tactics.

  ### Blind Spots and Assumptions

  Detection may be limited by versions of Windows; versions prior to Windows 10 do not log command-line parameters by default unless additional configurations or patches are applied. Legitimate administrative tasks that may trigger similar alerts include legitimate software updates or maintenance scripts. Additional detections such as monitoring for unauthorized DLL creation or modifications, especially in sensitive directories, can enhance detection reliability and coverage.

