title: DLL Execution via Rasautou.exe
id: cd3d1298-eb3b-476c-ac67-12847de55813
status: test
description: Detects using Rasautou.exe for loading arbitrary .DLL specified in 
  -d option and executes the export specified in -p.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rasautou/
- https://github.com/fireeye/DueDLLigence
- https://www.fireeye.com/blog/threat-research/2019/10/staying-hidden-on-the-endpoint-evading-detection-with-shellcode.html
author: Julia Fomina, oscd.community
date: 2020-10-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: process_creation
  definition: Since options '-d' and '-p' were removed in Windows 10 this rule 
    is relevant only for Windows before 10. And as Windows 7 doesn't log command
    line in 4688 by default, to detect this attack you need Sysmon 1 configured 
    or KB3004375 installed for command-line auditing 
    (https://support.microsoft.com/en-au/help/3004375/microsoft-security-advisory-update-to-improve-windows-command-line-aud)
detection:
  selection_img:
  - Image|endswith: '\rasautou.exe'
  - OriginalFileName: 'rasdlui.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' -d '
    - ' -p '
  condition: all of selection*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This detection rule identifies the use of `Rasautou.exe`, which is typically used for remote access auto-connection, to maliciously load arbitrary DLLs when specified with the `-d` and `-p` command-line options. The likely objective of attackers is to execute malicious payloads stealthily on the target system without triggering standard security protections. This behavior maps to the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution). The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1 if configured correctly. The security impact of a successful exploit is significant, as it may lead to unauthorized control over the affected system. Importantly, this detection does not confirm that the behavior is malicious on its own, as legitimate uses of `Rasautou.exe` can occur in controlled environments.

  ### Investigation Steps

  - **Verify the command line arguments**: Check for Security Event ID 4688 or Sysmon Event ID 1 for `Rasautou.exe` execution with `-d` and `-p` command line options. Malicious usage will always include these flags, while legitimate instances would not typically include them.

  - **Analyze the loaded DLL path**: If identified from the command line, examine the DLLs being loaded for suspicious paths (e.g., non-standard directories). Malicious indicators may include DLLs located in temporary folders or user profile directories.

  - **Review parent process hierarchy**: Trace the parent process for `Rasautou.exe`. Legitimate execution often originates from system processes or trusted applications, whereas suspicious executions may arise from unexpected or unassociated processes.

  - **Correlate with network activity**: If Sysmon is available, review for associated network connections (Sysmon Event ID 3) initiated by `Rasautou.exe`. Malicious activity often correlates with outbound connections to unrecognized or blacklisted IP addresses.

  - **Assess audit configurations**: Ensure that Windows systems have KB3004375 installed or Sysmon configured for command-line auditing. This adjustment is crucial for capturing the command-line arguments for `Rasautou.exe` executions effectively.

  ### Prioritization

  The alert severity is medium due to potential impacts on critical systems where `Rasautou.exe` is invoked maliciously to achieve covert execution of unwanted code. The likelihood of exploiting this behavior is moderate, as the knowledge to manipulate this legitimate binary exists in the adversarial community, and it has been weaponized in prior attacks.

  ### Blind Spots and Assumptions

  The detection may be evaded if attackers utilize the legitimate `Rasautou.exe` without the malicious command-line parameters or if they run it from a clean environment where logging is suppressed. The required configurations for reliable detection include enhanced event logging in Windows and Sysmon deployment. Legitimate uses may include automated VPN connections or network service configurations. A related detection that strengthens coverage could be tracking other legitimate binaries being used in unexpected ways to invoke DLLs, such as `mshta.exe` or `wscript.exe`.

