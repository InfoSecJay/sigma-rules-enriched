detection:
  selection_tools:
    Image|endswith: '\sqlcmd.exe'
  selection_query:
    CommandLine|contains|all:
    - 'SELECT'
    - 'TOP'
    - '[VeeamBackup].[dbo].[Credentials]'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies a potentially harmful use of `sqlcmd.exe`, which is a command-line utility for SQL Server that can be misused to extract sensitive information from databases. Specifically, this rule focuses on the unauthorized retrieval of credentials stored in the VeeamBackup database. Attackers may leverage this technique to gather credentials with the intention of escalating privileges, conducting lateral movement, or deploying ransomware, as outlined in documented incidents involving the Diavol ransomware group.

  The relevant MITRE ATT&CK tactics and techniques for this detection are primarily:
  - **Collection** (TA0009) - The method employed involves gathering sensitive data.
  - **Data from Information Repositories** (T1005) - This technique pertains to the extraction of information from databases, which includes SQL Server databases.

  The primary data source for effective detection is the process creation event logs, specifically those that capture command-line arguments executed by processes, enabling analysts to examine any attempts to access sensitive data through SQL queries.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs for any instances of `sqlcmd.exe` starting, especially those with command-line arguments resembling SQL queries targeting the VeeamBackup database.

  - **Analyze Command-Line Arguments**: Look for command-line execution patterns that include SQL keywords such as 'SELECT', 'TOP', and references to '[VeeamBackup].[dbo].[Credentials]'. This can help confirm unauthorized data access attempts.

  - **Cross-Reference User Activity**: Check the user account executing the command against existing user access rights. Determine if this account ordinarily requires access to the VeeamBackup database or if their activity falls outside of normal operational behavior.

  - **Investigate Database Audit Logs**: Examine VeeamBackup database audit logs (if enabled) for access patterns around the same timeframe as the detected command execution. This can provide additional context on whether this action was legitimate or unauthorized.

  ### Prioritization
  This alert is classified as high severity due to the sensitive nature of the data being targeted (database credentials), the ease with which such information can be exploited by attackers, and the notable increase in ransomware incidents leveraging credential access for lateral movement.

  ### Blind Spots and Assumptions
  A gap in detection coverage may exist if `sqlcmd.exe` is executed with obfuscated or alternative command-line arguments not matching the predefined detection criteria. The detection logic assumes that the command will include specific SQL keywords and target paths, which might not encompass all potential malicious use cases. Additionally, for this alert to function, accurate process creation logging must be enabled and properly configured on endpoints, ensuring that command-line arguments are captured without truncation.

