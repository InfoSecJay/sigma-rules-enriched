  ---

  ### Technical Context

  This Sigma rule detects the execution of `sqlcmd.exe` with specific command-line arguments indicative of a query targeting the `Credentials` table in the VeeamBackup database. The behavior suggests an attacker attempting to gather sensitive database credentials, likely for lateral movement or escalation in a compromised environment. The relevant MITRE ATT&CK technique is **Collection - Data from Information Repositories (T1005)**.

  The primary telemetry source includes process creation logs from Windows systems, specifically capturing command-line arguments and the process image name. If the behavior is malicious, it represents a significant security risk, as exposure of backup credentials could lead to full system compromise or data exfiltration. This detection does NOT confirm that credentials were successfully extracted or used, as it only indicates an attempt to query the database.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Windows Security Event ID 4688 and Sysmon Event ID 1 to confirm execution of `sqlcmd.exe` on systems that host the VeeamBackup database. Focus on command-line arguments to identify any matches with the specified query.

  - **Check Context of Execution:** Identify the user account that executed the command. Compare against known administrative accounts and applications. Legitimate administrative access (e.g., from a backup administrator) should be documented.

  - **Correlate with Database Logs:** Review SQL Server logs for any corresponding activity around the same time as the detected execution, particularly focusing on login attempts and queries against the `VeeamBackup.dbo.Credentials` table.

  - **Analyze for Lateral Movement Indicators:** Look for additional suspicious activity that may indicate lateral movement, such as unauthorized account creation or privilege escalation on the host where the event was triggered.

  - **Validate Malicious Indicators:** Identify and keep track of unusual patterns or known malicious user agents associated with this type of query. Document any occurrences where the command is being run from unexpected or unauthorized systems.

  - **Review Asset Criticality:** Assess the importance of the affected system within the enterprise context. If the system is a critical component of backup infrastructure, prioritize the investigation and potential remediation actions.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the critical nature of backup database credentials. The likelihood of malicious use is high, as attempted extraction of sensitive information is a common tactic among adversaries. Given that this technique is weaponized in various attacks, immediate investigation is crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in logging settings, particularly if SQL auditing is not enabled. Legitimate administrative operations, such as backup and recovery workflows, could trigger the alert if they involve querying the `Credentials` table. A companion detection to consider is any alerting on unauthorized SQL login attempts or database access patterns, which would provide a more comprehensive view of potential malicious activity.

