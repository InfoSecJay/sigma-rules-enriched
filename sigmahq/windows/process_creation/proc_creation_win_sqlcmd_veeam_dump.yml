note: |
  ### Technical Context

  This Sigma rule detects the use of `sqlcmd.exe` to execute a SQL query that retrieves sensitive credentials from the VeeamBackup database, specifically from the table `[VeeamBackup].[dbo].[Credentials]`. An attacker may use this technique to obtain stored backup credentials with the objective of gaining unauthorized access to backup data, potentially leading to ransomware deployment or data theft. This behavior aligns with the MITRE ATT&CK framework, specifically the tactic of Collection (TA0117) and technique Data from Information Repositories (T1005).

  The primary telemetry sources for this detection are process creation logs from Windows systems, specifically looking for Security Event ID 4688 or Sysmon Event ID 1 that indicate the execution of processes. If this behavior is confirmed to be malicious, the security impact could include unauthorized access to sensitive data and disruption of backup and recovery operations. Importantly, this detection alone does not confirm the legitimacy or intent of the action without further investigation.

  ### Investigation Steps

  - **Review the process creation event:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `sqlcmd.exe` execution with the specified command line that includes 'SELECT' and references `[VeeamBackup].[dbo].[Credentials]`.

  - **Validate command line parameters:** Ensure that the command line contains the keywords 'SELECT', 'TOP', and the expected table reference. Legitimate queries may also include parameters related to backup management, monitoring, or configuration without targeting sensitive data.

  - **Correlate with database access logs:** Examine SQL Server logs for related access by the user executing the command. Look for high-frequency access patterns to the `[VeeamBackup].[dbo].[Credentials]` table that deviate from normal behavior.

  - **Check for associated user accounts:** Identify the user account that executed the command and verify their role. Administrative accounts engaging in unusual SQL command executions against the VeeamBackup database should be scrutinized.

  - **Identify recent changes in credential storage processes:** Review change management logs for any recent updates to VeeamBackup database structure or access rights that may cause legitimate access to trigger this alert.

  - **Validate log aggregation search queries:** Confirm that data retention policies and logging configurations for process and database access are correctly set to capture events related to SQL query execution, ensuring extensive coverage.

  ### Prioritization

  This alert should be treated as high priority due to its potential impact on critical backup and recovery operations. The likelihood of malicious abuse is significant, as attackers often target credential stores for lateral movement and escalation purposes. Additionally, this technique is commonly weaponized in specific attack campaigns, putting organizations at high risk.

  ### Blind Spots and Assumptions

  Detection may have limitations if logging for SQL database access or process creation is not thoroughly configured, leading to missed instances of malicious execution. Legitimate database administrative processes may trigger this alert when database maintenance or updates occur. Related detections, such as monitoring for unusual SQL query patterns or abnormal user behavior, can strengthen overall detection capabilities against similar tactics.

