title: File Download Via InstallUtil.EXE
id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
status: test
description: |
  Detects use of .NET InstallUtil.exe in order to download arbitrary files. The files will be written to "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\"
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/239
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\InstallUtil.exe'
  - OriginalFileName: 'InstallUtil.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of .NET's `InstallUtil.exe` to download arbitrary files from remote servers over protocols like FTP or HTTP. Attackers may leverage this technique to compromise systems by executing unauthorized code or downloading malicious payloads, often as part of a larger attack strategy such as malware installation or data exfiltration. The use of `InstallUtil.exe` for malicious file downloads fits into the broader context of defense evasion tactics, where adversaries aim to bypass security measures and maintain persistence within a compromised environment.

  Relevant MITRE ATT&CK tactics and techniques for this detection include **Execution (T1203)**, where attackers execute code or scripts as part of their intrusion, and **Defense Evasion (T1218)**, which describes the use of tools or techniques that may help an attacker avoid detection or mitigate the effectiveness of countermeasures employed by defenders.

  The primary data sources for this detection rule are **process creation events** on Windows systems, specifically focusing on logs that capture the execution of `InstallUtil.exe` and the command-line parameters used during execution. These logs provide insight into potentially malicious activity, including network requests made during file downloads.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for entries associated with `InstallUtil.exe`, specifically looking for unusual command-line arguments indicating downloads from external URLs.
  - **Analyze Network Traffic**: Inspect outbound network connections to any FTP, HTTP, or HTTPS destinations that correlate with the identified process creation events. Look for suspicious domains or IP addresses.
  - **Correlate File Activity**: Check for file creations in the expected directory (`%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\`) and analyze the file types and signatures for indicators of compromise.
  - **Evaluate User Behavior**: Determine whether the user executing `InstallUtil.exe` has a legitimate reason for downloading files (e.g., scheduled tasks, administrative activities) or if the behavior is atypical.

  ### Prioritization
  This alert has a medium severity level because while the act of downloading files via `InstallUtil.exe` can indicate simple user error or benign behavior, it may also signal malicious activity that could lead to further compromise, making investigation essential in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative use of `InstallUtil.exe` that does not result in malicious file downloads. The detection logic assumes that malicious actors will use common file transfer protocols for downloading files, which may not always be the case if they employ alternative methods. Additionally, this alert relies on accurate process creation logs being captured; if logging levels are insufficient or if the logs are not retained adequately, the ability to detect this activity may be compromised.

