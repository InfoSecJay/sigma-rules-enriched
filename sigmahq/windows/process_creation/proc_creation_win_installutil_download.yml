title: File Download Via InstallUtil.EXE
id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
status: test
description: |
  Detects use of .NET InstallUtil.exe in order to download arbitrary files. The files will be written to "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\"
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/239
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\InstallUtil.exe'
  - OriginalFileName: 'InstallUtil.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of InstallUtil.exe, a .NET utility, to download files from remote locations using protocols like FTP and HTTP/HTTPS. The likely objective of an attacker is to exploit the legitimate use of InstallUtil to download and execute malicious payloads or scripts without raising suspicion. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) as it utilizes a legitimate tool for malicious purposes. The primary telemetry source is process creation logs, specifically via Windows Event ID 4688 or Sysmon Event ID 1, capturing command-line arguments associated with InstallUtil.exe.

  If malicious, this behavior could enable an attacker to introduce unauthorized software onto the system, leading to data compromise, persistent access, or further exploitation of the environment. However, it is crucial to note that this detection does NOT confirm the execution of malicious code on its own; benign uses of InstallUtil.exe for legitimate application installations may also generate similar logs.

  ### Investigation Steps

  - **Examine Process Creation Events**: Review Windows Event ID 4688 or Sysmon Event ID 1 for the execution of InstallUtil.exe. Check the CommandLine parameter for the presence of "ftp://" or "http://" indicating external file downloading.

  - **Check Downloaded Files**: Investigate the directory `%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\` for recently created files. Any file not recognized as part of expected applications or known software should be flagged for further analysis.

  - **Identify Known Compliant Usage**: Document expected behaviors of InstallUtil within your environment, such as regular deployments of .NET applications. Investigate processes initiated with known legitimate command-line arguments (e.g., installation of internal applications).

  - **Analyze Network Connections**: Utilize logs from your SIEM to identify any outgoing connections to known malicious IP addresses or domains that may correspond to the executed InstallUtil. Look for unusual spikes in outbound traffic related to the execution time.

  - **Determine Uncommon User Interaction**: Review the process creation and access logs to establish user activity during the execution of InstallUtil. Anomalous user access or lack of expected activity (e.g. running InstallUtil without prior installation requests) can be indicative of malicious intent.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on network security when unauthorized files are downloaded to systems, especially from the Internet. The likelihood of this technique being weaponized is significant, as attackers commonly leverage trusted utilities for malicious purposes in order to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of InstallUtil in application deployments, leading to potential false positives. Ensure that process creation logging is consistently enabled and that all relevant log sources are monitored for complete coverage. It is also possible for similar behaviors (e.g., using PowerShell for file downloads) to occur without triggering this rule, necessitating companion detections focused on other file download mechanisms for enhanced security coverage.

