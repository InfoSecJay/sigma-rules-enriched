title: File Download Via InstallUtil.EXE
id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
status: test
description: |
  Detects use of .NET InstallUtil.exe in order to download arbitrary files. The files will be written to "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\"
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/239
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\InstallUtil.exe'
  - OriginalFileName: 'InstallUtil.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the .NET InstallUtil.exe with command line parameters that contain URLs (ftp, http, or https), indicating an effort to download files to the local system, specifically to the Internet Cache location. The likely attacker objective is to utilize InstallUtil.exe, a legitimate Windows utility, to bypass security controls and download potentially malicious payloads while obscuring their actions. This behavior aligns with the MITRE ATT&CK tactic "Execution" (TA0002) and technique "User Execution" (T1203).

  The primary telemetry source is process creation logs, specifically monitoring Windows Event ID 4688 or Sysmon Event ID 1. If malicious, this could lead to unauthorized software installation and compromise the integrity of the affected system and the network. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to understand the context and legitimacy of the activity.

  ### Investigation Steps

  - **Confirm process origin:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify the parent process of InstallUtil.exe. If the parent process is a legitimate management tool or another known system process, this may indicate benign activity.

  - **Analyze command line arguments:** Inspect the CommandLine field for Event ID 4688 or Sysmon Event ID 1 for unauthorized URL patterns (e.g., "ftp://", "http://"). If the command line contains URLs leading to untrusted sources, consider this a strong indicator of malicious behavior.

  - **Check target download location:** Validate file creation in "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\". Look for newly created files or artifacts that match common file types seen in malware (e.g., .exe, .bat). Presence of such files should heighten the suspicion of a malicious download.

  - **Identify historical behavior:** Review previous process activity and creation patterns for InstallUtil.exe on the affected host. Determine if this method has been used frequently in the past. Frequent execution without legitimate reasons can suggest potential malicious intent.

  - **Evaluate host role and asset criticality:** Identify the role of the compromised host; devices hosting sensitive data or critical services should be prioritized for deeper investigation if InstallUtil.exe is detected executing commands to download files.

  ### Prioritization

  This alert carries a medium severity level due to the potential risk associated with unauthorized downloads on systems. The likelihood of malicious abuse is moderate, as using InstallUtil.exe for such activities is a known evasion technique, albeit not the most common. Systems of high criticality being impacted raise the priority for investigation.

  ### Blind Spots and Assumptions

  Detection may miss activities where the attacker uses different tools or methods for downloading files, representing a significant evasion technique. Reliable detection necessitates log sources such as Sysmon for comprehensive process monitoring, and missing these could reduce efficacy. Legitimate activities, such as regular updates or internal applications using InstallUtil.exe for valid reasons, may inadvertently trigger this rule. Monitoring companion detections, such as unexpected external requests or unusual network traffic correlating with installation executions, can enhance overall coverage and context.

