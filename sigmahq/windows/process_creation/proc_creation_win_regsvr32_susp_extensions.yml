note: |
  ### Technical Context

  This Sigma rule detects the execution of `REGSVR32.exe` with File Extensions traditionally not associated with Dynamic Link Libraries (DLLs), such as images or temporary files. This behavior is indicative of an adversary's attempt to execute malicious payloads while evading detection by using legitimate Windows utilities to register potentially harmful code. This relates to the MITRE ATT&CK framework, specifically T1218.010 (Exploitation for Client Execution: Signed Binary Proxy Execution).

  Telemetry is primarily sourced from Windows process creation logs (i.e., Event ID 4688 and Sysmon Event ID 1), which provide the necessary information about process executions and their command lines. If malicious, this behavior can lead to system compromise and further lateral movement. Importantly, this detection does NOT confirm that the behavior is explicitly malicious, as benign applications may also utilize `REGSVR32.exe` properly.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 or Sysmon Event ID 1 for instances of `REGSVR32.exe` execution. Look for uncommon command line arguments ending in file types like `.bin`, `.jpg`, or `.txt`.

  - **Analyze command line arguments:** Investigate the CommandLine field for anomalies. Legitimate entries may include recognizable DLL names, while suspicious entries will appear with unusual extensions as flagged by this rule.

  - **Cross-reference with execution context:** Determine if the `REGSVR32.exe` execution occurred within a suspicious context, such as from a temporary directory or associated with known malware hashes.

  - **Confirm file existence and integrity:** For any identified execution of `REGSVR32.exe`, validate the presence and origin of the associated file. Check the file paths and examine creation/modification timestamps for any discrepancies.

  - **Identify high-confidence malicious indicators:** Look for known IOCs linked to `REGSVR32.exe` abuse in the command line or the originating process. Such indicators might include software names or paths that correlate with the employment of this technique in historical attacks.

  - **Assess legitimate usage patterns:** Note common or expected usage of `REGSVR32.exe` in your environment, such as software updates or installations. Compare recent usage against your baseline to identify any deviations that warrant further scrutiny.

  ### Prioritization

  The alert severity is high due to the potential impact of executing malicious DLLs via `REGSVR32.exe`, which can lead directly to system compromise. Given the common use of this evasive technique in advanced attacks, it is crucial to treat alerts generated by this rule as potentially indicative of immediate risk.

  ### Blind Spots and Assumptions

  Detection may be limited by systems where monitoring of process creation events is not fully implemented or where logging may be disabled. Legitimate applications can trigger this alert when misusing `REGSVR32.exe`, especially when utilizing non-DLL file extensions. A related detection that complements this rule is monitoring for the use of `rundll32.exe`, which may also be employed similarly in execution tactics.

