title: ShimCache Flush
id: b0524451-19af-4efa-a46f-562a977f792e
status: stable
description: Detects actions that clear the local ShimCache and remove forensic 
  evidence
references:
- https://medium.com/@blueteamops/shimcache-flush-89daff28d15e
author: Florian Roth (Nextron Systems)
date: 2021-02-01
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection1a:
    CommandLine|contains|all:
    - 'rundll32'
    - 'apphelp.dll'
  selection1b:
    CommandLine|contains:
    - 'ShimFlushCache'
    - '#250'
  selection2a:
    CommandLine|contains|all:
    - 'rundll32'
    - 'kernel32.dll'
  selection2b:
    CommandLine|contains:
    - 'BaseFlushAppcompatCache'
    - '#46'
  condition: ( selection1a and selection1b ) or ( selection2a and selection2b )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to clear the local ShimCache, a Windows component that maintains a record of executed applications. This behavior typically indicates an attacker’s objective to eliminate forensic evidence of malicious activity associated with program execution, thereby obfuscating their tracks. The relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and **Defense Evasion (TA0005)**, specifically techniques **T1112 - Modify Registry** and **T1203 - Exploitation for Client Execution**. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1 for process creation details, which disclose command-line arguments and executable paths. The potential security impact is significant, as this action may indicate a sophisticated attempt to persist within a system while evading detection. It is important to note that this detection alone does not confirm malicious activity; legitimate applications may also clear the ShimCache or modify registry entries.

  ### Investigation Steps

  - **Review recent command executions:** Check Security Event ID 4688 and Sysmon Event ID 1 for process creation logs around the alert timestamp, focusing on command lines containing `rundll32 apphelp.dll ShimFlushCache` or `rundll32 kernel32.dll BaseFlushAppcompatCache`. Look for indicators of unusual timings or source accounts.

  - **Correlate with user context:** Investigate the user account associated with the detected command execution. If it is a high-privilege account (e.g., SYSTEM or Admin) performing these actions unexpectedly, this increases the likelihood of malicious intent.

  - **Check for related shimcache entries:** Use forensic tools to analyze the ShimCache (AppCompat cache) to identify any recent clearings. Look for discrepancies indicating that known legitimate applications were executed but are missing from the cache.

  - **Assess high-confidence malicious indicators:** Flag any command line usage that includes `rundll32` in conjunction with `apphelp.dll` or `kernel32.dll`, especially if originating from non-standard processes, as these would suggest malicious activity.

  - **Identify legitimate applications/activity:** Normalize expectations by reviewing other processes invoking `rundll32`. Confirm whether routine maintenance or software updates usually include ShimCache clearing to distinguish between benign and suspicious behaviors.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems if malicious behavior is confirmed. The likelihood of abuse is moderate to high, especially in contexts where forensic evidence is crucial. This technique is commonly weaponized by adversaries looking to erase traces of their actions after exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of script-based methods bypassing traditional logging mechanisms or the use of legitimate tools that may clear ShimCache for maintenance. Required log sources must include both process creation events (Security Event ID 4688 and/or Sysmon log) properly configured to avoid missing relevant artifacts. Legitimate activities, such as software installations or system maintenance tasks, may inadvertently trigger this alert. A companion detection that strengthens coverage would involve monitoring for other registry modification activities related to application compatibility or execution.

