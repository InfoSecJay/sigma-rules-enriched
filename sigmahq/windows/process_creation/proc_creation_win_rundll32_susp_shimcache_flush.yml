logsource:
  category: process_creation
  product: windows
detection:
  selection1a:
    CommandLine|contains|all:
    - 'rundll32'
    - 'apphelp.dll'
  selection1b:
    CommandLine|contains:
    - 'ShimFlushCache'
    - '#250'
  selection2a:
    CommandLine|contains|all:
    - 'rundll32'
    - 'kernel32.dll'
  selection2b:
    CommandLine|contains:
    - 'BaseFlushAppcompatCache'
    - '#46'
  condition: ( selection1a and selection1b ) or ( selection2a and selection2b )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to flush the ShimCache, a Windows feature that helps maintain application compatibility by storing historical data about executed applications. Attackers may clear the ShimCache to remove forensic evidence of their malicious activities, often as part of a strategy to obscure traces of their presence in a compromised environment. The primary MITRE ATT&CK tactic is **Persistence** (TA0003) and the relevant technique is **Control Panel Manipulation** (T1112).

  The primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon logs (Event ID 1), specifically tracking command-line arguments containing `rundll32` calling `apphelp.dll` or `kernel32.dll`. If malicious, this behavior can severely impact incident response and forensic investigations by eradicating crucial evidence. It's important to note that this detection does not confirm the intent or success of malicious actions on its own.

  ### Investigation Steps

  - **Review process creation events:** Cross-reference Security Event ID 4688 and Sysmon Event ID 1 for instances where the command line includes `rundll32 apphelp.dll ShimFlushCache` or `rundll32 kernel32.dll BaseFlushAppcompatCache`. Look for unusual execution patterns or timing.

  - **Analyze system context:** Determine the host role and assess whether the system's criticality level justifies further scrutiny. Legitimate usage is often tied to updates or installations and should be identified during routine application management.

  - **Check for additional indicators:** Investigate the creation or modification of files related to application compatibility, which may correlate with the ShimCache flush. Look for relevant file paths that could indicate tactical behavior (e.g., `C:\Windows\AppCompat\...`).

  - **Evaluate subsequent behavior:** Look for further signs of compromise, such as unusual network connections or additional process creations shortly after the detected flush action. Cross-reference with known bad IPs or processes.

  - **Correlate with user behavior:** Evaluate user accounts associated with the command executions to determine if they display anomalous behavior, such as executing commands outside typical hours or executing multiple flush commands in a short timeframe.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant security implications and the likelihood that this behavior indicates an attempt to cover malicious activity. The clear manipulation of application compatibility data by a potential adversary poses a risk that should be escalated for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of detailed logging configurations, as default Windows logging settings might not capture all events related to ShimCache manipulation. Legitimate administrative tasks (e.g., installation of software) could inadvertently trigger this alert, thus necessitating contextual awareness. A companion detection to consider includes monitoring for anomalous file or registry changes related to application installations that can provide a fuller picture of potential persistence mechanisms.

