detection:
  selection_img:
  - OriginalFileName: 'HH.exe'
  - Image|endswith: '\hh.exe'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - '\\\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution or download of remote CHM (Compiled HTML Help) files via `hh.exe`. Such behavior is often associated with delivering malicious content, as CHM files can contain embedded scripts or links that trigger further exploits when opened, thereby enabling attackers to execute arbitrary code. The likely objective is to exploit vulnerabilities through social engineering or drive-by downloads, leveraging the built-in Windows help executable as a vector for remote command execution.

  It aligns with the MITRE ATT&CK Tactic: Execution, Technique: Command and Scripting Interpreter: Windows Command Shell (T1059.003) and is specifically relevant to the technique of Abuse Elevation Control Mechanism, T1218.001. Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, which provide insights into process execution and command lines utilized. If this behavior is malicious, it can lead to full system compromise or data exfiltration. Importantly, this detection alone does not confirm malicious intent; it simply highlights suspicious usage patterns of `hh.exe`.

  ### Investigation Steps

  - **Identify process creation events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `hh.exe` being executed. Check the file path and parent process to determine if it matches typical usage scenarios.

  - **Analyze command line arguments:** Focus on command lines containing external sources (i.e., `http://`, `https://`, or `\\`). Determine if the referenced URLs are known malicious domains using threat intelligence feeds.

  - **Contextualize the behavior:** Verify if `hh.exe` execution correlates with user activity, such as legitimate help file access. Review user access patterns and any recent changes in user behavior or role.

  - **Look for high-confidence indicators:** If the `hh.exe` process is spawned with command-line parameters that reference external resources, particularly those with malicious reputation scores, consider this a high-confidence malicious indicator.

  - **Check network activity:** Look for outbound connections around the same time as `hh.exe` execution in network logs. Use firewall logs or Network Security Monitoring (NSM) data for any communications to suspicious URLs or unexpected IP addresses.

  ### Prioritization

  This alert should be categorized as high severity due to the potential compromise and impact on affected systems. The likelihood of misuse is significant, as attackers frequently leverage `hh.exe` for exploiting vulnerabilities, particularly in phishing campaigns or targeted attacks.

  ### Blind Spots and Assumptions

  The detection may miss variations of the attack if obfuscation techniques are used, such as employing different command-line parameters or legitimate file paths for `hh.exe`. Ensure logging for process creation and network activities is properly configured and monitored for more comprehensive coverage. Legitimate IT or help desk activities may trigger this alert if general Windows help resources are accessed remotely. A companion detection could involve monitoring for unusual download activity from `powershell.exe`, which can offer additional context for assessing potential exploitation attempts.

