  ---

  ### Technical Context

  This rule detects the execution and download of remote .chm (Compiled HTML Help) files using the hh.exe executable. This behavior typically indicates an attempt by an attacker to leverage unreliable and often overlooked file formats to execute potentially harmful code on a system. The likely attacker objective is to execute malicious payloads or bypass security mechanisms. Relevant MITRE ATT&CK tactics include Defense Evasion and Execution, specifically the technique T1218.001 (Signed Binary Proxy Execution). Primary telemetry sources include process creation logs (Windows Security Event ID 4688 and Sysmon Event ID 1) and command line invocation details. A successful exploitation could lead to data theft or unauthorized access to systems. Importantly, this detection does NOT confirm whether the behavior resulted in successful compromise; it only indicates potentially suspicious usage of hh.exe.

  ---

  ### Investigation Steps

  - **Examine Process Creation Logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of hh.exe execution. Focus on the `CommandLine` field to identify suspicious external URLs. Malicious examples would often demonstrate links to untrusted domains.

  - **Review Command Line Parameters:** Analyze the `CommandLine` field for the presence of "http://", "https://", or "\\\\" in conjunction with hh.exe. Legitimate hh.exe uses typically do not involve external links or unc paths.

  - **Validate File Downloads:** Search for completed downloads of .chm files in the user's profile or download directories (e.g., %UserProfile%\Downloads). Inspect file creation timestamps and parent processes for anomalies, indicating if they correspond to the time of hh.exe execution.

  - **Correlate with Network Logs:** Look for outbound connections to any identified domains associated with the hh.exe execution. Use network telemetry, such as firewall logs or proxy logs, to determine if the downloaded file was communicated to an external host.

  - **Check for Active Threat Intelligence:** Cross-reference any identified external URLs against known threat intelligence databases or indicators of compromise (IoCs) to assess if the domain has been flagged for malicious activity.

  - **Identify Host Role:** Note the role of the host executing hh.exe. High-value assets, such as domain controllers or sensitive data servers, demand elevated scrutiny in case of detection to mitigate potential impact.

  ---

  ### Prioritization

  This alert should be treated as high severity, given the potential impact of a compromised host and the likelihood of exploitation using techniques associated with remote code execution. Remote file execution is commonly weaponized, and hh.exe is often overlooked, leading to increased risks within the environment.

  ---

  ### Blind Spots and Assumptions

  Detection may yield false positives stemming from administrative activities involving legitimate help files. It relies on accurate process creation logging and may miss obfuscated command lines or arguments commonly used in evasion tactics. Monitor for related detections, such as unusual network traffic associated with the downloaded files or other execution indicators like PowerShell activity (T1059.001), which may connect to similar exploit chains.

