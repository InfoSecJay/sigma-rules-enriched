detection:
  selection_img:
  - OriginalFileName: 'HH.exe'
  - Image|endswith: '\hh.exe'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - '\\\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets the execution or download of remote Compiled HTML Help (.chm) files using the `hh.exe` executable on Windows systems. The rule is particularly relevant in the context of potential attacks where threat actors leverage this functionality to execute malicious code or deliver payloads, effectively turning the legitimate usage of `hh.exe` into a vector for exploitation. The presence of remote URLs in the command line parameters indicates possible misuse, as attackers often use these tactics to retrieve and execute payloads without direct user consent.

  The primary objective of an attacker utilizing this method is likely to execute malware on the target system or exfiltrate sensitive data. This behavior falls under the MITRE ATT&CK framework's Tactic of **Defense Evasion**, specifically Technique **T1218.001: Signed Binary Proxy Execution - HH.EXE**. By employing `hh.exe`, an attacker can download and run potentially harmful files while masquerading as a legitimate Windows process.

  Relevant telemetry sources include **process creation events**, which will capture the invocation of `hh.exe`, and command line logs that reveal the presence of suspicious remote URLs. These data sources are crucial for analyzing behaviors associated with this detection.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs to identify instances of `hh.exe` being invoked, paying particular attention to timestamps and the parent process for context.
  - **Analyze Command Line Arguments:** Inspect command line logs for any occurrences of `hh.exe` that include remote URLs. Look for unsanctioned or uncommon domain names that do not align with business operations.
  - **Correlate with Network Traffic:** Check network logs to identify outbound connections initiated by the endpoint running `hh.exe`. Investigate any connections to suspicious or unexpected IP addresses associated with known malicious domains.
  - **Determine User Context:** Assess the account under which `hh.exe` was executed. Investigate if the user had authorization to perform such actions, and explore any potential lateral movement or privilege escalation indicators.

  ### Prioritization
  The severity of the alert is high due to the potential impact of remote execution of malicious content in an enterprise environment, where an attacker could deploy malware, potentially leading to data breaches or system compromise. Given the increasing sophistication of cyber threats, the likelihood of encountering such attack vectors is non-negligible.

  ### Blind Spots and Assumptions
  There are several gaps to consider with this detection logic. It primarily detects the invocation of `hh.exe` with specific remote URLs and may not catch all forms of misuse if attackers utilize different file types or corresponding execution methods. Assumptions include that all instances of `hh.exe` with external references are malicious, which may not always hold true in all environments. Required logs include detailed command line arguments and process creation details; without a robust logging policy ensuring these events are captured, the detection may produce a high false positive rate or miss genuine threats entirely.

