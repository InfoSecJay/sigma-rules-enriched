note: |
  ### Technical Context

  This Sigma rule detects the execution or download of remote CHM files via `hh.exe`, which is a Windows Help Executable. The primary objective of an attacker utilizing this behavior is likely to exploit the CHM file format for delivering malware, as it can contain embedded scripts and potentially lead to code execution. This behavior can be categorized under the MITRE ATT&CK technique T1218.001, specifically the use of "System Services" for Executable File Download. The primary telemetry source for this detection is the process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, capturing details related to executed processes and their command lines.

  If malicious, the impact can be severe, leading to unauthorized access or execution of further malicious payloads. It is important to understand that this detection does not, on its own, confirm that a system has been compromised; legitimate usage of `hh.exe` could also trigger the alert.

  ### Investigation Steps

  - **Inspect command line details:** Locate Security Event ID 4688 or Sysmon Event ID 1 logs where `hh.exe` was executed. Review the CommandLine field for any references to remote URLs (e.g., `http://`, `https://`, `\\\\`).

  - **Verify process hierarchy:** Check the parent process of `hh.exe` by examining the ParentProcessId field in Event ID 4688 or Sysmon Event ID 1. Legitimate processes typically invoke `hh.exe` from trusted applications (e.g., `explorer.exe`).

  - **Identify unusual source paths:** If `hh.exe` is invoked from an uncommon directory (e.g., not from `%System32%` or `%Windows%`), note this as a malicious indicator requiring further investigation.

  - **Check for file downloads:** Review any associated file downloads or creations triggered by `hh.exe` by examining Windows Event ID 4663 for file access attempts, particularly regarding CHM files. Investigate if any CHM files were downloaded from external sources.

  - **Determine potential network activity:** Analyze network logs (e.g., proxy logs or firewall logs) to see if connections to known malicious domains or unusual external IPs correspond with the time of `hh.exe` execution.

  - **Consult threat intelligence feeds:** Cross-reference any command line arguments or domains observed in logs against threat intelligence databases to identify any known  indicators of compromise (IoCs) related to malicious activities using CHM files.

  ### Prioritization

  This alert is classified as high severity due to the potential for severe security breaches. The likelihood of malicious exploitation is high, particularly as this technique has been weaponized in several sophisticated attack campaigns. The involvement of `hh.exe` in remote execution paths raises significant concern for endpoint compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain configurations in telemetry collection, such as not capturing command line arguments or process parent-child relationships. Common legitimate activities include system administrators using `hh.exe` for viewing help files from internal or trusted sources. Companion detections for broader coverage include monitoring for unusual network requests in proxy or network logs to filter out noise from standard help file usage while enhancing tracking for malicious exploitation attempts.

