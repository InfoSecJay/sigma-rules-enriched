note: |
  ### Technical Context

  This Sigma rule detects the execution of the `net.exe` or `net1.exe` commands, specifically when they are used to access network sessions or shared resources. The likely attacker objective is to discover active network connections or shares to further enumerate the environment for potentially exploitable resources. This activity maps to MITRE ATT&CK tactic: Discovery, technique: Network Service Scanning (T1049).

  Primary telemetry sources include Windows Process Creation logs with Event ID 4688 and potentially Sysmon Event ID 1 for process creation details. If malicious, it may indicate an attacker probing for further lateral movement opportunities or reconnaissance on network services. Importantly, this detection does NOT confirm compromise on its own; legitimate administrative tasks may trigger this alert.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 for `net.exe` or `net1.exe` execution events on the affected host. Look for suspicious parent processes that might indicate malicious execution (e.g., PowerShell or cmd.exe).

  - **Analyze Command Line Arguments**: Inspect the CommandLine field in Sysmon Event ID 1 for parameters like `use` or `sessions`. Malicious indicators include unexpected command usage from non-administrative user accounts.

  - **Cross-Reference User Context**: Identify the user account that executed the command. Legitimate administrators often run such commands, while non-admin users executing `net.exe` may indicate unauthorized access.

  - **Evaluate Recent Network Shares and Sessions**: Investigate access logs for network shares involved in the command execution. Look for anomalies, like access attempts to uncommon shares or from unusual hosts.

  - **Identify Historical Execution Patterns**: Check for previous executions of `net.exe` or `net1.exe` on the same host. A sudden increase in usage or usage after hours may suggest malicious activity.

  ---

  ### Prioritization

  This alert should be prioritized as low severity unless additional contextual information elevates the risk. The impact is contingent on the system's role; a domain controller or file server being probed carries higher risk than a standard user workstation. While the method is known in various attack campaigns for reconnaissance, it could also stem from legitimate administrative activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging for process execution is not enabled, particularly older systems or those with inadequate security posture. False positives can arise from legitimate administrative usage during maintenance tasks. Additional detection methods, such as monitoring for SMB enumeration across the network or leveraging logs from network intrusion detection systems, can bolster detection capabilities.

