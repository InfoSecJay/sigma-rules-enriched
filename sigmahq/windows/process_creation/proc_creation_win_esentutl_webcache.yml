note: |
  ### Technical Context

  This rule detects the execution of `esentutl.exe` with specific command-line arguments indicative of information theft, particularly the extraction of browser data from Internet Explorer and Microsoft Edge, associated with the Qbot malware. The primary attacker objective is to collect sensitive information such as stored web credentials and session data. This behavior falls under the MITRE ATT&CK tactic "Collection" (TA0009) and technique "Data from Information Repositories" (T1005). The primary telemetry sources are Windows process creation logs, specifically Event ID 4688, which capture the execution of malicious processes, alongside command line details.

  If successfully executed, the malicious impact is significant, as it can lead to credential theft and further compromise of user accounts. The detection does NOT confirm that the malicious activity has taken place; it merely indicates that `esentutl.exe` was invoked in a manner commonly associated with data exfiltration attempts.

  ### Investigation Steps

  - **Verify process execution details:** Review Security Event ID 4688 for processes created with `esentutl.exe`. Filter logs to ensure the original file path matches `C:\Windows\System32\esentutl.exe` and check for the presence of a command line containing `-r` and `\Windows\WebCache` to indicate possible malicious intent.

  - **Check for unusual process parentage:** Investigate parent processes of `esentutl.exe` by examining Event ID 4688 or Sysmon Event ID 1. Legitimate operations usually originate from trusted applications; look for expected parent processes like `explorer.exe` or scheduled tasks.

  - **Look for concurrent suspicious activity:** Cross-reference any detected instances of `esentutl.exe` with additional log sources, such as Windows Event ID 4663 (Access Attempt) to identify if there were attempts to access sensitive files or registry keys around the same timeframe, indicative of an active data theft execution.

  - **Assess affected asset criticality:** Determine if the affected machine is a domain controller, administrator workstation, or user desktop. Higher criticality devices require immediate attention due to their potential access to broader organizational data.

  - **Identify high-confidence malicious indicators:** Focus on command-line parameters typically associated with Qbot and similar malware, such as flags indicating read or write operations (`-r`) with `WebCache`. The presence of `\Windows\WebCache` indicates attempts to extract potentially sensitive user data.

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive user data and the likelihood of exploitation methods commonly employed by Qbot. The behavior described can lead to compromised accounts and identity theft, making rapid investigation essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs from systems unable to monitor process creation or if `esentutl.exe` is used legitimately during normal operational tasks, leading to false positives. Organizations must ensure logging for Windows process creation is enabled across all endpoints for effective coverage. Related detections could include monitoring for other associated malware behaviors, such as unusual `powershell.exe` executions or unexpected outbound network traffic, which can strengthen overall security posture and context around alerts.

