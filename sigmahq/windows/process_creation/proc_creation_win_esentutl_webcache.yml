note: |
  ### Technical Context
  This rule detects the use of the Windows utility `esentutl.exe` when it is executed with parameters indicative of data extraction attempts, specifically targeting browser-related artifacts from Internet Explorer and Microsoft Edge. The Qbot malware utilizes this method to extract sensitive information stored in web browsers, pointing to a threat scenario where an attacker seeks to steal user credentials, cookies, and other sensitive browser data for further exploitation. The primary objectives of the attacker are often credential theft and reconnaissance prior to deploying further malicious activity within a compromised environment.

  Relevant MITRE ATT&CK tactics and techniques include **Collection (TA0009)** and **Data from Local System (T1005)**. The detection logic is tailored to capture instances where `esentutl.exe` is invoked with specific command-line flags that suggest nefarious usage rather than legitimate administrative activities. The primary data sources for this detection are **process creation events**, which can provide detailed insights into command-line arguments and the context of execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for executions of `esentutl.exe`, focusing on the command-line arguments to identify unusual patterns or parameters consistent with data-exfiltration attempts.
  - **Analyze Web Cache Directories**: Investigate the WebCache directory and its contents for any recent modifications or accesses correlating with the time of `esentutl.exe` execution, particularly looking for unauthorized data extraction.
  - **Correlate with User Activity**: Look for suspicious user activity around the time of the detection, such as logins from unfamiliar locations or abnormal browser usage patterns that could indicate compromised accounts.
  - **Cross-Check Event Logs**: Validate against other event logs, such as security or application logs, to identify any preceding events that may indicate exploitation or lateral movement within the network.

  ### Prioritization
  Given the potential impact of credential theft and the likelihood of subsequent attacks, this alert is classified with medium severity. Qbot's ability to gain sensitive information can lead to further compromises, making prompt investigation crucial.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by legitimate uses of `esentutl.exe`, which can lead to false positives during regular administrative tasks. The detection logic assumes that `esentutl.exe` invoked with the specified parameters is a strong indicator of malicious activity. Required logs for this alert to function effectively include comprehensive process creation events that capture command-line arguments and the context of executed binaries across endpoints.

