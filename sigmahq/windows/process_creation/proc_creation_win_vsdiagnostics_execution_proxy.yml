title: Potential Binary Proxy Execution Via VSDiagnostics.EXE
id: ac1c92b4-ac81-405a-9978-4604d78cc47e
status: test
description: Detects execution of "VSDiagnostics.exe" with the "start" command 
  in order to launch and proxy arbitrary binaries.
references:
- https://twitter.com/0xBoku/status/1679200664013135872
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-03
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\VSDiagnostics.exe'
  - OriginalFileName: 'VSDiagnostics.exe'
  selection_cli_start:
    CommandLine|contains: 'start'
  selection_cli_launch:
    CommandLine|contains:
    - ' /launch:'
    - ' -launch:'
  condition: all of selection_*
falsepositives:
- Legitimate usage for tracing and diagnostics purposes
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `VSDiagnostics.exe` with a command line that includes the `start` command, which is often misused by adversaries to proxy arbitrary binaries. The likely attacker objective is to bypass application whitelisting measures to run malicious payloads on the host with elevated privileges or control. This behavior aligns with the MITRE ATT&CK technique for "User Execution" (T1203) and "Execution through Command-Line Interface" (T1059).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing process creation events. If malicious, the impact can lead to unauthorized system access or data compromise. However, it is important to note that this detection does not confirm malicious intent by itself; legitimate tracing and diagnostic activities can trigger similar behaviors.

  ### Investigation Steps

  - **Check process execution history:** Review Security Event ID 4688 and Sysmon Event ID 1 for `VSDiagnostics.exe` and confirm the command line contains `start` and `launch:` arguments. Look for unusual user accounts initiating the process.

  - **Correlate with additional telemetry:** Investigate surrounding events of this process creation, especially any followed by suspicious network activity. Use relevant logs such as Windows Firewall or proxy logs to check outbound connections made shortly thereafter.

  - **Identify legitimate usage patterns:** Review normal operational practices for `VSDiagnostics.exe`, which may be used for legitimate tracing and diagnostics by development teams. Note any authorized users or processes initiating it without interactive session context.

  - **Review parent processes:** Analyze the parent process for the executed `VSDiagnostics.exe`. Malicious executions are often spawned from other uncommon and suspicious processes, typically absent in benign scenarios. Check Event ID 4688 for parent process details and user context.

  - **Assess command line arguments:** Validate the arguments provided to `VSDiagnostics.exe`. Legitimate use cases will likely lack the `/launch:` or `-launch:` qualifiers that are typically associated with potentially harmful intentions.

  - **Check for binary drop locations:** If an unusual payload was executed, check the file system for any binaries that were dropped or executed through `VSDiagnostics.exe`. Examine for artifacts indicating exfiltration or execution from transient directories.

  ### Prioritization

  The severity of this alert is medium due to the potential for exploitation on critical systems, especially if the affected asset holds sensitive data or operational capabilities. The likelihood of malicious abuse is elevated as attackers frequently leverage similar techniques for evasion. This behavior has been commonly weaponized in various attacks, demanding timely investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include running `VSDiagnostics.exe` from trusted location paths to avoid detection or mimicking legitimate usage patterns. Reliable detection depends on the availability of comprehensive process creation logs, specifically from Sysmon or Windows Event Logs. Legitimate activities leveraging `VSDiagnostics.exe` for troubleshooting may trigger this alert, thus creating noise without context. A companion detection to consider is observing abnormalities in execution patterns around legitimate software used in the organization, helping to contextualize and validate findings.

