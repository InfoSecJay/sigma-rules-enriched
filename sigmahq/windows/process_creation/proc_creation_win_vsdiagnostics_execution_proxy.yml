title: Potential Binary Proxy Execution Via VSDiagnostics.EXE
id: ac1c92b4-ac81-405a-9978-4604d78cc47e
status: test
description: Detects execution of "VSDiagnostics.exe" with the "start" command in
  order to launch and proxy arbitrary binaries.
references:
- https://twitter.com/0xBoku/status/1679200664013135872
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-03
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\VSDiagnostics.exe'
  - OriginalFileName: 'VSDiagnostics.exe'
  selection_cli_start:
    CommandLine|contains: 'start'
  selection_cli_launch:
    CommandLine|contains:
    - ' /launch:'
    - ' -launch:'
  condition: all of selection_*
falsepositives:
- Legitimate usage for tracing and diagnostics purposes
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious activity involving the execution of `VSDiagnostics.exe` with the `start` command, which an attacker might leverage to proxy arbitrary binaries on a Windows system. The rule is pertinent in scenarios where attackers seek to execute malicious payloads while masquerading their activities under legitimate processes. By utilizing `VSDiagnostics.exe`, which is often associated with diagnostics and telemetry functions, attackers can obscure their intentions, thereby evading detection mechanisms.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1203)**, where adversaries try to bypass defenses through the execution of potentially modified or legitimate binaries to achieve their objectives without raising suspicion. The primary intent is to execute commands or scripts that enable further exploitation or data exfiltration while utilizing a trusted executable.

  The best sources for telemetry that provide evidence for this detection include Windows process creation events, which log command-line arguments and process execution details. This data can help identify unusual usage patterns associated with `VSDiagnostics.exe` invocation which deviate from normal operational practices.

  ### Investigation Steps
  - **Review Process Creation Logs:**: Collect and analyze process creation events to identify instances where `VSDiagnostics.exe` was executed with command-line arguments that include `start`. Look for patterns or anomalies that could indicate misuse.

  - **Inspect Command-Line Arguments:**: Pay close attention to the full command-line of the process execution to detect any unusual parameters (e.g., `/launch:` or `-launch:`) that may be indicative of a malicious action.

  - **Cross-reference Executable Path:**: Check if the execution of `VSDiagnostics.exe` originated from a legitimate directory or if it was launched from a potentially suspicious or unusual path, which may suggest tampering or abuse.

  - **Audit User Context:**: Identify the user context under which `VSDiagnostics.exe` was launched. Analyze whether this execution corresponds with normal user behavior or suggests an elevated privilege scenario that appears out of place.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of arbitrary proxy execution, which may lead to further system compromise or data exfiltration. Though the likelihood of legitimate usage exists, the ability for this executable to be co-opted by malicious actors necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The detection may not cover all instances of `VSDiagnostics.exe` usage, particularly if attackers attempt to obfuscate their actions using legitimate pathways or renamed versions of the executable. There is an assumption that telemetry data from process creation events is adequately logged and retained in the environment. Log configurations must ensure comprehensive capturing of command-line arguments and process origins for effective detection of this rule to function correctly.

