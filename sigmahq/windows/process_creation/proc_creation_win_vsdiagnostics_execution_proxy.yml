title: Potential Binary Proxy Execution Via VSDiagnostics.EXE
id: ac1c92b4-ac81-405a-9978-4604d78cc47e
status: test
description: Detects execution of "VSDiagnostics.exe" with the "start" command 
  in order to launch and proxy arbitrary binaries.
references:
- https://twitter.com/0xBoku/status/1679200664013135872
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-03
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\VSDiagnostics.exe'
  - OriginalFileName: 'VSDiagnostics.exe'
  selection_cli_start:
    CommandLine|contains: 'start'
  selection_cli_launch:
    CommandLine|contains:
    - ' /launch:'
    - ' -launch:'
  condition: all of selection_*
falsepositives:
- Legitimate usage for tracing and diagnostics purposes
level: medium
note: |
  ### Technical Context

  This rule detects the execution of VSDiagnostics.exe using the "start" command with parameters that may be used to launch and proxy arbitrary binaries. The likely attacker objective is to leverage a legitimate system tool to execute malicious code without raising immediate suspicion. This activity fits the MITRE ATT&CK tactic of Defense Evasion (T1218), specifically the technique of Signed Binary Proxy Execution (T1218.010).

  The primary telemetry sources include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1, capturing command lines and image paths. If malicious, successful exploitation may lead to unauthorized access, payload execution, or lateral movement within the network. Importantly, this detection does NOT confirm malicious activity on its own, as VSDiagnostics.exe can be legitimately used for diagnostic purposes.

  ### Investigation Steps

  - **Confirm log data availability**: Verify that Windows Security Event ID 4688 and Sysmon Event ID 1 logs are enabled and accessible for the system in question, focusing on command line fields for analysis.

  - **Analyze command line arguments**: Inspect the command line associated with the VSDiagnostics.exe execution. Look for the presence of 'start' and arguments like '/launch:' or '-launch:', which would indicate potential malicious intent. Legitimate instances generally lack these specific commands or include arguments focused on diagnostics.

  - **Check parent process lineage**: Investigate the parent process of VSDiagnostics.exe to identify its origin. A command prompt or PowerShell instance (Event IDs 4688/4689) calling VSDiagnostics.exe is more suspicious than a legitimate parent process.

  - **Review system behavior**: Assess the system for any newly created processes or files immediately following the execution of VSDiagnostics.exe. Look for unexpected binaries with recent creation timestamps that may correlate with the execution.

  - **Examine file integrity**: Validate the integrity of VSDiagnostics.exe by checking its hash against known valid signatures. An altered binary could indicate malicious tampering.

  ### Prioritization

  This alert is of medium severity, particularly in environments where VSDiagnostics.exe is not an expected tool for day-to-day operations. The likelihood of malicious abuse is moderate, given its potential use in proxying attacks. While this behavior is known and can be weaponized, context matters greatly and should be analyzed accordingly based on the system's role.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where attackers employ different executable names or where VSDiagnostics.exe is invoked through other means, like alternate command parameters. Reliable detection requires Sysmon being configured to capture rich process creation events. Additionally, legitimate administrative activities could trigger this alert when using VSDiagnostics.exe for tracing or diagnostics. Complementary detections for process injection practices would strengthen coverage against this type of behavior.

