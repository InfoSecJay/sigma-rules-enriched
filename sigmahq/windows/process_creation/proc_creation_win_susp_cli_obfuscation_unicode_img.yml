logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    OriginalFileName:
    - 'Cmd.EXE'
    - 'cscript.exe'
    - 'PowerShell.EXE'
    - 'PowerShell_ISE.EXE'
    - 'pwsh.dll'
    - 'wscript.exe'
  selection_special_chars:
    CommandLine|contains:
            # spacing modifier letters that get auto-replaced
    - 'ˣ'         # 0x02E3
    - '˪'         # 0x02EA
    - 'ˢ'         # 0x02E2
            # Forward slash alternatives
    - '∕'         # 0x22FF
    - '⁄'         # 0x206F
            # Hyphen alternatives
    - '―'         # 0x2015
    - '—'         # 0x2014
            # Whitespace that don't work as path separator
    - ' '         # 0x00A0
            # Other
    - '¯'
    - '®'
    - '¶'
            # Unicode whitespace characters
    - '⠀'         # Braille Pattern Blank (Unicode: U+2800)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential command-line obfuscation through the use of Unicode characters, which attackers often employ to make malicious commands less recognizable or harder to analyze. The ability to conceal command-line inputs is utilized to evade detection by security monitoring tools, especially when the underlying executable (e.g., `cmd.exe`, `powershell.exe`) is commonly employed in both legitimate administrative tasks and malicious operations. These tactics enable adversaries to execute their operations surreptitiously, achieving their objectives of data exfiltration, system compromise, or lateral movement.

  The rule is associated with the MITRE ATT&CK technique **T1027: Obfuscated Files or Information**, which encompasses a range of methods adversaries use to conceal their activities. Obfuscation techniques commonly combine different Unicode representations, effectively disguising malicious commands from standard detection methods. The primary data sources relevant for this rule are the Windows process creation logs, which detail command-line executions, and event logs that track executed processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the Windows process creation logs for entries indicating the usage of command-line tools like `cmd.exe`, `powershell.exe`, or other related executables. Look for any associated suspicious or unexpected command-line arguments.
  - **Analyze Command Line Inputs:** Focus on the command-line inputs for the presence of special Unicode characters that may indicate obfuscation, such as the specified spacing modifiers and alternative characters listed in the detection logic.
  - **Evaluate Context of Execution:** Determine the context of the executed command, including the user account associated with it and the parent process. Identify whether the command was issued from an unusual user account or from a non-standard context, which could suggest malicious behavior.
  - **Correlate with Other Alerts:** Check for other relevant alerts or logs that could provide additional context, such as network communication patterns, file changes, or authentication events, to establish whether the suspected command relates to broader attack activities.

  ### Prioritization
  This alert carries a high severity due to the potential impact of command-line obfuscation on system integrity and data confidentiality. The likelihood of such activities leading to successful exploitation or data breaches within an enterprise environment is significant, warranting immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in the ability of attackers to use alternative methods of obfuscation that may not be captured by this rule, such as utilizing non-Unicode means or sophisticated encoding techniques. The detection logic assumes that relevant process creation logs are intact and accessible, which may not always be the case. Furthermore, proper logging configurations must be in place, including command-line data collection, for this alert to function effectively.

