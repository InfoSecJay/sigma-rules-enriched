logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    OriginalFileName:
    - 'Cmd.EXE'
    - 'cscript.exe'
    - 'PowerShell.EXE'
    - 'PowerShell_ISE.EXE'
    - 'pwsh.dll'
    - 'wscript.exe'
  selection_special_chars:
    CommandLine|contains:
            # spacing modifier letters that get auto-replaced
    - 'ˣ'         # 0x02E3
    - '˪'         # 0x02EA
    - 'ˢ'         # 0x02E2
            # Forward slash alternatives
    - '∕'         # 0x22FF
    - '⁄'         # 0x206F
            # Hyphen alternatives
    - '―'         # 0x2015
    - '—'         # 0x2014
            # Whitespace that don't work as path separator
    - ' '         # 0x00A0
            # Other
    - '¯'
    - '®'
    - '¶'
            # Unicode whitespace characters
    - '⠀'         # Braille Pattern Blank (Unicode: U+2800)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies command line obfuscation practices utilizing Unicode characters within scripts or executables, particularly those related to common Windows scripting environments (e.g., `cmd.exe`, `PowerShell`). The likely objective of the attacker is to evade detection and make the command line difficult to analyze, potentially hiding malicious activity such as file downloads, command insertion, or lateral movement. The relevant MITRE ATT&CK techniques include T1027 (Obfuscation), which focuses on methods adversaries use to conceal their intentions and payloads during execution.

  Primary telemetry sources required for this detection include Windows process creation logs (such as Security Event ID 4688 and Sysmon Event ID 1) that capture command line activities. If malicious, this behavior could enable an attacker to execute harmful commands or scripts unnoticed. However, this detection alone does not confirm that the command is executed with malicious intent, as legitimate scripts may also utilize obfuscation for various reasons.

  ### Investigation Steps

  - **Identify Process Creation Events**: Review Windows Process Creation logs (e.g., Event ID 4688 and Sysmon Event ID 1) for instances where `cmd.exe`, `powershell.exe`, `cscript.exe`, or similar executables have been invoked using non-standard Unicode characters in the CommandLine field. Analyze the full command line for obfuscation techniques.

  - **Cross-Check Executable Paths**: Validate the `Image` field within the process creation logs to ensure that the executable paths correspond to legitimate installations on the system. Look for any unusual locations that could indicate a potential application compromise.

  - **Review User Context**: Analyze the user context under which the commands were executed, focusing on identifying anomalous accounts or those with excessive privileges launching these processes. Legitimate administrative actions are expected to originate from well-known administrative accounts.

  - **Evaluate CommandLine Arguments**: Look for high-confidence malicious indicators within the CommandLine that may suggest harmful activity, such as the use of encoded commands, downloads, or other suspicious activities linked to the detected Unicode characters.

  - **Compare Against Baseline Behavior**: Compare identified instances to baseline command line usage within your environment. Established legitimate scripts may include similar obfuscation techniques, which helps in contextualizing the anomalies.

  - **Investigate Related Alerts**: Review correlated alerts from similar detection rules, particularly those on command line behavior or lateral movement techniques (e.g., Misuse of PowerShell or C# scripts executing commands), to gather additional context and confirm or rule out malicious intent.

  ### Prioritization

  This alert is classified as high severity due to the potential for significant impact if an attacker exploits the obfuscation methods to execute unauthorized commands. Given the likelihood of abuse during targeted attack scenarios, this behavior can commonly indicate a breach attempt or subsequent activities, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate applications may utilize obfuscation for benign purposes, which could lead to false positives. Comprehensive Windows process creation logs must be enabled to reliably detect these obfuscation techniques. Additionally, routine administrative tasks may trigger this alert, particularly if scripts use Unicode for automation. A related detection that enhances coverage is monitoring for unusual PowerShell activity (e.g., T1059.001 - PowerShell), which could provide further insights into adversarial behavior linked to obfuscation techniques.

