logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    OriginalFileName:
    - 'Cmd.EXE'
    - 'cscript.exe'
    - 'PowerShell.EXE'
    - 'PowerShell_ISE.EXE'
    - 'pwsh.dll'
    - 'wscript.exe'
  selection_special_chars:
    CommandLine|contains:
            # spacing modifier letters that get auto-replaced
    - 'ˣ'         # 0x02E3
    - '˪'         # 0x02EA
    - 'ˢ'         # 0x02E2
            # Forward slash alternatives
    - '∕'         # 0x22FF
    - '⁄'         # 0x206F
            # Hyphen alternatives
    - '―'         # 0x2015
    - '—'         # 0x2014
            # Whitespace that don't work as path separator
    - ' '         # 0x00A0
            # Other
    - '¯'
    - '®'
    - '¶'
            # Unicode whitespace characters
    - '⠀'         # Braille Pattern Blank (Unicode: U+2800)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential command-line obfuscation through the use of Unicode characters in executing processes. The primary behavior being targeted involves attackers employing alternate representations of characters to disguise command-line arguments aiming to evade detection or analysis. The likely attacker objective may include the execution of malicious scripts or commands, such as downloading payloads or executing other malicious tools, leveraging common scripting hosts like PowerShell or CMD.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0011), and the technique is **Command-Line Obfuscation** (T1027). The primary telemetry sources include Windows Process Creation logs, specifically focusing on Event ID 4688 or Sysmon Event ID 1 to capture process execution details. If malicious, this behavior can lead to successful execution of harmful payloads, potentially compromising the system or sensitive data. It should be noted that this detection does NOT confirm malicious intent on its own, as legitimate scripts may also utilize complex command lines.

  ### Investigation Steps

  - **Review the command-line arguments:** Identify instances where `CommandLine` contains suspicious Unicode characters (refer to the detection fields). Scan for signs of common administrative tasks versus obfuscated commands, as legitimate commands rarely include Unicode representations.

  - **Check for execution context:** Use Event ID 4688 or Sysmon Event ID 1 to review the creation of the process. Confirm the parent process and execution context, ensuring it originated from legitimate sources (e.g., legitimate scripts or scheduled tasks vs. suspicious execution).

  - **Correlate with known malicious patterns:** Search for indicators from threat intelligence feeds that involve the use of similar obfuscation techniques, focusing on known malicious Unicode character use in PowerShell or command-line contexts.

  - **Verify recent changes in environment:** Investigate any recent changes to the system or user accounts (via Event ID 4660 or 4675) that may correlate with the obfuscated commands, ensuring there's no lie in the timeline that suggests a coordinated attack effort.

  - **Identify potential benign obfuscation:** Document legitimate use cases where similar command-line obfuscation might occur, such as in system maintenance scripts or administrative tasks, to differentiate from malicious activities.

  - **Monitor for file creation or alteration indicators:** Check the system for unusual files related to the execution of these commands, using tools like File System Auditing (Event ID 4663) to ensure no unauthorized files were created or modified as part of this obfuscation attempt.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the affected system and the likelihood that command-line obfuscation indicates attempts by adversaries to hide malicious activity. The behavior is commonly weaponized in sophisticated attacks, making it critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques where attackers manipulate commands without using detectable Unicode characters. Reliable detection requires comprehensive logging configuration, including Sysmon and security event logging for process creations. Additionally, benign activities like certain development processes or administrative scripts may trigger this alert. A companion detection, such as monitoring for connections from PowerShell scripts (Tactic: Remote Services), can strengthen coverage of potential attack scenarios.

