logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_ext:
    ParentCommandLine|contains:
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  selection_parent_path_1:
    ParentCommandLine|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\'
    - '\Temporary Internet'
  selection_parent_path_2:
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  selection_cli:
  - Image|endswith: '\PingCastle.exe'
  - OriginalFileName: PingCastle.exe
  - Product: 'Ping Castle'
  - CommandLine|contains:
    - '--scanner aclcheck'
    - '--scanner antivirus'
    - '--scanner computerversion'
    - '--scanner foreignusers'
    - '--scanner laps_bitlocker'
    - '--scanner localadmin'
    - '--scanner nullsession'
    - '--scanner nullsession-trust'
    - '--scanner oxidbindings'
    - '--scanner remote'
    - '--scanner share'
    - '--scanner smb'
    - '--scanner smb3querynetwork'
    - '--scanner spooler'
    - '--scanner startup'
    - '--scanner zerologon'
  - CommandLine|contains: '--no-enum-limit'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--level Full'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--server '
  condition: 1 of selection_parent_* and selection_parent_ext and selection_cli
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PingCastle, an Active Directory security assessment tool, initiated from a suspicious parent process or directory. Likely attacker objectives include reconnaissance and enumeration of Active Directory environments for vulnerabilities. This behavior fits within the MITRE ATT&CK framework under the tactic of **Reconnaissance** (TA0043) and the technique of **Network Service Scanning** (T1595).

  The primary telemetry sources for this rule are Windows process creation logs, specifically focusing on Event ID 4688 which captures process creation events in the security logs. If malicious, this behavior could lead to sensitive information disclosure or exploitation of Active Directory vulnerabilities. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also invoke PingCastle.

  ### Investigation Steps

  - **Check parent process attributes:** Review the parent process of the detected PingCastle execution using Event ID 4688. Look for any parent processes originating from suspicious directories like `C:\Temp\` or `C:\Users\Public\`. Malicious indicators include processes such as PowerShell or batch scripts that initiate PingCastle.

  - **Validate command line arguments:** Examine the command line parameters passed to PingCastle through the `CommandLine` field in the logs. Suspicious flags such as `--scanner nullsession` or `--scanner zerologon` are high-confidence indicators of malicious activity, while typical administrative scans may not use these options.

  - **Correlate user activity:** Determine the user account that initiated the PingCastle execution. Cross-reference against legitimate operational roles. Unexpected usage by non-administrative accounts or users from unusual locations may indicate compromised credentials.

  - **Review execution context:** Analyze if PingCastle is executed on critical assets, such as Domain Controllers. High-risk endpoints should draw more scrutiny, as unauthorized reconnaissance of these systems can lead to severe security issues.

  - **Assess legitimate scheduling patterns:** Look for legitimate occurrences of PingCastle in the environment, which may include regular assessments by IT staff. Confirm file creation timestamps and know if they align with expected schedules for security assessments.

  - **Identify related malicious activity:** Cross-reference with other detection rules or logs (e.g., unexpected WinRM, RDP access, or lateral movement attempts) that may suggest a broader attack context. Complementary alerts related to AD enumeration tools can help establish a fuller picture of an ongoing attack.

  ### Prioritization

  The alert is of **high severity** due to the critical nature of Active Directory environments. Unauthorized reconnaissance can facilitate subsequent attacks, including privilege escalation or lateral movement. Given that tools like PingCastle are frequently exploited in post-compromise scenarios, the likelihood of malicious intent is significantly elevated.

  ### Blind Spots and Assumptions

  Existing detection capabilities may be limited by infrequent logging of process creation events or misconfigured telemetry settings. Additionally, legitimate administrative actions could trigger this alert, leading to potential false positives, especially during lifecycle events such as audits or system health checks. Monitoring for related detection methods, such as those focused on unauthorized PowerShell activities (e.g., TTPs related to script execution), can strengthen overall coverage against such reconnaissance behaviors.

