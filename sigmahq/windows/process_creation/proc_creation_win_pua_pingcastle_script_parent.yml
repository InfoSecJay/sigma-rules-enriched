logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_ext:
    ParentCommandLine|contains:
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  selection_parent_path_1:
    ParentCommandLine|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\'
    - '\Temporary Internet'
  selection_parent_path_2:
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  selection_cli:
  - Image|endswith: '\PingCastle.exe'
  - OriginalFileName: PingCastle.exe
  - Product: 'Ping Castle'
  - CommandLine|contains:
    - '--scanner aclcheck'
    - '--scanner antivirus'
    - '--scanner computerversion'
    - '--scanner foreignusers'
    - '--scanner laps_bitlocker'
    - '--scanner localadmin'
    - '--scanner nullsession'
    - '--scanner nullsession-trust'
    - '--scanner oxidbindings'
    - '--scanner remote'
    - '--scanner share'
    - '--scanner smb'
    - '--scanner smb3querynetwork'
    - '--scanner spooler'
    - '--scanner startup'
    - '--scanner zerologon'
  - CommandLine|contains: '--no-enum-limit'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--level Full'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--server '
  condition: 1 of selection_parent_* and selection_parent_ext and selection_cli
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of PingCastle, a security assessment tool focused on analyzing the security posture of Active Directory environments. The detection is triggered when PingCastle is executed from a potentially suspicious parent process, which could suggest an attacker is attempting to assess an organization's environment for vulnerabilities or misconfigurations. Attackers may use such reconnaissance tools to gather critical information about the network before executing further malicious activities, such as lateral movement or privilege escalation.

  The relevant MITRE ATT&CK tactics for this detection include **Reconnaissance** (TA0043) and **Gathering Information** (T1595). By leveraging PingCastle, attackers can perform scans to identify active directory security risks, unauthorized accounts, and baseline configurations. The primary data sources that provide evidence for these detections are **process creation events**, which log command-line execution and parent-child process relationships that may reveal unusual execution patterns or paths.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review process creation logs for instances of `PingCastle.exe` and identify any unusual parent process paths or commands associated with its execution.
  - **Review Parent Command Lines:** Check the command lines of the parent processes that executed PingCastle for patterns suggesting execution from unusual locations, such as temporary folders or rarely accessed user directories.
  - **Correlate with Active Directory Activity:** If PingCastle execution is detected, correlate it with LDAP queries or active directory changes to identify any unauthorized enumeration or access attempts associated with the scan.
  - **Assess Network Traffic:** Monitor for outbound or lateral movement attempts from the system executing PingCastle to uncover any subsequent malicious activity after its execution, particularly targeting sensitive system resources.

  ### Prioritization
  The severity of this alert is considered high due to its potential impact; the use of PingCastle can signify a planned reconnaissance effort by an attacker aiming to exploit Active Directory vulnerabilities, increasing the likelihood of successful breaches if not addressed swiftly.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding the use of legitimate administrative tools or scripts that could execute similar commands without triggering alerts. The detection logic assumes that the execution of PingCastle from these suspicious paths or parents is abnormal in the organization's environment. Required logs for effective detection include comprehensive process creation logs and accurate configurations of parent-child process relationships to ensure this alert functions optimally.

