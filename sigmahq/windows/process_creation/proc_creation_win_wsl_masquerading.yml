title: Suspicious WSL Binary Masquerading
id: 530576ee-3b62-4bce-9a03-9aac6c61788a
status: experimental
description: |
  Detects execution of masqueraded wsl.exe binary.
  Attackers can rename a malicious payload to wsl.exe to masquerade as the legitimate Windows Subsystem for Linux binary,
  bypassing detection based on image name alone and abusing user trust in the WSL process name.
references:
- https://cardinalops.com/blog/bash-and-switch-hijacking-via-windows-subsystem-for-linux/
- https://blog.qualys.com/vulnerabilities-threat-research/2022/04/20/implications-of-windows-subsystem-for-linux-for-adversaries-defenders-part-2
- https://www.bleepingcomputer.com/news/security/new-malware-uses-windows-subsystem-for-linux-for-stealthy-attacks/
- https://thehackernews.com/2021/09/new-malware-targets-windows-subsystem.html
- https://learn.microsoft.com/en-us/windows/wsl/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-05-05
tags:
- attack.stealth
- attack.t1036.005
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wsl.exe'
  filter_main_legit_original:
    OriginalFileName: 'wsl.exe'
  filter_main_null:
    OriginalFileName:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_wsl_masquerading/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of a potentially compromised version of the Windows Subsystem for Linux (WSL) binary, specifically when a malicious payload is renamed to `wsl.exe`. Attackers may leverage this technique to obfuscate their actions by using a legitimate process name, effectively bypassing basic detection mechanisms that rely solely on file names. The likely attacker objective is to execute harmful commands or scripts under the guise of WSL, facilitating stealthy operations.

  Relevant MITRE ATT&CK tactics and techniques include: **Tactic: Defense Evasion** (ID: TA0005), **Technique: Masquerading** (ID: T1036.005), and **Technique: Execution through WSL** (ID: T1218). The primary telemetry sources required for this detection are process creation logs (Windows Event ID 4688 or Sysmon Event ID 1). If this detection is confirmed as malicious, there is a high risk of data exfiltration, backdoor installation, or further lateral movement within the network. It is important to note that this detection does NOT confirm malicious activity on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Check process creation details: ** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the command line used when executing the `wsl.exe` process. Look for suspicious parameters or commands that could indicate malicious intent.

  - **Analyze OriginalFileName field: ** Review the `OriginalFileName` field in the logs. Legitimate instances should consistently show `wsl.exe`. If this field is null or shows a different name, it may indicate a masquerading attempt.

  - **Review parent process relationships: ** Investigate the parent processes of the detected `wsl.exe` execution. Malicious executions may be spawned by unexpected or unusual parent processes, such as a script host or a remote access tool.

  - **Identify legitimate usage patterns: ** Confirm known legitimate use cases of WSL within your environment. If a user typically executes Linux commands via WSL, correlate the timing and context of the detection with their activities to rule out false positives.

  - **Check for high-risk indicators: ** Identify file paths associated with the execution of `wsl.exe`. Any execution from uncommon or unexpected directories (e.g., temporary folders or user profile directories) raises a high-confidence malicious indicator warranting immediate investigation.

  - **Look for related malicious artifacts: ** Search for other indicators of compromise related to WSL activity, such as unexpected changes to Linux distros or installation logs. Regularly review relevant Sysmon Event IDs that may show related malicious actions.

  ### Prioritization

  The alert severity is high within an enterprise context due to the potential impact on sensitive systems if malicious. The likelihood of exploitation is significant, as adversaries increasingly exploit WSL for stealthy operations and lateral movement. Given the rise in reported WSL-based attacks, this behavior is highly weaponized.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications renaming themselves to `wsl.exe`, which can bypass this rule without additional context. Required log sources must be correctly configured, including Sysmon for detailed process creation logging. Legitimate activity may occur from automated Docker or Linux commands executed via WSL. A related detection that could strengthen coverage is monitoring for anomalous file modifications or command executions within WSL environments, providing a broader view of suspicious behavior.

