title: Potential Configuration And Service Reconnaissance Via Reg.EXE
id: 970007b7-ce32-49d0-a4a4-fbef016950bd
status: test
description: Detects the usage of "reg.exe" in order to query reconnaissance 
  information from the registry. Adversaries may interact with the Windows 
  registry to gather information about credentials, the system, configuration, 
  and installed software.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2023-02-05
tags:
- attack.discovery
- attack.t1012
- attack.t1007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_flag:
    CommandLine|contains: 'query'
  selection_key:
    CommandLine|contains:
    - 'currentVersion\windows'
    - 'winlogon\'
    - 'currentVersion\shellServiceObjectDelayLoad'
    - 'currentVersion\run'         # Also covers the strings "RunOnce", "RunOnceEx" and "runServicesOnce"
    - 'currentVersion\policies\explorer\run'
    - 'currentcontrolset\services'
  condition: all of selection_*
falsepositives:
- Discord
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `reg.exe` for querying specific registry keys, which can indicate reconnaissance activities by adversaries looking to gather information about system configurations, installed software, or credential storage. The likely attacker objective is to collect intelligence that can be used for lateral movement or privilege escalation within the environment. This behavior fits into the MITRE ATT&CK framework under the tactic of "Discovery" and specifically technique T1012 (Query Registry).

  The primary telemetry sources for this detection are Windows process creation logs, particularly focusing on logs that capture command line arguments and executed images. If malicious in nature, this activity could lead to discovering sensitive configurations or credentials, potentially allowing further exploitation. Importantly, this detection does NOT confirm malicious intent solely on its own, as legitimate use of `reg.exe` can occur during administrative tasks.

  ### Investigation Steps

  - **Check process creation logs:** Investigate Windows Security Event ID 4688 for instances where `reg.exe` was executed. Look for command line parameters containing ‘query’ and registry paths indicative of reconnaissance activities.

  - **Review command line details:** Pay particular attention to command line arguments in the logs. Legitimate entries typically include queries for general configurations unrelated to sensitive data, whereas malicious queries often target paths like `currentVersion\policies\explorer\run`.

  - **Assess user context:** Identify which user account executed the `reg.exe` command. Legitimate administrative accounts may use this utility for valid purposes; accounts with lower privileges executing such commands could indicate suspicious behavior.

  - **Look for repeated patterns:** Determine if there are multiple executions of `reg.exe` within a short timeframe. Frequent execution, especially against sensitive registry paths like `currentControlSet\Services`, could indicate automated or scripted reconnaissance.

  - **Cross-reference system logs:** Validate against other logs such as Sysmon Event ID 1 to correlate the parent process of `reg.exe`. Malicious usage may appear with a suspicious parent process or script, while legitimate usage might originate from a known administrative tool.

  ### Prioritization

  This alert is of medium severity. An attack using registry enumeration could leverage discovered information for later exploitation, particularly on sensitive or critical systems. However, the likelihood of abuse depends on the user’s context and the specific registry keys targeted, as not all access to the registry indicates malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by situations where logging for process creation is not adequately configured or where `reg.exe` execution is obscured by other processes. Legitimate activities, such as system administration, can also trigger this alert, especially by users performing standard tasks on system configurations. A related detection, such as monitoring for command execution in conjunction with PowerShell, could provide a broader view of potential malicious activities surrounding registry exploration.

