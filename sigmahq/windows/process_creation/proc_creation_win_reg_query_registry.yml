title: Potential Configuration And Service Reconnaissance Via Reg.EXE
id: 970007b7-ce32-49d0-a4a4-fbef016950bd
status: test
description: Detects the usage of "reg.exe" in order to query reconnaissance information
  from the registry. Adversaries may interact with the Windows registry to gather
  information about credentials, the system, configuration, and installed software.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2023-02-05
tags:
- attack.discovery
- attack.t1012
- attack.t1007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_flag:
    CommandLine|contains: 'query'
  selection_key:
    CommandLine|contains:
    - 'currentVersion\windows'
    - 'winlogon\'
    - 'currentVersion\shellServiceObjectDelayLoad'
    - 'currentVersion\run'         # Also covers the strings "RunOnce", "RunOnceEx" and "runServicesOnce"
    - 'currentVersion\policies\explorer\run'
    - 'currentcontrolset\services'
  condition: all of selection_*
falsepositives:
- Discord
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of `reg.exe` to query critical information from the Windows registry. Attackers often leverage registry access to gather reconnaissance data about system configurations, installed software, and stored credentials. By querying specific registry keys, they aim to discover valuable information that may assist in further attacks, such as privilege escalation or lateral movement within the network.

  The relevant MITRE ATT&CK techniques for this activity include:
  - **T1012: Query Registry** - The technique where attackers gather information from the system's registry to identify configurable settings and other pertinent data.
  - **T1007: System Service Discovery** - This involves discovering services that are running on a system, which can also be achieved through registry queries.

  The primary data sources for monitoring this behavior include process creation events that log the execution of processes (in this case, `reg.exe`), along with command-line arguments provided during execution. These logs are critical as they capture the context around how `reg.exe` is being used and which specific registry keys are being queried.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for the execution of `reg.exe`, specifically focusing on the command-line arguments used. Look for commands indicating queries against sensitive registry keys.

  - **Analyze Command-Line Arguments:** Investigate the command line provided with `reg.exe`. Key phrases such as "query" along with references to `currentVersion\`, `winlogon\`, and `run` can signify intent to gather critical system information.

  - **Correlate with User Activities:** Check if the execution of `reg.exe` correlates with any unusual user behavior or during times when the user normally would not conduct administrative tasks, especially if the user does not hold administrative privileges.

  - **Check for Related Alerts:** If alerts for other related activities exist, such as unusual service enumeration or privilege escalation attempts, investigate these in conjunction with `reg.exe` activities to build a broader understanding of the potential threat.

  ### Prioritization
  This alert is of medium severity within an enterprise environment as it indicates potential reconnaissance activity that could precede a more significant attack. While usage of `reg.exe` is not directly malicious, particularly when used in conjunction with sensitive system queries, it is an indicator of potential preparatory efforts by an attacker.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate applications or services utilizing `reg.exe` for standard operations, which could generate false positives. This rule assumes that `reg.exe` is not typically utilized in the normal workflow by most users, especially without administrative privileges. It also depends on the accurate logging of process creation and command-line arguments; if logging is incomplete or misconfigured, certain activity may go undetected.

