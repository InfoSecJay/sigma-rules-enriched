title: Potential Configuration And Service Reconnaissance Via Reg.EXE
id: 970007b7-ce32-49d0-a4a4-fbef016950bd
status: test
description: Detects the usage of "reg.exe" in order to query reconnaissance 
  information from the registry. Adversaries may interact with the Windows 
  registry to gather information about credentials, the system, configuration, 
  and installed software.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2026-10-19
tags:
- attack.discovery
- attack.t1012
- attack.t1007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_flag:
    CommandLine|contains: ' query '
  selection_key:
    CommandLine|contains:
    - 'currentVersion\windows'
    - 'winlogon\'
    - 'currentVersion\shellServiceObjectDelayLoad'
    - 'currentVersion\run'         # Also covers the strings "RunOnce", "RunOnceEx" and "runServicesOnce"
    - 'currentVersion\policies\explorer\run'
    - 'currentcontrolset\services'
  filter_optional_yammer:
    ParentImage|endswith: '\Yammer.exe'
    CommandLine: 'C:\Windows\system32\reg.exe QUERY HKCU\Software\Microsoft\Windows\CurrentVersion\Run
      /v Yammer'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Discord
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of `reg.exe` to query specific registry keys often targeted by adversaries for reconnaissance purposes. The behavior indicates an effort to extract sensitive configuration information from the Windows registry, which could include details about installed software, user account settings, or other system configurations. The likely attacker objective is to gather data for further exploitation or lateral movement within a network.

  This rule relates to the MITRE ATT&CK tactic for Discovery (ID: TA-0007) and the technique for System Information Discovery (ID: T1012). The primary telemetry source is process creation logs, specifically targeting Event ID 4688 for Windows. If this behavior is malicious, it could lead to credential theft or unauthorized system configuration changes. However, the execution of `reg.exe` alone does not confirm malicious activity—it must be evaluated in conjunction with other context and indicators.

  ### Investigation Steps

  - **Check process details for `reg.exe`:** Review Security Event ID 4688 logs for instances of `reg.exe` and gather details such as the Process ID and User context. Look for unusual execution contexts (e.g., from non-standard user accounts or processes) which may indicate malicious intent.

  - **Examine the CommandLine arguments:** Analyze the CommandLine field in Event ID 4688 for `reg.exe` executions. Focus on queries that target sensitive registry paths such as `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`. Legitimate usage often applies to administrative tasks or troubleshooting, while suspicious queries may pertain to credential-related keys.

  - **Identify high-confidence malicious indicators:** Look for specific strings in the CommandLine that indicate reconnaissance, such as `query currentVersion\windows`, or `query winlogon\`. The presence of specific arguments targeting known attack vectors can signal malicious actions.

  - **Assess parent process relationships:** Examine the ParentImage field in Event ID 4688 for unusual parent-child relationships. Most benign `reg.exe` executions do not originate from non-system processes or services. Anomalous parents like `Yammer.exe` in conjunction with the detected commands can indicate likely evasion techniques.

  - **Review targeted registry keys:** For any identified instances of `reg.exe`, validate the registry keys accessed by cross-referencing with normal operational behavior. The legitimate usage will typically involve queries for configuration information without targeting user-specific keys that may signal malicious reconnaissance.

  - **Correlate with user activity logs:** Cross-reference findings with user activity or process logs to understand if the execution of `reg.exe` correlates with other potentially suspicious activities, such as failed login attempts or access to sensitive resources.

  ### Prioritization

  This alert carries medium severity; its impact depends on the criticality of the affected system and the potential for credential or configuration exposure. The likelihood of malicious abuse is moderate, as attackers frequently exploit registry queries to facilitate reconnaissance, making this behavior a common tactic.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities using `reg.exe` for configuration management, potentially generating false positives. Comprehensive logging for process creation and registry access is essential for effective detection. Common behavior that may trigger this alert includes routine system checks or software installations. To enhance coverage, consider companion detections for suspicious PowerShell commands or abnormal process chains that could indicate advanced persistence threats.

