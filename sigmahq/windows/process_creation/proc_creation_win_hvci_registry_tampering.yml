note: |
  ### Technical Context
  This detection rule monitors for attempts to tamper with Hypervisor-protected Code Integrity (HVCI) registry settings using command-line tools, specifically `reg.exe`. HVCI is designed to utilize virtualization-based security to ensure that only trusted code runs in kernel mode, effectively safeguarding against unauthorized alterations that could allow malicious drivers or code to execute. Attackers may seek to disable or alter HVCI settings to facilitate the execution of unauthorized or unsigned drivers, which can lead to privilege escalation, persistence on victim machines, and evasion of traditional security controls.

  The rule has affiliations with the MITRE ATT&CK framework, particularly under the tactic of Defense Evasion and the technique T1562.001, which focuses on "Disable or Modify Tools." By modifying HVCI settings, adversaries could go undetected while executing malicious operations or maintaining persistent access within an environment. The primary data source for this detection is process creation events on Windows platforms, which include command-line activity that can reveal potentially malicious attempts to alter critical security settings.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the logs for any processes, especially `powershell.exe`, `pwsh.exe`, or `reg.exe`, that include command lines indicative of modifying HVCI registry settings.
  - **Analyze Command-Line Arguments**: Focus on command-line arguments or parameters that contain keywords like `EnableVirtualizationBasedSecurity`, `HypervisorEnforcedCodeIntegrity`, or general registry manipulation commands such as `add`, `New-ItemProperty`, or `Set-ItemProperty`.
  - **Check for Anomalous Activity**: Investigate any recent changes or pattern deviations in the execution of tools and scripts that interact with HVCI settings, especially if these changes coincide with other signs of potential compromise.
  - **Correlate with User Activity**: Determine if the actions were initiated by authorized administrative users, and assess whether such actions match legitimate maintenance tasks or if they signal potential malicious insider activity.

  ### Prioritization
  This alert holds high severity in an enterprise environment due to its potential impact on system integrity and the likelihood of exploitation. Tampering with security mechanisms like HVCI can lead to significant breaches, making early detection crucial for preventing more extensive damage.

  ### Blind Spots and Assumptions
  One gap in detection coverage might be legitimate administrative actions that require modifying HVCI for troubleshooting, which could result in false positives. The detection logic assumes proper logging of command-line arguments and process creation on Windows systems; any misconfiguration or lack of logging could hinder effective monitoring. It's crucial that process creation logging is enabled and properly configured to ensure the alert functions as intended.

