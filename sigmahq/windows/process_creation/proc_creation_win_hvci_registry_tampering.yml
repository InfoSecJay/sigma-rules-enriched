note: |
  ### Technical Context

  This rule detects attempts to tamper with Hypervisor-Protected Code Integrity (HVCI) registry settings using command line tools such as `reg.exe` and PowerShell. The behavior indicates an attempt by an attacker to modify critical security settings, potentially allowing the loading of unsigned drivers for privilege escalation, persistence, or evasion of security mechanisms. This detection aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.001 (Impair Defenses).

  The primary telemetry source includes process creation logs from Windows, notably Security Event ID 4688, and Sysmon Event ID 1, which will capture the execution of suspicious commands targeting HVCI registry keys. If the detected activity is malicious, it could undermine system integrity, exposing the environment to further compromise. However, this detection alone does not confirm that the actions were executed with malicious intent, as they may occur during legitimate troubleshooting or maintenance activities.

  ### Investigation Steps

  - **Review command line arguments:** Evaluate the `CommandLine` field in Security Event ID 4688 or Sysmon Event ID 1 logs for keywords like 'EnableVirtualizationBasedSecurity' or 'HypervisorEnforcedCodeIntegrity'. Presence of these commands in association with `reg.exe` indicates potential malicious activity.

  - **Identify recent administrative changes:** Check for legitimate administrative tasks performed prior to the alert. Cross-reference with the Windows Event Logs for Event ID 4616 (System Time Changed) or Event ID 4634 (An account was logged off) for expected activities that align with routine system updates or adjustments.

  - **Correlate process parent-child relationships:** Investigate the process creation chain by examining Sysmon Event ID 1 logs. Look for `reg.exe` or PowerShell instances spawned from recent user-initiated activities. Benign relationships often originate from authorized scripting or local admin actions rather than escalated or unexpected sources.

  - **Check system integrity states:** Review the `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\DeviceGuard` registry path. If legitimate administrative actions were performed, the registry values should reflect expected configurations of HVCI settings instead of unexpected changes that would suggest a breach.

  - **Assess log configurations for completeness:** Ensure that critical logging settings are enabled to capture all necessary registry modifications. Validate Windows Audit Policy settings for registry access events (Audit Registry) to strengthen detection capabilities.

  - **Validate HVCI operational status:** Query the state of HVCI by checking the `Get-WindowsFeature -Name DeviceGuard` PowerShell command output. If HVCI is operational but registry changes were recent, further investigation may be warranted to ascertain the legitimacy of those changes.

  ### Prioritization

  Given the potential impact on system integrity and the likelihood of these behaviors being exploited by adversaries targeting kernel drivers, this alert should be regarded as high priority. The common use of similar tactics by attackers to disable security features makes immediate investigation crucial to maintain protection against further exploits.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for comprehensive logging; if Windows auditing isn't configured adequately, malicious tampering may remain undetected. Some legitimate activities, like troubleshooting driver issues, may inadvertently trigger alerts, which can complicate triage. Related detections such as monitoring for `CreateFile` access to critical registry paths associated with HVCI—using Sysmon logs—can enhance overall coverage and insight into potential threats.

