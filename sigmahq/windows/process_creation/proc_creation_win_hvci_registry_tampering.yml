note: |
  ---

  ### Technical Context

  This rule detects the tampering of Hypervisor-protected Code Integrity (HVCI) settings via command line tools such as reg.exe. The primary objective of an attacker triggering this behavior is to alter system settings to allow the execution of malicious or unsigned drivers, potentially leading to privilege escalation, persistence, or evasion of security measures. The relevant MITRE ATT&CK techniques for this detection are Defense Evasion (T1562.001).

  Primary telemetry sources include process creation events from Windows Security Event ID 4688. Specifically, the command lines involving registry modifications targeting HVCI settings should be analyzed. If malicious, this tampering can compromise system integrity, allowing unauthorized code execution at the kernel level. This detection does NOT confirm malicious intent on its own; legitimate administrative actions may produce similar command lines.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688. Focus on processes like reg.exe, PowerShell, or pwsh.exe that are linked to HVCI-related command line modifications.

  - **Analyze command line arguments**: Look for specific commands that include 'add', 'New-ItemProperty', 'Set-ItemProperty', or 'si' alongside paths like '\DeviceGuard'. Malicious entries may target keys such as 'EnableVirtualizationBasedSecurity' or 'HypervisorEnforcedCodeIntegrity'.

  - **Confirm legitimate behavior**: Determine if legitimate system administration tasks justify the command line modifications. Note the context around any administrative actions, especially those pertaining to troubleshooting driver issues that necessitate disabling HVCI.

  - **Identify high-confidence malicious indicators**: Flag instances where the command line execution modifies critical HVCI-related registry keys without corresponding legitimate justification, particularly any unapproved changes made outside of standard operating procedures.

  - **Correlate with endpoint telemetry**: Validate if additional artifacts indicate exploitation, such as abnormal kernel driver loading attempts. Look for abnormal spikes in event types correlating to system calls linked with feared privileges.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on system integrity when crucial security settings like HVCI are tampered with. The likelihood of malicious abuse is significant, as altering these settings is commonly leveraged by adversaries to deploy unsigned drivers which can facilitate further compromises. This type of behavior is notably weaponized in sophisticated attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative tasks to generate similar alerts, which may lead to false positives. Reliable detection requires complete logging of command line inputs and registry modifications; any disabled logging configurations may hinder coverage. Legitimate software installation and troubleshooting may trigger this alert due to their need to adjust HVCI settings. A related detection to strengthen coverage is the monitoring of kernel driver changes, which can provide context around the tampering alerts.

