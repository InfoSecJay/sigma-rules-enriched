detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli:
    CommandLine|contains:
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
  selection_cli_base:
    CommandLine|contains: '\DeviceGuard'
  selection_cli_key:
    CommandLine|contains:
    - 'EnableVirtualizationBasedSecurity'
    - 'HypervisorEnforcedCodeIntegrity'
  condition: all of selection_*
falsepositives:
