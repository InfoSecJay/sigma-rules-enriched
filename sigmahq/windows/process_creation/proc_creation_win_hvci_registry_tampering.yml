note: |
  ### Technical Context

  This rule detects attempts to tamper with Hypervisor-protected Code Integrity (HVCI) registry settings using command-line tools like reg.exe and PowerShell. The likely objective of the attacker is to disable HVCI, facilitating the loading of malicious or unsigned code, which could lead to privilege escalation or evading security controls. This behavior maps to the MITRE ATT&CK techniques of Defense Evasion (T1562.001 - Disable or Modify Security Tools) and Defense Impairment (T1685 - Manipulate Security Tools).

  The primary telemetry source for this alert is Windows process creation logs, specifically Event ID 4688, detailing command-line activity that modifies registry entries related to HVCI. A successful tamper would compromise the integrity of kernel mode operations, leading to potential exploitation. Importantly, this detection does NOT confirm malicious activity on its own; legitimate system administration operations may also trigger this alert.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation logs:** Review for execution of reg.exe or PowerShell commands with command lines containing "add", "New-ItemProperty", "Set-ItemProperty", or their aliases.

  - **Review specific command line patterns:** Look for keywords tied to HVCI such as 'EnableVirtualizationBasedSecurity' and 'HypervisorEnforcedCodeIntegrity' in the command-line arguments of the detected process.

  - **Identify benign administrative activity:** Legitimate changes often occur during troubleshooting and should come from trusted administrative accounts. Check the user context executing the command; expected roles include domain admins or system administrators in service accounts.

  - **Correlate with sensitive registry path:** Monitor the registry under HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System and verify if the tampering corresponds with unscheduled administrative tasks or alerts from an endpoint management solution.

  - **Establish a malicious indicator:** Any command lines modifying HVCI settings without an appropriate business justification or outside of established maintenance windows should be flagged as high-confidence malicious behavior.

  - **Check for additional Windows Event Log channels:** Look for related anomalies in Security Event ID 4732 (Member added to a group), which may indicate lateral movement or privilege escalation attempts following the registry tampering.

  ### Prioritization

  This alert should be considered high priority due to the potential impact of tampering with HVCI settings, as compromising this security feature can allow malware to execute at kernel level, greatly increasing the adversary's control over the affected system. The likelihood of such behavior being weaponized is high, given its association with privilege escalation.

  ### Blind Spots and Assumptions

  Detection may fail if logging is incomplete or if tools that mask the command-line output are used (e.g., obfuscation tools). Reliable detection requires proper configuration of Windows Auditing Policies to capture all command-line arguments. Legitimate activities that could trigger this alert include troubleshooting by IT staff. A related detection to strengthen coverage is monitoring for unusual driver installations or modifications (Event ID 2003).

