note: |
  ### Technical Context

  This rule detects the invocation of `rundll32.exe` with command line parameters indicative of inline VBScript execution, specifically using terms like 'Execute', 'RegRead', and 'window.close'. These behaviors are often associated with fileless malware techniques, where an attacker aims to run scripts or commands directly from memory to avoid detection. The probable attacker objective is to perform actions such as data exfiltration or system compromise while evading traditional defenses.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Tactic: **Execution**
  - Technique: **Command-line interface** (T1059)

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation and Sysmon Event ID 1 for detailed process activity. If this activity is associated with a malicious actor, it may result in unauthorized access or data loss. Importantly, this detection does NOT prove that malicious activity occurred; it merely flags suspicious command-line usage that warrants further investigation.

  ### Investigation Steps

  - **Review command line arguments for context:** Investigate the exact command line used during process creation (Event ID 4688 or Sysmon Event ID 1). Look for benign usages of `rundll32.exe` such as legitimate Windows services or administrative tasks.

  - **Check parent process relationships:** Identify the parent process of the `rundll32.exe` execution (Event ID 4688 or Sysmon Event ID 1). Legitimate parent processes typically belong to known Windows applications, while suspicious parent processes may include other toolsets known for exploitation.

  - **Analyze timestamps and historical context:** Examine the activity log for a timeline of events prior to and following the alert (Sysmon events, Windows Event Logs). Correlate with other logs to see if suspicious activity clusters around this invocation.

  - **Verify system integrity:** Check for known indicators of compromise on the host (e.g., presence of unusual scripts, newly created or modified registry keys related to VBScript, especially in critical areas like `HKEY_CURRENT_USER\Software`). Malicious indicators may include the creation of persistence mechanisms or unexpected script execution.

  - **Identify network behavior:** Review outbound network connections established by the process (Windows Firewall logs or Sysmon network events). Malicious activity may include attempts to communicate with known C2 (Command and Control) servers or unusual destinations not commonly accessed by the host.

  ### Prioritization

  This alert should be prioritized as high due to the potential impact on sensitive systems and data loss. The likelihood of adversarial exploitation using this technique is moderately high, as it has been identified in real-world attacks, making it a critical item for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of obfuscation or encryption techniques in script execution, and attackers can modify command line parameters to evade detection. Consistent logging of Sysmon along with proper retention of Windows Event Logs is necessary for reliable detection of these malicious activities. Legitimate administrative tasks may trigger the alert, particularly when employing scripts in their operation. Complementary detections could include monitoring for unusual registry modifications or execution of scripts from common exploitation tools.

