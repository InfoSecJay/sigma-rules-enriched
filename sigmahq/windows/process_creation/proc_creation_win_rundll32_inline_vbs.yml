note: |
  ### Technical Context
  This detection rule identifies suspicious activities involving the `rundll32.exe` process, specifically monitoring for command line arguments that include references to inline VBScript. This tactic is associated with the UNC2452 threat actor group, which has demonstrated a range of advanced techniques to evade security detections and execute malicious payloads on compromised systems. The use of `rundll32` to execute scripts allows attackers to control execution flow and bypass traditional security measures.

  The likely attacker objectives include maintaining persistence, executing payloads, and evading detection while performing reconnaissance or lateral movement within a network. This behavior falls under several MITRE ATT&CK tactics and techniques, notably:
  - **Execution** (TA0002), specifically the technique **Command and Scripting Interpreter** (T1059)
  - **Privilege Escalation** (TA0004), as exploits could lead to elevated privileges
  - **Defense Evasion** (TA0005), using legitimate system tools to avoid detection

  Primary data sources for detecting these activities include process creation events that capture command line arguments and details about the execution context.

  ### Investigation Steps
  - **Collect Command Line Logs:** Analyze process creation events that log command line arguments, particularly focusing on instances where `rundll32.exe` is executed with parameters like 'Execute' and 'RegRead'.

  - **Review Incident Timeline:** Examine the timeline of events leading up to the execution of `rundll32.exe` to identify any preceding indicators of compromise or unusual activities that may indicate a larger attack pattern.

  - **Correlate with User Activity:** Assess the user accounts under which these processes ran to determine if they map to typical usage patterns or show signs of unauthorized access or privilege escalation attempts.

  - **Identify Related Network Activity:** Investigate the network for any suspicious communication patterns or outbound connections that coincide with the timing of `rundll32.exe` executions to link potential external command and control interactions.

  ### Prioritization
  The alert is classified as high severity due to the significant risk of privilege escalation and the potential for data compromise or exfiltration. Given the advanced nature of UNC2452’s operations, rapid identification and response are crucial to mitigating any further impact on the enterprise environment.

  ### Blind Spots and Assumptions
  Current detection logic may not account for legitimate uses of `rundll32.exe` in automated or administrative tasks, potentially leading to false positives. The effectiveness of this detection assumes sufficient logging of process creation events with detailed command line arguments is configured. Additionally, any evasion techniques employed by attackers, such as script obfuscation or using alternative execution methods, could bypass this detection. If `rundll32.exe` is not adequately monitored, critical events may be missed entirely.

