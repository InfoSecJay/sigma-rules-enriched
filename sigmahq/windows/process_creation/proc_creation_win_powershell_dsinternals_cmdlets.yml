note: |
  ---

  ### Technical Context

  This rule detects the execution of suspicious commands associated with the DSInternals PowerShell module, which exposes functionality for managing and manipulating Active Directory data. Adversaries may utilize these cmdlets to extract sensitive information, such as DPAPI backup keys, or to manipulate critical files like NTDS.DIT for privilege escalation and credential theft. This behavior aligns with the MITRE ATT&CK technique T1059.001, which involves the execution of scripts, specifically PowerShell.

  The primary telemetry source is the Windows process creation logs, capturing relevant activity via Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it poses a high risk as it may allow attackers to access password hashes and other sensitive information, potentially leading to a full compromise of AD credentials. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative use of the DSInternals module is also common.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for command lines containing DSInternals cmdlets, focusing on suspicious terms like `Get-ADDBBackupKey` or `Save-DPAPIBlob`. Malicious indicators include unusual use of these cmdlets outside of standard administration hours or from non-admin accounts.

  - **Validate user permissions:** Determine if the user executing the command has legitimate administrative privileges. Use Windows Event ID 4672 (Special privileges assigned to new logon) to verify if the account has high-level access.

  - **Examine related process activity:** Look for parent-child process relationships in process logs. Focus on instances where PowerShell was spawned by suspicious processes, such as `rundll32.exe` or `cmd.exe`, as this could indicate malicious use.

  - **Identify legitimate usage patterns:** Recognize typical administrative tasks involving DSInternals, such as scheduled audits or regular backups by domain administrators. These activities should occur during regular maintenance windows and should be documented in change management logs.

  - **Check for credential dumping artifacts:** Look for evidence of password hashes being dumped. Validate log entries related to `Get-NTHashSet` or `Get-SysKey`. Confirm if these actions are accompanied by other suspicious activity like `Invoke-Mimikatz`.

  - **Correlate with account lockout events:** Monitor for multiple account lockouts or password reset attempts associated with the user account that executed the suspicious command. Use Security Event ID 4740 to assess if the account was targeted post-execution.

  ---

  ### Prioritization

  This alert is high severity due to the potential exposure of sensitive Active Directory information and the likelihood of adversaries using these cmdlets to escalate privileges or execute further attacks. The exploitation of such capabilities is a common method for advanced persistent threats (APTs) targeting enterprise environments.

  ---

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrators may use DSInternals for routine tasks, resulting in false positives. Ensure logging for all relevant cmdlets and PowerShell execution policies is properly configured to capture necessary events. There may be benign use cases when security assessments are performed. A companion detection rule for monitoring unexpected PowerShell execution patterns can enhance overall coverage against misuse.

