note: |
  ### Technical Context
  This detection rule identifies the execution of suspicious PowerShell cmdlets from the DSInternals PowerShell module, which can be exploited by malicious actors to conduct various activities inside Active Directory and Azure Active Directory. The DSInternals module provides extensive access to sensitive information, including the ability to extract backup keys for the Data Protection API (DPAPI) or manipulate core Active Directory data files such as NTDS.DIT. Attackers may utilize DSInternals for unauthorized access, credential dumping, and privilege escalation, depending on their goals.

  The associated MITRE ATT&CK tactics and techniques for this detection include:
  - **Execution** (TA0002), specifically through PowerShell scripting (T1059.001).
  - **Credential Access** (TA0006), where attackers may employ techniques such as credential dumping (T1003) and exploitation of trust relationships (T1176).

  The best data sources to look for evidence of this activity are process creation logs that detail command-line arguments, which can reveal suspicious PowerShell invocations indicative of malicious attempts to leverage the capabilities of the DSInternals module.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation events for instances of PowerShell executing commands related to DSInternals. Look for cmdlets specifically included in the detection logic, focusing on both successful and failed executions to assess intent.
  - **Analyze User Context**: Determine whether the user account executing the cmdlets has the necessary permissions to perform such actions. Take note of any accounts that are not typically associated with administrative tasks or those with abnormal usage patterns.
  - **Correlate with Authentication Logs**: Investigate any potentially unusual authentication events around the time the suspicious cmdlets were invoked. Look for evidence of lateral movement or other suspicious account behaviors that coincide with the execution of these commands.
  - **Check Related Artifacts**: Explore relevant artifacts such as Windows Event Logs for security events, including group policy operations, and any related alerts across your security infrastructure that may indicate malicious intent linked to the use of DSInternals.

  ### Prioritization
  This alert is categorized as high severity due to the potential risk associated with unauthorized access to sensitive Active Directory components. Given that attackers may leverage this module for key credential dumping and other critical actions, timely investigation and response are essential to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There may be detection coverage gaps for legitimate administrative use of the DSInternals module, as some IT staff may require access for maintenance or auditing activities. The detection logic assumes that unauthorized users will attempt to access the module's capabilities without prior established permissions or legitimate justification. Additionally, for this alert to function effectively, comprehensive process creation logging must be enabled, ensuring all PowerShell command executions are captured with detailed command-line parameters.

