note: |
  ### Technical Context

  This Sigma rule detects the use of the DSInternals PowerShell module, which includes cmdlets that can manipulate Active Directory (AD) objects and sensitive data. The behavior indicates potential adversarial activities, such as gaining unauthorized access to Active Directory secrets, manipulating password hashes, or dumping sensitive keys. The likely attacker objective aligns with credential theft and domain compromise tactics used in advanced persistent threats.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and technique **Command-Line Interface** (T1059.001). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command-line activity. If malicious, an attacker could exfiltrate credentials or escalate privileges, leading to unauthorized access. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may include these cmdlets.

  ### Investigation Steps

  - **Review the executing process**: Check Security Event ID 4688 for the parent process ID and verify the source of the PowerShell execution. A legitimate process should originate from task scheduler, PowerShell ISE, or an administrative shell.

  - **Analyze command line arguments**: Scrutinize the command-line arguments for suspicious usage of DSInternals cmdlets such as `Get-ADDBBackupKey` or `Set-ADDBAccountPassword`. Malicious use often involves multiple password hash manipulations or credential dumping.

  - **Correlate with user accounts**: Identify if the user executing the command had legitimate privileges or if their activity falls outside typical operational patterns. For example, an account normally used for basic tasks executing a privileged command should be considered suspicious.

  - **Examine logon events**: Review Security Event IDs 4624 (successful logons) and 4625 (failed logons) to determine if the user experienced unusual access patterns prior to executing the cmdlets.

  - **Check for related artifacts**: Evaluate if any unusual files or exports were created during this process, such as suspicious PowerShell transcript logs or DSInternals-generated output files that could indicate exfiltration.

  ### Prioritization

  This alert is of **high** severity due to the sensitive nature of Active Directory manipulation and the high likelihood of malicious abuse associated with the detected cmdlets. The ability of adversaries to use DSInternals for credential theft or privilege escalation makes this behavior a commonly weaponized technique in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative use of DSInternals, which can create false positives. Reliable detection requires appropriate logging configurations, specifically enabling detailed process creation logs. Legitimate activities may trigger alerts, particularly during administrative audits or maintenance tasks using DSInternals. Companion detections that enhance coverage include monitoring for any signs of AD account changes or unusual access patterns.

