note: |
  ### Technical Context

  This Sigma rule detects when the `dnscmd.exe` utility is used to install a ServerLevelPluginDll, which is a potential tactic for executing malicious code in the context of a DNS server. An attacker may aim to manipulate DNS queries or redirect traffic to achieve data exfiltration or further lateral movement within the network. The relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)** and **Persistence (TA0003)**, specifically techniques **T1574.001 (DNS Server Level Plugin DLL Injection)** and **T1112 (Modify Registry)**.

  The primary telemetry sources for this detection are Windows Event Logs related to process creation, particularly focusing on Event ID 4688, which tracks process creation events. If exploited, this behavior can lead to unauthorized access and control of DNS functions, impacting the integrity and availability of DNS services. Importantly, this detection alone does not confirm malicious activity; benign use of dnscmd for legitimate configurations could trigger the rule.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Windows Event ID 4688 for the `dnscmd.exe` process. Look for the exact command line parameters utilized, particularly those including `/config` and `/serverlevelplugindll`. Legitimate entries may involve known administrative activities or script automation.

  - **Investigate Command Line Arguments**: Identify any unusual command line arguments in the detected process. Legitimate admin usage typically includes standard configurations that do not involve loading a new DLL post-installation.

  - **Verify DLL Registry Entries**: Query the Windows Registry for the key location related to ServerLevelPluginDll to confirm what DLL was intended for installation. Look under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DNS\Parameters` to observe if any unauthorized DLLs are listed.

  - **Cross-reference with Other Logs**: Check for related activities in the Security event log (Event ID 5145 for Object Access) to see if any attempts were made to read or modify sensitive areas of the system after this action. Malicious indicators may include repeated access to DNS logs or subsequent unusual traffic patterns.

  - **Network Traffic Analysis**: Monitor DNS traffic for any anomalies following the alert, such as unusual outbound queries or responses, and verify if there is a significant change in DNS request patterns post-installation.

  - **Identify Affected Systems' Role**: Confirm the role of the system where the detection occurred. Critical DNS servers should have stringent access controls, and any unexpected modifications could result in elevated risks.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of DNS services in an enterprise environment. The likelihood of an attacker leveraging this technique to gain persistence or escalate privileges is significant, especially since DNS servers are often targeted in attacks for their foundational role in network operations.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of misconfigurations resulting in false positives, as legitimate administrative tasks might trigger this alert. Adequate logging and monitoring configurations, especially for process creation and registry modifications, are essential for reliable detection. Legitimate activities might include routine DNS server updates or legitimate DNS plugin configurations. A related detection to consider is for unauthorized registry modifications (T1112), which would complement this alert and provide a more comprehensive view of DNS server integrity.

