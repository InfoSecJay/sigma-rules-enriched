note: |
  ### Technical Context

  This Sigma rule detects the installation of a DNS Server Level Plugin DLL via the use of the dnscmd.exe command with specific parameters. The attacker’s likely objective is to gain persistence on the DNS server or achieve code execution with elevated privileges, potentially compromising critical DNS services. This behavior fits into the MITRE ATT&CK framework under the tactics of Privilege Escalation (TA0004) and Defense Evasion (TA0005), specifically techniques T1574.001 (DLL Search Order Hijacking).

  The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which details command-line activity. Malicious activity in this context poses a significant security risk, potentially allowing unauthorized access and manipulation of DNS queries and network traffic. However, this detection does NOT confirm that the plugin is malicious on its own; further investigation is required to assess intent and impact.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for instances where dnscmd.exe is executed. Look specifically for command-line arguments `/config` and `/serverlevelplugindll`. Legitimate installations will often occur during system configuration by authorized administrators.

  - **Verify registry changes:** Inspect the registry for keys related to DNS Server Level Plugin DLL installations. The presence of the `ServerLevelPluginDll` parameter under `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\DNS Server\` should be confirmed, noting any unusual or unauthorized entries.

  - **Correlate with user activity:** Identify the user account that executed the dnscmd command. Verify its legitimacy by correlating it with other actions during the same timestamp, checking if the account has administrative privileges and any recent remote access events.

  - **Validate service disruptions:** Check for unexpected service restarts or disruptions for the DNS service. Query System Event ID 7045 for recent service installation or modifications that may coincide with the detected activity.

  - **Identify known malicious indicators:** Look for signs of known malicious DNS plugins associated with past incidents in your environment, which could include unusual file names or known malicious hashes related to the DLLs involved.

  - **Review logs for companions actions:** Ensure logs are collected from other relevant sources such as Sysmon (Event ID 1 for process creation) and Windows Event Logs that might capture related network traffic, ensuring coverage of the potential attack chain.

  ### Prioritization

  This alert is classified as high severity due to the potential for an attacker to manipulate DNS settings, which can have widespread impacts on network traffic and authentication processes. The likelihood of malicious abuse is high, as this technique can be directly weaponized in targeted attacks against enterprise infrastructure.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the possibility of legitimate administrative actions triggering the alert, particularly if there are multiple authorized users managing DNS configurations. Required log sources include proper configuration of Windows logs and Sysmon for comprehensive visibility. Additionally, be aware that other benign configurations and DNS service updates may trigger similar alerts. Consider monitoring for related detections such as suspicious process injections or unauthorized registry modifications to enhance overall detection capabilities.

