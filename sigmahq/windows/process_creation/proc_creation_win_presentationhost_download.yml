detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - 'ftp://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where the `PresentationHost.exe` process, a legitimate Windows utility, is used to run .xbap (XAML Browser Application) files that can download arbitrary files from external URLs (HTTP, HTTPS, FTP). The likely attacker objective is to leverage this legitimate functionality to download malicious payloads, potentially leading to unauthorized access, data exfiltration, or malware installation. This behavior corresponds to the MITRE ATT&CK techniques for Execution (T1218), specifically using a trusted executable for malicious purposes.

  The primary telemetry sources include Windows process creation events (Event ID 4688) and the associated command line arguments. If detected as malicious, this activity poses a significant security risk as it bypasses traditional security mechanisms by leveraging a trusted application. However, this detection does NOT confirm an attack on its own, as legitimate applications may also use `PresentationHost.exe` for benign purposes, such as accessing legitimate XBAP applications.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 where `Image` ends with `presentationhost.exe`. Check the `CommandLine` field for suspicious URLs (e.g., contains 'http://', 'https://', or 'ftp://') that indicate potential misuse.

  - **Investigate the command line arguments:** Focus on the `CommandLine` field in Event ID 4688 to identify any unusual or obfuscated parameters that can indicate malicious intent. Legitimate use cases typically do not feature external URLs.

  - **Identify download locations:** If external files are downloaded, validate their locations by checking for file creation events associated with `PresentationHost.exe`. Look for any new files in temporary folders or unusual directories that may suggest exfiltration attempts.

  - **Correlate with network logs:** Cross-reference with firewall or proxy logs (e.g., from a SIEM) to observe any corresponding outbound requests to the URLs found in `CommandLine`. Look for known malicious domains or anomalous connections to external resources.

  - **Review user and asset context:** Analyze the user account that initiated the process and the asset's criticality. Determine if the user has legitimate reasons to run `PresentationHost.exe` and validate whether this behavior is typical for their role.

  - **Identify known benign activities:** Document expected behavior for legitimate use of `PresentationHost.exe`, such as internal applications utilizing XBAP for intranet solutions, to provide context against which to measure anomalies.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of arbitrary file downloads on system integrity and security. The likelihood of malicious abuse is heightened, given that this method can effectively evade defenses by using trusted processes. While it may not be a common attack vector, it presents a plausible opportunity for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where `PresentationHost.exe` is commonly used for legitimate business applications, leading to false positives. Required log sources include comprehensive process creation logs and external request telemetry. Legitimate activities, such as authorized downloads of XBAP applications in managed environments, may trigger the alert. A relevant companion detection is tracking suspicious outbound requests to identify potential download targets further enhancing coverage against exfiltration methods.

