detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - 'ftp://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `PresentationHost.exe` utility, specifically when it is used to access and potentially download files from the internet via the command line arguments that include HTTP, HTTPS, or FTP protocols. The likely attacker objective is to leverage this legitimate Windows component to download payloads or tools, exploiting the trust associated with native Windows processes to avoid detection. This behavior corresponds to the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry sources required for this detection are Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this activity can lead to unauthorized code execution and potential compromise of the affected system. It is crucial to note that this detection alone does not confirm malicious intent; it simply identifies potentially suspicious use of a trusted process.

  ### Investigation Steps

  - **Check the command line arguments:** Review Event ID 4688 for `PresentationHost.exe` where the `CommandLine` field contains `http://`, `https://`, or `ftp://`. Malicious indicators include the presence of suspicious domains or URLs that do not match known safe repositories.

  - **Validate the originating process:** Look for the parent process associated with `PresentationHost.exe` in Sysmon Event ID 1. A typical benign scenario might involve a user-triggered operation from a recognized application, while an unexpected parent such as a command shell or scripting engine may indicate nefarious activity.

  - **Examine process creation logs:** Cross-reference against Event ID 4688 to analyse timestamps and user context. Accounts with elevated privileges executing `PresentationHost.exe` in this manner increase the likelihood of compromise.

  - **Identify recent downloads:** Investigate file creation or modification timestamps in the user’s download directory or temporary folders. Look for recently downloaded files immediately following the execution of `PresentationHost.exe` that could be linked to malicious activity.

  - **Assess asset criticality:** Evaluate the role of the affected system; if it is a critical server, malicious use of `PresentationHost.exe` can indicate a serious breach, warranting immediate escalation to incident response.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems and the likelihood of exploitation through trusted Windows processes. Although this behavior is not the most common attack vector, it is weaponized by adversaries seeking to bypass standard security measures.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by execution obfuscation techniques such as command-line obfuscation or network connection redirection. Ensure that Windows process creation logging via group policy is enabled and that Sysmon is appropriately configured for reliable detection. Legitimate actions, such as automated updates or scripted operations by maintenance tools, can trigger this alert. A related detection like monitoring for unusual outbound connections (e.g., DNS queries to known malicious domains) can enhance coverage against such techniques.

