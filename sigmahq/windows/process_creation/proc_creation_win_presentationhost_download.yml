title: Arbitrary File Download Via PresentationHost.EXE
id: b124ddf4-778d-418e-907f-6dd3fc0d31cd
status: test
description: Detects usage of "PresentationHost" which is a utility that runs ".xbap"
  (Browser Applications) files to download arbitrary files
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/239/files
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - 'ftp://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activities involving the `PresentationHost.exe` process, which is utilized to run ".xbap" (Browser Application) files capable of downloading arbitrary files over the internet. Attackers may leverage this legitimate Windows utility to facilitate the download of malicious payloads, bypassing traditional security mechanisms by exploiting its trusted status. The goal is often to establish a foothold in a targeted environment or exfiltrate sensitive data.

  In terms of the MITRE ATT&CK framework, this behavior is associated with the **Execution** tactic, particularly the technique T1218: "Signed Binary Proxy Execution". The analysis of the command line parameters alongside the presentation host image can reveal if there was an unauthorized file download attempt, thereby indicating possible malicious intent.

  Primary data sources for this detection include Windows process creation events, which capture when and how an executable is launched, and can provide visibility into any potentially harmful command line parameters associated with `PresentationHost.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for instances of `PresentationHost.exe` being executed. Focus on the creation timestamps, parent processes, and the user context under which the process was initiated.

  - **Analyze Command Line Arguments**: Investigate the command line parameters associated with the `PresentationHost.exe` processes, specifically looking for any use of URL protocols like `http://`, `https://`, or `ftp://`, which may indicate unauthorized file download actions.

  - **Identify Unusual Behavioral Patterns**: Look for repetitive or unsuccessful execution attempts of `PresentationHost.exe`, as these could point towards a compromised system attempting to retrieve payloads or tools from external sources.

  - **Correlate with Network Activity**: Review related network logs to trace any outbound connections made by the IP address associated with the user who executed `PresentationHost.exe`. Look for unusual data transfers or connections to known malicious hosts.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized file downloads in an enterprise setting. While not every instance indicates malicious activity, the likelihood of circumvention of security measures by exploiting a trusted application warrants immediate investigation.

  ### Blind Spots and Assumptions
  Detection might miss instances where an attacker modifies the `PresentationHost.exe` or uses alternative means to achieve similar outcomes without detection. The rule assumes that command line arguments will provide sufficient context to identify malicious activities. Additionally, it requires proper logging configuration to be effective, specifically that process creation events are being captured in a comprehensive and timely manner.

