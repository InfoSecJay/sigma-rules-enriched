title: Renamed PingCastle Binary Execution
id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
status: test
description: Detects the execution of a renamed "PingCastle" binary based on the
  PE metadata fields.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.pingcastle.com/documentation/scanner/
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2024-01-11
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - 'PingCastleReporting.exe'
    - 'PingCastleCloud.exe'
    - 'PingCastle.exe'
  - CommandLine|contains:
    - '--scanner aclcheck'
    - '--scanner antivirus'
    - '--scanner computerversion'
    - '--scanner foreignusers'
    - '--scanner laps_bitlocker'
    - '--scanner localadmin'
    - '--scanner nullsession'
    - '--scanner nullsession-trust'
    - '--scanner oxidbindings'
    - '--scanner remote'
    - '--scanner share'
    - '--scanner smb'
    - '--scanner smb3querynetwork'
    - '--scanner spooler'
    - '--scanner startup'
    - '--scanner zerologon'
  - CommandLine|contains: '--no-enum-limit'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--level Full'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--server '
  filter_main_img:
    Image|endswith:
    - '\PingCastleReporting.exe'
    - '\PingCastleCloud.exe'
    - '\PingCastle.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed "PingCastle" binary. PingCastle is a tool often used for security assessments of Active Directory environments, and while it can serve legitimate purposes, its misuse can indicate a reconnaissance phase by an attacker seeking to identify vulnerabilities in the network. It falls under the MITRE ATT&CK tactic of **Execution** (TA0002) and the technique **Command-Line Interface** (T1059). The primary telemetry source is Windows Process Creation logs, specifically focusing on Event ID 4688. If executed maliciously, PingCastle can lead to unauthorized access to sensitive information and potentially facilitate further attacks, such as lateral movement or privilege escalation. Importantly, this detection does NOT confirm malicious activity without correlating additional context, such as the user account executing the command or the presence of other suspicious behavior.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 related to the execution of `PingCastleReporting.exe`, `PingCastleCloud.exe`, or `PingCastle.exe`. The presence of these binaries is inherently suspicious and warrants deeper inspection.

  - **Examine command line arguments:** Analyze the command line associated with the process for specific arguments that indicate malicious intent, such as `--scanner nullsession`, `--scanner smb`, or `--scanner zerologon`. Legitimate use cases typically lack excessive enumeration flags or focus on security assessments without invasive parameters.

  - **Investigate user account activity:** Identify the user account that launched the PingCastle executable. Investigate its recent activity for signs of privilege elevation or unusual access patterns, correlating with user behavior within the environment.

  - **Check for related process activity:** Look for sibling processes created immediately before or after the execution of the PingCastle binary (Event ID 4688). Malicious activity often involves additional processes that may indicate exploitation or lateral movement.

  - **Analyze for anomalies in network activity:** Validate if any associated network calls were made that align with common PingCastle operations. Use network logs to check for excessive or unauthorized requests to SMB shares, which correlate with the command line options used.

  ### Prioritization

  This alert should be considered high priority due to the potential security impact on critical systems when **PingCastle** is utilized for malicious reconnaissance. The likelihood of this tool being weaponized is significant, especially in environments where attackers are targeting Active Directory infrastructures.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming the binary or running it from an unmonitored user account. Reliable detection requires complete logging configurations in Windows to capture all relevant process creation events. Legitimate administrative actions, such as assessments on compliance or security posture utilizing PingCastle, may trigger this alert. A related detection to strengthen coverage could be identifying other tools or scripts traditionally used for AD enumeration that may simultaneously execute.

