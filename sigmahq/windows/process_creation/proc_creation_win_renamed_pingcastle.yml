title: Renamed PingCastle Binary Execution
id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
status: test
description: Detects the execution of a renamed "PingCastle" binary based on the PE
  metadata fields.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.pingcastle.com/documentation/scanner/
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2024-01-11
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - 'PingCastleReporting.exe'
    - 'PingCastleCloud.exe'
    - 'PingCastle.exe'
  - CommandLine|contains:
    - '--scanner aclcheck'
    - '--scanner antivirus'
    - '--scanner computerversion'
    - '--scanner foreignusers'
    - '--scanner laps_bitlocker'
    - '--scanner localadmin'
    - '--scanner nullsession'
    - '--scanner nullsession-trust'
    - '--scanner oxidbindings'
    - '--scanner remote'
    - '--scanner share'
    - '--scanner smb'
    - '--scanner smb3querynetwork'
    - '--scanner spooler'
    - '--scanner startup'
    - '--scanner zerologon'
  - CommandLine|contains: '--no-enum-limit'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--level Full'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--server '
  filter_main_img:
    Image|endswith:
    - '\PingCastleReporting.exe'
    - '\PingCastleCloud.exe'
    - '\PingCastle.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of renamed binaries associated with the "PingCastle" tool, a well-known Active Directory security assessment tool. Attackers may leverage this tool, particularly in post-compromise scenarios, to gather sensitive information about an enterprise's Active Directory configuration, potentially leading to further exploitation. The common objectives of such attacks include reconnaissance to facilitate lateral movement, privilege escalation, or the execution of subsequent malicious payloads.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Execution (T1059)**: The use of various scripts and command lines to execute commands.
  - **Defense Evasion (T1202)**: Using renamed binaries to obscure malicious intent and evade traditional security measures.

  Primary data sources for this rule include process creation event logs on Windows systems, which will capture critical details about the executable's name and its command line arguments, providing visibility into potential malicious use of PingCastle.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `PingCastleReporting.exe`, `PingCastleCloud.exe`, or `PingCastle.exe`, noting the command line arguments used during execution.
  - **Check for Suspicious Network Activity**: Investigate any associated network connections initiated by these processes to identify potential data exfiltration or communication with known malicious IPs.
  - **Examine System Changes**: Look into system states or configuration changes made by these scans, especially modifications to user permissions or group policies that could indicate privilege escalation.
  - **Correlate with User Access Logs**: Analyze user access patterns and logs to identify any unusual administrative activities that coincide with the execution of the PingCastle binaries.

  ### Prioritization
  This alert is classified as high severity due to the significant risk posed by unauthorized use of the PingCastle tool. Successful reconnaissance operations can lead to severe exploitation of domain vulnerabilities, which may compromise enterprise security.

  ### Blind Spots and Assumptions
  The detection may not adequately cover instances where the original file name is completely altered or where the tool is executed in a manner not captured by typical process creation logs. Additionally, the rule assumes that log sources are correctly configured to record detailed process creation events, including command-line arguments, which may not always be the case. Ensuring logging for all necessary telemetry is critical for the effectiveness of this detection rule.

