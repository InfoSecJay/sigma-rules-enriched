title: Renamed PingCastle Binary Execution
id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
status: test
description: Detects the execution of a renamed "PingCastle" binary based on the
  PE metadata fields.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.pingcastle.com/documentation/scanner/
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2024-01-11
tags:
- attack.execution
- attack.stealth
- attack.t1059
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - 'PingCastleReporting.exe'
    - 'PingCastleCloud.exe'
    - 'PingCastle.exe'
  - CommandLine|contains:
    - '--scanner aclcheck'
    - '--scanner antivirus'
    - '--scanner computerversion'
    - '--scanner foreignusers'
    - '--scanner laps_bitlocker'
    - '--scanner localadmin'
    - '--scanner nullsession'
    - '--scanner nullsession-trust'
    - '--scanner oxidbindings'
    - '--scanner remote'
    - '--scanner share'
    - '--scanner smb'
    - '--scanner smb3querynetwork'
    - '--scanner spooler'
    - '--scanner startup'
    - '--scanner zerologon'
  - CommandLine|contains: '--no-enum-limit'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--level Full'
  - CommandLine|contains|all:
    - '--healthcheck'
    - '--server '
  filter_main_img:
    Image|endswith:
    - '\PingCastleReporting.exe'
    - '\PingCastleCloud.exe'
    - '\PingCastle.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the execution of renamed "PingCastle" binaries by examining specific PE metadata fields and command-line arguments used during execution. The likely attacker objective is to perform reconnaissance or exploit vulnerabilities in Active Directory environments, gathering information for further exploitation. Relevant MITRE ATT&CK tactics include Execution (T1202) and Defense Evasion (T1059), as attackers may use renamed legitimate tools to bypass security measures.

  The primary telemetry sources for this detection include Windows process creation logs, specifically relying on Security Event ID 4688 or Sysmon Event ID 1. If executed maliciously, this behavior may lead to unauthorized access or compromise of sensitive domain information. However, this detection does NOT confirm that the execution was malevolent on its own; context and further investigation are required to understand intent.

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for the detected binaries ("PingCastleReporting.exe", "PingCastleCloud.exe", "PingCastle.exe"). Check the `NewProcessName` field for exact file paths.

  - **Analyze command-line arguments:** Focus on command-line parameters for suspicious flags such as “--scanner” followed by potential credentials or system queries. Confirm the presence of strings like "nullsession" or "zerologon", indicating reconnaissance intentions.

  - **Check for known good behavior:** Compare against typical usage logs for PingCastle to identify regular activity. Look for command-line arguments related to the tool's normal scanning functions that don't involve suspicious queries.

  - **Examine parent-child relationships:** Identify the parent processes that initiated the execution using Event ID 4688. If the parent process is a legitimate administrative tool, it may suggest benign activity.

  - **Validate execution context:** Ensure that the process isn't running from unusual directories (e.g., temp folders) or by non-privileged users that would typically misuse such tools. Investigate user accounts associated with the execution.

  - **Look for anomalies in telemetry:** Review network logs for unusual outbound traffic patterns following the execution. Specifically, identify any external command-and-control communication attempts, which may indicate post-exploitation activities.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on sensitive Active Directory environments if exploited. The likelihood of malicious abuse is significant, as attackers often weaponize benign-looking tools like PingCastle for reconnaissance or privilege escalation. The nature of the detected behavior suggests it is commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may have limitations in scenarios where legitimate users or administrative accounts run PingCastle tools for valid assessments. Ensure proper logging configurations for Windows process creation to minimize blind spots in surveillance. Other processes that rename or employ similar command-line strings can trigger false positives; hence, it is critical to correlate alerts with contextual logs. Companion detection rules focusing on abnormal network activities after deployment, such as unusual Kerberos ticket requests, can enhance detection capabilities.

