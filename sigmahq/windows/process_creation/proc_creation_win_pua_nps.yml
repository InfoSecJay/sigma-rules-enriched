note: |
  ### Technical Context

  This Sigma rule detects the execution of the NPS tunneling tool (`npc.exe`), which is designed for network penetration and proxy services, potentially enabling unauthorized remote access and data exfiltration. An attacker may utilize NPS to create a backdoor, tunneling sensitive information through an encrypted connection. The relevant MITRE ATT&CK technique is **Command-and-Control via Tunneling (T1090)**.

  Primary telemetry sources include Windows process creation logs, specifically targeting Event ID 4688 for process creation details and potential command-line arguments. If malicious, the security impact includes significant data leakage, unauthorized access to internal systems, and potential lateral movement within the network. This detection does NOT confirm malicious intent on its own; it only indicates the execution of a known tool, which may have legitimate uses.

  ### Investigation Steps

  - **Verify process creation details:** Review Windows Security Event ID 4688 logs for the creation of `npc.exe`. Check the `NewProcessName` field to confirm the file path and ensure it ends with `\npc.exe`.

  - **Analyze command-line arguments:** Inspect the `CommandLine` field associated with Event ID 4688. Look for the presence of `-server=`, `-vkey=`, and `-password=` parameters, which are strong indicators of misconfiguration or potential malicious use.

  - **Check process hash values:** Validate hash values against known indicators of compromise. Look for MD5 `AE8ACF66BFE3A44148964048B826D005`, SHA1 `CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181`, or SHA256 `5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856`. A match signifies the known malicious version is in use.

  - **Identify expected legitimate usage:** Understand the potential legitimate use of `npc.exe` in your environment. This may include authorized internal tools or services utilizing NPS. Confirm legitimacy by checking with stakeholders about the deployment and configuration of this tool.

  - **Correlate with network traffic:** Review network logs to identify any unusual outbound connections originating from the host that executed `npc.exe`. Look for unexpected ports or connections to known malicious command-and-control IPs.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the high likelihood of malicious abuse, particularly in organizations where remote access tools should be closely monitored. The behavior is associated with a known and commonly weaponized tool for tunneling and proxying traffic.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to rename the executable or modify command-line arguments to evade detection. Ensure that process creation logs are properly configured to capture the necessary telemetry. Legitimate activities such as authorized IT remote support might trigger this alert, particularly if misconfigured parameters are used. A related detection to enhance coverage includes monitoring outbound connections for unusual tunneling activities (e.g., checks on Event ID 5156 for Windows Filtering Platform).

