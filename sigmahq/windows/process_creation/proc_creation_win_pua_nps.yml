  ---

  ### Technical Context

  This detection identifies the execution of NPS, a legitimate tunneling tool often misused by adversaries for unauthorized port forwarding and accessing internal networks. The likely attacker objective includes establishing a covert channel for command-and-control communications or facilitating lateral movement within the target environment. This behavior corresponds to the MITRE ATT&CK tactic: Command and Control (T1071) with the technique: Application Layer Protocol (T1090).

  The primary telemetry source for this rule is Windows process creation logs, specifically those capturing Event ID 4688 and Sysmon Event ID 1, which detail process starts on Windows systems. If exploited maliciously, NPS can enable unauthorized access to sensitive environments, posing a high risk to data integrity and operational security. Importantly, the execution of NPS does NOT confirm malicious intent on its own, as it can also stem from legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Review the process creation log: ** Check for Event ID 4688 or Sysmon Event ID 1: Verify the presence of `npc.exe` in the process creation logs. Confirm the command line arguments contain `-server=`, `-vkey=`, and `-password=`, which strongly indicate malicious usage.

  - **Analyze the command line arguments: ** Focus on extracting parameters from the command line. Presence of flags such as `-config=npc`, alongside obfuscated or generic values, may suggest evasion tactics. Compare with expected syntax for legitimate administrative usage.

  - **Correlate with network logs: ** Examine firewall and proxy logs for outbound connections from the system running NPS to external servers. Look for unusual destination IPs or ports that do not align with standard business operations, indicating potential C2 communication.

  - **Verify hashes of the executing file: ** Check the hash values against known good hashes of NPS versions. If the file hash matches `MD5=AE8ACF66BFE3A44148964048B826D005`, it raises the likelihood of suspicious behavior, particularly if executed outside of sanctioned environments.

  - **Assess the role of the host: ** Determine the criticality and intended role of the affected host. If this system typically does not run tunneling tools or is not assigned a network engineer role, this could indicate potential compromise.

  - **Document legitimate use cases: ** Identify authorized uses of NPS within your environment. Note any scheduled tasks or administration scripts that include `npc.exe` to establish a baseline behavior and distinguish between benign and malicious activity.

  ---

  ### Prioritization

  This alert should be prioritized as high due to the potential impact on sensitive internal systems and data. The likelihood of malicious use is significant, as NPS is commonly weaponized by attackers for tunneling into restricted environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the command line arguments are altered to evade signatures, utilizing syntactic variations. Ensure proper logging configurations for process creation and command lines are enabled across all endpoints for reliable detection. Legitimate administrative activities, such as troubleshooting or network management, can trigger this alert, necessitating contextual awareness. Monitoring additional behaviors related to lateral movement or unusual user access patterns can enhance coverage against this threat.

