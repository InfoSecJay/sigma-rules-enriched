note: |
  ### Technical Context
  This rule detects the execution of NPS (Nanqing Proxy Server), which is utilized for port forwarding and as a penetration proxy server. NPS can be exploited by malicious actors to establish covert communication channels back to their command and control infrastructure, allowing them to perform actions such as data exfiltration, lateral movement, or evading detection by security controls. The ability for an attacker to set up a proxy server on a compromised host is indicative of a targeted threat scenario where the attacker aims to maintain persistent access to a network environment.

  The relevant MITRE ATT&CK tactics include **Command and Control (T1071)**, which involves communication methods between compromised systems and the attacker's infrastructure. The technique **Application Layer Protocol (T1071.001)** may apply as NPS uses common ports (e.g., TCP), making it blend in with standard network traffic. Detection of NPS is crucial as it often signifies the presence of a malicious actor actively maneuvering within an environment.

  Primary data sources for this detection include **process creation logs**, which provide visibility into executed commands and their arguments, helping identify the deployment of NPS through command line parameters associated with its executable. Additionally, monitoring for network connections initiated by the NPS executable can offer context around its use, revealing potential data exfiltration or lateral movement activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs to identify instances of `npc.exe` execution, focusing on timestamp, user context, and any unusual parent process associations that might indicate malicious behavior.
  - **Inspect Command Line Arguments:** Check for command line parameters containing `-server=`, `-vkey=`, and `-password=`, which are indicative of potential unauthorized NPS configurations; correlate findings with known operational usage.
  - **Correlate Network Activity:** Investigate network logs for unusual outbound connections from hosts that executed NPS, particularly connections to uncommon external IP addresses or regions, which could suggest command and control traffic.
  - **Analyze Endpoint Behavior:** Conduct a review of endpoint activities where NPS was executed, looking for lateral movement patterns, especially in environments sensitive to data protection or with critical assets.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of unauthorized proxy configuration on network security, allowing attackers to bypass traditional network defenses and facilitate covert operations.

  ### Blind Spots and Assumptions
  Detection coverage may be insufficient in environments where legitimate use of NPS occurs, potentially leading to false positives. The logic assumes that process creation logs are being captured effectively; any gaps in logging, particularly concerning command line arguments or specific sub-process executions, could hinder detection accuracy. Additionally, configurations around systems running sensitive applications should be comprehensively established to ensure visibility into such command and control tools.

