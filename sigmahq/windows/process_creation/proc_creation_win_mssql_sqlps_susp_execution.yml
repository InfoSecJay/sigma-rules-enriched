title: Detection of PowerShell Execution via Sqlps.exe
id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
status: test
description: |
  This rule detects execution of a PowerShell code through the sqlps.exe utility, which is included in the standard set of utilities supplied with the MSSQL Server.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://learn.microsoft.com/en-us/sql/tools/sqlps-utility?view=sql-server-ver15
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqlps/
- https://twitter.com/bryon_/status/975835709587075072
author: 'Agro (@agro_sev) oscd.community'
date: 2020-10-10
modified: 2022-12-09
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\sqlps.exe'
  selection_image:
  - Image|endswith: '\sqlps.exe'
  - OriginalFileName: 'sqlps.exe'
  filter_image:
    ParentImage|endswith: '\sqlagent.exe'
  condition: selection_parent or (selection_image and not filter_image)
falsepositives:
- Direct PS command execution through SQLPS.exe is uncommon, childprocess 
  sqlps.exe spawned by sqlagent.exe is a legitimate action.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts through the `sqlps.exe` utility, commonly associated with Microsoft SQL Server. Attackers may leverage this method to execute malicious commands or scripts without being detected, particularly because standard PowerShell script logs may not capture the activities conducted through `sqlps.exe`. The likely attacker objective includes lateral movement or privilege escalation within a network environment.

  Relevant MITRE ATT&CK tactic: Execution; Technique: Command and Scripting Interpreter – PowerShell (T1059.001) and Scheduled Task/Job (T1127). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 (Process Creation). If successful, this detection indicates potential malicious activity executed via a legitimate component, leading to unauthorized access or further exploitation of the SQL Server environment.

  Importantly, this detection does NOT confirm malicious activity on its own, as legitimate uses of `sqlps.exe` may occur, particularly in context with SQL Server operations.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for any instance of `sqlps.exe` executing. Investigate the command line and ParentImage fields for potentially malicious arguments or suspicious parent processes.

  - **Analyze parent processes**: If `sqlps.exe` is detected, verify the ParentImage to establish legitimacy. If it's spawned by `sqlagent.exe`, this is typical behavior; if from other processes, it requires further scrutiny.

  - **Validate command arguments**: Inspect the command line arguments provided to `sqlps.exe`. Malicious indicators may include encoded or complex PowerShell commands. Look for unusual base64 encoding or obfuscated scripts.

  - **Correlate with other logs**: Cross-reference with SQL Server logs for unusual database access patterns or unexpected queries executed just before or after the process creation. Legitimate activity typically involves standard database management tasks without complex scripting.

  - **Review behavior of `sqlps.exe`**: If the alert is triggered, review the actions taken by `sqlps.exe` during its runtime to detect unauthorized changes to SQL Server configurations, especially if the application had administrative privileges.

  - **Identify access to sensitive assets**: Investigate the access logs of sensitive databases or tables around the time the alert was triggered. Unexpected access by users or services could indicate malicious activity.

  ### Prioritization

  The severity of this alert is medium due to the potential high impact associated with unauthorized execution within SQL Server environments. The likelihood of malicious abuse is moderate, given the stealth capabilities provided by `sqlps.exe`, which is often leveraged by threat actors to evade detection. This behavior aligns with known tactics used in targeted attacks.

  ### Blind Spots and Assumptions

  Detection can be limited if the security logs do not adequately capture process execution details or if alternate logging mechanisms are not implemented. Attackers may employ techniques such as process hollowing or direct memory manipulation to conceal their actions. Legitimate activities include standard database development and administrative operations executing management scripts. A related detection rule for monitoring anomalous SQL user account creation or privilege escalation attempts could strengthen coverage against exploitation efforts.

