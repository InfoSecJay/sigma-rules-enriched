title: Detection of PowerShell Execution via Sqlps.exe
id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
status: test
description: |
  This rule detects execution of a PowerShell code through the sqlps.exe utility, which is included in the standard set of utilities supplied with the MSSQL Server.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://learn.microsoft.com/en-us/sql/tools/sqlps-utility?view=sql-server-ver15
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqlps/
- https://twitter.com/bryon_/status/975835709587075072
author: 'Agro (@agro_sev) oscd.community'
date: 2020-10-10
modified: 2022-12-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\sqlps.exe'
  selection_image:
  - Image|endswith: '\sqlps.exe'
  - OriginalFileName: 'sqlps.exe'
  filter_image:
    ParentImage|endswith: '\sqlagent.exe'
  condition: selection_parent or (selection_image and not filter_image)
falsepositives:
- Direct PS command execution through SQLPS.exe is uncommon, childprocess sqlps.exe
  spawned by sqlagent.exe is a legitimate action.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of PowerShell commands through the `sqlps.exe` utility commonly associated with Microsoft SQL Server. Attackers may leverage this utility to execute PowerShell scripts, potentially to control SQL Server environments or achieve lateral movement within the network. The relevant MITRE ATT&CK tactics include Execution (T1059.001 - PowerShell) and Defense Evasion (T1127 - Trusted Developer Utilities). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on the `ParentImage` and `Image` values to identify unwanted execution patterns. If malicious, this activity could indicate an attacker leveraging SQL Server tools to gain unauthorized access or cause data exfiltration. However, this detection does NOT confirm malicious intent on its own; context must be assessed.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for `sqlps.exe` process creation on critical database servers. Correlate with the executed command lines, if available.

  - **Identify parent process context:** Look for `ParentImage` values associated with `sqlps.exe`. If `sqlagent.exe` is the parent, this may be legitimate, whereas unexpected parents may indicate a potential compromise.

  - **Analyze PowerShell command behavior:** If possible, extract command line arguments from logs for unusual PowerShell commands. Legitimate executions should typically involve standard administrative tasks.

  - **Correlate execution with user actions:** Cross-reference the account initiating `sqlps.exe`. Legitimate access from database administrators or scheduled tasks may be benign, while access from unusual users or times should be flagged.

  - **Search for indicators of lateral movement:** Review for additional artifacts, such as any unusual outbound connections initiated from the SQL Server or changes in permissions, which could indicate further malicious intent.

  ---

  ### Prioritization

  This alert is of medium severity in an enterprise context due to the potential for significant impact if an attacker gains control over database systems, which contain sensitive information. The likelihood of malicious abuse is moderate, as attackers often use trusted binaries like `sqlps.exe` to evade detection efforts. This behavior has been weaponized in various attack scenarios, particularly in environments where SQL Server is prevalent.

  ---

  ### Blind Spots and Assumptions

  This detection might be limited by environments that do not log detailed process command lines or do not capture all `sqlps.exe` instances accurately. Legitimate use cases, such as automated scripts or maintenance tasks running under SQL Server agent jobs, may trigger this alert. Additionally, companion detections to consider include monitoring for unusual Task Scheduler events or direct PowerShell executions that may indicate script-based attacks.

