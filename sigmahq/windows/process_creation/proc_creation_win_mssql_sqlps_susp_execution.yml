title: Detection of PowerShell Execution via Sqlps.exe
id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
status: test
description: |
  This rule detects execution of a PowerShell code through the sqlps.exe utility, which is included in the standard set of utilities supplied with the MSSQL Server.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://learn.microsoft.com/en-us/sql/tools/sqlps-utility?view=sql-server-ver15
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqlps/
- https://twitter.com/bryon_/status/975835709587075072
author: 'Agro (@agro_sev) oscd.community'
date: 2020-10-10
modified: 2022-12-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\sqlps.exe'
  selection_image:
  - Image|endswith: '\sqlps.exe'
  - OriginalFileName: 'sqlps.exe'
  filter_image:
    ParentImage|endswith: '\sqlagent.exe'
  condition: selection_parent or (selection_image and not filter_image)
falsepositives:
- Direct PS command execution through SQLPS.exe is uncommon, childprocess 
  sqlps.exe spawned by sqlagent.exe is a legitimate action.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts through `sqlps.exe`, a utility associated with Microsoft SQL Server. The behavior suggests an attacker may attempt to leverage this method to execute malicious scripts while evading traditional detection measures that rely on monitoring PowerShell script blocks. The relevant MITRE ATT&CK tactic is Execution (TA0002), with the technique being PowerShell (T1059.001). Primary telemetry sources include Windows Process Creation logs, specifically leveraging Event ID 4688, which tracks process creation activities. If confirmed malicious, this behavior can lead to unauthorized system access or data exfiltration. However, it is critical to note that this detection alone does not confirm malicious intent, as legitimate administrative operations could also trigger these alerts.

  ### Investigation Steps

  - **Review process creation logs**: Inspect Windows Security Event ID 4688 for instances of `sqlps.exe` being executed. Check for unusual command-line arguments that could indicate unauthorized use versus standard administrative tasks.

  - **Examine parent process details**: Identify the `ParentImage` of the `sqlps.exe` execution. If the parent is `sqlagent.exe`, it is likely legitimate. If other parent processes are involved, further investigation is warranted.

  - **Analyze for use of PowerShell commands**: Cross-reference related PowerShell event logs (Event ID 4104) to identify executed commands or script blocks if they were logged. The absence of other PowerShell events may suggest an evasion tactic.

  - **Establish a baseline for legitimate activity**: Document the typical command-line arguments and parent processes associated with legitimate use of `sqlps.exe`. This includes periods of high activity during scheduled SQL Server jobs that use this utility.

  - **Identify high-confidence malicious indicators**: Look for anomalous execution patterns, such as repeated execution of `sqlps.exe` with atypical arguments or rapid invocation from unusual systems, indicating potential brute-force or reconnaissance activity.

  ### Prioritization

  This alert is of medium severity, as its impact lies primarily on systems running SQL Server, which are critical for database management. However, the likelihood of malicious exploitation is realistic given that `sqlps.exe` can facilitate undetected execution of PowerShell cmdlets. Such use has been increasingly observed in attacks intending to bypass standard security controls.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of log data related to command execution or by environments where SQL Server logging is not sufficiently configured. Legitimate batch jobs or administrative tasks may trigger this alert, complicating the differentiation between benign and malicious uses. A related detection to enhance coverage would be monitoring for unusual activity associated with the `sqlagent.exe` process (see T1059.001 for analysis of PowerShell script execution).

