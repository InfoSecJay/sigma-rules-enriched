title: Detection of PowerShell Execution via Sqlps.exe
id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
status: test
description: |
  This rule detects execution of a PowerShell code through the sqlps.exe utility, which is included in the standard set of utilities supplied with the MSSQL Server.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://learn.microsoft.com/en-us/sql/tools/sqlps-utility?view=sql-server-ver15
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqlps/
- https://twitter.com/bryon_/status/975835709587075072
author: 'Agro (@agro_sev) oscd.community'
date: 2020-10-10
modified: 2022-12-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\sqlps.exe'
  selection_image:
  - Image|endswith: '\sqlps.exe'
  - OriginalFileName: 'sqlps.exe'
  filter_image:
    ParentImage|endswith: '\sqlagent.exe'
  condition: selection_parent or (selection_image and not filter_image)
falsepositives:
- Direct PS command execution through SQLPS.exe is uncommon, childprocess sqlps.exe
  spawned by sqlagent.exe is a legitimate action.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of PowerShell code via the `sqlps.exe` utility, which is bundled with Microsoft SQL Server. Attackers can use this method to execute malicious PowerShell commands while evading traditional security measures. Since script blocks executed through `sqlps.exe` are not logged in the standard PowerShell logs, it becomes a useful tactic for adversaries to conceal their activities.

  The primary motive behind this behavior is often to gain unauthorized access to sensitive databases, exfiltrate data, or establish persistence within a network while avoiding detection. The relevant MITRE ATT&CK tactics and techniques associated with this detection include Execution (TA0002) and Defense Evasion (TA0005), specifically PowerShell (T1059.001) and the use of system binaries like `sqlps.exe` (T1127).

  Data sources that can provide substantial evidence for this detection include Windows process creation logs, which track when and how processes are initiated, as well as logs from the SQL Server that may provide contextual information about executed queries and their origins.

  ### Investigation Steps
  - **Review Process Logs**: Collect and examine Windows process creation logs for instances of `sqlps.exe` execution. Check for unusual parent-child relationships and any command-line parameters used.

  - **Correlate with SQL Logs**: Investigate SQL Server logs to determine if `sqlps.exe` executions correspond with unusual query patterns or access to sensitive data that could indicate malicious activity.

  - **Assess Network Traffic**: Analyze network traffic logs for any outgoing connections or data exfiltration attempts from the system where `sqlps.exe` was executed, especially focusing on unusual ports or protocols.

  - **Investigate User Context**: Look into the user accounts executing `sqlps.exe` to determine if they have legitimate access rights and if the actions being taken align with standard operational practices.

  ### Prioritization
  The alert's severity is medium due to the potential risk posed by the misuse of `sqlps.exe` for executing unauthorized PowerShell scripts. While not all executions are malicious, this behavior can indicate attempts to evade security controls and should be investigated promptly.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection is the reliance on process creation logs, which may not capture all instances of `sqlps.exe` usage if logging is misconfigured or disabled. The detection assumes that legitimate use cases will not involve `sqlps.exe` being spawned without corresponding SQL Server activity. Additionally, comprehensive logging of SQL Server activities and process creation must be enabled to ensure this alert functions effectively.

