note: |
  ### Technical Context

  This Sigma rule detects calls made to Windows Management Instrumentation Command-line (WMIC) to potentially modify Windows Defender settings, specifically through the use of the `/Namespace:\\root\\Microsoft\\Windows\\Defender` command-line argument. The likely objective of an attacker executing this behavior is to create exclusions that would allow malware to evade detection by Windows Defender. The relevant MITRE ATT&CK tactics for this behavior include Defense Evasion (T1562.001) and Impact (T1047).

  Primary telemetry sources include process creation logs, specifically targeting Process Creation Event ID 4688. If malicious, this behavior could lead to compromised endpoint security, enabling attackers to operate undetected. Importantly, this detection alone does not confirm that a security incident has occurred; it merely indicates that a potentially suspicious command was executed, requiring further investigation.

  ### Investigation Steps

  - **Review Process Creation Events**: Investigate Security Event ID 4688 logs for occurrences of `wmic.exe` being launched. Focus on entries where the CommandLine contains `/Namespace:\\root\\Microsoft\\Windows\\Defender`, indicating potential tampering.

  - **Check for Exclusion Paths**: Review the command-line arguments alongside the event logs to identify any arguments that specify paths being added for exclusion. Malicious indicators may include atypical or suspicious file paths.

  - **Cross-reference WMIC Usage**: Review historical usage of WMIC in your environment. If legitimate applications or scripts typically run WMIC commands, document their command configuration and expected behavior to determine if this instance is anomalous.

  - **Identify Affected Assets**: Cross-reference the process creation events with asset management records to assess the criticality of the device. An affected server may have a higher impact than a less critical workstation.

  - **Verify System Integrity**: Investigate Windows Defender logs or configuration files for any changes to exclusion settings or alterations in Defender’s operational state. Such changes may be indicative of tampering.

  - **Collect Other Related Events**: Look for any unusual behavior in related security products or network activities post-execution of WMIC, such as abnormal outbound traffic that might indicate exploitation or data exfiltration following the modification.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on security posture and the likelihood of malicious exploitation. The act of modifying Windows Defender settings is commonly leveraged by adversaries to facilitate malware infections, making this behavior particularly concerning in an enterprise context.

  ### Blind Spots and Assumptions

  Detection may be limited if WMIC is executed in a context not fully captured by process creation logs, or if log retention practices do not cover historical data in sufficient volume. Legitimate administrative actions, such as an IT admin configuring Defender settings as part of their role, may also trigger this alert. A companion detection, such as monitoring for abnormal network connections or file modifications immediately after the execution of WMIC, can enhance the detection coverage and provide additional context to analyst investigations.

