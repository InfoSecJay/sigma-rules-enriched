title: Suspicious Advpack Call Via Rundll32.EXE
id: a1473adb-5338-4a20-b4c3-126763e2d3d3
status: test
description: Detects execution of "rundll32" calling "advpack.dll" with potential
  obfuscated ordinal calls in order to leverage the "RegisterOCX" function
references:
- https://twitter.com/Hexacorn/status/1224848930795552769
- http://www.hexacorn.com/blog/2020/02/05/stay-positive-lolbins-not/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-17
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_dll:
    CommandLine|contains: 'advpack'
  selection_cli_ordinal:
  - CommandLine|contains|all:
    - '#+'
    - '12'
  - CommandLine|contains: '#-'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects suspicious activity related to the execution of `rundll32.exe`, particularly when it's invoked to call the `advpack.dll` with obfuscated ordinal references. This technique could indicate an attacker's attempt to evade detection while executing malicious payloads or scripts. The usage of `rundll32.exe` to load DLLs like `advpack.dll` is a known tactic for malicious actors, often employed to execute arbitrary code or download malicious components without being easily identified.

  The likely attacker objectives may include leveraging this execution method to bypass security controls, perform malicious actions stealthily, or gain persistent access. The use of obfuscated ordinal calls (indicated by the presence of symbols like `#+` or `#-` in the command line) is a typical evasion technique that suggests attempts to conceal the true nature of the operation from defenders and automated detection systems.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562)**: Utilizing tools and methods to circumvent detection mechanisms.
  - **Execution (T1203)**: Executing code through methods that leverage legitimate system binaries.

  Primary data sources for investigation include:
  - Windows process creation logs that capture command-line arguments and process hierarchies.
  - Security Event logs detailing executions of `rundll32.exe` and associated parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation events for instances of `rundll32.exe`. Focus on command lines that include `advpack` and any unusual obfuscated arguments.
  - **Inspect Parent Processes**: Identify and examine the parent processes that spawned the `rundll32.exe` instances. Investigate if they are legitimate system processes or related to suspicious activity.
  - **Correlate with Other Logs**: Check for related activities in other data sources, such as EDR alerts, to see if there are any associated behaviors indicative of malicious activity, such as system configuration changes or file modifications.
  - **Identify Affected Systems**: Compile a list of systems where the alert was triggered. Assess the security posture of these systems and investigate the user activities leading up to the detection to understand the context.

  ### Prioritization
  Given the high severity of the alert, it indicates that an evasion technique is in play which could lead to the execution of malicious payloads. The potential impact on the enterprise is significant, as this behavior may enable attackers to gain unauthorized access or persistently compromise affected systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if command line logging is not enabled or if security tools are not parsing Windows event logs for process creation events effectively. This rule operates under the assumption that `rundll32.exe` is not being used for legitimate purposes in the context of the observed obfuscations and that the environments are configured to log requisite events at an appropriate level. If logs are lost due to retention policies or misconfigurations, critical evidence may be unavailable for a thorough investigation.

