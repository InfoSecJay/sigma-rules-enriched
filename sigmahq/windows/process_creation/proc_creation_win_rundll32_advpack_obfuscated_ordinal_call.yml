note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` calling `advpack.dll`, particularly when abnormal or obfuscated commands involving ordinal numbers are present. This behavior is often associated with attackers attempting to execute malicious payloads while masquerading as legitimate system processes, typically aiming to avoid detection during lateral movement or execution of payloads. Relevant MITRE ATT&CK tactics include Execution (TA0002) via the technique of Command and Scripting Interpreter (T1059). The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 for process creation and potential command line parsing.

  If this detection is confirmed malicious, the impact could be significant, including unauthorized access and execution of malicious code on systems, potentially leading to data loss or system compromise. However, this alert alone does NOT confirm malicious activity without additional context, such as intent, user behavior, or subsequent actions taken by the process.

  ### Investigation Steps

  - **Check process creation details:** Review Windows Security Event ID 4688 for `rundll32.exe`. Look for suspicious parent processes or processes created by unexpected users, which could indicate abuse of system tools.

  - **Analyze command line parameters:** Examine the command line arguments used with `rundll32.exe`. Legitimate uses of `advpack.dll` typically do not involve obfuscated parameters or ordinals. Look for arguments containing ordinal patterns like `#+` or `12`.

  - **Correlate with Sysmon data:** If Sysmon is deployed, check Event ID 1 for the creation of `rundll32.exe`. This can provide additional context around the parent process, command line, and user context, aiding in identifying potential malicious indicators.

  - **Identify high-confidence malicious indicators:** Look for instances where `rundll32.exe` with `advpack.dll` is invoked from non-standard paths (e.g., locations other than `C:\Windows\System32`), which is a strong indication of misuse.

  - **Assess legitimate usage:** Document common organizational tasks involving `rundll32.exe` and `advpack.dll`, and assess if the observed behavior aligns with standard operating procedures or scheduled tasks, particularly among known administrative users.

  - **Monitor for related network activity:** If possible, capture network traffic to see if the `rundll32.exe` invocation is tied to unexpected outbound connections or data exfiltration, further indicating potential malicious behavior.

  ### Prioritization

  This alert should be considered high priority due to the potential for significant impact if malicious activity is confirmed on critical systems. The likelihood of misuse is increased since `rundll32.exe` is frequently exploited by adversaries, making this behavior noteworthy for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may face limitations from obfuscation techniques that adversaries can employ to hide their command line arguments. Additionally, accurate detection relies on having complete logging enabled for process creation and Sysmon for comprehensive visibility. Legitimate scripts using `rundll32.exe` may trigger this alert, particularly during software installations or updates. A companion detection to strengthen coverage would be monitoring for anomalies related to `rundll32.exe` within the context of the Windows Event Logs, especially correlations with subsequent processes spawned by it.

