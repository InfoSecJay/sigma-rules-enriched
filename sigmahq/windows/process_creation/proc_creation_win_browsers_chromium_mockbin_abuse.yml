title: Chromium Browser Headless Execution To Mockbin Like Site
id: 1c526788-0abe-4713-862f-b520da5e5316
status: test
description: Detects the execution of a Chromium based browser process with the 
  "headless" flag and a URL pointing to the mockbin.org service (which can be 
  used to exfiltrate data).
references:
- https://www.zscaler.com/blogs/security-research/steal-it-campaign
author: X__Junior (Nextron Systems)
date: 2023-09-11
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\vivaldi.exe'
  selection_headless:
    CommandLine|contains: '--headless'
  selection_url:
    CommandLine|contains:
    - '://run.mocky'
    - '://mockbin'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_browsers_chromium_mockbin_abuse/info.yml
note: |
  ### Technical Context

  The rule detects the execution of Chromium-based browsers (e.g., Chrome, Brave, Edge) with the `--headless` flag, targeting URLs associated with the Mockbin service, which can be exploited to exfiltrate data. The likely objective of an attacker using this technique is to run scripts or commands without a GUI, enabling stealthy data transmission to an external service under their control. This falls under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Command and Scripting Interpreter (T1059.001).

  Primary telemetry sources include process creation logs, specifically Security Event ID 4688 in Windows event logs or Sysmon Event ID 1, which will provide details about command-line arguments and parent-child process relationships. If this behavior is confirmed to be malicious, it could imply an active data breach. However, this detection does not confirm data exfiltration on its own and should be corroborated with additional context.

  ### Investigation Steps

  - **Identify process creation events**: Search for Security Event ID 4688 or Sysmon Event ID 1 indicating when Chrome, Brave, Edge, Opera, or Vivaldi are launched. Review parent process IDs to identify how these processes are being initiated.

  - **Examine command-line arguments**: Ensure command-line execution contains the `--headless` flag along with a URL referencing `mockbin.org` or `mocky.io`. Confirm the presence of both elements for malicious indicators.

  - **Cross-reference URL access**: Check for outbound connections or HTTP requests made to the recorded URLs. Look at security logs or network monitoring tools for record of HTTP status codes and data being sent, focusing on potential POST requests.

  - **Review legitimate usage**: Identify if the process has a valid business use in your environment. Legitimate uses of headless browsers may include automated testing or scraping of internal web applications, which should demonstrate appropriate command lines and URLs.

  - **Correlate with other indicators**: Investigate any additional alerts or anomalies happening within the timeframe of the execution. For instance, check for abnormal data flows or unauthorized intrusions from other logs (e.g., EDR or firewall logs).

  ### Prioritization

  This alert is considered high severity due to the potential for data exfiltration and the exploitation of widely-used browser capabilities. The likelihood of malicious abuse is elevated, as headless browser execution is becoming a common technique among adversaries to bypass conventional monitoring methods.

  ### Blind Spots and Assumptions

  Detection may have limitations if logging for process creation is not sufficiently configured or if the captured arguments are tampered with. Legitimate activities such as automated web scraping or internal testing might trigger this alert, complicating the investigation. A related detection to consider is monitoring for abnormal HTTP requests to known exfiltration services for enhanced vigilance.

