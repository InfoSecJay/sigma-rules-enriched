title: Chromium Browser Headless Execution To Mockbin Like Site
id: 1c526788-0abe-4713-862f-b520da5e5316
status: test
description: Detects the execution of a Chromium based browser process with the "headless"
  flag and a URL pointing to the mockbin.org service (which can be used to exfiltrate
  data).
references:
- https://www.zscaler.com/blogs/security-research/steal-it-campaign
author: X__Junior (Nextron Systems)
date: 2023-09-11
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\vivaldi.exe'
  selection_headless:
    CommandLine|contains: '--headless'
  selection_url:
    CommandLine|contains:
    - '://run.mocky'
    - '://mockbin'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_browsers_chromium_mockbin_abuse/info.yml
note: |
  ### Technical Context
  This detection rule identifies suspicious activity related to the execution of Chromium-based browsers (such as Chrome, Brave, and Edge) in headless mode while targeting URLs linked to mockbin.org, a service that can be exploited to exfiltrate sensitive data. The detection focuses on scenarios where attackers may utilize headless browsers for automated tasks, including data scraping or unauthorized data transmission back to third-party services like mockbin.org, which acts as a mock API that can be used for testing or as a covert data exfiltration endpoint.

  The likely attacker objectives in this scenario include stealing sensitive information, performing automated data requests, or orchestrating malicious activities without being directly observed. By utilizing headless browsers, attackers can reduce their chances of detection during the data exfiltration process. Relevant MITRE ATT&CK tactics include “Execution” (TA0002), specifically techniques related to "User Execution" (T1203) or "Command and Scripting Interpreter" (T1059).

  Primary data sources that provide the best evidence for this detection include process creation logs from Windows systems, which will capture command line arguments associated with the execution of the Chromium-based browsers as well as their associated URLs.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of headless browser execution, specifically `chrome.exe`, `brave.exe`, and other Chromium variants that include the `--headless` flag in the command line.
  - **Analyze Command-Line Arguments:** Identify and scrutinize the full command line for executed browser processes, focusing on whether the URL includes endpoints like `mockbin.org` or similar domains used for exfiltration.
  - **Check Network Connections:** Monitor outbound traffic to verify if there are any unexpected connections to mockbin.org or other suspicious domains that could indicate data exfiltration.
  - **Correlate User Activity:** Assess user activity and system logs to determine whether the execution of the headless browser aligns with legitimate user behavior or if it appears anomalous based on previous patterns.

  ### Prioritization
  Given the potential for data exfiltration and the high likelihood of a malicious intent behind headless browser usage, alerts generated by this rule should be treated as high priority. The implications of sensitive data being compromised necessitate immediate investigation and response.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logs from host systems do not capture all instances of process creation or command line arguments, particularly if security settings are misconfigured. The detection logic assumes that the targeted execution of headless browsers with the specified flags and URLs indicates potential malicious activity; however, legitimate use cases may exist that are not accounted for. Proper logging and configuration of process creation events are essential for this alert to function effectively, and any absence of these logs could lead to undetected incidents.

