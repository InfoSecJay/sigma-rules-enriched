title: Potential PowerShell Console History Access Attempt via History File
id: f4ff7323-b5fc-4323-8b52-6b9408e15788
status: experimental
description: |
  Detects potential access attempts to the PowerShell console history directly via history file (ConsoleHost_history.txt).
  This can give access to plaintext passwords used in PowerShell commands or used for general reconnaissance.
references:
- https://0xdf.gitlab.io/2018/11/08/powershell-history-file.html
author: Luc Génaux
date: 2025-04-03
tags:
- attack.credential-access
- attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'ConsoleHost_history.txt'
    - '(Get-PSReadLineOption).HistorySavePath'
  condition: selection
falsepositives:
- Legitimate access of the console history file is possible
level: medium
note: |
  ### Technical Context

  This rule detects attempts to directly access the PowerShell console history file (`ConsoleHost_history.txt`), which may reveal sensitive information such as plaintext passwords and command usage patterns. The likely attacker objective is to gather credentials or reconnaissance data through previously executed PowerShell commands. This behavior aligns with the MITRE ATT&CK tactic "Credential Access" (ID: T1552.001), specifically focusing on techniques that exploit saved credentials.

  The primary telemetry sources for this detection include Process Creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which capture details on command-line executions. If a malicious actor successfully accesses this history file, it could lead to significant security breaches, including credential theft and escalation of privileges. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate users may access their history for valid reasons.

  ---

  ### Investigation Steps

  - **Review process creation logs for attempts to access the history file:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for command lines containing `ConsoleHost_history.txt` or `(Get-PSReadLineOption).HistorySavePath`.

  - **Identify the user and host:** Determine the user account and the host system from which the command was executed using the `SubjectUserName` and `NewProcessName` fields in the process creation logs.

  - **Assess legitimate usage:** Validate if the user typically interacts with PowerShell for benign tasks, such as system administration or automation tasks; consider reviewing user activity patterns to establish legitimacy.

  - **Look for high-confidence malicious indicators:** Inspect for unusual process chains where PowerShell is invoked to access the history file, especially if followed by suspicious commands or scripts, as seen in the `CommandLine` field of the logs.

  - **Correlate with other telemetry sources:** Cross-reference any relevant logs (e.g., Windows Event ID 4624 for logon events or application logs for administrative activities) to determine if the user had legitimate access rights or if there were recent privilege escalations.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on credential confidentiality. The behavior could be exploited for malicious purposes, especially since PowerShell is commonly weaponized in various attacks. However, the likelihood of benign access is notable in enterprise environments where operational users frequently interact with PowerShell.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques could include renaming the history file or accessing it through alternate paths, which may not be captured by this detection. Reliable detection requires logging configurations for both Process Creation logs and Sysmon events, ensuring comprehensive visibility. Furthermore, legitimate PowerShell users may trigger this alert when they access their command history for troubleshooting or educational purposes. Companion detections related to anomalous PowerShell execution (such as downloading and running scripts) can enhance overall coverage against credential harvesting attempts.

