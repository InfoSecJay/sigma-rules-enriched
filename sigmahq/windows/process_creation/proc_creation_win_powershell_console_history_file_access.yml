logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'ConsoleHost_history.txt'
    - '(Get-PSReadLineOption).HistorySavePath'
  condition: selection
falsepositives:
- Legitimate access of the console history file is possible
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects attempts to access the PowerShell console history file (ConsoleHost_history.txt), which can reveal sensitive information such as plaintext passwords used in PowerShell commands or other reconnaissance activities. The likely attacker objective is to extract stored credentials or other sensitive PowerShell command usage history that may assist in further exploitation.

  The relevant MITRE ATT&CK tactic is Credential Access, with the technique identified as T1552.001. The primary telemetry source is Windows process creation logs, specifically focusing on command-line arguments. If malicious, gaining access to this file can significantly undermine system security by exposing sensitive operational data. Importantly, this detection does not confirm intent; legitimate access to the console history file may occur in benign contexts.

  ---

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 for process creation events matching the command line containing 'ConsoleHost_history.txt' or '(Get-PSReadLineOption).HistorySavePath.' Assess the context of the process creator and their role.

  - **Analyze recent PowerShell activity:** Check for PowerShell command usage in Security Event ID 4688 with a focus on user accounts and processes that invoked PowerShell. Investigate commands that may have accessed sensitive information beforehand to identify potential malicious intent.

  - **Identify high-confidence malicious indicators:** Look for unusual user accounts executing the command, especially if coupled with elevated privileges or from non-standard workstations. This can indicate unauthorized attempts to access sensitive history.

  - **Review expected behavior:** Confirm legitimate instances where administrative users access console history for valid reasons, checking for audit records or internal documentation regarding such activities.

  - **Correlate with user behavior analytics:** If available, compare activities against expected behavioral profiles for the user involved. Unusual access patterns or spikes in activities can be a sign of compromise.

  - **Check for subsequent lateral movement:** Investigate if there are any subsequent logins or command executions using the sensitive information accessed from the history file, tracking any elevated credential usage.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact of the affected system, which may be used to access credentials that lead to further compromise. The likelihood of malicious abuse is considerable, especially in environments with sensitive data or critical infrastructure where attackers often seek credential access. This behavior is weaponized and commonly exploited in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the PowerShell history file is deleted or if proper logging is not configured for process creation. Additionally, legitimate administrative tasks may trigger this alert, such as authorized personnel accessing the history file for valid reasons. A related detection to strengthen coverage is monitoring for anomalous PowerShell execution patterns (e.g., detection of encoded commands or suspicious script blocks) that may indicate broader exploitation efforts.

