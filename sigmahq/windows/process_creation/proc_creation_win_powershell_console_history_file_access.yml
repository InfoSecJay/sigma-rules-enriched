title: Potential PowerShell Console History Access Attempt via History File
id: f4ff7323-b5fc-4323-8b52-6b9408e15788
status: experimental
description: |
  Detects potential access attempts to the PowerShell console history directly via history file (ConsoleHost_history.txt).
  This can give access to plaintext passwords used in PowerShell commands or used for general reconnaissance.
references:
- https://0xdf.gitlab.io/2018/11/08/powershell-history-file.html
author: Luc Génaux
date: 2025-04-03
tags:
- attack.credential-access
- attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'ConsoleHost_history.txt'
    - '(Get-PSReadLineOption).HistorySavePath'
  condition: selection
falsepositives:
- Legitimate access of the console history file is possible
level: medium
note: |
  ### Technical Context
  This detection rule targets unauthorized attempts to access the PowerShell console history file, specifically `ConsoleHost_history.txt`. An attacker may attempt to access this file to retrieve sensitive information, including plaintext passwords and command history, which can aid in further attacks or system manipulation. The primary goal for an adversary is to extract credentials or gather intelligence about system configurations and security postures.

  This behavior aligns with the MITRE ATT&CK framework, specifically the tactic of **Credential Access** (TA0006) and technique **T1552.001: User Credentials from Password Stores**. The detection logic focuses on instances where the command line contains references to accessing the history file or the use of PowerShell commands to retrieve history options. Given that `ConsoleHost_history.txt` may contain sensitive commands and credentials, its unauthorized access represents a significant breach of confidentiality and integrity.

  The primary data source for this detection will be process creation events from the Windows operating system, as these logs will capture command line executions that invoke attempts to read or access the history file.

  ### Investigation Steps
  - **Review Process Creation Events:** Check the process creation logs for any instances where the command line contains 'ConsoleHost_history.txt' or related commands indicating attempts to access PowerShell console history.
  - **Analyze User Activity:** Investigate the user accounts associated with these events. Determine if the access attempts were made by anomalous users or from unusual locations.
  - **Correlate with Authentication Logs:** Look for any failed or unusual logins around the time of the access attempts to the history file. A spike in access might indicate potential unauthorized activity or compromised accounts.
  - **Check for PowerShell Script Execution:** Examine logs for PowerShell scripts executed by the same user. Identify any scripts that may have contained commands related to credential access or reconnaissance prior to accessing the history file.

  ### Prioritization
  The alert is categorized with medium severity due to the potential risk of credential exposure which can lead to escalation of privileges or further lateral movement within the environment. The likelihood of successful exploitation depends on the level of security controls and monitoring in place.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process creation logs, which may not capture tools or techniques that use direct file access methods bypassing conventional logging mechanisms. The detection logic assumes that attempts to read the console history file will be logged as a process creation event, which may not hold true in every configuration. It is crucial that Windows logging settings are correctly configured to capture detailed command line parameter logging for accurate detection. Without proper monitoring of access to sensitive files, there is a risk of missing attempts to exploit PowerShell history files unnoticed.

