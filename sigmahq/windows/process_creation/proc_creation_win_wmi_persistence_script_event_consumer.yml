  ### Technical Context

  This Sigma rule detects the creation of a WMI Script Event Consumer, a potential persistence mechanism commonly used by attackers. The likely objective is to maintain long-term access to the system, often enabling the execution of malicious scripts in response to specific events, effectively allowing for covert operations without detection. The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1546.003** (Event Triggered Execution: WMI Event Subscription).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on event ID **4688** (Process Creation) and potentially related Sysmon logs if deployed (Event ID **1**). If this behavior is malicious, it can facilitate ongoing compromise of the affected host, allowing attackers to execute arbitrary code. However, it is crucial to note that the detection of a WMI Script Event Consumer does not inherently confirm malicious intent, as legitimate applications may also create similar event consumers.

  ### Investigation Steps

  - **Examine process creation logs**: Review Windows Security Event ID **4688** logs to identify instances of `scrcons.exe` being initiated by `svchost.exe`. A legitimate process creation would typically originate from `wscript.exe` or `cscript.exe` rather than directly from `svchost.exe`.

  - **Verify event consumer properties**: Use WMI queries (`wmic`) to check the properties of the detected event consumer. Look for suspicious script paths or parameters; benign consumers typically reference legitimate scripts or applications known to your environment.

  - **Correlate with historical changes**: Investigate if any recent changes to WMI namespaces or classes have occurred that correlate with the detection. This can be done using Event ID **15** (WMI) logs to look for unauthorized modifications that may indicate an adversary attempting to establish persistence.

  - **Analyze network connections**: Check for anomalous outbound connections from the affected host during the execution period of the `scrcons.exe` process, particularly from Event ID **5156** (Windows Filtering Platform), indicating potential exfiltration or command and control (C2) communications.

  - **Identify legitimate usage**: Review any documented uses of WMI event consumers for legitimate business applications within your organization. If an internal team leverages `scrcons.exe` without malicious intent, this should be noted as a benign indicator.

  - **Look for known malicious indicators**: If the path to the script executed by the WMI consumer is obfuscated or references unknown third-party applications, this could signal a malicious intent. Compare the script paths against threat intelligence databases for any known malicious signatures.

  ### Prioritization

  The severity of this alert is medium, as the system impacted may have critical functions, and WMI event consumers could be leveraged for persistent access by adversaries. The likelihood of malicious abuse is heightened due to the covert nature of WMI manipulation, which aligns with common exploitation tactics employed by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited if WMI logging is not fully enabled, as legitimate scripts may also trigger the rule. Additionally, adversaries might use legitimate system processes to bypass detection. False positives can occur with known software (e.g., Dell brightness controls) that create WMI event consumers. Companion detections relating to abnormal child processes or unexpected WMI script execution (e.g., via **Event ID 4688**, looking for scripts run without user interaction) could strengthen coverage.

