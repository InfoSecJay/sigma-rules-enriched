  ### Technical Context
  This rule detects the creation and execution of WMI (Windows Management Instrumentation) Script Event Consumers, which are often used for persistence mechanisms in Windows environments. Attackers may exploit these events to execute code without user interaction, allowing them to maintain a foothold in the system even after reboots. The goal of utilizing WMI Script Event Consumers is generally related to executing payloads or commands whenever a specific event occurs, thus achieving stealthy persistence and potentially escalating privileges.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Persistence** (T1546.003): Utilizing WMI to create event consumers that trigger on certain events, enabling attackers to maintain delayed execution of malicious scripts.
  - **Privilege Escalation** (T1548.002): Leveraging WMI to act as a means to gain higher privileges within the operating system context.

  The primary data sources for this detection include process creation logs to identify the execution of `scrcons.exe` and its parent process `svchost.exe`. These logs are crucial as they show how WMI event consumers are initiated and can reveal malicious use.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for any instances of `C:\WINDOWS\system32\wbem\scrcons.exe` being executed. Pay particular attention to parent processes, especially if they are `C:\Windows\System32\svchost.exe`, which may indicate malicious usage.

  - **Analyze WMI Event Consumer Configurations**: Query the WMI namespace for active event consumers, specifically looking for unusual or unauthorized entries that do not align with known business operations or system configurations.

  - **Identify Related Event Logs**: Examine the Windows Event Logs for corresponding entries (e.g., Event ID 27 for WMI) around the timeframe of the detected `scrcons.exe` execution, to identify any triggers or anomalies.

  - **Correlate with Other Indicators**: Investigate other telemetry, such as EDR or NDR logs, for any related suspicious activity or indicators of compromise associated with the system hosting `scrcons.exe`.

  ### Prioritization
  This alert is considered medium priority due to the potential for stealthy persistence and privilege escalation in an enterprise environment, which poses a significant risk if left unaddressed. Attackers using this method could maintain access for a prolonged period, increasing the likelihood of data breaches or exploitation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise from legitimate WMI consumers that organizations use for automation, which could lead to false positives. Additionally, the detection logic assumes that all initiations of `scrcons.exe` from `svchost.exe` are suspicious, which may not account for legitimate business processes. Required logs include comprehensive process creation logs and access to WMI event logs to ensure that all relevant executions are captured and analyzed.

