note: |
  ### Technical Context

  This rule detects the execution of `scrcons.exe`, which is the WMI Script Event Consumer. This executable is invoked in response to the creation of an ActiveScriptEventConsumer instance, subsequently executing predefined scripts in VBScript or JScript. Attackers may leverage script event consumers to establish persistence on compromised hosts by triggering malicious scripts based on specific system events.

  The relevant MITRE ATT&CK technique is **T1546.003: WMI Event Subscription**. Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If this detection is confirmed as malicious, it may indicate an ongoing compromise that can allow unauthorized access to sensitive information or control over the system. However, it’s crucial to note that this detection alone does not confirm malicious intent; legitimate administrative tasks may also involve `scrcons.exe`.

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for processes related to `C:\WINDOWS\system32\wbem\scrcons.exe`. Look for suspicious parent processes, especially if the parent is `C:\Windows\System32\svchost.exe`.

  - **Check Event Consumer Configurations:** Query WMI for the ActiveScriptEventConsumer instances using `wmic /namespace:\\root\subscription path __eventConsumer`. Identify any consumers that execute scripts not recognized as benign or that appear out of context.

  - **Identify Legitimate Use Cases:** Confirm with IT or system admins whether event consumers are configured as expected on the affected system. Specifically, note any consumers related to legitimate applications or system management operations.

  - **Analyze Stored Scripts:** Inspect the active scripts (JScript or VBScript) executed by the event consumer. Validate these scripts against authorized signatures or hashes to determine if they may contain malicious code.

  - **Correlate with Additional Logs:** Review Windows Event Logs related to the event being consumed (e.g., Security, Application, or System logs) for indications of abnormal activity occurring around the same time `scrcons.exe` was executed.

  - **Look for Evasive Behavior:** Investigate the execution context and environment. Check if `scrcons.exe` is being run with elevated privileges or in a suspicious manner, possibly indicating a bypass of standard controls or auditing.

  ### Prioritization

  This alert should be considered medium priority due to the potential for significant impact on the affected system through persistence mechanisms. The likelihood of malicious abuse is moderate, as script event consumers can be repurposed by adversaries, but they are also commonly used in legitimate administrative tasks.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for WMI events is not adequately configured. Adversaries may utilize obfuscation techniques to mask malicious scripts. Additionally, legitimate administrative practices, such as software updates or changes to hardware settings, could trigger this alert. Companion detections, such as monitoring WMI for abnormal event subscriptions or observing parent process chains starting from `svchost.exe`, can enhance overall detection capabilities.

