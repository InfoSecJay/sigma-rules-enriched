note: |
  ### Technical Context

  This Sigma rule detects the execution of the `gpresult.exe` utility with specific command-line arguments, typically used to display Resultant Set of Policy (RSoP) information in Windows environments. An attacker may use this to gather reconnaissance data about Group Policies affecting a machine, which can assist in privilege escalation or lateral movement by identifying permissions and restrictions. This activity aligns with the MITRE ATT&CK tactic of "Discovery" and specifically the technique T1615 (Accessing Group Policy Objects).

  The primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log details such as process creation and command line arguments. If malicious, the execution of `gpresult` may lead to unauthorized access to sensitive configuration information related to security policies. Importantly, the detection of this command execution does not confirm malicious intent on its own, as legitimate administrators may also run this tool.

  ### Investigation Steps

  - **Verify Command Context:** Check the command line arguments used with `gpresult.exe` by reviewing Security Event ID 4688 or Sysmon Event ID 1. Look for the presence of `/z` or `/v`, which indicate detailed output that is often unnecessary for normal administrative tasks.

  - **Look for Anomalous User Behavior:** Analyze the user account that executed `gpresult.exe`. Cross-reference this with user activity logs. Legitimate usage typically involves known administrative accounts, while unfamiliar accounts executing this command may indicate a security incident.

  - **Assess System Role:** Identify the role of the affected system (e.g., Domain Controller, workstation) as this impacts the criticality of the alert. Execution on Domain Controllers is more severe, given the sensitive information related to group policies.

  - **Investigate Prior Activity:** Review preceding logs for other potentially malicious activities on the same host that may indicate a compromise, such as unusual credential usage or unapproved software installations (check Security Event ID 4624 for logon events).

  - **Correlate with Reconnaissance Patterns:** Use threat intelligence to determine if this usage correlates with known adversary behaviors, especially from tools like Turla or Emissary, which employ similar techniques. Cross-reference with related detections of reconnaissance tools for a broader context.

  ### Prioritization

  This alert should be treated with medium severity, as while execution of `gpresult.exe` can indicate reconnaissance efforts, context greatly influences its impact. Workstations or servers vulnerable to privilege escalation might be targeted, but potential benign use by legitimate administrators necessitates careful analysis before responding.

  ### Blind Spots and Assumptions

  Common evasion techniques include running `gpresult` under a legitimate user account or using alternative methods to query Group Policy data that may not trigger alerts. This rule requires well-configured logging, particularly enabling detailed process creation logs (Sysmon or native Windows Event Logging). Legitimate administrative actions, such as regular policy audits or troubleshooting, might also trigger the alert. It is beneficial to implement companion detections for related reconnaissance activities, such as monitoring for LDAP enumeration (MITRE ATT&CK T 0468) to enhance overall visibility of possible adversarial movements.

