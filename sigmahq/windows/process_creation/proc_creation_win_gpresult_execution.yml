  ---

  ### Technical Context

  This rule detects the execution of the Windows `gpresult.exe` command-line utility with specific parameters that display the Resultant Set of Policy (RSoP) information. Attackers may use this utility to gather sensitive information about group policies applied to the system, potentially for further exploitation or lateral movement within a network. This behavior is relevant to the MITRE ATT&CK discovery tactic, specifically technique **T1615: Activity from External Remote Services**.

  The primary telemetry source is Windows process creation logs, specifically noting Event ID 4688, which will provide insights into the execution of `gpresult.exe`. If this behavior is indicative of malicious activity, it can lead to unauthorized access or enumeration of critical resource configurations. Notably, this detection does NOT confirm malicious intent solely based on the execution of `gpresult.exe`, as legitimate administrative tasks can trigger this command.

  ---

  ### Investigation Steps

  - **Identify suspicious command execution:** Examine Windows Security Event ID **4688** for `gpresult.exe` execution, especially with `/z` or `/v` flags indicating verbose output. Log fields of interest include `NewProcessName` and `CommandLine`.

  - **Review the context of command execution:** Cross-reference the user account initiating `gpresult.exe` with existing user roles. Administrative accounts executing this command might indicate benign activity, while standard user accounts executing this can raise suspicion.

  - **Compare with recent group policy changes:** Check for significant changes in Group Policy Objects (GPOs) using Event ID **5136** (Directory Service Changes). Compare timestamps and correlating users for any malicious indicators.

  - **Investigate system roles and criticality:** Assess affected assets to determine if they are critical infrastructure. Devices with high privilege or critical roles should produce less benign activity when executing commands like `gpresult.exe`.

  - **Look for ancillary artifacts:** Validate creation of unexpected scripts or scheduled tasks that accompany `gpresult.exe` execution in logs using Event ID **4697** (Service Installation) or **4698** (Scheduled Task Creation).

  ---

  ### Prioritization

  This alert carries medium severity as it targets potentially sensitive GPO information, which could be leveraged by attackers for privilege escalation or lateral movement. The likelihood of malicious exploitation is moderate due to the availability of the `gpresult.exe` utility for both legitimate and illegitimate purposes, although it is notably less frequently weaponized in common attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative tasks can invoke this command; therefore, manual verification is required to assess intent. Additionally, reliable detection necessitates enabling Windows Security Auditing for process creation logs and directory service changes. Legitimate activities, such as routine GPO audits by administrators, may trigger the alert. A companion detection that could strengthen coverage is alerting on unusual patterns of GPO modification, especially in conjunction with `gpresult.exe` executions.

