title: Potential MsiExec Masquerading
id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
status: test
description: Detects the execution of msiexec.exe from an uncommon directory
references:
- https://twitter.com/200_okay_/status/1194765831911215104
author: Florian Roth (Nextron Systems)
date: 2019-11-14
modified: 2026-10-31
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `msiexec.exe` from uncommon directories, which are typically not standard for legitimate Windows Installer operations. Attackers may utilize this behavior to execute malicious payloads while masquerading as legitimate process activity. The main objective is often to gain unauthorized access or execute malware under the guise of system processes.

  This detection aligns with the MITRE ATT&CK technique T1036.005 (Masquerading: Match Legitimate Name or Location). The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide information about process creation activities. If the behavior is malicious, it could indicate an attempt to infiltrate or compromise the system. Notably, this rule does not confirm a malicious incident on its own; the context surrounding the execution must be evaluated.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for entries where `msiexec.exe` is executed. Look for the `CommandLine` field for unusual arguments or behaviors.

  - **Identify execution directory:** Determine the directory the `msiexec.exe` process is launched from. Legitimate executions typically come from `C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`. Execute path discrepancies might indicate malicious intent.

  - **Correlate with other behaviors:** Look for additional suspicious activity in proximity to the `msiexec.exe` events, such as unexpected file creations or registry modifications. For detailed analysis, review Application Event Logs for recent installations or system changes.

  - **Validate against a threat database:** Cross-reference the file hash of the `msiexec.exe` instance against known threat intelligence databases. Malicious indicators may include known bad file hashes associated with malware.

  - **Examine user context:** Check the user account associated with the `msiexec.exe` execution. Benign instances often involve System or Administrator accounts. Suspect accounts or unusual login patterns should be escalated.

  - **Review recent installation logs:** Investigate Windows Installer logs located in `C:\Windows\Temp` for any installation processes triggered around the same time as the alert. Legitimate activity will generally match expected software update or installation timelines.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact, particularly if executed on critical systems such as domain controllers or servers. The likelihood of malicious abuse is elevated, as adversaries frequently exploit such methods to conceal their activities. Moreover, `msiexec.exe` is a commonly weaponized process, enhancing the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of event logging; ensure that Windows process creation logging is enabled and comprehensive. Evasion techniques might include running `msiexec.exe` from whitelisted locations or using alternate file names. Legitimate MSI installations, such as software updates, may inadvertently trigger this alert. A companion detection to consider is monitoring for abnormal DLL loading patterns with `Sysmon Event ID 7`, as this can provide further context into the execution of `msiexec.exe`.

