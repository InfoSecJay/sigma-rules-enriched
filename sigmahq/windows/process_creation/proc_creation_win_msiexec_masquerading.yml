title: Potential MsiExec Masquerading
id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
status: test
description: Detects the execution of msiexec.exe from an uncommon directory
references:
- https://twitter.com/200_okay_/status/1194765831911215104
author: Florian Roth (Nextron Systems)
date: 2019-11-14
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: '\msiexec.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` from uncommon directories outside its standard locations, which could indicate an adversarial attempt to misuse legitimate Windows installer functionality for malicious purposes. Attackers may leverage `msiexec.exe` to manage software installations, execute payloads, or manipulate system settings under the guise of valid activity. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "Masquerading" (T1036.005).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity can lead to privilege escalation, unauthorized software installation, or persistence on the system. Importantly, this detection alone does not confirm malicious activity, as legitimate software installers could also execute `msiexec.exe` from non-standard locations due to misconfigurations or unusual software installations.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `msiexec.exe` being executed from directories outside standard paths (`C:\Windows\System32\`, `C:\Windows\SysWOW64\`, `C:\Windows\WinSxS\`). Evaluate the user account executing the process for legitimacy.

  - **Analyze the command line arguments:** Extract and review command line arguments from the event to assess the intent of the execution. Look for unusual flags or files that do not correspond with typical software installation commands, which can indicate malicious usage.

  - **Review related file changes:** Check for file creation or modification events that coincide with the execution of `msiexec.exe`. Validate against expected behavior; legitimate software installations usually create known installer files that align with the process context.

  - **Investigate parent process:** Analyze the parent process of `msiexec.exe`. If the parent process is atypical or has been associated with previous malicious activity, it raises the suspicion of an attack chain being executed.

  - **Identify historical executions:** Compare the telemetry of the detected execution with historical data to identify patterns or repeated uses from the same directory. Frequent attempts could indicate iterative malware deployment strategies.

  - **Assess system context:** Consider the role or criticality of the affected system. Systems hosting sensitive data or critical applications should prompt a higher urgency for investigation, especially when uncommon execution paths are involved.

  ### Prioritization

  This alert carries high severity due to the potential impact on system integrity. Executing `msiexec.exe` from non-standard directories may indicate an attempt to bypass security controls, risking both data compromise and lateral movement within the network. Such behaviors are commonly weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using legitimate applications that also call `msiexec.exe`. Logs must be properly configured to capture process creation events reliably across all hosts. Legitimate activities, such as corporate software deployment tools, may trigger similar alerts and should be assessed in conjunction with inventory systems. For enhanced coverage, consider companion detections for modifications to system or application logs which may indicate post-execution activities (e.g., lateral movement attempts or privilege escalations).

