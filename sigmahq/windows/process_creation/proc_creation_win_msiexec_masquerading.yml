title: Potential MsiExec Masquerading
id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
status: test
description: Detects the execution of msiexec.exe from an uncommon directory
references:
- https://twitter.com/200_okay_/status/1194765831911215104
author: Florian Roth (Nextron Systems)
date: 2019-11-14
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: '\msiexec.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of msiexec.exe, a legitimate Windows Installer utility, from directories that are not typically associated with this executable. Attackers may misuse msiexec.exe to execute malicious scripts or payloads while masquerading as a trusted system process, which is a common tactic in evasion techniques. Their objective could include installing malware, escalating privileges, or delivering payloads stealthily.

  Relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion** (TA0005) and **Masquerading** (T1036.005). By executing an essential Windows utility from an unusual directory, the attacker aims to blend in with normal activities, complicating detection efforts.

  Primary data sources for this detection include process creation events, which log the execution of processes and their originating paths. Monitoring this data can reveal suspicious instances of msiexec.exe, thereby preventing potential threats.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events to identify instances of msiexec.exe running from uncommon directories. Pay close attention to the file path and command-line arguments used during execution.
  - **Correlate with File Reputation:** Check the reputation of the file being executed alongside msiexec.exe. Determine if the original file is known to be legitimate or if it has appeared in previous security incidents.
  - **Analyze Parent Processes:** Look at the parent processes of the msiexec.exe execution. Investigate whether they are also suspicious, and assess if there are any indicators of abnormal behavior or exploitation attempts.
  - **Assess Network Activity:** Review network traffic logs for any unusual outbound connections or downloads associated with the execution of msiexec.exe. This could provide insight into potential data exfiltration or command and control (C2) communications.

  ### Prioritization
  The alert is considered high severity due to the potential impact on the enterprise environment. The unauthorized execution of msiexec.exe can lead to significant security breaches, including the installation of persistent malware, making timely investigation critical.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious msiexec.exe execution, particularly if attackers utilize legitimate paths or manipulate the process name. The effectiveness of this rule assumes that process creation logs are being captured and retained correctly. If the logs are not configured to record this level of detail, or if atypical execution paths are frequently used without alerting, gaps in detection coverage will exist. Additionally, false positives may arise from benign user activities running legitimate installers from non-standard directories.

