title: Potential MsiExec Masquerading
id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
status: test
description: Detects the execution of msiexec.exe from an uncommon directory
references:
- https://twitter.com/200_okay_/status/1194765831911215104
author: Florian Roth (Nextron Systems)
date: 2019-11-14
modified: 2023-02-21
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: '\msiexec.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `msiexec.exe` from directories outside of its typical system paths (`C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`). This behavior may indicate an attacker using process masquerading techniques to run malicious code disguised as legitimate Windows installation processes. The likely objective of the attacker is to manipulate installation mechanisms to deploy malware, conduct lateral movement, or evade detection.

  This detection aligns with the MITRE ATT&CK tactic "Defense Evasion" and technique "Masquerading" (T1036.005). The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details of process launches. If malicious, the execution of `msiexec.exe` can indicate a higher likelihood of compromise or ongoing malicious activity. However, this detection alone does not confirm that malicious activity is occurring, as legitimate software may also use `msiexec.exe` from uncommon locations under certain conditions.

  ### Investigation Steps

  - **Examine process creation logs: ** Check Security Event ID 4688 and Sysmon Event ID 1 for `msiexec.exe` executions. Look for anomalies in the full path, especially tracing back to uncommon directories like user profiles or application data.

  - **Review command-line arguments: ** Analyze the command-line string associated with the `msiexec.exe` process. Malicious executions may contain suspicious flags (e.g., unexpected installation packages or paths). Legitimate executions typically have common arguments such as `/i` for installation from known sources.

  - **Check parent process relationships: ** Investigate the parent process of the detected `msiexec.exe`. Malicious activity often originates from unusual parent processes such as scripts (PowerShell, cmd) or other non-installation tools. In contrast, legitimate processes might originate from system management tools or trusted applications.

  - **Correlate with known good behavior: ** Validate expected behavior by cross-referencing with typical installation logs. For example, legitimate enterprise software installations will usually be logged by SCCM or equivalent software management solutions.

  - **Identify high-confidence indicators: ** Focus on instances where `msiexec.exe` is running from paths like `%TEMP%` or user-generated directories. Executions from these locations are more likely to indicate an attempt to evade detection.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems if malicious activity is confirmed, particularly if it leads to system compromises or lateral movements. The likelihood of malicious misuse is significant; `msiexec.exe` is often weaponized for malicious installations. Organizations should be particularly vigilant as the use of process masquerading techniques is prevalent among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by an adversary’s ability to remove or manipulate log entries to obscure execution activities. Reliable detection requires proper configuration of Windows event logging, specifically for process creation events. Additionally, legitimate software installations or updates executed by administrative scripts may trigger the alert, resulting in false positives. A related detection to consider is monitoring unusual command-line parameters for process executions, which can complement this rule's coverage.

