note: |
  ### Technical Context

  This rule detects the unauthorized or suspicious execution of the PsExec service, specifically when it is renamed and launched from a non-standard location (C:\Windows\PSEXESVC.exe). Attackers may use PsExec for lateral movement within a network, allowing them to execute processes on remote systems without user interaction. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), with the technique being **Command and Scripting Interpreter** (T1059).

  The primary telemetry source is Windows process creation logs, notably Security Event ID 4688 or Sysmon Event ID 1. If malicious, the execution of a renamed PsExec service could facilitate command-and-control activities, escalate privileges, or lead to further exploitation of the environment. However, this detection does NOT confirm malicious intent on its own, as there may be legitimate administrative uses for PsExec under controlled circumstances.

  ### Investigation Steps

  - **Verify Process Creation:** Check for Security Event ID 4688 or Sysmon Event ID 1 for process creation events associated with C:\Windows\PSEXESVC.exe. Focus on the user context, command-line arguments, and parent process IDs to identify suspicious behavior.

  - **Analyze Parent Process:** Investigate the parent process of the PsExec execution. Look for parent processes that could indicate legitimate use (e.g., `psexec.exe` for administrative tasks) versus malicious indicators like unusual or unexpected executables indicating potential misuse.

  - **Check Path Consistency:** Validate whether the PsExec service was executed from its standard location. Legitimate uses typically run the original executable from its designated path or allow for installations in system folders. Renamed or unexpectedly placed instances can be suspicious.

  - **Investigate Network Connections:** Examine outbound connections initiated by the process (Event ID 5156 - Windows Filtering Platform) to identify any communication with known malicious addresses or unusual endpoints. Malicious uses often involve contacting external command and control servers.

  - **Observe Service Behavior:** Look for abnormal service entries or changes in system performance or behavior associated with the service execution. This includes unexpected CPU/memory usage or sudden spikes in network activity.

  - **Role of the Host:** If detected on critical servers (e.g., domain controllers, file servers), escalate the investigation due to the potential for high impact from lateral movement or further exploitation.

  ### Prioritization

  This alert should be treated with high severity, especially if triggered on critical or sensitive systems. The likelihood of malicious abuse is significant, as PsExec is commonly weaponized by attackers for lateral movement and payload execution. The potential impact of a compromised system makes immediate investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative access using PsExec, as certain IT roles may utilize it for remote management tasks, which can lead to false positives. Reliably detecting this event requires ensuring proper logging configurations are in place, particularly for process creation and other relevant security logs. One related detection that strengthens coverage is monitoring for unusual command-line arguments or the use of other remote execution tools, such as WinRM or WMI.

