note: |
  ### Technical Context
  This detection rule identifies the execution of `hh.exe` on Windows systems, specifically when it is used to open compiled HTML Help files (with a `.chm` extension). Attackers may leverage `hh.exe` to execute malicious content embedded within these help files, often as part of a larger strategy to deliver malware or exploit vulnerabilities in systems by bypassing conventional security measures. The ability to execute arbitrary scripts or commands as part of these `.chm` files allows attackers to remain stealthy while executing payloads, potentially leading to further compromise.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and more specifically the technique **Malicious File** (T1218.001), which pertains to the execution of potentially harmful files leveraging legitimate Windows binaries. Primary data sources for this detection include **process creation events**, which log when processes are started and can provide information about command-line arguments, alongside additional logging of application runs in Windows environments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation logs for instances of `hh.exe` launching with `.chm` files within the command line arguments. Look for any suspicious patterns or associated parent processes.
  - **Inspect Related User Activity**: Examine the user account associated with the execution of `hh.exe` to understand the context and legitimacy of the action. Check for prior behaviors that may indicate a compromise or unusual account activity.
  - **Correlate with Other Security Events**: Investigate any correlating security alerts or logs from EDR, SIEM, or other security tools that may indicate additional malicious activity at the time of the execution.
  - **Evaluate Remote Access Activity**: If `hh.exe` executions are observed, assess any remote access logs or unusual connections that could suggest an attacker is leveraging this execution as part of a command and control infrastructure.

  ### Prioritization
  Although the alert is currently rated low, it should be monitored closely due to the potential for misuse of `hh.exe` to launch malware via `.chm` files. In an enterprise environment, these vectors can lead to larger breaches if not addressed promptly, making them a moderate concern.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if legitimate usage of `.chm` files is widespread across the organization, leading to potential false positives in benign scenarios. The logic assumes that all instances of `hh.exe` opening `.chm` files are suspicious without exception, which may not account for legitimate administrative actions. Required configurations include having logging enabled for process creation events, as well as potential integration with threat intelligence sources to contextualize known bad actors utilizing this technique.

