note: |
  ### Technical Context

  This Sigma rule detects the execution of "hh.exe," a program utilized to render Compiled HTML Help files with a ".chm" extension. The likely attacker objective is to exploit the help file mechanism to deliver malicious payloads, often leading to system compromise or data exfiltration. This behavior correlates with the MITRE ATT&CK technique T1218.001 (Signed Binary Proxy Execution). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this can lead to a compromise, where attackers leverage the help system to bypass security controls. It is essential to note that this detection on its own does not confirm malicious intent, as legitimate users may also open ".chm" files for valid purposes.

  ### Investigation Steps

  - **Verify process creation details**: Investigate Security Event ID 4688 or Sysmon Event ID 1 to confirm the execution of "hh.exe". Look for the command line that includes paths ending in ".chm". Legitimate entries may show usage by known applications or system components.

  - **Check parent process behavior**: Review the parent process of the "hh.exe" execution in the process creation logs. A benign parent process may include Windows Explorer or a known application invoking help files. If a suspicious process invoked "hh.exe," it may indicate malicious activity.

  - **Analyze command line arguments**: Inspect the command line arguments associated with the "hh.exe" execution. Malicious instances may contain obfuscated parameters or call to unusual paths, contrasting with standard help file access patterns.

  - **Inspect for file manipulation or creation**: Use Sysinternals or Windows Event logs to detect any related file creation or modification within temp directories, as APTs may extract payloads from the ".chm" file. Look specifically for unusual file writes to locations like C:\Users\<Username>\AppData\Local\Temp.

  - **Review local network connections**: Check Windows Firewall logs for any outbound connections initiated shortly after "hh.exe" execution, which may indicate attempts at exfiltration or command-and-control contact.

  ### Prioritization

  The alert should be treated as low severity primarily because the frequency of legitimate "hh.exe" executions is relatively high, particularly in environments with legitimate help documentation usage. Malicious abuse is plausible but not the most common threat vector, lowering its urgency. While there has been reported weaponization using ".chm" files, the context of each event must be evaluated.

  ### Blind Spots and Assumptions

  Detection may be limited by users regularly accessing legitimate ".chm" files, potentially triggering false positives. Reliable detection requires retention of process creation logs and possibly Sysmon configurations for more detailed insights. Additionally, legitimate software updates or documentation access may also execute this behavior without malicious intent. Companion detections might include monitoring for file downloads of ".chm" files or their associated creation events in temp folders to provide more comprehensive coverage against exploitation attempts.

