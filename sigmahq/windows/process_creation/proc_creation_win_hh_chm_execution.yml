note: |
  ### Technical Context

  This Sigma rule detects the execution of `hh.exe`, primarily used to open compiled help files with a `.chm` extension, which could be indicative of an adversary attempting to execute a malicious payload embedded within such files. The likely objective of an attacker using this technique is to exploit unsuspecting users by delivering malicious content under the guise of legitimate help documentation. This behavior specifically maps to the MITRE ATT&CK framework as T1218.001 (Signed Binary Proxy Execution: Scripting).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the execution of `hh.exe` leads to the deployment of malicious content, it poses a significant security risk, potentially leading to unauthorized access, data exfiltration, or lateral movement. It is crucial to note that this detection alone does not confirm malicious intent, as legitimate applications may use `hh.exe` to access valid `.chm` files.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for instances where `hh.exe` is the process executed. Focus on the `CommandLine` field, specifically noting any associated `.chm` files.

  - **Check command line arguments:** Confirm whether the command line for `hh.exe` includes suspicious switches or parameters that deviate from typical usage (e.g., `hh.exe <legit_path>.chm`). Expected usage should show standard paths to known help files.

  - **Identify parent processes:** Investigate the parent process of `hh.exe` executions by checking the `ParentImage` field. Threat actors frequently spawn `hh.exe` from suspicious or non-standard applications (e.g., command shells, PowerShell).

  - **Look for repeated patterns:** Determine if there are multiple executions of `hh.exe` in a short timeframe from the same user or system, especially if accompanied by the execution of known malware or suspicious file types.

  - **Assess host context:** Evaluate the asset's criticality and role in your environment (e.g., is this system a user workstation or serves a critical function?). High-value assets require a more immediate and thorough investigation.

  - **Validate file artifacts:** Check for file artifacts associated with `hh.exe` execution by examining recent file modifications or creations in the directory containing the `.chm` file for evidence of unauthorized alterations or clear signs of exploitation.

  ### Prioritization

  The alert has a **low** severity rating. While `hh.exe` is a system process that can be exploited, its use is not uncommon for legitimate applications. Malicious abuse is possible, but context is crucial. The likelihood of this rule being associated with weaponized attacks is moderate but should be investigated, particularly in environments where `.chm` files are restricted or are not standard operating procedures.

  ### Blind Spots and Assumptions

  Detection may be limited by user behaviors, as legitimate application usage can trigger false positives, particularly in environments where `.chm` files are regularly utilized. The necessary log sources for reliable detection include both Security and Sysmon logs, requiring proper configuration to ensure coverage. Additionally, legitimate administrative tasks or user help requests may lead to similar behavior and should be considered during the investigation. Related detections to strengthen coverage include monitoring script execution behavior, especially PowerShell (T1059.001), as attackers may rely on scripts to create and execute help file exploits.

