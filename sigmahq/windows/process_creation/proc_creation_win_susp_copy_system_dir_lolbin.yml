note: |
  ### Technical Context

  This Sigma rule detects suspicious copy operations involving Living Off the Land Binaries (LOLBins) being copied from system directories (such as System32, SysWOW64, and WinSxS) to other locations on disk. The likely attacker objective is to manipulate commonly trusted binaries in order to obfuscate their actions and evade detections by security solutions. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1070) and the technique "Indicator Removal on Host" (T1036.003).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1, which provide insights into command execution and arguments. If malicious, the copying of these binaries could facilitate unauthorized actions or malicious payloads being executed within a trusted environment. However, this detection does NOT confirm that an actual attack has occurred, as legitimate administrative actions may also generate similar logs.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for command executions involving `cmd.exe`, `powershell.exe`, `robocopy.exe`, or `xcopy.exe` with `copy` or `copy-item` in the command line. Look for paths that contain System32, SysWOW64, or WinSxS.

  - **Analyze Source and Destination Locations**: Identify the source and destination of the copied files. If the destination is a user profile or a temporary folder, contrast this with typical administrative behaviors which often involve maintenance in respective applications or installation directories.

  - **Cross-Reference LOLBins**: Identify the specific LOLBins mentioned in the command line arguments (e.g., `bitsadmin.exe`, `certutil.exe`). Determine their legitimacy by checking if they are standard Windows components or if there has been unusual behavior associated with their processes.

  - **Verify Expected Administrative Actions**: Look for expected administrative activities or system updates that may justify similar commands. Organized IT maintenance reports or scheduled tasks running may provide context indicating benign behavior.

  - **Identify Malicious Indicators**: Check for unusual process chain behavior where LOLBins are spawned by unexpected parent processes, or if copying is rapidly followed by execution (e.g., immediate invocation of a LOLBin after copying it).

  - **Monitor for Evasion Techniques**: Investigate recent changes or configurations in the logging settings that can affect detection reliability, such as process hiding or log tampering behaviors which could obscure legitimate or malicious activities.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on system integrity and security if a trusted system binary is compromised. Copying and manipulating LOLBins is a common tactic used by adversaries and could indicate a progression toward exploit or persistence.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using alternative methods to access LOLBins or performing the actions outside of logged processes (e.g., using in-memory injection). Reliable detection relies on complete logging of process creations and command lines. Legitimate activities could include scheduled maintenance tasks that involve administrative operations with system binaries. A related detection, such as monitoring for the execution of LOLBins from unusual paths, would improve coverage and context around the alert.

