  ---

  ### Technical Context

  This Sigma rule detects suspicious copy operations involving known living-off-the-land binaries (LOLBINs) transferred from critical system directories (such as System32, SysWOW64, and WinSxS) to other locations on the disk. The likely attacker objective is to exploit these commonly present binaries to evade detection mechanisms that are less vigilant regarding their behavior in conducted operations from system directories. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (Tactic ID: TA0005) and specifically targets the technique "Masquerading" (T1036.003).

  The primary telemetry sources are Windows Process Creation logs, specifically focused on Security Event ID 4688, which records process creation events, and Sysmon Event ID 1 capturing detailed process creation and related parameters. The security impact is significant, as this may indicate an attempt to leverage legitimate system tools to execute malicious functionality, thus blending into normal operations. It is essential to note that this detection alone does not confirm any malicious intent without further corroborative evidence from different telemetry sources.

  ---

  ### Investigation Steps

  - **Analyze Process Creation Events:** Review Security Event ID 4688 for entries involving process creation commands ending with `cmd.exe`, `powershell.exe`, or any other tools listed in this rule, especially focusing on the command line parameters. Look for specific copy commands referencing system directories.

  - **Identify High-Confidence Malicious Indicators:** Check for copy operations targeting known LOLBINs (e.g., `bitsadmin.exe`, `mshta.exe`) using Sysmon Event ID 1. An entry with one of these binaries being copied from `\System32` or similar directories is a strong indicator of potentially malicious activity.

  - **Document Benign Use Cases:** Identify legitimate uses of the same LOLBINs and their expected behaviors, such as common administrative tasks in environments where these binaries are typically utilized without invoking unusual copy operations. Look for timestamps and correlating user accounts to assess the legitimacy.

  - **Check for Evasion Techniques:** Query the command line usage patterns for any encoded, obfuscated, or non-standard variations indicating attempts to bypass detection (e.g., unusual spacing, additional parameters, or argument misconfigurations).

  - **Inspect User Behavior:** Utilize user activity logs to determine normal usage patterns for the account executing the copy command. Deviations from established usage patterns, especially elevated administrative actions during the alert timeframe, warrant further scrutiny.

  - **Validate File Integrity and Exfiltration:** For systems involved, check file integrity logs or Windows Event ID 4663 for any unexpected file access patterns or unauthorized file creations after the copy operation, indicating potential exfiltration or misuse of system directories.

  ---

  ### Prioritization

  This alert is of high severity as it involves potential exploitation of critical system directories and tools in a way that could facilitate further reconnaissance or execution of malicious payloads. Given that the behavior targets known LOLBINs and attempts to circumvent detection by operating within trusted locations, it is highly relevant for threat assessment in the enterprise context.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate tools to be misused in ways similar to the detected behavior, such as scripting or automation in administrative tasks. Required log sources include comprehensive monitoring that must capture detailed command lines and original filenames for accurate detections. This alert could be triggered by benign activity, particularly in environments where administrative scripts routinely copy files for legitimate purposes. A related detection to strengthen coverage could include monitoring for unusual process tree activity originating from these LOLBINs, capturing higher-order malicious behaviors.

