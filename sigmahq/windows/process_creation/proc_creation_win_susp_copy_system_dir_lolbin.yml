logsource:
  category: process_creation
  product: windows
detection:
  selection_tools_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'copy '
  selection_tools_pwsh:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'copy-item'
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_tools_other:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_target_path:
    CommandLine|contains:
    - '\System32'
    - '\SysWOW64'
    - '\WinSxS'
  selection_target_lolbin:
    CommandLine|contains:
            # Note: add more binaries to increase coverage
    - '\bitsadmin.exe'
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmdl32.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
    - '\ie4uinit.exe'
  condition: 1 of selection_tools_* and all of selection_target_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify suspicious copy operations involving known living-off-the-land binaries (LOLBins) from critical system directories such as System32, SysWOW64, and WinSxS. Attackers often attempt to relocate these binaries to evade detection, leveraging their commonality and trust to execute malicious tasks without raising alarms. The threat scenario typically involves cyber adversaries who aim to maintain stealth within a compromised environment, moving LOLBins to avoid security tools focusing on traditional paths.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562)** - Techniques designed to evade detection by security solutions.
  - **Masquerading (T1036.003)** - Using LOLBins to imitate legitimate processes, thereby reducing the likelihood of detection.

  The primary data sources for this detection include process creation logs from the Windows operating system, which can provide insights into command-line activities executed by various tools like cmd.exe, PowerShell, and other file-copy utilities.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs to identify instances of `cmd.exe`, `powershell.exe`, `robocopy.exe`, and `xcopy.exe` performing copy operations, especially those echoed with suspicious command lines containing 'copy'.

  - **Analyze Command-Line Arguments:** Focus on instances where the command-line arguments indicate copying from known system directories (e.g., \System32, \SysWOW64) to other folders, which often signifies an attempt to manipulate LOLBins.

  - **Correlate with Known LOLBins:** Investigate cases where these tools are used to copy known LOLBins (e.g., `bitsadmin.exe`, `certutil.exe`) by validating the command lines against a list of high-risk binaries associated with prior enterprise incidents.

  - **Check for Time-and-Context Patterns:** Look for unusual timings or frequency of these operations, particularly in relation to user behavior profiles, as anomalies could indicate malicious intent.

  ### Prioritization
  The severity of this alert is high due to the potential for an attacker to manipulate trusted system binaries for malicious purposes, which could lead to significant breaches or persistence mechanisms within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding other obfuscated or custom-named copies of LOLBins, depending on the organization’s environment and policies. This detection logic assumes that the appropriate logging for process creation events is enabled and that relevant command-line parameters are not stripped or modified before logging. Without these logs, the detection will fail to capture the malicious activity effectively.

