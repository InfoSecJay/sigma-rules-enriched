    - '\bitsadmin.exe'
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmdl32.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
    - '\ie4uinit.exe'
  condition: 1 of selection_tools_* and all of selection_target_*
