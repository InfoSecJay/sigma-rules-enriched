logsource:
  category: process_creation
  product: windows
detection:
  selection_tools_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'copy '
  selection_tools_pwsh:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'copy-item'
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_tools_other:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_target_path:
    CommandLine|contains:
    - '\System32'
    - '\SysWOW64'
    - '\WinSxS'
  selection_target_lolbin:
    CommandLine|contains:
            # Note: add more binaries to increase coverage
    - '\bitsadmin.exe'
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmdl32.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
    - '\ie4uinit.exe'
  condition: 1 of selection_tools_* and all of selection_target_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the copying of known living-off-the-land binaries (LOLBINs) from common system directories (System32, SysWOW64, WinSxS) to other locations on disk, likely used to evade detections contingent on their original locations. The likely attacker objective is to camouflage malicious activities by abusing legitimate tools already present in the environment. This behavior correlates with the MITRE ATT&CK technique "Proxy Execution" (T1036.003), which leverages legitimate tools to execute malicious code.

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1, which will capture details about process execution and command-line arguments. If this detection is associated with malicious activity, it may signify attempts to perform lateral movement or persistence in a compromised environment. Importantly, this detection alone does not confirm intent; benign administrators may also copy binaries for legitimate purposes.

  ### Investigation Steps

  - **Review Process Creation Events**: Check for Security Event ID 4688 and Sysmon Event ID 1 to identify process creation events related to `cmd.exe`, `powershell.exe`, etc., and review command-line arguments for occurrences of "copy" and the specified LOLBIN names.

  - **Evaluate the Source Path of Executed Binaries**: Ensure that the original execution paths of the identified LOLBINs are indeed from System32, SysWOW64, or WinSxS. Legitimate copy operations from other directories may indicate benign activity.

  - **Identify Command-Line Patterns**: Look for command-line arguments that contain terms like `copy-item`, `cpi`, or `cp` alongside LOLBIN names. For example, `powershell.exe -command "copy-item C:\Windows\System32\calc.exe ..."` suggests potential misuse.

  - **Cross-reference with Historical Baselines**: Check for typical behavior patterns within the organization. Legitimate administrative tasks may frequently utilize similar commands. Understanding baseline behavior helps in discerning malicious activity from benign.

  - **Correlate with User Privileges**: Identify whether the user or system account executing the copy command has elevated privileges that would justify the activity. Unusual or unauthorized accounts performing these actions warrant increased scrutiny.

  - **Investigate Potential Exfiltration or Staging**: Verify file creation or transfer logs (like FTP or SMB logs) to see if the copied binaries were moved to a staging area for further malicious use. Look for unusual access patterns or transfers involving the copied files.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on critical systems and the likelihood of adversaries weaponizing LOLBINs for malicious purposes. The behavior detected is a common tactic in advanced persistent threats (APTs), highlighting a concrete risk for enterprise environments.

  ### Blind Spots and Assumptions

  Limitations in detection may arise from legitimate administrative scripting activity that uses similar command-line arguments to perform maintenance tasks. Reliable detection requires proper logging configuration, including Sysmon and Windows event logs. Additionally, administrative tools like PowerShell can be employed in benign scenarios, potentially triggering false positives. A related detection that could bolster coverage includes monitoring for unusual access patterns to sensitive directories like `C:\Windows\System32`.

