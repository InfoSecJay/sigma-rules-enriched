note: |
  ### Technical Context
  This rule detects instances where an unexpected child process is spawned from `dns.exe`, specifically when it involves `conhost.exe`. This behavior may indicate a potential security incident, particularly linked to remote code execution or exploitation techniques, such as those outlined in CVE-2020-1350, also known as SigRed. Attackers exploit vulnerabilities in DNS servers to execute arbitrary code, leading to a wide array of attack consequences, including unauthorized access and lateral movement within a network.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Initial Access** (TA0001), which encompasses methods for gaining a foothold within an environment.
  - **Persistence** (TA0003), where attackers establish continuous access through various means.
  - **Remote File Copy** (T1105), a technique used by adversaries to transfer files between hosts and execute malicious payloads.

  The primary data sources for this detection are process creation events logged by the Windows operating system, which provide insights into the parent-child process relationships and can pinpoint unexpected behaviors.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs to identify instances where `conhost.exe` is a child of `dns.exe`. Look for the command line execution details and timestamps associated with this activity.
  - **Correlate with Network Activity:** Check for unusual network traffic, particularly outbound connections initiated by these processes. This may include looking at DNS queries or connections to known malicious domains.
  - **Analyze System and Security Logs:** Investigate Windows Event logs (specifically Event ID 4688 for process creation) for additional warnings or errors that may indicate an exploitation attempt.
  - **Identify Anomalies in DNS Behavior:** Look for modifications in DNS settings, such as changes to forwarders or unexpected DNS requests that could indicate the misuse of `dns.exe` as a vector for attack.

  ### Prioritization
  The alert's severity is considered high due to the critical role that DNS services play in network infrastructure and the potential impact of a successful exploitation, which could lead to further attacks within the enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of comprehensive logging for all process creation events or due to misconfigurations in logging settings. The detection logic assumes that unusual children of `dns.exe` are indicative of malicious activity, however, there could be legitimate use cases for such behavior that may lead to false positives. Correct logging configurations for Windows process creation events are essential for this alert to function effectively.

