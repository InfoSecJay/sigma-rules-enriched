note: |
  ### Technical Context

  This rule detects unexpected child processes spawned from `dns.exe`, specifically instances of `conhost.exe` that originate from this process. This behavior may indicate an attacker successfully exploiting vulnerabilities like CVE-2020-1350 (SigRed) to achieve remote code execution, potentially enabling persistent access or lateral movement within the network. The relevant MITRE ATT&CK tactics include "Persistence" and "Initial Access," specifically technique T1133 (External Remote Services).

  The primary telemetry source is Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process creation and the associated parent-child relationship. If the activity is malicious, it poses significant risks, including unauthorized system access and data exfiltration. However, this detection alone does not confirm malicious intent or actual exploitation; further investigation is required to establish context.

  ### Investigation Steps

  - **Verify process relationships**: Cross-reference Event ID 4688 logs to confirm that `conhost.exe` is indeed spawned by `dns.exe` (ParentImage field). Look for multiple unexpected instances, as legitimate usage is rare.

  - **Inspect command line arguments**: Check the CommandLine field of Event ID 4688 for suspicious flags or parameters (especially those indicating remote execution or obfuscation). Legitimate `conhost.exe` instances typically have benign command line inputs with user-level desktop association.

  - **Evaluate system integrity**: Review Sysmon Event ID 10 (Process Access) for unusual access patterns concerning the `dns.exe` process. Confirm if `conhost.exe` is attempting to access or manipulate credential stores or sensitive files, which are red flags for malicious behavior.

  - **Analyze network activity**: Collect and review network activity logs for outbound connections from `conhost.exe` that are associated with known command and control servers. Use network logs (firewall) to identify any unexpected external communications.

  - **Examine system usage**: Determine if the affected host is a DNS server or a client. A legitimate DNS server should not have `conhost.exe` processes typically spawned from it, unless specifically designed scenarios exist.

  - **Correlate findings with other alerts**: Look for related Sysmon Event ID 1 logs showing abnormal process chains that originate from other critical processes, which indicate further exploitation or lateral movement.

  ### Prioritization

  This alert is of high severity due to its potential association with critical system exploitation. The likelihood of malicious abuse is significant, given the specific process relationships involved, and this behavior is commonly weaponized to enable broader compromise of devices within the network.

  ### Blind Spots and Assumptions

  Evasion techniques may include use of legitimate processes or well-known system tools that mask malicious activity. Reliable detection depends on ensuring Sysmon and Windows Event logging configurations are properly set, as missing logs can lead to significant blind spots. Legitimate administrative tasks, particularly in managed environments, may generate similar processes and could trigger this alert. Companion detections for external remote service access activities (related to T1133) could provide additional context and enhance detection capabilities.

