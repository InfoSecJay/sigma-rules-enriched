note: |
  ### Technical Context

  This Sigma rule detects modifications to the User Shell Folders registry values using `reg.exe` or PowerShell commands, specifically targeting paths related to startup execution. Attackers may manipulate these registry settings to ensure that malicious code runs automatically when the user logs in, thereby establishing persistence on a compromised machine. The relevant MITRE ATT&CK tactics include Persistence (T1547.001) and Defense Evasion (T1112). The primary telemetry comes from system process creation logs, specifically targeting Event ID 4688 for Windows security logs as it captures new process creations, including the command-line details.

  If an attacker successfully modifies these registry keys, they can potentially execute arbitrary code during system startup, leading to significant security impacts. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate modifications for application settings, though rare, may also trigger the alert.

  ### Investigation Steps

  - **Check the process creation log:** Review Windows Security Event ID 4688 for the relevant timestamps. Look for process creations involving `reg.exe`, `powershell.exe`, or `pwsh.exe` that contain command-line arguments related to User Shell Folders, specifically `add`, `New-ItemProperty`, or `Set-ItemProperty`.

  - **Validate specific command-line arguments:** Analyze the command line in the Event ID 4688 logs for occurrences containing the paths `\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders` or `\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders` combined with `Startup`. Legitimate use might include modifications for application deployments but is infrequent.

  - **Identify potential malicious persistence indicators:** Look for unexpected values or paths being set in the User Shell Folders related to non-standard applications. Malicious indicators may include paths set to executables or script files that do not belong to legitimate software installed on the machine.

  - **Correlate with user activity:** Check user activity logs to see if the modification coincides with unusual user behavior or timeframes. Legitimate modifications would typically align with known administrative tasks or software installations recorded in logs.

  - **Inspect host roles:** Consider the role of the affected host. If it is a critical asset (e.g., a domain controller or application server), the findings warrant a higher investigation priority and potentially an incident response.

  - **Validate artifact creation:** If the command executed a script or executable, check relevant directories (such as the Startup folder) for new file creation events. Look for recently created or modified files in these Startup locations as per Windows File Creation events (Event ID 4663).

  ### Prioritization

  This alert represents a high-severity concern given the potential for establishing persistence on critical systems. The likelihood of malicious abuse is significant since modification of User Shell Folders is a technique frequently leveraged in post-compromise scenarios. Such behavior is commonly weaponized in various attack methods.

  ### Blind Spots and Assumptions

  Detecting this behavior may miss cases where attackers utilize alternative methods for persistence, such as modifying scheduled tasks instead. Organizations should ensure logging for Event ID 4688 is consistently enabled and monitored. Additionally, legitimate administrative activities (like device management) may trigger this alert, requiring thorough contextual analysis. A beneficial companion detection would be monitoring for modifications to scheduled tasks (MITRE technique T1053), enhancing visibility over potential persistence mechanisms.

