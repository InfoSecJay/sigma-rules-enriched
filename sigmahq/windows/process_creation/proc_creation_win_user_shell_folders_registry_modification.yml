note: |
  ### Technical Context

  This Sigma rule detects modifications to User Shell Folders registry values through commands executed via `PowerShell` or `reg.exe`. Such modifications can be associated with attacker objectives of establishing persistence by redirecting shell folders to point to malicious executables or scripts. This type of behavior fits into the MITRE ATT&CK framework under the tactic of Persistence (T1547.001) and Defense Evasion (T1112). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details and command-line arguments used.

  If malicious, the impact could be significant, as modified shell folders could lead to the execution of unauthorized code on system startup, potentially allowing attackers to maintain access and control. However, it is important to note that this detection alone does not confirm malicious intent; legitimate administrative actions can also lead to user shell folder modifications.

  ### Investigation Steps

  - **Review command-line arguments:** Examine process creation logs with Security Event ID 4688 or Sysmon Event ID 1. Look for command-lines containing `reg.exe` or `powershell.exe`, specifically for operations like `add`, `New-ItemProperty`, or `Set-ItemProperty` targeting `HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders\Startup`.

  - **Identify scheduled task associations:** Check for any related scheduled tasks using PowerShell or the Task Scheduler logs (Event ID 4698) that may have been altered to point to the same modified registry keys, indicating persistence efforts.

  - **Validate legitimate activities:** Confirm that no recent legitimate changes to User Shell Folders were executed by known system administrators or IT staff. Review logs for PowerShell or reg.exe activity that includes standard task or administrative commands.

  - **Analyze file creation and execution artifacts:** Investigate creation timestamps and contents of any files that are being pointed to by the modified registry keys. Validate the integrity and legitimacy of these files (e.g., path indicators, signature checks).

  - **Look for related user account activities:** Review User Account logs and correlate with the entity that executed the command. Check for indications of abnormal logon behavior or privilege escalation events (Event ID 4672) from the same user context.

  ### Prioritization

  This alert has a high severity rating due to the potential impact on system integrity and the likelihood of being used maliciously. In a mature enterprise environment, such modifications can lead to unauthorized code execution, making it crucial to address promptly. The technique is weaponized and known for being used in various persistence mechanisms by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not adequately configured to capture all relevant execution events, especially in non-monitored user environments. Legitimate administrative tasks may occasionally trigger this alert, leading to false positives. Additional detections related to process integrity, like monitoring for unusual DLL injections or network connections from these executables, can help strengthen overall coverage against this behavior.

