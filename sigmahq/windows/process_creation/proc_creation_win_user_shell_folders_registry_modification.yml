note: |
  ### Technical Context
  This detection rule identifies modifications to User Shell Folders registry values via commands executed in PowerShell or reg.exe. Such changes may signal an attempt by a malicious actor to establish persistence on a system. By altering these registry values, attackers can control the execution of malicious scripts or executables each time a user logs in, thereby ensuring their presence even after system reboots or user logouts. This technique is particularly concerning because it provides an easy avenue for evasion, as legitimate system modifications are infrequently monitored.

  The primary objectives for attackers utilizing this mechanism are to maintain long-term access to compromised systems and to execute payloads automatically during the startup phase. This aligns with the MITRE ATT&CK tactics of persistence (T1547.001) and defense evasion (T1112). The presence of this behavior in your environment may indicate a higher risk of ongoing compromise, necessitating swift investigation and remediation.

  Key data sources for detecting this activity include process creation events that capture the command-line parameters of executed processes, particularly when involving PowerShell and reg.exe. Event logs related to registry modifications should also be monitored, as they typically contain evidence of changes made to User Shell Folders.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze recent process creation logs specifically for reg.exe or PowerShell execution involving registry modifications to User Shell Folders. Focus on any commands that include 'add', 'New-ItemProperty', or 'Set-ItemProperty'.

  - **Inspect Command-Line Arguments:** Examine the command-line arguments associated with the identified processes for suspicious registry paths, specifically 'Shell Folders' and 'User Shell Folders'. Pay close attention to instances that involve the 'Startup' path, as these are frequently targeted by attackers for persistence.

  - **Correlate with User Activity:** Check for user activity around the times of these process creations. Determine if legitimate usage of reg.exe or PowerShell occurred and whether any anomalous behavior preceded the modifications.

  - **Gather Registry Change Logs:** If available, collect and analyze registry change logs to confirm the modifications made to the User Shell Folders. Look for patterns or timing correlating with the process creations to identify potential unauthorized access.

  ### Prioritization
  This alert is classified as high severity due to the potential for sustained unauthorized access and control over affected systems. Given that persistence mechanisms can significantly facilitate further malicious activities, such detections warrant expeditious investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for environments where logging is not fully configured for process creations or registry modifications, possibly resulting in missed detection of legitimate administrative activities. The detection logic assumes that attempts to modify User Shell Folders via PowerShell or reg.exe will not be common in standard operational environments. Requirements for effective alerting include comprehensive logging of process creation events and enabled monitoring of registry changes.

