title: Suspicious Invoke-WebRequest Execution With DirectIP
id: 1edff897-9146-48d2-9066-52e8d8f80a2f
status: test
description: Detects calls to PowerShell with Invoke-WebRequest cmdlet using 
  direct IP access
references:
- https://www.huntress.com/blog/critical-vulnerabilities-in-papercut-print-management-software
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-21
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_commands:
    CommandLine|contains:
            # These are all aliases of Invoke-WebRequest
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
    - 'wget '
  selection_ip:
        # In case of FP with local IPs add additional filters
    CommandLine|contains:
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects PowerShell execution of the `Invoke-WebRequest` cmdlet using direct IP addresses instead of domain names. This behavior is often indicative of command-and-control (C2) activity, where attackers attempt to bypass DNS resolution to reach their infrastructure directly. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) and the technique is **Input Data Manipulation** (T1105). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments of executed processes.

  If the detected behavior is indeed malicious, it could signal an active compromise, leading to data exfiltration, lateral movement, or further exploitation of systems. However, this detection alone does NOT confirm malicious intent; legitimate administrative activity or scripting might use similar commands.

  ### Investigation Steps

  - **Review Command Line Arguments:** Check the command line for `PowerShell` executions (Event ID 4688/Sysmon Event ID 1) containing `curl`, `Invoke-WebRequest`, or other aliases, especially those referencing direct IPs. Look for additional arguments that suggest data manipulation or downloading, such as `-OutFile`.

  - **Analyze Parent Process:** Identify the parent process of the detected PowerShell executions. Event ID 4688 provides the `ProcessId` and `ParentProcessId`. A legitimate parent process may include system utilities or known services, whereas unexpected or suspicious parents may indicate a potential compromise.

  - **Examine Network Connections:** Correlate the execution with network logs to identify outbound connections. Look for connections to the IP addresses used in the command line via Windows Firewall logs (Event ID 5156). Verify if these IPs are known malicious actors or unusual for the environment.

  - **Evaluate User Context:** Determine which user account executed the command by checking the logs for `Security Event ID 4624` to review the user logon activity. Legitimate user actions typically occur under service accounts or known administrators; any unusual accounts or times might warrant further scrutiny.

  - **Check for Known Threat Indicators:** Search threat intelligence sources for any IPs or Command Line patterns identified in this alert to ascertain if they are linked to known malicious activities or actors.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on the organization if the activity is confirmed malicious. The likelihood of abuse is significant as attackers often leverage PowerShell for facilitating C2 communications. While this behavior can be legitimate, its occurrence with direct IP access raises red flags often associated with evasive tactics.

  ### Blind Spots and Assumptions

  This detection could be evaded through the obfuscation of command line arguments or using alternate techniques for data exfiltration (e.g., specific PowerShell functions without standard aliases). Reliable detection of these activities requires consistent logging of process creations and network traffic, specifically capturing full command lines and destination IP addresses. Legitimate activities like system updates or internal scripting may trigger this alert. Companion detections involving DNS query logs or outbound connection monitoring would strengthen coverage against such behaviors.

