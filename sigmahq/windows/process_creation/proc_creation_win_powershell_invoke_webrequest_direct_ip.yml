title: Suspicious Invoke-WebRequest Execution With DirectIP
id: 1edff897-9146-48d2-9066-52e8d8f80a2f
status: test
description: Detects calls to PowerShell with Invoke-WebRequest cmdlet using direct
  IP access
references:
- https://www.huntress.com/blog/critical-vulnerabilities-in-papercut-print-management-software
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-21
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_commands:
    CommandLine|contains:
            # These are all aliases of Invoke-WebRequest
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
    - 'wget '
  selection_ip:
        # In case of FP with local IPs add additional filters
    CommandLine|contains:
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious execution of PowerShell commands using Invoke-WebRequest or similar cmdlets with direct IP addresses. Adversaries often use this behavior to retrieve or transmit data from command-and-control servers, aiming to establish a presence in the target environment or exfiltrate sensitive information. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with the technique being Application Layer Protocol (T1105). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1 relating to command-line activity.

  If malicious, such behavior may indicate an active compromise, with potential data theft or system manipulation. However, this detection alone does NOT confirm malicious intent, as legitimate administrative tasks can also employ similar PowerShell commands.

  ---

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify instances of `powershell.exe` and related processes. Look for high-risk command lines that include suspicious patterns like 'curl', 'wget', or 'Invoke-WebRequest' with direct IP addresses.

  - **Evaluate command behavior:** Investigate whether the commands are intended for legitimate use (e.g., retrieving updates or accessing internal services). Legitimate uses may include recognized domain addresses or established protocols within your organization.

  - **Correlate with network activity:** Inspect network logs (e.g., firewall logs or IDS/IPS alerts) for outbound connections to the direct IPs noted in the command line. Outbound connections should normally align with known internal or trusted domains.

  - **Cross-reference user activities:** Look at the user account associated with the action. If the account is a known systems administrator executing common scripts, it may be benign. Unusual accounts or times (e.g., off-hours execution) raise the suspicion level.

  - **Capture additional malicious indicators:** If the command is associated with the retrieval of executables or scripts (e.g., check for file downloads in Sysmon Event ID 11), investigate the file paths for any known malicious payloads or unusual file types.

  - **Identify repeat actions:** Check for recurring similar commands executing from the same host. Repeated suspicious patterns could suggest an automated process or a more entrenched compromise.

  ---

  ### Prioritization

  Alerts generated from this rule should be taken seriously due to the potential impact on sensitive systems if associated with malicious activity. The risk of exploitation through command and control channels makes this type of behavior a common tactic used by adversaries. As such, alerts should be prioritized as medium to high severity based on context and environment.

  ---

  ### Blind Spots and Assumptions

  This rule may be evaded if attackers use obfuscated or alternate cmdlets not captured in the command line patterns. Logs from systems without PowerShell or Sysmon enabled may also result in missed detections. Legitimate administrative activities, such as scripted updates, may trigger this alert, especially within automated environments. To strengthen coverage, consider monitoring for unusual DNS requests and anomalies in traffic patterns that align with high-risk behaviors, which can serve as companion detections to this alert.

