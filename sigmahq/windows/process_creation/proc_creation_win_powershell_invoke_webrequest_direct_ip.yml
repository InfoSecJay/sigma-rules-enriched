title: Suspicious Invoke-WebRequest Execution With DirectIP
id: 1edff897-9146-48d2-9066-52e8d8f80a2f
status: test
description: Detects calls to PowerShell with Invoke-WebRequest cmdlet using direct
  IP access
references:
- https://www.huntress.com/blog/critical-vulnerabilities-in-papercut-print-management-software
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-21
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_commands:
    CommandLine|contains:
            # These are all aliases of Invoke-WebRequest
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
    - 'wget '
  selection_ip:
        # In case of FP with local IPs add additional filters
    CommandLine|contains:
    - '://1'
    - '://2'
    - '://3'
    - '://4'
    - '://5'
    - '://6'
    - '://7'
    - '://8'
    - '://9'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify the use of PowerShell's `Invoke-WebRequest` cmdlet or its aliases when they are executed with direct IP addresses. Such behavior is often indicative of command-and-control (C2) communications or data exfiltration attempts, where an attacker may utilize raw IP access to avoid detection measures that monitor hostnames. This method can facilitate malicious activities like downloading tools or scripts from compromised servers, making it a notable red flag in enterprise environments.

  The primary threat actor objective behind this behavior is to establish an outbound command-and-control channel or to transfer data away from the victim's network. This aligns with the MITRE ATT&CK framework, particularly under the following tactics and techniques:
  - **Command and Control (TA0011)**: Indicating the use of C2 infrastructure to communicate with compromised systems.
  - **Application Layer Protocol (T1105)**: Highlighting the use of non-standard interactions over application layer protocols for further exploitation or data theft.

  The key data sources for investigating this alert will be Windows process creation logs, which capture the execution of PowerShell commands, in conjunction with network traffic logs that may reveal outbound connections to suspicious IP addresses.

  ### Investigation Steps
  - **Review Process Creation Events**: Look for instances where PowerShell processes (`powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`) are initiated, focusing on their command line arguments to confirm the presence of `Invoke-WebRequest` or its variants.
  - **Examine Command-Line Arguments**: Analyze the specific command lines executed alongside PowerShell to identify any direct IP addresses being contacted. Look for patterns that suggest unauthorized or unusual IP communication.
  - **Investigate Network Traffic Logs**: Cross-reference any identified PowerShell executions with network logs to verify if outbound connections are being made to suspicious or known malicious IP addresses.
  - **Conduct a Threat Hunt for Associated Activity**: Look for other signs of compromise on the affected system, including unusual process behavior, additional PowerShell usage, or configurations of security tools that allow for abnormal outbound traffic.

  ### Prioritization
  This alert has a medium severity due to the potential risk it poses; direct IP usage in PowerShell invocations can indicate attempts at establishing a C2 channel or transferring sensitive data, posing a significant threat to data integrity and system security.

  ### Blind Spots and Assumptions
  One key gap in detection may be the absence of monitoring for local IP communications, which can lead to false positives if internal IP addresses are frequently used. Additionally, the detection logic assumes that the presence of specific patterns in command-line arguments indicates malicious intent, though benign administrative tasks could trigger similar alerts. Ensuring comprehensive logging, particularly for process creation events and outbound network activity, is vital for the effectiveness of this rule. Configurations should also allow visibility into PowerShell interactions and network connections to provide accurate context during investigations.

