note: |
  ### Technical Context

  This Sigma rule detects the execution of `dsacls.exe` with command-line arguments that imply the granting of overly permissive access rights to Active Directory objects. The likely attacker objective is to escalate privileges or gain unauthorized access to sensitive resources within the domain by manipulating access control lists (ACLs). This behavior aligns with the MITRE ATT&CK technique **T1218 (Signed Binary Proxy Execution)**, which covers the use of legitimate binaries for malicious purposes.

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688, which captures new process creation events. Additionally, monitoring for command-line arguments via Sysmon Event ID 1 can provide further context to the permissions being granted. If not addressed, such actions could allow an adversary to have widespread access to sensitive resources, leading to data breaches or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 to identify the execution of `dsacls.exe`. Analyze the associated command line for any parameters indicating permission changes, such as `/G` in conjunction with specific rights.

  - **Validate command-line arguments:** Analyze Sysmon Event ID 1 for `dsacls.exe`. Look for command-line strings that include permission flags like `GR`, `GE`, `GW`, `GA`, `WP`, or `WD`, indicating potentially excessive permissions were granted.

  - **Assess user roles:** Determine the role and authority level of the user executing the command. Confirm if the user is a legitimate administrator or has necessary permissions to modify ACLs. Benign actions may involve simply adjusting permissions for users who require them for their roles.

  - **Investigate affected resources:** Identify and review the Active Directory objects impacted by the command. Check their current ACLs before and after the execution. Significant deviations or an overly permissive configuration could indicate malicious intent.

  - **Look for abnormal scheduling:** Cross-reference with Scheduled Task logs (Event ID 4698) or similar to see if `dsacls.exe` is scheduled to run irregularly or outside typical administrative hours, suggesting a possible automated malicious workflow.

  - **Evaluate for contextual signs of compromise:** Review recent activity and authentication logs around the time of the execution. Look for patterns indicating uncharacteristic behavior such as access from unusual locations or previously inactive accounts.

  ### Prioritization

  This alert should be considered medium severity due to the potential risk if a non-administrative user inadvertently or maliciously modifies permissions on sensitive Active Directory objects. While this behavior can be weaponized for privilege escalation, it may also result from legitimate administrative tasks by authorized users.

  ### Blind Spots and Assumptions

  Detection may be limited if proper logging is not enabled, such as not capturing all command-line arguments or missing process creation logs. Legitimate scenarios include system administrators using the tool to adjust permissions; this may create false positives. A companion detection would be monitoring for unusual permission changes in Active Directory through event log telemetry related to Directory Service events (Event ID 4662), bolstering coverage and context of permission modifications.

