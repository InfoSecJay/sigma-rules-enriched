note: |
  ### Technical Context

  This rule detects the execution of `dsacls.exe` with commands that grant potentially excessive permissions to users or groups in a Windows environment. It indicates an intent to modify access controls on Active Directory objects, which may be exploited by an adversary seeking to elevate privileges or maintain persistence. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1218)**. The primary telemetry source is process creation logs which capture details about command-line executions, specifically targeting `dsacls.exe` interactions with permission grants.

  If permissions are granted maliciously, attackers can gain unauthorized access to sensitive resources or maintain control over accounts. However, this detection does NOT confirm that malicious behavior occurred; legitimate administrative tasks may trigger this alert if a system administrator improperly configures permissions.

  ### Investigation Steps

  - **Review Event Logs for Process Creation:** Check Security Event ID 4688 or Sysmon Event ID 1 for the execution of `dsacls.exe`. Correlate timestamps with alert triggers to identify any contextual activity around the time of execution.

  - **Analyze Command-Line Parameters:** Inspect the command-line parameters associated with the `dsacls.exe` process to determine if any of the following flags were used: `/G`, `GR`, `GE`, `GW`, `GA`, `WP`, `WD`. If legitimate admin activities are present, they may include granting expected permissions (such as `GR` for read access) to authorized users.

  - **Identify Changes in Permission Levels:** Look for specific changes in permissions to sensitive Active Directory objects by reviewing the corresponding object’s access control list (ACL) using tools like `Get-Acl` in PowerShell. Document any changes that seem inconsistent with organizational policy.

  - **Validate User and Group Permissions:** Cross-reference the users or groups receiving permissions with an organizational chart or user authorization policy to determine if the modifications align with legitimate business needs. Flag accounts that received increasing permissions without verification.

  - **Review for Prior Alerts or Patterns:** If similar alerts were triggered recently, analyze any patterns of behavior for the same accounts using `dsacls`. Look for repeated amendments or changes to permissions which may indicate malicious activity.

  ### Prioritization

  This alert should be treated with medium severity. Excessive permissions can pose significant risks if exploited, particularly in sensitive systems. The likelihood of malicious use is moderate, as attackers often seek to manipulate permissions to gain foothold within specific environments, making this behavior commonly weaponized.

  ### Blind Spots and Assumptions

  This detection may be limited by insufficient logging configurations; ensure that process creation and command-line logging are enabled across relevant endpoints. Legitimate administrative activities can trigger these alerts when users inadvertently over-permission accounts. A related detection to consider is alerting on modifications made through other Active Directory management tools, such as `ntdsutil` or `dsmod`, to comprehensively monitor permission changes.

