note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands initiated from a headless ConHost process, which is often indicative of an attempt to run scripts or commands in a stealthy manner without drawing user attention. Malicious actors may use this technique to execute payloads or perform actions silently on a compromised system. The relevant MITRE ATT&CK tactics include Execution (T1059) for command execution and Stealth (T1564) for hiding the execution context from the user.

  The primary telemetry sources include Windows process creation logs, especially leveraging Event ID 4688 and Sysmon Event ID 1, which detail command-line activity and process creation events. If the behavior is malicious, it may lead to further system compromise, lateral movement, or data exfiltration. Importantly, this detection does NOT confirm malicious intent solely on its own; legitimate scripts or applications may also use headless execution.

  ### Investigation Steps

  - **Review process creation events: ** Look for corresponding Security Event ID 4688 or Sysmon Event ID 1 in the logs that indicate the creation of a Process with the Image path ending in '\conhost.exe'. Confirm that the Process ID correlates with the intended PowerShell execution.

  - **Analyze command execution: ** Examine the CommandLine field for the appearance of both '--headless' and 'powershell'. Legitimate activity often involves direct user interaction without headless execution.

  - **Check parent-child relationships: ** Investigate the parent processes of the ConHost execution, as legitimate PowerShell commands might originate from known executables (like ‘powershell.exe’ or ‘cmd.exe’) rather than unrecognized sources, which may indicate malicious activity.

  - **Validate system context: ** Determine the account under which the process was executed. If the command is running under a non-admin account and attempts to access sensitive resources, it could indicate malicious activity.

  - **Cross-reference with file system activity: ** Identify any file creation or modification events that may have occurred in conjunction with the headless ConHost process using Sysmon Event ID 11 (file creation) or Windows Event ID 4663 to pinpoint potential file manipulation or exfiltration attempts.

  - **Investigate known third-party software: ** Assess whether the execution corresponds with known legitimate software that uses PowerShell in headless mode. Identify benign applications that might invoke similar behaviors.

  ### Prioritization

  The alert severity is considered medium due to the potential for significant impact if the headless PowerShell execution is malicious, particularly on critical systems. The likelihood of such behavior being abused by adversaries is concrete, as it aligns with stealthy command execution techniques frequently observed in exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as altering command-line arguments or using alternate scripting techniques that do not invoke headless execution. Reliable detection relies on comprehensive logging configurations for Windows process creation and Sysmon, ensuring visibility over all related events. Legitimate software updates or administrative tasks may inadvertently trigger this alert, necessitating context checks against known baselines. A related detection to enhance coverage could involve monitoring the use of Windows Task Scheduler for jobs executing PowerShell commands in a similar stealthy manner, as it could indicate coordinated malicious activity.

