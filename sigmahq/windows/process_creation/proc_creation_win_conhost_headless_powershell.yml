note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell commands from a headless Console Host (ConHost) process, which is unusual behavior suggestive of potential malicious activity. The use of the `--headless` flag means that the commands are executed without a visible window, making it difficult for users to notice any suspicious activities. Attackers may utilize this technique to carry out malicious scripts while evading user detection, thus accomplishing tasks like data exfiltration, lateral movement, or system reconnaissance with less risk of interruption.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (T1059.001 - PowerShell) and **Defense Evasion** (T1564.003 - Hide Artifacts). These techniques denote the methods attackers might use to run scripts stealthily while evading detection mechanisms. Primary data sources useful for this detection include process creation events from Windows Event Logs, which provide insights into the executed command lines along with associated process images.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for instances of `conhost.exe` where the command line includes both `--headless` and `powershell`. Pay close attention to timestamps and the user context in which these processes were initiated.

  - **Correlate User Activity:** Look for correlating events from other security tools (e.g., EDR alerts, user logins) during the same timeframes to assess potential indicators of compromise or contextualize the behavior with legitimate user activity.

  - **Examine System Resources:** Investigate any unusual or resource-intensive PowerShell scripts run from the headless ConHost process. Verify script intentions and check against historical data or similar incidents for patterns.

  - **Query for Similar Patterns:** Conduct further searches in your environment for other instances of headless PowerShell executions to identify possible campaigns or recurrent behaviors that may signal ongoing attacks.

  ### Prioritization
  This alert has medium severity due to the potential for underlying threats represented by the use of headless ConHost executions. As attackers increasingly rely on stealthy techniques to operate within enterprise environments, timely detection can help prevent further exploitation or compromise.

  ### Blind Spots and Assumptions
  This detection has potential blind spots, particularly if attackers utilize different mechanisms to execute PowerShell without leveraging ConHost or if they obscure command visibility through various techniques like script obfuscation. The detection logic assumes that processes spawned from ConHost will consistently reflect this behavior and that proper process creation logging is enabled across systems for effective alerts. Continuous monitoring and logging configurations are critical for this detection rule to function reliably.

