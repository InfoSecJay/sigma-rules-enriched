note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands from a headless ConHost process, indicated by the usage of the “--headless” flag. This behavior is often associated with an attacker attempting to execute PowerShell scripts or commands without raising user awareness, typically for malicious purposes such as remote access or information gathering. The relevant MITRE ATT&CK techniques include “Command and Scripting Interpreter - Windows PowerShell” (T1059.001) and “Scripting - Native API” (T1059.003).

  The primary telemetry source for this detection is Windows process creation logs, specifically Event ID 4688, which captures new process creation events, along with the command line arguments used. If successful, an attacker could leverage this method to execute scripts stealthily, potentially leading to data exfiltration or lateral movement within the network. However, the detection alone does not confirm malicious intent, as legitimate PowerShell scripts executed through ConHost may exist.

  ### Investigation Steps

  - **Check process details for conhost.exe:** Review Security Event ID 4688 for processes where the `NewProcessName` is `*\conhost.exe`. Note the `CommandLine` field for flags like `--headless`, which indicates atypical behavior.

  - **Validate parent process:** Investigate the parent process ID (PID) of the detected conhost.exe instance using Security Event ID 4688. A non-standard parent process (such as a user-initiated command shell) could indicate malicious activity.

  - **Identify benign PowerShell use cases:** Document common legitimate use cases of PowerShell execution in your environment. Validate if any instances match the legitimate execution patterns, particularly in administrative tasks or automated scripts run by IT personnel.

  - **Correlate with other logs for confirmation:** Review PowerShell logs (Event ID 4103) for scripts triggered by the detected conhost.exe process. Look for typical PowerShell command activities that may reveal if they align with known attack patterns.

  - **Check for known malicious signatures:** Utilize threat intelligence feeds or endpoint detection solutions to cross-reference the command line used in the alert against a catalog of known malicious PowerShell commands or patterns.

  - **Examine the execution context:** Check both the user context and the system role of the initiating entity. Note that execution from compromised accounts with high privileges poses a much greater risk, warranting immediate further investigation.

  ### Prioritization

  This alert should be considered medium priority due to the potential use of PowerShell for malicious purposes, particularly in targeted attack scenarios. The likelihood of abuse is moderate, as attackers frequently weaponize PowerShell via various techniques. However, legitimate use cases may also generate similar alerts, requiring contextual investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging on endpoints; if logging for command line arguments is insufficient, key details may be missed. Additionally, adversaries may alter execution methods to avoid detection, such as executing PowerShell via legitimate administrative tools that do not trigger this alert. Legitimate administrative tasks that involve headless PowerShell execution could trigger similar alerts. A related detection to strengthen coverage might include monitoring for unusual or unexpected command line arguments in other system processes, such as explorer.exe or cmd.exe, for comprehensive visibility.

