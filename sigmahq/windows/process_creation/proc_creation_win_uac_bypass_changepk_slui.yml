  ---

  ### Technical Context

  This detection identifies the execution of the `changepk.exe` process as a child of `slui.exe`, which signifies a UAC (User Account Control) bypass method. The likely attacker objective is to escalate privileges to gain higher access rights within the system without user consent. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** under the technique **T1548.002: Abuse Elevation Control Mechanism: Bypass UAC**.

  Primary telemetry sources for this detection are Windows process creation logs, specifically focusing on event types related to **Security Event ID 4688** or **Sysmon Event ID 1**. If successful, this type of behavior can result in unauthorized privilege escalation, allowing adversaries to execute malicious actions with system-level access. Importantly, this detection alone does not confirm that UAC has been bypassed or that the action is malicious; it merely highlights a potentially suspicious activity that warrants further investigation.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the `changepk.exe` process, capturing details such as timestamps, user accounts, and parent processes. Malicious indicators include unexpected execution of `changepk.exe`, particularly as a child process of `slui.exe`.

  - **Check for integrity levels:** Verify the integrity level associated with the detected `changepk.exe` execution. A high or system integrity level (e.g., S-1-16-16384 or S-1-16-12288) is indicative of potential exploitation. Legitimate process execution typically occurs under lower integrity levels.

  - **Identify user context:** Investigate the user account context under which `changepk.exe` was executed. Legitimate administrative tasks may involve this process, but anomalies in user behavior or deviations from standard operating procedures could indicate malicious activity.

  - **Analyze parent process behavior:** Confirm the activity of `slui.exe` prior to the execution of `changepk.exe`. Normal behavior for `slui.exe` is related to system configuration changes, including managing activation. If no related user actions were logged, this may indicate suspicious behavior.

  - **Monitor for additional suspicious processes:** Check for other high-risk processes running concurrently with `changepk.exe`, such as those associated with known privilege escalation tools. Look for process parents that contribute to user account control manipulation.

  ---

  ### Prioritization

  Given that this detection is tied to a method of privilege escalation, it is of high severity in an enterprise context, particularly if it occurs on critical systems or within administrative accounts. The potential impact includes unauthorized access to sensitive systems and data. This behavior is also commonly weaponized in targeted attacks, making swift investigation essential.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques include the use of other legitimate processes misused for similar UAC bypasses. Detection relies heavily on accurate logging configurations; ensure that process creation logging is enabled and appropriately configured in Windows Event Logs and Sysmon. Legitimate activities that may trigger the alert include authorized use of `changepk.exe` for software upgrades or system configuration, which should be validated against prior user actions. Consider expanding detection coverage with companion rules addressing direct executions of `slui.exe` that may indicate alternative evasion attempts.

