note: |
  ### Technical Context
  This detection rule identifies instances of User Account Control (UAC) bypass leveraging `changepk.exe` and `slui.exe`, a method documented in the UACMe toolkit. Attackers often utilize UAC bypass techniques to escalate privileges, enabling unauthorized actions on a compromised system. This behavior poses a significant risk as it allows an adversary to operate with elevated permissions while evading standard security controls.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation (T1055)** and **Defense Evasion (T1548.002)**, highlighting the threat's focus on gaining elevated privileges while trying to remain undetected. As attackers aim to maintain persistence and carry out further malicious activities, such as data exfiltration or lateral movement, understanding the behaviors associated with this UAC bypass technique is critical for incident response teams.

  Primary data sources for detecting this activity will include process creation logs, specifically tracking the use of `changepk.exe` and `slui.exe` and correlating their execution contexts to determine if they are being misused.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for instances where `changepk.exe` is executed with `slui.exe` as its parent process. Pay attention to the integrity levels reported in conjunction with these events.

  - **Correlate with User Activity:** Look for anomalies in the account associated with the execution, such as recent account compromises or unusual behaviors prior to the bypass attempt.

  - **Analyze Windows Event Logs:** Focus on event IDs related to process creation (e.g., Event ID 4688) and Windows security events that might provide additional contextual information about the privileges at the time of execution.

  - **Check for Other UAC Bypass Indicators:** Investigate other running processes or scheduled tasks that might indicate a broader exploitation strategy beyond just the identified UAC bypass, such as additional tools from the UACMe suite.

  ### Prioritization
  Alerts triggered by this rule should be treated with high priority due to the potential impact of privilege escalation on the enterprise environment. Successful exploitation could lead to unauthorized access to sensitive resources, increasing the threat landscape significantly.

  ### Blind Spots and Assumptions
  This detection may not capture all UAC bypass attempts, particularly if attackers utilize other tools or methods not encapsulated within this rule. The logic assumes that `changepk.exe` and `slui.exe` will always be executed in a typical parent-child relationship during an exploit. Adequate logging and monitoring configurations must be in place for process creation events to ensure the effectiveness of this detection, necessitating comprehensive policies around Windows event logging to function correctly.

