note: |
  ### Technical Context

  This rule detects a user account control (UAC) bypass technique utilizing `changepk.exe` executed by `slui.exe`. The likely attacker objective is to escalate privileges on a Windows system without alerting the user, allowing unauthorized actions on the machine. This behavior aligns with the MITRE ATT&CK technique: **T1548.002 - Abuse Elevation Control Mechanism: Bypass User Account Control**.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Security Event ID 4688 or Sysmon Event ID 1, which provide details about process creation events. Should the behavior be malicious, it can result in unauthorized access to sensitive data and critical system functions. This detection on its own does NOT confirm a successful exploit or privilege escalation; further investigation is required to determine the impact and intent.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for the execution of `changepk.exe` with a parent process of `slui.exe`. Malicious indicators include instances of `changepk.exe` running with high integrity levels, while legitimate processes typically involve user-initiated applications without suspicious parent-child relationships.

  - **Check the integrity level of the process:** Confirm the integrity level of the detected `changepk.exe` process within logs (fields `IntegrityLevel`) is marked as 'High', 'System', or identifiable as SIDs `S-1-16-16384` or `S-1-16-12288`. Legitimate processes generally run under `Medium` integrity.

  - **Analyze the command-line arguments:** Retrieve and analyze the command-line parameters provided for `changepk.exe` found in logs (e.g., Sysmon Event ID 1, CommandLine field). Malicious instances may show unusual or obfuscated arguments, whereas legitimate use is straightforward and aligns with known application behavior.

  - **Verify execution context:** Correlate logged user activity with the time of the alert. Look for any suspicious user behavior leading up to the alert, such as unexpected logins or other unusual activity. A legitimate process may originate from a known administrative console or application.

  - **Check for other UAC bypass tools:** Review for the presence of other known UAC bypass tools or indicators of compromise on the host. Comparison with software inventory logs can clarify if `changepk.exe` is an unauthorized addition.

  ### Prioritization

  This alert should be prioritized as high severity due to the significant security implications of UAC bypass techniques, which can easily be weaponized for privilege escalation. The affected system’s role, particularly if it is a server or hosts sensitive applications, amplifies the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as modifying the executable to evade signature detection or using alternative methods for privilege escalation. Consistent monitoring of Security Event ID 4688 and Sysmon logs is necessary for reliable detection. Legitimate system maintenance or administrative scripts that may involve `slui.exe` could generate false positives. A related detection worth monitoring is unexpected high-integrity process creations in environments where UAC bypass attempts are particularly common.

