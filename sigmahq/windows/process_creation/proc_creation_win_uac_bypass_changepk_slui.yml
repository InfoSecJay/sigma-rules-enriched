note: |
  ### Technical Context

  The Sigma rule identifies the execution of `changepk.exe` as a child process of `slui.exe`, which is indicative of an unauthorized User Account Control (UAC) bypass. The primary objective for an attacker executing this exploit is to escalate privileges and execute code at a higher level without user consent. This behavior aligns with the MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The rule primarily relies on process creation telemetry from Windows systems, specifically monitoring the command line and parent-child process relationships. If malicious, this behavior could lead to significant operational risks, including unauthorized access to sensitive data or system manipulation. It's important to note that this detection does NOT definitively confirm malicious activity without additional context, such as the nature of the executed process and its intent.

  ### Investigation Steps

  - **Check process creation details**: Review Security Event ID 4688 for `changepk.exe` and `slui.exe`. Verify the command line arguments used during their execution. Legitimate `slui.exe` calls typically display standard Windows activation-related flags.

  - **Evaluate parent-child process relationships**: Use Sysmon Event ID 1 to confirm the process hierarchy. If `changepk.exe` is not normally invoked by `slui.exe`, this could indicate malicious activity.

  - **Investigate integrity levels**: Identify the integrity levels of both processes in the logs. Malicious instances will exhibit `High` or `System` integrity levels when coupled with `changepk.exe`. This can generally be found in Sysmon Event ID 1 under the integrity level field.

  - **Cross-reference with known good**: Validate whether `changepk.exe` is present on system images and assess the timestamp and version details against known good installations. For standard installations, this executable should not be user-modified or present without matching Microsoft signature.

  - **Seek for additional indicators of compromise**: Look for patterns of suspicious behavior such as other unexpected parent processes or execution of tools that are commonly associated with privilege escalation (e.g., PowerShell scripts). Use the Windows Event Logs for this investigation.

  - **Document notable anomalies**: If detected, any unusual command line parameters or origins for `changepk.exe` should be recorded. An installation from a Temp directory, or the absence of this file in system directories, can indicate malicious intent.

  ### Prioritization

  This alert holds high severity due to the potential impact of privilege escalation on critical enterprise systems. The likelihood of malicious use is significant, as UAC bypass techniques are frequently leveraged by adversaries in targeted environments. Similar methods are often weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Existing detection may miss customized `changepk.exe` variants if they are modified to evade signature detection. Accurate detection relies on complete logging from Sysmon and Windows security events, which must be configured properly across all endpoints. Legitimate software installations or updates could potentially trigger this alert, especially when using activation tools whose processes may interact with UAC. A companion detection to consider is monitoring for lateral movement techniques (T1075) which may indicate exploitation through other elevated tools.

