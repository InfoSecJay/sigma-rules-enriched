title: Run PowerShell Script from Redirected Input Stream
id: c83bf4b5-cdf0-437c-90fa-43d734f7c476
status: test
description: Detects PowerShell script execution via input stream redirect
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OSBinaries/Powershell.yml
- https://twitter.com/Moriarty_Meng/status/984380793383370752
author: Moriarty Meng (idea), Anton Kutepov (rule), oscd.community
date: 2020-10-17
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|re: '\s-\s*<'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell scripts that utilize input redirection, a technique that may be employed by attackers to obfuscate or bypass standard security monitoring. The ability to run scripts in this manner can be indicative of malicious behavior, where adversaries leverage PowerShell capabilities to execute arbitrary code or deliver payloads without alerting security systems. Attackers often utilize PowerShell for command execution, information gathering, and lateral movement within a network due to its powerful capabilities and widespread presence in Windows environments.

  The pertinent MITRE ATT&CK tactics associated with this rule include **Execution (TA0002)**, with the relevant technique being **Command and Scripting Interpreter (T1059)**, specifically for PowerShell usage. This model captures potential threat families that could adopt this approach, such as those employing digital reconnaissance or exploiting vulnerable systems, with objectives often revolving around persistence, exfiltration, or privilege escalation. Primary data sources for evidence gathering include process creation events, which provide information about which executables are running and the command lines associated with those processes.

  ### Investigation Steps
  - **Review Process Logs**: Examine the process creation logs to identify instances of PowerShell or pwsh executing with command lines that include input redirection symbols (e.g., `- <`). Check for any suspicious or anomalous execution patterns.
  - **Analyze Command Line Arguments**: Investigate the command line arguments of the identified PowerShell executions. Look for unusual scripts, encoded commands, or obfuscation techniques commonly used by threat actors.
  - **Cross-Reference User Context**: Validate the user context under which the PowerShell scripts were executed. Assess whether the user has the appropriate permissions and previously exhibited behavior that aligns with legitimate use cases for PowerShell.
  - **Monitor for Related Behavior**: Track subsequent or related activity following the detection. This might include network connections initiated by the PowerShell process or file modifications within sensitive directories, as these can indicate further malicious actions.

  ### Prioritization
  This alert is classified as high severity in an enterprise context due to the significant risk that unauthorized PowerShell execution poses. The likelihood of attackers utilizing these techniques to bypass security mechanisms underscores the need for immediate investigation and potential remediation.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the possibility of legitimate users employing similar command patterns for benign scripts. The detection logic assumes that not all command executions with redirection are malicious, but it may still generate false positives. The effectiveness of this rule relies on comprehensive logging of process creation events and command-line arguments, requiring that such logging is correctly configured and not overly filtered in the security monitoring environment.

