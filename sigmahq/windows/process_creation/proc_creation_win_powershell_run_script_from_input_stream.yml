detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|re: '\s-\s*<'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects PowerShell script execution using input stream redirection by monitoring the execution of `powershell.exe` or `pwsh.exe` with command-line arguments that indicate the use of the `<` operator. The likely objective of an attacker using this technique is to obfuscate their actions and bypass security controls by executing malicious scripts from redirected input, a common tactic in many cyber attacks.

  This behavior falls under the MITRE ATT&CK framework, specifically Attack Execution (T1059 - Command and Scripting Interpreter) and Defense Evasion (T1059). The primary telemetry sources include Windows Process Creation events, which can be captured via Event ID 4688 or Sysmon Event ID 1. If exploited maliciously, the security impact could range from data exfiltration to further compromise of the affected system. Importantly, detection of this event does NOT confirm malicious intent on its own; context must be gathered to distinguish between benign and malicious use.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 logs for instances where the image is `powershell.exe` or `pwsh.exe` with command lines containing a redirection operator `<`. Look for unusual parent processes that might indicate malicious execution context.

  - **Analyze Command-Line Arguments:** Focus on the exact command-line used for execution. Malicious redirects often contain encoded or obfuscated scripts, while legitimate command-lines typically involve known scripts or typical usage patterns without redirection.

  - **Review User Activity and Context:** Investigate the user account associated with the event. Compare against typical user behavior patterns; if a standard user is executing PowerShell with redirected input, it may warrant deeper scrutiny.

  - **Identify Output Redirection Behavior:** Examine whether the redirected inputs are pointing at atypical sources, such as remote URLs or uncommon paths that do not align with regular operational workflows, as these can indicate malicious intent.

  - **Validate Endpoint Security Solutions:** Ensure that endpoint detection and response (EDR) solutions are correctly configured and logging relevant telemetry regarding PowerShell activity. Check for alerts related to the execution of scripts that may match known malicious signatures.

  - **Compare Against Known Benchmarks:** Review your organization's baseline for legitimate PowerShell usage, including expected paths, commands, and user roles. Significant deviations from this baseline should raise flags for further investigation.

  ---

  ### Prioritization

  This alert should be considered high priority due to the sensitivity and potential impact of PowerShell on enterprise systems. Given the likelihood of adversaries using this technique to conceal malicious activities, rapid assessment is vital to prevent exploitation. The behavior observed has been commonly weaponized in various attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users employing anti-forensic techniques to obfuscate the command line further or by system configurations that do not adequately log redirection events. Additionally, legitimate users may invoke PowerShell scripts with redirection as part of routine automation or maintenance tasks, resulting in potential false positives. A companion detection to consider is the auditing of script execution policy changes to assess whether PowerShell is being misconfigured to facilitate evasion.

