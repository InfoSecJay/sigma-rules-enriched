detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|re: '\s-\s*<'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances of PowerShell script execution where input streams are redirected, a technique often employed by attackers to avoid command line logging and obscuring the actual commands being executed. The likely attacker objective is to execute malicious scripts or commands while evading detection mechanisms, as they may run scripts with minimal visibility, leveraging features of PowerShell for lateral movement or data exfiltration. Relevant MITRE ATT&CK tactics include **Execution** (T1203) and the technique **Command and Scripting Interpreter** (T1059).

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking for Event ID 4688 that capture process attributes including command lines and executed images. If malicious, this behavior can lead to unauthorized access, data breaches, or system compromise. It’s critical to note that this detection does NOT confirm malicious intent by itself; coordinated investigation is required to assess context and intent behind the PowerShell invocation.

  ### Investigation Steps

  - **Identify process creation logs:**  Retrieve Windows Security Event ID 4688 logs to find instances where `powershell.exe` or `pwsh.exe` is initiated. Filter for command lines containing `-<` to pinpoint redirected input streams.

  - **Analyze command line arguments:** Review the command line parameters associated with the detected process. Malicious indicators may include known hacking frameworks, obfuscated scripts, or suspicious URLs that point to remote resources.

  - **Correlate with user activity:** Check the timing of the PowerShell execution against known user activities or scheduled tasks. Legitimate PowerShell usage often includes script execution by system administrators or during valid update cycles.

  - **Review parent process relationships:** Identify the parent process of the PowerShell invocation via Event ID 4688’s `NewProcessId` field. Malicious activity often has a non-standard parent process (e.g., cmd.exe or a potential exploit kit).

  - **Search for file creation artifacts:** If applicable, check for any new files created during the timeframe of the PowerShell execution, especially temporary files in `%TEMP%` or similar directories. This could indicate a downloaded or executed script that warrants further review.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on critical systems if malicious activity is confirmed. The use of redirected input streams is uncommon in regular enterprise usage and is often leveraged by attackers to mask their actions, making this behavior particularly concerning. Therefore, it should be treated seriously and require immediate investigation.

  ### Blind Spots and Assumptions

  There are limitations in detection as advanced adversaries may obfuscate their commands or further mute command histories through log manipulation. Reliable detection relies on the presence of appropriate Windows logging configurations, including enabling detailed process creation events. Legitimate scenarios that may trigger this alert include automated administrative scripts or tools that utilize PowerShell for configuration management. A related detection that strengthens coverage would be monitoring for additional suspicious PowerShell command-line patterns, such as encoded commands or the use of the `Invoke-Expression` cmdlet which could further indicate malicious behavior.

