note: |
  ### Technical Context

  This rule detects the invocation of the PowerShell Cmdlet “Stop-Service,” which is commonly used to halt running services on Windows systems. Attackers may utilize this command to disrupt operations, disable security software, or stop critical services as part of a broader attack strategy. The associated MITRE ATT&CK tactic is **Impact** (T1489) and the technique is **Service Stop** (T1489).

  Primary telemetry sources include Windows Event Logs, specifically Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation) which log process execution details and command line parameters. If malicious, this behavior could lead to system instability or facilitate further exploitation. Importantly, this detection does NOT confirm malicious intent on its own as legitimate administrative actions can also invoke this command.

  ### Investigation Steps

  - **Verify invoked command:** Review Security Event ID 4688 for the creation of trusted processes like "powershell.exe" or "pwsh.exe" with command line containing "Stop-Service" to confirm malicious activity. Ensure context is provided by correlating with user identity.

  - **Check service status changes:** Query the Windows Services log (or use PowerShell `Get-Service`) to identify which service was stopped. Compare against critical services typical for the organization to assess potential impact.

  - **Identify user context:** Determine the user account running the PowerShell command in Event ID 4688's log. If the account is an administrator or a privileged user, assess recent activity for unusual patterns.

  - **Analyze service dependencies:** For the stopped service, check dependencies via `Get-Service` and Roadmap/Diagram to evaluate the potential cascading effects on other services or application functionality.

  - **Review recent scripts and automation tasks:** Look for scheduled tasks or automation scripts that may have executed PowerShell commands recently. Use Task Scheduler logs (Event ID 106) to identify legitimate automation against this rule's trigger.

  ### Prioritization

  Given that the alert triggers on stopping services, the severity is moderate. The impact depends heavily on the affected system’s critical services and whether the command is used in a context consistent with prior malicious activity. While not frequently weaponized, it can be part of a larger operational outage strategy.

  ### Blind Spots and Assumptions

  Legitimate administrative tasks may trigger this alert, leading to false positives, especially in dynamic IT environments with frequent service management. Evasion can occur if attackers use alternative scripts or obfuscate command lines. Reliable detection requires comprehensive logging of PowerShell activities and Process Creation events. A related detection that enhances coverage is monitoring for service restart commands post-service stoppage to identify potential lateral movement or service exploitation.

