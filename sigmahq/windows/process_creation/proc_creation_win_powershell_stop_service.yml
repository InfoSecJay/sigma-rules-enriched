note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell Cmdlet `Stop-Service` which is utilized to stop a Windows service. Stopping services can be part of regular system administration tasks; however, it can also indicate malicious activity, particularly if an attacker aims to disrupt services, evade detection, or manipulate the operating system environment. Attackers often seek to disable security-related services or critical application services as a means to facilitate their objectives, such as maintaining persistence or conducting lateral movement.

  The relevant MITRE ATT&CK tactics and techniques for this behavior include "Impact" (TA0040) and specifically "Service Stop" (T1489). The detection leverages the observation of process creation events specifically for PowerShell to identify instances where a service is being stopped through the command line.

  Primary data sources for investigation include process creation logs, which will detail the command executed, and potentially logs from security tools that monitor PowerShell activity, such as EDRs that record command-line usage and parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `PowerShell.EXE` or `pwsh.exe` where the command line contains `Stop-Service`. Look for unusual timings or patterns indicative of malicious intent.
  - **Correlate with Service Status**: Verify the service status before and after the command execution to determine whether any critical services were intentionally stopped. Identify if this action coincides with any unauthorized access or other suspicious activity.
  - **Analyze Historical Behavior**: Look for similar commands executed by the same user or process in a given timeframe to identify patterns of activity that could indicate a malicious script or process.
  - **Cross-reference User Accounts**: Investigate the user account running the command to ensure it is legitimate and authorized. Check for signs of credential theft or unauthorized privilege escalation in the surrounding logs.

  ### Prioritization
  The alert is categorized as low severity due to the potential for both legitimate administrative uses and malicious activity. However, given the ability of attackers to leverage a "Stop-Service" command to disrupt critical application functions, it warrants attention in the context of unusual behavior patterns.

  ### Blind Spots and Assumptions
  There are gaps in detecting specific context around why a service was stopped, as the rule does not adjudicate the legitimacy of the command or its parameters, potentially leading to false positives originating from valid administrative activities. The detection logic assumes that all instances of `Stop-Service` via PowerShell are noteworthy, which may not account for normal operational behavior. Required logs include detailed process execution logs, which must be properly configured to ensure that all relevant PowerShell activity is recorded for effective monitoring.

