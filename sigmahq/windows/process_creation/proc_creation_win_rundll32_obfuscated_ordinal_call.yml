tags:
- attack.defense-evasion
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli:
    CommandLine|contains:
    - '#+'
    - '#-'
            # ordinal can be represented by adding any number of zeros in front ordinal number, for e.g. 000000024
    - '#0'
            # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.
            # for e.g ordinal 24 can be also represented by 65560 (65536+24)
    - '#655'
    - '#656'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of `rundll32.exe` with indications of potentially obfuscated ordinal calls, often used by attackers to execute arbitrary code. The likely objective is to run malicious payloads without triggering typical security measures or to bypass application whitelisting. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically Technique T1027.010 (Obfuscated Files or Information).

  The primary telemetry source for this detection includes Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this technique poses significant risks as it may lead to the execution of unauthorized commands or payloads within the environment. It is crucial to note that this detection, on its own, does not confirm malicious intent, as legitimate applications can also use `rundll32.exe` for valid operations.

  ### Investigation Steps

  - **Check Process Creation Logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for `rundll32.exe` creation events. Look for unusual parent processes, such as cmd.exe or powershell.exe, indicating potential misuse.

  - **Analyze Command Line Parameters:** Validate the command line arguments logged with `rundll32.exe`. Look for obfuscated ordinal calls containing patterns like `#+`, `#0`, or `#655` which signal potential malicious activity.

  - **Identify Legitimate Usage:** Compare against known good executions of `rundll32.exe`, which typically involve benign DLLs and straightforward command-line syntax without obfuscation. Document any standard applications that consistently utilize it for legitimate processes.

  - **Correlate with Other Alerts:** Review other telemetry (e.g., process logs, EDR alerts) to see if there’s concurrent suspicious activity related to the process executing `rundll32.exe`, such as network connections to unknown addresses.

  - **Examine File Creation Artifacts:** Look for newly created files in the system’s temporary directories or startup locations that might coincide with the `rundll32.exe` execution. Validate against recent changes or installations from trusted applications.

  - **Assess Impact Based on Asset Criticality:** Evaluate the role of the affected endpoint (e.g., server vs. user workstation). Higher criticality systems executing this behavior warrant more urgent investigation.

  ### Prioritization

  The severity of this alert should be considered medium, as the behavior observed can lead to serious security breaches if malicious. Given the common usage of `rundll32.exe` in the environment, the likelihood of abuse is moderately high, especially when combined with obfuscation techniques that evade straightforward detection.

  ### Blind Spots and Assumptions

  This detection has limitations, such as the ability of sophisticated attackers to create further obfuscation that may not be captured by the current patterns. Required log sources must be configured correctly to ensure robust detection—specifically Windows Process Creation logs for reliable event capture. Additionally, legitimate software updates or administrative scripts may occasionally invoke `rundll32.exe`, which could trigger this alert. A related detection, such as abnormal DLL load events from Sysmon, may provide complementary insights into the activity being investigated.

