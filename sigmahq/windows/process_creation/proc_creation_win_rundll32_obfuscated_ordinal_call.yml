title: Potential Obfuscated Ordinal Call Via Rundll32
id: 43fa5350-db63-4b8f-9a01-789a427074e1
status: test
description: Detects execution of "rundll32" with potential obfuscated ordinal calls
references:
- Internal Research
- https://www.youtube.com/watch?v=52tAmVLg1KM&t=2070s
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron
  Systems)
date: 2023-05-17
modified: 2025-02-23
tags:
- attack.defense-evasion
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli:
    CommandLine|contains:
    - '#+'
    - '#-'
            # ordinal can be represented by adding any number of zeros in front ordinal number, for e.g. 000000024
    - '#0'
            # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.
            # for e.g ordinal 24 can be also represented by 65560 (65536+24)
    - '#655'
    - '#656'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying potentially malicious usage of the `rundll32.exe` utility, particularly when used with obfuscated ordinal calls. The execution of `rundll32.exe` serves a legitimate purpose in Windows, allowing users to run functions exported from DLL files. However, attackers often exploit this functionality to execute malicious code hidden within ordinary-looking command-line calls. Such techniques can be utilized to evade detection, as they appear benign but may lead to unauthorized actions on the system.

  The likely attacker objectives for utilizing `rundll32.exe` with obfuscation involve executing malicious payloads, establishing persistence, or conducting lateral movement within the network. This could involve leveraging dynamic DLLs that facilitate privilege escalation or data exfiltration. The relevant MITRE ATT&CK tactics and techniques include "Defense Evasion" (TA0005) and "Obfuscated Files or Information" (T1027.010), as attackers look to hide their activities from security tools.

  Primary data sources that will provide valuable telemetry for this detection include process creation events from the endpoint, which will log the execution of commands and their arguments. Additional sources could include Windows Event Logs associated with application and system activities, providing deeper context into unusual process behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events to identify any instances of `rundll32.exe` being executed. Pay attention to the command-line arguments that include obfuscated ordinal values.
  - **Correlate with User Activity:** Check for the user accounts that executed the detected commands. Correlate their recent activities to determine if the execution aligns with usual behavior or if it raises red flags.
  - **Inspect Related DLL Files:** Investigate the DLLs being called by `rundll32.exe`. Examine their origins and signatures to ascertain if they are part of legitimate software or potentially harmful.
  - **Utilize Threat Intelligence:** Leverage threat intelligence feeds to look for known malicious hashes or patterns associated with `rundll32.exe` and obfuscation techniques, enhancing the contextual understanding of the alert.

  ### Prioritization
  This alert is of medium severity due to the potential impact of unauthorized code execution that could be indicative of a larger compromise. While the likelihood of false positives exists, the nature of the command's usage warrants prompt investigation, especially in environments where sensitive data is handled.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding unmonitored systems where process creation logs are not collected, or if `rundll32.exe` is manipulated to execute from non-standard locations. The detection logic assumes that malicious actors will use obfuscation techniques but might not cover all variants of obfuscation or legitimate usage of ordinal calls. For the rule to function effectively, comprehensive process creation logging must be enabled on all endpoints.

