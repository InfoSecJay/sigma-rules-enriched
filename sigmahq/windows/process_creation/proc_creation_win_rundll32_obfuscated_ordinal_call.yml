title: Potential Obfuscated Ordinal Call Via Rundll32
id: 43fa5350-db63-4b8f-9a01-789a427074e1
status: test
description: Detects execution of "rundll32" with potential obfuscated ordinal 
  calls
references:
- Internal Research
- https://www.youtube.com/watch?v=52tAmVLg1KM&t=2070s
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel 
  (Nextron Systems)
date: 2023-05-17
modified: 2025-02-23
tags:
- attack.stealth
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli:
    CommandLine|contains:
    - '#+'
    - '#-'
            # ordinal can be represented by adding any number of zeros in front ordinal number, for e.g. 000000024
    - '#0'
            # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.
            # for e.g ordinal 24 can be also represented by 65560 (65536+24)
    - '#655'
    - '#656'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "rundll32.exe" with command line arguments that indicate potential obfuscation techniques through undefined ordinal calls. The likely objective of an attacker using this technique is to leverage the rundll32 functionality for executing malicious payloads disguised as legitimate DLLs. This behavior fits within the MITRE ATT&CK framework under the tactic "Defense Evasion" and technique T1027.010 (Obfuscated Files or Information). Primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688 (indicating process creation) and Sysmon Event ID 1. If malicious, the security impact could involve unauthorized execution of code that could lead to system compromise. Importantly, this detection does NOT confirm intent or impact on its own; further investigation is required.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Event ID 4688 for instances of "rundll32.exe". Pay particular attention to the command line arguments for any of the specified obfuscation patterns, such as including '#+' or '#655'.

  - **Analyze Sysmon logs:** Look for Sysmon Event ID 1 records related to "rundll32.exe". Investigate the Image and OriginalFileName fields to confirm they match 'rundll32.exe' and consider any unusual parent processes that may indicate a suspicious execution context.

  - **Identify benign usage patterns:** Establish a baseline of legitimate rundll32 executions by checking command line arguments used by known software processes that typically utilize rundll32 for similar operations. Document these patterns for future comparisons.

  - **Correlate with related alerts:** Cross-reference the detected activity with any other associated alerts, particularly involving known malicious commands or unusual behavior. Note any repeat offenders or patterns that align with known threat actor tactics.

  - **Check for DLL file existence:** Validate the presence of DLLs associated with the rundll32 command by inspecting the System32 directory or executing a file integrity check to identify unauthorized or unexpected DLLs that could result from malicious activity.

  - **Consult asset inventory:** Confirm the role of the affected host and its criticality. Investigate whether tools deployed on that machine require the use of rundll32, balancing the context of legitimate use against the potential for exploitation.

  ### Prioritization

  This alert is of medium severity, as it indicates potential misuse of a legitimate system utility that is commonly weaponized by adversaries for executing malicious payloads. The likelihood of real-world abuse in enterprise environments is significant, especially in the context of sophisticated attacks that utilize obfuscation to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of adversaries to further obfuscate their command line arguments or use alternative methods to invoke rundll32 that are not captured by this rule. Ensure logging for process creation is enabled across the enterprise; otherwise, the detection may miss critical incidents. Legitimate software updates or administrative scripts may trigger this alert. A related detection to strengthen coverage includes monitoring for DLL loading anomalies or processes that initiate rundll32 without a recognized parent process.

