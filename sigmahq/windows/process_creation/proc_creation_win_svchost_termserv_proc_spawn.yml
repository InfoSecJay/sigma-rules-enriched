title: Terminal Service Process Spawn
id: 1012f107-b8f1-4271-af30-5aed2de89b39
status: test
description: Detects a process spawned by the terminal service server process 
  (this could be an indicator for an exploitation of CVE-2019-0708)
references:
- https://securingtomorrow.mcafee.com/other-blogs/mcafee-labs/rdp-stands-for-really-do-patch-understanding-the-wormable-rdp-vulnerability-cve-2019-0708/
author: Florian Roth (Nextron Systems)
date: 2019-05-22
modified: 2023-01-25
tags:
- attack.initial-access
- attack.t1190
- attack.lateral-movement
- attack.t1210
- car.2013-07-002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentCommandLine|contains|all:
    - '\svchost.exe'
    - 'termsvcs'
  filter_img:
    Image|endswith:
    - '\rdpclip.exe'
    - ':\Windows\System32\csrss.exe'
    - ':\Windows\System32\wininit.exe'
    - ':\Windows\System32\winlogon.exe'
  filter_null:
    Image:
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects execution of a child process spawned by the Terminal Services (Remote Desktop Services) on a Windows machine, which could indicate an exploitation attempt of CVE-2019-0708 (BlueKeep). Attackers may target unpatched services to execute arbitrary code, facilitating lateral movement within the network. This detection aligns with the MITRE ATT&CK tactics of Initial Access (T1190) and Lateral Movement (T1210).

  The primary telemetry sources for this detection include Windows Security Event logs (Event ID 4688 for process creation) and Sysmon logs (Event ID 1). If malicious, exploitation could lead to unauthorized remote access, data exfiltration, or malware deployment. However, this detection does NOT confirm successful exploitation or malicious intent on its own; further investigation is necessary.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for parent-child process relationships. Look for instances of 'svchost.exe' as the parent and any suspension of standard execution patterns (e.g., command line flags that include terms like “termsvcs”).

  - **Identify anomalous command lines:** Investigate any command lines associated with 'rdpclip.exe', 'csrss.exe', 'wininit.exe', or 'winlogon.exe'. Legitimate commands for these processes should not include suspicious parameters or unexpected behavior patterns.

  - **Examine network connections:** Check for suspicious outbound connections from the affected system, especially to untrusted or unexpected IP addresses. Utilize Windows Firewall logs or other network monitoring tools to correlate the timing with the detected process spawning.

  - **Review host criticality:** If this alert is triggered on domain controllers or sensitive application servers, prioritize it higher due to the potential for severe impact on the broader network. Confirm the role of the host against the expected service configurations.

  - **Check for suspicious user activity:** Validate whether the user account associated with the spawned process has a legitimate reason to initiate a Remote Desktop session. Look for other signs of lateral movement or unusual authentication attempts in the logs.

  ### Prioritization

  Given that this alert emerges from an exploit targeting a critical vulnerability (CVE-2019-0708), the potential severity is high, especially if it occurs on critical systems like database or domain controllers. The likelihood of malicious abuse is elevated due to the attractiveness of exploiting RDP vulnerabilities for unauthorized access.

  ### Blind Spots and Assumptions

  The detection may be limited if process creation logs are not reliably collected or if the exploiting mechanism has been customized to hide its tracks. Legitimate remote administration activities could trigger this alert, particularly in corporations using RDP for legitimate purposes. A related detection that could strengthen overall coverage is monitoring for anomalous RDP connections or user session activity, enhancing the identification of unauthorized access attempts.

