title: Terminal Service Process Spawn
id: 1012f107-b8f1-4271-af30-5aed2de89b39
status: test
description: Detects a process spawned by the terminal service server process (this
  could be an indicator for an exploitation of CVE-2019-0708)
references:
- https://securingtomorrow.mcafee.com/other-blogs/mcafee-labs/rdp-stands-for-really-do-patch-understanding-the-wormable-rdp-vulnerability-cve-2019-0708/
author: Florian Roth (Nextron Systems)
date: 2019-05-22
modified: 2023-01-25
tags:
- attack.initial-access
- attack.t1190
- attack.lateral-movement
- attack.t1210
- car.2013-07-002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentCommandLine|contains|all:
    - '\svchost.exe'
    - 'termsvcs'
  filter_img:
    Image|endswith:
    - '\rdpclip.exe'
    - ':\Windows\System32\csrss.exe'
    - ':\Windows\System32\wininit.exe'
    - ':\Windows\System32\winlogon.exe'
  filter_null:
    Image:
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies when a process is spawned by the Terminal Services Server process (svchost.exe) specifically tied to Remote Desktop Protocol (RDP) activities. This behavior may indicate potential exploitation attempts of CVE-2019-0708, a critical wormable vulnerability in the Microsoft Remote Desktop Services. The attacker might aim to gain unauthorized remote access to systems, facilitating lateral movement within the network or deploying further malicious activities.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (T1190)**: The exploitation of a vulnerability to gain entry to a system.
  - **Lateral Movement (T1210)**: Utilizing the access gained to move across the network.

  The primary data sources for this rule will be process creation logs from Windows systems, where it is crucial to capture command-line arguments that indicate the spawning of processes related to Terminal Services.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process logs to identify instances where processes such as `rdpclip.exe`, `csrss.exe`, `wininit.exe`, or `winlogon.exe` have been spawned by `svchost.exe` to determine abnormal behavior.

  - **Analyze Command-Line Arguments**: Examine command-line arguments in the process creation logs for anomalous entries indicative of exploitation or unauthorized remote access attempts.

  - **Cross-reference Account Activity**: Look at user account activity logs to identify any unusual logins or session creations on the affected systems, particularly focusing on those originating from unexpected geographic locations.

  - **Check for Active RDP Sessions**: Review RDP session logs to detect any questionable connections, identifying any new or unfamiliar machines that have initiated RDP sessions post-detection.

  ### Prioritization
  The alert is deemed high priority due to the significant risk associated with exploiting CVE-2019-0708, which could lead to widespread compromise of systems within the network if not addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging for process creation events is not enabled across all endpoints. Additionally, the detection logic assumes that the process parent relationship remains intact, meaning other legitimate processes might unduly trigger false positives if behavior mimics that of RDP exploitation. It is essential for the organization to ensure comprehensive logging configurations to capture all relevant process creation events in order to reliably detect such exploit attempts.

