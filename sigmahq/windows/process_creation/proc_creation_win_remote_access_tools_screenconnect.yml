note: |
  ### Technical Context
  This detection rule identifies the execution of the ScreenConnect remote access tool, which can be leveraged by adversaries to establish command and control (C2) channels within compromised environments. Often used legitimately for desktop support, tools like ScreenConnect can also facilitate unauthorized remote access, allowing attackers to manipulate target systems without detection. The threat scenario typically involves an attacker gaining initial access through phishing or exploiting vulnerabilities, followed by using such remote access software to maintain persistence and conduct further malicious activities.

  The relevant MITRE ATT&CK tactics and techniques for this detection include *Command and Control* (TA0011) and specifically the use of *Application Layer Protocol* (T1071) and *Remote Access Tools* (T1219). Indicators of this activity may be found in process creation events which log the execution of applications on Windows systems.

  Primary data sources for this detection include:
  - Process creation events (Windows Event Logs),
  - Application logs specific to ScreenConnect,
  - Endpoint detection and response (EDR) telemetry that captures execution context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for instances of the ScreenConnect service being executed, focusing on the context of execution (e.g., user accounts and execution paths).
  - **Check for Unusual Network Traffic**: Inspect network traffic logs for outgoing connections to known ScreenConnect servers or atypical IP addresses, which may signal unauthorized remote access activity.
  - **Investigate System Integrity**: Examine the integrity of systems where ScreenConnect is detected, looking for signs of unauthorized changes or additional remote access tools being installed.
  - **Evaluate User Activity**: Monitor the accounts that executed the remote access tool, especially if associated with administrative privileges or unusual login times, to determine the legitimacy of the access.

  ### Prioritization
  The severity of this alert is medium as ScreenConnect can be used for legitimate support purposes; however, its use in an unexpected context may indicate potentially malicious behavior that necessitates further inquiry, particularly if unauthorized access is suspected.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if process execution logs are not properly captured, or if ScreenConnect is whitelisted in application control settings, leading to legitimate use cases being excluded from scrutiny. This detection logic assumes that any execution of the ScreenConnect application is suspicious; however, it does not differentiate between legitimate technical support actions and potential abuses. Required logs for this alert to function effectively include full Windows process creation logs, and the detection mechanism relies on accurate logging configurations to capture necessary execution details.

