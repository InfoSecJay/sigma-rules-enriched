title: Cmd.EXE Missing Space Characters Execution Anomaly
id: a16980c2-0c56-4de0-9a79-17971979efdd
status: test
description: |
  Detects Windows command lines that miss a space before or after the /c flag when running a command using the cmd.exe.
  This could be a sign of obfuscation of a fat finger problem (typo by the developer).
references:
- https://twitter.com/cyb3rops/status/1562072617552678912
- https://ss64.com/nt/cmd.html
author: Florian Roth (Nextron Systems)
date: 2022-08-23
modified: 2023-03-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:    # missing space before the /c
    CommandLine|contains:
    - 'cmd.exe/c'
    - '\cmd/c'          # just cmd/c would be prone to false positives
    - '"cmd/c'
    - 'cmd.exe/k'
    - '\cmd/k'          # just cmd/k would be prone to false positives
    - '"cmd/k'
    - 'cmd.exe/r'
    - '\cmd/r'          # just cmd/r would be prone to false positives
    - '"cmd/r'
  selection2:   # special cases verified via Virustotal Enterprise search
    CommandLine|contains:
    - '/cwhoami'
    - '/cpowershell'
    - '/cschtasks'
    - '/cbitsadmin'
    - '/ccertutil'
    - '/kwhoami'
    - '/kpowershell'
    - '/kschtasks'
    - '/kbitsadmin'
    - '/kcertutil'
  selection3:    # missing space after the /c
    CommandLine|contains:
    - 'cmd.exe /c'
    - 'cmd /c'
    - 'cmd.exe /k'
    - 'cmd /k'
    - 'cmd.exe /r'
    - 'cmd /r'
  filter_generic:
    CommandLine|contains:
    - 'cmd.exe /c '
    - 'cmd /c '
    - 'cmd.exe /k '
    - 'cmd /k '
    - 'cmd.exe /r '
    - 'cmd /r '
  filter_fp:
  - CommandLine|contains: 'AppData\Local\Programs\Microsoft VS Code\resources\app\node_modules'
  - CommandLine|endswith: 'cmd.exe/c .'
  - CommandLine: 'cmd.exe /c'
  condition: 1 of selection* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects anomalies in command line executions that lack the necessary space character before or after the `/c`, `/k`, or `/r` flags when invoking `cmd.exe`. This behavior may indicate an attacker attempting to obfuscate their activities or reflect careless errors made by an automated script. The likely objective of this technique is to execute commands surreptitiously, leading to potential system compromise or information theft. This aligns with the MITRE ATT&CK technique: **Command and Scripting Interpreter (Windows) - T1059.001**.

  The primary telemetry sources include Windows Security Event ID **4688**, which logs process creation events, and potentially Sysmon **Event ID 1**. If malicious, the security impact could range from command execution leading to further exploitation of the system to data exfiltration. Importantly, this detection alone does not confirm an attack; it merely indicates suspicious command execution which requires further investigation.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID **4688** for instances of `cmd.exe /c` without expected spaces. Focus on any associated user session IDs or process IDs that are non-standard for typical user executions.

  - **Analyze command line arguments:** Evaluate the full command line under investigation for unusual patterns or commands. Compare against legitimate administrative tasks, which typically would include more structured arguments (e.g., `cmd.exe /c <command>` that have spaced arguments).

  - **Cross-reference known attacks:** Look for flagged command line strings that match known malicious patterns, such as those listed in the detection rule (e.g., `/cpowershell`). Presence of such strings can indicate high-confidence malicious activity.

  - **Identify legitimate context:** Investigate context around common administrative tasks. For instance, users executing `cmd.exe` for legitimate purposes might frequently run commands like `cmd.exe /c ipconfig` or administrative scripts where proper space usage is adhered to.

  - **Correlate with other logs:** Check Sysmon Event ID **1** for additional context around the executed commands. Look for unusual parent process relationships which may indicate a malicious process spawning legitimate looking commands.

  ### Prioritization

  This alert should be treated as high severity due to the potential for misuse of system privileges combined with the likelihood that this technique is weaponized in various attack scenarios. Affected systems, particularly domain controllers or critical infrastructure, warrant immediate attention due to the risk of broad network impact should exploitation be confirmed.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of sufficient context in some logging configurations. Attackers may use space manipulation and alternative encoding to evade this detection, leading to potential misses. Legitimate activities, such as script errors during development or automated maintenance tasks, can also trigger this rule. Strengthening coverage can be achieved by integrating detections for known misuse of PowerShell (`T1059.001` and similar execution methods) which may be used in conjunction with or in place of CMD-based executions.

