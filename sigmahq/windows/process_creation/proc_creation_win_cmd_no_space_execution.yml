title: Cmd.EXE Missing Space Characters Execution Anomaly
id: a16980c2-0c56-4de0-9a79-17971979efdd
status: test
description: |
  Detects Windows command lines that miss a space before or after the /c flag when running a command using the cmd.exe.
  This could be a sign of obfuscation of a fat finger problem (typo by the developer).
references:
- https://twitter.com/cyb3rops/status/1562072617552678912
- https://ss64.com/nt/cmd.html
author: Florian Roth (Nextron Systems)
date: 2022-08-23
modified: 2023-03-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:    # missing space before the /c
    CommandLine|contains:
    - 'cmd.exe/c'
    - '\cmd/c'          # just cmd/c would be prone to false positives
    - '"cmd/c'
    - 'cmd.exe/k'
    - '\cmd/k'          # just cmd/k would be prone to false positives
    - '"cmd/k'
    - 'cmd.exe/r'
    - '\cmd/r'          # just cmd/r would be prone to false positives
    - '"cmd/r'
  selection2:   # special cases verified via Virustotal Enterprise search
    CommandLine|contains:
    - '/cwhoami'
    - '/cpowershell'
    - '/cschtasks'
    - '/cbitsadmin'
    - '/ccertutil'
    - '/kwhoami'
    - '/kpowershell'
    - '/kschtasks'
    - '/kbitsadmin'
    - '/kcertutil'
  selection3:    # missing space after the /c
    CommandLine|contains:
    - 'cmd.exe /c'
    - 'cmd /c'
    - 'cmd.exe /k'
    - 'cmd /k'
    - 'cmd.exe /r'
    - 'cmd /r'
  filter_generic:
    CommandLine|contains:
    - 'cmd.exe /c '
    - 'cmd /c '
    - 'cmd.exe /k '
    - 'cmd /k '
    - 'cmd.exe /r '
    - 'cmd /r '
  filter_fp:
  - CommandLine|contains: 'AppData\Local\Programs\Microsoft VS Code\resources\app\node_modules'
  - CommandLine|endswith: 'cmd.exe/c .'
  - CommandLine: 'cmd.exe /c'
  condition: 1 of selection* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential obfuscation techniques in command execution on Windows systems by monitoring command lines for instances where the `cmd.exe` command is improperly formatted. Specifically, it looks for instances where there is a missing space either before or after the `/c`, `/k`, or `/r` flags. This could signal an attempt by an attacker to execute malicious commands while avoiding standard detection mechanisms, leveraging typo-based obfuscation to hide intentions.

  The threat scenario often relates to attackers attempting to execute commands stealthily, focusing on activities such as privilege escalation, lateral movement, or executing malicious payloads. Such behavior can potentially be linked to families of attacks that leverage the command line for malicious purposes, emphasizing the need for continuous monitoring and analysis of process creation events. Relevant MITRE ATT&CK tactics and techniques associated with this detection include Execution (TA0002) and Command and Scripting Interpreter: Windows Command Shell (T1059.001).

  Primary data sources for this detection include process creation events from the Windows operating system. These logs will provide evidence of command execution patterns that may indicate potential malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze Windows process creation logs to identify instances of `cmd.exe` execution where the command line syntax shows a lack of space around flags—specifically `/c`, `/k`, or `/r`.

  - **Examine Command Arguments:** Look through the command arguments used with `cmd.exe` to identify anomalous sequences, particularly those listed in the special cases verified via VirusTotal, which could indicate abusive command execution by an attacker.

  - **Cross-reference with Known Good:** Compare the commands against a baseline of expected and known good commands to determine any outliers or deviations that warrant further investigation.

  - **Investigate User Context:** Determine the context in which these commands were executed, including the user account and privilege levels, to assess the potential threat posed by the execution of these unusual command line patterns.

  ### Prioritization
  Given the potential for attackers to exploit command line interfaces for critical actions such as executing arbitrary commands, the severity of this alert is high. The likelihood of misuse in enterprise environments justifies prompt investigation.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly in scenarios where command execution does not involve `cmd.exe` directly, yet still executes scripts or commands through other means (e.g., PowerShell). Furthermore, this rule assumes that command line obfuscation occurs consistently, which may not always be the case during a targeted attack. Accurate detection relies on comprehensive logging of process creation events; thus, if logging is not adequately configured, the effectiveness of this rule will be significantly diminished.

