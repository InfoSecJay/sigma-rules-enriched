title: Cmd.EXE Missing Space Characters Execution Anomaly
id: a16980c2-0c56-4de0-9a79-17971979efdd
status: test
description: |
  Detects Windows command lines that miss a space before or after the /c flag when running a command using the cmd.exe.
  This could be a sign of obfuscation of a fat finger problem (typo by the developer).
references:
- https://twitter.com/cyb3rops/status/1562072617552678912
- https://ss64.com/nt/cmd.html
author: Florian Roth (Nextron Systems)
date: 2022-08-23
modified: 2026-05-13
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:    # missing space before the /c
    CommandLine|contains:
    - 'cmd.exe/c'
    - '\cmd/c'          # just cmd/c would be prone to false positives
    - '"cmd/c'
    - 'cmd.exe/k'
    - '\cmd/k'          # just cmd/k would be prone to false positives
    - '"cmd/k'
    - 'cmd.exe/r'
    - '\cmd/r'          # just cmd/r would be prone to false positives
    - '"cmd/r'
  selection2:   # special cases verified via Virustotal Enterprise search
    CommandLine|contains:
    - '/cwhoami'
    - '/cpowershell'
    - '/cschtasks'
    - '/cbitsadmin'
    - '/ccertutil'
    - '/kwhoami'
    - '/kpowershell'
    - '/kschtasks'
    - '/kbitsadmin'
    - '/kcertutil'
  selection3:    # missing space after the /c
    CommandLine|contains:
    - 'cmd.exe /c'
    - 'cmd /c'
    - 'cmd.exe /k'
    - 'cmd /k'
    - 'cmd.exe /r'
    - 'cmd /r'
  filter_generic:
    CommandLine|contains:
    - 'cmd.exe /c '
    - 'cmd /c '
    - 'cmd.exe /k '
    - 'cmd /k '
    - 'cmd.exe /r '
    - 'cmd /r '
  filter_fp:
  - CommandLine|contains: 'AppData\Local\Programs\Microsoft VS Code\resources\app\node_modules'
  - CommandLine|endswith: 'cmd.exe/c .'
  - CommandLine: 'cmd.exe /c'
  - CommandLine: 'cmd /c'
  condition: 1 of selection* and not 1 of filter_*
falsepositives:
- Legitimate use of cmd.exe with no arguments e.g. via system("") in C to enable
  ANSI escape codes
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `cmd.exe` commands with no space before or after the `/c`, `/k`, or `/r` flags, indicating potential obfuscation or syntax errors rather than typical command execution. Attackers may leverage such anomalies to mask malicious command executions, aiming to execute processes for reconnaissance or other harmful activities. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Command and Scripting Interpreter: Windows Command Shell (T1059.001)**.

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688, which captures command line invocations. If malicious, the impact could extend to unauthorized access or system compromise. However, this detection alone does not confirm malicious activity; a benign usage scenario might involve legitimate scripts or applications misconfigured to generate such command lines.

  ### Investigation Steps

  - **Review process creation logs:** Filter for Security Event ID 4688 with command lines containing ‘cmd.exe/c’, ‘cmd.exe/k’, or ‘cmd.exe/r’ in the last hour to identify potential suspect executions.

  - **Identify high-confidence malicious indicators:** Look for command line arguments that include known tools or actions like `/cpowershell` or `/cwhoami` which could signal an attempt to leverage PowerShell or perform reconnaissance.

  - **Verify legitimate command usage:** Cross-reference command lines involving `cmd.exe` without additional command syntax errors to confirm regular applications, such as processes initiated by legitimate automation scripts or development tools.

  - **Assess command context:** Investigate the parent process of the identified commands in Event ID 4688 to determine if they were initiated by a trusted application (e.g., a system utility) or suspicious executable.

  - **Check for script execution artifacts:** If the command line suggests the execution of a script or batch file, inspect the associated file paths and creation timestamps in the Windows file system to ascertain unexpected file modifications or execution.

  ### Prioritization

  The severity of this alert is high due to the potential for exploitation impacting critical enterprise systems. The likelihood of abuse is considerable, especially as command execution anomalies are common in exploitation techniques. The behavior flagged is routinely weaponized in various attack vectors, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include disguising malicious command invocations using encoded strings or legitimate command patterns to bypass this detection. Reliable detection hinges on the accurate capturing of command line inputs in process creation events; misconfigurations could lead to missed detection. Legitimate activities may include automated scripts or software development tools running commands that inadvertently trigger the rule. A related detection to consider is monitoring for unusual script executions or PowerShell invocation patterns to strengthen overall coverage against execution threats.

