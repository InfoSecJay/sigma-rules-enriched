title: HackTool - CrackMapExec Process Patterns
id: f26307d8-14cd-47e3-a26b-4b4769f24af6
status: test
description: Detects suspicious process patterns found in logs when CrackMapExec
  is used
references:
- https://mpgn.gitbook.io/crackmapexec/smb-protocol/obtaining-credentials/dump-lsass
author: Florian Roth (Nextron Systems)
date: 2022-03-12
modified: 2023-02-13
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_lsass_dump1:
    CommandLine|contains|all:
    - 'tasklist /fi '
    - 'Imagename eq lsass.exe'
    CommandLine|contains:
    - 'cmd.exe /c '
    - 'cmd.exe /r '
    - 'cmd.exe /k '
    - 'cmd /c '
    - 'cmd /r '
    - 'cmd /k '
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_lsass_dump2:
    CommandLine|contains|all:
    - 'do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump'
    - '\Windows\Temp\'
    - ' full'
    - '%%B'
  selection_procdump:
    CommandLine|contains|all:
    - 'tasklist /v /fo csv'
    - 'findstr /i "lsass"'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects specific command-line patterns associated with the use of CrackMapExec, a tool frequently employed for credential dumping through the LSASS process. Attackers typically leverage this tool to gain unauthorized access to sensitive information, often targeting user credentials stored in memory. The relevant MITRE ATT&CK tactic is Credential Access, specifically Technique T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on specific command lines executed by `cmd.exe` and other related executables. If malicious, the security impact can be significant, as successful credential dumping can lead to further lateral movement and compromise of additional systems within the network. It is important to note that this detection does NOT confirm that an actual breach or credential theft has occurred; it merely highlights suspicious activity warranting further investigation.

  ### Investigation Steps

  - **Review command-line arguments**: Check for instances of `tasklist /fi 'Imagename eq lsass.exe'` or variations. Look for Event ID 4688 (Process Creation) and ensure the user running the command is an expected or legitimate administrator.

  - **Correlate with user and system context**: Verify if the user associated with the suspicious command belongs to administrative or security roles and if they had a valid business need for running the tool. Unexpected administrative logins or command execution should warrant higher scrutiny.

  - **Inspect for LSASS dumping attempts**: Look for `rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump` in command lines from Event ID 4688 to identify potential LSASS memory dumps. This is an established technique often used in credential harvesting.

  - **Identify other process patterns**: Analyze for `tasklist /v /fo csv` and `findstr /i "lsass"` in command lines. If found, ascertain if this was part of a legitimate administrative task or indicative of a method for gathering credential information.

  - **Audit the system environment**: Verify host roles and assess if the system is performing expected functions that require administrative access (i.e., Domain Controller vs. regular workstation). Systems performing unnecessary credential dumps should be escalated.

  - **Check for exfiltration artifacts**: Validate the presence of any temporary files created in `C:\Windows\Temp\` that may indicate unauthorized data access. Look for file creation times that coincide with the execution of the suspicious commands.

  ### Prioritization

  This alert should be classified as high severity due to the potential for significant impact on the security posture of the enterprise. The likelihood of malicious abuse is notably high, as tools like CrackMapExec are commonly associated with advanced persistent threats and lateral movement. Credential dumping is a widely weaponized tactic that can lead to further system compromises.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental configurations where verbose logging is disabled, potentially missing critical telemetry. Legitimate administrative activities, such as debugging or system administration tasks, may inadvertently trigger the alert. It is recommended to use this detection in conjunction with others, such as monitoring for abnormal logins (e.g., failed logon attempts or anomalous user behavior) to strengthen coverage against potential credential access attempts.

