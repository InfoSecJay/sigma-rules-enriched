title: HackTool - CrackMapExec Process Patterns
id: f26307d8-14cd-47e3-a26b-4b4769f24af6
status: test
description: Detects suspicious process patterns found in logs when CrackMapExec is
  used
references:
- https://mpgn.gitbook.io/crackmapexec/smb-protocol/obtaining-credentials/dump-lsass
author: Florian Roth (Nextron Systems)
date: 2022-03-12
modified: 2023-02-13
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_lsass_dump1:
    CommandLine|contains|all:
    - 'tasklist /fi '
    - 'Imagename eq lsass.exe'
    CommandLine|contains:
    - 'cmd.exe /c '
    - 'cmd.exe /r '
    - 'cmd.exe /k '
    - 'cmd /c '
    - 'cmd /r '
    - 'cmd /k '
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_lsass_dump2:
    CommandLine|contains|all:
    - 'do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump'
    - '\Windows\Temp\'
    - ' full'
    - '%%B'
  selection_procdump:
    CommandLine|contains|all:
    - 'tasklist /v /fo csv'
    - 'findstr /i "lsass"'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious process patterns commonly associated with the usage of CrackMapExec, a popular post-exploitation tool used by attackers to automate lateral movement across networks. CrackMapExec can manipulate various elements of the Windows environment, including credential dumping from the Local Security Authority Subsystem Service (LSASS) process, to facilitate unauthorized access.

  The attacker leveraging this tool typically aims to gain higher privileges or to compromise additional assets within the network following an initial breach. Using CrackMapExec enables attackers to exploit weak credentials and dwell within the network by moving laterally or escalating privileges efficiently.

  Relevant MITRE ATT&CK techniques include:
  - **Credential Access** (T1003)
  - **Credential Dumping** (T1003.001)

  The primary data sources for this detection are Windows process creation logs, which can reveal command line arguments indicating suspicious behavior, as well as additional telemetry from endpoint detection and response solutions that may capture process interactions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs that capture process creation events, focusing specifically on command lines associated with known CrackMapExec patterns, particularly those that reference `lsass.exe` and related dumping commands.

  - **Analyze User Activity**: Investigate accounts that executed the identified commands. Pay special attention to any administrative or high-privileged accounts that may exhibit signs of compromise or unauthorized use of CrackMapExec.

  - **Correlate Network Activity**: Check for unusual network connections from machines that executed the detected processes, particularly targeting SMB protocols or using credential access attempts against multiple hosts.

  - **Assess Security Monitoring Alerts**: Look into other alerts that may have triggered concurrently, which could indicate a broader attack pattern suggesting lateral movement or privilege escalation tactics being employed.

  ### Prioritization
  This alert is considered high severity due to the critical nature of credential dumping and the potential for extensive network compromise. If attackers successfully utilize CrackMapExec to escalate privileges or spread laterally, the impact could be significant, affecting the entire organization.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by gaps in logging configurations, particularly if Windows process creation logs are not being captured comprehensively across all endpoints. The detection logic assumes that any execution of the specified command patterns hints at malicious activity, which could lead to false positives if legitimate administrative tasks exhibit similar patterns. Ensuring appropriate logging settings in both endpoint and server environments is essential for the effective functioning of this alert.

