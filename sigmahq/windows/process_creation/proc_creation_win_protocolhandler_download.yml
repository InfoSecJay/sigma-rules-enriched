logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\protocolhandler.exe'
  - OriginalFileName: 'ProtocolHandler.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `ProtocolHandler.exe`, which is commonly leveraged by malicious actors to download files from external sources using protocols like FTP and HTTP/HTTPS. The likely attacker objective here is to obtain further attack tools, exfiltrate data, or introduce malware into the environment. This behavior falls under the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Use of System Binaries" (T1218).

  The primary telemetry sources are Windows process creation events, specifically focusing on the command line arguments of processes related to `ProtocolHandler.exe`. The security impact of this activity can be significant if malicious, leading to data breaches or deployment of ransomware. Importantly, this detection does not confirm that the file downloaded was malicious; legitimate use cases may also trigger the rule.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `ProtocolHandler.exe` executing. Note the command line arguments to determine if they contain suspicious URLs.

  - **Examine downloaded files:** Navigate to `%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE` and inspect recently downloaded files for unusual file types or signatures that may indicate malicious intent.

  - **Identify command line indicators:** Look specifically for command line patterns that include `ftp://`, `http://`, or `https://`. Indicator presence may suggest intentional docking to potentially malicious external resources.

  - **Correlate known benign behavior:** Evaluate if the usage of `ProtocolHandler.exe` is tied to any legitimate applications in your environment (e.g., legitimate application updates) that commonly download files.

  - **Review System event logs:** Check Sysmon Event ID 1 for `ProtocolHandler.exe` activities, which can provide additional context such as parent-child relationship with other processes, potentially highlighting anomalous execution patterns.

  - **Assess network activity logs:** Investigate firewall or proxy logs for outbound connections initiated by `ProtocolHandler.exe` during the times flagged by this detection. Unusual external DNS requests can substantiate a malicious workflow.

  ### Prioritization

  This alert has medium severity, as the affected systems may handle sensitive data and are commonly targeted for file downloads. While the likelihood of abuse is moderate, the behavior mimics legitimate activities, requiring careful analysis to differentiate between expected and malicious actions.

  ### Blind Spots and Assumptions

  Detection limits arise from potential legitimate use of `ProtocolHandler.exe` for valid software updates or file downloads, leading to false positives. Comprehensive log sources should be configured, as lacking either process creation or network telemetry may hinder detection efficacy. Additionally, familiar administrative tasks that involve downloading files could unintentionally trigger this alert. Companion detections related to network traffic anomalies or unusual file types in the cache may enhance overall defensive coverage.

