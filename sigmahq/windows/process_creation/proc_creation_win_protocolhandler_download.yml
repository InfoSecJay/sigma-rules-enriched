note: |
  ### Technical Context

  This Sigma rule detects the execution of `ProtocolHandler.exe`, specifically when it is used to download files from external sources via HTTP or FTP. This behavior is indicative of potential malicious activity, as attackers often utilize this method to bypass security controls and download payloads directly to the system. The relevant MITRE ATT&CK tactic is **Execution** with technique **T1218**.

  The primary telemetry sources are Windows process creation logs, particularly those capturing event IDs for executed processes and command line arguments. If this activity is malicious, it may lead to unauthorized file downloads, potentially compromising the system with malware. Importantly, this detection does not confirm the intent or the benign nature of the downloaded files merely based on the execution of `ProtocolHandler.exe`.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for `ProtocolHandler.exe` executions. Focus on the timestamp and the user context to identify any unusual activity.

  - **Analyze command line arguments**: Inspect the command line details for `ProtocolHandler.exe`. Look specifically for usage patterns containing `http://`, `https://`, or `ftp://`, which typically indicate the download of potentially harmful files.

  - **Confirm expected usage**: Identify legitimate uses of `ProtocolHandler.exe` on systems. Business applications or specific user actions that explicitly involve downloading from trusted sources can mitigate alert severity.

  - **Investigate cache behavior**: Check for newly created or modified files in the `%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE` directory during the same timeframe as the `ProtocolHandler.exe` execution. Look for unusual file types or unexpected filenames.

  - **Correlate with other processes**: Look for any preceding processes that may have led to the invocation of `ProtocolHandler.exe`. Unusual parent-child relationships, especially those involving command shells or scripts, could indicate malicious intent.

  ### Prioritization

  The alert severity is medium due to the potential impact on the affected system as file downloads can introduce malware. The likelihood of this behavior being malicious is moderate, considering attackers leverage similar techniques for downloading payloads. Downloads via `ProtocolHandler.exe` are not yet widely weaponized but may indicate a shift in attack vectors.

  ### Blind Spots and Assumptions

  Detection limitations could arise from environment-specific configurations that do not log process executions or command lines adequately. Legitimate activities, such as automated updates or controlled downloads from known sources, may trigger this alert without malicious intent. A related detection to strengthen coverage is monitoring for unusual outbound connection attempts from the affected system, which could further clarify intent behind the file downloads.

