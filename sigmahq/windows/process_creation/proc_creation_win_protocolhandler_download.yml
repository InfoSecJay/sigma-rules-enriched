logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\protocolhandler.exe'
  - OriginalFileName: 'ProtocolHandler.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of `ProtocolHandler.exe` to download files from network locations using specific protocols such as FTP, HTTP, or HTTPS. The presence of this behavior can indicate that an attacker might be leveraging the `ProtocolHandler.exe` executable for illicit downloads of malicious payloads or sensitive data, disguising their actions under a seemingly benign process. Adversaries may utilize this technique to bypass security measures, execute payloads, or retrieve information from external sources without raising immediate suspicion.

  In terms of the MITRE ATT&CK framework, this detection corresponds with the following tactics and techniques:
  - **Defense Evasion** (TA0005)
    - **T1218: Signed Binary Proxy Execution**: Utilizing a trusted executable to execute commands or download files can help attackers evade detection by security solutions.

  The primary telemetry sources that provide evidence for this detection are process creation logs, specifically focusing on events that detail the execution of `ProtocolHandler.exe`, alongside command line arguments that contain network URLs.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `ProtocolHandler.exe` execution, focusing on the command line arguments to identify any requests to external URLs that might indicate malicious activity.

  - **Examine Downloaded File Locations**: Check the `%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE` directory for any suspicious files downloaded using `ProtocolHandler.exe`, including verifying file hashes against known malicious indicators.

  - **Cross-Reference with Network Traffic**: Investigate outbound network traffic to determine if any connections to suspicious or unauthorized domains coincide with the execution of `ProtocolHandler.exe`. Look for abnormal traffic patterns involving the URLs observed in command line logs.

  - **Assess User Context**: Determine which user account executed `ProtocolHandler.exe` and evaluate their privilege level and recent activity to identify any anomalies or signs of compromise.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential for data exfiltration or the delivery of malicious payloads. While execution of `ProtocolHandler.exe` can be legitimate, its usage in conjunction with specific command line arguments raises the likelihood of malicious intent.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is that alerts may be missed if other means (like additional bypass techniques or tools) are used to download files without invoking `ProtocolHandler.exe`. The detection logic assumes that the command line invokes identifiable protocols, which attackers might obfuscate or alter. For the alert to function effectively, process creation logs must be enabled and retention policies configured to ensure the timely availability of relevant event data.

