title: HackTool - WSASS Execution
id: 589ac73f-8e12-409c-964e-31a2f5775ae2
status: experimental
description: |
  Detects execution of WSASS, a tool used to dump LSASS memory on Windows systems by leveraging WER's
  (Windows Error Reporting) WerFaultSecure.EXE to bypass PPL (Protected Process Light) protections.
references:
- https://github.com/TwoSevenOneT/WSASS
- https://www.zerosalarium.com/2025/09/Dumping-LSASS-With-WER-On-Modern-Windows-11.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-23
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wsass.exe'
  selection_hash:
    Hashes|contains: 'IMPHASH=32F5095C9BBDCACF28FD4060EB4DFC42'
  selection_cli:
        # change to |re|i after Sigma v2.0 release
        # plain string without quotation marks as it has to match for both ' and "
    CommandLine|re: (?i)\.exe[\"\']?\s+.{12,64}[\"\']?\s+\d{2,10}     # wsass.exe "path to werfaultsecure" lsass_pid
    CommandLine|contains: 'werfaultsecure'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_hktl_wsass/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of WSASS, a tool that retrieves LSASS memory by exploiting the Windows Error Reporting process (WerFaultSecure.EXE) to circumvent Protected Process Light (PPL) protections. The likely attacker objective is to extract sensitive credentials from LSASS memory, potentially allowing them to gain unauthorized access to systems or accounts. This behavior aligns with the MITRE ATT&CK technique for credential access known as "Credential Dumping" (T1003.001).

  The primary telemetry source for this alert is process creation events from Windows, specifically using Security Event ID 4688 or Sysmon Event ID 1. If malicious, the successful execution can lead to a severe security impact due to the compromise of sensitive credentials. It is crucial to note that this detection does NOT confirm that credential theft has occurred on its own; further investigation is required to validate the context of the behavior.

  ### Investigation Steps

  - **Verify process creation event:** Review Security Event ID 4688 or Sysmon Event ID 1 for wsass.exe execution. Check the `CommandLine` field for patterns matching `werfaultsecure` and unusual parameters indicating an LSASS dump.

  - **Examine parent process:** Identify the parent process of wsass.exe in the process creation events. Legitimate processes may include common user applications, whereas unexpected parent processes may indicate malicious activity.

  - **Investigate file hashes:** Cross-reference the hash associated with wsass.exe against known-good signatures. Look for occurrences of 'IMPHASH=32F5095C9BBDCACF28FD4060EB4DFC42' as a strong indicator of malicious execution.

  - **Evaluate command-line arguments:** Analyze the `CommandLine` field for anomalous command-line arguments that match the regex pattern provided in the rule. Look for unusual characters or lengths (e.g., 12 to 64 characters after ".exe").

  - **Monitor for related artifacts:** Check for artifacts related to credential dumping, such as unusual memory access patterns from other processes post-execution. Investigate for potential exfiltration of dumped LSASS memory.

  - **Assess host criticality:** Consider the criticality of the host executing wsass.exe. If it is a domain controller or a workstation with administrative privileges, prioritize this alert higher given the potential impact.

  ### Prioritization

  This alert should be treated with high severity due to the potential compromise of sensitive credentials from LSASS memory. Given that tools like WSASS are commonly weaponized in credential-stealing incidents, the likelihood of malicious abuse is significantly elevated, especially in high-value target environments.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate process manipulation or custom tools that behave similarly but are not identified specifically as wsass.exe. Reliable detection requires complete visibility into process creation logs (Event ID 4688 or Sysmon) and correct filtering to isolate events relevant to credential dumping activities. Legitimate activities that may trigger this alert include developers or security analysts debugging software that interfaces with the LSASS process. Related detections, such as those monitoring for suspicious process spawning chains, can reinforce coverage against this threat vector.

