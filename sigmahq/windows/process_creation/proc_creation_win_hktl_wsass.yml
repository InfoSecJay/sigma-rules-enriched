title: HackTool - WSASS Execution
id: 589ac73f-8e12-409c-964e-31a2f5775ae2
status: experimental
description: |
  Detects execution of WSASS, a tool used to dump LSASS memory on Windows systems by leveraging WER's
  (Windows Error Reporting) WerFaultSecure.EXE to bypass PPL (Protected Process Light) protections.
references:
- https://github.com/TwoSevenOneT/WSASS
- https://www.zerosalarium.com/2025/09/Dumping-LSASS-With-WER-On-Modern-Windows-11.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-23
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wsass.exe'
  selection_hash:
    Hashes|contains: 'IMPHASH=32F5095C9BBDCACF28FD4060EB4DFC42'
  selection_cli:
        # change to |re|i after Sigma v2.0 release
        # plain string without quotation marks as it has to match for both ' and "
    CommandLine|re: (?i)\.exe[\"\']?\s+.{12,64}[\"\']?\s+\d{2,10}     # wsass.exe "path to werfaultsecure" lsass_pid
    CommandLine|contains: 'werfaultsecure'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_hktl_wsass/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of WSASS, a tool designed to dump memory from the LSASS (Local Security Authority Subsystem Service) process on Windows systems. By exploiting Windows Error Reporting (WER) through `WerFaultSecure.EXE`, attackers can bypass Protected Process Light (PPL) protections, making this a stealthy technique for credential theft. The successful execution of WSASS typically indicates an attempt by attackers to extract sensitive credentials from memory, which can subsequently be used for lateral movement or privilege escalation within the targeted environment.

  The primary MITRE ATT&CK tactic this rule addresses is **Credential Access**, specifically under the technique **T1003.001: LSASS Memory**. This technique shows how attackers can exploit Windows mechanisms to acquire sensitive information, and WSASS leverages legitimate Windows processes to accomplish its goals covertly. The most relevant data sources for this detection include process creation logs from Windows, which will capture the invocation of `wsass.exe` and the details of any command-line arguments used.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Gather process creation events from your endpoint detection solution. Look specifically for entries related to `wsass.exe` execution, including the command line arguments utilized.

  - **Review Command-Line Arguments**: Analyze the command-line parameters associated with any detected instances of `wsass.exe`. Pay attention to any processes referencing `werfaultsecure` and the LSASS process IDs, as these will indicate possible credential dumping activities.

  - **Correlate with Other Logs**: Cross-reference the findings with Windows Security Event Logs or Sysmon logs if available. Check for unusual parent-child process relationships that might suggest privilege escalation or abuse of process hierarchies.

  - **Investigate User Context**: Determine the user account under which `wsass.exe` was executed. Consider whether this account has authorized access or if it is indicative of a compromised user identity.

  ### Prioritization
  This alert is classified as high severity due to the critical nature of the credentials potentially exposed during the execution of WSASS. Unauthorized credential dumping can lead to increased risk of lateral movement, data breaches, and significant operational impacts for the organization.

  ### Blind Spots and Assumptions
  The detection logic may not cover scenarios where WSASS is executed through non-standard means or where the tool is disguised under a different name, which might evade detection. Assumptions include the need for accurate logging of process creation events and command-line arguments; therefore, proper configurations must be ensured in the endpoint security solutions. Additionally, environments lacking comprehensive logging or those with minimal monitoring could miss instances of WSASS use altogether, potentially resulting in a gap in detection coverage.

