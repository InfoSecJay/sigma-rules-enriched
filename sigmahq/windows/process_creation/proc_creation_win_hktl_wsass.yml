title: HackTool - WSASS Execution
id: 589ac73f-8e12-409c-964e-31a2f5775ae2
status: experimental
description: |
  Detects execution of WSASS, a tool used to dump LSASS memory on Windows systems by leveraging WER's
  (Windows Error Reporting) WerFaultSecure.EXE to bypass PPL (Protected Process Light) protections.
references:
- https://github.com/TwoSevenOneT/WSASS
- https://www.zerosalarium.com/2025/09/Dumping-LSASS-With-WER-On-Modern-Windows-11.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-23
modified: 2026-01-09
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wsass.exe'
  selection_hash:
    Hashes|contains: 'IMPHASH=32F5095C9BBDCACF28FD4060EB4DFC42'
  selection_cli:
        # change to |re|i after Sigma v2.0 release
        # plain string without quotation marks as it has to match for both ' and "
    CommandLine|re: 
      (?i)\.exe[\"\']?\s+[^\"]{0,64}werfaultsecure\.exe[\"\']?\s+\d{2,10}                   # wsass.exe "path to werfaultsecure" lsass_pid
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_hktl_wsass/info.yml
note: |
  ### Technical Context

  This rule detects the execution of WSASS, a tool utilized for dumping LSASS memory on Windows systems by exploiting the Windows Error Reporting (WER) service. The attacker’s objective is to extract sensitive credentials stored in memory, which may lead to further system compromise. This activity aligns with the MITRE ATT&CK framework under the tactic Credential Access and the technique Credential Dumping (T1003.001). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, or Sysmon Event ID 1 for process creation events in relation to the WSASS tool. If this behavior is malicious, it may lead to unauthorized access and data compromise. However, this detection does NOT confirm that credential dumping occurred, as legitimate use of WER could potentially trigger this alert.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for `wsass.exe`. Look for the command line containing `werfaultsecure.exe` and associated LSASS PID; legitimate use should not normally execute this combination.

  - **Correlate with network activity**: Analyze network logs for unusual outbound connections from the host running WSASS. Use firewall logs to check for connections made shortly after the appearance of the WSASS process, which may indicate credential exfiltration.

  - **Analyze command line arguments**: Inspect the command line field for `werfaultsecure.exe` specifically. Legitimate usage typically will not show a pattern where `werfaultsecure.exe` is run with an LSASS process ID parameter in this way.

  - **Identify indicators of compromise**: Look for the specific hash value `IMPHASH=32F5095C9BBDCACF28FD4060EB4DFC42` in the logs related to the WSASS execution. This hash represents a known signature for WSASS, indicating a potentially malicious executable.

  - **Monitor for related artifacts**: Validate the creation of memory dump files (e.g., `.dmp` files) on impacted systems in the temporary directories. The presence of such files, following the execution of WSASS, further indicates credential dumping activity.

  ### Prioritization

  This alert is of high severity due to its potential to compromise sensitive credentials from critical systems. Given the method employed, an attacker could exploit this technique effectively, and such behavior aligns with widely seen credential dumping tactics.

  ### Blind Spots and Assumptions

  The detection may be evaded if attackers utilize alternate methods or tools with similar objectives that do not invoke WSASS directly. Log sources such as Windows Error Reporting may need specific configuration to ensure complete monitoring. Legitimate administrative tasks using `werfaultsecure.exe` could generate similar alerts. Related detections could include monitoring for unusual parent-child process relationships involving `lsass.exe` to strengthen coverage against credential dumping events.

