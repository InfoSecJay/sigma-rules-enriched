note: |
  ### Technical Context

  This Sigma rule detects the execution of the `Xwizard.EXE` tool with the "RunWizard" command line flag, specifically when it includes a GUID-like argument. This behavior can be used by attackers to execute custom COM objects that are defined in the Windows registry, potentially enabling malicious payloads to run. The likely objective of the attacker is to exploit legitimate processes for executing arbitrary code, commonly for persistence or lateral movement.

  The relevant MITRE ATT&CK technique is **Execution through COM Objects (T1218)**. Primary telemetry sources include process creation logs from Windows, specifically Security Event ID **4688** or Sysmon Event ID **1**, which highlight new process creation activities along with arguments used. If malicious, this activity can lead to code execution outside of typical user behavior patterns. However, this detection does NOT confirm malicious intent on its own, as there are legitimate uses for `Xwizard.EXE` in administrative contexts.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID **4688** or Sysmon Event ID **1** for `Xwizard.EXE` execution, focusing on the command line for "RunWizard" and any associated GUIDs. Look for similar executions within a short time frame, which may indicate automation or scripting.

  - **Validate GUID format:** Verify the presence of a GUID-like argument in the command line. Legitimate use typically involves well-known administrative tasks, whereas unfamiliar or random GUIDs could indicate malicious intent.

  - **Analyze parent process relationships:** Use Sysmon Event ID **1** to identify the parent process of `Xwizard.EXE`. Malicious executions often have parent processes like `powershell.exe`, `cmd.exe`, or remote process invocations, distinguishing them from standard administrative invocations.

  - **Review registry modifications:** Investigate recent changes in the registry associated with COM objects. Use **Windows Registry logs** or relevant Sysinternals tools to verify any newly created or modified COM objects, which may correspond to the execution of the detected `Xwizard.EXE`.

  - **Correlate with user behavior:** Assess user activity around the time of the alert. If the user is engaged in administrative tasks or script executions, this may indicate benign use, whereas an unexpected execution without context may suggest a security incident.

  ### Prioritization

  This alert should be treated with medium severity. The impact can be significant if the affected system is critical, as successful exploitation could lead to unauthorized code execution. The likelihood of malicious abuse is moderate, given the common usage of `Xwizard.EXE` in various administrative tools and user scripts, yet the behavior is not frequently weaponized in a straightforward manner.

  ### Blind Spots and Assumptions

  Detection may be evaded by renaming malicious binaries or utilizing different execution techniques that avoid using `Xwizard.EXE`. Reliable detection relies on proper logging configurations for process creation and registry modifications. Legitimate scenarios can include software installations or administrative tasks that invoke `Xwizard.EXE`. A companion detection mechanism could include monitoring for unusual registry changes related to COM objects that are invoked by the detected process.

