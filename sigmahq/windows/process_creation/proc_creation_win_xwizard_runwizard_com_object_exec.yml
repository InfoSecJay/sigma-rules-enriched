note: |
  ---

  ### Technical Context

  This rule detects the execution of the Xwizard utility with the "RunWizard" flag, specifically when initiated with an argument resembling a GUID. This behavior is often indicative of an adversary utilizing the tool to instantiate malicious COM objects created in the Windows registry, potentially to execute payloads and maintain persistence. The primary MITRE ATT&CK tactic is **Defense Evasion** and the relevant technique is **T1218: Signed Binary Proxy Execution**.

  The key telemetry sources for this rule are Windows process creation logs, specifically monitoring for command line arguments associated with the execution of Xwizard. If malicious, this behavior could allow a threat actor to execute arbitrary code or maintain control on target systems. Importantly, this detection does NOT confirm that any compromise has occurred, as there may be legitimate uses for Xwizard.

  ---

  ### Investigation Steps

  - **Verify command line arguments:** Review the process creation log for Security Event ID 4688. Search for parent processes leading to Xwizard execution that match the pattern `RunWizard {GUID}`. Assess whether the GUID format is appropriately matched.

  - **Identify parent process:** Cross-reference the parent process of Xwizard execution. Typical benign usages involve legitimate applications. If the parent is an unusual or suspicious process (e.g., cmd.exe or PowerShell), escalate for deeper inspection.

  - **Check execution frequency:** Analyze the process execution frequency in the past 30 days by correlating with Event ID 4688. Unusual spikes, particularly from non-administrative accounts, warrant further investigation.

  - **Look for related registry changes:** Monitor for registry keys created or modified related to COM objects, specifically under `HKEY_CLASSES_ROOT\CLSID\{GUID}`. Detection of such changes linked to Xwizard usage can indicate malicious intent.

  - **Explore user activity logs:** Investigate user activity via Windows Security logs (Event ID 4624) to validate whether the user account triggered the Xwizard execution during regular business hours or under expected circumstances.

  - **Identify common benign usage:** Determine if .NET installation or legitimate Office applications have executed Xwizard as part of their standard operations. Historical usage context is crucial to understanding whether this instance is hostile.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact of unauthorized execution of COM objects, which can lead to significant security breaches. The likelihood of malicious abuse is high, as the Xwizard tool is known for being weaponized in various attacks. Given its indirect method of execution, it warrants careful examination but should not escalate immediately without further context.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use modified or alternate tools that do not trigger the same command line flags. It requires that the process creation logs are fully collected and parsed to ensure detection reliability. Legitimate instances may occur during software deployment or updates, invoking Xwizard without malicious intent. Companion detections should include monitoring for unusual registry key changes (e.g., associated with COM objects), which can corroborate findings related to this alert.

