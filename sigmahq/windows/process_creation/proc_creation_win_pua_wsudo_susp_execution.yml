title: PUA - Wsudo Suspicious Execution
id: bdeeabc9-ff2a-4a51-be59-bb253aac7891
status: test
description: Detects usage of wsudo (Windows Sudo Utility). Which is a tool that let
  the user execute programs with different permissions (System, Trusted Installer,
  Administrator...etc)
references:
- https://github.com/M2Team/Privexec/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-02
modified: 2023-02-14
tags:
- attack.execution
- attack.privilege-escalation
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_metadata:
  - Image|endswith: '\wsudo.exe'
  - OriginalFileName: 'wsudo.exe'
  - Description: 'Windows sudo utility'
  - ParentImage|endswith: '\wsudo-bridge.exe'
  selection_cli:
    CommandLine|contains:
    - '-u System'
    - '-uSystem'
    - '-u TrustedInstaller'
    - '-uTrustedInstaller'
    - ' --ti '
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of **wsudo**, a utility that allows users to execute processes under different Windows permissions, such as those of the System, Trusted Installer, or Administrator. The use of wsudo could indicate an attempt to escalate privileges or execute malicious commands that require elevated permissions, making it a key area of concern for security monitoring in any enterprise environment. Attackers may leverage such tools to bypass normal security controls and execute hidden commands or install malicious payloads.

  The relevant MITRE ATT&CK tactics and techniques include **Execution (TA0002)**, as wsudo can be used to run processes; **Privilege Escalation (TA0004)**, since it can shift the execution context to a more privileged account; and specifically, **Command and Scripting Interpreter: Windows Command Shell (T1059.003)**, as absconding with elevated permissions may involve executing commands through shell interpreters. The primary data sources for monitoring this activity are **process creation events**, which provide insight into which executables are running and under what conditions they are initiated.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances where `wsudo.exe` and `wsudo-bridge.exe` are invoked. Look for anomalies in file paths and parent processes.
  - **Inspect Command Line Arguments**: Evaluate the command line arguments associated with wsudo executions. Specifically, look for the presence of `-u System`, `-u TrustedInstaller`, or similar arguments that suggest an attempt to escalate privileges.
  - **Correlate with User Context**: Check the user account that executed the wsudo command. Determine if this account typically has permissions to run such commands or if the access appears abnormal for the given user role.
  - **Identify Related Activities**: Investigate if there are any other suspicious activities around the same timeframe, such as unauthorized changes to files or services that may corroborate potential malicious use of wsudo.

  ### Prioritization
  The alert is categorized as high severity due to the significant implications of privilege escalation in an enterprise environment. Unauthorized use of tools like wsudo can lead to complete system compromise, elevated access for attackers, and potential exfiltration of sensitive data.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly if wsudo is executed through scripts or if monitoring for process creation logs is not configured correctly across all endpoints. This detection assumes that the `wsudo` utility is being utilized in a manner consistent with known patterns. Additionally, it relies on existing logs from the process creation events, which must be enabled in the Windows environment for effective monitoring and detection.

