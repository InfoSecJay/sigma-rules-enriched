logsource:
  category: process_creation
  product: windows
detection:
  selection_metadata:
  - Image|endswith: '\wsudo.exe'
  - OriginalFileName: 'wsudo.exe'
  - Description: 'Windows sudo utility'
  - ParentImage|endswith: '\wsudo-bridge.exe'
  selection_cli:
    CommandLine|contains:
    - '-u System'
    - '-uSystem'
    - '-u TrustedInstaller'
    - '-uTrustedInstaller'
    - ' --ti '
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances of the `wsudo` utility, which allows users to execute processes with elevated permissions, such as those belonging to the System or Trusted Installer accounts. Attackers may use `wsudo` to facilitate privilege escalation or execute arbitrary commands with elevated rights on compromised systems, potentially leading to further system compromise or lateral movement. The relevant MITRE ATT&CK tactic is Execution, specifically the technique T1059 (Command-Line Interface).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If malicious, the use of `wsudo` could indicate a significant security breach, as it allows attackers to bypass standard access controls. This detection does NOT confirm that the action is malicious on its own, as `wsudo` may also be employed for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify the process creation logs:** Check Security Event ID 4688 for the creation of `wsudo.exe` and its parent process `wsudo-bridge.exe`. Look for `CommandLine` parameters that include `-u System` or `-u TrustedInstaller`. Legitimate instances are typically run by authorized scripts or admin accounts rather than anomalous user accounts.

  - **Investigate command-line arguments:** Confirm the command line used to execute `wsudo`. Look for arguments containing `-u System` or `-u TrustedInstaller`, indicating elevated execution. An unexpected command line usage may suggest malicious intent.

  - **Evaluate the user account associated:** Analyze the user account under which `wsudo.exe` is executed. If a non-admin or standard user executes it, this could indicate malicious behavior. Compare against known legitimate administrative account usage.

  - **Review Sysmon logs:** Examine Sysmon Event ID 10 (Process Termination) to identify if `wsudo` was invoked and subsequently terminated. Check the process handle for additional context of subsequent commands executed after elevation.

  - **Assess the system impact:** Determine the criticality of the affected system (e.g., domain controller, file server) to gauge potential impact. Investigate further if `wsudo` vanquished processes owned by critical system services.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of privilege escalation on critical systems and the likelihood of malicious abuse. The behavior of using `wsudo` is highly weaponized among adversaries aiming to escalate their privileges and execute malicious tasks on compromised systems.

  ### Blind Spots and Assumptions

  Detection may be limited by operational use of `wsudo` for legitimate administrative tasks, potentially generating false positives. Furthermore, ensure that complete Windows Process Creation logs and Sysmon configurations are enabled for effective detection. Legitimate applications that require elevated privileges may trigger alerts, underscoring the need for analyst discretion. A companion detection for this rule would involve monitoring for instances of suspicious command-line executions within PowerShell or CMD, amplifying the detection coverage related to privilege escalation activities.

