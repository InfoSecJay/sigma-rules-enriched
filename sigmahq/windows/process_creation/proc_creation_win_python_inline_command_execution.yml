title: Python Inline Command Execution
id: 899133d5-4d7c-4a7f-94ee-27355c879d90
status: test
description: Detects execution of python using the "-c" flag. This is could be 
  used as a way to launch a reverse shell or execute live python code.
references:
- https://docs.python.org/3/using/cmdline.html#cmdoption-c
- https://www.revshells.com/
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
modified: 2025-10-07
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'python.exe'
  - Image|endswith:
    - 'python.exe'           # no \ bc of e.g. ipython.exe
    - 'python3.exe'
    - 'python2.exe'
  selection_cli:
    CommandLine|contains: ' -c'
  filter_main_python_1:   # Based on baseline
    ParentImage|startswith:
    - 'C:\Program Files\Python'
    - 'C:\Program Files (x86)\Python'
    ParentImage|endswith: '\python.exe'
    ParentCommandLine|contains: '-E -s -m ensurepip -U --default-pip'
  filter_main_python_trace:   # Based on baseline
    ParentImage|startswith:
    - 'C:\Program Files\Python'
    - 'C:\Program Files (x86)\Python'
    CommandLine|contains|all:
            # CommandLine: \"C:\\Program Files\\Python312\\python.exe\" -W ignore::DeprecationWarning -c \"\nimport runpy\nimport sys\nsys.path = ['C:\\\\Users\\\\User\\\\AppData\\\\Local\\\\Temp\\\\tmpdakwn6aj\\\\pip-23.2.1-py3-none-any.whl'] + sys.path\nsys.argv[1:] = ['install', '--no-cache-dir', '--no-index', '--find-links', 'C:\\\\Users\\\\User\\\\AppData\\\\Local\\\\Temp\\\\tmpdakwn6aj', '--upgrade', 'pip']\nrunpy.run_module(\\\"pip\\\", run_name=\\\"__main__\\\", alter_sys=True)\n\
    - '-W ignore::DeprecationWarning'
    - "['install', '--no-cache-dir', '--no-index', '--find-links',"
    - "'--upgrade', 'pip'"
  filter_optional_vscode:
  - ParentImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  - ParentImage:
    - 'C:\Program Files\Microsoft VS Code\Code.exe'
    - 'C:\Program Files (x86)\Microsoft VS Code\Code.exe'
  filter_optional_pip:
    CommandLine|contains|all:
    - '<pip-setuptools-caller>'
    - 'exec(compile('
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Python libraries that use a flag starting with "-c". Filter according to your 
  environment
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_python_inline_command_execution/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of Python commands using the "-c" flag, which allows direct execution of Python code. This behavior could indicate an attacker attempting to run malicious scripts, potentially for actions like establishing reverse shells or executing unexpected commands within the environment. The relevant MITRE ATT&CK tactic is **Execution** (T1059), and the technique is **Command and Scripting Interpreter**.

  The primary telemetry sources include Windows process creation logs (e.g., Security Event ID 4688) and Sysmon Event ID 1, focusing on command lines that contain the "-c" flag. If malicious, this behavior could lead to unauthorized access or data exfiltration. Notably, this detection alone does not confirm malicious intent—further investigation is required to establish context and intent.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for processes where `OriginalFileName` is `python.exe`, `python3.exe`, or `python2.exe` and `CommandLine` includes `-c`. Analyze the execution path and user context associated with these processes.

  - **Identify Legitimate Uses:** Compare the command line against known benign usage patterns from Python within your organization (e.g., legitimate automation scripts) to differentiate between expected versus suspicious executions.

  - **Investigate Parent Processes:** Validate the `ParentImage` of the detected processes. Ensure that they are not spawned from legitimate applications, e.g., `C:\Program Files\Python\python.exe`, or examine if they originate from unexpected sources, which may indicate misuse.

  - **Look for Signs of Malicious Activity:** If the command line indicates complex operations with parameters typically aligned with shell commands or network-related actions, such as `exec(compile(` or `--upgrade`, this may signify an attempt to install unapproved packages or scripts. This is a high-confidence malicious indicator.

  - **Analyze Network Activity:** Cross-reference detected executions with network logs to identify any outbound connections initiated by processes that utilized the Python `-c` flag. Unexpected connections, especially to non-whitelisted IPs, may signify exfiltration attempts.

  - **Review Application Whitelisting Policies:** Ensure that your Python installations and scripts are properly managed and that any changes to whitelisting policies or executed commands are logged and reviewed in the context of this behavior.

  ### Prioritization

  This alert should be treated with medium priority. The impact could vary based on the system affected; a server hosting sensitive data could experience significant consequences if compromised. The likelihood of malicious abuse is moderate, as the execution of Python scripts is common in both legitimate and malicious contexts, and many adversaries leverage command execution techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by environment-specific Python processes that utilize the "-c" flag legitimately, potentially generating false positives. This depends on comprehensive logging settings for process creation and Sysmon. Additionally, various Python libraries may invoke scripts using such flags without malicious intent. A companion detection, such as monitoring for unusual outbound network connections (T1071), can strengthen coverage against potential exploit scenarios stemming from Python command executions.

