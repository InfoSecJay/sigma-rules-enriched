title: Python Inline Command Execution
id: 899133d5-4d7c-4a7f-94ee-27355c879d90
status: test
description: Detects execution of python using the "-c" flag. This is could be 
  used as a way to launch a reverse shell or execute live python code.
references:
- https://docs.python.org/3/using/cmdline.html#cmdoption-c
- https://www.revshells.com/
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
modified: 2025-10-07
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'python.exe'
  - Image|endswith:
    - 'python.exe'           # no \ bc of e.g. ipython.exe
    - 'python3.exe'
    - 'python2.exe'
  selection_cli:
    CommandLine|contains: ' -c'
  filter_main_python_1:   # Based on baseline
    ParentImage|startswith:
    - 'C:\Program Files\Python'
    - 'C:\Program Files (x86)\Python'
    ParentImage|endswith: '\python.exe'
    ParentCommandLine|contains: '-E -s -m ensurepip -U --default-pip'
  filter_main_python_trace:   # Based on baseline
    ParentImage|startswith:
    - 'C:\Program Files\Python'
    - 'C:\Program Files (x86)\Python'
    CommandLine|contains|all:
            # CommandLine: \"C:\\Program Files\\Python312\\python.exe\" -W ignore::DeprecationWarning -c \"\nimport runpy\nimport sys\nsys.path = ['C:\\\\Users\\\\User\\\\AppData\\\\Local\\\\Temp\\\\tmpdakwn6aj\\\\pip-23.2.1-py3-none-any.whl'] + sys.path\nsys.argv[1:] = ['install', '--no-cache-dir', '--no-index', '--find-links', 'C:\\\\Users\\\\User\\\\AppData\\\\Local\\\\Temp\\\\tmpdakwn6aj', '--upgrade', 'pip']\nrunpy.run_module(\\\"pip\\\", run_name=\\\"__main__\\\", alter_sys=True)\n\
    - '-W ignore::DeprecationWarning'
    - "['install', '--no-cache-dir', '--no-index', '--find-links',"
    - "'--upgrade', 'pip'"
  filter_optional_vscode:
  - ParentImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  - ParentImage:
    - 'C:\Program Files\Microsoft VS Code\Code.exe'
    - 'C:\Program Files (x86)\Microsoft VS Code\Code.exe'
  filter_optional_pip:
    CommandLine|contains|all:
    - '<pip-setuptools-caller>'
    - 'exec(compile('
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Python libraries that use a flag starting with "-c". Filter according to your 
  environment
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Python commands using the `-c` flag, which allows execution of Python code via the command line. Attackers may exploit this to launch reverse shells, execute malicious scripts, or perform live code execution remotely. The rule maps to the MITRE ATT&CK tactic of Execution (TA0002) and specifically targets the technique T1059 - Command and Scripting Interpreter.

  The primary telemetry source for this rule is process creation logs on Windows systems, particularly Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it may lead to unauthorized access, data exfiltration, or system compromise. This detection does NOT confirm that all use of the `-c` flag is malicious; legitimate scripts and administrative tasks may trigger the alert.

  ---

  ### Investigation Steps

  - **Review the command line arguments:**
    - Check for any instances of `python.exe`, `python3.exe`, or `python2.exe` along with the `-c` flag in Security Event ID 4688 or Sysmon Event ID 1 logs.

  - **Identify high-confidence malicious indicators:**
    - Look for command lines that contain suspicious or obfuscated Python code, particularly if they appear to reference external hosts or include netcat or reverse shell commands.

  - **Analyze the parent process:**
    - Investigate the ParentImage field to confirm the legitimacy of the parent process. For valid usages, expect parents to be legitimate Python installations, e.g., `C:\Program Files\Python\python.exe`.

  - **Correlate with expected usage patterns:**
    - Review documentation or communication from development teams. Legitimate uses of the `-c` flag often follow predictable patterns, such as standard library imports for web scraping or data manipulation tasks that do not involve suspicious external connections.

  - **Monitor for potential user context abuse:**
    - Check logs for execution by privileged accounts. Malicious activities often involve higher privileges to bypass user restrictions, thus warranting further scrutiny.

  - **Validate for file creation/exfiltration artifacts:**
    - If associated with file operations, check for unusual file access or changes in temporary or suspicious directories (e.g., `C:\Users\<User>\AppData\Local\Temp`) through File System events (Windows Event ID 4663).

  ---

  ### Prioritization

  This alert holds medium severity in an enterprise context as it indicates a potentially unauthorized execution of commands that could lead to data compromise. The likelihood of malicious abuse is significant given the usage of a well-known scripting interpreter for potentially executing harmful code, especially if accompanied by anomalous patterns related to user behavior.

  ---

  ### Blind Spots and Assumptions

  Detection validity relies on appropriately configured logging sources such as Sysmon for complete coverage of command-line arguments. Legitimate applications, especially development environments or automated update scripts, could trigger this alert if they invoke Python with the `-c` flag. Companion detections, like monitoring for use of Python libraries that could indicate malicious exploitation of standard packages (e.g., the use of pip to install backdoors), can strengthen overall security coverage.

