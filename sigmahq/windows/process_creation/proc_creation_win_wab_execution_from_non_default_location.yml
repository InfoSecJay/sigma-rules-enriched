detection:
  selection:
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\WinSxS\'
    - 'C:\Program Files\Windows Mail\'
    - 'C:\Program Files (x86)\Windows Mail\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `wab.exe` (Windows Contacts) and `wabmig.exe` (Microsoft Address Book Import Tool) from non-default locations. This behavior is indicative of potential misuse or malicious activity, specifically associated with the Bumblebee loader, which often attempts to execute payloads from unusual directories to evade detection.

  The relevant MITRE ATT&CK tactic is "Execution" (TA0002) with a focus on the technique "User Execution" (T1203). The primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1). If malicious, this activity could lead to unauthorized access or control over the affected systems. It is crucial to note that this detection does NOT confirm malicious intent on its own; it simply indicates suspicious execution patterns that warrant further investigation.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for details on the process execution events, specifically for `wab.exe` and `wabmig.exe` with unusual parent processes or command line arguments. Record the parent process and the user context under which the process was executed.

  - **Assess file location:** Verify the file path from which `wab.exe` and `wabmig.exe` were executed. Legitimate execution typically occurs from `C:\Windows\WinSxS\`, `C:\Program Files\Windows Mail\`, or `C:\Program Files (x86)\Windows Mail\`. Any execution from alternate locations should be reviewed with suspicion.

  - **Evaluate user context:** Identify the user who executed the process. Cross-reference against typical user roles. Unauthorized execution by non-administrative users or unusual accounts should be flagged for further analysis.

  - **Analyze command line arguments:** Inspect command line parameters associated with the executed processes. Look for unusual or obfuscated arguments that may suggest obfuscation or malicious intent, such as references to unusual file paths or external URLs.

  - **Investigate parent process activity:** Investigate events preceding the execution. Review process creation events leading to `wab.exe` or `wabmig.exe`. Focus on command lines or recent activities of parent processes that may hint at how this execution was initiated.

  ---

  ### Prioritization

  This alert should be considered high-severity due to its association with known malicious activity linked to the Bumblebee loader. The potential impact on the affected system is significant, as it may lead to further compromise, data exfiltration, or lateral movement within the network. Given that this technique is weaponized by attackers, prompt investigation is essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may obfuscate execution pathways to avoid triggering this alert. Ensuring collection of complete process creation logs (including command line arguments) is crucial for reliable detection. Legitimate administrative activities or user-authorized tasks may also trigger this alert, such as IT support downloading tools for maintenance. A related detection rule focusing on process anomalies might complement this coverage and enhance detection fidelity.

