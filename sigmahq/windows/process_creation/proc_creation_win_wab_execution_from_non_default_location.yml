title: Wab Execution From Non Default Location
id: 395907ee-96e5-4666-af2e-2ca91688e151
status: test
description: Detects execution of wab.exe (Windows Contacts) and Wabmig.exe 
  (Microsoft Address Book Import Tool) from non default locations as seen with 
  bumblebee activity
references:
- https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/bumblebee-loader-cybercrime
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2022-09-27
tags:
- attack.execution
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\WinSxS\'
    - 'C:\Program Files\Windows Mail\'
    - 'C:\Program Files (x86)\Windows Mail\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `wab.exe` (Windows Contacts) and `Wabmig.exe` (Microsoft Address Book Import Tool) from non-default locations, which is often indicative of a Bumblebee malware operation. The likely attacker objective is to gain persistence or execute other malicious payloads by leveraging legitimate Windows applications from unexpected directories. This behavior aligns with the MITRE ATT&CK technique Execution (T1203) within the tactic of Execution.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the observed execution is malicious, it may lead to unauthorized access or data exfiltration. However, this detection does NOT confirm that the execution is definitively malicious without further context or supporting evidence.

  ### Investigation Steps

  - **Review process execution logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for instances of `wab.exe` or `Wabmig.exe`. Note the “New Process Name” field to confirm the execution path. Legitimate executions typically originate from `C:\Windows\System32\` or related system directories.

  - **Analyze associated parent process:** Identify the parent process of the suspicious instance by reviewing the "Process ID" and "Parent Process ID." If the parent is a known benign application (e.g., a user-initiated task), this indicates legitimate use; if it is an unexpected or system-level process, further investigation is warranted.

  - **Check for processes from non-standard locations:** Investigate the file path of `wab.exe` or `Wabmig.exe`. Legitimate usage originates from `C:\Windows\System32\`, while execution from custom directories (e.g., `C:\Users\<User>\AppData\Local\Temp\`) is suspicious.

  - **Validate file signatures:** Use tools to verify the digital signatures of `wab.exe` or `Wabmig.exe`. Legitimate executables will have well-known vendors (e.g., Microsoft). Unsigned or oddly signed versions may indicate compromise.

  - **Correlate with other logs:** Cross-reference with other log sources like Windows Defender alerts or EDR telemetry to identify potential lateral movement or other malicious behaviors associated with this execution.

  ### Prioritization

  This alert is high priority due to its potential impact on sensitive systems, such as those involved in user administration. The execution of these applications from unusual locations is a known vector for exploitation, making it a realistic and concerning indication of malicious activity commonly associated with Bumblebee tactics.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to obfuscate their efforts by renaming or modifying legitimate binaries. Reliable detection requires proper configurations of Windows Event Logging and Sysmon to capture all relevant process creation events. Legitimate activities that may trigger this alert include automated scripts or system management tools that invoke these executables from custom locations. A companion detection to consider is monitoring for unusual parent processes associated with these executables, which may enhance detection capabilities.

