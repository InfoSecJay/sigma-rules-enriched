title: Wab Execution From Non Default Location
id: 395907ee-96e5-4666-af2e-2ca91688e151
status: test
description: Detects execution of wab.exe (Windows Contacts) and Wabmig.exe (Microsoft
  Address Book Import Tool) from non default locations as seen with bumblebee activity
references:
- https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/bumblebee-loader-cybercrime
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2022-09-27
tags:
- attack.defense-evasion
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\WinSxS\'
    - 'C:\Program Files\Windows Mail\'
    - 'C:\Program Files (x86)\Windows Mail\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `wab.exe` (Windows Contacts) and `wabmig.exe` (Microsoft Address Book Import Tool) from non-default locations, which may indicate malicious activity associated with the BumbleBee malware framework. BumbleBee is exploited to gain unauthorized access to systems, often leveraging benign applications to execute attacks while evading standard defenses. The attackers may use these processes to blend in with legitimate activity, ultimately aiming to steal credentials, gain persistence, or escalate privileges within the environment.

  Relevant MITRE ATT&CK tactics include **Execution** (T1203, Exploitation of Remote Services) and **Defense Evasion** (T1070, Indicator Removal on Host). The primary data sources for this detection are process creation events logged by the Windows operating system, which provide insights into executed binaries, their origins, and the context of their execution paths.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigators should examine process creation logs around the detected execution time of `wab.exe` and `wabmig.exe`, focusing on any anomalies related to their launch paths.
  - **Correlate Related Activities:** Check for any additional suspicious activity or system changes that occurred around the time of the detection, such as system logins, access to sensitive files, or changes to user privileges.
  - **Analyze Windows Event Logs:** Specifically, focus on Windows Event IDs related to process creation (ID 4688) to gather contextual information about the execution events and the user who initiated them.
  - **Check for Distinct Persistence Mechanisms:** Investigate registry entries and task scheduler for any abnormal entries that may indicate an attempt to establish persistence using the identified processes.

  ### Prioritization
  This alert has a high severity due to the potential impact of unauthorized access and the luring effect of malware like BumbleBee, which can provide attackers with severe footholds within enterprise environments. Given that these binaries are typically benign, their execution from non-standard paths indicates a higher likelihood of the presence of malicious activity.

  ### Blind Spots and Assumptions
  There may be detection gaps where similar processes executed from legitimate locations could be overlooked. This rule assumes that `wab.exe` and `wabmig.exe` are not being specially utilized for legitimate purposes in the environment and that proper logging is enabled for process creation events. If logging is not comprehensive or correctly configured, there may be missed incidents that could signify similar malicious behavior.

